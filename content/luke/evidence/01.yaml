chapter: 1
claims:
  - where: setting
    claim: 'Luke is named three times in the New Testament and wrote the Gospel and Acts'
    key: bd-luke
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/luke?lang=eng'
    quote: 'Mentioned three times in the New Testament (Col. 4:14; 2 Tim. 4:11; Philem. 1:24). He was also the writer of the third Gospel and of the Acts.'
  - where: setting
    claim: 'The “we” passages of Acts make Luke Paul’s fellow traveler'
    key: bd-luke
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/luke?lang=eng'
    quote: 'In all passages in the latter book in which the first person plural is used (Acts 16:10), we can assume that Luke was Paul’s fellow-traveler.'
  - where: setting
    claim: 'Born of Gentile parents; when and where the Gospel was written is uncertain; written for Gentile readers'
    key: bd-luke
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/luke?lang=eng'
    quote: 'He was born of gentile parents and practiced medicine. … It is uncertain when or where the Gospel was written; it was specially intended for gentile readers.'
  - where: setting
    claim: 'The JST titles the book “The Testimony of St. Luke”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'JST entitles this book “The Testimony of St. Luke.”'
  - where: setting
    claim: 'A date between AD 70 and 80 fits the circumstantial evidence best'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/the-message-and-context-of-lukes-testimony'
    quote: 'On balance, it seems that a date between AD 70 and 80 settles most easily within the evidence, all of which is circumstantial.'
  - where: setting
    claim: 'The infancy narrative’s main purpose is that Jesus was the Son of God from His conception; the opening chapters are an overture to the Gospel'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'these opening chapters nonetheless serve as “Gospel overtures,” setting forth the major themes and motifs … Thus while the major purpose of Luke’s infancy narrative is to stress that Jesus was actually the Son of God from the moment of his conception'
  - where: setting
    claim: 'Luke opens in the temple, one of the most sacred spots on earth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Thus, Luke opens his story at one of the most sacred spots on earth, thereby breathing into his story an air of holiness.'
  - where: when
    claim: 'Herod the Great died in the spring of 4 BC'
    key: sc-knowhy-255
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-help-date-the-first-christmas'
    quote: 'The year 4 BC is considered the latest possible date because Herod the Great died in the spring of that year, meaning the Savior must have been born sometime before then (Matthew 2; Luke 1:5).'
  - where: thread
    claim: 'Luke frames the story by contrasts, first between Zacharias’s and Mary’s responses'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Luke further frames his story through other contrasts, not only those that we see, say, between the responses of Zacharias and Mary to the angel’s visits'
  - where: thread
    claim: 'The blameless priest in the holy city doubts; God finds faith in a young woman in Nazareth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: '“blameless” but unbelieving (1:6). By contrast, God finds faith in a young woman far removed from the holy sanctuary and its city—Mary in Nazareth (see 1:38, 45).'
  - where: thread
    claim: 'By the chapter’s end the home of Zacharias and Elisabeth has become a holy place too'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'By the end of chapter 1, the home of Zacharias and Elisabeth has also become a place of spiritual power and illumination, complementing the temple’s hallowed character.'
  - where: thread
    claim: 'The angel’s visit cut off the priest’s prayer; he finishes it at his son’s naming'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'The angel’s visit interrupts the service and prevents Zacharias from offering the priestly prayer. Now, in naming his son, he finally finishes the task of offering his prayer'
  - where: section 1 plain
    claim: '“Most surely believed” is, in Greek, “which have been fulfilled”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'GR which have been fulfilled.'
  - where: section 3 plain
    claim: '“Cousin” is “relative” in Greek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'GR relative (not necessarily a cousin).'
  - where: section 6 plain
    claim: '“Dayspring” is “dawn” in Greek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'GR dawn; see Mal. 4:2.'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'JST 1:1 begins “As I am a messenger of Jesus Christ”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'JST Luke 1:1 As I am a messenger of Jesus Christ, and knowing that many have …'
  - where: 'note 1:5 “A priest of the eighth course”'
    claim: 'David established 24 courses; Abia was the eighth'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'These 24 courses were established by King David (see 1 Chronicles 24:3–19); Abiah was the eighth of the 24 courses (vs. 10).'
  - where: 'note 1:5 “A priest of the eighth course”'
    claim: 'Between their service, priests lived and worked among the people'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'When not conducting their priestly obligations with the fellow priests of their course, they lived and worked throughout Judea and Galilee with the rest of the people.'
  - where: 'note 1:5 “A priest of the eighth course”'
    claim: 'A priest had to prove literal descent from Aaron'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'The essential requirement was a proper lineage — Zacharias had to prove he was a literal descendant of Aaron.'
  - where: 'note 1:5 “A priest of the eighth course”'
    claim: 'Both Zacharias and Elisabeth were Levites descended from Aaron'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'John’s parents, Zacharias and Elisabeth, were of the tribe of Levi and were also descendants of the family of Aaron (see Luke 1:5).'
  - where: 'note 1:9 “Once in a lifetime”'
    claim: 'The third lot chose the priest to burn incense in the Holy Room, essentially once in a lifetime'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'It was to select the priest who would enter the Holy Room and burn incense on the Inner Altar. … This meant that this was essentially a once-in-a-lifetime opportunity. It is even possible that a priest could serve his entire life and never be selected.'
  - where: 'note 1:9 “Once in a lifetime”'
    claim: 'Only newcomers drew the lot for the incense'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'the Supervisor of Lots called out, “Newcomers only! Whoever has never once offered the incense, let him come and draw lots.”'
  - where: 'note 1:9 “Once in a lifetime”'
    claim: 'Zacharias entered the Holy Room, not the Holy of Holies'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'Zacharias entered the Holy Room that stood before the Holy of Holies — only the high priest could enter the latter room, which had no altar.'
  - where: 'note 1:9 “Once in a lifetime”'
    claim: 'The people outside prostrated themselves toward the temple while the incense was offered'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: '“the whole multitude of the people [in the Priests’ Courtyard and Court of Israel] were praying without at the time of incense” (Luke 1:10), have prostrated themselves in the direction of the temple.'
  - where: 'note 1:9 “Once in a lifetime”'
    claim: 'Priests sometimes tarried briefly to pray; Zacharias’s delay went beyond it'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'It was not uncommon for the priests to tarry briefly after offering the incense to say a silent, personal prayer of thanksgiving before leaving, although this was not a requirement of the service.'
  - where: 'note 1:9 “Once in a lifetime”'
    claim: 'The rising incense symbolized Israel’s united prayer, which the priest represented'
    key: mcconkie-special-witnesses
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/special-witnesses-birth-christ'
    quote: 'In the performance of this duty, Zacharias represented the combined faith of Israel. His prayer was their prayer … The ascending flames of incense symbolized the ascension of that united prayer.'
  - where: 'note 1:13 “Which prayer was heard”'
    claim: 'Joseph Smith: Zacharias went to the temple to obtain the promise of a son'
    key: jsp-discourse-1843-07-23-burgess
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-23-july-1843-as-reported-by-james-burgess/2'
    quote: 'Zachariah having no children, knew that the promise of God must fail, consequently he went into the Temple to wrestle with God according to the order of the preisthood to obtain a promise of a son'
  - where: 'note 1:13 “Which prayer was heard”'
    claim: 'The promise was that the priesthood would continue with Aaron’s seed'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'The Lord promised Zacharias that he should have a son who was a descendant of Aaron, the Lord having promised that the priesthood should continue with Aaron and his seed throughout their generations.'
  - where: 'note 1:15 “Set apart from birth”'
    claim: 'No wine or strong drink is part of the Nazarite vow; John may have been a Nazarite from birth'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'Gabriel instructed Zacharias that John “shall drink neither wine nor strong drink” (Luke 1:15), one aspect of a Nazarite’s vow. A Nazarite was separated from the masses and consecrated for service to the Lord … The instructions of Gabriel implied that John may have been consecrated to God with a Nazarite vow from his birth.'
  - where: 'note 1:15 “Set apart from birth”'
    claim: 'The leap in the womb fulfilled the promise that he would be filled with the Holy Ghost from the womb'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'John “leaped in her womb” for joy at the sound of Mary’s voice (Luke 1:41), fulfilling Gabriel’s prophecy—that he would be “filled with the Holy Ghost, even from his mother’s womb” (Luke 1:15).'
  - where: 'note 1:17 “The spirit and power of Elias”'
    claim: 'Elias is the Greek form of Elijah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'This spelling represents the Greek rendering of the Hebrew name “Elijah” because Greek does not put an “h” sound in the middle or at the end of a word.'
  - where: 'note 1:17 “The spirit and power of Elias”'
    claim: 'The angel quotes Malachi 4:6; the spirit and power can rest on others than Elijah, John among them'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'The angel reveals that this “spirit and power” can rest on persons other than Elijah, who, according to prophecy, is to “turn the heart of the fathers to the children” (Mal. 4:6). One of those persons is John (see Matt. 17:10–13; D&C 27:7).'
  - where: 'note 1:17 “The spirit and power of Elias”'
    claim: 'Elias is a title for a forerunner; two Eliases, a preparer and a restorer'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: '(2) Elias is also a title for one who is a forerunner; for example, John the Baptist … These passages are sufficiently clarified to show that anciently two Eliases were spoken of, one as a preparer and the other a restorer.'
  - where: 'note 1:17 “The spirit and power of Elias”'
    claim: 'John, a type of Elijah, was the first of the ancient messengers to Joseph Smith and Oliver Cowdery'
    key: sc-knowhy-591
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-quote-malachi-about-elijahs-coming'
    quote: 'The first to come was John the Baptist—himself a type of Elijah during his mortal ministry (Matthew 11:12–14; 17:10–12; Mark 9:11–13; Luke 1:17).'
  - where: 'note 1:17 “The spirit and power of Elias”'
    claim: 'John restored the lesser priesthood to Joseph Smith and Oliver Cowdery in 1829'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'Joseph Smith declared that John personally visited him and Oliver Cowdery (see D&C 27:7; Joseph Smith—History 1:68–72), restoring the lesser priesthood and its keys to them in 1829'
  - where: 'note 1:19 “Who Gabriel is”'
    claim: 'Gabriel means “man of God”; sent to Daniel, Zacharias and Mary'
    key: bd-gabriel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gabriel?lang=eng'
    quote: 'Man of God. The name of an angel sent to Daniel (Dan. 8:16; 9:21); to Zacharias (Luke 1:11–19); and to Mary (Luke 1:26–38).'
  - where: 'note 1:19 “Who Gabriel is”'
    claim: 'Joseph Smith: Noah is Gabriel and stands next to Adam in priesthood authority'
    key: jsp-discourse-1839-a
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-4-august-1839-a-as-reported-by-unidentified-scribe/1'
    quote: 'he is Michael the Archangel spoken of in the scriptures— Then to Noah who is Gabriel he stands next in authority to Adam, in the preasthood, he was called of God to this office.'
  - where: 'note 1:19 “Who Gabriel is”'
    claim: 'The title Elias is applied to Noah or Gabriel'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'The title Elias has also been applied to many others for specific missions or restorative functions that they are to fulfill; for example, John the Revelator (D&C 77:14) and Noah or Gabriel (Luke 1:11–20; D&C 27:6–7).'
  - where: 'note 1:20 “Why Zacharias was struck dumb”'
    claim: 'Zacharias’s question doubts; Mary’s asks how'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Mary’s question, which shows that she is thinking clearly and possesses courage in the presence of a heavenly messenger, differs from that of Zacharias, whose question expresses doubt that the angel’s prophecy can be fulfilled. Mary’s query focuses on the means by which she will conceive.'
  - where: 'note 1:20 “Why Zacharias was struck dumb”'
    claim: 'Joseph Smith: struck dumb because of unbelief'
    key: jsp-discourse-1843-07-23-burgess
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-23-july-1843-as-reported-by-james-burgess/2'
    quote: 'when the Angel told him that his promise was granted he because of unbelief was struck dumb.'
  - where: 'note 1:20 “Why Zacharias was struck dumb”'
    claim: 'He could not hear either, as the signs in 1:62 show'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Zacharias’ dire situation is compounded, evidently by the angel, by his inability to hear, which is plain from his later exchange with his neighbors about the name of his son (see 1:62–63, and the Note on 1:62; compare Alma 30:49–52).'
  - where: 'note 1:20 “Why Zacharias was struck dumb”'
    claim: 'A blameless priest doubts in the most sacred room'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Hence, within the most sacred room on earth known to Luke, a “blameless” official of God’s priesthood expresses his doubt about God’s power (1:6, 18–20).'
  - where: 'note 1:20 “Why Zacharias was struck dumb”'
    claim: 'He stayed through his week of service, a sign of faithfulness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'For Luke says that he remains at the temple through “the days of his ministration” (1:23), a remarkable example of faithfulness to his priesthood duties.'
  - where: 'note 1:20 “Why Zacharias was struck dumb”'
    claim: 'He starts badly but succeeds'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Even though he starts badly, he succeeds marvelously.'
  - where: 'note 1:25 “The reproach of barrenness”'
    claim: 'A barren woman was thought to have offended God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'The common wisdom is that a barren woman has offended God. For years, Elisabeth lives under this suspicion from others and under her own cloud of doubt about herself'
  - where: 'note 1:25 “The reproach of barrenness”'
    claim: 'Hiding herself may point to intensified spiritual effort'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'It is just as possible that this expression points to her intensified spiritual efforts to show her worthiness before God and to remain steadfastly by the side of her now impaired husband'
  - where: 'note 1:25 “The reproach of barrenness”'
    claim: 'The matriarchs were barren too'
    key: sc-knowhy-705
    url: 'https://scripturecentral.org/knowhy/why-are-childless-women-prominent-in-the-christmas-story'
    quote: 'many stories of prominent women in the Old Testament—including the three great matriarchs Sarah, Rebekah, and Rachel—begin with a similar problem. Although each of them was barren (Genesis 11:29–30; 18:11; 25:20–21; 29:28, 31; Judges 13:2; 1 Samuel 1:1–2; 2 Kings 4:14)'
  - where: 'note 1:25 “The reproach of barrenness”'
    claim: 'The miraculous pregnancies were signs that God fulfills His promises'
    key: sc-knowhy-705
    url: 'https://scripturecentral.org/knowhy/why-are-childless-women-prominent-in-the-christmas-story'
    quote: 'The miraculous pregnancies of these women were signs to all Israel and all the world that God can indeed fulfill his promises in time, as well as eternity.'
  - where: 'note 1:28 “Favoured with grace”'
    claim: 'charitoō in Luke 1:28: to compass with favor, honor with blessings'
    key: thayer
    url: 'https://biblehub.com/greek/5487.htm'
    quote: '2. to pursue with grace, compass with favor; to honor with blessings: τινα, Ephesians 1:6; passive, Luke 1:28'
  - where: 'note 1:28 “Favoured with grace”'
    claim: 'charitoō is formed from charis'
    key: thayer
    url: 'https://biblehub.com/greek/5487.htm'
    quote: 'χαριτόω, χαρίτω: 1 aorist ἐχαριτωσα; perfect passive participle κεχαριτωμένος; (χάρις);'
  - where: 'note 1:35 “How shall this be?”'
    claim: 'Overshadow (episkiazō) means to shade and to protect'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'The verb translated “to overshadow” (Greek episkiazō) basically means “to shade.” But it also bears the sense “to protect,” as it does here'
  - where: 'note 1:35 “How shall this be?”'
    claim: 'The scriptures are similarly reserved about the means'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Notably, other passages that speak of the means by which Mary conceives are similarly vague (see Matt. 1:20; 1 John 5:1; 1 Ne. 11:18–20; Alma 7:10).'
  - where: 'note 1:35 “How shall this be?”'
    claim: 'Mary asks about the means'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Mary’s query focuses on the means by which she will conceive.'
  - where: 'note 1:35 “How shall this be?”'
    claim: 'The sonship in Luke 1–2 is literal'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'God’s declaration that Jesus is His son is understood to be literal as recorded in Luke 1-2.'
  - where: 'note 1:43 “Elisabeth’s witness”'
    claim: 'Elisabeth knew without being told'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Elisabeth’s words eliminate any possibility that, as they meet, Mary has earlier disclosed anything about her recent experience with the angel.'
  - where: 'note 1:43 “Elisabeth’s witness”'
    claim: 'The unborn John’s response brought the Spirit to Elisabeth'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'John’s Spirit-filled response engendered the promptings of the Holy Ghost in Elisabeth.'
  - where: 'note 1:43 “Elisabeth’s witness”'
    claim: 'Elisabeth acts as herald of the Messiah, as her son will'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'In fact, in speaking about Mary, “the mother of my Lord,” Elisabeth acts as her own son will act—as the herald of the Messiah.'
  - where: 'note 1:43 “Elisabeth’s witness”'
    claim: 'Elisabeth is the first witness of the virgin birth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'It becomes clear that, with these words, Elisabeth stands as the first witness of the virgin birth.'
  - where: 'note 1:43 “Elisabeth’s witness”'
    claim: '“She that believed” sets Mary’s response against Zacharias’s'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Elisabeth’s statement underscores the difference between her husband’s response to the angel and Mary’s (see 1:20, 38; the Note on 1:18).'
  - where: 'note 1:46 “Mary’s song”'
    claim: 'The Magnificat resembles Hannah’s prayer and is carried by contrasts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Besides the obvious similarities to Hannah’s prayer, which commentators often point to (see 1 Sam. 2:1–10), Mary’s Magnificat is borne along by vivid contrasts and by exalted language which connects directly to her son.'
  - where: 'note 1:46 “Mary’s song”'
    claim: '“Low estate of his handmaiden” echoes the Septuagint of Hannah’s prayer'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'The expression is very similar to the Septuagint version of the prayer of Hannah in 1 Samuel 1:11, “the humiliation of thy handmaid.”'
  - where: 'note 1:46 “Mary’s song”'
    claim: '“Handmaid” is bondservant'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Mary sees herself as God’s bondservant, perhaps even as his slave who does his bidding for the rest of her life.'
  - where: 'note 1:46 “Mary’s song”'
    claim: 'The song sets the tone of the Gospel: mercy to the poor and lowly'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'For it will be a story of God’s mercy, first and foremost—a mercy that will succor the poor and downtrodden and will be withdrawn from those who do not fear God.'
  - where: 'note 1:46 “Mary’s song”'
    claim: '“Saviour” is rare in the Gospels; in Mary’s mouth it means a deliverer of Israel; it broadens at 2:11'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'it is surprisingly rare in the New, especially in the Gospels, where it appears twice in Luke and only once in John. … Given the context and the Old Testament models—such as the song of Hannah—for the Magnificat, the meaning here is no doubt consonant with Jewish thought and expectation, namely of a national and perhaps, by extension, spiritual deliverer.'
  - where: 'note 1:46 “Mary’s song”'
    claim: 'The meaning broadens when the angel uses it to the shepherds'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'The meaning of the term broadens, however, the second time it is used in Luke, this time in the mouth of a heavenly witness when the angel announces to the shepherds'
  - where: 'note 1:59 “Named and ordained on the eighth day”'
    claim: 'The name was revealed, not a family name, and means “Jehovah is gracious”'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'Rather than receiving a family name, his name was revealed as John (see Luke 1:13, 59–63), meaning “Jehovah is gracious,”'
  - where: 'note 1:59 “Named and ordained on the eighth day”'
    claim: 'The ordination of D&C 84:28 was to his mission, not to the priesthood, which came by birthright'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'At this time, John also was “ordained” by an angel, presumably Gabriel, to his mission … This was not, however, an ordination to the priesthood because the Levitical Priesthood came as a birthright with responsibilities beginning at the age of twenty-five or thirty (see Numbers 4:3; 8:23–26).'
  - where: 'note 1:69 “A horn of salvation”'
    claim: 'A reading: the horn may recall the raised corners of the altars of sacrifice and incense'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Second, the horn may symbolize strength, such as a strong animal that grows a horn (see Ezek. 1:10; Rev. 4:7). … Fourth, the horn may exhibit obvious links to the raised corners of the altar of sacrifice and altar of incense at the temple.'
  - where: 'note 1:69 “A horn of salvation”'
    claim: 'The Benedictus is full of temple language, as from a priest'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Temple connections run deep in Zacharias’ exalted words. Of course, we expect such language from a priest.'
  - where: 'note 1:69 “A horn of salvation”'
    claim: 'Remission of sins recalls the purpose of the daily burnt offering'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'The fact that the priest’s son John will lead people to a “remission of their sins” brings to mind the purpose of the whole burnt offering which is sacrificed twice daily (see 1:69, 72, 74–77).'
  - where: 'note 1:78 “The dawn from on high”'
    claim: 'anatolē: a rising of the sun or stars, in Luke 1:78'
    key: thayer
    url: 'https://biblehub.com/greek/395.htm'
    quote: '1. a rising (of the sun and stars); light rising ἐξ ὕψους, Luke 1:78.'
  - where: 'note 1:78 “The dawn from on high”'
    claim: 'The Septuagint also uses the word for the messianic Branch; “from on high” points to God’s throne'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'But in the Septuagint, the term also refers to a growing shoot of a plant (see LXX Jer. 23:5; Zech. 6:12). Hence, a radiant cloud of messianic meanings presents itself … the prepositional phrase “from on high” effectively points to God’s throne as the place of origin of these blessings.'
  - where: 'note 1:78 “The dawn from on high”'
    claim: 'Verse 79 rests on Isaiah 9:2'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'The scriptural text that lies beneath these words is Isaiah 9:2, a passage that, in later Christian interpretation and in modern scripture, is said to anticipate the triumphal coming of Jesus into the spirit prison to free the spirits of the dead from darkness'
  - where: 'note 1:78 “The dawn from on high”'
    claim: 'Light is a symbol of salvation here'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'he concludes by stating that his son, John, would “give knowledge of salvation unto his people” (1:77) and “give light to them that sit in darkness” (1:79), light being a symbol here of salvation.'
  - where: 'note 1:80 “In the deserts until his showing”'
    claim: 'Where John lived is unknown; he did not serve as a temple priest'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'It is not possible to say where exactly John spends this time, whether on the east bank or west bank of the Jordan River. … It is evident that he does not follow in the footsteps of his father—he does not become a functioning priest who serves at the temple.'
  - where: 'note 1:80 “In the deserts until his showing”'
    claim: '“Shewing” is his commissioning and public appearance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'First, it has to do with John’s commissioning, his formal “installation” as he begins his ministry. Second, it points to his future public appearance, his “manifestation,” as part of the revelation from God to his people.'
  - where: 'note 1:80 “In the deserts until his showing”'
    claim: '“The child grew” recalls Samuel'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-1-104'
    quote: 'Luke’s summary recalls the words written about the youthful Samuel in 1 Samuel 2:21 (“the child Samuel grew before the Lord”) and 3:19 (“Samuel grew, and the Lord was with him”).'
  - where: 'note 1:80 “In the deserts until his showing”'
    claim: 'Joseph Smith: when John took up his priesthood he came out of the wilderness preaching'
    key: jsp-discourse-1843-07-23-burgess
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-23-july-1843-as-reported-by-james-burgess/2'
    quote: 'And when the set time was come John came forth and when he took up his preisthood, he came bounding out of the wilderness saying repent ye for the kingdom of heaven is at hand'
  - where: christ
    claim: 'The Atonement made resurrection a reality and eternal life possible for all who obey'
    key: nelson-christ-savior-born
    url: 'https://www.churchofjesuschrist.org/study/new-era/2006/12/christ-the-savior-is-born?lang=eng'
    quote: 'His Atonement made the Resurrection a reality and the gift of eternal life a possibility for all who would obey His teachings.'
  - where: christ
    claim: 'Born of an immortal Father and a mortal mother, He inherited the power to live forever and physical death'
    key: nelson-christ-savior-born
    url: 'https://www.churchofjesuschrist.org/study/new-era/2006/12/christ-the-savior-is-born?lang=eng'
    quote: 'Jesus was born of an immortal Father and a mortal mother. From His immortal Father, Jesus inherited the power to live forever. From His mortal mother He inherited the fate of physical death.'
  - where: explore
    claim: 'The Tamid article follows Zacharias from his entry into the priesthood to the angel’s appearance'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'This essay follows Zacharias’ biography from entering the priesthood till the day the angel Gabriel appeared to him.'
  - where: 'note 1:9 “Once in a lifetime”'
    claim: 'A friend or relative entered with the priest to pour the incense into his hands, then withdrew'
    key: brown-tamid
    url: 'https://interpreterfoundation.org/journal/tamid-zacharias-and-the-second-temple'
    quote: 'the friend or relative would enter with the Kohen [priest], to assist him by pouring the incense from the spoon into his cupped hands'
  - where: 'note 1:32 “Son of the Highest, heir of David”'
    claim: 'The footnote to verse 33 joins the endless reign to the promise to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: '2 Sam. 7:16; Isa. 9:7 (6–7).'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'The “many” surely include Mark, possibly Matthew and other accounts outside the canon'
    key: farnes-synoptic-gospels
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/synoptic-gospels'
    quote: 'Luke tells us first that “many” have already attempted to write such Gospels. Here he is undoubtedly referencing Mark and could also be referring to Matthew. It is also possible that Luke is referring to other Gospels or sources not presently in the New Testament canon'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'Luke does not disparage his predecessors; he means to add to them'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'There is no tone of disparagement in the way in which the writer speaks of his predecessors. He simply feels that they have not exhausted the subject, and that his inquiries have enabled him to add something.'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'Luke’s opening sentence is more finished than the other Gospels’ openings'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'what is visible in the English, but is yet more conspicuous in the Greek, the finished structure of the sentences as compared with the simpler openings of the other Gospels'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'The footnote reads “most surely believed” as “fulfilled”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'GR which have been fulfilled.'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: '“Most surely believed” is better “accomplished among us”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'Better, of the things that have been accomplished among us.'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'Verse 2 properly reads “they who were eyewitnesses … delivered them unto us”'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'The words “they delivered them unto us, which from the beginning were eyewitnesses” should be more properly translated as “they who were eyewitnesses from the beginning delivered them unto us.”'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'Luke says he was not an eyewitness'
    key: farnes-synoptic-gospels
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/synoptic-gospels'
    quote: 'Luke explicitly states that he was not an eyewitness of Christ’s ministry (Luke 1:2).'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'Luke used earlier written sources from eyewitnesses'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'Luke explicitly tells his audience that he used previously written sources from eyewitnesses to compose his Gospel (see Luke 1:1–3).'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: '“Delivered” is Paul’s word for handing on the Supper and the Resurrection, nearly a technical term for oral teaching'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'The word “delivered” is the same as that used by St. Paul when he speaks of the history of the Lord’s Supper (1Corinthians 11:23-25) and of the Resurrection (1Corinthians 15:3-7), and, with its cognate noun “tradition” (2Thessalonians 2:15), would seem to have been almost a technical term for the oral teaching'
  - where: 'note 1:1 “A messenger who wrote after others”'
    claim: 'JST 1:1 gives Luke a high calling as a messenger of Jesus Christ'
    key: bd-luke
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/luke?lang=eng'
    quote: 'JST Luke 1:1 attributes to Luke a high calling as a “messenger of Jesus Christ” (see Luke 1:1 note a).'
  - where: 'note 1:3 “Who Theophilus was”'
    claim: 'Theophilus means “friend of God”; Luke addressed the Gospel and Acts to him; “most excellent” shows a real person; JST 3:19–20'
    key: bd-theophilus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/theophilus?lang=eng'
    quote: 'Friend of God. The person to whom Luke addressed his Gospel and the Acts. The use of the title “most excellent” (Luke 1:3) seems to show that he was a real personage. See also JST Luke 3:19–20 (Appendix).'
  - where: 'note 1:3 “Who Theophilus was”'
    claim: 'The footnote joins Theophilus to Acts 1:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'Acts 1:1.'
  - where: 'note 1:3 “Who Theophilus was”'
    claim: '“Most excellent” is the title given Felix; it implies high position, perhaps official rank'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'The adjective is the same as that used of Felix by Tertullus (Acts 24:3), and implies at least high social position, if not official rank.'
  - where: 'note 1:3 “Who Theophilus was”'
    claim: 'The JST names Theophilus in explaining the custom of the treasury'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'For it is well known unto you, Theophilus, that after the manner of the Jews, and according to the custom of their law in receiving money into the treasury'
  - where: 'note 1:3 “Who Theophilus was”'
    claim: '“Perfect understanding … from the very first” is better “traced all things from their source”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'Better, having traced (or investigated) all things from their source. The verb used is one which implies following the course of events step by step.'
  - where: 'note 1:3 “Who Theophilus was”'
    claim: '“In order” aims at chronological order'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'The word implies a distinct aim at chronological arrangement'
  - where: 'note 1:3 “Who Theophilus was”'
    claim: '“Instructed” (verse 4) is the verb behind “catechise” and means oral teaching'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'The verb used is that from which are formed the words “catechise,” “catechumen.” &c., and implies oral teaching'
  - where: 'note 1:28 “Favoured with grace”'
    claim: 'JST 1:28 reads “highly favoured of the Lord … for thou art chosen and blessed among women”'
    key: jst-parallel-luke
    url: 'https://rsc.byu.edu/sites/default/files/pub_content/pdf/Luke.pdf'
    quote: '“Hail, thou virgin who art highly favoured of the Lord. The Lord is with thee, for thou art chosen and blessed among women.”'
  - where: 'note 1:32 “Son of the Highest, heir of David”'
    claim: 'The child was begotten of Elohim and so of right called the Son of the Highest'
    key: talmage-jesus-christ-7
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-7?lang=eng'
    quote: 'That Child to be born of Mary was begotten of Elohim, the Eternal Father, not in violation of natural law but in accordance with a higher manifestation thereof; and, the offspring from that association of supreme sanctity, celestial Sireship, and pure though mortal maternity, was of right to be called the “Son of the Highest.”'
  - where: 'note 1:32 “Son of the Highest, heir of David”'
    claim: 'Mary was of David’s lineage, and Joseph of royal descent'
    key: talmage-jesus-christ-7
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-7?lang=eng'
    quote: 'She was of the lineage of David; and though unmarried was betrothed or espoused to a man named Joseph, who also was of royal descent through the Davidic line.'
  - where: 'note 1:69 “A horn of salvation”'
    claim: 'In the Old Testament the horn stands for power and strength (1 Sam. 2:1; Ps. 89:17)'
    key: frederick-paradoxical-lamb
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/paradoxical-lamb-christology-johns-apocalypse'
    quote: 'In Hebrew Bible passages such as Deuteronomy 2:3; Daniel 7:20–21; 1 Samuel 2:1; and Psalm 89:17, “horn” tended to symbolize power and strength.'
  - where: 'note 1:69 “A horn of salvation”'
    claim: 'The Psalms call the Lord “the horn of my salvation” (Ps. 18:2)'
    key: frederick-paradoxical-lamb
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/paradoxical-lamb-christology-johns-apocalypse'
    quote: 'The image appears throughout the Psalms, in passages such as this: “The Lord is my rock, and my fortress, and my deliverer; My God, my strength, in whom I will trust; My buckler, and the horn of my salvation, and my high tower” (Psalm 18:2'
  - where: 'note 1:69 “A horn of salvation”'
    claim: 'The image comes from Ps. 132:17, of David’s house, answering to “anointed”; from the horns of bull or stag as strength; Zacharias applies it to the Christ in David’s house'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'The symbolism of the horn comes from Psalm 132:17, where it is used of the representative of the House of David, and answers to the “Anointed” of the other clause of the verse. It originated obviously in the impression made by the horns of the bull or stag, as the symbols of strength. Here, following in the steps of the Psalmist, Zacharias uses it as a description of the coming Christ'
  - where: 'note 1:69 “A horn of salvation”'
    claim: 'Verse 71 is in apposition: the horn of salvation is salvation from enemies'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/1.htm'
    quote: 'Literally, salvation from our enemies, in apposition with “the horn of salvation” of Luke 1:69.'
  - where: 'note 1:32 “Son of the Highest, heir of David”'
    claim: 'The footnote to “throne” points to the Lord’s millennial reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'TG Jesus Christ, Millennial Reign.'
  - where: 'note 1:46 “Mary’s song”'
    claim: 'The Septuagint of 1 Sam. 1:11 has Hannah ask the Lord to look upon the humiliation of His handmaid'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/1.htm'
    quote: 'O Lord God of Sabaoth, if thou welt indeed look upon the humiliation of thine handmaid, and remember me'
  - where: 'note 1:78 “The dawn from on high”'
    claim: 'The footnotes to verse 79 give 1 Pet. 3:19 and D&C 138:50–51'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: '1 Pet. 3:19 (18–20).'
  - where: 'note 1:78 “The dawn from on high”'
    claim: 'The footnote to “death” in verse 79 gives D&C 138:50'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'D&C 45:17 (16–17); 138:50 (50–51).'
