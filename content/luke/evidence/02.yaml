  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'In the most important scene of this sort, those who go to find Jesus in the tomb are met by the words of an angel: “Why seek ye the living among the dead? He is not here, but is risen” (24:5–6). In this light, the one who finds Jesus finds salvation.'
