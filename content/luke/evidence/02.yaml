chapter: 2
claims:
- where: 'when'
  claim: 'Herod the Great died in the spring of 4 BC, so the birth came before then'
  key: sc-knowhy-255
  url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-help-date-the-first-christmas'
  quote: 'The year 4 BC is considered the latest possible date because Herod the Great died in the spring of that year, meaning the Savior must have been born sometime before then (Matthew 2; Luke 1:5).'
- where: 'when'
  claim: 'With a death date of April AD 30, the Book of Mormon limits the birth to 5 BC or early 4 BC'
  key: sc-knowhy-255
  url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-help-date-the-first-christmas'
  quote: 'If the proposed date of April AD 30 for the death of Jesus is correct, then possible birthdates for Christ are limited to sometime in 5 BC or in the early months of 4 BC.'
- where: 'when'
  claim: 'The law set forty days (seven and thirty-three) for a mother’s purification after a son'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/12?lang=eng'
  quote: 'And she shall then continue in the blood of her purifying three and thirty days'
- where: 'setting'
  claim: 'Luke tells the birth from Mary’s perspective (Matthew from Joseph’s), with the census, the journey and the shepherds'
  key: strathearn-teaching-gospels
  url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
  quote: 'Luke recounts the birth from Mary’s perspective and includes her visit to Elizabeth, the Roman census, and Joseph and Mary’s subsequent trip from Nazareth to Bethlehem where it is the shepherds, rather than the Wise Men, who worship the young baby'
- where: 'setting'
  claim: 'Luke alone relates his narrative to dates of world history; Augustus reigned 27 BC–AD 14'
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'Luke is the only Gospel writer who relates his narrative to specific dates of world history. He says Caesar Augustus (27 BC–AD 14), the first and one of the greatest of the Roman emperors, called for a taxing or census enrollment'
- where: 'setting'
  claim: 'Three cities: Nazareth, Bethlehem, Jerusalem; what happened is confirmed in Jerusalem; Jerusalem the goal of the journey and place of His death'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'On one level, we are reading a tale of three cities, Nazareth, Bethlehem, and Jerusalem. … In effect, all that has happened beforehand is confirmed in visits to the city. … for he knows that it is to be the place of his death'
- where: 'thread'
  claim: 'The temple holds the early reports together: Zacharias, the presentation, Simeon and Anna, the boy'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'First, the temple as the center of divine activity holds the early reports together. Within the temple complex, the angel appears to Zacharias; the parents of the infant Jesus present him there; Simeon and Anna find him with the aid of the Spirit'
- where: 'thread'
  claim: 'Seeking and finding runs through the accounts: shepherds, Simeon and Anna, Mary and Joseph'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'the themes of seeking and finding stand out as vivid threads throughout these accounts. … the shepherds seek and then find the infant by following the unusual “sign” from the angel; Simeon and Anna find the child with the aid of the Spirit'
- where: 'thread'
  claim: 'From the temple story on, Jesus is the subject not the object; his ministry characterized as teaching'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'From this point on, Jesus is not the object of prophecy or adoration, but the subject of Luke’s report. In a few deft words, Luke characterizes Jesus’ ministry as one of teaching.'
- where: 'thread'
  claim: 'The humble birth contrasts with the grandeur of the emperor whose decree sent the couple to Bethlehem'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'This humble beginning for God’s Son, born to parents who are without a permanent home in Bethlehem, stands in marked contrast with the grandeur and opulence that encircle the Roman emperor'
- where: 'section 4 plain'
  claim: 'Simeon’s words can be rendered “a light for revelation to the Gentiles”'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Simeon’s words can be rendered “a light for revelation to the Gentiles.”'
- where: 'note 2:2 “The census and Cyrenius”'
  claim: 'Quirinius was legate of Syria AD 6–7, too late for a birth under Herod (d. 4 BC); Josephus’s census of AD 6, noted in Acts 5:37; most scholars dismiss Luke’s note'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'serves as legate of Syria from AD 6 to AD 7, too late for Jesus’ birth, which Matthew places during the reign of Herod—who dies in 4 BC. Josephus writes that Quirinius conducts a census in AD 6, which is also noted in Acts 5:37'
- where: 'note 2:2 “The census and Cyrenius”'
  claim: 'No other record attests the census; most scholars dismiss the notation; Herod likely adopted Roman census-taking; village scribes attested; Quirinius’s census memorable'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'most scholars dismiss the notation here as historically inaccurate. But this view does not take into account that Herod, who introduces all things Roman into his society, most likely adopts the Roman approach to census-taking and taxation as well'
- where: 'note 2:2 “The census and Cyrenius”'
  claim: 'Quirinius’s census, after Archelaus was deposed, inflamed Jewish resistance and so was memorable'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Luke’s pointer to Quirinius may arise because his census, after Archelaus is deposed, inflames Jewish resistance against Rome and therefore becomes a memorable moment.'
- where: 'note 2:2 “The census and Cyrenius”'
  claim: '“First” may modify “enrollment”: this census was before the one Quirinius made'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Most early manuscripts place “first” so that it modifies “enrollment.” In contrast, Nigel Turner suggests that the expression means, “This census was before the census which Quirinius, governor of Syria, made”'
- where: 'note 2:2 “The census and Cyrenius”'
  claim: 'Even a scholar who doubts Luke admits the Greek permits “earlier than” or “before”'
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'Brown does admit that the Greek of Luke 2:2 permits other translations, one of which would resolve Luke’s accuracy issue: “This census was earlier than the one . . . ” or “This census was before the governorship of . . . ”'
- where: 'note 2:2 “The census and Cyrenius”'
  claim: 'Perhaps only fresh evidence will bring a solution'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Perhaps only the discovery of fresh historical evidence will bring a solution'
- where: 'note 2:4 “Bethlehem, in the land of Jerusalem”'
  claim: 'In the Old Testament “the city of David” is Jerusalem; Luke 2:4, 11 are exceptions'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'the city of David: In the Old Testament, this title is reserved for Jerusalem. This verse and both 2:11 and 2:15 offer exceptions.'
- where: 'note 2:4 “Bethlehem, in the land of Jerusalem”'
  claim: 'Mary probably of Davidic descent, her family likely from the Bethlehem area; she readily found Elisabeth'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'it is most likely that Mary’s family originates there as well because of her descent from David (see Rom. 1:3). Moreover, the fact that the youthful Mary can readily find her cousin Elisabeth (see 1:39–40) indicates that she is familiar with the region'
- where: 'note 2:4 “Bethlehem, in the land of Jerusalem”'
  claim: 'Alma 7:10 says “at Jerusalem” instead of Bethlehem; Alma meant the land, not the city'
  key: sc-knowhy-495
  url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-talk-about-a-land-of-jerusalem'
  quote: 'Yet Alma’s full statement refers to “Jerusalem which is the land of our forefathers,” indicating that Alma had the land, not the city, of Jerusalem in mind.'
- where: 'note 2:4 “Bethlehem, in the land of Jerusalem”'
  claim: 'ʿAbdi-Ḫeba’s letter to Pharaoh names a town of the land of Jerusalem, Bit-Lahmi; a seventh-century BC seal impression shows Bethlehem a satellite of Jerusalem'
  key: sc-knowhy-495
  url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-talk-about-a-land-of-jerusalem'
  quote: 'In one of his letters to Pharaoh, ʿAbdi-Ḫeba mentioned “a town of the land of Jerusalem, Bit-Lahmi by name,” which the late W.F. Albright believed was “an almost certain reference to the town of Bethlehem.”'
- where: 'note 2:4 “Bethlehem, in the land of Jerusalem”'
  claim: 'Bethlehem was part of the land of Jerusalem; Alma used the general reference for an audience unfamiliar with the region'
  key: sc-knowhy-495
  url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-talk-about-a-land-of-jerusalem'
  quote: 'Bethlehem was evidently part of the “land of Jerusalem” in antiquity. … Alma likely used the more general reference because his New World audience would not have been as familiar with “regions round about” Jerusalem'
- where: 'note 2:4 “Bethlehem, in the land of Jerusalem”'
  claim: 'Alma 7:10 reads “at Jerusalem which is the land of our forefathers”'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng'
  quote: 'And behold, he shall be born of Mary, at Jerusalem which is the land of our forefathers'
- where: 'note 2:5 “Espoused, and traveling together”'
  claim: 'Betrothed couples legally husband and wife; strict chastity until cohabitation; unfaithfulness punishable by death'
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'Though betrothed couples were regarded as husband and wife legally (Deuteronomy 22:23–24), between the time of betrothal and the celebration that inaugurated cohabitation, a strict code of chastity was enforced (Matthew 1:18, 25).'
- where: 'note 2:5 “Espoused, and traveling together”'
  claim: 'Unfaithfulness during betrothal could be punished by death'
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'unfaithfulness during the period of betrothal (espousal) could be punished by death (Deuteronomy 22:23–24).'
- where: 'note 2:5 “Espoused, and traveling together”'
  claim: 'Luke does not say the union was consummated, yet they travel together, with others and on foot'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Luke does not say elsewhere that they are married in the sense that their union has been consummated. However, the relationship between the two is such that they feel comfortable traveling together to a distant town, doubtless in the company of others and on foot'
- where: 'note 2:5 “Espoused, and traveling together”'
  claim: 'Whether Mary enrolls is unclear: women exempt in Egypt, not Syria; she may have been a landholder or heir near Bethlehem'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Whether she is going for the taxation enrollment remains unclear because in Egypt women are exempt, and in Syria they are not. … she may well be a landholder or land-inheritor in the Bethlehem area'
- where: 'note 2:7 “What the inn was”'
  claim: 'Katalyma can be inn, guest room or room; JST “inns”; relatives possible; Luke does not say where; Justin Martyr’s cave'
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'The Joseph Smith Translation changes inn to inns. The Greek word kataluma can be translated as “inn,” “guest room,” or “room.”'
- where: 'note 2:7 “What the inn was”'
  claim: 'Luke does not say where the birth occurred; Justin Martyr says a cave near the village'
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'But Luke does not tell readers where, precisely, the birth occurred. Second-century-AD Christian apologist Justin Martyr states: “Since Joseph had nowhere to lodge [katalyein] in that village, he lodged in a certain cave near the village'
- where: 'note 2:7 “What the inn was”'
  claim: 'Same word as the guest chamber of 22:11; caravanserai or guest room; JST “none to give room for them” supports either'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'The term translated “inn” is the same as that translated “guest chamber” in 22:11 (Greek katalyma). … A further addition to the Joseph Smith Translation can support either view: “there was no room for them” becomes “there was none to give room for them” (JST 2:7).'
- where: 'note 2:7 “What the inn was”'
  claim: 'Traditional inn a caravanserai renting stalls and upper rooms'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'an inn is a caravanserai, a place of lodging that rents stalls to guests who might be traveling with animals, as well as private rooms on the second floor to those who can afford them. Another meaning is “guest room,”'
- where: 'note 2:7 “What the inn was”'
  claim: 'If relatives lived there, the couple were late guests and the birth was in the stable on the lower floor or a cave; contrast with the emperor'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'if relatives of the couple reside in or around Bethlehem, it seems that Mary and Joseph are late-coming guests to their home because of the location of Jesus’ birth—in a stable, which typically takes up the home’s lower floor, or sits in a cave.'
- where: 'note 2:7 “What the inn was”'
  claim: 'The inn of the good Samaritan (10:34) is pandocheion'
  key: greek-nt
  url: 'https://biblehub.com/texts/luke/10-34.htm'
  quote: 'ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.'
- where: 'note 2:7 “What the inn was”'
  claim: 'The JST footnote reads “inns”'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/2?lang=eng'
  quote: 'JST Luke 2:7 … inns.'
- where: 'note 2:8 “Why shepherds”'
  claim: 'Shepherds on a low rung of society; the Mishnah’s later “sinners”; Luke links the birth to humility'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'We can dismiss the later rabbinic judgment in the Mishnah, the second-century composition of Jewish law, that shepherds are “sinners,” a judgment that the angels’ appearance calls into question. Even so, shepherds stand on one of the lowest rungs of society'
- where: 'note 2:8 “Why shepherds”'
  claim: 'Elder Bruce R. McConkie suggested the shepherds watched temple flocks destined for sacrifice'
  key: mcconkie-special-witnesses
  url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/special-witnesses-birth-christ'
  quote: 'were destined for sacrifice on the great altar in the Lord’s House, in similitude of the eternal sacrifice of Him who that wondrous night lay in a stable'
- where: 'note 2:8 “Why shepherds”'
  claim: 'Only to those who watched the temple flocks did the angel come (McConkie, as quoted)'
  key: mcconkie-special-witnesses
  url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/special-witnesses-birth-christ'
  quote: 'so there were many shepherds in Palestine, but only to those who watched over the temple flocks did the herald angel come; only they heard the heavenly choir.'
- where: 'note 2:8 “Why shepherds”'
  claim: 'Alma 13:26 applied to the shepherds: angels declare to just and holy men'
  key: mcconkie-special-witnesses
  url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/special-witnesses-birth-christ'
  quote: 'Alma, who announced the principle that angels would declare the glad tidings of the Messiah’s birth to “just and holy men” (Alma 13:26).'
- where: 'note 2:8 “Why shepherds”'
  claim: 'Sheep in the fields from about Passover to the first rains, about April to October'
  key: mcconkie-special-witnesses
  url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/special-witnesses-birth-christ'
  quote: 'It was the custom among the Jews to take their sheep to the fields about the time of Passover and bring them home at the coming of the first rains—thus they would be in the fields from about April to October.'
- where: 'note 2:8 “Why shepherds”'
  claim: 'The night watch points to the lambing season in spring; the interpretation is disputed'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'The nighttime scene points to the lambing season, the springtime. … Luke’s notation suggests generally the time of Jesus’ birth: the spring of the year. This interpretation is disputed.'
- where: 'note 2:11 “A Saviour, born this day”'
  claim: '“Savior” (sōtēr) often of God in the OT, rare in the Gospels: twice in Luke, once in John'
  key: huntsman-lukes-jesus
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
  quote: 'The title “Savior,” or deliverer (Hebrew, môšîā`; Greek, sōtēr), was one frequently used of God in the Old Testament,[15] but it is surprisingly rare in the New, especially in the Gospels, where it appears twice in Luke and only once in John.'
- where: 'note 2:11 “A Saviour, born this day”'
  claim: 'The two in Luke are 1:47 and 2:11; John 4:42'
  key: huntsman-lukes-jesus
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
  quote: '[16] Luke 1:47; 2:11; John 4:42; Acts 5:31; 13:23'
- where: 'note 2:11 “A Saviour, born this day”'
  claim: 'Christos means anointed one; used by angels and Simeon; rare in the ministry; Jesus uses it of himself only after the resurrection, tied to his suffering'
  key: huntsman-lukes-jesus
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
  quote: 'While the title is used by the angels and Simeon in the infancy narrative (Luke 2:11, 26), the number of times that Christ is used directly of Jesus in his ministry is small until the passion narrative.'
- where: 'note 2:11 “A Saviour, born this day”'
  claim: 'Only on the Emmaus road and to the eleven does Jesus use “Christ” of himself, tied to his suffering; Hebrew māšîaḥ and Greek christos mean anointed one'
  key: huntsman-lukes-jesus
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
  quote: 'Only in his resurrection appearances to the two disciples on the road to Emmaus and to the gathered eleven does Jesus use the title of himself (24:26, 46), in both cases connecting it with the necessity of his suffering.'
- where: 'note 2:11 “A Saviour, born this day”'
  claim: 'The Hebrew māšîaḥ and the Greek christos both mean “anointed one”'
  key: huntsman-lukes-jesus
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
  quote: 'since the Hebrew māšîaḥ and the Greek christos both mean “anointed one.”'
- where: 'note 2:11 “A Saviour, born this day”'
  claim: '“This day” (sēmeron) links to special moments inaugurated by God: 4:21; 19:5, 9; 23:43'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: '2:11 this day: In scripture, this word (Greek sēmeron) links to special moments in the history of the children of Israel inaugurated by God (see 4:21; 5:26; 13:32–33; 19:5; 23:43; the Note on 19:9).'
- where: 'note 2:12 “A sign in a feeding trough”'
  claim: 'The sign is an unusual circumstance that tells the shepherds they have found the family; no street addresses; a guide in their hunt'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'The “sign” offered by the angel (2:12) indicates an unusual circumstance—an infant lying in a trough for cattle—which will tell the shepherds that they have found the right family. Thus the sign will also be a guide of sorts in their hunt for the child.'
- where: 'note 2:12 “A sign in a feeding trough”'
  claim: 'No street addresses in Middle Eastern villages; one finds a home by asking'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'As is typical still in Middle Eastern villages, there are no street addresses. One finds the home of an acquaintance by asking villagers'
- where: 'note 2:12 “A sign in a feeding trough”'
  claim: 'Swaddling clothes were narrow bands for well-cared-for infants, perhaps embroidered with lineage; foreshadow binding up and burial'
  key: south-clothing-textiles
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/clothing-textiles-new-testament'
  quote: 'which were not the rags of Nativity art but rather narrow bands common to all well-cared for infants, made for that purpose and perhaps even embroidered with lineage identifications.[4] Such swaddling bands foreshadowed his eventual ministry of binding up the broken, and his burial'
- where: 'note 2:12 “A sign in a feeding trough”'
  claim: 'The manger (phatnē) sets humble origin against Augustus, foreshadows 9:58, echoes Isa. 1:3 LXX; perhaps Israel begins to know her God'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Jesus’ first bed is a cattle trough (Greek phatnē), setting off his humble origin from the regal, important Augustus (see 2:1). … Perhaps, on a symbolic level, we understand that Israel begins to know her God when the shepherds arrive'
- where: 'note 2:12 “A sign in a feeding trough”'
  claim: 'The Septuagint of Isaiah 1:3 uses phatnē for “crib”'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'as well as forming a verbal echo of Isaiah 1:3 (“The ox knoweth his owner, and the ass his master’s crib: but Israel doth not know”), where the Septuagint repeats the term phatnē for “crib.”'
- where: 'note 2:14 “Whose good will?”'
  claim: 'Better “good will among men”; God’s good will; older manuscripts read “men of good will” / “with whom God is pleased”'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'A better rendition is “good will among men.” The term “good will” points toward God’s good will, not that of people for one another. Some Greek manuscripts older than the Textus Receptus used by the King James translators preserve a reading'
- where: 'note 2:14 “Whose good will?”'
  claim: 'The older reading means “peace among men of good will” or “among men with whom God is pleased”'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'preserve a reading that carries the meaning “peace among men of good will” or “among men with whom God is pleased.”'
- where: 'note 2:14 “Whose good will?”'
  claim: 'The Textus Receptus reads eudokia; the SBL text reads eudokias'
  key: greek-nt
  url: 'https://biblehub.com/texts/luke/2-14.htm'
  quote: 'Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις εὐδοκίας.'
- where: 'note 2:14 “Whose good will?”'
  claim: 'Scrivener’s Textus Receptus reads εὐδοκία'
  key: greek-nt
  url: 'https://biblehub.com/texts/luke/2-14.htm'
  quote: 'Δόξα ἐν ὑψίστοις Θεῷ, καὶ ἐπὶ γῆς εἰρήνη· ἐν ἀνθρώποις εὐδοκία.'
- where: 'note 2:19 “What Mary kept”'
  claim: 'In contrast to those who wonder, Mary cherishes (syntēreō) to penetrate deeper meaning; rhēma “things” or “sayings”'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'In contrast to those who hear news from the shepherds and wonder (see 2:18), Mary cherishes (Greek syntēreō) in her memory what she experiences in order to penetrate its deeper, celestial meaning.'
- where: 'note 2:19 “What Mary kept”'
  claim: 'Rhēma as “things” is the totality of her experiences; as “sayings,” the shepherds’ news'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'If the meaning of the plural of the Greek noun (rhēma) is “things,” we see a pointer to the totality of her experiences … If the meaning is “sayings,” then she is holding onto the stunning news from the shepherds'
- where: 'note 2:19 “What Mary kept”'
  claim: 'At 2:51 the temple incident is a defining moment; the angel’s words being fulfilled; mission of teaching, not revolt or conquest'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'At last, the angel’s memorable words are being fulfilled, even though her son is just twelve years of age … Significantly, the event at the temple discloses his mission to be one of teaching, not of revolting or conquering.'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: 'Law of purification after a son: seven days, thirty-three more; lamb and bird; if not able, two turtles or two young pigeons'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/12?lang=eng'
  quote: 'And if she be not able to bring a lamb, then she shall bring two turtles, or two young pigeons; the one for the burnt offering, and the other for a sin offering'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: 'Firstborn of man redeemed for five shekels'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
  quote: 'And those that are to be redeemed from a month old shalt thou redeem, according to thine estimation, for the money of five shekels'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: 'Mary offers the gift of the poor, an eighth of a denarius per bird, watching from the Court of the Women, where Jesus later sees the widow'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'In accord with this law, Mary offers a gift of the poor, costing an eighth of a denarius per bird … As an adult, Jesus will return to this same Court of the Women and witness another poor woman, a widow, offer a gift'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: 'Mary watched the sacrifice from the Court of the Women'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'She holds her infant son while watching the sacrificial process from the Court of the Women'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: 'The offering of 2:24 is not the redemption of five shekels but the purification offering of the poor'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Even though Luke mentions the need to redeem the child here, the offering noted in 2:24 is not the redemption offering of five shekels. Instead, it is the purification offering made by poor people for a new mother'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: '“After the custom of the law” hints at the five-shekel payment'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'to do for him after the custom of the law: The expression hints at the five shekel payment to be made for the firstborn'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: 'The best manuscripts read “their purification”; Mary and Joseph or Mary and Jesus discussed; likely Mary and Joseph'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Importantly, the best manuscripts read “their purification” rather than “her purification.” The discussion is whether the pronoun “their” points to Mary and Joseph or to Mary and Jesus as needing purification. … If we adopt the plural “their,” then the likely sense is that both Mary and Joseph needed purification.'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: 'Stephanus 1550 reads αὐτῶν (their)'
  key: greek-nt
  url: 'https://biblehub.com/texts/luke/2-22.htm'
  quote: 'Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωσέως'
- where: 'note 2:22 “Purification and the firstborn”'
  claim: 'Scrivener 1894 reads αὐτῆς (her)'
  key: greek-nt
  url: 'https://biblehub.com/texts/luke/2-22.htm'
  quote: 'Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῆς κατὰ τὸν νόμον Μωσέως'
- where: 'note 2:25 “The consolation of Israel”'
  claim: 'Paraklēsis is related to “comforter” (John 14:16, 26)'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'consolation: The noun (Greek paraklēsis) is related to the term that is translated “comforter” elsewhere (see John 14:16, 26).'
- where: 'note 2:25 “The consolation of Israel”'
  claim: 'Luke mentions the Holy Ghost three times with Zacharias’s family in ch. 1 and three times with Simeon'
  key: wilson-atonement-foretold
  url: 'https://rsc.byu.edu/save-lost/jesus-atonement-foretold-through-his-birth'
  quote: 'In the birth narrative, Luke mentions the Holy Ghost or Spirit six times; three from chapter 1 in conjunction with Zacharias (see Luke 1:15, 17, 41) and three connected to Simeon at the temple (see Luke 2:25–27).'
- where: 'note 2:25 “The consolation of Israel”'
  claim: '“Just” better “righteous,” as of Zacharias and Elisabeth in 1:6'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: '2:25 just: The term, which is made emphatic by the addition of the word “devout,” is better rendered “righteous,” as in 1:6, where it is applied to Zacharias and Elisabeth'
- where: 'note 2:25 “The consolation of Israel”'
  claim: 'The same verb “waiting” is used of Joseph of Arimathea, an inclusio across the Gospel'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Luke writes this same verb (Greek prosdechomai) to characterize Joseph of Arimathea, placing them on the same turf. By doing so, he creates a literary inclusio that arcs across his record from beginning to end'
- where: 'note 2:32 “Isaiah’s light to the Gentiles”'
  claim: 'Recalls LXX Isa. 42:6 and 49:6; the servant songs; “a light for revelation to the Gentiles”; Acts 13:47'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'The expression recalls the Septuagint readings for Isaiah 42:6 and 49:6, “a light of the Gentiles.” These passages tie to the four prophetic “Servant Songs” that anticipate the coming of the Servant-King'
- where: 'note 2:32 “Isaiah’s light to the Gentiles”'
  claim: 'Acts 13:47 uses a similar expression of Paul'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Simeon’s words can be rendered “a light for revelation to the Gentiles.” One finds a similar expression applied to the Apostle Paul in Acts 13:47.'
- where: 'note 2:32 “Isaiah’s light to the Gentiles”'
  claim: '“The glory of thy people Israel” alludes to Isa. 46:13'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'In another allusion to Isaiah’s language (see Isa. 46:13, “I will place salvation in Zion for Israel my glory”), Simeon draws attention to the two peoples whom Jesus’ message will touch, Gentiles and Jews.'
- where: 'note 2:32 “Isaiah’s light to the Gentiles”'
  claim: 'The servant songs: the servant brings righteousness and bears away sins; both King and Messiah'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'these songs point expectantly to God’s servant who will bring the reign of righteousness with him as well as bear away the sins of his people. Hence, the Lord’s servant functions as both King and Messiah'
- where: 'note 2:32 “Isaiah’s light to the Gentiles”'
  claim: 'Simeon by the spirit of prophecy saw Christ as Savior to Jew and Gentile, beyond his nation’s hope'
  key: mcconkie-special-witnesses
  url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/special-witnesses-birth-christ'
  quote: 'Simeon’s declaration, which came by the spirit of prophecy, reached far beyond the understanding and hope of those of his nation—for he saw the universal nature of Christ’s ministry and attested that He was Savior to Jew and Gentile alike.'
- where: 'note 2:34 “The fall, the rising, and the sword”'
  claim: 'Falling recalls Isa. 8:14–15; the image returns in 20:18; “rising again” is anastasis, resurrection'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'The image of falling appears also in 20:18. Both passages take up a theme found in Isaiah 8:14–15, where “a stone of stumbling and . . . a rock of offense” cause people to “stumble, and fall, and be broken.”'
- where: 'note 2:34 “The fall, the rising, and the sword”'
  claim: 'Anastasis translated “resurrection” by Tyndale; “the fall and resurrection of many in Israel”'
  key: wilson-atonement-foretold
  url: 'https://rsc.byu.edu/save-lost/jesus-atonement-foretold-through-his-birth'
  quote: 'The Greek word anastasis, “rising,” was translated by Tyndale as “resurrection” (see also Luke 20:27, 33). This alternative translation fits perfectly in the context with the verse: “This child is set for the fall and resurrection of many in Israel”'
- where: 'note 2:34 “The fall, the rising, and the sword”'
  claim: 'The sign spoken against is a rejected or opposed symbol; Isa. 53:3; fulfilled in his Passion (Luke 23:23)'
  key: wilson-atonement-foretold
  url: 'https://rsc.byu.edu/save-lost/jesus-atonement-foretold-through-his-birth'
  quote: 'The literal translation of sign reads “a rejected (or opposed) symbol,” referring to the rejection Jesus would experience during his mortality.[28] This reinforces Isaiah’s prophecy seven hundred years previous regarding the Suffering Servant'
- where: 'note 2:34 “The fall, the rising, and the sword”'
  claim: 'Simeon’s prophecy fulfilled in the Passion'
  key: wilson-atonement-foretold
  url: 'https://rsc.byu.edu/save-lost/jesus-atonement-foretold-through-his-birth'
  quote: 'Simeon’s prophecy at birth was fulfilled as Christ became the Suffering Servant in his Passion and death.'
- where: 'note 2:34 “The fall, the rising, and the sword”'
  claim: 'The sword, spoken almost as an aside, discloses pain of soul to Mary; she witnesses the cross (John 19:25–27)'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'These words, spoken almost as an aside, disclose to Mary that the future of her son will bring pain of soul to her. … We know for certain that she witnesses his death on the cross, an event that brings anguish upon her (see John 19:25–27'
- where: 'note 2:36 “Anna the prophetess”'
  claim: 'Anna arrives at the end of Simeon’s words, by the Spirit; her witness is independent'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Luke wants us to understand that Anna comes to this spot by the aid of the Spirit, a point made firm by calling her “a prophetess” (2:36). Moreover, she arrives at the end of Simeon’s words, meaning that she does not take her clue about the child from him. Her witness stands independent.'
- where: 'note 2:36 “Anna the prophetess”'
  claim: 'Anna well known in Jerusalem; her testimony to all who looked for redemption'
  key: mcconkie-special-witnesses
  url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/special-witnesses-birth-christ'
  quote: 'Through the countless hours she had spent within the walls of the temple, she was undoubtedly well known to those of the holy city who also faithfully sought the coming of the Messiah. All such would hear her testimony of His birth'
- where: 'note 2:36 “Anna the prophetess”'
  claim: '“Prophetess” elevates Anna; Deborah, Huldah, Philip’s daughters'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'a prophetess: Luke’s term elevates Anna and indicates the respect that she enjoys among her peers. Other women known to enjoy the spirit of prophecy are Deborah (see Judg. 4:4), Hulda (see 2 Kgs. 22:14), and the four daughters of Philip (see Acts 21:9).'
- where: 'note 2:36 “Anna the prophetess”'
  claim: 'Anna is a form of Hannah, tying to Hannah and Samuel'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: '2:36 Anna: A variant form of Hannah, the name is one more piece that ties back to the earlier Old Testament account of Hannah and her son Samuel'
- where: 'note 2:36 “Anna the prophetess”'
  claim: 'Not a mere symbol but a real person; summary statements tie to Samuel; Mary’s song resembles Hannah’s'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Even if much in Luke’s narrative here links back to Hannah and her son Samuel, it is plain that Anna is a real person who comes by inspiration to where Joseph and Mary are.'
- where: 'note 2:36 “Anna the prophetess”'
  claim: 'Mary’s song resembles Hannah’s'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'As an additional piece, Mary’s song as she enters the home of Elisabeth resembles that of Hannah (see 1 Sam. 2:1–10; Luke 1:46–55).'
- where: 'note 2:36 “Anna the prophetess”'
  claim: 'Her age eighty-four, or years since her husband died'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Luke apparently sets out Anna’s age when she meets Joseph and Mary to be eighty-four, though the number may point to the years that have passed since her husband died.'
- where: 'note 2:36 “Anna the prophetess”'
  claim: 'Anna stands for the widows of Luke’s Gospel, whose place is under threat'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'In a sense, Anna stands for all the widows whom Luke’s Gospel will feature, women of goodness whose place and status in this world are regularly under threat (see 4:25–26; 7:11–15; 18:2–6; 20:47; 21:1–4).'
- where: 'note 2:39 “From the temple to Nazareth”'
  claim: 'It does not matter whether Luke purposely passes over the flight; returning to Nazareth they raise the child far from the halls of power'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'it does not matter whether Luke purposely passes over the story of the flight to Egypt. … in returning to Nazareth, Mary and Joseph will be able to raise this special child far from the halls of power in Jerusalem, out of the gaze of hateful and influential eyes'
- where: 'note 2:39 “From the temple to Nazareth”'
  claim: 'The stay in Egypt was probably brief, since Herod did not long survive the killing'
  key: talmage-jesus-christ-9
  url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-9?lang=eng'
  quote: 'Their stay in the foreign land was probably brief, for Herod did not long survive the babes he had slain in Bethlehem.'
- where: 'note 2:42 “Twelve years old”'
  claim: 'Mishnah: a child not obliged to attend feasts; Judah ben Tema: thirteen for commandments; twelve years and one day responsible for vows; bar mitzvah regularized in the fifteenth century'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'However, a young man “twelve years old and one day” becomes responsible for his vows, indicating that he has reached an age at which his words mean something.84 Importantly, the bar mitzvah rite does not become regularized for Jewish life until the fifteenth century'
- where: 'note 2:42 “Twelve years old”'
  claim: 'The Mishnah: a child not obliged to attend the three feasts; Judah ben Tema: at thirteen for the commandments'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'According to the Mishnah, a child is not obliged to attend the three main feasts that adult males are to attend (Passover, Pentecost, Tabernacles).82 Judah ben Tema, a second-century rabbinic teacher, holds that … “at thirteen for [the fulfilling of] the commandments,”'
- where: 'note 2:42 “Twelve years old”'
  claim: 'Women exempt from feasts, especially in childbearing years, but expected at Passover if able; Mary went'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Women, of course, are allowed an exemption not to attend feasts at the temple, and that will be the case especially during childbearing years.80 Even so, as a woman she is expected to attend the Passover celebration if she is able.'
- where: 'note 2:44 “Lost for three days”'
  claim: 'Pilgrims travel together for safety, with kinsfolk and acquaintance; poor pilgrims on foot'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'It is typical that pilgrims travel together for the sake of safety … This group includes “kinsfolk and acquaintance” of Joseph and Mary. Further, it is traditional for poor pilgrims to travel on foot to and from festivals'
- where: 'note 2:44 “Lost for three days”'
  claim: 'Discovered at the end of the day, they walk back through the night; three days of search explain Mary’s words'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'If Mary and Joseph make their discovery of Jesus’ absence at the end of the travel day, as seems probable, then they must walk most of the night and reach Jerusalem by early morning. … may help to explain the pique in Mary’s words'
- where: 'note 2:44 “Lost for three days”'
  claim: '“After three days” has no special significance; the resurrection phrase is “on the third day”'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: '2:46 after three days: Is there any significance to this length of time? It seems not. The expression means “after three days” whereas Luke’s phrase which points to the resurrection is “on the third day”'
- where: 'note 2:44 “Lost for three days”'
  claim: 'The lack of street addresses illustrated by the three days’ search'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'To illustrate the difficulty of finding people in a town or city because of the lack of contacts, we need only think of the three days that Jesus’ parents hunt for him in Jerusalem (see 2:46).'
- where: 'note 2:46 “Who was asking whom?”'
  claim: 'JST Luke 2:46: they were hearing him, and asking him questions'
  key: jst-luke-2
  url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/2?lang=eng'
  quote: 'And it came to pass, after three days they found him in the temple, sitting in the midst of the doctors, and they were hearing him, and asking him questions.'
- where: 'note 2:46 “Who was asking whom?”'
  claim: 'The JST turns the scene on its head: Jesus the teacher, not the learner'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/the-message-and-context-of-lukes-testimony'
  quote: 'The Joseph Smith Translation turns this scene on its head. … Jesus is not the learner but the teacher, even at a young age'
- where: 'note 2:46 “Who was asking whom?”'
  claim: 'JST Matt. 3:25: he needed not that any man should teach him'
  key: jst-matt-3
  url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
  quote: 'And he served under his father, and he spake not as other men, neither could he be taught; for he needed not that any man should teach him.'
- where: 'note 2:46 “Who was asking whom?”'
  claim: 'Joseph Smith: as a boy Jesus had all the intelligence to rule the kingdom of the Jews and reason with the doctors'
  key: tpjs-2007-ch-3
  url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-3?lang=eng'
  quote: '“When still a boy [Jesus Christ] had all the intelligence necessary to enable Him to rule and govern the kingdom of the Jews, and could reason with the wisest and most profound doctors of law and divinity'
- where: 'note 2:49 “The things of my Father”'
  claim: 'The Greek is abbreviated: literally “in the things of my Father”; or “in my Father’s house”'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'The expression is more abbreviated and less precise in the Greek text than it is in the King James rendition … Literally, we can translate it, “in the things of my Father,” … Another possibility is “in my Father’s house,” pointing to where he has been spending the last three days.'
- where: 'note 2:49 “The things of my Father”'
  claim: '“They understood not” may point to a normal childhood from which Jesus now steps out'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'But Luke’s notation may simply point to Jesus having enjoyed a normal childhood and is now stepping out of that mold and beginning to shoulder the divine responsibility that is his to lift.'
- where: 'note 2:49 “The things of my Father”'
  claim: 'As an adult he takes control of the temple grounds and calls it “My house”'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'when Jesus comes to the temple as an adult, he is no stranger and, significantly, exhibits unabashed ownership when he takes control of the grounds, rids the sacred precinct of those who have made it “a den of thieves,” and calls it “My house”'
- where: 'note 2:49 “The things of my Father”'
  claim: 'The temple scene characterizes his ministry as teaching'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'In a few deft words, Luke characterizes Jesus’ ministry as one of teaching.'
- where: 'note 2:52 “From grace to grace”'
  claim: '2:52 mirrors John (1:80) and the young Samuel (1 Sam. 2:26), with a link to David (1 Sam. 18:14): prophets, judges, kings'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'Besides mirroring what is said about the youthful John (see 1:80), this assertion reflects very clearly the statements about young Samuel … Even in his youth, Jesus stands within the celebrated circle of prophets, judges, and kings.'
- where: 'note 2:52 “From grace to grace”'
  claim: 'A link to David also appears (1 Sam. 18:14)'
  key: brown-testimony-luke
  url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-2-104'
  quote: 'a link to David also appears, expanding how we should understand the youthful Jesus: “David behaved himself wisely in all his ways; and the Lord was with him” (1 Sam. 18:14).'
- where: 'note 2:52 “From grace to grace”'
  claim: 'D&C 93:13: he continued from grace to grace until he received a fulness'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng'
  quote: 'And he received not of the fulness at first, but continued from grace to grace, until he received a fulness;'
- where: 'note 2:52 “From grace to grace”'
