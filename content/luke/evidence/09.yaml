chapter: 9
claims:
  - where: setting
    claim: 'Chapter 9 moves from the sending of the Twelve through the feeding, the first prediction and the Transfiguration to the turn toward Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Luke follows this high moment by narrating the feeding of the five thousand (see 9:11–17), Jesus’ first prediction of his death (see 9:22), the transfiguration (see 9:28–36), and the purposeful adjustment of Jesus’ travels from an itinerary inside Galilee to one that leads him toward Jerusalem (see 9:51).'
  - where: setting
    claim: 'Luke repeats nothing of Mark 6:45–8:26, the “great omission”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'by omitting the report about John, which is part of the so-called “great omission”25 wherein Luke does not repeat any part of Mark 6:45–8:26, Luke holds his focus on the empowerment of the Twelve'
  - where: setting
    claim: 'The Transfiguration came in about October, six months before His death'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'The Transfiguration occurred in about October, some six months before the death of Jesus.'
  - where: setting
    claim: 'The final trek runs from 9:51 to 19:28'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Luke illustrates this in his account of the Savior’s final trek to Jerusalem, which begins in Luke 9:51 and continues until Jesus arrives at the outskirts of Jerusalem in Luke 19:28.'
  - where: thread
    claim: 'Herod’s question “who is this?” frames the chapter; most of the chapter answers it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The most important dimension about this short narrative is that it frames the persistent question on everyone’s mind, “Who is Jesus?” Most of the chapter responds to this question'
  - where: thread
    claim: 'Luke frames the Transfiguration between two prophecies of His death'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'By doing so, Luke frames the Transfiguration between two important prophecies of Jesus’ divine fate (see 9:22, 44)'
  - where: thread
    claim: 'Discipleship appears at the beginning, center and end of the chapter'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Following Jesus is not a casual matter: it demands all, but rewards all (see also 14:25–33; 18:28–30). This theme, that appears at the beginning, at the center, and at the end of chapter 9, confers a unity both on the chapter'
  - where: 'note 9:3 “Neither staves”'
    claim: 'No staff: no means of self-defense; Mark 6:8 allows a staff; one solution is “Go as you are”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The meaning (Greek rhabdos) seems to be that Jesus wants the Twelve to travel with no means of self-defense, that is, to be harmless and peaceful, and not to resemble wandering preachers.10 But a problem arises in Mark 6:8 … One solution is to see Jesus saying in both passages, “Go as you are.”'
  - where: 'note 9:5 “Shake off the very dust”'
    claim: 'The dust rite reverses foot washing; “receive” (dexomai) is a term of Greco-Roman hospitality, the host’s duty to care for the guest’s needs and give shelter, and can include the message'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'In many ways, the rite of wiping dust off feet may be thought of as the reverse of the foot-washing rite … it was one of a constellation of terms used to describe Greco-Roman hospitality responsibilities, specifically the responsibilities of the host “to receive” the guest, thereby taking care of their needs and providing them shelter. If the guest was sent by another and was therefore an emissary or ambassador, then reception could also include the message as well as the general needs.'
  - where: 'note 9:5 “Shake off the very dust”'
    claim: 'The Risen Lord recalls these instructions in D&C 84:77–78, 92–93; God sets the timing of rewards and punishments'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Moreover, in an apparent allusion back to his instructions on that occasion … In all, it is important to note, God sets the timing and character of rewards and punishments.'
  - where: 'note 9:9 “Who is this?”'
    claim: 'Herod the tetrarch is Antipas, ruler of Galilee and Perea, who took Herodias'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'Antipas (called in the New Testament “Herod the tetrarch”) built as his capital Tiberias on the Sea of Galilee; he is frequently mentioned in the Gospels (Matt. 14:1; Mark 6:14; Luke 9:7; 13:31; 23:7–15). He took as his wife Herodias'
  - where: 'note 9:20 “The Christ of God”'
    claim: 'Only Peter confesses Jesus as Christ during the ministry, apart from devils'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'since the Hebrew māšîaḥ and the Greek christos both mean “anointed one.” … Other than the testimony of devils (4:41), as in the other Synoptics, only Peter at Caesarea Philippi confesses that Jesus is “Christ” (9:20).'
  - where: 'note 9:20 “The Christ of God”'
    claim: 'In Luke no human witness confesses Jesus as Son of God; Luke does not expand Peter’s confession as Matthew does'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'a confession that Jesus is God’s Son never appears in the mouth of a human witness in Luke.[62] … like Mark, Luke does not expand Peter’s confession at Caesarea Philippi that Jesus is the Christ to include “the Son of the living God” as does Matthew'
  - where: 'note 9:20 “The Christ of God”'
    claim: '“The Christ of God”: God’s anointed; the JST reads “The Christ, the Son of God”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The Joseph Smith Translation adjusts the title to read, “The Christ, the Son of God,” equating two terms and framing a clearer Christological statement about who Jesus is.'
  - where: 'note 9:20 “The Christ of God”'
    claim: 'The Messiah draws His authority and mission from God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The expression “the Christ of God,” or God’s Messiah, bears the sense that the Messiah draws his authority and mission from God.'
  - where: 'note 9:22 “The Son of man must suffer”'
    claim: '“Must” (dei) points to divine necessity; the first of several predictions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'As elsewhere, the verb “must” (Greek dei) points to the divine necessity of Jesus’ labors and ministry'
  - where: 'note 9:22 “The Son of man must suffer”'
    claim: 'Luke notes six other occasions when Jesus speaks of His suffering and death'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'This verse forms the first of Jesus’ predictions of his suffering, death, and resurrection. Luke notes six other occasions when Jesus speaks of these approaching events'
  - where: 'note 9:22 “The Son of man must suffer”'
    claim: 'Luke omits Peter’s rebuke and Jesus’s answer; he downplays the disciples’ failings'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'the evangelist consciously downplays the failings of others, particularly his disciples, so that he does not need to portray Jesus as being harsh with them … Luke, however, completely omits both Peter’s rebuke and Jesus’s harsh response'
  - where: 'note 9:23 “Take up his cross daily”'
    claim: 'JST Matthew 16:26 defines taking up the cross'
    key: jst-matt-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/16?lang=eng'
    quote: 'And now for a man to take up his cross, is to deny himself all ungodliness, and every worldly lust, and keep my commandments.'
  - where: 'note 9:24 “Willing to lose it”'
    claim: 'JST Luke 9:24–25 text'
    key: jst-luke-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/9?lang=eng'
    quote: 'For whosoever will save his life, must be willing to lose it for my sake; … and yet he receive him not whom God hath ordained, and he lose his own soul, and he himself be a castaway?'
  - where: 'note 9:27 “Some standing here”'
    claim: 'D&C 7: John to tarry until the Lord comes in glory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/7?lang=eng'
    quote: 'because thou desirest this thou shalt tarry until I come in my glory, and shalt prophesy before nations, kindreds, tongues and people.'
  - where: 'note 9:30 “Moses and Elias”'
    claim: 'On the mount the Savior, Moses and Elias gave the promised keys to Peter, James and John'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'On the mount, the Savior, Moses, and Elias (Elijah) gave the promised keys of the priesthood to Peter, James, and John (HC 3:387), which enabled these brethren to carry forth the work of the kingdom on the earth after the departure of Jesus.'
  - where: 'note 9:30 “Moses and Elias”'
    claim: 'A like event in the Kirtland Temple on April 3, 1836: keys conferred on Joseph Smith and Oliver Cowdery'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'A similar event occurred on April 3, 1836, in the temple at Kirtland, Ohio, where the same heavenly messengers conferred priesthood keys upon the Prophet Joseph Smith and Oliver Cowdery (D&C 110).'
  - where: 'note 9:30 “Moses and Elias”'
    claim: 'They saw and conversed with Moses and Elijah, two translated beings'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'saw and conversed with Moses and Elijah, two translated beings'
  - where: 'note 9:31 “His decease”'
    claim: 'Exodos: exit, departure; in Luke 9:31 the close of one’s career'
    key: thayer
    url: 'https://biblehub.com/greek/1841.htm'
    quote: 'ἔξοδος, ἐξόδου, ἡ (ὁδός), exit, i. e. departure: Hebrews 11:22; metaphorically, ἡ ἔξοδος τίνος the close of one''s career, one''s final fate, Luke 9:31; departure from life, decease: 2 Peter 1:15'
  - where: 'note 9:31 “His decease”'
    claim: 'The JST reading of 9:31 in the Church’s footnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/9?lang=eng'
    quote: 'JST Luke 9:31 … and spake of his death, and also his resurrection, which he …'
  - where: 'note 9:35 “Hear him”'
    claim: 'The Father introduces His Son with few words: the mount, Bountiful, the grove'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'whenever He has introduced His Only Begotten Son to mortals upon the earth, He has done so with remarkably few words. On the Mount of Transfiguration to Peter, James, and John, God said, “This is my beloved Son: hear him.”'
  - where: 'note 9:35 “Hear him”'
    claim: 'The Father commanded them to hear, that is, obey, the Son'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'heard the voice of the Father bearing witness that Jesus is His beloved Son, in whom the Father is pleased, and commanding the brethren to hear (obey) Him.'
  - where: 'note 9:35 “Hear him”'
    claim: 'In Luke the surest witness of the Sonship is from God Himself, at the baptism and the Transfiguration'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'As in the other Synoptics, the surest source of this knowledge is from God himself, who proclaims Jesus his beloved Son at the baptism (Luke 3:22), a point which Luke reinforces with the final entry in Jesus’s genealogy (3:38). This happens again at the transfiguration (9:35).'
  - where: 'note 9:43 “The mighty power of God”'
    claim: 'Megaleiotēs: the majesty of God in Luke 9:43; the visible splendor at the Transfiguration in 2 Peter 1:16'
    key: thayer
    url: 'https://biblehub.com/greek/3168.htm'
    quote: 'greatness, magnificence … the majesty of God, Luke 9:43; τῆς Ἀρτέμιδος, Acts 19:27; of the visible splendor of the divine majesty as it appeared in the transfiguration of Christ, 2 Peter 1:16.'
  - where: 'note 9:51 “He steadfastly set his face”'
    claim: 'Analēmpsis: a taking up, of the ascension'
    key: thayer
    url: 'https://biblehub.com/greek/354.htm'
    quote: 'a taking up: Luke 9:51 (namely, εἰς τόν οὐρανόν of the ascension of Jesus into heaven'
  - where: 'note 9:51 “He steadfastly set his face”'
    claim: 'Analēmpsis occurs only here; can refer to death but points to ascension; the Father takes Him up'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The term is a noun (Greek analēmpsis), appearing only here in the New Testament and meaning a “taking up.” It can refer to Jesus’ death, but it also points to his ascension to glory'
  - where: 'note 9:51 “He steadfastly set his face”'
    claim: 'Stērizō to prosōpon: to set one’s face steadfastly, a Hebrew expression'
    key: thayer
    url: 'https://biblehub.com/greek/4741.htm'
    quote: 'στηρίζω τό πρόσωπον, to set one''s face steadfastly, keep the face turned (Ezekiel 6:2; Ezekiel 13:17; Ezekiel 15:7; etc.) τοῦ πορεύεσθαι εἰς with an accusative of place, a Hebrew expression'
  - where: 'note 9:51 “He steadfastly set his face”'
    claim: 'The verb points to His unshakeable decision; the Old Testament expression also concerns judgment on a city'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The verb (Greek stērizō) has to do with fixing or establishing (see 16:26; 22:32) and points to Jesus’ own unshakeable decision now to turn his attention toward Jerusalem and what awaits him there'
  - where: 'note 9:51 “He steadfastly set his face”'
    claim: 'The words suggest He timed the start of the journey in view of His death'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'These words suggest that Jesus deliberately timed the commencement of his journey in anticipation of his death, which would occur approximately four months later.'
  - where: 'note 9:51 “He steadfastly set his face”'
    claim: 'The journey is not a direct route; a journey of discipleship'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'he does not depict the Savior traveling a direct linear course to Jerusalem. [5] Indeed, the focus of Luke’s travel narrative is not on the geographic details of the route. … His account presents a journey of discipleship'
  - where: 'note 9:53 “They did not receive him”'
    claim: 'Samaritans worshipped on Gerizim and refused the Jerusalem temple; His plan to go to Jerusalem stirred resentment; He did not retaliate'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Jesus’ now public intent to take his ministry to Jerusalem stirs resentment among Samaritans because they, besides intensely disliking and distrusting Jews, worship at their temple on Mount Gerizim'
  - where: 'note 9:53 “They did not receive him”'
    claim: 'The Samaritans deprived them of customary hospitality, provisions and lodging'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Some of the Samaritans, recognizing Jesus and his disciples as Jews, evidently deprived them of customary elements of hospitality, such as provisions and lodging.'
  - where: 'note 9:54 “Even as Elias did”'
    claim: 'The words virtually quote 2 Kings 1:10, 12; omitted by P45 and P75; the brothers may still bear impressions of meeting Elijah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The words of the disciples virtually quote the words of Elijah at 2 Kings 1:10 and 1:12. Some early manuscripts omit these words, including the earliest, P45 and P75.140 If the words are authentic, the brothers who accompany Jesus onto the mount still bear the lingering, bright impressions'
  - where: 'note 9:54 “Even as Elias did”'
    claim: 'Most early manuscripts omit the rebuke’s words and 9:56a; Marcion had them'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Most early manuscripts omit these words as well as Jesus’ next statement and the first sentence in 9:56. … Their presence in Marcion’s early text should caution us against quickly dismissing these words as a later scribe’s additions.'
  - where: 'note 9:54 “Even as Elias did”'
    claim: 'The words mirror 19:10 and breathe the spirit of His teaching'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Whether these words are original or not, they do mirror Jesus’ words spoken to Zacchaeus … Hence, they breathe the spirit of Jesus’ teachings.'
  - where: 'note 9:54 “Even as Elias did”'
    claim: 'The SBL text ends 9:55 at “rebuked them”; the Textus Receptus has the saying'
    key: greek-nt
    url: 'https://biblehub.com/texts/luke/9-55.htm'
    quote: 'SBL Greek New Testament 2010 στραφεὶς δὲ ἐπετίμησεν αὐτοῖς.'
  - where: 'note 9:54 “Even as Elias did”'
    claim: 'Luke’s Jesus will not call down fire, as an instance of His compassion'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'while Jesus is always willing to heal those who needed it (9:11), he will not call down fire upon the Samaritan village that would not receive him'
  - where: 'note 9:57 “I will follow thee”'
    claim: 'Three episodes, each with “follow,” as responses to 9:23, on the way to Jerusalem'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'The word follow occurs in each of the episodes. … It appears Luke included the three episodes as responses to this teaching.'
  - where: 'note 9:57 “I will follow thee”'
    claim: 'The foxes saying: unhinging oneself from this world; concerns not first'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The thrust of these words has to do with unhinging oneself from this world and its usual cares.'
  - where: 'note 9:60 “Let the dead bury their dead”'
    claim: 'Burial of kin a strong duty, even priests permitted defilement (Lev. 21:1–3); Jesus heralds a higher standard'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The duty of burying one’s kindred is strong (see Gen. 50:5) so that even priests, who must remain ritually pure, are permitted to become defiled as they deal with the burial of a relative (see Lev. 21:1–3).'
  - where: 'note 9:60 “Let the dead bury their dead”'
    claim: 'The spiritually dead bury the physically dead'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The meaning points to the spiritually dead burying the physically dead and embraces the principle that those who do not follow Jesus become spiritually extinct'
  - where: 'note 9:60 “Let the dead bury their dead”'
    claim: '“Go thou and preach” is a commissioning of a person outside the Twelve and Seventy'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Third, Jesus’ command frames a calling or commissioning of the person to represent him as a preacher of “the kingdom of God,” carrying the same message that he does'
  - where: 'note 9:60 “Let the dead bury their dead”'
    claim: 'The words do not mean mourning or a funeral is wrong; devotion to the Lord is highest priority'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'In either case, the Savior’s words do not mean it is wrong to mourn the loss of a loved one or give proper respect at a funeral. Rather, they emphasize that devotion to the Lord is a disciple’s highest priority.'
  - where: 'note 9:62 “Hand to the plough”'
    claim: 'Hunter: the plowman keeps his eyes ahead; looking back makes crooked furrows'
    key: hunter-living-member
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1987/04/am-i-a-living-member?lang=eng'
    quote: 'To dig a straight furrow, the plowman needs to keep his eyes on a fixed point ahead of him. That keeps him on a true course. If, however, he happens to look back to see where he has been, his chances of straying are increased.'
  - where: 'note 9:62 “Hand to the plough”'
    claim: 'Bid farewell (apotassō) points to a farewell celebration; Elisha precedent in 1 Kings 19:20–21; Jesus tightens the bond'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The person might be thinking that scripture sets the precedent when Elijah permits Elisha to return home to say farewell to his family members and to celebrate his calling by sharing a sacred meal (see 1 Kgs. 19:20–21). But Jesus will tighten the knot'
  - where: 'note 9:62 “Hand to the plough”'
    claim: 'The lesson: follow the Savior who set His face toward Jerusalem and did not look back'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'The lesson for this man was simply to follow the example of the Savior, who “stedfastly set his face to go to Jerusalem” (Luke 9:51) and did not look back.'
  - where: christ
    claim: 'JST Matthew 16:26 defines taking up the cross'
    key: jst-matt-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/16?lang=eng'
    quote: 'And now for a man to take up his cross, is to deny himself all ungodliness, and every worldly lust, and keep my commandments.'
  - where: christ
    claim: 'Hunter: the plowman’s eyes ahead; energies focused ahead, on eternal life and the joy of salvation'
    key: hunter-living-member
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1987/04/am-i-a-living-member?lang=eng'
    quote: 'If our energies are focused not behind us but ahead of us—on eternal life and the joy of salvation—we assuredly will obtain it.'
  - where: explore
    claim: 'D&C 63:20–21 refers to the Transfiguration and the earth’s future transfiguration'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Plainly, the experience of the three Apostles embraces a stunning vision of the eventual transfiguration of the earth, a vision that the New Testament Gospels do not report.'
  - where: 'setting'
    claim: 'Many teachings unique to Luke appear in the travel account'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Many of the Savior’s teachings that are unique to Luke’s Gospel appear in this travel account.'
  - where: 'setting'
    claim: 'Luke tells John’s death only in Herod’s words, having told the imprisonment at 3:20'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'But unlike Mark, Luke does not now write an extended account about John’s imprisonment and death, leaving this to a summarizing note in 3:20 and to Herod’s words about executing the Baptist.'
  - where: 'thread'
    claim: 'He feeds the five thousand as Jehovah nourished Israel in the wilderness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'he is the one who feeds the five thousand, much as Jehovah nourishes the Israelites in the wilderness (see 9:12–17); he is the one who will suffer death and then rise again (see 9:22, 44)'
  - where: 'thread'
    claim: 'The Twelve depart immediately on their missions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'we are to understand these sayings within the sharp demands on true disciples that appear in the unstinting responses of the Twelve who receive their charge and depart immediately on their missions (see 9:6).'
  - where: 'note 9:31 “His decease”'
    claim: 'The footnote glosses “decease” as departure'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/9?lang=eng'
    quote: '31b “decease”: GR departure.'
  - where: 'note 9:51 “He steadfastly set his face”'
    claim: 'The verb is used of the Ascension; the Father takes Him up'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'as its verb indicates in other contexts (see Acts 1:2, 11, 22; 1 Tim. 3:16).133 Literally speaking, both the noun and the verb point to another person taking Jesus up, namely, his Father, rather than Jesus exalting himself.'
  - where: 'note 9:51 “He steadfastly set his face”'
    claim: 'Jesus marks the path of discipleship by word and deed'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'His account presents a journey of discipleship in which Jesus Christ marks the path by both word and deed.'
  - where: 'note 9:57 “I will follow thee”'
    claim: 'The first man’s words are exactly right for one who seeks to be a disciple'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'I will follow thee whithersoever thou goest: The person’s expression is exactly right for one who seeks to be a disciple'
  - where: 'note 9:5 “Shake off the very dust”'
    claim: 'Without money, clothes or provisions the missionary depended wholly on hospitality'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Hospitality was to play a fundamental role in the missionary effort, as is witnessed by Christ’s instructions that the missionary was to travel without money, extra clothes, and particularly provisions. Thus the missionary was entirely dependent upon the hospitality of strangers for sustenance.'
  - where: 'note 9:3 “Neither staves”'
    claim: 'Without money, clothes or provisions the missionary depended wholly on hospitality'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Thus the missionary was entirely dependent upon the hospitality of strangers for sustenance.'
  - where: 'christ'
    claim: '“Daily”: discipleship does not expire'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'daily: Only Luke preserves this expression, indicating that a person’s discipleship does not expire, or wax and wane. Constancy is key.'
  - where: 'christ'
    claim: 'The Transfiguration framed between the prophecies of His death'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'By doing so, Luke frames the Transfiguration between two important prophecies of Jesus’ divine fate (see 9:22, 44)'
  - where: 'note 9:24 “Willing to lose it”'
    claim: 'JST Luke 9:24'
    key: jst-luke-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/9?lang=eng'
    quote: 'For whosoever will save his life, must be willing to lose it for my sake; and whosoever will be willing to lose his life for my sake, the same shall save it.'
  - where: 'note 9:24 “Willing to lose it”'
    claim: 'JST Luke 9:25'
    key: jst-luke-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/9?lang=eng'
    quote: 'For what doth it profit a man if he gain the whole world, and yet he receive him not whom God hath ordained, and he lose his own soul, and he himself be a castaway?'
  - where: 'note 9:62 “Hand to the plough”'
    claim: 'Hunter on the plowman, in full'
    key: hunter-living-member
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1987/04/am-i-a-living-member?lang=eng'
    quote: 'To dig a straight furrow, the plowman needs to keep his eyes on a fixed point ahead of him. That keeps him on a true course. If, however, he happens to look back to see where he has been, his chances of straying are increased. The results are crooked and irregular furrows.'
  - where: 'note 9:1 “Power and authority”'
    claim: 'Power (dunamis) is the capacity, authority (exousia) the right to act; compare Luke 10:19'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/9.htm'
    quote: 'and gave them power and authority] Power (dunamis) is the capacity, and authority (exousia), the right to act. See Luke 10:19; Revelation 13:7.'
  - where: 'note 9:1 “Power and authority”'
    claim: 'Matthew 10:1 and Mark 6:7 have exousia over unclean spirits'
    key: thayer
    url: 'https://biblehub.com/greek/1849.htm'
    quote: 'ἐξουσία τίνος, the genitive of the object, authority (to be exercised) over, as τῶν πνευμάτων τῶν ἀκαθάρτων, Mark 6:7; with ὥστε ἐκβάλλειν αὐτά added, Matthew 10:1'
  - where: 'note 9:9 “Who is this?”'
    claim: 'Herod, who gave the order, heard of Jesus with fear from guilt'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Herod Antipas, who had given the fatal order, trembled in his palace. He heard, with fear due to inward conviction of guilt, of the marvelous work wrought by Jesus'
  - where: 'note 9:9 “Who is this?”'
    claim: 'The courtiers suggested Elijah or another prophet'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'His fawning courtiers essayed to allay his fears by saying that Jesus was Elijah, or some other of the prophets'
  - where: 'note 9:9 “Who is this?”'
    claim: 'Why Herod desired to see Jesus'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Herod desired to see Jesus; perhaps through the fascination of fear, or with the faint hope that sight of the renowned Prophet of Nazareth might dispel his superstitious dread that the murdered John had returned to life.'
  - where: 'note 9:9 “Who is this?”'
    claim: '“Appeared” used of Elijah because of his translation; Malachi 4:5'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/9.htm'
    quote: '8. that Elias had appeared] In accordance with the prophecy of Malachi 4:5. The verb “appeared” is used instead of ‘risen again,’ because of Elijah’s translation to heaven.'
  - where: 'note 9:13 “Give ye them to eat”'
    claim: 'The loaves seem to have been the apostles’ own food; barley loaves the food of the poor'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/9.htm'
    quote: 'evidently this was the food which they had brought for their own supply, and it proves their simplicity of life, for barley loaves (John 6:9) are the food of the poor'
  - where: 'note 9:13 “Give ye them to eat”'
    claim: 'Creative power; the leftovers exceeded the original store'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It was a manifestation of creative power, by which material elements were organized and compounded to serve a present and pressing need. The broken but unused portion exceeded in bulk and weight the whole of the original little store.'
  - where: 'note 9:13 “Give ye them to eat”'
    claim: 'Disciples with talents like five loaves offer them to the Savior to feed the multitudes'
    key: faust-five-loaves
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1994/04/five-loaves-and-two-fishes?lang=eng'
    quote: 'Today I would like to speak of those of us who have only talents equal to five loaves and two fishes to offer the Savior to help feed the multitudes.'
  - where: 'note 9:13 “Give ye them to eat”'
    claim: 'Under the Master’s touch they bless thousands; ego and pride stand in the way'
    key: faust-five-loaves
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1994/04/five-loaves-and-two-fishes?lang=eng'
    quote: 'What makes it possible, under the Master’s touch, for them to serve, lift, and bless so that they touch for good the lives of hundreds, even thousands? After a lifetime of dealing in the affairs of men and women, I believe it is the ability to overcome personal ego and pride'
  - where: 'note 9:18 “Alone praying”'
    claim: 'Luke stresses Jesus’s prayer (3:21; 5:16; 6:12); what follows as the result of the prayer'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/9.htm'
    quote: 'As he was alone praying.—There is, as before (see Introduction, and Notes on Luke 3:21; Luke 5:16; Luke 6:12), something characteristic in the stress which St. Luke lays on the fact. It is as though he saw in what follows the result of the previous prayer.'
  - where: 'note 9:23 “Take up his cross daily”'
    claim: 'The cross as an invitation to discipleship (Luke 9:23; 14:27)'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'During his mortal ministry, Jesus frequently used the invitation to take up one’s cross as a symbol for an invitation to discipleship (Matthew 10:38, 16:34; Mark 8:34, 10:21; Luke 9:23, 14:27).'
  - where: 'note 9:23 “Take up his cross daily”'
    claim: 'Self-denial is submitting the will to the Father (Luke 22:42); the hearers knew what crucifixion cost'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'It is about being able, like Jesus, to submit our will to the will of the Father (see Mosiah 15:7; Luke 22:42). Everyone who heard Jesus compare discipleship to the cross would have understood the impact of his teaching because of their familiarity with what crucifixion cost.'
  - where: 'note 9:24 “Willing to lose it”'
    claim: 'Psychē: earthly life in one half of the saying, the blessed life of the kingdom in the other (Luke 9:24)'
    key: thayer
    url: 'https://biblehub.com/greek/5590.htm'
    quote: 'designate as ψυχή in one of the antithetic members the life which is lived on earth, in the other, the (blessed) life in the eternal kingdom of God: Matthew 10:39; Matthew 16:25; Mark 8:35-37; Luke 9:24'
  - where: 'note 9:24 “Willing to lose it”'
    claim: 'JST Luke 9:25: receiving him whom God hath ordained clarifies Jesus’s role in salvation and the source of His authority'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'Luke 9:25 to be saved, we must receive him “whom God hath ordained,” both clarifying Jesus’s role in our salvation and the source of his authority (ties back to 8:1)'
  - where: 'note 9:24 “Willing to lose it”'
    claim: 'JST Luke 8:1: the Twelve ordained by Jesus'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'Luke 8:1 the twelve were ordained by Jesus (a physical act not mentioned elsewhere, showing Jesus’s authority in the priesthood)'
  - where: 'note 9:27 “Some standing here”'
    claim: 'The coming in glory is future; John’s life a partial fulfillment'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The event referred to, that of the Son of Man coming in the glory of His Father attended by the angels, is yet future. At least a partial fulfillment of the prediction is presented in the prolongation of the life of John the apostle, who was there present, and who yet lives in the flesh according to his desire'
  - where: 'note 9:27 “Some standing here”'
    claim: 'JST Luke 9:26 in the footnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/9?lang=eng'
    quote: 'JST Luke 9:26 … when he shall come in his own kingdom, clothed in the glory of his Father, with the holy angels.'
  - where: 'note 9:28 “About an eight days”'
    claim: 'Six days exclusive, eight inclusive of the two days; no discrepancy'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'It is probable that the six-day period was meant to be exclusive of the day on which the earlier events had occurred and of that on which Jesus and the three apostles retired to the mountain; and that Luke’s “about an eight days” was made to include these two days.'
  - where: 'note 9:28 “About an eight days”'
    claim: 'Inclusive reckoning, the same as six days; explains Matthew 27:63'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/9.htm'
    quote: 'This is merely the inclusive reckoning which St Luke saw in his written sources, and means exactly the same thing as “after six days” in Mark 9:2. (This explains Matthew 27:63.)'
  - where: 'note 9:28 “About an eight days”'
    claim: 'The Transfiguration as Tabernacles approached; Peter’s tabernacles suggest it'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'The transfiguration event seems to have occurred as the Feast of Tabernacles approached. The chief apostles wanted to craft three tabernacles for Jesus, Moses, and Elijah as the ancient prophets departed, which suggests they recognized the approach of the feast (Luke 9:33).'
  - where: 'note 9:28 “About an eight days”'
    claim: 'Booths at the feast for devotion; Peter’s purpose to delay the visitants'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'at the annual feast of Tabernacles, it was customary to erect a little bower, or booth of wattled boughs, for each individual worshiper, into which he might retire for devotion. So far as there was a purpose in Peter’s proposition, it seems to have been that of delaying the departure of the visitants.'
  - where: 'note 9:31 “His decease”'
    claim: 'Only Luke mentions the subject; the decease He should accomplish, not a death suffered; the word connotes exodus or departure'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'It is significant that the decease, which the Lord should accomplish, not the death that He should suffer or die, was the subject of that exalted communion. The Greek word of which “decease” appears as the English equivalent in many of the MSS. of the Gospels is one connoting “exodus” or “departure,”'
  - where: 'note 9:31 “His decease”'
    claim: 'Only Luke tells what they spoke of'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'Of the three synoptists, Luke alone makes even brief mention of the matter upon which Moses and Elijah conversed with the Lord at the Transfiguration.'
  - where: 'note 9:31 “His decease”'
    claim: '“Accomplish”: completion of an undertaking, not the act of dying'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'So also the Greek original of “accomplish,” in the account of the Transfiguration, connotes the successful filling out or completion of a specific undertaking, and not distinctively the act of dying.'
  - where: 'note 9:31 “His decease”'
    claim: 'The consummation recognized in the law and the prophets; a voluntary, foreordained surrender'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'a consummation recognized in the law (personified in Moses) and the prophets (represented by Elijah)'
  - where: 'note 9:31 “His decease”'
    claim: 'The decease a voluntary surrender of His life, foreordained'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The decease that the Savior was then so soon to accomplish was the voluntary surrender of His life in fulfillment of a purpose at once exalted and foreordained'
  - where: 'note 9:32 “Heavy with sleep”'
    claim: 'The apostles had fallen asleep and were awakened by the splendor'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The apostles had fallen asleep, but were awakened by the surpassing splendor of the scene, and gazed with reverent awe upon their glorified Lord.'
  - where: 'note 9:32 “Heavy with sleep”'
    claim: 'The Greek: starting into full wakefulness in the middle of the vision'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/9.htm'
    quote: 'The word diagregoresanies does not here mean ‘having kept awake,’ but (to give the full force of the compound and aorist) suddenly starting into full wakefulness. They started up, wide awake after heavy sleep, in the middle of the vision.'
  - where: 'note 9:32 “Heavy with sleep”'
    claim: 'The same three at Jairus’s house and in Gethsemane'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'had been similarly chosen as witnesses of a special manifestation, that of the raising of the daughter of Jairus (Mark 5:37; Luke 8:51); and, later, the same three were the sole witnesses of our Lord’s night agony in Gethsemane'
  - where: 'note 9:43 “The mighty power of God”'
    claim: 'The footnote glosses “mighty power” as majesty, glory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/9?lang=eng'
    quote: '“mighty power”: GR majesty, glory.'
  - where: 'note 9:45 “It was hid from them”'
    claim: 'Their failure to comprehend: terror and the mind’s reluctance'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The thought of what the Lord’s words might mean, even in its faintest outline, was terrifying to those devoted men; and their failure to comprehend was in part due to the fact that the human mind is loath to search deeply into anything it desires not to believe.'
  - where: 'note 9:45 “It was hid from them”'
    claim: 'Their incapacity contrasted with later knowledge, the change wrought by the Resurrection and the Spirit'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/9.htm'
    quote: '45. they understood not] This ignorance and incapacity, so humbly avowed, should be contrasted with the boldness and fulness of their subsequent knowledge as one of the strongest proofs of the change wrought in them by the Resurrection and the Descent of the Holy Spirit.'
  - where: 'note 9:45 “It was hid from them”'
    claim: 'The footnote at 9:45 gives John 12:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/9?lang=eng'
    quote: '“understood”: John 12:16.'
  - where: 'note 9:48 “The least among you”'
    claim: 'The disciples did not understand how suffering fit His mission; they expected David’s throne'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'The disciples do not yet seem to have understood how the distressing suffering, death, and resurrection of the Master fit in to his Messianic mission (Matthew 17:23; Mark 9:32; Luke 9:45). They likely expected him to take the throne of David and establish a political kingdom.'
  - where: 'note 9:48 “The least among you”'
    claim: 'They may have argued about their places in the kingdom'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'The disciples were possibly arguing about their place in the hierarchal structure of this earthly kingdom.'
  - where: 'note 9:48 “The least among you”'
    claim: 'Leaders are to serve, not be served'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'he emphasized the principle that those who are called to lead are to serve, not that leaders are to be served'
  - where: 'note 9:48 “The least among you”'
    claim: '“Is great”: greatness attained in and by the humiliation, not deferred'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/9.htm'
    quote: 'The better MSS. give, “the same is great,” the greatness not being thrown forward as a compensation to be received in the far-off future, but thought of as actually attained in the midst of, and by means of, the seeming humiliation.'
  - where: 'note 9:50 “Forbid him not”'
    claim: 'John’s question suggested by “in my name”'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/9.htm'
    quote: 'This sudden question seems to have been suggested by the words “in my name” which Jesus had just used.'
  - where: 'note 9:50 “Forbid him not”'
    claim: 'A believer, perhaps of the class from which the Seventy were chosen; the not-opposed tentatively on His side'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'he was certainly a believer in Christ, and may have been one of the class from which the Lord was soon to select and commission special ministers and the Seventy. In the state of divided opinion then existing among the people concerning Jesus, it was fair to say that all who were not opposed to Him were at least tentatively on His side.'
  - where: 'note 9:32 “Heavy with sleep”'
    claim: 'Diagrēgoreō in Luke 9:32: to remain awake, overcoming sleep; others read it to be fully awake'
    key: thayer
    url: 'https://biblehub.com/greek/1235.htm'
    quote: 'to remain awake: Luke 9:32 (for they had overcome the force of sleep, with which they were weighed down, βεβαρημένοι ὕπνῳ); (others (e. g., R. V. text) to be fully awake'
  - where: 'note 9:60 “Let the dead bury their dead”'
    claim: 'Secondary burial: a year later the bones were placed in an ossuary'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'After preparing a body for burial and placing it in a tomb, family members typically returned a year later to place the bones in a stone box called an ossuary'
  - where: 'note 9:60 “Let the dead bury their dead”'
    claim: 'If he meant a secondary burial, he put a custom ahead of walking to Jerusalem with the Son of God'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'If the disciple in this case was speaking of a secondary burial rather than an urgent need to care for the body of his recently deceased father, then his request demonstrated a desire to prioritize a cultural tradition over a singular opportunity to walk to Jerusalem with the Son of God'
