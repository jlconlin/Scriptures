    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'for such a one uses to advantage the means entrusted to his care, while “from him that hath not, even that he hath shall be taken away from him”; for he has demonstrated his utter unfitness to possess and use aright.'
  - where: 'note 19:26 “Unto every one which hath”'
    claim: 'JST Luke 19:25 in the footnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/19?lang=eng'
    quote: 'JST Luke 19:25 … who occupieth, shall be given; and from him who occupieth not, even that he hath received shall be taken away from him.'
  - where: 'note 19:26 “Unto every one which hath”'
