    quote: 'it is required of the Lord, at the hand of every steward, to render an account of his stewardship, both in time and in eternity.'

  # ---- added rows
  - where: when
    claim: 'The Passover was about a week ahead'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'probably made up largely of travelers on their way to Jerusalem to attend the Passover festival, the time for which was about a week ahead'
  - where: setting
    claim: 'Mark has Jesus go out to Bethany after the entry and return on the morrow, when He clears the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/11?lang=eng'
    quote: 'And on the morrow, when they were come from Bethany, he was hungry'
  - where: setting
    claim: 'In Matthew and Luke the clearing of the temple comes right after the entry'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'The traditional name for this episode, the “cleansing of the temple,” works well in Matthew and Luke: coming right after the triumphal entry'
  - where: explore
    claim: 'Huntsman’s chapter reads the entry beside David'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Jesus’s acts mirror David’s in reverse order.'
  - where: explore
    claim: 'Huntsman’s chapter reads the entry beside Solomon and Zechariah 9:9'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'King Solomon also rode his donkey at the base of the Mount of Olives, where he was anointed king over Israel (1 Kgs 1:32–37).'
  - where: 'note 19:3 “To see Jesus who he was”'
    claim: 'Luke gives no reason for Zacchaeus’s desire; perhaps curiosity, more likely awareness that Jesus welcomes tax collectors like Levi'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Luke does not offer any reason for Zacchaeus’s desire. Perhaps he is curious; more likely, he is aware somehow that Jesus welcomes tax collectors like Levi'
  - where: 'note 19:2 “Chief among the publicans”'
    claim: 'Jericho’s balsam and spice trade kept a customs office there'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'the abundance of its commercial products, particularly balsam and spices, led to the maintenance of a customs office there, over which Zaccheus seems to have presided'
  - where: 'note 19:2 “Chief among the publicans”'
    claim: 'Publicans bid as a body for the right to collect indirect taxes on purchases and leases for Rome'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'He and his fellow publicans, in a corporate effort, bid on the right to collect what are termed “indirect taxes” for the Roman government, that is, taxes on all purchases and leases'
  - where: 'note 19:12 “A nobleman in a far country”'
    claim: 'Jericho remembered Archelaus, who refurbished its palace'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'People in Jericho will remember him as the ruler of Judea who refurbishes the palace in Jericho and whom the Romans later remove from power (4 BC–AD 6).'
  - where: 'note 19:12 “A nobleman in a far country”'
    claim: 'Opponents sent an embassy of fifty to Rome; the citizens’ “message” fits it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'we know that opponents sent an embassy of fifty persons to Rome to try to persuade Augustus not to take such action'
  - where: 'note 19:13 “Ten pounds”'
    claim: 'Luke’s differences from Matthew: napkin vs burying, cities vs joy, enemies'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'In Luke, the faithful servants are rewarded with stewardships over cities; in Matthew, they enter “into the joy of [their] lord”'
  - where: 'note 19:26 “Unto every one which hath”'
    claim: '“Occupy” means engage in business'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Engage in business until I return.'
  - where: 'note 19:46 “A den of thieves”'
    claim: 'Luke’s description lacks the detail of the other reports'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Luke’s description of those whom Jesus confronts on the temple grounds lacks the detail of other reports'
  - where: 'note 19:46 “A den of thieves”'
    claim: 'Those who manage temple affairs hide behind its walls as in a den and carry guilt into the temple'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'those who manage temple affairs and pursue their business within its walls, hiding behind the façade of the temple’s walls as if out of sight in a den or cave, carry a staining guilt into the temple'
  - where: 'note 19:46 “A den of thieves”'
    claim: 'Jeremiah’s words are reflected in Jesus’s warning of 19:42–44'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Not incidentally, Jeremiah’s words are reflected in Jesus’ warning (see 19:42–44) and in his actions (see 19:45)'
  - where: 'note 19:47 “The chief of the people”'
    claim: 'All the people hung on Him as they listened'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'And they did not find what they might do, for all the people hung on him as they listened.'
  - where: 'note 19:43 “A trench about thee”'
    claim: 'Titus’s troops breached the temple walls, stormed it, captured the city and leveled it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'after Titus’s troops breach the temple walls and storm the edifice and then capture the city, they will “lay thee [Jerusalem] even with the ground” (19:44)'
  - where: 'note 19:41 “He wept over it”'
    claim: 'Only Luke adds the lament over Jerusalem to the entry'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Luke differs from the other Synoptics in that he adds a lament over Jerusalem by Jesus even as he approaches the city, adding a note of sadness or passion to an otherwise joyful episode.'
  - where: 'note 19:8 “I restore him fourfold”'
    claim: 'These were works meet for repentance'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'These were works meet for repentance.'
