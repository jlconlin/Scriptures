chapter: 19
claims:
  # ---- when, setting, thread
  - where: setting
    claim: 'Luke’s final trek runs from 9:51 until Jesus reaches the outskirts of Jerusalem at 19:28'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Luke illustrates this in his account of the Savior’s final trek to Jerusalem, which begins in Luke 9:51 and continues until Jesus arrives at the outskirts of Jerusalem in Luke 19:28.'
  - where: setting
    claim: 'Jericho, under fifteen miles northeast of Jerusalem and below sea level, was an important city with a customs office for its balsam and spices; hence “ascending up to Jerusalem”'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'In the time of Christ, Jericho was an important city; and the abundance of its commercial products, particularly balsam and spices, led to the maintenance of a customs office there, over which Zaccheus seems to have presided.'
  - where: setting
    claim: 'The crowd with Jesus was made up largely of Passover pilgrims, about a week before the feast'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'probably made up largely of travelers on their way to Jerusalem to attend the Passover festival, the time for which was about a week ahead'
  - where: setting
    claim: 'Only Luke adds the lament over Jerusalem to the entry, a note of sadness in a joyful episode'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Luke differs from the other Synoptics in that he adds a lament over Jerusalem by Jesus even as he approaches the city, adding a note of sadness or passion to an otherwise joyful episode.'
  - where: thread
    claim: 'The chapter turns on respect for the master: Zacchaeus and the colt’s owners receive Him; the parable’s servant and citizens and Jerusalem do not'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'In a couple of instances—the story of Zacchaeus (see 19:1–10) and the fetching of the colt (see 19:29–35)—the results of showing respect are very positive for the obedient believer. In other instances wherein respect is minimal or nonexistent, the results are not'
  - where: thread
    claim: '“This day” marks a significant moment the Savior brings, as with salvation for Zacchaeus'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The Greek term sēmeron (“today”) is emphatic and, as in some of its other occurrences, points to the arrival of a significant moment initiated by the Savior, in this case salvation'
  - where: thread
    claim: 'Jesus comes to the city under praise but is soon rejected by its officials: the visitation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'In Jesus’ case, he approaches his visit to the city under the promising banner of praise (see 19:38) but is soon rejected by officials of Jerusalem'

  # ---- Zacchaeus
  - where: 'note 19:2 “Chief among the publicans”'
    claim: 'Zacchaeus’s office was supervisory: part of his income came from the collectors under him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'This office, attested only here in ancient literature and held by Zacchaeus (Greek architelōnēs), is supervisory in character and means that he does not make all of his money directly from taxpayers but, in part, from the tax collectors who work under his supervision'
  - where: 'note 19:2 “Chief among the publicans”'
    claim: 'Publicans represented Roman interests and were despised, even judged unclean'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Because publicans represent Roman interests, they are despised and even judged by some to be ceremonially unclean.'
  - where: 'note 19:2 “Chief among the publicans”'
    claim: 'Publicans were detested'
    key: bd-publicans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/publicans?lang=eng'
    quote: 'Both classes were detested by the Jews, and any Jew who undertook the work was excommunicated.'
  - where: 'note 19:2 “Chief among the publicans”'
    claim: 'Zacchaeus’s name, a variant of Zacharias, shows he was a Jew; his rank made him particularly obnoxious to his people'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'That Zaccheus was a Jew is indicated by his name, which is a variant of “Zacharias,” with a Greek or Latin termination; he must have been particularly obnoxious to his people on account of his advanced status among the publicans'
  - where: 'note 19:3 “To see Jesus who he was”'
    claim: 'The story is full of verbs of sight; it concerns spiritual sight and ties to the blind man healed on the way into town'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Plainly, the account has to do with spiritual sight, “to see Jesus who he [is],” and purposefully ties to the temporary blindness of the man whom Jesus heals on his way into town (see 18:35–43).'
  - where: 'note 19:3 “To see Jesus who he was”'
    claim: 'The crowd may have refused to let a disliked tax collector through'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'On another, because he is disliked as a tax collector, people in the crowd apparently refuse to allow him to squeeze between them even for a peek.'
  - where: 'note 19:3 “To see Jesus who he was”'
    claim: 'The sycomore is the sycamore fig, not the mulberry, common in level areas and in New Testament Jericho'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Luke has in mind the sycamore fig (Greek sykomorea), not the mulberry (see the Note on 17:6). This tree is common in level areas of ancient Palestine; New Testament Jericho, with its open areas in the town, supports this tree.'
  - where: 'note 19:3 “To see Jesus who he was”'
    claim: 'Zacchaeus’s desire was likely more than curiosity: he had been set thinking by what he heard'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'He had a great desire to see Jesus; the feeling was not one of mere curiosity; he had been impressed and set thinking by the things he had heard about this Teacher from Nazareth.'
  - where: 'note 19:7 “They all murmured”'
    claim: 'All publicans were sinners in Jewish eyes'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'for all publicans were sinners in Jewish eyes, and Zaccheus admitted that the opprobrium in his case was possibly deserved'
  - where: 'note 19:7 “They all murmured”'
    claim: 'The verb for murmuring echoes Israel’s murmuring in the wilderness, and reduces the Savior’s motives'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The verb (Greek diagonguzō), of course, nods toward the murmuring of the children of Israel in the Sinai wilderness'
  - where: 'note 19:8 “I restore him fourfold”'
    claim: 'Zacchaeus stands as an accused man before a judge; his defense resembles Samuel’s (1 Sam. 12:1–3)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Zacchaeus’s act (Greek histēmi) reminds one of a court of law wherein the accused stands, or is caused to stand, before a council or judge, in this case Jesus'
  - where: 'note 19:8 “I restore him fourfold”'
    claim: 'The defense resembles Samuel’s and others in scripture'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'From Zacchaeus’s defense here against criticism, which resembles other defenses known from scripture (see Gen. 31:36–42; 1 Sam. 12:1–3; Mosiah 2:9–22)'
  - where: 'note 19:8 “I restore him fourfold”'
    claim: 'Zacchaeus’s generosity contrasts with the rich ruler of 18:22–23'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The despised one, Zacchaeus, is generous; the respected one, the ruler, is not.'
  - where: 'note 19:8 “I restore him fourfold”'
    claim: 'The Joseph Smith Translation reads “by unjust means” for “by false accusation”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'This expression is changed in the Joseph Smith Translation to read “by unjust means,” broadening the grounds for Zacchaeus’s restoring actions; he does not wait until someone brings forward an accusing complaint.'
  - where: 'note 19:8 “I restore him fourfold”'
    claim: 'The law asks fourfold or fivefold in some cases (Ex. 22:1) and the principal plus a fifth in others (Lev. 6:5); Zacchaeus adopts the steeper rate'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Zacchaeus adopts the steeper rate so that, when he discovers any case of misconduct that may tie to him, he stands beyond reproach'
  - where: 'note 19:8 “I restore him fourfold”'
    claim: 'Fourfold and fivefold in Ex. 22:1 and 2 Sam. 12:6; the fifth part in Lev. 6:5; Samuel’s “whom have I defrauded?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'he shall restore five oxen for an ox, and four sheep for a sheep.'
  - where: 'note 19:8 “I restore him fourfold”'
    claim: 'His pledge was in line with the law of restitution but far beyond it: works meet for repentance'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'His pledge to restore in fourfold measure Whatever he had wrongfully acquired was in line with the Mosaic law as to restitution, but far in excess of the recompense required.'
  - where: 'note 19:10 “To seek and to save that which was lost”'
    claim: 'The saying sums up the ministry away from Jerusalem and ties to the rescuing shepherd of Ezekiel 34'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Jesus’ sweeping statement can be read as a grand summation of his entire ministry, bringing closure to his work away from the capital city.'
  - where: 'note 19:10 “To seek and to save that which was lost”'
    claim: 'Ezekiel 34’s rescuing shepherd stands behind the saying'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'including its ties to the prophecy about the rescuing shepherd in Ezekiel 34'
  - where: 'note 19:10 “To seek and to save that which was lost”'
    claim: 'Zacchaeus is another lost sheep, treasure and son returned, as in Luke 15'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Another stray sheep had been returned to the fold; another lost treasure had been found; another wayward son had come back to the Father’s house.'
  - where: 'note 19:10 “To seek and to save that which was lost”'
    claim: 'Ezekiel 34:16: “I will seek that which was lost”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'I will seek that which was lost, and bring again that which was driven away'

  # ---- the pounds
  - where: 'note 19:11 “The kingdom of God should immediately appear”'
    claim: 'Many with Him expected a proclamation of His royal authority at Jerusalem'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Many of those with Him were looking for a proclamation of His royal authority and “they thought that the kingdom of God should immediately appear.”'
  - where: 'note 19:11 “The kingdom of God should immediately appear”'
    claim: 'The parable’s point: no immediate temporal kingdom; the king will go away and surely return'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'The people were not to look for an immediate establishment of the kingdom in temporal power. He who would be king was pictured as having departed for a far country from which he would assuredly return.'
  - where: 'note 19:11 “The kingdom of God should immediately appear”'
    claim: 'Luke’s comment frames the parable: the kingdom is not to be immediate; it also concerns stewardship as Jesus approaches a city with corrupt stewards'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'That is, the fundamental interpretation of the parable is that the Second Coming of Christ and the kingdom is not to be immediate. But a careful reading of the parable links it rather naturally to the issue of righteous and unrighteous stewardship'
  - where: 'note 19:11 “The kingdom of God should immediately appear”'
    claim: 'The gap between departure and return is when the servants’ commitment shows; disciples are to engage in His work until His return'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Thus, Jesus not only corrects the mistaken belief that the kingdom is to “immediately appear” in dramatic fashion (19:11) but also sketches out a picture of responsibility: that his disciples are to engage themselves in his work until his return.'
  - where: 'note 19:12 “A nobleman in a far country”'
    claim: 'The nobleman may recall Archelaus, who went to Rome after Herod’s death in 4 BC to receive the office of king'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'After the death of his father Herod in 4 BC, Archelaus goes to Rome to receive the office of king from Augustus, the emperor, though he does not succeed.'
  - where: 'note 19:12 “A nobleman in a far country”'
    claim: 'Archelaus received the title ethnarch, not king'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'But at first, Archelaus receives the title ofethnarch from the emperor Augustus, who promises the title of king after a demonstration of the ability to rule.'
  - where: 'note 19:12 “A nobleman in a far country”'
    claim: 'The similarities to Archelaus are few and limited'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Hence, it is reasonable to see the rise to power of Archelaus, son of Herod, informing elements in the story, particularly those that have to do with the nobleman who receives his authority in “a far country” (19:12) and who then must deal with detractors who seek to undermine his appointment (see 19:14). But the similarities are few and limited.'
  - where: 'note 19:12 “A nobleman in a far country”'
    claim: 'A Jewish embassy of fifty went to Rome while Archelaus was there'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-17.html'
    quote: 'For an ambassage of the Jews was come to Rome; Varus having permitted the nation to send it; that they might petition for the liberty of living by their own laws. 22 Now the number of the ambassadors that were sent by the authority of the nation was fifty.'
  - where: 'note 19:12 “A nobleman in a far country”'
    claim: 'Such a departure to seek kingship and the citizens’ protest were fresh in the hearers’ minds; Christ is the nobleman'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'The departure of a certain nobleman from a vassal province to the court of the suzerain to seek investiture of kingly authority, and the protest of the citizens over whom he asserted the right to reign, were incidents of Jewish history still fresh in the minds of the people to whom Christ spoke.'
  - where: 'note 19:12 “A nobleman in a far country”'
    claim: 'Christ is the nobleman who returns to require an accounting'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'The fact is apparent that Christ was the nobleman who was to be invested with the authority of kingship, and who would return to require the accounting at the hands of His trusted servants.'
  - where: 'note 19:17 “Authority over ten cities”'
    claim: 'The servant becomes a ruling regent; his responsibilities are not reduced but his opportunities increased; this life leads to rewards in the next'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'On another level, the master does not reduce the responsibilities of the servant, but increases his opportunities for service.'
  - where: 'note 19:17 “Authority over ten cities”'
    claim: 'The extra pound is minor beside ten cities'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'the amount of extra money that he receives, one pound, is a very minor amount when compared to the ten cities that he receives'
  - where: 'note 19:17 “Authority over ten cities”'
    claim: 'The reward was one only a sovereign could give; the second servant rewarded in proportion'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'he was commended and received a reward such as only a sovereign could give, the governorship of ten cities. The second servant, with equal capital had increased it only five fold; he was properly rewarded in proportion'
  - where: 'note 19:27 “Slay them before me”'
    claim: 'Archelaus treated his subjects with great brutality on his return; spiritually, the outcome may reflect the final judgment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'although Archelaus treats subjects on his return “with great brutality.”65 If Jesus has a spiritual situation in mind, the final outcome is still harsh, an outcome that may reflect the final judgment against the wicked.'
  - where: 'note 19:27 “Slay them before me”'
    claim: 'It may be a metaphor for Him turning the tables on those who hate Him, even in light of His prayer for their forgiveness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'If this person represents the Savior, it may be a metaphor for him eventually turning the tables on those who hate him and seek his life, even in light of his prayer for their forgiveness (see 23:34).'
  - where: 'note 19:27 “Slay them before me”'
    claim: 'Archelaus’s horsemen slew three thousand at the festival'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-17.html'
    quote: 'So he sent out the whole army upon them, and sent the horsemen to prevent those that had their tents without the temple, from assisting those that were within the temple, and to kill such as ran away from the footmen'
  - where: 'note 19:27 “Slay them before me”'
    claim: 'The master’s cruelty is answered: the enemies’ fate mirrors what awaits those who oppose the Lord’s work, some of whom Jesus will soon meet in Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Concerning the latter point about the master’s cruelty, the fate of the master’s enemies mirrors what is in store for those who oppose the Lord’s work. And some of these people will soon confront Jesus in Jerusalem.'
  - where: 'note 19:27 “Slay them before me”'
    claim: 'When He returns in power, the rebellious citizens will receive their punishment'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'But many of the citizens hated Him and would protest His investiture, saying they would not have Him to reign over them. When He does return in power and authority, these rebellious citizens shall surely receive the punishment they deserve.'

  # ---- the entry
  - where: 'note 19:30 “A colt whereon never man sat”'
    claim: 'The unridden colt reflects the Septuagint of Zechariah 9:9, “riding on a new donkey”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Mark and Luke may support this when they add that Jesus specifically requests a donkey that had never been ridden (Mark 11:2; Luke 19:30), a detail based on the Septuagint, or Greek translation, of Zechariah 9:9: “Your king comes to you . . . riding on a new donkey.”'
  - where: 'note 19:30 “A colt whereon never man sat”'
    claim: 'Solomon rode a donkey at the foot of the Mount of Olives when anointed king, with the people shouting'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'King Solomon also rode his donkey at the base of the Mount of Olives, where he was anointed king over Israel (1 Kgs 1:32–37).'
  - where: 'note 19:30 “A colt whereon never man sat”'
    claim: 'Riding an unridden animal is one of a series of miracles near Jerusalem; Gen. 49:10–11 hints at Davidic royalty'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The series of miracles in the vicinity of Jerusalem, beginning with Jesus’ knowledge of the waiting donkey, continues with Jesus riding an animal that has never been ridden.'
  - where: 'note 19:30 “A colt whereon never man sat”'
    claim: '“The Lord hath need of him”: His claim supplants the owners’ title and points to His royalty'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Jesus’ claim to the colt, though temporary, supplants the owners’ title and thereby points to his royalty'
  - where: 'note 19:38 “Blessed be the King that cometh”'
    claim: 'The cry quotes Psalm 118:26; Psalm 118 closes the Hallel sung at Passover and was a procession psalm sung approaching the temple'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Originally, however, Psalm 118 appears to have been used in liturgical processions, sung as worshippers approached the temple.'
  - where: 'note 19:38 “Blessed be the King that cometh”'
    claim: 'Psalm 118 is the last of the Egyptian Hallel sung at Passover'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'All four Gospels have the crowds acclaim Jesus with versions of lines from Psalm 118, which is the last of what came to be known as the Egyptian Hallel, a group of religious songs (Pss 113–18) that was sung as part of the celebration of Passover.'
  - where: 'note 19:38 “Blessed be the King that cometh”'
    claim: 'The praise rises to heaven; Luke omits David; some in the crowd understand He is not to be an earthly king'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'By recording this praise, Luke seems to be saying that some in the crowd understand Jesus’ ultimate mission—he is not to be an earthly king. Accordingly, Luke omits any reference to David, who appears in the other reports of this scene'
  - where: 'note 19:38 “Blessed be the King that cometh”'
    claim: 'The “coming one” recalls the Baptist’s prophecy and Jesus’s words on Jerusalem’s fate (13:35), and carries warning'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The reemphasis on the “coming one” of the Baptist’s prophecy (see 3:16) and of Jesus’ words on the fate of Jerusalem (see 13:35) draws in the frightful specter of judgment.'

  # ---- the lament
  - where: 'note 19:41 “He wept over it”'
    claim: 'David wept going up the Mount of Olives fleeing Absalom; Jesus’s acts mirror David’s in reverse'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Jesus’s acts mirror David’s in reverse order. First, Jesus acquired a donkey on the summit of the Mount of Olives, rode to Jerusalem, and then wept over Jerusalem when he came within view of the city (Luke 19:41).'
  - where: 'note 19:41 “He wept over it”'
    claim: 'The recorded times Jesus weeps: JST 13:34, John 11:35, 3 Ne. 17:21–22'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Only two other recorded times during his earthly ministry does Jesus weep, on his way to Jerusalem (see JST 13:34) and at the death of Lazarus (see John 11:35). It is also written that he weeps after his resurrection (see 3 Ne. 17:21, 22).'
  - where: 'note 19:41 “He wept over it”'
    claim: 'The peace lost is peace of heart and peace with Rome; both lost within a generation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'not only a peace of heart but also a peace free of conflict with their Roman overlords (19:42).125 Both kinds of peace will be lost within a generation.'
  - where: 'note 19:43 “A trench about thee”'
    claim: 'Charax: a palisade or rampart, Luke 19:43'
    key: thayer
    url: 'https://biblehub.com/greek/5482.htm'
    quote: '2. a palisade or rampart (i. e. pales between which earth, stones, trees and timbers are heaped and packed together): Luke 19:43'
  - where: 'note 19:43 “A trench about thee”'
    claim: 'The words allude to the walls Titus ordered built around the city; his troops leveled it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'a plain allusion to the two surrounding walls that the Roman general Titus will order to be constructed around the city (19:43)'
  - where: 'note 19:43 “A trench about thee”'
    claim: 'Titus’s wall was thirty-nine furlongs long, built in three days'
    key: josephus-war
    url: 'http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0148%3Abook%3D5%3Awhiston+chapter%3D12%3Awhiston+section%3D2'
    quote: 'Now the length of this wall was forty furlongs, one only abated. Now at this wall without were erected thirteen places to keep garrison in, whose circumferences, put together, amounted to ten furlongs; the whole was completed in three days'

  # ---- the temple
  - where: 'note 19:46 “A den of thieves”'
    claim: 'In Matthew and Luke, right after the entry, it is the rightful king cleansing the temple'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'The traditional name for this episode, the “cleansing of the temple,” works well in Matthew and Luke: coming right after the triumphal entry, Jesus, as the rightful king, has the authority to expel the merchants and moneychangers'
  - where: 'note 19:46 “A den of thieves”'
    claim: 'The phrase mirrors LXX Jeremiah 7:11, amid warnings to those who trust the temple while doing wrong'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The Greek expression mirrors exactly the language of LXX Jeremiah 7:11. Jeremiah’s verse sits amidst warnings to temple officials and worshipers who merely repeat “The temple of the Lord” when entering, as if this recitation excuses all crimes'
  - where: 'note 19:46 “A den of thieves”'
    claim: 'Lēstēs: one guilty of major crimes, robbery and insurrection, hiding as in a den'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The Greek word lēstēs points to persons guilty of major crimes, not mere thievery, including insurrection'
  - where: 'note 19:46 “A den of thieves”'
    claim: 'The first clearing called it “My Father’s house,” the second “My house”'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'On the former occasion, before He had declared or even confessed His Messiahship, He had designated the temple as “My Father’s house”; now that He had openly avowed Himself to be the Christ, He called it “My house.”'
  - where: 'note 19:46 “A den of thieves”'
    claim: 'The differences between John’s clearing and the Synoptics’ lead to two cleansings'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'But the differences overwhelm the similarities, leading us to see two cleansings, not one.'
  - where: 'note 19:47 “The chief of the people”'
    claim: 'From here the Pharisees fade; “the chief of the people” are the city’s leading men who may not be priests'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The expression “the chief of the people” must point to the leading men of the city or council who may not be priests (Greek prōtos), a meaning that the term carries in the writings of Josephus.'
  - where: 'note 19:47 “The chief of the people”'
    claim: 'Jesus makes the purged temple His headquarters; all of chapter 20’s teaching takes place there'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Instead, he makes the temple grounds, now purged of illicit practices, the headquarters for his last days in mortality. All of his teachings recorded in the next chapter take place here.'
  - where: 'note 19:47 “The chief of the people”'
    claim: 'Luke’s notices set the pattern: teaching daily in the temple, returning each night out of the city'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Two short notices in Luke establish Jesus’s pattern of teaching daily in the temple and returning each night to Bethany, where he presumably stayed with friends like the family of Lazarus.'

