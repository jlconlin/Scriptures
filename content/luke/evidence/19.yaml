    quote: 'The word “hard” points to stiffness of character—St. Luke’s “austere,” to harshness and bitterness.'
  - where: 'note 19:21 “An austere man”'
    claim: 'The napkin (sudarium, handkerchief) was used to wrap money one meant to hoard; a smaller scale than Matthew’s hiding in the earth'
