    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'The third gave back what he had received, without increase, for he had failed to use it. He had no reason and only a very poor excuse to offer for his dereliction.'
  - where: 'note 19:26 “Unto every one which hath”'
    claim: 'The one who has uses to advantage what is entrusted; the one who has not shows himself unfit to possess and use it'
