  # ---- repair 2026-11-22: the listed notes recast from the text, Ellicott, Talmage, Thayer and the Bible Dictionary
  - where: 'note 19:5 “To day I must abide at thy house”'
    claim: 'Dei tends to denote the constraint arising from divine appointment, rather than from circumstance (chrē)'
    key: thayer
    url: 'https://biblehub.com/greek/1163.htm'
    quote: 'δεῖ seems to be more suggestive of moral obligation, denoting especially that constraint which arises from divine appointment'
  - where: 'note 19:5 “To day I must abide at thy house”'
    claim: 'Zacchaeus came down in haste and joyfully received the Lord as his guest'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Zaccheus came down with haste, and joyfully received the Lord as his guest.'
  - where: 'note 19:9 “He also is a son of Abraham”'
    claim: 'One reading: the Abraham character was in him, generous as Abraham (Gen. 13:9; 14:23)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/19.htm'
    quote: 'The Abraham character was in him, as that of the true Israel was in Nicodemus (John 1:47). A son of Abraham, like him in his noble generosity (comp. Genesis 13:9; Genesis 14:23), was found where, to the common observer, it would have seemed as hopeless to look for one as among the stones of the Jordan valley'
  - where: 'note 19:9 “He also is a son of Abraham”'
    claim: 'The tense looks back on salvation as completed; salvation is deliverance from the habit and power of sin, and Zacchaeus’s words showed its fruits'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/19.htm'
    quote: 'implying that the salvation was already looked back upon as completed in the past. In one sense salvation had come in the personal presence of the Saviour, but we must remember all that the word implied—deliverance, not from the penalty only, but from the habit and the power of sin.'
  - where: 'note 19:9 “He also is a son of Abraham”'
    claim: 'Jesus accepted his profession of repentance'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Jesus accepted the man’s profession of repentance'
  - where: 'note 19:13 “Ten pounds”'
    claim: 'The mina (pound) is a sum of money, not a coin'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'The talent (Matt. 18:24; 25:15) and the mina (pounds) (Luke 19:13) are not coins but sums of money.'
  - where: 'note 19:13 “Ten pounds”'
    claim: 'The mna was a sixtieth of a talent, or by another estimate 100 drachmae; in the New Testament only in this parable'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/19.htm'
    quote: 'The pound, or mna, was, in Greek numismatics, not a coin, but a sum equal to the sixtieth part of a talent. … According to another estimate it was equal to 25 shekels, or 100 drachmœ? or denarii. The word meets us, as far as the New Testament is concerned, in this parable only.'
  - where: 'note 19:13 “Ten pounds”'
    claim: 'All begin equal, unlike Matt. 25:15; the trust may be what all disciples share, knowledge of the truth and membership in the kingdom'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/19.htm'
    quote: 'So far as we lay stress on the difference, it implies that the trust in this case is that which all disciples of Christ have in common—viz., their knowledge of the truth and their membership in the Kingdom, and not the offices and positions that vary in degree.'
  - where: 'note 19:13 “Ten pounds”'
    claim: 'The pounds were spoken to a mixed multitude on the way from Jericho, the talents privately to the closest disciples'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The earlier parable was spoken to a mixed multitude in the course of our Lord’s last journey from Jericho to Jerusalem; the later one was given in privacy to the most intimate of His disciples'
  - where: 'note 19:13 “Ten pounds”'
    claim: 'In the pounds equal capital shows diverse ability to use it; in the talents the amounts differ'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'In the story of the Pounds, an equal amount of capital is given to each of the servants, and men’s diverse ability to use and apply, with commensurate results in reward or penalty, is demonstrated'
  - where: 'note 19:21 “An austere man”'
