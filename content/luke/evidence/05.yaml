chapter: 5
claims:
  # ---- setting, thread, sections
  - where: setting
    claim: 'In Luke the call comes after Peter has seen Jesus heal (4:38–39) and heard Him teach'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This term of address (Greek epistatēs) indicates Peter’s intensifying respect for Jesus as a healer (see 4:38–39) and as a teacher, here following his unrecorded sermon from the boat.'
  - where: setting
    claim: 'The chapter opens with the call of the first four of the Twelve and adds Levi, the fifth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'For it opens with the calling of the first four of the Twelve—two pairs of brothers, Peter and Andrew, James and John—and later adds in the calling of the fifth, Levi.'
  - where: setting
    claim: 'Until now Jesus has worked alone; here He begins to gather a community'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Thus, rather than Jesus operating on his own, as he has done for a brief period in chapter 4, he begins to gather a community of believers, a community that will grow into his church.'
  - where: setting
    claim: 'For the first time Luke names the opposition, which grows until it leads to Jesus’s death in Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'For the first time, Luke identifies the seedbed of this opposition, those who identify themselves with the Pharisees and scribes. The resistance will grow and strengthen until it runs upon Jesus in Jerusalem and leads to his death.'
  - where: thread
    claim: 'The chapter opens with the call of disciples and closes with the new wine; together they point to the community and the new kingdom, which shows the inadequacy of old ways'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This parable unabashedly points to the new kingdom of God that has come to mankind with the arrival of Jesus (see 4:43), a kingdom which will show the inadequacy of old religious ways.'
  - where: thread
    claim: 'Those who respond to the disciples’ message will not always be those expected, as at the paralytic’s healing and in the saying on the sick and well'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Jesus’ expression also hints that, as a fisher catches fish from a lake, unexpectedly and without seeing, those who respond to the message of the disciples will not always be those whom they might expect.'
  - where: thread
    claim: 'Others, not seeing what Jesus sees, find fault and begin to oppose Him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'But others, not seeing what Jesus sees, find fault and reject both the Savior’s actions and his words.'
  - where: thread
    claim: 'The closing teachings share the theme of the inadequacy of the old; those who treasure the old resist'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'These verses present three teachings that share a common theme—the utter inadequacy of the old and therefore the sharp need for the new. The Savior’s fresh message and unexpected activities begin to cut across old norms and customs. And people who treasure the old start to resist.'
  - where: section 1 plain
    claim: '“Brake” means the net was breaking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/5?lang=eng'
    quote: '“brake”: OR was breaking.'

  # ---- notes
  - where: 'note 5:2 “The same call Matthew and Mark tell”'
    claim: 'Talmage follows Luke’s record and reads Matthew and Mark as briefer accounts of the same call that omit the catch'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The foregoing treatment is based on Luke’s record; the briefer and less circumstantial accounts given by Matthew and Mark omit the incident of the miraculous draught of fishes, and emphasize the calling of the fishermen.'
  - where: 'note 5:2 “The same call Matthew and Mark tell”'
    claim: 'Washing nets after a night’s fishing; Mark’s casting and mending nets differ in construction, which raises the question whether Luke follows Mark'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'After a night’s fishing, fishermen remove the moss and other floating debris from their deep sea nets (trammel) and drag nets (seine) and hang them to dry. … Deep sea nets, drag nets, and casting nets are not of the same construction and weave. These differences again raise the question whether Luke is following or borrowing from Mark’s account.'
  - where: 'note 5:5 “Master, at thy word”'
    claim: 'Peter doubts but obeys; what he had seen and heard of Jesus had affected him deeply'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Even though Peter expresses doubt at this moment, his willingness to obey shines through. What he has seen and heard of Jesus during the past twenty-four hours has obviously affected him deeply.'
  - where: 'note 5:5 “Master, at thy word”'
    claim: '“Master” (epistatēs) is used by disciples willing to obey, may equal “rabbi”; after the catch Peter says “Lord”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'We find this term addressed to Jesus throughout Luke’s Gospel, particularly by disciples who show a willingness to obey, as Peter does here, and it may well represent the equivalent to the title “rabbi” … After the miracle of the draught of fish, Peter calls Jesus “Lord” (5:8).'
  - where: 'note 5:8 “A sinful man at Jesus’ knees”'
    claim: 'Peter is not confessing a specific sin; hamartōlos here has a general moral sense, even humility, though it can mean scandalous action (5:30)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Is Peter confessing to a specific sin or set of transgressions? It seems not, though the term (Greek hamartōlos) can bear the sense of scandalous action (see 5:30; 19:7). But here it expresses a more general moral meaning (see 13:2; 24:7), even humility.'
  - where: 'note 5:8 “A sinful man at Jesus’ knees”'
    claim: 'In the chaos of the catch Peter comes to perceive Jesus as divine; his heart changes and he repents; later he says “The Christ of God”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Peter goes from seeing Jesus as an interesting, charismatic, even powerful personality to perceiving him as someone whose gifts are truly majestic, truly divine. In other words, his heart and perception have changed, and he repents, an essential step in becoming a disciple.'
  - where: 'note 5:8 “A sinful man at Jesus’ knees”'
    claim: 'Recognition of contact with the divine brings a sense of one’s own sinfulness, as with Isaiah (6:5)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/5.htm'
    quote: 'Then came the miracle, with the proof it gave of superhuman power and knowledge, and with that the consciousness, such as ever accompanies man’s recognition of contact with the divine, of his own exceeding sinfulness. So Isaiah cried, “Woe is me, for I am a man of unclean lips” (Isaiah 6:5).'
  - where: 'note 5:10 “Caught alive”'
    claim: 'zōgreō means to capture alive; in the New Testament only here and 2 Tim. 2:26 (the devil’s snare); Peter is to reverse it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The verb translated “catch” (Greek zōgreō) means “to capture alive” and appears in the New Testament only here and in 2 Timothy 2:26, where souls are caught by the devil’s snare. Obviously, Peter and his companions are to reverse this situation.'
  - where: 'note 5:10 “Caught alive”'
    claim: 'Thayer: in Luke 5:10, by teaching to win souls for the kingdom of God'
    key: thayer
    url: 'https://biblehub.com/greek/2221.htm'
    quote: 'ἀνθρώπους ἔσῃ ζωγρῶν, thou shalt catch men, i. e. by teaching thou shalt win their souls for the kingdom of God, Luke 5:10.'
  - where: 'note 5:10 “Caught alive”'
    claim: 'Caught fish died; men were to be drawn to eternal life'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Theretofore they had caught fish, and the fate of the fish was death; thereafter they were to draw men—to a life eternal.'
  - where: 'note 5:10 “Caught alive”'
    claim: 'Like fish caught unseen, those who respond will not always be those expected; compare 5:21 and 5:31–32'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'We compare the varying responses among those who witness Jesus healing the man with palsy (see 5:21) and the irony brimming in Jesus’ saying about those who are sick and well (see 5:31–32).'
  - where: 'note 5:11 “What the catch was for”'
    claim: 'The response is immediate and final, as with Levi in 5:28'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: '5:11 forsook all: The response is immediate and final, indicating plainly the depth of conversion (see also Levi’s response in 5:28 and that of the Twelve in 9:6).'
  - where: 'note 5:11 “What the catch was for”'
    claim: 'The catch provides for the families; fish to Capernaum’s market and to Taricheae (Magdala) for salting; D&C 118:3'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'By the huge catch of fish, the families of these fishermen will possess enough food and earn enough income to tide them over for a long time … Some of the catch will go to the fresh market in Capernaum, but most will go four and one-half miles down the shore to Taricheae'
  - where: 'note 5:11 “What the catch was for”'
    claim: 'Taricheae is Magdala; its name linked to tarichos, dried or smoked fish'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This town is also known as Magdala, the hometown of Mary Magdalene. Significantly, the name Taricheae is linked to the Greek word tarichos which means “dried or smoked fish,”'
  - where: 'note 5:11 “What the catch was for”'
    claim: 'Jesus is about to call the breadwinners away and provides for their families'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'For Jesus knows that he is about to call the breadwinners away from their wives and children, and he graciously provides for their needs, both for sustenance and for income. The miracle of the fish is not merely for show.'
  - where: 'note 5:12 “Full of leprosy”'
    claim: 'Biblical leprosy covers several diseases and even mildew on clothing and walls'
    key: bd-leprosy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leprosy?lang=eng'
    quote: 'There were apparently several types of leprosy, and the word is used in the Bible to designate other sicknesses or diseases. For example, clothing and walls were said to be leprous when they had patches of mildew or some fungous growth, as in Lev. 13:47–59; 14:33–37.'
  - where: 'note 5:12 “Full of leprosy”'
    claim: 'Long-term serious illness, more than the fever of 4:38–39; perhaps not Hansen’s disease, which was extremely rare then'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This man obviously suffers from a long-term and therefore much more serious illness than the woman with the high fever (see 4:38–39) … The man’s skin condition is perhaps a serious fungal infection because Hansen’s disease, or what is currently known as leprosy, is only introduced into the Mediterranean region'
  - where: 'note 5:12 “Full of leprosy”'
    claim: 'A lasting skin disease made a person unclean, barred from worship, and obliged to live apart'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'According to Mosaic law, any long-lasting skin disease confers on the sufferer a state of uncleanness that disqualifies the person from worshiping in the temple or elsewhere, and obliges the diseased one to live separately from normal society'
  - where: 'note 5:12 “Full of leprosy”'
    claim: 'Lepers were not to enter populated areas; coming to a city shows his desperation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The story seemingly persists in people’s memory because lepers are not to enter populated areas (see Lev. 13:46). That the man comes to a city shows his determination and desperation to seek Jesus’ help.'
  - where: 'note 5:13 “He touched him”'
    claim: 'By the law Jesus becomes unclean, but He is not hampered by ritual uncleanness as others are'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'According to the Mosaic law, Jesus becomes unclean by touching the man (see Lev. 13:46; Num. 5:2–4). But the point is that Jesus, who controls disease and gives the law, is not crippled in a ritual way as others are.'
  - where: 'note 5:13 “He touched him”'
    claim: 'He sets the standard for acts of compassion for His new disciples'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Moreover, he models the action of touching to confer a blessing and sets the standard for acts of compassion both for observers, including his new disciples, and for recipients of his blessings'
  - where: 'note 5:13 “He touched him”'
    claim: 'His divine authority overpowers ritual uncleanness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Instead, his divine authority simply overpowers aspects of ritual uncleanness and dietary concerns'
  - where: 'note 5:13 “He touched him”'
    claim: 'The healing restores the outcast to family and friends; Jesus seeks to make the recipient whole'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Embedded within this broad view of his ministry lies the Savior’s evident purpose in healing and restoring health: he seeks to make the recipient whole. For example, in cleansing the leper he not only cures the disease but also brings him back into his family and into his circle of friends.'
  - where: 'note 5:14 “Shew thyself to the priest”'
    claim: '“Tell no man” is natural: he is to go straight to the priest'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The man, rather than going to celebrate with friends and family, is to walk directly to the priest to receive his clean bill of health.'
  - where: 'note 5:14 “Shew thyself to the priest”'
    claim: '“For a testimony unto them”: a testimony from priest to people, without which the leper would not be received as clean'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/1.htm'
    quote: 'εἰς μαρτύριον αὐτοῖς: for a testimony from priest to people, without which the leper would not be received as clean.'
  - where: 'note 5:14 “Shew thyself to the priest”'
    claim: 'Jesus shows reverence for the law of Moses, as Zacharias, Elisabeth and Jesus’s parents did; 16:17'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Earlier, Zacharias and Elisabeth and Jesus’ parents show respect for law, both religious and secular (see 1:6; 2:1–5, 21–24, 27, 39, 42). Now it is the Savior who shows his reverence for the strictures of the Mosaic law by sending the formerly unclean man to the priest.'
  - where: 'note 5:16 “Prayer, and the power to heal”'
    claim: 'Mark stresses the crowds; Luke the wilderness as God’s ground, a place of spiritual renewal'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Mark’s version of this story emphasizes this dimension (see Mark 1:45). But Luke captures the more important sense of the wilderness as God’s ground, a place where Jesus can immerse himself in the heat-tested environment of spiritual renewal'
  - where: 'note 5:16 “Prayer, and the power to heal”'
    claim: 'Jesus holds His ministry in balance between aid and keeping His relationship with His Father fresh; an example to the disciples'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The example cannot be lost on his newly called disciples wherein Jesus holds his ministry in balance between offering aid and instruction on the one hand and keeping his relationship with his Father fresh and open on the other.'
  - where: 'note 5:16 “Prayer, and the power to heal”'
    claim: 'Luke links the prayer to “the power of the Lord … to heal”; manuscripts read “them” or “him”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Luke draws a firm link between the Savior’s praying in the previous verse and his notice that Jesus carries “the power [of Jehovah] . . . to heal” … The final pronoun “them,” which appears in some important manuscripts, is the singular “him” in others, with the sense that power was with him, Jesus, to heal.'
  - where: 'note 5:17 “Pharisees and teachers of the law”'
    claim: 'First identifiable opponents in Luke; doctors = law teachers, termed scribes in 5:21; their presence signals the opposition that emerges at 6:6–11'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This notice of identifiable opponents is the first in this Gospel. Later, in 5:21, it appears that the doctors (nomodidaskalos, properly “law teachers”) are termed “scribes.” … Identifying such representatives signals the groping, dark tentacles of opposition and conspiracy that will emerge into the open with Jesus’ healing of the man with the withered hand (see 6:6–11).'
  - where: 'note 5:17 “Pharisees and teachers of the law”'
    claim: 'The Pharisees: a religious party, the name meaning separatists, strict in observing the law'
    key: bd-pharisees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharisees?lang=eng'
    quote: 'A religious party among the Jews. The name denotes separatists. They prided themselves on their strict observance of the law and on the care with which they avoided contact with things gentile.'
  - where: 'note 5:17 “Pharisees and teachers of the law”'
    claim: 'The scribes were teachers in society, displacing the priests whom scripture made teachers of the law'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'They fill the role of teachers in society, effectively displacing the priests whom scripture designates as arbiters of disputes and as teachers of the law (see Deut. 21:5; 33:10'
  - where: 'note 5:17 “Pharisees and teachers of the law”'
    claim: 'Here opponents are not yet organized; after the withered hand they conspire'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'In the scene of the healing of the paralyzed man, opponents seem not to be organized. It is only after the healing of the man with the withered hand that opponents find one another and enter into a conspiracy, seeking “what they might do to Jesus” (6:11).'
  - where: 'note 5:19 “Through the tiling”'
    claim: 'Capernaum roofs were mud, reeds and straw (Mark); Luke has ceramic roof tiles, rare in villages, none at Capernaum; Luke assumed an urban house'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'In Roman Galilee, ceramic roof tiles are mostly found in an urban context associated with monumental structures or upper-class dwellings. … At Capernaum, no roof tiles were discovered in any first-century domestic context. Therefore, it appears that Luke’s account assumed the Roman-style villas familiar to his urban Gentile audience'
  - where: 'note 5:19 “Through the tiling”'
    claim: 'Luke’s word is ceramic roof tiles (keramōn)'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Luke’s version of the story, however, differs from Mark by claiming that the men removed the house’s “ceramic roof tiles” (keramōn; see Luke 5:17–26).'
  - where: 'note 5:19 “Through the tiling”'
    claim: 'Others answer that tiling is a feature of Palestinian homes in the first century BC'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Some have thought that Luke adds this detail to Mark’s rehearsal, thereby making the residence into a Greco-Roman house rather than a typical Galilean home with a flat roof of wattle and mud. But studies have shown that tiling is a feature of Palestinian homes in the first century BC.'
  - where: 'note 5:19 “Through the tiling”'
    claim: 'Luke gives no place for the miracle, unlike Mark’s Capernaum'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Moreover, Luke disconnects the following miracle from Capernaum, which Mark mentions (see Mark 2:1), making no assignment of place'
  - where: 'note 5:19 “Through the tiling”'
    claim: 'Many homes had an external stairway to the roof'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Many homes have an external stairway that leads to the roof.'
  - where: 'note 5:20 “Their faith, and forgiveness first”'
    claim: 'The friends’ faith drew out the miracle'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: '5:20 their faith: The triggering principle that draws out the miracle consists of the unbending faith of the man’s friends who have carried him some distance to where Jesus is.'
  - where: 'note 5:20 “Their faith, and forgiveness first”'
    claim: 'The man was probably afraid; a close connection between his sins and affliction; not all ills come from sin'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The man was probably in a state of fear; he may have known that his ailment was the result of wicked indulgences; nevertheless, though he may have considered the possibility of hearing only condemnation for his transgression, he had faith to be brought.'
  - where: 'note 5:20 “Their faith, and forgiveness first”'
    claim: 'Plain connection in this case, but not all bodily ills are from sin'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'In this man’s condition there was plainly a close connection between his past sins and his present affliction … We are not warranted, however, in assuming that all bodily ills are the result of culpable sin'
  - where: 'note 5:20 “Their faith, and forgiveness first”'
    claim: 'Jesus knew the words would spark debate and purposely drew the critics in, answering with healing'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'And Jesus must know that his initial statement, “Man, thy sins are forgiven thee” (5:20), will spark debate among some in the crowd. Therefore, purposely he draws them into their critique, and purposely he responds to the spoken and unspoken criticisms by drawing down the powers of heaven and healing the paralytic'
  - where: 'note 5:21 “Blasphemy, unless He is God”'
    claim: 'Blasphemy defined; Jesus charged with it for claiming to forgive sins (Luke 5:21); the charges true only if He were not what He said'
    key: bd-blasphemy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blasphemy?lang=eng'
    quote: 'Generally denotes contemptuous speech concerning God or concerning something that stands in a sacred relation toward God … Our Lord was on several different occasions charged by the Jews with speaking blasphemy, because He claimed the right to forgive sins (Matt. 9:3; Luke 5:21) … These charges would have been true if He had not actually been all that He said He was.'
  - where: 'note 5:21 “Blasphemy, unless He is God”'
    claim: 'The chapter’s disclosure culminates in forgiving sins, which only God can do, after power over the deep, fish and disease'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'It is his grand disclosure, as it were, culminating in forgiving sins, which only a God can do (see 5:20, 24). … But here Jesus shows his powers over “the deep” (5:4), over the hidden and invisible animal kingdom in the form of fish (see 5:6), and over debilitating diseases'
  - where: 'note 5:23 “Does it require more power?”'
    claim: 'The sense is which is easier to perform; the JST makes it a question of power'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: '5:23 Whether is easier: The sense is, which is easier to perform? The Savior’s question is more philosophical than legal, as the change in the Joseph Smith Translation affirms'
  - where: 'note 5:23 “Does it require more power?”'
    claim: 'JST Luke 5:23 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/5?lang=eng'
    quote: 'JST Luke 5:23 Does it require more power to forgive sins than to make the sick rise up and walk?'
  - where: 'note 5:23 “Does it require more power?”'
    claim: '“That ye may know” is Exodus language for the Lord proving He is God; the healing is legal proof'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This expression arises first in the account of the Exodus of the Hebrew slaves (see Ex. 6:7; 7:5) and appears in passages wherein the Lord wants to prove something to people, chiefly that he is God … By healing the paralyzed man, Jesus proves his authority to forgive sins and thus creates the legal proof for a law court.'
  - where: 'note 5:23 “Does it require more power?”'
    claim: '“Power” is exousia, carrying both power and authority'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'power: The term is the Greek exousia, usually rendered “authority,” though in this context the word carries both senses, power and authority.'
  - where: 'note 5:23 “Does it require more power?”'
    claim: 'Son of man: probably honor and dignity as head of the kingdom here; the same saying in Mark (2:10) is listed under that sense'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: '(2) honor and dignity, as head and founder of the kingdom of God, and judge of all men (Matt. 13:41; 16:28; 19:28; 24:30–31; 25:31; 26:64; Mark 2:10, 28)'
  - where: 'note 5:23 “Does it require more power?”'
    claim: 'First use of Son of man in Luke'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This is the first occurrence of this title in Luke’s Gospel.'
  - where: 'note 5:23 “Does it require more power?”'
    claim: 'The title’s origin is the Father’s name Man of Holiness (Moses 6:57)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Though there is substantial debate about the meaning of the term “Son of man,” its origin evidently comes from an early title for the Father: Man of Holiness (Moses 6:57).'
  - where: 'note 5:23 “Does it require more power?”'
    claim: 'Moses 6:57: Man of Holiness is the Father’s name, and His Only Begotten is the Son of Man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'in the language of Adam, Man of Holiness is his name, and the name of his Only Begotten is the Son of Man, even Jesus Christ'
  - where: 'note 5:26 “Strange things”'
    claim: 'paradoxos: contrary to opinion; unexpected, uncommon, incredible, wonderful; Luke 5:26'
    key: thayer
    url: 'https://biblehub.com/greek/3861.htm'
    quote: 'παράδοξος, παράδοξον (παρά contrary to (see παρά, IV. 2), and δόξα opinion; hence, equivalent to ὁ παρά τήν δόξαν ὤν), unexpected, uncommon, incredible, wonderful: neuter plural Luke 5:26 (A. V. strange things'
  - where: 'note 5:26 “Strange things”'
    claim: 'The crowd became eyewitnesses with shared recollections, part of the record of the ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The crowd gathered at the house now become eyewitnesses of both this miracle and Jesus’ preceding words, effectively making them a group with “shared recollections” … Their story, along with those of the Twelve, will become a part of the record of Jesus’ ministry'
  - where: 'note 5:27 “Levi at the toll booth”'
    claim: 'Publicans leased the right to collect customs at borders, kept the excess, and were considered corrupt'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'customs were collected at every territorial border by publicans who leased the right to collect them from the client king or governor in exchange for an agreed-upon amount of money. … they were commonly considered corrupt and were notorious for their unethical practices.'
  - where: 'note 5:27 “Levi at the toll booth”'
    claim: '“Saw” is theaomai, to gaze at; customs post east of Capernaum near the Herod–Philip border on the main road'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The verb “to see” (Greek theaomai) here carries the more intense sense “to gaze at, to observe.” Jesus must be walking eastward from Capernaum. A customs post stands east of the town near the border between the territories of Herod and Philip (see 3:1), on a main east-west road'
  - where: 'note 5:27 “Levi at the toll booth”'
    claim: 'Jesus looks with discernment and perceives the inner character of a man whose livelihood is despised'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Briefly, he looks at the person with discernment: he “saw a publican” whose means of livelihood is despised but, as the verb “saw” shows, Jesus perceives his inner character.'
  - where: 'note 5:27 “Levi at the toll booth”'
    claim: 'Levi a minor customs official; collections likely to Herod Antipas'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'In a different vein, Levi seems to be one of the minor customs officials rather than a person who recruits others to this livelihood and supervises them. … whatever they collect likely goes to the coffers of Herod Antipas, the tetrarch of Galilee'
  - where: 'note 5:27 “Levi at the toll booth”'
    claim: 'Matthew was known before his conversion as Levi, a tax gatherer at Capernaum'
    key: bd-matthew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/matthew?lang=eng'
    quote: 'Known before his conversion as Levi, son of Alphaeus (Mark 2:14). He was a tax gatherer at Capernaum, probably in the service of Herod Antipas, in whose tetrarchy Capernaum was.'
  - where: 'note 5:27 “Levi at the toll booth”'
    claim: 'Some find it difficult to assume Levi is the Matthew of Luke 6:15; two Semitic names are rare'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'For a number of reasons, it is difficult to assume that the “Matthew” of the Twelve in Luke 6:15 is the same person, even though we find “Matthew the publican” in Matthew 10:3. It is not uncommon for persons to be known by two names, one Hebrew and one Greek or Latin … but rare to be called by two Semitic names'
  - where: 'note 5:30 “Why the meal offended”'
    claim: 'Jesus the guest of honor; the guests mostly tax collectors, with others'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Jesus is the guest of honor; the entire meal will feature him in some way and forms Levi’s gift to him.'
  - where: 'note 5:30 “Why the meal offended”'
    claim: 'Guests reclined; later Jewish law forbade eating with publicans'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The verb (Greek katakeimai) means to lie or recline at a meal rather than to sit on chairs or couches … Perhaps importantly, later Jewish law forbade eating with publicans.'
  - where: 'note 5:30 “Why the meal offended”'
    claim: 'Table fellowship: eating with the unclean threatened Pharisaic hosts’ purity; publicans excluded; home tables kept with temple holiness'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'by eating with others that were ritually unclean Jesus would also threaten the purity of His Pharisaic hosts. The tax collectors, or publicans, were specifically excluded from the Pharisees’ table fellowship. … For the Pharisees, those who keep the ritual cleanliness of the priests in their homes allow the holiness of the temple to reside in the home.'
  - where: 'note 5:30 “Why the meal offended”'
    claim: 'Jesus responds on behalf of His disciples'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'In this connection, one intriguing aspect of the Savior’s response to the complaining Pharisees needs dusting off—the fact that he responds on behalf of his disciples.'
  - where: 'note 5:32 “Not the righteous, but sinners”'
    claim: 'The Pharisees would agree sinners were sick; the challenge is to recognize that all sin'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'they would naturally concur that the sinners and tax collectors were sick and did need a physician. They could see themselves as righteous and the others as unworthy. One of our greatest challenges as righteous, law-abiding people is to recognize that we all sin.'
  - where: 'note 5:32 “Not the righteous, but sinners”'
    claim: 'Where law observance becomes justification, admitting flaws is not an option'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'To the extent that our observance of the law becomes our sense of justification before God, then admitting that we are flawed will not be an option.'
  - where: 'note 5:32 “Not the righteous, but sinners”'
    claim: 'Possible irony: “the righteous” may equal the Pharisees; His purpose is to call to repentance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'If irony lies in Jesus’ words, it is here, with a possible equation of “the righteous” with the Pharisees of verse 30. Even so, Jesus’ insistence that he comes to call people to repentance combines with the prior declaration as his lofty reason for coming.'
  - where: 'note 5:32 “Not the righteous, but sinners”'
    claim: 'The saying appears in Moroni 8:8 with its parts reversed; its genuineness is assured by it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Although questions have arisen about the authenticity of this saying, its genuineness is assured by its appearance, of all places, in the Book of Mormon. Interestingly, in this source the two parts of the saying are reversed.'
  - where: 'note 5:32 “Not the righteous, but sinners”'
    claim: 'Moroni 8:8 text and its application to little children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/8?lang=eng'
    quote: 'Behold, I came into the world not to call the righteous but sinners to repentance; the whole need no physician, but they that are sick; wherefore, little children are whole, for they are not capable of committing sin'
  - where: 'note 5:35 “The bridegroom taken away”'
    claim: '“They” in 5:33 is ambiguous; Matthew names John’s disciples'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The subject “they” is ambiguous. The nearest possible referent consists of “scribes and Pharisees” (5:30), which is unlikely. The language of Mark 2:18 is similarly ambiguous, but Matthew identifies the questioners as “the disciples of John” (Matt. 9:14).'
  - where: 'note 5:35 “The bridegroom taken away”'
    claim: 'Children of the bridechamber are the wedding guests; the question with mē expects a negative answer'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The expression “children of the bridechamber” points to the wedding guests. … Grammatically, Jesus’ question, uttered with the Greek negative mē, expects a negative answer.'
  - where: 'note 5:35 “The bridegroom taken away”'
    claim: 'John’s disciples would remember John calling himself the Bridegroom’s friend'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'To the friends of the now imprisoned Baptist our Lord’s reply must have brought memories of their beloved leader’s words, when he had compared himself to the Bridegroom’s friend, and had plainly told them who was the real Bridegroom.'
  - where: 'note 5:35 “The bridegroom taken away”'
    claim: 'Perhaps the first recorded intimation in His public teaching of His coming death; John 3:14 was spoken to Nicodemus'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'Noteworthy as the first recorded intimation in our Lord’s public teaching (that in John 3:14 was less clear until interpreted by the event, and was addressed to Nicodemus, and perhaps to him only, or, at the furthest, to St. John) of His coming death.'
  - where: 'note 5:35 “The bridegroom taken away”'
    claim: 'Jesus does not impose fasting now, but the days are coming: an affirmation of its enduring value'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'But for the moment Jesus does not impose this form of self-denial on his followers, though the days are coming when they will fast (see 5:35), a clear affirmation of its enduring value in his eyes.'
  - where: 'note 5:36 “A patch cut from a new garment”'
    claim: 'Better manuscripts: having rent a piece from a new garment'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/5.htm'
    quote: 'No man putteth.—The better MSS. give, No man having rent a piece from a new garment putteth it upon an old. The form which the illustration thus assumes gives it obviously a greater vividness. What folly could be greater than the act described?'
  - where: 'note 5:36 “A patch cut from a new garment”'
    claim: 'The clause “agreeth not with the old” only in Luke; entire incompatibility of old and new'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This expression appears only in Luke’s version of this saying (see Matt. 9:16; Mark 2:21). It adds to Jesus’ point about the entire incompatibility of the old and new'
  - where: 'note 5:36 “A patch cut from a new garment”'
    claim: 'Wineskins become brittle; fermenting wine gives off gases'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Over time, the leather of such skins will age and become brittle, thus rendering them unfit for new wine that ferments, giving off gases.'
  - where: 'note 5:36 “A patch cut from a new garment”'
    claim: 'Jesus does not intend to reform but to restore and change'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Based on this parable and the next, Jesus does not intend to reform but to restore and to change.'
  - where: 'note 5:36 “A patch cut from a new garment”'
    claim: 'The gospel a new revelation, no addendum or reenactment; a new and everlasting covenant'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The gospel taught by Christ was a new revelation, superseding the past, and marking the fulfillment of the law; it was no mere addendum, nor was it a reenactment of past requirements; it embodied a new and an everlasting covenant.'
  - where: 'note 5:39 “The old is better”'
    claim: 'The saying expresses the view of one who holds to old ways and will not change'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: '5:39 The old is better: This sentiment expresses the view of the person who holds onto old ways and old beliefs, not wishing to change.'
  - where: 'note 5:39 “The old is better”'
    claim: 'chrēstoteros of wine: pleasanter, mild; some editions read chrēstos'
    key: thayer
    url: 'https://biblehub.com/greek/5543.htm'
    quote: '2. manageable, i. e. mild, pleasant (opposed to harsh, hard, sharp, bitter): of things, χρηστότερός οἶνος, pleasanter, Luke 5:39 (here T Tr text χρηστός; so WH in brackets)'
  - where: 'note 5:39 “The old is better”'
    claim: 'Other manuscripts read “the old is good,” with a sense of mild'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/5.htm'
    quote: 'The better MSS. give simply “the old is good,” the adjective partly implying the sense of “mild.” … though men of weak constitutions might shrink from its effects, as the Pharisees were shrinking from the freedom of which our Lord set the example.'

  # ---- christ
  - where: christ
    claim: 'D&C 64:7: the Lord forgives those who confess and ask forgiveness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'Nevertheless, he has sinned; but verily I say unto you, I, the Lord, forgive sins unto those who confess their sins before me and ask forgiveness, who have not sinned unto death.'
