  - where: 'note 13:1 “Blood mingled with sacrifices”'
    claim: 'Pilate was prefect A.D. 26–36, generally in Jerusalem at feasts, contemptuous of Jewish religion; 13:1 refers to an outbreak at a feast when soldiers entered the temple courts'
    key: bd-pilate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pilate?lang=eng'
    quote: 'Roman prefect in Judea, A.D. 26–36 … he was generally present in Jerusalem at feast time. He had a great contempt for the Jewish people and for their religion. … In Luke 13:1 there is a reference to an outbreak during one of the feasts, when Pilate sent soldiers into the temple courts and certain Galileans were slain.'
  - where: 'note 13:1 “Blood mingled with sacrifices”'
    claim: 'Galileans regularly attended the feasts at Jerusalem'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/13.htm'
    quote: 'of the Galileans] who regularly attended the Jewish feasts at Jerusalem, John 4:45.'
  - where: 'note 13:1 “Blood mingled with sacrifices”'
    claim: 'Slain at the base of the altar; probably a violent demonstration against Rome which Pilate took as incipient insurrection'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'A number of Galileans had been slain by Roman soldiers, at the base of the altar, so that their blood had mingled with that of the sacrificial victims. It is probable that the slaughter of these Galileans was incident to some violent demonstration of Jewish resentment against Roman authority, which the procurator, Pilate, construed as an incipient insurrection'
  - where: 'note 13:1 “Blood mingled with sacrifices”'
    claim: 'The fortress of Antonia overlooked the temple grounds so soldiers could enter at the first sign of turmoil'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'the Roman tower or fortress of Antonia had been erected in a commanding position overlooking the temple grounds, and connected therewith by a wide flight of steps, so that soldiers could have ready access to the enclosure at the first indication of turmoil.'
  - where: 'note 13:1 “Blood mingled with sacrifices”'
    claim: 'Such incidents were too common for Josephus to record this one'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/13.htm'
    quote: 'The special incidents here alluded to were far too common to be specially recorded by Josephus'
