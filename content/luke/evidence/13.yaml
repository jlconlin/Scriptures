chapter: 13
claims:
  - where: setting
    claim: 'The opening verses appear in no other ancient source or Gospel; Luke alone has them and the story of the infirm woman'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'These verses appear in no other ancient source, including the other Gospel accounts. It is evident that Luke’s careful research brings Jesus’ view on sin and suffering into the full light of day'
  - where: setting
    claim: 'Luke names Jerusalem repeatedly on the journey, including 13:22 and 34; the journey is one of discipleship, not a route'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'he explicitly mentions the holy city numerous times during the trek (see Luke 9:53; 13:22, 34; 17:11; 18:31; 19:11). While Luke frequently reminds his readers of the ultimate destination of this journey, he does not depict the Savior traveling a direct linear course'
  - where: setting
    claim: 'The place of the warning may be Perea, east of the Jordan, which Herod controls'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The locale for the warning is indefinite, but may be within the territory of Perea, lying on the east side of the Jordan River, which Herod controls.'
  - where: setting
    claim: 'Antipas held Galilee and Perea'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'Archelaus, who received Judea, Idumea, and Samaria; Antipas, who had Galilee and Perea; and Philip, who had the northeast districts of Palestine.'
  - where: thread
    claim: 'The fig tree shows mercy in delaying judgment, but the time to repent has a limit'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'But his generosity carries a limit within itself because a person does not have forever to repent—even though the time for changing is generous, this fig tree will be cut down next year'
  - where: thread
    claim: 'The shut door means time runs out on those who delay'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The unusual English idiom does not mask the fact that time runs out on those who dither about whether to respond to Jesus’ command or not'
  - where: thread
    claim: 'The healing of the woman fulfills the deliverance announced at Nazareth'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'From one synagogue to another, from initial announcement to fulfillment, the two stories, one inside Nazareth and the other somewhere outside Galilee, uncover the heart of Jesus’ ministry, that of deliverance.'
  - where: thread
    claim: 'Herod will not deter Jesus; His destiny is tied to Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The city is Jesus’ destination (see 9:51), and Herod and his allies will not deter his destiny.'
  - where: 'note 13:3 “Repent, or likewise perish”'
    claim: 'Jesus refuses to connect sin and suffering, as with the man born blind; Job turns against that view too'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'In this case, Jesus refuses to connect sin to suffering, much as he does in the cases of those who die at Siloam (see 13:4) and the man born blind (see John 9:1–3).'
  - where: 'note 13:3 “Repent, or likewise perish”'
    claim: 'The dead were in the wrong place at the wrong time; their deaths point to the need to be ready to meet God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'Their only mistake is to be in the wrong place at the wrong time. But their deaths, unlooked-for as they are, point up a person’s need to be ready to meet God in the next life, unburdened by sin.'
  - where: 'note 13:3 “Repent, or likewise perish”'
    claim: '“Perish” points to the world to come, not to death in this world'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'But he is not touching on death in this world, as the Galileans have experienced (13:1). Rather, “perishing” points to the world to come.'
  - where: 'note 13:3 “Repent, or likewise perish”'
    claim: 'Not man’s prerogative to judge that disaster follows sin; calamity was impending over temple, city and nation unless the people repented'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'Even while Jesus spake, calamity dark and dire was impending over temple, city and nation; and unless the people would repent and accept the Messiah then in their midst, the decree of destruction would be carried to its dread fulfilment.'
  - where: 'note 13:7 “A fig tree with no fruit”'
    claim: 'Fruit trees growing in vineyards is normal'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'That a fig tree grows in a vineyard should not surprise us because fruit trees of various sorts are noted as gracing vineyards (see Deut. 6:11; 22:9; 2 Kgs. 18:31; Micah 4:4; Jacob 5).'
  - where: 'note 13:7 “A fig tree with no fruit”'
    claim: 'Three years is the time without fruit, not the length of the ministry; fruit of the first three years was not to be eaten'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The length of time seemingly does not point to the length of Jesus’ ministry, for Luke offers no hint about the ministry’s duration. Instead, the three-year interval evidently has to do with a period that the tree has not borne fruit'
  - where: 'note 13:7 “A fig tree with no fruit”'
    claim: '“Cumbereth” means wastes good ground; fig trees absorb many nutrients'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'A better sense is, “Why should the tree also waste ground that can be put to good use?” For fig trees are known to absorb many nutrients from the ground.'
  - where: 'note 13:7 “A fig tree with no fruit”'
    claim: 'The verb “cut down” is the one in the Baptist’s warning (3:9)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The verb (Greek ekkoptō) appears in the Baptist’s warnings about the judgment of the Coming One, tying to the need of repentance (see 3:9).'
  - where: 'note 13:7 “A fig tree with no fruit”'
    claim: 'The fig tree was a symbol of the nation; if it is the covenant people, the vineyard is the world'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'In Jewish literature, particularly in rabbinical lore, the fig tree is of frequent mention as a symbol of the nation. … If the fig tree represents the covenant people, then the vineyard is naturally the world at large'
  - where: 'note 13:8 “One more year”'
    claim: 'The dresser is the Son of God interceding for the barren tree; the parable is of universal application'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'the dresser of the vineyard is the Son of God, who by personal ministry and solicitous care makes intercession for the barren tree, in the hope that it may yet bear fruit. The parable is of universal application'
  - where: 'note 13:8 “One more year”'
    claim: 'The scene recalls Christ pleading with the Father in D&C 45:3–5'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'It also recalls his willingness, in an astonishing act of grace, to counsel with his Father on behalf of those who, though touched with sin and transgression, have shown repentant hearts'
  - where: 'note 13:8 “One more year”'
    claim: 'The appeal for more time applies to persons whose years are prolonged that they might repent (2 Ne. 2:21)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'Each of these points, brought into a metaphorical sphere, finds application in the lives of persons who can and will repent—prolonging their years “that they might repent” (2 Ne. 2:21).'
  - where: 'note 13:8 “One more year”'
    claim: 'JST 13:9 reads “the tree is saved” for “well”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The Joseph Smith Translation, as in 13:6, replaces this italicized word with a clearer expression: “the tree is saved” (JST 13:9)'
  - where: 'note 13:8 “One more year”'
    claim: 'The owner, not the vinedresser, does the cutting: the master is the judge'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'We notice that it is the owner who will do the cutting, or authorize it, not the vinedresser. … In a metaphorical sense, the master is the judge of a person’s state of repentance.'
  - where: 'note 13:8 “One more year”'
    claim: 'Zenos’s allegory resembles the parable: the caretaker persuades the master to wait; a common stock of stories with a similar message'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The resemblances do not support a common origin for the parable and allegory, but they may well point to a common stock of stories that carry a similar message. … the caretaker persuades the master to wait before rendering ultimate judgment (see 13:8–9; Jacob 5:26–27, 50)'
  - where: 'note 13:11 “A spirit of infirmity”'
    claim: 'Luke uses exorcism terms for physical healings; the bent woman has a “spirit of infirmity” and is “loosed”; ailment as an enemy or a bondage'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'he describes her as suffering from “a spirit of infirmity” and indicates that Jesus “loosed” (Greek, apolelusai) her from her disability (13:11–12). In both cases, Luke treats a physical ailment as an enemy to be subdued or a bondage from which the victims must be freed.'
  - where: 'note 13:11 “A spirit of infirmity”'
    claim: 'Deliverance from the devil’s power can be a type of redemption from the Fall'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Deliverance from the power of the devil can serve as a type of how Jesus redeems us from the power of the fall.'
  - where: 'note 13:11 “A spirit of infirmity”'
    claim: 'Luke calls her condition a disease (astheneia); it seems most likely a spinal disease'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'Luke characterizes the woman’s condition as a disease, as the occurrence of the Greek term for disease (asthenaia) in other contexts demonstrates'
  - where: 'note 13:11 “A spirit of infirmity”'
    claim: 'How Satan is involved is unclear; Jesus sees more in her disease'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'How Satan has involved himself with the woman’s condition is unclear. From Luke’s description, it appears that she suffers from a disease that attacks her spinal column. But for some reason, Jesus sees more in her disease'
  - where: 'note 13:19 “The mustard tree”'
    claim: 'Black mustard; an annual herb, not a true tree, but large enough to support small birds; hyperbole perhaps involved'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'Hyperbole is perhaps involved in this parable for though the seeds are small, they are not the smallest or “least” among seeds. Moreover, being an annual herb, black mustard is not a true tree. Still, the mature plants can be large and sturdy enough to support the small birds'
  - where: 'note 13:19 “The mustard tree”'
    claim: 'Black mustard grows to ten feet'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'Black mustard has been reported to grow up to ten feet and typically reaches three to six feet in height.'
  - where: 'note 13:19 “The mustard tree”'
    claim: 'In Luke Jesus says nothing about the size of the seed; the emphasis is the end result, a benefit for all'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'In Luke’s account, Jesus says nothing about the size of the seed. Instead, the main gist of the parables rests on the end result of the growth—a benefit for all, whether a tree wherein birds can roost or bread for all to eat.'
  - where: 'note 13:19 “The mustard tree”'
    claim: 'A divine tree with birds representing nations appears in Ezekiel 31:6 and Daniel 4:12, 21'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The image of a special, divine tree where birds representing different nations and peoples roost under the canopy of its branches appears in Ezekiel 31:6 and Daniel 4:12, 21.'
  - where: 'note 13:19 “The mustard tree”'
    claim: 'Joseph Smith: the mustard seed represents the Church in the last days, the Book of Mormon, with angels lodging in its branches'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/3'
    quote: 'Now we can discover plainly, that this figure is given to represent the church as it shall come forth in the last days.'
  - where: 'note 13:19 “The mustard tree”'
    claim: 'Joseph Smith: the Book of Mormon, the least of seeds, branching forth; God sending angels to lodge in the branches'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/3'
    quote: 'Let us take the book of Mormon, which a man took and hid in his field; securing it by his faith, to spring up in the last days … and God is sending down his powers, gifts and angels, to lodge in the branches thereof'
  - where: 'note 13:21 “Leaven in three measures”'
    claim: 'Leaven was generally a symbol of sin in the New Testament; in Matt. 13:33 it is the growth of the kingdom'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'In the New Testament it was as a rule symbolic of sin (Matt. 16:6; Mark 8:15; Luke 12:1; 1 Cor. 5:7; Gal. 5:9); but in Matt. 13:33 it is compared to the inward growth and influence of the kingdom of heaven (church) upon the earth.'
  - where: 'note 13:21 “Leaven in three measures”'
    claim: 'Three measures is about fifty pounds of flour, bread for 150 or more; perhaps a traditional measure (Gen. 18:6)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'This amount is very large (about fifty pounds of flour; Greek saton; Hebrew seah), and estimates suggest that the resulting bread will feed 150 or more people. But the amount may be a traditional measure (see Gen. 18:6).'
  - where: 'note 13:21 “Leaven in three measures”'
    claim: 'The woman balances the man of 13:19; Jesus raises the woman as He called the woman of the prior scene a daughter of Abraham'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The term, from a deliberate pairing, balances the word for “man” in 13:19, pointing to a kingdom that welcomes them both as full members … Jesus’ elevating of a woman in this parable highlights his obvious aim to raise the status of women when he calls the woman in the prior scene “a daughter of Abraham” (13:16).'
  - where: 'note 13:21 “Leaven in three measures”'
    claim: 'Joseph Smith: the Church rose from a little leaven put into three witnesses'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/4'
    quote: 'It may be understood that the church of the Latter Day Saints, has taken its rise from a little leaven that was put into three witnesses.'
  - where: 'note 13:25 “I know you not whence ye are”'
    claim: 'JST 13:25 reads “I will not receive you, for ye know not from whence ye are”; the Lord knows them, they do not know their origin'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'the Joseph Smith Translation recomposes the entire line to read, “I will not receive you, for ye know not from whence ye are” (JST 13:25), essentially saying that the Lord, knowing their true lineage, refuses to receive into his home'
  - where: 'note 13:25 “I know you not whence ye are”'
    claim: 'Luke’s Jesus knows people’s thoughts, so “I know you not” makes no sense of Him; under the JST those inside know their divine origin'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'In this light, those who are within acknowledge what those without do not—they know their divine origin, an element of understanding that they can obtain only from Jesus'
  - where: 'note 13:25 “I know you not whence ye are”'
    claim: 'Familiarity, mere proximity, does not open the door; many ate with Jesus without hearing His message'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'But an appeal to a former, perceived camaraderie—essentially a mere proximity—does not unlock the door. The reference to eating and drinking illustrates that people, including nondisciples, often enjoy table fellowship with Jesus, frequently not really hearing his message'
  - where: 'note 13:25 “I know you not whence ye are”'
    claim: 'JST: “shut the door of the kingdom”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The sense that the door leads into Jesus’ kingdom is solidified in the Joseph Smith Translation, which augments this expression to read, “shut the door of the kingdom” (JST 13:25).'
  - where: 'note 13:29 “From the east and the west”'
    claim: 'The saying points above all to Gentiles; it recalls Isaiah’s feast for all people'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'This notation points above all to Gentiles … Hence, Jesus’ words open the kingdom to non-Jews … Because of the banqueting references, Jesus’ words point back to Isaiah’s prophecy about the feast of the Lord to which he will invite “all people”'
  - where: 'note 13:29 “From the east and the west”'
    claim: '“Sit down” means recline at a meal: a banquet'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'The verb (Greek anaklinō), in the passive voice, means to recline at a meal rather than to sit down'
  - where: 'note 13:29 “From the east and the west”'
    claim: 'Israelite lineage would not save; many not of the covenant people would be saved'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'The people were warned that their Israelitish lineage would in no wise save them, for many who were not of the covenant people would believe and be saved, while unworthy Israelites would be thrust out.'
  - where: 'note 13:29 “From the east and the west”'
    claim: 'JST 13:30 adds “and shall be saved therein,” closing the question of 13:23'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'the Joseph Smith Translation adds a summarizing sentence at the end of this verse: “and shall be saved therein” (JST 13:30). This expression cements Jesus’ discussion of salvation, bringing a closure of sorts to the original question in 13:23'
  - where: 'note 13:31 “A warning from Pharisees”'
    claim: 'These Pharisees seem well disposed toward Him, probably from Galilee'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'In contrast to the Pharisees with whom Jesus differs … this group seems to be well-disposed toward him, warning him of Herod Antipas’s ill intent'
  - where: 'note 13:31 “A warning from Pharisees”'
    claim: 'Some see Pharisaic cunning, to drive Him toward Jerusalem; Talmage judges them possibly humane, even believers'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'some commentators regard this warning as another evidence of Pharisaic cunning—possibly intended to rid the province of Christ’s presence, or designed to drive Him toward Jerusalem … those who came informing Christ of a plot against His life were possibly impelled by humane motives, and may even have been believers at heart.'
  - where: 'note 13:31 “A warning from Pharisees”'
    claim: 'Herod Antipas had already beheaded John the Baptist'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'Our understanding of the gravity of this threat is heightened as we remember that Herod Antipas had already beheaded John the Baptist (see Luke 9:9).'
  - where: 'note 13:32 “That fox”'
    claim: '“That fox” is a term of contempt showing Jesus’s lack of fear'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'The phrase “that fox” is “a term of contempt” that shows Jesus’s utter lack of fear toward men.'
  - where: 'note 13:32 “That fox”'
    claim: 'Fox means a crafty person in Greek literature; in Ezek. 13:4 a foolish prophet; JST substitutes “Herod”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'carries the meaning of a clever or crafty person in classical and Hellenistic literature. In the Old Testament, the equivalent Hebrew word shu’al comes to mean a foolish prophet (see Ezek. 13:4). … The Joseph Smith Translation simply substitutes the name Herod for this expression (see JST 13:32)'
  - where: 'note 13:32 “That fox”'
    claim: 'Jesus’s reply turns from Herod to His mission of teaching, blessing and healing'
    key: olson-final-trek
    url: 'https://rsc.byu.edu/vol-13-no-3-2012/saviors-teachings-discipleship-during-his-final-trek-jerusalem'
    quote: 'But the thrust of Jesus’ reply had little to do with the threat from Herod Antipas. Instead the Savior focused on his divine mission, affirming that he would continue to seize each opportunity to teach, bless, and heal others'
  - where: 'note 13:32 “The third day I shall be perfected”'
    claim: 'teleioō: to carry through, finish; Luke 13:32 middle “I finish what was given me to do,” or passive “I am perfected,” of His death'
    key: thayer
    url: 'https://biblehub.com/greek/5048.htm'
    quote: 'τελειοῦμαι, I finish complete, what was given me to do, Luke 13:32 (some (so A. V.) take it here as passive, I am perfected (understanding it of his death'
  - where: 'note 13:32 “The third day I shall be perfected”'
    claim: 'The third day anticipates the resurrection'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'Jesus’ words point to and anticipate the day of his resurrection (see 9:22; 18:33; 24:7, 21, 46).'
  - where: 'note 13:32 “The third day I shall be perfected”'
    claim: 'The passive implies the Father’s part in Jesus’s completion'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'At base, in the active voice it means “to bring to completeness, wholeness”; it has to do with finishing what is begun. The passive indicates that another person—the Father in this case—is involved in Jesus’ completion, in his perfection'
  - where: 'note 13:32 “The third day I shall be perfected”'
    claim: 'JST 13:33 changes “the day following” to “the third day”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-13-104'
    quote: 'In an important change that aims this series of sayings toward Jesus’ Atonement, the Joseph Smith Translation changes these words to read “the third day” (JST 13:33).'
  - where: 'note 13:32 “The third day I shall be perfected”'
