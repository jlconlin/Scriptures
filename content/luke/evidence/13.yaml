    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'this conception is the more probable if the generally accepted assumption be correct, that the calamity came upon the men while they were engaged under Roman employ in work on the aqueduct, for the construction of which Pilate had used the “corban” or sacred treasure'
