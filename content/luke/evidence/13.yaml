    url: 'https://biblehub.com/commentaries/ellicott/luke/13.htm'
    quote: 'Here, again, we have a reference to an incident not recorded elsewhere. … It was supplied through artificial conduits, and appears to have been one of a series of pools so fed.'
  - where: 'note 13:1 “Blood mingled with sacrifices”'
    claim: 'The tower may have been part of the aqueduct Pilate built with the Corban, so its fall was seen as judgment on sacrilege'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/13.htm'
    quote: 'that the tower in question was part of the works which Pilate had planned, and partly executed, for the construction of an aqueduct, and for which he appropriated part of the Corban or sacred treasure of the Temple'
  - where: 'note 13:1 “Blood mingled with sacrifices”'
    claim: 'The aqueduct conjecture is still repeated as generally accepted'
