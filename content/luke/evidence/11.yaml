  - where: 'note 11:48 “Tombs for the prophets”'
    claim: '“Allow” always means approving in the English Bible; the same Greek word is “have pleasure in” in Rom. 1:32'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The word “allow” has, as always in the English Bible, the meaning of “approving of,” “consenting to,” “having pleasure in.” The last phrase is the rendering of the same Greek word in Romans 1:32'
  - where: 'note 11:48 “Tombs for the prophets”'
    claim: 'Regard for the prophets’ tombs had long been national pride'
