chapter: 11
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'Luke draws the journey section (9:51–19:27) from teachings not tied to a time and place'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Luke’s imprecise language demonstrates that he draws much of his “journey” section, 9:51 to 19:27, from a pool of Jesus’ teachings that are not connected to a specific time and place.'
  - where: when
    claim: 'Luke gives the Beelzebub scene no place or time'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Luke provides no context for Jesus’ actions, neither a place nor a time.'
  - where: setting
    claim: 'The chapter picks up the themes of prayer and home from the Mary and Martha story'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The first part of this chapter links back to themes that arise in the story of Mary and Martha (see 10:38–42), that is, prayer and home'
  - where: setting
    claim: 'Much of the journey section comes from teachings remembered without time and place'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'he draws much of his “journey” section, 9:51 to 19:27, from a pool of Jesus’ teachings that are not connected to a specific time and place.'
  - where: setting
    claim: 'Nothing requires one occasion; teachers repeat; the settings differ so much they argue for different occasions with similar instruction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'nothing requires that Jesus speak the same or similar words on one occasion only. To limit him in this artificial way goes against shared experiences among noted teachers, including those in antiquity, who frequently repeat themselves.'
  - where: setting
    claim: 'The meal at the Pharisee’s house is a key moment; the opposition, quiet since Galilee (6:11), takes new life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The opposition that has been dogging his steps during recent months, after breaking out in Galilee (see 6:11), seems to have grown rather quiet. … In a word, Jesus’ opponents take new life from the heated exchange.'
  - where: thread
    claim: 'The chapter’s unity is in contrasts: prayer, then light, then condemnation of those full of darkness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'This unity consists of contrasts, beginning with the Savior’s treatment of prayer (see 11:1–13), which leads to light and enlightenment (see 11:33–36), and ends with his condemnation of those who in effect are “full of darkness” (11:34)'
  - where: thread
    claim: 'Those who should be receiving light smother it, and honor the forebears who killed the prophets'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'those who should be religious and should be receiving light but in fact smother it by putting it “in a secret place” or “under a bushel” (11:33).'
  - where: thread
    claim: 'The second half of the chapter concerns judgment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The second section has to do with judgment (see 11:29–54).'
  # ---- sections
  - where: section 1 plain
    claim: '“Importunity” rendered “shameless persistence”: anaideia is shamelessness, of a man persisting in his entreaties'
    key: thayer
    url: 'https://biblehub.com/greek/335.htm'
    quote: 'shamelessness, impudence: Luke 11:8 (of an importunate man, persisting in his eritreaties; (A. V. importunity)).'
  - where: section 2 plain
    claim: '“Garnished” rendered “put in order”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'put in order.'
  - where: section 2 plain
    claim: 'The unclean spirit rendered “it,” as in the JST'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'And when it cometh, it findeth the house swept and garnished.'
  - where: section 3 plain
    claim: '“Candle” rendered “lamp”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The word (Greek lychnos) refers to a lamp, not a candle (see 8:16).'
  - where: section 4 plain
    claim: '“Ravening” rendered “plunder”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'plunder, spoil.'
  - where: section 5 plain
    claim: '“Reproachest” rendered “insult”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The verb (Greek hybrizō) means “to treat with contempt,” “to insult,” or “to abuse.”'
  - where: section 5 plain
    claim: '“Allow” rendered “approve of”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Properly, the verb (Greek syneudokeō) means “to approve of” or “to sympathize with,” a much stronger charge.'
  # ---- notes
  - where: 'note 11:1 “The prayer taught a second time”'
    claim: 'The disciple who asks evidently had not heard the prayer in the Sermon on the Mount'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'it seems that this person is not one who follows and hears Jesus from early in his ministry. … Hence, whoever makes the request evidently does not hear Jesus utter this earlier, model prayer.'
  - where: 'note 11:1 “The prayer taught a second time”'
    claim: 'Some take it as one source placed differently; the settings differ so much they argue for different occasions with similar instruction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Further, the settings sketched by Matthew and Luke differ so remarkably from one another that they argue for different occasions yet similar instruction.'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'Luke’s prayer asks for forgiveness of sins, a miracle of the Atonement; Matthew’s asks a broader forgiveness of debts owed, including to God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'In the earlier version of the Lord’s prayer, he instructs his disciples to ask for a broader forgiveness, that of debts owed to another, including God, which can include sins that distance the transgressor from God'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'Forgiveness of sins is one of the miracles of the Atonement'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus’ model here instructs disciples to ask the Father specifically for a forgiveness of sins, one of the miracles of the Atonement.'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'The clause gives the reason for the request: because we forgive'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: '“because we forgive, we therefore seek forgiveness.” In this pattern, a person’s actions, so to speak, are very much a prerequisite to an appeal to God for merciful assistance.'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'Peirasmos can mean temptation or trial; the sense is “preserve us from severe trial”; by the JST God does not lead into temptation and is the refuge from it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The sense is, “preserve us from severe trial.” The term rendered “temptation” (Greek peirasmos) may carry the sense of temptation to commit sin (see 4:13; 22:40, 46) or the sense of trial'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'By the JST, God does not lead into temptation but is the refuge from it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Doctrinally, it becomes clear that God does not lead us into temptation, implying that he is the refuge from such an experience (see 22:46).'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'JST Luke 11:4 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'And let us not be led unto temptation; but deliver us from evil; for thine is the kingdom and power. Amen.'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'The JST ending resembles Matthew 6:13 but is not identical, likely restoring Luke’s original intent'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'we also note that the JST is not identical to Matthew’s record, likely pointing to a restoration of original intent in Luke’s report.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'Life ran by the sun; midnight was the most inopportune hour'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Except in the homes of the wealthy, life is typically governed by the sun’s rising and setting. … sets the story at the most inopportune time of the night.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The traveler is a friend with a further claim'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The man who comes “in his journey” is more than a mere guest with needs, not only because he is away from home but because he holds a further, more meaningful claim based on friendship.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The man in bed does not deny having bread; his answer is out of character in the ancient East'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'he does not deny that he has bread in his house. But by responding in this way he tries to avoid doing so, although his answer is completely out of character in the ancient Orient.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'JST Luke 11:5–6 adds a sentence and calls the story a parable'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'And he said unto them, Your heavenly Father will not fail to give unto you whatsoever ye ask of him. And he spake a parable, saying, Which'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The additions show the story illustrates God’s pattern of answering prayer'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Such additions tell us more clearly that Jesus will be setting out an illustration that graphically reflects God’s pattern of action, particularly his response to prayers.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: '“How much more”: the Father gives much better gifts than people give one another'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Here lies the main point of Jesus’ set of illustrations about answers to a person’s prayer: our heavenly Father will give much better gifts to us than we give to one another.'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'Anaideia: shamelessness, of a man persisting in his entreaties'
    key: thayer
    url: 'https://biblehub.com/greek/335.htm'
    quote: 'shamelessness, impudence: Luke 11:8 (of an importunate man, persisting in his eritreaties; (A. V. importunity)).'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'Friendship would not get the man out of bed; insistent imploring would'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Friendship will carry so far, yet not enough to overcome the man’s inertia who lies in bed. But insistent imploring will.'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'Ask, seek, knock are present imperatives: continuing, sustained action'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The form of this verb, and the following two, is the present imperative. Together, they convey the sense of continuing, sustained action rather than one-time efforts'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'The Father gives far better than people do (the argument of verse 13)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'our heavenly Father will give much better gifts to us than we give to one another.'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'The object of prayer is not to change God’s will; blessings are conditional on asking; prayer is a form of work'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant but that are made conditional on our asking for them.'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'Prayer is a form of work'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Prayer is a form of work and is an appointed means for obtaining the highest of all blessings.'
  - where: 'note 11:13 “The best gift”'
    claim: 'Good gifts are foods, evil gifts creatures no one could eat; Jesus speaks in hyperbole'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'he directs their thoughts to common foodstuffs as the good gifts (fish, egg) and, as evil gifts, to creatures that do not, and cannot, serve as food for them (serpent, scorpion).'
  - where: 'note 11:13 “The best gift”'
    claim: '“Being evil”: humans unable of themselves to be fully good'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Within Jesus’ words lies the concept that humans are unable of themselves to be fully good in the ultimate sense'
  - where: 'note 11:13 “The best gift”'
    claim: 'The Father gives far better gifts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'our heavenly Father will give much better gifts to us than we give to one another.'
  - where: 'note 11:13 “The best gift”'
    claim: 'The Holy Spirit is the best gift, saved to the end; the JST makes God the real source of good gifts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'It seems clear that he saves the best gift to the end. In this connection, the Joseph Smith Translation makes an important adjustment'
  - where: 'note 11:13 “The best gift”'
    claim: 'The JST establishes God as the real source of good gifts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'thus establishing God as the real source of “good gifts” (JST 11:14).'
  - where: 'note 11:13 “The best gift”'
    claim: 'JST Luke 11:14 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'good gifts, through the Holy Spirit'
  - where: 'note 11:13 “The best gift”'
    claim: 'Matthew’s list differs and ends with “good things”; the variation argues that Jesus spoke similar words on different occasions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'More naturally, we conclude that Jesus speaks similar words on different occasions, just as noted teachers do.'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'Beelzebub: a Philistine god, a title for Satan; Baalzebub in 2 Kings 1'
    key: bd-beelzebub
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beelzebub?lang=eng'
    quote: 'Name of a Philistine god. Used as a title for the “chief of the demons,” or Satan.'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'The name is a corruption of Baalzebul, “Baal the Prince”; most early manuscripts read Beelzebul; Beelzebub means “Lord of flies”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The name is a corruption of a Semitic title Baalzebul that means “Baal the Prince” or “Baal of the Exalted Abode.” Most early manuscripts read “Beelzebul.” The name “Beelzebub” means “Lord of flies.”'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'The accusation was prophesied more than 150 years before (Mosiah 3:9)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'That people will accuse Jesus of operating under the power of the devil is prophesied more than 150 years before this scene (see Mosiah 3:9).'
  - where: 'note 11:20 “The finger of God”'
    claim: 'Verse 19 acknowledges that others besides Jesus practice exorcism; how they will be judges He does not say'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus’ question forms an acknowledgment that, in addition to himself, others practice exorcism.'
  - where: 'note 11:20 “The finger of God”'
    claim: 'How the sons will be judges is not specified'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Exactly how the “sons” of Jesus’ detractors will serve as judges, he does not specify.'
  - where: 'note 11:20 “The finger of God”'
    claim: 'The phrase comes from Exodus 8:19; Jesus may mean He works by no charms'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The phrase appears first in Exodus 8:19 in the mouths of the magicians in Pharaoh’s court. In this light, Jesus may be saying that he does not work miracles by charms and incantations.'
  - where: 'note 11:20 “The finger of God”'
    claim: 'Ps. 8:3 and Ex. 31:18: the finger of God in creation and the law; Jesus’ works are extensions of those acts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Hence, Jesus’ words allude to both the creation and the giving of the law, and affirm that his actions are congruent with, and form extensions of, those divine actions.'
  - where: 'note 11:20 “The finger of God”'
    claim: 'Phthanō, aorist: the kingdom has arrived with Jesus’ preaching and works'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The verb (Greek phthanō) appears in the aorist tense, the simple past, and means “to come before, to precede.” It can also mean simply “to arrive.”'
  - where: 'note 11:20 “The finger of God”'
    claim: 'The kingdom arrives with Jesus’ preaching and activity'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'the verb signals that the kingdom of God, an external entity, arrives with Jesus’ preaching and activity'
  - where: 'note 11:22 “The stronger man”'
    claim: 'The strong man is Satan'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The expression is properly “the strong man.” In this light, and in a metaphorical sense, this strong man has to be Satan'
  - where: 'note 11:22 “The stronger man”'
    claim: 'The stronger one is Jesus Himself'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'On the more important metaphorical level, of course, the expression points to Jesus himself as the “stronger [one]”'
  - where: 'note 11:22 “The stronger man”'
    claim: 'The goods are souls captured by the devil, yielded up whether in mortality or among the dead'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'the conquered Satan has to yield up his power as well as those persons he has captured, whether in mortality or among the departed dead'
  - where: 'note 11:22 “The stronger man”'
    claim: 'The preferred sense of the spoils is the souls captured by the devil'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The preferred sense of the passage points to goods captured by the strong man, that is, the souls captured by the devil.'
  - where: 'note 11:22 “The stronger man”'
    claim: 'In the healing the devil had bound the man’s tongue'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'It is that the devil controls or binds the tongue of the possessed man'
  - where: 'note 11:23 “With me, or for us?”'
    claim: 'The saying is to be added to 9:50, which is warm toward allies (“us”); this one concerns a disciple’s relationship to the Savior (“me”)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Certainly, the principle here is to be added to his earlier declaration about his authorized disciples, “he that is not against us is for us,” embracing a warm view of allies because of the plural “us” (9:50).'
  - where: 'note 11:23 “With me, or for us?”'
    claim: 'The saying concerns a disciple’s relationship to the Savior'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Because Jesus stands as the focus of the saying—“not with me” and “against me”—his words have rather to do with a disciple’s understanding of his or her relationship to the Savior'
  - where: 'note 11:23 “With me, or for us?”'
    claim: 'In scripture it is usually God who scatters; one who scatters acts without His direction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'When people are scattered, it is usually God who acts'
  - where: 'note 11:23 “With me, or for us?”'
    claim: 'One who scatters is not acting under God’s direction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'one who scatters takes up a role controlled by God and the question becomes whether that person acts under God’s direction. According to Jesus, the answer is no.'
  - where: 'note 11:26 “Swept, garnished and empty”'
    claim: '“Garnished”: put in order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'put in order.'
  - where: 'note 11:26 “Swept, garnished and empty”'
    claim: 'The story continues the theme of home and household'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'in his story about the banished unclean spirit (see 11:24–26)'
  - where: 'note 11:26 “Swept, garnished and empty”'
    claim: 'One freed of evil who does not replace it with good stays in difficulty; D&C 82:7'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'For a person who is freed of evil influences, but does not replace them with good routines and habits, life will continue to be aggravated with difficulties: “unto that soul who sinneth shall the former sins return” (D&C 82:7).'
  - where: 'note 11:26 “Swept, garnished and empty”'
    claim: 'The devil and his minions do not give up easily'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Fourth, he and his minions do not give up easily, as the story of the “unclean spirit” and his seven allies proves.'
  - where: 'note 11:28 “Blessed rather”'
    claim: 'The woman praises Jesus and Mary who raised Him'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The woman is not only singing the praises of Jesus, the extraordinary child, but also of Mary who raises him.'
  - where: 'note 11:28 “Blessed rather”'
    claim: 'Second time Jesus points to hearing and doing when attention turns to His mother (8:21)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'For the second time in Jesus’ ministry, when events come to focus on his mother, he points to hearing and doing'
  - where: 'note 11:28 “Blessed rather”'
    claim: 'Mary is the great exemplar of hearing the word of God and keeping it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'In this light, we can conclude that, in Jesus’ mind, Mary stands as the grand exemplar of hearing “the word of God” and keeping it'
  - where: 'note 11:28 “Blessed rather”'
    claim: 'The footnote at 11:27 sets Luke 1:48 beside the woman’s blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'Luke 1:48.'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'In Luke the sign has nothing to do with the resurrection, as in Matthew, but with repentance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'It has nothing to do with the resurrection, as in Matthew 12:39–40, but rather repentance'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'Jonah’s connection is to the Gentile Ninevites who repented and escaped doom'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus seeks to underscore the prophet’s connection to the gentile people of Nineveh who repent at his preaching and thereby escape a horrible doom (see Jonah 3:1–10).'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'Jesus Himself is the visible sign; repentance is the key of His ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'It stands forth as the key ingredient in Jesus’ ministry, for he is its visible “sign” (11:30).'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'The audience is resisting the repentance Jonah called for'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'rests squarely on Jonah as a catalyst for repentance, an act which Jesus’ audience is resisting.'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'The queen of the south is the queen of Sheba'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus draws up to our view the queen of Sheba (see 1 Kgs. 10:1–10; 2 Chr. 9:1–12).'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'Rising in the judgment is a courtroom scene with witnesses standing up'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'First, Jesus paints a courtroom scene wherein witnesses or accusers stand up, a meaning that the verb carries'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'Jesus places Himself above a king and a prophet'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'This comparison is the first of two whereby Jesus elevates himself above authorities, here, a king and, later, a prophet (see 11:32).'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'The Gentiles respond as Jesus’ generation does not, recalling the Gentiles of the Nazareth sermon (4:24–27)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Gentiles, whom the Ninevites and the queen represent, respond to spiritual stimuli in a way that people of Jesus’ generation do not, thus bringing to these Gentiles the blessings of God. In their own way, these stories point backward'
  - where: 'note 11:34 “A single eye”'
    claim: 'Haplous: single, without folds; of the eye, sound, fulfilling its office'
    key: thayer
    url: 'https://biblehub.com/greek/573.htm'
    quote: 'simple, single (in which there is nothing complicated or confused; without folds (cf. Trench, § lvi.)); whole; of the eye, good, fulfilling its office, sound: Matthew 6:22; Luke 11:34'
  - where: 'note 11:34 “A single eye”'
    claim: 'Haplous can mean healthy physically and pure ethically; JST Matt. 6:22 “single to the glory of God”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The meaning of the word (Greek haplous) can be “healthy” in a physical context, but “pure” in an ethical or spiritual sense.90 In Matthew’s rendition, the Joseph Smith Translation expands the text to read “single to the glory of God,”'
  - where: 'note 11:34 “A single eye”'
    claim: 'Inner light can be extinguished'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus holds up the possibility that a person’s inner light can be extinguished, allowing debilitating darkness to take up residence.'
  - where: 'note 11:34 “A single eye”'
    claim: 'The footnote at 11:34 points to D&C 88:67–68'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'D&C 88:68 (67–68).'
  - where: 'note 11:34 “A single eye”'
    claim: 'The one who prays, keeps the home united and honors Jesus receives light'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'the person who prays (see 11:1–13) and maintains unity in the home (see 11:14–28) and honors Jesus (see 11:29–32) receives light'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'Pharisees washed hands before meals, an extension of the ancient washing of feet; the verb is baptizō, “to immerse”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'According to Mark, the Pharisees hold to the custom of washing their hands before meals (see Mark 7:2–5), an extension and change of the custom of washing feet known from antiquity'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'The verb is “to immerse,” perhaps a ritual pool; Jesus presumably knew the practice and did not wash'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'But the verb signifies “to immerse” (Greek baptizō), perhaps pointing to bathing in a mikvah or ritual washing pool.'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'Jesus presumably knew the practice'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'even in the home of a Pharisee where, presumably, Jesus knows about the practice of washing hands before a meal, he does not wash'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'Probably deliberate, to show that outward acts disclose little'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'We suspect that Jesus purposely omits washing his hands or immersing himself in the company of the other guests, knowing full well how they will receive his disregard for a commonly revered practice.'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'Outward actions disclose little of a person'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'He seems anxious to make his point to these influential guests that external, public actions disclose little of a person’s state of being'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'At issue is public style against inner character'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'At issue is public style versus inner character.'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: '“Ravening”: plunder'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'plunder, spoil.'
  - where: 'note 11:41 “Clean from within”'
    claim: 'Ta enonta means “what is inside”; two readings'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'the expression translated as “such things as ye have” (Greek ta enonta), which means “what is inside.” A couple of interpretations suggest themselves: (1) give alms from the heart; (2) from what is within your basket and store, make an alms gift.'
  - where: 'note 11:41 “Clean from within”'
    claim: '“All things are clean” has several possible meanings'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Does he mean that when a person offers alms from the heart then washing hands is not necessary for true cleansing? All these interpretations are possible.'
  - where: 'note 11:41 “Clean from within”'
    claim: 'JST Luke 11:42 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'But if ye would rather give alms of such things as ye have; and observe to do all things which I have commanded you, then would your inward parts be clean also.'
  - where: 'note 11:41 “Clean from within”'
    claim: 'The JST makes obedience the condition of becoming clean and implies some had heard Him before'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The addition of “observe to do all things which I have commanded you” implies that some in the gathering have heard him before and makes their response to Jesus’ bidding into the condition of becoming clean.'
  - where: 'note 11:42 “Tithing the herbs”'
    claim: 'The law required tithes on produce, including gifts to the needy'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Biblical law requires a person to pay tithes on the harvest of produce, including in the tithe gifts to the needy (see Lev. 27:30; Deut. 14:22; 26:12–13).'
  - where: 'note 11:42 “Tithing the herbs”'
    claim: 'The saying upholds the ceremonial law while holding to its moral essence, including tithing'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Hence, the saying justifies the ceremonial part of the Old Testament law while holding onto its moral and religious essence, including the principle of tithing (see 16:16–17).'
  - where: 'note 11:42 “Tithing the herbs”'
    claim: 'Six woes, three on Pharisees, three on lawyers; the Pharisees’ for attention to tiny outward duties, love of honor, and being graves'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Luke erects the whole passage on the framework of six woes, three uttered by Jesus against the Pharisees and three against the lawyers or scribes. The first of his dark sayings falls generally on Pharisees, without marking any individual, because of tedious attention to tiny, outward efforts'
  - where: 'note 11:44 “Graves no one sees”'
    claim: 'The law forbade contact with the dead for those who would be clean; those claiming cleanness made others unclean by touch'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Here, those who claim to be clean are themselves unclean to such a pitch that they render others unclean by mere touching'
  - where: 'note 11:44 “Graves no one sees”'
    claim: 'Jesus appeals to the Mosaic law on contact with the dead (Num. 19)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus appeals to the Mosaic law that does not allow a person any contact with the dead if that person wants to remain ritually clean (see Lev. 21:1–4, 11; Num. 19:11–22).'
  - where: 'note 11:45 “The lawyers”'
    claim: 'Lawyers and scribes are interchangeable terms for the same group, as 11:53 hints; specialists since Ezra'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The best research concludes that “lawyers” (Greek nomikos) and “scribes” (Greek grammateus) are interchangeable terms for the same group of people, as the term in 11:53 hints.'
  - where: 'note 11:45 “The lawyers”'
    claim: 'Scribes, sometimes called lawyers, developed and applied the law; the oral law grew beside the written'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'Scribes are frequently mentioned in the New Testament, being sometimes called lawyers. It was their business to develop the law in detail and apply it to the circumstances of their time; hence grew up the oral or traditional law side by side with the written law.'
  - where: 'note 11:45 “The lawyers”'
    claim: 'As a rule scribes were Pharisees'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'As a rule they were Pharisees (Mark 2:16; Acts 23:9), though there were also Sadducean scribes.'
  - where: 'note 11:45 “The lawyers”'
    claim: 'Hybrizō: to treat with contempt, insult'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The verb (Greek hybrizō) means “to treat with contempt,” “to insult,” or “to abuse.”'
  - where: 'note 11:48 “Tombs for the prophets”'
    claim: 'Syneudokeō: to approve of, a stronger charge'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Properly, the verb (Greek syneudokeō) means “to approve of” or “to sympathize with,” a much stronger charge.'
  - where: 'note 11:48 “Tombs for the prophets”'
    claim: 'The footnote gloss for “allow”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'agree, accord with.'
  - where: 'note 11:48 “Tombs for the prophets”'
    claim: 'The woe falls on inner disdain for past prophets and pretended eagerness to build their tombs as memorials'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'His second woe crashes down on their inner disdain for prophets past as well as on their pretended eagerness to “build their sepulchres” as memorials of honor (11:47–48).'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'From Abel to Zacharias of 2 Chr. 24, the last book of the Hebrew Bible: first martyr to last'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'beginning with Abel and, in this case, ending with Zacharias who is mentioned in 2 Chronicles 24:20–22, the last book in the Hebrew Bible. Thus Jesus refers to the first martyr noted in scripture and to the last.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'Zacharias son of Jehoiada, stoned for rebuking the people'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus’ reference is rather to Zacharias, son of Jehoiada, whom Jerusalemites stoned c. 840 BC for rebuking them (see 2 Chr. 24:20–22'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The altar of sacrifice stands outside and down the steps from the sanctuary, to the east'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The altar of sacrifice stands just outside and down the steps from the sanctuary, to the east.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: '“The wisdom of God” introduces a quotation from an unknown source'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The quotation evidently comes from an unknown source.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'Later versions of the Protevangelium of James made the slain Zacharias John the Baptist’s father'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'These later versions contended that the Zechariah slain near the temple altar was neither the ninth-century high priest “Zechariah, son of Jehoiada” nor … but a first-century Zacharias, the father of John the Baptist.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The Protevangelium is a noncanonical second-century writing'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The matter became further entangled in the second century AD, when much Christian literature came forward to satisfy the early Christians’ hunger for more details about Jesus’ early life. One of these pieces, the noncanonical Protevangelium of James'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'An unsigned Times and Seasons article of 1 September 1842 repeated it'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'This Mormon newspaper ran an unsigned article entitled “Persecution of the Prophets” on Thursday, September 1, 1842.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The account entered Teachings of the Prophet Joseph Smith, so Latter-day Saints have spread it'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'Because the account made its way into Teachings of the Prophet Joseph Smith, Latter-day Saints have also propagated it.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The editorial is in the third person, its style closest to W. W. Phelps; Joseph Smith did not write it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: '(2) The editorial is written in the third person, not first person; the latter is the preferred style of Joseph Smith.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'Its style matches Phelps; the evidence is that Joseph Smith did not write it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: '(4) The writing style of the Times and Seasons editorial matches that of W. W. Phelps most closely, not the Prophet Joseph. Consequently, the overwhelming heft of the evidence leads to the conclusion that Joseph Smith does not write the editorial in question'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The Bible Dictionary keeps this Zacharias apart from John’s father and refers him to 2 Chr. 24'
    key: bd-zacharias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zacharias?lang=eng'
    quote: '(2) Slain between the temple and the altar (Matt. 23:35; Luke 11:51; see also 2 Chr. 24:20–22).'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'JST Luke 11:53 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'knowledge, the fullness of the scriptures; ye enter not in yourselves into the kingdom; and those who were entering in, ye hindered.'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'The footnote joins Luke 1:77 to the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'ye hindered. Luke 1:77.'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'The key is revelation in the fullness of the scriptures; the charge was twofold'
    key: flinders-key-knowledge
    url: 'https://rsc.byu.edu/book-mormon-message-four-gospels/key-knowledge'
    quote: 'We now know that the “key of knowledge” is revelation, contained in the fullness of the scriptures. The condemnation Jesus directed toward these leaders was twofold'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'They rejected the revelation and kept others from entering'
    key: flinders-key-knowledge
    url: 'https://rsc.byu.edu/book-mormon-message-four-gospels/key-knowledge'
    quote: '(1) they rejected the revelation that would lead them into the kingdom of God, and (2) they exercised an influence that prevented other people from entering therein.'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'Luke 1:77: what was blocked was the knowledge of salvation'
    key: flinders-key-knowledge
    url: 'https://rsc.byu.edu/book-mormon-message-four-gospels/key-knowledge'
    quote: 'Luke 1:77 indicates that what was being blocked was a “knowledge of salvation unto his people by the remission of their sins,”'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'Not only scripture but sacred rites fenced off from common people; the key opens heavenly knowledge (D&C 84:19)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus seems to hold up not only the parts of scripture but also the sacred rites that scribes fence off as too holy to share with common people'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'Such a key opens a door to heavenly knowledge (D&C 84:19)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'More than this, such a key opens a door to heavenly knowledge (see D&C 84:19'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'The hindering was spiritual and intellectual, keeping the key secret'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'the scribes have not physically hindered people in some way, but have done so in a spiritual and intellectual way by keeping “the key of knowledge” secret, consciously intending “to leave the mass of the people in ignorance.”'
  # ---- christ, explore, parallels
  - where: christ
    claim: 'Jesus is the stronger one who overcomes Satan'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'On the more important metaphorical level, of course, the expression points to Jesus himself as the “stronger [one]”'
  - where: christ
