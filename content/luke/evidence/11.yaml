chapter: 11
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'Luke draws the journey section (9:51–19:27) from teachings not tied to a time and place'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Luke’s imprecise language demonstrates that he draws much of his “journey” section, 9:51 to 19:27, from a pool of Jesus’ teachings that are not connected to a specific time and place.'
  - where: when
    claim: 'Luke gives the Beelzebub scene no place or time'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Luke provides no context for Jesus’ actions, neither a place nor a time.'
  - where: setting
    claim: 'The chapter picks up the themes of prayer and home from the Mary and Martha story'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The first part of this chapter links back to themes that arise in the story of Mary and Martha (see 10:38–42), that is, prayer and home'
  - where: setting
    claim: 'Much of the journey section comes from teachings remembered without time and place'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'he draws much of his “journey” section, 9:51 to 19:27, from a pool of Jesus’ teachings that are not connected to a specific time and place.'
  - where: setting
    claim: 'Nothing requires one occasion; teachers repeat; the settings differ so much they argue for different occasions with similar instruction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'nothing requires that Jesus speak the same or similar words on one occasion only. To limit him in this artificial way goes against shared experiences among noted teachers, including those in antiquity, who frequently repeat themselves.'
  - where: setting
    claim: 'The meal at the Pharisee’s house is a key moment; the opposition, quiet since Galilee (6:11), takes new life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The opposition that has been dogging his steps during recent months, after breaking out in Galilee (see 6:11), seems to have grown rather quiet. … In a word, Jesus’ opponents take new life from the heated exchange.'
  - where: thread
    claim: 'The chapter’s unity is in contrasts: prayer, then light, then condemnation of those full of darkness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'This unity consists of contrasts, beginning with the Savior’s treatment of prayer (see 11:1–13), which leads to light and enlightenment (see 11:33–36), and ends with his condemnation of those who in effect are “full of darkness” (11:34)'
  - where: thread
    claim: 'Those who should be receiving light smother it, and honor the forebears who killed the prophets'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'those who should be religious and should be receiving light but in fact smother it by putting it “in a secret place” or “under a bushel” (11:33).'
  - where: thread
    claim: 'The second half of the chapter concerns judgment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The second section has to do with judgment (see 11:29–54).'
  # ---- sections
  - where: section 1 plain
    claim: '“Importunity” rendered “shameless persistence”: anaideia is shamelessness, of a man persisting in his entreaties'
    key: thayer
    url: 'https://biblehub.com/greek/335.htm'
    quote: 'shamelessness, impudence: Luke 11:8 (of an importunate man, persisting in his eritreaties; (A. V. importunity)).'
  - where: section 2 plain
    claim: '“Garnished” rendered “put in order”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'put in order.'
  - where: section 2 plain
    claim: 'The unclean spirit rendered “it,” as in the JST'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'And when it cometh, it findeth the house swept and garnished.'
  - where: section 3 plain
    claim: '“Candle” rendered “lamp”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The word (Greek lychnos) refers to a lamp, not a candle (see 8:16).'
  - where: section 4 plain
    claim: '“Ravening” rendered “plunder”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'plunder, spoil.'
  - where: section 5 plain
    claim: '“Reproachest” rendered “insult”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The verb (Greek hybrizō) means “to treat with contempt,” “to insult,” or “to abuse.”'
  - where: section 5 plain
    claim: '“Allow” rendered “approve of”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Properly, the verb (Greek syneudokeō) means “to approve of” or “to sympathize with,” a much stronger charge.'
  # ---- notes
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'JST Luke 11:4 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'And let us not be led unto temptation; but deliver us from evil; for thine is the kingdom and power. Amen.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'JST Luke 11:5–6 adds a sentence and calls the story a parable'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'And he said unto them, Your heavenly Father will not fail to give unto you whatsoever ye ask of him. And he spake a parable, saying, Which'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'Anaideia: shamelessness, of a man persisting in his entreaties'
    key: thayer
    url: 'https://biblehub.com/greek/335.htm'
    quote: 'shamelessness, impudence: Luke 11:8 (of an importunate man, persisting in his eritreaties; (A. V. importunity)).'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'The object of prayer is not to change God’s will; blessings are conditional on asking; prayer is a form of work'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant but that are made conditional on our asking for them.'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'Prayer is a form of work'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Prayer is a form of work and is an appointed means for obtaining the highest of all blessings.'
  - where: 'note 11:13 “The best gift”'
    claim: 'JST Luke 11:14 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'good gifts, through the Holy Spirit'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'Beelzebub: a Philistine god, a title for Satan; Baalzebub in 2 Kings 1'
    key: bd-beelzebub
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beelzebub?lang=eng'
    quote: 'Name of a Philistine god. Used as a title for the “chief of the demons,” or Satan.'
  - where: 'note 11:26 “Swept and garnished”'
    claim: '“Garnished”: put in order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'put in order.'
  - where: 'note 11:28 “Blessed rather”'
    claim: 'The footnote at 11:27 sets Luke 1:48 beside the woman’s blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'Luke 1:48.'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'In Luke the sign has nothing to do with the resurrection, as in Matthew, but with repentance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'It has nothing to do with the resurrection, as in Matthew 12:39–40, but rather repentance'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'Jesus Himself is the visible sign; repentance is the key of His ministry'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'It stands forth as the key ingredient in Jesus’ ministry, for he is its visible “sign” (11:30).'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'The audience is resisting the repentance Jonah called for'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'rests squarely on Jonah as a catalyst for repentance, an act which Jesus’ audience is resisting.'
  - where: 'note 11:34 “A single eye”'
    claim: 'Haplous: single, without folds; of the eye, sound, fulfilling its office'
    key: thayer
    url: 'https://biblehub.com/greek/573.htm'
    quote: 'simple, single (in which there is nothing complicated or confused; without folds (cf. Trench, § lvi.)); whole; of the eye, good, fulfilling its office, sound: Matthew 6:22; Luke 11:34'
  - where: 'note 11:34 “A single eye”'
    claim: 'The footnote at 11:34 points to D&C 88:67–68'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'D&C 88:68 (67–68).'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: '“Ravening”: plunder'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'plunder, spoil.'
  - where: 'note 11:41 “Clean from within”'
    claim: 'JST Luke 11:42 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'But if ye would rather give alms of such things as ye have; and observe to do all things which I have commanded you, then would your inward parts be clean also.'
  - where: 'note 11:45 “The lawyers”'
    claim: 'Scribes, sometimes called lawyers, developed and applied the law; the oral law grew beside the written'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'Scribes are frequently mentioned in the New Testament, being sometimes called lawyers. It was their business to develop the law in detail and apply it to the circumstances of their time; hence grew up the oral or traditional law side by side with the written law.'
  - where: 'note 11:45 “The lawyers”'
    claim: 'As a rule scribes were Pharisees'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'As a rule they were Pharisees (Mark 2:16; Acts 23:9), though there were also Sadducean scribes.'
  - where: 'note 11:48 “Tombs for the prophets”'
    claim: 'The footnote gloss for “allow”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'agree, accord with.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'From Abel to Zacharias of 2 Chr. 24, the last book of the Hebrew Bible: first martyr to last'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'beginning with Abel and, in this case, ending with Zacharias who is mentioned in 2 Chronicles 24:20–22, the last book in the Hebrew Bible. Thus Jesus refers to the first martyr noted in scripture and to the last.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'Zacharias son of Jehoiada, stoned for rebuking the people'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus’ reference is rather to Zacharias, son of Jehoiada, whom Jerusalemites stoned c. 840 BC for rebuking them (see 2 Chr. 24:20–22'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The altar of sacrifice stands outside and down the steps from the sanctuary, to the east'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The altar of sacrifice stands just outside and down the steps from the sanctuary, to the east.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: '“The wisdom of God” introduces a quotation from an unknown source'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The quotation evidently comes from an unknown source.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'Later versions of the Protevangelium of James made the slain Zacharias John the Baptist’s father'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'These later versions contended that the Zechariah slain near the temple altar was neither the ninth-century high priest “Zechariah, son of Jehoiada” nor … but a first-century Zacharias, the father of John the Baptist.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The Protevangelium is a noncanonical second-century writing'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The matter became further entangled in the second century AD, when much Christian literature came forward to satisfy the early Christians’ hunger for more details about Jesus’ early life. One of these pieces, the noncanonical Protevangelium of James'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'An unsigned Times and Seasons article of 1 September 1842 repeated it'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'This Mormon newspaper ran an unsigned article entitled “Persecution of the Prophets” on Thursday, September 1, 1842.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The account entered Teachings of the Prophet Joseph Smith, so Latter-day Saints have spread it'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'Because the account made its way into Teachings of the Prophet Joseph Smith, Latter-day Saints have also propagated it.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The editorial is in the third person, its style closest to W. W. Phelps; Joseph Smith did not write it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: '(2) The editorial is written in the third person, not first person; the latter is the preferred style of Joseph Smith.'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'Its style matches Phelps; the evidence is that Joseph Smith did not write it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: '(4) The writing style of the Times and Seasons editorial matches that of W. W. Phelps most closely, not the Prophet Joseph. Consequently, the overwhelming heft of the evidence leads to the conclusion that Joseph Smith does not write the editorial in question'
  - where: 'note 11:51 “From Abel to Zacharias”'
    claim: 'The Bible Dictionary keeps this Zacharias apart from John’s father and refers him to 2 Chr. 24'
    key: bd-zacharias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zacharias?lang=eng'
    quote: '(2) Slain between the temple and the altar (Matt. 23:35; Luke 11:51; see also 2 Chr. 24:20–22).'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'JST Luke 11:53 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'knowledge, the fullness of the scriptures; ye enter not in yourselves into the kingdom; and those who were entering in, ye hindered.'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'The footnote joins Luke 1:77 to the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'ye hindered. Luke 1:77.'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'The key is revelation in the fullness of the scriptures; the charge was twofold'
    key: flinders-key-knowledge
    url: 'https://rsc.byu.edu/book-mormon-message-four-gospels/key-knowledge'
    quote: 'We now know that the “key of knowledge” is revelation, contained in the fullness of the scriptures. The condemnation Jesus directed toward these leaders was twofold'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'They rejected the revelation and kept others from entering'
    key: flinders-key-knowledge
    url: 'https://rsc.byu.edu/book-mormon-message-four-gospels/key-knowledge'
    quote: '(1) they rejected the revelation that would lead them into the kingdom of God, and (2) they exercised an influence that prevented other people from entering therein.'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'Luke 1:77: what was blocked was the knowledge of salvation'
    key: flinders-key-knowledge
    url: 'https://rsc.byu.edu/book-mormon-message-four-gospels/key-knowledge'
    quote: 'Luke 1:77 indicates that what was being blocked was a “knowledge of salvation unto his people by the remission of their sins,”'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'Not only scripture but sacred rites fenced off from common people; the key opens heavenly knowledge (D&C 84:19)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Jesus seems to hold up not only the parts of scripture but also the sacred rites that scribes fence off as too holy to share with common people'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'Such a key opens a door to heavenly knowledge (D&C 84:19)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'More than this, such a key opens a door to heavenly knowledge (see D&C 84:19'
  - where: 'note 11:52 “The key of knowledge”'
    claim: 'The hindering was spiritual and intellectual, keeping the key secret'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'the scribes have not physically hindered people in some way, but have done so in a spiritual and intellectual way by keeping “the key of knowledge” secret, consciously intending “to leave the mass of the people in ignorance.”'
  # ---- christ, explore, parallels
  - where: christ
    claim: 'Jesus is the stronger one who overcomes Satan and takes his armor'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'On the more important metaphorical level, of course, the expression points to Jesus himself as the “stronger [one]”'
  - where: christ
    claim: 'Prayer brings the child’s will into correspondence with the Father’s'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Prayer is the act by which the will of the Father and the will of the child are brought into correspondence with each other.'
  - where: explore
    claim: 'The widow and the judge (18:1–6) repeats the lesson of persistence in prayer'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'The point about persistence in prayer does not stand in cool isolation in Luke’s Gospel but will receive strong reinforcement when, later in Jesus’ ministry, he will repeat another story that carries the same message'
  - where: explore
    claim: 'At another meal (14:1–24) Jesus is more civil and teaches lawyers and Pharisees'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'In another similar setting—a meal—Jesus shows himself to be more civil in demeanor and willing to teach lawyers and Pharisees (see 14:1–24).'
  - where: parallels
    claim: 'The prayer: different occasions, similar instruction'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'Further, the settings sketched by Matthew and Luke differ so remarkably from one another that they argue for different occasions yet similar instruction.'
  - where: parallels
    claim: 'Asking and the gifts: likely taught more than once'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'It is just as likely that Jesus teaches a set of principles more than once during his ministry and that the evangelists are being true to the information that they know.'
  - where: parallels
    claim: 'The lamp and light sayings may be separate sayings on different occasions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-11-104'
    quote: 'it is also possible to understand them as separate sayings that Jesus utters on different occasions.'
  - where: 'note 11:34 “A single eye”'
    claim: 'Some hold that only the moral sense of haplous is lexically warranted'
    key: thayer
    url: 'https://biblehub.com/greek/573.htm'
    quote: 'others contend that the moral sense of the word is the only sense lexically warranted'
  # ---- repair 2026-11-22: rows for the notes recast from sources other than Brown
  - where: 'note 11:1 “The prayer taught a second time”'
    claim: 'Jesus’s example moved the disciples to ask; the law gave no private prayer; the authorities prescribed prayers; John taught his followers'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'Our Lord’s example and the spirit of prayer manifest in His daily life moved the disciples to ask for instruction as to how they should pray. No form of private prayer was given in the law, but formal prayers had been prescribed by the Jewish authorities'
  - where: 'note 11:1 “The prayer taught a second time”'
    claim: 'The prayer was repeated from the Sermon on the Mount and supplemented with teaching on persistence'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'This He had before given in connection with the Sermon on the Mount. On this occasion of its repetition, the Lord supplemented the prayer by explaining the imperative necessity of earnestness and enduring persistency in praying.'
  - where: 'note 11:1 “The prayer taught a second time”'
    claim: 'Jesus prayed aloud, as was the Jewish practice, and the disciples heard Him'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The facts of the case as here narrated, the common practice of the Jews, and the analogy of the prayers in John 11:41, Matthew 26:39, … all lead to the conclusion that our Lord prayed aloud, and that some, at least, of the disciples heard Him.'
  - where: 'note 11:1 “The prayer taught a second time”'
    claim: 'The asker may not have been present at the Sermon, or thought that prayer meant for the multitude and too short beside John’s devotions'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'It seems, at first sight, to follow from this that the disciple who asked this had not been present when the Sermon on the Mount was spoken. It is conceivable, however, that, knowing the pattern prayer which had then been given, he had thought it adapted for the multitude'
  - where: 'note 11:1 “The prayer taught a second time”'
    claim: 'The prayer is reproduced with only verbal variations; what was given to the multitude was enough'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The reproduction, with only a verbal variation here and there, … of what had been given in the Sermon on the Mount (Matthew 6:9-11), is every way significant. That which had been given to the multitude was enough for them.'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'Luke has “sins” for “debts,” perhaps for Gentile readers, keeping Matthew’s idea in “indebted to us”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'St. Luke uses the word “sins” instead of “debts,” as being, perhaps, more adapted to the minds of his Gentile readers, while he retains the primary idea of St. Matthew’s term in the words, “every one that is indebted to us.”'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'Peirasmos: trial of fidelity, and enticement to sin'
    key: thayer
    url: 'https://biblehub.com/greek/3986.htm'
    quote: 'specifically, the trial of man''s fidelity, integrity, virtue, constancy, etc.: 1 Peter 4:12; also an enticement to sin, temptation'
  - where: 'note 11:4 “Forgiveness asked, and temptation”'
    claim: 'In Luke 11:4 peirasmos is the condition or mental state by which one is enticed to sin or a lapse from faith'
    key: thayer
    url: 'https://biblehub.com/greek/3986.htm'
    quote: 'of a condition of things, or a mental state, by which we are enticed to sin, or to a lapse from faith and holiness: in the phrases εἰσφέρειν τινα εἰς πειρασμόν, Matthew 6:13; Luke 11:4'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'Midnight is the hour men expect rest'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: '“Midnight” is chosen as being the time at which, above all others, men expect to be left to their repose. The unexpected visitor asks for “three loaves,” one for himself, one for the guest, one as a reserve'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'He trusts his friend to honor a claim made for another'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'he so far trusts his friend as to hope that he will recognise the claims of his friendship for another.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'A poor man’s house, parents and children in one room, the little ones in one bed, probably the raised platform'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The picture drawn is obviously from a poor man’s house, children and parents sleeping in the same room, the younger children (the Greek word is a diminutive) in the same bed.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The bed is probably the raised platform filling much of a room'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'probably means the divan or raised platform, which often filled nearly half a room in a Jewish or Eastern house.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The host had no bread for a weary guest; he made the guest’s wants his own and pleaded as for himself'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'The man to whose home a friend had come at midnight could not let his belated and weary guest go hungry, yet there was no bread in the house. He made his visitor’s wants his own, and pleaded at his neighbor’s door as though asking for himself.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The neighbor gave to be rid of him; no parallel between his refusal and God’s waiting'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'No parallelism lies between man’s selfish refusal and God’s wise and beneficent waiting.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The neighbor gave so as to get rid of him'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'he at last arose and gave him what he asked, so as to get rid of him and be able to sleep in peace.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The story suggests only an argument from the lesser to the greater: so does not God'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'It seems, indeed, to have been purposely so stated that it could only suggest an à fortiori argument. Thus man might answer, but so does not God.'
  - where: 'note 11:5 “A knock at midnight”'
    claim: 'The JST addition makes clear how prayer will be received by the Father'
    key: sc-knowhy-662
    url: 'https://scripturecentral.org/knowhy/what-do-the-parables-of-the-importuning-friend-and-widow-teach-us-about-prayer'
    quote: 'Jesus went on, explaining not only how to pray but also how this prayer would be received by God the Father. … This is made especially clear in the Joseph Smith Translation of this chapter'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'Literally shamelessness; the word is not used elsewhere in the New Testament'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'Literally, because of his shamelessness. The word is not used elsewhere in the New Testament, and exactly expresses the pertinacity that knows no restraint.'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'If selfish man grants what is asked and asked again, God will with certainty grant what is persistently asked in faith'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'if man, with all his selfishness and disinclination to give, will nevertheless grant what his neighbor with proper purpose asks and continues to ask in spite of objection and temporary refusal, with assured certainty will God grant what is persistently asked in faith and with righteous intent.'
  - where: 'note 11:8 “Shameless persistence”'
    claim: 'The Father sometimes delays that the asking may be more fervent'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'in mercy the Father sometimes delays the granting that the asking may be more fervent.'
  - where: 'note 11:13 “The best gift”'
    claim: 'The scorpion follows the serpent because the two were paired in Luke 10:19'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'the addition of the “scorpion” to the “serpent,” as though the recent combination of the two words in Luke 10:19 had so associated them that the one was naturally followed by the other.'
  - where: 'note 11:13 “The best gift”'
    claim: 'The Holy Spirit, the one highest gift, takes the place of Matthew’s “good things”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'the one highest gift of the “Holy Spirit” taking the place of the wider and less definite “good things” in Matthew 7:11.'
  - where: 'note 11:13 “The best gift”'
    claim: 'People give with imperfect motives; the Father in love and mercy answers sincere petitions'
    key: sc-knowhy-662
    url: 'https://scripturecentral.org/knowhy/what-do-the-parables-of-the-importuning-friend-and-widow-teach-us-about-prayer'
    quote: 'Contrasted to these individuals who knew “how to give good gifts” even with less than perfect motives is the love and mercy of our Heavenly Father as He will respond to our sincere and earnest petitions'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'The Greek form Beelzeboul is read “lord of dung,” of filth or idolatry; Beelzebub is found in no Greek authority'
    key: thayer
    url: 'https://biblehub.com/greek/954.htm'
    quote: 'Βηλζεβουλ and, as written by some (yet no Greek) authorities, Βηλζεβουβ'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'Beelzeboul: lord of dung, of filth, of idolatry'
    key: thayer
    url: 'https://biblehub.com/greek/954.htm'
    quote: 'The form Βηλζεβουλ is composed of זְבוּל (rabbinical Hebrew for זֶבֶל dung) and בַּעַל, lord of dung or of filth, i. e. of idolatry'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'Beelzebub: lord of flies, god of Ekron, a name transferred to Satan in contempt; the derivation is doubted'
    key: thayer
    url: 'https://biblehub.com/greek/954.htm'
    quote: 'derive the name from זְבוּב בַּעַל, lord of flies, a false god of the Ekronites (2 Kings 1:2) having the power to drive away troublesome flies, and think the Jews transferred the name to Satan in contempt.'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'Some doubt whether the true derivation has been found'
    key: thayer
    url: 'https://biblehub.com/greek/954.htm'
    quote: 'doubt alike whether the true derivation of the name has yet been hit upon'
  - where: 'note 11:15 “Beelzebub”'
    claim: 'The footnote at 11:15 points to Mosiah 3:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'Mosiah 3:9 (9–12); Hel. 13:26 (26–27).'
  - where: 'note 11:20 “The finger of God”'
    claim: 'The finger of God: Ex. 8:19, Ex. 31:18, and the prophets’ “hand of the Lord”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'its connection with the use by the older prophets of “the hand of the Lord,” to indicate the state which issued in prophetic inspiration (Ezekiel 1:3; Ezekiel 37:1), and with “the finger of God” as writing the Commandments on the tables of stone (Exodus 31:18)'
  - where: 'note 11:20 “The finger of God”'
    claim: 'The hand denotes power generally; the finger power concentrated and directed'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'As the “hand” denotes power generally, so the “finger” symbolises power in its concentrated and specially-directed energy.'
  - where: 'note 11:20 “The finger of God”'
    claim: 'Phthanō in Luke 11:20 can carry the sense: the kingdom has come upon you sooner than you expected'
    key: thayer
    url: 'https://biblehub.com/greek/5348.htm'
    quote: 'the kingdom of God has come upon you sooner than you expected, Matthew 12:28; Luke 11:20'
  - where: 'note 11:20 “The finger of God”'
    claim: 'Phthanō in later Greek: the idea of priority disappears, to come to, arrive at'
    key: thayer
    url: 'https://biblehub.com/greek/5348.htm'
    quote: 'in the Alex. (and other later) writings the idea of priority disappears, to come to, arrive at'
  - where: 'note 11:20 “The finger of God”'
    claim: 'The footnote at 11:20 points to Ex. 8:19 and Acts 10:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'Ex. 8:19; John 3:2; Acts 2:22; 10:38.'
  - where: 'note 11:22 “The stronger man”'
    claim: 'Christ attacked Satan’s stronghold, driving out spirits; He could not have done it without first subduing the strong man, Satan'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Christ had attacked the stronghold of Satan, had driven his evil spirits from the human tabernacles of which they had unwarrantably taken possession; how could Christ have done this had He not first subdued the “strong man,” the master of devils, Satan himself?'
  - where: 'note 11:22 “The stronger man”'
    claim: 'No truce between Christ and Satan'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'There could be no agreement, no truce nor armistice between the contending powers of Christ and Satan.'
  - where: 'note 11:22 “The stronger man”'
    claim: 'Luke’s fuller report: palace, armed, panoply (as Eph. 6:13), division of spoils'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The only noticeable variations are the use of “palace” for “house;” of the strong man being “armed;” of the “armour” or “panoply” (the same word as in Ephesians 6:13) in which he trusted; of the “division of the spoils.” It is throughout a fuller and more vivid report'
  - where: 'note 11:23 “With me, or for us?”'
    claim: 'Luke 9:50 and this saying are opposite poles of one truth; no neutrality'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'In reality, however, the two formulæ do but present the opposite poles of the same truth. In the great struggle between light and darkness, good and evil, God and the enemy of God, there is no neutrality.'
  - where: 'note 11:23 “With me, or for us?”'
    claim: 'The man John stopped was with Christ; the accusers hindered the work and were on Satan’s side'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'The man of whom the two disciples complained was fighting against the devil in the name of Christ, and was therefore with Him. The Pharisees were hindering and slandering that work, and therefore were on the side of Satan.'
  - where: 'note 11:23 “With me, or for us?”'
    claim: 'Not gathering God’s harvest of souls is scattering and wasting'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'They were not gathering in God’s harvest of souls, and therefore they were scattering and wasting.'
  - where: 'note 11:23 “With me, or for us?”'
    claim: 'The saying invited the accusers to judge on which side they stood'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Offering a suggestion of self judgment to His accusers, that they might severally decide on which side they were aligned, Jesus added: “He that is not with me is against me'
  - where: 'note 11:26 “Swept and garnished”'
    claim: 'The swept house typifies those freed by the truth who afterward renounce the good and become more corrupt'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'In this weird example is typified the condition of those who have received the truth, and thereby have been freed from the unclean influences of error and sin'
  - where: 'note 11:26 “Swept and garnished”'
    claim: 'They renounce the good, open their souls to falsehood, and become more corrupt'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'but who afterward renounce the good, open their souls to the demons of falsehood and deceit, and become more corrupt than before.'
  - where: 'note 11:26 “Swept and garnished”'
    claim: 'Luke omits “empty” and the application to “this wicked generation”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'Here the only variations are (1) the omission of the house being “empty,” and (2) of the application of the parable to “this wicked generation.”'
  - where: 'note 11:28 “Blessed rather”'
    claim: 'The incident is told only by Luke'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The incident is peculiar to St. Luke'
  - where: 'note 11:28 “Blessed rather”'
    claim: 'First direct fulfillment of Luke 1:48; Jesus extended the beatitude, as in the scene with His mother and brethren'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'It is interesting as being the first direct fulfilment of the words of the Magnificat, “All generations shall call me blessed” (Luke 1:48), and as showing how the Son of Mary in this instance, as in Matthew 12:46-50, extended the beatitude.'
  - where: 'note 11:28 “Blessed rather”'
    claim: '“The word of God” is first the message of the kingdom spoken by Jesus, more widely its record'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The term thus used clearly designates here the message of the Kingdom spoken by our Lord Himself, as in the parable of the Sower (Matthew 13:20). In its wider application, it of course includes, though it must not be confined to it, the record of that spoken Word'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: 'Luke omits the explanation of the three days and puts the queen of the south between the sign and Nineveh'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The variations in St. Luke are (1) the omission of the explanation of the manner in which the sign of the prophet Jonah was to be fulfilled by the three days and three nights in the heart of the earth; (2) the position of the reference to the queen of the south'
  - where: 'note 11:30 “The sign of Jonas in Luke”'
    claim: '“Rise” means standing up as witnesses; heathen repentance with poorer opportunities shames Israel’s unbelief'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'The repentance of the heathen, and their search after wisdom, with far poorer opportunities, would put to shame the slowness and unbelief of Israel. The word “rise” is used not of the mere fact of resurrection but of standing up as witnesses.'
  - where: 'note 11:34 “A single eye”'
    claim: 'In Luke the lamp and the eye are brought close together'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'In some respects the sequence of thought in St. Luke differs from that in St. Matthew, and seems somewhat closer. … Here the two thoughts are brought into close proximity.'
  - where: 'note 11:34 “A single eye”'
    claim: 'The warning calls for self-scrutiny against the Light found in Christ’s words and acts'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'The warning is one which calls men to self-scrutiny. … that Light and Standard are found in the teaching of the Light that lighteth every man, in the recorded words and acts of the Son of Man.'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'Baptizō in Luke 11:38: to wash oneself, bathe'
    key: thayer
    url: 'https://biblehub.com/greek/907.htm'
    quote: 'in the middle and the 1 aorist passive to wash oneself, bathe; so Mark 7:4 (where WH text ῥαντισωνται); Luke 11:38'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'Jesus intentionally omitted the ceremonial washing the others performed; it drew disapproval'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'Jesus intentionally omitted the ceremonial washing of hands, which all others in the company scrupulously performed before taking their places at table. The omission caused a murmur of disapproval if not an open expression of fault-finding.'
  - where: 'note 11:38 “Not washed before the meal”'
    claim: 'He used the occasion to criticize externalism, likened to cleaning the outside of cups'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'Jesus utilized the occasion by voicing a pungent criticism of Pharisaic externalism, which He likened to the cleansing of cups and platters on the outside, while the inside is left filthy.'
  - where: 'note 11:41 “Clean from within”'
    claim: 'Ta enonta: what is within, the soul (= v. 39); an ironical exhortation in the Pharisees’ own terms'
    key: thayer
    url: 'https://biblehub.com/greek/1751.htm'
    quote: 'what is within, i. e. the soul, Luke 11:41 (equivalent to τό ἔσωθεν ὑμῶν, Luke 11:39); this is to be regarded as an ironical exhortation (similar to that in Amos 4:4) adjusted to the Pharisees'' own views'
  - where: 'note 11:41 “Clean from within”'
    claim: 'Most take it as the contents of the cup, unjust riches to be given in charity; others as what is within your power'
    key: thayer
    url: 'https://biblehub.com/greek/1751.htm'
    quote: 'and to be spoken of unjustly acquired riches to be expended in charity. (Still others (following the same construction) take τά ἐνόντα (namely, δοῦναι) in the sense of the things within your power'
  - where: 'note 11:41 “Clean from within”'
    claim: 'Most interpreters: the things within the cup and platter'
    key: thayer
    url: 'https://biblehub.com/greek/1751.htm'
    quote: 'Most interpreters think τά ἐνόντα to be the things that are within the cup and the platter'
  - where: 'note 11:41 “Clean from within”'
    claim: 'Selfishness defiles; the love that alms express purifies'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'greater stress is laid on the active purifying power of the love of which alms, if not given for the sake of man’s praise, is the natural expression. That which defiles is selfishness; that which purifies is the unselfishness of love.'
  - where: 'note 11:42 “Tithing the herbs”'
    claim: 'The tithe went back to Moses; literally flocks, herds, fruit, grain; by tradition all produce of the soil'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'As literally construed, the law required the tithing of flocks and herds, fruit and grain, but by traditional extension all products of the soil had been included.'
  - where: 'note 11:42 “Tithing the herbs”'
    claim: 'The law of the tithe from the days of Moses'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The law of the tithe had been a characteristic feature of the theocratic requirements in Israel from the days of Moses'
  - where: 'note 11:42 “Tithing the herbs”'
    claim: 'The Lord approved tithing even herbs, but condemned it as an excuse for neglecting other duties'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The conscientious tithing of all one’s possessions, even potherbs and other garden produce, was approved by the Lord; but He denounced as rank hypocrisy the observance of such requirements as an excuse for neglecting the other duties of true religion.'
  - where: 'note 11:42 “Tithing the herbs”'
    claim: 'The variations from Matthew show independence'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'Here, again, we note minor variations—“rue and all manner of herbs,” for St. Matthew’s “anise and cummin;” “judgment and the love of God,” for “the weightier matters of the law, judgment, mercy, and faith”—sufficient to show independence.'
  - where: 'note 11:42 “Tithing the herbs”'
    claim: 'Words actually repeated, not a narrative misplaced'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'Here, too, we recognise another instance, not of a narrative misplaced, but of words actually repeated.'
  - where: 'note 11:44 “Graves no one sees”'
    claim: 'The rabbis made the slightest contact with a grave defiling; tombs were whitened so no one was defiled unawares'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'As the dogmas of the rabbis made even the slightest contact with a corpse or its cerements, or with the bier upon which it was borne, or the grave in which it has been lain, a cause of personal defilement'
  - where: 'note 11:44 “Graves no one sees”'
    claim: 'Tombs were made conspicuously white'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'care was taken to make tombs conspicuously white, so that no person need be defiled through ignorance of proximity to such unclean places'
  - where: 'note 11:44 “Graves no one sees”'
    claim: 'Earlier unmarked graves, later whitened tombs'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Jesus had before compared Pharisees with unmarked graves, over which men inadvertently walked and so became defiled though they knew it not'
  - where: 'note 11:44 “Graves no one sees”'
    claim: 'The whitewash worn out; men walk over the graves unaware'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/11.htm'
    quote: 'Here the whitewash is worn out, and there is nothing to distinguish the graves, and men walk over them without knowing what lies below the surface.'
  - where: 'note 11:45 “The lawyers”'
    claim: 'A lawyer is equivalent to a scribe: a professional student and teacher of the written law and the traditions of the elders'
    key: bd-lawyer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lawyer?lang=eng'
    quote: 'In the New Testament, equivalent to scribe, one who was by profession a student and teacher of the law, including the written law of the Pentateuch, and also “the traditions of the elders”'
  - where: 'note 11:45 “The lawyers”'
