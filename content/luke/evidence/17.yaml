  - where: 'note 17:13 “Jesus, Master, have mercy on us”'
    claim: 'epistatēs: overseer; used by the disciples for Jesus for His authority, not as teacher; only in Luke'
    key: thayer
    url: 'https://biblehub.com/greek/1988.htm'
    quote: 'a master, used in this sense for רַבִּי by the disciples (cf. Luke 17:13) when addressing Jesus, who called him thus not from the fact that he was a teacher, but because of his authority (Bretschneider); found only in Luke 5:5; Luke 8:24, 45; Luke 9:33, 49; Luke 17:13.'
  - where: 'note 17:13 “Jesus, Master, have mercy on us”'
    claim: 'Mercy and compassion are common in Luke’s portrait of Jesus; Luke adds the ten lepers to the instances of His compassion'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'Especially in Luke, these very terms are common, helping paint the Lucan portrait of a compassionate, loving Jesus. … To these common Synoptic examples, however, Luke adds several others, such as Jesus’s having compassion at the plight of the widow of Nain (Luke 7:13–15) and the ten lepers (17:11–19).'
  - where: 'note 17:37 “The body and the eagles”'
    claim: 'The JST’s added verses are unlike anything else in the Gospels'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'the added verses that appear in the JST version of Luke’s record are entirely new, completely different from anything else in the Gospels.'
