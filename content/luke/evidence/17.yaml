chapter: 17
claims:
  # ---- setting, thread
  - where: setting
    claim: 'The disciples are the chief audience, though Pharisees may still be listening'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Jesus’ followers continue as his chief audience, as 16:1 already indicates, and thus includes all believers. But we cannot rule out that others, such as the Pharisees who are mixed into the crowd (see 16:14; 17:20), are also listening.'
  - where: setting
    claim: 'The words on offences and forgiveness point back to the rich man and Lazarus'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'The references to offensive actions and to the accompanying need for forgiveness plainly point back to the situation of the rich man who imperiously omits acts of generosity toward the poor man Lazarus'
  - where: setting
    claim: 'Verse 11 is one of Luke’s reminders that Jesus is on His long journey to Jerusalem'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Luke does not let his readers forget that he is following Jesus on his long, purposely extended journey to Jerusalem (see 9:51–52)'
  - where: setting
    claim: 'The sayings resemble Matthew’s in other settings and may be similar teachings given on different occasions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'hold out the distinct possibility that Luke’s version of Jesus’ words may be independent and thus refers to a different setting entirely, repeating similar teachings delivered on different occasions.'
  - where: thread
    claim: 'Jesus answers the request for more faith by turning the apostles to faith of another quality'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Rather than meeting their request for more abundant faith, the Savior leads them to faith of a higher quality.'
  - where: thread
    claim: 'The healing of the lepers answers again the apostles’ request to increase their faith'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'the Savior meets the desperate needs of ten lepers in both temporal and eternal terms, and, not incidentally, responds again to the request of the Apostles to increase their faith (see 17:5).'
  - where: thread
    claim: 'The Pharisees’ question assumes the kingdom is future and misses it in Jesus'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'The Pharisees’ question, of course, assumes that the coming of the kingdom is yet in the future, not recognizing its embodiment in Jesus.'
  - where: thread
    claim: 'He will take into His kingdom those who lessen the importance of this world’s goods, as Lot’s wife did not'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'he will take the individuals into his kingdom who, among other acts, respond to him by diminishing the importance of this world’s goods as, sadly, “Lot’s wife” does not (17:32).'

  # ---- 17:1
  - where: 'note 17:3 “Rebuke, then forgive”'
    claim: 'Modern revelation allows rebuke only when moved by the Holy Ghost and followed by love; no grudge is permitted'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Modern revelation stipulates that this kind of action is permitted only if two conditions are present, the inspiring press of the Holy Ghost and a demonstration of genuine love. … Jesus’ words do not permit a person to hold a grudge against an offender.'
  - where: 'note 17:3 “Rebuke, then forgive”'
    claim: 'Seven times means forgiving again and again, without counting, even if the other does not repent'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'But Jesus’ words also push us to grasp his point about forgiving again and again rather than counting a certain number of forgiving acts, even if the other person does not repent (see D&C 98:39–44).'
  - where: 'note 17:3 “Rebuke, then forgive”'
    claim: 'D&C 64:10 requires forgiving all men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men.'
  - where: 'note 17:3 “Rebuke, then forgive”'
    claim: 'D&C 121:43: reproving when moved upon by the Holy Ghost, then an increase of love'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'Reproving betimes with sharpness, when moved upon by the Holy Ghost; and then showing forth afterwards an increase of love toward him whom thou hast reproved, lest he esteem thee to be his enemy;'

  # ---- 17:5
  - where: 'note 17:5 “Increase our faith”'
    claim: 'After the warnings on offence and forgiveness, the apostles saw the whole-souled service required and asked for faith'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Having cautioned them against unguarded utterances or actions at which others might take offense, He proceeded to impress the absolute necessity of unselfish devotion, toleration and forgiveness. The apostles, realizing the whole-souled service required of them, implored the Lord, saying: “Increase our faith.”'
  - where: 'note 17:5 “Increase our faith”'
    claim: 'prostithēmi at 17:5: to add to what one already possesses (KJV “increase”)'
    key: thayer
    url: 'https://biblehub.com/greek/4369.htm'
    quote: 'equivalent to to add viz. to what one already possesses: τί, Luke 17:5 (A. V. here increase)'
  - where: 'note 17:5 “Increase our faith”'
    claim: 'The apostles appear as a body for the first time since chapter 9'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'As a body, these men appear here distinctly for the first time since chapter 9 when Jesus sends them on their first mission.'

  # ---- 17:6
  - where: 'note 17:10 “Unprofitable servants”'
    claim: 'achreios: by a hyperbole of pious modesty the servant calls himself useless, having done only what he ought, and claims no merit'
    key: thayer
    url: 'https://biblehub.com/greek/888.htm'
    quote: 'by an hyperbole of pious modesty in Luke 17:10 ''the servant'' calls himself ἀχρεῖον, because, although he has done all, yet he has done nothing except what he ought to have done; accordingly he possesses no merit'
  - where: 'note 17:10 “Unprofitable servants”'
    claim: 'The word usually means worthless, unfit; elsewhere only Matt. 25:30'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'But the term translated “unprofitable” does not generally bear this sense (Greek achreios), as the only other occurrence of this term in the New Testament underlines (see Matt. 25:30). The word usually means “worthless, unfit.”'
  - where: 'note 17:10 “Unprofitable servants”'
    claim: 'The JST reads “no more than our duty”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'The Joseph Smith Translation strengthens this sense by adding three words: “that which was no more than our duty” (JST 17:10; emphasis added).'
  - where: 'note 17:10 “Unprofitable servants”'
    claim: 'Mosiah 2:24: God blesses obedience immediately and so has paid; we remain indebted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'he doth immediately bless you; and therefore he hath paid you. And ye are still indebted unto him, and are, and will be, forever and ever; therefore, of what have ye to boast?'

  # ---- 17:11
  - where: 'note 17:12 “Which stood afar off”'
    claim: 'The law required a leper to live apart, outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he is unclean: he shall dwell alone; without the camp shall his habitation be.'
  - where: 'note 17:12 “Which stood afar off”'
    claim: 'They came as near as the law allowed; mixed nationality; their plague made them companions'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'probably they came as near as the law permitted, yet they were afar off. These men were of mixed nationality; the plague under which they suffered in common had made them companions in distress.'
  - where: 'note 17:12 “Which stood afar off”'
    claim: 'Unlike the leper of 5:12, these ten respectfully keep their distance'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'In Luke’s other account, the diseased man, in his desperation, comes within the town limits (see 5:12). These ten men respectfully do not.'
  - where: 'note 17:13 “Jesus, Master, have mercy on us”'
    claim: 'Lifting up the voice here bears the sense of prayer'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'In its Hebrew form, to lift up one’s voice can mean “to shout” (see Gen. 39:14–15, 18). But it can also bear the sense of prayer, as it does in this context'

  # ---- 17:14
  - where: 'note 17:18 “This stranger”'
    claim: 'allogenēs: of another race, a foreigner; used in the Septuagint, nowhere in secular writing'
    key: thayer
    url: 'https://biblehub.com/greek/241.htm'
    quote: 'sprung from another race, a foreigner, alien: Luke 17:18. (In the Sept. (Genesis 17:27; Exodus 12:43, etc.), but nowhere in secular writings.)'
  - where: 'note 17:18 “This stranger”'
    claim: 'The term points to Gentiles; it recalls the temple warnings forbidding Gentiles; those the signs forbid, Jesus welcomes'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Jesus’ terminology here points directly to Gentiles, thus underscoring his high regard for them. For, in this repetition of the term for “foreigner”—its only occurrence in the New Testament (Greek allogenēs)—Jesus’ words recall the “no trespassing” signs at the temple that prohibited Gentiles under penalty of death from entering the holy area. Hence, those whom the temple signs forbid, Jesus approves and welcomes.'
  - where: 'note 17:18 “This stranger”'
    claim: '“Turned back” recalls Naaman, to whom Jesus pointed at Nazareth (4:27; 2 Kgs. 5:15)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'But here one perceives a thread that ties back to the story of the cleansing of Naaman, the Syrian officer, to whom Jesus has already drawn specific attention (see 4:27; 2 Kgs. 5:15).'
  - where: 'note 17:18 “This stranger”'
    claim: 'The others were presumably Jews; the scene showed the apostles excellence in aliens'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'We are told that the grateful one was a Samaritan, from which we infer that some or all of the others were Jews. … The occurrence must have impressed the apostles as another evidence of acceptability and possible excellence on the part of aliens'

  # ---- 17:19
  - where: 'note 17:19 “Cleansed, and made whole”'
    claim: 'sōzō carries both salvation and health; the main meaning is “thy faith hath saved thee”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Jesus’ statement offers two meanings—salvation and health. Both senses are present in the Greek verb sōzō and both arise from faith. The main meaning is, “Thy faith hath saved thee [in the kingdom].”'
  - where: 'note 17:19 “Cleansed, and made whole”'
    claim: 'The nine depart cleansed, the one whole, physically and spiritually'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'This line underscores the enduring, fundamental difference between the nine and the one: the nine depart cleansed, the one departs whole in every sense, physical and spiritual (see D&C 78:19; also D&C 46:32).'
  - where: 'note 17:19 “Cleansed, and made whole”'
    claim: 'All can obey and receive the promised blessing, but those who return in gratitude are made whole; D&C 78:19'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'People can do as the Lord instructs and receive the promised blessings (see D&C 130:20–21), but only those who purposely seek him out, in gratitude, will be made whole in the ultimate, celestial sense'
  - where: 'note 17:19 “Cleansed, and made whole”'
    claim: 'D&C 78:19: he who receives all things with thankfulness shall be made glorious'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/78?lang=eng'
    quote: 'And he who receiveth all things with thankfulness shall be made glorious; and the things of this earth shall be added unto him, even an hundred fold, yea, more.'
  - where: 'note 17:19 “Cleansed, and made whole”'
    claim: 'President Monson: the one’s gratitude merited the Master’s blessing; the nine’s ingratitude, His disappointment'
    key: monson-divine-gift-gratitude
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/10/the-divine-gift-of-gratitude?lang=eng'
    quote: 'The expressed gratitude by one merited the Master’s blessing; the ingratitude shown by the nine, His disappointment.'

  # ---- 17:20
  - where: 'note 17:20 “Not with observation”'
    claim: 'μετὰ παρατηρήσεως: in a visible manner, so that it can be watched with the eyes'
    key: thayer
    url: 'https://biblehub.com/greek/3907.htm'
    quote: 'μετά παρατηρήσεως, in such a manner that it can be watched with the eyes, i. e. in a visible manner, Luke 17:20.'
  - where: 'note 17:21 “The kingdom of God is within you”'
    claim: 'The footnote: many translations read “among,” the pronoun being plural'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/17?lang=eng'
    quote: 'Many translations read “among” because the pronoun “you” is plural here in Greek.'
  - where: 'note 17:21 “The kingdom of God is within you”'
    claim: 'entos humōn: in the midst of you; “in your souls” the word permits but not the context'
    key: thayer
    url: 'https://biblehub.com/greek/1787.htm'
    quote: 'within you, i. e. in the midst of you, Luke 17:21 … others, within you (i. e. in your souls), a meaning which the use of the word permits … but not the context'
  - where: 'note 17:21 “The kingdom of God is within you”'
    claim: 'JST 17:21 reads “has already come unto you”'
    key: jst-luke-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/17?lang=eng'
    quote: 'Neither shall they say, Lo, here! or, Lo, there! For, behold, the kingdom of God has already come unto you.'
  - where: 'note 17:21 “The kingdom of God is within you”'
    claim: 'entos is an adverb of place; Jesus nowhere says the kingdom is inside a person; “among you”: His presence brings the kingdom, as the JST agrees'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'the rare word translated “within” (Greek entos) is an adverb of place. The difficulty arises because Jesus nowhere says that the kingdom resides inside a person, but that individuals reside in the kingdom. Since the pronoun “you” is plural, one of the preferred senses is “among you,” that is, Jesus’ presence brings the kingdom.'

  # ---- 17:25
  - where: 'note 17:32 “Remember Lot’s wife”'
    claim: 'The JST makes the man on the housetop “the disciple”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Significantly, the Joseph Smith Translation specifies “the disciple who,” clarifying that Jesus has in mind not unbelievers but those who follow him (JST 17:31).'
  - where: 'note 17:32 “Remember Lot’s wife”'
    claim: 'She yearned to return for her possessions, which Jesus criticizes; D&C 133:15'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Seen through Jesus’ words, she evidently yearns to return home to recover beloved possessions, a passion that Jesus criticizes'
  - where: 'note 17:32 “Remember Lot’s wife”'
    claim: '“Remember” is an active remembrance that shapes how one lives'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'The verb (Greek mnēmoneuō) depicts an active remembrance, a type of remembering that leads us to patterns of living, and even worshiping, that are right before God.'
  - where: 'note 17:32 “Remember Lot’s wife”'
    claim: 'Verse 33 here is about preserving one’s present self-centered life with its possessions'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Here, in contrast, the idea is to preserve one’s current self-centered life (Greek peripoieō), complete with one’s possessions, as the context discloses.'
  - where: 'note 17:32 “Remember Lot’s wife”'
    claim: 'Elder Holland: she looked back longingly; her attachment to the past outweighed her confidence in the future'
    key: holland-remember-lots-wife
    url: 'https://speeches.byu.edu/talks/jeffrey-r-holland/remember-lots-wife/'
    quote: 'So it isn’t just that she looked back; she looked back longingly. In short, her attachment to the past outweighed her confidence in the future. That, apparently, was at least part of her sin.'
  - where: 'note 17:32 “Remember Lot’s wife”'
    claim: 'Elder Holland: she did not have faith; she doubted the Lord could give her something better'
    key: holland-remember-lots-wife
    url: 'https://speeches.byu.edu/talks/jeffrey-r-holland/remember-lots-wife/'
    quote: 'So a more theological way to talk about Lot’s wife is to say that she did not have faith. She doubted the Lord’s ability to give her something better than she already had.'
  - where: 'note 17:32 “Remember Lot’s wife”'
    claim: 'D&C 133:15: he that goes, let him not look back'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'he that goeth, let him not look back lest sudden destruction shall come upon him.'

  # ---- 17:34
  - where: 'note 17:34 “One taken, the other left”'
    claim: 'JST 17:36 asks where they shall be taken; 17:38 angels gather the saints from bed, mill and field'
    key: jst-luke-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/17?lang=eng'
    quote: 'This he spake, signifying the gathering of his saints; and of angels descending and gathering the remainder unto them; the one from the bed, the other from the grinding, and the other from the field, whithersoever he listeth.'
  - where: 'note 17:34 “One taken, the other left”'
    claim: 'JST 17:36 question'
    key: jst-luke-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/17?lang=eng'
    quote: 'And they answered and said unto him, Where, Lord, shall they be taken?'
  - where: 'note 17:37 “The body and the eagles”'
    claim: 'JST 17:37: wheresoever the saints are gathered'
    key: jst-luke-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/17?lang=eng'
    quote: 'Wheresoever the body is gathered; or, in other words, whithersoever the saints are gathered, thither will the eagles be gathered together; or, thither will the remainder be gathered together.'
  - where: 'note 17:37 “The body and the eagles”'
    claim: 'JST 17:39–40: new heavens and a new earth, cleansed from all sin'
    key: jst-luke-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/17?lang=eng'
    quote: 'For verily there shall be new heavens, and a new earth, wherein dwelleth righteousness.'
  - where: 'note 17:37 “The body and the eagles”'
    claim: 'JST 17:40 the earth waxing old as a garment, the footstool sanctified'
    key: jst-luke-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/17?lang=eng'
    quote: 'the earth becoming old, even as a garment, having waxed in corruption, wherefore it vanisheth away, and the footstool remaineth sanctified, cleansed from all sin.'
  - where: parallels
    claim: 'Luke 17:1–4 compares with Matt. 18:6–7, 15, 21–22'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Offenses (17:1–4) (Compare Matt. 18:6–7, 15, 21–22; Mark 9:42)'
  - where: parallels
    claim: 'Luke 17:20–37 compares with Matt. 24'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Second Coming (17:20–37) (Compare Matt. 24:17–41; Mark 13:14–23)'
  # ---- christ, explore
  - where: christ
    claim: 'Jesus came from where He is master and toils as a servant'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'For he comes from a place where he is master and he now toils as a servant.'
  - where: christ
    claim: 'Wholeness is a quality of Jesus that He imparts to those He heals'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'wholeness is a quality of Jesus that he imparts to the persons whom he heals (see John 5:6). The recipient hangs onto this wholeness by subsequent actions, such as offering thanks, as the leper does'
  - where: christ
    claim: 'D&C 78:19 on thankfulness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/78?lang=eng'
    quote: 'And he who receiveth all things with thankfulness shall be made glorious'
  - where: explore
    claim: 'Elder Holland’s devotional on Lot’s wife: faith points to the future'
    key: holland-remember-lots-wife
    url: 'https://speeches.byu.edu/talks/jeffrey-r-holland/remember-lots-wife/'
    quote: 'we remember that faith is always pointed toward the future.'
  - where: explore
    claim: 'Lund reads “unprofitable servants” with King Benjamin'
    key: lund-divine-indebtedness
    url: 'https://rsc.byu.edu/book-mormon-mosiah-salvation-only-through-christ/divine-indebtedness-atonement'
    quote: 'In some ways, this parable is no less troublesome than king Benjamin’s statement.'
  - where: setting
    claim: 'The JST expands verse 37 into JST Luke 17:36–40'
    key: jst-luke-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/17?lang=eng'
    quote: 'For verily there shall be new heavens, and a new earth, wherein dwelleth righteousness.'
  - where: 'note 17:3 “Rebuke, then forgive”'
    claim: 'D&C 98:41: forgive one who trespasses even when he does not repent the first time'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: 'And if he trespass against thee and repent not the first time, nevertheless thou shalt forgive him.'
  - where: 'note 17:5 “Increase our faith”'
    claim: 'Jesus answers with faith of a higher quality rather than more faith'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-17-104'
    quote: 'Rather than meeting their request for more abundant faith, the Savior leads them to faith of a higher quality.'
  - where: 'note 17:13 “Jesus, Master, have mercy on us”'
    claim: 'epistatēs: overseer; used by the disciples for Jesus for His authority, not as teacher; only in Luke'
    key: thayer
    url: 'https://biblehub.com/greek/1988.htm'
    quote: 'a master, used in this sense for רַבִּי by the disciples (cf. Luke 17:13) when addressing Jesus, who called him thus not from the fact that he was a teacher, but because of his authority (Bretschneider); found only in Luke 5:5; Luke 8:24, 45; Luke 9:33, 49; Luke 17:13.'
