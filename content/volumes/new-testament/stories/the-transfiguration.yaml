story: the-transfiguration
differences:
  - 'Matthew and Mark date it “after six days” ([[Matt. 17:1]]; [[Mark 9:2]]); Luke “about an eight days after these sayings” ([[Luke 9:28]]).'
  - 'Only Luke says Jesus went up “to pray” and was transfigured “as he prayed,” that the three were “heavy with sleep,” and that Moses and Elijah “spake of his decease which he should accomplish at Jerusalem” ([[Luke 9:28–32]]).'
  - 'Only Matthew says “his face did shine as the sun” ([[Matt. 17:2]]); Mark says his raiment was white “as no fuller on earth can white them” ([[Mark 9:3]]).'
  - 'Mark and Luke say Peter did not know what he was saying ([[Mark 9:6]]; [[Luke 9:33]]); Luke places his offer as Moses and Elijah were departing.'
  - 'Only Matthew has the Father add “in whom I am well pleased,” the disciples falling on their faces, and Jesus touching them: “Arise, and be not afraid” ([[Matt. 17:5–7]]).'
  - 'Mark adds that they questioned among themselves “what the rising from the dead should mean” ([[Mark 9:10]]); Luke has no command and no question about Elias, only that they “told no man in those days” ([[Luke 9:36]]).'
  - 'Only Matthew says the disciples understood that Jesus spoke of John the Baptist ([[Matt. 17:13]]); the Joseph Smith Translation of Matthew 17:10–14 distinguishes two Eliases, and JST Mark 9:3 names John the Baptist present on the mount.'
findings:
  - claim: 'The Transfiguration came about a week after the promise of the keys; in about October, six months before the death of Jesus'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'The Transfiguration occurred in about October, some six months before the death of Jesus.'
    by: matthew 17
  - claim: 'The Savior, Moses and Elias gave the promised keys to Peter, James and John; later given to all the Twelve; similar event at Kirtland 1836'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'which enabled these brethren to carry forth the work of the kingdom on the earth after the departure of Jesus. These keys were later given to all of the Twelve.'
    by: matthew 17
  - claim: 'Joseph Smith, 1839: the keys were given on the mount'
    key: jsp-discourse-1839-a-richards-p65
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-4-august-1839-a-as-reported-by-willard-richards/3'
    quote: 'The Priesthood is everlasting. The Savior. Moses. & Elias— gave the Keys to Peter, James & John on the Mount when they were transfigured before him.'
    by: matthew 17
  - claim: 'Transfiguration defined; Joseph Smith taught the three were also transfigured'
    key: gs-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/transfiguration?lang=eng'
    quote: 'Joseph Smith taught that on the Mount of Transfiguration, Peter, James, and John were also transfigured.'
    by: matthew 17
  - claim: 'The apostles had to be transfigured to withstand the glory (Moses 1:11); JST Mark 9:3 has John the Baptist present'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'In fact, Peter, James, and John were also transfigured or else they could not have withstood the glory manifested before them (Moses 1:11).'
    by: matthew 17
  - claim: 'The feast of Tabernacles was approaching; Peter’s three tabernacles suggest they knew it'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'The transfiguration event seems to have occurred as the Feast of Tabernacles approached. The chief apostles wanted to craft three tabernacles for Jesus, Moses, and Elijah as the ancient prophets departed, which suggests they recognized the approach of the feast (Luke 9:33).'
    by: matthew 17
  - claim: 'Booths at the Feast of Tabernacles; Peter perhaps wished to delay the visitants'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'So far as there was a purpose in Peter’s proposition, it seems to have been that of delaying the departure of the visitants.'
    by: matthew 17
  - claim: 'Elias on the mount is Elijah; JST Mark 9:3 means John the Baptist was there besides'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'The curious wording of JST Mark 9:3 does not imply that the Elias at the Transfiguration was John the Baptist, but that in addition to Elijah the prophet, John the Baptist was present'
    by: matthew 17
  - claim: 'Moses was translated so as to have a body to give keys before the Resurrection'
    key: bd-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moses?lang=eng'
    quote: 'It was necessary that he be translated, in order to have a body of flesh and bones at the time of the Transfiguration, since the Resurrection had not yet taken place.'
    by: matthew 17
  - claim: 'Luke’s “decease” connotes exodus or departure'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The Greek word of which “decease” appears as the English equivalent in many of the MSS. of the Gospels is one connoting “exodus” or “departure,”'
    by: matthew 17
  - claim: 'The voice addressed the apostles; “hear ye him” attests that the law and prophets give way to the Messiah'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The fulfillment of the law and the superseding of the prophets by the Messiah was attested in the command—Hear ye Him.'
    by: matthew 17
  - claim: 'Six days and eight days count the interval differently; the mountain is unknown (Tabor tradition, Hermon preferred, nothing decisive)'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'Weight of evidence is in favor of Hermon as the Mount of Transfiguration, though nothing that may be called decisive is known in the matter.'
    by: matthew 17
  - claim: 'Mountain, cloud and shining face at Sinai and on the mount (Matthew’s Jesus as new Moses)'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Divine interactions on mountain tops, under cover of thick clouds, resulted in transfiguration and shining faces for both (Exodus 19:9; 24:16; 34:29; Matthew 17:1–12).'
    by: matthew 17
  - claim: 'D&C 63:21 most likely refers to the Transfiguration; the earth’s future glory'
    key: sc-knowhy-795
    url: 'https://scripturecentral.org/knowhy/why-does-the-lord-compare-the-earth-s-millennial-glory-to-the-mount-of-transfiguration'
    quote: 'In this verse, the Lord is most likely referring to events at the Mount of Transfiguration'
    by: matthew 17
  - claim: 'Two Eliases, a preparer (John) and a restorer (Jesus)'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'These passages are sufficiently clarified to show that anciently two Eliases were spoken of, one as a preparer and the other a restorer.'
    by: matthew 17
  - claim: 'The same three alone at Jairus’s house and in Gethsemane'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'the same three were the sole witnesses of our Lord’s night agony in Gethsemane'
    by: matthew 17
  - claim: 'The Father introduced the Son with few words, to people in fear (mount, Bountiful, grove)'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'On the Mount of Transfiguration to Peter, James, and John, God said, “This is my beloved Son: hear him.”'
    by: matthew 17
  - claim: 'Luke’s eight days: a full week including a Sabbath; perhaps tied to the eighth day of Tabernacles'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'It seems evident that Luke understands a full week to pass, including a Sabbath.'
    by: luke 9
  - claim: 'Exodos: the close of one’s career (Luke 9:31)'
    key: thayer
    url: 'https://biblehub.com/greek/1841.htm'
    quote: 'metaphorically, ἡ ἔξοδος τίνος the close of one''s career, one''s final fate, Luke 9:31'
    by: luke 9
  - claim: 'Only Luke gives the conversation; exodos alludes to the Exodus; JST “his death, and also his resurrection”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The term translated “decease” (Greek exodos) forms an indirect allusion to the Israelite Exodus but, in this context, means departure.'
    by: luke 9
  - claim: 'Heavy with sleep: probably night, as at Gethsemane'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The time must be night, as in the case of events at Gethsemane when the disciples cannot stay awake'
    by: luke 9
