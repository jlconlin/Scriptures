story: the-parable-of-the-sower
differences:
  - 'Matthew ties the day to the controversy of Matthew 12 with “the same day” ([[Matt. 13:1]]); Mark says only “again” ([[Mark 4:1]]); Luke sets it after the women who ministered to Jesus, with people “come to him out of every city” ([[Luke 8:1–4]]).'
  - 'Matthew and Mark have Jesus teach from a ship ([[Matt. 13:2]]; [[Mark 4:1]]); Luke does not mention it ([[Luke 8:4]]).'
  - 'The yields: Matthew descends, “an hundredfold, some sixtyfold, some thirtyfold” ([[Matt. 13:8]]); Mark ascends, “some thirty, and some sixty, and some an hundred,” and says the fruit “sprang up and increased” ([[Mark 4:8]]); Luke gives only “an hundredfold” ([[Luke 8:8]]).'
  - 'Matthew gives the reason for parables as “because they seeing see not” and quotes Isaiah 6:9–10 in full as fulfilled ([[Matt. 13:13–15]]); Mark and Luke give a shorter allusion introduced by “that” ([[Mark 4:12]]; [[Luke 8:10]]).'
  - 'Only Matthew has the blessing on the disciples’ eyes and ears and the prophets who desired to see ([[Matt. 13:16–17]]); Luke has it in another setting ([[Luke 10:23–24]]).'
  - 'Mark has the disciples ask “when he was alone” with “they that were about him with the twelve” ([[Mark 4:10]]) and Jesus’s “Know ye not this parable?” ([[Mark 4:13]]).'
  - 'The seed: “the word of the kingdom” (Matthew, [[Matt. 13:19]]), “the word” (Mark, [[Mark 4:14]]), “the word of God” (Luke, [[Luke 8:11]]). The enemy: “the wicked one” (Matthew), “Satan” (Mark), “the devil” (Luke).'
  - 'Luke alone: the wayside seed is “trodden down” ([[Luke 8:5]]); the devil takes the word “lest they should believe and be saved” ([[Luke 8:12]]); the good ground is “an honest and good heart” that keeps the word and bears fruit “with patience” ([[Luke 8:15]]). Mark adds “the lusts of other things” to the thorns ([[Mark 4:19]]); Luke adds “pleasures of this life” ([[Luke 8:14]]).'
  - 'Mark and Luke follow the explanation with the candle under a bushel and “take heed what (how) ye hear” ([[Mark 4:21–25]]; [[Luke 8:16–18]]); Matthew places “whosoever hath, to him shall be given” before the explanation ([[Matt. 13:12]]).'
findings:
  - claim: 'Parables had not been characteristic of Jesus’s teaching before this occasion'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'On one such occasion He employed a means of instruction, which, prior to that time, had not been characteristic of His teaching; this consisted in the use of parables'
    by: matthew 13
  - claim: 'Parables began when opposition was strong; they were common among Jewish teachers'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'It is noticeable that the introduction of parables occurred when opposition to Jesus was strong, and when scribes, Pharisees, and rabbis were alert in maintaining a close watch upon His movements and His works … The use of parables was common among Jewish teachers'
    by: matthew 13
  - claim: 'Matthew 12’s accusations and the parables came on the same day'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'As Matthew recounted, the accusations of the Pharisees (see Matthew 12:2, 10, 14, 24), the sign seeking of the scribes (see Matthew 12:38–39), and the pronouncement of these parables all occurred on “the same day” (Matthew 13:1).'
    by: matthew 13
  - claim: 'Jesus usually taught by the lake from a boat'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'it was usual with Him to sit in the boat a short distance off shore, and preach to the people'
    by: matthew 13
  - claim: 'parabolē: a comparison; used in the Greek Old Testament for mashal'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'means literally, a comparison. It had been employed by the Greek translators of the Old Testament for the Hebrew word mashed, which we commonly render by “proverb,”'
    by: matthew 13
  - claim: 'mystērion: a hidden thing, not obvious to the understanding'
    key: thayer
    url: 'https://biblehub.com/greek/3466.htm'
    quote: 'plural generally mysteries, religious secrets, confided only to the initiated and not to be communicated by them to ordinary mortals … 1. a hidden or secret thing, not obvious to the understanding'
    by: matthew 13
  - claim: 'Joseph Smith: the multitude received no explanation because of unbelief; the disciples because of faith and confidence'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/2'
    quote: 'the very reason why the multitude, or the world, as they were designated by the Savior, did not receive an explanation upon his parables, was, because of unbelief. … and why? because of the faith and confidence which they had in him.'
    by: matthew 13
  - claim: 'Joseph Smith: the multitude was unwilling, not unable, to see'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/1'
    quote: 'the condemnation which rested upon the multitude, which received not his saying, was because they were not willing to see with their eyes and hear with their ears; not because they could not and were not privileged to see, and hear'
    by: matthew 13
  - claim: 'Joseph Smith on the wayside hearer'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/2'
    quote: 'men who have no principle of righteousness in themselves, and whose hearts are full of iniquity, and who have no desire for the principles of truth, do not understand the word of truth, when they hear it.'
    by: matthew 13
  - claim: 'JST Matt. 13:10–11 (footnote to 13:12): whosoever receiveth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/13?lang=eng'
    quote: 'For whosoever receiveth, to him shall be given, and he shall have more abundance; but whosoever continueth not to receive, from him shall be taken away even that he hath.'
    by: matthew 13
  - claim: 'JST Matt. 13:21 (footnote to 13:23): understandeth and endureth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/13?lang=eng'
    quote: '… understandeth and endureth; which …'
    by: matthew 13
  - claim: 'Mercy in parables'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'There is plainly shown an element of mercy in the parabolic mode of instruction … while had they rejected the truth with full understanding, stern Justice would surely demand their condemnation.'
    by: matthew 13
  - claim: 'The seed is the same; the parable turns on the soil'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Observe that the prominent feature of the story is that of the prepared or unprepared condition of the soil. The seed was the same, whether it fell on good ground or bad'
    by: matthew 13
  - claim: 'Not fatalism: the soils can be changed'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'He neither said nor intimated that the hard-baked soil of the wayside might not be plowed, harrowed, fertilized, and so be rendered productive; nor that the stony impediment to growth might not be broken up and removed'
    by: matthew 13
  - claim: 'The soils are ways mortals receive the word'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'The different soils on which the seeds fell represent different ways in which mortals receive and follow these teachings.'
    by: matthew 13
  - claim: 'The most subtle thorns'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'The most subtle thorns to choke out the effect of the gospel word in our lives are the worldly forces that Jesus called the “cares and riches and pleasures of this life” (Luke 8:14).'
    by: matthew 13
  - claim: 'Lehi’s dream shows the same four kinds of people'
    key: sc-knowhy-663
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-sower-help-us-understand-lehis-vision-of-the-tree-of-life'
    quote: 'Similarly, the Book of Mormon contains a vision relating four distinct groups of people who accept or reject the gospel.'
    by: matthew 13
  - claim: 'Good ground differs from each other soil (Matthew, JST, Luke)'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Unlike the wayside, they “heareth the word, and understandeth it” (Matthew 13:23); unlike the stony ground, they “endureth” (Joseph Smith Translation, Matthew 13:23); and unlike the soil with thorns, they “keep [what they hear], and bring forth fruit” (Luke 8:15).'
    by: matthew 13
  - claim: 'Halverson on Mark’s ascending order (his “perhaps”)'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Thus, when Mark listed the same quantities as Matthew but in ascending order, perhaps he was underscoring an ever-increasing productivity, not merely a differentiation of yields.'
    by: matthew 13
  - claim: 'JST Mark 4:10: explained when alone with the twelve and they that believed'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'According to Joseph Smith’s inspired translation, Christ did not explain the parable until “he was alone with the twelve, and they that believed in him” (Joseph Smith Translation, Mark 4:10; emphasis added).'
    by: matthew 13
  - claim: 'The candle saying was likely spoken after the sower; the disciples’ knowledge was to shine forth to others'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'it is not unlikely that this of the “candle” was actually spoken in the connection in which we find it here. Their knowledge of the meaning of the parable was not given them for themselves alone, but was to shine forth to others.'
    by: mark 4
  - claim: 'Mark’s “That … lest” (4:12): a foreseen result expressed as intention in Hebrew thought'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'This was to be the result of the wilful blindness of those who rejected Him; and the acceptance of a foreseen result was, in Hebrew forms of thought, expressed as the working out of an intention.'
    by: mark 4
  - claim: 'Elder Oaks on “no root in themselves” (Mark 4:17)'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'This is the circumstance of new members who are merely converted to the missionaries or to the many attractive characteristics of the Church or to the many great fruits of Church membership.'
    by: mark 4
  - claim: 'In Mark, “to hear” (4:9, 12, 23) is a metaphor for “to understand”'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'references to “to hear” (Mark 4:9, 12, and 23) would have been understood the way references to “to see” are in a literate, visually focused culture; each phrase is a metaphor for “to understand.”'
    by: mark 4
  - claim: 'Luke 8:18 “Take heed” is blepō, the verb of seeing in 8:10, 16: attention'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The verb (Greek blepō) is the same as that translated “see” in 8:10 and 8:16, and has to do fundamentally with sight, though here it concerns the mental function of paying attention'
    by: luke 8
  - claim: 'JST Luke 8:18 “receiveth”: what one is willing to receive; “seemeth” (dokeō) means “think,” self-deception'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Thus, it is not a matter of what a person possesses after hearing Jesus’ words but what one is willing to receive from them'
    by: luke 8
  - claim: 'Luke’s rocky ground withers for lack of moisture: rain runs off the rock'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'The lack of moisture results when such rain is wasted as runoff, unable to penetrate the rock beneath the scant layer of soil.'
    by: luke 8
  - claim: 'Luke alone names “temptation” as what withers the rocky-ground hearers'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'The reasons that they wither are fourfold: “tribulation” (Matthew 13:21), “affliction” (Mark 4:17), “persecution” (Matthew 13:21; Mark 4:17), and “temptation” (Luke 8:13), each represented by the scorching heat of the sun.'
    by: luke 8
  - claim: 'Luke 8:15 “patience” is hypomonē, steadfast endurance under trial'
    key: thayer
    url: 'https://biblehub.com/greek/5281.htm'
    quote: 'steadfastness, constancy, endurance … in the N. T. the characteristic of a man who is unswerved from his deliberate purpose and his loyalty to faith and piety by even the greatest trials and sufferings: Luke 8:15'
    by: luke 8
  - claim: 'Luke 8:10 echoes Isaiah’s call (Isa. 6:9–10)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Jesus’ words recall directly God’s words to his people through the youthful Isaiah at the time of his call'
    by: luke 8
