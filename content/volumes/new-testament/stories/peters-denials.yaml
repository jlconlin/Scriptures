story: peters-denials
differences:
  - 'Only Matthew adds “with an oath” to the second denial ([[Matt. 26:72]]).'
  - 'In Mark the cock crows twice ([[Mark 14:68]]; [[Mark 14:72]]).'
  - 'Only Luke has the Lord turn and look upon Peter ([[Luke 22:61]]).'
  - 'John has another disciple, known to the high priest, bring Peter in ([[John 18:15–16]]), and a kinsman of Malchus ask the third question ([[John 18:26]]).'
  - 'Matthew gives the reason for the third accusation, “thy speech bewrayeth thee” ([[Matt. 26:73]]); Mark has “thou art a Galilæan” ([[Mark 14:70]]).'
findings:
  - claim: 'Matthew adds “with an oath” to the second denial'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'A more significant Matthean addition, however, is the adding of “with an oath [meta horkou]” to Peter’s second denial (Matthew 26:72).'
    by: matthew 26
  - claim: 'In Matthew the denials grow more public and more serious'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'The effect in Matthew is to highlight that Peter’s denials progressively become both more public and more serious.'
    by: matthew 26
  - claim: 'The cursing and swearing may imply a formal renunciation'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'made with cursing and swearing that might imply a formal renunciation of his association with Jesus'
    by: matthew 26
  - claim: 'His Galilean dialect marked him as a countryman of the Prisoner'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'referred to his Galilean dialect as evidence that he was at least a fellow countryman with the high priest’s Prisoner'
    by: matthew 26
  - claim: 'Peter never denied the divinity of Christ, only his association with Him'
    key: kimball-peter-my-brother
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/appendix-peter-my-brother'
    quote: 'Remember that Peter never denied the divinity of Christ. He only denied his association or acquaintance with the Christ, which is quite a different matter.'
    by: matthew 26
  - claim: 'Denying association is still the serious sense of arneomai, to repudiate or disown'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'his denial of Jesus and his association is consonant with the still serious meaning of arneomai, which is to repudiate or disown.'
    by: matthew 26
  - claim: 'His tears were real contrition, as his later life attests'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'As his later life attests, his tears were those of real contrition and true repentance.'
    by: matthew 26
  - claim: 'President Kimball: give Peter the benefit of the doubt and forgive him as the Savior did'
    key: kimball-peter-my-brother
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/appendix-peter-my-brother'
    quote: 'could we not give him the benefit of the doubt and at least forgive him as his Savior seems to have done so fully?'
    by: matthew 26
  - claim: 'Has any man more completely triumphed over his weaknesses?'
    key: kimball-peter-my-brother
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/appendix-peter-my-brother'
    quote: 'Has anyone repented more sincerely? … Has any man ever more completely triumphed over his weaknesses?'
    by: matthew 26
  - claim: 'Jesus’s triple question let Peter proclaim his love three times'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'provided an opportunity for Peter to proclaim his love three times, compensating for his earlier threefold denial (John 21:15–19).'
    by: matthew 26
  - claim: 'Christ soon raised Peter to the highest position in His church'
    key: kimball-peter-my-brother
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/appendix-peter-my-brother'
    quote: 'Almost immediately Christ elevated him to the highest position in his church and endowed him with the complete keys of that kingdom.'
    by: matthew 26
  - claim: 'Peter never denies his testimony gained by revelation'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'although significantly he never denies his testimony, gained earlier by revelation, that Jesus is the Christ.'
    by: matthew 26
  - claim: 'President Kimball asks whether we are sure of Peter’s motive'
    key: kimball-peter-my-brother
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/appendix-peter-my-brother'
    quote: 'Are we sure of his motive in that recorded denial?'
    by: matthew 26
  - claim: 'The title and first publication of President Kimball’s address'
    key: kimball-peter-my-brother
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/appendix-peter-my-brother'
    quote: 'Appendix: Spencer W. Kimball, “Peter, My Brother,” originally in Speeches of the Year (Provo, UT: Brigham Young University Press, 1971), 1–8.'
    by: matthew 26
  - claim: 'Only Luke has Jesus turn and look at Peter'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the wrenching realization of what Peter has done is made all the more poignant in Luke’s account, where Jesus, who is being led by at that very moment, turns and looks at Peter (Luke 22:61).'
    by: luke 22
  - claim: 'The turning may recall the “turned back” of Luke 22:32'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'his portrayal of Jesus turning and looking may recall Jesus’ prophecy to Peter that when he “had turned back” (epistrepsas; KJV, “art converted”) he was to strengthen his brethren (Luke 22:32).'
    by: luke 22
  - claim: 'The prophecy is fulfilled as He is mocked as a false prophet'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'With Peter’s threefold renunciation, Jesus’ prophecy of his denial is fulfilled at the very moment when he is being accused of being a false prophet by the Sanhedrin in Mark and Matthew and by those who are mocking him in Luke.'
    by: luke 22
open:
  - 'What does the Lord’s look in [[Luke 22:61]] add? Huntsman and Hatch, “Thursday,” para. 343.'
  - 'Who was the “other disciple” known to the high priest ([[John 18:15]])?'
  - 'How do the three questions of [[John 21:15–17]] answer the three denials? Huntsman, “The Accounts of Peter’s Denial”; Kimball, “Peter, My Brother.”'
