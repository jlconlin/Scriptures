story: the-anointing-at-bethany
differences:
  - 'Matthew and Mark: an unnamed woman, in the house of Simon the leper, pours the ointment on His head, after the notice that the Passover is two days away ([[Matt. 26:2–7]]; [[Mark 14:1–3]]). John: Mary of Bethany anoints His feet and wipes them with her hair, six days before the Passover and before the triumphal entry, at a supper where Martha served and Lazarus sat at table ([[John 12:1–3]]).'
  - 'Matthew says “his disciples” were indignant; Mark “some”; John names Judas, “because he was a thief” ([[John 12:4–6]]).'
  - 'Mark and John give the value, three hundred pence ([[Mark 14:5]]; [[John 12:5]]); Matthew says only “much.”'
  - 'Only Matthew and Mark have the promise that her deed will be told for a memorial wherever the gospel is preached ([[Matt. 26:13]]; [[Mark 14:9]]).'
  - 'Luke has a different anointing, by a sinful woman in the house of a Pharisee named Simon ([[Luke 7:36–50]]); it is not this story.'
findings:
  - claim: 'Kings, priests and sometimes prophets were anointed; the act combines a royal anointing and a royal burial'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'In the Hebrew Bible, not only kings but also priests and, on occasion, even prophets were anointed to their position, so the woman’s act can be seen as combining both a royal anointing and a royal burial'
    by: matthew 26
  - claim: 'The woman understood that Jesus had come to die, unlike Peter and the others'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'suggesting that the woman understands that rather than having come to Jerusalem as its earthly king, Jesus has come to die, an understanding that contrasts markedly with that of Peter and the other disciples.'
    by: matthew 26
  - claim: 'John names Mary, has her anoint the feet, and places it before the entry, so there may have been two anointings'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'John’s naming Mary of Bethany, having her anoint Jesus’s feet rather than his head, and placing the story before the triumphal entry makes it possible that there were, in fact, two different anointings.'
    by: matthew 26
  - claim: 'Simon had presumably been cured'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Simon had presumably been cured, perhaps even having been healed previously by Jesus himself.'
    by: matthew 26
  - claim: 'The gift was worth about a year’s wages'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'The woman’s costly gift, the value of which approximately equaled a year’s wages for a laborer'
    by: matthew 26
  - claim: 'Leaving her unnamed lets her stand as a type of the ideal believer'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'by not naming her, the Marcan and Matthean stories more easily allow the woman to serve as a type of the ideal believer.'
    by: matthew 26
  - claim: 'Active leprosy would have made Simon unclean and unable to host the dinner'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Because currently suffering from the disease would have made him ritually unclean and kept him from hosting such a dinner'
    by: matthew 26
open:
  - 'Why does John name Judas as the complainer and call him a thief ([[John 12:6]])?'
  - 'What is “spikenard” ([[Mark 14:3]]; [[John 12:3]])?'
  - 'Why does John tie the anointing to Lazarus and the plot to kill him ([[John 12:9–11]])?'
