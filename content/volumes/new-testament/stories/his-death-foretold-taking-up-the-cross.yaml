story: his-death-foretold-taking-up-the-cross
differences:
  - 'Matthew opens with “From that time forth began Jesus to shew” ([[Matt. 16:21]]); only Mark adds “he spake that saying openly” ([[Mark 8:32]]).'
  - 'Matthew and Luke say “raised again the third day” ([[Matt. 16:21]]; [[Luke 9:22]]); Mark “after three days rise again” ([[Mark 8:31]]).'
  - 'Luke has no rebuke of Peter and no “Get thee behind me, Satan” ([[Luke 9:22–23]]).'
  - 'Only Matthew gives Peter’s words, “Be it far from thee, Lord: this shall not be unto thee,” and Jesus’s “thou art an offence unto me” ([[Matt. 16:22–23]]); Mark says Jesus turned and “looked on his disciples” ([[Mark 8:33]]).'
  - 'Mark has Jesus call “the people” with the disciples before the saying on the cross ([[Mark 8:34]]); Luke says “to them all” and adds “daily” ([[Luke 9:23]]).'
  - 'Mark adds “and the gospel’s” ([[Mark 8:35]]); Luke has “lose himself, or be cast away” ([[Luke 9:25]]).'
  - 'Mark and Luke have the saying on being ashamed of Him ([[Mark 8:38]]; [[Luke 9:26]]); Matthew has “then he shall reward every man according to his works” ([[Matt. 16:27]]).'
  - 'The last promise: “till they see the Son of man coming in his kingdom” ([[Matt. 16:28]]); “the kingdom of God come with power” ([[Mark 9:1]]); “till they see the kingdom of God” ([[Luke 9:27]]).'
findings:
  - claim: 'From the confession on, Jesus taught the Twelve more plainly of His death'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'From the time of Peter’s confession, however, Jesus instructed the Twelve more plainly and with greater intimacy concerning the future developments of His mission, and particularly as touching His appointed death.'
    by: matthew 16
  - claim: '“Satan” a figure of speech meaning adversary; Peter urged what the tempter urged, to evade sacrifice'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'In addressing Peter as “Satan,” Jesus was obviously using a forceful figure of speech, and not a literal designation'
    by: matthew 16
  - claim: 'Peter, “the rock,” became a stone in the path'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The man whom Jesus had addressed as Peter—“the rock,” was now likened to a stone in the path, over which the unwary might stumble.'
    by: matthew 16
  - claim: 'Skandalon: trap-stick; any impediment causing one to stumble (Matt. 16:23 listed)'
    key: thayer
    url: 'https://biblehub.com/greek/4625.htm'
    quote: 'a trap, snare; any impediment placed in the way and causing one to stumble or fall'
    by: matthew 16
  - claim: 'The cross an invitation to discipleship; aparneomai; hearers knew what crucifixion cost; Luke’s “daily”'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'His teachings were more than the abstract metaphor they are to modern readers because crucifixion was a very real part of their lives.'
    by: matthew 16
  - claim: 'JST defines taking up the cross'
    key: jst-matt-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/16?lang=eng'
    quote: 'And now for a man to take up his cross, is to deny himself all ungodliness, and every worldly lust, and keep my commandments.'
    by: matthew 16
  - claim: 'Psychē: earthly life in one half of the saying, eternal life in the other (Matt. 16:25; Mark 8:35–37; Luke 9:24)'
    key: thayer
    url: 'https://biblehub.com/greek/5590.htm'
    quote: 'designate as ψυχή in one of the antithetic members the life which is lived on earth, in the other, the (blessed) life in the eternal kingdom of God: Matthew 10:39; Matthew 16:25'
    by: matthew 16
  - claim: 'JST: in this world / in the world to come'
    key: jst-matt-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/16?lang=eng'
    quote: 'Break not my commandments for to save your lives; for whosoever will save his life in this world, shall lose it in the world to come.'
    by: matthew 16
  - claim: 'Some standing here: the coming is future; partial fulfillment in John (D&C 7; 3 Ne. 28)'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The event referred to, that of the Son of Man coming in the glory of His Father attended by the angels, is yet future. At least a partial fulfillment of the prediction is presented in the prolongation of the life of John the apostle, who was there present'
    by: matthew 16
  - claim: 'Ellicott rejects the Transfiguration as the fulfillment of the promise and points to the fall of Jerusalem (not used in Matthew 16)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'The solution of the problem is to be found in the great prophecy of Matthew 24.'
    by: matthew 16
open:
  - 'Why does Mark say Jesus “spake that saying openly” ([[Mark 8:32]])?'
  - 'Why does Luke leave out Peter’s rebuke and Jesus’s answer?'
  - 'What does Luke’s “daily” ([[Luke 9:23]]) add to taking up the cross?'
  - 'What is being “ashamed of me and of my words” ([[Mark 8:38]]; [[Luke 9:26]]), which Matthew does not have here?'
  - 'Mark’s “the kingdom of God come with power” ([[Mark 9:1]]): how does it read beside the Transfiguration that follows?'
