story: the-demand-for-a-sign-and-the-leaven-of-the-pharisees
differences:
  - 'Matthew has the Pharisees “with the Sadducees” ([[Matt. 16:1]]); Mark has the Pharisees alone ([[Mark 8:11]]).'
  - 'Only Matthew has the saying about the red sky at evening and morning ([[Matt. 16:2–3]]).'
  - 'Matthew gives the exception “but the sign of the prophet Jonas” ([[Matt. 16:4]]); Mark has Jesus sigh deeply and refuse any sign outright ([[Mark 8:12]]).'
  - 'Matthew warns of “the leaven of the Pharisees and of the Sadducees” ([[Matt. 16:6]]); Mark of “the leaven of the Pharisees, and of the leaven of Herod” ([[Mark 8:15]]).'
  - 'Only Mark says they had “one loaf” in the ship ([[Mark 8:14]]) and has the questions about hardened hearts, eyes and ears, with the disciples answering “Twelve” and “Seven” ([[Mark 8:17–20]]).'
  - 'Only Matthew says “O ye of little faith” ([[Matt. 16:8]]) and closes with the disciples understanding that He meant “the doctrine” ([[Matt. 16:12]]); Mark ends on the question “How is it that ye do not understand?” ([[Mark 8:21]]).'
findings:
  - claim: 'Pharisees and Sadducees, usual rivals, combined against Him; the demand for a sign was a snare laid before'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Here the party was met by the ever-vigilant Pharisees, who on this occasion were accompanied by their usually unfriendly rivals, the Sadducees.'
    by: matthew 16
  - claim: 'Sadducees appear nowhere else in the Galilean ministry'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'The presence of members of the latter sect, who do not elsewhere appear in our Lord’s Galilean ministry, is noticeable.'
    by: matthew 16
  - claim: 'They asked a sign like Samuel’s thunder or Elijah’s fire, since earthly works could be explained away'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'What they asked was a sign like Samuel’s thunder from the clear blue sky (1Samuel 12:18), or Elijah’s fire from heaven (1Kings 18:38)'
    by: matthew 16
  - claim: '“Sky” in vv. 2–3 is the word for “heaven” in v. 1'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'the use of “sky,” instead of “heaven,” hides the point of the answer. “You watch the heaven,” He in substance answers'
    by: matthew 16
  - claim: '“Adulterous” figuratively means faithless to God (Matt. 12:39; 16:4; Mark 8:38)'
    key: thayer
    url: 'https://biblehub.com/greek/3428.htm'
    quote: 'hence, μοιχαλίς is figuratively equivalent to faithless to God, unclean, apostate'
    by: matthew 16
  - claim: 'Leaven associated with corruption; in the New Testament usually a symbol of sin'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'It was probably forbidden because there was associated with it the idea of corruption. In the New Testament it was as a rule symbolic of sin (Matt. 16:6; Mark 8:15; Luke 12:1; 1 Cor. 5:7; Gal. 5:9)'
    by: matthew 16
  - claim: 'The Pharisees’ leaven was hypocrisy; the Sadducees’ and Herod’s, probably open worldliness tied to denial of the resurrection'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'That of the Sadducees and of Herod, was, we may believe (it is not specially defined), the more open form of worldliness and self-indulgence which allied themselves with their denial of the resurrection'
    by: matthew 16
  - claim: 'Herod Antipas seems to have held Sadducean beliefs (why Mark’s “Herod” and Matthew’s “Sadducees” correspond)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'The language of the tetrarch, as has been shown (see Note on Matthew 14:2), implies that Sadduceeism had been the prevailing belief of his life'
    by: matthew 16
  - claim: 'Jesus reminded them of the feedings so the lack of bread would not trouble them; the warning was also against the Herodians’ political aims'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Jesus chided them as of little faith for thinking then of material bread, and refreshed their recollection of the miracles by which the multitudes had been fed, so that their lack of loaves would not further trouble them.'
    by: matthew 16
open:
  - 'Why does Mark say Jesus “sighed deeply in his spirit” ([[Mark 8:12]])?'
  - 'What is “the leaven of Herod” ([[Mark 8:15]]) in Mark’s own Gospel, beside the Herodians of [[Mark 3:6]]?'
  - 'Why does Mark end the scene with the unanswered question “How is it that ye do not understand?” ([[Mark 8:21]]), and does it look ahead to the blind man healed in stages ([[Mark 8:22–26]])?'
  - 'What does Luke’s “leaven of the Pharisees, which is hypocrisy” ([[Luke 12:1]]) add, in its own setting?'
