story: the-empty-tomb
differences:
  - 'Matthew names two women, Mary Magdalene and “the other Mary” ([[Matt. 28:1]]); Mark three, adding Salome ([[Mark 16:1]]); Luke names Mary Magdalene, Joanna and Mary the mother of James, “and other women” ([[Luke 24:10]]); John tells of Mary Magdalene alone ([[John 20:1]]).'
  - 'Only Matthew has the earthquake, the angel descending to roll back the stone and sit on it, and the guards becoming “as dead men” ([[Matt. 28:2–4]]); Mark has “a young man” sitting inside ([[Mark 16:5]]); Luke “two men … in shining garments” ([[Luke 24:4]]); John two angels, seen later by Mary ([[John 20:12]]). The Joseph Smith Translation reads “two angels” in Matthew 28:2–5 (footnotes).'
  - 'Mark and Luke say the women brought spices ([[Mark 16:1]]; [[Luke 24:1]]); Matthew says they came “to see the sepulchre” ([[Matt. 28:1]]).'
  - 'Mark’s message names Peter: “tell his disciples and Peter” ([[Mark 16:7]]); Matthew’s does not ([[Matt. 28:7]]). Luke replaces the Galilee message with a reminder of Jesus’s words in Galilee ([[Luke 24:6–7]]).'
  - 'Mark ends with the women saying nothing “for they were afraid” ([[Mark 16:8]]); Matthew has them run “with fear and great joy” to tell the disciples ([[Matt. 28:8]]).'
  - 'Only Matthew tells of the guards’ report and the bribe ([[Matt. 28:11–15]]). Only Luke and John tell of Peter running to the tomb ([[Luke 24:12]]; [[John 20:3–10]]).'
findings:
  - claim: 'Matthew follows Mark but makes the messenger an angel of the Lord whose descent comes with an earthquake'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Matthew, while following Mark’s basic account, changes and expands upon it in important ways. First, rather than being a typological figure, the messenger whom they meet there is specifically “an angel of the Lord” whose descent from heaven is accompanied by an earthquake'
    by: matthew 28
  - claim: 'Matthew’s other Mary is Mary the mother of James and Joses'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'in Matthew’s version there are only the two Marys (Mary of Magdala and Mary the mother of James and Joses; see Matt 27:56, 61; 28:1)'
    by: matthew 28
  - claim: 'The Sabbath ended at sunset Saturday; the Marys had seen the burial and knew the tomb'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'as soon as the Sabbath ended shortly after sunset on Saturday, … Because the two Marys were also specifically mentioned as being present when Joseph of Arimathea laid Jesus in his own tomb, not only were they witnesses of the Lord’s death, but they also knew exactly where he had been buried'
    by: matthew 28
  - claim: '“He is risen” (ēgerthē) is passive, “he has been raised”'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'While we have translated the Greek verb (ēgerthē) with the traditional and more elegant “he is risen,” technically the form is passive, “he has been raised.” This may suggest that in the Synoptics Jesus, who had been crucified by men, has been raised by God'
    by: matthew 28
  - claim: 'Luke’s two angels underscore their role as divine witnesses (Deut 17:6; 19:15)'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'The appearance of two angels, a detail also found in John’s account (see below), underscores their roles as divine witnesses (see Deut 17:6; 19:15)'
    by: matthew 28
  - claim: 'Mark’s singling out of Peter signals the disciples’ rehabilitation in Galilee'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Singling out Peter here is particularly striking given the recent denial, because Peter, along with the others, will soon meet the Risen Lord in Galilee, where they will revive their apostolic ministry in the place where it had begun.'
    by: matthew 28
  - claim: 'The cover-up had a polemical function but makes the guards additional witnesses'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'in the narrative it actually underscores that the guards themselves were additional witnesses of the miracle that morning.'
    by: matthew 28
  - claim: 'No need to doubt the basic historicity of the guard story'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'Although it is sometimes seen in the polemical context of the Matthean community’s struggle with emerging Rabbinic Judaism in the period immediately after the destruction of the temple in AD 70, there is no need to doubt its basic historicity.'
    by: matthew 28
  - claim: 'Matthew’s guard scenes make a five-part pattern with the women at the center'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'the material that is literally (and metaphorically) central to the resurrection story is not the appearance of the resurrected Jesus but rather the experience of the women at the tomb.'
    by: matthew 28
  - claim: 'The earthquake parallels the star of the magi'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'this earthquake parallels the star that the magi followed (2:2). Together these signs signify the cosmological importance of Jesus’s life and death.'
    by: matthew 28
  - claim: 'Women generally not permitted as witnesses under Jewish law (said of Mark’s account)'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Generally, women were not permitted to be witnesses under Jewish law, which means that in order for the disciples, Peter, and Mark’s audience to accept the invitation to follow Jesus, they need to disregard the cultural norm of distrusting women’s words.'
    by: matthew 28
  - claim: 'The stone was rolled back so witnesses could see the tomb empty, not to let Christ out'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'The great stone was rolled back and the inside of the sepulchre exposed to view, so that those who came could see for themselves that the Lord’s body was no longer there; it was not necessary to open the portal in order to afford an exit to the resurrected Christ.'
    by: matthew 28
  - claim: 'The guards were Roman, under the chief priests; sleeping at post meant death'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'If they were found guilty of sleeping at their posts, immediate death would be their doom; … It must be remembered that the soldiers had been put at the disposal of the chief priests'
    by: matthew 28
  - claim: 'Smith: Mark’s audience would have linked the young man at the tomb with the one who fled from Gethsemane (neaniskos only of these two; white clothing only here and at the Transfiguration)'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Mark’s audience would almost certainly have associated this young man at the tomb with the young man who fled arrest in Gethsemane … (these are the only two instances in Mark where clothing is described as being white)'
    by: mark 16
  - claim: 'Joseph Smith’s translation of Mark has two angels sitting on the stone'
    key: jst-mark-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/16?lang=eng'
    quote: 'they saw that the stone was rolled away, (for it was very great,) and two angels sitting thereon, clothed in long white garments; and they were affrighted.'
    by: mark 16
  - claim: 'Only Mark has the women wonder about the stone; a detail suited to oral presentation'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'only in Mark’s Gospel do they wonder about how they will move the stone … This is the sort of detail that would have heightened the drama in an oral presentation of Mark’s Gospel'
    by: mark 16
  - claim: 'Spices: the body had been wrapped in haste before the Sabbath; the women came for a more thorough anointing'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'Some of them had been witnesses of the burial, and were conscious of the necessary haste with which the corpse had been wrapped with spicery and laid away by Joseph and Nicodemus, just before the beginning of the Sabbath'
    by: mark 16
  - claim: 'Mentioning Peter (Mark 16:7) is evidence of mercy and an invitation to full fellowship'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'the implication of the young man’s words is that Peter is invited to return to full fellowship by following Jesus to Galilee. … it is evidence of mercy to specifically mention Peter'
    by: mark 16
  - claim: 'The manuscripts of Mark’s ending, set out (Sinaiticus and Vaticanus end at 16:8; shorter ending; longer ending in the majority, known to Irenaeus); the KJV text “a viable and defensible option”'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'the evidence is hardly definitive on which ending is to be preferred, and Erasmus’s choice, or more accurately the text that he used, is a viable and defensible option.'
    by: mark 16
  - claim: 'Every Gospel affirms that the women’s testimony did not convince the men'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'The writer of each Gospel affirms that the women’s combined testimony did not convince the men.'
    by: mark 16
  - claim: 'JST Luke 24:2 puts two angels standing by the sepulcher; Brown: tombs too small for all to bow inside, so likely outside'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Generally they feature only one area where a person can stand upright. Further, not all the women can bow down inside such a small space (see 24:5). So the men are most likely standing outside the tomb, as JST 24:2 affirms'
    by: luke 24
  - claim: '“The living” (Luke 24:5) as a title, “The Living One”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The term represents a new title, “The Living One,” underlining Jesus’ newly won role as the Living God, the one resurrected from death'
    by: luke 24
  - claim: 'Luke’s “idle tales” is lēros, “nonsense”; Peter’s wondering occasioned his own encounter'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'seeing their reports as “nonsense” (Greek, lēros; KJV, “idle tales”) … Peter’s “wondering to himself about what had happened” as he returned appears to have occasioned his own individual encounter with the Risen Lord'
    by: luke 24
  - claim: 'Imperfect tenses in Luke 24:10–11: the more the women affirm, the more the men dismiss'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The imperfect tense of the verb (Greek apisteō) matches that of the women’s report in 24:10: the more the women affirm the news, the more the men dismiss it.'
    by: luke 24
  - claim: 'Faust: the apostles’ disbelief understandable; resurrection unprecedented'
    key: faust-supernal-gift-atonement
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1988/10/the-supernal-gift-of-the-atonement?lang=eng'
    quote: 'In all human experience, this had never happened before. It was completely unprecedented.'
    by: luke 24
  - claim: 'Luke 24:12 omitted by some manuscripts, kept by most including P75'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Incidentally, this verse is omitted by some ancient manuscripts. But the vast majority preserve it, including the earliest, P75. The reason for the omission seems to be the difficulty of reconciling this verse with John 20:3–7'
    by: luke 24
open:
  - 'Why does Mark’s young man sit “on the right side” ([[Mark 16:5]]), and who is he? Huntsman and Hatch report a reading that links him to the young man of [[Mark 14:51–52]] (“Easter Sunday,” [32]–[34]); not used for Matthew.'
  - 'Does Mark’s Gospel end at 16:8, and where do 16:9–20 come from? (Huntsman and Hatch, “Easter Sunday,” [28]; Smith, “The Resurrection,” [24].)'
  - 'What did Peter and the beloved disciple see in the linen clothes and the napkin ([[John 20:5–8]])?'
