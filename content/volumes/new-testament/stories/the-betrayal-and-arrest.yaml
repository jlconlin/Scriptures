story: the-betrayal-and-arrest
differences:
  - 'Only Matthew has “Friend, wherefore art thou come?”, “all they that take the sword shall perish with the sword,” and the twelve legions ([[Matt. 26:50–53]]).'
  - 'Luke has “Judas, betrayest thou the Son of man with a kiss?” ([[Luke 22:48]]) and alone the healing of the ear ([[Luke 22:51]]).'
  - 'John has no kiss; Jesus says “I am he,” and the band goes backward and falls ([[John 18:4–6]]); John names Peter and Malchus ([[John 18:10]]).'
  - 'Only Mark has the young man who fled naked, leaving the linen cloth ([[Mark 14:51–52]]).'
findings:
  - claim: 'Hetairos is a comrade; in kindly address “my good friend”; used at Matt. 20:13, 22:12, 26:50'
    key: thayer
    url: 'https://biblehub.com/greek/2083.htm'
    quote: 'vocative in kindly address, friend (my good friend): Matthew 20:13; Matthew 22:12; Matthew 26:50.'
    by: matthew 26
  - claim: 'Jesus gave Judas the title with which the other apostles had been honored'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Then, applying the title with which the other apostles had been honored, the Lord said: Friend, do that for which thou art come.'
    by: matthew 26
  - claim: 'The kiss inverted a disciple’s token of respect'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'seemingly supporting the standard view that this sign was the traitorous inversion of what was usually a token of respect and devotion from a disciple to a master.'
    by: matthew 26
  - claim: 'Jesus spoke of the legions to show He submitted voluntarily, as foreseen'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'to emphasize the fact that He was submitting voluntarily and in accordance with foreseen and predicted developments'
    by: matthew 26
  - claim: 'Only Luke records the healing of the ear'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Only Luke, whose portrait of Jesus is always compassionate, notes that Jesus immediately healed the man.'
    by: matthew 26
  - claim: 'Talmage: a reiteration of “That thou doest, do quickly”'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'It was a reiteration of the behest given at the supper table, “That thou doest, do quickly.”'
    by: matthew 26
  - claim: '“Master” in verse 49 is the Greek rhabbi'
    key: strongs-greek
    url: 'https://biblehub.com/greek/4461.htm'
    quote: '• Matthew 23:7, 23:8; 26:25, 26:49'
    by: matthew 26
open:
  - 'Who was the young man in the linen cloth ([[Mark 14:51–52]])? Huntsman and Hatch, “Thursday,” para. 339, read him as a type of the followers who abandon Jesus.'
  - 'What did “I am he” mean, and why did they fall ([[John 18:5–6]])? Huntsman and Hatch, “Thursday,” para. 338.'
  - 'Was the “band” of [[John 18:3]] Roman soldiers? Huntsman and Hatch, “Thursday,” para. 337.'
