story: the-sign-of-jonas
differences:
  - 'Matthew explains the sign as three days and three nights in the heart of the earth ([[Matt. 12:40]]); Luke says only that Jonas was a sign to the Ninevites ([[Luke 11:30]]).'
  - 'Matthew puts the unclean spirit’s return after the sign of Jonas ([[Matt. 12:43–45]]); Luke puts it before, right after the Beelzebub dispute ([[Luke 11:24–26]]).'
  - 'Luke follows with the sayings on the candle and the eye ([[Luke 11:33–36]]); Matthew has them in the Sermon on the Mount ([[Matt. 5:15]]; [[Matt. 6:22–23]]).'
findings:
  - claim: '“Adulterous” after the prophets’ image of Israel as the Lord’s wife; an unfaithful generation demanding a sign'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'The true relation between Israel and Jehovah had been represented by the prophets as that of the wife to her husband (Jeremiah 3; Ezekiel 16, 23; Hosea 1, 2). The adulterous generation was therefore one that was unfaithful to its Lord—demanding a sign'
    by: matthew 12
  - claim: 'The sign is the burial and resurrection; the only sign; Nineveh and Sheba as witnesses'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'The sign of Jonas (or Jonah) was that for three days he had been in the belly of the fish and then had been restored to liberty; so would the Son of Man be immured in the tomb, after which He would rise again.'
    by: matthew 12
  - claim: 'The great fish read as death and hell; Jonah died and was brought back to life'
    key: sc-knowhy-652
    url: 'https://scripturecentral.org/knowhy/what-is-the-sign-of-jonah'
    quote: 'In many ancient Near Eastern worldviews, a sea serpent or leviathan represented death and hell. We may understand that Jonah, by being swallowed by a great fish, died and was then brought back to life.'
    by: matthew 12
  - claim: 'JST Matt. 12:37–38 ties the returning spirit to speaking against the Holy Ghost'
    key: jst-matt-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/12?lang=eng'
    quote: 'but when a man speaketh against the Holy Ghost, then he saith, I will return into my house from whence I came out; and when he is come, he findeth him empty, swept and garnished; for the good spirit leaveth him unto himself.'
    by: matthew 12
  - claim: 'The empty house: those freed by the truth who afterward renounce the good'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'but who afterward renounce the good, open their souls to the demons of falsehood and deceit, and become more corrupt than before.'
    by: matthew 12
open:
  - 'Why does Luke’s sign of Jonas omit the three days, and what is Jonas a sign of in Luke ([[Luke 11:30]])?'
  - 'How do the sayings on the eye and the candle fit after the sign of Jonas in Luke ([[Luke 11:33–36]])?'
