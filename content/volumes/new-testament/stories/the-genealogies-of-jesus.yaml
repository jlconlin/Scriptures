story: the-genealogies-of-jesus
differences:
  - 'Matthew descends from Abraham to Jesus ([[Matt. 1:2–16]]); Luke ascends from Jesus to Adam and to God ([[Luke 3:23–38]]).'
  - 'Matthew names Joseph’s father Jacob ([[Matt. 1:16]]); Luke names him Heli ([[Luke 3:23]]). From David on, Matthew follows Solomon ([[Matt. 1:6]]), Luke follows Nathan ([[Luke 3:31]]); both pass through Salathiel and Zorobabel ([[Matt. 1:12]]; [[Luke 3:27]]).'
  - 'Matthew sets his genealogy before the birth; Luke places his after the baptism, with “being (as was supposed) the son of Joseph” ([[Luke 3:23]]).'
  - 'Only Matthew names women (Tamar, Rahab, Ruth, “the wife of Urias,” Mary) and sums the list in three fourteens ([[Matt. 1:3–6]]; [[Matt. 1:16–17]]).'
  - 'Matthew 1:16 breaks the “begat” pattern: Joseph is “the husband of Mary, of whom was born Jesus.”'
findings:
  - claim: 'Matthew’s descends from Abraham, intended for Jewish readers; Luke’s ascends to Adam and God, for the world in general'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'that in Matt. 1:1–17 descends from Abraham to Jesus, being intended for Jewish readers; while that in Luke 3:23–38 ascends from Jesus to Adam, and to God, this Gospel being written for the world in general.'
    by: matthew 1
  - claim: 'Luke gives more names between David and Zerubbabel and between Zerubbabel and Joseph; the probable explanation is a legal descent in Matthew and a natural one in Luke'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'The probable explanation is that the descent may be traced through two different lines. Matthew gives a legal descent and includes several adopted children, such adoption carrying with it legal rights, while Luke gives a natural descent through actual parentage.'
    by: matthew 1
  - claim: 'A genealogy proved a claim to an office: the Messiah must show descent from David'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'for example, a priest must be able to show his descent from Aaron, the Messiah from David, while every Jew must be able to show his descent from Abraham.'
    by: matthew 1
  - claim: 'Matthew’s opening biblos geneseōs echoes Genesis 2:4, 5:1, 6:9'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew’s work begins with two words, biblos geneseōs, an important phrase that echoes Genesis 2:4 (the generations of the heavens and the earth), 5:1 (the generations of Adam), and 6:9 (the generations of Noah).'
    by: matthew 1
  - claim: 'Unlike Luke, Matthew follows the pattern of fathers begetting sons, and names five women'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Unlike Luke (Luke 3:23–38), Matthew follows the Old Testament pattern of fathers begetting sons. In addition to the men, Matthew included five women in this list'
    by: matthew 1
  - claim: 'Royal succession was patrilineal, so Matthew tells the infancy from Joseph’s side and Luke from Mary’s; Joseph adopts Jesus into David’s line by naming him'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'In order to legally claim Jesus as his own son, thereby making Jesus an heir to the Davidic throne, Joseph accepts Mary’s baby when he is born, giving him a name (1:25) and thereby adopting him into the Davidic line.'
    by: matthew 1
  - claim: 'Gematria: David’s name adds to fourteen; the 14-14-14 pattern may be deliberate (possible, not certain)'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'The numerical values of the Hebrew consonants dalet-vav-dalet add up to fourteen. It is possible that Matthew purposely organized the pedigree in such a way that he could create a 14-14-14 pattern'
    by: matthew 1
  - claim: 'The four women before Mary were Gentiles; Bathsheba identified through Uriah the Hittite'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew includes four Gentile women in Jesus’ genealogy, highlighting the importance of Gentiles in the coming forth of the Messiah. Tamar and Rahab were Canaanites, and Ruth was a Moabite.'
    by: matthew 1
  - claim: 'In Matthew 1:16 “of whom” is a feminine relative pronoun (Mary)'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/1-16.htm'
    quote: 'hēs ἧς whom RelPro-GFS'
    by: matthew 1
open:
  - 'Why does Luke place the genealogy after the baptism, and what does “as was supposed” ([[Luke 3:23]]) mean?'
  - 'Why does Luke run the line to “Adam, which was the son of God” ([[Luke 3:38]]), and why through Nathan rather than Solomon ([[Luke 3:31]])?'
  - 'Who is the Cainan of [[Luke 3:36]], absent from the Hebrew of Genesis 11?'
