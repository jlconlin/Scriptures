story: the-burial
differences:
  - 'Joseph of Arimathaea: “a rich man … who also himself was Jesus’ disciple” in Matthew ([[Matt. 27:57]]); “an honourable counsellor, which also waited for the kingdom of God,” who went in “boldly,” in Mark ([[Mark 15:43]]); “a counsellor … a good man, and a just,” who “had not consented” to the council, in Luke ([[Luke 23:50–51]]); a disciple “secretly for fear of the Jews” in John ([[John 19:38]]).'
  - 'Only Mark has Pilate marvel that Jesus was already dead and ask the centurion ([[Mark 15:44–45]]). Only John has Nicodemus and the hundred pound weight of myrrh and aloes, and the garden ([[John 19:39–41]]).'
  - 'Only Matthew says the tomb was Joseph’s own and that he had hewn it ([[Matt. 27:60]]); Luke and John say no one had yet been laid in it ([[Luke 23:53]]; [[John 19:41]]).'
  - 'The women: Mary Magdalene and “the other Mary” sitting over against the sepulchre (Matthew); Mary Magdalene and Mary the mother of Joses (Mark); the women from Galilee, who then prepared spices and rested on the Sabbath (Luke).'
  - 'Only Matthew has the chief priests and Pharisees asking Pilate for a guard and sealing the stone ([[Matt. 27:62–66]]).'
findings:
  - claim: 'Joseph was a respected, wealthy member of the Sanhedrin'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'a respected, wealthy member of the Sanhedrin named Joseph of Arimathea asked Pilate for permission to bury him.'
    by: matthew 27
  - claim: 'John says his discipleship was secret'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'though John says he kept his discipleship secret because of his fear of his fellow Jewish leaders'
    by: matthew 27
  - claim: 'Nicodemus brought a kingly amount of spices (about seventy-five pounds)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'who brought a kingly amount of spices, about seventy-five pounds in modern measurements, to use in burying Jesus (John 19:39‒40).'
    by: matthew 27
  - claim: 'The guard is unique to Matthew; no need to doubt its basic historicity'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'Although it is sometimes seen in the polemical context of the Matthean community’s struggle with emerging Rabbinic Judaism in the period immediately after the destruction of the temple in AD 70, there is no need to doubt its basic historicity.'
    by: matthew 27
  - claim: 'How the seal worked, and what a broken seal witnessed'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'The breaking of the seal thus became a witness that the tomb had been violated or otherwise opened.'
    by: matthew 27
  - claim: 'The guard was set on Saturday; His enemies remembered His prediction'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'It is evident that the most inveterate of the human enemies of Christ remembered His predictions of an assured resurrection on the third day after His death.'
    by: matthew 27
  - claim: 'The location of the tomb is not given in the Gospels; the traditional site is the Church of the Holy Sepulchre'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'None of the Gospels give any clear idea as to exactly where the tomb was located outside of Jerusalem.'
    by: matthew 27
