story: the-call-of-matthew
differences:
  - 'Matthew calls the tax collector Matthew ([[Matt. 9:9]]); Mark calls him “Levi the son of Alphaeus” ([[Mark 2:14]]), Luke “a publican, named Levi” ([[Luke 5:27]]).'
  - 'Only Luke says he “left all” and made Jesus “a great feast in his own house” ([[Luke 5:28–29]]); Matthew says only “in the house” ([[Matt. 9:10]]).'
  - 'Only Matthew has “go ye and learn what that meaneth, I will have mercy, and not sacrifice” ([[Matt. 9:13]]; [[Hos. 6:6]]).'
  - 'Matthew has “the Pharisees” object; Mark “the scribes and Pharisees” ([[Mark 2:16]]); Luke “their scribes and Pharisees murmured” ([[Luke 5:30]]).'
findings:
  - claim: 'Matthew known before his conversion as Levi; tax gatherer at Capernaum, probably for Herod Antipas; gave a feast to his old associates'
    key: bd-matthew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/matthew?lang=eng'
    quote: 'Known before his conversion as Levi, son of Alphaeus (Mark 2:14). He was a tax gatherer at Capernaum, probably in the service of Herod Antipas, in whose tetrarchy Capernaum was. Soon after his call he gave a feast to his old associates'
    by: matthew 9
  - claim: 'Publicans leased the right to collect customs at borders, kept the excess, were considered corrupt'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'Because publicans’ livelihoods depended on the amount of money they collected from travelers, they were commonly considered corrupt and were notorious for their unethical practices. It was for this reason that Jesus was criticized for eating with “publicans and sinners” (Mark 2:16).'
    by: matthew 9
  - claim: 'A Jew who took the office was held in bitter contempt; “publicans and sinners” a common designation'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'If publicans in general were detested, we can readily understand how bitter would be the contempt in which the Jews would hold one of their own nation who had accepted appointment as such an official.'
    by: matthew 9
  - claim: 'Table fellowship: publicans excluded; Pharisees kept priestly purity at home and ate only with the equally obedient'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'by eating with others that were ritually unclean Jesus would also threaten the purity of His Pharisaic hosts. The tax collectors, or publicans, were specifically excluded from the Pharisees’ table fellowship.'
    by: matthew 9
  - claim: 'Matthew’s added Hosea line challenges the Pharisees’ conception of holiness'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'Jesus is challenging their fundamental conception of holiness and the law by questioning their focus on their own ritual purity while ignoring the spiritually sick among the covenant people.'
    by: matthew 9
  - claim: 'The tax booth (telōnion) at Capernaum: perhaps a small customs post near the harbor; none found; size and nature uncertain'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'The Gospels do record the existence of a “tax booth” (teloniōn) from which Jesus called Matthew/Levi to a life of discipleship (see Matthew 9:9; Mark 2:13–14),[53] but the size and nature of this facility are not certain.'
    by: mark 2
  - claim: 'The Bible Dictionary lists Levi’s father and James’s father as two men named Alphaeus'
    key: bd-alphaeus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/alphaeus?lang=eng'
    quote: '(1) Father of Matthew or Levi (Mark 2:14). … (2) Father of James the Apostle (Matt. 10:3; Mark 3:18; Luke 6:15; Acts 1:13)'
    by: mark 2
  - claim: 'Brown doubts that Levi is the Matthew of the Twelve: two Semitic names rare'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'For a number of reasons, it is difficult to assume that the “Matthew” of the Twelve in Luke 6:15 is the same person, even though we find “Matthew the publican” in Matthew 10:3.'
    by: luke 5
  - claim: 'Brown: customs post east of Capernaum near the Herod–Philip border; Levi a minor official'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'A customs post stands east of the town near the border between the territories of Herod and Philip (see 3:1), on a main east-west road'
    by: luke 5
  - claim: 'Brown: Moroni 8:8 has the physician saying with its halves reversed, a witness to its genuineness'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Although questions have arisen about the authenticity of this saying, its genuineness is assured by its appearance, of all places, in the Book of Mormon. Interestingly, in this source the two parts of the saying are reversed.'
    by: luke 5
  - claim: 'Lane: the Pharisees would agree sinners were sick; the challenge is to see that all sin'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'One of our greatest challenges as righteous, law-abiding people is to recognize that we all sin.'
    by: luke 5
open:
  - 'Why do Mark and Luke call him Levi and Matthew’s Gospel Matthew? The Bible Dictionary says only that Levi was his name before his conversion; Talmage calls Matthew “a name less distinctively Jewish” (chapter 14); no study read explains the change.'
  - 'What does Luke’s “murmured” ([[Luke 5:30]]) recall? Lane (`lane-hostility`) uses the word; not researched further.'
