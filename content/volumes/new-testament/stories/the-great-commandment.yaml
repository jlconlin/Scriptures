story: the-great-commandment
differences:
  - 'Matthew: “one of them, which was a lawyer,” a Pharisee, asks “tempting him” ([[Matt. 22:35]]); Mark: “one of the scribes,” who perceived “that he had answered them well” ([[Mark 12:28]]).'
  - 'Only Mark has Jesus begin with “Hear, O Israel; The Lord our God is one Lord” and add “with all thy strength” ([[Mark 12:29–30]]); Matthew has heart, soul and mind ([[Matt. 22:37]]).'
  - 'Only Matthew has “On these two commandments hang all the law and the prophets” ([[Matt. 22:40]]); Mark has “There is none other commandment greater than these” ([[Mark 12:31]]).'
  - 'Only Mark has the scribe’s reply, “more than all whole burnt offerings and sacrifices,” and “Thou art not far from the kingdom of God” ([[Mark 12:32–34]]).'
  - 'Luke has a lawyer ask about eternal life and give the two commandments himself, followed by the good Samaritan ([[Luke 10:25–37]]); the stories file does not count it as this story.'
findings:
  - claim: 'Scribes were experts in the law; this one seemed sincere'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Generally, at least in Jerusalem, these legal experts are linked with the chief priests and elders as being opposed to Jesus,[14] but this particular scribe seemed sincere'
    by: matthew 22
  - claim: 'Later authorities counted 613 commandments (Simlai in b. Mak. 23b–24a; Maimonides listed them)'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'a question that was understandable, given that legal authorities would later identify 613 different commandments in the Mosaic law.'
    by: matthew 22
  - claim: 'Matthew ends with Jesus’s answer; Mark continues with the scribe’s favorable response'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'While Matthew ends his version of this episode with Jesus’s answer, Mark continues with the expert at the law responding favorably to Jesus'
    by: matthew 22
  - claim: 'In Mark the scribe repeats Jesus’s answer without the possessive, perhaps less personal devotion (Huntsman’s note 16)'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Tellingly, whereas Jesus quotes the law to say that we must love God with all our whole heart, soul, mind, and strength, the expert repeats Jesus’s answer without the possessive, perhaps indicating less personal devotion.'
    by: matthew 22
  - claim: 'A lawyer is a scribe who professes ecclesiastical law'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'One of their number, a lawyer, by which title we may understand one of the scribes who was distinctively also a professor of ecclesiastical law'
    by: matthew 22
  - claim: 'The Shema’s words were on the phylacteries the Pharisees wore'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'the very words of which were written on the phylacteries which the Pharisees wore as frontlets between their eyes'
    by: matthew 22
  - claim: 'To love God is to keep His commandments; the whole is greater than any part'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Therefore the commandment to love God and man is the greatest, on the basis of the simple and mathematical truth that the whole is greater than any part.'
    by: matthew 22
  - claim: 'The reply convinced the scribe who spoke for his Pharisee colleagues (Talmage treats Matthew’s lawyer and Mark’s scribe as one man)'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The Lord’s reply to the question was convincing even to the learned scribe who had acted as spokesman for his Pharisaic colleagues.'
    by: matthew 22
  - claim: 'The commandment was not new; the ranking was; the Shema is recited twice daily'
    key: sc-knowhy-517
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-love-god-with-all-thy-mind'
    quote: 'Christ’s response to the publican was not revelatory in the sense that this commandment was new. What was revelatory was his classification of exactly how important it was'
    by: matthew 22
  - claim: 'Why the first commandment is first'
    key: benson-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1988/04/the-great-commandment-love-the-lord?lang=eng'
    quote: 'Why did God put the first commandment first? Because He knew that if we truly loved Him we would want to keep all of His other commandments.'
    by: matthew 22
  - claim: '“The law and the prophets” is the whole Old Testament revelation; the two commandments are its root'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'to indicate the whole of the revelation of the divine will in the Old Testament. The two great commandments lay at the root of all. The rest did but expand and apply them'
    by: matthew 22
open:
  - 'Why does Mark begin the answer with “Hear, O Israel; The Lord our God is one Lord” ([[Mark 12:29]])? The site’s note at [[Deut. 6:4]] is the place to start.'
  - 'What did Jesus mean by “not far from the kingdom of God” ([[Mark 12:34]])?'
  - 'Why does Mark have four faculties, “heart … soul … mind … strength” ([[Mark 12:30]])? See the site’s note at [[Deut. 6:5]].'
