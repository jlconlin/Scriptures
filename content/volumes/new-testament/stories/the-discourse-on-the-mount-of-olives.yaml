story: the-discourse-on-the-mount-of-olives
differences:
  - 'Mark names the four who asked privately: Peter, James, John and Andrew ([[Mark 13:3]]); Matthew has “the disciples” ([[Matt. 24:3]]); in Luke the sermon begins in the temple as “some spake of the temple” ([[Luke 21:5–7]]).'
  - 'The second question differs: Matthew “the sign of thy coming, and of the end of the world” ([[Matt. 24:3]]); Mark “the sign when all these things shall be fulfilled” ([[Mark 13:4]]); Luke “what sign will there be when these things shall come to pass?” ([[Luke 21:7]]).'
  - 'Where Matthew and Mark have “the abomination of desolation” ([[Matt. 24:15]]; Mark “standing where it ought not,” [[Mark 13:14]]), Luke has “Jerusalem compassed with armies” ([[Luke 21:20]]), and only Luke has “the times of the Gentiles” ([[Luke 21:24]]).'
  - 'Only Matthew has “neither on the sabbath day” ([[Matt. 24:20]]; [[Mark 13:18]] has winter alone).'
  - 'Mark and Luke have the promise of words given in the hour of trial ([[Mark 13:11]], “it is not ye that speak, but the Holy Ghost”; [[Luke 21:14–15]]); Luke adds “there shall not an hair of your head perish” ([[Luke 21:18]]).'
  - 'Only Matthew has the lightning and the carcase and eagles in this sermon ([[Matt. 24:27–28]]); Luke has both in another discourse ([[Luke 17:24]], [[Luke 17:37]]).'
  - 'Mark adds “neither the Son” to the day no one knows ([[Mark 13:32]]); Matthew has “but my Father only” ([[Matt. 24:36]]).'
  - 'The endings differ: Matthew goes on to Noah, the thief and the two servants ([[Matt. 24:37–51]]) and the parables of chapter 25; Mark ends with the porter told to watch ([[Mark 13:34–37]]); Luke with “watch ye therefore, and pray always” ([[Luke 21:34–36]]).'
findings:
  - claim: 'In all three accounts the words can be read as answering both questions at once'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'In all three synoptic accounts, Jesus’s words can be understood as answering both questions simultaneously, treating the two questions almost as one.'
    by: matthew 24
  - claim: 'Mark’s questions are less distinct than Matthew’s'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'In Mark the questions are less distinct: “When shall these things be? and what shall be the sign when all these things shall be fulfilled?”'
    by: matthew 24
  - claim: 'The JST divides the sermon between Matthew 24:22 and 23 (middle of JS—M 1:21)'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'The dividing line between the two sections of the prophecy appears to be between verses 22 and 23 in Matthew and in the middle of verse 21 in Joseph Smith—Matthew, between “concerning the Jews” and “and again.”'
    by: matthew 24
  - claim: 'JST moves wars, famines etc. later; repeats iniquity and gospel preaching'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'Thus “wars and rumors of wars,” kingdoms fighting against kingdoms, famines, pestilences, and earthquakes are moved from early in the chapter to later, giving them a last-days setting.'
    by: matthew 24
  - claim: 'The compound question; the disciples assumed close succession; His return more remote than they realized'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'An assumption that the events would follow in close succession is implied by the form in which the question was put.'
    by: matthew 24
  - claim: 'The temple sanctuary destroyed by fire in AD 70, on the 9th of Av'
    key: ludlow-first-jewish-revolt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/first-jewish-revolt-against-rome'
    quote: 'Fire was finally set to the temple gates, leading to the eventual destruction of the magnificent sanctuary in AD 70.'
    by: matthew 24
  - claim: 'Talmage reads Matthew’s abomination and Luke’s armies as one sign: the encircling of Jerusalem'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'or “when ye shall see Jerusalem compassed with armies” as Luke writes, “then know that the desolation thereof is nigh.” This was a specific sign that none could misunderstand.'
    by: matthew 24
  - claim: 'The abomination fulfilled twice: Titus in AD 70, and Jerusalem again under siege in the last days'
    key: bd-abomination-of-desolation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abomination-of-desolation?lang=eng'
    quote: 'The first was to be when the Roman legions under Titus, in A.D. 70, laid siege to Jerusalem'
    by: matthew 24
  - claim: '“Beginning of sorrows” (Matt. 24:8; Mark 13:8) is birth pangs, used of calamities expected before the Messiah'
    key: thayer
    url: 'https://biblehub.com/greek/5604.htm'
    quote: 'equivalent to intolerable anguish, in reference to the dire calamities which the Jews supposed would precede the advent of the Messiah'
    by: matthew 24
  - claim: 'Matthew alone has the Sabbath, as writing for Jews'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'It is characteristic of St. Matthew, as writing for Jews, that he alone records the words “nor on the Sabbath day.”'
    by: matthew 24
  - claim: 'Matt. 24:42–51 has no counterpart in Mark’s and Luke’s reports of the sermon but is nearly verbatim in Luke 12:42ff.'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'The verses from Matthew 24:42 to Matthew 24:51 have nothing corresponding to them in the reports of the discourse given by St. Mark and St. Luke, but are found almost verbatim in another discourse reported by St. Luke 12:42, et seq.'
    by: matthew 24
  - claim: 'On Mark’s “neither the Son”: in the flesh Jesus claimed no omniscience and did not then know the day'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'While in the flesh He laid no claim to omniscience; though whatever He willed to know He learned through the medium of communication with the Father.'
    by: matthew 24
  - claim: '“This generation”: the generation in which the events are realized'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'This may be understood as applying to the generation in which the portentous happenings before described would be realized.'
    by: matthew 24
  - claim: 'The eagles: aetos better taken of a vulture'
    key: thayer
    url: 'https://biblehub.com/greek/105.htm'
    quote: 'it is better, since eagles are said seldom or never to go in quest of carrion, to understand with many interpreters either thevultur percnopterus, which resembles an eagle'
    by: matthew 24
  - claim: 'D&C 45 draws extensively on the discourse'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'a discourse that the Lord Himself referenced extensively throughout the revelation canonized as Doctrine and Covenants 45.'
    by: matthew 24
open:
  - 'What are “the times of the Gentiles” ([[Luke 21:24]])? D&C 45:25, 28, 30 and the Book of Mormon passages Scripture Helps lists (1 Ne. 15:13; 3 Ne. 16:4) are leads.'
  - 'Why do Mark and Luke place here the promise that the Holy Ghost will give the disciples words before councils ([[Mark 13:11]]; [[Luke 21:14–15]]), which Matthew has in the charge to the Twelve ([[Matt. 10:19–20]])?'
  - 'What does “not an hair of your head perish” mean beside “some of you shall they cause to be put to death” ([[Luke 21:16–18]])?'
  - 'How does Joseph Smith’s translation treat Mark 13 and Luke 21 (the JS—M chapter’s explore says Luke 21 is divided between verses 24 and 25; read the JST pages before using it)?'
  - 'Mark’s porter and the four watches of the night ([[Mark 13:34–35]]).'
