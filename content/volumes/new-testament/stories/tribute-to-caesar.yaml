story: tribute-to-caesar
differences:
  - 'Matthew and Mark name the questioners as Pharisees with Herodians ([[Matt. 22:15–16]]; [[Mark 12:13]]); Luke calls them spies who “should feign themselves just men,” sent to deliver Him to the governor ([[Luke 20:20]]).'
  - 'Only Mark adds “Shall we give, or shall we not give?” ([[Mark 12:15]]).'
  - 'Matthew: Jesus “perceived their wickedness” and calls them “hypocrites” ([[Matt. 22:18]]); Mark: “knowing their hypocrisy” ([[Mark 12:15]]); Luke: “perceived their craftiness” ([[Luke 20:23]]).'
  - 'Luke ends with “they could not take hold of his words before the people … and held their peace” ([[Luke 20:26]]); Matthew with “they marvelled, and left him, and went their way” ([[Matt. 22:22]]).'
findings:
  - claim: 'The Herodians were a political party upholding the Herods and so Roman power; the Pharisees watched for breaches of the law'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'the Herodians, a political faction whose chief characteristic was the purpose of maintaining in power the family of the Herods, which policy of necessity entailed the upholding of the Roman power'
    by: matthew 22
  - claim: 'Herodians obscure, elsewhere only Mark 3:6; usually taken as a political party supporting the Herods for some autonomy under Rome'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'usually they are assumed to have been a largely political party that supported the Herodian family as the means to maintain some degree of Jewish autonomy under Roman authority.'
    by: matthew 22
  - claim: 'The Herodians are known only from Matthew and Mark'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'The party thus described are known to us only through the Gospels of St. Matthew and St. Mark'
    by: matthew 22
  - claim: 'The dilemma: yes, and the Pharisees accuse; no, and the Herodians accuse'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'If he said that it was permissible to pay the tax, the Pharisees in the delegation could claim that he was betraying God or at least was disloyal to the Jewish nation; if he said it was not, the Herodians could claim that he was advocating resistance to Roman demands.'
    by: matthew 22
  - claim: 'Mark’s agreusōsin (“catch”) means to snare or trap'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'was meant “to catch him in what he said” (Mark 12:13, where agreusōsin literally means “to snare” or “trap”).'
    by: matthew 22
  - claim: 'The poll-tax was the most offensive sign of allegiance to Rome'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'for of all acts attesting compulsory allegiance to Rome that of having to pay the poll-tax was most offensive to the Jews.'
    by: matthew 22
  - claim: 'The flattery was true in every word but false in intent'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'This studied tribute to our Lord’s courage and independence of thought and action was truthful in every word; but as uttered by those fulsome dissemblers and in their nefarious intent, it was egregiously false.'
    by: matthew 22
  - claim: 'The denarius bore Tiberius’s image and an inscription claiming divine sonship and high priesthood'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'the denarius, or Roman coin, with which the tax was paid had both the image of the emperor Tiberius and the inscription “Tiberius Caesar Augustus, son of the deified Augustus, high priest,” which both offended Jewish sensibilities about graven images'
    by: matthew 22
  - claim: 'Jewish coins bore plants and fruit, not a head'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Their own coins bore other devices, such as plants, fruit, etc., in place of a human head'
    by: matthew 22
  - claim: 'Using Rome’s coins already acknowledged Rome’s authority'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'they accepted and circulated among themselves the Roman coinage as a common medium of exchange; and it was a criterion of recognition among the Jews that to make current the coins of any sovereign was to acknowledge his royal authority.'
    by: matthew 22
  - claim: '“Render” is apodote, “give back”; Caesar minted and owned the coin, all things belong to God'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Jesus both acknowledged the civic role of the emperor, who minted, and in a sense still owned, the very coin under discussion, and proclaimed the greater obligation we have to God, since, in truth, all created things belong to him.'
    by: matthew 22
  - claim: 'Every soul bears God’s image; give God yourselves'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Every human soul is stamped with the image and superscription of God, however blurred and indistinct the line may have become through the corrosion or attrition of sin'
    by: matthew 22
  - claim: 'Modern revelation requires obedience to governments (D&C 58:21–22; 98:4–6; 134)'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Through the medium of modern revelation, the Lord has required of His people in the present dispensation, obedience to and loyal support of the duly established and existing governments in all lands. See D&C 58:21–22; 98:4–6; and section 134 throughout.'
    by: matthew 22
  - claim: 'He was later falsely accused of forbidding tribute (Luke 23:2)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'could accuse Him, as He was eventually accused, of “perverting the nation, and forbidding to give tribute to Cæsar” (Luke 23:2).'
    by: matthew 22
open:
  - 'Who were the “spies” Luke says were sent, and why does Luke say they meant to deliver Him “unto the power and authority of the governor” ([[Luke 20:20]])?'
  - 'Not researched: Trotter, “Judea as a Roman Province, AD 6–66” (`trotter-judea-province`), which *Scripture Helps* cites on the tax; read it for the census tax of AD 6 before Mark 12.'
