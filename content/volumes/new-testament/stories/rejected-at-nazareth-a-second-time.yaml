story: rejected-at-nazareth-a-second-time
differences:
  - 'Matthew has “the carpenter’s son” ([[Matt. 13:55]]); Mark has “the carpenter, the son of Mary” ([[Mark 6:3]]).'
  - 'Matthew: “he did not many mighty works there because of their unbelief” ([[Matt. 13:58]]); Mark: “he could there do no mighty work, save that he laid his hands upon a few sick folk, and healed them. And he marvelled because of their unbelief” ([[Mark 6:5–6]]).'
  - 'Mark says it was the sabbath and that the disciples followed Him ([[Mark 6:1–2]]); Mark’s proverb adds “among his own kin” ([[Mark 6:4]]).'
  - 'Mark places the visit after the raising of Jairus’s daughter ([[Mark 5:21–43]]); Matthew places it straight after the parables ([[Matt. 13:53]]). Luke tells a rejection at Nazareth at the start of the ministry ([[Luke 4:16–30]]).'
findings:
  - claim: 'Mark’s “the carpenter”; Jesus probably worked in the workshop'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'In St. Mark, the question appears in the form, “Is not this the carpenter?” and it is, of course, in the nature of things probable that He both helped in the workshop during Joseph’s life'
    by: matthew 13
  - claim: 'Joses probably a softened form of Joseph'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'Joses. however, was probably but a softened form of the same name.'
    by: matthew 13
  - claim: 'They could not reconcile His wisdom with His ordinary earlier life'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'They could not reconcile the new wisdom and the claim which the teaching implied with the obscurity and commonness of the earlier life, and so they did not believe.'
    by: matthew 13
  - claim: 'Mark’s language stronger; miracles depended on faith'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'In St. Mark the language is stronger, “He could do no mighty works there.” The wonder-working power was not absolute and unconditioned, but depended on the faith of those who came to Him.'
    by: matthew 13
  - claim: 'Luke’s visit not to be hastily identified with this one'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'In comparing, however, St. Matthew and St. Mark with St. Luke, there seems no sufficient ground for hastily assuming identity. The third Gospel places the visit which it narrates, at the very beginning of our Lord’s work'
    by: matthew 13
  - claim: 'James, brother of the Lord and of Joses, Simon, Jude and sisters; leader in Jerusalem; probably wrote the Epistle'
    key: bd-james
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/james?lang=eng'
    quote: '(3) Brother of the Lord (Gal. 1:19) and of Joses, Simon, Jude, and some sisters (Matt. 13:55; Mark 6:3; Jude 1:1); known as James the Just. He occupied an important position in the Church of Jerusalem'
    by: matthew 13
  - claim: 'Ether 12:12: without faith God can do no miracle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12?lang=eng'
    quote: 'For if there be no faith among the children of men God can do no miracle among them; wherefore, he showed not himself until after their faith.'
    by: matthew 13
open:
  - 'Why does Mark say Jesus “marvelled because of their unbelief” ([[Mark 6:6]])?'
  - 'What did it mean that He “could” do no mighty work, and yet healed a few ([[Mark 6:5]])?'
  - 'Who were the brothers and sisters of Jesus, and what became of them (a Latter-day Saint source beyond the Bible Dictionary’s “James” was not found for Matthew 13)?'
