story: the-storm-stilled
differences:
  - 'Matthew puts the sayings on following just before the crossing and says “his disciples followed him” into the ship ([[Matt. 8:19–23]]); Mark sets the crossing on the evening of the day of parables ([[Mark 4:35]]).'
  - 'Matthew’s disciples cry “Lord, save us: we perish” ([[Matt. 8:25]]); Mark’s “Master, carest thou not that we perish?” ([[Mark 4:38]]); Luke’s “Master, master, we perish” ([[Luke 8:24]]).'
  - 'In Matthew Jesus asks about their faith before He rebukes the sea ([[Matt. 8:26]]); in Mark and Luke afterward ([[Mark 4:39–40]]; [[Luke 8:24–25]]).'
  - 'Only Mark has the other little ships, the pillow in the stern, and “Peace, be still” ([[Mark 4:36–39]]).'
findings:
  - claim: 'Mark and Luke show power over the elements; Matthew uses the story differently, through discipleship'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'By introducing the miracle stories with verses about discipleship, Matthew indicates to his readers that the miracle of the stilling of the storm should be interpreted through the lens of discipleship.'
    by: matthew 8
  - claim: 'Matthew’s seismos vs Mark and Luke’s lailaps; tempest a symbol of disciples’ difficulties in the ship, the Church'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'The tempest in Matthew thus becomes a symbol for the difficulties disciples face as they choose to enter the ship or, in other words, the Church.'
    by: matthew 8
  - claim: '“Master” a human title; Matthew’s “Lord” (kyrios) the Septuagint’s word for the divine name; “save” physical and spiritual'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'Thus, Matthew emphasizes that it is a divine being, not just a great human who is in the ship.'
    by: matthew 8
  - claim: 'Matthew asks about faith first, then rebukes the sea'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'In Matthew, however, Jesus awakes, asks about the disciples’ faith first, and then rebukes the wind and the sea.'
    by: matthew 8
  - claim: 'His sleep shows the reality of His body'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The circumstance is instructive as it evidences at once the reality of the physical attributes of Christ'
    by: matthew 8
  - claim: 'The Lord of earth, air and sea who commanded at the Creation'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The Lord of earth, air, and sea spoke and was obeyed.'
    by: matthew 8
  - claim: 'The cry was not wholly without hope or faith'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Their terrified appeal was not wholly devoid of hope nor barren of faith: “Lord, save us” they cried.'
    by: matthew 8
  - claim: 'Why storms come suddenly on the Sea of Galilee'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'The hills surrounding the water rise up very sharply and to considerable height. The cold air rushing down from the hills meets the warm air rising from the lake in such a way that sudden and temporarily violent storms can occur'
    by: mark 4
  - claim: 'Only Mark has “carest thou not”; a despairing expostulation'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'St. Mark alone gives this touch of despairing expostulation, in which we trace the specific want of faith which was afterwards reproved.'
    by: mark 4
  - claim: '“Peace, be still”: literally be still, be silenced; phimoō also at Mark 1:25'
    key: thayer
    url: 'https://biblehub.com/greek/5392.htm'
    quote: 'passive, to become speechless, hold one''s peace, Matthew 22:12; Mark 1:25; Mark 4:39'
    by: mark 4
  - claim: 'Luke 8:23 “with water” is italic; JST reads “filled with fear”; the verb is imperfect'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'But the Joseph Smith Translation adjusts the whole expression to say, “they were filled with fear,” correcting what is occurring in the historical moment.'
    by: luke 8
  - claim: 'Luke’s “Where is your faith?” asks why faith is not effective; Mark asks whether they have any'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'Jesus’ question asks in essence why the faith of the disciples is not effective, why they fear, as the Joseph Smith Translation verifies, whereas the form of the question in Mark 4:40 challenges whether they possess any faith'
    by: luke 8
  - claim: 'The rebuke (epitimaō) used for spirits and disease now reaches wind and water'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'The power of his rebuke now pushes forward in controlling natural elements such as wind and water.'
    by: luke 8
