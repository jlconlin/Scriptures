story: prayer-in-a-solitary-place
differences:
  - 'Mark says Jesus rose “a great while before day” and prayed in a solitary place ([[Mark 1:35]]); Luke says “when it was day” He went into a desert place, and does not say He prayed there ([[Luke 4:42]]).'
  - 'In Mark, Simon and those with him seek Jesus and tell Him “All men seek for thee” ([[Mark 1:36–37]]); in Luke the people themselves seek Him and try to keep Him from leaving ([[Luke 4:42]]).'
  - 'Mark: “for therefore came I forth” ([[Mark 1:38]]); Luke: “I must preach the kingdom of God to other cities also: for therefore am I sent” ([[Luke 4:43]]).'
  - 'Mark adds that He cast out devils as He preached through Galilee ([[Mark 1:39]]); Luke says only that He preached in the synagogues ([[Luke 4:44]]).'
findings:
  - claim: 'The disciples, impressed with His healing, told Him many were waiting; Jesus indicated healing was not His foremost purpose but proclaiming the kingdom'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Thus Jesus indicated that His healing ministry, with which all were so impressed, was really not His foremost purpose on earth. He had something more important to do, that is, proclaim the nearness of the kingdom of God'
    by: mark 1
  - claim: 'Ellicott: “came I forth” might mean leaving Capernaum, but Luke’s “therefore was I sent” ties it to His mission; the disciples would hear it as from Nazareth, not from the Father'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/1.htm'
    quote: 'In this form the words might refer simply to His leaving Capernaum; but the report in St. Luke, “for therefore was I sent” connects them with His mission as a whole.'
    by: mark 1
  - claim: 'Keller: when the healed ignored His commands, Jesus had to go into the wilderness to escape the crowds (Mark 1:38, 45)'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Yet, when people ignored His admonition, Jesus found Himself having to go into the wilderness to get away from the crowds who wanted Him to heal their sick (see Mark 1:38, 45).'
    by: mark 1
  - claim: 'Brown: “I must” (Luke 4:43) is dei, divine necessity; “sent,” a formal commissioning'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Jesus expresses the divine necessity that lies in the Greek impersonal verb dei. This necessity will characterize his works and Atonement'
    by: luke 4
open:
  - 'Why does Luke, who so often shows Jesus praying, not say here that He prayed ([[Luke 4:42]]), though he does at [[Luke 5:16]]? No source was read on it.'
  - 'What does Mark’s solitary prayer before dawn signify beside His other prayers in Mark ([[Mark 6:46]]; [[Mark 14:32–39]])? No source read for Mark 1 draws the connection.'
