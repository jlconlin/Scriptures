story: before-pilate-and-herod
differences:
  - 'Matthew and Mark give Pilate’s question “Art thou the King of the Jews?” at once, with no accusation stated first ([[Matt. 27:11]]; [[Mark 15:2]]); Luke gives the council’s three charges: perverting the nation, forbidding tribute to Caesar, and saying “that he himself is Christ a King” ([[Luke 23:2]]); John begins with Pilate asking what accusation they bring, and their refusal to enter the judgment hall lest they be defiled ([[John 18:28–30]]).'
  - 'Matthew says “Thou sayest”; Mark and Luke “Thou sayest it”; John has a longer exchange ending “Thou sayest that I am a king. To this end was I born” ([[John 18:37]]). The Joseph Smith Translation of Matthew reads “Thou sayest truly; for thus it is written of me” (JST Matt. 27:12, footnote).'
  - 'Only Luke tells of Pilate declaring “I find no fault in this man” at this stage and of the hearing before Herod Antipas ([[Luke 23:4–12]]). Only John has “It is not lawful for us to put any man to death” ([[John 18:31]]) and “My kingdom is not of this world” ([[John 18:36]]).'
  - 'Matthew inserts the death of Judas (27:3–10) between the handing over to Pilate (27:1–2) and the questioning (27:11–14).'
findings:
  - claim: 'Mark gives the basic order of the Roman trial and Matthew follows it; the other Synoptics add episodes: Matthew Judas, Luke Herod, John a longer Roman trial'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Matthew adds an account of the remorse and suicide of Judas Iscariot. Luke provides the story of Jesus’s examination by Herod Antipas'
    by: matthew 27
  - claim: 'The charge “King of the Jews” focused on Jesus’s identity as the Christ; the trial accounts present Him as falsely judged'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the charge that the Sanhedrin lodged with Pilate against Jesus, that he was the King of the Jews, focused on his identity as the Christ.'
    by: matthew 27
  - claim: 'Pilate’s first question shows a shift from a religious charge to a political one'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'suggesting that the Jewish authorities had shifted their strategy from a religious charge to a political accusation that would more clearly fall within the governor’s competence'
    by: matthew 27
  - claim: '“Thou sayest” rendered “That is what you say”; then dignified silence'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus simply acknowledges, “That is what you say” (Mark 15:2, authors’ translation; parallel Matt 27:11). After Jesus’s opponents accuse him of further, unspecified charges, Jesus responds with dignified silence'
    by: matthew 27
  - claim: 'Older view: Rome reserved the death penalty'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'no Jewish tribunal had authority to inflict the death penalty; imperial Rome had reserved this prerogative as her own'
    by: matthew 27
  - claim: 'Newer view: just as likely the nearness of Passover; Rome’s penalty for rebellion was crucifixion'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'it is just as likely that the Sanhedrin could not execute anyone according to Jewish law because of the nearness of Passover'
    by: matthew 27
  - claim: 'Pilate was prefect of Judea AD 26–36'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Pontius Pilate, the governor before whom Jesus was tried, was prefect of Roman Judea from AD 26–36.'
    by: matthew 27
  - claim: 'Most of the governor’s forces at Caesarea; one cohort in the Antonia'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Most of these forces were permanently stationed at the provincial capital of Caesarea on the coast with only a single cohort of five hundred men posted in Jerusalem in the Antonian fortress next to the temple'
    by: matthew 27
  - claim: 'Pilate came to Jerusalem for the feasts'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'it was his custom to be present in Jerusalem at the times of the great Hebrew feasts'
    by: matthew 27
open:
  - 'Why did Pilate send Jesus to Herod, and why did Herod send Him back in a “gorgeous robe” ([[Luke 23:7–11]])? Huntsman and Hatch, “Good Friday,” para. 49, discuss both.'
  - 'Why would the council not enter the judgment hall ([[John 18:28]])?'
  - 'What did Jesus mean by “My kingdom is not of this world” ([[John 18:36]])?'
