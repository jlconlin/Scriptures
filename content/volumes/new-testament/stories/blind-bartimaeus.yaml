story: blind-bartimaeus
differences:
  - 'Matthew has two blind men ([[Matt. 20:30]]); Mark one, named Bartimaeus the son of Timaeus ([[Mark 10:46]]); Luke one, “a certain blind man” ([[Luke 18:35]]).'
  - 'Matthew and Mark place the healing as Jesus left Jericho ([[Matt. 20:29]]; [[Mark 10:46]]); Luke as He came near it ([[Luke 18:35]]), before Zacchaeus ([[Luke 19:1–10]]).'
  - 'Mark and Luke say the man was begging ([[Mark 10:46]]; [[Luke 18:35]]); Luke adds that he asked what the crowd meant and was told “Jesus of Nazareth passeth by” ([[Luke 18:36–37]]).'
  - 'Only Mark has the bystanders’ “Be of good comfort, rise; he calleth thee” and the man casting away his garment ([[Mark 10:49–50]]).'
  - 'Only Matthew says Jesus “had compassion on them, and touched their eyes” ([[Matt. 20:34]]); Mark and Luke have “thy faith hath made thee whole” / “saved thee” ([[Mark 10:52]]; [[Luke 18:42]]).'
  - 'Mark: he “followed Jesus in the way” ([[Mark 10:52]]); Luke adds “glorifying God,” and the people praising God ([[Luke 18:43]]).'
findings:
  - claim: 'The variations (number, entering or leaving) attest independent authorship and do not touch the main facts'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'These slight variations attest the independent authorship of each of the records, and the apparent discrepancies have no direct bearing upon the main facts'
    by: matthew 20
  - claim: 'Two mentioned, one figuring in the detailed account, as on an earlier occasion'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'As we have found to be the case on an earlier occasion, two men were mentioned though but one figures in the circumstantial account.'
    by: matthew 20
  - claim: 'The crowd largely Passover pilgrims, the feast about a week ahead'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'probably made up largely of travelers on their way to Jerusalem to attend the Passover festival, the time for which was about a week ahead'
    by: matthew 20
  - claim: 'The title Son of David showed faith in Him as promised King'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'his use of the title, Son of David, show that he knew of the great Teacher, had confidence in His power to heal and faith in Him as the promised King and Deliverer of Israel'
    by: matthew 20
  - claim: 'Mark names the better known of the two; Luke perhaps misinformed on the place, or more accurate; a different miracle hardly probable'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'The probable explanation of (1) is, that of the two men, the one whom St. Mark names was the more conspicuous and better known'
    by: matthew 20
  - claim: 'Mark gives the word Rabboni (Mark 10:51)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'St. Mark (Mark 10:51, in the Greek), after his manner, gives the Hebrew word, Rabboni (comp. John 20:16), which Bartimæus actually uttered.'
    by: matthew 20
  - claim: 'Jericho: under fifteen miles northeast of Jerusalem, below sea level; the road up climbed nearly 3,000 feet'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'lying north-easterly from Jerusalem, a little less than fifteen miles in a straight line'
    by: matthew 20
  - claim: 'Bartimaeus: a Greek name with the Aramaic prefix Bar, son'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'It is noticeable that the name was Greek with the Aramaic prefix Bar (= son), a combination not found elsewhere.'
    by: mark 10
  - claim: 'Only Mark names him; perhaps known to Mark’s audience'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'it is possible that in this case, Mark included the name because Bartimaeus was known to his audience, and Matthew and Luke omitted it because he was not known to theirs.'
    by: mark 10
  - claim: 'The cloak probably his means of collecting alms; casting it aside recalls Mark 8:34–35'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Throwing aside his cloak, which was probably the means by which he collected the alms that he begged, the blind man comes to Jesus and pleads for his sight.'
    by: mark 10
  - claim: 'Mark’s inclusio: the Bethsaida blind man and Bartimaeus frame the second act'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'It concludes with the healing of a second blind man, a beggar named Bartimaeus, as Jesus and his disciples leave Jericho on the last stage of their journey up to Jerusalem'
    by: mark 10
open:
  - 'Why does Mark name Bartimaeus and his father, and record the casting away of his garment ([[Mark 10:46–50]])?'
  - 'What does “Rabboni” mean, and why does Mark keep the Aramaic word ([[Mark 10:51]])?'
  - 'What does “thy faith hath made thee whole” (“saved thee”) mean, and why does the same Greek verb mean both healed and saved ([[Mark 10:52]]; [[Luke 18:42]])?'
  - 'How does Luke’s placing of the healing before Zacchaeus fit his account of Jericho ([[Luke 18:35–19:10]])?'
