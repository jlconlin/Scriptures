story: setting-his-face-toward-jerusalem-the-cost-of-following
differences:
  - 'Matthew sets the two would-be followers on the shore before the crossing of the lake ([[Matt. 8:18–22]]); Luke sets them on the road after Jesus “stedfastly set his face to go to Jerusalem” and the Samaritan village refused Him ([[Luke 9:51–57]]).'
  - 'Matthew names the first a scribe ([[Matt. 8:19]]); Luke says “a certain man” ([[Luke 9:57]]).'
  - 'Luke has Jesus call the second man first (“Follow me”) and adds “go thou and preach the kingdom of God” ([[Luke 9:59–60]]); only Luke has a third man and the plough saying ([[Luke 9:61–62]]).'
  - 'Only Luke has James and John wishing to call down fire on the Samaritans ([[Luke 9:54–56]]).'
findings:
  - claim: 'Luke uses the sayings to introduce the calling of the Seventy; Matthew puts them before the storm'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'These verses stand out in a chapter that deals with miracles because they focus on discipleship and the cost of choosing to follow Jesus. In contrast to Matthew, Luke uses them to introduce the calling of the Seventy (see Luke 9:57–10:16).'
    by: matthew 8
  - claim: 'Few of the ruling class had offered to follow; Jesus chose rather than accepted'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Prior to that time, few men belonging to the titled or ruling class had offered to openly ally themselves with Jesus.'
    by: matthew 8
  - claim: '“Let the dead bury their dead” not harsh: ministerial duty first; priests and Nazarites; the spiritually dead'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'one dedicated thereto might well allow those who were negligent of spiritual things, and figuratively speaking, spiritually dead, to bury their dead.'
    by: matthew 8
  - claim: 'Luke places the incidents in a different connection and adds a third'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Luke places the instances in a different connection, and adds to the offers of the scribe and the man who would first bury his father, that of the one who wished to go home and then return to Christ.'
    by: matthew 8
  - claim: 'Son of Man: about 80 times in the Gospels, only on Jesus’s lips; lowliness and dignity'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: 'A title of our Lord, found in the Gospels about 80 times, used by Him in speaking of Himself but never used by anyone else in speaking of Him'
    by: matthew 8
open:
  - 'What does “stedfastly set his face to go to Jerusalem” mean ([[Luke 9:51]])?'
  - 'Why did the Samaritans not receive Him ([[Luke 9:53]]), and what is the rebuke to James and John ([[Luke 9:55–56]])?'
  - 'What does the plough saying mean ([[Luke 9:62]])?'
