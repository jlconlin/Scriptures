story: an-unclean-spirit-cast-out-in-the-synagogue-at-capernaum
differences:
  - 'Matthew does not tell the exorcism in the synagogue. His verses in this story are the move to Capernaum, the first preaching and the summary of teaching, preaching and healing through Galilee ([[Matt. 4:13]]; [[Matt. 4:17]]; [[Matt. 4:23–25]]).'
  - 'Mark and Luke tell the scene: a man with an unclean spirit cries out, “I know thee who thou art, the Holy One of God,” and Jesus silences him and casts the spirit out ([[Mark 1:23–26]]; [[Luke 4:33–35]]).'
  - 'Mark and Luke say the people were astonished because He taught with authority ([[Mark 1:22]]; [[Luke 4:32]]); Matthew gives that astonishment after the Sermon on the Mount ([[Matt. 7:28–29]]).'
  - 'Only Luke says the devil “hurt him not” ([[Luke 4:35]]).'
findings:
  - claim: 'Capernaum was the Lord’s home after the beginning of His ministry; prosperous and crowded'
    key: bd-capernaum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/capernaum?lang=eng'
    quote: 'At the time of our Lord the district was one of the most prosperous and crowded in all Palestine. Here the Lord lived after the beginning of His ministry'
    by: matthew 4
  - claim: '4:23 and 9:35 are bookends of one unit (chapters 5–9), word and deed'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew uses these parallel verses to prompt the reader to recognize that all of the material between them belongs to the same literary unit.'
    by: matthew 4
  - claim: 'Matthew’s “their synagogues”; may follow Mark 1:39; Matthew’s “their scribes” (7:29) against Mark’s “the scribes” (1:22)'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'In Matthew 4:23, Matthew may be using the Markan phrase “their synagogues” (Mark 1:39) but, unlike Mark, Matthew repeats it in 9:35.'
    by: matthew 4
  - claim: 'JST Matt. 4:22: healing among those who believed on his name'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'healing all manner of sickness, and all manner of diseases among the people which believed on his name.'
    by: matthew 4
  - claim: 'selēniazomai (“lunatic,” Matt. 4:24): moon-struck, epileptic'
    key: thayer
    url: 'https://biblehub.com/greek/4583.htm'
    quote: 'to be epileptic (epilepsy being supposed to return and increase with the increase of the moon): Matthew 4:24; Matthew 17:15.'
    by: matthew 4
  - claim: 'Decapolis: ten cities, mixed population, mostly Greek'
    key: bd-decapolis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/decapolis?lang=eng'
    quote: 'Ten cities. The district east and southeast of the Sea of Galilee, containing a mixed population of Greeks, Syrians, Arabs, and Jews, the Greek element being the greatest'
    by: matthew 4
  - claim: 'Bible Dictionary: the scribes taught by memorization and never on their own authority (answers “as one that had authority,” Mark 1:22; Luke 4:32)'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'The scribes never taught on their own authority (contrast with this the Lord’s method, Matt. 7:29).'
    by: mark 1
  - claim: 'Keller: Jesus did not want demonic testimony to His messiahship (Mark 1:25, 34)'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Jesus forbade the demons to proclaim who He was (see Mark 1:25, 34; 3:12), but that is understandable. He did not want demonic testimony to His messiahship.'
    by: mark 1
  - claim: 'Thayer: phimoō (“Hold thy peace,” Mark 1:25; Luke 4:35), to muzzle'
    key: thayer
    url: 'https://biblehub.com/greek/5392.htm'
    quote: 'to close the mouth with a muzzle, to muzzle: properly, βοῦν, the ox'
    by: mark 1
open:
  - 'Why does the unclean spirit name Jesus “the Holy One of God,” and why does Jesus silence him ([[Mark 1:24–25]])?'
  - 'What did it mean to teach “as one that had authority, and not as the scribes” ([[Mark 1:22]])?'
  - 'What was a synagogue in Jesus’s day, and who taught there?'
