story: the-twelve-chosen
differences:
  - 'Matthew gives the names only when the Twelve are sent out ([[Matt. 10:1–4]]); Mark and Luke tell the choosing itself, on a mountain ([[Mark 3:13]]; [[Luke 6:12–13]]).'
  - 'Only Luke says Jesus continued all night in prayer before choosing them, and that He “named apostles” ([[Luke 6:12–13]]).'
  - 'Only Mark gives the purpose, “that they should be with him, and that he might send them forth to preach” ([[Mark 3:14]]), and the surname Boanerges for James and John ([[Mark 3:17]]).'
  - 'Matthew’s list alone calls Matthew “the publican” and says “The first, Simon” ([[Matt. 10:2–3]]); Matthew and Mark name Thaddaeus (Matthew “Lebbæus, whose surname was Thaddæus”), where Luke has “Judas the brother of James” ([[Luke 6:16]]); Matthew and Mark have “Simon the Canaanite,” Luke “Simon called Zelotes” ([[Luke 6:15]]).'
  - 'Only Mark follows the choosing with His friends’ attempt to lay hold on Him, saying “He is beside himself” ([[Mark 3:21]]); Luke follows it with the sermon on the plain ([[Luke 6:17–19]]).'
findings:
  - claim: 'Apostle means “one sent forth”; the title Jesus gave the Twelve (Luke 6:13); special witnesses of His divinity and resurrection'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'The word means “one sent forth.” It was the title Jesus gave (Luke 6:13) to the Twelve … The calling of an Apostle is to be a special witness of the name of Jesus Christ in all the world, particularly of His divinity and of His bodily resurrection from the dead'
    by: matthew 10
  - claim: 'Today twelve men with the same calling form the Quorum of the Twelve'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'Today twelve men with this same divine calling and ordination constitute the Quorum of the Twelve Apostles in The Church of Jesus Christ of Latter-day Saints.'
    by: matthew 10
  - claim: 'The number suggested the twelve tribes; “apostle” in classical Greek meant ambassador or envoy'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'the number at once suggested the thought that they represented the twelve tribes of Israel (Matthew 19:28) … it had acquired in classical Greek a more specific meaning, as the “ambassador,” or “envoy,” of a state.'
    by: matthew 10
  - claim: 'In the four lists Peter is always first and Judas last; Peter’s place shows acknowledged preeminence'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: '(1.) The name of Peter is always first, that of Judas always last. In the former case we recognise acknowledged preeminence.'
    by: matthew 10
  - claim: 'The lists fall into three groups of four with the same persons in each'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'All the lists divide themselves into three groups of four, the persons in each group being always the same'
    by: matthew 10
  - claim: 'Bartholomew is a patronymic; most take him to be Nathanael, whom Philip brought'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'The name, like Barjona and Bartimæus, was obviously a patronymic … has led most modern commentators to the conclusion that they were two names for the same person'
    by: matthew 10
  - claim: 'Bible Dictionary cross-refers Bartholomew to Nathanael'
    key: bd-bartholomew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bartholomew?lang=eng'
    quote: 'One of the Twelve (Matt. 10:2–4; Mark 3:18; Luke 6:14; Acts 1:13). See also Nathanael.'
    by: matthew 10
  - claim: 'Judas “not Iscariot,” son or brother of James, probably the same as Lebbaeus or Thaddaeus'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: '“Not Iscariot,” one of the Twelve, also called Judas (son or brother) of James (Luke 6:16; John 14:22; Acts 1:13); probably the same as Lebbaeus or Thaddaeus (Matt. 10:3; Mark 3:18).'
    by: matthew 10
  - claim: 'Iscariot means “belonging to Kerioth” in Judah; the only non-Galilean of the Twelve'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: 'Iscariot, meaning “belonging to Kerioth” (Josh. 15:25) in the tribe of Judah, one of “the twelve,” and the only one who was not a Galilean.'
    by: matthew 10
  - claim: 'Canaanite should be Cananean; refers to political attachments; Luke’s Zelotes'
    key: bd-canaanite
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/canaanite?lang=eng'
    quote: 'the word should be Cananean rather than Canaanite; it has reference to his political attachments rather than his lineage or geographical point of origin.'
    by: matthew 10
  - claim: 'Cananean is from Aramaic Kanan, Greek Zelotes; the Zealots resisted Roman rule'
    key: bd-zelotes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zelotes?lang=eng'
    quote: 'which is formed from an Aramaic word (Kanan), of which Zelotes is the Greek and Zealot the English equivalent. The Zealots were a party among the Jews (so called from their zeal for the law) who were determined to resist Roman or any foreign authority in Palestine.'
    by: matthew 10
  - claim: 'The purpose of their ordination: to be with Him and to be sent'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The purpose of their ordination was specified—“that they should be with him, and that he might send them forth to preach.”'
    by: matthew 10
open:
  - 'Why did Jesus surname James and John Boanerges, “The sons of thunder” ([[Mark 3:17]])?'
  - 'What did Jesus pray about all night before choosing the Twelve ([[Luke 6:12]]), and what does Luke’s emphasis on prayer show?'
  - 'Who were His “friends” who said “He is beside himself” ([[Mark 3:21]]), and what does the Joseph Smith Translation do with the verse?'
  - 'Was Peter given his surname at this choosing ([[Mark 3:16]]) or earlier ([[John 1:42]])?'
