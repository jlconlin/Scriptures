story: the-woman-of-canaan
differences:
  - 'Matthew calls her “a woman of Canaan” ([[Matt. 15:22]]); Mark “a Greek, a Syrophenician by nation” ([[Mark 7:26]]).'
  - 'Only Mark says Jesus entered a house and “would have no man know it” ([[Mark 7:24]]).'
  - 'Only Matthew has her cry to the “Son of David,” His silence, the disciples’ “Send her away,” and “I am not sent but unto the lost sheep of the house of Israel” ([[Matt. 15:22–24]]).'
  - 'Only Mark has “Let the children first be filled” ([[Mark 7:27]]).'
  - 'Matthew ends with “O woman, great is thy faith” ([[Matt. 15:28]]); Mark with “For this saying go thy way” and her finding the daughter on the bed ([[Mark 7:29–30]]).'
findings:
  - claim: 'Phoenicians were of Canaanite descent, so the two names agree; Canaanites held in disrepute'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Matthew says she was “a woman of Canaan”; these statements are in harmony, since the Phenicians were of Canaanite descent.'
    by: matthew 15
  - claim: 'Calling Him Son of David showed belief that He was Israel’s Messiah'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The fact that she addressed Jesus as Son of David demonstrates her belief that He was the Messiah of Israel.'
    by: matthew 15
  - claim: 'The disciples’ request was probably an intercession for her'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Their intervention was probably an intercession in her behalf; she could be quieted by the granting of her request'
    by: matthew 15
  - claim: '“Dogs” here are little house dogs, not street curs; she took no offense and turned the analogy'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'not the vagrant and despised curs elsewhere spoken of in the Bible as typical of a degraded state, or of positive badness, but literally the “little dogs” or domestic pets, such as were allowed in the house and under the table.'
    by: matthew 15
  - claim: 'The delay showed her faith and taught the disciples; mortal ministry to Israel, the risen Christ to every nation; “Let the children first be filled” prefigured the gospel to all'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The resurrected Christ was to be made known to every nation; but His personal ministry as a mortal, as also that of the apostles while He was with them in the flesh, was directed to the house of Israel.'
    by: matthew 15
  - claim: 'Kunarion is the diminutive, a little dog (Matt. 15:26–27; Mark 7:27–28)'
    key: thayer
    url: 'https://biblehub.com/greek/2952.htm'
    quote: 'κυνάριον, κυναριου, τό (diminutive of κύων, … ),a little dog: Matthew 15:26; Mark 7:27f'
    by: matthew 15
  - claim: 'Only Matthew has the lost sheep saying here, and the charge of 10:5–6'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'unlike Mark, in the story of the healing of the Canaanite woman’s daughter, Matthew includes Jesus’ statement, “I am not sent but unto the lost sheep of the house of Israel” (Matthew 15:24).'
    by: matthew 15
  - claim: 'Only Matthew has “Son of David” and “great is thy faith”; with the centurion, prepares for the Gentile mission'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Yet Matthew has prepared his readers for the shift in missionary emphasis with his accounts of the healings of the centurion’s servant and the Canaanite woman’s children.'
    by: matthew 15
  - claim: 'The lost sheep were of the house of Israel, not Gentiles (link to 3 Ne. 15:21–24)'
    key: sc-knowhy-207
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-there-were-other-sheep-who-would-hear-his-voice'
    quote: 'It indicates that, for Jesus, the “sheep” in need of gathering together were not gentiles, but people from “the house of Israel.”'
    by: matthew 15
  - claim: 'Tyre and Sidon: the one recorded journey outside the land of Israel'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'the one recorded exception to that self-imposed law of His ministry which kept Him within the limits of the land of Israel.'
    by: matthew 15
open:
  - 'Not readable (2026-11-20): Robbie Taggart, “Of Children, Bread, and Dogs,” in the RSC’s *New Testament Insights* (rsc.byu.edu/new-testament-insights/children-bread-dogs), “not been released for online reading.” Try again before Mark 7.'
  - 'Why does Mark call her “a Greek” as well as a Syrophenician ([[Mark 7:26]])?'
  - 'Why did Jesus want no one to know He was in the house ([[Mark 7:24]])?'
  - 'What does “first” in “Let the children first be filled” ([[Mark 7:27]]) imply about the order of the gospel?'
