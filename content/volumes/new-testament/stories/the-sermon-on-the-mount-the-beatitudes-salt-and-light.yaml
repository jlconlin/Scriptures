story: the-sermon-on-the-mount-the-beatitudes-salt-and-light
differences:
  - 'Matthew sets the sermon on a mountain, taught sitting to the disciples who came to Him ([[Matt. 5:1–2]]); Luke has Jesus come down and stand “in the plain” before a great multitude ([[Luke 6:17–20]]).'
  - 'Matthew has nine beatitudes, mostly in the third person (“Blessed are the poor in spirit”); Luke has four in the second person, with “now” (“Blessed be ye poor,” “ye that hunger now,” “ye that weep now”) ([[Luke 6:20–22]]).'
  - 'Luke follows his beatitudes with four woes, on the rich, the full, those who laugh now, and those of whom all men speak well ([[Luke 6:24–26]]); Matthew has no woes here.'
  - 'Matthew: “for my sake” ([[Matt. 5:11]]); Luke: “for the Son of man’s sake” ([[Luke 6:22]]).'
  - 'Salt and light (Matt. 5:13–16) have no place in Luke’s sermon; Luke has the salt saying at [[Luke 14:34–35]] and the lamp at [[Luke 11:33]].'
findings:
  - claim: 'Matthew alone sets the sermon on a mountain, as Moses gave commandments from a mountain'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew, unlike the other Gospel writers, was careful to point out that Jesus delivered his sermon, much like Moses, from a mountain (see Exodus 20; Matthew 5–7).'
    by: matthew 5
  - claim: 'Luke 6 and Matthew 5–7 may be two separate sermons, to different audiences for different purposes'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'While Luke 6 shares many similarities with Matthew 5–7, these parables may well derive from two separate sermons delivered by Jesus on different occasions to varying audiences, in different locations, and for different purposes.'
    by: matthew 5
  - claim: 'The plain audience was mixed, and Jesus offered simpler remarks there'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'To this more diverse and less intimate audience, Jesus offered simpler remarks designed to build a more basic foundation of faith and practical wisdom.'
    by: matthew 5
  - claim: 'Talmage: Jesus spoke on the mountainside to the disciples, then repeated parts to the multitude on the plain'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'Is it not probable that Jesus spoke at length on the mountain-side to the disciples then present, and from whom He had chosen the Twelve, and that after finishing His discourse to them He descended with them to the plain'
    by: matthew 5
  - claim: 'Each beatitude promises reward in conditions opposite to those suffered'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'each of the blessed being assured of recompense and reward in the enjoyment of conditions directly opposite to those under which he had suffered.'
    by: matthew 5
  - claim: '3 Ne. 12:3 “who come unto me” marks a covenant relationship; the Bountiful sermon is for covenant makers'
    key: sc-knowhy-755
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-add-to-the-sermon-on-the-mount'
    quote: 'This added phrase marks the necessity of coming to Jesus in a covenantal relationship in order to receive the promised blessings.'
    by: matthew 5
  - claim: 'The JST adds three beatitudes, making twelve; the third gives the sermon a covenant orientation'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'The sermon begins in KJV Matthew 5 with nine Beatitudes. In the JST, there are three more, making a total of twelve, a significant symbolic number in the New Testament.'
    by: matthew 5
  - claim: '“Poor in spirit” is not in the Hebrew Bible but is in the War Scroll; “poor” had become a synonym for pious'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'The problem is that the exact phrase “poor in Spirit” (Hebrew, aniye ru’ah) does not appear in the Masoretic Text or rabbinic literature. It is found, though, in a psalm from the War Scroll, one of the Dead Sea Scrolls'
    by: matthew 5
  - claim: 'The JST of Luke 14:34–35 explains the salt: good salt is those who believe Jesus’s words and mission'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'the good salt represents those who believe in Jesus’ words and mission. The salt that is “thenceforth good for nothing” (Matthew 5:13) represents those who reject Jesus as the fulfillment of the law and the prophets.'
    by: matthew 5
  - claim: 'Salt does not lose savor with age, only through mixture and contamination'
    key: asay-salt
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/salt-of-the-earth-savor-of-men-and-saviors-of-men?lang=eng'
    quote: 'A world-renowned chemist told me that salt will not lose its savor with age. Savor is lost through mixture and contamination.'
    by: matthew 5
  - claim: 'Luke’s “poor” is broader than “poor in spirit”; the destitute are humbled and receptive (with D&C 56:17–18)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'Matthew preserves the formulation “poor in spirit” (Matt. 5:3), which is not as broad as the saying preserved by Luke.'
    by: luke 6
  - claim: '“Received your consolation” (apechō) is the language of receipts for full payment'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-6-104'
    quote: 'ye have received your consolation: The Greek verb (apechō) appears in receipts for payment made, referring to full payment.'
    by: luke 6
  - claim: 'The woes follow the covenant pattern of blessings and cursings (Deut. 27–28)'
    key: sc-knowhy-35
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-declare-so-many-woes'
    quote: 'The Savior also followed the pattern of declaring both blessings and cursings in his Sermon on the Plain (Luke 6:17-26).'
    by: luke 6
  - claim: 'Brown: the two sermons tie to different places about three miles apart and lack basic links in content'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/the-message-and-context-of-lukes-testimony'
    quote: 'Concerning content, the two sermons lack basic links to each other. The beatitudes, for instance, are completely different and carry dissimilar messages.'
    by: luke 6
open:
  - 'Why does Luke pair each beatitude with a woe, and say “now” (“ye that hunger now,” “ye that weep now,” [[Luke 6:21]], [[Luke 6:25]])?'
  - 'Why does Luke say “Blessed be ye poor” rather than “poor in spirit” ([[Luke 6:20]])? Is a literal poverty meant?'
  - 'What does “leap for joy” ([[Luke 6:23]]) add, and who are the false prophets of [[Luke 6:26]]?'
