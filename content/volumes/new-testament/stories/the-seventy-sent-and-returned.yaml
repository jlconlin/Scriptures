  - 'Why does Jesus tell the Seventy to rejoice not that the spirits are subject to them but that their names are written in heaven ([[Luke 10:20]])?'
  - 'Does the Joseph Smith Translation of Luke 10:22 read like JST Matt. 11:28 (the Son reveals himself, and they see the Father)?'
