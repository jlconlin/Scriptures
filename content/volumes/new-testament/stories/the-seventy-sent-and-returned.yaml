story: the-seventy-sent-and-returned
differences:
  - 'Luke sets the woes on Chorazin, Bethsaida and Capernaum inside Jesus’s charge to the Seventy ([[Luke 10:13–15]]); Matthew sets them after the tribute to John the Baptist, against the towns where most of His mighty works were done ([[Matt. 11:20–24]]).'
  - 'Only Matthew compares Capernaum with Sodom ([[Matt. 11:23–24]]); Luke’s Sodom saying is about any city that rejects the Seventy ([[Luke 10:12]]).'
  - 'Luke: “In that hour Jesus rejoiced in spirit,” after the Seventy return ([[Luke 10:21]]); Matthew: “At that time Jesus answered” ([[Matt. 11:25]]).'
  - 'Luke: “no man knoweth who the Son is, but the Father; and who the Father is, but the Son” ([[Luke 10:22]]); Matthew: “no man knoweth the Son, but the Father” ([[Matt. 11:27]]).'
  - 'Only Matthew follows the thanksgiving with “Come unto me … Take my yoke upon you” ([[Matt. 11:28–30]]); Luke follows it with “Blessed are the eyes which see the things that ye see” ([[Luke 10:23–24]]).'
  - 'Only Luke has the sending of the Seventy, their return, and “I beheld Satan as lightning fall from heaven” ([[Luke 10:1–20]]).'
findings:
  - claim: 'Chorazin: mighty works were done there, of which no record is preserved'
    key: bd-chorazin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chorazin?lang=eng'
    quote: 'A town north of the Sea of Galilee, in which some of our Lord’s mighty works were done (of which no record is preserved)'
    by: matthew 11
  - claim: 'Bethsaida: the town denounced was probably Philip’s pagan capital, not the fishermen’s village'
    key: bd-bethsaida
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethsaida?lang=eng'
    quote: 'When Jesus denounced Bethsaida for its unbelief (Matt. 11:21; Luke 10:13), He probably referred to the pagan city (Philip’s capital), not to the older city, composed largely of fishermen settled on the shore of the lake.'
    by: matthew 11
  - claim: 'Capernaum was “his own city,” where many miracles were done'
    key: bd-capernaum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/capernaum?lang=eng'
    quote: 'Here the Lord lived after the beginning of His ministry, so that Capernaum is called “his own city” (compare Matt. 9:1 with Mark 2:1).'
    by: matthew 11
  - claim: 'Ellicott: Capernaum exalted by the works it saw; “hell” is Hades, not Gehenna'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/11.htm'
    quote: 'In this sense, and not in any outward prosperity, had Capernaum been “exalted unto heaven.” All this, however, had been in vain, and therefore the sentence was passed on it that it should be “brought down to hell,” i.e., to Hades, the grave, not Gehenna.'
    by: matthew 11
  - claim: 'D&C 45:54 uses “tolerable” of those who knew no law (the footnote at Matt. 11:22 points to it)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'they that knew no law shall have part in the first resurrection; and it shall be tolerable for them.'
    by: matthew 11
  - claim: 'Talmage: the prayer of thanksgiving followed the unbelief of the people; gratitude that truth came to the humble'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Seemingly faint at heart over the unbelief of the people, Jesus sought strength in prayer.'
    by: matthew 11
  - claim: 'JST Matt. 11:28 (footnote at Matt. 11:27): those to whom the Son reveals himself shall see the Father also'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'and they to whom the Son will reveal himself; they shall see the Father also.'
    by: matthew 11
  - claim: 'The footnote glosses “babes” as “innocent people” and points to 2 Ne. 9:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'GR innocent people. 2 Ne. 9:42 (42–43)'
    by: matthew 11
  - claim: 'The number: some early manuscripts read seventy-two, the earliest (P75) seventy; the number comes from the table of nations in Genesis 10 (LXX: seventy-two names); seventy is original'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'Some early manuscripts of this verse record the number seventy-two, though the earliest, P75, reads seventy. This number derives from the list of names in the table of gentile nations in Genesis 10.'
    by: luke 10
  - claim: 'The SBL Greek prints seventy-two at Luke 10:1'
    key: greek-nt
    url: 'https://biblehub.com/texts/luke/10-1.htm'
    quote: 'SBL Greek New Testament 2010 Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος καὶ ἑτέρους ἑβδομήκοντα δύο'
    by: luke 10
  - claim: 'D&C 107:25: the latter-day Seventy are especial witnesses to the Gentiles and in all the world (and 107:34, under the direction of the Twelve)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'The Seventy are also called to preach the gospel, and to be especial witnesses unto the Gentiles and in all the world'
    by: luke 10
  - claim: 'Talmage reads “I beheld Satan as lightning fall” of the premortal expulsion after Michael’s victory'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'This was said with reference to the expulsion of the rebellious son of the morning, after his defeat by Michael and the heavenly hosts.'
    by: luke 10
  - claim: 'Brown reads it of the Seventy’s mission toppling Satan, not permanently; Ellicott: primarily his present dethroning, possibly also his fall after creation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-10-104'
    quote: 'The actions of the Seventy during their mission evidently weaken or shake the foundations of Satan’s kingdom, an entity that exists, thus toppling him, though not permanently'
    by: luke 10
  - claim: 'JST Luke 10:23 (footnote at 10:22): “that the Son is the Father, and the Father is the Son”; Brown reads it as divine investiture of authority (cf. the 1916 exposition)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/10?lang=eng'
    quote: 'JST Luke 10:23 … that the Son is the Father, and the Father is the Son, but him to whom the Son will reveal it.'
    by: luke 10
  - claim: 'JST Luke 10:22 (footnote at 10:21): “from them who think they are wise and prudent”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/10?lang=eng'
    quote: 'JST Luke 10:22 … from them who think they are wise and prudent …'
    by: luke 10
  - claim: 'The book of life: a heavenly record of the faithful (with Luke 10:20)'
    key: bd-book-of-life
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/book-of-life?lang=eng'
    quote: 'However, the scriptures indicate that a heavenly record is kept of the faithful, whose names are recorded, as well as an account of their righteous deeds (D&C 88:2; 128:7).'
    by: luke 10
  - claim: 'Ellicott: some important manuscripts read seventy-two, but the evidence favors seventy; seventy stood for all the nations, reckoned roughly from Genesis 10'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/10.htm'
    quote: 'Some MSS. of importance give “seventy-two,” but the evidence preponderates in favour of the reading “seventy.”'
    by: luke 10
  - claim: 'Talmage: the Seventy, unlike the Twelve, were not kept from Samaritan towns or Gentile lands'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'They were not restrained, as the Twelve had been, from entering Samaritan towns or the lands of the Gentiles.'
    by: luke 10
