story: the-death-of-john-the-baptist
differences:
  - 'Matthew says Herod himself wanted John dead and held back for fear of the people ([[Matt. 14:5]]); Mark says it was Herodias who “would have killed him,” while Herod “feared John, knowing that he was a just man and an holy, and observed him” ([[Mark 6:19–20]]).'
  - 'Luke does not tell the beheading here: he gives Herod’s perplexity, his words “John have I beheaded: but who is this?” and his desire to see Jesus ([[Luke 9:7–9]]), and he tells John’s imprisonment earlier ([[Luke 3:19–20]]).'
  - 'Matthew calls him “Herod the tetrarch” ([[Matt. 14:1]]) and then “the king” ([[Matt. 14:9]]); Mark calls him “king Herod” throughout ([[Mark 6:14]]).'
  - 'Mark gives the oath as “unto the half of my kingdom” and has the girl go out to ask her mother ([[Mark 6:23–24]]); Matthew says she was “before instructed of her mother” ([[Matt. 14:8]]).'
  - 'Mark names the guests (lords, high captains, chief estates of Galilee, [[Mark 6:21]]) and the executioner ([[Mark 6:27]]).'
  - 'Only Matthew says John’s disciples “went and told Jesus,” and joins Jesus’s withdrawal straight to the news ([[Matt. 14:12–13]]); Mark follows the burial with the return of the apostles ([[Mark 6:29–31]]).'
findings:
  - claim: 'Antipas, “Herod the tetrarch,” received Galilee and Perea; built Tiberias as his capital'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'Antipas (called in the New Testament “Herod the tetrarch”) built as his capital Tiberias on the Sea of Galilee; he is frequently mentioned in the Gospels (Matt. 14:1; Mark 6:14; Luke 9:7; 13:31; 23:7–15).'
    by: matthew 14
  - claim: 'Tetrarch: ruler of a fourth part, or another fraction'
    key: bd-tetrarch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tetrarch?lang=eng'
    quote: 'The word originally meant the ruler of the fourth part of a country but was also used when the part governed was some other fraction of the whole.'
    by: matthew 14
  - claim: 'Herodias left Herod Philip, by whom she had Salome, for Antipas; John was killed for rebuking it'
    key: bd-herodias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herodias?lang=eng'
    quote: 'married to her uncle, Herod Philip, by whom she had a daughter Salome (Matt. 14:6). She eloped in order to live as the wife of her step-uncle, Herod Antipas. It was for his rebuke of this crime that John the Baptist was put to death'
    by: matthew 14
  - claim: 'JST Mark 6:21 (footnote): Herod knew John was a holy man who feared God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/6?lang=eng'
    quote: 'a holy man, and one who feared God and observed to worship him'
    by: matthew 14
  - claim: 'Greek of Matt. 14:5: although he desired to kill him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/14?lang=eng'
    quote: 'GR although he desired to kill him.'
    by: matthew 14
  - claim: 'Josephus: Herod feared John’s influence might bring rebellion; John was killed at Macherus'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-18.html'
    quote: 'Herod, who feared lest the great influence John had over the people might put it into his power and inclination to raise rebellion … Accordingly he was sent a prisoner, out of Herod’s suspicious temper, to Macherus'
    by: matthew 14
  - claim: 'Herod’s guilty fear that Jesus was John returned; the courtiers suggested Elijah'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'He heard, with fear due to inward conviction of guilt, of the marvelous work wrought by Jesus, and in terror averred that Christ could be none other than John Baptist returned from the tomb.'
    by: matthew 14
  - claim: 'This Philip was not the tetrarch; Herodias niece to both husbands; Antipas divorced Aretas’s daughter; the marriage adulterous and incestuous by the law'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: '(not the Tetrarch of Trachonitis, Luke 3:1, but son of Herod the Great by Mariamne … holding no official position as a ruler) … was therefore niece to both her husbands. … The marriage, at once adulterous and by the Mosaic law doubly incestuous'
    by: matthew 14
  - claim: 'Herod kept the oath for fear of the guests’ contempt more than the oath itself'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'It was not so much his regard for the oath which he had taken … but his shrinking from the taunt, or whispered jest, or contemptuous gesture of the assembled guests … an incentive to guilt instead of a restraint.'
    by: matthew 14
  - claim: 'Herodias, not her daughter, bears the culpability for the request (a Latter-day Saint study of the daughter of Jared beside Salome)'
    key: frederick-daughter-of-jared
    url: 'https://rsc.byu.edu/illuminating-jaredite-records/whence-daughter-jared'
    quote: 'Either way, it is Herodias, not Salome, who bears the culpability for procuring the head of John the Baptist.'
    by: matthew 14
  - claim: 'Mark 6:20: the older manuscripts read that Herod “was much perplexed” (ēporei) where the Textus Receptus has “did many things” (epoiei); compare Luke’s “perplexed” (Luke 9:7)'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/6-20.htm'
    quote: 'καὶ ἀκούσας αὐτοῦ πολλὰ ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.'
    by: mark 6
  - claim: 'Mark calls Antipas “king” in the ancient wide sense; only Mark ties Herod’s notice to the apostles’ mission'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/6.htm'
    quote: 'He is here called “king,” or “prince,” in the ancient and wide sense of the word.'
    by: mark 6
open:
  - 'Why does Luke leave out the beheading and keep only Herod’s perplexity and wish to see Jesus ([[Luke 9:7–9]]; compare [[Luke 23:8]])?'
  - 'What did it mean that Herod “heard him gladly” and “did many things” ([[Mark 6:20]]; the Joseph Smith Translation reads “did many things for him”)?'
  - 'Why does Mark call Antipas “king” when his title was tetrarch ([[Mark 6:14]])?'
  - 'Is the daughter of Jared’s dance in [[Ether 8:10]] connected to this story? Frederick’s RSC study (key above, not yet in sources.yaml) argues the two are too quickly equated.'
