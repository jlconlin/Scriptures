story: the-man-with-the-palsy-forgiven-and-healed
differences:
  - 'Only Mark and Luke tell that the bearers (four, in Mark) could not get through the crowd and let the man down through the roof ([[Mark 2:3–4]]; [[Luke 5:18–19]]); Matthew says only that they brought him lying on a bed ([[Matt. 9:2]]).'
  - 'Only Matthew has “Son, be of good cheer” before the forgiveness ([[Matt. 9:2]]); Luke has “Man, thy sins are forgiven thee” ([[Luke 5:20]]).'
  - 'Mark and Luke give the scribes’ reasoning, “who can forgive sins but God only?” ([[Mark 2:7]]; [[Luke 5:21]]); Matthew has only “This man blasphemeth” ([[Matt. 9:3]]).'
  - 'Luke sets the scene with Pharisees and doctors of the law from every town of Galilee, Judaea and Jerusalem, and “the power of the Lord was present to heal them” ([[Luke 5:17]]).'
  - 'Matthew alone says the multitudes glorified God “which had given such power unto men” ([[Matt. 9:8]]); Mark has “We never saw it on this fashion” ([[Mark 2:12]]), Luke “We have seen strange things to day” ([[Luke 5:26]]).'
  - 'Matthew places it in “his own city” after crossing the lake ([[Matt. 9:1]]); Mark names Capernaum ([[Mark 2:1]]).'
findings:
  - claim: 'Palsy: a paralysis that left the man helpless; the scene in Capernaum, where His abode was known'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'a man afflicted with palsy, a species of paralysis which deprived the subject of the power of voluntary motion and usually of speech; the man was helpless.'
    by: matthew 9
  - claim: 'Jesus impressed by the faith and works of the bearers, and knew the sufferer’s own faith'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Jesus was deeply impressed by the faith and works of those who had thus labored to place a helpless paralytic before Him; doubtless, too, He knew of the trusting faith in the heart of the sufferer'
    by: matthew 9
  - claim: 'In this case sin and affliction were connected, but not all illness comes from sin (John 9)'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'In this man’s condition there was plainly a close connection between his past sins and his present affliction … We are not warranted, however, in assuming that all bodily ills are the result of culpable sin'
    by: matthew 9
  - claim: 'The two sayings of allied meaning; Jesus openly asserted His divinity'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Is it not a rational explanation that, when spoken authoritatively by Him, the two expressions were of allied meaning? … In the presence of people of all classes Jesus thus openly asserted His divinity'
    by: matthew 9
  - claim: 'Which is easier: forgiving words cannot be tested outwardly; the command to walk could be'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'It was easier to say, “Thy sins are forgiven thee,” for those words could not be put to any outward test, and only the consciousness of the sinner could attest their power.'
    by: matthew 9
  - claim: 'Matthew’s “power unto men”: the crowd saw delegated authority, not the union of manhood with God'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'They rested in the thought of a delegated authority, a “power given to men,” as such, without passing on to the deeper truth of the union of the manhood with God.'
    by: matthew 9
  - claim: 'JST Matt. 9:5 makes the question a statement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'JST Matt. 9:5 For is it not easier to say, Thy sins be forgiven thee, than to say, Arise and walk?'
    by: matthew 9
  - claim: 'Son of Man: used only by Jesus of Himself; Mark 2:10 listed under the sense of dignity as head of the kingdom; Moses 6:57'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: '(2) honor and dignity, as head and founder of the kingdom of God, and judge of all men (Matt. 13:41; 16:28; 19:28; 24:30–31; 25:31; 26:64; Mark 2:10, 28)'
    by: matthew 9
  - claim: 'Capernaum houses had roofs of beams, reeds and mud mortar; Mark’s “having dug through” fits; no roof tiles found in first-century Capernaum houses, so Luke’s “tiling” assumes an urban house'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'At Capernaum, no roof tiles were discovered in any first-century domestic context.[85] Therefore, it appears that Luke’s account assumed the Roman-style villas familiar to his urban Gentile audience rather than accurately describing a home in a Galilean village.'
    by: mark 2
  - claim: 'Blasphemy: Jesus charged with it for claiming to forgive sins; the charge true only if He were not what He claimed'
    key: bd-blasphemy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blasphemy?lang=eng'
    quote: 'Our Lord was on several different occasions charged by the Jews with speaking blasphemy, because He claimed the right to forgive sins … These charges would have been true if He had not actually been all that He said He was.'
    by: mark 2
  - claim: 'Mark sandwiches the dispute (2:6–10) inside the healing (2:1–5, 11–12)'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'A discussion of Jesus’ authority to forgive sins (Mark 2:6–10) is surrounded by the story of a lame man whose sins he forgives (Mark 2:1–5, 11–12).'
    by: mark 2
  - claim: 'Brown disagrees with the tiling argument: tiling attested in Palestinian homes in the first century BC'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'But studies have shown that tiling is a feature of Palestinian homes in the first century BC.'
    by: luke 5
  - claim: 'Brown: Luke names no place for this miracle, unlike Mark’s Capernaum'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Moreover, Luke disconnects the following miracle from Capernaum, which Mark mentions (see Mark 2:1), making no assignment of place'
    by: luke 5
  - claim: 'Brown: Luke links the prayer of 5:16 to “the power of the Lord … to heal”; manuscripts read “them” or “him”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Luke draws a firm link between the Savior’s praying in the previous verse and his notice that Jesus carries “the power [of Jehovah] . . . to heal”'
    by: luke 5
  - claim: 'Brown: the Pharisees and doctors of the law are the first named opponents in Luke; the doctors are the scribes of 5:21'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'This notice of identifiable opponents is the first in this Gospel. Later, in 5:21, it appears that the doctors (nomodidaskalos, properly “law teachers”) are termed “scribes.”'
    by: luke 5
  - claim: 'JST Luke 5:23 makes the question one of power'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/5?lang=eng'
    quote: 'JST Luke 5:23 Does it require more power to forgive sins than to make the sick rise up and walk?'
    by: luke 5
  - claim: 'Thayer: paradoxos (Luke 5:26), contrary to opinion, unexpected, incredible'
    key: thayer
    url: 'https://biblehub.com/greek/3861.htm'
    quote: 'unexpected, uncommon, incredible, wonderful: neuter plural Luke 5:26 (A. V. strange things'
    by: luke 5
