story: the-sermon-on-the-mount-the-law-fulfilled
differences:
  - 'Only Matthew has the saying on fulfilling the law and the six contrasts “Ye have heard … But I say unto you” ([[Matt. 5:17–44]]); Luke’s sermon quotes no law and begins this teaching with “Love your enemies” ([[Luke 6:27]]).'
  - 'Matthew: the one who sues for the coat is given the cloak also ([[Matt. 5:40]]); Luke reverses the garments, the one who takes the cloak is not forbidden the coat ([[Luke 6:29]]), and adds “of him that taketh away thy goods ask them not again” ([[Luke 6:30]]).'
  - 'Matthew names “the publicans” ([[Matt. 5:46–47]]); Luke says “sinners” and adds lending without hope of return ([[Luke 6:32–35]]).'
  - 'Matthew ends “Be ye therefore perfect, even as your Father which is in heaven is perfect” ([[Matt. 5:48]]); Luke ends “Be ye therefore merciful, as your Father also is merciful” ([[Luke 6:36]]).'
findings:
  - claim: 'Plērōsai means to fill; katalysai means annul; fulfil = bring to full expression'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'the use of the Greek term plērōsai, the primary meaning of which means “to fill or make full.” As such, it is in direct contrast with the idea of “destroy,” the Greek for which, katalysai, means something like “annul” in a legal context.'
    by: matthew 5
  - claim: 'Ceremonial aspects ended with Christ’s death; the ethical precepts were reaffirmed and strengthened'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Whereas the symbolic and ceremonial aspects of the law were brought to an end by his sacrificial death, the ethical precepts of that same law—which principles existed before the law and would continue even after it—were reaffirmed, and even strengthened'
    by: matthew 5
  - claim: 'Lex talionis limited retribution but could be taken as retaliation'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Nevertheless, such retribution could easily be seen not as legal compensation but as retaliation, satisfying one’s anger at being hurt or offended.'
    by: matthew 5
  - claim: 'Coat is the tunic; the cloak the more expensive outer garment'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'one’s tunic (an inner garment but translated by the KJV as “coat”), should be met with a willingness to give up even more, in this case the more expensive cloak.'
    by: matthew 5
  - claim: 'A blow on the right cheek with the right hand is a backhanded slap, an insult'
    key: judd-resist-not-evil
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/resist-not-evil'
    quote: 'To strike someone on the right cheek with your right hand would require a backhanded slap; in New Testament culture, this would be more consistent with an insult rather than a fistfight.'
    by: matthew 5
  - claim: 'Not abject subservience nor abrogation of self-protection; directed primarily to the apostles'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'are not to be construed as commanding abject subservience to unjust demands, nor as an abrogation of the principle of self-protection. These instructions were directed primarily to the apostles'
    by: matthew 5
  - claim: '“Hate thine enemy” is not in the Old Testament; an interpretive tradition of the day'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'But the second half, “hate thine enemy,” is not found in the Old Testament. Scholars believe this is an interpretive tradition current in Jesus’ day.'
    by: matthew 5
  - claim: 'God’s care for all, sun and rain, is the key to loving enemies'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Jesus’ explanation that God cares for all his children, causing the sun and rain to benefit the good and bad alike, provides the key.'
    by: matthew 5
  - claim: 'Matthew, a former publican, names publicans; Luke writes “sinners”'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'Observe that Matthew, who had been a publican, frankly records this reference (5:46, 47) to his despised class. Luke writes “sinners,” instead of “publicans” (6:32–34).'
    by: matthew 5
  - claim: '“Without a cause” (Matt. 5:22) arose later; the oldest witnesses, the JST and 3 Ne. 12:22 omit it'
    key: wayment-variants-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/how-new-testament-variants-contribute-meaning-sermon-mount'
    quote: 'In Sinaiticus, the phrase “without a cause” was added above the line of the text for Matthew 5:22 by a later scribe.'
    by: matthew 5
  - claim: 'At Bountiful the Lord named Himself with the Father as perfect'
    key: nelson-perfection-pending
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/perfection-pending?lang=eng'
    quote: 'This time He listed Himself along with His Father as a perfected personage. Previously He had not.'
    by: matthew 5
  - claim: 'Divorce: Jesus sides with the school of Shammai and goes beyond it'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Here Jesus sides with the school of Shammai in resisting “easy” divorce (and even moves beyond it in that he does not allow for remarriage).'
    by: matthew 5
open:
  - 'Why does Luke end with “Be ye therefore merciful” where Matthew has “perfect” ([[Luke 6:36]])? No source was read on it for Matthew 5.'
  - 'What does “hoping for nothing again” mean for lending ([[Luke 6:34–35]]), and why does Luke call the children of God “children of the Highest”?'
  - 'Why does Luke reverse the order of cloak and coat ([[Luke 6:29]])?'
