story: the-centurions-servant
differences:
  - 'In Matthew the centurion comes himself ([[Matt. 8:5]]); in Luke he sends the elders of the Jews and then friends ([[Luke 7:3]], [[Luke 7:6]]).'
  - 'Only Luke has the elders’ praise, “he loveth our nation, and he hath built us a synagogue” ([[Luke 7:5]]), and calls the servant “dear unto him” and “ready to die” ([[Luke 7:2]]).'
  - 'Only Matthew has the saying about many coming from east and west to sit with Abraham, Isaac and Jacob ([[Matt. 8:11–12]]); Luke has it elsewhere ([[Luke 13:28–29]]).'
  - 'Only Matthew ends with “as thou hast believed, so be it done unto thee” ([[Matt. 8:13]]).'
  - 'The Joseph Smith Translation of Matthew 8:9 (footnote 10a) has those who followed marvel before Jesus speaks.'
findings:
  - claim: 'A Roman garrison at Capernaum; a centurion was captain of a hundred men'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'There was at that time a Roman garrison in the city. A military officer, a centurion or captain of a hundred men, was stationed there.'
    by: matthew 8
  - claim: 'Matthew and Luke on who came are not in real discrepancy'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'There is here no real discrepancy. It was then allowable, as in our time it is, to speak of one who causes something to be done as doing that thing himself.'
    by: matthew 8
  - claim: 'The centurion reasoned from his own authority'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'He himself was a man of authority, though under the direction of superior officers. To his subordinates he gave orders which were obeyed.'
    by: matthew 8
  - claim: 'How Jesus could marvel'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'He pondered over it, and contemplated it, probably as a refreshing contrast to the absence of faith He so generally encountered.'
    by: matthew 8
  - claim: 'No archaeological trace of Gentiles at Capernaum; Matthew implies tension, Luke affection; Matthew may reflect the village better'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Matthew implies a high degree of tension between the “centurion” and his Jewish neighbors (see Matthew 8:5–13), whereas Luke claims that there was a mutual affection between him and the local elders (see Luke 7:1–5).'
    by: matthew 8
  - claim: 'The “synagogue of the centurion”: whether a first-century basalt synagogue lay under the later limestone one is doubted'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'there is no positive evidence for this usage or for the building having been built by a Gentile benefactor such as the “centurion.”'
    by: matthew 8
  - claim: 'Matthew omits Luke’s praise and uses the story to prepare for the Gentile mission; Gentiles at the end-time feast'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Thus, Matthew emphasizes that at times Gentiles have more faith than the covenant people and will participate in the eschatological feast when many of the house of Israel will miss out.'
    by: matthew 8
  - claim: 'Jesus was willing to go despite the stigma of helping the Romans'
    key: sc-knowhy-508
    url: 'https://scripturecentral.org/knowhy/why-did-christ-perform-miracles'
    quote: 'Jesus had compassion on him and was willing to go to the man’s house despite the stigma associated with helping the Romans (Matthew 8:7).'
    by: matthew 8
  - claim: 'Roman units had no permanent presence in Galilee until after the revolts; the centurion was a Herodian officer with a Roman title'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Therefore, the “centurion” of the synoptic Gospels must have been a Herodian military officer who was given a title adopted from the Roman army.'
    by: luke 7
  - claim: 'Brown: the centurion sent Jewish elders because he judged Jesus would respond more readily to fellow Jews'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'It appears the centurion judges Jesus will respond more sympathetically to the plea of his fellow Jews than to an appeal from a Gentile.'
    by: luke 7
  - claim: 'Brown: the friends of Luke 7:6 are probably Gentiles, distinct from the elders'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'One suspects that these friends are Gentiles who enjoy fellowship with the centurion and spend time in his company.'
    by: luke 7
  - claim: 'Brown: entering a Gentile home would bring ritual uncleanness, and the centurion knew it (why “not worthy”)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The centurion is plainly aware of the difficulty that Jesus, a Jew, faces when coming to his home. Here he shows his sensitivity about the dilemma and urges Jesus not to come inside.'
    by: luke 7
  - claim: 'Brown: “marvelled” is better “admired him”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'Does Jesus marvel within himself? Probably not. Instead, “he admired him.”'
    by: luke 7
