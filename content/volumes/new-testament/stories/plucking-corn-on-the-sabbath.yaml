story: plucking-corn-on-the-sabbath
differences:
  - 'Only Matthew says the disciples were hungry ([[Matt. 12:1]]); Luke says they rubbed the ears in their hands ([[Luke 6:1]]); Mark mentions no eating at the start ([[Mark 2:23]]).'
  - 'In Matthew and Mark the Pharisees fault the disciples to Jesus ([[Matt. 12:2]]; [[Mark 2:24]]); in Luke they ask “Why do ye …” ([[Luke 6:2]]).'
  - 'Only Mark names Abiathar the high priest ([[Mark 2:26]]) and has “The sabbath was made for man, and not man for the sabbath” ([[Mark 2:27]]).'
  - 'Only Matthew has the priests who profane the Sabbath and are blameless, “one greater than the temple,” and Hosea 6:6 ([[Matt. 12:5–7]]).'
  - 'All three end with the Son of man as Lord of the Sabbath ([[Matt. 12:8]]; [[Mark 2:28]]; [[Luke 6:5]]).'
findings:
  - claim: 'Plucking grain on the Sabbath would have been widely held unlawful, not a distinctively Pharisaic rule'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'The sense that reaping or plucking grain on the Sabbath would be a violation of Sabbath law “would not, in any way, be a distinctively Pharisaic rule,”[11] but rather would be a generally accepted sense of what was inappropriate on the Sabbath.'
    by: matthew 12
  - claim: 'Deut. 23:25 permits plucking by hand, but not on the Sabbath'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'There is a provision in the law that “if you enter your neighbor’s grainfield, you may pick kernels with your hands, but you must not put a sickle to their standing grain” (Deuteronomy 23:25 … This would not, however, have been seen as a permissible Sabbath activity.'
    by: matthew 12
  - claim: 'The David precedent is about Jesus’s kingly authority, not the Sabbath directly'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This response, found in all the Synoptic Gospels, does not speak to the Sabbath directly … David had the authority to partake of food that normally would have been off-limits, and that same kingly authority is being invoked by Jesus for the disciples'
    by: matthew 12
  - claim: 'Shewbread changed and eaten by priests on the Sabbath (Lev. 24:8–9); David did what priests did that day'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'the Sabbath was the day upon which the bread in the Holy Place was changed and eaten by priests … This verse might further explain the reference to David: he was doing what the priests did on the Sabbath.'
    by: matthew 12
  - claim: 'Temple service overrides the Sabbath (Num. 28:9–10; Shabbat 132b)'
    key: mcclellan-go-ye-learn
    url: 'https://rsc.byu.edu/covenant-compassion/go-ye-learn-what-meaneth'
    quote: 'Rabbinic commentary, such as the Talmudic tractate Shabbat 132b, states that temple service “overrides” (dôḥâ) the requirements of the Sabbath.'
    by: matthew 12
  - claim: 'Matthew 12:7 quotes Hosea 6:6 in its Septuagint form'
    key: mcclellan-go-ye-learn
    url: 'https://rsc.byu.edu/covenant-compassion/go-ye-learn-what-meaneth'
    quote: 'The quotation of Hosea 6:6 comes from the ancient Greek translation of the Bible (Septuagint), which renders the Hebrew ḥesed ḥāpaṣtî (“I delight in mercy”) with the Greek éleos thélō (“I want mercy”).'
    by: matthew 12
  - claim: '“Guiltless” (v. 7) and “blameless” (v. 5) are the same Greek word'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'they would not have pronounced judgment upon the innocent (τοὺς ἀναιτίους) (12:7)”—the disciples who were as blameless (ἀναίτιοί) as the priests laboring on the Sabbath (v. 5).'
    by: matthew 12
  - claim: 'Matthew and Luke omit Mark 2:27, putting the focus on Jesus as the Son of Man'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'It has been suggested that the removal of the phrase “The sabbath was made for man, and not man for the sabbath” in Matthew and Luke also removes ambiguity … instead putting the focus more directly on Jesus (the Son of Man).'
    by: matthew 12
  - claim: 'Mark’s “make a way” may allude to Mark 1:3'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'By not mentioning eating, the text in Mark might be intended to put the emphasis on the disciples “making a way” for Jesus—a clear allusion to the beginning of Mark'
    by: matthew 12
