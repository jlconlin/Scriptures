story: a-leper-cleansed
differences:
  - 'Matthew sets the cleansing straight after the Sermon on the Mount, “when he was come down from the mountain” ([[Matt. 8:1]]); Luke has it “in a certain city” ([[Luke 5:12]]).'
  - 'Only Mark says Jesus was “moved with compassion” and that He “straitly charged him, and forthwith sent him away” ([[Mark 1:41]], [[Mark 1:43]]).'
  - 'Luke calls him “a man full of leprosy” ([[Luke 5:12]]).'
  - 'Mark and Luke tell what followed: the man spread the news, and Jesus could no more openly enter the city (Mark), or withdrew into the wilderness to pray (Luke) ([[Mark 1:45]]; [[Luke 5:15–16]]). Matthew ends with the command.'
findings:
  - claim: 'The leper’s question was not whether Jesus could heal but whether He would; Jesus touched him though he was unclean ceremonially and physically'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The question in his mind was not—Can Jesus heal me? but—Will he heal me? In compassionate mercy Jesus laid His hand upon the sufferer, unclean though he was, both ceremonially and physically'
    by: matthew 8
  - claim: 'Sending him to the priest: Christ came to fulfil the law; ignoring it would have increased priestly opposition'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'In this instruction we see that Christ had not come to destroy the law, but, as He affirmed at another time, to fulfil it; and at this stage of His work the fulfillment was incomplete.'
    by: matthew 8
  - claim: 'The silence may have kept the priests from obstructing his recognition as clean'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'had word of the miracle preceded the man’s appearing before the priest, obstacles might have been thrown in the way of his Levitical recognition as one who was clean.'
    by: matthew 8
  - claim: 'The leper as a type of the sinner cut off from fellowship; the priest who restored him a type of Christ'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'leprosy was also an appropriate type or symbol of what happens to a man spiritually when he sins.'
    by: matthew 8
  - claim: 'EGT on “for a testimony unto them” (Mark 1:44): a testimony from priest to people, without which the leper would not be received as clean'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/1.htm'
    quote: 'for a testimony from priest to people, without which the leper would not be received as clean.'
    by: mark 1
  - claim: 'Thayer: embrimaomai at Mark 1:43, to charge sternly; ekballō at 1:43, to cause to depart in haste'
    key: thayer
    url: 'https://biblehub.com/greek/1690.htm'
    quote: 'In a sense unknown to secular authors, to charge with earnest admonition, sternly to charge, threateningly to enjoin: Matthew 9:30; Mark 1:43.'
    by: mark 1
  - claim: 'Smith: the irony of Mark 1:44–45, the leper disobeys and Jesus must live like a leper in the wilderness'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'In the next layer, Jesus himself has to act like a leper and live in the wilderness in order to escape the crowds.'
    by: mark 1
  - claim: 'Brown: probably not Hansen’s disease, extremely rare then; a long-term serious skin disease'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The man’s skin condition is perhaps a serious fungal infection because Hansen’s disease, or what is currently known as leprosy, is only introduced into the Mediterranean region'
    by: luke 5
  - claim: 'Brown on Luke 5:16: the wilderness as God’s ground, a place of spiritual renewal (Mark stresses the crowds)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'But Luke captures the more important sense of the wilderness as God’s ground, a place where Jesus can immerse himself in the heat-tested environment of spiritual renewal'
    by: luke 5
  - claim: 'Brown: Jesus, by touching, is not made unclean as others are'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'According to the Mosaic law, Jesus becomes unclean by touching the man (see Lev. 13:46; Num. 5:2–4). But the point is that Jesus, who controls disease and gives the law, is not crippled in a ritual way as others are.'
    by: luke 5
