story: a-leper-cleansed
differences:
  - 'Matthew sets the cleansing straight after the Sermon on the Mount, “when he was come down from the mountain” ([[Matt. 8:1]]); Luke has it “in a certain city” ([[Luke 5:12]]).'
  - 'Only Mark says Jesus was “moved with compassion” and that He “straitly charged him, and forthwith sent him away” ([[Mark 1:41]], [[Mark 1:43]]).'
  - 'Luke calls him “a man full of leprosy” ([[Luke 5:12]]).'
  - 'Mark and Luke tell what followed: the man spread the news, and Jesus could no more openly enter the city (Mark), or withdrew into the wilderness to pray (Luke) ([[Mark 1:45]]; [[Luke 5:15–16]]). Matthew ends with the command.'
findings:
  - claim: 'The leper’s question was not whether Jesus could heal but whether He would; Jesus touched him though he was unclean ceremonially and physically'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The question in his mind was not—Can Jesus heal me? but—Will he heal me? In compassionate mercy Jesus laid His hand upon the sufferer, unclean though he was, both ceremonially and physically'
    by: matthew 8
  - claim: 'Sending him to the priest: Christ came to fulfil the law; ignoring it would have increased priestly opposition'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'In this instruction we see that Christ had not come to destroy the law, but, as He affirmed at another time, to fulfil it; and at this stage of His work the fulfillment was incomplete.'
    by: matthew 8
  - claim: 'The silence may have kept the priests from obstructing his recognition as clean'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'had word of the miracle preceded the man’s appearing before the priest, obstacles might have been thrown in the way of his Levitical recognition as one who was clean.'
    by: matthew 8
  - claim: 'The leper as a type of the sinner cut off from fellowship; the priest who restored him a type of Christ'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'leprosy was also an appropriate type or symbol of what happens to a man spiritually when he sins.'
    by: matthew 8
open:
  - 'What does “for a testimony unto them” mean ([[Mark 1:44]]; [[Luke 5:14]])? Matthew 8 found no source that explains it.'
  - 'Why does Luke say Jesus “withdrew himself into the wilderness, and prayed” ([[Luke 5:16]])?'
