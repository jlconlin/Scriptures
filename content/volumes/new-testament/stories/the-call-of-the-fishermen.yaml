story: the-call-of-the-fishermen
differences:
  - 'Matthew and Mark tell a brief call by the shore, two pairs of brothers ([[Matt. 4:18–22]]; [[Mark 1:16–20]]); Luke tells a call with a miraculous catch of fish and Peter’s “Depart from me; for I am a sinful man, O Lord” ([[Luke 5:1–11]]).'
  - 'Matthew and Mark: “fishers of men”; Luke: “from henceforth thou shalt catch men” ([[Luke 5:10]]).'
  - 'Only Mark says Zebedee was left in the ship “with the hired servants” ([[Mark 1:20]]).'
  - 'John tells an earlier meeting at the Jordan, where Andrew follows Jesus and brings Simon ([[John 1:35–42]]).'
findings:
  - claim: 'The Bible Dictionary gives Matt. 4:21–22 and Luke 5:1–11 together as John’s call; John probably the unnamed disciple of John 1:40; his family in fairly comfortable circumstances'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'In his early life he was a fisherman in fairly comfortable circumstances (Mark 1:20). We may assume he is the unnamed disciple of the Baptist mentioned in John 1:40. Later on he received a call to be a disciple of Jesus Christ (Matt. 4:21–22; Luke 5:1–11).'
    by: matthew 4
  - claim: 'Fishers of men: fish caught to die, men drawn to life eternal'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Theretofore they had caught fish, and the fate of the fish was death; thereafter they were to draw men—to a life eternal.'
    by: matthew 4
  - claim: 'Thayer: zōgreō in Luke 5:10, to win souls for the kingdom of God by teaching (first sense, to take alive)'
    key: thayer
    url: 'https://biblehub.com/greek/2221.htm'
    quote: 'ἀνθρώπους ἔσῃ ζωγρῶν, thou shalt catch men, i. e. by teaching thou shalt win their souls for the kingdom of God, Luke 5:10.'
    by: matthew 4
  - claim: 'The figure of fishing for men had been used before, in Jeremiah 16:16'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/4.htm'
    quote: 'The figure had been used before (Jeremiah 16:16)'
    by: matthew 4
  - claim: 'Andrew, a disciple of the Baptist, met Jesus and brought Peter (John 1)'
    key: bd-andrew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/andrew?lang=eng'
    quote: 'As a disciple of John the Baptist he met Jesus and then brought Peter to meet Jesus.'
    by: matthew 4
  - claim: 'JST Matt. 4:18 adds “I am he of whom it is written by the prophets”'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'And he said unto them, I am he of whom it is written by the prophets; follow me, and I will make you fishers of men.'
    by: matthew 4
  - claim: 'Millet reads JST 4:18 as an explicit witness that the Christ of the prophets was among them'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'Here is an explicit witness of the fact that the Christ of whom the prophets had written was now among the people.'
    by: matthew 4
  - claim: 'The Galilee fisheries were a great source of wealth'
    key: bd-galilee
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'By the Sea of Galilee the fisheries were a great source of wealth and provided a large export trade.'
    by: matthew 4
  - claim: 'Talmage reads Matthew and Mark as briefer accounts of the same call that Luke tells with the catch'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The foregoing treatment is based on Luke’s record; the briefer and less circumstantial accounts given by Matthew and Mark omit the incident of the miraculous draught of fishes, and emphasize the calling of the fishermen.'
    by: luke 5
  - claim: 'Brown: Peter’s “sinful” is not a specific sin but a general moral sense, even humility'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Is Peter confessing to a specific sin or set of transgressions? It seems not, though the term (Greek hamartōlos) can bear the sense of scandalous action (see 5:30; 19:7). But here it expresses a more general moral meaning (see 13:2; 24:7), even humility.'
    by: luke 5
  - claim: 'Ellicott (Luke): contact with the divine brings consciousness of sinfulness, as Isaiah 6:5'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/5.htm'
    quote: 'the consciousness, such as ever accompanies man’s recognition of contact with the divine, of his own exceeding sinfulness. So Isaiah cried, “Woe is me, for I am a man of unclean lips” (Isaiah 6:5).'
    by: luke 5
  - claim: 'Brown: the catch provides for the fishermen’s families (D&C 118:3); fish salted at Taricheae'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'By the huge catch of fish, the families of these fishermen will possess enough food and earn enough income to tide them over for a long time'
    by: luke 5
  - claim: 'Brown: Mark’s casting and mending nets differ from Luke’s deep-sea and drag nets; raises whether Luke follows Mark'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'Deep sea nets, drag nets, and casting nets are not of the same construction and weave. These differences again raise the question whether Luke is following or borrowing from Mark’s account.'
    by: luke 5
  - claim: 'Brown: zōgreō, to capture alive, only here and 2 Tim. 2:26'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-5-104'
    quote: 'The verb translated “catch” (Greek zōgreō) means “to capture alive” and appears in the New Testament only here and in 2 Timothy 2:26, where souls are caught by the devil’s snare.'
    by: luke 5
open:
