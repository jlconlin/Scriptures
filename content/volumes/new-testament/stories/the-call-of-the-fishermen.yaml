story: the-call-of-the-fishermen
differences:
  - 'Matthew and Mark tell a brief call by the shore, two pairs of brothers ([[Matt. 4:18–22]]; [[Mark 1:16–20]]); Luke tells a call with a miraculous catch of fish and Peter’s “Depart from me; for I am a sinful man, O Lord” ([[Luke 5:1–11]]).'
  - 'Matthew and Mark: “fishers of men”; Luke: “from henceforth thou shalt catch men” ([[Luke 5:10]]).'
  - 'Only Mark says Zebedee was left in the ship “with the hired servants” ([[Mark 1:20]]).'
  - 'John tells an earlier meeting at the Jordan, where Andrew follows Jesus and brings Simon ([[John 1:35–42]]).'
findings:
  - claim: 'Talmage treats Luke 5 as the same call; Matthew and Mark omit the draught of fishes and emphasize the calling'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The foregoing treatment is based on Luke’s record; the briefer and less circumstantial accounts given by Matthew and Mark omit the incident of the miraculous draught of fishes, and emphasize the calling of the fishermen.'
    by: matthew 4
  - claim: 'Fishers of men: fish caught to die, men drawn to life eternal'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Theretofore they had caught fish, and the fate of the fish was death; thereafter they were to draw men—to a life eternal.'
    by: matthew 4
  - claim: 'Luke 5:10 “take men alive”; Jeremiah 16:16'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The correct translation is, as commentators practically agree, “From henceforth thou shalt take men alive.”'
    by: matthew 4
  - claim: 'The disciples had not stayed with Jesus continuously since the Jordan; Peter already identified with the work; Zebedee’s sons were Simon’s partners'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'It is improbable that the disciples who followed Jesus in the early months of His ministry had remained with Him continuously down to the time now under consideration.'
    by: matthew 4
  - claim: 'Andrew and John followed Jesus at the Baptist’s testimony (John 1)'
    key: talmage-jesus-christ-11
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-11?lang=eng'
    quote: 'These were Andrew and John; the latter came to be known in after years as the author of the fourth Gospel.'
    by: matthew 4
  - claim: 'JST Matt. 4:18 adds “I am he of whom it is written by the prophets”'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'And he said unto them, I am he of whom it is written by the prophets; follow me, and I will make you fishers of men.'
    by: matthew 4
  - claim: 'Millet reads JST 4:18 as an explicit witness that the Christ of the prophets was among them'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'Here is an explicit witness of the fact that the Christ of whom the prophets had written was now among the people.'
    by: matthew 4
  - claim: 'The Galilee fisheries were a great source of wealth'
    key: bd-galilee
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'By the Sea of Galilee the fisheries were a great source of wealth and provided a large export trade.'
    by: matthew 4
open:
  - 'Why does Peter answer the catch with “I am a sinful man” ([[Luke 5:8]])?'
  - 'Are Luke 5:1–11 and Matthew 4:18–22 one event or two? Talmage reads them as one; no other source was read on it.'
  - 'What do the “hired servants” tell about Zebedee’s household ([[Mark 1:20]])?'
