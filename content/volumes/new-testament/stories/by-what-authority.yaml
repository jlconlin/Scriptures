story: by-what-authority
differences:
  - 'Luke has Jesus “preached the gospel” in the temple when they came ([[Luke 20:1]]) and has the rulers fear that “all the people will stone us” ([[Luke 20:6]]).'
  - 'Matthew names “the chief priests and the elders of the people” ([[Matt. 21:23]]); Mark and Luke add the scribes ([[Mark 11:27]]; [[Luke 20:1]]).'
  - 'Mark has Jesus demand “answer me” twice ([[Mark 11:29–30]]).'
  - 'Matthew alone follows the exchange with the parable of the two sons, which turns back to John the Baptist ([[Matt. 21:28–32]]).'
findings:
  - claim: 'Chief priests, scribes and elders made up the Sanhedrin; “these things” were the entry and the clearing of the temple'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'no doubt referring to the triumphal entry and, particularly, his cleansing of the temple, an act that attacked their own authority in the temple'
    by: matthew 21
  - claim: 'Who the chief priests, scribes and elders were'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the chief priests, who would have included the current high priest, earlier holders of that position, and perhaps the heads of the leading priestly families; the scribal experts on the law, including important Pharisees; and the elders of the people, who represented the lay nobility'
    by: matthew 21
  - claim: 'The rulers were guardians of the temple; no sign was asked this time; the question had a sinister purpose'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'They were the guardians of the temple, both the material structure and the theocratic system for which the holy edifice stood'
    by: matthew 21
  - claim: 'Countering a question with a question was the rulers’ own method; they did not try to find the truth'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'He availed Himself of a method very common among themselves—that of countering one question with another.'
    by: matthew 21
  - claim: 'Jesus declined to answer directly but answered indirectly by the parable of the two sons'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'Although he declined to say directly by what authority he did these things (see 21:27), he immediately[13] went on to answer their question indirectly by giving this trenchant parable about two sons'
    by: matthew 21
  - claim: 'JST: he that believed not John concerning me cannot believe me except he first repent'
    key: jst-matt-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/21?lang=eng'
    quote: 'For he that believed not John concerning me, cannot believe me, except he first repent.'
    by: matthew 21
  - claim: 'Luke gives the vivid “stone us” for “we fear the people”; Jerusalem crowds were ready to stone (John 8:59; 10:31; Acts 7:58–59)'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/20.htm'
    quote: 'St. Luke gives the more vivid utterance in place of the more general “we fear the people” in the other Gospels.'
    by: luke 20
  - claim: 'John’s baptism rests on the same continuum as Jesus’s authority, so the counter-question is no dodge'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'But the “baptism of John” (20:4) rests on the same continuum as Jesus’ authority. If that of John is “of men” (20:4), so is Jesus’ leadership.'
    by: luke 20
open:
  - 'Mark places the challenge as Jesus was walking in the temple on the next day ([[Mark 11:27]]); does the day matter to Mark’s structure?'
