story: his-mother-and-his-brethren
differences:
  - 'Luke says they could not come at Him “for the press” ([[Luke 8:19]]) and has Jesus name as His mother and brethren those “which hear the word of God, and do it” ([[Luke 8:21]]); Matthew has “the will of my Father which is in heaven” ([[Matt. 12:50]]) and Mark “the will of God” ([[Mark 3:35]]).'
  - 'Only Matthew has Jesus stretch out His hand toward His disciples ([[Matt. 12:49]]); Mark has Him look round on those who sat about Him ([[Mark 3:34]]).'
  - 'Mark sets the scene after the kinsmen who said “He is beside himself” ([[Mark 3:21]]); Luke places it after the parable of the sower ([[Luke 8:19–21]]).'
findings:
  - claim: 'Brethren of the Lord: James, Joses, Simon, Judas, children of Joseph and Mary; there were sisters'
    key: bd-brethren-of-the-lord
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/brethren-of-the-lord?lang=eng'
    quote: 'They were children of Joseph and Mary, born after Jesus’ birth. Matt. 13:56 shows that there were also sisters.'
    by: matthew 12
  - claim: 'No foundation for reading the visit as an attempt at restraint'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'The scriptural record furnishes no foundation for even a tentative conception of the kind. The purpose of the desired visit is not intimated.'
    by: matthew 12
  - claim: 'Not disrespect; His work took precedence over family'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'We are not justified in construing these remarks as evidence of disrespect, far less of filial and family disloyalty.'
    by: matthew 12
  - claim: 'Ellicott reads the visit as an attempt to check His work (the reading Talmage rejects)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'The tone of protest and, as it were, disclaimer in which He now speaks of this attempt to control and check His work, shows what their purpose was.'
    by: matthew 12
  - claim: 'His mother and brethren worshipped with the Eleven after the ascension'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Immediately after the Lord’s ascension, Mary, the mother of Jesus, and His brethren were engaged in worship and supplication with the Eleven and other disciples (Acts 1:14).'
    by: matthew 12
  - claim: 'In Luke the saying ties to the sower: followers take these relationships when they hear and do'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'the appearance of Jesus’ “mother and his brethren” leads him to say that followers will assume these honored relationships when they “hear the word of God, and do it” (8:19, 21).'
    by: luke 8
  - claim: 'Brown: no substantial reason to doubt they are blood brothers of Mary and Joseph'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-8-104'
    quote: 'But no substantial reason exists to discount the view that these men are blood brothers of Jesus who are born to Mary and Joseph'
    by: luke 8
  - claim: 'Mary herself the pattern of hearing the word and doing it'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'Mary exemplified what the Lord meant by hearing the word of God and doing it from the time the angel appeared to her to announce that she would bear the Son of God.'
    by: luke 8
open:
  - 'In Mark, does the family’s arrival ([[Mark 3:31]]) complete the kinsmen’s errand of [[Mark 3:21]]? Talmage’s note to chapter 18, “The Mother and the Brethren of Jesus,” is the place to start.'
