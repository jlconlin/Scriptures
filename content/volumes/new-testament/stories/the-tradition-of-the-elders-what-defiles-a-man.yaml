story: the-tradition-of-the-elders-what-defiles-a-man
differences:
  - 'Only Mark explains the custom for his readers: the Pharisees “and all the Jews” wash before eating, after the market, and wash cups, pots and tables ([[Mark 7:3–4]]).'
  - 'Mark gives the Aramaic word “Corban, that is to say, a gift” ([[Mark 7:11]]); Matthew has only “It is a gift” ([[Matt. 15:5]]).'
  - 'Matthew puts the corban example before the Isaiah quotation ([[Matt. 15:3–9]]); Mark quotes Isaiah first ([[Mark 7:6–13]]).'
  - 'Only Matthew has the disciples’ report that the Pharisees were offended, the plant to be rooted up and the blind leaders of the blind ([[Matt. 15:12–14]]), and names Peter as the one who asks ([[Matt. 15:15]]).'
  - 'Only Mark has “purging all meats” ([[Mark 7:19]]) and the longer list of evils from the heart ([[Mark 7:21–22]]); Matthew ends on “to eat with unwashen hands defileth not a man” ([[Matt. 15:20]]).'
findings:
  - claim: 'The Pharisees sought to bring the temple’s holiness into every home; others held the priestly purity rules applied only to priests'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'While other Jews of this time believed that these regulations in Leviticus applied only to the priests in the temple, the Pharisees’ goal was to bring the holiness of the temple into every home through applying these laws more broadly.'
    by: matthew 15
  - claim: 'Hence the washing of hands and vessels to make meals ritually pure'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'It led the Pharisees to focus on the purification of vessels and the washing of hands to make the meals ritually pure.'
    by: matthew 15
  - claim: 'Jesus’s public teaching to the multitude refuted the authority behind the Pharisees’ holiness'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'Jesus also directly and publicly refutes the authority and interpretation around which the Pharisees’ understanding of holiness was built.'
    by: matthew 15
  - claim: 'The charge was ceremonial uncleanness, not hygiene'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It should be borne in mind that the offense charged against the disciples was that of ceremonial uncleanness, not physical uncleanliness or disregard of sanitary propriety'
    by: matthew 15
  - claim: 'Mark presents handwashing as a general Jewish custom; Jesus’s problem is tradition used to set aside God’s commandment'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'Mark does not present handwashing as a primarily Pharisaic innovation. … In this instance, the problem for Jesus is not the traditions per se, but rather in the use of that tradition to turn aside the specific commandment of God.'
    by: matthew 15
  - claim: 'Qorban: first a sacrificial gift, later a vow; Jesus allows the oral law but not over the written'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'which originally referred to a sacrificial gift, but by the Second Temple period had come to mean a vow or offering.'
    by: matthew 15
  - claim: 'Corban: a binding vow held above the duty to parents'
    key: bd-corban
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/corban?lang=eng'
    quote: 'The utterance of it was held to constitute a binding vow, and the fulfillment of a vow was regarded by the Pharisees as of deeper obligation than the duty even to parents.'
    by: matthew 15
  - claim: 'Jesus joins Exodus 20:12 and 21:17: corban is both failing to honor and cursing parents'
    key: bowen-jewish-hermeneutics
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/jewish-hermeneutics-new-testament-period'
    quote: 'the Pharisees were at once failing to honor their parents, a grievous sin of omission, and actively cursing their parents, an even worse sin of commission and a capital offense.'
    by: matthew 15
  - claim: 'The Septuagint of Isaiah 29:13 has “in vain do they worship me,” the wording of Matthew 15:9 and Mark 7:7'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/29.htm'
    quote: 'but their heart is far from me: but in vain do they worship me, teaching the commandments and doctrines of men.'
    by: matthew 15
  - claim: 'The principle in its tendency set aside clean and unclean meats; Peter still kept them after Pentecost'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'Even after the day of Pentecost, Peter still prided himself on the observance of the Law which was thus annulled'
    by: matthew 15
open:
  - 'What does Mark’s “purging all meats” ([[Mark 7:19]]) mean, and is it Jesus’s word or Mark’s comment?'
  - 'Why does Mark explain the washing customs “of all the Jews” ([[Mark 7:3–4]])? What does it show about his readers?'
  - 'Mark’s list of evils from the heart is longer than Matthew’s ([[Mark 7:21–22]]); what are “an evil eye” and “lasciviousness”?'
