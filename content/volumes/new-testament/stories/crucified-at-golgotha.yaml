story: crucified-at-golgotha
differences:
  - 'Matthew, Mark and Luke have Simon of Cyrene carry the cross ([[Matt. 27:32]]; [[Mark 15:21]]; [[Luke 23:26]]); only Mark names his sons Alexander and Rufus; John says Jesus went forth “bearing his cross” ([[John 19:17]]).'
  - 'The first drink: “vinegar … mingled with gall” in the King James Matthew ([[Matt. 27:34]]; the Greek text modern editions print reads oinon, “wine”), “wine mingled with myrrh” in Mark ([[Mark 15:23]]); Matthew says He tasted it, Mark that He received it not. Luke has soldiers offering vinegar in mockery ([[Luke 23:36]]); John has no first drink.'
  - 'Only Luke has the daughters of Jerusalem and the green tree ([[Luke 23:27–31]]) and “Father, forgive them” ([[Luke 23:34]]). Only Mark gives the hour, “the third hour” ([[Mark 15:25]]). Only John has the seamless coat and the title in three languages, with the chief priests’ objection ([[John 19:19–24]]).'
  - 'The title reads “THIS IS JESUS THE KING OF THE JEWS” in Matthew, “THE KING OF THE JEWS” in Mark, “THIS IS THE KING OF THE JEWS” in Luke, “JESUS OF NAZARETH THE KING OF THE JEWS” in John.'
  - 'In Matthew and Mark both thieves revile Him ([[Matt. 27:44]]; [[Mark 15:32]]); in Luke one repents ([[Luke 23:39–43]]). Only Matthew has “for he said, I am the Son of God” and “If thou be the Son of God” among the taunts ([[Matt. 27:40]], [[Matt. 27:43]]).'
  - 'The Joseph Smith Translation of Matthew 27:33 reads “a place of burial” for “a place of a skull” (JST Matt. 27:35, footnote).'
  - 'Mark says “it was the third hour, and they crucified him” ([[Mark 15:25]]); John has Pilate’s sentencing “about the sixth hour” ([[John 19:14]]); Matthew, Mark and Luke have the darkness from the sixth hour ([[Matt. 27:45]]; [[Mark 15:33]]; [[Luke 23:44]]).'
findings:
  - claim: 'Condemned men carried their cross; Jesus probably carried only the crossbeam'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus probably only carried the crossbeam itself'
    by: matthew 27
  - claim: 'Simon’s experience might have led to his conversion and his sons’'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'this detail suggests that the experience of being so close to Jesus at that critical time might have made a powerful impact on Simon, perhaps leading to his conversion and later to that of his sons.'
    by: matthew 27
  - claim: 'No Roman or Jew would bear the cross willingly'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'No Roman or Jew would have voluntarily incurred the ignominy of bearing such a gruesome burden; for every detail connected with the carrying out of a sentence of crucifixion was regarded as degrading.'
    by: matthew 27
  - claim: 'Simon’s household perhaps became believers'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'there is some indication that the household of Simon the Cyrenian came to be numbered with the believers.'
    by: matthew 27
  - claim: 'The first drink was sweet wine with myrrh; the later one cheap wine vinegar'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Unlike the sweet wine (Greek, oinon) mingled with myrrh that Jesus had initially refused (Mark 15:23; parallel Matt 27:34), this was a much cheaper wine vinegar (Greek, oxous)'
    by: matthew 27
  - claim: 'Modern Greek editions read oinon in Matthew 27:34'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/27-34.htm'
    quote: 'oinon'
    by: matthew 27
  - claim: '“Gall” is wormwood in the Septuagint; the drink was a narcotic given by the merciful'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/27.htm'
    quote: 'It was clearly something at once nauseous and narcotic, given by the merciful to dull the pain of execution'
    by: matthew 27
  - claim: 'The thieves on right and left, robe, reed and title read as a mockery of the judgment scene'
    key: mitton-crucifixion-mockery
    url: 'https://interpreterfoundation.org/journal/the-crucifixion-as-a-mockery-witness-and-warning-of-the-judgment'
    quote: 'The crucifixion may be understood as an inexpressibly perverse and diabolical mockery of the final judgment scene.'
    by: matthew 27
  - claim: 'The crucified generally lived many hours, sometimes days'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'The victim lived in ever increasing torture, generally for many hours, sometimes for days.'
    by: matthew 27
  - claim: 'Simon was a member of the Jewish colony in northern Africa'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'was a member of the Jewish colony in northern Africa, which had been established nearly three centuries before the birth of Christ'
    by: mark 15
  - claim: 'Wine with myrrh perhaps a narcotic (Prov 31:6); He refused, perhaps to endure the full experience'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'his executioners offer him wine mixed with myrrh, which might have been intended to serve as some sort of narcotic to lessen the pain (see Prov 31:6). Jesus refuses it, perhaps because it was necessary for him to endure the full experience of crucifixion'
    by: mark 15
  - claim: 'The narcotic was no Roman practice but a concession to Jewish sentiment; He refused, to meet death with mind unclouded'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'This was no Roman practice, but was allowed as a concession to Jewish sentiment. When the drugged cup was presented to Jesus He put it to His lips, but having ascertained the nature of its contents refused to drink, and so demonstrated His determination to meet death with faculties alert and mind unclouded.'
    by: mark 15
  - claim: 'Mark’s third hour leaves hardly enough time; John’s sentencing at the sixth hour'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'which hardly provides enough time for all the procedures the trial narratives suggest. Instead, John’s account places Pilate’s formal sentencing of Jesus at the sixth hour, or noon.'
    by: mark 15
  - claim: 'John’s timing allows more time and has the Lamb die during the Passover sacrifices'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Most significantly, it supports John’s paschal chronology by having Jesus, the true Lamb of God, hang and then die on the cross during the very hours that the priests are performing the Passover sacrifices in the temple.'
    by: mark 15
  - claim: 'The third hour, unique to Mark, agrees with the darkness at the sixth hour in Matthew and Luke'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/15.htm'
    quote: 'The precise statement of the hour is peculiar to St. Mark, but it agrees with the narrative common to him with St. Matthew and St. Luke of the darkness that came over the land at the “sixth hour.”'
    by: mark 15
  - claim: 'Lēistai may mean rebels like Barabbas; Jesus might have died in Barabbas’s place'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Indeed, Jesus might have been executed in the very place where Barabbas would have been crucified if he had not been chosen by the crowd for pardon.'
    by: mark 15
  - claim: 'Simon carrying the cross after Jesus pictures the sayings on bearing the cross (Luke 9:23; 14:27)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Luke paints for readers a vivid visual reminder of those sayings in that a man, Simon, carries the cross while following the Savior.'
    by: luke 23
  - claim: 'Green tree and dry: three readings; the green tree as Jesus is supported by D&C 135:6; the JST adds the scattering of Israel'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The “green tree” is Jesus who is about to die, an interpretation solidified by a reference to the expression in an account of the martyrdoms of Joseph and Hyrum Smith (see D&C 135:6'
    by: luke 23
  - claim: 'JST Luke 23:35: “(Meaning the soldiers who crucified him,)”'
    key: jst-luke-23
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/23?lang=eng'
    quote: 'Then said Jesus, Father, forgive them; for they know not what they do (Meaning the soldiers who crucified him,) and they parted his raiment and cast lots.'
    by: luke 23
  - claim: 'The forgiveness extends to the soldiers, not yet to the rulers'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Hence, Jesus’ forgiveness extends to the soldiers alone, not yet to “the rulers” (23:35; compare Acts 3:14–19; 7:60).'
    by: luke 23
  - claim: 'P75 and many manuscripts lack “Father, forgive them”; it fits Luke’s language and Acts 7:60 echoes it'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'But the saying fits Luke’s language. And Stephen’s prayer in Acts 7:60 seems to draw its inspiration from the words of Jesus reported here, thus buttressing its genuineness'
    by: luke 23
  - claim: 'Church leaders quote “Father, forgive them” most often, to teach forgiveness, and apply it more widely than the JST’s soldiers'
    key: hilton-final-seven-statements
    url: 'https://rsc.byu.edu/vol-22-no-1-2021/teachings-church-leaders-christs-final-seven-statements'
    quote: 'Although this translation makes it clear that Christ refers to the soldiers, Church leaders have also used this statement from the cross to indicate that Christ asked his Father to forgive “the Jews,”'
    by: luke 23
  - claim: 'Joseph Smith: paradise means the world of spirits, where Jesus would teach the thief'
    key: ehat-cook-words-1843-06-11
    url: 'https://rsc.byu.edu/words-joseph-smith/11-june-1843-sunday-morning-temple-stand'
    quote: 'what is Paradise it is a modern word it does not answer at all to the original that Jesus made use of … But it was this day I will be with thee in the world of spirits & will teach thee'
    by: luke 23
  - claim: 'Church leaders rebutted the claim that the promise to the thief made baptism unnecessary'
    key: hilton-final-seven-statements
    url: 'https://rsc.byu.edu/vol-22-no-1-2021/teachings-church-leaders-christs-final-seven-statements'
    quote: 'On four occasions, speakers specifically rebutted claims that this statement from the Savior obviated the need for baptism.'
    by: luke 23
  - claim: 'For John: the three-language phrase is missing from P75 in Luke; most think John 19:20 is its source'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'This long phrase does not appear in certain early manuscripts of Luke, including the earliest (P75). We compare John 19:20, which most think is the source of this phrase in Luke.'
    by: luke 23
open:
  - 'Why does the Joseph Smith Translation read “a place of burial” for Golgotha (JST Matt. 27:35)? No source was found for Matthew 27.'
  - 'Why does John dwell on the seamless coat ([[John 19:23–24]])?'
