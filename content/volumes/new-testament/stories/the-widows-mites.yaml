story: the-widows-mites
differences:
  - 'Mark has Jesus sit “over against the treasury” and watch “how the people cast money,” and “many that were rich cast in much” ([[Mark 12:41]]); Luke has Him look up and see “the rich men casting their gifts” ([[Luke 21:1]]).'
  - 'Only Mark explains the coins: “two mites, which make a farthing” ([[Mark 12:42]]); Luke has “two mites” ([[Luke 21:2]]).'
  - 'Only Mark has Jesus call His disciples to Him before He speaks ([[Mark 12:43]]).'
  - 'Mark: “all that she had, even all her living” ([[Mark 12:44]]); Luke: “all the living that she had,” and the rich gave “unto the offerings of God” ([[Luke 21:4]]).'
  - 'Both follow the warning against the scribes who “devour widows’ houses” ([[Mark 12:40]]; [[Luke 20:47]]); Matthew has no widow’s mites.'
findings:
  - claim: 'The treasury receptacle had thirteen trumpet-shaped chests, for temple service and the poor'
    key: thayer
    url: 'https://biblehub.com/greek/1049.htm'
    quote: 'to which were fitted thirteen chests or boxes'
    by: mark 12
  - claim: 'Thirteen chests with trumpet-shaped receptacles; some rich gave ostentatiously'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Within that space were thirteen chests, each provided with a trumpet-shaped receptacle; and into these the people dropped their contributions for the several purposes indicated by inscriptions on the boxes.'
    by: mark 12
  - claim: 'Heaven reckons gifts by quality and intent; the rich kept back more'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'entries are made in terms of quality rather than of quantity, and values are determined on the basis of capability and intent. The rich gave much yet kept back more; the widow’s gift was her all.'
    by: mark 12
  - claim: 'The lepton was the smallest coin used by the Jews, half a quadrans'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'The lepton (or mite) (Mark 12:42; Luke 12:59; 21:2), the smallest bronze coin used by the Jews. Equaled one-half quadrans.'
    by: mark 12
  - claim: '“Mite” means thin or tiny; the farthing is one of Mark’s Latin words, the quadrans'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'The “farthing” is one of the Latin words which characterise this Gospel, and represents the quadrans, or fourth-part of a Roman as. The primary meaning of the word rendered “mite” is “thin” or “tiny.”'
    by: mark 12
  - claim: 'The two coins were barely a meal; the widow of Zarephath recalled'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Together they represented barely enough for single meal, recalling the widow of Zarephath who gave the substance of her final meal to the prophet Elijah (1 Kgs 17:10‒15).'
    by: mark 12
  - claim: '“All her living” literally “her whole life”; may foreshadow Jesus’s gift of His life (Smith, quoted)'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Smith has observed, “The reference to her whole life (KJV: “all her living”) may foreshadow Jesus’ coming gift of his whole life.”'
    by: mark 12
  - claim: 'Bios: that by which life is sustained (Mark 12:44; Luke 21:4)'
    key: thayer
    url: 'https://biblehub.com/greek/979.htm'
    quote: 'that by which life is sustained, resources, wealth (A. V. living): Mark 12:44'
    by: mark 12
  - claim: 'Among the rich may have been some who devoured widows’ houses'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'Among the “many” who cast in much must have been some at least of the Pharisees who devoured widows’ houses.'
    by: mark 12
  - claim: 'Mark’s arrangement invites comparing the widow and the woman who anoints Jesus'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'eliminates the arrangement of the text that encourages the reader to compare the widow and the anointer. In Mark’s telling, readers can see both women as commentary on the teachings in Mark 13'
    by: mark 12
open:
  - 'What does Luke’s “cast in unto the offerings of God” mean ([[Luke 21:4]])?'
  - 'Luke has the widow just before the discourse on the temple’s fall ([[Luke 21:5–6]]); does his arrangement carry the same meaning Smith finds in Mark’s?'
