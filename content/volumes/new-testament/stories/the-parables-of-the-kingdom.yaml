story: the-parables-of-the-kingdom
differences:
  - 'Matthew gives seven parables in this discourse: the sower, the wheat and the tares, the mustard seed, the leaven, the treasure, the pearl and the net, closing with the householder scribe ([[Matt. 13:3–52]]). Mark, in this story, has the seed growing secretly, which only he tells ([[Mark 4:26–29]]), and the mustard seed ([[Mark 4:30–32]]).'
  - 'Luke tells the mustard seed and the leaven in another setting, a synagogue on the sabbath ([[Luke 13:18–21]]).'
  - 'Mark says the mustard plant “shooteth out great branches” and the birds lodge “under the shadow of it” ([[Mark 4:32]]); Matthew says it “becometh a tree” and the birds lodge “in the branches thereof” ([[Matt. 13:32]]).'
  - 'Matthew explains the summary of parable-teaching as a fulfillment of Psalm 78:2 ([[Matt. 13:35]]); Mark says He spoke “as they were able to hear it” and expounded all things to the disciples when alone ([[Mark 4:33–34]]).'
  - 'Only Matthew has the disciples ask for and receive the explanation of the tares in the house ([[Matt. 13:36–43]]), and only Matthew asks “Have ye understood all these things?” ([[Matt. 13:51]]).'
findings:
  - claim: 'Tares are bearded darnel; poisonous fungus; indistinguishable from wheat before heading; uprooting would harm the wheat'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'A poisonous fungus can infect the seeds of darnel, rendering flour made from darnel-contaminated grain toxic. … Once mature plants produce seed heads, darnel and wheat can be easily distinguished from one another, but before going to seed, they are very similar in appearance.'
    by: matthew 13
  - claim: 'The kingdom in the tares parable appears to be the Church'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'The parable warns that the “kingdom of heaven,” which in this context appears to refer to the Church, may include “tares” who are emissaries of the adversary placed to masquerade as devout members but who in truth harm the whole.'
    by: matthew 13
  - claim: 'Mustard: likely black mustard, cultivated in Galilee, up to ten feet; not the smallest seed nor a true tree; hyperbole'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'Hyperbole is perhaps involved in this parable for though the seeds are small, they are not the smallest or “least” among seeds. Moreover, being an annual herb, black mustard is not a true tree.'
    by: matthew 13
  - claim: 'The kingdom was expected to come in glory; Jesus spoke of a small beginning'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'To the mind taught by teachers of the time the kingdom was to be great and glorious from its beginning; it was to be ushered in by blare of trumpets and tramp of armies, with King Messiah at the head'
    by: matthew 13
  - claim: 'Leaven, usually a symbol of malice, here works for good from within'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'Here the working is from within. The “leaven”—commonly, as in the Passover ritual, the symbol of malice and wickedness (1Corinthians 5:8)'
    by: matthew 13
  - claim: 'Treasure, pearl and net are Matthew’s only; spoken to the disciples in the house'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'This and the two parables following are recorded by Matthew only; and the place assigned them in his narrative indicates that they were spoken to the disciples alone, in the house, after the multitude had departed.'
    by: matthew 13
  - claim: 'Psalm 78 not predictive; Matthew’s use of “fulfilled”'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'The Psalm itself was in no sense predictive, but simply an historical survey of God’s dealings with Israel … Here was One whose form of teaching answered to that which the Psalmist had described, who might claim the Psalmist’s words as His own'
    by: matthew 13
  - claim: 'D&C 86 came while translating; the order of gathering reversed; JST revised in review'
    key: jackson-new-translation-revelations
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/new-translation-revelations'
    quote: 'In this revelation the order of events (gathering the wheat first) is the reverse of the order in Matthew’s parable. Working on the New Translation, Joseph Smith had revised Matthew 13 over a year and a half earlier without changing the order of events.'
    by: matthew 13
  - claim: 'JST Matt. 13:41: end of the world, or the destruction of the wicked'
    key: jst-matt-13
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/13?lang=eng'
    quote: 'As, therefore, the tares are gathered and burned in the fire, so shall it be in the end of this world, or the destruction of the wicked.'
    by: matthew 13
  - claim: 'Joseph Smith read the parables as one history of the kingdom (sequence)'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'the sower to the establishment of the kingdom in the time of Christ; the parable of the wheat and tares to the corruption of the Church in the age of apostasy; the mustard seed to the growth of the kingdom in the last days'
    by: matthew 13
  - claim: 'Joseph Smith: the mustard seed is the latter-day church; the Book of Mormon hid in the field'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/3'
    quote: 'Now we can discover plainly, that this figure is given to represent the church as it shall come forth in the last days.'
    by: matthew 13
  - claim: 'Joseph Smith: the net is the seed of Joseph spreading the gospel net'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/5'
    quote: 'For the work of this pattern, behold the seed of Joseph, spreading forth the gospel net, upon the face of the earth, gathering of every kind, that the good may be saved in vessels prepared for that purpose, and the angels will take care of the bad'
    by: matthew 13
  - claim: 'Talmage on the seed growing secretly (Mark only) is in the same chapter, section “The Seed Growing Secretly”'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'the seed that grew though the planter had temporarily forgotten it'
    by: matthew 13
  - claim: 'Seed growing secretly: whoever plants, the seed is alive; the lesson is its vitality'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Whether the seed be planted by the Lord Himself, as when He taught in Person, or by any one of His authorized servants, the seed is alive and will grow.'
    by: mark 4
  - claim: 'Seed growing secretly: growth in those taught depends on their agency and on God'
    key: lopez-seed-growing-secretly
    url: 'https://www.churchofjesuschrist.org/study/liahona/2003/02/the-parable-of-the-seed-growing-secretly?lang=eng'
    quote: 'If a person’s testimony is to grow until it bears mature fruit, or conversion, God must be the primary force behind our harvest.'
    by: mark 4
  - claim: 'JST Mark 4:26 (footnote 33a): “able to bear”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/4?lang=eng'
    quote: 'able to bear; but without'
    by: mark 4
open:
  - 'Why does Luke set the mustard seed and the leaven after the healing of the bent woman on the sabbath ([[Luke 13:10–21]])?'
