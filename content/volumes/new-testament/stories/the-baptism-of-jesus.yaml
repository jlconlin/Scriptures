story: the-baptism-of-jesus
differences:
  - 'Only Matthew has John’s attempt to refuse and Jesus’s answer, “thus it becometh us to fulfil all righteousness” ([[Matt. 3:14–15]]).'
  - 'Matthew gives the Father’s words in the third person, “This is my beloved Son” ([[Matt. 3:17]]); Mark and Luke in the second, “Thou art my beloved Son” ([[Mark 1:11]]; [[Luke 3:22]]).'
  - 'Only Luke says Jesus was praying, that the Holy Ghost came “in a bodily shape like a dove,” and that Jesus was about thirty ([[Luke 3:21–23]]).'
  - 'Mark says Jesus came “from Nazareth of Galilee” ([[Mark 1:9]]); Matthew “from Galilee” ([[Matt. 3:13]]).'
  - 'John does not narrate the baptism; John the Baptist testifies that he saw the Spirit descend and abide on Jesus, the sign he had been given ([[John 1:29–34]]).'
findings:
  - claim: 'Talmage: John recognized a sinless man but did not yet know Jesus was the Christ; the dove was the sign appointed to him'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'when Jesus presented Himself for baptism, John recognized in Him a sinless Man who stood in no need of repentance … In the light of later events it appears that at this time John did not know that Jesus was the Christ'
    by: matthew 3
  - claim: 'Talmage (his own reading): the third- and second-person forms of the Father’s words are evidence of independent authorship'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'The variation, slight and essentially unimportant as it is though bearing on so momentous a subject, affords evidence of independent authorship and discredits any insinuation of collusion among the writers.'
    by: matthew 3
  - claim: 'KnoWhy #655: at the baptism the presence of all three members of the Godhead became manifest'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'Jesus’s identity as God’s Only Begotten Son was confirmed in a dramatic manner as the veil between heaven and earth was rent and the presence of all three members of the Godhead became manifest.'
    by: matthew 3
  - claim: 'Talmage: baptism is required of all for membership in the kingdom, not only for remission of sins'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'water baptism is not alone the means provided for gaining remission of sins, but is also an indispensable ordinance established in righteousness and required of all mankind as an essential condition for membership in the kingdom of God.'
    by: matthew 3
  - claim: 'Nephi: Christ’s baptism shows the narrow gate by which all should enter, He having set the example (2 Ne. 31:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'And again, it showeth unto the children of men the straitness of the path, and the narrowness of the gate, by which they should enter, he having set the example before them.'
    by: matthew 3
  - claim: 'Joseph Smith on the sign of the dove: the Holy Ghost is a personage and cannot be transformed into a dove'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'The Holy Ghost is a personage, and is in the form of a personage. It does not confine itself to the form of the dove, but in sign of the dove. The Holy Ghost cannot be transformed into a dove'
    by: matthew 3
  - claim: 'Joseph Smith: Christ fulfilled all righteousness by obeying the law He gave Moses, and submitted to John’s authority'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'Christ Himself fulfilled all righteousness in becoming obedient to the law which He had given to Moses on the mount, and thereby magnified it and made it honorable, instead of destroying it.'
    by: matthew 3
  - claim: 'JST Matt. 3:43–46: “Suffer me to be baptized of thee”; John went down into the water; John saw the Spirit and heard the voice; “Hear ye him” added'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'And lo, he heard a voice from heaven, saying, This is my beloved Son, in whom I am well pleased. Hear ye him.'
    by: matthew 3
  - claim: 'KnoWhy #655: Mark and Luke address Jesus, Matthew the audience; as in a royal investiture; allusion to Psalm 2:7'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'Matthew records God speaking to the audience who witnessed Jesus’s baptism. In any royal investiture, words were naturally addressed both to the one being elevated to the throne and also to the people who then would honor that ruler'
    by: matthew 3
  - claim: 'KnoWhy #655: Mark 1:10 literally says the heavens were “torn open”'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'it is noteworthy that the heavens were “torn open,” according to the literal Greek translation of Mark 1:10.'
    by: matthew 3
  - claim: 'KnoWhy #865: some scribes changed Luke 3:22 to match Psalm 2:7'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'Scholars are sure ancient readers connected Luke 3:22 to the verse about kingship in Psalm 2 because some scribes accidentally changed the text of Luke to match Psalm 2.'
    by: matthew 3
  - claim: 'Smith: the torn heavens (Mark 1:10) and the torn veil (15:38) are both divine actions; baptism and death share one narrative pattern'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Both rendings are divine actions: after the baptism, the Spirit tears through the heavens to descend upon Jesus (Mark 1:10); after the death, God’s action rends the veil'
    by: mark 1
  - claim: 'Larsen: Matthew’s “fulfil all righteousness” perhaps answers how a sinless Messiah could receive “the baptism of repentance” (Mark 1:4)'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'to answer the questions that some would have concerning a sinless Messiah receiving “the baptism of repentance for the remission of sins” (Mark 1:4).'
    by: mark 1
  - claim: 'Brown: only Luke has Jesus praying at His baptism'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Luke alone preserves the detail that Jesus prays at his baptism, an illustration of the link between personal worship and ordinances.'
    by: luke 3
  - claim: 'JST Luke 3:28 (via Brown): “Jesus also came unto John: and being baptized of him”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'The Joseph Smith Translation, however, makes visible the tie between Jesus and John that Luke’s text does not by adding six words: “Jesus also came unto John: and being baptized of him” (JST 3:28; emphasis added).'
    by: luke 3
  - claim: 'Brown: “bodily shape” is Luke’s alone; only Nephi elsewhere compares the Spirit to a dove (1 Ne. 11:27; 2 Ne. 31:8)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'No known ancient source compares God’s Spirit to a dove except two, both from the same author, Nephi. In each, the scene prophetically envisions this moment of Jesus’ baptism (see 1 Ne. 11:27; 2 Ne. 31:8).'
    by: luke 3
  - claim: 'Brown: Western manuscripts add “This day have I begotten thee” at Luke 3:22, from Psalm 2:7; “beloved” means “only”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'When the term “beloved” is applied to a son or daughter, it means “only.”94 Interestingly, manuscripts from the Western textual family include the interesting addition, “This day have I begotten thee,” likely an addition resting on Psalm 2:7.'
    by: luke 3
  - claim: 'JST John 1:30–32 reads “I knew him” where the KJV has “I knew him not” (John 1:31, 33), and sets the sign at the baptism: “When he was baptized of me, I saw the Spirit descending”'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'And I knew him; for he who sent me to baptize with water, the same said unto me; Upon whom thou shalt see the Spirit descending, and remaining on him, the same is he who baptizeth with the Holy Ghost.'
    by: john 1
open:
  - 'Mark’s “torn open” heavens ([[Mark 1:10]]) beside the rending of the temple veil ([[Mark 15:38]]): check the Greek with greek.mjs and a source that draws the connection.'
  - 'How does John’s “I knew him not” ([[John 1:31–33]]) fit Matthew’s account of John’s protest? Talmage chapter 10 answers; JST John 1 has its own readings.'
