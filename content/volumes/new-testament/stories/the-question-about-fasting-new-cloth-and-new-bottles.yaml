story: the-question-about-fasting-new-cloth-and-new-bottles
differences:
  - 'In Matthew John’s disciples ask ([[Matt. 9:14]]); in Mark the question is about John’s and the Pharisees’ disciples, asked by an unnamed “they” ([[Mark 2:18]]); in Luke “they” are the critics of the meal, and they add “make prayers” ([[Luke 5:33]]).'
  - 'Matthew has “Can the children of the bridechamber mourn”; Mark and Luke “fast” ([[Mark 2:19]]; [[Luke 5:34]]).'
  - 'Luke’s patch is cut from a new garment, so both are spoiled ([[Luke 5:36]]); Matthew and Mark speak of new (unshrunk) cloth on an old garment.'
  - 'Only Luke adds “No man also having drunk old wine straightway desireth new: for he saith, The old is better” ([[Luke 5:39]]).'
  - 'Matthew and Luke end the wine saying “both are preserved” ([[Matt. 9:17]]; [[Luke 5:38]]); Mark does not ([[Mark 2:22]]).'
  - 'The Joseph Smith Translation adds, in Matthew only, an exchange about the Pharisees’ baptism between the bridegroom and the patch (JST Matt. 9:18–21).'
findings:
  - claim: 'JST Matt. 9:18–21: the Pharisees ask to be received with their baptism; Jesus refuses'
    key: jst-matt-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/9?lang=eng'
    quote: 'But Jesus said unto them, Ye keep not the law. If ye had kept the law, ye would have received me, for I am he who gave the law. … I receive not you with your baptism, because it profiteth you nothing.'
    by: matthew 9
  - claim: 'Millet: the JST gives background for the abstruse sayings; D&C 22 met the same resistance in 1830'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'The Joseph Smith translation provides a fascinating background for the Savior’s otherwise abstruse words concerning cloth and bottles. A similar resistance was encountered by Joseph Smith at the time of the organization of the latter-day Church.'
    by: matthew 9
  - claim: 'D&C 22 heading: given to those previously baptized who wished to join without rebaptism'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/22?lang=eng'
    quote: 'April 16, 1830. This revelation was given to the Church in consequence of some who had previously been baptized desiring to unite with the Church without rebaptism.'
    by: matthew 9
  - claim: 'The questioners included John’s disciples allied with the Pharisees; John had called himself the Bridegroom’s friend'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'To the friends of the now imprisoned Baptist our Lord’s reply must have brought memories of their beloved leader’s words, when he had compared himself to the Bridegroom’s friend, and had plainly told them who was the real Bridegroom.'
    by: matthew 9
  - claim: 'The bottles were skins; the gospel a new and everlasting covenant, no addendum'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The gospel taught by Christ was a new revelation, superseding the past, and marking the fulfillment of the law; it was no mere addendum, nor was it a reenactment of past requirements; it embodied a new and an everlasting covenant.'
    by: matthew 9
  - claim: 'Thayer: askos, a leather bag for water or wine'
    key: thayer
    url: 'https://biblehub.com/greek/779.htm'
    quote: 'ἀσκός, ἀσκοῦ, ὁ, a leathern bag or bottle, in which water or wine was kept: Matthew 9:17; Mark 2:22; Luke 5:37f.'
    by: matthew 9
  - claim: '“The bridegroom shall be taken from them”: the first recorded intimation of His death in His public teaching'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'Noteworthy as the first recorded intimation in our Lord’s public teaching … of His coming death.'
    by: matthew 9
open:
  - 'What does Luke’s added saying, “The old is better” ([[Luke 5:39]]), mean?'
  - 'Why does Luke’s patch come from a new garment ([[Luke 5:36]])?'
  - 'Why does Matthew say “mourn” where Mark and Luke say “fast” ([[Matt. 9:15]])? No source read explains it.'
