story: the-preaching-of-john-the-baptist
differences:
  - 'Only Matthew gives John’s message as “Repent ye: for the kingdom of heaven is at hand” ([[Matt. 3:2]]); Mark and Luke say he preached “the baptism of repentance for the remission of sins” ([[Mark 1:4]]; [[Luke 3:3]]).'
  - 'Mark opens with Malachi 3:1 as well as Isaiah 40:3 under the heading “in the prophets” ([[Mark 1:2–3]]); Luke quotes Isaiah 40:3–5 through “all flesh shall see the salvation of God” ([[Luke 3:4–6]]); in John, John the Baptist speaks Isaiah 40:3 of himself ([[John 1:23]]).'
  - 'Matthew aims the “generation of vipers” at “many of the Pharisees and Sadducees” ([[Matt. 3:7]]); Luke at “the multitude” ([[Luke 3:7]]).'
  - 'Only Luke dates the preaching (the fifteenth year of Tiberius, with the rulers of the day, [[Luke 3:1–2]]) and gives John’s counsel to the people, publicans and soldiers ([[Luke 3:10–14]]) and the people’s musing whether he was the Christ ([[Luke 3:15]]).'
  - 'Matthew and Mark describe John’s clothing and food ([[Matt. 3:4]]; [[Mark 1:6]]); Luke and John do not.'
  - 'Mark has no “and with fire” ([[Mark 1:8]]); Matthew and Luke have it ([[Matt. 3:11]]; [[Luke 3:16]]). Mark and Luke have “stoop down and unloose” or “unloose” the latchet; Matthew has “bear” the shoes ([[Mark 1:7]]; [[Luke 3:16]]; [[Matt. 3:11]]).'
  - 'Only John has the delegation of priests and Levites, John’s denial that he is the Christ, Elias or “that prophet,” and the place, Bethabara ([[John 1:19–28]]).'
findings:
  - claim: 'John’s title means “the one immersing”; he was of Aaron’s line through both parents and inherited the right to the Aaronic Priesthood'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'John, who was given the appropriate title “‘Baptist’ (Baptistēs) or ‘the Baptizer’ (o Baptizōn, ‘the one immersing’).” John was the son of Zacharias and Elizabeth, who were both of the priestly lineage of Aaron'
    by: matthew 3
  - claim: 'Latter-day Saints hold that baptism was not a new rite introduced by John'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'Latter-day Saints believe that baptism “was not a new rite introduced by John the Baptist and adopted by Christ and his followers.”'
    by: matthew 3
  - claim: 'How John’s baptism differed from Jewish washings: once only, for repentance, administered by John rather than self-immersion'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'John’s baptism was a onetime event. Most of the Jewish washings were a ceremonial purification rite that would be performed when needed throughout one’s lifetime. … John held priesthood keys and personally administered his baptism, whereas Jewish proselyte baptism and other purification baths or washings were a self-immersion'
    by: matthew 3
  - claim: 'Joseph Smith: John held the Aaronic Priesthood and was a legal administrator and forerunner'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: '“John [the Baptist] held the Aaronic Priesthood, and was a legal administrator, and the forerunner of Christ, and came to prepare the way before him.”'
    by: matthew 3
  - claim: 'Joseph Smith on “at hand”: the kingdom could be no nearer than in John’s hands'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'But, says one, the kingdom of God could not be set up in the days of John, for John said the kingdom was at hand. But I would ask if it could be any nearer to them than to be in the hands of John.'
    by: matthew 3
  - claim: 'Joseph Smith: baptism of water without that of fire and the Holy Ghost is of no use'
    key: tpjs-2007-ch-7
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-7?lang=eng'
    quote: '“The baptism of water, without the baptism of fire and the Holy Ghost attending it, is of no use; they are necessarily and inseparably connected.”'
    by: matthew 3
  - claim: 'Bible Dictionary: “kingdom of heaven” in Matt. 3:2 means the Church'
    key: bd-kingdom-of-heaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kingdom-of-heaven?lang=eng'
    quote: 'kingdom of heaven is sometimes used in scripture to mean the Church (as in Matt. 3:2; 4:17; 13; and 25:1–13)'
    by: matthew 3
  - claim: 'Isaiah 40:3 announced Jehovah’s return; Mark’s opening casts John as the messenger and Jesus as Jehovah'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Second, he casts Jesus in the role of Jehovah; it is Jesus’s way and Jesus’s path that needs to be prepared and made straight by the Jews. He is the Lord whose arrival is imminent.'
    by: matthew 3
  - claim: 'Mark 1:2 draws on Exodus 23:20 and Malachi 3:1 as well as Isaiah 40:3'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Exodus 23:20 re-enforces for Israel that they are the people of Jehovah, who has sent his “messenger” to lead them. As long as Israel hearkens to this “messenger,” they will be safe. Malachi 3:1 is likely a paraphrase of Exodus 23:20'
    by: matthew 3
  - claim: 'Ellicott: John probably adopted his dress deliberately to recall Elijah (2 Kings 1:8); the rough garment still marked a prophet at a later period (Zech. 13:4), in contrast with the “gorgeous apparel” of Herod’s court (Luke 7:25)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'The dress was probably deliberately adopted by the Baptist as reviving the outward appearance of Elijah, who was “a hairy man, and girt with a girdle of leather” (2Kings 1:8); and the “rough garment,” that had been characteristic of the prophet’s life even at a later period (Zechariah 13:4)'
    by: matthew 3
  - claim: 'Ellicott: the boast “We have Abraham to our father” seems to have been common (John 8:33–39), tied to the belief that descent from Abraham ensured admission into Paradise'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'The boast seems to have been common, as in John 8:33-39, and was connected with the belief that this alone, or taken together with the confession of the creed of Israel … would be enough to ensure for every Jew an admission into Paradise.'
    by: matthew 3
  - claim: 'JST Matt. 3:36: “we only have power to bring seed unto our father Abraham”; God can make covenant people of those not of Israel'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'Those who rejected the message of John the Baptist rejected Christ. God can make covenant people of those not of Israel.'
    by: matthew 3
  - claim: 'JST Matt. 3:38: “whose place I am not able to fill”; John baptizes beforehand so the coming one may baptize with the Holy Ghost and fire'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'whose shoes I am not worthy to bear, (or whose place I am not able to fill,) as I said, I indeed baptize you before he cometh, that when he cometh he may baptize you with the Holy Ghost and fire.'
    by: matthew 3
  - claim: 'Bible Dictionary: Elias as the title of a forerunner, used of John (JST John 1:20–28)'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'Elias is also a title for one who is a forerunner; for example, John the Baptist, as in JST Matt. 11:13–15, JST Matt. 17:10–14, and JST John 1:20–28 (Appendix).'
    by: matthew 3
  - claim: 'Ellicott: the threshing-floor scene and the winnowing fan'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'the large winnowing fan driving on them the full force of the strong current of air, leaving the wheat in the middle, while the chaff is driven to the outskirts of the field to be afterwards swept up and burnt.'
    by: matthew 3
  - claim: 'Brown: Luke quotes Isaiah 40:3–5 where Matthew and Mark quote 40:3; “all flesh” underscores the gospel’s universality'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Luke’s quotation of these verses goes beyond the other Gospels’ quotation of a single verse (only Isa. 40:3 in Matt. 3:3 and Mark 1:3). Of course, the fact that Isaiah 40:5 ends in “all flesh shall see the salvation of God” underscores Luke’s interest in the universality of the gospel message.'
    by: luke 3
  - claim: 'JST Luke 3:4–11 expands the Isaiah quotation into the Messiah’s mission to Israel and the Gentiles and His coming in judgment'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'Christ will come as prophesied to bring salvation to Israel and to the Gentiles. In the fulness of times, He will come again to judge the world.'
    by: luke 3
  - claim: 'Annas (AD 6–15) and Caiaphas (AD 18–36); a deposed high priest kept the title by courtesy (useful for John 18:13)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Annas, who serves from AD 6 to 15, remains an influential figure after his deposition, seeing several of his sons and sons-in-law serve as high priest. Caiaphas holds the position from AD 18 to 36'
    by: luke 3
  - claim: 'D&C 84:28: John ordained at eight days old to overthrow the kingdom of the Jews (why the word came to him, not the high priests)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'was ordained by the angel of God at the time he was eight days old unto this power, to overthrow the kingdom of the Jews, and to make straight the way of the Lord before the face of his people'
    by: luke 3
  - claim: 'Joseph Smith: John wrested the keys from the Jews'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'The son of Zacharias wrested the keys, the kingdom, the power, the glory from the Jews, by the holy anointing and decree of heaven'
    by: luke 3
  - claim: 'JST Luke 3:19–20: the treasury custom for the poor, and the publicans'
    key: jst-luke-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
    quote: 'And after this manner did the publicans also, wherefore John said unto them, Exact no more than that which is appointed you.'
    by: luke 3
  - claim: 'Publicans: detested, a Jew who did the work excommunicated; many in Galilee in Herod’s service'
    key: bd-publicans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/publicans?lang=eng'
    quote: 'Both classes were detested by the Jews, and any Jew who undertook the work was excommunicated. Many of the tax-gatherers in Galilee would be in the service of Herod and not of Rome.'
    by: luke 3
  - claim: 'Brown: the soldiers of Luke 3:14 were probably Gentile auxiliaries, Jews being exempt'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'Presumably, these soldiers are Samaritans or, more probably, auxiliaries raised from the Greek cities of Sebaste in Samaria and Caesarea on the Mediterranean coast. From the time of Julius Caesar, Jewish men have been regularly exempted from recruitment into Roman military service.'
    by: luke 3
  - claim: 'Thayer: sykophanteō in Luke 3:14 is to extort'
    key: thayer
    url: 'https://biblehub.com/greek/4811.htm'
    quote: '2. to exact money wrongfully; to extort from, defraud: Luke 3:14 (here R. V. margin accuse wrongfully)'
    by: luke 3
  - claim: 'Judd: the site of Bethabara is uncertain, but Lehi’s prophecy (1 Ne. 10:9) confirms John 1:28; the earliest surviving manuscripts read “Bethany,” while Origen and Chrysostom claimed most early manuscripts read “Bethabara”'
    key: judd-nephi-vision
    url: 'https://rsc.byu.edu/things-which-my-father-saw/what-nephis-vision-teaches-about-bible-book-mormon'
    quote: 'Even though it is uncertain precisely where the ancient site of Bethabara is located today, Lehi’s prophecy nonetheless confirms the location mentioned in John 1:28.'
    by: john 1
  - claim: 'Ellicott: the delegation of John 1:19 was an official inquiry sent by the Sanhedrin; judging a false prophet belonged to the great council'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/1.htm'
    quote: 'Emphasis is laid upon the fact that the work of John had excited so much attention that the Sanhedrin sent from Jerusalem to make an official inquiry.'
    by: john 1
  - claim: 'JST John 1:22, 28: John is not “that Elias who was to restore all things”; Jesus is “that prophet, even Elias”'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'He it is of whom I bear record. He is that prophet, even Elias, who, coming after me, is preferred before me'
    by: john 1
open:
  - 'Why does Mark begin “The beginning of the gospel” and set Malachi 3:1 beside Isaiah 40:3 ([[Mark 1:1–3]])? Frederick’s paragraphs on Mark 1:2–3 are the place to start.'
  - 'The Joseph Smith Translation of Luke 3:4–11 (appendix) expands the Isaiah quotation; and JST John 1:20–28 has John deny being “that Elias who was to restore all things.”'
  - 'Who were the priests and Levites sent to John, and where was Bethabara ([[John 1:19–28]]; Lehi names it in [[1 Ne. 10:9]])?'
