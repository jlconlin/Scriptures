story: mary-magdalene-and-the-women-see-the-risen-lord
differences:
  - 'Matthew has Jesus meet the women together on the road, and they hold Him by the feet and worship Him ([[Matt. 28:9–10]]); John has Jesus appear to Mary Magdalene alone at the tomb, and say “Touch me not; for I am not yet ascended to my Father” ([[John 20:14–17]]); Mark says only that He “appeared first to Mary Magdalene” ([[Mark 16:9]]).'
  - 'In Matthew Jesus sends the women to “my brethren” to go to Galilee ([[Matt. 28:10]]); in John He sends Mary to “my brethren” with “I ascend unto my Father, and your Father” ([[John 20:17]]).'
findings:
  - claim: 'The women’s testimony is confirmed by seeing, hearing and touching; apangellō here means a solemn proclamation'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'are confirmed when they see, hear, and touch Jesus, holding him by his feet and worshipping him. With this sure testimony they become powerful witnesses; although the KJV renders the verb as “bring word” or “go tell,” … in this context it clearly means to make a solemn or authoritative proclamation.'
    by: matthew 28
  - claim: 'Holding His feet shows physical reality and affection; worship shows His status'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'The reference to the women holding Jesus’s feet conveys both the physical reality of the Resurrection as well as their human affection for him. Perhaps most significant in the story of Jesus’s appearance to the women is the note that they worshipped him'
    by: matthew 28
  - claim: 'Mary Magdalene was the first mortal to see a resurrected soul'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'To a woman, to Mary of Magdala, was given the honor of being the first among mortals to behold a resurrected Soul, and that Soul, the Lord Jesus.'
    by: matthew 28
  - claim: 'Talmage: Christ probably ascended to the Father between Mary’s attempt to touch Him and the women’s holding His feet'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'It appears reasonable and probable that between Mary’s impulsive attempt to touch the Lord, and the action of the other women who held Him by the feet as they bowed in worshipful reverence, Christ did ascend to the Father'
    by: matthew 28
  - claim: 'The message to “my brethren” included Peter and must have given him hope'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'the Lord sent greetings to the apostles, whom for the first time He designated as His brethren, and from this honorable and affectionate characterization Peter had not been excluded'
    by: matthew 28
  - claim: 'In John, adelphous is likely gender-inclusive, and Mary’s proclamation earned her the title “apostle to the apostles”'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'The use again of this technical term for proclaim, together with the eyewitness testimony, earned Mary the traditional title “apostle to the apostles” (Latin, apostolorum apostola).'
    by: matthew 28
  - claim: 'Mark’s “out of whom he had cast seven devils” comes from Luke 8:2'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/16.htm'
    quote: 'note that St. Mark’s account of her as one from whom Jesus “had cast out seven devils” is not from St. John, but from Luke 8:2.'
    by: mark 16
  - claim: 'Talmage: healed of physical and mental maladies; no warrant for calling her unchaste'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'had been healed through the ministrations of Jesus from both physical and mental maladies, the latter having been associated with possession by evil spirits. Out of her we are told Christ had cast seven devils, but even such grievous affliction affords no warrant for the assertion that the woman was unvirtuous or unchaste.'
    by: mark 16
  - claim: 'John 20:17: the present imperative mē mou haptou asks Mary to stop an action already begun (“Stop clinging to me”); compare JST “Hold me not”'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'This is the actual meaning of the Greek, with a present imperative form (mē mou haptou) suggesting that he is asking her to stop an action that she has already begun (contrast with the KJV “Touch me not,” but compare with the JST “Hold me not”).'
    by: john 20
  - claim: 'Pierce: the JST clarifies that the word means clinging, not just touching'
    key: pierce-recognizing-christ
    url: 'https://rsc.byu.edu/he-was-seen/seeing-knowing-recognizing-true-identity-christ'
    quote: 'with the Joseph Smith Translation altering the verse to “hold me not,” clarifying that the Greek word referred not just to touching but the more powerful clinging, grasping, gripping, or clutching (John 20:17).'
    by: john 20
  - claim: 'Why Mary took Jesus for the gardener: early light, tears, or a motif of the risen body not at first recognized'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Mary does not at first recognize Jesus, mistaking him for the gardener (John 20:15), perhaps because of the early light or her own tear-filled eyes.'
    by: john 20
open:
  - 'Why did Mary not recognize Jesus at first, taking Him for the gardener ([[John 20:14–15]])? Huntsman and Hatch, “Easter Sunday,” [57].'
  - 'What does “Touch me not” mean (the Joseph Smith Translation reads “Hold me not,” [[John 20:17]] footnote)? Talmage, chapter 37, [9], [11] is a start; the John writer should read more.'
  - 'Why does Mark’s longer ending add “out of whom he had cast seven devils” ([[Mark 16:9]])?'
