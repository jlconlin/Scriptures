  - 'Is Mark 16:14–20 part of Mark’s original Gospel? (Huntsman and Hatch, “Easter Sunday,” [28].)'
  - 'Why does Luke end in the temple ([[Luke 24:53]]), and how does the ascension in Luke 24 relate to the forty days of [[Acts 1:3–12]]?'
