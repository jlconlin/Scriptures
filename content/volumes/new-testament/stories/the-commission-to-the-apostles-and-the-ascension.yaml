story: the-commission-to-the-apostles-and-the-ascension
differences:
  - 'Matthew sets the commission on “a mountain” in Galilee ([[Matt. 28:16]]) and tells no ascension; Mark has Jesus appear to the eleven “as they sat at meat,” upbraid their unbelief, and be “received up into heaven” ([[Mark 16:14–19]]); Luke has Him bless them near Bethany and be “carried up into heaven” ([[Luke 24:50–51]]).'
  - 'Matthew: “teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost” ([[Matt. 28:19]]); Mark: “preach the gospel to every creature. He that believeth and is baptized shall be saved” and the signs that follow ([[Mark 16:15–18]]).'
  - 'Only Matthew has “but some doubted” ([[Matt. 28:17]]), “All power is given unto me” ([[Matt. 28:18]]) and “I am with you alway” ([[Matt. 28:20]]).'
findings:
  - claim: 'Matthew says nothing of the ascension; he ends with Christ ever with us'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Like John, Matthew ends his Gospel by saying nothing about the ascension. He goes one step further than John, however, by showing that “for those of us who believe in him, keep his commandments, and trust in his promises, he is ever with us.”'
    by: matthew 28
  - claim: '28:20 forms an inclusio with Emmanuel (1:23)'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'After introducing this name in the first chapter, Matthew forms an inclusio, or literary bookend, with the final verse in the Gospel'
    by: matthew 28
  - claim: 'Smith: “I with you am” word order; echo of the Septuagint of Exodus 3:14'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Yet the word order is skewed so that the text in Matthew reads literally “I with you am,” emphasizing verbally the embeddedness of God with the people.'
    by: matthew 28
  - claim: 'The commission to all nations is unique to Matthew and contrasts with Matthew 10:6'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'The corresponding bookend that is unique to Matthew’s Gospel is Jesus’ commission to the disciples before His Ascension. … This passage is in stark contrast to Jesus’ command to the Apostles to go to “the lost sheep of the house of Israel” (Matthew 10:6).'
    by: matthew 28
  - claim: '“Some doubted” may imply others present; perhaps the five hundred'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'The record adds “but some doubted,” by which may be implied that others beside the apostles were present, among whom were some who were unconvinced of the actual corporeity of the resurrected Christ. This occasion may have been that of which Paul wrote'
    by: matthew 28
  - claim: '“All power is given unto me” affirms His Godship and the authority of those He commissions'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'This could be understood as nothing less than an affirmation of His absolute Godship. His authority was supreme, and those who were commissioned of Him were to minister in His name, and by a power such as no man could give or take away.'
    by: matthew 28
  - claim: 'distazō: to doubt, waver (Matthew 14:31; 28:17)'
    key: thayer
    url: 'https://biblehub.com/greek/1365.htm'
    quote: 'διστάζω: 1 aorist ἐδίστασα (δίς); to doubt, waver: Matthew 14:31; Matthew 28:17.'
    by: matthew 28
  - claim: 'Talmage on the ascension from near Bethany'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'When Christ and the disciples had gone “as far as to Bethany,” the Lord lifted up His hands, and blessed them; and while yet He spake, He rose from their midst, and they looked upon Him as He ascended until a cloud received Him out of their sight.'
    by: matthew 28
open:
