story: the-twelve-sent-out
differences:
  - 'Matthew opens the story with the summary of 9:35 (repeating 4:23), the compassion for the crowds as sheep without a shepherd, and the prayer for labourers ([[Matt. 9:35–38]]); Mark has the sheep saying at the feeding of the five thousand ([[Mark 6:34]]); Luke has the harvest saying at the sending of the seventy ([[Luke 10:2]]).'
  - 'Mark and Luke tell the Twelve’s return and report ([[Mark 6:30]]; [[Luke 9:10]]); Matthew does not.'
  - 'Only Mark says they were sent “two and two” ([[Mark 6:7]]), and that they “anointed with oil many that were sick” ([[Mark 6:13]]).'
  - 'Matthew forbids “shoes” and “staves” ([[Matt. 10:10]]); Mark allows “a staff only” and says “be shod with sandals” ([[Mark 6:8–9]]).'
  - 'Only Matthew limits the mission to Israel, “Go not into the way of the Gentiles … but go rather to the lost sheep of the house of Israel” ([[Matt. 10:5–6]]), and only Matthew lets the dust be shaken off against a house as well as a city ([[Matt. 10:14]]).'
  - 'Matthew alone joins to the charge the warnings of persecution, the sparrows, the sword and the cross, and the reward of those who receive the disciples ([[Matt. 10:16–42]]); Mark and Luke have many of these sayings elsewhere (for example [[Mark 13:9–13]]; [[Luke 12:2–9]]; [[Luke 12:51–53]]; [[Luke 14:26–27]]).'
findings:
  - claim: '9:35 repeats 4:23 as bookends around the Sermon and the miracles'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew uses these parallel verses to prompt the reader to recognize that all of the material between them belongs to the same literary unit.'
    by: matthew 9
  - claim: 'Sheep without a shepherd: Numbers 27:16–17 and Joshua; Ezekiel 34’s Davidic shepherd read by Latter-day Saints as Jesus'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'They foretell that Jesus, as the “son [or descendant] of David,” will gather the flock of covenant Israel and reign with justice as King of kings.'
    by: matthew 9
  - claim: '“Fainted” (Matt. 9:36): the better-attested reading means harassed'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'They were not merely as sheep that have grown weary and faint, hungry, looking up and yet not fed, but were as those that have been harassed by the wolf—the prey of thieves and robbers.'
    by: matthew 9
  - claim: 'The Lord of the harvest is the Father, about to send labourers through Him; the disciples the right agents if they pray to be made so'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: '(38) The Lord of the harvest—i.e., the Father who had sent Him to be the Sower of the divine seed, and who, through Him, was about to send forth the labourers.'
    by: matthew 9
  - claim: 'Matthew 10 is the second of Matthew’s five discourses, the Apostolic Commission'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'we find him delineating five major discourses by the Savior: the Sermon on the Mount (Matthew 5–7), the Apostolic Commission (Matthew 10)'
    by: matthew 10
  - claim: 'After the second rejection at Nazareth Jesus began His third tour of Galilee; the apostles had been His pupils for many months'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Leaving Nazareth, He entered upon His third tour of the Galilean towns and villages, preaching and teaching as He went.'
    by: matthew 10
  - claim: 'Some instructions were for the first mission, others for the ministry after the Ascension'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Some of the instructions given them on this occasion had particular reference to their first mission, from which they would in due time return and report; other directions and admonitions were to be of effect throughout their ministry, even after the Lord’s ascension.'
    by: matthew 10
  - claim: 'The restriction to Israel was temporary; later they preached to all nations'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'This was a temporary restriction, imposed in wisdom and prudence; later, as we shall see, they were directed to preach among all nations, with the world for their field.'
    by: matthew 10
  - claim: 'The people were proved by their welcome; the apostles learned to rely on God; money and extra clothing left behind'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'the people were to be proved as to their willingness to receive and assist those who came in the name of the Lord; and the apostles themselves were to learn to rely upon a Provider more to be trusted than man'
    by: matthew 10
  - claim: 'Mark’s “staff only” and sandals reconciled with Matthew: no second staff or spare shoes'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'They were to have none of the reserved comforts of common travellers, no second staff in case the first should break, no second pair of shoes in which to rest the worn and weary feet.'
    by: matthew 10
  - claim: 'Travelling without provision made the missionary dependent on the hospitality of strangers'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Thus the missionary was entirely dependent upon the hospitality of strangers for sustenance.'
    by: matthew 10
  - claim: 'The dust rite reverses foot washing; dexomai is a hospitality term; Matthew alone has it against a house; unclear whether hospitality or the message is meant'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Unfortunately, even with the larger context of hospitality, it is unclear whether the rite was given in response to a lack of physical hospitality or to rejection of the message.'
    by: matthew 10
  - claim: 'Sodom’s destruction was explained by hostility to Lot’s guests (Ezek. 16:49)'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'the destruction of these two cities was explained in later literature as the result of their hostility instead of hospitality toward Lot’s guests (see Ezekiel 16:49).'
    by: matthew 10
  - claim: 'Acts 13:50–51 is the only New Testament account of the rite performed'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Acts 13:50–51 is the only descriptive text that we have for our rite in the canon.'
    by: matthew 10
  - claim: 'D&C 84:77–78 gives the same charge to latter-day elders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'that ye become even as my friends in days when I was with them, traveling to preach the gospel in my power;'
    by: matthew 10
  - claim: 'Mark’s staff and sandals against Matthew’s and Luke’s staves: same word for staff, different for footwear; one of the few outright contradictions'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'This is one of the few outright contradictions between the synoptic Gospels; most of the variation has to do with omissions or matters of emphasis.'
    by: mark 6
  - claim: 'Only Mark mentions anointing with oil; James 5:14 shows it later in use; an outward sign and help to faith'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'St. Mark is the only Evangelist who mentions this as the common practice of the disciples, but we learn from James 5:14 that it was afterwards in use'
    by: mark 6
open:
  - 'Why does Mark say they went “two and two” ([[Mark 6:7]]), and what was the anointing with oil ([[Mark 6:13]])?'
  - 'What did the Twelve report on their return ([[Mark 6:30]]; [[Luke 9:10]]), and why does Jesus then take them apart to rest?'
  - 'How does Luke’s sending of the Seventy ([[Luke 10:1–16]]) relate to the sending of the Twelve?'
