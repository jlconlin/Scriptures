story: gethsemane
differences:
  - 'Only Matthew and Mark name Gethsemane; John calls it a garden over the brook Cedron ([[John 18:1]]); Luke says the Mount of Olives ([[Luke 22:39]]).'
  - 'Matthew and Mark have three prayers and three returns to the sleeping disciples; Luke one, and he says they slept “for sorrow” ([[Luke 22:45]]).'
  - 'Only Luke has the angel strengthening Him and the sweat “as it were great drops of blood” ([[Luke 22:43–44]]); some early manuscripts lack the two verses (Huntsman and Hatch, “Thursday,” para. 303).'
  - 'Mark has “Abba, Father” ([[Mark 14:36]]); Matthew “O my Father.”'
  - 'Matthew gives the second prayer in its own words, “if this cup may not pass away from me, except I drink it, thy will be done” ([[Matt. 26:42]]).'
findings:
  - claim: 'Gethsemane means oil-press, probably from a mill at the place'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Gethsemane.—The name means “oil-press” and probably has reference to a mill maintained at the place for the extraction of oil from the olives there cultivated.'
    by: matthew 26
  - claim: 'The Aramaic gat shemani; only Mark and Matthew name it'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Only Mark and Matthew call it “Gethsemane” (from Aramaic gat šəmānî; literally, the place “of the oil press”)'
    by: matthew 26
  - claim: 'The weight of sins pressed blood from every pore, as a press crushes olives'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'In Gethsemane the weight of our sins, sorrows, nd infirmities bore down on Jesus, crushing Him and literally pressing blood from every pore'
    by: matthew 26
  - claim: 'Eight apostles were left near the entrance'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Eight of the apostles He left at or near the entrance'
    by: matthew 26
  - claim: 'He did not suffer through fear of death'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'The thought that He suffered through fear of death is untenable.'
    by: matthew 26
  - claim: 'A spiritual agony only God could experience'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'It was not physical pain, nor mental anguish alone, that caused Him to suffer such torture as to produce an extrusion of blood from every pore; but a spiritual agony of soul such as only God was capable of experiencing.'
    by: matthew 26
  - claim: 'He took upon Himself the sins of mankind from Adam to the end'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'In some manner, actual and terribly real though to man incomprehensible, the Savior took upon Himself the burden of the sins of mankind from Adam to the end of the world.'
    by: matthew 26
  - claim: 'The request was always conditional on the Father’s will'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'the request, however oft repeated, was always conditional; the accomplishment of the Father’s will was never lost sight of as the object of the Son’s supreme desire.'
    by: matthew 26
  - claim: 'Restoration scripture is the basis of the teaching that atoning suffering began in the garden'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'these passages serve as the foundation of the Latter-day Saint understanding that Jesus’s atoning suffering for sin began in that garden as well.'
    by: matthew 26
  - claim: 'Church leaders have taught the importance of both Gethsemane and the cross'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Nevertheless, the teaching of leaders of The Church of Jesus Christ of Latter-day Saints have regularly taught the importance of both.'
    by: matthew 26
  - claim: 'As at the Transfiguration, the three slept'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'As on the Mount of Transfiguration, when the Lord appeared in glory, so now in the hour of His deepest humiliation, these three slumbered.'
    by: matthew 26
  - claim: 'The warning was against deserting Him in that hour'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'may have been prompted by the exigencies of the hour, under which, if left to themselves, they would be tempted to prematurely desert their Lord.'
    by: matthew 26
  - claim: 'Peirasmos means any test or trial'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the term actually means any kind of test or trial, which can mean tribulations as well as temptations to sin.'
    by: matthew 26
  - claim: 'Gethsemane, then the cross, on the model of a sacrifice led to the altar'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'His arrest and being taken to the Jewish leaders and then Pilate were steps along the way as he, the sacrificial victim, was led to the cross, where he suffered and died.'
    by: matthew 26
