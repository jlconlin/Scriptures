story: his-death-foretold-a-third-time-the-request-of-james-and-john
differences:
  - 'Only Mark says Jesus “went before them: and they were amazed; and as they followed, they were afraid” ([[Mark 10:32]]).'
  - 'Matthew alone names the manner of death, “to crucify him” ([[Matt. 20:19]]); Mark has “kill him” ([[Mark 10:34]]); Luke “put him to death” ([[Luke 18:33]]).'
  - 'Mark and Luke add the spitting ([[Mark 10:34]]; [[Luke 18:32]]); Luke adds “all things that are written by the prophets concerning the Son of man shall be accomplished” ([[Luke 18:31]]) and that “they understood none of these things” ([[Luke 18:34]]).'
  - 'Luke has no request of James and John here.'
  - 'In Matthew “the mother of Zebedee’s children” comes with her sons and asks, worshipping Him ([[Matt. 20:20–21]]); in Mark James and John ask for themselves ([[Mark 10:35–37]]). Jesus answers the sons in both.'
  - 'Matthew has “in thy kingdom” ([[Matt. 20:21]]); Mark “in thy glory” ([[Mark 10:37]]).'
  - 'Matthew has “prepared of my Father” ([[Matt. 20:23]]); Mark “for whom it is prepared” without naming the Father ([[Mark 10:40]]).'
  - 'Mark has “servant of all” ([[Mark 10:44]]); Matthew “your servant” ([[Matt. 20:27]]).'
findings:
  - claim: 'The third prediction, spoken in absolute plainness; Matthew alone names crucifixion by the Gentiles; the disciples did not understand'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'According to Matthew’s account, they were told of the very manner by which the Lord should die—that the Gentiles should crucify Him; yet they understood not.'
    by: matthew 20
  - claim: 'The disciples may have expected His enthronement as King'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'this they may have vaguely conceived to be the crisis for which they had been waiting, the open proclamation of His Messianic dignity, His enthronement as Lord and King.'
    by: matthew 20
  - claim: 'The mocking, spitting, scourging and crucifixion are new elements beside the earlier predictions'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'The mocking, the spitting (Mark 10:34), the scourging, the crucifixion, all these are new elements in the prediction, as if what had before been presented in dim outline to the disciples was now brought vividly'
    by: matthew 20
  - claim: 'The mother is generally understood to be Salome (Mark 15:40; Matt. 27:56); her being Mary’s sister is neither disproved nor affirmed'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'While the scriptural record does not disprove this alleged kinship, it certainly does not affirm the same.'
    by: matthew 20
  - claim: 'The petitioners were James and John, though in Matthew their mother asked first'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'The petitioners were James and John, though according to Matthew’s record their mother was the first to ask.'
    by: matthew 20
  - claim: 'The promise of thrones (Matt. 19:28) likely prompted the request; worshipping implied homage to a King'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'with the act of homage (“worshipping Him”) which implied that she was speaking to a King'
    by: matthew 20
  - claim: 'The cup a symbol of fortune (Ps. 23:5; Jer. 25:15); baptize = plunge; Luke 12:50 of His passion'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'any reader of the Old Testament would at once recognise it as the symbol of a good or evil fortune.'
    by: matthew 20
  - claim: 'Ellicott: the baptism clause is not in many of the best manuscripts of Matthew (not used in the Matthew note)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'are not found in many of the best MSS., and have probably been added to bring St. Matthew’s narrative into harmony with St. Mark’s'
    by: matthew 20
  - claim: '“Not mine to give”: the supplied words spoil the construction; He gives according to the Father’s will'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'Our Lord does not say that it does not belong to Him to give what the disciples asked, but that He could only give it according to His Father’s will and the laws which He had fixed.'
    by: matthew 20
  - claim: 'Fulfilment: James first of the Twelve to die (Acts 12:2); John a long old age'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'James was the first of the whole company of the Twelve to pass through the baptism of blood (Acts 12:2).'
    by: matthew 20
  - claim: 'The ten perhaps indignant because the two got in first'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'possibly less through disapproval of the spirit that had prompted the petition than because the two had forestalled the others in applying for the chief posts of distinction'
    by: matthew 20
  - claim: 'Diakonos used of those who advance others’ interests at their own cost (Matt. 20:26; Mark 10:43)'
    key: thayer
    url: 'https://biblehub.com/greek/1249.htm'
    quote: 'Mark 10:43 (in which passage it is used figuratively of those who advance others'' interests even at the sacrifice of their own)'
    by: matthew 20
  - claim: 'Lytron: ransom price; anti, in the place of; Matt. 20:28 and Mark 10:45'
    key: thayer
    url: 'https://biblehub.com/greek/3083.htm'
    quote: 'ἀντί πολλῶν, to liberate many from the misery and penalty of their sins, Matthew 20:28'
    by: matthew 20
  - claim: 'The ransom saying is the first distinct statement of His redemptive work; anti, instead of'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'It was, strictly speaking, a “ransom” instead of, in the place of, (ἀντὶ not ὑπὲρ) “many.”'
    by: matthew 20
  - claim: 'The third prediction the most explicit; each is followed by misunderstanding and corrective teaching'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'This third and final prediction is also the most explicit, adding details about the abuse, spitting, and scourging that Jesus will endure and making it clear that the purpose of his death was to be a ransom for us.'
    by: mark 10
  - claim: 'Amazed and afraid (Mark 10:32): the look, tone and silent withdrawal struck the disciples with fear'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'the look and tone which accompanied them—and the silent withdrawal from converse with them, struck all the disciples with a vague fear, and the Twelve with absolute terror.'
    by: mark 10
  - claim: 'Mark 10:32: the apostles amazed at His absorption and sadness, fell behind'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'so affected Jesus that even the apostles were amazed at His absorption and evident sadness; they fell behind in amazement and fear.'
    by: mark 10
open:
  - 'Why were the disciples “amazed” and “afraid” as Jesus went before them ([[Mark 10:32]])?'
  - 'What does Luke mean by “all things that are written by the prophets” being accomplished ([[Luke 18:31]]), and which prophecies?'
  - 'Why does Mark have the brothers ask “in thy glory” rather than “in thy kingdom” ([[Mark 10:37]])?'
  - 'Luke places a dispute over greatness at the Last Supper ([[Luke 22:24–27]]); is it the same teaching?'
