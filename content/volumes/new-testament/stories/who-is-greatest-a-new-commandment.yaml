story: who-is-greatest-a-new-commandment
differences:
  - 'Luke has a dispute among the Twelve at the supper over which of them should be accounted the greatest, and Jesus’s answer that He is among them “as he that serveth” ([[Luke 22:24–27]]); John has no dispute, but the washing of the disciples’ feet and “I have given you an example” ([[John 13:12–17]]), then the new commandment to love one another ([[John 13:34–35]]).'
  - 'Only Luke has the kings of the Gentiles “called benefactors” ([[Luke 22:25]]) and the promise of a kingdom, the table and thrones judging the twelve tribes ([[Luke 22:28–30]]).'
  - 'Matthew and Mark tell of a dispute over greatness on another occasion, after the request of James and John, ending with the Son of Man giving His life “a ransom for many” ([[Matt. 20:20–28]]; [[Mark 10:35–45]]).'
findings:
  - claim: 'Luke does not recount the foot washing but preserves its associated teaching'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'While Luke does not directly recount the foot washing, it does preserve the associated teaching'
    by: luke 22
  - claim: 'Luke 22:24–30 and 31–34 are the Synoptics’ few short parallels to John 13 at the supper'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Except for a few short parallels in Luke to material also found in John earlier during the Last Supper (cf. Luke 22:24‒30, 31‒34 with John 13:12‒20 and 36‒38)'
    by: luke 22
  - claim: 'The dispute at the supper is a separate occasion from Matthew 20 and Mark 10'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Although Matthew and Mark report a similar dispute arising on a different occasion (see Matt. 20:20–28; Mark 10:35–45), this one seems genuinely to belong to the Last Supper.'
    by: luke 22
  - claim: 'The settings are unlike, and Jesus’s final point differs'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'Additionally, Jesus’ final point to the Apostles differs in each instance.'
    by: luke 22
  - claim: 'Brown sees a possible echo of the foot washing in “he that serveth”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'It is also possible to see an echo of Jesus’ washing the feet of the Twelve (see John 13:4–12). More than that, his service finds its crowning moment not in waiting tables (see 12:37–38) but in his suffering, death, and resurrection, now only hours away.'
    by: luke 22
  - claim: 'Euergetēs was a title of honor conferred on princes'
    key: thayer
    url: 'https://biblehub.com/greek/2110.htm'
    quote: 'it was also a title of honor, conferred on such as had done their country service, and upon princes'
    by: luke 22
  - claim: 'The title was reserved for gods, royal persons and Caesars'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'In the Greco-Roman world, this title (Greek euergetēs) is reserved for gods, royal persons, and Caesars.'
    by: luke 22
  - claim: '“Appoint” (diatithēmi) assigns a kingdom as one’s possession'
    key: thayer
    url: 'https://biblehub.com/greek/1303.htm'
    quote: 'hence, to assign a thing to another as his possession: τίνι βασιλείαν (to appoint), Luke 22:29.'
    by: luke 22
  - claim: 'D&C 29:12: the Twelve of Jerusalem will judge the whole house of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'mine apostles, the Twelve which were with me in my ministry at Jerusalem, shall stand at my right hand at the day of my coming in a pillar of fire'
    by: luke 22
open:
  - 'What does the “new commandment” add to the law’s “love thy neighbour” ([[John 13:34]]; [[Lev. 19:18]])?'
  - 'Why does John set the washing of feet where the Synoptics set the bread and cup ([[John 13:1–17]])? Huntsman and Hatch, “Thursday,” para. 71, give two proposals.'
  - 'What did “I have given you an example” mean for the early Church’s practice of washing feet, and for its restoration in D&C 88:138–141?'
