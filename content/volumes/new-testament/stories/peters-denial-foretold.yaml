story: peters-denial-foretold
differences:
  - 'Matthew and Mark set the warning after the hymn, on the way to the Mount of Olives ([[Matt. 26:30–35]]; [[Mark 14:26–31]]); Luke and John at the supper ([[Luke 22:31–34]]; [[John 13:36–38]]).'
  - 'Only Mark has the cock crow twice ([[Mark 14:30]]).'
  - 'Only Luke has Satan’s desire to sift Peter as wheat, Jesus’s prayer for him, and “when thou art converted, strengthen thy brethren” ([[Luke 22:31–32]]).'
  - 'Matthew and Mark quote [[Zech. 13:7]] and give the promise of Galilee ([[Matt. 26:31–32]]; [[Mark 14:27–28]]).'
findings:
  - claim: 'The hymn was likely from the Egyptian Hallel, Psalms 113–118; 115–118 after the meal'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'likely from the “Egyptian Hallel,” which consists of Psalms 113‒18, which are songs of praise for God’s deliverance of Israel from Egypt. Psalms 113‒14 usually being chanted or sung before the meal, they may have sung Psalms 115‒18'
    by: matthew 26
  - claim: '“Offended” is literally “caused to stumble,” and can mean fall away'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'he uses a word (Greek, skandalithēsesthe; KJV, “shall be offended”) that literally means “caused to stumble” but can also mean to fall away or give up believing.'
    by: matthew 26
  - claim: 'Zechariah 13:7 used to anticipate the disciples’ flight at the arrest'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'using this prophecy about the sheep scattering after the shepherd had been struck to anticipate how the disciples would flee when Jesus was arrested in Gethsemane.'
    by: matthew 26
  - claim: 'Jesus softens the prophecy with the promise of Galilee, fulfilled after the Resurrection'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Jesus softens how they would fail to stand with him, however, by promising that he would go before them into Galilee, which is later realized when he appears to them there after his Resurrection.'
    by: matthew 26
  - claim: 'Some Latter-day Saints have read the words as a command, so that Peter could escape arrest and lead the Church'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Such commentators have suggested that Jesus had given such direction to Peter so that the Apostle, otherwise an ardent supporter and defender of his lord, could elude arrest and trial that terrible night, thereby surviving to lead the church.'
    by: matthew 26
  - claim: 'President Kimball’s talk does not contain the suggestion'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'there is nothing in the printed version or in the audio recording of the address corroborating this idea.'
    by: matthew 26
  - claim: 'The future is a predictive future: Jesus foresaw what Peter would do'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'The natural sense of the future here is a predicative future, meaning that Jesus was foreseeing or prophesying what Peter would do.'
    by: matthew 26
  - claim: 'Matthew 26:34 is unlikely to be a command'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'it is unlikely that “thou shalt deny” in Matthew 26:34 reflects a Matthean jussive future.'
    by: matthew 26
  - claim: 'Where a future is used as a command in the New Testament, it usually quotes or imitates Old Testament law'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Such a usage is rarer in the New Testament itself, but when it appears it is usually quoting the LXX or otherwise imitating the legal language of the Old Testament.'
    by: matthew 26
  - claim: 'A future used as a command is rare in New Testament Greek'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'such a use of a future as a command is rare in New Testament Greek.'
    by: matthew 26
  - claim: 'Matthew’s wording sharpens Peter’s confidence'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Matthew improves Mark’s Greek grammar and style, which in this passage not only results in smoother Greek (and English for that matter) but also emphasizes Peter’s confidence.'
    by: matthew 26
  - claim: 'The future tense in Greek, as in English, can be an imperative'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'noting that the future tense in Greek, as in English, can be used as an imperative.'
    by: matthew 26
  - claim: 'Luke and John use constructions that cannot be a command'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Although Luke and John use a similar looking form (Luke 22:34; John 13:38), they actually use constructions that require another verb form'
    by: matthew 26
  - claim: 'The context, tied to Zechariah 13:7, favors a prediction'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'the immediate context of Jesus’ pronouncement in even these accounts also favors a prediction over a command. This is because in those two Gospels it is preceded by Jesus’ statement that “All ye shall be offended because of me this night”'
    by: matthew 26
  - claim: 'The attribution to President Kimball is anecdotal'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Although anecdotal evidence exists that President Kimball actually made this suggestion in his 1971 talk'
    by: matthew 26
  - claim: 'In Luke 22:31 “you” is plural: Satan asks to test all the Apostles, as he did Job'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-22-104'
    quote: 'The expression carries the sense that Satan asks permission from God to test not only Simon Peter but also the other Apostles, as the plural pronoun shows'
    by: luke 22
  - claim: 'Epistrepsas (“converted”) means to turn back again'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'the Greek epistrepsas literally means “to turn back again” and is rendered by the New Jerusalem Bible as “once you have recovered.” This may have held out particular hope for Peter when his faith did fail'
    by: luke 22
  - claim: 'Elder Soares: the adversary desires to sift us'
    key: soares-we-can-win-2015
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/yes-we-can-and-will-win?lang=eng'
    quote: 'As the Savior Himself taught, the adversary desires to sift us as wheat, causing us to lose our ability to influence the world for good.'
    by: luke 22
open:
  - 'What does “sift you as wheat” mean ([[Luke 22:31]])?'
  - 'What does “converted” mean in [[Luke 22:32]]? KnoWhy #673 says the word literally means “to turn back again.”'
  - 'Why does Mark have the cock crow twice ([[Mark 14:30]]; [[Mark 14:72]])?'
