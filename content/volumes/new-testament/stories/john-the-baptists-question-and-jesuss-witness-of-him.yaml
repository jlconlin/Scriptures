story: john-the-baptists-question-and-jesuss-witness-of-him
differences:
  - 'Only Luke says that in that same hour Jesus cured many of their infirmities and gave sight to many that were blind before answering ([[Luke 7:21]]).'
  - 'Only Luke has the aside that the people and the publicans “justified God, being baptized with the baptism of John,” while the Pharisees and lawyers “rejected the counsel of God against themselves” ([[Luke 7:29–30]]).'
  - 'Only Matthew has “the kingdom of heaven suffereth violence,” “all the prophets and the law prophesied until John,” and “this is Elias, which was for to come” here ([[Matt. 11:12–15]]); Luke has a related saying in another setting ([[Luke 16:16]]).'
  - 'Matthew: “there hath not risen a greater than John the Baptist” ([[Matt. 11:11]]); Luke: “there is not a greater prophet than John the Baptist” ([[Luke 7:28]]).'
  - 'Matthew: “wisdom is justified of her children” ([[Matt. 11:19]]); Luke: “of all her children” ([[Luke 7:35]]).'
  - 'Matthew follows the tribute directly with the woes on Chorazin, Bethsaida and Capernaum ([[Matt. 11:20–24]]); Luke puts the woes in the charge to the Seventy ([[Luke 10:13–15]]).'
findings:
  - claim: 'The Gospels do not name John’s prison; Josephus places him at Machaerus, east of the Dead Sea'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'The four Gospel accounts do not identify where John was imprisoned; however, Josephus does (Flavius Josephus, Antiquities of the Jews, 18.5.1–2).'
    by: matthew 11
  - claim: 'John probably spent a year or more in prison'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'Quite possibly John was placed in prison sometime near the end of the first year of Jesus’s ministry and probably remained in prison for at least a year, maybe a little longer.'
    by: matthew 11
  - claim: 'Benson and Matthews: the question tested the two disciples’ testimony, not John’s'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'It was not John’s testimony that was in question but the testimony of these two disciples.'
    by: matthew 11
  - claim: 'Talmage: the raising at Nain prompted the message (Luke’s order)'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Particularly was he informed of the miraculous raising of the young man at Nain; and forthwith he commissioned two of his disciples to bear a message of inquiry to Jesus.'
    by: matthew 11
  - claim: 'Talmage: the message was more a reminder than doubt, largely meant to confirm the disciples’ faith; John may have grown despondent'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'his message was rather a reminder than a plain inquiry based on actual doubt. Indeed, we have good grounds for inference that John’s purpose in sending disciples to inquire of Christ was partly, and perhaps largely, designed to confirm in those disciples an abiding faith in the Christ.'
    by: matthew 11
  - claim: 'Talmage: “blessed is he … not offended” was a gentle rebuke of John’s incomplete understanding; misunderstanding leads to offense'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'a further though yet gentle rebuke of the Baptist’s defective comprehension of the Messiah’s mission.'
    by: matthew 11
  - claim: 'Joseph Smith on why John was the greatest: prepared the way, baptized the Son of Man, the only legal administrator holding the keys'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'John, at that time, was the only legal administrator in the affairs of the kingdom there was then on the earth, and holding the keys of power.'
    by: matthew 11
  - claim: 'Joseph Smith: “he that is least” is Jesus Himself'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'as though He had said—‘He that is considered the least among you is greater than John—that is I myself.’'
    by: matthew 11
  - claim: 'JST Matt. 11:13: the violent shall have no power'
    key: jst-matt-11
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/11?lang=eng'
    quote: 'But the days will come, when the violent shall have no power; for all the prophets and the law prophesied that it should be thus until John.'
    by: matthew 11
  - claim: 'Ellicott reads “suffereth violence” as the eager crowds pressing in (a reading the JST does not follow)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/11.htm'
    quote: 'The words describe the eager rush of the crowds of Galilee and Judæa, first to the preaching of the Baptist, and then to that of Jesus.'
    by: matthew 11
  - claim: 'Elias as a title for a forerunner; John the preparer, Jesus the restorer'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'Elias is also a title for one who is a forerunner; for example, John the Baptist, as in JST Matt. 11:13–15'
    by: matthew 11
  - claim: 'Talmage on the children in the marketplace: a mock wedding and a mock funeral'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Some wanted to enact the pageantry of a mock wedding, and though they piped the rest would not dance; then they changed to a funeral procession and essayed the part of mourners'
    by: matthew 11
  - claim: 'Ellicott: wisdom is vindicated by all who are her children'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/11.htm'
    quote: 'is evermore acquitted, justified, acknowledged as righteous, alike in her severer or more joyous forms, by all who are indeed her children'
    by: matthew 11
  - claim: 'Brown: because Jesus had sent angels to John in prison (JST Matt. 4:11), John was likely not seeking reassurance for himself'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'But because Jesus sends angels to minister to him weeks earlier (see JST Matt. 4:11), he is likely not seeking clarity and reassurance for himself about Jesus as “the coming one.”'
    by: luke 7
  - claim: 'Brown: “the one who comes” (ho erchomenos) hints at Malachi 3:1 and at the Messiah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'The expression “the one who comes,” as the Greek text reads (ho erchomenos), hints at the messenger of Malachi 3:1'
    by: luke 7
  - claim: 'Brown: Jesus offers John not deliverance but reassurance; His not rescuing John shows He is no military Messiah'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'But to the Baptist, he offers not deliverance but only reassurance.'
    by: luke 7
  - claim: 'Brown: John’s disciples arrive “in that same hour” as Jesus marshals His merciful powers (Luke 7:21)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'In the present scene, John’s disciples arrive at a fortuitous moment when Jesus is marshaling his merciful powers for the afflicted.'
    by: luke 7
  - claim: 'Ellicott: Luke 7:29–30 is Luke’s own interposed statement on the two classes'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/7.htm'
    quote: 'St. Luke interposing a statement, probably intended for his Gentile readers, as to the effect produced by the preaching of the Baptist on the two classes'
    by: luke 7
  - claim: 'Brown: dikaioō in Luke 7:35 means “to be accepted as just,” as in 7:29; “the counsel of God” as the plan of salvation'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-7-104'
    quote: 'One of the prominent meanings of the verb (Greek dikaioō) is “to be considered just” and, in this context, “to be accepted as just”61 (see the Notes on 7:29; 10:29; 18:14).'
    by: luke 7
open:
  - 'What does Luke’s “the law and the prophets were until John: since that time the kingdom of God is preached, and every man presseth into it” ([[Luke 16:16]]) mean beside Matthew 11:12–13 and its Joseph Smith Translation?'
