story: marriage-and-divorce
differences:
  - 'Only Matthew has “for every cause” in the Pharisees’ question ([[Matt. 19:3]]); Mark has “Is it lawful for a man to put away his wife?” ([[Mark 10:2]]).'
  - 'In Matthew the Pharisees say Moses “command[ed]” and Jesus answers that he “suffered” ([[Matt. 19:7–8]]); in Mark Jesus asks “What did Moses command you?” and they answer “Moses suffered” ([[Mark 10:3–4]]).'
  - 'Only Matthew has the exception “except it be for fornication” ([[Matt. 19:9]]).'
  - 'Mark sets the saying on remarriage “in the house,” privately to the disciples, and adds a woman who puts away her husband ([[Mark 10:10–12]]).'
  - 'Only Matthew has the disciples’ “it is not good to marry” and the saying on eunuchs ([[Matt. 19:10–12]]).'
  - 'Luke has no account of the debate; his only verse in the story is Jesus setting His face to go to Jerusalem ([[Luke 9:51]]).'
findings:
  - claim: '“Beyond Jordan” is Perea; Jesus was going by short stages toward Jerusalem; the Pharisees came to find grounds for accusation'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'While wending His way by short stages toward Jerusalem, and while still “beyond” or on “the farther side” of Jordan, and therefore in Perean territory, Jesus was met by a body of Pharisees'
    by: matthew 19
  - claim: 'Perea was part of Herod Antipas’s domain'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'soon in ordinary course He would leave Perea, which was part of Herod’s domain, and enter Judea'
    by: matthew 19
  - claim: 'The questioners may have hoped Jesus would denounce Herod Antipas’s marriage and draw Herodias’s fury'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The crafty questioners may have hoped that Jesus would denounce the adulterous state in which Herod Antipas was then living, and so bring upon Himself the fury of Herodias, to which the Baptist had already died a victim.'
    by: matthew 19
  - claim: 'The question falls within the Shammai–Hillel debate; the aim may have been to alienate followers who held the easier view'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Their question, “Is it lawful for a man to put away his wife for every cause?” falls clearly within the school of Shammai/school of Hillel debate. Their motivation may be to reveal to the “great multitudes” that Jesus holds a position close to that of the house of Shammai'
    by: matthew 19
  - claim: 'Jesus answers from Genesis 1–2 rather than from Deuteronomy 24:1'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Rather than engage Deuteronomy 24:1 directly, Jesus makes an argument based on Genesis 1–2, the origin of God’s instructions on marriage'
    by: matthew 19
  - claim: 'Hillel’s school allowed divorce for childlessness, argumentativeness, poor housekeeping'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'The school of Hillel, on the other hand, argued that such things as childlessness, argumentativeness, or even failure to properly keep house were grounds for divorce.'
    by: matthew 19
  - claim: 'On Mark’s order: Jesus made them cite the law; they had to admit Moses only suffered it, a reluctant concession'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'They had to confess that they were not dealing with a commandment of God but a practice that Moses reluctantly allowed because of the hardness of Israel’s heart.'
    by: matthew 19
  - claim: 'Draper reads Mark 10:10–12 as adultery against the former wife, since in God’s eyes the kinship remains'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'Indeed, as Mark 10:10–12 notes, any man who remarries after divorcing his wife commits adultery against his former wife.'
    by: matthew 19
  - claim: 'Moses had not commanded divorce; marriage bond paramount over parent–child; Jesus set no rule for legal divorces'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Jesus announced no specific or binding rule as to legal divorces; the putting away of a wife, as contemplated under the Mosaic custom, involved no judicial investigation or action by an established court.'
    by: matthew 19
  - claim: 'The Church’s present position on remarriage and temple recommends'
    key: oaks-divorce
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/04/divorce?lang=eng'
    quote: 'Because “of the hardness of [our] hearts,” the Lord does not currently enforce the consequences of the celestial standard. He permits divorced persons to marry again without the stain of immorality specified in the higher law.'
    by: matthew 19
  - claim: 'The eunuch saying is figurative, for voluntary celibacy; may describe the disciples who left family to follow Jesus'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'is best understood not as a literal reference to emasculation, but as a figurative reference to voluntary celibacy that uses the same kind of hyperbole Jesus employed'
    by: matthew 19
  - claim: 'Latter-day Saints understand marriage as divinely ordained and potentially eternal'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'We have come to understand marriage and family as divinely ordained, central to the developmental purposes of mortal life, and potentially eternal (Doctrine and Covenants 49:16–17; 131:1–4; 132:19).'
    by: matthew 19
open:
  - 'Why does Mark alone speak of a woman putting away her husband ([[Mark 10:12]]), and what did Jewish and Roman law of the day allow a wife?'
  - 'Why does Mark have no exception for fornication, and how do Latter-day Saint studies reconcile Mark’s absolute saying with Matthew’s?'
  - 'Mark says “as he was wont, he taught them again” ([[Mark 10:1]]): what did Jesus teach in Perea besides this?'
