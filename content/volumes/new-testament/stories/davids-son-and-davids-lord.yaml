story: davids-son-and-davids-lord
differences:
  - 'Matthew makes it a dialogue: Jesus asks the gathered Pharisees “What think ye of Christ? whose son is he?” and they answer “The Son of David” ([[Matt. 22:41–42]]); Mark and Luke have Jesus pose the question about what the scribes, or “they,” say ([[Mark 12:35]]; [[Luke 20:41]]).'
  - 'Matthew: David “in spirit” ([[Matt. 22:43]]); Mark: “by the Holy Ghost” ([[Mark 12:36]]); Luke: “in the book of Psalms” ([[Luke 20:42]]).'
  - 'Matthew ends with no one able to answer and none daring to ask more ([[Matt. 22:46]]); Mark with “the common people heard him gladly” ([[Mark 12:37]]); Luke goes straight on to the warning against the scribes ([[Luke 20:45–47]]).'
findings:
  - claim: 'Psalm 110 is traditionally attributed to David and classed as a royal psalm'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Traditionally attributed to David, many scholars classify this as one of the royal psalms that were sung at significant events in the reign of an anointed king.'
    by: matthew 22
  - claim: 'The Messiah was expected as a son of David who would restore Israel'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Contemporary messianic expectations said that the Messiah would be a son of David, a future king of David’s line who would redeem Israel and restore her to greatness.'
    by: matthew 22
  - claim: 'David understood the Messiah was more than his descendant'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'David had understood that the Messiah was more than one of his descendants: he was already God’s chosen who sat at his right hand millennia before his birth in the flesh.'
    by: matthew 22
  - claim: 'Two Latter-day Saint ways of reading YHWH and ʾădōnāy in Ps. 110:1 (divine investiture; Jehovah as a title also of the Father) — Huntsman’s note 18'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Two possible ways of understanding this are that (1) Jehovah was speaking about himself on behalf of the Father to “David” through what is called “divine investiture of authority”'
    by: matthew 22
  - claim: 'The question forced every group to reconsider its messianic expectations'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'During the lull, Jesus turns the tables on his opponents, asking a question based upon Psalm 110:1 that forces all these groups to reconsider their own contemporary messianic expectations'
    by: matthew 22
  - claim: 'Jesus is David’s son by lineage but was Jehovah before David'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'But while Jesus was born in the flesh as late in the centuries as the “meridian of time” He was Jehovah, Lord and God, before David, Abraham, or Adam was known on earth.'
    by: matthew 22
  - claim: 'The Jews expected a son of David only by descent and temporal rule'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'they who lived in expectation of a Messiah who would be David’s son only in the sense of family descent and royal succession in the splendor of temporal rule'
    by: matthew 22
