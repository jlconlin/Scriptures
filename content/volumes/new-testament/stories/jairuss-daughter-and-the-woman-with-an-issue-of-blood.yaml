story: jairuss-daughter-and-the-woman-with-an-issue-of-blood
differences:
  - 'Matthew does not name Jairus and calls him “a certain ruler” ([[Matt. 9:18]]); Mark and Luke name him and call him a ruler of the synagogue ([[Mark 5:22]]; [[Luke 8:41]]).'
  - 'In Matthew the father says his daughter is “even now dead” ([[Matt. 9:18]]); in Mark and Luke she is dying, and messengers bring word of her death later ([[Mark 5:23, 35]]; [[Luke 8:42, 49]]). JST Matt. 9:24 reads “dying” (footnote).'
  - 'Matthew places it straight after the fasting question (“While he spake these things,” [[Matt. 9:18]]); Mark and Luke after the Gadarene demoniac ([[Mark 5:21]]; [[Luke 8:40]]).'
  - 'Only Mark and Luke give the physicians and the spent living ([[Mark 5:26]]; [[Luke 8:43]]), “Who touched me?” and virtue going out of Him ([[Mark 5:30–32]]; [[Luke 8:45–46]]), and the woman’s trembling confession ([[Mark 5:33]]; [[Luke 8:47]]); in Matthew Jesus turns, sees her and speaks ([[Matt. 9:22]]).'
  - 'Only Mark and Luke name Peter, James and John and the parents as the ones who went in ([[Mark 5:37, 40]]; [[Luke 8:51]]), give the girl’s age ([[Mark 5:42]]; [[Luke 8:42]]) and the command to give her food ([[Mark 5:43]]; [[Luke 8:55]]); only Mark has “Talitha cumi” ([[Mark 5:41]]).'
  - 'Matthew alone mentions the minstrels ([[Matt. 9:23]]); Matthew and Luke say she touched the hem/border ([[Matt. 9:20]]; [[Luke 8:44]]), Mark his garment ([[Mark 5:27]]).'
findings:
  - claim: 'Dead or dying: the girl in the throes of death when the father left; he feared she had died'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The maid was seemingly breathing her last, she was in the very throes of death, when the father hurried away. Before he met Jesus he felt that the end had probably come; nevertheless his faith endured.'
    by: matthew 9
  - claim: 'Jairus fell at His feet, “or as Matthew says, worshiped Him”'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'He approached Jesus with the reverence due One whom he considered able to grant what he asked, and fell at the Lord’s feet, or as Matthew says, worshiped Him.'
    by: matthew 9
  - claim: 'Professional mourners and flute players; funeral soon after death; the mourners knew she was dead'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Professional mourners, including singers of weird dirges, and minstrels who made great noise with flutes and other instruments, had already been summoned to the house.'
    by: matthew 9
  - claim: 'Not dead but sleepeth: death as sleep was common speech; she was dead; Lazarus'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'That the daughter of Jairus was dead is placed beyond reasonable doubt by the scriptural record. Our Lord’s statement to the noisy mourners that “the damsel is not dead but sleepeth” told that her sleep was to be of short duration.'
    by: matthew 9
  - claim: 'Raising to mortal life differs from resurrection'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'the miracle consisted in reuniting the spirit and the body in a continuation of the interrupted course of mortal existence. That the subject of each of these miracles had to subsequently die is certain.'
    by: matthew 9
  - claim: 'Virtue gone out: an actual giving of His own strength (Talmage on Mark 5:30 / Luke 8:46)'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'That there was an actual giving of His own strength to the afflicted whom He healed is evident from the present instance.'
    by: matthew 9
  - claim: 'Law: a woman with an issue beyond her time was unclean, and whoever touched what she sat on'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'And if a woman have an issue of her blood many days out of the time of her separation, or if it run beyond the time of her separation; all the days of the issue of her uncleanness shall be as the days of her separation: she shall be unclean.'
    by: matthew 9
  - claim: 'Thayer: kraspedon = tsitsit, a tassel of twisted wool worn to remind of the law'
    key: thayer
    url: 'https://biblehub.com/greek/2899.htm'
    quote: 'in the N. T. for Hebrew צִיצִית, i. e. a little appendage hanging down from the edge of the mantle or cloak, made of twisted wool; a tassel, tuft: Matthew 9:20; Matthew 14:36; Matthew 23:5; Mark 6:56; Luke 8:44.'
    by: matthew 9
  - claim: 'The border likely the tzitzit; Malachi 4:2 “healing in his wings” (kanaph)'
    key: south-clothing-textiles
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/clothing-textiles-new-testament'
    quote: 'This border was likely the wool tassel fringe (tzitzit) required by Numbers 15:38 to remind Jews of the law. Such an identification allows for the beautiful fulfillment of the prophecy in Malachi 4:2 that the Lord will bring “healing in his wings”'
    by: matthew 9
  - claim: 'Matthew 8–9 and Mark place the story differently: Matthew gathers miracle stories by theme'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'the differences in Markan chronology in Matthew 4–13 can be attributed to Matthew’s penchant for collecting materials into thematic blocks (see the collections of miracle stories in Matthew 8–9 and of the parables in Matthew 13).'
    by: matthew 9
  - claim: 'Only Mark gives the girl’s age with the woman’s twelve years, linking the two; daughter of the synagogue and daughter of Jesus'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Thus, only in Mark’s account does this detail link the little girl and the woman. Twelve was a symbolic number, carrying associations of leadership from the idea of the twelve tribes of Israel.'
    by: mark 5
  - claim: 'Virtue: dynamis, inherent power a person puts forth'
    key: thayer
    url: 'https://biblehub.com/greek/1411.htm'
    quote: 'strength, ability, power; … a. universally, "inherent power, power residing in a thing by virtue of its nature, or which a person or thing exerts and puts forth"'
    by: mark 5
  - claim: 'Joseph Smith on virtue as the spirit of life (as quoted from History of the Church 5:303)'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'Additional insight into the concept of virtue (or power) going out of Jesus comes from the Prophet Joseph Smith: “the virtue here referred to is the spirit of life; and a man who exercises great faith in administering to the sick … is liable to become weakened.”'
    by: mark 5
  - claim: 'Who touched me: Jesus led her to confession to correct her misapprehension and confirm her faith'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'To correct her misapprehension and to confirm her faith, Jesus gently subjected her to the necessary ordeal of confession'
    by: mark 5
  - claim: 'Sōzō at Mark 5:23, 28, 34: heal, make well; also save'
    key: thayer
    url: 'https://biblehub.com/greek/4982.htm'
    quote: 'to save a suffering one (from perishing), e. g. one suffering from disease, to make well, heal, restore to health: Matthew 9:22; Mark 5:34; … passive, Matthew 9:21; Mark 5:23, 28'
    by: mark 5
  - claim: 'The woman unclean, and all she touched; family and friends likely withdrew'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'According to the law of Moses, such an illness rendered the woman ritually unclean and anything or anyone that she touched was subsequently rendered unclean (see Leviticus 15:25–31).'
    by: mark 5
  - claim: 'Jairus saw on the way a faith greater than his own'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'In the interim, Jairus witnessed someone with greater faith in the Savior’s power than he possessed at his first petition to Christ.'
    by: mark 5
  - claim: 'Talitha cumi better “Little one, get up”; Mark keeps the most Aramaic'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Of the four Gospels, Mark preserves the most Aramaic phrases used by Jesus.'
    by: mark 5
  - claim: 'Took her by the hand: krateō tēs cheiros, a firm sustained handclasp'
    key: calabro-nonverbal
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/nonverbal-communication-new-testament'
    quote: 'The Greek idiom is krateō tēs cheiros “grasp by the hand,” denoting a firm, sustained handclasp'
    by: mark 5
  - claim: 'Laying on of hands: a gesture by which power and authority are channeled'
    key: calabro-nonverbal
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/nonverbal-communication-new-testament'
    quote: 'the hands are understood as a medium by which power, spiritual gifts, and authority are channeled from the one performing the gesture to the one receiving it.'
    by: mark 5
  - claim: 'Raising of the girl tied to the resurrection by vocabulary (egeiro 5:41/16:6; ekstasis 5:42/16:8)'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: '(4) the word for “astonishment” (Greek: ekstasis) is used in Mark only for the reaction to the girl’s raising and the reaction to Jesus’ raising (Mark 5:42 and 16:8)'
    by: mark 5
  - claim: 'Ruler of the synagogue: chief official, generally a scribe'
    key: bd-synagogue
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/synagogue?lang=eng'
    quote: 'The most important official was the Ruler of the Synagogue (Mark 5:22; Luke 13:14), who was generally a scribe, had care of the building, and superintended the various services.'
    by: mark 5
open:
  - 'Why does Jesus ask “Who touched me?” when He knew ([[Luke 8:45]])? Talmage chapter 20, paragraph [32], answers; not used for Matthew.'
  - 'Why did Jesus take only Peter, James and John ([[Mark 5:37]])? Ellicott on Matthew 9 says they were then “for the first time … chosen from among the chosen.”'
