story: barabbas-chosen-and-jesus-condemned
differences:
  - 'Matthew calls Barabbas only “a notable prisoner” ([[Matt. 27:16]]); Mark and Luke say he was held for murder in an insurrection ([[Mark 15:7]]; [[Luke 23:19]]); John calls him “a robber” ([[John 18:40]]).'
  - 'The release custom is Pilate’s in Mark (“he released,” [[Mark 15:6]]), the governor’s in Matthew ([[Matt. 27:15]]), a necessity in Luke ([[Luke 23:17]]), and “ye have a custom” in John ([[John 18:39]]).'
  - 'Only Matthew has the message from Pilate’s wife ([[Matt. 27:19]]), Pilate washing his hands, and the cry “His blood be on us, and on our children” ([[Matt. 27:24–25]]).'
  - 'Luke has Pilate declare Jesus innocent three times and offer to “chastise him, and release him” ([[Luke 23:14–22]]); John has the scourging and mockery before the sentence, “Behold the man!”, and the cry “We have no king but Caesar” ([[John 19:1–15]]).'
  - 'The robe is scarlet in Matthew ([[Matt. 27:28]]), purple in Mark and John ([[Mark 15:17]]; [[John 19:2]]); the Joseph Smith Translation of Matthew reads purple (JST Matt. 27:30, footnote). Only Matthew has the reed in His right hand ([[Matt. 27:29]]). Luke has no mockery by Pilate’s soldiers.'
findings:
  - claim: 'Whose custom the release was is unclear; it suited Passover’s theme of deliverance'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Whether this was Pilate’s own practice (Mark 15:6), possibly that of all Roman governors (Matt 27:15; Luke 23:17), or a Jewish custom that Pilate had adopted is unclear; nevertheless, freeing a prisoner certainly accorded with an important theme of Passover'
    by: matthew 27
  - claim: 'Barabbas was an insurgent, guilty of what the leaders implied of Jesus'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'he was guilty of actual insurrection against Rome, the very thing that the Jewish leadership implied Jesus was fomenting by claiming that he was the Messiah.'
    by: matthew 27
  - claim: 'Some early manuscripts of Matthew name him Jesus Barabbas; the name could mean “son of the father” or “son of a teacher”'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'The name Barabbas could be Aramaic for, among other possibilities, “son of the father” (bar ʾabbāʾ) and “son of a teacher” (bar Rabba[n]).'
    by: matthew 27
  - claim: 'Elder Holland on the irony of the name'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'So one godless “son of the father” was set free while a truly divine Son of His Heavenly Father moved on to crucifixion.'
    by: matthew 27
  - claim: 'John’s Barabbas as the scapegoat and Jesus as the sacrificed goat of the Day of Atonement (an interpretation)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'By this interpretation, Barabbas was released as the scapegoat, while Jesus was handed over to be crucified as the sacrificed goat.'
    by: matthew 27
  - claim: 'Pilate’s wife, with her dream, is like Joseph and the Magi; her words echo the first passion prediction; she is a foil'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'she serves as a foil to both her husband, who reacts indecisively to Jesus, and the Jewish leaders, who actively seek his condemnation.'
    by: matthew 27
  - claim: 'The handwashing is rooted in Jewish practice and Old Testament precedent'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Pilate’s washing his hands seems to be rooted in Jewish practice, drawing upon Old Testament images and precedents'
    by: matthew 27
  - claim: 'Elder Holland on Pilate’s scourging of the man he found faultless'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'Then, in an act as unconscionable as it was illogical, Pilate “scourged Jesus, [and] delivered him to be crucified.” Pilate’s freshly washed hands could not have been more stained or more unclean.'
    by: matthew 27
  - claim: 'Matthew 27:25 was misused to accuse Jews of being “Christ killers”; the crowd was probably small and largely priestly; the law rejects inherited guilt'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'it is likely the case that the crowd was composed of a small priestly group with very few Pharisee-following Jews in attendance.'
    by: matthew 27
  - claim: 'The crowd may have been a claque of the chief priests’ retainers'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the crowd might have consisted primarily of a large group of retainers and other supporters of the chief priests—what is called a claque'
    by: matthew 27
  - claim: 'In John “the Jews” usually means the Jewish leadership'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'in John this expression usually refers to the Jewish leadership and not to all Jewish people.'
    by: matthew 27
  - claim: 'In a real way all are responsible'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Thus, in a very real way we are all responsible for the circumstances of that terrible day.'
    by: matthew 27
  - claim: 'The soldiers’ mockery fulfilled prophecies in Isaiah and the Book of Mormon'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'While these acts were meant to demean him, they also fulfilled prophecies in both Isaiah and the Book of Mormon (Isa 50:6; 53:3‒7; 1 Nephi 19:9; 2 Nephi 6:9; Mosiah 3:9).'
    by: matthew 27
  - claim: 'The mockery derides His kingship and right to judge (Mitton’s reading)'
    key: mitton-crucifixion-mockery
    url: 'https://interpreterfoundation.org/journal/the-crucifixion-as-a-mockery-witness-and-warning-of-the-judgment'
    quote: 'It is His kingship that is being derided, with its right to judge.'
    by: matthew 27
