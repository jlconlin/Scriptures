story: barabbas-chosen-and-jesus-condemned
differences:
  - 'Matthew calls Barabbas only “a notable prisoner” ([[Matt. 27:16]]); Mark and Luke say he was held for murder in an insurrection ([[Mark 15:7]]; [[Luke 23:19]]); John calls him “a robber” ([[John 18:40]]).'
  - 'The release custom is Pilate’s in Mark (“he released,” [[Mark 15:6]]), the governor’s in Matthew ([[Matt. 27:15]]), a necessity in Luke ([[Luke 23:17]]), and “ye have a custom” in John ([[John 18:39]]).'
  - 'Only Matthew has the message from Pilate’s wife ([[Matt. 27:19]]), Pilate washing his hands, and the cry “His blood be on us, and on our children” ([[Matt. 27:24–25]]).'
  - 'Luke has Pilate declare Jesus innocent three times and offer to “chastise him, and release him” ([[Luke 23:14–22]]); John has the scourging and mockery before the sentence, “Behold the man!”, and the cry “We have no king but Caesar” ([[John 19:1–15]]).'
  - 'The robe is scarlet in Matthew ([[Matt. 27:28]]), purple in Mark and John ([[Mark 15:17]]; [[John 19:2]]); the Joseph Smith Translation of Matthew reads purple (JST Matt. 27:30, footnote). Only Matthew has the reed in His right hand ([[Matt. 27:29]]). Luke has no mockery by Pilate’s soldiers.'
  - 'Mark says the chief priests “moved the people” to ask for Barabbas ([[Mark 15:11]]); Matthew that they “persuaded the multitude” ([[Matt. 27:20]]); in Luke Pilate calls together the chief priests, the rulers and the people, and the voices of the people and of the chief priests prevail ([[Luke 23:13]]; [[Luke 23:23]]); in John the chief priests and officers cry “Crucify him” ([[John 19:6]]).'
findings:
  - claim: 'Whose custom the release was is unclear; it suited Passover’s theme of deliverance'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Whether this was Pilate’s own practice (Mark 15:6), possibly that of all Roman governors (Matt 27:15; Luke 23:17), or a Jewish custom that Pilate had adopted is unclear; nevertheless, freeing a prisoner certainly accorded with an important theme of Passover'
    by: matthew 27
  - claim: 'Barabbas was an insurgent, guilty of what the leaders implied of Jesus'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'he was guilty of actual insurrection against Rome, the very thing that the Jewish leadership implied Jesus was fomenting by claiming that he was the Messiah.'
    by: matthew 27
  - claim: 'Some early manuscripts of Matthew name him Jesus Barabbas; the name could mean “son of the father” or “son of a teacher”'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'The name Barabbas could be Aramaic for, among other possibilities, “son of the father” (bar ʾabbāʾ) and “son of a teacher” (bar Rabba[n]).'
    by: matthew 27
  - claim: 'Elder Holland on the irony of the name'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'So one godless “son of the father” was set free while a truly divine Son of His Heavenly Father moved on to crucifixion.'
    by: matthew 27
  - claim: 'John’s Barabbas as the scapegoat and Jesus as the sacrificed goat of the Day of Atonement (an interpretation)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'By this interpretation, Barabbas was released as the scapegoat, while Jesus was handed over to be crucified as the sacrificed goat.'
    by: matthew 27
  - claim: 'Pilate’s wife, with her dream, is like Joseph and the Magi; her words echo the first passion prediction; she is a foil'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'she serves as a foil to both her husband, who reacts indecisively to Jesus, and the Jewish leaders, who actively seek his condemnation.'
    by: matthew 27
  - claim: 'The handwashing is rooted in Jewish practice and Old Testament precedent'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Pilate’s washing his hands seems to be rooted in Jewish practice, drawing upon Old Testament images and precedents'
    by: matthew 27
  - claim: 'Elder Holland on Pilate’s scourging of the man he found faultless'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'Then, in an act as unconscionable as it was illogical, Pilate “scourged Jesus, [and] delivered him to be crucified.” Pilate’s freshly washed hands could not have been more stained or more unclean.'
    by: matthew 27
  - claim: 'Matthew 27:25 was misused to accuse Jews of being “Christ killers”; the crowd was probably small and largely priestly; the law rejects inherited guilt'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'it is likely the case that the crowd was composed of a small priestly group with very few Pharisee-following Jews in attendance.'
    by: matthew 27
  - claim: 'The crowd may have been a claque of the chief priests’ retainers'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the crowd might have consisted primarily of a large group of retainers and other supporters of the chief priests—what is called a claque'
    by: matthew 27
  - claim: 'In John “the Jews” usually means the Jewish leadership'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'in John this expression usually refers to the Jewish leadership and not to all Jewish people.'
    by: matthew 27
  - claim: 'In a real way all are responsible'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Thus, in a very real way we are all responsible for the circumstances of that terrible day.'
    by: matthew 27
  - claim: 'The soldiers’ mockery fulfilled prophecies in Isaiah and the Book of Mormon'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'While these acts were meant to demean him, they also fulfilled prophecies in both Isaiah and the Book of Mormon (Isa 50:6; 53:3‒7; 1 Nephi 19:9; 2 Nephi 6:9; Mosiah 3:9).'
    by: matthew 27
  - claim: 'The mockery derides His kingship and right to judge (Mitton’s reading)'
    key: mitton-crucifixion-mockery
    url: 'https://interpreterfoundation.org/journal/the-crucifixion-as-a-mockery-witness-and-warning-of-the-judgment'
    quote: 'It is His kingship that is being derided, with its right to judge.'
    by: matthew 27
  - claim: 'Pilate took envy for a petty motive; envy does not adequately describe the council’s reactions'
    key: sc-knowhy-676
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-put-on-trial-and-crucified'
    quote: 'Matthew and Mark each state that the Sanhedrin delivered Jesus over to Pilate “for envy” (see Mark 15:10; Matthew 27:18), which Pilate misunderstood for some petty motivation. Yet even feelings of envy do not adequately describe the reactions exhibited by the Sanhedrin'
    by: mark 15
  - claim: 'The chief priests pressed for execution, since false prophecy and wonder-working were forbidden under Jewish law'
    key: sc-knowhy-676
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-put-on-trial-and-crucified'
    quote: 'but still the chief priests pressed for Jesus’s execution, as false prophecy and miracle working were likewise forbidden under Jewish law.'
    by: mark 15
  - claim: 'If the crowd was people of the city, the change of feeling since the triumphal entry is hard to explain'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'If it consisted of a growing gathering of people from the city who had heard that Jesus had been arrested, we immediately wonder how their feelings towards Jesus had changed so markedly given the rapturous welcome they had given Jesus at his triumphal entry.'
    by: mark 15
  - claim: 'Torture, most often scourging, usually preceded crucifixion by Roman times'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'By Roman times, some form of torture usually preceded crucifixion. These tortures most frequently included scourging'
    by: mark 15
  - claim: 'Phragelloō: a severe whipping that could kill; Pilate joins the chain of those who hand Jesus over'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'a terrible and severe whipping preliminary to execution that could kill the condemned even before crucifixion'
    by: mark 15
  - claim: 'Pilate is in the chain of those, divine and human, who hand Jesus over'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'which puts Pilate in the chain of figures, divine and human, who hand Jesus over to be sacrificed.'
    by: mark 15
  - claim: 'Praetorium: the governor’s palace; in Jerusalem Herod’s palace, which the procurators seem to have occupied'
    key: thayer
    url: 'https://biblehub.com/greek/4232.htm'
    quote: 'at Jerusalem it was that magnificent palace which Herod the Great had built for himself, and which the Roman procurators seem to have occupied whenever they came from Caesarea to Jerusalem'
    by: mark 15
  - claim: 'Speira: a cohort, the tenth part of a legion, about 600 men, or 500 or 1,000 auxiliaries'
    key: thayer
    url: 'https://biblehub.com/greek/4686.htm'
    quote: 'the tenth part of a legion (i. e. about 600 men (i. e. legionaries), or if auxilialies either 500 or 1,000'
    by: mark 15
  - claim: 'Luke 23:17 is missing from many important manuscripts, including P75; the custom is affirmed by the other Gospels'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'This verse does not appear in many of the important New Testament manuscripts, including the earliest known copy of Luke’s Gospel, P75.'
    by: luke 23
  - claim: '“Chastise” (paideuō) means to discipline and may point to a lesser punishment than scourging'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'But the verb paideuō means only “to discipline” and thus may point to a lesser punishment'
    by: luke 23
  - claim: 'In Luke the crowd shares responsibility with Pilate'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'Thus, the crowd shares the responsibility with Pilate for executing Jesus.'
    by: luke 23
  - claim: '“Behold the man!”: Pilate’s appeal for mercy at the sight of the suffering prisoner'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'Pilate’s “Ecce homo!” is an appeal to the multitude. That picture of suffering—is it not enough? Will none in that throng lift up a cry for mercy'
    by: john 19
  - claim: '“Behold the man!”: the marred appearance fulfilled the Suffering Servant (Isa 52:14; 53:5)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'While Pilate might have intended to sway the crowd with the sight of a tortured and bleeding Jesus, the Lord’s marred appearance was, in fact, a fulfillment of the prophesied image of the Suffering Servant (Isa 52:14; 53:5, 10).'
    by: john 19
  - claim: '“Not Caesar’s friend”: treason trials under Tiberius; Pilate’s possible patron Sejanus recently purged'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'because Pilate’s possible patron, Sejanus, had recently been purged for a plot against the emperor, Pilate may have felt in jeopardy himself, making him particularly susceptible to this kind of pressure.'
    by: john 19
  - claim: 'The Pavement (lithostrōton) most likely the mosaic floor of Herod’s former palace courtyard'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Instead, “Strewn Stones” most likely refers to the famous and expensive mosaic flooring of the courtyard of the former Palace of Herod the Great, which consisted of white cubes intermixed with colored stones.'
    by: john 19
  - claim: 'Gabbatha means an elevated place'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The Chaldee word means “an elevated place,” so that one name was given to it from its form, and the other from the material of which it was made.'
    by: john 19
  - claim: '“He that delivered me unto thee” (John 19:11) is the Sanhedrin and Caiaphas, not Judas'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'This cannot mean Judas, who is nowhere mentioned in this connection, and is excluded by the words “unto thee.” Judas delivered our Lord to the Jews. It was the Sanhedrin, and especially Caiaphas'
    by: john 19
  - claim: '“Behold the man!”: Elder Uchtdorf reads it as Pilate hoping to satisfy the crowd or move it to pity'
    key: uchtdorf-behold-the-man
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/behold-the-man?lang=eng'
    quote: 'Perhaps Pilate thought this would satisfy the mob’s lust for blood. Perhaps they would take pity on the man.'
    by: john 19
  - claim: 'Gabbatha: a raised place; the Aramaic name from its shape, the Greek from its pavement'
    key: thayer
    url: 'https://biblehub.com/greek/1042.htm'
    quote: 'Doubtless the Chaldaic name was given to the spot from its shape, the Greek name from the nature of its pavement.'
    by: john 19
  - claim: 'Pilate “the more afraid” at “Son of God” (John 19:8); fear runs through the trials'
    key: welch-factor-fear
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/factor-fear-trial-jesus'
    quote: 'When Pilate heard the words “he has made himself the son of God,” Pilate’s reaction was fear (John 19:7). In fact, John states that Pilate “was really afraid” (mallon ephobethe).'
    by: john 19
open:
  - 'What did Pilate mean by “Behold the man!” ([[John 19:5]])? Huntsman and Hatch, para. 65.'
  - 'Why did the threat “thou art not Caesar’s friend” move Pilate ([[John 19:12]])? Huntsman and Hatch, para. 66, on Sejanus and the treason trials.'
  - 'What was the Pavement, Gabbatha ([[John 19:13]])?'
  - 'How should 2 Nephi 10:3–6 be read beside the trial? Huntsman and Hatch, para. 75.'
