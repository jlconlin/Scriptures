story: multitudes-healed-the-chosen-servant
differences:
  - 'Only Matthew quotes [[Isa. 42:1–4]] as fulfilled here ([[Matt. 12:17–21]]).'
  - 'In Mark the unclean spirits cry “Thou art the Son of God,” and it is they whom He charges not to make Him known ([[Mark 3:11–12]]); in Matthew the charge is to those healed ([[Matt. 12:15–16]]).'
  - 'Mark lists where the crowds came from and has a small ship kept ready ([[Mark 3:7–9]]).'
findings:
  - claim: 'Ellicott: the charge not to make Him known avoided premature offense before His hour'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'The hour of final conflict and suffering had not yet come, and Jesus would not hasten it. … sought to avoid premature occasions of offence.'
    by: matthew 12
  - claim: 'Pais in Matt. 12:18 is used of Jesus the Messiah, after the Hebrew servant of the LORD'
    key: thayer
    url: 'https://biblehub.com/greek/3816.htm'
    quote: 'likewise any upright and godly man whose agency God employs in executing his purposes; thus in the N. T. Jesus the Messiah: Matthew 12:18 (from Isaiah 42:1)'
    by: matthew 12
  - claim: 'Isaiah foretold a ministry of small stir that heals rather than crushes the weak'
    key: ball-isaiah-messiah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/isaiah-messiah'
    quote: 'In fact, in outward appearance His ministry would be of such a small stir that He would not break even a fragile “reed,” although it may already be “bruised,” … He came not to crush or abuse the tender, weak, ill, humble, and penitent, but rather to heal and help them.'
    by: matthew 12
  - claim: 'JST Matt. 12:13 (footnote 15a): Jesus knew when they took counsel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'JST Matt. 12:13 … Jesus knew when they took counsel, and he withdrew …'
    by: matthew 12
open:
  - 'Why does Jesus silence the unclean spirits who call Him the Son of God ([[Mark 3:11–12]])?'
