story: peters-confession-at-caesarea-philippi
differences:
  - 'Matthew has “Whom do men say that I the Son of man am?” ([[Matt. 16:13]]); Mark and Luke “Whom do men (the people) say that I am?” ([[Mark 8:27]]; [[Luke 9:18]]).'
  - 'Mark says the question was asked “by the way” ([[Mark 8:27]]); Luke, that Jesus was “alone praying” ([[Luke 9:18]]).'
  - 'Only Matthew names Jeremias among the people’s guesses ([[Matt. 16:14]]); Luke has “one of the old prophets is risen again” ([[Luke 9:19]]).'
  - 'Peter’s confession: “Thou art the Christ, the Son of the living God” ([[Matt. 16:16]]); “Thou art the Christ” ([[Mark 8:29]]); “The Christ of God” ([[Luke 9:20]]).'
  - 'Only Matthew has the blessing on Peter, the rock, the church, the gates of hell and the keys ([[Matt. 16:17–19]]).'
findings:
  - claim: 'Caesarea Philippi near the source of the Jordan at the foot of Hermon; northernmost point of His journeys'
    key: bd-caesarea-philippi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caesarea-philippi?lang=eng'
    quote: 'A town near the source of the Jordan, at the foot of Mount Hermon, rebuilt and enlarged by Philip, tetrarch of Trachonitis. The northern most point of our Lord’s journeyings'
    by: matthew 16
  - claim: '“Coasts” means borders or neighborhood; named for the emperor; once Paneas, after Pan'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It was known as a place of idolatrous worship, and while under Greek sovereignty was called Paneas in recognition of the mythological deity Pan.'
    by: matthew 16
  - claim: 'Jesus came there for retirement and perhaps safety, not to preach'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'to which He now came, it would seem, not as a Preacher of the kingdom, but simply for retirement and perhaps for safety.'
    by: matthew 16
  - claim: 'None of the people’s answers held Him to be the Messiah'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It is significant that among all the conceptions of the people as to the identity of Jesus there was no intimation of belief that He was the Messiah.'
    by: matthew 16
  - claim: 'Matthew’s Peter knows Jesus is God’s own Son; Matthew alone has the declaration on the origin of Peter’s testimony'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'The Matthean Peter does not just know that Jesus is the chosen, anointed servant of God but also that he is actually God’s own Son.'
    by: matthew 16
  - claim: 'Only Matthew among the Gospels uses “church”'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'his references to the church (Matthew 16:18; 18:17), the only ones in any of the Gospels'
    by: matthew 16
  - claim: 'Joseph Smith: the rock is revelation'
    key: jsp-discourse-1843-01-22
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-22-january-1843-as-reported-by-wilford-woodruff/5'
    quote: 'prevail against it23 what rock, Revelation'
    by: matthew 16
  - claim: 'The Christ whom Peter confessed is the true cornerstone'
    key: bd-peter
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/peter?lang=eng'
    quote: 'But it is the Christ, the Son of God, which Peter had just confessed, who is the true cornerstone of the Church.'
    by: matthew 16
  - claim: 'Revelation the rock; revelation implies revelators; the keys embody priesthood authority and presidency'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Through direct revelation from God Peter knew that Jesus was the Christ; and upon revelation, as a rock of secure foundation, the Church of Christ was to be built.'
    by: matthew 16
  - claim: 'Semitic touches (Bar-jona, flesh and blood, gates of Hades, bound/loosed, kephā) place the scene among Aramaic-speaking eyewitnesses'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'the play on the Aramaic word kephā that underlies both the Greek name Peter and the word “rock” (Matthew 16:17–19).'
    by: matthew 16
  - claim: 'The Petros/petra wordplay does not make Peter the bedrock but ascribes potential bedrock strength to him'
    key: bowen-founded-rock
    url: 'https://journal.interpreterfoundation.org/founded-upon-a-rock-doctrinal-and-temple-implications-of-peters-surnaming/'
    quote: 'The Petros/petra wordplay in this dialogue, however, does suggest that Jesus was ascribing potential “bedrock” strength to his chief disciple.'
    by: matthew 16
  - claim: 'Hadēs in the New Testament a temporary abode of spirits; the gates keep spirits in prison; Christ holds both sets of keys'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'The same person holds both sets of keys, one that allows departed spirits out of Hades and the other that allows entry from prison into God’s kingdom.'
    by: matthew 16
  - claim: 'Eliakim (Isa. 22:22) the one Old Testament holder of keys; keys control entry into God’s kingdom; bind/loose = forbid/permit in rabbinic law; the passive points to the Father'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'In rabbinic law, “to bind” and “to loose” mean “to forbid” and “to permit,” that is, to forbid or permit activities under the strictures of the law of Moses.'
    by: matthew 16
  - claim: 'The promised keys were given on the mount about a week later'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'On the mount, the Savior, Moses, and Elias (Elijah) gave the promised keys of the priesthood to Peter, James, and John (HC 3:387)'
    by: matthew 16
  - claim: 'Why tell no man: proclamation after the Resurrection; hostility and sedition; lesser culpability'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The time for a general proclamation of their testimony had not arrived, however; nor did it come until after Christ had emerged from the tomb a resurrected, immortalized Personage.'
    by: matthew 16
  - claim: '“Christ” first used by anyone in Mark since 1:1; Peter like the blind man who saw but not clearly'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Instead, Peter was like the blind man who had begun to see but not clearly; he did not yet fully understand what he saw.'
    by: mark 8
  - claim: 'JST Mark 8:29 inserts “the son of the living God” (Wayment suggests from Adam Clarke)'
    key: jackson-jst-new-testament
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/joseph-smiths-translation-new-testament'
    quote: 'perhaps including revising Mark 8:29 (inserting “the son of the living God”)'
    by: mark 8
  - claim: 'Messianic expectation: miracles, feeding, casting out Rome; why Jesus told Peter to tell no one'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'their conception of the Messiah was of one who worked miracles, healed the sick, fed the hungry, and ultimately would cast the Romans out of Judea.'
    by: mark 8
  - claim: 'Silence most likely so people were not misled about what it means to be a Messiah'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus’ requests for people not to preach about his healing miracles is most likely tied to his desire that, before his death, he did not want people to be misled about what it means to be a Messiah.'
    by: mark 8
