story: before-annas-and-caiaphas
differences:
  - 'Matthew and Mark take Jesus straight to the high priest (Matthew names Caiaphas) for a night hearing ([[Matt. 26:57–68]]; [[Mark 14:53–65]]). John has Him taken first to Annas, Caiaphas’s father-in-law ([[John 18:13]]; [[John 18:19–24]]). Luke has Him mocked at the high priest’s house in the night and questioned by the council “as soon as it was day” ([[Luke 22:63–71]]).'
  - 'Mark has Jesus answer the high priest “I am” ([[Mark 14:62]]); Matthew “Thou hast said” ([[Matt. 26:64]]); Luke “Ye say that I am” ([[Luke 22:70]]).'
  - 'Mark says the witnesses did not agree ([[Mark 14:56]]; [[Mark 14:59]]); Matthew says two false witnesses came at last ([[Matt. 26:60–61]]).'
  - 'Only Matthew has the high priest adjure Jesus “by the living God” ([[Matt. 26:63]]).'
findings:
  - claim: 'Talmage judged the night arrest and trial illegal'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'they had unlawfully caused Jesus to be arrested at night; they were illegally going through the semblance of a trial at night'
    by: matthew 26
  - claim: 'The older “illegalities” argument judged the Gospels by the Mishnah of about AD 200'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'judging the schematic Gospel treatments by the standards of the Mishnah, a compendium of Jewish tradition dating much later, to AD 200.'
    by: matthew 26
  - claim: 'The texts give an overview of a preliminary hearing'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'what the texts provide us is only an overview of what appears to have been some kind of preliminary hearing or arraignment in which the Jewish leadership attempted to settle on a plan with how to deal with Jesus the next day.'
    by: matthew 26
  - claim: 'The temple charge failed for want of two agreeing witnesses'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Attempts to find a case against him focus at first on charges that he threatened to destroy the temple, but they cannot find two corroborating witnesses whose testimonies agree.'
    by: matthew 26
  - claim: '“Thou hast said” means “I am what thou hast said”'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'This expression “Thou hast said” was equivalent to—I am what thou hast said. It was an unqualified avowal of divine parentage, and inherent Godship.'
    by: matthew 26
  - claim: 'Jesus quoted Psalm 110:1 and Daniel 7:13'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'affirming and quoting from both Psalm 110:1 and Daniel 7:13‒14'
    by: matthew 26
  - claim: 'Blasphemy was a religious crime worthy of death'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Charging Jesus with blasphemy, a religious crime worthy of death'
    by: matthew 26
  - claim: 'At the moment when denial would have saved His life, He asserted His claim'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/26.htm'
    quote: 'At the very crisis of His history, when denial would have saved His life. He asserts His claim to be much more than this'
    by: matthew 26
  - claim: 'Late nineteenth-century lives of Christ focused on the supposed illegalities'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'late nineteenth-century writers of lives of Christ tended to focus on the supposed “illegalities of the Jewish trial of Jesus,”'
    by: matthew 26
  - claim: 'Only Caiaphas’s direct question gave them cause'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Only when Caiaphas directly asks Jesus, “Are you the Christ, the Son of the Blessed One?” (Mark 14:61; parallels Matt 26:62; Luke 22:67) does Jesus give them cause'
    by: matthew 26
open:
  - 'Why was Jesus taken to Annas first ([[John 18:13]])?'
  - 'Why does Luke have no night hearing ([[Luke 22:66]])?'
  - 'What did Jesus answer the officer who struck Him ([[John 18:22–23]])?'
