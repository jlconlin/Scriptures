story: his-death-foretold-a-second-time
differences:
  - 'Matthew says “they were exceeding sorry” ([[Matt. 17:23]]); Mark and Luke say they “understood not that saying” and were afraid to ask Him ([[Mark 9:32]]; [[Luke 9:45]]).'
  - 'Mark says Jesus passed through Galilee and “would not that any man should know it” ([[Mark 9:30]]).'
  - 'Luke sets it among the people’s amazement at the healing and prefaces it, “Let these sayings sink down into your ears”; he does not mention the killing or the rising ([[Luke 9:43–44]]).'
findings:
  - claim: 'His death and resurrection were the theme of His instruction to the Twelve in this season, repeated because they were slow to comprehend'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The particular theme of His special and advanced instruction to the Twelve was that of His approaching death and resurrection; and this was dwelt upon again and again, for they were slow or unwilling to comprehend.'
    by: matthew 17
  - claim: 'He traveled by less frequented roads, not wanting His return known'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'It is probable that they traveled by the less frequented roads, as He desired that His return should not be publicly known.'
    by: matthew 17
  - claim: 'The mind is loath to search into what it does not want to believe'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'their failure to comprehend was in part due to the fact that the human mind is loath to search deeply into anything it desires not to believe.'
    by: matthew 17
  - claim: 'They grasped the death with sorrow but had only dim comprehension of the rising'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'and with equal plainness they had been told that Jesus would rise again; but of this latter eventuality they had but dim comprehension.'
    by: matthew 17
  - claim: 'Their sorrow was vague; they shrank from making it definite'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/17.htm'
    quote: 'Their sorrow was vague and dim, and they shrank from that which might make it more definite.'
    by: matthew 17
open:
  - 'Why does Luke leave out the killing and the rising and say the saying was “hid from them” ([[Luke 9:44–45]])? Who hid it?'
  - 'Mark’s “delivered” is in the present tense; does that matter ([[Mark 9:31]])?'
