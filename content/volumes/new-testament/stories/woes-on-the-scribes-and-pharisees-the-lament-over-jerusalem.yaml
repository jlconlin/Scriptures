story: woes-on-the-scribes-and-pharisees-the-lament-over-jerusalem
differences:
  - 'Mark and Luke give a three-verse warning against the scribes only: long robes, greetings, chief seats, devouring widows’ houses, long prayers ([[Mark 12:38–40]]; [[Luke 20:45–47]]). Matthew names “the scribes and the Pharisees” and gives the whole discourse ([[Matt. 23:1–36]]).'
  - 'Only Matthew has Moses’ seat and the command to observe what they bid ([[Matt. 23:2–3]]), the phylacteries and borders ([[Matt. 23:5]]), and the charge to the disciples to take no titles ([[Matt. 23:8–12]]).'
  - 'The widows’ houses saying is in all three ([[Mark 12:40]]; [[Luke 20:47]]; [[Matt. 23:14]]).'
  - 'Mark and Luke follow the warning with the widow’s mites ([[Mark 12:41–44]]; [[Luke 21:1–4]]); Matthew follows it with the lament over Jerusalem ([[Matt. 23:37–39]]) and has no widow’s mites.'
  - 'Luke has many of the same woes at a Pharisee’s table in another setting ([[Luke 11:37–52]]) and the lament over Jerusalem on another occasion ([[Luke 13:34–35]]). Luke’s Zacharias has no father’s name ([[Luke 11:51]]).'
findings:
  - claim: 'On the Tuesday, by Mark’s chronology, Jesus taught in the temple courts, denounced the leaders, lamented over Jerusalem and left for the Mount of Olives'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The first part of the day was spent again in the temple courts, where the Jerusalem authorities engaged in debates with Jesus … After denouncing their hypocrisy and contrasting them unfavorably with a poor widow, Jesus lamented over the fate of Jerusalem before leaving the temple'
    by: matthew 23
  - claim: 'Mark’s condemnation of the scribes is set against his approval of the single scribe and the widow; Matthew expands it to the Pharisees with the woes'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Matthew’s account not only expands the indictment but also extends it to the Pharisees and adds seven damning “woes” that condemn their behavior in detail (Matt 23:1‒36). Mark’s previous approval of the single scribe who had responded favorably to Jesus highlights the condemnation of the group as a whole'
    by: matthew 23
  - claim: 'The Pharisees aimed to bring temple holiness into every home; hence vessels, washing, tithes'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'It led the Pharisees to focus on the purification of vessels and the washing of hands to make the meals ritually pure. Ritual purity also explains their emphasis on tithes'
    by: matthew 23
  - claim: 'The critiques in Luke 11 and Matthew 23 focus on what the Pharisees lacked; sins of omission'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'these comments are not framed as an attack on the Pharisees’ practices, but rather focus on what they yet lack … It is the sins of omission that become the barrier to true holiness.'
    by: matthew 23
  - claim: 'The avarice of the hierarchy, including taking the houses of dependent widows, under pretense of sanctity'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'the contributions of the poor, and the confiscation of property, including even the houses of dependent widows, formed a considerable proportion; and the perfidy of the practice was made the blacker by the outward pretense of sanctity'
    by: matthew 23
  - claim: 'Rabbi had come to outrank the priesthood; the apostles were not to seek titles'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The high-sounding title, Rabbi, signifying Master, Teacher, or Doctor, had eclipsed the divinely recognized sanctity of priesthood'
    by: matthew 23
  - claim: 'The Zacharias of the saying is most likely Zechariah son of Jehoiada (2 Chr. 24:20–22); Matthew’s “son of Barachias” is the prophet’s father; scholars generally accept a confusion'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The former option—that someone made a mistake—is now generally accepted by biblical scholars.'
    by: matthew 23
  - claim: 'The tradition that John the Baptist’s father was the martyr comes from later versions of the Protevangelium of James; no evidence Joseph Smith wrote or approved the 1842 Times and Seasons article'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'Although we know of no evidence that Joseph Smith wrote, delegated, or approved the publication of this article referencing Zacharias, it still found its way into Joseph Fielding Smith’s compilation, Teachings of the Prophet Joseph Smith, in 1938.'
    by: matthew 23
  - claim: 'The Bible Dictionary distinguishes John’s father from the martyr and refers the martyr to 2 Chronicles 24'
    key: bd-zacharias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zacharias?lang=eng'
    quote: '(2) Slain between the temple and the altar (Matt. 23:35; Luke 11:51; see also 2 Chr. 24:20–22).'
    by: matthew 23
  - claim: 'The hen image in 3 Nephi 10 in three tenses; Christ as Creator, gatherer, and shelter through the Atonement'
    key: sc-knowhy-200
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-christ-compare-himself-to-a-hen'
    quote: 'Jesus can be meaningfully compared to a mother hen in His role as Creator, in His ongoing efforts to gather and unify His people, and in His atoning sacrifice, which shelters and protects His people from the terrible consequences of sin and death.'
    by: matthew 23
  - claim: '“Your house” is the temple, now theirs and not His; spoken as He departed'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'It had been the house of God, but He, as represented by His Son, was now leaving it for ever. It was their house now, not His.'
    by: matthew 23
  - claim: 'Strain at a gnat: better “strain out”; gnat and camel both unclean'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'Better, as in Tyndale’s and other earlier versions, strain out.'
    by: matthew 23
  - claim: 'Weightier matters: the inward things of the heart'
    key: faust-weightier-matters
    url: 'https://www.churchofjesuschrist.org/study/ensign/1997/11/the-weightier-matters-of-the-law-judgment-mercy-and-faith?lang=eng'
    quote: 'We are to focus on the inward things of the heart, which we know and value intuitively but often neglect for that which is trivial, superficial, or prideful.'
    by: matthew 23
open:
  - 'Why does Mark place the warning against the scribes right after Jesus praises the scribe who answered discreetly ([[Mark 12:34]]), and what does “love to go in long clothing” mean ([[Mark 12:38]])?'
  - 'How does the widow’s mite, which Mark and Luke tell next, answer “devour widows’ houses” ([[Mark 12:40–44]]; [[Luke 20:47–21:4]])?'
  - 'Why does Luke set the woes at a Pharisee’s meal ([[Luke 11:37–54]]) and add woes on the lawyers, and what is “the key of knowledge” ([[Luke 11:52]])?'
  - 'Who is “the wisdom of God” that says “I will send them prophets” in [[Luke 11:49]]?'
