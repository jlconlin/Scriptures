story: legion-the-man-among-the-tombs
differences:
  - 'Matthew has “the country of the Gergesenes” and two men ([[Matt. 8:28]]); Mark and Luke “the country of the Gadarenes” and one man ([[Mark 5:1–2]]; [[Luke 8:26–27]]).'
  - 'Only Mark and Luke give the name Legion and the man’s chains, nakedness and self-wounding ([[Mark 5:3–9]]; [[Luke 8:27–30]]); only Mark numbers the swine “about two thousand” ([[Mark 5:13]]).'
  - 'Only Matthew has “art thou come hither to torment us before the time?” ([[Matt. 8:29]]); Luke has the devils beg not to be sent “into the deep” ([[Luke 8:31]]).'
  - 'Mark and Luke tell of the healed man “clothed, and in his right mind,” asking to go with Jesus and sent home to tell what God had done ([[Mark 5:15–20]]; [[Luke 8:35–39]]); Matthew ends with the city asking Jesus to leave.'
findings:
  - claim: 'A region, not a town; Gadara, Gerasa and Gergesa all in the district'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'In that district of Perea there were at the time towns named respectively Gadara, Gerasa, and Gergesa; the region in general, therefore, could properly be called the land of the Gadarenes or of the Gergesenes.'
    by: matthew 8
  - claim: 'The critical Greek text of Matthew 8:28 reads Gadarenes'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/8-28.htm'
    quote: 'Gadarēnōn Γαδαρηνῶν , Gadarenes Adj-GMP'
    by: matthew 8
  - claim: 'Two men in Matthew, one in Mark and Luke: possible explanations'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'it is possible that one of the afflicted pair was in a condition so much worse than that of his companion that to him is accorded greater prominence in the narrative; or, one may have run away while the other remained.'
    by: matthew 8
  - claim: 'The demons pleaded to be left alone until the decreed time of their final punishment'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'they pleaded to be left alone until the decreed time of their final punishment would come.'
    by: matthew 8
  - claim: 'Legion: the man could no longer distinguish his personality from the demons’'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'So complete was his possession by wicked spirits that he could no longer distinguish between his individual personality and theirs.'
    by: matthew 8
  - claim: 'Joseph Smith: the devil, having no body, asked for the swine'
    key: wjs-1841-01-05
    url: 'https://rsc.byu.edu/words-joseph-smith/5-january-1841-tuesday-old-homestead'
    quote: 'He is pleased when he can obtain the tabernacle of man and when cast out by the Savior he asked to go into the herd of swine showing that he would prefer a swines body to having none.'
    by: matthew 8
  - claim: 'The destruction of the swine was not by His command; the people feared, were partly heathen'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'It was the fear that sinful men feel in the presence of the Righteous.'
    by: matthew 8
  - claim: 'The healed man became a missionary through the Decapolis'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The man became a missionary, not alone in his home town but throughout Decapolis, the region of the ten cities'
    by: matthew 8
  - claim: 'No pig bones at Jewish Capernaum: swine a mark of Gentile presence'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'there is no archaeological trace of a Gentile presence at Capernaum—no pig bones, Greek inscriptions, or Roman art'
    by: matthew 8
open:
  - 'What does “Legion” mean as a name, and why would a Roman military word be used ([[Mark 5:9]])?'
  - 'Why did Jesus send the healed man home rather than let him follow ([[Mark 5:19]]), when elsewhere He tells people to tell no man?'
  - 'What is “the deep” the devils feared ([[Luke 8:31]])?'
