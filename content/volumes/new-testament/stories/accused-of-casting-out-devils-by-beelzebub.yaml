story: accused-of-casting-out-devils-by-beelzebub
differences:
  - 'Matthew’s man is blind and dumb ([[Matt. 12:22]]); Luke’s is dumb ([[Luke 11:14]]); Mark tells no healing, only the charge of the scribes “which came down from Jerusalem” ([[Mark 3:22]]).'
  - 'Only Matthew has the crowd ask “Is not this the son of David?” ([[Matt. 12:23]]).'
  - 'Matthew has “by the Spirit of God” ([[Matt. 12:28]]); Luke “with the finger of God” ([[Luke 11:20]]).'
  - 'Mark explains the warning: “Because they said, He hath an unclean spirit” ([[Mark 3:30]]); just before, Mark tells of kinsmen saying “He is beside himself” ([[Mark 3:21]]).'
  - 'Only Matthew has the tree and its fruit, the generation of vipers and the idle words ([[Matt. 12:33–37]]); Luke places here the woman who blesses Jesus’s mother ([[Luke 11:27–28]]).'
findings:
  - claim: 'Beelzebub: a Philistine god; a title for Satan; Baalzebub in 2 Kgs. 1'
    key: bd-beelzebub
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beelzebub?lang=eng'
    quote: 'Name of a Philistine god. Used as a title for the “chief of the demons,” or Satan. … See also 2 Kgs. 1:1–6, where it is spelled Baalzebub.'
    by: matthew 12
  - claim: 'Matthew uses “son of David” nine times'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'he uses the title “son of David” for Jesus nine times (see Matthew 1:1; 9:27; 12:23; 15:22; 20:30–31; 21:9, 15; 22:42).'
    by: matthew 12
  - claim: 'The Beelzebub charge (Mark 3:22) was a legal allegation with dire implications; the miracles forced the question of power; Mosiah 3:9 foretold it'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'There was not a theological debate going on, then, but a legal investigation resulting in an allegation with dire legal implications.'
    by: matthew 12
  - claim: '“Your children” are the Pharisees’ exorcist disciples; the argument requires they cast out not by Beelzebub'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'Our Lord’s question, indeed, requires for its logical validity the admission that the “children” of the accusers did really cast out demons, and that not by Beelzebub.'
    by: matthew 12
  - claim: 'JST Matt. 12:23 (footnote 28c): they also cast out devils by the Spirit of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'JST Matt. 12:23 … you. For they also cast out devils by the Spirit of God, for unto them is given power over devils, that they may cast them out.'
    by: matthew 12
  - claim: 'The strong man is Satan, already subdued; no truce between Christ and Satan'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'how could Christ have done this had He not first subdued the “strong man,” the master of devils, Satan himself?'
    by: matthew 12
  - claim: 'Joseph Smith, 1844, on the sin against the Holy Ghost'
    key: jsp-discourse-1844-04-07
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-7-april-1844-as-published-in-times-and-seasons/5'
    quote: 'All sins shall be forgiven except the sin against the Holy Ghost: after a man has sinned against the Holy Ghost there is no repentance for him, he has got to say that the sun does not shine, while he sees it, he has got to deny Jesus Christ when the heavens were open to him'
    by: matthew 12
  - claim: 'JST Matt. 12:26 (footnote 31a): “unto men who receive me and repent”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'JST Matt. 12:26 … unto men who receive me and repent; but …'
    by: matthew 12
  - claim: 'Ascribing Christ’s power to Satan was very near blasphemy against the Holy Ghost'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Jesus was merciful in His assurance that words spoken against Himself as a Man, might be forgiven; but to speak against the authority He possessed, and particularly to ascribe that power and authority to Satan, was very near to blasphemy against the Holy Ghost'
    by: matthew 12
  - claim: 'Argos in Matt. 12:36: unprofitable, by litotes pernicious'
    key: thayer
    url: 'https://biblehub.com/greek/692.htm'
    quote: 'unprofitable, ῤῆμα ἀργόν, by litotes equivalent to pernicious (see ἄκαρπος): Matthew 12:36.'
    by: matthew 12
open:
  - 'What does Luke’s “finger of God” recall ([[Luke 11:20]]; [[Ex. 8:19]])?'
  - 'Why does Mark set the kinsmen’s “He is beside himself” beside the scribes’ charge ([[Mark 3:21–22]])?'
  - 'What does the woman’s blessing on Jesus’s mother, and His answer, mean in Luke ([[Luke 11:27–28]])?'
