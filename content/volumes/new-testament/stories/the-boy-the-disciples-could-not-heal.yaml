story: the-boy-the-disciples-could-not-heal
differences:
  - 'Mark tells it at length: the scribes questioning the disciples, the boy’s “dumb spirit,” the father’s “if thou canst do any thing,” Jesus’s “If thou canst believe,” the father’s cry “Lord, I believe; help thou mine unbelief,” and the boy left “as one dead” until Jesus lifted him ([[Mark 9:14–27]]).'
  - 'Matthew’s father calls the boy “lunatic” ([[Matt. 17:15]]); Luke says he was “mine only child” ([[Luke 9:38]]).'
  - 'Luke says it was “the next day,” when they came down from the hill ([[Luke 9:37]]).'
  - 'Only Matthew gives Jesus’s answer “Because of your unbelief” and the faith as a grain of mustard seed that moves a mountain ([[Matt. 17:20]]); Mark ends with “by prayer and fasting” ([[Mark 9:29]]); Luke has no private question and ends with the boy delivered to his father ([[Luke 9:42]]).'
findings:
  - claim: '“Lunatic”: literally moon-struck; to be epileptic'
    key: thayer
    url: 'https://biblehub.com/greek/4583.htm'
    quote: 'to be epileptic (epilepsy being supposed to return and increase with the increase of the moon): Matthew 4:24; Matthew 17:15.'
    by: matthew 17
  - claim: 'They returned the day after; the scribes had been disputing with the defensive disciples'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Jesus and the three apostles returned from the mount on the morrow following the Transfiguration; this fact suggests the assumption that the glorious manifestation had occurred during the night.'
    by: matthew 17
  - claim: 'The rebuke “faithless generation” was addressed primarily to the apostles'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'These words in which there is evident reproof, however mild and pitying it may be, were addressed primarily to the apostles; whether exclusively so or to them and others is of minor importance.'
    by: matthew 17
  - claim: 'Their failure brought ridicule from the scribes and cast doubt on their Lord’s power'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The disciples’ failure to heal the stricken youth had evidently brought upon them hostile criticism, taunts and ridicule from the unbelieving scribes'
    by: matthew 17
  - claim: 'Jesus asked for belief rather than faith of the father; the man saw the issue rested with himself'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The man’s understanding was enlightened; up to that moment he had thought that all depended upon Jesus; he now saw that the issue rested largely with himself.'
    by: matthew 17
  - claim: 'On their mission they had cast out spirits; now, a day without Him, they could not'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'While on their mission, though away from their Master’s helpful presence, they had successfully rebuked and cast out evil spirits as they had received special power and commission to do; but now, during His absence of a day they had found themselves unable.'
    by: matthew 17
  - claim: 'The mustard seed compares the quality of faith, not quantity'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The comparison between effective faith and a grain of mustard seed is one of quality rather than of quantity; it connotes living, virile faith, like unto the seed, however small, from which a great plant may spring'
    by: matthew 17
  - claim: 'Prayer and fasting: a greater intensity of spiritual life; the disciples did not yet fast'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/17.htm'
    quote: 'The disciples, we know, did not as yet fast (Matthew 9:14-15), and the facts imply that they had been weak and remiss in prayer.'
    by: matthew 17
  - claim: 'The critical text reads “little faith” (oligopistia) in Matthew 17:20, where the KJV has “unbelief”'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/17-20.htm'
    quote: 'oligopistian ὀλιγοπιστίαν little faith'
    by: matthew 17
open:
  - 'What is a “dumb and deaf spirit” in Mark, and why does Jesus command it to “enter no more into him” ([[Mark 9:25]])?'
  - 'What does “help thou mine unbelief” teach about belief and faith ([[Mark 9:24]])?'
  - 'Why does Luke stress that the boy was an only child and that Jesus “delivered him again to his father” ([[Luke 9:38]]; [[Luke 9:42]])?'
  - 'Matthew 17:21 is missing or bracketed in many modern translations; a writer who needs the textual question should find a readable source for it (none was read for Matthew 17).'
