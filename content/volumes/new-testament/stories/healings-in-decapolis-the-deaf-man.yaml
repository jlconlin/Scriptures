story: healings-in-decapolis-the-deaf-man
differences:
  - 'Matthew gives a summary of many healings on a mountain by the sea, ending “they glorified the God of Israel” ([[Matt. 15:29–31]]); Mark tells one healing, of a deaf man with a speech impediment ([[Mark 7:32–37]]).'
  - 'Only Mark names the route, “through the midst of the coasts of Decapolis” ([[Mark 7:31]]).'
  - 'Only Mark has the fingers in the ears, the spittle, the sigh and the Aramaic “Ephphatha” ([[Mark 7:33–34]]), and the charge to tell no one ([[Mark 7:36]]).'
findings:
  - claim: 'The crowds east of the lake were semi-pagan; these aliens glorified the God of Israel'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Though still among semi-pagan peoples, our Lord was greeted by great crowds, amongst whom were many lame, blind, dumb, maimed, and otherwise afflicted; and them He healed. Great was the astonishment of these aliens'
    by: matthew 15
  - claim: 'Decapolis: the ten cities, a region mostly east of the Jordan and south of the lake'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The name means “the ten cities,” and was applied to a region of indefinite boundaries lying mostly on the east of Jordan and southerly from the sea of Galilee.'
    by: matthew 15
  - claim: 'The touch to ears and tongue may have strengthened the man’s faith (Talmage’s suggestion)'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It may be that by the finger-touch to the closed ears and to the bound tongue, the man’s faith was strengthened and his confidence in the Master’s power increased.'
    by: matthew 15
  - claim: 'Matthew’s summary as a doxology of the multitude'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'Here we get a great aggregate of miracles, unrecorded in detail, working on the minds of the multitude, and leading them to repeated utterances of praise in the form of a doxology—they “glorified the God of Israel.”'
    by: matthew 15
open:
  - 'Why does Mark keep the Aramaic “Ephphatha” and explain it ([[Mark 7:34]])?'
  - 'Why the spittle and the sigh ([[Mark 7:33–34]]), and why the charge to tell no one in a Gentile region ([[Mark 7:36]])?'
  - 'Does “he maketh both the deaf to hear, and the dumb to speak” ([[Mark 7:37]]) echo [[Isa. 35:5–6]]? (Not researched.)'
