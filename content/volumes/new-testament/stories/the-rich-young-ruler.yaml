story: the-rich-young-ruler
differences:
  - 'Only Matthew calls him a “young man” ([[Matt. 19:20]]; [[Matt. 19:22]]); only Luke a “ruler” ([[Luke 18:18]]); Mark says he came running and kneeled ([[Mark 10:17]]).'
  - 'Matthew has “what good thing shall I do” and “Why callest thou me good?” ([[Matt. 19:16–17]]); Mark and Luke, “what shall I do” ([[Mark 10:17–18]]; [[Luke 18:18–19]]).'
  - 'Only Matthew has “Which?” and adds “Thou shalt love thy neighbour as thyself” to the commandments ([[Matt. 19:18–19]]); only Mark has “Defraud not” ([[Mark 10:19]]).'
  - 'Only Matthew has “what lack I yet?” and “If thou wilt be perfect” ([[Matt. 19:20–21]]); Mark and Luke have “One thing thou lackest” ([[Mark 10:21]]; [[Luke 18:22]]).'
  - 'Only Mark says Jesus “beholding him loved him” and adds “take up the cross” ([[Mark 10:21]]).'
  - 'Only Mark has “how hard is it for them that trust in riches” and calls the disciples “Children” ([[Mark 10:24]]).'
  - 'Only Matthew has the twelve thrones ([[Matt. 19:28]]; Luke has a like promise at the Last Supper, [[Luke 22:30]]). Only Mark has “now in this time … with persecutions” ([[Mark 10:30]]).'
  - 'Luke has no “first shall be last” here; Matthew and Mark do ([[Matt. 19:30]]; [[Mark 10:31]]).'
findings:
  - claim: '“Why callest thou me good?” is no denial of sinlessness; he used “good” as a polite compliment'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'This remark was no denial of sinlessness on the Savior’s part; the young man had called Him “good” by way of polite compliment rather than in recognition of His Godship'
    by: matthew 19
  - claim: 'The modern critical text of Matthew 19:17 reads “Why do you ask me about what is good? One is good”'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/19-17.htm'
    quote: 'Ti Τί Why … erōtas ἐρωτᾷς ask you … peri περὶ about … agathou ἀγαθοῦ ? good … heis εἷς Only One … estin ἐστιν is … agathos ἀγαθός . good'
    by: matthew 19
  - claim: 'Ruler may mean a synagogue official or a Sanhedrist; love of worldly things his besetting weakness; the remedy not for all cases'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Luke tells us that the young man was a ruler; this may mean that he was a presiding official in the local synagog or possibly a Sanhedrist.'
    by: matthew 19
  - claim: 'teleios (Matt. 19:21; 5:48): of character, one who has reached the proper height of virtue'
    key: thayer
    url: 'https://biblehub.com/greek/5046.htm'
    quote: 'of mind and character, one who has reached the proper height of virtue and integrity: Matthew 5:48; Matthew 19:21'
    by: matthew 19
  - claim: 'Camel and needle a proverbial figure; rope reading and needle’s-eye gate reported; Lord’s exposition sufficient'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'There was a “common Jewish proverb, that a man did not even in his dreams see an elephant pass through the eye of a needle” (Edersheim).'
    by: matthew 19
  - claim: 'Wealth no insuperable barrier; the young man’s riches could have made great service possible'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'while wealth is a means of temptation to which many succumb, it is no insuperable obstacle, no insurmountable barrier, in the way of entrance to the kingdom.'
    by: matthew 19
  - claim: 'JST Matthew 19:26 and JST Mark 10:26 (footnotes): possible for those who forsake all and trust in God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/10?lang=eng'
    quote: 'JST Mark 10:26 … With men that trust in riches, it is impossible; but not impossible with men who trust in God and leave all for my sake, for with such all these things are possible.'
    by: matthew 19
  - claim: 'paliggenesia in Matt. 19:28: restoration of all things to their primal perfect state, expected with the Messiah; JST Matt. 19:28 reads “resurrection”'
    key: thayer
    url: 'https://biblehub.com/greek/3824.htm'
    quote: 'that restoration of the primal and perfect condition of things which existed before the fall of our first parents," which the Jews looked for in connection with the advent of the Messiah'
    by: matthew 19
  - claim: 'The Twelve judge Israel: D&C 29:12; Mormon 3:18–19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/3?lang=eng'
    quote: 'twelve tribes of Israel, who shall be judged according to your works by the twelve whom Jesus chose to be his disciples in the land of Jerusalem.'
    by: matthew 19
  - claim: '“First shall be last” added as caution lest they count on the reward and grow proud'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Lest those to whom they were promised might count too surely upon successful attainment, to the neglect of effort, and become proud withal, the Lord added this profound precept of caution'
    by: matthew 19
  - claim: '“Defraud not” peculiar to Mark; an application of the tenth commandment to a man of great possessions'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'Peculiar to St. Mark. It seems as if intended to be a special application of the Tenth Commandment.'
    by: mark 10
  - claim: '“Beholding him loved him” Mark only; the love shown in the steadfast look'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'Better, looking, or gazing on him. The fact is narrated by St. Mark only, and implies that the love showed itself in the stedfast look'
    by: mark 10
  - claim: 'The hundredfold not literal: relationships multiply; “with persecutions” (Mark only) reminds that trials are inseparable from the kingdom'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/19.htm'
    quote: 'They are reminded that persecution in some shape, the trials that test and strengthen, is inseparable from the higher life of the kingdom.'
    by: mark 10
  - claim: 'archōn: many kinds of official; a synagogue official or member of a local sanhedrin'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'The Greek term archōn embraces a wide range of official positions in Jesus’ world and points to none in particular, although it can refer to a synagogue official or to a member of a local sanhedrin.'
    by: luke 18
  - claim: 'JST Luke 18:27 (appendix): impossible for those who trust in riches; possible for one who forsakes the world'
    key: jst-luke-18
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/18?lang=eng'
    quote: 'It is impossible for them who trust in riches, to enter into the kingdom of God; but he who forsaketh the things which are of this world, it is possible with God, that he should enter in.'
    by: luke 18
  - claim: 'Zacchaeus (Luke 19:1–10) the proof that a person of wealth can be saved'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-18-104'
    quote: 'the following story of Jesus’ interaction with the chief publican Zacchaeus will stand as an obvious proof that a person of wealth can receive salvation (see 19:1–10).'
    by: luke 18
open:
  - 'Why does Mark alone say Jesus “loved him” ([[Mark 10:21]]), and what does that change in reading the refusal?'
  - 'What does “an hundredfold now in this time … with persecutions” mean ([[Mark 10:30]])?'
  - 'Why does Mark add “Defraud not” ([[Mark 10:19]])?'
