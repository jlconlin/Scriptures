story: the-last-supper-the-passover-prepared-and-the-betrayer-named
differences:
  - 'Matthew sends the disciples “to such a man” ([[Matt. 26:18]]); Mark and Luke have a man bearing a pitcher of water and a large upper room furnished ([[Mark 14:13–15]]; [[Luke 22:10–12]]); Luke names Peter and John as the two sent ([[Luke 22:8]]).'
  - 'Only Matthew has Judas ask “Master, is it I?” and Jesus answer “Thou hast said” ([[Matt. 26:25]]). John has the beloved disciple ask, and Jesus give the sop to Judas ([[John 13:23–27]]).'
  - 'Luke places the naming of the betrayer after the bread and cup ([[Luke 22:21–23]]); Matthew and Mark before.'
  - 'John places the supper “before the feast of the passover” ([[John 13:1]]), and the leaders have not yet eaten the Passover the next morning ([[John 18:28]]).'
findings:
  - claim: 'The Synoptics present a Passover meal; John has Passover begin the next evening'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John, however, maintains that Passover actually began at sunset the next day, following Jesus’s crucifixion (John 13:1; 18:28, 39; 19:31, 42), making the Last Supper not a Passover meal'
    by: matthew 26
  - claim: 'In John’s timing Jesus dies as the paschal lambs are sacrificed'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'this chronology has the paschal lambs being sacrificed in the temple between noon and three o’clock in the afternoon before Passover started as Jesus is being crucified and then dies on the cross.'
    by: matthew 26
  - claim: 'The lamb was slaughtered on Nisan 14, before the festival began'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the lamb or goat for a family grouping was not slaughtered on the first day of Passover (Nisan 15 in the Jewish calendar), but in the afternoon before the festival began (Nisan 14).'
    by: matthew 26
  - claim: 'One possibility: Jesus held the Passover, or a Passover-like meal, early'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John’s chronology is correct in regard to the actual timing of Passover but that Jesus chose to celebrate the Passover, or at least a Passover-like meal, early, knowing that he would be dead and buried when the feast actually occurred the next day.'
    by: matthew 26
  - claim: 'The safest position may be to suspend judgment and appreciate both symbolisms'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'While the safest position may well be to suspend judgment and appreciate the respective symbolism of the Synoptic Gospels—namely, that the Lord’s Supper incorporates Passover symbolism and symbolized a new covenant that fulfilled it—and the Johannine symbolism, which portrays Christ as the Lamb of God'
    by: matthew 26
  - claim: 'Elder Holland calls the meal a final, specially prepared Passover supper'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'As a final and specially prepared Passover supper was ending, Jesus took bread, blessed and broke it'
    by: matthew 26
  - claim: 'Jesus observed the essentials of the Passover'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'At this solemn meal Jesus appears to have observed the essentials of the Passover procedure'
    by: matthew 26
  - claim: 'Each who asked feared he might be the offender rather than suspecting another'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'each of those who so inquired was more concerned with the dread thought that possibly he was an offender, however inadvertently so, than as to whether his brother was about to prove himself a traitor.'
    by: matthew 26
  - claim: 'Judas asked lest silence arouse suspicion'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'who at this moment probably feared that silence might arouse suspicion against himself'
    by: matthew 26
  - claim: 'Judas calls Him Rabbi'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/26.htm'
    quote: 'he calls Him by the wonted title of honour, Rabbi'
    by: matthew 26
  - claim: 'The answer was not heard by all'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/26.htm'
    quote: 'It would appear from St. John’s narrative (John 13:29) that the dread answer, “Thou hast said;” was not heard by all.'
    by: matthew 26
  - claim: 'The appointment that Christ suffer did not make men less free or less guilty'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/26.htm'
    quote: 'It was appointed that the Christ should suffer, but that appointment did not make men less free agents, nor diminish the guilt of treachery or injustice.'
    by: matthew 26
  - claim: 'John has no sacrament at the supper, perhaps because he had given its symbolism in John 6, or kept paschal imagery for the crucifixion'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John may have omitted it because he had already recorded Jesus’s use of its symbolism in the discourse on the bread of life'
    by: john 13
  - claim: 'A commemorative sacrament may have mattered less to John until the sacrifice was made'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Perhaps for John, who focused so single-mindedly on the death of Jesus as a sacrifice, the symbolism of the sacrament, which is above all commemorative, was not as significant until Jesus was actually sacrificed.'
    by: john 13
  - claim: 'Huntsman’s three explanations of John’s timing, with John’s judged the more historical'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John’s version bears more historical verisimilitude, since it was unlikely that an arrest, trial, and execution would have taken place during the festival itself'
    by: john 13
open:
  - 'Why does Luke have Jesus say “With desire I have desired to eat this passover with you” ([[Luke 22:15]])?'
  - 'What is the sign of the man with the pitcher ([[Mark 14:13]])?'
  - 'Why does John give the washing of feet at the supper, and no bread and cup ([[John 13:1–17]])?'
