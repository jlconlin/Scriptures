story: the-temptation-in-the-wilderness
differences:
  - 'Mark gives no temptations, only that the Spirit “driveth” Jesus into the wilderness, that He was there forty days “with the wild beasts,” and that angels ministered to Him ([[Mark 1:12–13]]).'
  - 'Matthew and Luke give the same three temptations in a different order: Matthew ends on the mountain ([[Matt. 4:8–10]]), Luke at the pinnacle of the temple ([[Luke 4:9–12]]).'
  - 'Only Luke has the devil claim the kingdoms are “delivered unto me; and to whomsoever I will I give it” ([[Luke 4:6]]), and only Luke says he departed “for a season” ([[Luke 4:13]]).'
  - 'Matthew says Jesus fasted “forty days and forty nights” ([[Matt. 4:2]]); Luke says He was tempted forty days and “did eat nothing” ([[Luke 4:2]]).'
  - 'Matthew’s Jesus says “Get thee hence, Satan” ([[Matt. 4:10]]); Luke’s, “Get thee behind me, Satan” ([[Luke 4:8]]).'
findings:
  - claim: 'JST Matthew 4: led of the Spirit “to be with God”; the Spirit, not Satan, sets Him on the pinnacle and takes Him to the mountain; the appendix notes similar changes in Luke 4:2, 5–11'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'Jesus is led by the Spirit, not by Satan. … Then Jesus was led up of the Spirit, into the wilderness, to be with God.'
    by: matthew 4
  - claim: 'JST Matt. 4:2 (footnote): after communing with God He was left to be tempted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'and had communed with God, he was afterwards an hungered, and was left to be tempted of the devil.'
    by: matthew 4
  - claim: 'JST Matt. 4:11: Jesus sent angels to minister to John in prison'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'And now Jesus knew that John was cast into prison, and he sent angels, and, behold, they came and ministered unto him.'
    by: matthew 4
  - claim: 'The “if” meant to make the Son doubt the Father’s acknowledgment; power not for personal gratification'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'The Eternal Father had proclaimed Jesus as His Son; the devil tried to make the Son doubt that divine relationship.'
    by: matthew 4
  - claim: 'Elder Hunter: the second temptation was to a dazzling feat that would draw crowds; faith precedes the miracle'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'the temptation to perform some dazzling feat, some astounding exploit which might bring crowds of amazed and attentive onlookers. … But faith is to precede the miracle; miracles are not to precede the faith.'
    by: matthew 4
  - claim: 'Satan tempted Jesus to tempt the Father; God alone decides when His wonders are wrought'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'Satan tempted Jesus to tempt the Father. … God alone must decide when and how His wonders shall be wrought.'
    by: matthew 4
  - claim: 'Christ was sinless yet peccable; the test was real'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'Had there been no possibility of His yielding to the lures of Satan, there would have been no real test in the temptations, no genuine victory in the result. Our Lord was sinless yet peccable'
    by: matthew 4
  - claim: 'Temptations continued through the ministry, to Gethsemane (on Luke’s “for a season”)'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'That His temptations extended even to the agony in Gethsemane will appear as we proceed with this study.'
    by: matthew 4
  - claim: 'Elder Hunter: the kingdoms were not Satan’s to give (answers Luke 4:6)'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'Though they were not his to give, Satan offered them all to Jesus'
    by: matthew 4
  - claim: 'Elder Hunter: the “if” foreshadows Matt. 27:40; faith precedes the miracle; victorious as a man'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'But faith is to precede the miracle; miracles are not to precede the faith.'
    by: matthew 4
  - claim: 'Moses 1 parallel: both with God, then confronted by Satan; Moses needed the name of the Only Begotten'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'In the first set, both went into a place apart to spend time with God in preparation for their appointed missions (see Moses 1:1–11 and Joseph Smith—Matthew 4:1).'
    by: matthew 4
  - claim: 'Moses fasted forty days; Jesus too (new Moses)'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Moses fasted for forty days while on Mount Sinai (Exodus 34:28); Jesus also fasted for forty days in the wilderness (see Matthew 4:1–2).'
    by: matthew 4
  - claim: 'The testing recalls Israel’s in Deuteronomy (Matthew); Luke ends at the temple because of his Jerusalem emphasis'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'whereas Matthew concludes the Savior’s triumph over the temptations on a high mountain in the wilderness (see Matthew 4:8–10), Luke’s account culminates with the Savior at Herod’s Temple in Jerusalem (see Luke 4:9–12).'
    by: matthew 4
  - claim: 'Luke: the Spirit led Jesus into the wilderness to triumph over Satan, part of Luke’s emphasis on the Spirit'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'The Spirit led Jesus into the wilderness to triumph over Satan (see Luke 4:1).'
    by: matthew 4
  - claim: 'The pinnacle: southeast corner traditional (over 400 ft drop to the Kidron); some prefer the southwest corner'
    key: ogden-jesus-temple
    url: 'https://www.churchofjesuschrist.org/study/ensign/1991/04/jesus-and-the-temple?lang=eng'
    quote: 'The southeastern corner is the traditional candidate for the Pinnacle of the Temple. It is the highest point along the whole length of the walls of the Temple Mount'
    by: matthew 4
  - claim: 'Thayer: ekballō at Mark 1:12, to lead one away with a force he cannot resist'
    key: thayer
    url: 'https://biblehub.com/greek/1544.htm'
    quote: 'to lead one forth or away somewhere with a force which he cannot resist: Mark 1:12.'
    by: mark 1
  - claim: 'Smith: the verb in Mark 1:12 is the Septuagint’s for Adam and Eve cast out (Gen. 3:24)'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'using the same verb found in the Septuagint (second-century BC Greek translation of the Old Testament) when Adam and Eve were cast out of the garden after the Fall (Gen. 3:24).'
    by: mark 1
  - claim: 'Ellicott: the wild beasts (peculiar to Mark) and Psalm 91:13'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/1.htm'
    quote: 'partly that their presence added to the terrors of the Temptation, partly that in His being protected from them there was the fulfilment of the promise in the very Psalm which furnished the Tempter with his chief weapon'
    by: mark 1
  - claim: 'Smith reads the wild beasts as comfort to Christians in Rome after AD 64'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'who might literally be thrown to the lions in the arena.'
    by: mark 1
  - claim: 'JST Luke 4:2: the devil came after the forty days (answers the open question on JST Luke 4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'JST Luke 4:2 And after forty days, the devil came unto him, to tempt him.'
    by: luke 4
  - claim: 'JST Luke 4:5, 9: the Spirit, not the devil, takes Him to the mountain and to Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'JST Luke 4:9 And the Spirit brought him to Jerusalem, and set him on a pinnacle of the temple. And the devil came unto him, and said'
    by: luke 4
  - claim: 'Brown: the JST clarifies that the devil does not approach Jesus during the forty days'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The substituted words clarify that the devil does not approach Jesus during the forty days, in contrast to Luke’s notation.'
    by: luke 4
  - claim: 'Brown: Luke’s “for a season” is “until a (certain) time” (kairos), pointing to the devil’s return through Judas (Luke 22:3)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'the phrase translated “for a season” means “until a (certain) time” with the term for “season” (Greek kairos) having to do with a critical or decisive moment'
    by: luke 4
  - claim: 'Brown: Luke’s last temptation in Jerusalem anticipates the final trial there'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'For Luke, Jesus’ final temptation takes place in Jerusalem just as Jesus’ final trial of facing suffering and death will take place here.'
    by: luke 4
  - claim: 'Brown: exousia (“power,” Luke 4:6) is the devil’s claim of authority, resolved later in synagogues'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Significantly—and this point is most important—Jesus resolves the question of who truly holds authority and power later, inside synagogues'
    by: luke 4
  - claim: 'Brown: “It is said” (Luke 4:12) points to the living voice of God; the law outweighs the Psalms'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'He thus makes his point more vivid, as if he is drawing directly from the living, revealing voice of God, thus placing his answer on a higher level than the written and sung words of the Psalms'
    by: luke 4
open:
  - 'Why does Mark say Jesus was “with the wild beasts” ([[Mark 1:13]]), and why “driveth”?'
  - 'Why does Luke place the genealogy between the baptism and the temptation ([[Luke 3:23–38]])?'
