story: the-death-of-jesus
differences:
  - 'Matthew and Mark give the cry from Psalm 22 ([[Matt. 27:46]] “Eli, Eli”; [[Mark 15:34]] “Eloi, Eloi”) and the bystanders’ “Elias”; Luke gives “Father, into thy hands I commend my spirit” ([[Luke 23:46]]); John “I thirst” and “It is finished” ([[John 19:28–30]]). The Joseph Smith Translation of Matthew gives the last cry as “Father, it is finished, thy will is done” (JST Matt. 27:54, footnote).'
  - 'Only Matthew has the earthquake, the rocks rent, the graves opened and the saints who “came out of the graves after his resurrection” ([[Matt. 27:51–53]]). Luke places the rending of the veil before Jesus’s death ([[Luke 23:45]]); John does not mention it.'
  - 'The centurion: “Truly this was the Son of God,” after the earthquake, with those with him ([[Matt. 27:54]]); “Truly this man was the Son of God,” on seeing how He died ([[Mark 15:39]]); “Certainly this was a righteous man” ([[Luke 23:47]]). John has instead the breaking of the legs and the spear ([[John 19:31–37]]).'
  - 'The women: Matthew names Mary Magdalene, Mary the mother of James and Joses, and the mother of Zebedee’s children; Mark has Salome for the third; Luke names none here; John places Jesus’s mother, her sister, Mary the wife of Cleophas and Mary Magdalene by the cross, with the beloved disciple ([[John 19:25–27]]).'
  - 'Matthew, Mark and Luke have darkness over the land from the sixth hour until the ninth ([[Matt. 27:45]]; [[Mark 15:33]]; [[Luke 23:44]], which adds “the sun was darkened”); John has none.'
  - 'In Mark one man runs with the sponge of vinegar and himself says “Let alone; let us see whether Elias will come to take him down” ([[Mark 15:36]]); in Matthew one runs and “the rest” say “Let be” ([[Matt. 27:48–49]]); in John Jesus says “I thirst” and the vinegar is put on hyssop ([[John 19:28–29]]).'
findings:
  - claim: 'Not an eclipse; Passover at full moon; the earth’s mourning'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'It could not have been due to a solar eclipse, as has been suggested in ignorance, for the time was that of full moon'
    by: matthew 27
  - claim: 'Old Testament precedents for the darkness; Book of Mormon and latter-day authorities: the Light of the World ebbing out'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'this darkness represented that the life of Jesus, the Light of the World, was ebbing out.'
    by: matthew 27
  - claim: 'The cry: the agony of Gethsemane recurred; the Father withdrew His immediate presence'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'the Father seems to have withdrawn the support of His immediate Presence, leaving to the Savior of men the glory of complete victory over the forces of sin and death.'
    by: matthew 27
  - claim: 'Elder Holland: the Father did not forsake the Son but withdrew His Spirit and presence (also on the site at Psalm 22:1)'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'the Father briefly withdrew from Jesus the comfort of His Spirit, the support of His personal presence.'
    by: matthew 27
  - claim: 'aphiēmi to pneuma: to yield up, expire'
    key: thayer
    url: 'https://biblehub.com/greek/863.htm'
    quote: 'b. to send forth, yield up, emit: τό πνεῦμα, to expire, Matthew 27:50'
    by: matthew 27
  - claim: 'His life was not taken except as He willed'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'His life had not been taken from Him except as He had willed to permit.'
    by: matthew 27
  - claim: 'The veil torn from above by God; Christ the High Priest entered by His own blood'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'indicating that God tore it from above rather than it being destroyed by any human agency'
    by: matthew 27
  - claim: 'Matthew’s earthquake explains the centurion’s reaction'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'his reaction explained by Matthew’s addition that at Jesus’s death a sudden earthquake struck.'
    by: matthew 27
  - claim: 'In the Synoptics Jesus is largely alone; women watch from afar. John has women at the cross'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the Synoptic Gospels portray Jesus as being largely alone at the cross, with only a handful of his female followers from Galilee watching from a distance'
    by: matthew 27
  - claim: 'The women stayed as close as they could'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'Especially and always the blessed women in the Savior’s life stayed as close to Him as they could.'
    by: matthew 27
  - claim: 'John’s hyssop recalls the first Passover'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Because the hyssop had been used to paint the doorposts of the Israelites’ homes with the blood of the first Passover (Exod 12:22), John seems to be yet again emphasizing the paschal aspect of Jesus’s sacrifice on the cross.'
    by: matthew 27
  - claim: 'The sixth hour is noon'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'According to the Synoptics, at noon, or “the sixth hour,” darkness fell upon the land'
    by: mark 15
  - claim: 'The darkness lasted from noon to 3 p.m.'
    key: mcconkie-gethsemane-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/the-purifying-power-of-gethsemane?lang=eng'
    quote: 'from noon to 3:00 p.m., all the infinite agonies and merciless pains of Gethsemane recurred.'
    by: mark 15
  - claim: '“Gave up the ghost” is ekpneō, breathed His last'
    key: thayer
    url: 'https://biblehub.com/greek/1606.htm'
    quote: 'to breathe out, breathe out one''s life, breathe one''s last, expire: Mark 15:37, 39'
    by: mark 15
  - claim: 'The veil was most likely the inner curtain'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'There is some debate as to whether Mark is describing the inner or outer curtain of the temple. The weight of evidence implies that it is the inner curtain'
    by: mark 15
  - claim: 'Elijah is not at the cross; what is there is Jesus’s unanswered plea that sounds like a call to Elijah'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Elijah is not, in fact, present at the cross—what is present is Jesus’s unanswered plea to God that sounds like a call to Elijah.'
    by: mark 15
  - claim: 'The crowd confuses Eloi and Eliyahu; John fulfills Elijah’s role'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'the crowd confuses Eloi [“God”] with Eliyahu [“Elijah”]'
    by: mark 15
  - claim: 'The veil barred the Holy of Holies; its rending opens access to all'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Its rending signifies that this most sacred of spaces is now accessible to all people because of Jesus’s death. The barrier between God and humans has been torn asunder.'
    by: mark 15
  - claim: 'Mark implies Jesus’s death is the day of atonement'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Via the ripping of the veil, Mark implies that Jesus’s death is the day of atonement7 and that his death has an atoning effect.'
    by: mark 15
  - claim: 'The passive verb, often used of divine action; the tear starts at the top'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Mark may imply that God has ripped the veil because the rip starts at the top of the curtain and because it is described with a passive verb form, something often used to connote divine action.'
    by: mark 15
  - claim: 'Only Mark keeps the paradox of a Gentile soldier recognizing the Son of God in a humiliating death; Mark has no earthquake'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Only Mark contains the paradoxical image of a Gentile—a Roman soldier—realizing that the humiliating death of a political prisoner could be the death of the Son of God.'
    by: mark 15
  - claim: 'Only after the death does Mark reveal women were disciples and ministers all along'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'It is only now, after Jesus’s death, that we find out that there were women present all along, being disciples and engaging in ministry,24 a reality that Mark had largely hidden from the audience’s view.'
    by: mark 15
  - claim: 'Diakoneō used for the angels (1:13), Peter’s mother-in-law (1:31), Jesus’s mission (10:45)'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'This verb for “ministered” is used two times elsewhere in Mark: for Simon’s mother-in-law after Jesus has healed her (see Mark 1:31) and by Jesus to describe his own mission (see Mark 10:45).'
    by: mark 15
  - claim: 'Luke’s centurion gives another Roman verdict of innocence, matching Pilate, Herod and the criminal; dikaios can mean just or righteous'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'In a word, this expression of the centurion effectively offers another verdict of Rome on Jesus, that is, that he is innocent'
    by: luke 23
  - claim: 'Not an eclipse: impossible at the Passover full moon'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'But it is a mistake to think of an eclipse here because such an event is impossible at the time of the Passover full moon.'
    by: luke 23
  - claim: '“Into thy hands” is Psalm 31:5; beside John 19:30 and JST Matt. 27:54 it shows the Father’s will supreme'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'In Luke’s quotation, Jesus utters the words of Psalm 31:5 (Hebrew text). It becomes evident that, until the last moment of his life, Jesus holds the Father’s will as supreme over his own.'
    by: luke 23
  - claim: 'Smiting the breast is the publican’s sign of repentance (Luke 18:13)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'It is the publican who, in an act that signals his humility and contrition, smites himself, a clear sign of repentance. So it is here.'
    by: luke 23
  - claim: 'Possible meanings of the torn veil; the passive implies God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-23-104'
    quote: 'The rupturing of the veil, understood symbolically, possibly points to (1) an act of mourning, a tearing of clothing, for the dying Messiah; (2) a bridging of the barrier'
    by: luke 23
  - claim: 'Dikaios on a Gentile''s lips of Christ means innocent, guiltless (Matt. 27:19, 24; Luke 23:47)'
    key: thayer
    url: 'https://biblehub.com/greek/1342.htm'
    quote: 'the negative idea predominating: innocent, faultless, guiltless … thus used of Christ in the speech of Gentiles: Matthew 27:19, 24'
    by: luke 23
  - claim: 'Luke''s “righteous man” may give the exact measure of what the centurion meant by “the Son of God”'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'may, perhaps, have originated in a wish to express the exact measure, and not more, of the sense in which the centurion had used the seemingly higher words'
    by: luke 23
  - claim: '“Into thy hands” speaks not of abandonment but of trust, and is from the Psalms'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/23.htm'
    quote: 'those which seemed to them to speak, not of abandonment, but of an absolute and unshaken trust. It is remarkable that this, like the cry of apparent despair, is a quotation from the Psalms'
    by: luke 23
  - claim: 'Tetelestai: everything appointed by the Father in the Scriptures has been accomplished'
    key: thayer
    url: 'https://biblehub.com/greek/5055.htm'
    quote: 'τετέλεσται (A. V. it is finished) everything has been accomplished which by the appointment of the Father as revealed in the Scriptures I must do and bear, John 19:30.'
    by: john 19
  - claim: 'Elder Hales: “It is finished” and “Father, into thy hands” were a prayer to the Father'
    key: hales-gaining-testimony
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/gaining-a-testimony-of-god-the-father-his-son-jesus-christ-and-the-holy-ghost?lang=eng'
    quote: 'He completed the work He had been sent to do. Therefore, we do not wonder to whom He was talking when, upon the cross, “he said, It is finished,”'
    by: john 19
  - claim: 'John’s women: three or four; the balance favors four in two pairs'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The question cannot be answered with certainty; but upon the whole, the balance of evidence inclines to the view that we have four persons here mentioned in two pairs'
    by: john 19
  - claim: 'Blood and water: blood from His mortal mother, water His divine life from the Father'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Due to His mortal inheritance from His mother, Mary, represented by the flowing blood, Jesus was able to lay down His life as a sacrifice for sin.'
    by: john 19
  - claim: 'Leg-breaking was little associated with crucifixion; the spear has support in Quintilian'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'That the Romans broke people’s legs as a form of severe punishment is well attested, but there is little evidence to suggest that it was associated with crucifixion—probably because crucifixion was not meant to be sped up.'
    by: john 19
  - claim: 'The unbroken bones: Psalm 34 and the Paschal Lamb’s requirement'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'not breaking any bones was a particular requirement of the Paschal Lamb, one that was as significant as the prerequisite that the Paschal Lamb, like Jesus, be without blemish'
    by: john 19
open:
  - 'What does “It is finished” mean ([[John 19:30]])? Elder Robert D. Hales, April 2008, is a lead.'
  - 'Why does John stress the blood and water and the unbroken bones ([[John 19:34–37]])?'
  - 'Who are the women in John’s list, and how is it punctuated ([[John 19:25]])? Huntsman and Hatch, para. 119.'
