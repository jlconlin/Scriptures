story: the-death-of-jesus
differences:
  - 'Matthew and Mark give the cry from Psalm 22 ([[Matt. 27:46]] “Eli, Eli”; [[Mark 15:34]] “Eloi, Eloi”) and the bystanders’ “Elias”; Luke gives “Father, into thy hands I commend my spirit” ([[Luke 23:46]]); John “I thirst” and “It is finished” ([[John 19:28–30]]). The Joseph Smith Translation of Matthew gives the last cry as “Father, it is finished, thy will is done” (JST Matt. 27:54, footnote).'
  - 'Only Matthew has the earthquake, the rocks rent, the graves opened and the saints who “came out of the graves after his resurrection” ([[Matt. 27:51–53]]). Luke places the rending of the veil before Jesus’s death ([[Luke 23:45]]); John does not mention it.'
  - 'The centurion: “Truly this was the Son of God,” after the earthquake, with those with him ([[Matt. 27:54]]); “Truly this man was the Son of God,” on seeing how He died ([[Mark 15:39]]); “Certainly this was a righteous man” ([[Luke 23:47]]). John has instead the breaking of the legs and the spear ([[John 19:31–37]]).'
  - 'The women: Matthew names Mary Magdalene, Mary the mother of James and Joses, and the mother of Zebedee’s children; Mark has Salome for the third; Luke names none here; John places Jesus’s mother, her sister, Mary the wife of Cleophas and Mary Magdalene by the cross, with the beloved disciple ([[John 19:25–27]]).'
findings:
  - claim: 'Not an eclipse; Passover at full moon; the earth’s mourning'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'It could not have been due to a solar eclipse, as has been suggested in ignorance, for the time was that of full moon'
    by: matthew 27
  - claim: 'Old Testament precedents for the darkness; Book of Mormon and latter-day authorities: the Light of the World ebbing out'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'this darkness represented that the life of Jesus, the Light of the World, was ebbing out.'
    by: matthew 27
  - claim: 'The cry: the agony of Gethsemane recurred; the Father withdrew His immediate presence'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'the Father seems to have withdrawn the support of His immediate Presence, leaving to the Savior of men the glory of complete victory over the forces of sin and death.'
    by: matthew 27
  - claim: 'Elder Holland: the Father did not forsake the Son but withdrew His Spirit and presence (also on the site at Psalm 22:1)'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'the Father briefly withdrew from Jesus the comfort of His Spirit, the support of His personal presence.'
    by: matthew 27
  - claim: 'aphiēmi to pneuma: to yield up, expire'
    key: thayer
    url: 'https://biblehub.com/greek/863.htm'
    quote: 'b. to send forth, yield up, emit: τό πνεῦμα, to expire, Matthew 27:50'
    by: matthew 27
  - claim: 'His life was not taken except as He willed'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'His life had not been taken from Him except as He had willed to permit.'
    by: matthew 27
  - claim: 'The veil torn from above by God; Christ the High Priest entered by His own blood'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'indicating that God tore it from above rather than it being destroyed by any human agency'
    by: matthew 27
  - claim: 'Matthew’s earthquake explains the centurion’s reaction'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'his reaction explained by Matthew’s addition that at Jesus’s death a sudden earthquake struck.'
    by: matthew 27
  - claim: 'In the Synoptics Jesus is largely alone; women watch from afar. John has women at the cross'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the Synoptic Gospels portray Jesus as being largely alone at the cross, with only a handful of his female followers from Galilee watching from a distance'
    by: matthew 27
  - claim: 'The women stayed as close as they could'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'Especially and always the blessed women in the Savior’s life stayed as close to Him as they could.'
    by: matthew 27
  - claim: 'John’s hyssop recalls the first Passover'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Because the hyssop had been used to paint the doorposts of the Israelites’ homes with the blood of the first Passover (Exod 12:22), John seems to be yet again emphasizing the paschal aspect of Jesus’s sacrifice on the cross.'
    by: matthew 27
open:
  - 'What does “It is finished” mean ([[John 19:30]])? Elder Robert D. Hales, April 2008, is a lead.'
  - 'Why does Luke say “a righteous man” where Matthew and Mark say “the Son of God” ([[Luke 23:47]])?'
  - 'Why does John stress the blood and water and the unbroken bones ([[John 19:34–37]])?'
  - 'Who are the women in John’s list, and how is it punctuated ([[John 19:25]])? Huntsman and Hatch, para. 119.'
