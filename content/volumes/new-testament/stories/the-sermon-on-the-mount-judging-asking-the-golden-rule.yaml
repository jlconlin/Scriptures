story: the-sermon-on-the-mount-judging-asking-the-golden-rule
differences:
  - 'Luke follows “Judge not” with “condemn not” and “forgive,” then “Give, and it shall be given unto you” with a measure “pressed down, and shaken together, and running over” given “into your bosom” ([[Luke 6:37–38]]); Matthew has only judging and the returning measure ([[Matt. 7:1–2]]).'
  - 'Luke sets the blind leading the blind and “the disciple is not above his master” between the measure and the mote and beam ([[Luke 6:39–40]]); Matthew has the blind leading the blind elsewhere, of the Pharisees ([[Matt. 15:14]]).'
  - 'Luke has the golden rule among the commands to love enemies ([[Luke 6:31]], within 6:27–36); Matthew has it after ask, seek, knock, joined by “Therefore” and closed by “for this is the law and the prophets” ([[Matt. 7:12]]), which Luke lacks.'
  - 'Only Matthew has, in this sermon, holy things before dogs and pearls before swine ([[Matt. 7:6]]) and ask, seek, knock with the bread and the stone ([[Matt. 7:7–11]]); Luke has ask, seek, knock in another setting, adding the egg and the scorpion and ending with “the Holy Spirit” where Matthew has “good things” ([[Luke 11:9–13]]).'
  - 'In Luke the man with the mote is addressed “Brother” ([[Luke 6:42]]).'
findings:
  - claim: 'Two kinds of judging: final, which we are forbidden to make, and intermediate, made on righteous principles'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'There are two kinds of judging: final judgments, which we are forbidden to make, and intermediate judgments, which we are directed to make, but upon righteous principles.'
    by: matthew 7
  - claim: 'Elder Oaks quotes Luke 6:37 and calls forgiveness the companion principle of “judge not”'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'Sixth, forgiveness is a companion principle to the commandment that in final judgments we judge not and in intermediate judgments we judge righteously. The Savior taught, “Judge not, and ye shall not be judged: condemn not, and ye shall not be condemned: forgive, and ye shall be forgiven” (Luke 6:37).'
    by: matthew 7
  - claim: 'In John 8 “condemn” apparently refers to the final judgment'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'In this context the word condemn apparently refers to the final judgment (see John 3:17).'
    by: matthew 7
  - claim: 'Luke 6:37–38: condemning belongs to God; disciples act mercifully and forgive'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'A true disciple understands that judgment and condemnation are the purview of a God who knows all things. As mortals, we must not condemn others; instead, we ought to act mercifully, offering forgiveness even for actions which we may feel strongly are wrong.'
    by: matthew 7
  - claim: 'The measure: judgment for those who condemn and withhold forgiveness, mercy for those who forgive'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'If we choose to judge and condemn others, holding grudges and withholding forgiveness, he will treat with a similar judgment. Yet if we offer our forgiveness and mercy to all, he will shower us with mercy and forgiveness as well.'
    by: matthew 7
  - claim: 'Luke 6:37: the Greek is an emphatic negation, “ye shall absolutely not be judged”'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'The combination of the ou and me with the aorist passive subjunctive forms a construction known as “emphatic negation.” Jesus is not merely predicting that the disciples will not be condemned or judged, he is stating that they will absolutely not be judged or condemned.'
    by: matthew 7
  - claim: '“Into your bosom”: the fold of the robe over the chest, used as a pocket'
    key: ellicott-luke
    url: 'https://biblehub.com/commentaries/ellicott/luke/6.htm'
    quote: 'Into your bosom.—The large fold of an Eastern dress over the chest, often used as a pocket.'
    by: matthew 7
  - claim: 'Luke’s golden rule (6:31) and its setting: Jesus raises the common reciprocal ideal to a vertical relationship with God'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'In verses 32–34, Jesus takes this idea to a new level and introduces a reciprocal, vertical relationship between man and God. In other words, the way we treat others dramatically impacts the way God will treat us.'
    by: matthew 7
  - claim: 'Whether others reciprocate mercy or not, God will'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'Whether other people reciprocate our mercy or not, God always will.'
    by: matthew 7
  - claim: 'Luke 6:36 “merciful” stands where Matthew 5:48 has “perfect”; the two may be two sermons, but the parallel suggests a link'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'While it is quite possible that Matthew and Luke are recording two different sermons delivered by Jesus on separate occasions, the similarity in both the language and the central location of each of the statements within their respective discourses suggests a possible link between the development of mercy and becoming “perfect.”'
    by: matthew 7
  - claim: 'Luke 6:39–40: the blind guide is one who does not understand mercy; the disciple is to become as the master'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'The blind man, then, is the man who does not understand these principles. Everyone he convinces to follow him is led along the same blind path.'
    by: matthew 7
  - claim: 'In Luke the blind guide and the man with the beam are one kind of hypocrite, blind to his own weaknesses'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'Like the hypocrite with the beam in his or her eye who is blinded to their own weaknesses, the blind leader causes harm instead of good because he or she believes that they are capable of doing that which they are incapable of, thus leading the others to fall no matter how well intentioned'
    by: matthew 7
  - claim: 'Luke 6:40 is the linchpin between the blind guide and the beam'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'This verse, like the pivot verse in Luke’s beatitudes, acts as the linchpin between the parable of the blind leading the blind and the hypocrite with the beam.'
    by: matthew 7
  - claim: 'Mote and beam: the hypocrite (Greek “actor”) criticizes another’s small fault and ignores his own'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'These men are referred to by Jesus as “hypocrites,” a Greek word meaning “actors.”'
    by: matthew 7
  - claim: '“The law and the prophets” named the whole of Hebrew scripture'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'Thus “the law and the prophets” was basically a twofold designation of the sum of Hebrew scripture.'
    by: matthew 7
  - claim: 'Earlier Jewish statements of the rule (Tobit, Hillel) were negative'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'The book of Tobit (compiled near end of second century BC) explains, “And what you hate, do not do to anyone” (4:15; NRSV). [10] And Hillel, a prominent first-century B.C. rabbi, said, “What is hateful to you, do not do to your neighbour: that is the whole Torah'
    by: matthew 7
  - claim: 'Jesus’s form is positive and not tied to an exchange of favors'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'Instead of emphasizing not doing, his iteration of the rule invites us to consider how we want to be treated and then act that way toward others. … application of the Golden Rule is no longer tethered to an exchange but rather approximates God’s love.'
    by: matthew 7
  - claim: 'Matthew’s “Therefore” ties the rule to asking and receiving'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'By conjunctively using “Therefore” (Matthew 7:12), Jesus connects the rule with his preceding theme, “Ask, and it shall be given you; . . . knock, and it shall be opened unto you” (Matthew 7:7–11).'
    by: matthew 7
  - claim: 'Matthew 7:2 and Luke 6:38 with Alma 41:14–15: what we do to others we largely do to ourselves'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'how we judge others is how we will be judged (see Matthew 6:14–15; 7:2; Luke 6:38). … In light of such teachings, we learn that what we do to others we in large measure do to ourselves (see Alma 41:14–15).'
    by: matthew 7
  - claim: 'Ask, seek, knock: the divine passive leaves the giver unnamed'
    key: bowen-thy-will
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/thy-will-be-done'
    quote: 'In these cases no subject is identified in the sentence. … The ambiguity of the divine passive allows readers to recognize multiple actors: God the Father, the Savior himself, and our own participation to bring about their purposes.'
    by: matthew 7
  - claim: 'Luke’s Sermon on the Plain may be a separate sermon to a different audience'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'these parables may well derive from two separate sermons delivered by Jesus on different occasions to varying audiences, in different locations, and for different purposes.'
    by: matthew 7
open:
  - 'What does “every one that is perfect shall be as his master” mean in its place between the blind guide and the beam ([[Luke 6:40]])? Belnap (“A Wise Man Built His House upon a Rock,” ¶60) and Frederick (¶59) are a start.'
  - 'Why is “merciful” in Luke 6:36 where Matthew has “perfect” (Matt. 5:48), and how does it shape Luke 6:37–38? Frederick’s essay is built on this question.'
  - 'What is the measure “pressed down, and shaken together, and running over,” and who are the “men” who give it into the bosom ([[Luke 6:38]])? Ellicott on Luke 6 has the bosom; the rest was not researched.'
  - 'Why does Luke end ask, seek, knock with “the Holy Spirit” where Matthew has “good things” ([[Luke 11:13]])? That is another story’s question, noted here because a reader comparing the two sermons will ask it.'
