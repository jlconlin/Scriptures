story: the-road-to-emmaus
differences:
  - 'Mark sums the story up in two verses: He “appeared in another form unto two of them, as they walked, and went into the country,” and when they told the rest, “neither believed they them” ([[Mark 16:12–13]]). Luke tells it at length, naming Cleopas and Emmaus, the conversation on the road, the opening of the scriptures and the breaking of bread ([[Luke 24:13–35]]).'
  - 'Mark says He appeared “in another form” ([[Mark 16:12]]); Luke says “their eyes were holden that they should not know him” ([[Luke 24:16]]), and the Joseph Smith Translation adds “or covered.”'
  - 'In Mark the rest did not believe the two ([[Mark 16:13]]); in Luke the eleven greet them with “The Lord is risen indeed, and hath appeared to Simon” before the two tell their story ([[Luke 24:33–35]]).'
findings:
  - claim: 'Mark 16:12 is the Emmaus appearance; Emmaus about seven miles west of Jerusalem'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'Among these disciples with the remaining eleven Apostles were two that “went that same day to a village called Emmaus,” about seven miles west of Jerusalem. … (Luke 24:13–15; cf. Mark 16:12).'
    by: mark 16
  - claim: 'The “reasoned” of Luke 24:15 means both discussing and disputing'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'Furthermore, the verb translated as “reasoned” carries a dual meaning of “to discuss” and “to dispute or debate.”'
    by: mark 16
  - claim: 'Their eyes were holden (JST “or covered”): not yet ready to see Him in full glory, they saw Him as through a veil, as a mortal'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'the Joseph Smith Translation of this verse adds that the disciples’ eyes “were holden, or covered.” Therefore, it appears that these two disciples were not yet ready to behold the resurrected Lord in His full glory, rather viewing Him as though through a veil'
    by: mark 16
  - claim: 'In expounding the scriptures Jesus taught them to recognize Him in the scriptures'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'Jesus thereby corrected these false understandings and taught them how to properly recognize Him in the scriptures.'
    by: mark 16
  - claim: 'morphē (Mark 16:12): the form by which a person strikes the vision, the external appearance'
    key: thayer
    url: 'https://biblehub.com/greek/3444.htm'
    quote: 'the form by which a person or thing strikes the vision; the external appearance: … ἐφανερώθη ἐν ἑτέρα μορφή, Mark 16:12'
    by: mark 16
  - claim: 'The first appearance to the brethren; recognized as He served the food, then vanished; Luke 24:25–27 with 3 Nephi 23:9–14'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'The first of Jesus’ many postcrucifixion appearances to the early Brethren occurred Sunday afternoon. The Lord met Cleopus and an unnamed disciple walking to Emmaus but did not disclose His identity.'
    by: mark 16
  - claim: 'Their report met the same skepticism as the women’s (Mark 16:13); while they were persuading, the Lord appeared'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'Their story met with the same skepticism; however, as that of the sisters’ earlier, “neither believed they them” (Mark 16:13). While these two witnesses were yet trying to persuade their brethren, the Lord appeared to the assembled company.'
    by: mark 16
  - claim: 'Talmage: the two were disciples, not apostles; Emmaus seven to eight miles from the city'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'During the afternoon of that same Sunday, two disciples, not of the apostles, left the little band of believers in Jerusalem and set out for Emmaus, a village between seven and eight miles from the city.'
    by: mark 16
  - claim: 'Cleopas may be Clopas (John 19:25); his companion could have been his wife; Emmaus sites proposed'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Because Cleopas may be the Greek form of Clopas, he may in fact have been the husband of one of the Marys at the foot of the cross (John 19:25; KJV, “Mary the wife of Cleophas”) … the second traveler could have been his wife'
    by: luke 24
  - claim: 'Brown: the two are most likely men, not of the eleven'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The second, unnamed person is not one of the eleven, who are all in Jerusalem (see 24:33). Most likely, the two travelers are men (see the Notes on 24:22, 24)'
    by: luke 24
  - claim: '“Holden” (krateō) passive: restrained by God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'In the passive voice, it means that the sight of the disciples is being held or restrained by someone else, by God'
    by: luke 24
  - claim: 'Redeem (lytroumai) here means military rescue of Israel'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: '(Greek lytroumai) that here has to do with Jesus rescuing Israel as a people by military might rather than him paying a ransom for sins'
    by: luke 24
  - claim: 'Luke 24:26 is Jesus’s first use of “Christ” of Himself'
    key: huntsman-lukes-jesus
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/lukes-jesus-compassionate-saving-son-god'
    quote: 'it is here that Jesus uses the title “Christ” of himself for the first time, identifying his sufferings as God’s anointed servant as the source of his glory (24:26).'
    by: luke 24
  - claim: '“Made as though”: no pretence; He intended to go on'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'No hint lies in the text that the Savior is pretending to go on. Rather, he intends to keep going.'
    by: luke 24
  - claim: 'The meal sacramental in character; same verbs as 9:16 and 22:19'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Although the Savior does not speak words that turn the meal into the sacrament, the meal becomes sacramental or holy in character because of who he is'
    by: luke 24
  - claim: '“Did not our heart burn”: a spiritual quickening recognized afterward (D&C 9:8)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The words point to a spiritual quickening that the two disciples recognize only after its occurrence'
    by: luke 24
  - claim: 'The appearance to Simon makes Peter chief guarantor of the resurrection (1 Cor. 15:5)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The reference is to the solo appearance of Jesus to Peter which makes him the chief guarantor of the resurrection (see 1 Cor. 15:5).'
    by: luke 24
open:
  - 'How do Mark’s “neither believed they them” ([[Mark 16:13]]) and Luke’s “The Lord is risen indeed, and hath appeared to Simon” ([[Luke 24:34]]) fit together? Not researched for Mark 16; Draper ([63]) tells the scene without addressing it.'
