story: the-wicked-husbandmen
differences:
  - 'Matthew’s householder sends servants in two groups and then the son ([[Matt. 21:34–37]]); Mark sends one servant at a time, then many, then “one son, his wellbeloved” ([[Mark 12:2–6]]); Luke three servants, then “my beloved son” ([[Luke 20:10–13]]).'
  - 'Matthew and Luke have the son cast out of the vineyard and then killed ([[Matt. 21:39]]; [[Luke 20:15]]); Mark has him killed and then cast out ([[Mark 12:8]]).'
  - 'In Matthew the hearers themselves pronounce the sentence ([[Matt. 21:41]]); in Mark and Luke Jesus does, and in Luke they answer “God forbid” ([[Mark 12:9]]; [[Luke 20:16]]).'
  - 'Only Matthew has “the kingdom of God shall be taken from you, and given to a nation bringing forth the fruits thereof” ([[Matt. 21:43]]). Matthew and Luke have the saying about falling on the stone ([[Matt. 21:44]]; [[Luke 20:18]]).'
  - 'Mark and Luke tell only this parable; Matthew sets it between the two sons and the marriage of the king’s son ([[Matt. 21:28–32]]; [[Matt. 22:1–14]]).'
  - 'The Joseph Smith Translation adds about two hundred words after Matthew 21:45: the rulers’ fear for “this great kingdom,” “I am the stone,” the nation “meaning the Gentiles,” and the vineyard let again “even in the last days” (JST Matt. 21:47–56, appendix).'
findings:
  - claim: 'The vineyard is Israel; the hedge, wine trough and tower tie it to Isaiah 5; owner God, son Jesus, servants prophets, tenants Israel’s leaders'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Hence, the owner was God, the son is Jesus, and the previous servants were the prophets whom the Lord had sent to Israel. This makes the tenants, who, importantly, do not own the vineyard but are only responsible for caring for it, the leaders of Israel'
    by: matthew 21
  - claim: 'In Isaiah the fruit was wild; here the fruit is good but withheld, which keeps the reading on the leaders, not the people'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'there the vineyard brought forth wild, or worthless, fruit (Isa 5:2); here the fruit is presumably good, but the tenants refuse to yield it to its true owner'
    by: matthew 21
  - claim: 'Mark’s “well-beloved son” (agapētos) is the Father’s word at the baptism and the Transfiguration'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the owner sends his son, who in Mark is his one, “well-beloved son” (Greek, agapēton). This is the very term used on two other occasions by the Father of Jesus, at his baptism and at the Transfiguration'
    by: matthew 21
  - claim: 'Psalm 118 links the parable to the entry: the crowd’s “Save now” against the rejected stone'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Whereas the cry of those who accepted Jesus was “Save now,” the line that Jesus quotes here challenges his opponents’ rejection of him'
    by: matthew 21
  - claim: '“More than the first” means greater servants, the latest John the Baptist; the hearers pronounced judgment on themselves'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'When the Lord sent other messengers, “more than the first,” or in other words, greater than the earlier ones, the most recent example being John the Baptist'
    by: matthew 21
  - claim: 'Stumbling on the stone versus the stone falling in judgment'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'To some that Stone would be a cause of stumbling; wo unto them, for thereby would they be broken, and only through repentance and works of righteousness could they even in part recover'
    by: matthew 21
  - claim: 'Cast out of the vineyard: a hedged reference to the crucifixion outside the city'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/21.htm'
    quote: 'The minor touches of a parable are not always to be pressed in our interpretation of it; but we can hardly help seeing here a latent reference to the facts (1) that our Lord was delivered over to the judgment of the Gentiles; and (2) that He was crucified outside the Holy City'
    by: matthew 21
  - claim: 'The Gospels leave the stone unidentified though the opponents understood; the JST makes it explicit and sets the parable in the last days'
    key: jackson-adding-words
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/adding-words-jesus'
    quote: 'Peter identifies Jesus as the rejected stone, but in the Gospels the reference to Jesus, though understood by his opponents, is not expressed in the text. Joseph Smith’s revision of Matthew makes this identification explicit'
    by: matthew 21
  - claim: 'JST: the nation means the Gentiles; Gentiles destroyed also when the Lord comes to reign'
    key: jst-matt-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/21?lang=eng'
    quote: 'that the Gentiles should be destroyed also, when the Lord should descend out of heaven to reign in his vineyard, which is the earth and the inhabitants thereof'
    by: matthew 21
open:
  - 'Why does Luke have the hearers say “God forbid” ([[Luke 20:16]]), and who said it?'
  - 'Does Mark’s order (killed, then cast out, [[Mark 12:8]]) mean anything, beside Matthew’s and Luke’s?'
  - 'Mark says the rulers “left him, and went their way” ([[Mark 12:12]]); what follows in Mark 12 from that?'
