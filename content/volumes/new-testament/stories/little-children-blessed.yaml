story: little-children-blessed
differences:
  - 'Matthew says the children were brought “that he should put his hands on them, and pray” ([[Matt. 19:13]]); Mark and Luke, “that he should touch them” ([[Mark 10:13]]; [[Luke 18:15]]).'
  - 'Luke calls them “infants” ([[Luke 18:15]]).'
  - 'Only Mark says Jesus “was much displeased” and “took them up in his arms” ([[Mark 10:14]]; [[Mark 10:16]]).'
  - 'Mark and Luke have “Whosoever shall not receive the kingdom of God as a little child” ([[Mark 10:15]]; [[Luke 18:17]]); Matthew does not, having given a like saying at [[Matt. 18:3]].'
  - 'Matthew and Mark say He laid His hands on them; Luke does not tell the blessing.'
findings:
  - claim: 'JST Matthew 19:13: the disciples said there was no need, for Jesus had said such shall be saved'
    key: jst-matt-19
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/19?lang=eng'
    quote: 'And the disciples rebuked them, saying, There is no need, for Jesus hath said, Such shall be saved.'
    by: matthew 19
  - claim: 'The disciples may have held the traditional view that women and children were of inferior status'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Even the disciples seem to have been yet under the influence of the traditional conception that women and children were of inferior status, and that for such to seek the Lord’s attention was an act of presumption.'
    by: matthew 19
  - claim: 'The scene follows fittingly on the teaching about marriage and the home'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The circumstance appears in appropriate sequence to that of the Lord’s instructions concerning the sacredness of marriage and the sanctity of the home.'
    by: matthew 19
  - claim: 'paidion means a child up to about seven; Luke’s brephē are babes in arms'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Whereas pais could be used of a son or daughter up to the age of twenty,[27] paidion referred to a growing child up to the age of seven.'
    by: matthew 19
  - claim: 'Luke’s brephē refers to babes in arms'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Uniquely, in another episode in which people bring “infants” to Jesus (Luke 18:15), the Lucan text uses the plural brephē, which refers to babes in arms.'
    by: matthew 19
  - claim: 'The blessing of children is no substitute for baptism, and the episode is no argument for infant baptism'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The blessing of children is in no sense analogous to, far less is it a substitution for, the ordinance of baptism, which is to be administered only to those who have come to years of understanding, and who are capable of repentance.'
    by: matthew 19
  - claim: 'Restoration parallels: 3 Nephi 17:21; D&C 20:70; D&C 137:10; Moroni 8:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/17?lang=eng'
    quote: 'he took their little children, one by one, and blessed them, and prayed unto the Father for them.'
    by: matthew 19
open:
  - 'Why was Jesus “much displeased” in Mark ([[Mark 10:14]]), and what does taking them “up in his arms” add?'
  - 'What does it mean to “receive the kingdom of God as a little child” ([[Mark 10:15]]; [[Luke 18:17]])? Korth and Reed’s “Become as Little Children” treats it.'
  - 'Why does Luke place the children right after the Pharisee and the publican ([[Luke 18:9–17]])?'
