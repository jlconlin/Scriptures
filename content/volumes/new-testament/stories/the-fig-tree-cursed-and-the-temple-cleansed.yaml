story: the-fig-tree-cursed-and-the-temple-cleansed
differences:
  - 'Matthew puts the clearing of the temple on the day of the entry and the fig tree the next morning, withered “presently” ([[Matt. 21:12]], [[Matt. 21:18–19]]); Mark curses the tree on the way in, clears the temple, and the disciples find it “dried up from the roots” the morning after ([[Mark 11:12–21]]); Luke has the clearing but no fig tree ([[Luke 19:45–46]]).'
  - 'Only Mark says “the time of figs was not yet” ([[Mark 11:13]]) and that Jesus would not let anyone carry a vessel through the temple ([[Mark 11:16]]).'
  - 'Only Mark quotes Isaiah’s “of all nations” ([[Mark 11:17]]; [[Isa. 56:7]]).'
  - 'Only Matthew has the blind and lame healed in the temple, the children’s hosannas and Psalm 8:2 ([[Matt. 21:14–16]]).'
  - 'Only Mark joins forgiveness to the promise about prayer ([[Mark 11:25–26]]).'
  - 'John places a clearing of the temple at the start of the ministry ([[John 2:13–17]]).'
findings:
  - claim: 'Mark frames the temple incident with the fig tree (intercalation), so the temple is judged; in Matthew and Luke, after the entry, it is the rightful king’s cleansing'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'The traditional name for this episode, the “cleansing of the temple,” works well in Matthew and Luke: coming right after the triumphal entry, Jesus, as the rightful king, has the authority to expel the merchants and moneychangers'
    by: matthew 21
  - claim: 'Matthew’s tree withers immediately (parachrēma); Mark delays it to the next morning'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'In the Matthean parallel of the story of the fig tree, as soon as Jesus cursed the tree it withered “immediately” (Matt 21:19; Greek, parachrēma). Mark, however, delays the destruction of the tree'
    by: matthew 21
  - claim: 'The only destructive miracle; an acted parable; the fig tree a prophetic symbol of unfruitful Israel'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'figs and the fig tree serve as symbols for Israel among the Old Testament prophets, particularly when God’s people were not fruitful (Jer 8:13; 24:1‒10; Hos 9:10, 16‒17; Mic 7:1‒6)'
    by: matthew 21
  - claim: 'Caution: the fruitless are the leadership and its institutions, not the Jewish people'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'it is not all Israel—or, in this case, the Jewish people at the time of Jesus—that are not bringing forth fruit, but rather their leadership and the institutions that they were wrongly controlling'
    by: matthew 21
  - claim: 'Fig fruit-buds precede leaves, so a leafy tree promised fruit; the tree was cursed as deceptively barren, a type of hypocrisy'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'It is well known that the fruit-buds of a fig tree appear earlier than do the leaves, and that by the time the tree is in full foliage the figs are well advanced toward maturity.'
    by: matthew 21
  - claim: 'The mountain may be the Temple Mount or the Mount of Olives (Zech. 14:4); Mark’s forgiveness saying lets prayer avail without the temple'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Given the setting, the mountain “pulled up and cast into the sea” could be either the Temple Mount, which will soon be overthrown, or the Mount of Olives where the fig tree itself was cursed'
    by: matthew 21
  - claim: 'The trade in the Court of the Gentiles: sacrificial animals and money changed into temple coinage'
    key: ogden-jesus-temple
    url: 'https://www.churchofjesuschrist.org/study/ensign/1991/04/jesus-and-the-temple?lang=eng'
    quote: 'This is where people gathered to buy and sell oxen, sheep, and doves for use in Temple sacrifice and where money changers busily changed currency with pagan symbols and likenesses of polifical rulers into Temple coinage.'
    by: matthew 21
  - claim: 'Shops below the Mount; traders on the platform suggest priestly usurpation; lēistai can mean usurpers or insurrectionists'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'The Greek equivalent in both the Septuagint of Jeremiah 7:11, and Matthew 21:13 (Greek, lēistai; KJV, “thieves”) also means “usurpers” or even “insurrectionists” or “revolutionaries.”'
    by: matthew 21
  - claim: 'lēstēs: robber, brigand, not kleptēs, a thief by stealth'
    key: thayer
    url: 'https://biblehub.com/greek/3027.htm'
    quote: 'Not to be confounded with κλέπτης thief, one who takes property by stealth (although the distinction is obscured in A. V.)'
    by: matthew 21
  - claim: 'The first clearing called the temple “My Father’s house,” the second “My house”'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'He had designated the temple as “My Father’s house”; now that He had openly avowed Himself to be the Christ, He called it “My house.”'
    by: matthew 21
  - claim: 'The blind and lame healed in the temple answer 2 Sam. 5:8 and Lev. 21; Jer. 31:8 foresees them welcomed'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'We find a related prophecy in Jeremiah that in the messianic age, “the blind and the lame” will be welcomed back into Zion, the Temple (Jer 31:6–8).'
    by: matthew 21
  - claim: 'Jesus made the cleansed temple His headquarters; Luke’s notices set the pattern of teaching daily there'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Instead, he makes the temple grounds, now purged of illicit practices, the headquarters for his last days in mortality. All of his teachings recorded in the next chapter take place here.'
    by: luke 19
  - claim: '“A den of thieves” mirrors LXX Jer. 7:11, amid warnings to those who trust in the temple'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The Greek expression mirrors exactly the language of LXX Jeremiah 7:11.'
    by: luke 19
  - claim: 'The differences between John’s clearing and the Synoptics’ point to two cleansings'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'But the differences overwhelm the similarities, leading us to see two cleansings, not one.'
    by: luke 19
open:
  - 'Why would Jesus not let anyone carry a vessel through the temple ([[Mark 11:16]])?'
  - 'Why does Mark alone keep “of all nations” from Isaiah 56:7 ([[Mark 11:17]]), and what does it say about the temple’s purpose?'
  - 'How does forgiveness belong with the withered fig tree and the promise about prayer ([[Mark 11:25–26]])?'
  - 'Why does Luke omit the fig tree ([[Luke 19:45–48]])? No source read for Luke 19 answers it.'
