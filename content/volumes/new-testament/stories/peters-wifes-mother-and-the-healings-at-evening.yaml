story: peters-wifes-mother-and-the-healings-at-evening
differences:
  - 'Mark and Luke set the healing on leaving the synagogue, and Mark names Andrew, James and John as present ([[Mark 1:29]]; [[Luke 4:38]]); Matthew names only Jesus and Peter’s house.'
  - 'In Matthew Jesus sees her and touches her hand; in Mark they tell Him and He takes her by the hand and lifts her up; in Luke they beseech Him and He stands over her and rebukes the fever ([[Mark 1:30–31]]; [[Luke 4:38–39]]).'
  - 'Only Matthew quotes Isaiah 53:4 ([[Matt. 8:17]]); Mark and Luke say Jesus did not suffer the devils to speak, because they knew Him ([[Mark 1:34]]; [[Luke 4:41]]).'
  - 'Mark and Luke time the healings “when the sun did set” ([[Mark 1:32]]; [[Luke 4:40]]); Luke adds that He laid His hands on every one.'
findings:
  - claim: 'Matthew’s rendering of Isaiah 53:4 is closer to the Hebrew than the KJV Isaiah; Alma’s is closest'
    key: wayment-alma-7-11
    url: 'https://archive.bookofmormoncentral.org/content/hebrew-text-alma-711'
    quote: 'Upon comparison with a literal translation of the Hebrew Masoretic Text, it is clear that Alma’s rendering is closest to the Hebrew, followed by Matthew’s rendering.'
    by: matthew 8
  - claim: 'The Septuagint read the nouns as “sins” and “pain”; Matthew’s words suggest physical ailment'
    key: wayment-alma-7-11
    url: 'https://archive.bookofmormoncentral.org/content/hebrew-text-alma-711'
    quote: 'Both infirmities and sicknesses in Matthew suggest physical ailment or malady.'
    by: matthew 8
  - claim: 'Alma 7:11 quotes Isaiah 53:4; the servant bears sicknesses (physical) and pains (inward)'
    key: sc-knowhy-564
    url: 'https://scripturecentral.org/knowhy/whose-word-was-fulfilled-by-christs-suffering-pains-and-sicknesses'
    quote: 'Isaiah’s words about the Son of God, the suffering servant, bearing for all his people all their sicknesses (including physical maladies) and pains (including mental or internal suffering).'
    by: matthew 8
  - claim: 'The “house of Peter” (Insula I) at Capernaum: possible, impossible to prove'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Therefore, while identifying Insula I as Peter’s house is an intriguing possibility—especially considering the site’s long tradition of Christian veneration—it is ultimately impossible to prove.'
    by: matthew 8
  - claim: 'EGT: it was the sabbath (Mark 1:21), and the people waited till sunset when the sabbath closed; hence Mark’s double note of time (answers the open question on Mark 1:32)'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/1.htm'
    quote: 'It was Sabbath, and the people would wait till sunset when Sabbath closed. Hence the double note of time.'
    by: mark 1
  - claim: 'Smith: Simon’s mother-in-law “ministered” (diakoneō), the paradigm of discipleship in Mark, the same verb used of the angels in 1:13'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'While the word used for “ministered” can mean simple, menial service, it is also the paradigm for the kind of service that disciples offer, and it is the same Greek word used in Mark 1:13 to describe the action of the angels.'
    by: mark 1
  - claim: 'Brown: sunset ended the Sabbath and its travel limit (answers the open question on Luke 4:40)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'Sunset marks the end of the Sabbath and allows people to travel farther than a Sabbath day’s journey, or what the rabbis called a “Sabbath limit,” which is 2,000 cubits or about 1,000 yards.'
    by: luke 4
  - claim: 'Brown: “rebuked” the fever is the verb of the rebuke to the demon (answers the open question on Luke 4:39)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'The same verb appears in Jesus’ rebuke of the demon at the synagogue (Greek epitimaō), putting the two miracles on a continuum, as well as others (see 4:41; 8:24; 9:42).'
    by: luke 4
  - claim: 'Brown: the laying on of hands (Luke 4:40), missing from Mark, continues among His followers in Luke and Acts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'This detail, missing from Mark’s report (see Mark 1:32–34), draws attention to the practice of healing or blessing by touching with the hands.'
    by: luke 4
  - claim: 'Brown: Luke’s silencing of the devils (4:41) quiets their commotion'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'the fact that the demons are “crying out” points to their efforts to inject chaotic commotion into his ministering activities. On this view, Jesus is controlling the scene, bringing order and quiet'
    by: luke 4
open:
  - 'Why did Jesus not suffer the devils to speak ([[Mark 1:34]])?'
