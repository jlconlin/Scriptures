story: the-feeding-of-the-five-thousand
differences:
  - 'Only Matthew says the five thousand were men “beside women and children” ([[Matt. 14:21]]).'
  - 'Matthew ties Jesus’s withdrawal to the news of John’s death ([[Matt. 14:13]]); Mark and Luke tie it to the return of the Twelve ([[Mark 6:30–32]]; [[Luke 9:10]]); John gives neither reason ([[John 6:1]]).'
  - 'Matthew says Jesus “healed their sick” ([[Matt. 14:14]]); Mark says He “began to teach them many things” because they were “as sheep not having a shepherd” ([[Mark 6:34]]); Luke has both, teaching of the kingdom and healing ([[Luke 9:11]]).'
  - 'Only John names Philip and Andrew, the lad with five barley loaves, and the Passover near ([[John 6:4–9]]), and only John says the crowd called Him “that prophet” and would make Him king ([[John 6:14–15]]).'
  - 'Mark has the “two hundred pennyworth” and the ranks by hundreds and by fifties ([[Mark 6:37–40]]); Luke the companies of fifty ([[Luke 9:14]]) and the place, Bethsaida ([[Luke 9:10]]).'
findings:
  - claim: 'The Twelve returned near the time of John’s execution; Jesus took them apart to rest'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'the return of the Twelve occurred near the time of the infamous execution of John the Baptist in prison.'
    by: matthew 14
  - claim: 'Spring, near Passover'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It was the springtime, near the recurrence of the annual Passover festival, the season of grass and flowers.'
    by: matthew 14
  - claim: 'Many place the desert place near Bethsaida Julias in Perea'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It is held by many Bible students that Bethsaida, in the desert region adjoining which Jesus and the Twelve sought rest and seclusion, was the town of that name in Perea, on the eastern side of the Jordan'
    by: matthew 14
  - claim: 'The miracle was creative power; the leftovers exceeded the original store'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It was a manifestation of creative power, by which material elements were organized and compounded to serve a present and pressing need. The broken but unused portion exceeded in bulk and weight the whole of the original little store.'
    by: matthew 14
  - claim: 'The crowd recognized the Prophet foretold by Moses'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: '“This is of a truth the prophet that should come into the world,” said they—the Prophet whose coming had been foretold by Moses and who should be like unto himself.'
    by: matthew 14
  - claim: 'Heavenly bread for Moses’s followers and loaves for Jesus’s'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Heavenly bread and miraculous loaves were provided in abundance for both Moses’s and Jesus’s followers (see Exodus 16:16; Matthew 14:19–21; 15:32–39).'
    by: matthew 14
  - claim: 'The wilderness (erēmos topos) and the Passover setting make Jesus the new Moses'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'in a locale that the synoptics identify as a wilderness (erēmos topos, KJV “desert place”), which strengthens the association of Jesus with the new Moses.'
    by: matthew 14
  - claim: 'anēr distinguishes adult men from women and children in Matt. 14:21 and 15:38'
    key: thayer
    url: 'https://biblehub.com/greek/435.htm'
    quote: 'with a reference to age, and to distinguish an adult man from a boy: Matthew 14:21; Matthew 15:38 (where ἄνδρες, γυναῖκες and παιδία are discriminated)'
    by: matthew 14
  - claim: 'All four use the word for men; only Matthew mentions women and children; they were probably few and uncounted'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'St. Matthew is the only Evangelist who mentions their presence, but all the four use the word which emphasises the fact that all the five thousand were men.'
    by: matthew 14
  - claim: 'The baskets (cophinus) were small hand baskets used by travelers'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'The basket here is the cophinus, a small basket carried in the hand, and often used by travellers to hold their food.'
    by: matthew 14
  - claim: 'Jesus, grieving, did not send the crowd away but had compassion (a Latter-day Saint close reading of Matthew 14)'
    key: swift-three-stories
    url: 'https://rsc.byu.edu/my-redeemer-lives/three-stories'
    quote: 'Yet, when all these people follow him, he does not send them away, nor does he simply tolerate their presence, but he has compassion toward them and heals their sick.'
    by: matthew 14
  - claim: 'Mark’s “in ranks” (6:40) first meant flower beds, doubled for distributive force; green grass a note of time before the Passover'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'The primary meaning of the Greek word is “a bed of flowers or herbs,” and it comes in here effectively, with the same distributive reduplication as in the last verse'
    by: mark 6
  - claim: 'The narrative of Mark 6:30–44 identifies Jesus with the Lord who provided manna, though no words in the scene say so'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'when Jesus multiplies loaves and fishes in Mark 6:30–44, the narrative implicitly identifies Jesus with the Lord who provides manna during the Exodus (see Ex. 16).'
    by: mark 6
  - claim: 'The only miracle in all four Gospels'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The feeding of the five thousand is the only miracle common to all four New Testament Gospels.'
    by: luke 9
  - claim: 'Luke focuses on the Twelve, not the crowd; twelve baskets point to their number'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'Further, they gather enough to fill their twelve baskets, an observation that points directly to their number.'
    by: luke 9
  - claim: 'John: the loaves were likely the boy’s lunch, all he had'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'It was all the boy had. The food was likely the boy’s lunch: the small fishes were probably cured with salt or were pickled.'
    by: john 6
  - claim: 'John: the one Passover Jesus does not keep in Jerusalem; the setting ties the scene to His last Passover'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Unlike other Passovers in John, in this instance Jesus does not attend the festival in Jerusalem. … it does associate this scene closely with the final Passover of Jesus’s ministry.'
    by: john 6
open:
  - 'Why does Mark say the people sat down in ranks, by hundreds and by fifties ([[Mark 6:40]])?'
  - 'What does “as sheep not having a shepherd” recall ([[Mark 6:34]]; [[Num. 27:17]])?'
  - 'Why does John give the barley loaves to a lad, and what does the Passover setting add ([[John 6:4–9]])? Huntsman’s “The Bread of Life Sermon” (huntsman-bread-of-life) is on John 6.'
  - 'What is “two hundred pennyworth” in a day’s wages ([[Mark 6:37]]; the footnote gives denarii)?'
