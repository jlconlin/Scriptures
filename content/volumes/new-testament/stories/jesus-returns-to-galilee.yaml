story: jesus-returns-to-galilee
differences:
  - 'Only Matthew says Jesus left Nazareth to live in Capernaum and quotes [[Isa. 9:1–2]] as fulfilled ([[Matt. 4:13–16]]).'
  - 'Mark gives the fuller message: “The time is fulfilled, and the kingdom of God is at hand: repent ye, and believe the gospel” ([[Mark 1:15]]); Matthew has “Repent: for the kingdom of heaven is at hand” ([[Matt. 4:17]]).'
  - 'Luke tells John’s imprisonment early, out of order, with its reason ([[Luke 3:19–20]]), and has Jesus return “in the power of the Spirit” ([[Luke 4:14]]).'
  - 'John places the return after two days in Samaria and gives the proverb that a prophet hath no honour in his own country ([[John 4:43–44]]).'
findings:
  - claim: 'Isaiah 9 in its setting: Assyria had overcome northern Israel including Galilee; hope of light; likely peace under Hezekiah; Matthew applies it to Jesus’s Galilean homeland'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'In its immediate context, this passage holds out hope to the people of Judah that the conquest of Assyria will stop and that peace and light will return to the land—a likely reference to the peace they will obtain under King Hezekiah.'
    by: matthew 4
  - claim: 'Isaiah 9 answered doubts about a Galilean Messiah (Nathanael; John 7:52 and 8:12)'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'New Testament writers also turned to Isaiah 9 to show that there was at least one text suggesting that the Messiah would indeed be associated with the Galilee region as well.'
    by: matthew 4
  - claim: 'Capernaum: north end of the Sea of Galilee; prosperous and crowded; Jesus’s home; home of Peter, Andrew and Matthew'
    key: bd-capernaum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/capernaum?lang=eng'
    quote: 'At the time of our Lord the district was one of the most prosperous and crowded in all Palestine. Here the Lord lived after the beginning of His ministry, so that Capernaum is called “his own city”'
    by: matthew 4
  - claim: 'Galilee: highways, busy towns; ruled by Herod Antipas as tetrarch'
    key: bd-galilee
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'On the death of Herod the Great after the birth of Jesus, his son Herod Antipas became tetrarch of Galilee and reigned until A.D. 39'
    by: matthew 4
  - claim: 'Kingdom of heaven sometimes means the Church (Matt. 3:2; 4:17)'
    key: bd-kingdom-of-heaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kingdom-of-heaven?lang=eng'
    quote: 'kingdom of heaven is sometimes used in scripture to mean the Church (as in Matt. 3:2; 4:17; 13; and 25:1–13)'
    by: matthew 4
  - claim: 'Herod imprisoned John for Herodias’ sake (Matthew’s reason, given later)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/14?lang=eng'
    quote: 'For Herod had laid hold on John, and bound him, and put him in prison for Herodias’ sake, his brother Philip’s wife.'
    by: matthew 4
  - claim: 'Thayer: kairos in Mark 1:15, the preappointed period before Christ founds the kingdom (answers “the time is fulfilled”)'
    key: thayer
    url: 'https://biblehub.com/greek/2540.htm'
    quote: 'the preappointed period which according to the purpose of God must elapse before the divine kingdom could be founded by Christ, Mark 1:15'
    by: mark 1
  - claim: 'Antipas took Herodias, wife of his half-brother Philip; deposed AD 39'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'He took as his wife Herodias, the wife of his half-brother Philip. He was deposed by the Emperor Caligula and banished to Lugdunum in Gaul, A.D. 39.'
    by: luke 3
  - claim: 'Brown: Luke tells the imprisonment before the baptism and does not name John as baptizer; the JST adjusts'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'In fact, in the preserved texts, Luke does not even mention that John performs Jesus’ baptism, though he implies it. Joseph Smith sees the difficulty and, as we have noted, makes an adjustment'
    by: luke 3
  - claim: 'Josephus (via Brown): John taken in chains to Machaerus'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-3-104'
    quote: 'From Josephus, we learn that John “was brought in chains to Machaerus,” a small fortress built by Herod the Great that perches atop a hill overlooking the east shore of the Dead Sea.'
    by: luke 3
  - claim: 'Strathearn and Judd: Luke places John’s imprisonment before the baptism; logic favors Mark’s and Matthew’s order'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'For example, Luke places John the Baptist’s imprisonment (3:19–20) before the baptism of Jesus (3:21–22). … In this instance, logic favors the chronology presented by Mark and Matthew over that of Luke.'
    by: luke 4
  - claim: 'Brown: Jesus carries the Holy Ghost only after baptism, and the Holy Ghost goes with Him back into Galilee (Luke 4:1, 14)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-4-104'
    quote: 'We receive the Holy Ghost only after receiving baptism at the hand of one of God’s agents, and the Holy Ghost then accompanies us in our return to our normal lives.'
    by: luke 4
  - claim: 'Ellicott: the proverb (John 4:44) seems a strange reason for going to Galilee; John has told an earlier ministry in Judea and Samaria, so the honor in Galilee was brought from without'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'Others had received Him at Jerusalem, and they therefore receive Him in Galilee. The honour is brought from without. It does not arise in His own country.'
    by: john 4
  - claim: 'Talmage: knowing Nazareth would be loath to acknowledge Him, He went first to Cana; the Galileans had been at the Passover'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'Realizing that the people of Nazareth, the town in which He had been brought up, would be probably loath to acknowledge Him as other than the carpenter, or, as He stated, knowing that “a prophet hath no honour in his own country,” He went first to Cana.'
    by: john 4
  - claim: 'Huntsman: where Matthew and Luke follow Mark’s single visit to Jerusalem, John has Jesus travel between Galilee and Jerusalem several times (answers in part what John tells before this return; with John 3:24, “John was not yet cast into prison,” against Matt. 4:12)'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Unlike Matthew and Luke, which follow the basic chronological and geographic progression of Mark that culminates in a single visit to Jerusalem, John portrays Jesus as traveling from Galilee to Jerusalem several times'
    by: john 4
  - claim: 'Strathearn and Judd: Mark 6:4 extends the proverb to “his own kin” and “his own house”; John 7:3–5 confirms His brothers rejected Him'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'In any event, John’s Gospel confirms that at least Jesus’s brothers rejected Him during His mortal ministry (see John 7:3–5).'
    by: john 4
open:
  - 'What does Mark mean by “the time is fulfilled” ([[Mark 1:15]])?'
  - 'What did Jesus do in Judea and Samaria before this return, which John tells and the others pass over ([[John 2–4]])?'
