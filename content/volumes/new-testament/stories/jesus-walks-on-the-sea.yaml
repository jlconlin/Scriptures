story: jesus-walks-on-the-sea
differences:
  - 'Only Matthew tells of Peter walking on the water and sinking ([[Matt. 14:28–31]]).'
  - 'Matthew ends the scene with the disciples worshipping and saying “Of a truth thou art the Son of God” ([[Matt. 14:33]]); Mark says they were “sore amazed,” for “they considered not the miracle of the loaves: for their heart was hardened” ([[Mark 6:51–52]]); John says they “willingly received him into the ship: and immediately the ship was at the land” ([[John 6:21]]).'
  - 'Only Mark says Jesus saw them toiling in rowing and “would have passed by them” ([[Mark 6:48]]).'
  - 'Only John gives the reason Jesus withdrew (the crowd would make Him king, [[John 6:15]]) and the distance rowed, “five and twenty or thirty furlongs” ([[John 6:19]]).'
  - 'Luke does not tell the walk on the sea.'
  - 'Matthew and Mark close with healings at Gennesaret by touching the hem of His garment ([[Matt. 14:34–36]]; [[Mark 6:53–56]]).'
findings:
  - claim: 'Head-wind; rowing all night; under four miles; fourth watch 3–6 a.m.'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'They encountered a boisterous head-wind, which of course rendered impossible the use of sails … Though they had labored through the night they had progressed less than four miles on their course'
    by: matthew 14
  - claim: 'Jesus constrained the hesitant disciples, perhaps to protect them from the crowd’s plan to make Him king'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The disciples hesitated to leave their Master; but He constrained them and they obeyed. His insistence … may have been due to a desire to protect the chosen disciples against possible infection by the materialistic and unrighteous designs of the throng to make Him king.'
    by: matthew 14
  - claim: 'The power by which Christ walked could work in others if their faith endured'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'the power by which Christ was able to walk the waves could be made operative in others, provided only their faith was enduring.'
    by: matthew 14
  - claim: 'Gennesaret: the fertile district near Tiberias and Magdala, as generally believed'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'the land of Gennesaret, which, as generally believed, embraced the rich and fertile region in the vicinity of Tiberias and Magdala.'
    by: matthew 14
  - claim: 'Job 9:8: God treads the waves; ego eimi is the divine name in Greek Isaiah'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Ego eimi means “I am” or “I am he.” In the latter half of Isaiah in the LXX, these words are understood as the name of the God who is Jehovah.'
    by: matthew 14
  - claim: 'Matthew heightens lordship through Peter’s “Lord” (kyrie); Luke omits the walk and its ego eimi'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'In the account of Jesus walking on the water, the statement “It is I” (ego eimi) is retained, but again Jesus’ lordship is heightened by Peter’s attempt to walk on the water.'
    by: matthew 14
  - claim: 'Walking on the sea echoes the Red Sea crossing'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Moses’s miraculous crossing of the Red Sea on dry ground, which Jesus echoes by crossing the Sea of Galilee, not by dividing it but by walking on it (Exodus 14:13–31; Matthew 14:24–33).'
    by: matthew 14
  - claim: 'Only Matthew has the disciples worship and confess Son of God here'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Only in Matthew’s account do we see Jesus’s disciples so dramatically affected by his walking on the water that they “worshipped him, saying, Of a truth thou art the Son of God” (14:33).'
    by: matthew 14
  - claim: 'In John, the walk identifies Jesus with Jehovah and corrects the crowd’s political messianism'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Whereas the feeding miracle could be interpreted too narrowly, as a sign that Jesus was only a messianic king, His walking on the water and miraculous completion of the sea voyage serves as a sign that He was far more.'
    by: matthew 14
  - claim: 'President Hunter: Peter sank when he looked away from the Master'
    key: hunter-beacon
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/10/the-beacon-in-the-harbor-of-peace?lang=eng'
    quote: 'Only when with wavering faith he removed his glance from the Master to look at the furious waves and the black gulf beneath him, only then did he begin to sink.'
    by: matthew 14
  - claim: 'The hem: the border fringed with blue (Num. 15:38–39); faith like the woman’s'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The desire to touch the hem of Christ’s robe may have been associated with this thought of sanctity attaching to the hem or border.'
    by: matthew 14
open:
  - 'What does Mark mean that Jesus “would have passed by them” ([[Mark 6:48]]; compare [[Ex. 33:22]])?'
  - 'Why were the disciples’ hearts “hardened,” and what had they failed to understand about the loaves ([[Mark 6:52]])?'
  - 'What does John’s “immediately the ship was at the land” add ([[John 6:21]])?'
