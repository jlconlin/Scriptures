story: the-withered-hand-healed-on-the-sabbath
differences:
  - 'In Matthew the onlookers ask “Is it lawful to heal on the sabbath days?” ([[Matt. 12:10]]); in Mark and Luke Jesus asks whether it is lawful to do good or evil, to save life or to kill ([[Mark 3:4]]; [[Luke 6:9]]).'
  - 'Only Matthew has the sheep fallen into a pit and “it is lawful to do well on the sabbath days” ([[Matt. 12:11–12]]).'
  - 'Only Mark says Jesus looked round on them “with anger, being grieved for the hardness of their hearts” ([[Mark 3:5]]) and that the Pharisees took counsel with the Herodians ([[Mark 3:6]]).'
  - 'Only Luke says it was “another sabbath” and the man’s right hand ([[Luke 6:6]]).'
findings:
  - claim: 'Saving life was acceptable; healing a chronic condition was not clearly so; no pre-Tannaitic source besides the Gospels forbids healing'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This act seems to have been viewed as helping someone with a chronic condition rather than as saving life on the Sabbath, the latter of which would have been unquestionably acceptable. … There are no pre-Tannaitic sources other than the Gospels that say healing per se was forbidden on the Sabbath'
    by: matthew 12
  - claim: 'Pharisees very likely considered healing such ailments forbidden (Doering, as Lane quotes)'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Doering concludes that “it is very likely that Pharisees in the first century would have considered healing such ailments forbidden on the Sabbath, no matter how they were carried out in detail.”'
    by: matthew 12
  - claim: 'Animals in pits: rescue widely accepted; the Damascus Document group stricter'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'The stricter, isolationist group associated with the Damascus Document would have had a more extreme view in which leaving animals or perhaps even people in pits would be required to keep the Sabbath'
    by: matthew 12
  - claim: '“Lawful to do well” broadens lawfulness to caring for those in need'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Keeping the Sabbath is still expected, but this interpretation broadens the sense of lawfulness to include helping and caring for those in need, demonstrated here in the healing of the man with the withered hand.'
    by: matthew 12
  - claim: 'Luke’s account is seen as more moderate in the opponents’ response, though they still sought an accusation'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Doering notes that in Luke’s account, the responses of those opposed to Jesus have been seen as “more moderate and less violent than in the other synoptics, thereby remaining closer to likely reactions to Sabbath infringement in ancient Judaism.”'
    by: matthew 12
  - claim: 'Ellicott: the hand was restored in the act of stretching it forth'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'It was restored whole—i.e., as the tense implies, in the act of stretching the hand forth.'
    by: matthew 12
open:
