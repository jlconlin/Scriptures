story: the-flight-into-egypt-and-the-return-to-nazareth
differences:
  - 'Only Matthew has the flight into Egypt, Herod’s killing of the Bethlehem children, and the return after Herod’s death ([[Matt. 2:13–21]]); Luke goes from the presentation in the temple straight to Nazareth ([[Luke 2:39]]).'
  - 'Matthew explains the settling in Nazareth by fear of Archelaus and a dream ([[Matt. 2:22–23]]); Luke calls Nazareth “their own city” ([[Luke 2:39]]; compare [[Luke 1:26–27]]).'
  - 'Matthew sets three fulfilment quotations in the story (Hosea 11:1, Jeremiah 31:15, and an unnamed prophecy, “He shall be called a Nazarene”); Luke has none and closes with the child’s growth ([[Luke 2:40]]).'
findings:
  - claim: 'Matthew alone links Jesus’s story to Moses’s by including the trip to Egypt and the slaughter of the innocents'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'He is the only Gospel author to link Jesus’s story to that of Moses by including the stories of the holy family’s trip to Egypt and the slaughter of the innocents (see Matthew 2:14, 16).'
    by: matthew 2
  - claim: 'Matthew tells the birth from Joseph’s perspective, Luke from Mary’s'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'Matthew recounts the birth from Joseph’s perspective and includes the story of the Wise Men’s visit to the young Jesus and the holy family’s subsequent trip to Egypt (see Matthew 1:18–2:15). Luke recounts the birth from Mary’s perspective'
    by: matthew 2
  - claim: 'Hosea 11:1 looks to Israel’s past, which does not preclude Matthew’s using it of Jesus'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Hosea’s explicit connections with Israel’s past, however, does not preclude him from speaking prophetically and implicitly foreshadowing the future flight of Jesus to Egypt.[20] Nor does it preclude Matthew from using Hosea’s words to speak about Jesus.'
    by: matthew 2
  - claim: 'Matthew reads Hosea typologically; Jesus and Moses both spared from infanticide'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew chooses to interpret the Hosea passage typologically, seeing Hosea’s statement as being consummated in the story of Joseph’s taking Jesus and Mary to (and later from) Egypt (see Matthew 2:13–15).'
    by: matthew 2
  - claim: 'The return applies Exodus 4:19 to Jesus'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Joseph saving the young child from death by fleeing to Egypt is one way to apply Exodus 4:19 to Jesus’s story.'
    by: matthew 2
  - claim: 'Joseph obeyed at once and set out by night; Herod estimated the earliest time from the star'
    key: talmage-jesus-christ-8
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-8?lang=eng'
    quote: 'In obedience to this command, Joseph took Mary and her Child, and set out by night on the journey to Egypt; and there the family remained until divinely directed to return.'
    by: matthew 2
  - claim: 'The massacre is not in Josephus or any other writer; it fits Herod’s character; perhaps twenty or thirty children'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
    quote: 'The population of Bethlehem could hardly have been more than 2,000, and the number of children under two years of age in that number would be between twenty and thirty.'
    by: matthew 2
  - claim: 'Herod killed his son Antipater the same year as the massacre and died a few months later; his kingdom divided; Archelaus deposed after nine years'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'In the same year in which he gave the order for the massacre of the infants at Bethlehem, he had Antipater, another of his own sons, put to death. A few months later Herod himself died.'
    by: matthew 2
  - claim: 'Rachel’s tomb a mile north of Bethlehem; Matthew felt Jeremiah’s picture reproduced'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
    quote: 'That picture, St. Matthew felt, had been reproduced once again. The tomb of Rachel was as familiar to the people of Bethlehem (it stands but one mile to the north of the town) as it had been in the time of Jeremiah'
    by: matthew 2
  - claim: 'Joseph seems to have meant to settle in Judea, perhaps Bethlehem; changed course on learning of Archelaus'
    key: talmage-jesus-christ-9
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-9?lang=eng'
    quote: 'It appears to have been Joseph’s intention to make a home for the family in Judea, possibly at Bethlehem—the city of his ancestors and a place now even more endeared to him as the birthplace of Mary’s Child'
    by: matthew 2
  - claim: 'Archelaus slaughtered three thousand or more early in his reign, partly in the temple precincts'
    key: talmage-jesus-christ-9
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-9?lang=eng'
    quote: 'Early in his reign he wreaked summary vengeance on the people who ventured to protest against a continuation of his father’s violence, by slaughtering three thousand or more'
    by: matthew 2
  - claim: 'No Old Testament text says “He shall be called a Nazarene”; Talmage: the prophecy was in lost scripture'
    key: talmage-jesus-christ-9
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-9?lang=eng'
    quote: 'It is practically certain that this prediction was contained in some one of the many scriptures extant in earlier days but since lost.'
    by: matthew 2
  - claim: 'Nazareth his home until about thirty; hence “Jesus of Nazareth”'
    key: talmage-jesus-christ-9
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-9?lang=eng'
    quote: 'Nazareth was the abode of Jesus until He was about thirty years of age'
    by: matthew 2
  - claim: 'The netzer (Branch) of Isaiah 11:1 proposed as the prophecy behind “Nazarene”'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
    quote: '“There shall come forth a rod out of the stem of Jesse, and a Netzer (Branch) shall grow out of his roots” (Isaiah 11:1).'
    by: matthew 2
  - claim: 'The Joseph Smith Translation of Matthew 2:23 (JST Matt. 3:24–26): Jesus grew up with his brethren, served under his father, needed no man to teach him'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'And he served under his father, and he spake not as other men, neither could he be taught; for he needed not that any man should teach him.'
    by: matthew 2
  - claim: 'Joseph Smith: as a boy Jesus had all the intelligence needed to rule the kingdom of the Jews'
    key: tpjs-2007-ch-3
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-3?lang=eng'
    quote: 'When still a boy [Jesus Christ] had all the intelligence necessary to enable Him to rule and govern the kingdom of the Jews'
    by: matthew 2
open:
  - 'How does Luke’s return “into Galilee, to their own city Nazareth” after the temple presentation ([[Luke 2:39]]) fit Matthew’s stay in Egypt? Talmage places the wise men after the presentation (chapter 8); a Luke writer should read his chapter 8 and 9 on the order of events.'
  - 'What does “the grace of God was upon him” mean ([[Luke 2:40]]), and how does it sit beside [[D&C 93:12–14]] (grace for grace)?'
  - 'Does the Joseph Smith Translation of Luke 2 (beyond 2:46) change these verses?'
