story: who-is-the-greatest-becoming-as-a-little-child
differences:
  - 'Mark and Luke say the disciples had disputed or reasoned among themselves who should be greatest ([[Mark 9:33–34]]; [[Luke 9:46]]); in Mark, Jesus asks them in the house at Capernaum what they disputed by the way, and they hold their peace. Matthew has them come and ask openly ([[Matt. 18:1]]).'
  - 'Only Matthew has “Except ye be converted, and become as little children” and “whosoever therefore shall humble himself as this little child” ([[Matt. 18:3–4]]); Mark has “If any man desire to be first, the same shall be last of all, and servant of all” ([[Mark 9:35]]), and Luke “he that is least among you all, the same shall be great” ([[Luke 9:48]]).'
  - 'Mark says Jesus took the child in His arms ([[Mark 9:36]]); Luke that Jesus perceived “the thought of their heart” and set the child by Him ([[Luke 9:47]]).'
  - 'Mark and Luke add “whosoever shall receive me, receiveth not me, but him that sent me” ([[Mark 9:37]]; [[Luke 9:48]]) and John’s report of a man casting out devils in Jesus’s name, “Forbid him not” ([[Mark 9:38–41]]; [[Luke 9:49–50]]); Matthew has neither here.'
  - 'Mark alone has “where their worm dieth not, and the fire is not quenched” and the sayings on salt ([[Mark 9:44–50]]); Luke has no millstone or hand-and-eye sayings in this scene (he has the millstone at [[Luke 17:2]]). Only Matthew has the angels of the little ones ([[Matt. 18:10]]).'
findings:
  - claim: 'Matthew does not mention the contention; the disciples ask openly; Mark and Luke have the argument'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Matthew doesn’t acknowledge the contention and simply states that they approached Jesus and openly asked, “Who is the greatest in the kingdom of heaven?” (Matthew 18:1).'
    by: matthew 18
  - claim: 'Both accounts are correct; Christ’s question may have brought out theirs'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The apparent difference of circumstance is unimportant; both accounts are correct; Christ’s question to them may have eventually brought out their questions to Him.'
    by: matthew 18
  - claim: 'They knew Jesus was the Christ but still expected a temporal king; ambition bred jealousy'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'With minds still tinctured by the traditional expectation of the Messiah as both spiritual Lord and temporal King, … they surrendered themselves to the selfish contemplation of their prospective stations in the new kingdom … Personal ambition had already engendered jealousy in their hearts.'
    by: matthew 18
  - claim: 'The scene is in the house at Capernaum'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'When they were together with Jesus in the house at Capernaum, the subject was brought up again.'
    by: matthew 18
  - claim: 'paidion, the word in all three accounts, is a child up to about seven'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'paidion referred to a growing child up to the age of seven.'
    by: matthew 18
  - claim: 'Matthew’s “be converted” (straphēte): to turn, turn around, reverse, return, change'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'The Greek word is straphēte, meaning to always be engaged in, to turn, turn around, reverse, return, or change.'
    by: matthew 18
  - claim: 'Childlike, not childish; the qualities of little children'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Those who belong to Christ must become like little children in obedience, truthfulness, trustfulness, purity, humility, and faith.'
    by: matthew 18
  - claim: 'The millstone is the donkey-turned millstone (Mark 9:42 in the critical text; Matthew 18:6)'
    key: thayer
    url: 'https://biblehub.com/greek/3684.htm'
    quote: 'ὀνικός, ὀνικη, ὀνικον (ὄνος), of or for an ass: μύλος ὀνικός i. e. turned by an ass (see μύλος, 1), Mark 9:42 L T Tr WH; Luke 17:2 Rec.; Matthew 18:6.'
    by: matthew 18
  - claim: 'The larger stone-mill; a Greek and Roman punishment; its horror the loss of burial'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'The punishment was not recognised in the Jewish law, but it was in occasional use among the Greeks (Diod. Sic. xvi. 35), and had been inflicted by Augustus (Sueton. Aug. lxvii.) in cases of special infamy.'
    by: matthew 18
  - claim: 'Mark and Luke insert John’s complaint here, as part of the sequence of thought on offending'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'St. Mark and St. Luke, it may be noted, insert here the complaint of St. John, that he had seen one casting out devils in the name of Jesus, and this must be taken into account as an element in the sequence of thought.'
    by: matthew 18
  - claim: 'Talmage on the worm, the fire and the salt of Mark 9:44–50'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'In that state his conscience shall gnaw as an undying worm, and his remorse shall be as a fire that cannot be quenched. Every human soul shall be tested as by fire; and as the flesh of the altar sacrifices had to be seasoned with salt'
    by: matthew 18
  - claim: 'JST Matt. 18:9: the hand is a friend, the eye of one’s household'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: '9. And a man’s hand is his friend, and his foot, also; and a man’s eye, are they of his own household. (Emphasis added.)'
    by: matthew 18
  - claim: 'JST Mark 9:40, 42: the brother who confesses not, and the standard by whom one walks, are cut off'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: '40. Therefore, if thy hand offend thee, cut it off; or if thy brother offend thee and confess not and forsake not, he shall be cut off. . . .'
    by: matthew 18
  - claim: 'The JST changes in Matthew mirror the more dramatic ones in Mark; they mean excommunication'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'The Prophet’s changes define what it means to pluck out an eye or cut off a hand: excommunication or severance from the body of Christ was occasionally necessary to maintain the purity of the Church.'
    by: matthew 18
  - claim: 'The guardian angels of the little ones (Matthew only)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'The words distinctly recognise the belief in guardian angels, entrusted each with a definite and special work.'
    by: matthew 18
open:
  - 'Who was the man casting out devils in Jesus’s name, and why “Forbid him not: for he that is not against us is on our part” ([[Mark 9:38–40]]; [[Luke 9:49–50]])? JST Mark 9:40–44 (in Millet’s article) reads very differently there.'
  - 'What is meant by “every one shall be salted with fire, and every sacrifice shall be salted with salt” ([[Mark 9:49–50]])? Talmage reads it; the site’s note on salt as covenant is at [[Matt. 5:13]].'
  - 'What is “where their worm dieth not” ([[Mark 9:44]]), and where does it come from ([[Isa. 66:24]])?'
  - 'Why does Luke have “he that is least among you all, the same shall be great” ([[Luke 9:48]]) where Mark has “last of all, and servant of all” ([[Mark 9:35]])?'
