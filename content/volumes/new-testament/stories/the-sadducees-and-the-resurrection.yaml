story: the-sadducees-and-the-resurrection
differences:
  - 'Mark says “are as the angels which are in heaven” ([[Mark 12:25]]); Luke has “they which shall be accounted worthy to obtain that world … neither can they die any more: for they are equal unto the angels; and are the children of God, being the children of the resurrection” ([[Luke 20:35–36]]).'
  - 'Only Mark ends “ye therefore do greatly err” ([[Mark 12:27]]); only Luke adds “for all live unto him” and the scribes’ “Master, thou hast well said” ([[Luke 20:38–39]]); Matthew ends with the multitude astonished at His doctrine ([[Matt. 22:33]]).'
  - 'Only Matthew has the Sadducees say “there were with us seven brethren” ([[Matt. 22:25]]).'
  - 'Mark and Luke name the bush ([[Mark 12:26]]; [[Luke 20:37]]); Matthew says “that which was spoken unto you by God” ([[Matt. 22:31]]).'
findings:
  - claim: 'The Sadducees came from the chief priestly families and seem to have been the core of the opposition'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The Sadducees, who came from the chief priestly families and seemed to represent the core of the opposition to Jesus, posed the next question.'
    by: matthew 22
  - claim: 'The question was about the resurrection, meant to make it look absurd'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Instead, they were trying to use an extreme example involving the practice of levirate marriage to demonstrate that believing in a resurrection was absurd.'
    by: matthew 22
  - claim: 'Levirate marriage was temporary; the child belonged to the dead brother'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'levirate marriages were only temporary arrangements to begin with—the child conceived “belonged to” the dead brother, and the living brother had no further conjugal rights after the child was born.'
    by: matthew 22
  - claim: 'Denying the resurrection is denying the power of God'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Next, and more significantly, by denying the resurrection, Jesus pointed out that they were, in fact, denying the power of God.'
    by: matthew 22
  - claim: 'The patriarchs lived on in the spirit world; Jesus’s resurrection would overcome death for them'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Not only did Abraham, Isaac, and Jacob continue to live in the spirit world (the Sadducees did not seem to believe in any kind of life after death), but through Jesus’s own resurrection he would overcome physical death for them and for us.'
    by: matthew 22
  - claim: 'The seven-brother case was possible but most improbable'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'was possible under the Mosaic code relating to levirate marriages; but it was a most improbable instance.'
    by: matthew 22
  - claim: 'Marital status must be settled before the resurrection, under priesthood power to seal'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'In the resurrection there will be no marrying nor giving in marriage; for all questions of marital status must be settled before that time, under the authority of the Holy Priesthood, which holds the power to seal in marriage for both time and eternity.'
    by: matthew 22
  - claim: 'The Sadducees made the title “God of Abraham” valid only for the patriarchs’ mortal lives'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'yet they denied the possible resurrection of these patriarchs, and made the exalted title, under which the Lord had revealed Himself to Moses, valid only during the brief mortal existence of the progenitors of the Israelitish nation.'
    by: matthew 22
  - claim: 'From the second century, Christians read the verse as no marriage hereafter'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Some Christian writers from the second century forward took this to mean that the next life would be a non-conjugal state in which marriage would no longer exist—a view that has prevailed in traditional Christianity to the present day.'
    by: matthew 22
  - claim: 'The words speak of no creation of marriages, not no existence of marriage'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'commentators have drawn attention to the ambiguity in Jesus’s response, with its reference to there being no creation of marriages, rather than no existence of marriage, in the age to come.'
    by: matthew 22
  - claim: '“With us” may limit the answer to the Sadducees (a proposal Ellison reports from Strathearn)'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'The people Jesus referred to when he said, “they neither marry nor are given in marriage,” appear to be Sadducees (“there were with us seven brethren”; Matthew 22:25; emphasis added), perhaps limiting the scope of Jesus’s response'
    by: matthew 22
  - claim: 'Levirate marriage and the Sadducees’ unbelief correspond to D&C 132:15–16'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Both the practice of levirate marriage and the Sadducees’s disbelief in resurrection seem to correspond to the teaching in Doctrine and Covenants 132:15–16'
    by: matthew 22
  - claim: 'D&C 132:16 uses the words of Matthew 22:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'Therefore, when they are out of the world they neither marry nor are given in marriage; but are appointed angels in heaven'
    by: matthew 22
  - claim: 'Luke 20:35: the resurrection of the just; JST “through resurrection from the dead”'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    by: luke 20
  - claim: 'Angels (messengers) and children (heirs) are not equivalents in Luke 20:36'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: 'But they are not equivalents: a person’s messengers or agents (Greek angelos)84 are never on the same legal or social continuum, in this life or the next, with one’s children'
    by: luke 20
  - claim: '“The living” of 20:38 are those with eternal life, God’s life'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-20-104'
    quote: '“the living” (Greek participle zōn) are those filled with eternal life, God’s life, more than simple existence'
    by: luke 20
  - claim: 'Luke 20:36: like the angels in being immortal, superior to them in privileges; answers the Sadducees’ denial of angels'
    key: cambridge-luke
    url: 'https://biblehub.com/commentaries/cambridge/luke/20.htm'
    quote: 'equal unto the angels] Like the angels in being immortal, but superior to them in privileges (Hebrews 1:4; Hebrews 2:5-8).'
    by: luke 20
open:
  - 'Huntsman and Hatch quote Julie M. Smith’s Mark commentary on 12:25 (“none of these marriages will be eternally valid”); her *Gospel according to Mark* (BYU New Testament Commentary) was not opened here.'
