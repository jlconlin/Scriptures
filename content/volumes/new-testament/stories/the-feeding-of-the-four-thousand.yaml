story: the-feeding-of-the-four-thousand
differences:
  - 'Matthew counts “four thousand men, beside women and children” ([[Matt. 15:38]]); Mark “about four thousand” ([[Mark 8:9]]).'
  - 'Only Mark adds “for divers of them came from far” ([[Mark 8:3]]) and has the fishes blessed separately ([[Mark 8:7]]).'
  - 'Matthew’s disciples answer “Seven, and a few little fishes” ([[Matt. 15:34]]); in Mark only “Seven” ([[Mark 8:5]]).'
  - 'Matthew lands at Magdala ([[Matt. 15:39]]); Mark at Dalmanutha ([[Mark 8:10]]).'
  - 'Both Gospels have Jesus recall the two feedings with their different baskets ([[Matt. 16:9–10]]; [[Mark 8:19–20]]).'
findings:
  - claim: 'The details differ from the five thousand: numbers, three days, loaves, baskets'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'The number of the people fed, their three days’ waiting till their food was exhausted, the number of the loaves at hand, and of the baskets in which the fragments were collected after the meal, are all different.'
    by: matthew 15
  - claim: 'Spuris a large hamper (Acts 9:25); kophinos a smaller hand basket'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'Here the word is σπνρις (spuris), the hamper in which provisions were packed as for a party travelling together, large enough, as in St. Paul’s escape from Damascus (Acts 9:25), to hold a man; while in the other it was the κόφινος (cophinus), or smaller basket, which a man carried in his hand.'
    by: matthew 15
  - claim: 'The miracle arises from compassion, not a challenge'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'the display of miraculous power in its highest form originates not in answer to a challenge, or as being offered as a proof of a divine mission, but simply from compassion.'
    by: matthew 15
  - claim: 'Spuris: a reed or plaited basket, hamper'
    key: thayer
    url: 'https://biblehub.com/greek/4711.htm'
    quote: 'a reed basket (i. e. a plaited basket, a lunch basket, hamper'
    by: matthew 15
  - claim: 'Kophinos: a wicker basket'
    key: thayer
    url: 'https://biblehub.com/greek/2894.htm'
    quote: 'κόφινος, κοφινου, ὁ, a basket, wicker basket'
    by: matthew 15
  - claim: 'The disciples probably remembered but did not presume to ask for a repetition; the crowd dispersed quietly'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Rather let us believe that the disciples remembered well, yet deemed it beyond their duty or privilege to suggest a repetition of the miracle.'
    by: matthew 15
  - claim: 'Magdala and Dalmanutha close together on the western shore'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Jesus and the apostles returned by boat to the western shore of the lake, and landed near Magdala and Dalmanutha. These towns are understood to have been so close together as to virtually make the latter a suburb of the other.'
    by: matthew 15
  - claim: 'Magdala on the western shore; better manuscripts read Magadan'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'The better MSS. give the reading Magadan. The narrative implies that it was on the western shore of the lake'
    by: matthew 15
  - claim: 'Talmage sets the second feeding among the crowds of the Decapolis, semi-pagan peoples'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Though still among semi-pagan peoples, our Lord was greeted by great crowds, amongst whom were many lame, blind, dumb, maimed, and otherwise afflicted; and them He healed.'
    by: mark 8
  - claim: 'Dalmanutha a town on the shore, possibly identical with or near Magdala'
    key: bd-dalmanutha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dalmanutha?lang=eng'
    quote: 'A town on the shore of the Sea of Galilee (Mark 8:10); possibly identical with or near to Magdala (Matt. 15:39).'
    by: mark 8
  - claim: 'Dalmanutha named by no other writer; a sign of Mark’s independence'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/8.htm'
    quote: 'St. Mark’s use of the word, instead of the Magdala or “Magada” of St. Matthew, may be noted as an instance of his independence. It is mentioned by no other writer.'
    by: mark 8
open:
  - 'Were the four thousand Gentiles? No readable source says so; Talmage places the crowd in the Decapolis among “semi-pagan peoples” (finding above), which Mark 8 uses without deciding the question. The RSC study “Of Children, Bread, and Dogs” (New Testament Insights) is not released online.'
  - 'Why does Matthew count “beside women and children” ([[Matt. 15:38]]) where Mark says “about four thousand” ([[Mark 8:9]])?'
