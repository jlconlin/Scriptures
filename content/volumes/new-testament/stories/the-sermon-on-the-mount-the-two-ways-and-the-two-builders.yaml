story: the-sermon-on-the-mount-the-two-ways-and-the-two-builders
differences:
  - 'Luke’s sermon has no strait gate and narrow way ([[Matt. 7:13–14]]); Luke has “Strive to enter in at the strait gate” in another setting ([[Luke 13:24]]). Luke has no false prophets in sheep’s clothing ([[Matt. 7:15]]).'
  - 'In Matthew the trees and their fruit are the test of false prophets, and the barren tree is “hewn down, and cast into the fire” ([[Matt. 7:15–20]]). In Luke “every tree is known by his own fruit,” and the saying turns to every person’s heart: “A good man out of the good treasure of his heart bringeth forth that which is good … for of the abundance of the heart his mouth speaketh” ([[Luke 6:43–45]]). Matthew has the treasure of the heart elsewhere ([[Matt. 12:33–35]]).'
  - 'Matthew: “Not every one that saith unto me, Lord, Lord, shall enter into the kingdom of heaven,” then the scene “in that day,” the prophecies, devils and wonderful works, and “I never knew you” ([[Matt. 7:21–23]]). Luke: one question in the present, “why call ye me, Lord, Lord, and do not the things which I say?” ([[Luke 6:46]]), with no judgment scene.'
  - 'Builders. Matthew: “whosoever heareth these sayings of mine, and doeth them”; a “wise man” on the rock and a “foolish man” on the sand; rain, floods and winds ([[Matt. 7:24–27]]). Luke: “Whosoever cometh to me, and heareth my sayings, and doeth them”; the builder “digged deep, and laid the foundation on a rock”; the other built “without a foundation … upon the earth”; a flood and a stream beating “vehemently”; neither is called wise or foolish ([[Luke 6:47–49]]).'
  - 'Matthew closes the sermon with the people astonished at His doctrine and His authority, “not as the scribes” ([[Matt. 7:28–29]]); Luke closes with “when he had ended all his sayings in the audience of the people, he entered into Capernaum” ([[Luke 7:1]]).'
findings:
  - claim: 'Luke’s Sermon on the Plain may be a separate sermon to a different audience'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'these parables may well derive from two separate sermons delivered by Jesus on different occasions to varying audiences, in different locations, and for different purposes.'
    by: matthew 7
  - claim: 'In Matthew the wise man builds directly upon the rock; in Luke he digs down to bedrock'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'Matthew gives another version of this parable, in which the wise man does not dig down to the bedrock but builds directly upon the rock'
    by: matthew 7
  - claim: 'Luke’s plain audience was mixed; Jesus offered simpler remarks for a basic foundation of faith (the KnoWhy quoting John W. and Jeannie S. Welch)'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'To this more diverse and less intimate audience, Jesus offered simpler remarks designed to build a more basic foundation of faith and practical wisdom.'
    by: matthew 7
  - claim: 'Luke does not call the unresponsive builder foolish; the invitation is open, less focused on judgment (the KnoWhy quoting S. Kent Brown)'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'As S. Kent Brown has observed, “unlike his teaching in Matthew 7:26–27, Jesus does not call the unresponsive person ‘foolish’ but lets the parable carry its own penetrating force to his hearers.”'
    by: matthew 7
  - claim: 'Both accounts have “the rock,” with the definite article, a specific rock'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'Both Matthew and Luke describe the righteous as building on “the rock,” using the definite article in the Greek text.'
    by: matthew 7
  - claim: 'The Lord is called the rock in the Psalms; Moses 7:53 “the Rock of Heaven”'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'In the Old Testament, both the Lord and the temple are described using the imagery of the rock, as seen in various titles given to the Lord in the Psalms … And to Enoch the Lord declared, “I am Messiah, the King of Zion, the Rock of Heaven'
    by: matthew 7
  - claim: 'Torrential rains and flash floods were common in the region'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'the torrential rains and flash floods that were common in ancient Israel and its surrounding regions.'
    by: matthew 7
  - claim: 'Galilean winter torrents leave level beds of sand that might tempt a builder (Ellicott: “may have suggested”)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/7.htm'
    quote: 'what had seemed a goodly river is then a tract covered with debris of stones and sand. A stranger coming to build might be attracted by the ready-prepared level surface of the sand. It would be easier to build there instead of working upon the hard and rugged rock.'
    by: matthew 7
  - claim: 'Luke’s wise man digs deep until he finds the stone; the other builds on the surface'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'Luke’s version describes in detail the proactive nature of the wise man as he digs deep until he finds the stone necessary for the foundation. The foolish man, on the other hand, does not dig for a foundation but instead places his house directly on the surface of the earth.'
    by: matthew 7
  - claim: 'The choice in both sermons is between appearance and reality; discernment is a central theme'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'the choice is ultimately between the way things appear to be and the way things really are. … Thus the need to gain discernment is woven throughout the fabric of the sermons and emerges as one of the central themes of Christ’s message.'
    by: matthew 7
  - claim: 'The two foundations look the same until the storm'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'the building of the house either on sand or on rock has no immediately discernible effect. In fact, the distinction does not really matter on days when the weather is fair.'
    by: matthew 7
  - claim: 'Luke ties the trees to the heart: speech comes from inner intent'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'Though Luke’s analogy of the good and bad trees is not as comprehensive as Matthew’s, following the analogy, Luke ties it back to man’s nature'
    by: matthew 7
  - claim: 'True prophets are known by their fruits: their lives, works and doctrine'
    key: millet-fruits
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/their-fruits-ye-shall-know-them'
    quote: 'true prophets could be known by their fruits—by the goodness of their lives and their works and the sweetness of their doctrine.'
    by: matthew 7
  - claim: 'Discipleship is more than saying the good word; Luke 6:46–49 is Luke’s version of Matthew 7:21'
    key: millet-fruits
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/their-fruits-ye-shall-know-them'
    quote: 'Discipleship entails much more than saying the good word, even saying the good word to the Master.'
    by: matthew 7
  - claim: 'Wolves in sheep’s clothing: Paul echoed the warning at Ephesus; such wolves come from within and without the Church'
    key: sc-knowhy-527
    url: 'https://scripturecentral.org/knowhy/why-must-we-beware-wolves-in-sheeps-clothing'
    quote: '“wolves in sheep’s clothing” populate today’s world, and they can come both from within and without the Church.'
    by: matthew 7
  - claim: 'Matthew 7:21–23 (3 Nephi 14:21–23): likely aimed at those who broke covenants or acted in God’s name illegitimately; Psalm 6:8 and Hosea 8:1–2 behind it'
    key: sc-knowhy-205
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-some-well-intentioned-people-will-be-told-to-depart'
    quote: 'It is likely that Jesus was directing His comments specifically towards those who were associated with the temple but who had apostatized from correct practice because they had broken their covenants and/or were acting in God’s name illegitimately.'
    by: matthew 7
  - claim: 'Authority: Jesus cited no earlier rabbis and said “I say unto you”'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'However, Christ did not cite previous rabbis. Moreover, he did not speak as prophets, who often said, “Thus saith the Lord.” With bold audacity, he declared, “I say unto you,” asserting his word to be the final authority'
    by: matthew 7
open:
  - 'What is “the good treasure of his heart,” and how does it turn the trees from a test of prophets into a test of every heart ([[Luke 6:45]])? Belnap’s note 18 is a start.'
  - 'Why does Luke’s builder “cometh to me,” and why is the other builder not called foolish ([[Luke 6:47–49]])? KnoWhy #659 quotes S. Kent Brown, *The Testimony of Luke* (BYU Studies, 2014), 305–54; read Brown before citing him.'
  - 'What does “digged deep” add for a reader of Luke ([[Luke 6:48]])? A Latter-day Saint reading not used for Matthew: Kim B. Clark, “The Power of the New Testament in the Latter Days,” *The Household of God* (RSC), rsc.byu.edu/household-god/power-new-testament-latter-days, ¶16–17.'
  - 'What does Luke’s present question “why call ye me, Lord, Lord” mean in his sermon, without Matthew’s judgment scene ([[Luke 6:46]])?'
