story: the-risen-lord-appears-to-the-disciples
differences:
  - 'Luke has Jesus show “my hands and my feet” and invite them to “handle me” ([[Luke 24:39–40]]); John has Him show “his hands and his side” ([[John 20:20]]).'
  - 'Only Luke has the disciples suppose they “had seen a spirit” and Jesus eat broiled fish before them ([[Luke 24:37]]; [[Luke 24:41–43]]).'
  - 'Only John has the breathing on them, “Receive ye the Holy Ghost,” and the power to remit and retain sins ([[John 20:22–23]]); Luke instead has the promise of the Father and the command to tarry in Jerusalem “until ye be endued with power from on high” ([[Luke 24:49]]).'
  - 'Luke has Jesus open their understanding of “the law of Moses, and … the prophets, and … the psalms” and send them to preach repentance and remission of sins “among all nations, beginning at Jerusalem” ([[Luke 24:44–47]]); John has “as my Father hath sent me, even so send I you” ([[John 20:21]]).'
  - 'John sets the scene behind shut doors “for fear of the Jews” ([[John 20:19]]); Luke places it as the two from Emmaus are telling their story ([[Luke 24:36]]).'
findings:
  - claim: 'Only Luke and John give accounts of the visit later that day; both give tangible proof of bodily resurrection'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Only Luke and John provide accounts of a visit later that day to the disciples. In both versions he gives them tangible proof that he has bodily risen from the dead.'
    by: luke 24
  - claim: '“Handle” (psēlaphaō) is to touch in order to find out; the nail marks may be implied in Luke (compare John 20:20, 25)'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'The verb here is somewhat unusual (Greek, psēlaphēsate; KJV, “handle”), conveying the idea of using the sense of touch to discover or find out something yet unknown … these tokens of his sacrificial death might be implied.'
    by: luke 24
  - claim: '“A spirit” is close to “ghost”; the room likely dimly lit'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The term “spirit” (Greek pneuma) in this case stands close to the modern meaning of “ghost.” This word in other contexts points to the spirit of a deceased person … Presumably, the light in the room is dim, coming only from small oil lamps'
    by: luke 24
  - claim: 'Luke 24:39 states in negative terms the nature of a resurrected body; “flesh and blood” is mortality'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The Risen Jesus offers, in negative terms, the proper nature of a resurrected body, that is, it consists of flesh and bones and is not a disembodied spirit … The similar expression “flesh and blood” has to do strictly with mortality (see 1 Cor. 15:50'
    by: luke 24
  - claim: 'Joseph Smith quotes Luke 24:39 in D&C 129:2 for resurrected angels'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/129?lang=eng'
    quote: 'For instance, Jesus said: Handle me and see, for a spirit hath not flesh and bones, as ye see me have.'
    by: luke 24
  - claim: 'He eats not for sustenance but as proof; all become eyewitnesses'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'It is not that in his resurrected state he needs food for sustenance but that he offers proof of his return to life. Everyone in the room now becomes an eyewitness of his tangible, resuscitated body'
    by: luke 24
  - claim: '“And of an honeycomb” only in later manuscripts; disputed'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'Only later manuscripts preserve this expression. The earlier and better texts omit it. Hence, it may be a late scribal addition, although this is disputed.'
    by: luke 24
  - claim: 'The eating recalled in Acts 10:41; important for Greek Gentile converts'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'The testimony of these details would have been particularly important for future non-Jewish converts. Indeed, during the time of Luke’s writing of Luke-Acts, the polity of the church increasingly included Greek gentiles, whose cultural, religious, and intellectual backgrounds would make them susceptible to misunderstanding the resurrection'
    by: luke 24
  - claim: 'Law, Prophets and Writings (“psalms” by synecdoche): the threefold division'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'By using the threefold division of the scriptures as it was known in his day—the Teaching or Law (tôrâ), Prophets (nəḇîʾîm), and Writings (kəṯûḇîm; “psalms” by synecdoche) still used by our Jewish friends today'
    by: luke 24
  - claim: 'Brown: Luke 24:44–49 preserves the outline of the forty-day teaching (Acts 1:3)'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'it seems that here Luke also preserves the broad outline of the Lord’s teachings during the forty-day ministry which he sums up in a few words elsewhere … we gain a sense for what he teaches these beloved followers during the next six weeks, starting this night.'
    by: luke 24
  - claim: '“Nations” (ethnos) also means Gentiles'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The term translated “nations” also means “Gentiles” (Greek ethnos). In his mortal life, Jesus sends the Seventy among Gentiles in an initial effort to reach out to them'
    by: luke 24
  - claim: 'The apostles’ purpose: witnesses above all of the corporeal resurrection'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'This passage reveals the Apostles’ purpose: to be personal witnesses to all of the Lord’s ministry and teachings, and most significantly, to the corporeal resurrection.'
    by: luke 24
  - claim: '“Endued” (endyō) “to clothe”; passive, the Father as agent; Pentecost'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-24-104'
    quote: 'The verb “to endue” (Greek endyō) means “to clothe, to put on,” … In Luke, the form of the verb is the middle voice with a passive sense, meaning “to be clothed.”'
    by: luke 24
  - claim: 'D&C 95:9 recalls the command to tarry at Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/95?lang=eng'
    quote: 'For this is the promise of the Father unto you; therefore I command you to tarry, even as mine apostles at Jerusalem.'
    by: luke 24
  - claim: 'Latter-day Saint reading of John 20:22: not the formal gift of the Holy Ghost nor Pentecost; a symbolic re-creation'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'A Latter-day Saint reading of this action would separate this experience from receiving the formal gift of the Holy Ghost, which presumably would have followed water baptism, and the later special endowment of power that came at Pentecost'
    by: luke 24
  - claim: 'John 20:22: the word for “breathed” is that of the Septuagint’s Genesis 2:7'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/20.htm'
    quote: 'The word rendered “breathed” occurs nowhere else in the New Testament, but was familiar from its use in the Greek (LXX.) of Genesis 2:7.'
    by: john 20
  - claim: 'John 20:23: Lorenzo Snow reads the power to remit and retain through baptism by those sent of God'
    key: ttp-lorenzo-snow-2
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-lorenzo-snow/chapter-2-baptism-and-the-gift-of-the-holy-ghost?lang=eng'
    quote: 'every man that would come in humility, sincerely repenting of his sins, and receive baptism from the apostles should have his sins forgiven through the atoning blood of Jesus Christ'
    by: john 20
  - claim: 'John 20:19: the shut doors show the risen Jesus entering as Moroni came and went (JS—H 1:43)'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'John’s mention that “the doors were shut” additionally serves the function of showing that the resurrected Jesus was able to do something similar to what Joseph Smith reports the resurrected Moroni doing'
    by: john 20
open:
  - 'What does “Receive ye the Holy Ghost” mean before Pentecost ([[John 20:22]])? Huntsman and Hatch, “Easter Sunday,” [94], is the lead; not used for Luke.'
  - 'What is the power to remit and retain sins ([[John 20:23]])? Not researched for Luke.'
  - 'Why was Thomas absent, and what does his confession mean ([[John 20:24–29]])? Huntsman and Hatch, “Easter Sunday,” [95]–[97].'
