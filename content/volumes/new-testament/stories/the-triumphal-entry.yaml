story: the-triumphal-entry
differences:
  - 'Only Matthew has two animals, “an ass tied, and a colt with her” ([[Matt. 21:2]], [[Matt. 21:7]]); Mark, Luke and John have the colt alone ([[Mark 11:2]]; [[Luke 19:30]]; [[John 12:14]]). The Joseph Smith Translation of Matthew has Jesus sit on the colt only (JST Matt. 21:5, footnote 7a).'
  - 'Mark and Luke say the colt had never been ridden ([[Mark 11:2]]; [[Luke 19:30]]); Mark adds that it was tied “by the door without in a place where two ways met” ([[Mark 11:4]]).'
  - 'Matthew and John quote Zechariah 9:9 ([[Matt. 21:4–5]]; [[John 12:15]]); Mark and Luke do not. John adds that the disciples understood it only after Jesus was glorified ([[John 12:16]]).'
  - 'The cry differs: Matthew “Hosanna to the Son of David” ([[Matt. 21:9]]); Mark “Blessed be the kingdom of our father David” ([[Mark 11:10]]); Luke “Blessed be the King … peace in heaven” ([[Luke 19:38]]); John “Blessed is the King of Israel” ([[John 12:13]]).'
  - 'Only John names palm branches and says the crowd came out because of the raising of Lazarus ([[John 12:13]], [[John 12:17–18]]).'
  - 'Only Luke has the Pharisees’ demand to rebuke the disciples, “the stones would immediately cry out,” and Jesus weeping over the city ([[Luke 19:39–44]]).'
  - 'Only Matthew has the city “moved,” asking “Who is this?” ([[Matt. 21:10–11]]).'
  - 'Mark has Jesus look around the temple and go out to Bethany that evening ([[Mark 11:11]]); Matthew and Luke go straight to the clearing of the temple.'
findings:
  - claim: 'The entry was an open proclamation of His messiahship, unlike His earlier guardedness'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'the public acceptance of the nation’s homage, and the acknowledgment of both kingly and Messianic titles, constituted an open and official proclamation of His divine investiture'
    by: matthew 21
  - claim: 'Matthew alone mentions both animals; the mother probably came along to keep the colt tractable'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Matthew alone mentions both ass and colt; the other writers specify the latter only; most likely the mother followed as the foal was led away, and the presence of the dam probably served to keep the colt tractable.'
    by: matthew 21
  - claim: 'Zechariah’s parallelism refers to one donkey; Matthew shows two to stress that the foal is young; the unridden colt of Mark and Luke reflects the Septuagint’s “new donkey”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Both Zechariah’s original and the Genesis passage, using the poetic feature of synonymous parallelism, actually refer to only one donkey. However, even though Matthew understood this literary technique, he nonetheless chose to portray two to emphasize by the mother’s presence that the foal is young.'
    by: matthew 21
  - claim: 'David fled up the Mount of Olives weeping; Solomon rode a donkey when anointed while the people cried “God save King Solomon”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'King Solomon also rode his donkey at the base of the Mount of Olives, where he was anointed king over Israel (1 Kgs 1:32–37). During the royal procession, his constituents shouted, “God save King Solomon,”'
    by: matthew 21
  - claim: 'Hosanna is an Aramaic form of Ps. 118:25, “save now”; Psalm 118 closes the Passover Hallel and was a procession psalm; Matthew and John make the cry royal'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'When the crowds cried “Hosanna!” they were using an Aramaic form of the Hebrew hôšîʿânnāʾ from Psalm 118:25, which means “save now” (KJV) or “save us, we beseech you” (NRSV).'
    by: matthew 21
  - claim: 'The donkey a token of peace; the Romans saw nothing to fear'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'He came riding on an ass, in token of peace, acclaimed by the Hosanna shouts of multitudes; not on a caparisoned steed with the panoply of combat'
    by: matthew 21
  - claim: 'No move was made to stop Him: the Romans saw no threat; the leaders feared to arrest Him publicly'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'the Romans apparently did not think that this spontaneous action was much of a threat, whereas the Jewish leadership, recognizing the popularity of Jesus, was hesitant to cause an uproar among the people by arresting Jesus publicly'
    by: matthew 21
  - claim: 'The city full of Passover pilgrims; the answer “the prophet of Nazareth” fell short of the shouts’ meaning'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/21.htm'
    quote: 'The answer fell short of the full meaning of the shouts of the people, but it expressed that aspect of the character of Jesus which was most intelligible to strangers.'
    by: matthew 21
  - claim: 'Luke’s lament over Jerusalem tempers the joy of the entry'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Luke differs from the other Synoptics in that he adds a lament over Jerusalem by Jesus even as he approaches the city, adding a note of sadness or passion to an otherwise joyful episode.'
    by: matthew 21
  - claim: 'The Kirtland Temple was dedicated on Palm Sunday 1836 and D&C 110 came on Easter Sunday'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'The dedication of the Kirtland Temple on March 27, 1836, occurred on Palm Sunday that year, and the appearance of the glorified, risen Lord to Joseph Smith and Oliver Cowdery (Doctrine and Covenants 110:1‒10) occurred on April 3, which was Easter Sunday.'
    by: matthew 21
  - claim: 'The Pharisees of Luke 19:39 may have been friendly ones; the stones would cry out in praise or in accusation, the inanimate world knowing its King'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'Either the stones cry out in sweet adoration of their king—assuming that the disciples withhold their praise—or they cry out accusingly against the silent disciples'
    by: luke 19
  - claim: 'Luke omits David from the cry; the praise rises to heaven, as if some understood He was not to be an earthly king'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'By recording this praise, Luke seems to be saying that some in the crowd understand Jesus’ ultimate mission—he is not to be an earthly king. Accordingly, Luke omits any reference to David'
    by: luke 19
  - claim: 'Jesus’s acts mirror David’s in reverse: David wept going up the Mount of Olives (2 Sam. 15:30); Jesus took a donkey there and wept seeing the city'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Jesus’s acts mirror David’s in reverse order. First, Jesus acquired a donkey on the summit of the Mount of Olives, rode to Jerusalem, and then wept over Jerusalem when he came within view of the city (Luke 19:41).'
    by: luke 19
  - claim: 'The unridden colt reflects the Septuagint of Zech. 9:9, “riding on a new donkey”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'a detail based on the Septuagint, or Greek translation, of Zechariah 9:9: “Your king comes to you . . . riding on a new donkey.”'
    by: luke 19
  - claim: 'The charax of Luke 19:43 is a palisade or siege rampart'
    key: thayer
    url: 'https://biblehub.com/greek/5482.htm'
    quote: '2. a palisade or rampart (i. e. pales between which earth, stones, trees and timbers are heaped and packed together): Luke 19:43'
    by: luke 19
  - claim: 'Titus’s wall around Jerusalem: thirty-nine furlongs, thirteen garrison posts, built in three days'
    key: josephus-war
    url: 'http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0148%3Abook%3D5%3Awhiston+chapter%3D12%3Awhiston+section%3D2'
    quote: 'Now the length of this wall was forty furlongs, one only abated. Now at this wall without were erected thirteen places to keep garrison in'
    by: luke 19
  - claim: 'Visitation (episkopē) can be a visit of mercy or of reckoning from God'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-19-104'
    quote: 'The sense of the noun (Greek episkopē) and its associated verb splits between pleasant (see 1:78; 7:16; 1 Pet. 2:12) and unpleasant visits, usually from God'
    by: luke 19
open:
  - 'Why does John say the disciples understood only after Jesus was glorified ([[John 12:16]]), and why does he tie the crowd to Lazarus ([[John 12:17–19]])?'
  - 'What is the place “where two ways met” ([[Mark 11:4]]), and why does Mark have Jesus only look round the temple that evening ([[Mark 11:11]])?'
