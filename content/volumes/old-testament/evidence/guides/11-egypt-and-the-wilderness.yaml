page: 11-egypt-and-the-wilderness
claims:
  - where: "opening"
    claim: "Bible Dictionary: Seti I and Ramses II the Pharaohs of oppression; Merneptah generally believed the Exodus Pharaoh; the discovery of the Amarna tablets has thrown doubt on this"
    key: bd-pharaoh
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng"
    quote: "(3) The Pharaohs of oppression, Seti Ⅰ and Ramses Ⅱ, belonging to the 19th dynasty (Ex. 1; 2); it is generally believed that the Pharaoh of the Exodus was Mer-ne-ptah, but the discovery of the Tell el-Amarna tablets has thrown doubt on this."
  - where: "opening"
    claim: "Student Manual: the date cannot be settled decisively, yet almost all scholars agree upon Ramses II or possibly his father"
    key: ot-manual-ex-11-19
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng"
    quote: "“Clearly the question of the date of the Exodus cannot be settled decisively. Yet the weight of evidence is strong, and almost all scholars today agree upon Ramses II or possibly his father as the ruler whose heart was hardened against the Hebrews.”"
  - where: "opening"
    claim: "KnoWhy 847: text names no Pharaoh"
    key: sc-knowhy-847
    url: "https://scripturecentral.org/knowhy/why-does-contextualizing-the-exodus-story-matter"
    quote: "But the text never states which pharaoh this is, making it difficult to contextualize the biblical account."
  - where: "opening"
    claim: "KnoWhy 847: Ramesses II may well have been the Pharaoh; difficult to be sure"
    key: sc-knowhy-847
    url: "https://scripturecentral.org/knowhy/why-does-contextualizing-the-exodus-story-matter"
    quote: "Although it is difficult to be completely sure, this evidence suggests Ramesses II may well have been the pharaoh of the Exodus."
  - where: "section “The map”"
    claim: "Sinai’s site disputed; probably Jebel Musa"
    key: bd-sinai
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/sinai?lang=eng"
    quote: "Its site has been much disputed, and some scholars maintain that it was in the country of Edom. It probably was in the southern part of the peninsula between the gulfs of Suez and Aqabah and is to be identified with one of the peaks of Jebel Musa."
  - where: "section “The map”"
    claim: "A traditional site of Mount Sinai"
    key: scripture-helps-ex-19
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng"
    quote: "A traditional site of Mount Sinai in Egypt"
  - where: "section “The map”"
    claim: "Muhlestein: we do not know where Sinai was"
    key: muhlestein-egypt-bible
    url: "https://rsc.byu.edu/vol-11-no-3-2010/egypt-bible"
    quote: "I think we just do not know."
  - where: "section “The map”"
    claim: "Bible Map 2 labels its line “Possible route of the Exodus”"
    key: bible-maps-2
    url: "https://www.churchofjesuschrist.org/study/scriptures/bible-maps/map-2?lang=eng"
    quote: "Possible route of the Exodus"
  - where: "section “The events”"
    claim: "Many scholars: a new dynasty overthrew the Hyksos"
    key: scripture-helps-ex-1
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng"
    quote: "Eventually a new dynasty overthrew these foreign rulers, which may explain the statement that “there arose up a new king over Egypt.”"
  - where: "section “The events”"
    claim: "Horeb is also called Mount Sinai"
    key: scripture-helps-ex-1
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng"
    quote: "Horeb is also called Mount Sinai and is the place where Moses would later receive the law and the Ten Commandments from the Lord."
  - where: "section “The events”"
    claim: "The plagues showed Jehovah more powerful than the gods of Egypt"
    key: scripture-helps-ex-7
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng"
    quote: "The plagues clearly demonstrated that Jehovah was more powerful than the gods of Egypt, including Pharaoh, who was seen by the Egyptians as a god."
  - where: "section “The events”"
    claim: "Red Sea may be translated Reed Sea; exact camp unclear"
    key: scripture-helps-ex-14
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng"
    quote: "The Hebrew phrase translated as “Red Sea” can also be translated as “Reed Sea” or “Sea of Reeds.”"
  - where: "section “The events”"
    claim: "The exact camp after leaving Egypt is unclear"
    key: scripture-helps-ex-14
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng"
    quote: "The exact location where the Israelites camped after their departure from Egypt is unclear."
  - where: "section “The events”"
    claim: "Israel stayed at Sinai nearly a year"
    key: scripture-helps-ex-19
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng"
    quote: "The Israelites remained at Sinai for nearly a year."
  - where: "section “The events”"
    claim: "Tabernacle: so the Lord could dwell among His people"
    key: scripture-helps-ex-35
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng"
    quote: "the Lord commanded him to build a sanctuary, or tabernacle, so the Lord could “dwell among” His people."
  - where: "section “The events”"
    claim: "Ten spies’ report; Joshua and Caleb; Israel would wander forty years"
    key: scripture-helps-num
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng"
    quote: "Most of the Israelites accepted the report of the 10 spies, who claimed that conquering the promised land would be impossible."
  - where: "section “The events”"
    claim: "Lord said they would wander 40 years"
    key: scripture-helps-num
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng"
    quote: "The Lord said that He would not destroy the people, but they would wander in the desert for 40 years."
  - where: "section “The events”"
    claim: "Moses and Aaron not allowed to enter the promised land"
    key: scripture-helps-num
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng"
    quote: "He declared that because of their actions, Moses and Aaron would not be allowed to lead the Israelites into the promised land."
  - where: "section “The events”"
    claim: "Thirty-eight years of wandering not described"
    key: ot-manual-numbers-13-36
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng"
    quote: "Between the rebellion of Korah (chaps. 16–17) and the request for passage through the land of Edom (chap. 20), thirty-eight years of wandering had transpired. For reasons not known to us now, Moses did not describe those years in this record."
  - where: "section “The events”"
    claim: "Jesus taught the bronze serpent symbolized His atoning sacrifice"
    key: scripture-helps-num
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng"
    quote: "Most notably, Jesus Christ taught that this incident symbolized His atoning sacrifice."
  - where: "section “The events”"
    claim: "Sihon, king of the Amorites, conquered by Moses"
    key: bd-sihon
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/sihon?lang=eng"
    quote: "King of the Amorites, dispossessed the Moabites (Num. 21:26–30); conquered by Moses (21:21–35;"
  - where: "section “The events”"
    claim: "Og, king of Bashan, conquered by Moses"
    key: bd-og
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/og?lang=eng"
    quote: "King of Bashan, and one of the giant race of Rephaim; his bed (possibly his sarcophagus) (Deut. 3:11); his kingdom conquered by Moses (Num. 21:33;"
  - where: "section “The events”"
    claim: "Balaam bribed by Balak to curse Israel; curse turned to blessing"
    key: bd-balaam
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng"
    quote: "bribed by Balak, king of Moab, to curse the Israelites, Num. 22:5–18; his life saved by means of the ass, 22:22–35; the curse turned to blessing, 23–24;"
  - where: "section “The events”"
    claim: "Moses’s three sermons to a new generation"
    key: scripture-helps-deut
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng"
    quote: "These sermons contain Moses’s heartfelt pleas for the Israelites to remember the Lord and live His laws in the promised land. The instructions in Deuteronomy were specifically directed to a new generation whose parents had died in the wilderness following their rebellion."
  - where: "section “The events”"
    claim: "JST and Book of Mormon on the end of Moses’s life"
    key: scripture-helps-deut
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng"
    quote: "The Joseph Smith Translation clarifies that Moses was not buried in the land of Moab, but instead “the Lord took him unto his Fathers, in a valley in the land of Moab, … therefore, no man knoweth of his sepulchre unto this day.” The Book of Mormon affirms that at the end of Moses’s life, “the Lord took Moses unto himself.”"
  - where: "section “The events”"
    claim: "Photograph caption: tomb scenes record taskmasters and brick quotas"
    key: muhlestein-israel-egypt
    url: "https://rsc.byu.edu/creation-sinai/israel-egypt-canaan"
    quote: "Scenes from Egyptian tombs record that taskmasters insured that those they oversaw made their quota of bricks, which were made using straw, mud, and the sun."
  - where: "section “The nations”"
    claim: "Pithom and Pa-Ramses dated to Ramses II; Israelite slaves employed building them"
    key: bd-egypt
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng"
    quote: "Under Ramses Ⅱ, a king of the 19th dynasty, were built the two store cities, Pithom and Pa-Ramses, in the construction of which the Israelite slaves were employed."
  - where: "section “The nations”"
    claim: "Midianites: wandering Arab tribes, akin to the Hebrews"
    key: bd-midianites
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/midianites?lang=eng"
    quote: "A powerful confederation of wandering Arab tribes, akin to the Hebrews, but often in conflict with them."
  - where: "section “The nations”"
    claim: "Jethro descended from Abraham and Keturah"
    key: scripture-helps-ex-1
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng"
    quote: "As a Midianite, Jethro was a descendant of Abraham and Keturah through their son Midian."
  - where: "section “The nations”"
    claim: "Amalek lived in the desert of Paran"
    key: bd-amalek
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/amalek?lang=eng"
    quote: "An Arab tribe that lived in the desert of Paran between the Arabah and the Mediterranean"
  - where: "section “The nations”"
    claim: "Amalekites may have been descendants of Esau"
    key: ot-manual-ex-11-19
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-11-19-the-passover-and-the-exodus?lang=eng"
    quote: "The Amalekites may have been descendants of Esau (see Genesis 36:12, 16)."
  - where: "section “The nations”"
    claim: "Edom south of the Dead Sea"
    key: bd-edom
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng"
    quote: "This country lay south of the Dead Sea, having Moab on the north and the Dead Sea on the northwest."
  - where: "section “The nations”"
    claim: "Edom: kinship with Israel"
    key: bd-edom
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng"
    quote: "In spite of the kinship there seems to have been great mutual hatred"
  - where: "section “The nations”"
    claim: "Moab east of the Dead Sea; akin to the Israelites"
    key: bd-moab
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng"
    quote: "The land of Moab lay east of the Dead Sea. The Moabites were akin to the Israelites"
  - where: "section “The nations”"
    claim: "Ammon descended from Lot"
    key: bd-ammon
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng"
    quote: "A tribe descended from Lot, the nephew of Abraham (Gen. 19:38; Deut. 2:19);"
  - where: "section “The nations”"
    claim: "Canaan: non-Israelite inhabitants west of Jordan"
    key: bd-canaan
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/canaan?lang=eng"
    quote: "sometimes as a general name for all the non-Israelite inhabitants of the country west of Jordan"
  - where: "section “The nations”"
    claim: "Canaanites to be driven out for their wickedness"
    key: scripture-helps-deut
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng"
    quote: "Moses explained that the Canaanites were to be driven out of the land because of their wickedness."
  - where: "section “The books of this period”"
    claim: "Exodus: slavery in Egypt, departure under Moses, dedication to God’s service"
    key: gs-exodus
    url: "https://www.churchofjesuschrist.org/study/scriptures/gs/exodus?lang=eng"
    quote: "The early history of Israel as recorded in Exodus can be divided into three parts: (1) the people’s slavery to Egypt, (2) their departure from Egypt under Moses’ leadership, and (3) their dedication to God’s service in their religious life and their political life."
  - where: "section “The books of this period”"
    claim: "Leviticus contents"
    key: bd-leviticus
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/leviticus?lang=eng"
    quote: "(1) The sacrificial ordinances (Lev. 1–7)"
  - where: "section “The books of this period”"
    claim: "Leviticus: consecration of priests, uncleanness, Day of Atonement, law of holiness"
    key: bd-leviticus
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/leviticus?lang=eng"
    quote: "(5) The law of holiness (Lev. 17–26), containing a systematic code of laws dealing with religious and social observances."
  - where: "section “The books of this period”"
    claim: "Numbers named for its two censuses; Sinai to the plains of Moab"
    key: bd-numbers
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng"
    quote: "The book that bears this name is so called from the double numbering or census of the people (Num. 1–4; 26)."
  - where: "section “The books of this period”"
    claim: "Numbers ends at the plains of Moab"
    key: bd-numbers
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng"
    quote: "till they reach “the plains of Moab by Jordan near Jericho.”"
  - where: "section “The books of this period”"
    claim: "Deuteronomy: repetition of the law; Moses’s last discourses"
    key: bd-deuteronomy
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng"
    quote: "The word means “repetition of the law.” The book contains the three last discourses of Moses delivered in the plains of Moab just before his death (translation)."
  - where: "section “The nations”"
    claim: "Sihon, king of the Amorites"
    key: bd-sihon
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/sihon?lang=eng"
    quote: "King of the Amorites, dispossessed the Moabites (Num. 21:26–30); conquered by Moses (21:21–35;"
  - where: "section “The nations”"
    claim: "Og, king of Bashan"
    key: bd-og
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/og?lang=eng"
    quote: "King of Bashan, and one of the giant race of Rephaim;"
  - where: "section “The events”"
    claim: "Other evidence suggests the text refers to the Red Sea; the sea crossed was a large body of water"
    key: scripture-helps-ex-14
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/14-exodus-14-18?lang=eng"
    quote: "However, other evidence suggests that the text is indeed referring to the Red Sea. Regardless of where the Israelites were, the scriptures suggest that the sea they crossed was a large body of water."
  - where: "section “The events”"
    claim: "The burning bush encounter took place at Horeb"
    key: scripture-helps-ex-1
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/12-exodus-1-6?lang=eng"
    quote: "Moses’s encounter with the Lord at the burning bush took place at Horeb, “the mountain of God.”"
