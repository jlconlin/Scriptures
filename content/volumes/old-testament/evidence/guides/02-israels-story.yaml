page: 02-israels-story
claims:
  - where: 'opening'
    claim: 'The Old Testament records God’s dealings with His covenant children from the Creation until about 400 years before Christ'
    key: scripture-helps-welcome
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng'
    quote: 'The Old Testament is a record of God’s dealings with His covenant children from the Creation until about four hundred years before the birth of Jesus Christ. The Hebrew word translated as “testament” can also mean “covenant.” In the Old'
  - where: 'opening'
    claim: 'Its books were grouped by subject, not always in chronological order'
    key: scripture-helps-welcome
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng'
    quote: 'When the Old Testament was compiled, its books were not always placed in chronological order but were instead grouped according to their subject material. Anciently, the books of the Old Testament were grouped into three main sections: the Law, the'
  - where: 'opening'
    claim: 'The prophets’ books are not in historical order'
    key: scripture-helps-welcome
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng'
    quote: 'These books are not in historical order.'
