  - where: 'section “The patriarchs, and Egypt”'
    claim: 'Dating the patriarchs is a difficult task; one study places Abraham’s birth about 1943 BC, in Egypt’s Middle Kingdom, the Twelfth Dynasty about 1950–1750'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Determining a date for the patriarchs and matriarchs is a difficult task. The lack of biblical uniformity in dating schemes, as well as a comparable paucity of biblical information about the world around Abraham and Sarah—which could be synchronized with established chronologies—makes the task of dating the lives of Abraham and Sarah somewhat speculative. For the purposes of this chapter, we will use the dating scheme proposed by John M. Lundquist in the Studies in Scripture series.[1] Lundquist posits that Abraham was born in about 1943 BC, which would place his long adult life right in the middle of Egypt’s Middle Kingdom. While it may seem that the Middle Kingdom’s more than two hundred years of existence provides only a very rough date range, we must also remember that Abraham himself lived for almost two hundred years, most of which must have overlapped with Egypt’s Twelfth Dynasty (ca. 1950–1750 BC).'
  - where: 'section “The patriarchs, and Egypt”'
    claim: 'Joseph cannot be dated precisely; the most likely setting is when the Hyksos began to take control of all of Egypt, about 1650 BC'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Understanding the Hyksos presence may be key to understanding the Joseph in Egypt narrative. Again, we cannot date Joseph precisely, but the most likely setting for Joseph is when the Hyksos began to take control of all of Egypt, in about 1650 BC.'
