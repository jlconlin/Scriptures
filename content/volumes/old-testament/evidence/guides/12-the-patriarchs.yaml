page: 12-the-patriarchs
claims:
  - where: 'opening'
    claim: 'Bible Chronology gives no date from Abram to Joshua'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Birth of Abram. Birth of Isaac. Birth of Jacob. Birth of Joseph.'
  - where: 'opening'
    claim: 'For the earliest history Church relies on scripture alone'
    key: bible-chron-intro
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/introduction?lang=eng'
    quote: 'For the earliest parts of Old Testament history we rely entirely on the scripture itself'
  - where: 'opening'
    claim: 'Student Manual estimates Isaac born about 1900 B.C.'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: 'it is estimated that Isaac was born approximately 1900 B.C.'
  - where: 'opening'
    claim: 'Abraham''s life usually dated to Middle Bronze Age I or II, about 2100-1750'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Abraham’s life is usually dated to either the Middle Bronze Age I (MB I; approximately 2100–2000 BC) or the Middle Bronze Age II (MB II; approximately 2000–1750 BC)'
  - where: 'opening'
    claim: 'One scheme puts Abraham''s birth about 1943 BC'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'Lundquist posits that Abraham was born in about 1943 BC'
  - where: 'section “The map”'
    claim: 'Ur identified with modern Mugheir'
    key: bd-ur
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ur?lang=eng'
    quote: 'It is identified with modern Mugheir'
  - where: 'section “The map”'
    claim: 'A number of scholars argue for a northern location; Book of Abraham places Ur at plain of Olishem'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'a number of scholars have argued for a northern location.'
  - where: 'section “The map”'
    claim: 'Hoskisson: Ur in northwestern Syria or southcentral Turkey'
    key: hoskisson-ur
    url: 'https://rsc.byu.edu/pearl-great-price-revelations-god/where-was-ur-chaldees'
    quote: 'the Ur of Abraham is to be found in northwestern Syria or southcentral Turkey'
  - where: 'section “The events”'
    claim: 'Pharaoh of Abram probably one of the Hyksos'
    key: bd-pharaoh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: 'The Pharaoh (probably one of the Hyksos or Shepherd kings) visited by Abram'
  - where: 'section “The events”'
    claim: 'Melchizedek lived about 2000 B.C.'
    key: bd-melchizedek
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/melchizedek?lang=eng'
    quote: 'A notable prophet and leader who lived about 2000 B.C.'
  - where: 'section “The events”'
    claim: 'Abrahamic covenant renewed with Isaac and Jacob'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'It was renewed with Isaac (Gen. 26:1–4, 24) and again with Jacob (Gen. 28; 35:9–13; 48:3–4).'
  - where: 'section “The events”'
    claim: 'Moriah-temple hill identification is a tradition first recorded by Josephus'
    key: bd-moriah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moriah?lang=eng'
    quote: 'a tradition first recorded by the Jewish historian Josephus'
  - where: 'section “The events”'
    claim: 'Gee: unlikely Moriah was at Jerusalem'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'It is unlikely that Moriah was at Jerusalem.'
  - where: 'section “The events”'
    claim: 'Bible Dictionary counts Joseph''s Pharaoh among the Hyksos'
    key: bd-pharaoh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: '(2) Pharaoh (also one of the Hyksos) and Joseph (Gen. 39–50).'
  - where: 'section “The events”'
    claim: 'Joseph cannot be dated precisely; most likely setting the Hyksos takeover about 1650'
    key: muhlestein-israel-egypt
    url: 'https://rsc.byu.edu/creation-sinai/israel-egypt-canaan'
    quote: 'we cannot date Joseph precisely, but the most likely setting for Joseph is when the Hyksos began to take control of all of Egypt'
  - where: 'section “The events”'
    claim: 'Goshen probably in the eastern delta'
    key: bd-goshen
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/goshen?lang=eng'
    quote: 'probably in the eastern part of the delta of the Nile.'
  - where: 'section “The events”'
    claim: 'Khnumhotep II''s tomb at Beni Hasan shows evidence for the Hyksos from as early as 1890 BC'
    key: sc-knowhy-844
    url: 'https://scripturecentral.org/knowhy/why-were-the-hebrews-allowed-to-settle-in-egypt'
    quote: 'One finds evidence for the Hyksos from as early as 1890 BC in the tomb of a 12th-dynasty official Khnumhotep II, at Beni Hasan in Egypt.'
  - where: 'section “The events”'
    claim: 'That was around the time Abraham was in Egypt'
    key: sc-knowhy-844
    url: 'https://scripturecentral.org/knowhy/why-were-the-hebrews-allowed-to-settle-in-egypt'
    quote: 'This was around the time that Abraham also was in Egypt.'
  - where: 'section “The peoples”'
    claim: 'Chaldea defined'
    key: bd-chaldea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chaldea?lang=eng'
    quote: 'The portion of Babylonia that lay south and east of Babylon'
  - where: 'section “The peoples”'
    claim: 'Kasdim may not be the later kaldu'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'which may not be the same thing as the later tribe, the kaldu'
  - where: 'section “The peoples”'
    claim: 'Canaan a general name for non-Israelite inhabitants'
    key: bd-canaan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/canaan?lang=eng'
    quote: 'sometimes as a general name for all the non-Israelite inhabitants of the country west of Jordan'
  - where: 'section “The peoples”'
    claim: 'Amorites'
    key: bd-amorites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amorites?lang=eng'
    quote: 'northwest Semitic-speaking peoples who lived about the time of Abraham'
  - where: 'section “The peoples”'
    claim: 'Philistines held the lowland on the Mediterranean coast'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'the rich lowland on the Mediterranean coast'
  - where: 'section “The peoples”'
    claim: 'Gerar near Gaza'
    key: bd-gerar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gerar?lang=eng'
    quote: 'A place in southwestern Palestine, near Gaza (Gen. 10:19).'
  - where: 'section “The peoples”'
    claim: 'Egypt known as Mizraim'
    key: bd-egypt
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng'
    quote: 'This country was known to the Hebrews as Mizraim.'
  - where: 'section “The peoples”'
    claim: 'Pharaoh means Great House'
    key: bd-pharaoh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: 'The title given to the Egyptian kings; its meaning is “Great House.”'
  - where: 'section “The peoples”'
    claim: 'Ishmaelites a wandering race'
    key: bd-ishmael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ishmael?lang=eng'
    quote: 'His descendants, the Ishmaelites, appear to have been a wandering race (16:12)'
  - where: 'section “The peoples”'
    claim: 'Midianites wandering Arab tribes akin to the Hebrews'
    key: bd-midianites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/midianites?lang=eng'
    quote: 'A powerful confederation of wandering Arab tribes, akin to the Hebrews'
  - where: 'section “The peoples”'
    claim: 'Edom means Red; Esau, descendants, country in Mount Seir'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'Red. Name of Esau ( Gen. 25:30 ); of his descendants ( Gen. 36 ; 1 Chr. 1:35–42 ); of their country in Mount Seir'
  - where: 'section “The peoples”'
    claim: 'Lot ancestor of Moab and Ammon'
    key: bd-lot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lot?lang=eng'
    quote: 'He was the ancestor of Moab and Ammon (Gen. 19:37–38; Deut. 2:9, 19).'
  - where: 'section “The peoples”'
    claim: 'Laban''s branch remained at Haran'
    key: bd-laban
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/laban?lang=eng'
    quote: 'His branch of the family remained at Haran when Abraham moved on into Canaan.'
  - where: 'section “The peoples”'
    claim: 'Arameans kin to the Hebrews'
    key: bd-aram
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aram?lang=eng'
    quote: 'The Arameans therefore had kinship with the Hebrews.'
  - where: 'section “The books of this period”'
    claim: 'Genesis: beginning of the Abrahamic family; Joseph a preserver of Israel'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'the beginning of the Abrahamic family leading to the establishment of the house of Israel. Joseph’s role as a preserver of Israel is also given emphasis.'
  - where: 'section “The books of this period”'
    claim: 'Church statement on the facsimiles: not known how they relate to the text; Jewish authors adapted Egyptian drawings and stories'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'We don’t know how the facsimiles relate to the text. There is evidence that some Jewish authors during the era in which the papyri were created adapted and incorporated Egyptian drawings and stories into their own sacred texts, including those relating to Abraham.'
