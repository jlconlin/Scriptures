  - where: "section “Written, and written again”"
    claim: "Papyrus the ordinary writing material"
    key: bd-writing
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/writing?lang=eng"
    quote: "Papyrus (made from the pith of the plant Cyperus Papyrus) was the ordinary writing material."
  - where: "section “Written, and written again”"
    claim: "Babylonian clay tablets"
    key: bd-writing
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/writing?lang=eng"
    quote: "In Babylonia books were written on clay tablets or cylinders while the clay was damp"
  - where: "section “Written, and written again”"
    claim: "Old Testament written on skin or papyrus as scrolls, mostly Hebrew; no originals; oldest manuscripts third century BC"
    key: scripture-helps-ot-welcome
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng"
    quote: "The books of the Old Testament were likely originally written on material such as animal skin or papyrus. These were transcribed and preserved as scrolls, written mostly in Hebrew."
  - where: "section “Written, and written again”"
    claim: "No original manuscripts; oldest date to the third century BC"
    key: scripture-helps-ot-welcome
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng"
    quote: "There are no surviving original manuscripts written by the authors of the Old Testament. The oldest existing manuscripts of Old Testament texts date back to the third century BC."
  - where: "section “Written, and written again”"
    claim: "The Great Isaiah Scroll: length, no chapters or verses, no vowels or punctuation"
    key: dss-roundtable-2007
    url: "https://rsc.byu.edu/vol-8-no-3-2007/dead-sea-scrolls-roundtable-discussion-celebrating-60th-anniversary-their-discovery-part-1"
    quote: "The Great Isaiah Scroll was twenty-three feet six inches long; it lacked verses and chapters. It was written in Hebrew without vowels, without punctuation"
  - where: "section “Written, and written again”"
    claim: "Chapter and verse divisions are later: Langton, Estienne, Geneva"
    key: jackson-kjv-jst
    url: "https://rsc.byu.edu/king-james-bible-restoration/king-james-bible-joseph-smith-translation"
    quote: "Stephen Langton divided the text of the Bible into numbered chapters early in the thirteenth century. Robert Estienne, also known as Stephanus, invented the verse divisions in the sixteenth century"
  - where: "section “Written, and written again”"
    claim: "Verses came into English with the Geneva edition of 1560"
    key: jackson-kjv-jst
    url: "https://rsc.byu.edu/king-james-bible-restoration/king-james-bible-joseph-smith-translation"
    quote: "His verses were brought into the English Bible with the Geneva edition of 1560, and they remain with us today."
  - where: "section “The Hebrew Bible and its order”"
    claim: "Anciently three groups: Law, Prophets, Writings"
    key: scripture-helps-ot-welcome
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng"
    quote: "Anciently, the books of the Old Testament were grouped into three main sections: the Law, the Prophets, and the Writings."
  - where: "section “The Hebrew Bible and its order”"
    claim: "Hebrew Bible books divided into three groups"
    key: bd-bible
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/bible?lang=eng"
    quote: "In the Hebrew Bible (Old Testament) the books were divided into three groups: the Law, the Prophets, and the Writings (or Hagiographa). See Luke 24:44."
  - where: "section “The Hebrew Bible and its order”"
    claim: "Jesus names the divisions"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/nt/luke/24?lang=eng"
    quote: "in the law of Moses, and in the prophets, and in the psalms, concerning me"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Law: Genesis through Deuteronomy"
    key: scripture-helps-ot-welcome
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng"
    quote: "The Law. The books from Genesis through Deuteronomy"
  - where: "section “The Hebrew Bible and its order”"
    claim: "History: Joshua through Esther"
    key: scripture-helps-ot-welcome
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng"
    quote: "The History. The books from Joshua through Esther"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Poetry: Job through Song of Solomon"
    key: scripture-helps-ot-welcome
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng"
    quote: "The Poetry. The books from Job through Song of Solomon"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Prophets: Isaiah through Malachi, not in historical order"
    key: scripture-helps-ot-welcome
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng"
    quote: "The Prophets. The books from Isaiah through Malachi contain the teachings of prophets whose ministries occurred during or after the time in which kings ruled over the children of Israel. These books are not in historical order."
  - where: "section “The Hebrew Bible and its order”"
    claim: "Masoretic text agreed at Tiberias after A.D. 70"
    key: bd-bible
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/bible?lang=eng"
    quote: "soon after the destruction of Jerusalem (A.D. 70) much labor was bestowed upon the Hebrew text by the scholars who formed the Jewish School at Tiberias. One form of text was agreed upon, afterwards called the Masoretic text."
  - where: "section “The Hebrew Bible and its order”"
    claim: "Masoretic text formed about the 7th–10th centuries AD"
    key: scripture-helps-ot-welcome
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/000-intro/002-welcome?lang=eng"
    quote: "The Masoretic text was formed in approximately the seventh through the tenth centuries AD by a group of Jewish scholars known as the Masoretes."
  - where: "section “The Hebrew Bible and its order”"
    claim: "Vowel marks added about a thousand years after the Hebrew Bible closed"
    key: spackman-translations-differ
    url: "https://rsc.byu.edu/vol-15-no-1-2014/why-bible-translations-differ-guide-perplexed"
    quote: "Roughly one thousand years after the close of the Hebrew Bible, Jews who had memorized the traditional text improvised a system of indicating the pronunciation with marks above, below, and inside the consonants, called “vowel pointing”"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Some copies of the versions predated the oldest Masoretic copies"
    key: spackman-translations-differ
    url: "https://rsc.byu.edu/vol-15-no-1-2014/why-bible-translations-differ-guide-perplexed"
    quote: "Prior to the discovery of the Dead Sea Scrolls, some of the existing copies of these versions predated our oldest copies of the Masoretic Hebrew text"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Samaritan Pentateuch: Nehemiah’s ejected priest took a copy to the Samaritans"
    key: bd-samaritans
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng"
    quote: "When Nehemiah ejected from Jerusalem a grandson of the high priest Eliashib on account of his marriage with a heathen woman (Neh. 13:28), he took refuge with the Samaritans, taking with him a copy of the Pentateuch"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Septuagint made for Greek-speaking Jews in Alexandria"
    key: bd-septuagint
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/septuagint?lang=eng"
    quote: "made in the first instance for the use of Greek-speaking Jews living in Alexandria in the reign of Ptolemy Philadelphus (284–246 B.C.)"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Most New Testament quotations follow it; it included the Apocrypha"
    key: bd-septuagint
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/septuagint?lang=eng"
    quote: "Most of the quotations from the Old Testament in the New Testament are taken from this version; it was the Bible in common use at the beginning of the Christian era and included the books we call the Apocrypha."
  - where: "section “The Hebrew Bible and its order”"
    claim: "Septuagint and Samaritan Pentateuch differ from the Masoretic text"
    key: bd-bible
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/bible?lang=eng"
    quote: "They differ materially from the Masoretic text and in some cases have no doubt preserved older and truer readings"
  - where: "section “The Hebrew Bible and its order”"
    claim: "D&C 91: Apocrypha mostly translated correctly"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/91?lang=eng"
    quote: "it is mostly translated correctly"
  - where: "section “The Hebrew Bible and its order”"
    claim: "D&C 91: interpolations by the hands of men"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/91?lang=eng"
    quote: "which are interpolations by the hands of men"
  - where: "section “The Hebrew Bible and its order”"
    claim: "The three texts disagree, so early dates cannot be fixed"
    key: bible-chron-intro
    url: "https://www.churchofjesuschrist.org/study/scriptures/bible-chron/introduction?lang=eng"
    quote: "the Hebrew Bible, the Septuagint or Greek translation, and the Samaritan Pentateuch do not agree together, so that many dates cannot be fixed with certainty"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Lost books the Bible names: Nathan, Jehu"
    key: bd-lost-books
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng"
    quote: "book of Nathan the prophet (1 Chr. 29:29; 2 Chr. 9:29)"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Book of Jehu"
    key: bd-lost-books
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng"
    quote: "book of Jehu (2 Chr. 20:34)"
  - where: "section “The Hebrew Bible and its order”"
    claim: "Book of Mormon names Zenock, Zenos, Neum"
    key: bd-lost-books
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng"
    quote: "These writings are of Zenock, Zenos, and Neum (1 Ne. 19:10; Alma 33:3–17)."
  - where: "section “The Dead Sea Scrolls”"
    claim: "Found 1947 at Qumran in caves"
    key: bd-dead-sea-scrolls
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/dead-sea-scrolls?lang=eng"
    quote: "In 1947 in an area known as Qumran, near the northwest corner of the Dead Sea, some significant rolls of leather and a few copper manuscripts were found preserved in earthen jars in some dark caves."
  - where: "section “The Dead Sea Scrolls”"
    claim: "Found by goat herders"
    key: bd-dead-sea-scrolls
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/dead-sea-scrolls?lang=eng"
    quote: "They were found quite by accident by goat herders."
  - where: "section “The Dead Sea Scrolls”"
    claim: "Every Old Testament book but Esther; Deuteronomy, Isaiah, Psalms most numerous"
    key: bd-dead-sea-scrolls
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/dead-sea-scrolls?lang=eng"
    quote: "Complete copies or fragments of every book of the Old Testament have been found except the book of Esther. Deuteronomy, Isaiah, and Psalms are the most numerous."
  - where: "section “The Dead Sea Scrolls”"
    claim: "Counts: 36 Psalms, 30 Deuteronomy, 21 Isaiah"
    key: dss-roundtable-2007
    url: "https://rsc.byu.edu/vol-8-no-3-2007/dead-sea-scrolls-roundtable-discussion-celebrating-60th-anniversary-their-discovery-part-1"
    quote: "Psalms, with the remains of thirty-six copies found; Deuteronomy, with the remains of thirty copies; and Isaiah, with the remains of twenty-one copies."
  - where: "section “The Dead Sea Scrolls”"
    claim: "The oldest biblical texts among the scrolls are more than 1,000 years older than the oldest complete Masoretic Text"
    key: pike-parry-dss-2014
    url: "https://rsc.byu.edu/winter-2014/global-reach"
    quote: "more than 1,000 years older than the oldest complete traditional Hebrew Bible, called the Masoretic Text"
  - where: "section “The Dead Sea Scrolls”"
    claim: "Variants in some texts, close match to Masoretic in others"
    key: seely-masada
    url: "https://byustudies.byu.edu/article/the-masada-fragments-the-qumran-scrolls-and-the-new-testament"
    quote: "biblical texts were found that demonstrated many significant textual variants in the ancient Hebrew manuscripts, including significant additions to and deletions from individual books"
  - where: "section “The Dead Sea Scrolls”"
    claim: "Some texts closely match the Masoretic text"
    key: seely-masada
    url: "https://byustudies.byu.edu/article/the-masada-fragments-the-qumran-scrolls-and-the-new-testament"
    quote: "texts were found that closely match the Masoretic text"
  - where: "section “The Dead Sea Scrolls”"
    claim: "Bible Dictionary: scrolls show the text was corrupted by that time"
    key: bd-bible
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/bible?lang=eng"
    quote: "The Dead Sea Scrolls, some of which are believed to be as early as the 2nd century B.C., give evidence that the Old Testament text was corrupted at least by that time."
  - where: "section “The Dead Sea Scrolls”"
    claim: "No uniquely LDS doctrines purely preserved in the scrolls"
    key: pike-parry-dss-2014
    url: "https://rsc.byu.edu/winter-2014/global-reach"
    quote: "there are no uniquely LDS doctrines purely preserved in the Dead Sea Scrolls"
