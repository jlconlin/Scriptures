page: 05-temple-and-worship
claims:
  - where: 'opening'
    claim: 'Ex. 25:8: make a sanctuary that I may dwell among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'And let them make me a sanctuary; that I may dwell among them.'
  - where: 'opening'
    claim: 'The Lord has always commanded His people to build temples'
    key: gs-temple-house-of-the-lord
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/temple-house-of-the-lord?lang=eng'
    quote: 'The Lord has always commanded His people to build temples, holy buildings in which worthy Saints perform sacred ceremonies and ordinances of the gospel for themselves and for the dead.'
  - where: 'opening'
    claim: 'The tabernacle was a portable temple'
    key: gs-temple-house-of-the-lord
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/temple-house-of-the-lord?lang=eng'
    quote: 'The tabernacle erected by Moses and the children of Israel was a portable temple.'
  - where: 'section “The tabernacle”'
    claim: 'Ex. 25:9: after the pattern'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'According to all that I shew thee, after the pattern of the tabernacle, and the pattern of all the instruments thereof, even so shall ye make it.'
  - where: 'section “The tabernacle”'
    claim: 'The court was 100 cubits by 50'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The tent stood in a court 100 cubits by 50, surrounded by a fence (Ex. 27:18) five cubits high'
  - where: 'section “The tabernacle”'
    claim: 'The altar of burnt offering stood in the court in front of the tent door'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'In the court outside the tent and in front of its door stood the altar of burnt offering, a square of five cubits, three cubits high.'
  - where: 'section “The tabernacle”'
    claim: 'The laver; the priests washed hands and feet'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Between the altar of burnt offering and the door of the tent stood a laver of brass on a base of brass (Ex. 30:18). In it the priests washed their hands and feet when they went into the tent for any priestly purpose'
  - where: 'section “The tabernacle”'
    claim: 'A veil divided the tent; Holy Place with altar of incense, candlestick, table of shewbread'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The tabernacle was divided into two parts by a veil of the same materials as the screen of the court, the inner roof covering of the tabernacle, and the screen of the tent (Ex. 36:35, 37). In the outer compartment (20 cubits by 10), called the Holy Place, were three things:'
  - where: 'section “The tabernacle”'
    claim: 'The Holy of Holies held one piece of furniture, the ark; the mercy seat was where God’s glory was manifest and His throne in Israel'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The Holy of Holies contained only one piece of furniture: the Ark of the Covenant, or the Ark of the Testimony (Ex. 25:22).'
  - where: 'section “The tabernacle”'
    claim: 'The mercy seat was the place of the manifestation of God’s glory, God’s throne in Israel'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The mercy seat was the place of the manifestation of God’s glory (Ex. 25:22). It was God’s throne in Israel.'
  - where: 'section “The tabernacle”'
    claim: 'Three spaces, each an increasing proximity to God'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'Each space represented an increasing proximity to God’s holy presence.'
  - where: 'section “The tabernacle”'
    claim: 'The veil symbolized separation between God and man'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'The veil symbolized the “separation between God and man.”'
  - where: 'section “The tabernacle”'
    claim: 'Heb. 10:19–20 quoted; the tabernacle a type, Christ’s flesh the veil'
    key: sc-knowhy-698
    url: 'https://scripturecentral.org/knowhy/how-does-the-epistle-to-the-hebrews-reflect-the-israelite-temple'
    quote: '“boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh” (Hebrews 10:19–20).'
  - where: 'section “The tabernacle”'
    claim: '“Sanctuary” in Ex. 25:8 is miqdash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מִקְדָּ֑שׁ'
  - where: 'section “The tabernacle”'
    claim: '“Tabernacle” in Ex. 25:9 is mishkan'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'הַ/מִּשְׁכָּ֔ן'
  - where: 'section “The tabernacle”'
    claim: '“Tent of the congregation” in Ex. 40:34 is ohel moed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֹ֣הֶל'
  - where: 'section “The tabernacle”'
    claim: '“Tent of the congregation” in Ex. 40:34 is ohel moed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מוֹעֵ֑ד'
  - where: 'section “The tabernacle”'
    claim: 'The Church’s edition renders the Hebrew “tent of meeting”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'tabernacle of the congregation”: HEB tent of meeting.'
  - where: 'section “The tabernacle”'
    claim: 'Shakan implies a nonpermanent residence; the tabernacle a meeting place'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'the Hebrew term shakan, translated as “dwell,” implies a nonpermanent residence.'
  - where: 'section “The tabernacle”'
    claim: 'The tabernacle may be better viewed as a meeting place'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'it may be more accurate to view the tabernacle as more of a meeting place rather than as a permanent dwelling place of God.'
  - where: 'section “The tabernacle”'
    claim: 'Ex. 40:34: cloud and glory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'Then a cloud covered the tent of the congregation, and the glory of the LORD filled the tabernacle.'
  - where: 'section “The tabernacle”'
    claim: 'Tabernacle set in the precise center of the camp'
    key: ensign-tabernacle-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/03/journey-through-the-ancient-tabernacle?lang=eng'
    quote: 'the tabernacle was set up in the precise center of the camp'
  - where: 'section “The tabernacle”'
    claim: 'Tabernacle fixed at Shiloh; at Gibeon in Solomon’s reign; disappears after the temple'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'After the building of the temple it entirely disappears from the history.'
  - where: 'section “The tabernacle”'
    claim: 'Tabernacle at Shiloh, and at Gibeon in Solomon’s reign'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'in Solomon’s reign with its altar of burnt offering and ministered at by Zadok the high priest at Gibeon'
  - where: 'section “The tabernacle”'
    claim: 'Modern temples share similarities but do not match; animal sacrifice ended'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'Our modern temples share similarities with Israel’s tabernacle, but they certainly don’t match its description in Exodus. And we don’t kill animals in our temples—the Savior’s Atonement ended animal sacrifice almost 2,000 years ago.'
  - where: 'section “The tabernacle”'
    claim: 'Ark and high priest tied to Christ as God’s presence and Mediator'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'Just as the tabernacle, and the ark within it, represented God’s presence among His people, Jesus Christ was God’s presence among His people. Like the high priest, Jesus Christ is the Mediator between us and God the Father.'
  - where: 'section “The tabernacle”'
    claim: 'Temple washing, anointing, clothing, covenants, veil'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'To enter, we must first be washed and anointed. We wear sacred clothing. We make covenants. We pray at an altar from which prayers ascend to God. And we finally pass through a veil into God’s presence.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Tabernacle set up first day of first month of second year; no ark/glory etc.'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'on the first day of the first month of the second year (one year less 14 days from the Exodus) he reared it up and finished the work.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Tabernacle: ark, mercy seat'
    key: bd-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'Upon the ark and forming the lid was the mercy seat.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Tabernacle had one candlestick and one table (as Herod’s temple followed)'
    key: bd-temple-of-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-herod?lang=eng'
    quote: 'It followed the tabernacle (not Solomon’s temple) in having only one candlestick and one table of shewbread.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: '1 Kgs. 6:1: begun in Solomon’s fourth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'in the fourth year of Solomon’s reign over Israel, in the month Zif, which is the second month, that he began to build the house of the Lord.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: '1 Kgs. 6:38: finished in the eleventh year, seven years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'So was he seven years in building it.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Solomon’s temple kept the old ark and mercy seat, new cherubim, ten candlesticks and tables'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'In the Holy of Holies stood the old Mosaic ark with the mercy seat; but the cherubim overshadowing the mercy seat were new.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Ten candlesticks and ten tables, five on each side'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'Instead of one golden candlestick and one table of shewbread there were ten, five on each side.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: '2 Kgs. 25:9: Nebuzar-adan burns the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And he burnt the house of the Lord, and the king’s house, and all the houses of Jerusalem'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Solomon’s temple destroyed in 587 B.C.'
    key: bd-temple
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple?lang=eng'
    quote: 'This was destroyed in 587 B.C. and rebuilt by Zerubbabel about 70 years later.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Zerubbabel’s temple dedicated 516 B.C.'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'in the sixth year of Darius (516 B.C.) the feast of the dedication was kept (Ezra 6:15–16).'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Zerubbabel’s temple completed around 515 BC; about Solomon’s size; no ark'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The temple of Zerubbabel was completed around 515 BC, more than 20 years after the first group of exiles returned from Babylon. It was about the same size as Solomon’s temple and likely had a similar layout.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'The ark was not among the returned items, leaving the Holy of Holies empty'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'However, the ark of the covenant was not among these items, leaving the Holy of Holies empty.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Herod began in 17 B.C. to rebuild Zerubbabel’s temple'
    key: bd-temple-of-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-herod?lang=eng'
    quote: 'Herod, in the 18th year (17 B.C.) of his reign, proposed to rebuild the temple of Zerubbabel.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Herod’s design not complete until A.D. 64'
    key: bd-temple-of-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-herod?lang=eng'
    quote: 'the design was not complete till the year A.D. 64, only six years before the temple’s final destruction.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Herod’s temple had no ark'
    key: bd-temple-of-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-herod?lang=eng'
    quote: 'The temple, like that of Zerubbabel, had no ark.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Herod’s temple destroyed by Titus’s army, A.D. 70'
    key: bd-temple-of-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-herod?lang=eng'
    quote: 'In A.D. 70, on the evening of the anniversary of the destruction of the first temple, Herod’s temple was taken and destroyed by the army of Titus.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Herod’s temple on the exact site of Solomon’s'
    key: bd-temple-of-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-herod?lang=eng'
    quote: 'on the exact site of the temple of Solomon'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Solomon’s temple built on the model of the tabernacle, dimensions doubled'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The temple was built after the model of the tabernacle, the dimensions of each part being exactly double.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: '1 Chr. 28:11: David gave Solomon the pattern'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'Then David gave to Solomon his son the pattern of the porch'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: '2 Chr. 3:1: begun at Jerusalem in mount Moriah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'Then Solomon began to build the house of the Lord at Jerusalem in mount Moriah'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'The temple was small; only priests went within'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'It is sufficiently accounted for by the fact that the worshippers remained outside; only the priests went within.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Dedicated at the Feast of Tabernacles'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The house was consecrated at the feast of the seventh month, the Feast of Tabernacles (1 Kgs. 8:2; 2 Chr. 5:3).'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: '1 Kgs. 8:10–11: cloud filled the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'So that the priests could not stand to minister because of the cloud: for the glory of the Lord had filled the house of the Lord.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: '1 Kgs. 8:27: will God indeed dwell on the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'But will God indeed dwell on the earth? behold, the heaven and heaven of heavens cannot contain thee; how much less this house that I have builded?'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: '1 Kgs. 8:30: pray toward this place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'when they shall pray toward this place: and hear thou in heaven thy dwelling place'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'The Lord hallowed the house to put His name there'
    key: scripture-helps-1-kings-24
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: '“I have hallowed this house, which thou hast built, to put my name there for ever; and mine eyes and mine heart shall be there perpetually.”'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Often spoiled, polluted, cleansed; burned and destroyed by Nebuchadnezzar'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'Finally it was burned to the ground and utterly destroyed by Nebuchadnezzar (2 Kgs. 25:9), all that was valuable in it being carried to Babylon'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'It was polluted and cleansed by various kings'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'It was polluted by Athaliah (2 Chr. 24:7), Ahaz (29:5, 16), and above all, Manasseh (2 Kgs. 21:4–5, 7). It was cleansed by Hezekiah (2 Chr. 29:16) and Josiah (2 Kgs. 23:4, 6, 12).'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Isa. 44:28: Cyrus and the temple foundation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/44?lang=eng'
    quote: 'That saith of Cyrus, He is my shepherd, and shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built; and to the temple, Thy foundation shall be laid.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Ezra 3:12: old men wept'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'But many of the priests and Levites and chief of the fathers, who were ancient men, that had seen the first house, when the foundation of this house was laid before their eyes, wept with a loud voice; and many shouted aloud for joy:'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Hag. 2:3: who is left that saw this house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'Who is left among you that saw this house in her first glory?'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Hag. 2:9: glory of this latter house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'The glory of this latter house shall be greater than of the former, saith the Lord of hosts'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Hag. 2:7: desire of all nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'And I will shake all nations, and the desire of all nations shall come: and I will fill this house with glory, saith the Lord of hosts.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Desire of all nations can refer to the Savior; multiple fulfillments'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'This title can refer to the Savior Jesus Christ.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'Haggai 2:7 likely has multiple fulfillments'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Haggai’s prophecy that the “desire of all nations” would come to the temple likely has multiple fulfillments.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'One KnoWhy sets tabernacle and Solomon’s dedication as one pattern with Kirtland: God comes to His new house in glory'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'Finally, after the temple is dedicated, God comes to His new house in glory.'
  - where: 'section “Solomon''s temple, and the two after it”'
    claim: 'President Nelson: Solomon’s dedicatory prayer provides patterns used for temples today'
    key: sc-knowhy-814
    url: 'https://scripturecentral.org/knowhy/how-did-the-kirtland-temple-dedication-follow-ancient-patterns'
    quote: '“[the temple of Solomon’s] dedicatory prayer [provides] patterns that are employed for temples today.”'
  - where: 'section “The priests and the Levites”'
