page: 10-persia-and-the-return
claims:
  - where: 'opening'
    claim: 'Persia conquered the Babylonian kingdom in 539'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'In 539 BC, Persia conquered the kingdom of Babylon.'
  - where: 'opening'
    claim: 'Judea a Persian province until 334, then Alexander'
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'Judea was a subject province to the Persian Empire from 530 until 334 B.C., when it passed, along with the other provinces of that empire, into the hands of Alexander the Great.'
  - where: 'section “The map”'
    claim: 'Empire from Afghanistan to the Mediterranean; capitals'
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'which extended from Afghanistan to the Mediterranean, including Asia Minor. Its capitals were Persepolis, Babylon, Susa or Shushan, and Ecbatana or Achmetha.'
  - where: 'section “Rulers and events”'
    claim: 'Cyrus took Babylon (539)'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'In 539 BC, Persia conquered the kingdom of Babylon.'
  - where: 'section “Rulers and events”'
    claim: 'Cyrus took Babylon (538)'
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'Cyrus united the Medes and Persians, conquered Babylon (538 B.C.), and founded the Persian Empire'
  - where: 'section “Rulers and events”'
    claim: 'Cyrus overthrew the Chaldean dynasty'
    key: bd-cyrus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cyrus?lang=eng'
    quote: 'He captured Babylon and overthrew the Chaldean dynasty'
  - where: 'section “Rulers and events”'
    claim: 'Decree dated 538'
    key: matson-between-testaments
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/between-testaments'
    quote: 'In 538 BC, the Persian king Cyrus the Great authorized the rebuilding of the Jerusalem temple'
  - where: 'section “Rulers and events”'
    claim: 'Decree dated 537'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '537 | Decree of Cyrus for the return of the Jews.'
  - where: 'section “Rulers and events”'
    claim: 'Decree dated 536'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'The captivity was brought to a close by the decree of Cyrus in 536 B.C. (Ezra 1:2)'
  - where: 'section “Rulers and events”'
    claim: 'Cyrus charged to build a house at Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/1?lang=eng'
    quote: 'he hath charged me to build him an house at Jerusalem, which is in Judah.'
  - where: 'section “Rulers and events”'
    claim: 'First return of 40–50 thousand under Zerubbabel and Joshua'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'The first group of returning exiles arrived in Judea sometime after 536 B.C. under the leadership of Zerubbabel or (Zorobabel), a member of the royal Davidic line (see 1 Chronicles 3:19), and Joshua (or Jeshua), a priest of the lineage of Zadok. (Zadok was the high priest at the dedication of Solomon’s temple.) The first return somewhat resembled a religious crusade. It consisted of forty to fifty thousand people.'
  - where: 'section “Rulers and events”'
    claim: 'Zerubbabel Jehoiachin’s grandson, governor'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'Grandson of Jehoiachin, king of Judah, and son of Pedaiah'
  - where: 'section “Rulers and events”'
    claim: 'Zerubbabel governor'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'Zerubbabel was appointed pekhah or governor'
  - where: 'section “Rulers and events”'
    claim: 'Bible Dictionary: Zerubbabel also known by Persian name Sheshbazzar'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'Zerubbabel was also known by the Persian name Sheshbazzar'
  - where: 'section “Rulers and events”'
    claim: 'Student Manual: evidence favors two persons'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'The evidence seems to favor the idea of two separate persons.'
  - where: 'section “Rulers and events”'
    claim: 'Samaritans’ offer refused; they opposed'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'This claim not being allowed, they became, as the books of Ezra and Nehemiah show, bitter opponents of the Jews'
  - where: 'section “Rulers and events”'
    claim: 'Work ceased until second year of Darius'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/4?lang=eng'
    quote: 'Then ceased the work of the house of God which is at Jerusalem. So it ceased unto the second year of the reign of Darius king of Persia.'
  - where: 'section “Rulers and events”'
    claim: 'Darius son of Hystaspes in Ezra, Haggai, Zechariah'
    key: bd-darius
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/darius?lang=eng'
    quote: 'The son of Hystaspes and founder of the Persian dynasty'
  - where: 'section “Rulers and events”'
    claim: 'Haggai about 520'
    key: bd-haggai
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haggai?lang=eng'
    quote: 'His prophecy was spoken about 520 B.C.'
  - where: 'section “Rulers and events”'
    claim: 'Zechariah 520–518'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.)'
  - where: 'section “Rulers and events”'
    claim: 'Temple finished in Darius’s sixth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/6?lang=eng'
    quote: 'And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king.'
  - where: 'section “Rulers and events”'
    claim: 'Temple dedicated 516'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'in the sixth year of Darius (516 B.C.) the feast of the dedication was kept (Ezra 6:15–16).'
  - where: 'section “Rulers and events”'
    claim: 'Temple completed 515'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The temple of Zerubbabel was completed around 515 BC'
  - where: 'section “Rulers and events”'
    claim: 'Esther set in reign of Ahasuerus/Xerxes I, 486–465'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'The events of this book are set during the reign of King Ahasuerus, commonly identified as Xerxes I, who ruled Persia from 486 to 465 BC.'
  - where: 'section “Rulers and events”'
    claim: 'Ezra’s edict in 458'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'In 458 B.C. he obtained from Artaxerxes an important edict (Ezra 7:12–26) allowing him to take to Jerusalem any Jewish exiles who cared to go'
  - where: 'section “Rulers and events”'
    claim: 'Ezra’s date disputed; Nehemiah 445'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'Nehemiah’s appearance at Jerusalem can be firmly dated at 445 B.C. The date of Ezra’s mission is disputed.'
  - where: 'section “Rulers and events”'
    claim: 'Nehemiah cupbearer commissioned to rebuild walls'
    key: bd-nehemiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nehemiah?lang=eng'
    quote: 'held the important office of “cupbearer” at the court of Artaxerxes, from whom he obtained a royal commission authorizing him to rebuild the walls of Jerusalem.'
  - where: 'section “Rulers and events”'
    claim: 'Nehemiah 444 in the table'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '444 | Nehemiah appointed governor of Judea.'
  - where: 'section “Rulers and events”'
    claim: 'Malachi about 430'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'The prophecy of Malachi was spoken about 430 B.C.'
  - where: 'section “Rulers and events”'
    claim: 'Judea passes to Alexander in 334'
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'when it passed, along with the other provinces of that empire, into the hands of Alexander the Great.'
  - where: 'section “Rulers and events”'
    claim: 'Cylinder emphasizes Babylonian deities; Ezra edicts the exiles and temple'
    key: tiemeyer-cyrus-cylinder
    url: 'https://repository.up.ac.za/items/171e80d9-7323-4849-a990-555dfab16fb9'
    quote: 'Whereas the Cyrus Cylinder emphasises how Cyrus restores the Babylonian deities to their rightful place in Babylon, the edicts in Ezra stress the return of the exiles and the restoration of the temple in Jerusalem.'
  - where: 'section “Rulers and events”'
    claim: 'Cyrus considerate of religions of conquered peoples'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'He was particularly considerate of the religions of conquered peoples.'
  - where: 'section “The nations”'
    claim: 'Susa the capital under Cyrus'
    key: bd-shushan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shushan?lang=eng'
    quote: 'under Cyrus the capital of the Persian Empire'
  - where: 'section “The nations”'
    claim: 'Nehemiah in Shushan the palace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng'
    quote: 'as I was in Shushan the palace,'
  - where: 'section “The nations”'
    claim: 'Samaritans’ origins and opposition'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'They were the descendants of (1) foreign colonists placed there by kings of Assyria and Babylonia (2 Kgs. 17:24; Ezra 4:2, 10); (2) Israelites who escaped at the time of the captivity.'
  - where: 'section “The nations”'
    claim: 'Sanballat governor of Samaria; Tobiah Ammonite official'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Sanballat was the governor of Samaria. Tobiah was an Ammonite official and an influential member of the community in Jerusalem.'
  - where: 'section “The nations”'
    claim: 'Sanballat, Tobiah, Geshem mocked the work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard it, they laughed us to scorn'
  - where: 'section “The nations”'
    claim: 'Dispersion: Israelites who stayed abroad'
    key: bd-dispersion
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dispersion?lang=eng'
    quote: 'A title applied to all Israelites who remained settled in foreign countries subsequent to the decree of Cyrus (Ezra 1).'
  - where: 'section “The nations”'
    claim: 'Most exiles stayed in Babylon'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'Despite Cyrus’s edict, most of the exiles chose to stay in Babylon'
  - where: 'section “The nations”'
    claim: 'Edom south of Dead Sea; mutual hatred'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'In spite of the kinship there seems to have been great mutual hatred'
  - where: 'section “The nations”'
    claim: 'Mal. 1:2–3 Jacob loved, Esau hated'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'And I hated Esau, and laid his mountains and his heritage waste for the dragons of the wilderness.'
  - where: 'section “The nations”'
    claim: 'Alexander’s empire from Greece to the Indus'
    key: bd-alexander
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/alexander?lang=eng'
    quote: 'He made himself ruler over a wide empire stretching from Greece to the Indus'
  - where: 'section “The nations”'
    claim: 'Alexander attacked and defeated Persia in 334'
    key: ot-manual-kings-k
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-k?lang=eng'
    quote: 'In 334 B.C. he successfully attacked the Persian Empire and defeated it.'
  - where: 'section “The books of this period”'
    claim: 'Chronicles ends with Cyrus’s proclamation'
    key: bd-chronicles
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chronicles?lang=eng'
    quote: 'They give a short history of events from the Creation down to the proclamation of Cyrus allowing the Jews to return to their homeland.'
  - where: 'section “The books of this period”'
    claim: 'Isa. 44:28 names Cyrus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/44?lang=eng'
    quote: 'That saith of Cyrus, He is my shepherd, and shall perform all my pleasure'
  - where: 'section “The books of this period”'
    claim: 'Prophecy about 180 years before'
    key: gs-cyrus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/cyrus?lang=eng'
    quote: 'Isaiah’s prophecy was made about 180 years before the king’s action.'
  - where: 'section “The books of this period”'
    claim: 'Ezra 1–6 describes events 60–80 years before Ezra'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'The book of Ezra contains also an introductory section (Ezra 1–6) describing events that happened from 60 to 80 years before the arrival of Ezra in Jerusalem'
  - where: 'section “The books of this period”'
    claim: 'Nehemiah continues Ezra; four parts'
    key: bd-nehemiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nehemiah?lang=eng'
    quote: 'The book of Nehemiah (which is a continuation of Ezra, the two being regarded by the Jews as forming one book) contains an account of the progress and difficulties of the work and its final completion. The book divides into four parts: (a) 1:1–7:73, Nehemiah’s first visit to Jerusalem, and the rebuilding of the walls in spite of much opposition; (b) 8:1–10:39, religious and social reforms; (c) 11:1–13:3, lists of names, and account of the dedication of the wall; (d) 13:4–31, Nehemiah’s second visit after 12 years’ absence, and his further reforms.'
  - where: 'section “The books of this period”'
    claim: 'Esther: no direct reference to God; providence'
    key: bd-esther-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esther-book-of?lang=eng'
    quote: 'The book contains no direct reference to God, but He is everywhere taken for granted, as the book infers a providential destiny (Esth. 4:13–16) and speaks of fasting for deliverance. There have been doubts at times as to whether it should be admitted to the canon of scripture. But the book has a religious value as containing a most striking illustration of God’s overruling providence in history'
  - where: 'section “The books of this period”'
    claim: 'Haggai urged rebuilding the temple'
    key: bd-haggai
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haggai?lang=eng'
    quote: 'an exhortation to the people to be more zealous about the public worship of God and the rebuilding of His temple.'
  - where: 'section “The books of this period”'
    claim: 'Haggai and Zechariah exhorted the people, who resumed the task'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'the people, exhorted by the prophets Haggai and Zechariah, resumed their task'
  - where: 'section “The books of this period”'
    claim: 'Malachi’s timing uncertain'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'The exact timing of Malachi’s ministry is uncertain'
  - where: 'section “The books of this period”'
    claim: 'Mal. 3 and 4 quoted to the Nephites'
    key: bd-malachi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/malachi?lang=eng'
    quote: 'All of Mal. 3 and 4 was quoted by the Savior to the Nephites, as recorded in 3 Ne. 24 and 25.'
