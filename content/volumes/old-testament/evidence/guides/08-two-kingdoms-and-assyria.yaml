page: 08-two-kingdoms-and-assyria
claims:
  - where: "opening"
    claim: "The northern kingdom lasted over 200 years"
    key: bd-israel-kingdom
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/israel-kingdom-of?lang=eng"
    quote: "After a history of over 200 years and a series of 19 kings, the kingdom was"
  - where: "opening"
    claim: "Division dated about 925"
    key: bd-israel-kingdom
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/israel-kingdom-of?lang=eng"
    quote: "The division of the house of Israel into two kingdoms at approximately 925 B.C. had been prophesied by Ahijah"
  - where: "opening"
    claim: "The date of Samaria’s fall is thought to be 721 but may have been 722"
    key: ot-manual-12
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-12?lang=eng"
    quote: "The date is thought to be 721 B.C., but it may have been 722."
  - where: "opening"
    claim: "The house of David held the throne until the Exile"
    key: bd-judah-kingdom
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/judah-kingdom-of?lang=eng"
    quote: "until the Exile. It consequently managed to exist for 135 years after the downfall"
  - where: "opening"
    claim: "Judah paid Assyria tribute until Hezekiah rebelled around 705"
    key: scripture-helps-2-kings
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng"
    quote: "This arrangement continued through the reign of Hezekiah until around 705 BC, when Hezekiah rebelled against Assyria following the death of their king."
  - where: "opening"
    claim: "Sennacherib appeared in Palestine in 701"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "the new king, Sennacherib (705–681), had time to crush the rising in the east and then appeared in Palestine (701)."
  - where: "opening"
    claim: "Jerusalem was at length delivered"
    key: bd-hezekiah
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng"
    quote: "After a time of great anxiety the city was at length delivered, probably by a pestilence that broke out in the Assyrian camp."
  - where: "opening"
    claim: "Division dated 975 in the Bible Chronology table"
    key: bible-chron-ot
    url: "https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng"
    quote: "975 | Death of Solomon."
  - where: "opening"
    claim: "Division dated 931 (Rehoboam and Jeroboam I)"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Jeroboam I (931–909 B.C.)"
  - where: "section “The map”"
    claim: "Assyria and Egypt became great rival powers"
    key: bd-egypt
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng"
    quote: "Later on, Assyria and Egypt became great rival powers, and an alliance with Egypt against Assyria was for some time the policy of the kings of Judah."
  - where: "section “Rulers and events”"
    claim: "Rehoboam’s division: old rivalry and Solomon’s burdens"
    key: bd-rehoboam
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/rehoboam?lang=eng"
    quote: "Much discontent had also been caused by the rigor of Solomon’s government"
  - where: "section “Rulers and events”"
    claim: "Jeroboam of Ephraim was the first king of the north"
    key: bd-jeroboam
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng"
    quote: "the first king of divided kingdom of Israel; a member of the tribe of Ephraim"
  - where: "section “Rulers and events”"
    claim: "Jeroboam set up calves at Dan and Bethel"
    key: bd-jeroboam
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng"
    quote: "set up image worship in Dan and Bethel, the two calves being supposed to be images of Jehovah"
  - where: "section “Rulers and events”"
    claim: "Ahab 874–853, Jezebel, Elijah contest, killed in battle"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Ahab (874–853 B.C.). see 1 Kings 16:29–22:40. Son of Omri. Married the Zidonian princess Jezebel"
  - where: "section “Rulers and events”"
    claim: "Ahab’s reign: Elijah’s contest and Ahab killed"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "(During Ahab’s reign Elijah had the contest with the priests of Baal.)"
  - where: "section “Rulers and events”"
    claim: "Ahab killed in battle"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Was killed just as the battle was lost."
  - where: "section “Rulers and events”"
    claim: "Jehu 841–814, anointed by a messenger of Elisha, destroyed Ahab’s house"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Jehu (841–814 B.C.). see 2 Kings 9:1–10:36. Anointed king over Israel by a young prophet who acted under the direction of Elisha."
  - where: "section “Rulers and events”"
    claim: "Jehu destroyed the descendants of Ahab"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Destroyed the descendants of Ahab and the remnants of foreign idol worship."
  - where: "section “Rulers and events”"
    claim: "Jehu was himself a wicked man"
    key: ot-manual-6
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-6?lang=eng"
    quote: "but Jehu himself was a wicked man (see 2 Kings 10:31)"
  - where: "section “Rulers and events”"
    claim: "Shalmaneser III took tribute from Jehu in 842"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "in 842 he took tribute from Jehu, king of Israel"
  - where: "section “Rulers and events”"
    claim: "Jeroboam II 792–753"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Jeroboam II (792–753 B.C.). see 2 Kings 14:23–29."
  - where: "section “Rulers and events”"
    claim: "Jeroboam II dated 788–747 in another count"
    key: ot-manual-10
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-10?lang=eng"
    quote: "Jeroboam II, the king of Israel, reigned from 788 B.C. until 747 B.C."
  - where: "section “Rulers and events”"
    claim: "Jeroboam II the ablest and most successful in war; Amos and Hosea in his reign"
    key: bd-jeroboam
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng"
    quote: "the ablest of the kings of Israel, and the most successful in war"
  - where: "section “Rulers and events”"
    claim: "Amos and Hosea prophesied in Jeroboam II’s reign"
    key: bd-jeroboam
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng"
    quote: "Amos and Hosea prophesied during his reign"
  - where: "section “Rulers and events”"
    claim: "Jonah lived under Jeroboam II"
    key: bd-jonah
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng"
    quote: "He lived under Jeroboam Ⅱ, whose success in restoring the ancient boundaries of Israel he predicted"
  - where: "section “Rulers and events”"
    claim: "Uzziah made king 792, 52 years, 24 jointly"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "was made king in Judah. He ruled twenty-four years jointly with his father, fifty-two years total."
  - where: "section “Rulers and events”"
    claim: "Uzziah’s strength, fortified Jerusalem"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "Judah was established as a strong military power. Jerusalem was well fortified and the army well equipped."
  - where: "section “Rulers and events”"
    claim: "Uzziah’s leprosy, c. 750"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "Uzziah, lifted up in pride, assumed the right to officiate in the temple. His unauthorized acts brought the judgment of God against him: leprosy."
  - where: "section “Rulers and events”"
    claim: "Jotham 740–732"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Jotham (740–732 B.C.). see 2 Kings 15:32–38; 2 Chronicles 27."
  - where: "section “Rulers and events”"
    claim: "Jotham enlarged the temple gate and strengthened fortifications"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "Jotham enlarged the temple gate and strengthened the fortifications of the nation of Judah."
  - where: "section “Rulers and events”"
    claim: "Tiglath-pileser III 745–727; tribute from Damascus and Samaria in 738; Damascus fell in 734"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "In 738 he took tribute from Damascus and Samaria (2 Kgs. 15:19); in 734 these powers revolted and the result of a fresh war was the destruction of Damascus"
  - where: "section “Rulers and events”"
    claim: "Tiglath-pileser carried away the trans-Jordan tribes and Galilee in 740"
    key: bd-captivities
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng"
    quote: "In 740 B.C. Tiglath-pileser carried away the trans-Jordanic tribes and the inhabitants of Galilee"
  - where: "section “Rulers and events”"
    claim: "Damascus conquered about 733"
    key: bd-damascus
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/damascus?lang=eng"
    quote: "It was conquered by Tiglath-pileser and its inhabitants carried captive about 733 B.C."
  - where: "section “Rulers and events”"
    claim: "Pekah and Rezin attacked Judah in 735"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "The coalition of Pekah, king of Israel, and Rezin, king of Syria, began an attempt to subjugate Judah during this era."
  - where: "section “Rulers and events”"
    claim: "Isaiah counseled trust in the Lord; Ahaz sought Assyria"
    key: scripture-helps-2-kings
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng"
    quote: "Isaiah encouraged Ahaz and the people of Judah to rely on the Lord for deliverance from the armies of Pekah and Rezin."
  - where: "section “Rulers and events”"
    claim: "Ahaz paid tribute from temple and throne"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "Ahaz offered tribute from the treasures of the temple and the throne."
  - where: "section “Rulers and events”"
    claim: "Ahaz 732–715"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Ahaz (732–715 B.C.). see 2 Kings 16; 2 Chronicles 28."
  - where: "section “Rulers and events”"
    claim: "Hoshea rebelled and sent to Egypt (Shalmaneser V from 727)"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "When Shalmaneser V became king of Assyria in 727 B.C., Hoshea used the change of rulers to break the tribute agreement, and he conspired to obtain assistance from Egypt."
  - where: "section “Rulers and events”"
    claim: "Shalmaneser began the siege; Sargon (722–705) concluded it"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "The siege of Samaria, begun by Shalmaneser (2 Kgs. 17:3–6), was concluded by Sargon (722–705)"
  - where: "section “Rulers and events”"
    claim: "The siege lasted three years"
    key: gs-samaria
    url: "https://www.churchofjesuschrist.org/study/scriptures/gs/samaria?lang=eng"
    quote: "the Assyrians could not capture it until after a siege of three years (2 Kgs. 17:5–6)"
  - where: "section “Rulers and events”"
    claim: "The king of Assyria took Samaria and carried Israel away"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng"
    quote: "the king of Assyria took Samaria, and carried Israel away into Assyria"
  - where: "section “Rulers and events”"
    claim: "Settlers brought from Babylon into Samaria"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng"
    quote: "the king of Assyria brought men from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed them in the cities of Samaria"
  - where: "section “Rulers and events”"
    claim: "Hezekiah purged idolatry and destroyed the brazen serpent (715)"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "He attempted to purge the land of the idolatry of his father. Even the brazen serpent from the days of Moses"
  - where: "section “Rulers and events”"
    claim: "Hezekiah reconstituted the temple services with Isaiah’s help"
    key: bd-hezekiah
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng"
    quote: "He suppressed idolatry and reconstituted the temple services. In his reforms both in church and state he had the assistance of the great prophet Isaiah."
  - where: "section “Rulers and events”"
    claim: "Philistine rising in 711 (Isa. 20)"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "There was again a rising of the Philistines in 711 (Isa. 20)"
  - where: "section “Rulers and events”"
    claim: "Merodach-baladan a Babylonian prince who had rebelled, sent messengers to Hezekiah"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "Merodach-baladan (a Babylonian prince called Marduk-apal-iddina in his own land), who had earlier rebelled against Assyrian domination, sent messengers of good will with gifts for the king of Judah."
  - where: "section “Rulers and events”"
    claim: "Merodach-baladan sought alliances on Sargon's death (705)"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "On Sargon’s death a fresh revolt broke out through all the empire, and Merodach-baladan of Babylon sought alliances even in Judea (2 Kgs. 20)."
  - where: "section “Rulers and events”"
    claim: "The embassy is listed in the chart's 701–686 block, after Hezekiah's illness"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "701–686 B.C. | | 2 Chronicles 32:25–26 | Hezekiah continued to struggle with his pride"
  - where: "section “Rulers and events”"
    claim: "Depopulation of Gilead and Naphtali tied to the war after the revolt of 734"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "in 734 these powers revolted and the result of a fresh war was the destruction of Damascus, the depopulation of Gilead and Naphtali (2 Kgs. 15:29)"
  - where: "section “The map”"
    claim: "There was no independent state between Assyria and Egypt after 734"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "There was now no independent state between Assyria and Egypt"
  - where: "section “The nations”"
    claim: "Edomites smote Judah (2 Chr. 28:17)"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/28?lang=eng"
    quote: "For again the Edomites had come and smitten Judah, and carried away captives."
  - where: "section “The books of this period”"
    claim: "Micah prophesied in the days of Jotham, Ahaz and Hezekiah"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng"
    quote: "in the days of Jotham, Ahaz, and Hezekiah, kings of Judah"
  - where: "section “Rulers and events”"
    claim: "Hezekiah refused tribute in 705"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "Hezekiah refused to pay the heavy tribute that his father had begun, and he sought an Egyptian alliance."
  - where: "section “Rulers and events”"
    claim: "Sennacherib took 46 cities, headquartered at Lachish, siege of Jerusalem"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "The annals of this invader king record the capture of forty-six cities or forts and many villages."
  - where: "section “Rulers and events”"
    claim: "The Assyrians were headquartered at Lachish"
    key: ot-manual-f
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng"
    quote: "The Assyrians were headquartered in Lachish, twenty-five miles southwest of Jerusalem."
  - where: "section “Rulers and events”"
    claim: "Lachish captured by Sennacherib"
    key: bd-lachish
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/lachish?lang=eng"
    quote: "It was captured by Sennacherib (2 Kgs. 18:17; 2 Chr. 32:9)"
  - where: "section “Rulers and events”"
    claim: "Sennacherib’s army destroyed; slain by his sons"
    key: bd-sennacherib
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/sennacherib?lang=eng"
    quote: "his army was destroyed (2 Kgs. 19:35; 2 Chr. 32:21; Isa. 37:36); he was slain by his sons"
  - where: "section “Rulers and events”"
    claim: "Sennacherib returned to Nineveh; Esarhaddon conquered Egypt"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "he was obliged to return to Nineveh"
  - where: "section “Rulers and events”"
    claim: "Esarhaddon (681–668) invaded and conquered Egypt"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "Esarhaddon (681–668), who invaded and conquered Egypt"
  - where: "section “Rulers and events”"
    claim: "Manasseh joint king from 697, sole reign 686; Hezekiah 715–686"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Hezekiah (715–686 B.C.). see 2 Kings 18:1–20:21; 2 Chronicles 29:1–32:33."
  - where: "section “Rulers and events”"
    claim: "Manasseh ruled jointly with his father eleven years"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Ruled jointly with his father for eleven years because of his father’s illness"
  - where: "section “Rulers and events”"
    claim: "Hezekiah died a year after the deliverance"
    key: bd-hezekiah
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng"
    quote: "A year later Hezekiah died, after a reign of 29 years."
  - where: "section “The nations”"
    claim: "Assyria on the Tigris, centered at Nineveh"
    key: bd-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng"
    quote: "Assyria, or Asshur, occupied the Tigris valley to the north of Babylonia. Its center lay on the left bank of the Tigris, where the great city of Nineveh stood"
  - where: "section “The nations”"
    claim: "Assyria ruled by terror and deportation"
    key: gs-assyria
    url: "https://www.churchofjesuschrist.org/study/scriptures/gs/assyria?lang=eng"
    quote: "They ruled by terror, crushing their enemies by fire and sword or weakening them by deporting large portions of a population"
  - where: "section “The nations”"
    claim: "Damascus the Syrian city"
    key: bd-damascus
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/damascus?lang=eng"
    quote: "An ancient city of Syria, standing on a rich plain on the edge of the desert"
  - where: "section “The nations”"
    claim: "Ahab and Syria allied against Assyria"
    key: ot-manual-kings-a
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-a?lang=eng"
    quote: "Finally entered an alliance with Syria against the invading Assyrians."
  - where: "section “The nations”"
    claim: "Israel and Syria threatened to go to battle against Judah"
    key: scripture-helps-2-kings
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng"
    quote: "Israel and Syria threatened to go to battle against Judah"
  - where: "section “The nations”"
    claim: "Shishak took Jerusalem; alliance with Egypt Judah’s policy, Isaiah opposed"
    key: bd-egypt
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng"
    quote: "a few years afterwards conquered Rehoboam and took Jerusalem (1 Kgs. 14:25–26). Later on, Assyria and Egypt became great rival powers"
  - where: "section “The nations”"
    claim: "Isaiah opposed the Egyptian alliance"
    key: bd-egypt
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng"
    quote: "Isaiah opposed this alliance (Isa. 30:1–5)"
  - where: "section “The nations”"
    claim: "Cush south of Egypt, includes modern Nubia"
    key: bd-ethiopia
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng"
    quote: "It included the modern Nubia, with the states to the south"
  - where: "section “The nations”"
