    claim: 'The land is not as Egypt and drinks the rain of heaven (Deut. 11:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'But the land, whither ye go to possess it, is a land of hills and valleys, and drinketh water of the rain of heaven:'
  - where: 'section “The shape of the land”'
    claim: 'The land is not as the land of Egypt, watered with the foot (Deut. 11:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'For the land, whither thou goest in to possess it, is not as the land of Egypt, from whence ye came out, where thou sowedst thy seed, and wateredst it with thy foot, as a garden of herbs:'
  - where: 'section “The shape of the land”'
    claim: 'In some years parts of the land may be untouched by rain'
    key: ogden-1980-testing-ground
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/the-testing-ground-for-the-covenant-people?lang=eng'
    quote: 'which means that in some years parts of the land may be untouched by rain. Notice in the following description of the promised land given by the Lord how trust in God and obedience to him'
  - where: 'section “The shape of the land”'
    claim: 'Famine in the Bible simply means it did not rain that year; thus God proved his people through climate and rainfall'
    key: ogden-1980-testing-ground
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/the-testing-ground-for-the-covenant-people?lang=eng'
    quote: 'simply means it didn’t rain that year. Famine generally meant no rain. Thus God proved his people even through climate and rainfall.'
  - where: 'section “The shape of the land”'
    claim: '"Up" and "down" usually indicated elevation; Jerusalem is high'
    key: interpreter-halverson-geographically
    url: 'https://interpreterfoundation.org/journal/reading-the-scriptures-geographically-some-tools-and-insights'
    quote: 'In ancient Israel, the words “up” and “down” in geographical contexts usually indicated elevation. Jerusalem is located on one of the highest elevations in Judah. Therefore, travel toward Jerusalem typically involved ascending to a higher elevation.'
  - where: 'section “The roads”'
    claim: 'Israel asked Edom to go by the king’s high way (Num. 20:17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'we will go by the king’s high way, we will not turn to the right hand nor to the left, until we have passed thy borders.'
  - where: 'section “The roads”'
    claim: 'Bible Map 2 marks a possible route of the Exodus; no road is labeled by name on maps 1–10 (a search of their labels)'
    key: bible-maps-2
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-maps/map-2?lang=eng'
    quote: 'Possible route of the Exodus'
  - where: 'section “The roads”'
    claim: 'Galilee was crossed by important highways to Damascus, Egypt and eastern Palestine'
    key: bd-galilee
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
