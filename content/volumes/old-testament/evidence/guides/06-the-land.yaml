  - where: 'section “The neighbors”'
    claim: 'Philistines: coast from Joppa to the Egyptian desert; five cities; struggle for supremacy; name Palestine'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'occupied before the days of Abraham (Gen. 21:32) the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.” For many years there was a struggle for supremacy between them and the Israelites, Philistine power being at its'
  - where: 'section “The neighbors”'
    claim: 'Phoenicia: coast north of Philistia; language like Hebrew; never conquered by Israel; alliances'
    key: bd-phoenicia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phoenicia?lang=eng'
    quote: 'The coastland extending from the Philistine territory to the mouth of the Orontes. The Phoenicians were a Semitic race, their language closely resembling Hebrew. They were a great commercial people, distributing the wares of Egypt and Babylon, and having trading stations all over the Mediterranean, Carthage being the most important. Their territory was never conquered by the Israelites, but many'
  - where: 'section “The neighbors”'
    claim: 'Syria was Aram north and northeast; same stock as the Israelites; rivals'
    key: bd-syria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/syria?lang=eng'
    quote: 'Originally known as Aram (or “the highlands”), a general name for the country north and northeast of Palestine. The people were of Semitic origin (Gen. 10:22; 22:21) and were descended from the same stock as the'
  - where: 'section “The neighbors”'
