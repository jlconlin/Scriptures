    key: ogden-1980-testing-ground
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/the-testing-ground-for-the-covenant-people?lang=eng'
    quote: 'The story of this Holy Land is essentially a history of the struggle among these mightier civilizations to control this land bridge. The history of the ancient Near East is somewhat like a complicated chess game,'
  - where: 'section “The roads”'
