  - where: 'section “The neighbors”'
    claim: 'Philistines: coast from Joppa to the Egyptian desert; five cities; struggle for supremacy; name Palestine'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'occupied before the days of Abraham (Gen. 21:32) the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.” For many years there was a struggle for supremacy between them and the Israelites, Philistine power being at its'
  - where: 'section “The neighbors”'
    claim: 'Phoenicia: coast north of Philistia; language like Hebrew; never conquered by Israel; alliances'
    key: bd-phoenicia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phoenicia?lang=eng'
    quote: 'The coastland extending from the Philistine territory to the mouth of the Orontes. The Phoenicians were a Semitic race, their language closely resembling Hebrew. They were a great commercial people, distributing the wares of Egypt and Babylon, and having trading stations all over the Mediterranean, Carthage being the most important. Their territory was never conquered by the Israelites, but many'
  - where: 'section “The neighbors”'
    claim: 'Syria was Aram north and northeast; same stock as the Israelites; rivals'
    key: bd-syria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/syria?lang=eng'
    quote: 'Originally known as Aram (or “the highlands”), a general name for the country north and northeast of Palestine. The people were of Semitic origin (Gen. 10:22; 22:21) and were descended from the same stock as the'
  - where: 'section “The neighbors”'
    claim: 'Ammon: east of Gilead from the Jabbok; descended from Lot; bitter enemies'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'A tribe descended from Lot, the nephew of Abraham (Gen. 19:38; Deut. 2:19); worshippers of Molech or Milcom (1 Kgs. 11:7, 33); they were settled east of Mount Gilead, from the Jabbok southwards, and in the'
  - where: 'section “The neighbors”'
    claim: 'Ammon: bitter enemies of Israel'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'bitter enemies of Israel, till they fell under the power of Assyria and Chaldea (2 Kgs. 24:2; Ezek. 25:2–10; Amos'
  - where: 'section “The neighbors”'
    claim: 'Moab east of the Dead Sea; akin to Israelites; constant warfare'
    key: bd-moab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'The land of Moab lay east of the Dead Sea. The Moabites were akin to the Israelites and spoke a language that closely resembled Hebrew, but there was constant warfare between the two nations (Num. 22–25;'
  - where: 'section “The neighbors”'
    claim: 'Edom south of the Dead Sea in Mount Seir; kin through Esau; great mutual hatred'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'This country lay south of the Dead Sea, having Moab on the north and the Dead Sea on the northwest. It was not included within the limits of the land of Israel (Deut. 2:5; Josh. 24:4).'
  - where: 'section “The neighbors”'
    claim: 'Edom: kinship and great mutual hatred'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'In spite of the kinship there seems to have been great mutual hatred, and wars were of constant occurrence (Num. 20:14–21; 21:4; Judg. 11:17; 1 Sam. 14:47; 2 Sam. 8:13–14;'
  - where: 'section “The neighbors”'
    claim: 'Nineveh on the Tigris'
    key: bd-nineveh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nineveh?lang=eng'
    quote: 'Capital of Assyria on the eastern bank of the Tigris, its traditional founder being Nimrod, the great hunter (Gen. 10:11–12). For several centuries Calah outstripped it in importance, but under Sennacherib it again became the capital'
  - where: 'section “The neighbors”'
    claim: 'Babylon on the Euphrates, Nebuchadnezzar’s capital'
    key: bd-babylon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/babylon?lang=eng'
    quote: 'the Euphrates ran through the middle of it. According to Herodotus the walls were 56 miles in circumference, 335 feet high, and 85 feet wide. A large part of the'
  - where: 'section “Zion and Moriah”'
    claim: 'The temple on the eastern hill; dispute over the position of Zion'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'All authorities agree in placing the temple on the eastern hill, but there has been much dispute as to the position of Zion. (See Zion.) David fortified the city, the chief feature in the fortifications being'
  - where: 'section “Zion and Moriah”'
    claim: 'Solomon built his temple on Mount Zion'
    key: bd-zion
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zion?lang=eng'
    quote: 'Solomon built his temple on Mount Zion (1 Kgs. 8:1; see also 2 Sam. 5:6–7); and Jackson County, Missouri, is called Zion in many of the revelations in the D&C,'
  - where: 'section “Zion and Moriah”'
    claim: 'Moriah: land of Isaac’s offering; Mount Moriah the temple hill; Josephus tradition'
    key: bd-moriah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moriah?lang=eng'
    quote: '(1) The land of, the district where was found the mountain on which Isaac was offered in sacrifice (Gen. 22:2); probably the same district as that in which was the “plain (or oak) of Moreh.”'
  - where: 'section “Zion and Moriah”'
    claim: 'Mount Moriah, tradition first recorded by Josephus'
    key: bd-moriah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moriah?lang=eng'
    quote: '(2) Mount Moriah, the hill on which Solomon built the temple (2 Chr. 3:1); a tradition first recorded by the Jewish historian Josephus, who regards this as identical with (1).'
  - where: 'section “Zion and Moriah”'
    claim: 'Bible Map 10 prints notes for the places in Canaan (Dan)'
    key: bible-maps-10
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-maps/map-10?lang=eng'
    quote: 'Dan (Laish) Jeroboam set up a golden calf for the Northern Kingdom to worship (1 Kgs. 12:26–33). Dan was the northern limit of ancient Israel.'
