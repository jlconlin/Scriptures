    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'The land of Moab lay east of the Dead Sea. The Moabites were akin to the Israelites and spoke a language that closely resembled Hebrew, but there was constant warfare between the two nations (Num. 22–25;'
  - where: 'section “The neighbors”'
    claim: 'Edom south of the Dead Sea in Mount Seir; kin through Esau; great mutual hatred'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'This country lay south of the Dead Sea, having Moab on the north and the Dead Sea on the northwest. It was not included within the limits of the land of Israel (Deut. 2:5; Josh. 24:4).'
