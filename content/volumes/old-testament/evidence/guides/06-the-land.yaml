  - where: 'opening'
    claim: 'Canaan is a land bridge among three continents, "crossroads of the East"'
    key: ogden-1980-testing-ground
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/the-testing-ground-for-the-covenant-people?lang=eng'
    quote: 'its position as a land bridge between three continents gives it the title “crossroads of the East.”'
  - where: 'section “The shape of the land”'
    claim: 'Dan is the northern limit of Palestine'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'This town is well known as the northern limit of Palestine, which extended “from Dan even to Beer-sheba.” It was chosen by Jeroboam as one of the places in which to establish the calf worship for'
  - where: 'section “The shape of the land”'
    claim: 'Beersheba was regarded as the southern limit of Israel'
    key: bd-beersheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beersheba?lang=eng'
    quote: 'regarded as the southern limit of Israel (Judg. 20:1; 1 Sam. 3:20). The district contained much rich pasture land.'
  - where: 'section “The shape of the land”'
    claim: '"From Dan even to Beer-sheba" in Judg. 20:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/20?lang=eng'
    quote: 'Then all the children of Israel went out, and the congregation was gathered together as one man, from Dan even to Beer-sheba, with the land of Gilead, unto the Lord in Mizpeh.'
  - where: 'section “The shape of the land”'
    claim: 'About 150 miles Dan to Beersheba; about 75 miles wide'
    key: ot-manual-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/joshua-1-24-the-entry-into-the-promised-land?lang=eng'
    quote: 'In dimension, Israel was roughly 150 miles from Dan to Beersheba, and at its greatest width it was about 75 miles across. The Lord promised Joshua that the original extent of the land promised to Abraham'
  - where: 'section “The shape of the land”'
    claim: 'The wider district between Syria and Egypt: nearly 180 miles by 85'
    key: bd-palestine
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/palestine?lang=eng'
    quote: 'a district nearly 180 miles long and about 85 miles in average breadth. Running from north to south is the deep Jordan valley, which at its lowest part near the Dead Sea, is 1290 feet below'
  - where: 'section “The shape of the land”'
    claim: 'Deut. 1:7 names five regions'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'in the plain, in the hills, and in the vale, and in the south, and by the sea side, to the land of the Canaanites, and unto Lebanon, unto the great river, the river Euphrates.'
  - where: 'section “The shape of the land”'
    claim: 'The Maritime Plain runs the length of the coast, including Philistia and Sharon; the Shephelah, then the hill country broken by Esdraelon'
    key: bd-palestine
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/palestine?lang=eng'
    quote: 'On either side of the valley is hill country, the western range being broken by the plain of Esdraelon. Proceeding further west we reach the Shephelah or Low Hills, and then the Maritime Plain, extending the whole length of the seacoast, and including the plains of Philistia and Sharon. Down in the south was the Negev, called in the KJV'
  - where: 'section “The shape of the land”'
    claim: 'Sharon is the plain from Carmel to Joppa'
    key: bd-sharon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sharon?lang=eng'
    quote: 'extending from Carmel to Joppa, celebrated for its beauty and its flowers (1 Chr. 5:16; 27:29; Song 2:1; Isa. 33:9; 35:2; 65:10; Acts 9:35).'
  - where: 'section “The shape of the land”'
    claim: 'The Shephelah lies between the coastal plain and the hills of Judah; more extensive agriculture'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Micah’s region, the Judean Shephelah, is situated between the coastal plain to the west and the hill country of Judah to the east and is composed of low hills and many valleys, allowing for more extensive'
  - where: 'section “The shape of the land”'
    claim: 'Esdraelon separates the hills of Samaria from Galilee and is the most fertile part of Palestine'
    key: bd-esdraelon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esdraelon?lang=eng'
    quote: 'it separates the hills of Samaria from those of Galilee and is the most fertile part of Palestine. It was crossed by several important highways and for that reason often provided a battleground (Judg. 4; 5;'
  - where: 'section “The shape of the land”'
    claim: 'Galilee about 60 miles by 30, some of the best land'
    key: bd-galilee
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'The district is about 60 miles by 30. It contained some of the best land and the busiest towns of Palestine and was thickly populated by a hardy, warlike race. It was crossed by important highways'
  - where: 'section “The shape of the land”'
    claim: 'The Negev is "dry or parched land," also called "south country"'
    key: bd-negev
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/negev?lang=eng'
    quote: 'Dry or parched land, also called “south country”; the district stretching southward from the hills of Judah toward the desert.'
  - where: 'section “The shape of the land”'
    claim: 'The Jordan is formed by springs on Hermon and descends to the Sea of Galilee and the Dead Sea'
    key: bd-jordan-river
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jordan-river?lang=eng'
    quote: 'formed by the union of several springs rising in Mount Hermon. It passes through the Huleh Valley (the waters of Merom), then descends to the Sea of Galilee, 682 feet below the level of the Mediterranean.'
  - where: 'section “The shape of the land”'
    claim: 'The Dead Sea lies 1290 feet below the Mediterranean with no outlet'
    key: bd-dead-sea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dead-sea?lang=eng'
    quote: 'Located at the southern end of the Jordan valley, 53 miles long, with an average breadth of 9 miles, its surface being 1290 feet below the Mediterranean, and its greatest depth 1300 feet. It is fed'
  - where: 'section “The shape of the land”'
    claim: 'Bible Map 14 prints the Judean hill country at 2,000–3,000 ft'
    key: bible-maps-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-maps/map-14?lang=eng'
    quote: '2,000–3,000 ft'
  - where: 'section “The shape of the land”'
    claim: 'Bashan is rich in grain production, east of Jordan'
    key: bd-bashan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bashan?lang=eng'
    quote: 'rich in grain production and known for its breed of cattle (Ps. 22:12), to which Amos made a symbolic and uncomplimentary reference (Amos 4:1–3).'
  - where: 'section “The shape of the land”'
    claim: 'Gilead is a wooded highland east of the Jordan'
    key: bd-gilead
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilead?lang=eng'
    quote: 'It is well wooded and crossed by deep glens that descend toward Jordan. It was assigned half to the tribe of Gad and half to Manasseh.'
  - where: 'section “The shape of the land”'
    claim: 'Mount Seir runs south from the Dead Sea through Edom'
    key: bd-seir
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/seir?lang=eng'
    quote: 'the mountain ridge that ran south from the Dead Sea through the land of Edom; originally inhabited by Horites (Gen. 14:6); Esau’s possession (Gen. 36:8–9, 30; Deut. 2:5; Josh. 24:4); passed through by Jacob (Gen. 32:3;'
  - where: 'section “The shape of the land”'
    claim: 'Lebanon is in the far north'
    key: bd-lebanon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lebanon?lang=eng'
    quote: 'in the extreme north of Palestine, rising to a height of eight or nine thousand feet. It is still a land of forests, though the groves of cedar trees have almost disappeared. Running parallel is the'
  - where: 'section “The shape of the land”'
    claim: 'Hermon is 9400 feet high'
    key: bd-hermon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hermon?lang=eng'
    quote: 'A mountain, 9400 feet high, in the extreme northeast of the Holy Land, being the southern point of a range of hills called Anti-Libanus. It is visible not only from a great part of Galilee, but'
  - where: 'section “The shape of the land”'
    claim: 'Bible Map 1 labels the Valley of Jezreel (Esdraelon), the Wilderness of Judea and the other regions'
    key: bible-maps-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-maps/map-1?lang=eng'
    quote: 'Valley of Jezreel (Esdraelon)'
