  - where: 'section “The neighbors”'
    claim: 'Ammon: bitter enemies of Israel'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'bitter enemies of Israel, till they fell under the power of Assyria and Chaldea (2 Kgs. 24:2; Ezek. 25:2–10; Amos'
