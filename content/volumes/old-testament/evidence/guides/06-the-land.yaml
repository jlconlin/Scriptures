    claim: 'Egypt: store cities under Ramses II built by Israelite slaves'
    key: bd-egypt
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng'
    quote: 'Under Ramses Ⅱ, a king of the 19th dynasty, were built the two store cities, Pithom and Pa-Ramses, in the construction of which the Israelite slaves were employed. Pithom has been discovered and identified. The store'
  - where: 'section “The neighbors”'
    claim: 'Egypt: Shishak conquered Rehoboam and took Jerusalem; alliance against Assyria'
    key: bd-egypt
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng'
