    quote: 'Matthew applies this prophecy to Jesus and to His Galilean homeland: Matthew 4:13-14 states, “And leaving Nazareth, he came and dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim:'
  - where: 'section “The neighbors”'
