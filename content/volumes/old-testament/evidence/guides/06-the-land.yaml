    claim: 'Esdraelon was crossed by several important highways and often a battleground'
    key: bd-esdraelon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esdraelon?lang=eng'
    quote: 'It was crossed by several important highways and for that reason often provided a battleground (Judg. 4; 5; 7; 1 Sam. 31; 2 Chr. 35:20–27; see also Rev. 16:16). See also Armageddon; Megiddo.'
  - where: 'section “The roads”'
    claim: 'Megiddo is on the caravan route from Egypt to Damascus; Josiah died there'
    key: bd-megiddo
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/megiddo?lang=eng'
    quote: 'and on the caravan route from Egypt to Damascus. Frequently mentioned in Israelite history. The scene of Sisera’s defeat (Judg. 5:19). Fortified by Solomon (1 Kgs. 9:15). The place where Ahaziah died of his wounds (2'
  - where: 'section “The roads”'
    claim: 'The Shephelah held roads by which Judah reached the coastal highway'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'The importance of the Shephelah lay not only in its agricultural capabilities but also in the roads that allowed Judah to access the coastal plain and take part in the international commerce that traveled the coastal'
