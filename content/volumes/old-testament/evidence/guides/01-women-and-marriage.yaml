page: 01-women-and-marriage
claims:
  - where: 'opening'
    claim: 'The Old Testament shows women of faith and also the hardships women faced; customs that seem unjust were shaped by the cultural norms of the time'
    key: scripture-helps-women
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/51-women-in-the-old-testament?lang=eng'
    quote: 'where they often experienced oppression, abuse, and other forms of mistreatment. Customs and practices that seem unjust or troubling in most modern societies were shaped by the cultural norms of the time.'
  - where: 'opening'
    claim: 'Ancient Israel was mostly male dominated; women played roles in the household and did not usually hold religious or political leadership, likely why men are mentioned more often'
    key: scripture-helps-women
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/51-women-in-the-old-testament?lang=eng'
    quote: 'ancient Israel was mostly male dominated. While women played essential roles within the household'
  - where: 'opening'
    claim: 'Ancient Israel was mostly male dominated; women played roles in the household and did not usually hold religious or political leadership, likely why men are mentioned more often'
    key: scripture-helps-women
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/51-women-in-the-old-testament?lang=eng'
    quote: 'they did not usually occupy positions of religious or political leadership.This is likely a major reason why men are mentioned more frequently in the Old Testament.'
  - where: 'opening'
    claim: 'A woman’s status was typically tied to her role as wife and mother, so unmarried or widowed women often faced poverty'
    key: scripture-helps-women
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/51-women-in-the-old-testament?lang=eng'
    quote: 'a woman’s social and legal status was typically tied to her role within a family as a wife and mother. That meant unmarried or widowed women often faced poverty'
  - where: 'section “The household and how a marriage was made”'
    claim: 'The household (bet ab) included the husband’s brothers and their families, sisters, servants'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'his brothers and their wives and children; his unmarried, divorced, or widowed sisters; one or more adopted children; household servants and slaves'
  - where: 'section “The household and how a marriage was made”'
    claim: 'The details are for the First Temple period'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'Cultural and archaeological evidences show that during the First Temple period'
  - where: 'section “The household and how a marriage was made”'
    claim: 'A new bride’s greatest challenge was finding her place in the household hierarchy'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'Her greatest challenge as a new wife was to find her place within this household hierarchy.'
  - where: 'section “The household and how a marriage was made”'
    claim: 'Barrenness was considered the greatest curse upon a woman'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'was considered the greatest curse upon a woman'
  - where: 'section “The household and how a marriage was made”'
    claim: 'Betrothal was a formal act regarded as absolutely binding'
    key: bd-marriage
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/marriage?lang=eng'
    quote: 'marriage was usually preceded by a formal act of betrothal, such a contract, when once entered on, being regarded as absolutely binding'
  - where: 'section “The household and how a marriage was made”'
    claim: 'On the wedding day the bride was escorted to her husband’s home in a procession'
    key: bd-marriage
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/marriage?lang=eng'
    quote: 'On the marriage day, the bride was escorted to her husband’s home by a procession'
  - where: 'section “The household and how a marriage was made”'
    claim: 'A marriage deed was signed'
    key: bd-marriage
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/marriage?lang=eng'
    quote: 'a marriage deed was signed'
  - where: 'section “The household and how a marriage was made”'
    claim: 'The betrothal contract could name the mohar, the bride-price the groom paid the bride’s family'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'the amount of the mohar, or bride-price, which the groom would pay'
  - where: 'section “The household and how a marriage was made”'
    claim: 'The contract could name a dowry returned to the bride on divorce'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'which would be returned to the bride in the case of divorcement'
  - where: 'section “The household and how a marriage was made”'
    claim: 'The contract could say whether the groom could take another wife'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'whether the groom could take another wife'
  - where: 'section “The household and how a marriage was made”'
    claim: 'Betrothal generally lasted a year or more'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'The betrothal generally lasted a year or more'
  - where: 'section “The household and how a marriage was made”'
    claim: 'Saul names a hundred Philistine foreskins in place of a dowry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: 'The king desireth not any dowry, but an hundred foreskins of the Philistines'
  - where: 'section “The household and how a marriage was made”'
    claim: 'The dowry was compensation for leaving the family property and part of establishing a new household'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'The dowry was compensation for a daughter’s separation from the family property and was a critical part of establishing a new household'
  - where: 'section “The household and how a marriage was made”'
    claim: 'The dowry was her security if widowed or divorced'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'her security should she become widowed or divorced'
  - where: 'section “The household and how a marriage was made”'
    claim: 'A newly married man was free at home for a year to cheer his wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'he shall be free at home one year, and shall cheer up his wife'
  - where: 'section “More than one wife”'
    claim: 'Ancient Near Eastern societies were accepting of polygamy'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'the societies in that setting were very accepting of polygamy'
  - where: 'section “More than one wife”'
    claim: 'Kings took several wives for personal satisfaction or alliances'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'kings took multiple wives, either for personal satisfaction or political alliances'
  - where: 'section “More than one wife”'
    claim: 'Among others a common reason was a first wife who did not conceive'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Among nonroyals, a common reason for taking a second wife was to allow a man to have children in the event that his first wife did not conceive.'
  - where: 'section “More than one wife”'
    claim: 'Slave women often became second wives'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Slave women are often described as becoming second wives to the male head of household.'
  - where: 'section “More than one wife”'
    claim: 'Second marriages were regulated by law as first ones were'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Second marriages did not operate on an “anything goes” principle but were regulated by laws just as first marriages were.'
  - where: 'section “More than one wife”'
    claim: 'Concubines were wives of lesser legal status whose children might have lesser status'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'concubines were wives who had lesser legal status and whose children might have lesser legal status'
  - where: 'section “More than one wife”'
    claim: 'Genesis 16:3 calls Hagar Abraham’s wife, not concubine'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Genesis 16:3 calls Hagar Abraham’s “wife” (Hebrew ’iššâ), not his “concubine”'
  - where: 'section “More than one wife”'
    claim: 'Abraham gives gifts to the concubines’ children, not an explicit part of the inheritance'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Abraham gives gifts to the children of his “concubines” (pîlagšîm), but not an explicit part of the inheritance.'
  - where: 'section “More than one wife”'
    claim: 'Jacob’s wives are almost always called wives and his children inherit equally; Bilhah is labeled concubine at Gen. 35:22'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Rachel, Leah, Bilhah, and Zilpah are almost always described as Jacob’s “wives,” and all of Jacob’s children seem to inherit more or less equally'
  - where: 'section “More than one wife”'
    claim: 'Israel practiced plural marriage for the same reasons and in the same ways as its neighbors'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'the Israelites of the Old Testament practiced polygamy for largely the same reasons and in largely the same ways as other peoples of the ancient Near East.'
  - where: 'section “More than one wife”'
    claim: 'The law’s regulations almost always followed common cultural precedents'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Even the regulations of polygamy found in the law of Moses almost always followed common cultural precedents.'
  - where: 'section “More than one wife”'
    claim: 'By the monarchy monogamy seems to have been most common outside the royal household'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'by the time of the monarchy, monogamy seems to have been the most common practice outside the royal household'
  - where: 'section “More than one wife”'
    claim: 'The betrothal contract could restrict the husband from taking another wife'
    key: bybee-womans-world
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/bybee/2019-08-05/05_ariel_e._bybee_a_womans_world_in_lehis_jerusalem_131-148.pdf'
    quote: 'the contract of betrothal could — and often did — restrict the husband from taking another wife'
  - where: 'section “Levirate marriage”'
    claim: 'Levirate marriage defined'
    key: bd-levirate-marriage
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levirate-marriage?lang=eng'
    quote: 'The custom of a widow marrying her deceased husband’s brother or sometimes a near heir.'
  - where: 'section “Levirate marriage”'
    claim: 'The name is from Latin levir, husband’s brother'
    key: bd-levirate-marriage
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levirate-marriage?lang=eng'
    quote: 'the Latin levir, meaning “husband’s brother,”'
  - where: 'section “Levirate marriage”'
    claim: 'The law: the husband’s brother takes the widow to wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/25?lang=eng'
    quote: 'her husband’s brother shall go in unto her, and take her to him to wife'
  - where: 'section “Levirate marriage”'
    claim: 'The firstborn legally became the heir of the deceased brother'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The firstborn child of the levirate marriage legally became the heir of the deceased brother.'
  - where: 'section “Levirate marriage”'
    claim: 'The levirate marriage ensured the dead man’s name not be put out of Israel'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The levirate marriage ensured that the deceased man’s name “be not put out of Israel”'
  - where: 'section “Levirate marriage”'
    claim: 'The law secured the widow and the continuation of the dead man’s line and property'
    key: baird-jacob-levirate
    url: 'https://interpreterfoundation.org/journal/understanding-jacobs-teachings-about-plural-marriage-from-a-law-of-moses-context'
    quote: 'The law provides security for both the widow and the continuation of the family line and property rights of the dead man.'
  - where: 'section “Levirate marriage”'
    claim: 'If the brother refused, the widow came before the elders, loosed his shoe and spat in his face'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/25?lang=eng'
    quote: 'Then shall his brother’s wife come unto him in the presence of the elders, and loose his shoe from off his foot, and spit in his face'
  - where: 'section “Levirate marriage”'
    claim: 'If the brother refused, the widow was free to marry outside the family'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'If the living brother refused the levirate marriage, then the widow was free to marry outside the family.'
  - where: 'section “Levirate marriage”'
    claim: 'Tamar returned to her father’s household bereft of husband and offspring'
    key: spackman-judah-tamar
    url: 'https://rsc.byu.edu/vol-11-no-1-2010/story-judah-tamar'
    quote: 'Tamar returns to her father’s household as a widow, bereft of both husband and offspring.'
  - where: 'section “Levirate marriage”'
    claim: 'Her husband’s property reverted to Judah and his other sons'
    key: spackman-judah-tamar
    url: 'https://rsc.byu.edu/vol-11-no-1-2010/story-judah-tamar'
    quote: 'her husband’s property did belong not to her but reverted to Judah and his other sons'
  - where: 'section “Levirate marriage”'
    claim: 'Boaz redeems Naomi’s land and enters a levirate marriage with Ruth'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'redeeming Naomi’s land and entering into a levirate marriage with Ruth'
  - where: 'section “Levirate marriage”'
    claim: 'Neither was technically required of Boaz'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'Technically, neither of these actions were required of Boaz by law.'
  - where: 'section “Levirate marriage”'
    claim: 'Ruth uniquely associates the kinsman redeemer with the levirate law'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The book of Ruth uniquely associates the kinsman redeemer with the levirate law of marriage.'
  - where: 'section “Levirate marriage”'
    claim: 'A nearer kinsman had the first right and declined, and Ruth became Boaz’s wife'
    key: bd-ruth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ruth?lang=eng'
    quote: 'if a nearer kinsman, to whom the right belonged according to the law in Deut. 25:5–10, declined. He did decline, and so Ruth became the wife of Boaz.'
  - where: 'section “Divorce”'
    claim: 'A husband who found some uncleanness could write a bill of divorcement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'because he hath found some uncleanness in her: then let him write her a bill of divorcement'
  - where: 'section “Divorce”'
    claim: 'The bill let a divorced woman remarry; the first husband could not take her back'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'The purpose of a “bill of divorcement” (v. 3) was that a woman divorced by her husband could remarry if she desired. The restriction here is that one who has divorced his wife may not later change his mind and remarry her.'
  - where: 'section “Divorce”'
    claim: 'The rule would check frivolous divorces'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'would necessarily put a check upon frivolous divorces'
  - where: 'section “Divorce”'
    claim: 'Divorce was permitted because of the hardness of hearts but from the beginning it was not so'
    key: bd-divorce
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/divorce?lang=eng'
    quote: 'Permitted under some circumstances because of the hardness of the people’s hearts, but as explained by Jesus, “from the beginning it was not so”'
  - where: 'section “Divorce”'
    claim: 'The scriptures counsel against divorce generally'
    key: gs-divorce
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/divorce?lang=eng'
    quote: 'The scriptures counsel against divorce generally'
  - where: 'section “What the law provided for women”'
    claim: 'The law of Moses included guidelines to protect and support vulnerable women, including inheritance for daughters and care of widows'
    key: scripture-helps-women
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/51-women-in-the-old-testament?lang=eng'
    quote: 'the law of Moses included guidelines to protect and support women, especially those who were most vulnerable. These included laws related to inheritances for daughters and the care of widows.'
  - where: 'section “What the law provided for women”'
    claim: 'Leviticus names the mother first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Ye shall fear every man his mother, and his father, and keep my sabbaths'
  - where: 'section “What the law provided for women”'
    claim: 'Church’s edition gives “marital rights” for “duty of marriage”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: '10a “duty of marriage”: OR marital rights.'
  - where: 'section “What the law provided for women”'
    claim: 'One reading: Ex. 21:7–11 guaranteed her rights in contrast with peoples whose women were property'
    key: ot-manual-ex-21-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/exodus-21-24-31-35-the-mosaic-law-a-preparatory-gospel?lang=eng'
    quote: 'This legal guarantee was in sharp contrast to the practice of most other people whose women were viewed as property to be bargained away at the whim of men.'
  - where: 'section “What the law provided for women”'
    claim: 'The same protection for an existing wife is in Lipit-Eshtar and Hammurabi'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'This kind of protection for an existing wife finds parallels in law codes from Sumer (Laws of Lipit-Eshtar §28) and Babylon (Code of Hammurabi §148).'
  - where: 'section “What the law provided for women”'
    claim: 'The law forbids marrying a woman and her daughter, or two sisters'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Leviticus 18:17, prohibits marrying a woman and her daughter, followed immediately by a prohibition against marrying two sisters in Leviticus 18:18.'
  - where: 'section “What the law provided for women”'
    claim: 'A king should not take so many wives that it becomes excessive'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Deuteronomy 17:17 mandates that a king should not take so many plural wives that it becomes excessive'
  - where: 'section “What the law provided for women”'
    claim: 'Deut. 21:15–17 protects the inheritance of a less-loved wife’s children'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Deuteronomy 21:15–17 protects the inheritance of the children born to a plural wife in the circumstance that the husband does not like her as much as his other wife.'
  - where: 'section “What the law provided for women”'
    claim: 'The firstborn of the hated wife keeps his place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'he may not make the son of the beloved firstborn before the son of the hated, which is indeed the firstborn'
  - where: 'section “What the law provided for women”'
    claim: 'A man may desire a beautiful woman among the captives as wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'And seest among the captives a beautiful woman, and hast a desire unto her, that thou wouldest have her to thy wife'
  - where: 'section “What the law provided for women”'
    claim: 'A captive wife he does not delight in must be let go and not sold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'thou shalt let her go whither she will; but thou shalt not sell her at all for money, thou shalt not make merchandise of her, because thou hast humbled her.'
  - where: 'section “What the law provided for women”'
    claim: 'A captive woman could be married but not treated as a slave or captive'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'any woman taken prisoner could be married, but could not be treated as a slave or as a captive (Deut. 21:10–14)'
  - where: 'section “What the law provided for women”'
    claim: 'In the betrothed-in-the-city case both are stoned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/22?lang=eng'
    quote: 'Then ye shall bring them both out unto the gate of that city, and ye shall stone them with stones that they die'
  - where: 'section “What the law provided for women”'
    claim: 'The man who seizes an unbetrothed virgin pays fifty shekels, she becomes his wife, and he may not put her away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/22?lang=eng'
    quote: 'the man that lay with her shall give unto the damsel’s father fifty shekels of silver, and she shall be his wife; because he hath humbled her, he may not put her away all his days.'
  - where: 'section “What the law provided for women”'
    claim: 'One reading distinguishes the cases: consenting in the city, forcible rape in the field'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'the girl, because she had not cried in the city, i.e. had not called for help, and consequently was to be regarded as consenting to the deed'
