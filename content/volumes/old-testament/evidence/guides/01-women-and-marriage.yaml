    claim: 'Abigail can be seen as a type of Jesus Christ'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'Abigail can be seen as a powerful type or symbol of Jesus Christ.'
  - where: 'section “The women, and what the text says of them”'
    claim: 'The priest and officers went to Huldah the prophetess'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'went unto Huldah the prophetess'
  - where: 'section “The women, and what the text says of them”'
    claim: 'Huldah answers Thus saith the Lord God of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'Thus saith the Lord God of Israel'
  - where: 'section “The women, and what the text says of them”'
    claim: 'It is unknown why they went to Huldah, but it shows her spiritual stature'
    key: scripture-helps-2-kings-16-25
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/27-2-kings-16-25?lang=eng'
    quote: 'It is unknown why King Josiah’s servants went to Huldah to inquire of the Lord rather than to other prophets who were in Jerusalem at the time. But the fact that they went to her demonstrates her spiritual stature among the people.'
  - where: 'section “The women, and what the text says of them”'
    claim: 'After Vashti was removed Esther was chosen queen; she risked her life to go before the king unsummoned and saved her people'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'After the Persian King Ahasuerus removed his first wife, Vashti, from the throne, he chose Esther as queen.'
  - where: 'section “The women, and what the text says of them”'
    claim: 'Esther risked her life to go before the king unsummoned; her intervention saved her people'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther risked her life to go before the king unsummoned and expose Haman’s plot. Esther’s intervention saved her people.'
  - where: 'section “The women, and what the text says of them”'
    claim: 'Esther says if I perish, I perish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'and so will I go in unto the king, which is not according to the law: and if I perish, I perish.'
  - where: 'section “The hard passages”'
    claim: 'Some accounts show the harsh and painful realities of a fallen world'
    key: scripture-helps-women
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/51-women-in-the-old-testament?lang=eng'
    quote: 'while others show the harsh and painful realities of living in a fallen world'
  - where: 'section “The hard passages”'
