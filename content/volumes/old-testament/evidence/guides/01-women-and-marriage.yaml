    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/51-women-in-the-old-testament?lang=eng'
    quote: 'She became a mother within the royal lineage of David and Jesus Christ.'
  - where: 'section “The women, and what the text says of them”'
    claim: 'Hannah’s song has the first reference to the title Messiah'
    key: bd-hannah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hannah?lang=eng'
    quote: 'It contains the first reference to the title Messiah (“his Anointed”) (1 Sam. 2:10).'
  - where: 'section “The women, and what the text says of them”'
    claim: 'Abigail was a woman of good understanding; her husband Nabal churlish and evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/25?lang=eng'
    quote: 'she was a woman of good understanding, and of a beautiful countenance: but the man was churlish and evil in his doings'
