    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/50-gods-everlasting-covenant?lang=eng'
    quote: 'After the Fall, God made covenants with Adam and Eve that allowed them to be redeemed through Jesus Christ and have a lasting relationship with Him.'
  - where: 'section “The covenants, in order”'
    claim: 'After apostasy the Lord reestablished the everlasting covenant with Enoch, Noah, Abraham and Moses'
