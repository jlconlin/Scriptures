    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/50-gods-everlasting-covenant?lang=eng'
    quote: 'After periods of apostasy, the Lord reestablished His everlasting covenant with prophets like Enoch, Noah, Abraham, and Moses.'
