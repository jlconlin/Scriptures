page: 04-law-and-covenant
claims:
  - where: 'opening'
    claim: 'A covenant between God and man: God fixes the terms, man accepts'
    key: bd-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/covenant?lang=eng'
    quote: 'God in His good pleasure fixes the terms, which man accepts. The same word is sometimes rendered “testament.”'
  - where: 'opening'
    claim: 'God promises blessings for obedience'
    key: gs-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/covenant?lang=eng'
    quote: 'God then promises men certain blessings for their obedience.'
  - where: 'opening'
    claim: 'The Hebrew bĕrît: agreements with stipulations, emphasizing relationship and obligation'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'In the Hebrew Bible, the word for covenant—bĕrit—describes various types of agreements made between two parties in which one or both commit to fulfill stipulations of the agreement. The term emphasizes relationship, connection, and obligation between the two'
  - where: 'section “The covenants, in order”'
    claim: 'God made covenants with Adam and Eve after the Fall'
