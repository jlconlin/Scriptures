  - where: 'section “Clean and unclean”'
    claim: 'Clean and unclean covered food, birth, death, leprosy'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'It applied in the first place to food. Certain animals, birds, and fishes were regarded as clean and might be eaten, while others were unclean and were forbidden. See Lev. 11; Deut. 14:3–20. The flesh of any animal'
  - where: 'section “Clean and unclean”'
    claim: 'Uncleanness from birth, death, leprosy'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'For seven or fourteen days after the birth of a child the mother was unclean (Lev. 12). Uncleanness also resulted from the touch of a dead body (Lev. 11:8; 21:1–4, 11; 22:4–7; Deut. 21:22). The leper was unclean'
  - where: 'section “Clean and unclean”'
    claim: 'Uncleanness was ceremonial, not morally evil; the regulations (except blood, from Noah) belonged to the law of carnal commandments and are fulfilled by the Atonement'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil. These regulations (except the prohibition against blood, which was given as early as Noah’s day) were introduced in the law of carnal commandments (of performances and ordinances) of the law of Moses; being fulfilled by the Atonement of Jesus Christ, they are no longer required'
  - where: 'section “Clean and unclean”'
    claim: 'Lev. 11:45 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: 'For I am the Lord that bringeth you up out of the land of Egypt, to be your God: ye shall therefore be holy, for I am holy.'
  - where: 'section “Clean and unclean”'
    claim: 'Uncleanness cut a person off from the covenant people for a period'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'were cut off from the covenant people for a period of time (see Leviticus 11:24–40).'
  - where: 'section “Blessings, cursings, and the covenant renewed”'
    claim: 'Deuteronomy means repetition of the law; Moses’s last discourses; Deut. 27–30 a solemn renewal with blessings and curses'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The word means “repetition of the law.” The book contains the three last discourses of Moses delivered in the plains of Moab just before his death (translation). The first discourse is found in Deut. 1–4 and is introductory.'
  - where: 'section “Blessings, cursings, and the covenant renewed”'
    claim: 'Deut. 27–30 a solemn renewal of the covenant'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The third discourse (Deut. 27–30) contains a solemn renewal of the covenant and an announcement of the blessings of obedience and the curses upon disobedience. In Deut. 31–34 we have an account of the delivery of the law'
  - where: 'section “Blessings, cursings, and the covenant renewed”'
    claim: 'Deuteronomy shows a striking similarity to ancient Near Eastern treaty texts'
    key: belnap-law-moses
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/law-moses'
    quote: 'First, the deuteronomic text shows a striking similarity to ancient Near Eastern treaty texts. These texts defined the relationship between greater political entities, such as the Egyptian, Hittite, or Assyrian polities, and the lesser kingdoms that were their'
