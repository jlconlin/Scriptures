page: 04-law-and-covenant
claims:
  - where: 'opening'
    claim: 'A covenant between God and man: God fixes the terms, man accepts'
    key: bd-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/covenant?lang=eng'
    quote: 'God in His good pleasure fixes the terms, which man accepts. The same word is sometimes rendered “testament.”'
  - where: 'opening'
    claim: 'God promises blessings for obedience'
    key: gs-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/covenant?lang=eng'
    quote: 'God then promises men certain blessings for their obedience.'
  - where: 'opening'
    claim: 'Ex. 25:8: make a sanctuary that I may dwell among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'And let them make me a sanctuary; that I may dwell among them.'
  - where: 'opening'
    claim: 'The Lord has always commanded His people to build temples'
    key: gs-temple-house-of-the-lord
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/temple-house-of-the-lord?lang=eng'
    quote: 'The Lord has always commanded His people to build temples, holy buildings in which worthy Saints perform sacred ceremonies and ordinances of the gospel for themselves and for the dead.'
  - where: 'opening'
    claim: 'The tabernacle was a portable temple'
    key: gs-temple-house-of-the-lord
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/temple-house-of-the-lord?lang=eng'
    quote: 'The tabernacle erected by Moses and the children of Israel was a portable temple.'
  - where: 'section “The covenants, in order”'
    claim: 'God made covenants with Adam and Eve after the Fall'
    key: scripture-helps-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/50-gods-everlasting-covenant?lang=eng'
    quote: 'After the Fall, God made covenants with Adam and Eve that allowed them to be redeemed through Jesus Christ and have a lasting relationship with Him.'
  - where: 'section “The covenants, in order”'
    claim: 'After apostasy the Lord reestablished the everlasting covenant with Enoch, Noah, Abraham and Moses'
    key: scripture-helps-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/50-gods-everlasting-covenant?lang=eng'
    quote: 'After periods of apostasy, the Lord reestablished His everlasting covenant with prophets like Enoch, Noah, Abraham, and Moses.'
  - where: 'section “The covenants, in order”'
    claim: 'The covenant is new because reestablished, everlasting because eternal'
    key: scripture-helps-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/50-gods-everlasting-covenant?lang=eng'
    quote: 'It is described as new because it has been reestablished at various points in history and everlasting because it is eternal and unchanging.'
  - where: 'section “The covenants, in order”'
    claim: 'Circumcision was the token of the Abrahamic covenant'
    key: bd-circumcision
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/circumcision?lang=eng'
    quote: 'The token of the Abrahamic covenant during Old Testament dispensations. Those who received it thenceforth enjoyed the privileges and undertook the responsibilities of the covenant. It symbolized some aspects of separation or dedication (1) to God, to whom'
  - where: 'section “The covenants, in order”'
    claim: 'Promises to Abraham: Christ through his lineage; lands as an eternal inheritance'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'Included in the divine promises to Abraham were the assurances that (1) Christ would come through his lineage, and that (2) Abraham’s posterity would receive certain lands as an eternal inheritance (Gen. 17; 22:15–18; Gal. 3; Abr. 2).'
  - where: 'section “The covenants, in order”'
    claim: 'Gentiles are adopted into the house of Israel through the ordinances of the gospel'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'Those of non-Israelite lineage, commonly known as Gentiles, are adopted into the house of Israel and become heirs of the covenant and the seed of Abraham through the ordinances of the gospel (Gal. 3:26–29).'
  - where: 'section “The covenants, in order”'
    claim: 'The Mosaic law differed from earlier covenants because of Israel’s refusal at Sinai; a renewal of the covenant status from the beginning'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'Joseph Smith taught that the Mosaic law was a renewal of the covenant status that had existed between God and his people from the beginning. As taught by Paul and reinforced by Joseph Smith, the Mosaic law differed'
  - where: 'section “The covenants, in order”'
    claim: 'The Mosaic law differed from earlier covenants because of the refusal of Moses’s people'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'the Mosaic law differed from earlier covenants because of the refusal of Moses’s people—known as the “provocation” (Hebrews 3:8, Hebrews 3:15, Jacob 1:7, Alma 12:36)—to fully participate in the covenant-making experience that was designed to bring them into'
  - where: 'section “The covenants, in order”'
    claim: 'Malachi says the people corrupted the covenant of Levi'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'Malachi 2:8 refers to the priestly covenant, indicating that the people had “corrupted the covenant of Levi” (the tribe designated to hold priestly authority under the Mosaic covenant). As with other covenant relationships, this relationship was signified by'
  - where: 'section “The covenants, in order”'
    claim: 'Psalm 132:11–12 qualifies the Davidic promise: the earthly kingdom endures only if descendants are faithful'
    key: scripture-helps-2-sam
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'Psalm 132:11–12 adds the important qualification that David’s earthly kingdom would endure only if his descendants remained faithful to the Lord. Because of wickedness, David’s kingdom was divided after Solomon’s death, with his descendants ruling over only the'
  - where: 'section “The covenants, in order”'
    claim: '“New” in Jer. 31 means God’s covenant, the fulness of the gospel, revealed anew'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'In this context, new means that God’s covenant—“the fulness of [the] gospel”—would be revealed anew in the last days. The Lord sometimes calls this covenant the “new and everlasting covenant.” Jeremiah prophesied that the Lord’s people would have'
  - where: 'section “The covenants, in order”'
    claim: 'The new and everlasting covenant and the Abrahamic covenant are essentially the same'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: '“The new and everlasting covenant” (Doctrine and Covenants 132:6) and the Abrahamic covenant are essentially the same—two ways of phrasing the covenant God made with mortal men and women at different times.'
  - where: 'section “Torah, and what the law of Moses was for”'
    claim: 'Torah means divine direction and instruction; it includes particularly the five books of Moses'
    key: bd-torah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/torah?lang=eng'
    quote: 'The Torah is thus divine direction and instruction; it includes the law, particularly the five books of Moses, and takes precedence over other books of the Old Testament to most Jewish people. Torah scrolls are often elaborately made'
  - where: 'section “Torah, and what the law of Moses was for”'
    claim: 'The law of Moses replaced a higher law Israel had failed to obey; a preparatory gospel to bring its adherents to Christ'
    key: bd-law-of-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/law-of-moses?lang=eng'
    quote: 'The name assigned to the whole collection of written laws given through Moses to the house of Israel, as a replacement of the higher law that they had failed to obey. The law of Moses consisted of many'
  - where: 'section “Torah, and what the law of Moses was for”'
    claim: 'The law still included faith, repentance, baptism and the Ten Commandments; a preparatory gospel'
    key: bd-law-of-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/law-of-moses?lang=eng'
    quote: 'Faith, repentance, baptism in water, and remission of sins were part of the law, as were also the Ten Commandments. Although inferior to the fulness of the gospel, there were many provisions in the law of Moses of'
