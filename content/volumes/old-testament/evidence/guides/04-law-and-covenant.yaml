    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/50-gods-everlasting-covenant?lang=eng'
    quote: 'It is described as new because it has been reestablished at various points in history and everlasting because it is eternal and unchanging.'
