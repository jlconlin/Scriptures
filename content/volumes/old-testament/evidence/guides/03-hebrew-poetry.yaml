    claim: "Each stanza has eight verses"
    key: scripture-helps-ps-102
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng"
    quote: "Each of the 22 stanzas has eight verses."
  - where: "section “Acrostics”"
    claim: "Verses 1–8 begin with aleph, 9–16 with beth"
    key: scripture-helps-ps-102
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng"
    quote: "in the original Hebrew, verses 1–8 all start with aleph, verses 9–16 with beth, and so on."
  - where: "section “Acrostics”"
    claim: "The Church’s 1979 edition prints the Hebrew letter over each section of Psalm 119"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
