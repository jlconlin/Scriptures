page: 03-hebrew-poetry
claims:
  - where: "opening"
    claim: "Much of the Old Testament is poetry, including a substantial part of the prophets"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "as much as a third of the Old Testament is written in poetry"
  - where: "opening"
    claim: "Many prophets wrote their messages in Hebrew poetic forms"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "Many of the prophets of ancient Israel wrote their messages in Hebrew poetic forms"
  - where: "opening"
    claim: "Hebrew poetry uses patterns of repetition rather than meter or rhyme"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "Rather than using meter or rhyme, Hebrew poetry uses patterns of repetition."
  - where: "opening"
    claim: "Parallelism is a symmetry of meaning, not syllables"
    key: sc-knowhy-831
    url: "https://scripturecentral.org/knowhy/why-is-knowing-genre-important-for-understanding-the-old-testament"
    quote: "a symmetry of meaning, not syllables"
  - where: "opening"
    claim: "A structure based on meaning survives translation with little loss"
    key: ot-manual-g
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-g-hebrew-literary-styles?lang=eng"
    quote: "survives translation into the prose of any language with remarkably little loss"
  - where: "section “How a verse is built: parallelism”"
    claim: "Parallelism is the most basic form of Old Testament poetry"
    key: parry-synonymous
    url: "https://rsc.byu.edu/preserved-translation/synonymous-parallelism"
    quote: "Poetic parallelism is the most basic form of poetry in the Old Testament."
  - where: "section “How a verse is built: parallelism”"
    claim: "The second line restates, reinforces or reconfigures; both lines equally important"
    key: parry-synonymous
    url: "https://rsc.byu.edu/preserved-translation/synonymous-parallelism"
    quote: "restates, reinforces, or reconfigures them in the next line"
  - where: "section “How a verse is built: parallelism”"
    claim: "Both lines equally important"
    key: parry-synonymous
    url: "https://rsc.byu.edu/preserved-translation/synonymous-parallelism"
    quote: "In a parallelism, both lines are equally important."
  - where: "section “How a verse is built: parallelism”"
    claim: "Isa. 1:2 is a synonymous parallelism (hear/give ear, heavens/earth)"
    key: parry-synonymous
    url: "https://rsc.byu.edu/preserved-translation/synonymous-parallelism"
    quote: "in the parallelism “Hear O heavens and give ear O earth” (Isaiah 1:2), hear parallels give ear and heavens parallels earth"
  - where: "section “How a verse is built: parallelism”"
    claim: "The types are aids, not rigid rules; the second line may partly parallel the first"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "None of these patterns of parallelism was held to rigidly or mechanically. Often the second line only partially parallels the first"
  - where: "section “How a verse is built: parallelism”"
    claim: "The types are aids to recognize patterns of repetition"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "The various types of parallelism should be thought of simply as aids to help us recognize some of the many patterns of repetition"
  - where: "section “How a verse is built: parallelism”"
    claim: "Parallelism may involve three, four or more lines"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "In many cases, the parallelism does not form a couplet, but involves three, four, or more lines."
  - where: "section “How a verse is built: parallelism”"
    claim: "Antithetic parallelism: the second line contrasts with the first; Ps. 1:6 as example"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "Antithetic, in which the second line contrasts with the first:"
  - where: "section “How a verse is built: parallelism”"
    claim: "Emblematic parallelism: literal statement with metaphor or simile; Ps. 42:1"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "Emblematic, in which a literal statement is contrasted with a metaphor or a simile:"
  - where: "section “How a verse is built: parallelism”"
    claim: "Stairlike parallelism: repeated phrase introduces new thoughts; Ps. 29:1"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "Stairlike, in which a repeated phrase introduces new thoughts"
  - where: "section “How a verse is built: parallelism”"
    claim: "Synthetic parallelism is a building up of thought, each line adding to the first"
    key: ot-manual-g
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-g-hebrew-literary-styles?lang=eng"
    quote: "c. Synthetic parallelism is a building up of thought, with each succeeding line adding to the first:"
  - where: "section “How a verse is built: parallelism”"
    claim: "Ps. 1:3 as the manual's example of synthetic parallelism"
    key: ot-manual-g
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-g-hebrew-literary-styles?lang=eng"
    quote: "And he shall be like a tree planted by the rivers of water,"
  - where: "section “How a verse is built: parallelism”"
    claim: "A climactic form duplicates words from phrase to phrase"
    key: parry-climactic
    url: "https://rsc.byu.edu/sites/default/files/pub_content/pdf/2%20Climactic%20Expressions.pdf"
    quote: "A climac - tic form contains words or expressions that are duplicated as the writer moves from one phrase or clause to the next."
  - where: "section “How a verse is built: parallelism”"
    claim: "Thought builds to a crowning point"
    key: parry-climactic
    url: "https://rsc.byu.edu/sites/default/files/pub_content/pdf/2%20Climactic%20Expressions.pdf"
    quote: "Then, at least in some cases, there is an important crowning point, or climax, at the end."
  - where: "section “How a verse is built: parallelism”"
    claim: "Joel 1:3–4 is an example of climax"
    key: parry-climactic
    url: "https://rsc.byu.edu/sites/default/files/pub_content/pdf/2%20Climactic%20Expressions.pdf"
    quote: "Bullinger provides the following biblical example of climax from Joel 1:3–4."
  - where: "section “How a verse is built: parallelism”"
    claim: "Chiasmus is inverted parallelism"
    key: parry-chiasmus
    url: "https://rsc.byu.edu/preserved-translation/chiasmus"
    quote: "Chiasmus is an inverted parallelism; it presents a series of words or ideas followed by a second presentation of similar words or ideas, but in reverse order."
  - where: "section “How a verse is built: parallelism”"
    claim: "The Old Testament has hundreds of chiasms; Isaiah more than a hundred"
    key: parry-chiasmus
    url: "https://rsc.byu.edu/preserved-translation/chiasmus"
    quote: "The Old Testament has hundreds of chiasms (the book of Isaiah alone has more than one hundred)"
  - where: "section “How a verse is built: parallelism”"
    claim: "Isa. 5:20 has three simple chiasms"
    key: parry-chiasmus
    url: "https://rsc.byu.edu/preserved-translation/chiasmus"
    quote: "Three examples of simple chiasmus are found in Isaiah 5:20"
  - where: "section “How a verse is built: parallelism”"
    claim: "Isa. 5:20 has chiasms on darkness/light and bitter/sweet"
    key: parry-chiasmus
    url: "https://rsc.byu.edu/preserved-translation/chiasmus"
    quote: "The verse features two other simple chiasms based on darkness/light and bitter/sweet."
  - where: "section “How a verse is built: parallelism”"
    claim: "Gen. 4:23: Adah and Zillah are the wives of Lamech; the man and the young man are the same"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "The “wives of Lamech” are Adah and Zillah; the “man” and the “young man” are the same."
  - where: "section “Acrostics”"
    claim: "An acrostic is a device by which the first letters of lines form words or the alphabet; not apparent in translation"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "An acrostic is a device by which the first letters of a series of lines form words or the alphabet."
  - where: "section “Acrostics”"
    claim: "Acrostics are not apparent in translation"
    key: barney-ot-poetry
    url: "https://www.churchofjesuschrist.org/study/ensign/1990/06/understanding-old-testament-poetry?lang=eng"
    quote: "One form of Hebrew poetry not apparent in translation is the acrostic"
