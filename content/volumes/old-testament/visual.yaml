# The volume's picture, shown on /old-testament/ under the introduction (DEVELOPMENT.md, “Volume pages”).
# Drawn by Codex from a brief written in conversation with the author (2026-11-17), not by the book-art workflow:
# a mosaic of twelve panels, read left to right and top to bottom, from the garden to the promise of the Messiah.
# The author chose a style unlike the book images for the volume (“I like that this one is a different style, but
# still fits with the site”), new and unworn so it does not look like a copy of a real ancient floor.
summary: >-
  The Old Testament from the garden of Eden to the promise of the Messiah, told as a mosaic of twelve
  picture panels, each showing one story by its objects alone.
look: >-
  A newly made mosaic of small natural stone tesserae in a simple folk style: plain flat shapes with dark
  outlines, muted stone colors, gold only for fire and holy things; clean and complete, with no wear.
asset: /assets/old-testament-volume-art.jpg
alt: >-
  A mosaic of twelve panels in three rows. Top row: a fruit tree with a serpent in its branches above a river
  parting into streams; Noah's ark on a mountaintop under a rainbow, with a dove carrying an olive leaf; a stone
  altar laid with wood beside a ram with its horns caught in a thicket; the sea parted into two walls of water
  with a dry road between. Middle row: a mountain with cloud and fire above two stone tablets; the golden ark
  of the covenant on its poles with wings over its lid; a city's walls fallen flat behind seven ram's horn
  trumpets; a sling and shepherd's bag, five smooth stones and a harp. Bottom row: a temple between two bronze
  pillars; a chariot and horses of fire rising, with a cloak fallen on the ground below; two lions lying quietly
  in a stone den with a slab across its mouth; a cut-down stump with a young green shoot growing in gold light.
key:
  - '**The tree with a serpent in it, and the river parting below it,** are the garden of Eden: “a river went out of Eden to water the garden; and from thence it was parted, and became into four heads” ([[Gen. 2:10]]; [[Gen. 3:1]]).'
  - '**The ark on the mountain under a rainbow, and the dove,** are the end of the flood and God’s covenant with Noah: “lo, in her mouth was an olive leaf plucked off” and “I do set my bow in the cloud” ([[Gen. 8:11]]; [[Gen. 9:13]]).'
  - '**The altar and the ram caught in the thicket** are Abraham’s offering of Isaac, and the ram the Lord provided in his place: “behold behind him a ram caught in a thicket by his horns” ([[Gen. 22:13]]).'
  - '**The sea parted into two walls** is Israel’s deliverance from Egypt: “the waters were a wall unto them on their right hand, and on their left” ([[Ex. 14:22]]).'
  - '**The mountain in fire and cloud, and the two stone tablets,** are the covenant at Sinai: “I will give thee tables of stone, and a law, and commandments” ([[Ex. 19:18]]; [[Ex. 24:12]]).'
  - '**The golden ark with wings over its lid** is the ark of the covenant, where the Lord met His people: “the cherubims shall stretch forth their wings on high, covering the mercy seat” ([[Ex. 25:20]]).'
  - '**The fallen walls and the seven ram’s horns** are Jericho, the first city Israel took in the promised land: “seven trumpets of rams’ horns” and “the wall fell down flat” ([[Josh. 6:4]]; [[Josh. 6:20]]).'
  - '**The sling, the bag, the five stones and the harp** are David, the shepherd who became king: “five smooth stones out of the brook,” and “David took an harp, and played with his hand” ([[1 Sam. 17:40]]; [[1 Sam. 16:23]]).'
  - '**The temple between two bronze pillars** is the house Solomon built for the Lord: “he set up the pillars in the porch of the temple,” with “lily work” on their tops ([[1 Kgs. 7:21–22]]).'
  - '**The chariot of fire, and the cloak fallen below it,** are Elijah’s going up into heaven, and the mantle he left for Elisha: “there appeared a chariot of fire, and horses of fire … and Elijah went up by a whirlwind into heaven” ([[2 Kgs. 2:11]]; [[2 Kgs. 2:13]]).'
  - '**The lions lying quietly in a sealed den** are Daniel, faithful in exile in Babylon: “a stone was brought, and laid upon the mouth of the den,” and God “hath shut the lions’ mouths” ([[Dan. 6:17]]; [[Dan. 6:22]]).'
  - '**The shoot growing from a cut-down stump** is the promise of the Messiah, a king from David’s fallen line: “there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots” ([[Isa. 11:1]]).'
status: approved
