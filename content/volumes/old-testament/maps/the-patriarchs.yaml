  - { name: Haran, dx: 7, dy: 4 }
  - { name: Damascus }
  - { name: Shechem, dx: 7, dy: 2, small: true }
  - { name: Bethel, find: Bethel 1, dx: -6, dy: 2, small: true }
  - { name: Hebron, dx: 7, dy: 6, small: true }
  - { name: Beersheba, at: [34.8406, 31.2453], dx: -6, dy: 8, small: true }
  - { name: Rameses, label: Goshen, dx: 7, dy: 4 }
