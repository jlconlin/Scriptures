# The map of guide 1, The Patriarchs (scripts/map.mjs; DEVELOPMENT.md, “Maps”).
# Ur is marked at its traditional site (Tell el-Muqayyar); the northern proposals (the plain of Olishem, near Haran)
# name a region, not a point, so they are a label. Beersheba is given by position (Tel Beer Sheva).
title: The lands of Abraham, Isaac, Jacob and Joseph
box: [30.8, 29.8, 47.0, 37.6]   # west, south, east, north
width: 600
riverRank: 9
places:
