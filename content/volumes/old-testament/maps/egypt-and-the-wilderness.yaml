# The map of guide 2, Egypt and the Wilderness (scripts/map.mjs; DEVELOPMENT.md, “Maps”).
# Mount Sinai, Kadesh-barnea and Mount Nebo are natural features in OpenBible, which the script skips, so their
# positions (OpenBible's: Jebel Musa, Ain el Qudeirat, Jabal al Naba) are given with `at`. Where Sinai was is not
# known; Jebel Musa is the traditional site, and the guide's caption says so. No route is drawn.
title: Egypt, Sinai and the plains of Moab
box: [30.9, 27.7, 36.9, 32.3]   # west, south, east, north
width: 600
riverRank: 9
places:
  - { name: Rameses, dx: -6, dy: -4 }
  - { name: Pithom, dx: -6, dy: 12, small: true }
  - { name: Succoth, find: Succoth 2, dx: 7, dy: 12, small: true }
  - { name: Mount Sinai, label: Mount Sinai (traditional site), at: [33.9733, 28.5397], dx: 7, dy: 4 }
  - { name: Kadesh-barnea, at: [34.4222, 30.6483] }
  - { name: Mount Nebo, at: [35.75, 31.7667], dx: 7, dy: 10, small: true }
  - { name: Jericho, at: [35.444, 31.871], dx: 7, dy: -3, small: true }
  - { name: Jerusalem, home: true, dx: -8, dy: 5 }
labels:
  - { text: Great Sea, at: [32.6, 31.85], class: m-sea-label }
  - { text: EGYPT, at: [31.45, 29.6], class: m-empire }
  - { text: GOSHEN, at: [32.3, 30.82], class: m-region }
  - { text: SINAI, at: [33.6, 29.6], class: m-region }
  - { text: WILDERNESS OF PARAN, at: [34.55, 29.95], class: m-region }
  - { text: EDOM, at: [35.55, 30.3], class: m-region }
  - { text: MOAB, at: [35.95, 31.3], class: m-region }
  - { text: MIDIAN, at: [35.3, 28.3], class: m-region }
  - { text: CANAAN, at: [35.05, 31.95], class: m-region }
  - { text: Gulf of Suez, at: [33.15, 28.25], class: m-sea-label }
  - { text: Gulf of Aqaba, at: [34.6, 28.75], class: m-sea-label }
  - { text: Nile, at: [31.15, 30.25], class: m-river-label }
  - { text: Jordan, at: [35.75, 32.15], class: m-river-label }
