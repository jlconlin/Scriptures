summary: >-
  The Book of Moses opens on a high mountain where God shows Moses His work and His
  glory, then follows the gospel taught from the beginning to Enoch's city of one heart
  and one mind, where the heavens weep over a world that will not gather. Its center is
  the Only Begotten, by whom worlds are made and through whom immortality and eternal
  life come.
motifs:
  - "In the near foreground at the lower left, the edge of a green garden: one fruit tree and a small clear stream, lush against the drier ground around it."
  - "Two very small figures, a man and a woman in plain long robes, seen from behind and far off, walking side by side out of the garden along the path toward the mountain."
  - A high mountain under a sky of many small stars, one star-like point of gold light low over its summit.
  - A small city of pale stone on a distant ridge, quiet and whole, with a soft light rising above it.
  - A single gentle band of rain falling from one cloud onto far mountain slopes.
composition: >-
  The mountain rises as the central focal point against a deep indigo sky, stars
  scattering outward above it. The pale city sits on a lower ridge at the right, lit
  by the same gold light. A single gentle band of rain falls on distant slopes at the
  left, soft and contemplative, never a storm. A clear path of open ground rises
  from the garden in the lower left foreground toward the summit, and the two small
  figures are on it, a little way out of the garden. The garden is a modest corner of
  the picture, never its subject; the mountain and its light remain the focal point.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The garden and the two figures walking out of it** are Adam and Eve leaving Eden: “I, the Lord God, will send him forth from the Garden of Eden, to till the ground from whence he was taken” ([[Moses 4:29]]).'
  - '**The high mountain with a point of gold light above it** is where Moses was “caught up into an exceedingly high mountain” and saw God, who told him, “this is my work and my glory” ([[Moses 1:1]]; [[Moses 1:39]]).'
  - '**The pale city on the ridge, with light rising above it,** is Enoch’s Zion: “the Lord called his people Zion, because they were of one heart and one mind” ([[Moses 7:18]]).'
  - '**The band of rain from a single cloud** is the heavens weeping over the world: “How is it that the heavens weep, and shed forth their tears as the rain upon the mountains?” ([[Moses 7:28]]).'
