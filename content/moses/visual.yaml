alt: Two small figures walk from a garden up a path toward a high mountain beneath a starry sky, with a pale city on a ridge at the right and a thin band of rain on distant slopes at the left.
figures: >-
  Exactly two human figures are allowed, Adam and Eve leaving the garden (author, 2026-10-06): tiny, distant, seen from
  behind, fully robed, drawn as simple shapes with no faces and no detail.
