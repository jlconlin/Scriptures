chapter: 1
title: 'Moses on the Mountain'
tagline: 'Moses sees God face to face, is tested by Satan, is shown worlds without number, and is told the Lord’s work and glory.'
when: 'Moses 1 happened between the burning bush and the Exodus; it was revealed to Joseph Smith in June 1830.'

setting: |
  The Book of Moses is “an extract from the book of Genesis of Joseph Smith’s translation of the Bible, which he began in June 1830.” The Joseph Smith Translation was begun shortly after the Book of Mormon was published, and the book of Moses is part of it. Moses 1 is unlike the rest: it “is completely unique material, with no counterpart in the Bible.” The manuscript heading, in Oliver Cowdery’s hand, calls it “a revelation given to Joseph the Revelator June 1830,” and it came amid “physical persecutions directed at him and spiritual trials for the infant church.”

  Inside the text, the setting is a mountain Moses is “caught up into” ([[Moses 1:1]]), the name of which “shall not be known among the children of men” ([[Moses 1:42]]). Moses has already met the Lord at the burning bush ([[Moses 1:17]]) and has not yet delivered Israel ([[Moses 1:26]]). Verses 40–41 tell Moses to write what the Lord will say. The chapters that follow ([[Moses 2]] onward) are that writing, and the Lord says that when the words of his book are esteemed as naught and taken from it, another will be raised up to restore them.

  So the chapter is a preface in two senses. It prepares Moses for his work, and it tells the reader whose words the book contains, why they were written, and what they are for.

thread: |
  The chapter moves from seeing to testing to meaning. Moses is first shown who God is and who he himself is: a son, in the similitude of the Only Begotten, who also learns that “man is nothing.” Then Satan comes, asking for worship, and Moses answers by what he has just seen: glory is the difference. Satan even claims the Savior’s title, and he departs when Moses commands him in that Son’s name. Then, with Satan gone, Moses is shown the earth, the worlds, and the Lord’s purpose in them, and the Lord states it plainly: “to bring to pass the immortality and eternal life of man.” The Only Begotten is named in verses 6, 13, 16, 17, 19, 21, 32, and 33, and the chapter is about Him as much as it is about Moses.

sections:
  - range: 1-11
    heading: 'God speaks with Moses face to face'
    plain: |
      Moses is caught up into a very high mountain. He sees God face to face and talks with him, and God’s glory is on Moses so that he can bear it. God says: “I am the Lord God Almighty, Endless is my name, without beginning of days or end of years. You are my son. I will show you the work of my hands, but not all of it, for my works and words have no end. No man can see all my works unless he sees all my glory, and no man can see all my glory and stay in the flesh. I have a work for you, Moses, my son. You are in the likeness of my Only Begotten, who is and will be the Savior. There is no God beside me, and I know all things.” Moses sees the world and everyone in it, and marvels. Then God’s presence withdraws. Moses falls to the earth and, for many hours, cannot recover his strength. He says that now he knows man is nothing, which he never supposed, and that he has seen God with his spiritual eyes, since his natural eyes would have withered.
  - range: 12-23
    heading: 'Satan tempts Moses'
    plain: |
      Satan comes and says, “Moses, son of man, worship me.” Moses asks who he is. Moses is a son of God in the likeness of His Only Begotten, and he asks where Satan’s glory is. He could not look on God without being transfigured, but he can look on Satan as he is. God’s Spirit has not left him, he says, so he can judge between them, and God has told him to worship God only. He cites what God said at the burning bush: call on God in the name of the Only Begotten. Satan rages and says, “I am the Only Begotten, worship me.” Moses begins to fear and sees the bitterness of hell, but he calls on God and receives strength, and commands Satan in the name of the Only Begotten to leave. Satan trembles, the earth shakes, and he goes, weeping and wailing. Moses wrote this account, but because of wickedness it is not had among the children of men.
  - range: 24-42
    heading: 'The earth, the worlds, and the Lord’s work'
    plain: |
      Filled with the Holy Ghost, Moses calls on God and again sees His glory. A voice says he is chosen, that waters will obey him, and that God will be with him as he delivers Israel. Moses sees the whole earth and all its people, and many lands, each called earth. He asks why these things are so and by what they were made. The Lord answers: for His own purpose, and by His Word, His Only Begotten Son. Worlds without number have been created, some have passed away, and many stand. The Lord gives Moses an account of this earth only. Then He says His work and glory is to bring to pass the immortality and eternal life of man. He tells Moses to write what He will say, and says that when people take many of those words from the book, He will raise up another like Moses to restore them. The mountain’s name will not be known; the words are to be shown only to believers.

notes:
  - ref: 1
    phrase: 'caught up into an exceedingly high mountain'
    kind: history
    title: 'When in Moses’ life the vision came'
    body: |
      The vision happened after the burning bush and before the Exodus. The text itself places it: the Lord’s commandment “when he called unto me out of the burning bush” is something Moses looks back on ([[Moses 1:17]]), and the promise that he “shalt deliver my people from bondage” looks ahead ([[Moses 1:26]]). The vision “took place after Jehovah spoke to Moses at the burning bush but before Moses led the children of Israel out of Egypt and through the Red Sea.” The exact time and place are not known, though it shows that the Lord went on instructing Moses beyond his first call.

      What the mountain gives Moses is, on one reading, what the Exodus was meant to give Israel. At the bush the Lord told Moses that the people would “serve God upon this mountain” ([[Ex. 3:12]]). On this reading Moses’s own meeting with God was “what the Lord intended for all the children of Israel,” the purpose of the Exodus was to prepare the people “to see and converse with God,” and the vision is “paving the way” for the Lord’s statement of His work in [[Moses 1:39]]. It is a reading, not a statement of the text.
    sources: [pgp-manual-moses-1-1-11, schade-bowen-moses-1, lds-scriptures]
  - ref: 6
    phrase: 'mine Only Begotten is and shall be the Savior'
    kind: christ
    title: 'The Lord speaking for the Father'
    body: |
      The speaker is the premortal Jesus Christ, speaking in the Father’s name. That is how He can say “mine Only Begotten” as if of another, wording that by itself leaves the impression that Moses is talking with the Father. Jesus Christ “sometimes speaks as if He were God the Father,” which is called divine investiture of authority.

      The First Presidency and the Quorum of the Twelve set the doctrine out in a joint exposition: “in all His dealings with the human family Jesus the Son has represented and yet represents Elohim His Father in power and authority,” and this was so in His premortal state, “in the which He was known as Jehovah.” The Father “placed His name upon the Son,” so that “so far as power, authority, and godship are concerned His words and acts were and are those of the Father.” President Dallin H. Oaks gave the reason a reader should expect this throughout scripture. Before the Fall the Father “spoke directly to Adam and Eve”; afterward He introduced His Son and commanded that He be heard, so that words the scriptures record as spoken by God or the Lord “are almost always the words of Jehovah, our risen Lord, Jesus Christ.” It is the kind of speech a prophet uses when he speaks in the Lord’s person: “the same pattern of authorized, delegated speech in the first person occurs throughout the scriptures, especially in the form of prophets speaking for the Lord.”
    sources: [scripture-helps-moses-1, father-and-son-1916, oaks-teachings-christ-2023, schade-bowen-moses-1]
  - ref: 6
    phrase: 'there is no God beside me'
    kind: history
    title: 'No God beside me, spoken to a man raised in Egypt'
    body: |
      This statement was made to a man who had grown up among many gods. Moses “was reared in an atmosphere of idolatry,” among “numerous deities,” the First Presidency taught, and to begin his work “it was necessary to center his mind and faith upon God the Eternal Father as the only Being to worship,” who is approached “in the name of the Only Begotten.” The statement “should not be interpreted to mean that mankind does not have the eternal potential to become like God.”

      The words just before it meet the same background. Moses’s upbringing has been described as in a royal household whose members were “believed to be ‘begotten’ incarnations of deities”; there he is told that he is “in the similitude of mine Only Begotten” and that there is no God beside the one speaking. It has also been suggested, as a possibility only, that “similitude” reaches beyond sonship to “the role Moses would play in saving and delivering Israel.”
    sources: [pgp-manual-moses-1-1-11, schade-bowen-moses-1]
  - ref: 10
    phrase: 'man is nothing'
    kind: prophets
    title: 'Man is nothing, and yet a son of God'
    body: |
      Moses says “man is nothing” and then, three verses later, “I am a son of God,” and the chapter holds both. The first is said on the ground, after the glory has withdrawn and his strength is gone ([[Moses 1:9–10]]). The second is said to Satan ([[Moses 1:13]]), and it repeats what he was told at the start: “thou art my son” ([[Moses 1:4]]).

      Moses had been “learned in all the wisdom of the Egyptians, and was mighty in words and in deeds” ([[Acts 7:22]]), and what he says he “never had supposed” was something that “in all his years in Pharaoh’s court, had never occurred to him before.” President Dieter F. Uchtdorf read the two sayings together as “a paradox of man: compared to God, man is nothing; yet we are everything to God.” Neither cancels the other: “While against the backdrop of infinite creation we may appear to be nothing, we have a spark of eternal fire burning within our breast.”
    sources: [uchtdorf-you-matter-2011, lds-scriptures]
  - ref: 14
    phrase: 'I could not look upon God, except his glory should come upon me'
    kind: scripture
    title: 'Glory as the way Moses knows whom to worship'
    body: |
      Moses tests Satan by glory, and he says where his power to judge comes from. He “could not look upon God, except his glory should come upon me, and I were transfigured before him,” whereas he can look on Satan “in the natural man” ([[Moses 1:14]]). So he asks, “where is thy glory, that I should worship thee?” ([[Moses 1:13]]), and answers for himself that “it is darkness unto me” ([[Moses 1:15]]). The first vision had taught him “about God’s glory and the devil’s lack thereof.”

      The comparison is not made by sight alone. Before Moses says “I can judge between thee and God,” he blesses God that “his Spirit hath not altogether withdrawn from me” ([[Moses 1:15]]): he “recognizes that it is only by the power of the Spirit that he can judge between the imitator and God himself.” Verse 18 gives the other ground, “his glory has been upon me, wherefore I can judge between him and thee” ([[Moses 1:18]]). Both manuscripts of the translation are fuller there than the printed text: “his glory has been upon me and it is glory unto me.”
    sources: [schade-bowen-moses-1, schade-bowen-moses-1-work-glory, lds-scriptures]
  - ref: 19
    phrase: 'I am the Only Begotten, worship me'
    kind: scripture
    title: 'Satan answers with the Savior’s title'
    body: |
      Satan’s last move is to claim the Savior’s own title, and Moses’s last answer is to use the Savior’s name. “Satan often impersonates or imitates God in His different capacities,” and this scene is one of the clearest examples: after Moses refuses to worship him, Satan shouts, “I am the Only Begotten, worship me.”

      Moses had been given the answer beforehand. At the burning bush the commandment was to “call upon God in the name of mine Only Begotten, and worship me” ([[Moses 1:17]]). He tells Satan to go four times. The first three ([[Moses 1:16]]; [[Moses 1:18]]; [[Moses 1:20]]) are in his own voice, and between them Satan rages, Moses fears, and Moses calls on God and receives strength. The fourth is “In the name of the Only Begotten, depart hence, Satan” ([[Moses 1:21]]), and in the next verse Satan is gone.
    sources: [sc-knowhy-176, lds-scriptures]
  - ref: 33
    phrase: 'worlds without number'
    kind: christ
    title: 'Worlds without number, and the Son who made them'
    body: |
      Moses asks two questions, “why these things are so, and by what thou madest them” ([[Moses 1:30]]), and the Lord answers the second first. To the why He says only, “For mine own purpose have I made these things. Here is wisdom and it remaineth in me” ([[Moses 1:31]]); the purpose is not stated until verse 39. To the “by what” He answers at once, and twice: “by the word of my power, have I created them, which is mine Only Begotten Son” ([[Moses 1:32]]), and “by the Son I created them” ([[Moses 1:33]]). The order has been read as deliberate: “there was something Moses needed to recognize before he could understand why—it was the answer to his second question.”

      The answer carries into the account Moses is told to write, which opens, “by mine Only Begotten I created these things” ([[Moses 2:1]]). “Creation by divine word, Christ as the divine Word, and the efficacy of divine words once spoken will constitute a dominant thread in the Book of Moses.” Of the worlds without number the Lord gives “only an account of this earth, and the inhabitants thereof” ([[Moses 1:35]]).
    sources: [schade-bowen-moses-1-work-glory, lds-scriptures]
  - ref: 34
    phrase: 'which is many'
    kind: words
    title: 'The name Adam and the many'
    body: |
      “Which is many” has been read as a gloss on the name Adam. In this verse Adam is a personal name, the name of “the first man of all men,” but the Semitic word *adam* also means humankind or people. On this reading “many” points to the numberless inhabitants of verse 28, the “people and generations stemming from Adam, the father of all humans, that Moses had just been shown in vision.” The verse does not explain the phrase itself, and this is one study’s proposal.
    sources: [schade-bowen-moses-1-work-glory]
  - ref: 39
    phrase: 'my work and my glory'
    kind: christ
    title: 'The work and glory, and the two gifts'
    body: |
      The Lord states His purpose as two gifts, and the verse is the answer to the “why” that Moses asked in verse 30 and was not told in verse 31. “Immortality is to live forever as a resurrected being,” a gift everyone receives through the Atonement of Jesus Christ. Eternal life, or exaltation, “is to live in God’s presence and to continue as families,” and it requires “obedience to the laws and ordinances of the Gospel.”

      The two halves bear differently on the man being addressed. Immortality is “an aspect of the work that only the Savior could bring into effect.” The other half, bringing God’s children to eternal life, “was now also his work”: what Moses could help with was “a journey that would lead him and the people out of Egypt and into the wilderness to receive the covenant.” So the verse that states God’s work also tells Moses what the work of verse 6 (“I have a work for thee”) is for. This is offered as a reading of how the verse fits Moses’s call, not as something the verse says.
    sources: [scripture-helps-moses-1, schade-bowen-moses-1-work-glory]
  - ref: 41
    phrase: 'take many of them from the book which thou shalt write'
    kind: scripture
    title: 'Words taken from the book, and restored'
    body: |
      Verse 41 says that words will be taken from Moses’s book and had again, and the chapter has already given an instance: of the encounter with Satan “Moses bore record; but because of wickedness it is not had among the children of men” ([[Moses 1:23]]). Nephi saw the same loss, “plain and most precious” parts taken from the book ([[1 Ne. 13:26–29]]), and Joseph Smith may have understood such words in the Book of Mormon as calling for a new translation, “although we cannot be certain of this.”

      Whether the book of Moses gives back text that Moses once wrote is left open: it “may include the restoration of material that was lost,” and it “may also have been revelation given by the Lord to Joseph Smith that was never originally in the Bible.” Either way it restores truths that Nephi foretold would be lost. Moses 2–8 “presents information that is not found in the corresponding material in Genesis,” including the significance of the Fall, the importance of the Atonement of Jesus Christ, and evidence that Adam and Eve and their descendants had the gospel.
    sources: [scripture-helps-moses-1, schade-bowen-moses-1, lds-scriptures]

christ: |
  Moses 1 names the Only Begotten in eight verses: the Lord speaks of Him, Moses calls on His name, and Satan tries to take His title ([[Moses 1:19]]). He is “full of grace and truth” and “is and shall be the Savior” ([[Moses 1:6]]). Moses is in His similitude ([[Moses 1:16]]), and His name is the one by which God is called upon ([[Moses 1:17]]; [[Moses 1:21]]). He is the Word of the Father’s power by whom worlds without number were created ([[Moses 1:32–33]]). And the work He serves is the immortality that, through the Atonement, “everyone will receive,” and the eternal life that the Atonement also makes possible ([[Moses 1:39]]).

explore: |
  - **The next chapter.** [[Moses 2]] begins the account Moses is told to write; the Creation “by the Son” in verse 33 is where it starts.
  - **Moses and the burning bush.** [[Ex. 3]] is the call that Moses looks back on in verse 17.
  - **Satan’s tempting of Jesus.** In [[Matt. 4:8–10]] Satan asks Jesus for worship, and the answer ends as Moses’s does in verse 15: “him only shalt thou serve” ([[Matt. 4:10]]).

parallels:
  - ref: Ex. 3
    note: 'The burning bush, to which Moses looks back in verse 17.'
  - ref: Matt. 4:1–11
    note: 'Satan asks Jesus for worship (Matthew 4:9–10).'

