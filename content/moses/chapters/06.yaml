chapter: 6
title: Adam’s Book, Enoch’s Call, and the Gospel Taught from the Beginning
tagline: Adam’s family keeps a book of remembrance and a pure language while Satan’s dominion grows; Enoch is called, anointed to see, and preaches what God taught Adam about the Fall, repentance, and baptism in the name of the Only Begotten.
when: 'Inside the text, from Seth’s birth through the generations to Enoch, a young man called to preach. The text of the chapter was received by Joseph Smith beginning in November 1830.'

setting: |
  Moses 6 is where the Book of Moses leaves the family of Adam and Eve and turns toward Enoch. Its first part (verses 1–25) follows the generations from Seth to Enoch, much as Genesis does ([[Gen. 5:1–21]]); see the notes on that chapter for the names, the long lives, and the walk with God. What this chapter adds is what Genesis does not say about those generations: they kept a book and taught their children to read and write, and in the same years Satan’s dominion spread. The second part (verses 26–68) is where the chapter is its own. Genesis says only that Enoch “walked with God after he begat Methuselah three hundred years” ([[Gen. 5:22]]); here the Lord calls him, he sees as a seer, and he preaches.

  Enoch’s sermon is largely a retelling of what God taught Adam. Joseph Smith began receiving the text of the chapter in November 1830. The preaching that begins here goes on in the next chapter, where it creates Zion in the midst of widespread wickedness ([[Moses 7]]). The Fall that this chapter explains is told in [[Moses 4]] and [[Moses 5]].

thread: |
  The chapter has two parts, and the second leans on the first. In the first, the faithful keep records: a book of remembrance, a genealogy, a language fit for both ([[Moses 6:5–8]]). In the second, Enoch preaches to people who have those records. He appeals to “a book of remembrance we have written among us” ([[Moses 6:46]]), and then tells them what “God hath made known unto our fathers” ([[Moses 6:50]]), which is what God taught Adam.

  That teaching answers a question Adam asked: why must people repent and be baptized? The answer is that the Fall does not make children guilty, yet they are born into a world of sin and need to be cleansed by Christ. The gospel Enoch preaches is not new with him. It was given to “our father Adam” in the name of the Only Begotten, and Adam himself was baptized and born of the Spirit ([[Moses 6:51–68]]).

sections:
  - range: 1-9
    heading: Seth, a book of remembrance, and a pure language
    plain: |
      Adam listened to God and called his sons to repent. Seth was born in place of Abel, and God revealed Himself to Seth. Then men began to call on the Lord, and a book of remembrance was kept in Adam’s language, by inspiration. Parents taught their children to read and write in that pure language. The priesthood that existed in the beginning will also exist at the end of the world. Adam prophesied by the Holy Ghost, and a genealogy was kept, which was the book of the generations of Adam.
  - range: 10-25
    heading: The generations from Adam to Enoch
    plain: |
      The ages and sons of Adam, Seth, Enos, Cainan, Mahalaleel, and Jared are recorded; Enos and the people of God moved to a land of promise. In these years Satan gained great dominion over many people, and wars and bloodshed came through secret works for power. The line of Adam were preachers of righteousness who called all people to repent. Enoch was born when Jared was 162, and Enoch had a son, Methuselah, at 65.
  - range: 26-34
    heading: The Lord calls Enoch
    plain: |
      The Spirit of God came on Enoch as he traveled among the people, and a voice told him to prophesy and call them to repent, because the people had denied God and turned to murder. Enoch said he was only a young man, hated, and slow of speech. The Lord told him to go, promised that no man would pierce him and that he would be given words, and said, “walk with me.”
  - range: 35-47
    heading: Enoch the seer preaches
    plain: |
      The Lord told Enoch to anoint his eyes with clay and wash them. He saw the spirits God created and things not visible to the natural eye, and people said that the Lord had raised up a seer. He preached from the high places and the people were offended, but no one laid hands on him. When a man named Mahijah asked who he was, Enoch told of his vision and called the Lord his God and theirs, and said Adam is known, and a book of remembrance has been written among them.
  - range: 48-63
    heading: What God taught Adam
    plain: |
      Because Adam fell, people are mortal and have to deal with misery; Satan tempts them and they are shut out from God’s presence. God told Adam that all must repent and be baptized in the name of His Only Begotten Son, Jesus Christ, and receive the Holy Ghost. When Adam asked why, the Lord said that He had forgiven Adam’s transgression, and that children are whole from the foundation of the world. Children grow, sin conceives in their hearts, and they know good from evil. Parents are to teach them that they must repent, be born again of water and the Spirit, and be cleansed by the blood of the Only Begotten. All things bear record of God.
  - range: 64-68
    heading: Adam is baptized
    plain: |
      Adam cried to the Lord, was caught away by the Spirit, laid under the water, and brought up out of it. The Spirit of God came on him and he was born of the Spirit. A voice told him he was baptized with fire and the Holy Ghost and was after the order of him without beginning of days or end of years. “Thou art one in me, a son of God; and thus may all become my sons.”

notes:
  - ref: 5
    phrase: book of remembrance
    kind: history
    title: A book of remembrance and a language to write it in
    body: |
      The book of remembrance is the Book of Moses’ account of where scripture began: with Adam and his descendants, “as many as called upon God,” who wrote “by the spirit of inspiration” ([[Moses 6:5]]). The records did several things at once. They held revelation. They were the means of teaching Adam’s posterity to read and write, in what verse 6 calls “a language which was pure and undefiled.” And they kept the family’s genealogy, “the book of the generations of Adam” ([[Moses 6:8]]). A possible fourth use, as a record of priesthood authority, is taken up in the note on [[Moses 6:7]].

      For the genealogy as Genesis has it, and Enoch’s later appeal to the book, see the note on [[Gen. 5:1]]. Malachi also speaks of a book of remembrance; see the note on [[Mal. 3:16]].
    sources: [schade-bowen-moses-6, lds-scriptures]
  - ref: 7
    phrase: this same Priesthood
    kind: scripture
    title: The priesthood in the beginning and the end
    body: |
      Verse 7 says that the priesthood known to Adam’s family is the one that will exist at the end of the world. It is an everlasting authority, available to Adam, Eve, and their righteous posterity with its ordinances, and not a later institution. The revelation on the priesthood says the same: it “continueth in the church of God in all generations, and is without beginning of days or end of years” ([[D&C 84:17]]). The same words close this chapter, when Adam is told he is “after the order of him who was without beginning of days or end of years” ([[Moses 6:67]]).

      The verse also explains the records around it. The book of remembrance and the genealogy have been read as measures taken because of this prophecy, and the book of generations may have been used to record the priesthood line of authority. That is a proposal about how verses 5–8 fit together; the text does not say what the genealogy was for.
    sources: [scripture-helps-gen-5, lds-scriptures, schade-bowen-moses-6]
  - ref: 15
    phrase: Satan had great dominion among men
    kind: history
    title: Satan’s dominion and the first oaths
    body: |
      Verse 15 gives the cause of the violence that fills these generations: Satan’s dominion over people’s hearts. The result was “wars and bloodshed” and a man’s hand “against his own brother, in administering death, because of secret works, seeking for power.” The secret works have a precedent in the chapter before, where Satan swears Cain to silence and “all these things were done in secret” ([[Moses 5:29–30]]). The Lord’s later charge to Enoch that the people “have foresworn themselves” ([[Moses 6:29]]) may point the same way: perhaps they had broken oaths and covenants with the Lord in favor of oaths and covenants with Satan, “following the precedent that Cain established.” The text does not say so.

      The Lord did not leave the faithful defenseless: He called and commissioned preachers of righteousness ([[Moses 6:23]]). Enoch is one of them.
    sources: [schade-bowen-moses-6, lds-scriptures]
  - ref: 31
    phrase: slow of speech
    kind: scripture
    title: Enoch, a lad slow of speech
    body: |
      Enoch answers his call as Moses answered his: he is unfit to speak. Moses said, “I am slow of speech, and of a slow tongue” ([[Ex. 4:10]]); Enoch said he was “but a lad,” hated, and “slow of speech.” In each case the Lord’s reply is to supply what is lacking. Enoch is told, “Open thy mouth, and it shall be filled, and I will give thee utterance” ([[Moses 6:32]]).

      The Lord’s promise has two parts: words and protection. “No man shall pierce thee” (verse 32) is kept in verse 39, when “no man laid hands on him.” The promise of words was fresh in the young Church. In October 1830, the month before Joseph Smith began receiving this chapter, Ezra Thayre and Northrop Sweet were told, “Open your mouths and they shall be filled” ([[D&C 33:8]]), and Enoch has been proposed as the model, for them and for the elders of the Church, of how that is done.
    sources: [schade-bowen-moses-6, lds-scriptures]
  - ref: 36
    phrase: A seer hath the Lord raised up
    kind: history
    title: A seer hath the Lord raised up
    body: |
      Enoch becomes a seer, and the people know him by the title. After he anoints his eyes with clay and washes them, he sees “the spirits that God had created” and “things which were not visible to the natural eye”; the Lord has blessed him with the gift of seership, and the saying goes abroad, “A seer hath the Lord raised up unto his people” ([[Moses 6:35–36]]). A seer is “a person authorized of God to see with spiritual eyes things that God has hidden from the world,” one who “knows the past, present, and future.”

      The people’s reaction is mixed. They call him “a wild man” and are “offended because of him” (verses 37–38), yet “no man laid hands on him; for fear came on all them that heard him; for he walked with God” (verse 39). The fear suggests that, for all the name-calling, the people could sense that he was a man of God. The phrase “walked with God” is explained in the note on [[Gen. 5:22]].
    sources: [gs-seer, scripture-helps-gen-5, schade-bowen-moses-6, lds-scriptures]
  - ref: 54
    phrase: atoned for original guilt
    kind: scripture
    title: Atoned for original guilt
    body: |
      The Lord’s answer to Adam’s question is that Adam is forgiven and his children do not carry his guilt. Adam asks why men must repent and be baptized, and the Lord says, “I have forgiven thee thy transgression in the Garden of Eden” ([[Moses 6:53]]). Hence the saying that “the sins of the parents cannot be answered upon the heads of the children, for they are whole from the foundation of the world” ([[Moses 6:54]]). This matches the second article of faith: “men will be punished for their own sins, and not for Adam’s transgression” ([[A of F 1:2]]).

      Yet children are “conceived in sin” (verse 55), which means they are born into a world of sin. They commit sin as they grow, “taste the bitter, that they may know to prize the good,” and need cleansing, because “no unclean thing can dwell” in God’s presence (verse 57). The Book of Mormon had already taught that little children are blessed because “the blood of Christ atoneth for their sins” ([[Mosiah 3:16]]), and Joseph Smith had received those teachings before he dictated this verse.

      For the Fall itself see [[Moses 4:5–31]].
    sources: [scripture-helps-gen-5, schade-bowen-moses-6, lds-scriptures]
  - ref: 57
    phrase: Man of Holiness
    kind: christ
    title: Man of Holiness
    body: |
      “Man of Holiness” is the Father’s name “in the language of Adam,” and the Only Begotten’s name is “the Son of Man, even Jesus Christ” ([[Moses 6:57]]). The Lord says the same to Enoch: “Man of Holiness is my name” ([[Moses 7:35]]). So “Son of Man,” by which Jesus is often called and calls Himself in the New Testament, means Son of the Man of Holiness. The title does not make Him less than the Son of God. It is “a recognition of His divinity and holiness—He is the Son of Man of Holiness, God the Father.”

      The names come in a verse about repentance, and they explain its demand. “No unclean thing” can dwell in the presence of the Man of Holiness, and the verse has been used to teach that to partake of Christ “means to pursue holiness.”
    sources: [christofferson-living-bread, scripture-helps-gen-5, lds-scriptures]
  - ref: 59
    phrase: by water, and blood, and the spirit
    kind: symbol
    title: Water, blood, and the spirit
    body: |
      God explains rebirth through the elements of birth. When a person enters mortality, “water, and blood, and the spirit” come together to make “a living soul” ([[Moses 6:59]]). In the same way each must be “born again into the kingdom of heaven, of water, and of the Spirit, and be cleansed by blood, even the blood of mine Only Begotten.” Baptism and the gift of the Spirit lead a person to the Savior, “allowing them to be changed through His atoning blood.”

      Verse 60 assigns each element a task: “by the water ye keep the commandment; by the Spirit ye are justified, and by the blood ye are sanctified.” To be justified is to be declared righteous, acquitted in a legal sense; sanctification is the ongoing process of becoming, since the purpose of mortality “was to become.”
    sources: [scripture-helps-gen-5, schade-bowen-moses-6, lds-scriptures]
  - ref: 64
    phrase: carried down into the water
    kind: christ
    title: Adam baptized, and called a son of God
    body: |
      The Old Testament does not mention baptism; the Book of Moses says that Adam himself was baptized. He is “caught away by the Spirit of the Lord,” immersed, and brought up; he is “born of the Spirit” and “quickened in the inner man” ([[Moses 6:64–65]]). A voice from heaven declares, “Thou art baptized with fire, and with the Holy Ghost,” and calls him “after the order of him who was without beginning of days or end of years” ([[Moses 6:66–67]]).

      The last verse gives Adam a title: “thou art one in me, a son of God; and thus may all become my sons” ([[Moses 6:68]]). Adam was already “a literal spirit son of God created in His image”; now he is also a son because he was born again through Jesus Christ. The same is open to others. Every person on earth is God’s offspring, but to be called a child of God in this second sense “means much, much more.”

      Becoming a son of God was a theme of the revelations Joseph Smith was receiving in the same weeks. On November 4, 1830, the Lord told the newly baptized Orson Pratt that those who believe “might become the sons of God. Wherefore you are my son” ([[D&C 34:3]]), and by early December He told Joseph Smith and Sidney Rigdon that believers “may become the sons of God, even one in me” ([[D&C 35:2]]), words close to those of verse 68.
    sources: [scripture-helps-gen-5, andersen-peacemaker, schade-bowen-moses-6, lds-scriptures]

christ: |
  Enoch’s sermon is the gospel preached in the name of Jesus Christ long before His birth. God told Adam to be baptized “in the name of mine Only Begotten Son, who is full of grace and truth, which is Jesus Christ, the only name which shall be given under heaven, whereby salvation shall come unto the children of men” ([[Moses 6:52]]). The new birth of water and the Spirit comes with cleansing “by blood, even the blood of mine Only Begotten” ([[Moses 6:59]]), and “this is the plan of salvation unto all men, through the blood of mine Only Begotten, who shall come in the meridian of time” ([[Moses 6:62]]). He is “the Son of Man, even Jesus Christ, a righteous Judge” ([[Moses 6:57]]).

explore: |
  - **What Genesis says of the same generations.** [[Gen. 5:1–32]], and in particular [[Gen. 5:22]], the verse on Enoch’s walk with God.
  - **Enoch’s city and visions.** [[Moses 7]], where Enoch goes on preaching, Zion is established, and he foresees the coming of the Son of Man.
  - **The Fall and Adam’s first teaching.** [[Moses 5:4–15]] and [[Moses 4:5–31]], the Fall and Adam’s early teaching, the background to Adam’s question in [[Moses 6:53]].
  - **Baptism in the Book of Mormon.** [[2 Ne. 31:4–18]] and [[3 Ne. 11:23–38]] teach the same ordinance as Moses 6:52–66.

parallels:
  - ref: Gen. 5
    note: Genesis 5 gives the generations from Adam to Enoch (verses 1–21), which Moses 6:8–25 runs beside; Enoch’s call is not in Genesis.
    primary: true
  - ref: Mal. 3:16
    note: The book of remembrance of Moses 6:5 and 6:46 and the one Malachi names.
  - ref: 2 Ne. 31:4
    note: Baptism and the gift of the Holy Ghost, taught in the same terms as Moses 6:52.

