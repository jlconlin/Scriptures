chapter: 5
title: Adam and Eve’s Family, and Cain
tagline: Outside Eden, Adam and Eve hear the Lord’s voice, are taught by an angel what sacrifice stands for, and rejoice in the Fall, while Satan comes among their children, and Cain chooses him.
when: 'After Adam and Eve were driven from the garden ([[Moses 4:31]]). The chapter belongs to the translation “as revealed to Joseph Smith the Prophet, June 1830–February 1831.”'

setting: |
  Moses 5 is the Lord’s own account, in the first person (“after I, the Lord God, had driven them out”), of life outside the garden. Its first fifteen verses have no counterpart in Genesis. From verse 16, where Eve names Cain, it runs beside [[Gen. 4]], with much added, and it is the Genesis 4 notes that explain the shared story of Cain and Abel. These notes take up what Moses 5 adds.

  What it adds comes in a clear order. Adam and Eve are shut out of God’s presence but still hear His voice ([[Moses 5:4]]). They are commanded to offer the firstlings of their flocks, and an angel then says what the offering means ([[Moses 5:5–7]]). The Holy Ghost bears record of the Father and the Son, and Adam and Eve each give thanks for the Fall ([[Moses 5:9–11]]). Then the story turns: “Satan came among them” ([[Moses 5:13]]), and from verse 18 the chapter follows one son who “loved Satan more than God.”

  Genesis is silent on where sacrifice began and does not mention the devil; Moses 5 supplies both. To what Genesis tells of Cain’s line and Lamech it adds a covenant with Satan and a “secret combination” (verses 42–55), and it ends by saying the gospel was preached “from the beginning.” The chapter before it is the Fall ([[Moses 4]]); the next begins with Seth and Enoch ([[Moses 6]]).

thread: |
  The thread of the chapter is a gospel given first, and the contest over whether it will be believed. Before there is a murder there is a sermon: Adam and Eve are taught a commandment, an angel explains its meaning as “a similitude of the sacrifice of the Only Begotten,” the Holy Ghost testifies, and they “made all things known unto their sons and their daughters” (verse 12).

  Then comes the opposition. Satan arrives with a claim (“I am also a son of God”) and a command (“Believe it not”). The Lord answers with His own call to repent “by the Holy Ghost everywhere,” and the result is a division: some “believed in the Son,” and others did not. Cain stands in that division, and the long story of his offering, his oath, and his line carries on from verse 16 what verses 13–15 began.

  The end of the chapter returns to the beginning: the gospel is preached in the same three ways it had come to Adam and Eve in verses 4–9 ([[Moses 5:58]]).

sections:
  - range: 1-15
    heading: A family, a commandment, and a testimony
    plain: |
      After the Lord drove them out, Adam worked the ground and ate his bread by the sweat of his brow, and Eve labored beside him. They had sons and daughters, and the children began to spread out, farm, and keep flocks. Adam and Eve called on the Lord and heard His voice from the direction of the garden, though they could not see Him, since they were shut out from His presence.

      The Lord commanded them to worship Him and to offer the firstlings of their flocks, and Adam obeyed. After many days an angel asked why he offered sacrifices. Adam answered that he did not know, only that the Lord had commanded it. The angel said it was a likeness of the sacrifice of the Only Begotten, and that everything Adam did was to be done in the Son’s name. The Holy Ghost fell on Adam and testified of the Father and the Son. Adam blessed God, saying that through his transgression his eyes were opened, that he would have joy in this life, and that he would see God again in the flesh. Eve was glad and said that without the transgression they would never have had children, known good and evil, or known the joy of redemption and the eternal life God gives the obedient. They made all this known to their children.

      Then Satan came among them and said he was also a son of God, and told them, “Believe it not.” The children “believed it not,” as he had told them, and loved Satan more than God, and men began to be “carnal, sensual, and devilish.” The Lord called all by the Holy Ghost to repent, and decreed that those who believed in the Son and repented would be saved, and those who did not would be damned.
  - range: 16-31
    heading: Cain loves Satan more than God
    plain: |
      Eve bore Cain and said she had gotten a man from the Lord, so that he might not reject the Lord’s words. But Cain would not listen and said, “Who is the Lord that I should know him?” Abel, his brother, listened. Abel kept sheep and Cain farmed. Cain loved Satan more than God, and Satan told him to make an offering. Abel brought the firstlings and their fat, and the Lord accepted him and his offering, but not Cain’s, which pleased Satan. Cain was angry.

      The Lord asked why, and told Cain that if he did well he would be accepted, but that if he did not, sin lay at the door and Satan wanted him. He would be delivered to Satan’s desire unless he listened to the Lord’s commandments, and Cain was to rule over him. Cain would be the father of Satan’s lies, called Perdition, and a curse would come unless he repented. Cain stopped listening to the Lord or to Abel, who walked in holiness. Adam and Eve mourned for Cain and his brothers. Cain married one of his brothers’ daughters, and they loved Satan more than God. Satan had Cain swear an oath of secrecy, and promised to put Abel in his hands. Cain declared himself Mahan, “the master of this great secret, that I may murder and get gain.”
  - range: 32-41
    heading: The murder and the curse
    plain: |
      Cain killed Abel in the field and boasted that he was free and that the flocks were now his. The Lord asked where Abel was, and Cain said he did not know, and asked if he was his brother’s keeper. The Lord said Abel’s blood cried to Him from the ground, and that Cain was now cursed from the earth. The ground would not yield its strength to him, and he would be a fugitive and a vagabond.

      Cain said Satan tempted him and that his punishment was more than he could bear. He feared that whoever found him would kill him. The Lord promised sevenfold vengeance on anyone who killed him, and set a mark on Cain so that no one finding him would. Cain was shut out from the Lord’s presence and went with his wife and many of his brothers to the land of Nod, east of Eden.
  - range: 42-59
    heading: Cain’s line, Lamech, and the secret
    plain: |
      Cain’s son Enoch was born, and Cain built a city and named it for him. The line runs through Irad, Mahujael, and Methusael to Lamech, who took two wives, Adah and Zillah, whose children were the fathers of tent-dwellers and herders, of harp and organ players, and of metalworkers. Lamech told his wives he had slain a man and boasted of being avenged seventy and seven fold.

      The reason is given: Lamech had made a covenant with Satan after Cain’s manner and become Master Mahan. When Irad began to reveal the secret to the sons of Adam, Lamech killed him for the oath’s sake. There had been a secret combination from the days of Cain. The Lord cursed Lamech and all who covenanted with Satan, and their works spread among the sons of men. Lamech’s wives rebelled and made the secret known, and he was despised and driven out. The works of darkness prevailed. God cursed the earth, because people would not hear Him or believe on His Only Begotten Son. And so the gospel began to be preached from the beginning, by holy angels, by God’s own voice, and by the Holy Ghost, and all things were confirmed to Adam by an holy ordinance, with a decree that the gospel would be in the world to the end.

notes:
  - ref: 4
    phrase: they heard the voice of the Lord from the way toward the Garden of Eden
    kind: history
    title: Out of Eden, but still hearing the voice
    body: |
      Adam and Eve are shut out of God’s presence in verse 4, yet He still speaks to them: they “saw him not,” but they “heard the voice of the Lord.” Genesis says only that they were sent out and a guard set at the garden ([[Gen. 3:24]]).

      The 1835 Doctrine and Covenants drew the point from this passage: though “our first parents were driven out of the garden of Eden, and were even separated from the presence of God, by a vail, they still retained a knowledge of his existence, and that sufficiently to move them to call upon him.” The voice that answered them taught them: the commandments of verse 5 come by it, and they “were instructed how to worship so they could regain his presence.” Being “shut out” in verse 4 is a separation that worship is meant to end, and it is not a silence.
    sources: [jsp-dc-1835, schade-bowen-moses-5-family, lds-scriptures]
  - ref: 6
    phrase: I know not, save the Lord commanded me
    kind: history
    title: A commandment before an explanation
    body: |
      Adam keeps the command to offer firstlings before he knows what it means; the explanation comes “after many days.” Verse 5 says “Adam was obedient unto the commandments of the Lord,” and when the angel asks why he offers sacrifices, his whole answer is “I know not, save the Lord commanded me.”

      Genesis shows Cain and Abel bringing offerings and gives no commandment behind them; it “is silent on the origin of the practice of sacrifice.” Moses 5 supplies the commandment, and so “demonstrates that the law of sacrifice did not originate with Moses.” For what Abel’s offering meant, see the note on [[Gen. 4:4]].
    sources: [schade-bowen-moses-5-family, lds-scriptures]
  - ref: 7
    phrase: a similitude of the sacrifice of the Only Begotten of the Father
    kind: christ
    title: What the sacrifice stood for
    body: |
      The angel tells Adam that the offering of the firstlings is a “similitude,” a likeness, of the sacrifice of the Only Begotten. “The symbolism of sacrifice became sacred because it pointed forward toward an infinite sacrifice to be performed by the Son of God.”

      Elder McConkie taught that “all of the saints offered sacrifices in similitude of the sacrifice of the Lamb of God,” and that, “For a pastoral people whose lives depended on their flocks and herds, there could have been no better similitude than this.” The Book of Mormon gives sacrifice the same meaning: Amulek says the law is “every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God” ([[Alma 34:14]]).
    sources: [schade-bowen-moses-5-family, pgp-manual-moses-5-1-15, sc-knowhy-424, lds-scriptures]
  - ref: 9
    phrase: the Holy Ghost fell upon Adam
    kind: words
    title: The Holy Ghost bears record in the Son’s own words
    body: |
      The Holy Ghost’s witness in verse 9 is spoken in the first person of the Son: He “beareth record of the Father and the Son, saying: I am the Only Begotten of the Father.” The manuscripts of the translation word the line two ways. Old Testament Revision 1 reads “I am Jesus Christ from the beginning henceforth & forever,” and the printed “I am the Only Begotten of the Father” agrees with Old Testament Revision 2. In either wording the Spirit’s record is the Son’s own declaration, and the promise comes with it: “that as thou hast fallen thou mayest be redeemed, and all mankind, even as many as will.”

      The verse also says when: “in that day,” the day the angel explained the sacrifice. The 1835 Doctrine and Covenants drew that point from the passage: “no sooner was the plan of redemption revealed to man, and he began to call upon God, than the Holy Spirit was given, bearing record of the Father and Son.”
    sources: [jsp-ot1, jsp-dc-1835, schade-bowen-moses-5-family, lds-scriptures]
  - ref: 11
    phrase: Were it not for our transgression
    kind: scripture
    title: Eve’s gratitude
    body: |
      Eve names four things in verse 11 that would have been missing without the transgression: “seed,” knowing “good and evil,” “the joy of our redemption,” and “the eternal life which God giveth unto all the obedient.” Lehi later says as much in a line: “Adam fell that men might be; and men are, that they might have joy” ([[2 Ne. 2:25]]).

      The setting matters. She speaks after the angel has explained the sacrifice and the Holy Ghost has fallen on Adam: “As the Holy Ghost testified, Adam and Eve began to understand more perfectly what redemption was and the joy it brought them.”

      One reading sets her words beside Adam’s as two views of one plan, measured against God’s “work and my glory—to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]). Adam “seems to focus on the first part of Moses 1:39” when he says “again in the flesh I shall see God”; Eve, speaking of family, redemption, and eternal life, is “focusing on the second part.” Together their views “collectively constituted the plan in its entirety.” For the Fall itself, see the note on [[Gen. 3:5]].
    sources: [schade-bowen-moses-5-family, lds-scriptures]
  - ref: 13
    phrase: I am also a son of God
    kind: history
    title: Satan’s first words to the family
    body: |
      Satan’s opening words to Adam and Eve’s children are a claim to belong and an order to disbelieve: “I am also a son of God… Believe it not.” Genesis never mentions him in this story. Moses 5 gives “the existence of the devil, his temptations, and his attempting to lead Adam and Eve’s children away from God.”

      His command comes straight after verse 12, where Adam and Eve “made all things known unto their sons and their daughters,” and it is best read as aimed at that preaching: he speaks “referring to their parents’ teachings.” The children choose: “they believed it not, and they loved Satan more than God.” President Benson taught the pattern: “Whenever the God of Heaven establishes by revelation his design, Satan always comes among men to pervert the doctrine, saying, ‘Believe it not.’” The Lord’s answer follows in verse 14, a call to repent “by the Holy Ghost everywhere.”
    sources: [schade-bowen-moses-5-family, pgp-manual-moses-5-1-15, lds-scriptures]
  - ref: 40
    phrase: I the Lord set a mark upon Cain
    kind: history
    title: The curse and the mark are separate
    body: |
      The curse on Cain and the mark set on him are two things in Moses 5, and each has its own purpose. The curse has three parts, all in the text: the ground would not yield to him and he would be “a fugitive and a vagabond” ([[Moses 5:37]]), and he was “shut out from the presence of the Lord” ([[Moses 5:41]]). “These elements constitute the curse, and there really are no other components to it.” Before the murder the Lord had warned him of “a cursing which I will put upon thee, except thou repent” ([[Moses 5:25]]).

      The mark comes after the curse and “is separate from the curse.” It was set “lest any finding him should kill him,” so it protected him: “The mark was to remind people to leave judgment to the Lord.” What it was, the text does not say. “We should avoid speculating about the nature or appearance of the mark placed on Cain or that the curse applied to anyone other than him. The Church rejects and condemns racial and cultural prejudice in any form.” The Hebrew word, the later guesses about the mark, and the Church’s rejection of them are in the note on [[Gen. 4:15]].
    sources: [schade-bowen-moses-5, scripture-helps-gen-3-4, lds-scriptures]
  - ref: 51
    phrase: there was a secret combination
    kind: scripture
    title: Secret combinations from Cain’s day
    body: |
      Verse 51 names what Cain’s oath had started, a “secret combination,” and the Book of Mormon, which uses the same phrase, traces its own conspiracies back to him. Moses 5 has the pieces: an oath sworn to Satan (verse 29), Cain as “the master of this great secret, that I may murder and get gain” (verse 31), and Lamech murdering Irad “for the oath’s sake” (verse 50). Its own summary: “from the days of Cain, there was a secret combination, and their works were in the dark, and they knew every man his brother.” For Cain’s oath and Lamech, see the notes on [[Gen. 4:8]] and [[Gen. 4:23]].

      The Book of Mormon names Cain twice. The Jaredite oaths were “handed down even from Cain” ([[Ether 8:15]]), and the one who put the oaths into Gadianton’s heart was “that same being who did plot with Cain, that if he would murder his brother Abel it should not be known unto the world” ([[Hel. 6:27]]). Moroni’s warning carries the story’s imagery as well: a nation that upholds “secret combinations, to get power and gain” will be destroyed, because “the blood of his saints… shall always cry unto him from the ground” ([[Ether 8:22]]), as Abel’s blood “cries unto me from the ground” ([[Moses 5:35]]).
    sources: [sc-knowhy-585, lds-scriptures]
  - ref: 58
    phrase: by holy angels sent forth from the presence of God, and by his own voice, and by the gift of the Holy Ghost
    kind: scripture
    title: Three ways the gospel came
    body: |
      The three ways the gospel is said to be preached in verse 58 are the three ways it has already come to Adam and Eve in this chapter: “God gave the gospel to Adam and Eve by His own voice, through angels, and by the Holy Ghost.” Moses 5:4 gives the voice, verses 6–8 the angel, and verse 9 the Holy Ghost. The ending gathers up the beginning, and it says these means did not stop with the first family: “holy angels, the gift of the Holy Ghost, and ordinances would be a significant part of those efforts to lead his children back to him.”

      The next verse says “all things were confirmed unto Adam, by an holy ordinance.” In the English of Joseph Smith’s day, “confirmed” meant “made more firm; strengthened; or established.” The decree is that “the Gospel preached” should “be in the world, until the end thereof” ([[Moses 5:59]]). [The Plan of Salvation, Taught from the First Parents](/moses/themes/plan-from-the-beginning/)
    sources: [pgp-manual-moses-5-16-59, schade-bowen-moses-5, lds-scriptures]

christ: |
  The Only Begotten is named in verses 7, 9, and 57. An angel says the offering is “a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth” ([[Moses 5:7]]), and the Holy Ghost’s record of the Father and the Son carries the promise of redemption: “as thou hast fallen thou mayest be redeemed, and all mankind, even as many as will” ([[Moses 5:9]]). The law of sacrifice “symbolized the atoning sacrifice of Jesus Christ,” and “Adam and Eve rejoiced in Christ.”

  Adam was to do all that he did “in the name of the Son,” and to repent and call upon God in that name ([[Moses 5:8]]). At the end of the chapter He is “his Only Begotten Son, even him whom he declared should come in the meridian of time, who was prepared from before the foundation of the world” ([[Moses 5:57]]). The chapter’s division is over Him, between “as many as believed in the Son, and repented of their sins,” and “as many as believed not and repented not” ([[Moses 5:15]]).

explore: |
  - **Sacrifice in the Book of Mormon.** [[Alma 34:10–16]] has Amulek’s teaching in full, and in [[2 Ne. 2:6–7]] Lehi says the Messiah “offereth himself a sacrifice for sin.”
  - **The gospel from the beginning.** [[Moses 6]] carries the teaching on into the next generations.
  - **The chapter beside it.** The Gospel Library’s *Scripture Helps: Old Testament* chapter on Genesis 3–4 and Moses 4–5 has a section on Moses 5:9–11 and one on Cain’s offering and curse.

parallels:
  - ref: Gen. 4
    note: Moses 5:16–59 runs beside Genesis 4, with Satan, Cain’s oath, and Lamech’s covenant added. Moses 5:1–15 has no counterpart in Genesis.
    primary: true
  - ref: Alma 34:14
    note: Amulek says the law points to “that great and last sacrifice,” the meaning the angel gives in Moses 5:7.
  - ref: 2 Ne. 2:25
    note: “Adam fell that men might be; and men are, that they might have joy” stands beside Eve’s words in Moses 5:11.
  - ref: Ether 8:22
    note: Secret combinations “to get power and gain” echo Cain’s “that I may murder and get gain” (Moses 5:31).

