chapter: 7
title: Enoch’s Zion, and the God Who Weeps
tagline: Enoch preaches, his people become Zion and are taken up, and he sees God weep over the wicked, the Son of Man lifted up, and Zion’s return.
when: 'Inside the text, in Enoch’s day, before the Flood. The text of the chapter was received by Joseph Smith in about December 1830.'

setting: |
  Moses 7 continues Enoch’s speech from [[Moses 6]]. Genesis gives Enoch three verses ([[Gen. 5:22–24]]), and this chapter is the long account that stands in their place: Enoch’s vision on the mount Simeon, the city of Zion he builds, and a series of visions that run from his own day to the Millennium. Between Zion’s being taken up (verse 21) and the Lord’s promise of its return (verses 62–64), Enoch sees God weep over the rest of His children. Along the way he is shown the Son of Man coming in the flesh, lifted up on the cross, ascending to the Father, and coming again in the last days (verses 47, 55, 59, 65).

  Joseph Smith received the text of the chapter in about mid-December 1830, with Sidney Rigdon as his scribe. On December 30 the Lord told the two of them to stop translating until they had gone to Ohio ([[D&C 37:1]]). Enoch’s speech begins from what God taught Adam about repentance and baptism ([[Moses 6:52–68]]), and [[Moses 8]] takes up the days of Noah that Enoch sees here.

thread: |
  The chapter moves from a people who became Zion to a God who weeps for those who would not. Enoch’s people are “of one heart and one mind” and are taken up ([[Moses 7:18]], [[Moses 7:21]]). Then Enoch sees the rest of the earth, and the Lord answers his astonishment: He gave His children agency and commanded them to love one another and choose Him, and they “hate their own blood” ([[Moses 7:32–33]]).

  The weeping does not end the vision, and it does not end with judgment. Enoch weeps with God, is told “Lift up your heart, and be glad; and look,” and sees the Righteous lifted up and the Lamb slain from the foundation of the world ([[Moses 7:44–47]]). From that point the chapter looks forward: God’s covenant with Enoch about Noah’s seed, the Son of Man on the cross, and the day the earth rests, when Enoch’s Zion and a New Jerusalem meet ([[Moses 7:50–64]]). What turns Enoch’s sorrow to hope is the Atonement of Christ.

sections:
  - range: 1-4
    heading: Enoch on the mount Simeon
    plain: |
      Enoch tells the people that Adam taught these things, that many believed and became sons of God, and that many did not and are in torment. He begins to prophesy. A voice from heaven tells him to go up the mount Simeon, where the heavens open, he is clothed with glory, and he sees the Lord face to face. The Lord says He will show him the world for many generations.
  - range: 5-12
    heading: Shum, Canaan, and the call to repent
    plain: |
      Enoch sees the people of Shum and the people of Canaan, both living in tents. He prophesies that the people of Canaan will destroy the people of Shum and that the Lord will curse their land with heat and barrenness. A blackness comes on the children of Canaan and they are despised. The Lord shows him other lands and peoples and sends him to tell them to repent and be baptized in the name of the Father, the Son, and the Holy Ghost. Enoch calls all the people to repent except Canaan’s.
  - range: 13-21
    heading: The people of God become Zion
    plain: |
      Enoch has so much faith that at his word the earth trembles, mountains flee, rivers turn aside, and land rises out of the sea; enemies are afraid. The Lord dwells with His people, and they flourish. He calls them Zion because they are of one heart and one mind, righteous, and without poor among them. Enoch builds the City of Holiness, Zion. The Lord blesses Zion and curses the rest, and Zion is taken up into heaven.
  - range: 22-27
    heading: The residue of the people, and Satan’s chain
    plain: |
      Enoch sees the rest of Adam’s children, a mixture of all the seed of Adam except the seed of Cain, who were black and had no place among them. After Zion is taken up, he sees the nations and generations pass, and the power of Satan on the whole earth. A voice cries woe, and he sees Satan with a great chain that veils the earth with darkness; Satan laughs and his angels rejoice. Angels bear testimony of the Father and the Son, and many receive the Holy Ghost and are caught up into Zion.
  - range: 28-41
    heading: God weeps
    plain: |
      God looks on the rest of the people and weeps, and Enoch asks how God, who is holy and has Zion in His bosom, can weep. The Lord says the people are the work of His hands, that He gave them knowledge and agency and commanded them to love one another and choose Him, but they are without affection and hate their own blood. He will send the floods, shut them up in a prison, and the heavens weep because they will suffer. His Chosen one pleads and suffers for their sins, and they will be in torment until He returns to Him. Enoch is shown all their doings, weeps, and “all eternity shook.”
  - range: 42-53
    heading: Noah, the Righteous, and the covenant
    plain: |
      Enoch sees Noah and his family saved and the wicked swallowed by the flood. Enoch refuses to be comforted, but the Lord tells him to be glad and look. He asks when the blood of the Righteous will be shed, and the Lord answers, in the meridian of time. Enoch sees the Son of Man in the flesh and rejoices. The earth speaks, mourning as the mother of men, and Enoch weeps for her. In the name of the Only Begotten he asks that the floods never again cover the earth. The Lord covenants with him that a remnant of his seed will always be found, and calls blessed him through whose seed Messiah will come.
  - range: 54-61
    heading: The cross, and the last days
    plain: |
      Enoch asks when the earth will rest and sees the Son of Man lifted up on the cross; the heavens are veiled, the creations mourn, the rocks rent, and the saints rise. Spirits in prison come forth, while the rest are reserved to the judgment. Enoch sees Him ascend and asks Him to come again. The Lord says He will come in the last days, to fulfill His oath concerning Noah’s children. Before the earth rests, there will be darkness, shaking, and tribulation, but His people will be preserved.
  - range: 62-69
    heading: Zion returns
    plain: |
      The Lord will send righteousness from heaven and truth from the earth to testify of the Only Begotten, and they will sweep the earth as with a flood to gather the elect to a holy city, Zion, a New Jerusalem. Enoch and his city will meet them there, and they will embrace. The earth will rest a thousand years. Enoch sees the Son of Man come in the last days and receives a fulness of joy. Zion’s days were three hundred and sixty-five years, and God received it into His own bosom; hence the saying, “Zion is fled.”

notes:
  - ref: 8
    phrase: there was a blackness came upon all the children of Canaan
    kind: history
    title: Blackness on the children of Canaan
    body: |
      The verse puts the curse on the land and says that a “blackness” came on Canaan’s people; what that blackness was the text does not say, and the Church’s teaching is that its meaning “is unclear.” Little is known of this people. There is “no scriptural evidence to suggest that these people are related to Cain,” and the same holds for the righteous land of Cainan, for Noah’s grandson Canaan, and for the later Canaanites. The blackness “was not part of the Lord’s curse, which was directed at the land itself,” and though some have taken it for dark skin, “there is nothing in the text to justify this interpretation.”

      What can be shown is what the word could mean in Joseph Smith’s day. In 1828 Noah Webster’s dictionary gave *black* and *blackness* senses that included “darkness,” “destitute of light,” and “atrociously wicked.” The Book of Moses used the word of a lack of spiritual light: in the first manuscript of what is now [[Moses 1:15]], Moses asked Satan, “Where is thy glory, for it is blackness unto me?”, and *blackness* became *darkness* in later editions. On that evidence it has been argued that the word here “almost certainly means something other than skin-color,” and that the sense of wickedness “fits the context of Moses 7 much better,” since the verses around it speak of righteousness and wickedness. That is a reasoned reading, not a revealed one; the Church’s own statement stops at “unclear.”
    sources: [scripture-helps-moses-7, sc-knowhy-836, lds-scriptures]
  - ref: 22
    phrase: for the seed of Cain were black, and had not place among them
    kind: history
    title: “The seed of Cain were black”
    body: |
      Verse 22 says only that Cain’s seed “were black” and had no place among the rest of Adam’s children, and what “black” means here “is unclear.” The Book of Moses has already described Cain’s posterity as people whose “works were in the dark” and who “kept not the commandments of God” ([[Moses 5:51–52]]). Of Cain’s mark the Church’s teaching is plain: “There is no indication in the scriptures that Cain’s mark was passed on to his posterity. We should avoid speculating about the nature or appearance of the mark placed on Cain or that the curse applied to anyone other than him.”

      The idea that Cain’s mark was dark skin is not ancient: it “can be traced no earlier than to the Middle Ages.” In the Church’s past the curse of Cain “was often put forward as justification for the priesthood and temple restrictions,” and “today, the Church disavows the theories advanced in the past that black skin is a sign of divine disfavor or curse.” Genesis on the site treats Cain’s mark where the Genesis story is told ([[Gen. 4:15]]).
    sources: [scripture-helps-moses-7, sc-knowhy-836, gte-race-priesthood]
  - ref: 18
    phrase: because they were of one heart and one mind, and dwelt in righteousness; and there was no poor among them
    kind: scripture
    title: Zion defined by its people
    body: |
      The Lord names His people Zion for what they were, not for where they lived: of one heart and one mind, righteous, and with no poor among them. A later revelation gives the same kind of definition: “this is Zion—the pure in heart” ([[D&C 97:21]]). It was given on August 2, 1833, when the Saints “in Zion, Jackson County, Missouri,” were under severe persecution and had just been forced to sign an agreement to leave the county. There the Lord defined Zion “in terms beyond the narrow confines of geography.”

      The verse’s three marks have been taught as three requirements. Elder D. Todd Christofferson said that “Zion is Zion because of the character, attributes, and faithfulness of her citizens,” and that to establish it a people must become “unified in one heart and one mind,” become “a holy people,” and care for the poor “with such effectiveness that we eliminate poverty among us.” Joseph Smith used the verse’s words in October 1831, less than a year after he dictated them: “could we all come together with one heart and one mind in perfect faith the vail might as well be rent to day as next week or any other time.” The name the Lord gives the people here is given in the next verse to the city Enoch builds, and at the end of the chapter to the New Jerusalem ([[Moses 7:62–64]]).
    sources: [lds-scriptures, christofferson-come-to-zion, jsp-minutes-1831-10-25, schade-bowen-moses-7-zion]
  - ref: 21
    phrase: was taken up into heaven
    kind: words
    title: Zion “taken up into heaven”
    body: |
      Zion’s being taken up into heaven is the end of a sequence in which the Lord first came down to His people. He stood before Enoch on the mount Simeon and talked with him “face to face” ([[Moses 7:4]]); He “came and dwelt with his people” ([[Moses 7:16]]); His glory “was upon his people” ([[Moses 7:17]]). These appearances form a series that ends with Zion taken to God’s bosom. So when the city is taken up the Lord says, “Behold mine abode for ever” ([[Moses 7:21]]), and the last verse says that “God received it up into his own bosom” ([[Moses 7:69]]).

      The taking up itself is what Latter-day Saints call translation. Translated beings are “persons who are changed so that they do not experience pain or death until their resurrection to immortality.” The Lord later spoke of the event in the first person: “I am the same which have taken the Zion of Enoch into mine own bosom” ([[D&C 38:4]]).
    sources: [schade-bowen-moses-7-zion, gs-translated-beings, lds-scriptures]
  - ref: 28
    phrase: he wept
    kind: prophets
    title: Enoch’s astonishment that God weeps
    body: |
      Enoch is astonished that God weeps because, as he sees it, God lacks nothing. His speech lists what God has: He is holy and eternal, His creations cannot be numbered, He is just, merciful and kind, and Zion is in His bosom ([[Moses 7:29–31]]). Elder Jeffrey R. Holland called this a “single, riveting scene” that “does more to teach the true nature of God than any theological treatise could ever convey,” and set beside it the Book of Mormon’s allegory of the olive tree, where the Lord of the vineyard weeps and asks, “What could I have done more for my vineyard?” ([[Jacob 5:41]]).

      The Lord’s answer turns on the one thing missing from Enoch’s list. “For Enoch, God had and was everything”; what was at issue was “what he did not have: the love and obedience of his children.”
    sources: [holland-grandeur-of-god, schade-bowen-moses-7-zion, lds-scriptures]
  - ref: 33
    phrase: they should love one another, and that they should choose me, their Father
    kind: scripture
    title: Why God weeps
    body: |
      The Lord’s answer names what He gave His children, what He asked of them, and what they chose. He gave them knowledge and, “in the Garden of Eden,” their agency ([[Moses 7:32]]). He commanded them to love one another and to choose Him, their Father, but they “are without affection, and they hate their own blood” ([[Moses 7:33]]). What follows is theirs by that choice, “misery shall be their doom,” and so the Lord asks, “wherefore should not the heavens weep, seeing these shall suffer?” ([[Moses 7:37]]).

      The two things asked are what Jesus later called the two great commandments, to love God and to love one’s neighbor. Elder Marion D. Hanks said that God “asked of his children only that they should love each other and choose him, their Father,” and that “when God foresaw the suffering that would inevitably follow this self-willed, rebellious course of sin, he wept. That, he told Enoch, was what he had to cry about.” The weeping is bound up with the agency God gave: for all His power, “the one thing he would not do (and will not do) was compel his children to righteousness and obedience.”
    sources: [hanks-willing-to-receive, schade-bowen-moses-7-zion, lds-scriptures]
  - ref: 39
    phrase: that which I have chosen hath plead before my face
    kind: scripture
    title: The prison prepared for them
    body: |
      The prison of verse 38 is the spirit prison, and verse 39 gives those shut up in it a Redeemer and a term: they are in torment “until that day,” the day the Chosen returns to the Father ([[Moses 7:39]]). “That which I have chosen” is Jesus Christ, the “Beloved and Chosen from the beginning” ([[Moses 4:2]]), who had already pled before the Father and who suffers for their sins. With these words the Lord showed Enoch “that the doctrine of the salvation of the dead constituted a part of the everlasting gospel.”

      Enoch sees the promise kept later in the same vision. After the Son of Man is lifted up, “as many of the spirits as were in prison came forth, and stood on the right hand of God” ([[Moses 7:57]]). Peter says that Christ “preached unto the spirits in prison” who had been disobedient “in the days of Noah” ([[1 Pet. 3:18–20]]), and President Joseph F. Smith, pondering those verses, was shown how it was done: from among the righteous the Lord “organized his forces and appointed messengers,” and so the gospel was “preached to the dead” ([[D&C 138:28–31]]).
    sources: [scripture-helps-moses-7, schade-bowen-moses-7-zion, schade-bowen-moses-7, lds-scriptures]
  - ref: 41
    phrase: his heart swelled wide as eternity
    kind: structure
    title: From weeping to joy
    body: |
      Enoch’s weeping runs through the middle of the chapter, and it is where he comes to see as God sees. He begins by asking how God can weep; then he looks on the people’s wickedness and misery and weeps himself, and “his heart swelled wide as eternity” ([[Moses 7:41]]). He “had bitterness of soul” and says he “will refuse to be comforted” ([[Moses 7:44]]). In coming to fathom human sin, God’s love, and God’s concern for those who suffer, “he acquired something of God’s own experience and perspective.”

      The comfort comes in verses 44–47. The Lord tells him, “Lift up your heart, and be glad; and look,” and Enoch sees the day of the Son of Man, “and his soul rejoiced” ([[Moses 7:47]]). The answer to his sorrow is the offering of the Righteous, through which “all they that mourn may be sanctified and have eternal life” ([[Moses 7:45]]). From there Enoch moves from weeping to rejoicing, and at the end he “received a fulness of joy” ([[Moses 7:67]]).
    sources: [schade-bowen-moses-7-zion, schade-bowen-moses-7, lds-scriptures]
  - ref: 47
    phrase: the Lamb is slain from the foundation of the world
    kind: christ
    title: The Lamb slain before the world began
    body: |
      “Slain from the foundation of the world” speaks of a sacrifice still far in Enoch’s future as already in force, which is why he can rejoice over it. He has just asked when “the blood of the Righteous” will be shed and been told, “in the meridian of time” ([[Moses 7:45–46]]). Then he sees that day and rejoices that the Righteous “is lifted up,” an idiom for crucifixion, and that the Lamb “is slain” ([[Moses 7:47]]). It can seem strange to rejoice at this, but through these things Enoch “came to understand the glorious reality of what the Savior’s atoning sacrifice would mean for himself, for Zion, and for all people.”

      Joseph Smith summed up what Enoch was shown in the same terms. Quoting Enoch’s prophecy in 1835, he wrote that “God clearly manifested to Enoch, the redemption which he prepared, by offering the Messiah as a Lamb slain from before the foundation of the world.” The offering was settled before the earth was: in the premortal Council Jehovah “was chosen to perform the atoning sacrifice for the sins of the world.” The Book of Mormon shows what that meant for those who lived before He came. King Benjamin’s people were taught to believe in Christ so that they “might receive remission of their sins, and rejoice with exceedingly great joy, even as though he had already come among them” ([[Mosiah 3:13]]).
    sources: [schade-bowen-moses-7, jsp-letter-elders-1835, scripture-helps-moses-7, lds-scriptures]
  - ref: 48
    phrase: the mother of men
    kind: symbol
    title: The earth as the mother of men
    body: |
      The earth speaks as a mother grieved by her children, and what she asks for (cleansing, sanctifying, and rest) is what the rest of the vision goes on to promise. She is pained and weary “because of the wickedness of my children” and asks, “When will my Creator sanctify me?” ([[Moses 7:48]]). The title fits the account of the first man, taken from the ground ([[Gen. 2:5–7]]), and “the earth is the habitation of God’s children and will become a future habitation for God and his glorified children.” Her questions are answered in what follows: “(1) the earth will be cleansed via the Flood; (2) the earth will be sanctified at the Lord’s second coming; and (3) righteousness will abide upon the earth for a season (the Millennium).”

      The sanctifying is tied to the Atonement: before he was shown the earth’s healing, “Enoch had to understand that this, too, came through the atonement of Jesus Christ.” Enoch then asks whether the earth will rest “when the Son of Man cometh in the flesh” ([[Moses 7:54]]), and the answer he is given at last is that “for the space of a thousand years the earth shall rest” ([[Moses 7:64]]).
    sources: [schade-bowen-moses-7, lds-scriptures]
  - ref: 51
    phrase: he covenanted with Enoch, and sware unto him with an oath
    kind: scripture
    title: The covenant first made with Enoch
    body: |
      The promise that a flood will never again cover the earth, which Genesis gives to Noah with the rainbow as its token ([[Gen. 9:11–17]]), was first sworn to Enoch, and it promised more than that. Enoch asks “in the name of thine Only Begotten, even Jesus Christ” ([[Moses 7:50]]). The Lord swears to stay the floods and to call on the children of Noah, and decrees that a remnant of his seed “should always be found among all nations, while the earth should stand” ([[Moses 7:52]]).

      Joseph Smith’s translation of Genesis 9 has God say as much to Noah: “I will establish my covenant with you, which I made unto your father Enoch, concerning your seed after you.” It also says what the rainbow is to bring to mind: “the everlasting covenant, which I made unto thy father Enoch; that, when men should keep all my commandments, Zion should again come on the earth, the city of Enoch which I have caught up unto myself.” So the oath of verse 51 reaches to the end of the chapter, where the Lord says He will come in the last days “to fulfil the oath which I have made unto you concerning the children of Noah” ([[Moses 7:60]]), and Enoch and his city come to meet the New Jerusalem ([[Moses 7:63]]).
    sources: [jst-gen-9, lds-scriptures]
  - ref: 53
    phrase: I am Messiah, the King of Zion, the Rock of Heaven
    kind: christ
    title: Messiah, King of Zion, Rock of Heaven
    body: |
      The three titles of verse 53 say what the Son of Man will be for Zion: the Anointed One who comes through Enoch’s line, the King who reigns in the Millennium, and the Rock on which His people are safe. *Messiah* means “anointed one,” a term used of priests and kings, and with it the Lord implicitly promises to come into the world through the seed of Enoch and Noah. “King of Zion” is found nowhere in the Old Testament. Elder D. Todd Christofferson joined it to the end of this chapter: the scriptures prophesy of a New Jerusalem where Christ will reign as King of Zion when “for the space of a thousand years the earth shall rest” ([[Moses 7:64]]).

      “Rock of Heaven” is found only in Moses 7, but it has a near relative in Isaiah: “in the Lord JEHOVAH is everlasting strength” ([[Isa. 26:4]]), where the Hebrew behind “everlasting strength” is more literally “Rock of Ages” or “Rock of Eternity.” Here the Rock is “broad as eternity,” and whoever climbs up by Him “shall never fall” ([[Moses 7:53]]): Enoch and Zion “found their protection in the Lord, the King of Zion, the Rock of Heaven.”
    sources: [schade-bowen-moses-7, christofferson-come-to-zion, scripture-helps-moses-7, lds-scriptures]
  - ref: 62
    phrase: righteousness and truth will I cause to sweep the earth as with a flood
    kind: prophets
    title: Righteousness “as with a flood”
    body: |
      Joseph Smith and later prophets read the flood of verse 62 as the Restoration and the gathering. The floods earlier in the chapter are judgment (verses 34, 38, 43); this one “will bring salvation.” Quoting the verse to the elders of the Church in 1835, Joseph Smith asked “how righteousness and truth are agoing to sweep the earth as with a flood?” and answered: “Men and angels are to be co-workers in bringing to pass this great work: and a Zion is to be prepared; even a New Jerusalem, for the elect that are to be gathered from the four quarters of the earth.”

      President Ezra Taft Benson saw the first promise of the verse, righteousness from heaven and truth from the earth, already kept: “We have seen the marvelous fulfillment of that prophecy in our generation. The Book of Mormon has come forth out of the earth, filled with truth,” and from heaven “the Father Himself appeared with His Son to the Prophet Joseph Smith.”
    sources: [jsp-letter-elders-1835, schade-bowen-moses-7, benson-gift-modern-revelation, lds-scriptures]

christ: |
  Enoch sees Christ at every turn. He is the one “that I have chosen,” who “hath plead before my face” and “suffereth for their sins” ([[Moses 7:39]]); the Righteous who is “lifted up,” the Lamb “slain from the foundation of the world” ([[Moses 7:47]]); Messiah, King of Zion, and Rock of Heaven ([[Moses 7:53]]); and the Son of Man “lifted up on the cross” while the heavens are veiled and the rocks rent ([[Moses 7:55–56]]). Enoch asks for mercy “in the name of thine Only Begotten, even Jesus Christ” ([[Moses 7:50]]), and the Lord promises to come again in the last days, when the earth will rest ([[Moses 7:60–61]]). The Lord’s own words in the Doctrine and Covenants join the two: “I am Christ… by the virtue of the blood which I have spilt, have I pleaded before the Father for them” ([[D&C 38:4]]).

explore: |
  - **Enoch in Genesis and in Moses 6.** [[Gen. 5:22–24]] and [[Moses 6:26–68]], where Enoch is called and preaches what God taught Adam.
  - **Zion in the revelations.** [[D&C 97:21]] and [[D&C 38:4]].
  - **Zion and the nature of God in general conference.** D. Todd Christofferson, “Come to Zion” (October 2008), on what building Zion requires, and Jeffrey R. Holland, “The Grandeur of God” (October 2003).
  - **After the weeping.** [[Moses 8]], where the days of Noah that Enoch saw begin.

parallels:
  - ref: Gen. 5
    note: Genesis 5:22–24 gives three verses to Enoch, where Moses 6:26–7:69 gives his call, his preaching, Zion, and his visions.
    primary: true
  - ref: Gen. 9
    note: The covenant with Noah and the rainbow, which the Joseph Smith Translation of Genesis 9 says was first made with Enoch (Moses 7:50–52).
  - ref: D&C 38:4
    note: The Lord’s statement that He took the Zion of Enoch into His own bosom.

