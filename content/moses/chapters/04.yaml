chapter: 4
title: How Satan Became the Devil
tagline: Before the serpent speaks in Eden, God tells Moses where the serpent’s master came from, how he fell, and what he was after; then the Fall unfolds, ending with God’s words that cannot return void.
when: 'God’s words to Moses on the mount ([[Moses 1:1]]); received by Joseph Smith between June and October 1830.'

setting: |
  Moses 4 is part of the words God spoke to Moses “at a time when Moses was caught up into an exceedingly high mountain” ([[Moses 1:1]]), so the voice throughout is the Lord’s own: “I, the Lord God.” It follows the Creation ([[Moses 2]]) and the garden ([[Moses 3]]) and carries the story into the Fall.

  The chapter has two parts. Verses 5–31 tell the story Genesis tells in chapter 3: the serpent, the fruit, the questions, the sentences, the clothing, and the exile. The site’s notes on [[Gen. 3]] treat that story at length, and this chapter links to them rather than repeating them. Verses 1–4 have no Genesis counterpart: “These are verses that are missing from the Genesis account.” They answer a question Genesis leaves open, since in Genesis the serpent “comes out of nowhere.”

  The chapter was received in 1830, around the time of the September 1830 revelation that tells of the same rebellion ([[D&C 29:36]]).

thread: |
  Moses 4 tells the Fall as the work of a liar, and then shows God answering with questions and a promise.

  Verses 1–4 give the liar’s history. He came before God and offered to redeem everyone, “surely I will do it,” and wanted God’s honor in return. He rebelled, was cast down, and became “the devil, the father of all lies.” The rest of the chapter shows him at that work: he speaks through the serpent, seeks to beguile Eve “for he knew not the mind of God,” and tells her, “Ye shall not surely die” (verse 10), the opposite of what God had said (verse 17).

  God meets the Fall first with questions (“Where goest thou?”, “What is this thing which thou hast done?”), then with a sentence in which the word *cursed* falls on the serpent and the ground (verses 20, 23), a promise that the woman’s seed will bruise the serpent’s head (verse 21), a name for Eve (verse 26), and coats of skins made by God (verse 27). He speaks to “mine Only Begotten” (verse 28) and drives the man out with a guard set “to keep the way of the tree of life” (verse 31). Between the sentence and the exile He says that His words “cannot return void” (verse 30). The chapter ends with a charge to Moses to show these words only to those who believe.

sections:
  - range: 1-4
    heading: Satan’s rebellion
    plain: |
      The Lord tells Moses that the Satan he had commanded in the name of the Only Begotten was there from the beginning. He came before the Lord and said, “Here I am, send me. I will be your son, and I will redeem all mankind, so that not one soul is lost. I will certainly do it. Give me your honor.” But the Lord’s Beloved Son, chosen from the beginning, said, “Father, your will be done, and the glory be yours forever.” Because Satan rebelled and sought to destroy the agency God had given people, and to have God’s own power, the Lord cast him down by the power of the Only Begotten. He became Satan and the devil, the father of all lies, who deceives and blinds people and leads captive those who will not listen to the Lord.
  - range: 5-13
    heading: The serpent and the woman
    plain: |
      The serpent was more clever than any beast of the field. Satan, who had drawn away many after him, put it into the serpent’s heart and sought to beguile Eve; he did not know the mind of God, and so he sought to destroy the world. He spoke through the serpent: “Did God say you could not eat of every tree of the garden?” The woman said they could eat the fruit of the trees, but of the tree in the middle God had said, “Do not eat it or touch it, or you will die.” The serpent said, “You will not surely die. God knows that when you eat, your eyes will be opened and you will be as gods, knowing good and evil.” The woman saw that the tree was good for food, pleasing to the eyes, and desirable to make one wise. She ate and gave to her husband with her, and he ate. Their eyes were opened, they knew they were naked, and they sewed fig leaves into aprons.
  - range: 14-19
    heading: The Lord God calls
    plain: |
      As they walked in the garden in the cool of the day, they heard the voice of the Lord God, and Adam and his wife hid among the trees. The Lord called, “Where are you going?” Adam said, “I heard your voice and was afraid because I was naked, so I hid.” The Lord asked, “Who told you that you were naked? Have you eaten of the tree I commanded you not to eat from, saying you would surely die?” Adam answered, “The woman you gave me, and commanded to remain with me, gave me the fruit and I ate.” The Lord asked the woman, “What have you done?” She said, “The serpent beguiled me, and I ate.”
  - range: 20-25
    heading: The Lord’s words to the serpent, the woman, and Adam
    plain: |
      To the serpent the Lord said that he would be cursed above all cattle and beasts, would go on his belly and eat dust, and that there would be enmity between his seed and the woman’s seed; the woman’s seed would bruise the serpent’s head, and the serpent would bruise the seed’s heel. To the woman He said He would greatly multiply her sorrow and her conception; in sorrow she would bring forth children, her desire would be to her husband, and he would rule over her. To Adam He said that because he listened to his wife and ate, the ground was cursed for his sake; in sorrow he would eat of it all his days, it would bring thorns and thistles, and by the sweat of his face he would eat bread until he returned to the ground from which he was taken.
  - range: 26-32
    heading: Eve, the coats of skins, and the way out
    plain: |
      Adam named his wife Eve, because she was the mother of all living; the Lord had called her the first of all women, who are many. The Lord made coats of skins for Adam and his wife and clothed them. He told His Only Begotten that the man had become as one of them, knowing good and evil, and that lest he eat of the tree of life and live forever, He would send him out of Eden to till the ground. God’s words cannot return void; they must be fulfilled. So He drove out the man and placed cherubim and a flaming sword at the east of Eden to keep the way of the tree of life. A closing note says these are the words spoken to Moses, that they are true, and that he should show them to no one until the Lord commands, except to those who believe.

notes:
  - ref: 1
    phrase: whom thou hast commanded in the name of mine Only Begotten
    kind: history
    title: Why the chapter begins with Moses’ own encounter
    body: |
      The chapter opens by pointing back to Moses’ own meeting with Satan in chapter 1, where the adversary had posed as the Only Begotten (see the note on [[Moses 1:19]]). Now the Lord tells Moses who that adversary had been “from the beginning,” and the first thing He reports of him is the offer, “I will be thy son.”
    sources: [schade-bowen-council, lds-scriptures]
  - ref: 1
    phrase: Behold, here am I, send me, I will be thy son
    kind: christ
    title: Send me, and thy will be done
    body: |
      Moses 4 sets Satan’s offer beside the Beloved Son’s answer, and the two point in opposite directions.

      Abraham’s vision of the same scene has the Lord ask, “Whom shall I send?” and two answer, “Here am I, send me” ([[Abr. 3:27]]). Abraham stops there; Moses 4 continues. Satan’s words are about himself: he will be the son, he will redeem all, “surely I will do it,” and “give me thine honor.” His response “focuses inordinately on the man himself, seeking to draw the attention of those present.” The Lord’s own telling of it in [[D&C 29:36]] has him say, “Give me thine honor, which is my power.”

      Such a response “stands in stark contrast to the answer of Jesus Christ”: “Father, thy will be done, and the glory be thine forever.” The Son asks for nothing. On what the council was deciding, and what Satan’s offer amounted to, see the note on [[Moses 4:3]].
    sources: [sc-knowhy-671, lds-scriptures]
  - ref: 3
    phrase: sought to destroy the agency of man
    kind: prophets
    title: What destroying agency meant
    body: |
      The verse says what Satan sought and not how he meant to do it.

      His offer in verse 1 was made in rebellion: he “proposed an alternative to the Father’s already established plan.” How he would have carried it out the text leaves unsaid: “these verses of scripture do not clearly state how Satan proposed to carry out this lie.” J. Reuben Clark named two possibilities, “Either the compulsion of … man, or else saving men in sin,” and doubted both: “I question whether the intelligence of man can be compelled. Certainly men cannot be saved in sin.” So the offer to lose not one soul was never a workable rival to the Father’s plan: “What Satan proposed was a lie. It would not have worked.”

      Nor had a rival been invited. The Father “did not ask for volunteers to invent and present different and competing plans of salvation, as some have assumed.”
    sources: [scripture-helps-gen-3-4, mathews-satans-rebellion]
  - ref: 4
    phrase: And he became Satan, yea, even the devil
    kind: scripture
    title: From Lucifer to Satan
    body: |
      The verse says Satan “became” what he is called; a revelation of February 1832 gives his earlier name: “he was Lucifer, a son of the morning,” who “was called Perdition, for the heavens wept over him” ([[D&C 76:25–27]]). What he became was Satan, a Hebrew word meaning “adversary.” He was not cheated of his place: he fell “because of his rebellion against God and the choices he himself had made.” Joseph Fielding Smith taught that “the adversary knew exactly what he was doing and he became perdition.” Isaiah’s taunt over the fallen king of Babylon is read as a comparison that describes this fall; for that reading and for the name Lucifer, see the note on [[Isa. 14:12]].
    sources: [schade-bowen-council, lds-scriptures]
  - ref: 6
    phrase: he knew not the mind of God
    kind: prophets
    title: Two ways to read ‘knew not the mind of God’
    body: |
      “Knew not the mind of God” can be read as Satan’s ignorance of the plan or as his refusal of it, and Latter-day Saint sources offer both.

      On the first reading the phrase “could mean that the adversary simply did not understand the plan of God and that he was unwittingly destroying himself and defeating his own diabolical designs by tempting Adam and Eve to partake of the fruit.” James E. Talmage, quoting this verse, taught that Satan’s “diabolical effort, far from being the initiatory step toward destruction, contributed to the plan of man’s eternal progression.”

      On the second, the phrase says that “the adversary does not see as God sees, know as God knows, or desire what God desires”: he need not have misunderstood the plan, and may have chosen to reject it. For who the serpent was, see the note on [[Gen. 3:1]].
    sources: [pgp-manual-moses-4, schade-bowen-fall]
  - ref: 18
    phrase: commandedst that she should remain with me
    kind: scripture
    title: Adam and the command to remain with Eve
    body: |
      Moses 4:18 has Adam say that God had commanded Eve to remain with him, which Genesis does not say.

      The added words have been read as Adam’s reason for eating: “Adam concluded that God’s command to remain with his wife (see Moses 4:18) was more important than His command to abstain from the fruit,” and so, in Lehi’s words, “Adam fell that men might be” ([[2 Ne. 2:25]]). On this reading “the emphasis on God’s commandment that Eve remain with him accentuates why Adam chose his wife over refraining from partaking of the fruit.” On whether his answer and Eve’s shift the blame or explain their choices, see the note on [[Gen. 3:13]].
    sources: [christensen-choice-mortality, schade-bowen-fruit]
  - ref: 30
    phrase: my words cannot return void
    kind: scripture
    title: Words that cannot return void
    body: |
      God says that what He has spoken must be fulfilled.

      The words that cannot return void are the ones just spoken: the sentence on Adam (verses 23–25) and the exile (verse 29). “When the command was transgressed, God let the consequences follow.” The same reading of verses 30–31 does not stop at the consequences: “this was not the end; it was a beginning, and redemption would come upon all who would be affected by the partaking of the fruit.”
    sources: [schade-bowen-fall]

christ: |
  The chapter names “mine Only Begotten” three times (verses 1, 3, 28). Satan says, “I will be thy son”; the Son, “Beloved and Chosen from the beginning,” answers, “thy will be done, and the glory be thine forever” (verse 2). By His power Satan is cast down (verse 3), and the Father speaks to Him about Adam and Eve in verse 28.

  Verse 21 is read as a promise of the adversary’s defeat: “The seed of the woman refers to Jesus Christ, who was a descendant of Eve and Adam,” and He will bruise Satan’s head while Satan is able only to bruise His heel. For the seed of the woman see the note on [[Gen. 3:15]]; for the first sacrifice, which an angel tells Adam is “a similitude of the sacrifice of the Only Begotten of the Father,” see [[Moses 5:7]].

