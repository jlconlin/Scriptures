chapter: 8
title: Noah’s Day, and the Gospel He Preached
tagline: Methuselah’s line carries the covenant to Noah, who is ordained, preaches Christ’s gospel to a people who seek his life, and hears the Lord’s decree of the Flood.
when: 'Inside the text, from the end of Enoch’s life to the eve of the Flood. The chapter is dated February 1831.'

setting: |
  Moses 8 is the last chapter of the book, and it is a bridge. After Enoch and his city are taken up, it traces the line through Methuselah and Lamech to Noah, and then follows Noah’s ministry to the moment the Lord decrees the Flood. It “links the narratives of Enoch and Noah in ways absent from the Bible.” The Church’s edition dates it to February 1831.

  The chapter runs beside Genesis 5:25–6:13 and stops at the same point. Much of what a reader would ask about the shared verses is already on the Genesis pages, and this chapter does not repeat it: Methuselah’s age and why he was left behind are in the note on [[Gen. 5:27]], the meaning of Noah’s name in [[Gen. 5:29]], and the “sons of God,” the hundred and twenty years, the giants, and God’s “repenting” in the notes on [[Gen. 6:2]], [[Gen. 6:3]], [[Gen. 6:4]] and [[Gen. 6:6]]. What Moses 8 has that Genesis does not is Noah’s ordination, his preaching, and the reason the Lord gives for the Flood. The notes here are on those.

thread: |
  The chapter has one argument: the Flood comes only after the gospel has been preached. Noah is ordained “after his own order” and sent to “declare his Gospel… even as it was given unto Enoch” ([[Moses 8:19]]). What he preaches is belief, repentance, baptism in the name of Jesus Christ, and the Holy Ghost ([[Moses 8:23–24]]). The people “hearkened not,” and some sought his life. Only then does the Lord decree the end ([[Moses 8:26–30]]).

  The decree is therefore not the first word. It is the last, spoken to the man who had grieved over the people.

sections:
  - range: 1-12
    heading: From Enoch to Noah
    plain: |
      Enoch’s days total four hundred and thirty years. Methuselah is not taken up, so that the Lord’s covenant with Enoch, that Noah would come from his loins, could be fulfilled, and Methuselah prophesies that all the kingdoms of the earth will spring from his loins through Noah. A great famine comes and many die. The generations of Methuselah and Lamech are listed with their ages. Lamech names his son Noah, saying he will comfort them in their toil because of the cursed ground. Noah has three sons.
  - range: 13-21
    heading: The sons of God, and Noah’s calling
    plain: |
      Noah and his sons listen to the Lord and are called the sons of God. As men multiply, the sons of men take wives as they choose, and the Lord tells Noah that the daughters of his sons have sold themselves and that His anger is kindled. Noah prophesies. The Lord says His Spirit will not always strive with man, says that man’s days shall be a hundred and twenty years, and warns of floods. Giants seek Noah’s life, but the Lord is with him. The Lord ordains Noah and sends him to preach. The people refuse, and answer that they are the sons of God.
  - range: 22-24
    heading: Noah’s sermon
    plain: |
      God sees that the wickedness of men is great and that every heart is only evil continually. Noah goes on preaching: believe, repent, be baptized in the name of Jesus Christ, receive the Holy Ghost, or the floods will come. They do not listen.
  - range: 25-30
    heading: Grief and the decree
    plain: |
      Noah is pained at heart. The Lord says He will destroy man and beast from the earth, because Noah has called upon Him and the people have sought his life. Noah finds grace; he is just, perfect in his generation, and walks with God, as do his three sons. The earth is corrupt and filled with violence, and God tells Noah that the end of all flesh has come.

notes:
  - ref: 4
    phrase: great famine into the land
    kind: history
    title: A famine behind Lamech’s words
    body: |
      The famine in verse 4 gives a concrete reason for Lamech’s hope in verse 9. The verse says that “the Lord cursed the earth with a sore curse, and many of the inhabitants thereof died.” A few verses later Lamech names his son Noah because he “shall comfort us concerning our work and toil of our hands, because of the ground which the Lord hath cursed” ([[Moses 8:9]]). Genesis has the naming but not the famine, so there Lamech’s words can sound like a general sigh about farming.

      The curse on the ground has a history in the book: it fell on Adam ([[Moses 4:23]]) and on Cain ([[Moses 5:37]]), and verse 4 renews it. On that reading the famine “highlights the immediacy and severity of the curse mentioned by Lamech,” and “the people needed comfort, and Noah would be that source.” The Book of Moses may have this “more immediate and serious ‘cursing’ of the land in view” rather than only the curse of Eden. That is a proposal about how the verses fit; the text does not say that Lamech was thinking of the famine. For the wordplay on Noah’s name, see the note on [[Gen. 5:29]].
    sources: [schade-bowen-moses-8, lds-scriptures]
  - ref: 19
    phrase: ordained Noah after his own order
    kind: scripture
    title: Ordained after his own order
    body: |
      “After his own order” means the priesthood “after the Order of the Son of God,” which was its name “before his day,” before Melchizedek ([[D&C 107:3]]). So verse 19 has the Lord Himself ordain Noah to what is now called the Melchizedek Priesthood and commission him to preach, “just as he had commissioned Enoch.” Enoch’s call is in [[Moses 6:26–34]]. The revelation on the priesthood also records an earlier ordination: “Noah was ten years old when he was ordained under the hand of Methuselah” ([[D&C 107:52]]). Neither passage says how the two fit together.

      Joseph Smith said what that priesthood gave Noah. Commenting in 1840 on God’s word to Noah in [[Gen. 6:13]], he taught that “the keys of this priesthood consisted in obtaining the voice of Jehovah that he talked with him in a familiare and friendly manner, that he continued to him the keys, the covenants, the power and the glory with which he blessed Adam at the beginning.” Noah’s preaching in verses 20–24 follows from this commission, and the Lord’s “direct, personal involvement in Noah’s ordination and prophetic commission to save souls speaks volumes about his concern for Noah’s generation.”
    sources: [lds-scriptures, jsp-instruction-priesthood-1840, schade-bowen-moses-8]
  - ref: 24
    phrase: be baptized in the name of Jesus Christ, the Son of God, even as our fathers
    kind: christ
    title: The same gospel, in the same name
    body: |
      Noah preaches baptism in the name of Jesus Christ, and says that the fathers had received it. The book has already shown this of Adam. The Lord told him, “be baptized, even in water, in the name of mine Only Begotten Son, who is full of grace and truth, which is Jesus Christ” ([[Moses 6:52]]), and Adam was baptized ([[Moses 6:64–65]]). Noah’s sermon names belief, repentance, baptism, and the Holy Ghost: his teaching “emphasized the doctrine of Christ in all its essentials.”

      Genesis has none of this. Joseph Smith reasoned to it from the Bible alone, which calls Noah “a preacher of righteousness” ([[2 Pet. 2:5]]): the gospel “has always been the same; the ordinances to fulfil its requirements, the same; and the officers to officiate, the same… therefore, as Noah was a preacher of righteousness he must have been baptised and ordained to the priesthood.” Verse 16 says as much in a phrase: Noah “taught the things of God, even as it was in the beginning.”
    sources: [lds-scriptures, jsp-times-seasons-1842-09-01, schade-bowen-moses-8]
  - ref: 22
    phrase: God saw that the wickedness of men had become great
    kind: scripture
    title: When God sees again
    body: |
      The words “God saw” in verse 22 are those of the Creation account, and here they bring the opposite verdict. Then it was, “And I, God, saw everything that I had made, and, behold, all things which I had made were very good” ([[Moses 2:31]]). Now God sees that wickedness “had become great” and that every heart is “only evil continually.” What God had declared good in the Creation was “being reversed and undone through wickedness.”

      Verse 26 carries the thought on in creation words (“man whom I have created… I have made them”). The people’s conduct “might suggest” that they “had undone creation” and its purpose, “to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]). That is a suggestion, not the text’s own statement, though it agrees with a view “commonly accepted in biblical studies”: that the Flood was “a re-creation of life,” told in the language of the Creation. So the chapter’s last verses are not only an ending. They also hold out “a new creation with Noah and his family at its head.”
    sources: [schade-bowen-moses-8, lds-scriptures]
  - ref: 26
    phrase: he hath called upon me; for they have sought his life
    kind: history
    title: “He hath called upon me”
    body: |
      Verse 26 gives the decree reasons that Genesis does not: Noah’s grief, his calling on the Lord, and the attempt on his life. In Genesis the Lord says, “it repenteth me that I have made them” ([[Gen. 6:7]]). Here He says, “it repenteth Noah that I have created them… and he hath called upon me; for they have sought his life.” The verse looks back to Noah’s sorrow ([[Moses 8:25]]) and to those who “sought Noah to take away his life” ([[Moses 8:18]]). The Lord “appears to have taken Noah’s reaction to the human corruption and violence very seriously.”

      Enoch’s preaching had ended differently. In his day “the Holy Ghost fell on many, and they were caught up by the powers of heaven into Zion” ([[Moses 7:27]]); the response to Noah “was almost universally negative.” That “appears to have broken Noah’s heart,” and he “may have felt as the Lord did when Enoch saw him lamenting” over the same people: “in my hot displeasure will I send in the floods upon them” ([[Moses 7:34]]). The comparison is a suggestion; the text does not make it. For God’s weeping, see [[Moses 7:28–40]]; for why the “repenting” is Noah’s here, and for the Hebrew word behind it, see the note on [[Gen. 6:6]].
    sources: [schade-bowen-moses-8, lds-scriptures]
  - ref: 30
    phrase: I will destroy all flesh from off the earth
    kind: prophets
    title: Those who perished in the Flood
    body: |
      The Flood did not come without warning, and it was not the end of those who died in it. Twice in this chapter the people are told beforehand: “if men do not repent, I will send in the floods upon them” ([[Moses 8:17]]), and, from Noah, “if ye do not this, the floods will come in upon you” ([[Moses 8:24]]).

      Enoch had already been shown what would become of them. The Lord said, “these which thine eyes are upon shall perish in the floods; and behold, I will shut them up; a prison have I prepared for them” ([[Moses 7:38]]), and that His Chosen would suffer for their sins, “inasmuch as they will repent in the day that my Chosen shall return unto me” ([[Moses 7:39]]). That is, they “would go to the spirit world,” where “they would have the opportunity to be taught the gospel of Jesus Christ and repent of their sins.” In April 1842 the *Times and Seasons* reasoned that all who died without the gospel “will be visited by this priesthood, and come out of their prison, upon the same principle as those who were disobedient in the days of Noah, were visited by our Saviour.” For Peter’s words on the spirits in prison, and how the gospel was preached to the dead, see the note on [[Moses 7:39]].
    sources: [lds-scriptures, scripture-helps-gen-6-11, jsp-times-seasons-1842-04-15]

christ: |
  Jesus Christ is named in Noah’s sermon. Noah is ordained “after the Order of the Son of God” ([[Moses 8:19]]; [[D&C 107:3]]), and what he preaches is repentance and baptism “in the name of Jesus Christ, the Son of God” ([[Moses 8:24]]), the name given to Adam ([[Moses 6:52]]). Those who refused him were not left outside the Atonement. In Enoch’s vision the Lord weeps over them ([[Moses 7:28–37]]) and says that His Chosen “suffereth for their sins; inasmuch as they will repent in the day that my Chosen shall return unto me” ([[Moses 7:39]]). How the gospel reached them is in the note on [[Moses 7:39]].

explore: |
  - **Enoch’s vision of the Flood and the weeping of God.** [[Moses 7:28–40]], where the Lord tells Enoch why the heavens weep over those who will die in the Flood.
  - **What Genesis does with Noah’s day.** [[Gen. 6]], and the Flood itself in [[Gen. 7]] and [[Gen. 8]].
  - **The spirits in prison.** [[1 Pet. 3:18–20]] and [[D&C 138:28–34]].
  - **Noah’s ordination in the order of priesthood.** [[D&C 107:41–53]].
  - **Possible reasons God sent the Flood.** What latter-day prophets have suggested is gathered in *Scripture Helps: Old Testament*, beside these verses in the Gospel Library.

