chapter: 2
title: The Creation in God's Own Words
tagline: The Lord tells Moses what He made, in the first person, and says who made it with Him.
when: 'Received by Joseph Smith between June and October 1830. In the account, it follows the vision on the mountain, when the Lord “spake unto Moses” and told him to write.'

setting: |
  Two settings meet here. In the account, Moses has just seen God face to face on “an exceedingly high mountain” ([[Moses 1:1–2]]), has been told that he will write what he hears, and now hears the Creation. The Lord says, “I reveal unto you concerning this heaven, and this earth; write the words which I speak” ([[Moses 2:1]]). In the history of the text, the chapter belongs to the revelation Joseph Smith dated June–October 1830, an extract from his translation of the Bible.

  Genesis names no author. Whatever the history of its text, “Restoration scripture confirms Moses’s central involvement in these works of scripture,” and this verse is one of the passages named for it. The chapter runs verse for verse beside [[Gen. 1]], and Abraham tells the same Creation again as the plan of the Gods ([[Abr. 4]]). So this chapter does not repeat what the Genesis notes already say about the Hebrew, the firmament, the days, or the image of God. It takes up what Moses adds: who is speaking, in what voice, and what the speaker says about Himself and about the Only Begotten.

thread: |
  The chapter is the Creation told by the Creator, in the first person. Genesis says “God said”; here the Lord says **“I, God, said.”** The phrase carries the narrative through twenty-four of its thirty-one verses, and it does what the opening verse promises: Moses is not given a report about the Creation but a revelation from the One who did it, and he is told to write it.

  Two things in the account are Moses' own. The first is that the Lord names Himself and then names another: “I am the Beginning and the End, the Almighty God; by mine Only Begotten I created these things.” The second is the purpose behind it, which Moses had just heard in [[Moses 1:39]]: this is God's work and His glory, “to bring to pass the immortality and eternal life of man.” That purpose “is the lens through which the creation accounts are viewed.” The earth is ordered, light is made, life is filled in, and at the end the Father speaks to the Only Begotten and makes man in the image of them both.

sections:
  - range: 1-2
    heading: The Lord reveals the Creation to Moses
    plain: |
      The Lord tells Moses He is revealing to him this heaven and earth, and that Moses must write what He says. The Lord is the Beginning and the End, the Almighty God, and He created all of this by His Only Begotten. At first the earth was unformed and empty. The Lord caused darkness to be upon the deep, and His Spirit moved upon the water, “for I am God.”
  - range: 3-5
    heading: The first day
    plain: |
      The Lord speaks, and there is light. He sees that it is good, divides the light from the darkness, and names them Day and Night. He does this by the word of His power, and it is done as He speaks. The evening and the morning are the first day.
  - range: 6-8
    heading: The second day
    plain: |
      The Lord commands a firmament in the midst of the water and makes it. It divides the waters beneath it from the waters above it. He calls the firmament Heaven. The evening and the morning are the second day.
  - range: 9-13
    heading: The third day
    plain: |
      The waters under heaven are gathered into one place and dry land appears. The Lord names the land Earth and the gathered waters Sea, and sees that all He has made is good. The earth brings forth grass, herbs, and fruit trees, each after its kind, with seed in itself. The evening and the morning are the third day.
  - range: 14-19
    heading: The fourth day
    plain: |
      The Lord makes lights in the firmament, to divide day from night and to serve as signs, seasons, days, and years. He makes the greater light, the sun, to rule the day, the lesser light, the moon, to rule the night, and the stars also. He sets them in the firmament to give light upon the earth, and sees that all He made is good. The evening and the morning are the fourth day.
  - range: 20-25
    heading: The fifth day and the animals
    plain: |
      The Lord calls the waters to bring forth moving creatures and the air to carry birds. He creates the great sea creatures and every living thing, each after its kind, and blesses them to be fruitful and multiply. The evening and the morning are the fifth day. Then the earth brings forth cattle, creeping things, and beasts, each after its kind, and He sees that they are good.
  - range: 26-31
    heading: Man and woman in the image of the Only Begotten
    plain: |
      The Lord speaks to His Only Begotten, who was with Him from the beginning: let us make man in our image, after our likeness. The Lord gives them dominion over the fish, the birds, the cattle, the earth, and every creeping thing. He creates man in His own image, in the image of His Only Begotten, male and female. He blesses them to be fruitful, to multiply, to replenish the earth, and to subdue it. He gives them every seed-bearing herb and fruit tree for food, and every clean herb to every beast, bird, and creeping thing to which He grants life. He sees everything He has made, and it is very good. The evening and the morning are the sixth day.

notes:
  - ref: 1
    phrase: write the words which I speak
    kind: history
    title: A revelation to Moses, and a command to write
    body: |
      The chapter presents itself as a revelation to Moses, with an instruction to record it. Genesis names no speaker and no author; this account names both. The command, “write the words which I speak,” repeats what the Lord told Moses on the mountain: “I will speak unto thee concerning this earth upon which thou standest; and thou shalt write the things which I shall speak” ([[Moses 1:40]]).

      The verse says “I reveal,” which “clearly defines that this is a revelation to Moses.” If the revelation follows the pattern of the vision in [[Moses 1]], “seeing” may have been part of how Moses received it. That is an inference, not something the text states; it says only that the Lord reveals and Moses writes.
    sources: [lds-scriptures, schade-bowen-moses-2-creation]
  - ref: 1
    phrase: I am the Beginning and the End, the Almighty God
    kind: words
    title: The Beginning and the End
    body: |
      The speaker's first titles place Him over time itself. “Beginning” and “End” used of God “help us see the close relationship between the Creator and his governance over the entirety of creation and temporality”: the Creation is temporal, and it has its “beginning” and its “end” only in its Creator. Moses had already heard a related name on the mountain: “I am the Lord God Almighty, and Endless is my name” ([[Moses 1:3]]).

      The verse then names two: “the Almighty God” and “mine Only Begotten.” The first title “seems to refer to the Father, while ‘Only Begotten’ refers to the Son,” so that the words are the Father's, and they name the Son as the one by whom He created. In verse 26 the same voice speaks to the Only Begotten directly, and there “Heavenly Father was speaking to Jesus Christ.”

      The one who spoke with Moses on the mountain was “the premortal Jesus Christ,” who “sometimes speaks as if He were God the Father” (see the note on [[Moses 1:6]]). Read with that, the account of the Creation is the Father’s own words, given to Moses by the Son who speaks in His name.
    sources: [schade-bowen-moses-2-creation, scripture-helps-gen-1-2, scripture-helps-moses-1, lds-scriptures]
  - ref: 1
    phrase: by mine Only Begotten I created these things
    kind: christ
    title: By mine Only Begotten
    body: |
      The Lord names the Only Begotten as the one by whom He created, and Moses already knows what the Creation is for. For who made the earth and what “by” means, see the note on [[Gen. 1:1]]. What Moses adds is the purpose. On the mountain the Lord had told him both things: “by the word of my power, have I created them, which is mine Only Begotten Son” ([[Moses 1:32]]), and “this is my work and my glory—to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]). That vision, with its “focal point on God’s purposes to bring to pass our eternal life and salvation,” “is the lens through which the creation accounts are viewed.”

      Elder Marion G. Romney put the two together: “Jesus Christ, through whom God created the universe, was chosen to put into operation throughout the universe Elohim’s great plan ‘to bring to pass the immortality and eternal life of man.’” The Creator and the one who carries out the plan are the same person, and Moses 2 “makes it clear that Christ was the main figure responsible for the Creation.”
    sources: [schade-bowen-moses-2-creation, lds-scriptures, sc-knowhy-400]
  - ref: 2
    phrase: I caused darkness to come up upon the face of the deep
    kind: symbol
    title: Darkness that God caused
    body: |
      In Moses the Lord says that He caused the darkness, where Genesis says only that “darkness was upon the face of the deep” ([[Gen. 1:2]]). The verse ends, “for I am God,” and the power of God is what it puts forward: in the Creation as it was revealed to Moses, “God is in total control, has never lacked that control, and is never in danger of losing his power.”

      Moses had met darkness himself. In the vision before this one ([[Moses 1:12–26]]) it had become something “with which he had become frighteningly familiar,” and there calling upon God “had delivered him from that darkness and brought him to receive more light.” Here, hearing that the darkness over the deep came at God's word, Moses “will begin to understand God’s power over the darkness.” That is a reading of what the verse taught Moses. No source read says why this account attributes the darkness to God where Genesis does not, and the text does not say what the darkness is.
    sources: [schade-bowen-moses-2-creation, lds-scriptures]
  - ref: 3
    phrase: And I, God, said
    kind: words
    title: The voice of I, God
    body: |
      Moses 2 tells the Creation in the Creator's own voice. “I, God” occurs in twenty-four of this chapter's thirty-one verses (and in four verses of [[Moses 3]]), where Genesis 1 says only “God said.” The count is from a search of the text. Each act is the same: “I, God, said”; “I, God, saw the light”; “I, God, called the light Day.”

      The repetition “emphasizes its firsthand nature,” and an account in God's own voice “must have been personal and inspiring to the Lord’s new prophet.” The speaker is the Lord who opened the chapter with “I reveal unto you” ([[Moses 2:1]]). For what the Father and the Son each do in the chapter, see the notes on verses 1 and 27.
    sources: [lds-scriptures, schade-bowen-moses-2-creation]
  - ref: 5
    phrase: by the word of my power
    kind: scripture
    title: By the word of my power
    body: |
      The Lord says the work of the first day was done “by the word of my power, and it was done as I spake,” and Restoration sources say both who that word is and how God works by it. The word is the Only Begotten ([[Moses 1:32]]); the note on [[Gen. 1:3]] sets that out.

      How God works by a word is the subject of a passage in the *Lectures on Faith*, which takes this very act as its example: “When a man works by faith he works by mental exertion instead of physical force. … God said, ‘Let there be light: and there was light.’” And “Faith, then, works by words.” As Moses hears “Let there be light,” he “comprehends the power of divine speech.”
    sources: [pgp-manual-moses-2, lds-scriptures, schade-bowen-moses-2-creation]
  - ref: 27
    phrase: in the image of mine Only Begotten created I him
    kind: christ
    title: In the image of the Only Begotten
    body: |
      The Lord says that man is made in His own image and in the image of the Only Begotten, so the likeness is to the Father and to the Son. In the verse before, He speaks to the Son: “I, God, said unto mine Only Begotten, which was with me from the beginning: Let us make man in our image.” The Genesis notes on [[Gen. 1:26]] have the council and the meaning of “image”; the note on verse 1 here has who is speaking.

      Moses' wording also marks a change at this point in the account. Until now the commands have been “let there be”; now the speaker says “Let us make,” “indicating multiple beings involved in creation,” and the first-person telling is “strikingly personal as we see the Father immediately involved in this stage of creation.” On this reading the Father's “personal involvement in the creation of humankind gives us some idea of the worth that we, his children, have in his sight.” The verses themselves say only that God spoke to the Only Begotten and made man in the image of both; how the work was shared between Them they do not say.
    sources: [schade-bowen-moses-2-image, lds-scriptures]

christ: |
  Moses learns in the first verse that the Creation was done “by mine Only Begotten.” The word the Lord speaks is the Son: “by the word of my power, have I created them, which is mine Only Begotten Son, who is full of grace and truth” ([[Moses 1:32]]). The vision before this chapter had already named what the work is for, “to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]), and that purpose “is the lens through which the creation accounts are viewed.” Near the end of the account the Father turns to “mine Only Begotten, which was with me from the beginning,” and man is made in the image of both.

explore: |
  Read [[Moses 1]], the vision that prepares Moses to receive this account, and [[Moses 3]], which tells of the spiritual creation and the garden. The Genesis chapter beside this one is [[Gen. 1]], and [[Abr. 4]] tells the same Creation as the plan of the Gods. [[Abr. 3:22–28]] tells of the council before the Creation. [[John 1:1–3]] and [[Col. 1:16]] speak of what the Son did.

parallels:
  - ref: Gen. 1:1–31
    note: The same Creation, verse for verse, in the words of Genesis.
    primary: true
  - ref: Abr. 4:1–31
    note: The same Creation as the plan of the Gods, with each day called a “time.”

sources: [lds-scriptures, scripture-helps-gen-1-2, pgp-manual-moses-2, schade-bowen-moses-2-creation, schade-bowen-moses-2-image, sc-knowhy-400]
