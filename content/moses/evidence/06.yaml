chapter: 6
claims:
  - where: setting
    claim: Joseph Smith began receiving the text of Moses 6 in November 1830
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Sometime during October 1830, the month before Joseph Smith began receiving the text of Moses 6'
  - where: setting
    claim: Moses 6 runs from Seth's birth to Enoch's ministry; its first third is generations from Seth, the second Enoch's call
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'the first third of Moses 6 (vv. 1–23) tells the story of the generations between Adam and Enoch, beginning with Seth'
  - where: setting
    claim: Genesis says of Enoch that he walked with God three hundred years after Methuselah's birth
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/5?lang=eng'
    quote: 'And Enoch walked with God after he begat Methuselah three hundred years'
  - where: setting
    claim: Moses 6 introduces Enoch's teaching that creates Zion amid wickedness
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Moses 6 introduces us to Enoch and his efficacious teaching that would create Zion amid widespread wickedness'
  - where: setting
    claim: Enoch's speech continues in Moses 7
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'And it came to pass that Enoch continued his speech, saying: Behold, our father Adam taught these things'
  - where: thread
    claim: Enoch's message is Adam's teaching handed down; Enoch assured them they were responsible for their own sins
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Enoch assured the people that they were responsible for their own sins, not for Adam’s transgressions.'
  - where: thread
    claim: Enoch appeals to the book of remembrance and tells what God made known to the fathers
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'But God hath made known unto our fathers that all men must repent.'
  - where: note 6:5 “A book of remembrance and a language to write it in”
    claim: The Book of Moses gives scripture an origin with Adam and his descendants
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'one of the important contributions of the Book of Moses is the restored knowledge that scripture originated with Adam and his descendants.'
  - where: note 6:5 “A book of remembrance and a language to write it in”
    claim: The records held revelation and were a means of teaching reading and writing
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Second, the writings in the book of remembrance served as a means of teaching Adam’s posterity to read and write.'
  - where: note 6:5 “A book of remembrance and a language to write it in”
    claim: Adam's posterity registered and kept their genealogy, the book of the generations of Adam
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'registered and kept their genealogy, hence the name “the book of the generations of Adam” (6:8)'
  - where: note 6:5 “A book of remembrance and a language to write it in”
    claim: Moses 6:5, 6, 8 and 46 on the book, the language, and Enoch's reference to it
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'having a language which was pure and undefiled'
  - where: note 6:7 “The priesthood in the beginning and the end”
    claim: The priesthood and its ordinances were available to Adam, Eve, and their righteous posterity
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'The priesthood—and its ordinances—were available to Adam, Eve, and their righteous posterity.'
  - where: note 6:7 “The priesthood in the beginning and the end”
    claim: D&C 84:17 on the priesthood continuing in all generations without beginning of days or end of years
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Which priesthood continueth in the church of God in all generations, and is without beginning of days or end of years.'
  - where: note 6:7 “The priesthood in the beginning and the end”
    claim: The book of generations may have recorded the priesthood line of authority
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Third, the book of generations may have been used to record Adam’s posterity in their priesthood line of authority.'
  - where: note 6:7 “The priesthood in the beginning and the end”
    claim: The records have been read as measures taken because of the prophecy of verse 7
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'The significant part of all this is that these measures were implemented as a result of the following prophecy'
  - where: note 6:7 “The priesthood in the beginning and the end”
    claim: Moses 6:67 says Adam is after the order of him without beginning of days or end of years
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'thou art after the order of him who was without beginning of days or end of years'
  - where: note 6:15 “Satan’s dominion and the first oaths”
    claim: Moses 6:15 describes wars, bloodshed, secret works, seeking for power
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'because of secret works, seeking for power'
  - where: note 6:15 “Satan’s dominion and the first oaths”
    claim: Moses 5:29-30 Satan has Cain swear and all done in secret
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'And Satan sware unto Cain that he would do according to his commands. And all these things were done in secret.'
  - where: note 6:15 “Satan’s dominion and the first oaths”
    claim: Wars and bloodshed are evidence of Satan's dominion; the people of Enoch's day foresworn, perhaps broken covenants for oaths with Satan after Cain
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'deeds perhaps to be viewed in terms of breaking oaths and covenants with the Lord in favor of oaths and covenants with Satan, following the precedent that Cain established in Moses 5'
  - where: note 6:15 “Satan’s dominion and the first oaths”
    claim: The Lord called and commissioned preachers of righteousness; had not left them defenseless
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'the Lord had not left Adam’s righteous posterity defenseless. He called and commissioned preachers of righteousness.'
  - where: note 6:31 “Enoch, a lad slow of speech”
    claim: Enoch and Moses both protested they were slow of speech; the Lord empowered each
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Both Enoch and Moses protested to the Lord that they were “slow of speech” (compare Moses 6:31; Exodus 4:10).'
  - where: note 6:31 “Enoch, a lad slow of speech”
    claim: The promise that no man would pierce Enoch is kept when no man laid hands on him
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'the Lord kept his promise to him that “no man shall pierce thee,” for we read that “no man laid hands on him” (vv. 32, 39)'
  - where: note 6:31 “Enoch, a lad slow of speech”
    claim: Moses 6:31-32 text
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'Open thy mouth, and it shall be filled, and I will give thee utterance'
  - where: note 6:31 “Enoch, a lad slow of speech”
    claim: Exodus 4:10 Moses says he is slow of speech
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'but I am slow of speech, and of a slow tongue.'
  - where: note 6:31 “Enoch, a lad slow of speech”
    claim: In October 1830, the month before Moses 6 began to be received, Ezra Thayre and Northrop Sweet were promised that their mouths would be filled (D&C 33)
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Sometime during October 1830, the month before Joseph Smith began receiving the text of Moses 6, the Lord promised Ezra Thayre and Northrop Sweet, “Open your mouths and they shall be filled'
  - where: note 6:31 “Enoch, a lad slow of speech”
    claim: Enoch proposed as a model for them and for the elders of the Church
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Enoch would serve as a model for how to open one’s mouth and have it filled and how to proclaim the doctrine of Christ'
  - where: note 6:36 “A seer hath the Lord raised up”
    claim: After anointing his eyes Enoch saw; the Lord had blessed him with the gift of seership
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'The Lord had blessed Enoch with the gift of seership.'
  - where: note 6:36 “A seer hath the Lord raised up”
    claim: Definition of a seer
    key: gs-seer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/seer?lang=eng'
    quote: 'A person authorized of God to see with spiritual eyes things that God has hidden from the world (Moses 6:35–38).'
  - where: note 6:36 “A seer hath the Lord raised up”
    claim: A seer knows the past, present, and future
    key: gs-seer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/seer?lang=eng'
    quote: 'A seer knows the past, present, and future.'
  - where: note 6:36 “A seer hath the Lord raised up”
    claim: Despite the pejorative wild man, people sensed he was a man of God
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'despite the pejorative claims that Enoch was “a wild man,” the people could sense and observe that he was a man of God'
  - where: note 6:36 “A seer hath the Lord raised up”
    claim: Moses 6:36-39 text
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'no man laid hands on him; for fear came on all them that heard him; for he walked with God'
  - where: note 6:54 “Atoned for original guilt”
    claim: Adam and Eve were forgiven and the consequences of their sins not passed to children; Joseph Smith's statement
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'We believe that men will be punished for their own sins, and not for Adam’s transgression.'
  - where: note 6:54 “Atoned for original guilt”
    claim: Children conceived in sin means born into a world of sin; taste the bitter to prize the good; must be cleansed
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'God also taught Adam that his posterity would be “conceived in sin” (or “born into a world of sin”).'
  - where: note 6:54 “Atoned for original guilt”
    claim: Moses 6:53-56 text
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'Behold I have forgiven thee thy transgression in the Garden of Eden.'
  - where: note 6:54 “Atoned for original guilt”
    claim: Mosiah 3:16 and Mosiah 15:25 earlier taught the same to Joseph Smith in the Book of Mormon; little children whole
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Before his translation of what is now Moses 6:54, Joseph Smith had already received intimations that the curse of Adam had been taken away by Jesus Christ’s atonement.'
  - where: note 6:54 “Atoned for original guilt”
    claim: Article of Faith 1:2
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng'
    quote: 'We believe that men will be punished for their own sins, and not for Adam’s transgression.'
  - where: note 6:57 “Man of Holiness”
    claim: God the Father's name is Man of Holiness in Adam's language; the Savior is frequently called the Son of Man
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'God the Father’s name is Man of Holiness in Adam’s language, and the Savior is frequently called the Son of Man in the scriptures.'
  - where: note 6:57 “Man of Holiness”
    claim: Jesus is often called, and calls Himself, the Son of Man in the New Testament; the title recognizes His divinity and holiness
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'these references are actually a recognition of His divinity and holiness—He is the Son of Man of Holiness, God the Father.'
  - where: note 6:57 “Man of Holiness”
    claim: Moses 6:57 is quoted in a call to holiness
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'To eat the flesh and drink the blood of Christ means to pursue holiness.'
  - where: note 6:57 “Man of Holiness”
    claim: Moses 6:57 text
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'in the language of Adam, Man of Holiness is his name, and the name of his Only Begotten is the Son of Man'
  - where: note 6:59 “Water, blood, and the spirit”
    claim: Water, blood, and spirit come together when a person enters mortality
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'The elements of water, blood, and spirit all come together to create a living soul when a person enters mortality.'
  - where: note 6:59 “Water, blood, and the spirit”
    claim: Baptism and the Spirit lead to the Savior and his atoning blood
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'Baptism by water and receiving the gift of the Holy Spirit lead a person to the Savior, allowing them to be changed through His atoning blood.'
  - where: note 6:59 “Water, blood, and the spirit”
    claim: Enoch uniquely tied the elements of rebirth to those of physical birth
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Enoch uniquely tied the elements of divine rebirth “through the blood of mine Only Begotten” to those of physical birth'
  - where: note 6:59 “Water, blood, and the spirit”
    claim: To be justified is to be declared righteous, acquitted in a legal sense
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'means to be declared or pronounced “just or righteous”—that is, acquitted, pronounced innocent, or vindicated in a legal sense.'
  - where: note 6:59 “Water, blood, and the spirit”
    claim: Sanctification is the ongoing process of becoming
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'The purpose of mortality was to become. This ongoing process was the process of sanctification.'
  - where: note 6:59 “Water, blood, and the spirit”
    claim: Moses 6:59-60 text
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'by the water ye keep the commandment; by the Spirit ye are justified, and by the blood ye are sanctified'
  - where: note 6:64 “Adam baptized, and called a son of God”
    claim: The Old Testament does not mention baptism but revelation through Joseph Smith shows Adam had it
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'The Old Testament also does not mention the ordinance of baptism.'
  - where: note 6:64 “Adam baptized, and called a son of God”
    claim: Adam was a son of God as a literal spirit son and as born again through Jesus Christ
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'Not only was he a literal spirit son of God created in His image, but Adam was also a son of God because he had been born again through Jesus Christ.'
  - where: note 6:64 “Adam baptized, and called a son of God”
    claim: Moses 6:64-68 text
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'Behold, thou art one in me, a son of God; and thus may all become my sons.'
  - where: note 6:64 “Adam baptized, and called a son of God”
    claim: Every person is God's offspring, but to be called the children of God means much more
    key: andersen-peacemaker
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/15andersen?lang=eng'
    quote: 'Every person on earth is the “offspring” of God, but to be called the “children of God” means much, much more.'
  - where: note 6:64 “Adam baptized, and called a son of God”
    claim: On November 4, 1830, the newly baptized Orson Pratt was told believers might become the sons of God; becoming a son of God is a theme of Enoch's discourses (Moses 6:68)
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'In a revelation on November 4, 1830, to Orson Pratt, who had recently entered the covenant and ordinance of baptism, the Lord explained that all who would believe in him “might become the sons of God”'
  - where: note 6:64 “Adam baptized, and called a son of God”
    claim: Becoming a son of God was a major theme in Enoch's discourses
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Becoming a son of God was a major theme in Enoch’s ancient discourses as they were revealed to Moses (see Moses 6:68).'
  - where: note 6:64 “Adam baptized, and called a son of God”
    claim: By early December 1830 the Lord told Joseph Smith and Sidney Rigdon that believers may become the sons of God, one in Him (D&C 35:2)
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'By early December 1830, the Lord revealed to Joseph Smith and Sidney Rigdon'
  - where: christ
    claim: The name of Jesus Christ is the only name for salvation, given to Adam
    key: scripture-helps-gen-5
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/04-genesis-5-moses-6?lang=eng'
    quote: 'Jesus Christ is “the only name which shall be given under heaven, whereby salvation shall come unto the children of men.”'
  - where: christ
    claim: Moses 6:59 and 6:62
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'This is the plan of salvation unto all men, through the blood of mine Only Begotten, who shall come in the meridian of time.'
  - where: explore
    claim: Genesis 5:22 on Enoch's walk
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/5?lang=eng'
    quote: 'And Enoch walked with God after he begat Methuselah three hundred years'
  - where: explore
    claim: Moses 7 heading (Enoch teaches; Zion established; he foresees the coming of the Son of Man)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'The city of Zion is established—Enoch foresees the coming of the Son of Man'
