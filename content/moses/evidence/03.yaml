chapter: 3
claims:
  - where: setting
    claim: 'The chapter is dated June–October 1830 in the Church edition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: '(June–October 1830)'
  - where: setting
    claim: 'Moses is told to write what the Lord speaks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'thou shalt write the things which I shall speak.'
  - where: setting
    claim: 'The account is given as words the Lord speaks to Moses for him to write'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng'
    quote: 'write the words which I speak.'
  - where: setting
    claim: 'Scripture Helps treats Moses 3 together with Genesis 2 and Abraham 5'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'Genesis 2:1–3; Moses 3:1–3; Abraham 5:1–3: What is significant about…'
  - where: setting
    claim: 'The Church has no official position on evolution; Moses 3:7 is the verse the question attaches to'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'The Church has no official position on the theory of evolution.'
  - where: note 3:5 “All things created spiritually first”
    claim: 'D&C 29 gives the same order, first spiritual, then temporal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'First spiritual, secondly temporal, which is the beginning of my work'
  - where: note 3:5 “All things created spiritually first”
    claim: 'The chapter is not a retelling of Genesis 2 but concentrates on the eternal nature of God’s children'
    key: schade-bowen-moses-3
    url: 'https://rsc.byu.edu/book-moses/moses-3-identity-commandments-purpose'
    quote: 'What follows is not a retelling of the Genesis 2 account of Adam and Eve’s creation per se, but a concentration and focus on the eternal nature of God’s children'
  - where: note 3:7 “The first flesh, the first man”
    claim: 'Moses 1:34 calls Adam the first man of all men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And the first man of all men have I called Adam, which is many.'
  - where: note 3:7 “The first flesh, the first man”
    claim: 'The Church has no official position on evolution; details of how bodies were created are not revealed; teachings on man’s origin are clear'
    key: new-era-evolution-2016
    url: 'https://www.churchofjesuschrist.org/study/new-era/2016/10/to-the-point/what-does-the-church-believe-about-evolution?lang=eng'
    quote: 'The Church has no official position on the theory of evolution. Organic evolution, or changes to species’ inherited traits over time, is a matter for scientific study. Nothing has been revealed concerning evolution.'
  - where: note 3:7 “The first flesh, the first man”
    claim: 'No details of how bodies were created have been revealed, yet teachings on origin are clear and revealed'
    key: new-era-evolution-2016
    url: 'https://www.churchofjesuschrist.org/study/new-era/2016/10/to-the-point/what-does-the-church-believe-about-evolution?lang=eng'
    quote: 'Though the details of what happened on earth before Adam and Eve, including how their bodies were created, have not been revealed, our teachings regarding man’s origin are clear and come from revelation.'
  - where: note 3:7 “The first flesh, the first man”
    claim: 'The First Presidency’s 1909 statement, reprinted in 2002 as expressing the Church’s doctrinal position'
    key: origin-of-man-1909
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/02/the-origin-of-man?lang=eng'
    quote: 'the First Presidency issued the following in 1909, which expresses the Church’s doctrinal position on these matters'
  - where: note 3:7 “The first flesh, the first man”
    claim: 'The 1909 statement holds Adam to be the first man and calls the opposite the theories of men, citing Moses 1:34'
    key: origin-of-man-1909
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/02/the-origin-of-man?lang=eng'
    quote: 'It is held by some that Adam was not the first man upon this earth and that the original human being was a development from lower orders of the animal creation. These, however, are the theories of men.'
  - where: note 3:7 “The first flesh, the first man”
    claim: 'The 1909 statement says Adam, like Christ, was a preexistent spirit who took a body and became a living soul'
    key: origin-of-man-1909
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/02/the-origin-of-man?lang=eng'
    quote: 'Adam, our first progenitor, “the first man,” was, like Christ, a preexistent spirit, and like Christ he took upon him an appropriate body, the body of a man, and so became a “living soul.”'
  - where: note 3:9 “Trees that became living souls”
    claim: 'D&C 88:15: spirit and body are the soul; and 88:16 on resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'And the spirit and the body are the soul of man.'
  - where: note 3:9 “Trees that became living souls”
    claim: 'The Student Manual sets Moses 3:9 beside D&C 88:15: a soul is a spirit and a body combined'
    key: pgp-manual-moses-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-3-1-25?lang=eng'
    quote: 'Moses 3:9 indicates that “every tree … became also a living soul.” Man, animals, and birds “were also living souls” (see Moses 3:7, 19). Doctrine and Covenants 88:15 teaches that a soul is a spirit and a body combined.'
  - where: note 3:9 “Trees that became living souls”
    claim: 'D&C 77:2 says the spirit of the beast and every other creature is in the likeness of its body'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/77?lang=eng'
    quote: 'the spirit of man in the likeness of his person, as also the spirit of the beast, and every other creature which God has created.'
  - where: note 3:9 “Trees that became living souls”
    claim: 'Joseph Smith taught that spirit and matter put together made a living soul'
    key: schade-bowen-moses-3
    url: 'https://rsc.byu.edu/book-moses/moses-3-identity-commandments-purpose'
    quote: '“[T]he son [of] man created a human-being—pure—matter & Sp[irit] & these two put togr. made a living soul.”'
  - where: note 3:17 “A commandment and a choice”
    claim: 'D&C 29:35: God gave Adam to be an agent unto himself and gave him a commandment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'Behold, I gave unto him that he should be an agent unto himself; and I gave unto him commandment'
  - where: note 3:17 “A commandment and a choice”
    claim: 'The two trees were placed openly; Adam and Eve are confronted with choice and agency'
    key: schade-bowen-moses-3
    url: 'https://rsc.byu.edu/book-moses/moses-3-identity-commandments-purpose'
    quote: 'They encountered the tree of life and the tree of knowledge of good and evil, which were not hidden from view but situated openly.'
  - where: note 3:18 “What the help meet does”
    claim: 'KnoWhy: Eve worked alongside Adam, raised children, prayed and worshipped, and taught her children, per Moses 5'
    key: sc-knowhy-833
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-that-eve-is-a-help-meet-for-adam'
    quote: 'Eve worked alongside Adam (see Moses 5:1), raised the children she had with Adam (see Moses 5:2), prayed and worshipped with Adam (see Moses 5:4–6), and taught her children the gospel (see Moses 5:12).'
  - where: thread
    claim: 'The man formed in verse 7 was a preexistent spirit who took a body'
    key: origin-of-man-1909
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/02/the-origin-of-man?lang=eng'
    quote: 'Adam, our first progenitor, “the first man,” was, like Christ, a preexistent spirit, and like Christ he took upon him an appropriate body, the body of a man, and so became a “living soul.”'
  - where: christ
    claim: 'The First Presidency sets Adam beside Christ: a preexistent spirit who took a body and became a living soul'
    key: origin-of-man-1909
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/02/the-origin-of-man?lang=eng'
    quote: 'Adam, our first progenitor, “the first man,” was, like Christ, a preexistent spirit, and like Christ he took upon him an appropriate body, the body of a man, and so became a “living soul.”'
  - where: note 3:7 “The first flesh, the first man”
    claim: 'The Student Manual explains “first flesh” as the first mortal flesh, after the Fall, drawing on Joseph Fielding Smith'
    key: pgp-manual-moses-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-3-1-25?lang=eng'
    quote: 'Thus, in the Fall, Adam and Eve became the first beings upon the earth who were mortal flesh, or subject to death.'
  - where: note 3:9 “Trees that became living souls”
    claim: 'The words are from the minutes of 6–9 April 1844 as reported by Thomas Bullock, as the chapter cites them (the Joseph Smith Papers page itself was not read)'
    key: schade-bowen-moses-3
    url: 'https://rsc.byu.edu/book-moses/moses-3-identity-commandments-purpose'
    quote: 'Minutes and Discourses, 6–9 April 1844, as Reported by Thomas Bullock, p. 26, The Joseph Smith Papers.'
  - where: note 3:17 “A commandment and a choice”
    claim: '“Thou mayest choose for thyself” can be taken as an escape clause'
    key: schade-bowen-moses-3
    url: 'https://rsc.byu.edu/book-moses/moses-3-identity-commandments-purpose'
    quote: 'Sometimes we might view the words “nevertheless, thou mayest choose for thyself” as a type of escape clause.'
  - where: note 3:17 “A commandment and a choice”
    claim: 'The plan was for Adam and Eve to learn obedience and to choose with accountability; offered as what seems clear'
    key: schade-bowen-moses-3
    url: 'https://rsc.byu.edu/book-moses/moses-3-identity-commandments-purpose'
    quote: 'Yet it seems clear that the plan was for them to learn obedience and how to choose with accountability and consequences, conditions they may not have fully understood at first'
  - where: note 3:17 “A commandment and a choice”
    claim: 'With the commandment given, Adam and Eve face choice and agency'
    key: schade-bowen-moses-3
    url: 'https://rsc.byu.edu/book-moses/moses-3-identity-commandments-purpose'
    quote: 'Now Adam and Eve are confronted with choice and agency.'
  - where: note 3:18 “What the help meet does”
    claim: 'The KnoWhy concludes from Moses 5 that Eve was a help meet, a necessary helper'
    key: sc-knowhy-833
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-that-eve-is-a-help-meet-for-adam'
    quote: 'Truly, she was a “help meet” for Adam, a necessary helper'
