chapter: 8
claims:
  - where: when
    claim: The edition dates Moses 8 to February 1831
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: '(February 1831)'
  - where: setting
    claim: Moses 8 links the narratives of Enoch and Noah, speaks of Noah's progenitors, ordination, ministry and calls to repentance
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'links the narratives of Enoch and Noah in ways absent from the Bible. It speaks of Noah’s progenitors, his ordination and ministry, and his efforts to call the people of his day to repentance.'
  - where: setting
    claim: Moses 8:30 ends with God's word to Noah that He will destroy all flesh, as Genesis 6:13 does
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'and behold I will destroy all flesh from off the earth.'
  - where: setting
    claim: Genesis 6:13 text
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/6?lang=eng'
    quote: 'And God said unto Noah, The end of all flesh is come before me; for the earth is filled with violence through them; and, behold, I will destroy them with the earth.'
  - where: note 8:4 “A famine behind Lamech’s words”
    claim: The famine continues the curse on the land from Adam and Cain; it shows how severe the curse Lamech named was, and the people needed comfort which Noah would give
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'This all highlights the immediacy and severity of the curse mentioned by Lamech at the time of Noah’s naming. As a result of this famine, “many inhabitants” in the land “died” (Moses 8:4). The people needed comfort, and Noah would be that source.'
  - where: note 8:4 “A famine behind Lamech’s words”
    claim: The Book of Moses etiology may have a more immediate cursing of the land in view, the great famine
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'The Book of Moses etiology may have a more immediate and serious “cursing” of the land in view, namely, the “great famine” that had killed so many people (see Moses 8:4)'
  - where: note 8:19 “Ordained after his own order”
    claim: The order of the Son of God is the Holy Priesthood's earlier name
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'Before his day it was called the Holy Priesthood, after the Order of the Son of God.'
  - where: note 8:19 “Ordained after his own order”
    claim: D&C 107:52 says Noah was ordained at ten under Methuselah
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'Noah was ten years old when he was ordained under the hand of Methuselah.'
  - where: note 8:19 “Ordained after his own order”
    claim: 8:19 means ordained after the order of the Son of God, and commissioned to preach as Enoch was
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'Moses 8:19 mentions that the Lord not only “ordained Noah after his own order”—that is, “after the order of the Son of God”—but also commissioned him to preach the everlasting “Gospel” as a preacher of righteousness and a prophet, just as he had commissioned Enoch in Moses 6.'
  - where: note 8:19 “Ordained after his own order”
    claim: Noah and his sons held the Melchizedek Priesthood
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'Noah and his sons became covenant sons of God and holders of the Melchizedek Priesthood.'
  - where: note 8:19 “Ordained after his own order”
    claim: Joseph Smith, after citing Genesis 6:13, on the keys of the priesthood continued to Noah (Instruction on Priesthood, circa 5 October 1840, p. 8)
    key: jsp-instruction-priesthood-1840
    url: 'https://www.josephsmithpapers.org/paper-summary/instruction-on-priesthood-circa-5-october-1840/15'
    quote: 'the keys of this priesthood consisted in obtaining the voice of Jehovah that he talked with him in a familiare and friendly manner, that he continued to him the keys, the covenants, the power and the glory with which he blessed Adam at the beginning'
  - where: note 8:19 “Ordained after his own order”
    claim: The statement is Joseph Smith's and follows his citation of Genesis 6:13
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'After citing Genesis 6:13, Joseph noted'
  - where: note 8:19 “Ordained after his own order”
    claim: The Lord's direct involvement in Noah's ordination and commission shows His concern for Noah's generation
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'direct, personal involvement in Noah’s ordination and prophetic commission to save souls speaks volumes about his concern for Noah’s generation'
  - where: note 8:24 “The same gospel, in the same name”
    claim: Noah's sermon contains the doctrine of Christ in all its essentials
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'Moses 8:23–24 makes it clear that teaching the plan of salvation emphasized the doctrine of Christ in all its essentials'
  - where: note 8:24 “The same gospel, in the same name”
    claim: Joseph Smith's statement, as printed in the BYU chapter, that the gospel and ordinances have always been the same, so Noah must have been baptized
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'has always been the same; the ordinances to fulfil its requirements, the same; and the officers to officiate, the same… therefore, as Noah was a preacher of righteousness he must have been baptised and ordained to the priesthood'
  - where: note 8:24 “The same gospel, in the same name”
    claim: The statement is attributed to Joseph Smith
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'The Prophet Joseph Smith explained:'
  - where: note 8:24 “The same gospel, in the same name”
    claim: The statement in its original printing (Times and Seasons, 1 September 1842, p. 904), argued from the Bible
    key: jsp-times-seasons-1842-09-01
    url: 'https://www.josephsmithpapers.org/paper-summary/times-and-seasons-1-september-1842/10'
    quote: 'prove from the bible that the gossel [gospel] has always been the same; the ordinances to fulfil its requirements, the same; and the officers to officiate, the same'
  - where: note 8:24 “The same gospel, in the same name”
    claim: The conclusion about Noah in the original printing
    key: jsp-times-seasons-1842-09-01
    url: 'https://www.josephsmithpapers.org/paper-summary/times-and-seasons-1-september-1842/10'
    quote: 'he must have been baptised and ordained to the priesthood by the laying on of the hands'
  - where: note 8:24 “The same gospel, in the same name”
    claim: God's words to Adam in Moses 6:52 (baptism in the name of the Only Begotten)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'and be baptized, even in water, in the name of mine Only Begotten Son, who is full of grace and truth, which is Jesus Christ'
  - where: note 8:24 “The same gospel, in the same name”
    claim: Adam was baptized (Moses 6:64–65)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'And thus he was baptized'
  - where: note 8:22 “When God sees again”
    claim: Moses 2:31 says God saw everything and it was very good
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng'
    quote: 'And I, God, saw everything that I had made, and, behold, all things which I had made were very good'
  - where: note 8:22 “When God sees again”
    claim: Moses 1:39 states God's work and glory
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'For behold, this is my work and my glory—to bring to pass the immortality and eternal life of man.'
  - where: note 8:22 “When God sees again”
    claim: What God declared good in the Creation was being reversed through wickedness (the authors' own sentence on Moses 8:22–30)
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'in the Creation was being reversed and undone through wickedness.'
  - where: note 8:22 “When God sees again”
    claim: The people's actions might suggest they undid creation; verse 26 has creation language
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'Such behavior might suggest that the actions of the people had undone creation (v. 26 is replete with creation language) and its divine purpose to make possible their immortality and eternal life (Moses 1:39).'
  - where: note 8:22 “When God sees again”
    claim: It is commonly accepted in biblical studies that the Flood was a re-creation paralleling the creation stories
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'It is commonly accepted in biblical studies that the Flood constituted a re-creation of life, paralleling the context and language of the creation stories in Genesis.'
  - where: note 8:22 “When God sees again”
    claim: Moses 8 also shows hope of a new creation with Noah and his family
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'Yet we also see in Moses 8 the hope that Noah and God’s covenant would bring after the Flood by way of a new creation with Noah and his family at its head.'
  - where: note 8:26 “He hath called upon me”
    claim: Genesis 6:7 has the Lord, not Noah, repent
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/6?lang=eng'
    quote: 'for it repenteth me that I have made them.'
  - where: note 8:26 “He hath called upon me”
    claim: The Lord took Noah's reaction seriously
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'The Lord appears to have taken Noah’s reaction to the human corruption and violence very seriously.'
  - where: note 8:26 “He hath called upon me”
    claim: The response to Noah, unlike the response to Enoch, was almost universally negative
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'the people’s response to the preaching of Noah and his sons was almost universally negative'
  - where: note 8:26 “He hath called upon me”
    claim: Noah's heart appears to have been broken; he may have felt as the Lord did when Enoch saw Him lamenting
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'This appears to have broken Noah’s heart (see v. 25), and he may have felt as the Lord did when Enoch saw him lamenting'
  - where: note 8:26 “He hath called upon me”
    claim: 'In Enoch’s day many repented and were caught up into Zion (Moses 7:27)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'and the Holy Ghost fell on many, and they were caught up by the powers of heaven into Zion.'
  - where: note 8:26 “He hath called upon me”
    claim: The Lord told Enoch that floods would come
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'the fire of mine indignation is kindled against them; and in my hot displeasure will I send in the floods upon them'
  - where: note 8:30 “Those who perished in the Flood”
    claim: Those who would perish in the Flood go to the spirit world and may be taught the gospel and repent
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'The Lord then explained that those who would perish in the Flood would go to the spirit world. There they would have the opportunity to be taught the gospel of Jesus Christ and repent of their sins.'
  - where: note 8:30 “Those who perished in the Flood”
    claim: Moses 7:38 says those who perish in the floods are shut up in a prison
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'these which thine eyes are upon shall perish in the floods; and behold, I will shut them up; a prison have I prepared for them.'
  - where: note 8:30 “Those who perished in the Flood”
    claim: The Times and Seasons of 15 April 1842 (p. 760), after quoting 1 Peter 3:19–20, says the dead will come out of their prison on the same principle as those of Noah's day
    key: jsp-times-seasons-1842-04-15
    url: 'https://www.josephsmithpapers.org/paper-summary/times-and-seasons-15-april-1842/10'
    quote: 'will be visited by this priesthood, and come out of their prison, upon the same principle as those who were disobedient in the days of Noah, were visited by our Saviour'
  - where: christ
    claim: The order of the Son of God is the name of the priesthood Noah received
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'Before his day it was called the Holy Priesthood, after the Order of the Son of God.'
  - where: christ
    claim: Those who perished in the Flood could be taught the gospel and repent
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'There they would have the opportunity to be taught the gospel of Jesus Christ and repent of their sins.'
  - where: explore
    claim: Scripture Helps has a section on possible reasons God sent the Flood
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'What are some possible reasons God sent the Flood?'
