chapter: 2
claims:
  - where: when
    claim: The Church edition dates Moses 2 June–October 1830
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng'
    quote: '(June–October 1830)'
  - where: setting
    claim: Moses has seen God face to face on a high mountain
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'Moses was caught up into an exceedingly high mountain'
  - where: setting
    claim: Restoration scripture confirms Moses's central involvement, with Moses 2:1 among the passages named; Genesis names no author
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'Restoration scripture confirms Moses’s central involvement in these works of scripture (see 1 Nephi 5:10–11; Moses 1:40–41; 2:1).'
  - where: setting
    claim: The headnote calls the book an extract from the translation of the Bible
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'An extract from the translation of the Bible as revealed to Joseph Smith the Prophet, June 1830–February 1831.'
  - where: setting
    claim: Abraham 4 tells the Creation as the plan of the Gods (the Church's chapter heading)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'The Gods plan the creation of the earth and all life thereon'
  - where: thread
    claim: Count of verses with I, God (24 of Moses 2's 31 verses; run by occurrences.mjs); Moses 1:39 purpose
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng'
    quote: 'And I, God, said: Let there be light; and there was light.'
  - where: thread
    claim: Genesis 1 says God said, without the first person
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/1?lang=eng'
    quote: 'And God said, Let there be light: and there was light.'
  - where: thread
    claim: The purpose stated in Moses 1 is the lens through which the creation accounts are viewed
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'This prelude to the Creation with the focal point on God’s purposes to bring to pass our eternal life and salvation is the lens through which the creation accounts are viewed.'
  - where: note 2:1 “A revelation to Moses, and a command to write”
    claim: Moses 1:40 command to write
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'I will speak unto thee concerning this earth upon which thou standest; and thou shalt write the things which I shall speak.'
  - where: note 2:1 “A revelation to Moses, and a command to write”
    claim: Moses 2:1 is a revelation to Moses
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'This verse clearly defines that this is a revelation to Moses'
  - where: note 2:1 “A revelation to Moses, and a command to write”
    claim: Seeing may have been part of how Moses received it (inference)
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'then “seeing” may have been a part of the sensory experience and personal nature of what and how Moses was learning and experiencing the revelations'
  - where: note 2:1 “The Beginning and the End”
    claim: Beginning and End as titles show the Creator's governance over creation and time
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'help us see the close relationship between the Creator and his governance over the entirety of creation and temporality'
  - where: note 2:1 “The Beginning and the End”
    claim: Creation is temporal and has its beginning and end only in its Creator
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'the temporal nature of the Creation which has its “beginning” and “end” only in its Creator'
  - where: note 2:1 “The Beginning and the End”
    claim: Almighty God seems to refer to the Father, Only Begotten to the Son
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: '“Almighty God” seems to refer to the Father, while “Only Begotten” refers to the Son.'
  - where: note 2:1 “The Beginning and the End”
    claim: In Moses 2:26 Heavenly Father speaks to Jesus Christ
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'The book of Moses clarifies that Heavenly Father was speaking to Jesus Christ in this verse.'
  - where: note 2:1 “The Beginning and the End”
    claim: Moses 1:3 name
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'Behold, I am the Lord God Almighty, and Endless is my name'
  - where: note 2:1 “By mine Only Begotten”
    claim: Moses 1:39 and 1:32
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And by the word of my power, have I created them, which is mine Only Begotten Son, who is full of grace and truth.'
  - where: note 2:1 “By mine Only Begotten”
    claim: Moses 1, with its focus on God's purposes, is the lens through which the creation accounts are viewed
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'This prelude to the Creation with the focal point on God’s purposes to bring to pass our eternal life and salvation is the lens through which the creation accounts are viewed.'
  - where: note 2:1 “By mine Only Begotten”
    claim: Romney on Christ and the plan (as the chapter prints it)
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'Jesus Christ, through whom God created the universe, was chosen to put into operation throughout the universe Elohim’s great plan “to bring to pass the immortality and eternal life of man”'
  - where: note 2:1 “By mine Only Begotten”
    claim: The quotation is attributed to Elder Marion G. Romney
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'Elder Marion G. Romney summarized this vital truth this way'
  - where: note 2:1 “By mine Only Begotten”
    claim: Moses 2 makes clear Christ was the main figure responsible
    key: sc-knowhy-400
    url: 'https://scripturecentral.org/knowhy/why-do-we-have-three-different-accounts-of-the-creation'
    quote: 'Moses 2 makes it clear that Christ was the main figure responsible for the Creation.'
  - where: note 2:2 “Darkness that God caused”
    claim: Moses 2:2 highlights the power of God
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'The power of God is highlighted next in the account'
  - where: note 2:2 “Darkness that God caused”
    claim: In the creation accounts revealed to Moses God is in total control
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'God is in total control, has never lacked that control, and is never in danger of losing his power.'
  - where: note 2:2 “Darkness that God caused”
    claim: Moses had become familiar with darkness in Moses 1
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'something with which he had become frighteningly familiar as recorded in Moses 1'
  - where: note 2:2 “Darkness that God caused”
    claim: Moses will begin to understand God's power over the darkness
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'Moses will begin to understand God’s power over the darkness.'
  - where: note 2:2 “Darkness that God caused”
    claim: Calling upon God delivered Moses from darkness
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'calling upon God earlier in his life had delivered him from that darkness and brought him to receive more light (see Moses 1:12–26)'
  - where: note 2:2 “Darkness that God caused”
    claim: Genesis 1:2 says darkness was upon the deep, with no cause named
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/1?lang=eng'
    quote: 'darkness was upon the face of the deep'
  - where: note 2:3 “The voice of I, God”
    claim: The repeated phrase is in Moses 2:3–5 (count of 24 verses and 4 in Moses 3 from occurrences.mjs)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng'
    quote: 'And I, God, saw the light; and that light was good. And I, God, divided the light from the darkness.'
  - where: note 2:3 “The voice of I, God”
    claim: Repetition emphasizes firsthand nature
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: '“The repetition of the phrase ‘I, God’ throughout the chapter also emphasizes its firsthand nature.”'
  - where: note 2:3 “The voice of I, God”
    claim: First-person account personal to Moses
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'The first-person description in God’s own voice must have been personal and inspiring to the Lord’s new prophet'
  - where: note 2:5 “By the word of my power”
    claim: Moses 1:32 names the word
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And by the word of my power, have I created them, which is mine Only Begotten Son'
  - where: note 2:5 “By the word of my power”
    claim: Lectures on Faith on creation by faith and words
    key: pgp-manual-moses-2
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-2-1-31?lang=eng'
    quote: 'When a man works by faith he works by mental exertion instead of physical force. It is by words, instead of exerting his physical powers, with which every being works when he works by faith.'
  - where: note 2:5 “By the word of my power”
    claim: Faith works by words
    key: pgp-manual-moses-2
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-2-1-31?lang=eng'
    quote: 'Faith, then, works by words; and with these its mightiest works have been, and will be, performed.'
  - where: note 2:5 “By the word of my power”
    claim: Lectures on Faith, God said Let there be light
    key: pgp-manual-moses-2
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-2-1-31?lang=eng'
    quote: 'God said, ‘Let there be light: and there was light.’'
  - where: note 2:5 “By the word of my power”
    claim: At Moses 2:3 Moses comprehends the power of divine speech
    key: schade-bowen-moses-2-creation
    url: 'https://rsc.byu.edu/book-moses/moses-2-purpose-logistics-creation'
    quote: 'Once again Moses comprehends the power of divine speech.'
  - where: note 2:27 “In the image of the Only Begotten”
    claim: Verses 26-27 text
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng'
    quote: 'And I, God, created man in mine own image, in the image of mine Only Begotten created I him; male and female created I them.'
  - where: note 2:27 “In the image of the Only Begotten”
    claim: The commands shift from let there be to Let us make, indicating more than one being
    key: schade-bowen-moses-2-image
    url: 'https://rsc.byu.edu/book-moses/moses-2-image-likeness'
    quote: 'he now says, “Let us make,” indicating multiple beings involved in creation'
  - where: note 2:27 “In the image of the Only Begotten”
    claim: The first-person narrative shows the Father immediately involved at this stage
    key: schade-bowen-moses-2-image
    url: 'https://rsc.byu.edu/book-moses/moses-2-image-likeness'
    quote: 'The first-person narrative is strikingly personal as we see the Father immediately involved in this stage of creation.'
  - where: note 2:27 “In the image of the Only Begotten”
    claim: The Father's personal involvement shows the worth of His children (a reading)
    key: schade-bowen-moses-2-image
    url: 'https://rsc.byu.edu/book-moses/moses-2-image-likeness'
    quote: 'The Father’s personal involvement in the creation of humankind gives us some idea of the worth that we, his children, have in his sight'
