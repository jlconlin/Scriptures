    claim: Moses 1:32 and 1:39
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'by the word of my power, have I created them, which is mine Only Begotten Son, who is full of grace and truth'
