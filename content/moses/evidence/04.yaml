chapter: 4
claims:
  - where: setting
    claim: Moses 1 words were spoken when Moses was caught up into an exceedingly high mountain
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'The words of God, which he spake unto Moses at a time when Moses was caught up into an exceedingly high mountain,'
  - where: setting
    claim: Moses 4:1–4 is missing from Genesis
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'These are verses that are missing from the Genesis account.'
  - where: setting
    claim: Moses 4 was received about the same time as D&C 29 (September 1830)
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'Around the same time that Joseph received Moses 4, a September 1830 revelation would reveal to him more details on this subject'
  - where: setting
    claim: Satan came to Moses in Moses 1 claiming to be the Only Begotten, and the Lord draws on that experience in Moses 4
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'This refers to the events in Moses 1 in which the adversary had come to Moses claiming to be the Only Begotten (see v. 19).'
  - where: setting
    claim: Satan is called the father of all lies (the chapter's own statement; Satan's promise of salvation was a lie)
    key: mathews-satans-rebellion
    url: 'https://www.churchofjesuschrist.org/study/ensign/2015/03/satans-rebellion?lang=eng'
    quote: 'What Satan proposed was a lie. It would not have worked.'
  - where: 'note 4:1 “Why the chapter begins with Moses’ own encounter”'
    claim: The phrase refers back to Moses 1, where the adversary claimed to be the Only Begotten
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'This refers to the events in Moses 1 in which the adversary had come to Moses claiming to be the Only Begotten (see v. 19).'
  - where: 'note 4:1 “Why the chapter begins with Moses’ own encounter”'
    claim: The encounter struck Moses with fear for the adversary, who was posing as the Only Begotten
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'That incident struck Moses with fear for the adversary, who was posing as the Only Begotten'
  - where: 'note 4:1 “Why the chapter begins with Moses’ own encounter”'
    claim: Moses 1:13 and 1:16 (Moses’ words to Satan)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'Get thee hence, Satan; deceive me not; for God said unto me: Thou art after the similitude of mine Only Begotten.'
  - where: 'note 4:1 “Send me, and thy will be done”'
    claim: Abraham 3:27 has the same scene with the question “Whom shall I send?”
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'And the Lord said: Whom shall I send? And one answered like unto the Son of Man: Here am I, send me. And another answered and said: Here am I, send me. And the Lord said: I will send the first.'
  - where: 'note 4:1 “Send me, and thy will be done”'
    claim: Lucifer’s answer centers on himself; the Son’s answer gives the glory to the Father
    key: sc-knowhy-671
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-willing-and-unwilling-sons-teach-about-christ'
    quote: 'Lucifer’s response focuses inordinately on the man himself, seeking to draw the attention of those present'
  - where: 'note 4:1 “Send me, and thy will be done”'
    claim: D&C 29:36 gives Satan’s words as “Give me thine honor, which is my power”
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'for he rebelled against me, saying, Give me thine honor, which is my power'
  - where: 'note 4:3 “What destroying agency meant”'
    claim: Satan sought to destroy agency and dethrone God
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'He “sought to destroy the agency of man” and to dethrone God.'
  - where: 'note 4:3 “What destroying agency meant”'
    claim: The Father did not ask for competing plans; Satan’s proposal was a lie
    key: mathews-satans-rebellion
    url: 'https://www.churchofjesuschrist.org/study/ensign/2015/03/satans-rebellion?lang=eng'
    quote: 'our Heavenly Father did not ask for volunteers to invent and present different and competing plans of salvation, as some have assumed.'
  - where: 'note 4:3 “What destroying agency meant”'
    claim: The verses do not say how Satan would have carried out his proposal
    key: mathews-satans-rebellion
    url: 'https://www.churchofjesuschrist.org/study/ensign/2015/03/satans-rebellion?lang=eng'
    quote: 'these verses of scripture do not clearly state how Satan proposed to carry out this lie.'
  - where: 'note 4:3 “What destroying agency meant”'
    claim: J. Reuben Clark named two possibilities, compulsion or saving men in sin, and said neither would work
    key: mathews-satans-rebellion
    url: 'https://www.churchofjesuschrist.org/study/ensign/2015/03/satans-rebellion?lang=eng'
    quote: 'Satan’s plan required one of two things: Either the compulsion of … man, or else saving men in sin. I question whether the intelligence of man can be compelled. Certainly men cannot be saved in sin'
  - where: 'note 4:4 “From Lucifer to Satan”'
    claim: Lucifer is called a son of the morning and Perdition, and the heavens wept over him (D&C 76:25–27)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'And was called Perdition, for the heavens wept over him—he was Lucifer, a son of the morning.'
  - where: 'note 4:4 “From Lucifer to Satan”'
    claim: Satan is Hebrew for adversary; he became Satan after being Lucifer
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'What he became was Satan, a Hebrew word meaning “adversary.”'
  - where: 'note 4:4 “From Lucifer to Satan”'
    claim: He became fallen through his own choices
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'However, the adversary was not cheated; he became fallen and lost because of his rebellion against God and the choices he himself had made.'
  - where: 'note 4:4 “From Lucifer to Satan”'
    claim: Joseph Fielding Smith, that he knew what he was doing
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'The adversary knew exactly what he was doing and he became perdition.'
  - where: 'note 4:4 “From Lucifer to Satan”'
    claim: Isaiah’s comparison of the king of Babylon’s fall is read as describing the adversary’s fall
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'By using a comparison with the fall of the mighty king of Babylon, Isaiah described the great fall of the adversary in the premortal councils:'
  - where: 'note 4:6 “Two ways to read Satan’s ignorance of God’s mind”'
    claim: 'Talmage: Satan furthered the Creator’s purposes by tempting Eve though he meant to thwart them'
    key: pgp-manual-moses-4
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-4-1-19?lang=eng'
    quote: 'Yet his diabolical effort, far from being the initiatory step toward destruction, contributed to the plan of man’s eternal progression'
  - where: 'note 4:6 “Two ways to read Satan’s ignorance of God’s mind”'
    claim: The phrase could mean Satan misunderstood the plan, or that he rejected it
    key: schade-bowen-fall
    url: 'https://rsc.byu.edu/book-moses/moses-4-fall-doctrinal-perspectives-insights'
    quote: 'could mean that the adversary simply did not understand the plan of God and that he was unwittingly destroying himself and defeating his own diabolical designs by tempting Adam and Eve to partake of the fruit.'
  - where: 'note 4:6 “Two ways to read Satan’s ignorance of God’s mind”'
    claim: The second reading
    key: schade-bowen-fall
    url: 'https://rsc.byu.edu/book-moses/moses-4-fall-doctrinal-perspectives-insights'
    quote: 'the adversary does not see as God sees, know as God knows, or desire what God desires'
  - where: 'note 4:18 “Adam and the command to remain with Eve”'
    claim: The Moses wording stresses the commandment that Eve remain with Adam, and the text implies his choice was an act of love
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'the emphasis on God’s commandment that Eve remain with him accentuates why Adam chose his wife over refraining from partaking of the fruit.'
  - where: 'note 4:18 “Adam and the command to remain with Eve”'
    claim: Schade and Bowen quote Christensen’s reading of Moses 4:18
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'Adam concluded that God’s command to remain with his wife (see Moses 4:18) was more important than His command to abstain from the fruit.'
  - where: 'note 4:30 “Words that cannot return void”'
    claim: God’s words in 4:30 are not the end; redemption would come
    key: schade-bowen-fall
    url: 'https://rsc.byu.edu/book-moses/moses-4-fall-doctrinal-perspectives-insights'
    quote: 'The good news was that this was not the end; it was a beginning, and redemption would come upon all who would be affected by the partaking of the fruit.'
  - where: christ
    claim: The seed of the woman refers to Jesus Christ; His power over Satan
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'The seed of the woman refers to Jesus Christ, who was a descendant of Eve and Adam.'
  - where: christ
    claim: The Son was chosen from the beginning and sustained the Father’s plan
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'Jesus Christ, the “Beloved and Chosen from the beginning,” sustained Heavenly Father’s plan.'
  - where: explore
    claim: The RSC volume has a chapter on Moses 4 titled “The Council in Heaven”
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'Moses 4: The Council in Heaven'
  - where: setting
    claim: In Genesis the serpent comes out of nowhere
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'The serpent comes out of nowhere, and readers are left to wonder about its origin and design.'
  - where: 'note 4:3 “What destroying agency meant”'
    claim: What Satan proposed was a lie that would not have worked
    key: mathews-satans-rebellion
    url: 'https://www.churchofjesuschrist.org/study/ensign/2015/03/satans-rebellion?lang=eng'
    quote: 'What Satan proposed was a lie. It would not have worked.'
  - where: 'note 4:4 “From Lucifer to Satan”'
    claim: D&C 76 is a February 1832 revelation
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'In a February 1832 revelation, Joseph Smith learned of this sad outcome of rebellion'
  - where: explore
    claim: The RSC volume's chapters on Moses 4 (Fall)
    key: schade-bowen-fall
    url: 'https://rsc.byu.edu/book-moses/moses-4-fall-doctrinal-perspectives-insights'
    quote: 'Moses 4: The Fall—Doctrinal Perspectives and Insights'
  - where: explore
    claim: The RSC volume's chapters on Moses 4 (Fruit)
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'Moses 4: Partaking of the Fruit—Knowledge, Accountability, and Redemption'
  - where: when
    claim: 'The Church’s edition dates Moses 4 to June–October 1830'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: '(June–October 1830)'
  - where: 'note 4:1 “Send me, and thy will be done”'
    claim: 'Lucifer’s response stands in contrast to the answer of Jesus Christ in Moses 4:2'
    key: sc-knowhy-671
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-willing-and-unwilling-sons-teach-about-christ'
    quote: 'Such a lofty response stands in stark contrast to the answer of Jesus Christ: “Father, thy will be done, and the glory be thine forever”'
  - where: 'note 4:3 “What destroying agency meant”'
    claim: 'In rebellion Satan proposed an alternative to the Father’s established plan'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'In rebellion, Satan proposed an alternative to the Father’s already established plan.'
  - where: 'note 4:18 “Adam and the command to remain with Eve”'
    claim: 'Adam concluded that the command to remain with his wife (Moses 4:18) outweighed the command to abstain; thus Adam fell that men might be'
    key: christensen-choice-mortality
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/01/the-choice-that-began-mortality?lang=eng'
    quote: 'Adam concluded that God’s command to remain with his wife (see Moses 4:18) was more important than His command to abstain from the fruit. Thus in the face of this enticement, “Adam fell that men might be” (2 Ne. 2:25).'
  - where: 'note 4:30 “Words that cannot return void”'
    claim: 'Verses 30–31 show God letting the consequences of the transgression follow'
    key: schade-bowen-fall
    url: 'https://rsc.byu.edu/book-moses/moses-4-fall-doctrinal-perspectives-insights'
    quote: 'When the command was transgressed, God let the consequences follow.'
