chapter: 5
claims:
  - where: 'when'
    claim: 'The Book of Moses is an extract from the translation revealed to Joseph Smith, June 1830–February 1831'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'An extract from the translation of the Bible as revealed to Joseph Smith the Prophet, June 1830–February 1831.'
  - where: 'setting'
    claim: 'The Church heading summarizes the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'Adam and Eve bring forth children—Adam offers sacrifice and serves God'
  - where: 'setting'
    claim: 'Moses 5 presents the devil and his temptations, which the Bible leaves out'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'Moses 5 presents us with crucial pieces of information inferred from but explicitly absent from the Bible: the existence of the devil, his temptations, and his attempting to lead Adam and Eve’s children away from God.'
  - where: 'setting'
    claim: 'Genesis is silent on where sacrifice began'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'This is vital information since the story in Genesis is silent on the origin of the practice of sacrifice but seems to indicate that at some point instruction came.'
  - where: 'note 5:4 “Out of Eden, but still hearing the voice”'
    claim: 'The 1835 Doctrine and Covenants, commenting on this passage: the first parents retained a knowledge of God though separated from His presence by a veil'
    key: jsp-dc-1835
    url: 'https://www.josephsmithpapers.org/paper-summary/doctrine-and-covenants-1835/25'
    quote: 'though our first parents were driven out of the garden of Eden, and were even separated from the presence of God, by a vail, they still retained a knowledge of his existence, and that sufficiently to move them to call upon him.'
  - where: 'note 5:4 “Out of Eden, but still hearing the voice”'
    claim: 'They continued to hear God’s voice and were taught how to worship to regain his presence'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'Although Adam and Eve had been shut out from the presence of God, they continued to hear his voice coming from the garden and were instructed how to worship so they could regain his presence.'
  - where: 'note 5:6 “A commandment before an explanation”'
    claim: 'Moses 5 shows the law of sacrifice did not originate with Moses'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'The origins of sacrifice and the reasons behind it are affirmed in Moses 5, which demonstrates that the law of sacrifice did not originate with Moses.'
  - where: 'note 5:6 “A commandment before an explanation”'
    claim: 'Genesis does not say where the practice of sacrifice came from'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'the story in Genesis is silent on the origin of the practice of sacrifice but seems to indicate that at some point instruction came.'
  - where: 'note 5:7 “What the sacrifice stood for”'
    claim: 'Sacrifice pointed forward to the Son of God'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'The symbolism of sacrifice became sacred because it pointed forward toward an infinite sacrifice to be performed by the Son of God.'
  - where: 'note 5:7 “What the sacrifice stood for”'
    claim: 'Moses 5:7 is cited as support for reading the sacrifices of the law as pointing to Christ'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'The verse Jacob is alluding to here, Moses 5:7, supports this interpretation. In this verse, an angel explained to Adam that animal sacrifices are “a similitude of the sacrifice of the Only Begotten of the Father.”'
  - where: 'note 5:7 “What the sacrifice stood for”'
    claim: 'Amulek’s words are cited with Moses 5:7 for the same meaning of sacrifice'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'Amulek also testified that “this is the whole meaning of the law, every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God”'
  - where: 'note 5:7 “What the sacrifice stood for”'
    claim: 'Elder McConkie: saints from Adam on offered sacrifices in similitude of the Lamb; a fit similitude for a pastoral people'
    key: pgp-manual-moses-5-1-15
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-5-1-15?lang=eng'
    quote: 'all of the saints offered sacrifices in similitude of the sacrifice of the Lamb of God. … For a pastoral people whose lives depended on their flocks and herds, there could have been no better similitude than this'
  - where: 'note 5:9 “The Holy Ghost bears record in the Son’s own words”'
    claim: 'Old Testament Revision 1 reads “I am Jesus Christ” in Moses 5:9'
    key: jsp-ot1
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-1/10'
    quote: 'the Holy Ghost fell upon Adam which bore record of the Father & the Son saying I am Jesus Christ from the beginning henceforth & forever'
  - where: 'note 5:9 “The Holy Ghost bears record in the Son’s own words”'
    claim: 'The printed “I am the Only Begotten of the Father” agrees with Old Testament Revision 2'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'OT1 reads “I am Jesus Christ,” and “I am the Only Begotten of the Father” is consistent with OT2.'
  - where: 'note 5:9 “The Holy Ghost bears record in the Son’s own words”'
    claim: 'The 1835 Doctrine and Covenants, commenting on this passage: the Holy Spirit was given as soon as the plan of redemption was revealed and man called on God'
    key: jsp-dc-1835
    url: 'https://www.josephsmithpapers.org/paper-summary/doctrine-and-covenants-1835/25'
    quote: 'no sooner was the plan of redemption revealed to man, and he began to call upon God, than the Holy Spirit was given, bearing record of the Father and Son.'
  - where: 'note 5:11 “Eve’s gratitude”'
    claim: 'Adam and Eve understood redemption and its joy as the Holy Ghost testified'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'As the Holy Ghost testified, Adam and Eve began to understand more perfectly what redemption was and the joy it brought them.'
  - where: 'note 5:11 “Eve’s gratitude”'
    claim: 'Adam seems to focus on the first part of Moses 1:39; their two views together make up the plan'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'views that collectively constituted the plan in its entirety and highlighted their need for each other and what the commandment for them to “be one” could help them accomplish. Adam seems to focus on the first part of Moses 1:39'
  - where: 'note 5:11 “Eve’s gratitude”'
    claim: 'Eve’s words focus on the second part of Moses 1:39'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'Eve expressed gratitude for the opportunity to have a family, for the ability to know good from evil, and to understand the joy of redemption and eternal life (see v. 11), thus focusing on the second part of Moses 1:39'
  - where: 'note 5:13 “Satan’s first words to the family”'
    claim: 'Moses 5 supplies the devil’s temptations of the children, absent from the Bible'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'the existence of the devil, his temptations, and his attempting to lead Adam and Eve’s children away from God.'
  - where: 'note 5:13 “Satan’s first words to the family”'
    claim: '“Believe it not” is read as referring to what Adam and Eve had taught their children'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'who tried to deceive their children by proclaiming “I am also a son of God” and, referring to their parents’ teachings, commanding “Believe it not.”'
  - where: 'note 5:13 “Satan’s first words to the family”'
    claim: 'President Benson: Satan comes to pervert revealed doctrine, saying “Believe it not”'
    key: pgp-manual-moses-5-1-15
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-5-1-15?lang=eng'
    quote: 'Whenever the God of Heaven establishes by revelation his design, Satan always comes among men to pervert the doctrine, saying, ‘Believe it not.’ He often establishes a counterfeit system'
  - where: 'note 5:13 “Satan’s first words to the family”'
    claim: 'Some listened and some did not; agency was real in the first family’s response'
    key: schade-bowen-moses-5-family
    url: 'https://rsc.byu.edu/book-moses/moses-5-family-adam-eve-law-sacrifice'
    quote: 'agency was a very real part of the equation.'
  - where: 'note 5:40 “The curse and the mark are separate”'
    claim: 'The curse has three elements (the ground, wandering, being driven from the Lord’s face), the third being separation from the Lord'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: '3. Cain would experience spiritual death and be driven from the face of the Lord'
  - where: 'note 5:40 “The curse and the mark are separate”'
    claim: 'Those elements are the whole curse, and the mark is separate from it'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'These elements constitute the curse, and there really are no other components to it. The “mark” that follows is separate from the curse'
  - where: 'note 5:40 “The curse and the mark are separate”'
    claim: 'The mark reminded people to leave judgment of Cain to the Lord'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'The mark was to remind people to leave judgment to the Lord, who would deal with Cain on his own terms'
  - where: 'note 5:40 “The curse and the mark are separate”'
    claim: 'The Church’s counsel: avoid speculating about the mark or that the curse applied to anyone but Cain; the Church rejects racial and cultural prejudice'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'We should avoid speculating about the nature or appearance of the mark placed on Cain or that the curse applied to anyone other than him. The Church rejects and condemns racial and cultural prejudice in any form.'
  - where: 'note 5:51 “Secret combinations from Cain’s day”'
    claim: 'Secret combinations are connected with Cain’s slaying of Abel'
    key: sc-knowhy-585
    url: 'https://scripturecentral.org/knowhy/why-are-secret-combinations-associated-with-cain-and-getting-gain'
    quote: 'By recognizing the connection between secret combinations and Cain’s initial slaying of Abel, we are better able to appreciate how insidious and ancient these conspiracies or private coalitions truly are.'
  - where: 'note 5:51 “Secret combinations from Cain’s day”'
    claim: 'The Book of Mormon associates secret combinations with blood crying from the ground, as in Cain’s story'
    key: sc-knowhy-585
    url: 'https://scripturecentral.org/knowhy/why-are-secret-combinations-associated-with-cain-and-getting-gain'
    quote: 'Another line of evidence comes from the way that secret combinations are often associated with the imagery of blood or voices of slain prophets or saints crying from the earth.'
  - where: 'note 5:58 “Three ways the gospel came”'
    claim: 'God gave the gospel to Adam and Eve by His voice, angels and the Holy Ghost (Moses 5:4–9)'
    key: pgp-manual-moses-5-16-59
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-5-16-59?lang=eng'
    quote: 'Moses 5:4–9 explains that God gave the gospel to Adam and Eve by His own voice, through angels, and by the Holy Ghost.'
  - where: 'note 5:58 “Three ways the gospel came”'
    claim: 'Confirmed meant made more firm, strengthened, established in 1828 usage (cited by the manual)'
    key: pgp-manual-moses-5-16-59
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-5-16-59?lang=eng'
    quote: 'the word confirmed is defined as “made more firm; strengthened; or established.”'
  - where: 'note 5:58 “Three ways the gospel came”'
    claim: 'On Moses 5:58–59: angels, the gift of the Holy Ghost, and ordinances remained the Lord’s means of leading His children back'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'The Lord continued to build faith in his Only Begotten Son, and holy angels, the gift of the Holy Ghost, and ordinances would be a significant part of those efforts to lead his children back to him.'
  - where: 'christ'
    claim: 'Sacrifice symbolized the Atonement; Adam and Eve rejoiced in Christ'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'He also clothed them and gave them the law of sacrifice, which symbolized the atoning sacrifice of Jesus Christ. Adam and Eve rejoiced in Christ and began the human family.'
  - where: 'explore'
    claim: 'Scripture Helps chapter for Genesis 3–4; Moses 4–5 covers these verses'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'Moses 5:9–11: Why did Adam and Eve rejoice after being cast out of the Garden of Eden?'
