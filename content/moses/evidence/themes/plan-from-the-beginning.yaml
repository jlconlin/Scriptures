page: plan-from-the-beginning
claims:
  - where: 'section “Adam and Eve understand, and teach”'
    claim: '“Gospel” occurs in Moses only at 5:58, 5:59 and 8:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'And thus the Gospel began to be preached, from the beginning, being declared by holy angels sent forth from the presence of God, and by his own voice, and by the gift of the Holy Ghost.'
  - where: 'section “Adam and Eve understand, and teach”'
    claim: '“Gospel” occurs again at 8:19 (the third and last occurrence in Moses)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'declare his Gospel unto the children of men, even as it was given unto Enoch'
  - where: 'section “This is the plan of salvation”'
    claim: '“Plan of salvation” occurs in Moses only at 6:62'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'This is the plan of salvation unto all men, through the blood of mine Only Begotten, who shall come in the meridian of time.'
  - where: 'section “This is the plan of salvation”'
    claim: '“Jesus Christ” is first named in Moses at 6:52, in words God spoke to Adam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'be baptized, even in water, in the name of mine Only Begotten Son, who is full of grace and truth, which is Jesus Christ'
  - where: 'section “The same words”'
    claim: '“Full of grace and truth” occurs in five verses of Moses: 1:6, 1:32, 5:7, 6:52 and 7:11; 5:7 side'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth.'
  - where: 'section “The same words”'
    claim: '“Full of grace and truth” and “in the name of the Father, and of the Son” at 7:11; the Holy Ghost “beareth record of the Father and the Son” at 7:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'baptize in the name of the Father, and of the Son, which is full of grace and truth, and of the Holy Ghost, which beareth record of the Father and the Son.'
  - where: 'section “The same words”'
    claim: 'The Holy Ghost “beareth record of the Father and the Son” at 5:9 (its three uses in Moses are 1:24, 5:9 and 7:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'the Holy Ghost fell upon Adam, which beareth record of the Father and the Son'
  - where: 'section “From the beginning”'
    claim: 'After the Fall God made known the plan of redemption, prepared from the foundation of the world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/12?lang=eng'
    quote: 'God conversed with men, and made known unto them the plan of redemption, which had been prepared from the foundation of the world'
  - where: 'section “From the beginning”'
    claim: 'The plan of salvation has been taught in every dispensation beginning with Adam and is the same in every age'
    key: bd-dispensations
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dispensations?lang=eng'
    quote: 'The plan of salvation, which is older than the earth, has been revealed and taught in every dispensation beginning with Adam and is the same in every age of the world.'
  - where: 'section “From the beginning”'
    claim: 'Adam and Eve were this planet’s first humans and first Christians'
    key: maxwell-from-the-beginning-1993
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1993/10/from-the-beginning?lang=eng'
    quote: 'We believe Adam and Eve were this planet’s first humans and first Christians.'
  - where: 'section “From the beginning”'
    claim: 'The Church’s Joseph Smith manual prints the 1834 passage on all who were saved through the plan of redemption'
    key: tpjs-2007-ch-3
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-3?lang=eng'
    quote: 'all that were ever saved, were saved through the power of this great plan of redemption'
  - where: 'section “From the beginning”'
    claim: 'The March 1834 letter says all who were ever saved were saved through the plan of redemption, as much before Christ as since'
    key: jsp-letter-1834-03
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-circa-march-1834/2'
    quote: 'all that were ever saved, were saved through the power of this great plan of redemption, as much so before the coming of Christ as since'
  - where: 'section “The same words”'
    claim: 'Connection made by this page: the “in the name of” wording of 5:8, 6:52, 7:11 and 8:24 set side by side; the phrase occurs in nine verses of Moses (also 1:17, 1:21, 4:1, 7:50, 7:59); no source read compares them phrase by phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'be baptized in the name of Jesus Christ, the Son of God, even as our fathers'
  - where: 'section “Noah”'
    claim: 'Noah taught the things of God, even as it was in the beginning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'taught the things of God, even as it was in the beginning'
  - where: 'section “From the beginning”'
    claim: 'The March 1834 letter was sent in the name of the elders of the Church in Kirtland'
    key: jsp-letter-1834-03
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-circa-march-1834/2'
    quote: 'THE ELDERS OF THE CHURCH IN KIRTLAND, TO THEIR BRETHREN ABROAD.'
  - where: 'section “From the beginning”'
    claim: 'Moses 5:57: the Son prepared from before the foundation of the world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'who was prepared from before the foundation of the world'
