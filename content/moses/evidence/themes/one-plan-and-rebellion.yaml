page: one-plan-and-rebellion
claims:
  - where: 'opening'
    claim: 'Moses 4:1 refers back to Moses 1 (the encounter in which the adversary claimed to be the Only Begotten)'
    key: schade-bowen-council
    url: 'https://rsc.byu.edu/book-moses/moses-4-council-heaven'
    quote: 'This refers to the events in Moses 1 in which the adversary had come to Moses claiming to be the Only Begotten (see v. 19).'
  - where: 'section “Son and father”'
    claim: 'Connection made by this page: the words “son” and “father” in Satan’s mouth and of him (Moses 4:1, 4:4, 5:13, 5:24, 7:37; Satan’s other uses, of men, are “son of man” at 1:12 and “thy father” at 5:29; also “son of man” at 1:12) set beside the Son’s “Father, thy will be done”; a comparison of quoted words only, no source cited here sets them together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: 'Behold, here am I, send me, I will be thy son, and I will redeem all mankind, that one soul shall not be lost, and surely I will do it; wherefore give me thine honor.'
  - where: 'section “Whom shall I send”'
    claim: 'Heavenly Father presented His plan of salvation in the Council in Heaven'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'In the premortal Council in Heaven, our Heavenly Father presented His plan of salvation.'
  - where: 'section “Whom shall I send”'
    claim: 'Only one plan was presented in the premortal council, the Father’s'
    key: bednar-divine-nature-2026
    url: 'https://www.churchofjesuschrist.org/study/liahona/2026/01/03-partakers-of-the-divine-nature?lang=eng'
    quote: 'Note that only one plan was presented in the premortal council—the Father’s plan.'
  - where: 'section “Whom shall I send”'
    claim: 'Lucifer did not present a plan that was voted down; he rebelled'
    key: bednar-divine-nature-2026
    url: 'https://www.churchofjesuschrist.org/study/liahona/2026/01/03-partakers-of-the-divine-nature?lang=eng'
    quote: 'Lucifer did not present a plan that was voted down by a majority of the participants in the premortal council'
  - where: 'section “Whom shall I send”'
    claim: 'The question put was whom to send to carry out the plan'
    key: bednar-divine-nature-2026
    url: 'https://www.churchofjesuschrist.org/study/liahona/2026/01/03-partakers-of-the-divine-nature?lang=eng'
    quote: 'The essence of His question focused upon who should be sent to execute the terms and conditions of His plan.'
  - where: 'section “Rebelled”'
    claim: 'What Satan proposed was a lie and would not have worked'
    key: mathews-satans-rebellion
    url: 'https://www.churchofjesuschrist.org/study/ensign/2015/03/satans-rebellion?lang=eng'
    quote: 'What Satan proposed was a lie. It would not have worked.'
  - where: 'section “Whom shall I send”'
    claim: 'In Moses, “plan” occurs once, at 6:62 (“the plan of salvation”); none of 4:1–4 has it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'This is the plan of salvation unto all men, through the blood of mine Only Begotten, who shall come in the meridian of time.'
  - where: 'section “Rebelled”'
    claim: 'The scriptures do not clearly state how Satan proposed to carry out his lie'
    key: mathews-satans-rebellion
    url: 'https://www.churchofjesuschrist.org/study/ensign/2015/03/satans-rebellion?lang=eng'
    quote: 'Importantly, these verses of scripture do not clearly state how Satan proposed to carry out this lie.'
  - where: 'section “Rebelled”'
    claim: 'A manual describes Satan’s proposal as based on compulsion'
    key: pgp-manual-moses-4
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-4-1-19?lang=eng'
    quote: 'However, his proposal was based on compulsion and would therefore eliminate the agency of Heavenly Father’s children and the need for a Savior to suffer and redeem them.'
  - where: 'section “Satan claims the Son’s title”'
    claim: 'Satan’s claim reveals his objectives, including to supplant and usurp the role of Jesus Christ'
    key: pgp-manual-moses-1-12-23
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-1-12-23?lang=eng'
    quote: 'It also reveals Satan’s basic objectives: to seek Heavenly Father’s power and glory and to supplant and usurp the role of Jesus Christ.'
  - where: 'section “A chain over the earth”'
    claim: 'The manual ties Moses 7:26–28 to Moses 4:4 (lead captive at his will)'
    key: pgp-manual-moses-7-1-41
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-7-1-41?lang=eng'
    quote: 'Satan promotes works of darkness and seeks to bind, captivate, and destroy mankind (see 2 Nephi 26:22; 28:17–23; Alma 12:11; Moses 4:4).'
  - where: 'section “A chain over the earth”'
    claim: 'The manual ties Moses 7:37 to Moses 4:4 (lead captive at his will)'
    key: pgp-manual-moses-7-1-41
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-7-1-41?lang=eng'
    quote: 'Satan’s goal is to deceive and to blind all mankind; to lead every one of God’s children captive at his will, if they will not hearken to the voice of the Lord (see Moses 4:4).'
  - where: 'section “The Chosen”'
    claim: 'The Church edition’s footnote on “Chosen” (Moses 7:39) points to Moses 4:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'Moses 4:2; Abr. 3:27.'
  - where: 'section “The Chosen”'
    claim: 'The Church edition’s footnote on “that” (Moses 7:39) reads “IE the Savior”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'IE the Savior.'
  - where: 'section “Thy will be done”'
    claim: 'A manual sets Moses 4:2, Matt. 26:39 and 3 Ne. 11:11 in one row'
    key: nt-teacher-manual-matt-26
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-teacher-manual/the-gospel-according-to-st-matthew/lesson-9-matthew-26?lang=eng'
    quote: 'Moses 4:2 | Matthew 26:39 | 3 Nephi 11:11'
  - where: 'section “Thy will be done”'
    claim: 'Jesus submitted to His Father’s will in the premortal world and in mortality, and bore witness of it after the Resurrection'
    key: nt-teacher-manual-matt-26
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-teacher-manual/the-gospel-according-to-st-matthew/lesson-9-matthew-26?lang=eng'
    quote: 'Students should understand that Jesus Christ submitted to His Father’s will in the premortal world and in mortality. Jesus also bore witness of His submission following His Resurrection.'
  - where: 'section “Son and father”'
    claim: 'Satan becomes “father” to those who choose to follow him'
    key: pgp-manual-moses-7-1-41
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-7-1-41?lang=eng'
    quote: 'to those who choose to follow him'
