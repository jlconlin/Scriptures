chapter: 7
claims:
  - where: when
    claim: Joseph Smith received the revelation of Moses 7 around mid-December 1830
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'Sometime around mid-December 1830, the Prophet Joseph Smith received the revelation of Moses 7.'
  - where: setting
    claim: D&C 37 on December 30 told Joseph and Sidney Rigdon to pause translating until Ohio
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'It is not expedient in me that ye should translate any more until ye shall go to the Ohio'
  - where: setting
    claim: Rigdon was scribe while Joseph received Moses 7
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'Joseph had been receiving the text of Moses 7 and Sidney Rigdon had been serving as his scribe.'
  - where: setting
    claim: Enoch's visions run from his own day to the Millennium
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'He saw a vision of the earth’s history from his own day to the Millennium.'
  - where: thread
    claim: Enoch is told to be glad and look, and then sees the Lamb slain
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'Lift up your heart, and be glad; and look.'
  - where: thread
    claim: Enoch's sorrow is turned to hope by what he is shown of the Atonement of Christ
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'The Lord revealed to Enoch that through the atonement of Christ there was eternal hope.'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: Little is known of the people of Canaan before the Flood
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'Little is known about the people of Canaan who lived before the Flood.'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: No evidence the people of Canaan are related to Cain, to the land of Cainan, to Noah's grandson Canaan or later Canaanites
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'Despite the similarity in name, there is no scriptural evidence to suggest that these people are related to Cain.'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: Blackness was not part of the curse, which was on the land
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'This “blackness” was not part of the Lord’s curse, which was directed at the land itself.'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: Meaning is unclear; nothing in the text justifies dark skin
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'What “blackness” means in this verse is unclear. Some have assumed that “blackness” is referring to dark skin color, but there is nothing in the text to justify this interpretation.'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: Webster 1828 definitions of black and blackness
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'definitions of the words black and blackness included “darkness,” “destitute of light,” and “atrociously wicked”'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: The Book of Moses used blackness of a lack of spiritual light
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'Elsewhere in the book of Moses, the word blackness was associated with a lack of spiritual light.'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: Moses 1:15 manuscript wording
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'Where is thy glory, for it is blackness unto me? And I can judge between thee and God'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: The word was changed to darkness in later editions
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'The word blackness was changed to darkness in later editions'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: Scripture Central concludes of Moses 7:8 that black almost certainly means something other than skin color
    key: sc-knowhy-836
    url: 'https://scripturecentral.org/knowhy/what-were-the-curse-and-mark-of-cain'
    quote: 'The word “black” in this context almost certainly means something other than skin-color.'
  - where: 'note 7:8 “Blackness on the children of Canaan”'
    claim: The argument rests on Webster's sense of wickedness and the context of Moses 7, which speaks of wickedness and righteousness
    key: sc-knowhy-836
    url: 'https://scripturecentral.org/knowhy/what-were-the-curse-and-mark-of-cain'
    quote: 'that definition fits the context of Moses 7 much better than a reference to skin color does, as the surrounding text refers clearly to people’s wickedness or righteousness'
  - where: 'note 7:22 “The seed of Cain were black”'
    claim: Meaning of black in verse 22 is unclear; earlier description of Cain's posterity
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'the meaning of the word “black” in verse 22 is unclear. A description of Cain’s posterity found earlier in the book of Moses mentions that God did not minister unto them because “their works were in the dark” and “they kept not the commandments of God.”'
  - where: 'note 7:22 “The seed of Cain were black”'
    claim: No indication mark passed on
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'There is no indication in the scriptures that Cain’s mark was passed on to his posterity.'
  - where: 'note 7:22 “The seed of Cain were black”'
    claim: Dark-skin idea traced to the Middle Ages
    key: sc-knowhy-836
    url: 'https://scripturecentral.org/knowhy/what-were-the-curse-and-mark-of-cain'
    quote: 'The idea that the mark of Cain had something to do with dark skin can be traced no earlier than to the Middle Ages'
  - where: 'note 7:22 “The seed of Cain were black”'
    claim: In the Church's past the curse of Cain was often put forward to justify the priesthood and temple restrictions
    key: gte-race-priesthood
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng'
    quote: 'The curse of Cain was often put forward as justification for the priesthood and temple restrictions.'
  - where: 'note 7:22 “The seed of Cain were black”'
    claim: The Church disavows the theories
    key: gte-race-priesthood
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng'
    quote: 'Today, the Church disavows the theories advanced in the past that black skin is a sign of divine disfavor or curse'
  - where: 'note 7:22 “The seed of Cain were black”'
    claim: The verse's own words
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'for the seed of Cain were black, and had not place among them.'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: The Lord's definition of Zion in D&C 97:21
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'Therefore, verily, thus saith the Lord, let Zion rejoice, for this is Zion—the pure in heart'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: D&C 97 was given August 2, 1833, about the Saints in Zion, Jackson County, Missouri (section heading)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet, at Kirtland, Ohio, August 2, 1833. This revelation deals particularly with the affairs of the Saints in Zion, Jackson County, Missouri'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: The Saints were then under severe persecution and had been forced to sign an agreement to leave Jackson County (section heading)
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'Members of the Church in Missouri were at this time subjected to severe persecution and, on July 23, 1833, had been forced to sign an agreement to leave Jackson County.'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: D&C 97:21 defines Zion beyond geography
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'the Lord defined Zion in terms beyond the narrow confines of geography'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: Joseph Smith's statement about one heart and one mind refers to Enoch's Zion
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'In so saying, he was directly referencing Enoch and the Zion society that Enoch established.'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: Christofferson on Zion as the character of its citizens, quoting Moses 7:18
    key: christofferson-come-to-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/10/come-to-zion?lang=eng'
    quote: 'Zion is Zion because of the character, attributes, and faithfulness of her citizens.'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: Christofferson's three requirements drawn from the verse
    key: christofferson-come-to-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/10/come-to-zion?lang=eng'
    quote: '(1) to become unified in one heart and one mind; (2) to become, individually and collectively, a holy people; and (3) to care for the poor and needy with such effectiveness that we eliminate poverty among us.'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: Joseph Smith's words in the minutes of 25–26 October 1831
    key: jsp-minutes-1831-10-25
    url: 'https://www.josephsmithpapers.org/paper-summary/minutes-25-26-october-1831/2'
    quote: 'in perfect faith the vail might as well be rent to day as next week or any other time'
  - where: 'note 7:18 “Zion defined by its people”'
    claim: Joseph Smith quotation on one heart and one mind and the veil, as the BYU chapter prints it whole
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'could we all come together with one heart and one mind in perfect faith the vail might as well be rent to day as next week or any other time'
  - where: 'note 7:21 “Zion “taken up into heaven””'
    claim: Definition of translated beings
    key: gs-translated-beings
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/translated-beings?lang=eng'
    quote: 'Persons who are changed so that they do not experience pain or death until their resurrection to immortality.'
  - where: 'note 7:21 “Zion “taken up into heaven””'
    claim: D&C 38:4 states the Lord took Zion of Enoch into His bosom
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'I am the same which have taken the Zion of Enoch into mine own bosom'
  - where: 'note 7:21 “Zion “taken up into heaven””'
    claim: The Lord's appearances form a series that ends in Zion taken to God's bosom
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'theophanies that eventuated in Zion being taken to God’s “bosom” (v. 69)'
  - where: 'note 7:21 “Zion “taken up into heaven””'
    claim: The appearances began on the mount Simeon
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'These theophanies began with the Lord’s face-to-face appearance to Enoch on the mount Simeon'
  - where: 'note 7:28 “Enoch’s astonishment that God weeps”'
    claim: What was at issue was the love and obedience of God's children
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'but what he did not have: the love and obedience of his children who pitted their wills in opposition to his.'
  - where: 'note 7:28 “Enoch’s astonishment that God weeps”'
    claim: For Enoch God had and was everything
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'For Enoch, God had and was everything.'
  - where: 'note 7:28 “Enoch’s astonishment that God weeps”'
    claim: Holland on the scene teaching the nature of God
    key: holland-grandeur-of-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2003/10/the-grandeur-of-god?lang=eng'
    quote: 'That single, riveting scene does more to teach the true nature of God than any theological treatise could ever convey.'
  - where: 'note 7:28 “Enoch’s astonishment that God weeps”'
    claim: Holland sets beside it the olive tree allegory where the Lord weeps and asks what more he could do
    key: holland-grandeur-of-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2003/10/the-grandeur-of-god?lang=eng'
    quote: 'the great Lord of the vineyard throws down his spade and his pruning shears and weeps, crying out to any who would listen, “What could I have done more for my vineyard?”'
  - where: 'note 7:33 “Why God weeps”'
    claim: Hanks on what God asked of His children
    key: hanks-willing-to-receive
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/willing-to-receive?lang=eng'
    quote: 'God, from whom all blessings come, asked of his children only that they should love each other and choose him, their Father.'
  - where: 'note 7:33 “Why God weeps”'
    claim: 'Hanks on the self-willed rebellious course, foreseen suffering, and God weeping'
    key: hanks-willing-to-receive
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/willing-to-receive?lang=eng'
    quote: 'when God foresaw the suffering that would inevitably follow this self-willed, rebellious course of sin, he wept. That, he told Enoch, was what he had to cry about.'
  - where: 'note 7:33 “Why God weeps”'
    claim: God would not compel His children
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'the one thing he would not do (and will not do) was compel his children to righteousness and obedience'
  - where: 'note 7:33 “Why God weeps”'
    claim: The two things commanded are the two great commandments
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'the Lord had given what Jesus much later described as the two great commandments to love God and neighbor'
  - where: 'note 7:39 “The prison prepared for them”'
    claim: Prison is the postmortal spirit prison; opportunity to repent through the Atonement
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'which was a reference to the postmortal spirit prison. God taught Enoch that through Jesus Christ’s Atonement, those in spirit prison would have the opportunity to repent.'
  - where: 'note 7:39 “The prison prepared for them”'
    claim: The Lord's words showed Enoch that the salvation of the dead is part of the gospel
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'The Lord’s response revealed to Enoch that the doctrine of the salvation of the dead constituted a part of the everlasting gospel.'
  - where: 'note 7:39 “The prison prepared for them”'
    claim: That which I have chosen is Jesus Christ, who had already pled before the Father
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'Jesus Christ—designated here “that which I have chosen”—had already “pled” before the Father according to the Book of Moses'
  - where: 'note 7:39 “The prison prepared for them”'
    claim: Later in the vision Enoch sees Christ free those lost in the Flood (verse 57)
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'Enoch would next see Christ liberating those souls who would be lost in the Flood.'
  - where: 'note 7:39 “The prison prepared for them”'
    claim: Joseph F. Smith's vision of messengers sent from among the righteous
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138?lang=eng'
    quote: 'from among the righteous, he organized his forces and appointed messengers, clothed with power and authority, and commissioned them to go forth and carry the light of the gospel to them that were in darkness'
  - where: 'note 7:41 “From weeping to joy”'
    claim: Enoch acquired something of God's perspective as he fathomed sin and God's love
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'he acquired something of God’s own experience and perspective.'
  - where: 'note 7:41 “From weeping to joy”'
    claim: The comfort came through the offering by which all that mourn are sanctified
    key: schade-bowen-moses-7-zion
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-zion'
    quote: 'It was through this offering that “all they that mourn may be sanctified and have eternal life” (v. 45).'
  - where: 'note 7:41 “From weeping to joy”'
    claim: Enoch moved from weeping to rejoicing
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'Enoch transitioned from weeping to rejoicing.'
  - where: 'note 7:41 “From weeping to joy”'
    claim: Verses of Enoch's weeping, comfort, and joy
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'But the Lord said unto Enoch: Lift up your heart, and be glad; and look.'
  - where: 'note 7:47 “The Lamb slain before the world began”'
    claim: Jehovah was chosen in the premortal Council to perform the atoning sacrifice
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'provides a powerful reminder of the “infinite and eternal” nature of the Savior’s atoning sacrifice. In the premortal Council, Jehovah was chosen to perform the atoning sacrifice for the sins of the world.'
  - where: 'note 7:47 “The Lamb slain before the world began”'
    claim: Lifted up is an idiom for crucifixion; rejoicing at it can seem counterintuitive
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'While it might seem counterintuitive that Enoch rejoiced that Christ was “lifted up”—an idiom for crucifixion'
  - where: 'note 7:47 “The Lamb slain before the world began”'
    claim: Through these things Enoch understood what the Atonement would mean
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'Enoch came to understand the glorious reality of what the Savior’s atoning sacrifice would mean for himself, for Zion, and for all people.'
  - where: 'note 7:47 “The Lamb slain before the world began”'
    claim: Joseph Smith, quoting Enoch's prophecy in 1835, on what God manifested to Enoch
    key: jsp-letter-elders-1835
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-16-november-1835/1'
    quote: 'God clearly manifested to Enoch, the redemption which he prepared, by offering the Messiah as a Lamb slain from before the foundation of the world'
  - where: 'note 7:48 “The earth as the mother of men”'
    claim: The earth is the habitation of God's children now and in future
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'The earth is the habitation of God’s children and will become a future habitation for God and his glorified children.'
  - where: 'note 7:48 “The earth as the mother of men”'
    claim: Earth's cleansing by the Flood, sanctifying at the Second Coming, Millennium
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: '(1) the earth will be cleansed via the Flood; (2) the earth will be sanctified at the Lord’s second coming; and (3) righteousness will abide upon the earth for a season (the Millennium)'
  - where: 'note 7:48 “The earth as the mother of men”'
    claim: Sanctifying came through the Atonement
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'Enoch had to understand that this, too, came through the atonement of Jesus Christ.'
  - where: 'note 7:48 “The earth as the mother of men”'
    claim: Mother of men fits that Adam was taken from the ground (Gen. 2)
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'a description consonant with the theme that humanity/Adam (Hebrew hāʾādām) was taken from “the ground”'
  - where: 'note 7:51 “The covenant first made with Enoch”'
    claim: JST Genesis 9:15 has God tell Noah the covenant was made with Enoch
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'I will establish my covenant with you, which I made unto your father Enoch, concerning your seed after you.'
  - where: 'note 7:51 “The covenant first made with Enoch”'
    claim: JST Genesis 9:21 ties the rainbow to the covenant with Enoch and the return of his city
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'the everlasting covenant, which I made unto thy father Enoch; that, when men should keep all my commandments, Zion should again come on the earth, the city of Enoch which I have caught up unto myself.'
  - where: 'note 7:53 “Messiah, King of Zion, Rock of Heaven”'
    claim: Rock of Heaven is found only in Moses 7
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: '“Rock of Heaven” is a unique title of Jesus Christ found only in Moses 7.'
  - where: 'note 7:53 “Messiah, King of Zion, Rock of Heaven”'
    claim: Messiah means anointed one, a term associated with priests and kings
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'the Lord identified himself as the Messiah (from Hebrew māšîaḥ, “anointed one,” a term associated with priests and kings)'
  - where: 'note 7:53 “Messiah, King of Zion, Rock of Heaven”'
    claim: The title implicitly promises He will come through Enoch's and Noah's seed
    key: schade-bowen-moses-7
    url: 'https://rsc.byu.edu/book-moses/moses-7-enochs-vision-earth-savior-zions-return'
    quote: 'he implicitly promised Enoch that he himself would come into the world through Enoch’s and Noah’s seed'
  - where: 'note 7:53 “Messiah, King of Zion, Rock of Heaven”'
    claim: King of Zion is not an Old Testament title
