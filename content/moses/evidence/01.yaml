chapter: 1
claims:
  - where: setting
    claim: 'The Pearl of Great Price introduction dates the beginning of the translation to June 1830 and calls Moses an extract from Joseph Smith''s translation of Genesis'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/introduction'
    quote: 'An extract from the book of Genesis of Joseph Smith’s translation of the Bible, which he began in June 1830.'
  - where: setting
    claim: 'Moses 1 has no counterpart in the Bible'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Moses 1 is particularly exceptional because it is completely unique material, with no counterpart in the Bible.'
  - where: setting
    claim: 'The translation began shortly after the Book of Mormon was published; the book of Moses is part of the Joseph Smith Translation'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Shortly after the publication of the Book of Mormon in 1830, the Prophet Joseph Smith began an inspired translation, or revision, of the King James Version of the Bible.'
  - where: setting
    claim: 'The manuscript heading of Moses 1 is in Oliver Cowdery''s hand and says June 1830'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'the heading to the Moses 1 manuscript, written in Oliver Cowdery’s handwriting, includes the defining description “a revelation given to Joseph the Revelator June 1830.”'
  - where: setting
    claim: 'Moses 1 was revealed amid persecution of Joseph Smith and trials of the infant Church'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'Moses 1 was revealed to the Prophet Joseph Smith amid physical persecutions directed at him and spiritual trials for the infant church.'
  - where: note 1:1 “When in Moses’ life the vision came”
    claim: 'The vision came after the burning bush and before the Exodus'
    key: pgp-manual-moses-1-1-11
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-1-1-11'
    quote: 'The vision recorded in Moses 1 took place after Jehovah spoke to Moses at the burning bush but before Moses led the children of Israel out of Egypt and through the Red Sea (see Moses 1:17, 25–26).'
  - where: note 1:1 “When in Moses’ life the vision came”
    claim: 'The exact time and place are not known; the Lord kept instructing Moses beyond the first call'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'We do not know the exact time or location of this experience on the mountain, but it happened sometime after the “burning bush” experience'
  - where: note 1:1 “When in Moses’ life the vision came”
    claim: 'Moses''s theophany is what the Lord intended for all Israel (Exodus 3:12)'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'In Exodus 3 Moses is told that his theophany is what the Lord intended for all the children of Israel.'
  - where: note 1:1 “When in Moses’ life the vision came”
    claim: 'The purpose of the Exodus was to prepare the people to see and converse with God'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'The entire purpose of the Exodus was to prepare the people to see and converse with God'
  - where: note 1:1 “When in Moses’ life the vision came”
    claim: 'The theme of preparing to see God paves the way for Moses 1:39'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'All of this is paving the way for the Lord’s explanation in Moses 1:39 that his work and glory is “to bring to pass the immortality and eternal life” of his children.'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'The speaker in Moses 1 was the premortal Jesus Christ, Jehovah'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'In Moses 1, Moses was speaking with the premortal Jesus Christ, who is Jehovah, the God of the Old Testament.'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'Jesus Christ sometimes speaks as if He were the Father; this is divine investiture of authority'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Because He is one with Heavenly Father, Jesus Christ sometimes speaks as if He were God the Father. This is known as divine investiture of authority'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'The 1916 exposition is by the First Presidency and the Quorum of the Twelve'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'A Doctrinal Exposition by the First Presidency and the Quorum of the Twelve Apostles'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'In all His dealings with mankind the Son has represented the Father in power and authority, including in His premortal state as Jehovah'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'in all His dealings with the human family Jesus the Son has represented and yet represents Elohim His Father in power and authority. This is true of Christ in His preexistent, antemortal, or unembodied state, in the which He was known as Jehovah'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'The Father placed His name upon the Son, whose words and acts are those of the Father as to power, authority, and godship'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'so far as power, authority, and godship are concerned His words and acts were and are those of the Father.'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'The Father placed His name upon the Son'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'Thus the Father placed His name upon the Son'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'President Oaks: before the Fall the Father spoke directly to Adam and Eve; thereafter He introduced the Son, so words of God or the Lord in scripture are almost always Jehovah''s'
    key: oaks-teachings-christ-2023
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/51oaks?lang=eng'
    quote: 'Before the Fall, our Heavenly Father spoke directly to Adam and Eve. Thereafter, the Father introduced His Only Begotten Son, Jesus Christ, as our Savior and Redeemer and gave us the command to “hear Him.”'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'President Oaks: such words are almost always the words of Jehovah'
    key: oaks-teachings-christ-2023
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/51oaks?lang=eng'
    quote: 'are almost always the words of Jehovah, our risen Lord, Jesus Christ.'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'The wording of the opening verses may give the impression that Moses speaks with the Father'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'may give one the impression that Moses is speaking with God the Father'
  - where: note 1:6 “The Lord speaking for the Father”
    claim: 'Authorized first-person speech for another occurs throughout scripture, as with prophets'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'The same pattern of authorized, delegated speech in the first person occurs throughout the scriptures, especially in the form of prophets speaking for the Lord.'
  - where: note 1:6 “No God beside me, spoken to a man raised in Egypt”
    claim: 'Moses was raised among many Egyptian deities, and his mind and faith had to be centered on the Father as the only Being to worship'
    key: pgp-manual-moses-1-1-11
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-1-1-11'
    quote: 'Moses was reared in an atmosphere of idolatry. There were numerous deities [gods] among the Egyptians. In commencing the work which the Lord said he had for Moses to do, it was necessary to center his mind and faith upon God the Eternal Father as the only Being to worship.'
  - where: note 1:6 “No God beside me, spoken to a man raised in Egypt”
    claim: 'First Presidency: the Father is the sole object of worship, approached in the name of the Only Begotten'
    key: pgp-manual-moses-1-1-11
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-1-1-11'
    quote: 'The sole object of worship, God the Eternal Father, stands supreme and alone, and it is in the name of the Only Begotten that we thus approach Him'
  - where: note 1:6 “No God beside me, spoken to a man raised in Egypt”
    claim: 'The phrase does not deny that people have eternal potential to become like God'
    key: pgp-manual-moses-1-1-11
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-1-1-11'
    quote: 'The phrase “there is no God beside me” should not be interpreted to mean that mankind does not have the eternal potential to become like God.'
  - where: note 1:6 “No God beside me, spoken to a man raised in Egypt”
    claim: 'Moses was raised in an Egyptian royal household whose members were believed to be begotten incarnations of deities, and against that upbringing learned that there is no God beside the speaker'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'In the face of his Egyptian, polytheistic upbringing in the Egyptian royal household whose members were believed to be “begotten” incarnations of deities, Moses learned that there is “no God besides me”'
  - where: note 1:6 “No God beside me, spoken to a man raised in Egypt”
    claim: 'Possible reading: similitude of the Only Begotten reaches beyond sonship to Moses'' role in delivering Israel'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'possibly a reference beyond being a son of God to the role Moses would play in saving and delivering Israel from Egyptian bondage.'
  - where: note 1:6 “No God beside me, spoken to a man raised in Egypt”
    claim: 'Moses reared in idolatry among numerous deities (short quotations used in the note)'
    key: pgp-manual-moses-1-1-11
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-1-1-11'
    quote: 'was reared in an atmosphere of idolatry. There were numerous deities [gods]'
  - where: note 1:10 “Man is nothing, and yet a son of God”
    claim: 'President Uchtdorf: what Moses realized had never occurred to him in all his years in Pharaoh''s court'
    key: uchtdorf-you-matter-2011
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/you-matter-to-him?lang=eng'
    quote: 'he realized something that, in all his years in Pharaoh’s court, had never occurred to him before.'
  - where: note 1:10 “Man is nothing, and yet a son of God”
    claim: 'President Uchtdorf: the paradox that man is nothing compared to God and yet everything to God'
    key: uchtdorf-you-matter-2011
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/you-matter-to-him?lang=eng'
    quote: 'This is a paradox of man: compared to God, man is nothing; yet we are everything to God. While against the backdrop of infinite creation we may appear to be nothing, we have a spark of eternal fire burning within our breast.'
  - where: note 1:10 “Man is nothing, and yet a son of God”
    claim: 'The speaker of the talk is President Dieter F. Uchtdorf'
    key: uchtdorf-you-matter-2011
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/you-matter-to-him?lang=eng'
    quote: 'By President Dieter F. Uchtdorf'
  - where: note 1:14 “Glory as the way Moses knows whom to worship”
    claim: 'The vision taught Moses about God''s glory and the devil''s lack of it'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'Moses’s experience recorded in Moses 1 taught him about God’s glory and the devil’s lack thereof.'
  - where: note 1:14 “Glory as the way Moses knows whom to worship”
    claim: 'Moses recognizes that only by the Spirit can he judge between the imitator and God'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'Moses blesses the name of God as he recognizes that it is only by the power of the Spirit that he can judge between the imitator and God himself.'
  - where: note 1:14 “Glory as the way Moses knows whom to worship”
    claim: 'In verse 18 the two manuscripts (OT1 and OT2) read “and it is glory unto me,” which the printed text, following the 1843 Times and Seasons, lacks'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'However, OT1 and OT2 read, “his glory has been upon me and it is glory unto me, wherefore I can judge between him and thee”'
  - where: note 1:19 “Satan answers with the Savior’s title”
    claim: 'Satan often imitates God; Moses 1:12–22 is an example, including his claim to be the Only Begotten'
    key: sc-knowhy-176
    url: 'https://scripturecentral.org/knowhy/why-did-helaman-compare-christ-to-a-rock'
    quote: 'Satan often impersonates or imitates God in His different capacities. One striking example is in the Book of Moses 1:12–22, where Satan “came tempting” Moses'
  - where: note 1:33 “Worlds without number, and the Son who made them”
    claim: 'The Lord answered the second question first: Moses needed the answer to “by what” before he could understand why'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'Yet there was something Moses needed to recognize before he could understand why—it was the answer to his second question, “by what thou madest them?”'
  - where: note 1:33 “Worlds without number, and the Son who made them”
    claim: 'Creation by divine word and Christ as the Word run through the Book of Moses'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'Creation by divine word, Christ as the divine Word, and the efficacy of divine words once spoken will constitute a dominant thread in the Book of Moses.'
  - where: note 1:34 “The name Adam and the many”
    claim: 'Adam is a personal name here; the Semitic word adam means humankind or people, and “many” reflects the people stemming from Adam that Moses had seen'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'the actual meaning of the Semitic word adam is “humankind” or “people”—reflecting the “many” people and generations stemming from Adam, the father of all humans, that Moses had just been shown in vision'
  - where: note 1:34 “The name Adam and the many”
    claim: 'Adam is a personal name in the verse'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'Moses learned that God created the first man of all men and named him Adam (a personal name)'
  - where: note 1:39 “The work and glory, and the two gifts”
    claim: 'Immortality and eternal life defined; immortality comes to everyone through the Atonement'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Immortality is to live forever as a resurrected being. Through the Atonement of Jesus Christ, everyone will receive this gift. Eternal life, or exaltation, is to live in God’s presence and to continue as families.'
  - where: note 1:39 “The work and glory, and the two gifts”
    claim: 'Eternal life requires obedience to the laws and ordinances of the Gospel'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'However, to inherit eternal life requires our ‘obedience to the laws and ordinances of the Gospel’'
  - where: note 1:39 “The work and glory, and the two gifts”
    claim: 'Moses needed to know the why of creation, which the Lord at first kept to Himself'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'if he was to do the work the Lord had called him to do, he would need to know the “why” of creation'
  - where: note 1:39 “The work and glory, and the two gifts”
    claim: 'Immortality is the part only the Savior could effect; bringing people toward eternal life became Moses''s work too, in the journey out of Egypt to the covenant'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'an aspect of the work that only the Savior could bring into effect, Moses understood that the other component of God’s work, to bring to pass their eternal life, was now also his work.'
  - where: note 1:39 “The work and glory, and the two gifts”
    claim: 'What Moses could help with was the journey toward eternal life, out of Egypt to the covenant'
    key: schade-bowen-moses-1-work-glory
    url: 'https://rsc.byu.edu/book-moses/moses-1-work-glory'
    quote: 'a journey that would lead him and the people out of Egypt and into the wilderness to receive the covenant.'
  - where: note 1:41 “Words taken from the book, and restored”
    claim: 'The book of Moses may restore lost material or be revelation never originally in the Bible'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'While the book of Moses may include the restoration of material that was lost, it may also have been revelation given by the Lord to Joseph Smith that was never originally in the Bible.'
  - where: note 1:41 “Words taken from the book, and restored”
    claim: 'The Book of Mormon said plain and precious parts had been taken away and kept back and would be restored'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'The Book of Mormon indicated that plain and precious parts of the gospel that had been “taken away” and “kept back” would be restored (1 Nephi 13:28, 32).'
  - where: note 1:41 “Words taken from the book, and restored”
    claim: 'Joseph may have understood 1 Nephi 13 as calling for a new translation, though not certain'
    key: schade-bowen-moses-1
    url: 'https://rsc.byu.edu/book-moses/moses-1-visions-moses'
    quote: 'may have understood them as calling for a reexamination and new ‘translation’ of the Bible,” although we cannot be certain of this.'
  - where: note 1:41 “Words taken from the book, and restored”
    claim: 'Either way the book of Moses restores many truths Nephi foretold would be lost'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'it restores many “plain and most precious” (1 Nephi 13:26) truths that Nephi foretold would be lost from the Bible'
  - where: note 1:41 “Words taken from the book, and restored”
    claim: 'Moses 2–8 has information not in the corresponding Genesis material'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Moses 2–8 presents information that is not found in the corresponding material in Genesis. These valuable contributions include:'
  - where: note 1:41 “Words taken from the book, and restored”
    claim: 'Among what Moses 2–8 adds: evidence that Adam and Eve and their descendants had the gospel'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Evidence that Adam and Eve and their descendants enjoyed the blessings of the gospel of Jesus Christ'
  - where: christ
    claim: 'Immortality for everyone is a gift through the Atonement'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Through the Atonement of Jesus Christ, everyone will receive this gift.'
  - where: note 1:14 “Glory as the way Moses knows whom to worship”
    claim: 'The 1921 edition reads strengthened in Moses 1:14'
    key: pgp-1921
    url: 'https://archive.org/download/pearlofgreatpric0000jose_d8d6/pearlofgreatpric0000jose_d8d6_djvu.txt'
    quote: 'and I were strengthened before him'
  - where: note 1:14 “Glory as the way Moses knows whom to worship”
    claim: 'The current edition reads transfigured in Moses 1:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'and I were transfigured before him'
  - where: note 1:19 “Satan answers with the Savior’s title”
    claim: 'The 1921 edition reads rent in Moses 1:19'
    key: pgp-1921
    url: 'https://archive.org/download/pearlofgreatpric0000jose_d8d6/pearlofgreatpric0000jose_d8d6_djvu.txt'
    quote: 'Satan cried with a loud voice, and rent upon the earth'
  - where: note 1:19 “Satan answers with the Savior’s title”
    claim: 'The current edition reads ranted in Moses 1:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'Satan cried with a loud voice, and ranted upon the earth'
