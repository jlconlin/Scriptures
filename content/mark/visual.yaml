summary: >-
  Mark's Gospel is the quick, close account of Jesus of Nazareth as the Son of God who is
  Lord even of wind and sea, and the stilling of the storm shows it most plainly: the
  disciples fear, and the one asleep in their boat speaks, and there is "a great calm."
  The picture is seen from where the disciples sat, a moment after He has spoken, when
  He asks them: "Why are ye so fearful?"
look: >-
  A realistic painted illustration, as a skilled landscape illustrator would paint a
  full-page plate in gouache for a fine book: true proportions and scale, natural color,
  believable light and cast shadows, real-looking cloth, bronze, rock and water. It is
  plainly a painting and not a photograph: forms are slightly simplified, surfaces are
  smooth washes of color with little fine texture (no gravel, pebbles or grain picked out
  one by one), and edges are clean and soft. It is not a cartoon or a flat poster either:
  no outlines, no faceted or stylized shapes, no exaggerated color.
motifs:
  - "Primary, and the viewpoint: from a seat amidships in a wooden fishing boat of Galilee, looking back to its raised, pointed stern (Mark 4:37–38). The boat is just through the storm: lake water still lies in its bottom, the planks are wet, a bailing scoop floats where it was dropped, an oar lies across the thwarts, a rope is left loose and a striped wool cloak is thrown over a seat."
  - "Primary: on the small deck in the stern, a reddish-brown leather cushion, dented where a head lay, the brightest thing in the boat (Mark 4:38)."
  - "Supporting: beyond the stern the lake lies flat under a full moon, the clouds drifting away to the right, and two small boats rest far off on the water (Mark 4:36, 39)."
composition: >-
  Seen from inside the boat, looking aft: its wet inside fills the lower half, the oar,
  scoop, rope and cloak in the foreground, the stern deck and cushion right of center. Beyond
  the stern the flat lake runs to low hills, with two small boats at the left in the moon's
  path on the water. A full moon at the upper left lights the scene, the clouds breaking
  away to the right; the boat's wood, the cloak and the cushion keep their color.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The leather cushion in the stern** is where He slept through the storm: “he was in the hinder part of the ship, asleep on a pillow” ([[Mark 4:38]]).'
  - '**The water lying in the bottom of the boat, the dropped scoop and the things left where they fell** show the storm the disciples have just come through: “the waves beat into the ship, so that it was now full” ([[Mark 4:37]]). The picture is seen from where they sat, when He asked them: “Why are ye so fearful? how is it that ye have no faith?” ([[Mark 4:40]]).'
  - '**The lake lying flat under the moon** is the sea after He spoke to it: “Peace, be still. And the wind ceased, and there was a great calm” ([[Mark 4:39]]).'
  - '**The two small boats far off** stand for the other boats that crossed with Him: “there were also with him other little ships” ([[Mark 4:36]]).'
asset: /assets/mark-book-art.jpg
alt: From inside a wooden fishing boat under a full moon, water still lies in the bottom among wet planks, with a floating scoop, an oar, a loose rope and a striped cloak left where they fell; on the deck at the raised stern rests a dented leather cushion, and beyond it the lake is perfectly calm, with two small boats far off and clouds drifting away.
