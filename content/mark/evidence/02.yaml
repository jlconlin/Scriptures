chapter: 2
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'Mark groups controversies together in 2:1–3:6'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark places together miracles (Mark 1:21–45 and 4:35–5:43), controversies (Mark 2:1–3:6 and 11:27–12:44), parables (Mark 4:1–34)'
  - where: setting
    claim: 'Mark organizes by type of material, not chronology'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark has a tendency to organize the Gospel by the type of material (miracles, controversies, parables),[11] not by theme (faith, patience, repentance), or, as we might expect, by chronology.'
  - where: setting
    claim: 'Capernaum the home base of the Galilean ministry and residence of Peter, Andrew, James, John and Levi'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'The synoptic Gospels regularly refer to Capernaum as the residence of Jesus’ earliest disciples (including Peter, Andrew, James, John, and Matthew/Levi; see Mark 1:16–31; Matthew 9:10–13), the adopted home base of Jesus’ Galilean ministry'
  - where: setting
    claim: 'Capernaum a border town in Antipas’s tetrarchy, drawing toll collectors'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Because of its new status as a border town, Capernaum’s fishing and farming population expanded to include officials from Antipas’ administration, such as toll/tax collectors (see Mark 2:13–17; Matthew 9:9–13; Luke 5:27–32)'
  - where: setting
    claim: 'The Pharisees who watch Him on the Sabbath begin on the Sabbath to plot His death (3:6)'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'the same Pharisees who watch Jesus closely so they can accuse him of Sabbath-breaking for healing someone on the Sabbath will then, ironically, begin on the Sabbath to plot Jesus’ death (see Mark 3:6)'
  - where: setting
    claim: '“The sabbath was made for man” is only in Mark'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The teaching that “the sabbath was made for man, and not man for the sabbath” (Mark 2:27) is not found in any of the other Gospels.'
  - where: thread
    claim: 'Mark’s questions signal controversy and showcase Jesus’s wisdom'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'These are rarely straightforward requests for information but are usually an indication of controversy; … Many of these questions, intended to entrap Jesus, end up “showcas[ing] the wisdom and cleverness of Jesus.”'
  - where: thread
    claim: 'Mark 2:10 and 2:28 listed under the Son of Man’s dignity as head of the kingdom'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: '(2) honor and dignity, as head and founder of the kingdom of God, and judge of all men (Matt. 13:41; 16:28; 19:28; 24:30–31; 25:31; 26:64; Mark 2:10, 28)'
  - where: thread
    claim: 'The sequence in Mark suggests Jesus introducing a new order of the kingdom'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'In any case, this narrative sequence in Mark suggests that Jesus is introducing a new order of the kingdom of God.'

  # ---- notes
  - where: 'note 2:4 “A roof they dug through”'
    claim: 'Capernaum houses: single-story rooms round a courtyard, rough basalt walls unable to bear a heavy roof; roofs of beams, reeds and mud, usable for work and sleep'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'this style of wall construction was not able to support a second story or heavy roof. Instead, the dwellings at Capernaum were covered with thatched roofs supported by wood beams and reeds bound together with a thick mud mortar.'
  - where: 'note 2:4 “A roof they dug through”'
    claim: 'The roof was rolled smooth and dried, sturdy enough for light work, sleeping, storage'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'The thatching and mortar was smoothed out with stone roof rollers and subsequently dried, providing a sufficiently sturdy roof that could be used for light work, sleeping, storage, and drying produce.'
  - where: 'note 2:4 “A roof they dug through”'
    claim: 'Courtyards had stone staircases to the roofs'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Courtyards often contained areas for housing animals and crude stone staircases that led to the roofs of the living rooms.'
  - where: 'note 2:4 “A roof they dug through”'
    claim: 'Mark’s Greek: they removed the roof, having dug through the mud, straw and reeds; Mark’s details match an average Capernaum home'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'four men from the village who “removed the roof” of a house by “having dug through” (ezoryzantees) the dried mud, straw, and reeds to lower a paralytic … The excavators and other scholars have observed that Mark’s details accurately reflect an average home in Capernaum.'
  - where: 'note 2:5 “Their faith, and forgiveness first”'
    claim: 'The bearers’ unusual expedient showed their faith in Him as One who could stay disease'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'resorted to an unusual expedient, which exhibited in an unmistakable way their faith in the Lord as One who could rebuke and stay disease, and their determination to seek the desired blessing at His hands.'
  - where: 'note 2:5 “Their faith, and forgiveness first”'
    claim: 'Jesus impressed by the faith and works of the bearers, and knew the sufferer’s own faith'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Jesus was deeply impressed by the faith and works of those who had thus labored to place a helpless paralytic before Him; doubtless, too, He knew of the trusting faith in the heart of the sufferer'
  - where: 'note 2:5 “Their faith, and forgiveness first”'
    claim: 'The man probably afraid; in his case sin and affliction were connected; not all bodily ills come from sin (John 9)'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The man was probably in a state of fear; … In this man’s condition there was plainly a close connection between his past sins and his present affliction … We are not warranted, however, in assuming that all bodily ills are the result of culpable sin'
  - where: 'note 2:5 “Their faith, and forgiveness first”'
    claim: 'Christ recognized his repentance with his faith'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Christ recognized his repentance together with the faith that accompanied it, and it was the Lord’s rightful prerogative to decide upon the man’s fitness to receive remission of his sins and relief from his bodily affliction.'
  - where: 'note 2:5 “Their faith, and forgiveness first”'
    claim: 'In Mark the paralytic is among the minor characters who turn to Jesus and prove better disciples than the Twelve'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'minor characters who choose to follow Jesus are much better disciples; this group includes the paralytic whose sins are forgiven (Mark 2:1–12), the woman with the flow of blood (Mark 5:21–43), the Syrophenician woman (Mark 7:24–30), Bartimaeus (Mark 10:46–52)'
  - where: 'note 2:5 “Their faith, and forgiveness first”'
    claim: 'The verse: Jesus saw their faith and forgave the man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/2?lang=eng'
    quote: 'When Jesus saw their faith, he said unto the sick of the palsy, Son, thy sins be forgiven thee.'
  - where: 'note 2:7 “Blasphemy, unless He was who He said”'
    claim: 'Blasphemy defined; Jesus charged with it for claiming to forgive sins; the charges would have been true if He had not been all He said'
    key: bd-blasphemy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blasphemy?lang=eng'
    quote: 'Generally denotes contemptuous speech concerning God … Our Lord was on several different occasions charged by the Jews with speaking blasphemy, because He claimed the right to forgive sins … These charges would have been true if He had not actually been all that He said He was.'
  - where: 'note 2:7 “Blasphemy, unless He was who He said”'
    claim: 'The penalty for willful blasphemy was stoning'
    key: bd-blasphemy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blasphemy?lang=eng'
    quote: 'The punishment for willful and intentional blasphemy was death by stoning (Lev. 24:11–16; John 10:31–33; Acts 7:58).'
  - where: 'note 2:7 “Blasphemy, unless He was who He said”'
    claim: 'Mark sandwiches the dispute over forgiveness (2:6–10) inside the healing (2:1–5, 11–12)'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'A discussion of Jesus’ authority to forgive sins (Mark 2:6–10) is surrounded by the story of a lame man whose sins he forgives (Mark 2:1–5, 11–12).'
  - where: 'note 2:7 “Blasphemy, unless He was who He said”'
    claim: 'A sandwich asks the audience to read the center in light of what surrounds it'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark frequently “sandwiches” a story between two other sections of text with the goal of encouraging the audience to understand the center story in light of its surrounding material.'
  - where: 'note 2:10 “The Son of man has power on earth”'
    claim: 'Forgiving words cannot be tested outwardly; the command to walk could be'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'It was easier to say, “Thy sins are forgiven thee,” for those words could not be put to any outward test, and only the consciousness of the sinner could attest their power. It was a bolder and a harder thing to risk the utterance of words which challenged an immediate and visible fulfilment'
  - where: 'note 2:10 “The Son of man has power on earth”'
    claim: 'Son of Man: possibly Daniel 7:13 (disputed); oblique self-reference; spoken in the third person, the audience invited to make the connection'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'It may relate to the “Son of Man” in Daniel 7:13 … although other scholars dispute the connection to Daniel 7. … Jesus never says that he is the Son of Man; he always speaks of the Son of Man in the third person, and the audience is invited to make the connection (see Mark 2:5, 10).'
  - where: 'note 2:10 “The Son of man has power on earth”'
    claim: 'The first occurrence of “Son of Man” in Mark is 2:10'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Occurrences of the “Son of Man” in Mark’s Gospel: 2:10, 28; 8:31, 38; 9:9, 12, 31; 10:33, 45; 13:26; 14:21, 41, 62.'
  - where: 'note 2:10 “The Son of man has power on earth”'
    claim: 'Used by Jesus of Himself, never by others; Mark 2:10, 28 under honor and dignity; latter-day revelation (Moses 6:57) confirms its sacredness'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: 'used by Him in speaking of Himself but never used by anyone else in speaking of Him … Latter-day revelation confirms the special meaning and sacredness of this phrase when used as a name of the Savior, as in D&C 45:39; 49:6, 22; 58:65; Moses 6:57.'
  - where: 'note 2:14 “Levi at the tax booth”'
    claim: 'Matthew known before his conversion as Levi son of Alphaeus; tax gatherer at Capernaum probably for Herod Antipas; gave a feast'
    key: bd-matthew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/matthew?lang=eng'
    quote: 'Known before his conversion as Levi, son of Alphaeus (Mark 2:14). He was a tax gatherer at Capernaum, probably in the service of Herod Antipas, in whose tetrarchy Capernaum was. Soon after his call he gave a feast to his old associates'
  - where: 'note 2:14 “Levi at the tax booth”'
    claim: 'Levi’s father and James’s father are treated as two men (two entries)'
    key: bd-alphaeus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/alphaeus?lang=eng'
    quote: '(1) Father of Matthew or Levi (Mark 2:14). … (2) Father of James the Apostle (Matt. 10:3; Mark 3:18; Luke 6:15; Acts 1:13)'
  - where: 'note 2:14 “Levi at the tax booth”'
    claim: 'The tax booth (telōnion): perhaps tolls on fish and trade near the harbor; size and nature uncertain; none found'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'It is possible that near Capernaum’s harbor there was a small customs office for the collection of tolls and taxes on catches of fish and other interregional trade. … The Gospels do record the existence of a “tax booth” (teloniōn) … but the size and nature of this facility are not certain.'
  - where: 'note 2:14 “Levi at the tax booth”'
    claim: 'Publicans leased the right to collect customs at borders, kept the excess, were considered corrupt'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'customs were collected at every territorial border by publicans who leased the right to collect them from the client king or governor … Because publicans’ livelihoods depended on the amount of money they collected from travelers, they were commonly considered corrupt'
  - where: 'note 2:14 “Levi at the tax booth”'
    claim: 'Mark’s threefold pattern of calls: fishermen, Levi, the Twelve'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The three-fold pattern is found in many instances: … the calling of the disciples (fishermen, Levi, the twelve; see Mark 1:16–20; 2:14; and 3:13–19)'
  - where: 'note 2:16 “Why the meal offended”'
    claim: 'Pharisees brought temple holiness into the home; table fellowship; ate only with the equally obedient'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'To keep this level of holiness, it was also essential not to eat with those who did not observe these laws.[6] This combined effort to keep the ritual holiness of the family table is known as table fellowship.'
  - where: 'note 2:16 “Why the meal offended”'
    claim: 'Publicans excluded from Pharisaic table fellowship; eating with the unclean threatened His hosts’ purity'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'by eating with others that were ritually unclean Jesus would also threaten the purity of His Pharisaic hosts. The tax collectors, or publicans, were specifically excluded from the Pharisees’ table fellowship.'
  - where: 'note 2:16 “Why the meal offended”'
    claim: 'Much of the Pharisees’ early opposition arose over food practices'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'much of the Pharisees’ initial opposition to Jesus arose over questions of His or His disciples’ food practices, particularly as they reflected a breach of table-fellowship regulations.'
  - where: 'note 2:16 “Why the meal offended”'
    claim: 'Mark says only “his house”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/2?lang=eng'
    quote: 'And it came to pass, that, as Jesus sat at meat in his house, many publicans and sinners sat also together with Jesus and his disciples'
  - where: 'note 2:17 “The whole and the sick”'
    claim: 'The Pharisees would agree the sinners were sick and see themselves as righteous; the challenge is to recognize that all sin'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'they would naturally concur that the sinners and tax collectors were sick and did need a physician. They could see themselves as righteous and the others as unworthy. One of our greatest challenges as righteous, law-abiding people is to recognize that we all sin.'
  - where: 'note 2:17 “The whole and the sick”'
    claim: 'When observance becomes justification, admitting a flaw is no option'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'To the extent that our observance of the law becomes our sense of justification before God, then admitting that we are flawed will not be an option. Then, at all costs, we must exactly keep the law and judge others who do not.'
  - where: 'note 2:17 “The whole and the sick”'
    claim: 'Moroni 8:8: little children are whole, not capable of committing sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/8?lang=eng'
    quote: 'Behold, I came into the world not to call the righteous but sinners to repentance; the whole need no physician, but they that are sick; wherefore, little children are whole, for they are not capable of committing sin'
  - where: 'note 2:18 “Who fasted, and why”'
    claim: 'The Day of Atonement appears to be the only fast ordered by the law; other fasts from the exile; fasting a regular custom after the return; a way of showing sorrow'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law. Other fasts were instituted during the exile (Zech. 7:3–5; 8:19); and after the return, fasting is shown to be a regular custom (Luke 5:33; 18:12). It was regarded as a natural way of showing sorrow.'
  - where: 'note 2:18 “Who fasted, and why”'
    claim: 'John’s leaderless disciples fell in with the Pharisees; John’s asceticism vied with Pharisaic rigor'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The Baptist had been a scrupulous observer of the law; his strict asceticism vied with the rigor of Pharisaic profession. His non-progressive disciples, now left without a leader, naturally fell in with the Pharisees.'
  - where: 'note 2:18 “Who fasted, and why”'
    claim: 'Some of John’s followers failed to see that the One he testified of was among them'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'many of those who had been drawn to his baptism, and had professed discipleship to him, still clung to his teachings, and failed to see that the Greater One of whom he had testified was then ministering amongst them.'
  - where: 'note 2:18 “Who fasted, and why”'
    claim: 'The verse names the disciples of John and of the Pharisees'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/2?lang=eng'
    quote: 'And the disciples of John and of the Pharisees used to fast'
  - where: 'note 2:20 “The bridegroom taken away”'
    claim: 'John had called himself the Bridegroom’s friend; the reply must have reminded his disciples'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'To the friends of the now imprisoned Baptist our Lord’s reply must have brought memories of their beloved leader’s words, when he had compared himself to the Bridegroom’s friend, and had plainly told them who was the real Bridegroom.'
  - where: 'note 2:20 “The bridegroom taken away”'
    claim: 'Mark sets three prophecies of Jesus’s suffering close together in 8:31–10:34'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'prophecies of Jesus’ suffering and death (three within a narrow section of text: Mark 8:31–10:34)'
  - where: 'note 2:20 “The bridegroom taken away”'
    claim: 'The Lord taught the value of fasting; the early Church fasted'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'Our Lord taught the religious value of fasting (Matt. 6:16–18; 9:15; Luke 4:2). We find it practiced in the early Christian Church (Acts 13:1–3; 14:23; 1 Cor. 7:5; 2 Cor. 6:5; 11:27).'
  - where: 'note 2:22 “Unshrunk cloth and new wineskins”'
    claim: 'Thayer: agnaphos, unmilled, unfulled, undressed'
    key: thayer
    url: 'https://biblehub.com/greek/46.htm'
    quote: 'ἄγναφος, , ὁ, ἡ (γνάπτω to dress or full cloth, cf. ἄρραφος), unmilled, unfulled, undressed: Matthew 9:16; Mark 2:21.'
  - where: 'note 2:22 “Unshrunk cloth and new wineskins”'
    claim: 'Thayer: askos, a leather bag for water or wine'
    key: thayer
    url: 'https://biblehub.com/greek/779.htm'
    quote: 'ἀσκός, ἀσκοῦ, ὁ, a leathern bag or bottle, in which water or wine was kept: Matthew 9:17; Mark 2:22; Luke 5:37f.'
  - where: 'note 2:22 “Unshrunk cloth and new wineskins”'
    claim: 'The footnote glosses “new” as unshrunken or unsized'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/2?lang=eng'
    quote: '“new”: GR unshrunken or unsized.'
  - where: 'note 2:22 “Unshrunk cloth and new wineskins”'
    claim: 'JST Matt. 9: when the new is come, the old is ready to be put away'
    key: jst-matt-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/9?lang=eng'
    quote: 'For when that which is new is come, the old is ready to be put away.'
  - where: 'note 2:22 “Unshrunk cloth and new wineskins”'
    claim: 'In Mark two food controversies stand back to back; “new wine must be put into new bottles”'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'In Mark, there are two controversial stories about food back-to-back; in the earlier story, Jesus explains that his disciples do not fast because “as long as they have the bridegroom with them, they cannot fast” (Mark 2:19) and that “new wine must be put into new bottles” (v. 22).'
  - where: 'note 2:22 “Unshrunk cloth and new wineskins”'
    claim: 'The Lord of the Sabbath saying would have been “new wine” in a “new bottle”'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'In the texts of Mark and Luke this statement certainly would have been “new wine” to put in a “new bottle,” and it might also connect the disciples’ eating of grain with the question of why Jesus’s disciples did not fast'
  - where: 'note 2:23 “Why plucking grain was unlawful”'
    claim: 'Mark 2:23 literally “began to make a way, plucking”; plucking on the Sabbath generally held unlawful, not a distinctively Pharisaic rule'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: '“going along on the sabbaths through the [grainfields]—and his disciples began to make a way, plucking the ears” (Mark 2:23, Young’s Literal Translation).[10] The sense that reaping or plucking grain on the Sabbath would be a violation of Sabbath law “would not, in any way, be a distinctively Pharisaic rule,”'
  - where: 'note 2:23 “Why plucking grain was unlawful”'
    claim: 'Deut. 23:25 permits plucking by hand, but not on the Sabbath'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'There is a provision in the law that “if you enter your neighbor’s grainfield, you may pick kernels with your hands, but you must not put a sickle to their standing grain” (Deuteronomy 23:25 … This would not, however, have been seen as a permissible Sabbath activity.'
  - where: 'note 2:23 “Why plucking grain was unlawful”'
    claim: 'The Pharisees saw it as reaping (Ex. 34:21)'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'this action of plucking grain is clearly seen by the Pharisees as “reaping,” because they ask Jesus why the disciples are doing “that which is not lawful” on the Sabbath (Mark 2:24; compare Exodus 34:21).'
  - where: 'note 2:23 “Why plucking grain was unlawful”'
    claim: 'Mark does not mention eating; “making a way” may allude to Mark 1:3'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'By not mentioning eating, the text in Mark might be intended to put the emphasis on the disciples “making a way” for Jesus—a clear allusion to the beginning of Mark, which says: “Prepare ye the way of the Lord, make his paths straight” (Mark 1:3).'
  - where: 'note 2:23 “Why plucking grain was unlawful”'
    claim: 'Isaiah’s words in Mark 1:3 describe the followers of a king preparing his way'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This proclamation is actually a quotation from Isaiah, describing the followers of a king preparing the way for him.'
  - where: 'note 2:25 “What David did”'
    claim: 'The David precedent does not speak to the Sabbath directly; Jesus invokes David’s kingly authority'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This response, found in all the Synoptic Gospels, does not speak to the Sabbath directly … David had the authority to partake of food that normally would have been off-limits, and that same kingly authority is being invoked by Jesus for the disciples'
  - where: 'note 2:25 “What David did”'
    claim: 'Jesus does not say the Sabbath command is done away; Mark shows Jesus a king with Davidic authority'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'in giving the analogy of David eating, Christ does not say that the Sabbath command is done away. … Mark’s account shows that Jesus was a king with the Davidic authority to sanction the disciples’ actions.'
  - where: 'note 2:25 “What David did”'
    claim: 'The shewbread was changed and eaten by priests on the Sabbath (Lev. 24:8–9); David did what priests did'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'the Sabbath was the day upon which the bread in the Holy Place was changed and eaten by priests … This verse might further explain the reference to David: he was doing what the priests did on the Sabbath.[28] These details might also illustrate Christ’s lordship as both king and priest.'
  - where: 'note 2:26 “Abiathar or Ahimelech?”'
    claim: 'Only Mark names the high priest; 1 Sam. 21:1 names Ahimelech; Abiathar his son, high priest till Solomon; two conjectures'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/2.htm'
    quote: 'St. Mark’s is the only record that gives the name of the high priest, and in so doing it creates an historical difficulty. In 1Samuel 21:1, Ahimelech is named as exercising the high priest’s office in the Tabernacle at Nob.'
  - where: 'note 2:26 “Abiathar or Ahimelech?”'
    claim: 'Ellicott’s two explanations: the more famous name, present but not yet high priest; or coadjutor to his father'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/2.htm'
    quote: '(1) that St. Mark, or that our Lord, may have given the name of the more famous priest of the two, who, though not then high-priest, was at the Tabernacle at the time referred to; (2) that he might have acted then as a coadjutor to his father, as Eli’s sons seem to have done to him'
  - where: 'note 2:26 “Abiathar or Ahimelech?”'
    claim: 'Abiathar joined David and acted as high priest until deposed by Solomon'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/2.htm'
    quote: 'his son Abiathar joins David at the cave of Adullam (1Samuel 22:20), and continues to act as high priest till his deposition by Solomon (1Kings 2:26).'
  - where: 'note 2:26 “Abiathar or Ahimelech?”'
    claim: 'Abiathar son of Ahimelech; the two names probably interchanged in 2 Sam. 8:17; 1 Chr. 18:16; 24'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'A son of the high priest Ahijah or Ahimelech, he escapes Saul (1 Sam. 22:20); abides with David … is thrust out from the priesthood (2:27, 35; Mark 2:26). Ahimelech and Abiathar are probably interchanged in 2 Sam. 8:17; 1 Chr. 18:16; 24:3, 31.'
  - where: 'note 2:27 “The sabbath was made for man”'
    claim: 'Found only in Mark; the Sabbath as servant, not master; a similar rabbinic saying of the late second century'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This line of thinking, in which the Sabbath has the role of serving human beings, is also seen in the rabbinic tradition in a statement from the late second century … This pattern of thought emphasizes that the Sabbath is the servant of human beings and not the master of them.'
  - where: 'note 2:27 “The sabbath was made for man”'
    claim: 'Mercy did not become a new rule replacing the Sabbath'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'the principle of mercy that informed his actions did not become a new rule replacing the need for the Sabbath and its boundaries. Instead, this principle shows us Jesus’s nature and disposition.'
  - where: 'note 2:27 “The sabbath was made for man”'
    claim: 'The Sabbath gives rest from troubles; no more fitting time to heal'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'Jesus uses these moments to teach the Pharisees that they have failed to understand what the Sabbath is for … Or in other words, the Sabbath is to give individuals rest from their troubles and worries; consequently, there could not be a more fitting time to heal someone.'
  - where: 'note 2:27 “The sabbath was made for man”'
    claim: 'JST Mark 2:26: given for rest, that man should glorify God, not that he should not eat'
    key: jst-mark-2
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/2?lang=eng'
    quote: 'Wherefore the Sabbath was given unto man for a day of rest; and also that man should glorify God, and not that man should not eat;'
  - where: 'note 2:28 “The Lord who made the Sabbath”'
    claim: 'JST Mark 2:27: the Son of man made the Sabbath day'
    key: jst-mark-2
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/2?lang=eng'
    quote: 'For the Son of man made the Sabbath day, therefore the Son of man is Lord also of the Sabbath.'
  - where: 'note 2:28 “The Lord who made the Sabbath”'
    claim: 'The JST declares the Son of man creator of the Sabbath, equating the title with divinity, keeping the third person'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'While declaring the enigmatic Son of man as the creator of the Sabbath, thus equating that title with divinity, the JST maintains the third-person nature of the pronouncement, just as in other KJV Mark passages.'
  - where: 'note 2:28 “The Lord who made the Sabbath”'
    claim: 'In JST Mark Jesus never openly declares His divinity; He keeps third-person declarations'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'It would have been an easy thing for Joseph Smith to portray Jesus in JST Mark openly declaring his own divinity and power … But that never happens. Instead, Jesus maintains his third-person declarations'
  - where: 'note 2:28 “The Lord who made the Sabbath”'
    claim: 'In the Old Testament “son of man” often means simply “a man”'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: 'In the Old Testament the expression “son of man” is frequently used to denote simply “a man” (Num. 23:19; Job 25:6; Ps. 8:4; 80:17).'

  # ---- christ
  - where: christ
    claim: 'JST Mark 2:27: the Son of man made the Sabbath'
    key: jst-mark-2
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/2?lang=eng'
    quote: 'The Son of Man is Lord of the Sabbath because He made the Sabbath day.'
  - where: christ
    claim: 'D&C 59:10 quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'For verily this is a day appointed unto you to rest from your labors, and to pay thy devotions unto the Most High;'
  - where: christ
    claim: 'Conduct and attitude on the Sabbath a sign between the disciple and the Father'
    key: nelson-sabbath
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-sabbath-is-a-delight?lang=eng'
    quote: 'It wasn’t until later that I learned from the scriptures that my conduct and my attitude on the Sabbath constituted a sign between me and my Heavenly Father. With that understanding, I no longer needed lists of dos and don’ts.'
