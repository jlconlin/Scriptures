chapter: 4
claims:
  - where: setting
    claim: 'Mark 4 and Mark 13 are the only two discourses in Mark’s fast-paced Gospel; Mark 4 is a series of parables in the Galilean ministry'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'it is one of only two discourses in an otherwise fast-paced Gospel that concentrates more on the deeds and short, substantial teachings of Jesus. … Jesus’s discourses in Mark are situated in the midst of either the Galilean (see Mark 4) or the Jerusalem (see Mark 13) ministries. Mark 4 consists of a series of parables'
  - where: setting
    claim: 'Mark’s link of the parables and the storm seems precise but differs from Matthew and Luke; the actual order is uncertain'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'The connection of the events, as given by St. Mark, seems to be precise enough, but it differs widely from that in St. Matthew and St. Luke, and it must remain uncertain which was the actual order.'
  - where: setting
    claim: 'Mark’s Gospel was most likely heard read aloud in one sitting'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The normal method for the audience to experience this Gospel would have been for them to have listened to it being read out loud, most likely in one sitting.'
  - where: setting
    claim: 'The seed growing secretly is told only in Mark'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark’s Gospel is the only account to contain the parable found in Mark 4:26–29.'
  - where: thread
    claim: 'In Mark “to hear” is a metaphor for “to understand”'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'references to “to hear” (Mark 4:9, 12, and 23) would have been understood the way references to “to see” are in a literate, visually focused culture; each phrase is a metaphor for “to understand.”'
  - where: thread
    claim: 'The disciples do not understand the parables (4:13), material only in Mark'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'they don’t understand the parables (see Mark 4:13; this material is not found in the other Gospels)'
  - where: thread
    claim: '“Master” in Mark marks a speaker who does not understand Jesus’s identity, 4:38 among the examples'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'This title does not denote Jesus’ divinity, but rather suggests that most of the people around Jesus do not really understand his identity.'
  - where: thread
    claim: 'The soils are the different ways mortals receive the word'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'The different soils on which the seeds fell represent different ways in which mortals receive and follow these teachings.'
  - where: thread
    claim: 'The disciples’ knowledge was to shine forth to others'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'Their knowledge of the meaning of the parable was not given them for themselves alone, but was to shine forth to others.'
  - where: thread
    claim: 'JST: unto you that continue to receive, more shall be given'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/4?lang=eng'
    quote: 'and unto you that continue to receive, shall more be given'
  - where: thread
    claim: 'The seed growing secretly teaches the vitality of the seed'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'The lesson imparted is the vitality of the seed as a living thing, endowed by its Creator with the capacity to both grow and develop.'
  - where: 'note 4:9 “Ears to hear: a call to understand”'
    claim: 'Two may hear the same words, one in indolence, the other intent on learning'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Two men may hear the same words; one of them listens in indolence and indifference, the other with active mind intent on learning all that the words can possibly convey'
  - where: 'note 4:27 “The seed grows, the sower knows not how”'
    claim: 'The harvest of souls is God’s prerogative; the critics seek a literalism never intended'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'how can it be said that at the harvest time “he putteth in the sickle,” since the final harvesting of souls is the prerogative of God? The perplexities of the critics arise from their attempt to find in the parable a literalism never intended by the Author.'
  - where: 'note 4:27 “The seed grows, the sower knows not how”'
    claim: 'The parable has given rise to much discussion about who the man is'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'This parable has given rise to much discussion among expositors, the question being as to who is meant by the man who cast seed into the ground.'
  - where: 'note 4:31 “The least of seeds”'
    claim: 'The hearers understood the contrast between the seed and the grown plant'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Those who heard the parable evidently understood the contrast between size of seed and that of the fully developed plant.'
  - where: 'note 4:36 “Taken just as He was”'
    claim: 'No time lost in preparation; they set out without delay'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'No time had been lost in unnecessary preparation; “they took him, even as he was, into the ship,” and set out without delay.'
  - where: 'note 4:41 “What manner of man is this?”'
    claim: 'President Hunter: the Lord’s gentle rebuke is largely deserved'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'None of us would like to think we have no faith, but I suppose the Lord’s gentle rebuke here is largely deserved.'
  - where: 'note 4:41 “What manner of man is this?”'
    claim: 'President Hunter: the Jehovah who gathered the waters so the dry land appeared'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'And he is also the one who said, “Let the waters under the heaven be gathered together unto one place, and let the dry land appear.” (Gen. 1:9.)'
  - where: christ
    claim: 'President Hunter: after the storm we hear “how is it that ye have no faith?”'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'And one way or another we always hear in the stillness after the storm, “Why are ye so fearful? how is it that ye have no faith?”'
  - where: 'note 4:9 “Ears to hear: a call to understand”'
    claim: 'Mark’s Gospel was heard aloud; “to hear” in 4:9, 12, 23 means “to understand”'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'references to “to hear” (Mark 4:9, 12, and 23) would have been understood the way references to “to see” are in a literate, visually focused culture; each phrase is a metaphor for “to understand.”'
  - where: 'note 4:9 “Ears to hear: a call to understand”'
    claim: 'Keywords and repetition are appreciated more in an oral text'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'In an oral text, keywords and repetition are generally appreciated more than they are in written texts'
  - where: 'note 4:9 “Ears to hear: a call to understand”'
    claim: 'The lessons of the parables were to be understood by study, prayer and search'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'That the lesson of the parables was comprehensible through study, prayer and search was intimated in the Teacher’s admonishment: “Who hath ears to hear, let him hear.”'
  - where: 'note 4:8 “A harvest that keeps rising”'
    claim: 'Mark’s ascending order perhaps underscores ever-increasing productivity'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Thus, when Mark listed the same quantities as Matthew but in ascending order, perhaps he was underscoring an ever-increasing productivity, not merely a differentiation of yields.'
  - where: 'note 4:8 “A harvest that keeps rising”'
    claim: 'Elder McConkie on degrees of receptive belief (quoted by Halverson); growth most evident in Mark'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: '“But even here,” wrote Elder Bruce R. McConkie, “crops of equal value are not harvested by all the saints. There are many degrees of receptive belief; there are many gradations of effective cultivation.”'
  - where: 'note 4:11 “A mystery given to those who believed”'
    claim: 'mystērion: a hidden thing not obvious to the understanding; in the New Testament, God’s plan of salvation through Christ, once hidden, now revealed'
    key: thayer
    url: 'https://biblehub.com/greek/3466.htm'
    quote: '1. a hidden or secret thing, not obvious to the understanding … In the N. T., God''s plan of providing salvation for men through Christ, which was once hidden but now is revealed'
  - where: 'note 4:11 “A mystery given to those who believed”'
    claim: 'JST Mark 4:9 (footnote 10a): alone with the twelve, and they that believed in him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/4?lang=eng'
    quote: 'alone with the twelve, and they that believed in him, they that were'
  - where: 'note 4:11 “A mystery given to those who believed”'
    claim: 'Joseph Smith: the multitude received no explanation because of unbelief; the disciples were given the mysteries because of faith and confidence in Him'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/2'
    quote: 'the very reason why the multitude, or the world, as they were designated by the Savior, did not receive an explanation upon his parables, was, because of unbelief. … and why? because of the faith and confidence which they had in him.'
  - where: 'note 4:11 “A mystery given to those who believed”'
    claim: 'The explanation was for His fellow sowers, a view of the kingdom they were to establish'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Christ was revealing to His fellow sowers a prophetic view of the kingdom they were working to establish.'
  - where: 'note 4:12 “Not unable to see, but unwilling”'
    claim: 'Mark gives the words of Isaiah 6:9 without marking them as a quotation'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'St. Mark characteristically gives the words of Isaiah 6:9, but not as a quotation'
  - where: 'note 4:12 “Not unable to see, but unwilling”'
    claim: 'Joseph Smith: the multitude was condemned because they were not willing to see, not because they could not'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/1'
    quote: 'the condemnation which rested upon the multitude, which received not his saying, was because they were not willing to see with their eyes and hear with their ears; not because they could not and were not privileged to see, and hear'
  - where: 'note 4:12 “Not unable to see, but unwilling”'
    claim: 'Mark 4:12 gives the reason for the parables: to veil the meaning; a parable conveys truth in proportion to faith and intelligence'
    key: bd-parables
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/parables?lang=eng'
    quote: 'It was to veil the meaning. The parable conveys to the hearer religious truth exactly in proportion to his faith and intelligence; to the dull and uninspired it is a mere story'
  - where: 'note 4:12 “Not unable to see, but unwilling”'
    claim: 'Only he who seeks finds'
    key: bd-parables
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/parables?lang=eng'
    quote: 'Thus it is that the parable exhibits the condition of all true knowledge. Only he who seeks finds.'
  - where: 'note 4:13 “The parable that unlocks the rest”'
    claim: 'The question of 4:13 is in Mark only, and shows the disciples not understanding'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'they don’t understand the parables (see Mark 4:13; this material is not found in the other Gospels)'
  - where: 'note 4:13 “The parable that unlocks the rest”'
    claim: 'In Mark the disciples are learners who keep trying'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'In this Gospel, Jesus’ disciples are far from flawless; instead, they are learners'
  - where: 'note 4:13 “The parable that unlocks the rest”'
    claim: 'Mark 4:13 makes the sower foundational; the other parables grow out of it'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Clearly, when Jesus based the understanding of “all parables” on the understanding of “this parable” (Mark 4:13), He asserted the foundational character of the sower. His other parables, particularly the parables of the kingdom, were outgrowths of the story of seeds and soils.'
  - where: 'note 4:13 “The parable that unlocks the rest”'
    claim: 'Joseph Smith: the sower shows the effects of preaching the word, and alludes to the setting up of the kingdom in that age'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/2'
    quote: 'This parable was spoken to demonstrate the effects that are produced by the preaching of the word; and we believe that it has an allusion directly, to the commencement, or the setting up of the kingdom in that age'
  - where: 'note 4:17 “No root in themselves”'
    claim: 'Elder Oaks: those merely converted to missionaries or the Church’s attractions have no root; long-time members can too'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'This is the circumstance of new members who are merely converted to the missionaries or to the many attractive characteristics of the Church or to the many great fruits of Church membership.'
  - where: 'note 4:17 “No root in themselves”'
    claim: 'Elder Oaks: not rooted and regular, any one can develop a stony heart'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'If we are not rooted in the teachings of the gospel and regular in its practices, any one of us can develop a stony heart, which is stony ground for spiritual seeds.'
  - where: 'note 4:17 “No root in themselves”'
    claim: 'Halverson on Mark’s “in themselves”: unable to survive on someone else’s water'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'if they “have no root in themselves” (Mark 4:17; emphasis added), they will eventually find themselves unable to survive in thin soil on someone else’s water.'
  - where: 'note 4:19 “Thorns that enter after the sowing”'
    claim: 'The thorns spring up only after the sowing; the third soil looks like the fourth before planting'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Even in Matthew’s and Mark’s accounts, the thorns do not “spring up” until after the seed has been sown. Accordingly, the third type of soil seems no different from the fourth type of soil before its planting.'
  - where: 'note 4:19 “Thorns that enter after the sowing”'
    claim: 'Worldly distractions “entering in” sap the seedling’s strength'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Meanwhile, however, Satan ensures that worldly distractions begin “entering in” (Mark 4:19) as well, until they sap the strength of the growing seedling and keep it from bearing fruit'
  - where: 'note 4:19 “Thorns that enter after the sowing”'
    claim: '“Becometh unfruitful” suggests some fruit had grown'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'In Matthew’s and Mark’s accounts, the plant “becometh unfruitful” (Matthew 13:22; Mark 4:19; emphasis added), suggesting that earlier at least some fruit had grown.'
  - where: 'note 4:19 “Thorns that enter after the sowing”'
    claim: 'Elder Oaks: some hearts are set upon the things of the world'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'In susceptibility to spiritual teachings, some hearts are hardened and unprepared, some hearts are stony from disuse, and some hearts are set upon the things of the world.'
  - where: 'note 4:21 “A lamp is lit to be seen”'
    claim: 'The bushel (modios) is the Latin modius, a dry measure of about a peck'
    key: thayer
    url: 'https://biblehub.com/greek/3426.htm'
    quote: 'a dry measure holding 16 sextarii (or one sixth of the Attic medimnus; commentary Nepos, Attic 2 (i. e. about a peck, A. V. bushel'
  - where: 'note 4:21 “A lamp is lit to be seen”'
    claim: 'Mark joins the candle saying to the sower; likely spoken there; the disciples’ knowledge was to shine to others'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'it is not unlikely that this of the “candle” was actually spoken in the connection in which we find it here. Their knowledge of the meaning of the parable was not given them for themselves alone, but was to shine forth to others.'
  - where: 'note 4:24 “The measure of hearing”'
    claim: 'JST Mark 4:20 (footnote 24a): unto you that continue to receive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/4?lang=eng'
    quote: 'and unto you that continue to receive, shall more be given'
  - where: 'note 4:24 “The measure of hearing”'
    claim: 'JST Mark 4:20 (footnote 25a): he that receiveth; he that continueth not to receive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/4?lang=eng'
    quote: 'for he that receiveth, to him shall be given; but he that continueth not to receive, from him shall'
  - where: 'note 4:24 “The measure of hearing”'
    claim: 'Joseph Smith on the same saying in Matthew: he that will not receive the greater light loses all the light he has'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/1'
    quote: 'therefore he that will not receive the greater light, must have taken away from him, all the light which he hath.'
  - where: 'note 4:24 “The measure of hearing”'
    claim: 'In Matthew 7 the measure is retribution; here, the measure we mete our knowledge, God gives more knowledge'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'In the Sermon on the Mount it appears as the law of retribution, which brings pardon to those who pardon, judgment without mercy to those who show no mercy. Here the law works in another region. With the measure with which we mete our knowledge, God will. in His bounty, bestow more knowledge upon us.'
  - where: 'note 4:27 “The seed grows, the sower knows not how”'
    claim: 'Only Mark has the parable; Smith’s guess why the others left it out'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark’s Gospel is the only account to contain the parable found in Mark 4:26–29. Perhaps Matthew and Luke omitted this story because it was so similar to the parable found in Mark 4:3–8.'
  - where: 'note 4:27 “The seed grows, the sower knows not how”'
    claim: 'Who the sower is has puzzled expositors; whoever plants, the seed is alive; the lesson is the seed’s vitality'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Whether the seed be planted by the Lord Himself, as when He taught in Person, or by any one of His authorized servants, the seed is alive and will grow. … The lesson imparted is the vitality of the seed as a living thing, endowed by its Creator with the capacity to both grow and develop.'
  - where: 'note 4:27 “The seed grows, the sower knows not how”'
    claim: 'The parable is a lesson for teachers and missionaries: the growth depends on the learner’s agency and on God'
    key: lopez-seed-growing-secretly
    url: 'https://www.churchofjesuschrist.org/study/liahona/2003/02/the-parable-of-the-seed-growing-secretly?lang=eng'
    quote: 'The choice of whether a person will ponder and accept the truths of the gospel belongs, as a matter of personal agency, with those we teach. If a person’s testimony is to grow until it bears mature fruit, or conversion, God must be the primary force behind our harvest.'
  - where: 'note 4:27 “The seed grows, the sower knows not how”'
    claim: 'The sower plants in faith and harvests in joy'
    key: lopez-seed-growing-secretly
    url: 'https://www.churchofjesuschrist.org/study/liahona/2003/02/the-parable-of-the-seed-growing-secretly?lang=eng'
    quote: 'In this parable the sower plants in faith and harvests in joy.'
  - where: 'note 4:31 “The least of seeds”'
    claim: 'Mustard seed is not the smallest; black mustard is not a true tree; hyperbole; large enough for small birds'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'Hyperbole is perhaps involved in this parable for though the seeds are small, they are not the smallest or “least” among seeds. Moreover, being an annual herb, black mustard is not a true tree. Still, the mature plants can be large and sturdy enough to support the small birds'
  - where: 'note 4:31 “The least of seeds”'
    claim: 'Joseph Smith: the mustard seed represents the church as it comes forth in the last days'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/3'
    quote: 'Now we can discover plainly, that this figure is given to represent the church as it shall come forth in the last days.'
  - where: 'note 4:31 “The least of seeds”'
    claim: 'Joseph Smith: the Book of Mormon, accounted the least of all seeds, branching forth; God sending powers, gifts and angels to lodge in the branches'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/3'
    quote: 'let us behold it coming forth out of the ground, which is indeed accounted the least of all seeds, but behold it branching forth … and God is sending down his powers, gifts and angels, to lodge in the branches thereof'
  - where: 'note 4:33 “As they were able to bear it”'
    claim: 'JST Mark 4:26 (footnote 33a): able to bear'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/4?lang=eng'
    quote: 'able to bear; but without'
  - where: 'note 4:33 “As they were able to bear it”'
    claim: 'Parables a merciful adaptation of the word to the capacities of hearers; the story lives until experience prepares them'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Another example of the merciful adaptation of the word of truth to the varied capacities of the people who heard the parables is found in the psychological fact, that the incidents of an impressive though simple story will live'
  - where: 'note 4:33 “As they were able to bear it”'
    claim: 'When time and experience had prepared them, they would find the truth in the story'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'And then, when time and experience, including suffering perhaps, had prepared them for deeper thought, they would find the living kernel of gospel truth within the husk'
  - where: 'note 4:36 “Taken just as He was”'
    claim: '“Even as he was” is only in Mark and points to Jesus’s exhaustion after the day'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'The phrase is peculiar to this Gospel, and seems to point to the impression made on the mind of St. Mark’s informant by the utter exhaustion that followed on the long day’s labours.'
  - where: 'note 4:36 “Taken just as He was”'
    claim: 'The pillow: the cushion usually found in a boat’s stern'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'Better, on the pillow—the cushion commonly to be found in the boat’s stern.'
  - where: 'note 4:36 “Taken just as He was”'
    claim: 'His sleep shows the reality of His body'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The circumstance is instructive as it evidences at once the reality of the physical attributes of Christ'
  - where: 'note 4:37 “A storm off the hills”'
    claim: 'The Sea of Galilee lies low among steep hills; cold air meets warm air and sudden violent storms arise'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'The Sea of Galilee is quite low, about 680 feet below sea level, and the heat becomes quite great. The hills surrounding the water rise up very sharply and to considerable height. The cold air rushing down from the hills meets the warm air rising from the lake'
  - where: 'note 4:37 “A storm off the hills”'
    claim: 'Such sudden and violent storms; it was such a storm they met'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'sudden and temporarily violent storms can occur on the surface of that inland sea. It was just such a storm as this that Jesus and his disciples found as they crossed the lake at evening time.'
  - where: 'note 4:37 “A storm off the hills”'
    claim: 'The verbs describe continuous action: the boat was filling'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'Better, were beating upon the ship, so that it was filling. Both verbs describe continuous action.'
  - where: 'note 4:38 “Carest thou not that we perish?”'
    claim: '“Master” is the commonest address to Jesus in Mark; it does not denote divinity; the speaker usually does not understand, 4:38 among the examples'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'it seems that the person calling Jesus “Master” usually does not accept him as such (see Mark 12:14, 19) or in the very statement shows that he or she does not understand what Jesus is teaching or doing (see Mark 4:38'
  - where: 'note 4:38 “Carest thou not that we perish?”'
    claim: 'Only Mark gives the despairing expostulation, which shows the want of faith reproved afterward'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'St. Mark alone gives this touch of despairing expostulation, in which we trace the specific want of faith which was afterwards reproved.'
  - where: 'note 4:38 “Carest thou not that we perish?”'
    claim: 'President Hunter: all of us in sudden storms ask “Master, carest thou not that we perish?” and hear the question of faith afterward'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'we have had sudden squalls arise which have made us ask one way or another, “Master, carest thou not that we perish?” And one way or another we always hear in the stillness after the storm, “Why are ye so fearful? how is it that ye have no faith?”'
  - where: 'note 4:39 “Muzzled”'
    claim: 'phimoō: to muzzle; metaphorically to make speechless; passive “hold one’s peace,” in Mark 1:25 and 4:39'
    key: thayer
    url: 'https://biblehub.com/greek/5392.htm'
    quote: 'to close the mouth with a muzzle, to muzzle … metaphorically, to stop the mouth, make speechless, reduce to silence … passive, to become speechless, hold one''s peace, Matthew 22:12; Mark 1:25; Mark 4:39'
  - where: 'note 4:39 “Muzzled”'
    claim: 'Literally “be still, be silenced”; Mark gives the words addressed to the sea as though it were a hostile power rebelling against its Lord'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/4.htm'
    quote: 'Literally, be still, be silenced … Note the vividness with which St. Mark gives the very words addressed to the raging sea, as though it were a hostile power rising in rebellion against its true Lord.'
  - where: 'note 4:41 “What manner of man is this?”'
    claim: 'Mark and Luke tell the story to show Jesus’s power over the physical elements'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'Mark and Luke use the story to show that Jesus has power over the physical elements (see Mark 4:35–41; Luke 8:22–25)'
  - where: 'note 4:41 “What manner of man is this?”'
    claim: 'The footnote to “calm” points to Psalm 89:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/4?lang=eng'
    quote: 'Ps. 89:9'
  - where: 'note 4:41 “What manner of man is this?”'
    claim: 'President Hunter: this is Jehovah, who divided the waters at the Creation and parted the Red Sea'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'This great Jehovah, in whom we say we trust and whose name we have taken upon us, is he who said, “Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.”'
  - where: 'note 4:41 “What manner of man is this?”'
    claim: 'President Hunter: He parted the Red Sea; no surprise He could command the elements on Galilee; the rebuke largely deserved'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'Furthermore, it was he who parted the Red Sea, allowing the Israelites to pass through on dry ground. (See Ex. 14:21–22.) Certainly it should be no surprise that he could command a few elements acting up on the Sea of Galilee.'
  - where: christ
    claim: 'Whether the Lord or His servants plant, the seed is alive and will grow'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Whether the seed be planted by the Lord Himself, as when He taught in Person, or by any one of His authorized servants, the seed is alive and will grow.'
  - where: christ
    claim: 'President Hunter: He can calm the troubled waters of our lives'
    key: hunter-tempest-raging
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/master-the-tempest-is-raging?lang=eng'
    quote: 'And our faith should remind us that he can calm the troubled waters of our lives.'
