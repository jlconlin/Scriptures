chapter: 13
claims:
  - where: when
    claim: 'The last week of His ministry; He often frequented the temple'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'During the last week of His mortal ministry, the Savior often frequented the temple.'
  - where: when
    claim: 'From the Mount of Olives, a full view of the temple'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'As Jesus and His disciples sat on the Mount of Olives, they would have had an uninterrupted view of the magnificent temple complex.'
  - where: setting
    claim: 'Jesus leaves the temple for the last time in Mark'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'The Olivet Discourse begins as Jesus leaves the temple for the last time. The only further mentionings of the temple in Mark are the charges at the trial and crucifixion'
  - where: setting
    claim: 'One of only two discourses in a fast-paced Gospel of deeds'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'it is one of only two discourses in an otherwise fast-paced Gospel that concentrates more on the deeds and short, substantial teachings of Jesus.'
  - where: setting
    claim: 'Mark lacks the love of many waxing cold, the eagles and Noah, and alone has the porter'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'It does not include Jesus’s teachings on the love of many waxing cold, … the parable of the carcass and the eagles, the sign of Noah'
  - where: setting
    claim: 'Joseph Smith and Sidney Rigdon copied revised Matthew 24 into the place of Mark 13'
    key: jackson-jst-new-testament
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/joseph-smiths-translation-new-testament'
    quote: 'they simply copied the revised text of Matthew 24 into the place of Mark 13 rather than creating a new translation of the Mark account.'
  - where: setting
    claim: 'Probably near December 1831'
    key: jackson-jst-new-testament
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/joseph-smiths-translation-new-testament'
    quote: 'The Mark 13 text was created probably near December 1831.'
  - where: setting
    claim: 'Later revisions mean the two texts are not quite identical'
    key: jackson-jst-new-testament
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/joseph-smiths-translation-new-testament'
    quote: 'Because this transcription was made before later revisions were added both in Matthew and in Mark, the texts are not quite identical now.'
  - where: setting
    claim: 'Many scholars think Mark wrote to the Saints in Rome; a hard time under Nero'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Many scholars consider Mark’s Gospel to be written to the Saints in Rome'
  - where: setting
    claim: 'A hard time for Christians in Rome under Nero; the discourse acknowledges the costs of discipleship'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'A major focus, therefore, of Mark’s Gospel, and particularly the Olivet Discourse, is to acknowledge the costs of discipleship during difficult times and to reassure the Saints that even in such times there is reason to have hope.'
  - where: thread
    claim: 'Four sections, each opened by “take heed” (vv. 5, 9, 23, 33)'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Jesus’s response can be divided into four sections, each introduced by the injunction to “take heed” (vv. 5, 9, 23, 33).'
  - where: thread
    claim: 'He uses the temple’s fall to teach what discipleship means, costs and hopes for'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'He also uses the destruction of the temple to teach His followers what it means to be a disciple, what it costs be a disciple, and what the hope is of being a disciple.'
  - where: thread
    claim: 'The language shifts from “those days” to “that day” at verse 32'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'In verse 32, however, the Savior’s language changes from the plural “those days” to the singular “that day” and “that hour.”'
  - where: 'note 13:1 “Great stones, just after the widow’s mites”'
    claim: 'Herod’s expansion of the temple a masterpiece; in progress over 46 years, finished just before AD 70'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'When Jesus began His public ministry, the project had already been in progress for over forty-six years (see John 2:20) and would not be totally completed until just a few years before its destruction by the Romans in AD 70.'
  - where: 'note 13:1 “Great stones, just after the widow’s mites”'
    claim: 'The temple the crowning jewel of the religion; the prophecy struck at its heart'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Jesus’s prophecy attacked the very heart and soul of Judaism. The temple represented the crowning jewel of their religion and the center of their system of rituals.'
  - where: 'note 13:1 “Great stones, just after the widow’s mites”'
    claim: 'Mark’s placing of the two stories side by side gives them point: stones admired more than the widow’s mite'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/13.htm'
    quote: 'Here, again, the juxtaposition of narratives in St. Mark gives them a special point.'
  - where: 'note 13:1 “Great stones, just after the widow’s mites”'
    claim: 'They may have admired the stones more than the mite; the stones to be destroyed'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/13.htm'
    quote: 'They admired the “goodly stones” more than the “widow’s mite.” They were now to be taught that, while the one should be spoken of throughout the whole world, the other should be destroyed'
  - where: 'note 13:1 “Great stones, just after the widow’s mites”'
    claim: 'The sanctuary destroyed by fire in AD 70'
    key: ludlow-first-jewish-revolt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/first-jewish-revolt-against-rome'
    quote: 'Fire was finally set to the temple gates, leading to the eventual destruction of the magnificent sanctuary in AD 70.'
  - where: 'note 13:3 “Over against the temple”'
    claim: 'Only Mark mentions the view; it made what followed more vivid'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/13.htm'
    quote: 'The view which the position commanded, and which St. Mark alone mentions, made all that followed more vivid and impressive.'
  - where: 'note 13:3 “Over against the temple”'
    claim: 'Only here is Andrew named with the inner three'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/13.htm'
    quote: 'as the only instance in which the name of Andrew appears in conjunction with the three who were on other occasions within the inner circle of companionship'
  - where: 'note 13:3 “Over against the temple”'
    claim: 'Jesus leaves the temple for the last time; possibly an echo of the glory leaving the temple in Ezekiel'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'This may be a veiled reference to the dramatic withdrawal of God’s glory from the temple in Ezekiel’s vision (see Ezekiel 10:18–19; 11:22–23).'
  - where: 'note 13:3 “Over against the temple”'
    claim: 'Once Jesus withdrew, the buildings a hollow shell'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'But now that Jesus had withdrawn, the buildings were but a hollow shell of what God had intended for them.'
  - where: 'note 13:4 “Two questions, both about the temple”'
    claim: 'In Mark both questions focus on the temple; the Second Coming secondary'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Rather, both questions focus on the destruction of the temple'
  - where: 'note 13:4 “Two questions, both about the temple”'
    claim: 'The Second Coming is discussed toward the end; the emphasis is the temple'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Although the Second Coming is discussed toward the end of the chapter, the emphasis in Mark is the destruction of the temple, and the Second Coming takes on a secondary role.'
  - where: 'note 13:4 “Two questions, both about the temple”'
    claim: 'Mark’s questions less distinct; the answer can be read as answering both at once'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'In all three synoptic accounts, Jesus’s words can be understood as answering both questions simultaneously, treating the two questions almost as one.'
  - where: 'note 13:4 “Two questions, both about the temple”'
    claim: 'The challenge: whether the temple’s fall and the Second Coming were to coincide'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'The challenge is to determine whether he (or the early Christians who preserved and arranged his words) wanted readers to believe that the destruction of the temple and the Second Coming would take place at the same time or be events separated by many years.'
  - where: 'note 13:4 “Two questions, both about the temple”'
    claim: 'JS—M rearranges the material so the prophecies of the two events mirror one another'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'A significant contribution of the Joseph Smith—Matthew account is that it rearranges the material in Matthew to clarify that the prophecies about these events virtually mirror one another.'
  - where: 'note 13:4 “Two questions, both about the temple”'
    claim: 'JS—M 1:4 asks of the temple and the Jews, and of His coming and the end of the world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'Tell us when shall these things be which thou hast said concerning the destruction of the temple, and the Jews; and what is the sign of thy coming, and of the end of the world'
  - where: 'note 13:5 “Take heed: four commands”'
    claim: 'Each “take heed” is an imperative of blepō, “see”; a command, not advice'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'The Greek word in each case is the second plural present active imperative of blepō. In its basic sense, blepō means “to see or perceive.” In this discourse, Jesus uses the imperative to show that what He is saying is not sage advice—it is a command.'
  - where: 'note 13:5 “Take heed: four commands”'
    claim: 'First-century men proclaimed themselves saviors from Rome'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'During the first century, a number of individuals proclaimed themselves to be saviors from the Roman occupation. They gathered large followings but were ultimately unsuccessful.'
  - where: 'note 13:5 “Take heed: four commands”'
    claim: 'A false Christ is any figure that sets itself up as a source of salvation other than Christ'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'A false Christ is any figure or institution that sets itself up as a source of salvation other than Christ or His Church.'
  - where: 'note 13:5 “Take heed: four commands”'
    claim: 'The Greek of verse 6 reads “I am,” without “Christ”'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/13-6.htm'
    quote: 'Scrivener''s Textus Receptus 1894 πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου, λέγοντες ὅτι Ἐγώ εἰμι·'
  - where: 'note 13:8 “The first pains of labor”'
    claim: '“Sorrows” are birth pangs; the plural used of calamities expected before the Messiah'
    key: thayer
    url: 'https://biblehub.com/greek/5604.htm'
    quote: 'the pain of childbirth, travail-pain, birth-pang … equivalent to intolerable anguish, in reference to the dire calamities which the Jews supposed would precede the advent of the Messiah'
  - where: 'note 13:8 “The first pains of labor”'
    claim: 'Not all turmoil is a sign that the end is near; it is part of mortal life'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Not all turmoil or natural disasters are indicators that the end is upon us. They are part of the mortal experience.'
  - where: 'note 13:8 “The first pains of labor”'
    claim: 'JST moves wars, famines and earthquakes later, into a last-days setting'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'Thus “wars and rumors of wars,” kingdoms fighting against kingdoms, famines, pestilences, and earthquakes are moved from early in the chapter to later, giving them a last-days setting.'
  - where: 'note 13:9 “Delivered up”'
    claim: 'John “put in prison” is paradidōmi, handed over'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: '“Put in prison” is a translation of the Greek word, paradidōmi, which has the basic sense of being handed over or delivered.'
  - where: 'note 13:9 “Delivered up”'
    claim: 'Judas “betrayed” is the same word; the theme is lost in English'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'The Greek word that is here translated as “betrayed” is paradidōmi, the same word used to describe John’s imprisonment. Mark is here drawing his readers’ attention to an important theme, one that is lost in the English translation.'
  - where: 'note 13:9 “Delivered up”'
    claim: 'Disciples who preach can expect to be delivered up and betrayed, verses 9, 10, 12'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'In Mark 13 we learn that disciples of Christ, as they preach the gospel (see v. 10), can also expect to be delivered up (paradidōmi) to the councils (see v. 9) and have brother betray (paradidōmi) brother to death (see v. 12).'
  - where: 'note 13:9 “Delivered up”'
    claim: 'Jesus’s being handed over was a precursor to His glory; the Saints hold to the hope of His return'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Although the Savior was handed over because of His preaching, Mark’s Gospel shows that this betrayal was just a precursor to Him receiving His glory.'
  - where: 'note 13:11 “Take no thought”'
    claim: '“Take no thought beforehand” means be not anxious beforehand; “thought” in 1611 meant anxiety'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/13.htm'
    quote: 'Rather, be not anxious beforehand, or distracted beforehand with anxiety.'
  - where: 'note 13:11 “Take no thought”'
    claim: '“Thought” in the translators’ day meant undue care or anxiety'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/13.htm'
    quote: '“Thought,” when our translation was made, signified undue care or anxiety.'
  - where: 'note 13:11 “Take no thought”'
    claim: 'The same promise in Matthew is part of the charge to the Twelve'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/13.htm'
    quote: 'Comp. Matthew 10:19-20, where the words occur as a portion of our Lord’s charge to His Twelve Apostles.'
  - where: 'note 13:14 “Standing where it ought not”'
    claim: 'Mark has “where it ought not” for Matthew’s “in the holy place”; the enigmatic form likelier the phrase used'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/13.htm'
    quote: 'St. Mark substitutes this for “in the holy place” of St. Matthew. Of the two, the former seems, in its enigmatic form, more likely to have been the phrase actually used'
  - where: 'note 13:14 “Standing where it ought not”'
    claim: 'The horror is the Roman army'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/13.htm'
    quote: 'The horror is the Roman army, and it is a horror because of the desolation it brings.'
  - where: 'note 13:14 “Standing where it ought not”'
    claim: '“Let him that readeth understand” possibly a direction to the reader in synagogue or church to explain to hearers'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/13.htm'
    quote: 'The words may be taken as a direction to the reader in synagogue or church to explain further the meaning to hearers, it being a matter of vital practical concern.'
  - where: 'note 13:14 “Standing where it ought not”'
    claim: 'The chapter’s message is for all who read it (v. 14)'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'This message is of importance not just for Peter, James, John, and Andrew, but for all those who read this chapter (see v. 14).'
  - where: 'note 13:14 “Standing where it ought not”'
    claim: 'Fulfilled first when Titus besieged Jerusalem in AD 70'
    key: bd-abomination-of-desolation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abomination-of-desolation?lang=eng'
    quote: 'The first was to be when the Roman legions under Titus, in A.D. 70, laid siege to Jerusalem (Matt. 24:15; JS—M 1:12).'
  - where: 'note 13:14 “Standing where it ought not”'
    claim: 'Fulfilled again in the last days: Jerusalem again under siege'
    key: bd-abomination-of-desolation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abomination-of-desolation?lang=eng'
    quote: '“And again shall the abomination of desolation, spoken of by Daniel the prophet, be fulfilled” (JS—M 1:31–32). That is, Jerusalem again will be under siege.'
  - where: 'note 13:27 “Gathered from the four winds”'
    claim: 'Modern revelation reads the coming in the clouds as the Second Coming'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Many people, as well as modern revelation, interpret the description of “the Son of Man coming in the clouds with great power and glory” to be a description of the Second Coming (see D&C 45:40–59).'
  - where: 'note 13:27 “Gathered from the four winds”'
    claim: 'JS—M 1:37: whoso treasureth up my word; the remainder of his elect gathered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'And whoso treasureth up my word, shall not be deceived, for the Son of Man shall come, and he shall send his angels before him with the great sound of a trumpet, and they shall gather together the remainder of his elect'
  - where: 'note 13:30 “Which generation”'
    claim: 'The generation in which the events are realized; Jerusalem’s fall within the apostles’ lifetime'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'This may be understood as applying to the generation in which the portentous happenings before described would be realized. So far as the predictions related to the overthrow of Jerusalem, they were literally fulfilled within the natural lifetime of several of the apostles'
  - where: 'note 13:30 “Which generation”'
    claim: 'The signs of His coming fulfilled within the generation of those who see them begin'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'such of the Lord’s prophecies as pertain to the heralding of His second coming are to be brought to pass within the duration of the generation of some who witness the inauguration of their fulfilment.'
  - where: 'note 13:30 “Which generation”'
    claim: 'JS—M 1:34 reads “this generation, in which these things shall be shown forth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'Verily, I say unto you, this generation, in which these things shall be shown forth, shall not pass away until all I have told you shall be fulfilled.'
  - where: 'note 13:32 “Not even the Son”'
    claim: 'At verse 32 the language turns from “those days” to “that day”; Jesus now speaks of His Second Coming'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'In verse 32, however, the Savior’s language changes from the plural “those days” to the singular “that day” and “that hour.”'
  - where: 'note 13:32 “Not even the Son”'
    claim: 'Jesus now addresses His Second Coming'
    key: strathearn-olivet-mark
    url: 'https://rsc.byu.edu/behold-lamb-god/discipleship-olivet-discourse-marks-gospel'
    quote: 'Jesus now addresses His Second Coming.'
  - where: 'note 13:32 “Not even the Son”'
    claim: 'In the flesh Jesus claimed no omniscience; He learned what He willed to know from the Father'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'While in the flesh He laid no claim to omniscience; though whatever He willed to know He learned through the medium of communication with the Father.'
  - where: 'note 13:32 “Not even the Son”'
    claim: 'He had not asked to know what the Father had not shown readiness to reveal'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'Christ had not asked to know what the Father had not intimated His readiness to reveal, which, in this instance, was the day and hour of the Son’s appointed return to earth as a glorified, resurrected Being.'
  - where: 'note 13:32 “Not even the Son”'
    claim: 'The JST of Mark 13 is the revised Matthew 24 copied in'
    key: jackson-jst-new-testament
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/joseph-smiths-translation-new-testament'
    quote: 'they simply copied the revised text of Matthew 24 into the place of Mark 13 rather than creating a new translation of the Mark account.'
  - where: 'note 13:34 “The porter told to watch”'
    claim: 'The porter is unique among the parables'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/13.htm'
    quote: 'This feature is unique in our Lord’s parables, and, as such, seems to call for a special interpretation.'
  - where: 'note 13:34 “The porter told to watch”'
    claim: 'Peter suggested as the porter, who had the promise of the keys'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/13.htm'
    quote: 'The answer appears to be found in the promise of the keys of the kingdom that had been made to St. Peter (Matthew 16:19). It was his work to open the door of that kingdom wide, to be ready for his Lord’s coming'
  - where: 'note 13:34 “The porter told to watch”'
    claim: 'The four times are roughly the four watches of the night'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/13.htm'
    quote: 'The four times correspond roughly to the four watches of the night'
  - where: 'note 13:34 “The porter told to watch”'
    claim: 'Each servant has his task; the porter’s is to watch'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/13.htm'
    quote: 'note that in this parable the function of watching becomes the business of one—the porter. Each servant has his appropriate task; the porter’s is to watch.'
  - where: 'note 13:34 “The porter told to watch”'
    claim: 'The authority is the master’s, given to the servants in his absence, with each one’s work'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/13.htm'
    quote: 'τὴν ἐξουσίαν, his (the master’s) authority, distributed among the servants when he could no longer exercise it himself.'
  - where: 'note 13:34 “The porter told to watch”'
    claim: 'Peter, under whose eye Mark wrote, seems to want readers to notice he himself failed to watch'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/13.htm'
