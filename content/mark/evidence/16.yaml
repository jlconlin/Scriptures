  - where: christ
    claim: 'Mentioning Peter is evidence of mercy; the risen Jesus will not turn his back on one who turned against him'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'in the reference to Peter, the audience realizes that the resurrected Jesus is not going to turn his back even against one who turned against him.'
  - where: christ
    claim: 'Jesus is patient with disciples and does not abandon them; they are continually invited to follow'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'even when they fundamentally misunderstand his mission, betray him, deny him, and are afraid at the news of the Resurrection, he does not abandon them. They are continually invited to follow him.'
  - where: christ
    claim: 'The Lord gave the same commission to the Nephite disciples'
    key: sc-knowhy-522
    url: 'https://scripturecentral.org/knowhy/why-does-part-of-the-long-ending-of-mark-show-up-in-the-book-of-mormon'
    quote: 'it is reasonable to believe, as Moroni states, that the resurrected Savior gave the same teachings and assurances to his twelve Nephite disciples in Bountiful, as quoted in Mormon 9:22–24.'
  - where: explore
    claim: 'Smith’s chapter reads the young man, the women and Peter together'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'In the young man, the audience sees the potential for the Resurrection to exchange shame for glory not just in Jesus but also in his followers; in the female witnesses, the audience sees the need to listen to women as authorized messengers'
