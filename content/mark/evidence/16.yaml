    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/damnation?lang=eng'
    quote: 'The state of being stopped in one’s progress and denied access to the presence of God and His glory. Damnation exists in varying degrees.'
  - where: 'note 16:17 “Signs that follow”'
