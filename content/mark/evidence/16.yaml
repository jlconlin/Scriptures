  - where: 'note 16:16 “Damned”'
    claim: 'Better “shall be condemned”'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/16.htm'
    quote: 'Better, shall be condemned. The Greek word does not necessarily imply the idea of irreversible endless condemnation which has come to be attached to the English one.'
  - where: 'note 16:16 “Damned”'
    claim: 'Damnation is being stopped in progress; it exists in degrees'
