    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/68?lang=eng'
    quote: 'Go ye into all the world, preach the gospel to every creature, acting in the authority which I have given you, baptizing in the name of the Father, and of the Son, and of the Holy Ghost.'
  - where: 'note 16:16 “Damned”'
    claim: 'katakrinō: of God condemning one (Mark 16:16)'
    key: thayer
    url: 'https://biblehub.com/greek/2632.htm'
