    url: 'https://biblehub.com/commentaries/ellicott/mark/16.htm'
    quote: 'The instance of St. Paul at Melita is the only recorded example of the kind (Acts 28:1-6). … If they drink any deadly thing . . .—Of this there is no recorded instance in the New Testament'
  - where: 'note 16:18 “Serpents and deadly things”'
