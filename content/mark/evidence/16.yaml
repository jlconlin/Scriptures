chapter: 16
claims:
  - where: setting
    claim: 'The oldest and most reliable Greek manuscripts break off after verse 8'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'the oldest and most reliable Greek manuscripts break off after verse 8, producing what is often called “the Short Ending of Mark.”'
  - where: setting
    claim: 'Latter-day Saint scholars differ: some argue the longer ending is authentic'
    key: lindsay-longer-ending-1
    url: 'https://journal.interpreterfoundation.org/the-book-of-mormon-versus-the-consensus-of-scholars-surprises-from-the-disputed-longer-ending-of-mark-part-1/'
    quote: 'Fortunately, recent modern scholarship offers compelling reasons for overturning the old consensus against the longer ending of Mark.'
  - where: setting
    claim: 'The Church’s edition prints 16:9–20 with a heading that summarizes them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/16?lang=eng'
    quote: 'Christ is risen—He appears to Mary Magdalene, then to others—He sends'
  - where: thread
    claim: 'In Mark the disciples fail repeatedly, ending with the women leaving the tomb in silence'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'they all flee when Jesus is arrested (see Mark 14:50–52); and the women leave the tomb in silence (see Mark 16:8). In this Gospel, Jesus’ disciples are far from flawless; instead, they are learners who repeatedly stumble.'
  - where: thread
    claim: 'The message to the disciples and Peter signals their restoration in Galilee, where their ministry began; the women too will be restored'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Peter, along with the others, will soon meet the Risen Lord in Galilee, where they will revive their apostolic ministry in the place where it had begun. … Nevertheless, they, too, will be restored.'
  - where: thread
    claim: 'The young man at the tomb read as the disciple restored from shame to glory'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Part of the puzzle of Mark’s enigmatic ending is solved when the young man at the tomb is understood as a picture of the ideal disciple—failed, restored, glorified, and providing a template for the other disciples.'
  - where: 'note 16:1 “Spices for a hurried burial”'
    claim: 'The women came for a further, more thorough anointing because the body had been wrapped in haste by Joseph and Nicodemus before the Sabbath'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'Some of them had been witnesses of the burial, and were conscious of the necessary haste with which the corpse had been wrapped with spicery and laid away by Joseph and Nicodemus, just before the beginning of the Sabbath'
  - where: 'note 16:1 “Spices for a hurried burial”'
    claim: 'They bought spices as soon as the Sabbath ended after sunset Saturday; the same three women watched the crucifixion; the Marys saw the burial and knew the tomb'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'as soon as the Sabbath ended shortly after sunset on Saturday, … bought spices, … These were the same three women who … had watched the crucifixion … they also knew exactly where he had been buried'
  - where: 'note 16:3 “Who shall roll us away the stone?”'
    claim: 'Only Mark has the women wonder about the stone; a detail that heightened the drama in oral presentation'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'only in Mark’s Gospel do they wonder about how they will move the stone … This is the sort of detail that would have heightened the drama in an oral presentation of Mark’s Gospel, but perhaps seemed unnecessary in the written accounts'
  - where: 'note 16:3 “Who shall roll us away the stone?”'
    claim: 'Mark’s audience would normally have heard the Gospel read aloud'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The normal method for the audience to experience this Gospel would have been for them to have listened to it being read out loud, most likely in one sitting.'
  - where: 'note 16:3 “Who shall roll us away the stone?”'
    claim: 'The women seemingly first thought of the stone on the way, and knew nothing of the seal and guard'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'On the way as they sorrowfully conversed, they seemingly for the first time thought of the difficulty of entering the tomb. … Evidently they knew nothing of the seal and the guard of soldiery.'
  - where: 'note 16:3 “Who shall roll us away the stone?”'
    claim: 'The stone was rolled back so those who came could see the body gone, not to let Christ out'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'The great stone was rolled back and the inside of the sepulchre exposed to view, so that those who came could see for themselves that the Lord’s body was no longer there; it was not necessary to open the portal'
  - where: 'note 16:3 “Who shall roll us away the stone?”'
    claim: 'Literally “they were saying”; “for it was very great” more naturally explains the word “rolled away”, though also read as the reason for the question'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/16.htm'
    quote: 'Literally, and they were saying to themselves. The words were on the point of rising to their lips as they looked up … it seems more natural to see in them St. Mark’s explanation of his having used the word “rolled away”'
  - where: 'note 16:5 “The young man in white”'
    claim: 'Joseph Smith’s translation has two angels sitting on the stone in long white garments'
    key: jst-mark-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/16?lang=eng'
    quote: 'they saw that the stone was rolled away, (for it was very great,) and two angels sitting thereon, clothed in long white garments; and they were affrighted.'
  - where: 'note 16:5 “The young man in white”'
    claim: 'Many commentators take him to be an angel; even so, readers should see themselves in him, redeemed and called'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'While the man’s description and the women’s fearful response to seeing him there has convinced many commentators that he was, in fact, an angel'
  - where: 'note 16:5 “The young man in white”'
    claim: 'Even if an angel, hearers should see themselves in the young man, redeemed and called'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'those hearing or reading the Gospel should see themselves in the type of the young man, redeemed and called to spread the good news.'
  - where: 'note 16:5 “The young man in white”'
    claim: 'neaniskos used only of the two young men in Mark; white clothing only here and at the Transfiguration; Jesus takes his shame'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'the same Greek word (neaniskos) is used for them both (but used nowhere else in Mark) … Jesus is crucified without clothing, just as the young man runs away without clothing, implying that Jesus is symbolically taking the young man’s shame upon himself.'
  - where: 'note 16:5 “The young man in white”'
    claim: 'The white clothing is like Jesus’s at the Transfiguration, the only two white garments in Mark; the audience would almost certainly have linked the two young men'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Mark’s audience would almost certainly have associated this young man at the tomb with the young man who fled arrest in Gethsemane … (these are the only two instances in Mark where clothing is described as being white)'
  - where: 'note 16:6 “He is risen”'
    claim: 'The announcement is not elaborated or explained'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'The statement of the young man that “[Jesus] is risen” in Mark 16:6 conveys the simplicity and utter lack of adornment of the message. It is permitted to stand on its own; it is not elaborated, nor is it explained.'
  - where: 'note 16:6 “He is risen”'
    claim: 'The Synoptics stress God raised Jesus; John that Jesus laid down His life and took it again'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Matthew, Mark, and Luke tend to emphasize that God raised Jesus from the dead (Mark 12:26; Luke 9:22), while John emphasizes that Jesus himself chose to lay down his life and take it up again'
  - where: 'note 16:6 “He is risen”'
    claim: 'ēgerthē is passive, “he has been raised,” suggesting God raised Him'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'technically the form is passive, “he has been raised.” This may suggest that in the Synoptics Jesus, who had been crucified by men'
  - where: 'note 16:6 “He is risen”'
    claim: '“Jesus of Nazareth” is a near anti-title, surprising at this moment'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Because “Jesus” was the most common male name of this time and place, it would have been necessary to identify him by a town name … To call him “Jesus of Nazareth” is a sort of “anti-title,”'
  - where: 'note 16:6 “He is risen”'
    claim: 'The audience would have expected a dramatic title at this crucial moment'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'when the audience would likely have expected one of the dramatic titles (Christ, Son of God, and so forth) to be used at this crucial moment.'
  - where: 'note 16:7 “And Peter”'
    claim: 'Naming Peter may suggest distance from his denial, but invites him back; evidence of mercy'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'perhaps suggesting he is distanced from the other disciples by his denial of Jesus. However, the implication of the young man’s words is that Peter is invited to return to full fellowship by following Jesus to Galilee. … it is evidence of mercy to specifically mention Peter'
  - where: 'note 16:7 “And Peter”'
    claim: 'In Galilee they would revive their ministry where it began'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Singling out Peter here is particularly striking given the recent denial, because Peter, along with the others, will soon meet the Risen Lord in Galilee, where they will revive their apostolic ministry in the place where it had begun.'
  - where: 'note 16:8 “For they were afraid”'
    claim: 'Literally, trembling and amazement seized them'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/16.htm'
    quote: '(8) They trembled and were amazed.—Literally, trembling and amazement seized them.'
  - where: 'note 16:8 “For they were afraid”'
    claim: 'The women, more faithful in the final hours, seem to fail at the short ending; they too will be restored'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Even the women—who were more faithful to Jesus in his final hours and death—seem to have failed at the conclusion of the short ending of Mark … Nevertheless, they, too, will be restored.'
  - where: 'note 16:8 “For they were afraid”'
    claim: 'Views on the short ending: intended, leaving readers at the tomb; prevented from finishing; or lost'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Some commentators believe that the short ending was, in fact, what Mark intended, leaving the readers alone at the tomb, … Others argue that … the evangelist was prevented—perhaps by death or persecution—from completing his account.'
  - where: 'note 16:8 “For they were afraid”'
    claim: 'Some scholars believe the original ending was lost; the sentence ending 16:8 is awkward'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Finally, some scholars believe that Mark’s original ending was lost, noting both the awkward sentence construction at the end of Mark 16:8'
  - where: 'note 16:8 “For they were afraid”'
    claim: 'ephobounto gar is an unprecedented ending suggesting an unfinished thought'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'the final two words of Mark 16:8, ἐφοβοῦντο γάρ (“for they were afraid,”), are. This otherwise unprecedented ending does little to restore confidence in the reader that the author had finalized his work. Instead, it suggests an unfinished thought'
  - where: 'note 16:8 “For they were afraid”'
    claim: 'The endings later added (16:9–20, Matthew, Luke) witness to the success of Mark’s strategy of spurring others to continue the story'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'all of the endings later added—in Mark 16:9–20, in Matthew, and in Luke—witness to the success of Mark’s strategy of spurring others to, in effect, continue the story themselves.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Sinaiticus and Vaticanus (fourth century) and many early versions lack 16:9–20; Jerome and Eusebius knew copies without them'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'Mark 16:9–20 are missing completely in two important codices, Codex Sinaiticus … and Codex Vaticanus (fourth century AD … many early versions (Latin, Armenian, Georgian, and Ethiopic) do not contain the final twelve verses'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Eusebius said nearly all copies of Mark ended at 16:8'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'Eusebius was also aware of the difficulties associated with the ending of the Gospel of Mark when he said, “Nearly all the copies of the Gospel of Mark end in this way [i.e., at 16:8]'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'A shorter ending, an expansion in one manuscript, and both endings together are found'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'Some manuscripts contain what is referred to as the intermediate or shorter ending … One manuscript contains what might be referred to as an expansion of the longer ending. … Some manuscripts contain the short ending and the long ending.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Longer ending in the majority of manuscripts, with excellent Greek support though not from all the earliest; Irenaeus quoted 16:19; an origin before the mid-second century can be posited'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'The longer ending is attested in the majority of ancient manuscripts … It has excellent support from Greek witnesses, although not from all the earliest … Both Irenaeus and Tatian knew of the longer ending, and therefore a date prior to the middle of the second century AD can be posited'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The longer ending is the first mentioned by an outside source; Irenaeus quoted 16:19 as the end of the Gospel'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'Importantly, the longer ending is the first to be mentioned by an external source. Irenaeus quoted directly from Mark 16:19, a verse that is unique to the longer ending: “At the end of his gospel, Mark says'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The abrupt shift from verse 8 to verse 9 suggests a seam'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'The fear of verse 8 seems to disappear in verse 9. This disappearance is, of course, not fatal to the text, but it does seem to indicate the presence of a textual seam'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The original ending almost certainly lost'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'Because of a series of textual corruptions, the original ending of the Gospel of Mark has almost certainly been lost.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Non-Markan vocabulary suggests perhaps a later follower added the verses; that is as far as the evidence goes'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'The non-Markan vocabulary suggests perhaps that a later follower added them in the spirit of the Gospel author. That is about as far as the textual evidence can take us.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The evidence is hardly definitive; the text Erasmus used is viable and defensible'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'the evidence is hardly definitive on which ending is to be preferred, and Erasmus’s choice, or more accurately the text that he used, is a viable and defensible option.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The text Erasmus produced later became influential for the KJV'
    key: wayment-endings-mark
    url: 'https://rsc.byu.edu/king-james-bible-restoration/endings-mark-revelation'
    quote: 'the text produced by Erasmus, the text that would eventually become influential for the KJV'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Huntsman and Hatch: 16:9–20 appears to be later scribal interpolation, different in style and diction, drawing on the other Gospels'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Mark 16:9‒20 appears to be later scribal interpolation, which, differing considerably in style and diction from secure Marcan passages, was meant to complete the story by drawing upon the other Gospels.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Lindsay: recent scholarship gives compelling reasons to overturn the consensus'
    key: lindsay-longer-ending-1
    url: 'https://journal.interpreterfoundation.org/the-book-of-mormon-versus-the-consensus-of-scholars-surprises-from-the-disputed-longer-ending-of-mark-part-1/'
    quote: 'Fortunately, recent modern scholarship offers compelling reasons for overturning the old consensus against the longer ending of Mark.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Lindsay: Markan style and canonical propriety, though not necessarily written by Mark himself; perhaps under his direction or by a follower'
    key: lindsay-longer-ending-1
    url: 'https://journal.interpreterfoundation.org/the-book-of-mormon-versus-the-consensus-of-scholars-surprises-from-the-disputed-longer-ending-of-mark-part-1/'
    quote: 'The evidence for the early existence of the longer ending, its Markan style, and its thematic unity with Mark, while strongly supporting the propriety of including the longer ending in the canon, does not necessarily mean that Mark wrote it himself … It could have been written under Mark’s direction or by a follower of Mark'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The KnoWhy: authenticity is a defensible position'
    key: sc-knowhy-522
    url: 'https://scripturecentral.org/knowhy/why-does-part-of-the-long-ending-of-mark-show-up-in-the-book-of-mormon'
    quote: 'legitimate questions about the history of the long ending of Mark remain, but the possibility that it was an original part of the Gospel of Mark is a defensible position to take.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Even scholars who reject it think it likely an early, independent witness of the resurrection'
    key: sc-knowhy-522
    url: 'https://scripturecentral.org/knowhy/why-does-part-of-the-long-ending-of-mark-show-up-in-the-book-of-mormon'
    quote: 'several scholars who reject Mark 16:9–20 as part of the original Gospel of Mark nonetheless believe that the long ending pre-existed its attachment to Mark. … it likely stands as an early, independent witness of the resurrection'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'Moroni’s source was not the Gospel of Mark but the Nephite record of Christ’s teachings'
    key: sc-knowhy-522
    url: 'https://scripturecentral.org/knowhy/why-does-part-of-the-long-ending-of-mark-show-up-in-the-book-of-mormon'
    quote: 'Moroni’s source was not the Gospel of Mark. Rather, Moroni was drawing on the teachings of Christ recorded among the Nephites (Mormon 9:22). Thus, the authenticity of the words of Jesus in Mormon 9:22–25 is not ultimately dependent on the authenticity of the “long ending” of Mark.'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The Church’s edition prints 16:9–20 with a heading summarizing them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/16?lang=eng'
    quote: 'Christ is risen—He appears to Mary Magdalene, then to others—He sends'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The Joseph Smith Translation entry the Church’s edition prints for Mark 16 is verses 3–6'
    key: jst-mark-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/16?lang=eng'
    quote: '§ JST, Mark 16:3–6. Compare Mark 16:4–7; Luke 24:2–4'
  - where: 'note 16:9 “The ending of Mark”'
    claim: 'The Lord introduces the promise to believers who are baptized as what He said to His apostles (D&C 84:64)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Therefore, as I said unto mine apostles I say unto you again, that every soul who believeth on your words, and is baptized by water for the remission of sins, shall receive the Holy Ghost.'
  - where: 'note 16:9 “Out of whom he had cast seven devils”'
    claim: 'Magdalene probably from Magdala; healed of physical and mental maladies; no warrant for calling her unchaste'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Mary Magdalene, whose second name is probably derived from her home town, Magdala, had been healed through the ministrations of Jesus from both physical and mental maladies, … even such grievous affliction affords no warrant for the assertion that the woman was unvirtuous or unchaste.'
  - where: 'note 16:9 “Out of whom he had cast seven devils”'
    claim: 'Mary of Magdala was the first to see the risen Savior'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'Not only were women the first to know of the Resurrection but they were also the first to see the risen Lord. Mary of Magdala was the first to see the Savior (see Mark 16:9–10; John 20:1).'
  - where: 'note 16:12 “In another form”'
    claim: 'Mark 16:12 is the Emmaus appearance; Emmaus about seven miles from Jerusalem'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'Among these disciples with the remaining eleven Apostles were two that “went that same day to a village called Emmaus,” about seven miles west of Jerusalem. … (Luke 24:13–15; cf. Mark 16:12).'
  - where: 'note 16:12 “In another form”'
    claim: 'Their eyes were holden; JST “or covered”; they saw Him as through a veil, as He had looked as a mortal'
    key: sc-knowhy-677
    url: 'https://scripturecentral.org/knowhy/why-did-christ-appear-to-two-disciples-on-the-road-to-emmaus'
    quote: 'the Joseph Smith Translation of this verse adds that the disciples’ eyes “were holden, or covered.” Therefore, it appears that these two disciples were not yet ready to behold the resurrected Lord in His full glory, rather viewing Him as though through a veil'
  - where: 'note 16:12 “In another form”'
    claim: 'morphē: the form by which a person strikes the vision, the external appearance (Mark 16:12)'
    key: thayer
    url: 'https://biblehub.com/greek/3444.htm'
    quote: 'the form by which a person or thing strikes the vision; the external appearance: … ἐφανερώθη ἐν ἑτέρα μορφή, Mark 16:12'
  - where: 'note 16:14 “Their unbelief and hardness of heart”'
    claim: 'Each Gospel affirms the women’s testimony did not convince the men; they were downhearted and frightened; their eventual conversion makes their witness more credible'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'The writer of each Gospel affirms that the women’s combined testimony did not convince the men. Throughout that Sunday morning, the men were downhearted and frightened. They didn’t know what to believe. Thus their eventual conversion to the reality of the Resurrection makes their witness more credible.'
  - where: 'note 16:14 “Their unbelief and hardness of heart”'
    claim: 'Women generally not permitted as witnesses; disciples had to disregard the norm of distrusting women'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Generally, women were not permitted to be witnesses under Jewish law, which means that in order for the disciples, Peter, and Mark’s audience to accept the invitation to follow Jesus, they need to disregard the cultural norm of distrusting women’s words.'
  - where: 'note 16:14 “Their unbelief and hardness of heart”'
    claim: 'An invented account would not have made women the sole witnesses'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'if the early Church were to concoct or expand on an account of the Resurrection, the last thing it would have done would be to make women the sole witnesses to the reality of the Resurrection'
  - where: 'note 16:14 “Their unbelief and hardness of heart”'
    claim: 'The Church’s footnote joins the unbelief of 16:14 to Mark 4:40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/16?lang=eng'
    quote: 'Afterward he appeared unto the eleven as they sat at meat, and upbraided them with their unbelief and hardness of heart'
  - where: 'note 16:15 “Into all the world”'
    claim: 'Contrast with the earlier commission to the lost sheep; now to Jew and Gentile; salvation freely offered to all'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'In contrast with their earlier commission, under which they were sent only “to the lost sheep of the house of Israel,” they were now to go to Jew and Gentile, bond and free, to mankind at large, of whatever nation, country, or tongue.'
  - where: 'note 16:15 “Into all the world”'
    claim: '“Every creature” is better “the whole creation”'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/16.htm'
    quote: 'Preach the gospel to every creature.—Better, to the whole creation.'
  - where: 'note 16:15 “Into all the world”'
    claim: 'The Lord gave the same commission to the Nephite disciples (Mormon 9:22–23)'
    key: sc-knowhy-522
    url: 'https://scripturecentral.org/knowhy/why-does-part-of-the-long-ending-of-mark-show-up-in-the-book-of-mormon'
    quote: 'The language of Mormon 9:22–24 is nearly identical to that of Mark 16:15–18, where the Savior gives a very similar commission to his Old World disciples.'
  - where: 'note 16:15 “Into all the world”'
