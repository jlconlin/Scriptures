chapter: 6
claims:
  - where: when
    claim: 'The green grass points to the season before the Passover that John names'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'The “green grass” may be noted as an example of St. Mark’s vividness, and serves as an indirect note of time pointing to the same season as that specified by St. John, sc., a little before the Passover.'
  - where: setting
    claim: 'Luke’s rejection at Nazareth is an early incident; Matthew and Mark tell a later visit'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'We have good reason for accepting Luke’s record as that of an early incident, and the accounts given by Matthew and Mark as those of a later visit.'
  - where: setting
    claim: 'Antipas received Galilee and Perea; built Tiberias on the Sea of Galilee as his capital'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'Antipas (called in the New Testament “Herod the tetrarch”) built as his capital Tiberias on the Sea of Galilee; he is frequently mentioned in the Gospels (Matt. 14:1; Mark 6:14; Luke 9:7; 13:31; 23:7–15).'
  - where: setting
    claim: 'John’s arrest, mentioned at 1:14, is told in full at 6:14–27'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'the arrest of John the Baptist (mentioned in Mark 1:14; fulfilled in Mark 6:14–27)'
  - where: setting
    claim: 'John’s death is sandwiched inside the mission of the Twelve'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The death of John the Baptist (Mark 6:14–29) is surrounded by the mission of the twelve (Mark 6:7–13, 30–31).'
  - where: thread
    claim: 'Mark raises the question of Jesus’s identity, among other places at 6:2–3'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The question of Jesus’ true identity is raised in Mark 1:27; 2:7; 4:41; 6:2–3; 8:27–29; 11:28; 14:61; and 15:2.'
  - where: thread
    claim: 'The apostles’ mission spread Jesus’s name; Herod heard with guilty fear'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The missionary labors of the apostles greatly augmented the spread of the new doctrine of the kingdom, and the name and works of Jesus were proclaimed throughout the land.'
  - where: thread
    claim: '“It is I” (ego eimi) is the first explicit hint that He is Jehovah'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Thus, when Jesus says, as He approaches the boat with the fearful disciples, “It is I” (ego eimi), He is giving his first explicit hint of His real identity.'
  - where: thread
    claim: 'Mark shows the Twelve failing again and again, and Jesus patiently teaching them'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Throughout the text, Mark carefully structures the message on discipleship: the twelve are shown to fail again and again. Jesus does not break faith with them but rather continues to patiently teach them.'
  - where: section 2 plain
    claim: 'Mark allows one staff only'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: '(8) Save a staff only.—St, Matthew (Matthew 10:10) gives, “neither staves”—i.e., they were to take one only.'
  - where: section 3 plain
    claim: '“Observed him”: Greek protected; “by and by”: at once; “charger”: platter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/6?lang=eng'
    quote: 'GR protected.'
  - where: section 3 plain
    claim: 'The guests: court officials, military commanders, chief men'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'The three words mean respectively—(1) the magnates, or officials of the court; (2) the chiliarchs, or chief captains (literally, captain of a thousand'
  - where: section 4 plain
    claim: 'JST: a solitary place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/6?lang=eng'
    quote: 'JST Mark 6:36 … This is a solitary place, and now the time for departure is come …'
  - where: section 4 plain
    claim: 'Pennyworth: denarii, a workman’s daily wage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/6?lang=eng'
    quote: '“pennyworth”: GR denarii; one denarius was a workman’s daily wage.'
  - where: section 4 plain
    claim: '“In ranks”: in groups like garden beds'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'The primary meaning of the Greek word is “a bed of flowers or herbs,”'
  - where: section 5 plain
    claim: 'The fourth watch: three to six in the morning'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'along in the fourth watch, that is, between three and six o’clock in the morning, He came to their assistance'
  - where: section 5 plain
    claim: '“Passed by”: to go past one'
    key: thayer
    url: 'https://biblehub.com/greek/3928.htm'
    quote: 'α. of persons moving forward: to pass by, absolutely, Luke 18:37; τινα, to go past one, Mark 6:48'

  - where: 'note 6:3 “The carpenter, the son of Mary”'
    claim: 'Only Mark calls Jesus the son of Mary and a carpenter; naming Him by His mother could carry a taint of scandal; Mark is comfortable with potentially embarrassing material'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'it would have carried the taint of scandal to identify him by his mother and not his father. Once again, we see a higher level of comfort in Mark’s Gospel for potentially embarrassing material about Jesus. Mark is the only Gospel where Jesus is called a carpenter'
  - where: 'note 6:3 “The carpenter, the son of Mary”'
    claim: 'They rejected Him because He came not as they expected the Messiah; they knew His family as common folk'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'nevertheless they rejected Him anew, for He came not as they expected the Messiah to come; and they refused to know Him save as “the carpenter, the son of Mary, the brother of James, and Joses, and of Juda, and Simon”; all of whom were common folk'
  - where: 'note 6:3 “His brothers and sisters”'
    claim: 'Brethren of the Lord: children of Joseph and Mary born after Jesus; more than two sisters'
    key: bd-brethren-of-the-lord
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/brethren-of-the-lord?lang=eng'
    quote: 'They were children of Joseph and Mary, born after Jesus’ birth. Matt. 13:56 shows that there were also sisters. The number of girls is not specified, but the Greek text makes it clear that there were more than two.'
  - where: 'note 6:3 “His brothers and sisters”'
    claim: 'James the Just held an important position in the Jerusalem church; probably wrote the Epistle of James'
    key: bd-james
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/james?lang=eng'
    quote: 'known as James the Just. He occupied an important position in the Church of Jerusalem (Acts 12:17; 15:13; 21:18; 1 Cor. 15:7; Gal. 2:9–12) and was probably the writer of the Epistle of James.'
  - where: 'note 6:5 “He could there do no mighty work”'
    claim: 'Mark’s language is stronger than Matthew’s; the power depended on the faith of those who came'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'In St. Mark the language is stronger, “He could do no mighty works there.” The wonder-working power was not absolute and unconditioned, but depended on the faith of those who came to Him.'
  - where: 'note 6:5 “He could there do no mighty work”'
    claim: 'Ether 12:12 and Mormon 9:20: no faith, no miracle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/9?lang=eng'
    quote: 'And the reason why he ceaseth to do miracles among the children of men is because that they dwindle in unbelief, and depart from the right way'
  - where: 'note 6:5 “He could there do no mighty work”'
    claim: 'Mark is more comfortable showing Jesus’s human side; theologically important that He had divine and human aspects'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'he seems to be more comfortable with stories that show the “human” side of Jesus than the other writers are. From a Latter-day Saint perspective, it is theologically important to maintain that Jesus had both divine and human aspects during mortality'
  - where: 'note 6:5 “He could there do no mighty work”'
    claim: '“He marvelled” bears on the reality of His human nature; He could feel wonder at the unlooked for'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'Whatever powers of prevision or insight into the hearts of men might belong to Him, they were not such as to exclude the wonder which men feel at that which comes to them unlooked for.'
  - where: 'note 6:8 “A staff, sandals, and no bread”'
    claim: 'Without money, clothes or provisions the missionary depended on the hospitality of strangers; stay in the household'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Hospitality was to play a fundamental role in the missionary effort, as is witnessed by Christ’s instructions that the missionary was to travel without money, extra clothes, and particularly provisions. Thus the missionary was entirely dependent upon the hospitality of strangers for sustenance.'
  - where: 'note 6:8 “A staff, sandals, and no bread”'
    claim: 'Staff and sandals: same word for staff, different for footwear; one of the few outright contradictions; perhaps remembered differently'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'note, however, that while the Greek word for “staff” is the same, the Greek word for “sandals” differs. … This is one of the few outright contradictions between the synoptic Gospels … Perhaps the various sources for the Gospels remembered Jesus’ counsel differently'
  - where: 'note 6:8 “A staff, sandals, and no bread”'
    claim: 'Matthew’s “neither staves” read as one staff only; sandals were the shoes of the poor'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'It describes obviously the shoes worn by the poor as distinguished from those of the more wealthy class, the sole of leather or wood fastened over the instep by strong leather thongs.'
  - where: 'note 6:8 “A staff, sandals, and no bread”'
    claim: 'D&C 42:6: elders to preach two by two'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/42?lang=eng'
    quote: 'And ye shall go forth in the power of my Spirit, preaching my gospel, two by two, in my name'
  - where: 'note 6:11 “Shaking off the dust”'
    claim: 'The rite is the reverse of foot washing; dexomai a hospitality term that could include the message'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'In many ways, the rite of wiping dust off feet may be thought of as the reverse of the foot-washing rite, utilizing the social institution of hospitality to provide the meaning behind the act.'
  - where: 'note 6:11 “Shaking off the dust”'
    claim: 'Unclear whether the rite answered lack of hospitality or rejection of the message'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Unfortunately, even with the larger context of hospitality, it is unclear whether the rite was given in response to a lack of physical hospitality or to rejection of the message.'
  - where: 'note 6:11 “Shaking off the dust”'
    claim: 'Sodom’s destruction explained by hostility to Lot’s guests (Ezek. 16:49)'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'the destruction of these two cities was explained in later literature as the result of their hostility instead of hospitality toward Lot’s guests (see Ezekiel 16:49).'
  - where: 'note 6:11 “Shaking off the dust”'
    claim: 'The rite restored in the D&C; by Joseph Smith’s 1835 letter reception means of the gospel message, and the rite frees the performer of responsibility'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'The instruction makes it clear that the concept of reception is now to be understood as reception of the gospel message, a definition hinted at in the Doctrine and Covenants but never explicitly outlined. Hospitality is not a factor at all.'
  - where: 'note 6:11 “Shaking off the dust”'
    claim: 'D&C 60:15: in secret, not in their presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/60?lang=eng'
    quote: 'And shake off the dust of thy feet against those who receive thee not, not in their presence, lest thou provoke them, but in secret'
  - where: 'note 6:13 “Anointing the sick with oil”'
    claim: 'Only Mark mentions anointing as the disciples’ practice; James 5:14 shows it later in use; an outward sign and help to faith; oil a recognized remedy'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'St. Mark is the only Evangelist who mentions this as the common practice of the disciples, but we learn from James 5:14 that it was afterwards in use … it was an outward sign showing the wish to heal, and therefore a help to faith'
  - where: 'note 6:13 “Anointing the sick with oil”'
    claim: 'Oaks: sealing the anointing makes it binding; opens the windows of heaven'
    key: oaks-2010-healing
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/healing-the-sick?lang=eng'
    quote: 'To seal something means to affirm it, to make it binding for its intended purpose. When elders anoint a sick person and seal the anointing, they open the windows of heaven for the Lord to pour forth the blessing He wills for the person afflicted.'
  - where: 'note 6:14 “King Herod’s guilty guess”'
    claim: 'Antipas received Galilee and Perea'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'His kingdom was then divided between three of his sons: Archelaus, who received Judea, Idumea, and Samaria; Antipas, who had Galilee and Perea; and Philip, who had the northeast districts of Palestine.'
  - where: 'note 6:14 “King Herod’s guilty guess”'
    claim: 'Antipas deposed by Caligula and banished to Gaul, A.D. 39'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'He was deposed by the Emperor Caligula and banished to Lugdunum in Gaul, A.D. 39.'
  - where: 'note 6:14 “King Herod’s guilty guess”'
    claim: '“King” in the ancient wide sense; Matthew and Luke more exactly tetrarch; only Mark connects Herod’s notice with the apostles’ work'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/6.htm'
    quote: 'He is here called “king,” or “prince,” in the ancient and wide sense of the word. … It is peculiar to St Mark that he connects the watching observation of Herod Antipas with the work of Christ as extended by the preaching and miracles of His Apostles.'
  - where: 'note 6:14 “King Herod’s guilty guess”'
    claim: 'Antipas went to Rome with Herodias to seek the title of king, and was deposed'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'Prompted by the ambition of Herodias, Antipas went with her to Rome, to seek, by lavish gifts and show of state, the same distinction. The emissaries of Agrippa, however, thwarted his schemes, and he was deposed and sent into exile at Lugdunum.'
  - where: 'note 6:14 “King Herod’s guilty guess”'
    claim: 'Herod heard with fear due to guilt; courtiers suggested Elijah'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'He heard, with fear due to inward conviction of guilt, of the marvelous work wrought by Jesus, and in terror averred that Christ could be none other than John Baptist returned from the tomb.'
  - where: 'note 6:18 “Why John rebuked the marriage”'
    claim: 'Herodias married her uncle Herod Philip, had a daughter, eloped to live as wife of Antipas; John was killed for rebuking it'
    key: bd-herodias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herodias?lang=eng'
    quote: 'married to her uncle, Herod Philip, by whom she had a daughter Salome (Matt. 14:6). She eloped in order to live as the wife of her step-uncle, Herod Antipas. It was for his rebuke of this crime that John the Baptist was put to death'
  - where: 'note 6:18 “Why John rebuked the marriage”'
    claim: 'This Philip not the tetrarch of Luke 3:1, held no office; Herodias niece to both husbands'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'Herodias, the wife of his half-brother Philip (not the Tetrarch of Trachonitis, Luke 3:1, but son of Herod the Great by Mariamne, and though wealthy, holding no official position as a ruler), was daughter of Aristobulus … and was therefore niece to both her husbands.'
  - where: 'note 6:20 “What Herod saw in John”'
    claim: 'Footnotes: GR righteous and holy man; observed = protected; JST Mark 6:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/6?lang=eng'
    quote: 'JST Mark 6:21 … and a holy man, and one who feared God and observed to worship him; and when he heard him he did many things for him, and heard …'
  - where: 'note 6:20 “What Herod saw in John”'
    claim: '“Observed” means Herod had a certain reverence for his prisoner'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'Observed him.—The word has been differently interpreted, but Luke 2:19, where it is translated “kept,” seems decisive as to its meaning that Herod had a certain reverence for his prisoner.'
  - where: 'note 6:20 “What Herod saw in John”'
    claim: 'The better manuscripts read “he was much perplexed”'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'He did many things.—The better MSS. give, “he was much perplexed.”'
  - where: 'note 6:20 “What Herod saw in John”'
    claim: 'SBL reads ēporei (perplexed); the Textus Receptus and Majority text read epoiei (did)'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/6-20.htm'
    quote: 'SBL Greek New Testament 2010 … καὶ ἀκούσας αὐτοῦ πολλὰ ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν. … Scrivener’s Textus Receptus 1894 … καὶ ἀκούσας αὐτοῦ, πολλὰ ἐποίει, καὶ ἡδέως αὐτοῦ ἤκουε.'
  - where: 'note 6:20 “What Herod saw in John”'
    claim: 'Mark ascribes the murderous mood to Herodias; in Herod it was accompanied by worthier impulses'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/6.htm'
    quote: 'the murderous mood is by Mark ascribed to Herodias; in her it would certainly be strongest and unchecked by any other feeling. In Herod, if the mood was there, it was accompanied by worthier impulses'
  - where: 'note 6:26 “Why Herod kept his oath”'
    claim: 'Herod shrank from the guests’ contempt more than the broken oath; false regard for opinion an incentive to guilt'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'It was not so much his regard for the oath which he had taken … but his shrinking from the taunt, or whispered jest, or contemptuous gesture of the assembled guests … an incentive to guilt instead of a restraint.'
  - where: 'note 6:26 “Why Herod kept his oath”'
    claim: 'Only Mark lists the guests: court magnates, chiliarchs, chief men, probably landowners'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'St. Mark alone gives the account of the guests. The three words mean respectively—(1) the magnates, or officials of the court; (2) the chiliarchs, or chief captains … (3) the chief men … probably the large landowners of the province.'
  - where: 'note 6:26 “Why Herod kept his oath”'
    claim: 'The girl going out to ask her mother is peculiar to Mark'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: '(24) She went forth, and said unto her mother.—This feature in the narrative is peculiar to St. Mark.'
  - where: 'note 6:26 “Why Herod kept his oath”'
    claim: 'Herodias, not her daughter, bears the culpability, whether or not she planned the dance'
    key: frederick-daughter-of-jared
    url: 'https://rsc.byu.edu/illuminating-jaredite-records/whence-daughter-jared'
    quote: 'Or did she intentionally send Salome to dance before Herod, knowing what her husband’s response would be, with the full intent of acting out her revenge? Either way, it is Herodias, not Salome, who bears the culpability for procuring the head of John the Baptist.'
  - where: 'note 6:30 “John’s death inside the apostles’ mission”'
    claim: 'Mark sandwiches stories so the center is understood in light of the surrounding material; John’s death inside the mission'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark frequently “sandwiches” a story between two other sections of text with the goal of encouraging the audience to understand the center story in light of its surrounding material.'
  - where: 'note 6:30 “John’s death inside the apostles’ mission”'
    claim: 'John’s disciples bury him; Joseph of Arimathea, not one of the inner circle, buries Jesus; the male disciples fled'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'the disciples of John the Baptist come forward to claim his corpse and bury him; later, it is Joseph of Arimathea (see Mark 15:43)—not one of Jesus’ chosen inner circle of disciples—who will request and bury his body; Jesus’ closest male disciples have fled'
  - where: 'note 6:30 “John’s death inside the apostles’ mission”'
    claim: 'Only Mark connects Herod’s notice with the apostles’ preaching'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/6.htm'
    quote: 'It is peculiar to St Mark that he connects the watching observation of Herod Antipas with the work of Christ as extended by the preaching and miracles of His Apostles.'
  - where: 'note 6:30 “John’s death inside the apostles’ mission”'
    claim: 'Apostle means one sent forth'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'The word means “one sent forth.”'
  - where: 'note 6:31 “Come apart and rest”'
    claim: 'The invitation to rest and the “coming and going” are peculiar to Mark; tender consideration'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'Peculiar to St. Mark are (1) the tender consideration of the invitation to “rest awhile,” and (2) the description of the throng of people as “coming and going.”'
  - where: 'note 6:31 “Come apart and rest”'
    claim: 'JST: solitary place for desert'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/6?lang=eng'
    quote: 'JST Mark 6:32 … solitary …'
  - where: 'note 6:31 “Come apart and rest”'
    claim: 'Mark depicts Jesus leaving the miracle-seeking crowds to share His message elsewhere (3:7–10; 6:31–34)'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'On occasion, Mark depicts Jesus leaving the miracle-seeking crowds so that he may find other communities and individuals to share his message with (see 3:7–10; 6:31–34).'
  - where: 'note 6:31 “Come apart and rest”'
    claim: '“Ran afoot” contrasts the crowd by land with the disciples by boat'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: '(33) And ran afoot.—The words are used to point the contrast between the disciples, who had come in their boat, and the crowds who came by land.'
  - where: 'note 6:34 “Sheep without a shepherd”'
    claim: 'Moses asked for a leader so Israel be not as sheep without a shepherd; Joshua chosen'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'that the congregation of the Lord be not as sheep [ṣōʾn] which have no shepherd [rōʿeh]” (Numbers 27:16–17). Joshua was the shepherd-leader Jehovah chose to succeed Moses.'
  - where: 'note 6:34 “Sheep without a shepherd”'
    claim: 'Latter-day Saints read the Davidic shepherd prophecies of Ezekiel 34 and 37 as fulfilled in Jesus'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Most Christians, and certainly Latter-day Saints, accept these as messianic prophecies about the future deliverer of Israel … They foretell that Jesus, as the “son [or descendant] of David,” will gather the flock of covenant Israel'
  - where: 'note 6:34 “Sheep without a shepherd”'
    claim: 'The Topical Guide, Shepherd, lists Mark 6:34 with Matt. 9:36, and in the same entry Num. 27:17 and Ezek. 34:23 (37:24)'
    key: tg-shepherd
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/shepherd?lang=eng'
    quote: 'scattered abroad, as sheep having no shepherd, Matt. 9:36 (Mark 6:34'
  - where: 'note 6:34 “Sheep without a shepherd”'
    claim: 'The Topical Guide, Shepherd: be not as sheep which have no shepherd, Num. 27:17'
    key: tg-shepherd
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/shepherd?lang=eng'
    quote: 'be not as sheep which have no shepherd, Num. 27:17'
  - where: 'note 6:40 “In ranks, like garden beds”'
    claim: 'prasia: a garden-bed; the repetition in Mark 6:40 a Hebraism, ranks forming separate plots'
    key: thayer
    url: 'https://biblehub.com/greek/4237.htm'
    quote: 'a plot of ground, a garden-bed'
  - where: 'note 6:40 “In ranks, like garden beds”'
    claim: '“By companies” repeats the word; “ranks” first meant a flower bed, with the same reduplication'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: '(40) In ranks.—The primary meaning of the Greek word is “a bed of flowers or herbs,” and it comes in here effectively, with the same distributive reduplication as in the last verse, to paint the whole scene to the mind’s eye.'
  - where: 'note 6:40 “In ranks, like garden beds”'
    claim: 'Green grass a note of time, a little before the Passover'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'serves as an indirect note of time pointing to the same season as that specified by St. John, sc., a little before the Passover. (Comp. John 6:10.)'
  - where: 'note 6:40 “In ranks, like garden beds”'
    claim: 'The flower-bed picture bespeaks an eyewitness like Peter'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/6.htm'
    quote: 'πρασιαὶ πρασιαὶ = ἀνὰ πρασίας, in garden flower plots, or squares, picturesque in fact and in description, bespeaking an eye-witness of an impressionable nature like Peter.'
  - where: 'note 6:41 “Bread in the wilderness”'
    claim: 'The narrative of the loaves identifies Jesus with the Lord who provided manna, though no words in the scene say so'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'when Jesus multiplies loaves and fishes in Mark 6:30–44, the narrative implicitly identifies Jesus with the Lord who provides manna during the Exodus (see Ex. 16). But there is nothing in the discourse in Mark 6:30–44'
  - where: 'note 6:41 “Bread in the wilderness”'
    claim: 'A manifestation of creative power; the leftovers exceeded the original store'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It was a manifestation of creative power, by which material elements were organized and compounded to serve a present and pressing need. The broken but unused portion exceeded in bulk and weight the whole of the original little store.'
  - where: 'note 6:48 “He meant to pass by them”'
    claim: 'parerchomai: to go past one, Mark 6:48'
    key: thayer
    url: 'https://biblehub.com/greek/3928.htm'
    quote: 'α. of persons moving forward: to pass by, absolutely, Luke 18:37; τινα, to go past one, Mark 6:48'
  - where: 'note 6:48 “He meant to pass by them”'
    claim: '“Toiling” means tortured or baffled; He came near and seemed to wish to lead the way before them; compare Luke 24:28–29'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/6.htm'
    quote: 'would have passed by them] He came quite near their vessel on the storm-tost waves, and seemed to wish to lead the way before them to the western shore. Comp. Luke 24:28-29.'
  - where: 'note 6:48 “He meant to pass by them”'
    claim: '“Toiling”: tortured, baffled by the waves'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/6.htm'
    quote: 'Here it seems to imply that they were tortured, baffled, by the waves, which were boisterous by reason of the strong wind that blew (John 6:18).'
  - where: 'note 6:48 “He meant to pass by them”'
    claim: 'A head-wind made sails useless; He came to their assistance in the fourth watch'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'They encountered a boisterous head-wind, which of course rendered impossible the use of sails'
  - where: 'note 6:50 “It is I: the name of God”'
    claim: 'Job 9:8; ego eimi in the LXX of Isaiah is the name of Jehovah (Isa. 45:18); He is I AM who controls nature'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Ego eimi means “I am” or “I am he.” In the latter half of Isaiah in the LXX, these words are understood as the name of the God who is Jehovah. For example, in Isaiah 45:18 the Hebrew uses the phrase ani YHWH, meaning “I am Jehovah.” The LXX translates these Hebrew words simply as ego eimi.'
  - where: 'note 6:50 “It is I: the name of God”'
    claim: 'He is I AM, Jehovah, who created and controls nature'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'He is I AM, Jehovah, the God of the Old Testament, and the one to whom these words specifically refer in Isaiah. He is the one who created and controls all of nature.'
  - where: 'note 6:50 “It is I: the name of God”'
    claim: 'Mark least developed theologically, but most elements there, including ego eimi'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Mark is probably the least fully developed theologically, but most of the elements are already there—kyrios and Son of Man sayings, the Lord of nature and ego eimi passages'
  - where: 'note 6:52 “Why their hearts were hardened”'
    claim: 'pōroō: to cover with a callus; of the heart, to grow dull, lose the power of understanding (Mark 6:52; 8:17)'
    key: thayer
    url: 'https://biblehub.com/greek/4456.htm'
    quote: 'to cover with a thick skin, to harden by covering with a callus … passive, to grow hard or callous, become dull, lose the power of understanding: Romans 11:7; τά νοήματα, 2 Corinthians 3:14; ἡ καρδία, Mark 6:52; Mark 8:17.'
  - where: 'note 6:52 “Why their hearts were hardened”'
    claim: 'Peculiar to Mark; may be Peter’s recollection; they had not concluded that all natural forces were subject to their Master'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'This is peculiar to St. Mark, and may fairly be received as representing St. Peter’s recollection of what had been the mental state of the disciples at the time. They had not drawn from the miracle of the Loaves the conclusion which they might have drawn, that all natural forces were subject to their Master’s sovereignty.'
  - where: 'note 6:52 “Why their hearts were hardened”'
    claim: 'Their amazement would have been more akin to worship had they remembered the loaves'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The amazement of the apostles, at this latest manifestation of the Lord’s control over the forces of nature, would have been more akin to worship and less like terrified consternation had they remembered the earlier wonders they had witnessed'
  - where: 'note 6:52 “Why their hearts were hardened”'
    claim: 'Jesus does not break faith with failing disciples; continues to teach; Peter’s discipleship assumed to continue (16:7)'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus does not break faith with them but rather continues to patiently teach them. At the end of the Gospel, the reference to Peter in Mark 16:7 continues this pattern'
  - where: christ
    claim: 'Ether 12:12: no faith, no miracle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12?lang=eng'
    quote: 'For if there be no faith among the children of men God can do no miracle among them; wherefore, he showed not himself until after their faith.'
  - where: christ
    claim: 'D&C 68:6: be of good cheer, do not fear, I the Lord am with you'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/68?lang=eng'
    quote: 'Wherefore, be of good cheer, and do not fear, for I the Lord am with you, and will stand by you'
  - where: christ
