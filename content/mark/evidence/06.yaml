    quote: 'Jesus is patient with disciples, even when they make mistakes.'
  - where: 'note 6:13 “Anointing the sick with oil”'
    claim: 'Oil was recognized as remedial in the popular therapeutics of the time; joined natural means with prayer'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/6.htm'
    quote: 'as the use of oil was more distinctly that of an agent recognised as remedial in the popular therapeutics of the time, it had also the character of uniting … the use of natural outward means of healing with prayer for the divine blessing.'
  - where: 'note 6:11 “Shaking off the dust”'
    claim: 'Joseph Smith’s 1835 letter: the responsibility rests on the one who rejects; the elder’s skirts are clear'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'let the responsibility be upon his head—shake off the dust of thy feet as a testimony against him, and thy skirts shall then be clear of their souls.'
  - where: 'note 6:40 “In ranks, like garden beds”'
    claim: 'The English “in ranks” gives the wrong notion of continuous lines'
    key: cambridge-mark
    url: 'https://biblehub.com/commentaries/cambridge/mark/6.htm'
    quote: 'Our English ‘in ranks’ does not reproduce the picture to the eye, giving rather the notion of continuous lines.'
