chapter: 10
claims:
  - where: when
    claim: '“The farther side of Jordan” is Perea'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'The “farther side of Jordan” implies what is known as the Peræan ministry of our Lord, and which is related only by St. Luke.'
  - where: when
    claim: 'Jericho lay in the Jordan valley, visited on the last journey to Jerusalem'
    key: bd-jericho
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jericho?lang=eng'
    quote: 'A walled city in the valley of the Jordan, 800 feet below the Mediterranean … and was visited by our Lord on His last journey to Jerusalem (Mark 10:46; Luke 18:35; 19:1).'
  - where: setting
    claim: 'Harmonists place much of Luke and John between Mark 9 and 10; the farther side of Jordan is the Perean ministry, told only by Luke'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'the best harmonists place Matthew 18:15-35, Luke 10:1 to Luke 17:10 (with the exception of Mark 15:3-7), and John 7:1 to John 11:54, between the 9th and 10th chapters of this Gospel.'
  - where: setting
    claim: 'The second act of Mark is framed by two blind men healed, with the confession and three passion predictions between'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'It concludes with the healing of a second blind man, a beggar named Bartimaeus, as Jesus and his disciples leave Jericho on the last stage of their journey up to Jerusalem'
  - where: setting
    claim: 'The crowd near Jericho was largely Passover pilgrims, the feast about a week ahead'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Jerusalem to attend the Passover festival, the time for which was about a week ahead.'
  - where: thread
    claim: 'Each prediction is followed by the disciples’ misunderstanding and corrective teaching; the third is followed by the request of James and John'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'In both cases the misunderstanding or misbehavior on the part of Jesus’s disciples is followed by corrective teaching, calling upon them—and us—to be willing to be a servant to others and model the kind of humility exemplified by a child.'
  - where: thread
    claim: 'In Mark minor characters who choose to follow are better disciples than the Twelve; first and last applied to discipleship'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Perhaps the principle that the first shall be last and the last shall be first (see Mark 10:31) applies to reaching an understanding of true discipleship.'
  - where: 'note 10:2 “A question meant to trap”'
    claim: 'The question falls in the Shammai–Hillel debate; the aim may have been to alienate followers who held the easier view'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Their motivation may be to reveal to the “great multitudes” that Jesus holds a position close to that of the house of Shammai, and in the process alienate those of his followers who themselves hold to the more liberal position'
  - where: 'note 10:2 “A question meant to trap”'
    claim: 'Shammai allowed divorce only for adultery; Hillel for many reasons, even a burnt dinner'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'followers of the Jewish sage Shammai forbade divorce except for adultery, while followers of the sage Hillel permitted divorce for a wide variety of reasons (including if a woman burnt her husband’s dinner!)'
  - where: 'note 10:2 “A question meant to trap”'
    claim: 'In Mark the aim may have been to make Jesus take the side of Shammai or Hillel'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'If their intent was to see Jesus take the side of Shammai or Hillel, they failed.'
  - where: 'note 10:4 “Suffered, not commanded”'
    claim: '“Suffered” means Moses reluctantly allowed the practice'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'They had to confess that they were not dealing with a commandment of God but a practice that Moses reluctantly allowed because of the hardness of Israel’s heart.'
  - where: 'note 10:4 “Suffered, not commanded”'
    claim: 'In Mark Jesus made them cite the law; they had to admit Moses only suffered divorce; He freed Himself from the rabbinic debate'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'The Savior appealed to the law itself and freed himself from the narrow confines of the rabbinic debate. The Savior’s question forced the Pharisees to admit that no such commandment existed'
  - where: 'note 10:4 “Suffered, not commanded”'
    claim: 'Jesus answers from Genesis 1–2 rather than Deuteronomy 24:1'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Rather than engage Deuteronomy 24:1 directly, Jesus makes an argument based on Genesis 1–2, the origin of God’s instructions on marriage'
  - where: 'note 10:9 “What God hath joined”'
    claim: 'The Greek for “joined” means yoked; marriage is of God, held together by covenant'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'Marriage is of God. He joined (Greek sunezeuksen, “yoked”) male and female together. It was brazen for anyone to pull them apart.'
  - where: 'note 10:9 “What God hath joined”'
    claim: 'Restoration scripture teaches marriage is divinely ordained and potentially eternal'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'We have come to understand marriage and family as divinely ordained, central to the developmental purposes of mortal life, and potentially eternal (Doctrine and Covenants 49:16–17; 131:1–4; 132:19).'
  - where: 'note 10:11 “Adultery against her”'
    claim: 'In the ancient world adultery was an offense against a man; Jesus made a husband’s adultery an offense against his wife, raising women’s status'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'In the ancient world adultery was viewed as an offense against a man … By teaching that a man’s adultery was an offense against his wife, Jesus placed the husband under “the same moral obligation as the wife,”'
  - where: 'note 10:11 “Adultery against her”'
    claim: 'Other New Testament passages recognize legitimate reasons for divorce'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Other New Testament passages indicate that the early church recognized legitimate reasons for divorce and did not view every case of remarriage as adultery (see Matthew 5:32; 19:9; 1 Corinthians 7:15)'
  - where: 'note 10:11 “Adultery against her”'
    claim: 'Draper: the man commits adultery against his former wife because in God’s eyes the kinship remains'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'Jesus insists that the man can do it against his supposedly divorced wife because in God’s eyes, their kinship remains intact.'
  - where: 'note 10:11 “Adultery against her”'
    claim: 'Verse 12 is peculiar to Mark, the only passage in Jesus’s teaching on a wife who divorces her husband'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'This also is peculiar to St. Mark, and it is noticeable, as being the only passage in our Lord’s teaching which distinctly states the case referred to, and passes sentence on the wife who divorces her husband'
  - where: 'note 10:14 “Much displeased”'
    claim: 'The word “much displeased” is used of Jesus only by Mark; “took them up in his arms” is Mark’s alone, as is the stated blessing'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'He was much displeased.—The word, as used by our Lord, is peculiar to St. Mark'
  - where: 'note 10:14 “Much displeased”'
    claim: 'Folded them in His arms; the word used by Mark only; the blessing definitely mentioned by him only'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'Better, folded them in His arms, leaving the question whether they were lifted from the ground open. The word is used by St. Mark only.'
  - where: 'note 10:14 “Much displeased”'
    claim: 'The disciples wished to spare their Master needless demands on His time'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The disciples, zealous that their Master be not troubled unnecessarily, and conscious of the continuous demands on His time and attention, rebuked those who had so ventured to trespass.'
  - where: 'note 10:14 “Much displeased”'
    claim: 'The disciples may have shared the traditional view that women and children were of inferior status'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Even the disciples seem to have been yet under the influence of the traditional conception that women and children were of inferior status, and that for such to seek the Lord’s attention was an act of presumption.'
  - where: 'note 10:14 “Much displeased”'
    claim: 'JST Matthew 19:13: the disciples said there was no need, for Jesus had said such shall be saved'
    key: jst-matt-19
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/19?lang=eng'
    quote: 'And the disciples rebuked them, saying, There is no need, for Jesus hath said, Such shall be saved.'
  - where: 'note 10:15 “As a little child”'
    claim: 'paidion is a child up to about seven; the qualities in view are humble, poor and dependent'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'paidion referred to a growing child up to the age of seven … the essential characteristics of children as humble, poor, and dependent seem intrinsically connected to the definition of righteousness.'
  - where: 'note 10:15 “As a little child”'
    claim: 'Receiving the kingdom depends on reliance on Christ’s atoning blood as a child relies on a caregiver; King Benjamin'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'our receving of the kingdom of God is fully dependent on our faithful reliance on the atoning blood of Jesus Christ to enter the kingdom of heaven, just as a little child or infant relies on a cargiver for life'
  - where: 'note 10:15 “As a little child”'
    claim: 'Korth and Reed set Mark 10:15 beside 3 Nephi 11:38'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Whosoever shall not receive the kingdom of God as a little child, he shall not enter therein. (Mark 10:15) Ye must repent, and be baptized in my name, and become as a little child'
  - where: 'note 10:18 “Why callest thou me good?”'
    claim: 'The Jewish view was that God alone may fitly be called good; the idea goes back to the Psalms'
    key: sc-knowhy-499
    url: 'https://scripturecentral.org/knowhy/what-does-it-really-mean-to-be-a-good-person'
    quote: 'He asserts that, “the Jewish view was that God alone may be fitly described as ‘good,’ and by contrast no one else is ‘good,’” although there were some exceptions to this rule.'
  - where: 'note 10:18 “Why callest thou me good?”'
    claim: 'The Book of Mormon has the same idea: all good comes of God (Moroni 7:12)'
    key: sc-knowhy-499
    url: 'https://scripturecentral.org/knowhy/what-does-it-really-mean-to-be-a-good-person'
    quote: 'Moroni no doubt learned this important doctrine from his father Mormon, who similarly wrote that “all things which are good cometh of God” (Moroni 7:12).'
  - where: 'note 10:18 “Why callest thou me good?”'
    claim: 'No denial of sinlessness; the man used “good” as a polite compliment'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'This remark was no denial of sinlessness on the Savior’s part; the young man had called Him “good” by way of polite compliment rather than in recognition of His Godship'
  - where: 'note 10:18 “Why callest thou me good?”'
    claim: 'The man came in earnest, unlike the lawyer who tempted Jesus'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The question was asked in earnestness; the questioner was in very different spirit from that of the lawyer who made a similar inquiry with the purpose of tempting the Master.'
  - where: 'note 10:19 “Defraud not”'
    claim: 'apostereō: to defraud, rob, despoil; to keep back by fraud, as wages (James 5:4; Deut. 24:14; Mal. 3:5)'
    key: thayer
    url: 'https://biblehub.com/greek/650.htm'
    quote: 'to defraud, rob, despoil: absolutely, Mark 10:19 … τί to defraud of a thing, to withdraw or keep back a thing by fraud: passive μισθός ἀπεστερημένος, James 5:4'
  - where: 'note 10:19 “Defraud not”'
    claim: 'Peculiar to Mark; a special application of the tenth commandment to a man of great possessions'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'Peculiar to St. Mark. It seems as if intended to be a special application of the Tenth Commandment. One who had great possessions, gathered in the usual ways by which men gain wealth, needed to examine himself specially by that text.'
  - where: 'note 10:21 “Jesus beholding him loved him”'
    claim: 'Only Mark says Jesus loved him; the love showed in the steady look'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'Better, looking, or gazing on him. The fact is narrated by St. Mark only, and implies that the love showed itself in the stedfast look'
  - where: 'note 10:21 “Jesus beholding him loved him”'
    claim: 'Love of worldly things was his besetting weakness; the remedy suited his case and is not prescribed for all'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Love of worldly things was this man’s besetting weakness; Jesus diagnosed his case and prescribed a suitable remedy. We are not warranted in saying that the same treatment would be best in all cases of spiritual defection'
  - where: 'note 10:21 “Jesus beholding him loved him”'
    claim: 'Willingness to place the kingdom above possessions was the one thing he lacked'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Willingness to place the kingdom of God above all material possessions was the one thing he lacked.'
  - where: 'note 10:18 “Why callest thou me good?”'
    claim: 'The remark deepened the man’s sense of the seriousness of his question'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The Lord’s remark must have deepened the young man’s conception as to the seriousness of his question.'
  - where: 'note 10:31 “First and last, a rebuke to Peter”'
    claim: 'The saying is a caution lest those promised the rewards count too surely on them and grow proud'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Lest those to whom they were promised might count too surely upon successful attainment, to the neglect of effort, and become proud withal, the Lord added this profound precept of caution'
  - where: 'note 10:51 “Rabboni”'
    claim: 'Mark, after his manner, gives the word Rabboni that Bartimaeus actually uttered'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'St. Mark (Mark 10:51, in the Greek), after his manner, gives the Hebrew word, Rabboni (comp. John 20:16), which Bartimæus actually uttered.'
  - where: 'note 10:52 “Made whole, and following in the way”'
    claim: 'The footnote glosses “made thee whole” from the Greek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/10?lang=eng'
    quote: 'GR saved, preserved, healed thee.'
  - where: christ
    claim: 'To receive the kingdom as a little child is to rely on Christ’s atoning blood as a child relies on a caregiver'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'our receving of the kingdom of God is fully dependent on our faithful reliance on the atoning blood of Jesus Christ to enter the kingdom of heaven, just as a little child or infant relies on a cargiver for life'
  - where: explore
    claim: 'Elder Oaks’s talk “Divorce” speaks first to members who have been divorced'
    key: oaks-divorce
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/04/divorce?lang=eng'
    quote: 'There are many good Church members who have been divorced. I speak first to them.'
  - where: 'note 10:25 “A camel through the eye of a needle”'
    claim: 'The figure was of a type familiar to the hearers'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Jesus used a rhetorical figure, which, strong and prohibitory as it appears in our translation, was of a type familiar to those who heard the remark.'
  - where: 'note 10:25 “A camel through the eye of a needle”'
    claim: 'Wealth is a temptation but no insuperable barrier; his riches could have made great service possible'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'while wealth is a means of temptation to which many succumb, it is no insuperable obstacle, no insurmountable barrier, in the way of entrance to the kingdom.'
  - where: 'note 10:27 “Those who trust in riches”'
    claim: 'JST Mark 10:26 (footnote 27a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/10?lang=eng'
    quote: 'JST Mark 10:26 … With men that trust in riches, it is impossible; but not impossible with men who trust in God and leave all for my sake, for with such all these things are possible.'
  - where: 'note 10:30 “An hundredfold, with persecutions”'
    claim: 'The hundredfold cannot be literal; relationships multiply, new homes and friends; persecution inseparable from the higher life'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/19.htm'
    quote: 'We cannot look for the hundredfold of houses, or wives, or children. What is meant is, that the spirit of insight and self-sacrifice for the sake of God’s kingdom multiplies and intensifies even the common joys of life. Relationships multiply on the ground of spiritual sympathies.'
  - where: 'note 10:30 “An hundredfold, with persecutions”'
    claim: '“With persecutions” corrects the disciples’ expectation that all would be smooth'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/19.htm'
    quote: 'They are reminded that persecution in some shape, the trials that test and strengthen, is inseparable from the higher life of the kingdom.'
  - where: 'note 10:30 “An hundredfold, with persecutions”'
    claim: '“With persecutions” is peculiar to Mark; Peter later wrote of the fiery trial'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: '(30) With persecutions.—Peculiar to St. Mark. … He had been taught to see in the “fiery trial” almost the necessary condition of the “exceeding joy” (1Peter 4:12-13).'
  - where: 'note 10:31 “First and last, a rebuke to Peter”'
    claim: 'JST Mark 10:30–31 (footnote 31a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/10?lang=eng'
    quote: 'JST Mark 10:30–31 But there are many who make themselves first, that shall be last, and the last first. This he said, rebuking Peter …'
  - where: 'note 10:32 “Amazed and afraid on the road”'
    claim: 'The apostles were amazed at His absorption and sadness and fell behind'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'so affected Jesus that even the apostles were amazed at His absorption and evident sadness; they fell behind in amazement and fear. Then He paused, called the Twelve about Him, and in language of absolute plainness'
  - where: 'note 10:32 “Amazed and afraid on the road”'
    claim: 'The look, tone and silent withdrawal struck the followers with fear and the Twelve with terror'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'the look and tone which accompanied them—and the silent withdrawal from converse with them, struck all the disciples with a vague fear, and the Twelve with absolute terror.'
  - where: 'note 10:34 “The third time, and the plainest”'
    claim: 'The third prediction is the most explicit, adding the abuse, spitting and scourging, and the purpose of His death as a ransom'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'This third and final prediction is also the most explicit, adding details about the abuse, spitting, and scourging that Jesus will endure and making it clear that the purpose of his death was to be a ransom for us.'
  - where: 'note 10:34 “The third time, and the plainest”'
    claim: 'Mark’s threefold pattern: the predictions contain three elements and are repeated three times'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus’ prophecies of his suffering and death (which contain three elements and are repeated three times; see Mark 8:31; 9:31; and 10:33–34)'
  - where: 'note 10:34 “The third time, and the plainest”'
    claim: 'The disciples may have expected the proclamation of His messianic dignity, His enthronement'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'this they may have vaguely conceived to be the crisis for which they had been waiting, the open proclamation of His Messianic dignity, His enthronement as Lord and King.'
  - where: 'note 10:38 “The cup and the baptism”'
    claim: 'The cup an Old Testament symbol of good or evil fortune; baptize = plunge into the deep; Jesus had used it of His passion (Luke 12:50)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'any reader of the Old Testament would at once recognise it as the symbol of a good or evil fortune. There was the “cup running over” of Psalm 23:5, the “wine-cup of fury” of Jeremiah 25:15'
  - where: 'note 10:38 “The cup and the baptism”'
    claim: 'The verb to baptize means to plunge into the deep; Jesus had used it of His coming passion'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'The very verb, “to baptize” (i.e., to plunge into the deep), was used by Josephus for the destruction of a city … Our Lord Himself had already used it in dim mysterious reference to His coming passion (Luke 12:50'
  - where: 'note 10:38 “The cup and the baptism”'
    claim: 'Fulfilment: James first of the Twelve to die (Acts 12:2); John a long old age and exile'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'James was the first of the whole company of the Twelve to pass through the baptism of blood (Acts 12:2). For John was reserved the weariness and loneliness of an old age'
  - where: 'note 10:38 “The cup and the baptism”'
    claim: 'The Greek of Mark 10:40 has no word for “it shall be given”: only “but for whom it has been prepared”'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/10-40.htm'
    quote: 'οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.'
  - where: 'note 10:38 “The cup and the baptism”'
    claim: 'The deaths of James and John are among prophecies fulfilled after the end of Mark’s text'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Prophecies that will be fulfilled after the end of the text include the following: Jesus baptizing with the Holy Spirit (Mark 1:8); the deaths of James and John (Mark 10:38–39)'
  - where: 'note 10:43 “Minister and servant of all”'
    claim: 'diakonos in Mark 10:43: those who advance others’ interests at the sacrifice of their own'
    key: thayer
    url: 'https://biblehub.com/greek/1249.htm'
    quote: 'Mark 10:43 (in which passage it is used figuratively of those who advance others'' interests even at the sacrifice of their own)'
  - where: 'note 10:43 “Minister and servant of all”'
    claim: 'doulos in Mark 10:44: devoted to another to the disregard of one’s own interests'
    key: thayer
    url: 'https://biblehub.com/greek/1401.htm'
    quote: 'γ. δοῦλος τίνος, devoted to another to the disregard of one''s own interests: Matthew 20:27; Mark 10:44'
  - where: 'note 10:45 “A ransom for many”'
    claim: 'lytron: the price for redeeming, ransom for slaves, captives, a life; to liberate many from the penalty of their sins'
    key: thayer
    url: 'https://biblehub.com/greek/3083.htm'
    quote: 'the price for redeeming, ransom (paid for slaves, Leviticus 19:20; for captives, Isaiah 45:13; for the ransom of a life, Exodus 21:30; Numbers 35:31f): ἀντί πολλῶν, to liberate many from the misery and penalty of their sins'
  - where: 'note 10:45 “A ransom for many”'
    claim: 'The first distinct statement of the plan of His work: salvation also redemption'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'It is the first distinct utterance, we may note, of the plan and method of His work. He had spoken before of “saving” the lost (Matthew 18:11): now He declares that the work of “salvation” was to be also one of “redemption.”'
  - where: 'note 10:45 “A ransom for many”'
    claim: 'To redeem is to pay off a debt or set free by paying a ransom'
    key: christofferson-redemption
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/04/redemption?lang=eng'
    quote: 'the word redeem means to pay off an obligation or a debt. Redeem can also mean to rescue or set free as by paying a ransom.'
  - where: 'note 10:46 “Bartimaeus, son of Timaeus”'
    claim: 'The name is Greek with the Aramaic prefix Bar, son'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'It is noticeable that the name was Greek with the Aramaic prefix Bar (= son), a combination not found elsewhere.'
  - where: 'note 10:46 “Bartimaeus, son of Timaeus”'
    claim: 'Only Mark names him; perhaps because he was known to Mark’s audience'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'it is possible that in this case, Mark included the name because Bartimaeus was known to his audience, and Matthew and Luke omitted it because he was not known to theirs.'
  - where: 'note 10:47 “Thou Son of David”'
    claim: 'The title showed faith in Him as the promised King and Deliverer'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'his use of the title, Son of David, show that he knew of the great Teacher, had confidence in His power to heal and faith in Him as the promised King and Deliverer of Israel.'
  - where: 'note 10:47 “Thou Son of David”'
    claim: 'The literally blind Bartimaeus identifies Jesus while the Twelve struggle'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'while the twelve repeatedly struggle to understand Jesus’ identity and teachings, despite his repeated efforts to teach them, the literally blind Bartimaeus is able to identify Jesus (see Mark 10:47).'
  - where: 'note 10:47 “Thou Son of David”'
    claim: 'The title is perhaps insufficient, presuming a purely Davidic kingship without suffering; Jesus does not rebuke him, but later (12:35–37) eschews it'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'While Jesus does not rebuke Bartimaeus, Jesus will later specifically eschew identification of the Christ as the son of David (Mark 12:35–7). The title is perhaps insufficient because it presumes a purely Davidic kingship'
  - where: 'note 10:50 “Casting away his garment”'
    claim: 'The cloak was probably how he collected alms; casting it aside connects with losing one’s life (8:34–35)'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Bartimaeus’s willingness to cast aside his means of earning his living also connects this scene with the first passion prediction, when Jesus had enjoined Peter and the other disciples who wanted to follow him to be willing lose their lives for his sake'
  - where: 'note 10:50 “Casting away his garment”'
    claim: 'Throwing aside his cloak, probably the means of collecting alms'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Throwing aside his cloak, which was probably the means by which he collected the alms that he begged, the blind man comes to Jesus and pleads for his sight.'
  - where: 'note 10:50 “Casting away his garment”'
    claim: 'The garment is the outer mantle; the verb in the better manuscripts is “leaping up”; the bystanders’ words are Mark’s only'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/10.htm'
    quote: 'The cheering words of the disciples or by-standers are given by St. Mark only, as is also the eager action of the man “casting off his garment (i.e., the outer mantle) and leaping up.”'
  - where: 'note 10:51 “Rabboni”'
    claim: 'The Textus Receptus has Rabboni in Mark 10:51; a title of honor and reverence, interpreted as teacher'
    key: thayer
    url: 'https://biblehub.com/greek/4462.htm'
    quote: 'Ῥαββονί (so Rec. in Mark 10:51)'
  - where: 'note 10:51 “Rabboni”'
    claim: 'Rabboni a title of honor and reverence; John interprets it as teacher'
    key: thayer
    url: 'https://biblehub.com/greek/4462.htm'
    quote: 'a title of honor and reverence by which Jesus is addressed; as interpreted by John, equivalent to διδάσκαλος: John 20:16; Mark 10:51'
  - where: 'note 10:52 “Made whole, and following in the way”'
    claim: 'His faith led to healing and also saved him (sesōken) in a deeper sense; he followed Jesus up to Jerusalem; full understanding symbolized'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Jesus complies, stating that the man’s faith not only led to his healing, because it also allows him to see Jesus for who he really is, but it also saved him (Greek, sesōken se) in a deeper, spiritual sense.'
  - where: 'note 10:52 “Made whole, and following in the way”'
    claim: 'Following “in the way” meant going with Him up to Jerusalem for Passion Week; Bartimaeus symbolizes full understanding'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Bartimaeus then follows Jesus “in the way,” which in this case meant going with him from Jericho up the road to Jerusalem, where Jesus was about to begin his Passion Week.'
  - where: 'note 10:52 “Made whole, and following in the way”'
    claim: 'Bartimaeus symbolizes full spiritual understanding, unlike the man healed in stages'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'This full, clear spiritual understanding of the mission of Jesus Christ is symbolized by the story of blind Bartimaeus that ends Mark’s second act. Unlike the man healed near Bethsaida, who had his sight restored in stages'
  - where: christ
    claim: 'Disciples may go about doing good in the redemptive pattern of the Master, who came to minister and give His life a ransom'
    key: christofferson-redemption
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/04/redemption?lang=eng'
    quote: '“The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matthew 20:28). So may we, under the influence of the Holy Spirit, go about doing good in the redemptive pattern of the Master.'
