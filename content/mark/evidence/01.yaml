chapter: 1
claims:
  - where: setting
    claim: 'Mark begins with a disciple, John the Baptist, rather than a genealogy, birth story or prologue'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'By way of contrast, Mark begins his Gospel not with an exploration of Jesus’ link to the Old Testament, or a focus on marginalized people, or a philosophical exploration, but a disciple: John the Baptist, who prepares people to be disciples of Jesus Christ.'
  - where: setting
    claim: 'euthys occurs ten times in Mark 1'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'This word is used forty-one times in the Gospel, or, on average, over twice per chapter (although it is concentrated at the beginning of the Gospel, with ten occurrences in the first chapter). It creates a sense of a rapidly rushing narrative.'
  - where: setting
    claim: 'The King James renderings of euthys in Mark 1: straightway, forthwith, anon'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark 1:28, 29, 42, 43 (KJV “forthwith”); Mark 1:30 (KJV “anon”)'
  - where: setting
    claim: 'The Gospel is anonymous; titles appeared later in the second century'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'The titles that now head each of the four Gospels do not seem to be original parts of the texts but began to appear later in the second century AD'
  - where: setting
    claim: 'Mark: John Mark, son of Mary of Jerusalem'
    key: bd-mark
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mark?lang=eng'
    quote: 'Also called John; son of Mary, who had a house of considerable size in Jerusalem (Acts 12:12)'
  - where: setting
    claim: 'Mark with Peter at Babylon (probably Rome); the Gospel possibly written under Peter’s direction'
    key: bd-mark
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mark?lang=eng'
    quote: 'with Peter at Babylon (probably Rome) (1 Pet. 5:13); with Timothy at Ephesus (2 Tim. 4:11). His gospel (see Gospels) was possibly written under the direction of Peter.'
  - where: setting
    claim: 'Papias, early second century, quoted by Eusebius'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'The first of these was Papias of Hierapolis, who wrote in the first third of the second century AD, but whose writing only survives in quotations by Eusebius'
  - where: setting
    claim: 'Papias’s elder: Mark Peter’s interpreter, wrote accurately, not in order'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'Mark became Peter’s interpreter [hermēneutēs] and wrote accurately all that he remembered, not, indeed, in order, of the things said or done by the Lord.'
  - where: setting
    claim: 'The Petrine connection is an early, probably reliable tradition'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'the prevalence and relative consistency of such early postapostolic sources on the Petrine connection suggest that this connection was, in fact, based upon an early, probably reliable, tradition.'
  - where: setting
    claim: 'Peter’s call (1:16–20) and the word to “his disciples and Peter” (16:7) frame the body of the Gospel'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'starting with the call of Peter and Andrew (see Mark 1:16–20) and ending with the angel’s directive that the women at the empty tomb go to the disciples and Peter (see Mark 16:7)—that is perhaps the most significant. These references to the chief Apostle frame the body of the Gospel'
  - where: setting
    claim: 'Possibly written for Christians in Rome persecuted by Nero after AD 64; dated between Peter’s death and AD 69'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'it may have been originally written for Christians in the capital itself, where Christians were persecuted by the emperor Nero after the fire of AD 64'
  - where: setting
    claim: 'Date between Peter’s death (traditionally AD 64) and AD 69'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'The dating of the Gospel thus seems to fall between the death of Peter, traditionally placed at the time of the Neronian persecutions in AD 64, and the second phase of the Jewish War'
  - where: thread
    claim: 'The prologue (1:1–15) prepares the audience to trust Jesus through the narrator, John and God'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'The prologue to Mark’s Gospel (Mark 1:1–15) establishes Jesus’s significance and prepares the audience to trust Jesus through statements made by the narrator, by John the Baptist, and by God.'
  - where: thread
    claim: 'In the quotation of 1:2–3 Jesus is cast as the Lord (Jehovah)'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Second, he casts Jesus in the role of Jehovah; it is Jesus’s way and Jesus’s path that needs to be prepared and made straight by the Jews.'
  - where: thread
    claim: 'Through chapter 1 Mark emphasizes Jesus’s authority and the crowd’s astonishment'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'Throughout all of these actions, Mark emphasizes Jesus’s authority and the crowd’s astonishment.'
  - where: thread
    claim: 'The leper lived outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he shall dwell alone; without the camp shall his habitation be.'
  - where: thread
    claim: 'Jesus ends up living like a leper in the wilderness, and the crowds still come'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'In the next layer, Jesus himself has to act like a leper and live in the wilderness in order to escape the crowds. In the final layer of irony, Jesus’ efforts to escape the crowds fail'
  - where: section 2 plain
    claim: '“Opened” in 1:10 is the verb to rend, tear'
    key: thayer
    url: 'https://biblehub.com/greek/4977.htm'
    quote: 'to cleave, cleave asunder, rend: τί, Luke 5:36; passive, αἱ πέτραι, Matthew 27:51; οἱ οὐρανοί, Mark 1:10'
  - where: section 4 plain
    claim: '“Time” in 1:15 is the appointed period'
    key: thayer
    url: 'https://biblehub.com/greek/2540.htm'
    quote: 'the preappointed period which according to the purpose of God must elapse before the divine kingdom could be founded by Christ, Mark 1:15'
  - where: section 4 plain
    claim: '“Is at hand”: the Greek means “has arrived”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'has arrived'
  - where: section 6 plain
    claim: '“What have we to do with thee”: what business do you have with us'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'what business do you have with us'
  - where: section 9 plain
    claim: '“Straitly charged him”: warned him sternly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'warned him sternly'
  - where: section 9 plain
    claim: '“Blaze abroad”: spread widely'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'spread widely'

  - where: 'note 1:1 “A title over the whole book”'
    claim: 'The opening line acts as a title; the only place the narrator directly assesses Jesus; elsewhere he shows'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'is highly distinctive as the only place where the narrator pronounces a direct, generalized assessment of Jesus—elsewhere, the narrator prefers to show who Jesus is through actions and dialogues and to place assessments of Jesus in the mouths of the characters.'
  - where: 'note 1:1 “A title over the whole book”'
    claim: 'What the titles mean becomes clear only through the narrative'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'but what these titles mean in the first century is highly debatable and becomes clear only as we explore the narrative as a whole.'
  - where: 'note 1:1 “A title over the whole book”'
    claim: '“Gospel” in transition from “good news” of the kingdom to a book about the Lord’s life'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/1.htm'
    quote: 'a transition stage in the history of the word Gospel, between its earlier sense, as meaning generally the “good news” of the kingdom of God (Mark 1:14; Matthew 4:23; Matthew 9:35), and the later sense, as a book recording the main facts in our Lord’s life and work.'
  - where: 'note 1:1 “A title over the whole book”'
    claim: '“Son of God” in the title and at the cross (15:39); used by God and demons'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Because it is used in the title of the Gospel (see Mark 1:1) and the climactic confession at the cross (see Mark 15:39), some have argued that it is the most important title for Jesus in Mark’s Gospel.'
  - where: 'note 1:1 “A title over the whole book”'
    claim: 'The SBL text omits “Son of God” in 1:1'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/1-1.htm'
    quote: 'SBL Greek New Testament 2010 Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ χριστοῦ.'
  - where: 'note 1:1 “A title over the whole book”'
    claim: 'Tischendorf omits it'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/1-1.htm'
    quote: 'Tischendorf 8th Edition Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ Χριστοῦ,'
  - where: 'note 1:1 “A title over the whole book”'
    claim: 'The Textus Receptus and the Byzantine text have “Son of God”'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/1-1.htm'
    quote: 'Scrivener''s Textus Receptus 1894 Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ Χριστοῦ, υἱοῦ τοῦ Θεοῦ·'

  - where: 'note 1:2 “Three scriptures, and the Lord who comes”'
    claim: 'The only Old Testament quotation in Mark in the narrator’s voice; a composite of three texts'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Mark 1:2-3 represents the only place in Mark’s Gospel where Mark quotes from the Old Testament in a narrative fashion rather than having the quotation spoken by Jesus. Second, although Mark claims that he is quoting from Isaiah, Mark 1:2-3 is actually a composite quotation drawn from three separate texts.'
  - where: 'note 1:2 “Three scriptures, and the Lord who comes”'
    claim: 'Exodus 23:20 and Malachi 3:1 in their settings; Malachi’s messenger Elijah; Isaiah 40:3 Jehovah’s return'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Malachi 3:1 is likely a paraphrase of Exodus 23:20 but situated within a new context. … Jehovah will be sending Elijah to turn the hearts of the children to the fathers'
  - where: 'note 1:2 “Three scriptures, and the Lord who comes”'
    claim: 'Isaiah 40:3 announced Jehovah’s return and glory'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Isaiah 40:3 announces to Israel that Jehovah’s triumphant return is imminent and that the “glory of the Lord” is to be shortly revealed (Isaiah 40:5).'
  - where: 'note 1:2 “Three scriptures, and the Lord who comes”'
    claim: 'Mark casts John as the messenger and Jesus as Jehovah; the coming of John and Jesus fulfills Isaiah’s promised salvation'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'First, he casts John the Baptist into the role of the “messenger,” who delivers the message of Jehovah to the people. … Second, he casts Jesus in the role of Jehovah'
  - where: 'note 1:2 “Three scriptures, and the Lord who comes”'
    claim: 'Fulfilment of Isaiah’s promised salvation'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Mark “sees in the coming of John and Jesus to the wilderness the fulfilment of the promised salvation of which the prophet Isaiah had spoken.”'
  - where: 'note 1:2 “Three scriptures, and the Lord who comes”'
    claim: 'The Textus Receptus reads “in the prophets”'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/1-2.htm'
    quote: 'Scrivener''s Textus Receptus 1894 Ὡς γέγραπται ἐν τοῖς προφήταις'
  - where: 'note 1:2 “Three scriptures, and the Lord who comes”'
    claim: 'The SBL text reads “in Isaiah the prophet”'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/1-2.htm'
    quote: 'SBL Greek New Testament 2010 Καθὼς γέγραπται ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ'

  - where: 'note 1:4 “What John’s baptism was”'
    claim: 'Latter-day Saints hold that baptism was not new with John but part of the plan from the beginning'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'Latter-day Saints believe that baptism “was not a new rite introduced by John the Baptist and adopted by Christ and his followers.”[2] Rather, we hold the unique perspective that baptism has been a vital part of God’s salvific plan for his children from the very beginning.'
  - where: 'note 1:4 “What John’s baptism was”'
    claim: 'John’s baptism once only, for repentance and forgiveness, to prepare Israel; the washings repeated ceremonial rites'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'John’s baptism was a onetime event. Most of the Jewish washings were a ceremonial purification rite that would be performed when needed throughout one’s lifetime. John’s baptism was focused on repentance and the forgiveness of sins to prepare Israel for the coming of their Lord.'
  - where: 'note 1:4 “What John’s baptism was”'
    claim: 'John held keys and administered his baptism; other washings were self-immersion; hence “the Baptist”'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'John held priesthood keys and personally administered his baptism, whereas Jewish proselyte baptism and other purification baths or washings were a self-immersion'
  - where: 'note 1:4 “What John’s baptism was”'
    claim: 'The title “the Baptist” shows he was doing something different'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: '“This practice provides the most plausible explanation for the description of John as ‘the Baptist’: He was doing something different, or else the designation would not have distinguished him.”'
  - where: 'note 1:4 “What John’s baptism was”'
    claim: 'D&C 84:27–28: John ordained at eight days to make straight the way of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'was ordained by the angel of God at the time he was eight days old unto this power, to overthrow the kingdom of the Jews, and to make straight the way of the Lord before the face of his people'
  - where: 'note 1:4 “What John’s baptism was”'
    claim: 'Joseph Smith: John held the Aaronic Priesthood, a legal administrator and forerunner'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: '“John [the Baptist] held the Aaronic Priesthood, and was a legal administrator, and the forerunner of Christ, and came to prepare the way before him.”'

  - where: 'note 1:6 “Dressed like Elijah”'
    claim: 'John probably adopted the dress deliberately to revive Elijah’s appearance (2 Kgs. 1:8)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'The dress was probably deliberately adopted by the Baptist as reviving the outward appearance of Elijah, who was “a hairy man, and girt with a girdle of leather” (2Kings 1:8)'
  - where: 'note 1:6 “Dressed like Elijah”'
    claim: 'Mark casts John in the role of Malachi’s messenger, the eschatological Elijah'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'John’s mission is that of the eschatological Elijah, and to reject his words is to invite the wrath of Jehovah.'
  - where: 'note 1:6 “Dressed like Elijah”'
    claim: 'Elias as a title for a forerunner; two Eliases, a preparer (John) and a restorer (Jesus)'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'These passages are sufficiently clarified to show that anciently two Eliases were spoken of, one as a preparer and the other a restorer. John was sent to prepare the way for Jesus, Jesus Himself being the Restorer'

  - where: 'note 1:8 “Water, fire and the Holy Ghost”'
    claim: 'JST Mark 1:6 reads “not only … with water, but with fire, and the Holy Ghost”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'but he shall not only baptize you with water, but with fire, and the Holy Ghost.'
  - where: 'note 1:8 “Water, fire and the Holy Ghost”'
    claim: 'Joseph Smith: baptism of water without fire and the Holy Ghost is of no use'
    key: tpjs-2007-ch-7
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-7?lang=eng'
    quote: '“The baptism of water, without the baptism of fire and the Holy Ghost attending it, is of no use; they are necessarily and inseparably connected.”'
  - where: 'note 1:8 “Water, fire and the Holy Ghost”'
    claim: 'John’s statement shows Jesus’s authority greater than a prophet’s'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'John’s statement establishes Jesus’s importance and authority as greater than that of a prophet'

  - where: 'note 1:9 “Why the sinless Son was baptized”'
    claim: 'Matthew perhaps included “fulfil all righteousness” to answer how a sinless Messiah could receive a baptism of repentance (Mark 1:4)'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'to answer the questions that some would have concerning a sinless Messiah receiving “the baptism of repentance for the remission of sins” (Mark 1:4).'
  - where: 'note 1:9 “Why the sinless Son was baptized”'
    claim: 'Nephi explains that Jesus was not baptized for remission of sins, being sinless'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'explains that Jesus was not receiving John’s baptism for a remission of sins, for he was sinless.'
  - where: 'note 1:9 “Why the sinless Son was baptized”'
    claim: '2 Ne. 31:7: He humbled Himself and witnessed His obedience'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'according to the flesh he humbleth himself before the Father, and witnesseth unto the Father that he would be obedient unto him in keeping his commandments.'
  - where: 'note 1:9 “Why the sinless Son was baptized”'
    claim: 'Baptism is Jesus’s first act, submission; the Father’s pronouncement comes after it'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'Significantly, God’s pronouncement of Jesus as the one he loves and with whom he is “well pleased” (1:11) comes after Jesus has displayed his obedience by being baptized.'
  - where: 'note 1:9 “Why the sinless Son was baptized”'
    claim: 'His first act signals submission to God'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'His first act, baptism (Mark 1:9), signals his submission to God'

  - where: 'note 1:10 “The heavens torn open”'
    claim: 'schizō: to cleave asunder, rend; used of the heavens in 1:10 and the veil in 15:38'
    key: thayer
    url: 'https://biblehub.com/greek/4977.htm'
    quote: 'to cleave, cleave asunder, rend: τί, Luke 5:36; passive, αἱ πέτραι, Matthew 27:51; οἱ οὐρανοί, Mark 1:10'
  - where: 'note 1:10 “The heavens torn open”'
    claim: 'The same verb for the veil at 15:38'
    key: thayer
    url: 'https://biblehub.com/greek/4977.htm'
    quote: 'with εἰς δύο added, into two parts, in twain'
  - where: 'note 1:10 “The heavens torn open”'
    claim: 'A sudden event, a stronger word than Matthew’s and Luke’s'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/1.htm'
    quote: 'being rent asunder, a sudden event; a stronger word than that used in Mt. and Lk.'
  - where: 'note 1:10 “The heavens torn open”'
    claim: 'Baptism and death share a narrative pattern; both rendings are divine acts'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Both the baptism and the death have the same narrative pattern, with the main event narrated only briefly and greater attention given to the results.'
  - where: 'note 1:10 “The heavens torn open”'
    claim: 'The Spirit tears through the heavens; God rends the veil'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Both rendings are divine actions: after the baptism, the Spirit tears through the heavens to descend upon Jesus (Mark 1:10); after the death, God’s action rends the veil'
  - where: 'note 1:10 “The heavens torn open”'
    claim: 'The rent veil makes the Holy of Holies accessible to all'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Its rending signifies that this most sacred of spaces is now accessible to all people because of Jesus’s death.'
  - where: 'note 1:10 “The heavens torn open”'
    claim: 'KnoWhy: the rending admitted Jesus into the presence of the Godhead, like Old Testament prophetic callings'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'At this rending or parting of the heavenly veil, Jesus was admitted into the presence of two members of the Godhead, He Himself being the third member incarnate. His baptism thus ultimately led to a type of divine confirmation or encounter, much like prophetic callings found in the Old Testament.'

  - where: 'note 1:11 “Spoken to the Son”'
    claim: 'Mark addresses Jesus, Matthew the onlookers; royal investiture addressed both'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'Matthew records God speaking to the audience who witnessed Jesus’s baptism. In any royal investiture, words were naturally addressed both to the one being elevated to the throne and also to the people who then would honor that ruler'
  - where: 'note 1:11 “Spoken to the Son”'
    claim: 'The words allude to Psalm 2:7, a coronation psalm'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'appear to be quoting or alluding to Psalm 2:7, which is often viewed as a prominent royal psalm associated with the coronation of ancient Israelite kings'
  - where: 'note 1:11 “Spoken to the Son”'
    claim: 'God’s words confirm the narrator; the audience can trust Jesus'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'God’s proclamation of Jesus as his Son confirms the narrator’s assessment of Jesus'
  - where: 'note 1:11 “Spoken to the Son”'
    claim: 'The audience is prepared to trust whatever Jesus says or does'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'the audience is prepared to listen to him and trust whatever he may say or do.'
  - where: 'note 1:11 “Spoken to the Son”'
    claim: 'At the baptism the voice quotes a psalm to Jesus; at the cross Jesus quotes a psalm to God'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'at the baptism, the voice from heaven quotes a psalm when speaking to Jesus (Mark 1:11, quoting Ps. 2:7), and at the cross, Jesus quotes a psalm when speaking to God (Mark 15:34, quoting Ps. 22:1).'

  - where: 'note 1:12 “Driven out by the Spirit”'
    claim: 'ekballō in 1:12: to lead one away with a force he cannot resist'
    key: thayer
    url: 'https://biblehub.com/greek/1544.htm'
    quote: 'to lead one forth or away somewhere with a force which he cannot resist: Mark 1:12.'
  - where: 'note 1:12 “Driven out by the Spirit”'
    claim: 'The same verb for casting out devils in 1:34, 39'
    key: thayer
    url: 'https://biblehub.com/greek/1544.htm'
    quote: 'δαιμόνια, Matthew 7:22; Matthew 8:16, 31; Matthew 9:33; Mark 1:34, 39'
  - where: 'note 1:12 “Driven out by the Spirit”'
    claim: 'The Septuagint uses the verb for Adam and Eve cast out (Gen. 3:24); Jesus suffers their consequence though sinless'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'using the same verb found in the Septuagint (second-century BC Greek translation of the Old Testament) when Adam and Eve were cast out of the garden after the Fall (Gen. 3:24).'
  - where: 'note 1:12 “Driven out by the Spirit”'
    claim: 'He suffers the consequence Adam and Eve suffered'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'he suffers the same consequence that Adam and Eve suffered'
  - where: 'note 1:12 “Driven out by the Spirit”'
    claim: 'Being driven confirms His obedience even when difficult'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'his second act, being “driven” by the Spirit into the wilderness (1:12), confirms his willingness to be obedient to God even when it is difficult.'
  - where: 'note 1:12 “Driven out by the Spirit”'
    claim: 'JST Mark 1:10–11: the Spirit took him; Satan seeking to tempt him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'And immediately the Spirit took him into the wilderness. And he was there in the wilderness forty days, Satan seeking to tempt him'
  - where: 'note 1:12 “Driven out by the Spirit”'
    claim: 'JST Matt. 4:1: to be with God'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'Then Jesus was led up of the Spirit, into the wilderness, to be with God.'

  - where: 'note 1:13 “Wild beasts and angels”'
    claim: '“With the wild beasts” peculiar to Mark; which animals'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/1.htm'
    quote: 'Peculiar to him are (1) the use of “Satan” instead of “the devil;” (2) the statement that Jesus was “with the wild beasts.” In our Lord’s time these might include the panther, the bear, the wolf, the hyena, possibly the lion.'
  - where: 'note 1:13 “Wild beasts and angels”'
    claim: 'Their presence added to the terror; His protection fulfilled Psalm 91, the tempter’s psalm'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/1.htm'
    quote: 'partly that their presence added to the terrors of the Temptation, partly that in His being protected from them there was the fulfilment of the promise in the very Psalm which furnished the Tempter with his chief weapon'
  - where: 'note 1:13 “Wild beasts and angels”'
    claim: 'Psalm 91:13, the lion and adder, the true child of God'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/1.htm'
    quote: 'that the true child of God should trample under foot “the lion and the adder,” the “young lion and the dragon” (Psalm 91:13).'
  - where: 'note 1:13 “Wild beasts and angels”'
    claim: 'Smith: a comfort to Christians in Rome after AD 64 who might be thrown to the lions'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'If we accept the idea that Mark’s Gospel is, at least in part, meant to help Christians survive the terrible persecution that resulted from blame heaped upon them after a fire destroyed most of Rome in AD 64, then this detail would have been of great comfort'
  - where: 'note 1:13 “Wild beasts and angels”'
    claim: 'Thrown to the lions'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'who might literally be thrown to the lions in the arena.'
  - where: 'note 1:13 “Wild beasts and angels”'
    claim: 'diakoneō first used of the angels; then of Simon’s mother-in-law, Jesus’s mission, and the women at the cross'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'This verb (Greek: diakoneō) was first used in Mark to describe the actions of the angels to Jesus after the temptation (Mark 1:13)'
  - where: 'note 1:13 “Wild beasts and angels”'
    claim: 'Used for Simon’s mother-in-law (1:31) and Jesus’s mission (10:45)'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'This verb for “ministered” is used two times elsewhere in Mark: for Simon’s mother-in-law after Jesus has healed her (see Mark 1:31) and by Jesus to describe his own mission (see Mark 10:45).'

  - where: 'note 1:15 “The appointed time has come”'
