  - where: 'note 1:18 “Men who had met Him before”'
    claim: 'A fisherman in fairly comfortable circumstances (Mark 1:20)'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'In his early life he was a fisherman in fairly comfortable circumstances (Mark 1:20).'
  - where: 'note 1:18 “Men who had met Him before”'
    claim: 'By following Jesus they become more than they were, whom He sees'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'that we may become something more than we are, that we may become whom he sees us as.'

  - where: 'note 1:22 “An authority the scribes never claimed”'
    claim: 'Scribes developed and applied the law; the oral law grew up'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'It was their business to develop the law in detail and apply it to the circumstances of their time; hence grew up the oral or traditional law side by side with the written law.'
  - where: 'note 1:22 “An authority the scribes never claimed”'
    claim: 'They taught by memorization, reproducing the words of the wise; never on their own authority'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'Their method of teaching relied on memorization. Their aim was to reproduce and teach others to reproduce accurately the words of the wise'
  - where: 'note 1:22 “An authority the scribes never claimed”'
    claim: 'Scribes never taught on their own authority'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'The scribes never taught on their own authority (contrast with this the Lord’s method, Matt. 7:29).'
  - where: 'note 1:22 “An authority the scribes never claimed”'
    claim: 'Mark emphasizes authority and astonishment throughout the chapter'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'Throughout all of these actions, Mark emphasizes Jesus’s authority and the crowd’s astonishment.'

  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'In Mark the demons have accurate information (1:24, “Jesus of Nazareth”)'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Of the five uses of “Jesus of Nazareth” in Mark’s Gospel, one is from a demon (see Mark 1:24); despite their evil character, the demons in this Gospel have accurate information.'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'Jesus at battle with Satan’s dominion, announced in 1:13'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'It also announces a major theme of Mark’s Gospel: Jesus is at battle with Satan and Satan’s dominion.'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'phimoō: to muzzle (an ox); passive, hold one’s peace, Mark 1:25'
    key: thayer
    url: 'https://biblehub.com/greek/5392.htm'
    quote: 'to close the mouth with a muzzle, to muzzle: properly, βοῦν, the ox'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'Passive use at Mark 1:25'
    key: thayer
    url: 'https://biblehub.com/greek/5392.htm'
    quote: 'passive, to become speechless, hold one''s peace, Matthew 22:12; Mark 1:25'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'Jesus did not want demonic testimony'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Jesus forbade the demons to proclaim who He was (see Mark 1:25, 34; 3:12), but that is understandable. He did not want demonic testimony to His messiahship.'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'Satan’s minions knew Him; the religious authorities did not'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'The minions of Satan recognized and knew who Jesus was, but the religious authorities did not.'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'The recurring commands to silence; called the messianic secret'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus frequently tells people not to tell others what he has done for them, and sometimes he appears to try to hide his identity.'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'Examples include 1:23, 34, 43–45 and 8:30'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'For examples of the messianic secret, see Mark 1:23, 34, 43–45; 3:11–12; 5:43; 7:36; 8:26, 30; and 9:9.'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'The commands are often broken and Mark says so; no consensus'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus’ requests for secrecy are often ignored, and Mark tells us all about it.'
  - where: 'note 1:25 “Why He silenced the spirits”'
    claim: 'No scholarly consensus'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'There is no current scholarly consensus regarding the messianic secret in Mark'

  - where: 'note 1:31 “She ministered”'
    claim: 'diakoneō: menial service, but also the paradigm of discipleship; the same word as the angels’ in 1:13'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'While the word used for “ministered” can mean simple, menial service, it is also the paradigm for the kind of service that disciples offer, and it is the same Greek word used in Mark 1:13 to describe the action of the angels.'
  - where: 'note 1:31 “She ministered”'
    claim: 'She is the prototypical disciple in a Gospel of failed male disciples'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Thus this woman serves as the prototypical disciple in a text that is very concerned with that topic and that features repeated failures by the leading (male) disciples.'
  - where: 'note 1:31 “She ministered”'
    claim: 'An undeveloped hint, taken up at the cross with the women who ministered; Jesus’s own mission (10:45)'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Simon’s mother-in-law’s ministry is one of the undeveloped hints in the narrative; Jesus’s ministry sets the template for what ministry should be.'

  - where: 'note 1:32 “Waiting for the sabbath to end”'
    claim: 'It was the sabbath; people waited until sunset when it closed; hence the double note of time'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/1.htm'
    quote: 'It was Sabbath, and the people would wait till sunset when Sabbath closed. Hence the double note of time.'

  - where: 'note 1:38 “What He came to do”'
    claim: 'The disciples, impressed with His healing, told Him many waited'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'The disciples were impressed with Jesus’ healing ability and indicated to Him that many were already waiting to receive such blessings at His hand.'
  - where: 'note 1:38 “What He came to do”'
    claim: 'Healing not His foremost purpose; to proclaim the kingdom’s nearness'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Thus Jesus indicated that His healing ministry, with which all were so impressed, was really not His foremost purpose on earth. He had something more important to do, that is, proclaim the nearness of the kingdom of God'
  - where: 'note 1:38 “What He came to do”'
    claim: '“Came I forth” may mean leaving Capernaum; Luke’s “sent” ties it to His mission'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/1.htm'
    quote: 'In this form the words might refer simply to His leaving Capernaum; but the report in St. Luke, “for therefore was I sent” connects them with His mission as a whole.'
  - where: 'note 1:38 “What He came to do”'
    claim: 'The disciples would hear it as from Nazareth, not from the Father'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/1.htm'
    quote: 'To them His “coming forth,” even as being “sent,” would be as from His home at Nazareth, not as from the bosom of the Father.'

  - where: 'note 1:41 “He touched the leper”'
    claim: 'The law: the leper rent clothes, cried unclean, lived alone outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'And the leper in whom the plague is, his clothes shall be rent, and his head bare, and he shall put a covering upon his upper lip, and shall cry, Unclean, unclean.'
  - where: 'note 1:41 “He touched the leper”'
    claim: 'The leper’s question was whether Jesus would heal; Jesus touched him though unclean ceremonially and physically'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The question in his mind was not—Can Jesus heal me? but—Will he heal me? In compassionate mercy Jesus laid His hand upon the sufferer, unclean though he was, both ceremonially and physically'

  - where: 'note 1:44 “Sent sternly to the priest”'
    claim: 'embrimaomai: elsewhere to be moved with indignation; at 1:43 to charge sternly'
    key: thayer
    url: 'https://biblehub.com/greek/1690.htm'
    quote: 'to be very angry, to be moved with indignation'
  - where: 'note 1:44 “Sent sternly to the priest”'
    claim: 'At 1:43: sternly to charge'
    key: thayer
    url: 'https://biblehub.com/greek/1690.htm'
    quote: 'In a sense unknown to secular authors, to charge with earnest admonition, sternly to charge, threateningly to enjoin: Matthew 9:30; Mark 1:43.'
  - where: 'note 1:44 “Sent sternly to the priest”'
    claim: 'ekballō at 1:43: cause one to depart in haste'
    key: thayer
    url: 'https://biblehub.com/greek/1544.htm'
    quote: 'to command or cause one to depart in haste: Mark 1:43'
  - where: 'note 1:44 “Sent sternly to the priest”'
    claim: 'The law of the leper’s cleansing: brought to the priest, who examines him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'This shall be the law of the leper in the day of his cleansing: He shall be brought unto the priest:'
  - where: 'note 1:44 “Sent sternly to the priest”'
    claim: 'The testimony: from priest to people, without which the leper would not be received as clean'
    key: egt-mark
    url: 'https://biblehub.com/commentaries/egt/mark/1.htm'
    quote: 'for a testimony from priest to people, without which the leper would not be received as clean.'
  - where: 'note 1:44 “Sent sternly to the priest”'
    claim: 'The people and disciples expected a miracle-working Messiah who would cast out the Romans'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'None of the people, including Jesus’ disciples, completely understood who He was. They assumed that He was the Messiah, which was correct; but their conception of the Messiah was of one who worked miracles, healed the sick, fed the hungry, and ultimately would cast the Romans out of Judea.'
  - where: 'note 1:44 “Sent sternly to the priest”'
    claim: 'When the command was ignored, Jesus had to go into the wilderness to get away from the crowds'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Yet, when people ignored His admonition, Jesus found Himself having to go into the wilderness to get away from the crowds who wanted Him to heal their sick (see Mark 1:38, 45).'

  - where: 'note 1:44 “Sent sternly to the priest”'
    claim: 'The requests not to publicize healings most likely reflect His wish that before His death people not be misled about what it means to be a Messiah'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus’ requests for people not to preach about his healing miracles is most likely tied to his desire that, before his death, he did not want people to be misled about what it means to be a Messiah.'
  - where: 'note 1:45 “Outside, where the leper had been”'
    claim: 'The leper’s habitation outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he shall dwell alone; without the camp shall his habitation be.'
  - where: 'note 1:45 “Outside, where the leper had been”'
    claim: 'Three layers of irony: the leper disobeys; Jesus lives like a leper; the escape fails'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'In the first bit of irony, the leper disobeys the one who has healed him. In the next layer, Jesus himself has to act like a leper and live in the wilderness in order to escape the crowds. In the final layer of irony, Jesus’ efforts to escape the crowds fail'

