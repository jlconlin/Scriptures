  - where: 'note 1:15 “The appointed time has come”'
    claim: 'Joseph Smith: the kingdom could not be nearer than in John’s hands'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'But, says one, the kingdom of God could not be set up in the days of John, for John said the kingdom was at hand. But I would ask if it could be any nearer to them than to be in the hands of John.'
  - where: 'note 1:15 “The appointed time has come”'
    claim: 'Legal administrator and subjects baptized: the kingdom was there'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'There was a legal administrator, and those that were baptized were subjects for a king; and also the laws and oracles of God were there; therefore the kingdom of God was there'
  - where: 'note 1:15 “The appointed time has come”'
    claim: 'Jesus’s first words encapsulate what He cares about'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'This is a significant line because it encapsulates what Jesus cares about: teaching the gospel and preparing people for “the kingdom of God.”'

  - where: 'note 1:18 “Men who had met Him before”'
