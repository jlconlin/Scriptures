chapter: 11
claims:
  - where: when
    claim: 'Mark’s time markers put the entry on Sunday, the fig tree on Monday, the teaching in the temple on Tuesday'
    key: huntsman-chronology-final-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/appendix-b-chronology-jesuss-final-week'
    quote: 'with the triumphal entry on a Sunday (following Mark 11:1); the cursing of the fig tree on Monday (following Mark 11:12); his teaching in the temple on Tuesday (following 11:20)'
  - where: when
    claim: 'Bethany, two miles from Jerusalem on the slope of Olivet, where Jesus stayed during Holy Week'
    key: bd-bethany
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethany?lang=eng'
    quote: 'Village two miles from Jerusalem, on the southeast slope of Olivet; the home of Lazarus, Mary, and Martha (John 11:1–46; 12:1) and of Simon (Mark 14:3); the village in which our Lord stayed during Holy Week'
  - where: setting
    claim: 'The entry opens the third act of Mark, the climax in Jerusalem'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'The earliest account of the triumphal entry comes from Mark, which begins that Gospel’s “third act,” the climax in Jerusalem with what was, in effect, a prophetic enactment demonstrating that he was the true King of Israel.'
  - where: setting
    claim: 'Mark’s day markers gave rise to the earliest Holy Week calendar'
    key: huntsman-chronology-final-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/appendix-b-chronology-jesuss-final-week'
    quote: 'This is, in fact, the very schema that apparently gave rise to the earliest Christian liturgical calendar of Holy Week with Palm Sunday a week before Easter'
  - where: setting
    claim: 'Matthew and Luke put the clearing on the day of the entry, Mark on the next day; John at the start of the ministry; possibly two clearings'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Matthew and Luke place it on Palm Sunday after the triumphal entry while Mark places it on the following day (“on the morrow,” Mark 11:12). On the other hand, John situates the cleansing at the beginning of Christ’s ministry. It is possible that Jesus cleansed the temple twice'
  - where: setting
    claim: 'Bethany two miles from Jerusalem, where Jesus stayed that week'
    key: bd-bethany
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethany?lang=eng'
    quote: 'Village two miles from Jerusalem, on the southeast slope of Olivet'
  - where: thread
    claim: 'Mark frames the temple incident with the fig tree: a fruitless leadership, a temple soon destroyed'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'by framing the temple incident with the tree’s cursing and its withering, Mark creates a tightly designed structure that emphasizes that because the Jerusalem leadership of Jesus’s day was fruitless—not practicing the justice, mercy, and holiness the Lord required—the temple would soon be destroyed.'
  - where: thread
    claim: 'The rulers’ question about “these things” refers to the entry and the clearing of the temple'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'no doubt referring to the triumphal entry and, particularly, his cleansing of the temple, an act that attacked their own authority in the temple'
  - where: 'note 11:2 “A colt never ridden”'
    claim: 'The unridden colt in Mark and Luke reflects the Septuagint of Zechariah 9:9, “a new donkey”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Mark and Luke may support this when they add that Jesus specifically requests a donkey that had never been ridden (Mark 11:2; Luke 19:30), a detail based on the Septuagint, or Greek translation, of Zechariah 9:9: “Your king comes to you . . . riding on a new donkey.”'
  - where: 'note 11:2 “A colt never ridden”'
    claim: 'Mark, with Luke and John, omits the she-ass that Matthew stresses as fulfilling Zechariah 9:9'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/11.htm'
    quote: 'St. Mark, with St. Luke and St. John, omits the mention of the “she-ass” bound with the colt, on which St. Matthew lays stress as a literal fulfilment of Zechariah 9:9.'
  - where: 'note 11:2 “A colt never ridden”'
    claim: 'The entry was no accident: He knew beforehand; He rode an ass in token of peace'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'He knew beforehand what would be, and what He would do. It was no meaningless pageantry … He came riding on an ass, in token of peace'
  - where: 'note 11:4 “Where two ways met”'
    claim: 'amphodon: properly a road round anything, a street; only here in the New Testament'
    key: thayer
    url: 'https://biblehub.com/greek/296.htm'
    quote: 'ἀμφόδον, , τό (ἀμφί, ὁδός), properly, a road round anything, a street'
  - where: 'note 11:4 “Where two ways met”'
    claim: 'The colt was outside the courtyard, at the crossroads; the detail is characteristic of Mark'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/11.htm'
    quote: 'Each touch is characteristic of St. Mark, and implies personal observation on the part of his informant. The colt was at the door—outside, not inside, the court-yard'
  - where: 'note 11:9 “Hosanna”'
    claim: 'Hosanna means “save now,” from Psalm 118:25, a psalm of the Hallel; chanted at Tabernacles with palm branches'
    key: bd-hosanna
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosanna?lang=eng'
    quote: 'Save now. The word is taken from Ps. 118:25, one of the Psalms of the Hallel. The chanting of this psalm was connected at the Feast of Tabernacles with the waving of palm branches'
  - where: 'note 11:9 “Hosanna”'
    claim: 'Psalm 118 closed the Passover Hallel and was sung in processions approaching the temple; hosanna an Aramaic form; “Blessed is he” from 118:26'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Psalm 118, which is the last of what came to be known as the Egyptian Hallel, a group of religious songs (Pss 113–18) that was sung as part of the celebration of Passover. Originally, however, Psalm 118 appears to have been used in liturgical processions, sung as worshippers approached the temple.[6] This makes the timing, in the days before Passover, and the occasion, as Jesus approached Jerusalem to ascend to the temple, significant.'
  - where: 'note 11:9 “Hosanna”'
    claim: 'Hosanna an Aramaic form of the Hebrew of Psalm 118:25'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'When the crowds cried “Hosanna!” they were using an Aramaic form of the Hebrew hôšîʿânnāʾ from Psalm 118:25, which means “save now” (KJV) or “save us, we beseech you” (NRSV).'
  - where: 'note 11:9 “Hosanna”'
    claim: 'The crowds may have been chiefly His own disciples'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'All four Gospels paint a similar picture of crowds—though perhaps these were just the excited, gathered disciples of Jesus—welcoming Jesus into the holy city'
  - where: 'note 11:9 “Hosanna”'
    claim: 'Garments and foliage spread to carpet the way as for a king'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'they spread out their garments, and cast palm fronds and other foliage in His path, thus carpeting the way as for the passing of a king'
  - where: 'note 11:9 “Hosanna”'
    claim: 'Mark’s word for branches means leafy boughs forming a litter'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/11.htm'
    quote: 'The Greek word for “branches” is used by St. Mark only. It describes the leafy boughs forming, as they were thrown down, a kind of litter or matting, rather than the woody branches.'
  - where: 'note 11:10 “The kingdom of our father David”'
    claim: 'Only Mark has the blessing on the kingdom as well as the king'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/11.htm'
    quote: 'The shout of blessing for the kingdom as well as for the king, is another touch by which St. Mark’s record is distinguished from the others.'
  - where: 'note 11:10 “The kingdom of our father David”'
    claim: 'Matthew and John make the acclamation more explicitly royal'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Matthew and John, however, vary the crowd’s acclamation to make it more explicitly a royal acclamation.'
  - where: 'note 11:10 “The kingdom of our father David”'
    claim: 'The entry a prophetic sign showing Jesus the Son of David, rightful king'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Drawing upon Zechariah 9 and Psalm 118, the triumphal entry illustrated that Jesus was the Son of David, the rightful king of Israel.'
  - where: 'note 11:10 “The kingdom of our father David”'
    claim: 'Earlier He had suppressed popular acclaim; now the acceptance of kingly and Messianic titles was an open proclamation'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Even the intimation that He was the Christ had been made with guarded care, if at all; and every manifestation of popular regard in which He might have figured as a national leader had been suppressed. … the public acceptance of the nation’s homage, and the acknowledgment of both kingly and Messianic titles, constituted an open and official proclamation of His divine investiture.'
  - where: 'note 11:10 “The kingdom of our father David”'
    claim: 'No move was made to stop Him: the Romans saw no threat, the leaders feared an uproar'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'the Romans apparently did not think that this spontaneous action was much of a threat, whereas the Jewish leadership, recognizing the popularity of Jesus, was hesitant to cause an uproar among the people by arresting Jesus publicly'
  - where: 'note 11:11 “He looked round about upon all things”'
    claim: 'Eventide included the hours before sunset; the procession had been slow'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/11.htm'
    quote: 'The word “eventide” is somewhat indefinite, but it included the two or three hours before sunset, as well as after. The procession, if it started in the morning, had probably been delayed by frequent halts'
  - where: 'note 11:11 “He looked round about upon all things”'
    claim: 'Mark has Jesus only look around, and delays the temple incident to the next day for symbolic reasons'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Mark’s account has Jesus enter Jerusalem, ascend to the temple, and simply look around before returning to Bethany to spend the night. While Mark delays his discussion of the temple incident until the next day for symbolic reasons'
  - where: 'note 11:11 “He looked round about upon all things”'
    claim: 'Jesus returned each night to Bethany, presumably to the family of Lazarus'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'returning each night to Bethany, where he presumably stayed with friends like the family of Lazarus'
  - where: 'note 11:13 “The time of figs was not yet”'
    claim: 'Springtime, too early for fruit; the only destructive miracle; an enacted parable; fig tree a symbol of unfruitful Israel; leaves deceiving from a distance'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'even though it was springtime and too early to expect fruit.[2] Second, it is the only example of a “destructive” miracle in the Gospels … Instead, the incident is best seen as another prophetic act, or, as Julie Smith terms it, an “enacted parable,” meant to teach a lesson.'
  - where: 'note 11:13 “The time of figs was not yet”'
    claim: 'The fig tree a prophetic symbol of Israel when unfruitful; in early leaf at Passover, an appearance that deceived'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'figs and the fig tree serve as symbols for Israel among the Old Testament prophets, particularly when God’s people were not fruitful (Jer 8:13; 24:1‒10; Hos 9:10, 16‒17; Mic 7:1‒6). The fig tree, which would have been in early leaf by Passover, could give the impression from a distance that it should have fruit'
  - where: 'note 11:13 “The time of figs was not yet”'
    claim: 'Explanations of why fruit might be expected out of season go back to the speculations of nineteenth-century lives of Christ'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Although there have been well-intentioned efforts to explain why Jesus might have expected fruit to be on the tree out of season (see, for example, James E. Talmage, Jesus the Christ, 491–92, 503, which was in turn based upon the wishful speculations of nineteenth-century authors'
  - where: 'note 11:13 “The time of figs was not yet”'
    claim: 'The fruitless are the leadership and its institutions, not the Jewish people'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'it is not all Israel—or, in this case, the Jewish people at the time of Jesus—that are not bringing forth fruit, but rather their leadership and the institutions that they were wrongly controlling'
  - where: 'note 11:15 “The temple inside the fig tree”'
    claim: 'Mark delays the withering to the next morning, so the curse and its fulfillment frame the temple incident: an intercalation'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'The curse and its fulfillment then serve as frames for the only episode that Mark places between them—namely, Jesus’s casting out of the merchants and moneychangers from the temple. The technical term for this kind of framing is intercalation, a literary device common in Mark’s Gospel.'
  - where: 'note 11:15 “The temple inside the fig tree”'
    claim: 'In Matthew and Luke a cleansing by the rightful king; framed by the fig tree in Mark, a prophetic act foreshadowing the casting down of the temple stones'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Framed by the fig tree’s symbolism in Mark, however, the incident is primarily an enacted sign or prophetic act, whereby the overturning of the tables becomes a type of casting down of the temple stones in Jesus’s subsequent prophecy about the destruction of the temple (see Mark 13:2).'
  - where: 'note 11:15 “The temple inside the fig tree”'
    claim: 'Within forty years the temple and Jerusalem were destroyed by the Romans'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'like the fig tree that did not bring forth fruit when the Lord looked for it, within forty years the temple and Jerusalem would be destroyed by the Romans.'
  - where: 'note 11:15 “The temple inside the fig tree”'
    claim: 'Mark moved the temple incident from Sunday to Monday to set it between the cursing and the withering'
    key: huntsman-chronology-final-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/appendix-b-chronology-jesuss-final-week'
    quote: 'A clear example of this is Mark’s transposition of the temple incident from Sunday to Monday, where he places it between the cursing and withering of the fig tree (Mark 11:12–25).'
  - where: 'note 11:15 “Moneychangers and doves”'
    claim: 'The temple tax had to be paid in Tyrian shekels, which set up a market for animals and exchange'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'The temple priests required that payment specifically be made in the Tyrian shekel[4] rather than in coinage from each person’s country.'
  - where: 'note 11:15 “Moneychangers and doves”'
    claim: 'Herod put the shops below the temple court; by Jesus’s day some business had moved up onto the platform, renting space in the Court of the Gentiles'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Herod the Great placed shops and places designed for these business exchanges below the temple courtyard during the reconstruction.[9] By the time of Jesus’s ministry, some of this business had moved up onto the temple platform.'
  - where: 'note 11:15 “Moneychangers and doves”'
    claim: 'Merchants rented stalls in the Court of the Gentiles, probably benefiting the temple stewards'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Merchants rented out space for their stalls and shops within the Court of the Gentiles, helping worshippers to ensure correct coinage and animals, while also probably financially benefiting the temple stewards.'
  - where: 'note 11:15 “Moneychangers and doves”'
    claim: 'Doves were the poor’s offering; one record has the price of a pair of doves raised twenty-five times'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'one record states that the price of a pair of doves had increased to one gold dinar, which equates to twenty-five times the normal price … the point of offering doves as an acceptable sacrifice was to lessen the financial cost for the poor, not increase it (Leviticus 1:14–17; 5:7; 12:8).'
  - where: 'note 11:16 “No vessel through the temple”'
    claim: 'The vessels probably the implements of traffic; men used the courts as a short cut'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/11.htm'
    quote: 'Peculiar to St. Mark. The vessels referred to included, probably, the baskets and other common implements of traffic. Men were using the courts of the Temple as a short cut from one part of the city to another.'
  - where: 'note 11:16 “No vessel through the temple”'
    claim: 'People used the courtyard as a thoroughfare; what the prohibition meant is unknown; skeuos can mean any object'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'It is unknown what Jesus was referring to when he prohibited the carrying of vessels. Snodgrass noted that the Greek word σκεῦος, used here for “vessels,” “can be used of an object, a thing, or property as well as a container.”'
  - where: 'note 11:17 “A house of prayer for all nations”'
    claim: 'Isaiah 56:7 promises that strangers will be brought to the Lord’s house of prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/56?lang=eng'
    quote: 'Even them will I bring to my holy mountain, and make them joyful in my house of prayer: their burnt offerings and their sacrifices shall be accepted upon mine altar; for mine house shall be called an house of prayer for all people.'
  - where: 'note 11:17 “A house of prayer for all nations”'
    claim: 'Mark alone among the Synoptics keeps “for all nations”'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'While Mark alone among the Synoptics stressed that the temple was to be “a house of prayer for all nations” (11:17; emphasis added)'
  - where: 'note 11:17 “A house of prayer for all nations”'
    claim: 'The Court of the Gentiles, the outermost court, was the only one open to Gentiles; the markets were likely there'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Finally, the outermost court, or the Court of the Gentiles, was open to any Jew and Gentile, save for menstruating women,[16] that desired entry.'
  - where: 'note 11:17 “A house of prayer for all nations”'
    claim: 'The markets were likely located in the Court of the Gentiles'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'the outermost court, or the Court of the Gentiles, is likely where these markets were located.'
  - where: 'note 11:17 “A den of thieves”'
    claim: 'Jeremiah 7:11 is the source of “den of robbers”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng'
    quote: 'Is this house, which is called by my name, become a den of robbers in your eyes? Behold, even I have seen it, saith the Lord.'
  - where: 'note 11:17 “A den of thieves”'
    claim: 'lēstēs is a robber or bandit, not a thief by stealth'
    key: thayer
    url: 'https://biblehub.com/greek/3027.htm'
    quote: 'a robber; a plunderer, freebooter, brigand … (Not to be confounded with κλέπτης thief, one who takes property by stealth (although the distinction is obscured in A. V.)'
  - where: 'note 11:17 “A den of thieves”'
    claim: 'lēistai can mean usurpers or insurrectionists; the priestly authorities had corrupted the worship'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'because the priestly authorities were acting like usurpers or insurrectionists—another meaning of the word lēistai, traditionally translated as “thieves,” which we have rendered as “bandits”—they had corrupted the worship taking place under their direction in the temple.'
  - where: 'note 11:17 “A den of thieves”'
    claim: 'Jeremiah’s words warn against ritual without repentance; Jeremiah 7:6 on the stranger, fatherless and widow'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'By reiterating Jeremiah’s words, Jesus reminded his listeners that there is danger in “ritual without accompanying repentance and good deeds.”'
  - where: 'note 11:23 “Saying unto this mountain”'
    claim: 'The mountain may be the Temple Mount or the Mount of Olives (Zech. 14:4); the context favors the Temple Mount'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the mountain “pulled up and cast into the sea” could be either the Temple Mount, which will soon be overthrown, or the Mount of Olives … Because many prophetic words and actions can have multiple applications, both are possible, but Jesus’s subsequent admonition regarding prayer makes the former particularly significant'
  - where: 'note 11:23 “Saying unto this mountain”'
    claim: 'The greatest fruit required is belief'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'The greatest “fruit” required is belief, and Jesus promises that if they have faith, they can do seemingly impossible things (Mark 11:22‒24; parallel Matt 21:21‒22).'
  - where: 'note 11:23 “Saying unto this mountain”'
    claim: 'The Lectures on Faith read faith as the principle of power, citing the mountain Zerin'
    key: lectures-on-faith-1
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-1'
    quote: 'Moroni, while abridging and compiling the record of his fathers, gave us the following account of faith as the principle of power. … And it was by faith that the mountain Zerin was removed when the brother of Jared spake in the name of the Lord.'
  - where: 'note 11:23 “Saying unto this mountain”'
    claim: 'Men spoke by faith in the name of God, and mountains removed'
    key: lectures-on-faith-1
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-1'
    quote: 'So with men also, they spake by faith in the name of God and the sun stood still, the moon obeyed, mountains removed, prisons fell'
  - where: 'note 11:23 “Saying unto this mountain”'
    claim: 'Ether 12:30: the brother of Jared said to the mountain Zerin, Remove'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12?lang=eng'
    quote: 'For the brother of Jared said unto the mountain Zerin, Remove—and it was removed. And if he had not had faith it would not have moved'
  - where: 'note 11:24 “Believe that ye receive”'
    claim: 'Prayer brings the will of the Father and of the child into correspondence; it does not change God’s will'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Prayer is the act by which the will of the Father and the will of the child are brought into correspondence with each other. The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant'
  - where: 'note 11:24 “Believe that ye receive”'
    claim: 'The risen Lord’s promise to the Nephites adds “which is right”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/18?lang=eng'
    quote: 'And whatsoever ye shall ask the Father in my name, which is right, believing that ye shall receive, behold it shall be given unto you.'
  - where: 'note 11:25 “Forgive when you pray”'
    claim: 'Even with the temple destroyed, faithful prayer avails, and with mercy forgiveness comes'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Jesus seems to be suggesting that even when the fig tree is withered and the temple is destroyed, those who have faith can still pray efficaciously. If such prayer is accompanied by mercy, then forgiveness will come even when the place where ritual atonement had been performed no longer stands.'
  - where: 'note 11:25 “Forgive when you pray”'
    claim: 'D&C 64:9: he that forgiveth not standeth condemned; the greater sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'Wherefore, I say unto you, that ye ought to forgive one another; for he that forgiveth not his brother his trespasses standeth condemned before the Lord; for there remaineth in him the greater sin.'
  - where: 'note 11:28 “By what authority?”'
    claim: 'Chief priests, scribes and elders: the groups of the Sanhedrin, the same three named in the first passion prediction'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'These were the main groups that made up the Sanhedrin, the council that not only served as the supreme Jewish law court but also the chief civil body under the Roman occupation. Significantly, these are the very three groups that Jesus mentioned in his first passion prediction'
  - where: 'note 11:28 “By what authority?”'
    claim: 'Who the chief priests, scribes and elders were'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the chief priests, who would have included the current high priest, earlier holders of that position, and perhaps the heads of the leading priestly families; the scribal experts on the law, including important Pharisees; and the elders of the people, who represented the lay nobility'
  - where: 'note 11:28 “By what authority?”'
    claim: '“These things” were the entry and the clearing, which attacked their own authority'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'no doubt referring to the triumphal entry and, particularly, his cleansing of the temple, an act that attacked their own authority in the temple'
  - where: 'note 11:28 “By what authority?”'
    claim: 'The rulers were guardians of the temple; they had resolved overnight to challenge His authority'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'They had been debating about Him over night, and had resolved on at least one step; they would challenge His authority for what He had done the day before. They were the guardians of the temple'
  - where: 'note 11:28 “By what authority?”'
    claim: 'The leaders questioned His authority rather than the necessity of His actions; He was not arrested'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Possibly self-convicted of being exposed for not fulfilling their own duty to uphold the sanctity of the temple, the Jewish leaders questioned Jesus’s authority[34] rather than debated the necessity of his actions.'
  - where: 'note 11:28 “By what authority?”'
    claim: 'He exposed the market and challenged the authority of those who allowed it'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'In a matter of a few moments, Jesus publicly exposed the hypocrisy and exploitation of the markets while also challenging the authority of those who allowed it.'
  - where: 'note 11:30 “The baptism of John”'
    claim: 'Countering a question with a question was the rulers’ own method; their question had a sinister purpose'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'Jesus did not condescend to voice an answer in which they could possibly find further excuse for antagonizing Him; but He availed Himself of a method very common among themselves—that of countering one question with another.'
  - where: 'note 11:30 “The baptism of John”'
    claim: 'If John’s baptism was of God, they would be asked why they did not accept John’s testimony of Jesus; no attempt to find the truth'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'no mention is made of any attempt to ascertain the truth and reply accordingly … Should they answer that John’s baptism was of God, Jesus would probably demand of them why then they had not believed in the Baptist, and why they did not accept John’s testimony concerning Himself.'
  - where: 'note 11:30 “The baptism of John”'
    claim: 'John, whom they had rejected, had been popular with the people'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Jesus easily parries, asking instead a question about the authority of John the Baptist, whom they had rejected but, like Jesus, had been popular with the people.'
  - where: 'note 11:30 “The baptism of John”'
    claim: 'After the counter-question Jesus goes on the offensive with the parable of the vineyard'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'After answering their question with a question of his own, Jesus goes on the offensive in the form of a parable (Mark 12:1–12; parallels Matt 21:33–46; Luke 20:9–19).'
  - where: 'note 11:17 “A house of prayer for all nations”'
    claim: 'Worshippers passed through courts toward the sanctuary; inner courts restricted'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'The temple platform consisted of various areas or courts that worshippers would pass through as they moved closer to the sanctuary that housed God’s presence.'
  - where: 'note 11:30 “The baptism of John”'
    claim: 'The people revered the martyred Baptist as a prophet'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'should they aver that John had no divine authority to preach and baptize, the people would turn against them, for the martyred Baptist was revered by the masses as a prophet.'
  - where: 'note 11:30 “The baptism of John”'
    claim: 'In the parable of the vineyard the owner is God and the son is Jesus'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Hence, the owner was God, the son is Jesus, and the previous servants were the prophets whom the Lord had sent to Israel.'
  - where: thread
    claim: 'In the parable of the vineyard the son is Jesus'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Hence, the owner was God, the son is Jesus, and the previous servants were the prophets whom the Lord had sent to Israel.'
  - where: 'note 11:15 “The temple inside the fig tree”'
    claim: 'The Jerusalem leadership was fruitless, not practising the justice, mercy and holiness the Lord required'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the Jerusalem leadership of Jesus’s day was fruitless—not practicing the justice, mercy, and holiness the Lord required—the temple would soon be destroyed'
  - where: christ
    claim: 'Our lives should produce fruits; insincere worship is rejected'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'our lives, too, should produce the fruits by which we should be known (Matt 3:8; 7:16‒20). If we are not sincere in our worship'
  - where: christ
    claim: 'D&C 64:10, of you it is required to forgive all men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men.'
  - where: explore
    claim: 'The article sets out the background of the cleansing in the four Gospels'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'This article explores the contextual background of Christ’s cleansing of the temple as recorded in the four Gospels.'
