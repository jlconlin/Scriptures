chapter: 3
claims:
  - where: setting
    claim: 'Mark organizes his Gospel by type of material (miracles, controversies, parables), not by chronology'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark has a tendency to organize the Gospel by the type of material (miracles, controversies, parables),[11] not by theme (faith, patience, repentance), or, as we might expect, by chronology.'
  - where: setting
    claim: 'The grain plucked and the withered hand are two Sabbath controversies told back to back in all three Synoptic Gospels'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'two striking accounts of Sabbath controversies are found in all three of the Synoptic Gospels and are given back-to-back. These accounts are (1) the story of Jesus and the Apostles picking grain on the Sabbath (Matthew 12:1–8; Mark 2:23–28; Luke 6:1–5) and (2) the story of the man with a withered hand'
  - where: setting
    claim: 'Only Mark records that His family thought He had lost His mind; Matthew and Luke omit it'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'In Mark 3:20–21, Mark records that Jesus’ own family thought that he had lost his mind.[34] Matthew omits the reference (see Matthew 12:24–29), as does Luke.'
  - where: setting
    claim: 'The controversy about Satan (3:22–30) is surrounded by references to Jesus’s family (3:20–21, 31–35), one of Mark’s sandwiches'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'A controversy about Satan (Mark 3:22–30) is surrounded by references to Jesus’ family (Mark 3:20–21, 31–35).'
  - where: thread
    claim: 'A Markan sandwich asks the reader to understand the center story in light of what surrounds it'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark frequently “sandwiches” a story between two other sections of text with the goal of encouraging the audience to understand the center story in light of its surrounding material.'
  - where: thread
    claim: 'Satan’s minions recognized Jesus, but the religious authorities did not'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'The minions of Satan recognized and knew who Jesus was, but the religious authorities did not. The scribes, Pharisees, and Sadducees wanted only to rid themselves of Him.'
  - where: 'note 3:4 “Healing on the Sabbath, and a question turned back”'
    claim: 'Saving life on the Sabbath was unquestionably acceptable; healing a chronic condition was not clearly approved, and first-century Pharisees very likely considered it forbidden'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This act seems to have been viewed as helping someone with a chronic condition rather than as saving life on the Sabbath, the latter of which would have been unquestionably acceptable. … it is very likely that Pharisees in the first century would have considered healing such ailments forbidden on the Sabbath'
  - where: 'note 3:4 “Healing on the Sabbath, and a question turned back”'
    claim: 'No early source other than the Gospels says healing as such was forbidden, but it is not clear it was approved'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'There are no pre-Tannaitic sources other than the Gospels that say healing per se was forbidden on the Sabbath, but it is also not clear that it was approved Sabbath activity.'
  - where: 'note 3:4 “Healing on the Sabbath, and a question turned back”'
    claim: 'Jesus expands “lifesaving” to changing the quality of life of one with a chronic condition; the Pharisees’ plot is a sad irony'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Jesus seems to be expanding the sense of “lifesaving” to include changing the quality of life of one with a chronic condition. … It is a sad irony that the Pharisees responded to Jesus’s doing good and saving a life by counseling with the Herodians on how to destroy him.'
  - where: 'note 3:5 “Anger and grief in one look”'
    claim: 'Pōrōsis is properly the covering with a callus; figuratively dulled perception; of the heart, stubbornness'
    key: thayer
    url: 'https://biblehub.com/greek/4457.htm'
    quote: 'properly, the covering with a callus; tropically, obtuseness of mental discernment, dulled perception … τῆς καρδίας (hardening of heart), of stubbornness, obduracy, Mark 3:5'
  - where: 'note 3:5 “Anger and grief in one look”'
    claim: 'Mark often names Jesus’s emotions, including anger and grief at 3:5; Matthew and Luke frequently omit them'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'References to Jesus’ emotions in Mark’s Gospel include … 3:5 (anger and grief); 6:6 (amazement); 6:34 (compassion); … 10:21 (love); and 14:34 (sorrow). While Mark shows Jesus experiencing a wide range of emotions, Matthew and Luke will frequently omit these references.'
  - where: 'note 3:5 “Anger and grief in one look”'
    claim: 'Mark is more comfortable showing Jesus’s human side; for Latter-day Saints it matters that Jesus had divine and human aspects in mortality'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'he seems to be more comfortable with stories that show the “human” side of Jesus than the other writers are. From a Latter-day Saint perspective, it is theologically important to maintain that Jesus had both divine and human aspects during mortality'
  - where: 'note 3:4 “Healing on the Sabbath, and a question turned back”'
    claim: 'The Herodians were a political party supporting the Herodian family, somewhat opposed to Roman rule and to the Pharisees'
    key: bd-herodians
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herodians?lang=eng'
    quote: 'A political party among the Jews, supporters of the Herodian family, and therefore to some extent in opposition to the Roman government, and also to the Pharisees who were in favor of a purely religious theocracy (Matt. 22:16; Mark 3:6; 12:13).'
  - where: 'note 3:12 “Why silence the spirits who knew Him?”'
    claim: 'Jesus forbade the demons to proclaim Him because He did not want demonic testimony to His messiahship'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Jesus forbade the demons to proclaim who He was (see Mark 1:25, 34; 3:12), but that is understandable. He did not want demonic testimony to His messiahship.'
  - where: 'note 3:12 “Why silence the spirits who knew Him?”'
    claim: 'Some of the most exalted titles in Mark come from unclean spirits, part of Mark’s irony'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Perhaps it is part of Mark’s extensive use of irony that many of the most exalted titles applied to Jesus are used either by demons or in mockery … Some of the most compelling Christological titles come from the unclean spirits (see Mark 1:24; 3:11; and 5:7).'
  - where: 'note 3:12 “Why silence the spirits who knew Him?”'
    claim: 'The requests for silence are most likely tied to His wish that before His death people not be misled about what it means to be a Messiah'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus’ requests for people not to preach about his healing miracles is most likely tied to his desire that, before his death, he did not want people to be misled about what it means to be a Messiah.'
  - where: 'note 3:14 “Ordained to be with Him, and to be sent”'
    claim: 'Poieō with a person and a purpose clause means to appoint or ordain; Mark 3:14 is the example'
    key: thayer
    url: 'https://biblehub.com/greek/4160.htm'
    quote: 'τινα, ἵνα with the subjunctive to appoint or ordain one that etc. Mark 3:14.'
  - where: 'note 3:14 “Ordained to be with Him, and to be sent”'
    claim: 'Apostle means one sent forth; the Twelve were chosen and ordained to be His closest disciples and sent forth to represent Him; special witnesses; the Quorum of the Twelve today'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'The word means “one sent forth.” It was the title Jesus gave (Luke 6:13) to the Twelve whom He chose and ordained (John 15:16) to be His closest disciples during His ministry on earth and whom He sent forth to represent Him after His Ascension into heaven.'
  - where: 'note 3:14 “Ordained to be with Him, and to be sent”'
    claim: 'The calling of an Apostle is to be a special witness of Christ’s divinity and resurrection; twelve men hold it today'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'The calling of an Apostle is to be a special witness of the name of Jesus Christ in all the world, particularly of His divinity and of His bodily resurrection from the dead … Today twelve men with this same divine calling and ordination constitute the Quorum of the Twelve Apostles'
  - where: 'note 3:14 “Ordained to be with Him, and to be sent”'
    claim: 'He sent the disciples out to do what He had done, with authority to heal and cast out demons (3:14; 6:7, 13)'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Later, He sent His disciples out to accomplish the same things He had, giving them authority to heal the sick and cast out demons (see Mark 3:14; 6:7, 13).'
  - where: 'note 3:17 “Sons of thunder”'
    claim: 'Boanerges, sons of thunder, a surname given to James and John probably for the intensity of their character'
    key: bd-boanerges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/boanerges?lang=eng'
    quote: 'Sons of thunder. Surname given by our Lord to James and John, sons of Zebedee, probably on account of the intensity of their character (Mark 3:17; see also Mark 9:38; 10:37; Luke 9:54).'
  - where: 'note 3:17 “Sons of thunder”'
    claim: 'The Semitic behind Boanerges; regesh a tumultuous crowd; the name suggests fiery zeal like a thunderstorm, with reference to Luke 9:54'
    key: thayer
    url: 'https://biblehub.com/greek/993.htm'
    quote: 'רֶגֶשׁ, in Psalm 55:15 a tumultuous crowd, seems in Syriac to have signified thunder; so that the name Βοανηργές seems to denote fiery and destructive zeal that may be likened to a thunderstorm, and to make reference to the occurrence narrated in Luke 9:54.'
  - where: 'note 3:17 “Sons of thunder”'
    claim: 'Only Mark keeps Boanerges; Matthew and Luke omit it'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'See Mark 3:17 (“Boanerges, which is, The sons of thunder”; omitted in Matthew 10:2 and Luke 6:14)'
  - where: 'note 3:17 “Sons of thunder”'
    claim: 'Peter means rock; his Aramaic name Cephas was given him by the Lord at his first call (John 1:40–42)'
    key: bd-peter
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/peter?lang=eng'
    quote: 'Rock. … His Aramaic name, Cephas, of which Peter is the Greek equivalent, was given him by the Lord (John 1:40–42).'
  - where: 'note 3:18 “The Cananean, Thaddaeus, and Iscariot”'
    claim: 'Canaanite should be Cananean, from Aramaic Kanan = Greek Zelotes; the Zealots were zealous for the law and resisted foreign rule'
    key: bd-zelotes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zelotes?lang=eng'
    quote: 'Matthew and Mark in their lists call him “the Cananean” (not Canaanite as in the KJV), which is formed from an Aramaic word (Kanan), of which Zelotes is the Greek and Zealot the English equivalent. The Zealots were a party among the Jews (so called from their zeal for the law) who were determined to resist Roman or any foreign authority in Palestine.'
  - where: 'note 3:18 “The Cananean, Thaddaeus, and Iscariot”'
    claim: 'The word refers to Simon’s political attachments, not his lineage or place of origin'
    key: bd-canaanite
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/canaanite?lang=eng'
    quote: 'the word should be Cananean rather than Canaanite; it has reference to his political attachments rather than his lineage or geographical point of origin.'
  - where: 'note 3:18 “The Cananean, Thaddaeus, and Iscariot”'
    claim: 'Judas (son or brother) of James is probably the same as Thaddaeus'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: '“Not Iscariot,” one of the Twelve, also called Judas (son or brother) of James (Luke 6:16; John 14:22; Acts 1:13); probably the same as Lebbaeus or Thaddaeus (Matt. 10:3; Mark 3:18).'
  - where: 'note 3:18 “The Cananean, Thaddaeus, and Iscariot”'
    claim: 'Iscariot means “belonging to Kerioth” in Judah; the only one of the Twelve not a Galilean'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: 'Iscariot, meaning “belonging to Kerioth” (Josh. 15:25) in the tribe of Judah, one of “the twelve,” and the only one who was not a Galilean.'
  - where: 'note 3:21 “His own family”'
    claim: '“Hoi par’ autou” means one’s family, kinsmen, relations, at Mark 3:21'
    key: thayer
    url: 'https://biblehub.com/greek/3844.htm'
    quote: 'οἱ παῥ αὐτοῦ, those of one''s family, i. e. his kinsmen, relations, Mark 3:21'
  - where: 'note 3:21 “His own family”'
    claim: 'The verse more likely refers to family, not friends; “beside himself” means out of his mind'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'This verse more likely refers to family, not friends; the end of the verse implies that Jesus is “out of his mind.”'
  - where: 'note 3:21 “His own family”'
    claim: 'Mark has a higher tolerance than Matthew and Luke for material that might seem embarrassing'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'In general, Mark seems to have a much higher tolerance for material that might be perceived as embarrassing; Matthew and Luke tend to omit this material.'
  - where: 'note 3:21 “His own family”'
    claim: 'Kinsmen set out to stop His public activities by force; some of Mary’s household failed to understand His work; His brethren did not believe (John 7:5)'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'some members of Mary’s household had failed to understand the great import of the work … some of His friends (marginal rendering, “kinsmen,”) on one occasion set out with the purpose of laying hold on Him and stopping His public activities by physical force'
  - where: 'note 3:22 “Scribes from Jerusalem, and Beelzebub”'
    claim: 'Beelzebub: a Philistine god, a title for Satan; Baalzebub in 2 Kings 1'
    key: bd-beelzebub
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beelzebub?lang=eng'
    quote: 'Name of a Philistine god. Used as a title for the “chief of the demons,” or Satan. … See also 2 Kgs. 1:1–6, where it is spelled Baalzebub.'
  - where: 'note 3:22 “Scribes from Jerusalem, and Beelzebub”'
    claim: 'The scribes, legal officials, came from Jerusalem to give a legal opinion; a legal investigation with dire implications'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'In Mark 3:22, scribes (legal officials) were brought all the way to Galilee from Jerusalem to give their legal opinion in this case. … There was not a theological debate going on, then, but a legal investigation resulting in an allegation with dire legal implications.'
  - where: 'note 3:22 “Scribes from Jerusalem, and Beelzebub”'
    claim: 'Christ drove evil spirits from bodies they had taken; He could not have done so without first subduing Satan, the strong man; no truce between them'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Christ had attacked the stronghold of Satan, had driven his evil spirits from the human tabernacles of which they had unwarrantably taken possession; how could Christ have done this had He not first subdued the “strong man,” the master of devils, Satan himself? … There could be no agreement, no truce nor armistice'
  - where: 'note 3:29 “The sin that has no forgiveness”'
    claim: 'JST Mark 3:21–25: men accuse Him of receiving sinners; sins forgiven when men repent; the blasphemer in danger of being cut down out of the world'
    key: jst-mark-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/3?lang=eng'
    quote: 'All sins which men have committed, when they repent, shall be forgiven them; for I came to preach repentance unto the sons of men. … hath never forgiveness; but is in danger of being cut down out of the world.'
  - where: 'note 3:29 “The sin that has no forgiveness”'
    claim: 'JST Mark 3:21, 23: the accusers’ question, and blasphemies forgiven those who come to Him'
    key: jst-mark-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/3?lang=eng'
    quote: 'Why do ye receive sinners, seeing thou makest thyself the Son of God. … shall be forgiven them that come unto me, and do the works which they see me do.'
  - where: 'note 3:29 “The sin that has no forgiveness”'
    claim: 'D&C 76:35: denied the Holy Spirit after having received it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'Having denied the Holy Spirit after having received it, and having denied the Only Begotten Son of the Father'
  - where: 'note 3:29 “The sin that has no forgiveness”'
    claim: 'Words against Jesus as a man might be forgiven; ascribing His power to Satan was very near blasphemy against the Holy Ghost'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Jesus was merciful in His assurance that words spoken against Himself as a Man, might be forgiven; but to speak against the authority He possessed, and particularly to ascribe that power and authority to Satan, was very near to blasphemy against the Holy Ghost'
  - where: 'note 3:31 “His mother and His brethren”'
    claim: 'The family scenes surround the controversy about Satan; the center is to be understood in light of the surrounding material'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'A controversy about Satan (Mark 3:22–30) is surrounded by references to Jesus’ family (Mark 3:20–21, 31–35).'
  - where: 'note 3:31 “His mother and His brethren”'
    claim: 'The purpose of the visit is not stated; the facts scarcely warrant assuming it was other than peaceful'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'The purpose of the desired visit is not intimated. … These facts, however, scarcely warrant the assumption that the desire of Mary and her sons to speak with him on the occasion referred to was other than peaceful.'
  - where: 'note 3:35 “Brother, and sister, and mother”'
    claim: 'Mark 3:31–35 is among the hints that Jesus had female disciples, made explicit at Mark 15:41, where the women “ministered” to Him'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'While there are hints throughout Mark’s Gospel that Jesus has female disciples (see Mark 3:31–35), the idea is not developed. But this verse tells us boldly that Jesus has had female disciples all along. Not only that, but the women “ministered” unto him.'
  - where: christ
    claim: 'Christ subdued Satan, the strong man'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'how could Christ have done this had He not first subdued the “strong man,” the master of devils, Satan himself?'
  - where: christ
    claim: 'JST: sins forgiven when men repent'
    key: jst-mark-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/3?lang=eng'
    quote: 'All sins which men have committed, when they repent, shall be forgiven them'
  - where: explore
    claim: 'Smith’s article is an overview of what is unique to Mark'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'It is difficult to analyze the material unique to Mark’s Gospel because it may be telling us more about Matthew and Luke’s editorial choices than Mark’s particular interests.'
