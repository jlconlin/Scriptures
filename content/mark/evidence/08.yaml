chapter: 8
claims:
  - where: when
    claim: 'From Tyre and Sidon Jesus went through the Decapolis to the region by the Sea of Galilee'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'They went thence into the region adjoining the sea of Galilee on the east, “through the midst of the coasts of Decapolis.”'
  - where: when
    claim: 'Dalmanutha a town on the shore of the Sea of Galilee'
    key: bd-dalmanutha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dalmanutha?lang=eng'
    quote: 'A town on the shore of the Sea of Galilee (Mark 8:10); possibly identical with or near to Magdala (Matt. 15:39).'
  - where: when
    claim: 'Caesarea Philippi, the scene of Peter’s testimony'
    key: bd-caesarea-philippi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caesarea-philippi?lang=eng'
    quote: 'The northern most point of our Lord’s journeyings, it was the scene of Peter’s testimony of the Lord’s Messiahship and divine Sonship (Matt. 16:13; Mark 8:27).'
  - where: setting
    claim: 'Dalmanutha a town on the shore, near Magdala'
    key: bd-dalmanutha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dalmanutha?lang=eng'
    quote: 'A town on the shore of the Sea of Galilee (Mark 8:10); possibly identical with or near to Magdala (Matt. 15:39).'
  - where: setting
    claim: 'Bethsaida at the northeast end of the lake; the blind man healed there'
    key: bd-bethsaida
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethsaida?lang=eng'
    quote: 'The older city was on the northeast end of the Sea of Galilee, near Capernaum … The rebuilt portion was north of the older city and apparently nearer the place where Jesus fed the 5,000 (Mark 6:45; Luke 9:10) and healed a blind man (Mark 8:22).'
  - where: setting
    claim: 'Caesarea Philippi at the foot of Mount Hermon'
    key: bd-caesarea-philippi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caesarea-philippi?lang=eng'
    quote: 'A town near the source of the Jordan, at the foot of Mount Hermon, rebuilt and enlarged by Philip, tetrarch of Trachonitis. The northern most point of our Lord’s journeyings'
  - where: setting
    claim: 'Peter’s confession divides the Gospel: from the doer of mighty deeds to the suffering Son of Man who three times predicts His Passion'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'A clear dividing point in the Gospel occurs with Peter’s declaration at Caesarea Philippi that Jesus was the Christ (see Mark 8:27–30). Immediately thereafter, the text shifts from Jesus the doer of mighty deeds (dynameis, or “miracles”) to the suffering Son of Man, who three times predicts his coming Passion'
  - where: setting
    claim: 'The predictions stand between the healing at Bethsaida and that of Bartimaeus'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Prominent between these two healings are Peter’s confession that Jesus was the Christ (8:27‒30) and the three passion predictions (8:31‒38; 9:30‒37; 10:32‒45)'
  - where: thread
    claim: 'Peter was like the blind man who had begun to see but not clearly'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Instead, Peter was like the blind man who had begun to see but not clearly; he did not yet fully understand what he saw.'
  - where: thread
    claim: 'Peter knew who Jesus was but not what He came to do'
    key: olson-we-believe
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/we-believe-are-sure'
    quote: 'Peter had come to know who Jesus was, but he did not yet understand, or accept, what he had come to do—suffer, die, and rise again for our salvation.'
  - where: 'note 8:4 “A second crowd, a second feeding”'
    claim: 'The crowds of the Decapolis, semi-pagan, gathered to Him there'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Though still among semi-pagan peoples, our Lord was greeted by great crowds, amongst whom were many lame, blind, dumb, maimed, and otherwise afflicted; and them He healed.'
  - where: 'note 8:4 “A second crowd, a second feeding”'
    claim: 'The crowds remained three days; the disciples probably remembered but did not presume to ask; the crowd dispersed quietly, unlike after the five thousand'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Rather let us believe that the disciples remembered well, yet deemed it beyond their duty or privilege to suggest a repetition of the miracle. … With no semblance of the turbulent enthusiasm that had followed the feeding of the five thousand, this multitude dispersed quietly'
  - where: 'note 8:10 “Dalmanutha”'
    claim: 'A town on the shore, possibly identical with or near Magdala'
    key: bd-dalmanutha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dalmanutha?lang=eng'
    quote: 'A town on the shore of the Sea of Galilee (Mark 8:10); possibly identical with or near to Magdala (Matt. 15:39).'
  - where: 'note 8:10 “Dalmanutha”'
    claim: 'Named by no other writer; a sign of Mark’s independence'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/8.htm'
    quote: 'St. Mark’s use of the word, instead of the Magdala or “Magada” of St. Matthew, may be noted as an instance of his independence. It is mentioned by no other writer.'
  - where: 'note 8:12 “No sign for this generation”'
    claim: 'Anastenazō: to draw sighs up from the bottom of the breast, to sigh deeply'
    key: thayer
    url: 'https://biblehub.com/greek/389.htm'
    quote: 'to draw sighs up frown the bottom of the breast, to sigh deeply: Mark 8:12.'
  - where: 'note 8:12 “No sign for this generation”'
    claim: 'JST Mark 8:12 adds the sign of Jonah, applied to the Son of Man’s burial'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'save the sign of the Prophet Jonah; for as Jonah was three days & three nights in the Whales belly, so likewise shall the son of man be buried in the bowels of the Earth. (JST Mark 8:12)'
  - where: 'note 8:12 “No sign for this generation”'
    claim: 'D&C 63 on signs and faith (the footnote to Mark 8:11 points to it)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/63?lang=eng'
    quote: 'But, behold, faith cometh not by signs, but signs follow those that believe.'
  - where: 'note 8:15 “The leaven of the Pharisees and of Herod”'
    claim: 'Leaven old dough; forbidden at Passover and in offerings, associated with corruption; in the New Testament symbolic of sin'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'It was probably forbidden because there was associated with it the idea of corruption. In the New Testament it was as a rule symbolic of sin (Matt. 16:6; Mark 8:15; Luke 12:1; 1 Cor. 5:7; Gal. 5:9)'
  - where: 'note 8:15 “The leaven of the Pharisees and of Herod”'
    claim: 'The Herodians a political party supporting Herod’s family'
    key: bd-herodians
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herodians?lang=eng'
    quote: 'A political party among the Jews, supporters of the Herodian family'
  - where: 'note 8:15 “The leaven of the Pharisees and of Herod”'
    claim: 'The words imply others besides Pharisees among the questioners of verse 11'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/8.htm'
    quote: 'The words imply the presence among the questioners of Mark 8:11 of others besides the Pharisees.'
  - where: 'note 8:15 “The leaven of the Pharisees and of Herod”'
    claim: 'The disciples took leaven for bread, perhaps as a reproof; read with Matthew, the warning was against Pharisaic and Sadducean doctrine and Herodian politics'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'They construed His words respecting leaven as a reference to bread, and possibly as a reproof for their neglect. … the Master’s warning was directed against the false doctrines of the Pharisees and those of the Sadducees, and against the political aspirations of the scheming Herodians.'
  - where: 'note 8:17 “Do ye not remember?”'
    claim: 'The footnote gives the Greek sense of verse 17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/8?lang=eng'
    quote: 'do you still have hardened hearts?'
  - where: 'note 8:17 “Do ye not remember?”'
    claim: 'He recalled the feedings so their lack of loaves would not trouble them'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'refreshed their recollection of the miracles by which the multitudes had been fed, so that their lack of loaves would not further trouble them.'
  - where: 'note 8:17 “Do ye not remember?”'
    claim: 'Mark’s disciples fail to understand (8:14–21); they are learners who repeatedly stumble'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'they don’t understand what Jesus teaches (see Mark 8:14–21); … In this Gospel, Jesus’ disciples are far from flawless; instead, they are learners who repeatedly stumble.'
  - where: 'note 8:17 “Do ye not remember?”'
    claim: 'Mark’s questions engage the audience, who ponder them'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The questions engage the audience of the Gospel as they ponder the questions themselves.'
  - where: 'note 8:23 “Spittle and the laying on of hands”'
    claim: 'Healing adapted to the man’s infirmity, as with the deaf man of 7:33; spitting only these two in the first three Gospels'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/8.htm'
    quote: 'We note in the act the same considerate adaptation of the method of healing to the man’s infirmities as in the case of the deaf man in Mark 7:33. As far as the first three Gospels are concerned, these are the two instances of the “spitting” here recorded, but it is one of the links that connect St. Mark with the fourth Gospel (John 9:6).'
  - where: 'note 8:23 “Spittle and the laying on of hands”'
    claim: 'With the deaf man the touch may have strengthened his faith and confidence'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It may be that by the finger-touch to the closed ears and to the bound tongue, the man’s faith was strengthened and his confidence in the Master’s power increased.'
  - where: 'note 8:23 “Spittle and the laying on of hands”'
    claim: 'He laid hands on the blind man in a ministration'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'He took the sightless one by the hand, led him outside the town, applied saliva to his eyes, laid hands upon him in a ministration, and asked him if he could see.'
  - where: 'note 8:24 “Healed in two stages”'
    claim: 'The only two-step miracle; Matthew and Luke omit it, perhaps from discomfort; it can be read as Jesus choosing not to heal at once'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Matthew and Luke omit this story, perhaps over discomfort at the idea that Jesus was not completely successful in his first attempt to heal the man. (Of course, it is possible to interpret this so that there is no fault with Jesus and that he, for whatever reason, chose not to instantly heal the man.)'
  - where: 'note 8:24 “Healed in two stages”'
    claim: 'Healing by stages unique; no explanation given'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'This miracle presents the unique feature of Jesus healing a person by stages; the result of the first ministration was but a partial recovery. No explanation of the exceptional circumstance is given.'
  - where: 'note 8:24 “Healed in two stages”'
    claim: 'He interpreted his blurred sight rightly; the description is natural'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/8.htm'
    quote: 'His sight was not yet clear, but he interpreted what it told him rightly. The naturalness of this description of the first impression of the restored sense strikes every reader.'
  - where: 'note 8:24 “Healed in two stages”'
    claim: 'Tēlaugōs: at a distance and clearly (Mark 8:25)'
    key: thayer
    url: 'https://biblehub.com/greek/5081.htm'
    quote: 'τηλαυγῶς, adverb (from the adjective τηλαυγής, far-shining, from τῆλε afar, and αὐγή radiance), at a distance and clearly: Mark 8:25'
  - where: 'note 8:25 “Two blind men around the road to the cross”'
    claim: 'The second act begins with this blind man and ends with Bartimaeus: an inclusio'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'This type of literary framing is called an inclusio, by which an author begins and ends a discrete portion of his or her text with the same term, motif, image, or theme.'
  - where: 'note 8:25 “Two blind men around the road to the cross”'
    claim: 'The healings are also about disciples not yet seeing who Jesus was and what He came to do'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'These miracles are not only about the blind men whose sight Jesus restored. They are also about his original disciples not initially seeing, or fully understanding, who Jesus was and what he came to do.'
  - where: 'note 8:25 “Two blind men around the road to the cross”'
    claim: 'Healing in stages a pattern for how Peter, the disciples and we gain a testimony incrementally'
    key: olson-we-believe
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/we-believe-are-sure'
    quote: 'Certainly Jesus could have healed the blind man instantly and completely, so Jesus’s healing him in stages provides a model or pattern to how Peter, the other disciples, and we ourselves can receive spiritual understanding and a complete testimony of the Savior incrementally.'
  - where: 'note 8:25 “Two blind men around the road to the cross”'
    claim: 'The disciples saw clearly after their “second” healing, the Holy Ghost at Pentecost'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'Like the disciples at Pentecost, who did not see clearly until they received their “second” healing through the bestowal of the Holy Ghost'
  - where: 'note 8:27 “Caesarea Philippi”'
    claim: 'Near the source of the Jordan at the foot of Hermon; rebuilt and enlarged by Philip'
    key: bd-caesarea-philippi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caesarea-philippi?lang=eng'
    quote: 'A town near the source of the Jordan, at the foot of Mount Hermon, rebuilt and enlarged by Philip, tetrarch of Trachonitis. The northern most point of our Lord’s journeyings'
  - where: 'note 8:27 “Caesarea Philippi”'
    claim: 'An inland city by the principal source of the Jordan; the journey gave time for confidential instruction'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'an inland city situated near the eastern and principal source of the Jordan, and near the foot of Mount Hermon. The journey afforded opportunity for special and confidential instruction to the apostles.'
  - where: 'note 8:28 “John, Elijah, or one of the prophets”'
    claim: 'Some shared Herod’s fears; few can have believed it, since John and Jesus were contemporaries'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Some people, sharing the superstitious fears of the conscience-stricken Herod Antipas, said that Jesus was John the Baptist returned to life, though such a belief could not have been entertained seriously by many, as John and Jesus were known to have been contemporaries'
  - where: 'note 8:28 “John, Elijah, or one of the prophets”'
    claim: 'None of the people’s answers held Him the Messiah; He had not met their standard of Deliverer and King'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It is significant that among all the conceptions of the people as to the identity of Jesus there was no intimation of belief that He was the Messiah. Neither by word nor deed had He measured up to the popular and traditional standard of the expected Deliverer and King of Israel.'
  - where: 'note 8:28 “John, Elijah, or one of the prophets”'
    claim: 'His ministry recalled John the preacher of repentance and Elijah the miracle worker'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'His ministry up to that point had reminded many of John the Baptist, a fearless preacher of repentance, and Elijah, a great miracle worker'
  - where: 'note 8:28 “John, Elijah, or one of the prophets”'
    claim: 'Elijah’s coming, promised in Malachi, so anticipated that some thought Jesus was he'
    key: sc-knowhy-348
    url: 'https://scripturecentral.org/knowhy/how-do-the-bible-and-book-of-mormon-help-us-understand-the-sealing-power'
    quote: 'Elijah’s coming was so highly anticipated that some in Jesus’ day who learned of the Savior’s miraculous ministry thought that He was Elijah (Matthew 16:14; Mark 8:28).'
  - where: 'note 8:29 “Thou art the Christ”'
    claim: 'First use of “Christ” by anyone in Mark since 1:1; meaning anointed one; used of king and high priest; expectation of a Davidic king; the disciples seem to have shared it; Peter like the blind man'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Literally meaning “the anointed one” (Hebrew, māšîaḥ, hence “Messiah”; Greek, Christos),[4] the title had usually been used for the anointed king of Israel or the similarly anointed high priest.'
  - where: 'note 8:29 “Thou art the Christ”'
    claim: 'First time the title is used by anyone since 1:1'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Significantly, this is the first time in Mark since the Gospel began with the words “The beginning of the gospel of Jesus Christ, the Son of God” (Mark 1:1) that the title Christ had been used by anyone in that text.'
  - where: 'note 8:29 “Thou art the Christ”'
    claim: 'Expectation of a Davidic king; the disciples seem to have shared it'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'messianic expectations at the time of Jesus focused primarily on the idea of a great king in the mode of David who would redeem Israel from her enemies … Indeed, Jesus’s subsequent conversations with Peter and the other disciples on the road to Jerusalem quickly reveal that they seem to have shared this expectation.'
  - where: 'note 8:29 “Thou art the Christ”'
    claim: 'Many looked only for deliverance from Rome; only the faithful saw the Suffering Servant of Isaiah 53'
    key: bd-messiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng'
    quote: 'But many Jews, as we learn from the Gospels, were looking only for a deliverer from the Roman power and for greater national prosperity … Only the faithful were able to see in Jesus of Nazareth the true Suffering Servant of Isa. 53, as well as the true Prophet, Priest, and King of Israel'
  - where: 'note 8:29 “Thou art the Christ”'
    claim: 'The JST of Mark 8:29 inserts “the son of the living God”'
    key: jackson-jst-new-testament
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/joseph-smiths-translation-new-testament'
    quote: 'perhaps including revising Mark 8:29 (inserting “the son of the living God”)'
  - where: 'note 8:30 “Why tell no man?”'
    claim: 'People expected a Messiah who worked miracles, healed, fed, and would cast out the Romans; Peter too; then He told Peter to tell no one'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'their conception of the Messiah was of one who worked miracles, healed the sick, fed the hungry, and ultimately would cast the Romans out of Judea.'
  - where: 'note 8:30 “Why tell no man?”'
    claim: 'The requests for silence most likely tied to His wish that people not be misled about what it means to be a Messiah'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus’ requests for people not to preach about his healing miracles is most likely tied to his desire that, before his death, he did not want people to be misled about what it means to be a Messiah.'
  - where: 'note 8:30 “Why tell no man?”'
    claim: 'Proclamation would have aggravated the rulers’ hostility and might have caused sedition; their general proclamation came after the Resurrection'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The time for a general proclamation of their testimony had not arrived, however; nor did it come until after Christ had emerged from the tomb a resurrected, immortalized Personage.'
  - where: 'note 8:30 “Why tell no man?”'
    claim: 'Proclamation would have aggravated hostility; seditious uprisings might have resulted'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'would have aggravated the hostility of the rulers, which had already become a grave interference if not an actual menace to the Savior’s ministry; and seditious uprisings against the political government of Rome might easily have resulted.'
  - where: 'note 8:31 “The Son of man must suffer”'
    claim: 'From the confession the text shifts to the suffering Son of Man, who three times predicts His Passion and suffers, dies and rises'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'the text shifts from Jesus the doer of mighty deeds (dynameis, or “miracles”) to the suffering Son of Man, who three times predicts his coming Passion (see Mark 8:31; 9:31; 10:33–34) and then suffers, dies, and rises again.'
  - where: 'note 8:31 “The Son of man must suffer”'
    claim: 'Being the Christ is not the glorious calling expected; Jesus redefines the Messiah’s role'
    key: easton-marcan-christology
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/marcan-christology-narrating-christ'
    quote: 'In many ways, being the Christ is not the glorious calling one would expect; instead, it is about suffering, sacrifice, and resurrection.'
  - where: 'note 8:31 “The Son of man must suffer”'
    claim: 'Son of Man used only by Jesus of Himself; lowliness and suffering (Mark 8:31)'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: 'used by Him in speaking of Himself but never used by anyone else in speaking of Him … (1) lowliness, humility, and suffering (Matt. 11:19; Mark 8:31; 9:31; 10:45; 14:21; Luke 7:34)'
  - where: 'note 8:31 “The Son of man must suffer”'
    claim: 'Parrēsia: openly, frankly, without concealment (Mark 8:32)'
    key: thayer
    url: 'https://biblehub.com/greek/3954.htm'
    quote: 'openly, frankly, i. e. without concealment: Mark 8:32'
  - where: 'note 8:31 “The Son of man must suffer”'
    claim: 'The openness of the announcement of apparent failure startled the disciples'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/8.htm'
    quote: 'that our Lord “spake that saying openly”—the absence of any reticence in this announcement of apparent failure was what startled the disciples'
  - where: 'note 8:33 “Get thee behind me, Satan”'
    claim: 'He turned and looked on the whole company, not Peter only'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/8.htm'
    quote: 'the graphic touch that as He rebuked Peter, He turned and looked, not on that Apostle only, but on the whole company of the disciples.'
  - where: 'note 8:33 “Get thee behind me, Satan”'
    claim: '“Satan” a forceful figure of speech; Peter counseled what Satan had tried to induce; Satan means adversary'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'In addressing Peter as “Satan,” Jesus was obviously using a forceful figure of speech, and not a literal designation … Peter was really counseling what Satan had before attempted to induce Christ to do'
  - where: 'note 8:33 “Get thee behind me, Satan”'
    claim: 'Satan: an adversary, one who places himself in another’s way'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The essential meaning attached to both Hebrew and Greek originals for our word “Satan” is that of an adversary, or “one who places himself in another’s way and thus opposes him.”'
  - where: 'note 8:33 “Get thee behind me, Satan”'
    claim: 'Phroneō with the things of God / of men: intent on what God wills (His saving purposes) and what pleases men (Mark 8:33)'
    key: thayer
    url: 'https://biblehub.com/greek/5426.htm'
    quote: 'τά τοῦ Θεοῦ and τά τῶν ἀνθρώπων, to be intent on promoting what God wills (specifically, his saving purposes), and what pleases men, Matthew 16:28; Mark 8:33'
  - where: 'note 8:33 “Get thee behind me, Satan”'
    claim: 'Peter and others saw more clearly only after the death and Resurrection'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'He did not yet understand that the Messiah must suffer and die. Only after Jesus’ death and Resurrection would he and others finally see more clearly.'
  - where: 'note 8:34 “Take up his cross”'
    claim: 'Jesus emphasizes the costs, not the benefits, of discipleship'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Note how Jesus is emphasizing the costs—not the benefits—of discipleship here. Jesus does not encourage people to follow him because they will find happiness or wealth or community, but he explains to them that being a disciple entails self-sacrifice and persecution.'
  - where: 'note 8:34 “Take up his cross”'
    claim: 'Aparneomai: breaking every link; submitting the will to the Father; crucifixion a real part of their lives'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'Both Matthew and Mark use the Greek word aparneomai, suggesting that discipleship entails the breaking of every link that ties people, even to themselves. It is about being able, like Jesus, to submit our will to the will of the Father (see Mosiah 15:7; Luke 22:42).'
  - where: 'note 8:34 “Take up his cross”'
    claim: 'Crucifixion a very real part of their lives; they understood what it cost'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'Everyone who heard Jesus compare discipleship to the cross would have understood the impact of his teaching because of their familiarity with what crucifixion cost. His teachings were more than the abstract metaphor they are to modern readers'
  - where: 'note 8:34 “Take up his cross”'
    claim: 'The condemned carried his own cross, the patibulum (crossbeam), to execution; not always'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'He records that “every criminal who goes to execution must carry his own cross on his back.”[32] Scholars now believe that the term “cross” here is a reference to only part of the cross—the patibulum, or the horizontal part of the cross, on which their arms were extended.'
  - where: 'note 8:34 “Take up his cross”'
    claim: 'Carrying the crossbeam was not required in every case'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'Other texts suggest that Plutarch may have overstated the fact when he said that everyone had to carry their cross.'
  - where: 'note 8:35 “Saving and losing one’s life”'
    claim: 'Psychē in one half of the antithesis the earthly life, in the other the blessed life of the kingdom (Mark 8:35–37)'
    key: thayer
    url: 'https://biblehub.com/greek/5590.htm'
    quote: 'designate as ψυχή in one of the antithetic members the life which is lived on earth, in the other, the (blessed) life in the eternal kingdom of God: Matthew 10:39; Matthew 16:25; Mark 8:35-37'
  - where: 'note 8:35 “Saving and losing one’s life”'
    claim: 'JST Mark 8:37: willing to lay down one’s life'
    key: jst-mark-8
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/8?lang=eng'
    quote: 'or whosoever will save his life, shall be willing to lay it down for my sake; and if he is not willing to lay it down for my sake, he shall lose it.'
  - where: 'note 8:35 “Saving and losing one’s life”'
    claim: 'The footnote at 8:37 gives JST Mark 8:39–40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/8?lang=eng'
    quote: 'Therefore deny yourselves of these, and be not ashamed of me.'
  - where: 'note 8:38 “Ashamed of Him”'
    claim: 'Moichalis figuratively faithless to God; Israel’s alliance with God likened to marriage (Mark 8:38)'
    key: thayer
    url: 'https://biblehub.com/greek/3428.htm'
    quote: 'As the intimate alliance of God with the people of Israel was likened to a marriage, those who relapse into idolatry are said to commit adultery … μοιχαλίς is figuratively equivalent to faithless to God, unclean, apostate'
  - where: 'note 8:38 “Ashamed of Him”'
    claim: 'Lehi’s dream: those ashamed because of the scoffers fell away (the footnote to Mark 8:38 points to it)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/8?lang=eng'
    quote: 'they were ashamed, because of those that were scoffing at them; and they fell away into forbidden paths and were lost.'
  - where: 'note 8:38 “Ashamed of Him”'
    claim: 'The shift from first to third person may be why the disciples did not understand the Son of Man was Jesus'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'The abrupt shift from first person in the first sentence to third person in the rest of the verse is a bit jarring; it’s easy to see from this how the disciples might not have fully understood that the Son of man was referring to Jesus himself.'
  - where: 'note 8:38 “Ashamed of Him”'
    claim: 'JST Mark 8:42–43 text'
    key: jst-mark-8
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/8?lang=eng'
    quote: 'And they shall not have part in that resurrection when he cometh.'
  - where: 'note 8:38 “Ashamed of Him”'
    claim: 'JST Mark 8:43: those who lay down their lives shall come with him, clothed with his glory'
    key: jst-mark-8
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/8?lang=eng'
    quote: 'he that layeth down his life for my sake and the gospel’s, shall come with him, and shall be clothed with his glory in the cloud, on the right hand of the Son of man.'
  - where: 'note 8:38 “Ashamed of Him”'
    claim: 'The JST heading names it the first resurrection'
    key: jst-mark-8
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/8?lang=eng'
    quote: 'People who are ashamed of Christ have no part in the first resurrection, but those willing to die for Christ will come with Him in His glory.'
  - where: christ
    claim: 'The healing in stages shows how disciples come to see Christ incrementally'
    key: olson-we-believe
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/we-believe-are-sure'
    quote: 'As their vision of Jesus sharpens and deepens in stages, so does ours in our own walk of discipleship.'
  - where: christ
    claim: 'The stepwise healing represents how the disciples progressively come to know His saving work'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'with the blind man’s healing in stages representing how they progressively come to know what his saving work was to be.'
  - where: explore
    claim: 'The chapter reads the blind man, the confession and the three predictions as the prelude to the Passion'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'It begins with the story of Jesus’s healing of a blind man in stages, in which the healed man can represent the disciples’ imperfect understanding of who Jesus was and what he came to do.'
