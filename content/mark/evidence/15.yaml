chapter: 15
claims:
  - where: setting
    claim: 'Pilate was prefect of Judea AD 26–36'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Pontius Pilate, the governor before whom Jesus was tried, was prefect of Roman Judea from AD 26–36.'
  - where: setting
    claim: 'The other Gospels each add episodes to Mark’s account of the Roman trial: Judas, Herod, a longer exchange'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Mark’s account of Jesus’s trial before the Roman governor Pontius Pilate is supplemented by the other Synoptics, each of which adds episodes lacking in the Marcan original. Matthew adds an account of the remorse and suicide of Judas Iscariot.'
  - where: setting
    claim: 'Only Mark gives the hour of the crucifixion'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/15.htm'
    quote: 'The precise statement of the hour is peculiar to St. Mark'
  - where: setting
    claim: 'Mark interprets Aramaic, among them Eloi, and twice explains Greek by Latin'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'Mark interprets Aramaic phrases for his readers, such as “Talitha cumi” (Mark 5:41) and “Eloi, Eloi, lama sabachthani?” (Mark 15:34).'
  - where: setting
    claim: 'Kentyriōn is a Latin word'
    key: thayer
    url: 'https://biblehub.com/greek/2760.htm'
    quote: 'κεντυρίων, κεντυρίωνος, ὁ, a Latin word, a centurion: Mark 15:39, 44f'
  - where: setting
    claim: 'The footnotes trace the silence to Isaiah 53:7, the garments to Psalm 22:18, the vinegar to Psalm 69:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/15?lang=eng'
    quote: 'Isa. 53:7 (7–8); Mosiah 14:7 (6–8).'
  - where: setting
    claim: 'The footnote on “garments” points to Psalm 22:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/15?lang=eng'
    quote: 'Ps. 22:18.'
  - where: setting
    claim: 'The footnote on “vinegar” points to Psalm 69:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/15?lang=eng'
    quote: 'Ps. 69:21.'
  - where: thread
    claim: 'Jesus is mocked with symbols of kingship; the reader knows He is the true king, so the mockery is ironic'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The irony in Mark’s Gospel reaches its climax with the death of Jesus, where Jesus is mocked with symbols of kingship (see Mark 15:1–39); the reader understands that Jesus is the true king, making the mockery ironic.'
  - where: thread
    claim: 'The three reactions to the death (veil, centurion, women) are unified as increased access to God'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'the three results of Jesus’s death can all be unified under the banner of increased access to God. The rent veil, the centurion, and the women all show that what was previously restricted—the divine presence, knowledge, and ministry—is now available to all.'
  - where: section 4 plain
    claim: 'The third hour is nine in the morning'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'before Jesus was crucified at the third hour, or nine o’clock'
  - where: section 5 plain
    claim: 'The sixth hour is noon'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'According to the Synoptics, at noon, or “the sixth hour,” darkness fell upon the land'
  - where: section 5 plain
    claim: 'The darkness lasted from noon to 3 p.m.'
    key: mcconkie-gethsemane-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/the-purifying-power-of-gethsemane?lang=eng'
    quote: 'from noon to 3:00 p.m., all the infinite agonies and merciless pains of Gethsemane recurred.'
  - where: section 5 plain
    claim: '“Gave up the ghost” is ekpneō, breathed His last'
    key: thayer
    url: 'https://biblehub.com/greek/1606.htm'
    quote: 'to breathe out, breathe out one''s life, breathe one''s last, expire: Mark 15:37, 39'
  - where: section 6 plain
    claim: '“Went in boldly” means took courage and went in'
    key: thayer
    url: 'https://biblehub.com/greek/5111.htm'
    quote: 'τολμήσας εἰσῆλθεν, took courage and went in, Mark 15:43'
  - where: section 6 plain
    claim: 'Joseph was a respected member of the Sanhedrin'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'a respected, wealthy member of the Sanhedrin named Joseph of Arimathea asked Pilate for permission to bury him.'
  - where: section 2 plain
    claim: '“Moved” the people is to stir up a crowd'
    key: thayer
    url: 'https://biblehub.com/greek/383.htm'
    quote: 'to shake up; tropically, to stir up, excite, rouse: τόν ὄχλον, Mark 15:11'
  - where: section 3 plain
    claim: '“Band” is a cohort'
    key: thayer
    url: 'https://biblehub.com/greek/4686.htm'
    quote: 'b. a military cohort'

  - where: 'note 15:1 “Why the council went to Pilate”'
    claim: 'Rome at times curtailed executions; just as likely the nearness of Passover barred them; Rome’s penalty for rebellion was crucifixion'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'it is just as likely that the Sanhedrin could not execute anyone according to Jewish law because of the nearness of Passover.'
  - where: 'note 15:1 “Why the council went to Pilate”'
    claim: 'Rome’s penalty for treason or rebellion was crucifixion'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the Roman penalty for treason or rebellion by subjects of the empire was crucifixion'
  - where: 'note 15:1 “Why the council went to Pilate”'
    claim: 'Pilate’s first question shows a shift to a political charge within the governor’s competence'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'suggesting that the Jewish authorities had shifted their strategy from a religious charge to a political accusation that would more clearly fall within the governor’s competence.'
  - where: 'note 15:1 “Why the council went to Pilate”'
    claim: 'The council hoped Pilate would find Jesus guilty of sedition through magical wonder-working; Augustus’s decree of AD 11; Pilate found Him guilty of no such charge'
    key: sc-knowhy-676
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-put-on-trial-and-crucified'
    quote: 'with the intent that “he might find Jesus similarly guilty under Roman law of sedition (crimen maiestatus) through illicit magical wonder-working (maleficum).”'
  - where: 'note 15:1 “Why the council went to Pilate”'
    claim: 'The decree of Augustus in AD 11; Pilate found Him guilty of no such charge'
    key: sc-knowhy-676
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-put-on-trial-and-crucified'
    quote: '“had recently become punishable by death” by a decree of Augustus Caesar in AD 11, preventing anyone from speaking against, prophesying against, or performing any ritual action against the emperor. Pilate, of course, found Jesus guilty of no such charge'

  - where: 'note 15:2 “Thou sayest it, and then silence”'
    claim: '“Thou sayest it” acknowledges: “That is what you say”; dignified silence recalling Isaiah 53:7'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus simply acknowledges, “That is what you say” (Mark 15:2, authors’ translation; parallel Matt 27:11). After Jesus’s opponents accuse him of further, unspecified charges, Jesus responds with dignified silence'
  - where: 'note 15:2 “Thou sayest it, and then silence”'
    claim: 'The JST reads “I am, even as thou sayest”; the footnote on “answered” points to Isaiah 53:7 and Mosiah 14:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/15?lang=eng'
    quote: 'I am, even as thou sayest.'

  - where: 'note 15:7 “Barabbas and the insurrection”'
    claim: 'Stasiastai and stasis show Barabbas was an insurgent, guilty of what the leaders implied of Jesus; the custom’s origin unclear; suited Passover'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'references in the Synoptic accounts to revolutionaries (Greek, stasiastai) and an uprising (Greek, stasis) make it clear that Barabbas was an insurgent of some kind.'
  - where: 'note 15:7 “Barabbas and the insurrection”'
    claim: 'Whose custom the release was is unclear; it suited Passover’s theme of deliverance'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Whether this was Pilate’s own practice (Mark 15:6), possibly that of all Roman governors (Matt 27:15; Luke 23:17), or a Jewish custom that Pilate had adopted is unclear; nevertheless, freeing a prisoner certainly accorded with an important theme of Passover'
  - where: 'note 15:7 “Barabbas and the insurrection”'
    claim: 'Barabbas could mean “son of the father”'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'The name Barabbas could be Aramaic for, among other possibilities, “son of the father” (bar ʾabbāʾ) and “son of a teacher” (bar Rabba[n]).'
  - where: 'note 15:7 “Barabbas and the insurrection”'
    claim: 'The footnote gives “usually released”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/15?lang=eng'
    quote: 'GR usually released.'

  - where: 'note 15:11 “Envy, and a crowd stirred up”'
    claim: '“Moved” is anaseiō, to stir up a crowd'
    key: thayer
    url: 'https://biblehub.com/greek/383.htm'
    quote: 'to shake up; tropically, to stir up, excite, rouse: τόν ὄχλον, Mark 15:11'
  - where: 'note 15:11 “Envy, and a crowd stirred up”'
    claim: 'Pilate took envy for a petty motive; envy does not adequately describe the council’s reactions'
    key: sc-knowhy-676
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-put-on-trial-and-crucified'
    quote: 'Matthew and Mark each state that the Sanhedrin delivered Jesus over to Pilate “for envy” (see Mark 15:10; Matthew 27:18), which Pilate misunderstood for some petty motivation. Yet even feelings of envy do not adequately describe the reactions exhibited by the Sanhedrin'
  - where: 'note 15:11 “Envy, and a crowd stirred up”'
    claim: 'The chief priests pressed for execution, since false prophecy and wonder-working were forbidden under Jewish law'
    key: sc-knowhy-676
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-put-on-trial-and-crucified'
    quote: 'but still the chief priests pressed for Jesus’s execution, as false prophecy and miracle working were likewise forbidden under Jewish law.'
  - where: 'note 15:11 “Envy, and a crowd stirred up”'
    claim: 'Ho ochlos suggests many more than the council; a change from the triumphal entry is hard to explain; possibly a claque of the chief priests’ retainers'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the crowd might have consisted primarily of a large group of retainers and other supporters of the chief priests—what is called a claque—who could be expected to express themselves in accordance with the preference of their leaders'
  - where: 'note 15:11 “Envy, and a crowd stirred up”'
    claim: 'If the crowd was people of the city, the change of feeling since the triumphal entry is hard to explain'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'If it consisted of a growing gathering of people from the city who had heard that Jesus had been arrested, we immediately wonder how their feelings towards Jesus had changed so markedly given the rapturous welcome they had given Jesus at his triumphal entry.'

  - where: 'note 15:15 “Scourged, and handed over”'
    claim: 'Torture, most often scourging, usually preceded crucifixion by Roman times'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'By Roman times, some form of torture usually preceded crucifixion. These tortures most frequently included scourging'
  - where: 'note 15:15 “Scourged, and handed over”'
    claim: 'Phragelloō: a severe whipping that could kill; Pilate joins the chain of those who hand Jesus over'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'a terrible and severe whipping preliminary to execution that could kill the condemned even before crucifixion'
  - where: 'note 15:15 “Scourged, and handed over”'
    claim: 'Pilate is in the chain of those, divine and human, who hand Jesus over'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'which puts Pilate in the chain of figures, divine and human, who hand Jesus over to be sacrificed.'

  - where: 'note 15:16 “The Praetorium and the whole band”'
    claim: 'Mark twice interprets a Greek term with a Latin one, the farthing and the Praetorium'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'Mark 15:16, “into the hall [Greek: aulēs], called Praetorium [Latin: praetorium]”'
  - where: 'note 15:16 “The Praetorium and the whole band”'
    claim: 'Latin terminology, Aramaic translated and customs explained indicate a Gentile, possibly Roman, audience'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'He twice interprets Greek terms with Latin explanations.[20] These features seem to indicate that Mark wrote his Gospel to a gentile, possibly a Roman, audience.'
  - where: 'note 15:16 “The Praetorium and the whole band”'
    claim: 'Praetorium: the governor’s palace; in Jerusalem Herod’s palace, which the procurators seem to have occupied'
    key: thayer
    url: 'https://biblehub.com/greek/4232.htm'
    quote: 'at Jerusalem it was that magnificent palace which Herod the Great had built for himself, and which the Roman procurators seem to have occupied whenever they came from Caesarea to Jerusalem'
  - where: 'note 15:16 “The Praetorium and the whole band”'
    claim: 'Speira: a cohort, the tenth part of a legion, about 600 men, or 500 or 1,000 auxiliaries'
    key: thayer
    url: 'https://biblehub.com/greek/4686.htm'
    quote: 'the tenth part of a legion (i. e. about 600 men (i. e. legionaries), or if auxilialies either 500 or 1,000'

  - where: 'note 15:16 “The Praetorium and the whole band”'
    claim: 'Aulē: the uncovered courtyard of a house'
    key: thayer
    url: 'https://biblehub.com/greek/833.htm'
    quote: 'the uncovered court-yard of the house'
  - where: 'note 15:38 “The veil rent from the top”'
    claim: 'The veil was most likely the inner curtain'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'There is some debate as to whether Mark is describing the inner or outer curtain of the temple. The weight of evidence implies that it is the inner curtain'
  - where: 'note 15:17 “Purple and a crown of thorns”'
    claim: 'The soldiers mock His kingship with purple, thorns and salutes, strike Him (driving the thorns deeper), spit; the acts fulfilled Isaiah and the Book of Mormon'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'They then strike him on the head, no doubt driving the thorns deeper into his scalp and forehead, spit on him, and offer him feigned obeisance (Mark 15:16‒20; parallel Matt 27:27‒31).[81] While these acts were meant to demean him, they also fulfilled prophecies in both Isaiah and the Book of Mormon (Isa 50:6; 53:3‒7; 1 Nephi 19:9'
  - where: 'note 15:17 “Purple and a crown of thorns”'
    claim: 'Mocked with symbols of kingship; ironic; irony suits a Gospel that teaches saving one’s life by losing it'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Irony is an appropriate literary device for a Gospel that teaches that you save your life by losing it (see Mark 8:35) and that the Christ must suffer and die.'
  - where: 'note 15:21 “Simon of Cyrene, and his sons”'
    claim: 'Jesus probably carried only the crossbeam; exhausted; Simon pressed; sons perhaps known to Mark’s audience in Rome; no indication Simon was a disciple; perhaps converted'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Mark adds the curious detail that Simon is the father of two specific men, Alexander and Rufus, leading some commentators to suggest that these were people familiar to Mark’s original audience in Rome.'
  - where: 'note 15:21 “Simon of Cyrene, and his sons”'
    claim: 'No indication Simon had been a disciple; the experience might have led to his conversion'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'While we have no indication that Simon himself had been a disciple of Jesus before this time, this detail suggests that the experience of being so close to Jesus at that critical time might have made a powerful impact on Simon, perhaps leading to his conversion'
  - where: 'note 15:21 “Simon of Cyrene, and his sons”'
    claim: 'Jesus probably carried only the crossbeam'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus probably only carried the crossbeam itself'
  - where: 'note 15:21 “Simon of Cyrene, and his sons”'
    claim: 'No one would bear the cross willingly; everything connected with crucifixion was degrading'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'No Roman or Jew would have voluntarily incurred the ignominy of bearing such a gruesome burden; for every detail connected with the carrying out of a sentence of crucifixion was regarded as degrading.'
  - where: 'note 15:21 “Simon of Cyrene, and his sons”'
    claim: 'The sons were known to Mark’s readers as members of the early Church'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'From Mark’s statement that Simon was the father of Alexander and Rufus we infer that the two sons were known to the evangelist’s readers as members of the early Church'
  - where: 'note 15:21 “Simon of Cyrene, and his sons”'
    claim: 'Rufus of Romans 16:13 by tradition Simon’s son; Simon’s family prominent'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'If this Rufus be one of the sons of Simon named by Mark (15:21), as tradition indicates, it is probable that Simon’s family was prominently identified with the Primitive Church.'
  - where: 'note 15:21 “Simon of Cyrene, and his sons”'
    claim: 'Simon was a member of the Jewish colony in northern Africa'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'was a member of the Jewish colony in northern Africa, which had been established nearly three centuries before the birth of Christ'

  - where: 'note 15:23 “Wine mingled with myrrh”'
    claim: 'Wine with myrrh perhaps a narcotic (Prov 31:6); He refused, perhaps to endure the full experience'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'his executioners offer him wine mixed with myrrh, which might have been intended to serve as some sort of narcotic to lessen the pain (see Prov 31:6). Jesus refuses it, perhaps because it was necessary for him to endure the full experience of crucifixion'
  - where: 'note 15:23 “Wine mingled with myrrh”'
    claim: 'The narcotic was no Roman practice but a concession to Jewish sentiment; He refused, to meet death with mind unclouded'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'This was no Roman practice, but was allowed as a concession to Jewish sentiment. When the drugged cup was presented to Jesus He put it to His lips, but having ascertained the nature of its contents refused to drink, and so demonstrated His determination to meet death with faculties alert and mind unclouded.'

  - where: 'note 15:25 “The third hour”'
    claim: 'Mark’s third hour leaves hardly enough time; John’s sentencing at the sixth hour'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'which hardly provides enough time for all the procedures the trial narratives suggest. Instead, John’s account places Pilate’s formal sentencing of Jesus at the sixth hour, or noon.'
  - where: 'note 15:25 “The third hour”'
    claim: 'John’s timing allows more time and has the Lamb die during the Passover sacrifices'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Most significantly, it supports John’s paschal chronology by having Jesus, the true Lamb of God, hang and then die on the cross during the very hours that the priests are performing the Passover sacrifices in the temple.'
  - where: 'note 15:25 “The third hour”'
    claim: 'The third hour, unique to Mark, agrees with the darkness at the sixth hour in Matthew and Luke'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/15.htm'
    quote: 'The precise statement of the hour is peculiar to St. Mark, but it agrees with the narrative common to him with St. Matthew and St. Luke of the darkness that came over the land at the “sixth hour.”'
  - where: 'note 15:25 “The third hour”'
    claim: 'The times at the crucifixion are one of Mark’s threefold patterns'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'time mentioned during the Crucifixion (see Mark 15:25, 33, 34)'

  - where: 'note 15:28 “Numbered with the transgressors”'
    claim: 'The Textus Receptus has verse 28; the SBL, Nestle 1904, Westcott and Hort and Tischendorf columns are blank (seen on the page)'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/15-28.htm'
    quote: 'καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.'
  - where: 'note 15:28 “Numbered with the transgressors”'
    claim: 'The verse is missing in some early manuscripts; it reflects the fulfillment of Isaiah 53:12'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'is missing in some of the early manuscripts, it reflects an understanding that Jesus’s execution between two condemned criminals fulfilled Isaiah 53:12b'
  - where: 'note 15:28 “Numbered with the transgressors”'
    claim: 'Luke 22:37 is the parallel to the verse'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'who notes that it might have been inserted from a parallel in Luke 22:37'
  - where: 'note 15:28 “Numbered with the transgressors”'
    claim: 'Lēistai may mean rebels like Barabbas; Jesus might have died in Barabbas’s place'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Indeed, Jesus might have been executed in the very place where Barabbas would have been crucified if he had not been chosen by the crowd for pardon.'

  - where: 'note 15:31 “He saved others”'
    claim: 'Three groups mock Jesus on the cross, one of Mark’s patterns of three'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'groups mocking Jesus on the cross (passersby, chief priests and scribes, and the others being crucified; see Mark 15:3, 29–30, 32)'
  - where: 'note 15:31 “He saved others”'
    claim: 'The mockery is irony, in a Gospel that teaches you save your life by losing it; the reader knows Jesus is the true king'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Irony is an appropriate literary device for a Gospel that teaches that you save your life by losing it (see Mark 8:35)'
  - where: 'note 15:31 “He saved others”'
    claim: 'His life was not taken except as He willed; He lived until all was accomplished'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'His life had not been taken from Him except as He had willed to permit. Sweet and welcome as would have been the relief of death in any of the earlier stages of His suffering from Gethsemane to the cross, He lived until all things were accomplished as had been appointed.'

  - where: 'note 15:34 “My God, my God”'
    claim: 'Mark interprets the Aramaic Eloi'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'Mark interprets Aramaic phrases for his readers, such as “Talitha cumi” (Mark 5:41) and “Eloi, Eloi, lama sabachthani?” (Mark 15:34).'
  - where: 'note 15:34 “My God, my God”'
    claim: 'At the baptism a psalm is spoken to Jesus, at the cross Jesus speaks a psalm to God; the psalm’s ending holds out hope'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'The similarity of the form heightens the clash in content and thus the rupture in the relationship. And yet the note of triumph and universal worship at the end of the psalm that Jesus quotes also holds out hope for reconciliation and ultimate victory.'
  - where: 'note 15:34 “My God, my God”'
    claim: 'Elder McConkie: the agonies of Gethsemane recurred on the cross from noon to 3'
    key: mcconkie-gethsemane-1985
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/04/the-purifying-power-of-gethsemane?lang=eng'
    quote: 'And truly he was, for while he was hanging on the cross for another three hours, from noon to 3:00 p.m., all the infinite agonies and merciless pains of Gethsemane recurred.'
  - where: 'note 15:34 “My God, my God”'
    claim: 'Elder Holland: the Father did not forsake the Son but briefly withdrew His Spirit and presence, that the sacrifice be complete'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'Nevertheless, that the supreme sacrifice of His Son might be as complete as it was voluntary and solitary, the Father briefly withdrew from Jesus the comfort of His Spirit, the support of His personal presence.'
  - where: 'note 15:34 “My God, my God”'
    claim: 'Elder Holland: the Father did not forsake His Son'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'a perfect Father did not forsake His Son in that hour.'
  - where: 'note 15:34 “My God, my God”'
    claim: 'The footnotes trace the parted garments (verse 24) to Psalm 22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/15?lang=eng'
    quote: 'Ps. 22:18.'

  - where: 'note 15:36 “Is he calling Elijah?”'
    claim: 'Elijah is not at the cross; what is there is Jesus’s unanswered plea that sounds like a call to Elijah'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Elijah is not, in fact, present at the cross—what is present is Jesus’s unanswered plea to God that sounds like a call to Elijah.'
  - where: 'note 15:36 “Is he calling Elijah?”'
    claim: 'The crowd confuses Eloi and Eliyahu; John fulfills Elijah’s role'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'the crowd confuses Eloi [“God”] with Eliyahu [“Elijah”]'
  - where: 'note 15:36 “Is he calling Elijah?”'
    claim: 'John the Baptist fulfills the role of Elijah'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'and, as Mark shows us, fulfills the role of Elijah.'

  - where: 'note 15:38 “The veil rent from the top”'
    claim: 'The veil barred the Holy of Holies; its rending opens access to all'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Its rending signifies that this most sacred of spaces is now accessible to all people because of Jesus’s death. The barrier between God and humans has been torn asunder.'
  - where: 'note 15:38 “The veil rent from the top”'
    claim: 'Mark implies Jesus’s death is the day of atonement'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Via the ripping of the veil, Mark implies that Jesus’s death is the day of atonement7 and that his death has an atoning effect.'
  - where: 'note 15:38 “The veil rent from the top”'
    claim: 'The passive verb, often used of divine action; the tear starts at the top'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'Mark may imply that God has ripped the veil because the rip starts at the top of the curtain and because it is described with a passive verb form, something often used to connote divine action.'
  - where: 'note 15:38 “The veil rent from the top”'
    claim: 'Narrated in a dozen Greek words; the first thing after the death'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'particularly considering that it is narrated in a mere dozen Greek words.'
  - where: 'note 15:38 “The veil rent from the top”'
    claim: 'Christ the High Priest entered by His own blood, opening the way for all'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Now Christ, our Great High Priest, had entered once and for all by virtue of his own blood, sitting down on the throne of God and opening the way for all who accept him to enter also (see Heb 9:11‒12, 24‒26).'

  - where: 'note 15:39 “A centurion’s confession”'
    claim: 'Kentyriōn is a Latin word'
    key: thayer
    url: 'https://biblehub.com/greek/2760.htm'
    quote: 'κεντυρίων, κεντυρίωνος, ὁ, a Latin word, a centurion: Mark 15:39, 44f'
  - where: 'note 15:39 “A centurion’s confession”'
    claim: '“Gave up the ghost” is ekpneō, breathed His last'
    key: thayer
    url: 'https://biblehub.com/greek/1606.htm'
    quote: 'to breathe out, breathe out one''s life, breathe one''s last, expire: Mark 15:37, 39'
  - where: 'note 15:39 “A centurion’s confession”'
    claim: 'Only Mark keeps the paradox of a Gentile soldier recognizing the Son of God in a humiliating death; Mark has no earthquake'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Only Mark contains the paradoxical image of a Gentile—a Roman soldier—realizing that the humiliating death of a political prisoner could be the death of the Son of God.'
  - where: 'note 15:39 “A centurion’s confession”'
    claim: 'The centurion does what God did at the baptism'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'In other words, Mark’s narrative teaches that the death of Jesus makes it possible for a centurion to do what God does.'
  - where: 'note 15:39 “A centurion’s confession”'
    claim: 'The first human reaction to the death'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'the first human reaction to Jesus’s death'
  - where: 'note 15:39 “A centurion’s confession”'
    claim: '“Over against” suggests opposition; after the death the centurion is for Him'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'he may have begun “over against” Jesus, but after Jesus’s death, the centurion knows who Jesus is—he is, in other words, now for him.'

  - where: 'note 15:40 “The women who watched”'
    claim: 'Only after the death does Mark reveal women were disciples and ministers all along'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'It is only now, after Jesus’s death, that we find out that there were women present all along, being disciples and engaging in ministry,24 a reality that Mark had largely hidden from the audience’s view.'
  - where: 'note 15:40 “The women who watched”'
    claim: 'Diakoneō used for the angels (1:13), Peter’s mother-in-law (1:31), Jesus’s mission (10:45)'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'This verb for “ministered” is used two times elsewhere in Mark: for Simon’s mother-in-law after Jesus has healed her (see Mark 1:31) and by Jesus to describe his own mission (see Mark 10:45).'
  - where: 'note 15:40 “The women who watched”'
    claim: 'In the women Mark shows Christlike ministry'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'In the women at the foot of the cross, we see an example of Christlike ministry made possible through his death.'
  - where: 'note 15:40 “The women who watched”'
    claim: 'They are witnesses; the same verb in 15:47 and 16:4; their witness preserved the story'
    key: smith-narrative-atonement-mark
    url: 'https://byustudies.byu.edu/article/narrative-atonement-theology-in-the-gospel-of-mark'
    quote: 'The same verb used here for their looking will be used for the women again in 15:47 and 16:4, both instances where the women’s witness will be crucial to preserving and transmitting the knowledge of Jesus’s death and resurrection.'
  - where: 'note 15:40 “The women who watched”'
    claim: 'Women in Mark follow a teacher'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'and following a teacher (see Mark 15:40).'

  - where: 'note 15:43 “Joseph took courage”'
    claim: 'Joseph was a respected, wealthy member of the Sanhedrin'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'a respected, wealthy member of the Sanhedrin named Joseph of Arimathea asked Pilate for permission to bury him.'
  - where: 'note 15:43 “Joseph took courage”'
    claim: 'Tolmēsas eisēlthen: took courage and went in'
    key: thayer
    url: 'https://biblehub.com/greek/5111.htm'
    quote: 'τολμήσας εἰσῆλθεν, took courage and went in, Mark 15:43'
  - where: 'note 15:43 “Joseph took courage”'
    claim: 'Contrast between his boldness now and his previous timidity'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/15.htm'
    quote: 'There is an implied contrast between his boldness now and his previous timidity.'
  - where: 'note 15:43 “Joseph took courage”'
    claim: 'The Sabbath began at sunset; the burial was made in haste'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'Because of the nearness of the Sabbath the interment had to be made with haste'
  - where: 'note 15:43 “Joseph took courage”'
    claim: 'The Sabbath would begin at sunset'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'It was now late in the afternoon; at sunset the Sabbath would begin.'
  - where: 'note 15:43 “Joseph took courage”'
    claim: 'Joseph, not the inner circle, buries Jesus, as John’s disciples buried John; the male disciples fled'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: '—not one of Jesus’ chosen inner circle of disciples—who will request and bury his body; Jesus’ closest male disciples have fled'

  - where: 'note 15:44 “Already dead?”'
    claim: 'Crucified victims generally lived many hours, sometimes days'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'Death by crucifixion was at once the most lingering and most painful of all forms of execution. The victim lived in ever increasing torture, generally for many hours, sometimes for days.'
  - where: 'note 15:44 “Already dead?”'
    claim: 'Pilate’s wonder and the centurion are peculiar to Mark; the article points to the same centurion'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/15.htm'
    quote: 'The wonder of Pilate, and his calling the centurion (the article points to his being the same that had been mentioned in Mark 15:39), are peculiar to St. Mark.'
  - where: 'note 15:44 “Already dead?”'
    claim: 'Perhaps the same centurion, or the same role of Gentile witness; the exchange may cement his testimony'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'and so Mark’s inclusion of this brief exchange may further cement the centurion’s testimony from Mark 15:39.'
