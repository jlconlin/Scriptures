    url: 'https://biblehub.com/greek/2128.htm'
    quote: 'εὐλογητός, εὐλογητόν (εὐλογέω), the Sept. for בָּרוּך, a Biblical and ecclesiastical word; blessed, praised, Vulg.benedictus: applied to God'
  - where: 'note 14:62 “Art thou the Christ? I am”'
    claim: 'The title Christ is unambiguously claimed by Jesus at His trial'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Some scholars argue that this title is the most important one in Mark’s Gospel because it is key to Peter’s confession (see Mark 8:29), and it is unambiguously claimed by Jesus during his trial (see Mark 14:62).'
  - where: 'note 14:62 “Art thou the Christ? I am”'
