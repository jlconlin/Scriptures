chapter: 14
claims:
  # setting
  - where: setting
    claim: 'By Mark’s markers the plot and anointing fall on Wednesday; “after two days” can be counted more than one way'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'The relative time markers in Mark (see again Appendix B) clearly locate these episodes three days after the triumphal entry … Nevertheless, the statement at Mark 14:1 that Passover was “two days away” … has led to some disagreement about the timing.'
  - where: setting
    claim: 'The Last Supper, Gethsemane, the arrest and the preliminary hearing fall on Thursday evening and night'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'The events of the last evening of Jesus’s life, which in our devotional chronology occurred on Thursday … was arrested, and then was taken before the Jewish authorities for a preliminary hearing and harsh abuse'
  - where: setting
    claim: 'The anointing is the hinge between the accounts of Jesus’s life and death'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Julie Smith calls the episode “the hinge between the accounts of his life and his death,” being the last part of the narrative of Jesus’s life and the first part of what, on the next day, will be part of the Passion proper'
  - where: setting
    claim: 'The young man who fled is in Mark only'
    key: bd-gospels
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gospels?lang=eng'
    quote: 'Mark only: Jesus, a carpenter (Mark 6:3); a young man wearing a sheet (14:52).'
  - where: setting
    claim: 'Only Mark has the cock crow twice'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'the only other unique aspect of the Marcan account is the detail that the rooster would crow twice, while the other three Gospels mention the cock crowing once.'
  # thread
  - where: thread
    claim: 'Mark sandwiches the anointing between the plot and Judas, and the trial between scenes of Peter'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus’ anointing (Mark 14:3–9) is surrounded by references to the plot to kill him (Mark 14:1–2, 10–11). Finally, Jesus’ trial (Mark 14:55–65) is surrounded by references to Peter (Mark 14:54, 66–72).'
  - where: thread
    claim: 'The sacrament is framed by two predictions of betrayal, Judas’s and Peter’s'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'thus framing the institution of the sacrament, by which believers remember and commit themselves to Jesus, with two predictions of betrayal, Judas’s at the beginning (Mark 14:18–21) and Peter’s after it is over.'
  - where: thread
    claim: 'The maid questions Peter at the same time as the high priest questions Jesus'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Because this denial is preceded directly by the chief priest’s interrogation of Jesus, the maid is portrayed as interrogating Peter at the same time but with very different results.'
  - where: thread
    claim: 'The circle around Jesus grows smaller'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'Thus, of divine necessity, the supporting circle around Jesus gets smaller and smaller and smaller'
  # 14:2
  - where: 'note 14:2 “Not on the feast day”'
    claim: 'The Sanhedrin kept order under Rome; the temple cleansing was the deciding factor; the crowds approved Jesus; the council sought to take Him secretly'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'In the Synoptics, Jesus’s cleansing of the temple seems to have been the deciding factor … Historically the chief priests, the leading legal experts, and the elders of the people comprised the Sanhedrin, which under the Roman occupation was charged with maintaining day-to-day order in the city'
  - where: 'note 14:2 “Not on the feast day”'
    claim: 'Not amid the festival or the festal crowds, which explains the night arrest in Gethsemane'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'By this they meant either not in the middle of the festivities or at least not in the presence of the festal crowds,[14] which explains why eventually they arrested him at night in Gethsemane rather than in the temple during the day.'
  - where: 'note 14:2 “Not on the feast day”'
    claim: 'The rulers feared especially the Galileans, proud of Jesus'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'The rulers feared especially an outbreak by the Galileans, who had a provincial pride in the prominence of Jesus as one of their countrymen, and many of whom were then in Jerusalem.'
  # 14:3 spikenard
  - where: 'note 14:3 “Spikenard very precious”'
    claim: 'Nard: from a fragrant East Indian plant'
    key: thayer
    url: 'https://biblehub.com/greek/3487.htm'
    quote: 'nard, the head or spike of a fragrant East Indian plant'
  - where: 'note 14:3 “Spikenard very precious”'
    claim: 'Pistikos: genuine, pure, unadulterated; “spikenard” follows the Vulgate; nard was often adulterated'
    key: thayer
    url: 'https://biblehub.com/greek/4101.htm'
    quote: 'of commodities equivalent to δόκιμος, genuine, pure, unadulterated: so νάρδος πιστικη (but A. V. spike-(i. e. spiked) nard, after thenardispicati of the Vulg. (in Mark)), Mark 14:3; John 12:3 (for nard was often adulterated'
  - where: 'note 14:3 “Spikenard very precious”'
    claim: 'The lexicon notes that the word has been discussed at length'
    key: thayer
    url: 'https://biblehub.com/greek/4101.htm'
    quote: 'Cf. the full discussion of this word'
  - where: 'note 14:3 “Spikenard very precious”'
    claim: 'Only Mark names the spikenard, the breaking of the box and the price'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Matthew omits the following details when compared with Mark’s account: the ointment was spikenard (Mark 14:3; contrast Matthew 26:7); the woman broke the box (Mark 14:3; contrast Matthew 26:7); the cost for which the anointing oil could have been sold'
  - where: 'note 14:3 “Spikenard very precious”'
    claim: 'The KJV renders the denarius “penny”'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'The Roman silver denarius. The KJV always translates this word as “penny.”'
  - where: 'note 14:3 “Spikenard very precious”'
    claim: 'Simon presumably cured; the gift worth about a year’s wages'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Because currently suffering from the disease would have made him ritually unclean and kept him from hosting such a dinner, Simon had presumably been cured … The woman’s costly gift, the value of which approximately equaled a year’s wages for a laborer'
  # 14:3 anointing
  - where: 'note 14:3 “The Christ anointed”'
    claim: 'Christ means anointed; the anointing is burial, priestly and royal at once and defines what it means to be the Christ'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Because the act is presented as a burial anointing, a priestly anointing, and a royal anointing all at once, three different aspects of what it means to be “the Christ” (or, to translate instead of transliterate into English, “the anointed”) are simultaneously encapsulated'
  - where: 'note 14:3 “The Christ anointed”'
    claim: 'Peter confessed the Christ, then rebuked Jesus; the anointing explains what it means to be the Christ'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The story of the anointing in Mark 14, which functions as a narrative hinge between the life and death of Jesus, explains what it means to be the Christ by showing Jesus anointed for his death, both as a royal anointing and as a priestly anointing.'
  - where: 'note 14:3 “The Christ anointed”'
    claim: 'Anointing evokes kingship and priesthood; Wednesday pivots from the kingly to the priestly part of the week'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'With the anointing evoking images of kingship (1 Sam 16:13 … it serves as a fitting climax to the kingly portion of Jesus’s last week … Yet Israelite anointing was also associated with priests (Exod 40:13; Lev 6:20), and after this day Jesus assumed a more priestly role'
  - where: 'note 14:3 “The Christ anointed”'
    claim: 'Prophets were sometimes anointed too'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'In the Hebrew Bible, not only kings but also priests and, on occasion, even prophets were anointed to their position'
  - where: 'note 14:3 “The Christ anointed”'
    claim: 'The woman’s silent act contrasts with Peter’s verbal confession'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Contrasting the verbal confessions of men such as Peter in Mark’s text, Smith observes that the silent act of the woman gives perhaps the strongest testimony of who Jesus is.'
  # 14:8
  - where: 'note 14:8 “She hath done what she could”'
    claim: 'She understood Jesus had come to die, unlike Peter and the others; unnamed, she is a type of the ideal believer'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'suggesting that the woman understands that rather than having come to Jerusalem as its earthly king, Jesus has come to die, an understanding that contrasts markedly with that of Peter and the other disciples.'
  - where: 'note 14:8 “She hath done what she could”'
    claim: 'Unnamed, she serves as a type of the ideal believer'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'by not naming her, the Marcan and Matthean stories more easily allow the woman to serve as a type of the ideal believer.'
  - where: 'note 14:8 “She hath done what she could”'
    claim: 'Her gift resonates with the widow’s, one great and one seemingly small'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'resonates with the simple gift of the poor widow; while one was great and the other seemingly small, they both represented faithfulness from women across the social and economic spectrum.'
  - where: 'note 14:8 “She hath done what she could”'
    claim: 'Minor characters who choose to follow, among them the anointing woman, are better disciples than the Twelve'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'minor characters who choose to follow Jesus are much better disciples; this group includes … the widow donating to the temple (Mark 12:41–44), and the woman who anoints Jesus (Mark 14:3–9).'
  - where: 'note 14:8 “She hath done what she could”'
    claim: 'Women did not generally perform anointings'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'to the woman who interrupts a dinner party to anoint Jesus (women did not generally perform anointings)'
  - where: 'note 14:8 “She hath done what she could”'
    claim: 'Unlike Matthew, Mark has Jesus say they can help the poor at any time'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Jesus’ statement that they can help the poor at any time (Mark 14:7; contrast Matthew 26:11)'
  # 14:10
  - where: 'note 14:10 “Judas goes to the chief priests”'
    claim: 'Mark sandwiches the anointing between the plot and Judas; the center is understood in light of the frame'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark frequently “sandwiches” a story between two other sections of text with the goal of encouraging the audience to understand the center story in light of its surrounding material.'
  - where: 'note 14:10 “Judas goes to the chief priests”'
    claim: 'The two dark events frame the anointing and contrast with it'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Together they create another intercalation, or sandwich structure, that frames the anointing scene, contrasting with it and emphasizing it as they cast its beauty in high relief.'
  - where: 'note 14:10 “Judas goes to the chief priests”'
    claim: 'All the Gospels use paradidōmi, “hand over,” not prodidōmi'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'not only Mark but all the Gospels consistently use a term that means “hand over” (Greek, paradidōmi) rather than the technical term meaning “betray” (prodidōmi).'
  - where: 'note 14:10 “Judas goes to the chief priests”'
    claim: 'A series of handings over; the Septuagint of Isaiah 53:6 and Romans 8:32 use the verb'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'the Septuagint uses the same term for “hand over” in its rendition of the prophecy that “the Lord hath laid on him the iniquity of us all” (Isa 53:6; emphasis added), and Paul declares that God himself “spared not his own Son, but delivered [Greek, paredōken] him up for us all”'
  - where: 'note 14:10 “Judas goes to the chief priests”'
    claim: 'Judas’s act is the first in a series; each handing over a necessary step in God’s plan'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Each of these deliverances were necessary steps for Jesus to deliver us and part of God’s plan'
  - where: 'note 14:10 “Judas goes to the chief priests”'
    claim: 'Mark says only that money was offered, not that Judas accepted it or acted for it; Luke and John point to Satan'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Mark, for instance, only notes that the Jewish leaders offered Judas money, not that he accepted the money or handed Jesus over for money,[31] while Luke and John instead suggest that he was driven by Satanic influence'
  - where: 'note 14:10 “Judas goes to the chief priests”'
    claim: 'The text of JST Mark 14:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/14?lang=eng'
    quote: 'JST Mark 14:31 … to betray Jesus unto them; for he turned away from him, and was offended because of his words.'
  - where: 'note 14:10 “Judas goes to the chief priests”'
    claim: 'Iscariot means of Kerioth; the only one not a Galilean'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: 'Iscariot, meaning “belonging to Kerioth” (Josh. 15:25) in the tribe of Judah, one of “the twelve,” and the only one who was not a Galilean.'
  # 14:12
  - where: 'note 14:12 “A Passover meal”'
    claim: 'The Synoptics present a Passover meal; John has Passover begin the next evening'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'The Synoptic Gospels appear to agree that the last meal that Jesus shared with his disciples was a Passover feast, celebrated in a specially arranged room in Jerusalem'
  - where: 'note 14:12 “A Passover meal”'
    claim: 'The lamb was slaughtered on the afternoon of Nisan 14'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the lamb or goat for a family grouping was not slaughtered on the first day of Passover (Nisan 15 in the Jewish calendar), but in the afternoon before the festival began (Nisan 14).'
  - where: 'note 14:12 “A Passover meal”'
    claim: 'In John’s timing Jesus dies as the lambs are sacrificed; calendar explanations are not convincing'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'this chronology has the paschal lambs being sacrificed in the temple between noon and three o’clock in the afternoon before Passover started as Jesus is being crucified and then dies on the cross.'
  - where: 'note 14:12 “A Passover meal”'
    claim: 'Calendar reconciliations are not particularly convincing'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'various arguments attempt to reconcile the Synoptic and Johannine chronology, ranging from the possibility that different calendars were used … though none of these are particularly convincing.'
  - where: 'note 14:12 “A Passover meal”'
    claim: 'Jesus may have held a Passover or Passover-like meal early; safest to suspend judgment and appreciate both symbolisms'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John’s chronology is correct in regard to the actual timing of Passover but that Jesus chose to celebrate the Passover, or at least a Passover-like meal, early, knowing that he would be dead and buried when the feast actually occurred the next day.'
  - where: 'note 14:12 “A Passover meal”'
    claim: 'The safest position: suspend judgment, keep both symbolisms'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the Lord’s Supper incorporates Passover symbolism and symbolized a new covenant that fulfilled it—and the Johannine symbolism, which portrays Christ as the Lamb of God'
  # 14:13
  - where: 'note 14:13 “The man with the water jar”'
    claim: 'Pilgrims needed rooms; prophetic insight or prior arrangement; water carried by women; a prearranged signal; women and children may have been present'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the man who would show it to them was carrying a water jar, something usually done by women and apparently a prearranged signal, and was looking to meet them (Mark 14:13).'
  - where: 'note 14:13 “The man with the water jar”'
    claim: 'The company may have included the women from Galilee, since Passover was eaten in family groups'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Jesus made arrangements for his company, which included at least the Twelve but perhaps other disciples, including the women who had accompanied Jesus from Galilee … and, because the Passover was celebrated in family groups, perhaps even children'
  - where: 'note 14:13 “The man with the water jar”'
    claim: 'The instructions could indicate prophetic insight'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'would be able to identify the particular large room that the group would use could be taken to indicate his prophetic insight.'
  # 14:19
  - where: 'note 14:19 “Is it I?”'
    claim: 'Each who asked feared he was the offender; all ate from the common dish'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'each of those who so inquired was more concerned with the dread thought that possibly he was an offender, however inadvertently so, than as to whether his brother was about to prove himself a traitor. Jesus answered that it was one of the Twelve, then and there eating with Him from the common dish'
  # 14:22
  - where: 'note 14:22 “In remembrance of my body”'
    claim: 'The text of JST Mark 14:20–21'
    key: jst-mark-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/14?lang=eng'
    quote: 'Behold, this is for you to do in remembrance of my body; for as oft as ye do this ye will remember this hour that I was with you.'
  - where: 'note 14:22 “In remembrance of my body”'
    claim: 'The text of JST Mark 14:20'
    key: jst-mark-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/14?lang=eng'
    quote: 'And as they did eat, Jesus took bread and blessed it, and brake, and gave to them, and said, Take it, and eat.'
  - where: 'note 14:22 “In remembrance of my body”'
    claim: 'The bread recalls His body and physical suffering'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'With a crust of bread, always broken, blessed, and offered first, we remember His bruised body and broken heart, His physical suffering on the cross'
  - where: 'note 14:22 “In remembrance of my body”'
    claim: 'His physical suffering guarantees resurrection for all'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'The Savior’s physical suffering guarantees that through His mercy and grace (see 2 Ne. 2:8) every member of the human family shall be freed from the bonds of death and be resurrected triumphantly from the grave.'
  # 14:24
  - where: 'note 14:24 “The blood of the new covenant”'
    claim: 'Diathēkē: in classical Greek a will, in the Septuagint berit; new covenant recalls Jeremiah'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'In classical Greek the word “covenant” (Greek, diathēkē; KJV, “testament”) represented a legal document, a last will and final testament … but in the Septuagint it translated the Hebrew bərîṯ, a binding constitution or covenant between God and his people.'
  - where: 'note 14:24 “The blood of the new covenant”'
    claim: 'The earliest manuscripts lack “new”; all have “poured out for many,” linking to Exodus 24'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'The earliest manuscripts of Mark and Matthew have Jesus simply call the wine in the cup “my blood of the covenant,” leaving out the “new” that the KJV following the Textus Receptus inserts. Yet all of the manuscripts add “that is poured out for many”'
  - where: 'note 14:24 “The blood of the new covenant”'
    claim: 'A new covenant connects with Jeremiah 31'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Its being a “new” covenant connects Jesus’s sacrifice with the prophecy of Jeremiah that the Lord would make a new covenant to replace the one that they broke, one that would be written in their hearts (Jer 31:31‒33).'
  - where: 'note 14:24 “The blood of the new covenant”'
    claim: 'Poured out for many connects with Exodus 24 and echoes Mark 10:45'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'connecting the new covenant that Jesus is about to establish with the institution of the Mosaic covenant at Exodus 24:6‒8.[27] Further, Jesus’s blood being poured out “for many” echoes the third passion prediction'
  - where: 'note 14:24 “The blood of the new covenant”'
    claim: 'Thayer lists Mark 14:24 under the new covenant contrasted with the Mosaic'
    key: thayer
    url: 'https://biblehub.com/greek/1242.htm'
    quote: 'the Mosaic and the Christian, with the former of which … the latter is contrasted, as καινή διαθήκη, Matthew 26:28; Mark 14:24'
  - where: 'note 14:24 “The blood of the new covenant”'
    claim: 'The text of JST Mark 14:23'
    key: jst-mark-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/14?lang=eng'
    quote: 'This is in remembrance of my blood which is shed for many, and the new testament which I give unto you; for of me ye shall bear record unto all the world.'
  - where: 'note 14:24 “The blood of the new covenant”'
    claim: 'The cup recalls His blood and spiritual suffering begun in Gethsemane'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'With a small cup of water we remember the shedding of Christ’s blood and the depth of His spiritual suffering, anguish which began in the Garden of Gethsemane.'
  - where: 'note 14:24 “The blood of the new covenant”'
    claim: 'His suffering paid for Adam’s transgression and gives remission on conditions of obedience'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'paid the debt for what the scriptures call the “original guilt” of Adam’s transgression … providing remission for all of our sins as well, upon conditions of obedience to the principles and ordinances of the gospel He taught'
  # 14:25
  - where: 'note 14:25 “Drinking it new”'
    claim: 'The saying alludes to the messianic banquet; Isaiah 25 and D&C 27'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'he alludes to the future messianic banquet that symbolizes the eternal fellowship with God at the end of time (see Isa 25:6‒8; Ezek 39:17‒20; Zech 9:15; Doctrine and Covenants 27:4‒14).'
  - where: 'note 14:25 “Drinking it new”'
    claim: 'The text of JST Mark 14:24'
    key: jst-mark-14
