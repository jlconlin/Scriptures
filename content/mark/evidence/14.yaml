    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'using this prophecy about the sheep scattering after the shepherd had been struck to anticipate how the disciples would flee when Jesus was arrested in Gethsemane.'
  # 14:30
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'Some manuscripts move or omit “twice”; critics confident it is original'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'some Greek manuscripts move it within the verse or even omit it altogether in attempt to harmonize Mark with the other Gospels. Nonetheless, the manuscript evidence is strong enough that textual critics are generally confident that this is the original reading.'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'The reason is obscure: proverbial counting, or Peter’s memory; “this day, even in this night” for a Gentile audience'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'The reason for this difference remains obscure, though it might have been intended to make Jesus’ statement seem proverbial, borrowing the counting figure of “for three . . . and for four” seen in Proverbs 30'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'The double cockcrow may preserve Peter’s memory; Mark’s “this day, even in this night”'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Mark’s account emphasizes that the denials would occur “this day, even in this night,” perhaps because Mark’s presumed Gentile audience might not be familiar with Jewish methods of reckoning days beginning with sunset on the previous day.'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'The double cockcrow might preserve a personal memory of Peter'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'the double cockcrow might preserve a vivid, personal memory of the Apostle himself.'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'Some Latter-day Saints read it as a command so Peter could escape and lead the Church'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Such commentators have suggested that Jesus had given such direction to Peter so that the Apostle, otherwise an ardent supporter and defender of his lord, could elude arrest and trial that terrible night, thereby surviving to lead the church.'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'In Mark the form must be a future, naturally predictive'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'only the construction of Mark 14:30 and Matthew 26:34, which follows it, allows aparnēsē to be the future form.'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'The natural sense is a predictive future'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'The natural sense of the future here is a predicative future, meaning that Jesus was foreseeing or prophesying what Peter would do.'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'The grammar is not conclusive, since Jesus presumably spoke Aramaic'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'this grammatical possibility in two of our four texts is not conclusive, because Jesus would presumably have been speaking to Peter in Aramaic, not Greek.'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'The context, tied to Zechariah 13:7, favors prediction'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'the immediate context of Jesus’ pronouncement in even these accounts also favors a prediction over a command. This is because in those two Gospels it is preceded by Jesus’ statement that “All ye shall be offended because of me this night”'
  - where: 'note 14:30 “Before the cock crow twice”'
    claim: 'Elder Holland: we do not know all; Jesus knew they would not stand with Him and warned Peter'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'We don’t know all that was going on here, nor do we know of protective counsel which the Savior may have given to His Apostles privately, but we do know Jesus was aware that even these precious ones would not stand with Him in the end, and He had warned Peter accordingly.'
