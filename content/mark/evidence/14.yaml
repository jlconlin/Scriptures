  # 14:36
  - where: 'note 14:36 “Abba, Father”'
    claim: 'In Gethsemane Christ cried “Abba”: Papa, or Daddy'
    key: holland-hands-fathers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1999/04/the-hands-of-the-fathers?lang=eng'
    quote: 'In that most burdensome moment of all human history, with blood appearing at every pore and an anguished cry upon His lips, Christ sought Him whom He had always sought—His Father. “Abba,” He cried, “Papa,” or from the lips of a younger child, “Daddy.”'
  - where: 'note 14:36 “Abba, Father”'
    claim: 'Abba with ho patēr; in Mark 14:36 and two other verses; intimate and respectful'
    key: hoskisson-abba
    url: 'https://rsc.byu.edu/vol-6-no-1-2005/why-abba-new-testament'
    quote: 'What is the Aramaic word abba doing in the Greek New Testament, and what does it signify? It appears in Mark 14:36 and in two other verses.'
  - where: 'note 14:36 “Abba, Father”'
    claim: 'The debate: familiar “daddy” or formal; Hoskisson: both intimate and respectful'
    key: hoskisson-abba
    url: 'https://rsc.byu.edu/vol-6-no-1-2005/why-abba-new-testament'
    quote: 'the question has been raised whether abba means something formal and respectful, like “father,” or something more intimate and familiar, like “daddy.” … I will suggest that abba is both deeply intimate and profoundly respectful.'
  - where: 'note 14:36 “Abba, Father”'
    claim: 'Mark records Jesus using the Aramaic and the Greek word'
    key: hoskisson-abba
    url: 'https://rsc.byu.edu/vol-6-no-1-2005/why-abba-new-testament'
    quote: 'it is clear that Mark records Christ as addressing God with an Aramaic and a Greek word that has something to do with “father/daddy.”'
  - where: 'note 14:36 “Abba, Father”'
    claim: 'One reading: the Suffering Servant’s stewardship report'
    key: hoskisson-abba
    url: 'https://rsc.byu.edu/vol-6-no-1-2005/why-abba-new-testament'
    quote: 'In His role as the steward or Suffering Servant (see Isaiah 53) in God’s plan of redemption, Christ used abba in His final mortal report.'
  - where: 'note 14:36 “Abba, Father”'
    claim: 'The request was always conditional'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'the request, however oft repeated, was always conditional; the accomplishment of the Father’s will was never lost sight of as the object of the Son’s supreme desire.'
  - where: 'note 14:36 “Abba, Father”'
    claim: 'The footnote at “take away” points to 3 Nephi 11:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/14?lang=eng'
    quote: '36a “take away”: 3 Ne. 11:11.'
  # 14:37
