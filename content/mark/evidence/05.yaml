chapter: 5
claims:
  # ---- setting, thread
  - where: setting
    claim: 'After the storm Jesus crossed back from the land of Gadara to the vicinity of Capernaum'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Jesus and His attendants recrossed the lake from the land of Gadara to the vicinity of Capernaum, where He was received with acclamation by a multitude of people'
  - where: setting
    claim: 'The short journey showed Jesus as Master of earth, men and devils'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'In the course of the short journey considered in this chapter, the power of Jesus as Master of earth, men and devils, was manifest in miraculous works of the most impressive kind.'
  - where: setting
    claim: 'Decapolis: district east and southeast of the Sea of Galilee, mostly Greek'
    key: bd-decapolis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/decapolis?lang=eng'
    quote: 'The district east and southeast of the Sea of Galilee, containing a mixed population of Greeks, Syrians, Arabs, and Jews, the Greek element being the greatest'
  - where: setting
    claim: 'Mark sandwiches the woman’s healing inside the story of Jairus’s daughter'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The healing of the hemorrhaging woman (Mark 5:25–34) is surrounded by the story of Jairus’ daughter (Mark 5:21–24, 35–43).'
  - where: thread
    claim: 'Smith reads every miracle of 4:35–5:43 as re-enacting and redeeming an Old Testament story'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'Thus every miracle in Mark 4:35-5:43 is a redemptive reading of a story from the Hebrew Bible: Mark 4:35-41 redeems Jonah; Mark 5:1-20 resonates with Exodus 14-15'
  # ---- notes, the man among the tombs
  - where: 'note 5:1 “A Gentile shore”'
    claim: 'Decapolis lay east and southeast of the lake, its population mostly Greek'
    key: bd-decapolis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/decapolis?lang=eng'
    quote: 'The district east and southeast of the Sea of Galilee, containing a mixed population of Greeks, Syrians, Arabs, and Jews, the Greek element being the greatest'
  - where: 'note 5:1 “A Gentile shore”'
    claim: 'A region, not a town, is meant; Gadara, Gerasa and Gergesa were all in the district'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'As stated in the text, a whole region or section is referred to, not a town. … In that district of Perea there were at the time towns named respectively Gadara, Gerasa, and Gergesa'
  - where: 'note 5:1 “A Gentile shore”'
    claim: 'The SBL text of Mark 5:1 reads Gerasenes; the Textus Receptus Gadarenes'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/5-1.htm'
    quote: 'SBL Greek New Testament 2010 Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν Γερασηνῶν.'
  - where: 'note 5:7 “The unclean spirit knows who He is”'
    claim: 'In Mark the title Son of God is used by God and the demons, the narrator, Jesus, His enemies and the centurion'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'It is used by non-human beings (God and the demons), by the narrator, by Jesus as a direct reference to himself, by Jesus’ enemies (antagonistically or ironically), and by the centurion'
  - where: 'note 5:7 “The unclean spirit knows who He is”'
    claim: 'The demons knew who Jesus was though the religious authorities did not; Jesus did not want demonic testimony'
    key: keller-mark-luke
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/mark-luke'
    quote: 'He did not want demonic testimony to His messiahship. Yet the knowledge of the demons points to an interesting dichotomy. The minions of Satan recognized and knew who Jesus was, but the religious authorities did not.'
  - where: 'note 5:7 “The unclean spirit knows who He is”'
    claim: 'The adjuration was blasphemous presumption; the demons knew they had to obey'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'impelled by the power of his demon control, prostrated himself before Christ … with blasphemous presumption exclaimed: “I adjure thee by God, that thou torment me not.” … The demons, by whom the man was possessed and controlled, recognized the Master, whom they knew they had to obey'
  - where: 'note 5:7 “The unclean spirit knows who He is”'
    claim: 'The footnote to “adjure” gives “implore”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/5?lang=eng'
    quote: 'OR implore'
  - where: 'note 5:9 “Legion”'
    claim: 'Legion is a Latin word for a body of soldiers, about 6,826 men under Augustus'
    key: thayer
    url: 'https://biblehub.com/greek/3003.htm'
    quote: '(a Latin word), a legion (a body of soldiers whose number differed at different times, and in the time of Augustus seems to have consisted of 6,826 men (i. e. 6,100 foot soldiers, and 726 horsemen)): Matthew 26:53; Mark 5:9, 15'
  - where: 'note 5:9 “Legion”'
    claim: 'Legio is one of Mark’s Latinisms, suggesting a Roman audience'
    key: huntsman-petrine-mark
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/petrine-kerygma-gospel-according-mark'
    quote: 'Mark also includes Latinisms—Latin words like legio (English, “legion,” in Mark 5:9) that are transliterated into Greek—and uses other terms suggestive of a Roman audience.'
  - where: 'note 5:9 “Legion”'
    claim: 'The man could no longer tell his own personality from the spirits’'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'So complete was his possession by wicked spirits that he could no longer distinguish between his individual personality and theirs.'
  - where: 'note 5:13 “Why the devils wanted the swine”'
    claim: 'Joseph Smith: the devil, having no body, preferred a swine’s body to none'
    key: wjs-1841-01-05
    url: 'https://rsc.byu.edu/words-joseph-smith/5-january-1841-tuesday-old-homestead'
    quote: 'The Devil has no body, and herein is his punishment. He is pleased when he can obtain the tabernacle of man and when cast out by the Savior he asked to go into the herd of swine showing that he would prefer a swines body to having none.'
  - where: 'note 5:13 “Why the devils wanted the swine”'
    claim: 'Under the law of Moses swine were unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: 'And the swine, though he divide the hoof, and be clovenfooted, yet he cheweth not the cud; he is unclean to you.'
  - where: 'note 5:13 “Why the devils wanted the swine”'
    claim: 'The destruction of the swine was not by Jesus’s command'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'the destruction of the swine, which latter occurrence, however, was not in pursuance of His command.'
  - where: 'note 5:13 “Why the devils wanted the swine”'
    claim: 'Smith reads the drowned swine, likely food for the Roman army, as echoing Pharaoh’s army drowned; she calls the allusion subtle'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'Mark 5:1-20 resonates with Exodus 14-15 as the destruction of the swine — likely the food supply for the Roman army — reenacts the drowning of Pharaoh’s army; … Admittedly, the allusion to Exodus 14-15 in Mark 5:1-20 is more subtle, perhaps because of its Gentile setting.'
  - where: 'note 5:17 “Why they asked Him to leave”'
    claim: 'They were afraid of One who could work such wonders, conscious of their unworthiness'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'It was the fear that sinful men feel in the presence of the Righteous. … They were in part heathen, and had but superstitious conceptions of Deity. Their prayer that Jesus leave them brings to mind the ejaculation of Simon Peter'
  - where: 'note 5:19 “Sent home to tell”'
    claim: 'The command to tell is the one odd exception to Mark’s rule of secrecy'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'There is one odd exception to the general rule of secrecy: Jesus tells the Gentile man who had had a demon to tell his family that Jesus had healed him (see Mark 5:19).'
  - where: 'note 5:19 “Sent home to tell”'
    claim: 'Christ knew when to forbid and when to permit publication; the man became a missionary through the Decapolis'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'In His own wisdom Christ knew when to prudently forbid and when to permit publication of His doings.'
  - where: 'note 5:19 “Sent home to tell”'
    claim: 'The man became a missionary through the Decapolis'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The man became a missionary, not alone in his home town but throughout Decapolis, the region of the ten cities'
  # ---- notes, Jairus and the woman
  - where: 'note 5:22 “A ruler of the synagogue at His feet”'
    claim: 'The ruler of the synagogue was its chief official, generally a scribe, who cared for the building and the services'
    key: bd-synagogue
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/synagogue?lang=eng'
    quote: 'The most important official was the Ruler of the Synagogue (Mark 5:22; Luke 13:14), who was generally a scribe, had care of the building, and superintended the various services.'
  - where: 'note 5:22 “A ruler of the synagogue at His feet”'
    claim: 'His coming shows the impression Christ’s ministry made in ecclesiastical circles; few of the upper classes would risk their standing'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The fact of this man’s coming to Jesus, with the spirit of faith and supplication, is an evidence of the deep impression the ministry of Christ had made even in priestly and ecclesiastical circles.'
  - where: 'note 5:22 “A ruler of the synagogue at His feet”'
    claim: 'Few of the upper classes would sacrifice prestige by acknowledging discipleship'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'though few belonging to the upper classes were willing to sacrifice prestige and popularity by acknowledging their discipleship.'
  - where: 'note 5:23 “Lay thy hands on her”'
    claim: 'The laying on of hands is a gesture by which power and authority are channeled to the recipient'
    key: calabro-nonverbal
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/nonverbal-communication-new-testament'
    quote: 'the hands are understood as a medium by which power, spiritual gifts, and authority are channeled from the one performing the gesture to the one receiving it.'
  - where: 'note 5:25 “Twelve years unclean”'
    claim: 'The law: a woman with an issue beyond her time is unclean, and whoever touches what she sat on'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'And whosoever toucheth those things shall be unclean, and shall wash his clothes, and bathe himself in water, and be unclean until the even.'
  - where: 'note 5:25 “Twelve years unclean”'
    claim: 'Her illness made her unclean and anyone she touched; her family likely no longer touched her'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'According to the law of Moses, such an illness rendered the woman ritually unclean and anything or anyone that she touched was subsequently rendered unclean (see Leviticus 15:25–31). … Most likely, her family members no longer touched her, and her friends abandoned her long ago.'
  - where: 'note 5:25 “Twelve years unclean”'
    claim: 'She was depleted physically, socially, financially and emotionally, but not spiritually'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'The woman therefore represents depletion in nearly every way—physically, socially, financially, and emotionally—but not spiritually.'
  - where: 'note 5:25 “Twelve years unclean”'
    claim: 'Under the purity laws she should not have been in the crowd or touching Jesus'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'the hemorrhaging woman should not be in a crowd and should not be touching Jesus.'
  - where: 'note 5:32 “Why He asked who touched Him”'
    claim: 'An actual giving of His own strength'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'That there was an actual giving of His own strength to the afflicted whom He healed is evident from the present instance.'
  - where: 'note 5:32 “Why He asked who touched Him”'
    claim: 'Jesus led her to confession to correct her misapprehension and confirm her faith'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'She believed that the influence of Christ’s person, and even that attaching to His raiment, was a remedial agency, ample to cure her malady; but she did not realize that the power to heal was an inherent attribute to be exercised at His will, and as the influence of faith might call it forth. … To correct her misapprehension and to confirm her faith, Jesus gently subjected her to the necessary ordeal of confession'
  - where: 'note 5:32 “Why He asked who touched Him”'
    claim: 'Publicity was made sure by His own action, when she wanted secrecy'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'we see here that publicity was made sure by His own action, and that too, when secrecy was desired by the recipient of the blessing.'
  - where: 'note 5:32 “Why He asked who touched Him”'
    claim: 'Asking a question He knew the answer to gives an opportunity for confession'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'In every case there is a moral purpose in the question, an opportunity given even at the latest moment for making good at least a part of the error by its unreserved confession.'
  - where: 'note 5:32 “Why He asked who touched Him”'
    claim: 'She had planned to be healed unseen; now she must acknowledge it publicly'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'By touching merely the hem of his garment, the woman may have believed that she could be healed without rendering the Savior unclean and without calling down further denunciation and disgust from her neighbors. Now she must stretch her faith to publicly acknowledge what she had done.'
  - where: 'note 5:34 “Daughter, and made whole”'
    claim: 'Sōzō: to save, heal, make well; used at Mark 5:23, 28 and 34; also of salvation in the biblical sense'
    key: thayer
    url: 'https://biblehub.com/greek/4982.htm'
    quote: 'to save a suffering one (from perishing), e. g. one suffering from disease, to make well, heal, restore to health: Matthew 9:22; Mark 5:34; … passive, Matthew 9:21; Mark 5:23, 28'
  - where: 'note 5:34 “Daughter, and made whole”'
    claim: 'The verb can mean physical healing or spiritual salvation'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'The verb used here can refer to physical healing as well as to spiritual salvation.'
  - where: 'note 5:34 “Daughter, and made whole”'
    claim: 'Naming her daughter gives her a new identity and places her in Jesus’s family (3:31–35)'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'Much as Adam named his wife Eve, this story has Jesus name the woman his daughter; the name gives her a new identity (especially since she is not otherwise named in the story). The designation of daughter echoes earlier stories in Mark when Jesus called the palsied man his son (Mark 2:5) and when Jesus claimed not his biological kin but rather those who listened to him as his family (Mark 3:31-35).'
  - where: 'note 5:34 “Daughter, and made whole”'
    claim: 'Smith reads the story as re-enacting and redeeming Eve’s fall'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'I will show how the story of the woman with the hemorrhage of blood (Mark 5:25-34) redeems the story of the fall of Eve (Genesis 3) by paralleling and then inverting that text.'
  - where: 'note 5:34 “Daughter, and made whole”'
    claim: 'She told the whole truth, taking responsibility, unlike Adam and Eve'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'There is a pattern of avoiding responsibility by ascribing responsibility to someone else. In contrast, the hemorrhaging woman told the whole truth when she was questioned (Mark 5:32).'
  - where: 'note 5:36 “Be not afraid, only believe”'
    claim: 'Jairus showed no impatience at the delay; Jesus sustained his sorely taxed faith'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'No intimation is given that Jairus showed impatience or displeasure over the delay; he had placed trust in the Master and awaited His time and pleasure'
  - where: 'note 5:36 “Be not afraid, only believe”'
    claim: 'On the way Jairus saw a faith greater than his own, in a woman ill as long as his daughter had lived'
    key: olson-ministered
    url: 'https://rsc.byu.edu/learn-me/they-ministered-unto-him-their-substance'
    quote: 'In the interim, Jairus witnessed someone with greater faith in the Savior’s power than he possessed at his first petition to Christ. Walking toward his home with Jesus, Jairus saw such faith exemplified in the form of a woman who had been ill for as long as his daughter had lived.'
  - where: 'note 5:39 “Mourners, and a short sleep”'
    claim: 'Professional mourners and flute players had already been summoned'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Professional mourners, including singers of weird dirges, and minstrels who made great noise with flutes and other instruments, had already been summoned to the house.'
  - where: 'note 5:39 “Mourners, and a short sleep”'
    claim: 'They knew she was dead; the funeral followed death quickly and was being prepared'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Moreover, they knew the maid was dead; preparations for the funeral, which custom required should follow death as speedily as possible, were already in progress.'
  - where: 'note 5:39 “Mourners, and a short sleep”'
    claim: 'Death spoken of as sleep was common speech; His words meant her sleep would be short'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Our Lord’s statement to the noisy mourners that “the damsel is not dead but sleepeth” told that her sleep was to be of short duration. It was a rabbinical and common custom of the time to speak of death as a sleep'
  - where: 'note 5:39 “Mourners, and a short sleep”'
    claim: 'Hired mourning women were an old custom in Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng'
    quote: 'Consider ye, and call for the mourning women, that they may come; and send for cunning women, that they may come:'
  - where: 'note 5:41 “Talitha cumi”'
    claim: 'Talitha: Aramaic, feminine of “a youth,” a damsel, maiden'
    key: thayer
    url: 'https://biblehub.com/greek/5008.htm'
    quote: 'a Chaldean word טְלִיתָא (according to Kautzsch (Gram. d. Biblical-Aram., p. 12) more correctly, טַלְיְתָא, feminine of טַלְיָא, ''a youth''), a damsel, maiden: Mark 5:41.'
  - where: 'note 5:41 “Talitha cumi”'
    claim: 'Koumi: the feminine imperative, arise'
    key: thayer
    url: 'https://biblehub.com/greek/2891.htm'
    quote: 'the Hebrew קוּמִי (impv. feminine; the other (masculine) form must be regarded as having become an interjection)), arise: Mark 5:41.'
  - where: 'note 5:41 “Talitha cumi”'
    claim: 'Mark preserves the most Aramaic phrases; better “Little one, get up,” an example of His kindness'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Of the four Gospels, Mark preserves the most Aramaic phrases used by Jesus. … the phrase could better be rendered as “Little one, get up,”[44] a great example of the kindness Jesus had for those around him.'
  - where: 'note 5:41 “Talitha cumi”'
    claim: 'Mark translates Aramaic for a non-Jewish audience'
    key: farnes-synoptic-gospels
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/synoptic-gospels'
    quote: 'Strathearn and Judd conclude that “if Mark’s audience were Jewish and spoke Aramaic, there would be no need for such explanations.”'
  - where: 'note 5:41 “Talitha cumi”'
    claim: 'The very syllables were kept; they attracted special notice'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/5.htm'
    quote: 'the Evangelist gives the very syllables which had fallen from the lips of the Healer, and been proved to be words of power.'
  - where: 'note 5:41 “Talitha cumi”'
    claim: 'Took by the hand: krateō tēs cheiros, a firm, sustained handclasp'
    key: calabro-nonverbal
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/nonverbal-communication-new-testament'
    quote: 'The Greek idiom is krateō tēs cheiros “grasp by the hand,” denoting a firm, sustained handclasp'
  - where: 'note 5:42 “Two daughters, twelve years”'
    claim: 'Only Mark gives the girl’s age, linking her to the woman; twelve recalls Israel’s tribes; daughter of the synagogue and daughter of Jesus'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Thus, only in Mark’s account does this detail link the little girl and the woman. Twelve was a symbolic number, carrying associations of leadership from the idea of the twelve tribes of Israel. Mark associates both the woman and the girl with Israel'
  - where: 'note 5:42 “Two daughters, twelve years”'
    claim: 'The daughter of the synagogue is passive; the daughter of Jesus active and speaks for herself'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'the daughter of the synagogue is passive and is only healed through the intervention of her father; the daughter of Jesus is active (in socially inappropriate ways) and speaks for herself.'
  - where: 'note 5:42 “Two daughters, twelve years”'
    claim: 'The sandwich undoes both effects of the Fall, spiritual and physical death'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'Because the hemorrhaging woman’s story is enclosed by the story of the raising of Jairus’s daughter, both of the main effects of the Fall — sin and death, or spiritual death and physical death — are done away with in this section of the text.'
  - where: 'note 5:42 “Raised to mortal life”'
    claim: 'The raising of the dead foreshadowed His resurrection'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Jesus demonstrated he had power over physical death and thus foreshadowed his resurrection.'
  - where: 'note 5:42 “Raised to mortal life”'
    claim: 'Shared vocabulary: egeiro at 5:41 and 16:6; ekstasis only at 5:42 and 16:8; mocked at 5:40 and 14:65'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: '(2) the same word translated as “rise” (Greek: egeiro) in 5:41 is used in Mark 16:6 to describe Jesus’ rising; (3) in both stories, Jesus is mocked (Mark 5:40 and 14:65); (4) the word for “astonishment” (Greek: ekstasis) is used in Mark only for the reaction to the girl’s raising and the reaction to Jesus’ raising (Mark 5:42 and 16:8)'
  - where: 'note 5:42 “Raised to mortal life”'
    claim: 'Restoration to mortal life differs from resurrection; she had to die again; Christ was the first to rise immortal'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'the miracle consisted in reuniting the spirit and the body in a continuation of the interrupted course of mortal existence. That the subject of each of these miracles had to subsequently die is certain. Jesus Christ was the first of all men who have lived on earth to come forth from the tomb an immortalized Being'
  - where: 'note 5:42 “Raised to mortal life”'
    claim: 'Elijah and Elisha labored and invoked Jehovah; Jesus only commanded'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'By both Elijah and Elisha the wonderful change was brought about only after long and labored ministrations, and earnest invocation of the power and intervention of Jehovah; but Jehovah, embodied in flesh as Jesus Christ, did nothing outwardly but command, and the bonds of death were immediately broken.'
  - where: 'note 5:43 “Silence, and something to eat”'
    claim: 'The reasons for the injunction are not stated; the raising could not be kept secret'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The reasons for this injunction are not stated. … the fact that the maiden had been raised to life could not be kept secret, and the means by which so great a wonder had been wrought would certainly be inquired into.'
  - where: 'note 5:43 “Silence, and something to eat”'
    claim: 'Food was given because bodily needs had returned with her life'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Jesus directed that food be given her, as bodily needs, suspended by death, had returned with the girl’s renewal of life.'
