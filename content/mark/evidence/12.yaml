chapter: 12
claims:
  - where: setting
    claim: 'The chief priests, scribes and elders made up the Sanhedrin, court and civil body, and were the three groups of the first Passion prediction'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'These were the main groups that made up the Sanhedrin, the council that not only served as the supreme Jewish law court but also the chief civil body under the Roman occupation. Significantly, these are the very three groups that Jesus mentioned in his first passion prediction'
  - where: setting
    claim: 'The temple was crowded with Passover pilgrims, who were the audience'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Both days’ teachings took place in a Jerusalem and temple that were teeming with pilgrims who had come for the Passover festival. These crowds were the audience'
  - where: setting
    claim: 'In Mark’s chronology the disciples saw the withered fig tree on Tuesday morning'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'According to the chronology of Mark, the disciples saw the withered fig tree as they were returning with Jesus to Jerusalem Tuesday morning.'
  - where: setting
    claim: 'Many harmonies place all these teachings on Tuesday; Matthew frames the vineyard parable with two more parables'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'While many Gospel harmonies, attempting to reconcile Matthew and Luke with the sequence of events in Mark, place all these teachings on Tuesday'
  - where: setting
    claim: 'Matthew frames the parable of the vineyard with two other parables'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Matthew further highlights the condemnation of those who reject Jesus by framing the parable of the vineyard with two others'
  - where: thread
    claim: 'Three questions, each from a different group'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The examination of Jesus in the temple consisted of three specific questions, each posed by a different group.'
  - where: thread
    claim: 'Then Jesus turns the tables with a question from Psalm 110:1'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'During the lull, Jesus turns the tables on his opponents, asking a question based upon Psalm 110:1'
  - where: thread
    claim: 'The approval of the one scribe sharpens the condemnation of the scribes as a group, as does the widow'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Mark’s previous approval of the single scribe who had responded favorably to Jesus highlights the condemnation of the group as a whole, as does Jesus’s warm approval of the motivation of the poor widow'
  - where: thread
    claim: 'No fault found in His answer, yet the establishment would convict Him'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'although his opponents could find no civic or spiritual fault in his reply, the political and religious establishment would nonetheless convict him.'
  - where: section 2 plain
    claim: '“Render” is apodote, “give back”; the coin was a denarius'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'By saying “give back” (Greek, apodote; KJV, “render”)'
  - where: section 4 plain
    claim: '“Discreetly” means wisely, prudently'
    key: thayer
    url: 'https://biblehub.com/greek/3562.htm'
    quote: 'adverb wisely, prudently, discreetly: Mark 12:34'
  - where: section 5 plain
    claim: '“The common people” is better “the great body of the people”'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'Better, the great body of the people.'
  - where: section 7 plain
    claim: 'The mite (lepton) was the smallest coin, half a quadrans'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'The lepton (or mite) (Mark 12:42; Luke 12:59; 21:2), the smallest bronze coin used by the Jews. Equaled one-half quadrans.'
  - where: 'note 12:1 “Isaiah’s vineyard, and its tenants”'
    claim: 'A vineyard represented Israel; the hedge, wine trough and tower tie it to Isaiah 5'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Some of its details—surrounding the vineyard with a protective wall or hedge, digging a wine trough, and building a watchtower—linked it particularly with the song of the Lord’s vineyard in Isaiah 5.'
  - where: 'note 12:1 “Isaiah’s vineyard, and its tenants”'
    claim: 'Owner God, son Jesus, servants the prophets, tenants the leaders of Israel up to those opposing Jesus'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Hence, the owner was God, the son is Jesus, and the previous servants were the prophets whom the Lord had sent to Israel. This makes the tenants, who, importantly, do not own the vineyard but are only responsible for caring for it, the leaders of Israel'
  - where: 'note 12:1 “Isaiah’s vineyard, and its tenants”'
    claim: 'Isaiah’s vineyard gave wild fruit; here the fruit is good but withheld'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'there the vineyard brought forth wild, or worthless, fruit (Isa 5:2); here the fruit is presumably good, but the tenants refuse to yield it to its true owner.'
  - where: 'note 12:1 “Isaiah’s vineyard, and its tenants”'
    claim: 'The charge is against the leadership and institutions, not all Israel'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'it is not all Israel—or, in this case, the Jewish people at the time of Jesus—that are not bringing forth fruit, but rather their leadership and the institutions that they were wrongly controlling.'
  - where: 'note 12:1 “Isaiah’s vineyard, and its tenants”'
    claim: 'Isaiah’s vineyard has a tower and a winepress'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/5?lang=eng'
    quote: 'and built a tower in the midst of it, and also made a winepress therein'
  - where: 'note 12:6 “One son, his wellbeloved”'
    claim: 'Mark’s “one, well-beloved son,” agapētos, is the Father’s word at the baptism and the Transfiguration'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the owner sends his son, who in Mark is his one, “well-beloved son” (Greek, agapēton). This is the very term used on two other occasions by the Father of Jesus, at his baptism and at the Transfiguration'
  - where: 'note 12:10 “The stone from Psalm 118”'
    claim: 'The parable ends with Psalm 118, connecting it with the triumphal entry'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Both Mark and Matthew have Jesus end his parable with a reference to Psalm 118, creating a connection with the triumphal entry during which the crowds acclaimed Jesus with a line from that very psalm.'
  - where: 'note 12:10 “The stone from Psalm 118”'
    claim: 'Those who accepted Him cried “Save now”; the stone line challenges those who reject Him'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Whereas the cry of those who accepted Jesus was “Save now,” the line that Jesus quotes here challenges his opponents’ rejection of him'
  - where: 'note 12:10 “The stone from Psalm 118”'
    claim: 'The Gospels leave the stone unidentified though the opponents understood; the JST makes it explicit'
    key: jackson-adding-words
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/adding-words-jesus'
    quote: 'but in the Gospels the reference to Jesus, though understood by his opponents, is not expressed in the text. Joseph Smith’s revision of Matthew makes this identification explicit'
  - where: 'note 12:13 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The Pharisees debated Jesus in Galilee; the leading Pharisees of Jerusalem were in the Sanhedrin'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The Pharisees had been, if not always inveterate opponents, at least intense debating partners throughout the Galilean ministry,[5] although the leading Pharisees in Jerusalem were part of the Sanhedrin'
  - where: 'note 12:13 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The Herodians are obscure, named elsewhere only at Mark 3:6, usually taken as a party supporting the Herods'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The Herodians are a more obscure group, being mentioned elsewhere only in Mark 3:6'
  - where: 'note 12:13 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'Usually a political party supporting the Herods for some autonomy under Rome'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'usually they are assumed to have been a largely political party that supported the Herodian family as the means to maintain some degree of Jewish autonomy under Roman authority.'
  - where: 'note 12:13 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The dilemma: yes, and the Pharisees accuse; no, and the Herodians accuse'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'If he said that it was permissible to pay the tax, the Pharisees in the delegation could claim that he was betraying God or at least was disloyal to the Jewish nation; if he said it was not, the Herodians could claim that he was advocating resistance to Roman demands.'
  - where: 'note 12:13 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'Judea’s first governor was installed in AD 6'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'Shortly after Coponius was made the first governor of Judea in AD 6'
  - where: 'note 12:13 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'As a province, Judea’s taxes went to the emperor; payers were seen as traitors, refusers as disloyal'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'As a result, the former were commonly seen as traitors to traditional Judaism, while the latter were regarded as unfaithful subjects of Rome; to support one was to betray the other.'
  - where: 'note 12:13 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'With Judea a province, taxes were paid to the emperor'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'However, with Judea now a province of Rome, the collected taxes were officially paid to the emperor for the glory of the empire.'
  - where: 'note 12:13 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The compliment was true in every word but false in intent, meant to make Him unwary'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'This studied tribute to our Lord’s courage and independence of thought and action was truthful in every word; but as uttered by those fulsome dissemblers and in their nefarious intent, it was egregiously false.'
  - where: 'note 12:17 “Whose image, and what to give back”'
    claim: 'The denarius bore Tiberius’s image and an inscription claiming divine sonship and high priesthood, doubly offensive'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'the denarius, or Roman coin, with which the tax was paid had both the image of the emperor Tiberius and the inscription “Tiberius Caesar Augustus, son of the deified Augustus, high priest,” which both offended Jewish sensibilities about graven images and claimed divine and priestly prerogatives'
  - where: 'note 12:17 “Whose image, and what to give back”'
    claim: '“Render” is apodote, “give back”; Caesar minted and owned the coin; all things belong to God'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Jesus both acknowledged the civic role of the emperor, who minted, and in a sense still owned, the very coin under discussion, and proclaimed the greater obligation we have to God, since, in truth, all created things belong to him.'
  - where: 'note 12:17 “Whose image, and what to give back”'
    claim: 'His opponents found no fault, yet the establishment would convict Him'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'although his opponents could find no civic or spiritual fault in his reply, the political and religious establishment would nonetheless convict him.'
  - where: 'note 12:17 “Whose image, and what to give back”'
    claim: 'Superscription means inscription'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'Superscription.—Better, inscription'
  - where: 'note 12:17 “Whose image, and what to give back”'
    claim: 'The nation used Roman coins, and to make a sovereign’s coins current was to acknowledge his authority'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'they accepted and circulated among themselves the Roman coinage as a common medium of exchange; and it was a criterion of recognition among the Jews that to make current the coins of any sovereign was to acknowledge his royal authority.'
  - where: 'note 12:17 “Whose image, and what to give back”'
    claim: 'Every soul bears God’s image; give God yourselves'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Every human soul is stamped with the image and superscription of God, however blurred and indistinct the line may have become through the corrosion or attrition of sin'
  - where: 'note 12:17 “Whose image, and what to give back”'
    claim: 'Modern revelation requires obedience to governments (D&C 58:21–22; 98:4–6; Articles of Faith)'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Through the medium of modern revelation, the Lord has required of His people in the present dispensation, obedience to and loyal support of the duly established and existing governments in all lands. See D&C 58:21–22; 98:4–6'
  - where: 'note 12:17 “Whose image, and what to give back”'
    claim: 'He was later accused of forbidding tribute (Luke 23:2)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'could accuse Him, as He was eventually accused, of “perverting the nation, and forbidding to give tribute to Cæsar” (Luke 23:2).'
  - where: 'note 12:18 “A question about the resurrection, not about marriage”'
    claim: 'The Sadducees: old high-priestly families, aristocracy, held to the letter of Moses, denied tradition, angels and spirits, immortality'
    key: bd-sadducees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sadducees?lang=eng'
    quote: 'The party consisted of old high-priestly families who came to the front during the Maccabean war. They formed the Jewish aristocracy and were powerful, though quite small in numbers.'
  - where: 'note 12:18 “A question about the resurrection, not about marriage”'
    claim: 'They denied angels and spirits and immortality'
    key: bd-sadducees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sadducees?lang=eng'
    quote: 'they were opposed to the Pharisees as to the belief in angels and spirits; they refused also to accept the doctrine of immortality as a necessary part of the Jewish faith.'
  - where: 'note 12:18 “A question about the resurrection, not about marriage”'
    claim: 'They opposed Jesus over the cleansing of the temple and the apostles for preaching the Resurrection'
    key: bd-sadducees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sadducees?lang=eng'
    quote: 'Their opposition to our Lord was the result of His action in cleansing the temple, which they regarded as an infringement of their rights. They opposed the work of the Apostles because they preached the Resurrection'
  - where: 'note 12:18 “A question about the resurrection, not about marriage”'
    claim: 'It was a question about the resurrection, meant to make it look absurd'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Instead, they were trying to use an extreme example involving the practice of levirate marriage to demonstrate that believing in a resurrection was absurd.'
  - where: 'note 12:18 “A question about the resurrection, not about marriage”'
    claim: 'Levirate from Latin levir; a brother fathered a child for the dead brother'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Levirate marriage, a term that comes from the term for a husband’s brother (Latin, levir), was a practice established in the law whereby a dead man’s brother'
  - where: 'note 12:18 “A question about the resurrection, not about marriage”'
    claim: 'Levirate marriage was temporary; no expectation the brothers would be married to her in the next life'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'levirate marriages were only temporary arrangements to begin with—the child conceived “belonged to” the dead brother, and the living brother had no further conjugal rights after the child was born. There would be no expectation that the second to seventh brother would be married to the woman in the next life.'
  - where: 'note 12:18 “A question about the resurrection, not about marriage”'
    claim: 'Seven brothers was possible under the law but most improbable'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'was possible under the Mosaic code relating to levirate marriages; but it was a most improbable instance.'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'The verse can be hard for Latter-day Saints who love eternal marriage'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'can be, at first glance, a difficult one for Latter-day Saints because of our understanding of, and love for, the principle of eternal marriage.'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'What is excluded is the process of marrying, not the state of being married'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'what Jesus excludes from the afterlife is the process of ‘marrying and being given in marriage’ rather than the resultant state of being married.'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'Some Christian writers from the second century read the verse as no marriage hereafter'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Some Christian writers from the second century forward took this to mean that the next life would be a non-conjugal state in which marriage would no longer exist'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'The words speak of no creation of marriages, not no existence of marriage'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'with its reference to there being no creation of marriages, rather than no existence of marriage, in the age to come.'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'Levirate marriage and the Sadducees’ unbelief seem to correspond to D&C 132:15–16'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Both the practice of levirate marriage and the Sadducees’s disbelief in resurrection seem to correspond to the teaching in Doctrine and Covenants 132:15–16'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'Early Christians did not take the answer to dissolve marital bonds after death'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'the hopes early Christians expressed for heavenly reunions and living together eternally show that they did not believe Jesus’s answer to the Sadducees implied a dissolution of loving marital and familial bonds after death.'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'Early Christians did not understand those reunions as eternal marriage in the Latter-day Saint sense'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'do not seem to have understood these reunions as “eternal marriage” or “eternal family” in the same sense that modern Latter-day Saints do'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'Marital status must be settled before the resurrection, under priesthood power to seal'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'In the resurrection there will be no marrying nor giving in marriage; for all questions of marital status must be settled before that time, under the authority of the Holy Priesthood, which holds the power to seal in marriage for both time and eternity.'
  - where: 'note 12:25 “No marrying in the resurrection”'
    claim: 'The brothers had married her for mortal life only'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'since all except the first had married her for the duration of mortal life only'
  - where: 'note 12:27 “The God of the living”'
    claim: 'JST Mark 12:28: because ye know not, and understand not the scriptures'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/12?lang=eng'
    quote: 'Ye do err therefore, because ye know not, and understand not the scriptures'
  - where: 'note 12:27 “The God of the living”'
    claim: 'JST Mark 12:32: for he raiseth them up out of their graves'
    key: jst-mark-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/12?lang=eng'
    quote: 'He is not therefore the God of the dead, but the God of the living; for he raiseth them up out of their graves.'
  - where: 'note 12:27 “The God of the living”'
    claim: 'Denying the resurrection is denying the power of God'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Next, and more significantly, by denying the resurrection, Jesus pointed out that they were, in fact, denying the power of God.'
  - where: 'note 12:27 “The God of the living”'
    claim: 'The patriarchs lived on in the spirit world; Jesus’s resurrection would overcome death for them'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Not only did Abraham, Isaac, and Jacob continue to live in the spirit world (the Sadducees did not seem to believe in any kind of life after death), but through Jesus’s own resurrection he would overcome physical death for them and for us.'
  - where: 'note 12:27 “The God of the living”'
    claim: 'The Sadducees upheld the law yet made the title valid only for the patriarchs’ mortal lives'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'made the exalted title, under which the Lord had revealed Himself to Moses, valid only during the brief mortal existence of the progenitors of the Israelitish nation.'
  - where: 'note 12:29 “The Shema, and why the first commandment is first”'
    claim: 'Later authorities counted 613 commandments; Jesus cites two passages'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'a question that was understandable, given that legal authorities would later identify 613 different commandments in the Mosaic law.'
  - where: 'note 12:29 “The Shema, and why the first commandment is first”'
    claim: 'The Shema, the daily prayer, recited twice daily'
    key: sc-knowhy-517
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-love-god-with-all-thy-mind'
    quote: 'Thus, the Shema is recited twice daily, once in the morning and once at night.'
  - where: 'note 12:29 “The Shema, and why the first commandment is first”'
    claim: 'The commandment was not new; the ranking was'
    key: sc-knowhy-517
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-love-god-with-all-thy-mind'
    quote: 'Christ’s response to the publican was not revelatory in the sense that this commandment was new. What was revelatory was his classification of exactly how important it was'
  - where: 'note 12:29 “The Shema, and why the first commandment is first”'
    claim: 'Why the first commandment is first'
    key: benson-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1988/04/the-great-commandment-love-the-lord?lang=eng'
    quote: 'Why did God put the first commandment first? Because He knew that if we truly loved Him we would want to keep all of His other commandments.'
  - where: 'note 12:34 “Not far from the kingdom”'
    claim: 'Matthew ends with Jesus’s answer; Mark continues with the scribe’s reply'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'While Matthew ends his version of this episode with Jesus’s answer, Mark continues with the expert at the law responding favorably to Jesus'
  - where: 'note 12:34 “Not far from the kingdom”'
    claim: 'Scribes in Jerusalem usually opposed Jesus; this one seemed sincere'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Generally, at least in Jerusalem, these legal experts are linked with the chief priests and elders as being opposed to Jesus,[14] but this particular scribe seemed sincere, perhaps because of the ways he had heard Jesus respond to previous questions.'
  - where: 'note 12:34 “Not far from the kingdom”'
    claim: 'Love is greater than the sacrifices the temple was concerned with'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'is greater than the ritual sacrifices with which the temple was concerned.'
  - where: 'note 12:34 “Not far from the kingdom”'
    claim: 'The scribe repeats the answer without the possessive, perhaps less personal devotion'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'the expert repeats Jesus’s answer without the possessive, perhaps indicating less personal devotion.'
  - where: 'note 12:34 “Not far from the kingdom”'
    claim: 'Nounechōs means wisely, prudently'
    key: thayer
    url: 'https://biblehub.com/greek/3562.htm'
    quote: 'νουνεχῶς (νοῦς and ἔχω (cf. Lob. ad Phryn., p. 599)), adverb wisely, prudently, discreetly: Mark 12:34.'
  - where: 'note 12:34 “Not far from the kingdom”'
    claim: 'Recognizing the two commandments brought him to the threshold of the kingdom'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'Even the recognition of that righteousness as consisting in the fulfilment of the two commandments that were exceeding broad, brought a man as to the very threshold of the Kingdom.'
  - where: 'note 12:34 “Not far from the kingdom”'
    claim: 'His “Master” seems genuine, but there is no sign he asked more or followed'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'There is one exception to this pattern: the use of “Master” in Mark 12:32 seems genuine, since Jesus’ interlocutor repeats his words in agreement. But Mark 12:34 makes it problematic: while the scribe is close to the kingdom of God, there is no indication that he either asks more questions or follows Jesus.'
  - where: 'note 12:37 “David’s son and David’s Lord”'
    claim: 'The Messiah was expected as a son of David who would redeem and restore Israel'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Contemporary messianic expectations said that the Messiah would be a son of David, a future king of David’s line who would redeem Israel and restore her to greatness.'
  - where: 'note 12:37 “David’s son and David’s Lord”'
    claim: 'David understood the Messiah was more than his descendant, already at God’s right hand'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'David had understood that the Messiah was more than one of his descendants: he was already God’s chosen who sat at his right hand millennia before his birth in the flesh.'
  - where: 'note 12:37 “David’s son and David’s Lord”'
    claim: 'The question forced every group to reconsider its messianic expectations'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'forces all these groups to reconsider their own contemporary messianic expectations'
  - where: 'note 12:37 “David’s son and David’s Lord”'
    claim: 'The crowds rejoiced at His overturning the authorities’ understanding'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'While the crowds rejoiced in Jesus’s upending of the understanding of the Jerusalem authorities'
  - where: 'note 12:37 “David’s son and David’s Lord”'
    claim: '“Common people” is better “the great body of the people”; the stress is on number, not class'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'Better, the great body of the people. Stress is laid on the multitude, not on the social condition, of those who thus heard gladly.'
  - where: 'note 12:38 “Long robes and widows’ houses”'
    claim: 'Stolē: a loose outer garment to the feet worn by kings, priests and persons of rank'
    key: thayer
    url: 'https://biblehub.com/greek/4749.htm'
    quote: 'a loose outer garment for men which extended to the feet (cf. English stole (Dict. of Chris. Antiq. under the word)), worn by kings (Jonah 3:6), priests, and persons of rank: Mark 12:38'
  - where: 'note 12:38 “Long robes and widows’ houses”'
    claim: 'The approval of the one scribe sharpens the condemnation of the group; Matthew expands it to the Pharisees with seven woes'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Matthew’s account not only expands the indictment but also extends it to the Pharisees and adds seven damning “woes” that condemn their behavior in detail (Matt 23:1‒36). Mark’s previous approval of the single scribe who had responded favorably to Jesus highlights the condemnation of the group as a whole'
  - where: 'note 12:38 “Long robes and widows’ houses”'
    claim: '“Devour” comes after the feasts: this is what they feast on'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'Here the word has a special force as coming after the mention of the feasts. They seek the highest places at such banquets, our Lord seems to say, and when there, this is what they feast on.'
  - where: 'note 12:38 “Long robes and widows’ houses”'
    claim: 'The hierarchy’s avarice was an open scandal, including taking widows’ houses, under a pretense of sanctity and long prayers'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The avarice of the Jewish hierarchy in our Lord’s lifetime was an open scandal. By extortion and unlawful exaction under cover of religious duty the priestly rulers had amassed an enormous treasure'
  - where: 'note 12:38 “Long robes and widows’ houses”'
    claim: 'Including the houses of dependent widows, made worse by pretended sanctity and wordy prayer'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'including even the houses of dependent widows, formed a considerable proportion; and the perfidy of the practice was made the blacker by the outward pretense of sanctity and the sacrilegious accompaniment of wordy prayer.'
  - where: 'note 12:42 “Two mites in the treasury”'
    claim: 'The treasury receptacle had thirteen trumpet-shaped chests for offerings for the temple and the poor'
    key: thayer
    url: 'https://biblehub.com/greek/1049.htm'
    quote: 'to which were fitted thirteen chests or boxes'
  - where: 'note 12:42 “Two mites in the treasury”'
    claim: 'Thirteen chests with trumpet-shaped receptacles, for purposes marked on them; the rich gave ostentatiously'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Within that space were thirteen chests, each provided with a trumpet-shaped receptacle; and into these the people dropped their contributions for the several purposes indicated by inscriptions on the boxes.'
  - where: 'note 12:42 “Two mites in the treasury”'
    claim: 'Some gave ostentatiously great sums'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'others ostentatiously casting in great sums of silver and gold, primarily to be seen of men.'
  - where: 'note 12:42 “Two mites in the treasury”'
    claim: 'The lepton was the smallest coin used by the Jews, half a quadrans'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'the smallest bronze coin used by the Jews. Equaled one-half quadrans.'
  - where: 'note 12:42 “Two mites in the treasury”'
    claim: 'The farthing is a Latin word of this Gospel, the quadrans, a fourth of an as'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'The “farthing” is one of the Latin words which characterise this Gospel, and represents the quadrans, or fourth-part of a Roman as. The primary meaning of the word rendered “mite” is “thin” or “tiny.”'
  - where: 'note 12:42 “Two mites in the treasury”'
    claim: 'Mark explains the Greek lepta by the Latin quadrans'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'See Mark 12:42, “two mites [Greek: lepta duo], which make a farthing [Latin: quadrans],”'
  - where: 'note 12:44 “All her living”'
    claim: 'He called the disciples to teach them to judge by other than quantity'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/12.htm'
    quote: 'He sought to teach them to judge of acts by other than a quantitative standard.'
  - where: 'note 12:44 “All her living”'
    claim: 'Heaven’s accounts reckon quality and intent; the rich kept back more; her spirit of sacrifice made it acceptable'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'entries are made in terms of quality rather than of quantity, and values are determined on the basis of capability and intent. The rich gave much yet kept back more; the widow’s gift was her all.'
  - where: 'note 12:44 “All her living”'
    claim: 'Not the smallness but the spirit of sacrifice; Talmage quotes 2 Corinthians 8:12'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'It was not the smallness of her offering that made it especially acceptable, but the spirit of sacrifice and devout intent with which she gave.'
  - where: 'note 12:44 “All her living”'
    claim: 'Bios here is that by which life is sustained, “living”'
    key: thayer
    url: 'https://biblehub.com/greek/979.htm'
    quote: 'that by which life is sustained, resources, wealth (A. V. living): Mark 12:44'
  - where: 'note 12:44 “All her living”'
    claim: 'Holon ton bion autēs literally “her whole life”; may foreshadow Jesus’s gift of His whole life'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Because “her whole means of subsistence” (Greek, holon ton bion autēs) literally means “her whole life,”[21] Smith has observed, “The reference to her whole life (KJV: “all her living”) may foreshadow Jesus’ coming gift of his whole life.”'
  - where: 'note 12:44 “All her living”'
    claim: 'Minor characters, the widow among them, are better disciples than the Twelve'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'minor characters who choose to follow Jesus are much better disciples; this group includes'
  - where: christ
    claim: 'The well-beloved son is Jesus'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Hence, the owner was God, the son is Jesus'
  - where: christ
    claim: 'No fault found, yet convicted'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'although his opponents could find no civic or spiritual fault in his reply, the political and religious establishment would nonetheless convict him.'
  - where: christ
    claim: 'Give God yourselves, the souls that bear His image'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'so unto God should be given the souls that bear His image.'
  - where: christ
    claim: 'The first commandment is first because those who love Him want to keep all the others'
    key: benson-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1988/04/the-great-commandment-love-the-lord?lang=eng'
    quote: 'Because He knew that if we truly loved Him we would want to keep all of His other commandments.'
  - where: explore
    claim: 'Huntsman and Hatch’s Tuesday chapter treats the temple debates, the widow and the Olivet discourse'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'After denouncing their hypocrisy and contrasting them unfavorably with a poor widow, Jesus lamented over the fate of Jerusalem before leaving the temple and the city for the Mount of Olives'
