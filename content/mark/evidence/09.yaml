chapter: 9
claims:
  - where: setting
    claim: 'Verse 1 belongs with the discourse of chapter 8'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The division of the chapters is obviously wrong. The verse ought to come, as in St. Matthew and St. Luke, in immediate connection with the foregoing discourse.'
  - where: setting
    claim: 'The Transfiguration in about October, six months before Jesus’s death'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'The Transfiguration occurred in about October, some six months before the death of Jesus.'
  - where: setting
    claim: 'Mark’s account of the boy is the fullest of the three'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The narrative of St. Mark here becomes much the fullest of the three.'
  - where: setting
    claim: 'Only Mark has the worm and the fire repeated'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'the emphatic thrice-repeated words, “Where their worm dieth not, and the fire is not quenched,” are found only in St. Mark.'
  - where: setting
    claim: 'The salt saying of 9:49 is unique to Mark'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The teaching that “every one shall be salted with fire, and every sacrifice shall be salted with salt” (Mark 9:49) is unique to Mark.'
  - where: setting
    claim: 'The journey is framed by the blind man at Bethsaida and Bartimaeus'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'This full, clear spiritual understanding of the mission of Jesus Christ is symbolized by the story of blind Bartimaeus that ends Mark’s second act. Unlike the man healed near Bethsaida, who had his sight restored in stages'
  - where: setting
    claim: 'Second of three predictions; each followed by misunderstanding and corrective teaching'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'In both cases the misunderstanding or misbehavior on the part of Jesus’s disciples is followed by corrective teaching, calling upon them—and us—to be willing to be a servant to others and model the kind of humility exemplified by a child.'
  - where: thread
    claim: 'The father’s faith was new and still partial, and Jesus answered it'
    key: holland-lord-i-believe
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/04/lord-i-believe?lang=eng'
    quote: 'In response to new and still partial faith, Jesus heals the boy, almost literally raising him from the dead, as Mark describes the incident.'

  - where: 'note 9:1 “The kingdom of God come with power”'
    claim: 'The chapter break is misplaced; it may have been made to tie the verse to the Transfiguration, a doubtful reading; Mark’s form agrees with Luke'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The present arrangement may have been made with a view of connecting it with the Transfiguration, as that which was the fulfilment of the promise; but if so, it was based on what is at least a doubtful interpretation.'
  - where: 'note 9:1 “The kingdom of God come with power”'
    claim: 'The Greek verb: the kingdom as having come in its completeness'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'Come with power.—The Greek verb implies that they should see it not “coming,” but as having actually come in its completeness.'
  - where: 'note 9:1 “The kingdom of God come with power”'
    claim: 'The Transfiguration is framed by references to who or what is coming'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The Transfiguration (Mark 9:2–8) is surrounded by references to who or what is coming (Mark 9:1, 9–13).'
  - where: 'note 9:1 “The kingdom of God come with power”'
    claim: 'The coming in glory is future; John the apostle a partial fulfillment'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The event referred to, that of the Son of Man coming in the glory of His Father attended by the angels, is yet future. At least a partial fulfillment of the prediction is presented in the prolongation of the life of John the apostle'

  - where: 'note 9:2 “Peter, James and John”'
    claim: 'The three go apart with Jesus at 5:37, 9:2 and 14:33'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The pattern is also found in the grouping of disciples (Peter, James, and John; see Mark 5:37; 9:2; and 14:33)'
  - where: 'note 9:2 “Peter, James and John”'
    claim: 'The Savior, Moses and Elias gave the promised keys to the three, to carry on the work after the Ascension'
    key: gs-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/transfiguration?lang=eng'
    quote: 'At this important event, the Savior, Moses, and Elias (Elijah) gave the promised keys of the priesthood to Peter, James, and John. With these priesthood keys, the Apostles had the power to continue the work of the kingdom after the Ascension of Jesus.'
  - where: 'note 9:2 “Peter, James and John”'
    claim: 'Peter, James and John conferred the Melchizedek Priesthood in 1829'
    key: bd-peter
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/peter?lang=eng'
    quote: 'In the latter days Peter, with James and John, came from heaven and literally conferred the Melchizedek Priesthood and the keys thereof upon Joseph Smith and Oliver Cowdery. This took place in May or June 1829, near Harmony, Pennsylvania. See D&C 27:12–13.'

  - where: 'note 9:2 “Transfigured”'
    claim: 'Transfigured: changed in form (metamorphosis); the three were also transfigured to withstand the glory (Moses 1:11)'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'At this time he was transfigured (Greek, metemorphothē; compare “metamorphosis”) before his chief apostles (Mark 9:2) … In fact, Peter, James, and John were also transfigured or else they could not have withstood the glory manifested before them (Moses 1:11).'
  - where: 'note 9:2 “Transfigured”'
    claim: 'They saw the Lord glorified and a vision of the earth’s future glory'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'The brethren saw the Lord in a glorified and transfigured state. They also saw a vision of the earth as it will appear in its future glorified condition (D&C 63:20–21; HC 1:283)'
  - where: 'note 9:2 “Transfigured”'
    claim: 'Joseph Smith taught the three were transfigured'
    key: gs-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/transfiguration?lang=eng'
    quote: 'Joseph Smith taught that on the Mount of Transfiguration, Peter, James, and John were also transfigured.'

  - where: 'note 9:3 “No fuller on earth”'
    claim: 'A fuller is a cloth-dresser'
    key: thayer
    url: 'https://biblehub.com/greek/1102.htm'
    quote: '1. a cloth-dresser'
  - where: 'note 9:3 “No fuller on earth”'
    claim: 'A modern translation renders it launderer'
    key: thayer
    url: 'https://biblehub.com/greek/1102.htm'
    quote: 'NASB: launderer'
  - where: 'note 9:3 “No fuller on earth”'
    claim: 'The fuller a bleacher; the homely comparison with the fuller is peculiar to Mark'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The comparison of the bright raiment with clothes that had just passed through the fuller’s or bleacher’s hands, is, in its homely vividness, peculiar to St. Mark.'

  - where: 'note 9:4 “Elias with Moses”'
    claim: 'Elias is the Greek form of Elijah, the prophet of Kings; JST Mark 9:3 means John was present in addition to Elijah'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'It is the New Testament (Greek) form of Elijah (Hebrew) … The curious wording of JST Mark 9:3 does not imply that the Elias at the Transfiguration was John the Baptist, but that in addition to Elijah the prophet, John the Baptist was present'
  - where: 'note 9:4 “Elias with Moses”'
    claim: 'Moses and Elijah two translated beings'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'saw and conversed with Moses and Elijah, two translated beings'
  - where: 'note 9:7 “Hear him”'
    claim: 'Moses for the law, Elijah for the prophets, seen ministering to Jesus'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'Moses, the promulgator of the law, and Elijah the representative of the prophets and especially distinguished among them as the one who had not died, had been seen ministering unto Jesus and subservient to Him.'
  - where: 'note 9:4 “Elias with Moses”'
    claim: 'JST Mark 9:3 text'
    key: jst-mark-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/9?lang=eng'
    quote: 'And there appeared unto them Elias with Moses, or in other words, John the Baptist and Moses; and they were talking with Jesus.'
  - where: 'note 9:4 “Elias with Moses”'
    claim: 'The same messengers conferred keys in the Kirtland Temple, April 3, 1836'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'A similar event occurred on April 3, 1836, in the temple at Kirtland, Ohio, where the same heavenly messengers conferred priesthood keys upon the Prophet Joseph Smith and Oliver Cowdery (D&C 110).'

  - where: 'note 9:5 “Three tabernacles”'
    claim: 'The Feast of Tabernacles approached; the offer suggests the apostles recognized it'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'The transfiguration event seems to have occurred as the Feast of Tabernacles approached. The chief apostles wanted to craft three tabernacles for Jesus, Moses, and Elijah as the ancient prophets departed, which suggests they recognized the approach of the feast'
  - where: 'note 9:5 “Three tabernacles”'
    claim: 'Booths of boughs at the feast; the purpose to delay the visitors'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'at the annual feast of Tabernacles, it was customary to erect a little bower, or booth of wattled boughs, for each individual worshiper, into which he might retire for devotion. So far as there was a purpose in Peter’s proposition, it seems to have been that of delaying the departure of the visitants.'

  - where: 'note 9:7 “Hear him”'
    claim: 'The voice was addressed to the apostles; Jesus already had the Father’s witness at His baptism'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'that voice had been addressed to the three apostles rather than to Jesus, who had already received the Father’s acknowledgment and attestation on the occasion of His baptism.'
  - where: 'note 9:7 “Hear him”'
    claim: 'The apostles to be guided by neither Moses nor Elijah but by Him'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The apostles were to be guided neither by Moses nor Elijah, but by Him, their Lord, Jesus the Christ.'
  - where: 'note 9:7 “Hear him”'
    claim: 'The Father commanded them to hear (obey) Him'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'heard the voice of the Father bearing witness that Jesus is His beloved Son, in whom the Father is pleased, and commanding the brethren to hear (obey) Him.'
  - where: 'note 9:7 “Hear him”'
    claim: 'The Father introduces the Son with few words: the mount, Bountiful, the grove'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'whenever He has introduced His Only Begotten Son to mortals upon the earth, He has done so with remarkably few words. On the Mount of Transfiguration to Peter, James, and John, God said, “This is my beloved Son: hear him.”'

  - where: 'note 9:9 “Till the Son of man were risen”'
    claim: 'Mark often shows Jesus asking people not to make known parts of His ministry'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Perhaps it is simply safe to say that Mark has a general tendency to feature Jesus asking people not to publicize certain aspects of his ministry.'
  - where: 'note 9:9 “Till the Son of man were risen”'
    claim: 'The command barred telling even the rest of the Twelve; Peter later testified'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The comprehensiveness of the Lord’s injunction, that until after His rising from the dead they tell no man of their experiences on the mount, prohibited them from informing even their fellows of the Twelve. Later, after the Lord had ascended to His glory, Peter testified'
  - where: 'note 9:9 “Till the Son of man were risen”'
    claim: 'They were reluctantly accepting His death; of the rising they had dim comprehension'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'reluctantly they were being brought to understand it to be an awful certainty … and with equal plainness they had been told that Jesus would rise again; but of this latter eventuality they had but dim comprehension.'

  - where: 'note 9:12 “Elias must first come”'
    claim: 'As the disciples read the scriptures, Elijah was to precede the Messiah’s triumphal advent; Jesus confirmed Elias would come before the advent in glory'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'they marveled that such a thing could be at that time, since as they had interpreted the scriptures, it had been predicted that Elijah should precede the Messiah’s triumphal advent.'
  - where: 'note 9:12 “Elias must first come”'
    claim: 'Jesus confirmed Elias comes first, before the Lord’s advent in glory'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'Jesus confirmed the prophecy that Elias should first come, that is, before the Lord’s advent in glory, which event they had in mind'
  - where: 'note 9:12 “Elias must first come”'
    claim: '“Listed” means willed, chose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/9?lang=eng'
    quote: 'GR willed, chose, intended.'
  - where: 'note 9:12 “Elias must first come”'
    claim: 'JST Mark 9:11 names the Elias who came as the one who bore record of Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/9?lang=eng'
    quote: 'him; and he bore record of me, and they received him not. Verily this was Elias.'
  - where: 'note 9:12 “Elias must first come”'
    claim: 'JST Mark 9:10 reads “prepareth all things”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/9?lang=eng'
    quote: 'and prepareth all things; and teacheth you of the prophets; how'
  - where: 'note 9:12 “Elias must first come”'
    claim: '“As it is written of him”: Malachi, and the parallel between the Baptist and Elijah'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The words are peculiar to St. Mark, and probably point (1) to the special prediction of the coming of Elijah in Malachi 4, and (2) to the parallelism between the career of the Baptist and that of the Tishbite prophet.'
  - where: 'note 9:12 “Elias must first come”'
    claim: 'Elias a title for a forerunner; two Eliases, preparer and restorer'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'anciently two Eliases were spoken of, one as a preparer and the other a restorer. John was sent to prepare the way for Jesus, Jesus Himself being the Restorer'
  - where: 'note 9:12 “Elias must first come”'
    claim: 'Elias a title as well as a name'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The appellative “Elias” is in fact both a personal name and a title.'
  - where: 'note 9:12 “Elias must first come”'
    claim: 'Malachi’s prophecy not fulfilled in John; realized beginning in 1836'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'did not reach fulfillment in the mission of John the Baptist, nor in that of any other “Elias”; its complete realization was inaugurated on the third day of April, 1836, when Elijah appeared in the temple at Kirtland'

  - where: 'note 9:19 “O faithless generation”'
    claim: 'Only Mark has the scribes disputing, the running and greeting, and Jesus’s question'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'He alone mentions, e.g., in this verse, the presence of the scribes disputing with the disciples, and in the next, the “running” and the “greeting” with which the multitude received our Lord'
  - where: 'note 9:19 “O faithless generation”'
    claim: 'Their discomfiture: doubt cast on their Lord’s authority and power'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'their discomfiture must have been intensified by the thought that through them doubt had been cast upon the authority and power of their Lord.'
  - where: 'note 9:19 “O faithless generation”'
    claim: 'The reproof was addressed primarily to the apostles'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'These words in which there is evident reproof, however mild and pitying it may be, were addressed primarily to the apostles'
  - where: 'note 9:19 “O faithless generation”'
    claim: 'On their mission they had cast out spirits; now after a day’s absence they could not'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'While on their mission, though away from their Master’s helpful presence, they had successfully rebuked and cast out evil spirits as they had received special power and commission to do; but now, during His absence of a day they had found themselves unable.'

  - where: 'note 9:23 “If thou canst”'
    claim: 'The father’s words almost in despair: could He prevail where the disciples failed?'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The words are spoken almost in the accents of despair. Could He, the Master, prevail where the disciples had failed?'
  - where: 'note 9:23 “If thou canst”'
    claim: 'Better manuscripts omit “believe”; Jesus repeats the father’s words in sadness'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The better MSS. omit the word “believe,” and the sentence without it is taken as expressing the sadness of surprise. Our Lord repeats the half-believing, half-despairing words of the father in a tone of sadness'
  - where: 'note 9:23 “If thou canst”'
    claim: 'The issue rested largely with the father; the Lord asked belief rather than faith'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'up to that moment he had thought that all depended upon Jesus; he now saw that the issue rested largely with himself. It is noteworthy that the Lord specified belief rather than faith as the condition essential to the case.'

  - where: 'note 9:24 “Lord, I believe”'
    claim: 'Holland on “straightway” and Jesus’s response to partial faith'
    key: holland-lord-i-believe
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/04/lord-i-believe?lang=eng'
    quote: '“Straightway,” the scripture says—not slowly nor skeptically nor cynically but “straightway”—the father cries out in his unvarnished parental pain'
  - where: 'note 9:24 “Lord, I believe”'
    claim: 'Holland: do not lead with unbelief; be true to the faith you have'
    key: holland-lord-i-believe
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/04/lord-i-believe?lang=eng'
    quote: 'I am not asking you to pretend to faith you do not have. I am asking you to be true to the faith you do have.'
  - where: 'note 9:24 “Lord, I believe”'
    claim: 'Jesus heals in response to new and partial faith'
    key: holland-lord-i-believe
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/04/lord-i-believe?lang=eng'
    quote: 'In response to new and still partial faith, Jesus heals the boy'

  - where: 'note 9:25 “Enter no more into him”'
    claim: 'The rebuke to the deaf and dumb spirit only in Mark'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'This fact and the words of the rebuke to the “deaf and dumb spirit” are found only in St. Mark.'
  - where: 'note 9:25 “Enter no more into him”'
    claim: 'The dumb spirit, gnashing and pining peculiar to Mark'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'A dumb spirit.—This, again, is peculiar to St. Mark, as is also the “gnashing of the teeth” and the “pining” or “withering” in the next verse.'
  - where: 'note 9:25 “Enter no more into him”'
    claim: '“Enter no more” used in this case only, fitted to the father’s weak faith'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'We may note in these words, used by our Lord in this case only, a tender adaptation to the weak faith of the father. He had seen so many relapses, the last state worse than the first, that it was hard for him to take in the thought that the cure would be complete and permanent.'

  - where: 'note 9:29 “Prayer and fasting”'
    claim: 'Gradation of demons and of faith; prayer and prudent fasting develop faith and power; the apostles had cast out demons before'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'indicates gradation in the malignity and evil power of demons, and gradation also in the results of varying degrees of faith. The apostles who failed on the occasion referred to had been able to cast out demons at other times. Fasting, when practised in prudence, and genuine prayer are conducive to the development of faith'
  - where: 'note 9:29 “Prayer and fasting”'
    claim: 'The SBL text (with Westcott and Hort and Tischendorf) reads “prayer” alone'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/9-29.htm'
    quote: 'καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν προσευχῇ.'
  - where: 'note 9:29 “Prayer and fasting”'
    claim: 'The Textus Receptus (and the Byzantine majority text) reads “prayer and fasting”'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/9-29.htm'
    quote: 'Scrivener''s Textus Receptus 1894'
  - where: 'note 9:29 “Prayer and fasting”'
    claim: 'The Textus Receptus reads “and fasting”'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/9-29.htm'
    quote: 'εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.'
  - where: 'note 9:29 “Prayer and fasting”'
    claim: 'The evidence has been weighed as on balance in favor of the words'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'On the whole, however, there is a balance of evidence in their favour'
  - where: 'note 9:29 “Prayer and fasting”'
    claim: 'Better manuscripts omit the last two words; the teaching is in harmony with that of the Lord and His apostles'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The better MSS. omit the last two words. … what they teach is in harmony with other portions of the teaching both of our Lord and His Apostles.'

  - where: 'note 9:31 “Delivered into the hands of men”'
    claim: 'The second prediction adds “into the hands of men”; paradidōmi means handed over; Judas, the leaders, Pilate'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'While conventionally translated as “delivered” or even “betrayed,” both these passages use forms of the Greek word paradidōmi, which literally means “handed over,”[8] the implications of which become apparent during the passion narrative proper when Jesus is handed over first by Judas to the Jewish authorities'
  - where: 'note 9:31 “Delivered into the hands of men”'
    claim: 'Then by the Jewish leaders to Pilate, and by Pilate to the soldiers'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'then by the Jewish leaders to the Roman governor Pilate (15:1, 10), and finally by Pilate to the Roman soldiers to crucify him (15:15).'
  - where: 'note 9:31 “Delivered into the hands of men”'
    claim: 'Mark’s addition shows the shrinking from publicity continued'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'We note St. Mark’s addition, as showing that the apparent shrinking from publicity which had marked our Lord’s action since the feeding of the Four Thousand still continued.'
  - where: 'note 9:31 “Delivered into the hands of men”'
    claim: 'The disciples did not yet understand how His suffering, death and resurrection fit His mission'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'The disciples do not yet seem to have understood how the distressing suffering, death, and resurrection of the Master fit in to his Messianic mission (Matthew 17:23; Mark 9:32; Luke 9:45).'

  - where: 'note 9:34 “Who should be the greatest”'
    claim: 'They likely expected a political kingdom and argued over their places; the three on the mountain may have contributed; reluctance to divulge ambitions'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'They likely expected him to take the throne of David and establish a political kingdom. The disciples were possibly arguing about their place in the hierarchal structure of this earthly kingdom. Given that only Peter, James, and John accompanied Jesus on the mountain'
  - where: 'note 9:34 “Who should be the greatest”'
    claim: 'Their reluctance to divulge their jealous ambitions'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'one can imagine how this too may have contributed to the discussion and the disciples’ reluctancy to divulge their jealous ambitions to Jesus.'
  - where: 'note 9:34 “Who should be the greatest”'
    claim: 'Matthew does not mention the contention'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Matthew doesn’t acknowledge the contention and simply states that they approached Jesus and openly asked, “Who is the greatest in the kingdom of heaven?” (Matthew 18:1).'
  - where: 'note 9:34 “Who should be the greatest”'
    claim: 'Presumably over who would take His place; the pattern after the third prediction'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'is followed by strife among the disciples as to who will be the greatest among them, presumably because they want to know who will take Jesus’s place when he is gone. The third (Mark 10:32–34; parallels Matt 20:17–19; Luke 18:31–34) is followed by a seemingly impertinent request from the brothers James and John'
  - where: 'note 9:34 “Who should be the greatest”'
    claim: 'The word for servant rooted in menial service; not status or power; waiting tables'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'The word for servant finds its root in the idea of performing simple, menial, physical acts of service. Jesus is not promising his disciples status or power—he’s asking them to wait tables and tend to other physical needs.'

  - where: 'note 9:36 “A child in His arms”'
    claim: 'paidion, a child up to seven; children humble, poor and dependent'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'paidion referred to a growing child up to the age of seven.'
  - where: 'note 9:36 “A child in His arms”'
    claim: 'Children humble, poor and dependent'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'the essential characteristics of children as humble, poor, and dependent seem intrinsically connected to the definition of righteousness.'
  - where: 'note 9:36 “A child in His arms”'
    claim: 'Linguistic and social connections between children and slaves'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'The linguistic and social connections between “children” and “slaves”[34] in the New Testament period further suggests that there was great significance in Jesus’s effort to physically place a little child among adult followers in his company.'
  - where: 'note 9:36 “A child in His arms”'
    claim: 'The chain from Father to Son to the child'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'This connection of God the Father to God the Son to the hearer of his words extends all the way down to the little child in their midst.'
  - where: 'note 9:36 “A child in His arms”'
    claim: 'The Nephite teaching echoes it: whoso believeth in me believeth in the Father; becoming a little child'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'the Nephite teaching of “whoso believeth in me believeth in the Father also” aligns with his New Testament teachings in Matthew, Mark, and Luke, “whoso shall receive me receiveth him that sent me” (Luke 9:48; Mark 9:37). Moreover, Jesus twice gives the Nephites the corresponding teaching on becoming a little child'
  - where: 'note 9:36 “A child in His arms”'
    claim: 'JST Mark 9:34–35 (footnote 37a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/9?lang=eng'
    quote: 'Whosoever shall humble himself like one of these children, and receiveth me, ye shall receive in my name. And whosoever shall receive me, receiveth not me only, but him that sent me, even the Father.'

  - where: 'note 9:38 “Forbid him not”'
    claim: 'John’s remark perhaps prompted by “in my name”'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'It may have been Christ’s reference to deeds done in His name that prompted John to interject a remark at this point'
  - where: 'note 9:38 “Forbid him not”'
    claim: 'Zeal led to intolerance; the man a believer in Christ'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The young apostle had allowed his zeal for the Master’s name to lead to intolerance. … he was certainly a believer in Christ'
  - where: 'note 9:38 “Forbid him not”'
    claim: 'His act different from unrighteous assumptions later rebuked'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'his act was essentially different from the unrighteous assumptions for which some others were afterward rebuked'
  - where: 'note 9:38 “Forbid him not”'
    claim: 'Not against Him = tentatively on His side; on other occasions not with Him = against Him'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'In the state of divided opinion then existing among the people concerning Jesus, it was fair to say that all who were not opposed to Him were at least tentatively on His side. On other occasions He asserted that those who were not with Him were against him.'
  - where: 'note 9:38 “Forbid him not”'
    claim: 'The man did cast the devils out; different from the sons of Sceva'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'Their faith was effective, for, as the narrative implies, they not only claimed the power to cast out demons, but did cast them out. The case stood, it is obvious, on an entirely different footing from that of the sons of Sceva, in Acts 19:13-14'
  - where: 'note 9:38 “Forbid him not”'
    claim: '“Lightly” literally quickly; Moses’s answer to Joshua'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'Lightly.—Literally, quickly. … So of old Moses answered the prayer of Joshua that he would forbid Eldad and Medad to prophesy in the camp, “Would God that all the Lord’s people were prophets” (Numbers 11:29).'
  - where: 'note 9:38 “Forbid him not”'
    claim: 'The cup of water repeated from Matthew 10:42; reiterating words of blessing'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The reproduction of the promise in so different a context is significant as an instance of our Lord’s method of teaching, reiterating words of blessing and of wisdom till they were engraved indelibly on the minds of those who heard them.'

  - where: 'note 9:43 “If thy hand offend thee”'
    claim: 'The personal reading: cut off the passions of evil whatever the sacrifice'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'As it is better that a man undergo surgical treatment though he lose thereby a hand, a foot, or an eye, than that his whole body be involved and his life forfeited, so is it commended that he cut off, tear away, or root out from his soul the passions of evil'
  - where: 'note 9:43 “If thy hand offend thee”'
    claim: 'JST: the brother who confesses not'
    key: jst-mark-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/9?lang=eng'
    quote: 'or if thy brother offend thee and confess not and forsake not, he shall be cut off.'
  - where: 'note 9:43 “If thy hand offend thee”'
    claim: 'JST: better to enter life without thy brother'
    key: jst-mark-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/9?lang=eng'
    quote: 'For it is better for thee to enter into life without thy brother, than for thee and thy brother to be cast into hell'
  - where: 'note 9:43 “If thy hand offend thee”'
    claim: 'JST: the foot is thy standard'
    key: jst-mark-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/9?lang=eng'
    quote: 'for he that is thy standard, by whom thou walkest, if he become a transgressor, he shall be cut off.'
  - where: 'note 9:43 “If thy hand offend thee”'
    claim: 'JST: the eye appointed to watch over thee'
    key: jst-mark-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/9?lang=eng'
    quote: 'And if thine eye which seeth for thee, him that is appointed to watch over thee to show thee light, become a transgressor and offend thee, pluck him out.'
  - where: 'note 9:43 “If thy hand offend thee”'
    claim: 'JST: stand or fall by himself; seek unto my Father'
    key: jst-mark-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/9?lang=eng'
    quote: 'Therefore, let every man stand or fall, by himself, and not for another; or not trusting another.'
  - where: 'note 9:43 “If thy hand offend thee”'
    claim: 'JST: the promise to those who ask in faith'
    key: jst-mark-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/9?lang=eng'
    quote: 'Seek unto my Father, and it shall be done in that very moment what ye shall ask, if ye ask in faith, believing that ye shall receive.'
  - where: 'note 9:43 “If thy hand offend thee”'
    claim: 'The changes mean excommunication, to keep the Church pure'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'The Prophet’s changes define what it means to pluck out an eye or cut off a hand: excommunication or severance from the body of Christ was occasionally necessary to maintain the purity of the Church.'

  - where: 'note 9:44 “Where their worm dieth not”'
    claim: 'Gehenna, the valley of Hinnom: Moloch worship, defiled by Josiah, refuse burned, symbol of torment'
    key: bd-gehenna
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gehenna?lang=eng'
    quote: 'The valley of Hinnom. South of Jerusalem, the scene of Moloch worship (2 Chr. 28:3; 33:6; Jer. 7:31; 19:2–6); polluted by Josiah (2 Kgs. 23:10); afterwards a place in which the refuse of the city was burned, and for that reason it was symbolic of the place of torment'
  - where: 'note 9:44 “Where their worm dieth not”'
    claim: 'The Greek word for hell is geenna, from the Hebrew for the valley of Hinnom'
    key: thayer
    url: 'https://biblehub.com/greek/1067.htm'
    quote: '1. valley of (the son of) Hinnom'
  - where: 'note 9:44 “Where their worm dieth not”'
    claim: 'The line comes almost word for word from the last verse of Isaiah'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The words are taken almost literatim from the closing verse of Isaiah (Isaiah 66:24), where they appear as part of the description of the triumph of Jehovah. The true worshippers should serve in His Temple continually, and they should go forth and see the carcases of the transgressors'
  - where: 'note 9:44 “Where their worm dieth not”'
    claim: 'Some of the best manuscripts omit verses 44 and 46'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'the same MSS., and others, omit both Mark 9:44; Mark 9:46, leaving Mark 9:48 to stand as the only description of Gehenna.'

  - where: 'note 9:49 “Salted with fire”'
    claim: 'Unique to Mark; the second half absent from many of the oldest manuscripts'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: '(The second half of that verse may not be original to the Gospel of Mark because it does not appear in many of the oldest manuscripts.)'
  - where: 'note 9:49 “Salted with fire”'
    claim: 'The SBL text reads only the first half'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/9-49.htm'
    quote: 'Πᾶς γὰρ πυρὶ ἁλισθήσεται.'
  - where: 'note 9:49 “Salted with fire”'
    claim: 'The verse is difficult in reading and interpretation; many of the best manuscripts omit the latter clause'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The verse presents considerable difficulties, both as regards the reading and the interpretation. Many of the best MSS. omit the latter clause'
  - where: 'note 9:49 “Salted with fire”'
    claim: 'Fire as purifying discipline (Matt. 3:11); salt with every sacrifice the symbol of incorruption; the spiritual sacrifice (Rom. 12:1) needs salt to be acceptable'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The “sacrifice” throws us back upon the ritual of Leviticus 2:13, which prescribed that salt should be added, as the natural symbol of incorruption, to every sacrifice. Here our Lord speaks of the spiritual sacrifice which each man offers of his body, soul, and spirit (Romans 12:1)'
  - where: 'note 9:49 “Salted with fire”'
    claim: 'Fire represents the discipline of suffering that purifies'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'He shall thus be “salted with fire,” for the tendency of that fire, the aim of the sufferings which it represents, is to purify and cleanse.'
  - where: 'note 9:49 “Salted with fire”'
    claim: 'The most generally received reading: salting as perpetuation only, asserting endless punishment'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'The most generally received interpretation of the first clause is that which eliminates from the process of salting the idea of purifying, or preserving from corruption, and sees in it only the symbol of perpetuation.'
  - where: 'note 9:49 “Salted with fire”'
    claim: 'So taken, the words assert the endlessness of punishment'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'So taken, the words become an emphatic assertion of the endlessness of future punishment'
  - where: 'note 9:49 “Salted with fire”'
    claim: 'Every soul tested as by fire; the soul must receive the saving salt of the gospel'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Every human soul shall be tested as by fire; and as the flesh of the altar sacrifices had to be seasoned with salt, as a type of preservation from corruption, so also the soul must receive the saving salt of the gospel'
  - where: 'note 9:49 “Salted with fire”'
    claim: '“Have peace” refers back to the contention; purity from selfish aims the preservative of peace'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/9.htm'
    quote: 'seem to refer to the contention in Mark 9:33, with which this portion of our Lord’s teaching had begun. The purity from selfish aims, which was symbolised by the “salt,” was the chief or only preservative of peace.'

  - where: christ
    claim: 'Be true to the faith you have, not pretending to faith you lack'
    key: holland-lord-i-believe
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/04/lord-i-believe?lang=eng'
    quote: 'I am not asking you to pretend to faith you do not have. I am asking you to be true to the faith you do have.'
  - where: explore
    claim: 'President Nelson’s address “Hear Him”'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'On the Mount of Transfiguration to Peter, James, and John, God said, “This is my beloved Son: hear him.”'
