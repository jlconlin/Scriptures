    key: bednar-clean-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/clean-hands-and-a-pure-heart?lang=eng'
    quote: 'Brothers and sisters, it is possible for us to have clean hands but not have a pure heart.'
  - where: christ
    claim: 'Hearts are purified by His strengthening power; works alone cannot produce it'
    key: bednar-clean-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/clean-hands-and-a-pure-heart?lang=eng'
    quote: 'Hearts are purified as we receive His strengthening power to do good and become better. All of our worthy desires and good works, as necessary as they are, can never produce clean hands and a pure heart.'
