chapter: 7
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'The visit from Jerusalem came shortly after the Passover; the Passover near the feeding of the five thousand (John 6:4)'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Shortly after the Passover to which allusion has been made, and probably in accordance with a plan decided upon by the Jewish rulers, Jesus was visited by a delegation of Pharisees and scribes who had come from Jerusalem'
  - where: setting
    claim: 'Spies sent from Jerusalem watched Jesus in Galilee and noted every omission of customary observance'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'the detectives and spies, who had been sent from Jerusalem into Galilee to watch Jesus, became more active than ever in their critical espionage. They dogged His footsteps, noted every act, and every instance of omission of traditional or customary observance'
  - where: setting
    claim: 'The delegation came, probably on a plan of the rulers, to demand explanation'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'probably in accordance with a plan decided upon by the Jewish rulers, Jesus was visited by a delegation of Pharisees and scribes who had come from Jerusalem, and who made protest against the disregard of traditional requirements by His followers'
  - where: setting
    claim: 'Mark explains Jewish customs Matthew does not, likely because his audience was largely Gentile'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark explains Jewish customs that neither Matthew nor Luke explain to their audiences (see Mark 7:3–4; compare Matthew 15:2–3). It is likely that this information was necessary for Mark’s audience, which may have been largely Gentile'
  - where: setting
    claim: 'Mark keeps and translates Corban and Ephphatha, which Matthew omits'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark 7:11 (“Corban, that is to say, a gift”; omitted in Matthew 15:5, and there is no similar story in Luke); Mark 7:34 (“Ephphatha, that is, Be opened”; omitted in Matthew 15:29–31'
  - where: setting
    claim: 'Jesus went north into Phoenicia, beyond the land of Israel, where His fame had preceded Him'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Jesus departed with them northward, and journeyed into the coasts or borders of Phenicia … His fame had preceded Him beyond the boundaries of the land of Israel.'
  - where: setting
    claim: 'The Decapolis peoples were semi-pagan'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Though still among semi-pagan peoples, our Lord was greeted by great crowds'
  - where: thread
    claim: 'Pharisees purified vessels and washed hands for ritually pure meals, and did not eat with those who did not keep these laws'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'It led the Pharisees to focus on the purification of vessels and the washing of hands to make the meals ritually pure. … To keep this level of holiness, it was also essential not to eat with those who did not observe these laws.'
  - where: thread
    claim: 'Only Mark has the narrator’s note that Jesus declared all foods clean, likely for a Gentile audience'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'it is easy to imagine Mark including this note for his (likely) Gentile audience'
  - where: thread
    claim: 'The words on cleansing all meats anticipate Acts 10:15'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/7.htm'
    quote: 'So taken, the words anticipate, in almost the same terms, the truth of Acts 10:15, “What God hath cleansed, that call not thou common.”'
  - where: thread
    claim: 'Peter’s vision of unclean animals was about people, not animals'
    key: judd-jerusalem-conference
    url: 'https://rsc.byu.edu/vol-12-no-1-2011/jerusalem-conference-first-council-christian-church'
    quote: 'the true meaning of his dream—that it was about people, not animals—was revealed to Peter.'
  # ---- notes
  - where: 'note 7:3 “Why Mark explains the washings”'
    claim: 'The charge was ceremonial uncleanness, eating with common or defiled hands, not dirty fingers'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'the offense charged against the disciples was that of ceremonial uncleanness, not physical uncleanliness or disregard of sanitary propriety; they were said to have eaten with common or defiled hands, not specifically with dirty fingers.'
  - where: 'note 7:3 “Why Mark explains the washings”'
    claim: 'The Pharisees sought to bring the temple’s holiness into every home'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'While other Jews of this time believed that these regulations in Leviticus applied only to the priests in the temple, the Pharisees’ goal was to bring the holiness of the temple into every home through applying these laws more broadly.'
  - where: 'note 7:3 “Why Mark explains the washings”'
    claim: 'Hence vessels purified and hands washed to make meals ritually pure'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'It led the Pharisees to focus on the purification of vessels and the washing of hands to make the meals ritually pure.'
  - where: 'note 7:3 “Why Mark explains the washings”'
    claim: 'Mark explains the custom for an audience that was likely largely Gentile'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'It is likely that this information was necessary for Mark’s audience, which may have been largely Gentile, but not for Matthew’s, which is more likely to have been Jewish.'
  - where: 'note 7:3 “Why Mark explains the washings”'
    claim: 'Mark presents handwashing as a custom of all the Jews, not a Pharisaic innovation; Jesus’s objection is tradition used to set aside a commandment'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'Mark does not present handwashing as a primarily Pharisaic innovation. … In this instance, the problem for Jesus is not the traditions per se, but rather in the use of that tradition to turn aside the specific commandment of God.'
  - where: 'note 7:3 “Why Mark explains the washings”'
    claim: 'Pygmē: to wash the hands with the fist, one hand rubbed with the clenched fist of the other; Tischendorf reads pykna'
    key: thayer
    url: 'https://biblehub.com/greek/4435.htm'
    quote: 'πυγμή νίπτεσθαι τάς χεῖρας, to wash the hands with the fist, i. e. so that one hand is rubbed with the clenched fist of the other … Mark 7:3 (where Tdf. πυκνά, see πυκνός).'
  - where: 'note 7:3 “Why Mark explains the washings”'
    claim: 'The Textus Receptus and the SBL text read pygmē at 7:3'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/7-3.htm'
    quote: 'Scrivener''s Textus Receptus 1894 οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι, ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας'
  - where: 'note 7:3 “Why Mark explains the washings”'
    claim: 'Tischendorf reads pykna (often)'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/7-3.htm'
    quote: 'Tischendorf 8th Edition οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυκνὰ νίψωνται τὰς χεῖρας'
  - where: 'note 7:7 “Isaiah’s words, in their Greek form”'
    claim: 'The Septuagint of Isaiah 29:13 reads “in vain do they worship me, teaching the commandments and doctrines of men”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/29.htm'
    quote: 'This people draw nigh to me with their mouth, and they honour me with their lips, but their heart is far from me: but in vain do they worship me, teaching the commandments and doctrines of men.'
  - where: 'note 7:7 “Isaiah’s words, in their Greek form”'
    claim: 'The King James Isaiah 29:13 ends “their fear toward me is taught by the precept of men”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/29?lang=eng'
    quote: 'and with their lips do honour me, but have removed their heart far from me, and their fear toward me is taught by the precept of men:'
  - where: 'note 7:7 “Isaiah’s words, in their Greek form”'
    claim: 'The Lord quoted the words to Joseph Smith in 1820'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: '“they draw near to me with their lips, but their hearts are far from me, they teach for doctrines the commandments of men, having a form of godliness, but they deny the power thereof.”'
  - where: 'note 7:10 “Ye keep not the law”'
    claim: 'JST Mark 7:10–12: by the prophets whom ye have rejected; ye keep not the law'
    key: jst-mark-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/7?lang=eng'
    quote: 'Full well is it written of you, by the prophets whom ye have rejected. … Ye have kept not the ordinances of God; for Moses said, Honor thy father and thy mother … as it is written in your law; but ye keep not the law.'
  - where: 'note 7:10 “Ye keep not the law”'
    claim: 'The JST headnote: Jesus condemns those who reject the prophets and do not obey the law of Moses'
    key: jst-mark-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/7?lang=eng'
    quote: 'Jesus condemns those who reject the prophets and do not obey the law of Moses.'
  - where: 'note 7:10 “Ye keep not the law”'
    claim: 'Jesus rejected the oral traditions but fully supported the written law in His mortal life'
    key: judd-jerusalem-conference
    url: 'https://rsc.byu.edu/vol-12-no-1-2011/jerusalem-conference-first-council-christian-church'
    quote: 'though he did not agree with the oral traditions that Jewish teachers had created over the centuries, Jesus fully supported keeping the actual written law of Moses.'
  - where: 'note 7:11 “Corban”'
    claim: 'Qorban first meant a sacrificial gift, by the Second Temple period a vow or offering'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'He brings in the concept of qorban, which originally referred to a sacrificial gift, but by the Second Temple period had come to mean a vow or offering.'
  - where: 'note 7:11 “Corban”'
    claim: 'The King James “offering” in Leviticus 1:2 is qorbān'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'For its original meaning, see Leviticus 1:2–3. The word translated as “offering” in the King James Version is qorbān.'
  - where: 'note 7:11 “Corban”'
    claim: 'An ossuary inscription uses qorbān in a curse formula, which may explain why Jesus quotes Exodus 21:17'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'the word qorbān seems to refer to a curse formula on those who disturb the bones of the ossuary. This may provide some background as to why Jesus quotes Exodus 21:17, with its reference to cursing parents.'
  - where: 'note 7:11 “Corban”'
    claim: 'Corban: dedicated to God; a binding vow held above duty to parents; misused to avoid caring for parents'
    key: bd-corban
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/corban?lang=eng'
    quote: 'The utterance of it was held to constitute a binding vow, and the fulfillment of a vow was regarded by the Pharisees as of deeper obligation than the duty even to parents.'
  - where: 'note 7:19 “Purging all meats”'
    claim: 'Katharizō: to make clean; listed for food at Mark 7:19; also to pronounce clean in a levitical sense (Acts 10:15)'
    key: thayer
    url: 'https://biblehub.com/greek/2511.htm'
    quote: 'a. from physical stains and dirt: e. g. utensils, Matthew 23:25 … food, Mark 7:19 … 2. to pronounce clean in a levitical sense: Acts 10:15; Acts 11:9'
  - where: 'note 7:19 “Purging all meats”'
    claim: 'The Textus Receptus has the neuter participle; the SBL text has the masculine, set off by a dash'
    key: greek-nt
    url: 'https://biblehub.com/texts/mark/7-19.htm'
    quote: 'SBL Greek New Testament 2010 … εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; — καθαρίζων πάντα τὰ βρώματα. … Scrivener''s Textus Receptus 1894 … ἐκπορεύεται, καθαρίζον πάντα τὰ βρώματα.'
  - where: 'note 7:19 “Purging all meats”'
    claim: 'Neuter participle hard to make sense of; better manuscripts masculine; best construed with “He saith”: in so saying, He cleansed all meats; anticipates Acts 10:15'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/7.htm'
    quote: 'The better MSS., however, give the participle in the masculine. … A far better construction, both as to grammar and meaning, is found by making the word “purging,” or better, cleansing, agree with the subject of the verb “He saith,” in Mark 7:18'
  - where: 'note 7:19 “Purging all meats”'
    claim: 'Only Mark has the narrator’s “Thus he declared all foods clean”; it may be Mark’s editorial comment'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Mark’s Gospel is the only one to contain the declaration by the narrator, “Thus he declared all foods clean” (Mark 7:19, KJV “purging all meats”; contrast Matthew 15:17–20). As Acts and Paul’s letters make clear, dietary rules were a difficult issue for early Christians to navigate'
  - where: 'note 7:19 “Purging all meats”'
    claim: 'The risen Lord: in me is the law of Moses fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'for behold, by me redemption cometh, and in me is the law of Moses fulfilled.'
  - where: 'note 7:19 “Purging all meats”'
    claim: 'The law of Moses was fulfilled at Jesus’s death; disciples were to keep it during His mortal ministry'
    key: judd-jerusalem-conference
    url: 'https://rsc.byu.edu/vol-12-no-1-2011/jerusalem-conference-first-council-christian-church'
    quote: 'The law of Moses was not fulfilled at the birth of Jesus Christ, but rather at his death. Therefore, disciples of Christ were obligated to keep the law of Moses during the mortal ministry of the Savior (compare 3 Nephi 1:23–25 with 3 Nephi 9:17–20).'
  - where: 'note 7:19 “Purging all meats”'
    claim: 'Peter’s vision: he defended his observance of the law; its meaning was about people'
    key: judd-jerusalem-conference
    url: 'https://rsc.byu.edu/vol-12-no-1-2011/jerusalem-conference-first-council-christian-church'
    quote: 'When a voice commanded him to kill and eat these animals, Peter promptly responded by defending his faithful observance of the law of Moses'
  - where: 'note 7:22 “An evil eye”'
    claim: 'Ophthalmos ponēros: envy, from the Hebrew idiom (Prov. 23:6; Deut. 15:9; Matt. 20:15)'
    key: thayer
    url: 'https://biblehub.com/greek/3788.htm'
    quote: 'ὀφθαλμός σου πονηρός ἐστιν, i. e. thou art envious, Matthew 20:15; ὀφθαλμός πονηρός, envy, Mark 7:22 (עַיִן רַע, an envious man, Proverbs 23:6; Proverbs 28:22'
  - where: 'note 7:22 “An evil eye”'
    claim: 'Aselgeia: unbridled lust, excess, wantonness, shamelessness; at Mark 7:22 the particular vice is uncertain'
    key: thayer
    url: 'https://biblehub.com/greek/766.htm'
    quote: '"unbridled lust, excess, licentiousness, lasciviousness, wantonness, outrageousness, shamelessness, insolence": Mark 7:22 (where it is uncertain what particular vice is spoken of)'
  - where: 'note 7:24 “He could not be hid”'
    claim: 'Unable to find rest or opportunity to instruct the Twelve in Galilee, Jesus went into Phoenicia and lodged near the border; privacy failed'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Unable to find in Galilee rest, seclusion, or adequate opportunity of instructing the Twelve as He desired to do, Jesus departed with them northward … In one of the little towns near the border, the party took lodgings; but the attempt to secure privacy was futile'
  - where: 'note 7:24 “He could not be hid”'
    claim: 'People from Tyre and Sidon had earlier been among His listeners'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'On earlier occasions, people from the region of Tyre and Sidon had been among His listeners, and some of them had been blessed by His healing mercies.'
  - where: 'note 7:24 “He could not be hid”'
    claim: 'JST Mark 7:22–23: he could not deny them, for he had compassion upon all men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/7?lang=eng'
    quote: 'JST Mark 7:22–23 … and would that no man should come unto him. But he could not deny them; for he had compassion upon all men.'
  - where: 'note 7:26 “A Greek, a Syrophenician”'
    claim: 'Hellēnis at Mark 7:26: a Gentile woman, not a Jewess'
    key: thayer
    url: 'https://biblehub.com/greek/1674.htm'
    quote: '2. a Gentile woman; not a Jewess (see Ἕλλην, 2): Mark 7:26; Acts 17:12.'
  - where: 'note 7:26 “A Greek, a Syrophenician”'
    claim: 'Syrophoenician: from the Phoenicia that was part of Syria, distinguished from the Libyan Phoenicians (Carthaginians)'
    key: thayer
    url: 'https://biblehub.com/greek/4949.htm'
    quote: 'a Syrophoenician woman, i. e. of Syrophoenice by race, that is, from the Phoenice forming a part of Syria (Συρο being prefixed for distinction''s sake, for there were also Λιβυφοινικες, i. e. the Carthaginians.'
  - where: 'note 7:26 “A Greek, a Syrophenician”'
    claim: 'A Gentile who spoke Greek; Phoenicians of Canaanite descent; Canaanites held in particular disrepute'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Mark tells us she was a Greek, or more literally a Gentile who spoke Greek, and by nationality a Syro-Phenician; Matthew says she was “a woman of Canaan”; these statements are in harmony, since the Phenicians were of Canaanite descent.'
  - where: 'note 7:26 “A Greek, a Syrophenician”'
    claim: 'Canaanites were held in particular disrepute by the Jews'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'we know that among the peoples so classed the Canaanites were held in particular disrepute by the Jews.'
  - where: 'note 7:27 “The children first”'
    claim: '“Let the children first be filled” prefigured the gospel to all; mortal ministry to Israel, the resurrected Christ to every nation'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'but His words prefigured the giving of the gospel to all, both Jew and Gentile: “Let the children first be filled” He had said. The resurrected Christ was to be made known to every nation'
  - where: 'note 7:27 “The children first”'
    claim: 'JST: “children of the kingdom first”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/7?lang=eng'
    quote: 'JST Mark 7:26 … children of the kingdom first … 27b “dogs”: D&C 41:6.'
  - where: 'note 7:27 “The children first”'
    claim: 'Kunarion is the diminutive, a little dog (Mark 7:27–28)'
    key: thayer
    url: 'https://biblehub.com/greek/2952.htm'
    quote: 'κυνάριον, κυναριου, τό (diminutive of κύων, equivalent to κυνίδιον … ),a little dog: Matthew 15:26; Mark 7:27f'
  - where: 'note 7:27 “The children first”'
    claim: 'The dogs are house pets under the table, not the despised curs of the Bible'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'not the vagrant and despised curs elsewhere spoken of in the Bible as typical of a degraded state, or of positive badness, but literally the “little dogs” or domestic pets, such as were allowed in the house and under the table.'
  - where: 'note 7:29 “For this saying”'
    claim: 'She took no offense, adopted the analogy and turned it into argument and plea; her persistence was faith that overcomes obstacles'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Certainly the woman took no offense at the comparison, and found therein no objectionable epithet. Instantly she adopted the analogy, and applied it in combined argument and supplication.'
  - where: 'note 7:29 “For this saying”'
    claim: 'Her persistence was faith that overcomes obstacles and endures discouragement'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The woman’s commendable persistency was based on the faith that overcomes apparent obstacles and endures even under discouragement.'
  - where: 'note 7:29 “For this saying”'
    claim: 'Mark emphasizes the special recognition of her final plea'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Mark emphasizes the special recognition of her final plea'
  - where: 'note 7:29 “For this saying”'
    claim: 'Minor characters who choose to follow Jesus, the Syrophenician woman among them, are better disciples than the Twelve'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'in contrast to the twelve disciples who were chosen by Jesus, minor characters who choose to follow Jesus are much better disciples; this group includes … the Syrophenician woman (Mark 7:24–30)'
  - where: 'note 7:29 “For this saying”'
    claim: 'Women in Mark join theological discussions (Mark 7:24–30)'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'women in this Gospel are invited to join in work normally restricted to men: theological discussions (see Mark 7:24–30)'
  - where: 'note 7:31 “A long way round”'
    claim: 'Better manuscripts read “from the coasts of Tyre through Sidon”; Sidon lay twenty miles north'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/7.htm'
    quote: 'The better MSS. give “from the coasts of Tyre through Sidon.” The latter city lay about twenty miles to the north. Accepting this reading, it marks the extreme limit of our Lord’s journeyings—we can hardly say of His ministry'
  - where: 'note 7:31 “A long way round”'
    claim: 'Its peoples were semi-pagan'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'They went thence into the region adjoining the sea of Galilee on the east, “through the midst of the coasts of Decapolis.” Though still among semi-pagan peoples'
  - where: 'note 7:33 “Fingers, spittle and a sigh”'
    claim: 'The manner of the cure differed from His usual mode; the touch may have strengthened the man’s faith'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The manner of effecting this cure was different again from the usual mode of our Lord’s healing ministrations. It may be that by the finger-touch to the closed ears and to the bound tongue, the man’s faith was strengthened'
  - where: 'note 7:33 “Fingers, spittle and a sigh”'
    claim: 'The deaf man could not hear the Healer’s voice for his faith to fasten on; the act filled the void'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/7.htm'
    quote: 'Here the man could not find in the pitying tones of the voice of the Healer that on which his faith could fasten, and the act came in to fill up the void.'
  - where: 'note 7:33 “Fingers, spittle and a sigh”'
    claim: 'The upward look implied prayer, as in John 11:41; the sigh, the sadness of sympathy at suffering'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/7.htm'
    quote: 'The look, it is clear, implied prayer, as in John 11:41. The “sigh,” too, has its counterpart in the “groans” and “tears” of John 11:33 … and finds its analogue in the sadness of sympathy which we feel at the sight of suffering'
  - where: 'note 7:33 “Fingers, spittle and a sigh”'
    claim: 'Stenazō at Mark 7:34: to pray sighing'
    key: thayer
    url: 'https://biblehub.com/greek/4727.htm'
    quote: 'to sigh, to gross: 2 Corinthians 5:2, 4 … to pray sighing, Mark 7:34'
  - where: 'note 7:34 “Ephphatha”'
    claim: 'Ephphatha: Aramaic imperative of “to open,” be thou opened, i.e. receive the power of hearing'
    key: thayer
    url: 'https://biblehub.com/greek/2188.htm'
    quote: 'ἐφφαθά, ephphatha, Aramaic אֶתְפָּתַח (the ethpaal imperative of the verb פְּתַח, Hebrew פָּתַח, to open), be thou opened (i. e. receive the power of hearing; the ears of the deaf and the eyes of the blind being considered as closed)'
  - where: 'note 7:34 “Ephphatha”'
    claim: 'Some Aramaic words come in healings; perhaps kept for ritual significance; or Jesus’s actual words; no way to verify'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'Notice that some of the Aramaic words are in the context of healing (see Mark 5:41 and 7:34)—perhaps Mark felt it was important to include the actual wording because these had ritual significance.'
  - where: 'note 7:34 “Ephphatha”'
    claim: 'The theory that Aramaic preserves Jesus’s actual words cannot be verified'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'It has also been suggested that the Aramaic phrases represent the (only) times where Jesus’ actual words (as opposed to a paraphrase) are preserved in the account, but there is no way to verify this.'
  - where: 'note 7:34 “Ephphatha”'
    claim: '“The string of his tongue” is better “bond,” not an anatomical term'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/7.htm'
    quote: 'The string of his tongue.—Better, bond, that which confined and hampered his speech. (Comp. Luke 13:16.) There is no ground for thinking that St. Mark used the word in any anatomical sense'
  - where: 'note 7:36 “Tell no man, even here”'
    claim: '5:19 is the one odd exception to the rule of secrecy; 7:36 an example of it'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'For examples of the messianic secret, see Mark 1:23, 34, 43–45; 3:11–12; 5:43; 7:36; 8:26, 30; and 9:9. There is one odd exception to the general rule of secrecy: Jesus tells the Gentile man who had had a demon to tell his family'
  - where: 'note 7:36 “Tell no man, even here”'
    claim: 'The requests are often ignored, and Mark says so'
    key: smith-marks-unique-contribution
    url: 'https://rsc.byu.edu/vol-17-no-2-2016/marks-unique-contribution'
    quote: 'A curious aspect about the secrecy motif is the frequency with which it is violated in Mark’s Gospel; Jesus’ requests for secrecy are often ignored, and Mark tells us all about it.'
  - where: 'note 7:37 “The deaf hear, the dumb speak”'
    claim: 'Mogilalos, “impediment in his speech,” is the Septuagint’s word for “dumb” in Isaiah 35:6'
    key: thayer
    url: 'https://biblehub.com/greek/3424.htm'
    quote: 'μογιλάλον (μόγις and λάλος), speaking with difficulty (A. V. having an impediment in his speech): Mark 7:32 … the Sept. for אִלֵּם, dumb, Isaiah 35:6.'
  - where: 'note 7:37 “The deaf hear, the dumb speak”'
    claim: 'Mark may have used the word to connect the miracle with Isaiah 35:6'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/7.htm'
    quote: 'the word which St. Mark uses stands for “dumb” in the Greek version of Isaiah 35:6, and may therefore have been used by him to connect the miracle which he describes with that prophecy.'
  - where: 'note 7:37 “The deaf hear, the dumb speak”'
    claim: 'The crowd’s “the dumb to speak” is less precise than Mark’s own description in verse 32'
    key: ellicott-mark
    url: 'https://biblehub.com/commentaries/ellicott/mark/7.htm'
    quote: 'We note the distinction between St. Mark’s accurate description in Mark 7:32, and the less precise language of popular amazement.'
