chapter: 10
title: The Servant of All
tagline: Jesus answers the Pharisees on divorce, blesses little children, loves a rich man who goes away grieved, foretells His death a third time, teaches James and John that the great must serve, and gives sight to blind Bartimaeus.
when: 'Beyond the Jordan in Perea, then across to Jericho on the road up to Jerusalem'

setting: |
  Mark 10 opens after a gap. Those who arrange the four Gospels into one account place between the end of chapter 9 and this verse much that Luke and John tell (Luke 10–17; John 7–11), and “the farther side of Jordan” points to the ministry in Perea that only Luke records. Mark tells none of it. He takes Jesus from Capernaum straight to the last road, by way of Jericho in the Jordan valley, some 800 feet below the Mediterranean, and up toward Jerusalem. By the end of the chapter a great crowd is on the road with Him, probably many of them pilgrims going up to the Passover, about a week away.

  Matthew tells the same five stories in the same order ([[Matt. 19:1–20:34]]); Luke tells all of them but the debate on divorce and the request of James and John ([[Luke 18:15–43]]).

  The chapter closes the middle part of Mark’s Gospel. That part opened with a blind man healed at Bethsaida ([[Mark 8:22–26]]) and ends here with another, Bartimaeus, as Jesus leaves Jericho on the last stage of the journey. Between them stand Peter’s confession and the three times Jesus foretells His death; the third is in this chapter (verses 32–34).

thread: |
  **The last road, and who follows on it.** For the third time Jesus tells the Twelve plainly that He will be condemned, mocked, scourged and killed, and will rise again; and for the third time His disciples answer with something else on their minds. After the first prediction Peter rebuked Him ([[Mark 8:32]]); after the second they argued about who was greatest ([[Mark 9:34]]); now James and John ask for the seats on His right and left hand. Each time the misunderstanding is met with teaching: the great among them must be their servants, humble as a child, because the Son of Man Himself came to serve and to give His life.

  Around that teaching Mark sets the rest of the chapter: children whom the disciples turn away and Jesus takes in His arms, a rich man who keeps the commandments and cannot let go of his possessions, Peter reminding Jesus what the Twelve have left. Jesus’s warning that “many that are first shall be last; and the last first” may describe Mark’s whole account of discipleship, in which the Twelve whom Jesus chose stumble again and again, and people who choose to follow Him often understand better. The chapter ends with one of them: a blind beggar who calls Jesus by name, receives his sight, and follows Him “in the way.”

sections:
  - range: 1-12
    heading: Marriage and divorce
    plain: |
      Jesus left there and came into the region of Judea, on the far side of the Jordan. Again crowds gathered to Him, and as He usually did, He taught them. Some Pharisees came and, to test Him, asked, “Is it lawful for a man to divorce his wife?” He answered, “What did Moses command you?” They said, “Moses allowed a man to write a certificate of divorce and send her away.” Jesus said to them, “He wrote you that rule because your hearts were hard. But from the beginning of creation, God made them male and female. For this reason a man will leave his father and mother and hold fast to his wife, and the two will become one flesh. So they are no longer two, but one flesh. What God has joined together, then, let no one separate.” In the house the disciples asked Him about this again. He told them, “Whoever divorces his wife and marries another commits adultery against her. And if a woman divorces her husband and marries another, she commits adultery.”
  - range: 13-16
    heading: Little children blessed
    plain: |
      People were bringing little children to Jesus for Him to touch them, and the disciples rebuked those who brought them. When Jesus saw it He was indignant and said to them, “Let the little children come to Me; do not stop them, for the kingdom of God belongs to such as these. Truly I tell you, whoever does not receive the kingdom of God like a little child will never enter it.” And He took them in His arms, laid His hands on them, and blessed them.
  - range: 17-31
    heading: The rich man, and what the disciples left
    plain: |
      As He was setting out on the road, a man ran up, knelt before Him, and asked, “Good Teacher, what must I do to inherit eternal life?” Jesus said to him, “Why do you call Me good? No one is good but One, that is, God. You know the commandments: Do not commit adultery, do not murder, do not steal, do not bear false witness, do not defraud, honor your father and mother.” He said to Him, “Teacher, I have kept all these since I was young.” Jesus looked at him and loved him, and said, “You lack one thing. Go, sell everything you have and give to the poor, and you will have treasure in heaven; then come, take up the cross, and follow Me.” At that saying his face fell, and he went away grieving, for he had great possessions.

      Jesus looked around and said to His disciples, “How hard it will be for those who have riches to enter the kingdom of God!” The disciples were astonished at His words. Jesus said to them again, “Children, how hard it is for those who trust in riches to enter the kingdom of God! It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God.” They were astonished beyond measure and said to one another, “Then who can be saved?” Jesus looked at them and said, “With men it is impossible, but not with God; for all things are possible with God.”

      Peter began to say to Him, “Look, we have left everything and followed You.” Jesus answered, “Truly I tell you, there is no one who has left house or brothers or sisters or father or mother or wife or children or lands for My sake and the gospel’s who will not receive a hundred times as much now in this age, houses and brothers and sisters and mothers and children and lands, along with persecutions, and in the age to come eternal life. But many who are first will be last, and the last first.”
  - range: 32-45
    heading: His death foretold a third time, and the request of James and John
    plain: |
      They were on the road going up to Jerusalem, and Jesus was walking ahead of them. The disciples were astonished, and those who followed were afraid. Again He took the Twelve aside and began to tell them what was going to happen to Him: “We are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes. They will condemn Him to death and hand Him over to the Gentiles, who will mock Him, scourge Him, spit on Him and kill Him. And on the third day He will rise again.”

      James and John, the sons of Zebedee, came to Him and said, “Teacher, we want You to do for us whatever we ask.” He said, “What do you want Me to do for you?” They said, “Grant that in Your glory we may sit one at Your right hand and the other at Your left.” Jesus said to them, “You do not know what you are asking. Can you drink the cup that I drink, or be baptized with the baptism I am baptized with?” They said, “We can.” Jesus said, “The cup that I drink you will drink, and with the baptism I am baptized with you will be baptized. But to sit at My right hand or at My left is not Mine to give except to those for whom it has been prepared.”

      When the other ten heard this, they began to be indignant with James and John. Jesus called them together and said, “You know that those who are recognized as rulers of the Gentiles lord it over them, and their great men exercise authority over them. It shall not be so among you. Whoever wants to be great among you must be your servant, and whoever wants to be first among you must be the slave of all. For even the Son of Man did not come to be served, but to serve, and to give His life as a ransom for many.”
  - range: 46-52
    heading: Blind Bartimaeus
    plain: |
      They came to Jericho. As Jesus was leaving Jericho with His disciples and a large crowd, a blind beggar, Bartimaeus son of Timaeus, was sitting by the roadside. When he heard that it was Jesus of Nazareth, he began to shout, “Jesus, Son of David, have mercy on me!” Many told him sternly to be quiet, but he shouted all the louder, “Son of David, have mercy on me!” Jesus stopped and said, “Call him.” So they called the blind man and said to him, “Take heart; get up, He is calling you.” Throwing off his cloak, he sprang up and came to Jesus. Jesus asked him, “What do you want Me to do for you?” The blind man said, “Master, let me receive my sight.” Jesus said to him, “Go your way; your faith has made you whole.” At once he received his sight and followed Jesus on the road.

notes:
  - ref: 2
    phrase: Is it lawful for a man to put away his wife? tempting him
    kind: history
    title: A question meant to trap
    body: |
      The Pharisees’ question touched a live dispute among the Pharisees themselves. The followers of Shammai allowed divorce only for adultery; the followers of Hillel allowed it for a wide range of reasons, even, it was said, a burnt dinner. Mark puts the question in its barest form, “Is it lawful for a man to put away his wife?”, and says it was asked “tempting him,” to test Him. The aim may have been to make Him take the side of one school against the other. In Matthew’s telling, where the question is whether a man may put away his wife “for every cause” ([[Matt. 19:3]]), the Pharisees may have hoped to show the crowds that He stood near Shammai, and so turn against Him those of His followers who held the easier view.
    sources: [ellison-family-celibacy, draper-divorce, frederick-divorce]
  - ref: 4
    phrase: Moses suffered to write a bill of divorcement
    kind: history
    title: Suffered, not commanded
    body: |
      In Mark, Jesus answers the question with one of His own: “What did Moses command you?” The law they had in mind is [[Deut. 24:1]], which assumes that a man may write his wife “a bill of divorcement” and send her away, and regulates what follows. The question made the Pharisees cite the law itself, and once they had, they had to admit that it contained no such commandment. Moses only “suffered” the practice, reluctantly allowed it, and Jesus says why: “for the hardness of your heart.”

      Then Jesus steps outside the rabbis’ debate altogether. Rather than argue over what grounds Deuteronomy permits, He goes back to Genesis 1–2, to God’s first instructions on marriage: “God made them male and female” ([[Gen. 1:27]]) and “they twain shall be one flesh” ([[Gen. 2:24]]). The concession came later and was made for hard hearts; the creation shows what God intended. How the Church applies that concession today, while hearts are still hard, is explained at the same saying in Matthew (see the note on [[Matt. 19:9]]).
    sources: [draper-divorce, frederick-divorce]
  - ref: 9
    phrase: What therefore God hath joined together
    kind: scripture
    title: What God hath joined
    body: |
      The Greek verb for “joined” means yoked: God Himself yoked the man and the woman together, and it is presumptuous for anyone to pull apart what He has joined. Marriage, on this teaching, is of God.

      Restoration scripture repeats Jesus’s words and takes them further. Marriage “is ordained of God unto man,” and “they twain shall be one flesh” ([[D&C 49:15–16]]); and the new and everlasting covenant of marriage is the way into the highest degree of the celestial glory ([[D&C 131:1–4]]). From these revelations Latter-day Saints understand marriage as divinely ordained and potentially eternal.
    sources: [draper-divorce, ellison-family-celibacy, lds-scriptures]
  - ref: 11
    phrase: committeth adultery against her
    kind: history
    title: Adultery against her
    body: |
      What would most have startled Mark’s first readers is the last two words. In the ancient world adultery was an offense against a man: against the husband of a married woman, or the father of an unmarried one. Jesus says that a man who divorces his wife and marries another commits adultery “against her.” The husband is under the same moral obligation as the wife, and each has a claim on the other’s fidelity. In God’s eyes, the reasoning runs, the bond that made them one flesh is still there after the bill of divorcement, so the wrong is done to the first wife.

      Only Mark adds verse 12, a woman who puts away her husband and marries another. It is the only place in Jesus’s teaching that names that case, and it judges the wife who leaves by the same standard as the husband who leaves. Mark’s saying has no exception; Matthew’s has one, “except it be for fornication” ([[Matt. 19:9]]), and other New Testament passages show the early Church recognizing legitimate grounds for divorce.
    sources: [ellison-family-celibacy, draper-divorce, ellicott-mark]
  - ref: 14
    phrase: he was much displeased
    kind: history
    title: Much displeased
    body: |
      Only Mark says that Jesus was “much displeased,” and only Mark uses that word of Him. The disciples were not being cruel. They wanted to spare their Master needless demands on His time, and they may still have held the common view that women and children were of lesser standing, and that for them to seek the Master’s attention was presumptuous. Joseph Smith’s translation of Matthew’s account gives a different reason: “There is no need, for Jesus hath said, Such shall be saved” (JST Matt. 19:13). Whatever moved them, Jesus overruled them.

      Matthew says that He laid His hands on the children ([[Matt. 19:15]]); only Mark adds that He folded them in His arms and that He blessed them. He did the same for the Nephite children, taking them “one by one” and blessing them and praying to the Father for them ([[3 Ne. 17:21]]).
    sources: [ellicott-mark, talmage-jesus-christ-27, jst-matt-19, lds-scriptures]
  - ref: 15
    phrase: receive the kingdom of God as a little child
    kind: words
    title: As a little child
    body: |
      The Greek word for the children here, *paidion*, is used of a growing child up to about the age of seven. The qualities in view seem to be those of a small child: humble, poor, and wholly dependent on someone else for life. To receive the kingdom “as a little child” is, on this reading, to receive it that way, relying on Jesus Christ and His Atonement as a small child relies on the one who cares for it.

      King Benjamin put the same condition in the same terms: “men drink damnation to their own souls except they humble themselves and become as little children, and believe that salvation was, and is, and is to come, in and through the atoning blood of Christ, the Lord Omnipotent” ([[Mosiah 3:18]]). The risen Lord repeated it to the Nephites: “ye must repent, and be baptized in my name, and become as a little child, or ye can in nowise inherit the kingdom of God” ([[3 Ne. 11:38]]).
    sources: [korth-reed-little-children]
  - ref: 18
    phrase: Why callest thou me good?
    kind: christ
    title: Why callest thou me good?
    body: |
      Jesus is not denying that He is good, still less confessing a sin. The man had come in earnest, running and kneeling, but he seems to have used “Good Master” as a polite compliment, a courtesy to a respected teacher, not as a recognition that Jesus was God. Jesus declined the compliment on those terms, and turned the man’s attention to what the word means.

      In Jewish thought, with some exceptions, God alone could properly be called good, an idea that likely goes back to the Psalms: “O give thanks unto the LORD; for he is good” ([[Ps. 118:1]]). The Book of Mormon has the same higher sense of the word: “all things which are good cometh of God” ([[Moro. 7:12]]). Jesus’s question would have made the man think harder about the seriousness of his own question: he had asked the One he called good how to inherit eternal life.
    sources: [talmage-jesus-christ-27, sc-knowhy-499]
  - ref: 19
    phrase: Defraud not
    kind: words
    title: Defraud not
    body: |
      “Defraud not” is not one of the Ten Commandments ([[Ex. 20:12–17]]), and only Mark has it in the list. The Greek verb means in particular to keep back by fraud what is owed, as a laborer’s wages are kept back in [[James 5:4]] (compare [[Deut. 24:14]]; [[Mal. 3:5]]). In the list it seems to stand in for the tenth commandment, against coveting, applied to a man of great possessions: one who had made his money in the usual ways had reason to ask whether any of it had been gained at another’s expense.
    sources: [thayer, ellicott-mark]
  - ref: 21
    phrase: Then Jesus beholding him loved him
    kind: history
    title: Jesus beholding him loved him
    body: |
      Only Mark says that Jesus loved the man, and he says it before Jesus asks the hardest thing of him. “Beholding” means looking intently at him; the love showed in that steady look.

      The man had kept the law strictly and wanted more. What he lacked was willingness to put the kingdom of God above everything he owned. In Elder James E. Talmage’s reading, love of worldly things was this man’s besetting weakness, and Jesus prescribed for his case: sell, give to the poor, take up the cross (see the note on [[Mark 8:34]]), and follow. The same treatment is not prescribed for every disciple. The man’s face fell at the saying and he went away grieved; Mark gives the reason in four words, “he had great possessions.”
    sources: [ellicott-mark, talmage-jesus-christ-27]
  - ref: 25
    phrase: It is easier for a camel to go through the eye of a needle
    kind: words
    title: A camel through the eye of a needle
    body: |
      The camel and the needle is a rhetorical figure. Severe as it sounds in English, it was of a type familiar to those who heard it. The disciples were “astonished out of measure,” and asked who then could be saved.

      Jesus does not say that wealth shuts the door. Riches are a temptation to which many give way, but no insurmountable barrier to the kingdom.
    sources: [talmage-jesus-christ-27]
  - ref: 27
    phrase: With men it is impossible, but not with God
    kind: scripture
    title: Those who trust in riches
    body: |
      “Who then can be saved?” the disciples ask, and Jesus answers that with God all things are possible. Joseph Smith’s translation makes the answer specific: “With men that trust in riches, it is impossible; but not impossible with men who trust in God and leave all for my sake, for with such all these things are possible” (JST Mark 10:26). In that reading the line falls between those who trust in riches and those who trust in God and leave all for His sake, and the second group is not beyond hope.
    sources: [lds-scriptures]
  - ref: 30
    phrase: with persecutions
    kind: words
    title: An hundredfold, with persecutions
    body: |
      The hundredfold is not a count of houses and mothers. What a disciple gains is a new family, the relationships that come from shared faith, new homes opened, new brothers and sisters and friends, and the ordinary joys of life deepened by having given up self for God’s kingdom.

      Only Mark adds the two words “with persecutions,” and they correct any expectation that the reward means a smooth life. Trials that test and strengthen belong to the life of the kingdom. Peter, who heard the words, later taught the Saints to “think it not strange concerning the fiery trial” and to rejoice in it as partakers of Christ’s sufferings ([[1 Pet. 4:12–13]]).
    sources: [ellicott-matthew, ellicott-mark]
  - ref: 31
    phrase: many that are first shall be last
    kind: scripture
    title: First and last, a rebuke to Peter
    body: |
      Joseph Smith’s translation changes the saying and says to whom it was aimed: “But there are many who make themselves first, that shall be last, and the last first. This he said, rebuking Peter” (JST Mark 10:30–31). Peter had just reminded Jesus, “Lo, we have left all, and have followed thee.” Coming straight after rewards beyond reckoning, the saying is also a caution to all who heard the promise, lest they count too surely on attaining it, neglect the effort, and grow proud.
    sources: [lds-scriptures, talmage-jesus-christ-27]
  - ref: 32
    phrase: 'Jesus went before them: and they were amazed'
    kind: history
    title: Amazed and afraid on the road
    body: |
      Only Mark draws this picture: Jesus walking ahead on the road up to Jerusalem, the disciples amazed, and those following afraid; Matthew and Luke say only that He took the Twelve aside ([[Matt. 20:17]]; [[Luke 18:31]]). Mark does not say what frightened them. The likeliest cause is the fate He was going up to meet: it so weighed on Jesus that His absorption and evident sadness amazed even the apostles, and they fell behind in amazement and fear. Mark’s wording may also distinguish two groups, the wider company of followers struck with a vague fear and the Twelve with something nearer terror. Then Jesus stopped, took the Twelve aside, and told them plainly why.
    sources: [talmage-jesus-christ-29, ellicott-mark]
  - ref: 34
    phrase: and the third day he shall rise again
    kind: christ
    title: The third time, and the plainest
    body: |
      Jesus’s third foretelling of His death in Mark ([[Mark 8:31]]; [[Mark 9:31]]) is the most explicit of the three. Each foretelling has the same three elements, His being handed over, killed, and rising on the third day; this one adds what the others did not: He will be delivered to the Gentiles, and they will mock Him, scourge Him, and spit on Him. A few verses later He gives the purpose of it all, to give His life “a ransom for many” (verse 45).

      Plain as the words were, the disciples do not seem to have taken them in. They knew Him to be the Christ, and they could tell that some great event was near; they may have imagined it as the moment they had been waiting for, His open proclamation as Messiah and His enthronement as King. It would be that, though not in the way they expected. The request that follows shows where their thoughts were.
    sources: [huntsman-preludes-last-week, smith-marks-unique-contribution, talmage-jesus-christ-29]
  - ref: 38
    phrase: can ye drink of the cup that I drink of?
    kind: symbol
    title: The cup and the baptism
    body: |
      Any reader of the Old Testament would have known the cup as a figure for what God pours out to a person, good or ill: the cup that “runneth over” ([[Ps. 23:5]]), or “the wine cup of this fury” ([[Jer. 25:15]]). The baptism is the same thought in another image. To baptize is to plunge into deep water, to be overwhelmed, and Jesus had already used the word of His coming suffering and death: “I have a baptism to be baptized with; and how am I straitened till it be accomplished!” ([[Luke 12:50]]). To both questions James and John answered, “We can.”

      Jesus’s answer is a prophecy that Mark’s story does not reach. James was the first of the Twelve to be killed for his testimony ([[Acts 12:2]]); John was left a long old age, exile on Patmos, and persecution.

      The seats themselves, Jesus says, are “not mine to give.” The words that follow in the King James Version, “it shall be given,” are not in the Greek, which reads only “but for whom it has been prepared”; what that changes is explained at the same saying in Matthew (see the note on [[Matt. 20:23]]).
    sources: [ellicott-matthew, smith-marks-unique-contribution, greek-nt]
  - ref: 43
    phrase: shall be your minister
    kind: words
    title: Minister and servant of all
    body: |
      When the other ten were angry at James and John, Jesus called all twelve and set two kinds of greatness side by side. Among the Gentiles, rulers lord it over their subjects. Among His disciples the great one is the “minister,” Greek *diakonos*, a word used here of those who advance others’ interests even at the sacrifice of their own; and the first is the “servant of all,” *doulos*, a slave, wholly devoted to another without regard to his own interests. Where Matthew has “your servant” ([[Matt. 20:27]]), Mark has “servant of all.”
    sources: [thayer]
  - ref: 45
    phrase: to give his life a ransom for many
    kind: christ
    title: A ransom for many
    body: |
      The verse grounds the teaching about service in Jesus Himself. He has just told the Twelve that the great among them must serve; now He says that the Son of Man came for the same purpose, not to be served but to serve, and that His service will go as far as giving His life.

      A ransom, Greek *lytron*, was the price paid to set someone free: to redeem a slave or a captive, or to buy back a forfeited life ([[Ex. 21:30]]). Jesus gives His life “for many,” to free them from the misery and penalty of their sins. He had spoken before of saving the lost; here He says that the saving would be a redemption, paid with His life. That is what the title Redeemer means: to redeem is “to pay off an obligation or a debt,” or “to rescue or set free as by paying a ransom.”
    sources: [thayer, ellicott-matthew, christofferson-redemption]
  - ref: 46
    phrase: blind Bartimæus, the son of Timæus
    kind: history
    title: Bartimaeus, son of Timaeus
    body: |
      *Bar* is Aramaic for “son,” so the name Bartimaeus means son of Timaeus, which is what Mark writes beside it.

      Matthew and Luke tell the story without naming him ([[Matt. 20:30]]; [[Luke 18:35]]). Why Mark names him is not known. One possibility is that Bartimaeus was known to Mark’s first readers and not to theirs, as Mark alone also names Alexander and Rufus, the sons of Simon of Cyrene ([[Mark 15:21]]).
    sources: [ellicott-mark, smith-marks-unique-contribution]
  - ref: 47
    phrase: Jesus, thou Son of David, have mercy on me
    kind: christ
    title: Thou Son of David
    body: |
      “Son of David” was a title of the Messiah, the promised king of David’s line, and by using it Bartimaeus showed that he believed Jesus could heal him and that he had faith in Him as the promised King and Deliverer of Israel. Mark draws out the irony: the Twelve, with eyes to see, have struggled all through the journey to understand who Jesus is, and a blind man knows Him and says so aloud, twice, over the crowd’s rebukes.

      Jesus does not correct the title here. Later, in the temple, He will ask how the Christ can be only David’s son when David calls Him Lord ([[Mark 12:35–37]]). The title may have fallen short because it suggested a king like David, without the suffering and death that were part of what Jesus came to do.
    sources: [talmage-jesus-christ-29, smith-marks-unique-contribution]
  - ref: 50
    phrase: casting away his garment
    kind: symbol
    title: Casting away his garment
    body: |
      Only Mark has the bystanders’ “Be of good comfort, rise; he calleth thee,” and what Bartimaeus did next: he threw off his outer cloak and sprang up. For a blind beggar the cloak was probably more than clothing; spread before him, it was how he collected the alms he lived on. Casting it aside showed him willing to leave his means of living behind to come to Jesus, which recalls what Jesus asked of those who would follow Him after the first foretelling of His death: to be willing to lose their lives for His sake ([[Mark 8:34–35]]).
    sources: [ellicott-mark, huntsman-preludes-last-week]
  - ref: 51
    phrase: Lord, that I might receive my sight
    kind: words
    title: Rabboni
    body: |
      The word the King James Version renders “Lord” is, in its Greek text, the Aramaic *Rabboni*, a title of honor and reverence. John translates the same word as “Master” or teacher, when Mary Magdalene says it at the tomb ([[John 20:16]]). Mark, as he often does, keeps the Aramaic word, and here leaves it untranslated.
    sources: [thayer, ellicott-matthew]
  - ref: 52
    phrase: thy faith hath made thee whole
    kind: christ
    title: Made whole, and following in the way
    body: |
      The Greek verb for “made thee whole” means to save as well as to heal (the footnote gives “saved, preserved, healed thee”). Bartimaeus’s faith brought him his sight, let him see Jesus for who He is, and saved him in a deeper, spiritual sense.

      He then “followed Jesus in the way,” which here meant going with Him from Jericho up the road to Jerusalem, where the Passion was about to begin. Mark’s account of the journey began with a blind man at Bethsaida who saw in two stages (see the note on [[Mark 8:25]]); it ends with this one, who sees at once and follows. His story has been read as a picture of full, clear spiritual understanding of Jesus’s mission.
    sources: [huntsman-preludes-last-week, lds-scriptures]

christ: |
  Mark 10 gives Jesus’s own summary of His mission: “the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (verse 45). He shows that in the chapter before He says it, taking children in His arms, loving a rich man who will not follow, bearing with disciples who want thrones, and stopping on the road to Jerusalem for a blind beggar. To receive His kingdom “as a little child” is to rely on Him as a child relies on the one who cares for it, trusting His atoning blood. Those who follow Him may go about doing good in the same redemptive pattern, under the influence of the Holy Spirit.

