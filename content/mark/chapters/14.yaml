chapter: 14
title: Not What I Will
tagline: A woman anoints Jesus for His burial, Judas goes to the chief priests, Jesus eats the Passover and gives the bread and the cup, prays in Gethsemane, is arrested and forsaken, confesses before the high priest that He is the Christ, and is denied three times by Peter.
when: 'Bethany and Jerusalem, from two days before the Passover to the night of Jesus’s arrest'

setting: |
  Mark 14 opens the last part of Mark’s story, the account of Jesus’s death. Jesus has finished His teaching in the temple and His discourse on the Mount of Olives ([[Mark 13]]); from here the Gospel moves without a break through one night and the next day to the cross and the tomb. The chapter runs from a supper in Bethany two days before the Passover to the high priest’s house on the night of the arrest. Counted by Mark’s own markers of time, the plot and the anointing fall on the Wednesday of the last week, and the Last Supper, Gethsemane, the arrest and the night hearing on Thursday evening and night, though the phrase “after two days” can be counted more than one way.

  Matthew, Luke and John tell these events too ([[Matt. 26]]; [[Luke 22]]; [[John 12–13]]; [[John 18]]). John places the anointing before the triumphal entry and has Mary of Bethany anoint Jesus’s feet ([[John 12:1–8]]), and he dates the supper before the feast of the Passover ([[John 13:1]]). Mark alone tells of the young man who fled naked and of the cock crowing twice.

  The anointing at Bethany stands at the hinge between the story of Jesus’s life and the story of His death: the woman anoints Him, and He says she has done it for His burial.

thread: |
  **Faithful and unfaithful, side by side.** Mark builds this chapter out of pairs. He sets the woman who pours out her ointment between the council that plots Jesus’s death and the disciple who goes to hand Him over, so that each throws light on the other. He sets the bread and the cup between two warnings of betrayal, Judas’s and Peter’s. And he sets Jesus before the high priest between two scenes of Peter by the fire, so that the two questionings seem to happen at once: inside the house Jesus says “I am,” and in the courtyard Peter says “I know not this man.”

  Through the chapter the company around Jesus grows smaller. One of the Twelve hands Him over; three of them sleep while He prays; “they all forsook him, and fled”; the last who follows Him leaves even his clothing behind; and Peter, who followed “afar off,” denies Him. Jesus goes on alone, and in Gethsemane He says to the Father, “not what I will, but what thou wilt.” Yet Mark does not end the night with the failure. Peter remembers the word of Jesus and weeps, and Jesus has already promised the scattered sheep, “after that I am risen, I will go before you into Galilee.”

sections:
  - range: 1-11
    heading: The plot, the anointing at Bethany, and Judas’s bargain
    plain: |
      It was two days before the Passover and the Feast of Unleavened Bread, and the chief priests and the scribes were looking for a way to arrest Jesus by stealth and put Him to death. “But not during the feast,” they said, “or the people may riot.” Jesus was in Bethany, at table in the house of Simon the leper, when a woman came in with an alabaster flask of very costly ointment of pure nard. She broke the flask and poured the ointment on His head. Some of those present were indignant and said to one another, “Why was this ointment wasted? It could have been sold for more than three hundred denarii and the money given to the poor.” And they scolded her. But Jesus said, “Leave her alone. Why are you troubling her? She has done a beautiful thing for Me. You always have the poor with you, and you can help them whenever you wish; but you will not always have Me. She has done what she could: she has anointed My body beforehand for its burial. Truly I tell you, wherever the gospel is preached in all the world, what she has done will be told in memory of her.” Then Judas Iscariot, one of the Twelve, went to the chief priests to hand Jesus over to them. They were glad to hear it and promised to give him money, and he began looking for a good opportunity to hand Him over.
  - range: 12-21
    heading: The Passover prepared and the betrayer named
    plain: |
      On the first day of Unleavened Bread, when the Passover lambs were sacrificed, His disciples asked Him, “Where do You want us to go and prepare for You to eat the Passover?” He sent two of them, saying, “Go into the city, and a man carrying a jar of water will meet you. Follow him, and say to the owner of the house he enters, ‘The Teacher asks, Where is My guest room, where I may eat the Passover with My disciples?’ He will show you a large upper room, furnished and ready. Prepare for us there.” The disciples went into the city, found everything as He had told them, and prepared the Passover. When evening came He arrived with the Twelve. As they were at table eating, Jesus said, “Truly I tell you, one of you who is eating with Me will hand Me over.” They began to be grieved and to ask Him one after another, “Is it I?” He answered, “It is one of the Twelve, one who dips with Me in the dish. The Son of Man goes as it is written of Him; but woe to that man by whom the Son of Man is handed over! It would have been better for that man if he had never been born.”
  - range: 22-25
    heading: The bread and the cup
    plain: |
      While they were eating, Jesus took bread, blessed it, broke it, gave it to them, and said, “Take, eat; this is My body.” Then He took a cup, gave thanks, and gave it to them, and they all drank from it. He said to them, “This is My blood of the new covenant, which is poured out for many. Truly I tell you, I will not drink again of the fruit of the vine until that day when I drink it new in the kingdom of God.”
  - range: 26-31
    heading: Peter’s denial foretold
    plain: |
      After singing a hymn they went out to the Mount of Olives. Jesus said to them, “All of you will stumble and fall away because of Me this night, for it is written, ‘I will strike the shepherd, and the sheep will be scattered.’ But after I am raised, I will go ahead of you into Galilee.” Peter said to Him, “Even if everyone else falls away, I will not.” Jesus said to him, “Truly I tell you, today, this very night, before the rooster crows twice, you will deny Me three times.” But Peter insisted all the more, “Even if I must die with You, I will never deny You.” And all the others said the same.
  - range: 32-42
    heading: Gethsemane
    plain: |
      They came to a place called Gethsemane, and He said to His disciples, “Sit here while I pray.” He took Peter, James and John with Him, and He began to be overwhelmed with awe and distress. He said to them, “My soul is sorrowful enough to die. Stay here and keep watch.” Going on a little farther, He fell to the ground and prayed that, if it were possible, the hour might pass from Him. “Abba, Father,” He said, “all things are possible for You. Take this cup away from Me. Yet not what I will, but what You will.” He came back and found them sleeping, and He said to Peter, “Simon, are you asleep? Could you not keep watch for one hour? Watch and pray, so that you do not enter into temptation. The spirit is willing, but the flesh is weak.” Again He went away and prayed the same words. When He came back He found them sleeping again, for their eyes were heavy, and they did not know what to say to Him. He came a third time and said to them, “Sleep on now, and take your rest. It is enough. The hour has come. Look, the Son of Man is being handed over into the hands of sinners. Get up, let us go. Here comes the one who hands Me over.”
  - range: 43-52
    heading: The arrest
    plain: |
      At once, while He was still speaking, Judas, one of the Twelve, arrived, and with him a crowd armed with swords and clubs, sent by the chief priests, the scribes and the elders. The one handing Him over had given them a signal: “The one I kiss is the man. Seize Him and lead Him away under guard.” As soon as Judas came, he went straight to Jesus, said, “Rabbi, Rabbi,” and kissed Him warmly. They laid hands on Him and seized Him. One of those standing by drew a sword and struck the high priest’s servant, cutting off his ear. Jesus said to them, “Have you come out with swords and clubs to capture Me, as you would a robber? Day after day I was with you in the temple teaching, and you did not seize Me. But the scriptures must be fulfilled.” Then all His disciples left Him and fled. A young man was following Him, wearing nothing but a linen cloth around his body. They seized him, but he left the linen cloth behind and ran away naked.
  - range: 53-65
    heading: Before the high priest
    plain: |
      They led Jesus away to the high priest, and all the chief priests, the elders and the scribes gathered together. Peter followed Him at a distance, right into the courtyard of the high priest, and sat with the servants, warming himself at the fire. The chief priests and the whole council looked for testimony against Jesus so they could put Him to death, but they found none. Many testified falsely against Him, but their testimonies did not agree. Some stood up and gave this false testimony: “We heard Him say, ‘I will destroy this temple made with hands, and in three days I will build another, not made with hands.’” But even on this their testimony did not agree. Then the high priest stood up in the middle and asked Jesus, “Have You no answer? What is this they testify against You?” But He kept silent and made no answer. Again the high priest asked Him, “Are You the Christ, the Son of the Blessed One?” Jesus said, “I am. And you will see the Son of Man seated at the right hand of Power, and coming with the clouds of heaven.” The high priest tore his clothes and said, “Why do we still need witnesses? You have heard the blasphemy. What is your decision?” And they all condemned Him as deserving death. Some began to spit on Him, to blindfold Him, to strike Him with their fists, and to say to Him, “Prophesy!” And the guards took Him and slapped Him.
  - range: 66-72
    heading: Peter’s denials
    plain: |
      While Peter was below in the courtyard, one of the high priest’s servant girls came by. Seeing Peter warming himself, she looked closely at him and said, “You were with Jesus of Nazareth too.” But he denied it: “I do not know or understand what you are talking about.” He went out into the entryway, and a rooster crowed. The servant girl saw him and began again to tell the bystanders, “This man is one of them.” Again he denied it. A little later the bystanders said to Peter, “Surely you are one of them, for you are a Galilean; your speech shows it.” But he began to call down curses and to swear, “I do not know this man you are talking about.” At once the rooster crowed a second time. Peter remembered the word Jesus had said to him, “Before the rooster crows twice, you will deny Me three times.” And when he thought about it, he wept.

notes:
  - ref: 2
    phrase: Not on the feast day, lest there be an uproar of the people
    kind: history
    title: Not on the feast day
    body: |
      The council feared the crowds, and that fear decided how and when Jesus was taken. The chief priests, the leading scribes and the elders made up the Sanhedrin, which under Roman rule was charged with keeping day-to-day order in Jerusalem. In Mark’s telling, Jesus’s cleansing of the temple seems to have been what set them against Him ([[Mark 11:15–18]]). But the city was filling with pilgrims who had cheered His rebukes of their leaders, and so the council looked for a way to take Him “by craft,” by stealth. “Not on the feast day” meant either not in the middle of the festival or at least not before the festival crowds; that is why He was arrested at night in Gethsemane rather than by day in the temple (verses 43–49). The rulers feared especially the Galileans then in the city, who were proud of Jesus as one of their own.
    sources: [huntsman-wednesday, talmage-jesus-christ-33]
  - ref: 3
    phrase: an alabaster box of ointment of spikenard very precious
    kind: words
    title: Spikenard very precious
    body: |
      Nard was a perfumed ointment made from a fragrant East Indian plant. The King James “spikenard” follows the Latin Vulgate; the Greek adjective beside it, *pistikos*, is taken to mean genuine, pure, unadulterated, for nard was often adulterated, though the word has been much discussed. The ointment was kept in an alabaster flask, and the woman broke the flask to pour it out.

      Mark gives more of the scene than Matthew does: only Mark names the spikenard, has the woman break the box, and gives its price ([[Matt. 26:6–13]]). “Three hundred pence” is three hundred denarii; the King James Version always renders the Roman silver denarius “penny.” The gift was worth about a year’s wages for a laborer.

      The host, “Simon the leper,” could hardly have had the disease still, for it would have made him ritually unclean and unable to give such a dinner. He had presumably been cured, perhaps by Jesus Himself.
    sources: [thayer, smith-marks-unique-contribution, bd-money, huntsman-wednesday]
  - ref: 3
    phrase: poured it on his head
    kind: christ
    title: The Christ anointed
    body: |
      To pour oil on a man’s head was to anoint him, and in Israel kings were anointed ([[1 Sam. 16:13]]), and priests ([[Ex. 40:13]]), and on occasion prophets. “Christ” is the Greek word for “anointed,” so this woman does to Jesus what His title says He is. Jesus gives her act another meaning: she has anointed His body for burial (verse 8). On one Latter-day Saint reading, the anointing is royal, priestly and funereal at once, and so shows what it means for Jesus to be the Christ: the King, the Priest, and the One who must die.

      The anointing comes at a turning point in Holy Week. It follows Jesus’s royal entry into the city and His authoritative teaching in the temple, and it comes just before He institutes the sacrament, suffers in Gethsemane and offers Himself on the cross, His priestly work. Peter confessed Jesus as the Christ in words ([[Mark 8:29]]) and then rebuked Him for speaking of His death; this woman says nothing, and acts out the confession with the death already in it.
    sources: [smith-marks-unique-contribution, huntsman-wednesday]
  - ref: 8
    phrase: she is come aforehand to anoint my body to the burying
    kind: history
    title: She hath done what she could
    body: |
      The woman seems to have understood what the Twelve did not: that Jesus had come to Jerusalem not to reign as its earthly king but to die. Mark’s chosen disciples fail Him again and again, while people who choose to follow Jesus on their own, among them this woman, understand Him better; she belongs with the poor widow of the previous chapter ([[Mark 12:41–44]]), one gift seemingly small and the other great. Mark leaves her unnamed, which lets her stand as a type of the ideal believer. Her act was also unusual: women did not generally perform anointings.

      Those who complain call her gift waste. Jesus’s answer does not set the poor aside: where Matthew has only “ye have the poor always with you” ([[Matt. 26:11]]), Mark has Him add, “whensoever ye will ye may do them good.”
    sources: [huntsman-wednesday, smith-marks-unique-contribution]
  - ref: 10
    phrase: went unto the chief priests, to betray him unto them
    kind: history
    title: Judas goes to the chief priests
    body: |
      Mark sets the woman’s gift between two dark scenes, the council’s plot (verses 1–2) and Judas’s visit to the chief priests (verses 10–11). It is one of his “sandwiches,” a story set inside another so that each is read in the light of the other: her devotion stands out against their scheming, and their scheming against her devotion.

      The word translated “betray” is *paradidōmi*, “hand over,” the word every Gospel uses for what Judas did, not the technical word for betrayal. It makes Judas’s act the first in a series of handings over that ends at the cross (see the note on [[Mark 9:31]]). The Greek Old Testament uses the same verb where “the LORD hath laid on him the iniquity of us all” ([[Isa. 53:6]]), and Paul says God “delivered him up for us all” ([[Rom. 8:32]]). The word lets the reader see the Father’s giving of His Son behind every human handing over: each was a necessary step in God’s plan for Jesus to deliver us.

      Why Judas did it the Gospels do not agree. Mark says only that the priests promised him money, not that he accepted it or handed Jesus over for it; Luke and John speak of Satan ([[Luke 22:3]]; [[John 13:2]]). Joseph Smith’s translation gives a reason of its own: Judas went “to betray Jesus unto them; for he turned away from him, and was offended because of his words” (JST Mark 14:31). “Iscariot” means a man of Kerioth, a town of Judah, which made him the only one of the Twelve who was not a Galilean.
    sources: [smith-marks-unique-contribution, huntsman-wednesday, lds-scriptures, bd-judas]
  - ref: 12
    phrase: when they killed the passover
    kind: history
    title: A Passover meal
    body: |
      Mark, Matthew and Luke all present the Last Supper as a Passover meal. The Passover lamb was killed on the afternoon of the fourteenth of Nisan, before the festival began at sunset, and eaten that night in Jerusalem. John’s timing differs: he dates the supper “before the feast of the passover” ([[John 13:1]]), and on the next morning the leaders have not yet eaten it ([[John 18:28]]), so that Jesus dies on the cross in the hours when the Passover lambs were being sacrificed in the temple. Some propose that Jesus held a Passover, or a meal like it, a day early, knowing He would be dead when the feast came; no attempt to reconcile the two chronologies, by rival calendars or otherwise, has settled the question. The safest course may be to suspend judgment and receive both witnesses: in Mark, the Lord’s Supper takes up the Passover and fulfils it with a new covenant; in John, Christ is Himself the Lamb.
    sources: [huntsman-thursday]
  - ref: 13
    phrase: a man bearing a pitcher of water
    kind: history
    title: The man with the water jar
    body: |
      Jerusalem was crowded with pilgrims, and each company had to find a room in the city to eat the Passover. Jesus’s directions can be read as prophetic insight. They may also show that He had arranged the room beforehand with its owner. Carrying water was usually women’s work, so a man with a water jar would have been easy to pick out, and he seems to have been looking for them: apparently a signal agreed in advance. Mark names only the Twelve at the table (verse 17), but because the Passover was eaten in family groups, the company in the upper room may have included more than the Twelve, perhaps the women who had followed Jesus from Galilee ([[Mark 15:40–41]]).
    sources: [huntsman-thursday]
  - ref: 19
    phrase: to say unto him one by one, Is it I?
    kind: history
    title: Is it I?
    body: |
      Told that one of them would hand Jesus over, the disciples asked one by one about themselves. Each who asked seems to have feared that he might be the offender, however unwittingly, rather than wondering which of his brethren was the traitor. Jesus’s answer, “one of the twelve, that dippeth with me in the dish,” names no one: all of them were eating with Him from the common dish. Mark does not single out Judas’s own question, as Matthew does ([[Matt. 26:25]]).
    sources: [talmage-jesus-christ-33]
  - ref: 22
    phrase: 'Take, eat: this is my body'
    kind: scripture
    title: In remembrance of my body
    body: |
      Mark gives the words over the bread briefly, and Joseph Smith’s translation opens them out into an ordinance of remembrance: “Take it, and eat”; “Behold, this is for you to do in remembrance of my body; for as oft as ye do this ye will remember this hour that I was with you” (JST Mark 14:20–21). The bread, broken, blessed and offered first, recalls His bruised body and broken heart and His physical suffering on the cross, and that suffering ensures that every member of the human family will rise from the grave.
    sources: [jst-mark-14, holland-remembrance]
  - ref: 24
    phrase: This is my blood of the new testament, which is shed for many
    kind: words
    title: The blood of the new covenant
    body: |
      “Testament” here translates the Greek *diathēkē*. In classical Greek the word meant a last will and testament, but in the Greek Old Testament it rendered the Hebrew *bərît*, the covenant between God and His people, and that is its sense here: “my blood of the covenant.” The earliest manuscripts of Mark read just that; “new” is in the later Greek text the King James follows. In every manuscript the blood is “shed for many,” and the words recall the blood with which Moses sealed the covenant at Sinai, “Behold the blood of the covenant” ([[Ex. 24:8]]); the word “new” adds Jeremiah’s promise of a new covenant written in the heart ([[Jer. 31:31–33]]). “Shed for many” echoes what Jesus had said on the road to Jerusalem, that He came “to give his life a ransom for many” ([[Mark 10:45]]).

      Joseph Smith’s translation again makes the cup a remembrance, and adds a charge: “This is in remembrance of my blood which is shed for many, and the new testament which I give unto you; for of me ye shall bear record unto all the world” (JST Mark 14:23). The cup recalls the shedding of Christ’s blood and the depth of His spiritual suffering, which began in Gethsemane that same night. That suffering paid for Adam’s transgression and for the sins of all, and it brings remission of sins on conditions of obedience to the principles and ordinances of His gospel.
    sources: [huntsman-thursday, thayer, jst-mark-14, holland-remembrance]
  - ref: 25
    phrase: until that day that I drink it new in the kingdom of God
    kind: scripture
    title: Drinking it new
    body: |
      With these words Jesus looks past His death, alluding to the messianic banquet, the feast of the Messiah’s coming kingdom that stands in scripture for eternal fellowship with God at the end of time ([[Isa. 25:6–8]]). In this dispensation He has named the guests: “the hour cometh that I will drink of the fruit of the vine with you on the earth,” and with the prophets of every dispensation, Moroni and Elijah, Abraham and Michael, Peter, James and John among them, “and also with all those whom my Father hath given me out of the world” ([[D&C 27:5–14]]).

      Joseph Smith’s translation makes this hour itself part of what is remembered: “ye will remember me in this hour that I was with you and drank with you of this cup, even the last time in my ministry” (JST Mark 14:24).
    sources: [huntsman-thursday, jst-mark-14]
  - ref: 26
    phrase: when they had sung an hymn
    kind: history
    title: The hymn
    body: |
      The hymn sung at the close of the Passover would have been part of the Hallel, Psalms 113–118, songs praising God for delivering Israel from Egypt. Psalms 113 and 114 were usually sung before the meal, so the company may have sung Psalms 115–118 as they rose to go out.
    sources: [bd-hymns, huntsman-thursday]
  - ref: 27
    phrase: I will smite the shepherd, and the sheep shall be scattered
    kind: scripture
    title: The shepherd struck, the sheep scattered
    body: |
      “Ye shall be offended” translates a Greek word that literally means “caused to stumble,” and that can also mean to fall away or give up believing. Jesus explains it with [[Zech. 13:7]]: when the shepherd is struck, the sheep scatter. The prophecy anticipates how the disciples will flee at His arrest (verse 50).

      Jesus softens the prophecy in the same breath: “after that I am risen, I will go before you into Galilee” (verse 28). The promise is repeated at the empty tomb, where the young man tells the women to tell “his disciples and Peter” that He goes before them into Galilee ([[Mark 16:7]]), and it was fulfilled when the risen Lord appeared to them there. In Mark this warning, and the warning to Peter that follows it, come after the bread and the cup, so that the ordinance by which believers remember Jesus is framed by two predictions of betrayal, Judas’s before it (verses 18–21) and Peter’s after it.
    sources: [huntsman-thursday, huntsman-peters-denial]
  - ref: 30
    phrase: before the cock crow twice, thou shalt deny me thrice
    kind: history
    title: Before the cock crow twice
    body: |
      Only Mark has the rooster crow twice; Matthew, Luke and John have it crow once. The difference was felt early: some Greek manuscripts move “twice” within the verse or drop it to bring Mark into line with the others, but the manuscript evidence is strong enough that textual critics are confident it is what Mark wrote. Why Mark has it is not known. It may give the saying a proverbial ring, like the counting “for three things … and for four” in [[Prov. 30:21]]; or, if Peter stands behind Mark’s Gospel, the double cockcrow may preserve his own vivid memory of that night. Mark also says “this day, even in this night,” perhaps for readers who did not know that a Jewish day began at sunset.

      “Thou shalt deny” is best read as a prediction, not a command. Some Latter-day Saints, hoping to excuse Peter, have read it as an instruction to deny Jesus so that he could escape arrest and live to lead the Church. In Mark the Greek form is a future, and the natural sense of that future is that Jesus foresaw what Peter would do. The grammar cannot settle the question alone, since Jesus presumably spoke to Peter in Aramaic, not Greek; but the context points the same way, for the saying follows “All ye shall be offended because of me this night” (verse 27), which is certainly a prediction. Not all that passed between them is known, nor what protective counsel the Savior may have given His Apostles privately; what the text shows is that Jesus knew even His closest friends would not stand with Him, and warned Peter.
    sources: [huntsman-peters-denial, holland-none-with-him]
  - ref: 32
    phrase: a place which was named Gethsemane
    kind: history
    title: Gethsemane
    body: |
      Gethsemane is Aramaic, *gat šəmānî*, “oil press.” Only Mark and Matthew give the name; John calls it a garden across the brook Cedron ([[John 18:1]]), and Luke says only that it was on the Mount of Olives ([[Luke 22:39]]). The name suggests a working olive grove with its press, probably a private plot on the slope of the Mount of Olives across the Kidron valley from the city, a place where Jesus often went with His disciples ([[John 18:2]]).

      Joseph Smith’s translation turns the attention here to the disciples. In that translation the disciples are the ones who “began to be sore amazed, and to be very heavy, and to complain in their hearts, wondering if this be the Messiah”; Jesus, “knowing their hearts,” takes Peter, James and John with Him and rebukes them before He asks them to watch (JST Mark 14:36–38). Even the Twelve, that night, did not yet grasp what kind of Messiah He was.
    sources: [huntsman-thursday, bd-gethsemane, jst-mark-14]
  - ref: 33
    phrase: began to be sore amazed, and to be very heavy
    kind: christ
    title: Sore amazed, and very heavy
    body: |
      Mark’s words for what came upon Jesus in the garden are strong ones. *Ekthambeomai*, “sore amazed,” means to be thoroughly amazed, even struck with terror; in the New Testament only Mark uses it. *Adēmoneō*, “very heavy,” means to be troubled, distressed; the footnote gives “depressed, dejected, in anguish.” The sorrow seems to have been in a measure surprising to Jesus Himself. It was not fear of death, for death was to Him the way to resurrection and return to the Father, and He had power to lay down His life of His own will; it was a spiritual agony such as only God could experience. In some way real but beyond human understanding, He took upon Himself the burden of the sins of mankind from Adam to the end of the world.

      Mark tells what the three disciples could see and hear. Jesus Himself has told what He suffered: “which suffering caused myself, even God, the greatest of all, to tremble because of pain, and to bleed at every pore, and to suffer both body and spirit—and would that I might not drink the bitter cup, and shrink” ([[D&C 19:18]]). That revelation, with King Benjamin’s prophecy that “blood cometh from every pore” ([[Mosiah 3:7]]), is the foundation of the Latter-day Saint teaching that Jesus’s atoning suffering for sin began in this garden.
    sources: [thayer, lds-scriptures, talmage-jesus-christ-33, huntsman-thursday]
  - ref: 36
    phrase: Abba, Father
    kind: words
    title: Abba, Father
    body: |
      *Abba* is the Aramaic word for “father,” and Mark records Jesus addressing God with it and then with its Greek, *ho patēr*, “the Father”; the King James “Abba, Father” keeps both. The word appears in only two other verses of the New Testament. In that most burdensome hour, with blood at every pore, Christ cried to His Father as a son: “Papa,” or from the lips of a younger child, “Daddy.” Whether *abba* was only so familiar a word, or a formal and respectful one, has been argued; one Latter-day Saint reading holds that in this, the Son’s final report of His stewardship as the Suffering Servant, it is at once deeply intimate and profoundly respectful.

      What He asks is that the cup be taken away; what He wants above that is the Father’s will. However often the request was repeated (verse 39), it was always conditional, and the Father’s will was never lost sight of. The cup was not taken away. The risen Lord’s first words to the Nephites were “I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world” ([[3 Ne. 11:11]]).
    sources: [holland-hands-fathers, hoskisson-abba, talmage-jesus-christ-33, lds-scriptures]
  - ref: 37
    phrase: Simon, sleepest thou? couldest not thou watch one hour?
    kind: history
    title: Could not thou watch one hour?
    body: |
      Three times Jesus prays, and three times He returns to find Peter, James and John asleep; Mark often tells things in threes, and this sorrowful three is followed by Peter’s three denials. The sleeping disciples are among the failures Mark records without softening them, from not understanding the parables to fleeing at the arrest; in his Gospel the disciples are learners who stumble again and again, and Jesus’s patience with them is itself a witness of the power of His Atonement.

      “The spirit truly is ready, but the flesh is weak” fits Peter exactly. Hours earlier he had vowed to lay down his life for Jesus ([[John 13:37]]) and sworn that he would not deny Him (verse 31); in that bold avowal he reckoned with the willingness of his spirit and not with the weakness of his flesh. On the third return Jesus says, “Sleep on now, and take your rest,” words that can be heard as compassionate, though there would be no rest for Him.
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-33, holland-none-with-him]
  - ref: 45
    phrase: Master, master; and kissed him
    kind: words
    title: Rabbi, Rabbi, and a kiss
    body: |
      “Master, master” is in the Greek *rhabbi, rhabbi*, the title of honor with which Jews addressed their teachers, here doubled. The verb for the kiss is not the plain one Judas named in his signal (verse 44) but a stronger compound, *kataphileō*, to kiss much, again and again, tenderly.

      Luke’s account, where Jesus asks, “betrayest thou the Son of man with a kiss?” ([[Luke 22:48]]), supports the usual view that Judas turned a disciple’s token of respect and devotion to his master into its opposite. In Mark the stress falls elsewhere: Judas’s part is mainly to show the authorities where and how to take Jesus without the uproar they feared (verses 1–2).
    sources: [thayer, huntsman-thursday]
  - ref: 50
    phrase: they all forsook him, and fled
    kind: christ
    title: They all forsook him
    body: |
      What Jesus foretold on the way to the Mount of Olives comes true: the shepherd is struck and the sheep scatter (verse 27). Every one of the disciples who had said he would die rather than deny Him (verse 31) runs. In fleeing they abandon Him almost as surely as Judas handed Him over; theirs is only the more passive act.

      The circle around Jesus has been growing smaller all night, and of divine necessity. Peter would follow at a distance and be confronted; John would stand by the cross with Jesus’s mother ([[John 19:25–27]]), and the women would stay as close to Him as they could ([[Mark 15:40]]). But the Savior’s journey to the Atonement went on essentially without comfort or companionship. Because He walked that path utterly alone, those who follow Him do not have to.
    sources: [huntsman-thursday, holland-none-with-him]
  - ref: 51
    phrase: a certain young man, having a linen cloth cast about his naked body
    kind: history
    title: The young man who fled naked
    body: |
      Only Mark tells of this young man, and it is probably the most puzzling episode in his Gospel. Mark gives no hint of who he was. A few have suggested that he was Mark himself, but that is speculation. Joseph Smith’s translation calls him “a disciple,” so he was one of those following Jesus. He wore only a *sindōn*, a light linen garment, and when the arresting party seized it, he slipped out of it and ran.

      One reading takes him as a figure of all the disciples that night. Jesus’s disciples had once left everything to follow Him ([[Mark 10:28]]); this young man now leaves everything he has, even the clothes on his body, to get away from Him. Mark uses the same word, *neaniskos*, “young man,” only once more, for the young man in white who meets the women at the empty tomb ([[Mark 16:5]]), so the two may be the same person; that possibility belongs to chapter 16.
    sources: [smith-marks-unique-contribution, bd-gospels, lds-scriptures, huntsman-thursday]
  - ref: 56
    phrase: their witness agreed not together
    kind: history
    title: False witnesses who did not agree
    body: |
      The council could not condemn without testimony, and the law required that a matter be established by two or three witnesses who agreed ([[Deut. 17:6]]; [[Deut. 19:15]]). Many testified, but no two agreed. The charge they came nearest to was that Jesus had threatened to destroy the temple, which was itself a kind of blasphemy, against God’s house. Mark calls even that testimony false, and John records what Jesus had actually said: “Destroy this temple, and in three days I will raise it up,” for “he spake of the temple of his body” ([[John 2:19–21]]).

      The arrest came at night and the hearing at night, hurried so that Jesus could be brought before the Romans early in the morning, and both have been judged unlawful. Lives of Christ written in the late nineteenth century often listed such “illegalities,” judging the Gospels by the Mishnah, a compilation of Jewish tradition from around AD 200, much later than Jesus’s day. A more recent Latter-day Saint reading is more cautious: read on their own terms, the Gospels give only an overview of what seems to have been a preliminary hearing, in which the leaders settled how to deal with Jesus before Pilate the next morning ([[Mark 15:1]]).
    sources: [huntsman-peters-denial, huntsman-thursday, bd-blasphemy, lds-scriptures, talmage-jesus-christ-34]
  - ref: 62
    phrase: 'I am: and ye shall see the Son of man sitting on the right hand of power'
    kind: christ
    title: Art thou the Christ? I am
    body: |
      To the false witnesses Jesus answers nothing, as the servant of Isaiah “opened not his mouth” ([[Isa. 53:7]]). To the high priest’s direct question He answers plainly. “Blessed” is a word the New Testament applies to God, so “the Son of the Blessed” means the Son of God. In Mark the reply is simply “I am”; Matthew has “Thou hast said” ([[Matt. 26:64]]) and Luke “Ye say that I am” ([[Luke 22:70]]). Mark’s is the plainest of the three, an unambiguous claim to be the Christ, and Mark has already shown what kind of Christ is making it: the Anointed One, anointed for His burial (verse 8).

      He goes on in the words of two scriptures: the Lord’s invitation to sit at His right hand ([[Ps. 110:1]]) and Daniel’s vision of one like the Son of Man coming with the clouds of heaven ([[Dan. 7:13–14]]). The council heard blasphemy, contemptuous speech against God. The charge would have been true had Jesus not been all that He said He was, and its penalty under the law was death ([[Lev. 24:16]]). There could be no crime in claiming to be the Messiah or the Son of God unless the claim was false, and no one asked whether it was.
    sources: [lds-scriptures, thayer, smith-marks-unique-contribution, huntsman-thursday, bd-blasphemy, talmage-jesus-christ-34]
  - ref: 66
    phrase: as Peter was beneath in the palace
    kind: structure
    title: Two questionings at once
    body: |
      Mark has already brought Peter into the high priest’s courtyard (verse 54) before telling of the hearing, and he returns to him after it, so that Jesus’s trial is set inside the story of Peter’s. It is the last of Mark’s “sandwiches,” and the two stories are meant to be read together. Above, the high priest questions Jesus; below, and as Mark portrays it at the same time, a servant girl questions Peter, with a very different result. Jesus, asked whether He is the Christ, says “I am.” Peter, asked whether he was with Jesus of Nazareth, says he does not know what she means.
    sources: [smith-marks-unique-contribution, huntsman-peters-denial]
  - ref: 71
    phrase: he began to curse and to swear
    kind: words
    title: I know not this man
    body: |
      The three denials grow worse. To the servant girl Peter says he does not know or understand what she means. When she points him out to the bystanders, “he denied it again”; the Greek tense may mean he kept on denying, or that he tried, and failed, to disown Jesus. When the bystanders say his Galilean speech gives him away, he calls down curses and swears an oath, “I know not this man,” which may amount to a formal renunciation of any tie with Jesus.

      The verb “deny,” *arneomai*, means here to repudiate or disown. What Peter denied was that he knew Jesus or was His disciple, and that is a serious thing. But “Peter never denied the divinity of Christ. He only denied his association or acquaintance with the Christ, which is quite a different matter.” The confession he had made at Caesarea Philippi, that Jesus is the Christ ([[Mark 8:29]]), he never denied.
    sources: [huntsman-peters-denial, kimball-peter-my-brother]
  - ref: 72
    phrase: when he thought thereon, he wept
    kind: history
    title: When he thought thereon, he wept
    body: |
      “When he thought thereon” translates a single Greek participle, *epibalōn*, whose meaning here has been explained in different ways; the lexicon’s sense is “when he had considered” the words of Jesus. Matthew and Luke say that Peter “went out, and wept bitterly” ([[Matt. 26:75]]); Mark says only that he remembered, considered, and wept. His tears were those of real contrition and true repentance, as his later life shows.

      The greatest lesson of the denials may be that Peter, like everyone, could make mistakes, and through Jesus Christ could be fully redeemed, rehabilitated and able to serve faithfully. The risen Lord asked him three times whether he loved Him, giving him the chance to answer his three denials with three declarations of love ([[John 21:15–17]]). Almost at once Christ raised Peter to the highest place in His Church. In Mark the promise that reaches him is the young man’s word at the tomb: “tell his disciples and Peter” ([[Mark 16:7]]).
    sources: [thayer, talmage-jesus-christ-34, huntsman-peters-denial, kimball-peter-my-brother]

christ: |
  Mark 14 shows Jesus Christ choosing His death with open eyes. He accepts the woman’s ointment as His burial anointing, gives His disciples the bread and the cup as the tokens of a new covenant in His blood, and in Gethsemane takes the bitter cup from His Father’s hand: “nevertheless not what I will, but what thou wilt.” Before the council He confesses that He is the Christ, the Son of the Blessed, while His friends sleep, flee and deny Him. Because He walked that path alone, no disciple now walks his own path unaided ([[John 14:18]]). The bread and water of the sacrament bring that hour back, “in remembrance of my body” and “of my blood,” and the same Lord who foretold Peter’s fall soon raised him to the highest place in His Church; failure honestly wept over is not the end of a disciple’s story.

