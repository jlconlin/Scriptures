chapter: 3
title: The Twelve, and the Strong Man Bound
tagline: Jesus heals a withered hand on the Sabbath and His enemies plot His death; He chooses the Twelve; His family think Him out of His mind and scribes say He casts out devils by Beelzebub, and He answers that He has bound the strong man and that whoever does the will of God is His family.
when: 'During Jesus’s ministry in Galilee'

setting: |
  Mark arranges much of his account of the ministry in Galilee by the kind of material rather than by date, and chapter 2 set a run of disputes side by side: over forgiving sins, eating with publicans and sinners, fasting, and grain plucked on the Sabbath. The healing of the withered hand is the last of them, the second of two Sabbath controversies that Matthew, Mark and Luke all tell one after the other. It ends with Pharisees and Herodians taking counsel how to destroy Him.

  Jesus then withdraws to the sea, where crowds from as far as Idumaea and Tyre press on Him, and goes up a mountain to choose the Twelve. The rest of the chapter is built in a way Mark uses often: a story set inside another. His family set out to lay hold on Him (verses 20–21), scribes from Jerusalem charge Him with working by Beelzebub (22–30), and His mother and brethren arrive (31–35). Only Mark tells that His family thought He had lost His mind.

  Matthew tells these stories in chapters 10 and 12, Luke in chapters 6, 8 and 11. The notes here answer Mark’s reader; the notes on [[Matt. 12]] go further on the Sabbath, the strong man and the sin against the Holy Ghost, and are linked where Mark shares them.

thread: |
  **Who understands Jesus?** Group after group in Mark 3 passes a verdict on Him, and most of the verdicts are wrong.

  Pharisees watch Him in the synagogue “that they might accuse him,” and when He restores a man’s hand they plot His death (verses 2, 6). The unclean spirits, by contrast, know exactly who He is: “Thou art the Son of God” (verse 11). Mark lets the contrast stand: Satan’s servants recognized Jesus, while the religious authorities only wanted to be rid of Him. His own kinsmen say, “He is beside himself” (verse 21). Scribes come from Jerusalem and say, “He hath Beelzebub” (verse 22).

  Mark sets the scribes’ charge inside the story of His family, and his way of framing a story asks the reader to understand the center in light of what surrounds it. Against all these judgments Jesus gives His own answers. He calls the Twelve “that they should be with him.” He shows by the devils going out that the strong man has been bound. He warns that to call His power Satan’s comes near the one sin that has no forgiveness. And He names a new family: “whosoever shall do the will of God, the same is my brother, and my sister, and mother” (verse 35).

sections:
  - range: 1-6
    heading: A withered hand healed on the Sabbath
    plain: |
      Jesus went into the synagogue again, and a man was there whose hand was withered. They watched Jesus closely to see whether He would heal him on the Sabbath, so that they could accuse Him. He said to the man with the withered hand, “Stand up here in front.” Then He asked them, “Is it lawful on the Sabbath to do good or to do harm, to save a life or to kill?” But they said nothing. He looked around at them in anger, grieved at how hard their hearts were, and said to the man, “Stretch out your hand.” He stretched it out, and his hand was restored, as sound as the other. The Pharisees went out and at once began plotting with the Herodians against Him, how they might destroy Him.
  - range: 7-12
    heading: Crowds by the sea
    plain: |
      Jesus withdrew with His disciples to the sea, and a great crowd followed Him from Galilee and from Judea, from Jerusalem and Idumaea and the land beyond the Jordan, and from around Tyre and Sidon. They had heard what great things He was doing, and they came to Him. He told His disciples to keep a small boat ready for Him because of the crowd, so that they would not crush Him; for He had healed many, and all who had diseases were pushing forward to touch Him. Whenever unclean spirits saw Him, they fell down before Him and cried out, “You are the Son of God.” And He sternly ordered them not to make Him known.
  - range: 13-21
    heading: The Twelve chosen
    plain: |
      He went up on a mountain and called to Him those He wanted, and they came to Him. He appointed twelve, so that they would be with Him and so that He could send them out to preach, with authority to heal sicknesses and to cast out devils. Simon He named Peter; James the son of Zebedee and John his brother He named Boanerges, which means “sons of thunder”; and Andrew, Philip, Bartholomew, Matthew, Thomas, James the son of Alphaeus, Thaddaeus, Simon the Zealot, and Judas Iscariot, who betrayed Him. Then they went into a house, and the crowd gathered again, so that they could not even eat. When His family heard of it, they went out to take charge of Him, for they said, “He is out of His mind.”
  - range: 22-30
    heading: Accused of casting out devils by Beelzebub
    plain: |
      The scribes who had come down from Jerusalem said, “He has Beelzebub,” and, “He casts out devils by the prince of the devils.” Jesus called them to Him and spoke to them in parables: “How can Satan cast out Satan? If a kingdom is divided against itself, that kingdom cannot stand. If a house is divided against itself, that house cannot stand. And if Satan has risen up against himself and is divided, he cannot stand; he is finished. No one can go into a strong man’s house and carry off his goods unless he first ties up the strong man; then he can plunder his house. I tell you the truth: people will be forgiven all their sins and whatever blasphemies they speak. But whoever blasphemes against the Holy Ghost never has forgiveness, and is in danger of eternal damnation.” He said this because they were saying, “He has an unclean spirit.”
  - range: 31-35
    heading: His mother and His brethren
    plain: |
      Then His brothers and His mother came, and standing outside they sent someone in to call Him. A crowd was sitting around Him, and they told Him, “Your mother and your brothers are outside looking for you.” He answered, “Who are my mother and my brothers?” Looking around at those who sat about Him, He said, “Here are my mother and my brothers! Whoever does the will of God is my brother and sister and mother.”

notes:
  - ref: 4
    phrase: to save life, or to kill
    kind: history
    title: Healing on the Sabbath, and a question turned back
    body: |
      The trap in verse 2 rested on a real uncertainty in the law. Saving a life on the Sabbath was unquestionably allowed, but a withered hand threatened no one’s life; healing a lasting condition was very likely thought forbidden by Pharisees of the first century (the evidence is in the note on [[Matt. 12:12]]). That is what the watchers were waiting to see.

      Jesus does not argue the fine point. He asks a larger question, whether the Sabbath is a day for doing good or doing evil, for saving life or killing, and so seems to stretch “saving life” to cover restoring a life that a chronic condition had diminished. Mark records no reply: “they held their peace.” The reply comes in verse 6, and it is a sad irony. The men who would not say whether it was lawful to save a life on the Sabbath went straightway out to plan how to take one.

      They made their plan with the Herodians, a political party that supported the family of Herod and so stood somewhat against the Roman government, and against the Pharisees too, who favored a purely religious rule over the nation. Parties at odds over how Israel should be governed make common cause against Jesus, and Mark pairs them once more when they are sent to catch Him in His words over tribute to Caesar ([[Mark 12:13]]).
    sources: [lane-sabbath-synoptic, bd-herodians]
  - ref: 5
    phrase: with anger, being grieved for the hardness of their hearts
    kind: christ
    title: Anger and grief in one look
    body: |
      Mark lets the reader see what Jesus felt, and he names two feelings at once: Jesus looked round on them “with anger,” and He was “grieved.” What grieved Him was the “hardness” of their hearts. The Greek word, *pōrōsis*, properly means the growing of a callus; used of the mind it means dulled perception, and of the heart, stubbornness.
      Mark names Jesus’s emotions again and again, among them compassion, amazement, love and sorrow. Matthew and Luke often leave such words out; Matthew’s telling of this healing has neither the anger nor the grief ([[Matt. 12:13]]). Mark seems more at ease than the other evangelists with the human side of Jesus, and for Latter-day Saints that side matters: in mortality Jesus was both divine and human. In this verse the anger and the grief come in the same look.
    sources: [thayer, smith-marks-unique-contribution]
  - ref: 12
    phrase: he straitly charged them that they should not make him known
    kind: christ
    title: Why silence the spirits who knew Him?
    body: |
      The unclean spirits say what is true, “Thou art the Son of God,” and Jesus still forbids them, as He had at Capernaum ([[Mark 1:25]]; [[Mark 1:34]]). He did not want the testimony of devils to His messiahship. Mark’s irony is pointed: some of the most compelling titles anyone gives Jesus in this Gospel come from unclean spirits.

      The spirits are not the only ones told to keep quiet. Jesus also asks people He has healed not to spread the news ([[Mark 1:44]]; [[Mark 5:43]]), and those requests are most likely tied to His desire that, before His death, people not be misled about what it means to be the Messiah.
    sources: [keller-mark-luke, smith-marks-unique-contribution]
  - ref: 14
    phrase: he ordained twelve, that they should be with him
    kind: words
    title: Ordained to be with Him, and to be sent
    body: |
      “Ordained” translates a plain Greek verb, *poieō*, “to make,” which with a person and a purpose clause means to appoint or ordain someone for a task; this verse is the lexicon’s example. Mark gives the purposes in order: first “that they should be with him,” then “that he might send them forth to preach.” Before they were sent anywhere, the Twelve were to be with Him.

      Luke says that Jesus named these twelve apostles ([[Luke 6:13]]), a word that means “one sent forth”: His closest disciples during His ministry, they were sent to represent Him after His Ascension. The power He gave them was to do what He had been doing, to heal the sick and cast out devils, and when He sent them out two by two they did it ([[Mark 6:7]]; [[Mark 6:13]]). Twelve men with the same calling and ordination form the Quorum of the Twelve Apostles today.
    sources: [thayer, bd-apostle, keller-mark-luke]
  - ref: 17
    phrase: Boanerges, which is, The sons of thunder
    kind: words
    title: Sons of thunder
    body: |
      Boanerges is a Semitic name, and Mark translates it for his readers: “sons of thunder.” Only Mark keeps it; Matthew and Luke list James and John without it. Its second part is a word that in the Psalms means a tumultuous crowd and seems in Syriac to have meant thunder, so the name seems to suggest a fiery, even destructive, zeal that can be likened to a thunderstorm. Jesus gave it probably because of the intensity of their character, which the Gospels show: John forbade a man casting out devils in Jesus’s name “because he followeth not us” ([[Mark 9:38]]), the brothers asked for the seats at His right and left hand in His glory ([[Mark 10:37]]), and when a Samaritan village would not receive Him they asked whether they should call down fire from heaven ([[Luke 9:54]]).

      Boanerges is one of two surnames in Mark’s list. The other, Peter in verse 16, was not new that day: Peter means “rock,” the Greek for the Aramaic Cephas, which the Lord had given Simon when Andrew first brought him ([[John 1:42]]). Mark records both names as part of the Twelve’s ordination.
    sources: [bd-boanerges, thayer, smith-marks-unique-contribution, bd-peter]
  - ref: 18
    phrase: Thaddæus, and Simon the Canaanite
    kind: history
    title: The Cananean, Thaddaeus, and Iscariot
    body: |
      “Canaanite” here does not mean a man from Canaan. The word should be Cananean, from an Aramaic word, *kanan*, of which Luke’s “Zelotes” is the Greek ([[Luke 6:15]]): Simon was the Zealot. The Zealots were a party among the Jews, named for their zeal for the law, who were determined to resist Roman or any foreign rule. The name describes Simon’s political attachments, not where he came from.

      Thaddaeus is probably the apostle Luke calls “Judas the brother of James” ([[Luke 6:16]]); the Greek can mean son or brother of James. And “Iscariot” in verse 19 means “belonging to Kerioth,” a town in the tribe of Judah, which would make Judas the only one of the Twelve who was not a Galilean.
    sources: [bd-zelotes, bd-canaanite, bd-judas]
  - ref: 21
    phrase: He is beside himself
    kind: history
    title: His own family
    body: |
      “His friends” renders a Greek idiom that means a man’s family, his kinsmen and relations. “He is beside himself” means He was out of His mind. So Mark records that Jesus’s own family, hearing that He and His disciples were so pressed by the crowd they could not even eat (verse 20), concluded that He had lost His mind and set out to lay hold on Him, to stop His public work by force. Matthew and Luke leave the episode out. Mark in general keeps material that might be thought embarrassing, which the other two tend to omit.

      The verse is a plain admission that not all of Mary’s household yet understood the work Jesus was doing; John says that His brethren did not yet believe on Him ([[John 7:5]]). It was not the end of the story. After the Resurrection His brethren were with the apostles in prayer ([[Acts 1:14]]).
    sources: [thayer, smith-marks-unique-contribution, talmage-jesus-christ-18]
  - ref: 22
    phrase: He hath Beelzebub
    kind: history
    title: Scribes from Jerusalem, and Beelzebub
    body: |
      Beelzebub was the name of a Philistine god, spelled Baalzebub in [[2 Kgs. 1:2]], and it was used as a title for Satan, the chief of the demons. The scribes make two charges: that He has Beelzebub, and that He casts out devils by the prince of the devils. Verse 30 repeats the first as “He hath an unclean spirit.”

      Who made the charge matters. Mark tells no particular healing first, as Matthew and Luke do ([[Matt. 12:22]]; [[Luke 11:14]]); in his account the charge arrives with scribes from Jerusalem, set between the two scenes of His family. Scribes were legal officials, and one Latter-day Saint study of the case against Jesus reads their coming as a legal investigation rather than a theological debate, its finding an allegation with dire legal consequences (see the note on [[Matt. 12:24]]).

      Jesus answers in parables (verses 23–27). Satan cannot be casting out Satan, since a kingdom or a house divided against itself comes to an end. The parable of the strong man gives the true explanation: in driving evil spirits out of the people they had taken, Jesus showed that He had first subdued their master, Satan himself (see the note on [[Matt. 12:27]]).
    sources: [bd-beelzebub, welch-legal-cause, talmage-jesus-christ-18]
  - ref: 29
    phrase: he that shall blaspheme against the Holy Ghost hath never forgiveness
    kind: prophets
    title: The sin that has no forgiveness
    body: |
      In the Joseph Smith Translation the wide promise of verse 28 is made to those who repent. There, men come accusing Jesus, “Why do ye receive sinners, seeing thou makest thyself the Son of God,” and He answers that “all sins which men have committed, when they repent, shall be forgiven them; for I came to preach repentance unto the sons of men,” and that blasphemies shall be forgiven “them that come unto me, and do the works which they see me do” (JST Mark 3:21–23).

      The one sin left unforgiven belongs to those who, in the words of latter-day revelation, have denied the Holy Spirit “after having received it” ([[D&C 76:35]]); Joseph Smith’s teaching on it is in the note on [[Matt. 12:31]].

      Verse 30 says why Jesus spoke of it here: “Because they said, He hath an unclean spirit.” Words spoken against Jesus as a man might be forgiven, but to ascribe the authority He held to Satan, as the scribes had just done, came very near to blasphemy against the Holy Ghost.
    sources: [jst-mark-3, lds-scriptures, talmage-jesus-christ-18]
  - ref: 31
    phrase: There came then his brethren and his mother
    kind: history
    title: His mother and His brethren
    body: |
      Because Mark tells of the arrival of His mother and brethren (named in [[Mark 6:3]]) right after the scribes’ charge, which he set inside the kinsmen’s errand of verse 21, a reader asks whether Mary came to restrain Him too. Mark’s frame asks that the dispute in the middle be read together with the family scenes around it, but the verses do not answer that question: verse 21 names no one, and Mark never says why His mother and brethren came. Elder James E. Talmage judged that the facts scarcely warrant assuming that their wish to speak with Him was other than peaceful (see the note on [[Matt. 12:50]]).
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-18]
  - ref: 35
    phrase: the same is my brother, and my sister, and mother
    kind: christ
    title: Brother, and sister, and mother
    body: |
      Told that His mother and brethren are outside, Jesus looks round on those sitting about Him and names them His family: whoever does the will of God. The message had spoken of His mother and His brethren (verse 32); His answer adds “my sister.” The scene is one of several hints in Mark that Jesus had women among His disciples, an idea Mark leaves undeveloped until the cross, where the women who had followed Him in Galilee are seen to have “ministered unto him” all along ([[Mark 15:40–41]]).
    sources: [smith-narrative-atonement-mark]

christ: |
  Mark 3 shows Jesus Christ as the one who has bound the strong man: unclean spirits know Him and fall down before Him, and He casts them out of the people they held. He calls the Twelve first to be with Him, promises in the Joseph Smith Translation that all sins shall be forgiven those who repent (JST Mark 3:22), and names as His brother, sister and mother whoever does the will of God. Belonging to His family rests on doing the will of God, not on birth or nearness to Him, and the forgiveness He came to preach is offered to every sinner who repents.

explore: |
  - **The same stories in Matthew and Luke.** [[Matt. 10:1–4]]; [[Matt. 12:9–50]]; [[Luke 6:6–19]]; [[Luke 8:19–21]]; [[Luke 11:14–23]].
  - **The sons of thunder.** [[Mark 9:38–41]]; [[Mark 10:35–45]]; [[Luke 9:51–56]].
  - **The sin against the Holy Ghost in latter-day scripture.** [[D&C 76:31–49]]; [[Alma 39:5–6]].
  - **Jesus’s family later.** [[Mark 6:1–6]]; [[John 7:5]]; [[Acts 1:14]].
  - Julie M. Smith’s “Mark’s Unique Contribution” (*Religious Educator*, 2016) surveys what only Mark tells, including the family scene of verse 21 and his stories set inside stories.

