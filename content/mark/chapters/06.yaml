chapter: 6
title: The Carpenter, the Prophet’s Head, and the Loaves
tagline: Nazareth will not believe, the Twelve go out two and two, Herod kills John and fears he has risen, and Jesus feeds five thousand and comes to His disciples on the sea, though their hearts are hardened.
when: 'In Galilee and on its lake, in the season of green grass a little before the Passover ([[John 6:4]]); John’s death is told looking back'

setting: |
  Mark 6 follows the raising of Jairus’s daughter ([[Mark 5:21–43]]) and opens the part of the Galilean ministry that runs through chapter 7. Matthew tells the same stories in his chapters 10, 13 and 14; Luke tells the mission of the Twelve and the feeding of the five thousand, and John the feeding and the walk on the sea ([[Luke 9:1–17]]; [[John 6:1–21]]).

  The visit to Nazareth is best read as a second one. Luke’s account of a rejection there belongs to the very start of the ministry ([[Luke 4:16–30]]); Matthew and Mark tell of a later return. The ruler of Galilee was Herod Antipas, the tetrarch, a son of Herod the Great, who had built his capital at Tiberias on the lake where the second half of the chapter takes place.

  Mark had mentioned John the Baptist’s arrest in a single line before Jesus began to preach ([[Mark 1:14]]), and now tells, looking back, how it ended. He sets that story inside another: the Twelve are sent out in verses 7–13 and come back in verse 30, and John’s death is told while they are away. The chapter then follows Jesus and the returning apostles to a solitary place by the lake, across the water by night, and to the crowds of Gennesaret.

thread: |
  **Who is this? Nazareth sees a carpenter, Herod sees a ghost, and the disciples, who see most, do not yet understand.**

  Mark asks again and again who Jesus is, and this chapter asks it three ways. His neighbours wonder where He got His wisdom, and answer themselves by naming His trade and His family; their unbelief limits what He does among them (verses 1–6). Herod, hearing the name the Twelve have spread through the land, decides that the prophet he beheaded has come back, and Mark stops to tell how John died (verses 14–29).

  Then the chapter turns to the disciples, who see more than anyone. They hand out bread in the wilderness to five thousand, and that night Jesus comes to them over the water and names Himself with words that the Greek Isaiah uses as the name of God: “It is I” (verses 30–51). Yet Mark ends the night not with their worship but with their amazement: “they considered not the miracle of the loaves: for their heart was hardened” (verse 52). Mark tells the failures of the Twelve plainly, and tells as plainly that Jesus does not give up on them, but keeps teaching them.

sections:
  - range: 1-6
    heading: Rejected at Nazareth
    plain: |
      Jesus left that place and came to His home town, and His disciples followed Him. On the sabbath He began to teach in the synagogue, and many who heard Him were astonished. “Where did this man get all this?” they said. “What is this wisdom that has been given Him, and these mighty works done by His hands? Isn’t this the carpenter, Mary’s son, the brother of James and Joses and Judas and Simon? Aren’t His sisters here among us?” And they took offence at Him. Jesus said to them, “A prophet is honoured everywhere except in his own town, among his own relatives, and in his own house.” He could do no mighty work there, except that He laid His hands on a few sick people and healed them. And He was amazed at their unbelief. Then He went around the villages, teaching.
  - range: 7-13
    heading: The Twelve sent out two and two
    plain: |
      He called the Twelve to Him and began to send them out two by two, and He gave them power over unclean spirits. He told them to take nothing for the journey but a staff: no bag, no bread, no money in their belts. They were to wear sandals, but not to take a second coat. “Wherever you enter a house,” He said, “stay there until you leave that place. And if any place will not receive you or listen to you, when you leave, shake off the dust from under your feet as a testimony against them. Truly I tell you, it will be more bearable for Sodom and Gomorrah on the day of judgment than for that city.” So they went out and preached that people should repent. They cast out many devils, and anointed many sick people with oil and healed them.
  - range: 14-29
    heading: The death of John the Baptist
    plain: |
      King Herod heard of Jesus, for His name had become known everywhere. Herod said, “John the Baptist has risen from the dead, and that is why these powers are at work in him.” Others said, “He is Elijah,” and others, “He is a prophet, like one of the prophets of old.” But when Herod heard of it, he said, “It is John, whom I beheaded. He has risen from the dead.” For Herod himself had sent men to arrest John, and had bound him in prison, because of Herodias, the wife of his brother Philip, whom Herod had married. John had told Herod, “It is not lawful for you to have your brother’s wife.” So Herodias held a grudge against John and wanted to kill him, but she could not, because Herod feared John, knowing that he was a righteous and holy man, and kept him safe. When he heard John he did many things, and he liked to listen to him. Then an opportunity came. On his birthday Herod gave a banquet for the great men of his court, his military commanders, and the leading men of Galilee. When the daughter of Herodias came in and danced, she pleased Herod and his guests, and the king said to the girl, “Ask me for whatever you want, and I will give it to you.” He swore to her, “Whatever you ask I will give you, up to half my kingdom.” She went out and asked her mother, “What shall I ask for?” Her mother said, “The head of John the Baptist.” At once the girl hurried back to the king and asked, “I want you to give me, right now, the head of John the Baptist on a platter.” The king was deeply grieved, but because of his oath and his guests he did not want to refuse her. So he immediately sent an executioner with orders to bring John’s head. The man went and beheaded John in the prison, brought his head on a platter and gave it to the girl, and the girl gave it to her mother. When John’s disciples heard of it, they came and took his body and laid it in a tomb.
  - range: 30-44
    heading: The apostles return, and five thousand are fed
    plain: |
      The apostles gathered around Jesus and told Him everything they had done and taught. He said to them, “Come away by yourselves to a solitary place and rest for a while.” For so many people were coming and going that they had no time even to eat. So they went away by boat to a solitary place by themselves. But many saw them leaving and recognized them, and people ran there on foot from all the towns and arrived ahead of them. When Jesus came ashore and saw the great crowd, He had compassion on them, because they were like sheep without a shepherd, and He began to teach them many things. When it was late in the day, His disciples came and said, “This is a lonely place, and it is already late. Send them away so they can go to the farms and villages around and buy themselves something to eat.” He answered, “You give them something to eat.” They said, “Are we to go and spend two hundred denarii, two hundred days’ wages, on bread and give it to them?” He asked, “How many loaves do you have? Go and see.” When they had found out, they said, “Five, and two fish.” He told them to have everyone sit down in groups on the green grass, and they sat down in groups like garden beds, by hundreds and by fifties. Taking the five loaves and the two fish, He looked up to heaven and blessed them, broke the loaves, and gave them to His disciples to set before the people, and He divided the two fish among them all. They all ate and were satisfied, and the disciples picked up twelve baskets full of broken pieces of bread and fish. Those who had eaten the loaves were about five thousand men.
  - range: 45-56
    heading: Jesus walks on the sea
    plain: |
      Immediately Jesus made His disciples get into the boat and go ahead of Him to the other side, toward Bethsaida, while He sent the crowd away. After saying farewell to them, He went up on a mountain to pray. When evening came, the boat was out in the middle of the sea, and He was alone on land. He saw them straining at the oars, because the wind was against them, and in the fourth watch of the night, between three and six in the morning, He came toward them, walking on the sea. He meant to go on past them. When they saw Him walking on the sea, they thought it was a ghost and cried out, for they all saw Him and were terrified. But at once He spoke to them: “Take courage! It is I. Do not be afraid.” He climbed into the boat with them, and the wind stopped. They were utterly astonished, beyond all measure, for they had not understood about the loaves: their hearts were hardened. When they had crossed over, they came to land at Gennesaret and anchored there. As soon as they got out of the boat, people recognized Him. They ran through the whole region and began to carry the sick on mats to wherever they heard He was. Wherever He went, into villages, towns or countryside, they laid the sick in the streets and begged Him to let them touch even the edge of His cloak; and all who touched Him were healed.

notes:
  - ref: 3
    phrase: the carpenter, the son of Mary
    kind: history
    title: The carpenter, the son of Mary
    body: |
      The people of Nazareth meet His wisdom and His mighty works by naming His trade and His family. Mark’s wording is his own. Only Mark calls Jesus Himself a carpenter; in Matthew He is “the carpenter’s son” ([[Matt. 13:55]]). Only Mark names Him “the son of Mary” rather than by His father. To name a man by his mother would have carried a hint of scandal for those who did not know of the virgin birth, and Mark’s Gospel is more at ease than the others with details that might embarrass.

      The townspeople’s trouble was that He was too ordinary. They had known Him and His family as common folk, and He did not come as they expected the Messiah to come; so they would know Him only as the carpenter from down the street, and “they were offended at him.”
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-21]
  - ref: 3
    phrase: the brother of James, and Joses, and of Juda, and Simon
    kind: history
    title: His brothers and sisters
    body: |
      The four men named here, and the sisters with them, were children of Joseph and Mary born after Jesus. The Greek of Matthew’s telling shows there were more than two sisters ([[Matt. 13:56]]), though their number and names are not given. On their unbelief during the ministry and their faith after the Resurrection, see the note on [[Mark 3:21]]. James, known as James the Just, came to hold an important place in the Church at Jerusalem, and was probably the writer of the Epistle of James.
    sources: [bd-brethren-of-the-lord, bd-james]
  - ref: 5
    phrase: he could there do no mighty work
    kind: scripture
    title: He could there do no mighty work
    body: |
      Mark says plainly that Jesus *could* not, where Matthew says only that “he did not many mighty works there because of their unbelief” ([[Matt. 13:58]]). The stronger word suggests that His power to work miracles was not unconditioned but depended on the faith of those who came to Him. The Book of Mormon says the same in general terms: “if there be no faith among the children of men God can do no miracle among them” ([[Ether 12:12]]), and God “ceaseth to do miracles” where people “dwindle in unbelief” ([[Morm. 9:20]]). What stood in the way at Nazareth was their unbelief, and even so He laid His hands on a few sick people and healed them.

      Verse 6 adds that “he marvelled because of their unbelief.” Mark is more willing than the other Gospels to show Jesus’s human side, and for Latter-day Saints it matters that in mortality He was both divine and human. Whatever insight He had into the hearts of men, it did not shut out the wonder anyone feels at what he did not expect.
    sources: [ellicott-matthew, lds-scriptures, smith-marks-unique-contribution, ellicott-mark]
  - ref: 8
    phrase: take nothing for their journey, save a staff only
    kind: history
    title: A staff, sandals, and no bread
    body: |
      The Twelve were sent out with almost nothing, so that they would depend on the people they came to. Without money, spare clothing or food, a missionary had to rely on the hospitality of strangers, and the instructions that follow are a guest’s duties: stay in the house that takes you in until you leave the place (verse 10). Only Mark says they went in pairs (verse 7), and the Lord gave the elders of this dispensation the same pattern, to go out “preaching my gospel, two by two, in my name” ([[D&C 42:6]]).

      Mark’s list does not match Matthew’s. Mark allows “a staff only” and tells them to wear sandals; Matthew forbids staves and shoes ([[Matt. 10:10]]), and Luke forbids staves ([[Luke 9:3]]). The Greek word for staff is the same in all three, though the words for footwear differ, and this is one of the few outright contradictions among the first three Gospels. It can be read as Matthew forbidding a second staff, so that each took one only; or those who handed the saying down may have remembered it differently. The sandals Mark allows were the shoes of the poor, a sole of leather or wood tied on with thongs, so the Twelve went shod as the poor were.
    sources: [belnap-dust-feet, lds-scriptures, smith-marks-unique-contribution, ellicott-mark]
  - ref: 11
    phrase: shake off the dust under your feet for a testimony against them
    kind: history
    title: Shaking off the dust
    body: |
      Shaking the dust off one’s feet was the reverse of the welcome a host gave a guest. A host who received a traveller washed his feet; a messenger who was not received left the dust of that place behind him. To “receive” belonged to the language of hospitality, and for a messenger sent by another it could take in the message as well as the man, so it is not clear whether Jesus meant a town that refused them shelter or one that refused their word. The warning about Sodom and Gomorrha fits either, since later writers explained the ruin of those cities by their hostility, instead of hospitality, toward Lot’s guests.

      The Lord gave the rite again in this dispensation. Oliver Cowdery was told that where he was not received he should “leave a cursing instead of a blessing, by casting off the dust of your feet against them as a testimony” ([[D&C 24:15]]), and the elders a year later to do it “not in their presence, lest thou provoke them, but in secret” ([[D&C 60:15]]). By 1835, in a letter of Joseph Smith to the elders, being received meant receiving the gospel message, with hospitality no longer the question, and the rite left the responsibility with the one who rejected it.
    sources: [belnap-dust-feet, lds-scriptures]
  - ref: 13
    phrase: anointed with oil many that were sick
    kind: prophets
    title: Anointing the sick with oil
    body: |
      Only Mark says the Twelve anointed the sick with oil, and it is the first glimpse of a practice the early Church kept: James tells the sick to “call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord” ([[James 5:14]]). Oil was a familiar remedy in that day, so the anointing joined an outward means of healing to prayer, and as an outward sign of the wish to heal it could help the sick person’s faith.

      The practice continues in the Church’s priesthood blessings, where the anointing is sealed by the same authority, and to seal it is to make it binding for its purpose: “When elders anoint a sick person and seal the anointing, they open the windows of heaven for the Lord to pour forth the blessing He wills for the person afflicted.”
    sources: [ellicott-mark, oaks-2010-healing]
  - ref: 14
    phrase: king Herod heard of him
    kind: history
    title: King Herod’s guilty guess
    body: |
      This is Herod Antipas, the son of Herod the Great who received Galilee and Perea when his father’s kingdom was divided. His proper title was tetrarch, and Matthew and Luke give it to him ([[Matt. 14:1]]; [[Luke 9:7]]); Mark calls him “king” in the old, loose sense of a prince. Later, prompted by Herodias’s ambition, Antipas went to Rome to seek the title of king for himself, and instead was deposed by the emperor Caligula and banished to Gaul in A.D. 39.

      What Herod heard was the stir the Twelve had made: their preaching spread Jesus’s name through the land (see the note on verse 30). Others said Jesus was Elijah, or a prophet like those of old (verse 15). Herod, who had ordered John’s death, heard the news with the fear of a guilty conscience and settled on the answer that accused him: “It is John, whom I beheaded: he is risen from the dead” (verse 16).
    sources: [bd-herod, cambridge-mark, ellicott-mark, talmage-jesus-christ-21]
  - ref: 18
    phrase: It is not lawful for thee to have thy brother’s wife
    kind: history
    title: Why John rebuked the marriage
    body: |
      Herodias had been married to her uncle Herod Philip, by whom she had a daughter, and she left him to live as the wife of his half-brother Antipas. The law of Moses forbade a man to take his brother’s wife ([[Lev. 18:16]]; [[Lev. 20:21]]), and John said so to the ruler himself. The Philip of verse 17 is not the tetrarch of [[Luke 3:1]] but another son of Herod the Great who held no office, and Herodias was niece to both her husbands. John’s rebuke of this marriage is what cost him his life.
    sources: [bd-herodias, ellicott-matthew]
  - ref: 20
    phrase: observed him; and when he heard him, he did many things
    kind: words
    title: What Herod saw in John
    body: |
      Mark draws a ruler divided against himself. Herod “feared John,” knowing him to be a righteous and holy man, and “observed him”: the Greek, as the footnote gives it, means that he protected him. He held his prisoner in a certain reverence, and his protection is why Herodias “could not” kill John (verse 19). Matthew tells it differently, with Herod himself wanting John dead and held back by fear of the people ([[Matt. 14:5]]). In Mark the murderous mood belongs to Herodias, who “would have killed him; but she could not” (verse 19), and in Herod, if it was there at all, it was checked by better impulses.

      The next words differ in the Greek. The text behind the King James Version says that when Herod heard John he “did many things”; the older manuscripts followed by most modern editions say that he “was much perplexed,” and still heard him gladly. Joseph Smith’s translation makes the verse a portrait of John as well: Herod knew him to be “a holy man, and one who feared God and observed to worship him; and when he heard him he did many things for him” (JST Mark 6:21). On any reading, the man who listened to the prophet with pleasure is the man who sent the executioner in verse 27.
    sources: [lds-scriptures, ellicott-mark, egt-mark, greek-nt]
  - ref: 26
    phrase: for his oath’s sake, and for their sakes which sat with him
    kind: history
    title: Why Herod kept his oath
    body: |
      Mark gives two reasons Herod gave the order, his oath and his guests, and the guests may have weighed the more. Mark alone lists who they were (verse 21): the great men of the court, the military commanders (in Greek, captains of a thousand), and the leading men of Galilee, probably its landowners. Before such a room, Herod may have shrunk less from breaking his oath than from the jest or the contempt of his guests if they saw him take back his word, and a false regard for what others would think became a spur to guilt instead of a restraint.

      Mark alone also says that the girl went out and asked her mother what to request (verse 24), so the demand for the head comes from Herodias. Whether she planned the dance knowing how her husband would respond, or only seized the moment, it is Herodias, not her daughter, who bears the blame for procuring the head of John the Baptist.
    sources: [ellicott-mark, ellicott-matthew, frederick-daughter-of-jared]
  - ref: 30
    phrase: And the apostles gathered themselves together unto Jesus
    kind: structure
    title: John’s death inside the apostles’ mission
    body: |
      Mark tells of John’s death while the Twelve are away, between their sending (verses 7–13) and their return here. It is one of many places where he sets one story inside another, inviting the reader to understand the middle in the light of what surrounds it. Here the join is plain: the apostles’ preaching spread Jesus’s name until it reached Herod (verse 14), and only Mark ties Herod’s notice to their mission. They come back as “apostles,” the ones sent forth (see the note on [[Mark 3:14]]), and they report “both what they had done, and what they had taught.”

      The burial in verse 29 has been read as one of Mark’s ironies. John’s disciples come for his body and lay it in a tomb; at Jesus’s death it will be Joseph of Arimathea, not one of the Twelve, who asks for the body and buries it, for His closest disciples will have fled ([[Mark 15:43–46]]).
    sources: [smith-marks-unique-contribution, cambridge-mark, bd-apostle]
  - ref: 31
    phrase: Come ye yourselves apart into a desert place, and rest a while
    kind: history
    title: Come apart and rest
    body: |
      Only Mark records the invitation and its reason: so many were “coming and going” that the apostles “had no leisure so much as to eat.” It is a tender kindness to men just back from their first mission. Joseph Smith’s translation calls the place “solitary” rather than “desert,” here and in verses 32 and 35, a place apart from the crowds.

      This is one of the times Mark shows Jesus leaving the crowds that came for His miracles, as He had before ([[Mark 3:7–10]]), but this time the crowd would not be left behind. The people saw the boat leave and ran on foot around the shore, while the disciples went by water, and they were there before Him (verse 33). What He did when He saw them is the next verse.
    sources: [ellicott-mark, lds-scriptures, easton-marcan-christology]
  - ref: 34
    phrase: as sheep not having a shepherd
    kind: scripture
    title: Sheep without a shepherd
    body: |
      The rest was cut short, and Jesus met the crowd with compassion. The image has a history in the Old Testament, and the Topical Guide (where the footnote on “shepherd” leads) sets this verse in the same entry as two passages. Near the end of his life Moses asked the Lord to set a man over Israel, “that the congregation of the LORD be not as sheep which have no shepherd” ([[Num. 27:17]]), and the Lord chose Joshua to lead them. The prophets later promised one shepherd of David’s line over the gathered flock ([[Ezek. 34:23]]; [[Ezek. 37:24]]), prophecies Latter-day Saints read as fulfilled in Jesus. The link from this verse to those is the Topical Guide’s cross-reference, not a reading Mark states. In Mark the shepherd’s first answer to the crowd is His word: “he began to teach them many things,” and the bread comes afterward.
    sources: [tg-shepherd, pike-shepherd]
  - ref: 40
    phrase: they sat down in ranks, by hundreds, and by fifties
    kind: words
    title: In ranks, like garden beds
    body: |
      The Greek word translated “ranks” means a garden plot or bed, and Mark repeats it, “beds, beds,” in a Hebrew manner of speaking, to paint the scene: the crowd sat on the green grass in groups like the plots of a garden. “By companies” in verse 39 is the same kind of doubled word. The English “ranks” suggests long lines, which is not the picture.

      The “green grass” of verse 39 is itself a note of season. It points to the spring, a little before the Passover, which is when John sets the feeding ([[John 6:4]]; [[John 6:10]]). Detail this vivid reads like an eyewitness’s memory, and it has been taken as the eye of someone like Peter.
    sources: [thayer, ellicott-mark, egt-mark, cambridge-mark]
  - ref: 41
    phrase: he looked up to heaven, and blessed, and brake the loaves
    kind: christ
    title: Bread in the wilderness
    body: |
      Mark tells the feeding without stopping to say what it means, and lets the story make the point. Jesus feeds a hungry crowd with bread in a wilderness place, as the Lord fed Israel with manna in the wilderness ([[Ex. 16:4]]), and the story can be read as identifying Him with that Lord, though no one in the scene says so. On that reading it is one of the ways Mark reveals who Jesus is through what happens, before anyone puts it into words.

      Elder James E. Talmage judged how the bread multiplied beyond human knowledge to explain, and called it a manifestation of creative power, by which material elements were organized to meet a present need; the twelve baskets of broken pieces left over held more than the five loaves they began with.
    sources: [smith-narrative-atonement-mark, talmage-jesus-christ-21]
  - ref: 48
    phrase: would have passed by them
    kind: words
    title: He meant to pass by them
    body: |
      The Greek says that He meant to go past them, with the ordinary verb for walking by someone, and only Mark has the detail. The verse does not say He would have left them to the storm. He had seen them “toiling in rowing,” a strong word for being tormented or harried, against a head-wind that made their sail useless, and He came out to them in the last watch of the night, between three and six in the morning, near enough to be seen. One reading is that He came close and seemed to mean to go on ahead of them to the shore, as on the road to Emmaus He “made as though he would have gone further” until the two disciples begged Him to stay ([[Luke 24:28–29]]). Here too He did not go on: when they cried out, “immediately he talked with them” (verse 50), and He came up into the boat.
    sources: [thayer, cambridge-mark, talmage-jesus-christ-21]
  - ref: 50
    phrase: it is I; be not afraid
    kind: christ
    title: 'It is I: the name of God'
    body: |
      The words Jesus spoke as He reached the boat, “It is I,” point to the God of Israel. Job had said that God “alone spreadeth out the heavens, and treadeth upon the waves of the sea” ([[Job 9:8]]), and the one walking on the waves now names Himself. “It is I” is in Greek *egō eimi*, “I am” or “I am he,” and in the Greek translation of the second half of Isaiah those words serve as the name of the God of Israel: where the Hebrew of [[Isa. 45:18]] says “I am Jehovah,” the Greek has simply *egō eimi*. Spoken by someone walking on the sea, the words are a first open hint of who He is: I AM, Jehovah, the God of the Old Testament, who made and rules the wind and the water the disciples feared. Mark says less than the other Gospels about Jesus’s divinity in so many words, but the pieces are in his Gospel, and this is one of them.
    sources: [keller-jesus-jehovah]
  - ref: 52
    phrase: for their heart was hardened
    kind: words
    title: Why their hearts were hardened
    body: |
      The Greek verb behind “hardened” comes from a word for hard skin, a callus: a heart hardened in this sense has grown dull and lost the power to understand. The disciples had handed out the loaves with their own hands, and had not drawn from it what it might have taught them, that the forces of nature were subject to their Master. So when He came to them over the water and the wind dropped, they were “sore amazed in themselves beyond measure,” where, had they remembered the loaves, their wonder might have been closer to worship.

      Here Mark’s telling differs most from Matthew’s. Matthew ends the same night with the disciples worshipping Him and saying, “Of a truth thou art the Son of God” ([[Matt. 14:33]]); Mark leaves them astonished and uncomprehending. The verse is found only in Mark, and it may well preserve Peter’s own memory of how dull the Twelve had been. Mark shows them failing to understand again and again, and Jesus will ask them later, after another feeding, “have ye your heart yet hardened?” ([[Mark 8:17]]). Yet He does not break faith with them. He keeps teaching them, and after the Resurrection word is sent to “his disciples and Peter” ([[Mark 16:7]]).
    sources: [thayer, ellicott-mark, talmage-jesus-christ-21, smith-marks-unique-contribution]

christ: |
  Mark 6 shows Jesus Christ as the Lord who feeds His people in the wilderness and treads the waves of the sea, and who names Himself to His frightened disciples with the name of God: “It is I; be not afraid.” It shows Him too as one whose works waited on faith at Nazareth, and who did not give up on disciples whose hearts were dull, but kept teaching them. Faith still opens the way for His power, as it did for the few at Nazareth who were healed ([[Ether 12:12]]). And the Lord who said “be not afraid” on the lake says the same to His servants now: “be of good cheer, and do not fear, for I the Lord am with you, and will stand by you” ([[D&C 68:6]]).

explore: |
  - **The other tellings.** [[Matt. 13:53–58]]; [[Matt. 10:1–15]]; [[Matt. 14:1–36]]; [[Luke 9:1–17]]; [[John 6:1–21]], where the feeding leads into the sermon on the bread of life.
  - **The first rejection at Nazareth.** [[Luke 4:16–30]].
  - **Missionaries then and now.** The seventy sent two and two, [[Luke 10:1–12]]; and the charge to the elders of this dispensation, [[D&C 84:77–92]].
  - **The loaves remembered.** Jesus asks the Twelve about the bread again in [[Mark 8:14–21]].

