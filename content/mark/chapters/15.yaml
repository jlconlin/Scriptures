chapter: 15
title: Truly This Man Was the Son of God
tagline: The council hands Jesus to Pilate; the crowd chooses Barabbas, and the soldiers hail Him King of the Jews in purple and thorns; He is crucified at the third hour and mocked, cries out at the ninth hour and dies; the veil is torn, a centurion confesses Him, and Joseph of Arimathæa lays Him in a tomb while the women watch.
when: 'Friday of the last week, from early morning to the evening before the Sabbath, in Jerusalem and at Golgotha outside it'

setting: |
  Mark 15 follows straight on from the night of chapter 14, when the council heard false witnesses, Jesus answered the high priest “I am,” and Peter denied Him ([[Mark 14:53–72]]). At first light the council meets again and hands Him over to Pontius Pilate, prefect of Roman Judea from AD 26 to 36. The chapter runs through a single day, from that morning to the evening before the Sabbath.

  The other Gospels each add an episode to Mark’s account of the Roman trial: Matthew the remorse and death of Judas, Luke the hearing before Herod Antipas, John a longer exchange between Pilate and Jesus. Mark alone gives the hour of the crucifixion, and with it marks out the day by the third, the sixth and the ninth hours (verses 25, 33, 34). He keeps two Aramaic words with their translations, Golgotha and Eloi, and uses two Latin ones, *praetorium* and *centurion*.

  The Old Testament lies close beneath the story. The footnotes trace Jesus’s silence before His accusers to [[Isa. 53:7]], the parted garments to [[Ps. 22:18]], and the vinegar to [[Ps. 69:21]]; the site’s chapters on [[Ps. 22]] and [[Isa. 53]] explain those passages in their first setting. Chapter 16 begins with the women who saw where He was laid.

thread: |
  **They mock Him as a king, and His death opens the way to God.**

  The charge against Jesus is a title. Pilate asks, “Art thou the King of the Jews?” (verse 2), and twice offers the crowd “the King of the Jews” (verses 9, 12); the soldiers hail Him by it in purple and thorns (verse 18); it is written over the cross (verse 26); and the chief priests jeer at “Christ the King of Israel” (verse 32). The soldiers and the priests mean it as mockery, and Mark’s reader knows it is true, so the mockery turns to irony: the men who deride Him are hailing the true King.

  Then Jesus dies, and Mark tells at once of three things that follow. The veil of the temple is torn from the top; a Roman centurion says, “Truly this man was the Son of God”; and women who had followed Him from Galilee are seen watching. On one Latter-day Saint reading the three say one thing: what had been restricted is open to all because of His death. The torn veil opens the presence of God; a Gentile soldier comes to know who Jesus is; and women whose discipleship and ministry Mark had kept out of view are shown at last as His ministers and witnesses. The chapter ends quietly, with a stone rolled against a tomb and two women marking the place.

sections:
  - range: 1-5
    heading: Delivered to Pilate
    plain: |
      As soon as it was morning the chief priests, with the elders, the scribes and the whole council, reached their decision. They bound Jesus, led Him away and handed Him over to Pilate. Pilate asked Him, “Are you the King of the Jews?” He answered, “You say so.” The chief priests brought many accusations against Him, but He made no answer. Pilate questioned Him again: “Have you no answer? See how many charges they bring against you.” But Jesus still answered nothing, and Pilate was amazed.
  - range: 6-15
    heading: Barabbas, or the King of the Jews
    plain: |
      At the feast Pilate used to release to the people one prisoner, whomever they asked for. A man named Barabbas was in prison, bound with the rebels who had committed murder in the uprising. The crowd came up, shouting, and began to ask Pilate to do as he always did for them. Pilate answered, “Do you want me to release to you the King of the Jews?” For he knew that the chief priests had handed Him over out of envy. But the chief priests stirred up the crowd to have him release Barabbas to them instead. Pilate spoke to them again: “Then what do you want me to do with the man you call the King of the Jews?” They shouted back, “Crucify him!” “Why? What evil has he done?” Pilate asked. But they shouted all the louder, “Crucify him!” So Pilate, wanting to satisfy the crowd, released Barabbas to them; and after having Jesus scourged, he handed Him over to be crucified.
  - range: 16-20
    heading: The soldiers hail Him King
    plain: |
      The soldiers led Him away into the courtyard of the governor’s headquarters, called the Praetorium, and called together the whole cohort. They dressed Him in purple, twisted a crown of thorns and put it on His head, and began to salute Him: “Hail, King of the Jews!” They kept striking Him on the head with a reed and spitting on Him, and knelt down before Him in mock homage. When they had finished mocking Him, they took off the purple, put His own clothes back on Him, and led Him out to crucify Him.
  - range: 21-32
    heading: Crucified at Golgotha
    plain: |
      A man named Simon from Cyrene, the father of Alexander and Rufus, was passing by on his way in from the country, and they forced him to carry Jesus’s cross. They brought Jesus to the place called Golgotha, which means “the place of a skull.” They offered Him wine mixed with myrrh to drink, but He would not take it. Then they crucified Him, and divided His clothes among them, casting lots to decide what each would take. It was nine in the morning when they crucified Him. The notice of the charge against Him read, THE KING OF THE JEWS. With Him they crucified two thieves, one on His right and one on His left, and so the scripture was fulfilled that says, “He was counted among the transgressors.” Those who passed by insulted Him, shaking their heads and saying, “Aha! You who would destroy the temple and build it in three days, save yourself and come down from the cross!” In the same way the chief priests and the scribes mocked Him among themselves: “He saved others; himself he cannot save. Let the Christ, the King of Israel, come down from the cross now, so that we may see and believe.” Even those crucified with Him taunted Him.
  - range: 33-41
    heading: The death of Jesus
    plain: |
      At noon darkness came over the whole land, and it lasted until three in the afternoon. At three o’clock Jesus cried out with a loud voice, “Eloi, Eloi, lama sabachthani?” which means, “My God, my God, why have you forsaken me?” Some of the bystanders heard it and said, “Listen, he is calling Elijah.” One of them ran, filled a sponge with vinegar, put it on a reed and gave it to Him to drink, saying, “Wait, let us see whether Elijah will come to take him down.” Then Jesus gave a loud cry and breathed His last. And the veil of the temple was torn in two, from top to bottom. When the centurion who stood facing Him saw that He cried out like this and breathed His last, he said, “Truly this man was the Son of God.” Women were watching too, from a distance. Among them were Mary Magdalene, Mary the mother of James the less and of Joses, and Salome. When He was in Galilee they had followed Him and served Him, and many other women who had come up with Him to Jerusalem were there as well.
  - range: 42-47
    heading: The burial
    plain: |
      Evening was coming on, and since it was the day of preparation, the day before the Sabbath, Joseph of Arimathæa, a respected member of the council who was himself waiting for the kingdom of God, took courage, went in to Pilate and asked for the body of Jesus. Pilate was surprised that He could already be dead. He called the centurion and asked whether He had been dead long, and when he had learned it from the centurion, he gave the body to Joseph. Joseph bought a linen cloth, took Him down, wrapped Him in the linen and laid Him in a tomb cut out of the rock, and he rolled a stone against the entrance of the tomb. Mary Magdalene and Mary the mother of Joses saw where He was laid.

notes:
  - ref: 1
    phrase: held a consultation with the elders and scribes and the whole council
    kind: history
    title: Why the council went to Pilate
    body: |
      The council had already judged Jesus worthy of death in the night ([[Mark 14:64]]); at first light it met again to settle how to bring Him before the governor (see the note on [[Mark 14:56]]). Why it needed Pilate is less certain than it once seemed. Rome at times curtailed the power of local authorities to execute, usually by giving the governor the review of capital cases; but it is just as likely that under its own law the council could not carry out an execution so near Passover. Either way, a governor’s sentence meant a Roman penalty, and Rome’s penalty for treason or rebellion was crucifixion.

      So the charge changed. Pilate’s first question, “Art thou the King of the Jews?”, suggests that the leaders had changed their strategy and now brought a political accusation, one that fell within a governor’s competence, in place of the blasphemy they had condemned in the night. Their hope may have been that Pilate would find Jesus guilty of sedition against the emperor through unlawful wonder-working, which a decree of Augustus in AD 11 had made punishable by death. Pilate found Him guilty of no such charge.

      “Delivered” is the verb of handing over that carries Jesus from Judas to the council, from the council to Pilate, and from Pilate to the cross (verse 15; see the note on [[Mark 9:31]]).
    sources: [huntsman-good-friday, sc-knowhy-676]
  - ref: 2
    phrase: Thou sayest it
    kind: christ
    title: Thou sayest it, and then silence
    body: |
      Jesus’s answer acknowledges the title without enlarging on it: “That is what you say.” The Joseph Smith Translation, given in the footnote, makes it an open affirmation: “I am, even as thou sayest” (JST Mark 15:4).

      To everything else He answered nothing, though the chief priests accused Him “of many things” and Pilate pressed Him, so that the governor marvelled (verses 3–5). His was a dignified silence, the silence of the Servant who “was oppressed, and he was afflicted, yet he opened not his mouth” ([[Isa. 53:7]]). Abinadi, having quoted that chapter to the priests of Noah, says who the silent Servant is: “God himself shall come down among the children of men, and shall redeem his people” ([[Mosiah 15:1]]).
    sources: [huntsman-good-friday, lds-scriptures]
  - ref: 7
    phrase: who had committed murder in the insurrection
    kind: history
    title: Barabbas and the insurrection
    body: |
      Barabbas was guilty of the very thing the council implied of Jesus. Mark calls his companions “them that had made insurrection,” rebels, and speaks of an uprising in which murder was done: Barabbas was an insurgent of some kind against Rome. That was the crime the leaders were insinuating when they accused Jesus of claiming to be the Messiah, the King of the Jews. Offered the real rebel or the man accused of being one, the crowd chose the rebel.

      Whose custom the release at the feast was is not clear. Mark makes it Pilate’s own (“he released”; the footnote gives the sense of the Greek, “usually released”), Matthew and Luke may make it every governor’s, and it may also have been a Jewish custom that Pilate had taken up. Freeing a prisoner suited Passover, the feast of Israel’s deliverance from bondage. The name Barabbas could be Aramaic for “son of the father” (see the note on [[Matt. 27:16]]).
    sources: [huntsman-good-friday, lds-scriptures]
  - ref: 11
    phrase: the chief priests moved the people
    kind: history
    title: Envy, and a crowd stirred up
    body: |
      Mark names who did what. The crowd came up to ask for the customary release (verse 8). Pilate offered them “the King of the Jews,” because he knew the chief priests had handed Jesus over “for envy” (verse 10). Then the chief priests “moved the people,” stirred the crowd up, to ask for Barabbas.

      Pilate took the leaders’ motive for something petty, but envy does not adequately describe how the council acted: false prophecy and wonder-working were forbidden under Jewish law as well as Roman, and the chief priests pressed for His death even after Pilate found Him guilty of no crime against Rome.

      Who the crowd were, Mark does not say. The word, *ho ochlos*, suggests many more people than the council and its officers. If they were people of the city who had heard of the arrest, it is hard to see how their feelings could have changed so sharply since the welcome they gave Him a few days before ([[Mark 11:8–10]]). The crowd may instead have been made up mainly of the chief priests’ own retainers and supporters, a claque that could be counted on to shout what its leaders wanted. The verse speaks of one crowd, at one hour, stirred up by its leaders, and of no one else.
    sources: [thayer, sc-knowhy-676, huntsman-good-friday]
  - ref: 15
    phrase: when he had scourged him
    kind: history
    title: Scourged, and handed over
    body: |
      Pilate gave the crowd what it shouted for, “willing to content the people,” and before handing Jesus over he had Him scourged. By Roman times some torture usually came before a crucifixion, and scourging most often. Mark’s word (*phragelloō*) means a terrible and severe whipping before execution, one that could kill the condemned before he ever reached the cross.

      Then Pilate “delivered” Him, and with that verb he takes his place in the chain of those, human and divine, who hand Jesus over to be sacrificed (see the note on [[Mark 9:31]]).
    sources: [strathearn-crucifixion, huntsman-good-friday]
  - ref: 16
    phrase: the hall, called Prætorium
    kind: words
    title: The Praetorium and the whole band
    body: |
      Mark explains a Greek word with a Latin one. “The hall” is *aulē*, the open courtyard of a great house, and Mark adds that it is the *praetorium*. In the provinces the word meant the governor’s residence, for which the Romans were accustomed to take over palaces already standing; in Jerusalem it was most likely the palace Herod the Great had built for himself, which the governors seem to have occupied whenever they came up from Caesarea. This is one of two places where Mark interprets a Greek term by a Latin one (the other is the “farthing” of [[Mark 12:42]]). With his translations of Aramaic and his explanations of Jewish customs, it is part of the evidence that Mark wrote for Gentiles, possibly in Rome.

      “The whole band” is a *speira*, the Greek word for a Roman cohort, the tenth part of a legion, about six hundred men. Mark says the soldiers called the whole of it together for the mockery that follows.
    sources: [strathearn-gospels, thayer]
  - ref: 17
    phrase: plaited a crown of thorns
    kind: symbol
    title: Purple and a crown of thorns
    body: |
      The soldiers mock His claim to be King of the Jews by dressing Him in a purple cloak, crowning Him with thorns, saluting Him, “Hail, King of the Jews!”, and kneeling before Him. Between the salutes they strike Him on the head with a reed, no doubt driving the thorns deeper, and spit on Him. The acts were meant to degrade Him, and they fulfilled what Isaiah and Nephi had foreseen: “I gave my back to the smiters … I hid not my face from shame and spitting” ([[Isa. 50:6]]); “they scourge him, and he suffereth it; and they smite him, and he suffereth it. Yea, they spit upon him, and he suffereth it” ([[1 Ne. 19:9]]).

      Mark’s reader sees what the soldiers do not: the man they mock is the true King, and so their mockery, like the title over the cross and the chief priests’ taunts (verses 26, 32), becomes irony. Irony suits a Gospel that teaches that whoever loses his life for Christ’s sake saves it ([[Mark 8:35]]), and that the Christ must suffer and die.
    sources: [huntsman-good-friday, smith-marks-unique-contribution]
  - ref: 21
    phrase: the father of Alexander and Rufus
    kind: history
    title: Simon of Cyrene, and his sons
    body: |
      Simon, a man coming in from the country, was made to carry the cross because Jesus apparently could carry it no farther, exhausted by the ordeals of the night and the morning; even so, He had probably carried only the crossbeam. The soldiers had to compel Simon: it was a disgrace no one would take on willingly, for everything connected with a crucifixion was thought degrading. He was from Cyrene, in North Africa, a member of the Jewish colony there.

      Only Mark names Simon’s sons, as though his readers knew them, and they may have been known members of the early Church, perhaps in Rome. Paul, writing to Rome, greets “Rufus chosen in the Lord, and his mother and mine” ([[Rom. 16:13]]); if he is Simon’s son, as tradition holds, Simon’s family was prominent among the first Christians. Mark gives no sign that Simon had been a disciple before that morning; being so close to Jesus at that hour may have led to his conversion.
    sources: [huntsman-good-friday, talmage-jesus-christ-35]
  - ref: 23
    phrase: 'wine mingled with myrrh: but he received it not'
    kind: history
    title: Wine mingled with myrrh
    body: |
      Before the condemned were fixed to the cross they were offered wine mixed with myrrh, which may have been meant as a narcotic to lessen the pain, as the proverb says, “Give strong drink unto him that is ready to perish” ([[Prov. 31:6]]). It was apparently not a Roman practice but one allowed out of regard for Jewish feeling. Mark says only that Jesus “received it not,” and does not say why. One reading is that He meant to endure the full experience of the cross and meet death with His mind unclouded. Matthew’s account, which calls the drink vinegar mingled with gall, is explained in the note on [[Matt. 27:34]].
    sources: [huntsman-good-friday, talmage-jesus-christ-35]
  - ref: 25
    phrase: it was the third hour, and they crucified him
    kind: history
    title: The third hour
    body: |
      Only Mark gives the hour of the crucifixion: the third hour, about nine in the morning. It agrees with the darkness from the sixth hour, noon, which Matthew and Luke tell as well. John, though, has Pilate pronounce the sentence “about the sixth hour” ([[John 19:14]]), so that the crucifixion came after noon.

      The two times cannot easily be laid one over the other. Mark’s morning hardly leaves time for everything the trial accounts describe; John’s later hour allows more, and it has Jesus, the true Lamb of God, hang and die on the cross during the very hours the priests were sacrificing the Passover lambs in the temple. Mark’s own hours, the third, the sixth and the ninth (verses 25, 33, 34), are one of the patterns of three that run through his Gospel, and they mark out the day: three hours on the cross in daylight, three in darkness, and the cry at the end.
    sources: [huntsman-good-friday, ellicott-mark, smith-marks-unique-contribution]
  - ref: 28
    phrase: he was numbered with the transgressors
    kind: scripture
    title: Numbered with the transgressors
    body: |
      Verse 28 stands in the Greek text the King James translators used, but it is missing from some of the early manuscripts, and the modern critical editions (the SBL text, Westcott and Hort, Tischendorf) leave it out. Luke has the same line of Isaiah from Jesus’s own lips at the end of the Last Supper: “he was reckoned among the transgressors” ([[Luke 22:37]]).

      Whoever first wrote it here, it says what the scene means. Jesus crucified between two condemned men fulfilled the last verse of Isaiah 53, where the Servant “was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors” ([[Isa. 53:12]]). Mark calls the two men *lēistai*, “thieves” in the King James, bandits, a word that in this setting may mean rebels like Barabbas; Jesus may even have died in the place that had been meant for the man the crowd set free.
    sources: [greek-nt, huntsman-good-friday]
  - ref: 31
    phrase: He saved others; himself he cannot save
    kind: christ
    title: He saved others
    body: |
      Three groups mock Him in turn: the passers-by, the chief priests with the scribes, and the men crucified with Him. The passers-by throw back the charge the false witnesses had made in the night, that He would destroy the temple and build another in three days ([[Mark 14:58]]). The chief priests say among themselves, “He saved others; himself he cannot save,” and dare “Christ the King of Israel” to come down, “that we may see and believe.”

      Each taunt says more than its speaker knows. Mark’s reader has heard Jesus teach that whoever would save his life shall lose it, and whoever loses his life for His sake and the gospel’s shall save it ([[Mark 8:35]]), and knows that the man being mocked is the true King. He had saved others, and He did not come down. His life was not taken from Him except as He willed to permit, and though death would have been a welcome relief at any earlier stage of His suffering, He lived until all things were accomplished as had been appointed.
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-35]
  - ref: 34
    phrase: Eloi, Eloi, lama sabachthani?
    kind: christ
    title: My God, my God
    body: |
      These are the only words Jesus speaks from the cross in Mark’s account, and Mark keeps them in Jesus’s Aramaic before he translates them, as he does with “Golgotha” (verse 22). They are the first line of Psalm 22 ([[Ps. 22:1]]), the psalm the footnotes trace through the crucifixion (verse 24). That psalm ends in triumph, with “all the kindreds of the nations” worshipping the Lord ([[Ps. 22:27]]), so even this cry holds out a hope of reconciliation and victory.

      What the cry meant for the Savior is the reader’s deepest question. Elder Bruce R. McConkie taught that while Jesus hung on the cross through those three hours of darkness, from noon to three, “all the infinite agonies and merciless pains of Gethsemane recurred.” Elder Jeffrey R. Holland has taught that the Father did not forsake His Son in that hour, yet briefly withdrew from Him the comfort of His Spirit and the support of His presence, so that the sacrifice might be complete; the site’s note at [[Ps. 22:1]] gives his words.

      At the baptism the voice from heaven spoke a psalm to Jesus, “Thou art my beloved Son” ([[Mark 1:11]]); here Jesus speaks a psalm to God. The likeness of form sharpens the contrast between the two, and the note on [[Mark 1:11]] sets them side by side.
    sources: [strathearn-gospels, smith-narrative-atonement-mark, mcconkie-gethsemane-1985, holland-none-with-him, lds-scriptures]
  - ref: 36
    phrase: let us see whether Elias will come to take him down
    kind: history
    title: Is he calling Elijah?
    body: |
      Some of the bystanders took “Eloi,” “my God,” for a call to Elijah, *Eliyahu*. One of them ran with a sponge of vinegar on a reed, and they waited to see whether Elijah would come. Elijah’s coming had been promised before “the great and dreadful day of the LORD,” to “turn the heart of the fathers to the children, and the heart of the children to their fathers” ([[Mal. 4:5–6]]), and in Mark he has come already, in John the Baptist, who filled his role ([[Mark 9:11–13]]).

      Elijah is not at the cross. What is there is Jesus’s unanswered plea to God, which only sounds like a call to Elijah, and no one comes to take Him down. What the Father’s withdrawal in that hour meant is the subject of the note on verse 34.
    sources: [smith-narrative-atonement-mark]
  - ref: 38
    phrase: the veil of the temple was rent in twain from the top to the bottom
    kind: symbol
    title: The veil rent from the top
    body: |
      The torn veil means that the way into God’s presence, once open to one man on one day of the year, is open to all because of Jesus’s death. The veil was most likely the inner curtain, which shut off the Holy of Holies, where the Lord was to meet His people above the mercy seat ([[Ex. 25:22]]); only the high priest went in, and only on the Day of Atonement ([[Lev. 16]]). Mark may imply that God tore it, not any human hand: the tear runs “from the top to the bottom,” and the verb is passive, a form often used of God’s acts.

      On this reading Mark presents that death as the Day of Atonement, and its effect as atoning. Hebrews says the same of Christ the High Priest, who entered “by his own blood … once into the holy place, having obtained eternal redemption for us” ([[Heb. 9:12]]), opening the way for all who accept Him. Mark tells it in a dozen Greek words, the first thing he reports after Jesus dies, and with the verb, *schizō*, he had used for the heavens torn open at the baptism (see the note on [[Mark 1:10]]).
    sources: [smith-narrative-atonement-mark, huntsman-good-friday]
  - ref: 39
    phrase: Truly this man was the Son of God
    kind: christ
    title: A centurion’s confession
    body: |
      The first human response to Jesus’s death that Mark records is a confession, and it comes from a Roman officer. Mark’s word for him is *kentyriōn*, a Latin word, centurion. He stood “over against” Jesus, facing Him, and what moved him was no earthquake, for Mark tells of none (compare [[Matt. 27:54]]), but the way Jesus died: “that he so cried out, and gave up the ghost,” breathed His last. Only Mark keeps the paradox whole, a Gentile soldier realizing that the humiliating death of a political prisoner could be the death of the Son of God.

      “The Son of God” is the title that frames the Gospel (see the note on [[Mark 1:1]]). At the baptism the heavens were torn and the Father’s voice named Jesus His Son; here the veil is torn and a centurion names Him Son. On this reading, Mark’s story teaches that Jesus’s death makes it possible for a hated pagan soldier to do what God did, to know who Jesus is and to say it. He may have stood “over against” Jesus, a phrase that can suggest opposition, but after Jesus’s death he knows who Jesus is.
    sources: [thayer, smith-marks-unique-contribution, smith-narrative-atonement-mark]
  - ref: 40
    phrase: There were also women looking on afar off
    kind: history
    title: The women who watched
    body: |
      Only now, after the cross, does Mark say that women had followed Jesus in Galilee and “ministered unto him,” and that many others had come up with Him to Jerusalem. The men of the Twelve have fled ([[Mark 14:50]]); these women stay and see Him die. They had been disciples all along, following a teacher as disciples do, and Mark brings their discipleship into view only at His death.

      “Ministered” is *diakoneō*, the verb Mark used for the angels who ministered to Jesus after the temptation ([[Mark 1:13]]), for Peter’s wife’s mother once He had healed her ([[Mark 1:31]]), and for Jesus’s own mission: He came “not to be ministered unto, but to minister” ([[Mark 10:45]]). In the women at the cross Mark shows that Christlike ministry.

      Their part here is to be witnesses, and their witness is likely how the story of His death and Resurrection was kept. Mark uses the same verb for their seeing here, when they see where He is laid (verse 47), and on the first day of the week, when they see that the stone has been rolled away ([[Mark 16:4]]).
    sources: [smith-narrative-atonement-mark, smith-marks-unique-contribution]
  - ref: 43
    phrase: went in boldly unto Pilate
    kind: history
    title: Joseph took courage
    body: |
      The man who buried Jesus was a member of the council that had condemned Him that morning. Joseph of Arimathæa was a “counsellor,” a respected and wealthy member of the Sanhedrin. Luke says he had not consented to the council’s decision ([[Luke 23:50–51]]); John, that he was a disciple “secretly for fear of the Jews” ([[John 19:38]]). Mark says he “waited for the kingdom of God,” and that he “went in boldly”: the Greek means that he took courage and went in, and it implies a contrast between his boldness now and his caution before.

      There was no time to lose. It was “the preparation,” the day before the Sabbath, which would begin at sunset, and the burial had to be made in haste. When John the Baptist was killed, his disciples came and took up his body ([[Mark 6:29]]); Jesus’s closest disciples have fled, and it is Joseph, not one of the inner circle, who asks for His.
    sources: [huntsman-good-friday, thayer, ellicott-mark, talmage-jesus-christ-35, smith-marks-unique-contribution]
  - ref: 44
    phrase: Pilate marvelled if he were already dead
    kind: history
    title: Already dead?
    body: |
      Only Mark tells that Pilate was surprised, and that he sent for the centurion. Pilate had reason to wonder: crucifixion was the most lingering of deaths, and its victims generally lived many hours, sometimes days, while Jesus had been on the cross about six. So Pilate asked the officer, and only when he had his word did he give Joseph the body.

      Mark writes “the centurion,” which seems to point to the same man who had confessed Jesus at the cross (verse 39); if not the same man, he fills the same role of a Gentile witness to Jesus’s death. Mark’s brief exchange may further cement that centurion’s testimony: the soldier who said that Jesus was the Son of God also bore witness that He was dead.
    sources: [talmage-jesus-christ-35, ellicott-mark, smith-marks-unique-contribution]

christ: |
  Mark 15 shows Jesus Christ as the King His mockers could not see. He is silent before His accusers, will not save Himself, and lives on the cross until all that was appointed is done. His death tears the veil of the temple; the first response to it that Mark records is a Gentile soldier’s confession that He was the Son of God; and the women who stayed become His witnesses. The way into God’s presence that His death opened is open to His disciples still: they have “boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh” ([[Heb. 10:19–20]]).

explore: |
  - **The other tellings.** [[Matt. 27]]; [[Luke 23]] (Herod, the daughters of Jerusalem, the thief who repents); [[John 18:28–40]] and [[John 19]] (the longer conversation with Pilate, the mother of Jesus at the cross).
  - **The psalm and the Servant.** [[Ps. 22]] beside verses 24–34, and [[Isa. 53]] beside the whole chapter.
  - **The baptism and the cross.** [[Mark 1:9–13]] beside [[Mark 15:34–41]].
  - **The same day in the Americas.** [[3 Ne. 8–10]].
  - **The veil, the centurion and the women together.** Julie M. Smith, “Narrative Atonement Theology in the Gospel of Mark,” *BYU Studies* 54, no. 1, reads the three responses to Jesus’s death as one statement of what the Atonement opens.

