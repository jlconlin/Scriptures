chapter: 11
title: Nothing but Leaves
tagline: Jesus rides into Jerusalem to shouts of hosanna, curses a fig tree that has only leaves, drives the traders from the temple, teaches faith and forgiveness by the withered tree, and turns the rulers’ question about His authority back on them.
when: 'Holy Week, from Bethany on the Mount of Olives into Jerusalem and its temple, over three days: Sunday, Monday and Tuesday by the reckoning drawn from Mark’s own time markers'

setting: |
  Mark 11 opens the last part of the Gospel. Jesus has come up from Jericho ([[Mark 10:46]]) to Bethany, a village two miles from Jerusalem on the slope of the Mount of Olives, and the rest of the book takes place in and around Jerusalem. The entry into the city is the opening scene of that climax, an acted sign that He was the true King of Israel.

  Mark marks the days. Jesus enters the city, looks round the temple and goes back to Bethany; “on the morrow” He curses the fig tree and clears the temple; “in the morning” the tree is found withered, and the rulers challenge Him in the temple. Read this way, the entry falls on a Sunday, the fig tree and the temple on Monday, and the teaching in the temple on Tuesday. This is the scheme from which the Christian calendar of Holy Week, with Palm Sunday a week before Easter, apparently grew.

  Matthew and Luke tell the clearing of the temple on the day of the entry ([[Matt. 21:12–13]]; [[Luke 19:45–46]]); Mark puts it on the next day, between the cursing of the fig tree and its withering. John tells a clearing at the start of Jesus’s ministry ([[John 2:13–17]]), and Jesus may have cleared the temple twice.

thread: |
  **The King comes looking for fruit.** Jesus rides into Jerusalem as the crowds hail the coming kingdom of David, enters the temple, looks round at everything, and leaves. The next morning He comes to a fig tree in full leaf, finds nothing but leaves, and curses it. Then He goes into the temple and drives out its trade. The following morning the tree is withered from the roots.

  Mark has set the temple between the two halves of the fig tree’s story so that each explains the other. The tree that promised fruit and had none stands for a temple leadership busy with worship that bore no fruit of justice, mercy and holiness, and its withering foretells the temple’s fall. Then Jesus turns from the tree to what will outlast the temple: faith in God, prayer that believes, and forgiveness. The chapter ends with the rulers of the temple asking by what authority He has done “these things,” the entry and the clearing. He answers with a question about John that they will not answer honestly, and in the parable that follows in chapter 12 He is the owner’s beloved son.

sections:
  - range: 1-11
    heading: The King enters Jerusalem
    plain: |
      As they came near Jerusalem, to Bethphage and Bethany at the Mount of Olives, Jesus sent two of His disciples ahead. “Go into the village in front of you,” He told them. “As soon as you enter it you will find a colt tied there that no one has ever ridden. Untie it and bring it. If anyone asks you, ‘Why are you doing this?’ say, ‘The Lord needs it,’ and he will send it here at once.” They went and found the colt tied at a door, outside in the street, and untied it. Some of the people standing there said, “What are you doing, untying the colt?” They answered as Jesus had told them, and the people let them go. They brought the colt to Jesus and threw their cloaks on it, and He sat on it. Many spread their cloaks on the road, and others cut leafy branches from the trees and spread them on the road. Those who went ahead and those who followed shouted, “Hosanna! Blessed is He who comes in the name of the Lord! Blessed is the coming kingdom of our father David! Hosanna in the highest!” Jesus entered Jerusalem and went into the temple. He looked around at everything, and since it was already late, He went out to Bethany with the Twelve.
  - range: 12-14
    heading: A fig tree with nothing but leaves
    plain: |
      The next day, as they were leaving Bethany, He was hungry. Seeing in the distance a fig tree in leaf, He went to see whether He might find anything on it. When He came to it He found nothing but leaves, for it was not the season for figs. He said to the tree, “May no one ever eat fruit from you again.” And His disciples heard Him.
  - range: 15-19
    heading: The temple cleared
    plain: |
      They came to Jerusalem, and Jesus went into the temple and began to drive out those who were selling and buying there. He overturned the tables of the money changers and the seats of those who sold doves, and He would not let anyone carry a vessel through the temple. Then He taught them: “Is it not written, ‘My house shall be called a house of prayer for all nations’? But you have made it a den of robbers.” The scribes and chief priests heard this and began looking for a way to destroy Him, for they were afraid of Him, because the whole crowd was amazed at His teaching. When evening came, Jesus and His disciples went out of the city.
  - range: 20-26
    heading: The withered tree, and the prayer of faith
    plain: |
      In the morning, as they went by, they saw the fig tree withered from the roots. Peter remembered and said to Him, “Master, look! The fig tree You cursed has withered.” Jesus answered, “Have faith in God. Truly I tell you, if anyone says to this mountain, ‘Be lifted up and thrown into the sea,’ and does not doubt in his heart but believes that what he says will happen, it will be done for him. So I tell you, whatever you ask for in prayer, believe that you receive it, and it will be yours. And whenever you stand praying, if you hold anything against anyone, forgive him, so that your Father in heaven may also forgive you your trespasses. But if you do not forgive, neither will your Father in heaven forgive your trespasses.”
  - range: 27-33
    heading: By what authority?
    plain: |
      They came again to Jerusalem, and as Jesus was walking in the temple, the chief priests, the scribes and the elders came to Him and said, “By what authority are You doing these things? Who gave You the authority to do them?” Jesus answered, “I will ask you one question. Answer Me, and I will tell you by what authority I do these things. John’s baptism: was it from heaven, or from men? Answer Me.” They argued it out among themselves: “If we say, ‘From heaven,’ He will say, ‘Then why did you not believe him?’ But if we say, ‘From men’…” They were afraid of the people, for everyone held that John really was a prophet. So they answered Jesus, “We do not know.” And Jesus said to them, “Neither will I tell you by what authority I do these things.”

notes:
  - ref: 2
    phrase: ye shall find a colt tied, whereon never man sat
    kind: symbol
    title: A colt never ridden
    body: |
      Jesus’s choice of an unridden colt points to the King of Zechariah’s prophecy. Matthew has two animals, an ass and her colt, and quotes Zechariah’s prophecy of the King who comes “lowly, and riding upon an ass, and upon a colt the foal of an ass” ([[Zech. 9:9]]; [[Matt. 21:2–5]]). Mark, like Luke and John, names only the colt and does not quote the prophecy, but he keeps a detail that points to it: the colt had never been ridden. In the Greek translation of Zechariah, the Septuagint, the King’s mount can be rendered “a new donkey,” and Mark’s unridden colt may reflect that wording, so that the detail quietly marks Jesus as the King Zechariah foresaw.

      The entry was no accident: Jesus knew beforehand what would happen and what He would do. He came riding a donkey, in token of peace, not on a war horse.
    sources: [huntsman-palm-sunday, ellicott-mark, talmage-jesus-christ-29]
  - ref: 4
    phrase: in a place where two ways met
    kind: words
    title: Where two ways met
    body: |
      “Where two ways met” renders one Greek word, *amphodon*, which occurs only here in the New Testament and properly means a road that runs round something, a street. Whether street or crossroads, Mark’s description puts the colt outside the courtyard, tied at the door in the open. Small, exact touches of this kind are characteristic of Mark.
    sources: [thayer, ellicott-mark]
  - ref: 9
    phrase: 'Hosanna; Blessed is he that cometh in the name of the Lord'
    kind: words
    title: Hosanna
    body: |
      “Hosanna” means “save now.” It is an Aramaic form of the Hebrew words of [[Ps. 118:25]], and “Blessed is he that cometh in the name of the Lord” is the next verse of the same psalm. Psalm 118 is the last of the psalms of the Hallel sung at Passover, and it seems first to have been a processional psalm, sung by worshippers as they went up to the temple. That makes the crowd’s choice fitting: they sang it in the days before Passover, as Jesus was going up to the temple. At the Feast of Tabernacles the psalm was chanted while palm branches were waved, and from that festival the word “hosanna” came to the crowd’s lips at the entry.

      The people spread their garments in the road, and with them leafy boughs (Mark’s word, used only here, means the kind that make a soft litter underfoot, not woody limbs), carpeting the way as one would for a king. Mark does not say who made up this crowd; it may have been chiefly the disciples who had come up with Jesus.
    sources: [bd-hosanna, huntsman-palm-sunday, talmage-jesus-christ-29, ellicott-mark]
  - ref: 10
    phrase: Blessed be the kingdom of our father David
    kind: christ
    title: The kingdom of our father David
    body: |
      Only Mark has the crowd bless the coming kingdom as well as the One who comes. Matthew and John make the acclaim more plainly a salute to a person (“Hosanna to the Son of David,” [[Matt. 21:9]]; “Blessed is the King of Israel,” [[John 12:13]]). In Mark the people hail the kingdom promised to David’s line, and the man on the colt as the One who brings it. Drawing on Zechariah and Psalm 118, the whole entry declared Jesus the Son of David and the rightful King of Israel.

      This is a striking change in Mark’s story. Through most of the Gospel Jesus has silenced those who would proclaim Him and kept back every popular move to make Him a national leader (see the note on [[Mark 8:30]]). Now He accepts a king’s homage in public. With His hour at hand, His acceptance of kingly and messianic titles made an open proclamation of who He was. No one moved to stop Him. The Romans apparently saw little threat in it, and the rulers, seeing how popular He was, were hesitant to arrest Him in public.
    sources: [ellicott-mark, huntsman-palm-sunday, talmage-jesus-christ-29]
  - ref: 11
    phrase: when he had looked round about upon all things
    kind: history
    title: He looked round about upon all things
    body: |
      In Mark, Jesus goes into the temple, looks around at everything, and leaves; the clearing comes the next day, where Matthew and Luke have it at once. The hour may be part of the reason: “eventide” could include the two or three hours before sunset, and a procession slowed by dense crowds and frequent halts had probably taken much of the day. But Mark also holds the clearing back for its meaning, so that he can set it inside the story of the fig tree (see the note on verse 15).

      Each night of that week Jesus went back out to Bethany, where He presumably stayed with friends such as Lazarus and his sisters.
    sources: [ellicott-mark, huntsman-palm-sunday, huntsman-monday]
  - ref: 13
    phrase: for the time of figs was not yet
    kind: symbol
    title: The time of figs was not yet
    body: |
      Mark’s own comment makes the scene hard: it was spring, too early for figs, and still Jesus cursed the tree for having none. It is also the only miracle in the Gospels that destroys rather than heals, feeds or rescues. Efforts to explain why Jesus could have expected fruit out of season go back to the speculations of nineteenth-century lives of Christ. Taken at face value the expectation seems unreasonable, which suggests the point lies elsewhere: the cursing is best seen not as a burst of temper at a tree but as a prophetic act, a parable acted out.

      The prophets used the fig tree as a figure for Israel when it bore no fruit for God: “there shall be no grapes on the vine, nor figs on the fig tree” ([[Jer. 8:13]]); “my soul desired the firstripe fruit” ([[Micah 7:1]]). By Passover the tree was in early leaf and from a distance seemed to promise fruit, but the promise was false. What it stood for is said in the next verses: the temple and those who ran it. The fruitless ones are the leadership and the institutions it was wrongly controlling, not the Jewish people.
    sources: [huntsman-monday]
  - ref: 15
    phrase: began to cast out them that sold and bought in the temple
    kind: structure
    title: The temple inside the fig tree
    body: |
      Mark tells the fig tree in two halves, the curse on Monday morning (verses 12–14) and the withered tree on Tuesday morning (verses 20–21), and puts the clearing of the temple between them. Matthew has the tree wither at once ([[Matt. 21:19]]); Mark lets a day pass so that the curse and its fulfillment frame the temple scene. Framing one story with another is a device Mark uses often, and the frame tells how to read what it holds.

      In Matthew and Luke, coming straight after the entry, the scene is a cleansing: the rightful King puts His house in order. In Mark, set inside the fig tree, it is also a sign of judgment. A temple leadership that did not practise the justice, mercy and holiness the Lord required is the tree in full leaf with no fruit, and the overturned tables anticipate the overturned stones of Jesus’s prophecy two chapters later ([[Mark 13:2]]). Within forty years the Romans destroyed the temple and the city.
    sources: [huntsman-monday, huntsman-chronology-final-week]
  - ref: 15
    phrase: overthrew the tables of the moneychangers, and the seats of them that sold doves
    kind: history
    title: Moneychangers and doves
    body: |
      The trade had a lawful purpose. Pilgrims needed animals for sacrifice, and the temple tax had to be paid in one coin, the Tyrian shekel, not in the money of each traveller’s country. So money changers and sellers set up for business. Herod had built shops for this below the temple court, but by Jesus’s day some of the business had moved up onto the temple platform itself, into the Court of the Gentiles, where merchants rented stalls, probably to the profit of the temple’s stewards.

      The doves show how the trade could go wrong. The law let the poor offer doves when they could not afford a lamb ([[Lev. 12:8]]), to lessen their cost. One ancient record tells of a pair of doves sold for a gold dinar, twenty-five times the usual price. It does not describe the stalls Jesus overturned that day, but it shows how a market in the temple could turn a concession meant to spare the poor into a burden.
    sources: [cochran-house-of-prayer]
  - ref: 16
    phrase: would not suffer that any man should carry any vessel through the temple
    kind: history
    title: No vessel through the temple
    body: |
      Only Mark records that Jesus would not let anyone carry a vessel through the temple. People used the temple courts as a short cut from one part of the city to another, carrying their goods with them. The Greek word for “vessel,” *skeuos*, can mean any object or piece of property as well as a container, so Jesus may have stopped tradesmen’s baskets and wares as well as jars. Just what He forbade is not known; the plain sense is that the holy place was not to be treated as a thoroughfare for business.
    sources: [ellicott-mark, cochran-house-of-prayer]
  - ref: 17
    phrase: My house shall be called of all nations the house of prayer
    kind: scripture
    title: A house of prayer for all nations
    body: |
      Jesus quotes [[Isa. 56:7]], where the Lord promises to bring even the stranger and the outcast to His holy mountain: “mine house shall be called an house of prayer for all people.” Of the first three Gospels, only Mark keeps the words “of all nations.”

      The words bear on where the trading was done. The temple’s courts were passed through one after another on the way to the sanctuary, each more restricted than the last, and the outermost, the Court of the Gentiles, was the only one open to Gentiles who came to worship. That is most likely where the market stood. The one court in which the nations could pray had been filled with tables, stalls and animals.
    sources: [huntsman-monday, cochran-house-of-prayer]
  - ref: 17
    phrase: ye have made it a den of thieves
    kind: words
    title: A den of thieves
    body: |
      The second half of the saying comes from Jeremiah’s sermon at the temple gate: “Is this house, which is called by my name, become a den of robbers in your eyes?” ([[Jer. 7:11]]). Jeremiah warned a people who trusted in the temple while they oppressed “the stranger, the fatherless, and the widow” ([[Jer. 7:6]]), and the echo carries the same warning against ritual without repentance.

      “Thieves” is too mild for the Greek. The word is *lēstēs*, a robber or bandit who takes by force, not a thief who steals by stealth, and it can also mean a usurper or insurrectionist. Applied to the temple, the charge falls on those who ran it: the priestly authorities were acting like usurpers, and they had corrupted the worship carried on under their direction.
    sources: [thayer, huntsman-monday, cochran-house-of-prayer]
  - ref: 23
    phrase: whosoever shall say unto this mountain, Be thou removed
    kind: scripture
    title: Saying unto this mountain
    body: |
      “This mountain” may be the Mount of Olives, where the fig tree was cursed and which Zechariah saw split in the last day ([[Zech. 14:4]]), or the Temple Mount, soon to be overthrown. Both are possible, but the teaching on prayer that follows, prayer that still avails when the temple is gone (see the note on verse 25), gives the Temple Mount particular weight. Either way, Jesus answers Peter’s word about the withered tree with “Have faith in God.” The greatest fruit God looks for, which the tree did not bear, is faith, and to faith He promises what seems impossible.

      Restoration scripture records such faith at work. Moroni writes that “the brother of Jared said unto the mountain Zerin, Remove—and it was removed” ([[Ether 12:30]]), and the Lectures on Faith, drawing on Moroni’s account, teach that faith is the principle of power, in God and in men: those who “spake by faith in the name of God” saw mountains removed.
    sources: [huntsman-monday, lectures-on-faith-1, lds-scriptures]
  - ref: 24
    phrase: believe that ye receive them, and ye shall have them
    kind: scripture
    title: Believe that ye receive
    body: |
      The promise sounds unlimited, and the reader asks whether prayer can obtain anything at all. The answer is in what prayer is for: it is “the act by which the will of the Father and the will of the child are brought into correspondence with each other.” Its purpose is not to alter God’s will but to obtain the blessings He is already willing to grant and has made to depend on our asking. The risen Lord gave the Nephites the same promise with the condition spelled out: “whatsoever ye shall ask the Father in my name, which is right, believing that ye shall receive, behold it shall be given unto you” ([[3 Ne. 18:20]]).
    sources: [bd-prayer, lds-scriptures]
  - ref: 25
    phrase: when ye stand praying, forgive, if ye have ought against any
    kind: scripture
    title: Forgive when you pray
    body: |
      Mark joins forgiveness to the promise about prayer, where Matthew’s telling of the withered tree ends with the promise alone ([[Matt. 21:21–22]]); here, beside the withered tree and in the week the temple was condemned, the link matters. Jesus seems to be teaching that even when the temple is gone, those who have faith can still pray to effect, and if their prayers are joined with mercy, forgiveness will come even without the place where atonement was made by ritual.

      The Lord repeated the condition in this dispensation, and more sharply: “he that forgiveth not his brother his trespasses standeth condemned before the Lord; for there remaineth in him the greater sin” ([[D&C 64:9]]).
    sources: [huntsman-monday, lds-scriptures]
  - ref: 28
    phrase: By what authority doest thou these things?
    kind: history
    title: By what authority?
    body: |
      The chief priests, the scribes and the elders were the groups that made up the Sanhedrin, the supreme Jewish court and the chief civil body under Roman rule. The chief priests were the high priest, former high priests and perhaps the heads of the leading priestly families; the scribes were the experts in the law, among them leading Pharisees; the elders represented the lay nobility. They are the very groups Jesus had named when He first foretold that He would be “rejected of the elders, and of the chief priests, and scribes” ([[Mark 8:31]]).

      They were the guardians of the temple, and they had probably debated overnight before coming. “These things” were the entry and above all the clearing of the temple, which struck at their own authority there. They did not argue that the traders belonged in the court; they asked only who had given Him the right to act.
    sources: [huntsman-monday, talmage-jesus-christ-30, cochran-house-of-prayer]
  - ref: 30
    phrase: The baptism of John, was it from heaven, or of men?
    kind: history
    title: The baptism of John
    body: |
      Jesus’s question about John’s baptism turns the rulers’ question about His authority back on them, by a method they often used themselves: countering one question with another. John had testified of Him: “There cometh one mightier than I after me” ([[Mark 1:7]]). If the rulers granted that John’s baptism was from heaven, Jesus would probably ask why they had not believed John, and with him his witness of Jesus. If they called it of men, they faced the people, who revered the martyred Baptist as a prophet. Mark records them weighing only what each answer would cost them, and no attempt to find out which was true and answer accordingly.

      Jesus’s refusal gives them nothing they could use against Him. Then He goes straight on to a parable in which the owner of a vineyard sends servant after servant and last of all his beloved son ([[Mark 12:1–12]]): the owner is God, and the son is Jesus Himself.
    sources: [talmage-jesus-christ-30, huntsman-monday]

christ: |
  Mark 11 shows Jesus Christ coming to Jerusalem as its King, on a colt in token of peace, and then to the temple as its Lord, looking for fruit and claiming it again as a house of prayer for all nations. Asked by what authority He acts, He answers with John, whose baptism the rulers would not own and who had testified that one mightier than he was coming ([[Mark 1:7]]). The Lord still looks for fruit and not leaves in those who worship in His house. The prayer He promises to answer is offered in faith by those who forgive, for “of you it is required to forgive all men” ([[D&C 64:10]]).

explore: |
  - **The other tellings.** [[Matt. 21:1–27]]; [[Luke 19:28–20:8]]; [[John 12:12–19]].
  - **The prophecies behind the entry and the temple.** [[Zech. 9:9–10]]; [[Ps. 118:19–29]]; [[Isa. 56:1–8]]; [[Jer. 7:1–15]].
  - **What the rulers’ question leads to.** The parable of the wicked husbandmen, [[Mark 12:1–12]], and the fall of the temple foretold, [[Mark 13:1–2]].
  - **Faith that moves mountains.** [[Ether 12:30]]; [[Jacob 4:6]].
  - **The temple scenes in depth.** “‘An House of Prayer for All People’: A Guide to Christ’s Cleansing of the Temple,” *Religious Educator* 25, no. 2 (2024), sets out the courts of the temple, the market and the Gospels’ four accounts.

