chapter: 12
title: The Things That Are God’s
tagline: In the temple courts Jesus tells the parable of the wicked husbandmen, answers the Pharisees and Herodians about tribute to Caesar, the Sadducees about the resurrection and a scribe about the first commandment, asks how the Christ can be David’s son, warns against the scribes, and praises a poor widow’s two mites.
when: 'In the courts of the temple at Jerusalem, in the last week of Jesus’s life'

setting: |
  Mark 12 goes on with the scene that began at [[Mark 11:27]]. Jesus is walking in the temple, and “the chief priests, and the scribes, and the elders” have just demanded to know by what authority He does these things. Those three groups made up the Sanhedrin, the council that was both the highest Jewish court and the chief civil body under Roman rule, and they are the three Jesus had named when He first foretold His death ([[Mark 8:31]]). Jerusalem and its temple were crowded with pilgrims come for the Passover, and those crowds heard the whole exchange.

  In Mark’s order the day begins with the disciples seeing the withered fig tree on the way back into the city ([[Mark 11:20–21]]), the Tuesday of that week in the working chronology of one Latter-day Saint study, and it ends with Jesus leaving the temple to foretell its fall ([[Mark 13:1–2]]). Many harmonies of the Gospels put everything in this chapter on that one day.

  Matthew tells the same stories in the same order, with two more parables and the full discourse of woes against the scribes and Pharisees ([[Matt. 21:33–23:39]]); Luke tells all but the question about the first commandment ([[Luke 20:9–21:4]]). The widow’s mites are in Mark and Luke, not in Matthew.

thread: |
  **Tested in the temple.** The leaders who questioned Jesus’s authority hear a parable aimed at them, and then they and their allies take turns trying to catch Him. Three questions come from three different groups: the Pharisees with the Herodians ask about tribute to Caesar, the Sadducees about the resurrection, a scribe about the first commandment. Each answer silences its questioners, until “no man after that durst ask him any question” (verse 34). Then Jesus asks a question of His own, about whose son the Christ is.

  The chapter ends by setting two kinds of religion side by side. The scribes as a group love long robes, greetings and the best seats, and “devour widows’ houses”; one poor widow puts into the temple treasury two of the smallest coins there were, all she had to live on. Jesus has just praised a single scribe as “not far from the kingdom of God,” and the contrast makes the warning against the rest sharper. The opponents who searched His answers for a fault found none, yet within days the leaders of the nation would condemn Him.

sections:
  - range: 1-12
    heading: The parable of the wicked husbandmen
    plain: |
      Then Jesus began to speak to them in parables. “A man planted a vineyard, put a hedge around it, dug a pit for the winepress, and built a watchtower. Then he leased it to tenant farmers and went away to another country. At harvest time he sent a servant to the tenants to collect his share of the vineyard’s fruit. They seized him, beat him, and sent him away with nothing. He sent another servant; they threw stones at him, wounded him in the head, and sent him away disgraced. He sent another, and him they killed; and so with many others, beating some and killing some. He had one son left, whom he loved dearly. He sent him to them last of all, saying, ‘They will respect my son.’ But the tenants said to one another, ‘This is the heir. Come, let us kill him, and the inheritance will be ours.’ So they seized him, killed him, and threw his body out of the vineyard. What will the owner of the vineyard do? He will come and destroy those tenants and give the vineyard to others. Have you not read this scripture: ‘The stone the builders rejected has become the cornerstone. This was the Lord’s doing, and it is marvelous in our eyes’?” They wanted to arrest Him, because they knew He had told the parable against them, but they were afraid of the crowd. So they left Him and went away.
  - range: 13-17
    heading: Tribute to Caesar
    plain: |
      Then they sent some of the Pharisees and some of the Herodians to Him, to trap Him in what He said. They came and said, “Teacher, we know that You are honest and do not court anyone’s favor; You do not care about a person’s rank, but teach the way of God truthfully. Is it lawful to pay the tax to Caesar or not? Should we pay it, or should we not?” But He saw through their hypocrisy and said, “Why are you testing Me? Bring Me a denarius, so I can look at it.” They brought one, and He asked them, “Whose image is this, and whose inscription?” “Caesar’s,” they answered. Jesus said to them, “Give back to Caesar what belongs to Caesar, and to God what belongs to God.” And they were amazed at Him.
  - range: 18-27
    heading: The Sadducees and the resurrection
    plain: |
      Then some Sadducees, who say there is no resurrection, came to Him with a question. “Teacher, Moses wrote for us that if a man dies and leaves a wife but no children, his brother should marry the widow and raise up children for his brother. Now there were seven brothers. The first married and died without children. The second married her and died, leaving no children, and the third the same. None of the seven left children. Last of all the woman died too. In the resurrection, when they rise, whose wife will she be? All seven had her as wife.” Jesus answered, “Is this not why you are wrong, because you know neither the scriptures nor the power of God? When people rise from the dead, they do not marry or get married, but are like the angels in heaven. And as for the dead being raised, have you not read in the book of Moses, in the passage about the bush, how God said to him, ‘I am the God of Abraham, the God of Isaac, and the God of Jacob’? He is not the God of the dead but of the living. You are badly mistaken.”
  - range: 28-34
    heading: The first commandment
    plain: |
      One of the scribes came up and heard them debating. Seeing that Jesus had answered them well, he asked Him, “Which commandment is the first of all?” Jesus answered, “The first is, ‘Hear, O Israel: The Lord our God is one Lord. And you shall love the Lord your God with all your heart, with all your soul, with all your mind, and with all your strength.’ This is the first commandment. The second is this: ‘You shall love your neighbor as yourself.’ No other commandment is greater than these.” The scribe said to Him, “Well said, Teacher. You have spoken the truth: there is one God, and there is no other but He. And to love Him with all the heart, all the understanding, all the soul and all the strength, and to love one’s neighbor as oneself, is more than all whole burnt offerings and sacrifices.” When Jesus saw that he had answered wisely, He said to him, “You are not far from the kingdom of God.” After that no one dared ask Him any more questions.
  - range: 35-37
    heading: David’s son and David’s Lord
    plain: |
      As Jesus taught in the temple, He asked, “How can the scribes say that the Christ is the son of David? David himself, speaking by the Holy Ghost, said, ‘The Lord said to my Lord, Sit at My right hand, until I make Your enemies Your footstool.’ David himself calls Him Lord; so how can He be his son?” And the great crowd listened to Him with delight.
  - range: 38-40
    heading: Beware of the scribes
    plain: |
      In His teaching He said, “Beware of the scribes. They like to walk about in long robes and to be greeted with respect in the marketplaces; they want the best seats in the synagogues and the places of honor at feasts. They devour widows’ houses, and to cover it they make long prayers. They will receive the heavier condemnation.”
  - range: 41-44
    heading: The widow’s two mites
    plain: |
      Jesus sat down opposite the temple treasury and watched how the crowd put money into it. Many rich people put in large amounts. Then a poor widow came and put in two lepta, the smallest of coins, which together make a quadrans. Jesus called His disciples to Him and said, “Truly I tell you, this poor widow has put in more than all the others who are giving to the treasury. They all gave out of their surplus, but she, out of her poverty, put in everything she had, all she had to live on.”

notes:
  - ref: 1
    phrase: A certain man planted a vineyard, and set an hedge about it, and digged a place for the winefat, and built a tower
    kind: symbol
    title: Isaiah’s vineyard, and its tenants
    body: |
      The vineyard in this parable is the one Isaiah sang of. In the prophets a vineyard stood for the house of Israel, and the hedge, the winepress pit and the tower tie this one to the song of the Lord’s vineyard in Isaiah, where the owner “fenced it, and gathered out the stones thereof, … and built a tower in the midst of it, and also made a winepress therein” ([[Isa. 5:2]]). Isaiah himself names it: “the vineyard of the LORD of hosts is the house of Israel” ([[Isa. 5:7]]).

      The roles follow. The owner is God, the servants are the prophets He had sent to Israel, and the son is Jesus. The tenants farm the vineyard but do not own it; they are Israel’s leaders through her history, down to the chief priests, scribes and elders standing in front of Him, who “knew that he had spoken the parable against them” (verse 12). Jesus changes Isaiah’s story in one telling place. There the vineyard brought forth wild grapes ([[Isa. 5:4]]); here the fruit is presumably good, and the trouble is that the tenants will not give the owner his share. The charge falls on the leaders and the institutions they controlled, not on the people as a whole.
    sources: [huntsman-monday, lds-scriptures]
  - ref: 6
    phrase: one son, his wellbeloved
    kind: christ
    title: One son, his wellbeloved
    body: |
      Mark’s owner has “one son” left, “his wellbeloved,” in Greek *agapētos*. It is the word the Father has used twice already in this Gospel, at Jesus’s baptism, “Thou art my beloved Son” ([[Mark 1:11]]), and on the mount of transfiguration, “This is my beloved Son: hear him” ([[Mark 9:7]]). For Mark’s reader the word names the son: the owner is God, and the son is Jesus. He is sent last, after the servants, and the owner’s hope, “They will reverence my son,” makes the tenants’ answer the more terrible: they kill him because he is the heir.
    sources: [huntsman-monday]
  - ref: 10
    phrase: The stone which the builders rejected is become the head of the corner
    kind: scripture
    title: The stone from Psalm 118
    body: |
      Jesus ends the parable with [[Ps. 118:22–23]], and the choice of psalm reaches back to the start of the week. When He rode into the city the crowds had greeted Him with words from the same psalm, “Hosanna; Blessed is he that cometh in the name of the Lord” ([[Mark 11:9]]; [[Ps. 118:25–26]]). Those who received Him had sung one part of Psalm 118; to those who reject Him He quotes another. The son the tenants kill and throw out is the stone the builders throw away, and the Lord makes that stone the cornerstone of the building.

      The Gospels leave the stone unnamed, though His opponents understood it; for what the head of the corner was, see the note on [[Ps. 118:22]], and for Joseph Smith’s addition, “I am the stone,” the note on [[Matt. 21:42]].
    sources: [huntsman-monday, jackson-adding-words]
  - ref: 13
    phrase: certain of the Pharisees and of the Herodians, to catch him in his words
    kind: history
    title: 'Pharisees and Herodians: a trap with two jaws'
    body: |
      The Pharisees and the Herodians, who joined to trap Jesus here, made an odd pair. The Pharisees had argued with Jesus all through His Galilean ministry, and the leading Pharisees of Jerusalem sat on the Sanhedrin. The Herodians are obscure; Mark names them only here and at [[Mark 3:6]], where they had already joined the Pharisees in Galilee to plot against Him. They are usually taken to have been a political party that supported the family of Herod as the way to keep some Jewish self-rule under Rome.

      The question was built to close on Him from either side. Since Judea had become a province under a Roman governor in AD 6, its taxes were officially paid to the emperor, and they divided the Jews: those who paid willingly were seen as traitors to their faith, and those who refused as disloyal subjects of Rome. If Jesus said yes, the Pharisees could charge Him with betraying God and the nation; if He said no, the Herodians could report Him as urging resistance to Rome. Their opening compliment, “thou art true, … but teachest the way of God in truth” ([[Mark 12:14]]), was true in every word and false in its intent: it was flattery meant to put Him off His guard. Only Mark adds the blunt follow-up, “Shall we give, or shall we not give?”
    sources: [huntsman-tuesday, trotter-judea-province, talmage-jesus-christ-31]
  - ref: 17
    phrase: Render to Cæsar the things that are Cæsar’s, and to God the things that are God’s
    kind: prophets
    title: Whose image, and what to give back
    body: |
      The “penny” was a denarius, the Roman coin in which the tax was paid. The one they handed Him bore the head of the emperor Tiberius and an inscription, “Tiberius Caesar Augustus, son of the deified Augustus, high priest,” which offended Jews twice over: by its graven image, and by claiming divine and priestly standing for Rome’s ruler. (“Superscription” is simply the inscription.) By having them produce one, Jesus made His questioners show that the nation had already settled the matter in practice: they used Caesar’s coins among themselves, and among the Jews to make a ruler’s coins current was to acknowledge his authority.

      “Render” is in the Greek *apodote*, “give back.” The answer acknowledges the emperor’s civic role, since he minted the coin and in a sense still owned it, and it proclaims the greater debt to God, to whom everything that exists belongs. The image on the coin carries over to the second half of the sentence, for, in the words of Elder James E. Talmage, “every human soul is stamped with the image and superscription of God, however blurred and indistinct the line may have become through the corrosion or attrition of sin”; as the coin goes back to Caesar, the soul that bears God’s image is given to God. Elder Talmage also noted that in this dispensation the Lord has required His people to obey and support the governments they live under ([[D&C 58:21–22]]; [[D&C 98:4–6]]; [[A of F 1:12]]).

      Jesus’s answer had a particular edge that week. His opponents could find no fault in it, civil or religious, yet within days the same establishment would condemn Him, and one of the charges brought to Pilate would be that He forbade giving tribute to Caesar ([[Luke 23:2]]).
    sources: [huntsman-tuesday, talmage-jesus-christ-31, ellicott-mark, ellicott-matthew]
  - ref: 18
    phrase: the Sadducees, which say there is no resurrection
    kind: history
    title: A question about the resurrection, not about marriage
    body: |
      The Sadducees appear only here in Mark. They were a small but powerful party of the old high-priestly families, the aristocracy of the nation, who held to the letter of the law of Moses, rejected the authority of tradition, denied angels and spirits, and would not accept immortality as part of the Jewish faith. They resented Jesus’s cleansing of the temple as an attack on their rights, and they would later oppose the apostles for preaching the Resurrection ([[Acts 4:1–3]]).

      So their question is not a sincere one about marriage. It is a question about the resurrection, put by men who did not believe in one, and meant to make the belief look absurd. They build it on the law of levirate marriage (from Latin *levir*, a husband’s brother): when a man died childless, his brother was to marry the widow and raise up a son to carry on the dead man’s name ([[Deut. 25:5–6]]). Seven brothers in turn is possible under that law, though most improbable. Their example also misreads the law it rests on. A levirate marriage was a temporary arrangement for the sake of the dead brother; the child counted as his, and no one would have expected the second through the seventh brothers to be the woman’s husbands in the next life.
    sources: [bd-sadducees, huntsman-tuesday, talmage-jesus-christ-31]
  - ref: 25
    phrase: they neither marry, nor are given in marriage
    kind: prophets
    title: No marrying in the resurrection
    body: |
      This verse can trouble a Latter-day Saint who loves the doctrine of eternal marriage, and some Christian writers from the second century on have read it to mean that there will be no marriage in the next life at all. Latter-day Saint readers note that the words speak of marrying and being given in marriage, the making of marriages, not of the state of being married: on that reading what Jesus excludes from the resurrection is the wedding, not the union.

      Elder James E. Talmage taught that “in the resurrection there will be no marrying nor giving in marriage; for all questions of marital status must be settled before that time, under the authority of the Holy Priesthood, which holds the power to seal in marriage for both time and eternity.” All but the first of the brothers in the Sadducees’ story had married the woman for the duration of mortal life only. The Lord’s words on such marriages in this dispensation seem to answer the same case: a marriage made only “so long as he is in the world and she with him” is “not of force when they are dead,” and those so married “neither marry nor are given in marriage” but are “appointed angels in heaven” ([[D&C 132:15–16]]).

      Nor did early Christians take Jesus’s answer to mean that love between husband and wife ends at death. Their writings and tombs speak of spouses who hoped to be reunited and to live together forever, though they do not seem to have thought of those reunions as eternal marriage in the sense Latter-day Saints do.
    sources: [ellison-family-marriage, talmage-jesus-christ-31, huntsman-tuesday, lds-scriptures]
  - ref: 27
    phrase: He is not the God of the dead, but the God of the living
    kind: christ
    title: The God of the living
    body: |
      Jesus said the Sadducees erred on two counts: they knew neither the scriptures nor the power of God (verse 24). Joseph Smith’s translation sharpens the first, “because ye know not, and understand not the scriptures” (JST Mark 12:28): they had the books of Moses and did not grasp what they said. To deny the resurrection is, in the end, to deny the power of God to raise the dead.

      For the scriptures He goes to the books of Moses, the part they accepted, and to the burning bush: God told Moses that He was “the God of Abraham, the God of Isaac, and the God of Jacob” ([[Ex. 3:6]]), long after all three had died. The Sadducees would have God be the God of the patriarchs only for their brief mortal lives. But He is the God of the living. Abraham, Isaac and Jacob lived on in the world of spirits, and through Jesus’s own resurrection, a few days away, He would overcome death for them and for all. Joseph Smith’s translation makes the point of the verse plain: “He is not therefore the God of the dead, but the God of the living; for he raiseth them up out of their graves” (JST Mark 12:32). Only Mark ends with the blunt verdict, “ye therefore do greatly err.”
    sources: [lds-scriptures, jst-mark-12, huntsman-tuesday, talmage-jesus-christ-31]
  - ref: 29
    phrase: Hear, O Israel; The Lord our God is one Lord
    kind: scripture
    title: The Shema, and why the first commandment is first
    body: |
      The scribe’s question was a natural one; later Jewish authorities would count 613 commandments in the law of Moses. Jesus answers by quoting two of them. The first is [[Deut. 6:4–5]], part of the Shema, the daily Jewish prayer, which is recited twice a day, morning and night. Only Mark has Jesus begin with “Hear, O Israel; The Lord our God is one Lord,” the confession on which the command to love rests. The second is [[Lev. 19:18]], “thou shalt love thy neighbour as thyself.” Neither commandment was new; Jesus quotes both from the law of Moses. What He gave was their rank: “There is none other commandment greater than these.”

      Mark’s list of four, heart, soul, mind and strength, is explained in the note on [[Deut. 6:5]]. Love of God comes first, President Ezra Taft Benson taught, because God “knew that if we truly loved Him we would want to keep all of His other commandments.”
    sources: [huntsman-tuesday, sc-knowhy-517, benson-great-commandment]
  - ref: 34
    phrase: Thou art not far from the kingdom of God
    kind: words
    title: Not far from the kingdom
    body: |
      Matthew ends this exchange with Jesus’s answer; only Mark lets the scribe reply. Scribes were the experts in the law, and in Jerusalem they usually stand with the chief priests and elders against Jesus, but this one seems sincere, perhaps won by the answers he had just heard. He agrees, and goes a step further, in the temple itself: to love God and one’s neighbor “is more than all whole burnt offerings and sacrifices,” the very offerings the temple existed to make. He repeats Jesus’s list without the possessive, “all the heart” rather than “all thy heart,” which may suggest a less personal devotion.

      “Discreetly” is in the Greek *nounechōs*, wisely or prudently. Jesus’s praise is real and measured. To see that keeping the law lies in the two great commandments brought a man to the very threshold of the kingdom; whether he entered, Mark does not say. In one Latter-day Saint reading of Mark, he is the one person in this Gospel who calls Jesus “Master” and seems to mean it, yet there is no sign that he asked more or followed Him.
    sources: [huntsman-tuesday, thayer, ellicott-mark, smith-marks-unique-contribution]
  - ref: 37
    phrase: David therefore himself calleth him Lord; and whence is he then his son?
    kind: christ
    title: David’s son and David’s Lord
    body: |
      With His questioners silenced, Jesus asks His own question, from [[Ps. 110:1]]. The expectation of the day was that the Messiah would be a son of David, a king of David’s line who would redeem Israel and restore her greatness. But in the psalm David, speaking “by the Holy Ghost,” calls that descendant “my Lord.” In this reading of the psalm, David understood that the Messiah was more than his descendant: He was already God’s chosen, seated at His right hand, ages before His birth in the flesh. The question pressed every group in the audience to rethink what it expected of the Christ. How the psalm’s two words for “Lord” work is explained in the note on [[Ps. 110:1]].

      “The common people” is better rendered “the great body of the people”: the stress falls on how many listened, not on their class. The crowds seem to have delighted in seeing Jesus overturn what the Jerusalem authorities taught.
    sources: [huntsman-tuesday, ellicott-mark]
  - ref: 38
    phrase: love to go in long clothing
    kind: words
    title: Long robes and widows’ houses
    body: |
      The “long clothing” was a loose outer garment reaching to the feet, worn by kings, priests and persons of rank. As the verse words it, Jesus warns not against the robe but against loving to walk in it, with the greetings in the market, the front seats in the synagogue and the places of honor at a feast. Coming just after His praise of one scribe, the warning against the scribes as a group stands out the more sharply. Matthew gives the fuller discourse, extended to the Pharisees, with its seven woes ([[Matt. 23:1–36]]).

      “Devour widows’ houses” comes right after the feasts, perhaps to say what such men feast on. The greed of the Jewish hierarchy in Jesus’s day was an open scandal: by extortion and exactions under cover of religious duty its priestly rulers had gathered great wealth, including even the confiscated houses of dependent widows. Of the scribes Jesus adds that they cover such devouring with long prayers. The next scene shows a poor widow at the treasury.
    sources: [thayer, huntsman-tuesday, ellicott-mark, talmage-jesus-christ-31]
  - ref: 42
    phrase: two mites, which make a farthing
    kind: history
    title: Two mites in the treasury
    body: |
      The treasury, as Jesus sat facing it, was the place where offerings were received. It seems to have been the receptacle the rabbis describe, fitted with thirteen chests, each with a trumpet-shaped mouth, into which the people dropped their gifts for the purposes marked on each. The rich gave openly and in large sums.

      The widow’s gift was two *lepta*, the smallest coins in use among the Jews. Mark explains them by a Roman coin: two lepta “make a farthing,” the *quadrans*, the fourth part of a Roman *as*, one of the Latin words that mark this Gospel.

      Mark sets her right after the scribes who “devour widows’ houses” (verse 40), so that the warning and the gift are read together.
    sources: [thayer, talmage-jesus-christ-31, bd-money, strathearn-gospels, ellicott-mark]
  - ref: 44
    phrase: she of her want did cast in all that she had, even all her living
    kind: christ
    title: All her living
    body: |
      Jesus called His disciples to see what He saw, because He meant to teach them to measure a gift by something other than its size. The rich gave much and kept back more; the widow gave everything. In heaven’s accounts, in Elder James E. Talmage’s words, “entries are made in terms of quality rather than of quantity, and values are determined on the basis of capability and intent.” It was not the smallness of her gift that made it acceptable but the spirit of sacrifice in which she gave it, as Paul would write, “if there be first a willing mind, it is accepted according to that a man hath, and not according to that he hath not” ([[2 Cor. 8:12]]).

      “All her living” is *holon ton bion autēs*. *Bios* here is what a life is sustained by, her means of living; but the phrase can be read literally, “her whole life.” Read that way, her gift may foreshadow the gift Jesus was about to make of His own whole life. In one Latter-day Saint reading of Mark she is one of the minor characters who understand discipleship better than the Twelve; the note on [[Mark 14:8]] sets her beside the woman who anoints Jesus.
    sources: [ellicott-mark, talmage-jesus-christ-31, thayer, huntsman-tuesday, smith-marks-unique-contribution]

christ: |
  Mark 12 shows Jesus Christ as the Father’s “one son, his wellbeloved,” sent last to the vineyard, and as the rejected stone that the Lord makes the head of the corner. He is David’s son and David’s Lord, the God of the living who raises the dead, and the one whose questioners could find no fault in Him before they condemned Him. The widow who “cast in all that she had, even all her living” may foreshadow the life He was about to give. Because every soul bears God’s image, rendering to God the things that are God’s means giving Him oneself, and the first commandment comes first because those who truly love Him want to keep all the rest.

explore: |
  - **The other tellings.** [[Matt. 21:33–23:39]]; [[Luke 20:9–21:4]].
  - **The vineyard of the Lord.** [[Isa. 5:1–7]], the song Jesus retells.
  - **Marriage that outlasts death.** [[D&C 132:15–20]]; [[D&C 131:1–4]].
  - **The first and great commandment.** [[Deut. 6:4–9]]; [[Moro. 10:32]].
  - **The day’s debates as a whole.** “Tuesday: Attempts to Catch Jesus in His Words and Prophecies of the End,” in *Greater Love Hath No Man* (Religious Studies Center), reads the questions in the temple, the widow and the discourse of Mark 13 together.

