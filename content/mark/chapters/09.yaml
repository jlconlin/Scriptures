chapter: 9
title: Help Thou Mine Unbelief
tagline: Jesus is transfigured before Peter, James and John, heals a boy His disciples could not heal, foretells His death a second time, and answers the Twelve’s quarrel over who is greatest with a child in His arms and a warning against causing a believer to stumble.
when: 'From the region of Caesarea Philippi to a high mountain apart, then down to a crowd below, back through Galilee, and into the house at Capernaum'

setting: |
  Mark 9 follows directly on Peter’s confession and Jesus’s first open teaching that the Son of Man must suffer ([[Mark 8:27–38]]); the chapter’s first verse closes that discourse. Six days later Jesus takes Peter, James and John up a high mountain, which Mark does not name. The Transfiguration came in about October, some six months before the death of Jesus.

  Matthew tells the same stories in the same order ([[Matt. 17:1–23]]; [[Matt. 18:1–10]]), and Luke tells most of them, more briefly ([[Luke 9:28–50]]). Mark’s account of the boy the disciples could not heal is the fullest of the three, and only Mark has the sayings on the worm, the fire and the salt at the chapter’s end.

  The chapter stands in the middle of the journey that Mark frames with two blind men healed ([[Mark 8:22–26]]; [[Mark 10:46–52]]). Here Jesus foretells His death the second of three times ([[Mark 8:31]]; [[Mark 9:31]]; [[Mark 10:33–34]]), and each time the disciples’ misunderstanding is followed by His teaching on what it means to follow Him.

thread: |
  **From the mountain to the valley.** The chapter begins in glory. On the mountain the three disciples see Jesus transfigured, hear the Father call Him “my beloved Son,” and are told to “hear him.” What He then tells them, on the way down and on the road through Galilee, is that the Son of Man must suffer, be killed and rise again, and they do not understand.

  Below the mountain the rest of the disciples have failed to cast out an evil spirit, and a father who has watched them fail can only say, “if thou canst do any thing.” Jesus turns the question back to him, and the father’s answer, “Lord, I believe; help thou mine unbelief,” is the honest prayer of a disciple who has some faith and needs more. On the road the Twelve argue over which of them is greatest; in the house Jesus sets a child among them and teaches that the first must be the servant of all. The chapter moves from the Father’s witness of the Son to what that witness asks of those who hear it.

sections:
  - range: 1-1
    heading: The kingdom of God come with power
    plain: |
      And He said to them, “Truly I tell you, some of those standing here will not taste death until they have seen the kingdom of God come with power.”
  - range: 2-8
    heading: The Transfiguration
    plain: |
      Six days later Jesus took Peter, James and John and led them up a high mountain, by themselves, and He was transfigured before them. His clothes became dazzling, intensely white, whiter than any launderer on earth could bleach them. Elijah appeared to them with Moses, and they were talking with Jesus. Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters, one for You, one for Moses and one for Elijah.” He did not know what to say, for they were terrified. Then a cloud overshadowed them, and a voice came out of the cloud: “This is My beloved Son. Hear Him.” Suddenly, when they looked around, they no longer saw anyone with them but Jesus alone.
  - range: 9-13
    heading: Coming down from the mountain
    plain: |
      As they came down the mountain, He charged them to tell no one what they had seen until the Son of Man had risen from the dead. They kept the matter to themselves, asking one another what this rising from the dead could mean. And they asked Him, “Why do the scribes say that Elijah must come first?” He answered, “Elijah does come first and restores all things. And how is it written of the Son of Man that He must suffer many things and be treated with contempt? But I tell you that Elijah has indeed come, and they did to him whatever they pleased, as it is written of him.”
  - range: 14-29
    heading: The boy the disciples could not heal
    plain: |
      When He came back to the disciples, He saw a great crowd around them and scribes arguing with them. As soon as the people saw Him they were greatly amazed, and they ran to greet Him. He asked the scribes, “What are you arguing with them about?” A man in the crowd answered, “Teacher, I brought You my son, who has a spirit that makes him mute. Wherever it seizes him, it throws him down; he foams at the mouth, grinds his teeth and is wasting away. I asked Your disciples to cast it out, and they could not.” Jesus answered, “O faithless generation, how long shall I be with you? How long shall I bear with you? Bring him to Me.” They brought the boy, and when the spirit saw Jesus it threw him at once into a convulsion; he fell to the ground and rolled about, foaming. Jesus asked the father, “How long has this been happening to him?” He said, “Since he was a child. It has often thrown him into fire and into water to destroy him. But if You can do anything, have compassion on us and help us.” Jesus said to him, “If you can believe, all things are possible to the one who believes.” At once the boy’s father cried out with tears, “Lord, I believe; help my unbelief.” When Jesus saw the crowd running together, He rebuked the unclean spirit: “You mute and deaf spirit, I command you, come out of him and never enter him again.” The spirit cried out, threw him into violent convulsions and came out, and the boy lay like a corpse, so that many said, “He is dead.” But Jesus took him by the hand and lifted him up, and he stood. When Jesus had gone into the house, His disciples asked Him privately, “Why could we not cast it out?” He said to them, “This kind can come out by nothing but prayer and fasting.”
  - range: 30-32
    heading: His death foretold a second time
    plain: |
      They left that place and went on through Galilee, and He did not want anyone to know it, for He was teaching His disciples. He told them, “The Son of Man is being handed over into the hands of men, and they will kill Him; and after He has been killed, He will rise on the third day.” But they did not understand what He meant, and they were afraid to ask Him.
  - range: 33-37
    heading: Who is the greatest
    plain: |
      They came to Capernaum, and when He was in the house He asked them, “What were you arguing about on the way?” But they kept silent, because on the way they had argued with one another about who was the greatest. He sat down, called the Twelve, and said to them, “If anyone wants to be first, he must be last of all and servant of all.” Then He took a little child and stood him among them, and taking him in His arms He said to them, “Whoever receives one such child in My name receives Me; and whoever receives Me receives not Me only but the One who sent Me.”
  - range: 38-41
    heading: Forbid him not
    plain: |
      John said to Him, “Teacher, we saw someone casting out devils in Your name, and he does not follow us; and we tried to stop him, because he does not follow us.” But Jesus said, “Do not stop him. No one who does a mighty work in My name can soon afterward speak evil of Me. Whoever is not against us is for us. Truly I tell you, whoever gives you a cup of water to drink in My name, because you belong to Christ, will by no means lose his reward.”
  - range: 42-50
    heading: Causing a believer to stumble, and salt
    plain: |
      “Whoever causes one of these little ones who believe in Me to stumble, it would be better for him to have a millstone hung around his neck and be thrown into the sea. If your hand causes you to stumble, cut it off. It is better for you to enter life maimed than to have two hands and go into hell, into the fire that is never put out, where their worm does not die and the fire is not quenched. If your foot causes you to stumble, cut it off. It is better for you to enter life lame than to have two feet and be thrown into hell. And if your eye causes you to stumble, pluck it out. It is better for you to enter the kingdom of God with one eye than to have two eyes and be thrown into hell, where their worm does not die and the fire is not quenched. For everyone will be salted with fire, and every sacrifice will be salted with salt. Salt is good; but if salt loses its saltiness, how will you season it? Have salt in yourselves, and be at peace with one another.”

notes:
  - ref: 1
    phrase: till they have seen the kingdom of God come with power
    kind: scripture
    title: The kingdom of God come with power
    body: |
      This verse ends the discourse of the last chapter, as it does in Matthew and Luke ([[Matt. 16:28]]; [[Luke 9:27]]); the chapter break comes one verse late. Set where it is, it stands just before the Transfiguration, and the Transfiguration is framed by sayings about who or what is coming: the kingdom here, Elias in verses 11–13. The break may have been placed to tie the promise to the Transfiguration as its fulfillment, but that reading is doubtful. Mark’s wording agrees with Luke’s rather than Matthew’s: not “the Son of man coming in his kingdom” ([[Matt. 16:28]]), but the kingdom “come with power,” and the Greek verb speaks of the kingdom as having already come, in its completeness, not as on its way.

      In Latter-day Saint teaching the coming of the Son of Man in His Father’s glory is still future, and at least a partial fulfillment of the promise is John the apostle, who stood there and, at his own desire, still lives in the flesh ([[D&C 7:3]]; see the note on [[Matt. 16:28]]).
    sources: [ellicott-mark, smith-marks-unique-contribution, talmage-jesus-christ-22]
  - ref: 2
    phrase: Jesus taketh with him Peter, and James, and John
    kind: history
    title: Peter, James and John
    body: |
      These three go apart with Jesus three times in Mark: into the room where Jairus’s daughter lay ([[Mark 5:37]]), up this mountain, and into Gethsemane ([[Mark 14:33]]). On the mountain they received more than a vision. The Savior, Moses and Elias (Elijah) gave them the priesthood keys He had promised Peter ([[Matt. 16:19]]), and with those keys the apostles could carry on the work of the kingdom after His Ascension.

      The same three came again in the latter days. In May or June 1829, near Harmony, Pennsylvania, Peter, James and John conferred the Melchizedek Priesthood and its keys on Joseph Smith and Oliver Cowdery, as the Lord recalls in [[D&C 27:12–13]].
    sources: [smith-marks-unique-contribution, gs-transfiguration, bd-peter]
  - ref: 2
    phrase: he was transfigured before them
    kind: christ
    title: Transfigured
    body: |
      To be transfigured is to have one’s form changed. Mark describes the change only in His clothing (verse 3); Matthew adds that “his face did shine as the sun” ([[Matt. 17:2]]). The three saw the Lord glorified, and they saw too a vision of the earth as it will be in its future glory ([[D&C 63:20–21]]).

      Joseph Smith taught that Peter, James and John were themselves transfigured on the mount. They had to be, or they could not have withstood the glory before them, as Moses said of his own vision: “his glory was upon me; and I beheld his face, for I was transfigured before him” ([[Moses 1:11]]).
    sources: [skinner-life-jesus, bd-transfiguration, gs-transfiguration]
  - ref: 3
    phrase: so as no fuller on earth can white them
    kind: words
    title: No fuller on earth
    body: |
      A fuller was a cloth-dresser, a bleacher who whitened cloth; a modern translation says “launderer.” Mark alone makes the comparison, and it is a homely one: the robes were brighter than cloth fresh from the fuller’s hands.
    sources: [thayer, ellicott-mark]
  - ref: 4
    phrase: there appeared unto them Elias with Moses
    kind: history
    title: Elias with Moses
    body: |
      “Elias” is the Greek form of the Hebrew name Elijah, and on the mount it means the prophet Elijah of the books of Kings. He and Moses were both translated beings.

      Joseph Smith’s translation reads, “there appeared unto them Elias with Moses, or in other words, John the Baptist and Moses” (JST Mark 9:3). “Or in other words” reads at first like an identification, but the Church’s reading of the curious wording is that John the Baptist was present in addition to Elijah, not that the Elias on the mount was John. Why John was there the scriptures do not say.

      In this dispensation Moses and Elijah came again, to the Kirtland Temple on April 3, 1836, and conferred priesthood keys on Joseph Smith and Oliver Cowdery ([[D&C 110:11–16]]).
    sources: [bd-elias, bd-transfiguration, jst-mark-9]
  - ref: 5
    phrase: let us make three tabernacles
    kind: history
    title: Three tabernacles
    body: |
      A “tabernacle” here is a booth or shelter. The Feast of Tabernacles seems to have been near; at that feast each worshipper built a little bower of boughs into which he might retire for devotion, and Peter’s offer to build three suggests the apostles had the feast in mind. Mark explains the offer himself: Peter “wist not what to say; for they were sore afraid” (verse 6). So far as the words had a purpose, it seems to have been to keep the heavenly visitors from leaving.
    sources: [skinner-life-jesus, talmage-jesus-christ-23]
  - ref: 7
    phrase: 'This is my beloved Son: hear him'
    kind: christ
    title: Hear him
    body: |
      At the baptism the Father’s voice spoke to Jesus: “Thou art my beloved Son” ([[Mark 1:11]]). On the mount it speaks about Him, to the three apostles: “This is my beloved Son.” Jesus had already received the Father’s witness; this one was for them. The command that follows carries the weight of the scene. Moses, who gave the law, and Elijah, who stood for the prophets, had just been seen ministering to Jesus; now the apostles were to be guided by neither of them, but by Him.

      “Hear” in this voice means more than listen: the Father commanded them to hear, that is, obey Him. He has introduced His Son with remarkably few words each time He has done so: to the three on this mountain, to the Nephites at Bountiful (“hear ye him,” [[3 Ne. 11:7]]), and to Joseph Smith in the grove: “This is My Beloved Son. Hear Him!” ([[JS—H 1:17]]).
    sources: [talmage-jesus-christ-23, bd-transfiguration, nelson-hear-him]
  - ref: 9
    phrase: he charged them that they should tell no man what things they had seen, till the Son of man were risen from the dead
    kind: history
    title: Till the Son of man were risen
    body: |
      Mark often shows Jesus asking people not to make known parts of His ministry (see the note on [[Mark 8:30]]), and this command has an end: “till the Son of man were risen.” It was comprehensive enough that the three could not tell even the rest of the Twelve. After His Resurrection the silence ended, and Peter bore witness of the voice he had heard “when we were with him in the holy mount” ([[2 Pet. 1:16–18]]).

      Only Mark records what the three did with the command: they kept it, and puzzled among themselves “what the rising from the dead should mean” (verse 10). They had been told plainly that Jesus would be killed and would rise again ([[Mark 8:31]]); the first they were reluctantly coming to accept, but of the second they had only a dim comprehension.
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-23]
  - ref: 12
    phrase: Elias verily cometh first, and restoreth all things
    kind: scripture
    title: Elias must first come
    body: |
      Malachi had promised that Elijah would come “before the coming of the great and dreadful day of the LORD” ([[Mal. 4:5]]), and as the disciples read the scriptures, Elijah was to come before the Messiah’s triumphal advent. They had just seen their Lord in glory, and they marveled that it could happen yet. Jesus confirms that Elias comes first, before the Lord’s coming in glory.

      Then He adds that Elias has come already, and “they have done unto him whatsoever they listed,” whatever they chose. Joseph Smith’s translation names him: “he bore record of me, and they received him not. Verily this was Elias” (JST Mark 9:11), that is, John the Baptist. In verse 12 it says that Elias “prepareth all things; and teacheth you of the prophets” (JST Mark 9:10). Only Mark adds “as it is written of him,” which probably points to Malachi’s prophecy and to the likeness between the Baptist and Elijah the Tishbite: what had been written of the one, bold rebuke and suffering for the truth, was fulfilled in the other.

      The name is used two ways. “Elias” is a title as well as a name, given to a forerunner or restorer, and anciently two Eliases were spoken of, one who prepares and one who restores: John prepared the way for Jesus, who was Himself the Restorer. Malachi’s prophecy of Elijah was not fully realized in John; it began to be when Elijah came to the Kirtland Temple in 1836 ([[D&C 110:13–16]]).
    sources: [lds-scriptures, ellicott-mark, bd-elias, talmage-jesus-christ-23]
  - ref: 19
    phrase: O faithless generation
    kind: history
    title: O faithless generation
    body: |
      Jesus’s cry, “how long shall I be with you? how long shall I suffer you?” is a reproof, however mild and pitying, and it was meant first of all for the apostles. On their mission, away from His presence, they had cast out evil spirits by the power He gave them ([[Mark 6:7]]; [[Mark 6:13]]); now, after His absence of a day, they could not.

      Only Mark says that scribes were questioning the disciples when Jesus came down, that the crowd ran to greet Him, and that He asked what the dispute was about. The disciples had failed in front of the scribes, and their discomfiture must have been the worse for the thought that through them doubt had been cast on their Lord’s authority and power.
    sources: [ellicott-mark, talmage-jesus-christ-24]
  - ref: 23
    phrase: If thou canst believe, all things are possible to him that believeth
    kind: words
    title: If thou canst
    body: |
      The father had asked, “if thou canst do any thing, have compassion on us” (verse 22), almost in the accents of despair: could the Master prevail where His disciples had failed? Jesus takes his words and hands them back. Some of the best manuscripts lack the word “believe,” and so read Jesus’s answer as His repeating the father’s doubt with a note of sad surprise, “If thou canst!”, before the promise that “all things are possible to him that believeth.” Whichever reading is right, the “if” now lies with the father rather than with Jesus. He had thought everything depended on Jesus; now, it seems, he saw that the outcome rested largely with himself. And Jesus named belief, rather than faith, as what the case required.
    sources: [ellicott-mark, talmage-jesus-christ-24]
  - ref: 24
    phrase: Lord, I believe; help thou mine unbelief
    kind: prophets
    title: Lord, I believe
    body: |
      The father’s cry holds belief and unbelief in one breath, and Jesus answers the belief. Mark says he cried out “straightway”: not slowly, skeptically or cynically, but at once, in his unvarnished pain. In response to faith that was new and still partial, Jesus healed the boy.

      The order of the father’s words carries a lesson. He declares his belief first and only then asks help with his unbelief; when questions come, a disciple does not begin by declaring how much faith he lacks. “I am not asking you to pretend to faith you do not have,” Elder Jeffrey R. Holland said of this verse. “I am asking you to be true to the faith you do have.”
    sources: [holland-lord-i-believe]
  - ref: 25
    phrase: come out of him, and enter no more into him
    kind: history
    title: Enter no more into him
    body: |
      Only Mark gives the words of the rebuke, and only he calls the spirit “dumb and deaf”; he alone has the boy’s gnashing teeth and wasting away (verse 18). The command “enter no more into him” is used in this case only. It seems fitted to the father’s weak faith: he had seen so many relapses that he could hardly believe a cure would last, and Jesus’s words told him it would.
    sources: [ellicott-mark]
  - ref: 29
    phrase: This kind can come forth by nothing, but by prayer and fasting
    kind: history
    title: Prayer and fasting
    body: |
      The disciples had cast out evil spirits before. Jesus’s answer implies that spirits differ in their malignity, and that the faith needed to overcome them differs too; prayer, and fasting practiced with prudence, develop that faith and the power that goes with it.

      A reader of a modern translation will find “by prayer” alone here. The Greek text behind the King James Version, the Textus Receptus, reads “prayer and fasting,” and so does the Byzantine majority text; some of the best manuscripts lack “and fasting,” and the critical editions (the SBL text, Westcott and Hort, Tischendorf) omit the words. The evidence has also been weighed the other way, as on balance in favor of keeping them. Either way, what they teach is in harmony with the rest of the teaching of Jesus and His apostles.
    sources: [talmage-jesus-christ-24, greek-nt, ellicott-mark]
  - ref: 31
    phrase: The Son of man is delivered into the hands of men
    kind: christ
    title: Delivered into the hands of men
    body: |
      This is the second of the three times Jesus foretells His death on the road to Jerusalem ([[Mark 8:31]]; [[Mark 10:33–34]]), and it adds one detail: He will be delivered “into the hands of men.” The Greek verb, *paradidōmi*, is often translated “delivered” or even “betrayed,” but it means literally “handed over,” and the Passion shows how far the word reaches. Judas hands Him over to the Jewish authorities ([[Mark 14:10–11]]), they hand Him over to Pilate ([[Mark 15:1]]), and Pilate hands Him over to the soldiers to be crucified ([[Mark 15:15]]).

      Only Mark says that Jesus passed through Galilee wanting no one to know it, because He was teaching His disciples; His withdrawal from public notice continued. And as after the first prediction, the disciples did not understand. They had yet to see how the Master’s suffering, death and resurrection fitted His mission as Messiah, and they “were afraid to ask him.”
    sources: [huntsman-preludes-last-week, ellicott-mark, korth-reed-little-children]
  - ref: 34
    phrase: who should be the greatest
    kind: history
    title: Who should be the greatest
    body: |
      Mark does not say what set off the disciples’ argument over who was greatest. They still seem to have expected Jesus to take the throne of David and set up a political kingdom, and they may have been arguing over their places in it, presumably over who would take His place when He was gone. That only three of them had gone up the mountain may have added to it, and to their reluctance to admit their jealous ambitions when He asked. Matthew does not mention the quarrel, and has the disciples ask Him openly who is greatest ([[Matt. 18:1]]).

      Jesus sat down, called the Twelve, and answered: “If any man desire to be first, the same shall be last of all, and servant of all.” The word for servant has its root in simple, menial service, such as waiting at table. He was not promising them status or power. The same pattern follows each prediction of His death: after the third, James and John ask for the places at His right and left hand, and He teaches again that the greatest must be the servant ([[Mark 10:35–45]]).
    sources: [korth-reed-little-children, huntsman-preludes-last-week, smith-marks-unique-contribution]
  - ref: 36
    phrase: when he had taken him in his arms
    kind: symbol
    title: A child in His arms
    body: |
      The word for “child” here was used of a growing child up to about seven. Such a child was humble, poor and dependent, and in the language and the society of the day “children” and “slaves” were closely linked. Into a quarrel over rank Jesus brings the person with no rank at all, takes him in His arms, and says that whoever receives such a child in His name receives Him, and whoever receives Him receives the Father who sent Him. The line runs from the Father through the Son all the way down to the child in their midst.

      Joseph Smith’s translation turns the saying toward the disciples themselves: “Whosoever shall humble himself like one of these children, and receiveth me, ye shall receive in my name. And whosoever shall receive me, receiveth not me only, but him that sent me, even the Father” (JST Mark 9:34–35). The risen Lord taught the Nephites the same chain, “whoso believeth in me believeth in the Father also,” and taught them that they must become as a little child to inherit the kingdom of God ([[3 Ne. 11:35–38]]).
    sources: [korth-reed-little-children, lds-scriptures]
  - ref: 38
    phrase: we forbad him, because he followeth not us
    kind: history
    title: Forbid him not
    body: |
      John’s report may have been prompted by Jesus’s words about receiving a child “in my name”: here was a man acting in that name who was not one of them. The man was evidently sincere, a believer in Christ, and his work was real; he did cast the devils out. His case was quite different from that of the sons of Sceva, whose use of the name was later rebuked ([[Acts 19:13–16]]). John’s zeal for his Master’s name had led him into intolerance.

      “Lightly” means quickly: a man who does a mighty work in Christ’s name will not soon afterward speak evil of Him. So Moses answered Joshua, who wanted two men stopped from prophesying in the camp: “would God that all the LORD’S people were prophets” ([[Num. 11:29]]). Jesus said on other occasions that whoever is not with Him is against Him ([[Matt. 12:30]]); in the divided opinion of the moment, it was fair to say that those not opposed to Him were at least tentatively on His side. Mark adds here the promise of verse 41, that even a cup of water given to His disciples because they belong to Christ will be rewarded. Jesus had given it before, when He sent out the Twelve ([[Matt. 10:42]]); repeating words of blessing in a new setting was part of how He taught.
    sources: [talmage-jesus-christ-24, ellicott-mark]
  - ref: 43
    phrase: if thy hand offend thee, cut it off
    kind: scripture
    title: If thy hand offend thee
    body: |
      Read on the page, the sayings speak of a person’s own hand, foot and eye. As a man would rather lose a limb to surgery than lose his life, so a disciple is to cut off and root out of his soul the passions that would bring him under condemnation, whatever the sacrifice.

      Joseph Smith’s translation gives each limb a second meaning, a person close to the disciple. The hand is a brother who sins and “confess not and forsake not”; the foot is “he that is thy standard, by whom thou walkest”; the eye is “him that is appointed to watch over thee to show thee light.” If such a one becomes a transgressor, he “shall be cut off,” for “it is better for thee to enter into life without thy brother, than for thee and thy brother to be cast into hell” (JST Mark 9:40–48). Read this way, the Prophet’s changes make cutting off a hand or plucking out an eye a figure for excommunication, severance from the body of Christ, which was sometimes needed to keep the Church pure. The revision also teaches that each disciple stands or falls for himself: “let every man stand or fall, by himself, and not for another; or not trusting another,” and it adds a promise, “Seek unto my Father, and it shall be done in that very moment what ye shall ask, if ye ask in faith” (JST Mark 9:44–45).
    sources: [talmage-jesus-christ-24, jst-mark-9, millet-js-matthew]
  - ref: 44
    phrase: Where their worm dieth not, and the fire is not quenched
    kind: scripture
    title: Where their worm dieth not
    body: |
      “Hell” in these verses is *Gehenna*, the valley of Hinnom south of Jerusalem. It had been a scene of the worship of Moloch ([[2 Chr. 28:3]]); Josiah defiled it ([[2 Kgs. 23:10]]), and afterward the refuse of the city was burned there, so that it became a symbol of the place of torment after death. The line Mark repeats three times comes almost word for word from the last verse of Isaiah, where the worshippers of the Lord go out and look on the bodies of those who rebelled against Him: “their worm shall not die, neither shall their fire be quenched” ([[Isa. 66:24]]).

      A reader of a modern translation will find verses 44 and 46 missing. Some of the best manuscripts omit them, leaving verse 48 as the only description of Gehenna, so the refrain stands once rather than three times.
    sources: [bd-gehenna, thayer, ellicott-mark]
  - ref: 49
    phrase: every one shall be salted with fire, and every sacrifice shall be salted with salt
    kind: symbol
    title: Salted with fire
    body: |
      The saying that everyone will be “salted with fire,” found only in Mark, is hard both in its text and in its meaning. Many of the oldest manuscripts lack the second half, “every sacrifice shall be salted with salt,” and the critical editions print only “every one shall be salted with fire.”

      The second half is the plainer. The law required salt with every offering ([[Lev. 2:13]]), salt being the natural symbol of what does not decay. The first half has been read two ways. An older reading, once the most widely received, takes the salting as a symbol only of perpetuation, so that the words assert the endlessness of punishment. The reading taken here makes fire the trial and discipline that purify, as in John the Baptist’s promise of a baptism “with the Holy Ghost, and with fire” ([[Matt. 3:11]]), and lets the two halves explain each other: every soul will be tested as by fire, and as the flesh of the altar sacrifices was salted against corruption, so the soul must receive the saving salt of the gospel. The sacrifice is then the offering each disciple makes of himself ([[Rom. 12:1]]), and the salt is what makes it acceptable. On salt as a sign of covenant, see the note on [[Matt. 5:13]].

      The last words of the chapter seem to return to where its teaching began, the quarrel on the road (verse 34): “Have salt in yourselves, and have peace one with another.” The purity from selfish aims that salt stands for would keep the peace among them.
    sources: [smith-marks-unique-contribution, greek-nt, ellicott-mark, talmage-jesus-christ-24]

christ: |
  Mark 9 shows Jesus Christ as the beloved Son whom the Father commands His disciples to hear, and in the same chapter as the Son of Man who will be handed over to be killed and will rise the third day. The glory on the mountain and the road to the cross belong to the same Lord. Below the mountain He answers a father whose faith is real but incomplete, and in the house He takes a child in His arms to show the Twelve that the first must be servant of all. He still answers a prayer like “Lord, I believe; help thou mine unbelief,” and a disciple who brings Him that prayer starts from the faith he has, not from pretending to faith he lacks. Greatness among His disciples is still measured as He measured it at Capernaum, by service.

explore: |
  - **The other tellings.** [[Matt. 17:1–23]] and [[Matt. 18:1–10]]; [[Luke 9:28–50]].
  - **Peter’s own witness of the mount.** [[2 Pet. 1:16–18]].
  - **The keys restored.** Peter, James and John in [[D&C 27:12–13]]; Moses, Elias and Elijah in the Kirtland Temple, [[D&C 110:11–16]].
  - **The Father introduces the Son.** [[3 Ne. 11:7]]; [[JS—H 1:17]]; and President Russell M. Nelson’s general conference address “Hear Him” (April 2020).
  - **The road between two blind men.** The third prediction of His death and the request of James and John, [[Mark 10:32–45]].

