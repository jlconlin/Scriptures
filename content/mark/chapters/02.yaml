chapter: 2
title: Who Can Forgive Sins but God Only?
tagline: Jesus forgives and heals a paralyzed man let down through a roof, calls Levi from the tax booth and eats with sinners, calls Himself the bridegroom, and declares that the Son of man is Lord of the Sabbath.
when: 'During Jesus’s ministry in Galilee; Mark gathers these controversies together, and a fifth follows in 3:1–6'

setting: |
  Mark tends to arrange his Gospel by kind of material rather than by date: miracles in chapter 1, parables in chapter 4, and here the first of his two collections of controversies, which runs from 2:1 to 3:6. The four stories of this chapter may not have happened in quick succession; Mark has set them side by side.

  Chapter 1 ended with Jesus unable to enter a city openly because of the crowds ([[Mark 1:45]]). “After some days” He is back in Capernaum, the fishing village that the Gospels treat as the home base of His Galilean ministry and the home of Peter, Andrew, James, John and Levi. Capernaum lay in the territory of Herod Antipas, at its border with the mostly Gentile realm of Herod Philip, and as a border town it had drawn officials of Antipas’s administration, toll collectors among them, like the Levi of this chapter’s second story.

  The opposition grows from scene to scene: scribes reasoning silently in their hearts, scribes and Pharisees questioning His disciples, critics asking Jesus Himself about fasting, Pharisees accusing His disciples to His face. In the next chapter the same Pharisees watch Him on the Sabbath and then, on the Sabbath, begin to plot His death ([[Mark 3:6]]). Matthew and Luke tell all four stories ([[Matt. 9:1–17]]; [[Matt. 12:1–8]]; [[Luke 5:17–6:5]]), but only Mark has “the sabbath was made for man.”

thread: |
  **Each story in Mark 2 turns on a question, and every answer is a claim about who Jesus is.**

  Mark’s questions are rarely requests for information; they mark a controversy, and a question meant to trap Jesus often ends up showing His wisdom. Here the scribes ask in their hearts, “who can forgive sins but God only?” The scribes and Pharisees ask why He eats with publicans and sinners. Others ask why His disciples do not fast, and the Pharisees ask why His disciples do what is not lawful on the Sabbath. Jesus answers with a healing, a proverb about a physician, a wedding, a story about David, and a saying about the Sabbath.

  The chapter is framed by its two uses of “the Son of man,” the title Jesus uses of Himself. The Son of man “hath power on earth to forgive sins” (verse 10), and the Son of man “is Lord also of the sabbath” (verse 28). Both verses belong to the title’s sense of honor and dignity, as head of the kingdom of God. Between them come the bridegroom, the new cloth and the new wine, and the sequence suggests that Jesus is bringing in a new order of the kingdom. The next chapter shows where the opposition to Him leads.

sections:
  - range: 1-12
    heading: The man let down through the roof
    plain: |
      Some days later Jesus came back to Capernaum, and word spread that He was at home. So many people gathered that there was no room left, not even around the door, and He was teaching them the word. Four men came carrying a paralyzed man. Because they could not get near Jesus through the crowd, they opened up the roof above where He was, dug through it, and lowered the mat the man was lying on. When Jesus saw their faith, He said to the paralyzed man, “Son, your sins are forgiven.”

      Some scribes sitting there thought to themselves, “Why does this man talk like this? He is blaspheming. Who can forgive sins except God alone?” Jesus knew at once in His spirit what they were thinking, and said, “Why are you thinking these things? Which is easier: to say to this paralyzed man, ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’? But so that you may know that the Son of Man has authority on earth to forgive sins”—He said to the paralyzed man—“I tell you, get up, pick up your mat, and go home.” At once the man got up, picked up the mat, and walked out in front of them all. Everyone was amazed and praised God, saying, “We have never seen anything like this.”
  - range: 13-17
    heading: The call of Levi
    plain: |
      Jesus went out again beside the sea, and the whole crowd came to Him, and He taught them. As He walked along He saw Levi the son of Alphaeus sitting at the tax booth, and said to him, “Follow me.” Levi got up and followed Him. Later, as Jesus was eating in his house, many tax collectors and sinners were eating with Him and His disciples, for many of them were following Him. When the scribes and Pharisees saw Him eating with sinners and tax collectors, they asked His disciples, “Why does He eat and drink with tax collectors and sinners?” Jesus heard it and said to them, “Those who are well do not need a doctor; the sick do. I did not come to call the righteous, but sinners to repentance.”
  - range: 18-22
    heading: The bridegroom, the patch and the wineskins
    plain: |
      John’s disciples and the Pharisees were fasting, and some people came and asked Jesus, “Why do John’s disciples and the Pharisees’ disciples fast, but your disciples do not?” Jesus answered, “Can the wedding guests fast while the bridegroom is with them? As long as they have the bridegroom with them, they cannot fast. But the time will come when the bridegroom will be taken away from them, and then, in those days, they will fast.

      “No one sews a patch of unshrunk cloth on an old garment; if he does, the new patch pulls away from the old cloth, and the tear gets worse. And no one pours new wine into old wineskins; if he does, the wine bursts the skins, the wine is spilled, and the skins are ruined. New wine goes into new wineskins.”
  - range: 23-28
    heading: Lord of the Sabbath
    plain: |
      One Sabbath Jesus was going through the grainfields, and as His disciples made their way they began to pick heads of grain. The Pharisees said to Him, “Look, why are they doing what is not lawful on the Sabbath?” He answered, “Have you never read what David did when he and his companions were hungry and in need? How he went into the house of God in the days of Abiathar the high priest, and ate the consecrated bread, which only the priests were allowed to eat, and gave some to his companions too?” Then He said to them, “The Sabbath was made for man, not man for the Sabbath. So the Son of Man is Lord even of the Sabbath.”

notes:
  - ref: 4
    phrase: they uncovered the roof where he was
    kind: history
    title: A roof they dug through
    body: |
      The four men dug their way through the roof, and the houses of Capernaum show how. Excavated houses there were modest single-story rooms around a shared courtyard, with walls of rough, unchiseled basalt fieldstones too weak to carry a second story or a heavy roof. The roofs were wood beams and reeds bound together with thick mud mortar, smoothed with stone rollers and left to dry, sturdy enough to work, sleep and store produce on. Courtyards often had crude stone stairs up to them.

      Mark’s Greek fits such a roof exactly. The men “removed the roof” and, “having dug through” it (the King James “broken it up”), opened a hole in the dried mud, straw and reeds large enough to let a man down on his mat. Excavators have observed that Mark’s details match an ordinary Capernaum home. The bearers were tearing open someone’s house to reach Jesus, and verse 5 calls what they did faith.
    sources: [grey-peter-capernaum]
  - ref: 5
    phrase: When Jesus saw their faith
    kind: christ
    title: Their faith, and forgiveness first
    body: |
      “Their faith” takes in the four men who carried him. Blocked at the door, they tried an unusual expedient, and it showed beyond mistaking that they trusted Jesus as One who could rebuke disease. He was moved by the faith and works of those who had labored to bring a helpless man before Him, and He doubtless knew the trust in the sufferer’s own heart as well.

      Why speak of sins to a man brought to be healed? The man was probably afraid, and he may have expected to hear only condemnation. In this man’s case there seems to have been a close connection between his past sins and his affliction, and Jesus, recognizing his repentance with his faith, forgave the sins before He touched the illness. That is not a rule that every illness comes from sin. Of a man born blind Jesus said later, “Neither hath this man sinned, nor his parents” ([[John 9:3]]).

      In Mark this man belongs to a group: the minor characters who turn to Jesus, like the woman with the issue of blood and blind Bartimaeus, tend to prove far better disciples than the Twelve whom Jesus chose. He says nothing in the story. He is carried in, forgiven, and walks out.
    sources: [talmage-jesus-christ-14, smith-marks-unique-contribution, lds-scriptures]
  - ref: 7
    phrase: who can forgive sins but God only?
    kind: christ
    title: Blasphemy, unless He was who He said
    body: |
      The scribes’ reasoning is sound as far as it goes. Blasphemy is contemptuous speech about God or about what stands in a sacred relation to Him, and under the law willful blasphemy was punished by stoning. Jesus was accused of it on several occasions, and in Mark this is the first: He claimed the right to forgive sins. Those charges would have been true if He had not actually been all that He said He was. So the scribes’ silent question puts the choice plainly. Either a man is taking to himself what belongs to God, or the God who forgives is standing in the house.

      Mark tells this argument as one of his “sandwiches,” a story set inside another so that the center is read in the light of what surrounds it. The dispute about the authority to forgive (verses 6–10) sits inside the story of the man who is forgiven (verses 1–5 and 11–12). The healing on the outside is the evidence for the claim on the inside.
    sources: [bd-blasphemy, smith-marks-unique-contribution]
  - ref: 10
    phrase: the Son of man hath power on earth to forgive sins
    kind: christ
    title: The Son of man has power on earth
    body: |
      Jesus’s question in verse 9 is an argument from the lesser to the greater. “Thy sins be forgiven thee” is the easier thing to say, because nothing outward can test it; only the sinner’s own heart can witness to its power. “Arise, and take up thy bed, and walk” challenges an immediate, visible result in front of everyone. So Jesus says the words that can be checked, to show that the words that could not be checked were true.

      This is the first time Mark uses “the Son of man.” It is the title Jesus uses of Himself, and no one else in the Gospels uses it of Him. It may echo the “one like the Son of man” to whom Daniel saw “dominion, and glory, and a kingdom” given ([[Dan. 7:13–14]]), though scholars dispute the connection. Jesus always speaks of the Son of man in the third person and never says outright that He is that figure, so that the hearer is left to make the connection. Latter-day revelation confirms how sacred the title is: “Man of Holiness is his name, and the name of his Only Begotten is the Son of Man” ([[Moses 6:57]]).
    sources: [ellicott-matthew, smith-marks-unique-contribution, bd-son-of-man]
  - ref: 14
    phrase: Levi the son of Alphæus sitting at the receipt of custom
    kind: history
    title: Levi at the tax booth
    body: |
      Levi is the apostle the First Gospel calls Matthew, “Matthew the publican” in its list of the Twelve ([[Matt. 9:9]]; [[Matt. 10:3]]); Levi was his name before his conversion. He probably collected for Herod Antipas, in whose territory Capernaum lay. Publicans leased the right to collect customs at a border from the ruler for a fixed sum and kept whatever they took in beyond it. Their living depended on what they could get from travelers, so they were commonly thought corrupt. The “receipt of custom” (in the footnote, “tax office”) may have been a small customs post near Capernaum’s harbor, taking tolls on fish and passing trade, but no such building from the first century has been found there, and its size and nature are uncertain.

      James the apostle is also called “the son of Alphæus” ([[Mark 3:18]]). The two fathers are treated as separate men of the same name, and Mark, who calls James and John brothers ([[Mark 1:19]]), never calls Levi and James brothers.

      Levi’s call is the second of three. Mark tells the call of the fishermen ([[Mark 1:16–20]]), then Levi’s, then the choosing of the Twelve ([[Mark 3:13–19]]), one of the many threefold patterns in his Gospel. Like the fishermen, Levi leaves his work at a word: “he arose and followed him.”
    sources: [bd-matthew, trotter-judea-province, grey-peter-capernaum, bd-alphaeus, smith-marks-unique-contribution]
  - ref: 16
    phrase: How is it that he eateth and drinketh with publicans and sinners?
    kind: history
    title: Why the meal offended
    body: |
      For the Pharisees a shared meal was a question of holiness, not of manners. They sought to bring the purity of the temple into their own homes, and to keep that holiness at the family table they could eat only with others who kept the same laws. That practice is called table fellowship, and tax collectors were specifically excluded from it. By eating with people who were ritually unclean, Jesus would also threaten the purity of any Pharisee who later received Him as a guest. Much of the Pharisees’ early opposition to Jesus arose over just such questions of food and table.

      Mark says only that the meal was “in his house” (verse 15); Luke makes it Levi’s house and a great feast ([[Luke 5:29]]). The critics put their question not to Jesus but to His disciples, and Jesus answers it Himself.
    sources: [lane-hostility, lds-scriptures]
  - ref: 17
    phrase: I came not to call the righteous, but sinners to repentance
    kind: scripture
    title: The whole and the sick
    body: |
      The scribes and Pharisees would have agreed with the first half of Jesus’s answer: of course the publicans and sinners were sick and needed a physician. They could count themselves among the whole, and the others as unworthy. The sting lies in what they could not see. To the extent that keeping the law becomes one’s ground of justification before God, admitting a flaw stops being an option, and what is left is to keep the law exactly and judge those who do not. One of the greatest challenges for the law-abiding is to recognize that they too sin.

      The Lord’s words to Mormon quote this verse and say who is whole: “the whole need no physician, but they that are sick; wherefore, little children are whole, for they are not capable of committing sin” ([[Moro. 8:8]]).
    sources: [lane-hostility, lds-scriptures]
  - ref: 18
    phrase: Why do the disciples of John and of the Pharisees fast
    kind: history
    title: Who fasted, and why
    body: |
      The law of Moses seems to have commanded only one fast, on the Day of Atonement. Others were added during the exile, and after the return fasting became a regular custom, a natural way of showing sorrow. A Pharisee in one of Jesus’s parables boasts, “I fast twice in the week” ([[Luke 18:12]]).

      The surprise is the company: John the Baptist’s disciples stand with the Pharisees. John was by now in prison ([[Mark 1:14]]). He had kept the law scrupulously, and his strict self-denial rivaled the Pharisees’ rigor. It may be that some of his followers, left without their leader and failing to see that the One he had testified of was among them, fell in with the Pharisees. Mark does not say who asked the question, only that “they come”; Matthew says it was John’s disciples ([[Matt. 9:14]]).
    sources: [bd-fasts, talmage-jesus-christ-14, lds-scriptures]
  - ref: 20
    phrase: the bridegroom shall be taken away from them
    kind: christ
    title: The bridegroom taken away
    body: |
      If fasting is a way of showing sorrow, then a wedding is no place for it, and Jesus calls Himself the bridegroom. For John’s disciples the image had a history. Their own teacher had called himself only “the friend of the bridegroom,” who rejoices to hear the bridegroom’s voice, and had told them plainly who the bridegroom was ([[John 3:29–30]]). Jesus’s answer may well have brought his words back to them.

      Then the joy turns. “The days will come, when the bridegroom shall be taken away from them” is the first hint in Mark of His coming death, long before the three plain prophecies of His suffering that Mark sets close together in chapters 8 to 10. Fasting is not done away: “then shall they fast in those days.” The saying is one of the Lord’s teachings on the value of fasting, and after He was taken away His Church fasted ([[Acts 13:2–3]]).
    sources: [talmage-jesus-christ-14, smith-marks-unique-contribution, bd-fasts, lds-scriptures]
  - ref: 22
    phrase: new wine must be put into new bottles
    kind: symbol
    title: Unshrunk cloth and new wineskins
    body: |
      Both images are about something new that the old cannot hold. The “new cloth” of verse 21 is, in the Greek, cloth not yet fulled, not yet put through the dressing that finished it (the footnote: “unshrunken or unsized”). Sewn onto an old garment, the new piece pulls away from the old, and the tear gets worse. The “bottles” were wineskins, leather bags for water or wine, and new wine bursts old skins, so that wine and skin are lost together.

      In Joseph Smith’s translation of Matthew, these sayings follow an exchange with Pharisees who ask to be received with their own baptism, and Jesus answers, “when that which is new is come, the old is ready to be put away” (JST Matt. 9:21; the note on [[Matt. 9:16]] gives the exchange). In Mark the sayings point forward. Here two disputes about food stand back to back, the fasting and the grain, and the declaration that ends the chapter, that the Son of man is Lord of the Sabbath, is just such new wine for a new bottle.
    sources: [thayer, lds-scriptures, jst-matt-9, lane-sabbath-synoptic]
  - ref: 23
    phrase: his disciples began, as they went, to pluck the ears of corn
    kind: history
    title: Why plucking grain was unlawful
    body: |
      “Corn” in the King James is grain, and the law let anyone passing through a neighbor’s field pick ears by hand, so long as he did not put a sickle to it ([[Deut. 23:25]]). The objection was the day. The Pharisees counted plucking as reaping, and the law said, “in earing time and in harvest thou shalt rest” ([[Ex. 34:21]]). That plucking was not permitted on the Sabbath would have been the common Jewish view of the time, not a strict rule peculiar to the Pharisees.

      Mark tells the scene differently from Matthew and Luke. He does not say the disciples were hungry or that they ate, and his Greek reads literally that the disciples “began to make a way, plucking the ears.” Mark may mean the phrase to recall the voice in the wilderness at the opening of his Gospel, “Prepare ye the way of the Lord, make his paths straight” ([[Mark 1:3]]): Isaiah’s words describe the followers of a king preparing his way.
    sources: [lane-sabbath-synoptic, lds-scriptures]
  - ref: 25
    phrase: Have ye never read what David did
    kind: scripture
    title: What David did
    body: |
      Jesus’s answer does not argue the Sabbath law at all. He points to a precedent: David, fleeing Saul, was given the consecrated bread from the house of God, which only priests could eat ([[1 Sam. 21:1–6]]). David had the authority to eat what would otherwise have been forbidden, and to give it to the men with him (verse 26). Jesus invokes that same kingly authority over what His own companions do. He does not say the Sabbath commandment is done away; what Mark shows is a King with David’s authority to sanction His disciples’ actions.

      The precedent may reach the Sabbath after all. The shewbread was set out fresh each Sabbath, and the old loaves were then eaten by the priests ([[Lev. 24:8–9]]), so David may have been doing on a Sabbath what the priests did. If so, the story hints at Jesus’s lordship as both king and priest.
    sources: [lane-sabbath-synoptic, lds-scriptures]
  - ref: 26
    phrase: in the days of Abiathar the high priest
    kind: history
    title: Abiathar or Ahimelech?
    body: |
      Mark alone names the high priest, and the name raises a difficulty. In the account in 1 Samuel the priest who gave David the bread at Nob is Ahimelech ([[1 Sam. 21:1]]). Abiathar was his son, the one priest who escaped when Saul had the priests of Nob killed; he joined David and acted as high priest until Solomon thrust him out ([[1 Sam. 22:20]]; [[1 Kgs. 2:26–27]]).

      The two names are tangled elsewhere in the Old Testament too: Ahimelech and Abiathar have probably been interchanged in [[2 Sam. 8:17]] and in Chronicles. Two explanations of Mark’s wording have been suggested, and neither can be proved: that the better-known name of the two was given, Abiathar being at the sanctuary that day though not yet high priest; or that he was already serving beside his father, as Eli’s sons seem to have served beside Eli.
    sources: [ellicott-mark, bd-abiathar, lds-scriptures]
  - ref: 27
    phrase: The sabbath was made for man, and not man for the sabbath
    kind: scripture
    title: The sabbath was made for man
    body: |
      Only Mark records this saying. It makes the Sabbath the servant of human beings and not their master, a thought that also appears in a rabbinic saying from the late second century. Jesus’s critics had missed what the day was for. It was given to give people rest from their troubles, and so, as the next chapter shows, there could hardly be a more fitting day to heal ([[Mark 3:1–5]]). The saying does not make mercy a new rule that replaces the Sabbath and its boundaries; it shows what kind of Lord the Sabbath has.

      The Joseph Smith Translation states the purpose in full: “the Sabbath was given unto man for a day of rest; and also that man should glorify God, and not that man should not eat” (JST Mark 2:26). The day is for rest and for worship, and it was never meant to keep hungry disciples from eating.
    sources: [lane-sabbath-synoptic, easton-marcan-christology, jst-mark-2]
  - ref: 28
    phrase: the Son of man is Lord also of the sabbath
    kind: christ
    title: The Lord who made the Sabbath
    body: |
      Read after verse 27, “Therefore the Son of man is Lord also of the sabbath” could be heard as speaking of any human being, since in the Old Testament “son of man” often means simply “a man.” The Joseph Smith Translation gives a reason that no ordinary man could share: “For the Son of man made the Sabbath day, therefore the Son of man is Lord also of the Sabbath” (JST Mark 2:27). In calling the Son of man the maker of the Sabbath, the translation makes the title a claim to divinity. Yet it keeps Jesus speaking of Himself in the third person, as He does throughout Mark; in Joseph Smith’s Mark Jesus never openly declares His own divinity.

      The chapter that began with a question about who can forgive sins but God ends with the One who made the Sabbath standing in a grainfield, answering for His disciples. The Pharisees do not answer Him. In the next scene they watch to see whether He will heal on the Sabbath ([[Mark 3:2]]).
    sources: [jst-mark-2, lefevre-christology-jst, bd-son-of-man]

christ: |
  Mark 2 shows Jesus Christ claiming and doing what belongs to God: He forgives sins and proves it with a healing anyone could see, He calls Himself the bridegroom whose going away will bring the fast, and He is Lord of the Sabbath because He made it (JST Mark 2:27). The same Lord forgives now: “he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more” ([[D&C 58:42]]). The day He made is still His gift, “a day appointed unto you to rest from your labors, and to pay thy devotions unto the Most High” ([[D&C 59:10]]), and a disciple’s conduct and attitude on it are a sign between that disciple and the Father.

explore: |
  - **The other tellings.** [[Matt. 9:1–17]] and [[Luke 5:17–39]] for the paralyzed man, Levi and the fasting question; [[Matt. 12:1–8]] and [[Luke 6:1–5]] for the grainfield, where Matthew adds the priests in the temple and “one greater than the temple.”
  - **The fifth controversy.** [[Mark 3:1–6]], the withered hand healed on the Sabbath, which closes the series Mark 2 begins.
  - **The Sabbath in latter-day revelation.** [[D&C 59:9–19]], the Lord’s instructions for keeping His holy day.

