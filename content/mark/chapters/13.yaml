chapter: 13
title: Take Heed, and Watch
tagline: Leaving the temple for the last time, Jesus foretells its fall; on the Mount of Olives He answers four disciples with warnings of deceivers, persecution and the abomination of desolation, the Son of Man coming in the clouds, and the porter told to watch.
when: 'On the Mount of Olives, facing the temple, in the last week of Jesus’s ministry'

setting: |
  Mark 13 comes in the last week of Jesus’s ministry. Since His entry into Jerusalem He has been “daily” in the temple teaching ([[Mark 14:49]]); there the chief priests, scribes and elders challenged His authority ([[Mark 11:27–33]]), and there He has just praised the widow’s two mites ([[Mark 12:41–44]]). Now He leaves the temple for the last time. Mark never brings Him back to it; after this the temple returns only in His words at His arrest, in the charges at His trial and at the cross, and in the veil torn when He died ([[Mark 15:38]]). The chapter is one of only two long discourses in a Gospel otherwise made of deeds and short sayings; the other is the parables of [[Mark 4]].

  Matthew and Luke tell the same sermon ([[Matt. 24]]; [[Luke 21:5–36]]). Mark’s is shorter than Matthew’s: it has nothing of the love of many waxing cold, the carcase and the eagles, or the days of Noah, and it alone has the porter told to watch (verses 34–35). Many scholars think Mark wrote for the Saints at Rome in the hard years under Nero, and the chapter speaks plainly about what discipleship costs.

  Joseph Smith did not revise Mark 13 on its own. Probably near December 1831 he and Sidney Rigdon copied the revised text of Matthew 24 into its place, so [[JS—M 1]] stands for this chapter too, though later revisions mean the two are not quite identical. The site’s fuller notes on the discourse as revealed through him are there; the notes here answer the reader of Mark and point there where the two meet.

thread: |
  **“Take heed.”** The disciples ask when the temple will fall, and Jesus never gives them a date. He gives them four commands instead, each beginning “take heed” (verses 5, 9, 23, 33). Take heed of deceivers who come in His name. Take heed to yourselves, for you will be delivered up as He will be. Take heed in the crisis, for false Christs will come with signs. And take heed, watch and pray, for no one knows the hour.

  The temple’s fall is the occasion, and discipleship is the lesson: what it means to follow Him, what it costs, and what there is to hope for. The hope stands in the middle of the chapter, the Son of Man coming “with great power and glory” to gather His elect (verses 26–27). Then the language turns from “those days” to “that day and that hour” (verse 32), which no one knows. So the chapter ends on readiness rather than a timetable. A man leaves his house in his servants’ care, “to every man his work,” and the porter keeps watch at the door. The command that closes the sermon was given to four men on a hillside and is meant for every reader: “What I say unto you I say unto all, Watch.”

sections:
  - range: 1-4
    heading: The temple’s fall foretold, and the disciples’ question
    plain: |
      As Jesus was leaving the temple, one of His disciples said to Him, “Teacher, look at these stones, and these buildings!” Jesus answered, “Do you see these great buildings? Not one stone will be left here on another; every one will be thrown down.” Later, as He sat on the Mount of Olives facing the temple, Peter, James, John and Andrew asked Him privately, “Tell us, when will this happen? And what will be the sign that all these things are about to be fulfilled?”
  - range: 5-8
    heading: Deceivers, wars, and the first pains
    plain: |
      Jesus began to answer them: “Be on your guard, so that no one deceives you. Many will come in My name, saying, ‘I am He,’ and will deceive many. When you hear of wars and rumors of wars, do not be alarmed. These things must happen, but the end is not yet. Nation will rise against nation and kingdom against kingdom; there will be earthquakes in many places, and famines and turmoil. These are only the first pains of labor.”
  - range: 9-13
    heading: Delivered up, and the gospel to all nations
    plain: |
      “Watch out for yourselves. They will hand you over to councils, and you will be beaten in the synagogues; you will be brought before governors and kings for My sake, as a testimony against them. And the gospel must first be preached to all nations. When they arrest you and hand you over, do not worry beforehand about what you will say, and do not plan it. Say whatever is given you in that hour, for it is not you who speak, but the Holy Ghost. Brother will betray brother to death, and a father his child; children will rise against their parents and have them put to death. Everyone will hate you because of My name. But whoever endures to the end will be saved.”
  - range: 14-23
    heading: The abomination of desolation and the flight from Judea
    plain: |
      “But when you see the abomination of desolation that Daniel the prophet spoke of standing where it ought not to be (let the reader understand), then those in Judea must flee to the mountains. Whoever is on the housetop must not go down into the house to take anything out, and whoever is in the field must not turn back for his coat. How hard it will be in those days for women who are pregnant or nursing! Pray that it may not come in winter. For in those days there will be such distress as has not been from the beginning of the creation God made until now, and never will be again. If the Lord had not shortened those days, no one would survive; but for the sake of the elect, whom He has chosen, He has shortened them. And then if anyone says to you, ‘Look, here is the Christ,’ or ‘Look, there He is,’ do not believe it. False Christs and false prophets will arise and show signs and wonders to lead astray, if it were possible, even the elect. So be on your guard; I have told you everything beforehand.”
  - range: 24-27
    heading: The Son of Man coming in the clouds
    plain: |
      “But in those days, after that distress, the sun will be darkened and the moon will not give its light; the stars will fall from the sky, and the powers in the heavens will be shaken. Then they will see the Son of Man coming in the clouds with great power and glory. And He will send His angels and gather His elect from the four winds, from the farthest part of the earth to the farthest part of heaven.”
  - range: 28-31
    heading: The fig tree, and words that will not pass away
    plain: |
      “Learn this lesson from the fig tree. When its branch becomes tender and puts out leaves, you know that summer is near. In the same way, when you see these things happening, you know that it is near, right at the door. I tell you truly, this generation will not pass away until all these things have happened. Heaven and earth will pass away, but My words will not pass away.”
  - range: 32-37
    heading: The hour no one knows, and the porter told to watch
    plain: |
      “But of that day and that hour no one knows, not the angels in heaven, nor the Son, but only the Father. Be on your guard; keep awake and pray, for you do not know when the time will come. It is like a man going on a long journey. He leaves his house and puts his servants in charge, each with his own work, and commands the doorkeeper to keep watch. So keep watch, for you do not know when the master of the house will come, in the evening, at midnight, at cockcrow, or at dawn. If he comes suddenly, do not let him find you sleeping. What I say to you, I say to everyone: Watch.”

notes:
  - ref: 1
    phrase: see what manner of stones and what buildings are here!
    kind: history
    title: Great stones, just after the widow’s mites
    body: |
      The disciple’s wonder at the temple’s stones was natural, and Mark sets it directly after the widow’s two mites. Herod the Great’s expansion of the temple and its courts was counted a masterpiece of building; by the time Jesus began His ministry the work had gone on for more than forty-six years ([[John 2:20]]), and it would not be finished until a few years before the Romans destroyed it. The temple was the crowning jewel of the people’s religion and the center of its worship, so Jesus’s answer struck at the heart of it.

      The placing of the two stories side by side may be meant to give each its point. The widow cast in “all that she had” ([[Mark 12:44]]); the disciples, just shown that her two mites outweighed the rich men’s gifts, may still have been measuring by size, admiring the stones more than the mite. Of the stones Jesus says that every one would be thrown down.

      They were, in A.D. 70, during the Jewish revolt against Rome, when fire was set to the temple gates and the sanctuary itself was destroyed. Joseph Smith’s translation aims the prophecy at the sanctuary, “upon this temple”; the note at [[JS—M 1:3]] explains it.
    sources: [strathearn-olivet-mark, ellicott-mark, ludlow-first-jewish-revolt]
  - ref: 3
    phrase: as he sat upon the mount of Olives over against the temple
    kind: symbol
    title: Over against the temple
    body: |
      Only Mark says that Jesus sat “over against the temple,” facing it, and the view from the hillside made everything He went on to say about its fall the more vivid. Jesus has walked out of the temple for the last time. One Latter-day Saint reading sees in His leaving a quiet echo of Ezekiel’s vision, in which the glory of the Lord departed from the temple and “stood upon the mountain which is on the east side of the city” ([[Ezek. 11:23]]). On that reading, once He had withdrawn, the buildings the disciples admired were a hollow shell of what God had meant them to be.

      Mark also names the four who asked. Peter, James and John were the inner circle at other times ([[Mark 5:37]]; [[Mark 9:2]]; [[Mark 14:33]]); this is the only time Andrew, Peter’s brother and the first called with him ([[Mark 1:16]]), is named with them.
    sources: [ellicott-mark, strathearn-olivet-mark]
  - ref: 4
    phrase: what shall be the sign when all these things shall be fulfilled?
    kind: structure
    title: Two questions, both about the temple
    body: |
      In Matthew the disciples ask two different things, when the temple will fall and what will be “the sign of thy coming, and of the end of the world” ([[Matt. 24:3]]). In Mark both questions are about the temple: when will it happen, and what sign will show it is about to be fulfilled? The Second Coming does come into the answer, toward the end, but in Mark it takes second place to the temple’s fall.

      That makes the answer hard to sort. Because both point to the temple, Mark’s questions are less distinct than Matthew’s, and in all three Gospels Jesus’s words can be read as answering both at once, so a reader cannot always tell which sign belongs to Jerusalem’s fall and which to His coming, or whether the two were meant to be far apart. Joseph Smith’s translation, which stands in place of this chapter, settles it: the disciples ask about “the destruction of the temple, and the Jews” and about His coming ([[JS—M 1:4]]), and the Lord answers the first question and then the second, so that the prophecies of the two events mirror one another. The note at [[JS—M 1:4]] explains how.
    sources: [strathearn-olivet-mark, jackson-sign-thy-coming, lds-scriptures]
  - ref: 5
    phrase: Take heed lest any man deceive you
    kind: structure
    title: 'Take heed: four commands'
    body: |
      Jesus does not answer “when.” His first words are a warning, and the same words, “take heed,” open each part of His answer (verses 5, 9, 23 and 33). The Greek verb is the ordinary one for “see,” given as a command rather than as sage advice: disciples who want to come through must keep their eyes open.

      The first danger is deception. In Greek the deceivers of verse 6 say only “I am”; the word “Christ” is not in the Greek text. In the first century a number of men did proclaim themselves deliverers from Rome and gathered large followings that came to nothing. More broadly, a false Christ is any figure or institution that sets itself up as a source of salvation other than Christ or His Church.
    sources: [strathearn-olivet-mark, greek-nt]
  - ref: 8
    phrase: these are the beginnings of sorrows
    kind: words
    title: The first pains of labor
    body: |
      The “sorrows” are birth pains. The Greek word means the pangs of childbirth, and in the plural it was used of the calamities that the Jews of the time expected to come before the Messiah. Wars, earthquakes and famines are only the first contractions: they must come, but “the end shall not be yet” (verse 7).

      That is why Jesus says “be ye not troubled.” Not every war or disaster is a sign that the end has arrived; such things belong to mortal life. Joseph Smith’s translation moves the wars, famines and earthquakes from early in the sermon to its second half, which gives them a last-days setting; the note at [[JS—M 1:29]] sets out the change.
    sources: [thayer, strathearn-olivet-mark, jackson-sign-thy-coming]
  - ref: 9
    phrase: they shall deliver you up to councils
    kind: words
    title: Delivered up
    body: |
      “Deliver you up” is the Greek *paradidōmi*, to hand over, and Mark uses it throughout his Gospel for the fate of those who preach. John the Baptist preached and was “put in prison,” literally handed over ([[Mark 1:14]]). Judas “betrayed” Jesus ([[Mark 3:19]]), the same word, and Jesus Himself foretold that He would be “delivered” into the hands of men ([[Mark 9:31]]; [[Mark 10:33]]). Now He tells His disciples that they too, as they preach the gospel to all nations (verse 10), will be delivered up to councils, and that brother will “betray,” hand over, brother to death (verse 12). The English hides a thread that the Greek makes plain: the disciple who preaches will follow John and Jesus along the same road.

      The road does not end there. In Mark, Jesus’s being handed over is the prelude to His glory, and the disciples handed over in their turn can hold to the hope that He will return in glory and vindicate them.
    sources: [strathearn-olivet-mark]
  - ref: 11
    phrase: take no thought beforehand what ye shall speak
    kind: words
    title: Take no thought
    body: |
      Jesus is not forbidding His disciples to think. In 1611 “thought” meant anxious care, and the sense is that they are not to be anxious beforehand about what to say when they are arrested. The words that matter in that hour will be given, “for it is not ye that speak, but the Holy Ghost.”

      Matthew gives the same promise in Jesus’s charge to the Twelve when He first sent them out ([[Matt. 10:19–20]]). Mark sets it here, among the warnings that the disciples will be delivered up (verses 9 and 12).
    sources: [cambridge-mark]
  - ref: 14
    phrase: standing where it ought not, (let him that readeth understand,)
    kind: scripture
    title: Standing where it ought not
    body: |
      Matthew says the abomination will stand “in the holy place” ([[Matt. 24:15]]); Mark says only “where it ought not,” a more cryptic phrase that seems the likelier of the two to be the one Jesus used. Daniel had foretold “the abomination that maketh desolate” ([[Dan. 11:31]]). Its first fulfillment is read as the Roman legions under Titus, who besieged Jerusalem in A.D. 70: on that reading the horror was the Roman army, and a horror because of the desolation it brought. Luke’s account names the sign plainly, “Jerusalem compassed with armies” ([[Luke 21:20]]). Joseph Smith’s translation gives the prophecy a second fulfillment in the last days, when Jerusalem will again be under siege ([[JS—M 1:32]]); the note at [[JS—M 1:12]] explains the rest.

      The words in parentheses speak to someone reading, not hearing. One possibility is that they direct whoever read the Gospel aloud in a congregation to explain the meaning to those listening, since it was a matter of life and death to know when to flee. Whatever their first purpose, the message of the chapter is for all who read it, not only for the four who heard it.
    sources: [ellicott-mark, egt-mark, bd-abomination-of-desolation, strathearn-olivet-mark]
  - ref: 27
    phrase: gather together his elect from the four winds
    kind: christ
    title: Gathered from the four winds
    body: |
      The signs in the heavens lead to the Son of Man Himself, “coming in the clouds with great power and glory” (verse 26), and modern revelation reads that coming as His Second Coming ([[D&C 45:44]]). Joseph Smith’s translation joins a promise to it, “whoso treasureth up my word, shall not be deceived,” and calls those gathered “the remainder of his elect” ([[JS—M 1:37]]); the note at [[JS—M 1:22]] explains who the elect are.
    sources: [strathearn-olivet-mark, lds-scriptures]
  - ref: 30
    phrase: this generation shall not pass, till all these things be done
    kind: words
    title: Which generation
    body: |
      Read as the disciples’ own generation, the verse seems to promise that everything in the chapter would happen in their lifetime. For Jerusalem it did: the prophecies of the city’s overthrow were literally fulfilled within the natural lifetime of several of the apostles. For the signs of His coming, the generation may be understood as the one that sees them begin to be fulfilled. Joseph Smith’s translation writes that reading into the verse, “this generation, in which these things shall be shown forth” ([[JS—M 1:34]]), and the note there sets it beside the two generations of [[D&C 45:21]] and [[D&C 45:30]].
    sources: [talmage-jesus-christ-32, lds-scriptures]
  - ref: 32
    phrase: neither the Son, but the Father
    kind: christ
    title: Not even the Son
    body: |
      Until now Jesus has spoken of “those days” (verses 17, 19, 24). Here the words turn to the singular, “that day and that hour,” the day of His coming. Of that day, He says, no one knows, not the angels, “neither the Son, but the Father.” Matthew’s account in the King James text has no “neither the Son”; it reads “but my Father only” ([[Matt. 24:36]]), and so does Joseph Smith’s translation ([[JS—M 1:40]]), which stands in place of Mark 13. The Lord said the same in this dispensation: “the hour and the day no man knoweth, neither the angels in heaven, nor shall they know until he comes” ([[D&C 49:7]]).

      In one Latter-day Saint reading the words mean what they say. While in the flesh Jesus claimed no omniscience; whatever He willed to know He learned by communion with the Father, and He had not asked to know what the Father had not chosen to reveal, the day and hour of His own return in glory.
    sources: [strathearn-olivet-mark, jackson-jst-new-testament, talmage-jesus-christ-32]
  - ref: 34
    phrase: commanded the porter to watch
    kind: symbol
    title: The porter told to watch
    body: |
      Of the three tellings of the sermon, only Mark’s has this small parable, and a porter, a doorkeeper, appears in no other parable of Jesus. The master leaves his authority with his servants, “to every man his work,” and gives one servant one task above the rest: to keep watch at the door. The four times in verse 35, evening, midnight, cockcrowing and morning, are roughly the four watches into which the night was divided, so the master may come at any hour of it.

      The text does not say whom the porter stands for. Peter has been suggested, since the keys of the kingdom had been promised to him ([[Matt. 16:19]]) and his work would be to keep the door ready for his Lord’s coming; it is only a suggestion. What is plain is the weight the chapter puts on the command to watch, and in the next chapter Jesus finds Peter asleep in Gethsemane: “Simon, sleepest thou? couldest not thou watch one hour?” ([[Mark 14:37]]). On one reading, a Gospel written by tradition under Peter’s eye seems to want its reader to notice that, for all the warnings, Peter himself failed to watch.
    sources: [ellicott-mark, egt-mark, cambridge-mark]
  - ref: 37
    phrase: what I say unto you I say unto all, Watch
    kind: scripture
    title: Watch, said unto all
    body: |
      The sermon was given privately to four men (verse 3), and its last word opens it to everyone: “what I say unto you I say unto all.” The Greek verb for “watch” means to stay awake, to be vigilant, and its opposite is the sleep of verse 36. Scripture often sets sleeping against watching in just this figurative way.

      The risen Lord gave the same charge to the Nephites, with the reason: “ye must watch and pray always, lest ye be tempted by the devil, and ye be led away captive by him” ([[3 Ne. 18:15]]).
    sources: [strathearn-olivet-mark, sc-knowhy-344]

christ: |
  Every warning in Mark 13 leads to one sight: “the Son of man coming in the clouds with great power and glory,” sending His angels to gather His elect (verses 26–27). His word holds when everything else gives way, “Heaven and earth shall pass away: but my words shall not pass away” (verse 31), and until He comes He has left His house in His servants’ care, “to every man his work” (verse 34).

  To watch, for a disciple now, is to stay awake and vigilant, steering clear of evil and keeping ready for His return, each at the work He has left in His servants’ care.

explore: |
  - **The sermon as Joseph Smith revised it.** [[JS—M 1]], which stands in place of Mark 13 in his translation, with the site’s fuller notes on the discourse.
  - **The other tellings.** [[Matt. 24]]; [[Luke 21:5–36]].
  - **The same sermon in modern revelation.** [[D&C 45:16–75]].
  - **Watching, and failing to watch.** Gethsemane, where the three who heard this sermon fall asleep, [[Mark 14:32–42]].
  - **Discipleship in Mark 13.** “Discipleship in the Olivet Discourse in Mark’s Gospel” (Religious Studies Center) reads the chapter through its four commands to take heed.

