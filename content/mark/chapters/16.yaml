chapter: 16
title: He Is Not Here
tagline: Three women find the tomb open and a young man in white sends word to the disciples and Peter; the risen Lord appears to Mary Magdalene, to two on the road and to the eleven, sends them into all the world with the promise of signs, and is received up into heaven.
when: 'At the tomb outside Jerusalem, at sunrise on the first day of the week after the Crucifixion, and in the appearances that followed until the Lord was received up into heaven'

setting: |
  Mark 16 follows straight on from the burial. Joseph of Arimathea laid Jesus’s body in a tomb hewn out of rock and rolled a stone against its door on the day before the Sabbath, and two of the women saw where He was laid ([[Mark 15:42–47]]). The chapter opens when the Sabbath is past, at sunrise on the first day of the week, and moves from the empty tomb to the appearances of the risen Lord, His commission to the eleven, and His being received up into heaven.

  Every Gospel tells of the women at the empty tomb ([[Matt. 28:1–8]]; [[Luke 24:1–12]]; [[John 20:1–10]]). The appearances that verses 9–20 sum up in a sentence or two are told more fully elsewhere: to Mary Magdalene in [[John 20:11–18]], to two disciples on the road to Emmaus in [[Luke 24:13–35]], and to the eleven, with the Ascension, in [[Luke 24:36–53]] and [[Acts 1:1–11]].

  The chapter carries a question of its own. The oldest and most reliable Greek manuscripts of Mark end at verse 8, and Latter-day Saint scholars differ on whether Mark wrote the twelve verses that follow. The Church’s edition prints them as scripture, and the Lord gave the same commission and the same promise of signs to the Nephite disciples and to the elders of this dispensation ([[Morm. 9:22–25]]; [[D&C 68:8–10]]; [[D&C 84:64–73]]). The note on verse 9 sets out the evidence.

thread: |
  **From silence to every where.** Mark’s account of the tomb ends with the women fleeing and saying nothing to anyone, “for they were afraid” (verse 8). By then the disciples who followed Him through the Gospel have failed one after another: the Twelve fled when Jesus was arrested, Peter denied Him, and now even the women who stayed through the Crucifixion are silent. Yet the message they carry away is a message of restoration. The risen Lord goes before His disciples into Galilee, where their ministry began, and the young man names Peter in particular; the women too will be restored. The young man himself, sitting in white in the tomb, may be a picture of it, the disciple who fled naked from Gethsemane now restored and glorified.

  The verses that follow carry the story from that silence to its answer. The witnesses tell what they have seen and are not believed, until the Lord appears to the eleven, rebukes their unbelief, and sends those same doubting men into all the world. A chapter that begins with women who said nothing ends with apostles who “preached every where, the Lord working with them” (verse 20).

sections:
  - range: 1-8
    heading: The empty tomb
    plain: |
      When the Sabbath was over, Mary Magdalene, Mary the mother of James, and Salome bought spices so that they could go and anoint Jesus’s body. Very early on the first day of the week, at sunrise, they came to the tomb. They were saying to one another, “Who will roll the stone away from the door of the tomb for us?” But when they looked up, they saw that the stone had already been rolled back, and it was a very large stone. Going into the tomb, they saw a young man sitting on the right side, dressed in a long white robe, and they were alarmed. He said to them, “Do not be alarmed. You are looking for Jesus of Nazareth, who was crucified. He has been raised; He is not here. Look, here is the place where they laid Him. But go, tell His disciples, and Peter, that He is going ahead of you into Galilee. There you will see Him, just as He told you.” They went out and fled from the tomb, for trembling and amazement had seized them. They said nothing to anyone, because they were afraid.
  - range: 9-11
    heading: He appears to Mary Magdalene
    plain: |
      When Jesus had risen early on the first day of the week, He appeared first to Mary Magdalene, from whom He had cast out seven devils. She went and told those who had been with Him, as they mourned and wept. But when they heard that He was alive and that she had seen Him, they did not believe it.
  - range: 12-13
    heading: Two on the road
    plain: |
      After that He appeared in a different form to two of them as they were walking on their way into the country. They went back and told the rest, but they did not believe them either.
  - range: 14-18
    heading: The commission to the eleven
    plain: |
      Later He appeared to the eleven themselves as they sat at a meal, and He rebuked them for their unbelief and the hardness of their hearts, because they had not believed those who had seen Him after He was risen. And He said to them, “Go into all the world and preach the gospel to the whole creation. Whoever believes and is baptized will be saved, but whoever does not believe will be condemned. And these signs will follow those who believe: in My name they will cast out devils; they will speak with new tongues; they will take up serpents, and if they drink anything deadly, it will not hurt them; they will lay their hands on the sick, and the sick will recover.”
  - range: 19-20
    heading: Received up into heaven
    plain: |
      So after the Lord had spoken to them, He was taken up into heaven and sat at the right hand of God. And they went out and preached everywhere, the Lord working with them and confirming the word by the signs that followed. Amen.

notes:
  - ref: 1
    phrase: had bought sweet spices, that they might come and anoint him
    kind: history
    title: Spices for a hurried burial
    body: |
      The women came to finish what the Sabbath had cut short. Jesus died in the afternoon of the day before the Sabbath, and Joseph of Arimathea and Nicodemus had to wrap His body with spices and lay it in the tomb in haste, just before the Sabbath began ([[John 19:38–42]]). Some of the women had watched that burial, and they now brought spices of their own for a fuller anointing. They bought them as soon as they could, when the Sabbath ended shortly after sunset on Saturday, and came at first light on Sunday.

      They are the same three women Mark named at the cross, watching from a distance ([[Mark 15:40–41]]), and the two Marys had seen where the body was laid ([[Mark 15:47]]). They were witnesses of His death and burial as well as of the open tomb, and they knew it was the right tomb they found empty.
    sources: [talmage-jesus-christ-37, huntsman-easter-sunday]
  - ref: 3
    phrase: Who shall roll us away the stone from the door of the sepulchre?
    kind: history
    title: Who shall roll us away the stone?
    body: |
      Only Mark tells that the women, on their way, asked one another who would roll the stone back for them. They had seen Joseph roll it against the door ([[Mark 15:46–47]]), but the difficulty seems to have struck them only as they walked, and they evidently knew nothing of the seal and the guard of soldiers that Matthew tells of ([[Matt. 27:62–66]]). Mark’s Greek reads literally “they were saying” to one another, the words on the point of rising to their lips as they looked up and saw the stone already rolled back. It is the kind of detail that heightened the drama when the Gospel was heard read aloud, as Mark’s first audience most likely heard it in one sitting, and that the other evangelists, writing for readers, may have thought unnecessary.

      “For it was very great” is most naturally read as Mark’s explanation of why he says the stone was “rolled away” rather than simply moved, though it has also been taken as the reason for the women’s question. It was not rolled back to let the risen Lord out. It was rolled back so that those who came could see for themselves that His body was no longer there.
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-37, ellicott-mark]
  - ref: 5
    phrase: a young man sitting on the right side, clothed in a long white garment
    kind: symbol
    title: The young man in white
    body: |
      Mark’s messenger is “a young man.” Matthew calls him “the angel of the Lord” ([[Matt. 28:2]]), Luke has “two men … in shining garments” ([[Luke 24:4]]), and Joseph Smith’s translation of Mark reads “two angels sitting thereon,” on the stone, “clothed in long white garments” (JST Mark 16:3). His appearance and the women’s fear have convinced many commentators that he was an angel.

      Mark’s wording also allows a reading of its own. He uses the Greek *neaniskos*, “young man,” only here and for the young man who fled naked from Gethsemane, leaving his linen cloth in the hands of those who seized him ([[Mark 14:51–52]]); and only here and at the Transfiguration does Mark describe clothing as white ([[Mark 9:3]]). Mark’s first audience would almost certainly have linked the two young men. Read together, the scenes can suggest a disciple who ran away in shame now seated in glory as the messenger of the Resurrection, and Jesus, crucified without clothing, as symbolically taking that shame upon Himself. On this reading the young man is the pattern of the disciple who failed and was restored; and even if he was an angel, those who hear the Gospel are meant to see themselves in him, redeemed and sent to spread the good news. It is a literary reading, and Mark never says who the young man was (see the note on [[Mark 14:51]]).
    sources: [jst-mark-16, huntsman-easter-sunday, smith-resurrection]
  - ref: 6
    phrase: 'Ye seek Jesus of Nazareth, which was crucified: he is risen'
    kind: christ
    title: He is risen
    body: |
      The announcement is given plainly and left to stand on its own; the young man neither elaborates it nor explains it. The Greek verb, *ēgerthē*, is passive, “he has been raised,” and may suggest that Jesus, crucified by men, has been raised by God. Matthew, Mark and Luke tend to stress that God raised Him; John stresses that Jesus Himself laid down His life and took it again ([[John 10:17–18]]).

      The name the young man uses is the plainest Jesus has in Mark. “Jesus” was the commonest man’s name of the time and place, and “of Nazareth” only told Him apart from others: it is almost an anti-title. At this moment a hearer might have expected one of the great titles, Christ or Son of God. Instead the young man names Him by His home town and by the death He died, “which was crucified,” and then says that He is risen.
    sources: [smith-resurrection, huntsman-easter-sunday, smith-marks-unique-contribution]
  - ref: 7
    phrase: tell his disciples and Peter
    kind: christ
    title: And Peter
    body: |
      Only Mark’s messenger names Peter; in Matthew the women are told only to “tell his disciples” ([[Matt. 28:7]]). Peter has just denied three times that he knew Jesus ([[Mark 14:66–72]]), and naming him apart from the others may hint at how far the denial had set him apart. But the words imply an invitation: he too is to follow Jesus to Galilee and return to full fellowship. To name Peter is an act of mercy, making plain that the invitation reached even the one who had denied Him. Galilee was where their ministry had begun, and there they would take it up again.

      “As he said unto you” points back to the night of the Last Supper: “after that I am risen, I will go before you into Galilee” ([[Mark 14:28]]). Jesus said it in the same breath as His warning that they would all be offended because of Him that night ([[Mark 14:27]]).
    sources: [smith-resurrection, huntsman-easter-sunday]
  - ref: 8
    phrase: neither said they any thing to any man; for they were afraid
    kind: history
    title: For they were afraid
    body: |
      The women flee, “trembling and amazement seized them,” as the Greek has it, and they say nothing to anyone. In Mark even the women, who stayed through the Crucifixion when the men had fled, now seem to fail, the last in a long line of disciples who stumble. Yet the message they have just heard is that the failed are restored, and it holds for them too. Matthew and Luke tell that they did carry the word ([[Matt. 28:8]]; [[Luke 24:9]]), and so does verse 10.

      In the oldest manuscripts the Gospel ends on these two Greek words, *ephobounto gar*, “for they were afraid,” an awkward close to a sentence and an ending without precedent; it reads like an unfinished thought that the next verses would resolve. Some believe Mark meant to stop here, leaving his hearers alone at the tomb to take up the charge to tell the news themselves. Others think he was prevented from finishing, perhaps by death or persecution, or that his ending was lost. However the Gospel first ended, verses 9–20, and Matthew and Luke, all carry the story on from where verse 8 leaves it.
    sources: [ellicott-mark, huntsman-easter-sunday, wayment-endings-mark, smith-resurrection]
  - ref: 9
    phrase: Now when Jesus was risen early the first day of the week
    kind: history
    title: The ending of Mark
    body: |
      Verses 9–20 raise the best-known textual question in the Gospels: whether they were part of the Gospel as Mark wrote it.

      **What the manuscripts show.** Two of the most important early manuscripts of the New Testament, Codex Sinaiticus and Codex Vaticanus, both of the fourth century, end the Gospel at verse 8, as do many early translations, Latin, Armenian, Georgian and Ethiopic. Eusebius and Jerome both knew copies without the verses; Eusebius wrote that nearly all the copies of Mark ended at verse 8. Some manuscripts give instead a two-sentence “shorter ending,” one expands the longer ending after verse 14, and some have both. The longer ending, the one in the King James Version, is in the majority of ancient manuscripts and has excellent support from Greek witnesses, though not from all the earliest. It is also the first ending any outside writer mentions: Irenaeus quoted verse 19 as the end of Mark’s Gospel, and since he and Tatian both knew the longer ending, its origin can be placed, tentatively, before the middle of the second century. The join is abrupt, from the frightened women of verse 8 to Jesus in verse 9, and suggests a seam where the text was once lost or altered.

      **What Latter-day Saint scholars conclude.** They differ. One study judges that the original ending has almost certainly been lost and that the vocabulary of these verses, which is not Mark’s, suggests a later follower may have added them “in the spirit of the Gospel author”; yet the evidence “is hardly definitive,” and the text Erasmus printed, which later shaped the King James Version, “is a viable and defensible option.” Others read the verses as a later scribe’s addition, different in style and diction from Mark, drawn from the other Gospels to complete the story. Others again argue that recent scholarship gives compelling reasons to overturn the scholars’ consensus: the verses are early, Markan in style and one in theme with the Gospel, and belong in the canon, whether Mark wrote them himself or they were written under his direction or by a follower. Another Latter-day Saint study calls it “a defensible position” that they were part of Mark from the start, and adds that even scholars who reject them think they likely existed before they were joined to Mark, an early, independent witness of the Resurrection.

      **What Restoration scripture shows.** The Church’s edition prints the twelve verses with a chapter heading that sums them up, and its footnotes join them to modern revelation. The Joseph Smith Translation that the Church’s edition prints for this chapter revises the scene at the tomb (verses 3–6) and leaves verses 9–20 as they stand. And the Lord’s own words in latter-day scripture repeat the commission and the signs: to the Nephite disciples, as Moroni quotes them ([[Morm. 9:22–25]]), whose source was the record of Christ’s teaching among the Nephites, not the Gospel of Mark; and to the elders of this dispensation ([[D&C 68:8–10]]), where He introduces the promise to those who believe and are baptized with “as I said unto mine apostles I say unto you again” ([[D&C 84:64]]) and goes on to the signs that follow them. Whoever first wrote these verses down, the Lord has said that He gave this promise to His apostles. The notes that follow read them as scripture.
    sources: [wayment-endings-mark, huntsman-easter-sunday, lindsay-longer-ending-1, sc-knowhy-522, jst-mark-16, lds-scriptures]
  - ref: 9
    phrase: out of whom he had cast seven devils
    kind: history
    title: Out of whom he had cast seven devils
    body: |
      The longer ending identifies Mary Magdalene by what Jesus had done for her, as Luke does when he names her among the women who traveled with Jesus in Galilee and “ministered unto him of their substance”: “Mary called Magdalene, out of whom went seven devils” ([[Luke 8:2–3]]). Her second name probably comes from her home town, Magdala. Jesus had healed her of maladies both physical and mental, the mental associated with possession by evil spirits, and that grievous affliction is no warrant for the assertion that she had been unchaste. The woman He had freed was the first to see Him risen.
    sources: [talmage-jesus-christ-18, draper-he-has-risen]
  - ref: 12
    phrase: he appeared in another form unto two of them
    kind: history
    title: In another form
    body: |
      These are most likely the two disciples whom Luke follows on the road to Emmaus, a village about seven miles from Jerusalem, who walked and talked with Jesus without knowing Him until He broke bread with them ([[Luke 24:13–35]]). Mark says only that He appeared “in another form.” The Greek *morphē* is the form by which a person strikes the eye, the outward appearance.

      Luke tells why they did not know Him: “their eyes were holden that they should not know him” ([[Luke 24:16]]), and Joseph Smith’s translation adds “holden, or covered.” Read with that addition, it appears that the two were not yet ready to behold the resurrected Lord in His full glory and saw Him as through a veil, as He had looked as a mortal man.
    sources: [sc-knowhy-677, thayer]
  - ref: 14
    phrase: upbraided them with their unbelief and hardness of heart
    kind: history
    title: Their unbelief and hardness of heart
    body: |
      Twice in these verses the disciples meet a witness with disbelief, Mary’s (verse 11) and the two travelers’ (verse 13); then Jesus rebukes them for it (verse 14). Every Gospel affirms that the women’s testimony did not convince the men; all that Sunday they were downhearted and frightened and did not know what to believe. Their doubt had a cultural edge as well. Women were generally not permitted as witnesses under Jewish law, so to believe, the disciples had to set aside the habit of distrusting women’s words. For the same reason, an account made up later would hardly have made women the first witnesses of the Resurrection.

      Jesus reproaches the eleven for unbelief as He had in the boat on the stormy sea, “how is it that ye have no faith?” ([[Mark 4:40]]). Yet the rebuke and the commission come in the same scene, to the same men. Their slowness to believe makes their witness the more credible when they did believe: they were not men eager to be convinced.
    sources: [draper-he-has-risen, smith-resurrection, lds-scriptures]
  - ref: 15
    phrase: Go ye into all the world, and preach the gospel to every creature
    kind: scripture
    title: Into all the world
    body: |
      This commission widens the first one. When Jesus first sent out the Twelve, He sent them only “to the lost sheep of the house of Israel” ([[Matt. 10:6]]); now they are to go to Jew and Gentile, bond and free, to all people of every nation and tongue. “Every creature” is better “the whole creation.”

      The Lord gave the same charge to the Nephite disciples, in words nearly identical to Mark’s ([[Morm. 9:22–23]]), and to the elders of this dispensation with two things made explicit. They go “acting in the authority which I have given you, baptizing in the name of the Father, and of the Son, and of the Holy Ghost” ([[D&C 68:8]]); and the one who believes and is “baptized by water for the remission of sins, shall receive the Holy Ghost” ([[D&C 84:64]]).
    sources: [talmage-jesus-christ-37, ellicott-mark, sc-knowhy-522, lds-scriptures]
  - ref: 16
    phrase: he that believeth not shall be damned
    kind: words
    title: Damned
    body: |
      “Damned” sounds final in modern English. The Greek verb, *katakrinō*, means to condemn, and here it is God’s sentence on the one who will not believe; “shall be condemned” is the plainer rendering. How final that sentence is, the verse does not say. In the Church’s usage, damnation is the state of being stopped in one’s progress and denied access to the presence of God and His glory, and it exists in degrees. The verse sets the two outcomes side by side: belief joined with baptism leads to salvation, and unbelief to condemnation.
    sources: [thayer, ellicott-mark, gs-damnation]
  - ref: 17
    phrase: these signs shall follow them that believe
    kind: scripture
    title: Signs that follow
    body: |
      The signs are promised to follow belief, not to produce it, as the Lord said in this dispensation: “faith cometh not by signs, but signs follow those that believe,” and signs come “by the will of God,” “not by the will of men, nor as they please” ([[D&C 63:9–10]]).

      His restatement to the elders lists more: “many wonderful works,” casting out devils, healing the sick, opening the eyes of the blind and unstopping the ears of the deaf ([[D&C 84:65–70]]). It ends with a commandment: “they shall not boast themselves of these things, neither speak them before the world; for these things are given unto you for your profit and for salvation” ([[D&C 84:73]]).

      “New tongues” is the only explicit mention in the Gospels of the gift the apostles received at Pentecost ([[Acts 2:4]]).
    sources: [lds-scriptures, ellicott-mark]
  - ref: 18
    phrase: They shall take up serpents; and if they drink any deadly thing, it shall not hurt them
    kind: scripture
    title: Serpents and deadly things
    body: |
      These are promises of protection, not trials to be sought. The one recorded instance of the first in the New Testament was not sought: on Malta a viper fastened on Paul’s hand as he laid sticks on a fire, and he shook it off and “felt no harm” ([[Acts 28:3–6]]). Of drinking poison unharmed the New Testament records no instance.

      The Doctrine and Covenants gives the promise the same shape: “if any man shall administer poison unto them it shall not hurt them; and the poison of a serpent shall not have power to harm them” ([[D&C 84:71–72]]). In an early revelation the Lord told His servants, “Require not miracles, except I shall command you, except casting out devils, healing the sick, and against poisonous serpents, and against deadly poisons” ([[D&C 24:13]]). The Nephite disciples were given the same promise that believers would not be harmed ([[Morm. 9:24]]), and it may have had a particular meaning for those of them who were to tarry: their persecutors cast them into furnaces and dens of wild beasts, and they came out “receiving no harm” ([[4 Ne. 1:30–33]]).
    sources: [ellicott-mark, lds-scriptures, sc-knowhy-522]

christ: |
  Mark 16 shows Jesus Christ risen, “he is not here,” and the first word He sends from the empty tomb is for the disciples who had abandoned Him, with Peter named, who had denied Him. He rebukes the eleven for their unbelief and in the same meeting gives them the gospel to carry into all the world; then He works with them, confirming the word with signs. He gave the same commission to His Nephite disciples, and again to the elders of this dispensation, repeating His promise to believers: “as I said unto mine apostles I say unto you again” ([[D&C 84:64]]). Disciples who have failed Him are still invited to follow Him and are still sent, and the signs He promises follow their faith rather than create it, for “faith cometh not by signs, but signs follow those that believe” ([[D&C 63:9]]).

