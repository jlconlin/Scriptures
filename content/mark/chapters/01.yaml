chapter: 1
title: The Beginning of the Gospel
tagline: John prepares the way, the heavens are torn open over the beloved Son, and Jesus comes into Galilee with an authority that silences unclean spirits, lifts a fevered woman from her bed, and cleanses a leper with a touch.
when: 'The start of Jesus’s ministry: John’s preaching, the baptism, and the first days in Galilee'

setting: |
  Mark begins at a run. There is no birth story and no genealogy. The first line names Jesus Christ, the Son of God, and the first person on stage is John the Baptist, a disciple who prepares others to become disciples. Mark uses his favorite word, *euthys* (“straightway,” “immediately,” “forthwith,” “anon”), ten times in this chapter alone, and the story rushes from the Jordan to the wilderness to a synagogue, a sickroom and a crowd at the door.

  The Gospel never names its author; the titles over the four Gospels seem to have been added later, in the second century. Mark is identified as John Mark, son of the Mary whose Jerusalem house appears in [[Acts 12:12]], companion of Paul and Barnabas, and later of Peter ([[1 Pet. 5:13]]) in the city Peter calls Babylon, “probably Rome,” and his Gospel “was possibly written under the direction of Peter.” That link goes back to Papias, early in the second century, who reported an elder’s words that Mark “became Peter’s interpreter … and wrote accurately all that he remembered, not, indeed, in order”; a Latter-day Saint study of the early witnesses judges it “an early, probably reliable, tradition.” Peter’s call by the lake in this chapter and the angel’s word to “his disciples and Peter” in [[Mark 16:7]] frame the body of the Gospel. Mark may have been written for Christians in Rome, persecuted by Nero after the fire of AD 64, some time between Peter’s death (traditionally placed in that persecution) and AD 69.

thread: |
  **The Son of God arrives with authority, and the more He shows it, the less room the world leaves Him.**

  The first fifteen verses tell the reader whom to trust before Jesus says a word. The narrator calls Him the Son of God (verse 1); the prophets, quoted together, say the Lord Himself is coming (verses 2–3); John says one mightier than he is near (verses 7–8); and the Father, speaking through heavens torn open, calls Him “my beloved Son” (verse 11). Only then does Jesus speak: the appointed time has come (verse 15).

  The rest of the chapter shows that authority at work, one scene after another. He calls fishermen and they leave their nets (verses 16–20). He teaches in the synagogue as no scribe taught, and an unclean spirit obeys Him (verses 21–28). He lifts a woman out of a fever, and she serves (verses 29–31). The whole town comes to the door at sunset (verses 32–34). He touches a leper whom the law kept outside the camp, and the man is clean (verses 40–42).

  The same chapter shows Jesus holding that authority back. He silences the spirits who know Him, slips away before dawn to pray rather than stay with the town that seeks Him, and charges the healed leper to say nothing. The leper talks anyway, and the chapter ends with Jesus outside the towns in desert places, where the leper had lived, and the people coming to Him there from every quarter.

sections:
  - range: 1-8
    heading: John prepares the way
    plain: |
      This is the beginning of the good news of Jesus Christ, the Son of God. As it is written in the prophets: “I am sending my messenger ahead of you to prepare your way. A voice is calling out in the wilderness: Prepare the way of the Lord, make His paths straight.” So John came, baptizing in the wilderness and preaching a baptism of repentance for the forgiveness of sins. People went out to him from the whole region of Judea and from Jerusalem, and he baptized them all in the Jordan River as they confessed their sins. John wore clothing of camel’s hair with a leather belt around his waist, and he ate locusts and wild honey. His message was: “Someone more powerful than I is coming after me. I am not worthy even to stoop down and untie the strap of His sandals. I have baptized you with water, but He will baptize you with the Holy Ghost.”
  - range: 9-11
    heading: The Father’s beloved Son
    plain: |
      In those days Jesus came from Nazareth in Galilee and was baptized by John in the Jordan. As soon as He came up out of the water, He saw the heavens torn open and the Spirit coming down on Him like a dove. And a voice came from heaven: “You are my beloved Son; I am well pleased with you.”
  - range: 12-13
    heading: Forty days in the wilderness
    plain: |
      At once the Spirit drove Him out into the wilderness. He was there forty days, tempted by Satan. He was among the wild animals, and the angels served Him.
  - range: 14-15
    heading: The time has come
    plain: |
      After John was put in prison, Jesus came into Galilee proclaiming the good news of the kingdom of God: “The appointed time has come, and the kingdom of God has arrived. Repent, and believe the good news.”
  - range: 16-20
    heading: Fishers of men
    plain: |
      As He walked beside the Sea of Galilee He saw Simon and his brother Andrew throwing a net into the sea, for they were fishermen. Jesus said to them, “Come, follow me, and I will make you fishers of men.” At once they left their nets and followed Him. A little farther on He saw James the son of Zebedee and his brother John in their boat, mending their nets. At once He called them, and they left their father Zebedee in the boat with the hired men and went after Him.
  - range: 21-28
    heading: Authority in the synagogue
    plain: |
      They went into Capernaum, and on the sabbath Jesus went straight into the synagogue and taught. The people were astonished at His teaching, for He taught them as one who had authority, not as the scribes did. In their synagogue was a man with an unclean spirit, and he cried out, “Leave us alone! What business do you have with us, Jesus of Nazareth? Have you come to destroy us? I know who you are: the Holy One of God.” Jesus rebuked him: “Be silent, and come out of him.” The unclean spirit tore at the man, cried out with a loud voice, and came out of him. Everyone was amazed and asked one another, “What is this? What new teaching is this? With authority He commands even the unclean spirits, and they obey Him.” At once the news about Him spread through the whole region around Galilee.
  - range: 29-34
    heading: Healing at Simon’s house
    plain: |
      As soon as they left the synagogue they went into the house of Simon and Andrew, with James and John. Simon’s mother-in-law was lying in bed with a fever, and they told Jesus about her at once. He went to her, took her by the hand and raised her up. The fever left her immediately, and she served them. That evening, after sunset, people brought to Him all who were sick and those possessed by devils, and the whole town gathered at the door. He healed many who were sick with various diseases and cast out many devils, and He would not let the devils speak, because they knew who He was.
  - range: 35-39
    heading: Prayer before dawn
    plain: |
      Very early in the morning, while it was still dark, Jesus got up, went out to a lonely place, and prayed there. Simon and those with him went looking for Him, and when they found Him they said, “Everyone is looking for you.” He answered, “Let us go on to the nearby towns, so that I can preach there too; that is why I came.” So He went through all Galilee, preaching in their synagogues and casting out devils.
  - range: 40-45
    heading: A leper made clean
    plain: |
      A leper came to Jesus, knelt before Him and begged Him: “If you are willing, you can make me clean.” Moved with compassion, Jesus reached out His hand, touched him and said, “I am willing. Be clean.” As soon as He spoke, the leprosy left him, and he was clean. Jesus warned him sternly and sent him away at once: “See that you say nothing to anyone. But go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.” But the man went out and began to tell it freely and spread the news widely, so that Jesus could no longer go into a town openly but stayed outside in lonely places. Even so, people came to Him from every side.

notes:
  - ref: 1
    phrase: The beginning of the gospel of Jesus Christ, the Son of God
    kind: christ
    title: A title over the whole book
    body: |
      Mark’s first line works as the title of his Gospel, and it is the one place where the narrator himself says who Jesus is. Everywhere else Mark shows it, through what Jesus does and what others say of Him. Here he says it outright: Jesus is the Christ, the anointed one, and the Son of God. What those titles meant would become clear only as the story unfolds.

      The word “gospel” is caught between two meanings. It had meant the “good news” of the kingdom of God, and that is how Jesus uses it a few verses later: “repent ye, and believe the gospel” (verse 15). It would come to mean a book telling the main facts of the Lord’s life, and Mark’s opening stands at the turn between the two.

      “The Son of God” is the title that frames the book. The Father says it to Jesus at the baptism (verse 11), unclean spirits shout it ([[Mark 3:11]]; [[Mark 5:7]]), and at the end a Roman centurion at the cross says, “Truly this man was the Son of God” ([[Mark 15:39]]). The Greek editions differ on this line: the Textus Receptus behind the King James Version and the Byzantine Majority Text have “the Son of God,” while some modern critical editions (the SBL text, Westcott and Hort, Tischendorf) print the line without it. Whichever reading Mark wrote, the Father and the centurion give Jesus the same title within the story.
    sources: [easton-marcan-christology, ellicott-mark, smith-marks-unique-contribution, greek-nt]
  - ref: 2
    phrase: As it is written in the prophets
    kind: scripture
    title: Three scriptures, and the Lord who comes
    body: |
      Mark joins three Old Testament passages into one quotation, and by joining them he says who Jesus is. This is the only place in his Gospel where Mark himself quotes scripture; every other quotation is on Jesus’s lips.

      The first line draws on two promises. In [[Ex. 23:20]] the Lord sends “an Angel” before Israel to keep them in the way; [[Mal. 3:1]] likely takes up that promise in a new setting: the Lord will send His messenger to prepare the way before Him, and Malachi later names that messenger Elijah ([[Mal. 4:5]]). The second line is [[Isa. 40:3]], which announced that the Lord, Jehovah, was about to return to His people and show His glory.

      Mark makes two moves with these words. John the Baptist is the messenger. And Jesus is the Lord: it is His way and His paths that must be made ready. So read, the coming of John and Jesus to the wilderness is the salvation Isaiah promised.

      The King James “in the prophets” follows the Greek of the Textus Receptus. The modern critical editions of the Greek read *in Isaiah the prophet*, though the first line comes from Exodus and Malachi.
    sources: [frederick-use-of-ot, greek-nt]
  - ref: 4
    phrase: preach the baptism of repentance for the remission of sins
    kind: history
    title: What John’s baptism was
    body: |
      John did not invent baptism; Latter-day Saints hold that it has been part of God’s plan from the beginning. What marked John’s baptism out from the Jewish washings of his day was its purpose and its administrator. The washings were rites of ceremonial purity, repeated whenever needed, and a person immersed himself. John’s baptism was given once, for repentance and the forgiveness of sins, to prepare Israel for the coming of the Lord, and John himself performed it, holding priesthood keys. That is why he could be called simply “the Baptist”: he was doing something no one else did.

      Latter-day revelation says where his authority came from. The lesser priesthood held “the gospel of repentance and of baptism, and the remission of sins”; John was “ordained by the angel of God at the time he was eight days old unto this power,” to “make straight the way of the Lord before the face of his people” ([[D&C 84:27–28]]), the very task verse 3 gives the voice in the wilderness. Joseph Smith taught that John “held the Aaronic Priesthood, and was a legal administrator, and the forerunner of Christ.” The same John later conferred on Joseph Smith and Oliver Cowdery the Priesthood of Aaron, which holds the keys “of the gospel of repentance, and of baptism by immersion for the remission of sins” ([[JS—H 1:69]]): the preaching of this verse, restored.
    sources: [larsen-baptism-nt, lds-scriptures, tpjs-2007-ch-6]
  - ref: 6
    phrase: John was clothed with camel’s hair, and with a girdle of a skin about his loins
    kind: symbol
    title: Dressed like Elijah
    body: |
      John’s clothing recalls Elijah’s, and with it Elijah’s role. Elijah had been known by the same dress: “an hairy man, and girt with a girdle of leather about his loins” ([[2 Kgs. 1:8]]), and John probably took it on deliberately, reviving the prophet’s outward appearance. Mark has just quoted Malachi’s promise of a messenger sent before the Lord (verse 2), the messenger Malachi calls Elijah, and the rough garment shows John in that role before he says a word.

      Restoration scripture is careful about what the role was. “Elias” is also a title for a forerunner, and the Joseph Smith Translation shows that two such figures were spoken of anciently: one who prepares, which John was, and one who restores, which was Jesus Himself.
    sources: [ellicott-matthew, frederick-use-of-ot, bd-elias]
  - ref: 8
    phrase: he shall baptize you with the Holy Ghost
    kind: scripture
    title: Water, fire and the Holy Ghost
    body: |
      Matthew and Luke report John saying that the coming one will baptize “with the Holy Ghost, and with fire” ([[Matt. 3:11]]; [[Luke 3:16]]); Mark has the Holy Ghost alone. Joseph Smith’s translation gives Mark the fuller saying: “he shall not only baptize you with water, but with fire, and the Holy Ghost” (JST Mark 1:6, in the footnotes). The change makes John’s point plain: water was only the first part of the baptism the Lord would bring. Joseph Smith taught the same in his own words: “The baptism of water, without the baptism of fire and the Holy Ghost attending it, is of no use; they are necessarily and inseparably connected.”

      John’s words also measure Jesus against himself. John had all Judea coming out to him (verse 5), yet he says he is not worthy to stoop and untie the coming one’s sandal strap, and that the coming one will give what John cannot. Before Jesus appears, the reader knows His authority is greater than a prophet’s.
    sources: [lds-scriptures, tpjs-2007-ch-7, easton-marcan-christology]
  - ref: 9
    phrase: was baptized of John in Jordan
    kind: christ
    title: Why the sinless Son was baptized
    body: |
      Mark has just called John’s rite “the baptism of repentance for the remission of sins” (verse 4), and now Jesus receives it, with no word of explanation. Matthew gives one: “thus it becometh us to fulfil all righteousness” ([[Matt. 3:15]]), perhaps for readers who would ask how a sinless Messiah could receive such a baptism. Nephi had already answered the question. Jesus was not baptized for a remission of sins, for He was holy; “according to the flesh he humbleth himself before the Father, and witnesseth unto the Father that he would be obedient unto him in keeping his commandments” ([[2 Ne. 31:7]]), and in doing it He showed others the narrow gate they must enter, “he having set the example before them” ([[2 Ne. 31:9]]).

      Mark’s order makes the same point. Jesus’s first act in the Gospel is to submit to God in baptism, and only after it does the Father declare Him the Son in whom He is well pleased (verse 11).
    sources: [larsen-baptism-nt, lds-scriptures, easton-marcan-christology]
  - ref: 10
    phrase: he saw the heavens opened
    kind: words
    title: The heavens torn open
    body: |
      Where Matthew says the heavens “were opened” ([[Matt. 3:16]]) and Luke has the same verb, Mark uses a stronger verb, *schizō*, “to cleave, cleave asunder, rend.” Jesus sees the heavens being torn apart, a sudden event, and the Spirit comes down through the tear.

      Mark uses the verb once more, at the other end of his Gospel: when Jesus dies, “the veil of the temple was rent in twain from the top to the bottom” ([[Mark 15:38]]). One Latter-day Saint reading sets the two scenes side by side. Each tearing is God’s act, each follows the main event told in a few words, and each opens a way between heaven and earth: at the baptism the Spirit tears through the heavens to come down on Jesus, and at His death the veil before the Holy of Holies is torn and the way into God’s presence stands open to all. In the same vein, the rending of the heavenly veil at the baptism has been read as Jesus’s admission into the presence of the Father and the Holy Ghost, much like the callings of the prophets in the Old Testament.
    sources: [thayer, egt-mark, smith-narrative-atonement-mark, sc-knowhy-655]
  - ref: 11
    phrase: Thou art my beloved Son, in whom I am well pleased
    kind: christ
    title: Spoken to the Son
    body: |
      In Mark the Father speaks to Jesus: “Thou art my beloved Son.” Matthew gives the words to the onlookers, “This is my beloved Son” ([[Matt. 3:17]]). The words appear to echo a psalm often read as a coronation psalm, where the Lord says to His anointed king, “Thou art my Son; this day have I begotten thee” ([[Ps. 2:7]]). One Latter-day Saint reading takes the baptism as a royal investiture, and at such an investiture words were addressed both to the one raised to the throne and to the people who would honor him, which would account for the two forms. The voice from heaven is the Father’s confirmation of the title Mark set over his book in verse 1, and after it the reader can trust whatever Jesus says or does.

      The words return at the cross with the roles reversed. At the baptism the voice from heaven speaks a psalm to Jesus; at the end Jesus speaks a psalm to God, “My God, my God, why hast thou forsaken me?” ([[Mark 15:34]], from [[Ps. 22:1]]). In both scenes the words that pass between the Father and the Son are the words of the Psalms.
    sources: [sc-knowhy-655, easton-marcan-christology, smith-narrative-atonement-mark]
  - ref: 12
    phrase: the Spirit driveth him into the wilderness
    kind: words
    title: Driven out by the Spirit
    body: |
      “Driveth” translates *ekballō*, the verb Mark uses for casting out devils (verses 34 and 39); here it means to send someone somewhere “with a force which he cannot resist.” The Spirit that has just come down on Jesus at once sends Him into the wilderness. The same verb stands in the Greek Old Testament (the Septuagint) for Adam and Eve being driven out of the garden ([[Gen. 3:24]]), and a Latter-day Saint reading of Mark takes the echo as the point: straight after His baptism Jesus suffers what the first parents suffered for their sin, though He has none. He went, and so His first two acts in Mark are submission to God, in baptism and in the hard road that followed it.

      Joseph Smith’s translation softens the verb: “the Spirit took him into the wilderness,” where He was “forty days, Satan seeking to tempt him” (JST Mark 1:10–11, in the footnotes). Its reading of Matthew says why He went there: “to be with God” (see the note at [[Matt. 4:1]]).
    sources: [thayer, smith-narrative-atonement-mark, easton-marcan-christology, lds-scriptures, jst-matt-4]
  - ref: 13
    phrase: was with the wild beasts; and the angels ministered unto him
    kind: symbol
    title: Wild beasts and angels
    body: |
      Mark gives none of the three temptations Matthew and Luke tell, but he alone says Jesus was “with the wild beasts.” In that wilderness they might have included the panther, the bear, the wolf, the hyena and possibly the lion. Mark does not say what they did. One reading takes the detail partly as adding to the terror of the trial, and partly as a sign that He was kept safe among them, fulfilling a promise in the very psalm the tempter quoted in Matthew’s account ([[Matt. 4:6]]): the true child of God “shalt tread upon the lion and adder” ([[Ps. 91:13]]).

      One Latter-day Saint reading hears the detail with Mark’s first audience in mind. If the Gospel was written in part to help Christians endure the persecution in Rome after the fire of AD 64, when some might literally be thrown to the lions, a Jesus kept safe among wild beasts would have been a great comfort.

      Then the angels “ministered unto him,” Mark’s first use of a verb, *diakoneō*, that he will give next to Simon’s mother-in-law (see the note on verse 31).
    sources: [ellicott-mark, smith-marks-unique-contribution, smith-narrative-atonement-mark]
  - ref: 15
    phrase: The time is fulfilled, and the kingdom of God is at hand
    kind: words
    title: The appointed time has come
    body: |
      Jesus’s first words in Mark announce that a waiting has ended. “Time” here is *kairos*, a season or fixed time, and here it means the period appointed in God’s purpose that had to run its course before Christ could found the kingdom. That period, Jesus says, “is fulfilled.” “Is at hand” means more than that the kingdom is coming soon: the footnote gives the Greek as “has arrived.” The kingdom is no longer only promised.

      Joseph Smith made the same point about John’s preaching. To those who said the kingdom could not have been set up in John’s day, because John said only that it was at hand, he answered: “I would ask if it could be any nearer to them than to be in the hands of John.” Where there was a legal administrator with authority from God, and people baptized as subjects of a king, there was the kingdom.

      The command that follows has two parts, “repent ye, and believe the gospel,” and they sum up what Jesus cares about: teaching the gospel and preparing people for the kingdom of God.
    sources: [thayer, lds-scriptures, tpjs-2007-ch-6, easton-marcan-christology]
  - ref: 18
    phrase: straightway they forsook their nets, and followed him
    kind: history
    title: Men who had met Him before
    body: |
      Mark tells the call as if four fishermen left everything the moment a stranger spoke to them, but they were not strangers. John’s Gospel tells of an earlier meeting at the Jordan: Andrew, a disciple of John the Baptist, met Jesus there and then brought his brother Simon to Him ([[John 1:35–42]]), and the other disciple with Andrew, who is not named, was probably John the son of Zebedee. The call by the lake came to men who had met Him before: Andrew and Simon certainly, and John probably.

      What they left was real all the same. Only Mark says that James and John left their father “in the ship with the hired servants” (verse 20), a sign that the family was a fisherman’s household in fairly comfortable circumstances. Jesus’s promise, “I will make you to become fishers of men” (verse 17), offered them something more than what they were: following Him, they would become what He saw in them.
    sources: [bd-andrew, bd-john, easton-marcan-christology]
  - ref: 22
    phrase: he taught them as one that had authority, and not as the scribes
    kind: history
    title: An authority the scribes never claimed
    body: |
      The scribes were the teachers of the law in Jesus’s day. Their work was to develop the law in detail and apply it to their own times, and out of it had grown an oral, traditional law beside the written one. They taught by memorization, so that their pupils could reproduce exactly the words of the wise who had gone before them, and they never taught on their own authority. Jesus, by contrast, spoke as one who had authority Himself, and the people noticed at once.

      Mark gives no words of that first sermon. What he gives instead is the proof. The unclean spirit cries out, Jesus commands it, and it goes, and the people tie the two together: “what new doctrine is this? for with authority commandeth he even the unclean spirits, and they do obey him” (verse 27). His word has the same authority over spirits that it has in teaching. Through the whole chapter Mark keeps returning to that authority and to the astonishment of those who saw it.
    sources: [bd-scribe, easton-marcan-christology]
  - ref: 25
    phrase: Hold thy peace, and come out of him
    kind: history
    title: Why He silenced the spirits
    body: |
      The unclean spirit knows exactly who Jesus is. It calls Him by His town, “Jesus of Nazareth,” and by His holiness, “the Holy One of God” (verse 24), and in Mark the devils, whatever their evil, have accurate information. Its question, “art thou come to destroy us?”, shows the stakes: Jesus has come to do battle with Satan and his dominion, a theme Mark announced in the wilderness (verse 13). Jesus answers with a rebuke whose verb, *phimoō*, means literally to muzzle, as an ox is muzzled: “Be muzzled.”

      Why silence a true testimony? Mark gives no reason, here or that evening, when He “suffered not the devils to speak, because they knew him” ([[Mark 1:34]]). This is the first of many places in Mark where Jesus limits who may say who He is, to spirits, to the people He heals ([[Mark 1:44]]) and at last to His disciples ([[Mark 8:30]]). Scholars have called it the “messianic secret,” and there is no consensus on its purpose; the commands are often broken, and Mark says so, as at the end of this chapter.

      For the spirits, one Latter-day Saint reading finds the reason plain: Jesus did not want demonic testimony to His messiahship. The witness was true but the witnesses were Satan’s, and their knowledge sets up an irony that runs through the Gospel: the servants of Satan knew who Jesus was, and the religious authorities did not.
    sources: [smith-marks-unique-contribution, easton-marcan-christology, thayer, keller-mark-luke]
  - ref: 31
    phrase: she ministered unto them
    kind: words
    title: She ministered
    body: |
      The healed woman’s first act is service, and Mark’s verb gives it weight. “Ministered” is *diakoneō*. It can mean simple, menial service, such as waiting on guests, but in Mark it is also the word for the service disciples give: it was used of the angels with Jesus in the wilderness (verse 13), and Jesus will use it of His own mission, “not to be ministered unto, but to minister” ([[Mark 10:45]]). Read that way, Simon’s mother-in-law is the first example in Mark of what a disciple does, in a Gospel that will show the leading men among the disciples failing again and again.

      Mark does not develop the hint here. He comes back to it at the cross, where the women who had followed Jesus from Galilee “ministered unto him” ([[Mark 15:41]]).
    sources: [smith-marks-unique-contribution, smith-narrative-atonement-mark]
  - ref: 32
    phrase: at even, when the sun did set
    kind: history
    title: Waiting for the sabbath to end
    body: |
      Mark marks the hour twice, “at even, when the sun did set,” and the double note has a reason. The day was a sabbath (verse 21), and the sabbath closed at sunset. The people waited until it was over before carrying their sick to the door; the sabbath ended, and the whole town came.
    sources: [egt-mark]
  - ref: 38
    phrase: for therefore came I forth
    kind: christ
    title: What He came to do
    body: |
      The disciples hunt Jesus down in the dark with good news: “All men seek for thee.” After one day in Capernaum many are waiting for more healing, and the disciples, impressed by it, tell Him so. Jesus’s answer turns them away from the crowd: “Let us go into the next towns, that I may preach there also.” His healing, which everyone admired, was not His foremost purpose. He had something more important to do: proclaim that the kingdom of God was near.

      “For therefore came I forth” could mean only that He had come out from Capernaum that morning. Luke’s account gives the saying as “for therefore am I sent” ([[Luke 4:43]]), which ties it to His mission as a whole. The disciples, at this stage, probably heard His “coming forth” as from His home at Nazareth, not as from the Father.
    sources: [keller-mark-luke, ellicott-mark]
  - ref: 41
    phrase: put forth his hand, and touched him
    kind: history
    title: He touched the leper
    body: |
      The law kept a leper apart. He tore his clothes, left his head bare, covered his upper lip and cried “Unclean, unclean”; he lived alone, “without the camp” ([[Lev. 13:45–46]]). This man broke the distance himself by coming and kneeling, and his words show what he doubted. The question in his mind was not whether Jesus could heal him, but whether He would: “If thou wilt, thou canst make me clean.”

      Jesus answered the doubt twice, by touch and by word. He laid His hand on a man who was unclean both ceremonially and physically, and He said the very word the leper had questioned: “I will.”
    sources: [lds-scriptures, talmage-jesus-christ-14]
  - ref: 44
    phrase: for a testimony unto them
    kind: history
    title: Sent sternly to the priest
    body: |
      Jesus sent the healed man off sternly and in haste. “Straitly charged” translates a verb that elsewhere means to be moved with indignation, and here means to charge with earnest admonition, to warn sternly (verse 43); and “sent him away” is *ekballō* again, the word for driving out, here meaning to make someone leave in haste. He was to tell no one, and to go straight to the priest.

      The visit to the priest was required. The law of Moses set out the offerings and the ritual by which a priest declared a healed leper clean ([[Lev. 14:1–32]]). That declaration was the “testimony unto them”: the priest’s witness to the people, without which the man would not be received back as clean.

      Why tell no one? Mark does not say, and the reason is not certain (see the note on verse 25). One Latter-day Saint reading starts from what the people expected: they, Jesus’s disciples among them, assumed a Messiah who worked wonders and would drive out the Romans, and did not yet understand what His messiahship was. On that reading the command most likely reflects His wish that before His death people not be misled about what it means to be the Messiah, which news of a miracle would only feed. The cost of the broken command shows in the next verse: Jesus had to go into the wilderness to get away from the crowds who wanted Him to heal their sick.
    sources: [thayer, egt-mark, lds-scriptures, keller-mark-luke, smith-marks-unique-contribution]
  - ref: 45
    phrase: Jesus could no more openly enter into the city, but was without in desert places
    kind: christ
    title: Outside, where the leper had been
    body: |
      The chapter ends in a reversal. The leper had been the one who lived alone, outside the camp ([[Lev. 13:46]]); now he is clean and talking in the towns, and Jesus can no longer enter a city openly but stays outside in desert places. One Latter-day Saint reading finds the irony in layers. The healed man disobeys the one who healed him. Jesus must then live like a leper, in the wilderness, to escape the crowds. And even there the escape fails: “they came to him from every quarter.”
    sources: [smith-marks-unique-contribution, lds-scriptures]

christ: |
  Mark 1 shows Jesus Christ as the Lord whose way Isaiah’s voice prepared, the beloved Son over whom the heavens were torn open, and the One whose word reaches unclean spirits, fever and leprosy. He stretched out His hand to the man the law kept outside the camp, and by the chapter’s end He was outside in the desert places Himself. Nephi saw in His baptism “the straitness of the path, and the narrowness of the gate,” with Christ “having set the example” ([[2 Ne. 31:9]]); a disciple who follows Him into the water and receives the baptism of fire and the Holy Ghost, which Joseph Smith taught are “necessarily and inseparably connected,” walks the path He walked first. And the leper’s “If thou wilt” has its answer in this chapter, in the words “I will; be thou clean.”

explore: |
  - **The three prophecies Mark joins.** [[Ex. 23:20]], [[Mal. 3:1]] with [[Mal. 4:5–6]], and [[Isa. 40:3–5]].
  - **Why the Son was baptized.** Nephi’s answer, [[2 Ne. 31:4–12]].
  - **John’s priesthood.** [[D&C 84:26–28]] and [[JS—H 1:68–72]].
  - **The baptism and the cross.** Read [[Mark 1:10–11]] beside [[Mark 15:34–41]]: a voice, a tearing, a confession that He is the Son, and women who “ministered.”
  - **The other tellings.** [[Matt. 3]] and [[Matt. 4]]; [[Luke 3:1–22]] and [[Luke 4:1–44]]; John’s first meeting at the Jordan, [[John 1:19–42]].
  - Julie M. Smith’s “Mark’s Unique Contribution” (*Religious Educator*, 2016) is a clear introduction to what sets Mark apart: his style, his women disciples, his commands to silence and his titles for Jesus.

