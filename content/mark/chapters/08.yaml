chapter: 8
title: Men as Trees, Walking
tagline: Jesus feeds four thousand, refuses the Pharisees a sign, asks His disciples why they still do not understand, heals a blind man in two stages, hears Peter confess Him the Christ, and begins to teach that He must suffer, die and rise again.
when: 'From the Decapolis across the Sea of Galilee to Dalmanutha and Bethsaida, then north to the villages of Caesarea Philippi'

setting: |
  Mark 8 follows the journey of [[Mark 7:31]], back from the borders of Tyre and Sidon to the Sea of Galilee “through the midst of the coasts of Decapolis,” the region of “the ten cities” south and east of the lake (see the note on [[Mark 5:1]]). The chapter crosses the lake to Dalmanutha, a town on its shore near Magdala, then to Bethsaida at its northeast end, and goes on north to the villages around Caesarea Philippi at the foot of Mount Hermon.

  Matthew tells the same stories in the same order ([[Matt. 15:32–16:28]]); Luke tells only Peter’s confession and what follows it ([[Luke 9:18–27]]). The blind man healed at Bethsaida is in Mark alone.

  The chapter is the hinge of the Gospel. Until Peter’s confession Mark shows Jesus chiefly as the doer of mighty works; from it on He is the Son of Man who must suffer, and He foretells His death three times on the way to Jerusalem ([[Mark 8:31]]; [[Mark 9:31]]; [[Mark 10:33–34]]). Those predictions are told between two healings of blind men, the one in this chapter and Bartimaeus outside Jericho ([[Mark 10:46–52]]).

thread: |
  **Seeing, but not yet clearly.** The disciples have handed out bread to five thousand and now to four thousand, and in the boat they still worry because they have only one loaf. “Having eyes, see ye not?” Jesus asks them, and the scene ends on a question: “How is it that ye do not understand?” (verses 18, 21).

  Then Mark tells of a blind man whom Jesus heals with two touches. After the first he sees men “as trees, walking”; after the second he sees clearly. The next story shows what that looks like in a disciple. Asked who Jesus is, Peter answers rightly, “Thou art the Christ,” and a few verses later rebukes Him for teaching that the Christ must suffer and be killed. Peter has begun to see, but not clearly: he knows who Jesus is, and not yet what He came to do. The rest of the chapter is the second touch beginning. Jesus speaks plainly of His death and Resurrection, and of the cross that everyone who follows Him must take up as well.

sections:
  - range: 1-10
    heading: Four thousand fed
    plain: |
      In those days, when there was again a great crowd with nothing to eat, Jesus called His disciples and said to them, “I have compassion on these people, because they have been with Me three days now and have nothing to eat. If I send them home hungry, they will collapse on the way, for some of them have come a long distance.” His disciples answered, “Where could anyone get enough bread to feed these people, out here in the wilderness?” He asked them, “How many loaves do you have?” They said, “Seven.” He told the crowd to sit down on the ground. Then He took the seven loaves, gave thanks, broke them, and gave them to His disciples to set before the people, and they did so. They also had a few small fish; He blessed them and told the disciples to serve those too. The people ate and were satisfied, and the disciples gathered seven baskets of the pieces left over. About four thousand had eaten. Then He sent them away, and at once got into the boat with His disciples and came to the district of Dalmanutha.
  - range: 11-21
    heading: No sign, and the leaven of the Pharisees
    plain: |
      The Pharisees came out and began to argue with Him, demanding a sign from heaven to test Him. He sighed deeply in His spirit and said, “Why does this generation ask for a sign? Truly I tell you, no sign will be given to this generation.” And He left them, got into the boat again, and crossed to the other side. The disciples had forgotten to bring bread, and had only one loaf with them in the boat. Jesus warned them, “Watch out; beware of the leaven of the Pharisees and the leaven of Herod.” They talked it over among themselves and said, “It is because we have no bread.” Jesus knew what they were saying and said to them, “Why are you talking about having no bread? Do you still not see or understand? Are your hearts still hardened? You have eyes; can you not see? You have ears; can you not hear? Do you not remember? When I broke the five loaves for the five thousand, how many baskets full of pieces did you pick up?” They said, “Twelve.” “And when I broke the seven for the four thousand, how many baskets full of pieces did you pick up?” They said, “Seven.” And He said to them, “How is it that you still do not understand?”
  - range: 22-26
    heading: A blind man healed in two stages
    plain: |
      They came to Bethsaida, and some people brought a blind man to Jesus and begged Him to touch him. He took the blind man by the hand and led him out of the village. When He had spit on his eyes and laid His hands on him, He asked whether he could see anything. The man looked up and said, “I see people; they look like trees walking around.” Then Jesus laid His hands on his eyes again and had him look up, and his sight was restored, and he saw everything clearly. Jesus sent him home, saying, “Do not go into the village, and do not tell anyone in the village.”
  - range: 27-30
    heading: Peter’s confession at Caesarea Philippi
    plain: |
      Jesus and His disciples went on to the villages around Caesarea Philippi. On the way He asked them, “Who do people say that I am?” They answered, “John the Baptist; others say Elijah; and others, one of the prophets.” He asked them, “But who do you say that I am?” Peter answered, “You are the Christ.” And He charged them to tell no one about Him.
  - range: 31-38
    heading: The Son of Man must suffer, and the cost of following Him
    plain: |
      Then He began to teach them that the Son of Man must suffer many things, be rejected by the elders, the chief priests and the scribes, be killed, and after three days rise again. He said this plainly. Peter took Him aside and began to rebuke Him. But Jesus turned and looked at His disciples, and rebuked Peter: “Get behind Me, Satan! You are not setting your mind on the things of God, but on the things of men.” Then He called the crowd to Him along with His disciples and said, “Whoever wants to come after Me must deny himself, take up his cross, and follow Me. For whoever wants to save his life will lose it, but whoever loses his life for My sake and the gospel’s will save it. What good is it for someone to gain the whole world and lose his own soul? What could anyone give in exchange for his soul? Whoever is ashamed of Me and of My words in this adulterous and sinful generation, the Son of Man will also be ashamed of him when He comes in the glory of His Father with the holy angels.”

notes:
  - ref: 4
    phrase: From whence can a man satisfy these men with bread here in the wilderness?
    kind: history
    title: A second crowd, a second feeding
    body: |
      This is a second miracle, not a retelling of the feeding of the five thousand ([[Mark 6:30–44]]). The crowd has stayed with Jesus three days, some have come from far, and their food is gone; the loaves are seven, not five; the leftovers fill seven baskets, not twelve; and the people number about four thousand. Jesus Himself counts the two feedings separately (verses 19–20).

      The scene follows Jesus’s journey through the Decapolis ([[Mark 7:31–37]]), among semi-pagan peoples, where great crowds had come to Him with their sick. Mark does not say where the four thousand came from, or whether they were Jews or Gentiles.

      The disciples’ question sounds as though they had forgotten the five thousand. They may instead have remembered well, and not thought it their place to ask Him to do it again. As before, the miracle comes from His compassion (verse 2), not from any demand; and this crowd, with none of the excitement that followed the first feeding, when the people would have made Him a king ([[John 6:15]]), went quietly home.
    sources: [talmage-jesus-christ-22]
  - ref: 10
    phrase: came into the parts of Dalmanutha
    kind: history
    title: Dalmanutha
    body: |
      Dalmanutha is named by no other writer, and just where it stood is uncertain. It was a town on the shore of the Sea of Galilee, possibly Magdala itself or a place near it; Matthew says the boat came “into the coasts of Magdala” ([[Matt. 15:39]]).
    sources: [bd-dalmanutha, ellicott-mark]
  - ref: 12
    phrase: he sighed deeply in his spirit
    kind: words
    title: No sign for this generation
    body: |
      The Pharisees asked for “a sign from heaven,” and asked it “tempting him.” Only Mark records how Jesus answered first, not with words but with a sigh: the Greek verb means to draw a sigh up from the bottom of the breast, to sigh deeply.

      Mark’s refusal is flat: “There shall no sign be given unto this generation.” Matthew has an exception, “but the sign of the prophet Jonas” ([[Matt. 16:4]]). Joseph Smith’s translation of Mark adds the same exception and spells out what the sign is, Jesus’s own burial: “as Jonah was three days & three nights in the Whales belly, so likewise shall the son of man be buried in the bowels of the Earth” (JST Mark 8:12, from the manuscript).

      The Lord gave the principle again in this dispensation: “he that seeketh signs shall see signs, but not unto salvation,” and “faith cometh not by signs, but signs follow those that believe” ([[D&C 63:7]]; [[D&C 63:9]]). A sign demanded as proof is not the way to faith.
    sources: [thayer, lefevre-christology-jst, lds-scriptures]
  - ref: 15
    phrase: the leaven of Herod
    kind: symbol
    title: The leaven of the Pharisees and of Herod
    body: |
      Leaven was what made dough ferment, generally a lump of old dough worked into the new. It was barred from the Passover and from offerings made by fire, probably because it was associated with corruption, and in the New Testament it stands, as a rule, for sin.

      Jesus names two leavens. Matthew pairs the Pharisees with the Sadducees ([[Matt. 16:6]]); Mark pairs them with Herod, and Mark has already shown the Pharisees taking counsel with “the Herodians,” the party that supported Herod’s family, how they might destroy Him ([[Mark 3:6]]). The words imply that others besides the Pharisees were among those who had just demanded a sign. Read with Matthew’s account, the warning was against the false doctrines of the Pharisees and the Sadducees and against the political aims of the Herodians.

      The disciples hear “leaven” and think of bread, and possibly of a rebuke for having brought only one loaf.
    sources: [bd-leaven, bd-herodians, ellicott-mark, talmage-jesus-christ-22]
  - ref: 17
    phrase: have ye your heart yet hardened?
    kind: words
    title: Do ye not remember?
    body: |
      Jesus answers their worry with a string of questions that only Mark gives in full, from whether their hearts are still hardened to whether they remember. Then He has them count: twelve baskets after the five thousand, seven after the four thousand. The reminder had a plain purpose: men who had twice gathered up more than they started with need not be troubled about one loaf.

      Matthew closes the scene with the disciples understanding; Mark leaves them with Jesus’s question, “How is it that ye do not understand?” This is one of the places where Mark tells the failures of the Twelve plainly. In his Gospel they are learners who stumble again and again, and his questions, left unanswered, are put to the listener as much as to them.
    sources: [lds-scriptures, talmage-jesus-christ-22, smith-marks-unique-contribution]
  - ref: 23
    phrase: when he had spit on his eyes, and put his hands upon him
    kind: history
    title: Spittle and the laying on of hands
    body: |
      Jesus heals this man much as He had healed the deaf man of the Decapolis, by touch, apart from the crowd ([[Mark 7:33]]): He leads him by the hand out of the town, puts spittle on his eyes and lays His hands on him. The method seems fitted to each man’s infirmity, as the touches given the deaf man may have strengthened his faith and his confidence in the Master’s power. Spittle appears in healing only these two times in the first three Gospels. The laying on of hands was a ministration, and here it is given twice.
    sources: [ellicott-mark, talmage-jesus-christ-22]
  - ref: 24
    phrase: I see men as trees, walking
    kind: history
    title: Healed in two stages
    body: |
      This is the only miracle in the Gospels in which Jesus heals in stages. After the first touch the man sees, but not clearly, and he rightly takes what he sees moving for men. After the second touch he “saw every man clearly.” The Greek adverb means at a distance and clearly: he could now see far as well as clearly. The way the man describes his first sight has the naturalness of a remembered moment.

      Why two touches, when every other healing is at once? The Gospel gives no explanation. Matthew and Luke leave the story out, perhaps from discomfort with the idea that Jesus’s first attempt had not fully succeeded. Nothing in the text requires that reading: the story can be read as His choosing, for His own reason, not to heal the man at once. Where Mark places the story is the clue to what it means for the disciples.
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-22, ellicott-mark, thayer]
  - ref: 25
    phrase: saw every man clearly
    kind: structure
    title: Two blind men around the road to the cross
    body: |
      Mark sets this healing at the start of the part of his Gospel that follows Jesus from Galilee to Jerusalem, and he ends that part with another blind man, Bartimaeus, who receives his sight at once and follows Jesus “in the way” ([[Mark 10:46–52]]). Between them stand Peter’s confession and the three times Jesus foretells His death. To open and close a section with the same motif is called an *inclusio*, and here the motif is sight. The two healings are about the blind men, and they are also about disciples who did not yet see who Jesus was and what He came to do.

      The man at Bethsaida, seeing men as trees, is a picture of the Twelve in the very next scene. Peter will know that Jesus is the Christ, and will not yet accept that the Christ must suffer, die and rise again. He has had the first touch. Jesus could have healed the blind man at once; healing him in stages gives a pattern for the way Peter, the other disciples, and disciples since can come to a full testimony of the Savior, a step at a time. For the Twelve the clearer sight came after the Resurrection, with the gift of the Holy Ghost at Pentecost, a second healing of their own.
    sources: [huntsman-preludes-last-week, olson-we-believe, keller-mark-luke]
  - ref: 27
    phrase: the towns of Cæsarea Philippi
    kind: history
    title: Caesarea Philippi
    body: |
      Caesarea Philippi lay inland, near the main source of the Jordan at the foot of Mount Hermon, a town rebuilt and enlarged by Philip the tetrarch. Mark says “the towns,” the villages around it, and that the question came “by the way,” on the road. The journey gave Jesus time alone with the Twelve for confidential teaching, away from the crowds.
    sources: [bd-caesarea-philippi, talmage-jesus-christ-22]
  - ref: 28
    phrase: 'John the Baptist: but some say, Elias; and others, One of the prophets'
    kind: history
    title: John, Elijah, or one of the prophets
    body: |
      These are the answers Herod had heard ([[Mark 6:14–16]]), and none of them is “the Messiah.” Some, sharing Herod’s guilty fear, thought Jesus was John risen from the dead, though since the two had been known to be at work at the same time, few are likely to have believed it seriously. His preaching of repentance recalled John, and His miracles recalled Elijah, whose return Malachi had promised before “the great and dreadful day of the LORD” ([[Mal. 4:5]]); his coming was so eagerly awaited that some took Jesus for him. To the people Jesus was a prophet, but He had not measured up to their picture of the King and Deliverer they expected.
    sources: [talmage-jesus-christ-22, huntsman-preludes-last-week, sc-knowhy-348]
  - ref: 29
    phrase: Thou art the Christ
    kind: christ
    title: Thou art the Christ
    body: |
      Peter’s answer is the first time anyone in Mark’s story calls Jesus “the Christ.” Mark used the title in his opening line ([[Mark 1:1]]), and no one has said it since. *Christos* is the Greek for the Hebrew *māšîaḥ*, Messiah, “the anointed one,” a title used for the anointed king of Israel and for the anointed high priest. What Jesus’s contemporaries chiefly hoped for in the Messiah was a great king like David who would redeem Israel from her enemies, and many looked only for deliverance from Rome. Only the faithful came to see in Jesus the suffering servant of Isaiah ([[Isa. 53:3–5]]) as well as the King.

      Peter’s words are true, and in Mark they are brief. Matthew gives the fuller confession, “Thou art the Christ, the Son of the living God,” with Jesus’s blessing on Peter and the promise of the keys ([[Matt. 16:16–19]]), and Joseph Smith’s translation of Mark inserts “the son of the living God” here as well. Yet even with the fuller words, Peter did not yet understand what Jesus had come to do. The conversations on the road to Jerusalem show that the disciples seem to have shared the common expectation, and Peter’s rebuke in verse 32 is the first of them.
    sources: [huntsman-preludes-last-week, bd-messiah, jackson-jst-new-testament]
  - ref: 30
    phrase: he charged them that they should tell no man of him
    kind: history
    title: Why tell no man?
    body: |
      Jesus has silenced unclean spirits and many of the people He healed (see the note on [[Mark 1:44]]), and He has just told the blind man not to go into the town (verse 26). Now He silences His disciples, on the very point they have got right. The likeliest reason, on the reading given at 1:44, lies in what “Christ” meant to the people around them, and still to Peter: one who worked miracles, healed the sick, fed the hungry, and in the end would cast the Romans out of Judea. Before His death Jesus did not want people misled about what it means to be the Messiah. A proclamation by His closest disciples would also have aggravated the rulers’ hostility, and might easily have stirred revolt against Rome.

      The silence was for a season. The time for the apostles to proclaim their testimony came after He rose from the tomb, and then they went everywhere preaching ([[Mark 16:20]]).
    sources: [keller-mark-luke, smith-marks-unique-contribution, talmage-jesus-christ-22]
  - ref: 31
    phrase: the Son of man must suffer many things
    kind: christ
    title: The Son of man must suffer
    body: |
      Here the Gospel turns. Until now Mark has shown Jesus chiefly as the doer of mighty works; from this verse He is the suffering Son of Man, who will foretell His death three times on the way to Jerusalem ([[Mark 9:31]]; [[Mark 10:33–34]]) and then suffer, die and rise again. At the moment Peter names Him the Christ, Jesus redefines the role: to be the Christ is not the glorious calling one would expect, but suffering, rejection, death and resurrection.

      “Son of man” is Jesus’s own name for Himself (see the note on [[Mark 2:10]]). Among the ideas behind it are lowliness, humility and suffering, and this verse is one where that sense is plainest.

      Only Mark adds that “he spake that saying openly” (verse 32). The Greek means frankly, without concealment. Just after charging the disciples to tell no one that He was the Christ, Jesus told them without any reserve that the Christ would be rejected and killed, and it was the plainness of this announcement of apparent failure that startled them.
    sources: [huntsman-petrine-mark, easton-marcan-christology, bd-son-of-man, thayer, ellicott-mark]
  - ref: 33
    phrase: 'Get thee behind me, Satan'
    kind: words
    title: Get thee behind me, Satan
    body: |
      Peter took Jesus aside to rebuke Him; Jesus turned, looked at the rest of the disciples, and rebuked Peter where they could all hear. Only Mark has that look, and it took in the whole company of the disciples, not Peter only.

      Calling Peter “Satan” was a forceful figure of speech, not a name. The word means an adversary, one who puts himself in another’s way, and in urging Jesus to turn from suffering Peter was urging what Satan himself had tried to persuade Him to do. “Thou savourest not” is in the Greek a matter of where the mind is set: Peter was intent on what pleases men, not on what God wills, His saving purpose. Peter, and the others with him, saw more clearly only after Jesus’s death and Resurrection.
    sources: [ellicott-mark, talmage-jesus-christ-22, thayer, keller-mark-luke]
  - ref: 34
    phrase: take up his cross
    kind: history
    title: Take up his cross
    body: |
      Jesus calls the crowd together with the disciples, so the terms are for anyone who would follow Him, and He puts the cost first. He does not draw them with the promise of happiness or wealth or community, but tells them that following Him means self-denial and persecution; the promise of verse 35 lies on the far side of that loss.

      To His hearers the cross was no abstract figure. Crucifixion was a real part of their lives, and they would have understood at once what it cost. A condemned man was often made to carry the crossbeam on which his arms would be stretched to the place of execution, though apparently not in every case. To take up one’s cross was to walk that road. The Greek word for “deny,” *aparneomai*, suggests the breaking of every tie that binds a person, even to himself; at its center is submitting one’s will to the Father’s, as Jesus did ([[Luke 22:42]]).
    sources: [smith-marks-unique-contribution, strathearn-crucifixion]
  - ref: 35
    phrase: whosoever will save his life shall lose it
    kind: words
    title: Saving and losing one’s life
    body: |
      The saying turns on one Greek word, *psychē*, which the King James Version renders “life” in verse 35 and “soul” in verses 36–37. In Jesus’s sayings of this kind the word means, in one half, the life lived on earth, and in the other, the blessed life of the eternal kingdom of God. To cling to the first is to lose the second; to lose the first for Christ’s sake is to save the second. So the questions that follow ask what the whole world is worth beside that life, and what a man could give in exchange for it.

      Only Mark adds “and the gospel’s.” Joseph Smith’s translation makes the saying a matter of willingness: “whosoever will save his life, shall be willing to lay it down for my sake; and if he is not willing to lay it down for my sake, he shall lose it” (JST Mark 8:37). To the question of verse 37 it adds an answer: “Therefore deny yourselves of these, and be not ashamed of me” (JST Mark 8:39–40).
    sources: [thayer, jst-mark-8, lds-scriptures]
  - ref: 38
    phrase: ashamed of me and of my words in this adulterous and sinful generation
    kind: scripture
    title: Ashamed of Him
    body: |
      An “adulterous” generation is, figuratively, one faithless to God. The covenant between the Lord and Israel was likened to a marriage, so a people who turned from Him were said to commit adultery. To be ashamed of Christ and His words can mean giving way to such a generation’s scorn. Lehi saw it in his dream, where some who had come to the tree and tasted its fruit “were ashamed, because of those that were scoffing at them; and they fell away into forbidden paths and were lost” ([[1 Ne. 8:28]]).

      Jesus moves from “me” to “the Son of man” in the same sentence, and the shift from first person to third may be one reason the disciples did not fully understand that He meant Himself. Joseph Smith’s translation extends the verse with a warning and a promise. Those who are ashamed of Him “shall not have part in that resurrection when he cometh,” the first resurrection; and “he that layeth down his life for my sake and the gospel’s, shall come with him, and shall be clothed with his glory in the cloud, on the right hand of the Son of man” (JST Mark 8:42–43).
    sources: [thayer, lds-scriptures, lefevre-christology-jst, jst-mark-8]

christ: |
  Mark 8 shows Jesus Christ as a Messiah His people did not expect. He feeds the hungry and refuses a sign, and the moment He is confessed as the Christ He teaches that the Christ must suffer, be killed and rise again. He is patient with disciples who see only in part, and the blind man at Bethsaida, touched a second time, shows them coming to see Him in stages. Disciples still come to know Him that way, for “he that receiveth light, and continueth in God, receiveth more light; and that light groweth brighter and brighter until the perfect day” ([[D&C 50:24]]). His terms have not changed either: to come after Him is to deny oneself, take up the cross, and not be ashamed of Him or of His words.

explore: |
  - **The other tellings.** [[Matt. 15:32–16:28]]; [[Luke 9:18–27]].
  - **The first feeding, and the night that followed it.** [[Mark 6:30–52]].
  - **The road between two blind men.** Bartimaeus, [[Mark 10:46–52]], and the other two times Jesus foretells His death, [[Mark 9:30–32]] and [[Mark 10:32–45]].
  - **Signs and faith in this dispensation.** [[D&C 63:7–12]].
  - **The Son of Man.** [[Moses 6:57]].
  - **Mark 8–10 as a whole.** “Preludes to Jesus’s Last Week,” the opening chapter of *Greater Love Hath No Man* (Religious Studies Center), reads the blind man at Bethsaida, Peter’s confession and the three predictions together as the prelude to Holy Week.

