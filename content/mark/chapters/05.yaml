chapter: 5
title: Be Not Afraid, Only Believe
tagline: On the far shore Jesus frees a man possessed by a legion of devils and sends him home to tell what God has done; back across the sea a woman is healed by touching His clothes, and a ruler’s twelve-year-old daughter is raised from the dead.
when: 'During Jesus’s ministry in Galilee, straight after the stilling of the storm ([[Mark 4:35–41]]); the order this site follows'

setting: |
  Mark 5 finishes the crossing that began when Jesus said, “Let us pass over unto the other side” ([[Mark 4:35]]). The storm stilled, the boat lands in the country of the Gadarenes, on the eastern shore, in the region of the ten cities called the Decapolis, east and southeast of the lake, whose people were mostly Greek. So the first story is set among Gentiles, with a herd of swine on the hillside. Then Jesus crosses back to the vicinity of Capernaum, where a crowd is waiting and a ruler of the synagogue falls at His feet.

  The chapter holds two stories, and the second is really two. Mark often sets one story inside another so that each explains the other, and here the healing of a woman who had bled for twelve years (verses 25–34) interrupts the raising of a girl twelve years old (verses 21–24, 35–43). Matthew tells both stories more briefly, and Mark alone keeps the Aramaic words Jesus spoke to the girl ([[Matt. 8:28–34]]; [[Matt. 9:18–26]]); Luke tells them too ([[Luke 8:26–56]]).

thread: |
  **On one short journey Jesus shows Himself master of the sea, of devils, of disease and of death, and asks of those who meet that power not fear but faith.**

  A man whom no chain could hold is freed by a word, and the people who see him “sitting, and clothed, and in his right mind” are afraid and beg Jesus to leave (verses 15, 17). A woman whom twelve years of physicians could not help is healed by a touch, and comes forward “fearing and trembling,” to hear “thy faith hath made thee whole” (verses 33–34). A father is told his daughter is dead, and Jesus answers, “Be not afraid, only believe” (verse 36). Mark sets the woman’s story inside the father’s, so that the faith of the one is told while the other waits.

sections:
  - range: 1-13
    heading: The man among the tombs
    plain: |
      They came to the other side of the lake, to the region of the Gadarenes. As soon as Jesus stepped out of the boat, a man with an unclean spirit came out of the tombs to meet Him. He lived among the tombs, and no one could hold him any longer, not even with chains. He had often been bound hand and foot, but he tore the chains apart and broke the shackles; no one was strong enough to subdue him. Night and day, in the hills and among the tombs, he kept crying out and cutting himself with stones. When he saw Jesus from a distance, he ran and knelt before Him and shouted at the top of his voice, “What do you want with me, Jesus, Son of the Most High God? I beg you by God, do not torment me!” For Jesus had been saying to him, “Come out of the man, you unclean spirit.” Jesus asked him, “What is your name?” He answered, “My name is Legion, for we are many.” And he begged Jesus again and again not to send them out of the region. A large herd of pigs was feeding there on the hillside, and the devils begged Him, “Send us into the pigs; let us go into them.” Jesus let them. The unclean spirits came out and went into the pigs, and the herd, about two thousand of them, rushed down the steep bank into the lake and were drowned.
  - range: 14-20
    heading: Sent home to tell
    plain: |
      The men tending the pigs ran off and reported it in the town and in the countryside, and people came out to see what had happened. When they came to Jesus and saw the man who had been possessed by the legion sitting there, dressed and in his right mind, they were afraid. Those who had seen it told them what had happened to the possessed man, and about the pigs. Then they began to beg Jesus to leave their region. As Jesus was getting into the boat, the man who had been possessed begged to go with Him. Jesus did not let him, but said, “Go home to your own people and tell them how much the Lord has done for you, and how He has had mercy on you.” So the man went away and began to proclaim in the Decapolis how much Jesus had done for him, and everyone was amazed.
  - range: 21-24
    heading: Jairus pleads for his daughter
    plain: |
      When Jesus had crossed back over by boat to the other side, a large crowd gathered around Him by the lake. One of the rulers of the synagogue, named Jairus, came, and when he saw Jesus he fell at His feet and pleaded earnestly, “My little daughter is dying. Please come and lay your hands on her, so that she will be healed and live.” Jesus went with him, and a large crowd followed and pressed around Him.
  - range: 25-34
    heading: The woman who touched His clothes
    plain: |
      A woman was there who had suffered from bleeding for twelve years. She had endured a great deal under many doctors and had spent everything she had, yet instead of getting better she grew worse. She had heard about Jesus, and she came up behind Him in the crowd and touched His cloak, because she said, “If I can only touch His clothes, I will be healed.” At once her bleeding stopped, and she felt in her body that she was freed from her suffering. Jesus knew at once that power had gone out from Him. He turned around in the crowd and asked, “Who touched my clothes?” His disciples said, “You see the crowd pressing around you, and you ask, ‘Who touched me?’” But He kept looking around to see who had done it. Then the woman, frightened and trembling, knowing what had happened to her, came and fell at His feet and told Him the whole truth. He said to her, “Daughter, your faith has healed you. Go in peace, and be freed from your suffering.”
  - range: 35-43
    heading: Talitha cumi
    plain: |
      While He was still speaking, some people came from the house of Jairus and said, “Your daughter is dead. Why bother the Teacher any more?” Jesus overheard what they said and told the ruler, “Don’t be afraid; just believe.” He let no one follow Him except Peter, James, and John the brother of James. When they came to the ruler’s house, He saw the commotion, with people weeping and wailing loudly. He went in and said to them, “Why all this uproar and weeping? The child is not dead but asleep.” And they laughed at Him. After He put them all out, He took the child’s father and mother and the disciples who were with Him, and went in where the child was. He took her by the hand and said to her, “Talitha cumi,” which means, “Little girl, I say to you, get up.” Immediately the girl stood up and walked around; she was twelve years old. At this they were completely astonished. He gave strict orders that no one should know about this, and told them to give her something to eat.

notes:
  - ref: 1
    phrase: the country of the Gadarenes
    kind: history
    title: A Gentile shore
    body: |
      “The other side of the sea” is Gentile country, and a herd of swine is feeding on its hills. The eastern and southeastern shore of the lake belonged to the district called the Decapolis, the “ten cities,” whose people were a mix of Greeks, Syrians, Arabs and Jews, the Greeks the largest part; it is in the Decapolis that the healed man will tell his story (verse 20).

      The name of the place differs between the Greek editions and the Gospels. The King James Version reads “Gadarenes” here, the SBL and Nestle editions of the Greek read “Gerasenes,” and Matthew has “Gergesenes” ([[Matt. 8:28]]). The difference probably matters less than it seems: the phrase names a region, not a town, and towns called Gadara, Gerasa and Gergesa all stood in that region, so it could properly be called after more than one of them.
    sources: [bd-decapolis, greek-nt, talmage-jesus-christ-20]
  - ref: 7
    phrase: thou Son of the most high God
    kind: christ
    title: The unclean spirit knows who He is
    body: |
      The first voice in this land to name Jesus is a devil’s, and it names Him rightly. In Mark the title “Son of God” comes from God at the baptism and on the mount, from the narrator in the first verse, from the centurion at the cross, and from the unclean spirits ([[Mark 1:1]]; [[Mark 1:11]]; [[Mark 3:11]]; [[Mark 9:7]]; [[Mark 15:39]]). Mark sets their knowledge against the blindness of the religious leaders: the servants of Satan knew who Jesus was when the scribes and Pharisees did not. Jesus did not want testimony from devils, and in Galilee He had silenced them ([[Mark 3:12]]).

      The man’s running and falling down before Jesus (verse 6) seems to have been impelled by the spirit that controlled him, and the strangest line in the verse is the spirit’s too: “I adjure thee by God” (the footnote gives “implore”), a devil invoking God against the Son of God, spoken with blasphemous presumption. The spirits knew they were in the presence of the Master and that they must obey Him; all they could do was plead.
    sources: [smith-marks-unique-contribution, keller-mark-luke, talmage-jesus-christ-20]
  - ref: 9
    phrase: 'My name is Legion: for we are many'
    kind: words
    title: Legion
    body: |
      “Legion” is a Latin word, the name of a unit of the Roman army, which in the time of Augustus numbered about 6,800 men, foot soldiers and horsemen together. Mark writes it as a Latin loanword in Greek, one of several Latin words in his Gospel that suggest he wrote for readers in the Roman world. To anyone who had seen Roman troops, the name meant an army.

      The reply shifts from singular to plural: Jesus asks the man his name, and the answer begins “My name” and ends “we are many.” The shift suggests a possession so complete that the man could no longer tell his own self from the spirits that held him. The story’s end answers that: the same man is found sitting, clothed and “in his right mind,” and he speaks for himself, asking to go with Jesus (verses 15, 18).
    sources: [thayer, huntsman-petrine-mark, talmage-jesus-christ-20]
  - ref: 13
    phrase: entered into the swine
    kind: history
    title: Why the devils wanted the swine
    body: |
      The devils ask for the swine because they want a body, any body. Joseph Smith taught that “the Devil has no body, and herein is his punishment”; cast out by the Savior, the devil asked to go into the swine, “showing that he would prefer a swines body to having none.” Their first plea was not to be sent out of the country (verse 10); their second is for flesh to live in. To a Jewish reader there is a further fitness in the scene: swine were unclean under the law of Moses ([[Lev. 11:7]]), so the unclean spirits go into unclean animals.

      Jesus gave them leave; He did not command them to destroy the herd. What became of the swine was the work of the spirits who entered them. One Latter-day Saint reading sees more in the drowning: the swine were probably food for the Roman army, and their drowning in the sea re-enacts the drowning of Pharaoh’s army ([[Ex. 14:28]]). Its author grants that the allusion is subtle, and Mark does not draw it.
    sources: [wjs-1841-01-05, lds-scriptures, talmage-jesus-christ-20, smith-redemptive-mark]
  - ref: 17
    phrase: they began to pray him to depart out of their coasts
    kind: history
    title: Why they asked Him to leave
    body: |
      The people of the district saw a man they had all feared now sitting quietly, clothed and sane, and they were afraid, not of the man but of the One who could work such wonders (verse 15). Their fear was most likely the fear sinful people feel in the presence of the Righteous. Many of them were not Israelites and knew little of the God of Israel, and their request recalls Peter’s first cry at a miracle, “Depart from me; for I am a sinful man, O Lord” ([[Luke 5:8]]).

      Jesus did as they asked and got into the boat (verse 18), but He left a witness behind (verse 19).
    sources: [talmage-jesus-christ-20]
  - ref: 19
    phrase: Go home to thy friends, and tell them how great things the Lord hath done for thee
    kind: history
    title: Sent home to tell
    body: |
      Mark’s general rule is secrecy: again and again Jesus tells those He heals to say nothing (see the note on [[Mark 1:44]]), so this command stands out as an exception, and it is given to a Gentile. Mark does not say why, and the reason should not be pressed beyond what the text gives; Christ knew in His own wisdom when to forbid and when to permit the telling of His works. What the text does show is that the region had just asked Jesus to leave, and the one man who wanted to go with Him was sent to stay. He became a missionary, not only in his own town but through the ten cities of the Decapolis (verse 20).

      There is a small shift between the two verses. Jesus tells him to tell what “the Lord” has done (Luke has “God,” [[Luke 8:39]]); the man goes and tells “how great things Jesus had done for him.”
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-20]
  - ref: 22
    phrase: one of the rulers of the synagogue, Jairus by name
    kind: history
    title: A ruler of the synagogue at His feet
    body: |
      The ruler of the synagogue was the chief official of a town’s Jewish meetinghouse: generally a scribe, he had the care of the building and oversaw its services. So the man who falls at Jesus’s feet is a leading figure in the local religious life, and his coming shows how deep an impression Jesus had made even among the religious leaders. Few of the upper classes were willing to give up standing and popularity by owning themselves His disciples.

      That Jairus came when his daughter was dying does not mean he had not believed before; his falling down before Jesus, and his confidence that a touch of Jesus’s hands would save her, show a faith already real.
    sources: [bd-synagogue, talmage-jesus-christ-20]
  - ref: 23
    phrase: come and lay thy hands on her
    kind: history
    title: Lay thy hands on her
    body: |
      Jairus asks Jesus to lay His hands on his daughter, and the request has a meaning. The laying on of hands, in the Old Testament and the New, was understood as a gesture of transfer: through the hands, power, spiritual gifts and authority passed from the one who laid them on to the one who received them. Jairus believed that what was in Jesus could pass to his daughter through His hands.

      Jesus does not, in the end, lay hands on the girl; He takes her by the hand and speaks (verse 41).
    sources: [calabro-nonverbal]
  - ref: 25
    phrase: an issue of blood twelve years
    kind: history
    title: Twelve years unclean
    body: |
      Her illness was more than a physical trial. Under the law of Moses a woman whose flow of blood continued beyond its time was unclean for as long as it lasted, and so was anything she lay or sat on; whoever touched those things had to wash and was unclean until evening ([[Lev. 15:25–27]]). For twelve years, then, she had made unclean whatever and whomever she touched. Most likely her family had stopped touching her, and her friends had long since left her.

      Luke says only that she “spent all her living upon physicians” ([[Luke 8:43]]); Mark adds that she “had suffered many things of many physicians” and “was nothing bettered, but rather grew worse” (verse 26). She was spent in body, in standing, in money and in heart, but not in faith. By the purity law she should not have been in a crowd at all, still less touching a teacher. She seems to have planned to reach Him unnoticed, coming up “behind,” in the press.
    sources: [lds-scriptures, olson-ministered, smith-redemptive-mark]
  - ref: 32
    phrase: he looked round about to see her that had done this thing
    kind: christ
    title: Why He asked who touched Him
    body: |
      Jesus did not ask “Who touched my clothes?” because He needed the information. The question was more than a request for a name: He knew that power had gone out of Him (verse 30), an actual giving of His own strength to the one He healed. The disciples thought the question absurd in such a crush (verse 31), but He kept looking until she came forward. The woman had planned to be healed unseen, perhaps without making Him unclean and without bringing on herself her neighbors’ scorn; now her faith had to stretch further, to acknowledge publicly what she had done.

      There were reasons for the public moment. Her faith was sincere, but it seems to have been incomplete: she believed that healing flowed from His person and even His clothes, and may not have known that it was His to give at His will in answer to faith. Leading her to confess corrected that and confirmed her faith, and it gave her what the touch alone could not, His own word that she was healed. A question asked by one who already knows has a moral purpose: it gives the person the chance to come forward freely. So a healing she meant to keep secret Jesus made public, when in many other cases He told those He healed to keep quiet.
    sources: [olson-ministered, talmage-jesus-christ-20]
  - ref: 34
    phrase: Daughter, thy faith hath made thee whole
    kind: christ
    title: Daughter, and made whole
    body: |
      “Made thee whole” translates the Greek *sōzō*, “to save.” It means to heal a sick person and restore them to health, and it is also the New Testament’s word for being saved in the full religious sense. Mark uses it three times in this story: Jairus asks that his daughter “may be healed” (verse 23), the woman thinks “I shall be whole” (verse 28), and Jesus tells her “thy faith hath made thee whole.” The healing of her body is real, and the word leaves room for more.

      “Daughter” is His only word to her that is a name; Mark never gives her own. It gives her a new identity, and it recalls the family Jesus had just defined: “whosoever shall do the will of God, the same is my brother, and my sister, and mother” ([[Mark 3:35]]). One Latter-day Saint reading sees the woman’s story as a reversal of Eve’s story in Genesis 3: a woman’s forbidden touch, a question about what she had done, and this time no shifting of blame, for she “told him all the truth” (verse 33), and the story ends not in a curse but in “go in peace.” It is a reading, offered as one; what the text says plainly is that she is healed, named and sent away in peace.
    sources: [thayer, smith-redemptive-mark]
  - ref: 36
    phrase: Be not afraid, only believe
    kind: christ
    title: Be not afraid, only believe
    body: |
      “Be not afraid, only believe” comes to Jairus after a delay that tested him. While Jesus stopped for the woman, messengers came to say the girl was dead and there was no reason to trouble the Master further (verse 35). Mark records no impatience from Jairus at the interruption; he had put his trust in Jesus and waited on His time. And in the interval he had seen a woman, ill for as long as his daughter had been alive, reach out in faith, perhaps a greater faith than he had brought to his first request, and be healed.

      So Jesus’s words come at the moment Jairus’s faith was most sorely tried, and they sustain it. “Be not afraid” answers the fear the message brought; “only believe” asks him to go on believing now that the worst had happened, and he had just heard Jesus tell the woman, “thy faith hath made thee whole” (verse 34).
    sources: [talmage-jesus-christ-20, olson-ministered]
  - ref: 39
    phrase: the damsel is not dead, but sleepeth
    kind: history
    title: Mourners, and a short sleep
    body: |
      The “tumult” Jesus finds is the mourning of His day. Professional mourners, singers of dirges and flute players had already been summoned, as mourning women had long been called in Israel ([[Jer. 9:17]]). Burial followed death as quickly as possible, and the preparations were already under way. The mourners knew the girl was dead, which is why they laughed.

      Jesus did not mean she was only in a coma. Speaking of death as sleep was common in the speech of the time, and the mourners took His words more literally than the context warrants. He meant that her sleep would be short. He uses the same figure of Lazarus, “Our friend Lazarus sleepeth,” and then says plainly, “Lazarus is dead” ([[John 11:11–14]]).
    sources: [talmage-jesus-christ-20, lds-scriptures]
  - ref: 41
    phrase: Talitha cumi
    kind: words
    title: Talitha cumi
    body: |
      “Talitha cumi” are the Aramaic words Jesus spoke to the girl, kept as He spoke them. *Talitha* is the feminine of the Aramaic word for “a youth,” so “little girl” or “maiden”; *cumi* is the command “arise,” in its feminine form. A plainer English rendering is “Little one, get up,” the words of someone speaking gently to a child, and they show the tenderness Jesus had for her. With them He took her “by the hand,” the Greek for a firm, sustained grasp.

      Mark keeps more of Jesus’s Aramaic words than any other Gospel, and he translates them, as he does here, which suggests his readers did not speak Aramaic. Why the original words were kept at all is less certain. One explanation is that the very syllables Jesus spoke on such occasions were remembered as words of power and attracted special notice.
    sources: [thayer, skinner-life-jesus, calabro-nonverbal, farnes-synoptic-gospels, ellicott-mark]
  - ref: 42
    phrase: for she was of the age of twelve years
    kind: structure
    title: Two daughters, twelve years
    body: |
      Mark tells the girl’s age at the very end, and the detail ties the two stories he has woven together. The woman’s healing (verses 25–34) is set inside the story of Jairus’s daughter (verses 21–24, 35–43), one of Mark’s “sandwiches,” in which the stories explain each other. The woman had been ill for twelve years; the girl had lived twelve years. Matthew tells both stories but gives no age ([[Matt. 9:18–26]]), so only in Mark does the number join them. Twelve also recalled the twelve tribes, so that both may stand for Israel.

      Set side by side, they are two daughters. The girl is a daughter of the synagogue, literally, the child of its ruler, and she is healed through her father’s plea. The woman reaches out for herself and speaks for herself, and Jesus calls her “Daughter” (verse 34). One Latter-day Saint reading adds that between them the two stories undo both effects of the Fall: the woman’s story, read as a reversal of Eve’s (see the note on verse 34), answers sin, or spiritual death, and the raising of the girl around it answers physical death.
    sources: [smith-marks-unique-contribution, smith-redemptive-mark]
  - ref: 42
    phrase: straightway the damsel arose, and walked
    kind: christ
    title: Raised to mortal life
    body: |
      By raising the girl Jesus showed His power over death and foreshadowed His own resurrection. Mark ties the two scenes together in his wording: the word Jesus speaks, “arise” (*egeirō*), is the word the angel uses at the tomb, “he is risen” ([[Mark 16:6]]); Jesus is laughed at here and mocked at His trial (verse 40; [[Mark 14:65]]); and the “astonishment” (*ekstasis*) of the parents is a word Mark uses again only of the women who fled the empty tomb ([[Mark 16:8]]).

      But this was not a resurrection. The girl’s spirit and body were reunited, and she resumed her mortal life; she would die again. Jesus Christ was the first to come forth from the tomb an immortal being. Elijah and Elisha had raised children before Him, after long effort and earnest prayer to Jehovah ([[1 Kgs. 17:17–22]]; [[2 Kgs. 4:32–35]]); Jesus, who was Jehovah in the flesh, only took her hand and spoke.
    sources: [skinner-life-jesus, smith-redemptive-mark, talmage-jesus-christ-20]
  - ref: 43
    phrase: he charged them straitly that no man should know it
    kind: history
    title: Silence, and something to eat
    body: |
      Mark does not say why Jesus charged them to tell no one; on the commands to silence across Mark, see the note on [[Mark 1:44]]. In this case the command could hardly keep the fact secret: the mourners who had laughed knew the girl had died, and people would ask how so great a wonder had been done. The contrast with verse 19 is plain: the man in Gentile country was sent to tell, and those in Jairus’s house are told to keep still.

      The last command is the most ordinary in the chapter. The girl was to be given something to eat, because with her life restored her body’s needs had returned.
    sources: [talmage-jesus-christ-20]

christ: |
  Mark 5 shows Jesus Christ as the Lord of every power that holds a person captive: a legion of devils leaves at His word, a woman’s twelve years of illness end at a touch of His clothes, and a dead child rises when He takes her hand. Nephi had seen this ministry in vision, the sick and those “afflicted … with devils and unclean spirits” healed “by the power of the Lamb of God” ([[1 Ne. 11:31]]), and the raising of a girl to mortal life pointed to His own rising to immortality. The same power holds for disciples now: the devil “has no power over us only as we permit him,” and to one in fear the Lord’s word is still “Be not afraid, only believe.”

explore: |
  - **The other tellings.** [[Matt. 8:28–34]] and [[Luke 8:26–39]] for Legion; [[Matt. 9:18–26]] and [[Luke 8:40–56]] for Jairus and the woman.
  - **Peter, James and John apart.** The three whom Jesus lets into the room He takes up the mount ([[Mark 9:2]]) and into Gethsemane ([[Mark 14:33]]); in the latter days they conferred the Melchizedek Priesthood on Joseph Smith and Oliver Cowdery ([[D&C 27:12–13]]).
  - **Raised to life, and resurrection.** [[1 Cor. 15:20–23]]; [[Alma 11:42–45]].
  - **A fuller reading of the woman’s story** as a reversal of Genesis 3: “A Redemptive Reading of Mark 5:25–34,” in *Interpreter*.

