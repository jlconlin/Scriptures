chapter: 7
title: That Which Cometh Out of the Man
tagline: Scribes from Jerusalem find fault with unwashed hands, and Jesus teaches that defilement comes from the heart; then, beyond the borders of Israel, a Gentile mother’s answer frees her daughter, and in the Decapolis a deaf man hears and speaks.
when: 'Shortly after the Passover near which the five thousand were fed ([[John 6:4]]); in Galilee, then the borders of Tyre and Sidon and the Decapolis'

setting: |
  Mark 7 follows the feeding of the five thousand and the walk on the sea, shortly after the Passover that John sets beside that feeding ([[John 6:4]]). Opposition was hardening. Men sent from Jerusalem had been watching Jesus in Galilee and noting every custom He or His disciples left unkept, and now a delegation of Pharisees and scribes from Jerusalem comes, probably on a plan of the rulers, to protest. Scribes “which came down from Jerusalem” had already charged Him with casting out devils by Beelzebub ([[Mark 3:22]]).

  The chapter holds three stories, all told also in Matthew ([[Matt. 15:1–31]]): the dispute over the tradition of the elders (verses 1–23), a Gentile mother’s plea in the borders of Tyre (24–30), and the healing of a deaf man in the Decapolis (31–37). Mark tells them for readers who did not know Jewish ways, likely an audience that was largely Gentile: he stops to explain the washings, which Matthew does not, and he keeps two Aramaic words, Corban and Ephphatha, and translates them.

  Then Jesus goes north into Phoenicia, beyond the borders of the land of Israel, where His fame had gone before Him, and comes back by way of the Decapolis, among semi-pagan peoples.

thread: |
  **Jesus moves defilement from the hands to the heart, and then carries His mercy beyond the borders of Israel.**

  The Pharisees’ holiness was a holiness of the table: washed hands, purified vessels, and no meals with those who did not keep the rules. Jesus answers that nothing going into a man can defile him; evil comes “from within, out of the heart” (verse 21). Only Mark has the line, “purging all meats,” that can be read as the narrator’s note that in saying this He made all foods clean (verse 19), likely written with Gentile readers in mind, and the disciples do not yet understand (verse 18). Then the scene moves beyond Israel. A Greek woman, a Gentile, asks for crumbs and understands Jesus well enough to answer Him; in the Decapolis the deaf hear and the dumb speak. The words on food anticipate what Peter was taught years later in a vision of unclean animals, “What God hath cleansed, that call not thou common” ([[Acts 10:15]]), and he came to see that the vision was about people: “God hath shewed me that I should not call any man common or unclean” ([[Acts 10:28]]).

sections:
  - range: 1-13
    heading: The tradition of the elders
    plain: |
      The Pharisees and some of the scribes who had come from Jerusalem gathered around Jesus. They saw some of His disciples eating with hands that were ritually unclean, that is, unwashed, and they found fault. (The Pharisees, and indeed all the Jews, do not eat unless they have washed their hands in the prescribed way, keeping the tradition of the elders. When they come from the market they do not eat unless they wash. And they hold to many other traditions, such as the washing of cups, pots, bronze vessels and tables.) So the Pharisees and scribes asked Him, “Why do your disciples not live by the tradition of the elders, but eat with unclean hands?” He answered, “Isaiah prophesied rightly about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me. They worship me in vain, teaching as doctrines the commandments of men.’ You leave the commandment of God and hold to the tradition of men, such as washing pots and cups, and you do many other things like it.” And He said to them, “You have a fine way of setting aside the commandment of God in order to keep your own tradition! For Moses said, ‘Honor your father and your mother,’ and, ‘Whoever curses father or mother must be put to death.’ But you say that if a man tells his father or mother, ‘Whatever help you might have had from me is Corban’ (that is, a gift devoted to God), he is free of them. You no longer let him do anything for his father or mother. So you make the word of God void through the tradition you have handed down, and you do many things like that.”
  - range: 14-23
    heading: What defiles a man
    plain: |
      Then He called the crowd to Him again and said, “Listen to me, all of you, and understand. Nothing outside a man can defile him by going into him; it is what comes out of a man that defiles him. If anyone has ears to hear, let him hear.” When He had left the crowd and gone into the house, His disciples asked Him about the saying. He said, “Are you also without understanding? Do you not see that whatever goes into a man from outside cannot defile him, because it does not go into his heart but into his stomach, and then passes out into the drain, purging all foods?” He went on: “What comes out of a man is what defiles him. For from within, out of the heart of men, come evil thoughts, adulteries, sexual immorality, murders, thefts, greed, wickedness, deceit, shameless lust, envy, blasphemy, pride and folly. All these evil things come from within, and they defile a man.”
  - range: 24-30
    heading: The Syrophenician woman
    plain: |
      From there Jesus went to the region of Tyre and Sidon. He entered a house and did not want anyone to know He was there, but He could not stay hidden. A woman whose little daughter had an unclean spirit heard about Him at once, and came and fell at His feet. She was a Greek, a Gentile, born in Syrian Phoenicia, and she begged Him to drive the devil out of her daughter. Jesus said to her, “Let the children be fed first; it is not right to take the children’s bread and throw it to the little dogs.” She answered, “Yes, Lord; yet even the little dogs under the table eat the children’s crumbs.” He said to her, “Because of this answer, go your way; the devil has gone out of your daughter.” When she got home, she found the devil gone and her daughter lying on the bed.
  - range: 31-37
    heading: Ephphatha
    plain: |
      Then He left the region of Tyre and Sidon and came back to the Sea of Galilee, through the middle of the region of the Decapolis. There some people brought to Him a man who was deaf and could hardly speak, and they begged Him to lay His hand on him. Jesus took him aside, away from the crowd, put His fingers into his ears, spat, and touched his tongue. Then He looked up to heaven, sighed, and said to him, “Ephphatha,” which means, “Be opened.” At once his ears were opened, his tongue was set free, and he spoke plainly. Jesus ordered them to tell no one, but the more He ordered them, the more widely they proclaimed it. They were utterly astonished, and said, “He has done everything well. He even makes the deaf hear and the mute speak.”

notes:
  - ref: 3
    phrase: except they wash their hands oft, eat not
    kind: history
    title: Why Mark explains the washings
    body: |
      Mark stops the story to explain the washings, which Matthew tells without explanation ([[Matt. 15:2]]), likely because his readers, who may have been largely Gentile, would not otherwise have followed the argument. The charge was ceremonial uncleanness, not dirty fingers: the disciples ate with “common or defiled” hands. The Pharisees sought to bring the temple’s holiness into every home, and at a meal that meant purifying vessels and washing hands so that ordinary food was eaten in ritual purity (see the note on [[Matt. 15:2]]). Mark presents the handwashing as the practice of “all the Jews,” not as a Pharisaic novelty; Jesus’s quarrel, as the next verses show, is not with the custom itself but with a tradition used to set aside a commandment of God.

      “Oft” reflects one of two readings in the Greek manuscripts. The text behind the King James Version and the modern critical text both read *pygmē*, “with the fist”: washing so that one hand is rubbed with the clenched fist of the other, that is, thoroughly; one edition has the word for “often,” which is the sense the King James gives.
    sources: [talmage-jesus-christ-22, lane-hostility, smith-marks-unique-contribution, shannon-torah-mouth, greek-nt, thayer]
  - ref: 7
    phrase: teaching for doctrines the commandments of men
    kind: scripture
    title: Isaiah’s words, in their Greek form
    body: |
      Mark’s wording of Isaiah’s rebuke differs from the King James Isaiah because it is close to the Greek Old Testament rather than the Hebrew. Where the King James Isaiah, translated from the Hebrew, ends “their fear toward me is taught by the precept of men” ([[Isa. 29:13]]), the Septuagint has “in vain do they worship me,” as Mark’s verse 7 does; Matthew quotes the same form (see the note on [[Matt. 15:8]]).

      The Lord spoke these words again in 1820, to Joseph Smith in the grove, in Mark’s very phrasing: “they teach for doctrines the commandments of men” ([[JS—H 1:19]]).
    sources: [lxx-rahlfs, lds-scriptures]
  - ref: 10
    phrase: For Moses said, Honour thy father and thy mother
    kind: scripture
    title: Ye keep not the law
    body: |
      Joseph Smith’s translation makes the accusers the lawbreakers. In it Jesus says the Pharisees’ condemnation was written “by the prophets whom ye have rejected,” and before He cites Moses He tells them, “Ye have kept not the ordinances of God”; after it, “but ye keep not the law” (JST Mark 7:10–12). The men who found fault with His disciples for neglecting the tradition of the elders were themselves failing to keep the law of Moses.

      The written law itself Jesus fully upheld, though He did not accept the oral traditions the teachers had built up over the centuries; He sent a cleansed leper to the priest to offer “those things which Moses commanded” ([[Mark 1:44]]).
    sources: [jst-mark-7, judd-jerusalem-conference]
  - ref: 11
    phrase: It is Corban, that is to say, a gift
    kind: words
    title: Corban
    body: |
      *Corban* (*qorbān*) is the word the law uses for an offering brought to the altar ([[Lev. 1:2]]); by Jesus’s day it had come to mean a vow or dedication, and saying it was held to make a binding vow. Matthew has only “It is a gift” ([[Matt. 15:5]]); Mark keeps the word and translates it. How the vow let a son hold himself free of his parents, and how Jesus’s pairing of the commandment to honor them with the penalty for cursing them ([[Ex. 20:12]]; [[Ex. 21:17]]) makes the charge heavier, is explained in the note on [[Matt. 15:5]].

      The word itself may explain why Jesus reached for the verse on cursing. On an ancient burial box (an ossuary), *qorbān* seems to be used in a curse formula against anyone who disturbs the bones, and the study that reports the inscription offers this as possible background to Jesus’s quoting Exodus 21:17.
    sources: [shannon-torah-mouth, bd-corban]
  - ref: 19
    phrase: purging all meats
    kind: words
    title: Purging all meats
    body: |
      In the King James wording the drain seems to purge the food, which is hard to make sense of. The verb is *katharizō*, “to make clean,” the verb the voice uses to Peter in “What God hath cleansed” ([[Acts 10:15]]). The puzzle is grammatical. In the Greek text behind the King James Version the participle is neuter, as if what “goeth out” did the cleansing; the older manuscripts, followed by modern editions, have it masculine, and the word then goes best with Jesus, who “saith” in verse 18: in so saying, He made all foods clean. Read that way, the line is the narrator’s comment, “Thus he declared all foods clean,” and only Mark has it. Dietary rules were a hard question for the early Church and Mark’s readers were likely Gentile, so it is easy to see why he would include it; it is possible to read it as Mark’s own explanation of what Jesus’s words meant.

      Did Jesus set aside the food laws that day? The risen Lord declared to the Nephites, “in me is the law of Moses fulfilled” ([[3 Ne. 9:17]]): the law was fulfilled not at His birth but at His death, so His disciples were bound to keep it through His mortal ministry. The words anticipated what Peter was taught later: years afterward, he still defended his faithful observance of the law, “I have never eaten any thing that is common or unclean,” until a vision taught him what God had cleansed ([[Acts 10:14–15]]).
    sources: [thayer, greek-nt, ellicott-mark, smith-marks-unique-contribution, lds-scriptures, judd-jerusalem-conference]
  - ref: 22
    phrase: an evil eye
    kind: words
    title: An evil eye
    body: |
      Mark’s list of what comes out of the heart is longer than Matthew’s ([[Matt. 15:19]]), and two of its words need explaining. “An evil eye” is a Hebrew idiom for envy, the grudging look at another’s good: “Eat thou not the bread of him that hath an evil eye” ([[Prov. 23:6]]), and the householder’s question in the parable, “Is thine eye evil, because I am good?” ([[Matt. 20:15]]).

      “Lasciviousness” translates *aselgeia*, unbridled lust, excess, wantonness, shamelessness: conduct that has thrown off restraint. Standing alone in a list, it leaves uncertain which particular vice is meant.
    sources: [thayer]
  - ref: 24
    phrase: 'would have no man know it: but he could not be hid'
    kind: history
    title: He could not be hid
    body: |
      Jesus went north looking for quiet. In Galilee He could find neither rest nor the chance to teach the Twelve as He wished, so He took them into the borders of Phoenicia and lodged in a town near the frontier. It did not work. His fame had gone ahead of Him beyond the land of Israel; people from around Tyre and Sidon had come to hear Him in Galilee long before ([[Mark 3:8]]).

      Joseph Smith’s translation gives the reason He “could not be hid”: “and would that no man should come unto him. But he could not deny them; for he had compassion upon all men” (JST Mark 7:22–23, in the footnote). In that reading He could not be hidden because He would not turn away those who came, and the compassion is for “all men,” Gentiles among them.
    sources: [talmage-jesus-christ-22, lds-scriptures]
  - ref: 26
    phrase: The woman was a Greek, a Syrophenician by nation
    kind: history
    title: A Greek, a Syrophenician
    body: |
      Mark describes her twice, and both words put her outside Israel. “A Greek” here means a Gentile woman, not a Jew, one who spoke Greek; “Syrophenician” names her people, from the Phoenicia that formed part of Syria, as distinct from the Phoenicians of Libya around Carthage. Matthew’s “a woman of Canaan” agrees, since the Phoenicians were of Canaanite descent, a people held in particular disrepute by the Jews (see the note on [[Matt. 15:22]]).
    sources: [thayer, talmage-jesus-christ-22]
  - ref: 27
    phrase: Let the children first be filled
    kind: christ
    title: The children first
    body: |
      Jesus’s answer sounds harsh, and two words in it soften it. The first is “first,” which only Mark records. Jesus made plain that she was not of the people to whom He had been sent, yet the word looks beyond them: His personal ministry, and that of the apostles while He was with them, was to the house of Israel, but the risen Christ was to be made known to every nation. In Mark He will send the Eleven “into all the world” ([[Mark 16:15]]). Joseph Smith’s translation names the children: “children of the kingdom first.”

      The second word is “dogs,” in the Greek the diminutive *kunarion*, “little dog”: not the stray curs of the street but the house dogs allowed under the table (see the note on [[Matt. 15:26]]). The image is of a household at a meal, where the children eat first and the pets wait, and that is the picture the woman takes up in her reply.
    sources: [talmage-jesus-christ-22, lds-scriptures, thayer]
  - ref: 29
    phrase: For this saying go thy way
    kind: christ
    title: For this saying
    body: |
      The woman took up Jesus’s image without offense and turned it into her plea: the little dogs are under the table, and they eat the children’s crumbs. Matthew ends with Jesus praising her “great” faith ([[Matt. 15:28]]; see the note there); Mark ends with “for this saying,” singling out her final plea, and she goes home to find her daughter lying on the bed, the devil gone.

      Mark sets her beside the disciples. A few verses earlier Jesus asked the Twelve, “Are ye so without understanding also?” (verse 18). In Mark the disciples Jesus chose often understand poorly, while minor characters who choose to follow Him, this Gentile mother among them, are much better disciples. Mark’s women, too, are drawn into work usually kept for men, and here that work is a theological exchange with Jesus.
    sources: [talmage-jesus-christ-22, smith-marks-unique-contribution]
  - ref: 31
    phrase: through the midst of the coasts of Decapolis
    kind: history
    title: A long way round
    body: |
      The route is roundabout. The better manuscripts read “from the coasts of Tyre … through Sidon,” and Sidon lay about twenty miles further north, so on that reading Jesus went away from the lake before turning back to it.

      He came back to the lake on its east side, through the Decapolis (see the note on [[Mark 5:1]]), still among semi-pagan peoples.
    sources: [ellicott-mark, talmage-jesus-christ-22]
  - ref: 33
    phrase: he spit, and touched his tongue
    kind: history
    title: Fingers, spittle and a sigh
    body: |
      This healing is done differently from Jesus’s usual way, and the difference fits the man. The people asked only that He lay His hand on him (verse 32); Jesus instead took him away from the crowd and spoke to him in touch. A deaf man could not hear the compassion in the Healer’s voice, and the touch filled that gap: fingers in the ears that were closed, spittle on the tongue that was bound. By that touch the man’s faith may have been strengthened and his confidence in the Master’s power increased.

      Then Jesus looked up to heaven, the gesture of prayer, as at Lazarus’s tomb ([[John 11:41]]), and “sighed.” The verb is used of praying with a sigh, and the sigh may be read as the sadness of sympathy at suffering, the same sorrow He showed before raising Lazarus.
    sources: [talmage-jesus-christ-22, ellicott-mark, thayer]
  - ref: 34
    phrase: Ephphatha, that is, Be opened
    kind: words
    title: Ephphatha
    body: |
      *Ephphatha* is an Aramaic command, “be thou opened,” that is, receive the power of hearing, since the ears of the deaf, like the eyes of the blind, were thought of as closed. In the next verse “the string of his tongue” is better “the bond” of his tongue, whatever held his speech captive, not a part of the body.

      As with “Talitha cumi” (see the note on [[Mark 5:41]]), Mark keeps the word and translates it. Both times the Aramaic comes at a healing, and perhaps Mark kept the actual wording because it had ritual significance. It has also been suggested that such words are the places where Jesus’s exact speech, rather than a paraphrase, is preserved, though there is no way to verify this.
    sources: [thayer, ellicott-mark, smith-marks-unique-contribution]
  - ref: 36
    phrase: he charged them that they should tell no man
    kind: history
    title: Tell no man, even here
    body: |
      Jesus gives the command He gives across Mark (see the note on [[Mark 5:43]]), here in Gentile country, where earlier He had sent the healed man of Gadara home to tell (see the note on [[Mark 5:19]]), the one exception in the Gospel. Mark never says why; the reasons Latter-day Saint readers give are in the note on [[Mark 1:44]].

      As so often in Mark, the command is broken, and Mark says so: the more He charged them, the more they published it.
    sources: [smith-marks-unique-contribution]
  - ref: 37
    phrase: he maketh both the deaf to hear, and the dumb to speak
    kind: scripture
    title: The deaf hear, the dumb speak
    body: |
      Mark may link the crowd’s praise to Isaiah’s promise of the day when God would come to save His people: “Then the eyes of the blind shall be opened, and the ears of the deaf shall be unstopped… and the tongue of the dumb sing” ([[Isa. 35:4–6]]). The word he uses in verse 32 for the man’s “impediment in his speech,” *mogilalos*, “speaking with difficulty,” is the word the Greek Old Testament uses for “the dumb” in Isaiah 35:6, and he may have chosen it to connect the miracle with that prophecy. The crowd’s praise is looser than Mark’s own description: the man was not mute, but spoke with difficulty.
    sources: [thayer, ellicott-mark]

christ: |
  Mark 7 shows Jesus Christ as the One who looks on the heart. He moves the question of defilement from washed hands and purified vessels to the heart, from which evil proceeds, and in Joseph Smith’s translation He cannot turn away even the Gentiles who seek Him, for He “had compassion upon all men.” For a disciple now, outward observance can leave the heart untouched: hands can be clean while the heart is not. Hearts are purified as disciples receive the Savior’s strengthening power; good works, necessary as they are, cannot produce a pure heart on their own.

explore: |
  - **The other tellings.** [[Matt. 15:1–31]].
  - **Isaiah’s rebuke in the latter days.** [[Isa. 29:13–14]] and the Lord’s words to Joseph Smith in [[JS—H 1:19]].
  - **What God hath cleansed.** Peter’s vision and Cornelius, [[Acts 10:9–35]], and the council at Jerusalem, [[Acts 15:1–29]].
  - **Clean hands and a pure heart.** [[Ps. 24:3–4]]; [[Mosiah 4:30]]; David A. Bednar, “Clean Hands and a Pure Heart,” general conference, October 2007.

