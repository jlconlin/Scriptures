chapter: 4
title: Ears to Hear
tagline: From a boat by the shore Jesus tells the parables of the seed and explains them to those who believed; at evening, crossing the lake, He silences a storm, and His disciples ask who He is.
when: 'In Galilee, by the lake; the storm on the evening of the same day (verse 35)'

setting: |
  Mark 4 is one of only two discourses in a Gospel that otherwise moves quickly from deed to deed; the other is the Mount of Olives in [[Mark 13]]. It follows a chapter of rising pressure. The crowds were so great that Jesus had a small boat kept ready for Him ([[Mark 3:9]]); His friends said He was beside Himself, and scribes from Jerusalem charged that He cast out devils by Beelzebub, whom He had already answered “in parables” ([[Mark 3:21–23]]). Now He teaches again by the lake, sitting in a boat, with the multitude on the shore.

  Mark gives three parables of seed: the sower with its explanation, the seed growing secretly, which only Mark tells, and the mustard seed, with sayings on the lamp and the measure between them. Then, on the evening of “the same day,” comes the crossing and the storm. Matthew tells the sower and the mustard seed in his long chapter of parables ([[Matt. 13]]) and the storm earlier ([[Matt. 8:23–27]]); Luke has the sower and the storm in [[Luke 8]]. Mark’s link between the parables and the storm looks precise, but which order the events actually happened in cannot be settled.

  Mark’s Gospel was most likely heard read aloud, probably in one sitting, and this chapter is written for the ear.

thread: |
  **To hear, in this chapter, is to understand, and the question is who will.**

  In a Gospel meant to be heard, “he that hath ears to hear, let him hear” is a call to understand. The sower shows one word falling on four kinds of hearers. The explanation is given in private to those who believed, and the sayings on the lamp and the measure say that what they were given grows as they receive it and is meant to be shown. Two more seed parables follow: a seed that grows by its own life until the harvest, and the least of seeds, which grows into a shelter for the birds.

  Then Mark turns to the disciples themselves. They had been given “the mystery of the kingdom of God,” yet they had not understood the first parable (verse 13), a scene only Mark records. That evening, in the storm, they wake Him with “Master, carest thou not that we perish?”, and in Mark “Master” is usually the title used by those who do not yet understand who He is. The chapter ends with their question still open: “What manner of man is this?”

sections:
  - range: 1-9
    heading: The sower
    plain: |
      Jesus began to teach again by the lake. So great a crowd gathered that He got into a boat and sat in it on the water, while the whole crowd stood on the shore. He taught them many things in parables. “Listen! A sower went out to sow. As he sowed, some seed fell along the path, and the birds came and ate it. Some fell on rocky ground where there was little soil; it sprang up quickly because the soil was shallow, but when the sun rose it was scorched, and because it had no root it withered. Some fell among thorns, and the thorns grew up and choked it, so that it bore no grain. And some fell on good soil, and it came up, grew, and produced a crop, thirty, sixty, and a hundred times what was sown.” Then He said, “Whoever has ears to hear, let him hear.”
  - range: 10-12
    heading: Why parables?
    plain: |
      When He was alone, the Twelve and the others around Him asked Him about the parable. He told them, “You have been given the secret of the kingdom of God; but to those outside, everything comes in parables, so that they look and look but do not perceive, and listen and listen but do not understand; otherwise they might turn and be forgiven.”
  - range: 13-20
    heading: The sower explained
    plain: |
      Then He said to them, “Don’t you understand this parable? Then how will you understand any parable? The sower sows the word. The seed along the path is like those who hear the word, and at once Satan comes and takes away the word sown in them. The seed on rocky ground is like those who hear the word and at once receive it with joy; but they have no root in themselves and last only a short time, and when trouble or persecution comes because of the word, they quickly fall away. The seed among thorns is like those who hear the word, but the worries of this world, the deceitfulness of wealth, and desires for other things come in and choke the word, and it bears no fruit. And the seed on good soil is like those who hear the word, accept it, and bear fruit, thirty, sixty, and a hundred times what was sown.”
  - range: 21-25
    heading: The lamp and the measure
    plain: |
      He said to them, “Is a lamp brought in to be put under a grain measure or under a bed? Isn’t it brought to be set on a lampstand? Nothing is hidden except to be brought into the open, and nothing is kept secret except to come to light. If anyone has ears to hear, let him hear.” He went on: “Pay attention to what you hear. The measure you use will be the measure you receive, and you who hear will be given more. Whoever has will be given more; whoever has not will lose even what he has.”
  - range: 26-29
    heading: The seed growing secretly
    plain: |
      He said, “The kingdom of God is like a man who scatters seed on the ground. He sleeps and gets up, night and day, and the seed sprouts and grows, though he does not know how. The earth produces the crop by itself: first the stalk, then the head, then the full grain in the head. And as soon as the grain is ripe, he puts in the sickle, because the harvest has come.”
  - range: 30-34
    heading: The mustard seed
    plain: |
      He said, “What shall we compare the kingdom of God to, or what parable shall we use for it? It is like a mustard seed, which when sown is smaller than all the seeds in the ground; yet once sown, it grows up and becomes larger than all the garden plants, and puts out such large branches that the birds can nest in its shade.” With many parables like these He spoke the word to them, as much as they were able to hear. He did not speak to them without a parable, but when He was alone with His disciples He explained everything.
  - range: 35-41
    heading: Peace, be still
    plain: |
      That day, when evening came, He said to them, “Let us cross over to the other side.” Leaving the crowd, they took Him along, just as He was, in the boat, and other small boats were with Him. A fierce windstorm arose, and the waves were breaking into the boat, so that it was filling with water. He was in the stern, asleep on the cushion. They woke Him and said, “Teacher, don’t you care that we are perishing?” He got up, rebuked the wind, and said to the sea, “Quiet! Be still!” The wind died down, and there was a great calm. He said to them, “Why are you so afraid? How is it that you have no faith?” They were filled with great fear and said to one another, “Who then is this, that even the wind and the sea obey Him?”

notes:
  - ref: 8
    phrase: sprang up and increased; and brought forth, some thirty, and some sixty, and some an hundred
    kind: symbol
    title: A harvest that keeps rising
    body: |
      Mark counts the harvest upward, and the order may be part of the lesson. Matthew lists the same yields from the top, “an hundredfold, some sixtyfold, some thirtyfold” ([[Matt. 13:8]]); Mark climbs from thirty to a hundred and says the good seed “sprang up and increased.” Perhaps, as one Latter-day Saint reading puts it, Mark is stressing an ever-increasing productivity, not only a difference between one plot and the next. The difference between hearers is still there; of the good ground Elder Bruce R. McConkie wrote that “crops of equal value are not harvested by all the saints. There are many degrees of receptive belief.” But in Mark’s order the good ground does not stop at thirty.
    sources: [halverson-soils-souls]
  - ref: 9
    phrase: He that hath ears to hear, let him hear
    kind: words
    title: 'Ears to hear: a call to understand'
    body: |
      Everyone in the crowd had ears, so the call is to understand. Mark’s Gospel seems to bear the marks of a text meant to be heard, and for its hearers “to hear” would have worked the way “to see” works in a culture of readers: in this chapter (verses 9, 12, 23) it is a metaphor for understanding. A text meant for the ear also leans on repeated keywords, and the word “hear” keeps returning through the chapter, up to “take heed what ye hear” (verse 24).

      The call also says the parable can be understood: its lesson could be grasped through study, prayer and search. Two people could hear the same story, one idly and the other intent on learning all it could convey, and they would not come away with the same thing.
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-19]
  - ref: 11
    phrase: the mystery of the kingdom of God
    kind: words
    title: A mystery given to those who believed
    body: |
      A “mystery” in the New Testament is a secret God reveals, not a riddle. The Greek *mystērion* is “a hidden or secret thing, not obvious to the understanding,” and in one of its New Testament senses it is God’s plan of salvation through Christ, “once hidden but now is revealed.” Here it is given to the disciples.

      Who those disciples were is the question verse 10 raises. They are more than the Twelve: “they that were about him with the twelve.” The Joseph Smith Translation names them: He was “alone with the twelve, and they that believed in him” (JST Mark 4:9, in the footnote). The line between those who are given the mystery and “them that are without” is belief, not office. Joseph Smith drew the same line from Matthew’s account of this scene: the multitude received no explanation “because of unbelief,” and the disciples received the mysteries “because of the faith and confidence which they had in him.” They were also the ones who would carry the word, and the explanation gave Christ’s fellow sowers a view of the kingdom they were working to build.
    sources: [thayer, lds-scriptures, jsp-letter-elders-1835-12, halverson-soils-souls]
  - ref: 12
    phrase: lest at any time they should be converted, and their sins should be forgiven them
    kind: words
    title: Not unable to see, but unwilling
    body: |
      Read alone, Mark’s wording sounds as if Jesus spoke in parables to keep people from repenting. Mark gives the words of [[Isa. 6:9–10]] without marking them as a quotation, and he joins them with “That,” as if blindness were the purpose. The verse does give the reason for the method, and the reason is to veil the meaning, not to take away anyone’s sight: a parable gives a hearer truth “exactly in proportion to his faith and intelligence.” To the dull it is only a story; to the spiritual it opens the mysteries of the kingdom. (The site’s note at [[Isa. 6:9]] shows how the Book of Mormon reads Isaiah’s own commission.)

      Joseph Smith put the fault in the hearers. Explaining the same scene in Matthew, he said the multitude were condemned “because they were not willing to see with their eyes and hear with their ears; not because they could not and were not privileged to see, and hear.” The veil is lifted for whoever seeks: “Only he who seeks finds.”
    sources: [bd-parables, ellicott-mark, jsp-letter-elders-1835-12]
  - ref: 13
    phrase: Know ye not this parable? and how then will ye know all parables?
    kind: structure
    title: The parable that unlocks the rest
    body: |
      Only Mark keeps this question, and with it a failure to understand that his Gospel records of the disciples again and again. In Mark the disciples are far from flawless, but they are learners, and Jesus answers their slowness by explaining.

      The question also says the sower comes first for a reason. By making the understanding of “all parables” depend on “this parable,” Jesus set the sower at the foundation; His other parables, the parables of the kingdom above all, grow out of its seeds and soils, as Mark’s next two do. Joseph Smith, explaining the parable as Matthew gives it, said it was spoken “to demonstrate the effects that are produced by the preaching of the word,” with an allusion to “the setting up of the kingdom in that age.”
    sources: [smith-marks-unique-contribution, halverson-soils-souls, jsp-letter-elders-1835-12]
  - ref: 17
    phrase: have no root in themselves
    kind: prophets
    title: No root in themselves
    body: |
      The stony-ground hearer’s trouble is that his faith rests on something outside himself. Elder Dallin H. Oaks saw it in new members “merely converted to the missionaries or to the many attractive characteristics of the Church or to the many great fruits of Church membership,” and long-time members can come to the same state. “If we are not rooted in the teachings of the gospel and regular in its practices, any one of us can develop a stony heart.”

      Mark’s “in themselves” makes the point sharper. A disciple whose faith rests on other people’s faith cannot last in thin soil once affliction comes. The two “immediately”s of verses 16 and 17 show how fast it happens: received at once with gladness, given up at once when trouble comes.
    sources: [oaks-parable-sower, halverson-soils-souls]
  - ref: 19
    phrase: the lusts of other things entering in
    kind: symbol
    title: Thorns that enter after the sowing
    body: |
      The thorny ground is a sobering soil, because before the sowing it looks like the good ground. The thorns do not spring up until after the seed is in, so the third soil seems no different from the fourth before planting. Mark alone adds “the lusts of other things,” and his “entering in” describes how it happens: worldly desires come in alongside the growing word until they sap its strength.

      Mark’s “becometh unfruitful” suggests that some fruit had already grown before the thorns kept the plant from bearing. In Elder Oaks’s reading of the soils as hearts, this is a heart “set upon the things of the world,” which a heart that has already heard the word can still become.
    sources: [halverson-soils-souls, oaks-parable-sower]
  - ref: 21
    phrase: Is a candle brought to be put under a bushel, or under a bed?
    kind: symbol
    title: A lamp is lit to be seen
    body: |
      A lamp is not lit to be hidden, and neither was the meaning of the parable. The “bushel” is a dry measure of about a peck; no one lights a lamp and then covers it with the grain measure or pushes it under the bed.

      Mark sets the saying straight after the private explanation, and it was quite possibly spoken there. If so, the disciples’ knowledge of what the parable meant was not given them for themselves alone but was to shine to others. Verse 22 gives the reason with its “For”: nothing is hidden except to be brought into the open.
    sources: [thayer, ellicott-mark]
  - ref: 24
    phrase: 'Take heed what ye hear: with what measure ye mete, it shall be measured to you'
    kind: scripture
    title: The measure of hearing
    body: |
      “He that hath” is a puzzle: has what, and why take from someone who has nothing? The Joseph Smith Translation answers by changing having to receiving: “unto you that continue to receive, shall more be given,” and “he that receiveth, to him shall be given; but he that continueth not to receive” loses even what he has (JST Mark 4:20, in the footnotes). The saying is about what a hearer does with the word.

      Joseph Smith explained the same saying in Matthew in those terms: “he that will not receive the greater light, must have taken away from him, all the light which he hath.” The measure saying just before it is a law of judgment in the Sermon on the Mount ([[Matt. 7:2]]); set here, it can be read of knowledge: with the measure in which a hearer uses what he knows, God gives him more.
    sources: [lds-scriptures, jsp-letter-elders-1835-12, ellicott-mark]
  - ref: 27
    phrase: the seed should spring and grow up, he knoweth not how
    kind: symbol
    title: The seed grows, the sower knows not how
    body: |
      The seed growing secretly, the one parable only Mark tells, is about a seed with a life of its own. The man sows, sleeps and rises, and the earth brings forth “of herself,” blade, ear, and full grain, until he puts in the sickle. Why Matthew and Luke left it out is not known; one Latter-day Saint reading suggests it was too close to the sower to need repeating.

      Who the man is has been much discussed. If he is the Lord, how can He not know how the seed grows? If he is a preacher, how can he reap the harvest of souls, which is God’s to gather? Elder James E. Talmage answered that both objections look for “a literalism never intended”: the parable is not about the sower at all but about the seed, and its lesson is “the vitality of the seed as a living thing.” Whether the Lord plants or one of His servants, the seed is alive and will grow. Read as a lesson for those who teach the gospel, it says where the growth comes from: it depends on the learner’s agency and on God, who “must be the primary force behind our harvest,” and so the sower plants in faith and harvests in joy.
    sources: [smith-marks-unique-contribution, talmage-jesus-christ-19, lopez-seed-growing-secretly]
  - ref: 31
    phrase: is less than all the seeds that be in the earth
    kind: symbol
    title: The least of seeds
    body: |
      The mustard seed is not literally the smallest seed, and the plant is not a tree; the parable perhaps uses hyperbole. Black mustard is an annual herb, but it grows large and sturdy enough to hold the small birds that feed on its seeds. Mark has it shoot out “great branches” and the birds lodge “under the shadow of it.” The contrast between the tiny seed and the grown plant is the point, and those who first heard the parable evidently understood it.

      Joseph Smith, reading Matthew’s wording of the parable, applied it to the latter days: “this figure is given to represent the church as it shall come forth in the last days.” He saw the Book of Mormon as the seed “accounted the least of all seeds,” now branching forth, with God “sending down his powers, gifts and angels, to lodge in the branches thereof.”
    sources: [ball-plants-nt, talmage-jesus-christ-19, jsp-letter-elders-1835-12]
  - ref: 33
    phrase: as they were able to hear it
    kind: scripture
    title: As they were able to bear it
    body: |
      Jesus fitted His teaching to His hearers. Where the King James text has “able to hear it,” the Joseph Smith Translation reads “able to bear” (JST Mark 4:26, in the footnote): the parables gave each hearer as much as he could carry. Of the parables in general, Elder Talmage wrote that they were a “merciful adaptation of the word of truth to the varied capacities” of their hearers: a story would stay in the mind of someone not yet able to grasp its meaning, and when time and experience, “including suffering perhaps,” had prepared him, he could find “the living kernel of gospel truth” inside it. Those who had already received more were taken further in private (verse 34).
    sources: [lds-scriptures, talmage-jesus-christ-19]
  - ref: 36
    phrase: they took him even as he was in the ship
    kind: history
    title: Taken just as He was
    body: |
      Only Mark says they took Him “even as he was,” and the phrase suggests how exhausted He was after the long day of teaching; they set out without stopping to prepare.

      Mark also has Jesus asleep “on a pillow,” the cushion usually kept in a boat’s stern. His sleep is evidence that His body was real: He grew tired as anyone does, and after a day of labor He slept even in a storm.
    sources: [ellicott-mark, talmage-jesus-christ-20]
  - ref: 37
    phrase: there arose a great storm of wind
    kind: history
    title: A storm off the hills
    body: |
      Storms like this come up suddenly on the Sea of Galilee because of where it lies. The lake lies about 680 feet below sea level, the hills around it rise sharply, and cold air rushing down from the hills meets warm air rising from the water, so that sudden and violent storms can break out on it. It was such a storm that met them at evening. Mark’s verbs are continuous: the waves were beating into the boat, and it was filling.
    sources: [hunter-tempest-raging, ellicott-mark]
  - ref: 38
    phrase: Master, carest thou not that we perish?
    kind: words
    title: Carest thou not that we perish?
    body: |
      Mark’s disciples do not just cry for help; they accuse Him of not caring. Only Mark gives this note of despairing protest, and in it can be traced the lack of faith that Jesus reproves two verses later.

      Even the title shows how little they yet understood. “Master” is what people most often call Jesus in Mark, and it says nothing of His divinity; in Mark the person who calls Him “Master” usually shows in the same breath that he does not understand what Jesus is teaching or doing. The disciples had been given “the mystery of the kingdom of God” that same day, and they still had to learn who was asleep in their boat.
    sources: [ellicott-mark, smith-marks-unique-contribution]
  - ref: 39
    phrase: Peace, be still
    kind: words
    title: Muzzled
    body: |
      Jesus speaks to the sea as He spoke to an unclean spirit. The second word, *phimoō*, means to muzzle, and metaphorically “to stop the mouth, make speechless.” Mark uses it for being made to hold one’s peace here and where Jesus rebuked an unclean spirit, “saying, Hold thy peace” ([[Mark 1:25]]). “Peace, be still” is literally “be still, be silenced.” Mark gives the very words, as though the raging sea were a hostile power in rebellion against its true Lord, and it obeys as the spirit did.
    sources: [thayer, ellicott-mark]
  - ref: 41
    phrase: What manner of man is this, that even the wind and the sea obey him?
    kind: christ
    title: What manner of man is this?
    body: |
      The disciples ask who Jesus is, and the story has just shown them part of the answer: Mark tells the stilling of the storm to show that Jesus has power over the elements themselves. The footnote to “a great calm” points to the psalm addressed to the “LORD God of hosts”: “Thou rulest the raging of the sea: when the waves thereof arise, thou stillest them” ([[Ps. 89:8–9]]).

      The One asleep in the stern, President Howard W. Hunter taught, is “this great Jehovah,” who at the Creation divided the waters from the waters and gathered them so that the dry land appeared, and who parted the Red Sea for Israel; “certainly it should be no surprise that he could command a few elements acting up on the Sea of Galilee.” His rebuke, “how is it that ye have no faith?” (verse 40), was gentle, and for those who say they trust in Jehovah and have taken His name upon them it is “largely deserved.”
    sources: [strathearn-teaching-gospels, lds-scriptures, hunter-tempest-raging]

christ: |
  Mark 4 shows Jesus Christ as the Lord whose word has life in itself and as the Lord whom the wind and the sea obey. Whether He sows the word Himself or through His servants, Elder Talmage wrote, “the seed is alive and will grow,” and God gives the harvest in each heart that receives it. The same Jehovah who stilled the sea, President Hunter taught, “can calm the troubled waters of our lives,” and in the stillness after their own storms His disciples still hear the words He spoke in the boat, “how is it that ye have no faith?”

explore: |
  - **The other tellings.** [[Matt. 13:1–32]] and [[Luke 8:4–18]] for the sower and the mustard seed; [[Matt. 8:23–27]] and [[Luke 8:22–25]] for the storm.
  - **Isaiah’s commission**, which verse 12 echoes: [[Isa. 6:8–13]], with the site’s notes.
  - **The same four hearers.** The footnote at verse 17 points to Lehi’s dream, [[1 Ne. 8:21–34]].
  - **Mark’s other discourse.** [[Mark 13]], the Mount of Olives.
  - President Howard W. Hunter’s “Master, the Tempest Is Raging” (October 1984 general conference) is built on Mark’s account of the storm.

