summary: >-
  Zechariah is given a night of visions while the Lord's house is being rebuilt, and the
  one the book keeps returning to is a lampstand of gold fed with oil by two olive trees:
  "Not by might, nor by power, but by my spirit." The same book promises a fountain opened
  for sin and uncleanness. The image holds one quiet
  idea: a small lit lampstand, kept burning by the Lord's own supply, with the cleansing
  water beside it.
motifs:
  - "A golden lampstand between two olive trees (Zechariah 4:2-3, 6): the focal point, a small seven-branched lampstand of soft, old matte gold on a stone ledge, its seven small flames the brightest place in the picture, standing between two old, gnarled olive trees that tower over it, one on each side."
  - "A young donkey on the road to Jerusalem (Zechariah 9:9): a small grey donkey with no rider, seen in profile, walking left along a pale road toward the town."
  - "A fountain opened (Zechariah 13:1): water spilling from a crack in a mossy rock in the lower left foreground and running across the picture among stones and grass."
composition: >-
  A wide landscape on a rocky hillside at dawn, with deep indigo sky above and the sun
  just rising at the left horizon, so everything is warm on its left side and shadowed on
  its right. The small lampstand stands at center-right on its stone ledge between the two
  olive trees. The spring runs across the lower left foreground. Beyond it a pale road
  winds down the hill, where the donkey walks toward a modest town of flat-roofed houses
  behind a plain stone wall, far off on a hill at the left. No people and nothing lettered.
# "What's in this picture" under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The golden lampstand between two olive trees** is the vision of the lamp fed with oil, and the Lord''s word to Zerubbabel: “Not by might, nor by power, but by my spirit, saith the LORD of hosts” ([[Zech. 4:2–3]]; [[Zech. 4:6]]).'
  - '**The donkey on the road to Jerusalem** is the coming of Zion''s King: “behold, thy King cometh unto thee: he is just, and having salvation; lowly, and riding upon an ass” ([[Zech. 9:9]]). It stands without a rider: Matthew sees the verse fulfilled when Jesus rode into Jerusalem ([[Matt. 21:4–5]]).'
  - '**The spring coming out of the rock** is the fountain promised for that day: “a fountain opened to the house of David and to the inhabitants of Jerusalem for sin and for uncleanness” ([[Zech. 13:1]]).'
