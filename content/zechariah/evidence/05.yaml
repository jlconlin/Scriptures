chapter: 5
claims:
  - where: 'when'
    claim: 'Zechariah prophesied under Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.).'
  - where: 'setting'
    claim: 'Chapter 5 holds the sixth and seventh visions: the curse on sin, and sin removed to Shinar'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: '(g) Zech. 5:1–4, sixth vision, a symbol of the curse that shall light on sin in the land. (h) Zech. 5:5–11, seventh vision, symbol of the removing of the sin of the people to Shinar'
  - where: 'setting'
    claim: 'Zerubbabel and Joshua (Jeshua) rebuilt the house of God with the prophets helping'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/5?lang=eng'
    quote: 'Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which is at Jerusalem: and with them were the prophets of God helping them.'
  - where: 'setting'
    claim: 'One older reading: the double vision shows the separation of the wicked from the congregation'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/5.htm'
    quote: 'The double vision of this chapter, therefore, shows the separation of the wicked from the congregation of the Lord'
  - where: 'thread'
    claim: 'The verb of 5:3 means purged out'
    key: bdb
    url: 'https://biblehub.com/hebrew/5352.htm'
    quote: 'purged out, of liars and perjurers Zechariah 5:3 (twice in verse).'
  - where: 'thread'
    claim: 'Shinar is the plain where Babel was built'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'they found a plain in the land of Shinar; and they dwelt there.'
  - where: 'section 1 plain'
    claim: 'One sin is condemned on each side of the scroll'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Two particular sins are condemned, one on each side of the scroll, according to the force of the Hebrew.'
  - where: 'section 2 plain'
    claim: 'The Greek reads “This is their iniquity”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/zechariah/5.htm'
    quote: 'This is the measure that goes forth. And he said, This is their iniquity in all the earth.'
  - where: 'section 2 plain'
    claim: 'The talent of lead is a circular plate'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/5.htm'
    quote: 'A covering of lead (kikkâr, a circle, a rounding or a circular plate) rises up, or is lifted up'
  - where: 'note 5:1 “A scroll in flight”'
    claim: 'A heavenly book given to the prophet is a central feature of such visions'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'One of the central features of many of these prophets’ visions is the giving of a heavenly book for the prophet to read which revealed future events.'
  - where: 'note 5:1 “A scroll in flight”'
    claim: 'Zechariah 5:1–2 is listed with the heavenly-book visions'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'See also Ezekiel 3:1–3; Isaiah 34:16; Zechariah 5:1–2; Revelation 5:1–5; 10:8–11.'
  - where: 'note 5:1 “A scroll in flight”'
    claim: 'Ezekiel’s scroll was written within and without with lamentations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/2?lang=eng'
    quote: 'it was written within and without: and there was written therein lamentations, and mourning, and woe.'
  - where: 'note 5:2 “The measure of the holy place”'
    claim: 'A cubit is about 17½ inches'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Cubit. The distance from the elbow to the tip of the finger, normally about 17½ inches'
  - where: 'note 5:2 “The measure of the holy place”'
    claim: 'The porch of Solomon’s temple was twenty cubits by ten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'And the porch before the temple of the house, twenty cubits was the length thereof, according to the breadth of the house; and ten cubits was the breadth thereof before the house.'
  - where: 'note 5:2 “The measure of the holy place”'
    claim: 'The size is significant, matching the temple porch and the tabernacle’s holy place'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/5.htm'
    quote: 'is unquestionably significant. It corresponds both to the size of the porch of Solomon''s temple (1 Kings 6:3), and also to the dimensions of the holy place in the tabernacle, which was twenty cubits long and ten cubits broad.'
  - where: 'note 5:2 “The measure of the holy place”'
    claim: 'Some take the porch to be meant, the judgment issuing from the sanctuary'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/5.htm'
    quote: 'assume that the reference is to the porch of the temple, and suppose that the roll has the same dimensions as this porch, to indicate that the judgment is "a consequence of the theocracy" or was to issue from the sanctuary of Israel'
  - where: 'note 5:2 “The measure of the holy place”'
    claim: 'The older reading: the curse is meted out by the measure of the holy place'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/5.htm'
    quote: '"the measure by which this curse upon sinners will be meted out, will be the measure of the holy place."'
  - where: 'note 5:3 “The curse of a broken oath”'
    claim: 'ʾālāh is properly an oath, usually a curse'
    key: bdb
    url: 'https://biblehub.com/hebrew/423.htm'
    quote: '1. (properly) an oath, (usually, in a bad sense) a curse'
  - where: 'note 5:3 “The curse of a broken oath”'
    claim: 'Oaths in God’s name carried curses; breaking them was blasphemy; Zech 5:1–4 and Ex 20:7 cited'
    key: sc-knowhy-98
    url: 'https://scripturecentral.org/knowhy/why-did-the-lamanites-break-their-treaty-with-king-limhi'
    quote: 'Since breaking a treaty sworn in God’s name was seen as nothing less than blasphemy, such oaths or covenants were often accompanied with threats of divine and temporal curses (including death) for breaking such (cf. Exodus 20:7; … Zechariah 5:1–4; Daniel 9:11).'
  - where: 'note 5:3 “The curse of a broken oath”'
    claim: 'The curse enters the house of him that sweareth falsely by the Lord’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/5?lang=eng'
    quote: 'it shall enter into the house of the thief, and into the house of him that sweareth falsely by my name'
  - where: 'note 5:4 “The curse that stays in the house”'
    claim: 'One sin on each side; theft and lying typical of a poor community; the house consumed as if defiled by leprosy (Lev 14:45)'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'theft and lying being typical sins of a poor community (cf. 7:9, 10; 8:17). So penetrating and permanent is the penalty that it enters and consumes the very structure of the house of the wrongdoer as though the building were defiled by leprosy (cf. Lv. 14:45).'
  - where: 'note 5:4 “The curse that stays in the house”'
    claim: 'The verb behind “cut off” means purged out'
    key: bdb
    url: 'https://biblehub.com/hebrew/5352.htm'
    quote: '1 be cleaned out, of a plundered city Isaiah 3:26; purged out, of liars and perjurers Zechariah 5:3 (twice in verse).'
  - where: 'note 5:4 “The curse that stays in the house”'
    claim: 'The leprous house was broken down, stones and timber'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'And he shall break down the house, the stones of it, and the timber thereof, and all the mortar of the house'
  - where: 'note 5:6 “Their resemblance, or their iniquity”'
    claim: 'The Hebrew is ʿênām, “eye” with the third-person plural suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'עֵינָ֖/ם'
  - where: 'note 5:6 “Their resemblance, or their iniquity”'
    claim: 'BDB proposes reading ʿăwōnām with the Septuagint'
    key: bdb
    url: 'https://biblehub.com/hebrew/5869.htm'
    quote: 'suffix 3 masculine plural עֵינָם Isaiah 13:18 (Zechariah 5:6 read עֲוֺנָם ᵐ5 We Gr Now)'
  - where: 'note 5:6 “Their resemblance, or their iniquity”'
    claim: 'The Septuagint reads “their iniquity” and calls the ephah “the measure”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/zechariah/5.htm'
    quote: 'This is the measure that goes forth. And he said, This is their iniquity in all the earth.'
  - where: 'note 5:6 “Their resemblance, or their iniquity”'
    claim: 'NRSVue: “This is their iniquity in the whole land”; “a basket”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Zechariah+5&version=NRSVUE'
    quote: 'He said, “This is a basket coming out.” And he said, “This is their iniquity in the whole land.”'
  - where: 'note 5:6 “Their resemblance, or their iniquity”'
    claim: 'An ephah is a tenth of a homer'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Ephah (dry). Said to be equivalent to a bath; one-tenth of a homer.'
  - where: 'note 5:6 “Their resemblance, or their iniquity”'
    claim: 'A homer is about 6½ bushels'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Homer (dry). Said to be 10 ephahs. A homer is also believed to be 230 liters (or about 6½ U.S. bushels dry measure).'
  - where: 'note 5:7 “Wickedness under a lid of lead”'
    claim: 'One woman: the sinners as one personality; wickedness embodied; she was already sitting there'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/5.htm'
    quote: 'the sinners brought into a heap appearing as a unity, i.e., as one living personality … This woman, who had not come into the ephah now for the first time, but was already sitting there, and was only seen now that the lid was raised'
  - where: 'note 5:7 “Wickedness under a lid of lead”'
    claim: 'The woman is wickedness embodied'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/5.htm'
    quote: 'is described by the angel as mirsha‛ath, ungodliness, as being wickedness embodied'
  - where: 'note 5:7 “Wickedness under a lid of lead”'
    claim: 'kikkār is a circle or circular plate'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/5.htm'
    quote: 'A covering of lead (kikkâr, a circle, a rounding or a circular plate) rises up, or is lifted up'
  - where: 'note 5:7 “Wickedness under a lid of lead”'
    claim: 'The talent (kikkar) is about 75.6 pounds'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Talent. (Hebrew kikkar); equivalent to 3,000 shekels (see Ex. 38:25, 26); about 75.6 pounds, or 34.272 kilograms.'
  - where: 'note 5:11 “A house for wickedness in Shinar”'
    claim: 'The plain of Shinar, where Babel’s builders settled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'they found a plain in the land of Shinar; and they dwelt there.'
  - where: 'note 5:11 “A house for wickedness in Shinar”'
    claim: 'Babylon one of the oldest cities of Shinar'
    key: bd-babylon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/babylon?lang=eng'
    quote: 'According to Gen. 10:8–10 it was founded by Nimrod and was one of the oldest cities of the land of Shinar'
  - where: 'note 5:11 “A house for wickedness in Shinar”'
    claim: 'The vision is sin removed to Shinar, the land of their foes, beside Lev 16:21'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'symbol of the removing of the sin of the people to Shinar, the land of their foes (Lev. 16:21).'
  - where: 'note 5:11 “A house for wickedness in Shinar”'
    claim: 'The high priest confessed Israel’s sins over the live goat and sent it into the wilderness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'confess over him all the iniquities of the children of Israel … and shall send him away by the hand of a fit man into the wilderness'
  - where: 'christ'
    claim: 'The seventh vision is set beside Lev 16:21'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'symbol of the removing of the sin of the people to Shinar, the land of their foes (Lev. 16:21).'
  - where: 'christ'
    claim: 'The Day of Atonement goats symbolized Jesus Christ, taking the place of the sinful people'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'In these rituals, the goats symbolized Jesus Christ, taking the place of the sinful people. Sin must not be allowed in God’s presence. But rather than destroy or drive out the sinners, God provided another way'
  - where: 'christ'
    claim: 'One reading: God forgives and carries the sins altogether away'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'God not only forgives the sins of His people, but carries them altogether away from their land, that they may deceive them no more.'
  - where: 'explore'
    claim: 'KnoWhy #469 compares the heavenly books of Ezekiel, Revelation, Lehi and Zechariah'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'See also Ezekiel 3:1–3; Isaiah 34:16; Zechariah 5:1–2; Revelation 5:1–5; 10:8–11.'
  - where: 'explore'
    claim: 'Zechariah 8:17 is cited with the sins of the scroll'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'theft and lying being typical sins of a poor community (cf. 7:9, 10; 8:17).'
  - where: 'note 5:7 “Wickedness under a lid of lead”'
    claim: 'The woman is read as a symbol of Israel and her sins'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Woman. A symbol of Israel and her sins.'
