chapter: 12
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Zechariah prophesied 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.).'

  # ---- setting ----
  - where: 'setting'
    claim: 'The heading of 12:1 belongs to the whole of 12–14 and matches 9:1'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'This heading, which belongs to the whole prophecy in ch. 12-14, corresponds in form and contents to that in Zechariah 9:1.'

  - where: 'setting'
    claim: 'The Bible Dictionary reads chapters 9–14 as prophecies of the Messiah and of events before the Second Coming'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 9–14, prophecies about the Messiah and events preceding His Second Coming.'

  - where: 'setting'
    claim: 'Scripture Helps reads 12–14 as a final battle at Jerusalem just before the Second Coming, often called Armageddon'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah prophesied of a great final battle that will take place in and around Jerusalem in the last days, just prior to the Second Coming of Jesus Christ. This future conflict is often referred to as Armageddon'

  - where: 'setting'
    claim: 'The Lord expanded these prophecies in D&C 45'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Expanding on Zechariah’s prophecies, the Lord explained in Doctrine and Covenants 45'

  - where: 'setting'
    claim: 'The Church pairs 12:10 with John 19:37 and Revelation 1:7'
    key: cfm-ot-2026-50
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/50?lang=eng'
    quote: 'Zechariah 12:10 (see John 19:37; Revelation 1:7)'

  - where: 'setting'
    claim: 'In chapter 14 the Lord’s feet stand on the mount of Olives'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'He added that the Lord’s “feet shall stand in that day upon the mount of Olives,” located just east of Jerusalem.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The section runs: the attack ends in the nations’ destruction (1–4), the Lord strengthens Judah and Jerusalem (5–9), He pours out His spirit and they repent the death of the Messiah (10–14)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'This first section announces how the conflict against Jerusalem and Judah will issue in destruction to the nations of the world (Zechariah 12:1-4). Jehovah will endow the princes of Judah and inhabitants of Jerusalem with marvellous strength'

  - where: 'thread'
    claim: 'Conversion is a fruit of the outpouring of the Spirit, not a condition of the deliverance'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'There is not a word in the text about conversion as the condition on which the glory set before them in Zechariah 12:3-9 was to be obtained; on the contrary, conversion is represented as one fruit of the outpouring of the spirit of prayer upon the nation'

  - where: 'thread'
    claim: 'The deliverance prepares the Jews to recognize Jesus Christ as the Messiah'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'This miraculous deliverance will prepare the Jews to recognize and accept Jesus Christ as the Messiah.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'The Lord throws the enemy into confusion so that it rushes to its own destruction (v. 4)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'The Lord will throw the mind and spirit of the military force of the enemy into such confusion, that instead of injuring Jerusalem and Judah, it will rush forward to its own destruction.'

  - where: 'section 2 plain'
    claim: 'The governors of Judah are its princes, the leaders of the people in war'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'The princes of Judah are mentioned as the leaders of the people in war.'

  # ---- notes ----
  - where: 'note 12:3 “All nations against Jerusalem”'
    claim: 'A final battle at Jerusalem just before the Second Coming, often called Armageddon'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah prophesied of a great final battle that will take place in and around Jerusalem in the last days, just prior to the Second Coming of Jesus Christ. This future conflict is often referred to as Armageddon'

  - where: 'note 12:3 “All nations against Jerusalem”'
    claim: 'When Jerusalem seems about to fall, the Lord intervenes'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Just when it appears that Jerusalem will fall to her enemies, the Lord will intervene.'

  - where: 'note 12:3 “All nations against Jerusalem”'
    claim: 'Zechariah 12–14 gives insight into events of the Second Coming'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'In Zechariah 12–14, Zechariah offers significant insight to some of the events that will occur during the Second Coming.'

  - where: 'note 12:3 “All nations against Jerusalem”'
    claim: 'In chapter 14 the Lord’s feet stand on the mount of Olives'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'He added that the Lord’s “feet shall stand in that day upon the mount of Olives,” located just east of Jerusalem.'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'The Hebrew has “upon me” (first person)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'אֵלַ֖/י'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'The Hebrew has “for him” (third person)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'עָלָ֗י/ו'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: '“Me” refers to the speaker, the LORD of 12:1'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'The suffix in אלי (to me) refers to the speaker. This is Jehovah, according to Zechariah 12:1, the creator of the heaven and the earth.'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'Dāqar means to pierce, thrust through, put to death'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'Dâqar does not mean to ridicule, or scoff at, but only to pierce, thrust through, and to slay by any kind of death whatever'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'One reading: the shift from “me” to “him” points to one slain who is one with Jehovah yet personally distinct'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'Thus the transition from the first person (אלי) to the third (עליו) points to the fact that the person slain, although essentially one with Jehovah, is personally distinct from the Supreme God.'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'John quotes the verse of the soldier’s spear piercing His side'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'as having been fulfilled in Christ, by the fact that a soldier pierced His side with a lance as He was hanging upon the cross (vid., John 19:34).'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'John 19:37 cites the passage of the wounds of the Crucifixion, identifying Jesus as the Messiah'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'Moreover, this passage was cited in John 19:37 to specifically refer to the wounds Jesus received as He was crucified, and these wounds further identifying Jesus as the Messiah.'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'The Church pairs 12:10 with John 19:37 and Revelation 1:7'
    key: cfm-ot-2026-50
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/50?lang=eng'
    quote: 'Zechariah 12:10 (see John 19:37; Revelation 1:7)'

  - where: 'note 12:10 “Me whom they have pierced”'
    claim: 'In D&C 45 the Lord tells the Jews what the wounds are and who He is'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The Savior will answer, “These wounds are the wounds with which I was wounded in the house of my friends. I am he who was lifted up. I am Jesus that was crucified. I am the Son of God.”'

  - where: 'note 12:11 “The mourning in the valley of Megiddo”'
    claim: 'The mourning of Hadadrimmon is the mourning for Josiah, mortally wounded in the valley of Megiddo'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'The mourning of Hadad-rimmon is therefore the mourning for the calamity which befel Israel at Hadad-rimmon in the death of the good king Josiah, who was mortally wounded in the valley Megiddo'

  - where: 'note 12:11 “The mourning in the valley of Megiddo”'
    claim: 'Hadadrimmon was a town in the field of Megiddo, by an ancient tradition (Jerome)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'Jerome says with regard to this: "Adad-remmon is a city near Jerusalem, which was formerly called by this name, but is now called Maximianopolis, in the field of Mageddon, where the good king Josiah was wounded by Pharaoh Necho."'

  - where: 'note 12:11 “The mourning in the valley of Megiddo”'
    claim: 'Zechariah compares the mourning for the Messiah to this national mourning'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'Zechariah compares the lamentation for the putting of the Messiah to death to this great national mourning.'

  - where: 'note 12:11 “The mourning in the valley of Megiddo”'
    claim: 'Megiddo was the scene of Josiah’s defeat and death; Zechariah calls it the valley of Megiddon'
    key: bd-megiddo
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/megiddo?lang=eng'
    quote: 'Also the scene of the tragic defeat and death of King Josiah (23:29–30; 2 Chr. 35:22). In Zech. 12:11 the place is called “the valley of Megiddon.”'

  - where: 'note 12:11 “The mourning in the valley of Megiddo”'
    claim: 'Armageddon transliterates Har Megiddo, the Mountain of Megiddo'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Armageddon is a Greek transliteration of the Hebrew Har Megiddo, or “Mountain of Megiddo.”'

  - where: 'note 12:12 “Every family apart”'
    claim: 'President Joseph Fielding Smith: when they accept Him as Redeemer, every family will mourn apart'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: '“Then they will accept Him as their Redeemer, which they have never been willing to do. Then is the time as spoken of in this passage from Zechariah when every family will go and mourn apart'

  - where: 'note 12:12 “Every family apart”'
    claim: 'President Smith: after the mourning comes their redemption'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Then they will fall down at His feet and worship Him. After these days will come their redemption and the building of Jerusalem.'

  - where: 'note 12:12 “David, Nathan, Levi, Shimei”'
    claim: 'Nathan is David’s son, ancestor of Zerubbabel in Luke 3, not the prophet'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'Nathan is not the prophet of that name, but the son of David, from whom Zerubbabel was descended (Luke 3:27, Luke 3:31).'

  - where: 'note 12:12 “David, Nathan, Levi, Shimei”'
    claim: 'The family of Shimei is the Levite family of Numbers 3:21, Gershon’s son'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'is the name given in Numbers 3:21 to the family of the son of Gershon and the grandson of Levi (Numbers 3:17.). This is the family intended here'

  - where: 'note 12:12 “David, Nathan, Levi, Shimei”'
    claim: 'For each of two tribes a leading family and a branch, to show every branch shares the grief'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'Of two tribes he mentions one leading family and one subordinate branch, to show that not only are all the families of Israel in general seized with the same grief, but all the separate branches of those families.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'

  - where: 'christ'
    claim: 'The spirit of grace brings the knowledge of sin and prayer for forgiveness'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'But this experience begets in the soul of sinful man the knowledge of sin and guilt, and prayer for the forgiveness of sin, i.e., supplication'

  - where: 'christ'
    claim: 'By the Spirit disciples find Christ'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Therefore, it is by the Spirit that disciples can find Christ (see 1 Corinthians 12:3).'

  # ---- added notes ----
  - where: 'setting'
    claim: '“Burden” should be translated “oracle”'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The word “burden” should be translated as “oracle,” giving a different meaning to the passage.'

  - where: 'setting'
    claim: 'The titles of God follow Isaiah 42:5 and remove doubt that the prediction will be fulfilled'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/12.htm'
    quote: 'The predicates of God are formed after Isaiah 42:5 (see also Amos 4:13), and describe God as the creator of the universe, and the former of the spirits of all men, to remove all doubt as to the realization'

  - where: 'note 12:2 “A cup that makes the nations reel”'
    claim: 'Saph ra‘al: goblet of reeling, figurative'
    key: bdb
    url: 'https://biblehub.com/hebrew/5592.htm'
    quote: 'goblet of reeling (intoxicating, figurative)'

  - where: 'note 12:2 “A cup that makes the nations reel”'
    claim: 'Ra‘al occurs only here, figurative of Jerusalem'
    key: bdb
    url: 'https://biblehub.com/hebrew/7478.htm'
    quote: 'goblet of reeling (figurative of Jerusalem)'

  - where: 'note 12:2 “A cup that makes the nations reel”'
    claim: 'Jerusalem is the cup that makes the enemies stagger'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The oracle stated that Jerusalem would be the cup of wine that would cause the enemies to stagger.'

  - where: 'note 12:2 “A cup that makes the nations reel”'
    claim: 'No battle; the attackers tremble in a drunken stupor'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'When the people arrived to attack Jerusalem, there would be no battle; they would simply tremble in drunken stupor.'

  - where: 'note 12:3 “A stone too heavy to lift”'
    claim: 'Probably the image is of a boulder too heavy to lift; nations that try to capture Jerusalem will find it difficult'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: '“Those nations that take in hand to capture and rule Jerusalem will find it difficult. Probably the idea is that of raising and carrying a boulder that is too heavy for a man’s strength.”'

  - where: 'note 12:3 “A stone too heavy to lift”'
    claim: 'As the place of the Crucifixion, the city may foreshadow the Atonement'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'As the place of the Lord’s Crucifixion, the city here may be foreshadowing the Atonement of Christ.'

  - where: 'note 12:3 “A stone too heavy to lift”'
    claim: 'Jerusalem a stumbling block the people must face, like the Crucifixion in 1 Cor 1:23'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Jerusalem would become a burdensome stone, a stumbling block that the people would have to face.'

  - where: 'note 12:7 “The victory is the Lord’s”'
    claim: 'The Lord defends Jerusalem, so the glory is His'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Verse 8 of this chapter states that the Lord will “defend the inhabitants of Jerusalem,” thus giving Him the glory.'

  - where: 'note 12:7 “The victory is the Lord’s”'
    claim: 'The people participate, but the Lord is the victor'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Although the people will participate, the Lord will be the victor.'

  - where: 'note 12:7 “The victory is the Lord’s”'
    claim: '“Feeble” in 12:8 is the participle of kashal, tottering, as in 1 Sam 2:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/3782.htm'
    quote: '2 be tottering, feeble'

  - where: 'note 12:7 “The victory is the Lord’s”'
    claim: 'The same participle in 1 Sam 2:4 and Zech 12:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/3782.htm'
    quote: 'so participle 1 Samuel 2:4; Zechariah 12:8.'

  - where: 'note 12:10 “The spirit of grace and of supplications”'
    claim: 'Chen: favour, acceptance'
    key: bdb
    url: 'https://biblehub.com/hebrew/2580.htm'
    quote: '2 favour, acceptance:'

  - where: 'note 12:10 “The spirit of grace and of supplications”'
    claim: 'Chen with God in Zech 4:7 and 12:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/2580.htm'
    quote: 'b. with God Zechariah 4:7 (twice in verse); Zechariah 12:10'

  - where: 'note 12:10 “The spirit of grace and of supplications”'
    claim: 'Tachanunim: supplication for favour'
    key: bdb
    url: 'https://biblehub.com/hebrew/8469.htm'
    quote: 'plural abstract supplication for favour'

  - where: 'note 12:10 “The spirit of grace and of supplications”'
    claim: 'Supplication to God, Zech 12:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/8469.htm'
    quote: '2 to God:'

  - where: 'note 12:10 “The spirit of grace and of supplications”'
    claim: 'Eyes opened only after a witness by the Spirit'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Their eyes were opened to understanding only after they received a witness by the Spirit.'

  - where: 'note 12:10 “Mourning as for an only son”'
    claim: 'The deliverance prepares the Jews to recognize Jesus; D&C 45 expands Zechariah'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'This miraculous deliverance will prepare the Jews to recognize and accept Jesus Christ as the Messiah. Expanding on Zechariah’s prophecies, the Lord explained in Doctrine and Covenants 45'

  - where: 'note 12:10 “Mourning as for an only son”'
    claim: 'After His answer, they weep (D&C 45:53)'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The Lord then declared, “And then shall they weep because of their iniquities; then shall they lament because they persecuted their king.”'

  - where: 'note 12:10 “Mourning as for an only son”'
    claim: 'The wounds of D&C 45 are connected to 12:10, so D&C 45 expands this prophecy'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'The wounds He received in the house of His friends are furthermore connected to wounds that Israel gave the Lord in Zechariah 12:10.'

  - where: 'note 12:12 “Every family apart”'
    claim: 'The recognition begins the collective repentance and conversion of the Jews, not repentance for the death of Christ, of which they are not guilty'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'would begin “the long-awaited collective repentance and conversion of the Jews. This is not repentance for the death of Christ, for these Jews are not guilty of that. Rather, it is the same repentance that all who come unto Christ must go through.”'

  - where: 'christ'
    claim: 'The repentance is the same that all who come unto Christ must go through'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'Rather, it is the same repentance that all who come unto Christ must go through.'
