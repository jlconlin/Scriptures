chapter: 13
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Zechariah prophesied 520–518 B.C.; chapters 9–14 are the second division of his book'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.). The book of Zechariah has two divisions: Zech. 1–8, a series of visions sketching the future of the people of God, and Zech. 9–14, prophecies about the Messiah'

  # ---- setting ----
  - where: 'setting'
    claim: 'Scripture Helps reads chapters 12–14 together as the last days, around Jerusalem, before the Second Coming'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah prophesied of a great final battle that will take place in and around Jerusalem in the last days, just prior to the Second Coming of Jesus Christ.'
  - where: 'setting'
    claim: '13:1 continues the penitent supplication of 12:10–14'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'The penitential supplication of Israel will lead to a thorough renewal of the nation, since the Lord will open to the penitent the fountain of His grace for the cleansing away of sin and the sanctifying of life.'
  - where: 'setting'
    claim: 'Jesus quoted 13:7 on the Mount of Olives after the Last Supper'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'He illustrates their expected behavior with a passage from Zechariah 13:7, using this prophecy about the sheep scattering after the shepherd had been struck to anticipate how the disciples would flee when Jesus was arrested in Gethsemane.'
  - where: 'setting'
    claim: 'In D&C 45 the Lord adapts 13:6 to Himself'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'While Zechariah 13:6 was originally a part of a larger prophecy referring to the end of false prophets (another theme found in the Olivet Discourse), the Lord adapts the language to fit a new context.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The cleansing is followed by the removal of everything that hinders holiness: idols and false prophets'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'This cleansing will be following by a new life in fellowship with God, since the Lord will remove everything that could hinder sanctification.'
  - where: 'thread'
    claim: 'Smiting the shepherd scatters the flock, but the Lord turns His hand to save a remnant'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'the dispersion to be inflicted upon Israel will only be the cause of ruin to the greater portion of the nation, whereas it will bring salvation to the remnant.'

  # ---- note 13:1 ----
  - where: 'note 13:1 “A fountain for sin and for uncleanness”'
    claim: 'A fountain is naturally flowing, “living” water, the kind used for washing sin'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The term “fountain” implies a source of running, naturally flowing water. This was what is called “living water” in the Bible. Places with flowing water were ideal for baptism and the washing of sin and uncleanness (compare Mark 1:4–5).'
  - where: 'note 13:1 “A fountain for sin and for uncleanness”'
    claim: '“Uncleanness” (niddah) is used figuratively of idolatry and immorality, and in Zech 13:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: '2 figurative (with allusion to cerem. usage), impure thing, Ezekiel 7:19,20 (of gold), Lamentations 1:17 (of Jerusalem); of idolatry, immorality, etc., 2Chronicles 29:5; Ezra 9:11 (אֶרֶץ נִדָּה), Ezra 9:11, Zechariah 13:1'
  - where: 'note 13:1 “A fountain for sin and for uncleanness”'
    claim: 'Numbers 19:9’s “water of separation” is mê niddâ, the same word niddah (H5079)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נִדָּ֖ה'
  - where: 'note 13:1 “A fountain for sin and for uncleanness”'
    claim: 'The Church’s footnote on “fountain” points to baptism'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: '“fountain”: TG Baptism.'

  # ---- note 13:3 ----
  - where: 'note 13:3 “Parents against a lying prophet”'
    claim: '“Thrust him through” in 13:3 is H1856, dāqar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'דְקָרֻ֜'
  - where: 'note 13:3 “Parents against a lying prophet”'
    claim: 'The people would reject even their own family members who preach lies'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'So righteous would be the people that they would reject their own family members who would preach lies. They would stand up against a counterfeit gospel, no matter who the communicator was.'

  # ---- note 13:4 ----
  - where: 'note 13:4 “The rough garment”'
    claim: '“Rough garment” is ʾadderet śēʿār, a mantle of hair'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'אַדֶּ֥רֶת'
  - where: 'note 13:4 “The rough garment”'
    claim: 'Elijah’s mantle in 2 Kgs 2:13 is the same word, H155'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'אַדֶּ֣רֶת'
  - where: 'note 13:4 “The rough garment”'
    claim: 'The Church’s footnote on “rough” points to John the Baptist’s clothing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: '“rough”: Matt. 3:4.'

  # ---- note 13:5 ----
  - where: 'note 13:5 ““Man taught me to keep cattle””'
    claim: 'The KJV derived the verb from the noun for cattle; others read “caused one to purchase me,” made me a bondman'
    key: bdb
    url: 'https://biblehub.com/hebrew/7069.htm'
    quote: 'Zechariah 13:5; AV makes denominative of מִקְנֶה cattle; Thes RV MartiKau Buhl caused (one) to purchase me, i.e. made me a bondman'
  - where: 'note 13:5 ““Man taught me to keep cattle””'
    claim: 'The verb qanah means to acquire or buy'
    key: bdb
    url: 'https://biblehub.com/hebrew/7069.htm'
    quote: '7069. קָנָה (qanah) -- To acquire, to buy, to possess, to create'
  - where: 'note 13:5 ““Man taught me to keep cattle””'
    claim: 'Other scholars emend the text to read “the ground is my possession”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7069.htm'
    quote: 'We Now GASm read אֲרָמָה קִנְיָנִי'
  - where: 'note 13:5 ““Man taught me to keep cattle””'
    claim: 'The man is distancing himself from the false prophets, claiming to be a farmer'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'shifts to a farmer who explicitly claims, “I am no prophet,” apparently seeking to distance himself from the group of false prophets condemned in the previous verses.'

  # ---- note 13:6 ----
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'In context the wounds could identify the man as a prophet; self-cutting was a sign of non-Israelite prophets'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'The farmer is then asked about wounds that he has received, wounds that could identify him as a prophet, since self-flagellation and cutting were often signs of non-Israelite prophets.'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'The wounds between the hands were probably self-inflicted, as with the prophets of Baal (1 Kgs 18:28)'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'The wounds between the prophet’s hands were probably wounds made in an ecstatic orgy (1 Kgs 18:28).'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'The Hebrew says “between thine hands”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'יָדֶ֑י/ךָ'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'His answer places the wounds outside a prophetic setting; the point is that false prophets must explain away their marks'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'The point of Zechariah’s prophecy seems to be that at some future time, false prophets will be sought out and condemned, driven to offer alternative explanations for their prophetic marks.'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'In D&C 45 the words refer to Jesus Christ, once mistaken for a false prophet'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'Now, rather than referring to a false prophet who was cast out by the faithful believers, “wounded in the house of my friends” refers to Jesus Christ—one who was mistakenly identified as a false prophet during His mortal ministry'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'D&C 45 keeps Zechariah’s language and gives it a new application'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'What D&C 45 does is expand upon Zechariah 13:6 and 14:4 by maintaining the language but drastically shifting the context so that Zechariah’s words have a new application and meaning.'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'Scripture Helps reads D&C 45 as the Lord expanding Zechariah’s prophecies'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Expanding on Zechariah’s prophecies, the Lord explained in Doctrine and Covenants 45 that the Jews will look upon Him and ask, “What are these wounds in thine hands and in thy feet?”'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'Scripture Helps’ endnote names Zechariah 12:10 and 13:6 as the prophecies D&C 45 expands'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'See Zechariah 12:10; 13:6.'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'The wounds are connected with those of 12:10, which John 19:37 applies to the crucifixion'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'The wounds He received in the house of His friends are furthermore connected to wounds that Israel gave the Lord in Zechariah 12:10. Moreover, this passage was cited in John 19:37'
  - where: 'note 13:6 ““What are these wounds in thine hands?””'
    claim: 'The wounds further identify Jesus as the Messiah'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'this passage was cited in John 19:37 to specifically refer to the wounds Jesus received as He was crucified, and these wounds further identifying Jesus as the Messiah.'

  # ---- note 13:7 fellow ----
  - where: 'note 13:7 ““The man that is my fellow””'
    claim: 'ʿāmît means associate, fellow, relation'
    key: bdb
    url: 'https://biblehub.com/hebrew/5997.htm'
    quote: '[עָמִית] noun masculineLeviticus 18:20 associate, fellow, relation'
  - where: 'note 13:7 ““The man that is my fellow””'
    claim: 'The footnote gives “who stands next to me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: 'OR who stands next to me.'
  - where: 'note 13:7 ““The man that is my fellow””'
    claim: 'The word is used in the law as a synonym of “brother,” the nearest one'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'is only used as a synonym of אח (cf. Leviticus 25:15) in the concrete sense of the nearest one.'
  - where: 'note 13:7 ““The man that is my fellow””'
    claim: 'No owner would call a hired shepherd his ʿāmîth'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'No owner of a flock or lord of a flock would call a hired or purchased shepherd his ‛âmı̄th.'
  - where: 'note 13:7 ““The man that is my fellow””'
    claim: 'The one God calls His fellow can only be one who participates in the divine nature'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'he whom God calls His neighbour cannot be a mere man, but can only be one who participates in the divine nature, or is essentially divine.'
  - where: 'note 13:7 ““The man that is my fellow””'
    claim: 'The summons to the sword says the smiting takes place according to the will of God'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'The summons addressed to the sword, to awake and smite, is a poetical turn to express the thought that the smiting takes place with or according to the will of God.'
  - where: 'note 13:7 ““The man that is my fellow””'
    claim: 'God is said to strike the Messiah, as in Isaiah 53:10, though men do it'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'Thus in Isaiah 53:10 the mortal sufferings of the Messiah are described as inflicted upon Him by God, although He had given up His soul to death to bear the sin of the people.'

  # ---- note 13:7 shepherd ----
  - where: 'note 13:7 “The Shepherd smitten and the sheep scattered”'
    claim: 'The Shepherd of Israel is Jesus Christ'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The Shepherd of Israel is Jesus Christ.'
  - where: 'note 13:7 “The Shepherd smitten and the sheep scattered”'
    claim: 'Jesus used 13:7 to anticipate the disciples’ flight, and softened it with the promise of Galilee'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Jesus softens how they would fail to stand with him, however, by promising that he would go before them into Galilee, which is later realized when he appears to them there after his Resurrection.'
  - where: 'note 13:7 “The Shepherd smitten and the sheep scattered”'
    claim: 'The tie to 13:7 makes Jesus’s saying almost certainly a prediction'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'which is almost certainly a prediction because of its tie to the prophecy from Zechariah 13:7 that the sheep will be scattered when the shepherd is struck.'
  - where: 'note 13:7 “The Shepherd smitten and the sheep scattered”'
    claim: 'The Lord brought back His hand over the disciples; “little ones” in a good sense; a wider fulfilment in Israel'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'But the Lord soon brought back His hand over the disciples. The promise, ‘But after my resurrection I will go before you into Galilee,’ is a practical exposition of the bringing back of the hand over the small ones'
  - where: 'note 13:7 “The Shepherd smitten and the sheep scattered”'
    claim: 'The fulfilment with the disciples did not exhaust the verse'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'This special fulfilment did not indeed exhaust the meaning of the verses before us; but they had a much more general fulfilment in the whole of the nation of Israel.'

  # ---- note 13:9 ----
  - where: 'note 13:9 “Refined as silver”'
    claim: 'Verse 9 shows the bringing back of the hand on the little ones realized in the remnant'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'Zechariah 13:9 shows how the bringing back of the hand upon the small ones will be realized in the remnant of the nation.'
  - where: 'note 13:9 “Refined as silver”'
    claim: 'The remaining third is refined through affliction to purify it from sin and make it a holy nation'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'The remaining third is also to be refined through severe afflictions, to purify it from everything of a sinful nature, and make it into a truly holy nation of God.'
  - where: 'note 13:9 “Refined as silver”'
    claim: 'The figure of refining compares with Malachi 3:3; the thought of the verse with Hosea 2:23 and Jeremiah 30:22'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'For the figure of melting and refining, compare Isaiah 1:25; Isaiah 48:10; Jeremiah 9:6; Malachi 3:3; Psalm 66:10. For the expression in Zechariah 13:9, compare Isaiah 65:24; and for the thought of the whole verse, Zechariah 8:8, Hosea 2:23'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jesus used 13:7 the night of His arrest, of His disciples’ flight'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'He illustrates their expected behavior with a passage from Zechariah 13:7, using this prophecy about the sheep scattering after the shepherd had been struck to anticipate how the disciples would flee when Jesus was arrested in Gethsemane.'
  - where: 'christ'
    claim: 'In D&C 45 the words of 13:6 refer to Jesus Christ'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: '“wounded in the house of my friends” refers to Jesus Christ'
  - where: 'christ'
    claim: 'The Church’s footnote on “fountain” points to baptism'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: '“fountain”: TG Baptism.'
  - where: 'christ'
    claim: 'Jesus softened the warning with the promise of Galilee, kept after His Resurrection'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Jesus softens how they would fail to stand with him, however, by promising that he would go before them into Galilee, which is later realized when he appears to them there after his Resurrection.'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'Matthew follows Mark in using the Zechariah quotation'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'The Matthean version (Matthew 26:30–35) similarly places the prediction on the Mount of Olives after the Last Supper and uses the Zechariah quotation'
