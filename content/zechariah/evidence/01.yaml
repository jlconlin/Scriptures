chapter: 1
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Zechariah prophesied from the second to the fourth year of Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.)'
  - where: 'when'
    claim: 'Zechariah prophesied in Jerusalem after the return from exile'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Like Haggai, Zechariah prophesied in Jerusalem after the Jews returned from Babylonian exile.'

  # ---- setting ----
  - where: 'setting'
    claim: 'By the dates in the text the book begins in November 520 B.C.'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'According to the dates offered in the text, the book of Zechariah begins in November 520 BC.'
  - where: 'setting'
    claim: 'Zechariah’s revelation came about two months after Haggai’s'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Zechariah’s revelation came about two months after Haggai’s (see Haggai 1:1 and Zechariah 1:1).'
  - where: 'setting'
    claim: 'The work had stalled at the foundation for a decade and a half, from poverty, animosities and political disruption; Darius was secure by 520; the Lord raised up Haggai and Zechariah; the temple was completed in 515 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Darius (son of Hystaspes) took the throne and was securely in power by 520 BC. A decade and a half had passed, and work on the temple had not progressed beyond laying the foundation stones.'
  - where: 'setting'
    claim: 'Poverty, political disruption and animosities halted construction; the Lord raised up Haggai and Zechariah; the temple was completed in 515 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'the weight of poverty, political disruption, animosities, and a backbreaking need to survive brought the construction to a halt … the Lord raised up Haggai and Zechariah to spur on his beleaguered people.'
  - where: 'setting'
    claim: 'The temple was completed in 515 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The second temple was completed in 515 BC'
  - where: 'setting'
    claim: 'Verses 1–6 are the introduction to the book: a warning to hear and repent by the example of the fathers'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 1:1–6, introduction: warning to hear and repent, by the example of the fathers'
  - where: 'setting'
    claim: 'The visions run from 1:7 to 6:8, the eighth vision'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 6:1–8, eighth vision, horsemen, called also winds (Rev. 7:1), going to all quarters of the earth'
  - where: 'setting'
    claim: 'Three months after his call Zechariah saw a series of visions'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'Three months after his call to be a prophet through the first word of God that was addressed to him, Zechariah received a comprehensive revelation concerning the future fate of the people and kingdom of God, in a series of visions, which were given him to behold in a single night'
  - where: 'setting'
    claim: 'Chapters 1–8 are words of encouragement during the rebuilding, with eight symbolic visions'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah 1–8: Words of encouragement given during the temple reconstruction, including eight symbolic visions'
  - where: 'setting'
    claim: 'Chapters 9–14 are prophecies of Christ’s ministry, the last days and the Second Coming'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah 9–14: Prophecies concerning the ministry of Jesus Christ and the events surrounding the last days and the Savior’s Second Coming.'
  - where: 'setting'
    claim: 'In the Hebrew text, King James 1:18–21 is the beginning of chapter 2, which has seventeen verses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'osisID="Zech.2.17"'

  # ---- thread ----
  - where: 'thread'
    claim: 'The returned exiles were growing impatient and losing faith, seeing no sign of God’s presence'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The occasion of the visions is the growing impatience of the returned exiles. They could perceive no sign of God’s presence, or of His interest in their labours and difficulties.'
  - where: 'thread'
    claim: 'The verb of “turn” in verse 3 (H7725) is the verb of “I am returned” in verse 16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'שַׁ֤בְתִּי'
  - where: 'thread'
    claim: '“I am returned” describes the Lord’s return as already begun and continuing'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'The perfect שׁבתּי is not purely prophetic, but describes the event as having already commenced, and as still continuing.'

  # ---- section plain ----
  - where: 'section 3 plain'
    claim: '“Carpenters” is craftsmen; “fray” is terrify'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: '20a “carpenters”: HEB craftsmen or artisans.'
  - where: 'section 3 plain'
    claim: '“Fray” is terrify'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: '21a “fray”: HEB terrify.'

  # ---- notes ----
  - where: 'note 1:1 “Zechariah, son of Berechiah”'
    claim: 'The name means “Jehovah remembers”'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'the prophet’s name means “Jehovah remembers.”'
  - where: 'note 1:1 “Zechariah, son of Berechiah”'
    claim: 'Zechariah descended from the priest Iddo, who returned with Zerubbabel'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'He was the son of the priest Iddo, who had returned to Jerusalem with Zerubbabel.'
  - where: 'note 1:1 “Zechariah, son of Berechiah”'
    claim: 'The Bible Dictionary connects the prophet with Nehemiah 12:4 and 16'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Son of Berechiah, son of Iddo (Neh. 12:4, 16); a contemporary of Haggai (Ezra 5:1; 6:14)'
  - where: 'note 1:1 “Zechariah, son of Berechiah”'
    claim: 'The sixth-century prophet is to be kept apart from the martyr of Matthew 23:35'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'This additional confusion compounds the problem of separating the sixth-century prophet from the ninth-century martyred high priest in Matthew 23:35.'

  - where: 'note 1:3 “Turn, and I will turn”'
    claim: 'The same verb (H7725, šûb) stands in both halves of verse 3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'אָשׁ֣וּב'
  - where: 'note 1:3 “Turn, and I will turn”'
    claim: 'The same verb is “returned” in verse 6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'יָּשׁ֣וּבוּ'
  - where: 'note 1:3 “Turn, and I will turn”'
    claim: 'The same verb is “I am returned” in verse 16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'שַׁ֤בְתִּי'
  - where: 'note 1:3 “Turn, and I will turn”'
    claim: 'Turning is the Old Testament way of speaking of repentance; the Book of Mormon uses turn and repent together'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The command to turn, especially from evil, is the Old Testament way of speaking of repentance (verse 3). The Book of Mormon utilizes the verbs turn and repent synonymously'
  - where: 'note 1:3 “Turn, and I will turn”'
    claim: 'Apparently repentance runs both ways: as the disciple turns, God draws closer'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Apparently, it is bidirectional. The Lord told Zechariah that during the repentance process, as the disciple turns to God, God simultaneously draws closer, bridging the gap.'
  - where: 'note 1:3 “Turn, and I will turn”'
    claim: 'The people had returned physically but many were still far from the Lord spiritually'
    key: ot-institute-manual-48
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/48-haggai-zechariah?lang=eng'
    quote: 'But although they had physically returned to Jerusalem, many people were still far from the Lord spiritually.'

  - where: 'note 1:6 “Words that overtook the fathers”'
    claim: '“Take hold of” is hiśśîgû, from nāśag (H5381)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'הִשִּׂ֖יגוּ'
  - where: 'note 1:6 “Words that overtook the fathers”'
    claim: 'The verb means to reach, overtake'
    key: bdb
    url: 'https://biblehub.com/hebrew/5381.htm'
    quote: 'to reach, overtake'
  - where: 'note 1:6 “Words that overtook the fathers”'
    claim: 'The fathers refused to hear, were overtaken by God’s judgments, and acknowledged them just'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'by the example of the fathers, who refused to hear and were overtaken by God’s judgments, justly, as they acknowledged.'

  - where: 'note 1:8 “Horsemen among the myrtles”'
    claim: 'The riders go over the earth to report on the nations in the interests of Jerusalem'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'first vision, riders on horses of various colors, which go over all the earth to report on the state of the nations in the interests of Jerusalem.'
  - where: 'note 1:8 “Horsemen among the myrtles”'
    claim: 'The place and the colours are significant but hard to interpret; the “bottom” is probably a deep hollow; myrtles thrive in damp soil'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'Here it signifies, in all probability, a deep hollow, possibly with water in it, as myrtles flourish particularly well in damp soils and by the side of rivers'
  - where: 'note 1:8 “Horsemen among the myrtles”'
    claim: 'One reading: the myrtle grove pictures the land dear to the Lord, and the hollow its degradation'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'In the myrtle-bushes, or myrtle grove, we have no doubt a symbol of the theocracy, or of the land of Judah as a land that was dear and lovely in the estimation of the Lord'
  - where: 'note 1:8 “Horsemen among the myrtles”'
    claim: 'The hollow represents the deep degradation of the land and people'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'Hence the hollow in which the myrtle grove was situated, can only be a figurative representation of the deep degradation into which the land and people of God had fallen at that time.'
  - where: 'note 1:8 “Horsemen among the myrtles”'
    claim: 'Red is blood; white the reflection of divine glory and the symbol of a glorious victory'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'About two of the colours there is no dispute. אדום, red, the colour of the blood; and לבן, white, brilliant white, the reflection of heavenly and divine glory'

  - where: 'note 1:8 “Horsemen among the myrtles”'
    claim: 'The footnote glosses “bottom” as the valley'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: '8a “bottom”: IE of the valley.'
  - where: 'note 1:9 “The angel who explains”'
    claim: 'In apocalyptic fashion a messenger helps the prophet understand; seers see, but understanding comes with divine help'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'In apocalyptic fashion, a messenger aided the prophet in understanding the meaning of the visions.[4] As seers, prophets have the ability to see (Zechariah 1:8; Moses 1:8), but interpretation and understanding come with divine help (Moses 1:30; 7:67).'
  - where: 'note 1:9 “The angel who explains”'
    claim: 'An angelic guide who expounds a vision is a prevalent theme in comparable apocalyptic scenes'
    key: sc-knowhy-492
    url: 'https://scripturecentral.org/knowhy/why-were-lehi-and-nephi-guided-by-angelic-escorts-in-their-visions'
    quote: 'One component to both Lehi''s and Nephi''s respective visions was the presence of an angelic guide who led them through the vision and expounded on the meaning of what they were witnessing. This is a prevalent theme found in comparable apocalyptic scenes'
  - where: 'note 1:9 “The angel who explains”'
    claim: 'Nephi’s angel directed his attention and asked questions to draw out his understanding'
    key: sc-knowhy-492
    url: 'https://scripturecentral.org/knowhy/why-were-lehi-and-nephi-guided-by-angelic-escorts-in-their-visions'
    quote: 'accompanied Nephi for the remainder of his vision, directing his attention towards crucial historical scenes and asking questions to draw out Nephi’s understanding of what he was viewing.'
  - where: 'note 1:9 “The angel who explains”'
    claim: 'The KnoWhy points to Zechariah 1–6 among the comparable scenes'
    key: sc-knowhy-492
    url: 'https://scripturecentral.org/knowhy/why-were-lehi-and-nephi-guided-by-angelic-escorts-in-their-visions'
    quote: 'See further Zechariah 1–6 and Ezekiel 40–48.'
  - where: 'note 1:9 “The angel who explains”'
    claim: 'The two figures are named differently in the chapter: the angel that talked with me (verses 9, 13, 14, 19) and the angel of the LORD (verses 11–12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'Then the angel of the LORD answered and said, O LORD of hosts, how long wilt thou not have mercy on Jerusalem'

  - where: 'note 1:11 “Why a quiet earth was bad news”'
    claim: 'Haggai had promised God would shake the kingdoms; time passed with no sign, and the people began to lose faith'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Haggai had assured them that in ‘a little while’ God would ‘shake the kingdoms’ and fill His house with glory (Haggai 2:6, 7). But time passed and there was no sign of this. The people began to lose faith in God.'
  - where: 'note 1:11 “Why a quiet earth was bad news”'
    claim: 'The first vision assures the people that God knows their circumstances, His messengers having seen them'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The first vision assures them that God knows every detail of their circumstances.'
  - where: 'note 1:11 “Why a quiet earth was bad news”'
    claim: 'In the second year of Darius the nations were at peace and prosperous while Judah lay waste and Jerusalem was unwalled; no improvement could be expected while the nations were at rest'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'In the second year of Darius there prevailed universal peace; all the nations of the earlier Chaldaean empire were at rest, and lived in undisturbed prosperity. Only Judaea, the home of the nation of God, was still for the most part lying waste'
  - where: 'note 1:11 “Why a quiet earth was bad news”'
    claim: 'While the nations enjoyed peace, Judah could expect no improvement'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'As long as the nations of the world enjoyed undisturbed peace, Judah could not expect any essential improvement in its condition.'
  - where: 'note 1:11 “Why a quiet earth was bad news”'
    claim: 'The vision came two months after Haggai’s last promise (Haggai 2:10–23, including 2:22)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'two months after the last promise issued through Haggai to the people, that the Lord would from henceforth bless His nation, and would glorify it in the future (Haggai 2:10-23)'

  - where: 'note 1:12 “Seventy years”'
    claim: 'The seventy years come from Jeremiah; the captivity was not exactly seventy years, and it can be counted from an earlier start or to the temple’s rebuilding; seventy came to symbolize the exile'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Although the captivity did not last exactly seventy years (though one may count starting at an earlier time or consider the construction of the temple to be when the captivity ended), the number seventy came to symbolize the exile, no matter the exact duration.'
  - where: 'note 1:12 “Seventy years”'
    claim: 'Jeremiah foretold seventy years of serving Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'these nations shall serve the king of Babylon seventy years.'

  - where: 'note 1:16 “The house shall be built”'
    claim: 'The Lord proclaimed concerning Jerusalem in Zechariah’s day that His house would be built'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Concerning Jerusalem in Zechariah’s day, the Lord proclaimed, “I am returned to Jerusalem with mercies: my house shall be built in it, saith the Lord of hosts” (Zechariah 1:16).'
  - where: 'note 1:16 “The house shall be built”'
    claim: 'A prominent theme of the book is God’s feelings for Jerusalem in Zechariah’s day, the meridian of time, and the latter days'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'A prominent theme in the book of Zechariah is the exploration of God’s feelings for the city of Jerusalem and her inhabitants in Zechariah’s day, in the meridian of time, and in the latter days.'
  - where: 'note 1:16 “The house shall be built”'
    claim: 'The temple was completed in 515 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The second temple was completed in 515 BC'
  - where: 'note 1:16 “The house shall be built”'
    claim: 'The measuring line marks off the space a city is to occupy and its plan'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'The measuring line is drawn over a city, to mark off the space it is to occupy, and the plan upon which it is to be arranged.'
  - where: 'note 1:16 “The house shall be built”'
    claim: 'The temple finished under Darius and Jerusalem restored by Nehemiah were a beginning and a pledge of the glory the earlier prophets foretold'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'whilst the commencement of the fulfilment is to be seen in the fact that the building of the temple was finished in the sixth year of Darius, and Jerusalem itself was also restored by Nehemiah in the reign of Artaxerxes, these commencements of the fulfilment simply furnished a pledge'

  - where: 'note 1:18 “Four horns and four craftsmen”'
    claim: 'Mesopotamian kings had horns on their crowns, so horns were a symbol of power; why four is unclear, perhaps the four corners of the earth'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Because the kings of Mesopotamia (as those of medieval Europe) had horns on their crown, horns were a symbol of power.[7] It is not clear why there were four, but they may represent the four corners of the known earth that Persia governed at this time.'
  - where: 'note 1:18 “Four horns and four craftsmen”'
    claim: 'The carpenters may have been the temple builders; the Lord would combat the nations by returning temple worship, which made the temple urgent'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'These carpenters (artisans) may have been the temple builders. In other words, the Lord will combat the gentile nations by returning temple worship to His people. This is another reason why constructing the temple was so urgent.'
  - where: 'note 1:18 “Four horns and four craftsmen”'
    claim: 'The horn is a symbol of power (compare Amos 6:13); the horns are the powers of the world hostile to Judah'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The horn is a symbol of power [compare Amos 6:13]. The horns therefore symbolize the powers of the world, which rise up in hostility against Judah and hurt it.'
  - where: 'note 1:18 “Four horns and four craftsmen”'
    claim: 'It is unclear which four empires are meant: Assyria, Babylonia, Persia and Media if past; Assyria, Babylonia, Greece and Rome if looking ahead'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'It is not clear which four empires are meant in this prophecy. If the prophecy referred to the empires of the past that engaged in the scattering, they would be Assyria, Babylonia, Persia, and Media.'
  - where: 'note 1:18 “Four horns and four craftsmen”'
    claim: 'If looking to the future, the four would be Assyria, Babylonia, Greece and Rome'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'But if Zechariah was also looking to the future, as Daniel did, the four empires would be Assyria, Babylonia, Greece, and Rome.'
  - where: 'note 1:18 “Four horns and four craftsmen”'
    claim: 'The vision does not show what powers God will use'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The vision does not show what powers God will use for this purpose. It is simply designed to show to the people of God, that every hostile power of the world which has risen up against it, or shall rise up, is to be judged and destroyed by the Lord.'
  - where: 'note 1:18 “Four horns and four craftsmen”'
    claim: 'The horns are all the agencies that scattered Israel; the craftsmen the divine agencies that counteract and destroy them'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'four horns—all the agencies that have scattered Israel; and four craftsmen—the divine agencies that shall counteract and destroy them.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah, rendered LORD in the KJV, is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
