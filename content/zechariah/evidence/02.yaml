chapter: 2
claims:
  - where: 'when'
    claim: 'Zechariah prophesied under Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'a contemporary of Haggai (Ezra 5:1; 6:14); prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.).'
  - where: 'setting'
    claim: 'Chapter 2 is the third vision, a man with a measuring line'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 2, third vision, a man with a measuring line to measure Jerusalem.'
  - where: 'setting'
    claim: 'Zechariah and Haggai inspired the Jews to finish rebuilding the temple'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Both he and Haggai were instrumental in organizing and inspiring the Jews to finish rebuilding the temple.'
  - where: 'setting'
    claim: 'Jerusalem lay in rubble after its destruction'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'When Jerusalem was destroyed, Judah’s supposition that Jehovah would protect Jerusalem under all circumstances was shattered. The city lay in rubble.'
  - where: 'setting'
    claim: 'The promises of 2:4–5 and 2:12 encouraged the exiles rebuilding the temple'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Both of these declarations would have supplied much needed encouragement to the downtrodden exiles working to rebuild the temple.'
  - where: 'setting'
    claim: 'Verses 1–5 are the vision, 6–13 its prophetic explanation'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'the third (Zechariah 2:1-5) with the prophetic explanation (Zechariah 2:6-13) shows the development of the people and kingdom of God till the time of its final glory.'
  - where: 'setting'
    claim: 'The Church’s chapter heading reads the chapter of the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/2?lang=eng'
    quote: 'In the last days, Judah will gather to Jerusalem—The people will come from the land of the north—The Lord will dwell among them.'
  - where: 'thread'
    claim: 'Through God dwelling in the midst of Jerusalem (2:10–11) the promise of 2:5 is fulfilled, and the city receives the expansion of 2:4'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'Jerusalem will thereby receive the expansion shown to the prophet in Zechariah 2:4; and through the dwelling of God in the midst of her, the promise in Zechariah 2:5 will also be fulfilled.'
  - where: 'thread'
    claim: 'Verse 11’s nations joined to the Lord complement the city without walls of verse 4'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Complementary to the prophecy of a Jerusalem with no walls (see Zechariah 2:4), the Lord repeated the words from previous scriptures that “many nations shall be joined to the Lord” (verse 11).'
  - where: 'thread'
    claim: 'The address of 2:6–9 explains the promise of 2:4–5 and assigns its reason'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'shows that the address which follows is not a simple continuation of the promise in Zechariah 2:4 and Zechariah 2:5, but is intended both to explain it, and to assign the reason for it.'
  - where: 'note 2:1 “Measuring a city that cannot be measured”'
    claim: 'The vision means the city will be immeasurable and overflow with people'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'The city shall be immeasurable and overflow with people.'
  - where: 'note 2:1 “Measuring a city that cannot be measured”'
    claim: 'Measuring breadth and length presupposes the city exists; the vision shows the future Jerusalem as existing to the spiritual eye'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'the vision shows the future Jerusalem, but it exhibits it as a city in actual existence, and visible to the spiritual eye.'
  - where: 'note 2:1 “Measuring a city that cannot be measured”'
    claim: 'The measuring man is not the interpreting angel; the conjecture that he is the angel of the Lord cannot be proved'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'we agree with those who conjecture that he is the angel of Jehovah, although this conjecture cannot be distinctly proved.'
  - where: 'note 2:1 “Measuring a city that cannot be measured”'
    claim: 'The parallel of Ezekiel 40:3 suggests the measuring man is the angel of the Lord'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'according to the analogy of Ezekiel 40:3, the man with the measuring line most probably was the angel of Jehovah'
  - where: 'note 2:1 “Measuring a city that cannot be measured”'
    claim: 'Keil follows the majority of expositors in taking the young man to be the prophet, called so for his youth'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'We must therefore follow the majority of both the earlier and later expositors, and take the "young man" as being the prophet himself, who is so designated on account of his youthful age'
  - where: 'note 2:1 “Measuring a city that cannot be measured”'
    claim: 'The angel is to run because the message is good news'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'He is to make haste and bring this message, because it is good news, the realization of which will soon commence.'
  - where: 'note 2:5 “A wall of fire”'
    claim: 'The fire is the Lord’s presence and protection (footnote 5a’s Topical Guide entries)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/2?lang=eng'
    quote: '“fire”: TG God, Presence of; Protection, Divine.'
  - where: 'note 2:5 “A wall of fire”'
    claim: 'Nehemiah later called for the wall to be built, and his wall lasted for centuries'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Upon his arrival, Nehemiah cried, “Let us build up the wall of Jerusalem” (Nehemiah 2:17). Nehemiah’s wall lasted for centuries.'
  - where: 'note 2:5 “A wall of fire”'
    claim: 'No wall because of the multitude; the Lord’s fire takes its place'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Zechariah learned that Jerusalem would not have a wall because of the multitude of people who would inhabit it.'
  - where: 'note 2:5 “A wall of fire”'
    claim: 'Jerusalem did not grow beyond its walls until modern times'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Not until modern times has the city of Jerusalem grown beyond its walls.'
  - where: 'note 2:5 “A wall of fire”'
    claim: 'Verses 4–5 depict Jerusalem in the last days'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'In addition to this, Zechariah’s depiction of Jerusalem in the last days is stunning:'
  - where: 'note 2:7 “Out of Babylon”'
    claim: 'The land of the north is Babylon; the people were called to leave it and return home'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Whatever the case, the people were called to leave this land to the north and return home.'
  - where: 'note 2:7 “Out of Babylon”'
    claim: 'Babylon itself had been defeated; prophets called a city’s inhabitants its “daughter”'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Although Babylon was no longer in existence (it had been defeated), the people understood that the prophet was speaking of the “daughter” of Persia. Prophetic literature or statements often called the inhabitants of a city “daughter”'
  - where: 'note 2:8 “The apple of his eye”'
    claim: 'Psalm 17:8 pairs the apple of the eye with the shadow of His wings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/17?lang=eng'
    quote: 'Keep me as the apple of the eye, hide me under the shadow of thy wings'
  - where: 'note 2:8 “The apple of his eye”'
    claim: 'Deuteronomy 32:10: the Lord kept Israel as the apple of his eye'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'he led him about, he instructed him, he kept him as the apple of his eye.'
  - where: 'note 2:11 “The LORD sent by the LORD of hosts”'
    claim: 'In verse 8 the sender is Jehovah and the one sent is the angel of the Lord, not the prophet'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'The sender is Jehovah, and the person sent is not the prophet, but the angel of the Lord.'
  - where: 'note 2:11 “The LORD sent by the LORD of hosts”'
    claim: '“After glory” means to display God’s glory upon the nations by judgment'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'to get glory upon the heathen, i.e., to display the glory of God upon the heathen through the judgment by which their power is broken'
  - where: 'note 2:11 “The LORD sent by the LORD of hosts”'
    claim: 'The sent one’s acting is identical with God’s acting'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'The speaker is still the angel of the Lord; and his acting is identical with the acting of God.'
  - where: 'note 2:11 “The LORD sent by the LORD of hosts”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 2:11 “Many nations joined to the Lord”'
    claim: 'Verse 11 complements the city without walls of verse 4'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Complementary to the prophecy of a Jerusalem with no walls (see Zechariah 2:4), the Lord repeated the words from previous scriptures that “many nations shall be joined to the Lord” (verse 11).'
  - where: 'note 2:11 “Many nations joined to the Lord”'
    claim: 'The wall-less city fits the promise to Abraham and Isaiah’s prophecy of all nations at the temple'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Consistent with the blessing and responsibility offered to Abraham (see Genesis 12:3) and Isaiah’s prophecy regarding the blessings of the temple (see Isaiah 56:3–7)'
  - where: 'christ'
    claim: 'The dwelling of the Lord in Zion begins with the Son of God in the flesh and is completed at His return (John 1:14; Revelation 21:3)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/2.htm'
    quote: 'It commences with the coming of the Son of God in the flesh, and is completed by His return in glory (John 1:14 and Revelation 21:3).'
  - where: 'christ'
    claim: 'The Church’s footnote 11b links verse 11’s “midst” to D&C 1:36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/2?lang=eng'
    quote: '“midst”: D&C 1:36.'
  - where: 'christ'
    claim: 'If hearts are centered in God, He will be a wall of fire no wickedness can penetrate'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'According to Zechariah, if our hearts are centered in God, we will triumph with Him and God will be to us “a wall of fire round about” that no wickedness can penetrate (Zechariah 2:5).'
  - where: 'note 2:8 “The apple of his eye”'
    claim: 'In older English the apple of the eye is the pupil'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/apple'
    quote: 'The apple of the eye is the pupil.'
