chapter: 10
claims:
  # ---- when, setting, thread ----
  - where: 'when'
    claim: 'Zechariah prophesied 520–518 B.C.; chapters 9–14 carry no date of their own'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.)'
  - where: 'setting'
    claim: 'Chapters 9–14 are prophecies about the Messiah and the events before the Second Coming'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 9–14, prophecies about the Messiah and events preceding His Second Coming.'
  - where: 'setting'
    claim: 'The Bible Dictionary groups 9:11–10:2 together: Judah and Ephraim no more seek diviners'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Judah and Ephraim, miraculously strengthened of God, are victorious over the Greeks and shall no more seek to diviners, but to the Lord (9:11–10:2).'
  - where: 'setting'
    claim: 'The Bible Dictionary summarizes 10:3–12'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: '(b) A similar theme. Good shepherds displace the evil ones; Judah miraculously strengthened, with Ephraim fully restored, shall humble the pride of Assyria and Egypt (10:3–12).'
  - where: 'setting'
    claim: 'The ten tribes were carried into Assyria and lost to record; Judah went to Babylon and returned'
    key: nelson-gathering
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/the-gathering-of-scattered-israel?lang=eng'
    quote: 'Ten tribes were carried captive into Assyria. From there they became lost to the records of mankind. … Two remaining tribes continued a short time and then, because of their rebellion, were taken captive into Babylon. When they returned'
  - where: 'setting'
    claim: 'Both houses would return home'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Both the house of Judah (representing the kingdom in the south) and the kingdom of Joseph (representing the kingdom of Ephraim in the north) would return to their lands of inheritances.'
  - where: 'setting'
    claim: 'The promise was fulfilled in weak beginnings before Christ, by the return of many Jews from captivity'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'They were both fulfilled, in weak commencements only, in the times immediately following and down to the coming of Christ, by the return of many Jews out of captivity'
  - where: 'thread'
    claim: 'The same verb pāqad stands behind “I punished” and “hath visited” in 10:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'אֶפְק֑וֹד'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'The latter rain is the spring rain of March and April'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'The biblical “latter rain” comes in March and April.'
  - where: 'section 1 plain'
    claim: '“Bright clouds” are lightnings, the harbingers of rain; teraphim were house-deities'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'The lightnings are introduced as the harbingers of rain'
  - where: 'section 2 plain'
    claim: '“Goats” are the leading he-goats of a flock, figurative of leaders'
    key: bdb
    url: 'https://biblehub.com/hebrew/6260.htm'
    quote: 'as leaders of flock Jeremiah 50:8 (simile), hence figurative of princes and chief men Isaiah 14:9; Ezekiel 34:17'
  - where: 'section 2 plain'
    claim: '“Goodly horse” is the horse of his majesty'
    key: bdb
    url: 'https://biblehub.com/hebrew/1935.htm'
    quote: 'he will make them like the horse of his majesty in battle'
  - where: 'section 2 plain'
    claim: '“Out of him” is out of Judah, and the sense is future'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'From Him will be corner-stone, from Him the nail, from Him the war-bow; from Him will every ruler go forth at once.'
  - where: 'section 3 plain'
    claim: '“Hear them” may be read “answer them”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'OR answer.'
  - where: 'section 3 plain'
    claim: '“Hiss” is to whistle as a signal'
    key: bdb
    url: 'https://biblehub.com/hebrew/8319.htm'
    quote: 'verb hiss, perhaps also whistle, pipe'
  - where: 'section 3 plain'
    claim: 'They will increase as Israel increased in Egypt; there will not be room enough for them'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'points to the increase which Israel experienced in the olden time under the oppression of Egypt'
  - where: 'section 3 plain'
    claim: 'The subject of 10:11 is the Lord, who goes through the sea of affliction; the river is the Nile'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'The subject in Zechariah 10:11 is Jehovah. He goes, as once He went in the pillar of cloud as the angel of the Lord in the time of Moses, through the sea of affliction.'
  - where: 'section 3 plain'
    claim: 'The river is the Nile'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'Only the floods of the Nile'

  # ---- notes ----
  - where: 'note 10:1 “Ask the Lord for rain”'
    claim: 'The latter rain comes in March and April'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'The biblical “latter rain” comes in March and April.'
  - where: 'note 10:1 “Ask the Lord for rain”'
    claim: 'Verses 1–2 set two responses side by side: drawing near to the Lord or to idols'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Here Zechariah describes the two opposite responses that the people can give: drawing near to the Lord or to idols.'
  - where: 'note 10:1 “Ask the Lord for rain”'
    claim: 'The Lord keeps His covenants; idols and diviners speak lies'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The Lord is true to His covenants. However, idols and diviners can only speak lies.'
  - where: 'note 10:1 “Ask the Lord for rain”'
    claim: 'The footnote to “latter” points to Deuteronomy 11:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'Deut. 11:14; Joel 2:23.'

  - where: 'note 10:2 “Teraphim, diviners, and a flock with no shepherd”'
    claim: '“Idols” is hattərāpîm, the teraphim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'הַ/תְּרָפִ֣ים'
  - where: 'note 10:2 “Teraphim, diviners, and a flock with no shepherd”'
    claim: 'Teraphim were man-sized images used in worship and for magic; probably a corrupt worship of the true God'
    key: bd-teraphim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/teraphim?lang=eng'
    quote: 'To use teraphim was probably not to worship strange gods but to worship the true God in a corrupt manner.'
  - where: 'note 10:2 “Teraphim, diviners, and a flock with no shepherd”'
    claim: 'Teraphim were man-sized images used in worship and for magic'
    key: bd-teraphim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/teraphim?lang=eng'
    quote: 'Images of the size and form of a man (1 Sam. 19:13, 16) used from patriarchal times (Gen. 31:30, 32) and onwards (Judg. 17:5; Hosea 3:4–5; Zech. 10:2) in worship and for magical purposes'
  - where: 'note 10:2 “Teraphim, diviners, and a flock with no shepherd”'
    claim: 'Teraphim were worshipped as givers of earthly prosperity'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'were house-deities and oracular deities, which were worshipped as the givers and protectors of the blessings of earthly prosperity'
  - where: 'note 10:2 “Teraphim, diviners, and a flock with no shepherd”'
    claim: '“Went their way” is the verb for pulling up tent pegs: wandering into exile'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'to break up, applied to the pulling up of the pegs, to take down the tent, involves the idea of wandering, and in this connection, of wandering into exile.'
  - where: 'note 10:2 “Teraphim, diviners, and a flock with no shepherd”'
    claim: 'Because Israel trusted teraphim and soothsayers it went into exile'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'because Israel had trusted in teraphim and soothsayers, it would have to wander into exile.'
  - where: 'note 10:2 “Teraphim, diviners, and a flock with no shepherd”'
    claim: 'No shepherd means no king; the Davidic monarchy was lost'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'Israel is bowed down because it has no shepherd, i.e., no king, who guards and provides for his people (cf. Numbers 27:17; Jeremiah 23:4), having lost the Davidic monarchy when the kingdom was overthrown.'

  - where: 'note 10:3 “Shepherds, he-goats, and a war horse”'
    claim: 'The Bible Dictionary reads 10:3–12 as good shepherds displacing evil ones'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Good shepherds displace the evil ones'
  - where: 'note 10:3 “Shepherds, he-goats, and a war horse”'
    claim: 'The shepherds were leaders who should have led in righteousness'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The leaders who should have led the people in righteousness had kindled the Lord’s anger.'
  - where: 'note 10:3 “Shepherds, he-goats, and a war horse”'
    claim: 'The “goats” are he-goats that lead the flock, a figure for princes (Ezek. 34:17)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6260.htm'
    quote: 'as leaders of flock Jeremiah 50:8 (simile), hence figurative of princes and chief men Isaiah 14:9; Ezekiel 34:17'
  - where: 'note 10:3 “Shepherds, he-goats, and a war horse”'
    claim: '“I punished” is a form of pāqad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'אֶפְק֑וֹד'
  - where: 'note 10:3 “Shepherds, he-goats, and a war horse”'
    claim: '“Hath visited” is also pāqad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'פָקַד֩'
  - where: 'note 10:3 “Shepherds, he-goats, and a war horse”'
    claim: 'With sheep as its object pāqad means to attend to them (Jer. 23:2; Zech. 10:3)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6485.htm'
    quote: 'attend to, in act, see to, with accusative of person 2 Kings 9:34; accusative of sheep Jeremiah 23:2 (in figurative); compare Zechariah 10:3'
  - where: 'note 10:3 “Shepherds, he-goats, and a war horse”'
    claim: '“Goodly horse” is “the horse of his majesty”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1935.htm'
    quote: 'he will make them like the horse of his majesty in battle'

  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: 'The footnote reads “the corner” as the cornerstone and points to Ps. 118:22 and Matt. 21:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'IE the cornerstone. Ps. 118:22 (21–22); Matt. 21:42 (42–46).'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: '“Out of him” refers to Judah'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'In this clause, therefore, mimmennū must refer to Judah, and consequently it must be taken in the same way in the first three clauses.'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: 'The first three clauses have no verb; a verb “will be” is supplied'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'We have therefore to supply'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: 'Keil’s rendering of the verse, future'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'From Him will be corner-stone, from Him the nail, from Him the war-bow; from Him will every ruler go forth at once.'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: 'The cornerstone is the stone on which the building stands'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'here corner-stone, as in Isaiah 28:16, upon which the whole building stands firmly'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: 'The peg is a figure for the upholders of the state, as of a person in Isa. 22:23'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'The plug, therefore, is a suitable figure for the supports or upholders of the whole political constitution, and even in Isaiah 22:23 was transferred to persons.'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: 'The bow stands for military power'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'The war-bow stands synecdochically for weapons of war and the military power.'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: '“Oppressor” is a taskmaster, used here of a ruler in a good sense; in 9:8 of a foreign oppressor'
    key: bdb
    url: 'https://biblehub.com/hebrew/5065.htm'
    quote: 'of (arbitrary) ruler Isaiah 3:12, ruler (good sense) Zechariah 10:4; = foreign oppressor, tyrant Isaiah 9:3 (with בְּ) Isaiah 14:2,4; Zechariah 9:8'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: 'Another reading holds that nōgēś is not used of a ruler in a good sense here'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'is not applied to a leader or ruler in a good sense even here'
  - where: 'note 10:4 “From Judah, the cornerstone”'
    claim: 'A Messianic reading of all four images (Guthrie and Motyer, as the manual prints them)'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'but each one of the four is undoubtedly Messianic. The ultimate reference is to the Lion of the tribe of Judah, by whose aid His people will conquer every foe.'

  - where: 'note 10:6 “Joseph brought home with Judah”'
    claim: 'The house of Joseph stands for the northern kingdom of Ephraim'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Both the house of Judah (representing the kingdom in the south) and the kingdom of Joseph (representing the kingdom of Ephraim in the north) would return to their lands of inheritances.'
  - where: 'note 10:6 “Joseph brought home with Judah”'
    claim: 'Old divisions healed; the two sticks of Ezekiel 37'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'In other words, old divisions would be healed and all would return home.'
  - where: 'note 10:6 “Joseph brought home with Judah”'
    claim: 'Ezekiel’s two sticks have the same promise of the unity of Judah and Joseph'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The book of Ezekiel has a similar covenantal fulfilment: the unity of both the house of Judah and that of Joseph.'
  - where: 'note 10:6 “Joseph brought home with Judah”'
    claim: 'The ten tribes were carried into Assyria and lost to record, not to the Lord'
    key: nelson-gathering
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/the-gathering-of-scattered-israel?lang=eng'
    quote: 'Ten tribes were carried captive into Assyria. From there they became lost to the records of mankind. (Obviously, the ten tribes are not lost to the Lord.)'

  - where: 'note 10:7 “Ephraim in the last days”'
    claim: 'Ephraim held the birthright and in the last days bears the Restoration’s message and gathers Israel'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'in the last days it has been the tribe of Ephraim’s privilege first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel'
  - where: 'note 10:7 “Ephraim in the last days”'
    claim: 'Ephraim was given the birthright'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'Ephraim was given the birthright in Israel (1 Chr. 5:1–2; Jer. 31:9)'
  - where: 'note 10:7 “Ephraim in the last days”'
    claim: 'Joseph’s lineage through Ephraim and Manasseh is appointed to lead the gathering'
    key: nelson-exodus-repeated
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/07/the-exodus-repeated?lang=eng'
    quote: 'The lineage of Joseph, through Ephraim and Manasseh, is the seed appointed to lead in the gathering of Israel.'
  - where: 'note 10:7 “Ephraim in the last days”'
    claim: 'The footnote to “Ephraim” points to D&C 133:32'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'Gen. 48:14 (14–22); D&C 64:36 (33–36); 109:60 (60–61); 133:32 (16–35).'

  - where: 'note 10:8 “The Lord whistles for His flock”'
    claim: '“Hiss” is to whistle'
    key: bdb
    url: 'https://biblehub.com/hebrew/8319.htm'
    quote: 'verb hiss, perhaps also whistle, pipe'
  - where: 'note 10:8 “The Lord whistles for His flock”'
    claim: 'With the Lord as subject the word is a signal (Isa. 5:26; 7:18); elsewhere it is derision (Jer. 19:8)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8319.htm'
    quote: 'hiss, as signal,'
  - where: 'note 10:8 “The Lord whistles for His flock”'
    claim: 'The other use is hissing in derision'
    key: bdb
    url: 'https://biblehub.com/hebrew/8319.htm'
    quote: 'Jeremiah 19:8; Jeremiah 49:17; Jeremiah 50:13; Lamentations 2:15'

  - where: 'note 10:9 “Sown among the nations”'
    claim: 'Hosea uses the verb of the Lord sowing Israel in the land; Zechariah of sowing them among the peoples'
    key: bdb
    url: 'https://biblehub.com/hebrew/2232.htm'
    quote: 'of Yahweh''s sowing (planting) Israel in the land'
  - where: 'note 10:9 “Sown among the nations”'
    claim: 'The footnotes point to the Ten Lost Tribes and to Deuteronomy 30:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'Deut. 30:2 (1–3).'
  - where: 'note 10:9 “Sown among the nations”'
    claim: 'The chapter heading reads the verse as a scattering in far countries'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'Judah and Joseph will be scattered among the people in far countries'

  - where: 'note 10:11 “A second exodus”'
    claim: 'Egypt is a type of the land of bondage; Assyria the land of the ten tribes’ exile'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'is rather introduced in all the passages mentioned simply as a type of the land of bondage'
  - where: 'note 10:11 “A second exodus”'
    claim: 'Assyria as the land of the ten tribes’ exile'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'And Asshur is introduced in the same way, as the land into which the ten tribes had been afterwards exiled.'
  - where: 'note 10:11 “A second exodus”'
    claim: 'Verse 11 pictures the redemption as the exodus under Moses'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'the redemption of Israel out of the countries named is there exhibited under the type of the liberation of Israel out of the bondage of Egypt under the guidance of Moses'
  - where: 'note 10:11 “A second exodus”'
    claim: 'Gilead and Lebanon: the ten tribes’ old territory east and west of the Jordan'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'the former representing the territory of the ten tribes in the olden time to the east of the Jordan, the latter that to the west'
  - where: 'note 10:11 “A second exodus”'
    claim: 'The footnote to “sceptre” points to Isaiah 11:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'Isa. 11:15; Ezek. 30:13.'
  - where: 'note 10:11 “A second exodus”'
    claim: 'A group of Judeans had fled to Egypt after the Babylonian destruction'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'there was a group who had fled to Egypt in the wake of Babylonian destruction'

  - where: 'note 10:12 “Strengthened in the Lord”'
    claim: 'The Church pairs 10:5–9, 12 with D&C 45:66–71'
    key: ot-institute-manual-48
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/48-haggai-zechariah?lang=eng'
    quote: 'Zechariah 10:5–9, 12; Doctrine and Covenants 45:66–71. What will the Savior do for His covenant people before His Second Coming?'

  - where: 'setting'
    claim: 'The Church reads 10:5–9, 12 beside D&C 45:66–71, the gathering before the Second Coming'
    key: ot-institute-manual-48
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/48-haggai-zechariah?lang=eng'
    quote: 'Zechariah 10:5–9, 12; Doctrine and Covenants 45:66–71. What will the Savior do for His covenant people before His Second Coming?'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jesus Christ is the true shepherd of the chapter'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Jesus Christ is the true shepherd of our souls (see John 10:7–15).'
  - where: 'christ'
    claim: 'The truth the institute manual draws from 10:5–9, 12 read with D&C 45:66–71: Christ will gather, save and protect His people'
    key: ot-institute-manual-48
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/48-haggai-zechariah?lang=eng'
    quote: 'Jesus Christ will return in the last days and gather, save, and protect His people.'
  - where: 'christ'
    claim: 'Coming to Christ is not a matter of physical location'
    key: nelson-gathering
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/the-gathering-of-scattered-israel?lang=eng'
    quote: 'The choice to come unto Christ is not a matter of physical location; it is a matter of individual commitment.'
