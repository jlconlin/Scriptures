chapter: 7
claims:
  # ---- when, setting, thread ----
  - where: 'when'
    claim: 'Zechariah prophesied from the second to the fourth year of Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.)'
  - where: 'setting'
    claim: 'The date of 7:1 falls on December 7, 518 B.C.'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'This section took place on December 7, 518 BC'
  - where: 'setting'
    claim: 'The fourth year of Darius was two years after the building resumed and two before it was finished; the building was far advanced'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'two years after the building of the temple was resumed, and two years before its completion, and therefore at a time when the building must have been far advanced'
  - where: 'setting'
    claim: 'Chapters 7–8 are one reply to a question about fasting'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 7–8 reply to a question about fasting'
  - where: 'setting'
    claim: 'The answer has two parts, 7:4–14 and chapter 8, each in two sections opened by the formula “the word of the LORD came”'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'The answer from the Lord divides itself into two parts, Zechariah 7:4-14 and ch. 8. In the first part He explains what it is that He requires of the people, and why He has been obliged to punish them with exile'
  - where: 'setting'
    claim: 'Each of the four sections opens with the formula'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'Each of these parts is divisible again into two sections, Zechariah 7:4-7 and Zechariah 7:8-14; Zechariah 8:1-17 and Zechariah 8:18-23; and each of these sections opens with the formula'
  - where: 'setting'
    claim: 'The prophets recognized the danger that fasting would become a formality, in Isaiah 58 as in Zechariah 7'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'All such observances were, of course, liable to become mere formalities, and the danger of this was recognized by the prophets (Isa. 58:3–7; Joel 2:12–13; Zech. 7:5–6'
  - where: 'thread'
    claim: 'The chapter heading: the Lord reproves hypocrisy in fasts and calls for mercy and compassion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/7?lang=eng'
    quote: 'The Lord reproves hypocrisy in fasts—He calls upon the people to show'
  - where: 'thread'
    claim: 'The fathers’ obstinacy brought on the land the calamity now mourned on the fast days'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'they have brought upon the land all the calamity which is now bewailed upon the fast-days'
  - where: 'thread'
    claim: 'Bethel’s question concerned only the fifth-month fast, kept for the destruction of the temple'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'The question put by the delegates referred simply to the fasting in the fifth month, in commemoration of the destruction of the temple.'
  - where: 'section 1 plain'
    claim: 'Verse 2 read as “the people of Bethel had sent”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Zechariah+7&version=NRSVUE'
    quote: 'Now the people of Bethel had sent Sharezer and Regem-melech and their men to entreat the favor of the Lord'
  - where: 'section 3 plain'
    claim: 'Verses 9–10 are what the Lord said through the prophets before the captivity'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'is to be taken as a preterite here, referring to what Jehovah had caused to be proclaimed to the people before the captivity'

  # ---- note 7:2 ----
  - where: 'note 7:2 “Bethel sends to ask”'
    claim: 'Modern translations read the subject as the people of Bethel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Zechariah+7&version=NRSVUE'
    quote: 'Now the people of Bethel had sent Sharezer and Regem-melech and their men to entreat the favor of the Lord'
  - where: 'note 7:2 “Bethel sends to ask”'
    claim: 'The words rendered “the house of God” are the place name Bethel, which means house of God'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/1008.htm'
    quote: 'house of God; Beth-El, a place in Palestine'
  - where: 'note 7:2 “Bethel sends to ask”'
    claim: 'Bethel means “house of God” and lay at the northern edge of the province of Yehud'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'in Bethel (“house of God”) in the upper northern extremity of the Persian province named Yehud'
  - where: 'note 7:2 “Bethel sends to ask”'
    claim: 'The verb of “pray before” means to entreat the favour of, literally make the face sweet'
    key: bdb
    url: 'https://biblehub.com/hebrew/2470.htm'
    quote: 'mollify, appease, entreat the favour of, literally make the face of any one sweet or pleasant'

  # ---- note 7:3 ----
  - where: 'note 7:3 “The fast of the fifth month”'
    claim: 'The fast was probably instituted in remembrance of the temple’s destruction; “separating myself” means from food'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'It is possible that the people had instituted a fast in remembrance of the destruction of the temple (“separating myself [from food]”)'
  - where: 'note 7:3 “The fast of the fifth month”'
    claim: 'They may have been asking whether the fast should continue now the temple was being rebuilt'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Sherezer and Regem-melech may have been asking the priests of Jerusalem if the fast was to continue with the temple being reconstructed'
  - where: 'note 7:3 “The fast of the fifth month”'
    claim: 'Modern translation renders “separating myself” as “practice abstinence”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Zechariah+7&version=NRSVUE'
    quote: 'Should I mourn and practice abstinence in the fifth month, as I have done for so many years?'
  - where: 'note 7:3 “The fast of the fifth month”'
    claim: 'The text of verse 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/7?lang=eng'
    quote: 'Should I weep in the fifth month, separating myself, as I have done these so many years?'

  # ---- note 7:5 two fasts ----
  - where: 'note 7:5 “Two fasts and seventy years”'
    claim: 'By Jewish tradition the seventh-month fast was kept for the murder of the governor Gedaliah'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'In the seventh month, according to Jewish tradition, they fasted on the third day, on account of the murder of the governor Gedaliah'
  - where: 'note 7:5 “Two fasts and seventy years”'
    claim: 'The seventh-month fast was not the Day of Atonement but the fast for Gedaliah'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'The fasting in the seventh month was not the fast on the day of atonement which was prescribed in the law (Leviticus 23), but, as has been already observed, the fast in commemoration of the murder of Gedaliah.'
  - where: 'note 7:5 “Two fasts and seventy years”'
    claim: 'The seventh-month observance commemorated the assassination of Gedaliah'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'A fourth feast was celebrated in the seventh month to commemorate the assassination of Gedaliah'
  - where: 'note 7:5 “Two fasts and seventy years”'
    claim: 'Gedaliah was made ruler over those left in the land, and murdered in the seventh month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'But it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal, came, and ten men with him, and smote Gedaliah, that he died'

  # ---- note 7:5 fast unto me ----
  - where: 'note 7:5 “Fasting to whom?”'
    claim: 'The Bible Dictionary: the Lord is indifferent whether men fast or eat; He desires judgment and mercy'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'the Lord is indifferent whether men fast or eat; He desires that they execute judgment and show mercy (7:8–10)'
  - where: 'note 7:5 “Fasting to whom?”'
    claim: 'Fasting was a natural way of showing sorrow, and could become a formality'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'It was regarded as a natural way of showing sorrow.'
  - where: 'note 7:5 “Fasting to whom?”'
    claim: 'The danger of formality was recognized by the prophets'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'All such observances were, of course, liable to become mere formalities'
  - where: 'note 7:7 “The former prophets”'
    claim: 'The temple was destroyed because they had not listened'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The temple had been destroyed because they had not listened to the word of the Lord.'
  - where: 'note 7:7 “The former prophets”'
    claim: '“The south” is the Negeb, the region south of Judah'
    key: bdb
    url: 'https://biblehub.com/hebrew/5045.htm'
    quote: 'specifically the region south of Judah, boundaries not exactly defined'
  - where: 'note 7:7 “The former prophets”'
    claim: '“The plain” is the Shephelah, the strip west of the Judaean mountains'
    key: bdb
    url: 'https://biblehub.com/hebrew/8219.htm'
    quote: 'usually technical term of strip west of Judaean mountains'

  # ---- note 7:9 ----
  - where: 'note 7:9 “What the former prophets had said”'
    claim: '“Thus speaketh” is to be read as past: what the Lord proclaimed before the captivity'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'is to be taken as a preterite here, referring to what Jehovah had caused to be proclaimed to the people before the captivity'
  - where: 'note 7:9 “What the former prophets had said”'
    claim: 'The kernel was the moral precepts of the law, love of neighbour in public and private'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'The kernel of this announcement consisted in the appeal to the people, to keep the moral precepts of the law, to practise the true love of the neighbour in public life and private intercourse.'
  - where: 'note 7:9 “What the former prophets had said”'
    claim: '“True judgment” is justice decided by the facts without personal considerations'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'such an administration of justice as simply fixes the eye upon the real circumstances of any dispute, without any personal considerations whatever, and decides them in accordance with truth'
  - where: 'note 7:9 “What the former prophets had said”'
    claim: 'Parallels in the law and the prophets: Isaiah 1:17; Jeremiah 7:5–6; 22:3'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'Deuteronomy 10:18-19; Deuteronomy 24:14; Isaiah 1:17; Jeremiah 7:5-6; Jeremiah 22:3'
  - where: 'note 7:9 “What the former prophets had said”'
    claim: 'Jeremiah 22:3, quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng'
    quote: 'Execute ye judgment and righteousness'
  - where: 'note 7:9 “What the former prophets had said”'
    claim: 'A modern translation renders verse 9 in the present tense'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Zechariah+7&version=NRSVUE'
    quote: 'Thus says the Lord of hosts: Render true judgments'

  - where: 'note 7:9 “What the former prophets had said”'
    claim: '“True judgment” is literally “judgment of truth”'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'judgment of truth (cf. Ezekiel 18:8)'

  # ---- note 7:12 ----
  - where: 'note 7:12 “Shoulder, ears, and heart”'
    claim: 'A stubborn shoulder, like an animal refusing the yoke; the prophetic instruction was mediated by the Spirit'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'This prophetic law (v. 12), i.e., instruction, though it had been mediated by the divine Spirit, they had willfully rejected, turning a stubborn shoulder (v. 11) like an animal that refuses to bear the yoke'
  - where: 'note 7:12 “Shoulder, ears, and heart”'
    claim: '“Adamant” (shamir) is a figure of hardness: the prophet’s firmness in Ezekiel, a hard heart here'
    key: bdb
    url: 'https://biblehub.com/hebrew/8068.htm'
    quote: 'adamant, as sharp, כְּתוּבָה ֗֗֗ בְּצִמֹּרֶן ׳שׁ Jeremiah 17:1 ("" בְּעֵט בַּדְוֶל); as hard, figurative of prophet''s firmness Ezekiel 3:9; Zechariah 7:12 figurative of hard heart.'
  - where: 'note 7:12 “Shoulder, ears, and heart”'
    claim: 'Ezekiel 3:9 quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'As an adamant harder than flint have I made thy forehead'

  # ---- note 7:14 ----
  - where: 'note 7:14 “The ruin they had been mourning”'
    claim: 'Verse 13 is a divine talio: as they did not hear, God will not hear them in distress'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'The infliction of the punishment is expressed in Zechariah 7:13 in the form of a divine talio. As they have not hearkened to the word of God, so will God, when they call upon Him, namely in distress (cf. Hosea 5:15), also not hear (cf. Jeremiah 11:11)'
  - where: 'note 7:14 “The ruin they had been mourning”'
    claim: '“The pleasant land” is the phrase of Jeremiah 3:19 and Psalm 106:24'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'They have made the choice land a desert'
  - where: 'note 7:14 “The ruin they had been mourning”'
    claim: 'Same phrase as Jeremiah 3:19 and Psalm 106:24'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'as in Jeremiah 3:19 and Psalm 106:24'
  - where: 'note 7:14 “The ruin they had been mourning”'
    claim: 'The fathers brought on the land the calamity now mourned on the fast days'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'the result of the stiff-necked obstinacy of the fathers is briefly stated'
  - where: 'note 7:14 “The ruin they had been mourning”'
    claim: 'Chapter 8 promises the restoration of favour'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'in the second He promises them the restoration of His favour and the promised salvation'
  - where: 'note 7:14 “The ruin they had been mourning”'
    claim: 'The text of verse 14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/7?lang=eng'
    quote: 'for they laid the pleasant land desolate'

  # ---- christ ----
  - where: 'christ'
    claim: 'The footnote to “fast” in 7:5 points to Matthew 6:16 and 3 Nephi 13:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/7?lang=eng'
    quote: 'Matt. 6:16; 3 Ne. 13:16 (16–18).'
  - where: 'christ'
    claim: 'The institute manual lists treating others with mercy and compassion (7:9–10) as a way to turn to the Lord'
    key: ot-institute-manual-48
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/48-haggai-zechariah?lang=eng'
    quote: 'Treating others with mercy and compassion (see Zechariah 7:9–10).'
