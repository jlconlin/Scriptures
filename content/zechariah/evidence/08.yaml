chapter: 8
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Zechariah prophesied under Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'a contemporary of Haggai (Ezra 5:1; 6:14); prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.).'
  - where: 'when'
    claim: 'Zechariah prophesied to the Jews in Judah and Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/5?lang=eng'
    quote: 'Haggai the prophet, and Zechariah the son of Iddo, prophesied unto the Jews that were in Judah and Jerusalem'
  - where: 'when'
    claim: 'Darius was king of Persia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/4?lang=eng'
    quote: 'So it ceased unto the second year of the reign of Darius king of Persia.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Chapters 7–8 are the reply to the question about fasting; the fasts will be turned into festivals of joy'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: '(k) Zech. 7–8 reply to a question about fasting: the Lord is indifferent whether men fast or eat; He desires that they execute judgment and show mercy (7:8–10). The fasts shall be turned into festivals of joy (8:19).'
  - where: 'setting'
    claim: 'The fasts appear to have begun during the exile, not by the law of Moses'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law. Other fasts were instituted during the exile (Zech. 7:3–5; 8:19)'
  - where: 'setting'
    claim: 'The footnote to “prophets” in verse 9 points to Ezra 5:1, where Haggai and Zechariah prophesy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'Ezra 5:1.'
  - where: 'setting'
    claim: 'The words of the prophets in verse 9 are Zechariah''s promises and Haggai''s in his chapter 2'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'The words of the prophets are the promises which Zechariah announced in Zechariah 8:2-8, and his contemporary Haggai in ch. 2.'
  - where: 'setting'
    claim: 'Verse 10 describes the fruitless labour Haggai described'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'because the labour of man and beast, i.e., agricultural pursuits, yielded no result, or at any rate a most meagre result, by no means corresponding to the labour (cf. Haggai 1:9, Haggai 1:9-11; Haggai 2:16, Haggai 2:19)'
  - where: 'setting'
    claim: 'Zechariah''s prophecies give hope in three time periods; Jerusalem a city of truth where children play and the old grow old'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'the prophecies of Zechariah give hope to the faithful in at least three time periods: to his contemporaries struggling to rebuild the temple in 520 BC, to the faithful in the meridian of time who were waiting for the Messiah to come, and to the Saints in the last days'
  - where: 'setting'
    claim: 'The Church''s chapter heading reads the chapter of the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'In the last days, Jerusalem will be restored, Judah will be gathered, and the Lord will bless His people beyond anything in the past.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The city of truth of verse 3 carries the responsibility of verses 16–17'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'In verse 3 the Lord said that Jerusalem would be a city of truth. With such a title comes responsibility. The people would have to make it a city full of truth and not just rely on its name to show this.'
  - where: 'thread'
    claim: 'Verses 19–23 are the direct answer to the question about the fasts; the joy comes when the condition of verses 16–17 is kept'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'The last word of God gives, in connection with what precedes, the direct answer to the inquiry concerning the fast-days … though only when the condition mentioned in Zechariah 8:16 and Zechariah 8:17 has been fulfilled.'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: '“I repented not” (verse 14) means I did not relent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'HEB relented.'
  - where: 'section 2 plain'
    claim: '“Let your hands be strong” means take courage'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'Having the hands strong, is the same as taking good courage for any enterprise'

  # ---- notes ----
  - where: 'note 8:3 “A city of truth”'
    claim: 'The name city of truth brings responsibility; the people must make it so; speaking truth is personal, true judgment institutional obedience'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The people would have to make it a city full of truth and not just rely on its name to show this. Therefore, the Lord commanded the people to speak truth (personal obedience) and execute true judgment among the people (institutional obedience).'

  - where: 'note 8:3 “A city of truth”'
    claim: 'The title city of truth brings responsibility'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'In verse 3 the Lord said that Jerusalem would be a city of truth. With such a title comes responsibility.'

  - where: 'note 8:4 “Old men and children in the streets”'
    claim: 'Looking at Jerusalem in the period of scattering, Zechariah spoke of a broken city without the very old and very young'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Zechariah spoke of a broken city, denuded of both the very old and very young.'
  - where: 'note 8:4 “Old men and children in the streets”'
    claim: 'The old would live longer because the city would be safe; children fed and healthy'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The older population would live longer because the city would be safe. The children would be happy because they would have food, and sickness would not overcome them.'
  - where: 'note 8:4 “Old men and children in the streets”'
    claim: 'Peace was never achieved historically; the fulfilment is for the spiritual Zion'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Historically, peace was never achieved. Jerusalem would suffer more attacks and subjugation by the Greeks and the Romans. Therefore, the fulfillment of this promise is for the spiritual Zion.'
  - where: 'note 8:4 “Old men and children in the streets”'
    claim: 'Jerusalem will one day be a city of peace where children play safely and grow old without war'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'He also prophesied that Jerusalem will one day be a city of peace from which the Lord will govern. In that day, Jerusalem will be called a city of truth where children will play safely in the streets and grow to old age without war and turmoil.'

  - where: 'note 8:6 “Too hard for the Lord?”'
    claim: 'The verb in verse 6 is yippālēʾ, from pālāʾ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'יִפָּלֵ֗א'
  - where: 'note 8:6 “Too hard for the Lord?”'
    claim: 'BDB: be beyond one''s power, difficult to do; Zech 8:6 listed with Gen 18:14 and Jer 32:17, 27'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: 'be beyond one''s power, difficult to do'
  - where: 'note 8:6 “Too hard for the Lord?”'
    claim: 'BDB lists Zech 8:6 in the same sense as Gen 18:14 and Jer 32:17, 27'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: 'Zechariah 8:6 (twice in verse); with מן person too difficult for Deuteronomy 30:11, for ׳י Genesis 18:14 (J) Jeremiah 32:17,27.'
  - where: 'note 8:6 “Too hard for the Lord?”'
    claim: 'The second clause is a question expecting no; the verse assures the certainty of the promise'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'The second clause of this verse is to be taken as a question with a negative answer'
  - where: 'note 8:6 “Too hard for the Lord?”'
    claim: 'The verse assures the greatness and certainty of the salvation'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'This contains an assurance not only of the greatness of the salvation set before them, but also of the certainty of its realization.'

  - where: 'note 8:7 “Saved by being gathered”'
    claim: 'The Joseph Smith Translation reads gather for save at 8:7'
    key: jst-zech-8
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'JST Zech. 8:7 … gather'
  - where: 'note 8:7 “Saved by being gathered”'
    claim: 'The Joseph Smith Translation reads gather for save at 8:13'
    key: jst-zech-8
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'JST Zech. 8:13 … gather'

  - where: 'note 8:8 “My people, and I will be their God”'
    claim: 'The footnote to verse 8 points to D&C 42:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'D&C 42:9.'
  - where: 'note 8:8 “My people, and I will be their God”'
    claim: 'The covenant relation of Sinai is to be restored in truth and righteousness'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'Israel was the nation of Jehovah, and Jehovah was also Israel''s God from the time of the establishment of the old covenant at Sinai (Exodus 24). This relation is to be restored in the future, "in truth and righteousness."'
  - where: 'note 8:8 “My people, and I will be their God”'
    claim: 'The return under Zerubbabel began the deliverance; the gathering from all countries is still future'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'The deliverance of the people of God out of the heathen lands did indeed commence with the return of a body of exiles from Babylon under the guidance of Zerubbabel, but their deliverance out of all the countries of the earth is still in the future.'

  - where: 'note 8:13 “From a curse to a blessing”'
    claim: 'To be a curse among the nations is to be the object of curses; to become a blessing is to be used as a formula of blessing'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'equivalent to being the object of a curse, i.e., so smitten by God as to serve as the object of curses. In harmony with this, the phrase to "become a blessing" is equivalent to being so blessed as to be used as a benedictory formula'
  - where: 'note 8:13 “From a curse to a blessing”'
    claim: 'The promise is to Judah and Israel, all twelve tribes, in unity'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'This promise is made to the remnant of Judah and Israel, and therefore of all the twelve tribes, who are to become partakers of the future salvation in undivided unity'
  - where: 'note 8:13 “From a curse to a blessing”'
    claim: 'The footnote to “blessing” points to Genesis 18:18–19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'Gen. 18:18 (18–19). TG Israel, Blessings of.'
  - where: 'note 8:13 “From a curse to a blessing”'
    claim: 'The Joseph Smith Translation reads gather for save at 8:13'
    key: jst-zech-8
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'JST Zech. 8:13 … gather'

  - where: 'note 8:19 “Four fasts of mourning”'
    claim: 'The Day of Atonement was the only fast the law ordered; the others began in the exile'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law. Other fasts were instituted during the exile (Zech. 7:3–5; 8:19)'
  - where: 'note 8:19 “Four fasts of mourning”'
    claim: 'The tenth month: the siege began'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'One feast was celebrated in the tenth month, the month in which the Babylonians laid siege to Jerusalem (see Jeremiah 39:1).'
  - where: 'note 8:19 “Four fasts of mourning”'
    claim: 'The fourth month: the city fell'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'A second feast, celebrated in the fourth month, commemorated the destruction of Jerusalem (see Jeremiah 39:2; 52:67).'
  - where: 'note 8:19 “Four fasts of mourning”'
    claim: 'The fifth month: the temple destroyed'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'A third feast, held in the fifth month, marked the destruction of the temple (see Jeremiah 52:12–14).'
  - where: 'note 8:19 “Four fasts of mourning”'
    claim: 'The seventh month: Gedaliah murdered'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'A fourth feast was celebrated in the seventh month to commemorate the assassination of Gedaliah'
  - where: 'note 8:19 “Four fasts of mourning”'
    claim: 'The fasts of mourning would become celebrations of joy and gladness'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The fasts of mourning that had dotted the Jewish calendar would now be celebrations of “joy and gladness” (Zechariah 8:19).'
  - where: 'note 8:22 “The nations go up to seek the Lord”'
    claim: 'The footnote to verse 22 points to Zechariah 2:11 and 2 Nephi 12:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'Zech. 2:11; 2 Ne. 12:3.'
  - where: 'note 8:22 “The nations go up to seek the Lord”'
    claim: 'Correa, on Zech 8:20–23: Isaiah 2:2 fulfilled today in temples and general conference attendance'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Isaiah had said that “all nations shall flow unto” the mountain of the Lord’s house (Isaiah 2:2). Today we see the fulfillment of this prophecy in the temples and general conference attendance.'

  - where: 'note 8:23 “Holding the hem of a Jew”'
    claim: 'The Hebrew word is kānāp (bikᵉnap, “by the skirt of”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'בִּ/כְנַף֩'
  - where: 'note 8:23 “Holding the hem of a Jew”'
    claim: 'kānāp is wing, extremity; of a garment, skirt, corner, loose end; Zech 8:23 and Num 15:38 listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/3671.htm'
    quote: 'a. of garment = skirt, corner, or loose flowing end, 1 Samuel 15:27; 1 Samuel 24:5'
  - where: 'note 8:23 “Holding the hem of a Jew”'
    claim: 'BDB lists Zech 8:23 and Numbers 15:38 in the garment sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/3671.htm'
    quote: 'Haggai 2:12 (twice in verse); Zechariah 8:23; Numbers 15:38 (twice in verse)'
  - where: 'note 8:23 “Holding the hem of a Jew”'
    claim: 'The Panammu inscription from Zinjirli uses taking hold of the lord''s skirt for attaching oneself to his party, compared with Zech 8:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/3671.htm'
    quote: 'Zinjirli אחז בכנף מראה, figurative for attached himself to the party of his lord, PanammuInscr. l. 11, compare Zechariah 8:23'
  - where: 'note 8:23 “Holding the hem of a Jew”'
    claim: 'The second “you” is plural in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'HEB you (plural).'
  - where: 'note 8:23 “Holding the hem of a Jew”'
    claim: '“Jew” may mean Israelites in general'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'It is possible that the word Jew is used here to refer to Israelites in general and not just a descendant of the tribe of Judah (see Romans 2:28–29; 9:6; 2 Nephi 30:2).'

  # ---- christ ----
  - where: 'christ'
    claim: 'The gathering of verses 7–8 is first effected through the Messiah'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'This deliverance is first effected through the Messiah.'
  - where: 'christ'
    claim: 'The fulfilment of the glory promised in 8:18–23 commenced with the appearance of Christ'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/8.htm'
    quote: 'so that it has not discerned the fulfilment, which commenced with the appearance of Christ upon earth.'
  - where: 'christ'
    claim: 'Faithful people, not buildings, make a place holy; the heart is the indicator'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Faithful people, not buildings, make a place holy (see Zechariah 8:23).'
  - where: 'christ'
    claim: 'The heart is the only accurate indicator of spiritual condition'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'While beautiful buildings are important to our worship, the only accurate indicator of our spiritual condition is the nature of our hearts.'
  - where: 'christ'
    claim: 'Today people take hold of a Latter-day Saint, saying God is with you'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'In other words, people will take hold of a missionary or a Latter-day Saint, saying “we have heard that God is with you” (verse 23).'
