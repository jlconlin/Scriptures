chapter: 3
claims:
  - where: when
    claim: 'Zechariah prophesied under Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.)'

  - where: setting
    claim: 'Chapter 3 is the fourth vision, Joshua in filthy garments before the angel of the Lord'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 3, fourth vision, Joshua, the high priest, in filthy garments, standing before the angel of the Lord'
  - where: setting
    claim: 'Joshua was the high priest beside Zerubbabel, descended from Josedech, the last high priest before the captivity'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Joshua was the high priest who served alongside Zerubbabel. He was a descendant of Josedech (sometimes spelled Jehozadak), the last high priest before the Babylonian captivity.'
  - where: setting
    claim: 'The rebuilding of the temple had resumed five months before the visions'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'since the building of the temple had been resumed five months before (Haggai 1:15, compared with Zechariah 1:7)'
  - where: setting
    claim: 'The exiles had to redefine their faith; only a holy people could make Jerusalem holy again'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The returning exiles needed to redefine their faith. Part of Zechariah’s message was that only a holy people could make Jerusalem holy again.'
  - where: setting
    claim: 'The vision may reflect the people’s sense of sin and fear that the Lord had not returned'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'The beautiful vision might be a reflection of the feeling of the people, their abject condition awakening a sense of their sin, and the fear that the Lord had not returned to them in truth.'
  - where: setting
    claim: 'Zechariah later prophesies the Branch as a priest on a throne (6:12–13)'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah later prophesied that the Branch, representing the Messiah, would “sit and rule upon his throne” and would “be a priest upon his throne.”'

  - where: thread
    claim: 'The people are assured of forgiveness through the ministries among them, which are types of a more perfect one'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'They are comforted with the assurance that His favor and forgiveness are with them, dispensed through the ministries among them; these ministries are but types of a more perfect one'

  - where: section 1 plain
    claim: 'The “mitre” is a turban'
    key: bdb
    url: 'https://biblehub.com/hebrew/6797.htm'
    quote: 'Zechariah 3:5 (twice in verse) (for high priest)'
  - where: section 2 plain
    claim: 'Verses 6–10 are a prophetic address following the vision of verses 1–5'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'In these verses there follows a prophetic address, in which the angel of the Lord describes the symbolical action of the re-clothing of the high priest'
  - where: section 2 plain
    claim: '“Men wondered at” means men who serve as a sign'
    key: bdb
    url: 'https://biblehub.com/hebrew/4159.htm'
    quote: 'Zechariah 3:8 men who serve as a symbol or sign'

  - where: 'note 3:1 “The accuser in the Lord’s court”'
    claim: '“Satan” has the article in Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'וְ/הַ/שָּׂטָ֛ן'
  - where: 'note 3:1 “The accuser in the Lord’s court”'
    claim: '“To resist him” is the verb of the same root'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'לְ/שִׂטְנֽ/וֹ'
  - where: 'note 3:1 “The accuser in the Lord’s court”'
    claim: 'The footnote gives Satan as “the Adversary or Accuser”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: '“Satan”: HEB the Adversary or Accuser (also v. 2). Ps. 109:6.'
  - where: 'note 3:1 “The accuser in the Lord’s court”'
    claim: 'The footnote gives “resist” as “accuse”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: '“resist”: HEB accuse.'
  - where: 'note 3:1 “The accuser in the Lord’s court”'
    claim: 'The scene is a trial: the Lord judges, the angel defends, the satan prosecutes'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Joshua the high priest is on trial. The Lord is the judge, with the angel of the Lord on the defense and satan as the prosecutor.'
  - where: 'note 3:1 “The accuser in the Lord’s court”'
    claim: 'Satan here is a title with the article, not a name'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'in Hebrew, satan (s-t-n) is not a name but a title with the article the before it.'
  - where: 'note 3:1 “The accuser in the Lord’s court”'
    claim: 'Zechariah 3 is a divine council scene; the accuser is like a prosecuting attorney from the divine realm'
    key: sc-knowhy-832
    url: 'https://scripturecentral.org/knowhy/why-are-other-people-with-god-when-he-is-planning-the-creation'
    quote: 'This accuser is similar to a prosecuting attorney in modern times, but in this case, it is a being from the divine realm.'
  - where: 'note 3:1 “The accuser in the Lord’s court”'
    claim: 'The Bible Dictionary reads Satan as accuser and points to Job'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'with Satan at his right hand to accuse him (see also Job 1:6–11)'

  - where: 'note 3:2 “A brand plucked out of the fire”'
    claim: 'The footnote points to Amos 4:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: '“brand”: Amos 4:11.'
  - where: 'note 3:2 “A brand plucked out of the fire”'
    claim: 'Satan is rebuked; the Lord who chose Jerusalem has plucked the brand from the burning'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Satan is rebuked; the Lord who has chosen Jerusalem has plucked the brand from the burning.'
  - where: 'note 3:2 “A brand plucked out of the fire”'
    claim: 'Perhaps proverbial; Israel rescued from the furnace of Babylon to become a torch'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'perhaps a proverbial expression. Israel as a nation had been rescued from the furnace of Babylon … to become a torch to enlighten the nations.'
  - where: 'note 3:2 “A brand plucked out of the fire”'
    claim: 'The meaning of the fire is not clear; literal, symbolic or both'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The text is not clear as to the meaning of Joshua’s fiery experience, and it can be literal, symbolic, or both.'

  - where: 'note 3:4 “Filthy garments taken away”'
    claim: 'The filthy garment represents sin; changing it is putting on robes of righteousness'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The garment of filthiness represents sin. Changing the garment symbolizes doing away with the old and putting on the new—which would be robes of righteousness.'
  - where: 'note 3:4 “Filthy garments taken away”'
    claim: 'Joshua is accused in his office as high priest, laden with his own and his people’s sins'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'not on account of any personal offences either in his private or his domestic life, but in his official capacity as high priest'
  - where: 'note 3:4 “Filthy garments taken away”'
    claim: 'Laden with his own and his people’s sins'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'as laden with his own and his people’s sins. The dirty clothes, which he had on, point to this'
  - where: 'note 3:4 “Filthy garments taken away”'
    claim: 'Those standing before the Lord are presumably divine beings'
    key: sc-knowhy-832
    url: 'https://scripturecentral.org/knowhy/why-are-other-people-with-god-when-he-is-planning-the-creation'
    quote: 'Others, presumably divine beings, are standing in front of Yahweh'
  - where: 'note 3:4 “Filthy garments taken away”'
    claim: 'Clean priestly attire symbolizes forgiveness; robes washed in the blood of the Lamb'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'clothing him with clean priestly attire, which symbolizes the forgiveness of his sins (compare Exodus 28:36–39)'
  - where: 'note 3:4 “Filthy garments taken away”'
    claim: 'The same picture runs to the robes washed white in Revelation 7:14'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'When John the Revelator asked what the white robes meant, the angel replied'
  - where: 'note 3:4 “Filthy garments taken away”'
    claim: 'Zechariah invited the people to follow Joshua as he puts off filth and dons clean clothing'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Zechariah invited the people to submit to Jehovah’s rule and to follow Joshua, the high priest, as he sloughs off the filth of the world, walks in the ways of the Lord, dons clean clothing'

  - where: 'note 3:5 “A clean turban”'
    claim: 'The footnote gives “a clean (pure) cap”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: '“a fair mitre”: HEB a clean (pure) cap.'
  - where: 'note 3:5 “A clean turban”'
    claim: 'ṣānîp̄ is a turban, used here of the high priest, of righteousness in Job, and of a royal turban in Isaiah'
    key: bdb
    url: 'https://biblehub.com/hebrew/6797.htm'
    quote: 'Zechariah 3:5 (twice in verse) (for high priest) and (figurative of righteousness) Job 29:14; construct צְנִיף מְלוּכָה Isaiah 62:3 Qr royal turban'
  - where: 'note 3:5 “A clean turban”'
    claim: 'The prophet himself asks for the mitre'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'At this moment the prophet feels compelled to utter the prayer that they may also put a clean mitre upon Joshua''s head, which prayer is immediately granted.'
  - where: 'note 3:5 “A clean turban”'
    claim: 'The word is synonymous with the high priest’s mitre in the law'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'synonymous with mitsnepheth, the technical word for the tiara prescribed for the high priest in the law'
  - where: 'note 3:5 “A clean turban”'
    claim: 'The turban bore the golden plate marking him holy to the Lord and bearing Israel’s guilt'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'the clean turban was the substratum for the golden plate that was fastened upon it, and by which he was described as holy to the Lord, and called to bear the guilt of the children of Israel (Exodus 28:38)'
  - where: 'note 3:5 “A clean turban”'
    claim: 'The prayer shows Joshua holy and qualified to make expiation'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'should be shown to be holy, and qualified to accomplish the expiation of the people. Purity, as the earthly type of holiness, forms the foundation for glory.'

  - where: 'note 3:7 “A place among those who stand by”'
    claim: 'The footnote reads “these that stand by” as heavenly messengers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: '“these that stand by”: IE the heavenly messengers.'
  - where: 'note 3:7 “A place among those who stand by”'
    claim: 'Walking in His ways is personal fidelity; keeping His charge is faithful service in office'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'Walking in the ways of the Lord refers to the personal attitude of the priests towards the Lord, or to fidelity in their personal relation to God; and keeping the charge of Jehovah, to the faithful performance of their official duties'
  - where: 'note 3:7 “A place among those who stand by”'
    claim: 'The promise is free access to God, beyond what his office gave, pointing to a time when old restrictions end'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'the high priest would also receive a free access to God, which had not yet been conferred upon him by his office. This points to a time when the restrictions of the Old Testament will be swept away.'
  - where: 'note 3:7 “A place among those who stand by”'
    claim: 'Joshua walks among the angels of the Lord'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'is crowned with a fair mitre, and walks among the angels of the Lord'
  - where: 'note 3:7 “A place among those who stand by”'
    claim: 'Forgiveness is the springboard for discipleship, with priesthood tied to righteousness (D&C 121:36)'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Joshua and his companions could exercise authority if they followed the Lord’s path'
  - where: 'note 3:7 “A place among those who stand by”'
    claim: 'The principle is that of D&C 121:36'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The rights of the priesthood are inseparably connected with the powers of heaven'

  - where: 'note 3:8 “Men who are a sign”'
    claim: 'môp̄ēt applied to persons: men who serve as a symbol or sign'
    key: bdb
    url: 'https://biblehub.com/hebrew/4159.htm'
    quote: 'Zechariah 3:8 men who serve as a symbol or sign'
  - where: 'note 3:8 “Men who are a sign”'
    claim: 'The term is applied to persons, as in Isaiah 8:18'
    key: bdb
    url: 'https://biblehub.com/hebrew/4159.htm'
    quote: 'as such the term is applied to persons Isaiah 8:18'
  - where: 'note 3:8 “Men who are a sign”'
    claim: 'môp̄ēt is a sign or token of a future event'
    key: bdb
    url: 'https://biblehub.com/hebrew/4159.htm'
    quote: 'sign or token of future event'
  - where: 'note 3:8 “My servant the BRANCH”'
    claim: 'Zechariah made Joshua and his fellow priests a sign of the coming Branch'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah said that Joshua and his fellow priests were symbolic of the coming Branch'

  - where: 'note 3:8 “My servant the BRANCH”'
    claim: 'Jeremiah’s righteous Branch and King is a reference to the Messiah'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Jeremiah prophesied that this future ruler would be called “The Lord Our Righteousness,” a reference to the Messiah.'
  - where: 'note 3:8 “My servant the BRANCH”'
    claim: 'Zechariah echoed Jeremiah after the exile'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'after the Babylonian exile ended and many Jews had returned to Jerusalem, the prophet Zechariah echoed Jeremiah’s prophecy.'
  - where: 'note 3:8 “My servant the BRANCH”'
    claim: 'The ultimate fulfillment is Jesus Christ; some in Zechariah’s day may have hoped for it in Joshua'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The ultimate fulfillment of the branch prophecy (Zechariah 3:8) would be Jesus Christ.'
  - where: 'note 3:8 “My servant the BRANCH”'
    claim: 'Many may have hoped for a branch fulfillment in Joshua'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'However, many in Zechariah’s day may have hoped for a branch fulfillment in Joshua (Zechariah 6:11–12).'
  - where: 'note 3:8 “My servant the BRANCH”'
    claim: 'The Student Manual calls it a messianic reference'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'See Notes and Commentary on Isaiah 11:1. This is a messianic reference.'
  - where: 'note 3:9 “The stone with seven eyes”'
    claim: 'The clause can mean seven eyes on the stone or seven eyes directed on it'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'This statement may mean, either upon one stone are seven eyes (visible or to be found), or seven eyes are directed upon one stone.'
  - where: 'note 3:9 “The stone with seven eyes”'
    claim: 'Keil decides the eyes watch over the stone with care'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'For this reason we must decide that the seven eyes are directed towards the stone, or watch over it with protecting care.'
  - where: 'note 3:9 “The stone with seven eyes”'
    claim: 'The early church read the stone as the Messiah'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'the view held by the expositors of the early church, and defended by Kliefoth, namely, that the stone signifies the Messiah, after Isaiah 28:16'
  - where: 'note 3:9 “The stone with seven eyes”'
    claim: 'The stone is the kingdom of God; the eyes are the Spirit, as in Zechariah 4:10 and Revelation 5:6'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'in harmony with the seven eyes of the Lamb, which are the seven Spirits of God (Revelation 5:6), and with the seven eyes of Jehovah (Zechariah 4:10)'
  - where: 'note 3:9 “The stone with seven eyes”'
    claim: 'The stone is the symbol of the kingdom of God'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'The stone is the symbol of the kingdom of God, and is laid by Jehovah before Joshua'

  - where: 'note 3:9 “Iniquity removed in one day”'
    claim: 'The chapter heading: at the Second Coming iniquity will be removed in one day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'At the Second Coming, iniquity will be removed in one day.'
  - where: 'note 3:9 “Iniquity removed in one day”'
    claim: 'Through the Branch the Lord will remove the iniquity of the land in one day'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'when through the Branch (Messiah) the Lord will remove the iniquity of the land in one day (Jer. 23:5; 33:15)'
  - where: 'note 3:9 “Iniquity removed in one day”'
    claim: 'The Branch would remove the iniquity of the land in a single day'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'symbolic of the coming Branch, who would remove the iniquity of the land in a single day.'
  - where: christ
    claim: 'Joshua’s name is Jesus’ name; he was a type of Christ, the great High Priest'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Joshua (Hebrew Yeshua, Greek Hee-ay-sous, English Jesus) was a type of Jesus Christ, the great High Priest (see Hebrews 4:14).'
  - where: christ
    claim: 'Through the Branch the Lord will remove the iniquity of the land in one day'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'through the Branch (Messiah) the Lord will remove the iniquity of the land in one day'
  - where: christ
    claim: 'Forgiveness is the springboard for discipleship, not the end of the road'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Joshua (and Zechariah) learned that forgiveness is the springboard for discipleship. Forgiveness is not the end of the road.'
  - where: christ
    claim: 'The change can come in one day by Jehovah’s power to cleanse and save'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Miraculously, such a change can transpire “in one day,” given the mighty power of Jehovah to cleanse and save'

  - where: section 1 plain
    claim: 'A brand is a burning stick'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/brand'
    quote: 'A burning piece of wood; or a stick or piece of wood partly burnt'
  - where: 'note 3:2 “A brand plucked out of the fire”'
    claim: 'A brand is a burning piece of wood'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/brand'
    quote: 'A burning piece of wood; or a stick or piece of wood partly burnt'
  - where: section 2 plain
    claim: '“Protested” means testified'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'And the angel of the Lord testified to Joshua, and said'
  - where: 'note 3:9 “The stone with seven eyes”'
    claim: 'Stones with eyes were placed before ancient Near Eastern temples to identify donors or the person in charge; this one is before Joshua, not Zerubbabel'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Stones with eyes were placed before temples in the ancient Near East to identify the donors or person in charge.'
  - where: 'note 3:9 “The stone with seven eyes”'
    claim: 'The stone is before Joshua, not Zerubbabel; seven may imply a complete vision'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Notice how the stone here was placed before Joshua, the high priest. Zerubabbel is not mentioned. The number seven may imply a full, complete, or all-encompassing vision.'
