chapter: 14
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Zechariah prophesied 520–518 B.C.; chapters 9–14 are the book’s second division'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.). The book of Zechariah has two divisions'

  # ---- setting ----
  - where: 'setting'
    claim: 'Chapters 9–14 are prophecies about the Messiah and the events before the Second Coming'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 9–14, prophecies about the Messiah and events preceding His Second Coming.'
  - where: 'setting'
    claim: 'Chapter 14 expands the judgment and refining of 13:7–9'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'our chapter contains simply a further expansion of the summary announcement of the judgment upon Israel, and its refinement (Zechariah 13:7-9)'
  - where: 'setting'
    claim: 'The Church reads chapters 12–14 as a final battle at Jerusalem just before the Second Coming, often called Armageddon'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah prophesied of a great final battle that will take place in and around Jerusalem in the last days, just prior to the Second Coming of Jesus Christ. This future conflict is often referred to as Armageddon'
  - where: 'setting'
    claim: 'Ezekiel 38–39 relate to the same battle'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Ezekiel’s prophecies in Ezekiel 38–39 also relate to this battle.'
  - where: 'setting'
    claim: 'The Savior stands on the Mount of Olives before He appears to all the world'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The Savior will stand on the Mount of Olives prior to His appearance to all the world.'
  - where: 'setting'
    claim: 'Modern revelation names the Mount of Olives (Olivet) at His coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'For behold, he shall stand upon the mount of Olivet, and upon the mighty ocean, even the great deep, and upon the islands of the sea, and upon the land of Zion.'

  # ---- note 14:2 ----
  - where: 'note 14:2 “The last siege of Jerusalem”'
    claim: 'Zechariah says people from all nations will gather against Jerusalem in this final battle'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah said that in this battle, people from “all nations” will gather against Jerusalem.'
  - where: 'note 14:2 “The last siege of Jerusalem”'
    claim: 'The description fits many moments in Jerusalem’s history; the Lord fights for those true to their covenants'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'this description of violence and ravage can be applied to many moments in the city’s history. However, the blessing remains the same for Jerusalem and all people: if the people are true to their covenants'
  - where: 'note 14:2 “The last siege of Jerusalem”'
    claim: 'The Lord has promised protection to those who follow Him; Zion will be a place of refuge'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'the Lord has promised assistance and spiritual protection to those who choose to follow Him (see Revelation 17:14; 1 Nephi 22:16–17). One place of peace, refuge, and safety will be Zion, the New Jerusalem'

  # ---- note 14:4 ----
  - where: 'note 14:4 “The Lord returns to the Mount of Olives”'
    claim: 'Just when Jerusalem seems to fall the Lord intervenes; the mountain splits and the people flee through the new valley'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Just when it appears that Jerusalem will fall to her enemies, the Lord will intervene.'
  - where: 'note 14:4 “The Lord returns to the Mount of Olives”'
    claim: 'Ancient Christians understood that Jesus would return to the Mount of Olives, as the angel taught (Acts 1:11–12)'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'ancient Christians understood that Jesus would return to the Mount of Olives, just as an angel taught the Apostles (see Acts 1:11–12).'
  - where: 'note 14:4 “The Lord returns to the Mount of Olives”'
    claim: 'Jesus taught the Olivet Discourse on this mountain'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'In Matthew 24, Jesus is teaching on this mountain about the events leading up to His triumphant return.'
  - where: 'note 14:4 “The Lord returns to the Mount of Olives”'
    claim: 'In Zechariah 14:4 the Lord stands as a warrior and the split mountain makes a valley of refuge'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'Yahweh will descend from heaven and stand as a warrior upon the Mount of Olives. The result of his arrival will be the cataclysmic splitting of the mount in half, creating a valley of refuge for Israel.'
  - where: 'note 14:4 “The Lord returns to the Mount of Olives”'
    claim: 'D&C 45 joins 14:4 with 13:6 and makes the warrior of Zechariah 14 the crucified Jesus'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'his revelation that he, the crucified Jesus, is the long-awaited Messiah, the warrior of Zechariah 14, will be a major step in the commencement of the gathering of the Jewish nation.'
  - where: 'note 14:4 “The Lord returns to the Mount of Olives”'
    claim: 'D&C 45:48 and 45:52: the Lord sets His foot on the mount; “I am Jesus that was crucified”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'And then shall the Lord set his foot upon this mount, and it shall cleave in twain, and the earth shall tremble, and reel to and fro, and the heavens also shall shake.'

  # ---- note 14:5 flight ----
  - where: 'note 14:5 “The valley that reaches to Azal”'
    claim: 'Azal lies behind the Mount of Olives; the valley opens a direct path'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Azal is found behind the Mount of Olives, but with the creation of this valley the mount will not block a direct path to Jerusalem.'

  # ---- note 14:5 saints ----
  - where: 'note 14:5 “The saints who come with Him”'
    claim: '“Saints” is qĕdōšîm, the adjective “holy” used as a noun'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/6918.htm'
    quote: 'Strong''s Hebrew: 6918. קָדוֹשׁ (qadosh) -- Holy, sacred, set apart'
  - where: 'note 14:5 “The saints who come with Him”'
    claim: 'The lexicon lists this verse among those where the holy ones are angels'
    key: bdb
    url: 'https://biblehub.com/hebrew/6918.htm'
    quote: 'c. angels, Psalm 89:6; Psalm 89:8; Job 5:1; Job 15:15; Zechariah 14:5; Daniel 8:13 (twice in verse).'
  - where: 'note 14:5 “The saints who come with Him”'
    claim: 'The Church’s edition points the word to 1 Thessalonians 4:14 and the JST of 4:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: '1 Thes. 4:14; JST 1 Thes. 4:17'

  - where: 'note 14:5 “The saints who come with Him”'
    claim: 'Elsewhere the lexicon gives the plural the sense “saints,” God’s holy people'
    key: bdb
    url: 'https://biblehub.com/hebrew/6918.htm'
    quote: 'sacred ones, saints Deuteronomy 33:3 (song), Psalm 16:3'

  # ---- note 14:7 ----
  - where: 'note 14:7 “Light at evening”'
    claim: 'Verse 6 describes the stars losing their brightness, as in other prophecies of the day of judgment'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'The words therefore describe the passing away or vanishing of the brightness of the shining stars, answering to the prophetic announcement, that on the day of judgment, sun, moon, and stars will lose their brightness'
  - where: 'note 14:7 “Light at evening”'
    claim: 'The order of nature is reversed: at evening light comes instead of darkness'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'The order of nature is reversed: the day resembles the night, and the evening brings light. At the time when, according to the natural course of events, the dark night should set in, a bright light will dawn.'
  - where: 'note 14:7 “Light at evening”'
    claim: '“One day” means a day unique of its kind, known to the Lord'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'solitary in its kind, unparalleled by any other, because no second of the kind ever occurs'
  - where: 'note 14:7 “Light at evening”'
    claim: 'Zechariah 14 was read at the lamp-lighting at the Feast of Tabernacles; its light pointed to the Messiah as Light of the World; Jesus proclaimed Himself so'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'According to ancient sources,[29] Zechariah 14 was read during the lighting ceremony previously described.'
  - where: 'note 14:7 “Light at evening”'
    claim: 'Pilgrims heard the light of 14:6–7 as signifying the Messiah, the Light of the World'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'pilgrims at the feast would have heard the references to light in Zechariah 14:6–7, signifying that the Messiah would ultimately be the Light of the World, and not just for the Jews.'
  - where: 'note 14:7 “Light at evening”'
    claim: 'Jesus declared Himself the Light of the World in the context of the feast'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'By proclaiming himself as the Light of the World and the Light of Life in context of these recently transpired festivities, Jesus declared unequivocally that he was indeed the Messiah of whom the prophets of old had testified.'

  - where: 'note 14:7 “Light at evening”'
    claim: 'Verse 6 has been interpreted in very different ways'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'These words have been interpreted, however, from time immemorial in very different ways.'
  - where: 'note 14:7 “Light at evening”'
    claim: 'Enormous lampstands were lit in the temple courts at the feast, with Zechariah 14 read'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'the lighting of enormous lampstands in the courts of the temple in conjunction with the reading of messianic passages in Zechariah 14'

  # ---- note 14:10 ----
  - where: 'note 14:10 “The land made low, the city lifted up”'
    claim: 'Geba north, Rimmon south; the hill country between them made flat, as in Isaiah 40:4'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Geba is to the north and Rimmon to the south. Zechariah was saying that all the hilly country between them (including Jerusalem) would be made flat.'
  - where: 'note 14:10 “The land made low, the city lifted up”'
    claim: 'Jerusalem lifted up, perhaps reflecting Isaiah 2:2'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Then Jerusalem itself will be lifted up (Zechariah 14:10), perhaps to reflect Isaiah’s picture of the Lord’s house “established in the top of the mountains” (Isaiah 2:2).'

  # ---- note 14:16 ----
  - where: 'note 14:16 “Why the Feast of Tabernacles”'
    claim: 'The feast looked back to the deliverance from Egypt and forward to the final harvest of all nations'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The timing of the feast, held in the fall around the time of the yearly harvest, or ingathering, pointed both backward to the time when God gathered Israel out of Egypt and forward to the time of “the final harvest when Israel’s mission should be completed, and all nations gathered unto the Lord.”'
  - where: 'note 14:16 “Why the Feast of Tabernacles”'
    claim: '“All the nations” and “all the families of the earth” at the feast pointed to the gathering of all God’s children through the Messiah'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'the references to “all the nations,” “all the families of the earth,” and “all nations” in Zechariah 14:16–17, 19 in conjunction with worshipping the Lord in Jerusalem at the time of the Feast of Tabernacles pointed to the eventual gathering together of all God’s children'
  - where: 'note 14:16 “Why the Feast of Tabernacles”'
    claim: 'Leviticus 23: Israel dwelt in booths to remember the wilderness after Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'That your generations may know that I made the children of Israel to dwell in booths, when I brought them out of the land of Egypt'

  # ---- note 14:17 ----
  - where: 'note 14:17 “Nations that will not come up”'
    claim: 'Joseph Smith taught there will be wicked men on the earth during the Millennium and heathen nations who will not come up will be judged'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'There will be wicked men on the earth during the thousand years. The heathen nations who will not come up to worship will be visited with the judgments of God, and must eventually be destroyed from the earth.'
  - where: 'note 14:17 “Nations that will not come up”'
    claim: 'Rain stands for God’s blessing in general'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'For rain is an individualizing expression denoting the blessing of God generally'
  - where: 'note 14:17 “Nations that will not come up”'
    claim: 'Egypt is named as Israel’s old enemy, which is also to share in the blessings (Isaiah 19:19), not because Egypt lacks rain'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'as the nation which showed the greatest hostility to Jehovah and His people in the olden time, and for the purpose of showing that this nation was also to attain to a full participation in the blessings of salvation bestowed upon Israel (cf. Isaiah 19:19.)'
  - where: 'note 14:17 “Nations that will not come up”'
    claim: 'The Egypt reading from the Nile is set aside'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'not because of the fact in natural history, that this land owes its fertility not to the rain, but to the overflowing of the Nile'

  # ---- note 14:20 ----
  - where: 'note 14:20 “Holiness on the horses’ bells”'
    claim: 'The words were engraved on the high priest’s gold plate (Exodus 28:36)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: 'Ex. 28:36'
  - where: 'note 14:20 “Holiness on the horses’ bells”'
    claim: 'Everything becomes as holy as the temple vessels, the war horses included; the pots as sacred as those of the sacrifices'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'All would be as holy as the vessels of the temple—the war horses included. They would have the same symbolism as the priest’s mitre, indicating “Holiness to the Lord” (Exodus 28:36–37).'
  - where: 'note 14:20 “Holiness on the horses’ bells”'
    claim: 'The pioneer Saints put “Holiness to the Lord” on common things; how pervasive holiness needs to be'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'These references to holiness in seemingly unusual or unexpected places may seem incongruous, but they suggest just how pervasive and constant our focus on holiness needs to be.'
  - where: 'note 14:20 “Holiness on the horses’ bells”'
    claim: 'It was on sacrament cups, ordination certificates, a hammer, doorknobs of Brigham Young’s home'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'It was inscribed on sacrament cups and plates and printed on certificates of ordination of Seventies and on a Relief Society banner.'
  - where: 'note 14:20 “Holiness on the horses’ bells”'
    claim: 'The temple is inscribed “Holiness to the Lord”'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'We seek it in the temple, whereon is inscribed “Holiness to the Lord.”'

  - where: 'note 14:20 “Holiness on the horses’ bells”'
    claim: 'It appeared over the display windows of ZCMI, a department store'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: '“Holiness to the Lord” also appeared over the display windows of Zion’s Cooperative Mercantile Institution, the ZCMI department store.'
  - where: 'note 14:20 “Holiness on the horses’ bells”'
    claim: 'The land and its people would be temple holy'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'the entire country and its inhabitants would be holy, temple holy.'

  # ---- note 14:21 ----
  - where: 'note 14:21 “No more the Canaanite”'
    claim: 'The same Hebrew word can mean trader, merchant, probably so in Zechariah 14:21'
    key: bdb
    url: 'https://biblehub.com/hebrew/3669.htm'
    quote: 'II. כְּנַעֲנִי noun masculine trader, merchant (compare II. כְּנַעַן); only singular (but see below): — עוֺד ׳וְלֹא יִהְיֶה כ׳בְּבֵית י Zechariah 14:21 (probably)'
  - where: 'note 14:21 “No more the Canaanite”'
    claim: 'Jesus’ cleansing of the temple follows Zechariah 14:21 read as “traders”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Jesus cleanses the temple as prescribed in Zechariah: “There shall no longer be traders in the house of the Lord of hosts on that day” (14:21; emphasis added), explaining why Jesus targets those “who were selling and buying in the temple”'
  - where: 'note 14:21 “No more the Canaanite”'
    claim: 'Jesus’ acts mirror a three-part pattern in Zechariah 14'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: '(1) he arrives on the Mount of Olives, (2) he pronounces judgment on Israel, and (3) he enters Jerusalem and cleanses the temple.'
  - where: 'note 14:21 “No more the Canaanite”'
    claim: 'The Student Manual reads the Canaanite as the wicked'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'where “there shall be no more the Canaanite [the wicked] in the house of the Lord of hosts” (v. 21).'

  - where: 'note 14:21 “No more the Canaanite”'
    claim: 'The Church’s edition points “Canaanite” to Joel 3:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: 'Joel 3:17'

  # ---- christ ----
  - where: 'christ'
    claim: 'In D&C 45 the warrior of Zechariah 14 is revealed as the crucified Jesus'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'D&C 45 describes how Jesus’s appearance on the Mount of Olives and his revelation that he, the crucified Jesus, is the long-awaited Messiah, the warrior of Zechariah 14'
  - where: 'christ'
    claim: 'The Lord promises He will always remember His covenant and rescue His people'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'the Lord promises that He will always remember His covenant and rescue His people.'
  - where: 'christ'
    claim: 'Holiness is sought in the details of daily living'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'We seek it even in the details of daily living: our speech, our dress, our thoughts.'
