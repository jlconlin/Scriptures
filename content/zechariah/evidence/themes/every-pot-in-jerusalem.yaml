  - where: 'section “Upon the bells of the horses”'
    claim: 'Connection made by this page: the plate’s purpose (Ex. 28:38, that one man bear the iniquity of the holy things so the people’s gifts be accepted) is finished at Zech. 14:20–21, because Zechariah’s own book has shown the iniquity removed (3:4, 3:9, 13:1–2). The words stand on every pot because no iniquity is left in the people’s holy things for anyone to bear; the pots are holy because what kept them common has been taken away. Keil places the removal at the judgment, when sin is cleansed away and there are no more sinners; the page adds the forgiveness and cleansing of chapters 3 and 13 as the way the condition is met. He does not join it to chapter 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
