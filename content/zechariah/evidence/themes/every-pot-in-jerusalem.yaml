page: every-pot-in-jerusalem
claims:
  - where: 'section “One man, and he does nothing”'
    claim: 'The filthy garment represents sin'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The garment of filthiness represents sin.'
  - where: 'section “One man, and he does nothing”'
    claim: 'Keil reads the clean turban as the base for the golden plate of Ex. 28:36–38'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'the clean turban was the substratum for the golden plate that was fastened upon it'
  - where: 'section “The land, in one day; wickedness carried out”'
    claim: 'The Bible Dictionary reads the removal of the land’s iniquity as through the Branch (Messiah)'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'when through the Branch (Messiah) the Lord will remove the iniquity of the land in one day (Jer. 23:5; 33:15)'
  - where: 'section “The land, in one day; wickedness carried out”'
    claim: 'Scripture Helps reads the coming Branch as the one who removes the iniquity in a single day'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Joshua and his fellow priests were symbolic of the coming Branch, who would remove the iniquity of the land in a single day.'
  - where: 'section “The land, in one day; wickedness carried out”'
    claim: 'The Church’s edition reads the removal of iniquity in one day as at the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'At the Second Coming, iniquity will be removed in one day.'
  - where: 'section “The land, in one day; wickedness carried out”'
    claim: 'The Bible Dictionary reads the ephah vision as the removing of the people’s sin to Shinar'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 5:5–11, seventh vision, symbol of the removing of the sin of the people to Shinar, the land of their foes (Lev. 16:21).'
  - where: 'section “A fountain for the city”'
    claim: 'John 19:37 quotes Zech. 12:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: 'And again another scripture saith, They shall look on him whom they pierced.'
  - where: 'section “A fountain for the city”'
    claim: 'The Lord says the Jews will weep because of their iniquities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'And then shall they weep because of their iniquities; then shall they lament because they persecuted their king.'
  - where: 'section “A fountain for the city”'
    claim: 'The Bible Dictionary groups the Spirit poured out and the fountain as one movement (12:10–13:6)'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'The Spirit poured out on Jerusalem, and a fountain opened for sin and uncleanness (12:10–13:6).'
  - where: 'section “A fountain for the city”'
    claim: 'The Church’s footnote on “fountain” points to baptism'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: '“fountain”: TG Baptism.'
  - where: 'section “A fountain for the city”'
    claim: 'Connection made by this page: Zech. 3:4 “I have caused thine iniquity to pass from thee” (Hiphil of ʿbr, heʿĕbartî) and 13:2 “I will cause the prophets and the unclean spirit to pass out” (ʾaʿăbîr) are the same verb in the same stem, the Lord the subject, sin or uncleanness the object'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'הֶעֱבַ֤רְתִּי'
  - where: 'section “A fountain for the city”'
    claim: 'Connection made by this page (second verse): 13:2 ʾaʿăbîr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'אַעֲבִ֥יר'
  - where: 'section “Every pot”'
    claim: 'Zech. 14:20 has the same two Hebrew words (qōdeš laYHWH) as the plate of Ex. 28:36'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'קֹ֖דֶשׁ'
  - where: 'section “Every pot”'
    claim: 'Ex. 28:36 has the same two words (qōdeš laYHWH)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'קֹ֖דֶשׁ'
  - where: 'section “Every pot”'
    claim: 'The clean turban is read as the base for the plate (Keil)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'the clean turban was the substratum for the golden plate that was fastened upon it'
  - where: 'section “Every pot”'
    claim: 'Connection made by this page: the clean mitre asked for in Zech. 3:5 set beside the words of the plate on the horses’ bells and every pot in 14:20–21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'Let them set a fair mitre upon his head.'
  - where: 'section “Every pot”'
    claim: 'Connection made by this page (second end): 14:20–21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: 'every pot in Jerusalem and in Judah shall be holiness unto the LORD of hosts'
  - where: 'section “Every pot”'
    claim: 'The distinction between holy and profane ceases only when sin and moral defilement are entirely removed (Keil)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'The distinction between holy and profane can only cease, however, when the sin and moral defilement which first evoked this distinction, and made it necessary that the things intended for the service of God should be set apart, and receive a special consecration, have been entirely removed and wiped away.'
  - where: 'section “Every pot”'
    claim: 'The Church’s manual reads “the Canaanite” as the wicked'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: '“there shall be no more the Canaanite [the wicked] in the house of the Lord of hosts” (v. 21).'
  - where: 'section “For the whole city”'
    claim: 'Joshua was a type of Jesus Christ, the great High Priest'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Joshua (Hebrew Yeshua, Greek Hee-ay-sous, English Jesus) was a type of Jesus Christ, the great High Priest (see Hebrews 4:14).'
  - where: 'section “For the whole city”'
    claim: 'The Lord who spoke in D&C 45 says “I am Jesus that was crucified” of the wounds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'I am he who was lifted up. I am Jesus that was crucified. I am the Son of God.'
  - where: 'section “For the whole city”'
    claim: 'Zech. 13:1’s “uncleanness” (niddâ) is the word of the “water of separation” in Num. 19:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'וּ/לְ/נִדָּֽה'
  - where: 'section “For the whole city”'
    claim: 'Num. 19:9 has the same word niddâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נִדָּ֖ה'
  - where: 'section “For the whole city”'
    claim: 'Num. 19:13: without the water of separation one who touched the dead is unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'because the water of separation was not sprinkled upon him, he shall be unclean'
  - where: 'section “For the whole city”'
    claim: 'Hag. 2:13: one unclean by a dead body makes what he touches unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'If one that is unclean by a dead body touch any of these, shall it be unclean?'
  - where: 'section “For the whole city”'
    claim: 'Connection made by this page: Haggai’s priests’ ruling (Hag. 2:12–13) set beside the fountain for “uncleanness” (13:1), niddâ, the word of Num. 19:9’s water of separation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'shall it be holy? And the priests answered and said, No.'
  - where: 'section “For the whole city”'
    claim: 'Connection made by this page (Num. 19:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'it shall be kept for the congregation of the children of Israel for a water of separation: it is a purification for sin.'
  - where: 'section “For the whole city”'
    claim: 'Connection made by this page (Zech. 13:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: 'for sin and for uncleanness'
  - where: 'section “Engraved on every heart”'
    claim: 'If we repent, Jesus Christ can take away our sins (on Zech. 3:3–7)'
    key: liahona-2022-12-holy
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/12/come-follow-me/23-how-does-the-lord-make-us-holy?lang=eng'
    quote: 'if we repent, Jesus Christ can take away our sins. We are forgiven and can become more holy.'
  - where: 'section “Engraved on every heart”'
    claim: 'Elder Christofferson: holiness sought in the details of daily living'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'We seek it even in the details of daily living: our speech, our dress, our thoughts.'
  - where: 'section “Engraved on every heart”'
    claim: 'Come, Follow Me: the inscription must be engraved on every heart'
    key: cfm-ot-2026-50
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/50?lang=eng'
    quote: 'It means the inscription “Holiness unto the Lord” must be engraved not just on a temple wall, or even on “the bells of the horses” and “every pot in Jerusalem” (Zechariah 14:20–21). They must also be engraved on every heart.'
