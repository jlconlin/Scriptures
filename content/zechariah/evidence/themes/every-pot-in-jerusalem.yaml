page: every-pot-in-jerusalem
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Ex. 28:36 “HOLINESS TO THE LORD” is qōdeš laYHWH'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'קֹ֖דֶשׁ'
  - where: 'opening'
    claim: 'Zech. 14:20 “HOLINESS UNTO THE LORD” is the same two words, qōdeš laYHWH (hebrew.mjs zechariah 14:20)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'לַֽ/יהוָ֑ה'
  - where: 'opening'
    claim: 'The Church’s footnote at Ex. 28:36 “Holiness” points to Zech. 14:20 (and 14:20a points back to Ex. 28:36)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'Jer. 2:3 (1–4); Zech. 14:20.'
  - where: 'opening'
    claim: 'The Church’s footnote at Zech. 14:20 “Holiness” points to Ex. 28:36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: 'Ex. 28:36.'
  - where: 'opening'
    claim: 'ʿāwōn (H5771), the noun of Ex. 28:38, occurs in Zechariah only at 3:4 and 3:9 (occurrences.mjs zechariah --hebrew H5771: 2 occurrences); 13:1–2 use ḥaṭṭāʾt, niddâ and ṭumʾâ; 14:20–21 has none of these'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'עֲוֺ֥ן'
  - where: 'opening'
    claim: 'The distinction between holy and profane can cease only when the sin that evoked it has been entirely removed (the sourced step the page builds on)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'The distinction between holy and profane can only cease, however, when the sin and moral defilement which first evoked this distinction, and made it necessary that the things intended for the service of God should be set apart'
  - where: 'opening'
    claim: 'Keil places the removal of sin, and the end of the holy/profane distinction, at the judgment'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'and sin with all its consequences be cleansed away by the judgment. In the perfected kingdom of God there will be no more sinners'
  - where: 'opening'
    claim: 'Connection made by this page: between the plate of Ex. 28:36–38 and the pots of Zech. 14:20–21, Zechariah shows the high priest made clean before the turban that carried the plate is set on him (3:4–5), the land’s iniquity removed in one day (3:9) and a fountain opened for sin (13:1); so the words that one man wore to bear the iniquity of the people’s holy things can stand on everything, because the iniquity the plate was worn to bear has been removed. The commentators tie 3:5 and 14:20 to the plate separately; none read joins them. Keil places the removal at the judgment; the page adds the forgiveness and cleansing of chapters 3 and 13 as the way his condition is met'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: 'every pot in Jerusalem and in Judah shall be holiness unto the Lord of hosts'
  # ---------- section “That Aaron may bear the iniquity of the holy things” ----------
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'In Ex. 28:38 “bear” is nāśāʾ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/נָשָׂ֨א'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'In Ex. 28:38 “iniquity” is ʿāwōn'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'עֲוֺ֣ן'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'BDB lists nāśāʾ ʿāwōn at Ex. 28:38 with Lev. 10:17 under “bear the punishment for iniquity of others”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5771.htm'
    quote: 'bear the punishment for iniquity of others Exodus 28:38; Leviticus 10:17'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'The Church’s footnote at Ex. 28:38 gives “atone for” for “bear”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'OR atone for.'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'One reading: the high priest an atoning mediator, given power to exterminate the sin clinging to the people’s holy offerings'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/28.htm'
    quote: 'endowed with the power to exterminate the sin which clung to the holy offerings of the people on account of the unholiness of their nature'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'Keil: the high priest an atoning mediator of the whole nation'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/28.htm'
    quote: 'The high priest was exalted into an atoning mediator of the whole nation'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'Another reading: the guilt of accidental ritual error; the plate marks him the people’s specially holy representative, so their offerings are accepted'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/28.htm'
    quote: 'take upon himself the guilt of any ritual error or mistake made accidentally in offering the holy things'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'Cambridge: the plate marks him the people’s specially holy representative'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/28.htm'
    quote: 'marks him out as the people’s specially holy representative before God'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'The removal of sin by the typical priesthood had to be continually repeated'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'will not resemble that effected by the typical priesthood, which had to be continually repeated, but will be all finished at once.'
  - where: 'section “That Aaron may bear the iniquity of the holy things”'
    claim: 'Heb. 10:11: every priest offers oftentimes the same sacrifices, which can never take away sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'offering oftentimes the same sacrifices, which can never take away sins'
  # ---------- section “I have caused thine iniquity to pass from thee” ----------
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'The Church’s footnote at Zech. 3:1 gives the Hebrew sense of “Satan”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'HEB the Adversary or Accuser'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'Joshua stands for the nation; the dirt is sin'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'The high priest, and the nation in him, are not only to be cleansed from sin, and justified, but to be sanctified and glorified as well.'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'The priest’s vesture symbolically defiled through the sins of the people'
    key: barnes-zechariah
    url: 'https://biblehub.com/commentaries/barnes/zechariah/3.htm'
    quote: 'symbolically defiled through the sins of the people'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: '“Thine iniquity” in Zech. 3:4 is ʿāwōn, the noun of Ex. 28:38'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'עֲוֺנֶ֔/ךָ'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: '“I have caused … to pass” is heʿĕbartî, Hiphil of ʿābar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'הֶעֱבַ֤רְתִּי'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'BDB lists the Hiphil “cause to pass away, take away” with an accusative of sin at 2 Sam. 12:13 and with “from” a person at Zech. 3:4: the idiom is common'
    key: bdb
    url: 'https://biblehub.com/hebrew/5674.htm'
    quote: 'Cause to pass away, take away'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'BDB lists heʿĕbîr ʿāwōn at Zech. 3:4 (and mûš at 3:9) among phrases “of forgiveness or removal”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5771.htm'
    quote: 'of forgiveness or removal'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'The verb has figurative meanings, one of which is forgiving sin, with 2 Sam. 12:13 and Zech. 3:4 as examples'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'The word ‘br also has a number of figurative meanings, one of which is the forgiving of sin (for examples, see 2 Samuel 12:13, 24:10, Micah 7:18, Job 7:21, or Zechariah 3:4).'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'Keil: “I have caused thy guilt to pass away” means I have forgiven thy sin'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'I have forgiven thy sin, and justified thee (cf. 2 Samuel 12:13; 2 Samuel 24:10)'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'The Church’s footnote at Zech. 3:5: HEB a clean (pure) cap'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'HEB a clean (pure) cap.'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: '“Mitre” in Zech. 3:5 is ṣānîp'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'צָנִ֥יף'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'Zechariah’s word is not Exodus’s, but the same headdress is meant'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/3.htm'
    quote: 'The word is not the same (though from the same root) as that used in Exodus 28:4; Exodus 28:36-38; but there is no doubt that the same thing is intended.'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'Keil: tsânîph synonymous with mitsnepheth, the high priest’s tiara'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'is synonymous with mitsnepheth, the technical word for the tiara prescribed for the high priest in the law'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'Keil: the clean turban was the base for the golden plate, by which he was called to bear the guilt of Israel (Ex. 28:38)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'the clean turban was the substratum for the golden plate that was fastened upon it, and by which he was described as holy to the Lord, and called to bear the guilt of the children of Israel (Exodus 28:38)'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'Pulpit: the mitre bore the plate and showed him qualified to intercede for the people; probably a synonym of Exodus’s word'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/3.htm'
    quote: 'For the fair linen mitre, or tiara, was that which bore upon its front the golden plate inscribed, "Holiness unto the Lord" (Exodus 28:36-38), and therefore showed that he was qualified to intercede for the people.'
  - where: 'section “I have caused thine iniquity to pass from thee”'
    claim: 'Connection made by this page: the order of Zech. 3:3–5 is that the Lord removes the high priest’s iniquity first, and only then is the turban that carried “HOLINESS TO THE LORD” set on his head; the plate did not make its wearer clean, it was set on a man the Lord had already cleansed, and nothing is asked of him until 3:7. The commentators tie the turban to the plate; none draws this conclusion from the order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'Behold, I have caused thine iniquity to pass from thee, and I will clothe thee with change of raiment.'
  # ---------- section “I will remove the iniquity of that land in one day” ----------
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'Joshua and his fellow priests symbolic of the coming Branch who would remove the iniquity of the land in a single day'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah said that Joshua and his fellow priests were symbolic of the coming Branch, who would remove the iniquity of the land in a single day.'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: '“Engrave the graving” is pittēaḥ pittûḥāh (Zech. 3:9)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'מְפַתֵּ֣חַ'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'Ex. 28:36 “engravings of a signet” has the same verb and noun (ûpittaḥtā … pittûḥê)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פִּתּוּחֵ֣י'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'The engraving verb occurs three times in Exodus 28, once of the golden plate'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/3.htm'
    quote: 'The word here used for “engrave” occurs three times in Exodus 28, in the expression “engravings of a signet;” twice of the jewels in the High Priest’s dress (11, 21), once of the golden plate on his mitre (36).'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: '“The iniquity of that land” in 3:9 is ʿāwōn again'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'עֲוֺ֥ן'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'BDB lists ʿāwōn at Zech. 3:4 and 3:9 under forgiveness or removal'
    key: bdb
    url: 'https://biblehub.com/hebrew/5771.htm'
    quote: 'of forgiveness or removal'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'The Church’s chapter heading reads 3:9 of the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'At the Second Coming, iniquity will be removed in one day.'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'Elder McConkie: the wicked destroyed and the millennial era begun'
    key: ot-seminary-teacher-156
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-zechariah/lesson-156-zechariah-3-8?lang=eng'
    quote: 'meaning that the wicked shall be destroyed and the millennial era of peace and righteousness commence'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'Keil: “in one day” is the ephapax of Hebrews; not repeated like the typical priesthood’s; the day of Golgotha'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/3.htm'
    quote: 'will not resemble that effected by the typical priesthood, which had to be continually repeated, but will be all finished at once. This one day is the day of Golgotha.'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'Cambridge: the Day of Atonement possibly glanced at; the goal is the day of Golgotha'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/3.htm'
    quote: 'It is possible that the renewal of the typical expiation of sin in “one day,” the Day of Atonement (Leviticus 16:21; Leviticus 16:30; Leviticus 16:34), consequent upon the re-building of the Temple and the resumption of its services, is here glanced at.'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'Cambridge: the goal of the prophecy is the day of Golgotha'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/3.htm'
    quote: 'But the goal of the prophecy is “the day of Golgotha.”'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'Barnes: the yearly Day of Atonement’s repetition showed nothing lasting was effected; the one day is the day Jesus died'
    key: barnes-zechariah
    url: 'https://biblehub.com/commentaries/barnes/zechariah/3.htm'
    quote: 'Year by year came the day of atonement: its yearly repetition showed that nothing lasting was effected.'
  - where: 'section “I will remove the iniquity of that land in one day”'
    claim: 'Barnes: the day iniquity was removed is the day Jesus died'
    key: barnes-zechariah
    url: 'https://biblehub.com/commentaries/barnes/zechariah/3.htm'
    quote: 'On the day when Jesus died.'
  # ---------- section “For sin and for uncleanness” ----------
  - where: 'section “For sin and for uncleanness”'
    claim: '“For sin” in 13:1 is ḥaṭṭāʾt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'לְ/חַטַּ֖את'
  - where: 'section “For sin and for uncleanness”'
    claim: '“For uncleanness” in 13:1 is niddâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'וּ/לְ/נִדָּֽה'
  - where: 'section “For sin and for uncleanness”'
    claim: 'Num. 19:9 has both nouns in one verse (mê niddâ … ḥaṭṭāʾt)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נִדָּ֖ה'
  - where: 'section “For sin and for uncleanness”'
    claim: 'Num. 19:9 ḥaṭṭāʾt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'חַטָּ֥את'
  - where: 'section “For sin and for uncleanness”'
    claim: 'The Church’s footnote at Num. 19:9 explains “water of separation”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'IE water for removal of impurity.'
  - where: 'section “For sin and for uncleanness”'
    claim: 'The law’s lustral waters, contained and renewed, give way to a fountain opened once and remaining open'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/13.htm'
    quote: 'which were contained and renewed in bowl or laver, and which did but “sanctify to the purifying of the flesh,” shall be substituted the living fountain of the Gospel, opened once but remaining open ever'
  - where: 'section “For sin and for uncleanness”'
    claim: 'The Church’s footnote on “fountain” points to baptism'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: '“fountain”: TG Baptism.'
  - where: 'section “For sin and for uncleanness”'
    claim: 'The Church’s heading to Zechariah 13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: 'The Jews will gain forgiveness at the Second Coming'
  - where: 'section “For sin and for uncleanness”'
    claim: '“I will cause … to pass” in 13:2 is ʾaʿăbîr, the Hiphil of ʿābar as in 3:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'אַעֲבִ֥יר'
  - where: 'section “For sin and for uncleanness”'
    claim: 'BDB lists Zech. 13:2 with Zech. 3:4 under the Hiphil sense “cause to pass away, take away”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5674.htm'
    quote: 'Cause to pass away, take away'
  # ---------- section “Upon the bells of the horses” ----------
  - where: 'section “Upon the bells of the horses”'
    claim: 'The bells will resemble the high priest’s head-dress in holiness'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/14.htm'
    quote: 'the meaning is, that the bells of the horses will resemble the head-dress of the high priest in holiness'
  - where: 'section “Upon the bells of the horses”'
    claim: 'The pots were vessels of inferior sanctity for boiling sacrificial meat; the bowls held the blood; now the lower equal to the highest'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/14.htm'
    quote: 'The prophet announces that now all shall be holy, the lower equal to the highest.'
  - where: 'section “Upon the bells of the horses”'
    claim: 'Pulpit: the pots are of inferior sanctity, for boiling the meat of the sacrifice'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/14.htm'
    quote: 'The "pots" are vessels of inferior sanctity used for boiling the meat of the sacrifice'
  - where: 'section “Upon the bells of the horses”'
    claim: 'The Church’s reading: in the Millennium everything, symbolized by horse trappings and jars, holy and pure; the Canaanite is the wicked'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'everything (symbolized by such trifles as the trappings on horses and earthen jars) shall be holy and pure and where “there shall be no more the Canaanite [the wicked] in the house of the Lord of hosts”'
  - where: 'section “Upon the bells of the horses”'
    claim: 'Cambridge: all distinction between sacred and secular at an end'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/14.htm'
    quote: 'All distinction between sacred and secular shall be at an end, because all shall now be alike holy.'
  - where: 'section “Upon the bells of the horses”'
    claim: 'Barnes: he uplifts ordinary things'
    key: barnes-zechariah
    url: 'https://biblehub.com/commentaries/barnes/zechariah/14.htm'
    quote: 'He does not bring down what is sacred to a level with common things, but he uplifts ordinary things'
  - where: 'section “Upon the bells of the horses”'
    claim: 'BDB: kĕnaʿănî at Zech. 14:21 probably “trader, merchant”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3669.htm'
    quote: 'noun masculine trader, merchant'
  - where: 'section “Upon the bells of the horses”'
    claim: 'Cambridge gives the merchant reading and prefers any unclean person; names Rev. 21:27 as the true scope'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/14.htm'
    quote: 'The whole scope of the passage, however, is in favour of the view that “the Canaanite” here means any unclean person'
  - where: 'section “Upon the bells of the horses”'
