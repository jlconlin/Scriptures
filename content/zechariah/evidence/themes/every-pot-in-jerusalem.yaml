  - where: 'section “A great high priest”'
    claim: 'Connection made by this page: Joshua’s own iniquity had to be taken away before the turban was set on him (Zech. 3:4–5); the High Priest of Heb. 7:27 needed no offering for His own sins, and offered once. So the One the plate’s words describe, perfectly holy, is the One who removes the iniquity the plate was worn to bear: Aaron’s bearing had to go on always, Jesus Christ’s offering was made once. The Student Manual gives the type; the contrast is the page’s'
