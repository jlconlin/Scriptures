page: awake-o-sword
claims:
  - where: 'section “A flock with no shepherd”'
    claim: 'Church manual: Jesus Christ is the true shepherd of our souls'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Jesus Christ is the true shepherd of our souls (see John 10:7–15).'
  - where: 'section “The shepherd they would not have”'
    claim: 'The two staffs represent the broken covenant between God and His people and the breakdown of national unity'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The two staffs that Zechariah broke represent the broken covenant between God and His people—and the breakdown of national unity within the house of Israel.'
  - where: 'section “The shepherd they would not have”'
    claim: 'The thirty pieces were the price of a slave'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'he was paid 30 pieces of silver—the price of a slave.'
  - where: 'section “The shepherd they would not have”'
    claim: 'The people rejected Jehovah as their shepherd and protector'
    key: seminary-ot-teacher-157
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-zechariah/lesson-157-zechariah-9-14?lang=eng'
    quote: 'They rejected Jehovah as their shepherd and protector.'
  - where: 'section “Two swords”'
    claim: '“Sword” (ḥereb) is in Zechariah three times, in three verses: 9:13, 11:17, 13:7 (occurrences.mjs zechariah --hebrew H2719)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'חֶ֥רֶב'
  - where: 'section “Two swords”'
    claim: 'The acts of the worthless shepherd are the Lord’s judgment on a people which rejected the true shepherd'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'the scandalous acts which his wicked heart teaches him to perform are the Lord’s dread judgment on a people which rejected the true shepherd.”'
  - where: 'section “Two swords”'
    claim: 'Keil: the smitten shepherd is not the foolish shepherd of 11:15–17 but the Messiah; the smiting is according to the will of God'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'The summons addressed to the sword, to awake and smite, is a poetical turn to express the thought that the smiting takes place with or according to the will of God.'
  - where: 'section “Two swords”'
    claim: 'Keil: the shepherd cannot be the foolish shepherd of 11:15–17; he is the Messiah'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'or the foolish shepherd mentioned in Zechariah 11:15-17, as Grotius, Umbr., Ebrard, Ewald, Hitzig, and others suppose;'
  - where: 'section “Two swords”'
    claim: 'Keil: the shepherd is the Messiah'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'is therefore no other than the Messiah'
  - where: 'section “Two swords”'
    claim: 'The Shepherd of Israel is Jesus Christ'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The Shepherd of Israel is Jesus Christ.'
  - where: 'section “Two swords”'
    claim: 'Connection made by this page: the book’s two swords (11:17, 13:7), set side by side, fall on two shepherds; Keil rejects identifying the shepherd of 13:7 with the foolish shepherd'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/11?lang=eng'
    quote: 'Woe to the idol shepherd that leaveth the flock! the sword shall be upon his arm, and upon his right eye'
  - where: 'section “Two swords”'
    claim: 'Connection made by this page: the second sword, in the words of 13:7, falls on “my shepherd”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: 'Awake, O sword, against my shepherd, and against the man that is my fellow, saith the LORD of hosts: smite the shepherd, and the sheep shall be scattered'
  - where: 'section “The night He quoted it”'
    claim: 'Matt. 26:28: the cup, “my blood of the new testament”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'For this is my blood of the new testament, which is shed for many for the remission of sins.'
  - where: 'section “The night He quoted it”'
    claim: 'Matt. 26:31, on the Mount of Olives, with the footnote to Zech. 13:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'Then saith Jesus unto them, All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep of the flock shall be scattered abroad.'
  - where: 'section “The night He quoted it”'
    claim: 'Matt. 26:32: Galilee after the Resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'But after I am risen again, I will go before you into Galilee.'
  - where: 'section “The night He quoted it”'
    claim: 'Jesus used the prophecy to anticipate how the disciples would flee'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'using this prophecy about the sheep scattering after the shepherd had been struck to anticipate how the disciples would flee when Jesus was arrested in Gethsemane.'
  - where: 'section “The night He quoted it”'
    claim: 'Galilee is an exposition of the hand brought back over the small ones'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The promise, ‘But after my resurrection I will go before you into Galilee,’ is a practical exposition of the bringing back of the hand over the small ones'
  - where: 'section “Whose blood”'
    claim: 'Keil: the covenant blood is that of Ex. 24:8'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'since the covenant blood belonged to all Israel of the twelve tribes (Exodus 24:8).'
  - where: 'section “Whose blood”'
    claim: 'McConkie: the gospel covenant is efficacious because of the shedding of Christ’s blood'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'because of the gospel covenant, which is efficacious because of the shedding of the blood of Christ'
  - where: 'section “Whose blood”'
    claim: 'The prisoners among the dead: those who died unbaptized can be freed from spirit prison'
    key: seminary-ot-teacher-157
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-zechariah/lesson-157-zechariah-9-14?lang=eng'
    quote: 'those who have died without having been baptized can be freed from spirit prison.'
  - where: 'section “Whose blood”'
    claim: 'Ex. 24:8, “the blood of the covenant”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'Behold the blood of the covenant, which the Lord hath made with you concerning all these words.'
  - where: 'section “Whose blood”'
    claim: 'The Savior’s words at the cup alluded to Ex. 24:8'
    key: nt-student-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-9?lang=eng'
    quote: 'When Jesus Christ alluded to this statement, as recorded in Matthew 26:28, He taught that the new “testament,” or covenant, was about to be ratified with blood'
  - where: 'section “Whose blood”'
    claim: 'Connection made by this page: the covenant blood of Zech. 9:11 (read as the gospel covenant efficacious by Christ’s blood) set beside the cup of Matt. 26:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/9?lang=eng'
    quote: 'by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water.'
  - where: 'section “Whose blood”'
    claim: 'Connection made by this page: the cup, “my blood of the new testament, which is shed for many,” given on the night the Shepherd was struck'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'For this is my blood of the new testament, which is shed for many for the remission of sins.'
  - where: 'section “It is my people”'
    claim: 'Church’s Old Testament manual: only one-third of Israel will survive the final extremity, citing 13:8–9'
    key: ot-manual-kings-i
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-i?lang=eng'
    quote: 'Zechariah says that only one-third of the nation of Israel will survive this final extremity'
  - where: 'section “It is my people”'
    claim: 'The Hebrew of 11:10 has “all the peoples” (plural)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'הָ/עַמִּֽים'
  - where: 'section “It is my people”'
    claim: 'The Hebrew of 13:9 has “my people” and no word for covenant (hebrew.mjs zechariah 13:9)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'עַמִּ֣/י'
  - where: 'section “It is my people”'
    claim: 'Connection made by this page: 11:10’s broken covenant relationship set beside 13:9’s “my people … my God” after the stroke'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/11?lang=eng'
    quote: 'that I might break my covenant which I had made with all the people.'
  - where: 'section “It is my people”'
    claim: 'Connection made by this page: 13:9’s “my people … my God” after the stroke of 13:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: 'I will say, It is my people: and they shall say, The LORD is my God.'
  - where: 'section “The Shepherd struck for the flock”'
    claim: 'The Shepherd would be sold by His own people'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'would be sold for thirty pieces of silver by His own people.'
  - where: 'section “The Shepherd struck for the flock”'
    claim: 'He knows each of us better than we know ourselves; the disciples were scattered after the arrest'
    key: nt-student-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-9?lang=eng'
    quote: 'He likewise knows each of us better than we know ourselves.'
  - where: 'section “The Shepherd struck for the flock”'
    claim: 'Seminary manual: those who died unbaptized can be freed from spirit prison (9:11)'
    key: seminary-ot-teacher-157
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-zechariah/lesson-157-zechariah-9-14?lang=eng'
    quote: 'those who have died without having been baptized can be freed from spirit prison.'
  - where: 'section “The Shepherd struck for the flock”'
    claim: 'Connection made by this page: Heb. 13:20 set beside the arc, shepherd and covenant blood in one verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/13?lang=eng'
    quote: 'that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting covenant'
  - where: 'section “Two swords”'
    claim: 'As part of the betrayal for thirty pieces, Jesus Christ would be smitten and His followers scattered (Zech. 13:7; Matt. 26:31)'
    key: seminary-ot-teacher-157
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-zechariah/lesson-157-zechariah-9-14?lang=eng'
    quote: 'Zechariah also saw that as part of this betrayal, Jesus Christ would be smitten and His followers would be scattered (see Zechariah 13:7; Matthew 26:31).'
  - where: 'section “It is my people”'
    claim: 'The two staffs represent the covenant relationship between Jehovah and His people'
    key: seminary-ot-teacher-157
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-zechariah/lesson-157-zechariah-9-14?lang=eng'
    quote: 'Jehovah spoke of two staffs to represent this covenant relationship.'
  - where: 'section “It is my people”'
    claim: 'The Church’s helps read the broken covenant of 11:10 as between God and His people'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The two staffs that Zechariah broke represent the broken covenant between God and His people—and the breakdown of national unity within the house of Israel.'
  - where: 'section “It is my people”'
    claim: 'Another reading takes the covenant of 11:10 as made with all nations'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'to destroy my covenant which I had made with all nations.'
  - where: 'section “It is my people”'
    claim: 'The Church’s footnote 13:9d (“people”) goes to Jer. 30:22, Hosea 2:23, Rom. 9:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: 'people'
  - where: 'section “It is my people”'
    claim: 'Jer. 30:22 has “my people … your God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'And ye shall be my people, and I will be your God.'
