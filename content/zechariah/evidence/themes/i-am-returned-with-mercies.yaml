page: i-am-returned-with-mercies
claims:
  - where: "opening"
    claim: "The verb šûb (H7725) is in Zechariah 18 times; the Lord is its subject eight times (1:3, 1:16, 8:3, 8:15, 9:12, 10:6, 10:10, 13:7), in book order (occurrences.mjs zechariah --hebrew H7725; hebrew.mjs for each verse)"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml"
    quote: "שַׁ֤בְתִּי"
  - where: "section “One verb, two sides”"
    claim: "The one verb stands in both halves of 1:3: imperative (people) and imperfect (Lord) (hebrew.mjs zechariah 1:3)"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml"
    quote: "שׁ֣וּבוּ"
  - where: "section “One verb, two sides”"
    claim: "Keil on 1:3: the return was not perfect; Jehovah had also turned to the people again"
    key: keil-zechariah
    url: "https://biblehub.com/commentaries/kad/zechariah/1.htm"
    quote: "but simply that the return to the Lord was not a perfect one, not a thorough conversion of heart. So had Jehovah also turned to the people again"
  - where: "section “Returned with mercies”"
    claim: "1:16 “I am returned” is the verb of 1:3 in the Qal perfect (hebrew.mjs zechariah 1:16)"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml"
    quote: "שַׁ֤בְתִּי"
  - where: "section “Returned with mercies”"
    claim: "Connection made by this page: the mercy asked in 1:12 (“how long wilt thou not have mercy on Jerusalem”), returned with in 1:16, and given as the reason in 10:6, set side by side"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng"
    quote: "how long wilt thou not have mercy on Jerusalem and on the cities of Judah"
  - where: "section “Returned with mercies”"
    claim: "Connection made by this page: 1:16 “I am returned to Jerusalem with mercies,” set beside the plea of 1:12 and the reason of 10:6"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng"
    quote: "I am returned to Jerusalem with mercies"
  - where: "section “Returned with mercies”"
    claim: "1:16 has the noun raḥămîm (H7356); 7:9 has the same noun (occurrences.mjs zechariah mercy mercies: 1:12, 1:16, 7:9, 10:6)"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml"
    quote: "בְּֽ/רַחֲמִ֔ים"
  - where: "section “Returned with mercies”"
    claim: "7:9: “shew mercy and compassions every man to his brother,” the people’s duty to each other"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/zech/7?lang=eng"
    quote: "Execute true judgment, and shew mercy and compassions every man to his brother"
  - where: "section “Returned with mercies”"
    claim: "The call to turn is dated the eighth month (1:1)"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng"
    quote: "In the eighth month, in the second year of Darius"
  - where: "section “Returned with mercies”"
    claim: "The vision is dated the eleventh month (1:7)"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng"
    quote: "Upon the four and twentieth day of the eleventh month"
  - where: "section “I will bring them again”"
    claim: "9:12 “I will render double” is the Hiphil (causative) of šûb; the people’s “Turn you” is the imperative (hebrew.mjs zechariah 9:12)"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml"
    quote: "אָשִׁ֥יב"
  - where: "section “I will bring them again”"
    claim: "10:6 “I will bring them again” is the Hiphil of šûb (hebrew.mjs zechariah 10:6)"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml"
    quote: "וְ/הֽוֹשְׁבוֹתִי/ם֙"
  - where: "section “I will bring them again”"
    claim: "10:10 “I will bring them again” is the Hiphil of šûb (hebrew.mjs zechariah 10:10)"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml"
    quote: "וַ/הֲשִֽׁיבוֹתִי/ם֙"
  - where: "section “His hand brought back”"
    claim: "13:7’s last clause is the Hiphil (causative) of šûb, the stem of 10:6 and 10:10, not the Qal of 1:3 (hebrew.mjs zechariah 13:7)"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml"
    quote: "וַ/הֲשִׁבֹתִ֥י"
  - where: "section “His hand brought back”"
    claim: "Connection made by this page: the last clause of the sword’s verse, “I will turn mine hand upon the little ones,” set beside “I will bring them again” (10:6, 10:10), the same causative verb"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng"
    quote: "Awake, O sword, against my shepherd, and against the man that is my fellow, saith the LORD of hosts: smite the shepherd, and the sheep shall be scattered: and I will turn mine hand upon the little ones."
  - where: "section “His hand brought back”"
    claim: "The Church’s footnote on 13:7 “scattered” sends to Zech. 10:9"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng"
    quote: "“scattered”: Zech. 10:9."
  - where: "section “His hand brought back”"
    claim: "Keil: the bringing back of the hand is to be understood in a good sense; the Lord soon brought back His hand over the disciples"
    key: ot-manual-33
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng"
    quote: "But the Lord soon brought back His hand over the disciples. The promise, ‘But after my resurrection I will go before you into Galilee,’ is a practical exposition of the bringing back of the hand over the small ones, which shows that the expression is to be understood here in a good sense"
  - where: "section “His hand brought back”"
    claim: "Keil joins 13:7 to 13:9"
    key: keil-zechariah
    url: "https://biblehub.com/commentaries/kad/zechariah/13.htm"
    quote: "Zechariah 13:9 shows how the bringing back of the hand upon the small ones will be realized in the remnant of the nation."
  - where: "section “Before They Had Finished Turning”"
    claim: "Jesus Christ and Jehovah are the same person"
    key: olmstead-saviors-use
    url: "https://www.churchofjesuschrist.org/study/ensign/2002/07/the-saviors-use-of-the-old-testament?lang=eng"
    quote: "Jesus Christ and Jehovah, the Lord God of the Old Testament, are, in fact, the same person"
  - where: "section “Before They Had Finished Turning”"
    claim: "The Shepherd of Israel is Jesus Christ"
    key: ot-manual-33
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng"
    quote: "The Shepherd of Israel is Jesus Christ."
  - where: "section “Before They Had Finished Turning”"
    claim: "Keil: the 13:7 promise began to be fulfilled in the gathering of the disciples by the risen Saviour"
    key: ot-manual-33
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng"
    quote: "it began to be fulfilled in the gathering together of the disciples by the risen Saviour"
  - where: "section “Before They Had Finished Turning”"
    claim: "Jesus quoted the verse “this night” and promised Galilee (Matt. 26:31–32)"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng"
    quote: "Then saith Jesus unto them, All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep of the flock shall be scattered abroad."
  - where: "section “Before They Had Finished Turning”"
    claim: "Jesus Christ will reign as “king over all the earth” (14:9)"
    key: scripture-helps-hag-1-2
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng"
    quote: "Jesus Christ will reign as “king over all the earth.”"
  - where: "section “Before They Had Finished Turning”"
    claim: "Keil on 1:3: Jehovah had already turned to the people"
    key: keil-zechariah
    url: "https://biblehub.com/commentaries/kad/zechariah/1.htm"
    quote: "So had Jehovah also turned to the people again, and had not only put an end to the sufferings of exile"
  - where: "section “Where this reaches now”"
    claim: "D&C 88:63 is the Church’s footnote 3a at Zech. 1:3"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng"
    quote: "“Turn”: D&C 88:63."
  - where: "section “Where this reaches now”"
    claim: "D&C 101:7: the Saints slow to hearken; the Lord slow to hearken"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng"
    quote: "They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers, to answer them in the day of their trouble."
  - where: "section “Where this reaches now”"
    claim: "Connection made by this page: D&C 101:7–9 “slow to hearken… I will not utterly cast them off” set beside Zech. 1:4, 7:11–13 (“would not hear”) and 10:6 (“as though I had not cast them off”)"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng"
    quote: "I will not utterly cast them off; and in the day of wrath I will remember mercy."
  - where: "section “Where this reaches now”"
    claim: "Connection made by this page: D&C 88:63 “I will draw near unto you,” set beside Zech. 1:3 “I will turn unto you”"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng"
    quote: "Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me"
  - where: "section “One verb, two sides”"
    claim: "Keil on 1:3: the more thoroughly the people turn, the more He gives"
    key: keil-zechariah
    url: "https://biblehub.com/commentaries/kad/zechariah/1.htm"
    quote: "but the more earnestly and the more thoroughly the people turned to Him, the more faithfully and the more gloriously would He bestow upon them"
