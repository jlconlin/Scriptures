page: i-am-returned-with-mercies
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Zech. 1:3 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'Turn ye unto me, saith the Lord of hosts, and I will turn unto you, saith the Lord of hosts.'
  - where: 'opening'
    claim: 'Zech. 1:3 has šûb (H7725) in both halves: Qal imperative 2mp for the people, Qal imperfect 1cs for the Lord (hebrew.mjs zechariah 1:3)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'וְ/אָשׁ֣וּב'
  - where: 'opening'
    claim: 'Mal. 3:7 has the same sentence: Qal imperative of šûb to the people, Qal cohortative of šûb for the Lord (hebrew.mjs malachi 3:7). The two-clause formula in the Lord''s own voice, first person (“unto me … unto you”), with the same verb on both sides, occurs in the Old Testament only at Zech. 1:3 and Mal. 3:7; 2 Chr. 30:6 has šûb on both sides in the third person (occurrences.mjs all "return unto me" / "turn unto you" / "return unto you"; Ezek. 36:9 “I will turn unto you” is pānâ, H6437)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'וְ/אָשׁ֣וּבָה'
  - where: 'opening'
    claim: 'Mal. 3:7 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng'
    quote: 'Return unto me, and I will return unto you, saith the Lord of hosts.'
  # ---------- section “Turn ye unto me, and I will turn unto you” ----------
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Zech. 1:3: the people''s “Turn ye” is a Qal imperative; the Lord''s “I will turn” a Qal imperfect (hebrew.mjs zechariah 1:3)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'שׁ֣וּבוּ'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Zech. 1:4 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'Turn ye now from your evil ways, and from your evil doings: but they did not hear, nor hearken unto me, saith the Lord.'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Zech. 1:6 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'and they returned and said, Like as the Lord of hosts thought to do unto us, according to our ways, and according to our doings, so hath he dealt with us.'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: '“They returned” in 1:6 is the Qal of šûb, the verb of 1:3 and 1:4 (hebrew.mjs zechariah 1:6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'וַ/יָּשׁ֣וּבוּ'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Cambridge: 1:6 “returned” should be “turned,” as in 1:3–4; the fathers were brought at last to do what they had refused to do (1:4), and what the hearers are now asked to do (1:3)'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/1.htm'
    quote: 'returned] Rather turned, as the word is rendered in Zechariah 1:3-4. They were brought at last to do, what before they had refused to do, Zechariah 1:4, and what you are now intreated to be wise in time to do, Zechariah 1:3'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Keil on 1:6: the fathers, overtaken by the prophets'' threats, were obliged to confess that God had done what He threatened'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'The words and decrees of God uttered by the prophets did reach the fathers, so that they were obliged to confess that God had really done to them what He threatened, i.e., had carried out the threatened punishment.'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'The Student Manual (33-3) prints Keil''s reading of 1:6'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The words and decrees of God uttered by the prophets did reach the fathers, so that they were obliged to confess that God had really done to them what He threatened'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: '2 Chr. 30:6 as quoted: the Lord''s return follows the people''s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/30?lang=eng'
    quote: 'turn again unto the Lord God of Abraham, Isaac, and Israel, and he will return to the remnant of you'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Deut. 30:2 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'And shalt return unto the Lord thy God, and shalt obey his voice'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Deut. 30:3 as quoted: the Lord''s return is stated after the people''s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'That then the Lord thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Pulpit on 1:3: God promises His favour on their repentance; it cites Mal. 3:7 and 2 Chr. 30:6'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/1.htm'
    quote: 'And I will turn (return) unto you (Malachi 3:7). God promises his favour on their repentance and better conduct'
  - where: 'section “Turn ye unto me, and I will turn unto you”'
    claim: 'Pulpit on 1:3 sends the reader to 2 Chr. 30:6'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/1.htm'
    quote: 'They were called now to attend to the pure worship of the Lord, as the sole condition of prosperity (comp. 2 Chronicles 30:6; James 4:8).'
  # ---------- section “I am returned to Jerusalem with mercies” ----------
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Zech. 1:1 and 1:7 as quoted (eighth month; twenty-fourth day of the eleventh month)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'Upon the four and twentieth day of the eleventh month, which is the month Sebat, in the second year of Darius'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'The visions came three months after the call to repentance of 1:1–6'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/1.htm'
    quote: 'It was three months since Zechariah had uttered the call to repentance with which his Book opens (Zechariah 1:1)'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Zech. 1:12 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'how long wilt thou not have mercy on Jerusalem and on the cities of Judah, against which thou hast had indignation these threescore and ten years?'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Zech. 1:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'And the Lord answered the angel that talked with me with good words and comfortable words.'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Zech. 1:16 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'Therefore thus saith the Lord; I am returned to Jerusalem with mercies: my house shall be built in it'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Keil: the “Therefore” of 1:16 rests on the Lord''s jealous love and His anger at the nations (1:14–15); the perfect describes the return as already begun and continuing'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'Therefore (lâkhēn, Zechariah 1:16), because Jehovah is jealous with love for His people, and very angry with the heathen, He has now turned with compassion towards Jerusalem. The perfect שׁבתּי is not purely prophetic, but describes the event as having already commenced, and as still continuing.'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Cambridge: “Therefore” in 1:16 means because the Lord is jealous for His people and angry with their enemies'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/1.htm'
    quote: '16. Therefore] because I am thus jealous for my people and angry with their enemies.'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Pulpit: “Therefore” in 1:16 is because God loved His people and was incensed with the heathen; “I am returned” is according to the promise in 1:3'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/1.htm'
    quote: 'Therefore. Because God loved his people and was incensed with the heathen. I am returned; I return. According to the promise in ver. 3 (see note on Zechariah 8:3).'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: '“I am returned” in 1:16 is šabtî, Qal perfect 1cs of šûb (hebrew.mjs zechariah 1:16)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'שַׁ֤בְתִּי'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Barnes on 1:16: God says “I am returned” although the effects of His return were yet to come'
    key: barnes-zechariah
    url: 'https://biblehub.com/commentaries/barnes/zechariah/1.htm'
    quote: '"I am returned," God says, although the effects of His return were yet to come.'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Cambridge: the visions unfold God''s purposes of mercy on the basis of the repentance the people were proving by rebuilding the temple'
    key: cambridge-zechariah
    url: 'https://biblehub.com/commentaries/cambridge/zechariah/1.htm'
    quote: 'On the basis of the repentance, of which the people were giving practical proof in their honest endeavours to rebuild the Temple'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Barnes on 1:3: in some degree the people had turned (renewing the temple work under Haggai); a more inward, more complete turning was needed'
    key: barnes-zechariah
    url: 'https://biblehub.com/commentaries/barnes/zechariah/1.htm'
    quote: 'In some degree they had turned to God, for whose sake they had returned to their land; and again when, after some negligence Haggai 1:2-11, they renewed the building of the temple'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Barnes on 1:3: “a more inward, more complete turning” was needed'
    key: barnes-zechariah
    url: 'https://biblehub.com/commentaries/barnes/zechariah/1.htm'
    quote: 'But there needed yet a more inward, more complete turning, whereon God promises a yet nearer presence'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Keil on 1:3: the people''s return was not perfect, and the Lord had already turned to the people again'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'simply that the return to the Lord was not a perfect one, not a thorough conversion of heart. So had Jehovah also turned to the people again'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Connection made by this page: read against 1:3, 1:16 shows the Lord turning before His people''s turning is complete. The promise made the Lord''s turning depend on the people''s; three months later, with the people''s turning begun but not yet complete (Keil, Barnes, Cambridge), the Lord answers the plea of 1:12 and gives His own jealous love (1:14–15) as the ground, not a finished repentance, saying in the perfect that His return has already begun. Pulpit and Cambridge read 1:16 as the promise of 1:3 kept on a begun repentance; the page''s reading rests on the stated ground and the perfect tense. Keil (the Lord had turned though the people''s return was imperfect) and Barnes (“I am returned” before its effects) are the nearest sources'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/1?lang=eng'
    quote: 'I am returned to Jerusalem with mercies'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Zech. 8:3 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'I am returned unto Zion, and will dwell in the midst of Jerusalem'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: '“I am returned” in 8:3 is šabtî, Qal perfect 1cs, as in 1:16 (hebrew.mjs zechariah 8:3)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'שַׁ֚בְתִּי'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Zech. 8:14–15 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'So again have I thought in these days to do well unto Jerusalem and to the house of Judah: fear ye not.'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Zech. 8:14 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'As I thought to punish you, when your fathers provoked me to wrath, saith the Lord of hosts, and I repented not:'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'The KJV “again” of 8:15 is šabtî, Qal perfect 1cs of šûb (H7725), followed by zāmamtî (H2161), “I have purposed” (hebrew.mjs zechariah 8:15)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'זָמַ֨מְתִּי֙'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: '“I thought” in 8:14 is zāmamtî (H2161), the verb of 8:15 (hebrew.mjs zechariah 8:14)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'זָמַמְ֜תִּי'
  - where: 'section “I am returned to Jerusalem with mercies”'
    claim: 'Pulpit on 8:11: God''s attitude had already changed in consequence of the people''s diligence in the work of restoration'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/8.htm'
    quote: 'God''s attitude towards the people had already changed in consequence of their diligence in the work of restoration.'
  # ---------- section “I will bring them again” ----------
  - where: 'section “I will bring them again”'
    claim: 'Zech. 9:12 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/9?lang=eng'
    quote: 'Turn you to the strong hold, ye prisoners of hope: even to day do I declare that I will render double unto thee;'
  - where: 'section “I will bring them again”'
    claim: '9:12: the people''s “Turn you” is the Qal imperative 2mp of šûb; the Lord''s “I will render” is the Hiphil imperfect 1cs, “I will cause to return” (hebrew.mjs zechariah 9:12)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'אָשִׁ֥יב'
  - where: 'section “I will bring them again”'
    claim: 'Zech. 10:10 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'I will bring them again also out of the land of Egypt, and gather them out of Assyria'
  - where: 'section “I will bring them again”'
    claim: '“I will bring them again” in 10:10 is the Hiphil perfect 1cs of šûb with suffix (hebrew.mjs zechariah 10:10)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'וַ/הֲשִֽׁיבוֹתִי/ם֙'
  - where: 'section “I will bring them again”'
    claim: 'Zech. 13:7 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: 'and I will turn mine hand upon the little ones.'
  - where: 'section “I will bring them again”'
    claim: '“I will turn” in 13:7 is the Hiphil perfect 1cs of šûb (waw-consecutive), with “mine hand” as object (hebrew.mjs zechariah 13:7)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'וַ/הֲשִׁבֹתִ֥י'
  - where: 'section “I will bring them again”'
    claim: 'The Lord is the subject of šûb seven times in the book (setting aside the disputed 10:6): Qal at 1:3, 1:16, 8:3, 8:15; Hiphil at 9:12, 10:10, 13:7 (hebrew.mjs on each of the 16 verses with H7725; the other occurrences have the people, the fathers, the prophet, the angel or travelers as subject)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'שַׁ֤בְתִּי'
  - where: 'section “I will bring them again”'
    claim: 'The OSHB tags 10:6 wĕhôšabtîm as a Hiphil of šûb (H7725) (hebrew.mjs zechariah 10:6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'וְ/הֽוֹשְׁבוֹתִי/ם֙'
  - where: 'section “I will bring them again”'
    claim: 'BDB lists 10:6 under yāšab (“dwell”), Hiphil, as probably a text error for the form of 10:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/3427.htm'
    quote: 'Zechariah 10:6 (Köi, 413; but probably text error, see Thes and GesLgb 464; read probably וַהֲשִׁבוֺתִים as Zechariah 10:10'
  - where: 'section “I will bring them again”'
    claim: 'Keil reads 10:6 as “I make them dwell,” a Hiphil of yāšab, not of šûb'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/10.htm'
    quote: 'and is the hiphil of ישׁב for הושׁבתּים (lxx, Maurer, Hengstenberg; comp. Olshausen, Grammat. p. 559), and not a hiphil of שׁוּב'
  - where: 'section “I will bring them again”'
    claim: 'Pulpit on 10:6: one Hebrew word, “I bring them again” or “I make them dwell”; the AV unwarrantably combines both'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/10.htm'
    quote: 'This is one word in Hebrew, which may mean either "I bring them again," or "I make them dwell." The Authorized Version unwarrantably combines both significations.'
  - where: 'section “I will bring them again”'
    claim: 'Zech. 10:6 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'for I have mercy upon them: and they shall be as though I had not cast them off: for I am the Lord their God, and will hear them.'
  - where: 'section “I will bring them again”'
    claim: '“I have mercy upon them” in 10:6 is riḥamtîm, Piel of rāḥam (H7355); 1:12 “have mercy” is tĕraḥēm, the same verb (hebrew.mjs zechariah 10:6; 1:12)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'רִֽחַמְתִּ֔י/ם'
  - where: 'section “I will bring them again”'
    claim: '1:12 tĕraḥēm (H7355)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'תְרַחֵ֣ם'
  - where: 'section “I will bring them again”'
    claim: 'BDB lists Zech. 1:12 and 10:6 together under the Piel of rāḥam, “usually of God”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7355.htm'
    quote: 'Micah 7:19; Zechariah 1:12; Zechariah 10:6; Psalm 102:14'
  - where: 'section “I will bring them again”'
    claim: 'Zech. 10:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'they shall remember me in far countries; and they shall live with their children, and turn again.'
  - where: 'section “I will bring them again”'
    claim: 'The Church''s footnote 10:9b (“remember”) sends to Deut. 30:2 (1–3) (footnotes.mjs zechariah 10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/10?lang=eng'
    quote: 'And I will sow them among the people: and they shall remember me in far countries'
  - where: 'section “I will bring them again”'
    claim: 'Lam. 5:21 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/5?lang=eng'
    quote: 'Turn thou us unto thee, O Lord, and we shall be turned'
  - where: 'section “I will bring them again”'
    claim: 'Lam. 5:21 “Turn thou us” is the Hiphil imperative of šûb, the causative stem (hebrew.mjs lamentations 5:21)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'הֲשִׁיבֵ֨/נוּ'
  # ---------- section “They shall call on my name, and I will hear them” ----------
  - where: 'section “They shall call on my name, and I will hear them”'
    claim: 'Zech. 7:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/7?lang=eng'
    quote: 'as he cried, and they would not hear; so they cried, and I would not hear, saith the Lord of hosts:'
  - where: 'section “They shall call on my name, and I will hear them”'
    claim: 'Pulpit on 7:13: rather, “so they shall cry, and I will not hear”'
    key: pulpit-zechariah
    url: 'https://biblehub.com/commentaries/pulpit/zechariah/7.htm'
    quote: 'So they cried, and I would not hear; rather, so they shall cry, and I will not hear.'
  - where: 'section “They shall call on my name, and I will hear them”'
    claim: 'Keil on 7:13: a divine talio; as they did not hearken, God will not hear when they call in distress'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/7.htm'
    quote: 'The infliction of the punishment is expressed in Zechariah 7:13 in the form of a divine talio. As they have not hearkened to the word of God, so will God, when they call upon Him, namely in distress'
  - where: 'section “They shall call on my name, and I will hear them”'
    claim: 'Zech. 13:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/13?lang=eng'
    quote: 'they shall call on my name, and I will hear them: I will say, It is my people: and they shall say, The Lord is my God.'
  - where: 'section “They shall call on my name, and I will hear them”'
