  # ---------- section “After I am risen again, I will go before you” ----------
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Jesus Christ and Jehovah, the Lord God of the Old Testament, are the same person'
    key: olmstead-saviors-use
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/07/the-saviors-use-of-the-old-testament?lang=eng'
    quote: 'And since Jesus Christ and Jehovah, the Lord God of the Old Testament, are, in fact, the same person, when Jesus quoted the words of the prophets He was often actually quoting Himself!'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Scripture Helps: Zechariah 9–14 are prophecies concerning the ministry of Jesus Christ and the Second Coming'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah 9–14: Prophecies concerning the ministry of Jesus Christ and the events surrounding the last days and the Savior’s Second Coming.'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Student Manual 33-46: the Shepherd of Israel (13:7) is Jesus Christ'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The Shepherd of Israel is Jesus Christ.'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Matt. 26:31 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep of the flock shall be scattered abroad.'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Matt. 26:32 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'But after I am risen again, I will go before you into Galilee.'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Keil on 13:7: to bring back the hand over a person is to make him the object of active care once more, here in the good sense (Isa. 1:25)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'i.e., make him the object of his active care once more, is used to express the employment of the hand upon a person either for judgment or salvation. It occurs in the latter sense in Isaiah 1:25'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'The Student Manual (33-46) prints Keil: the disciples fled when Jesus was taken; the Lord soon brought back His hand over them; the promise of Galilee is a practical exposition of 13:7''s last clause'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The offending of the disciples took place when Jesus was taken prisoner, and they all fled. This flight was a prelude to the dispersion of the flock at the death of the shepherd. But the Lord soon brought back His hand over the disciples.'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'The Student Manual (33-46), printing Keil: the promise of Galilee is a practical exposition of the bringing back of the hand'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The promise, ‘But after my resurrection I will go before you into Galilee,’ is a practical exposition of the bringing back of the hand over the small ones'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Keil: 13:8–9 show how the bringing back of the hand is realized in the remnant of the nation'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/13.htm'
    quote: 'Zechariah 13:9 shows how the bringing back of the hand upon the small ones will be realized in the remnant of the nation.'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Connection made by this page: the night of Matt. 26:31–32 shows the order of Zech. 1:3 and 1:16 in small. The smitten Shepherd is the Lord of the opening promise, turning before His people''s turning is complete: the promise of Galilee, the bringing back of the hand (Keil, in the Student Manual), is given first, before the disciples flee, so the scattered little ones are gathered by a turning He began before theirs. Keil reads the hand''s return as fulfilled in the gathering of the disciples; joining it to 1:3 and 1:16 is the page''s own'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'But after I am risen again, I will go before you into Galilee.'
  - where: 'section “After I am risen again, I will go before you”'
    claim: 'Barnes on 1:14: God pursues the sinner in love; but for His love and grace, while the sinner is yet impenitent, he could not turn'
    key: barnes-zechariah
    url: 'https://biblehub.com/commentaries/barnes/zechariah/1.htm'
    quote: 'He pursues the sinner with chastisements and scourges in His love, that he may yet be converted and live . But for God''s love to him and the solicitations of His grace, while yet impenitent and displeasing Him, he could not turn and please Him.'
