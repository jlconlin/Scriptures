  - where: 'section “They shall call on my name, and I will hear them”'
    claim: 'Connection made by this page: Zech. 13:9 reverses 7:13. The fathers'' cry that the Lord would not hear (7:13) becomes the third part''s call that He hears (13:9). The verb of calling is the same (qārāʾ); the verb of hearing differs (7:13 šāmaʿ, 13:9 ʿānâ, “answer”), so the join rests on the calling verb and the sense. ʿĀnâ is the verb of the Lord''s answering at 1:13, 10:6 and 13:9, against the one refusal of 7:13. No source read joins 13:9 to 7:13'
