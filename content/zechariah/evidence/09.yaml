chapter: 9
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Zechariah prophesied 520–518 B.C.; chapters 9–14 are the second division of his book'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.). The book of Zechariah has two divisions'

  # ---- setting ----
  - where: 'setting'
    claim: 'The headings of 9–14 have no date and no prophet’s name'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'The last two oracles, which are connected together by the common epithet massȧ'', are distinguished from the first two announcements not only by the fact that the headings contain neither notices as to the time, nor the prophet''s name'
  - where: 'setting'
    claim: 'Chapters 9–11 and 12–14 are two corresponding oracles with the same heading'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'they are two corresponding portions of a greater whole. In the headings, the fact that they have both the common character of a threatening prophecy or proclamation of judgment, is indicated by the application of the same epithet, Massâ'' debhar Yehōvâh'
  - where: 'setting'
    claim: 'Modern critics have challenged the unity of the book'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'the objection which modern critics have offered to the unity of the book has arisen, not from the nature of the last two longer oracles (ch. 9-14)'
  - where: 'setting'
    claim: 'An older commentary defends one author: a missing name no more disproves authorship than in Isaiah’s oracles'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/1.htm'
    quote: 'The omission of the name of the author from the headings no more disproves the authorship of the Zechariah who lived after the captivity, than the omission of the name from Isaiah 15:1; Isaiah 17:1; Isaiah 19:1, disproves Isaiah''s authorship'
  - where: 'setting'
    claim: 'A Latter-day Saint commentator reads 9:13’s Greece as a sign of a later or updated text'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'A clear indication that this is either a later text or was updated to reflect a future time is the reference to Greece.'
  - where: 'setting'
    claim: 'The Bible Dictionary describes 9–14 as prophecies of the Messiah and the events before the Second Coming'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 9–14, prophecies about the Messiah and events preceding His Second Coming.'
  - where: 'setting'
    claim: 'Scripture Helps treats the prophecies as revealed through Zechariah'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The Lord revealed through Zechariah many prophecies about the Messiah and the events preceding His Second Coming.'
  - where: 'setting'
    claim: 'In D&C 45 Jesus cites Zechariah’s prophecies of the Day of the Lord'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'One additional Old Testament prophet cited—but not named—in this revelation is Zechariah. Jesus especially refers to three passages from this prophet that likewise refer to the Day of the Lord and the Savior’s ultimate triumph'
  - where: 'setting'
    claim: 'D&C 45 takes up Zechariah 13:6'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'The Lord then refers to another prophecy in Zechariah 13. While Zechariah 13:6 was originally a part of a larger prophecy referring to the end of false prophets'
  - where: 'setting'
    claim: 'D&C 45 takes up Zechariah 14:4 (the passages set side by side)'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'half of the mountain shall remove toward the north, and half of it toward the south. (14:4)'
  - where: 'setting'
    claim: 'The horizon: judgment on the nations, a King of peace over the whole earth, captives redeemed'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'cause His King to enter Zion, who will establish a kingdom of peace over the whole earth (Zechariah 9:8-10). Those members of the covenant nation who are still in captivity are redeemed'

  # ---- thread ----
  - where: 'thread'
    claim: 'The chapter moves from judgment on the neighbours (1–7) to the King’s entry (8–10) to captives redeemed and victory (11–17)'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'Whilst the judgment falls upon the land of Hadrach, upon Damascus and Hamath, and upon Phoenicia and Philistia … (Zechariah 9:1-7), Jehovah will protect His people, and cause His King to enter Zion, who will establish a kingdom of peace over the whole earth (Zechariah 9:8-10).'
  - where: 'thread'
    claim: 'With the neighbours defeated, the king returns to Jerusalem'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'With the surrounding nation-states defeated and the Lord’s army at the temple as depicted in the previous verses, the king of Jerusalem was prepared to return to the city.'

  # ---- note 9:1 ----
  - where: 'note 9:1 “The nations on Israel’s border”'
    claim: 'Hadrach is a territory named only here, perhaps a district near Damascus and Hamath known from Assyrian records'
    key: bdb
    url: 'https://biblehub.com/hebrew/2317.htm'
    quote: 'proper name, of a territory only Zechariah 9:1 … perhaps = Assyrian –atarakka, –atari(k)ka, a district near Damascus and Hamath'
  - where: 'note 9:1 “The nations on Israel’s border”'
    claim: 'The cities border Israel: Syria, Phoenicia, Philistia'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'The cities mentioned in this passage border the land of Israel. Damascus (Syria) would be at rest, or would cause no threat. Tyrus and Zidon (Phoenicia) would lose its strength and wealth.'
  - where: 'note 9:1 “The nations on Israel’s border”'
    claim: 'Many read 9:1–8 as fulfilled by Alexander in about 332 B.C.; the meaning is broader'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Many Bible scholars interpreted these verses as having been fulfilled at the time of Alexander the Great. It is true that Alexander the Great in approximately 332 B.C. destroyed these cities with his army. But the meaning of these verses is broader than that.'
  - where: 'note 9:1 “The nations on Israel’s border”'
    claim: 'With the nations defeated, the king comes to Jerusalem'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'With the surrounding nation-states defeated and the Lord’s army at the temple as depicted in the previous verses, the king of Jerusalem was prepared to return to the city.'

  # ---- note 9:6 ----
  - where: 'note 9:6 ““A bastard”: a mixed people”'
    claim: 'mamzer is literally a bastard in Deut. 23; in Zech. 9:6 perhaps a figurative collective for a mixed population; LXX “aliens”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4464.htm'
    quote: '1 literally bastard, Deuteronomy 23:3 (see Dr). … 2 perhaps figurative collective, of mixed population Zechariah 9:6 ᵐ5 ἀλλογενεῖς'
  - where: 'note 9:6 ““A bastard”: a mixed people”'
    claim: 'The Septuagint reads “aliens shall dwell in Azotus”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/zechariah/9.htm'
    quote: 'And aliens shall dwell in Azotus, and I will bring down the pride of the Philistines.'

  # ---- note 9:7 ----
  - where: 'note 9:7 “A Philistine remnant for Israel’s God”'
    claim: 'The blood and abominations are idolatrous sacrifices; removing them means the end of idolatry'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'Dâmı̄m is not human blood, but the blood of sacrifices; and shiqqutsı̄m, abominations, are not the idols, but the idolatrous sacrifices, and indeed their flesh. Taking away the food of the idolatrous sacrifices out of their mouth denotes … the abolition of idolatry generally.'
  - where: 'note 9:7 “A Philistine remnant for Israel’s God”'
    claim: 'A remnant of the Philistines will be left for Israel’s God, as Israel has a remnant'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'Just as in the case of Israel a "remnant" of true confessors of Jehovah is left when the judgment falls upon it, so also will a remnant of the Philistines be left for the God of Israel.'
  - where: 'note 9:7 “A Philistine remnant for Israel’s God”'
    claim: '“Governor” is the head of one of the families of a tribe'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'It signifies literally not a phylarch, the head of an entire tribe (matteh, φυλή), but a chiliarch, the head of an ''eleph, one of the families into which the tribes were divided.'
  - where: 'note 9:7 “A Philistine remnant for Israel’s God”'
    claim: 'The Jebusites were incorporated into Israel, as Araunah shows'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'stands for the former inhabitants of the citadel of Zion, who adopted the religion of Israel after the conquest of this citadel by David, and were incorporated into the nation of the Lord. This is evident from the example of the Jebusite Araunah'
  - where: 'note 9:7 “A Philistine remnant for Israel’s God”'
    claim: 'Another reading: the Philistines defeated like the Jebusites'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Ashkelon, Gaza, Ekron, and Ashdod (Philistia) would fear their doom, being left without a king and defeated like the Jebusites (see 2 Samuel 5:6–10).'

  # ---- note 9:9 King ----
  - where: 'note 9:9 “The King who comes lowly”'
    claim: 'Jesus fulfilled the prophecy with His triumphal entry'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Jesus Christ fulfilled this prophecy with His triumphal entry into Jerusalem during the last week of His mortal ministry.'
  - where: 'note 9:9 “The King who comes lowly”'
    claim: 'Jesus initiated the fulfillment by sending for the animals'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'What is noteworthy here is that Jesus is the one who initiates the fulfillment of the prophecy. He is the one who requests that the animals be brought'
  - where: 'note 9:9 “The King who comes lowly”'
    claim: 'In Zechariah the king’s humility is underscored by his arrival on a donkey, not a stallion'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'one whose humility is underscored by the mode of his arrival. A triumphant king may be expected to arrive on the back of a stallion, but this one arrives riding upon a donkey.'
  - where: 'note 9:9 “The King who comes lowly”'
    claim: 'Elder Soares: the donkey was considered in literature an ancient symbol of Jewish royalty'
    key: soares-prince-of-peace
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/43soares?lang=eng'
    quote: 'riding upon a donkey, which was considered in literature an “ancient symbol of Jewish royalty,” as indeed befitted the King of kings and Prince of Peace.'
  - where: 'note 9:9 “The King who comes lowly”'
    claim: 'Royalty and high officials rode on donkeys'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Horses were symbols of war (see Zechariah 9:10; see also Haggai 2:22), but royalty and high officials rode on donkeys.'
  - where: 'note 9:9 “The King who comes lowly”'
    claim: 'The Messiah would come in humility, riding on a donkey'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah prophesied of a future King—the Messiah—who would come to Jerusalem in humility, riding on a donkey.'
  - where: 'note 9:9 “The King who comes lowly”'
    claim: 'ʿānî: poor, afflicted; in 9:9 humble, lowly, of a victorious king'
    key: bdb
    url: 'https://biblehub.com/hebrew/6041.htm'
    quote: '4 humble, lowly, Zechariah 9:9 (victorious king)'

  # ---- note 9:9 colt ----
  - where: 'note 9:9 “One donkey or two”'
    claim: 'Zechariah’s parallelism refers to one donkey; Matthew chose to portray two to show the foal is young; Mark and Luke’s unridden colt may support this'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Both Zechariah’s original and the Genesis passage, using the poetic feature of synonymous parallelism, actually refer to only one donkey. However, even though Matthew understood this literary technique, he nonetheless chose to portray two to emphasize by the mother’s presence that the foal is young.'
  - where: 'note 9:9 “One donkey or two”'
    claim: 'Mark and Luke may support it with the unridden donkey'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Mark and Luke may support this when they add that Jesus specifically requests a donkey that had never been ridden (Mark 11:2; Luke 19:30)'
  - where: 'note 9:9 “One donkey or two”'
    claim: 'Some scholars question whether Matthew misread the parallelism'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'The question of how many animals Jesus actually rode upon (one or two) has been the topic of much debate among scholars, some of who question whether or not Matthew misread the synonymous parallelism in Zechariah 9:9.'

  # ---- note 9:11 ----
  - where: 'note 9:11 “Prisoners out of the waterless pit”'
    claim: 'In context, 9:11 promises redemption to members of the nation still in captivity'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'He will also redeem such members of His nation as shall be still in captivity out of their affliction.'
  - where: 'note 9:11 “Prisoners out of the waterless pit”'
    claim: 'The waterless pit is a figure of exile, alluding to Joseph in the pit'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/9.htm'
    quote: 'Delivering them out of a pit without water is a figure denoting their liberation out of the bondage of exile. This is represented with an evident allusion to the history of Joseph in Genesis 37:22'
  - where: 'note 9:11 “Prisoners out of the waterless pit”'
    claim: 'Come, Follow Me pairs 9:9–11 with Matthew 21 and 1 Peter 3:18–19'
    key: cfm-ot-2026-50
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/50?lang=eng'
    quote: 'Zechariah 9:9–11 (see Matthew 21:1–11; 1 Peter 3:18–19)'
  - where: 'note 9:11 “Prisoners out of the waterless pit”'
    claim: 'Elder McConkie: the blood of the covenant is the gospel covenant made efficacious by Christ’s blood'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: '‘By the blood of the covenant’—that is, because of the gospel covenant, which is efficacious because of the shedding of the blood of Christ—’I have sent forth thy prisoners out of the pit wherein is no water.’'
  - where: 'note 9:11 “Prisoners out of the waterless pit”'
    claim: 'Elder McConkie: “no water” shows baptism is an earthly ordinance spirits cannot perform'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'the saving water, which is baptism, is an earthly ordinance and cannot be performed by spirit beings while they dwell in the spirit world.'

  # ---- note 9:13 ----
  - where: 'note 9:13 “Greece: Javan”'
    claim: 'Greece is yāwān (H3120)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'יָוָ֑ן'
  - where: 'note 9:13 “Greece: Javan”'
    claim: 'Javan, son of Japheth, regarded as founder of the Greek race; named in Isaiah, Ezekiel, Daniel'
    key: bd-javan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/javan?lang=eng'
    quote: 'Son of Japheth; regarded as the founder of the Greek race (Gen. 10:2, 4; 1 Chr. 1:5, 7; Isa. 66:19; Ezek. 27:13; also Dan. 8:21; 10:20; 11:2; Zech. 9:13).'
  - where: 'note 9:13 “Greece: Javan”'
    claim: 'Correa: Greece shows a later or updated text; Greeks ruled Jews from 333 BC; may reflect the Maccabean Revolt'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'A clear indication that this is either a later text or was updated to reflect a future time is the reference to Greece. The Greeks would not rule over the Jews until 333 BC. This passage (or the entire vision) may reflect the desires of the people during the Maccabean Revolt in the 160s BC'
  - where: 'note 9:13 “Greece: Javan”'
    claim: 'Greece stands for the world; Judah and Ephraim united, defended by the Lord'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'There will come a day when Judah and Ephraim will be one—all Israel will be united. The Lord will defend His people Israel against Greece (the world).'

  # ---- christ ----
  - where: 'christ'
    claim: 'The triumphal entry anticipated His rule at His return, as Zechariah prophesied'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'It was, in a very real way, an anticipation of the future, the actual rule he will usher in at his glorious return, as anticipated in the prophecies of Zechariah.'
  - where: 'christ'
    claim: 'The covenant of 9:11 is made efficacious by Christ’s blood (McConkie)'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'because of the gospel covenant, which is efficacious because of the shedding of the blood of Christ'
  - where: 'christ'
    claim: 'Christ can reign in a life before all evil is defeated'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Today we do not need all evil to be defeated to have Jesus Christ reign in our lives.'
