chapter: 11
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Zechariah prophesied under Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'a contemporary of Haggai (Ezra 5:1; 6:14); prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.).'

  # ---- setting ----
  - where: 'setting'
    claim: 'Chapters 9–14 are prophecies about the Messiah and events preceding the Second Coming'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 9–14, prophecies about the Messiah and events preceding His Second Coming.'
  - where: 'setting'
    claim: 'The Bible Dictionary outlines chapter 11: Lebanon invaded; the prophet commissioned, renounces the task, the flock falls to an evil shepherd'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'The prophet is commissioned to feed the flock destined for slaughter (11:4–8); renounces the thankless task (11:9–14); the flock falls into the hands of an evil shepherd (11:15–17).'
  - where: 'setting'
    claim: 'The details of the scene are not clear'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'This vision is not entirely clear.'
  - where: 'setting'
    claim: 'The Church heading reads the chapter as prophecy of the Messiah betrayed for thirty pieces of silver'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/11?lang=eng'
    quote: 'Zechariah speaks about the Messiah—The Messiah will be betrayed for thirty pieces of silver—They will be cast to the potter in the house of the Lord.'

  # ---- thread ----
  - where: 'setting'
    claim: 'Scripture Helps reads the allegory of 11:7–14 of the Savior''s mortal ministry'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'This allegory points to the Good Shepherd, Jesus Christ. During His mortal ministry, the Savior was rejected by many of those whom He had been sent to shepherd.'
  - where: 'thread'
    claim: 'The chapter is an allegory of a shepherd rejected by his flock'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah 11 presents an allegory in which Zechariah is a shepherd who is ultimately rejected by his flock.'
  - where: 'thread'
    claim: 'Because the flock repays the shepherd with ingratitude, it is given to the foolish shepherd, who also falls under judgment'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'because it repays His pastoral fidelity with ingratitude, gives it up into the hands of the foolish shepherd, who will destroy it, but who will also fall under judgment himself in consequence.'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: 'The “possessors” are those who buy the flock'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'whose purchasers slay them, and bear no blame, and their sellers say, Blessed be Jehovah! I am getting rich, and their shepherds spare them not.'
  - where: 'section 3 plain'
    claim: 'The staves are Favour and Union'
    key: sc-knowhy-56
    url: 'https://scripturecentral.org/knowhy/why-is-there-a-need-for-the-testimony-of-two-nations'
    quote: 'One he called “Beauty” (or Favor) and the other “Bands” (or Union), and with them he fed his flock.'
  - where: 'section 3 plain'
    claim: 'In verse 8 the shepherd grows impatient with the flock, not with the three shepherds'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'the prophet "did not become disgusted with the three shepherds, but with his flock, which he resolved in his displeasure to leave to its fate."'

  # ---- notes ----
  - where: 'note 11:1 “Cedars that fall”'
    claim: 'Lebanon and Bashan were known for their trees; trees symbolized the nations’ pride and glory'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'In the north, areas like Lebanon and Bashan were known for their trees. Judah on the other hand was a desert.[20] Therefore, trees were a symbol of the nations’ pride and glory.'
  - where: 'note 11:1 “Cedars that fall”'
    claim: 'The Bible Dictionary summarizes 11:1–3 as an invasion of Lebanon and the Jordan-land'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: '(c) Invasion of Lebanon and the Jordan-land (11:1–3).'

  - where: 'note 11:4 “The prophet plays the shepherd”'
    claim: 'Zechariah is a shepherd in an allegory, rejected by his flock'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zechariah 11 presents an allegory in which Zechariah is a shepherd who is ultimately rejected by his flock.'
  - where: 'note 11:4 “The prophet plays the shepherd”'
    claim: 'Whether the prophet acted in reality or in vision is not said'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Despite his obedience, Zechariah (whether in reality or in vision) had a conflict with three wicked shepherds and left the sheep to their own demise.'
  - where: 'note 11:4 “The prophet plays the shepherd”'
    claim: 'The slaughterers claimed to be guiltless but were proud of their riches'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Whoever it was, their wickedness is made manifest. They claimed to be guiltless but were prideful in their temporal riches.'

  - where: 'note 11:7 “Favour and Union”'
    claim: 'Noam means delightfulness, pleasantness; it names one of the two staves'
    key: bdb
    url: 'https://biblehub.com/hebrew/5278.htm'
    quote: 'נֹ֫עַם noun masculinePsalm 90:17 delightfulness, pleasantness'
  - where: 'note 11:7 “Favour and Union”'
    claim: 'Chobelim means union, literally binders, the second staff'
    key: bdb
    url: 'https://biblehub.com/hebrew/2256.htm'
    quote: 'חֹבְלִים noun [masculine] plural union (literally binders) name of Zechariah''s second symbolic staff Zechariah 11:7 and with article Zechariah 11:14.'
  - where: 'note 11:7 “Favour and Union”'
    claim: 'The first staff is noam in the Hebrew of verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'נֹ֨עַם֙'
  - where: 'note 11:7 “Favour and Union”'
    claim: 'The second staff is chobelim in the Hebrew of verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'חֹֽבְלִ֔ים'
  - where: 'note 11:7 “Favour and Union”'
    claim: 'The staves are Favor and Union, shepherd’s staffs'
    key: sc-knowhy-56
    url: 'https://scripturecentral.org/knowhy/why-is-there-a-need-for-the-testimony-of-two-nations'
    quote: 'Zechariah 11:7 speaks of the Lord taking “two staves,” or shepherd’s staffs. One he called “Beauty” (or Favor) and the other “Bands” (or Union), and with them he fed his flock.'
  - where: 'note 11:7 “Favour and Union”'
    claim: 'The broken staffs represent the broken covenant and the breakdown of national unity'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The two staffs that Zechariah broke represent the broken covenant between God and His people—and the breakdown of national unity within the house of Israel.'

  - where: 'note 11:8 “Three shepherds in one month”'
    claim: 'The scene is not entirely clear'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'This vision is not entirely clear.'
  - where: 'note 11:8 “Three shepherds in one month”'
    claim: 'Attempts to identify the three as kings of the northern kingdom have failed; only Shallum reigned a full month'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'The attempts of rationalistic commentators to prove that the three shepherds are three kings of the kingdom of the ten tribes, have completely broken down, inasmuch as of the kings Zechariah, Shallu, and Menahem (2 Kings 15:8-14), Shallum alone reigned an entire month'
  - where: 'note 11:8 “Three shepherds in one month”'
    claim: 'The persons are classes, not individuals'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'the persons occurring in this vision are not individuals, but classes of men.'
  - where: 'note 11:8 “Three shepherds in one month”'
    claim: 'Keil reads the three as the imperial rulers from the captivity to Christ'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'not the three classes of Jewish rulers, but the three imperial rulers, in whose power Israel continued from the times of the captivity to the time of Christ.'
  - where: 'note 11:8 “Three shepherds in one month”'
    claim: 'The second half of verse 8 concerns the flock, which the shepherd became disgusted with'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'the prophet "did not become disgusted with the three shepherds, but with his flock, which he resolved in his displeasure to leave to its fate."'

  - where: 'note 11:12 “Valued at thirty pieces of silver”'
    claim: 'Thirty pieces was the price of a slave, a meager price showing how little the people valued the shepherd'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'he was paid 30 pieces of silver—the price of a slave. This was a meager price that reflected how little the people valued the shepherd who had been sent to care for them.'
  - where: 'note 11:12 “Valued at thirty pieces of silver”'
    claim: '“Goodly price” is apparently sarcasm'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The phrase “goodly price” in verse 13 is apparently sarcasm.'
  - where: 'note 11:12 “Valued at thirty pieces of silver”'
    claim: 'The allegory points to the Good Shepherd; Judas betrayed Him for thirty pieces of silver'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'This allegory points to the Good Shepherd, Jesus Christ. During His mortal ministry, the Savior was rejected by many of those whom He had been sent to shepherd. The Apostle Judas Iscariot betrayed the Savior to the chief priests for 30 pieces of silver.'
  - where: 'note 11:12 “Valued at thirty pieces of silver”'
    claim: 'The Church footnote ties verse 12 to the betrayal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/11?lang=eng'
    quote: '12a “thirty”: TG Jesus Christ, Betrayal of.'

  - where: 'note 11:13 “Thrown to the potter”'
    claim: '“Throw to the potter” is apparently a proverbial expression for contempt whose origin cannot be traced'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'The phrase "throw to the potter" (for the use of hishlı̄kh with ''el pers. compare 1 Kings 19:19) is apparently a proverbial expression for contemptuous treatment ( equals to the knacker), although we have no means of tracing the origin of the phrase satisfactorily.'
  - where: 'note 11:13 “Thrown to the potter”'
    claim: 'The verb throw and the contemptuous expression show the money is cast away'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'the verb hishlı̄kh (throw) and the contemptuous expression used in relation to the sum paid down, prove unmistakeably that the words "throw to the potter" denote the actual casting away of the money.'
  - where: 'note 11:13 “Thrown to the potter”'
    claim: 'Earthen pots were of little worth; the potter was in the temple with work or earthenware for the temple kitchens'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'that the potter was in the house of Jehovah when the money was thrown to him; that he had either some work to do there, or that he had come there to bring some earthenware for the temple kitchens'
  - where: 'note 11:13 “Thrown to the potter”'
    claim: 'Earthen pots were things of insignificant worth'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'earthen pots were things of insignificant worth.'
  - where: 'note 11:13 “Thrown to the potter”'
    claim: 'The temple is where the people appear before God; what is done there God calls them to account for'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'The house of Jehovah came into consideration here rather as the place where the people appeared in the presence of their God … What took place in the temple, was done before the face of God, that God might call His people to account for it.'
  - where: 'note 11:13 “Thrown to the potter”'
    claim: 'Because the prophet fed the flock in the Lord''s name, the Lord regards the wages paid to His shepherd as paid to Himself'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'As the prophet fed the flock in the name of Jehovah, Jehovah regards the wages paid to His shepherd as paid to Himself'
  - where: 'note 11:14 “The broken brotherhood”'
    claim: 'Breaking the second staff breaks the brotherhood; the passage looks to Israel’s scattering and then reunion'
    key: sc-knowhy-56
    url: 'https://scripturecentral.org/knowhy/why-is-there-a-need-for-the-testimony-of-two-nations'
    quote: 'While there is no general consensus on the date of this part of the book of Zechariah, it seems to include an early reference to the scattering of Israel and then forward to the reunion and reestablishment of God’s people.'
  - where: 'note 11:14 “The broken brotherhood”'
    claim: 'Ezekiel’s sticks may also symbolize the Lord’s shepherding and rule over the kingdoms'
    key: sc-knowhy-56
    url: 'https://scripturecentral.org/knowhy/why-is-there-a-need-for-the-testimony-of-two-nations'
    quote: 'In addition to symbolizing the records and tribes, the sticks that Ezekiel prophetically uses may also symbolize the ability of the Lord to shepherd and rule over these kingdoms.'
  - where: 'note 11:14 “The broken brotherhood”'
    claim: 'The staves may be associated with Ezekiel’s two sticks; the promise is unity'
    key: ot-minute-zech
    url: 'https://archive.bookofmormoncentral.org/content/old-testament-minute-zechariah'
    quote: 'Perhaps this can be associated with Ezekiel’s vision of the two sticks (Ezekiel 37:17). The promise is that the people would be united in harmony.'
  - where: 'note 11:17 “The worthless shepherd”'
    claim: '“Idol shepherd” is the shepherd of worthlessness, the worthless shepherd; the same word in Job 13:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/457.htm'
    quote: 'Zechariah 11:17 רֹעִי הָאֱלִיל the shepherd of worthlessness = the worthless shepherd, Job 13:4 רֹפְאֵי אֱלִל worthless physicians'
  - where: 'note 11:17 “The worthless shepherd”'
    claim: 'The word of verse 17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'הָֽ/אֱלִיל֙'
  - where: 'note 11:17 “The worthless shepherd”'
    claim: 'An older commentary, printed in the Student Manual, reads the ruler as there by divine appointment, as judgment on a people who rejected the true shepherd'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'He is where he is by divine appointment (v. 16) and the scandalous acts which his wicked heart teaches him to perform are the Lord’s dread judgment on a people which rejected the true shepherd.'

  # ---- christ ----
  - where: 'christ'
    claim: 'The allegory points to the Good Shepherd, rejected by many He was sent to shepherd'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'This allegory points to the Good Shepherd, Jesus Christ. During His mortal ministry, the Savior was rejected by many of those whom He had been sent to shepherd.'
  - where: 'christ'
    claim: 'The shepherd the prophet represents does what only God through His Son did'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/11.htm'
    quote: 'he represents another, who does things in Zechariah 11:8, Zechariah 11:12, and Zechariah 11:13, which in truth neither Zechariah nor any other prophet ever did, but only God through His Son'
