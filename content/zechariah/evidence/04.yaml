chapter: 4
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Zechariah prophesied under Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'a contemporary of Haggai (Ezra 5:1; 6:14); prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.).'

  # ---- setting ----
  - where: 'setting'
    claim: 'Chapter 4 is the fifth vision: a lampstand, a bowl of oil, two olive trees'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: '(f) Zech. 4, fifth vision, a lampstand surmounted by a bowl of oil, which feeds by tubes the seven burning lamps of the lampstand, two olive trees on either side supplying the bowl with oil.'
  - where: 'setting'
    claim: 'The visions followed one another, probably at short intervals'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'After the prophet has seen four visions one after another, probably with very short intervals, and has heard the marvellous interpretation of them'
  - where: 'setting'
    claim: 'By 520 B.C. poverty, political disruption and hostility had halted the work at the foundation; Haggai and Zechariah were raised up; the temple was finished in 515 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'A decade and a half had passed, and work on the temple had not progressed beyond laying the foundation stones. Simply, the weight of poverty, political disruption, animosities, and a backbreaking need to survive brought the construction to a halt'
  - where: 'setting'
    claim: 'The second temple was completed in 515 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'It was under these circumstances that the Lord raised up Haggai and Zechariah to spur on his beleaguered people. … The second temple was completed in 515 BC'
  - where: 'setting'
    claim: 'Zerubbabel, descendant of Jehoiachin, was governor and led the rebuilding'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Zerubbabel was a descendant of King Jehoiachin, who was carried captive into Babylon. Zerubbabel was appointed to be the governor of Judah after the Jews returned from captivity.'
  - where: 'setting'
    claim: 'As chapter 3 turns on Joshua for the priesthood, chapter 4 turns on Zerubbabel for the government'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'Just as, in the previous vision, Joshua is introduced as the representative of the high-priesthood, so here Zerubbabel, the prince of Judah, springing from the family of David, comes into consideration'
  - where: 'setting'
    claim: 'The prophecy gave hope first to those rebuilding the temple in 520 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'the prophecies of Zechariah give hope to the faithful in at least three time periods: to his contemporaries struggling to rebuild the temple in 520 BC'
  - where: 'setting'
    claim: 'John used the same imagery in Revelation 11:4'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The same imagery was used by John in Revelation 11:4.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The tabernacle lampstand was filled daily by the priests; this one is supplied by the olive trees'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'The candlestick of the tabernacle had to be supplied every day with the necessary oil by the hands of the priests.'
  - where: 'thread'
    claim: 'The oil is the Spirit, dispensed through the two anointed ones, Joshua and Zerubbabel'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'The oil is the symbol of the Spirit, through whom, and not by might or power, all Israel’s work and destiny shall be accomplished. This Spirit is dispensed through the two anointed ones (“sons of oil”), representing the priestly and royal rule (Joshua and Zerubbabel).'

  # ---- notes ----
  - where: 'note 4:2 “A lampstand fed by olive trees”'
    claim: 'The candlestick is properly a menorah or lampstand, made for the tabernacle; Zerubbabel’s temple had a single lampstand'
    key: bd-candlestick
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/candlestick?lang=eng'
    quote: '(More properly menorah, or lampstand.) Made for the tabernacle (Ex. 25:31–37; 37:17–24) … In the temple of Zerubbabel there was a single lampstand'
  - where: 'note 4:2 “A lampstand fed by olive trees”'
    claim: 'The visionary candlestick represents the tabernacle’s and adds a gullah, a round vessel for oil, at its top'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'is unquestionably a figurative representation of the seven-branched golden candlestick in the tabernacle, and differs from this only in the three following additions … i.e., a can or round vessel for the oil'
  - where: 'note 4:2 “A lampstand fed by olive trees”'
    claim: 'The tabernacle lampstand was filled daily by priests with oil the people presented; with the two trees it could never lack oil'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'This oil the congregation had to present … If, then, the candlestick had two olive-trees by its side, yielding oil in such copious abundance … it could never fail to have sufficient oil for a full and brilliant light.'
  - where: 'note 4:2 “A lampstand fed by olive trees”'
    claim: 'An older commentary reads the lamps as the people of God shining, as Revelation’s lampstands are churches'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'The burning lamps were a symbol of the church or of the nation of God, which causes the light of its spirit, or of its knowledge of God, to shine before the Lord'
  - where: 'note 4:2 “A lampstand fed by olive trees”'
    claim: 'The same commentary supports this reading from Revelation 1:20, where the seven lampstands are seven churches'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'The correctness of this explanation of the meaning of the candlestick is placed beyond all doubt by Revelation 1:20, where the seven λυχνίαι, which John saw before the throne of God, are explained as being the seven ἐκκλησίαι'
  - where: 'note 4:2 “A lampstand fed by olive trees”'
    claim: 'The Bible Dictionary: the lamps might represent the light shed by or among the people'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'The lamps might represent the light shed by the people or that shed among them.'

  - where: 'note 4:6 “The oil is the Spirit”'
    claim: 'The oil symbolizes the Spirit, by whom, not by might or power, Israel’s work is accomplished'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'The oil is the symbol of the Spirit, through whom, and not by might or power, all Israel’s work and destiny shall be accomplished.'
  - where: 'note 4:6 “The oil is the Spirit”'
    claim: 'The Old Testament ascribes power to the Spirit; Micah 3:8 and Zechariah 4:6'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'The Old Testament regularly ascribes power as a characteristic of the Spirit.[22] Micah depicts the Spirit as nearly synonymous with power: “Truly I am full of power by the spirit of the Lord” (Micah 3:8; see also Zechariah 4:6).'
  - where: 'note 4:6 “The oil is the Spirit”'
    claim: 'The community was poor and politically weak'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Simply, the weight of poverty, political disruption, animosities, and a backbreaking need to survive brought the construction to a halt with no new beginning in sight.'

  - where: 'note 4:7 “The mountain made a plain”'
    claim: 'The mountain is the obstacles before Zerubbabel, removed so he could complete the temple'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The mountain represents the obstacles that stood before Zerubbabel as he tried to complete the temple. The mountain became a plain; that is, the obstacles were removed, and Zerubbabel was able to complete his work on the temple'
  - where: 'note 4:7 “The mountain made a plain”'
    claim: 'The obstacles: poverty, political disruption, animosities, survival; the work stopped at the foundation'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'A decade and a half had passed, and work on the temple had not progressed beyond laying the foundation stones. Simply, the weight of poverty, political disruption, animosities, and a backbreaking need to survive brought the construction to a halt'
  - where: 'note 4:7 “The mountain made a plain”'
    claim: 'Setbacks: crop failures, drought, extreme poverty'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Progress was slow, however, as a series of setbacks such as crop failures, drought, and the onset of extreme poverty hindered their efforts (see Haggai 1).'

  - where: 'note 4:7 “The top stone and the cry of “Grace””'
    claim: 'roshah: the topmost stone'
    key: bdb
    url: 'https://biblehub.com/hebrew/7222.htm'
    quote: 'ראֹשָׁה noun feminine top; — apposition ׳הָאֶבֶן הָר Zechariah 4:7 i.e. the topmost stone.'
  - where: 'note 4:7 “The top stone and the cry of “Grace””'
    claim: 'Not the foundation or corner stone but the finishing stone, brought out of the workshop'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'אבן הראשׁה does not mean the foundation-stone, which is called אבן פּנּה, lit., corner-stone … but the stone of the top, i.e., the finishing or gable stone'
  - where: 'note 4:7 “The top stone and the cry of “Grace””'
    claim: 'The stone is brought out of the workshop and set; the words refer to finishing the temple, as verse 9 shows'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'הוציא, to bring out, namely out of the workshop in which it had been cut, to set it in its proper place in the wall. That these words refer to the finishing of the building of the temple which Zerubbabel had begun, is placed beyond all doubt by Zechariah 4:9.'
  - where: 'note 4:7 “The top stone and the cry of “Grace””'
    claim: 'chen, favour, here with God'
    key: bdb
    url: 'https://biblehub.com/hebrew/2580.htm'
    quote: 'b. with God Zechariah 4:7 (twice in verse); Zechariah 12:10'
  - where: 'note 4:7 “The top stone and the cry of “Grace””'
    claim: 'The cry asks God to direct His favour to the temple that it may stand for ever'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/4.htm'
    quote: 'To this stone (so the words mean) may God direct His favour or grace, that the temple may stand for ever, and never be destroyed again.'

  - where: 'note 4:10 “The day of small things”'
    claim: 'A small band found a shell of a city; Zerubbabel arrived at the head of returning exiles'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Upon their arrival in Jerusalem, they found the mere shell of a city. Nevertheless, the small band began at once to rebuild the temple (see Ezra 5:16). Progress was slow'
  - where: 'note 4:10 “The day of small things”'
    claim: 'Fifteen years on, nothing beyond the foundation stones; temple completed in 515 against all odds'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'In the final analysis, these prophets were successful. The second temple was completed in 515 BC, and against all odds'
  - where: 'note 4:10 “The day of small things”'
    claim: 'A decade and a half on, nothing beyond the foundation stones'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'A decade and a half had passed, and work on the temple had not progressed beyond laying the foundation stones.'
  - where: 'note 4:10 “The day of small things”'
    claim: 'The plummet: “the stone, the tin”'
    key: bdb
    url: 'https://biblehub.com/hebrew/913.htm'
    quote: '3 plummet, הָאֶבֶן הַבְּדִיל (appositive) Zechariah 4:10.'

  - where: 'note 4:10 ““The eyes of the LORD” in the Joseph Smith Translation”'
    claim: 'JST Zechariah 4:10 reads “They are the servants of the Lord which run to and fro through the whole earth”'
    key: jst-parallel-zech
    url: 'https://rsc.byu.edu/sites/default/files/pub_content/pdf/Hosea_Zechariah.pdf'
    quote: 'ZECHARIAH 4 10 “For who hath despised the day of small things? For they shall rejoice and shall see the plummet in the hand of Zerubbabel with those seven. They are the servants of the Lord which run to and fro through the whole earth.”'
  - where: 'note 4:10 ““The eyes of the LORD” in the Joseph Smith Translation”'
    claim: 'The Gospel Library prints selected portions of the JST'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/introduction?lang=eng'
    quote: 'Following are selected portions of the Joseph Smith Translation of the King James Version of the Bible (JST).'

  - where: 'note 4:14 ““Sons of oil”: Joshua and Zerubbabel”'
    claim: 'yitshar is fresh oil of the land; as anointing oil only in “sons of oil,” i.e. anointed ones'
    key: bdb
    url: 'https://biblehub.com/hebrew/3323.htm'
    quote: 'fresh oil, as product of land, in un-manufactured state, usually + תִּירוֺשׁ, דָּגָן etc. … ׳יִצ as anointing oil only in ׳בְּנֵי הַיִּצ Zechariah 4:14, i.e. anointed ones.'
  - where: 'note 4:14 ““Sons of oil”: Joshua and Zerubbabel”'
    claim: 'The two anointed ones represent the priestly and royal rule, Joshua and Zerubbabel, through whom the Spirit is dispensed'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'This Spirit is dispensed through the two anointed ones (“sons of oil”), representing the priestly and royal rule (Joshua and Zerubbabel).'
  - where: 'note 4:14 ““Sons of oil”: Joshua and Zerubbabel”'
    claim: 'Joshua was the high priest serving alongside Zerubbabel'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'Joshua was the high priest who served alongside Zerubbabel.'

  - where: 'note 4:14 “John’s two olive trees”'
    claim: 'D&C 77:15 identifies the two witnesses of Revelation 11 as two prophets of the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/77?lang=eng'
    quote: 'They are two prophets that are to be raised up to the Jewish nation in the last days, at the time of the restoration'

  # ---- christ ----
  - where: 'christ'
    claim: 'Christ and Messiah both mean “anointed”; Jesus is the one anointed of the Father'
    key: bd-anointed-one
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anointed-one?lang=eng'
    quote: 'Jesus is spoken of as the Christ and the Messiah, which means He is the one anointed of the Father to be His personal representative in all things pertaining to the salvation of mankind.'
  - where: 'christ'
    claim: 'Joshua and Zerubbabel are a type of the Messiah as Priest and King'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'Joshua and Zerubbabel can be seen as messianic types, “who as Spirit-filled men convey blessing from God to church and state, and are a type of the Messiah as Priest and King”'
  - where: 'christ'
    claim: 'The Spirit’s power works best when God’s servants know their powerlessness without it'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'In all cases, the Spirit’s power works best when God’s servants realize their personal powerlessness without it.'

  # ---- explore ----
  - where: 'explore'
    claim: 'The tabernacle lampstand, Exodus 25:31–37'
    key: bd-candlestick
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/candlestick?lang=eng'
    quote: 'Made for the tabernacle (Ex. 25:31–37; 37:17–24), placed on the south side, opposite the table of shewbread.'
  - where: 'explore'
    claim: 'The crowning of Joshua, 6:9–15: the Branch a crowned priest'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: '(j) Zech. 6:9–15, symbolic action to teach that the Branch (Messiah), who shall truly build the temple of the Lord, shall be a Crowned Priest.'
