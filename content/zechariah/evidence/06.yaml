chapter: 6
claims:
  # ---- when, setting, thread ----
  - where: 'when'
    claim: 'Zechariah prophesied from the second to the fourth year of Darius I, 520–518 B.C.'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'prophesied from the second to fourth year of Darius Ⅰ (520–518 B.C.)'
  - where: 'setting'
    claim: 'Verses 1–8 are the eighth vision; verses 9–15 a symbolic action about the Branch'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'Zech. 6:1–8, eighth vision, horsemen, called also winds (Rev. 7:1), going to all quarters of the earth … Zech. 6:9–15, symbolic action to teach that the Branch (Messiah), who shall truly build the temple of the Lord, shall be a Crowned Priest.'
  - where: 'setting'
    claim: 'The series of visions closes with a symbolic act closely connected to them'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'The series of visions closes with a symbolical transaction, which is closely connected with the substance of the night-visions'
  - where: 'setting'
    claim: 'The chapter heading reads the crowning as a similitude of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/6?lang=eng'
    quote: 'Zechariah crowns Joshua, the high priest, in similitude of Christ, the Branch, who will come—Christ will be a priest upon His throne forever.'
  - where: 'setting'
    claim: 'Zerubbabel was the grandson of Jehoiachin'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Neither Jehoiachin, his son Shealtiel, nor his grandson Zerubbabel reigned as king over Judah'
  - where: 'thread'
    claim: 'The chariots are agencies by which God subdues the nations; the crowning teaches that the Branch shall be a crowned priest'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'symbols of agencies by which God shall subdue the nations, foes of His people.'

  # ---- note 6:1 ----
  - where: 'note 6:1 “Chariots from between mountains of brass”'
    claim: 'The chariots go to all quarters of the earth as agencies by which God subdues the nations'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'horsemen, called also winds (Rev. 7:1), going to all quarters of the earth—symbols of agencies by which God shall subdue the nations, foes of His people.'
  - where: 'note 6:1 “Chariots from between mountains of brass”'
    claim: 'The two mountains are places where the Lord will judge the nations; brass a symbol of firmness; black horses new, seemingly death or mourning'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The servants came from between two mountains (two places where the Lord will judge the nations) which were made of brass (a symbol of firmness'
  - where: 'note 6:1 “Chariots from between mountains of brass”'
    claim: 'Black horses are the only ones not previously mentioned; they seem to represent death or mourning'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'The black horses, the only ones not previously mentioned, seem to represent death or mourning.'
  - where: 'note 6:1 “Chariots from between mountains of brass”'
    claim: 'The mountains are Zion and the Mount of Olives; the valley between is where the Lord judges the nations; brass denotes the immovable firmness of where the Lord dwells'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'we have rather to think of Zion and the Mount of Olives, which stood opposite to it towards the east. Both are named as places where or from which the Lord judges the world'
  - where: 'note 6:1 “Chariots from between mountains of brass”'
    claim: 'Brass denotes the firmness of the place where the Lord dwells'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'the mountains are of brass, to denote the immovable firmness of the place where the Lord dwells, and where He has founded His kingdom.'

  # ---- note 6:5 ----
  - where: 'note 6:5 “Spirits, winds, or servants?”'
    claim: 'The Hebrew of 6:5 is rûḥôt haššāmayim, “spirits/winds of the heavens”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'רֻח֣וֹת'
  - where: 'note 6:5 “Spirits, winds, or servants?”'
    claim: 'The same phrase at 2:6 (Hebrew 2:10), rendered “as the four winds of the heaven”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'רוּח֧וֹת'
  - where: 'note 6:5 “Spirits, winds, or servants?”'
    claim: 'The Bible Dictionary calls the horsemen also winds'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'eighth vision, horsemen, called also winds (Rev. 7:1)'
  - where: 'note 6:5 “Spirits, winds, or servants?”'
    claim: 'The Joseph Smith Translation reads “four servants of the heavens”'
    key: jackson-jst-zechariah
    url: 'https://rsc.byu.edu/sites/default/files/pub_content/pdf/Hosea_Zechariah.pdf'
    quote: 'These are the four servants of the heavens which go forth from stand- ing before the Lord of all the earth.'

  # ---- note 6:7 ----
  - where: 'note 6:7 “Sent out at the Lord’s word”'
    claim: 'The Bible Dictionary sets the chariots beside Revelation 7:1'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'horsemen, called also winds (Rev. 7:1), going to all quarters of the earth'
  - where: 'note 6:7 “Sent out at the Lord’s word”'
    claim: 'John spoke of the four angels at the four corners of the earth; D&C 86 says they cry to be sent; Zechariah 6:7 says they could not go without the Lord’s permission'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'the Savior told the Prophet Joseph Smith that these angels were crying unto Him day and night for permission to reap down the earth and burn the tares (see D&C 86:4–7). Zechariah 6:7states that the angels could not go forth upon the earth until given permission by the Lord.'
  - where: 'note 6:7 “Sent out at the Lord’s word”'
    claim: 'The revelation was given on 6 December 1832'
    key: ot-manual-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-33?lang=eng'
    quote: 'On 6 December 1832, the Savior told the Prophet Joseph Smith that these angels were crying unto Him day and night'

  # ---- note 6:8 ----
  - where: 'note 6:8 “My Spirit at rest in the north”'
    claim: 'The north is the land of the Euphrates and Tigris; north and south (Egypt) are the two seats of the world’s hostile power'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'The land of the north, i.e., the territory covered by the lands of the Euphrates and Tigris, and the land of the south, i.e., Egypt, are mentioned as the two principal seats of the power of the world in its hostility to Israel'
  - where: 'note 6:8 “My Spirit at rest in the north”'
    claim: 'To cause the Spirit of Jehovah to rest is not to let out wrath; the Spirit of judgment destroys the ungodly and quickens what is related to God'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'the Spirit of Jehovah is rūăch mishpât (Isaiah 4:4), a spirit of judgment, which not only destroys what is ungodly, but also quickens and invigorates what is related to God.'
  - where: 'note 6:8 “My Spirit at rest in the north”'
    claim: 'The vision sets forth a judgment that purifies and renews, not simply destruction'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'the judgment by which God purifies the sinful world, exterminates all that is ungodly, and renews it by His Spirit.'
  - where: 'note 6:8 “My Spirit at rest in the north”'
    claim: '“My spirit” is rûḥî, the same word as “spirits” in 6:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'רוּחִ֖/י'

  # ---- note 6:11 ----
  - where: 'note 6:11 “Why crown the priest?”'
    claim: '“Crowns” is the plural ʿăṭārôt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'עֲטָר֑וֹת'
  - where: 'note 6:11 “Why crown the priest?”'
    claim: 'The crowning of Joshua is a symbolic action teaching that the Branch shall be a crowned priest'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'symbolic action to teach that the Branch (Messiah), who shall truly build the temple of the Lord, shall be a Crowned Priest.'
  - where: 'note 6:11 “Why crown the priest?”'
    claim: 'Messengers from Babylon had brought silver and gold, probably for the temple, to the house of Josiah'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'messengers had come to Jerusalem from the Israelites who had been left behind in Babel, to offer presents of silver and gold, probably for supporting the erection of the temple, and had gone to the house of Josiah the son of Zephaniah.'
  - where: 'note 6:11 “Why crown the priest?”'
    claim: 'A royal crown did not belong to the high priest; it pointed to one who would be both ruler and priest'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'It pointed to a man who would sit upon his throne as both ruler and priest, that is to say, would combine both royalty and priesthood in his own person and rank.'
  - where: 'note 6:11 “Why crown the priest?”'
    claim: 'The high priest’s headdress was not called a crown'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'his headdress is neither called a crown (‛ătârâh) nor formed part of the insignia of royal dignity and glory'
  - where: 'note 6:11 “Why crown the priest?”'
    claim: 'The words are addressed to Joshua alone; Zerubbabel must not be added'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'the words of Jehovah are addressed to Joshua, and to him alone (אליו is singular), and therefore that Zerubbabel must not be interpolated into Zechariah 6:11 along with Joshua.'
  - where: 'note 6:11 “Why crown the priest?”'
    claim: 'The plural “crowns” denotes one crown of several twists'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'The plural ‛ătârōth denotes here one single splendid crown, consisting of several gold and silver twists wound together'
  - where: 'note 6:11 “Why crown the priest?”'
    claim: 'Parry reads “set [one]” of the crowns upon Joshua; the act is Christ-centred; Joshua’s name is associated with Jesus'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Zechariah is commanded to “take silver and gold, and make crowns, and set [one] upon the head of Joshua the son of Josedech, the high priest'
  - where: 'note 6:11 “Why crown the priest?”'
    claim: 'Joshua’s name is Jesus’ name; the high priest points to Jesus, the great high priest'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'The name Jesus is associated with the Hebrew Joshua.[7] Joshua, the high priest, has reference to Jesus, the “great high priest” (Hebrews 4:14; see also 3:1).'

  # ---- note 6:12 ----
  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'The footnote gives the Hebrew: Branch is His name and from beneath Him one shall branch forth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/6?lang=eng'
    quote: 'HEB Branch is His name and from beneath Him one shall branch forth and he shall build the temple of Jehovah.'
  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'The footnote to Branch points to the Topical Guide on Christ’s Davidic descent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/6?lang=eng'
    quote: 'TG Jesus Christ, Davidic Descent of; Jesus Christ, Prophecies about.'
  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'The noun ṣemaḥ and the verb yiṣmaḥ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'צֶ֤מַח'
  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'The verb yiṣmaḥ from the same root'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'יִצְמָ֔ח'
  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'Zerubbabel never reigned; Zechariah takes up Jeremiah’s Branch as a discreet way of prophesying a Davidic restoration under Persian rule'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Zechariah picks up Jeremiah’s prophecy of the “branch” (“I will bring forth my servant the BRANCH,” Zechariah 3:8) as a discreet way of prophesying of a Davidic restoration, this during a time of Persian hegemony.'
  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'Neither Jehoiachin, Shealtiel nor Zerubbabel reigned as king'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Neither Jehoiachin, his son Shealtiel, nor his grandson Zerubbabel reigned as king over Judah'
  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'The Branch in the passage is Jesus'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'The Branch identified in the passage is Jesus (see Jeremiah 23:5–6; Isaiah 11:1–5; Zechariah 3:8–10).'

  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'ṣemaḥ is a sprout, used of a future ruler from the Davidic tree'
    key: bdb
    url: 'https://biblehub.com/hebrew/6780.htm'
    quote: '3 future ruler, under figure of sprout from Davidic tree (compare Psalm 132:17)'
  - where: 'note 6:12 “The Branch shall branch out”'
    claim: 'The word means a sprout or shoot'
    key: bdb
    url: 'https://biblehub.com/hebrew/6780.htm'
    quote: 'a righteous sprout, shoot'

  # ---- note 6:13 ----
  - where: 'note 6:13 “A Priest upon His throne”'
    claim: 'The Branch shall truly build the temple'
    key: bd-zechariah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zechariah?lang=eng'
    quote: 'the Branch (Messiah), who shall truly build the temple of the Lord, shall be a Crowned Priest.'
  - where: 'note 6:13 “A Priest upon His throne”'
    claim: 'The temple the Branch builds is the spiritual temple, the church of God'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'the spiritual temple, of which the tabernacle and the temples of both Solomon and Zerubbabel were only symbols, the temple which is the church of God itself (Hosea 8:1; 1 Peter 2:5; Hebrews 3:6; and Ephesians 2:21-22).'
  - where: 'note 6:13 “A Priest upon His throne”'
    claim: 'He will be at once Priest and King on His throne'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'will be a Priest upon His throne, i.e., will be at once both Priest and King upon the throne which He assumes.'
  - where: 'note 6:13 “A Priest upon His throne”'
    claim: '“Between them both” means between ruler and priest united in one person; the counsel of peace is counsel aimed at his people’s peace'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'but to the Mōshēl and Kōhēn, who sit upon the throne, united in one person, in the Tsemach.'
  - where: 'note 6:13 “A Priest upon His throne”'
    claim: 'The Messiah, uniting royalty and priesthood, will counsel and promote the peace of His people'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'The Messiah, who unites in Himself royalty and priesthood, will counsel and promote the peace of His people.'
  - where: 'note 6:13 “A Priest upon His throne”'
    claim: 'The regalia, throne and repeated temple point to Jesus as King; the coronation of Joshua prophesied the coronation of Christ'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'In addition, the duplicated reference to the temple speaks of the crowned and enthroned Jesus Christ. It is evident, then, that Zechariah’s participation in the coronation of Joshua, the high priest, prophesied of the future coronation of Jesus Christ.'
  - where: 'note 6:13 “A Priest upon His throne”'
    claim: 'The chapter heading: Christ will be a priest upon His throne forever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/6?lang=eng'
    quote: 'Christ will be a priest upon His throne forever.'

  # ---- note 6:15 ----
  - where: 'note 6:15 “Builders from far off”'
    claim: 'The crown is kept in the temple as a memorial of the givers and of the favour of the son of Zephaniah; Hen is not a proper name'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'Chēn is not a proper name, or another name for Josiah, but an appellative in the sense of favour, or a favourable disposition, and refers to the favour which the son of Zephaniah has shown to the emigrants'
  - where: 'note 6:15 “Builders from far off”'
    claim: 'Helem is a variant of Heldai'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'chēlem, i.e., strength, is not materially different from Cheldai, i.e., the enduring one; so that it is only a variation of the name'
  - where: 'note 6:15 “Builders from far off”'
    claim: 'Those come from Babylon are types of distant nations who will help build the temple'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'Those who have come from the far distant Babylon are types of the distant nations who will help to build the temple of the Lord with their possessions and treasures.'
  - where: 'note 6:15 “Builders from far off”'
    claim: 'Israel will not come to the Messiah’s salvation unless it hearkens to the Lord'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'the words simply declare that Israel will not come to the knowledge of the Messiah or to His salvation, unless it hearkens to the voice of the Lord.'

  - where: 'note 6:15 “Builders from far off”'
    claim: 'The condition does not bind the coming of the Messiah to the nation’s fidelity'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'by no means implies that the coming of the Messiah, or the participation of the Gentiles in His kingdom, will be bound up with the fidelity of the covenant nation'

  # ---- christ, explore ----
  - where: 'christ'
    claim: 'The Messiah, uniting royalty and priesthood, will counsel and promote the peace of His people'
    key: keil-zechariah
    url: 'https://biblehub.com/commentaries/kad/zechariah/6.htm'
    quote: 'The Messiah, who unites in Himself royalty and priesthood, will counsel and promote the peace of His people.'
  - where: 'christ'
    claim: 'The chapter heading reads the crowning in similitude of Christ, a priest upon His throne forever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/6?lang=eng'
    quote: 'Zechariah crowns Joshua, the high priest, in similitude of Christ, the Branch, who will come—Christ will be a priest upon His throne forever.'
  - where: 'christ'
    claim: 'Prophets, priests and kings were anointed; Jesus Christ fulfilled all three offices'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'In ancient Israel, those who held any of three religious offices were anointed: prophets, priests, and kings. Jesus Christ fulfilled all three of these offices.'
  - where: 'christ'
    claim: 'Jesus came through Judah, the royal lineage, and was priest after the order of Melchizedek'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'Jesus was not born of a Levitical lineage but came through Judah, the royal lineage. He fulfilled the prophecy, being the priest after the order of Melchizedek'
  - where: 'christ'
    claim: 'Joshua the high priest points to Jesus, the great high priest of Hebrews 4:14'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Joshua, the high priest, has reference to Jesus, the “great high priest” (Hebrews 4:14; see also 3:1).'
  - where: 'explore'
    claim: 'The priestly office prefigured by Melchizedek; Psalm 110:4 and Hebrews 7'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'The office of priest is represented by Melchizedek. The Lord prophesied to David that his messianic descendant would be “a priest for ever after the order of Melchizedek” (Psalm 110:4).'
