chapter: 5
title: The Flying Scroll and the Woman in the Ephah
tagline: A scroll twenty cubits by ten flies over the land carrying the curse on thieves and false swearers, and it brings their houses down. Then wickedness itself, a woman shut in a measuring vessel under a lid of lead, is flown away to Shinar and given a house there.
when: 'Zechariah prophesied in Jerusalem under Darius I of Persia, 520–518 B.C.'

setting: |
  Chapter 5 holds two of the eight visions Zechariah saw “by night” ([[Zech. 1:8]]), dated “the four and twentieth day of the eleventh month … in the second year of Darius” ([[Zech. 1:7]]). In the order of the book they are the sixth and the seventh: the first is “a symbol of the curse that shall light on sin in the land,” and the second shows the people's sin carried off to Shinar. Before them stands the lampstand of chapter 4, with its promise that the temple will be finished “not by might, nor by power, but by my spirit” ([[Zech. 4:6]]); after them come the four chariots of [[Zech. 6:1–8]].

  The visions were given to the returned exiles of Judah while they rebuilt the house of God in Jerusalem under Zerubbabel and Joshua, “and with them were the prophets of God helping them” ([[Ezra 5:2]]). Haggai's chapters introduce the two leaders ([[Hag. 1:1]]).

  The same angel shows and explains both visions, “the angel that talked with me” ([[Zech. 5:5]]); the note at [[Zech. 1:9]] says who he is. The two visions belong together: in one older reading the chapter is a “double vision” that shows “the separation of the wicked from the congregation of the Lord.”

thread: |
  Two houses frame the chapter. The curse written on the flying scroll goes into the house of the thief and of the man who swears falsely by the Lord's name, stays there, and consumes it, timber and stones (verse 4). At the end, wickedness itself is given a house in Shinar and set there on its own base (verse 11). Between the two, the angel shows what wickedness looks like: one woman sitting in a measuring vessel, thrust back under a lid of lead.

  The movement is outward. The scroll “goeth forth” over the land; the ephah “goeth forth”; two winged women lift it “between the earth and the heaven” ([[Zech. 5:9]]) and carry it off. The land is purged first of the thief and the false swearer, then of wickedness itself, sent to Shinar, the plain where Babel was built.

sections:
  - range: 1-4
    heading: The flying scroll
    plain: |
      I looked up again and saw a scroll flying through the air. The angel asked me, “What do you see?” I answered, “A flying scroll, twenty cubits long and ten cubits wide.” He said, “This is the curse that goes out over the face of the whole earth. By what is written on one side, everyone who steals will be cut off; by what is written on the other, everyone who swears falsely will be cut off. I will send it out,” says the LORD of hosts, “and it will enter the house of the thief and the house of the one who swears falsely by my name. It will stay inside his house and consume it, its timbers and its stones.”
  - range: 5-8
    heading: The woman in the ephah
    plain: |
      Then the angel who talked with me came out and said, “Look up and see what this is that is coming out.” I asked, “What is it?” He said, “This is an ephah,” a measuring vessel, “coming out.” And he said, “This is what they look like throughout the earth” (or, as the Greek reads, “This is their iniquity”). A round lid of lead was lifted, and there was a woman sitting inside the ephah. He said, “This is wickedness,” and he thrust her back down into the ephah and threw the lead weight over its mouth.
  - range: 9-11
    heading: Carried to Shinar
    plain: |
      I looked up and saw two women coming out, with the wind in their wings; they had wings like a stork's. They lifted the ephah up between earth and sky. I asked the angel who talked with me, “Where are they taking the ephah?” He said, “To build a house for it in the land of Shinar. There it will be established and set down on its own base.”

notes:
  - ref: 1
    phrase: behold a flying roll
    kind: symbol
    title: A scroll in flight
    body: |
      Zechariah sees a scroll flying through the air, and the angel names it before anyone reads it: “This is the curse” ([[Zech. 5:3]]).

      Other prophets were shown heavenly books. Ezekiel was handed one “written within and without” with “lamentations, and mourning, and woe” ([[Ezek. 2:10]]), and Lehi was given a book to read ([[1 Ne. 1:11]]). The giving of “a heavenly book for the prophet to read” is “one of the central features” of such visions, and Zechariah's scroll has been listed with them. His is not handed to him to read: it flies out over the land to do what is written on it.
    sources: [sc-knowhy-469, lds-scriptures]

  - ref: 2
    phrase: the length thereof is twenty cubits, and the breadth thereof ten cubits
    kind: symbol
    title: The measure of the holy place
    body: |
      The scroll is enormous, and its measurements match a sacred space. A cubit was “normally about 17½ inches,” so the scroll is about thirty feet by fifteen. Twenty cubits by ten is the size of the porch of Solomon's temple ([[1 Kgs. 6:3]]), and in one older reading also the size of the holy place of the tabernacle.

      What the match means is a matter of interpretation. Some interpreters have taken the porch to be meant, so that the judgment comes out of the sanctuary. The older reading prefers the tabernacle's holy place and finds the point in the standard of judgment: “the measure by which this curse upon sinners will be meted out, will be the measure of the holy place.” Either way, the size is there to be noticed; it is “unquestionably significant.”
    sources: [bd-weights-and-measures, keil-zechariah, lds-scriptures]

  - ref: 3
    phrase: This is the curse that goeth forth over the face of the whole earth
    kind: words
    title: The curse of a broken oath
    body: |
      The word translated “curse” is *ʾālāh*, properly “an oath,” and usually, in a bad sense, “a curse.” Oath and curse went together. In ancient Israel, oaths and covenants sworn in God's name “were often accompanied with threats of divine and temporal curses (including death) for breaking such,” and “breaking a treaty sworn in God’s name was seen as nothing less than blasphemy.” Zechariah's scroll is among the passages cited for this, beside the commandment “Thou shalt not take the name of the LORD thy God in vain” ([[Ex. 20:7]]).

      The scroll's curse falls on “him that sweareth falsely by my name” ([[Zech. 5:4]]), as well as on the thief.
    sources: [bdb, sc-knowhy-98, lds-scriptures]

  - ref: 4
    phrase: shall consume it with the timber thereof and the stones thereof
    kind: symbol
    title: The curse that stays in the house
    body: |
      The curse does not pass by the guilty house: it enters, “remains” there, and destroys it down to the timber and the stones. The Hebrew of verse 3 points to two sins, one written on each side of the scroll, and theft and lying have been called “typical sins of a poor community.” Zechariah's own sermons come back to them: “love no false oath” ([[Zech. 8:17]]).

      The destruction of the house recalls the law of a house with a spreading plague, which was to be broken down, “the stones of it, and the timber thereof” ([[Lev. 14:45]]); the penalty reaches the very structure of the wrongdoer's house, as if it had been defiled by leprosy. The verb behind “cut off” in verse 3 means here to be “purged out, of liars and perjurers.”
    sources: [ot-manual-33, bdb, lds-scriptures]

  - ref: 6
    phrase: This is their resemblance through all the earth
    kind: words
    title: Their resemblance, or their iniquity
    body: |
      The angel's second explanation is uncertain in the Hebrew, and the two readings give the vision different turns. Behind “resemblance” is *ʿênām*, literally “their eye,” which the King James translators rendered “their resemblance.” The Septuagint, the early Greek translation, reads “This is their iniquity in all the earth,” and the standard Hebrew lexicon proposes reading the Hebrew that way, *ʿăwōnām*, “their iniquity.” A modern translation follows it: “This is their iniquity in the whole land.”

      The vessel is an ephah, a dry measure, “one-tenth of a homer,” and a homer was “about 6½ U.S. bushels,” so an ephah held roughly two-thirds of a bushel. The Greek calls it simply “the measure,” and the same modern translation calls it “a basket.” On either reading of the angel's words, what is inside the measure is the land's sin, and the next verse shows it.
    sources: [oshb-wlc, lxx-rahlfs, bdb, nrsvue, bd-weights-and-measures]

  - ref: 7
    phrase: this is a woman that sitteth in the midst of the ephah
    kind: symbol
    title: Wickedness under a lid of lead
    body: |
      When the lid of lead is lifted, a woman is found sitting inside the measure, and the angel names her: “This is wickedness” ([[Zech. 5:8]]). The text does not say why wickedness appears as a woman. She has been read as “a symbol of Israel and her sins.” An older commentary adds that the Hebrew says “one woman” because the sinners of the land are seen “as a unity, i.e., as one living personality,” and she is “wickedness embodied.” She was already sitting there, and was seen only when the lid rose; the angel throws her back in and closes it.

      The “talent” of lead is *kikkār*, “a circle, a rounding or a circular plate,” the same word as the talent weight, “about 75.6 pounds.” Wickedness is shut in under lead before it is carried off.
    sources: [ot-manual-33, keil-zechariah, bd-weights-and-measures]

  - ref: 11
    phrase: To build it an house in the land of Shinar
    kind: history
    title: A house for wickedness in Shinar
    body: |
      Wickedness is not destroyed in the vision; it is taken away and given a house. Shinar is the plain where the builders of Babel settled ([[Gen. 11:2]]), and Babylon was “one of the oldest cities of the land of Shinar.” The vision is read as “the removing of the sin of the people to Shinar, the land of their foes,” with a cross-reference to the Day of Atonement, when the high priest confessed Israel's sins over a live goat and sent it away “into the wilderness” ([[Lev. 16:21]]).

      The text gives the two women with stork's wings no explanation; they are the carriers. The point is where the ephah goes and that it stays: a house is built for it, and it “shall be established, and set there upon her own base.” Wickedness is not merely driven out of the land but settled in the land of Judah's foes.
    sources: [lds-scriptures, bd-babylon, bd-zechariah]

christ: |
  The ephah vision carries a cross-reference to the scapegoat of the Day of Atonement ([[Lev. 16:21]]), and in those rites “the goats symbolized Jesus Christ, taking the place of the sinful people”; the note on [[Lev. 16:22]] explains how. Wickedness in Zechariah's vision is not left in the land: it is shut away and carried far off, and in one reading the vision means that “God not only forgives the sins of His people, but carries them altogether away from their land, that they may deceive them no more.”

  Forgiveness through Christ reaches that far for a disciple now: sin is not only pardoned but taken away, as the goat bore “all their iniquities unto a land not inhabited” ([[Lev. 16:22]]).

