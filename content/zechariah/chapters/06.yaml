chapter: 6
title: A Priest upon His Throne
tagline: Four chariots drive out from between two mountains of brass to the ends of the earth, and the Lord’s Spirit rests in the north. Then Zechariah crowns Joshua the high priest and names the coming Branch, who will build the temple and be a priest upon His throne.
when: 'Zechariah prophesied in Jerusalem under Darius I of Persia, 520–518 B.C.'

setting: |
  The chapter closes the night visions that began at [[Zech. 1:7]]. Verses 1–8 are the eighth and last vision, the chariots, and verses 9–15 are not a vision at all but a “symbolic action”: the prophet is told to make a crown and set it on a man’s head. The crowning is “closely connected with the substance of the night-visions,” and it closes them.

  The people are the ones Haggai preached to, back from Babylon and rebuilding the temple in Jerusalem. Joshua the son of Josedech is their high priest ([[Hag. 1:1]]), and Zerubbabel, the grandson of King Jehoiachin, their governor; chapter 3 has already shown Joshua cleansed and named the coming BRANCH ([[Zech. 3:8]]), and chapter 4 promised that Zerubbabel’s hands would finish the house ([[Zech. 4:9]]).

  The Church’s chapter heading reads the crowning as a similitude of Christ, the coming Branch, who will be a priest upon His throne forever, and this page follows that reading.

thread: |
  The visions end as they began, with coloured horses. In the first vision the horsemen came back to report that the earth sat still ([[Zech. 1:11]]); now the chariots go out from the Lord’s presence to the north, the south and through all the earth, as the agents of God’s rule over the nations. The last word of the vision is that the Lord’s Spirit is at rest in the north, the land the exiles had come from.

  Then the scene turns from the nations to Jerusalem, and from what God will overthrow to whom He will enthrone. Silver and gold brought from Babylon become a crown, and the crown goes on the head of the priest. The man it points to is the Branch: He will build the temple, bear the glory, and rule as a priest on His own throne, with “the counsel of peace” between the two offices. The chapter ends with a condition: all this will come “if ye will diligently obey the voice of the LORD your God” (verse 15).

sections:
  - range: 1-8
    heading: Four chariots go out
    plain: |
      I looked up again, and there were four chariots coming out from between two mountains, and the mountains were of bronze. The first chariot had red horses, the second black horses, the third white horses, and the fourth dappled and bay horses. I asked the angel who was speaking with me, “What are these, my lord?” He answered, “These are the four spirits (or winds) of heaven, going out after presenting themselves before the Lord of all the earth. The chariot with the black horses goes toward the north country, the white ones go after them, and the dappled ones go toward the south country.” The bay horses came out eager to go and patrol the earth, and He said, “Go, patrol the earth.” So they patrolled the earth. Then he called out to me, “Look, those going toward the north country have set my Spirit at rest in the north country.”
  - range: 9-15
    heading: A crown for the high priest
    plain: |
      The word of the LORD came to me: Take from the returned exiles, from Heldai, Tobijah and Jedaiah, who have come from Babylon, and go the same day to the house of Josiah son of Zephaniah. Take silver and gold, make crowns, and set them on the head of Joshua son of Josedech, the high priest. Tell him, “This is what the LORD of hosts says: Here is the man whose name is the Branch. He will branch out from his place, and he will build the temple of the LORD. He is the one who will build the temple of the LORD; he will bear the glory and sit and rule on his throne. He will be a priest on his throne, and there will be counsel of peace between the two.” The crowns are to stay in the temple of the LORD as a memorial for Helem, Tobijah, Jedaiah, and Hen son of Zephaniah. People from far away will come and help build the temple of the LORD, and you will know that the LORD of hosts has sent me to you. This will happen if you carefully obey the voice of the LORD your God.

notes:
  - ref: 1
    phrase: and the mountains were mountains of brass
    kind: symbol
    title: Chariots from between mountains of brass
    body: |
      The eighth vision sends the Lord’s forces out to the whole earth, and the Church’s reading of the chariots is that they are “symbols of agencies by which God shall subdue the nations, foes of His people.” The angel explains the chariots (verse 5) but not the mountains or the colours, so what follows is reading, not the angel’s answer.

      The two mountains are read as “two places where the Lord will judge the nations,” and brass, or bronze, as “a symbol of firmness.” The commentary behind that reading names the places: “Zion and the Mount of Olives,” both “places where or from which the Lord judges the world,” with the valley between as the place of judgment in [[Joel 3:2]]; the metal is there “to denote the immovable firmness of the place where the Lord dwells, and where He has founded His kingdom.” On that reading the chariots set out from Jerusalem, God’s own dwelling.

      The colours echo the horses of the first vision (the note on [[Zech. 1:8]]). The black horses are “the only ones not previously mentioned,” and they “seem to represent death or mourning.” That is as far as the readings go with confidence; the text itself names only the colours and the directions.
    sources: [bd-zechariah, ot-manual-33, keil-zechariah]

  - ref: 5
    phrase: These are the four spirits of the heavens
    kind: words
    title: Spirits, winds, or servants?
    body: |
      “Spirits” translates a Hebrew word that also means “winds,” and the Joseph Smith Translation reads “servants”; all three point to messengers sent out from God’s presence. The phrase is *ʾarbaʿ rûḥôt haššāmayim*, and four chapters earlier the King James translators rendered the same words “as the four winds of the heaven” ([[Zech. 2:6]]), where the people are scattered like the winds. The Bible Dictionary’s outline reads the horsemen of this vision as “called also winds.” The same word comes back three verses later as the Lord’s own Spirit (*rûḥî*, “my spirit,” verse 8), so the chariots that are “spirits” carry His Spirit.

      The angel says they “go forth from standing before the Lord of all the earth,” and the Joseph Smith Translation names them for that service: “These are the four servants of the heavens which go forth from standing before the Lord of all the earth.”
    sources: [oshb-wlc, bd-zechariah, jackson-jst-zechariah]

  - ref: 7
    phrase: Get you hence, walk to and fro through the earth
    kind: scripture
    title: Sent out at the Lord’s word
    body: |
      The bay team is eager to go, but it goes only when it is told “Get you hence.” The Bible Dictionary sets Zechariah’s chariots beside John’s vision of “four angels standing on the four corners of the earth, holding the four winds of the earth” ([[Rev. 7:1]]).

      The Doctrine and Covenants adds the picture of messengers waiting for that word. On 6 December 1832 the Lord told Joseph Smith that “the angels are crying unto the Lord day and night, who are ready and waiting to be sent forth to reap down the fields” ([[D&C 86:5]]). Set beside that revelation, the point of verse 7 is that “the angels could not go forth upon the earth until given permission by the Lord.” Judgment in Zechariah’s vision is never loose in the world on its own; it moves when God sends it.
    sources: [bd-zechariah, ot-manual-33, lds-scriptures]

  - ref: 8
    phrase: have quieted my spirit in the north country
    kind: words
    title: My Spirit at rest in the north
    body: |
      “Quieted my spirit” sounds like anger soothed, but it can also mean that the Lord’s Spirit has been brought to rest on the north, and that is the reading followed here. The north country is the land of the Euphrates and Tigris, Babylon’s land; Zechariah has just called the exiles to “flee from the land of the north” and “deliver thyself, O Zion, that dwellest with the daughter of Babylon” ([[Zech. 2:6–7]]). With Egypt in the south, these were “the two principal seats of the power of the world in its hostility to Israel.”

      “My spirit” is *rûḥî*, the word translated “spirits” in verse 5. On this reading, to cause the Lord’s Spirit to rest on a land is not simply to pour out wrath on it, for “the Spirit of Jehovah is rūăch mishpât (Isaiah 4:4), a spirit of judgment, which not only destroys what is ungodly, but also quickens and invigorates what is related to God.” Read so, the vision ends with “the judgment by which God purifies the sinful world, exterminates all that is ungodly, and renews it by His Spirit.”
    sources: [keil-zechariah, oshb-wlc, lds-scriptures]

  - ref: 11
    phrase: make crowns, and set them upon the head of Joshua the son of Josedech, the high priest
    kind: history
    title: Why crown the priest?
    body: |
      The crown goes on the priest because the one it points to is both priest and king; the act is a “symbolic action to teach that the Branch (Messiah), who shall truly build the temple of the Lord, shall be a Crowned Priest.” Men had come from the exiles still in Babylon, probably bringing “presents of silver and gold, probably for supporting the erection of the temple,” and had gone to the house of Josiah son of Zephaniah. The prophet is to take some of their gift and make the crown.

      A reader expects the crown to go to Zerubbabel, David’s heir. It does not, and the type explains why. The high priest’s headdress “is neither called a crown (‛ătârâh) nor formed part of the insignia of royal dignity and glory”; a royal crown on a priest “pointed to a man who would sit upon his throne as both ruler and priest.” The words that follow are spoken to Joshua alone (“speak unto him,” singular), which is why Zerubbabel’s name cannot simply be added to verse 11 beside Joshua’s, as some modern editors have proposed without any manuscript support. Joshua’s name helps the type: “The name Jesus is associated with the Hebrew Joshua,” and the high priest “has reference to Jesus,” the “great high priest” of [[Heb. 4:14]].

      “Crowns” is plural in Hebrew, *ʿăṭārôt*, and read in two ways. One reading takes it as “one single splendid crown, consisting of several gold and silver twists wound together.” Another has Zechariah make several crowns and “set [one] upon the head of Joshua.”
    sources: [bd-zechariah, keil-zechariah, parry-symbolic-action, oshb-wlc]

  - ref: 12
    phrase: Behold the man whose name is The BRANCH; and he shall grow up out of his place
    kind: words
    title: The Branch shall branch out
    body: |
      The name and the promise are the same word: “Branch” is *ṣemaḥ*, a sprout or shoot, used by the prophets of a “future ruler, under figure of sprout from Davidic tree,” and “shall grow up” is *yiṣmaḥ*, he shall sprout. The footnote in the Latter-day Saint edition gives the Hebrew more literally: “Branch is His name and from beneath Him one shall branch forth and he shall build the temple of Jehovah.” The Branch’s growth is in His name.

      The title’s history is explained at [[Isa. 4:2]] and [[Zech. 3:8]]. What matters here is who did not fill it. Zerubbabel was David’s heir, but “neither Jehoiachin, his son Shealtiel, nor his grandson Zerubbabel reigned as king over Judah.” Under Persian rule Zechariah took up Jeremiah’s Branch “as a discreet way of prophesying of a Davidic restoration.” The footnote to “Branch” sends the reader to the Topical Guide’s “Jesus Christ, Davidic Descent of,” and on the Latter-day Saint reading “the Branch identified in the passage is Jesus.”
    sources: [lds-scriptures, oshb-wlc, bdb, bowen-ominous-onomastics, parry-symbolic-action]

  - ref: 13
    phrase: "he shall be a priest upon his throne: and the counsel of peace shall be between them both"
    kind: christ
    title: A Priest upon His throne
    body: |
      The verse joins in one person the two offices Israel kept apart, and the Church’s chapter heading reads it of Christ (see the Background).

      First, the Branch builds the temple, and the verse says so twice: He “shall truly build the temple of the Lord.” One reading takes His temple to be “the spiritual temple, of which the tabernacle and the temples of both Solomon and Zerubbabel were only symbols, the temple which is the church of God itself” (compare [[1 Pet. 2:5]]). In the Latter-day Saint reading “the duplicated reference to the temple speaks of the crowned and enthroned Jesus Christ.”

      Then He sits and rules on His throne and is “a priest upon his throne,” that is, “at once both Priest and King upon the throne which He assumes.” “Between them both” is the hard phrase. Read with the rest of the verse, it is the ruler and the priest “united in one person,” and the “counsel of peace” is counsel that aims at peace: “The Messiah, who unites in Himself royalty and priesthood, will counsel and promote the peace of His people.” So read, Zechariah’s “participation in the coronation of Joshua, the high priest, prophesied of the future coronation of Jesus Christ.”
    sources: [lds-scriptures, bd-zechariah, keil-zechariah, parry-symbolic-action]

  - ref: 15
    phrase: they that are far off shall come and build in the temple of the LORD
    kind: symbol
    title: Builders from far off
    body: |
      The crown is not Joshua’s to keep; it stays in the temple as a memorial of the men who brought the gift. The names in verse 14 differ a little from verse 10. “Helem” is “only a variation of the name” Heldai, and “Hen” may not be a name at all: one reading takes it as “favour,” the kindness that Josiah son of Zephaniah “has shown to the emigrants” by taking them into his house.

      The givers had come from distant Babylon, and one reading takes them as a sign of verse 15’s builders: “those who have come from the far distant Babylon are types of the distant nations who will help to build the temple of the Lord with their possessions and treasures.”

      The last line makes the promise conditional: “this shall come to pass, if ye will diligently obey the voice of the LORD your God.” On the same reading it does not make the Branch’s coming depend on Judah; it says that Israel “will not come to the knowledge of the Messiah or to His salvation, unless it hearkens to the voice of the Lord.”
    sources: [keil-zechariah]

christ: |
  Zechariah set the crown on a priest named Joshua, and the Church reads the act “in similitude of Christ,” who “will be a priest upon His throne forever.” Israel anointed prophets, priests and kings, and “Jesus Christ fulfilled all three of these offices”: born of Judah, “the royal lineage,” He is also “the priest after the order of Melchizedek.” The high priest in Zechariah’s scene points to Jesus, the “great high priest” of [[Heb. 4:14]].

  The same passage of Hebrews says what that High Priest is to a disciple now: one who can “be touched with the feeling of our infirmities,” before whose “throne of grace” a disciple may “obtain mercy, and find grace to help in time of need” ([[Heb. 4:15–16]]). The King who rules is the Priest who intercedes, and verse 15’s condition still stands: His salvation is known by those who “diligently obey the voice of the LORD.”

