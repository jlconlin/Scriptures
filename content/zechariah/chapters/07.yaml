chapter: 7
title: Did Ye Fast unto Me?
tagline: Men from Bethel ask whether to keep mourning the temple’s fall now that a new temple is rising. The Lord answers with a question of His own, then recalls what the former prophets asked of Judah, and what came of refusing them.
when: 'Zechariah prophesied in Jerusalem under Darius I of Persia, 520–518 B.C.'

setting: |
  On “the fourth day of the ninth month” of Darius’s fourth year, a date that falls in early December 518 B.C., a delegation arrives with a question. It was two years after work on the temple had resumed and two years before it was finished, “at a time when the building must have been far advanced.”

  Chapters 7 and 8 are one “reply to a question about fasting.” The reply comes as four words of the Lord, each opening with the formula “the word of the LORD came” (7:4; 7:8; 8:1; 8:18). The two in this chapter explain what the Lord requires and why He had to send Judah into exile; the two in chapter 8 promise His favour restored. The fasts themselves are turned into feasts only at [[Zech. 8:19]].

  The prophets saw more than once the danger that fasting becomes “mere formalities”; Isaiah meets it with the same kind of answer ([[Isa. 58:3–7]]).

thread: |
  A town asks about a fast, and the Lord answers with a question of His own. Bethel has mourned the burning of the temple every fifth month for years; now it wants to know whether it may stop. He does not say yes or no. He asks whom their fasts of the fifth and seventh months had been for, and sets beside that question their eating and drinking, which had plainly been for themselves (verses 5–6).

  Then He tells them what He had asked all along. The former prophets had called for true justice, mercy, and protection of the widow, the orphan, the stranger and the poor (verses 9–10). Judah turned its shoulder, stopped its ears and hardened its heart, and the land was laid waste. That is the turn of the chapter: the disaster they had been mourning on their fast days was what their fathers’ refusal to hear had brought “upon the land.” The Church’s chapter heading names both halves: the Lord “reproves hypocrisy in fasts” and calls His people to “show mercy and compassion.”

sections:
  - range: 1-3
    heading: A question from Bethel
    plain: |
      In the fourth year of King Darius, on the fourth day of the ninth month, the month of Kislev, the word of the LORD came to Zechariah. The people of Bethel had sent Sharezer and Regem-melech and their men to seek the LORD’s favour and to ask the priests of the house of the LORD of hosts and the prophets, “Should I go on weeping and fasting in the fifth month, as I have done for so many years?”
  - range: 4-7
    heading: Did ye fast unto me?
    plain: |
      Then the word of the LORD of hosts came to me: Say to all the people of the land and to the priests, “When you fasted and mourned in the fifth month and in the seventh, all these seventy years, was it really for me that you fasted? And when you eat and drink, isn’t it for yourselves that you eat and drink? Shouldn’t you hear the words the LORD proclaimed through the earlier prophets, when Jerusalem was inhabited and at ease, with its towns around it, and people lived in the Negeb and in the western foothills?”
  - range: 8-14
    heading: What the former prophets said
    plain: |
      The word of the LORD came to Zechariah: This is what the LORD of hosts said: “Judge with true justice, and show kindness and compassion each to his brother. Do not oppress the widow or the orphan, the stranger or the poor, and do not plot harm against one another in your hearts.” But they refused to listen. They turned a stubborn shoulder and stopped their ears so as not to hear. They made their hearts as hard as adamant so that they would not hear the law and the words that the LORD of hosts had sent by His Spirit through the earlier prophets. So a great wrath came from the LORD of hosts. Just as He called and they would not listen, so they called and I would not listen, says the LORD of hosts. I scattered them like a whirlwind among nations they did not know, and the land they left behind was so desolate that no one came or went. They had turned the pleasant land into a waste.

notes:
  - ref: 2
    phrase: sent unto the house of God Sherezer and Regem-melech
    kind: history
    title: Bethel sends to ask
    body: |
      The question that sets off chapters 7 and 8 comes from the town of Bethel, not from Jerusalem. The King James Version’s “the house of God” is the place name Beth-el, which means “house of God,” and a modern translation takes the town as the one who sends: “Now the people of Bethel had sent Sharezer and Regem-melech and their men to entreat the favor of the Lord.” Read that way, the town sent two men with their companions to put a question to the priests and prophets at the temple in Jerusalem.

      Bethel lay at the northern edge of the Persian province of Yehud. “To pray before the LORD” is an idiom: the verb means to “entreat the favour of, literally make the face of any one sweet or pleasant.” The men came to seek the Lord’s favour as well as an answer.
    sources: [nrsvue, strongs-concordance, ot-minute-zech, bdb]

  - ref: 3
    phrase: Should I weep in the fifth month, separating myself
    kind: history
    title: The fast of the fifth month
    body: |
      The fast they ask about was most likely kept in memory of the temple’s destruction. In the fifth month of Nebuchadnezzar’s nineteenth year his captain “burned the house of the LORD” ([[Jer. 52:12–13]]), and it is possible that the people had kept a fast in that month in its memory. “Separating myself” means abstaining from food; a modern translation has “practice abstinence.”

      The rebuilding explains why they asked. With a new temple rising on the old site, the men from Bethel “may have been asking the priests of Jerusalem if the fast was to continue with the temple being reconstructed.”
    sources: [ot-minute-zech, nrsvue, lds-scriptures]

  - ref: 5
    phrase: in the fifth and seventh month, even those seventy years
    kind: history
    title: Two fasts and seventy years
    body: |
      The Lord’s answer names a second fast besides the one Bethel asked about. The seventh-month fast was not the Day of Atonement, which the law sets in the same month. By Jewish tradition it was kept “on account of the murder of the governor Gedaliah,” whom the king of Babylon set over those left in the land ([[2 Kgs. 25:22]]), killed by Ishmael “in the seventh month” ([[2 Kgs. 25:25]]). The four fasts of the exile, and the disaster each recalled, are set out at [[Zech. 8:19]], where the Lord turns them into feasts.

      “Those seventy years” are the same “threescore and ten years” the angel of the Lord lamented in the first vision; the note at [[Zech. 1:12]] explains the number.
    sources: [keil-zechariah, ot-manual-33, lds-scriptures]

  - ref: 5
    phrase: did ye at all fast unto me, even to me?
    kind: scripture
    title: Fasting to whom?
    body: |
      The Lord answers a question about keeping a fast with a question about whom the fast was for. Fasting “was regarded as a natural way of showing sorrow,” and the exiles’ fasts mourned real losses. But such observances “were, of course, liable to become mere formalities,” and verse 6 sets the fasting beside the feasting: their eating and drinking, at least, had plainly been for themselves. Verse 7 then asks whether they should not hear the former prophets.

      In the end “the Lord is indifferent whether men fast or eat; He desires that they execute judgment and show mercy (7:8–10).” What the Lord asks for in place of an answer about the fast is the justice and mercy of verses 9–10. The site’s note at [[Isa. 58:3]] takes up the same question in Isaiah.
    sources: [bd-fasts, bd-zechariah]

  - ref: 7
    phrase: the words which the LORD hath cried by the former prophets
    kind: history
    title: The former prophets
    body: |
      The verse itself dates the “former prophets”: they spoke “when Jerusalem was inhabited and in prosperity,” before the fall. It lists the whole kingdom as it was then: the city, its towns, “the south,” the Negeb, “the region south of Judah,” and “the plain,” the Shephelah, the low hills of the “strip west of Judaean mountains.”

      The point is that the answer to Bethel’s question had been given before the question was asked. The temple they mourned “had been destroyed because they had not listened to the word of the Lord,” and verses 8–14 spell out what that word had been.
    sources: [bdb, ot-minute-zech]

  - ref: 9
    phrase: Execute true judgment, and shew mercy and compassions every man to his brother
    kind: scripture
    title: What the former prophets had said
    body: |
      Verses 9–10 can be read as a quotation of the former prophets. The King James “Thus speaketh” and a modern translation’s “Thus says” are both present, but the Hebrew verb can be taken as past, “referring to what Jehovah had caused to be proclaimed to the people before the captivity,” and verse 11 goes straight on in the past: “But they refused.” The plain-words version above follows that reading and says “said.”

      “The kernel of this announcement consisted in the appeal to the people, to keep the moral precepts of the law, to practise the true love of the neighbour in public life and private intercourse.” “True judgment,” literally “judgment of truth,” is justice that looks at “the real circumstances of any dispute, without any personal considerations whatever.” The widow, the fatherless, the stranger and the poor are named again and again in the law and the earlier prophets ([[Isa. 1:17]]; [[Jer. 7:5–6]]). Jeremiah had given nearly the same charge before the fall: “Execute ye judgment and righteousness … do no violence to the stranger, the fatherless, nor the widow” ([[Jer. 22:3]]).

      Zechariah is not bringing a new demand; he is repeating one already refused.
    sources: [keil-zechariah, nrsvue, lds-scriptures]

  - ref: 12
    phrase: they made their hearts as an adamant stone
    kind: symbol
    title: Shoulder, ears, and heart
    body: |
      Verses 11–12 describe the refusal in three images: shoulder, ears and heart. “Pulled away the shoulder” is the image of a stubborn ox, “turning a stubborn shoulder … like an animal that refuses to bear the yoke.” The ears are stopped. And the heart is made “adamant,” the Hebrew *shamir*, a stone used as a figure of hardness: the same word describes the firmness the Lord gave His prophet, “As an adamant harder than flint have I made thy forehead” ([[Ezek. 3:9]]; see the note at [[Ezek. 3:8]]), and here it is “figurative of hard heart.”

      What they hardened themselves against is named too: “the law, and the words which the LORD of hosts hath sent in his spirit by the former prophets.” The instruction “had been mediated by the divine Spirit,” and they “willfully rejected” it. So the people refused the Spirit’s message, not only the prophets who carried it.
    sources: [ot-manual-33, bdb, lds-scriptures]

  - ref: 14
    phrase: for they laid the pleasant land desolate
    kind: history
    title: The ruin they had been mourning
    body: |
      The chapter ends by showing who caused the disaster the fasts mourned. Verse 13 is a punishment that matches the offence: “As they have not hearkened to the word of God, so will God, when they call upon Him, namely in distress … also not hear” (compare [[Jer. 11:11]]). Judah’s cry in its distress went unanswered because the Lord’s cry through the prophets had gone unanswered first.

      “The pleasant land” is the phrase of [[Jer. 3:19]] and [[Ps. 106:24]], and the last words lay the blame on the people themselves: “they laid the pleasant land desolate.” In this last line “the result of the stiff-necked obstinacy of the fathers is briefly stated.” The burned temple and the ruined towns that Bethel mourned every fifth month were the fruit of not hearing. The chapter leaves the question of the fast open; chapter 8 turns to the promise of “the restoration of His favour,” and only then answers it.
    sources: [keil-zechariah, lds-scriptures]

christ: |
  The footnote to the Lord’s question, “did ye at all fast unto me, even to me?”, points to Jesus’ teaching on fasting, which asks the same thing, whom a fast is for: a disciple fasts not “unto men” but “unto thy Father which is in secret,” and He “which seeth in secret, shall reward thee openly” ([[Matt. 6:16–18]]; [[3 Ne. 13:16–18]]). The link is the footnote’s cross-reference; the two passages share the question, not a context.

  The Church lists verses 9–10 among the ways a disciple turns to the Lord: “Treating others with mercy and compassion.” What the former prophets asked of Judah is still what the Lord asks of those who turn to Him: true judgment, mercy and compassion, and no oppression of the widow, the fatherless, the stranger or the poor.

explore: |
  - **The answer to the question.** [[Zech. 8:16–19]], where the fasts become feasts.
  - **The fast the Lord has chosen.** [[Isa. 58:3–12]]; [[Joel 2:12–13]]; [[Matt. 6:16–18]]; [[3 Ne. 13:16–18]].
  - **Refusing the prophets.** [[Neh. 9:26–30]]; [[2 Chr. 36:15–16]]; [[Ezek. 3:7–9]].
  - **The widow, the fatherless and the stranger.** [[Ex. 22:21–24]]; [[Deut. 10:17–19]]; [[Jer. 22:3]]; [[Mosiah 4:16–26]].

