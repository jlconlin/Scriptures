chapter: 1
title: Turn Ye unto Me, and I Will Turn unto You
tagline: Zechariah calls the exiles home from Babylon to turn to the Lord, and in a night vision learns that the Lord has already turned back to Jerusalem with mercies.
when: 'Zechariah prophesied in Jerusalem under Darius I of Persia, 520–518 B.C.'

setting: |
  Zechariah's first word came in the eighth month of the second year of Darius, late in 520 B.C., about two months after Haggai's first message ([[Hag. 1:1]]). The Jews who had come home from Babylon had laid the temple's foundation some fifteen years before. Poverty, friction with their neighbours and political disruption had since brought the work to a halt. Darius I was securely in power by 520, and the Lord raised up Haggai and Zechariah to spur His people on; the building resumed ([[Ezra 5:1–2]]), and the second temple was completed in 515 B.C.

  Verses 1–6 introduce the whole book with a call to repent, drawn from the example of the fathers. Three months later Zechariah saw a series of visions by night, all under one date (verse 7); this chapter holds the first two, and the series runs to 6:8. The first half of the book (chapters 1–8) brings words of encouragement during the rebuilding, with eight visions in all. The second (chapters 9–14) looks ahead to the ministry of Jesus Christ, the last days and His Second Coming.

  The Hebrew Bible divides the chapter differently: verses 18–21 open its chapter 2.

thread: |
  **Turn, and I will turn.** The chapter opens with the Lord's demand and His promise in one sentence: “Turn ye unto me … and I will turn unto you” (verse 3). The fathers would not turn when the earlier prophets called (verse 4); the Lord's words overtook them, and they turned and owned that He had dealt with them as He said He would (verse 6). The generation now home from Babylon is asked not to repeat that history.

  Then the visions show the other half of the promise. The returned exiles had grown impatient, with no sign yet that God was with them in their work. To them the Lord's patrol reports a world at rest (verse 11), the angel of the Lord pleads for Jerusalem (verse 12), and the Lord answers with comfort: He is jealous for Jerusalem, angry with the careless nations, and “returned to Jerusalem with mercies” (verse 16). The verb is the same as the “turn” of verse 3, and its form describes the Lord's return as already begun and still going on. The second vision adds that the powers that scattered Judah will themselves be thrown down (verses 18–21).

sections:
  - range: 1-6
    heading: Turn unto me
    plain: |
      In the eighth month of the second year of King Darius, the word of the Lord came to Zechariah, son of Berechiah, son of Iddo the prophet: The Lord was very angry with your fathers. So tell the people: This is what the Lord of hosts says: Turn back to me, and I will turn back to you. Don't be like your fathers. The earlier prophets called out to them, “Turn from your evil ways and your evil deeds,” but they would not listen or pay attention to me. Where are your fathers now? And the prophets, do they live forever? But my words and my decrees, which I gave my servants the prophets to speak, caught up with your fathers, didn't they? Then they turned and said, “The Lord of hosts has dealt with us just as He planned to, as our ways and our deeds deserved.”
  - range: 7-17
    heading: The horsemen among the myrtles
    plain: |
      On the twenty-fourth day of the eleventh month, the month Sebat, in the second year of Darius, the word of the Lord came to Zechariah. In the night I saw a man riding a red horse. He was standing among the myrtle trees in the hollow, and behind him were red, speckled and white horses. I asked, “What are these, my lord?” The angel who was speaking with me said, “I will show you what they are.” The man standing among the myrtles answered, “These are the ones the Lord has sent to go back and forth through the earth.” And they reported to the angel of the Lord who stood among the myrtles: “We have gone through the earth, and the whole earth is quiet and at rest.”

      Then the angel of the Lord said, “Lord of hosts, how long will you withhold mercy from Jerusalem and the cities of Judah, which you have been angry with these seventy years?” The Lord answered the angel who spoke with me with kind and comforting words. So the angel said to me, “Proclaim this: The Lord of hosts says, I am deeply jealous for Jerusalem and for Zion, and I am very angry with the nations that are at ease. I was only a little angry, but they added to the harm. So the Lord says: I have returned to Jerusalem with mercy. My house will be built there, and a measuring line will be stretched out over Jerusalem. Proclaim further: My cities will again overflow with prosperity; the Lord will again comfort Zion and again choose Jerusalem.”
  - range: 18-21
    heading: Four horns and four craftsmen
    plain: |
      Then I looked up and saw four horns. I asked the angel who spoke with me, “What are these?” He said, “These are the horns that scattered Judah, Israel and Jerusalem.” Then the Lord showed me four craftsmen. I asked, “What are they coming to do?” He said, “Those horns scattered Judah so that no one could lift his head, but these have come to terrify them and to throw down the horns of the nations that raised their horn against the land of Judah to scatter it.”

notes:
  - ref: 1
    phrase: Zechariah, the son of Berechiah, the son of Iddo the prophet
    kind: history
    title: Zechariah, son of Berechiah
    body: |
      Zechariah came from a priestly family. His name means “Jehovah remembers,” and his line goes back to the priest Iddo, who returned to Jerusalem with Zerubbabel ([[Neh. 12:4]]); a Zechariah heads Iddo's priestly house in the days of the high priest Joiakim ([[Neh. 12:12–16]]). Ezra names him beside Haggai as “Zechariah the son of Iddo” ([[Ezra 5:1]]).

      He is not the martyr Zacharias whom Jesus names in [[Matt. 23:35]].
    sources: [scripture-helps-hag-1-2, ot-minute-zech, bd-zechariah, wilson-zacharias]

  - ref: 3
    phrase: Turn ye unto me, saith the LORD of hosts, and I will turn unto you
    kind: words
    title: Turn, and I will turn
    body: |
      Repentance in this verse runs both ways. One Hebrew verb, *šûb*, “turn” or “return,” stands in both halves of the promise: the people turn back to the Lord, and He turns back to them. Turning, especially from evil, is the Old Testament's way of speaking of repentance, and the Book of Mormon sets the two verbs side by side: “Turn, all ye Gentiles, from your wicked ways; and repent of your evil doings” ([[3 Ne. 30:2]]).

      The verb runs through the chapter. The fathers were told to “turn” and would not (verse 4); they “returned” after His words had overtaken them (verse 6); and in the first vision the Lord says, with the same verb, “I am returned to Jerusalem with mercies” (verse 16). The call went to people who were already home: they had come back to Jerusalem, but many were still far from the Lord spiritually.

      The theme page [“I Am Returned with Mercies”](/zechariah/themes/i-am-returned-with-mercies/) follows the Lord's side of this promise through the book, to 13:7.
    sources: [oshb-wlc, ot-minute-zech, ot-institute-manual-48]

  - ref: 6
    phrase: did they not take hold of your fathers?
    kind: words
    title: Words that overtook the fathers
    body: |
      “Take hold of” is *hiśśîgû*, from a verb meaning “to reach, overtake”: the Lord's words are pictured as catching up with the fathers. Verse 5 grants what anyone could see: the fathers are dead, and so are the prophets who warned them. Verse 6 answers that the words were not. What the earlier prophets announced came to pass, and the fathers who had refused to hear were overtaken by God's judgments and acknowledged them to be just: “Like as the LORD of hosts thought to do unto us … so hath he dealt with us.”
    sources: [oshb-wlc, bdb, bd-zechariah]

  - ref: 8
    phrase: a man riding upon a red horse, and he stood among the myrtle trees that were in the bottom
    kind: symbol
    title: Horsemen among the myrtles
    body: |
      The riders are the Lord's patrol. Zechariah asks what they are, and the answer is that “the LORD hath sent” them “to walk to and fro through the earth” (verse 10): they go over the earth to report on the state of the nations in the interests of Jerusalem. What they report is the subject of the note on verse 11.

      The setting and the colours are harder, and the text explains neither. “The bottom” is a valley, most likely a deep hollow, perhaps with water in it, for myrtles grow best in damp ground. One reading takes the myrtle grove as a picture of the land the Lord holds dear, and the hollow as the low state into which it had fallen. The same reading takes red as the colour of blood and white as the colour of glory and victory, and finds the third colour, “speckled,” disputed.
    sources: [bd-zechariah, keil-zechariah, lds-scriptures]

  - ref: 9
    phrase: the angel that talked with me
    kind: scripture
    title: The angel who explains
    body: |
      Zechariah does not interpret his visions himself; an angel does, and he is named by what he does, “the angel that talked with me” (verses 9, 13, 14, 19, and on through chapter 6). A messenger who helps the prophet understand what he sees reflects a principle: a seer can see, but understanding comes with divine help ([[Moses 1:30]]; [[Moses 7:67]]). The chapter names him differently from “the angel of the LORD” who stands among the myrtles and pleads for Jerusalem (verses 11–12).

      Nephi had such a guide. An angel led him through his vision, directing his attention and asking questions to draw out his understanding, so that Nephi could write, “the angel of the Lord did make them known unto me” ([[1 Ne. 14:29]]). A guiding angel who explains a vision is a common feature of such scenes, and Zechariah 1–6 is one of the biblical examples set beside Nephi's ([[1 Ne. 11]]).
    sources: [ot-minute-zech, sc-knowhy-492, lds-scriptures]

  - ref: 11
    phrase: all the earth sitteth still, and is at rest
    kind: history
    title: Why a quiet earth was bad news
    body: |
      The patrol's report sounds like good news and is not. Four months earlier Haggai had promised that “yet once, it is a little while,” the Lord would “shake the heavens, and the earth,” and “the desire of all nations shall come” ([[Hag. 2:6–7]]); two months earlier, that He would “overthrow the throne of kingdoms” ([[Hag. 2:22]]). Time passed with no sign of it, and the people began to lose faith. In the second year of Darius the nations of the former Babylonian empire were at peace and prosperous, while Judah still lay largely waste. As long as the nations were undisturbed, Judah could expect no real change in its lot.

      So the angel of the Lord answers the report with a plea (verse 12), and the Lord's reply is anger with “the heathen that are at ease” (verse 15). The vision tells them that the Lord's messengers have seen exactly how things stand, and that He knows it. On the nations that “helped forward the affliction,” see the note on [[Isa. 47:6]].
    sources: [ot-manual-33, keil-zechariah]

  - ref: 12
    phrase: these threescore and ten years
    kind: history
    title: Seventy years
    body: |
      The number comes from Jeremiah, who foretold that the nations would “serve the king of Babylon seventy years” ([[Jer. 25:11]]; [[Jer. 29:10]]). The exile had not lasted exactly seventy years; the count can be made from an earlier start, or run until the temple was rebuilt. By Zechariah's day the number had come to stand for the exile itself, whatever its exact length. To the angel's “how long,” the Lord answers “with good words and comfortable words” (verse 13).
    sources: [ot-minute-zech, lds-scriptures]

  - ref: 16
    phrase: 'I am returned to Jerusalem with mercies: my house shall be built in it'
    kind: history
    title: The house shall be built
    body: |
      The promise was kept: His house was built, completed in 515 B.C. ([[Ezra 6:15]]). The “line” stretched over Jerusalem is a builder's measuring line, drawn over a city to mark off its space and its plan; the next vision takes it up ([[Zech. 2:1–2]]).

      The promise reaches past the building. On one reading the temple finished under Darius and the city restored under Nehemiah were a beginning of the fulfilment and a pledge of the glory the earlier prophets had foretold. God's feelings for Jerusalem in Zechariah's day, in the meridian of time and in the latter days are a prominent theme of the book.

      The theme page [“I Am Returned with Mercies”](/zechariah/themes/i-am-returned-with-mercies/) sets this “I am returned” beside the promise of 1:3 and the Lord's later turnings.
    sources: [vandyke-ogden-twelve, keil-zechariah]

  - ref: 18
    phrase: behold four horns
    kind: symbol
    title: Four horns and four craftsmen
    body: |
      The four horns are the powers that scattered Judah, Israel and Jerusalem (verse 19). A horn is the Old Testament's symbol of strength (compare [[Amos 6:13]]), and the kings of Mesopotamia wore horned crowns. Why there are four is not said. They may stand for the four corners of the earth, or for four empires, though which four is unclear: Assyria, Babylonia, Persia and Media if the vision looks back, or Assyria, Babylonia, Greece and Rome if it also looks ahead, as Daniel's visions do.

      The “carpenters” are craftsmen, sent “to fray” the horns, to terrify them and throw them down (verse 21). The vision does not say who they are; they are read as the divine agencies that counteract and destroy the powers the horns represent. One Latter-day Saint reading takes the craftsmen to be the temple builders: the Lord would answer the nations by restoring temple worship, which made finishing the temple all the more urgent.
    sources: [ot-minute-zech, ot-manual-33, bd-zechariah]

christ: |
  The Lord of hosts who says “Turn ye unto me … and I will turn unto you” is Jehovah, and Jehovah is the premortal Jesus Christ. In this chapter He answers a plea for mercy “with good words and comfortable words” (verse 13) and returns to His city “with mercies” (verse 16) before His house is finished. In the latter days He gives the same promise in His own name, the passage the footnote to verse 3 points to: “Draw near unto me and I will draw near unto you” ([[D&C 88:63]]).

  For a disciple, repentance is a turning that is met from the other side: as a person turns to God, God draws near and closes the gap.

explore: |
  - **The same months in Haggai.** [[Hag. 1–2]]: the stalled temple and the promise to shake the nations.
  - **The seventy years.** [[Jer. 25:11–12]]; [[Jer. 29:10]]; [[Dan. 9:2]].
  - **The measuring line taken up.** [[Zech. 2:1–5]].
  - **Another seer with an angelic guide.** [[1 Ne. 11–14]].
  - **Jerusalem in three times.** “Amos through Malachi: Major Teachings of the Twelve Prophets” (*Religious Educator*, Religious Studies Center), which follows Zechariah's hope for Jerusalem in his own day, in the meridian of time and in the latter days.

