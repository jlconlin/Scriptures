chapter: 11
title: The Shepherd They Valued at Thirty Pieces
tagline: The prophet is set to shepherd a flock marked for slaughter, with two staffs named Favour and Union. The flock rejects him and pays him thirty pieces of silver, so he breaks both staffs, and the flock is left to a worthless shepherd.
when: 'Undated; the book sets these prophecies with Zechariah, who prophesied 520–518 B.C.'

setting: |
  Chapter 11 closes the first of the book's two undated oracles, chapters 9–11. The setting of [[Zech. 9]] takes up the change at chapter 9 and who wrote these chapters. These chapters are among Zechariah's “prophecies about the Messiah and events preceding His Second Coming.” Chapter 10 had turned to the Lord angry at the shepherds of His flock and visiting the flock Himself ([[Zech. 10:3]]). Chapter 11 opens with a poem of falling cedars (verses 1–3) and then gives a symbolic act in three parts: “The prophet is commissioned to feed the flock destined for slaughter (11:4–8); renounces the thankless task (11:9–14); the flock falls into the hands of an evil shepherd (11:15–17).”

  The details are hard to place (“This vision is not entirely clear”), but the outline is plain, and the shepherd's story (verses 7–14) is read as a story of the Savior's mortal ministry. The chapter heading calls it a prophecy that “The Messiah will be betrayed for thirty pieces of silver,” and Matthew tells how that price was agreed, paid and thrown back ([[Matt. 26:14–16]]; [[Matt. 27:3–10]]). Why Matthew names Jeremiah for these words is taken up in the closing section of [[Jer. 19]], and the slave's price behind the sum in the note on [[Ex. 21:32]].

thread: |
  Zechariah 11 is the story of **a shepherd whom the flock would not have**.

  The Lord has watched men buy His sheep to kill them, men sell them and thank Him for the profit, and shepherds show them no pity (verses 4–5). So He sets the prophet to shepherd that flock, with two staffs named Favour and Union. The prophet does the work, but he and the flock come to loathe each other, and when he asks for his wages they weigh out thirty pieces of silver. The whole is read as an allegory of a shepherd whom his flock at last rejects.

  What follows is the cost of that refusal. The staffs are broken one after the other, the covenant and then the brotherhood (verses 10, 14), and the Lord hands the flock over to another shepherd, one who eats the sheep instead of feeding them (verses 15–17). In short, because the flock “repays His pastoral fidelity with ingratitude,” the Lord “gives it up into the hands of the foolish shepherd, who will destroy it, but who will also fall under judgment himself in consequence.”

sections:
  - range: 1-3
    heading: Wail, cedars of Lebanon
    plain: |
      Open your gates, Lebanon, so that fire can eat your cedars. Wail, fir tree, for the cedar has fallen and the mighty trees are ruined. Wail, oaks of Bashan, for the forest has come down. There is the sound of shepherds wailing, because their glory is ruined; the young lions are roaring, because the pride of the Jordan is laid waste.
  - range: 4-6
    heading: A flock marked for slaughter
    plain: |
      The Lord my God says: Shepherd the flock marked for slaughter. The men who buy them kill them and are never punished, and the men who sell them say, Blessed be the Lord, I am rich! Even their own shepherds have no pity on the flock. For I will no longer pity the people of the land, says the Lord. I will hand every one of them over to his neighbour and to his king. They will strike the land, and I will not rescue the people from them.
  - range: 7-14
    heading: Two staffs broken
    plain: |
      So I shepherded the flock marked for slaughter, the poor of the flock. I took two staffs; I named one Favour and the other Union, and I shepherded the flock. In one month I got rid of three shepherds. But I lost patience with the flock, and they detested me. So I said, I will not be your shepherd. Let the dying die, let those to be cut off be cut off, and let those who are left eat one another's flesh.

      I took my staff Favour and broke it, to break the covenant I had made with all the people. It was broken that day, and the poor of the flock who were watching me knew that it was the word of the Lord. I told them, If you think it right, pay me my wages; if not, keep them. So they weighed out my wages: thirty pieces of silver. The Lord said to me, Throw it to the potter, that fine price they set on Me! So I took the thirty pieces of silver and threw them to the potter in the house of the Lord. Then I broke my second staff, Union, to break the brotherhood between Judah and Israel.
  - range: 15-17
    heading: The worthless shepherd
    plain: |
      Then the Lord said to me, Take up once more the gear of a foolish shepherd. For I am going to raise up a shepherd in the land who will not care for the perishing, or look for the young, or heal the injured, or feed the sound, but will eat the meat of the fat sheep and tear their hooves apart. Woe to the worthless shepherd who deserts the flock! The sword will fall on his arm and on his right eye; his arm will wither completely, and his right eye will go blind.

notes:
  - ref: 1
    phrase: Open thy doors, O Lebanon
    kind: symbol
    title: Cedars that fall
    body: |
      The falling trees can be read as pride and power brought down. Lebanon and Bashan, in the north, “were known for their trees,” while Judah was dry country, and so “trees were a symbol of the nations’ pride and glory.” The Bible Dictionary sums up the three verses as an “Invasion of Lebanon and the Jordan-land.”

      The poem moves from the trees to the shepherds and young lions of verse 3, whose glory is spoiled. Nothing in the poem says who brings the fire, or when.
    sources: [ot-minute-zech, bd-zechariah]

  - ref: 4
    phrase: Feed the flock of the slaughter
    kind: history
    title: The prophet plays the shepherd
    body: |
      Zechariah is set to act as shepherd to a flock already marked for death, and what he does acts out the Lord's dealings with His people. The newest Church help calls it “an allegory in which Zechariah is a shepherd who is ultimately rejected by his flock.” Whether he acted it out or saw it (“whether in reality or in vision”) the text does not say.

      Verse 5 explains the flock's name. Its owners kill the sheep and are not punished, its dealers sell them and say “Blessed be the LORD; for I am rich,” and its own shepherds have no pity. The men who did this are not named; what is plain is their character: “They claimed to be guiltless but were prideful in their temporal riches.”
    sources: [scripture-helps-hag-1-2, ot-minute-zech]

  - ref: 7
    phrase: the one I called Beauty, and the other I called Bands
    kind: words
    title: Favour and Union
    body: |
      The King James “Beauty” and “Bands” hide the staffs' names, Favour and Union. “Beauty” is *nōʿam*, “delightfulness, pleasantness,” and so favour; “Bands” is *ḥōbĕlîm*, “union (literally binders).” Both are shepherd's staffs, “Beauty” (or Favor) and “Bands” (or Union), “and with them he fed his flock.”

      The names tell the reader what is lost when each is broken. Favour goes first, “that I might break my covenant which I had made with all the people” (verse 10); Union goes after the thirty pieces of silver, “that I might break the brotherhood between Judah and Israel” (verse 14). The two broken staffs stand for the broken covenant between God and His people and for the breakdown of unity within the house of Israel.
    sources: [oshb-wlc, bdb, sc-knowhy-56, scripture-helps-hag-1-2]

  - ref: 8
    phrase: Three shepherds also I cut off in one month
    kind: history
    title: Three shepherds in one month
    body: |
      No one knows who the three shepherds were; the passage as a whole is “not entirely clear.” Attempts to match them with three kings of the northern kingdom who fell close together ([[2 Kgs. 15:8–14]]) “have completely broken down,” since of those kings only Shallum “reigned an entire month.” An older commentary took the shepherds as “not individuals, but classes of men,” and specifically “the three imperial rulers, in whose power Israel continued from the times of the captivity to the time of Christ.” That is one reading among several; the text gives no names.

      The second half of the verse matters more to the story. Verse 9 turns at once on the flock (“I will not feed you”), so the loathing in verse 8 is more likely between the shepherd and the flock than between him and the three shepherds: the prophet “did not become disgusted with the three shepherds, but with his flock.”
    sources: [ot-minute-zech, keil-zechariah]

  - ref: 12
    phrase: So they weighed for my price thirty pieces of silver
    kind: christ
    title: Valued at thirty pieces of silver
    body: |
      The thirty pieces of silver are a wage that insults the shepherd. Thirty pieces of silver was “the price of a slave” (see the note on [[Ex. 21:32]]), “a meager price that reflected how little the people valued the shepherd who had been sent to care for them.” The Lord's comment in verse 13, “a goodly price that I was prised at of them,” “is apparently sarcasm.”

      The verse is tied to the betrayal of Jesus, and Matthew gives the same sum for Judas's bargain with the chief priests: “they covenanted with him for thirty pieces of silver” ([[Matt. 26:15]]).
    sources: [scripture-helps-hag-1-2, lds-scriptures]

  - ref: 13
    phrase: Cast it unto the potter
    kind: words
    title: Thrown to the potter
    body: |
      “Cast it unto the potter” is a gesture of contempt. The verb is the one for throwing a thing away, and with the scornful “goodly price” it shows “the actual casting away of the money.” The phrase “is apparently a proverbial expression for contemptuous treatment,” though “we have no means of tracing the origin of the phrase satisfactorily”; the potter made common things, and “earthen pots were things of insignificant worth.” The insult falls on the Lord Himself: He calls the sum the price “that I was prised at,” and since the prophet fed the flock in His name, “Jehovah regards the wages paid to His shepherd as paid to Himself.”

      The silver is thrown “to the potter in the house of the LORD.” Perhaps he had “some work to do there,” or had come “to bring some earthenware for the temple kitchens.” The place matters more than the man. The temple was “the place where the people appeared in the presence of their God,” and what was done there “was done before the face of God, that God might call His people to account for it.”
    sources: [keil-zechariah]

  - ref: 14
    phrase: the brotherhood between Judah and Israel
    kind: scripture
    title: The broken brotherhood
    body: |
      Breaking Union ends the brotherhood between Judah and Israel, but the passage may also look past the break. The date of this part of Zechariah is uncertain, yet it “seems to include an early reference to the scattering of Israel and then forward to the reunion and reestablishment of God’s people.”

      The broken staff may be set beside Ezekiel's two sticks, one “For Judah” and one “For Joseph,” joined “one to another into one stick” ([[Ezek. 37:16–17]]): “Perhaps this can be associated with Ezekiel’s vision of the two sticks,” whose promise is “that the people would be united in harmony.” Ezekiel's sticks “may also symbolize the ability of the Lord to shepherd and rule over these kingdoms.” These are readings, offered tentatively; chapter 11 itself ends with the staff broken.
    sources: [sc-knowhy-56, ot-minute-zech]

  - ref: 17
    phrase: Woe to the idol shepherd that leaveth the flock
    kind: words
    title: The worthless shepherd
    body: |
      The “idol shepherd” is a worthless one. The Hebrew *ʾĕlîl*, a word often used of idols as things of nothing, here makes him “the worthless shepherd”; the same word calls Job's comforters “physicians of no value” ([[Job 13:4]]). Verse 16 describes him by what he fails to do: he does not care for the perishing, look for the young, heal the broken or feed the sound, but eats the fat ones.

      The text does not name him. What it says is that the Lord raises him up (verse 16), and that can be read as judgment: “He is where he is by divine appointment (v. 16) and the scandalous acts which his wicked heart teaches him to perform are the Lord’s dread judgment on a people which rejected the true shepherd.” On that reading, a flock that would not have the good shepherd is given the other kind, and then the woe of verse 17 falls on that shepherd himself.
    sources: [oshb-wlc, bdb, ot-manual-33]

christ: |
  The Church reads this rejected shepherd as a figure of Christ. The allegory “points to the Good Shepherd, Jesus Christ,” who was “rejected by many of those whom He had been sent to shepherd,” valued at a slave's price, and whose price was thrown down in the temple ([[Matt. 27:3–7]]). An older commentary saw the same: the prophet represents one who does what “neither Zechariah nor any other prophet ever did, but only God through His Son.” Jesus called Himself the good shepherd: “I am the good shepherd: the good shepherd giveth his life for the sheep” ([[John 10:11]]).

  The Shepherd whom many refused still knows His own, and they know Him: “My sheep hear my voice, and I know them, and they follow me” ([[John 10:27]]).

explore: |
  - **The shepherds before Zechariah.** Read [[Ezek. 34]] and [[Jer. 23:1–4]] beside verses 4–5 and 15–17.
  - **The book's other shepherds.** Read [[Zech. 10:2–3]] and [[Zech. 13:7]].
  - **The price paid.** Read [[Matt. 26:14–16]] and [[Matt. 27:3–10]] with verses 12–13.
  - **The Good Shepherd.** Read [[John 10:1–18]].
  - **Two sticks made one.** Read [[Ezek. 37:15–28]] with verse 14.

