chapter: 12
title: They Shall Look upon Me Whom They Have Pierced
tagline: The second “burden” of Zechariah’s closing chapters. All nations gather against Jerusalem, and the Lord makes the city a cup that sends them reeling and a stone that wounds whoever lifts it. Then He pours out the spirit of grace on His people, and they look on the one they pierced and mourn for Him as for an only son.
when: 'Undated; the book sets these prophecies with Zechariah, who prophesied 520–518 B.C.'

setting: |
  Chapter 12 opens with the same heading as chapter 9, “The burden of the word of the LORD,” and the heading covers chapters 12–14 as a whole, the second of the two matching oracles that close the book. Like chapters 9–11 it carries no date and no prophet’s name; chapter 9’s setting describes that change and the question of authorship it raises ([[Zech. 9:1]]); on the word *burden*, a prophetic oracle, see [[Mal. 1:1]]. The Lord is introduced as Creator, “which stretcheth forth the heavens,” in titles that echo [[Isa. 42:5]], to remove all doubt that what He predicts will come to pass. The Bible Dictionary reads the whole of 9–14 as “prophecies about the Messiah and events preceding His Second Coming.”

  The horizon of this chapter is the last days. *Scripture Helps* reads chapters 12–14 as a final battle in and around Jerusalem just before the Second Coming, the battle often called Armageddon. In this chapter the attack fails and the Lord defends the city (verses 2–9); in chapter 14 the Lord stands on the mount of Olives. The site’s notes on [[Joel 3:12]] and [[Ezek. 38:8]] treat the same war.

  The chapter is also one of the Old Testament passages the New Testament found fulfilled in Jesus. The Church pairs verse 10 with John’s account of the Crucifixion and with John’s vision of the Second Coming ([[John 19:37]]; [[Rev. 1:7]]), and in [[D&C 45:51–53]] the Lord expands Zechariah’s prophecy in His own words.

thread: |
  Two deliverances follow one another. The first is outward: Jerusalem besieged by all the nations, and the Lord turning the siege back on the besiegers. The city becomes a cup they cannot hold down and a stone they cannot lift; the Lord strengthens the feeble until they are like David; He saves the tents of Judah first, so that neither David’s house nor Jerusalem can boast over the rest.

  The second deliverance is inward, and it is not the price of the first but its fruit. Having saved His people, the Lord pours on them “the spirit of grace and of supplications,” and they see. The one they look upon is the Lord who speaks (“me whom they have pierced”), and yet they mourn for “him.” Recognition turns into grief, the deepest kind, for an only son and a firstborn, and the grief spreads to every family in the land. The deliverance at Jerusalem prepares the Jews to recognize and accept Jesus Christ as the Messiah, and the next chapter opens on the fountain that cleanses them ([[Zech. 13:1]]).

sections:
  - range: 1-4
    heading: A cup and a stone for the nations
    plain: |
      An oracle, the word of the LORD concerning Israel. So says the LORD, who stretches out the heavens, lays the foundation of the earth, and forms the spirit of man within him: I am going to make Jerusalem a bowl of wine that sends all the surrounding peoples reeling; and when Jerusalem is besieged, Judah too will be under siege. On that day I will make Jerusalem a heavy stone for all the peoples: everyone who tries to lift it will be badly hurt, even though all the nations of the earth gather against it. On that day, says the LORD, I will strike every horse with confusion and its rider with madness. I will keep My eyes open over the house of Judah, but strike every horse of the peoples with blindness.
  - range: 5-9
    heading: The Lord defends Jerusalem
    plain: |
      Then the leaders of Judah will say to themselves, “The people of Jerusalem are our strength, through the LORD of hosts their God.” On that day I will make Judah’s leaders like a blazing hearth among firewood and a flaming torch among sheaves: they will burn up all the surrounding peoples on the right and on the left, while Jerusalem stays where it is, in its own place. The LORD will save the tents of Judah first, so that the glory of David’s house and of Jerusalem’s people will not be exalted over Judah. On that day the LORD will shield Jerusalem’s people: the one among them who stumbles will be like David, and the house of David like God, like the angel of the LORD going before them. On that day I will set out to destroy all the nations that come against Jerusalem.
  - range: 10-14
    heading: The mourning for the pierced one
    plain: |
      I will pour out on David’s house and on Jerusalem’s people a spirit of grace and of pleading for mercy. They will look to Me, the one they pierced, and they will mourn for him as one mourns for an only son, and grieve bitterly for him as one grieves for a firstborn. On that day the mourning in Jerusalem will be as great as the mourning at Hadadrimmon in the valley of Megiddo. The land will mourn, each family by itself: the family of David’s house by itself and their wives by themselves; the family of Nathan’s house by itself and their wives by themselves; the family of Levi’s house by itself and their wives by themselves; the family of Shimei by itself and their wives by themselves; and all the remaining families, each by itself, and their wives by themselves.

notes:
  - ref: 2
    phrase: a cup of trembling
    kind: symbol
    title: A cup that makes the nations reel
    body: |
      The “cup of trembling” is a cup of wine that leaves those who drink it staggering. The Hebrew is *sap raʿal*, a “goblet of reeling,” used figuratively of Jerusalem; the second word occurs only here. Isaiah had used the image of Jerusalem drinking the Lord’s judgment, the city that had “drunken the dregs of the cup of trembling” ([[Isa. 51:17]]). Here the roles change: Jerusalem no longer drinks the cup but is the cup, and the nations who come against her are the ones left unable to stand. The Lord makes it so (“I will make Jerusalem”), and on one Latter-day Saint reading there is no battle at all: when the nations arrive to attack, they simply tremble in a drunken stupor.
    sources: [bdb, ot-minute-zech]

  - ref: 3
    phrase: a burdensome stone for all people
    kind: symbol
    title: A stone too heavy to lift
    body: |
      The second image raises the stakes. A “burdensome stone” is a stone too heavy to lift, and those who try to heave it up “shall be cut in pieces.” The picture is probably of a man straining at a boulder “too heavy for a man’s strength”: nations that set out to capture and rule Jerusalem “will find it difficult.” The circle widens as well, from “the people round about” in verse 2 to “all the people of the earth” here.

      A devotional reading hears more in the stone. Jerusalem, the place of the Crucifixion, may here foreshadow the Atonement: the city becomes a stumbling block that must be faced, as the cross is a stumbling block to many (“we preach Christ crucified, unto the Jews a stumblingblock,” [[1 Cor. 1:23]]). That reading is offered as one, not as the verse’s plain sense.
    sources: [ot-manual-33, ot-minute-zech]

  - ref: 3
    phrase: though all the people of the earth be gathered together against it
    kind: history
    title: All nations against Jerusalem
    body: |
      The Church reads this gathering as the last war before the Second Coming: “a great final battle that will take place in and around Jerusalem in the last days, just prior to the Second Coming of Jesus Christ,” often called Armageddon. Chapters 12–14 tell parts of that story and give insight into some of the events of the Second Coming. Chapter 12 gives the defense: just when the city seems about to fall, the Lord intervenes. Chapter 14 gives His coming to the mount of Olives ([[Zech. 14:4]]).

      The decisive blows in this chapter are the Lord’s. He strikes the horses with confusion and the riders with madness, while He keeps His own eyes open over Judah (verse 4). How the battle relates to Joel’s valley of Jehoshaphat and to Ezekiel’s Gog is treated in those chapters ([[Joel 3:12]]; [[Ezek. 38:8]]).
    sources: [scripture-helps-hag-1-2, sc-knowhy-790]

  - ref: 7
    phrase: The LORD also shall save the tents of Judah first
    kind: history
    title: The victory is the Lord’s
    body: |
      The Lord orders the rescue so that no part of His people can boast over another. He saves “the tents of Judah” first, and the verse gives the reason: so that the glory of David’s house and of Jerusalem’s people “do not magnify themselves against Judah.” Judah’s leaders will burn through the enemy like fire (verse 6), but the people take part and the Lord is the victor: it is He who will “defend the inhabitants of Jerusalem” (verse 8), and the glory is His.

      The strength He gives reaches the weakest. “He that is feeble” renders a word for one who totters or stumbles, the same word Hannah used when she sang that “they that stumbled are girded with strength” ([[1 Sam. 2:4]]). In that day the stumbler will be “as David.”
    sources: [ot-minute-zech, bdb]

  - ref: 10
    phrase: the spirit of grace and of supplications
    kind: words
    title: The spirit of grace and of supplications
    body: |
      What the Lord pours out is a spirit of His favor and of prayer for it. *Grace* (Hebrew *ḥēn*) is favor or acceptance, and here, as in “Grace, grace unto it” ([[Zech. 4:7]]), it is favor with God. *Supplications* (*taḥănûnîm*) are pleas for favor, made to God. The two belong together: the people who receive the Lord’s grace begin to pray for it.

      The Spirit is also what lets them see. The people look on the one they pierced only after the Lord pours out His spirit: “their eyes were opened to understanding only after they received a witness by the Spirit.” The site’s chapter on Ezekiel 39 sets this verse beside Ezekiel’s promise of the Spirit poured out on Israel ([[Ezek. 39:29]]).
    sources: [bdb, ot-minute-zech]

  - ref: 10
    phrase: they shall look upon me whom they have pierced
    kind: christ
    title: Me whom they have pierced
    body: |
      The one who was pierced is the LORD who is speaking. The Hebrew says “upon me” (*ʾēlay*), and the speaker is the LORD of verse 1, who stretched out the heavens. “Pierced” (*dāqar*) means to thrust through, to put to death. Then, in the same sentence, the pronoun changes: “they shall mourn for *him*” (*ʿālāyw*). One reading takes the shift from “me” to “him” as pointing to one slain who is one with the LORD and yet personally distinct.

      For Latter-day Saints the riddle of a LORD who can be pierced has a plainer answer: “Jehovah is the premortal Jesus Christ and came to earth being born of Mary.” The LORD who speaks could be pierced because He came to earth as a mortal. John saw the verse fulfilled when a soldier’s spear opened Jesus’ side on the cross: “And again another scripture saith, They shall look on him whom they pierced” ([[John 19:37]]). John’s vision carries it on to the Second Coming: “every eye shall see him, and they also which pierced him” ([[Rev. 1:7]]). The Church reads the verse with both passages, and in modern revelation the Lord tells the Jews what those wounds are and who He is ([[Zech. 13:6]]; [[D&C 45:51–52]]).
    sources: [oshb-wlc, keil-zechariah, bd-jehovah, sc-knowhy-790, cfm-ot-2026-50]

  - ref: 10
    phrase: they shall mourn for him, as one mourneth for his only son
    kind: christ
    title: Mourning as for an only son
    body: |
      The verse names the two griefs that cut deepest in Israel, for an only son and for a firstborn. Amos used the same comparison for the bitterest day he could describe, “as the mourning of an only son” ([[Amos 8:10]]). That is how the people will mourn when they recognize whom they pierced.

      In the Church’s reading the deliverance at Jerusalem prepares the Jews to recognize and accept Jesus Christ as the Messiah, and modern revelation describes the moment. When He shows them His wounds and tells them who He is, “then shall they weep because of their iniquities; then shall they lament because they persecuted their king” ([[D&C 45:53]]). The wounds He speaks of there are tied to the wounds of this verse, so section 45 expands Zechariah’s prophecy of this mourning in the Lord’s own words.
    sources: [scripture-helps-hag-1-2, sc-knowhy-790]

  - ref: 11
    phrase: the mourning of Hadadrimmon in the valley of Megiddon
    kind: history
    title: The mourning in the valley of Megiddo
    body: |
      The likeliest explanation of “the mourning of Hadadrimmon” is the national grief for the good king Josiah, who was mortally wounded fighting Pharaoh Necho in the valley of Megiddo ([[2 Chr. 35:22–24]]). An ancient tradition recorded by Jerome places a town called Hadadrimmon in that plain. The lament for Josiah was remembered for generations: “And Jeremiah lamented for Josiah: and all the singing men and the singing women spake of Josiah in their lamentations to this day” ([[2 Chr. 35:25]]). Zechariah compares the mourning for the pierced one to that great national mourning.

      The valley has a second meaning for readers of prophecy. Megiddo, which Zechariah calls “the valley of Megiddon,” is the place behind the name Armageddon, a Greek form of the Hebrew *Har Megiddo*, “Mountain of Megiddo.”
    sources: [keil-zechariah, bd-megiddo, scripture-helps-hag-1-2]

  - ref: 12
    phrase: And the land shall mourn, every family apart
    kind: prophets
    title: Every family apart
    body: |
      President Joseph Fielding Smith read the family-by-family mourning as the Jews’ acceptance of Christ in the last days: “Then they will accept Him as their Redeemer, which they have never been willing to do. Then is the time as spoken of in this passage from Zechariah when every family will go and mourn apart.” After the grief, he said, “will come their redemption and the building of Jerusalem.”

      The mourning is not guilt for the Crucifixion laid on a later generation. Israel’s recognition of Jesus begins “the long-awaited collective repentance and conversion of the Jews. This is not repentance for the death of Christ, for these Jews are not guilty of that. Rather, it is the same repentance that all who come unto Christ must go through.”
    sources: [ot-manual-33, sc-knowhy-790]

  - ref: 12
    phrase: the family of the house of Nathan apart
    kind: history
    title: David, Nathan, Levi, Shimei
    body: |
      The four families named are most likely two of the royal tribe and two of the priestly one. David’s house and Levi’s house are clear. Nathan is most likely not the prophet but David’s son, from whom, in Luke’s genealogy, both Zerubbabel and Jesus descend: “which was the son of Nathan, which was the son of David” ([[Luke 3:27]], [[Luke 3:31]]). “The family of Shimei” (verse 13) is then the Levite family of Shimei, Gershon’s son: “Of Gershon was the family of the Libnites, and the family of the Shimites” ([[Num. 3:21]]).

      For each of the two tribes, the king’s and the priest’s, the verse names a leading family and a branch beneath it, so that every branch of the nation is seen to share the grief, from the house of the king down to “all the families that remain” (verse 14).
    sources: [keil-zechariah]

christ: |
  The LORD who “formeth the spirit of man” (verse 1) speaks of Himself as the one whom His people “have pierced” (verse 10), and Latter-day Saints know Him: Jehovah is the premortal Jesus Christ, who was born of Mary and wounded on the cross. John saw the verse fulfilled at Golgotha ([[John 19:37]]), and in modern revelation the Lord promises to show those wounds to the Jews in the day of their deliverance and say, “I am Jesus that was crucified” ([[D&C 45:52]]). The chapter’s great mourning gives way to cleansing: the next chapter opens a fountain “for sin and for uncleanness” ([[Zech. 13:1]]).

  Recognizing Christ is still the Spirit’s gift: by the Spirit disciples find Him. The same spirit of grace that opens eyes to the pierced one brings a knowledge of sin and a prayer for forgiveness, and the repentance it brings is the one all who come to Christ pass through, so sorrow for sin in a disciple now is itself a work of grace.

explore: |
  - **The cup of trembling.** [[Isa. 51:17–23]], where the cup passes from Jerusalem to her tormentors.
  - **The pierced one.** [[John 19:31–37]]; [[Rev. 1:7]]; [[D&C 45:47–53]].
  - **The last battle.** [[Zech. 14:1–9]]; [[Joel 3:9–17]]; [[Ezek. 38–39]].
  - **The Spirit poured out.** [[Ezek. 39:29]]; [[Joel 2:28–29]].

