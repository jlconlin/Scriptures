chapter: 10
title: I Will Hiss for Them, and Gather Them
tagline: A flock that asked its idols for rain wandered off with no shepherd. Now the LORD of hosts takes the flock into His own care, raises leaders out of Judah, and whistles the scattered house of Joseph home from Egypt and Assyria in a second exodus.
when: 'Undated; the book sets these prophecies with Zechariah, who prophesied 520–518 B.C.'

setting: |
  Chapter 10 belongs to the second half of the book (chapters 9–14): “prophecies about the Messiah and events preceding His Second Coming.” Who wrote the second half, and when, is taken up at [[Zech. 9:1]].

  The chapter runs on from chapter 9 without a break. The promise there that Judah and Ephraim “shall no more seek to diviners, but to the Lord” reaches into 10:2, and the rest of the chapter is “a similar theme. Good shepherds displace the evil ones; Judah miraculously strengthened, with Ephraim fully restored, shall humble the pride of Assyria and Egypt.”

  Two houses are in view. Judah had been taken to Babylon and had come back. The house of Joseph, the northern tribes, had been carried captive into Assyria long before. “From there they became lost to the records of mankind.” Zechariah promises that both would come home.

  The promise came true at first “in weak commencements only,” in “the return of many Jews out of captivity” before the coming of Christ. The Church reads verses 5–9 and 12 beside the latter-day gathering of [[D&C 45:66–71]] (the note on verse 12).

thread: |
  The chapter is about shepherds. It opens with a people who asked their idols for rain and were left like sheep with no shepherd (verses 1–2). Then the LORD of hosts turns on the shepherds who misled them and takes the flock into His own care: in Hebrew the verb that punishes the he-goats is the verb that “visits” the flock (verse 3). Out of Judah He raises its own leaders (verse 4), and from verse 6 on nearly every verb is His: I will strengthen, save, bring again, hiss, gather, sow, bring, strengthen.

  The flock that wandered into exile is whistled home, out of Egypt and Assyria, through the sea as in the days of Moses, until the land cannot hold them. The chapter ends where it began, with a people who look to the Lord, now strong “in the LORD” and walking in His name (verse 12).

sections:
  - range: 1-2
    heading: Ask the Lord, not the idols
    plain: |
      Ask the LORD for rain in the season of the spring rains. It is the LORD who makes the lightning that brings the storm, and He gives showers of rain, green growth in the field for everyone. The household idols speak nonsense, the diviners see lies and tell empty dreams; their comfort is worthless. That is why the people wandered off like sheep and were oppressed: they had no shepherd.
  - range: 3-5
    heading: The Lord visits His flock
    plain: |
      My anger burns against the shepherds, and I have punished the he-goats that led the flock; for the LORD of hosts has come to care for His flock, the house of Judah, and will make them like His own majestic horse in battle. From Judah will come the cornerstone, from Judah the tent peg, from Judah the battle bow, from Judah every ruler together. They will be like warriors trampling the enemy into the mud of the streets in battle. They will fight because the LORD is with them, and the horsemen will be put to shame.
  - range: 6-12
    heading: Judah and Joseph brought home
    plain: |
      I will strengthen the house of Judah and save the house of Joseph. I will bring them back and settle them, because I have compassion on them, and they will be as if I had never rejected them; for I am the LORD their God, and I will answer them. Ephraim will be like a warrior, their hearts glad as with wine; their children will see it and rejoice; their hearts will rejoice in the LORD. I will whistle for them and gather them, for I have redeemed them, and they will grow as many as they were before. I will sow them among the nations, and in far countries they will remember Me; they will live, they and their children, and come back. I will bring them home from the land of Egypt and gather them from Assyria, and bring them into Gilead and Lebanon, until there is not room enough for them. The LORD will pass through the sea of affliction and strike its waves, and all the depths of the Nile will dry up; the pride of Assyria will be brought down, and the sceptre of Egypt will pass away. I will make them strong in the LORD, and they will walk in His name, says the LORD.

notes:
  - ref: 1
    phrase: Ask ye of the LORD rain in the time of the latter rain
    kind: symbol
    title: Ask the Lord for rain
    body: |
      The chapter begins by sending the people to the true giver of rain, and the next verse names the false ones. The latter rain is the spring rain, which “comes in March and April”; the seasons of rain are explained at [[Joel 2:23]]. Rain was a covenant gift: the footnote points to the promise of “the first rain and the latter rain” ([[Deut. 11:14]]) to a people who would “hearken diligently unto my commandments” ([[Deut. 11:13]]).

      Verses 1 and 2 therefore set “two opposite responses that the people can give: drawing near to the Lord or to idols.” The Lord answers with clouds, showers and grass for everyone who asks; “The Lord is true to His covenants. However, idols and diviners can only speak lies.” The command is not a general piety. It is a choice about whom Judah will ask for its harvest.
    sources: [bd-rain, ot-minute-zech, lds-scriptures]

  - ref: 2
    phrase: For the idols have spoken vanity
    kind: history
    title: Teraphim, diviners, and a flock with no shepherd
    body: |
      Verse 2 explains why the people needed the summons of verse 1: they had asked the wrong powers, and exile followed. The “idols” are *hattərāpîm*, the teraphim, man-sized images used “in worship and for magical purposes.” Using them “was probably not to worship strange gods but to worship the true God in a corrupt manner,” and people looked to them for “the blessings of earthly prosperity,” the very blessings verse 1 tells Judah to ask of the Lord. The diviners and dreamers belong with them.

      “Therefore they went their way as a flock” names the result. The verb is the one used for pulling up tent pegs to move camp, and here it means “wandering into exile”: “because Israel had trusted in teraphim and soothsayers, it would have to wander into exile.” “No shepherd” means no king: Israel was oppressed because it had lost the house of David’s throne when the kingdom fell, a flock like the one Moses asked the Lord not to leave “as sheep which have no shepherd” ([[Num. 27:17]]).
    sources: [oshb-wlc, bd-teraphim, keil-zechariah]

  - ref: 3
    phrase: Mine anger was kindled against the shepherds, and I punished the goats
    kind: words
    title: Shepherds, he-goats, and a war horse
    body: |
      The shepherds and goats are leaders, and verse 3 turns on one verb used two ways. The “goats” are the he-goats that walk at the head of a flock, a figure for “princes and chief men,” as in Ezekiel’s judgment “between the rams and the he goats” ([[Ezek. 34:17]]). The verse does not name them. They are leaders who “should have led the people in righteousness” and instead “had kindled the Lord’s anger,” and the chapter’s outcome is that “Good shepherds displace the evil ones.”

      “I punished” and “hath visited” are the same Hebrew verb, *pāqad*. Against the goats it brings punishment; with the flock as its object it means to attend to the sheep, to look after them. Jeremiah had made the same turn on the same word against the shepherds of his day: they “have not visited them: behold, I will visit upon you the evil of your doings” ([[Jer. 23:2]]).

      Then the flock becomes a horse. The “goodly horse” is “the horse of his majesty,” a majestic war horse: sheep that had been driven about are made, in the Lord’s hands, into a horse fit for battle.
    sources: [bd-zechariah, ot-minute-zech, bdb, oshb-wlc]

  - ref: 4
    phrase: Out of him came forth the corner, out of him the nail
    kind: christ
    title: From Judah, the cornerstone
    body: |
      The verse promises that Judah will produce its own leaders, and the Church’s footnote carries its first image to Christ. “The corner” is the cornerstone, and the footnote sends the reader to the stone “the builders refused” ([[Ps. 118:22]]) and to [[Matt. 21:42]], where Jesus applies that psalm to Himself.

      In its own setting, “out of him” means out of Judah, and the sense is future (the first three lines have no verb of their own): “From Him will be corner-stone, from Him the nail, from Him the war-bow; from Him will every ruler go forth at once.” The cornerstone is the stone “upon which the whole building stands firmly.” The nail is a peg, “a suitable figure for the supports or upholders of the whole political constitution,” as with Eliakim in [[Isa. 22:23]] (see the note there). The bow stands for “weapons of war and the military power.” “Oppressor” (*nōgēś*) is the word for a taskmaster, and in [[Zech. 9:8]] it named the foreign oppressor who would pass through no more. Whether it turns good here is disputed: the lexicon reads it as “ruler (good sense),” while another reading holds that it “is not applied to a leader or ruler in a good sense even here.”

      How far to carry the images is a matter of reading. One reading keeps every line on Judah’s coming leaders. Another holds that “each one of the four is undoubtedly Messianic. The ultimate reference is to the Lion of the tribe of Judah, by whose aid His people will conquer every foe.”
    sources: [lds-scriptures, keil-zechariah, bdb, ot-manual-33]

  - ref: 6
    phrase: I will save the house of Joseph
    kind: history
    title: Joseph brought home with Judah
    body: |
      “The house of Joseph” is the northern kingdom, and naming it beside Judah promises that the tribes lost long before would come home too. The two houses stand for “the kingdom in the south” and “the kingdom of Ephraim in the north.” The northern tribes had been taken by Assyria and had disappeared: “Ten tribes were carried captive into Assyria. From there they became lost to the records of mankind. (Obviously, the ten tribes are not lost to the Lord.)”

      So the promise reached past Judah’s own return to the split between the kingdoms. “In other words, old divisions would be healed and all would return home.” Ezekiel gives the same promise in the two sticks of Judah and Joseph joined in one hand ([[Ezek. 37:16–17]], with its notes).
    sources: [ot-minute-zech, nelson-gathering]

  - ref: 7
    phrase: they of Ephraim shall be like a mighty man
    kind: prophets
    title: Ephraim in the last days
    body: |
      Zechariah gives Ephraim a warrior’s strength and joy, and the Restoration gives Ephraim a part in the gathering the chapter describes. Ephraim “was given the birthright in Israel,” and “in the last days it has been the tribe of Ephraim’s privilege first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel.” Elder Russell M. Nelson put it plainly: “The lineage of Joseph, through Ephraim and Manasseh, is the seed appointed to lead in the gathering of Israel.”

      The footnote to “Ephraim” points to the revelation in which the returning tribes are “crowned with glory, even in Zion, by the hands of the servants of the Lord, even the children of Ephraim” ([[D&C 133:32]]). In Zechariah, Ephraim is among those gathered; in the latter-day reading, Ephraim also does the gathering.
    sources: [bd-ephraim, nelson-exodus-repeated, lds-scriptures]

  - ref: 8
    phrase: I will hiss for them, and gather them
    kind: words
    title: The Lord whistles for His flock
    body: |
      To “hiss” is to whistle, and here it is the Lord’s signal for His scattered people to come home. The verb means “hiss, perhaps also whistle, pipe,” and with the Lord as its subject it is a signal. Isaiah used it the other way: the Lord “will lift up an ensign to the nations from far, and will hiss unto them from the end of the earth” ([[Isa. 5:26]]), calling them against His people. Zechariah turns the same whistle into a call home. (Elsewhere the word means hissing in scorn, as in [[Jer. 19:8]], which is why it can sound harsh in English.)
    sources: [bdb]

  - ref: 9
    phrase: I will sow them among the people
    kind: words
    title: Sown among the nations
    body: |
      Zechariah’s word for Israel among the nations is “sow,” a farmer’s word. The Hebrew verb is *zāraʿ*, to sow. Hosea uses it for the Lord sowing Israel in its own land ([[Hos. 2:23]]); Zechariah has Him sow them “among the people.” The chapter heading reads the verse as a scattering among the people in far countries, and the verb pictures that scattering as seed put into the ground.

      The rest of the verse says what comes up: in far countries they will remember the Lord, live with their children, and turn again. The footnote points to Moses’ promise that Israel would “call them to mind among all the nations” ([[Deut. 30:1]]) and return, “thou and thy children” ([[Deut. 30:2]]).
    sources: [bdb, lds-scriptures]

  - ref: 11
    phrase: he shall pass through the sea with affliction
    kind: symbol
    title: A second exodus
    body: |
      Verses 10 and 11 describe the return as a new exodus. Egypt is named “simply as a type of the land of bondage,” and Assyria “as the land into which the ten tribes had been afterwards exiled.” Egypt held real exiles too: after Jerusalem fell, “there was a group who had fled to Egypt in the wake of Babylonian destruction.” Verse 11 then shows “the redemption of Israel out of the countries named … under the type of the liberation of Israel out of the bondage of Egypt under the guidance of Moses”: a passage through the sea, its waves struck, the river dried up. Gilead and Lebanon are the old lands of the northern tribes, the one “to the east of the Jordan, the latter that to the west.”

      Isaiah had used the same picture of the same return, and the footnote points to it: the Lord will “utterly destroy the tongue of the Egyptian sea” and smite the river ([[Isa. 11:15]]), and there will be “an highway for the remnant of his people, which shall be left, from Assyria; like as it was to Israel in the day that he came up out of the land of Egypt” ([[Isa. 11:16]]). The God who brought Israel out of Egypt once will do it again.
    sources: [keil-zechariah, ot-minute-zech, lds-scriptures]

  - ref: 12
    phrase: they shall walk up and down in his name
    kind: scripture
    title: Strengthened in the Lord
    body: |
      The chapter ends with Israel’s strength placed in the Lord, and the Church reads its promise with a latter-day revelation. What it means to walk in His name is taken up at [[Micah 4:5]].

      Verses 5–9 and 12 are set beside [[D&C 45:66–71]], the revelation of the New Jerusalem, where “the righteous shall be gathered out from among all nations, and shall come to Zion, singing with songs of everlasting joy” ([[D&C 45:71]]). Read together, Zechariah’s gathering of Judah and Joseph becomes a promise of what the Savior will do for His covenant people before His Second Coming.
    sources: [ot-institute-manual-48, lds-scriptures]

christ: |
  The chapter turns on a flock that wandered “because there was no shepherd” and on the LORD who comes to care for it Himself. Read with [[John 10:7–15]], it teaches that “Jesus Christ is the true shepherd of our souls.” Read with [[D&C 45:66–71]], its promise of gathering teaches that “Jesus Christ will return in the last days and gather, save, and protect His people.”

  That gathering reaches a disciple wherever he or she lives, for “the choice to come unto Christ is not a matter of physical location; it is a matter of individual commitment.” The people once sent to ask the Lord rather than their idols for rain (verse 1) are the people He strengthens “in the LORD” (verse 12), and the Shepherd who whistles them home says of them, “I have redeemed them” (verse 8).

