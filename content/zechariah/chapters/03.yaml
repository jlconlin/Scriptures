chapter: 3
title: The High Priest Made Clean
tagline: In the fourth night vision, Joshua the high priest stands in filthy garments before the angel of the Lord, with the accuser at his right hand. The Lord rebukes the accuser, has the filthy garments taken away, sets a clean turban on Joshua's head, and makes him and his fellow priests a sign of the coming Branch, who will remove the land's iniquity in one day.
when: 'Zechariah prophesied in Jerusalem under Darius I of Persia, 520–518 B.C.'

setting: |
  Chapter 3 is the fourth of the visions Zechariah saw “by night” ([[Zech. 1:8]]), dated “the four and twentieth day of the eleventh month … in the second year of Darius” ([[Zech. 1:7]]). The rebuilding of the temple had resumed five months earlier ([[Hag. 1:14–15]]). After visions of horsemen, horns and a measuring line ([[Zech. 1:8]]; [[Zech. 1:18]]; [[Zech. 2:1]]), this one shows a single man, “Joshua the high priest,” in filthy garments before the angel of the Lord.

  Joshua served as high priest beside Zerubbabel, the governor, and descended from Josedech, the last high priest before the Babylonian captivity ([[Hag. 1:1]]). The returning exiles had to redefine their faith, and part of Zechariah's message was that only a holy people could make Jerusalem holy again. The vision may reflect what the people felt: their condition awakened “a sense of their sin, and the fear that the Lord had not returned to them in truth.”

  The vision speaks first to Zechariah's own day, to a high priest and a discouraged people. Through the Branch of verse 8 it reaches past them to the Messiah. Zechariah takes up the Branch again in [[Zech. 6:11–13]], where crowns are set on Joshua's head and the Branch is to “be a priest upon his throne.”

thread: |
  The chapter moves from accusation to cleansing to promise. Joshua stands in the Lord's court with no defense of his own: his garments are filthy, and the accuser stands ready. The defense comes from the Lord. He rebukes the accuser because He has chosen Jerusalem and has snatched this man from the fire, and then He takes the filth away with a word: “I have caused thine iniquity to pass from thee.”

  Cleansing leads to calling. The clean priest is promised a place in the Lord's house and among those who stand in His presence, if he walks in the Lord's ways. Then the vision turns from Joshua to the one he foreshadows. Joshua and his fellows are a sign; the comfort of the vision is that the Lord's forgiveness is with the people, dispensed through the ministries among them, and that “these ministries are but types of a more perfect one,” the Branch, through whom the Lord will remove the iniquity of the land in one day.

sections:
  - range: 1-5
    heading: The accuser rebuked, the priest reclothed
    plain: |
      The LORD showed me Joshua the high priest standing before the angel of the LORD, and the Accuser standing at his right hand to accuse him. The LORD said to the Accuser, “The LORD rebuke you, Accuser! The LORD who has chosen Jerusalem rebuke you! Isn't this man a burning stick snatched out of the fire?” Joshua was dressed in filthy clothes as he stood before the angel. He said to those standing in front of him, “Take the filthy clothes off him.” And to Joshua he said, “See, I have taken your iniquity away from you, and I will dress you in a change of garments.” Then I said, “Let them put a clean turban on his head.” So they put a clean turban on his head and dressed him in garments, while the angel of the LORD stood by.
  - range: 6-10
    heading: A sign of the Branch
    plain: |
      Then the angel of the LORD testified to Joshua: “This is what the LORD of hosts says: If you will walk in My ways and keep My charge, then you will judge My house and keep My courts, and I will give you a place to walk among these who stand here. Listen, Joshua the high priest, you and your companions who sit before you, for they are men who are a sign: I am going to bring My servant, the Branch. Look at the stone I have set before Joshua; on that one stone are seven eyes. I will engrave its inscription, says the LORD of hosts, and I will remove the iniquity of this land in a single day. On that day, says the LORD of hosts, each of you will call his neighbor under his vine and under his fig tree.”

notes:
  - ref: 1
    phrase: Satan standing at his right hand to resist him
    kind: words
    title: The accuser in the Lord’s court
    body: |
      “Satan” here is a title, not a name: the Hebrew is *haśśāṭān*, “the satan,” with the article, and the footnote gives “the Adversary or Accuser.” The verb translated “to resist him” comes from the same root, and the footnote renders it “accuse.” The accuser stands at Joshua's right hand to accuse him.

      The scene is a courtroom. Joshua is on trial; the Lord is the judge, the angel of the Lord takes the defense, and the accuser is the prosecutor. The court is in heaven: the accuser is “similar to a prosecuting attorney in modern times,” but “a being from the divine realm.” Compare the council of [[Job 1:6–11]]. The site's notes on [[Num. 22:22]] and [[Ps. 109:6]] explain the word; what Zechariah adds is the outcome: the accuser never speaks a line, and the Lord rebukes him.
    sources: [oshb-wlc, lds-scriptures, ot-minute-zech, sc-knowhy-832, bd-zechariah]

  - ref: 2
    phrase: is not this a brand plucked out of the fire?
    kind: symbol
    title: A brand plucked out of the fire
    body: |
      A brand is “a burning piece of wood.” The Lord's defense of Joshua rests on His own choice: He has chosen Jerusalem and “has plucked the brand from the burning.”

      The footnote points to Amos, where Israel, after one judgment upon another, is “as a firebrand plucked out of the burning” ([[Amos 4:11]]). In Zechariah the image has been read as “perhaps a proverbial expression” for the nation rescued “from the furnace of Babylon … to become a torch to enlighten the nations.” The text itself does not say what the fire was, and the expression can be taken literally, symbolically, or both.
    sources: [lds-scriptures, bd-zechariah, ot-manual-33, ot-minute-zech]

  - ref: 4
    phrase: Take away the filthy garments from him
    kind: symbol
    title: Filthy garments taken away
    body: |
      The vision explains its own image: the filthy garments are Joshua's iniquity, and taking them off is the Lord's forgiveness: “I have caused thine iniquity to pass from thee.” The garment of filthiness “represents sin,” and the change of garments is putting off the old and putting on “robes of righteousness.” Joshua was accused not for private faults but “in his official capacity as high priest,” and stood there “laden with his own and his people's sins.”

      Joshua does nothing in the scene. The order goes to “those that stood before him,” presumably divine beings, and they do the work. The clean priestly clothing “symbolizes the forgiveness of his sins,” and the same picture runs to John's vision of those who “have washed their robes, and made them white in the blood of the Lamb” ([[Rev. 7:14]]). Zechariah was inviting the people to follow Joshua as he “sloughs off the filth of the world” and “dons clean clothing.”
    sources: [ot-manual-33, sc-knowhy-832, ot-minute-zech, vandyke-ogden-twelve]

  - ref: 5
    phrase: Let them set a fair mitre upon his head
    kind: words
    title: A clean turban
    body: |
      The “fair mitre” is a clean turban, and it is the one thing in the vision that the prophet asks for. The footnote gives the Hebrew as “a clean (pure) cap”; the word, *ṣānîp̄*, is a turban. Zechariah interrupts, “And I said,” and his request is granted at once.

      The law may explain why he asks. The word is a synonym of the term the law uses for the high priest's mitre, and that turban carried the gold plate engraved “HOLINESS TO THE LORD” ([[Ex. 28:36]]), so that Aaron might “bear the iniquity of the holy things” ([[Ex. 28:38]]). On this reading, a clean turban shows Joshua “to be holy, and qualified to accomplish the expiation of the people.” The text says only that the turban was clean, and that the angel of the Lord stood by while it was done.

      The theme page [“Every Pot in Jerusalem”](/zechariah/themes/every-pot-in-jerusalem/) follows what the Lord takes away, from this one priest to the whole city.
    sources: [lds-scriptures, bdb, keil-zechariah]

  - ref: 7
    phrase: I will give thee places to walk among these that stand by
    kind: words
    title: A place among those who stand by
    body: |
      The promise to the cleansed priest is a place among the beings who stand in the Lord's presence: the footnote explains “these that stand by” as “the heavenly messengers.” The promise has a condition in two parts. Walking in the Lord's ways has been read as faithfulness in a priest's own relation to God, and keeping His charge as faithful service in his office. If Joshua keeps both, he will govern the Lord's house and keep His courts.

      The last clause goes further: on one reading it promises “a free access to God, which had not yet been conferred upon him by his office,” and points to “a time when the restrictions of the Old Testament will be swept away.” If he kept the condition, Joshua, clean and crowned with the turban, would walk “among the angels of the Lord.” Forgiveness opens the way and does not end it: Joshua and his companions “could exercise authority if they followed the Lord's path,” which is the principle of [[D&C 121:36]].
    sources: [lds-scriptures, keil-zechariah, vandyke-ogden-twelve, ot-minute-zech]

  - ref: 8
    phrase: for they are men wondered at
    kind: words
    title: Men who are a sign
    body: |
      “Men wondered at” means men who are themselves a sign. The Hebrew *môp̄ēt* is a wonder or a sign of a future event, and here it describes “men who serve as a symbol or sign,” the way Isaiah said that he and his children “are for signs and for wonders in Israel” ([[Isa. 8:18]]).

      The next clause says what they signify: “for, behold, I will bring forth my servant the BRANCH.”
    sources: [bdb]

  - ref: 8
    phrase: I will bring forth my servant the BRANCH
    kind: christ
    title: My servant the BRANCH
    body: |
      The BRANCH is the Messiah. Before the exile Jeremiah had promised “a righteous Branch” raised up to David, a King whose name would be “THE LORD OUR RIGHTEOUSNESS” ([[Jer. 23:5–6]]), a title of the Messiah. After the exile Zechariah took up Jeremiah's promise and made Joshua and his fellow priests a sign of the Branch to come. The site's note on [[Isa. 4:2]] traces the title and its Hebrew.

      Here the Branch is also “my servant,” and he comes after a vision of a cleansed high priest. The ultimate fulfillment of the prophecy is Jesus Christ, though many in Zechariah's day “may have hoped for a branch fulfillment in Joshua.” The vision itself keeps them apart: Joshua is the sign, the Branch is the one the Lord “will bring forth.” Chapter 6 adds that the Branch will be priest and king at once ([[Zech. 6:12–13]]).
    sources: [scripture-helps-hag-1-2, ot-minute-zech, ot-manual-33]

  - ref: 9
    phrase: upon one stone shall be seven eyes
    kind: symbol
    title: The stone with seven eyes
    body: |
      The angel does not explain the stone set before Joshua, and it has been read in several ways. One reading compares it with stones in the ancient Near East: stones with eyes “were placed before temples … to identify the donors or person in charge.” This stone is set before Joshua the high priest, not Zerubbabel, and the number seven “may imply a full, complete, or all-encompassing vision.”

      The Hebrew can mean either that seven eyes are on the stone or that seven eyes are directed upon it. Another reading takes the second sense: the eyes watch over the stone with care. On that reading the eyes are the Spirit of the Lord, as in “the eyes of the LORD” of the next vision ([[Zech. 4:10]]) and the Lamb's “seven eyes, which are the seven Spirits of God” ([[Rev. 5:6]]), and the stone, which the Lord will engrave, is “the symbol of the kingdom of God.” Early Christian interpreters read the stone as the Messiah, after the tried cornerstone of [[Isa. 28:16]]. No reading of the stone or its eyes is settled. What the verse says plainly is that the stone is the Lord's work (“I will engrave the graving thereof”) and that it comes with the removal of the land's iniquity.
    sources: [ot-minute-zech, keil-zechariah]

  - ref: 9
    phrase: I will remove the iniquity of that land in one day
    kind: christ
    title: Iniquity removed in one day
    body: |
      What the Lord did for one priest in the vision He promises to do for the whole land: remove its iniquity, and in a single day. The verse is read of the Second Coming and of the Branch: “through the Branch (Messiah) the Lord will remove the iniquity of the land in one day.” The chapter ends on the peace that follows, each man calling his neighbor “under the vine and under the fig tree” (verse 10).
    sources: [lds-scriptures, bd-zechariah, scripture-helps-hag-1-2]

christ: |
  Joshua bears the name that comes into Greek and English as Jesus, and he “was a type of Jesus Christ, the great High Priest,” the “great high priest, that is passed into the heavens” of [[Heb. 4:14]]. He says nothing in his own defense; the Lord answers for him, and his filthy garments come off at a word: “I have caused thine iniquity to pass from thee” (verse 4). His cleansing is a sign of the Branch, through whom the Lord will take away the iniquity of the whole land.

  The same Lord who rebuked the accuser and reclothed the priest still takes iniquity away, and the change can come “in one day,” by “the mighty power of Jehovah to cleanse and save.” In this chapter forgiveness begins a walk: the cleansed priest is told, “If thou wilt walk in my ways” (verse 7), and forgiveness is “the springboard for discipleship.”

explore: |
  - **The accuser.** [[Job 1:6–12]], [[Num. 22:22]] and [[Ps. 109:6]], with the site's notes on the title *the satan*.
  - **The Branch.** [[Jer. 23:5–6]], [[Isa. 4:2]], and the crowning of Joshua in [[Zech. 6:9–15]].
  - **The high priest's turban.** [[Ex. 28:36–38]].
  - **Robes made white.** [[Rev. 7:14]].

