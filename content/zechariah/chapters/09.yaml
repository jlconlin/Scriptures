chapter: 9
title: Thy King Cometh unto Thee
tagline: The Lord’s word sweeps over the nations on Israel’s border, and Jerusalem is told to shout, for her King is coming, just and having salvation, lowly and riding upon an ass.
when: 'Undated; the book sets these prophecies with Zechariah, who prophesied 520–518 B.C.'

setting: |
  Chapter 9 opens the second half of Zechariah, and the change is plain at once. The first eight chapters are dated by the years of Darius ([[Zech. 1:1]]; [[Zech. 7:1]]). This chapter has no date and no prophet’s name, only a heading, “The burden of the word of the LORD” (on the word *burden*, a prophetic oracle, see [[Mal. 1:1]]). The same heading opens chapter 12, so chapters 9–11 and 12–14 are two matching oracles. The horizon is wider too: judgment on the nations around Israel, a King who will “establish a kingdom of peace over the whole earth,” and captives redeemed.

  That change has led modern critics to question whether the prophet of chapters 1–8 wrote chapters 9–14, and a Latter-day Saint commentator reads the mention of Greece in verse 13 as a sign of a later text, or of an older one updated (see the note there). Others have defended one author, answering that a heading without a name no more disproves Zechariah’s authorship than the unnamed oracles of [[Isa. 15:1]] and [[Isa. 17:1]] disprove Isaiah’s. The Church’s helps read these chapters as Zechariah’s “prophecies about the Messiah and events preceding His Second Coming.” And the Lord Himself took up words from chapters 13 and 14 as prophecy of His coming ([[D&C 45:48–52]]). For Latter-day Saints that settles that they are prophecy, whoever wrote them down.

  Matthew and John both quote verse 9 when Jesus rides into Jerusalem ([[Matt. 21:4–5]]; [[John 12:14–15]]).

thread: |
  Zechariah 9 clears a road for a King.

  The Lord’s word moves down the map from Syria to the Philistine coast: Damascus and Hamath, wise and wealthy Tyre, then Ashkelon, Gaza, Ekron and Ashdod (verses 1–7). The judgment ends in a surprise: what is left of the Philistines “shall be for our God” (verse 7). The Lord camps around His own house (verse 8), and with the neighbours quieted Jerusalem is told to shout, because her King is coming, “just, and having salvation; lowly, and riding upon an ass” (verse 9). He takes away the chariot and the war horse and speaks peace to the nations (verse 10).

  The last section turns to those still far off: prisoners set free “by the blood of thy covenant,” Judah and Ephraim made the Lord’s bow, the Lord Himself marching in the storm, and a people lifted up on His land “as the stones of a crown” (verses 11–17). The King of this chapter wins, but He comes lowly, and the victory is the Lord’s.

sections:
  - range: 1-7
    heading: The burden on the neighbours
    plain: |
      The burden of the Lord’s word is on the land of Hadrach, and it will come to rest on Damascus, when the eyes of all people, as of all the tribes of Israel, turn to the Lord. Hamath, which borders it, falls under it too, and Tyre and Sidon, wise as they are. Tyre built herself a fortress and piled up silver like dust and fine gold like the mud of the streets. But the Lord will drive her out, strike down her power on the sea, and she will be burned up with fire.

      Ashkelon will see it and be afraid; Gaza will see it and writhe in pain, and Ekron too, because what she hoped in has failed. Gaza will lose its king, and Ashkelon will be left empty. A people of mixed birth will live in Ashdod, and I will cut off the pride of the Philistines. I will take the blood of their sacrifices out of their mouths and the forbidden food from between their teeth. Those who are left will belong to our God too: they will be like a clan chief in Judah, and Ekron like the Jebusites.
  - range: 8-10
    heading: The King comes to Zion
    plain: |
      I will camp around My house because of the army, because of those who march through and march back. No oppressor will overrun My people again, for now I have seen it with My own eyes.

      Rejoice greatly, daughter of Zion! Shout, daughter of Jerusalem! Look, your King is coming to you. He is righteous and has salvation; He is lowly and riding on a donkey, on a colt, the foal of a donkey. I will take the chariot away from Ephraim and the war horse from Jerusalem, and the battle bow will be broken. He will speak peace to the nations, and His rule will reach from sea to sea and from the River to the ends of the earth.
  - range: 11-17
    heading: Prisoners set free and a people made a crown
    plain: |
      As for you, because of the blood of your covenant I have set your prisoners free from the pit that has no water. Come back to the stronghold, you prisoners of hope; today I declare that I will repay you double. I have bent Judah as My bow and filled it with Ephraim. I will rouse your sons, Zion, against your sons, Greece, and make you like a warrior’s sword.

      The Lord will appear over them, and His arrow will flash out like lightning. The Lord God will sound the trumpet and march out in the storms of the south. The Lord of Hosts will shield them. They will devour and overcome with sling stones; they will drink and shout as if with wine, and be filled like the sacrificial bowls, like the corners of the altar. On that day the Lord their God will save them, His people, as a shepherd saves his flock. They will be like the jewels of a crown, lifted high over His land like a banner. How great is His goodness, and how great His beauty! Grain will make the young men flourish, and new wine the young women.

notes:
  - ref: 1
    phrase: The burden of the word of the LORD in the land of Hadrach
    kind: history
    title: The nations on Israel’s border
    body: |
      The burden falls on the nations along Israel’s border, from Hadrach and Damascus to the Philistine cities. Hadrach is named nowhere else in the Bible. A lexicon calls it a “proper name, of a territory” and suggests a district “near Damascus and Hamath” known from Assyrian records. With it come Damascus in Syria and Hamath, Tyre and Zidon in Phoenicia, and four Philistine cities, Ashkelon, Gaza, Ekron and Ashdod: “The cities mentioned in this passage border the land of Israel.” Tyre, with its stronghold and its silver heaped “as the dust,” gets the fullest description (verses 3–4; on its wisdom and wealth see [[Ezek. 28:5]]).

      Many have read verses 1–8 as history foretold. “Alexander the Great in approximately 332 B.C. destroyed these cities with his army,” and many scholars have taken the verses as fulfilled then. “But the meaning of these verses is broader than that.” In the chapter’s own order the neighbours are judged so that the King can come: “With the surrounding nation-states defeated and the Lord’s army at the temple,” the king “was prepared to return to the city” (verses 8–9).
    sources: [bdb, ot-minute-zech, ot-manual-33]

  - ref: 6
    phrase: a bastard shall dwell in Ashdod
    kind: words
    title: '“A bastard”: a mixed people'
    body: |
      The “bastard” of verse 6 may be a whole population of foreigners, not one illegitimate child. The Hebrew *mamzēr* is used literally in the law of [[Deut. 23:2]]. Here it is “perhaps figurative collective, of mixed population,” and the Septuagint, the ancient Greek translation, already read the line that way: “And aliens shall dwell in Azotus” (Ashdod). On that reading Ashdod, a Philistine city, will be lived in by outsiders, and the Lord will “cut off the pride of the Philistines.”
    sources: [bdb, lxx-rahlfs]

  - ref: 7
    phrase: he that remaineth, even he, shall be for our God
    kind: history
    title: A Philistine remnant for Israel’s God
    body: |
      Verse 7 turns judgment into conversion: the Philistines lose their idolatry, and a remnant of them joins Israel. The “blood” in the mouth and the “abominations” between the teeth picture an idolater at a sacrificial meal. The blood is “not human blood, but the blood of sacrifices,” and the abominations are “the idolatrous sacrifices, and indeed their flesh.” Taking them away means “the abolition of idolatry generally.” Then what is left of the Philistines “shall be for our God.” “Just as in the case of Israel a ‘remnant’ of true confessors of Jehovah is left when the judgment falls upon it, so also will a remnant of the Philistines be left for the God of Israel.” The remnant will be “as a governor in Judah,” a clan chief, “the head of an ’eleph, one of the families into which the tribes were divided.”

      “Ekron as a Jebusite” recalls the people who held Jerusalem until David took it ([[2 Sam. 5:6–10]]). One older commentary reads it as belonging: the Jebusites “adopted the religion of Israel after the conquest of this citadel by David, and were incorporated into the nation of the Lord,” as the Jebusite Araunah did, who sold David the site of the temple ([[2 Sam. 24:16–24]]). A Latter-day Saint commentator reads the line instead as defeat: the Philistines will be “defeated like the Jebusites.”
    sources: [keil-zechariah, ot-minute-zech]

  - ref: 9
    phrase: behold, thy King cometh unto thee
    kind: christ
    title: The King who comes lowly
    body: |
      The King of verse 9 is the Messiah, and the Gospels saw Him arrive when Jesus rode into Jerusalem on a donkey. “Jesus Christ fulfilled this prophecy with His triumphal entry into Jerusalem during the last week of His mortal ministry,” and He did so deliberately: He sent for the animals Himself ([[Matt. 21:1–7]]), so that “Jesus is the one who initiates the fulfillment of the prophecy.” Matthew joined Zechariah’s words to a line of Isaiah’s (see [[Isa. 62:11]]).

      The verse holds two things together. The King comes “in humility, riding on a donkey”: “lowly” is Hebrew *ʿānî*, a word for the poor and afflicted, used here in the sense “humble, lowly” of a “victorious king.” He is “one whose humility is underscored by the mode of his arrival,” for “a triumphant king may be expected to arrive on the back of a stallion, but this one arrives riding upon a donkey.” Yet the animal was also royal: “royalty and high officials rode on donkeys,” and Elder Ulisses Soares recalled that the donkey “was considered in literature” an “ancient symbol of Jewish royalty,” “as indeed befitted the King of kings and Prince of Peace.” He comes humbly, He comes as King, and He comes to save: “he is just, and having salvation.” The next verse takes the war horse away altogether and gives Him the dominion asked for in [[Ps. 72:8]] (see also [[Micah 5:10]]).
    sources: [scripture-helps-hag-1-2, frederick-use-of-ot, soares-prince-of-peace, ot-minute-zech, bdb]

  - ref: 9
    phrase: upon a colt the foal of an ass
    kind: scripture
    title: One donkey or two
    body: |
      Matthew has two animals where Zechariah, read as Hebrew poetry, has one. Hebrew poetry often says one thing twice in parallel lines, and “riding upon an ass, and upon a colt the foal of an ass” describes a single animal twice: Zechariah’s line and Jacob’s blessing of Judah ([[Gen. 49:11]]) “actually refer to only one donkey.” Matthew has Jesus send for “an ass tied, and a colt with her” ([[Matt. 21:2]]), while Mark, Luke and John speak of the colt alone ([[Mark 11:7]]; [[Luke 19:35]]; [[John 12:14]]).

      Some scholars have asked “whether or not Matthew misread the synonymous parallelism.” Latter-day Saint scholars answer that “even though Matthew understood this literary technique, he nonetheless chose to portray two to emphasize by the mother’s presence that the foal is young.” Mark and Luke may point the same way when they say the colt had never been ridden ([[Mark 11:2]]; [[Luke 19:30]]).
    sources: [huntsman-palm-sunday, frederick-use-of-ot]

  - ref: 11
    phrase: I have sent forth thy prisoners out of the pit wherein is no water
    kind: prophets
    title: Prisoners out of the waterless pit
    body: |
      The prisoners are first Israel’s own captives, and Restoration teaching also hears in the verse the release of the dead. In its setting the Lord, having promised Zion her King, adds a promise for “members of His nation as shall be still in captivity.” The waterless pit recalls the dry pit Joseph was thrown into ([[Gen. 37:22–24]]): delivering the prisoners from it “is a figure denoting their liberation out of the bondage of exile.” Verse 12 calls them “prisoners of hope.”

      The Church pairs verses 9–11 with Peter’s words that Christ “went and preached unto the spirits in prison” ([[1 Pet. 3:18–19]]). Elder Bruce R. McConkie read “the blood of thy covenant” as the blood of Christ: “because of the gospel covenant, which is efficacious because of the shedding of the blood of Christ.” And he read “wherein is no water” as teaching that “the saving water, which is baptism, is an earthly ordinance and cannot be performed by spirit beings while they dwell in the spirit world.” That is a Latter-day Saint reading layered on the verse’s first sense; it rests on an apostle’s teaching, not on the Hebrew.
    sources: [keil-zechariah, cfm-ot-2026-50, ot-manual-33]

  - ref: 13
    phrase: thy sons, O Greece
    kind: words
    title: 'Greece: Javan'
    body: |
      “Greece” is the Hebrew *yāwān*, Javan, a son of Japheth in [[Gen. 10:2]]. Earlier prophets name Javan too ([[Isa. 66:19]]; [[Ezek. 27:13]]), and Joel charges Tyre and Zidon with selling Judah’s children “unto the Grecians” ([[Joel 3:6]]).

      Javan was “regarded as the founder of the Greek race,” and in this verse Greece stands for the world arrayed against God’s people: “The Lord will defend His people Israel against Greece (the world),” with Judah and Ephraim united as His weapon. The name also raises a question of date. “The Greeks would not rule over the Jews until 333 BC,” and one Latter-day Saint commentator takes the verse as “a clear indication that this is either a later text or was updated to reflect a future time,” perhaps reflecting “the desires of the people during the Maccabean Revolt in the 160s BC.” That is his reading.
    sources: [oshb-wlc, bd-javan, ot-manual-33, ot-minute-zech]

christ: |
  The King of verse 9 is Jesus Christ, who rode into Jerusalem in the week of His death, and the chapter’s wider victory waits for His return: the entry was “an anticipation of the future, the actual rule he will usher in at his glorious return, as anticipated in the prophecies of Zechariah.” The prisoners of verse 11 go free “by the blood of thy covenant,” a covenant made effective “because of the shedding of the blood of Christ.”

  His reign in a disciple does not wait for that last victory: “Today we do not need all evil to be defeated to have Jesus Christ reign in our lives.” The King who comes lowly and having salvation (verse 9) reigns now in those who receive Him, and the covenant made effective by His blood reaches those still held as “prisoners of hope” (verse 12).

explore: |
  - **The entry into Jerusalem in all four Gospels.** [[Matt. 21:1–11]], [[Mark 11:1–11]], [[Luke 19:29–44]] and [[John 12:12–19]], with verse 9.
  - **The King’s peace and dominion.** [[Ps. 72:8]] and [[Micah 5:10]] beside verse 10.
  - **The rest of the first oracle.** The Lord’s flock and its shepherds in [[Zech. 10]] and [[Zech. 11]].

parallels:
