chapter: 14
title: The LORD Shall Be King over All the Earth
tagline: Jerusalem is besieged by all nations, the Lord stands on the Mount of Olives and fights for her, living waters flow, the nations come up to worship, and even the cooking pots are holy.
when: 'Undated; the book sets these prophecies with Zechariah, who prophesied 520–518 B.C.'

setting: |
  Chapter 14 closes the book and the second of its two burdens (chapters 12–14; on the change at chapter 9 see the setting of [[Zech. 9]]). It carries on the day of chapters 12 and 13, as “a further expansion” of the judgment and refining of [[Zech. 13:7–9]]. Chapters 9–14 as a whole are “prophecies about the Messiah and events preceding His Second Coming.”

  The Church reads this chapter as the last of those events: a final battle in and around Jerusalem just before the Second Coming of Jesus Christ, the conflict “often referred to as Armageddon” (the name is John’s; see the note on [[Joel 3:12]]). Ezekiel’s Gog prophecy in Ezekiel 38–39 relates to the same battle.

  The order of events matters for reading it. The Lord’s appearance on the Mount of Olives (verse 4) comes before His appearance to all the world; it is not the same event. Modern revelation takes up verse 4 in the Lord’s own words ([[D&C 45:48]]) and names the mount again among the places He will stand: “he shall stand upon the mount of Olivet” ([[D&C 133:20]]).

thread: |
  Zechariah 14 begins with Jerusalem plundered and ends with every pot in the city holy.

  The day opens at its worst: all nations gathered, the city taken, half its people led away (verses 1–2). Then the Lord goes out. His feet stand on the Mount of Olives, the mountain splits, and His people escape through the new valley as He comes with all His holy ones (verses 3–5). After that everything is remade: a day with light at evening, living waters running east and west, the hills levelled and Jerusalem lifted up and safe, and over it all one King: “the LORD shall be king over all the earth” (verses 6–11).

  The nations that came to fight are struck down (verses 12–15), and what is left of them comes up every year to worship the King at the Feast of Tabernacles (verses 16–19). The chapter ends where the high priest’s plate began: “HOLINESS UNTO THE LORD” is written on the horses’ bells, and the line between holy and ordinary is gone (verses 20–21).

sections:
  - range: 1-3
    heading: All nations against Jerusalem
    plain: |
      Look, a day of the Lord is coming, when what was taken from you will be divided up in your own streets. I will gather all the nations against Jerusalem for war. The city will be captured, the houses plundered and the women violated; half the city will go into captivity, but the rest of the people will not be cut off from the city. Then the Lord will go out and fight against those nations, as He has fought on a day of battle before.
  - range: 4-7
    heading: The Lord on the Mount of Olives
    plain: |
      On that day His feet will stand on the Mount of Olives, which faces Jerusalem on the east, and the mountain will split in two from east to west, leaving a very great valley: half the mountain will move north and half south. You will flee through the valley between the mountains, for it will reach as far as Azal. You will flee as you fled from the earthquake in the days of Uzziah king of Judah. And the Lord my God will come, and all the holy ones with Him.

      On that day the light will be neither clear nor dark. It will be a day like no other, known to the Lord, neither day nor night; and when evening comes, there will be light.
  - range: 8-11
    heading: Living water and a city made safe
    plain: |
      On that day living water will flow out from Jerusalem, half toward the eastern sea and half toward the western sea, in summer and in winter alike. The Lord will be King over the whole earth; on that day the Lord will be one, and His name one.

      The whole land from Geba to Rimmon, south of Jerusalem, will become like a plain, but Jerusalem will be raised high and lived in on its own site, from the Benjamin Gate to the place of the First Gate and the Corner Gate, and from the Tower of Hananeel to the king’s winepresses. People will live in it, it will never again be utterly destroyed, and Jerusalem will dwell in safety.
  - range: 12-15
    heading: The plague on Jerusalem’s attackers
    plain: |
      This is the plague with which the Lord will strike all the peoples who fought against Jerusalem: their bodies will waste away while they are still on their feet. On that day the Lord will send great panic among them, so that each one seizes his neighbour and raises his hand against him. Judah too will fight at Jerusalem, and the wealth of all the surrounding nations will be gathered up: gold, silver and clothing in great quantity. The same plague will strike the horses, mules, camels, donkeys and every animal in their camps.
  - range: 16-19
    heading: The nations come up to the feast
    plain: |
      Everyone left of all the nations that came against Jerusalem will go up year after year to worship the King, the Lord of Hosts, and to keep the Feast of Tabernacles. If any of the families of the earth do not go up to Jerusalem to worship the King, the Lord of Hosts, no rain will fall on them. If the family of Egypt does not go up and come, they will have no rain either; the plague the Lord sends on the nations that do not come up to keep the Feast of Tabernacles will fall on them. That will be the penalty of Egypt and of every nation that does not come up to keep the feast.
  - range: 20-21
    heading: Holiness on everything
    plain: |
      On that day “HOLINESS UNTO THE LORD” will be written on the horses’ bells, and the cooking pots in the Lord’s house will be as holy as the bowls before the altar. Every pot in Jerusalem and Judah will be holy to the Lord of Hosts, and all who offer sacrifices will come and use them to cook in. And on that day there will no longer be any Canaanite in the house of the Lord of Hosts.

notes:
  - ref: 2
    phrase: I will gather all nations against Jerusalem to battle
    kind: history
    title: The last siege of Jerusalem
    body: |
      Verse 2 describes the siege of the last days, when people from “all nations” gather against Jerusalem, and it does not soften what comes first. The Lord gathers the nations, the city falls, its houses are plundered and its women abused, and half its people are led away; but “the residue of the people shall not be cut off from the city.”

      The description “can be applied to many moments in the city’s history,” and the promise of verse 3 holds in each for a people “true to their covenants.” For the days before the Second Coming the Lord has promised help and spiritual protection to those who follow Him, and Zion, the New Jerusalem, is to be a place of “peace, refuge, and safety”; He describes that refuge in modern revelation ([[D&C 45:66–71]]).
    sources: [scripture-helps-hag-1-2, ot-minute-zech]

  - ref: 4
    phrase: his feet shall stand in that day upon the mount of Olives
    kind: christ
    title: The Lord returns to the Mount of Olives
    body: |
      The Lord who stands on the Mount of Olives is Jesus Christ, and the place ties His return to His departure. He steps in at the moment the city seems lost, and the mountain splits east to west to open a way out. In Zechariah’s picture the Lord comes down “as a warrior upon the Mount of Olives,” and the split mountain creates “a valley of refuge for Israel.”

      The mountain was already His. He taught there ([[Matt. 24:3]]) about “the events leading up to His triumphant return,” and He ascended from it, with angels promising He would come again “in like manner” ([[Acts 1:11–12]]); so “ancient Christians understood that Jesus would return to the Mount of Olives.” Modern revelation puts Zechariah’s verse in His own mouth: “then shall the Lord set his foot upon this mount, and it shall cleave in twain” ([[D&C 45:48]]). There it is joined to words from Zechariah 13, and the warrior of this chapter shows the Jews His wounds and names Himself: “I am Jesus that was crucified. I am the Son of God” ([[D&C 45:52]]). That revelation of “the crucified Jesus” as “the warrior of Zechariah 14” is a major step toward the gathering of the Jewish nation. On the earthquake that comes with Him, see [[Ezek. 38:19]]; on the glory Ezekiel saw stand on the same mountain, see [[Ezek. 11:23]].
    sources: [scripture-helps-hag-1-2, frederick-old-wine, sc-knowhy-790, lds-scriptures]

  - ref: 5
    phrase: the valley of the mountains shall reach unto Azal
    kind: history
    title: The valley that reaches to Azal
    body: |
      Azal marks how far the new valley runs, and the verse gives no more than its name. One Latter-day Saint reading places it “behind the Mount of Olives,” so that the mountain that once stood in the way now opens “a direct path to Jerusalem.” The flight through it is compared to the earthquake “in the days of Uzziah king of Judah,” by which Amos dated his book (see [[Amos 1:1]]).
    sources: [ot-minute-zech]

  - ref: 5
    phrase: all the saints with thee
    kind: words
    title: The saints who come with Him
    body: |
      The “saints” who come with the Lord are *qĕdōšîm*, “holy ones,” a word Hebrew uses both for God’s holy people and for angels. The Church’s edition reads it of the righteous dead, pointing to Paul’s promise that “them also which sleep in Jesus will God bring with him” ([[1 Thes. 4:14]]). The standard Hebrew lexicon lists this verse among those where the holy ones are angels. The verse does not settle which is meant.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 7
    phrase: at evening time it shall be light
    kind: symbol
    title: Light at evening
    body: |
      The day of the Lord’s coming reverses the order of nature: when night should fall, light comes. The rare Hebrew words of verse 6 have been “interpreted … from time immemorial in very different ways”; one reading, which depends on how those words are read, takes them as the stars losing their brightness, as in other prophecies of that day ([[Joel 3:15]]; [[Matt. 24:29]]). Verse 7 then calls it “one day,” that is, a day “unparalleled by any other,” known only to the Lord, and in it “the evening brings light.”

      The verses were heard this way at the Temple in Jesus’ day. “According to ancient sources,” Zechariah 14 was read at the Feast of Tabernacles while “enormous lampstands in the courts of the temple” were lit, and the pilgrims heard in verses 6–7 that the Messiah “would ultimately be the Light of the World, and not just for the Jews.” With those festivities just past, Jesus said, “I am the light of the world” ([[John 8:12]]), declaring Himself the Messiah “of whom the prophets of old had testified.”
    sources: [keil-zechariah, gardner-tabernacles]

  - ref: 10
    phrase: it shall be lifted up, and inhabited in her place
    kind: symbol
    title: The land made low, the city lifted up
    body: |
      Verse 10 levels the land and raises the city. Geba lay north of Jerusalem and Rimmon south, so “all the hilly country between them” is made a plain, as every mountain is made low in [[Isa. 40:4]]. Jerusalem alone is lifted up, and one reading ties this to [[Isa. 2:2]]: perhaps it is “to reflect Isaiah’s picture of the Lord’s house ‘established in the top of the mountains.’” The raised city is inhabited “in her place,” from gate to gate and from tower to winepresses, and the next verse promises it will never again be destroyed.
    sources: [ot-minute-zech]

  - ref: 16
    phrase: to keep the feast of tabernacles
    kind: history
    title: Why the Feast of Tabernacles
    body: |
      The Feast of Tabernacles was the feast of deliverance and of the last harvest. Israel lived in booths for its seven days to remember the wilderness after the Exodus ([[Lev. 23:42–43]]), and the feast, at the autumn ingathering, “pointed both backward to the time when God gathered Israel out of Egypt and forward” to a final harvest, when all nations would be gathered to the Lord.

      Zechariah fills the feast with those nations: “all the nations,” “all the families of the earth.” Those who once came against Jerusalem now come up to worship the King, and the chapter’s promise of “the eventual gathering together of all God’s children” is told as a pilgrimage made “from year to year.”
    sources: [gardner-tabernacles, lds-scriptures]

  - ref: 17
    phrase: even upon them shall be no rain
    kind: prophets
    title: Nations that will not come up
    body: |
      Verses 17–19 assume that not everyone on earth at that time will yet worship the Lord, and Joseph Smith taught the same of the Millennium: “There will be wicked men on the earth during the thousand years. The heathen nations who will not come up to worship will be visited with the judgments of God, and must eventually be destroyed from the earth.”

      The penalty is fitted to the land: without rain nothing grows, and rain here stands for “the blessing of God generally.” Egypt, watered by the Nile rather than by rain, has drawn forced explanations from its climate. On one older reading it is named not for its climate but as “the nation which showed the greatest hostility to Jehovah and His people in the olden time,” to show that even it was to share in Israel’s blessings (compare [[Isa. 19:19–25]]).
    sources: [ot-manual-33, keil-zechariah]

  - ref: 20
    phrase: HOLINESS UNTO THE LORD
    kind: prophets
    title: Holiness on the horses’ bells
    body: |
      “HOLINESS UNTO THE LORD” was engraved on the gold plate of the high priest’s mitre ([[Ex. 28:36]]); in that day it hangs on the horses. The war horses become as holy as the temple’s vessels, and the common cooking pots of the temple, and then every pot in Judah, as sacred as the bowls before the altar. The whole land would be “temple holy.” On the inscription and its tie to consecration, see [[Isa. 23:18]].

      The Church has written the words where Zechariah did, on ordinary things. Its temples bear them, and Elder D. Todd Christofferson recalled that the pioneer Saints put them on sacrament cups, on ordination certificates and over the windows of a department store, places that show “just how pervasive and constant our focus on holiness needs to be.”
    sources: [lds-scriptures, ot-minute-zech, christofferson-living-bread]

  - ref: 21
    phrase: there shall be no more the Canaanite in the house of the LORD of hosts
    kind: words
    title: No more the Canaanite
    body: |
      The last Canaanite to leave the Lord’s house can be read two ways. The Church’s reading takes the word for the people: the verse promises a house with “no more the Canaanite [the wicked],” and the Church’s edition points it to Joel’s Jerusalem, through which “no strangers” pass any more ([[Joel 3:17]]).

      “Canaanite” can also mean a trader. The same Hebrew word is used for a merchant ([[Prov. 31:24]]), and the lexicon takes it so in this verse, “probably”: no more traders in the Lord’s house. Latter-day Saint scholars read Jesus’ driving the buyers and sellers from the Temple in that light: He “cleanses the temple as prescribed in Zechariah,” after arriving on the Mount of Olives and pronouncing judgment, the same order of events as this chapter’s ([[Mark 11:15]]; compare “make not my Father’s house an house of merchandise,” [[John 2:16]]). On either reading the verse ends the book with a house kept for the Lord alone.
    sources: [ot-manual-33, lds-scriptures, bdb, huntsman-palm-sunday]

christ: |
  The Lord who stands on the Mount of Olives, fights for Jerusalem and becomes “king over all the earth” (verse 9) is Jesus Christ. Modern revelation makes the identification in His own words, “I am Jesus that was crucified” ([[D&C 45:52]]): the warrior of Zechariah 14 is “the crucified Jesus.” He returns to the mountain He ascended from, and the nations that came against His city come up to worship Him as King.

  When the Lord took these chapters up in modern revelation, He promised that He “will always remember His covenant and rescue His people,” and this chapter shows that rescue coming when the city seems lost. Its last verses carry holiness out of the temple to horses’ bells and kitchen pots, and that is where a disciple seeks it now: in the details of daily living, in speech, dress and thought.

explore: |
  - **The same day in other prophets.** [[Joel 3:9–17]], [[Ezek. 38:18–23]] and [[Rev. 16:14–21]].
  - **The Lord’s own account.** [[D&C 45:44–59]] and [[D&C 133:17–25]], read beside verses 3–9.
  - **Living water from the Lord’s house.** [[Ezek. 47:1–12]] and [[Joel 3:18]] beside verse 8.
  - **The light of the world at the feast.** [[John 7:2]], [[John 7:37–38]] and [[John 8:12]], with verses 6–8 and 16.

