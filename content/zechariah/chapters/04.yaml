chapter: 4
title: Not by Might, nor by Power
tagline: A golden lampstand fed by two olive trees tells Zerubbabel how the stalled temple will be finished, by the Lord’s Spirit, and why no one should despise the day of small things.
when: 'Zechariah prophesied in Jerusalem under Darius I of Persia, 520–518 B.C.'

setting: |
  Chapter 4 is the fifth of the visions Zechariah saw in the second year of Darius ([[Zech. 1:7–8]]), and they seem to have come one after another with little pause between them. The interpreting angel of the earlier visions (see [[Zech. 1:9]]) returns to explain this one.

  The setting is a building site that had stood still for years. Returned exiles had laid the temple’s foundation, and then the work stopped: fifteen years later it “had not progressed beyond laying the foundation stones,” halted by “the weight of poverty, political disruption, animosities, and a backbreaking need to survive.” In 520 B.C. the Lord raised up Haggai and Zechariah to set it going again ([[Ezra 5:1–2]]; [[Hag. 1:1]]).

  The vision of chapter 3 turned on Joshua, the high priest. This one turns on Zerubbabel, the governor of Judah and a descendant of King Jehoiachin. He had led the rebuilding. Its promise speaks first to those builders: the hands that laid the foundation will finish the house. The temple was completed in 515 B.C. ([[Ezra 6:15]]).

thread: |
  Zechariah 4 answers a discouraged builder’s question: **how will a poor, small community finish the Lord’s house?**

  The vision is a golden lampstand whose seven lamps are fed, not by a priest filling them each day, but by two olive trees pouring oil into a bowl above it (verses 1–3, 11–12). When Zechariah asks what it means, the angel answers first with a word for Zerubbabel instead of a key to the picture: “Not by might, nor by power, but by my spirit, saith the LORD of hosts” (verse 6). In the Church’s reading, the oil is the Spirit. The mountain in Zerubbabel’s way will become a plain; the hands that laid the foundation will set the top stone, to shouts of “Grace, grace unto it”; and no one is to despise the day of small things (verses 7–10).

  Only at the end does the angel name the trees: they are “the two anointed ones” (verse 14), whom the Bible Dictionary reads as the priest and the governor through whom the Spirit is dispensed. The chapter holds both halves together. The work is done by the men the Lord has appointed, and it is finished by His Spirit.

sections:
  - range: 1-5
    heading: A lampstand and two olive trees
    plain: |
      The angel who had been speaking with me came back and roused me, as someone is roused from sleep. He asked me, “What do you see?” I said, “I see a lampstand all of gold, with a bowl on top of it, and its seven lamps on it, and seven pipes to the seven lamps at its top. Beside it are two olive trees, one on the right of the bowl and the other on its left.” I asked the angel who spoke with me, “What are these, my lord?” He answered, “Don’t you know what they are?” “No, my lord,” I said.
  - range: 6-10
    heading: The word to Zerubbabel
    plain: |
      Then he told me, “This is the Lord’s word to Zerubbabel: Not by might, and not by power, but by My Spirit, says the Lord of Hosts. Who are you, great mountain? Before Zerubbabel you will become level ground. He will bring out the top stone while the people shout, ‘God’s favor, God’s favor on it!’”

      The word of the Lord came to me again: “Zerubbabel’s hands have laid the foundation of this house, and his hands will finish it. Then you will know that the Lord of Hosts has sent me to you. Who has scorned the day of small things? They will rejoice when they see the plummet in Zerubbabel’s hand. Those seven are the eyes of the Lord, which range through the whole earth.”
  - range: 11-14
    heading: The two anointed ones
    plain: |
      Then I asked him, “What are these two olive trees on the right and the left of the lampstand?” And I asked again, “What are these two olive branches that pour the golden oil out of themselves through the two golden pipes?” He said, “Don’t you know what they are?” “No, my lord,” I said. Then he said, “These are the two anointed ones, who stand beside the Lord of the whole earth.”

notes:
  - ref: 2
    phrase: a candlestick all of gold, with a bowl upon the top of it
    kind: symbol
    title: A lampstand fed by olive trees
    body: |
      The “candlestick” (“more properly menorah, or lampstand”) is the seven-lamp lampstand of the tabernacle; what is new in Zechariah’s vision is the way the lampstand gets its oil. It was made first for the tabernacle, as [[Ex. 25:31–37]] describes, and the temple of Zerubbabel, the one standing half-built as Zechariah watched, would have a single one.

      In the tabernacle the priests filled the lamps by hand every day, with oil the people brought. The lampstand in the vision has what the tabernacle’s lampstand lacked: a “bowl,” a round vessel for oil, set on top of it; pipes carrying the oil to the lamps; and two olive trees beside it emptying their oil into the bowl (verse 12). With trees for its supply, such a lampstand “could never fail to have sufficient oil for a full and brilliant light.” That unfailing supply is what the angel goes on to explain (verse 6).

      What the lamps themselves stand for, the angel does not say. The Bible Dictionary allows that they “might represent the light shed by the people or that shed among them.” They have also been read as the people of God letting their light shine before the Lord, as the seven lampstands of Revelation are seven churches ([[Rev. 1:20]]).
    sources: [bd-candlestick, keil-zechariah, bd-zechariah]

  - ref: 6
    phrase: Not by might, nor by power, but by my spirit
    kind: symbol
    title: The oil is the Spirit
    body: |
      The angel answers “What are these?” with a word for Zerubbabel, and the word explains the oil: as the lamps burn on oil the trees supply, the temple will be finished by the Lord’s Spirit and not by Judah’s strength. In the Bible Dictionary’s reading, “the oil is the symbol of the Spirit, through whom, and not by might or power, all Israel’s work and destiny shall be accomplished.”

      Might and power were exactly what the builders lacked. They were a poor community under a foreign empire, and it was “the weight of poverty, political disruption, animosities” that had stopped the work. The Old Testament “regularly ascribes power as a characteristic of the Spirit”: Micah says, “I am full of power by the spirit of the LORD” ([[Micah 3:8]]), and Zechariah 4:6 belongs with the passages that join the two. The power to finish will be the Lord’s.
    sources: [bd-zechariah, wilson-holy-spirit, vandyke-ogden-twelve]

  - ref: 7
    phrase: Who art thou, O great mountain? before Zerubbabel thou shalt become a plain
    kind: symbol
    title: The mountain made a plain
    body: |
      The mountain is whatever stood between Zerubbabel and a finished temple, and the Lord promises to level it. In the Church’s reading, “the mountain represents the obstacles that stood before Zerubbabel as he tried to complete the temple,” and the plain means that “the obstacles were removed.”

      The obstacles were real. The first returnees met “crop failures, drought, and the onset of extreme poverty,” the people of the land worked to frustrate the building ([[Ezra 4:4–5]]), and the work ceased ([[Ezra 4:24]]). After a decade and a half the temple “had not progressed beyond laying the foundation stones.”
    sources: [ot-manual-33, vandyke-ogden-twelve]

  - ref: 7
    phrase: he shall bring forth the headstone thereof with shoutings, crying, Grace, grace unto it
    kind: words
    title: The top stone and the cry of “Grace”
    body: |
      The “headstone” here is the last stone of the building, not the first, and the shout over it asks God’s favor on the finished house. The Hebrew means “the topmost stone.” Some have taken it for the foundation stone; the stronger reading makes it the finishing stone, brought out of the workshop where it was cut and set at the top, and verse 9 bears that out. So the promise is the same as verse 9’s: the man who laid the foundation will set the last stone.

      “Grace” is *ḥēn*, favor, and here God’s favor. The doubled cry is the people’s prayer over the completed temple, read as a wish that God direct His favor to it, “that the temple may stand for ever, and never be destroyed again.”
    sources: [bdb, keil-zechariah]

  - ref: 10
    phrase: For who hath despised the day of small things?
    kind: history
    title: The day of small things
    body: |
      The question faces a beginning so small that some despised it, and promises that they will rejoice to see the work go on. The beginning really was small. The returned exiles were a “small band” who found “the mere shell of a city,” and their progress “was slow.” A decade and a half later the temple “had not progressed beyond laying the foundation stones.”

      What will gladden them is the sight of “the plummet in the hand of Zerubbabel.” A plummet is a plumb weight, a builder’s tool, and here it is in the governor’s hand. The house was finished ([[Ezra 6:14–15]]): “the second temple was completed in 515 BC, and against all odds.”
    sources: [vandyke-ogden-twelve, bdb]

  - ref: 10
    phrase: they are the eyes of the LORD, which run to and fro through the whole earth
    kind: words
    title: “The eyes of the LORD” in the Joseph Smith Translation
    body: |
      Joseph Smith’s translation makes “those seven” the Lord’s servants rather than His eyes: “They are the servants of the Lord which run to and fro through the whole earth.” The King James wording echoes the stone with “seven eyes” in the previous vision ([[Zech. 3:9]]).

      The Gospel Library prints only “selected portions” of the Joseph Smith Translation; this reading is found in the full parallel-column edition.
    sources: [jst-parallel-zech, lds-scriptures]

  - ref: 14
    phrase: These are the two anointed ones
    kind: words
    title: '“Sons of oil”: Joshua and Zerubbabel'
    body: |
      The angel names the olive trees “anointed ones,” and the Church reads them as the high priest and the governor of Zechariah’s own day. The Hebrew calls them “sons of oil.” The word for oil there is ordinarily the fresh oil of the harvest, named with grain and new wine; here it is anointing oil, and “sons of oil” means “anointed ones.”

      In the Bible Dictionary’s reading, the Spirit “is dispensed through the two anointed ones (‘sons of oil’), representing the priestly and royal rule (Joshua and Zerubbabel).” Joshua was the high priest “who served alongside Zerubbabel.” [[Zech. 6:11–13]] later sets a crown on the priest’s head.
    sources: [bdb, bd-zechariah, scripture-helps-hag-1-2]

  - ref: 14
    phrase: that stand by the Lord of the whole earth
    kind: scripture
    title: John’s two olive trees
    body: |
      John takes up this image for the two witnesses of Revelation, and latter-day revelation names those witnesses as other men than Zechariah’s. The Lord gives John’s witnesses power to prophesy and says, “These are the two olive trees, and the two candlesticks standing before the God of the earth” ([[Rev. 11:3–4]]). Like Zechariah’s olive trees and lampstand, they stand beside the Lord of the earth (verse 14).

      Of John’s witnesses the Doctrine and Covenants says, “They are two prophets that are to be raised up to the Jewish nation in the last days, at the time of the restoration” ([[D&C 77:15]]). In the Church’s reading Zechariah’s anointed ones were the priest and governor of his own day (previous note); John’s are prophets of the last days.
    sources: [lds-scriptures]

christ: |
  The angel’s last word names the trees “the two anointed ones” (verse 14). *Messiah* and *Christ* both mean “anointed,” and Jesus is “the one anointed of the Father to be His personal representative in all things pertaining to the salvation of mankind.” Joshua and Zerubbabel, priest and governor, are read as “a type of the Messiah as Priest and King,” and two chapters later the two offices meet in one man, the Branch, who “shall build the temple of the LORD” and “shall be a priest upon his throne” ([[Zech. 6:12–13]]).

  Verse 6 still describes how the Lord’s work goes forward in a disciple’s life: not by might or power, but by His Spirit, whose power “works best when God’s servants realize their personal powerlessness without it.” The Lord who told a poor, small community that the day of small things was not to be despised (verse 10) promised that the hands that began His house would finish it (verse 9).

explore: |
  - **The lampstand in the tabernacle.** Read [[Ex. 25:31–37]] beside verses 2–3 and 11–12.
  - **The anointed priest and king.** Follow Joshua’s cleansing in [[Zech. 3]] and the crowning of the Branch, a priest on a throne, in [[Zech. 6:9–15]].
  - **John’s witnesses.** Read [[Rev. 11:1–14]] with [[D&C 77:15]].

parallels:
  - ref: Rev. 11:3–4
    note: John’s two witnesses are “the two olive trees, and the two candlesticks standing before the God of the earth.”
  - ref: D&C 77:15
    note: The two witnesses of Revelation 11 are two prophets raised up to the Jewish nation in the last days.

