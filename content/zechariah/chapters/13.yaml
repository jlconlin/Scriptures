chapter: 13
title: A Fountain Opened
tagline: The Lord opens a fountain to wash Jerusalem clean, sweeps away idols and lying prophets, and calls a sword against His own Shepherd, then refines a remnant who call Him their God.
when: 'Undated; the book sets these prophecies with Zechariah, who prophesied 520–518 B.C.'

setting: |
  Chapter 13 stands in the middle of the book’s last oracle, which opens with “The burden of the word of the LORD for Israel” ([[Zech. 12:1]]). Its first verse finishes the scene that ends chapter 12, where Jerusalem looks on the one “whom they have pierced” and mourns ([[Zech. 12:10]]): now the mourners are given a fountain for cleansing. “The penitential supplication of Israel will lead to a thorough renewal of the nation.” The Church reads chapters 12–14 together as prophecy of the last days, of “a great final battle that will take place in and around Jerusalem in the last days, just prior to the Second Coming of Jesus Christ.”

  Two of the chapter’s verses were later taken up by the Lord Himself. On the Mount of Olives after the Last Supper, Jesus quoted verse 7 to warn His disciples that they would scatter when He was taken ([[Matt. 26:31]]; [[Mark 14:27]]). And in a latter-day revelation ([[D&C 45:51–52]]) He took the words of verse 6, which in Zechariah describe a false prophet, and “adapts the language to fit a new context,” His own wounds. The notes on those verses give both readings.

thread: |
  Zechariah 13 is about cleansing, and about what it costs.

  It opens with a fountain “for sin and for uncleanness” (verse 1), and the cleansing reaches whatever kept Israel from the Lord. The idols lose their very names, and false prophecy is so discredited that a man would rather pass for a farm hand than be taken for a prophet (verses 2–6): the Lord “will remove everything that could hinder sanctification.”

  Then the tone changes. The Lord calls a sword against His own Shepherd, the man who stands next to Him (verse 7). The flock scatters and many perish, but the scattering “will bring salvation to the remnant”: the Lord turns His hand to the little ones, brings a third through the fire, and the chapter ends with the covenant spoken from both sides, “It is my people” and “The LORD is my God” (verses 8–9).

sections:
  - range: 1-1
    heading: A fountain for cleansing
    plain: |
      On that day a fountain will be opened for the house of David and the people of Jerusalem, to wash away their sin and their impurity.
  - range: 2-6
    heading: No more idols, no more lying prophets
    plain: |
      On that day, says the Lord of Hosts, I will wipe the very names of the idols out of the land, and no one will remember them. I will also remove the prophets and the unclean spirit from the land. If anyone still prophesies, his own father and mother will tell him, “You must not live, for you speak lies in the Lord’s name,” and they will run him through when he prophesies.

      On that day every prophet will be ashamed of his vision when he prophesies, and none will put on the prophet’s hairy cloak to deceive. Instead each will say, “I am no prophet. I work the land; a man set me to keeping cattle when I was young.” And if someone asks him, “What are these wounds between your hands?” he will answer, “I got them in the house of my friends.”
  - range: 7-9
    heading: The Shepherd struck and the remnant refined
    plain: |
      Wake up, sword, against My shepherd, against the man who stands next to Me, says the Lord of Hosts. Strike the shepherd, and the sheep will scatter; and I will turn My hand to the little ones. In all the land, says the Lord, two parts will be cut off and die, but a third will be left. I will bring that third through the fire. I will refine them as silver is refined and test them as gold is tested. They will call on My name, and I will answer them. I will say, “They are My people,” and they will say, “The Lord is my God.”

notes:
  - ref: 1
    phrase: a fountain opened to the house of David
    kind: symbol
    title: A fountain for sin and for uncleanness
    body: |
      The fountain is running water opened to wash the people clean, and the Church’s footnote on “fountain” sets it beside baptism. A fountain is “a source of running, naturally flowing water,” what the Bible calls living water, and “places with flowing water were ideal for baptism and the washing of sin and uncleanness” (compare [[Mark 1:4–5]]).

      The second word, “uncleanness,” is *niddâ*, the impurity the law of Moses washed away with water. It is the word in “a water of separation” in [[Num. 19:9]], the water kept with the ashes of the heifer for purifying, and scripture also uses it figuratively, “of idolatry, immorality.” Zechariah makes it a promise: the water that cleanses such impurity will be opened, and opened to the house of David and the whole city.
    sources: [ot-minute-zech, bdb, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: shall thrust him through when he prophesieth
    kind: history
    title: Parents against a lying prophet
    body: |
      Verse 3 applies the law of Moses on false prophets with startling thoroughness. The law put to death a prophet who turned Israel to other gods or presumed to speak in the Lord’s name what He had not commanded ([[Deut. 13:5]]; [[Deut. 18:20]]), and told a man not to shield even his own son or daughter who enticed him to idolatry: “thine hand shall be first upon him” ([[Deut. 13:9]]). Here the parents themselves carry it out. One Latter-day Saint reading sees a people so devoted that “they would reject their own family members who would preach lies,” standing “against a counterfeit gospel, no matter who the communicator was.”

      The verb is sharp: “thrust him through” is *dāqar*, the same verb translated “pierced” in [[Zech. 12:10]].
    sources: [ot-minute-zech, oshb-wlc]

  - ref: 4
    phrase: neither shall they wear a rough garment to deceive
    kind: symbol
    title: The rough garment
    body: |
      The “rough garment” is a cloak of hair, the kind of mantle Elijah wore, and in that day no false prophet will put it on to pass for a true one. The Hebrew is *ʾadderet śēʿār*, a mantle of hair; *ʾadderet* is the word for the mantle Elijah left to Elisha ([[2 Kgs. 2:13]]), and Elijah was known by description as “an hairy man” ([[2 Kgs. 1:8]]). The Church’s footnote sets the verse beside the “raiment of camel’s hair” of John the Baptist ([[Matt. 3:4]]). To wear such a cloak “to deceive” was to borrow the look of the prophets who had worn it.
    sources: [oshb-wlc, lds-scriptures]

  - ref: 5
    phrase: for man taught me to keep cattle from my youth
    kind: words
    title: '“Man taught me to keep cattle”'
    body: |
      The King James line is one reading of a hard Hebrew phrase; another has the man say that he was bought as a servant. The verb is *qānâ*, “to acquire, to buy.” The King James translators took it as a verb formed from the noun for cattle, hence “taught me to keep cattle”; the Revised Version and several scholars read it as “caused (one) to purchase me, i.e. made me a bondman”; and others change the letters to read that the ground has been his possession. The plain-words paraphrase above keeps the King James sense. On any reading the point is the same: the man disowns any calling. He has worked the land since his youth, he says, “apparently seeking to distance himself from the group of false prophets condemned in the previous verses.”
    sources: [bdb, frederick-old-wine]

  - ref: 6
    phrase: What are these wounds in thine hands?
    kind: christ
    title: '“What are these wounds in thine hands?”'
    body: |
      In Zechariah the question seems to be put to a false prophet; in the Doctrine and Covenants the Lord takes the same words for His own wounds.

      Read in its chapter, verse 6 seems to continue the scene of verses 2–6, though it is a hard passage to place. The man who claims to be only a farmer is asked about marks “between thine hands” (so the Hebrew), “wounds that could identify him as a prophet, since self-flagellation and cutting were often signs of non-Israelite prophets.” The prophets of Baal “cut themselves after their manner with knives and lancets” ([[1 Kgs. 18:28]]). His answer, “in the house of my friends,” puts the wounds somewhere other than a prophet’s calling. On this reading, in that day “false prophets will be sought out and condemned, driven to offer alternative explanations for their prophetic marks.”

      In [[D&C 45:51–53]] the Lord keeps the words and changes the scene. The Jews who see Him at His coming will ask, “What are these wounds in thine hands and in thy feet?” and He will answer that they are “the wounds with which I was wounded in the house of my friends,” and “I am Jesus that was crucified” (the passage is quoted at [[Isa. 25:9]]). There the words refer “to Jesus Christ—one who was mistakenly identified as a false prophet during His mortal ministry.” The revelation expands Zechariah “by maintaining the language but drastically shifting the context so that Zechariah’s words have a new application and meaning.” The Church’s helps read verse 6 together with [[Zech. 12:10]] as the prophecies the Lord was “expanding on” in that revelation. The two passages are joined: the one “whom they have pierced” is applied to the cross in [[John 19:37]], “these wounds further identifying Jesus as the Messiah.” In the revelation the Lord, who was once taken for a false prophet, makes the words His own, and by those wounds His people will “know that I am the Lord” ([[D&C 45:52]]).
    sources: [frederick-old-wine, oshb-wlc, sc-knowhy-790, scripture-helps-hag-1-2]

  - ref: 7
    phrase: against the man that is my fellow
    kind: words
    title: '“The man that is my fellow”'
    body: |
      The shepherd the sword strikes is called the Lord’s own “fellow,” a word for the one nearest to Him, which is why readers have seen the Messiah here. The Hebrew *ʿāmît* means “associate, fellow, relation,” and the Church’s footnote renders the phrase “who stands next to me.” In the law of Moses it is used of a neighbour as near as a brother ([[Lev. 25:15]]). An older commentary draws the conclusion: “No owner of a flock or lord of a flock would call a hired or purchased shepherd” by that name, and so the one God calls His fellow “cannot be a mere man, but can only be one who participates in the divine nature, or is essentially divine.”

      The Lord’s call to the sword says that the smiting takes place “with or according to the will of God.” As in Isaiah, where “it pleased the LORD to bruise him” ([[Isa. 53:10]]), the sufferings of the Messiah are “inflicted upon Him by God, although He had given up His soul to death to bear the sin of the people.”
    sources: [bdb, lds-scriptures, keil-zechariah]

  - ref: 7
    phrase: smite the shepherd, and the sheep shall be scattered
    kind: christ
    title: The Shepherd smitten and the sheep scattered
    body: |
      Jesus applied verse 7 to Himself and His disciples on the night He was betrayed. “The Shepherd of Israel is Jesus Christ.” After the Last Supper, on the Mount of Olives, He told His disciples that all of them would stumble that night because of Him, for it was written, “I will smite the shepherd, and the sheep of the flock shall be scattered abroad” ([[Matt. 26:31]]; [[Mark 14:27]]). The tie to Zechariah makes His warning “almost certainly a prediction,” not a command, and it came true within hours: “they all forsook him, and fled” ([[Mark 14:50]]).

      He softened the warning in the same breath: “But after I am risen again, I will go before you into Galilee” ([[Matt. 26:32]]), a promise kept when He met them there after His Resurrection. That is the verse’s last line fulfilled, “I will turn mine hand upon the little ones,” read in its good sense: “the Lord soon brought back His hand over the disciples.” The gathering of the disciples was a beginning; “this special fulfilment did not indeed exhaust the meaning of the verses,” which reach on to the remnant of Israel in verses 8–9.
    sources: [ot-manual-33, huntsman-peters-denial]

  - ref: 9
    phrase: will refine them as silver is refined
    kind: symbol
    title: Refined as silver
    body: |
      The fire of verse 9 refines the third that is left; it does not destroy it. Here the Lord’s hand turned “upon the little ones” (verse 7) reaches its end: verse 9 “shows how the bringing back of the hand upon the small ones will be realized in the remnant of the nation.” That remnant is “to be refined through severe afflictions, to purify it from everything of a sinful nature, and make it into a truly holy nation of God.” The figure is the one Malachi uses of the Lord at His coming, who “shall sit as a refiner and purifier of silver” ([[Mal. 3:3]]). The refining ends in prayer answered, “they shall call on my name, and I will hear them,” and in the covenant spoken from both sides, “It is my people” and “The LORD is my God,” the promise of [[Hosea 2:23]] and [[Jer. 30:22]].
    sources: [keil-zechariah]

christ: |
  Zechariah 13 points to Jesus Christ in the two verses He took for His own. He is the Shepherd of verse 7, the man who stands next to the Lord, struck so that the sheep scattered; He quoted the verse the night His disciples fled ([[Matt. 26:31]]). And in [[D&C 45:51–52]] the words of verse 6 become His: He was “wounded in the house of my friends,” and by those wounds His own people will know Him at His coming.

  The fountain of verse 1 is opened “for sin and for uncleanness,” and the Church’s footnote sets it beside baptism: the cleansing Zechariah promised Jerusalem is the cleansing a disciple comes to in Christ. The Shepherd who foresaw His disciples’ scattering promised in the same breath to go before them into Galilee ([[Matt. 26:32]]), and kept the promise; those who stumble are not left outside His gathering.

explore: |
  - **The Lord’s own use of the chapter.** [[D&C 45:47–53]], with verse 6 and [[Zech. 14:4]].
  - **The night of the scattering.** [[Matt. 26:30–35]], [[Mark 14:26–31]] and [[Mark 14:50]], with verse 7.
  - **The refiner.** [[Mal. 3:1–3]] beside verse 9.
  - **The mourning before the fountain.** [[Zech. 12:10–14]], which verse 1 answers.

parallels:
