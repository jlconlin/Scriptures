    note: Jesus quotes verse 7 on the Mount of Olives, the night of His arrest.
  - ref: Mark 14:27
    note: Mark’s account of the same saying.
  - ref: D&C 45:52
    note: The Lord takes the words of verse 6 for His own wounds.

