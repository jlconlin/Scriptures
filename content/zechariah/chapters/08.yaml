chapter: 8
title: A City of Truth
tagline: The Lord answers a question about fasting with promises of a Jerusalem full of old men and playing children, of a gathered people, of fasts turned into feasts, and of nations who come to seek Him.
when: 'Zechariah prophesied in Jerusalem under Darius I of Persia, 520–518 B.C.'

setting: |
  Chapter 8 finishes the answer that chapter 7 began. In the fourth year of Darius, 518 B.C., men sent from Bethel asked whether they should go on weeping in the fifth month as they had for so many years ([[Zech. 7:1–3]]). The fasts they asked about seem to have begun in the exile, not in the law of Moses (see the note on verse 19). The Lord's reply runs through both chapters. Chapter 7 asks whom those fasts had been for and recalls the justice the fathers refused. Chapter 8 answers with promises: “The fasts shall be turned into festivals of joy (8:19).”

  The hearers were the builders of the second temple. The words “by the mouth of the prophets” in verse 9 are the promises of Zechariah and his contemporary Haggai ([[Ezra 5:1]]; [[Hag. 2]]), and the hard years of verse 10, when work earned nothing, recall the years Haggai had described ([[Hag. 1:9–11]]; [[Hag. 2:15–19]]).

  The promises speak first to those builders, then to later generations. Zechariah's prophecies “give hope to the faithful in at least three time periods”: his own contemporaries, those awaiting the Messiah in the meridian of time, and the Saints of the last days. The Church's chapter heading reads chapter 8 in the last of these: “In the last days, Jerusalem will be restored, Judah will be gathered, and the Lord will bless His people beyond anything in the past.”

thread: |
  Zechariah 8 answers a question about mourning: **should the people go on fasting in grief for Jerusalem?** The Lord's answer is that He has come back to it.

  The chapter is a string of short sayings, nearly every one opening “Thus saith the LORD of hosts.” The first group (verses 1–8) gives the reason the mourning can end: the Lord has “returned unto Zion,” and the ruined city will be called “a city of truth,” its streets full of the very old and the very young, its people gathered from east and west to be His people “in truth and in righteousness.” If that seems too hard to believe, it is not too hard for Him (verse 6).

  The second group (verses 9–17) turns to the builders: take courage, for the barren years are over, and as surely as the Lord kept His word to punish, He will keep His word to bless. The name “city of truth” comes with a duty, so the people are to speak truth to their neighbours and judge with truth and peace (verses 16–17).

  Only then comes the direct answer (verses 18–23). The four fasts of mourning will become “joy and gladness, and cheerful feasts,” on the condition already given: “therefore love the truth and peace.” The chapter ends with the nations seeking the Lord in Jerusalem, and ten men taking hold of one Jew's robe, “for we have heard that God is with you.”

sections:
  - range: 1-8
    heading: The Lord returns to Zion
    plain: |
      The word of the Lord of Hosts came to me again: The Lord of Hosts says, I have been fiercely jealous for Zion; I have burned with anger on her behalf. The Lord says, I have come back to Zion, and I will live in the middle of Jerusalem. Jerusalem will be called the city of truth, and the mountain of the Lord of Hosts the holy mountain.

      The Lord of Hosts says, Old men and old women will again sit in the streets of Jerusalem, each with a staff in hand because of great age, and the city's streets will be full of boys and girls playing. If this seems too wonderful to believe to the remnant of this people in these days, must it also be too wonderful for Me? says the Lord of Hosts.

      The Lord of Hosts says, I will save my people from the lands of the east and the lands of the west. I will bring them home, and they will live in the middle of Jerusalem. They will be My people and I will be their God, in truth and in righteousness.
  - range: 9-17
    heading: Let your hands be strong
    plain: |
      The Lord of Hosts says, Take courage, you who hear these words in these days from the mouths of the prophets who spoke when the foundation of the Lord's house was laid so that the temple could be built. Before that time no one earned wages, neither man nor beast; no one who came or went had peace because of the trouble, for I set everyone against his neighbour. But now I will not treat the remnant of this people as I did in earlier days, says the Lord of Hosts. The seed will prosper, the vine will give its fruit, the ground its crops, and the sky its dew, and I will give all these things to the remnant of this people. You were a byword for a curse among the nations, house of Judah and house of Israel; so I will save you, and you will be a blessing. Don't be afraid; take courage.

      For the Lord of Hosts says, When your fathers provoked Me, I determined to bring disaster on you, and I did not relent. So now I have determined to do good to Jerusalem and to the house of Judah. Don't be afraid. These are the things you must do: tell each other the truth; give judgments in your gates that are true and make peace. Do not plot harm against your neighbour in your heart, and do not love a false oath, for I hate all these things, says the Lord.
  - range: 18-23
    heading: Fasts become feasts
    plain: |
      The word of the Lord of Hosts came to me: The Lord of Hosts says, The fasts of the fourth, fifth, seventh, and tenth months will become times of joy and gladness and happy feasts for the house of Judah. So love truth and peace.

      The Lord of Hosts says, Peoples will yet come, the inhabitants of many cities. People of one city will go to another and say, “Let's go at once to pray before the Lord and to seek the Lord of Hosts. I'm going too.” Many peoples and powerful nations will come to Jerusalem to seek the Lord of Hosts and to pray before Him. The Lord of Hosts says, In those days ten men from nations of every language will take hold of a Jew by the hem of his robe and say, “Let us go with you, for we have heard that God is with you.”

notes:
  - ref: 3
    phrase: Jerusalem shall be called a city of truth
    kind: symbol
    title: A city of truth
    body: |
      Jerusalem's new name, “a city of truth,” is both a promise and a duty. The name comes with the Lord's return to dwell in the city. “With such a title comes responsibility”: the people “would have to make it a city full of truth and not just rely on its name to show this.” So when the Lord turns to what they must do, truth comes first: “Speak ye every man the truth to his neighbour; execute the judgment of truth and peace in your gates” (verse 16). In that reading, the first is “personal obedience” and the second “institutional obedience,” truth in what each person says and in how the community judges.

      The word returns through the chapter: the gathered people will be the Lord's “in truth and in righteousness” (verse 8), and the condition of the feasts is “love the truth and peace” (verse 19).
    sources: [ot-minute-zech]

  - ref: 4
    phrase: There shall yet old men and old women dwell in the streets of Jerusalem
    kind: symbol
    title: Old men and children in the streets
    body: |
      The very old and the very young in the streets picture a safe city. The promise answers Jerusalem as it was in the years of scattering, “a broken city, denuded of both the very old and very young.” Old people sitting out with a staff “for very age” have lived out their years, and children playing in the open are fed and well: “The older population would live longer because the city would be safe. The children would be happy because they would have food, and sickness would not overcome them.”

      The promise was not fulfilled in the Jerusalem of the next centuries. “Historically, peace was never achieved. Jerusalem would suffer more attacks and subjugation by the Greeks and the Romans,” and so one Latter-day Saint commentary reads the promise as “for the spiritual Zion.” Another reads it of a Jerusalem still to come, “a city of peace from which the Lord will govern,” where “children will play safely in the streets and grow to old age without war and turmoil.” The Church's chapter heading places the promise in the last days (see the setting).
    sources: [ot-manual-33, ot-minute-zech, vandyke-ogden-twelve]

  - ref: 6
    phrase: should it also be marvellous in mine eyes?
    kind: words
    title: Too hard for the Lord?
    body: |
      “Marvellous” here means too hard to do, and the question expects the answer no. The Hebrew verb means “be beyond one's power, difficult to do,” and in that sense this verse stands beside the Lord's question to Abraham, “Is any thing too hard for the LORD?” ([[Gen. 18:14]]), and Jeremiah's “there is nothing too hard for thee” ([[Jer. 32:17]]).

      A city full of the aged and of children (verses 4–5) might well seem beyond belief to the remnant of this people. The Lord grants that it may look so to them and denies that it looks so to Him. The second clause is “a question with a negative answer,” and the verse holds “an assurance not only of the greatness of the salvation set before them, but also of the certainty of its realization.”
    sources: [bdb, keil-zechariah]

  - ref: 7
    phrase: I will save my people
    kind: words
    title: Saved by being gathered
    body: |
      Joseph Smith's translation reads “gather” for “save,” here and again in verse 13 (footnotes 7a and 13b). The change says what kind of saving this is. The people are scattered “from the east country, and from the west country,” and the Lord's rescue is to bring them home to “dwell in the midst of Jerusalem” (verse 8): to save them is to gather them.
    sources: [jst-zech-8]

  - ref: 8
    phrase: they shall be my people, and I will be their God
    kind: scripture
    title: My people, and I will be their God
    body: |
      “They shall be my people, and I will be their God” describes the covenant relation. In one older reading, Israel had been Jehovah's people “from the time of the establishment of the old covenant at Sinai (Exodus 24),” and the promise is that “this relation is to be restored in the future, ‘in truth and righteousness.’” The return from Babylon only began it: that reading holds that the gathering “did indeed commence with the return of a body of exiles from Babylon under the guidance of Zerubbabel,” but that the gathering “out of all the countries of the earth is still in the future.”

      The footnote to the verse sends the reader to a revelation to the Church that uses the same words for the gathering to Zion: “when the city of the New Jerusalem shall be prepared, that ye may be gathered in one, that ye may be my people and I will be your God” ([[D&C 42:9]]).
    sources: [lds-scriptures, keil-zechariah]

  - ref: 13
    phrase: as ye were a curse among the heathen
    kind: words
    title: From a curse to a blessing
    body: |
      To be “a curse among the heathen” was to be “so smitten by God as to serve as the object of curses,” and the promise turns that into its opposite. To “be a blessing” means to be “so blessed as to be used as a benedictory formula.”

      The footnote to “blessing” points to the Lord's promise to Abraham, that “all the nations of the earth shall be blessed in him” ([[Gen. 18:18]]). The promise here is to “house of Judah, and house of Israel” together, so to “all the twelve tribes, who are to become partakers of the future salvation in undivided unity.” Here too Joseph Smith's translation reads “gather” for “save” (see the note on verse 7).
    sources: [keil-zechariah, lds-scriptures, jst-zech-8]

  - ref: 19
    phrase: The fast of the fourth month, and the fast of the fifth, and the fast of the seventh, and the fast of the tenth
    kind: history
    title: Four fasts of mourning
    body: |
      The four fasts kept the memory of Jerusalem's fall, and the Lord answers the question of [[Zech. 7:3]] by turning all four into feasts. None seems to have come from the law of Moses: “The Day of Atonement appears to be the only fast ordered by the law. Other fasts were instituted during the exile.” Each marked a stage of the Babylonian conquest:

      - the **tenth month**, when the Babylonian siege began ([[Jer. 39:1]]; see [[Ezek. 24:2]]);
      - the **fourth month**, when the city was broken into ([[Jer. 39:2]]);
      - the **fifth month**, when the temple was burned ([[Jer. 52:12–14]]), the fast Bethel asked about;
      - the **seventh month**, when Gedaliah, whom the king of Babylon had made ruler over those left in Judah, was murdered ([[2 Kgs. 25:22–25]]).

      Bethel had asked only about the fifth month, and the Lord's first answer named the fifth and seventh ([[Zech. 7:5]]). Here He names all four: “The fasts of mourning that had dotted the Jewish calendar would now be celebrations of ‘joy and gladness.’” The verse ends with what He asks instead: “therefore love the truth and peace.”
    sources: [bd-fasts, ot-manual-33, ot-minute-zech]

  - ref: 22
    phrase: many people and strong nations shall come to seek the LORD of hosts in Jerusalem
    kind: scripture
    title: The nations go up to seek the Lord
    body: |
      Zechariah's nations, urging one another to go and seek the Lord, are the nations Isaiah had seen. The footnote to the verse points to Isaiah's prophecy in Nephi's copy of it ([[2 Ne. 12:3]]) and back to Zechariah's own promise that “many nations shall be joined to the LORD” ([[Zech. 2:11]], where the note treats it). Isaiah's nations say to one another, “Come ye, and let us go up to the mountain of the LORD, to the house of the God of Jacob; and he will teach us of his ways” ([[Isa. 2:3]]). Zechariah's say, “Let us go speedily to pray before the LORD, and to seek the LORD of hosts: I will go also” (verse 21). In both, the nations urge one another on and go up together to seek the Lord.

      One Latter-day Saint reading takes Isaiah's prophecy that “all nations shall flow unto” the Lord's house ([[Isa. 2:2]]), and this chapter's nations with it, as fulfilled now “in the temples and general conference attendance.”
    sources: [lds-scriptures, ot-minute-zech]

  - ref: 23
    phrase: shall take hold of the skirt of him that is a Jew
    kind: words
    title: Holding the hem of a Jew
    body: |
      To take hold of someone's “skirt” was to attach oneself to him as a follower. The “skirt” is the *kānāp*, which of a garment means the “skirt, corner, or loose flowing end,” the corner on which Israel wore its fringes ([[Num. 15:38]]). An ancient inscription from Zinjirli, the Panammu inscription, uses the same gesture, “figurative for attached himself to the party of his lord,” and this verse is the same figure.

      So the ten men are not begging; they are joining. Their reason is in their words: “We will go with you: for we have heard that God is with you.” The “you” is plural in the Hebrew (footnote 23a): they take hold of one man and speak to more than him. The name may also reach wider than Judah: “it is possible that the word Jew is used here to refer to Israelites in general and not just a descendant of the tribe of Judah” (compare [[Rom. 2:28–29]]; [[2 Ne. 30:2]]).
    sources: [oshb-wlc, bdb, lds-scriptures, ot-manual-33]

christ: |
  The Lord who says “I am returned unto Zion, and will dwell in the midst of Jerusalem” (verse 3) gathers His people to Himself. An older commentary reads the gathering of verses 7–8 as “first effected through the Messiah,” and holds that the glory promised in verses 18–23 began to be fulfilled with “the appearance of Christ upon earth.”

  The chapter's last verse finds God's presence in a people: the nations take hold of a Jew because “God is with you” (verse 23). “Faithful people, not buildings, make a place holy,” and “the only accurate indicator of our spiritual condition is the nature of our hearts.” A disciple who speaks truth to a neighbour and loves truth and peace (verses 16, 19) is the kind of person others take hold of now: “people will take hold of a missionary or a Latter-day Saint, saying ‘we have heard that God is with you.’”

explore: |
  - **The question this chapter answers.** Read [[Zech. 7]] first, then verse 19.
  - **The nations at the Lord's house.** Read [[Isa. 2:2–4]] beside verses 20–23, and [[Zech. 2:10–11]].
  - **The builders' barren years.** Read [[Hag. 1:5–11]] and [[Hag. 2:15–19]] beside verses 9–12.
  - **The gathering to Zion.** Read [[D&C 42:9]] with verses 7–8.

