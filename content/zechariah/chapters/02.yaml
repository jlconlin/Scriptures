chapter: 2
title: A Wall of Fire
tagline: A man sets out to measure Jerusalem, and an angel runs with the answer that the city will spill past any wall, because the Lord Himself will be its wall of fire and the glory in its midst. Then the exiles still in Babylon are called home, and the nations are promised a place among the Lord's people.
when: 'Zechariah prophesied in Jerusalem under Darius I of Persia, 520–518 B.C.'

setting: |
  This is the third of the visions Zechariah saw “by night” in “the second year of Darius” ([[Zech. 1:7–8]]). He and Haggai were “instrumental in organizing and inspiring the Jews to finish rebuilding the temple,” but the community was small and its city had been destroyed: Jerusalem “lay in rubble.” Its walls were still broken when Nehemiah came in the twentieth year of Artaxerxes ([[Neh. 2:1]]; [[Neh. 2:17]]).

  The first two visions answered that discouragement from heaven's side. The Lord had “returned to Jerusalem with mercies” ([[Zech. 1:16]]), and the horns that had scattered Judah would be cast down ([[Zech. 1:21]]). The third vision turns to the city itself. Verses 1–5 are the vision, and verses 6–13 a prophetic address that explains it. Promises like those of verses 4–5 and 12 “would have supplied much needed encouragement to the downtrodden exiles working to rebuild the temple.” The chapter is also read as a promise for the last days: Judah gathered to Jerusalem, and the Lord dwelling among them.

thread: |
  Zechariah 2 is about **a city defined by what is in its midst, not by its walls**.

  It opens with a man going to find out how long and how broad Jerusalem is. The answer comes back at a run: the city will be lived in like open country, too full of people and cattle for walls, and the Lord will be “a wall of fire round about” and “the glory in the midst of her” (verses 4–5).

  The address that follows explains that promise and gives its reason. The Lord calls His scattered people out of Babylon and turns His hand against the nations that plundered them (verses 6–9). Then “I will dwell in the midst of thee,” He says twice (verses 10–11), and “many nations shall be joined to the LORD in that day.” The second promise complements the first: the nations joined to the Lord belong to the multitude that leaves the city without walls. By dwelling in the midst of Jerusalem the Lord becomes the wall of verse 5, and the city receives the growth verse 4 foresaw. The chapter ends in silence before Him.

sections:
  - range: 1-5
    heading: A city too large for walls
    plain: |
      I looked up again and saw a man holding a measuring line. I asked, “Where are you going?” He said, “To measure Jerusalem, to see how wide and how long it is.” Then the angel who was speaking with me went out, and another angel came out to meet him and said, “Run, tell this young man: Jerusalem will be lived in like open country without walls, because so many people and animals will be in it. For I, says the Lord, will be a wall of fire all around her, and I will be the glory within her.”
  - range: 6-9
    heading: Come out of Babylon
    plain: |
      Come, come! Flee from the land of the north, says the Lord, for I have spread you out like the four winds of heaven, says the Lord. Escape, Zion, you who live with the daughter of Babylon! For this is what the Lord of hosts says: after glory He has sent me to the nations that plundered you, for whoever touches you touches the apple of His eye. I will wave my hand over them, and they will become plunder for those who served them. Then you will know that the Lord of hosts has sent me.
  - range: 10-13
    heading: I will dwell in the midst of thee
    plain: |
      Sing and rejoice, daughter of Zion, for I am coming, and I will live among you, says the Lord. Many nations will join themselves to the Lord in that day and become my people. I will live among you, and you will know that the Lord of hosts has sent me to you. The Lord will take Judah as His own portion in the holy land and will choose Jerusalem again. Be silent before the Lord, all people, for He has risen from His holy dwelling.

notes:
  - ref: 1
    phrase: a man with a measuring line in his hand
    kind: symbol
    title: Measuring a city that cannot be measured
    body: |
      The man with the measuring line sets out to learn how big Jerusalem will be, and the vision's answer is that no line can hold it: “The city shall be immeasurable and overflow with people.” The Lord had just promised that “a line shall be stretched forth upon Jerusalem” ([[Zech. 1:16]]), and here a man goes out to take its length and breadth. Taking a city's measurements assumes the city is there, so the vision shows the future Jerusalem “as a city in actual existence, and visible to the spiritual eye.”

      Who the figures are is less certain. The interpreting angel (see [[Zech. 1:9]]) is not the man; he goes out only after him. The man may be the angel of the Lord, partly by analogy with the man who measures Ezekiel's temple ([[Ezek. 40:3]]), “although this conjecture cannot be distinctly proved.” A second angel then sends the interpreting angel running with a message for “this young man” (verse 4). “The majority of both the earlier and later expositors” take the young man to be Zechariah himself, called so “on account of his youthful age”: the message is for the prophet to carry to the people, not for the measurer. The angel runs because the news is good.
    sources: [bd-zechariah, keil-zechariah]
  - ref: 5
    phrase: a wall of fire round about
    kind: symbol
    title: A wall of fire
    body: |
      Jerusalem will need no wall because the Lord Himself will be its wall, and its glory within. Verse 4 pictures a city lived in “as towns without walls,” spread out like open country (compare the unwalled villages of [[Ezek. 38:11]]). Jerusalem “would not have a wall because of the multitude of people who would inhabit it,” and the Lord's fire would take the wall's place: His presence, not stone, would be the city's defense.

      Jerusalem did get a wall of stone again. When Nehemiah arrived he said, “Let us build up the wall of Jerusalem” ([[Neh. 2:17]]), and that wall “lasted for centuries.” The city did not grow beyond its walls until modern times. One reading takes verses 4–5 as Zechariah's “depiction of Jerusalem in the last days,” a city whose safety rests on the Lord in its midst.
    sources: [ot-minute-zech, lds-scriptures, ot-manual-33, vandyke-ogden-twelve]
  - ref: 7
    phrase: Deliver thyself, O Zion, that dwellest with the daughter of Babylon
    kind: history
    title: Out of Babylon
    body: |
      The call of verses 6–7 is to the Jews still living in Babylon, “the land of the north”: they are to leave it and come home. “The daughter of Babylon” is the people among whom they live, for prophets often called the inhabitants of a city its “daughter.” Babylon had already fallen to Persia, so the call is not an escape from a besieged city but a summons to leave the land of exile for Jerusalem.
    sources: [ot-minute-zech]
  - ref: 8
    phrase: the apple of his eye
    kind: words
    title: The apple of his eye
    body: |
      In King James English, “the apple of the eye is the pupil.” Scripture uses the image for what the Lord guards. In the Song of Moses, the Lord found Israel in the wilderness and “kept him as the apple of his eye” ([[Deut. 32:10]]), and the psalmist prays, “Keep me as the apple of the eye, hide me under the shadow of thy wings” ([[Ps. 17:8]]). In Zechariah the image explains the judgment on “the nations which spoiled you”: to touch Judah is to touch the apple of the Lord's eye, and verse 9 says what follows.
    sources: [webster-1828, lds-scriptures]
  - ref: 11
    phrase: thou shalt know that the LORD of hosts hath sent me unto thee
    kind: christ
    title: The LORD sent by the LORD of hosts
    body: |
      The speaker of verses 8–11 is sent by “the LORD of hosts,” and yet he speaks as the Lord: “I come, and I will dwell in the midst of thee, saith the LORD” (verse 10). One reading takes the one who says “after the glory hath he sent me” (verse 8) to be “not the prophet, but the angel of the Lord,” sent “to display the glory of God upon the heathen through the judgment by which their power is broken.” When he waves his hand over the nations (verse 9), “his acting is identical with the acting of God.”

      For Latter-day Saints the LORD who says in verse 10, “I come, and I will dwell in the midst of thee,” is Jehovah, and “Jehovah is the premortal Jesus Christ.”
    sources: [keil-zechariah, bd-jehovah]
  - ref: 11
    phrase: many nations shall be joined to the LORD in that day
    kind: scripture
    title: Many nations joined to the Lord
    body: |
      The nations of verse 11 answer the open city of verse 4: the verse is “complementary to the prophecy of a Jerusalem with no walls,” and in it the Lord repeats words from earlier scripture. The crowded, unwalled city is “consistent with the blessing and responsibility offered to Abraham,” that all the families of the earth would be blessed in him ([[Gen. 12:3]]), and with Isaiah's promise that strangers who join themselves to the Lord would be brought to His holy mountain ([[Isa. 56:3–7]]). Jeremiah saw the nations gathered to Jerusalem in the same way ([[Jer. 3:17]], where the note quotes these verses).
    sources: [ot-minute-zech]

christ: |
  The Lord who promises “I will dwell in the midst of thee” is the Lord Jesus Christ. Read beside John's two sentences, the dwelling began “with the coming of the Son of God in the flesh” and will be completed “by His return in glory”: “the Word was made flesh, and dwelt among us” ([[John 1:14]]), and “the tabernacle of God is with men, and he will dwell with them” ([[Rev. 21:3]]). The Church's footnotes link verse 11 to the latter-day promise that the Lord “shall have power over his saints, and shall reign in their midst” ([[D&C 1:36]]).

  The wall of fire reaches a disciple now: a heart centered in God has Him, in Zechariah's words, as “a wall of fire round about” that no wickedness can penetrate.

