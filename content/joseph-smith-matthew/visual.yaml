summary: >-
  Joseph Smith—Matthew is the Savior's teaching on the Mount of Olives, given as He
  looked across at the temple whose fall He foretold. It joins that sober word to a
  promise: His coming will be seen as plainly as morning light across the whole earth,
  and those who treasure up His word will know the season and not be deceived. The image
  stands on the mount in quiet morning, looking across to the temple, with a small fig
  tree just coming into leaf on the slope below: the leaves tell the season, not the day.
motifs:
  - "Herod's temple, whole and quiet, across the valley (JS—M 1:3): on the far ridge across the Kidron valley, on its broad stone platform, a large sanctuary of pale, squared limestone, a simple, level, symmetrical mass with a bright stone face and a few gold-touched edges. The huge, even courses of the platform wall are the point of it: a few large, flat, square-cut stones laid course on course. It stands whole and calm, lit full on its east face by the morning light, never in smoke, ruin, or fire. It is the picture's focal point, in the middle distance, not crowding the frame."
  - "A fig tree just putting out its first leaves (JS—M 1:38–39): small and in the middle distance, on the slope below the viewer among a few olive trees, a little left of center: a spreading, rounded, low-branching fig tree, its gray branches mostly bare, with a few small, tender, pale-green leaves just opening at the twig tips, so it reads as the one tree in leaf-bud among the gray-green olives. It is noticed second, after the temple, and is never in the foreground."
  - "The light of the morning over the whole land (JS—M 1:26): the sun has just risen in the east, behind the viewer and out of the picture. Its warm, low gold light shines west across the whole scene, lighting the faces of the hills, the trees and the temple that look toward the viewer, and every shadow falls away from the viewer, toward the west and the far horizon. The western sky beyond the temple is clear, cool, pale blue, with no glow, no sunset colors, and no sun disk; the warmth is on the land, not in the sky behind it. No lightning."
composition: >-
  A wide, calm landscape seen from high on the Mount of Olives, looking west across the
  Kidron valley in the first light of morning. The near ground is a narrow strip of
  open hillside along the bottom edge, quiet and plain: grass and a few low pale rocks,
  with no tree and no large object in it. Below, the slope runs down with a few
  gray-green olive trees and, among them a little left of center, the small fig tree
  just coming into leaf. The valley floor lies in soft shadow. On the far ridge, at the
  right of center and a little above the middle of the frame, the temple on its great
  platform stands in full morning light, the clearest and brightest thing in the
  picture, with the low hills of the city's ridge around it. Sunlight comes from behind
  the viewer, low, so that all the shadows reach away toward the far horizon. Soft,
  harmonious colors: warm gold on the lit faces, cool blue-green in the shadowed
  valley, a clear pale sky with plenty of open space. No people, no animals, no fire,
  no smoke, no lightning, no falling stones, no broken walls, no storm clouds.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The fig tree with its first small leaves** is the parable the Lord gives: “When its branches are yet tender, and it begins to put forth leaves, you know that summer is nigh at hand,” and so those who see the signs “shall know that he is near, even at the doors.” The leaves tell the season; of the day and hour no one knows ([[JS—M 1:38–40]]).'
  - '**The temple across the valley** is the one the disciples admired and of which the Lord said, “there shall not be left here, upon this temple, one stone upon another” ([[JS—M 1:3]]).'
  - '**The morning light over the whole land** is the translation''s image of His coming: “as the light of the morning cometh out of the east, and shineth even unto the west, and covereth the whole earth” ([[JS—M 1:26]]).'
alt: Seen from the Mount of Olives in early morning light, a large pale stone temple stands whole on its great platform across a shadowed valley, with olive trees and one small fig tree just coming into leaf on the slope below.
status: proposed
