summary: >-
  Joseph Smith—Matthew is the Savior's teaching on the Mount of Olives, given as He
  looked across at the temple whose fall He foretold. It joins that sober word to a
  promise: His coming will be seen as plainly as morning light across the whole earth,
  those who treasure up His word will not be deceived, and His elect will know when He is near. The image
  stands on the slope of the mount in quiet morning, looking across to the temple in the
  distance, with a small fig tree just coming into leaf among the olives: the leaves tell
  the season, not the day.
motifs:
  - "Herod's temple, whole and quiet, in the distance (JS—M 1:3): on the far ridge, right of center, a large sanctuary of pale, squared limestone on its broad walled platform, with the city's walls and houses spread along the ridge beside it. It stands whole and calm in full morning light, never in smoke, ruin, or fire: small in the frame, but the brightest built thing in it."
  - "A fig tree just putting out its first leaves (JS—M 1:38–39): on the slope a little left of center, among the gray-green olive trees, a low, spreading fig tree with bare gray branches and small, tender, pale-green leaves just opening at the twig tips, the one tree in leaf-bud among the olives."
  - "The light of the morning over the whole land (JS—M 1:26): the sun is behind the viewer and out of the picture; its warm, low light lies across the near slope, the far hillsides and the temple, and the sky beyond is clear, pale blue, with no sun disk, glow, or lightning."
composition: >-
  A wide, calm landscape seen from the upper slope of the Mount of Olives, a little above
  the level of the city, looking west across the Kidron valley in the first light of
  morning. In front, a grassy slope with a few pale rocks runs down to the right, with a
  row of olive trees across it and the fig tree among them at the left. Beyond, the
  wooded valley falls away and rises again to the far ridge, where the temple on its
  platform and the city stand at the right of center, with low hills behind them. The
  upper half of the picture is clear sky. No people, no animals, no fire, no smoke, no
  lightning, no falling stones, no broken walls, no storm clouds.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The fig tree with its first small leaves** is from the parable the Lord gives: “When its branches are yet tender, and it begins to put forth leaves, you know that summer is nigh at hand,” and so those who see the signs “shall know that he is near, even at the doors.” The leaves tell the season; of the day and hour no one knows ([[JS—M 1:38–40]]).'
  - '**The temple across the valley** is the one the disciples admired and of which the Lord said, “there shall not be left here, upon this temple, one stone upon another” ([[JS—M 1:3]]).'
  - '**The morning light over the whole land** is the translation''s image of His coming: “as the light of the morning cometh out of the east, and shineth even unto the west, and covereth the whole earth” ([[JS—M 1:26]]).'
