chapter: 1
title: 'The Signs of His Coming'
tagline: 'On the Mount of Olives the disciples ask when the temple will fall and what will signal the Lord’s coming; Joseph Smith’s translation answers the two questions one after the other, and promises that whoever treasures His word will not be deceived.'
when: 'Spoken on the Mount of Olives in the last week of Jesus’s ministry; translated by Joseph Smith in 1831, probably between mid-April and mid-June.'

setting: |
  Joseph Smith—Matthew is the sermon Jesus gave on the Mount of Olives, from the last verse of Matthew 23 through Matthew 24, as Joseph Smith’s translation of the Bible gives it. In the story it falls in the last week of His ministry: when He “had finished all these sayings,” He told the disciples that “after two days is the feast of the passover” ([[Matt. 26:1–2]]). He has just left the temple Herod had begun building in 20 B.C., the building whose fall He foretells.

  The translation had its own occasion. On 7 March 1831, at Kirtland, Ohio, Joseph Smith received the revelation now in [[D&C 45]], which is in large part another telling of this same sermon. It ends: “it shall not be given unto you to know any further concerning this chapter, until the New Testament be translated” ([[D&C 45:60–61]]). The next day he set Genesis aside and began the New Testament, and he reached Matthew 24 some weeks later, probably between mid-April and mid-June. He revised it heavily, “adding phrases, rearranging verses”; the result is about a third longer than Matthew’s chapter.

  The early Saints printed it on a single sheet, perhaps at Kirtland in 1835, though where and when are uncertain. Franklin D. Richards put it in his *Pearl of Great Price* in 1851, it was canonized with that book in 1880, and since 1981 it has been called “Joseph Smith—Matthew.”

thread: |
  **Two questions, two answers, and one promise.**

  In verse 4 the disciples ask when the temple will be destroyed and what will be the sign of His coming and “the end of the world, or the destruction of the wicked.” In Matthew the answer can be read as one answer to both. Here the Lord answers them in turn: verses 5–21 tell of deceivers, persecution, the abomination of desolation and the siege of Jerusalem in the first century, and then “Behold, these things I have spoken unto you concerning the Jews; and again” opens the answer about the last days, which runs to the end of the chapter.

  The second answer repeats much of the first. Deceivers come again, iniquity abounds again, the abomination is fulfilled again, and the promise to whoever “is not overcome” is given twice ([[JS—M 1:11]], [[JS—M 1:30]]). Every sign leads to the one event, the Son of Man “coming in the clouds of heaven, with power and great glory” ([[JS—M 1:36]]). Running through both answers is the warning that opens the sermon, “Take heed that no man deceive you” ([[JS—M 1:5]]), and the second answer adds the promise that meets it: “whoso treasureth up my word, shall not be deceived” ([[JS—M 1:37]]). The chapter ends where the disciples’ question did, with “the end of the wicked” ([[JS—M 1:55]]).

sections:
  - range: 1-3
    heading: 'Leaving the temple'
    plain: |
      I tell you, from now on you will not see me and know that I am the one the prophets wrote of, until you say: Blessed is he who comes in the name of the Lord, in the clouds of heaven, with all the holy angels. Then his disciples understood that he would come to the earth again, after he had been glorified and crowned at the right hand of God. Jesus went out and left the temple, and his disciples came to hear him. Master, they said, tell us about the buildings of the temple, since you have said they will be thrown down and left to you desolate. Jesus said: Do you see all these things, and do you not understand them? I tell you truly, not one stone will be left here on another on this temple that will not be thrown down.
  - range: 4-4
    heading: 'Two questions on the Mount of Olives'
    plain: |
      Jesus left them and went up the Mount of Olives. As he sat there, the disciples came to him privately and asked: Tell us when the things you have said about the destruction of the temple and the Jews will happen. And what is the sign of your coming, and of the end of the world, that is, the destruction of the wicked, which is the end of the world?
  - range: 5-11
    heading: 'The first answer: deceivers, persecution, and enduring'
    plain: |
      Jesus answered: Be careful that no one deceives you. Many will come in my name, saying, I am the Christ, and will deceive many. Then they will hand you over to be afflicted and will kill you, and all nations will hate you because of my name. Then many will fall away and betray one another. Many false prophets will arise and deceive many. Because wickedness will abound, the love of many will grow cold. But whoever stays steadfast and is not overcome will be saved.
  - range: 12-20
    heading: 'The abomination of desolation and the flight from Judea'
    plain: |
      So when you see the abomination of desolation that Daniel the prophet spoke of, concerning the destruction of Jerusalem, then you must stand in the holy place; let the reader understand. Then those in Judea must flee to the mountains. Whoever is on the housetop must flee and not go back for anything in the house, and whoever is in the field must not go back for clothes. It will go hard in those days with women who are pregnant or nursing. So pray to the Lord that you will not have to flee in winter or on the Sabbath. For in those days great tribulation will come on the Jews and the people of Jerusalem, such as God has never sent on Israel from the beginning of their kingdom until now, and never will again. All that has happened to them is only the beginning of the sorrows that will come on them. If those days were not cut short, none of them would survive; but for the sake of the elect, according to the covenant, those days will be cut short.
  - range: 21-31
    heading: '“And again”: the second answer begins'
    plain: |
      These are the things I have told you concerning the Jews. And again: after the tribulation that will come on Jerusalem, if anyone tells you, Look, here is the Christ, or there, do not believe him. In those days false Christs and false prophets will also arise and show great signs and wonders, so that if it were possible they would deceive even the elect, who are the elect according to the covenant. I tell you these things for the elect’s sake. You will also hear of wars and rumors of wars; do not be troubled, for everything I have told you must happen, but the end is not yet. See, I have told you beforehand. So if they tell you, He is in the desert, do not go out; or, He is in the inner rooms, do not believe it. For as the light of morning comes out of the east and shines to the west and covers the whole earth, so will the coming of the Son of Man be. Here is a parable: wherever the carcass is, there the eagles gather; in the same way my elect will be gathered from the four quarters of the earth. They will hear of wars and rumors of wars. I speak for my elect’s sake: nation will rise against nation and kingdom against kingdom, and there will be famines, epidemics, and earthquakes in many places. And again, because wickedness will abound, the love of many will grow cold; but whoever is not overcome will be saved. And again, this gospel of the kingdom will be preached in all the world as a witness to all nations, and then the end will come, the destruction of the wicked.
  - range: 32-36
    heading: 'The abomination again, and the sign in heaven'
    plain: |
      And the abomination of desolation that Daniel the prophet spoke of will be fulfilled again. Immediately after the tribulation of those days the sun will be darkened, the moon will not give its light, the stars will fall from heaven, and the powers of heaven will be shaken. I tell you truly, the generation in which these things are shown will not pass away until everything I have told you is fulfilled. The day will come when heaven and earth pass away, but my words will not pass away; all of them will be fulfilled. And as I said, after the tribulation of those days, when the powers of heaven are shaken, the sign of the Son of Man will appear in heaven. Then all the tribes of the earth will mourn, and they will see the Son of Man coming in the clouds of heaven with power and great glory.
  - range: 37-40
    heading: 'Treasuring His word; the fig tree'
    plain: |
      Whoever treasures up my word will not be deceived. For the Son of Man will come, and he will send his angels ahead of him with the great sound of a trumpet, and they will gather the rest of his elect from the four winds, from one end of heaven to the other. Learn a lesson from the fig tree: when its branches are tender and it starts to put out leaves, you know summer is close. In the same way, when my elect see all these things, they will know that he is near, right at the doors. But no one knows that day and hour, not even the angels of God in heaven; only my Father.
  - range: 41-55
    heading: 'As in the days of Noah; the faithful servant; the end of the wicked'
    plain: |
      As it was in Noah’s day, so it will be when the Son of Man comes. In the days before the flood, until the day Noah went into the ark, people were eating and drinking, marrying and giving in marriage, and they did not know until the flood came and swept them all away; so will the coming of the Son of Man be. Then what is written will be fulfilled, that in the last days two will be in the field, one taken and the other left; two will be grinding at the mill, one taken and the other left. What I say to one I say to everyone: keep watch, for you do not know at what hour your Lord is coming. Know this: if the master of the house had known in which watch of the night the thief would come, he would have stayed awake, would not have let his house be broken into, and would have been ready. So you must be ready too, for the Son of Man is coming at an hour you do not expect. Who, then, is the faithful and wise servant whom his master has put in charge of his household, to give them their food at the right time? Blessed is that servant whom his master finds doing so when he comes; truly, he will put him in charge of all he owns. But if that wicked servant says to himself, My master is delaying his coming, and begins to beat his fellow servants and to eat and drink with drunkards, the master of that servant will come on a day he does not expect and at an hour he does not know. He will cut him apart and give him his place with the hypocrites, where there will be weeping and grinding of teeth. So comes the end of the wicked, as Moses prophesied: They will be cut off from among the people. But the end of the earth is not yet; it will come by and by.

notes:
  - ref: 1
    phrase: 'Then understood his disciples that he should come again on the earth'
    kind: history
    title: 'Why the chapter begins with Matthew 23:39'
    body: |
      The chapter opens with the last verse of Matthew 23 because that verse introduces the sermon, and the translation lengthens it. When the early Saints printed the chapter on a broadside, its heading explained the choice: “in order to show the connection we will commence with the last verse of the 23rd chapter.” Matthew’s verse reads, “Ye shall not see me henceforth, till ye shall say, Blessed is he that cometh in the name of the Lord” ([[Matt. 23:39]]). Joseph Smith’s translation adds “and know that I am he of whom it is written by the prophets,” and everything from “in the clouds of heaven” on is new. The added words make the line a prophecy of the Lord’s coming in glory with the holy angels, and the verse ends by saying the disciples understood it so: He “should come again on the earth, after that he was glorified and crowned on the right hand of God.”
    sources: [crawley-bibliography-1, jackson-jst-new-testament, ogden-prophecies-jsm]

  - ref: 3
    phrase: 'upon this temple, one stone upon another'
    kind: history
    title: 'Not one stone upon this temple'
    body: |
      The disciples were admiring Herod’s rebuilt temple, begun in 20 B.C.; “no other temple complex in the Greco-Roman world compared with its expansiveness and magnificence.” Matthew has Jesus say only “There shall not be left here one stone upon another” ([[Matt. 24:2]]). Joseph Smith’s translation adds “upon this temple,” which aims the prophecy at the sanctuary itself. The great retaining walls of the Temple Mount, parts of which still stand, were not what He meant. The sanctuary itself fell: in A.D. 70 the Romans set fire to the temple gates, and the fire led to the destruction of the building.
    sources: [ogden-prophecies-jsm, ludlow-first-jewish-revolt, lds-scriptures]

  - ref: 4
    phrase: 'Tell us when shall these things be which thou hast said concerning the destruction of the temple, and the Jews'
    kind: structure
    title: 'Two questions, answered one after the other'
    body: |
      Joseph Smith’s translation turns the disciples’ question into two distinct questions and gives the answers one after the other. In Matthew they ask, “when shall these things be? and what shall be the sign of thy coming, and of the end of the world?” ([[Matt. 24:3]]), and Jesus’s words “can be understood as answering both questions simultaneously.” That has left readers asking whether the temple’s fall and the Second Coming were meant to be one event. The disciples themselves seem to have wondered whether the two went together.

      Here the first question names its subject, “the destruction of the temple, and the Jews,” and the second defines the end of the world (see the next note). The first answer runs from verse 5 into the middle of verse 21; the second runs from there to the end. The Lord marks the turn Himself: “Behold, these things I have spoken unto you concerning the Jews; and again, after the tribulation of those days which shall come upon Jerusalem” ([[JS—M 1:21]]). In the printed text the break falls in the middle of a sentence; the manuscript, which Latter-day Saints did not have when the editions were prepared, has a paragraph break at that point.
    sources: [jackson-sign-thy-coming, jackson-jst-new-testament, ludlow-first-jewish-revolt, lds-scriptures]

  - ref: 4
    phrase: 'or the destruction of the wicked, which is the end of the world'
    kind: words
    title: '“The end of the world”'
    body: |
      The translation defines its own phrase: “the end of the world” is “the destruction of the wicked,” not the end of the planet. Joseph Smith taught the same thing in a letter to the elders published in December 1835. On the parable of the wheat and the tares, he wrote that both grow together “until the harvest, or the end of the world, which means the destruction of the wicked; which is not yet fulfilled.” The chapter’s last verse keeps the two apart: “thus cometh the end of the wicked … but the end of the earth is not yet, but by and by” ([[JS—M 1:55]]).
    sources: [jsp-letter-elders-1835-12, ogden-prophecies-jsm]

  - ref: 8
    phrase: 'and shall betray one another;'
    kind: history
    title: 'A clause restored in today’s edition'
    body: |
      The 1921 edition printed here ends verse 8 with “and shall betray one another;”. The Church’s current edition adds “and shall hate one another,” as Matthew also reads ([[Matt. 24:10]]). The clause was in the original dictation but was lost in 1831, when John Whitmer copied the manuscript and his eye skipped from the word “another” to the same word later in the line and left out what lay between, a slip called *haplography*. The 1981 edition restored the clause.
    sources: [pgp-1921, jackson-moses-jsm, lds-scriptures]

  - ref: 9
    phrase: 'many false prophets shall arise, and shall deceive many'
    kind: history
    title: 'False prophets in besieged Jerusalem'
    body: |
      The first answer’s warnings about deceivers (verses 5–6, 9) have been read against the war that ended at Jerusalem: one Latter-day Saint reading suggests that Jesus was “perhaps” alluding to Zealot leaders and others who led the people astray. Josephus, who wrote the history of the war, describes the day Roman soldiers set fire to a cloister of the temple’s outer court, where about six thousand people, women and children among them, had taken refuge. “A false prophet,” he writes, “was the occasion of these people’s destruction”: that very day the man had proclaimed “that God commanded them to get upon the temple, and that there they should receive miraculous signs of their deliverance.” There were “a great number of false prophets suborned by the tyrants,” telling the people to wait for deliverance from God, “in order to keep them from deserting.”

      The same history of factions turning on their own people has been read as the fulfillment of verse 10, that “the love of many shall wax cold.”
    sources: [ludlow-first-jewish-revolt, josephus-war]

  - ref: 12
    phrase: 'then you shall stand in the holy place'
    kind: scripture
    title: 'The abomination, and where the disciples stand'
    body: |
      Joseph Smith’s translation says what the abomination concerns and moves who stands in the holy place. In Matthew the abomination is what will “stand in the holy place” ([[Matt. 24:15]]). Here it is “concerning the destruction of Jerusalem,” and it is the disciples who stand: “then you shall stand in the holy place.” The prophecy was fulfilled first when the Roman legions under Titus laid siege to Jerusalem in A.D. 70, and verse 32 promises a second fulfillment, when Jerusalem will again be under siege. What Daniel’s phrase meant in his own day is in the note at [[Dan. 11:31]].

      In one Latter-day Saint reading, the holy place is not the temple, which was about to be destroyed, but the places God appoints for refuge, spiritual and physical. The revelation of March 1831 makes the same promise for the last days: “my disciples shall stand in holy places, and shall not be moved” ([[D&C 45:32]]).
    sources: [bd-abomination-of-desolation, ludlow-first-jewish-revolt, ogden-prophecies-jsm, lds-scriptures]

  - ref: 13
    phrase: 'Then let them who are in Judea flee into the mountains'
    kind: history
    title: 'The flight from Judea'
    body: |
      The command to flee may have been obeyed. An early Christian tradition says the Christians of Jerusalem left the city around the beginning of the revolt and settled at Pella, a city of the Decapolis east of the Jordan. The move is “believed to have taken place in A.D. 66,” almost four years before the city fell. The tradition is not certain: some scholars today doubt it, asking, for example, whether Christians could have traveled freely while the Romans were putting down the revolt. If the tradition holds, the flight answered Jesus’s instruction in these verses. Those who flee are not to go back for anything, and they are to pray that it not come in winter or on the Sabbath.
    sources: [ludlow-first-jewish-revolt, horton-jsm]

  - ref: 18
    phrase: 'great tribulation on the Jews, and upon the inhabitants of Jerusalem'
    kind: history
    title: 'The siege of Jerusalem'
    body: |
      The tribulation of verse 18 is the Roman siege of Jerusalem during the revolt that began in A.D. 66, “an enormously tragic event for the Jewish people and the city of Jerusalem.” Four legions under Titus besieged the city for seven months. The rebel factions burned the city’s food supply to force others into the fight, and the people inside “starved, tried to escape, or waited for the inevitable end.”

      The translation fits Matthew’s words to this event. Matthew’s “such as was not since the beginning of the world” ([[Matt. 24:21]]) becomes tribulation “such as was not before sent upon Israel, of God, since the beginning of their kingdom.” Verse 19 calls it “only the beginning of the sorrows,” a phrase that in Matthew follows the wars and famines ([[Matt. 24:8]]). Verse 20 adds mercy: the days would be shortened “for the elect’s sake, according to the covenant,” so that not all would perish.
    sources: [ludlow-first-jewish-revolt, lds-scriptures]

  - ref: 22
    phrase: 'who are the elect according to the covenant'
    kind: scripture
    title: 'The elect according to the covenant'
    body: |
      Matthew has simply “the elect” ([[Matt. 24:22]], [[Matt. 24:24]]); Joseph Smith’s translation adds “according to the covenant.” The added words say who the elect are: the Lord’s covenant people. The Book of Mormon says whom the Lord covenants with, “none save it be with them that repent and believe in his Son” ([[2 Ne. 30:2]]), and the Church’s footnote on “covenant” in verse 20 points there. The elect are “those who love God with all their hearts and live lives that are pleasing to Him.” Modern revelation speaks of them in this chapter’s terms: “mine elect hear my voice and harden not their hearts” ([[D&C 29:7]]), and “will I gather mine elect from the four quarters of the earth, even as many as will believe in me” ([[D&C 33:6]]).

      In both answers the sermon is spoken for them. In the first, the days of Jerusalem’s siege are shortened “for the elect’s sake” (verse 20). In the second, deceivers would deceive “the very elect” if they could (verse 22), and the Lord twice says He speaks “for mine elect’s sake” (verses 23, 29). In one Latter-day Saint reading, “Jesus taught all these things for the sake of His Saints, the elect, the covenant people.”
    sources: [gs-elect, ogden-prophecies-jsm, lds-scriptures]

  - ref: 27
    phrase: 'so likewise shall mine elect be gathered from the four quarters of the earth'
    kind: symbol
    title: 'The eagles and the gathering'
    body: |
      In Matthew the saying about the carcase and the eagles stands alone ([[Matt. 24:28]]) and leaves the reader to guess its lesson. Joseph Smith’s translation calls it a parable and explains it: as the eagles gather, “so likewise shall mine elect be gathered from the four quarters of the earth.” His translation of Luke explains the same saying the same way: “whithersoever the saints are gathered, thither will the eagles be gathered together; or, thither will the remainder be gathered together” (JST, Luke 17:37). In both, the eagles gathering is an image of the saints gathering.

      One Latter-day Saint reading carries this further and takes the carcase as the Church and the eagles as the Saints, so that holy places “are found wherever righteous saints gather together.”
    sources: [ogden-prophecies-jsm, horton-jsm, lds-scriptures]

  - ref: 29
    phrase: 'nation shall rise against nation, and kingdom against kingdom'
    kind: structure
    title: 'Signs moved to the last days, and signs given twice'
    body: |
      The translation separates the two answers by moving some signs and repeating others. In Matthew, wars and rumors of wars, nation against nation, famines, pestilences and earthquakes come near the start of the sermon ([[Matt. 24:6–7]]), before the abomination of desolation. Here they come only after “and again” (verses 23, 28–29), and that gives them a last-days setting.

      Other signs are given once in each answer. Deceivers come in both (verses 5–6, 9 and 22). Iniquity abounds and love grows cold in both, with the same promise to whoever is not overcome (verses 10–11 and 30), and the repetition shows these to be marks of both periods. Daniel’s abomination of desolation is fulfilled in both (verses 12 and 32). Within the second answer the wars are mentioned twice (verses 23, 28), and so is “for mine elect’s sake” (verses 23, 29). The preaching of the gospel “in all the world,” which in Matthew comes before the abomination ([[Matt. 24:14]]), stands here as the last sign before “the end … or the destruction of the wicked” (verse 31).
    sources: [jackson-sign-thy-coming, ogden-prophecies-jsm, bd-abomination-of-desolation, lds-scriptures]

  - ref: 30
    phrase: 'the love of many shall wax cold'
    kind: history
    title: 'Many or men'
    body: |
      The 1921 edition printed here repeats verse 10’s wording, “the love of many shall wax cold.” The Church’s current edition reads “the love of men shall wax cold.” Both of Joseph Smith’s manuscripts read “men”; “many” came into the text in the 1878 edition, and the 1981 edition restored the manuscripts’ reading.
    sources: [pgp-1921, jackson-moses-jsm, lds-scriptures]

  - ref: 34
    phrase: 'this generation, in which these things shall be shown forth'
    kind: words
    title: 'Which generation'
    body: |
      In Matthew the verse reads “This generation shall not pass, till all these things be fulfilled” ([[Matt. 24:34]]), and readers have long been troubled that the disciples’ generation passed while some of the prophecies remained unfulfilled. Joseph Smith’s translation adds a clause that addresses the question: “this generation, in which these things shall be shown forth.” The clause ties the generation to the signs rather than to the disciples who heard the sermon. In one Latter-day Saint reading, it is “the generation in which the particular events are to transpire, i.e., the last days.”

      The revelation of March 1831 speaks of a generation in each of the sermon’s two fulfillments: “this generation of Jews shall not pass away until every desolation which I have told you concerning them shall come to pass” ([[D&C 45:21]]), and, of the last days, “in that generation shall the times of the Gentiles be fulfilled” ([[D&C 45:30]]).
    sources: [horton-jsm, lds-scriptures]

  - ref: 36
    phrase: 'then shall appear the sign of the Son of Man in heaven'
    kind: prophets
    title: 'The sign of the Son of Man'
    body: |
      The verse does not describe the sign, but it says what follows it: “they shall see the Son of Man coming in the clouds of heaven, with power and great glory.” In April 1843 Joseph Smith taught that after the other signs there would be “one grand sign” in heaven, and that the world would explain it away: “they will say it is a planet. a comet. &c.” In Willard Richards’s notes of the sermon he went on: “the son of man will come as the sign of coming of the son of man. is as the light of the morning cometh out of the East.” On that teaching the sign is the Lord’s own coming.

      The image of the morning is the translation’s. Where Matthew compares the coming to “the lightning” that “cometh out of the east, and shineth even unto the west” ([[Matt. 24:27]]), Joseph Smith—Matthew has “the light of the morning,” which “covereth the whole earth” ([[JS—M 1:26]]).
    sources: [jsp-discourse-1843-04-06-b, ogden-prophecies-jsm, lds-scriptures]

  - ref: 37
    phrase: 'whoso treasureth up my word, shall not be deceived'
    kind: scripture
    title: 'Treasuring up His word'
    body: |
      This promise is new in Joseph Smith’s translation; in Matthew the verse begins with the angels and the trumpet ([[Matt. 24:31]]). It answers the warning that runs through both halves of the sermon, from “Take heed that no man deceive you” (verse 5) to false Christs who would deceive “the very elect” if they could (verse 22). The Lord “puts it in the form of a promise,” and the verb asks for more than reading: whoso “not just reads, or even studies, but treasures up” His word.

      The sermon’s message is meant to reassure. Those who prepare by treasuring up His word “will avoid deception because they will recognize the signs of his coming and will know that he is near,” the very knowledge the fig tree teaches in the next verses.
    sources: [ogden-prophecies-jsm, jackson-sign-thy-coming, lds-scriptures]

  - ref: 38
    phrase: 'Now learn a parable of the fig tree'
    kind: symbol
    title: 'The fig tree tells the season, not the day'
    body: |
      The fig tree teaches when the coming is near, not the day it comes. In the land where Jesus spoke, the fig puts out its first small leaves in late winter, usually in March, and that is the sign the warm season is beginning. Matthew applies the parable to the disciples: “ye … know that it is near” ([[Matt. 24:33]]). The translation applies it to “mine elect,” who “shall know that he is near, even at the doors.” The March 1831 revelation gives the same parable for the last days: “then shall they know that the hour is nigh” ([[D&C 45:38]]).

      Verse 40 sets the limit: “of that day, and hour, no one knoweth.” The Lord “has not revealed exactly when He will come again,” but He has revealed the signs. The thief of verse 47 makes the same point from the other side, since no householder knows when a thief will come. “He does not want us to be prepared for a certain date; He wants us to be ready always.”
    sources: [ogden-prophecies-jsm, topics-second-coming, lds-scriptures]

  - ref: 44
    phrase: 'two shall be in the field, the one shall be taken, and the other left'
    kind: scripture
    title: 'As in the days of Noah: taken and left'
    body: |
      The comparison with Noah’s day is about not knowing. The people before the flood were doing ordinary things, “eating and drinking, marrying and giving in marriage,” and they “knew not until the flood came, and took them all away” (verses 42–43). Their world had filled with wickedness before it was cleansed, and the flood still caught them by surprise (see [[Gen. 6:5]] and [[Moses 8:22]]).

      Verses 44–45 do not say where the one is taken. One Latter-day Saint reading looks to the revelation on the Lord’s coming, in which “the saints that are upon the earth, who are alive, shall be quickened and be caught up to meet him” ([[D&C 88:96]]). On that reading the one taken is caught up to meet Him, and the one left remains on the earth that is to be cleansed.
    sources: [ogden-prophecies-jsm, lds-scriptures]

  - ref: 54
    phrase: 'shall cut him asunder'
    kind: words
    title: 'Meat in due season, and a servant cut asunder'
    body: |
      Two phrases in the parable of the servants need explaining. The faithful servant is set over the household “to give them meat in due season” (verse 49). “Meat” here means food: “better, to give them their food.” The wise servant has to know both the right food and the right season for giving it. In one Latter-day Saint reading, the faithful servants are those “feeding the flock and giving meat to the sheep of the Good Shepherd.”

      The evil servant’s lord “shall cut him asunder.” Taken literally this was a punishment of Eastern kings, and here it seems to have been chosen for its figurative fitness: the servant had been “a hypocrite, double-minded, trying to serve two masters,” and the judgment divides what he had divided. The verse puts him “with the hypocrites.” He told himself “My lord delayeth his coming” (verse 51), and on that thought he beat his fellow servants and ate and drank with the drunken (verse 52).
    sources: [ellicott-matthew, ogden-prophecies-jsm]

  - ref: 55
    phrase: 'according to the prophecy of Moses'
    kind: scripture
    title: 'The end of the wicked, and the prophecy of Moses'
    body: |
      The closing verse is new in Joseph Smith’s translation; Matthew’s chapter ends with the evil servant. It answers the second half of the disciples’ question in their own words: they asked for the sign of “the destruction of the wicked, which is the end of the world” (verse 4), and the sermon ends, “thus cometh the end of the wicked.”

      The verse quotes the “prophecy of Moses,” “They shall be cut off from among the people,” without saying where Moses gave it. The same words close Moses’ prophecy of a prophet like himself as the risen Lord gives it in the Book of Mormon: “I am he of whom Moses spake, saying: A prophet shall the Lord your God raise up unto you … every soul who will not hear that prophet shall be cut off from among the people” ([[3 Ne. 20:23]]). Moroni quoted that prophecy to Joseph Smith from Peter’s sermon ([[Acts 3:22–23]]) and told him that “that prophet was Christ,” but that the day when “they who would not hear his voice should be cut off from among the people” had not yet come, “but soon would come” ([[JS—H 1:40]]). The end of the earth itself is “not yet, but by and by” (see the note on verse 4).
    sources: [ogden-prophecies-jsm, lds-scriptures]

christ: |
  The whole sermon is Christ’s prophecy of Himself. Every sign in it leads to one event: “they shall see the Son of Man coming in the clouds of heaven, with power and great glory” ([[JS—M 1:36]]). He tells His disciples what to do while they wait: treasure up His word ([[JS—M 1:37]]), watch ([[JS—M 1:46]]), and “be ye also ready” ([[JS—M 1:48]]).

  The revelation that began this translation says who will be ready: “they that are wise and have received the truth, and have taken the Holy Spirit for their guide, and have not been deceived … shall abide the day” ([[D&C 45:57]]). For a disciple who keeps His word the signs are not a threat: “the righteous need not fear the Second Coming or the signs that precede it,” and when they come, “ye may know that the promises which have been made unto you shall be fulfilled” ([[D&C 45:35]]).

explore: |
  - **The same sermon in modern revelation.** [[D&C 45:16–75]], given the day before the New Testament translation began; [[D&C 29:9–27]] and [[D&C 88:87–97]] add to it.
  - **Luke’s and Mark’s accounts in the translation.** Joseph Smith’s translation of [[Luke 21]] divides the sermon the same way, between verses 24 and 25; for [[Mark 13]], after a few sentences of Mark’s own, most of the revised Matthew was copied in.
  - **Daniel’s abomination.** [[Dan. 11:31]] and [[Dan. 12:11]], and the theme page [The Desolate Sanctuary and the Messiah](/daniel/themes/desolate-sanctuary/).
  - **A study to read whole.** “‘What Is the Sign of Thy Coming?’” in *Understanding Joseph Smith’s Translation of the Bible*: a short account of how the translation reorders the sermon, with the manuscript’s own paragraph break at verse 21.

