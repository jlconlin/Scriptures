    key: jsp-discourse-1843-04-06-b
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-6-april-1843-b-as-reported-by-willard-richards/13'
    quote: 'then one grand sign of the Son of the son of man in heaven.—18 but what will the world. do? they will say it is a planet. a comet. &c— consequently the son of man will come as the sign of coming of the son of man.'
  - where: 'note 1:36 “The sign of the Son of Man”'
    claim: 'The report closes with the light of the morning out of the East'
    key: jsp-discourse-1843-04-06-b
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-6-april-1843-b-as-reported-by-willard-richards/13'
    quote: 'the son of man will come as the sign of coming of the son of man. is as the light of the morning cometh out of the East.'
  - where: 'note 1:36 “The sign of the Son of Man”'
    claim: 'Matthew 24:27 reads “lightning”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'For as the lightning cometh out of the east, and shineth even unto the west; so shall also the coming of the Son of man be.'
  - where: 'note 1:36 “The sign of the Son of Man”'
    claim: 'The verse itself defines the sign: they shall see the Son of Man coming'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'the verse itself as expanded by the Lord through the Prophet Joseph Smith defines and clarifies the subject of the sign: “They shall see the Son of Man coming in the clouds of heaven, with power and great glory.”'

  - where: 'note 1:36 “The sign of the Son of Man”'
    claim: 'The one grand sign, Joseph Smith taught, is the Lord Himself'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'The one grand sign, Joseph Smith taught, is the Lord Himself.'

  - where: 'note 1:37 “Treasuring up His word”'
    claim: 'Matthew 24:31 has no promise against deception'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.'
  - where: 'note 1:37 “Treasuring up His word”'
    claim: 'Those who treasure up Christ’s word will avoid deception because they will recognize the signs'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'those who would prepare themselves for that event by treasuring up Christ’s word, by being wise, receiving the truth, standing in holy places, and taking the Holy Spirit for their guide will avoid deception because they will recognize the signs of his coming and will know that he is near.'
  - where: 'note 1:37 “Treasuring up His word”'
    claim: 'Treasuring is more than reading or studying; it is a promise'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'In fact, He puts it in the form of a promise: “Whoso treasureth up [not just reads, or even studies, but treasures up] my word, shall not be deceived.”'

  - where: 'note 1:38 “The fig tree tells the season, not the day”'
    claim: 'The fig tree puts out its first leaves in late winter, signaling the warm season'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'During late winter (usually in March), the fig tree issues its first tiny leaves, signaling the beginning of the warm season.'
  - where: 'note 1:38 “The fig tree tells the season, not the day”'
    claim: 'The Lord has not revealed when, but has revealed the signs'
    key: topics-second-coming
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/second-coming-of-jesus-christ?lang=eng'
    quote: 'The Lord has not revealed exactly when He will come again'
  - where: 'note 1:38 “The fig tree tells the season, not the day”'
    claim: 'D&C 45:37–38 gives the parable in the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Even so it shall be in that day when they shall see all these things, then shall they know that the hour is nigh.'
  - where: 'note 1:38 “The fig tree tells the season, not the day”'
    claim: 'Matthew 24:33 reads “ye … know that it is near”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'So likewise ye, when ye shall see all these things, know that it is near, even at the doors.'
  - where: 'note 1:38 “The fig tree tells the season, not the day”'
    claim: 'He wants us ready always, not for a date'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'He does not want us to be prepared for a certain date; He wants us to be ready always.'

  - where: 'note 1:44 “As in the days of Noah: taken and left”'
    claim: 'Gross wickedness before the world is cleansed; people caught suddenly'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'The comparison with the last days of Noah is most appropriate—gross wickedness before the world is cleansed—back then by water'
  - where: 'note 1:44 “As in the days of Noah: taken and left”'
    claim: 'One reading: those taken are the Saints caught up to meet Him (D&C 88:96)'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'Fortunately, there is a clear and specific answer to the query about which situation is preferred. Doctrine & Covenants 88:96 indicates that “the Saints that are upon the earth, who are alive, shall be quickened and be caught up to meet him.”'

  - where: 'note 1:54 “Meat in due season, and a servant cut asunder”'
    claim: '“Meat” means food; the servant’s work is giving the household its food at the right time'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'To give them meat in due season.—Better, to give them their food.'
  - where: 'note 1:54 “Meat in due season, and a servant cut asunder”'
    claim: 'The wise servant must know the right food and the right season'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'The wise servant will seek to discover not only the right kind of food, but the right season for giving it.'
  - where: 'note 1:54 “Meat in due season, and a servant cut asunder”'
    claim: 'Cutting asunder was literally a punishment of Eastern kings; it seems chosen for its figurative fitness to a double-minded hypocrite'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'The form of punishment (one which, in its literal sense, belongs to the inventive cruelty of Eastern kings) would seem here to have been chosen for its figurative fitness. The man had been a hypocrite, double-minded, trying to serve two masters'
  - where: 'note 1:54 “Meat in due season, and a servant cut asunder”'
    claim: 'The faithful servants feed the Lord’s flock'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'They are the chosen servants who are feeding the flock and giving meat to the sheep of the Good Shepherd.'

  - where: 'note 1:55 “The end of the wicked, and the prophecy of Moses”'
    claim: 'Verse 55 is new and includes a prophecy of Moses'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'This is a new verse added by the Prophet Joseph Smith, and it includes a prophecy of Moses.'
  - where: 'note 1:55 “The end of the wicked, and the prophecy of Moses”'
    claim: 'In 3 Nephi Jesus quotes Moses: “cut off from among the people”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'Behold, I am he of whom Moses spake, saying: A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you. And it shall come to pass that every soul who will not hear that prophet shall be cut off from among the people.'
  - where: 'note 1:55 “The end of the wicked, and the prophecy of Moses”'
    claim: 'Moroni quoted Acts 3:22–23, said that prophet was Christ, and that the cutting off was soon to come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'He said that that prophet was Christ; but the day had not yet come when “they who would not hear his voice should be cut off from among the people,” but soon would come.'
  - where: 'note 1:55 “The end of the wicked, and the prophecy of Moses”'
    claim: 'Acts 3:23 reads “destroyed from among the people”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/3?lang=eng'
    quote: 'And it shall come to pass, that every soul, which will not hear that prophet, shall be destroyed from among the people.'

