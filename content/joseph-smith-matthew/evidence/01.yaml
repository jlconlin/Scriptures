  - where: 'note 1:27 “The eagles and the gathering”'
    claim: 'Matthew leaves the lesson of the saying to be surmised; the translation explains it as the gathering of the elect'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'The King James text leaves the reader to surmise what the lesson of this analogy might be, but Joseph Smith—Matthew includes a simple explanation'
  - where: 'note 1:27 “The eagles and the gathering”'
    claim: 'Matthew 24:28 has the saying alone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'For wheresoever the carcase is, there will the eagles be gathered together.'
  - where: 'note 1:27 “The eagles and the gathering”'
    claim: 'JST Luke 17:37 explains the saying of the gathering of the saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/17?lang=eng'
    quote: 'Wheresoever the body is gathered; or, in other words, whithersoever the saints are gathered, thither will the eagles be gathered together; or, thither will the remainder be gathered together.'
  - where: 'note 1:27 “The eagles and the gathering”'
    claim: 'One reading: the carcase is the church, the eagles the saints, gathered in holy places'
    key: horton-jsm
    url: 'https://rsc.byu.edu/pearl-great-price-revelations-god/joseph-smith-matthew-profiting-prophecy'
    quote: 'holy places are found wherever righteous saints gather together. In the words of the prophecy, “wheresoever the carcase [the church] is, there will the eagles [the saints] be gathered together”'

  - where: 'note 1:29 “Signs moved to the last days, and signs given twice”'
    claim: 'Relocation and repetition: wars, famines, pestilences, earthquakes moved later; abounding iniquity repeated'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'Thus “wars and rumors of wars,” kingdoms fighting against kingdoms, famines, pestilences, and earthquakes are moved from early in the chapter to later, giving them a last-days setting.'
  - where: 'note 1:29 “Signs moved to the last days, and signs given twice”'
    claim: 'Repetition shows them to be characteristics of both periods'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'Abounding iniquity and the preaching of the gospel to the world are repeated, showing them to be characteristics of both periods.'
  - where: 'note 1:29 “Signs moved to the last days, and signs given twice”'
    claim: 'Wars and the elect’s sake are repeated within the second answer'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'Foreshadowing of wars and rumors of wars is a repetition. So also is the Lord’s declaration that He is speaking for the elect’s sake.'
  - where: 'note 1:29 “Signs moved to the last days, and signs given twice”'
    claim: 'In Matthew 24:6–7 wars and famines come early'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'For nation shall rise against nation, and kingdom against kingdom: and there shall be famines, and pestilences, and earthquakes, in divers places.'
  - where: 'note 1:29 “Signs moved to the last days, and signs given twice”'
    claim: 'The abomination is fulfilled twice'
    key: bd-abomination-of-desolation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abomination-of-desolation?lang=eng'
    quote: 'Conditions of desolation, born of abomination and wickedness, were to occur twice in fulfillment of Daniel’s words.'

  - where: 'note 1:30 “Many or men”'
    claim: 'The manuscripts read “men”; the 1878–1921 editions “many”; 1981 restored “men”'
    key: jackson-moses-jsm
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/book-moses-joseph-smith-matthew'
    quote: 'It corrected an error that came into the text in the 1878 edition:'
  - where: 'note 1:30 “Many or men”'
    claim: 'NT1 and NT2 read “the love of men shall wax cold”'
    key: jackson-moses-jsm
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/book-moses-joseph-smith-matthew'
    quote: 'JST (NT1, NT2) “the love of men shall wax cold” (Joseph Smith—Matthew 1:30)'
  - where: 'note 1:30 “Many or men”'
    claim: 'The 1921 edition reads “many” in verse 30'
    key: pgp-1921
    url: 'https://archive.org/download/pearlofgreatpric0000jose_d8d6/pearlofgreatpric0000jose_d8d6_djvu.txt'
    quote: 'the love of many shall wax cold; but he that shall not be overcome, the same shall be saved.'
  - where: 'note 1:30 “Many or men”'
    claim: 'The current edition reads “men”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'And again, because iniquity shall abound, the love of men shall wax cold; but he that shall not be overcome, the same shall be saved.'

  - where: 'note 1:34 “Which generation”'
    claim: 'The ancient generation passed; some explained it as John not dying or as a dispensation'
    key: horton-jsm
    url: 'https://rsc.byu.edu/pearl-great-price-revelations-god/joseph-smith-matthew-profiting-prophecy'
    quote: 'The problem is explicit—that ancient generation has long since passed and some of these things (prophecies) have not yet come to pass.'
  - where: 'note 1:34 “Which generation”'
    claim: '“This generation” refers to the generation in which the events transpire'
    key: horton-jsm
    url: 'https://rsc.byu.edu/pearl-great-price-revelations-god/joseph-smith-matthew-profiting-prophecy'
    quote: 'This clearly indicates that “this generation” refers to the generation in which the particular events are to transpire, i.e., the last days.'
  - where: 'note 1:34 “Which generation”'
    claim: 'Matthew 24:34 reads without the qualifying clause'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'Verily I say unto you, This generation shall not pass, till all these things be fulfilled.'
  - where: 'note 1:34 “Which generation”'
    claim: 'D&C 45:21 and 45:30 speak of “this generation of Jews” and “that generation”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'And it shall come to pass, that this generation of Jews shall not pass away until every desolation which I have told you concerning them shall come to pass.'

  - where: 'note 1:36 “The sign of the Son of Man”'
