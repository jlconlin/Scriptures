    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/30?lang=eng'
    quote: 'for the Lord covenanteth with none save it be with them that repent and believe in his Son, who is the Holy One of Israel.'
  - where: 'note 1:22 “The elect according to the covenant”'
    claim: 'He taught these things for the sake of His Saints, the elect, the covenant people'
