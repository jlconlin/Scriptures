alt: A low booth of poles and leafy branches stands on a stony pasture hillside at sunrise, part of it fallen and part raised again with fresh green boughs. Beside it a plumbline hangs from a peg on a dry-stone wall, and a single sycomore fig tree stands on the distant hills.
