summary: >-
  Amos is sent to a prosperous kingdom whose worship is full and whose justice is for
  sale. The Lord measures it against a plumbline, says He will not pass by it again, and
  yet the book does not end in ruin. Its last word is that He will raise up the fallen
  tabernacle of David and close the breaches of it. The image rests on that last
  promise: a fallen booth set up again, with the straight line that measured Israel
  still hanging beside it.
motifs:
  - "A fallen booth of David (Amos 9:11): a low shelter of poles and leafy branches on a stony pasture hillside, part of it collapsed in a heap of boughs and part already standing again, its poles upright and its roof freshly laid with green branches. It is the one large form and the focal point, caught in low gold light."
  - "A plumbline (Amos 7:7–8): a plain cord with a small dark lead weight, hanging motionless from a peg set in the top of a low dry-stone wall beside the booth, true against the wall's face."
  - "A single sycomore fig tree with a broad crown on the far slope, a herdsman's tree (Amos 7:14), small against the open pasture hills of Judah behind."
composition: >-
  A wide, open hillside of pale pasture and scattered stone at first light, seen from a
  slightly raised viewpoint. The booth stands left of center with the wall and its hanging
  plumbline just to its right, the two close enough to read as one picture; the wall is
  low and runs out of the frame, not around anything. A few green shoots show in the
  loosened ground at the booth's foot. Behind them, long folded hills fall away to a
  warm pale sky, with the sycomore small on the far slope. The light is gentle and the
  mood is quiet and hopeful. No fire, no ruin as a spectacle, no altar, no building,
  no animals, no figures.
