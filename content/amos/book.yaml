description: A phrase-by-phrase companion to the book of Amos, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Nine chapters in three movements. Judgment circles through Israel’s neighbors and lands on Israel. Amos then argues the case against a prosperous people and pleads with them to seek the Lord. Five visions close the book, and its last verses promise the fallen house of David raised again.
home:
  blurb: A herdsman from Judah sent to the prosperous northern kingdom. He charged it with crushing the poor while its shrines were full, and he taught that the Lord does nothing without revealing His secret to His servants the prophets.

intro: |
  Amos was a herdsman from Tekoa, in Judah, whom the Lord “took” as he “followed the flock” and sent north to prophesy to the kingdom of Israel ([[Amos 7:15]]). His book dates itself to the reigns of Uzziah of Judah and Jeroboam II of Israel, in the eighth century B.C., a generation before Assyria ended the northern kingdom. The kingdom was prosperous. Samaria had winter houses and summer houses and beds of ivory, and the shrines at Beth-el and Gilgal were busy.

  Amos said that the worship was worthless while the poor were sold “for a pair of shoes” ([[Amos 2:6]]). Israel alone had been known by the Lord, and for that reason it would be held to a stricter account ([[Amos 3:2]]). He taught that the Lord warns before He acts: “Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets” ([[Amos 3:7]]). He foretold a famine “of hearing the words of the LORD” ([[Amos 8:11]]), and the book ends with the Lord raising “the tabernacle of David that is fallen” ([[Amos 9:11]]). This companion goes through all nine chapters and tries to anticipate the questions a careful reader would ask.

# The three divisions follow Scripture Helps: Old Testament (2025).
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: amosnations
    range: [1, 2]
    name: For Three Transgressions, and for Four
    blurb: The Lord roars from Zion. Judgment falls on Damascus, Gaza, Tyre, Edom, Ammon and Moab for their cruelty, then on Judah, and last and longest on Israel, which sold the poor and silenced its prophets.
    color: '#8a4a2a'
    darkColor: '#e0a884'
  - key: amoswords
    range: [3, 6]
    name: Hear This Word
    blurb: Because the Lord has known Israel alone, He will hold it to account. He has sent famine, drought and pestilence, and the people have not returned. He despises their feast days and asks for justice. Woe to those at ease in Zion.
    color: '#3f6f8f'
    darkColor: '#8fc0e0'
  - key: amosvisions
    range: [7, 9]
    name: Thus Hath the Lord God Shewed unto Me
    blurb: Visions of locusts, fire, a plumbline, a basket of summer fruit, and the Lord standing upon the altar. A priest orders Amos out of Beth-el, a famine of the word is foretold, and the Lord promises to raise the fallen house of David.
    color: '#5a7a3a'
    darkColor: '#b4d490'

