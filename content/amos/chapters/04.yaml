chapter: 4
title: Yet Have Ye Not Returned unto Me
tagline: Samaria’s wealthy women call for drink and its pilgrims crowd the shrines. The Lord counts five warnings He has already sent, each ending in the same words, and then tells Israel to get ready to meet Him.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  Amos, a herdsman from Judah, is preaching in the northern kingdom of Israel in the reign of Jeroboam II, about 760–750 B.C. The kingdom was enjoying “an era of peace and prosperity” (the setting of [[Amos 1]] has the kings and the dates), and this chapter speaks to people who had the leisure to call for drink and the means to bring sacrifices, tithes and freewill offerings.

  The chapter stands in the middle part of the book, chapters 3–6, the warnings to the northern kingdom and the plea to repent. Like the chapters on either side of it, it opens with “Hear this word” ([[Amos 3:1]]; [[Amos 5:1]]).

  Three places are named. Samaria was the capital, and Bethel and Gilgal were the shrines to which the kingdom went up; the note on verse 4 says what they were. For the map and the kings, see [The Land](/old-testament/guides/the-land/) and [Israel’s Story](/old-testament/guides/israels-story/).

  None of the warnings this chapter counts turned the kingdom, and about a generation later it was “conquered by the Assyrians in 722 BC.”

thread: |
  The chapter moves from a table to an altar to a list, and ends with a summons.

  It begins with the comfortable (verses 1–3): women who say “Bring, and let us drink” while the poor are crushed, and who will leave the city through holes in its wall. Then come the devout (verses 4–5). They go to Bethel and Gilgal, they bring sacrifices, tithes, thank offerings and freewill offerings, and the Lord calls the whole of it transgression. “For this liketh you”: it is what they love.

  Verse 6 turns on that phrase. “And I also” sets what the Lord has done beside what Israel loves to do: you love your worship, and I have tried every means of turning you to me. Five times He names a calamity He sent, and five times the result is the same: “yet have ye not returned unto me.”

  So the chapter ends (verses 12–13) with a meeting that Israel has not arranged. “Prepare to meet thy God,” and the last verse says who that is: the one who forms the mountains and makes the wind, who knows a person’s thought, and whose name is the LORD.

sections:
  - range: 1-3
    heading: The cows of Bashan
    plain: |
      Hear this word, you cows of Bashan on the hill of Samaria, you who oppress the poor and crush the needy, who say to your husbands, “Bring us something to drink.” The Lord GOD has sworn by His holiness: the days are coming when you will be hauled away with hooks, and those who come after you with fishhooks. You will go out through the breaks in the wall, each one straight ahead, and you will be thrown out (where to, the Hebrew no longer makes clear), says the LORD.
  - range: 4-5
    heading: Come to Beth-el, and transgress
    plain: |
      Come to Bethel, and sin; go to Gilgal, and sin some more. Bring your sacrifices every morning and your tithes every three years. Burn a thank offering of leavened bread, and announce your freewill offerings so that everyone hears; for this is what you love to do, children of Israel, says the Lord GOD.
  - range: 6-11
    heading: Five warnings that did not turn them
    plain: |
      I left you with nothing to chew in all your cities and no bread in any of your towns; yet you did not return to me. I held back the rain three months before the harvest; I sent rain on one city and none on another, and people from two or three cities staggered to one city for water and did not get enough; yet you did not return to me. I struck you with blight and mildew, and the locust ate your gardens, vineyards, fig trees and olive trees; yet you did not return to me. I sent a plague like those of Egypt; I killed your young men with the sword, took your horses, and filled your nostrils with the stench of your camps; yet you did not return to me. I overthrew some of you as God overthrew Sodom and Gomorrah, and you were like a stick snatched from the fire; yet you did not return to me, says the LORD.
  - range: 12-13
    heading: Prepare to meet thy God
    plain: |
      Therefore this is what I will do to you, Israel; and because I will do it, prepare to meet your God, Israel. For He is the one who forms the mountains and creates the wind, who tells a man what his thought is, who makes the morning darkness and walks on the heights of the earth. The LORD, the God of hosts, is His name.

notes:
  - ref: 1
    phrase: ye kine of Bashan
    kind: symbol
    title: The cows of Bashan are the rich women of Samaria
    body: |
      Amos is speaking to the wealthy women of the capital, and he calls them cattle of a district known for its herds. Bashan was the district east of the Jordan, “an area rich in grain production and known for its breed of cattle,” and a psalm speaks of the “strong bulls of Bashan” ([[Ps. 22:12]]). The comparison is “a symbolic and uncomplimentary reference.”

      That women are meant is clearer in Hebrew than in the King James Version. The three verbs that describe them (“which oppress,” “which crush,” “which say”) are feminine plural forms, and a modern translation says it outright: “you women who oppress the poor.” The “masters” they give orders to are their husbands, as two modern translations render the word.

      The charge is not the drinking. It is what pays for it: they “oppress the poor” and “crush the needy.” Amos brings that charge against the powerful more than once. Treading on the poor is one of the two sins that dominate his case against Israel, and this verse stands in a list with [[Amos 5:11]], [[Amos 5:12]] and [[Amos 8:4]] as grievances “against the elite of the Israelites.” The women are charged with what the men are charged with, living well on what was taken from people who had little. The feasting itself is described at more length in [[Amos 6:4–6]].
    sources: [bd-bashan, oshb-wlc, niv, nrsvue, vandyke-ogden-twelve, matson-amos-kinship, lds-scriptures]

  - ref: 2
    phrase: he will take you away with hooks, and your posterity with fishhooks
    kind: words
    title: Hooks, fishhooks, and the last of you
    body: |
      The picture is of people hauled out of a fallen city like a catch of fish, though the two Hebrew words for the hooks are rare and their meaning is partly a guess. The first is glossed “apparently hook, or barb (of fishing-spear ?),” with only this verse cited for that sense. The second is a word for a thorn and so for a hook, and in the same spelling it is the common word for a cooking pot. The ancient Greek translation has caldrons where the Hebrew has hooks: “fiery destroyers shall cast those with you into boiling caldrons.” Modern translations stay with hooks and fishhooks, as the King James Version does.

      “Your posterity” is a word that means what comes after or at the end. The lexicon allows “posterity” here and notes that others read “remnant, residue,” and a modern translation has “even the last of you with fishhooks.”

      Verse 3 finishes the picture, in a modern translation’s words: “Through breaches in the wall you shall leave,” each one straight ahead.
    sources: [bdb, lxx-rahlfs, nrsvue]

  - ref: 3
    phrase: ye shall cast them into the palace
    kind: words
    title: The palace is a word no one can now translate
    body: |
      The last clause of the threat is one of the obscure places in the book, and “the palace” is only one guess at it. The Hebrew word is *harmon*, which occurs in the Bible “only Amos 4:3,” and the lexicon’s entry begins “meaning dubious; text perhaps corrupt.” The King James translators took it as a form of the word for a palace or citadel, a reading the lexicon thinks unlikely. The Greek translators read a mountain: “ye shall be cast forth on the mountain Romman.” Two modern translations leave it as the name of a place, “flung out into Harmon” and “cast out toward Harmon,” without saying where that is. The lexicon’s own conclusion is that “some locality must be meant, though the nature of the allusion is lost.”

      The verb is uncertain as well. As the Hebrew is written the women do the casting (“ye shall cast them”), but the ancient versions read a passive, and the lexicon prefers it: they “shall be cast.”

      What can be said is how the sentence moves: out through the broken wall, and thrown out toward a place that can no longer be identified.
    sources: [bdb, lxx-rahlfs, nrsvue, niv]

  - ref: 4
    phrase: Come to Beth-el, and transgress
    kind: history
    title: Beth-el and Gilgal, and an invitation to sin
    body: |
      Amos invites Israel to its two holiest places and tells it that going there is the sin. Both had a long history with the Lord. Bethel was “one of the most sacred spots in Israel”: Abraham built an altar there and Jacob had his dream there. Gilgal was Israel’s first camp west of the Jordan and “a sacred city in the time of Saul.”

      Both had since become something else. Jeroboam, the first king of the divided kingdom (not the Jeroboam of Amos’s day, who was the second of the name), “selected” Bethel “as one of the places in which to set up the calf worship,” so that his people would not go up to Jerusalem: “It is too much for you to go up to Jerusalem: behold thy gods, O Israel” ([[1 Kgs. 12:28]]). Gilgal “later” became “the scene of idolatrous worship.” Hosea names the same two shrines, and the note at [[Hosea 4:15]] has more on each.

      The verb “transgress” is from the root Amos has already used for the crimes of the nations, “for three transgressions … and for four” (see [[Amos 1:3]]), where the noun has been defined as “an offence concerning persons and property,” and he has used it of Israel together with this shrine: the Lord will “visit the transgressions of Israel upon him” and “the altars of Beth-el” in one day ([[Amos 3:14]]). The lexicon’s sense for the verb here is to “transgress against God.”
    sources: [bd-bethel, bd-gilgal, bd-jeroboam, lds-scriptures, bdb, oshb-wlc, matson-amos-kinship]

  - ref: 5
    phrase: offer a sacrifice of thanksgiving with leaven
    kind: history
    title: Four offerings, each one overdone
    body: |
      Verses 4 and 5 name four acts of worship from the law of Moses, and each is described as done to excess or done for show; on one reading the leaven also broke the law.

      *Sacrifices every morning, and tithes.* The King James “after three years” follows the law, which set apart a tithe “at the end of three years” ([[Deut. 14:28]]). But the Hebrew word is “days,” as the Church’s footnote says, and the Greek and one modern translation read it so: “your tithes every three days.” On that reading Amos “is speaking hyperbolically, to depict the great zeal displayed in their worship.” Another modern translation keeps “years.”

      *A thank offering with leaven.* The law did call for leavened bread with a thank offering ([[Lev. 7:13]]), but not on the altar: “ye shall burn no leaven … in any offering of the LORD made by fire” ([[Lev. 2:11]]). The leavened loaves went to the priest and to the meal. The verb here means to “make sacrifices smoke, offer them by burning,” and a modern translation has “Burn leavened bread.” One older reading is that the worshippers “burned some of the leavened loaves as well, in order to offer as much as possible to God.”

      *Freewill offerings, proclaimed and published.* A freewill offering ([[Lev. 22:18–21]]) was by its nature unprompted, brought for no reason but the offerer’s own will. Here it is announced; one translation has “brag about your freewill offerings.”

      The last line says what is wrong: “for this liketh you,” in today’s English “for so you love to do.” It has been inferred from these two verses that worship in the northern kingdom “was conducted generally according to the precepts of the Mosaic law.” For how Israel’s sacrifices worked, see [The Temple and Worship](/old-testament/guides/temple-and-worship/#worship); for what the Lord says of these same offerings, [[Amos 5:21–24]].
    sources: [lds-scriptures, bd-leaven, bdb, lxx-rahlfs, nrsvue, niv, keil-amos]

  - ref: 6
    phrase: yet have ye not returned unto me
    kind: structure
    title: Five warnings with one refrain
    body: |
      The same sentence closes each of five calamities, and the repetition is the argument: everything short of destruction has been tried. The five are famine (verse 6), drought (verses 7–8), blight and locusts (verse 9), plague and defeat in war (verse 10), and an overthrow like Sodom’s (verse 11). “Cleanness of teeth” is hunger; the line beside it, “want of bread,” explains it, and a modern translation has “empty stomachs.”

      These are the penalties the law of Moses had attached to breaking the covenant, sometimes in the same words. “Blasting” and “mildew” stand together in [[Deut. 28:22]]. Plague joined with the sword is [[Lev. 26:25]], and “after the manner of Egypt” has been set beside the threat of “all the diseases of Egypt” ([[Deut. 28:60]]). The comparison with Sodom and Gomorrah is in Moses’s description of the land under the curse ([[Deut. 29:23]]; the story is at [[Gen. 19:24–25]]). Israel had been told beforehand what these things would mean.

      Which famine and which war are meant, the verses do not say. They have been read as “a series of judgments, through which Jehovah had already endeavoured to bring the people to repentance, without any regard to the time when they occurred,” set in order “from the smaller to the greater.” The drought is described most fully, and on one reading its patchiness is the point: rain on one city and not the next showed “that the sending and withholding of rain belonged to Him.”

      The refrain says what the calamities were for. The famines were sent to turn the people back to the Lord, and the same words follow each of the other four. After the last of them Israel is still there, “a firebrand plucked out of the burning,” a stick snatched from a fire.
    sources: [keil-amos, niv, nrsvue, scripture-helps-amos, lds-scriptures]

  - ref: 12
    phrase: prepare to meet thy God, O Israel
    kind: words
    title: The sentence never says what the Lord will do
    body: |
      “Thus will I do unto thee” points at nothing: the verse announces a punishment and does not name it. After five calamities described in detail, the sixth is left blank, and in its place stands a command.

      The old versions already differ on what the command is. In Hebrew the verb is to “prepare, be ready,” and what Israel is to be ready for is a meeting. The Greek translators read the last words differently: “prepare to call on thy God, O Israel.”

      One Latter-day Saint reading takes the verse as the prophet’s last warning before the end. Amos “could do nothing but warn the nation of the final blow which God would send and for which the people must prepare themselves.” The verse itself does not say whether any way is still open. The next chapter opens as “a lamentation” over Israel ([[Amos 5:1]]).
    sources: [bdb, lxx-rahlfs, ot-manual-8]

  - ref: 13
    phrase: The LORD, The God of hosts, is his name
    kind: christ
    title: The God of hosts is Jehovah, the premortal Christ
    body: |
      The chapter ends by naming the God whom Israel is to meet, and Latter-day Saints know Him as Jesus Christ. The name behind “the LORD” in the Old Testament is usually Jehovah, and “Jehovah is the premortal Jesus Christ.” The Church’s footnote on the first word of the description, “formeth,” sends the reader to the Topical Guide’s entry “Jesus Christ, Creator.”

      The verse describes Him by what He does. He forms the mountains and creates the wind. He makes “the morning darkness,” which one modern translation gives as “who turns dawn to darkness.” He treads the high places of the earth. In the middle of these stands a line of another kind: He “declareth unto man what is his thought.” The English leaves open whose thought is meant. The Church’s footnote takes it as the person’s own, pointing to passages in which the Lord knows what people are thinking ([[Ps. 139:2]]; [[Jacob 2:5]]).

      Twice more the book stops to describe the Creator and ends the description with the same words, “The LORD is his name” ([[Amos 5:8]]; [[Amos 9:6]]).
    sources: [gs-jehovah, lds-scriptures, niv]

christ: |
  The voice that says five times “yet have ye not returned unto me” is the voice of Jehovah, the premortal Jesus Christ (see the note on verse 13). The Church’s footnote on that refrain sends the reader to a revelation in which He speaks the same way to the nations of the latter days and names Himself: “O, ye nations of the earth, how often would I have gathered you together as a hen gathereth her chickens under her wings, but ye would not!” ([[D&C 43:24]]); “Behold, I am Jesus Christ, the Savior of the world” ([[D&C 43:34]]).

  He says there that He has called to them “by the voice of famines and pestilences of every kind” ([[D&C 43:25]]), and famine and pestilence are two of the five calamities counted here. The God Israel is told to prepare to meet is the one who had been calling Israel back.

explore: |
  - **The warnings in the law.** [[Lev. 26:14–26]] and [[Deut. 28:15–24]], read beside verses 6–11.
  - **How the two shrines began.** [[Gen. 28:10–22]] for Bethel, [[Josh. 4:19–24]] for Gilgal, and [[1 Kgs. 12:26–33]] for what Jeroboam made of Bethel.
  - **What the Lord says of the offerings.** [[Amos 5:21–24]].
  - **What preparing would be.** “Seek ye me, and ye shall live” ([[Amos 5:4]]), which has been read as the meaning of the summons in verse 12.
  - **After the famines of bread, a famine of the word.** [[Amos 8:11–12]].
  - **The other two descriptions of the Creator.** [[Amos 5:8–9]] and [[Amos 9:5–6]].
  - **“Prepare to meet God” in the Book of Mormon.** [[Alma 12:24]] and [[Alma 34:32]].

