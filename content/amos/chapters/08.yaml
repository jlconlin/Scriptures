chapter: 8
title: A Basket of Summer Fruit
tagline: Amos is shown ripe fruit and hears that Israel’s end has come. The grain merchants are charged in their own words, the Lord swears to remember, and the last thing He takes away is His word.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  This is the fourth of the visions that fill the last part of the book. The first three are in chapter 7. Between the third and this one stands the story of Amaziah, the priest of Beth-el, who told Amos to go back to Judah and “prophesy not again any more at Beth-el” ([[Amos 7:13]]). After three verses the chapter turns from the vision to the grain merchants of the northern kingdom and stays with them and their punishment to the end.

  Amos preached in the northern kingdom of Israel in the days of Jeroboam II (the reign is described at [[Amos 1:1]]). It was a time of “peace and prosperity,” and the people addressed in verses 4–6 show it: they have grain to sell and silver to buy people with. Within a generation their kingdom was gone, conquered by Assyria in 722 B.C.

  Latter-day Saints know the chapter best for verses 11–12, the famine of hearing the words of the Lord.

thread: |
  The chapter announces an end and then says what ends. The announcement comes in the vision. Amos is shown a basket of ripe fruit, says what it is, and hears, “The end is come upon my people of Israel.” In Hebrew the words for summer fruit and end sound nearly alike, so the Lord’s verdict echoes the answer Amos has just given.

  Verses 4–6 give the reason, and they give it in the merchants’ own words. Then the Lord swears that He will not forget, and the rest of the chapter names what will be taken: the daylight, the feasts, the songs, and last the word of the Lord. The famine that closes the chapter is the withdrawal of His word.

sections:
  - range: 1-3
    heading: The fourth vision
    plain: |
      This is what the Lord GOD showed me: a basket of summer fruit. He said, “Amos, what do you see?” I said, “A basket of summer fruit.” Then the LORD said to me: The end has come upon my people Israel. I will not pass over what they do any longer. In that day the songs of the temple will turn to wailing, says the Lord GOD. The dead will be many, thrown out in every place. Hush!
  - range: 4-6
    heading: The merchants, in their own words
    plain: |
      Hear this, you who swallow up the needy and make an end of the poor of the land. You say, “When will the new moon be over, so that we can sell grain? When will the sabbath be over, so that we can put the wheat out for sale? We will make the measure small and the weight heavy, and cheat with false scales. We will buy the poor for silver and the needy for a pair of sandals, and we will sell the sweepings of the wheat.”
  - range: 7-10
    heading: The oath, and darkness at noon
    plain: |
      The LORD has sworn by the pride of Jacob: I will never forget anything they have done. Will the land not tremble for this, and everyone who lives in it mourn? All of it will rise like the Nile, and heave and sink again like the river of Egypt. In that day, says the Lord GOD, I will make the sun go down at noon and darken the earth in broad daylight. I will turn your feasts into mourning and all your songs into laments. I will put sackcloth around every waist and baldness on every head. I will make it like the mourning for an only son, and its end like a bitter day.
  - range: 11-14
    heading: A famine of the word
    plain: |
      The days are coming, says the Lord GOD, when I will send a famine on the land. It will not be a famine of bread or a thirst for water. It will be a famine of hearing the words of the LORD. People will wander from sea to sea and from the north to the east. They will run back and forth looking for the word of the LORD, and they will not find it. In that day the fair young women and the young men will faint from thirst. Those who swear by the guilt of Samaria, who say, “As your god lives, Dan,” and “As the way of Beer-sheba lives,” will fall and never get up again.

notes:
  - ref: 1
    phrase: a basket of summer fruit
    kind: words
    title: Summer fruit and the end
    body: |
      The vision works by sound, and the English cannot show it. “Summer fruit” is *qayits* in Hebrew and “end” is *qets*. Amos says the first word, and the Lord answers with the second.

      The vision does not explain the basket. Amos could have described the fruit in other ways, but his “precise wording was the only possible answer that could have provided the wordplay God was looking for.”

      The “end” is the end of a people. The word is used here of the “end of life, of a people,” as it is in Ezekiel’s word to “the land of Israel”: “An end, the end is come upon the four corners of the land” ([[Ezek. 7:2]]).
    sources: [oshb-wlc, sears-intercession, bdb]

  - ref: 2
    phrase: I will not again pass by them any more
    kind: words
    title: To pass by is to pardon
    body: |
      “Pass by” here most likely means to pardon: the Lord will not forgive Israel again. He said the same words in the vision before this one. The note at [[Amos 7:8]] explains them and the reading that pairs the two visions: Amos is asked what he sees, names it, and is given no room to plead.

      That reading rests partly on a count of the Hebrew words each speaks to the other, and this vision completes the count. The earlier counts are in that note. Here Amos has two words and the Lord twenty-eight. Amos’s “diminished speaking role in the final two visions highlights that the option to intercede has been withdrawn.” The count and the conclusion are one reading of how the visions are arranged. The text does not state it.
    sources: [sears-intercession]

  - ref: 3
    phrase: the songs of the temple
    kind: words
    title: Temple songs, or palace songs
    body: |
      The Hebrew word here means either “palace” or “temple,” and the verse does not say which building is meant. In the lexicon the line stands under the royal palace, as “palace-songs shall be howlings in that day.” A modern translation keeps “the songs of the temple” in its text and prints “Or palace” in its margin. Read as the King James Version has it, the verse describes “singers at the temple.”

      The songs come back in verse 10, where the Lord says, “I will turn your feasts into mourning, and all your songs into lamentation.”
    sources: [bdb, nrsvue, sears-intercession]

  - ref: 3
    phrase: they shall cast them forth with silence
    kind: words
    title: Who says “Hush”?
    body: |
      The last word of the vision is a Hebrew interjection, *has*, “hush! keep silence,” and it is disputed who says it and to whom. The King James translators made it an adverb, “with silence.” The lexicon takes it as what the people casting out the bodies say. “Most modern-English translations do render it as a command,” and one prints “Be silent!” as the last words of the Lord’s speech.

      The usual reading ties the verse to [[Amos 6:10]], where a man carrying bones out of a house says the same word. Read that way, the word here is “the cry of humans responding to the carnage.” The tie has been questioned. Apart from this word and the Lord’s name the two passages “share not a single vocabulary word.” One is about men at a house and the other about singers at a temple. And nothing in the grammar marks a change of speaker in the middle of this verse. The proposal, which its author grants “runs against most commentaries,” is that the Lord gives the command and gives it to Amos, to whom He has been speaking since verse 2. On this reading it is “plausible that the purpose of this order is to cut off any further intercession.” Only in this vision are the people themselves struck, and this is “perhaps the point where Amos might most wish to intercede.”

      That is one reading of a hard verse. The ancient Greek translators handled the word in yet another way: “I will bring silence upon them.”
    sources: [bdb, nrsvue, sears-intercession, lxx-rahlfs]

  - ref: 5
    phrase: When will the new moon be gone
    kind: history
    title: The new moon and the sabbath, kept and resented
    body: |
      The merchants keep the holy days and cannot wait for them to be over. They are not accused of breaking them. The new moon was the first day of the month, a day when “special sacrifices should be offered,” the offerings set out for “the beginnings of your months” ([[Num. 28:11]]). The merchants’ question shows that selling stopped then as it did on the sabbath.

      What Amos quotes is what the sellers are thinking while the day lasts. And the trade they are waiting for is the cheating described in the next lines.
    sources: [bd-new-moon, lds-scriptures]

  - ref: 5
    phrase: making the ephah small, and the shekel great
    kind: history
    title: A small measure, a heavy weight, and false scales
    body: |
      The three phrases describe one sale, rigged at every point. The ephah was a dry measure, and it measured out the grain. The shekel was not yet a coin. It was a unit of weight, and the buyer’s silver was weighed against it. A small ephah gave him less grain, a heavy shekel took more of his silver, and the “balances” were false as well.

      The law named each of these things. “Just balances, just weights, a just ephah, and a just hin, shall ye have” ([[Lev. 19:36]]), and “Thou shalt not have in thy bag divers weights, a great and a small” ([[Deut. 25:13]]). Proverbs says of the scales, “A false balance is abomination to the LORD” ([[Prov. 11:1]]).

      Verse 6 adds two more lines to the plan. “The refuse of the wheat” is the “fallings, refuse,” and a modern translation calls it “the sweepings of the wheat.” That is sold too. And a buyer who is cheated often enough can end up for sale himself: “When the disadvantaged could no longer operate under these circumstances,” the elite would “buy the poor for silver, and the needy for a pair of shoes.” The phrase is from the first charge Amos brought against Israel, and the note at [[Amos 2:6]] explains the sale and the law against it.
    sources: [bd-weights-and-measures, nrsvue, bdb, matson-amos-kinship, lds-scriptures]

  - ref: 7
    phrase: The LORD hath sworn by the excellency of Jacob
    kind: words
    title: An oath by the pride of Jacob
    body: |
      “Excellency” is pride, and it is not certain what the pride of Jacob is when the Lord swears by it. The Church’s footnote sends the reader to [[Amos 6:8]], where its note on the same word reads “HEB pride.” In that earlier verse the phrase names something the Lord abhors, and the note there explains it.

      One reading takes the phrase in this verse as a title of the Lord Himself: “The pride of Jacob is Jehovah.” The earlier oaths in the book were by His holiness ([[Amos 4:2]]) and by Himself ([[Amos 6:8]]), and on this reading the third is like them: He swears “as He who is the pride and glory of Israel.” The ancient Greek translators took it the other way and made Jacob’s pride the thing sworn against: “The Lord swears against the pride of Jacob.”

      To forget a sin is “to leave it unpunished,” and the Lord swears that He will not forget “any of their works.” The works are those just listed.
    sources: [lds-scriptures, keil-amos, lxx-rahlfs]

  - ref: 8
    phrase: as by the flood of Egypt
    kind: symbol
    title: The land rising and sinking like the Nile
    body: |
      The “flood of Egypt” is the Nile, and the picture is of ground that moves as the river does. The Hebrew noun is the usual one for the “stream of the Nile, river Nile,” and a modern translation reads, “all of it rise like the Nile, and be tossed about and sink again, like the Nile of Egypt.” The Church’s footnote gives the Hebrew of the last clause as “overflow and recede like the river of Egypt.” The King James wording, “cast out and drowned,” hides the comparison: the land that trembles at the start of the verse is to heave and settle as the river rises and falls. The picture returns at [[Amos 9:5]].
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 9
    phrase: I will cause the sun to go down at noon
    kind: symbol
    title: Sunset at noon
    body: |
      Noon is the height of the day, and the image is of an end that comes suddenly at the height of things. A modern translation has “darken the earth in broad daylight” for the second line. A person’s sun sets at noon when he is “suddenly snatched away by death, in the very midst of his life,” and a nation’s when it is “suddenly destroyed in the midst of its earthly prosperity.”

      The image is also read as reaching past Samaria. The prophecy is “dual,” “also a reminder that before the Second Coming of the Lord, the sun will be darkened.” Joel has that sign: “The sun shall be turned into darkness, and the moon into blood, before the great and the terrible day of the LORD come” ([[Joel 2:31]]). These are readings of a figure. The verse itself names no event.
    sources: [keil-amos, ot-manual-8, nrsvue]

  - ref: 11
    phrase: not a famine of bread, nor a thirst for water, but of hearing the words of the LORD
    kind: prophets
    title: The famine of hearing the words of the Lord
    body: |
      The famine is the Lord’s silence, and it was spoken first to a people who had told His prophets to be quiet. Israel “commanded the prophets, saying, Prophesy not” ([[Amos 2:12]]). A chapter before this one the priest of Beth-el said it to Amos himself: “prophesy not again any more at Beth-el” ([[Amos 7:13]]). The sentence fits the offense: “They who will not now hear His word, as proclaimed by the prophets, will then cherish the greatest longing for it.” What is withdrawn is “the light of His revelation,” and verse 12 shows people crossing the land to look for it.

      The saying also answers an earlier chapter. The Lord had sent famines of bread and water to turn the people back to Him, and they had not returned (the list is at [[Amos 4:6–11]]). This famine is of another kind.

      The Church reads the prophecy as reaching far past Samaria, and as fulfilled more than once. One fulfillment was the four centuries and more after Malachi, when no divinely called prophet ministered in the land of Israel. Another came after the deaths of the Savior and His Apostles, when the Church fell into apostasy, and that silence lasted until the gospel was restored through Joseph Smith. Elder Spencer W. Kimball announced its end in Amos’s own terms: “the spiritual famine is ended, the spiritual drought is spent,” and no one need “wander from sea to sea nor from the north to the east, seeking the true gospel.”
    sources: [keil-amos, scripture-helps-amos, ot-manual-8]

  - ref: 14
    phrase: They that swear by the sin of Samaria
    kind: history
    title: Three oaths, from Dan to Beer-sheba
    body: |
      The last verse quotes three oaths sworn by Israel’s shrines, and the wording of two of them is uncertain. “The sin of Samaria” is literally Samaria’s guilt, glossed in the lexicon as “their idols.” A modern translation reads a proper name instead, “Ashimah of Samaria.”

      Dan was the town in the far north where Jeroboam established the calf worship of the northern tribes. He set one golden calf in Beth-el and the other in Dan, and “this thing became a sin” ([[1 Kgs. 12:30]]).

      “The manner of Beer-sheba” is in Hebrew the “way” of Beer-sheba. The lexicon takes it as the “journey” there but marks the text “dubious,” and the Greek reads “Thy god, O Bersabee, lives.” Beer-sheba was far to the south, counted the southern limit of Israel as Dan was the northern. The note at [[Amos 5:5]] says more of Beer-sheba.

      Idolatry is one of the two sins that are “dominant” in Amos’s case against Israel, and this verse is one of the places where he charges it. The other, treading on the poor, is the charge of verses 4–6.
    sources: [bdb, nrsvue, lxx-rahlfs, bd-dan, bd-beersheba, vandyke-ogden-twelve, lds-scriptures]

christ: |
  The one who shows Amos the basket and swears the oath is Jehovah, “the premortal Jesus Christ” (see the note at [[Amos 4:13]]). In this chapter He is the judge who will not pass by again and the one whose word is withdrawn.

  The Church’s footnotes set two lines of the chapter beside His death. Beside “I will darken the earth in the clear day” stands the Crucifixion: “it was about the sixth hour, and there was a darkness over all the earth until the ninth hour. And the sun was darkened” ([[Luke 23:44–45]]). Beside “the mourning of an only son” stands Zechariah’s prophecy: “they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for his only son” ([[Zech. 12:10]]). The footnotes do not say how the verses are related.

explore: |
  - **The visions before this one.** [[Amos 7:1–9]], where Amos pleads twice and is heard, and the Lord first says “I will not again pass by them any more.”
  - **The man who said “Prophesy not.”** [[Amos 7:10–17]].
  - **The first charge about silver and sandals.** [[Amos 2:6–8]].
  - **Honest weights in the law.** [[Lev. 19:35–36]] and [[Deut. 25:13–16]].
  - **Famines of bread before the famine of the word.** [[Amos 4:6–11]].
  - **Other silences.** [[1 Sam. 3:1]], [[Ps. 74:9]] and [[Micah 3:5–7]].
  - **Darkness and the day of the LORD.** [[Amos 5:18–20]] and [[Joel 2:31]].
  - **What comes after the end.** [[Amos 9:11–15]], where the book closes with Israel restored.
  - **Why the pleading stops.** The study “‘O Lord God, Forgive!’ Prophetic Intercession in Amos” reads the four visions together and asks what a prophet’s intercession shows about God.

