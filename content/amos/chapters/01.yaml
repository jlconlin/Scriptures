chapter: 1
title: The LORD Will Roar from Zion
tagline: A shepherd from Judah opens his message to Israel with the Lord’s roar from Jerusalem, and with sentence passed on five of Israel’s neighbors for cruelty in war and for selling people.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  The heading dates the book by two kings and an earthquake. Uzziah of Judah died about 740 B.C., and Jeroboam the son of Joash, called Jeroboam II, died about 750 B.C. Amos was a shepherd from Tekoa, 12 miles south of Jerusalem, yet his ministry was among the people of the northern kingdom. He tells of his call himself in [[Amos 7:14–15]], and the note there says more about him.

  He came north in good times. Israel was “enjoying an era of peace and prosperity,” a “golden age of the divided monarchy,” and Jeroboam had “recovered Damascus, and Hamath” ([[2 Kgs. 14:28]]). The book’s tone is hard to hear without that: Amos announces ruin to people who see no sign of it. Assyria conquered the kingdom in 722 B.C.

  Chapter 1 is the first half of one speech. The first two chapters of the book are its prophecies of judgment on the nations, Judah and Israel among them. Five neighbors are sentenced here; Moab, Judah and Israel follow in [[Amos 2]]. The guides [Israel’s Story](/old-testament/guides/israels-story/) and [The Land](/old-testament/guides/the-land/) have the kings and the map.

thread: |
  Amos was sent to Israel, and **he begins with everyone else.**

  After one verse in which the Lord roars from Zion, the chapter is five sentences in one form: “For three transgressions… and for four,” then a single crime, then fire on the offender’s palaces. Damascus lies to Israel’s northeast, Gaza to the southwest, Tyre to the north, Edom to the southeast and Ammon to the east, so that the list rings Israel on every side.

  None of the charges is idolatry. They are what one people did to another: Gilead threshed, whole communities sold, a brother hunted with the sword, pregnant women killed for the sake of a border. One study sorts them into two kinds, “martial brutality or human slavery,” and observes that these nations were tied to Israel by treaty or by blood, the Philistines least clearly. Tyre forgot “the brotherly covenant” (verse 9); Edom pursued “his brother” (verse 11).

  Amos’s hearers had been on the receiving end of such crimes; the charge against Tyre was one they “easily recognized and eagerly accepted,” having been its victims. That is the design. The same study calls these oracles “a subtle and persuasive introduction” to what Amos came to say. The form does not change when the list reaches home: [[Amos 2:6]] begins “For three transgressions of Israel, and for four,” and the longest sentence of the eight is Israel’s ([[Amos 2:6–16]]).

sections:
  - range: 1-2
    heading: The heading and the roar
    plain: |
      These are the words of Amos, one of the herdsmen of Tekoa: what he saw concerning Israel when Uzziah was king of Judah and Jeroboam the son of Joash was king of Israel, two years before the earthquake. He said: The Lord will roar from Zion and raise His voice from Jerusalem. The shepherds’ pastures will mourn, and the top of Carmel will dry up.
  - range: 3-5
    heading: Damascus
    plain: |
      The Lord says: For three transgressions of Damascus, and for four, I will not turn the punishment back, because they threshed Gilead with iron threshing sledges. I will send fire on the house of Hazael, and it will consume the palaces of Ben-hadad. I will break the bar of Damascus’s gate. I will cut off the people of the plain of Aven and the ruler of the house of Eden, and the people of Syria will go as captives to Kir.
  - range: 6-8
    heading: Gaza and the Philistines
    plain: |
      The Lord says: For three transgressions of Gaza, and for four, I will not turn the punishment back, because they carried off a whole people as captives and handed them over to Edom. I will send fire on the wall of Gaza, and it will consume her palaces. I will cut off the people of Ashdod and the ruler of Ashkelon, and turn my hand against Ekron, and what is left of the Philistines will perish.
  - range: 9-10
    heading: Tyre
    plain: |
      The Lord says: For three transgressions of Tyre, and for four, I will not turn the punishment back, because they handed a whole people of captives over to Edom and did not remember the covenant of brothers. I will send fire on the wall of Tyre, and it will consume her palaces.
  - range: 11-12
    heading: Edom
    plain: |
      The Lord says: For three transgressions of Edom, and for four, I will not turn the punishment back, because he chased his brother with the sword and threw away all pity. His anger tore without stopping, and he kept his rage alive for good. I will send fire on Teman, and it will consume the palaces of Bozrah.
  - range: 13-15
    heading: Ammon
    plain: |
      The Lord says: For three transgressions of the Ammonites, and for four, I will not turn the punishment back, because they cut open the pregnant women of Gilead in order to widen their border. I will light a fire in the wall of Rabbah, and it will consume her palaces, with shouting on the day of battle and a storm on the day of the whirlwind. Their king will go into captivity, he and his princes together.

notes:
  - ref: 1
    phrase: who was among the herdmen of Tekoa
    kind: history
    title: A shepherd from Judah, sent north
    body: |
      Amos belonged to Judah and preached in Israel. Tekoa “lies deep in the tribal lands of the southern kingdom of Judah,” about twelve miles from Jerusalem, while his ministry was “among those of the northern kingdom.”

      The word for “herdmen” is a rare one, *nōqēd*, a “sheep-raiser, -dealer, or -tender.” It appears in only one other verse, where it describes Mesha, the king of Moab, who paid his tribute in lambs and wool ([[2 Kgs. 3:4]]). Whether that makes Amos a hired man or an owner of flocks is taken up where he describes his work himself, at [[Amos 7:14–15]].
    sources: [bd-amos, vandyke-ogden-twelve, bdb, oshb-wlc]

  - ref: 1
    phrase: two years before the earthquake
    kind: history
    title: The earthquake
    body: |
      The earthquake dates the book, but nothing now dates the earthquake. It “is never mentioned in the historical books of the Old Testament,” and so the phrase “furnishes no chronological datum.” What the Bible does preserve is how long it was remembered. Zechariah, after the Captivity, could still say, “ye shall flee, like as ye fled from before the earthquake in the days of Uzziah king of Judah” ([[Zech. 14:5]]), and expect to be understood: the people “had not forgotten.”

      The phrase looks back across the earthquake. One reading takes it that Amos put the book together afterward, gathering what he had already said at Beth-el.
    sources: [lds-scriptures, bd-uzziah, keil-amos]

  - ref: 2
    phrase: The LORD will roar from Zion
    kind: symbol
    title: The lion’s roar
    body: |
      The verb is the one used for a lion, and Amos means it that way. Its first sense is to roar, “of lion,” and it is used of the Lord “roaring in thunder” in this verse. Two chapters on, Amos turns the image into an argument: a lion does not roar without prey ([[Amos 3:4]]), and “The lion hath roared, who will not fear?” ([[Amos 3:8]]). The opening line “forms in the reader’s mind the image of a roaring lion ready to pounce,” and it sets the tone for everything after it.

      What the roar does is wither the land. “Habitations” is better “pastures,” as the Church’s footnote has it, so what mourns is grazing land; and the withering reaches the top of Carmel, the headland on the coast whose name means “Garden or park.”

      The same line stands in [[Joel 3:16]].
    sources: [bdb, vandyke-ogden-twelve, lds-scriptures, bd-carmel]

  - ref: 3
    phrase: For three transgressions of Damascus, and for four, I will not turn away the punishment thereof
    kind: words
    title: Three, and four
    body: |
      The three and the four are an idiom for more than enough, not a count. The same turn of speech appears in Proverbs: “These six things doth the LORD hate: yea, seven are an abomination unto him” ([[Prov. 6:16]]); “There be three things which are too wonderful for me, yea, four which I know not” ([[Prov. 30:18]]). Here it says that the sins “have been exceedingly abundant.” The numbers “merely serve to denote the multiplicity of the sins,” and Amos does not go on to list four: for each nation “only one especially grievous crime is mentioned by way of example.” The one act is chosen as “proof of how far that nation has sunk.”

      “Transgressions” is *pešaʿ*. Its senses are an offense “against individuals,” “of nation, against nation” (where these verses are cited), and “against God.” The word fits the charges, which are all wrongs done to other people. Amos uses the same noun when the list reaches Israel ([[Amos 2:6]]) and again when the Lord says He will “visit the transgressions of Israel upon him” ([[Amos 3:14]]).

      “I will not turn away the punishment thereof” is fuller than the Hebrew, which says only “I will not reverse it.” What “it” is the verse doesn’t say. It has been read as “the punishment threatened afterwards,” which is what the King James spells out, and the clause comes before the crime is even named “to show that the threat is irrevocable.”

      This formula returns seven more times, through [[Amos 2:6]].
    sources: [ot-manual-8, keil-amos, bdb, oshb-wlc, matson-amos-kinship]

  - ref: 3
    phrase: because they have threshed Gilead with threshing instruments of iron
    kind: history
    title: What Damascus did to Gilead
    body: |
      The charge against Damascus is its treatment of Gilead, the highland east of the Jordan that had been assigned to Gad and Manasseh. Damascus was the capital of Syria (Aram), and the occasion was probably the wars of its king Hazael, who “smote them in all the coasts of Israel” ([[2 Kgs. 10:32]]), taking “all the land of Gilead” ([[2 Kgs. 10:33]]). Elisha had wept when he foresaw what Hazael would do to Israel ([[2 Kgs. 8:12]]). The book of Kings uses Amos’s image for the result: the king of Syria “had made them like the dust by threshing” ([[2 Kgs. 13:7]]).

      Whether Amos means the words literally is not settled. One reading holds that the Syrians “evidently treated their captives with barbaric cruelty, crushing them under iron threshing sleds.” Another takes the threshing as “a symbolic reference to martial brutality” and connects it with Hazael’s expansion into the region. On either reading the charge is what was done to people, not to land.
    sources: [lds-scriptures, bd-gilead, bd-hazael, matson-amos-kinship, ot-manual-8]

  - ref: 4
    phrase: which shall devour the palaces of Ben-hadad
    kind: symbol
    title: Fire on the palaces
    body: |
      Every sentence in the chapter has the same punishment in it: fire sent on a city’s “palaces.” The Hebrew word is closer to “citadel.” It means “citadel, castle, palace,” it is “especially common in Amos,” and there is a reason prophets name it when they speak of conquest: “the fine buildings would be especially object of attack & plunder.”

      On one reading these are “the residences of the social and economic elite,” and the sentences are “aimed at the elite class and the symbols of their power and wealth.” Amos will say the same of Israel’s own: “thy palaces shall be spoiled” ([[Amos 3:11]]).

      Hazael and Ben-hadad are the dynasty in Damascus. Hazael “became king by murdering his master Benhadad,” and at his death “Ben-hadad his son reigned in his stead” ([[2 Kgs. 13:24]]). On the same reading, the fire is aimed at more than buildings: it is aimed at the ruling houses of Syria.
    sources: [bdb, matson-amos-kinship, bd-hazael, lds-scriptures]

  - ref: 5
    phrase: the people of Syria shall go into captivity unto Kir
    kind: history
    title: The sentences carried out
    body: |
      Within a generation the first sentence was carried out to the letter. In the days of Ahaz the king of Assyria “went up against Damascus, and took it, and carried the people of it captive to Kir” ([[2 Kgs. 16:9]]). The king was Tiglath-pileser, and the city fell “about 733 B.C.”

      Kir is named once more in the book. Near its end the Lord asks, “Have not I brought up Israel out of the land of Egypt? and the Philistines from Caphtor, and the Syrians from Kir?” ([[Amos 9:7]]). Kir is where the Syrians had come from, and the sentence is exile to it.

      Assyria reached others on the list as well. The Philistines “were conquered by Tiglath-pileser in 734 B.C.,” and Ammon kept its independence only “till they fell under the power of Assyria and Chaldea.”
    sources: [lds-scriptures, bd-damascus, bd-philistines, bd-ammon, keil-amos]

  - ref: 9
    phrase: and remembered not the brotherly covenant
    kind: history
    title: The brotherly covenant, and the law the nations answer to
    body: |
      Amos charges no nation in this chapter with idolatry or with breaking the law given to Israel. One reading finds the standard he holds them to in this phrase. The Hebrew is *bĕrît ʾaḥîm*, literally a covenant of brothers, which one modern translation renders “the covenant of kinship,” and it names a “duty towards tribal kinsmen.”

      One study builds its reading of the first two chapters on that phrase. A treaty changed how two peoples regarded each other, “from competing nation-states to fellow kin.” Israel’s neighbors were its kin either by such treaties or by birth (the tie with the Philistines is “tenuous at best”), and what Amos condemns in them is the treatment of kin as “prey.” Tyre is the plain case. It had been “in alliance with David” and with Solomon; Hiram and Solomon “made a league together” ([[1 Kgs. 5:12]]), and Hiram addressed Solomon as “my brother” ([[1 Kgs. 9:13]]). Those treaties were nearly two hundred years old when Amos spoke, and the charge is that Tyre did not *remember*. This is one scholar’s reading, and it accounts for the kind of crime Amos chooses: offenses “against persons and property.”

      The crime itself is the same as Gaza’s in verse 6: handing over “the whole captivity,” an entire population, to Edom. These two port cities stand accused of a “trade of enslaved peoples to Edom, including those who were Israelites.” The verses name no raid. The Philistine raid on Judah in the days of Jehoram ([[2 Chr. 21:16–17]]) has been proposed for Gaza; and since “there is no record of Tyre capturing Israelites directly,” Tyre may have bought its captives from others and sold them on. Joel charges the same coast with selling the children of Judah ([[Joel 3:4–6]]; see the note there).
    sources: [matson-amos-kinship, oshb-wlc, bd-tyre, lds-scriptures, ot-manual-8]

  - ref: 11
    phrase: because he did pursue his brother with the sword
    kind: history
    title: Edom, the brother
    body: |
      Edom is the neighbor Israel’s law called a brother. Edom was a name of Esau, Jacob’s brother, and of the people descended from him, and Moses had commanded, “Thou shalt not abhor an Edomite; for he is thy brother” ([[Deut. 23:7]]). “In spite of the kinship there seems to have been great mutual hatred, and wars were of constant occurrence.”

      Amos names no single war; the charge is pity cast off and wrath kept for ever. Edom has already appeared twice in the chapter, as the buyer of the captives that Gaza and Tyre sold (verses 6 and 9). Obadiah brings the same charge of a brother’s violence: “For thy violence against thy brother Jacob shame shall cover thee” ([[Obad. 1:10]]).
    sources: [bd-edom, lds-scriptures, matson-amos-kinship]

  - ref: 13
    phrase: that they might enlarge their border
    kind: history
    title: Ammon’s war for land
    body: |
      The last crime in the chapter is told with its motive: land. The Ammonites were kin to Israel as well, “descended from Lot, the nephew of Abraham.” Genesis traces them to the son of Lot’s younger daughter ([[Gen. 19:38]]). They lived “east of Mount Gilead,” and in the time of the Judges they had “laid claim to the Israelite settlements in Gilead.” Amos names no war, only what was done in Gilead and why.

      The act has been set beside the law given at Sinai, which punished a man who hurt “a woman with child” in a quarrel ([[Ex. 21:22]]). For that the city of Rabbah is to burn, and the king and his princes are to go into exile together.
    sources: [bd-ammon, lds-scriptures, matson-amos-kinship]

christ: |
  The Doctrine and Covenants gives the words of Amos’s opening line to the Savior: “the Lamb shall stand upon Mount Zion” ([[D&C 133:18]]), and “he shall utter his voice out of Zion, and he shall speak from Jerusalem, and his voice shall be heard among all people” ([[D&C 133:21]]). The connection is the Church’s footnote on that verse, which points back to this one. The note at [[Joel 3:16]], which has the same line, follows it further.

  The chapter also shows what kind of ruler He is. The Bible Dictionary sums up Amos’s emphasis as the moral character of Jehovah, who rules all nations and all people in righteousness. In this chapter He calls five of Israel’s neighbors to account, and He does it for what they did to other peoples.

explore: |
  - **The rest of the speech.** [[Amos 2]]: Moab, Judah, and then Israel, in the same form.
  - **The lion again.** [[Amos 3:3–8]], where the roar becomes the reason a prophet must speak.
  - **Edom the brother.** [[Gen. 25:21–34]], [[Num. 20:14–21]], and [[Obad. 1:10–14]].
  - **The treaty Tyre forgot.** [[1 Kgs. 5:1–12]].
  - **A study to read whole.** “Covenants, Kinship, and Caring for the Destitute in the Book of Amos” (*Religious Educator*, 2022), on covenant as kinship in the oracles against the nations and in the charges against Israel.

