chapter: 5
title: 'Seek Me, and Ye Shall Live'
tagline: Amos sings a funeral song over a kingdom at the height of its prosperity and three times names the way out, which is to seek the Lord. The shrines are busy and the courts are for sale, and the Lord refuses the offerings of people who sell justice in the gate.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  Amos is still speaking to the northern kingdom in the reign of Jeroboam II, a time of peace and wealth (the setting of [[Amos 1:1]] has the kings and the times). Chapter 5 stands in the middle of the book’s second part, chapters 3–6, the warnings to the Northern Kingdom and the plea to repent. The plea is plainest here: “Seek ye me, and ye shall live.”

  The chapter names three things: the shrines of Bethel, Gilgal and Beersheba; the city gate, where a town did its public business and heard its cases; and the feasts, with their offerings and music. Nothing in the chapter suggests that worship had lapsed. The complaint is about what went on beside it.

  The end the chapter threatens, “captivity beyond Damascus,” came within a few decades; the note on [[Amos 3:11]] has the fulfillment.

  Later scripture comes back to the last verses. Stephen quotes verses 25–27 to the council in Jerusalem ([[Acts 7:42–43]]), from the Greek translation, which reads the names in verse 26 differently.

thread: |
  The chapter is a funeral held for a nation that is alive and doing well. It opens with a dirge (verses 1–3), and the wailing comes back in verses 16–17. Between the two, three times, stands the way out: “Seek ye me, and ye shall live” (verse 4), “Seek the LORD, and ye shall live” (verse 6), “Seek good, and not evil, that ye may live” (verse 14).

  The surprise is where the Lord says He is not to be sought. Israel is seeking, in its way: verse 5 names the shrines it goes to, and verses 21–23 its feasts, offerings and songs. But the same people “turn judgment to wormwood,” take grain from the poor, and take bribes in the gate. “I hate, I despise your feast days” is followed at once by “let judgment run down as waters.” On the reading given in the note on verse 21, worship and justice are not rivals here: both belong to one covenant.

  The second half of the chapter (verses 18–27) takes away two confidences. Israel expected the day of the LORD to bring victory over its enemies, and is told that the day is darkness; it kept the feasts, and is told that the Lord hates them. What is left is the smallest of hopes, in verse 15: “It may be.”

sections:
  - range: 1-3
    heading: A dirge for the virgin of Israel
    plain: |
      Hear this word, a funeral song that I take up over you, house of Israel. The virgin of Israel has fallen and will not rise again; she lies forsaken on her own land, and no one lifts her up. For the Lord GOD says: the city that went out a thousand strong will have a hundred left, and the one that went out a hundred will have ten.
  - range: 4-9
    heading: “Seek ye me, and ye shall live”
    plain: |
      The LORD says to the house of Israel: Seek me, and live. Do not seek Bethel, do not go to Gilgal, do not travel to Beersheba, for Gilgal will surely go into captivity and Bethel will come to nothing. Seek the LORD and live, lest He break out like fire on the house of Joseph, and no one at Bethel will be able to put it out. You turn judgment into wormwood and leave off righteousness in the land. Seek Him who made the seven stars and Orion, who turns the shadow of death into morning and darkens the day into night, who calls for the waters of the sea and pours them out over the earth. The LORD is His name. He strengthens the plundered against the strong, so that the plundered come against the fortress.
  - range: 10-13
    heading: In the gate
    plain: |
      They hate the one who rebukes in the gate and abhor the one who speaks uprightly. Because you trample the poor and take levies of grain from him, you have built houses of hewn stone but will not live in them; you have planted pleasant vineyards but will not drink their wine. For I know how many your transgressions are and how great your sins: you afflict the just, you take a bribe, and in the gate you turn the poor away from their right. So the prudent keep silent in such a time, for it is an evil time.
  - range: 14-17
    heading: “It may be”
    plain: |
      Seek good and not evil, so that you may live, and so the LORD, the God of hosts, will be with you, as you say He is. Hate the evil, love the good, and establish judgment in the gate; it may be that the LORD God of hosts will be gracious to the remnant of Joseph. Therefore the LORD says: there will be wailing in every street, and on every road they will cry, Alas! alas! They will call the farmer to mourning and the skilled mourners to wail. In all the vineyards there will be wailing, for I will pass through you, says the LORD.
  - range: 18-20
    heading: The day of the LORD is darkness
    plain: |
      Woe to you who long for the day of the LORD! What good is it to you? The day of the LORD is darkness and not light. It is as if a man fled from a lion and a bear met him, or went into his house and leaned his hand on the wall, and a serpent bit him. Will not the day of the LORD be darkness and not light, very dark, with no brightness in it?
  - range: 21-27
    heading: Feast days, and justice like a stream
    plain: |
      I hate, I despise your feast days, and I will take no heed of your solemn assemblies. Though you offer me burnt offerings and your grain offerings, I will not accept them, and I will not look at the peace offerings of your fattened animals. Take the noise of your songs away from me; I will not listen to the melody of your viols. But let judgment run down like waters, and righteousness like a mighty stream. Did you bring me sacrifices and offerings in the wilderness forty years, house of Israel? But you have carried the tabernacle of your Moloch and Chiun your images, the star of your god, which you made for yourselves. Therefore I will send you into captivity beyond Damascus, says the LORD, whose name is The God of hosts.

notes:
  - ref: 1
    phrase: a lamentation
    kind: words
    title: A funeral song for a nation still living
    body: |
      The word Amos uses for what he is about to sing is the word for a funeral song. It is the word used when “David lamented with this lamentation over Saul and over Jonathan his son” ([[2 Sam. 1:17]]). Verse 2 is the song itself: the “virgin of Israel” lies fallen on her own land with no one to lift her.

      A dirge is sung over the dead, and Israel was not dead. When Amos sang this the kingdom “bore no marks of such destruction”; it was at peace and rich. He has his hearers attend their own funeral. Verse 3 then gives the song its reason in plain numbers: of a city that “marched out a thousand,” a hundred are left.

      The mourning returns in verses 16–17, where the professional mourners, “such as are skilful of lamentation,” are sent for.
    sources: [oshb-wlc, bdb, lds-scriptures, matson-amos-kinship, nrsvue]

  - ref: 5
    phrase: seek not Beth-el, nor enter into Gilgal, and pass not to Beer-sheba
    kind: history
    title: Three shrines not to seek
    body: |
      Each of the three places Israel is told not to seek was holy ground, which is why the command startles. Bethel and Gilgal had long histories with the Lord and had become places of calf worship and idolatry; the note on [[Amos 4:4]] has their story, and Hosea, preaching in the same kingdom, warns against the same two ([[Hosea 4:15]]).

      Beersheba is the distant one. It had been home to Abraham, Isaac and Jacob, it was “regarded as the southern limit of Israel,” and the verb for going there is to “cross over.”

      In Hebrew the threat to Gilgal echoes its name: “Gilgal shall surely go into captivity” is *ha-Gilgal galoh yigleh*, where the verb, to “go into exile,” repeats the sounds of the name. Bethel, for its part, is to “come to nothing.”
    sources: [bd-bethel, bd-gilgal, bd-beersheba, oshb-wlc, bdb, nrsvue]

  - ref: 8
    phrase: Seek him that maketh the seven stars and Orion
    kind: structure
    title: Why a hymn to the Creator stands here
    body: |
      Verses 8–9 break into the accusation with a short hymn, which sets the people of verse 7 beside the God they are dealing with. The “seven stars” are the Pleiades, named with Orion as the Maker’s work. He turns darkness to morning and day to night, and calls up the sea.

      The same verb stands in both verses, and the English keeps it. Israel’s judges “turn judgment to wormwood” (wormwood is “a bitter plant,” a figure for “bitter wrong”); the Lord “turneth the shadow of death into the morning.” The contrast has been read as a threat: “They do this, whereas Jehovah is the Almighty, and can bring destruction suddenly upon them.” Verse 9 goes on to say so. The King James is hard to follow there, and a modern translation has the Lord make “destruction flash out against the strong.”

      Hymns with the same closing line stand at [[Amos 4:13]] and [[Amos 9:6]].
    sources: [bd-pleiades, lds-scriptures, keil-amos, oshb-wlc, nrsvue]

  - ref: 11
    phrase: ye have built houses of hewn stone, but ye shall not dwell in them
    kind: scripture
    title: A covenant curse on the new houses
    body: |
      The sentence on the houses and vineyards is one of the curses Moses attached to the covenant. The Church’s footnote at “dwell” sends the reader to the verse: “thou shalt build an house, and thou shalt not dwell therein: thou shalt plant a vineyard, and shalt not gather the grapes thereof” ([[Deut. 28:30]]). It stands in the list of what Moses says will follow if Israel will not hearken: “all these curses shall come upon thee” ([[Deut. 28:45]]).

      The book’s last promise reverses the curse; see the note on [[Amos 9:14]].
    sources: [lds-scriptures]

  - ref: 12
    phrase: they turn aside the poor in the gate from their right
    kind: history
    title: What was done in the gate
    body: |
      The gate was where a town did its public business, the hearing of cases included, so these verses are about justice bought and sold. Verses 10–15 show which business is meant: in the gate a man “rebuketh,” bribes are taken, the poor are turned “from their right,” and judgment is to be established again (verse 15). A modern translation has the judges “push aside the needy in the gate.”

      The law had put judges there, “Judges and officers shalt thou make thee in all thy gates” ([[Deut. 16:18]]), and in the next verse had ruled on exactly this: “Thou shalt not wrest judgment; thou shalt not respect persons, neither take a gift: for a gift doth blind the eyes of the wise” ([[Deut. 16:19]]). The same rule stands at [[Ex. 23:8]].

      Verse 11 names a second wrong. The “treading” is “probably your trampling,” and the “burdens of wheat” are an “exacted or enforced gift” of grain taken by the stronger from the weaker; a modern translation has “levies of grain.” Both charges have been read in light of the covenant that made Israel one family. Each is “an omission of deeds that would be explicitly expected in the kinship covenant.” In the levy, “the elite took advantage of the poor to increase their own profits, actions forbidden by the law.”
    sources: [bd-gate, lds-scriptures, bdb, nrsvue, matson-amos-kinship]

  - ref: 15
    phrase: it may be that the LORD God of hosts will be gracious unto the remnant of Joseph
    kind: words
    title: 'Perhaps: the remnant of Joseph'
    body: |
      The most hopeful sentence in the chapter is hedged with a “perhaps,” and the hedge is meant. The people have been saying that the LORD is with them (“as ye have spoken,” verse 14). Amos answers that if they hate evil, love good and set judgment up in the gate, then perhaps He will be gracious to what is left of them.

      “Remnant” already assumes the loss; verse 3 left a tenth. The doubt has been read as bearing less on whether there will be a remnant than on whether it will have God’s favor, since life without His gracious attention “would be mere survival—not life.” The remnant was a well-known hope, and on this reading Amos “expresses inspired skepticism that the promises associated with the remnant should be used by Israelites without fear and trembling.” The note on [[Amos 3:12]] takes up the remnant earlier in the book.

      “Joseph” is Israel under an ancestor’s name. Amos uses it three times (here, in verse 6, and at [[Amos 6:6]]), and it has been read as family language: the remnant is “the remaining posterity of a shared ancestor,” so named to remind the hearers that they are kin.
    sources: [spencer-remnant, matson-amos-kinship]

  - ref: 17
    phrase: I will pass through thee
    kind: scripture
    title: The Lord passes through, as in Egypt
    body: |
      “I will pass through thee” is a warning that the Lord will go through Israel “punishing as he goes.” The words have been traced to the night of the Passover, when the Lord said, “I will pass through the land of Egypt this night, and will smite all the firstborn” ([[Ex. 12:12]]); the Hebrew verb is the same in both verses. On that reading Israel “has become an Egypt, which He will pass through as a judge,” and so there is wailing in every street and field, and even in the vineyards, “the places where rejoicing is generally looked for.”

      The verb comes back in the visions “with the opposite meaning.” There the Lord says, “I will not again pass by them any more” ([[Amos 7:8]]), where to pass by is most likely to forgive; see the note on that verse.
    sources: [sears-intercession, keil-amos, oshb-wlc, lds-scriptures]

  - ref: 21
    phrase: I hate, I despise your feast days
    kind: history
    title: Does the Lord reject sacrifice?
    body: |
      The Lord here refuses these offerings from these worshippers; He does not do away with offering. What He names are the offerings of the law of Moses. The burnt offering was the one wholly given, its mark “the burning of the whole animal on the altar.” The “meat offering” is not meat: the Hebrew word “specially denotes an unbloody or meal offering” (“grain offerings” in a modern translation). The peace offering “presupposed that the sacrificer was at peace with God” and ended in a shared meal. “I will not smell” is a threat the law had already made, “I will not smell the savour of your sweet odours” ([[Lev. 26:31]]): He will take no heed of what rises from the altar. The music of verse 23 is only “noise.”

      The reason is in the verses on either side. The people keeping the feasts are the people of the gate (verses 10–12), and an offering cannot stand in for righteousness: “the offering the Lord most cares for is a righteous life—the sacrifices of animals lose their meaning if offered as substitutes for personal righteousness.”

      These verses have been used to set right worship against right conduct in Amos, as two things at odds. Read by the covenant, the book “reconciles both”: those who accepted the law that asked for the offerings “were obligated, among other things, to care for their kin.” For the offerings themselves, see [How Israel worshipped](/old-testament/guides/temple-and-worship/#worship).
    sources: [bd-amos, bd-sacrifices, lds-scriptures, nrsvue, matson-amos-kinship]

  - ref: 24
    phrase: let judgment run down as waters, and righteousness as a mighty stream
    kind: words
    title: Judgment here means justice
    body: |
      “Judgment” in this verse is justice done, not doom pronounced: Amos here “cries out for justice in two lines that have become famous.” The Hebrew *mishpat* is first “a verdict (favorable or unfavorable) pronounced judicially” and then “justice” itself; with its partner *tsedaqah*, righteousness, it names what is looked for “of judge, ruler, king.” It is the pair that verse 7 says has been turned to wormwood and brought “to the ground,” and *mishpat* is what verse 15 says must be set up again in the gate. A modern translation has “let justice roll down like water.”

      The water matters as well. The word for “stream” is used “especially” of “a winter torrent”; “mighty” is “ever-flowing,” a stream that does not fail. In place of the songs the Lord asks for justice that keeps running.
    sources: [ot-manual-8, oshb-wlc, strongs-concordance, bdb, nrsvue]

  - ref: 25
    phrase: Have ye offered unto me sacrifices and offerings in the wilderness forty years
    kind: scripture
    title: The forty years in the wilderness
    body: |
      The question expects the answer no, and what that no means is not settled. It is “equivalent to a denial”; yet at one point in the wilderness story “the altar-fire is actually mentioned, and the daily sacrifice assumed to be still in existence,” though that was soon after the sentence of wandering was passed.

      On one reading the question is about “the nation as a whole, or the great mass of the people.” In the years of wandering “the sacrificial worship prescribed by the law fell more and more into disuse,” though one “cannot infer from this that the daily sacrificial worship was entirely suspended.” On that reading verses 25 and 26 make one charge, that Israel neglected the Lord and carried other gods from the start: “a proof that from time immemorial Israel has acted faithlessly towards its God.” On the same reading the verse is not there “to support the assertion that God does not need or wish for their worship.”

      Stephen also takes it as a charge of idolatry in the wilderness. God, he says, “gave them up to worship the host of heaven; as it is written in the book of the prophets,” and he quotes these verses ([[Acts 7:42–43]]). Jeremiah has a sentence much like this one ([[Jer. 7:22]]); the note there gives one way of taking it.
    sources: [keil-amos, lds-scriptures]

  - ref: 26
    phrase: the tabernacle of your Moloch and Chiun your images
    kind: words
    title: 'Moloch and Chiun: a verse whose names are uncertain'
    body: |
      The names in this verse are uncertain: the King James Version, the ancient Greek translation and modern translations each read the Hebrew differently. The Hebrew has two words, *sikkuth* and *kiyyun*, the first followed by “your king” and the second by “your images.”

      The ancient Greek took *sikkuth* as a common noun, a tent. It has “the tabernacle of Moloch, and the star of your god Raephan,” with a god’s name where the Hebrew has “your king,” and the King James has “the tabernacle of your Moloch.” The words can instead be read as two names of a god: *sikkuth* is probably “Assyrian Sakkut,” a title of Saturn, and *kiyyun* is probably the “planet Saturn” itself. A modern translation reads them so and puts the verse in the future, looking ahead to exile: “You shall take up Sakkuth your king and Kaiwan your star god.”

      Stephen’s quotation has the wording of the Greek: “Yea, ye took up the tabernacle of Moloch, and the star of your god Remphan, figures which ye made to worship them: and I will carry you away beyond Babylon” ([[Acts 7:43]]). He says “Babylon” where the Hebrew and the Greek of Amos both have Damascus.

      What every reading shares is the charge: Israel carried gods “which ye made to yourselves,” one of them a star. And “beyond Damascus” is where the northern kingdom went ([[2 Kgs. 17:6]]).
    sources: [oshb-wlc, lxx-rahlfs, bdb, nrsvue, lds-scriptures]

christ: |
  The one who says “Seek ye me, and ye shall live” is named in verse 8: “The LORD is his name,” in Hebrew Jehovah; the note on [[Amos 4:13]] says who Jehovah is. The Maker of the Pleiades and Orion, who turns the shadow of death into the morning, is the one Israel is told to seek in place of its shrines. The Church’s footnote to “Seek the LORD” in verse 6 leads to Moroni’s closing appeal: “I would commend you to seek this Jesus of whom the prophets and apostles have written” ([[Ether 12:41]]).

explore: |
  - **The day of the LORD.** The notes on [[Joel 1:15]] and [[Isa. 13:6]] say what the phrase names; verses 18–20 are spoken to people who wanted the day to come.
  - **Mercy, and not sacrifice.** [[Hosea 6:6]], with the two places where the Savior quotes it ([[Matt. 9:13]]; [[Matt. 12:7]]); [Keep Mercy and Judgment](/hosea/themes/mercy-not-sacrifice/) follows the line through Hosea.
  - **Offerings refused in Judah.** [[Isa. 1:11–17]] and [[Jer. 7:21–23]].
  - **What the Lord requires.** [[Micah 6:6–8]].
  - **Another prophet’s “perhaps.”** [[Joel 2:13–14]].
  - **Stephen’s use of the chapter.** [[Acts 7:42–43]].
  - **The curse of verse 11 reversed.** [[Amos 9:13–15]].
  - **The charges and the laws behind them.** The article “Covenants, Kinship, and Caring for the Destitute in the Book of Amos” (*Religious Educator*, 2022) sets Amos’s grievances against the elite beside the covenant they broke.

