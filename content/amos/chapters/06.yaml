chapter: 6
title: At Ease in Zion
tagline: The leading men of Samaria feast on ivory couches and feel safe on their hill. Amos pronounces a woe on them, the Lord swears to give up the city, and the chapter ends with a nation on its way.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  This chapter closes the middle part of the book, the warnings to the northern kingdom that run from chapter 3 through chapter 6. After it come the visions. It opens with the second “Woe” in two chapters; the first was for those who wished for the day of the LORD ([[Amos 5:18]]).

  Amos was a native of Tekoa in Judah, “but his ministry was among those of the northern kingdom of Israel,” in the days of Jeroboam II. Those were good years for people with money (the peace and prosperity of the reign are described at [[Amos 1:1]]). Jeroboam had “restored the coast of Israel from the entering of Hamath unto the sea of the plain” ([[2 Kgs. 14:25]]), and the men addressed here are proud of it. Verse 13 quotes their boast, and verse 14 answers it with nearly the same two borders.

  The chapter names their capital, “the mountain of Samaria.” The city “occupied a strong position on a hill,” and when the Assyrians came they “could not capture it until after a siege of three years.” That was still ahead when Amos spoke: Israel was “conquered by the Assyrians in 722 BC.”

  Nephi takes the chapter’s first line into his prophecy of the last days ([[2 Ne. 28:24]]); the note on verse 1 sets the two side by side.

thread: |
  The chapter turns on rank. The men it addresses are the “chief” of the nations (verse 1), they anoint themselves with the “chief” ointments (verse 6), and so they will go into exile “with the first that go captive” (verse 7). Rank is what they are sure of, and the sentence is passed in terms of rank.

  Verses 1–6 describe them, and most of the description is furniture and food: ivory beds, lamb and veal, harps, wine by the bowl, the best oil. Only the last line of the list says what is wrong with the picture: “but they are not grieved for the affliction of Joseph.”

  Verses 7–11 are the sentence. The Lord swears by Himself that He will give up the city, and Amos shows what that will look like inside one house, where ten have died and a survivor is told not to say the Lord’s name.

  Verses 12–14 go back to the charge and end the argument. Two questions about things nobody would do say what Israel has done to justice. The boast is quoted, “Have we not taken to us horns by our own strength?” The last verse answers it: the Lord is raising up a nation, and it will press on the whole land from the northern border to the southern.

sections:
  - range: 1-3
    heading: Woe to the secure
    plain: |
      Woe to those who are at ease in Zion and who feel safe on the hill of Samaria, the well-known men of the first of the nations, to whom the house of Israel comes! Cross over to Calneh and look. Go on from there to great Hamath, then down to Gath of the Philistines. Are they better than these kingdoms? Is their territory larger than yours? You push the evil day far off, and you bring the seat of violence near.
  - range: 4-7
    heading: The feast, and who leaves first
    plain: |
      They lie on beds of ivory and sprawl on their couches. They eat lambs from the flock and calves from the stall. They sing to the sound of the harp and, like David, invent instruments of music for themselves. They drink wine from bowls and anoint themselves with the finest oils, and they are not grieved over the ruin of Joseph. So now they will go into exile at the head of the exiles, and the revelry of those who sprawl will be over.
  - range: 8-11
    heading: The oath, and one house afterward
    plain: |
      The Lord GOD has sworn by Himself, says the LORD, the God of hosts: I abhor the pride of Jacob and hate his palaces, and I will hand over the city and everything in it. If ten people are left in one house, they will die. A kinsman, the one who is to burn the dead, will come to carry the bones out of the house and will call to someone in its farthest corner, “Is anyone still with you?” He will answer, “No.” And the kinsman will say, “Hush! The name of the LORD must not be mentioned.” For the LORD gives the command, and the great house will be struck to rubble and the small house to pieces.
  - range: 12-14
    heading: Horses on the rock
    plain: |
      Do horses run on rock? Does anyone plow there with oxen? Yet you have turned justice into poison and the fruit of righteousness into wormwood. You are glad over a thing of nothing. You say, “Was it not by our own strength that we took horns for ourselves?” Look, house of Israel, says the LORD, the God of hosts: I am raising up a nation against you, and it will oppress you from the entrance of Hamath to the river of the wilderness.

notes:
  - ref: 1
    phrase: at ease in Zion
    kind: scripture
    title: At ease in Zion, in Amos and in Nephi
    body: |
      The woe is spoken to people who feel safe, in the south as well as the north. Zion is the mount on which “Solomon built his temple,” and Samaria is the capital of the north. The Hebrew word for “at ease” carries in this verse the “collateral idea of careless, wanton, arrogant.” The second line says what the ease rests on: they “trust in the mountain of Samaria,” a city that “occupied a strong position on a hill.”

      Nephi takes up the phrase in his prophecy of the last days and says where such ease comes from. The devil will “pacify, and lull them away into carnal security, that they will say: All is well in Zion; yea, Zion prospereth, all is well” ([[2 Ne. 28:21]]). Then comes Amos’s line, now in the singular: “Therefore, wo be unto him that is at ease in Zion!” ([[2 Ne. 28:24]]). The next verse adds, “Wo be unto him that crieth: All is well!” ([[2 Ne. 28:25]]).

      The same Hebrew word describes the scorners of [[Ps. 123:4]] and the women of [[Isa. 32:9]], and the notes on those verses say more about it.
    sources: [lds-scriptures, bdb, bd-zion, bd-samaria]

  - ref: 2
    phrase: Pass ye unto Calneh, and see
    kind: history
    title: Calneh, Hamath and Gath, and what the tour is meant to show
    body: |
      Amos sends his hearers to look at three foreign cities as a warning of what is coming to their own, though which conquests he has in mind is uncertain. Hamath was “an important city of Syria, in the valley of the Orontes,” and Gath was “one of the five cities of the Philistines.” Calneh is the hardest to place. It is “probably” the Calno of the Assyrian boast in [[Isa. 10:9]]. Two possible sites have been proposed for it, one of them a city “near Aleppo, conquered by Tiglath-Pileser III in 738,” and an older commentary puts it in Babylonia, on the Tigris.

      The three are “places of destruction.” The Israelites were no better than the people who had lived there, and “they had been punished, and so would Israel.” What had happened to each city by the time Amos spoke cannot be dated with confidence: the one dated conquest above is that of 738, and the older commentary holds that “it cannot be proved” that Calneh had fallen “as early as the time of Amos.” It reads the cities as still great, so that the questions say Israel is “not inferior either in prosperity or greatness to any of the powerful and prosperous heathen states.”

      The questions themselves are translated both ways. A modern translation prints “Are you better than these kingdoms?” in its text and “Are they better” in its margin.
    sources: [bd-hamath, bd-gath, bdb, keil-amos, ot-manual-8, nrsvue]

  - ref: 4
    phrase: That lie upon beds of ivory
    kind: history
    title: What is wrong with the feast
    body: |
      The list in verses 4–6 shows how well these men live, and only its last line gives the charge. Ivory went with the royal house of Samaria: King Ahab was remembered for “the ivory house which he made” ([[1 Kgs. 22:39]]), and Amos has already said that “the houses of ivory shall perish” ([[Amos 3:15]]).

      Two items in the list have an edge. The music is “like David,” and David’s instruments were made for another use: “four thousand praised the LORD with the instruments which I made, said David, to praise therewith” ([[1 Chr. 23:5]]), a verse the Church’s footnote sets beside this one. And the “bowls” are not ordinary cups. Elsewhere the Hebrew word names a vessel “for use in ritual of sacrifice,” and only here a “bowl for wine.” Whether Amos means that the drinkers were using sacred vessels, or only that they drank from bowls of that size, the verse does not say.

      Then the list stops: “but they are not grieved for the affliction of Joseph.” On one reading of the book, these goods are named because they are what will be taken. The “beds of ivory” and the “excessive livestock and produce” stand with the great houses among the things marked for destruction, wealth that the elite had “acquired through exploitation.”
    sources: [lds-scriptures, bdb, matson-amos-kinship]

  - ref: 6
    phrase: the affliction of Joseph
    kind: words
    title: The breaking of Joseph
    body: |
      “Joseph” is the people Amos is preaching to, called by their ancestor’s name, and their “affliction” is a breaking. The Hebrew noun means “breaking, fracture, crushing,” the word for a broken limb or a smashed pot, used here “of people personified.” A modern translation has “the ruin of Joseph.” This is the third time Amos calls his hearers by this name (the others are [[Amos 5:6]] and [[Amos 5:15]]). On one reading he does it to remind them that they are kin, the “posterity of a shared ancestor.”

      What the breaking is can be taken two ways. It is usually understood as “the impending destruction of the northern kingdom”: the nation is about to be shattered, and its leaders feel nothing. Read with Amos’s charges against the rich, the line “may be a rebuke upon the elite for not noticing the economic inequality and dire situation of the destitute and poor among them who were also of the lineage of Joseph.” On that reading the break is already there, among people of the same family as the men at the table. It is offered as a possibility.
    sources: [bdb, nrsvue, matson-amos-kinship]

  - ref: 7
    phrase: with the first that go captive
    kind: words
    title: First in rank, first into exile
    body: |
      The sentence is made out of the feasters’ own word. In verse 1 they are the “chief” of the nations, and in verse 6 they use the “chief” ointments. The Hebrew word in both places is *reshit*, the “first” or “choice” part. Verse 7 answers with *rosh*, “head”: they will go into exile at the head of the line. The wording was chosen “with direct reference to” the oils of verse 6, and Jerome put the point in one sentence: “Ye who are first in riches will be the first to bear the yoke of captivity.” A modern translation keeps the echo in English, with “the first of the nations” in verse 1 and “the first to go into exile” here.

      The second half of the verse reaches back in the same way. “Them that stretched themselves” is the word used of the men on their couches in verse 4. “Banquet,” which the Church’s footnote gives as “revelry,” has been defined as a “cry of revelry.” It is cited from one other verse, where it is the “house of mourning” that Jeremiah was told not to enter ([[Jer. 16:5]]).
    sources: [bdb, oshb-wlc, keil-amos, nrsvue, lds-scriptures]

  - ref: 8
    phrase: I abhor the excellency of Jacob
    kind: words
    title: The pride of Jacob and his palaces
    body: |
      What the Lord swears to give up is what Israel is proudest of. The Church’s footnote gives the Hebrew behind “excellency” as “pride,” and a modern translation reads “I abhor the pride of Jacob and hate his strongholds.” The palaces are the elite’s “own high-rises,” named among the things “that were to be destroyed.”

      The Lord has sworn once already in the book, “by his holiness” ([[Amos 4:2]]). Here it is “by himself.” The phrase of this verse then returns inside a third oath, which the footnote sets beside this one: “The LORD hath sworn by the excellency of Jacob, Surely I will never forget any of their works” ([[Amos 8:7]]).
    sources: [lds-scriptures, nrsvue, matson-amos-kinship]

  - ref: 10
    phrase: 'Hold thy tongue: for we may not make mention of the name of the LORD'
    kind: history
    title: The house of ten and the name not to be spoken
    body: |
      Verses 9 and 10 show one house after the city has been given up, and several of their details are uncertain. Ten people in the house have died. A relative comes for the bodies: “uncle” is the Hebrew word for a father’s brother, and here it may mean simply a “kinsman.” He is, or has with him, “he that burneth him,” and a modern translation, which takes the two as one man, marks the meaning of the Hebrew as uncertain. Israel buried its dead, and an older reading takes the burning as a measure of the disaster, “such a multitude of deaths that it is impossible to bury the dead.” The ancient Greek translators made something else of the opening words: “But a remnant shall be left behind.”

      The relative calls to a survivor at the back of the house, hears that no one else is left, and says the word the King James Version renders “Hold thy tongue.” It is an interjection, “hush! keep silence.” The verse does not say why the Lord’s name must not be spoken. The same older reading holds that the reason is fear and not despair, “lest, by the invocation of the name of God, the eye of God should be drawn towards this last remaining one.”

      These verses stand among Amos’s “negative prophetic words regarding an Israelite remnant.” The cry “Hush!” returns at [[Amos 8:3]], where the King James Version has “with silence.” Many readers tie the two verses together, though it has been doubted that they share a context; that question belongs to chapter 8.
    sources: [bdb, nrsvue, keil-amos, lxx-rahlfs, spencer-remnant, sears-intercession]

  - ref: 12
    phrase: ye have turned judgment into gall, and the fruit of righteousness into hemlock
    kind: words
    title: Justice turned to poison
    body: |
      The two questions name things nobody does, and the charge is that Israel has done something just as unnatural to its justice. Horses are not run over rock, and no one plows it. A modern translation reads the second question as “Does one plow the sea with oxen?” and keeps the King James sense in its margin.

      “Judgment” is justice, as in [[Amos 5:24]], the verse the Church’s footnote sets beside this one. “Gall” is “a bitter and poisonous herb.” “Hemlock” is wormwood, the plant Amos named when he made the same charge a chapter earlier: “Ye who turn judgment to wormwood” ([[Amos 5:7]]). The King James Version has two English words for the one Hebrew word, so the repetition is easy to miss. Wormwood appears in scripture “only figurative of bitter things,” and both times in Amos it is used “of perverted justice.” The modern translation renders the line “you have turned justice into poison and the fruit of righteousness into wormwood.”
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 13
    phrase: a thing of nought
    kind: history
    title: Lo-debar and Karnaim, two towns inside the boast
    body: |
      The “thing of nought” and the “horns” may be the names of two towns Israel had taken, and which is meant is not settled. In Hebrew the first is *lo dabar*, “no thing,” and the second is *qarnayim*, “horns.” The King James translators took both as ordinary words, and so did the ancient Greek version: “ye who rejoice at vanity, who say, Have we not possessed horns by our own strength?” But both are also place names. Lo-debar was a town “in Gilead,” the place where David found Jonathan’s son ([[2 Sam. 9:4]]), and Karnaim was a place “conquered by Israel,” “probably in Bashan.” Some scholars read the names in this verse, while the Greek “and most” read “horns.” A modern translation prints the names, “you who rejoice in Lo-debar” and “taken Karnaim for ourselves,” and puts “a thing of nothingness” and “horns” in its margin.

      If the towns are meant, the boast is about real victories and Amos lets the names answer it: they are rejoicing over Nothing. On either reading the charge is in the words “by our own strength.”
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 14
    phrase: from the entering in of Hemath unto the river of the wilderness
    kind: history
    title: The borders Jeroboam won
    body: |
      The last verse measures the coming oppression by the borders Israel had just regained. “The entering in of Hamath” was “the northern limit of the Promised Land,” and Jeroboam II had “restored the coast of Israel from the entering of Hamath unto the sea of the plain” ([[2 Kgs. 14:25]]). Amos begins from the same northern point and ends, as Kings does, in the south at the Arabah: the Hebrew word behind “the plain” there and “the wilderness” here is the same, the dry country by the Dead Sea, though where the “river” ran is not certain. The oppression is measured by the kingdom the king had restored.

      The nation is not named, here or anywhere in the chapter. The one that came was Assyria. Its king took “Gilead, and Galilee, all the land of Naphtali” ([[2 Kgs. 15:29]]), and later “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]). The northern kingdom was “conquered by the Assyrians in 722 BC.” The verse itself says who sent the nation: “I will raise up against you a nation.”
    sources: [bd-hamath, lds-scriptures, bdb, scripture-helps-amos]

christ: |
  The one who swears in verse 8 is “the LORD the God of hosts,” and the LORD of the Old Testament is Jehovah, “the premortal Jesus Christ.” In this chapter He is the judge of His own people. He abhors, He commands, and He raises up the nation.

  The Church’s footnote on “sworn” points to places where the same Lord swears to bless. “When God made promise to Abraham, because he could swear by no greater, he sware by himself” ([[Heb. 6:13]]). Of latter-day Zion a revelation says, “he hath sworn by the power of his might to be her salvation and her high tower” ([[D&C 97:20]]).

  Nephi’s chapter, which repeats this chapter’s woe, ends with an offer: “I will be merciful unto them, saith the Lord God, if they will repent and come unto me; for mine arm is lengthened out all the day long, saith the Lord God of Hosts” ([[2 Ne. 28:32]]).

explore: |
  - **The first woe.** [[Amos 5:18–20]], on those who wished for the day of the LORD.
  - **Nephi’s woes.** [[2 Ne. 28:21–32]], where “at ease in Zion” stands in a series of woes.
  - **The reign behind the boast.** [[2 Kgs. 14:23–29]].
  - **How it ended.** [[2 Kgs. 17:5–23]], the fall of Samaria and the reasons Kings gives for it.
  - **Calno and Hamath in Assyria’s boast.** [[Isa. 10:5–11]].
  - **The other people “at ease.”** [[Isa. 32:9–14]] and [[Ps. 123:4]].
  - **Joseph in Amos.** The article “Covenants, Kinship, and Caring for the Destitute in the Book of Amos” reads the three places where Amos calls Israel “Joseph” as appeals to kinship.

parallels:
  - ref: 2 Ne. 28:24
    note: Nephi repeats the woe of verse 1 in his prophecy of the last days, in the singular.

