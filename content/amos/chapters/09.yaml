chapter: 9
title: The Sieve and the Fallen Booth
tagline: Amos sees the Lord at the altar, ordering the sanctuary brought down on its worshippers, and no hiding place is left. Then the sentence is limited to the sinful kingdom, and the book ends with the fallen house of David raised and Israel planted in its land.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  This is the last chapter of the book and the end of its third part, the visions “of coming judgment and a message of hope that God would one day restore and bless His people.” Four visions have come before it, in chapters 7 and 8. Each of those began with the Lord showing Amos something. This one begins differently: “I saw the Lord.”

  When Amos spoke, nothing in Samaria looked like the ruin this chapter describes (the reign is described at [[Amos 1:1]], and the kingdom’s fall at [[Amos 3:11]]).

  The chapter’s last five verses are a promise. They are read as part of what Amos taught, and of the last days. Scholars’ theories about how the book was composed and edited “vary considerably,” and it has been suggested that the book “originally ended” with the vision of verses 1–4.

  The New Testament quotes the chapter at the council in Jerusalem, where James cites verses 11–12 to show that the prophets foresaw Gentiles coming to the Lord ([[Acts 15:13–18]]); the note on verse 12 sets his words beside Amos’s.

thread: |
  The chapter says two things that seem unable to stand together, and then says how they do.

  The first is that no one gets away. In verses 1–4 the Lord orders the sanctuary struck and promises to kill whoever is left, and five hiding places are named and closed. The passage has been called Amos’s “most extreme statement,” in which he “suggests the possibility that Israel might ultimately be left without any remnant at all.” The hymn of verses 5–6 says who is speaking, and verse 7 takes away the last defense: the Lord who brought Israel out of Egypt has moved other nations too.

  The second is in verse 8: “I will not utterly destroy the house of Jacob.” The sieve of verse 9 holds the two together. Israel will be shaken among the nations, and the shaking sorts. Verse 10 says who dies: “All the sinners of my people,” the ones who were sure that the evil would not reach them.

  After that the verbs change. Through verse 10 the Lord smites, slays, searches out, and destroys. From verse 11 He raises up, closes breaches, builds, brings back, and plants. What He raises is the house of David, fallen like a hut of branches, and the book that began with a roar from Zion ends with a people who “shall no more be pulled up out of their land.”

sections:
  - range: 1-4
    heading: The Lord at the altar, and no place to hide
    plain: |
      I saw the Lord standing by the altar, and He said: Strike the tops of the pillars so that the thresholds shake, and bring them down on the heads of all the people. Those who are left I will kill with the sword. Not one who runs will get away, and not one who escapes will be safe. If they dig down to the world of the dead, my hand will take them from there. If they climb to heaven, I will bring them down. If they hide on the top of Carmel, I will search them out and take them. If they hide from my sight on the floor of the sea, I will command the serpent there, and it will bite them. If they are marched into exile ahead of their enemies, I will command the sword there, and it will kill them. I will fix my eyes on them for harm and not for good.
  - range: 5-6
    heading: Who is speaking
    plain: |
      The Lord GOD of hosts touches the land and it melts, and all who live in it mourn. All of it rises like the Nile and sinks again like the Nile of Egypt. He builds His upper chambers in the heavens and sets His vault over the earth. He calls for the waters of the sea and pours them out on the face of the earth. The LORD is His name.
  - range: 7-10
    heading: Not utterly, the sieve
    plain: |
      Are you not like the people of Cush to me, children of Israel? says the LORD. Did I not bring Israel up out of Egypt, and the Philistines from Caphtor, and the Syrians from Kir? The eyes of the Lord GOD are on the sinful kingdom, and I will destroy it from the face of the earth. Yet I will not utterly destroy the house of Jacob, says the LORD. I will give the command, and I will shake the house of Israel among all the nations as grain is shaken in a sieve, and not the smallest kernel will fall to the ground. All the sinners among my people will die by the sword, those who say, “Disaster will not catch up with us or come to meet us.”
  - range: 11-12
    heading: The fallen booth of David raised
    plain: |
      In that day I will raise up the booth of David that has fallen. I will wall up its breaches and raise its ruins, and I will build it as it was in the days of old, so that they may possess what is left of Edom, and all the nations that are called by my name, says the LORD, who does this.
  - range: 13-15
    heading: The land and the people planted
    plain: |
      The days are coming, says the LORD, when the plowman will catch up with the reaper, and the one treading grapes with the one sowing seed. The mountains will drip sweet wine, and all the hills will flow with it. I will bring back the captives of my people Israel. They will rebuild the ruined cities and live in them. They will plant vineyards and drink their wine, and make gardens and eat their fruit. I will plant them on their land, and they will never again be pulled up out of the land I have given them, says the LORD your God.

notes:
  - ref: 1
    phrase: I saw the Lord standing upon the altar
    kind: history
    title: Which altar, and what Amos saw
    body: |
      The verse does not say which altar this is, and readers have long been divided between Beth-el and Jerusalem. Those who choose Beth-el point to the book’s target, the northern kingdom and its royal sanctuary, and to an earlier threat: “I will also visit the altars of Beth-el: and the horns of the altar shall be cut off, and fall to the ground” ([[Amos 3:14]]). The case for “the altar of burnt-offering in the temple, at Jerusalem” is that Amos speaks of more than one altar at Beth-el and of more than one northern shrine, so that none of them could be called simply “the altar.” The text settles neither.

      Where the Lord stands is also open. The King James has “upon.” A modern translation prints “standing beside the altar,” with “on” in its margin. The words have also been read “at (not upon) the altar.”

      What is plain is that Amos saw Him. In the first four visions the Lord shows a sign and speaks about it. Here there is no sign, and “this closing vision shows the Lord engaged in the execution of the judgment.” The verse stands with Isaiah’s “I saw also the Lord” ([[Isa. 6:1]]) among the witnesses to “the real possibility of seeing God in mortality, especially in the temple.”
    sources: [keil-amos, nrsvue, skinner-seeing-god, lds-scriptures]

  - ref: 1
    phrase: Smite the lintel of the door, that the posts may shake
    kind: words
    title: From the capitals to the thresholds
    body: |
      The order is to strike the building at its top so that it shakes at its base and falls on the people inside. The word translated “lintel” means the “capital of pillar,” the head of a column. The “posts” are the sills underfoot; in this verse the word means “threshold, sill.”

      A modern translation therefore has “Strike the capitals until the thresholds shake,” which makes sense of the next clause as well. The King James’s “cut them in the head, all of them” becomes “shatter them on the heads of all the people”: the broken stone comes down on the worshippers. The verse does not say who is told to strike.
    sources: [bdb, nrsvue]

  - ref: 2
    phrase: Though they dig into hell, thence shall mine hand take them
    kind: scripture
    title: No hiding place, beside Psalm 139
    body: |
      Verses 2–4 name five hiding places and close each one, and the first two are the ones a psalm names for comfort. “Hell” is Sheol, the world of the dead, and a modern translation keeps the name: “Though they dig into Sheol.” The psalmist says, “If I ascend up into heaven, thou art there: if I make my bed in hell, behold, thou art there” ([[Ps. 139:8]]), and of the farthest sea, “Even there shall thy hand lead me, and thy right hand shall hold me” ([[Ps. 139:10]]). The Church’s footnote on “hell” in this verse sends the reader to that psalm. In the psalm the hand that reaches everywhere leads. Here it takes.

      The list then goes on to the top of Carmel, the floor of the sea, and last to exile itself: even those who “go into captivity before their enemies” are followed by the sword.

      One reading sets these verses against the hope of a surviving remnant. “He that fleeth” and “he that escapeth” are “those who could constitute a preserved remnant of Israel,” and both “end up dead.” The same reading allows that this “may, of course, be primarily overheated rhetoric, used principally for effect,” since verse 8 goes on to say “not utterly.” The note on [[Amos 5:15]] takes up that hope.

      The passage has also been read of the last day, on the ground that “only the Second Coming of the Lord fulfills such a description.”
    sources: [lds-scriptures, nrsvue, spencer-remnant, ot-manual-8]

  - ref: 6
    phrase: buildeth his stories in the heaven, and hath founded his troop in the earth
    kind: words
    title: Upper chambers and a vault
    body: |
      The two odd nouns describe a house whose upper floor is the sky. “Stories” is the ordinary Hebrew word for a “step, stair,” understood in this verse as the “stories of heaven,” and a modern translation has “who builds his upper chambers in the heavens.” “Troop” is a word for things bound together, used elsewhere of a “bunch of hyssop” and a “band of men.” Here it is taken as the “vault of the heavens (as fitted together, constructed),” and the modern translation has “founds his vault upon the earth.”

      Verse 5 is nearly the same sentence as [[Amos 8:8]]. The “flood of Egypt” in both is the Nile: “all of it rises like the Nile.”

      This is the third time the book stops to describe the Creator and name Him. The notes on [[Amos 4:13]] and [[Amos 5:8]] say who is named and why such a hymn stands beside a sentence of judgment.
    sources: [bdb, nrsvue]

  - ref: 7
    phrase: Are ye not as children of the Ethiopians unto me, O children of Israel?
    kind: history
    title: Israel beside Cush, Philistia and Syria
    body: |
      The verse says that the Exodus alone does not set Israel beyond judgment, because the Lord has brought other nations to their lands as well. The “Ethiopians” are the people of Cush, a country that “extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum.” The verse compares one people with another, as peoples. It says nothing else about them.

      The other two nations are neighbors, and both stand under judgment in the book’s first chapter ([[Amos 1:3–8]]). The Philistines came from Caphtor, “probably Crete.” The Syrians came from Kir, and this book has already said they will be sent back there: “the people of Syria shall go into captivity unto Kir” ([[Amos 1:5]]; the note there tells how it was carried out).

      The Lord who moved these nations is “the righteous ruler of all nations and men.” This verse is set with [[Amos 3:2]], where Israel alone is “known” and is punished for that reason: being the covenant people makes Israel’s punishment heavier. The note there explains the word.
    sources: [ot-manual-8, bd-ethiopia, bdb, bd-amos, lds-scriptures]

  - ref: 9
    phrase: like as corn is sifted in a sieve, yet shall not the least grain fall upon the earth
    kind: symbol
    title: What stays in the sieve
    body: |
      The sieve is how “I will destroy” and “not utterly” can both be true: the shaking sorts. The picture can be taken two ways, because the Hebrew word behind “least grain” ordinarily means a pebble.

      It may be “figurative for grain of wheat, in metaphor of winnowed Israel.” On that reading no good kernel is lost, and the verse has been read so of the gathering, in which “not one worthy soul will be unnoticed.” Or it is the “pebble retained in sieve,” the rubbish the mesh holds back while the grain passes through. A modern translation prints “no pebble shall fall to the ground,” and on this reading the sifting is how “all the sinners” die.

      Verse 10 follows from either. Those who die are the ones who say the evil will not “prevent” them. “Prevent” here means to meet; the Hebrew is “confront.”
    sources: [bdb, nrsvue, ot-manual-8, spencer-remnant, lds-scriptures]

  - ref: 11
    phrase: the tabernacle of David that is fallen
    kind: words
    title: David’s house as a fallen hut
    body: |
      The “tabernacle” here is a hut of branches, and the image is of David’s royal house reduced to one. The Hebrew word is *sukkah*, a “booth, rude or temporary shelter,” the kind put up “for watchers in vineyards” and lived in at the harvest feast. In this verse it is used “in poetry of fallen house (dynasty) of David,” and a modern translation has “the booth of David that is fallen.”

      The Lord had told David, “thine house and thy kingdom shall be established for ever before thee” ([[2 Sam. 7:16]]). A hut is the opposite of the palace David built on Zion, and a fallen hut pictures “the utter ruin of the kingdom.”

      That raises a question about when. Amos spoke under Uzziah, in whose reign “the kingdom of Judah reached the summit of its earthly power and glory.” One answer is that David’s rule “had already received a considerable blow through the falling away of the ten tribes,” but that it “first became a hut when the kingdom of Judah was overcome by the Chaldeans.” On that reading the fall itself was still ahead when Amos spoke, and the raising lies beyond it.

      The raising itself is placed late: “in the last days the kingdom will return to and even surpass its ancient glory.”
    sources: [bdb, oshb-wlc, nrsvue, keil-amos, bd-amos, lds-scriptures]

  - ref: 12
    phrase: That they may possess the remnant of Edom, and of all the heathen, which are called by my name
    kind: scripture
    title: How James quotes these verses
    body: |
      James’s quotation of verses 11–12 at the council in Jerusalem, as Acts records it, follows the Greek form of the verses, which differs from the Hebrew here. The question before the council was whether Gentile converts had to be circumcised. Peter had told how God “did visit the Gentiles, to take out of them a people for his name” ([[Acts 15:14]]). James answered that the prophets agree, and cited Amos: “That the residue of men might seek after the Lord, and all the Gentiles, upon whom my name is called” ([[Acts 15:17]]).

      The Hebrew, which the King James follows, has Israel “possess the remnant of Edom.” The old Greek translation has “that the remnant of men, and all the Gentiles upon whom my name is called, may earnestly seek me.” Two small differences in Hebrew letters lie behind it. The Greek “reflects a reading” of *’edom*, “Edom,” as *’adam*, “humanity,” and of the verb “they will possess” as “they will seek after.” The Greek form “fits comfortably” with the use James makes of it, to show that the prophets foretold “the extension of the gospel beyond the house of Israel to the Gentiles.”

      Both forms keep the words about nations on whom the Lord’s name is called.

      Edom is named in the Hebrew as a nation related to Israel by blood and long its enemy (see the note on [[Amos 1:11]]).
    sources: [lds-scriptures, lxx-rahlfs, mcclellan-ot-in-nt, bd-edom]

  - ref: 13
    phrase: the plowman shall overtake the reaper
    kind: symbol
    title: Harvests that run into each other
    body: |
      The picture is of crops so heavy that one season’s work is not finished when the next begins. The man plowing for the next crop catches up with the man still reaping the last one, and the grapes are still being trodden when the sower comes.

      The promise is an old one. The law had told an obedient Israel, “your threshing shall reach unto the vintage, and the vintage shall reach unto the sowing time” ([[Lev. 26:5]]), and Joel has “the mountains shall drop down new wine” ([[Joel 3:18]]). A modern translation’s cross-references set both beside this verse.

      “All the hills shall melt” is not a threat. The modern translation has “all the hills shall flow with it,” that is, with wine.
    sources: [lds-scriptures, nrsvue]

  - ref: 14
    phrase: they shall plant vineyards, and drink the wine thereof
    kind: scripture
    title: The sentence of chapter 5, reversed
    body: |
      Verse 14 gives back what an earlier sentence took away. Amos had told the men who trampled the poor, “ye have built houses of hewn stone, but ye shall not dwell in them; ye have planted pleasant vineyards, but ye shall not drink wine of them” ([[Amos 5:11]]). Now Israel will build “and inhabit them,” plant “and drink the wine thereof.” The note on that verse gives the curse of the law that stands behind it.

      “I will bring again the captivity” is given more broadly in a modern translation as “I will restore the fortunes of my people Israel,” and it has been read here as “the turning of misfortune and misery into prosperity and salvation.”

      For the people who heard Amos the promise lay on the far side of the loss. His prophecies of doom “were fulfilled within a few decades,” and what he saw past them was “the flourishing of gathered Israel in the last days.”
    sources: [lds-scriptures, keil-amos, nrsvue, vandyke-ogden-twelve]

christ: |
  The house that the Lord promises to raise is David’s, and the New Testament names its heir. Gabriel told Mary of her son, “the Lord God shall give unto him the throne of his father David” ([[Luke 1:32]]), “and of his kingdom there shall be no end” ([[Luke 1:33]]).

  Verse 11 has long been read of the Messiah. David’s reign came to be regarded as a type of the age the nation expected the Messiah to bring. A scroll found among the Dead Sea Scrolls at Qumran sets this verse in “a collection of messianic passages” beside Nathan’s promise to David.

  The one who says “I will raise up” is the LORD, Jehovah, who “came to earth as a son of Mary” (see the note on [[Amos 4:13]]).

explore: |
  - **James at the council.** [[Acts 15:13–21]], where verses 11–12 decide a question about the Gentiles.
  - **The promise to David.** [[2 Sam. 7:8–16]], the house and the planting that verses 11 and 15 take up.
  - **The blessing behind verse 13.** [[Lev. 26:3–6]], and Joel’s version of the dripping mountains, [[Joel 3:18]].
  - **The other visions.** [[Amos 7:1–9]] and [[Amos 8:1–3]], the four that came before this one.
  - **The remnant in the prophets.** The study “The Prophets’ Remnant Theology” follows the hope of a remnant through Amos, Micah and Isaiah.

