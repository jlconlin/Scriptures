chapter: 2
title: The List Reaches Israel
tagline: Amos finishes his round of the nations with Moab, turns to Judah, and then pronounces the same sentence on Israel. Israel’s charge is the longest of the eight, and it is about what the comfortable are doing to the poor.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  The book’s first part, chapters 1–2, is a series of judgments on the nations around Israel, then on Judah, then on Israel itself. Chapter 1 gave five of them; this chapter gives the last three: Moab, Judah and Israel.

  Amos was a man of Judah, but his ministry was in the northern kingdom, and it is the northern kingdom that hears these words. Moab lay east of the Dead Sea; its people were kin to the Israelites and often at war with them. Judah is the speaker’s own country. “Israel” in verse 6 is the northern kingdom, whose king was Jeroboam II.

  The time was a good one for those who had money. Chapter 1’s setting describes it (see [[Amos 1:1]]); what matters here is that the people Amos accuses were enjoying “an era of peace and prosperity” and saw no sign of the ruin he describes. It came when Assyria conquered the northern kingdom (see the note on [[Amos 3:11]]).

thread: |
  The chapter’s argument is in its order. Six foreign nations have been named and sentenced, each in the same form of words: “For three transgressions … and for four” (the note on [[Amos 1:3]] explains the idiom). Moab is the sixth (verses 1–3). Judah is the seventh (verses 4–5). Then the same sentence begins an eighth time, and the name in it is Israel (verse 6). The oracles against the nations have been called “a subtle and persuasive introduction” to the oracle against Israel.

  Israel’s oracle is the longest, and it has three parts. First the charges, which are particular: people sold for silver, the poor ground down, a girl used by a father and his son, pledged cloaks spread out beside the altars, and wine bought with fines (verses 6–8). Then the Lord sets beside them what He did for this people: He cleared the land, brought them out of Egypt, and raised prophets and Nazarites from among their own sons; they silenced the prophets and corrupted the Nazarites (verses 9–12). Then the sentence: a weight that presses down, and a day when the fastest and bravest soldier cannot save himself (verses 13–16).

  Moab loses its judge and its princes, and Amos’s punishments have been read as “directly pointed at the elite,” in Israel as much as in the foreign nations ([[Amos 1:4]] has the note on the “palaces”).

sections:
  - range: 1-3
    heading: Moab
    plain: |
      The LORD says: Moab has piled transgression on transgression, and I will not take back the sentence. He burned the bones of the king of Edom to lime. I will send a fire on Moab that will consume the palaces of Kerioth. Moab will die in the uproar of battle, amid the war cry and the trumpet blast. I will cut off its ruler and kill all its princes with him.
  - range: 4-5
    heading: Judah
    plain: |
      The LORD says: Judah has piled transgression on transgression, and I will not take back the sentence. They have rejected the law of the LORD and have not kept His commandments. The lies their fathers followed have led them astray too. I will send a fire on Judah that will consume the palaces of Jerusalem.
  - range: 6-8
    heading: Israel charged
    plain: |
      The LORD says: Israel has piled transgression on transgression, and I will not take back the sentence. They sell the innocent for silver and the poor man for a pair of sandals. They pant after the dust of the earth on the heads of the poor and push the afflicted out of their way. A man and his father go to the same girl, and so profane My holy name. Beside every altar they stretch out on cloaks taken as security for loans, and in the house of their god they drink wine paid for with the fines they have imposed.
  - range: 9-12
    heading: What the Lord had done for them
    plain: |
      Yet it was I who destroyed the Amorite before them, though he was tall as the cedars and strong as the oaks; I destroyed him fruit and root. It was I who brought you up from Egypt and led you forty years through the wilderness to take the Amorite’s land. I raised up some of your sons to be prophets and some of your young men to be Nazarites. Is that not so, children of Israel? But you made the Nazarites drink wine, and you ordered the prophets not to prophesy.
  - range: 13-16
    heading: The sentence
    plain: |
      I am weighed down under you like a cart loaded full of sheaves. The swift will have nowhere to run, the strong will lose their strength, and the warrior will not save his life. The archer will not stand his ground; neither the fast runner nor the horseman will escape. On that day the bravest of the warriors will run away naked.

notes:
  - ref: 1
    phrase: he burned the bones of the king of Edom into lime
    kind: history
    title: A dead king’s body desecrated
    body: |
      Moab is condemned for burning the bones of Edom’s king to lime, not for killing him. This is the last of the charges of brutality in war. It has been described as “not only an act of violence but a disregard for the individual’s life.” Israel’s own law did not allow such treatment even of an executed criminal, whose body had to come down by nightfall: “thou shalt in any wise bury him that day” ([[Deut. 21:23]]).

      The victim is not said to be an Israelite. On one reading that is part of what Amos is saying: even when nations are at war, “an ethical standard should be maintained for the dignity of humankind.”

      When this happened is not recorded: “No record has been preserved of this event in the historical books of the Old Testament.” It has been connected with the war in which the kings of Israel, Judah and Edom marched together against Moab, when the king of Moab tried and failed “to break through even unto the king of Edom” ([[2 Kgs. 3:26]]). The connection rests on a Jewish tradition found in Jerome, that after the war the Moabites dug up the Edomite king’s bones and burned them. It is an inference from that tradition; the verse gives no occasion.

      Kerioth, whose palaces are to burn, is a city Jeremiah also names in Moab: “upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab” ([[Jer. 48:24]]).
    sources: [matson-amos-kinship, ot-manual-8, lds-scriptures]

  - ref: 4
    phrase: because they have despised the law of the LORD
    kind: history
    title: Judah is charged with no atrocity, only with rejecting the law
    body: |
      Judah’s charge differs in kind from the six before it: there is no act of cruelty in it, only what Judah did with what the Lord had given. They “despised the law of the LORD” and did not keep His commandments. A modern translation has “rejected the instruction of the Lord.” The Church’s footnote on “despised” points to the warning in the law itself, which puts despising the Lord’s statutes beside breaking His covenant: “if ye shall despise my statutes … but that ye break my covenant” ([[Lev. 26:15]]).

      “Their lies caused them to err” is the second half of the charge. The Hebrew word is the ordinary one for a lie or falsehood, and in this verse it has been taken “of idols,” an idol being a thing that deceives. That fits the clause that follows: these are lies “after the which their fathers have walked,” something a people follows, generation after generation.

      Israel’s charge, which comes next, is different again. It names particular wrongs done to particular people.
    sources: [nrsvue, bdb, lds-scriptures]

  - ref: 6
    phrase: For three transgressions of Israel, and for four
    kind: structure
    title: The eighth name on the list
    body: |
      Israel’s sentence begins in exactly the words used for Damascus, Gaza, Tyre, Edom, Ammon, Moab and Judah. The first seven are all other peoples. Of the charge against Tyre it has been said that the Israelites “easily recognized and eagerly accepted this condemnation.” But Amos had not come north to comfort them. The round of the nations was a way in to the charge against Israel’s own leading men.

      So the eighth oracle puts Israel on the same list as its neighbors. In one Latter-day Saint reading, the trouble “is not that northern Israelites are surrounded by wickedness but that, like their neighbors, they have become wicked themselves.”

      The word “transgressions” ties the list to what follows. Amos uses the same noun when the Lord speaks again of the day “that I shall visit the transgressions of Israel upon him” ([[Amos 3:14]]). And the next chapter says why belonging to the Lord makes the matter worse and not better (see [[Amos 3:2]]).
    sources: [matson-amos-kinship, vandyke-ogden-twelve, bd-amos]

  - ref: 6
    phrase: they sold the righteous for silver, and the poor for a pair of shoes
    kind: history
    title: A person sold for the price of sandals
    body: |
      The first charge is that people are being sold, and for next to nothing. The “shoes” are sandals, and a pair of them is “mentioned as of little worth.”

      The line has been read as a scene in court. “The righteous” is then the man who is in the right, the innocent party (a modern translation has “They sell the innocent for silver”), and the sellers are judges “who were bribed to punish a man as guilty.” The second half stays in the same court: “the poor debtor who could not pay for a pair of shoes, i.e., for the merest trifle,” is handed by the judge to his creditor as a slave. A creditor could claim as much. A widow tells Elisha, “the creditor is come to take unto him my two sons to be bondmen” ([[2 Kgs. 4:1]]).

      Amos comes back to the phrase near the end of the book, where the grain merchants plan to “buy the poor for silver, and the needy for a pair of shoes” ([[Amos 8:6]]). Such dealings have been said to “stand in opposition to the covenant of kinship” of Leviticus 25, which begins, “if thy brother that dwelleth by thee be waxen poor, and be sold unto thee; thou shalt not compel him to serve as a bondservant” ([[Lev. 25:39]]), and to “lead to the enslavement of fellow Israelites.”
    sources: [bdb, niv, keil-amos, matson-amos-kinship, lds-scriptures]

  - ref: 7
    phrase: That pant after the dust of the earth on the head of the poor
    kind: words
    title: Panting after dust, or trampling heads into it
    body: |
      The line about dust on the head of the poor can be taken three ways, and all three describe the oppression of the poor. The King James wording is hard to follow because the Hebrew is.

      The Hebrew verb ordinarily means to “gasp, pant, pant after, long for,” and the King James translators took it so. On that reading the line has been explained as an exaggeration “for extreme avarice,” or as a wish to see the poor so wretched that they throw dust on their own heads, “a sign of mourning.”

      The verse has also been placed under a second verb with the same spelling, to “crush, trample upon,” with the admission that the wording is strange and that most take the two as one verb. Modern translations read it so: “they who trample the head of the poor into the dust of the earth.” The same verb is used of the same people later in the book, “O ye that swallow up the needy” ([[Amos 8:4]]), which is also read as trampling.

      “Turn aside the way of the meek” is the companion line. One modern translation gives it as “deny justice to the oppressed” and sets beside it the fuller charge later in the book: “they turn aside the poor in the gate from their right” ([[Amos 5:12]]).
    sources: [bdb, nrsvue, niv, ot-manual-8]

  - ref: 7
    phrase: a man and his father will go in unto the same maid
    kind: history
    title: A father and his son and the same girl
    body: |
      The charge is that a father and his son both go to the same young woman, and the Lord counts it an insult to His own name. The verse does not say who she is. The Hebrew word is the common one for a “girl, damsel,” and modern translations leave it there: “the same young woman,” “the same girl.” She has been taken in this verse to be a prostitute. That she was a woman attached to a shrine has been proposed and denied: such women “are not to be thought of here.” The text settles none of it.

      The verse names no law. The wrong has been called “tantamount to incest,” with the laws that forbade a man his father’s wife ([[Lev. 20:11]]) and his son’s wife ([[Lev. 18:15]]).

      “To profane my holy name” is the language of that same body of law: “Neither shall ye profane my holy name; but I will be hallowed among the children of Israel” ([[Lev. 22:32]]). The phrase has been traced to that verse.
    sources: [bdb, nrsvue, niv, keil-amos, lds-scriptures]

  - ref: 8
    phrase: clothes laid to pledge by every altar
    kind: history
    title: A poor man’s cloak for a couch, and his fine for wine
    body: |
      Both halves of the verse show worshippers at a shrine resting on, and drinking, what they took from the poor. “Clothes laid to pledge” are garments handed over as security for a loan. The law let a lender take a cloak in pledge but not keep it overnight: “thou shalt deliver it unto him by that the sun goeth down: For that is his covering only, it is his raiment for his skin: wherein shall he sleep?” ([[Ex. 22:26–27]]; see the note on [[Ex. 22:27]]). Deuteronomy says it of the poor man in particular: “if the man be poor, thou shalt not sleep with his pledge” ([[Deut. 24:12]]).

      “The wine of the condemned” is wine got from fines. The Hebrew word means “those fined,” and modern translations make the link plain: “wine bought with fines they imposed,” or wine “taken as fines.”

      Whose house it is depends on the translator. The King James Version and one modern translation print “their god,” another prints “their God.” In one Latter-day Saint reading this verse is among Amos’s charges of idolatry.
    sources: [bdb, nrsvue, niv, vandyke-ogden-twelve, lds-scriptures]

  - ref: 12
    phrase: commanded the prophets, saying, Prophesy not
    kind: history
    title: The Nazarite made to drink, the prophet told to be quiet
    body: |
      Israel gave wine to the Nazarites and told the prophets not to prophesy, though the Lord had raised up both from Israel’s own sons. A Nazarite was “a consecrated man” whose vow began with keeping from wine: “He shall separate himself from wine and strong drink” ([[Num. 6:3]]). To give him wine was to make him break his vow. The two acts together have been read as a wish to set the Lord’s servants aside so that every man could live in his own way and be comfortable doing it.

      “Prophesy not” is not a figure of speech. Amos will hear it said to his own face, when the priest of Bethel tells him, “prophesy not again any more at Beth-el” ([[Amos 7:13]]), and he will repeat the charge to the priest: “Thou sayest, Prophesy not against Israel” ([[Amos 7:16]]). A modern translation’s cross-references add two prophets who met the same demand, from people who say “to the prophets, Prophesy not unto us right things” ([[Isa. 30:10]]) and “Prophesy ye not, say they to them that prophesy” ([[Micah 2:6]]).

      The questions of the next chapter have been read as the Lord’s answer to this command: silencing the prophets would not spare Israel the judgment they announce (see the note on [[Amos 3:8]]).
    sources: [bd-nazarite, ot-manual-8, scripture-helps-amos, niv, lds-scriptures]

  - ref: 13
    phrase: I am pressed under you, as a cart is pressed that is full of sheaves
    kind: words
    title: Who is pressed under the cart?
    body: |
      In the King James Version it is the Lord who is weighed down, by Israel; in two widely used modern translations it is the Lord who does the pressing. The difficulty is one Hebrew verb, a “dubious” one. Those translations take it as something the Lord will do to Israel: “I will press you down in your place, just as a cart presses down when it is full of sheaves,” with the note “Meaning of Heb uncertain,” or “I will crush you as a cart crushes when loaded with grain.”

      In one Latter-day Saint reading, which follows the King James wording, the line is the burden of Israel’s sins, “felt so keenly by Amos” that he declares it.

      On either reading, verses 14–16 say what comes of it, and the picture is of an army routed. The swift man, the strong man, the archer, the runner and the horseman all fail, and the bravest of them flees “naked in that day.”
    sources: [bdb, nrsvue, niv, vandyke-ogden-twelve]

christ: |
  The “I” of verses 9–11 is Jesus Christ. The one who says “I brought you up from the land of Egypt, and led you forty years through the wilderness” is the LORD, the form in which the King James Version prints the name Jehovah, and Jehovah is Jesus Christ before His birth (the note on [[Amos 4:13]] gives the Church’s statement). Paul says the same of those forty years: Israel in the wilderness “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]).

  So the charges of verses 6–8 are brought by the one who had led this people out and given them their land, and the gifts of verses 9–11 are His.

explore: |
  - **The laws behind the charges.** [[Ex. 22:25–27]], [[Deut. 24:10–17]], and [[Lev. 25:35–43]].
  - **The same charges later in the book.** [[Amos 5:11–12]] and [[Amos 8:4–6]].
  - **“Prophesy not.”** Amos is told so himself in [[Amos 7:10–17]]; what follows from silencing the prophets is in [[Amos 8:11–12]].
  - **The Lord’s recital of what He had done.** [[Josh. 24:2–13]], and the Nazarite’s vow in [[Num. 6:1–21]].
  - “Covenants, Kinship, and Caring for the Destitute in the Book of Amos” (*Religious Educator*, 2022) reads chapters 1–2 as a case about kinship: what the nations owed their neighbors, and what Israel owed its own poor.

