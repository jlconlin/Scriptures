chapter: 3
title: The Lion Has Roared
tagline: Israel is the one family the Lord has known, and that is the charge against it. A run of questions shows why a prophet who has heard the Lord cannot keep silent, and then the sentence falls on Samaria’s palaces, on the altar at Beth-el, and on the houses of ivory.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  Chapter 3 begins the middle part of the book. Chapters 1–2 judged the nations, then Judah, then Israel; chapters 3–6 are “Warnings to the Northern Kingdom and Amos’s plea for the people to repent.” The summons “Hear this word” opens this chapter and [[Amos 4:1]], and [[Amos 5:1]] begins “Hear ye this word.”

  The hearers are the people of Samaria, the northern capital, in years when “the Israelites were enjoying an era of peace and prosperity” (see [[Amos 1:1]]). The address is wider than the kingdom, though. “The whole family which I brought up from the land of Egypt” takes in “all twelve families or tribes.”

  The end of chapter 2 lies behind this one. There the Lord charged that Israel had “commanded the prophets, saying, Prophesy not” ([[Amos 2:12]]). The first half of this chapter answers that order. The second half says what is coming all the same: an enemy around the land and Samaria plundered. The chapter does not name the enemy; the note on verse 11 says who it proved to be. Amos’s prophecies of doom “were fulfilled within a few decades” of his ministry.

thread: |
  The chapter argues from cause to consequence, and it starts with the cause. “You only have I known of all the families of the earth: therefore I will punish you.” Israel “had come to trust that its covenantal relationship to the Lord would secure its preservation”; the Lord makes that relationship the ground of the charge.

  Before Amos says more about the judgment he has to say why he is speaking at all, to a people who had told the prophets to be quiet. So verses 3–8 are a run of questions, each with an answer nobody would dispute, which he uses “to establish his right and duty to prophesy.” They end in two statements. The Lord does nothing without first revealing it to His servants the prophets, and a prophet who has heard Him can no more keep silent than a man can hear a lion and not be afraid. Telling the prophets to be quiet, the questions say, will not hold the judgment back (see the note on verse 8).

  With that settled, Amos “is able to proclaim without reserve” what is coming (verses 9–15). Foreign palaces are called to look at Samaria’s palaces; the sentence is passed on them; and after a fresh summons in verse 13 the Lord names what will fall, the altars of Beth-el and the great houses. The verb of the opening charge comes back there. “Punish” in verse 2 and “visit” in verse 14 are one Hebrew word (see the note on verse 2).

sections:
  - range: 1-2
    heading: Known, and therefore accountable
    plain: |
      Hear this word that the LORD has spoken against you, children of Israel, against the whole family I brought up out of the land of Egypt: Of all the families of the earth I have known only you. That is why I will punish you for all your iniquities.
  - range: 3-8
    heading: Why the prophet must speak
    plain: |
      Do two walk together unless they have arranged to meet? Does a lion roar in the forest when it has no prey? Does a young lion cry out from its den when it has caught nothing? Does a bird fall into a snare on the ground when no bait has been set for it? Does anyone take up a snare from the ground when it has caught nothing at all? Is a trumpet blown in a city and the people are not afraid? Does disaster come to a city unless the LORD has done it? Surely the Lord GOD does nothing without revealing His secret to His servants the prophets. The lion has roared; who will not fear? The Lord GOD has spoken; who can do anything but prophesy?
  - range: 9-12
    heading: Witnesses called, and the sentence on Samaria
    plain: |
      Proclaim it to the palaces of Ashdod and the palaces of the land of Egypt: Gather on the mountains of Samaria, and see the great tumults within her and the oppressed in her midst. They do not know how to do right, says the LORD, these who store up violence and robbery in their palaces. Therefore the Lord GOD says: An adversary will be all around the land. He will bring down your strength, and your palaces will be plundered. The LORD says: As a shepherd takes two legs or a piece of an ear out of the lion’s mouth, so will the children of Israel who dwell in Samaria be taken out, in the corner of a bed and in Damascus in a couch (the note on verse 12 gives the ways this last phrase is read).
  - range: 13-15
    heading: The altar and the great houses
    plain: |
      Hear, and testify against the house of Jacob, says the Lord GOD, the God of hosts: On the day I visit the transgressions of Israel upon him, I will also visit the altars of Beth-el. The horns of the altar will be cut off and fall to the ground. I will strike the winter house together with the summer house; the houses of ivory will perish, and the great houses will come to an end, says the LORD.

notes:
  - ref: 2
    phrase: You only have I known of all the families of the earth
    kind: words
    title: Known, and therefore punished
    body: |
      “Known” here is the language of choosing, and probably of covenant, and the verse makes that choosing the reason for the punishment. The verb is used here of the Lord’s knowing “of Israel as chosen people,” as it is in “I did know thee in the wilderness” ([[Hosea 13:5]]). The word “may often be related to covenantal language,” and this verse is given as an example beside the Lord’s word for Abraham, “For I know him” ([[Gen. 18:19]]). The notes at [[Hosea 2:20]] and [[Hosea 13:4]] say more about the verb.

      The surprise is the “therefore.” Israel expected its election to protect it. Instead, “the consequence of this special relationship with God is a unique sense of responsibility and therefore a unique judgment.” Put in a line, being the covenant people “would make their punishment the heavier.” Israel’s covenants “required an even higher awareness and practice of the ethical standard” than the treaties that bound the nations judged in chapters 1–2.

      “Punish” is more literally “visit upon,” and in verse 14 the King James has “visit” twice for the same Hebrew verb. So the sentence announced here is carried out by name at the end of the chapter: “in the day that I shall visit the transgressions of Israel upon him I will also visit the altars of Beth-el.”
    sources: [bdb, sc-knowhy-205, spencer-remnant, bd-amos, matson-amos-kinship, lds-scriptures]

  - ref: 3
    phrase: except they be agreed
    kind: words
    title: Two who have arranged to meet
    body: |
      “Agreed” translates a verb that means to meet by appointment, so the question is about a planned meeting more than about two people being of one mind. Its sense in this verse is “meet by appointment,” and modern translations follow: “unless they have made an appointment,” “unless they have agreed to meet.”

      The verse does not say who the two are. One reading takes them as the Lord and Israel: “It is necessary, if they are to walk together, for them to be in agreement.” The question is the first of a series, and the note on verse 8 says where the series goes.
    sources: [bdb, oshb-wlc, nrsvue, esv, ot-manual-8]

  - ref: 6
    phrase: shall there be evil in a city, and the LORD hath not done it?
    kind: words
    title: Evil in a city is disaster
    body: |
      “Evil” here is calamity, not wickedness. The Hebrew noun is glossed “evil, misery, distress, injury,” and modern translations make the sense plain: “Does disaster befall a city,” “Does disaster come to a city.” The question stands beside the one about the trumpet and the frightened city, and it asks who is behind what the city fears. The site’s note at [[Isa. 45:7]] takes up the same difficulty and quotes this verse.

      The Joseph Smith Translation changes one word in the question, reading “known” where the King James has “done,” so that it asks whether calamity can come to a city without the Lord’s knowing of it.
    sources: [bdb, oshb-wlc, nrsvue, esv, lds-scriptures]

  - ref: 7
    phrase: Surely the Lord GOD will do nothing
    kind: prophets
    title: Warning comes before judgment
    body: |
      Verse 7 is about warning: the Lord does not bring a judgment on His people without first telling a prophet. Amos’s point was probably that Israel would not be destroyed before the Lord had made His intentions known to His prophets and the people had been warned to repent. The Joseph Smith Translation makes the order of events plainer by changing “but” to “until,” so that the Lord will do nothing until He reveals it. It is one of the book’s emphases: “the Lord speaks through His prophets in warning mankind.”

      Elder Wilford Woodruff preached from this verse at a conference on 10 September 1843, and the Church’s manuscript history records what he said: “whenever God was about to bring a judgment upon the world or accomplish any great work, the first thing he did was to raise up a Prophet, and reveal unto him the secret, and send him to warn the people so that they may be left without excuse.” He gave Noah and Lot as examples.

      Amos is shown such things himself later in the book. In the visions of [[Amos 7:1–6]] he sees locusts and fire before they come, and that he “would be privileged to preview God’s plans is in harmony with” this verse.
    sources: [scripture-helps-amos, lds-scriptures, bd-amos, jsp-history-e1-1727, sears-intercession]

  - ref: 7
    phrase: his secret
    kind: words
    title: The secret and the Lord’s council
    body: |
      “Secret” translates *sôd*, a word for a council and for the counsel taken in it, and many scholars read the verse as saying that prophets are let into the Lord’s council. Its senses are “council, counsel”: first a “circle of familiar friends,” and then, where this verse belongs, “secret counsel, which may be revealed.” The word can also be rendered “council,” “counsel,” or “plan,” and one modern translation has “without revealing his plan.”

      Jeremiah uses the same word for the place where a true prophet has stood: “who hath stood in the counsel of the LORD, and hath perceived and heard his word?” ([[Jer. 23:18]]; see the note there). Amos’s line has been read as “a summary principle” of which Jeremiah’s is one of the “explicit examples”: “God reveals the sôd (secret plan) of his sôd (divine council) to his prophets.” On this reading the *sôd* of the verse “is not just confidential instruction delivered by God but also the manifestation of God’s heavenly court.”

      This is a reading, held by “many scholars,” and it is not certain: the council “may also be implied” here, “although this is less clear.” What the verse plainly says is narrower: the Lord’s plan is told to His servants before it is carried out.
    sources: [bdb, scripture-helps-amos, niv, hamblin-sod, smoot-council-hebrew-bible, sc-knowhy-832, lds-scriptures]

  - ref: 8
    phrase: The lion hath roared, who will not fear?
    kind: structure
    title: Where the questions lead
    body: |
      The questions of verses 3–6 lead to this verse, and its point is that Amos has no choice but to speak. They are “a chain-like series of similes drawn from life,” and “the examples are evidently selected with the view of showing that the utterances of the prophet originate with God.” Verse 8 puts the conclusion as two more questions of the same kind. The lion has roared, and who will not fear? The Lord GOD has spoken, and who can but prophesy?

      His hearers needed the argument because they had “commanded the prophets, saying, Prophesy not” ([[Amos 2:12]]), and the priest of Beth-el will say the same to Amos himself ([[Amos 7:13]]). The questions are there “to emphasize that silencing the prophets would not spare Israel from judgment.”

      The lion has been heard already. The book opened with “The LORD will roar from Zion” ([[Amos 1:2]]), which puts before the reader “the image of a roaring lion ready to pounce.” On one reading the lion of verse 4, which roars because it has its prey before it, “is Jehovah” as well.
    sources: [keil-amos, scripture-helps-amos, vandyke-ogden-twelve, lds-scriptures]

  - ref: 9
    phrase: Publish in the palaces at Ashdod, and in the palaces in the land of Egypt
    kind: history
    title: Foreign palaces called as witnesses
    body: |
      The Lord calls the ruling houses of two foreign peoples to come and look at Samaria, and then to testify. Ashdod was a Philistine city, already judged in [[Amos 1:8]], and Egypt is the land Israel was brought out of in verse 1. On one older reading Ashdod is named “as a chief city of the uncircumcised, who were regarded by Israel as godless heathen.”

      The summons goes from palaces to palaces. The English word comes four times in verses 9–11, and “the Hebrew word for palace here is the same one Amos used” for the buildings that fire devours in the oracles against the nations in chapters 1–2. The word means “citadel, castle, palace”; modern translations have “strongholds,” and “high-rise” has been suggested. These are the houses of the rich and powerful. On the same older reading that is why palaces are summoned, since “only the inhabitants of the palace could pronounce a correct sentence as to the mode of life commonly adopted in the palaces of Samaria.” What the visitors will find is tumult, oppression, and palaces where “violence and robbery” are stored up as other houses store goods.

      Verse 13 takes up the summons again. The King James has “testify in the house of Jacob,” but the verb here means to “protest, affirm solemnly, warn,” and modern translations read “testify against the house of Jacob.” The verse does not say who is addressed. On the reading given above it is the same foreign witnesses, who “should bear witness against Israel from what they have heard.”
    sources: [keil-amos, bdb, matson-amos-kinship, nrsvue, lds-scriptures]

  - ref: 11
    phrase: An adversary there shall be even round about the land
    kind: history
    title: The adversary is not named
    body: |
      The chapter says that an enemy will surround the land and plunder Samaria, and it does not say who the enemy is. The enemy who came was Assyria. Samaria, the capital that Omri had built on a strong hill, held out through a siege of three years, and then “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]). That was in 722 B.C.
    sources: [lds-scriptures, bd-samaria, scripture-helps-amos]

  - ref: 12
    phrase: As the shepherd taketh out of the mouth of the lion two legs, or a piece of an ear
    kind: symbol
    title: A rescue that proves the loss
    body: |
      What the shepherd rescues is evidence that the sheep is gone, and on one reading that is the picture of what will be left of Samaria. The law made a man answerable for an animal left in his keeping, with an exception: “If it be torn in pieces, then let him bring it for witness, and he shall not make good that which was torn” ([[Ex. 22:13]]). A keeper “could be absolved of personal blame provided there was physical evidence that the livestock was killed by a beast of prey.” Two legs or a piece of an ear were that evidence.

      Read against that law, the verse may turn a hope into a threat. Israel knew the promise that a remnant would be saved, and “one possible reading suggests that Amos uses the remnant theme against Israel”: the bits of furniture in the prophecy “serve not as symbols of Israel’s survival but as tokens of their eradication.” Amos comes back to the remnant in [[Amos 5:14–15]], and the book’s last chapter says that the destruction will not be total ([[Amos 9:8]]).

      The last phrase of the verse is hard, and translations say so: “The meaning of the Hebrew for this phrase is uncertain.” The King James reads a place name, “in Damascus in a couch.” But the word’s pointing (the vowel marks added to the Hebrew consonants) and its meaning are both doubtful. The ancient versions all read “Damascus,” “yet this hardly suitable in context,” and others take the word as a fabric, “damask, silk.” One modern translation has the people rescued “with the corner of a couch and part of a bed.” On any of these the furniture is the point. “Couches and beds were luxury items in the world of the Old Testament and were accessible only to the affluent,” and the “beds of ivory” come back in [[Amos 6:4]].
    sources: [lds-scriptures, spencer-remnant, matson-amos-kinship, bdb, nrsvue, niv]

  - ref: 14
    phrase: the horns of the altar shall be cut off
    kind: symbol
    title: The horns of the altar at Beth-el
    body: |
      The horns were the raised points at the four corners of an altar, where the blood of the sin offering was put and where a fugitive could take hold. They were “the loftiest points of the altar,” and Adonijah, afraid of Solomon, “caught hold on the horns of the altar” ([[1 Kgs. 1:50]]).

      The altar is the one at Beth-el, which the book later calls “the king’s chapel” ([[Amos 7:13]]); the place is taken up at [[Amos 4:4]]. Second Kings records the end of that altar. Josiah came to “the altar that was at Beth-el, and the high place which Jeroboam the son of Nebat, who made Israel to sin, had made,” and “both that altar and the high place he brake down” ([[2 Kgs. 23:15]]).
    sources: [bd-altar, lds-scriptures]

  - ref: 15
    phrase: the winter house with the summer house; and the houses of ivory
    kind: history
    title: Four kinds of houses
    body: |
      The last verse lists the houses of the rich in Samaria and says that all of them will go: the winter house, the summer house, the houses of ivory, and the great houses. Jeremiah shows a king sitting “in the winterhouse in the ninth month” ([[Jer. 36:22]]), with a fire on the hearth. The “houses of ivory” have a precedent in the record of Ahab of Israel and “the ivory house which he made” ([[1 Kgs. 22:39]]).

      The list is aimed at one class. Amos names consequences “that would have meant little to the marginalized but would have been threatening to the elite,” because “the wealth and prestige the elite Israelites acquired through exploitation would be the focus of the Lord’s destruction.”
    sources: [matson-amos-kinship, bdb, lds-scriptures]

christ: |
  The Savior speaks of knowing His own people as verse 2 speaks of the Lord’s knowing Israel: “I am the good shepherd, and know my sheep, and am known of mine” ([[John 10:14]]). The verb there “may have a covenantal meaning here, as it does elsewhere in the scriptures,” and the example given is this chapter’s second verse. The word has another side in His sermon. To those who call Him Lord and do not do the Father’s will He says, “I never knew you; depart from me, ye that work iniquity” ([[3 Ne. 14:23]]).

  He also stands in the pattern of verse 7. The sermon on that verse quoted in its note goes on from Noah and Lot to a third case: “Jesus Christ testified to the Jews of the things that awaited them as a nation,” the fall of Jerusalem and their scattering, and they did not believe it.

explore: |
  - **Those who stood in the council.** [[Jer. 23:16–22]], read beside verse 7. The *Interpreter* article “The Sôd of YHWH and the Endowment” sets this verse beside Micaiah, Isaiah, and Jeremiah.
  - **Amos sees before it happens.** The four visions of [[Amos 7:1–9]] and [[Amos 8:1–3]], where the prophet is shown what the Lord is about to do.
  - **The remnant.** [[Amos 5:14–15]], [[Amos 6:9–10]], and [[Amos 9:1–4]], the other places where Amos speaks of what will be left.
  - **Chosen, and held to more.** [[Deut. 7:6]] and [[Luke 12:47]], which a modern translation’s cross-references set beside verse 2.

