chapter: 7
title: A Plumbline in the Midst of Israel
tagline: Amos sees locusts and then fire, and pleads both away. He sees a plumbline and says one word. Then the priest of Beth-el orders him home, and Amos tells how he was called.
when: 'About 760–750 B.C.; the northern kingdom of Israel under Jeroboam II'

setting: |
  The last part of the book begins here. Chapters 7–9 are “Amos’s visions of coming judgment and a message of hope that God would one day restore and bless His people.” There are five visions, and three of them are in this chapter: “a swarm of locusts,” “devouring fire,” and the plumbline. The fourth follows at [[Amos 8:1–3]] and the fifth at [[Amos 9:1]]. The first four can be read as two pairs set against each other; the notes on verses 2 and 8 take up that reading.

  Between the third and fourth visions is a story about Amos, told in the third person. It takes place at Beth-el, which the first Jeroboam chose as a place “to set up the calf worship.” The king is now Jeroboam II, “the ablest of the kings of Israel, and the most successful in war”; the prosperity of his reign is described at [[Amos 1:1]]. Amos was from Judah, and the priest tells him to go back where he came from.

  In two verses the Joseph Smith Translation changes “The LORD repented”; the note on verse 3 gives the reading.

thread: |
  The chapter has two halves, and in both the question is whether the prophet will go on speaking.

  In verses 1–9 he speaks to the Lord. Amos sees locusts strip the land and cries “forgive.” He sees fire and cries “cease.” Each time the answer is “It shall not be.” In the third vision the Lord asks the question, Amos answers with a single word, and the Lord pronounces sentence: “I will not again pass by them any more.” This time Amos does not plead.

  In verses 10–17 he speaks to Israel, and a man tells him to stop. Amaziah reports him to the king and orders him out of the country: “prophesy not again any more at Beth-el.” Amos answers that prophesying was never his trade. The LORD took him from the flock and said, “Go, prophesy unto my people Israel.” He quotes the priest’s “Prophesy not” back to him, answers it with “Therefore thus saith the LORD,” and ends on the sentence Amaziah had reported as treason: “Israel shall surely go into captivity forth of his land.”

  The two halves can be read as echoes of each other. On this reading the Lord at last refuses to hear more pleading, and His refusal is “an ironic echo of the Israelites who told Amos” to prophesy no more.

sections:
  - range: 1-3
    heading: The locusts
    plain: |
      This is what the Lord GOD showed me. He was forming locusts just as the late growth began to come up, the growth that follows the king’s mowing. When they had finished eating the grass of the land, I said, “O Lord GOD, forgive, I beg you! How can Jacob stand? He is so small.” The LORD relented about this. “It shall not be,” said the LORD.
  - range: 4-6
    heading: The fire
    plain: |
      This is what the Lord GOD showed me. The Lord GOD was calling for a judgment by fire. It devoured the great deep and ate up a part. Then I said, “O Lord GOD, stop, I beg you! How can Jacob stand? He is so small.” The LORD relented about this. “This also shall not be,” said the Lord GOD.
  - range: 7-9
    heading: The plumbline
    plain: |
      This is what He showed me. The Lord was standing on a wall built with a plumbline, and a plumbline was in His hand. The LORD said to me, “Amos, what do you see?” I said, “A plumbline.” Then the Lord said, “See, I am setting a plumbline in the middle of my people Israel. I will not pass them by again. The high places of Isaac will be made desolate, the sanctuaries of Israel will be laid waste, and I will rise against the house of Jeroboam with the sword.”
  - range: 10-13
    heading: The priest of Beth-el
    plain: |
      Amaziah, the priest of Beth-el, sent word to Jeroboam king of Israel: “Amos has conspired against you in the middle of the house of Israel. The land cannot bear all his words. This is what Amos says: Jeroboam will die by the sword, and Israel will certainly be taken captive out of its own land.” And Amaziah said to Amos, “Seer, go, get away to the land of Judah. Earn your bread there, and prophesy there. But never prophesy at Beth-el again, for it is the king’s sanctuary and the king’s court.”
  - range: 14-17
    heading: Amos answers
    plain: |
      Amos answered Amaziah, “I was no prophet, and no prophet’s son. I was a herdsman, and I tended sycomore figs. The LORD took me from following the flock, and the LORD said to me, ‘Go, prophesy to my people Israel.’ Now hear the word of the LORD. You say, ‘Do not prophesy against Israel, and do not preach against the house of Isaac.’ Therefore this is what the LORD says: Your wife will be a harlot in the city, your sons and your daughters will fall by the sword, and your land will be divided up by a measuring line. You yourself will die in an unclean land, and Israel will certainly go into exile away from its land.”

notes:
  - ref: 1
    phrase: the latter growth after the king’s mowings
    kind: history
    title: Locusts on the second growth
    body: |
      Amos dates the locusts by the farming year, and what the date means is not certain. The “latter growth” probably means the “after-growth,” the “spring-crop” that comes up after a first cutting. The “mowings” are that first cutting, and the verse calls it the king’s.

      Read literally, the king has taken the early hay, and what the locusts eat is the people’s share. But “nothing is known of the existence of any right or prerogative on the part of the kings of Israel” to the first crop, and a plague which fell “upon the people alone, and not at all upon the king” would be “at variance with the meaning of this and the following visions.” The line has therefore been read as a figure: “The king, who has had the early grass mown, is Jehovah; and the mowing of the grass denotes the judgments which Jehovah has already executed upon Israel.” On this reading those judgments are the famine, drought and blight of [[Amos 4:6–10]], and the second growth is the prosperity that came back after them. That is one commentator’s reading. The verse itself does not explain the phrase.
    sources: [bdb, keil-amos]

  - ref: 2
    phrase: 'by whom shall Jacob arise? for he is small'
    kind: scripture
    title: Amos pleads for Israel
    body: |
      Amos answers the vision by speaking to the Lord for the people. Prophets carry the Lord’s word to Israel. They also engage in “intercession, that is, speaking to God in behalf of others in order to defend or assist them.” Samuel counted it a duty: “God forbid that I should sin against the LORD in ceasing to pray for you” ([[1 Sam. 12:23]]). The two best-known scenes are Abraham asking for Sodom ([[Gen. 18:23–33]]) and Moses after the golden calf ([[Ex. 32:11–14]]), and the notes there take them up.

      The plea is short. “Forgive” and “cease” are both commands in Hebrew, which suggests “Amos’s urgency.” The reason he gives is a question, which a modern translation renders “How can Jacob stand?” and “He is so small!” “Small” is “perhaps best understood as a relative description”: however powerful the kingdom was, it could not survive what the vision showed. What Amos leaves out matters as much. “Amos does not appeal to the people’s righteousness or repentance,” and the rest of the book gives little evidence of either. Readers divide over whether the question is an appeal of pity or a claim that destroying Israel would break the Lord’s covenant promises. It may be both.

      Between the two visions one word changes: “forgive” becomes “cease.” On one reading the change is a retreat, because the first word “gets back to the root problem of sin,” while the second “targets only the punishment and leaves sin unresolved.” On this reading Amos asks for less the second time. He is still heard.

      The theme page [By Whom Shall Jacob Arise?](/amos/themes/jacob-arise/) follows the pleading through the visions to the book's last word.
    sources: [sears-intercession, nrsvue, lds-scriptures]

  - ref: 3
    phrase: The LORD repented for this
    kind: words
    title: The LORD relented
    body: |
      “Repented” here means that the Lord held back the judgment, not that He had done wrong. The Hebrew verb has a range of meanings, among them “to regret,” “to feel sorrow or sympathy,” “to comfort,” and “to relent or forebear,” and in these two verses “the Lord relented” may be the better fit. A modern translation has “relented concerning this.” Elsewhere scripture says that God is not “the son of man, that he should repent” ([[Num. 23:19]]).

      The Joseph Smith Translation “revises these verses to clarify that the Lord did not repent.” Verse 3 becomes “And the Lord said, concerning Jacob, Jacob shall repent for this, therefore I will not utterly destroy him, saith the Lord,” and verse 6 is changed the same way. The change belongs to a pattern. In several Old Testament passages where the King James Version says that God repents, the revision rewrites the sentence “so that some other party becomes the subject of the verb.” The two changes have been read as “a response to an idiosyncrasy in the KJV and not as a restoration of original text.”

      The notes on [[Gen. 6:6]], [[Joel 2:13]] and [[Hos. 11:8]] say more about the verb.
    sources: [sears-intercession, nrsvue, scripture-helps-amos, lds-scriptures]

  - ref: 4
    phrase: it devoured the great deep, and did eat up a part
    kind: symbol
    title: Fire on the great deep
    body: |
      The second vision is a fire that burns up the great deep and then turns to something the verse calls only “the portion.” To “contend by fire” is, in a modern translation, to call for “judgment by fire.” It is generally taken as a severer judgment than the locusts. “The great deep” is the phrase used of the Flood, when “all the fountains of the great deep” were broken up ([[Gen. 7:11]]).

      What the fire reaches next is read in more than one way. A modern translation takes the portion as “the land.” The ancient Greek version has “the Lord’s portion,” which fits the verse that calls Jacob the Lord’s own portion ([[Deut. 32:9]]): on that reading the fire has begun on Israel itself. The deep is “presumably the ocean,” and the whole vision has been read as “symbolic of the partially destructive wars that Israel was later involved in.”

      These are readings. Nothing in the chapter interprets the first two visions. Amos sees enough to cry “cease,” and the fire is called back as the locusts were.
    sources: [nrsvue, lxx-rahlfs, keil-amos, ot-manual-8, lds-scriptures]

  - ref: 7
    phrase: with a plumbline in his hand
    kind: symbol
    title: The plumbline
    body: |
      A plumbline is a builder’s test of whether a wall stands true, and in the third vision the Lord holds one to Israel. It is a weighted cord that hangs straight down, “a tool used to make a vertical reference line during construction.” The wall in the vision was built with one. Held to the nation, it shows that “Israel’s behavior is not aligned with God’s commands,” and verse 9 says what will come down.

      Since 1965 several interpreters have proposed that the Hebrew word means “tin” here and not a plumbline, “though the traditional translation still has its defenders.” The vision does not turn on the answer: “The overall meaning of the third vision is clear in either case.”
    sources: [scripture-helps-amos, sears-intercession]

  - ref: 8
    phrase: I will not again pass by them any more
    kind: structure
    title: Why Amos does not plead the third time
    body: |
      In the third vision Amos answers the Lord’s question and makes no plea, and the Lord’s sentence can be read as refusing one. The first two visions run the same way: a disaster, a plea, a reprieve. The third and the fourth ([[Amos 8:1–3]]) run another way. The Lord shows an object and asks, “Amos, what seest thou?” Amos names it, and from there “God does all the talking.” A count of the Hebrew words each speaks to the other shows the turn. In the first two visions Amos speaks ten words each time, and the Lord two and then four. In the third Amos speaks one and the Lord twenty-six.

      The sentence itself closes the door. To “pass by” is usually to walk past, but the verb has figurative uses, “one of which is the forgiving of sin.” Micah praises the God who “passeth by the transgression of the remnant of his heritage” ([[Micah 7:18]]). To forgive or pardon is the likely sense here, and a modern translation has “I will spare them no longer.” The words “again” and “any more” look back. They “presuppose that forgiveness was granted previously,” in the two visions just told. On this reading the Lord refuses more than pardon. He “is also denying any new attempts to intercede.” This reading rests on how the four visions are arranged; the text does not state it.
    sources: [sears-intercession, nrsvue]

  - ref: 9
    phrase: I will rise against the house of Jeroboam with the sword
    kind: history
    title: The shrines and the king’s house
    body: |
      The third vision names what will fall: Israel’s places of worship and its royal family. Beth-el and Gilgal are described at [[Amos 4:4]]. “Isaac” stands where a reader expects “Jacob.” Amos uses the name for the nation only here and in verse 16, and both times it is paired with “Israel.”

      “The house of Jeroboam” is the dynasty. Jeroboam II was “of the dynasty of Jehu,” and Kings tells how it ended. Jeroboam himself “slept with his fathers” ([[2 Kgs. 14:29]]). His son Zachariah reigned “six months” ([[2 Kgs. 15:8]]), and then “Shallum the son of Jabesh conspired against him, and smote him before the people, and slew him” ([[2 Kgs. 15:10]]). Kings adds that this closed the term promised to Jehu, whose sons were to reign “unto the fourth generation” ([[2 Kgs. 15:12]]). The end of the kingdom itself is told at [[Amos 3:11]].
    sources: [lds-scriptures, oshb-wlc, bd-jeroboam]

  - ref: 10
    phrase: Amos hath conspired against thee
    kind: history
    title: Amaziah’s report to the king
    body: |
      The priest of Beth-el hears the third vision as treason and reports it to the king. That may be why the story stands where it does. It “may have been placed after the third vision,” whether originally or by a later editor, because it “describes the negative reaction to Amos’s announcement in the third vision.”

      Beth-el had had priests of the king’s making since the first Jeroboam. When that king set up the calves he “made priests of the lowest of the people, which were not of the sons of Levi” ([[1 Kgs. 12:31]]), and “he placed in Beth-el the priests of the high places which he had made” ([[1 Kgs. 12:32]]).

      The report is close to what Amos had said. Verse 9 has the Lord rising against “the house of Jeroboam,” and Amaziah’s version names the king himself. He introduces it with “thus Amos saith,” where Amos will introduce his answer with “thus saith the LORD” (verse 17). The chapter records no reply from the king.
    sources: [sears-intercession, lds-scriptures]

  - ref: 13
    phrase: it is the king’s chapel, and it is the king’s court
    kind: history
    title: The king’s sanctuary
    body: |
      Amaziah’s reason for sending Amos away is that Beth-el belongs to the king. “Chapel” translates a Hebrew word for a “sacred place, sanctuary.” A modern translation has “it is the king’s sanctuary, and it is a temple of the kingdom.” Beth-el’s older history is told at [[Amos 4:4]]. The priest claims it for the king.

      “Seer” in verse 12 is not an insult in itself. The word stands elsewhere as a synonym of “prophet” and as the title of named prophets, Gad among them. But “there eat bread” is, in a modern translation, “earn your bread there,” and the next note takes up how Amos answers that.
    sources: [bdb, nrsvue]

  - ref: 14
    phrase: I was no prophet, neither was I a prophet’s son
    kind: words
    title: No prophet, and no prophet’s son
    body: |
      Amos denies that prophecy is his trade. He does not deny that he prophesies. He “repudiates the insinuation that he practises prophesying as a calling or profession, by which he gets his living.” A “prophet’s son” is not a prophet’s child. “Son” in Hebrew can mean a “member of a guild, order or class,” and the “sons of the prophets” were “bands of prophets” who lived together “for instruction and worship under Samuel, Elijah, and Elisha” (see [[2 Kgs. 2:3]]). Amos had not come from among them: “some inspired prophets had received no training in the schools.”

      The Hebrew sentence has no verb. It is three words (not, prophet, I), and the tense is the translator’s. The King James Version and the ancient Greek version supply “was”: he was no prophet until the Lord took him. A modern translation prints “I am no prophet” and puts “was” in its margin: he is not, even now, the kind of prophet Amaziah means. The next verse has verbs, and they are plain. “The LORD took me,” and “the LORD said unto me, Go, prophesy.”
    sources: [keil-amos, bdb, bd-schools-of-the-prophets, oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 14
    phrase: an herdman, and a gatherer of sycomore fruit
    kind: words
    title: A herdsman and a tender of sycomore figs
    body: |
      Amos names two kinds of farm work, and neither word says how well off he was. “Herdman” here is not the word of [[Amos 1:1]]. It is formed from the word for cattle, “a herdsman of oxen,” and is taken more broadly of a shepherd, since the next verse has him following “the flock.” The sycomore is the “fig-mulberry,” and the tree that English calls a sycamore “is a maple.” The verb used of it has been defined as “gather figs, tend fig-trees,” and was “probably properly to nip the sycamore fruit to fit it for eating.” A modern translation has “a dresser of sycamore trees.”

      Whether this was a poor man’s work or a landowner’s has been argued both ways. That he owned a plantation has often been inferred, but this “would by no means follow.” The word at 1:1 is also used of a king who raised sheep, as the note there says. He was “originally a shepherd and farmer,” and the text leaves the rest open. Either way he had a “calling, which afforded him a livelihood,” and from it “the Lord had called him away.”
    sources: [keil-amos, bdb, bd-sycomore, nrsvue, scripture-helps-amos]

  - ref: 17
    phrase: thou shalt die in a polluted land
    kind: history
    title: The sentence on Amaziah
    body: |
      Amos answers the order to be silent with a prophecy about the man who gave it. He first quotes the priest: “Thou sayest, Prophesy not.” The second verb, “drop not thy word,” is a figure for a prophet’s speech. The Hebrew word means to “drop, drip” and is used “especially of prophet,” and a modern translation has “do not preach.” Micah’s hearers used the same word: “Prophesy ye not, say they to them that prophesy” ([[Micah 2:6]]). Israel had been saying it to the prophets before Amaziah did ([[Amos 2:12]]).

      Then comes “Therefore thus saith the LORD.” The sentence tells what conquest will do to one household. His wife will be left to prostitution in the city, and his sons and daughters will be killed. His land will be “parceled out by line.” He himself, a priest, will die in what a modern translation calls “an unclean land.” The last clause widens the sentence to the nation: “Israel shall surely go into captivity forth of his land.” These are nearly the words Amaziah had reported to the king in verse 11.
    sources: [bdb, nrsvue]

christ: |
  The Lord who shows Amos these visions is Jehovah (see the note on [[Amos 4:13]]), and in the first two He is moved by a plea for a people whose righteousness is not mentioned. The prophet who pleads can be taken as a pattern of the Savior: Latter-day Saints may read such scenes “through a doctrinal lens that understands prophetic intercession as typological for the role of Jesus.” Scripture uses the same language of Him. He “ever liveth to make intercession for them” ([[Heb. 7:25]]). He is “the advocate with the Father, who is pleading your cause before him” ([[D&C 45:3]]), and His plea rests on “the sufferings and death of him who did no sin” ([[D&C 45:4]]): “Father, spare these my brethren that believe on my name” ([[D&C 45:5]]).

  Even so, “the rhetoric of advocacy does not force the conclusion that God, as judge and prosecutor, delights in punishing people.” The pleading scenes “are not really a fight to change God’s mind.” When prophets speak against a punishment, “they may actually personify God’s own desire to grant mercy.” At Sinai the Lord described Himself both ways, as “merciful and gracious, longsuffering,” and as One who “will by no means clear the guilty” ([[Ex. 34:6–7]]).

explore: |
  - **The other two visions.** [[Amos 8:1–3]], the basket of summer fruit, where a Hebrew wordplay joins the fruit to “the end”; and [[Amos 9:1–4]].
  - **Prophets who pleaded.** [[Gen. 18:23–33]]; [[Ex. 32:9–14]]; [[Num. 14:11–20]]; [[Hel. 11:3–18]].
  - **Prophets told not to plead.** [[Jer. 7:16]]; [[Jer. 15:1]]; [[Moro. 9:21]].
  - **Beth-el and its priests.** [[1 Kgs. 12:26–33]] and [[1 Kgs. 13]].
  - **“Prophesy not.”** [[Amos 2:12]].
  - **Intercession and the character of God.** The article “‘O Lord God, Forgive!’ Prophetic Intercession in Amos” reads the four visions together, and its last section sets them beside [[Moses 7:34–37]].

