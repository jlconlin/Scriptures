chapter: 4
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Amos prophesied under Uzziah of Judah and Jeroboam II of Israel'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The prophet Amos prophesied in the days of Uzziah, king of Judah (died about 740 B.C.), and Jeroboam Ⅱ, king of Israel (died about 750 B.C.).'
  - where: 'when'
    claim: 'The ministry is put at 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC), it appears these covenants had been disregarded not only by Israel’s neighbors, but by the Israelites themselves'
  - where: 'setting'
    claim: 'Amos was a shepherd from Judah whose ministry was in the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'He was a shepherd (Amos 1:1; 7:14) and a native of Tekoa, 12 miles south of Jerusalem, but his ministry was among those of the northern kingdom of Israel.'
  - where: 'setting'
    claim: 'The time was one of peace and prosperity'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Instead, the Israelites were enjoying an era of peace and prosperity (2 Kings 14:23–29).'
  - where: 'setting'
    claim: 'Chapters 3–6 are the warnings to the northern kingdom and the plea to repent'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 3–6: Warnings to the Northern Kingdom and Amos’s plea for the people to repent.'
  - where: 'setting'
    claim: 'Israel fell to Assyria in 722 B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Many of the people of Israel rejected the warnings of Amos and the other prophets, and they were conquered by the Assyrians in 722 BC.'
  - where: 'setting'
    claim: 'Samaria was the capital of Israel'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'ye kine [cows] of Bashan, that are in the mountain of Samaria [capital of Israel], which oppress the poor'
  - where: 'thread'
    claim: '“And I also” in verse 6 answers “for this liketh you” in verse 5: Israel loves its worship, and the Lord has tried every means of turning it'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'The strongly adversative וגם אני forms the antithesis to כן אהבתּם: Ye love to persist in your idolatry, and yet I have tried all means of turning you to me.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'The women are thrown out (passive), each one straight ahead'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NRSVUE'
    quote: 'and you shall be flung out into Harmon'
  - where: 'section 2 plain'
    claim: 'The thank offering of leavened bread is burned; “this liketh you” is what you love to do'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: 'for this is what you love to do,”'
  - where: 'section 3 plain'
    claim: '“Cleanness of teeth” is hunger; the thirsty cities stagger'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: '8 People staggered from town to town for water'
  - where: 'section 3 plain'
    claim: 'The palmerworm is a locust; the firebrand is a brand snatched from the fire'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NRSVUE'
    quote: 'the locust devoured your fig trees and your olive trees;'

  # ---- note 4:1 ----
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'Bashan lay east of the Jordan and was known for grain and cattle; Amos’s reference is symbolic and uncomplimentary'
    key: bd-bashan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bashan?lang=eng'
    quote: 'It was an area rich in grain production and known for its breed of cattle (Ps. 22:12), to which Amos made a symbolic and uncomplimentary reference (Amos 4:1–3).'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'The district east of Jordan'
    key: bd-bashan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bashan?lang=eng'
    quote: 'The district east of Jordan and north of Gilead, assigned to Manasseh'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'The verbs “which oppress,” “which crush,” “which say” are feminine plural participles (morphology Vqrfpa in the Open Scriptures text)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'הָ/עֹשְׁק֣וֹת'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'A modern translation addresses women outright and renders “masters” as husbands'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: 'you women who oppress the poor'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'NIV renders “masters” as husbands'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: 'and say to your husbands,'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'NRSVue renders “masters” as husbands'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NRSVUE'
    quote: 'who say to their husbands, “Bring something to drink!”'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'Treading on the poor is one of two dominant sins in Amos’s case, and 4:1 is the verse quoted for it'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'But two sins are dominant in his appeal to God for a swift judgment against Israel. First, the Israelites have turned from Jehovah to idolatry.'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'The second dominant sin, with 4:1 quoted'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Second, they have severely treaded upon the poor. “Hear this word, ye kine [cows] of Bashan'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: '4:1 stands in a list of grievances against the elite with 5:11, 5:12 and 8:4'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Amos airs a plethora of grievances against the elite of the Israelites that go against the covenants of kinship. Such grievances include oppressing the poor (Amos 4:1), crushing the needy (4:1), trampling the poor (5:11)'
  - where: 'note 4:1 “The cows of Bashan are the rich women of Samaria”'
    claim: 'Psalm 22:12 speaks of the strong bulls of Bashan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'Many bulls have compassed me: strong bulls of Bashan have beset me round.'

  # ---- note 4:2 ----
  - where: 'note 4:2 “Hooks, fishhooks, and the last of you”'
    claim: 'The first word for hook is doubtful and is cited in this sense only at Amos 4:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/6793.htm'
    quote: 'I. [צִנָּה] noun feminine apparently hook, or barb (of fishing-spear ?); — plural צִנּוֺת Amos 4:2'
  - where: 'note 4:2 “Hooks, fishhooks, and the last of you”'
    claim: 'The second word means thorn and so hook'
    key: bdb
    url: 'https://biblehub.com/hebrew/5518.htm'
    quote: 'II. [סִיר] noun [masculine] thorn, hook'
  - where: 'note 4:2 “Hooks, fishhooks, and the last of you”'
    claim: 'In the same spelling the word is the common word for a pot'
    key: bdb
    url: 'https://biblehub.com/hebrew/5518.htm'
    quote: '1. a. household utensil for boiling 2 Kings 4:38,39,40,41'
  - where: 'note 4:2 “Hooks, fishhooks, and the last of you”'
    claim: 'The Greek reads weapons and boiling caldrons'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/4.htm'
    quote: 'they shall take you with weapons, and fiery destroyers shall cast those with you into boiling caldrons.'
  - where: 'note 4:2 “Hooks, fishhooks, and the last of you”'
    claim: '“Posterity” may be posterity or, as others read, remnant'
    key: bdb
    url: 'https://biblehub.com/hebrew/319.htm'
    quote: 'd. concrete posterity (extension of usage noted above in Proverbs 24:20) Psalm 37:37; Psalm 37:38 … Amos 4:2; Amos 9:1; Ezekiel 23:25 (twice in verse) (according to others, in these four passages, remnant, residue)'
  - where: 'note 4:2 “Hooks, fishhooks, and the last of you”'
    claim: 'A modern translation keeps hooks and fishhooks and reads “the last of you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NRSVUE'
    quote: 'even the last of you with fishhooks.'
  - where: 'note 4:2 “Hooks, fishhooks, and the last of you”'
    claim: 'Verse 3 in a modern translation: out through breaches in the wall, each one straight ahead'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NRSVUE'
    quote: '3 Through breaches in the wall you shall leave,'

  # ---- note 4:3 ----
  - where: 'note 4:3 “The palace is a word no one can now translate”'
    claim: 'The Hebrew word occurs only here and its meaning is doubtful'
    key: bdb
    url: 'https://biblehub.com/hebrew/2038.htm'
    quote: '[הַרְמוֺן] noun masculine meaning dubious; text perhaps corrupt; only Amos 4:3'
  - where: 'note 4:3 “The palace is a word no one can now translate”'
    claim: 'The King James “palace” takes the word as the word for a citadel, which the lexicon calls improbable; the verb is better read as a passive'
    key: bdb
    url: 'https://biblehub.com/hebrew/2038.htm'
    quote: 'but read rather with Vrss as passive ׳וְהָשְׁל shall be cast) into Harmon; if text be sound, some locality must be meant, though the nature of the allusion is lost (AV, into the palace, treats הרמון improbable as = ארמון).'
  - where: 'note 4:3 “The palace is a word no one can now translate”'
    claim: 'The Greek reads a mountain'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/4.htm'
    quote: 'and ye shall be cast forth on the mountain Romman, saith the Lord.'
  - where: 'note 4:3 “The palace is a word no one can now translate”'
    claim: 'NRSVue leaves it as a place name'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NRSVUE'
    quote: 'and you shall be flung out into Harmon,'
  - where: 'note 4:3 “The palace is a word no one can now translate”'
    claim: 'NIV leaves it as a place name'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: 'and you will be cast out toward Harmon,”'

  # ---- note 4:4 ----
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'Bethel was one of the most sacred spots in Israel: Abraham’s altar and Jacob’s dream'
    key: bd-bethel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethel?lang=eng'
    quote: 'one of the most sacred spots in Israel. Here Abraham built his altar on his first arrival in Canaan (Gen. 12:8; 13:3); here Jacob had his dream, set up a pillar, and gave the place its name (28:19).'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'Jeroboam set up the calf worship at Bethel'
    key: bd-bethel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethel?lang=eng'
    quote: 'Jeroboam selected it as one of the places in which to set up the calf worship (1 Kgs. 12:29–32; 2 Kgs. 10:29; Amos 7:13).'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'The Jeroboam who set up the calves was the first king of the divided kingdom'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Son of Nebat (1 Kgs. 11:26–14:20); the first king of divided kingdom of Israel'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'Amos prophesied under Jeroboam II, a later king of the same name'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Jeroboam Ⅱ, of the dynasty of Jehu, the ablest of the kings of Israel, and the most successful in war (2 Kgs. 13:13; 14:16, 23, 27–29; 15:1, 8). Amos and Hosea prophesied during his reign'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'Gilgal was Israel’s first camp after crossing the Jordan'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: 'The place near Jericho at which the Israelite camp was made on the first night after crossing the Jordan (Josh. 4:19; 5:10; 10).'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'Gilgal was sacred in Saul’s time and later a place of idolatrous worship'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: 'It was a sacred city in the time of Saul (1 Sam. 10:8; 11:14–15; 13:4, 15; 15:12–33); but later it was the scene of idolatrous worship (Hosea 4:15; 9:15; 12:11; Amos 4:4; 5:5).'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'Jeroboam’s calves were made so that the people would not go up to Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'Whereupon the king took counsel, and made two calves of gold, and said unto them, It is too much for you to go up to Jerusalem: behold thy gods, O Israel, which brought thee up out of the land of Egypt.'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'The verb “transgress” in 4:4 has the consonants pšʿ, the root of the noun “transgressions”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'וּ/פִשְׁע֔וּ'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'The verb here means to transgress against God'
    key: bdb
    url: 'https://biblehub.com/hebrew/6586.htm'
    quote: '2 transgress against God, absolute Isaiah 1:28; Isaiah 46:8; Isaiah 48:8; Isaiah 53:12 (twice in verse); Hosea 14:10; Amos 4:4 (twice in verse)'
  - where: 'note 4:4 “Beth-el and Gilgal, and an invitation to sin”'
    claim: 'The noun of the refrain in chapters 1–2 is from this root, is defined as an offence concerning persons and property, and is used of Israel at 3:14'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The Hebrew term translated here as “transgression” is pš‘ (פשע), which is defined as “an offence concerning persons and property.” [25] Amos employs this same noun when he speaks for the Lord'

  # ---- note 4:5 ----
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'The Church’s footnote: the Hebrew for “years” is days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/4?lang=eng'
    quote: '“years”: HEB days.'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'The law of the third-year tithe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: 'At the end of three years thou shalt bring forth all the tithe of thine increase the same year, and shalt lay it up within thy gates:'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'The law called for leavened bread with a thank offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Besides the cakes, he shall offer for his offering leavened bread with the sacrifice of thanksgiving of his peace offerings.'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'No leaven was to be burned on the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/2?lang=eng'
    quote: 'No meat offering, which ye shall bring unto the Lord, shall be made with leaven: for ye shall burn no leaven, nor any honey, in any offering of the Lord made by fire.'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'No leaven was allowed in offerings made by fire'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'No leaven was allowed during the Passover Feast (Ex. 12:15, 19; 13:7; Deut. 16:4) or in offerings made to God with fire (Ex. 29:2; Lev. 2:11; 7:12; Num. 6:15).'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'The verb “offer” means to offer by burning'
    key: bdb
    url: 'https://biblehub.com/hebrew/6999.htm'
    quote: 'make sacrifices smoke, offer them by burning'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'The Greek reads “every third day”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/4.htm'
    quote: 'and ye brought your meat-offerings in the morning, and your tithes every third day.'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'NRSVue reads “every three days” and “for so you love to do”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NRSVUE'
    quote: 'your tithes every three days;'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'NRSVue: “for so you love to do”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NRSVUE'
    quote: 'for so you love to do, O people of Israel!'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'NIV keeps “years,” reads “Burn leavened bread,” and “brag about your freewill offerings”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: '5 Burn leavened bread(P) as a thank offering'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'NIV: the freewill offerings are bragged about'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: 'and brag about your freewill offerings(Q)—'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'NIV keeps “every three years”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: 'your tithes(N) every three years.(O)'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'On the reading “days,” Amos exaggerates to show their zeal'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'Amos is speaking hyperbolically, to depict the great zeal displayed in their worship'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'The leavened loaves went to the priest and the meal, not the altar'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'The latter, however, were not to be placed upon the altar, but one of them was to be assigned to the priest who sprinkled the blood, and the rest to be eaten at the sacrificial meal.'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'One reading: they burned leavened loaves too, to offer as much as possible'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'but that they burned some of the leavened loaves as well, in order to offer as much as possible to God.'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'A freewill offering was by nature unprompted'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'the very peculiarity of which consisted in the fact that they had no other prompting than the will of the offerer'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'It has been inferred that northern worship generally followed the Mosaic law'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'It is also evident from the whole account, that the worship in the kingdom of the ten tribes was conducted generally according to the precepts of the Mosaic law.'
  - where: 'note 4:5 “Four offerings, each one overdone”'
    claim: 'The Church’s footnote on “free” gives the law of the freewill offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/4?lang=eng'
    quote: '“free”: Lev. 22:18 (18–21).'

  # ---- note 4:6 ----
  - where: 'note 4:6 “Five warnings with one refrain”'
    claim: '“Cleanness of teeth” is explained by “want of bread”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'Cleanness of teeth is explained by the parallel "want of bread." The first chastisement, therefore, consisted in famine'
  - where: 'note 4:6 “Five warnings with one refrain”'
    claim: 'A modern translation renders it “empty stomachs”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%204&version=NIV'
    quote: '6 “I gave you empty stomachs in every city'
  - where: 'note 4:6 “Five warnings with one refrain”'
    claim: 'Blight is threatened in Deuteronomy 28:22'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'The first is threatened in Deuteronomy 28:22, against despisers of the commandments of God'
  - where: 'note 4:6 “Five warnings with one refrain”'
    claim: 'Deuteronomy 28:22 has blasting and mildew together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'and with the sword, and with blasting, and with mildew; and they shall pursue thee until thou perish.'
  - where: 'note 4:6 “Five warnings with one refrain”'
    claim: 'Pestilence with the sword alludes to Leviticus 26:25; “the manner of Egypt” is set beside Deuteronomy 28:60'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/4.htm'
    quote: 'In the combination of pestilence and sword (war), the allusion to Leviticus 26:25 is unmistakeable (compare Deuteronomy 28:60, where the rebellious are threatened with all the diseases of Egypt).'
  - where: 'note 4:6 “Five warnings with one refrain”'
    claim: 'Deuteronomy 28:60'
    key: lds-scriptures
