  # ---- note 6:14 ----
  - where: 'note 6:14 “The borders Jeroboam won”'
    claim: 'The entering in of Hamath was the northern limit of the land'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'the “entering in of Hamath” was the northern limit of the Promised Land (Num. 34:8; Josh. 13:5)'
  - where: 'note 6:14 “The borders Jeroboam won”'
    claim: 'Jeroboam restored the border from the entering of Hamath to the sea of the plain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'He restored the coast of Israel from the entering of Hamath unto the sea of the plain'
  - where: 'note 6:14 “The borders Jeroboam won”'
    claim: 'The “sea of the plain” of 2 Kings 14:25 and the “river of the wilderness” of Amos 6:14 are both named from the Arabah, the steppe by the Dead Sea; the location of the wadi is uncertain'
    key: bdb
    url: 'https://biblehub.com/hebrew/6160.htm'
    quote: 'נַחַל הָעֲרָבָה Amos 6:14 must be east of Dead Sea, si vera lectio'
  - where: 'note 6:14 “The borders Jeroboam won”'
    claim: 'The lexicon lists the sea of the Arabah at 2 Kings 14:25 under the same word'
    key: bdb
    url: 'https://biblehub.com/hebrew/6160.htm'
    quote: 'arid steppe west of Dead Sea (in southern Judah) 1 Samuel 23:24, also Ezekiel 47:8; Isaiah 51:3, whence name'
  - where: 'note 6:14 “The borders Jeroboam won”'
    claim: 'Tiglath-pileser took Gilead, Galilee and Naphtali'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'came Tiglath-pileser king of Assyria, and took Ijon, and Abel-beth-maachah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria.'
  - where: 'note 6:14 “The borders Jeroboam won”'
    claim: 'The king of Assyria took Samaria and carried Israel away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'In the ninth year of Hoshea the king of Assyria took Samaria, and carried Israel away into Assyria'
  - where: 'note 6:14 “The borders Jeroboam won”'
    claim: 'The nation was Assyria; the conquest was in 722 B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'they were conquered by the Assyrians in 722 BC.'

