chapter: 6
claims:
  # ---- when / setting ----
  - where: 'when'
    claim: 'Amos’s ministry is placed at 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC), it appears these covenants had been disregarded not only by Israel’s neighbors, but by the Israelites themselves'
  - where: 'when'
    claim: 'Amos prophesied in the days of Jeroboam II of Israel, among the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The prophet Amos prophesied in the days of Uzziah, king of Judah (died about 740 B.C.), and Jeroboam Ⅱ, king of Israel (died about 750 B.C.).'
  - where: 'setting'
    claim: 'Chapters 3–6 are the warnings to the northern kingdom; the visions follow in 7–9'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 3–6: Warnings to the Northern Kingdom and Amos’s plea for the people to repent.'
  - where: 'setting'
    claim: 'Chapters 7–9 are the visions'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 7–9: Amos’s visions of coming judgment and a message of hope that God would one day restore and bless His people.'
  - where: 'setting'
    claim: 'Jeroboam II’s reign was a time of peace and prosperity'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Instead, the Israelites were enjoying an era of peace and prosperity (2 Kings 14:23–29).'
  - where: 'setting'
    claim: 'Jeroboam restored Israel’s border from the entering of Hamath to the sea of the plain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'He restored the coast of Israel from the entering of Hamath unto the sea of the plain'
  - where: 'setting'
    claim: 'Samaria stood on a hill and fell to Assyria only after a three-year siege'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'It occupied a strong position on a hill, and the Assyrians could not capture it until after a siege of three years (2 Kgs. 17:5–6).'
  - where: 'setting'
    claim: 'Israel was conquered by Assyria in 722 B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Many of the people of Israel rejected the warnings of Amos and the other prophets, and they were conquered by the Assyrians in 722 BC.'
  - where: 'setting'
    claim: 'Nephi uses the first line of the chapter (the Church’s footnote on verse 1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng'
    quote: 'Ps. 123:4; 2 Ne. 28:24 (21–24).'

  # ---- thread ----
  - where: 'thread'
    claim: '“Chief” in verses 1 and 6 is one Hebrew word (reshit)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7225.htm'
    quote: '2 first chief, Amos 6:1; … שְׁמָנִים ׳ר Amos 6:6, i.e. choice oils'
  - where: 'thread'
    claim: 'Verse 7’s “first” was chosen with reference to verse 6’s “chief”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'בּראשׁ גּלים is chosen with direct reference to ראשׁית שׁמנים, as Jerome has observed'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Trust in” rendered as feeling secure; “named chief of the nations” as the notable men of the first of the nations'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'and for those who feel secure on Mount Samaria, the notables of the first of the nations, to whom the house of Israel resorts!'
  - where: 'section 1 plain'
    claim: '“Named” means well-known men'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'distinguished by names, that is to say, well-known men; and it is used here in the same sense'
  - where: 'section 2 plain'
    claim: '“Viol” rendered harp; “stretch themselves” as lounging; “chief ointments” as finest oils; “affliction” as ruin'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'who sing idle songs to the sound of the harp … and anoint themselves with the finest oils but are not grieved over the ruin of Joseph!'
  - where: 'section 2 plain'
    claim: 'Verse 7: first into exile; the banquet is revelry'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'Therefore they shall now be the first to go into exile, and the revelry of the loungers shall pass away.'
  - where: 'section 2 plain'
    claim: 'The Church’s footnote gives “banquet” as revelry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng'
    quote: 'OR revelry.'
  - where: 'section 3 plain'
    claim: '“Excellency” is pride in Hebrew (the Church’s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng'
    quote: 'HEB pride. Amos 8:7.'
  - where: 'section 3 plain'
    claim: 'Verse 10 rendered with a relative who burns the dead, the innermost part of the house, and “Hush!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'And if a relative, one who burns it, takes up the body to bring it out of the house and says to someone in the innermost parts of the house, “Is anyone else with you?” the answer will come, “No.”'
  - where: 'section 3 plain'
    claim: 'Verse 11: the houses are shattered'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'he will shatter the great house to bits and the little house to pieces.'
  - where: 'section 4 plain'
    claim: '“Judgment into gall … hemlock” rendered justice into poison and wormwood; “afflict” as oppress'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'But you have turned justice into poison and the fruit of righteousness into wormwood'
  - where: 'section 4 plain'
    claim: '“Afflict” rendered oppress'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'and they shall oppress you from Lebo-hamath to the Wadi Arabah.'

  # ---- note 6:1 ----
  - where: 'note 6:1 “At ease in Zion, in Amos and in Nephi”'
    claim: 'Solomon’s temple stood on Mount Zion'
    key: bd-zion
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zion?lang=eng'
    quote: 'Solomon built his temple on Mount Zion (1 Kgs. 8:1; see also 2 Sam. 5:6–7)'
  - where: 'note 6:1 “At ease in Zion, in Amos and in Nephi”'
    claim: 'The word for “at ease” in Amos 6:1 carries the sense of careless and arrogant; the same word is in Isaiah 32:9 and Psalm 123:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/7600.htm'
    quote: '3 at ease, with collateral idea of careless, wanton, arrogant, Amos 6:1; Isaiah 32:9,11; Zechariah 1:15; Psalm 123:4.'
  - where: 'note 6:1 “At ease in Zion, in Amos and in Nephi”'
    claim: 'Samaria occupied a strong position on a hill'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'a city built by Omri and made the capital of the kingdom of Israel. It occupied a strong position on a hill'
  - where: 'note 6:1 “At ease in Zion, in Amos and in Nephi”'
    claim: 'Nephi: the devil lulls people into carnal security so that they say all is well in Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng'
    quote: 'And others will he pacify, and lull them away into carnal security, that they will say: All is well in Zion; yea, Zion prospereth, all is well'
  - where: 'note 6:1 “At ease in Zion, in Amos and in Nephi”'
    claim: 'Nephi repeats Amos’s woe in the singular'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng'
    quote: 'Therefore, wo be unto him that is at ease in Zion!'
  - where: 'note 6:1 “At ease in Zion, in Amos and in Nephi”'
    claim: 'The Church’s footnote on “ease” joins the verse to Psalm 123:4 and 2 Nephi 28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng'
    quote: 'Ps. 123:4; 2 Ne. 28:24 (21–24).'

  # ---- note 6:2 ----
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'Hamath was an important Syrian city on the Orontes'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'An important city of Syria, in the valley of the Orontes'
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'Gath was one of the five Philistine cities'
    key: bd-gath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gath?lang=eng'
    quote: 'One of the five cities of the Philistines (Josh. 11:22)'
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'Calneh is probably Isaiah’s Calno; two sites are proposed, one conquered by Tiglath-pileser III in 738'
    key: bdb
    url: 'https://biblehub.com/hebrew/3641.htm'
    quote: 'כַּלְנֶה Amos 6:2, probably = כַּלְנוֺ Isaiah 10:9 … perhaps = Kullani … Kullanhou, near Aleppo, conquered by Tiglath-Pileser III in 738 (COTii, 195); or (Di) Kunulua (KG217 KBi, 107), southeast of Antioch'
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'An older commentary places Calneh in Babylonia on the Tigris'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'Calneh ( equals Calno, Isaiah 10:9) is the later Ctesiphon in the land of Shinar, or Babylonia, situated upon the Tigris opposite to Seleucia'
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'The Student Manual reads the three as places already destroyed, a warning to Israel'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'But first He invited them to visit other places of destruction—Calneh in Mesopotamia, Hamath in Syria, and Gath in Philistia—and observe what happened to the people there. Were the Israelites any better than they? Certainly not. They had been punished, and so would Israel.'
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'Keil: it cannot be shown that Calneh had fallen by Amos’s time'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'although Calneh is spoken of in Isaiah 10:9 as a city that had been conquered by the Assyrians, it cannot be proved that this was the case as early as the time of Amos'
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'Keil: the cities are flourishing, Israel is not inferior to them, and this heightens the calling of its princes'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'To give still greater prominence to the exalted calling of these princes, Amos shows in Amos 6:2 that Israel can justly be called the firstling of the nations, since it is not inferior either in prosperity or greatness to any of the powerful and prosperous heathen states.'
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'A modern translation prints “Are you better” with “Are they better” as an alternative'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'Are you better than these kingdoms?'
  - where: 'note 6:2 “Calneh, Hamath and Gath, and what the tour is meant to show”'
    claim: 'The NRSVue footnote on 6:2'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: '6.2 Or Are they better'

  # ---- note 6:4 ----
  - where: 'note 6:4 “What is wrong with the feast”'
    claim: 'The Church’s footnote on “instruments” points to 1 Chronicles 23:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng'
    quote: '1 Chr. 23:5; 2 Chr. 29:26 (25–28).'
  - where: 'note 6:4 “What is wrong with the feast”'
    claim: 'David’s instruments were made for praising the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'four thousand praised the Lord with the instruments which I made, said David, to praise therewith.'
  - where: 'note 6:4 “What is wrong with the feast”'
    claim: 'The word for “bowls” is a wine bowl only here'
    key: bdb
    url: 'https://biblehub.com/hebrew/4219.htm'
    quote: '1 bowl for wine Amos 6:6.'
  - where: 'note 6:4 “What is wrong with the feast”'
    claim: 'Elsewhere the word is a vessel of sacrifice'
    key: bdb
    url: 'https://biblehub.com/hebrew/4219.htm'
    quote: '2 elsewhere for use in ritual of sacrifice:'
  - where: 'note 6:4 “What is wrong with the feast”'
    claim: 'Matson lists the ivory beds and the livestock among the goods to be destroyed'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'great houses (3:15), beds of ivory (6:4), and excessive livestock and produce (6:4, 6). The wealth and prestige the elite Israelites acquired through exploitation would be the focus of the Lord’s destruction.'

  # ---- note 6:6 ----
  - where: 'note 6:6 “The breaking of Joseph”'
    claim: 'The noun means breaking or fracture and is used here of a people personified'
    key: bdb
    url: 'https://biblehub.com/hebrew/7667.htm'
    quote: 'noun masculineJeremiah 4:5 breaking, fracture, crushing, breach, crash'
  - where: 'note 6:6 “The breaking of Joseph”'
    claim: 'It is used of broken pottery and a fractured limb, and figuratively of people personified in Amos 6:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/7667.htm'
    quote: '1 breaking of pottery Isaiah 30:14, fracture of member, limb Leviticus 21:19; Leviticus 24:20 (H), especially figurative of people personified יוֺסֵף ׳שׁ Amos 6:6'
  - where: 'note 6:6 “The breaking of Joseph”'
    claim: 'A modern translation has “the ruin of Joseph”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'but are not grieved over the ruin of Joseph!'
  - where: 'note 6:6 “The breaking of Joseph”'
    claim: 'Scholarly consensus reads the coming destruction of the northern kingdom; Matson proposes a rebuke for ignoring the poor of the same lineage'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'While scholarly consensus supports this as a reference to the impending destruction of the northern kingdom, read within the context of Amos’s condemnation of the elite, this reference may be a rebuke upon the elite for not noticing the economic inequality and dire situation of the destitute and poor among them who were also of the lineage of Joseph.'

  # ---- note 6:7 ----
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: 'Reshit is “chief” in 6:1 and “choice” in 6:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/7225.htm'
    quote: '2 first chief, Amos 6:1; … שְׁמָנִים ׳ר Amos 6:6, i.e. choice oils; = choice part'
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: 'Verse 7 has rosh, “head” (Strong’s 7218)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'בְּ/רֹ֣אשׁ'
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: 'The wording of verse 7 was chosen with reference to verse 6; Jerome’s sentence, as Keil prints it'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'בּראשׁ גּלים is chosen with direct reference to ראשׁית שׁמנים, as Jerome has observed: "Ye who are first in riches will be the first to bear the yoke of captivity."'
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: 'A modern translation has “first” in verse 1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'the notables of the first of the nations'
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: 'and “first” in verse 7'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'Therefore they shall now be the first to go into exile'
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: '“Stretched themselves” in verse 7 is the word of verse 4 (Strong’s 5628)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'סְרוּחִֽים'
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: 'Keil: the word points back to verse 4'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'Serūchı̄m also points back to Amos 6:4, "those who are stretched upon their couches" - that is, the revellers'
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: 'The Church’s footnote on “banquet”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng'
    quote: 'OR revelry.'
  - where: 'note 6:7 “First in rank, first into exile”'
    claim: 'The lexicon: a cry of revelry in Amos 6:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/4797.htm'
    quote: '2 cry of revelry, construct מִרְזַח סְרוּחִים Amos 6:7.'

  # ---- note 6:8 ----
  - where: 'note 6:8 “The pride of Jacob and his palaces”'
    claim: 'The Church’s footnote: “excellency” is pride in Hebrew, with a reference to Amos 8:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng'
    quote: 'HEB pride. Amos 8:7.'
  - where: 'note 6:8 “The pride of Jacob and his palaces”'
    claim: 'A modern translation of the verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'I abhor the pride of Jacob and hate his strongholds'
  - where: 'note 6:8 “The pride of Jacob and his palaces”'
    claim: 'Matson calls the palaces of 6:8 high-rises and lists them among what will be destroyed'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Other items that were to be destroyed that would enrage the elite include their own high-rises (6:8), winter and summer homes (3:15), ivory homes (3:15), great houses (3:15), beds of ivory (6:4)'

  # ---- note 6:10 ----
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: '“Uncle” is a father’s brother; in Amos 6:10 perhaps kinsman'
    key: bdb
    url: 'https://biblehub.com/hebrew/1730.htm'
    quote: '2 specifically uncle, Leviticus 10:4 (father''s brother, patruus; … = kinsman (?, so St RVm) Amos 6:10.'
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'A modern translation takes the relative and the burner as one man'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: 'And if a relative, one who burns it, takes up the body to bring it out of the house'
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'and marks the Hebrew as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+6&version=NRSVUE'
    quote: '6.10 Meaning of Heb uncertain'
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'Keil: Israel buried its dead; burning implies deaths too many to bury'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'The Israelites were indeed accustomed to bury their dead, and not to burn the corpses. The description of the burier as mesârēph (a burner) therefore supposes the occurrence of such a multitude of deaths that it is impossible to bury the dead'
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'The Septuagint begins verse 10 with a remnant left behind'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/6.htm'
    quote: 'But a remnant shall be left behind, and their relations shall take them, and shall strenuously endeavor to carry forth their bones from the house'
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'The word is an interjection, “hush”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2013.htm'
    quote: 'interjection hush! keep silence (probably onomatopoetic)'
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'Keil: the reason is fear of drawing God’s eye, not despair'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/6.htm'
    quote: 'would be unsuitable as an utterance of despair. It rather indicates the fear lest, by the invocation of the name of God, the eye of God should be drawn towards this last remaining one, and he also should fall a victim to the judgment of death.'
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'Spencer counts 6:9–10 among Amos’s negative words on a remnant'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'Similarly negative prophetic words regarding an Israelite remnant appear in Amos 6:9–10 and 9:1–4.'
  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'Sears: many tie 6:10 to 8:3; he doubts they share a context'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'I am unconvinced that Amos 6:10 and 8:3 share such a “similar context”[13] as many have proposed. Yes, each involves mass death, but Amos 6:9–10 describes men at a house, while Amos 8:3 describes singers at the temple.'

  - where: 'note 6:10 “The house of ten and the name not to be spoken”'
    claim: 'The King James Version has “with silence” at Amos 8:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/8?lang=eng'
    quote: 'there shall be many dead bodies in every place; they shall cast them forth with silence.'

  # ---- note 6:12 ----
  - where: 'note 6:12 “Justice turned to poison”'
