  # ---- note 7:14 (herdman) ----
  - where: 'note 7:14 “A herdsman and a tender of sycomore figs”'
    claim: 'The word is literally a herdsman of oxen, more broadly a shepherd'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'a bōqēr, lit., a herdsman of oxen (from bâqâr); then in a broader sense, a herdsman who tends the sheep (צאן), a shepherd'
  - where: 'note 7:14 “A herdsman and a tender of sycomore figs”'
    claim: 'The sycomore is the fig-mulberry, not the English sycamore'
    key: bd-sycomore
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sycomore?lang=eng'
    quote: 'The fig-mulberry. An English Sycamore is a maple.'
  - where: 'note 7:14 “A herdsman and a tender of sycomore figs”'
    claim: 'The lexicon’s gloss of the verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/1103.htm'
    quote: 'verb denominative gather figs, tend fig-trees, sycamores (ᵐ5 κνίζων, ᵑ9 vellicans, probably properly to nip the sycamore fruit to fit it for eating'
  - where: 'note 7:14 “A herdsman and a tender of sycomore figs”'
    claim: 'The verb occurs only here'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'The ἁπ. λεγ. bōlēs is a denom. from the Arabic name for the mulberry-fig'
  - where: 'note 7:14 “A herdsman and a tender of sycomore figs”'
    claim: 'A modern rendering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: 'but I am a herdsman and a dresser of sycamore trees'
  - where: 'note 7:14 “A herdsman and a tender of sycomore figs”'
    claim: 'Many infer a plantation; Keil denies that it follows and reads the fruit as shepherds’ food, answering “eat bread”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'it would by no means follow that the possession of a mulberry plantation was what was intended, as many commentators have inferred; for "the words contain an allusion to the ''eating of bread'' referred to in Amos 7:12'
  - where: 'note 7:14 “A herdsman and a tender of sycomore figs”'
    claim: 'Scripture Helps on his work'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'The book of Amos contains the teachings and prophecies of Amos, originally a shepherd and farmer from a small town near Jerusalem.'
  - where: 'note 7:14 “A herdsman and a tender of sycomore figs”'
    claim: 'His work was a livelihood from which the Lord called him'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'From this calling, which afforded him a livelihood, the Lord had called him away to prophesy to His people Israel'

