chapter: 7
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Amos’s ministry is placed at 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC), it appears these covenants had been disregarded not only by Israel’s neighbors, but by the Israelites themselves'
  - where: 'when'
    claim: 'Amos prophesied in the days of Jeroboam II of Israel'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The prophet Amos prophesied in the days of Uzziah, king of Judah (died about 740 B.C.), and Jeroboam Ⅱ, king of Israel (died about 750 B.C.).'
  - where: 'setting'
    claim: 'Chapters 7–9 are the visions and a message of hope'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 7–9: Amos’s visions of coming judgment and a message of hope that God would one day restore and bless His people.'
  - where: 'setting'
    claim: 'There are five visions; the first three are in chapter 7, the fourth in chapter 8, the fifth at 9:1'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'The visions are (1) a swarm of locusts (Amos 7:1–3); (2) devouring fire (Amos 7:4–6); (3) the master builder with the plumbline (Amos 7:7–9); (4) the basket of summer fruit (Amos 8); and (5) the smitten sanctuary (Amos 9:1–6).'
  - where: 'setting'
    claim: 'The first four visions are read as two contrasting pairs'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'The first two visions form a complementary pair, as do the last two, and the four together form two contrasting pairs.'
  - where: 'setting'
    claim: 'The story of Amaziah stands between the third and fourth visions'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'A story describing Amos’s clash with Amaziah the priest at Beth-el interrupts between the third and fourth visions (7:10–17).'
  - where: 'setting'
    claim: 'Jeroboam I chose Beth-el for the calf worship'
    key: bd-bethel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethel?lang=eng'
    quote: 'Jeroboam selected it as one of the places in which to set up the calf worship (1 Kgs. 12:29–32; 2 Kgs. 10:29; Amos 7:13).'
  - where: 'setting'
    claim: 'Jeroboam II was the ablest of Israel’s kings and the most successful in war'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Jeroboam Ⅱ, of the dynasty of Jehu, the ablest of the kings of Israel, and the most successful in war'
  - where: 'setting'
    claim: 'Amos was a native of Tekoa in Judah whose ministry was in the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'He was a shepherd (Amos 1:1; 7:14) and a native of Tekoa, 12 miles south of Jerusalem, but his ministry was among those of the northern kingdom of Israel.'
  - where: 'setting'
    claim: 'The Joseph Smith Translation changes verses 3 and 6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/7?lang=eng'
    quote: 'JST Amos 7:3 And the Lord said, concerning Jacob, Jacob shall repent for this, therefore I will not utterly destroy him, saith the Lord.'
  - where: 'thread'
    claim: 'In the third vision Amos offers no plea'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'The plumbline indicates that Israel’s behavior is not aligned with God’s commands, and it will consequently be destroyed.[8] This time, Amos offers no intercessory protest.'
  - where: 'thread'
    claim: 'The refusal of intercession echoes Israel’s “prophesy not” to Amos'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'God’s command for Amos not to intercede anymore becomes an ironic echo of the Israelites who told Amos, “O thou seer, go, flee thee away . . . [and] prophesy not again any more” (Amos 7:12–13).'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“By whom shall Jacob arise” rendered “How can Jacob stand?”; “repented” as relented; “I beseech thee” as I beg you'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: '“O Lord God, forgive, I beg you! How can Jacob stand? He is so small!”(B) 3 The Lord relented concerning this'
  - where: 'section 2 plain'
    claim: '“Called to contend by fire” as calling for judgment by fire; the last word is “the portion”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'and, behold, the Lord Jehovah called to punish with fire; and it devoured the great flood, and devoured the portion'
  - where: 'section 2 plain'
    claim: 'A modern translation: calling for judgment by fire'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: 'the Lord God was calling for judgment by fire, and it devoured the great deep and was eating up the land'
  - where: 'section 3 plain'
    claim: '“Pass by” rendered as passing them by; setting a plumb line in the midst'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: '“See, I am setting a plumb line in the midst of my people Israel; I will spare them no longer'
  - where: 'section 4 plain'
    claim: '“Eat bread” as earn your bread; “chapel” as sanctuary'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: 'earn your bread there, and prophesy there, 13 but never again prophesy at Bethel, for it is the king’s sanctuary, and it is a temple of the kingdom.'
  - where: 'section 5 plain'
    claim: '“Drop not thy word” as preach; land measured by line; unclean land; exile'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: 'and your land shall be parceled out by line; you yourself shall die in an unclean land, and Israel shall surely go into exile away from its land.'
  - where: 'section 5 plain'
    claim: '“Gatherer of sycomore fruit” as one who tends sycomore figs'
    key: bdb
    url: 'https://biblehub.com/hebrew/1103.htm'
    quote: 'verb denominative gather figs, tend fig-trees, sycamores'

  # ---- note 7:1 ----
  - where: 'note 7:1 “Locusts on the second growth”'
    claim: '“Latter growth” (leqesh) occurs only in this verse and probably means the after-growth or spring crop'
    key: bdb
    url: 'https://biblehub.com/hebrew/3954.htm'
    quote: 'probably after-growth, after-math, i.e. spring-crop (compare GASm12Proph. i. 109); — only (2 t.) Amos 7:1'
  - where: 'note 7:1 “Locusts on the second growth”'
    claim: '“Mowings” is a mowing or shearing'
    key: bdb
    url: 'https://biblehub.com/hebrew/1488.htm'
    quote: 'noun [masculine] shearing, mowing … mowing Amos 7:1'
  - where: 'note 7:1 “Locusts on the second growth”'
    claim: 'No royal right to the first crop is known'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'nothing is known of the existence of any right or prerogative on the part of the kings of Israel, to have the early crop in the meadow land throughout the country mown for the support of their horses and mules'
  - where: 'note 7:1 “Locusts on the second growth”'
    claim: 'A literal reading would exempt the king, against the sense of the visions'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'this plague would fall upon the people alone, and not at all upon the king. But such an exemption of the king from the judgment is evidently at variance with the meaning of this and the following visions.'
  - where: 'note 7:1 “Locusts on the second growth”'
    claim: 'Keil reads the king as Jehovah and the mowing as judgments already executed; the second growth as returned prosperity'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'The king, who has had the early grass mown, is Jehovah; and the mowing of the grass denotes the judgments which Jehovah has already executed upon Israel. The growing of the second crop is a figurative representation of the prosperity which flourished again'
  - where: 'note 7:1 “Locusts on the second growth”'
    claim: 'The judgments meant are those of Amos 4:6–10'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'denotes rather all the judgments which the Lord had hitherto poured out upon Israel, embracing everything that the prophet mentions in Amos 4:6-10'

  # ---- note 7:2 ----
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: 'Prophets also intercede, speaking to God for others'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'One important way the prophets act as emissaries to God is by engaging in intercession, that is, speaking to God in behalf of others in order to defend or assist them.'
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: 'Samuel, Abraham and Moses are among the prophets who interceded'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Other biblical texts involving prophetic intercession include Genesis 18:22–32; 20:7, 17; Exodus 32:7–14, 30–32'
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: 'Samuel’s words on praying for the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/12?lang=eng'
    quote: 'God forbid that I should sin against the Lord in ceasing to pray for you'
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: '“Forgive” and “cease” are commands in Hebrew'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Both “forgive” and “cease” are commands, even in Hebrew, suggesting Amos’s urgency.'
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: 'A modern rendering of the question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: 'How can Jacob stand? He is so small!'
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: '“Small” is relative'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: '“Small” is perhaps best understood as a relative description, acknowledging that however powerful Israel may be, it would be irreversibly devastated'
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: 'Amos appeals to no righteousness; readers take the plea as pity, as a covenant claim, or both'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Whether his words are a sympathetic response or a suit for breach of contract (or both), it is significant that Amos does not appeal to the people’s righteousness or repentance—and given the tone of the rest of the book, there does not appear to be much evidence for either.'
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: 'God is always the subject of the verb “forgive”'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'This verb appears forty-six times in the Old Testament, and in every instance, God is the subject of the verb, the one doing the forgiving.'
  - where: 'note 7:2 “Amos pleads for Israel”'
    claim: 'The change from “forgive” to “cease” read as a retreat'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: '“Forgive” gets back to the root problem of sin, while “cease” targets only the punishment and leaves sin unresolved.[19] The second request seeks to gain less than the first'

  # ---- note 7:3 ----
  - where: 'note 7:3 “The LORD relented”'
    claim: 'The range of the Hebrew verb, and “relented” as the better fit'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'including “to regret,” “to feel sorrow or sympathy,” “to comfort,” or “to relent or forebear.” Rather than God “repenting” (with that word’s modern connotation of sinfulness), a better contextual translation in Amos 7:3, 6 might be “the Lord relented”'
  - where: 'note 7:3 “The LORD relented”'
    claim: 'A modern translation has “relented”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: 'The Lord relented concerning this; “It shall not be,” said the Lord.'
  - where: 'note 7:3 “The LORD relented”'
    claim: 'The footnote at “repented” cites Numbers 23:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/7?lang=eng'
    quote: 'Gen. 6:6; Num. 23:19.'
  - where: 'note 7:3 “The LORD relented”'
    claim: 'The Joseph Smith Translation clarifies that the Lord did not repent'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'The Joseph Smith Translation revises these verses to clarify that the Lord did not repent; instead, He withheld judgment because “Jacob shall repent.”'
  - where: 'note 7:3 “The LORD relented”'
    claim: 'JST Amos 7:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/7?lang=eng'
    quote: 'JST Amos 7:3 And the Lord said, concerning Jacob, Jacob shall repent for this, therefore I will not utterly destroy him, saith the Lord.'
  - where: 'note 7:3 “The LORD relented”'
    claim: 'JST Amos 7:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/7?lang=eng'
    quote: 'JST Amos 7:6 And the Lord said, concerning Jacob, Jacob shall repent of his wickedness; therefore I will not utterly destroy him, saith the Lord God.'
  - where: 'note 7:3 “The LORD relented”'
    claim: 'The JST’s pattern where the KJV has God “repent”'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'the JST responds not by changing the word repent itself (the strategy taken by most modern-English translations) but by creatively rewriting the sentence so that some other party becomes the subject of the verb repent'
  - where: 'note 7:3 “The LORD relented”'
    claim: 'Sears’s judgment of what kind of change these are'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Thus I interpret the Prophet’s revisions in Amos 7:3, 6 as a response to an idiosyncrasy in the KJV and not as a restoration of original text'

  # ---- note 7:4 ----
  - where: 'note 7:4 “Fire on the great deep”'
    claim: 'The fire is generally taken as severer than the locusts; the last word is “the portion”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'That the all-devouring fire represents a much severer judgment than that depicted under the figure of the locusts, is generally acknowledged'
  - where: 'note 7:4 “Fire on the great deep”'
    claim: '“The great deep” is the phrase of Genesis 7:11'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'Tehōm rabbâh is used in Genesis 7:11 and Isaiah 51:10, etc., to denote the unfathomable ocean'
  - where: 'note 7:4 “Fire on the great deep”'
    claim: 'A modern translation reads “calling for judgment by fire” and “the land”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: 'the Lord God was calling for judgment by fire, and it devoured the great deep and was eating up the land'
  - where: 'note 7:4 “Fire on the great deep”'
    claim: 'The Septuagint reads “the Lord’s portion”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/7.htm'
    quote: "and, behold, the Lord called for judgment by fire, and it devoured the great deep, and devoured the Lord's portion."
  - where: 'note 7:4 “Fire on the great deep”'
    claim: 'Keil reads the portion as Israel, with Deuteronomy 32:9'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'but the inheritance or portion, namely, that of Jehovah (Deuteronomy 32:9), i.e., Israel'
  - where: 'note 7:4 “Fire on the great deep”'
    claim: 'The Student Manual’s reading of the fire'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'The fire that devoured the great deep (presumably the ocean) is symbolic of the partially destructive wars that Israel was later involved in.'
  - where: 'note 7:4 “Fire on the great deep”'
    claim: 'Deuteronomy 32:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'For the Lord’s portion is his people'

  - where: 'note 7:4 “Fire on the great deep”'
    claim: 'The Hebrew has “the portion”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'and it devoured the great flood, and devoured the portion.'

  # ---- note 7:7 ----
  - where: 'note 7:7 “The plumbline”'
    claim: 'What a plumb line is'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'A plumb line is a cord with a metal weight or stone tied to one end. This tool was used by builders to ensure that walls were exactly straight vertically.'
  - where: 'note 7:7 “The plumbline”'
    claim: 'The plumbline as a construction tool, and what it shows of Israel'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'the plumbline—a tool used to make a vertical reference line during construction … The plumbline indicates that Israel’s behavior is not aligned with God’s commands'
  - where: 'note 7:7 “The plumbline”'
    claim: 'The lexicon cites the word only from Amos 7:7–8 and compares cognate words for lead and tin'
    key: bdb
    url: 'https://biblehub.com/hebrew/594.htm'
    quote: 'noun [masculine] plummet (compare words in cognate languages for lead, tin, etymology dubious, perhaps foreign … plummet Amos 7:7,8 (twice in verse)'
  - where: 'note 7:7 “The plumbline”'
    claim: 'In Amos the word is in these two verses only'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'אֲנָ֑ךְ'
  - where: 'note 7:7 “The plumbline”'
    claim: 'Since 1965 some read “tin”; the meaning of the vision is clear either way'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Beginning with a 1965 article that examined comparative evidence from Akkadian sources, several modern interpreters have suggested that the Hebrew word ’ănāk means “tin” rather than “plumbline,” though the traditional translation still has its defenders.'
  - where: 'note 7:7 “The plumbline”'
    claim: 'The meaning of the vision is clear either way'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'The overall meaning of the third vision is clear in either case.'

  # ---- note 7:8 ----
  - where: 'note 7:8 “Why Amos does not plead the third time”'
    claim: 'The third and fourth visions run in parallel, and Amos’s answers are his last words in them'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'These answers are Amos’s final words in these two visions; God does all the talking from this point forward.'
  - where: 'note 7:8 “Why Amos does not plead the third time”'
    claim: 'The count of Hebrew words spoken'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Third vision: Amos, 1 God, 26'
  - where: 'note 7:8 “Why Amos does not plead the third time”'
    claim: 'The count for the first two visions'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Second vision: Amos, 10 God, 4'
  - where: 'note 7:8 “Why Amos does not plead the third time”'
    claim: '“Pass by” can mean to forgive sin, as in Micah 7:18, and that is the likely sense here'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'one of which is the forgiving of sin (for examples, see 2 Samuel 12:13, 24:10, Micah 7:18, Job 7:21, or Zechariah 3:4). Something like “forgive” or “pardon” is the most likely fit for the context of Amos 7:8 and 8:2.'
  - where: 'note 7:8 “Why Amos does not plead the third time”'
    claim: 'A modern translation: “I will spare them no longer”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%207&version=NRSVUE'
    quote: 'I will spare them no longer'
  - where: 'note 7:8 “Why Amos does not plead the third time”'
    claim: '“Again” and “any more” presuppose earlier forgiveness; the Lord denies further intercession'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'The words “again” and “any more” presuppose that forgiveness was granted previously … suggests that God, more than simply denying forgiveness, is also denying any new attempts to intercede.'

  # ---- note 7:9 ----
  - where: 'note 7:9 “The shrines and the king’s house”'
    claim: 'The spelling of “Isaac” used here occurs in Amos only at 7:9 and 7:16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'יִשְׂחָ֔ק'
  - where: 'note 7:9 “The shrines and the king’s house”'
    claim: 'Jeroboam II was of Jehu’s dynasty'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Jeroboam Ⅱ, of the dynasty of Jehu'
  - where: 'note 7:9 “The shrines and the king’s house”'
    claim: 'Zachariah was killed by Shallum'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And Shallum the son of Jabesh conspired against him, and smote him before the people, and slew him, and reigned in his stead.'
  - where: 'note 7:9 “The shrines and the king’s house”'
    claim: 'Jeroboam II died a natural death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'And Jeroboam slept with his fathers, even with the kings of Israel; and Zachariah his son reigned in his stead.'
  - where: 'note 7:9 “The shrines and the king’s house”'
    claim: 'The kingdom fell to Assyria in 722 B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'they were conquered by the Assyrians in 722 BC'

  # ---- note 7:10 ----
