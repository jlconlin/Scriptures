chapter: 8
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Amos’s ministry is placed at 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC), it appears these covenants had been disregarded not only by Israel’s neighbors, but by the Israelites themselves'
  - where: 'when'
    claim: 'Amos prophesied in the days of Jeroboam II of Israel'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The prophet Amos prophesied in the days of Uzziah, king of Judah (died about 740 B.C.), and Jeroboam Ⅱ, king of Israel (died about 750 B.C.).'
  - where: 'setting'
    claim: 'Chapters 7–9 are the visions and a message of hope'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 7–9: Amos’s visions of coming judgment and a message of hope that God would one day restore and bless His people.'
  - where: 'setting'
    claim: 'This is the fourth vision (8:1–3); the third is 7:7–9'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Just as the first and second visions share a similar structure, the third and fourth visions (7:7–9; 8:1–3) can be read in parallel.'
  - where: 'setting'
    claim: 'Amaziah was the priest of Beth-el (Amos 7:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/7?lang=eng'
    quote: 'Then Amaziah the priest of Beth-el sent to Jeroboam king of Israel'
  - where: 'setting'
    claim: 'Amos was a native of Tekoa whose ministry was in the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'He was a shepherd (Amos 1:1; 7:14) and a native of Tekoa, 12 miles south of Jerusalem, but his ministry was among those of the northern kingdom of Israel.'
  - where: 'setting'
    claim: 'Israel was conquered by Assyria in 722 B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Many of the people of Israel rejected the warnings of Amos and the other prophets, and they were conquered by the Assyrians in 722 BC.'
  - where: 'setting'
    claim: 'Amos preached in a time of peace and prosperity'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Instead, the Israelites were enjoying an era of peace and prosperity (2 Kings 14:23–29).'
  - where: 'thread'
    claim: 'The Hebrew words for “summer fruit” and “end” are related in sound'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: '8.2 In Heb the word for end is related to the word for summer fruit'
  - where: 'thread'
    claim: 'The famine of chapter 8 is a spiritual famine, set against the earlier physical ones'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'In chapter 8, Amos prophesied of a different type of famine—a spiritual famine in which the Lord would withdraw His word from the people.'

  # ---- plain-words renderings ----
  - where: 'section 1 plain'
    claim: '“Pass by” rendered as not sparing; the last word rendered as a command'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: 'I will spare them no longer.(A) 3 The songs of the temple shall become wailings on that day,” says the Lord God; “the dead bodies shall be many, cast out in every place. Be silent!”'
  - where: 'section 2 plain'
    claim: 'Verses 5–6 rendered with grain, sandals and sweepings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: '6 buying the poor for silver and the needy for a pair of sandals and selling the sweepings of the wheat.'
  - where: 'section 3 plain'
    claim: 'Verses 7–8 rendered with “pride of Jacob” and the Nile'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: 'and all of it rise like the Nile, and be tossed about and sink again, like the Nile of Egypt?'
  - where: 'section 4 plain'
    claim: 'Verse 14 rendered with oaths by the life of the god of Dan and the way of Beer-sheba'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: 'and say, “As your god lives, O Dan,” and, “As the way of Beer-sheba lives”— they shall fall and never rise again.'
  - where: 'section 4 plain'
    claim: '“Sin of Samaria” is Samaria’s guilt'
    key: bdb
    url: 'https://biblehub.com/hebrew/819.htm'
    quote: 'אַשְׁמַת שֹׁמְרוֺן guilt of Samaria (their idols) Amos 8:14.'

  # ---- note 8:1 ----
  - where: 'note 8:1 “Summer fruit and the end”'
    claim: 'The Hebrew of verses 1–2 has qayits (H7019) for “summer fruit” and qets (H7093) for “end”'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/7019.htm'
    quote: '7019. קָ֫יִץ (qayits) -- Summer, summer fruit, harvest'
  - where: 'note 8:1 “Summer fruit and the end”'
    claim: 'The two words make a wordplay'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'A Hebrew wordplay connects the “summer fruit” (qāyiṣ) with God’s pronouncement of the coming “end” (qēṣ).'
  - where: 'note 8:1 “Summer fruit and the end”'
    claim: 'Amos’s answer is two words in Hebrew, and its wording is what makes the wordplay possible'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Some have taken Amos’s brief responses (just one word and two words in Hebrew) to mean that he was in the dark … Amos’s precise wording was the only possible answer that could have provided the wordplay God was looking for.'
  - where: 'note 8:1 “Summer fruit and the end”'
    claim: 'The lexicon lists this verse under the end of a people, with Ezekiel 7:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/7093.htm'
    quote: 'end of life, of a people Amos 8:2; Ezekiel 7:2 (twice in verse)'

  # ---- note 8:2 ----
  - where: 'note 8:2 “To pass by is to pardon”'
    claim: '“Forgive” or “pardon” is the likely sense in 7:8 and 8:2'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Something like “forgive” or “pardon” is the most likely fit for the context of Amos 7:8 and 8:2.'
  - where: 'note 8:2 “To pass by is to pardon”'
    claim: 'The third and fourth visions are a pair in which Amos only names the object'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'These answers are Amos’s final words in these two visions; God does all the talking from this point forward.'
  - where: 'note 8:2 “To pass by is to pardon”'
    claim: 'Third vision Amos 1, God 26; fourth vision Amos 2, God 28'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Fourth vision: Amos, 2 God, 28'
  - where: 'note 8:2 “To pass by is to pardon”'
    claim: 'What the study concludes from the count'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Given the intercessory content of Amos’s words in the first two visions, his diminished speaking role in the final two visions highlights that the option to intercede has been withdrawn.'

  # ---- note 8:3 temple ----
  - where: 'note 8:3 “Temple songs, or palace songs”'
    claim: 'The Hebrew word means palace or temple, and the lexicon lists this verse under “palace”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1964.htm'
    quote: 'הֵיכָל noun masculine … palace, temple … Amos 8:3 and palace-songs shall be howlings in that day'
  - where: 'note 8:3 “Temple songs, or palace songs”'
    claim: 'A modern translation has “temple” in the text and “palace” in the margin'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: '8.3 Or palace'
  - where: 'note 8:3 “Temple songs, or palace songs”'
    claim: 'A modern translation’s text of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: '3 The songs of the temple shall become wailings on that day,”'
  - where: 'note 8:3 “Temple songs, or palace songs”'
    claim: 'A Latter-day Saint study takes the verse of singers at the temple'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Amos 6:9–10 describes men at a house, while Amos 8:3 describes singers at the temple.'

  # ---- note 8:3 hush ----
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'The word is an interjection, “hush,” and the lexicon takes it as said by those casting out the corpses'
    key: bdb
    url: 'https://biblehub.com/hebrew/2013.htm'
    quote: 'interjection hush! keep silence (probably onomatopoetic) … Amos 8:3 (elliptical) in every place: הִשְׁלִיךְ הָֽס they cast them (the corpses) forth, (saying) Hysh !'
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'Most modern translations render it as a command'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Most modern-English translations do render it as a command, such as in this example from the New Revised Standard Version'
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'A modern translation ends the Lord’s speech with “Be silent!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: '“the dead bodies shall be many, cast out in every place. Be silent!”'
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'The common reading ties the verse to 6:10 and hears a human cry'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'commentators then interpret has in Amos 8:3 the same way, as the cry of humans responding to the carnage.'
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'The study’s two objections and its proposal that the Lord gives the command'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'the two passages share not a single vocabulary word … Given those reasons, and although it runs against most commentaries, I suggest it is the Lord who commands “Silence!” at the close of the fourth vision.'
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'The grammar points away from a change of speaker'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Second, I believe the grammatical evidence from Amos 8:3 points away from a change of speakers midway through that verse, meaning God is still speaking clear to the end.'
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'The command is addressed to Amos'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'If no change of speaker occurs in 8:3, then the most logical conclusion is that God continues to address Amos.'
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'Its purpose, on this reading, is to end the interceding, at the point where the people themselves are struck'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'I find it plausible that the purpose of this order is to cut off any further intercession. … This is also perhaps the point where Amos might most wish to intercede.'
  - where: 'note 8:3 “Who says “Hush”?”'
    claim: 'The Septuagint’s rendering of the end of the verse'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/8.htm'
    quote: 'there shall be many a fallen one in every place; I will bring silence upon them.'

  # ---- note 8:5 new moon ----
  - where: 'note 8:5 “The new moon and the sabbath, kept and resented”'
    claim: 'The law appointed sacrifices at the new moon; the prophets pair it with the sabbath'
    key: bd-new-moon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/new-moon?lang=eng'
    quote: 'The law appointed that at the new moon special sacrifices should be offered (Num. 10:10; see also 1 Sam. 20:5–6, 29; 2 Kgs. 4:23; Amos 8:5). The prophets often speak of “new moons” along with “Sabbaths.”'
  - where: 'note 8:5 “The new moon and the sabbath, kept and resented”'
    claim: 'The new-moon offerings are for the beginnings of the months (Numbers 28:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'And in the beginnings of your months ye shall offer a burnt offering unto the Lord'

  # ---- note 8:5 ephah ----
  - where: 'note 8:5 “A small measure, a heavy weight, and false scales”'
    claim: 'The ephah is a dry measure, a tenth of a homer'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Ephah (dry). Said to be equivalent to a bath; one-tenth of a homer.'
  - where: 'note 8:5 “A small measure, a heavy weight, and false scales”'
    claim: 'Silver was weighed before coinage, and the shekel was a weight'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Thus silver and gold were calculated by weight until coinage became popular (probably 5th century B.C., after the Babylonian exile) … Originally a shekel was a term for a certain weight; later it became a term for the value of a piece of money.'
  - where: 'note 8:5 “A small measure, a heavy weight, and false scales”'
    claim: 'The Church’s footnotes on “ephah” and “balances” give the laws'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/8?lang=eng'
    quote: 'Lev. 19:36; Deut. 25:15 (14–15); Ezek. 45:10.'
  - where: 'note 8:5 “A small measure, a heavy weight, and false scales”'
    claim: 'These practices were forbidden by the law'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In each of these cases, the elite took advantage of the poor to increase their own profits, actions forbidden by the law (Leviticus 19:35–36; 25:14).'
  - where: 'note 8:5 “A small measure, a heavy weight, and false scales”'
    claim: '“Refuse” is what falls, the refuse of wheat'
    key: bdb
    url: 'https://biblehub.com/hebrew/4651.htm'
    quote: '1 fallings, refuse, construct מַמַּל בַּר Amos 8:6 the refuse of wheat.'
  - where: 'note 8:5 “A small measure, a heavy weight, and false scales”'
    claim: 'A modern translation has “sweepings”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: 'and selling the sweepings of the wheat.'
  - where: 'note 8:5 “A small measure, a heavy weight, and false scales”'
    claim: 'The cheated poor are then bought as slaves'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'When the disadvantaged could no longer operate under these circumstances, the elite in Israel would “buy the poor for silver, and the needy for a pair of shoes” (Amos 8:6)'

  # ---- note 8:7 ----
  - where: 'note 8:7 “An oath by the pride of Jacob”'
    claim: 'The Church’s footnote on “excellency” here points to Amos 6:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/8?lang=eng'
    quote: 'Amos 6:8.'
  - where: 'note 8:7 “An oath by the pride of Jacob”'
    claim: 'The footnote at 6:8 gives the Hebrew as pride'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng'
    quote: 'HEB pride. Amos 8:7.'
  - where: 'note 8:7 “An oath by the pride of Jacob”'
    claim: 'An older commentary takes the pride of Jacob as the Lord Himself'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/8.htm'
    quote: 'The pride of Jacob is Jehovah, as in Hosea 5:5 and Hosea 7:10. Jehovah swears by the pride of Jacob, as He does by His holiness in Amos 4:2, or by His soul in Amos 6:8, i.e., as He who is the pride and glory of Israel'
  - where: 'note 8:7 “An oath by the pride of Jacob”'
    claim: 'To forget a sin is to leave it unpunished'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/8.htm'
    quote: 'to forget a sin, i.e., to leave it unpunished.'
  - where: 'note 8:7 “An oath by the pride of Jacob”'
    claim: 'The Septuagint has the Lord swear against the pride of Jacob'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/8.htm'
    quote: 'The Lord swears against the pride of Jacob, None of your works shall ever be forgotten.'

  # ---- note 8:8 ----
  - where: 'note 8:8 “The land rising and sinking like the Nile”'
    claim: 'The Church’s footnote gives the Hebrew of the last clause'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/8?lang=eng'
    quote: 'HEB overflow and recede like the river of Egypt.'
  - where: 'note 8:8 “The land rising and sinking like the Nile”'
    claim: 'The Hebrew noun in “flood of Egypt” is the word for the Nile'
    key: bdb
    url: 'https://biblehub.com/hebrew/2975.htm'
    quote: '1 stream of the Nile, river Nile, usually with article'
  - where: 'note 8:8 “The land rising and sinking like the Nile”'
    claim: 'The lexicon lists Amos 8:8 and 9:5 under the Nile, in the fuller phrase “Nile of Egypt”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2975.htm'
    quote: 'more fully יְאֹר מִצְרַיִם Amos 8:8; Amos 9:5.'
  - where: 'note 8:8 “The land rising and sinking like the Nile”'
    claim: 'A modern translation names the Nile'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: 'and all of it rise like the Nile, and be tossed about and sink again, like the Nile of Egypt?'

  # ---- note 8:9 ----
  - where: 'note 8:9 “Sunset at noon”'
    claim: 'The sun setting at noon read of a man, of a nation destroyed in prosperity, and of the Second Coming'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'A man’s sun can be said to set at noon if he is taken by death during the prime of his life. A nation’s sun figuratively sets at noon when the country is destroyed in the midst of prosperity.'
  - where: 'note 8:9 “Sunset at noon”'
    claim: 'The sun sets at noon for a man snatched away in the midst of life, and for a nation destroyed in the midst of prosperity (the commentary the Student Manual cites)'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/8.htm'
    quote: 'But to any man the sun sets at noon, when he is suddenly snatched away by death, in the very midst of his life. And this also applies to a nation when it is suddenly destroyed in the midst of its earthly prosperity.'
  - where: 'note 8:9 “Sunset at noon”'
    claim: 'A modern translation of the second line of verse 9'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: 'I will make the sun go down at noon and darken the earth in broad daylight.'
  - where: 'note 8:9 “Sunset at noon”'
    claim: 'The prophecy is called dual and read also of the Second Coming'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'But Amos’ dual prophecy is also a reminder that before the Second Coming of the Lord, the sun will be darkened and refuse to give her light.'

  # ---- note 8:11 ----
  - where: 'note 8:11 “The famine of hearing the words of the Lord”'
    claim: 'Those who would not hear the prophets will long for the word when it is withdrawn'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/8.htm'
    quote: 'the light of His revelation. They who will not now hear His word, as proclaimed by the prophets, will then cherish the greatest longing for it.'
  - where: 'note 8:11 “The famine of hearing the words of the Lord”'
    claim: 'Earlier famines were physical and meant to turn the people back; this one is different'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'In earlier times, God had sent physical famines to help turn the people back to Him, but they still refused to repent. In chapter 8, Amos prophesied of a different type of famine'
  - where: 'note 8:11 “The famine of hearing the words of the Lord”'
    claim: 'One fulfillment was the 400 years after Malachi'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'One fulfillment of this prophecy occurred after the ministry of the prophet Malachi, when more than 400 years passed without divinely called prophets ministering in the land of Israel.'
  - where: 'note 8:11 “The famine of hearing the words of the Lord”'
    claim: 'It was fulfilled again in the apostasy after the Apostles, until the Restoration'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Following the deaths of the Savior and His Apostles, the Church fell into apostasy and the people no longer received God’s words through living prophets.'
  - where: 'note 8:11 “The famine of hearing the words of the Lord”'
    claim: 'Elder Spencer W. Kimball announced that the famine is ended (as the Student Manual prints it)'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'Elder Spencer W. Kimball said, “After centuries of spiritual darkness, … we solemnly announce to all the world that the spiritual famine is ended, the spiritual drought is spent'
  - where: 'note 8:11 “The famine of hearing the words of the Lord”'
    claim: 'The rest of the statement, in Amos’s terms'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'One needs not wander from sea to sea nor from the north to the east, seeking the true gospel as Amos predicted, for the everlasting truth is available.'

  # ---- note 8:14 ----
  - where: 'note 8:14 “Three oaths, from Dan to Beer-sheba”'
    claim: '“Sin of Samaria” is the guilt of Samaria, explained as their idols'
    key: bdb
    url: 'https://biblehub.com/hebrew/819.htm'
    quote: 'אַשְׁמַת שֹׁמְרוֺן guilt of Samaria (their idols) Amos 8:14.'
  - where: 'note 8:14 “Three oaths, from Dan to Beer-sheba”'
    claim: 'A modern translation reads a name, and “way” for “manner”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos+8&version=NRSVUE'
    quote: '14 Those who swear by Ashimah of Samaria and say, “As your god lives, O Dan,” and, “As the way of Beer-sheba lives”—'
  - where: 'note 8:14 “Three oaths, from Dan to Beer-sheba”'
    claim: 'The Septuagint’s rendering of the three oaths'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/8.htm'
    quote: 'they who swear by the propitiation of Samaria, and who say, Thy god, O Dan, lives; and, Thy god, O Bersabee, lives; and they shall fall, and shall no more rise again.'
  - where: 'note 8:14 “Three oaths, from Dan to Beer-sheba”'
    claim: 'Dan was the northern limit and a seat of Jeroboam’s calf worship'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'This town is well known as the northern limit of Palestine, which extended “from Dan even to Beer-sheba.” It was chosen by Jeroboam as one of the places in which to establish the calf worship for the northern tribes (1 Kgs. 12:29; 2 Kgs. 10:29).'
  - where: 'note 8:14 “Three oaths, from Dan to Beer-sheba”'
    claim: 'Jeroboam set one golden calf in Beth-el and the other in Dan (1 Kings 12:28–29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'And he set the one in Beth-el, and the other put he in Dan.'
  - where: 'note 8:14 “Three oaths, from Dan to Beer-sheba”'
    claim: 'The Hebrew word is “way” (derek); the lexicon reads a journey to Beersheba and doubts the text'
    key: bdb
    url: 'https://biblehub.com/hebrew/1870.htm'
    quote: 'Amos 8:14 (journey of — to — Beersheba compare Hi St; but text dubious, ᵐ5 ὁ θεός'
  - where: 'note 8:14 “Three oaths, from Dan to Beer-sheba”'
    claim: 'Beersheba was the southern limit of Israel'
    key: bd-beersheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beersheba?lang=eng'
    quote: 'It was afterwards in the tribe of Simeon (Josh. 19:2) and was regarded as the southern limit of Israel (Judg. 20:1; 1 Sam. 3:20).'
  - where: 'note 8:14 “Three oaths, from Dan to Beer-sheba”'
    claim: 'Idolatry and treading on the poor are the two dominant sins; 8:14 and 8:4–5 are cited'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'But two sins are dominant in his appeal to God for a swift judgment against Israel. First, the Israelites have turned from Jehovah to idolatry. … (Amos 5:24–26; see also 2:8; 8:14). Second, they have severely treaded upon the poor.'

