page: jacob-arise
claims:
  - where: 'section “Shown first, and heard”'
    claim: 'Forgive and cease are commands, even in Hebrew'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Both “forgive” and “cease” are commands, even in Hebrew, suggesting Amos’s urgency.'
  - where: 'section “Shown first, and heard”'
    claim: 'The Bible Dictionary names the intercession of good men in Gen. 18 and Ex. 32'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'The efficacy of the intercession of good men was recognized (Gen. 18:23; 20:7; Ex. 32:11).'
  - where: 'section “Shown first, and heard”'
    claim: 'The verb of “The LORD repented” (nḥm, H5162) in Amos 7:3, 6 is the verb of Ex. 32:12, 14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'נִחַ֥ם'
  - where: 'section “Shown first, and heard”'
    claim: 'The same verb in Ex. 32:12 and 32:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וַיִּנָּחֶם'
  - where: 'section “I will not again pass by them any more”'
    claim: 'Amos’s final words in these visions; God speaks alone from here'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'These answers are Amos’s final words in these two visions; God does all the talking from this point forward.'
  - where: 'section “I will not again pass by them any more”'
    claim: '“Pass by” most likely means forgive or pardon (Sears)'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Something like “forgive” or “pardon” is the most likely fit for the context of Amos 7:8 and 8:2.'
  - where: 'section “I will not again pass by them any more”'
    claim: 'The Lord is denying any new attempts to intercede'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'God, more than simply denying forgiveness, is also denying any new attempts to intercede.'
  - where: 'section “What is left looks like loss”'
    claim: 'On 3:12, the bits are proof that total loss was unavoidable (Wolff, as Spencer reports)'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'proof that total loss was unavoidable'
  - where: 'section “What is left looks like loss”'
    claim: 'On 5:15, survival without God’s gracious attention would be mere survival, not life'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'any continued existence for a remnant of Israel without God’s gracious attention would be mere survival—not life.'
  - where: 'section “What is left looks like loss”'
    claim: 'Connection made by this page: the song says no one will raise her (5:2, Hiphil of qum) and the plea asks by whom Jacob will arise (7:2, 5, Qal of qum); the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'מְקִימָֽ/הּ'
  - where: 'section “What is left looks like loss”'
    claim: 'Connection made by this page (second half): the plea’s verb in 7:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'יָק֖וּם'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'The Church’s edition prints for Amos 7:3 the Lord’s answer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-amos/7?lang=eng&id=p3#p3'
    quote: 'And the Lord said, concerning Jacob, Jacob shall repent for this, therefore I will not utterly destroy him, saith the Lord.'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'Connection made by this page: in the Church’s edition the answer to the plea (JST 7:3) and the sentence of 9:8 are the same words, both said of Jacob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'saving that I will not utterly destroy the house of Jacob, saith the LORD.'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'Connection made by this page: the verb qum in 5:2, 7:2, 7:5 and 9:11 (ten occurrences in eight verses: 2:11; 5:2 twice; 6:14; 7:2; 7:5; 7:9; 8:14; 9:11 twice) and “fallen” (naphal) in 5:2 and 9:11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'אָקִ֛ים'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'The verb of 8:14 and of 9:11’s “fallen”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'הַ/נֹּפֶ֑לֶת'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'The verb qum in 7:9, “I will rise against the house of Jeroboam”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'וְ/קַמְתִּ֛י'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'The verb of 8:14 “never rise up again”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'יָק֥וּמוּ'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'The kingdom would be raised up again from its fallen condition (Keil)'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'it would not utterly perish, but would be raised up again from its fallen condition'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'Keil: the kingdom of David could only be raised up again through an offshoot from David’s family'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'The kingdom of David could only be raised up again through an offshoot from David''s family.'
  - where: 'section “Not utterly,” and “I will raise up”'
    claim: 'Keil: that this can be no other than the Messiah'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'And that this can be no other than the Messiah'
  - where: 'section “The Advocate, and the heir of the house”'
    claim: 'Sears: Latter-day Saints may read prophetic intercession as typological for Jesus'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'through a doctrinal lens that understands prophetic intercession as typological for the role of Jesus'
  - where: 'section “The Advocate, and the heir of the house”'
    claim: 'Connection made by this page: Amos’s “not again… any more” set beside Christ who “ever liveth to make intercession”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'seeing he ever liveth to make intercession for them'
  - where: 'section “The Advocate, and the heir of the house”'
    claim: 'Connection made by this page (second half): D&C 38:4 beside the visions'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'have I pleaded before the Father for them'
  - where: 'section “The Advocate, and the heir of the house”'
    claim: 'Connection made by this page: the house of Jacob in 9:8 beside the house Gabriel names'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'he shall reign over the house of Jacob for ever; and of his kingdom there shall be no end'
  - where: 'section “The Advocate, and the heir of the house”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'section “The Advocate, and the heir of the house”'
    claim: 'Elder Renlund: Christ’s advocacy is not adversarial; He would not champion anything other than what the Father has wanted'
    key: renlund-choose-you-this-day
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/10/choose-you-this-day?lang=eng'
    quote: 'Christ’s advocacy with the Father in our behalf is not adversarial. Jesus Christ, who allowed His will to be swallowed up in the will of the Father, would not champion anything other than what the Father has wanted all along.'
