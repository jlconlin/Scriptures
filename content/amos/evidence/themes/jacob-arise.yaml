page: jacob-arise
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Keil renders 5:2 “she does not rise up again; … no one sets her up”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'she does not rise up again; cast down upon her soil; no one sets her up.'
  - where: 'opening'
    claim: 'The Cambridge Bible on 5:2: unable to rise by her own efforts, having none to assist her'
    key: cambridge-amos
    url: 'https://biblehub.com/commentaries/cambridge/amos/5.htm'
    quote: 'unable to rise by her own efforts (having none to assist her'
  - where: 'opening'
    claim: '5:2 “rise” is qûm (H6965) Qal infinitive; “none to raise her up” is mĕqîmāh, Hiphil participle of the same root'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'מְקִימָֽ/הּ'
  - where: 'opening'
    claim: '5:2 “is fallen,” nāpĕlâ (H5307)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'נָֽפְלָה֙'
  - where: 'opening'
    claim: 'Connection made by this page: the book answers its own song; the song’s verbs (fallen, rise/raise) return in Amos’s question (7:2, 5) and in the Lord’s promise (9:11), where the Lord alone is the subject of “raise up”; no commentary read sets 5:2 and 9:11 together; the Christian reading of 9:11 is James’s and the footnote’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'In that day will I raise up the tabernacle of David that is fallen'

  # ---------- How can Jacob stand? ----------
  - where: 'section “How can Jacob stand?”'
    claim: 'Sears offers Latter-day Saint readers the reading of prophetic intercession as typological for Jesus'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'through a doctrinal lens that understands prophetic intercession as typological for the role of Jesus'
  - where: 'section “How can Jacob stand?”'
    claim: '7:2 and 7:5 mî yāqûm Yaʿăqōb: yāqûm is Qal imperfect of qûm (H6965), “stand,” with mî “who?” and no preposition'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'יָק֖וּם'
  - where: 'section “How can Jacob stand?”'
    claim: 'Keil renders 7:2 “how can Jacob stand (not arise), since it is small?”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/7.htm'
    quote: 'can Jacob (the nation of Israel) stand (not arise), since it is small?'
  - where: 'section “How can Jacob stand?”'
    claim: 'The Cambridge Bible on 7:2: how (lit. as who) shall Jacob stand?'
    key: cambridge-amos
    url: 'https://biblehub.com/commentaries/cambridge/amos/7.htm'
    quote: 'how (lit. as who) shall Jacob stand?'
  - where: 'section “How can Jacob stand?”'
    claim: 'Ellicott on 7:2: the King James “by whom” is incorrect'
    key: ellicott-amos
    url: 'https://biblehub.com/commentaries/ellicott/amos/7.htm'
    quote: '(E.V., “by whom,” is incorrect)'
  - where: 'section “How can Jacob stand?”'
    claim: 'BDB puts Amos 5:2 and 8:14 under the Qal sense “after falling” (rise), a different sense from 7:2, 5'
    key: bdb
    url: 'https://biblehub.com/hebrew/6965.htm'
    quote: 'after falling Amos 5:2; Amos 8:14'
  - where: 'section “How can Jacob stand?”'
    claim: 'BDB lists Amos 7:2, 5 under the Qal sense “maintain oneself”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6965.htm'
    quote: 'maintain oneself Joshua 7:12,13 (J E; לִפְנֵי person), Amos 7:2,5'
  - where: 'section “How can Jacob stand?”'
    claim: 'The Septuagint of 7:2 and 7:5: τίς ἀναστήσει τὸν Ἰακώβ, “who will raise up Jacob?”, transitive with Jacob as object'
    key: swete-lxx-amos
    url: 'https://biblehub.com/sepd/amos/7.htm'
    quote: 'τίς ἀναστήσει τὸν Ἰακώβ'
  - where: 'section “How can Jacob stand?”'
    claim: 'The Septuagint of 5:2 uses ἀνίστημι for “rise” and “none to raise her up” (ὁ ἀναστήσων αὐτήν)'
    key: swete-lxx-amos
    url: 'https://biblehub.com/sepd/amos/5.htm'
    quote: 'οὐκ ἔστιν ὁ ἀναστήσων αὐτήν'
  - where: 'section “How can Jacob stand?”'
    claim: 'The Septuagint of 9:11: ἀναστήσω, “I will raise up,” the same Greek verb'
    key: swete-lxx-amos
    url: 'https://biblehub.com/sepd/amos/9.htm'
    quote: 'ἀναστήσω τὴν σκηνὴν Δαυεὶδ τὴν πεπτωκυῖαν'
  - where: 'section “How can Jacob stand?”'
    claim: 'Sears: the arrangement suggests the Lord is denying new attempts to intercede'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'denying any new attempts to intercede'
  - where: 'section “How can Jacob stand?”'
    claim: 'Connection made by this page: Amos’s question (Hebrew, “how can Jacob stand”) and the song’s “she shall no more rise” share the root qûm in two lexical senses, and the join by root and sense is the page’s own; the King James “by whom” agrees with the Septuagint’s transitive reading; the reprieves of 7:3, 6 are withdrawn at 7:8, 8:2 and the question is read as open until 9:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/7?lang=eng'
    quote: 'by whom shall Jacob arise? for he is small.'

  # ---------- I will raise up ----------
  - where: 'section “I will raise up”'
    claim: '9:11 “raise up” is ʾāqîm, Hiphil of qûm, twice; “that is fallen” is hannōpelet, participle of nāpal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'אָקִ֛ים'
  - where: 'section “I will raise up”'
    claim: '9:11 “that is fallen,” hannōpelet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'הַ/נֹּפֶ֑לֶת'
  - where: 'section “I will raise up”'
    claim: 'qûm (H6965) stands ten times in eight verses of Amos: 2:11; 5:2 (twice); 6:14; 7:2; 7:5; 7:9; 8:14; 9:11 (twice)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'וָ/אָקִ֤ים'
  - where: 'section “I will raise up”'
    claim: '8:14 “never rise up again,” yāqûmû'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'יָק֥וּמוּ'
  - where: 'section “I will raise up”'
    claim: 'The Cambridge Bible on 8:14 cross-refers to 5:2'
    key: cambridge-amos
    url: 'https://biblehub.com/commentaries/cambridge/amos/8.htm'
    quote: 'Cf. Amos 5:2'
  - where: 'section “I will raise up”'
    claim: 'Keil on 8:14: the swearers are the young men and virgins, who represent the nation as a whole'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/8.htm'
    quote: 'to the nation as a whole'
  - where: 'section “I will raise up”'
    claim: '9:11 “tabernacle” is sukkah (H5521), a booth'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'סֻכַּ֥ת'
  - where: 'section “I will raise up”'
    claim: 'Keil on 9:11: the kingdom would be raised up again from its fallen condition, according to the promise in 2 Sam. 7'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'would be raised up again from its fallen condition'
  - where: 'section “I will raise up”'
    claim: 'Keil: the kingdom of David could only be raised up again through an offshoot from David’s family; the earlier Jews formed a name for the Messiah from this passage, bar naphlin, He who had sprung from a fallen hut'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'could only be raised up again through an offshoot from David'
  - where: 'section “I will raise up”'
    claim: 'Keil: the earlier Jews formed a name for the Messiah out of this passage'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'formed a name for the Messiah out of this passage'
  - where: 'section “I will raise up”'
    claim: 'Keil: He who had sprung from a fallen hut'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'He who had sprung from a fallen hut'
  - where: 'section “I will raise up”'
    claim: 'The Bible Dictionary “Amos”: in the last days the kingdom will return to and even surpass its ancient glory (9:11–15)'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'in the last days the kingdom will return to and even surpass its ancient glory (9:11–15)'
  - where: 'section “I will raise up”'
    claim: 'The Guide to the Scriptures “David”: David’s reign regarded as the type of the more glorious age when the Messiah would come'
    key: gs-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/david?lang=eng'
    quote: 'the type of the more glorious age when the Messiah would come'
  - where: 'section “I will raise up”'
    claim: 'Keil on 9:11: the plural “breaches” shows the house of Israel, not utterly destroyed (9:8), consisted of the remnant of both kingdoms, to be united under one king'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'the house of Israel, which was not to be utterly destroyed (Amos 9:8), consisted of the remnant of the people of the two kingdoms'
  - where: 'section “I will raise up”'
    claim: 'Keil on 9:8: the house of Jacob is not to be utterly destroyed, but shaken as in a sieve'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'is not to be utterly destroyed, but simply to be shaken, as it were, in a sieve.'
  - where: 'section “I will raise up”'
    claim: 'Sears (n. 25) reports that scholars usually assign the last five verses of Amos to a later editor'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'later editor'
  - where: 'section “I will raise up”'
    claim: 'Spencer (n. 17) reports Jeremias’s suggestion that Amos originally ended at 9:1–4'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'suggests that the book of Amos originally ended with this devastating announcement. In final form, Amos contains another eleven verses.'
  - where: 'section “I will raise up”'
    claim: 'The Bible Dictionary reads 9:11–15 as Amos’s promise for the last days (cited for the Church’s reading of the ending)'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'in the last days the kingdom will return'
  - where: 'section “I will raise up”'
    claim: 'Connection made by this page: 9:11 takes up the song’s two verbs (Hiphil qûm, nāpal) with the Lord as subject, after 8:14 has repeated the song’s verdict; the pairing of 5:2 with 9:11 is the page’s own; 7:2 joins them through the Greek and the sense that Israel cannot stand alone; the authorship question is reported, not resolved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/5?lang=eng'
    quote: 'The virgin of Israel is fallen; she shall no more rise: she is forsaken upon her land; there is none to raise her up.'

  # ---------- The Son of David ----------
  - where: 'section “The Son of David”'
    claim: 'The Church’s footnote at Amos 9:11 “tabernacle” leads to Acts 15:16 (15–17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'Acts 15:16 (15–17).'
  - where: 'section “The Son of David”'
    claim: 'Judd: James declared that Peter’s experiences fulfilled Amos’s prophecy that non-Israelites would seek after the truth of the Lord'
    key: judd-jerusalem-conference
    url: 'https://rsc.byu.edu/vol-12-no-1-2011/jerusalem-conference-first-council-christian-church'
    quote: 'declared that they fulfilled Amos’s prophecy that non-Israelites would seek after the truth of the Lord'
  - where: 'section “The Son of David”'
    claim: 'The New Testament Student Manual: James cited Amos 9:11–12 as scriptural support that Gentiles would seek after the Lord'
    key: nt-student-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/acts/chapter-32-acts-13-15?lang=eng'
    quote: 'first cited scriptural support for Peter’s words, referring to the prophecy in Amos 9:11–12 that Gentiles would seek after the Lord'
  - where: 'section “The Son of David”'
    claim: 'McClellan: James’s quotation follows the Septuagint, “remnant of Edom” read as “residue of men” (ʾādām for ʾĕdôm), “possess” as “seek after”'
    key: mcclellan-ot-in-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/use-old-testament-new-testament'
    quote: 'Instead of referring to the “remnant of Edom,” the version in Acts refers to the “residue of men,” which reflects a reading of the Hebrew אדום (’edôm, “Edom”) as אדם (’adam, “humanity”).'
  - where: 'section “The Son of David”'
    claim: 'Keil: the deviations of Acts 15:16 may be explained by the apostle quoting from memory and altering the words to make the Messianic allusion clearer'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'to give greater clearness to the allusion contained in the prnophecy to the Messianic times'
  - where: 'section “The Son of David”'
    claim: 'Acts 15:16 Greek has ἀναστρέψω, ἀνοικοδομήσω and ἀνορθώσω, not Amos’s ἀναστήσω'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/acts/15-16.htm'
    quote: 'ἀνοικοδομήσω'
  - where: 'section “The Son of David”'
    claim: 'Ellicott on Acts 15:16: the quotation suggests, perhaps implies, more than James’s recorded speech; it assumes the tabernacle of David was being rebuilt by Christ, the Son of David'
    key: ellicott-acts
    url: 'https://biblehub.com/commentaries/ellicott/acts/15.htm'
    quote: 'The quotation suggests, perhaps implies, a fuller interpretation than is given in the summary of St. James’s speech. It assumes that the “tabernacle of David,” which to human eyes had been lying as in ruins, was being rebuilt by Christ, the Son of David, that He was doing the work which, in the prophecy, Jehovah claimed as His.'
  - where: 'section “The Son of David”'
    claim: 'The Cambridge Bible on Acts 15:16: the booth applied to the Jews brought very low, yet finding in Him a Saviour'
    key: cambridge-acts
    url: 'https://biblehub.com/commentaries/cambridge/acts/15.htm'
    quote: 'This word may be applied to the estate of the Jews when the Deliverer should come, to indicate that they should be brought very low, but yet should find in him a Saviour.'
  - where: 'section “The Son of David”'
    claim: 'The Guide to the Scriptures: Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'premortal Jesus Christ'
  - where: 'section “The Son of David”'
    claim: 'Connection made by this page: James applied 9:11–12 to the Gentiles seeking the Lord (Judd, the Student Manual); the reading of the promise as Christ’s work is Ellicott’s inference, supported by Keil’s “offshoot from David’s family” and Luke 1:32; the step from the song to the promise is the page’s own'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/15?lang=eng'
    quote: 'After this I will return, and will build again the tabernacle of David, which is fallen down'

  # ---------- He is small ----------
  - where: 'section “He is small”'
    claim: 'Sears: Amos does not appeal to the people’s righteousness or repentance'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Amos does not appeal to the people’s righteousness or repentance'
  - where: 'section “He is small”'
    claim: 'Spencer on 5:14–15: Amos ties promises to the commands to seek and love the good, and hopes only as a possibility; he accepts Paul Noble’s point that the “perhaps” concerns whether the remnant will enjoy God’s favor'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'whether or not it will enjoy God’s favor'
  - where: 'section “He is small”'
    claim: 'Spencer: tying promises to commandments (to seek and to love the good)'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'Tying promises to commandments (to “seek” and to “love” the good)'
  - where: 'section “He is small”'
    claim: 'Spencer on 5:15: survival without God’s gracious attention would be mere survival, not life'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'would be mere survival—not life'
  - where: 'section “He is small”'
    claim: 'Connection made by this page: what cannot stand is raised rather than told to stand harder, the page’s reading of the book’s shape, set beside the book’s own “Seek ye me” (5:4) and grounded for the disciple in Ether 12:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/7?lang=eng'
    quote: 'for he is small'
