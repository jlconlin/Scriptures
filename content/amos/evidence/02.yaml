chapter: 2
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Amos’s ministry is dated about 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC), it appears these covenants had been disregarded not only by Israel’s neighbors, but by the Israelites themselves'
  - where: 'when'
    claim: 'Amos prophesied under Uzziah of Judah and Jeroboam II of Israel, in the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The prophet Amos prophesied in the days of Uzziah, king of Judah (died about 740 B.C.)'

  # ---- setting ----
  - where: 'setting'
    claim: 'Chapters 1–2 are the book’s first part: judgments on the nations, Judah and Israel'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 1–2: Prophecies of judgment against various nations, including Judah and Israel, for their wickedness.'
  - where: 'setting'
    claim: 'This chapter’s three judgments are on Moab, Judah and Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/2?lang=eng'
    quote: 'The Lord will pour out judgments upon Moab, Judah, and Israel for their unrighteousness.'
  - where: 'setting'
    claim: 'Amos was from Tekoa, south of Jerusalem, and ministered in the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'a native of Tekoa, 12 miles south of Jerusalem, but his ministry was among those of the northern kingdom of Israel'
  - where: 'setting'
    claim: 'Jeroboam II was king of Israel in Amos’s time'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'He lived in the eighth century BC during the reigns of King Uzziah of Judah and King Jeroboam II of Israel.'
  - where: 'setting'
    claim: 'Moab lay east of the Dead Sea; the Moabites were kin to Israel and constantly at war with it'
    key: bd-moab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'The land of Moab lay east of the Dead Sea. The Moabites were akin to the Israelites and spoke a language that closely resembled Hebrew, but there was constant warfare between the two nations'
  - where: 'setting'
    claim: 'The time was one of peace and prosperity, with no sign yet of ruin'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Israelite society bore no marks of such destruction. Instead, the Israelites were enjoying an era of peace and prosperity (2 Kings 14:23–29).'
  - where: 'setting'
    claim: 'Assyria conquered the northern kingdom'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Many of the people of Israel rejected the warnings of Amos and the other prophets, and they were conquered by the Assyrians in 722 BC.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The oracles against the nations are an introduction to the charge against Israel'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'as a subtle and persuasive introduction to the condemnation he was about to pronounce upon Israel’s social elite'
  - where: 'thread'
    claim: 'Israel’s oracle has three parts: the sins (6–8), contempt of the Lord’s benefits (9–12), the threatened trouble (13–16)'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/2.htm'
    quote: 'condemning first of all the prevailing crimes of injustice and oppression, of shameless immorality and daring contempt of God (Amos 2:6-8); and secondly, its scornful contempt of the benefits conferred by the Lord (Amos 2:9-12)'
  - where: 'thread'
    claim: 'The punishments are aimed at the elite; Moab’s judge and princes are the example'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Taken together, Amos’s pronouncements of punishment are directly pointed at the elite'

  # ---- sections ----
  - where: 'thread'
    claim: 'The focus on the elite holds for Israel as well as the foreign nations'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'This focus on the elite is not reserved for the foreign nations condemned by the prophet'

  - where: 'section 3 plain'
    claim: '“The righteous” rendered “the innocent,” and “shoes” as sandals'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%202%3A6-13&version=NIV'
    quote: 'They sell the innocent for silver, and the needy for a pair of sandals.'
  - where: 'section 3 plain'
    claim: 'Verse 7’s second line rendered as pushing the afflicted out of the way'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%202&version=NRSVUE'
    quote: 'they who trample the head of the poor into the dust of the earth and push the afflicted out of the way'

  # ---- note 2:1 ----
  - where: 'note 2:1 “A dead king’s body desecrated”'
    claim: 'Moab’s is the last charge of brutality in war; desecrating remains was not permitted in Israel’s law even for criminals'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Such desecration of human remains is not only an act of violence but a disregard for the individual’s life, an act that is not even permitted for criminals in Israelite law (Deuteronomy 21:22–23).'
  - where: 'note 2:1 “A dead king’s body desecrated”'
    claim: 'This is Amos’s final reference to martial brutality'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Amos’s final reference to martial brutality relates the atrocities of Moab.'
  - where: 'note 2:1 “A dead king’s body desecrated”'
    claim: 'On one reading Amos holds nations to an ethical standard even in war'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Amos argues that even when nation-states are at war with one other, an ethical standard should be maintained for the dignity of humankind.'
  - where: 'note 2:1 “A dead king’s body desecrated”'
    claim: 'The burning was of the corpse; no record of the event survives; it is connected with the war of 2 Kings 3'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'No record has been preserved of this event in the historical books of the Old Testament; but it was no doubt connected with the war referred to in 2 Kings iii.'
  - where: 'note 2:1 “A dead king’s body desecrated”'
    claim: 'The connection is supported from a Jewish tradition found in Jerome, that the Moabites dug up and burned the bones after the war'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'so that the Jewish tradition found in Jerome, viz. that after this war the Moabites dug up the bones of the king of Edom from the grave, and heaped insults upon them by burning them to ashes, is apparently not without foundation.'
  - where: 'note 2:1 “A dead king’s body desecrated”'
    claim: 'In 2 Kings 3 the kings of Israel, Judah and Edom march together against Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'So the king of Israel went, and the king of Judah, and the king of Edom: and they fetched a compass of seven days’ journey'
  - where: 'note 2:1 “A dead king’s body desecrated”'
    claim: 'Jeremiah names Kerioth among the cities of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'And upon Kerioth, and upon Bozrah, and upon all the cities of the land of Moab, far or near.'

  # ---- note 2:4 ----
  - where: 'note 2:4 “Judah is charged with no atrocity, only with rejecting the law”'
    claim: 'A modern translation renders “despised the law” as “rejected the instruction”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%202&version=NRSVUE'
    quote: 'because they have rejected the instruction of the Lord and have not kept his statutes'
  - where: 'note 2:4 “Judah is charged with no atrocity, only with rejecting the law”'
    claim: 'The Church’s footnote on “despised” points to Leviticus 26:14–15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/2?lang=eng'
    quote: '4a “despised”: Lev. 26:14 (14–15).'
  - where: 'note 2:4 “Judah is charged with no atrocity, only with rejecting the law”'
    claim: 'Leviticus 26:15 sets despising the statutes beside breaking the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And if ye shall despise my statutes, or if your soul abhor my judgments, so that ye will not do all my commandments, but that ye break my covenant:'
  - where: 'note 2:4 “Judah is charged with no atrocity, only with rejecting the law”'
    claim: 'The word for “lies” means lie, falsehood, deceptive thing, and BDB takes it in Amos 2:4 of idols'
    key: bdb
    url: 'https://biblehub.com/hebrew/3577.htm'
    quote: 'lie, falsehood, deceptive thing … of idols. as a lie (res ementita) Amos 2:4'

  # ---- note 2:6 structure ----
  - where: 'note 2:6 “The eighth name on the list”'
    claim: 'Israel readily accepted the condemnation of Tyre; Amos had not come to speak comfort'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The Israelites easily recognized and eagerly accepted this condemnation because they were the victims of the covenantal breach from one of their neighboring regional powers.'
  - where: 'note 2:6 “The eighth name on the list”'
    claim: 'The condemnations of the nations in Amos 1–2 are an introduction to the condemnation of Israel’s elite'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Amos, however, did not travel from the southern kingdom of Judah to speak comfort to the ears of the Israelites. Instead, the prophet uses the condemnation of Tyre, as well as the condemnations of other surrounding nations cited in Amos 1–2, as a subtle and persuasive introduction'
  - where: 'note 2:6 “The eighth name on the list”'
    claim: 'Israel had become wicked like its neighbors'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The problem is not that northern Israelites are surrounded by wickedness but that, like their neighbors, they have become wicked themselves.'
  - where: 'note 2:6 “The eighth name on the list”'
    claim: 'The same noun “transgressions” returns in Amos 3:14'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Amos employs this same noun when he speaks for the Lord in declaring “that in the day . . . I shall visit the transgressions of Israel upon him” (3:14; emphasis added).'

  # ---- note 2:6 sold ----
  - where: 'note 2:6 “The eighth name on the list”'
    claim: 'Amos 3:2 makes Israel’s standing as the covenant people the reason its punishment is heavier'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The fact that Israel is the covenant people would make their punishment the heavier (3:2; 9:7).'

  - where: 'note 2:6 “A person sold for the price of sandals”'
    claim: 'The word is “sandal”; the pair in Amos 2:6 is mentioned as of little worth'
    key: bdb
    url: 'https://biblehub.com/hebrew/5275.htm'
    quote: 'sandal Judges 9:13; Amos 2:6; Amos 8:6 (dual = pair of sandals; mentioned as of little worth)'
  - where: 'note 2:6 “A person sold for the price of sandals”'
    claim: 'A modern translation has “the innocent” for “the righteous”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%202%3A6-13&version=NIV'
    quote: 'They sell the innocent for silver, and the needy for a pair of sandals.'
  - where: 'note 2:6 “A person sold for the price of sandals”'
    claim: 'One reading: bribed judges condemning a man who is righteous in the judicial sense'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/2.htm'
    quote: 'Selling the righteous for silver, i.e., for money, refers to the judges, who were bribed to punish a man as guilty of the crime of which he was accused, when he was really tsaddı̄q, i.e., righteous in a judicial, not in a moral sense'
  - where: 'note 2:6 “A person sold for the price of sandals”'
    claim: 'The poor debtor owing a trifle is given up to the creditor as a slave'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/2.htm'
    quote: 'but the poor debtor who could not pay for a pair of shoes, i.e., for the merest trifle, the judge would give up to the creditor for a salve, on the strength of the law in Leviticus 25:39 (cf. 2 Kings 4:1).'
  - where: 'note 2:6 “A person sold for the price of sandals”'
    claim: 'A creditor could take a debtor’s children as bondmen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/4?lang=eng'
    quote: 'the creditor is come to take unto him my two sons to be bondmen'
  - where: 'note 2:6 “A person sold for the price of sandals”'
    claim: 'The law forbade making a poor brother serve as a bondservant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'And if thy brother that dwelleth by thee be waxen poor, and be sold unto thee; thou shalt not compel him to serve as a bondservant:'
  - where: 'note 2:6 “A person sold for the price of sandals”'
    claim: 'Buying the poor for silver (8:6) opposes the kinship law of Leviticus 25:39–43 and leads to enslaving fellow Israelites'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'actions that stand in opposition to the covenant of kinship outlined in Leviticus 25:39–43 and lead to the enslavement of fellow Israelites'

  # ---- note 2:7 pant ----
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'The verb ordinarily means gasp, pant, long for'
    key: bdb
    url: 'https://biblehub.com/hebrew/7602.htm'
    quote: 'verb gasp, pant, pant after, long for'
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'A second verb of the same spelling means crush, trample upon; BDB puts Amos 2:7 and 8:4 there, and calls 2:7 strange'
    key: bdb
    url: 'https://biblehub.com/hebrew/7602.htm'
    quote: 'trample upon, crush (the poor, etc.), figurative, with accusative of person Amos 8:4; strangely Amos 2:7'
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'The lexicon notes that most take the second verb as the same verb as the first, though the ancient versions render “trample”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7602.htm'
    quote: 'but Vrss render as above'
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'The second verb is glossed crush, trample upon'
    key: bdb
    url: 'https://biblehub.com/hebrew/7602.htm'
    quote: 'verb crush, trample upon'
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'The King James and Revised Versions read “pant after the dust,” explained as hyperbole for avarice'
    key: bdb
    url: 'https://biblehub.com/hebrew/7602.htm'
    quote: 'AV RV pant after the dust, etc., hyperb. for extreme avarice'
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'Another explanation: they longed to see the poor so miserable that they threw dust on their heads in mourning'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'The idea is that the people longed to see the poor in such a state of misery that they threw dust on their heads (a sign of mourning).'
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'A modern translation reads trampling'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%202&version=NRSVUE'
    quote: 'they who trample the head of the poor into the dust of the earth'
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'A modern translation renders the companion line “deny justice to the oppressed” and cross-references Amos 5:11–12 and 8:4'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%202%3A6-13&version=NIV'
    quote: 'and deny justice to the oppressed.'
  - where: 'note 2:7 “Panting after dust, or trampling heads into it”'
    claim: 'The translation’s cross-references for verse 7 include Amos 5:11–12 and 8:4'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%202%3A6-13&version=NIV'
    quote: 'Amos 2:7 : S Lev 18:21; Am 5:11-12; 8:4'

  # ---- note 2:7 maid ----
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'The Hebrew word means girl, damsel; BDB takes it in Amos 2:7 of a prostitute'
    key: bdb
    url: 'https://biblehub.com/hebrew/5291.htm'
    quote: 'noun feminine girl, damsel'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'BDB lists Amos 2:7 as a prostitute'
    key: bdb
    url: 'https://biblehub.com/hebrew/5291.htm'
    quote: 'of a concubine Judges 19:3,4,5,6,8,9, a prostitute Amos 2:7.'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'A modern translation has “the same young woman”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%202&version=NRSVUE'
    quote: 'father and son go in to the same young woman, so that my holy name is profaned'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'Another has “the same girl”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%202%3A6-13&version=NIV'
    quote: 'Father and son use the same girl and so profane my holy name.'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'An older commentary calls the sin tantamount to incest under Leviticus 18 and 20, and denies that shrine women are meant, against others who thought so'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/2.htm'
    quote: 'This sin was tantamount to incest, which, according to the law, was to be punished with death (cf. Leviticus 18:7, Leviticus 18:15, and Leviticus 20:11). Temple girls (qedēshōth) are not to be thought of here.'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'Others (Ewald, Maurer) had placed the act in shrine worship'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/2.htm'
    quote: 'does not indicate prostitution in the temple itself, such as was required by the licentious worship of Baal and Asherah (Ewald, Maurer, etc.)'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'The phrase “profane my holy name” is traced to Leviticus 22:32'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/2.htm'
    quote: 'as the original passage (Leviticus 22:32) from which Amos took the words clearly shows'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'The law forbids a man his father’s wife and his son’s wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'Thou shalt not uncover the nakedness of thy daughter in law: she is thy son’s wife; thou shalt not uncover her nakedness.'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'Leviticus 20:11 forbids a man his father’s wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'And the man that lieth with his father’s wife hath uncovered his father’s nakedness'
  - where: 'note 2:7 “A father and his son and the same girl”'
    claim: 'Leviticus 22:32 has the phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'Neither shall ye profane my holy name; but I will be hallowed among the children of Israel: I am the Lord which hallow you,'

  # ---- note 2:8 ----
  - where: 'note 2:8 “A poor man’s cloak for a couch, and his fine for wine”'
    claim: 'The verb means to fine; the participle in Amos 2:8 is “those fined”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6064.htm'
    quote: 'Amos 2:8 those fined, mulcted.'
  - where: 'note 2:8 “A poor man’s cloak for a couch, and his fine for wine”'
    claim: 'A modern translation: garments taken in pledge, wine bought with fines, “their God”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%202&version=NRSVUE'
    quote: 'they lay themselves down beside every altar on garments taken in pledge; and in the house of their God they drink wine bought with fines they imposed.'
  - where: 'note 2:8 “A poor man’s cloak for a couch, and his fine for wine”'
    claim: 'Another modern translation: “their god,” “wine taken as fines”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%202%3A6-13&version=NIV'
    quote: 'In the house of their god they drink wine(E) taken as fines.'
  - where: 'note 2:8 “A poor man’s cloak for a couch, and his fine for wine”'
    claim: 'Deuteronomy forbids sleeping with a poor man’s pledge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'And if the man be poor, thou shalt not sleep with his pledge:'
  - where: 'note 2:8 “A poor man’s cloak for a couch, and his fine for wine”'
    claim: 'One Latter-day Saint reading cites 2:8 among the texts on Israel’s idolatry'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'First, the Israelites have turned from Jehovah to idolatry. … (Amos 5:24–26; see also 2:8; 8:14).'

  # ---- note 2:9 ----
  - where: 'note 2:12 “The Nazarite made to drink, the prophet told to be quiet”'
    claim: 'A Nazarite was a consecrated man under a vow to abstain from wine'
    key: bd-nazarite
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nazarite?lang=eng'
    quote: 'A consecrated man. A man under a vow to abstain from wine, from any cutting of the hair, and any contact with the dead … The vow might be lifelong, or for a short, definite period.'
  - where: 'note 2:12 “The Nazarite made to drink, the prophet told to be quiet”'
    claim: 'The Nazarite law begins with abstaining from wine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: 'He shall separate himself from wine and strong drink, and shall drink no vinegar of wine, or vinegar of strong drink'
  - where: 'note 2:12 “The Nazarite made to drink, the prophet told to be quiet”'
    claim: 'Giving them wine made them break the vow'
    key: scripture-helps-amos
