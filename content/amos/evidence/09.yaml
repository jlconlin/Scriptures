chapter: 9
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Amos’s ministry is placed at 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC), it appears these covenants had been disregarded not only by Israel’s neighbors, but by the Israelites themselves'
  - where: 'when'
    claim: 'Amos prophesied in the days of Jeroboam II, among the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The prophet Amos prophesied in the days of Uzziah, king of Judah (died about 740 B.C.), and Jeroboam Ⅱ, king of Israel (died about 750 B.C.).'
  - where: 'setting'
    claim: 'Chapters 7–9 are the book’s third part: visions of judgment and a message of hope'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 7–9: Amos’s visions of coming judgment and a message of hope that God would one day restore and bless His people.'
  - where: 'setting'
    claim: 'Four visions precede this one and begin with the Lord showing something; the fifth begins “I saw the Lord”'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'The first four of these visions begin with a phrase such as “Thus hath the Lord God showed me” (see Amos 7:1, 4, 7; 8:1). The fifth commences with the words “I saw the Lord” (Amos 9:1).'
  - where: 'setting'
    claim: 'Israel was at peace and prosperous when Amos spoke'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Instead, the Israelites were enjoying an era of peace and prosperity (2 Kings 14:23–29).'
  - where: 'setting'
    claim: 'The northern kingdom fell to Assyria in 722 B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Many of the people of Israel rejected the warnings of Amos and the other prophets, and they were conquered by the Assyrians in 722 BC.'
  - where: 'setting'
    claim: 'The Bible Dictionary treats 9:11–15 as Amos’s teaching and places it in the last days'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'Yet Israel will not be utterly destroyed (9:8), and in the last days the kingdom will return to and even surpass its ancient glory (9:11–15).'
  - where: 'setting'
    claim: 'Theories about the book’s composition and editing vary considerably'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'its internal structure is quite complex, and theories about its composition and editing vary considerably.'
  - where: 'setting'
    claim: 'One scholar (Jeremias, as Spencer reports) suggests the book originally ended with 9:1–4'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'suggests that the book of Amos originally ended with this devastating announcement. In final form, Amos contains another eleven verses.'
  - where: 'setting'
    claim: 'James quotes Amos 9 in Acts 15 at the Jerusalem council'
    key: mcclellan-ot-in-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/use-old-testament-new-testament'
    quote: 'This section will discuss two examples of this engagement, specifically Stephen’s summary of Jewish history in Acts 7 and James’s quotation of Amos 9 in Acts 15.'
  - where: 'thread'
    claim: 'Amos 9:1–4 is Amos’s most extreme statement about the remnant'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'more or less at the conclusion of the book,[17] Amos provides his most extreme statement.'
  - where: 'thread'
    claim: 'In 9:1–4 Amos raises the possibility of no remnant at all'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'But in Amos 9:1–4, the prophet suggests the possibility that Israel might ultimately be left without any remnant at all.'

  # ---- plain-words renderings ----
  - where: 'section 1 plain'
    claim: 'The Lord stands by the altar; capitals struck, thresholds shake, and they fall on the heads of the people'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'I saw the Lord standing beside the altar, and he said: … Strike the capitals until the thresholds shake … and shatter them on the heads of all the people,'
  - where: 'section 1 plain'
    claim: '“Hell” is Sheol; “set mine eyes upon them for evil” is fix my eyes on them for harm'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'Though they dig into Sheol, … and I will fix my eyes on them … for harm and not for good.'
  - where: 'section 2 plain'
    claim: 'The “flood of Egypt” is the Nile; “stories” and “troop” are upper chambers and a vault'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'and all of it rises like the Nile … and sinks again, like the Nile of Egypt, … who builds his upper chambers in the heavens … and founds his vault upon the earth,'
  - where: 'section 3 plain'
    claim: 'The Ethiopians are the Cushites; “prevent” is meet'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'Are you not like the Cushites to me, … who say, “Evil shall not overtake or meet us.”'
  - where: 'section 3 plain'
    claim: 'The Church’s footnote on “prevent” gives the Hebrew as “confront”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'HEB confront.'
  - where: 'section 4 plain'
    claim: '“Tabernacle” is a booth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'the booth of David that is fallen'
  - where: 'section 5 plain'
    claim: '“Bring again the captivity” is restore the fortunes; the hills flow with wine'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'and all the hills shall flow with it. … I will restore the fortunes of my people Israel,'

  # ---- note 9:1 altar ----
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'Interpreters who choose Beth-el point to the prophet’s target, the northern kingdom and its sanctuary, and to 3:14'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'the article before hammizbēăch points to the altar of the sanctuary in the kingdom of Israel, to the altar at Bethel, against which he has already prophesied in a perfectly similar manner in Amos 3:14.'
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'Keil argues for the altar of burnt offering at Jerusalem'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'Hammizbēăch, therefore, both here and at Ezekiel 9:2, is the altar of burnt-offering in the temple, at Jerusalem, the sanctuary of the whole of the covenant nation'
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'Keil’s reason: Beth-el had several altars and the north two sanctuaries, so none was “the altar”'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'so that there was not any one altar in the kingdom of the ten tribes, which could be called hammizbēăch, the altar par excellence'
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'Keil reads “at,” not “upon,” the altar'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'standing at (not upon) the altar, as in 1 Kings 13:1.'
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'This closing vision shows the Lord carrying out the judgment'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'this closing vision shows the Lord engaged in the execution of the judgment, and commences accordingly with the words, "I saw the Lord standing," etc.'
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'A modern translation has “beside the altar,” with “on” in the margin'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'I saw the Lord standing beside the altar, and he said: … 9.1 Or on'
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'The fifth vision does not share the structure of the first four'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'The book contains an additional vision in 9:1–4, but it does not share the same structural connections as the first four; therefore, I do not include it in the discussion below.'
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'Skinner sets Amos 9:1 beside Isaiah 6:1 as witnesses of seeing God, especially in the temple'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'The experiences of other witnesses attest to the real possibility of seeing God in mortality, especially in the temple. Amos, a prophet from the eighth century BC, straightforwardly stated that he “saw the Lord standing upon the altar” (Amos 9:1).'
  - where: 'note 9:1 “Which altar, and what Amos saw”'
    claim: 'Amos 3:14 threatens the altars of Beth-el'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/3?lang=eng'
    quote: 'I will also visit the altars of Beth-el: and the horns of the altar shall be cut off, and fall to the ground.'

  # ---- note 9:1 capitals ----
  - where: 'note 9:1 “From the capitals to the thresholds”'
    claim: 'The word translated “lintel” means the capital of a pillar in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/3730.htm'
    quote: 'Amos 9:1 capital of pillar; so plural suffix'
  - where: 'note 9:1 “From the capitals to the thresholds”'
    claim: 'Elsewhere the word is the knob or bulb on the tabernacle lampstand'
    key: bdb
    url: 'https://biblehub.com/hebrew/3730.htm'
    quote: 'knob or bulb, ornament on the golden lamp-stand in tabernacle'
  - where: 'note 9:1 “From the capitals to the thresholds”'
    claim: 'The word translated “posts” means threshold, sill, in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/5592.htm'
    quote: 'threshold, sill Judges 19:27; Amos 9:1; Isaiah 6:4'
  - where: 'note 9:1 “From the capitals to the thresholds”'
    claim: 'A modern translation: strike the capitals until the thresholds shake, and shatter them on the heads of the people'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'Strike the capitals until the thresholds shake … and shatter them on the heads of all the people,'

  # ---- note 9:2 ----
  - where: 'note 9:2 “No hiding place, beside Psalm 139”'
    claim: '“Hell” is Sheol'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'Though they dig into Sheol,'
  - where: 'note 9:2 “No hiding place, beside Psalm 139”'
    claim: 'The Church’s footnote at “hell” refers to Psalm 139:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'Ps. 139:8 (8–9).'
  - where: 'note 9:2 “No hiding place, beside Psalm 139”'
    claim: 'Psalm 139:8–10 says God is in heaven, in Sheol and beyond the sea, and that His hand leads there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/139?lang=eng'
    quote: 'Even there shall thy hand lead me, and thy right hand shall hold me.'
  - where: 'note 9:2 “No hiding place, beside Psalm 139”'
    claim: 'Those who flee and escape are the possible remnant, and both die'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: '“He that fleeth” and “he that escapeth,” Amos says, referring to those who could constitute a preserved remnant of Israel, are both to end up dead.'
  - where: 'note 9:2 “No hiding place, beside Psalm 139”'
    claim: 'Spencer allows that this may be rhetoric, since the sifting follows'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'This may, of course, be primarily overheated rhetoric, used principally for effect.'
  - where: 'note 9:2 “No hiding place, beside Psalm 139”'
    claim: 'The Student Manual reads 9:1–6 of the Second Coming'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'There is none to escape, hide where they may. Only the Second Coming of the Lord fulfills such a description, for when the Lord comes in His glory, the rewards of justice will be met.'

  # ---- note 9:6 ----
  - where: 'note 9:6 “Upper chambers and a vault”'
    claim: '“Stories” is the word for step or stair'
    key: bdb
    url: 'https://biblehub.com/hebrew/4609.htm'
    quote: 'noun feminine step, stair;'
  - where: 'note 9:6 “Upper chambers and a vault”'
    claim: 'In Amos 9:6 it is taken as the stories of heaven'
    key: bdb
    url: 'https://biblehub.com/hebrew/4609.htm'
    quote: '3 stories of heaven Amos 9:6.'
  - where: 'note 9:6 “Upper chambers and a vault”'
    claim: '“Troop” is a word for a band: a bunch of hyssop, a band of men; here the vault of the heavens'
    key: bdb
    url: 'https://biblehub.com/hebrew/92.htm'
    quote: 'vault of the heavens (as fitted together, constructed'
  - where: 'note 9:6 “Upper chambers and a vault”'
    claim: 'Other uses: bunch of hyssop'
    key: bdb
    url: 'https://biblehub.com/hebrew/92.htm'
    quote: 'bunch of hyssop Exodus 12:22.'
  - where: 'note 9:6 “Upper chambers and a vault”'
    claim: 'Other uses: band of men'
    key: bdb
    url: 'https://biblehub.com/hebrew/92.htm'
    quote: 'absolute band of men (compare'
  - where: 'note 9:6 “Upper chambers and a vault”'
    claim: 'A modern translation: upper chambers, vault'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'who builds his upper chambers in the heavens … and founds his vault upon the earth,'
  - where: 'note 9:6 “Upper chambers and a vault”'
    claim: 'The flood of Egypt is the Nile'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'and all of it rises like the Nile … and sinks again, like the Nile of Egypt,'

  # ---- note 9:7 ----
  - where: 'note 9:7 “Israel beside Cush, Philistia and Syria”'
    claim: 'The Student Manual reads 9:7 as saying Israel could not expect deliverance simply for being chosen'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'Amos told Israel that they could not expect deliverance simply because they were the chosen people (see Amos 9:7).'
  - where: 'note 9:7 “Israel beside Cush, Philistia and Syria”'
    claim: 'Where Ethiopia or Cush lay'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile.'
  - where: 'note 9:7 “Israel beside Cush, Philistia and Syria”'
    claim: 'A modern translation has “Cushites”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'Are you not like the Cushites to me,'
  - where: 'note 9:7 “Israel beside Cush, Philistia and Syria”'
    claim: 'Caphtor is probably Crete, the Philistines’ original home'
    key: bdb
    url: 'https://biblehub.com/hebrew/3731.htm'
    quote: 'proper name, of a territory probably Crete'
  - where: 'note 9:7 “Israel beside Cush, Philistia and Syria”'
    claim: 'Amos’s emphasis is on Jehovah as ruler of all nations'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'His emphasis was upon the moral character of Jehovah, the righteous ruler of all nations and men.'
  - where: 'note 9:7 “Israel beside Cush, Philistia and Syria”'
    claim: 'The Bible Dictionary pairs 9:7 with 3:2'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The fact that Israel is the covenant people would make their punishment the heavier (3:2; 9:7).'
  - where: 'note 9:7 “Israel beside Cush, Philistia and Syria”'
    claim: 'Assyria carried the people of Damascus to Kir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'the king of Assyria went up against Damascus, and took it, and carried the people of it captive to Kir, and slew Rezin.'

  # ---- note 9:9 ----
  - where: 'note 9:9 “What stays in the sieve”'
    claim: 'The word behind “least grain” means pebble; here perhaps a grain of wheat, or the pebble kept in the sieve'
    key: bdb
    url: 'https://biblehub.com/hebrew/6872.htm'
    quote: 'also Amos 9:9 (where perhaps figurative for grain of wheat, in metaphor of winnowed Israel, compare Dr Now and others; > pebble retained in sieve'
  - where: 'note 9:9 “What stays in the sieve”'
    claim: 'A modern translation has “no pebble”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'but no pebble shall fall to the ground.'
  - where: 'note 9:9 “What stays in the sieve”'
    claim: 'The Student Manual reads the verse of the righteous kept'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'The gathering of the righteous remnant will be such that not one worthy soul will be unnoticed (see v. 9)'
  - where: 'note 9:9 “What stays in the sieve”'
    claim: 'Spencer: the sinners die by a process of sifting'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'the text claims just that “all the sinners” of the covenant people “shall die by the sword,” thanks to a process of “sift[ing]” (Amos 9:9–10).'
  - where: 'note 9:9 “What stays in the sieve”'
    claim: 'The footnote on “prevent” gives “confront”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'HEB confront.'
  # ---- note 9:11 ----
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'Sukkah is a booth, a rude or temporary shelter'
    key: bdb
    url: 'https://biblehub.com/hebrew/5521.htm'
    quote: '2 booth, rude or temporary shelter, for cattle Genesis 33:17'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'Used of watchers’ shelters in vineyards and, in Amos 9:11, of the fallen house of David'
    key: bdb
    url: 'https://biblehub.com/hebrew/5521.htm'
    quote: 'for watchers in vineyards Isaiah 1:8 (simile) … in poetry of fallen house (dynasty) of David Amos 9:11'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'The booths of the harvest feast are the same word'
    key: bdb
    url: 'https://biblehub.com/hebrew/5521.htm'
    quote: '3 specifically of booths, made of boughs, in which people lived at harvest-feast Leviticus 23:42'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'The Hebrew word in the verse is sukkah (Strong’s 5521; scripts/hebrew.mjs amos 9:11)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'סֻכַּ֥ת'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'A modern translation has “booth”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%209&version=NRSVUE'
    quote: 'the booth of David that is fallen'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'Keil: the hut is set against David’s palace on Zion and means the ruin of the kingdom'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'so does the fallen hut, which is full of rents and near to destruction, symbolize the utter ruin of the kingdom.'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'Keil: the hut contrasts with the house or palace David built on Zion'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'Sukkâh, a hut, indicates, by way of contrast to bayith, the house or palace which David built for himself upon Zion (2 Samuel 5:11), a degenerate condition of the royal house of David.'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'Keil: Judah was at its height under Uzziah; the kingdom became a hut at the Chaldean conquest'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'least of all under Uzziah, in whose reign the kingdom of Judah reached the summit of its earthly power and glory. The kingdom of David first became a hut when the kingdom of Judah was overcome by the Chaldeans'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'Keil: the loss of the ten tribes was already a blow; the promise rests on 2 Samuel 7'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'The rule of David had already received a considerable blow through the falling away of the ten tribes.'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'Keil ties the verse to the promise of 2 Samuel 7'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/9.htm'
    quote: 'point back to the promise in 2 Samuel 7:11-12, 2 Samuel 7:16, that God would build a house for David'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'The Bible Dictionary places the restoration in the last days'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'in the last days the kingdom will return to and even surpass its ancient glory (9:11–15).'
  - where: 'note 9:11 “David’s house as a fallen hut”'
    claim: 'The promise to David in 2 Samuel 7:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'And thine house and thy kingdom shall be established for ever before thee: thy throne shall be established for ever.'

  # ---- note 9:12 ----
  - where: 'note 9:12 “How James quotes these verses”'
    claim: 'James’s quotation in Acts 15:16–17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/15?lang=eng'
    quote: 'That the residue of men might seek after the Lord, and all the Gentiles, upon whom my name is called, saith the Lord, who doeth all these things.'
  - where: 'note 9:12 “How James quotes these verses”'
    claim: 'The Septuagint of Amos 9:12 (Brenton)'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/9.htm'
