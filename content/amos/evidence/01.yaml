chapter: 1
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Amos’s ministry is put at 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC), it appears these covenants had been disregarded not only by Israel’s neighbors, but by the Israelites themselves'
  - where: 'when'
    claim: 'Amos prophesied under Jeroboam II of Israel'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The prophet Amos prophesied in the days of Uzziah, king of Judah (died about 740 B.C.), and Jeroboam Ⅱ, king of Israel (died about 750 B.C.).'

  # ---- setting ----
  - where: 'setting'
    claim: 'Uzziah died about 740 B.C. and Jeroboam II about 750 B.C.; Amos was a shepherd of Tekoa, 12 miles south of Jerusalem, with a ministry in the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'He was a shepherd (Amos 1:1; 7:14) and a native of Tekoa, 12 miles south of Jerusalem, but his ministry was among those of the northern kingdom of Israel.'
  - where: 'setting'
    claim: 'Israel was at peace and prosperous under Jeroboam II'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Instead, the Israelites were enjoying an era of peace and prosperity (2 Kings 14:23–29). In this golden age of the divided monarchy, Amos reprimands the elite of Israelite society'
  - where: 'setting'
    claim: 'Jeroboam recovered Damascus and Hamath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'how he warred, and how he recovered Damascus, and Hamath, which belonged to Judah, for Israel'
  - where: 'setting'
    claim: 'Israel was conquered by Assyria in 722 B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Many of the people of Israel rejected the warnings of Amos and the other prophets, and they were conquered by the Assyrians in 722 BC.'
  - where: 'setting'
    claim: 'Chapters 1–2 are one division: judgments on the nations, including Judah and Israel'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 1–2: Prophecies of judgment against various nations, including Judah and Israel, for their wickedness.'

  # ---- thread ----
  - where: 'thread'
    claim: 'Where the five nations lie around Israel'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Israel’s neighbors Damascus (to the northeast of Israel), Gaza (southwest), Tyrus (north), Edom (southeast), and Ammon (east) are condemned for their wickedness'
  - where: 'thread'
    claim: 'The list of nations shows Israel surrounded on all sides'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'This listing of nations provides a visual, wherein Israel is surrounded on all sides by idolatry and gross wickedness.'
  - where: 'thread'
    claim: 'The crimes are of two kinds'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'When the misdeeds of these nations are outlined, they can be separated into two types: martial brutality or human slavery, both aimed at increasing the wealth or luxury of the elite.'
  - where: 'thread'
    claim: 'The offenders were bound to Israel by treaty or by lineage'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'While Edom’s relationship to Israel is primarily based on shared national lineage (Amos 1:11), [21] Israel made covenants with Phoenicia (1 Kings 5:12), Ammon (2 Samuel 10:2), Aram (2 Samuel 8:6), and Moab (2 Samuel 8:2)'
  - where: 'thread'
    claim: 'The Philistines’ tie to Israel is the least clear'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The Philistines’ relationship with the Israelites is tenuous at best in the Old Testament narrative'
  - where: 'thread'
    claim: 'The Israelites accepted the condemnation of Tyre because they had been its victims'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The Israelites easily recognized and eagerly accepted this condemnation because they were the victims of the covenantal breach from one of their neighboring regional powers.'
  - where: 'thread'
    claim: 'The oracles against the nations introduce the condemnation of Israel'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'as a subtle and persuasive introduction to the condemnation he was about to pronounce upon Israel’s social elite'
  - where: 'thread'
    claim: 'The same formula is used of Israel at 2:6, in a sentence that runs to 2:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/2?lang=eng'
    quote: 'For three transgressions of Israel, and for four, I will not turn away the punishment thereof'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Habitations” may be read “pastures”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: '“habitations”: OR pastures.'
  - where: 'section 2 plain'
    claim: 'The “bar” of Damascus is the bolt of its gate'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'The breaking of the bar (the bolt of the gate) denotes the conquest of the capital'
  - where: 'section 2 plain'
    claim: 'The threshing instruments are threshing sleds'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'crushing them under iron threshing sleds'
  - where: 'section 3 plain'
    claim: '“The whole captivity” is a complete body of captives'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'a captivity so perfect and complete, that not a single captive remained who was not delivered to the Idumaeans'
  - where: 'section 4 plain'
    claim: '“The brotherly covenant” is a covenant (berit) of brothers (ahim)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'בְּרִ֥ית'

  # ---- note 1:1 herdmen ----
  - where: 'note 1:1 “A shepherd from Judah, sent north”'
    claim: 'Tekoa is in Judah, about twelve miles from Jerusalem'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Tekoa lies deep in the tribal lands of the southern kingdom of Judah (about six miles southeast of Bethlehem and twelve miles from Jerusalem)'
  - where: 'note 1:1 “A shepherd from Judah, sent north”'
    claim: 'His ministry was in the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'a native of Tekoa, 12 miles south of Jerusalem, but his ministry was among those of the northern kingdom of Israel'
  - where: 'note 1:1 “A shepherd from Judah, sent north”'
    claim: 'The word in 1:1 is noqed (H5349)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'בַ/נֹּקְדִ֖ים'
  - where: 'note 1:1 “A shepherd from Judah, sent north”'
    claim: 'Noqed means sheep-raiser, -dealer or -tender and occurs elsewhere only of Mesha of Moab'
    key: bdb
    url: 'https://biblehub.com/hebrew/5349.htm'
    quote: 'noun masculine sheep-raiser, -dealer, or -tender (LagNB108); — absolute ׳נ only 2 Kings 3:4 (of Mesha, king of Moab)'
  - where: 'note 1:1 “A shepherd from Judah, sent north”'
    claim: 'Mesha paid tribute in lambs and wool'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'And Mesha king of Moab was a sheepmaster, and rendered unto the king of Israel an hundred thousand lambs, and an hundred thousand rams, with the wool.'

  # ---- note 1:1 earthquake ----
  - where: 'note 1:1 “The earthquake”'
    claim: 'The date of the earthquake is unknown and the historical books do not mention it'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'furnishes no chronological datum, because the time of the earthquake is unknown. It is never mentioned in the historical books of the Old Testament'
  - where: 'note 1:1 “The earthquake”'
    claim: 'The earthquake was remembered after the Captivity, in Zechariah'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'the terrible earthquake in the time of Uzziah, which the people had not forgotten even after the captivity'
  - where: 'note 1:1 “The earthquake”'
    claim: 'Zechariah recalls the earthquake in Uzziah’s days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: 'ye shall flee, like as ye fled from before the earthquake in the days of Uzziah king of Judah'
  - where: 'note 1:1 “The earthquake”'
    claim: 'The Bible Dictionary places the earthquake in Uzziah’s reign from Amos 1:1 and Zechariah 14:5'
    key: bd-uzziah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/uzziah?lang=eng'
    quote: 'earthquake in his reign (Isa. 6:1; Amos 1:1; Zech. 14:5)'
  - where: 'note 1:1 “The earthquake”'
    claim: 'On one reading the book was gathered after the earthquake from what Amos had said at Beth-el'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'Amos, after the occurrence of the earthquake in the time of Uzziah, gathered together all the essential contents of the prophecies he had previously uttered at Bethel'

  # ---- note 1:2 ----
  - where: 'note 1:2 “The lion’s roar”'
    claim: 'The verb is used of a lion, and of the Lord roaring in thunder in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/7580.htm'
    quote: '1 roar, of lion Judges 14:5 (with לִקְרָאתוֺ), Amos 3:4,8; … of ׳י roaring in thunder Jeremiah 25:30a = Amos 1:2 = Joel 3:16'
  - where: 'note 1:2 “The lion’s roar”'
    claim: 'The opening image is a lion, and it sets the tone of the book'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The tone of Amos’s ministry is set in the initial lines of the book. Amos forms in the reader’s mind the image of a roaring lion ready to pounce on a foolish and helpless victim.'
  - where: 'note 1:2 “The lion’s roar”'
    claim: 'The Church’s footnote reads “pastures” for “habitations”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: '“habitations”: OR pastures.'
  - where: 'note 1:2 “The lion’s roar”'
    claim: 'Amos 3 returns to the lion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/3?lang=eng'
    quote: 'The lion hath roared, who will not fear?'
  - where: 'note 1:2 “The lion’s roar”'
    claim: 'Carmel is the headland on the coast, and the name means garden or park'
    key: bd-carmel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/carmel?lang=eng'
    quote: 'Garden or park. (1) A hill, 1742 feet high, forming the one headland of the coast of Palestine.'

  # ---- note 1:3 three and four ----
  - where: 'note 1:3 “Three, and four”'
    claim: 'The idiom means the sins are abundant; Proverbs 6:16 has the same style'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'The expression “for three transgressions … and for four” indicates that the sins alluded to have been exceedingly abundant. The same style is used in Proverbs 6:16'
  - where: 'note 1:3 “Three, and four”'
    claim: 'The one act named is proof of how far the nation had sunk'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'The one act mentioned is proof of how far that nation has sunk in iniquity.'
  - where: 'note 1:3 “Three, and four”'
    claim: 'Proverbs 30 uses the three-and-four form'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/30?lang=eng'
    quote: 'There be three things which are too wonderful for me, yea, four which I know not:'
  - where: 'note 1:3 “Three, and four”'
    claim: 'The numbers denote many sins, not a count'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'the numbers merely serve to denote the multiplicity of the sins, the exact number of which has no bearing upon the matter'
  - where: 'note 1:3 “Three, and four”'
    claim: 'Only one crime is named for each nation'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'as a rule, only one especially grievous crime is mentioned by way of example'
  - where: 'note 1:3 “Three, and four”'
    claim: 'The Hebrew is “I will not reverse it,” said first to show the threat is irrevocable'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: '(I will not reverse it) is inserted before the more minute description of the crimes, to show that the threat is irrevocable'
  - where: 'note 1:3 “Three, and four”'
    claim: '“It” is read as the punishment threatened afterward'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'The reference is to the punishment threatened afterwards, where the masculine stands in the place of the neuter.'
  - where: 'note 1:3 “Three, and four”'
    claim: 'The Hebrew clause is a negative, a verb in the first person (hiphil of shuv, H7725), and a suffix “it”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'אֲשִׁיבֶ֑/נּוּ'
  - where: 'note 1:3 “Three, and four”'
    claim: '“Transgressions” is pesha (H6588)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'פִּשְׁעֵ֣י'
  - where: 'note 1:3 “Three, and four”'
    claim: 'Pesha is transgression against individuals, of nation against nation (these verses), and against God'
    key: bdb
    url: 'https://biblehub.com/hebrew/6588.htm'
    quote: '2 of nation, against nation: Amos 1:3,6,9,11,13; Amos 2:1; of land Proverbs 28:2.'
  - where: 'note 1:3 “Three, and four”'
    claim: 'The first sense is transgression against individuals'
    key: bdb
    url: 'https://biblehub.com/hebrew/6588.htm'
    quote: '1 transgression against individuals Genesis 31:36; Genesis 50:17'
  - where: 'note 1:3 “Three, and four”'
    claim: 'The third sense is transgression against God'
    key: bdb
    url: 'https://biblehub.com/hebrew/6588.htm'
    quote: '3 against God:'
  - where: 'note 1:3 “Three, and four”'
    claim: 'Amos uses the same noun of Israel at 3:14'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Amos employs this same noun when he speaks for the Lord in declaring “that in the day . . . I shall visit the transgressions of Israel upon him” (3:14; emphasis added).'
  - where: 'note 1:3 “Three, and four”'
    claim: 'The formula recurs through 2:6'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The repetitive use of the noun transgressions to explain the actions of Israel’s neighbors (Amos 1:3, 6, 9, 11, 13; 2:1, 6) serves as a preamble to his more direct message.'

  # ---- note 1:3 Gilead ----
  - where: 'note 1:3 “What Damascus did to Gilead”'
    claim: 'Gilead is the highland east of the Jordan, assigned to Gad and Manasseh'
    key: bd-gilead
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilead?lang=eng'
    quote: 'A highland district east of the Jordan, south of Bashan, rising in parts to an elevation of 4000 feet above the sea. … It was assigned half to the tribe of Gad and half to Manasseh.'
  - where: 'note 1:3 “What Damascus did to Gilead”'
    claim: 'Damascus was the capital of Aram (Syria); the charge likely refers to Hazael’s expansion into the region; the threshing is symbolic'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'is a symbolic reference to martial brutality. … This likely is a reference to the breaching of the covenant of kinship by the expansion of Aram’s territory into the region by Hazael in 814 BC (2 Kings 10:32–33).'
  - where: 'note 1:3 “What Damascus did to Gilead”'
    claim: 'Damascus was the capital of Aram (Syria)'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The prophet begins by indicting Damascus, the capital of Aram (Syria)'
  - where: 'note 1:3 “What Damascus did to Gilead”'
    claim: 'Hazael, king of Syria, attacked Israel'
    key: bd-hazael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hazael?lang=eng'
    quote: 'but a few years later he was again strong enough to attack Israel (2 Kgs. 10:32; 12:17–18; 13:3–7, 22; 2 Chr. 24:24)'
  - where: 'note 1:3 “What Damascus did to Gilead”'
    claim: 'Hazael took all the land of Gilead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng'
    quote: 'From Jordan eastward, all the land of Gilead, the Gadites, and the Reubenites, and the Manassites'
  - where: 'note 1:3 “What Damascus did to Gilead”'
    claim: 'Elisha wept foreseeing what Hazael would do to Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/8?lang=eng'
    quote: 'And Hazael said, Why weepeth my lord? And he answered, Because I know the evil that thou wilt do unto the children of Israel'
  - where: 'note 1:3 “What Damascus did to Gilead”'
    claim: 'Kings describes Israel under Syria as dust made by threshing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/13?lang=eng'
    quote: 'for the king of Syria had destroyed them, and had made them like the dust by threshing'
  - where: 'note 1:3 “What Damascus did to Gilead”'
    claim: 'One reading takes the threshing literally, of captives crushed under sleds'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'When the Syrians conquered it under Hazael (2 Kings 10:32–33), they evidently treated their captives with barbaric cruelty, crushing them under iron threshing sleds.'

  # ---- note 1:4 ----
  - where: 'note 1:4 “Fire on the palaces”'
    claim: 'The word is citadel, castle, palace; common in Amos; named in conquest because fine buildings were plundered'
    key: bdb
    url: 'https://biblehub.com/hebrew/759.htm'
    quote: 'citadel, castle, palace, not used before royal period, mostly in prophets, especially common in Amos & Jeremiah; … especially used in speaking of conquest, because the fine buildings would be especially object of attack & plunder'
  - where: 'note 1:4 “Fire on the palaces”'
    claim: 'The palaces are the residences of the elite, and the punishments are aimed at them'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'are aimed at the elite class and the symbols of their power and wealth. … these high-rises, the residences of the social and economic elite in the major cities of these nation-states, would be devoured by fire'
  - where: 'note 1:4 “Fire on the palaces”'
    claim: 'The same focus falls on Israel’s elite'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'This focus on the elite is not reserved for the foreign nations condemned by the prophet, but is also the focus of Amos’s pronouncements against Israel.'
  - where: 'note 1:4 “Fire on the palaces”'
    claim: 'Israel’s own palaces are sentenced at 3:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/3?lang=eng'
    quote: 'and he shall bring down thy strength from thee, and thy palaces shall be spoiled'
  - where: 'note 1:4 “Fire on the palaces”'
    claim: 'The fire is aimed at the dynasties of Syria'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The destruction outlined here is not directed merely to physical structures but also against two of the dominating dynasties in Syrian politics.'
  - where: 'note 1:4 “Fire on the palaces”'
    claim: 'Hazael became king by murdering Benhadad'
    key: bd-hazael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hazael?lang=eng'
    quote: 'He became king by murdering his master Benhadad (2 Kgs. 8:15)'
  - where: 'note 1:4 “Fire on the palaces”'
    claim: 'Hazael’s son Ben-hadad succeeded him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/13?lang=eng'
    quote: 'So Hazael king of Syria died; and Ben-hadad his son reigned in his stead.'

  # ---- note 1:5 ----
  - where: 'note 1:5 “The sentences carried out”'
    claim: 'Assyria took Damascus and carried its people to Kir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'for the king of Assyria went up against Damascus, and took it, and carried the people of it captive to Kir, and slew Rezin'
  - where: 'note 1:5 “The sentences carried out”'
    claim: 'Damascus fell to Tiglath-pileser about 733 B.C.'
    key: bd-damascus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/damascus?lang=eng'
    quote: 'It was conquered by Tiglath-pileser and its inhabitants carried captive about 733 B.C. (2 Kgs. 16:9; Isa. 8:4; 17:1–3; Jer. 49:23–27; Amos 1:3–5).'
  - where: 'note 1:5 “The sentences carried out”'
    claim: 'The prediction was fulfilled in the time of Ahaz; Kir is where Amos 9:7 says the Syrians came from'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/1.htm'
    quote: 'from which, according to Amos 9:7, the Syrians originally emigrated. This prediction was fulfilled when the Assyrian king Tiglath-pileser conquered Damascus in the time of Ahaz'
  - where: 'note 1:5 “The sentences carried out”'
    claim: 'The Lord brought the Syrians from Kir'
