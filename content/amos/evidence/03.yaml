chapter: 3
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Amos’s ministry is dated 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC)'
  - where: 'when'
    claim: 'Amos prophesied under Jeroboam II of Israel, who died about 750 B.C.'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'king of Israel (died about 750 B.C.)'

  # ---- setting ----
  - where: 'setting'
    claim: 'Scripture Helps divides the book: 1–2 the nations, Judah and Israel; 3–6 warnings to the northern kingdom'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 3–6: Warnings to the Northern Kingdom and Amos’s plea for the people to repent.'
  - where: 'setting'
    claim: 'Chapters 1–2 are judgments on the nations, including Judah and Israel'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 1–2: Prophecies of judgment against various nations, including Judah and Israel, for their wickedness.'
  - where: 'setting'
    claim: 'The time was one of peace and prosperity'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'the Israelites were enjoying an era of peace and prosperity (2 Kings 14:23–29)'
  - where: 'setting'
    claim: 'Samaria was the capital of the northern kingdom'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'a city built by Omri and made the capital of the kingdom of Israel'
  - where: 'setting'
    claim: 'The address of verse 1 is to all twelve tribes'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'Amos spoke to the whole of Israel, all twelve families or tribes.'
  - where: 'setting'
    claim: 'The questions of 3:2–8 answer Israel’s “Prophesy not”'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'the Lord rebuked Israel, which had rejected His messengers by telling the prophets to “prophesy not.”'
  - where: 'setting'
    claim: 'The prophecies of doom were fulfilled within a few decades'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'All of these prophecies of doom were fulfilled within a few decades of Amos’s ministry to Israel.'
  - where: 'thread'
    claim: 'Israel trusted its covenant relationship to preserve it'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'where Israel had come to trust that its covenantal relationship to the Lord would secure its preservation, Amos announces that this promise is unstable'
  - where: 'thread'
    claim: 'Verses 3–8 establish Amos’s right and duty to prophesy before he announces more of the judgment'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'to establish his right and duty to prophesy, by a chain-like series of similes drawn from life'
  - where: 'thread'
    claim: 'The division of the chapter: 3:2, 3:3–8, 3:9–15'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'He must visit all its sins (Amos 3:2), and has commissioned the prophet to announce this punishment (Amos 3:3-8)'
  - where: 'thread'
    claim: 'The questions emphasize that silencing the prophets will not prevent judgment'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'to emphasize that silencing the prophets would not spare Israel from judgment'
  - where: 'thread'
    claim: 'With his calling vindicated, Amos proclaims the judgment in 3:9–15'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'he is able to proclaim without reserve what the Lord has resolved to do upon sinful Israel'
  - where: 'thread'
    claim: 'Verse 13 is a fresh introduction within the threat'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'This feature in the threat is brought out into peculiar prominence by a fresh introduction.'
  - where: 'thread'
    claim: '“Punish” (3:2) and “visit” (3:14) are the same Hebrew verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/6485.htm'
    quote: 'visit upon'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: '“Agreed” rendered as arranged to meet'
    key: bdb
    url: 'https://biblehub.com/hebrew/3259.htm'
    quote: 'meet by appointment'
  - where: 'section 2 plain'
    claim: 'The Church edition’s footnote on “gin” (5a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/3?lang=eng'
    quote: 'bait, or lure'
  - where: 'section 2 plain'
    claim: '“Evil” rendered as disaster'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Amos%203&version=ESV'
    quote: 'Does disaster come to a city,'
  - where: 'section 3 plain'
    claim: '“Know not to do right” is not knowing how to do right'
    key: bdb
    url: 'https://biblehub.com/hebrew/3045.htm'
    quote: 'they know not how to do right'
  - where: 'section 4 plain'
    claim: '“Testify in” rendered “testify against”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%203&version=NRSVUE'
    quote: 'Hear and testify against the house of Jacob,'

  # ---- note 3:2 ----
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: 'The lexicon lists 3:2 with Hosea 13:5 for God’s knowing of Israel as chosen people, and compares Genesis 18:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/3045.htm'
    quote: 'of Israel as chosen people Amos 3:2; Hosea 13:5'
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: '“Know” may be covenantal language'
    key: sc-knowhy-205
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-some-well-intentioned-people-will-be-told-to-depart'
    quote: 'While the word “know” may not seem particularly significant, it may often be related to covenantal language.'
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: 'The KnoWhy gives Amos 3:2 as an example, beside Genesis 18:19'
    key: sc-knowhy-205
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-some-well-intentioned-people-will-be-told-to-depart'
    quote: 'He described His covenant relationship with Abraham by declaring “I know him” (Genesis 18:19)'
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: 'Israel trusted that its covenant relationship would preserve it'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'where Israel had come to trust that its covenantal relationship to the Lord would secure its preservation'
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: 'The Bible Dictionary on 3:2'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'The fact that Israel is the covenant people would make their punishment the heavier (3:2; 9:7).'
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: 'Israel’s covenants required a higher ethical standard than the nations’ treaties'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'required an even higher awareness and practice of the ethical standard, one that exceeded that of the temporal covenants of kinship entered into by other nations'
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: 'The verb of “punish” in 3:2 is “visit upon,” and the lexicon lists 3:2 and 3:14 together'
    key: bdb
    url: 'https://biblehub.com/hebrew/6485.htm'
    quote: 'visit upon'
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: 'The lexicon’s references for “visit upon” (of sin) begin with Amos 3:2, 14'
    key: bdb
    url: 'https://biblehub.com/hebrew/6485.htm'
    quote: 'Amos 3:2,14; Hosea 1:4'
  - where: 'note 3:2 “Known, and therefore punished”'
    claim: 'The wording of Hosea 13:5 and Genesis 18:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'For I know him, that he will command his children and his household after him'

  # ---- note 3:3 ----
  - where: 'note 3:3 “Two who have arranged to meet”'
    claim: 'The lexicon gives the sense in Amos 3:3 as meet by appointment'
    key: bdb
    url: 'https://biblehub.com/hebrew/3259.htm'
    quote: 'meet by appointment Amos 3:3'
  - where: 'note 3:3 “Two who have arranged to meet”'
    claim: 'The Hebrew word behind “agreed” (Strong’s 3259, in the Niphal)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'נוֹעָֽדוּ'
  - where: 'note 3:3 “Two who have arranged to meet”'
    claim: 'The Student Manual reads the two as the Lord and Israel'
    key: ot-manual-8
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-8?lang=eng'
    quote: 'It is necessary, if they are to walk together, for them to be in agreement.'
  - where: 'note 3:6 “Evil in a city is disaster”'
    claim: 'NRSVUE rendering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%203&version=NRSVUE'
    quote: 'Does disaster befall a city'
  - where: 'note 3:6 “Evil in a city is disaster”'
    claim: 'ESV rendering'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Amos%203&version=ESV'
    quote: 'Does disaster come to a city,'
  - where: 'note 3:6 “Evil in a city is disaster”'
    claim: 'The Joseph Smith Translation reads “known” for “done” (footnote 6b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/3?lang=eng'
    quote: 'known'

  # ---- note 3:7 warning ----
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'Amos emphasizes warning before destruction'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos was likely emphasizing that the Lord would not allow Israel to be destroyed without first revealing His intentions to His prophets and warning the people to repent.'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'The Joseph Smith Translation changes “but” to “until” (footnote 7a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/3?lang=eng'
    quote: 'until'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'Scripture Helps on the Joseph Smith Translation of 3:7'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'The Joseph Smith Translation of this verse changes the word “but” to “until.”'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'The Bible Dictionary on 3:7'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'Amos emphasizes that the Lord speaks through His prophets in warning mankind (3:7).'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'On 10 September 1843 Wilford Woodruff addressed a conference from Amos 3:7 (page 1726 of the history)'
    key: jsp-history-e1-1727
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/98'
    quote: 'Elder Wilford Woodruff addressed the Assembly from Amos 3 ch. 7 v.'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'The meeting was a conference, on 10 September 1843'
    key: jsp-history-e1-1727
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/98'
    quote: 'Conference met according to adjournment.'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'The discourse, continued on page 1727'
    key: jsp-history-e1-1727
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/99'
    quote: 'whenever God was about to bring a judgment upon the world or accomplish any great work, the first thing he did was to raise up a Prophet, and reveal unto him the secret, and send him to warn the people so that they may be left without excuse'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'Noah and Lot are the examples given'
    key: jsp-history-e1-1727
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/99'
    quote: 'This was the case in the days of Noah, and Lot'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'The document is the Manuscript History of the Church, volume E-1, page 1727'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'History, 1838–1856 (Manuscript History of the Church), volume E-1, 1727'
  - where: 'note 3:7 “Warning comes before judgment”'
    claim: 'Amos’s visions in chapter 7 are a preview in harmony with 3:7'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'That Amos would be privileged to preview God’s plans is in harmony with a statement from elsewhere in his book'

  # ---- note 3:7 secret ----
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'The lexicon’s entry for sôd is headed council, counsel'
    key: bdb
    url: 'https://biblehub.com/hebrew/5475.htm'
    quote: 'council, counsel'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'Amos 3:7 is placed under secret counsel which may be revealed'
    key: bdb
    url: 'https://biblehub.com/hebrew/5475.htm'
    quote: 'secret counsel, which may be revealed'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'Other renderings of the word'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'The Hebrew word for “secret” in Amos 3:7 can also be rendered “council,” “counsel,” or “plan.”'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'Many scholars read a heavenly council here (endnote 10)'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Many scholars suggest that the Lord revealing his secret to the prophets refers to prophets taking part in a heavenly council'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'NIV rendering'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Amos%203&version=NIV'
    quote: 'without revealing his plan'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'Amos 3:7 as a summary principle beside the examples of Micaiah, Isaiah and Jeremiah'
    key: hamblin-sod
    url: 'https://interpreterfoundation.org/journal/the-sod-of-yhwh-and-the-endowment'
    quote: 'Amos provides here a summary principle paralleling the explicit examples of Michaiah, Isaiah and Jeremiah given above.'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'The secret plan of the divine council'
    key: hamblin-sod
    url: 'https://interpreterfoundation.org/journal/the-sod-of-yhwh-and-the-endowment'
    quote: 'God reveals the sôd (secret plan) of his sôd (divine council) to his prophets.'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'The sôd is also the manifestation of the heavenly court'
    key: smoot-council-hebrew-bible
    url: 'https://interpreterfoundation.org/journal/the-divine-council-in-the-hebrew-bible-and-the-book-of-mormon'
    quote: 'the sôd in this passage is not just confidential instruction delivered by God but also the manifestation of God’s heavenly court'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'The council reading of Amos 3:7 is less clear than elsewhere'
    key: sc-knowhy-832
    url: 'https://scripturecentral.org/knowhy/why-are-other-people-with-god-when-he-is-planning-the-creation'
    quote: 'Although this is less clear, the divine council may also be implied in Amos 3:7'
  - where: 'note 3:7 “The secret and the Lord’s council”'
    claim: 'The wording of Jeremiah 23:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'For who hath stood in the counsel of the'

  # ---- note 3:8 ----
  - where: 'note 3:8 “Where the questions lead”'
    claim: 'The questions are a chain of similes establishing the right to prophesy'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'to establish his right and duty to prophesy, by a chain-like series of similes drawn from life'
  - where: 'note 3:8 “Where the questions lead”'
    claim: 'The examples show that the prophet’s words originate with God'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'The examples are evidently selected with the view of showing that the utterances of the prophet originate with God.'
  - where: 'note 3:8 “Where the questions lead”'
    claim: 'The questions answer the silencing of the prophets (with Amos 2:12; 7:13, 16 in its endnote)'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'to emphasize that silencing the prophets would not spare Israel from judgment'
  - where: 'note 3:8 “Where the questions lead”'
    claim: 'Scripture Helps’ endnote joins 2:12 with 7:13, 16'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'See also Amos 7:13, 16.'
  - where: 'note 3:8 “Where the questions lead”'
    claim: 'Keil reads the lion of verse 4 as Jehovah'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'The lion which roars when it has the prey before it is Jehovah'
  - where: 'note 3:8 “Where the questions lead”'
    claim: 'The wording of Amos 2:12 and 7:13 (the speaker in 7:12–13 is Amaziah, the priest of Beth-el, 7:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/7?lang=eng'
    quote: 'But prophesy not again any more at Beth-el'

  # ---- note 3:9 ----
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'Ashdod is a Philistine capital, named as a chief city of the uncircumcised'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'Ashdod, one of the Philistian capitals, is mentioned by way of example, as a chief city of the uncircumcised, who were regarded by Israel as godless heathen'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'The palace word is the same as in the oracles on the nations'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The Hebrew word for palace here is the same one Amos used when prophesying destruction upon the elite of other nations.'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'In chapters 1–2 fire devours the nations’ palaces'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Amos references the sending of fire to devour the nation-states’ “palaces” (Amos 1:4, 7, 10, 12, 14; and 2:1)'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'These buildings are the residences of the social and economic elite'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'the residences of the social and economic elite in the major cities of these nation-states'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'Why palace dwellers are summoned'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'only the inhabitants of the palace could pronounce a correct sentence as to the mode of life commonly adopted in the palaces of Samaria'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'Violence heaped up in the palaces like treasures'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'they who heap up sins and violence in their palaces like treasures'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'The lexicon places the verb of 3:13 under protest, affirm solemnly, warn'
    key: bdb
    url: 'https://biblehub.com/hebrew/5749.htm'
    quote: 'protest, affirm solemnly, warn'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'NRSVUE reads “testify against”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%203&version=NRSVUE'
    quote: 'Hear and testify against the house of Jacob,'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'Keil reads verse 13 as addressed to the foreign witnesses of verse 9'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/3.htm'
    quote: 'that they should bear witness against Israel from what they have heard'
  - where: 'note 3:9 “Foreign palaces called as witnesses”'
    claim: 'Ashdod is named among the Philistines in Amos 1:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: 'And I will cut off the inhabitant from Ashdod'

  # ---- note 3:11 ----
  - where: 'note 3:11 “The adversary is not named”'
    claim: 'Samaria was built by Omri as the capital, on a strong hill'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'a city built by Omri and made the capital of the kingdom of Israel. It occupied a strong position on a hill'
  - where: 'note 3:11 “The adversary is not named”'
    claim: 'The Assyrians took it after a three-year siege'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'the Assyrians could not capture it until after a siege of three years (2 Kgs. 17:5–6)'
  - where: 'note 3:11 “The adversary is not named”'
    claim: 'The wording of 2 Kings 17:6'
