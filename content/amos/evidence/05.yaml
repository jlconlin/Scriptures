  # ---- note 5:25 ----
  - where: 'note 5:25 “The forty years in the wilderness”'
    claim: 'The question expects the answer no'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'The question, "Have ye offered me sacrifices?" is equivalent to a denial, and the words apply to the nation as a whole, or the great mass of the people, individual exceptions being passed by.'
  - where: 'note 5:25 “The forty years in the wilderness”'
    claim: 'Sacrifice fell into disuse in the wilderness years'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'the sacrificial worship prescribed by the law fell more and more into disuse, so that the generation that was sentenced to die out offered no more sacrifices'
  - where: 'note 5:25 “The forty years in the wilderness”'
    claim: 'It cannot be inferred that the daily sacrifice stopped altogether'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'We cannot infer from this that the daily sacrificial worship was entirely suspended'
  - where: 'note 5:25 “The forty years in the wilderness”'
    claim: 'The verse is a charge of long faithlessness, not a statement that God does not wish for worship'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'but as a proof that from time immemorial Israel has acted faithlessly towards its God'
  - where: 'note 5:25 “The forty years in the wilderness”'
    claim: 'The verse is not there to support the assertion that God does not wish for worship'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'nor to support the assertion that God does not need or wish for their worship'
  - where: 'note 5:25 “The forty years in the wilderness”'
    claim: 'Stephen introduces the verse by saying God gave Israel up to worship the host of heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'Then God turned, and gave them up to worship the host of heaven; as it is written in the book of the prophets'
  - where: 'note 5:25 “The forty years in the wilderness”'
    claim: 'Jeremiah 7:22 says something like it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng'
    quote: 'For I spake not unto your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt offerings or sacrifices'

