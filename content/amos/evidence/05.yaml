  - where: 'note 5:26 “Moloch and Chiun: a verse whose names are uncertain”'
    claim: 'The lexicon reads kiyyun as the planet Saturn regarded as a god'
    key: bdb
    url: 'https://biblehub.com/hebrew/3594.htm'
    quote: 'proper name, of deity Amos 5:26, probably = Assyrian kaivânu, planet Saturn'
  - where: 'note 5:26 “Moloch and Chiun: a verse whose names are uncertain”'
    claim: 'A modern translation has the two names and a future tense'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'You shall take up Sakkuth your king and Kaiwan your star god, your images, which you made for yourselves'
