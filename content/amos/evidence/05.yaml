    quote: 'כִּיּ֣וּן'
  - where: 'note 5:26 “Moloch and Chiun: a verse whose names are uncertain”'
    claim: 'The Greek reads “the tabernacle of Moloch” and “Raephan”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/5.htm'
    quote: 'Yea, ye took up the tabernacle of Moloch, and the star of your god Raephan, the images of them which ye made for yourselves.'
  - where: 'note 5:26 “Moloch and Chiun: a verse whose names are uncertain”'
    claim: 'The Greek has “beyond Damascus” in verse 27, as the Hebrew does'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/amos/5.htm'
    quote: 'And I will carry you away beyond Damascus'
  - where: 'note 5:26 “Moloch and Chiun: a verse whose names are uncertain”'
