    claim: 'Stephen’s wording in Acts 7:43'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'Yea, ye took up the tabernacle of Moloch, and the star of your god Remphan, figures which ye made to worship them: and I will carry you away beyond Babylon.'
  - where: 'note 5:26 “Moloch and Chiun: a verse whose names are uncertain”'
