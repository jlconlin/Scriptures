chapter: 5
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Amos ministered about 760–750 B.C.'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'In the days of Amos’s ministry (760–750 BC), it appears these covenants had been disregarded not only by Israel’s neighbors, but by the Israelites themselves'
  - where: 'when'
    claim: 'His ministry was in the northern kingdom'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'his ministry was among those of the northern kingdom of Israel'

  # ---- setting ----
  - where: 'setting'
    claim: 'The time was one of peace and prosperity'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Instead, the Israelites were enjoying an era of peace and prosperity (2 Kings 14:23–29).'
  - where: 'setting'
    claim: 'Chapters 3–6 are the book’s second part: warnings to the Northern Kingdom and a plea to repent'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Amos 3–6: Warnings to the Northern Kingdom and Amos’s plea for the people to repent.'
  - where: 'setting'
    claim: 'Israel fell to Assyria in 722 B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'they were conquered by the Assyrians in 722 BC'
  - where: 'setting'
    claim: 'The fall came within a few decades of Amos’s ministry'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'All of these prophecies of doom were fulfilled within a few decades of Amos’s ministry to Israel.'
  - where: 'setting'
    claim: 'The gate of a city was where public business was done'
    key: bd-gate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gate?lang=eng'
    quote: 'The gate of a city was often a place for public business'
  - where: 'setting'
    claim: 'Stephen quotes verses 25–27 in Acts 7:42–43'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'as it is written in the book of the prophets, O ye house of Israel, have ye offered to me slain beasts and sacrifices by the space of forty years in the wilderness?'
  - where: 'setting'
    claim: 'The Bible Dictionary’s entry on Amos names verses 21–27'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'the sacrifices of animals lose their meaning if offered as substitutes for personal righteousness (5:21–27)'

  # ---- thread ----
  - where: 'thread'
    claim: 'Verses 1–17 are read together as a lament, and 18–27 as a second part'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'A Lament for Israel’s Sin'
  - where: 'thread'
    claim: 'The chapter sets what God requires (seek Him) against what Israel does (turn right into wrong)'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'God requires that they should seek Him, and forsake idolatry, in order to live (Amos 5:4-6); but Israel on the contrary, turns right into unrighteousness'
  - where: 'thread'
    claim: 'Worship and right action are not opposed in Amos'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The message of Amos, however, reconciles both orthodoxy and orthopraxy in ancient Israel when studied through covenants of kinship.'

  # ---- sections ----
  - where: 'section 3 plain'
    claim: '“Burdens of wheat” rendered as levies of grain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'and take from them levies of grain'
  - where: 'section 6 plain'
    claim: '“Meat offerings” rendered as grain offerings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'Even though you offer me your burnt offerings and grain offerings'

  # ---- note 5:1 ----
  - where: 'note 5:1 “A funeral song for a nation still living”'
    claim: 'The Hebrew of “lamentation” in 5:1 is qinah (H7015)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'קִינָ֖ה'
  - where: 'note 5:1 “A funeral song for a nation still living”'
    claim: 'Qinah is an elegy or dirge, the word used of David’s lament in 2 Samuel 1:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/7015.htm'
    quote: 'elegy, dirge 2 Samuel 1:17'
  - where: 'note 5:1 “A funeral song for a nation still living”'
    claim: 'David’s lament over Saul and Jonathan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/1?lang=eng'
    quote: 'And David lamented with this lamentation over Saul and over Jonathan his son'
  - where: 'note 5:1 “A funeral song for a nation still living”'
    claim: 'Israel then bore no marks of destruction'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The consequences of forgetting the covenant of kinship, however, had not yet arrived, and Israelite society bore no marks of such destruction.'
  - where: 'note 5:1 “A funeral song for a nation still living”'
    claim: 'A modern translation has “maiden Israel” and sets verses 1–17 under the heading of a lament'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'is maiden Israel'

  # ---- note 5:5 ----
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'Bethel: Jacob’s dream, and Jeroboam’s calf worship'
    key: bd-bethel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethel?lang=eng'
    quote: 'here Jacob had his dream, set up a pillar, and gave the place its name (28:19). It was a sanctuary in the days of Samuel (1 Sam. 7:16; 10:3). Jeroboam selected it as one of the places in which to set up the calf worship'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'Gilgal: Israel’s first camp west of the Jordan, later a place of idolatrous worship'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: 'The place near Jericho at which the Israelite camp was made on the first night after crossing the Jordan'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'Gilgal later the scene of idolatrous worship'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: 'but later it was the scene of idolatrous worship (Hosea 4:15; 9:15; 12:11; Amos 4:4; 5:5)'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'Beersheba: home of Abraham, Isaac and Jacob, and the southern limit of Israel'
    key: bd-beersheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beersheba?lang=eng'
    quote: 'The home of Abraham (Gen. 21:31), Isaac (26:23), and Jacob (28:10)'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'Beersheba was regarded as the southern limit of Israel'
    key: bd-beersheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beersheba?lang=eng'
    quote: 'was regarded as the southern limit of Israel (Judg. 20:1; 1 Sam. 3:20)'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: '“Pass” is to cross over; “come to nought” is come to nothing'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'or cross over to Beer-sheba'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'A modern translation has “come to nothing”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'and Bethel shall come to nothing'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'In Hebrew the name Gilgal is followed by the verb galah twice (ha-Gilgal galoh yigleh)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'גָּלֹ֣ה'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'Galah means to go into exile'
    key: bdb
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: 'galah: To uncover, reveal, go into exile, depart'
  - where: 'note 5:5 “Three shrines not to seek”'
    claim: 'Hosea 4:15’s Beth-aven is Bethel'
    key: bdb
    url: 'https://biblehub.com/hebrew/205.htm'
    quote: 'because Bethel, house of God, is given over to idolatry'

  # ---- note 5:8 ----
  - where: 'note 5:8 “Why a hymn to the Creator stands here”'
    claim: 'The seven stars are the Pleiades'
    key: bd-pleiades
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pleiades?lang=eng'
    quote: 'A constellation of seven stars (Job 9:9; 38:31).'
  - where: 'note 5:8 “Why a hymn to the Creator stands here”'
    claim: 'The Church’s footnote identifies the seven stars as the Pleiades and reads the name as Jehovah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/5?lang=eng'
    quote: 'HEB Jehovah.'
  - where: 'note 5:8 “Why a hymn to the Creator stands here”'
    claim: 'Verses 7–9 set Israel’s corruption against the Lord’s power'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'exhibits the moral corruption of the Israelites, in contrast with the omnipotence of Jehovah as it manifests itself in terrible judgments'
  - where: 'note 5:8 “Why a hymn to the Creator stands here”'
    claim: 'The train of thought of verses 7 and 8'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'They do this, whereas Jehovah is the Almighty, and can bring destruction suddenly upon them.'
  - where: 'note 5:8 “Why a hymn to the Creator stands here”'
    claim: 'Wormwood is a bitter plant, a figure for bitter wrong'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'wormwood, a bitter plant, is a figurative term denoting bitter wrong'
  - where: 'note 5:8 “Why a hymn to the Creator stands here”'
    claim: 'The same Hebrew verb (haphak, H2015) is “turn” in verse 7 and “turneth” in verse 8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'וְ/הֹפֵ֤ךְ'

  # ---- note 5:11 ----
  - where: 'note 5:11 “A covenant curse on the new houses”'
    claim: 'The Church’s footnote at “dwell” points to Deuteronomy 28:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/5?lang=eng'
    quote: 'Deut. 28:30.'
  - where: 'note 5:11 “A covenant curse on the new houses”'
    claim: 'Deuteronomy 28:30 and 39 are among the curses for breaking the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'Thou shalt plant vineyards, and dress them, but shalt neither drink of the wine, nor gather the grapes'
  - where: 'note 5:11 “A covenant curse on the new houses”'
    claim: 'Amos 9:14 promises the reverse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'they shall build the waste cities, and inhabit them; and they shall plant vineyards, and drink the wine thereof'

  # ---- note 5:12 ----
  - where: 'note 5:12 “What was done in the gate”'
    claim: 'The city gate was the place of public business; the entry cites Amos 5:10–15'
    key: bd-gate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gate?lang=eng'
    quote: 'The gate of a city was often a place for public business (Deut. 21:19; Ruth 4:1–11; 2 Sam. 3:27; 15:2; Job 31:21; Ps. 69:12; 127:5; Isa. 29:21; Jer. 38:7; Lam. 5:14; Amos 5:10–15).'
  - where: 'note 5:12 “What was done in the gate”'
    claim: 'The law forbade bribes and bending judgment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/16?lang=eng'
    quote: 'Thou shalt not wrest judgment; thou shalt not respect persons, neither take a gift: for a gift doth blind the eyes of the wise'
  - where: 'note 5:12 “What was done in the gate”'
    claim: '“Burdens of wheat” is an exacted gift of grain'
    key: bdb
    url: 'https://biblehub.com/hebrew/4864.htm'
    quote: 'exacted or enforced gift, from inferior'
  - where: 'note 5:12 “What was done in the gate”'
    claim: '“Treading” is trampling'
    key: bdb
    url: 'https://biblehub.com/hebrew/1318.htm'
    quote: 'probably your trampling'
  - where: 'note 5:12 “What was done in the gate”'
    claim: 'A modern translation has “levies of grain” and “push aside the needy in the gate”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'and take from them levies of grain'
  - where: 'note 5:12 “What was done in the gate”'
    claim: 'A modern translation of verse 12'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: 'and push aside the needy in the gate'
  - where: 'note 5:12 “What was done in the gate”'
    claim: 'The charges in 5:11–12 are breaches of the covenant’s duty to kin; the grain levy increased the elite’s profit against the law'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'Each of these transgressions constitutes an omission of deeds that would be explicitly expected in the kinship covenant discussed above.'
  - where: 'note 5:12 “What was done in the gate”'
    claim: 'The elite took advantage of the poor for profit'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'the elite took advantage of the poor to increase their own profits, actions forbidden by the law'

  # ---- note 5:15 ----
  - where: 'note 5:15 “Perhaps: the remnant of Joseph”'
    claim: '“It may be” is the Hebrew ulay, perhaps'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'But he expresses this hope as just a possibility: “It may be [ʾûlay, perhaps] that the Lord God of hosts will be gracious unto the remnant of Joseph” (Amos 5:15).'
  - where: 'note 5:15 “Perhaps: the remnant of Joseph”'
    claim: 'Ulay means perhaps'
    key: bdb
    url: 'https://biblehub.com/hebrew/194.htm'
    quote: 'ulay: Perhaps, maybe, possibly, if only'
  - where: 'note 5:15 “Perhaps: the remnant of Joseph”'
    claim: 'The doubt bears on God’s favor more than on whether a remnant will exist; survival without His favor is not life'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'any continued existence for a remnant of Israel without God’s gracious attention would be mere survival—not life'
  - where: 'note 5:15 “Perhaps: the remnant of Joseph”'
    claim: 'Amos takes for granted that there will be a remnant'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'focuses less on the “existence” of the remnant than on “whether or not it will enjoy God’s favor”'
  - where: 'note 5:15 “Perhaps: the remnant of Joseph”'
    claim: 'Amos cautions against trusting the remnant promise without fear'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'it expresses inspired skepticism that the promises associated with the remnant should be used by Israelites without fear and trembling'
  - where: 'note 5:15 “Perhaps: the remnant of Joseph”'
    claim: 'Amos names Joseph three times (5:6, 15; 6:6), as kinship language'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'three references to the patriarch Joseph (5:6, 15; and 6:6). The three references to Joseph are particularly instructive because they establish a familial kinship among the prophet’s audience.'
  - where: 'note 5:15 “Perhaps: the remnant of Joseph”'
    claim: 'The remnant of Joseph is the remaining posterity of a shared ancestor'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'the “remnant of Joseph” (5:15), or the remaining posterity of a shared ancestor'

  # ---- note 5:17 ----
  - where: 'note 5:17 “The Lord passes through, as in Egypt”'
    claim: 'The words are taken from Exodus 12:12'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'These words are easily explained from Exodus 12:12, from which Amos has taken them.'
  - where: 'note 5:17 “The Lord passes through, as in Egypt”'
    claim: 'Israel has become an Egypt'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'but has become an Egypt, which He will pass through as a judge'
  - where: 'note 5:17 “The Lord passes through, as in Egypt”'
    claim: 'Vineyards are places where rejoicing is looked for'
    key: keil-amos
    url: 'https://biblehub.com/commentaries/kad/amos/5.htm'
    quote: 'Even in all the vineyards, the places where rejoicing is generally looked for'
  - where: 'note 5:17 “The Lord passes through, as in Egypt”'
    claim: 'The verb in Amos 5:17 is abar (H5674)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'אֶעֱבֹ֥ר'
  - where: 'note 5:17 “The Lord passes through, as in Egypt”'
    claim: 'The verb in Exodus 12:12 is the same, abar (H5674)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/עָבַרְתִּ֣י'
  - where: 'note 5:17 “The Lord passes through, as in Egypt”'
    claim: 'The same verb in 7:8 and 8:2, “pass by,” is most likely “forgive”'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Something like “forgive” or “pardon” is the most likely fit for the context of Amos 7:8 and 8:2.'

  - where: 'thread'
    claim: 'Israel assumed the day would bring victory over enemies'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Many Israelites in Amos’s time assumed that the day of the Lord would bring them victory over their enemies.'

  # ---- note 5:21 ----
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'The offering the Lord most cares for is a righteous life'
    key: bd-amos
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amos?lang=eng'
    quote: 'Amos shows that the offering the Lord most cares for is a righteous life—the sacrifices of animals lose their meaning if offered as substitutes for personal righteousness (5:21–27).'
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'The burnt offering was burned whole on the altar'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The characteristic rite was the burning of the whole animal on the altar (Lev. 1:9; Deut. 33:10).'
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'The “meat offering” (minchah) is a meal offering'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'specially denotes an unbloody or meal offering'
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'The peace offering presupposed peace with God and ended in a shared meal'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'presupposed that the sacrificer was at peace with God; they were offered for the further realization and enjoyment of that peace. The characteristic rite was the sacrificial meal.'
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'A modern translation has festivals and grain offerings; it cross-references Leviticus 26:31'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Amos%205&version=NRSVUE'
    quote: '5.21 : Lev 26.31; Isa 1.11–16'
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'The Church’s footnote on “I will not smell”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/5?lang=eng'
    quote: 'IE I will not take heed of your sacrifices, incense, etc.'
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'Leviticus 26:31 threatens the same'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'and I will not smell the savour of your sweet odours'
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'Scholars cite 5:21–24 to set correct worship against correct action; one Latter-day Saint study answers that Amos reconciles them'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'they cite Amos 5:21–24 to bring into question the unity of Amos’s writings with Jewish law, arguing that there is a dichotomy between orthodoxy (correct worship/belief) and orthopraxy (correct action) in the prophet’s writings'
  - where: 'note 5:21 “Does the Lord reject sacrifice?”'
    claim: 'Amos reconciles the two when read through covenants of kinship'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'The message of Amos, however, reconciles both orthodoxy and orthopraxy in ancient Israel when studied through covenants of kinship.'

  # ---- note 5:24 ----
  - where: 'note 5:24 “Judgment here means justice”'
    claim: 'The Hebrew words are mishpat (H4941) and tsedaqah (H6666), the pair of verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'מִשְׁפָּ֑ט'
  - where: 'note 5:24 “Judgment here means justice”'
    claim: 'Mishpat is a verdict given in court and, abstractly, justice'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: 'a verdict (favorable or unfavorable) pronounced judicially'
  - where: 'note 5:24 “Judgment here means justice”'
    claim: 'Mishpat, abstractly, is justice'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: 'abstractly, justice, including a participant''s right or privilege'
  - where: 'note 5:24 “Judgment here means justice”'
