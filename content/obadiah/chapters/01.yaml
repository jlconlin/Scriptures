chapter: 1
title: Saviours Shall Come Up on Mount Zion
tagline: Obadiah sentences Edom for what it did to its brother on the day Jerusalem fell, then turns to the day of the LORD, when deliverance comes to mount Zion and the kingdom is the Lord’s.
when: 'Probably soon after the fall of Jerusalem in 586 B.C.'

setting: |
  Obadiah is the shortest book in the Old Testament: twenty-one verses against one neighbor. It names no king and gives no year. It was written after a conquest of Jerusalem, “probably its capture by the Babylonians in 586 BC.” The Bible Dictionary also allows an earlier conquest, “by the Philistines and Arabians during the reign of Jehoram, 848–844 B.C.,” but names the Babylonian one as “more probably” the occasion. On the later date Obadiah’s ministry “fits best in the 580s.” His words were for the people of Judah among whom he lived, who had just seen their city fall, whether or not the Edomites ever heard them.

  Edom lay south of Judah and the Dead Sea, a nation descended from Esau. When the people of Judah lost Jerusalem, the Edomites “gloated over their misfortune, looted the goods they left behind, and betrayed them to their enemies,” and that is the charge of verses 10–14. Who the Edomites were is told in the note at [[Jer. 49:7]]; the other passages on what they did are gathered at [[Ezek. 25:12]].

  Much of verses 1–7 is also in Jeremiah’s oracle against Edom (see the note on verse 5). For Latter-day Saints the book is known for its last verse, the source of the phrase “saviors on mount Zion” for the work done in temples for the dead (see the notes on verse 21).

thread: |
  **The day Edom gloated becomes the day of the LORD.**

  Verses 1–9 announce Edom’s fall: its fortress in the rock will be brought down, its allies will turn against it, and its wise men will be destroyed. Verse 10 gives the reason, and verses 11–14 press it with a single word. “Day” comes ten times in four verses: the day of Judah’s destruction, the day Edom stood by and then joined in.

  Verse 15 turns to another day, “the day of the LORD,” which is “near upon all the heathen,” and the charge becomes the sentence in its own terms: “as thou hast done, it shall be done unto thee.” From there the book looks past Edom. Mount Zion, the Lord’s “holy mountain,” will have “deliverance” and “holiness”; the house of Jacob will take back its land; and the last verse sets mount Zion over mount Esau and gives the final word to the Lord: “the kingdom shall be the LORD’s.”

sections:
  - range: 1-4
    heading: Edom brought down from the rock
    plain: |
      The vision of Obadiah. The Lord GOD says this about Edom. We have heard a report from the LORD, and a messenger has been sent among the nations: Up! Let us go to war against her. I will make you small among the nations, and you will be utterly despised. Your proud heart has fooled you, you who live in the clefts of the rock, high up, and say to yourself, Who can bring me down to the ground? Though you soar like the eagle and set your nest among the stars, I will bring you down from there, says the LORD.
  - range: 5-9
    heading: Stripped by its friends
    plain: |
      If thieves came to you, or robbers by night (how you are ruined!), wouldn’t they steal only what they wanted? If grape pickers came, wouldn’t they leave a few grapes? But how Esau has been searched out, his hidden treasures hunted down! All your allies have driven you to the border; the men you were at peace with have fooled you and overpowered you; those who eat your bread have set a trap under you, and Edom does not see it. In that day, says the LORD, I will destroy the wise men of Edom and the understanding of Esau’s mountain. Your warriors, Teman, will be terrified, so that everyone on Esau’s mountain is cut down in the slaughter.
  - range: 10-14
    heading: 'The charge: the day of your brother'
    plain: |
      Because of the violence you did to your brother Jacob, shame will cover you, and you will be cut off for ever. On the day you stood on the other side, the day strangers carried his forces away captive and foreigners came through his gates and cast lots for Jerusalem, you were one of them. You should not have looked on at your brother’s day, the day he became a stranger, or rejoiced over the people of Judah on the day of their ruin, or boasted on the day of their distress. You should not have come through my people’s gate on the day of their calamity, or looked on their suffering on the day of their calamity, or laid hands on their goods on the day of their calamity. You should not have stood at the crossroads to cut down those who escaped, or handed over the survivors on the day of distress.
  - range: 15-16
    heading: The day of the LORD
    plain: |
      For the day of the LORD is near for all the nations. As you have done, it will be done to you; what you dealt out will come back on your own head. As you drank on my holy mountain, so all the nations will drink without end; they will drink and swallow it down and be as if they had never been.
  - range: 17-21
    heading: Mount Zion and the kingdom
    plain: |
      But on mount Zion there will be deliverance, and there will be holiness; and the house of Jacob will take possession of what is theirs. The house of Jacob will be a fire and the house of Joseph a flame, and the house of Esau stubble; they will set it alight and consume it, and no one of the house of Esau will survive, for the LORD has spoken. The people of the south will possess Esau’s mountain, and the people of the plain will possess the Philistines’ land; they will possess the fields of Ephraim and of Samaria, and Benjamin will possess Gilead. The exiles of this host of Israel will possess the land of the Canaanites as far as Zarephath, and the exiles of Jerusalem who are in Sepharad will possess the cities of the south. Saviours will go up on mount Zion to rule mount Esau, and the kingdom will be the LORD’s.

notes:
  - ref: 1
    phrase: The vision of Obadiah
    kind: history
    title: Obadiah, servant of the LORD
    body: |
      Nothing is known of Obadiah’s life. His name means “servant (or worshipper) of YHWH,” and it was a common name: there are “thirteen different people named Obadiah in the Old Testament.” The best known is Ahab’s steward, who hid a hundred of the Lord’s prophets from Jezebel ([[1 Kgs. 18:4]]), and the Babylonian Talmud identifies him as the prophet Obadiah. That is a tradition, not history: the steward served in the mid-800s B.C., and the prophet most likely lived in Judah about the time of Jeremiah and Lehi.

      “Vision” is the word that also heads Isaiah and Nahum, and it is “perhaps better understood here as ‘revelation’”: none of these books is only a report of visions.
    sources: [bd-obadiah, pike-obadiah-21, gillum-obadiah, lds-scriptures]

  - ref: 1
    phrase: We have heard a rumour from the LORD, and an ambassador is sent among the heathen
    kind: words
    title: A report, a messenger, and a sentence already passed
    body: |
      The verse opens with a call to war: word has come from the Lord, and a messenger has gone out among the nations to rouse them against Edom. A “rumour” is a report, and the “ambassador” is “presumably a heavenly messenger,” though the Hebrew word can also mean a human envoy. Who “we” are is “not entirely clear.” The Septuagint reads “I have heard a report,” and so does Jeremiah’s form of the line: “I have heard a rumour from the LORD” ([[Jer. 49:14]]).

      In verse 2 the Lord speaks to Edom of its fall as already done: “I have made thee small.” Hebrew prophecy can use the past tense, as here, for what is foretold as certain. Many modern translations put it in the future, “I will surely make you least among the nations,” and the plain-words section does the same.
    sources: [pike-obadiah-21, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: thou that dwellest in the clefts of the rock
    kind: words
    title: The rock, and a city called Rock
    body: |
      Edom’s pride was its height. The clefts of the rock in verse 3 and the eagle’s nest among the stars in verse 4 picture the Edomites’ “presumed remoteness and security, which will avail them nothing.” Pride is the first of the charges against them, and the Lord answers it in kind: “thence will I bring thee down.”

      The word for “rock” is *selaʿ*, which is also the name of an Edomite stronghold, Sela, also known as Petra. Jeremiah uses the same words ([[Jer. 49:16]]), and the note there has more on Petra. Amaziah king of Judah “took Selah by war, and called the name of it Joktheel” ([[2 Kgs. 14:7]]), and Obadiah’s line has been read as “an obvious reference to the Edomite fortress city of Sela.”
    sources: [pike-obadiah-21, vandyke-ogden-twelve, bowen-ominous-onomastics, lds-scriptures]

  - ref: 5
    phrase: if the grapegatherers came to thee, would they not leave some grapes?
    kind: scripture
    title: 'Worse than thieves: Obadiah and Jeremiah 49'
    body: |
      Thieves take what they want and leave the rest; grape pickers leave gleanings. Edom will not be so lucky. Obadiah imagines “two cases of plundering in which there is still something left” to show “the complete clearing out of Edom,” and verse 6 says it outright: Esau’s hidden things are searched out.

      These lines, with much of verses 1–7, are also in Jeremiah’s oracle against Edom ([[Jer. 49:7–22]]); the note “Jeremiah and Obadiah” at [[Jer. 49:9]] sets the two side by side. One prophet may have drawn on the other, or “they both utilized an earlier source no longer extant”; the texts do not say which. Jeremiah’s oracle charges Edom with its pride, “the pride of thine heart” ([[Jer. 49:16]]). What Obadiah adds is the charge of verses 10–14, what Edom did on the day Jerusalem fell (see the note on verse 11).
    sources: [keil-obadiah, pike-obadiah-21, lds-scriptures]

  - ref: 6
    phrase: How are the things of Esau searched out!
    kind: history
    title: Why Esau
    body: |
      From verse 6 on, Obadiah calls Edom mostly by its ancestor’s name: Edom is named twice in the book and Esau seven times. The name carries the story of Genesis. Esau, “who is Edom” ([[Gen. 36:1]]), was Jacob’s twin, and the struggle between them began in Rebekah’s womb ([[Gen. 25:22–23]]). Calling the nation Esau makes its offense a family one. The Bible “does not view this tension-filled relationship as a struggle just between two political entities, but between kin,” and the charge in verse 10 is “violence against thy brother Jacob.” The note at [[Jer. 49:7]] says more about the two peoples.
    sources: [bowen-ominous-onomastics, pike-obadiah-21, lds-scriptures]

  - ref: 7
    phrase: they that eat thy bread have laid a wound under thee
    kind: words
    title: Betrayed at the table
    body: |
      Verse 7 is a betrayal by the people Edom trusted. The Hebrew calls them “the men of thy covenant” (the King James “confederacy”) and “the men of thy peace,” allies bound to Edom by covenant, and then those who eat its bread.

      What they lay “under” Edom is uncertain. The word translated “wound,” *māzôr*, is “very dubious, perhaps net”; the Septuagint and other ancient translations read “ambush.” The plain-words section says “trap.” Whatever it is, it is hidden, and the verse ends, “there is none understanding in him”: Edom does not see it coming, and the next verse names its wise men.
    sources: [keil-obadiah, oshb-wlc, bdb]

  - ref: 8
    phrase: even destroy the wise men out of Edom
    kind: words
    title: The servant and the destroyer
    body: |
      Verses 8–9 take away Edom’s two defenses: its “wise men,” in this context “political and military advisers,” and its “mighty men,” its warriors. Teman, an important city of Edom, stands for the whole nation (see “The wisdom of Teman” at [[Jer. 49:7]]).

      “Destroy” makes a pun on the prophet’s name. Obadiah is *ʿōbēd*, “servant,” and *yāh*, “the Lord”; the verb here comes from the like-sounding *ʾbd*, “to destroy.” The sound returns in verse 12, “the day of their destruction” (*ʾobdām*).
    sources: [pike-obadiah-21, bowen-ominous-onomastics]

  - ref: 11
    phrase: even thou wast as one of them
    kind: history
    title: Edom on the day Jerusalem fell
    body: |
      The charge of verses 11–14 moves from standing by to taking part. Edom “stoodest on the other side” while foreigners entered Jerusalem’s gates and cast lots for it; then it looked on, rejoiced, spoke proudly, went in through the gate, laid hands on the goods, stood at the crossroads to cut off those who escaped, and handed over the survivors. The Babylonians were the “strangers” and “foreigners” of verse 11; Edom joined in as Jerusalem was plundered, and it caught the people who fled and turned them over to Babylon’s forces.

      The Old Testament’s histories do not describe what Edom did; the prophets and psalms remember it. Lamentations alludes to it ([[Lam. 4:21–22]]), and a psalm of the exiles prays, “Remember, O LORD, the children of Edom in the day of Jerusalem; who said, Rase it, rase it, even to the foundation thereof” ([[Ps. 137:7]]). The note “What Edom did” at [[Ezek. 25:12]] gathers the other passages.
    sources: [vandyke-ogden-twelve, pike-obadiah-21, gillum-obadiah, lds-scriptures]

  - ref: 13
    phrase: in the day of their calamity
    kind: words
    title: A pun on Edom
    body: |
      Verse 13 says “in the day of their calamity” three times, and the word is a pun. “Their calamity” is *ʾêdô*, close in sound to *ʾĕdôm*, Edom, so that the nation that joined in Judah’s disaster hears its own name in the word for it. Obadiah “effectively ties the name Edom to ‘calamity.’” It is one of the ten “days” of verses 11–14, the day “in which the Edomites participated in despoiling and exploiting the Judahites.” Verse 15 names a different day.
    sources: [bowen-ominous-onomastics, pike-obadiah-21]

  - ref: 15
    phrase: as thou hast done, it shall be done unto thee
    kind: scripture
    title: Measure for measure
    body: |
      Verse 15 turns the charge into the sentence, and the words themselves turn. “Thou hast done” (*ʿāśîtā*) becomes “it shall be done unto thee” (*yēʿāśeh lāk*), the same verb first active and then passive, so that Edom’s “punishment will be both commensurate and retributive.” It is the principle of the law of Moses: “Eye for eye, tooth for tooth” ([[Ex. 21:24]]).

      The verse also widens the horizon: “the day of the LORD” (the note on [[Isa. 13:6]] explains the phrase; see also [[Joel 1:15]] and [[Amos 5:18]]) takes in all the nations, and Edom is one among them. One reading sees here “a sudden transition from immediate to ultimate things,” toward the last days.

      In antiquity the prophecy was fulfilled only in part. “The kingdom of Edom was destroyed by the Babylonians in 553,” but “the complete destruction of Edom and the subsequent rise of the Israelites and Jerusalem never happened in antiquity as prophesied.” The rest of the chapter looks beyond Obadiah’s age.
    sources: [bowen-ominous-onomastics, pike-obadiah-21, vandyke-ogden-twelve, lds-scriptures]

  - ref: 16
    phrase: For as ye have drunk upon my holy mountain
    kind: symbol
    title: Who drank on the holy mountain?
    body: |
      The “ye” of verse 16 is plural, where verse 15’s “thou” was Edom, and the change leaves open who drank. One reading takes “ye” as the Edomites or the Babylonians, or both, drinking in celebration on the temple mount after destroying it, and that drinking is set against the cup of judgment all the nations will drink. The reading “more generally accepted” takes “ye” as the people of Judah: they have drunk the cup of the Lord’s judgment in Jerusalem’s fall, and now the nations will drink it “continually,” until “they shall be as though they had not been.”

      On either reading the cup is the Lord’s wrath, the image Jeremiah uses for all the nations ([[Jer. 25:15–29]]); the theme page [The Cup of the Lord’s Fury](/jeremiah/themes/cup-of-fury/) follows it.
    sources: [pike-obadiah-21, lds-scriptures]

  - ref: 18
    phrase: the house of Joseph a flame, and the house of Esau for stubble
    kind: symbol
    title: Fire and stubble
    body: |
      Obadiah uses family names, “house” meaning descendants, so the reversal is again between brothers. The “house of Jacob” is “all Israelites (not just Judah),” and beside it stands the house of Joseph, father of the Ephraim whose fields verse 19 names ([[Gen. 41:52]]). Together they burn through Esau’s house like fire through dry stalks, the image Malachi uses for the wicked on the Lord’s day ([[Mal. 4:1]]).

      “There shall not be any remaining of the house of Esau” sits uneasily beside verse 21, where mount Esau is still there to be governed. One reconciliation: “the kingdom of Edom is more particularly intended in verse 18, while verse 21 construes mount Esau more broadly as the nations of the world.” Modern revelation gives Edom’s Greek name that wider sense: the Lord “shall come down in judgment upon Idumea, or the world” ([[D&C 1:36]]). One Latter-day Saint reading applies the image of fire to the gospel, which “will give light to those who seek it and burn up the wicked.”
    sources: [pike-obadiah-21, vandyke-ogden-twelve, lds-scriptures]

  - ref: 20
    phrase: which is in Sepharad
    kind: history
    title: Zarephath and Sepharad
    body: |
      Verses 19–20 redraw the map in every direction, and their key word is “possess,” *yāraš*, “to possess, to dispossess,” which marks the reversal: those who lost their land take it back, and Esau’s mountain with it. At the edges stand two names. Zarephath, where Elijah stayed with the widow ([[1 Kgs. 17:9]]), is “a city lying between Tyre and Sidon.” Sepharad, where some of Jerusalem’s exiles were living, has a location that is “dubious”; one proposal compares *Sparda*, Sardis in Asia Minor. The Septuagint reads “Ephratha” instead. Wherever it was, the verse’s point is the return: the exiles “shall possess the cities of the south.”
    sources: [pike-obadiah-21, bd-zarephath, bdb, lxx-rahlfs]

  - ref: 21
    phrase: to judge the mount of Esau
    kind: words
    title: Saviours, or the saved?
    body: |
      In Obadiah’s setting the “saviours” are deliverers like the judges. The Hebrew *mōšiʿîm*, “deliverers” or “saviors,” comes from the verb “to help, save,” and its plural occurs elsewhere only in Nehemiah’s prayer about the judges: “thou gavest them saviours, who saved them out of the hand of their enemies” ([[Neh. 9:27]]). The singular is used of Othniel: “the LORD raised up a deliverer to the children of Israel” ([[Judg. 3:9]]). “To judge” here means to govern: the verb “denotes passing judgment in legal decisions but also having authority over, governing.” “Mount Zion” in the Old Testament “typically refers to Jerusalem, particularly the temple mount,” and “the kingdom,” *mĕlūkâ*, is kingship: the Lord reigns.

      Hebrew was written without vowels, and the same consonants can be read as a passive, “those who have been saved.” The Septuagint read it so: “they that escape shall come up from mount Sion.” That reading picks up the “deliverance” of verse 17, a word that can also mean survivors (compare [[Joel 2:32]]), and some modern translations follow it. The King James Version follows the traditional Hebrew. Which is right “is based on interpretive considerations, not on unambiguous textual evidence.”
    sources: [pike-obadiah-21, scripture-helps-amos, lxx-rahlfs, lds-scriptures]

  - ref: 21
    phrase: And saviours shall come up on mount Zion
    kind: prophets
    title: Saviours on mount Zion in the Restoration
    body: |
      Latter-day Saints read this verse of temple work for the dead, as Joseph Smith taught it. In October 1841, in the published report of his discourse, he presented baptism for the dead “as the only way that men can appear as saviors on mount Zion.” In April 1842 the *Times and Seasons*, which he then edited, told the Saints they were “commanded to be baptized for our dead thus fulfilling the words of Obadiah when speaking of the glory of the Latter Day,” quoting the verse as “to judge the remnant of Esau.” In January 1844 he answered how they become saviours: “By building their temples” and receiving the ordinances in behalf of their dead. The verse “refers to the doctrine of salvation for the dead.” Brigham Young, drawing on it without naming Obadiah, spoke of saviours who would “save the house of Esau, which is the Gentile nations.”

      What Obadiah’s first hearers understood was deliverers for a ruined Judah (see the note above). Latter-day prophets “have applied Obadiah’s prophecy to the last days.” One Latter-day Saint study, observing that Obadiah “does not appear to have been teaching his contemporaries” about proxy ordinances, compares Joseph Smith’s use of the verse to Peter’s use of Joel at Pentecost. Peter said, “this is that which was spoken by the prophet Joel” ([[Acts 2:16]]), yet Moroni later told Joseph Smith that Joel’s prophecy “was not yet fulfilled, but was soon to be” ([[JS—H 1:41]]). On that study’s reading Joseph Smith, like Peter, applied an ancient promise to the work of his own day, and its fullest fulfillment, at the Lord’s coming, is still ahead.
    sources: [jsp-discourse-1841-10-03, jsp-times-seasons-1842-04-15-p761, jsp-history-e1-1866, bd-obadiah, pike-obadiah-21, scripture-helps-amos, lds-scriptures]

christ: |
  The book’s last words are about the Lord: “the kingdom shall be the LORD’s.” The verse presents Him “exercising his kingship, as the ultimate ruler over all,” and the saviours who come up on Zion serve under that kingship. Modern revelation calls the Lord’s people “to be a light unto the world, and to be the saviors of men” ([[D&C 103:9]]), and such saving work “extends, but does not replace, the great saving power of Jesus’s atoning sacrifice.” President Gordon B. Hinckley taught: “Just as our Redeemer gave His life as a vicarious sacrifice for all men, and in so doing became our Savior, even so we, in a small measure, when we engage in proxy work in the temple, become as saviors to those on the other side.”

  A Latter-day Saint who serves in the temple does for the dead, in a small measure, what Christ did for all: the work they have no means of doing for themselves.

