divisionsBlurb: One chapter of twenty-one verses. The Lord brings proud Edom down from its rock for what it did to its brother Judah on the day Jerusalem fell. Then the day of the LORD turns on all the nations, deliverance comes on mount Zion, and saviours come up there.
