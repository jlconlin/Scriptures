  blurb: The shortest book in the Old Testament. Obadiah foretold the fall of Edom, which joined in when Jerusalem fell. His last verse, of saviours on mount Zion, is one Joseph Smith taught is fulfilled in ordinances for the dead.

intro: |
  Obadiah is the shortest book in the Old Testament: one chapter of twenty-one verses, “The vision of Obadiah” ([[Obad. 1:1]]). Nothing is known of the prophet but his name, which means “servant of the Lord.” His book was probably written after the Babylonians took Jerusalem in 586 B.C. It is a word against Edom, the nation descended from Esau, whose people dwelt in “the clefts of the rock” south of the Dead Sea ([[Obad. 1:3]]). When foreigners entered Jerusalem's gates, Edom “wast as one of them” ([[Obad. 1:11]]).

  Edom had treated its “brother Jacob” ([[Obad. 1:10]]) as an enemy. It gloated over Judah, looted the city, and cut off those who escaped. Obadiah declares that “as thou hast done, it shall be done unto thee” ([[Obad. 1:15]]). Then he looks past Edom to the day of the LORD on all the nations, when “upon mount Zion shall be deliverance” ([[Obad. 1:17]]). His last verse is familiar to Latter-day Saints: “saviours shall come up on mount Zion … and the kingdom shall be the LORD’s” ([[Obad. 1:21]]). Joseph Smith taught that the Saints fulfill those words when they are baptized and receive the temple's ordinances for their dead. This companion goes through the chapter and tries to anticipate the questions a careful reader would ask.

  For the fall of Jerusalem and Judah's neighbors in those years, see [Babylon and the Exile](/old-testament/guides/babylon-and-the-exile/#nations).

