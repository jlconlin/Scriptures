summary: >-
  Obadiah is a single short vision against Edom, the proud brother who built its nest
  high in the rock and stood by on the day Jerusalem fell. The Lord says He will bring
  that height down, and the book turns past Edom to a mountain where deliverance and
  holiness are found and where saviours come up. The image sets the high, lonely rock
  beside a higher mountain in the light, with a path climbing toward its summit, and
  rests on the book's last line: the kingdom shall be the LORD's.
motifs:
  - "Mount Zion in dawn light (Obad. 1:17, 1:21): a broad, calm mountain with a level, open summit, the highest form in the picture and its focal point. A plain worn stone path winds up its slope from the foreground to the top, with no one on it, and the warm gold light reaches the summit first."
  - "A rock stronghold of Edom with an empty nest (Obad. 1:3–4): on the left, a tall, narrow crag of red-clay stone, split by deep clefts, standing in cool shadow. High in a cleft near its top sits a single bare nest of sticks, empty, with no bird. The crag is whole and unbroken, and lower than Zion’s summit."
  - "A scatter of small, pale stars (Obad. 1:4) in the indigo upper sky above the crag, few and quiet, fading as the dawn sky warms toward the right."
composition: >-
  A wide, open landscape at first light, seen from a slightly raised viewpoint across a
  quiet valley. The picture divides gently along a diagonal. On the left the red crag
  rises in indigo and clay shadow under a dark sky with a few stars; on the right the
  mountain of Zion is broader and taller, lit gold and parchment cream, its summit
  reaching higher in the frame than the crag's tip. The stone path begins low in the
  right foreground, crosses the valley floor, and climbs the mountain to the top, so the
  eye is led from the shadowed rock to the lit summit. The nest is small and found on a
  second look. The mood is quiet, level and hopeful. No fire, no falling rock, no
  ruined city, no battle, no gate, no animals, no figures.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The lit mountain with the path to its summit** is Mount Zion, where “shall be deliverance, and there shall be holiness,” and where “saviours shall come up” until “the kingdom shall be the LORD’s” ([[Obad. 1:17]], [[Obad. 1:21]]).'
  - '**The red crag with the empty nest** is Edom, which dwelt “in the clefts of the rock” and said in its heart, “Who shall bring me down to the ground?” The Lord answers: “Though thou exalt thyself as the eagle, and though thou set thy nest among the stars, thence will I bring thee down” ([[Obad. 1:3–4]]).'
  - '**The few stars above the crag** are the height Edom claimed for its nest: “among the stars” ([[Obad. 1:4]]).'
asset: /assets/obadiah-book-art.jpg
alt: A tall red rock crag with deep clefts stands in shadow on the left under a few stars, with a single empty stick nest high in its rock. On the right a broader, taller mountain glows in golden dawn light, and a plain stone path climbs its slope to the open summit.
