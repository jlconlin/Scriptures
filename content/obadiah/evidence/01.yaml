chapter: 1
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Obadiah was written after a conquest of Jerusalem, probably the Babylonian capture of 586 BC'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'His prophecy was written after one of the conquests of Jerusalem—probably its capture by the Babylonians in 586 BC.'
  - where: 'when'
    claim: 'Obadiah’s ministry fits best in the 580s'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Given this assessment, Obadiah’s ministry and message fits best in the 580s.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Shortest book; written after a conquest of Jerusalem, probably 586; Edom descended from Esau; gloated, looted and betrayed'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Obadiah is the shortest book in the Old Testament. … a nation descended from Isaac’s son Esau. When Jerusalem was captured, the people of Edom refused to help the people of Judah, gloated over their misfortune, looted the goods they left behind, and betrayed them to their enemies.'
  - where: 'setting'
    claim: 'The Bible Dictionary gives the earlier conquest under Jehoram as possible and the Chaldean of 586 as more probable'
    key: bd-obadiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/obadiah?lang=eng'
    quote: 'The prophecy was spoken directly after some capture of Jerusalem (possibly by the Philistines and Arabians during the reign of Jehoram, 848–844 B.C., or more probably by the Chaldeans, 586 B.C.)'
  - where: 'setting'
    claim: 'Ministry fits the 580s; Edom lay south of Judah and the Dead Sea'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Obadiah contains a prophecy of judgment against Edom, which was located south of Judah and the Dead Sea.'
  - where: 'setting'
    claim: 'Whether or not the Edomites heard it, the prophecy was for the Judahites among whom Obadiah lived'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Whether or not this prophecy was ever actually communicated to the Edomites themselves, it had real value for the Judahites among whom Obadiah lived'
  - where: 'setting'
    claim: 'Latter-day Saints use “saviors on mount Zion,” from the last verse, of proxy temple work'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Latter-day Saints have frequently used the phrase “saviors on mount Zion” in relation to proxy temple work for the dead. This phrase comes from the twenty-first, and last verse, of Obadiah'

  # ---- thread ----
  - where: 'thread'
    claim: '“Day” comes ten times in verses 11–14, the day of the Babylonian destruction in which Edom took part'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Obadiah’s use of the Hebrew word yōm, “day,” as a theme word is readily apparent in verses 11–14, where it occurs ten times.'
  - where: 'thread'
    claim: 'Verse 15 pivots to the day of the LORD'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'However, verse 15 pivots to highlight a new and different day, the future “day of the Lord.”'
  - where: 'thread'
    claim: 'Mount Zion is the equivalent of “my holy mountain” in verse 16'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'By contrast, Obadiah 1:17–18 promises “deliverance” and “holiness” for the righteous on mount Zion, which is the equivalent of “my holy mountain” in verse 16.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'The prophetic past of verse 2 is rendered as future, as in modern translations'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Many modern translations render these forms in the future tense to capture the sense of what is prophesied to happen to Edom; thus, “I will surely make you least among the nations” (NRSV).'
  - where: 'section 2 plain'
    claim: 'The “wound” of verse 7 is uncertain; perhaps a net, or an ambush'
    key: bdb
    url: 'https://biblehub.com/hebrew/4204.htm'
    quote: 'II. מָזוֺר noun masculine Obadiah 7 … very dubious, perhaps net (as something extended): ᵐ5 (ἔνεδρα), ᵑ6 ᵑ9 ambush'
  - where: 'section 5 plain'
    claim: '“To judge” in verse 21 means to govern'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'The Hebrew verb šāpaṭ, “to judge,” denotes passing judgment in legal decisions but also having authority over, governing. It functions with this latter sense in Obadiah 1:21'

  # ---- note 1:1 Obadiah ----
  - where: 'note 1:1 “Obadiah, servant of the LORD”'
    claim: 'Nothing is known of Obadiah’s personal history'
    key: bd-obadiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/obadiah?lang=eng'
    quote: 'A prophet who foretold the doom of Edom. Nothing is known of his personal history.'
  - where: 'note 1:1 “Obadiah, servant of the LORD”'
    claim: 'The name means Servant of the Lord; Ahab’s steward is the first Obadiah named'
    key: bd-obadiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/obadiah?lang=eng'
    quote: 'Servant of the Lord. (1) The steward of Ahab who protected the prophets of God from Jezebel (1 Kgs. 18).'
  - where: 'note 1:1 “Obadiah, servant of the LORD”'
    claim: 'The name means servant or worshipper of YHWH; thirteen Obadiahs in the Old Testament'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'The introduction includes only the prophet’s name, ʿbdyh, which means “servant (or worshipper) of YHWH / the Lord.” … There are thirteen different people named Obadiah in the Old Testament'
  - where: 'note 1:1 “Obadiah, servant of the LORD”'
    claim: '“Vision” also heads Isaiah and Nahum and is perhaps better understood as “revelation”'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'The Hebrew term ḥāzon, “vision,” also occurs in Isaiah 1:1 and Nahum 1:1 … It is perhaps better understood here as “revelation,” … none of these particular prophetic books are just vision reports'
  - where: 'note 1:1 “Obadiah, servant of the LORD”'
    claim: 'The Babylonian Talmud identifies the prophet with Ahab’s steward of the 800s B.C.'
    key: gillum-obadiah
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/obadiahs-vision-saviors-mount-zion'
    quote: 'The Babylonian Talmud insists that the prophet Obadiah was the same versatile man who somehow served both King Ahab and Elijah in the mid-800s B.C. and who hid one hundred righteous prophets'
  - where: 'note 1:1 “Obadiah, servant of the LORD”'
    claim: 'Obadiah most likely lived in Judah about the time of Jeremiah and Lehi'
    key: gillum-obadiah
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/obadiahs-vision-saviors-mount-zion'
    quote: 'Nothing is known of the prophet for whom the book is named, although Obadiah most likely lived in Judah about the time of Jeremiah, Lehi, and their contemporaries.'
  - where: 'note 1:1 “Obadiah, servant of the LORD”'
    claim: 'Ahab’s steward Obadiah hid a hundred prophets from Jezebel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: 'For it was so, when Jezebel cut off the prophets of the Lord, that Obadiah took an hundred prophets, and hid them by fifty in a cave'

  # ---- note 1:1 rumour ----
  - where: 'note 1:1 “A report, a messenger, and a sentence already passed”'
    claim: 'Who “we” is is not clear; the Septuagint and Jeremiah 49:14 read “I”; the ambassador is presumably a heavenly messenger, though the word can mean a human one'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'It is not entirely clear who the “we” is. Furthermore, the Greek Septuagint (LXX) reads “I” instead of “we” in this verse … The “ambassador” or envoy in Obadiah 1:1 is presumably a heavenly messenger (although the Hebrew term ṣîr can also refer to a human messenger'
  - where: 'note 1:1 “A report, a messenger, and a sentence already passed”'
    claim: 'The Septuagint reads “I have heard a report”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/obadiah/1.htm'
    quote: '1The vision of Obdias. Thus saith the Lord God to Idumea; I have heard a report from the Lord, and he has sent forth a message to the nations.'
  - where: 'note 1:1 “A report, a messenger, and a sentence already passed”'
    claim: 'Jeremiah’s version of the line reads “I”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'I have heard a rumour from the LORD, and an ambassador is sent unto the heathen'
  - where: 'note 1:1 “A report, a messenger, and a sentence already passed”'
    claim: 'Verses 2–7 are in the prophetic past; modern translations use the future'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Much of the message is presented in the prophetic past tense, as if these judgments have already happened—so for example, the KJV renders verse 2a as “I have made thee small among the heathen.” Many modern translations render these forms in the future tense'

  - where: 'note 1:1 “A report, a messenger, and a sentence already passed”'
    claim: 'The NRSV renders verse 2 in the future'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'thus, “I will surely make you least among the nations” (NRSV).'

  # ---- note 1:3 ----
  - where: 'note 1:3 “The rock, and a city called Rock”'
    claim: 'The high rock and the eagle’s nest picture Edom’s presumed remoteness and security'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'The imagery of the high “clefts of the rock” (v. 3) and of the eagle and its high nest (v. 4) is intended to illustrate the Edomites’ presumed remoteness and security, which will avail them nothing'
  - where: 'note 1:3 “The rock, and a city called Rock”'
    claim: 'Pride is the first of the charges against Edom'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Obadiah’s accusation against Edom was threefold: first, they were guilty of deep-seated pride and arrogance (see Obadiah 1:3–4).'
  - where: 'note 1:3 “The rock, and a city called Rock”'
    claim: '“Rock” is selaʿ, the Edomite city Sela, also known as Petra; read as a reference to the fortress Amaziah took'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Obadiah begins with a condemnation of Edom and its pride in terms of Sela (“rock,” thus also known as Petra) … Sweeney calls Obadiah’s use of selaʿ here “an obvious reference to the Edomite fortress city of Sela that was conquered by Amaziah and renamed Joktheel (2 Kings 14:7).”'
  - where: 'note 1:3 “The rock, and a city called Rock”'
    claim: 'Amaziah took Selah and renamed it Joktheel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'He slew of Edom in the valley of salt ten thousand, and took Selah by war, and called the name of it Joktheel unto this day.'

  # ---- note 1:5 ----
  - where: 'note 1:5 “Worse than thieves: Obadiah and Jeremiah 49”'
    claim: 'The two plunderings that leave something show the complete clearing out of Edom'
    key: keil-obadiah
    url: 'https://biblehub.com/commentaries/kad/obadiah/1.htm'
    quote: 'In order to exhibit the more vividly the complete clearing out of Edom, Obadiah supposes two cases of plundering in which there is still something left (Obadiah 1:5)'
  - where: 'note 1:5 “Worse than thieves: Obadiah and Jeremiah 49”'
    claim: 'Much of Obadiah 1–7 is in Jeremiah 49:7–22; dependence either way, or a common earlier source'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'In fact, much of the content of Obadiah 1–7 is also found in a prophecy against Edom in Jeremiah 49:7–22. It is usually presumed that one of these prophets was dependent on the other for these statements or that they both utilized an earlier source no longer extant'
  - where: 'note 1:5 “Worse than thieves: Obadiah and Jeremiah 49”'
    claim: 'Jeremiah’s oracle charges Edom with pride'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'Thy terribleness hath deceived thee, and the pride of thine heart'

  # ---- note 1:6 ----
  - where: 'note 1:6 “Why Esau”'
    claim: 'Edom is named twice and Esau seven times'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'The name Edom is used twice and Esau seven times.'
  - where: 'note 1:6 “Why Esau”'
    claim: 'The name Esau evokes the struggles of Genesis 25 and 27, begun in the womb; the relation is between kin'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Obadiah’s use of Esau presumably evoked in the minds of his Israelite hearers and readers the struggles between Jacob and Esau recounted in Genesis 25 and 27, struggles that began in Rebekah’s womb (25:22–24)'
  - where: 'note 1:6 “Why Esau”'
    claim: 'The Bible views the Judah–Edom tension as one between kin'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'The Bible does not view this tension-filled relationship as a struggle just between two political entities, but between kin.'
  - where: 'note 1:6 “Why Esau”'
    claim: 'Edom is Esau’s other name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/36?lang=eng'
    quote: 'Now these are the generations of Esau, who is Edom.'

  # ---- note 1:7 ----
  - where: 'note 1:7 “Betrayed at the table”'
    claim: 'The Hebrew has “the men of thy covenant” and “the men of thy peace”'
    key: keil-obadiah
    url: 'https://biblehub.com/commentaries/kad/obadiah/1.htm'
    quote: 'Even to the border have all the men of thy covenant sent thee: the men of thy peace have deceived thee, overpowered thee. They make thy bread a wound under thee.'
  - where: 'note 1:7 “Betrayed at the table”'
    claim: 'The word behind “confederacy” is bĕrît, covenant'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Obad.xml'
    quote: 'בְרִיתֶ֔/ךָ'
  - where: 'note 1:7 “Betrayed at the table”'
    claim: 'The word behind “wound” is māzôr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Obad.xml'
    quote: 'מָזוֹר֙'
  - where: 'note 1:7 “Betrayed at the table”'
    claim: 'māzôr is very dubious, perhaps a net; the Septuagint and other ancient versions read ambush'
    key: bdb
    url: 'https://biblehub.com/hebrew/4204.htm'
    quote: 'II. מָזוֺר noun masculine Obadiah 7 … very dubious, perhaps net (as something extended): ᵐ5 (ἔνεδρα), ᵑ6 ᵑ9 ambush'

  # ---- note 1:8 ----
  - where: 'note 1:8 “The servant and the destroyer”'
    claim: 'The wise men are political and military advisers; the mighty men warriors; Teman stands for the whole'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'the “wise men” of Edom, a designation for political and military advisers in this context, and its “mighty men,” or warriors … Teman was an important city in Edom. Here Teman functions as a synecdoche'
  - where: 'note 1:8 “The servant and the destroyer”'
    claim: 'Pun on the prophet’s name (ʿōbēd) with ʾbd, “destroy,” in verses 8 and 12'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'a pun on his own name (ʿōbēd, “servant,” + yāh, “the Lord” = “servant of the Lord”) in terms of the partially homonymous verb ʾbd, which in its causative stem means “to destroy” … A similar wordplay occurs verses later'

  # ---- note 1:11 ----
  - where: 'note 1:11 “Edom on the day Jerusalem fell”'
    claim: 'Three charges: pride; joining the Babylonians; catching those who fled and handing them over'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Second, as the Babylonians ransacked Jerusalem and burnt the temple, Edom “wast as one of them” … Third, Edomites colluded with the Babylonians by blocking mountain passes through which Jews fled … Those fleeing were caught by Edomites and turned over to Babylonian forces'
  - where: 'note 1:11 “Edom on the day Jerusalem fell”'
    claim: 'Edom’s role was ancillary but consensual; the Babylonians were the strangers and foreigners'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Edom’s ancillary but consensual role in those events … The Babylonians were “the [primary] strangers [who] carried away captive his [Judah’s] forces, and foreigners entered into his gates” (v. 11). But YHWH charges that the Edomites participated as well'
  - where: 'note 1:11 “Edom on the day Jerusalem fell”'
    claim: 'The Old Testament does not describe Edom’s part; Lamentations 4:21–22 alludes to it'
    key: gillum-obadiah
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/obadiahs-vision-saviors-mount-zion'
    quote: 'While Edomite participation in the destruction of Jerusalem is not specifically described in the Old Testament, it is mentioned in the apocryphal 1 Esdras 4:45 and alluded to in Lamentations 4:21–22.'
  - where: 'note 1:11 “Edom on the day Jerusalem fell”'
    claim: 'Psalm 137:7 remembers Edom in the day of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/137?lang=eng'
    quote: 'Remember, O Lord, the children of Edom in the day of Jerusalem; who said, Rase it, rase it, even to the foundation thereof.'

  # ---- note 1:13 ----
  - where: 'note 1:13 “A pun on Edom”'
    claim: '“Their calamity” (ʾêdô), three times in verse 13, plays on the name Edom (ʾĕdôm)'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Obadiah plays on the name Edom (ʾĕdôm) three times in terms of the expression “their calamity” … Obadiah effectively ties the name Edom to “calamity.”'
  - where: 'note 1:13 “A pun on Edom”'
    claim: 'The day of verses 11–14 is the day in which Edom took part in despoiling Judah'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'In that context, the “day” was the time of the Babylonian destruction of Jerusalem and Judah, the “day” in which the Edomites participated in despoiling and exploiting the Judahites.'

  # ---- note 1:15 ----
  - where: 'note 1:15 “Measure for measure”'
    claim: 'Active ʿāśîtā and passive yēʿāśeh lāk; the punishment commensurate and retributive'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Obadiah thus directly juxtaposes the active perfect verb form in the second person (ʿśy/ʿśh) with the third-person masculine passive (ʿāśîtā yēʿāśeh lāk) to create this wordplay. Esau and Edom’s punishment will be both commensurate and retributive.'
  - where: 'note 1:15 “Measure for measure”'
    claim: 'Verse 15 accords with the lex talionis of Exodus 21:23–25'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'This accords with the biblical lex talionis, the law of equivalent reciprocation, a “life for life, eye for eye, tooth for tooth'
  - where: 'note 1:15 “Measure for measure”'
    claim: 'Verse 15 brings in all the nations, Edom among them'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Obadiah prophesies that not just Edom will be destroyed, but rather that YHWH’s power will impact “all the heathen,” the non-Israelite “nations” (Heb. gôyîm), including the Edomites.'
  - where: 'note 1:15 “Measure for measure”'
    claim: 'From verse 15 a sudden transition from immediate to ultimate things, the last days'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Beginning in verse 15, however, the prophet makes a sudden transition from immediate to ultimate things to tell us what shall happen to the wicked in the last days.'
  - where: 'note 1:15 “Measure for measure”'
    claim: 'Edom’s kingdom was destroyed by the Babylonians in 553; the full reversal never happened in antiquity'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Historically, the kingdom of Edom was destroyed by the Babylonians in 553. However, the complete destruction of Edom and the subsequent rise of the Israelites and Jerusalem never happened in antiquity as prophesied in Obadiah.'

  # ---- note 1:16 ----
  - where: 'note 1:16 “Who drank on the holy mountain?”'
    claim: 'The “ye” of verse 16 is plural; one approach takes it as Edomites or Babylonians celebrating; the more generally accepted, as the Judahites who drank the cup of judgment'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'One approach assumes the “you/ye” in verse 16 is the Edomites or the Babylonians or both, and it contrasts their celebratory drinking after destroying Jerusalem and the temple … But the approach more generally accepted takes the plural “you/ye” in verse 16 as referencing the Judahites.'
  - where: 'note 1:16 “Who drank on the holy mountain?”'
    claim: 'Either way the drink is the wrath of YHWH, as in Jeremiah 25:15–29'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Either way, this theme of drinking down the wrath and judgments of YHWH is a powerful metaphor that occurs here and elsewhere in the Old Testament (e.g., Isaiah 51:17–23; Jeremiah 25:15–29; Psalm 75:8 [Heb. 9]).'

  # ---- note 1:18 ----
  - where: 'note 1:18 “Fire and stubble”'
    claim: 'The house of Jacob is all Israel; “house” means descendants; no survivor'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Using the term “house” (descendants) and family names (Jacob and Esau) instead of just political designations, Obadiah indicates the “house of Jacob,” all Israelites (not just Judah), will repossess their land'
  - where: 'note 1:18 “Fire and stubble”'
    claim: 'Fire and flame compared with Malachi 4:1'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'and on the Israelites acting as “fire” and “flame” that would “devour” their enemies (v. 18; cf. Malachi 4:1)'
  - where: 'note 1:18 “Fire and stubble”'
    claim: 'Verse 18 means the kingdom of Edom; verse 21 mount Esau as the nations'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Most likely, the kingdom of Edom is more particularly intended in verse 18, while verse 21 construes mount Esau more broadly as the nations of the world.'
  - where: 'note 1:18 “Fire and stubble”'
    claim: 'A Latter-day Saint reading: the fire of the gospel gives light and burns the wicked'
