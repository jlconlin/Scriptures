  # ---- note 1:21 words ----
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: 'mōšiʿîm, “deliverers” or “saviors,” from y-š-ʿ; the consonants can be vocalized as passive; the Septuagint read it so; some modern translations follow'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'described in the traditional Hebrew Bible, known as the Masoretic Text, as mōšiʿîm, “deliverers” or “saviors,” … can also be vocalized mūšāʿîm, a passive form meaning “those who have been saved.” The Jews who produced the early Greek translation … so understood this word'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: 'The text was written without vowels until the Masoretes'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Since the written Hebrew text of the Bible consisted only of consonants until the mid-first millennium AD, when the Masoretes added a vocalization system to preserve their traditional reading of the text'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: 'The plural occurs elsewhere only in Nehemiah 9:27, of the judges'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'The plural form mōšiʿîm occurs only in Obadiah 1:21 and in Nehemiah 9:27 … including this reference to judges who are recounted in the book of Judges'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: '“Deliverance” in verse 17 can mean a survivor; compare Joel 2:32'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Obadiah 1:17 begins with the phrase translated in the KJV as “But upon mount Zion shall be deliverance [pĕlēyṭâ]” (compare Joel 2:32). The word pĕlēyṭâ can also indicate a “survivor,” one who has escaped or been delivered'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: 'The choice of active or passive rests on interpretation; many commentators follow the Masoretic reading'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Thus, the determination to translate m(w)šʿym with an active or passive sense is based on interpretive considerations, not on unambiguous textual evidence.'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: '“To judge” means to govern here'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'The Hebrew verb šāpaṭ, “to judge,” denotes passing judgment in legal decisions but also having authority over, governing.'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: '“Kingdom” is mĕlūkâ, kingship or dominion'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'The Hebrew word mĕlūkâ can be translated as “kingship” or “dominion” as well as “kingdom”'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: 'Mount Zion typically refers to Jerusalem, particularly the temple mount'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'In the Old Testament, the term “Mount Zion” typically refers to Jerusalem, particularly the temple mount.'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: 'The Septuagint: “they that escape shall come up from mount Sion”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/obadiah/1.htm'
    quote: '21And they that escape shall come up from mount Sion, to take vengeance on the mount of Esau; and the kingdom shall be the Lord''s.'
  - where: 'note 1:21 “Saviours, or the saved?”'
    claim: 'Othniel is the deliverer of Judges 3:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: 'the Lord raised up a deliverer to the children of Israel, who delivered them, even Othniel the son of Kenaz'

  # ---- note 1:21 Restoration ----
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
