    key: jsp-discourse-1841-10-03
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-3-october-1841-as-published-in-times-and-seasons/1'
    quote: 'The speaker presented “Baptism for the Dead” as the only way that men can appear as saviors on mount Zion.'
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
    claim: '15 April 1842: baptism for the dead fulfills the words of Obadiah; the verse quoted with “remnant of Esau”'
    key: jsp-times-seasons-1842-04-15-p761
    url: 'https://www.josephsmithpapers.org/paper-summary/times-and-seasons-15-april-1842/11'
    quote: 'we are commanded to be baptized for our dead thus fulfilling the words of Obadiah when speaking of the glory of the Latter Day. “And saviours shall come up upon mount Zion to judge the remnant of Esau; and the kingdom shall be the Lords”.'
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
