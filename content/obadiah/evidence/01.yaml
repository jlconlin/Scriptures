    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/obadiah?lang=eng'
    quote: 'One of the better known passages of Obadiah is 1:21, speaking of “saviours … on mount Zion,” which refers to the doctrine of salvation for the dead.'
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
    claim: 'Brigham Young spoke of saviours saving the house of Esau, the Gentile nations'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'whereby saviours will come upon Mount Zion to save the house of Esau, which is the Gentile nations, from sin and death.'
