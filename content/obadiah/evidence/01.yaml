    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'This fire of the gospel will give light to those who seek it and burn up the wicked, latter-day “Edomites” as if they were stubble (see Obadiah 1:18; see also D&C 1:36).'
  - where: 'note 1:18 “Fire and stubble”'
