    quote: 'Although Brigham Young did not specifically mention Obadiah, he clearly drew upon Obadiah 1:21'
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
    claim: 'Joseph Smith was editor of the Times and Seasons in April 1842'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'since he functioned as the editor of Times and Seasons at this time'
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
    claim: 'Latter-day prophets have applied the prophecy to the last days and temple work'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Latter-day prophets have applied Obadiah’s prophecy to the last days, when Israel will be gathered, Zion will be established, and temple work will bless God’s children.'
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
    claim: 'Joseph Smith did with Obadiah 1:21 what Peter did with Joel; fullest fulfillment at the Second Coming'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'Joseph Smith appears to me to have done with Obadiah 1:21 what Peter did with Joel 2:28–32 … This models what Joseph Smith and other Latter-day Saints have done with Obadiah 1:21 … by applying to our latter-day dispensation a prophecy that seems to focus primarily on the Second Coming of Jesus'
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
    claim: 'Obadiah does not appear to have taught his contemporaries about proxy ordinances'
    key: pike-obadiah-21
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/obadiah-121'
    quote: 'So whether one assumes Obadiah himself understood future vicarious temple ordinances, he does not appear to have been teaching his contemporaries about them.'
  - where: 'note 1:21 “Saviours on mount Zion in the Restoration”'
    claim: 'Moroni told Joseph Smith that Joel’s prophecy was not yet fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'He also quoted the second chapter of Joel, from the twenty-eighth verse to the last. He also said that this was not yet fulfilled, but was soon to be.'

