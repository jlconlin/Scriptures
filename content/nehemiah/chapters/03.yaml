chapter: 3
title: Next unto Him Builded
tagline: Nehemiah sets down who built each stretch of Jerusalem’s wall, from the high priest at the sheep gate around the city and back again, and one company of nobles who would not bend their necks to the work.
when: 'The building of the wall, 445 or 444 B.C., finished on the twenty-fifth day of Elul (6:15).'

setting: |
  Chapter 2 ended with Nehemiah’s call, “Let us rise up and build,” and the people’s answer: “So they strengthened their hands for this good work” ([[Neh. 2:18]]). Chapter 3 shows the work under way. It names the builders and the stretch of wall or the gate that each party took; chapter 4 then tells how Sanballat and his allies tried to stop them ([[Neh. 4:1]]).

  Nearly every party builds “next unto” the one before, so the list follows the course of the wall and names the gates in the order they stood. It starts at the sheep gate in the northeast, near the temple, runs west along the north wall to the fish gate, turns down the western side by the valley gate, comes back up the east past the city of David and over Ophel, and ends at the sheep gate again (verse 32). Nehemiah wrote in enough detail, here, in his night ride ([[Neh. 2:13–15]]) and in the procession at the dedication ([[Neh. 12:27–40]]), that the sites of much of what he names can be estimated; the footnotes place four of the gates (sheep, fish, horse and east), each as “probably” there. Each line sums up a party’s whole share: the doors were hung only after every breach was closed ([[Neh. 6:1]]). The dates are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  In the book’s story of a man who prays and then works, this chapter is the work, and it is the people’s. The list counts forty-two sections of wall, each with its builders named. The high priest and his brethren take the first stretch and consecrate it (verse 1). After them come men from towns across the province and the rulers of its districts, goldsmiths, perfumers and merchants, Levites, priests and temple servants, and Shallum with his daughters. Many repair the piece opposite their own houses (verses 10, 23, 28–30). Group after group took up the work, and the list records the one refusal: the nobles of Tekoa held back while their townsmen built two stretches (verses 5, 27). The list ends where it began, at the sheep gate (verse 32), with the circuit of the wall closed.

sections:
  - range: 1-5
    heading: From the sheep gate to the men of Tekoa
    plain: |
      Eliashib the high priest and his fellow priests set to work and built the sheep gate. They consecrated it and hung its doors, and they built and consecrated the wall as far as the tower of Meah and on to the tower of Hananeel. Next to them the men of Jericho built, and next to them Zaccur son of Imri. The sons of Hassenaah built the fish gate: they laid its beams and hung its doors, with their locks and bars. Next to them Meremoth son of Urijah, son of Koz, made repairs; next, Meshullam son of Berechiah, son of Meshezabeel; next, Zadok son of Baana. Next to them the men of Tekoa made repairs, but their nobles would not put their necks to the work of their Lord.
  - range: 6-12
    heading: From the old gate to the tower of the furnaces
    plain: |
      Jehoiada son of Paseah and Meshullam son of Besodeiah repaired the old gate: they laid its beams and hung its doors, with their locks and bars. Next to them Melatiah of Gibeon and Jadon of Meronoth, men of Gibeon and of Mizpah, made repairs as far as the seat of the governor of the province west of the Euphrates. Next to him Uzziel son of Harhaiah, one of the goldsmiths, made repairs, and next to him Hananiah, one of the perfumers; and they fortified Jerusalem as far as the broad wall. Next to them Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs. Next, Jedaiah son of Harumaph repaired the stretch opposite his own house, and next to him Hattush son of Hashabniah. Malchijah son of Harim and Hashub son of Pahath-moab repaired another section and the tower of the furnaces. Next to him Shallum son of Halohesh, ruler of half the district of Jerusalem, made repairs, he and his daughters.
  - range: 13-15
    heading: The valley, dung and fountain gates
    plain: |
      Hanun and the people of Zanoah repaired the valley gate: they built it and hung its doors, with their locks and bars, and repaired a thousand cubits of the wall as far as the dung gate. Malchiah son of Rechab, ruler of the district of Beth-haccerem, repaired the dung gate: he built it and hung its doors, with their locks and bars. Shallun son of Col-hozeh, ruler of the district of Mizpah, repaired the fountain gate: he built it, covered it, and hung its doors, with their locks and bars, and he built the wall of the pool of Siloah by the king’s garden, as far as the stairs that go down from the city of David.
  - range: 16-27
    heading: From the city of David to Ophel
    plain: |
      After him Nehemiah son of Azbuk, ruler of half the district of Beth-zur, made repairs as far as the place opposite the tombs of David, the pool that had been made, and the house of the mighty men. After him the Levites made repairs under Rehum son of Bani; next to him Hashabiah, ruler of half the district of Keilah, repaired for his district. After him their kinsmen made repairs: Bavai son of Henadad, ruler of half the district of Keilah. Next to him Ezer son of Jeshua, ruler of Mizpah, repaired another section, opposite the ascent to the armoury at the turning of the wall. After him Baruch son of Zabbai earnestly repaired another section, from the turning of the wall to the door of the house of Eliashib the high priest. After him Meremoth son of Urijah, son of Koz, repaired another section, from the door of Eliashib’s house to its far end. After him the priests, the men of the plain, made repairs. After him Benjamin and Hashub repaired opposite their house, and after them Azariah son of Maaseiah, son of Ananiah, beside his own house. After him Binnui son of Henadad repaired another section, from Azariah’s house to the turning of the wall and the corner. Palal son of Uzai repaired opposite the turning of the wall and the upper tower that stands out from the king’s house by the court of the prison; after him Pedaiah son of Parosh. The temple servants lived on Ophel, as far as the place opposite the water gate on the east and the tower that stands out. After them the men of Tekoa repaired another section, opposite the great tower that stands out, as far as the wall of Ophel.
  - range: 28-32
    heading: Above the horse gate and back to the sheep gate
    plain: |
      Above the horse gate the priests made repairs, each opposite his own house. After them Zadok son of Immer repaired opposite his house, and after him Shemaiah son of Shechaniah, the keeper of the east gate. After him Hananiah son of Shelemiah and Hanun, the sixth son of Zalaph, repaired another section; after him Meshullam son of Berechiah repaired opposite his room. After him Malchiah the goldsmith’s son made repairs as far as the house of the temple servants and of the merchants, opposite the gate Miphkad, and to the upper room at the corner. Between the upper room at the corner and the sheep gate the goldsmiths and the merchants made repairs.

notes:
  - ref: 1
    phrase: they sanctified it, and set up the doors of it
    kind: words
    title: The priests consecrate their stretch
    body: |
      The priests did more than build their part of the wall: they consecrated it. The Hebrew verb is the one used for setting apart holy places, Mount Sinai, the altar, the tabernacle, and the court Solomon hallowed for the sacrifices at the temple’s dedication ([[1 Kgs. 8:64]]). Here it comes twice in the one verse, the second time with the stretch that ran on to the tower of Hananeel, and it is said of no other party in the list.

      The high priest’s company took the sheep gate, which the footnote places, probably, near the temple, where the sacrificial animals came in. The text does not describe what the priests did to consecrate it. It says only that the list begins with them and with the hallowing of what they built; the whole wall was dedicated when it was finished ([[Neh. 12:27–43]]).
    sources: [bdb, lds-scriptures]

  - ref: 5
    phrase: their nobles put not their necks to the work of their Lord
    kind: words
    title: Nobles who would not bend their necks
    body: |
      The nobles of Tekoa refused to take up the yoke of the work. In Hebrew the neck is where a yoke or a load is laid, as in Jeremiah’s yoke of Babylon: “the nations that bring their neck under the yoke of the king of Babylon, and serve him” ([[Jer. 27:11]]). To bring one’s neck to a work was to put it under another’s yoke, to put oneself in his service.

      Whose service is meant is not quite certain. The Hebrew word is a plural, literally *their lords*. The King James Version takes it as a plural of majesty naming God, “their Lord,” and the wall as a service God required and that was rendered to Him. The standard lexicon lists the verse instead under a human master, the governor, though among men such a plural is used of kings, which neither the rulers in Jerusalem nor Nehemiah were. Either way the nobles held back from a work the rest had shouldered, and the Tekoites without their nobles built a second stretch, opposite the great tower on Ophel (verse 27).
    sources: [bdb, keil-nehemiah, oshb-wlc, lds-scriptures]

  - ref: 9
    phrase: the ruler of the half part of Jerusalem
    kind: words
    title: Rulers of the districts
    body: |
      “The half part” is half of a district. The Hebrew word, *pelek*, means a district, and the King James Version renders it “part” in verses 9, 12 and 14–18. The list shows the province of Judah ([[Neh. 1:3]]) divided into districts, some of them in halves, each with its ruler: Jerusalem (verses 9 and 12), Beth-haccerem (verse 14), Mizpah (verses 15 and 19), Beth-zur (verse 16) and Keilah (verses 17–18).

      The rulers stand in the list among the builders, each at his own stretch; of two of them the text says “he built it, and set up the doors thereof” (verses 14–15). Beside them came the men of Jericho (verse 2), Tekoa (verse 5), Gibeon and Mizpah (verse 7), and Zanoah (verse 13). The list keeps the builders’ home towns, and the work drew on towns across the province, not on Jerusalem alone.
    sources: [bdb, lds-scriptures]

  - ref: 12
    phrase: he and his daughters
    kind: history
    title: Shallum and his daughters
    body: |
      Women built the wall too. Shallum, ruler of half the district of Jerusalem, repaired his section with his daughters, the only women in the list. The wall was divided into sections with a party assigned to each, and Shallum’s was a family.
    sources: [ludlow-nehemiah-minute, lds-scriptures]

christ: |
  In the King James Version the wall is “the work of their Lord” (verse 5), and the high priest began it by consecrating his part (verse 1). Nehemiah’s rebuilding of walls and of lives tells of a merciful Father who gave His Only Begotten Son, Jesus Christ, to atone for the sins of all. Latter-day disciples are also doing a great work, one that concerns the house of the Lord, His law and the protection found in Him, and like the builders of this chapter they do it side by side, each at a named place.

explore: |
  - **The wall dedicated.** [[Neh. 12:27–43]]: priests and Levites purify the people, the gates and the wall, and two companies walk upon it past many of these gates and towers.
  - **The rebuilt city in prophecy.** [[Jer. 31:38–40]] and [[Ps. 147:13]], whose notes draw on this chapter for the tower of Hananeel and the bars of the gates.
  - **The high priest’s house afterwards.** [[Neh. 13:4–9]] and [[Neh. 13:28]].
  - **A map.** The [*Old Testament Student Manual*, chapter 32](https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng) (32-5) has a map of the estimated places of the gates and walls.

