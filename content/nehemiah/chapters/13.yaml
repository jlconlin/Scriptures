chapter: 13
title: Remember Me, O My God, for Good
tagline: Back from the king, Nehemiah finds the covenant of chapter 10 slipping. An Ammonite is lodged in the temple, the Levites are unpaid, the Sabbath has become a market day, and men have made the marriages they swore off. He sets each right and ends his book asking God to remember him for good.
when: 'Verses 1–3 “on that day,” which the text does not date further. Verses 4–31 after Nehemiah came back from the king, in or after the thirty-second year of Artaxerxes (verse 6); the Bible Chronology dates his second mission 432 B.C.'

setting: |
  The last chapter of the book opens with a public reading of the law (verses 1–3), dated only “on that day.” Then Nehemiah explains what had happened while he was away. He had governed Judah for twelve years, up to the thirty-second year of Artaxerxes ([[Neh. 5:14]]), and then went back to the king (verse 6). “Artaxerxes king of Babylon” is the Persian king, who ruled Babylon by conquest; the title may also mean that Nehemiah went to him at Babylon. How long he stayed at court cannot be determined. The Bible Chronology dates this second mission 432 B.C. and sets the prophecy of Malachi beside it. Malachi may have been Nehemiah's contemporary, and his charges about tithes, priests and marriage stand close to this chapter ([[Mal. 3:8]]; [[Mal. 2:8]]; [[Mal. 2:11]]).

  Nehemiah tells the rest in his own voice, as he has since [[Neh. 12:31]], in four episodes: Tobiah's chamber in the temple (verses 4–9), the Levites' unpaid portions (verses 10–14), the Sabbath trade (verses 15–22), and the foreign marriages (verses 23–31). Three of them end with a prayer that God remember him (verses 14, 22, 31).

thread: |
  The chapter carries the book's second thread, a people held to its covenant, and shows what keeping it took. Each of Nehemiah's reforms goes back to a promise of chapter 10. The people had sworn not to give their children in marriage to the peoples of the land, not to buy on the Sabbath, to bring the tithes to the chambers of the temple, and not to forsake the house of their God ([[Neh. 10:30–31]]; [[Neh. 10:37–39]]). In his absence each promise had slipped, and each time he held the people to its terms. His question to the rulers, “Why is the house of God forsaken?” (verse 11), uses the covenant's own last line against them.

  At the end Nehemiah sums up his work in two things: he cleansed the people from foreign ways, and he set the service of the temple in order (verses 30–31). Then he leaves the record of it with God.

sections:
  - range: 1-3
    heading: The law read
    plain: |
      On that day the book of Moses was read aloud to the people, and in it they found written that no Ammonite or Moabite should ever enter the congregation of God, because their peoples had not met Israel with bread and water, but had hired Balaam to curse them; and our God turned the curse into a blessing. When the people heard the law, they separated from Israel all the foreigners among them.
  - range: 4-14
    heading: Tobiah's chamber and the Levites' portions
    plain: |
      Before this, Eliashib the priest, who had charge of the storerooms of the house of our God and was related to Tobiah, had made him a large room where the grain offerings, the frankincense and the vessels used to be kept, with the tithes of grain, new wine and oil commanded for the Levites, the singers and the gatekeepers, and the offerings for the priests. I was not in Jerusalem through all this, for in the thirty-second year of Artaxerxes king of Babylon I had gone to the king. Some time later I asked the king's leave and came to Jerusalem, and I learned of the wrong Eliashib had done for Tobiah in giving him a room in the courts of God's house. It angered me deeply, and I threw all Tobiah's household goods out of the room. I gave orders, and they purified the rooms, and I brought back into them the vessels of God's house, the grain offering and the frankincense.

      I also learned that the Levites had not been given their portions, so that the Levites and singers who did the service had gone off, each to his own field. I rebuked the officials and said, Why is the house of God forsaken? Then I gathered them together and set them back in their places. And all Judah brought the tithe of grain, new wine and oil into the storerooms. Over the storerooms I put Shelemiah the priest, Zadok the scribe, and Pedaiah of the Levites, and with them Hanan son of Zaccur, son of Mattaniah, because they were considered trustworthy; their task was to distribute to their brothers. Remember me for this, my God, and do not wipe out the good I have done for the house of my God and its services.
  - range: 15-22
    heading: The Sabbath
    plain: |
      In those days I saw people in Judah treading winepresses on the Sabbath, bringing in sheaves and loading donkeys, and carrying wine, grapes, figs and every kind of load into Jerusalem on the Sabbath day; and I warned them on the day they sold food. Men of Tyre living there brought fish and all kinds of goods and sold them on the Sabbath to the people of Judah, in Jerusalem. I rebuked the nobles of Judah: What is this evil you are doing, profaning the Sabbath day? Is this not what your fathers did, so that our God brought all this disaster on us and on this city? Now you are bringing more wrath on Israel by profaning the Sabbath.

      So when the gates of Jerusalem grew dark before the Sabbath, I ordered them shut and not opened until the Sabbath was over, and I posted some of my own servants at the gates so that no load could be brought in on the Sabbath day. Once or twice the merchants and sellers of all kinds of goods spent the night outside Jerusalem. I warned them: Why are you spending the night by the wall? If you do it again, I will lay hands on you. From then on they did not come on the Sabbath. I ordered the Levites to purify themselves and come and guard the gates, to keep the Sabbath day holy. Remember me for this also, my God, and spare me according to the greatness of Your mercy.
  - range: 23-31
    heading: The marriages and the priesthood
    plain: |
      In those days I also saw Jews who had married women of Ashdod, Ammon and Moab. Their children spoke half in the language of Ashdod, or in the language of one people or another, and could not speak the Jews' language. I rebuked them and cursed them, struck some of them and pulled out their hair, and made them swear by God: You shall not give your daughters to their sons, or take their daughters for your sons or for yourselves. Did not Solomon king of Israel sin through such marriages? Among many nations there was no king like him; he was beloved of his God, and God made him king over all Israel; yet foreign women made even him sin. Are we then to listen to you and do all this great evil, breaking faith with our God by marrying foreign women?

      One of the sons of Joiada, son of Eliashib the high priest, was son-in-law to Sanballat the Horonite, so I drove him away from me. Remember them, my God, because they have defiled the priesthood and the covenant of the priesthood and of the Levites. So I cleansed them of everything foreign, and I set the duties of the priests and the Levites, each in his work, and arranged for the wood offering at the appointed times and for the firstfruits. Remember me, my God, for good.

notes:
  - ref: 1
    phrase: the Ammonite and the Moabite should not come into the congregation of God for ever
    kind: scripture
    title: The law read against Ammon and Moab
    body: |
      The law read named two nations, but the people applied it to every foreigner among them. [[Deut. 23:3–5]] bars the Ammonite and the Moabite for an old hostility on the way out of Egypt, which verse 2 recalls; the site reads that law at [[Deut. 23:1]], and Balaam's curse turned into a blessing at [[Num. 22]]–[[Num. 24]].

      Hearing it, the people “separated from Israel all the mixed multitude” (verse 3). The footnote takes the phrase back to the Exodus, where “a mixed multitude” of other peoples went up out of Egypt with Israel ([[Ex. 12:38]]). So a law about two nations became a separation from all the foreigners among them, as in the days of Ezra ([[Ezra 9:1–2]]; [[Ezra 10:44]]). The same Bible keeps the story of Ruth the Moabite, whose marriage in Israel led to the forebears of David ([[Ruth 4:17]]); how Isaiah's welcome to the foreigner stands beside this chapter is taken up at [[Isa. 56:3]].
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 4
    phrase: was allied unto Tobiah
    kind: history
    title: A chamber for Tobiah in the house of God
    body: |
      While Nehemiah was away, Tobiah the Ammonite, who had opposed the wall from the start ([[Neh. 2:10]]), was given a room in the temple itself. Eliashib the priest, who had charge of the temple's chambers, was “allied unto” him as a relative (on Tobiah's ties by marriage inside Judah, see [[Neh. 6:18]]). He made Tobiah a great room in the temple courts out of the storeroom that held the grain offerings, the frankincense and the vessels, and the tithes of grain, wine and oil owed to the Levites, the singers and the porters (verse 5). Tobiah's household goods were moved in, and the storeroom became his “dwelling place in the temple.”

      When Nehemiah came back he threw them out, had the chambers purified, and put the vessels and offerings back where they belonged (verses 8–9). It “grieved me sore,” he says: the room that held what was given to God and owed to His servants had become the private quarters of a man who had fought the work.
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 11
    phrase: Why is the house of God forsaken?
    kind: scripture
    title: The house of God forsaken
    body: |
      Nehemiah's question takes the covenant's last words and turns them on the men who made it. The people had sworn, “we will not forsake the house of our God” ([[Neh. 10:39]]), and in Nehemiah's days “all Israel… gave the portions of the singers and the porters, every day his portion” ([[Neh. 12:47]]). Now the portions had stopped, and the Levites and singers “that did the work” had gone back to their own fields (verse 10). The house stood, but those who served in it could not live by its service.

      Nehemiah rebuked the officials, brought the Levites back to their posts, and all Judah brought the tithe of grain, wine and oil to the storerooms again (verses 11–12). Then he put the distribution in the hands of four men, a priest, a scribe, a Levite and one more, “for they were counted faithful” (verse 13). On the storehouse and the Levites' portion in Malachi's day, see [[Mal. 3:10]].
    sources: [lds-scriptures]

  - ref: 18
    phrase: Did not your fathers thus
    kind: scripture
    title: The Sabbath that cost Jerusalem before
    body: |
      Nehemiah's argument against the Sabbath trade is the city's own history. While he was away, men in Judah had trodden winepresses and loaded donkeys on the Sabbath and carried grain, wine and fruit into Jerusalem, and men of Tyre sold fish and goods there on the day (verses 15–16). Buying and selling were among the things that profaned the Sabbath, and the people had promised not to buy on it ([[Neh. 10:31]]). Nehemiah made the Sabbath one of the chief points of his reformation.

      “Did not your fathers thus?” points back to Jeremiah, who stood in the gates of Jerusalem and warned that if the people carried burdens through them on the Sabbath, the LORD would “kindle a fire in the gates thereof” ([[Jer. 17:27]]; on what such a burden was, see [[Jer. 17:21]]). The fire came, and Nehemiah's question names the cause: breaking the Sabbath was a major reason for the judgments that ended in Babylon's destruction of the city. Nehemiah's shut gates draw on Jeremiah's words and urge the Jews of a century and a half later to keep the day better than their fathers had. To go on trading was to add to a wrath the people already knew: “yet ye bring more wrath upon Israel.”
    sources: [pike-sabbath-ot, bd-sabbath, lds-scriptures]

  - ref: 19
    phrase: I commanded that the gates should be shut
    kind: history
    title: Shutting the gates at dusk
    body: |
      Nehemiah's remedy was to close the city. As it grew dark on the evening before the Sabbath, the gates were shut, and they stayed shut until the Sabbath was over. He also set his own servants at them to stop any load; the watch was probably needed because the gates could not be held strictly shut against the city's own people through the whole day. Shut out, the merchants camped by the wall once or twice (verse 20), and the likeliest reading is that the trade then went on outside the gates, until Nehemiah threatened to lay hands on them (verse 21). Then they stopped coming.

      Last he gave the gates to the Levites, who were to purify themselves and keep them “to sanctify the sabbath day” (verse 22).
    sources: [keil-nehemiah]

  - ref: 22
    phrase: spare me according to the greatness of thy mercy
    kind: words
    title: My kindnesses and Thy mercy
    body: |
      Two of Nehemiah's prayers in this chapter turn on one Hebrew word. In verse 14 he asks God not to wipe out “my good deeds that I have done for the house of my God.” The word is the plural of *ḥesed*, goodness or kindness, which in the plural can mean pious acts, deeds done in devotion. In verse 22 the same word comes back as God's: “spare me according to the greatness of thy mercy,” the abundance of His *ḥesed*. That is how the prayer of chapter 9 described God, “of great kindness” ([[Neh. 9:17]]), in the words of [[Ex. 34:6]].

      Read together, the two verses show what kind of prayer Nehemiah's refrain is. He asks God to keep the record of the kindness he has done for His house, and then asks to be spared by the greatness of God's own kindness. The refrain began at [[Neh. 5:19]], where it is read as a prayer and not a boast.

      The theme page [And Forsookest Them Not](/nehemiah/themes/and-forsookest-them-not/) follows these prayers to be remembered through the book, with the forsaken house of verse 11, to the mercy the gospel names.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 24
    phrase: could not speak in the Jews’ language
    kind: words
    title: The Jews’ language
    body: |
      “The Jews' language” is Hebrew, the language of Judah. The Hebrew is one word, *yehudit*, “in Jewish,” the same word Hezekiah's officers used when they asked the Assyrian envoy to speak “in the Syrian language,” Aramaic, and not in Hebrew in the hearing of the people on the wall ([[Isa. 36:11]]; [[2 Kgs. 18:26]]). Some of these families' children spoke the language of Ashdod, one of the cities of the Philistines ([[Josh. 13:3]]), or the language of Ammon or Moab.

      Nehemiah reports the children's speech as one of the things he saw (verses 23–24), but does not say why it troubled him. The reason he gives for his rebuke comes two verses later, and it is Solomon.
    sources: [ludlow-nehemiah-minute, bdb, lds-scriptures]

  - ref: 26
    phrase: even him did outlandish women cause to sin
    kind: scripture
    title: Solomon’s example
    body: |
      Nehemiah's argument is Solomon, and the sin he means is the one the book of Kings names. No king among the nations was like him; he was “beloved of his God,” and God made him king over all Israel; yet in his old age “his wives turned away his heart after other gods” ([[1 Kgs. 11:4]]). “Outlandish” is the older English for foreign. Verse 27 turns the example on the men before him with a question: shall Judah then “hearken unto you” and do the same great evil?

      Before the argument comes what Nehemiah did, and he tells it plainly: he contended with the men, cursed them, struck some of them, pulled out their hair, and made them swear by God not to give or take sons and daughters in marriage with these peoples (verse 25), the promise of [[Neh. 10:30]]. As he reports it, the oath bound marriages yet to be made; he does not say that he dissolved those already made. For the same question in Ezra's day, see [[Ezra 10:44]]; for Malachi's charge, [[Mal. 2:11]].
    sources: [webster-1828, keil-nehemiah, lds-scriptures]

  - ref: 28
    phrase: was son in law to Sanballat the Horonite
    kind: history
    title: The high priest’s grandson
    body: |
      The last case reached the high priest's own family. A son of Joiada, and so a grandson of Eliashib the high priest, had married a daughter of Sanballat the Horonite, who had opposed the wall from the start ([[Neh. 2:10]]). Nehemiah “chased him from me”; the text does not say why, and the likeliest reason is that he would not give up the marriage. The law asked every priest to weigh the holiness of his office even in choosing a wife, and set the strictest rule for the high priest himself, who was to “take a virgin of his own people” ([[Lev. 21:14]]). This man was of the high priest's own house, so his marriage into Sanballat's house defiled the priesthood and “the covenant of the priesthood, and of the Levites” (verse 29). “Remember them” asks God to deal with them for it, and leaves the punishment to Him, as the prayer of [[Neh. 4:4]] does. The footnote sets Malachi's charge beside the verse: “ye have corrupted the covenant of Levi” ([[Mal. 2:8]]).

      Josephus tells of a marriage that is probably the same one, though he places it some 90 years later than the Bible does. He writes of Manasseh, of the high priest's family, who was threatened with the loss of his priesthood for marrying a foreign woman, Sanballat's daughter, and became the first high priest of a temple built on Mount Gerizim. The names and circumstances agree even though the dates do not, so the two accounts probably describe one marriage; if so, it led to the worship on Gerizim, which deepened and prolonged the breach between Jews and Samaritans.
    sources: [keil-nehemiah, bd-temple-on-mount-gerizim, lds-scriptures]

christ: |
  Nehemiah shut the gates of Jerusalem so that the Sabbath would be kept holy, and the Lord of that day is Christ: “the Son of man is Lord also of the sabbath” ([[Mark 2:28]]). In this dispensation the Lord gives His holy day so that a disciple may “more fully keep thyself unspotted from the world” ([[D&C 59:9]]); the Church gives no list of rules for it, and each disciple weighs what keeps the day holy.

  Nehemiah also asks God to remember his good deeds, yet his last plea is to be spared “according to the greatness of thy mercy” (verse 22). A disciple stands on the same ground, for no one can dwell in the presence of God “save it be through the merits, and mercy, and grace of the Holy Messiah” ([[2 Ne. 2:8]]).

