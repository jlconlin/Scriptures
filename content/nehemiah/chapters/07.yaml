chapter: 7
title: A Register of the Genealogy
tagline: With the wall finished and the gates guarded, Nehemiah finds a city with room for many and few to live in it, and God moves him to begin with a record of who belongs. He finds the register of the first return and copies it.
when: 'Just after the wall was finished (verse 1). The register copied in verses 6–73 is that of the first return, after the decree of Cyrus, which the Bible Chronology dates to 537 B.C. (Ezra 2).'

setting: |
  Chapter 6 ended with the wall finished on the twenty-fifth day of Elul ([[Neh. 6:15]]). Chapter 7 begins with what a finished wall still needs: doors hung, gates kept, and watchmen set (verses 1–3). It closes the first of the book's four parts, Nehemiah's first visit to Jerusalem and the rebuilding of the walls in spite of opposition (1:1–7:73). The king and the dates are in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  Most of the chapter is a document. Wanting a list of the community in Jerusalem, Nehemiah found the register of those who had come back first, with Zerubbabel and Jeshua under Cyrus, and copied it into his account (verses 6–73). It is the list of [[Ezra 2]], with differences in names and numbers, and the site's notes on that chapter explain the leaders ([[Ezra 2:2]]), the temple servants ([[Ezra 2:43]]), the priests without a register ([[Ezra 2:63]]) and the totals ([[Ezra 2:64]]). The Nehemiah of verse 7 is a man of that first company, not the author.

  What Nehemiah planned in verses 4–5 is carried out only in [[Neh. 11:1–2]]. Before he could act, the seventh month came, with the reading of the law, the booths of the Feast of Tabernacles ([[Neh. 8:14]]) and the covenant of chapters 8–10. Elul is followed by the seventh month, and nothing in the text sets it in a later year than the wall's. The last words of verse 73, “when the seventh month came,” lead straight into the scene of chapter 8.

thread: |
  A wall protects people, and Jerusalem had few. The chapter turns from stones to people. First the city is made safe against attack (verses 1–3). Then Nehemiah sets out to fill it, and the step God puts into his heart is a record: gather the leaders and the people and reckon them by genealogy (verses 4–5). From here the book turns to its second thread, a people rebuilt around the law: the community counted in this chapter is the one that gathers in the next to hear it read.

  The register he finds answers the question of who belongs as [[Ezra 2]] answered it. Houses are traced to a father or a hometown, priests, Levites, singers, doorkeepers and temple servants are counted by their offices, and at the end come those who “could not shew their father's house” and the priests whose register “was not found” (verses 61, 64). These were kept from the most holy things until there should stand up a priest with Urim and Thummim (verse 65; see [[Ezra 2:63]]). The chapter ends where it began, with the people settled, “every one unto his city” (verses 6, 73).

sections:
  - range: 1-3
    heading: The gates kept
    plain: |
      When the wall was built and I had hung the doors, and the doorkeepers, the singers and the Levites had been appointed, I put my brother Hanani and Hananiah, the commander of the fortress, in charge of Jerusalem, for Hananiah was a truly faithful man who feared God more than most. I told them: The gates of Jerusalem are not to be opened until the sun is hot. While the guards are still standing at their posts, have the doors shut and barred. And appoint watches from the people who live in Jerusalem, some at their posts and some each in front of his own house.
  - range: 4-5
    heading: A city with few people
    plain: |
      The city was wide and large, but there were few people in it, and the houses had not been built. Then my God put it into my heart to gather the nobles, the officials and the people, to be registered by their families. And I found the register of the families of those who had come up first, and this is what I found written in it.
  - range: 6-38
    heading: The families and the towns
    plain: |
      These are the people of the province who came up from the captivity, from among the exiles whom Nebuchadnezzar king of Babylon had carried away, and who came back to Jerusalem and Judah, each to his own town. They came with Zerubbabel, Jeshua, Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum and Baanah. This is the count of the men of the people of Israel. The descendants of Parosh, 2,172; of Shephatiah, 372; of Arah, 652; of Pahath-moab, through the lines of Jeshua and Joab, 2,818; of Elam, 1,254; of Zattu, 845; of Zaccai, 760; of Binnui, 648; of Bebai, 628; of Azgad, 2,322; of Adonikam, 667; of Bigvai, 2,067; of Adin, 655; of Ater, through Hezekiah, 98; of Hashum, 328; of Bezai, 324; of Hariph, 112; of Gibeon, 95. The men of Bethlehem and Netophah, 188; of Anathoth, 128; of Beth-azmaveth, 42; of Kirjath-jearim, Chephirah and Beeroth, 743; of Ramah and Geba, 621; of Michmas, 122; of Bethel and Ai, 123; of the other Nebo, 52. The people of the other Elam, 1,254; of Harim, 320; of Jericho, 345; of Lod, Hadid and Ono, 721; of Senaah, 3,930.
  - range: 39-60
    heading: Priests, Levites and the servants of the temple
    plain: |
      The priests: the descendants of Jedaiah, of the house of Jeshua, 973; of Immer, 1,052; of Pashur, 1,247; of Harim, 1,017. The Levites: the descendants of Jeshua and Kadmiel, of the line of Hodevah, 74. The singers: the descendants of Asaph, 148. The doorkeepers: the descendants of Shallum, Ater, Talmon, Akkub, Hatita and Shobai, 138. The temple servants: the descendants of Ziha, Hashupha, Tabbaoth, Keros, Sia, Padon, Lebana, Hagaba, Shalmai, Hanan, Giddel, Gahar, Reaiah, Rezin, Nekoda, Gazzam, Uzza, Phaseah, Besai, Meunim, Nephishesim, Bakbuk, Hakupha, Harhur, Bazlith, Mehida, Harsha, Barkos, Sisera, Tamah, Neziah and Hatipha. The descendants of Solomon's servants: of Sotai, Sophereth, Perida, Jaala, Darkon, Giddel, Shephatiah, Hattil, Pochereth of Zebaim, and Amon. All the temple servants and the descendants of Solomon's servants numbered 392.
  - range: 61-65
    heading: Those who could not prove their descent
    plain: |
      These came up from Tel-melah, Tel-haresha, Cherub, Addon and Immer, but they could not show their family or their ancestry, whether they belonged to Israel: the descendants of Delaiah, Tobiah and Nekoda, 642. And among the priests: the descendants of Habaiah, of Koz, and of Barzillai, who had married one of the daughters of Barzillai the Gileadite and was called by their name. They searched for their family record among those registered by genealogy, but it was not found, so they were excluded from the priesthood as unclean. The governor told them not to eat of the most holy food until a priest arose with the Urim and Thummim.
  - range: 66-73
    heading: The whole assembly and its gifts
    plain: |
      The whole assembly together numbered 42,360, besides their 7,337 male and female servants; and they had 245 singing men and singing women. They had 736 horses, 245 mules, 435 camels and 6,720 donkeys. Some of the heads of families gave to the work. The governor gave the treasury 1,000 drams of gold, 50 basins and 530 priests' garments. Some of the heads of families gave the treasury for the work 20,000 drams of gold and 2,200 pounds of silver. What the rest of the people gave was 20,000 drams of gold, 2,000 pounds of silver and 67 priests' garments. So the priests, the Levites, the doorkeepers, the singers, some of the people, the temple servants and all Israel lived in their towns. And when the seventh month came, the people of Israel were in their towns.

notes:
  - ref: 2
    phrase: for he was a faithful man, and feared God above many
    kind: history
    title: Two men over Jerusalem
    body: |
      Nehemiah gave the city to a man he could trust by blood and a man he could trust by character. Hanani is the brother who had come to Shushan with the news that the wall was broken ([[Neh. 1:2]]). Hananiah was “ruler of the palace,” that is, of the fortress north of the temple (the same *bîrâ* whose gates Nehemiah asked timber for, [[Neh. 2:8]]), which probably also held the Persian king's garrison.

      The reason the verse gives is not rank. The Hebrew calls Hananiah, literally, *like a man of truth*, a man who could truly be called faithful, and God-fearing “above many,” more than most. The footnote sets beside this the counsel Jethro gave Moses for choosing judges: “able men, such as fear God, men of truth” ([[Ex. 18:21]]), which asks for the same two things, the fear of God and truth, with the same Hebrew word for truth, *ʾemet*.
    sources: [keil-nehemiah, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: Let not the gates of Jerusalem be opened until the sun be hot
    kind: history
    title: Gates opened late and a watch at every house
    body: |
      Nehemiah's orders opened the gates only in the middle of the day and kept them guarded against attack. They were not to open “until the sun be hot,” well into the morning, and they were to be shut and barred “while they stand by,” while the guards were still at their posts.

      The watch itself was drawn from the people who lived in Jerusalem, some at the posts on the wall and some each “over against his house.”
    sources: [ludlow-nehemiah-minute]

  - ref: 5
    phrase: And my God put into mine heart to gather together the nobles, and the rulers, and the people, that they might be reckoned by genealogy
    kind: history
    title: Beginning with a register
    body: |
      Nehemiah credits the plan to God, and its first step is a record. The finished wall enclosed more city than there were people to fill it: Jerusalem was “large and great,” but those living in it were few and many of its homes were still to be built (verse 4). The remedy came only after chapters 8–10, when the people cast lots “to bring one of ten to dwell in Jerusalem the holy city” ([[Neh. 11:1]]). It began here, with a plan to gather the nobles, the rulers and the people and register them by their families.

      In doing so he found an older register, of those who “came up at the first,” the company that came with Zerubbabel and Jeshua (verse 7), and he copied it into his account. It is the list of [[Ezra 2]]. Later rabbis held that the two lists record different occasions, Ezra's the first return from Babylon and Nehemiah's the dedication of the temple; the verse itself says what Nehemiah found, the register of those who came first.

      The register traced every house to a father or a hometown, and it decided who could serve as a priest (verses 61–65).
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 10
    phrase: The children of Arah, six hundred fifty and two.
    kind: scripture
    title: Joseph Smith and the two lists
    body: |
      Most of Joseph Smith's changes to Nehemiah in his translation of the Bible are in this chapter, and they make its numbers agree with Ezra's. A reader who sets the two registers side by side finds the same families with different figures. The children of Arah are 775 in [[Ezra 2:5]] and 652 here; Azgad's are 1,222 there and 2,322 here (verse 17); Senaah's 3,630 there and 3,930 here (verse 38).

      Of the twenty-two verses the Prophet changed in Nehemiah, seventeen are in this chapter and change the families' numbers to conform to Ezra; one more changes a name to match. Changes of this kind are very rare in his translation. They raise the question whether such small matters called for revelation, or whether he noticed the discrepancy and looked it up. His own Bible may have been the printed source, since it has cross-references to the parallel account, and a table at the back mentions the discrepancy between Ezra and Nehemiah.

      The Latter-day Saint edition does not print these changes; its footnote at verse 6 sends the reader to the parallel list in [[Ezra 2:1]]. The total of the whole congregation, 42,360 (verse 66), is the same in both books with or without the changes; why that total exceeds its parts is taken up at [[Ezra 2:64]].
    sources: [lds-scriptures, nyman-jst-historical, jackson-salvation-souls, sc-knowhy-786]

christ: |
  The register decided who belonged by whether a name was found in it (verse 64), and the footnote on “register” (verse 5) points to the Topical Guide's “Book of Life,” the record scripture keeps for the holy city: none enter it but “they which are written in the Lamb's book of life” ([[Rev. 21:27]]). Joseph Smith taught that the book of life “is the record which is kept in heaven,” and that “whatsoever you record on earth shall be recorded in heaven” ([[D&C 128:7–8]]). The records Latter-day Saints keep of ordinances and of their families are part of that order, which God keeps through records and priesthood lines of authority, and Christ is the One in whose book the names are written.

explore: |
  - **The list again.** Read [[Ezra 2]] beside verses 6–73, with its notes.
  - **The city filled.** [[Neh. 11:1–2]], where the plan of verses 4–5 is carried out.
  - **Giving to build a house of God.** [[D&C 109:5]], which the footnote sets beside the gifts of verse 70.

