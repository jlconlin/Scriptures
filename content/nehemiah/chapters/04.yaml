chapter: 4
title: A Mind to Work
tagline: Sanballat and Tobiah mock the builders and then plot an attack. Nehemiah prays, sets a watch, and arms the people, and the wall goes up with a weapon in every builder’s reach.
when: 'During the building of the wall, 445 or 444 B.C., when it was joined together “unto the half thereof” (verse 6).'

setting: |
  Chapter 3 named the families who built the wall stretch by stretch; chapter 4 tells what the building provoked. Sanballat, the governor of Samaria, and Tobiah, an Ammonite official with influence in Jerusalem, have already been met at [[Neh. 2:10]] and [[Neh. 2:19]].

  Now that the wall is actually rising, their opposition grows in steps. First comes mockery in front of Samaria’s army (verses 1–3). Then a league of neighbors on every side plans a surprise attack (verses 7–8, 11). Last comes discouragement among the Jews themselves (verse 10), pressed on by repeated messages from Jews living near the enemy (verse 12). Judah was a province of the Persian Empire, so its enemies had to be careful not to attack the city openly; what they planned was a surprise raid (verse 11).

  Like most of the book, the chapter is told in Nehemiah’s own voice. It ends with the wall half built and the builders sleeping in their clothes; chapter 6 finishes the story. The dates and the Persian kings behind them are in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  Every threat in the chapter is met in two ways at once, by prayer and by work. Mockery gets a prayer (verses 4–5) and then more wall: “So built we the wall” (verse 6). A plot gets “Nevertheless we made our prayer unto our God, and set a watch against them day and night” (verse 9). Fear gets a command to “remember the Lord” and, in the same breath, to “fight for your brethren” (verse 14). A long wall with its builders spread thin gets a trumpet, and the promise “our God shall fight for us” (verse 20). Nehemiah posted guards and armed the workers, and the people relied on God’s help; neither took the place of the other.

  Verse 15 tells the outcome in the same double way. The enemies learned that their plan “was known unto us,” and “God had brought their counsel to nought,” and everyone went back to the wall, “every one unto his work.”

sections:
  - range: 1-6
    heading: Mocked, and building still
    plain: |
      When Sanballat heard that we were building the wall, he was furious and indignant, and he mocked the Jews. In front of his colleagues and the army of Samaria he said, What are these feeble Jews doing? Will they fortify themselves? Will they offer sacrifices? Will they finish in a day? Will they bring the burned stones back to life out of the heaps of rubble? Tobiah the Ammonite, standing beside him, said, Even what they are building, if a fox climbed on it, would break down their stone wall.

      Hear, O our God, for we are despised. Turn their scorn back on their own heads, and give them up as plunder in a land of captivity. Do not cover their iniquity, and do not let their sin be blotted out before You, for they have provoked You to anger in front of the builders.

      So we built the wall, and the whole wall was joined together up to half its height, for the people had a heart to work.
  - range: 7-12
    heading: A plot from every side
    plain: |
      But when Sanballat, Tobiah, the Arabians, the Ammonites, and the people of Ashdod heard that Jerusalem’s walls were being repaired and the gaps were beginning to close, they were very angry. All of them conspired together to come and fight against Jerusalem and to hinder the work. But we prayed to our God and set a guard against them day and night because of them.

      Meanwhile Judah said, The strength of the carriers is giving out, and there is so much rubble that we cannot build the wall. And our enemies said, They will not know or see anything until we are among them and kill them and stop the work. When the Jews who lived near the enemy came in, they told us ten times over that the enemy would come at us from every side.
  - range: 13-18
    heading: Armed builders
    plain: |
      So I stationed the people by their families, with their swords, their spears, and their bows, in the lowest places behind the wall and on the higher places. I looked things over, stood up, and said to the nobles, the officials, and the rest of the people, Do not be afraid of them. Remember the Lord, who is great and revered, and fight for your brothers, your sons and daughters, your wives, and your homes.

      When our enemies heard that we knew of their plan, and that God had frustrated it, all of us went back to the wall, each to his own work. From then on half of my servants worked, and the other half held the spears, shields, bows, and armor, and the leaders stood behind all the people of Judah. Those who built the wall and those who carried loads worked with one hand and held a weapon with the other. Every builder had his sword strapped at his side as he built, and the man who sounded the trumpet stayed beside me.
  - range: 19-23
    heading: The trumpet and the watch
    plain: |
      I said to the nobles, the officials, and the rest of the people, The work is great and spread out, and we are far apart from one another on the wall. Wherever you hear the trumpet, gather to us there. Our God will fight for us. So we kept at the work, with half of the men holding spears, from first light until the stars came out.

      At that time I also told the people, Let every man and his servant spend the night inside Jerusalem, so that they can guard us at night and work by day. So neither I, nor my brothers, nor my servants, nor the guards who followed me took off our clothes, except that each took them off for washing (see the note on verse 23).

notes:
  - ref: 2
    phrase: will they revive the stones out of the heaps of the rubbish which are burned?
    kind: history
    title: Sanballat’s four questions
    body: |
      Sanballat’s taunt is a string of questions, each scorning the Jews or their work. He did not mutter them: he spoke “before his brethren and the army of Samaria,” his fellow leaders and the troops under him, so the mockery was public.

      The first, rendered “will they fortify themselves?”, is better taken as asking whether they will leave the work to themselves: do these feeble people think they can build a city wall with their own poor resources? “Will they sacrifice?” mocks the other thing they relied on, their God, as if offerings could raise a wall by miracle; the ridicule is aimed at their faith and at the God they trusted as much as at their strength. “Will they make an end in a day?” doubts that the work could be done quickly. The last question doubts that they even had the materials. Jerusalem’s building stone was limestone, which fire softens and crumbles, so stones that had been through the fire had lost their strength, and “revive” is Sanballat’s sarcasm for making that dead stone fit for a wall again.

      Tobiah adds the punch line (verse 3): the light step of a fox would be enough to knock down whatever they build.
    sources: [keil-nehemiah]

  - ref: 4
    phrase: turn their reproach upon their own head
    kind: scripture
    title: A prayer against the mockers
    body: |
      Verses 4–5 break into the story without warning: the narrative stops, a prayer begins, and the text does not say who prayed it, though it speaks for the builders (“we are despised”). It asks God to turn the mockers’ contempt back onto their own heads, to give them up as plunder in a land of captivity, and not to “cover” their iniquity. To cover sin is to forgive it, as a psalm puts the two side by side: “Thou hast forgiven the iniquity of thy people, thou hast covered all their sin” ([[Ps. 85:2]]). The reason given is that the enemies “provoked thee to anger before the builders”: they had despised God openly, where His people could hear, by scorning the work done for Him.

      The prayer is spoken to God and leaves the answer to Him, and the next verse goes straight back to work: “So built we the wall.” The site reads prayers of this kind, and the Savior’s higher law of love for enemies beside them, with the cursing psalms at [[Ps. 137:8]]; that reading holds here and is not repeated. The opening cry, “Hear, O our God; for we are despised,” is close to [[Ps. 123:4]].
    sources: [ludlow-nehemiah-minute, keil-nehemiah, lds-scriptures]

  - ref: 6
    phrase: the people had a mind to work
    kind: words
    title: Half its height, and a heart to work
    body: |
      Verse 6, the chapter’s first report of progress, says how far the wall had risen and why. “All the wall was joined together unto the half thereof” does not mean that half the circuit was finished. The whole wall was closed up to about half its height, as modern translations render it (“joined together to half its height”). That is the point at which the enemies laid their plot (verses 7–8).

      “A mind to work” is, in Hebrew, *a heart to work* (*lev*). The Hebrew heart is the inner person, mind and will as much as feeling, so the phrase means that the people were set on doing the work. The verse puts the reason for the progress in the people themselves.
    sources: [esv, ot-manual-32, oshb-wlc, bdb]

  - ref: 7
    phrase: the walls of Jerusalem were made up
    kind: words
    title: Walls made up
    body: |
      “Made up” translates a Hebrew word for healing. *Arukah* is the healing of a wound, properly the new flesh that grows over the injured place, and scripture always uses it as a figure: for the Lord’s restoring of Israel (“I will restore health unto thee,” [[Jer. 30:17]]), and here for the restoring of Jerusalem’s walls. The broken wall was closing over like a wound, and the next clause says it plainly: “the breaches began to be stopped.”

      That is what turned scorn into a plot. With the Arabians, the Ammonites and the people of Ashdod joining Sanballat and Tobiah, the opposition now surrounded Jerusalem, and its leaders conspired to attack (verse 8).
    sources: [bdb, oshb-wlc, ludlow-nehemiah-minute]

  - ref: 12
    phrase: From all places whence ye shall return unto us they will be upon you
    kind: words
    title: Ten times over
    body: |
      Translations read this line in two ways. The Jews “which dwelt by them” lived near the enemies. The King James, like the New Revised Standard Version (“From all the places where they live they will come up against us”), hears their words as a warning that the attack would come from every direction. The English Standard Version hears a summons: these neighbors came “from all directions” and said “You must return to us.” The Hebrew verb in the line is “ye shall return” (*tashuvu*).

      On either reading the message came again and again, “ten times,” to builders whom verse 10 has already shown close to giving up, and some Jews outside the work seem to have had no confidence that the wall could be built. Nehemiah’s answer was to post the people by their families, armed, behind the wall (verse 13).
    sources: [nrsvue, esv, oshb-wlc, ludlow-nehemiah-minute]

  - ref: 14
    phrase: fight for your brethren, your sons, and your daughters, your wives, and your houses
    kind: scripture
    title: Moroni’s title of liberty
    body: |
      Nehemiah’s charge names what the builders were defending, and the Church’s edition points from it to the banner Captain Moroni raised: “In memory of our God, our religion, and freedom, and our peace, our wives, and our children” ([[Alma 46:12]]). Both leaders call men to defend their families and homes, and both put God at the head of the charge: “remember the Lord,” “In memory of our God.”

      The likeness reaches back to Moroni’s first war as well. Mormon says of Moroni’s army that “they were fighting for their homes and their liberties, their wives and their children” ([[Alma 43:45]]), and he gives the Lord’s word behind it: “Ye shall defend your families even unto bloodshed” ([[Alma 43:47]]). In Nehemiah’s case the fight never came: once the enemies knew they had been found out, the builders went back to the wall (verse 15).
    sources: [lds-scriptures, ot-manual-32, ludlow-nehemiah-minute]

  - ref: 17
    phrase: with the other hand held a weapon
    kind: history
    title: A weapon in the other hand
    body: |
      After the plot failed the work went on under arms, and Nehemiah describes the arrangement closely. His own servants were split in two, half building and half standing guard in armor (verse 16). Those who carried loads worked with one hand and held a weapon in the other; the builders wore their swords at their sides (verses 17–18). The leaders stood behind the people, and the trumpeter stayed at Nehemiah’s side (verse 18; verse 20 tells what the trumpet was for).

      The picture of a worker with a weapon in one hand and a tool or basket in the other came back to the Saints in Nauvoo. George Q. Cannon, of the First Presidency, remembered that the men who finished the temple there “were like the Jews in the days of Nehemiah,” working “with their instruments of labor in one hand, and weapons to defend themselves in the other.”
    sources: [ludlow-nehemiah-minute, ot-manual-32]

  - ref: 20
    phrase: our God shall fight for us
    kind: scripture
    title: Our God shall fight for us
    body: |
      Nehemiah’s plan for a wall too long to guard was a trumpet. The builders were strung out “one far from another” (verse 19), so wherever the trumpet sounded, everyone was to run to it. His promise for that moment is much older than the wall. “Our God shall fight for us” calls on the Lord as the warrior of His people, an image found throughout the Old Testament, as when Moses told Israel before the conquest, “Ye shall not fear them: for the LORD your God he shall fight for you” ([[Deut. 3:22]]). Verse 14 had already paired the same two things, the command not to fear and the turn to the Lord: “Be not ye afraid of them: remember the Lord.”

      The promise did not replace the trumpet, the watch or the swords. It was given with them, and the work went on “from the rising of the morning till the stars appeared” (verse 21).
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 23
    phrase: saving that every one put them off for washing
    kind: words
    title: Every one his weapon
    body: |
      The chapter’s last clause is a puzzle in Hebrew, and the King James words are one way of making sense of it. Word for word the Hebrew reads *each man his weapon the water*. The King James reading turns *the water* into washing, the one time a man undressed. *The water* may be a corruption of the text, for an original *in his right hand* or *in his hand*, and modern translations follow that reading: “each kept his weapon at his right hand.”

      Both readings agree that Nehemiah, his kinsmen, his servants and his guard never undressed for the night. The King James reading allows the one exception for washing; the modern reading adds that each man kept his weapon in hand.
    sources: [oshb-wlc, bdb, esv, nrsvue]

christ: |
  The Lord whom Nehemiah told the builders to remember, “great and terrible,” who would “fight for us,” is Jehovah, the premortal Jesus Christ. The footnote to verse 14 sets His word to the Saints of this dispensation beside Nehemiah’s: “be not afraid of your enemies, for I have decreed in my heart, saith the Lord, that I will prove you in all things, whether you will abide in my covenant” ([[D&C 98:14]]). A disciple who meets scorn or opposition in the Lord’s work keeps praying and keeps working, as the builders did, trusting God and His help; the spiritual protection is found in Him, and He told Joseph Smith, “fear not what man can do, for God shall be with you forever and ever” ([[D&C 122:9]]).

explore: |
  - [[Neh. 2:10–20]]: who Sanballat and Tobiah were, and their first scorn of the plan.
  - [[Neh. 6:1–16]]: the last attempts to stop the work, and the enemies’ own admission “that this work was wrought of our God.”
  - [[Ps. 123]]: a prayer of people who are “exceedingly filled with contempt,” close to verse 4.
  - [[Alma 46:11–28]]: Moroni’s title of liberty, which the footnote to verse 14 points to.
  - [[D&C 98:1–16]]: the Lord’s counsel to Saints under threat, beside verse 14 in the footnotes.

