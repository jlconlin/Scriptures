chapter: 1
title: Remember, I Beseech Thee, the Word
tagline: In the Persian palace at Shushan the king’s cupbearer hears that Jerusalem’s wall still lies broken, and he weeps, fasts and prays, holding God to His word to Moses and asking for mercy before the king.
when: 'The month Chisleu in the twentieth year of Artaxerxes I (verse 1; 2:1), at Susa; Nehemiah’s commission is dated 445 or 444 B.C.'

setting: |
  Nehemiah carries on the account that Ezra began; the Jews long counted the two as one book. With “The words of Nehemiah” the narrator becomes “I,” and his first-person memoir runs principally through chapter 7. His name means “Comfort of the Lord” (it has also been rendered “the Lord is compassionate”). He was a Jew, either a Levite or of the tribe of Judah, and he served as cupbearer to Artaxerxes I, king of Persia from 465 to 425 B.C., the same king who had earlier stopped the building of Jerusalem ([[Ezra 4:21]]).

  The chapter is dated to Chisleu, the ninth month, beginning at the new moon of December, “in the twentieth year.” Chapter 2 names the king and sets the month Nisan, the first month of the Hebrew year, in the same twentieth year ([[Neh. 2:1]]). One explanation is that Nehemiah counts the year from autumn, as the Jews did in civil matters after the captivity; then Chisleu is the third month and Nisan the seventh. The commission that followed is dated 445 or 444 B.C. ([Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers)). Shushan is Susa, the chief city of Persia.

  The chapter is a report from Judah (verses 1–3) and Nehemiah’s answer to it: mourning, fasting, and a prayer that confesses the people’s sins, recalls God’s word to Moses, and asks for favor with the king (verses 4–11). The themes of the whole book are introduced in it: the covenant broken and the exile that followed, return, reconciliation and restoration.

thread: |
  The book’s first thread begins here: a man who prays and then works, with what he will call “the good hand of my God upon me” ([[Neh. 2:8]]). Before Nehemiah asks anything of the king of Persia he spends days before the God of heaven. He weeps, fasts, confesses, and prays “day and night,” and his prayer draws on God’s own words in the law of Moses: the God who keeps covenant, the warning of scattering, and the promise of gathering to the place chosen for His name.

  Only in the last verse does Nehemiah ask anything for himself: success “this day” and mercy “in the sight of this man.” Then a closing line tells why that man matters. Nehemiah stands beside the king’s cup, and he knows that whatever is done for Jerusalem will need the king’s leave. The prayer already looks toward the work, and chapter 2 tells how it was answered.

sections:
  - range: 1-3
    heading: News from Jerusalem
    plain: |
      These are the words of Nehemiah son of Hachaliah. In the month Chisleu, in the twentieth year, I was in the royal citadel of Shushan. Hanani, one of my brothers, came with some men from Judah, and I asked them about the Jews who had escaped, the ones left from the captivity, and about Jerusalem. They told me, “The survivors of the captivity who are left there in the province are in great trouble and disgrace. The wall of Jerusalem is broken down, and its gates have been burned.”
  - range: 4-11
    heading: A prayer of many days
    plain: |
      When I heard this I sat down and wept. For some days I mourned, fasted and prayed before the God of heaven. I said: “O LORD, God of heaven, the great and awesome God, who keeps His covenant and His mercy for those who love Him and keep His commandments: let Your ear be attentive and Your eyes open, to hear the prayer that I, Your servant, am praying before You now, day and night, for the children of Israel, Your servants. I confess the sins we children of Israel have committed against You; I and my father’s family have sinned. We have acted very wickedly against You and have not kept the commandments, the statutes and the judgments You gave Your servant Moses.

      “Remember the word You gave Your servant Moses: ‘If you are unfaithful, I will scatter you among the nations. But if you turn back to Me and keep My commandments and do them, then even if your outcasts are at the farthest edge of the heavens, I will gather them from there and bring them to the place I have chosen as a dwelling for My name.’ These are Your servants and Your people, whom You redeemed by Your great power and Your strong hand. O Lord, let Your ear be attentive to the prayer of Your servant and to the prayer of Your servants who delight to revere Your name. Give Your servant success today, and let him find mercy before this man.” For I was the king’s cupbearer.

notes:
  - ref: 3
    phrase: the wall of Jerusalem also is broken down
    kind: history
    title: Why the wall was still down
    body: |
      The report does not say when the wall was broken, and the text gives no date for the ruin. Scripture tells of two events before it. The Babylonians “brake down the walls of Jerusalem round about” when they took the city ([[2 Kgs. 25:10]]). Later, when Jerusalem’s neighbors wrote to the king that the returned Jews “have set up the walls thereof” ([[Ezra 4:12]]), the same Artaxerxes whom Nehemiah served ordered the building halted “until another commandment” ([[Ezra 4:21]]); the note there follows the wall to this chapter. Whether anything was built and thrown down again in between, the text does not say.

      The report sets the broken wall beside the “great affliction and reproach” of the people “in the province,” the Persian district of Yehud around Jerusalem. Nehemiah’s own call to build joins the two again: “let us build up the wall of Jerusalem, that we be no more a reproach” ([[Neh. 2:17]]).
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 4
    phrase: mourned certain days, and fasted
    kind: history
    title: Days of mourning and fasting
    body: |
      Nehemiah answers bad news from far away with the signs of grief: he sits down, weeps, mourns and fasts. Fasting was a natural way of showing sorrow, and after the return from exile it had become a regular custom. What sets his sorrow apart is where it goes. He turns it into prayer “before the God of heaven,” and he keeps praying: he speaks of the prayer “which I pray before thee now, day and night” (verse 6).

      The text does not say how many the “certain days” were. He did not speak to the king until the month Nisan ([[Neh. 2:1]]), and the setting above explains how the two months fall in the same year. Why he waited the text does not say.
    sources: [bd-fasts, lds-scriptures]

  - ref: 6
    phrase: both I and my father’s house have sinned
    kind: scripture
    title: Confessing a people’s sins as his own
    body: |
      Nehemiah, a trusted servant in a foreign court, confesses Israel’s sins in the first person and names his own family among the sinners: “We have dealt very corruptly against thee” (verse 7). His mourning, fasting and confession are close to Ezra’s ([[Ezra 9:3–15]]) and Daniel’s ([[Dan. 9:3–19]]). The note on [[Ezra 9:6]] follows Ezra’s move from “I” to “we,” and the note on [[Dan. 9:5]] shows that such a confession was what the law of Moses asked of an exiled Israel; neither is repeated here.

      The confession does not end the prayer. Nehemiah praises God’s power, owns the people’s failure to keep “the commandments… the statutes… the judgments” (verse 7), and then asks for God’s help. He pleads for the people as one of them.
    sources: [ludlow-nehemiah-minute]

  - ref: 8
    phrase: Remember, I beseech thee, the word that thou commandedst thy servant Moses
    kind: scripture
    title: Holding God to His word
    body: |
      Nehemiah’s prayer draws on Moses’ words, and the point of that is to appeal to God’s faithfulness. His opening recalls the God of Deuteronomy, the “great and terrible God” who “keepeth covenant and mercy for them that love him” (verse 5; compare [[Deut. 7:21]] and [[Deut. 7:9]]). In verses 8–9 he asks God to remember a word He gave Moses. It is not a quotation but a free summary, chiefly of [[Deut. 30:1–5]]: if Israel transgressed they would be scattered; if they turned back they would be gathered even if “driven out unto the outmost parts of heaven” ([[Deut. 30:4]]). Nehemiah applies the promise to his own case by naming the place God chose “to set my name there,” Jerusalem, where He caused His name to dwell in the temple ([[Deut. 12:11]]).

      Why remind God of the threat as well as the promise? Because the threat had come true. By scattering His faithless people God had shown that He keeps His word, and that strengthened the hope that He would keep the other half of it for a people who turned to Him. Some were already home and the temple stood, but with the walls broken and the people in reproach, the restoration of a community with the Lord dwelling among them was not yet complete. So Nehemiah grounds his plea in the Exodus: these are the people God “redeemed by thy great power, and by thy strong hand” (verse 10), in words like those Moses used when he pleaded for Israel ([[Deut. 9:26–29]]). A people God has redeemed, the argument runs, He cannot leave in affliction and reproach. The note on [[Ps. 147:2]] reads the same promise of gathering in a psalm of the rebuilt city.
    sources: [keil-nehemiah, lds-scriptures]

  - ref: 11
    phrase: grant him mercy in the sight of this man. For I was the king’s cupbearer.
    kind: history
    title: “This man” is the king
    body: |
      The prayer ends with a request for “this day” and a man it does not name until the last clause. Nehemiah asks God to prosper him and grant him mercy “in the sight of this man,” and then adds, by way of explanation, “For I was the king’s cupbearer.” The man is Artaxerxes. Nehemiah trusted that God could gather His people, and he knew he would need the king’s permission and support to help them, so the prayer ends with a request about the king.

      His office made the request possible. The cupbearer made sure the king’s food and drink were not poisoned, a post of great responsibility and trust that gave him access to the king on a regular basis. The note on [[Gen. 40:1]] explains the office and its Hebrew name. In the next chapter Nehemiah is serving the wine when the king notices his face ([[Neh. 2:1–2]]).
    sources: [ludlow-nehemiah-minute, scripture-helps-ezra, amistad-modern-nehemiahs]

christ: |
  The God Nehemiah addresses is “the LORD God of heaven… that keepeth covenant and mercy” (verse 5), and “Jehovah is the premortal Jesus Christ.” Nehemiah’s plea rests on His word to Moses, whose warning of scattering had already come true and whose promise of gathering Nehemiah asks Him to keep (verses 8–9), and on His having redeemed His people “by thy strong hand” (verse 10).

  Nehemiah’s weeping, fasting and long prayer for a people far away give “an example of what we can do when our hearts are drawn out in prayer for the welfare of others.” A disciple who hears of others’ affliction brings it, as Nehemiah did, to the Lord who keeps covenant and mercy.

explore: |
  - **Other prayers of confession for a whole people.** [[Dan. 9:3–19]]; [[Ezra 9:5–15]]; [[Neh. 9:5–38]].
  - **The word Nehemiah asks God to remember.** [[Deut. 30:1–5]], and [[1 Ne. 22:3–12]], which the footnotes to verses 8–9 give for the same scattering and gathering.
  - **How the prayer was answered.** [[Neh. 2:1–8]].

