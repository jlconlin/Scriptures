chapter: 10
title: A Sure Covenant
tagline: The leaders set their seals to the covenant written at the end of the great fast, and the rest of the people, wives and children who could understand among them, swear to keep the law of Moses. Then come the terms, which end in a promise not to forsake the house of God.
when: 'The covenant that came out of the fast of the twenty-fourth day of the seventh month (9:1, 38).'

setting: |
  Chapter 10 is the document that the end of chapter 9 promises. On the twenty-fourth day of the seventh month the people fasted, confessed their sins, and heard a long prayer that retold Israel's history and ended with their own servitude to the Persian kings (9:1, 36–37). “Because of all this,” the prayer concludes, “we make a sure covenant, and write it; and our princes, Levites, and priests, seal unto it” ([[Neh. 9:38]]). The covenant rests on that confession. Some Bibles begin chapter 10 with that verse.

  The chapter has three parts: the names of those who sealed (verses 1–27), the oath of the rest of the people (verses 28–29), and the terms they swore to (verses 30–39). Beyond a general promise to keep the law, the people bind themselves not to give their children in marriage to the peoples of the land (verse 30; on that question, see [[Ezra 9]]), not to buy on the Sabbath, to keep the seventh year, and to provide everything the temple's service needed. Chapters 8–10 are the book's climax: what began as a public reading of the law in chapter 8 ends here as a sealed and sworn promise to live it.

thread: |
  The chapter carries the book's second thread, a people rebuilt around the law and held to its covenant. In chapter 8 the people heard the law read and explained; here the scripture they have come to understand lays obligations on them, and they write the obligations down and set their names to them. The covenant claims no new law. They swear “to walk in God's law, which was given by Moses” (verse 29), and most of its particular terms take up what that law already asked: rest on the Sabbath and in the seventh year, a yearly payment for the sanctuary's service like the half shekel of [[Ex. 30:13]], firstfruits and tithes. Its last words are a promise: “we will not forsake the house of our God” (verse 39).

  The book does not leave the promise there. When Nehemiah came back from the king he found the Levites unpaid and gone to their fields and asked the rulers, “Why is the house of God forsaken?” ([[Neh. 13:11]]), and he found goods carried into Jerusalem and sold on the Sabbath and shut the gates against them ([[Neh. 13:15–22]]). Chapter 10 is what the people promised; chapter 13 is what keeping it took.

sections:
  - range: 1-27
    heading: Those who sealed
    plain: |
      These are the men who set their seals to the covenant: Nehemiah the governor, the son of Hachaliah, and Zidkijah; then twenty-one priests, from Seraiah to Shemaiah; then the Levites, Jeshua, Binnui and Kadmiel and their brothers, seventeen in all; then forty-four leaders of the people, from Parosh to Baanah.
  - range: 28-31
    heading: The people's oath and its first terms
    plain: |
      The rest of the people joined them: the priests, the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the land to live by the law of God, with their wives, their sons and their daughters, everyone who had knowledge and understanding. They stood with their brothers, their leaders, and bound themselves by an oath, calling a curse on themselves if they failed, to walk in God's law given through Moses, the servant of God, and to keep and do all the commandments, judgments and statutes of the LORD our Lord. We promised that we would not give our daughters in marriage to the peoples of the land, nor take their daughters for our sons; and that if the peoples of the land brought goods or food to sell on the Sabbath, we would not buy from them on the Sabbath or on any holy feast day; and that in the seventh year we would leave the land unworked and give up the collection of every debt.
  - range: 32-39
    heading: Provision for the house of God
    plain: |
      We also laid on ourselves a yearly charge of a third of a shekel for the service of the house of our God: for the showbread, the regular grain offering and burnt offering, the offerings of the Sabbaths, new moons and appointed feasts, the holy offerings, and the sin offerings that make atonement for Israel, and for all the work of our God's house. We cast lots among the priests, the Levites and the people, by our fathers' houses, for who would bring wood to the house of our God at set times each year, to burn on the altar of the LORD our God as the law requires. We promised to bring each year the first fruits of our land and of every fruit tree to the house of the LORD; the firstborn of our sons and of our cattle, as the law says, and the firstlings of our herds and flocks, to the priests who minister in the house of our God; and the first of our dough, our offerings, and the fruit of every tree, wine and oil, to the priests in the storerooms of the temple; and the tithe of our land to the Levites, since it is the Levites who collect the tithes in all our farming towns. A priest, a descendant of Aaron, is to be with the Levites when they collect the tithes, and the Levites are to bring a tenth of the tithes up to the house of our God, to the storerooms of the treasury. For the people of Israel and the Levites are to bring the offerings of grain, new wine and oil to the storerooms, where the vessels of the sanctuary are kept and where the ministering priests, the gatekeepers and the singers are. We will not neglect the house of our God.

notes:
  - ref: 1
    phrase: Now those that sealed were, Nehemiah, the Tirshatha
    kind: history
    title: Signed with a seal
    body: |
      To seal a document was to sign it. A man pressed his seal, bearing his name, into the document, and the Hebrew of verse 1 says literally “they who were upon the document,” meaning those whose seals were on it. The covenant of [[Neh. 9:38]] was put in writing so that the day of fasting and confession that produced it would have a lasting hold on the people, and the leaders' seals bound them to it publicly and by name.

      Nehemiah's name stands first, with his title as governor (the Tirshatha). The twenty-one priests who follow were not signing for themselves alone. Fifteen of their names come back in chapter 12 as chiefs of the priests and heads of priestly houses ([[Neh. 12:1–7]]; [[Neh. 12:12–21]]), and the likeliest reading is that each set his seal in the name of the house and families he led. The Levites and the chiefs of the people follow in the same way. The rest of the people did not seal. Women and children old enough to understand were among them (“every one having knowledge, and having understanding,” verse 28), and they “clave to their brethren, their nobles” (verse 29): they held with their leaders, accepted as their own what had been done in the name of all, and bound themselves by their own oath.
    sources: [keil-nehemiah, lds-scriptures]

  - ref: 29
    phrase: entered into a curse, and into an oath
    kind: words
    title: A curse and an oath
    body: |
      The people swore an oath that called down punishment on themselves if they broke it. Two Hebrew words stand behind “a curse, and … an oath.” The first, *ʾālâ*, is properly an oath, usually in the bad sense a curse; the second, *shĕbûʿâ*, is properly “something sworn,” the promise itself. The King James “entered into a curse” does not say on whom the curse would fall, or when.

      Joseph Smith's revision makes the condition plain: “And entered into an oath, that a curse should come upon them if they did not walk in God's law.” He also changed the pronouns at the end of the verse and in verse 30, “our” to “their” and “we” to “they” (the footnote gives “their God” for “our Lord”), so that the narrator speaks of the people rather than with them. The curse was the other side of the blessing. The covenant of Sinai set out blessings for obedience and curses for disobedience ([[Ex. 23:20–33]]), and a people who accepted its terms accepted both.
    sources: [strongs-concordance, nyman-jst-historical, lds-scriptures, seely-covenant-renewal]

  - ref: 29
    phrase: to walk in God’s law, which was given by Moses the servant of God
    kind: scripture
    title: A covenant renewed
    body: |
      What the people swore to was the old covenant renewed, not a new one. Scripture records several assemblies like this one, typically held after periods of apostasy or at times of crisis or transition, in which a leader gathered the covenant people to rededicate themselves publicly to its conditions: Joshua's at Shechem ([[Josh. 24:25]]), Josiah's after the book of the law was found in the temple ([[2 Kgs. 23:3]]), Ezra's and Nehemiah's at Jerusalem (Ezra 9–10; Nehemiah 9–10), and, in the Book of Mormon, King Benjamin's (Mosiah 1–6). Ezra and Nehemiah take care to show every act in the restored worship as a recovery of what had been before, with Moses as its forerunner, and the oath names him: the law “given by Moses the servant of God.”

      The Restoration renews the same covenant on a larger scale. The Lord calls it “a new and an everlasting covenant, even that which was from the beginning” ([[D&C 22:1]]). It is everlasting because it is the same from the beginning, and new because it fulfills the old covenant of the law of Moses and is new to each dispensation in which it is restored and to each person who enters it.
    sources: [seely-covenant-renewal, welch-religious-authority]

  - ref: 31
    phrase: that we would not buy it of them on the sabbath
    kind: history
    title: The Sabbath market and the seventh year
    body: |
      The Sabbath pledge is aimed at trade. The peoples of the land brought goods and food into the city to sell, and the people promised not to buy on the Sabbath or on a holy day. Buying and selling was one of the things scripture counts as profaning the Sabbath, along with gathering food and wood and kindling fire. On his return Nehemiah found wine and food sold in Jerusalem on the Sabbath, and he shut the gates against the traders ([[Neh. 13:15–22]]); on how Sabbath-breaking had cost Jerusalem before, see the note on [[Neh. 13:18]].

      The same verse reaches to the seventh year, the sabbatical year (the footnote points to the Topical Guide's “Sabbatical Year”). The law commanded that in the seventh year the land be left to “rest and lie still” ([[Ex. 23:11]]), and that at the end of every seven years each creditor release what he had lent to his neighbor or his brother ([[Deut. 15:1–2]]). The people promised both.
    sources: [pike-sabbath-ot, lds-scriptures]

  - ref: 34
    phrase: for the wood offering
    kind: history
    title: Wood for the altar’s fire
    body: |
      The law required that the fire on the altar never go out and that the priest burn wood on it every morning ([[Lev. 6:12–13]]), but it gave no directions for getting the wood. The covenant made it the whole congregation's business. Lots fixed the order in which the fathers' houses of priests, Levites and people would bring it, “at times appointed year by year,” probably a rotation set for several years rather than every house every year. Nehemiah counts this among the things he set in order, and the book's last verse asks God to remember him “for the wood offering, at times appointed, and for the firstfruits” ([[Neh. 13:31]]).
    sources: [keil-nehemiah]

  - ref: 39
    phrase: we will not forsake the house of our God
    kind: scripture
    title: Not forsaking the house of God
    body: |
      The covenant ends with a promise that gathers up its last eight verses. Verses 32–39 commit the people to everything the temple's service and its workers needed: the yearly third of a shekel, the wood, the firstfruits of field and tree, the firstborn, the first of the dough, and the tithes, which the Levites collected in the towns and of which they brought a tenth up to the priests in the temple's storerooms (on the tithe of the tithes, see [[Num. 18:26]]; on the storehouse, [[Mal. 3:10]]).

      The promise comes back in chapter 13 in its own words. On his return Nehemiah found that “the portions of the Levites had not been given them,” so that the Levites and singers had gone back to their fields, and he asked the rulers, “Why is the house of God forsaken?” ([[Neh. 13:10–11]]). Malachi's charge that the people were robbing God “in tithes and offerings” ([[Mal. 3:8]]) concerns the same support of the temple and comes from the same period.
    sources: [ludlow-nehemiah-minute, lds-scriptures]

christ: |
  Among the offerings the people pledged to support were “the sin offerings to make an atonement for Israel” (verse 33). From the first, sacrifice was “a similitude of the sacrifice of the Only Begotten of the Father” ([[Moses 5:7]]), and the blood sacrifices of the law of Moses set before Israel the symbols of flesh and blood that the sacrament now sets before Christ's disciples. A disciple renews covenant with God, as Nehemiah's people did, and does so regularly in the sacrament, witnessing a willingness “to take upon them the name of thy Son, and always remember him and keep his commandments” ([[D&C 20:77]]); and the offerings that kept the house of God from being forsaken have their counterpart in the tithing that builds and maintains temples today.

