chapter: 2
title: Let Us Rise Up and Build
tagline: The king's cupbearer carries a sad face to the royal table, prays in the space of a breath, and leaves Susa with letters, timber and an escort; in Jerusalem he looks at the ruins by night and then tells the people, “let us build.”
when: 'The month Nisan in the twentieth year of Artaxerxes I (verse 1), 445 or 444 B.C., and the first days in Jerusalem.'

setting: |
  Chapter 1 ended with Nehemiah's prayer that God would grant him mercy “in the sight of this man” ([[Neh. 1:11]]), and with one line saying who the man was: “I was the king's cupbearer.” Chapter 2 is the answer. The news from Jerusalem had come in Chisleu ([[Neh. 1:1]]); the king hears of it in Nisan, about three months later, and the text puts both months in the same twentieth year of Artaxerxes. Either the king's years were counted from a later point than the calendar's, or Nehemiah counted a civil year beginning in autumn, in which Chisleu is the third month and Nisan the seventh; the text does not say which.

  The king is Artaxerxes I, who reigned over Persia from 465 to 425 B.C., the same king who had ordered the rebuilding of the city stopped ([[Ezra 4:21]]). Nehemiah's commission in his twentieth year is dated 445 or 444 B.C.; the kings and their dates are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers). On the cupbearer's office, see [[Gen. 40:1]].

  The chapter moves from the court at Susa (verses 1–8) to the road (verses 9–10) and to Jerusalem (verses 11–20), and in it the three men who will oppose the work in the chapters that follow are named for the first time. The building itself begins in chapter 3.

thread: |
  The chapter carries the book's first thread: the good hand of God on a man who prays and then works. Nehemiah does what a careful official would do. He asks the king for leave, for letters of safe passage and for timber, surveys the ruins before he says a word, and only then calls the people to build. Yet at each turn he names God as the cause. He prays between the king's question and his answer (verse 4); the king grants his requests “according to the good hand of my God upon me” (verse 8); the plan he carries to Jerusalem is “what my God had put in my heart” (verse 12); he persuades the people by telling them of “the hand of my God which was good upon me” (verse 18); and he answers the mockers with “The God of heaven, he will prosper us” (verse 20). The chapter ends where the work begins: God's servants “will arise and build.”

sections:
  - range: 1-8
    heading: The cupbearer's request
    plain: |
      In the month Nisan, in the twentieth year of King Artaxerxes, wine was set before the king, and I took it up and served it to him. I had not been sad in his presence before. So the king said to me, “Why do you look so sad? You are not sick; this can only be sorrow of heart.” I was terribly afraid, and I said to the king, “May the king live forever! How can I not look sad, when the city where my fathers are buried lies in ruins and its gates have been burned?” The king asked me, “What is it you want?” So I prayed to the God of heaven, and then I answered the king: “If it pleases the king, and if your servant has found favor with you, send me to Judah, to the city where my fathers are buried, so that I may rebuild it.” The king, with the queen sitting beside him, asked me, “How long will your journey take, and when will you come back?” It pleased the king to send me, and I set him a time. I also said to the king, “If it pleases the king, let me be given letters to the governors west of the Euphrates, so that they let me pass through until I come to Judah, and a letter to Asaph, the keeper of the king's forest, so that he will give me timber for beams for the gates of the fortress beside the temple, for the city wall, and for the house I am to enter.” The king granted my requests, because the good hand of my God was upon me.
  - range: 9-10
    heading: The journey, and the first enemies
    plain: |
      I came to the governors west of the Euphrates and gave them the king's letters. The king had also sent army officers and horsemen with me. When Sanballat the Horonite and Tobiah the Ammonite official heard of it, they were deeply displeased that someone had come to seek the good of the children of Israel.
  - range: 11-16
    heading: The ruins seen by night
    plain: |
      So I came to Jerusalem, and after I had been there three days I got up in the night with a few men. I had told no one what my God had put into my heart to do for Jerusalem, and there was no animal with me except the one I rode. I went out by night through the Valley Gate, past the Jackal's Well, to the Dung Gate, and looked at the walls of Jerusalem, which were broken down, and its gates, which had been burned. Then I went on to the Fountain Gate and the King's Pool, but there was no room for my animal to get through. So I went up the valley in the night and looked at the wall, then turned back and came in again by the Valley Gate. The officials did not know where I had gone or what I was doing, for I had not yet told anything to the Jews, the priests, the nobles, the officials, or the others who would do the work.
  - range: 17-20
    heading: “Let us rise up and build”
    plain: |
      Then I said to them, “You see the trouble we are in: Jerusalem lies in ruins and its gates are burned. Come, let us rebuild the wall of Jerusalem, so that we are no longer a disgrace.” I told them how the good hand of my God had been upon me, and what the king had said to me. They said, “Let us get up and build.” So they set their hands to the good work. But when Sanballat the Horonite, Tobiah the Ammonite official, and Geshem the Arab heard of it, they laughed at us and scorned us, and said, “What is this you are doing? Are you rebelling against the king?” I answered them, “The God of heaven will give us success. We His servants will get up and build. But you have no share, no claim, and no memorial in Jerusalem.”

notes:
  - ref: 3
    phrase: the place of my fathers’ sepulchres
    kind: history
    title: Why Nisan, and why the sepulchres
    body: |
      The text tells us what Nehemiah did and leaves his reasons unstated. The news reached him in Chisleu; he wept, fasted and prayed “certain days” ([[Neh. 1:4]]); and he said nothing to the king until Nisan, some months later. When he did speak he never named Jerusalem. Twice he called it the city of “my fathers' sepulchres” (verses 3, 5), and he spoke of gates “consumed with fire.” He put his request as a son's grief for his fathers' graves.

      One proposed reason for both the wait and the wording comes from the religion of the Persian kings, later known as Zoroastrianism. Nisan was the month of Nowruz, the Persian new year, when, by a common custom, “the king would give gifts or grant requests to anyone who asked,” so Nehemiah may have waited for the season when a request was most likely to be granted. Tombs and fire also mattered especially in that religion. The earth was holy, and a tomb left unkept could let animals disturb the bones and bring them into contact with the earth. Fire was sacred, and gates burned in a siege would almost certainly have burned their defenders with them. On this reading, Nehemiah chose words that would move this particular king. It is a plausible hypothesis, and the text neither confirms nor rules it out; what the text does show is a man who waited, prayed and chose his words.
    sources: [sc-knowhy-862]

  - ref: 4
    phrase: So I prayed to the God of heaven
    kind: history
    title: A prayer between the question and the answer
    body: |
      Nehemiah's prayer in verse 4 is not quoted at all: it falls between the king's question and Nehemiah's answer. It would not have been fitting to serve the king with a sad face, and Nehemiah had not been sad in his presence before (verse 1). The king read his face at once as “sorrow of heart,” and Nehemiah was “very sore afraid” (verse 2): he now had to explain himself and could not know how the king would take a wish to help Judah. He began with the accustomed courtly wish, “Let the king live for ever,” and told the cause plainly.

      The king's reply, “For what dost thou make request?”, showed that he was already inclined to help. Before he answered, Nehemiah “prayed to the God of heaven” for God's help in what he was about to ask. It was a prayer of the heart, and it gave a frightened man the courage to make a large request.
    sources: [keil-nehemiah, amistad-modern-nehemiahs]

  - ref: 8
    phrase: according to the good hand of my God upon me
    kind: symbol
    title: The king granted, by the good hand of my God
    body: |
      Nehemiah asked the king for a great deal, and then credited all of it to God. He set the king a time for his return (verse 6). He asked for letters to the governors west of the Euphrates for safe passage (verse 7), and for a letter to the keeper of the king's forest for timber for three things: the gates of “the palace which appertained to the house,” the city wall, and “the house that I shall enter into” (verse 8). The “palace” is not a royal house. The Hebrew word, *bîrâ*, is a late word, probably borrowed, for a castle or fortress, and here it is the fortress beside the temple, the “house.”

      Then, having described everything he asked for, he gives the credit to God: the king granted it all “according to the good hand of my God upon me.” Nearly the same words are used of Ezra's journey ([[Ezra 7:6]], 9). Nehemiah uses the phrase again in verse 18, and it is what persuades the people: when he told them “of the hand of my God which was good upon me” and of the king's words, they answered, “Let us rise up and build.” On how Nehemiah's escort of officers and horsemen (verse 9) differs from Ezra's choice to go without one, see [[Ezra 8:22]].
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 10
    phrase: Sanballat the Horonite, and Tobiah the servant, the Ammonite
    kind: history
    title: Sanballat, Tobiah and Geshem
    body: |
      The three men named in this chapter were neighboring officials who feared what a rebuilt Jerusalem would do to their own standing. Sanballat, called the Horonite, was governor of Samaria and a leader of the Samaritan opposition to Nehemiah. Tobiah was an Ammonite official who also had influence inside the Jewish community in Jerusalem. Geshem the Arab joins them in verse 19. All three held office under Persia, and Sanballat and Tobiah had held power in Samaria and its surroundings during the Babylonian exile. They were worried that Nehemiah's arrival might compromise their positions, and they opposed the rebuilding primarily for fear of losing their political authority in the region.

      Nehemiah says what grieved them in a phrase that carries an edge: “there was come a man to seek the welfare of the children of Israel.” The book names them again whenever the work is threatened: they mock the wall ([[Neh. 4:1–3]]), plot against Nehemiah ([[Neh. 6:1–14]]), and in Tobiah's case find a place inside the temple itself ([[Neh. 13:4–9]]).
    sources: [scripture-helps-ezra, bd-sanballat, ludlow-nehemiah-minute, lds-scriptures]

  - ref: 17
    phrase: that we be no more a reproach
    kind: history
    title: Why the wall mattered
    body: |
      The reason Nehemiah himself gives for the wall is honor: “that we be no more a reproach.” The report that reached him in Susa had called the people “in great affliction and reproach” ([[Neh. 1:3]]), and the wall would end the reproach. He made the appeal only after he had looked at the ruins himself, by night and without telling anyone, not even the priests and nobles (verses 12–16).

      The appeal is made in the first person plural: “the distress that *we* are in… let *us* build.” The cupbearer from the king's court puts himself among the builders, and the people answer in his own words: “Let us rise up and build.” They “strengthened their hands for this good work” (verse 18). How this wall stands beside Zechariah's vision of a Jerusalem without walls, with the Lord “a wall of fire round about,” is taken up at [[Zech. 2:5]].
    sources: [lds-scriptures]

  - ref: 20
    phrase: ye have no portion, nor right, nor memorial, in Jerusalem
    kind: words
    title: No portion, nor right, nor memorial
    body: |
      Nehemiah's answer to the mockers turns their question about the king into a question about Jerusalem. “Will ye rebel against the king?” (verse 19) was ironic, since they did not credit the Jews with the power to build a fortification worth rebelling with; the charge would come again in Sanballat's open letter ([[Neh. 6:6]]). Nehemiah does not debate it, though he has the king's letters. He names a higher authority: “The God of heaven, he will prosper us; therefore we his servants will arise and build.”

      Then he closes the city to them with three words. They have no *portion*, no share in it. They have no *right*: the Hebrew is *ṣedāqâ*, “righteousness,” which in a case or cause means a right, as when Mephibosheth asks David, “What right therefore have I yet to cry any more unto the king?” ([[2 Sam. 19:28]]). And they have no *memorial*, no remembrance in the city; one reading is that only those who belonged to the congregation, and could hope to live on in their descendants in Jerusalem, could have a memorial there.
    sources: [keil-nehemiah, oshb-wlc, bdb]

christ: |
  Nehemiah's answer to the mockers (verse 20) puts the outcome in God's hands and the labor in His servants'. The Lord made a way for His people to return to Jerusalem and, more importantly, to their covenants, and Nehemiah's wall protected the city to which they had returned. The work of disciples now is of the same kind: it centers on the Lord's house and His law, and the protection it rests on is found in Jesus Christ. Those who serve Him do the building, and the prospering is His.

explore: |
  - **The hand of God in Ezra and Nehemiah.** [[Ezra 7:6]], 9, 27–28; [[Ezra 8:18]], 22, 31; [[Neh. 2:8]], 18.
  - **The wall stopped before.** [[Ezra 4:7–23]], the same king's order to stop the building.
  - **The mockers return.** [[Neh. 4:1–9]], where the builders pray and set a watch; [[Ps. 123]], a psalm of the scorned.
  - **The work finished.** [[Neh. 6:15–16]], where the enemies themselves perceive “that this work was wrought of our God.”

