chapter: 2
title: Let Us Rise Up and Build
tagline: The king’s cupbearer, sad before the king, prays and asks to be sent to rebuild Jerusalem. He comes with letters and an escort, looks over the broken walls by night, and calls the people to build, while three officials of the region mock.
when: 'The month Nisan in the twentieth year of Artaxerxes I (verse 1), 445 or 444 B.C., and the first days in Jerusalem.'

setting: |
  Chapter 1 ended with Nehemiah in Shushan, mourning the news that the wall of Jerusalem was still broken down, praying for “mercy in the sight of this man,” and adding, “For I was the king’s cupbearer” ([[Neh. 1:11]]). The cupbearer tasted the king’s wine to prove it was not poisoned, a significant and trusted post. Chapter 2 is the prayer answered at that table.

  The king is Artaxerxes I, called Longimanus, who reigned from 465 to 425 B.C. He is the same king who earlier had the building of Jerusalem’s walls stopped ([[Ezra 4:21]], where the note tells that story) and who had given Ezra his commission. Here he sends Nehemiah, with letters, timber and an armed escort. The dates and the kings are in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  The chapter opens the first half of the book, Nehemiah 1–6, the rebuilding of Jerusalem’s walls. It brings Nehemiah from the palace to the ruins and introduces the three men who will oppose him through chapters 4 and 6: Sanballat, Tobiah and Geshem. Nehemiah still tells the story himself, in the first person.

thread: |
  The chapter carries the first of the book’s threads: **the good hand of God on a man who prays and then works**. It moves through four scenes, a petition, a journey, an inspection and a call to build, and in each Nehemiah does something careful and practical. He waits for months, asks the king for letters and timber, keeps his plan to himself until he has seen the walls, and then lays it before the people. Throughout the chapter he names God as the reason it works. He prays before he answers the king (verse 4). The king grants his requests “according to the good hand of my God upon me” (verse 8). He tells the people of “the hand of my God which was good upon me” (verse 18), and they answer, “Let us rise up and build.” When his neighbors mock, his reply is “The God of heaven, he will prosper us; therefore we his servants will arise and build” (verse 20). The need for God’s support to succeed runs through the writings after the exile, and in this chapter Nehemiah says it outright to the men who would stop him.

sections:
  - range: 1-8
    heading: The cupbearer’s request
    plain: |
      In the month Nisan, in the twentieth year of King Artaxerxes, wine was set before the king, and I took the wine and served it to him. I had not been sad in his presence before. So the king said to me, Why do you look sad, when you are not sick? This can only be sorrow of heart. Then I was terribly afraid, and I said to the king, May the king live forever! Why should I not look sad, when the city where my fathers are buried lies in ruins and its gates have been burned?

      The king said to me, What is it you are asking for? So I prayed to the God of heaven. Then I said to the king, If it pleases the king, and if your servant has found favor with you, send me to Judah, to the city where my fathers are buried, so that I may rebuild it. The king, with the queen sitting beside him, asked me, How long will your journey take, and when will you come back? It pleased the king to send me, and I gave him a time.

      I also said to the king, If it pleases the king, let me have letters to the governors west of the Euphrates, so that they will let me pass through until I reach Judah, and a letter to Asaph, the keeper of the king’s forest, so that he will give me timber for beams for the gates of the fortress beside the temple, for the city wall, and for the house I will live in. And the king granted my requests, because the good hand of my God was upon me.
  - range: 9-11
    heading: The journey, and the first enemies
    plain: |
      So I came to the governors west of the Euphrates and gave them the king’s letters. The king had also sent army officers and horsemen with me. When Sanballat the Horonite and Tobiah the Ammonite official heard of it, they were greatly displeased that someone had come to look after the welfare of the people of Israel. I came to Jerusalem and was there three days.
  - range: 12-16
    heading: The walls seen by night
    plain: |
      Then I got up in the night, with a few men. I had told no one what my God had put in my heart to do for Jerusalem, and there was no animal with me except the one I rode. I went out by night through the Valley Gate, past the Dragon Well, to the Dung Gate, and looked over the walls of Jerusalem, which were broken down, and its gates, which had been burned. Then I went on to the Fountain Gate and the King’s Pool, but there was no room for the animal under me to get through. So I went up the valley by night, looked over the wall, turned back, and came in again through the Valley Gate. The officials did not know where I had gone or what I was doing, and I had not yet told the Jews, the priests, the nobles, the officials, or anyone else who would do the work.
  - range: 17-20
    heading: Let us rise up and build
    plain: |
      Then I said to them, You see the trouble we are in: Jerusalem lies in ruins and its gates are burned. Come, let us rebuild the wall of Jerusalem, so that we will no longer be a disgrace. I told them how the good hand of my God had been upon me, and what the king had said to me. They said, Let us rise up and build. So they set their hands to this good work.

      But when Sanballat the Horonite, Tobiah the Ammonite official, and Geshem the Arab heard of it, they mocked us and scorned us and said, What is this you are doing? Are you rebelling against the king? I answered them, The God of heaven will give us success, and we His servants will rise up and build. But you have no share, no claim, and no memorial in Jerusalem.

notes:
  - ref: 1
    phrase: in the month Nisan
    kind: history
    title: Why he waited for Nisan, and why he was afraid
    body: |
      Nehemiah heard the news from Jerusalem in Chisleu ([[Neh. 1:1]]) and spoke to the king in Nisan, months later, and the text does not say why he waited. (How both months fall in “the twentieth year” is taken up in the setting of chapter 1.)

      A possible occasion is Nowruz, the Persian new year, which fell in Nisan; by custom the king then gave gifts and granted requests to anyone who asked, and Nehemiah, on this reading, likely waited for it. It is a plausible hypothesis from one Latter-day Saint study of Persian custom, not something the text states.

      Verse 2 shows the risk he still ran. He had never before been sad in the king’s presence (verse 1), and when the king read his face, Nehemiah was “very sore afraid.” He now had to ask for help to rebuild Jerusalem, a city whose building this same king had once ordered stopped ([[Ezra 4:21]]).
    sources: [sc-knowhy-862, bd-artaxerxes]

  - ref: 3
    phrase: the place of my fathers’ sepulchres
    kind: history
    title: Sepulchres and gates burned with fire
    body: |
      Nehemiah’s answer describes Jerusalem by its tombs and its burned gates, and both may have been chosen for a Persian listener. In the religion of the Achaemenid kings, later known as Zoroastrianism, the earth was holy: tombs were cut into rock so that no body touched the soil, and a neglected tomb, whose bones animals could scatter onto the ground, was “a serious sin.” Fire, too, was sacred and was not to be defiled by burning bodies, and gates burned in an attack would almost certainly have burned defenders. On this reading Nehemiah “appeals to Iranian religion by mentioning tombs and fire,” and so said what would most move Artaxerxes. It is a hypothesis from one Latter-day Saint study, and the text itself gives no motive beyond grief.

      The words also say something about Nehemiah. Twice he calls Jerusalem the city of his fathers’ sepulchres (verses 3 and 5): his request comes from concern for his ancestors and the covenant land.
    sources: [sc-knowhy-862, ludlow-nehemiah-minute]

  - ref: 4
    phrase: So I prayed to the God of heaven
    kind: history
    title: A prayer between the question and the answer
    body: |
      Nehemiah prayed in the space between the king’s question and his own reply. It was not the beginning of his prayers. Chapter 1 records days of mourning, fasting and prayer ([[Neh. 1:4]]), and its last words ask God to “grant him mercy in the sight of this man” ([[Neh. 1:11]]); he knew then that he would need the king’s leave to go. The prayer of verse 4 comes at the moment that earlier prayer was to be answered. Nehemiah was afraid, and “taking courage from a prayer of the heart” he made his request.

      Short prayers like it return in the book. When the builders are threatened, “we made our prayer unto our God, and set a watch” ([[Neh. 4:9]]); when they are slandered, “O God, strengthen my hands” ([[Neh. 6:9]]). In both the prayer goes with the work: a watch set, hands to be strengthened.
    sources: [ludlow-nehemiah-minute, amistad-modern-nehemiahs, lds-scriptures]

  - ref: 8
    phrase: according to the good hand of my God upon me
    kind: history
    title: The good hand of my God upon me
    body: |
      Nehemiah asked the king for letters of passage to the governors west of the Euphrates and a letter to the keeper of the king’s forest for timber, and then gave God the credit for getting them. The timber was for three things: the gates of the fortress beside the temple, the city wall, and the house he would live in. The “palace which appertained to the house” is a castle or fortress, here the citadel that belonged to the temple (“the house”). The timber “for the wall of the city” was for its gates ([[Neh. 3:3]], 6), and “the house that I shall enter into” was his own residence as governor.

      Then he explains why the king said yes: “according to the good hand of my God upon me.” The same words are used of Ezra under this king ([[Ezra 7:6]], 9, 28; the note at Ezra 7:6 reads them). Here they are paired with a detailed, practical request to a king: Nehemiah asked, and credited God with moving the king to grant it. The king also sent “captains of the army and horsemen” (verse 9), an escort Nehemiah accepted where Ezra had been ashamed to ask for one ([[Ezra 8:22]]). In verse 18 he tells the people of the same good hand and of the king’s words, and they resolve to build.
    sources: [bdb, keil-nehemiah, ludlow-nehemiah-minute, lds-scriptures]

  - ref: 10
    phrase: it grieved them exceedingly that there was come a man to seek the welfare of the children of Israel
    kind: history
    title: Sanballat, Tobiah and Geshem
    body: |
      The three men who oppose Nehemiah through the first half of the book were officials of the Persian Empire. Sanballat was the governor of Samaria and a leader of the Samaritan opposition; he returns in chapters 4, 6 and 13. Tobiah was an Ammonite official and, as later chapters show, an influential man in the community in Jerusalem itself ([[Neh. 6:17–19]]; [[Neh. 13:4]]). Geshem the Arab joins them in verse 19.

      The verse says only that the news grieved them. A governor of Judah with the king’s letters and a rebuilt, walled Jerusalem threatened their influence in the region, and fear of losing it was most likely the chief reason they opposed Nehemiah. The verse puts it with some irony: what grieved them was that someone had come “to seek the welfare of the children of Israel.”
    sources: [scripture-helps-ezra, bd-sanballat, ludlow-nehemiah-minute]

  - ref: 12
    phrase: neither told I any man what my God had put in my heart to do at Jerusalem
    kind: history
    title: A ride by night
    body: |
      Nehemiah inspected the walls before he announced anything, and he did it at night with a few men to keep the plan from Sanballat and the others who might try to stop it. It was a reconnaissance, with the walls and the water sources its chief concern. Verse 16 stresses the secrecy: not the rulers, the priests, the nobles, nor the builders knew.

      The ride also shows the state of things: at one point there was “no place for the beast that was under me to pass” (verse 14). When he did speak, in verse 17, he spoke as a man who had seen the broken walls himself, and the plan, he says, was what “my God had put in my heart.”
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 17
    phrase: that we be no more a reproach
    kind: history
    title: No more a reproach
    body: |
      Nehemiah’s case for the wall is that a ruined city is a disgrace, and the reasons behind that are practical. A walled city could defend itself, and a rebuilt Jerusalem could again be a center of religious, economic and political life in the region; that is also why its neighbors resisted.

      The people answered, “Let us rise up and build,” and they did so quickly: the wall was finished in fifty-two days, and even the enemies of verse 19 concluded that “this work was wrought of our God” ([[Neh. 6:15–16]]). Zechariah had promised a Jerusalem whose wall would be the Lord Himself; the note at [[Zech. 2:5]] tells how that promise stands beside the stone wall Nehemiah built.
    sources: [scripture-helps-ezra, lds-scriptures]

  - ref: 20
    phrase: ye have no portion, nor right, nor memorial, in Jerusalem
    kind: history
    title: No portion, nor right, nor memorial
    body: |
      Nehemiah’s answer to the mockers turns their question back on them. “Will ye rebel against the king?” was probably irony: they did not credit the Jews with the strength to fortify a city, still less to rebel. The charge was not empty, though, for it would return in an open letter ([[Neh. 6:6–7]]), and Nehemiah carried the king’s own letters.

      He does not argue the politics. He answers that the God of heaven will give success and that the builders are His servants, and then denies the three men any share, claim or memorial in the city. The last word may carry the most weight: on one reading, only members of the congregation, who could hope to live on in Jerusalem through their descendants, could be said to have a memorial in it. The answer leaves them no claim in Jerusalem at all, and its confidence rests on God’s support, a theme the whole chapter has been sounding.
    sources: [keil-nehemiah, ludlow-nehemiah-minute]

christ: |
  Nehemiah came to the king with a prayer and to the ruins with a plan, and both times he said the good hand of God was what made the work possible. The wall belonged to a larger work, and the work of disciples now, like theirs, has much to do with the house of the Lord, His law, and “the spiritual protection we find in Him.” Nephi’s testimony that the Lord prepares a way for His people to do what He commands ([[1 Ne. 3:7]]) carries the confidence of “The God of heaven, he will prosper us.” A disciple given a work by the Lord prays and then builds, and the Lord prepares the way.

explore: |
  - [[Neh. 1:4–11]]: the prayer that verse 4 continues.
  - [[Ezra 7:6–28]]: the good hand of God on Ezra under the same king.
  - [[Ezra 4:7–23]]: how this king had once stopped the building of the walls.
  - [[Neh. 4:1–9]]; [[Neh. 6:1–16]]: Sanballat, Tobiah and Geshem return, and the work is finished.
  - [[Zech. 2:1–5]]: a Jerusalem walled by the Lord’s presence.

