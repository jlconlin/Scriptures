chapter: 8
title: The Joy of the LORD Is Your Strength
tagline: With the wall finished, the people ask Ezra for the book of the law. He reads it from a wooden tower while the Levites make its meaning plain; the people weep and are told to feast instead, and when they find the booths written in the law they build them, as the whole congregation had not done since Joshua.
when: 'The seventh month (7:73; verse 2), in the year the wall was finished: the reading on the first day and the Feast of Tabernacles from the fifteenth (verse 14).'

setting: |
  The wall was finished in the sixth month, Elul ([[Neh. 6:15]]). When the seventh month came the people were in their cities ([[Neh. 7:73]]), and they gathered from them to Jerusalem (verse 1). Chapter 8 opens the second part of the book, chapters 8–10, the religious and social reforms, in which the people who rebuilt the wall are rebuilt themselves around the law. It also changes the voice. Nehemiah's own first-person account, which fills most of chapters 1–7, stops here, and he appears in the third person, as “Nehemiah, which is the Tirshatha” (verse 9).

  Ezra, absent from Nehemiah's account so far, now stands at the center. He had come to Jerusalem in 458 B.C. with a commission to teach the law (see [[Ezra 7:10]] and [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers)), and here he and Nehemiah act together. How the two men's missions fit together in time is notoriously hard to settle, but this chapter is one of the places where they meet. The reformed community, with its wall finished and its temple rebuilt, marks the close of the restoration that began with the first return nearly a century before.

  The chapter's two scenes follow the calendar of the seventh month: the reading on the first day, a holy convocation in the law, and the Feast of Tabernacles from the fifteenth. Moses had commanded the law to be read to the whole people at that feast ([[Deut. 31:10–13]]).

thread: |
  The word that runs through the chapter is *understand*. The congregation is “all that could hear with understanding” (verse 2); the Levites “caused the people to understand the law” (verse 7) and “caused them to understand the reading” (verse 8); the people rejoice “because they had understood the words” (verse 12); and the leaders gather on the second day “even to understand the words of the law” (verse 13). The chapter is about scripture heard, made plain and acted on.

  It begins the book's second thread, a people rebuilt around the law (chapters 8–10, then 13). Here the people meet their own scripture again: they find the commandment to dwell in booths and act on it at once, and the strength of their response, first in tears and then in “very great gladness” (verse 17), can be read as the law becoming theirs, its authority personal and devotional and no longer only institutional.

sections:
  - range: 1-8
    heading: The law read and made plain
    plain: |
      All the people gathered as one into the square in front of the Water Gate, and they asked Ezra the scribe to bring the book of the law of Moses, which the LORD had commanded Israel. On the first day of the seventh month Ezra the priest brought the law before the assembly, men and women and everyone who could understand what they heard. He read from it facing the square before the Water Gate from early morning until noon, to the men, the women and those who could understand, and all the people listened closely to the book of the law. Ezra the scribe stood on a wooden platform built for the occasion, with six men standing at his right and seven at his left. Ezra opened the book where all the people could see it, for he stood above them, and as he opened it they all stood up. Ezra blessed the LORD, the great God, and all the people answered, Amen, Amen, lifting up their hands; then they bowed their heads and worshipped the LORD with their faces to the ground. Jeshua, Bani, Sherebiah and the other Levites named helped the people understand the law while the people stayed in their places. They read from the book of God's law clearly and explained its meaning, so that the people understood what was read.
  - range: 9-12
    heading: Not a day to mourn
    plain: |
      All the people were weeping as they heard the words of the law. So Nehemiah the governor, Ezra the priest and scribe, and the Levites who were teaching the people said to them all, This day is holy to the LORD your God; do not mourn or weep. Go and eat rich food and drink sweet drinks, and send portions to those who have nothing prepared, for this day is holy to our Lord. Do not be grieved, for the joy of the LORD is your strength, your refuge. The Levites quieted all the people: Be still, for the day is holy; do not grieve. So all the people went away to eat and drink, to send portions, and to celebrate with great joy, because they had understood the words that had been explained to them.
  - range: 13-18
    heading: The booths
    plain: |
      On the second day the heads of the families of all the people, with the priests and the Levites, gathered to Ezra the scribe to study the words of the law. They found written in the law the LORD had given through Moses that the Israelites were to live in booths during the feast of the seventh month, and that they were to announce it in all their towns and in Jerusalem: Go out to the hills and bring branches of olive, pine, myrtle, palm and other leafy trees to make booths, as it is written. So the people went out and brought branches and made themselves booths, each on the roof of his house, in their courtyards, in the courts of the house of God, in the square by the Water Gate and in the square by the Gate of Ephraim. The whole assembly of those who had come back from the captivity made booths and lived in them; the Israelites had not done so from the days of Joshua the son of Nun until that day. And there was very great joy. Day after day, from the first day to the last, Ezra read from the book of the law of God. They kept the feast seven days, and on the eighth day there was a solemn assembly, as the law required.

notes:
  - ref: 1
    phrase: they spake unto Ezra the scribe to bring the book of the law of Moses
    kind: history
    title: The people asked for the book
    body: |
      The reading began with the people's request, not Ezra's. They gathered “as one man” in the square before the Water Gate and asked Ezra to bring out the book (verse 1). The reading fell on a day the law already set apart: the first of the seventh month was to be “a sabbath, a memorial of blowing of trumpets, an holy convocation” ([[Lev. 23:24]]).

      Who heard matters as much as who asked. Ezra read “before the congregation both of men and women, and all that could hear with understanding” (verse 2), from early morning until midday (verse 3). Moses had commanded that the law be read to just such a gathering, “men, and women, and children, and thy stranger” (see [[Deut. 31:10]]). Yet until this time the law had been in large part the possession of the priests; the open reading of the book before every Jew was a new departure, and it made the law the center of the nation's life.
    sources: [lds-scriptures, bd-ezra]

  - ref: 4
    phrase: Ezra the scribe stood upon a pulpit of wood, which they had made for the purpose
    kind: scripture
    title: A wooden tower to read from
    body: |
      Ezra's “pulpit” is a tower. The Hebrew word, *migdal*, is the ordinary word for a tower, the same word used for the towers in the wall in [[Neh. 3:25–27]], and here it means a raised stage built for the reading, high enough that “he was above all the people” (verse 5) and everyone could see the book opened.

      King Benjamin did the same for the same reason. His multitude was too great to be taught within the temple walls, “therefore he caused a tower to be erected, that thereby his people might hear the words which he should speak unto them” ([[Mosiah 2:7]]). The likeness goes beyond the platform. Benjamin's assembly shares several marks with the Feast of Tabernacles, the feast this chapter goes on to keep, and three of the Old Testament witnesses for those marks come from this chapter: the speaker on a platform (verse 4, beside [[Mosiah 2:7]]), the reading of the law and renewal of the covenant (verses 1–3, 5), and the people's ritual response, prostrate on the ground (verse 6, beside [[Mosiah 4:1]]). That Benjamin's speech was given at that feast is a proposal of Latter-day Saint scholars, not something the Book of Mormon says; the case is set out at [[Deut. 31:10]] and [[Lev. 23:43]].

      The scene may also be meant to recall Moses. On one reading, the gathered assembly, Ezra as mediator, his raised platform and the people's answer all echo Moses coming down from Sinai to stand before Israel.
    sources: [bdb, ludlow-nehemiah-minute, sc-knowhy-80, welch-religious-authority, lds-scriptures]

  - ref: 6
    phrase: with lifting up their hands
    kind: symbol
    title: Standing, hands raised, faces to the ground
    body: |
      The people answered the opened book and Ezra's blessing with their whole bodies, and in order. They stood when the book was opened (verse 5), answered Ezra's blessing with “Amen, Amen” and raised hands, bowed their heads, and then worshipped “with their faces to the ground” (verse 6); by verse 7 they “stood in their place” again. The phrase “lifting up hands” occurs only here in a description of prayer in the book, and the sequence suggests that prayer after the exile may have moved through a cycle of postures: standing, lifting the hands, kneeling, lying prostrate, and rising again. That is a scholar's inference from this verse and from ancient art, offered as a possibility; what the verse shows plainly is a congregation that met the opened book with worship.
    sources: [calabro-gestures]

  - ref: 8
    phrase: distinctly, and gave the sense
    kind: words
    title: Read distinctly, and the sense given
    body: |
      Verse 8 describes two acts: reading the text clearly and explaining it. “Distinctly” renders *meforash*, “made distinct” (some take it as “interpreted”); the Aramaic form of the same word describes the accusers' letter, “plainly read” before the king ([[Ezra 4:18]]). “Gave the sense” is literally “set forth the understanding,” that is, the meaning. The verse ends with the hearers, who understood what was read (verse 8).

      Whether explaining also meant translating is a real question. After the exile many spoke Aramaic more than Hebrew, and the Levites' help, as they moved among the people, likely involved explaining the law and perhaps translating it from Hebrew into Aramaic. Explaining is certain from the verse; translating is a reasonable possibility, not a certainty.
    sources: [bdb, scripture-helps-ezra, welch-religious-authority, ludlow-nehemiah-minute]

  - ref: 9
    phrase: For all the people wept, when they heard the words of the law
    kind: history
    title: Why the people wept
    body: |
      The text does not say why the people wept, but the likeliest cause is remorse for their own failures and their ancestors' in keeping God's commandments. The portions read probably included passages of Deuteronomy and the rest of the law that showed them how they had broken the Lord's commands and what punishments that had brought on them. Whether contrition, grief or joy moved them, their tears show a deep and tender attachment to the words of scripture.

      The reason the leaders gave for stopping the tears was the day: “This day is holy unto the LORD your God; mourn not, nor weep” (verse 9), and again, “Hold your peace, for the day is holy; neither be ye grieved” (verse 11). The first of the seventh month was a holy convocation in the law (see the note on verse 1), and verse 10 says how they were to keep it: with food, drink and portions sent to others. Later in the same month the people did gather to fast, in sackcloth and with earth upon them ([[Neh. 9:1]]).
    sources: [keil-nehemiah, scripture-helps-ezra, welch-religious-authority, lds-scriptures]

  - ref: 10
    phrase: the joy of the LORD is your strength
    kind: words
    title: The joy of the LORD is your refuge
    body: |
      The “strength” of this verse is a refuge. The Hebrew *maʿoz* means a place or means of safety, a protection, and the verse is to be compared with those that call the LORD His people's refuge ([[Nahum 1:7]]; [[Ps. 27:1]]).

      The joy is to be shared. Before the line about strength comes the command to “eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared”: to feast and to send food to anyone in need, so that the whole people could rejoice together. Verse 12 reports that they did, “because they had understood the words that were declared unto them.”
    sources: [bdb, ludlow-nehemiah-minute]

  - ref: 17
    phrase: since the days of Jeshua the son of Nun unto that day had not the children of Israel done so
    kind: history
    title: Not done so since Joshua
    body: |
      The verse does not say that the Feast of Tabernacles had not been kept since Joshua. The returned exiles had kept it, “as it is written” ([[Ezra 3:4]]), and Solomon kept it at the dedication of the temple (2 Chronicles 7:8–10). On the likeliest reading, what had not been done was “so”: the whole congregation of those who had come back from captivity making booths and living in them (verse 17). Earlier celebrations may have kept the feast with assemblies and sacrifices while treating the booths themselves as optional; this time the people built them everywhere, on their roofs, in their courtyards, in the temple courts and in the public squares (verse 16).

      They did it because they had found it written. The leaders' study on the second day turned up the command to dwell in booths (verse 14), and they proclaimed it and carried it out at once. The booths recalled that the LORD made Israel dwell in booths when He brought them out of Egypt ([[Lev. 23:42–43]]). For a congregation “come again out of the captivity,” the feast was also a way of reestablishing their religious identity and practice, and the result was “very great gladness.” Ezra kept reading the law every day of the feast, and the eighth day closed with a solemn assembly “according unto the manner” (verse 18; [[Lev. 23:36]]).
    sources: [keil-nehemiah, ludlow-nehemiah-minute, lds-scriptures]

christ: |
  The footnotes set the weeping of verse 9 beside [[Mosiah 4:1–2]] and the understanding of verse 12 beside [[Mosiah 4:3]]. There Benjamin's people, having heard the word, saw themselves “in their own carnal state,” cried for “the atoning blood of Christ,” and “were filled with joy, having received a remission of their sins.” The returned exiles were sent from tears to feasting because the day was holy to the LORD; Benjamin's people passed from the same tears to joy through the atoning blood of Christ. Scripture understood can still bring sorrow for sin, and through Christ that sorrow gives way to a joy that is a disciple's strength, a joy that, as in verse 10, is meant to be shared with those for whom nothing is prepared.

explore: |
  - [[Deut. 31:10–13]]: the reading of the law to the whole people at the Feast of Tabernacles, which this chapter carries out.
  - [[Mosiah 2:1–8]]: Benjamin's people in their tents around the temple, and the tower he built to teach them.
  - [[Lev. 23:33–43]]: the feast and its booths, and the note on [[Lev. 23:40]] on how latter-day prophets read it.
  - [[Neh. 9:1–3]]: the fast later in the same month, when the people stood again to hear the law and confess.

