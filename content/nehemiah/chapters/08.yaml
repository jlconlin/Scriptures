chapter: 8
title: The Joy of the LORD Is Your Strength
tagline: The people ask for the book; Ezra reads it from a tower of wood, the Levites make it understood, the hearers weep and are told to feast, and the whole city goes out to live in booths as no one had since Joshua.
when: 'The seventh month (7:73; verse 2), in the year the wall was finished: the reading on the first day and the Feast of Tabernacles from the fifteenth (verse 14).'

setting: |
  Chapter 7 ended with the people in their cities “when the seventh month came” ([[Neh. 7:73]]), and chapter 8 opens on the first day of that month (verse 2), soon after the wall was finished on the twenty-fifth day of Elul, the month before ([[Neh. 6:15]]). The voice changes here. Nehemiah's own first-person memoir runs principally through chapters 1–7; in this chapter he appears once, in the third person, as “Nehemiah, which is the Tirshatha” (verse 9), the governor.

  Ezra steps forward instead. He had come to Jerusalem in 458 B.C. under a commission from Artaxerxes whose object was “to teach in Israel statutes and judgments,” years before Nehemiah (the dates are in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers)). Why he appears in Nehemiah's story only now the text does not say, and the order and chronology of the two men's ministries are notoriously hard to fix; this chapter is one of the places where they stand together. On Ezra the teacher, see [[Ezra 7:10]].

  The feast that fills the second half of the chapter is the Feast of Tabernacles, kept from the fifteenth to the twenty-first of the seventh month, with an eighth day added. Chapters 8–10 belong together, the reading here, the confession of chapter 9 and the covenant of chapter 10, and they are the climax of Ezra–Nehemiah.

thread: |
  The chapter carries the book's second thread, a people rebuilt around the law, and it moves in four steps: the law is read, explained, felt, and obeyed. The people ask for the book (verse 1); Ezra reads it and the Levites make it understood (verses 3–8); the hearers weep and are told that the day is for joy (verses 9–12); and when the leaders study further and find the command to dwell in booths, the whole people does it at once (verses 13–18). One Hebrew verb, *bîn*, “understand,” runs through the first half: the hearers are those who “could hear with understanding” (verses 2–3), the Levites “caused the people to understand” (verses 7–8) and are, in verse 9, literally “those who made the people understand,” and the people feast “because they had understood” (verse 12). The point of the day was not only that the law was read but that it was understood, and the understanding turned into gladness and then into obedience: scripture, read attentively, brought new meaning and then new obligations. With the walls finished and the temple long rebuilt, a reformed people now completes the restoration that began with the first return nearly a century before.

sections:
  - range: 1-8
    heading: The law read and explained
    plain: |
      All the people gathered as one in the square in front of the Water Gate, and they asked Ezra the scribe to bring the book of the law of Moses, which the LORD had commanded Israel. So on the first day of the seventh month Ezra the priest brought the law before the assembly, men and women and all who were old enough to understand. He read from it, facing the square before the Water Gate, from early morning until noon, in the presence of the men, the women and those who could understand, and all the people listened closely to the book of the law. Ezra the scribe stood on a high wooden platform built for the occasion, with six men standing at his right and seven at his left. Ezra opened the book where all the people could see it, since he stood above them all, and as he opened it the whole people stood up. Ezra blessed the LORD, the great God, and all the people answered, “Amen, Amen,” lifting up their hands; then they bowed down and worshipped the LORD with their faces to the ground. The Levites, Jeshua, Bani, Sherebiah and the others, helped the people understand the law while the people stood in their places. They read from the book of the law of God clearly and explained its meaning, so that the people understood what was read.
  - range: 9-12
    heading: “Mourn not, nor weep”
    plain: |
      Then Nehemiah the governor, Ezra the priest and scribe, and the Levites who were teaching the people said to them all, “This day is holy to the LORD your God; do not mourn or weep.” For all the people had been weeping as they heard the words of the law. Nehemiah said to them, “Go and eat rich food and drink sweet drinks, and send portions to those who have nothing prepared, for this day is holy to our Lord. Do not be grieved, for the joy of the LORD is your strength.” The Levites calmed all the people, saying, “Be still, for the day is holy; do not be grieved.” So all the people went away to eat and drink, to send portions, and to celebrate with great joy, because they had understood the words that had been made known to them.
  - range: 13-18
    heading: The booths
    plain: |
      On the second day the heads of the families of all the people, with the priests and the Levites, gathered to Ezra the scribe to study the words of the law. They found written in the law that the LORD had commanded through Moses that the Israelites should live in booths during the feast of the seventh month, and that they should announce it in all their towns and in Jerusalem: “Go out to the hills and bring branches of olive, pine, myrtle, palm and other leafy trees, to make booths, as it is written.” So the people went out and brought branches and made booths for themselves, each on the roof of his house, in their courtyards, in the courts of the house of God, in the square of the Water Gate and in the square of the Ephraim Gate. The whole assembly of those who had returned from captivity made booths and lived in them, for the Israelites had not done so from the days of Joshua the son of Nun until that day. And there was very great joy. Day after day, from the first day to the last, Ezra read from the book of the law of God. They kept the feast seven days, and on the eighth day there was a solemn assembly, as the law required.

notes:
  - ref: 1
    phrase: they spake unto Ezra the scribe to bring the book of the law of Moses
    kind: history
    title: The people asked for the book
    body: |
      The reading began with the people, not with their leaders. They gathered “as one man” in the square before the water gate and asked Ezra to bring the book, and what he brought was read to everyone who could follow it, “both of men and women” (verse 2), from early morning until midday (verse 3). What had been to a great extent the possession of the priests was brought within reach of every Jew, and the open reading of the book marked the law as the center of the nation's life.

      The law had asked for such a reading. The footnote at verse 2 points to Moses' command that the law be read before all Israel, men, women, children and strangers, at the Feast of Tabernacles (see [[Deut. 31:10]], which cites this chapter). Ezra had come to Jerusalem to teach the law ([[Ezra 7:10]]); here the people come asking to be taught.
    sources: [bd-ezra, lds-scriptures]

  - ref: 4
    phrase: stood upon a pulpit of wood, which they had made for the purpose
    kind: scripture
    title: A tower of wood
    body: |
      The “pulpit” was a raised platform, high enough that Ezra was “above all the people” (verse 5). The Hebrew word, *migdal*, is ordinarily a tower; here it is an elevated stage of wood. The staging has a model. The gathered assembly, Ezra standing between God's law and the people, his elevated platform, and above all the people's response and, in the chapters that follow, their covenant, recall Moses coming down from Sinai to stand before Israel. The scene is told so that the reader sees the restoration as a recovery of the covenant given at the beginning, not an invention.

      The footnote sends the reader to the Book of Mormon, where King Benjamin had a tower built so that his people could hear him ([[Mosiah 2:7]]). Latter-day Saint scholars set the two scenes side by side: like Benjamin, Ezra taught from a specially made tower, and a speaker on a platform is one of the features Benjamin's assembly shares with Israel's gatherings at the Feast of Tabernacles. The likeness goes past the furniture: Benjamin's people entered a covenant that follows the form of Israel's covenant renewals, and the same comparison sets beside it the assembly of Nehemiah 8–13, whose people make their covenant at [[Neh. 9:38]]. The case that Benjamin spoke at such a feast is set out at [[Deut. 31:10]].
    sources: [oshb-wlc, bdb, welch-religious-authority, ludlow-nehemiah-minute, sc-knowhy-80, welch-szink-festivals, lds-scriptures]

  - ref: 6
    phrase: with lifting up their hands
    kind: symbol
    title: Hands lifted, then faces to the ground
    body: |
      The people answered Ezra's blessing with their whole bodies, in a sequence. They stood when he opened the book (verse 5); they answered “Amen, Amen” with their hands raised; they bowed their heads; and they worshipped with their faces to the ground. Afterward, it seems, they stood again, for verse 7 has them standing “in their place” while the Levites taught. The phrase for lifting the hands is used of prayer only here, and the order of the gestures, standing, hands raised, bowing, then prostration, suggests that prayer after the exile could follow a set cycle of postures rather than a single one. Raising the hands may itself have been one of a series of “gestures of approach” by which an Israelite came before God. Here the whole series is the hearers' answer to the book: the law is opened, God is blessed, and the people say their amen.
    sources: [calabro-gestures]

  - ref: 8
    phrase: distinctly, and gave the sense
    kind: words
    title: Read distinctly, and the sense given
    body: |
      Verse 8 names three things done with the book, and the Hebrew helps tell them apart. First, it was read “distinctly.” The word, *mĕpōrāš*, means “made distinct” or “declared distinctly,” and its Aramaic counterpart is the word Artaxerxes uses of the letter from Samaria that “hath been plainly read before me” ([[Ezra 4:18]]). Some have taken it further, to “interpreted.” Later Jewish tradition understood it as a rendering of the Hebrew into Aramaic for hearers who no longer knew the old language well; one older commentary doubts that the word itself can mean that and prefers a running explanation and application of the law. The Levites' help likely involved explaining the law, and perhaps also translating it for those who, after the exile, spoke Aramaic more readily than Hebrew.

      Second, the readers “gave the sense,” making the law comprehensible. The footnote at the phrase reads it as a commentary given “by the power of the Holy Ghost” and points to [[Mosiah 1:2–5]], where Benjamin had his sons taught the language of their fathers so that they could read the records and “become men of understanding.” Third, “caused them to understand the reading” can be taken of the hearers: the people themselves came to understand what was read, as verse 12 says they had. How it was managed is not quite clear. Ezra read (verse 3), and thirteen named Levites “caused the people to understand” (verse 7); perhaps Ezra read a passage and the Levites expounded it, either one after another or each to his own group, moving among the crowd. Either way the scene insists that reading the scriptures is not enough without understanding them.
    sources: [oshb-wlc, bdb, keil-nehemiah, welch-religious-authority, ludlow-nehemiah-minute, scripture-helps-ezra, lds-scriptures]

  - ref: 9
    phrase: For all the people wept, when they heard the words of the law
    kind: history
    title: Why they wept
    body: |
      The text records the tears without giving a reason. Most likely they were tears of remorse for their own failures and their ancestors' in keeping God's commandments, though grief or joy is also possible. Whichever it was, the weeping shows how deeply the people were attached to the words they heard. Scripture's authority had become personal and devotional for them, not only a matter of history or of institutions.

      Their leaders did not tell them their sorrow was wrong; they told them what day it was. “This day is holy unto the LORD your God; mourn not, nor weep.” The day was holy, and Nehemiah, Ezra and the Levites together turned the people from mourning to feasting (verses 10–11). The confession came later: in the same month, after the Feast of Tabernacles, the people met again with fasting and sackcloth, read the law, and confessed their sins ([[Neh. 9:1–3]]).
    sources: [scripture-helps-ezra, welch-religious-authority, ludlow-nehemiah-minute, lds-scriptures]

  - ref: 10
    phrase: the joy of the LORD is your strength
    kind: words
    title: The joy of the LORD is your strength
    body: |
      The command not to grieve comes with a feast and a reason. The feast: eat “the fat,” drink “the sweet,” and “send portions unto them for whom nothing is prepared.” The holy day was not to be kept as religious observance alone; those who had nothing ready were to share the joy, so that remembering the poor became part of the worship.

      The reason: “the joy of the LORD is your strength.” The word for strength, *māʿôz*, is literally a place of safety, a stronghold; used of God it means a refuge, and this verse stands close to that use. Joy in the LORD, not grief, was to be the people's strength and safety. They took it so: they went “to make great mirth, because they had understood the words that were declared unto them” (verse 12). The joy rested on understanding, the same understanding that had brought the tears.
    sources: [oshb-wlc, bdb, ot-manual-32, lds-scriptures]

  - ref: 17
    phrase: since the days of Jeshua the son of Nun unto that day had not the children of Israel done so
    kind: history
    title: Not since the days of Joshua
    body: |
      Scripture records the feast kept after Joshua's day: Solomon kept it ([[2 Chr. 7:8–10]]), and the first exiles to return kept “the feast of tabernacles, as it is written” ([[Ezra 3:4]]). One Latter-day Saint reading takes the verse to mean that the festival had not been observed “in this fashion” since the days of Joshua. The text dwells on the manner: the whole congregation of the returned captivity building booths and sitting under them, on their roofs and in their courtyards, in the courts of the temple and in the city's squares (verses 16–17).

      It began with study. On the second day the heads of families, the priests and the Levites came back to Ezra to understand the law further, found the command to dwell in booths, and published it at once (verses 13–15). The keeping of it rebuilt the people as a community: a reestablished religious identity, kept with “very great gladness,” with Ezra reading from the law every day of the feast and a solemn assembly on the eighth (verse 18). What the booths recalled is explained at [[Lev. 23:43]].
    sources: [ludlow-nehemiah-minute, lds-scriptures]

christ: |
  The day the law was read began in tears and ended in “very great gladness” (verse 17), and its leaders told the people that “the joy of the LORD is your strength” (verse 10). The footnotes at verses 9 and 12 send the reader to King Benjamin's people, who heard the word, fell to the earth, and then “were filled with joy, having received a remission of their sins, and having peace of conscience, because of the exceeding faith which they had in Jesus Christ who should come” ([[Mosiah 4:3]]); in the Book of Mormon that joy has a source and a name. Scripture read with understanding still turns sorrow for sin toward the joy of forgiveness in Jesus Christ, and the footnote at verse 10 points to the Lord's word in this dispensation that His day be kept “with a glad heart and a cheerful countenance” ([[D&C 59:15]]).

explore: |
  - **Ezra the teacher.** [[Ezra 7:6–10]], the scribe who set his heart to seek the law, do it, and teach it.
  - **Benjamin's assembly.** [[Mosiah 2:1–8]], a people gathered in tents around a tower to hear the word.
  - **The feast and its booths.** [[Lev. 23:33–43]]; and the feast kept again by all nations in [[Zech. 14:16–19]].
  - **What followed the reading.** [[Neh. 9]] and [[Neh. 10]], the confession and the written covenant.

