chapter: 12
title: The Joy of Jerusalem Was Heard Even Afar Off
tagline: The priests and Levites are listed from the first return down to Jaddua. Then the wall is dedicated, with two thanksgiving choirs walking it in procession, and Judah gives the portions of the law gladly.
when: 'Verses 1–26 run from the first return under Cyrus (the Bible Chronology dates his decree 537 B.C.) to high priests after Nehemiah''s day; verses 27–47 tell of the dedication of the wall, which the text does not date.'

setting: |
  Chapter 11 filled Jerusalem with people. Chapter 12 lists the priests and Levites who served its temple and then, at last, dedicates the wall finished at [[Neh. 6:15]]. The lists belong with the register Nehemiah took once the wall stood ([[Neh. 7:5]]), though they were drawn up partly before his time and partly after it. Verses 1–9 name the priests and Levites who came up with Zerubbabel and Jeshua in the first return, under the decree of Cyrus that the Bible Chronology dates to 537 B.C. (see [[Ezra 2:1–2]]). Verses 10–11 carry the line of high priests, continuing the list of [[1 Chr. 6:3–15]], and verses 12–26 name the heads of the priestly houses in the days of the high priest Joiakim, and the chief Levites.

  The list reaches well past Nehemiah. The Bible Chronology dates Eliashib, the high priest who built the sheep gate ([[Neh. 3:1]]), to 453 B.C., and his great-grandson Jaddua to 341 B.C., and it takes “Darius the Persian” in verse 22 to be Darius III, who came to the throne in 336 B.C.

  Verse 27 picks up the story where 7:5 left it. At verse 31 the “I” of Nehemiah's own account comes back, absent since [[Neh. 7:5]]: “Then I brought up the princes of Judah upon the wall.” In the rest of the chapter he uses the first person only for what he arranged himself and where he stood.

thread: |
  This chapter carries the book's second thread, a people rebuilt around the law. Both of its halves show worship set back in its old order. The lists give the houses of priests who would serve the temple in turn, and Levites who sang “according to the commandment of David the man of God” (verse 24). The dedication brings those same singers in from their villages and sets them on the wall. The chapter closes with the tithes and portions of the law gathered into the temple's chambers, as the covenant of chapter 10 had promised.

  The tone is joy. The Levites are gathered “to keep the dedication with gladness” (verse 27), and verse 43 rings with rejoicing, the women and children included. The text gives the joy its source, “God had made them rejoice with great joy”: the joy God gave them by prospering the building of the wall. Even the portions are given gladly, for “Judah rejoiced for the priests and for the Levites” (verse 44).

sections:
  - range: 1-9
    heading: Priests and Levites of the first return
    plain: |
      These are the priests and Levites who came up with Zerubbabel son of Shealtiel and with Jeshua: Seraiah, Jeremiah, Ezra, and the rest, twenty-two names in all. They were the chief priests and their kinsmen in Jeshua's day. The Levites were Jeshua, Binnui, Kadmiel, Sherebiah, Judah and Mattaniah, who with his kinsmen led the songs of thanksgiving, while Bakbukiah and Unni and their kinsmen stood opposite them in the order of service.
  - range: 10-11
    heading: The high priests
    plain: |
      Jeshua was the father of Joiakim, Joiakim of Eliashib, Eliashib of Joiada, Joiada of Jonathan, and Jonathan of Jaddua.
  - range: 12-26
    heading: Heads of houses in Joiakim's day
    plain: |
      In the days of Joiakim these priests were heads of their fathers' houses: for Seraiah's house, Meraiah; for Jeremiah's, Hananiah; for Ezra's, Meshullam; and so on through the houses, down to Nethaneel for Jedaiah's. The heads of the Levites were recorded in the days of the high priests Eliashib, Joiada, Johanan and Jaddua, and the priests as well, down to the reign of Darius the Persian. The heads of the Levite families were written in the book of the chronicles down to the days of Johanan son of Eliashib. The chief Levites, Hashabiah, Sherebiah and Jeshua son of Kadmiel, stood with their kinsmen facing them, group opposite group, to praise and give thanks, as David the man of God had commanded. Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon and Akkub were gatekeepers who guarded the storehouses at the gates. All these served in the days of Joiakim son of Jeshua son of Jozadak, and in the days of Nehemiah the governor and of Ezra the priest and scribe.
  - range: 27-30
    heading: Preparing the dedication
    plain: |
      For the dedication of the wall of Jerusalem they sought out the Levites wherever they lived and brought them to Jerusalem, to celebrate the dedication with gladness, with thanksgiving and song, and with cymbals, lyres and harps. The singers gathered from the country around Jerusalem and from the villages of the Netophathites, from Beth-gilgal and the fields of Geba and Azmaveth, for the singers had built themselves villages around Jerusalem. The priests and Levites purified themselves, and then purified the people, the gates and the wall.
  - range: 31-43
    heading: Two choirs on the wall
    plain: |
      Then I brought the leaders of Judah up onto the wall, and I set two great thanksgiving choirs in procession. One went to the right along the wall toward the dung gate, followed by Hoshaiah and half the leaders of Judah, and by priests with trumpets and by Zechariah, a descendant of Asaph, with his kinsmen playing the instruments of David the man of God. Ezra the scribe walked at their head. At the fountain gate they went straight up the stairs of the city of David, where the wall rises above David's palace, and on to the water gate on the east. The second choir went the opposite way, and I followed it with half the people, along the wall past the tower of the furnaces to the broad wall, over the gate of Ephraim, the old gate and the fish gate, past the towers of Hananeel and Meah to the sheep gate, and they halted at the prison gate. So both choirs took their places in the house of God, and I with half the officials, and the priests with their trumpets, and the singers sang out under Jezrahiah their leader. That day they offered great sacrifices and rejoiced, for God had given them great joy. The women and children rejoiced too, and the joy of Jerusalem could be heard far away.
  - range: 44-47
    heading: The portions of the law
    plain: |
      At that time men were appointed over the storerooms for the contributions, the firstfruits and the tithes, to gather into them from the fields around the towns the portions the law assigns to the priests and Levites, for Judah was glad of the priests and Levites who served. The singers and gatekeepers kept the service of their God and the service of purification, as David and his son Solomon had commanded, for long ago, in the days of David and Asaph, there were leaders of the singers and songs of praise and thanksgiving to God. So in the days of Zerubbabel and of Nehemiah all Israel gave the singers and gatekeepers their daily portions. They set apart what was due to the Levites, and the Levites set apart what was due to the priests, the descendants of Aaron.

notes:
  - ref: 7
    phrase: These were the chief of the priests and of their brethren in the days of Jeshua
    kind: history
    title: Houses of priests for the temple’s courses
    body: |
      The names in verses 1–7 are the framework of the temple's service. David had divided the priestly families into twenty-four courses, each serving a week at a time. Only four houses of priests came back from Babylon ([[Ezra 2:36–39]]), and these were divided again into twenty-four. Verses 1–7 name twenty-two houses, and verses 12–21 give the same houses, each with its head, in the days of the high priest Joiakim, a generation after the return: “of Seraiah, Meraiah; of Jeremiah, Hananiah” (verse 12). The two missing places may have been left open for the priestly families who came up without finding their register ([[Ezra 2:61–62]]); how the full number was made up is not known.

      That is why the names “Jeremiah” and “Ezra” appear here. They are heads of priestly houses that came up with Zerubbabel, under a decree dated 537 B.C. Ezra the scribe's commission came nearly eighty years later, in 458 B.C., and in Joiakim's day the house “of Ezra” already had its own head, Meshullam (verse 13).

      One of these houses leads into the New Testament. Abijah (verse 4) was the eighth of David's courses ([[1 Chr. 24:10]]), and the footnote sends the reader to [[Luke 1:5]]: “in the days of Herod,” a priest named Zacharias was “of the course of Abia.”
    sources: [bd-priests, keil-nehemiah, bible-chron-ot, lds-scriptures]

  - ref: 24
    phrase: according to the commandment of David the man of God, ward over against ward
    kind: history
    title: The singers and porters, after David’s order
    body: |
      The Levites' service is set back in the shape David gave it. Mattaniah was “over the thanksgiving” (verse 8), with kinsmen standing “over against them in the watches” (verse 9). In verse 24 the chief Levites stand with their brethren facing them, “to praise and to give thanks… ward over against ward,” one company answering the other. Gatekeepers kept watch over the storehouses (verse 25). David's ordinance for the singers, and their singing by course, are explained at [[Ezra 3:10]]. Verses 45–46 come back to it: the singers and porters kept their charge “according to the commandment of David, and of Solomon his son,” for there had been chief singers and songs of praise since the days of David and Asaph.

      Two details answer a reader's questions. The lists of verses 22–26 show the Levites serving in shifts, so they could serve at the temple and still look after other responsibilities. And David is called “the man of God” probably because he was an author of scripture, above all of the psalms these singers used in the temple's worship. The footnote at verse 36 points to the instruments he made for their praise ([[1 Chr. 23:5]]).
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 30
    phrase: purified themselves, and purified the people, and the gates, and the wall
    kind: history
    title: Purifying a wall
    body: |
      The dedication began with cleansing, and the cleansing began with those who would perform it. The priests and Levites purified themselves first, then the people, then the gates and the wall. The footnote points to the law that cleansed the Levites before their service: “Sprinkle water of purifying upon them… and so make themselves clean” ([[Num. 8:7]]). Only after that could they “go in to do the service of the tabernacle.”

      How a wall was purified the text does not say. It was probably done with sin offerings and burnt offerings, as when Hezekiah's priests cleansed the temple ([[2 Chr. 29:20–24]]), by a ritual now unknown. Verse 45 also gives the singers and porters “the ward of the purification” to keep, along with the ward of their God.
    sources: [keil-nehemiah, lds-scriptures]

  - ref: 31
    phrase: two great companies of them that gave thanks
    kind: words
    title: Two thanksgiving choirs on the wall
    body: |
      Behind “companies of them that gave thanks” stands one Hebrew word, *todot*, the plural of *todah*, “thanksgiving.” Elsewhere the word means thanksgiving or a thank offering. Here, and in verses 38 and 40, it names a thanksgiving choir, a company in procession, and verse 31 adds a second word for “processions.” Nehemiah set two of these choirs on the wall itself; they went in opposite directions around the city and met at the temple.

      The first choir went right, toward the dung gate, with princes and priests blowing trumpets and Levites playing “the musical instruments of David,” “and Ezra the scribe before them” (verse 36). The second went the other way, “and I after them” (verse 38), past the tower of the furnaces, the broad wall, the old gate, the fish gate and the towers of Hananeel and Meah to the sheep gate. Several of these are gates and towers whose building chapter 3 records ([[Neh. 3:3]]; [[Neh. 3:6]]; [[Neh. 3:11]]), down to the sheep gate the priests had built and sanctified ([[Neh. 3:1]]). The people who had built the wall now walked on it, giving thanks, and “so stood the two companies of them that gave thanks in the house of God” (verse 40).
    sources: [oshb-wlc, bdb, ludlow-nehemiah-minute, lds-scriptures]

  - ref: 43
    phrase: so that the joy of Jerusalem was heard even afar off
    kind: history
    title: Joy heard afar off
    body: |
      The same sound was heard when the temple's foundation was laid. When the foundation was laid under Zerubbabel, the people shouted so that “the noise was heard afar off,” but no one “could discern the noise of the shout of joy from the noise of the weeping of the people” ([[Ezra 3:13]]; see the note at [[Ezra 3:12]]). Now the sound carries again, and this time the text calls it “the joy of Jerusalem.” It gives the joy a source, “God had made them rejoice with great joy,” and it reaches the whole household: “the wives also and the children rejoiced.”

      Latter-day Saints mark the dedication of a temple in a similar way, with cultural celebrations and the Hosanna Shout. The note at [[Ezra 3:10]] sets the shout beside the earlier foundation.
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 44
    phrase: for Judah rejoiced for the priests and for the Levites that waited
    kind: history
    title: The portions given gladly
    body: |
      The portions for the temple's servants were gathered gladly. Men are appointed over the storerooms to gather “the portions of the law” from the fields around the towns, and the reason given is joy: Judah was glad of the priests and Levites serving again. The people gave generously, because the law of Moses required it and also to thank those who served. What had lain in ruins was working again, and verse 47 says that all Israel gave the singers and porters their daily portions.

      Chapter 13 tells what became of these portions. When Nehemiah came back from the king, he “perceived that the portions of the Levites had not been given them,” and the singers had gone back to their fields ([[Neh. 13:10]]). The Bible Chronology sets the prophecy of Malachi beside that second mission, and Malachi charges the people with robbing God “in tithes and offerings” ([[Mal. 3:8]]).
    sources: [ludlow-nehemiah-minute, bible-chron-ot, lds-scriptures]

christ: |
  The course of Abijah, one of the houses named in this chapter (verses 4 and 17), was serving in the days of Herod, when “a certain priest named Zacharias, of the course of Abia” ([[Luke 1:5]]) went into the temple “in the order of his course” ([[Luke 1:8]]). There he heard that his son would “make ready a people prepared for the Lord” ([[Luke 1:17]]); the footnote at verse 4 points there. Beside the Levites appointed “to praise and to give thanks” (verse 24), the footnote sets the Lord's word that His wrath is kindled against none “save those who confess not his hand in all things” ([[D&C 59:21]]). Verse 43 credits the finished wall's joy to God: “God had made them rejoice.” A disciple who thanks God for a work completed, and keeps giving to His house after the celebration, confesses the same hand.

explore: |
  - [[1 Chr. 24:1–19]]: David's twenty-four courses of priests, Abijah the eighth.
  - [[1 Chr. 25:1–8]]: the singers David set apart, Asaph among them.
  - [[Ezra 3:10–13]]: the singers at the temple's foundation, and the noise heard afar off.
  - [[Ps. 147]]: a psalm of Jerusalem built up and its gates made strong.
  - [[Zech. 1:1]]: the prophet Zechariah, of the line of Iddo (verses 4 and 16).
  - [[Neh. 13:10–14]]: the portions withheld, and Nehemiah's remedy.

sources: [bible-chron-ot, keil-nehemiah, ludlow-nehemiah-minute, bd-priests, lds-scriptures, oshb-wlc, bdb]
