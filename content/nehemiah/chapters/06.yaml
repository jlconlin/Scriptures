chapter: 6
title: This Work Was Wrought of Our God
tagline: Nehemiah's enemies try to draw him out of the city, accuse him of rebellion, and hire a prophet to frighten him into the temple. He will not come down, and the wall is finished in fifty-two days.
when: 'The wall finished on the twenty-fifth day of Elul, after fifty-two days (verse 15), 445 or 444 B.C.'

setting: |
  Chapter 4 ended with the builders working armed, and chapter 5 turned to trouble inside the community. Chapter 6 brings the wall to its end. By verse 1 no breach is left, though the doors are not yet hung in the gates, and verse 15 finishes the wall after fifty-two days. The king is Artaxerxes I, and the dates are in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  The opponents are the three met at [[Neh. 2:10]] and [[Neh. 2:19]], Sanballat, Tobiah and Geshem the Arabian (see the note on [[Neh. 2:10]] for who they were and why they feared a walled Jerusalem). Having failed to stop the building by open force in chapter 4, they now set snares for the man who led it.

  Their chief weapon was an old one. Earlier in his reign, a letter to this same Artaxerxes had called Jerusalem “the rebellious and the bad city,” and the king had ordered the building stopped ([[Ezra 4:12]]; [[Ezra 4:21]]). The jeer of [[Neh. 2:19]], “will ye rebel against the king?”, becomes in this chapter a written charge.

thread: |
  Every move in the chapter is aimed at one man and at one feeling. The enemies invite Nehemiah down to the plain, publish a charge of treason, and hire a prophet, and the word the chapter keeps returning to is fear: “they all made us afraid” (verse 9); Shemaiah was hired “that I should be afraid” (verse 13); the prophets “would have put me in fear” (verse 14); Tobiah “sent letters to put me in fear” (verse 19). Verses 9, 14 and 19 use the same Hebrew verb.

  Nehemiah answers each move with the work. He cannot come down because of it (verse 3); the enemies hope the builders' hands will be “weakened from the work,” and he prays for strong hands (verse 9). At the end the fear changes sides. When the wall is finished it is the enemies who are “much cast down in their own eyes,” that is, they lose heart, because “they perceived that this work was wrought of our God” (verse 16). This is the book's first thread at its height: a man who prays and works, and a work that even his enemies credit to God. The last verses add that a finished wall did not end the opposition, for Tobiah had sworn friends inside Judah.

sections:
  - range: 1-4
    heading: Come down to Ono
    plain: |
      Sanballat, Tobiah, Geshem the Arabian and the rest of our enemies heard that I had built the wall and that no gap was left in it, though I had not yet hung the doors in the gates. Sanballat and Geshem sent me word: Come, let us meet in one of the villages in the plain of Ono. But they meant to harm me. I sent messengers back to say: I am doing a great work and cannot come down. Why should the work stop while I leave it and come down to you? They sent me the same message four times, and each time I gave the same answer.
  - range: 5-9
    heading: The open letter
    plain: |
      The fifth time, Sanballat sent his servant to me with an open letter. It said: It is being reported among the nations, and Geshem says it too, that you and the Jews mean to rebel, and that this is why you are building the wall; you mean to be their king. You have even appointed prophets to proclaim in Jerusalem, There is a king in Judah. This will be reported to the king. So come, and let us talk it over. I sent back: Nothing like what you say has happened; you are making it up. They were all trying to frighten us, thinking, Their hands will drop from the work and it will not be finished. But now, strengthen my hands.
  - range: 10-14
    heading: The hired prophet
    plain: |
      Then I went to the house of Shemaiah son of Delaiah, son of Mehetabeel, who was shut in. He said: Let us meet in the house of God, inside the temple, and shut the temple doors, for they are coming to kill you; they are coming in the night to kill you. I said: Should a man like me run away? And what man in my place would go into the temple to save his life? I will not go in. Then I saw that God had not sent him. He had spoken this prophecy against me because Tobiah and Sanballat had paid him. They had hired him to frighten me into doing it and sinning, so that they could give me a bad name and disgrace me. My God, remember Tobiah and Sanballat for what they have done, and the prophetess Noadiah and the other prophets who tried to frighten me.
  - range: 15-16
    heading: The wall finished
    plain: |
      So the wall was finished on the twenty-fifth day of the month Elul, in fifty-two days. When all our enemies heard of it, and all the nations around us saw it, they lost heart, for they saw that this work had been done with the help of our God.
  - range: 17-19
    heading: Tobiah's letters
    plain: |
      In those days, too, the nobles of Judah were sending many letters to Tobiah, and Tobiah's letters came to them. Many in Judah were bound to him by oath, because he was the son-in-law of Shechaniah son of Arah, and his son Johanan had married the daughter of Meshullam son of Berechiah. They kept telling me of his good deeds and reporting my words to him. And Tobiah sent letters to frighten me.

notes:
  - ref: 3
    phrase: I am doing a great work, so that I cannot come down
    kind: prophets
    title: Why Nehemiah would not come down
    body: |
      Nehemiah would not go to Ono because the work would stop if he left it, and because he knew the invitation was a trap. Sanballat and Geshem proposed talks in a village in the plain of Ono, away from Jerusalem, and he says plainly that “they thought to do me mischief” (verse 2). The invitation came four times, offered as a way to settle the conflict, and each time he sent the same reply (verse 4).

      His answer leaves the danger unmentioned and speaks only of the work: “why should the work cease, whilst I leave it, and come down to you?” President Dieter F. Uchtdorf took the refusal as a lesson in focus: Nehemiah “refused to allow distractions to prevent him from doing what the Lord wanted him to do.”
    sources: [uchtdorf-great-work]

  - ref: 5
    phrase: with an open letter in his hand
    kind: history
    title: An open letter and a charge of treason
    body: |
      The fifth message came as an open letter, one anyone might read, and its charge was treason. It said the rumor was already “reported among the heathen” and that Gashmu vouched for it (verse 6): the wall was the first step of a revolt, Nehemiah meant to make himself king, and he had prophets proclaiming “There is a king in Judah” (verse 7). Then the threat, “now shall it be reported to the king,” and the old invitation once more: “Come now therefore, and let us take counsel together.” With an accusation anyone could read, Sanballat seems to have thought to oblige Nehemiah to come and clear himself in person, at the meeting he had already refused four times (verse 4).

      The king to be told was the one Nehemiah served, the Artaxerxes who had once stopped the building of Jerusalem's wall, after a letter told him the Jews were rebuilding “the rebellious and the bad city” ([[Ezra 4:12]]); he had ordered “that this city be not builded, until another commandment shall be given from me” ([[Ezra 4:21]]; see the note there). A charge of rebellion had already halted the wall once in his reign.

      Nehemiah's reply is a flat denial: “There are no such things done as thou sayest, but thou feignest them out of thine own heart” (verse 8).
    sources: [bd-artaxerxes, keil-nehemiah, lds-scriptures]

  - ref: 9
    phrase: O God, strengthen my hands
    kind: words
    title: A prayer in the middle of the story
    body: |
      The last words of verse 9 are a prayer, though the Hebrew does not name God in them. It reads only *and now, strengthen my hands*, with the verb a command, and the King James translators supplied “O God” to show who is addressed. Nehemiah, writing of those days afterward, seems to slip back into the moment and prays as he prayed then. The Greek translation, not reading a prayer there, made it a statement: “Now therefore I have strengthened my hands.”

      The prayer answers the enemies in their own words. They counted on fear to make the builders' hands drop: “Their hands shall be weakened from the work, that it be not done.” Nehemiah asks for the opposite, strong hands for the same work. It is the kind of prayer he made before the king, a sentence spoken in the middle of what he was doing ([[Neh. 2:4]]).
    sources: [oshb-wlc, keil-nehemiah, lxx-rahlfs]

  - ref: 11
    phrase: who is there, that, being as I am, would go into the temple to save his life
    kind: history
    title: A hired prophet and the temple
    body: |
      Shemaiah's advice would have led Nehemiah into sin. Speaking as a prophet, he warned that killers would come by night and urged Nehemiah to meet him inside the temple and shut its doors (verse 10). Under the law of Moses only priests could enter the holy place, and Nehemiah was not a priest. The law that gave the priests charge of all “within the veil” ends: “the stranger that cometh nigh shall be put to death” ([[Num. 18:7]]).

      Verse 13 says what the plot was for: that he “should be afraid, and do so, and sin,” giving his enemies “matter for an evil report, that they might reproach me.” Nehemiah's answer in verse 11 gives two reasons for refusing: a man in his place should not run (“Should such a man as I flee?”), and he would not go into the temple to save his life. Then he saw that God had not sent Shemaiah: Tobiah and Sanballat had paid for the prophecy (verse 12).

      Shemaiah was not the only one. Verse 14 names the prophetess Noadiah “and the rest of the prophets,” and Nehemiah leaves them, with Tobiah and Sanballat, to God “according to these their works,” as he had left his enemies to God in [[Neh. 4:4–5]].
    sources: [scripture-helps-ezra, lds-scriptures]

  - ref: 16
    phrase: they perceived that this work was wrought of our God
    kind: history
    title: Fifty-two days, and whose work it was
    body: |
      The enemies' own verdict closes the story of the wall: when it was finished in fifty-two days, “they perceived that this work was wrought of our God.” The speed and quality of the work were remarkable, and Nehemiah does not tell them as a feat of organization; he gives the conclusion to the men who had opposed it. The Hebrew says they “fell greatly in their own eyes,” most likely an idiom like the fallen countenance of [[Gen. 4:5]]: they lost heart. The men who had spent the chapter trying to make the builders afraid ended discouraged, and the “great work” Nehemiah would not leave (verse 3) turned out, by their own admission, to have been God's.

      How so much was done so fast the text does not say. One older explanation is that the work was a repair rather than a new wall: closing the breaches and restoring the ruined gates, with a large part of the old wall and at least one gate still standing. On that reading the stone for the most part needed only to be brought out of the ruins, other materials may have been gathered and prepared beforehand, the whole community worked at once (chapter 3), and the strain of building under arms and keeping watch (chapter 4) could be kept up for fifty-two days but hardly much longer.
    sources: [scripture-helps-ezra, keil-nehemiah, oshb-wlc]

  - ref: 18
    phrase: For there were many in Judah sworn unto him
    kind: history
    title: Tobiah’s friends inside Judah
    body: |
      Verse 18 explains why nobles of Judah sided with an Ammonite: Tobiah, an influential member of the community in Jerusalem, had married into it. He was the son-in-law of Shechaniah son of Arah, and his son Johanan had married the daughter of Meshullam son of Berechiah, the same Meshullam who had repaired two stretches of the wall ([[Neh. 3:4]]; [[Neh. 3:30]]). Many in Judah were bound to him by oath.

      So letters went both ways. Nobles of Judah wrote to Tobiah, praised him to Nehemiah, and passed Nehemiah's words back to him, while Tobiah wrote “to put me in fear” (verses 17, 19). The ties outlasted the wall. While Nehemiah was away, the priest Eliashib, “allied unto Tobiah,” gave him a great chamber in the house of God ([[Neh. 13:4–5]]).
    sources: [scripture-helps-ezra, lds-scriptures]

christ: |
  The chapter ends by giving the work away: the enemies saw “that this work was wrought of our God” (verse 16). Beside the hired prophet sent to make Nehemiah afraid (verse 13), the footnote sets the Lord's rebuke to Joseph Smith, “you should not have feared man more than God,” with what faithfulness would have brought him: the Lord “would have extended his arm and supported you against all the fiery darts of the adversary” ([[D&C 3:7–8]]). The work a disciple is given is God's work too, and as His people press forward in it, He helps them overcome opposition and distraction.

explore: |
  - [[Alma 47:10–11]]: Lehonti, who came down from his mountain after the fourth summons, set beside Nehemiah, who would not come down.
  - [[Neh. 4:1–23]]: the same enemies' open threats, and building with a sword at the side.
  - [[Ezra 4:7–23]]: the letters that once stopped the wall.
  - [[Neh. 13:4–9]]: Tobiah's chamber in the temple, and how Nehemiah dealt with it.

