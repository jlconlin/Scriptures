chapter: 11
title: One of Ten to Dwell in Jerusalem
tagline: The wall stands around a half-empty city. The people cast lots to bring one in ten of them into Jerusalem, bless those who go willingly, and the chapter records who lived in the holy city and in the towns of Judah and Benjamin.
when: 'After the wall was finished; the text gives no date.'

setting: |
  Chapter 7 left a finished wall around a nearly empty city: “the city was large and great: but the people were few therein, and the houses were not builded” ([[Neh. 7:4]]). Nehemiah wrote that God put it into his heart to gather the people and reckon them by genealogy ([[Neh. 7:5]]), but the account turns next to the seventh month, with the reading of the law, the Feast of Tabernacles, the fast and the covenant of chapters 8–10. Chapter 11 tells how the resolve of 7:4–5 was carried out, after those days of worship.

  The chapter opens the book's last division, the city filled and the covenant kept. Two verses tell the measure itself: a lot that brought one in ten of the people into Jerusalem, and the people's blessing on those who went. The rest is a register of the province: the heads of Judah and Benjamin, the priests, the Levites, the singers and the porters who lived in the city (verses 3–24), and then the towns of Judah and Benjamin where the others lived (verses 25–36). A similar list of the people of Jerusalem stands in [[1 Chr. 9:2–17]]. Chapter 12 goes on with the priests and Levites and the dedication of the wall.

thread: |
  The thread is the holy city and who will live in it. Jerusalem is called “the holy city” in verse 1 and again in verse 18, and the register that follows counts first the leaders of Judah and Benjamin and then, at length, those who serve the house: the priests “that did the work of the house” (verse 12), the Levites over “the outward business of the house of God” (verse 16), the singer who began “the thanksgiving in prayer” (verse 17) and the porters “that kept the gates” (verse 19). The people cast lots for who would go, and they blessed the men who went willingly. The book's second thread, a people rebuilt around the law and its covenant, here becomes a matter of where people live: who will make their home beside the house of God.

sections:
  - range: 1-2
    heading: One in ten for the holy city
    plain: |
      The leaders of the people lived in Jerusalem. The rest of the people cast lots to bring one out of every ten to live in Jerusalem, the holy city, while the other nine stayed in the other towns. And the people blessed all the men who willingly offered to live in Jerusalem.
  - range: 3-24
    heading: Those who lived in Jerusalem
    plain: |
      These are the heads of the province who lived in Jerusalem; in the towns of Judah the people lived each on his own property in their towns: Israelites, priests, Levites, temple servants and the descendants of Solomon's servants. In Jerusalem lived some of the people of Judah and of Benjamin. From Judah: Athaiah son of Uzziah, of the line of Perez, and Maaseiah son of Baruch, of the line of Shiloni. The descendants of Perez living in Jerusalem were 468 able men. From Benjamin: Sallu son of Meshullam, and after him Gabbai and Sallai, 928 in all. Joel son of Zichri was their overseer, and Judah son of Senuah was second in command of the city.

      Of the priests: Jedaiah son of Joiarib, and Jachin; Seraiah son of Hilkiah, of the line of Zadok, was the officer in charge of the house of God; and their kinsmen who did the work of the temple, 822. Adaiah son of Jeroham, of the line of Malchiah, and his kinsmen, heads of families, 242; and Amashai son of Azareel, of the line of Immer, and their kinsmen, mighty men, 128. Their overseer was Zabdiel, the son of one of the great men.

      Of the Levites: Shemaiah son of Hashub; Shabbethai and Jozabad, leaders of the Levites, who had charge of the outside work of the house of God; Mattaniah son of Micha, a descendant of Asaph, who led the thanksgiving in prayer, with Bakbukiah second among his kinsmen, and Abda son of Shammua, a descendant of Jeduthun. All the Levites in the holy city were 284. The gatekeepers, Akkub, Talmon and their kinsmen who kept watch at the gates, were 172.

      The rest of Israel, with the priests and Levites, lived in all the towns of Judah, each on his own inheritance. The temple servants lived on Ophel, with Ziha and Gispa over them. The overseer of the Levites in Jerusalem was Uzzi son of Bani, of the descendants of Asaph, the singers who were in charge of the service of the house of God. For the king had given a command about them, and a fixed provision was set for the singers for each day. And Pethahiah son of Meshezabeel, of the descendants of Zerah son of Judah, was at the king's side in all matters concerning the people.
  - range: 25-36
    heading: The towns of Judah and Benjamin
    plain: |
      As for the villages and their fields, some of the people of Judah lived in Kirjath-arba and its villages, in Dibon and its villages, in Jekabzeel and its villages, in Jeshua, Moladah and Beth-phelet, in Hazar-shual, in Beer-sheba and its villages, in Ziklag, in Mekonah and its villages, in En-rimmon, Zareah and Jarmuth, in Zanoah, Adullam and their villages, in Lachish and its fields, and in Azekah and its villages. So they settled from Beer-sheba to the valley of Hinnom. The people of Benjamin lived from Geba on, in Michmash, Aija, Beth-el and their villages, in Anathoth, Nob, Ananiah, Hazor, Ramah, Gittaim, Hadid, Zeboim, Neballat, Lod and Ono, the valley of craftsmen. And of the Levites, some divisions lived in Judah and some in Benjamin.

notes:
  - ref: 1
    phrase: cast lots, to bring one of ten to dwell in Jerusalem
    kind: history
    title: Why a tenth were brought in by lot
    body: |
      The lot is Nehemiah's answer to the problem he named when the wall was done: a large city with few people and few houses ([[Neh. 7:4]]). A wall needs people to man it, and the measure was meant to support and defend a population inside Jerusalem. The leaders already lived there, and one in ten of the rest was to move into the city. The other nine stayed in the towns, where the land they farmed probably made a living easier than the city could.

      Casting lots was understood to place the choice of who would move in the Lord's hands. In ancient Israel the lot was considered a valid way of obtaining revelation from the Lord, as when Joshua used it to find the guilty man in the camp ([[Josh. 7:16–18]]). So the outcome could be received as the Lord’s will, not a governor’s choice. For a reading of these thinly peopled streets beside Isaiah's promise of a crowded Zion, see [[Isa. 49:20]].
    sources: [ludlow-nehemiah-minute, sc-knowhy-180]

  - ref: 1
    phrase: the holy city
    kind: words
    title: The holy city
    body: |
      Jerusalem is called holy because the house of God stands in it. The title, used here and in verse 18, rests on prophecy that ties the city's holiness to the Lord dwelling in it: “I am the Lord your God dwelling in Zion, my holy mountain: then shall Jerusalem be holy” ([[Joel 3:17]]). The list that follows bears this out: after the leaders of Judah and Benjamin, most of the people it names are priests, Levites, singers and porters, the men who served that house (verses 10–19).
    sources: [keil-nehemiah, lds-scriptures]

  - ref: 2
    phrase: willingly offered themselves to dwell at Jerusalem
    kind: words
    title: The men that willingly offered themselves
    body: |
      The people blessed the men who chose to move to Jerusalem, and the choice likely cost them something: as the note on the lot says, a living was probably easier on the farmland of the towns than in the city. The Hebrew verb, *nadab*, means to volunteer: it is used of men who volunteer for war and, as here, for service of other kinds. The same words, “the people willingly offered themselves,” open Deborah's song for the men who went out to battle ([[Judg. 5:2]]).

      Most likely these were volunteers who went to live in the city along with those the lot chose; verse 2 does not say how many there were.
    sources: [bdb, lds-scriptures, ludlow-nehemiah-minute]

  - ref: 3
    phrase: Now these are the chief of the province that dwelt in Jerusalem
    kind: history
    title: A register of the province
    body: |
      The list that begins here records where the people of the province lived, in the city and around it, not only the families the lot moved. Verses 4–19 name the people of Jerusalem: heads from Judah and Benjamin, the two tribes whose inheritance surrounded the city, then the priests, the Levites and the gatekeepers, each with the number of men under them. Verses 20–24 add a few lines on the rest of Israel, the temple servants on Ophel, the singers and the king's man, and verses 25–36 name the villages and towns of Judah and Benjamin around Jerusalem where the others lived. The temple servants (the Nethinims) and “the children of Solomon's servants” in verse 3 are groups already counted among the first exiles to return ([[Ezra 2:43–58]]).
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 23
    phrase: it was the king’s commandment concerning them
    kind: history
    title: The king’s commandment
    body: |
      The king who ordered the singers' daily portion was most likely the Persian Artaxerxes, not David, who had organized the Levites' service long before ([[1 Chr. 23:4]]). Artaxerxes is “the king” of the next verse too, and his command probably goes back to the authority he gave Ezra to order all that concerned the worship of God at Jerusalem ([[Ezra 7:12–26]]). Verse 24 names Pethahiah, a descendant of Judah's son Zerah, who was “at the king's hand” in all matters concerning the people: probably an official who handled the Jews' affairs at the king's court rather than a royal commissioner in Jerusalem. If these readings are right, the temple's daily service ran under a foreign king's warrant, and the people had a man of their own at his court.
    sources: [keil-nehemiah]

  - ref: 30
    phrase: they dwelt from Beer-sheba unto the valley of Hinnom
    kind: history
    title: From Beer-sheba unto the valley of Hinnom
    body: |
      Verse 30 sums up the land the people of Judah now occupied, and the names are those of Judah's old allotment. Beer-sheba was among “the uttermost cities of the tribe of the children of Judah” toward the south ([[Josh. 15:21]]; [[Josh. 15:28]]), and the valley of Hinnom was where Judah's border ran up to Jerusalem ([[Josh. 15:8]]). Kirjath-arba (verse 25) is Abraham's Hebron ([[Gen. 23:2]]), and Moladah, Hazar-shual, Ziklag, Zanoah, Adullam, Jarmuth, Lachish and Azekah all stand in Joshua's list of Judah's towns ([[Josh. 15:20–63]]). The returned exiles lived again, as verse 20 says, “every one in his inheritance.”
    sources: [lds-scriptures]

christ: |
  Jerusalem is “the holy city” because the temple, “the house of God” (verse 11), stood in it (see the note on [[Neh. 11:1]]). The God of that house is the God of Israel, Jehovah, and Jehovah is the premortal Jesus Christ. In Nehemiah's day the families who left their fields to live beside the house of God were blessed for their willingness (verse 2). Gathering has asked the same of Latter-day Saints: in the Church's early history members were encouraged to settle together in particular cities, and some held back, wanting to keep living on their own land. In both, what is honored is the willingness to go where the Lord's people are gathered.

