  - **The name proclaimed after the calf.** [[Ex. 34:6–7]]; [[Num. 14:17–20]].
  - **Other prayers of confession.** [[Ezra 9:5–15]]; [[Dan. 9:3–19]].
  - **The law that gives life (verse 29).** [[Lev. 18:5]]; the note at [[Ezek. 20:11]].
  - **The covenant that follows.** [[Neh. 10:28–39]]; [[Josh. 24:14–27]]; [[Mosiah 5:1–15]].

