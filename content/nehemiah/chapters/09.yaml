chapter: 9
title: A God Ready to Pardon
tagline: Two days after the feast the people fast, read the law and confess, and the Levites retell Israel's history from the Creation to their own servitude, a record of rebellion answered each time by a God who would not forsake them. It ends in a written, sealed covenant.
when: 'The twenty-fourth day of the same seventh month (verse 1).'

setting: |
  The Feast of Tabernacles had run seven days from the fifteenth of the seventh month, with a solemn assembly on the eighth ([[Neh. 8:18]]). Two days after it ended, on the twenty-fourth, the people gathered again, this time with fasting, sackcloth and earth on their heads (verse 1). They stood in their place a fourth part of the day while the law was read, and another fourth part they confessed and worshipped (verse 3). Then the Levites led a long prayer of praise and confession (verses 5–37).

  The prayer retells Israel's history from the Creation (verse 6) through Abraham, the Exodus and Sinai, the wilderness, the conquest, the judges and the kings, down to “this day” under foreign rulers (verses 32, 36). It dwells longest on the Exodus, perhaps because the people praying it had come through an Exodus of their own, the return from Babylon. In plan and in detail it is close to [[Ps. 106]], which also sets God's faithfulness against Israel's unfaithfulness.

  The last verse leads straight into the next chapter. In the Hebrew Bible, and in some translations, verse 38 is the first verse of chapter 10, and the names that follow it there are those who set their seal to the covenant it announces.

thread: |
  The prayer's argument is carried by a refrain. God “forsookest them not” after the rebellion at Kadesh (verse 17) and after the golden calf (verse 19), and even after the exile He “didst not utterly consume them, nor forsake them” (verse 31). Against that refrain stands Israel's record. The fathers “dealt proudly” (verses 16, 29), the words the prayer used first of Pharaoh's Egyptians (verse 10), and each time God's mercy outlasted the rebellion. The prayer frames the exile as judgment for disobedience, followed by mercy (verse 31), and that is the theology of Ezra–Nehemiah as a whole: God stays faithful through His people's failures. The God who punished them had not abandoned them, and would keep working with them.

  The prayer is mostly confession. It makes one request, that God not count their trouble as small (verse 32), but it asks neither for pardon nor for deliverance from the kings over them, and it ends by owning that He has been just and they have done wickedly (verse 33). Its answer is a promise of the people's own: “because of all this we make a sure covenant” (verse 38). So the chapter carries the book's second thread, a people rebuilt around the law: the law read in chapter 8 leads to confession here and to the written covenant of chapter 10.

sections:
  - range: 1-5
    heading: The fast and the call to praise
    plain: |
      On the twenty-fourth day of this month the Israelites gathered, fasting, wearing sackcloth, with earth on their heads. Those of Israelite descent separated themselves from all foreigners, and stood and confessed their sins and the wrongs of their fathers. They stood in their places while the book of the law of the LORD their God was read for a quarter of the day, and for another quarter they confessed and worshipped the LORD their God. Then Levites stood on the platform, Jeshua, Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani and Chenani, and cried aloud to the LORD their God. And the Levites Jeshua, Kadmiel, Bani, Hashabniah, Sherebiah, Hodijah, Shebaniah and Pethahiah said: Stand up and bless the LORD your God for ever and ever. Blessed be your glorious name, which is higher than all blessing and praise.
  - range: 6-15
    heading: The Creator who chose Abraham and brought Israel out
    plain: |
      You alone are the LORD. You made the heavens, the highest heavens and all their hosts, the earth and everything on it, the seas and all that is in them; you keep them all alive, and the hosts of heaven worship you. You are the LORD God who chose Abram, brought him out of Ur of the Chaldees and named him Abraham. You found his heart faithful and made a covenant with him to give the land of the Canaanites, Hittites, Amorites, Perizzites, Jebusites and Girgashites to his descendants, and you have kept your word, because you are righteous. You saw our fathers' affliction in Egypt and heard their cry at the Red Sea. You did signs and wonders against Pharaoh, his servants and all his people, because you knew how arrogantly they treated our fathers, and you made yourself a name that lasts to this day. You split the sea before them so that they walked through it on dry ground, and you threw their pursuers into the depths like a stone into mighty waters. You led them by a pillar of cloud by day and a pillar of fire by night to light the way they should go. You came down on Mount Sinai and spoke with them from heaven, and gave them just ordinances, true laws, good statutes and commandments. You made your holy Sabbath known to them and gave them commandments, statutes and laws through your servant Moses. You gave them bread from heaven when they were hungry and water from the rock when they were thirsty, and you told them to go in and take the land you had sworn to give them.
  - range: 16-25
    heading: Rebellion in the wilderness, and mercy that did not let go
    plain: |
      But they, our fathers, acted arrogantly and stiffened their necks and would not listen to your commandments. They refused to obey and forgot the wonders you had done among them; they stiffened their necks and in their rebellion chose a leader to take them back to their slavery. But you are a God of forgiveness, gracious and merciful, slow to anger and full of kindness, and you did not forsake them. Even when they made a calf of cast metal and said, This is your god who brought you up out of Egypt, and committed great provocations, you in your great mercy did not forsake them in the wilderness. The pillar of cloud did not leave them by day to lead them, nor the pillar of fire by night to light their way. You gave your good Spirit to teach them, you did not hold back your manna from their mouths, and you gave them water for their thirst. Forty years you sustained them in the wilderness and they lacked nothing; their clothes did not wear out and their feet did not swell. You gave them kingdoms and peoples and divided the land among them, and they took the land of Sihon king of Heshbon and the land of Og king of Bashan. You made their children as many as the stars of heaven and brought them into the land you had promised their fathers. The children went in and took it; you subdued the Canaanites before them and gave them into their hands, kings and peoples alike, to do with as they pleased. They captured fortified cities and rich land, and took houses full of good things, dug wells, vineyards, olive groves and fruit trees in plenty. They ate and were filled and grew fat, and delighted in your great goodness.
  - range: 26-31
    heading: In the land, the same story again
    plain: |
      Yet they disobeyed and rebelled against you. They threw your law behind their backs and killed your prophets, who warned them to turn back to you, and they committed great provocations. So you gave them into the hands of enemies who oppressed them; but when they cried to you in their trouble, you heard from heaven and in your great mercy gave them deliverers who saved them from their enemies. After they had rest they did evil again, and you left them to their enemies, who ruled over them; yet when they turned and cried to you, you heard from heaven and rescued them many times, in your mercy. You warned them, to bring them back to your law, but they acted arrogantly and would not obey your commandments; they sinned against your ordinances, by which a person who keeps them will live. They turned a stubborn shoulder, stiffened their neck and would not listen. For many years you bore with them and warned them by your Spirit through your prophets, but they would not listen, so you gave them into the hands of the peoples of the lands. Yet in your great mercy you did not make an end of them or forsake them, for you are a gracious and merciful God.
  - range: 32-38
    heading: Now therefore
    plain: |
      Now therefore, our God, the great, mighty and awesome God, who keeps covenant and steadfast love, do not count as small all the hardship that has come on us, on our kings, princes, priests and prophets, on our fathers and on all your people, from the days of the kings of Assyria until today. You have been just in all that has come upon us; you have acted faithfully, and we have done wrong. Our kings, princes, priests and fathers did not keep your law or heed your commandments and the warnings you gave them. Even in their own kingdom, with all the good you gave them and the broad, rich land you set before them, they did not serve you or turn from their evil ways. Look: today we are slaves, slaves in the very land you gave our fathers to enjoy its fruit and its good things. Its rich produce goes to the kings you have set over us because of our sins; they rule over our bodies and our livestock as they please, and we are in great distress. Because of all this we are making a firm agreement and putting it in writing, and our princes, Levites and priests are setting their seals to it.

notes:
  - ref: 1
    phrase: were assembled with fasting, and with sackclothes
    kind: history
    title: A fast after the feast
    body: |
      The fast of verse 1 was not one the law required. The Day of Atonement, on the tenth day of this same seventh month ([[Lev. 23:27]]), appears to have been the only fast the law of Moses ordered. Other fasts arose during the exile (on fasting after the return, see the note on [[Neh. 1:4]]). This fast seems to have been something like the Day of Atonement, but it comes after the Feast of Tabernacles instead of before it, two days after the joy of the feast had ended.

      On the first day of the month, when the law was first read, the people had wept and been told that a day holy to the LORD was not a day to mourn ([[Neh. 8:9]]). This day was a day for mourning, and it was more than going without food: they spent it on the law, a fourth part of the day reading, another fourth confessing and worshipping (verse 3).
    sources: [bd-fasts, ludlow-nehemiah-minute, lds-scriptures]

  - ref: 2
    phrase: the seed of Israel separated themselves from all strangers
    kind: history
    title: Separated from all strangers
    body: |
      Verse 2 does not say what the separation involved; it says only that the people did it themselves, on a day of fasting and confession. It is not told as a dissolving of marriages like the one in [[Ezra 10]]. One reading takes it as neither that nor a rule about who might attend the assembly, but a voluntary renouncing of ties with the heathen and of their customs. What they confessed, in any case, was their own: “their sins, and the iniquities of their fathers.”
    sources: [keil-nehemiah]

  - ref: 5
    phrase: Stand up and bless the LORD your God for ever and ever
    kind: history
    title: Who prayed the prayer
    body: |
      The Hebrew text names no one as the speaker of the long prayer of verses 5–37. Two groups of Levites are named in verses 4–5, with several names appearing in both lists. They lead the people in praise and confession. Their call to the people, “Stand up and bless the LORD your God,” turns in mid-sentence into the prayer itself, “blessed be thy glorious name,” and the rest is addressed to God.

      The Greek Septuagint gives the prayer a speaker. Before verse 6 it adds, “And Esdras said,” making it Ezra's. The Hebrew, which the King James Version follows, has no such words, and the chapter leaves the prayer to the Levites and the congregation.
    sources: [ludlow-nehemiah-minute, lxx-rahlfs, lds-scriptures]

  - ref: 17
    phrase: but thou art a God ready to pardon
    kind: scripture
    title: A God ready to pardon
    body: |
      The prayer recalls two great rebellions in the wilderness, the golden calf and Kadesh, and answers each with God's mercy. “Hardened their necks” recalls the Lord's word at Sinai after the golden calf, “it is a stiffnecked people” ([[Ex. 32:9]]), and verse 18 names the calf. “Appointed a captain to return to their bondage” is taken almost word for word from the rebellion at Kadesh, on the edge of the promised land, when the people heard the spies' report and said, “Let us make a captain, and let us return into Egypt” ([[Num. 14:4]]). Where the King James Version has “in their rebellion,” the Septuagint read “to return to their slavery in Egypt,” and the Hebrew word for “in their rebellion” is very probably a copyist's slip for the one meaning “in Egypt.” Either reading says the same thing: they chose a leader to take them back to bondage.

      Against both, the prayer sets God's character, “gracious and merciful, slow to anger, and of great kindness,” in words drawn from what He proclaimed of Himself at Sinai after the calf ([[Ex. 34:6]], where the note follows the same words to Kadesh). Then the prayer lists what He did not take away. The pillar of cloud and fire still led them after the calf (verse 19). He gave His “good spirit to instruct them” (verse 20), recalling the Spirit given to the seventy elders who shared Moses' burden ([[Num. 11:17]], [[Num. 11:25]]), and the phrase recalls David's prayer, “thy spirit is good; lead me” ([[Ps. 143:10]]). And for forty years they lacked nothing (verse 21).
    sources: [keil-nehemiah, lxx-rahlfs, lds-scriptures]

  - ref: 36
    phrase: Behold, we are servants this day
    kind: history
    title: Servants in their own land
    body: |
      With “now therefore” (verse 32) the prayer turns from the fathers to the people praying it and names their condition: they are servants in their own land. The land God gave their fathers so that they might eat its fruit now yields “much increase” to kings set over them, who rule their bodies and their cattle “at their pleasure” (verse 37). The return had brought the exiles home, but not to independence. Ezra had said the same in his own prayer, and named the kings: “we were bondmen; yet our God hath not forsaken us in our bondage, but hath extended mercy unto us in the sight of the kings of Persia” ([[Ezra 9:9]]).

      The prayer lays the blame on Israel, not on the kings. They rule “because of our sins” (verse 37), and God has been “just in all that is brought upon us” (verse 33). So the distress of verse 37 leads, in the next verse, not to a plea against the kings but to a covenant of the people's own (verse 38).
    sources: [ludlow-nehemiah-minute, lds-scriptures]

  - ref: 38
    phrase: we make a sure covenant, and write it
    kind: words
    title: A sure covenant, written and sealed
    body: |
      The prayer ends in a written promise with the leaders' seals on it. “Sure covenant” is one Hebrew word, *ʾămānâ*, “something fixed,” and the clause means “we are plighting faith.” The people do not ask God for anything new; they bind themselves.

      In the ancient world seals marked important occasions, treaties and religious ceremonies among them; they marked what belonged to whom, and they protected a document's contents from being altered. On what sealing meant for those who signed, see the note on [[Neh. 10:1]]. It is the seal as a mark of belonging that King Benjamin used when, after placing his own people under covenant, he prayed that “Christ, the Lord God Omnipotent, may seal you his” ([[Mosiah 5:15]]). What the people promised is in [[Neh. 10:29–39]].
    sources: [bdb, strongs-concordance, sc-knowhy-558, lds-scriptures]

christ: |
  The God this prayer praises, “ready to pardon, gracious and merciful” (verse 17), is the God who gave Israel the law and made covenant with it, and the risen Lord told the Nephites, “I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]). His mercy outlasted the calf, Kadesh and the exile. A disciple who remembers “how merciful the Lord hath been unto the children of men, from the creation of Adam” ([[Moro. 10:3]]) has the same ground for faith that, because of His covenant, He will go on doing great things for His people; in this chapter that remembering ends in a covenant made (verse 38).

