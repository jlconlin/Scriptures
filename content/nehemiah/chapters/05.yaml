chapter: 5
title: Brethren in Bondage
tagline: While the wall goes up, the poor cry out that their own brethren hold their fields and their children for debt. Nehemiah calls an assembly, makes the creditors swear to give it all back, and tells how he himself never took the governor's allowance.
when: 'During the building of the wall, 445 or 444 B.C. Verses 14–19 look back over Nehemiah''s twelve years as governor, to the thirty-second year of Artaxerxes.'

setting: |
  Chapter 4 ended with the builders working armed and sleeping in their clothes. Chapter 5 turns from the enemies outside to a crisis inside. Many who came back from exile had restarted their lives on borrowed money, and the Persian taxes, the debts, and the days given to the wall itself had left some of them cornered, borrowing against their land for food and for “the king's tribute” (verses 3–4). Nehemiah's answer comes in two parts: an assembly that ends the abuse (verses 1–13), and an account of how he himself governed (verses 14–19).

  The second part looks back over the whole twelve years of his first term as governor, from the twentieth to the thirty-second year of Artaxerxes (verse 14; on the dates, see [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers)). He returns to the king in [[Neh. 13:6]], and the length of his second term is not given. The “bondage” that was “heavy upon this people” (verse 18) is best taken as the work of building the wall.

thread: |
  The chapter carries the book's first thread, the man who prays and then works, but it turns it inward: the work that is threatened here is not the wall but the people's dealings with one another. What ties the two halves together is “the fear of God.” Nehemiah tells the creditors they “ought… to walk in the fear of our God” (verse 9), and he says he did not burden the people as the former governors had done, “because of the fear of God” (verse 15). He holds the nobles to the law that forbade taking usury from a poor brother ([[Ex. 22:25]]; [[Lev. 25:36]]), then shows that he asked nothing of them he had not done himself.

sections:
  - range: 1-5
    heading: The cry of the poor
    plain: |
      The people and their wives raised a great outcry against their fellow Jews. Some said: We have many sons and daughters; we must get grain so that we can eat and stay alive. Others said: We have mortgaged our fields, our vineyards and our houses to buy grain in the famine. Others said: We have borrowed money against our fields and vineyards to pay the king's tax. Yet we are the same flesh as our brothers, and our children are as good as theirs; and here we are, forcing our sons and daughters into slavery, and some of our daughters have already been taken. We have no power to buy them back, because other men own our fields and vineyards.
  - range: 6-13
    heading: The assembly and the oath
    plain: |
      I was very angry when I heard their outcry and these words. I thought it over, then confronted the nobles and the officials and told them: You are lending at interest, every one of you, to your own brother. And I called a great assembly about it. I said to them: We have done what we could to buy back our fellow Jews who had been sold to the nations; and now will you sell your own brothers, so that they have to be sold back to us? They were silent and had nothing to say. I went on: What you are doing is not right. Should you not walk in the fear of our God, so as not to give the nations, our enemies, cause to mock us? I too, and my brothers and my servants, have been lending them money and grain. Let us stop this lending at interest. Give back to them this very day their fields, their vineyards, their olive groves and their houses, and the hundredth, the interest you charge them on the money, the grain, the new wine and the oil. They said: We will give it back and ask nothing more from them; we will do as you say. Then I called the priests and, before them, made the lenders swear to keep this promise. I also shook out the fold of my robe and said: So may God shake out of his house and his earnings every man who does not keep this promise; so may he be shaken out and left empty. The whole assembly said Amen and praised the LORD, and the people did as they had promised.
  - range: 14-19
    heading: The governor's own example
    plain: |
      Moreover, from the time I was appointed their governor in the land of Judah, from the twentieth to the thirty-second year of King Artaxerxes, twelve years, neither I nor my brothers ate the governor's food allowance. The governors before me had laid heavy burdens on the people and taken food and wine from them, besides forty shekels of silver; even their servants lorded it over the people. I did not, because I feared God. I also kept at the work on this wall, and we bought no land, and all my servants were gathered there for the work. A hundred and fifty Jews and officials ate at my table, besides those who came to us from the nations around. Every day one ox, six choice sheep and fowl were prepared for me, and every ten days a great store of all kinds of wine; yet for all that I did not demand the governor's allowance, because the burden on this people was heavy. Remember me for good, my God, for all I have done for this people.

notes:
  - ref: 5
    phrase: our flesh is as the flesh of our brethren
    kind: history
    title: The same flesh as their brethren
    body: |
      The poor are pleading that they are no less Israelites than the men who hold their land, and their children no less than the lenders' children. The cry of verse 1 is raised “against their brethren the Jews,” and verse 7 shows who those brethren are, the nobles and rulers. The complainants fall into three groups, each introduced by “there were that said”: families with many children who need grain to live (verse 2), owners who have mortgaged fields and houses to buy grain in the famine (verse 3), and owners who have borrowed against their land to pay the Persian tax (verse 4).

      In verse 5 the debts reach the children. The poor had to put their sons and daughters into service for money, and some daughters were already bondmaids; with their fields and vineyards in other hands, they had no means to buy them back. The law of Moses allowed a poor Israelite to sell himself into service, but it made him a hired servant, not a slave, and sent him home “both he and his children with him” at the jubilee ([[Lev. 25:39–41]]; see the note on [[Lev. 25:39]]). Here it is the children who are going into bondage, held by their own brethren with no way out, and that is the complaint: brethren were treating brethren as the law forbids.
    sources: [lds-scriptures]

  - ref: 7
    phrase: Ye exact usury, every one of his brother
    kind: words
    title: Lending to a brother
    body: |
      Nehemiah's charge is that the nobles were lending to their own brethren on terms the law forbade. The Hebrew verb is *nashah*, “to lend, become a creditor,” and its noun *mashsha* means “lending on interest, or usury.” The same noun is in verse 10, where Nehemiah says that he, his brethren and his servants had been lending too, and proposes, “let us leave off this usury.” He includes himself in the remedy. The law he holds them to is plain: “If thou lend money to any of my people that is poor by thee, thou shalt not be to him as an usurer, neither shalt thou lay upon him usury” ([[Ex. 22:25]]). In verse 11 he asks for the land back and for “the hundredth part” they had been exacting as well.

      “Usury” in the King James Bible does not always mean an extortionate rate. It often means simply charging interest on a loan, and at other times an unduly high rate; the text does not say which the nobles were charging, only that they charged it to poor brethren. The law's restriction seems to concern lending to a fellow member of the covenant people, and latter-day revelation places no restriction on interest. The chapter is about what covenant brethren owe one another in hard times, not a rule for modern finance.
    sources: [bdb, bd-usury, lds-scriptures]

  - ref: 13
    phrase: I shook my lap
    kind: symbol
    title: The shaken lap
    body: |
      The shaken lap acts out the curse on anyone who breaks the oath the nobles have just sworn. The “lap” is the fold of the robe in which things were carried; Nehemiah gathered it up as if it held something and then shook it empty, and his words said what the act meant: so may God shake out of house and earnings every man who breaks this promise, “even thus be he shaken out, and emptied.”

      The oath was sworn before the priests (verse 12), and the assembly answered “Amen,” which was the proper response of one to whom an oath was administered. The chapter then reports: “the people did according to this promise.”
    sources: [keil-nehemiah, bd-amen]

  - ref: 14
    phrase: I and my brethren have not eaten the bread of the governor
    kind: scripture
    title: The governor who paid his own way
    body: |
      “The bread of the governor” was the food and wine the people had to furnish their governor (verse 15), and Nehemiah never took it in twelve years. Earlier governors had been “chargeable unto the people,” laying heavy burdens on them, and their servants had lorded it over them (verse 15). Nehemiah fed a hundred and fifty at his table, and guests from abroad besides, without drawing on the people (verses 17–18), because the work on the wall already weighed on the people. He tells it here, after the assembly, as part of the same appeal: he asked the nobles not to enrich themselves at the poor's expense, and he could point to his own example.

      King Benjamin likewise told his people, “I, myself, have labored with mine own hands that I might serve you, and that ye should not be laden with taxes” ([[Mosiah 2:14]]). The righteous kings of the Book of Mormon showed the same sense of public morality and “worked for their livelihood rather than burdening their people” (see also [[Mosiah 29:40]]).
    sources: [ludlow-nehemiah-minute, ot-manual-32, lds-scriptures]

  - ref: 19
    phrase: Think upon me, my God, for good
    kind: scripture
    title: Think upon me, my God, for good
    body: |
      Nehemiah closes his account of himself by speaking to God, not to the reader. Having set out what he gave up as governor, he asks God to remember it. He prays in the same way again at the end of the book: “Remember me, O my God, concerning this” ([[Neh. 13:14]]); “spare me according to the greatness of thy mercy” ([[Neh. 13:22]]); and its last words, “Remember me, O my God, for good” ([[Neh. 13:31]]). Asking God for help and for remembrance is one of the book's major themes.
    sources: [ludlow-nehemiah-minute, lds-scriptures]

christ: |
  Nehemiah's reform was an effort to make Jerusalem the kind of community the Lord calls Zion, which had “no poor among them” ([[Moses 7:18]]). The law he enforced forbade growing rich on a poor brother's need, “that thy brother may live with thee” ([[Lev. 25:36]]). His refusal of the governor's bread is cross-referenced to King Benjamin, who labored “that ye should not be laden with taxes” ([[Mosiah 2:14]]), and Benjamin's labor “to serve you” ([[Mosiah 2:18]]) is cross-referenced to the Lord's own rule for those who lead: “he that is chief, as he that doth serve” ([[Luke 22:26]]). The Lord gave Himself as the pattern: “I am among you as he that serveth” ([[Luke 22:27]]). Benjamin's lesson that serving one's fellow beings is serving God ([[Mosiah 2:17]]) is cross-referenced to the Savior's words that what is done “unto one of the least of these my brethren” is done “unto me” ([[Matt. 25:40]]), and to the latter-day law, in which substance imparted to the poor and laid before the bishop is given to Him ([[D&C 42:31]]). What is done to relieve a brother or sister in need, as Nehemiah relieved his people, is done to Christ, and one who has authority over others is, after His pattern, to serve them and not burden them.

