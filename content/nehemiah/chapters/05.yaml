chapter: 5
title: Will Ye Even Sell Your Brethren?
tagline: While the wall goes up, the poor cry out against their own brethren. Nehemiah calls an assembly, makes the creditors swear to give back what they hold, and tells how for twelve years he never took the governor's bread.
when: 'During the building of the wall, 445 or 444 B.C. Verses 14–19 look back over Nehemiah’s twelve years as governor, to the thirty-second year of Artaxerxes.'

setting: |
  Chapter 4 left the builders on the wall with a weapon in one hand. Chapter 5 turns from the enemies outside to a crisis inside, and it too happened while the wall was going up. Many of the returned exiles had restarted their lives on loans and help from others; Persian taxes, the time given to the rebuilding, and debts still owing left the poorer families in a tight corner. Their outcry is not against Sanballat but against “their brethren the Jews” (verse 1): the nobles and rulers who now held their fields, and their children, for what they owed.

  Verses 1–13 tell how Nehemiah dealt with it in a single assembly. Verses 14–19 then step back over his whole term as governor, from the twentieth to the thirty-second year of Artaxerxes, about 445 to 433 B.C., the office Zerubbabel had held before him; the episode gave him occasion to tell how he had filled it. The kings and dates are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  The chapter's word is “brethren.” The poor cry out against “their brethren the Jews” (verse 1) and protest that “our flesh is as the flesh of our brethren” (verse 5); Nehemiah charges the nobles, “Ye exact usury, every one of his brother” (verse 7), and sets those who redeemed their brethren beside those who sell them: “We … have redeemed our brethren the Jews… and will ye even sell your brethren?” (verse 8). The exiles who had been brought out of bondage were being sold back into it by their own people. Nehemiah's remedy is to restore the community as brothers, and he begins with himself: he and his brethren have been lending too, and he asks “let us leave off this usury” (verse 10).

  The second half carries the same thread across twelve years. As he had used his standing to end the creditors' grip, so he had refused the governor's allowance for his whole term, because the people were already heavily burdened (verses 14–18). Of the book's two threads, this chapter carries the first, the man who prays and works: it ends with the work handed to God, “Think upon me, my God, for good” (verse 19).

sections:
  - range: 1-5
    heading: The cry of the poor
    plain: |
      Then the people, men and their wives alike, raised a great outcry against their fellow Jews. Some said, “We have many sons and daughters; we need grain so that we can eat and stay alive.” Others said, “We have mortgaged our fields, our vineyards, and our houses to buy grain in the famine.” Others said, “We have borrowed money against our fields and vineyards to pay the king's tax. We are the same flesh and blood as our brothers, and our children are as good as theirs. Yet we are forcing our sons and daughters into servitude, and some of our daughters are already servants. We can do nothing to buy them back, because other men now hold our fields and vineyards.”
  - range: 6-13
    heading: The assembly and the oath
    plain: |
      I was very angry when I heard their outcry and what they said. I thought it over, and then I confronted the nobles and the officials: “You are lending at interest, each of you to his own brother.” I called a great assembly to deal with them, and I said, “As far as we could, we have bought back our fellow Jews who had been sold to foreigners. And now you are selling your own brothers, only for them to be sold back to us!” They were silent and found nothing to say. I went on: “What you are doing is wrong. You ought to live in the fear of our God, and not give our enemies among the nations cause to mock us. I too, and my brothers and my servants, are lending them money and grain. Let us stop this lending at interest. Give back to them this very day their fields, their vineyards, their olive groves, and their houses, and give back the hundredth part of the money, grain, wine, and oil that you are exacting from them.” They answered, “We will give it back and ask nothing more of them; we will do as you say.” Then I called the priests and made the creditors swear to keep this promise. I shook out the fold of my robe and said, “So may God shake out of his house and out of all he has worked for every man who does not keep this promise. So may he be shaken out and left empty.” The whole assembly said “Amen” and praised the LORD, and the people did as they had promised.
  - range: 14-19
    heading: The governor who took no allowance
    plain: |
      More than that: for the twelve years from the twentieth year of King Artaxerxes, when I was appointed governor of the land of Judah, to his thirty-second year, neither I nor my relatives ate the governor's food allowance. The governors before me had laid heavy burdens on the people, taking food and wine from them besides forty shekels of silver, and even their servants lorded it over the people. I did not do so, because I feared God. I kept at the work on this wall, we bought no land, and all my servants were gathered there for the work. A hundred and fifty Jews and officials ate at my table, besides those who came to us from the nations around us. Every day one ox, six choice sheep, and birds were prepared at my expense, and every ten days a supply of every kind of wine. Even so I did not claim the governor's allowance, because the labor weighed heavily on this people. Remember me for good, my God, for all that I have done for this people.

notes:
  - ref: 5
    phrase: we bring into bondage our sons and our daughters to be servants
    kind: history
    title: Children given in pledge for their parents’ debts
    body: |
      Verses 2–5 trace how free Israelites came to hand over their own children, and the road runs through debt. Some families needed grain for their many sons and daughters to eat (verse 2). Others had mortgaged fields, vineyards and houses to buy grain in a famine (verse 3). Others had borrowed against their land to pay the Persian king's tax (verse 4). Once the land was gone (“other men have our lands and vineyards”), what remained to give was the family's labor: sons and daughters taken as servants, some daughters gone already, and no means to buy them back (verse 5).

      The bitterest line is “our flesh is as the flesh of our brethren, our children as their children.” The creditors were not foreigners but fellow Jews, and the law had already said what such a brother was owed (see the note on verse 8). Debt slavery itself is explained at [[Isa. 50:1]].
    sources: [lds-scriptures]

  - ref: 7
    phrase: Ye exact usury, every one of his brother
    kind: words
    title: Lending at interest to a poor brother
    body: |
      “Usury” in the King James Bible does not have to mean an extortionate rate: in biblical English it often means simply charging interest on a loan, though at times it implies an unduly high rate. The law of Moses forbade it, and the restriction seems to have applied to lending to a fellow member of the covenant people. The Hebrew of verse 7 says literally that they lend a loan, every one to his brother. Since Nehemiah admits in verse 10 that he lent too, the rebuke cannot be of lending as such; the emphasis the sentence puts on the word for “loan” gives it the sense of lending as a business, for gain, and that is the lender the law has in mind: “If thou lend money to any of my people that is poor by thee, thou shalt not be to him as an usurer, neither shalt thou lay upon him usury” ([[Ex. 22:25]]; compare [[Lev. 25:36]]).

      Verse 10 shows how Nehemiah pressed the point. The King James “might exact” makes it a hypothesis, but the Hebrew is the same participle as verse 7: he, his brothers and his servants *were* lending, “I and my brothers and my servants are lending them money and grain. Let us abandon this exacting of interest.” Nehemiah could hardly condemn the nobles for lending when he did it too; what he asks of every lender, himself included, is to give back that day the fields, vineyards, olive groves and houses held in pledge, and to stop collecting “the hundredth part” (verse 11). What that was is not certain: the footnote gives “the hundred pieces of silver” as another rendering. Read as interest, it was probably one percent a month, like the Roman *centesima*, a heavy rate that for the poor might be exorbitant. The creditors answered, “We will restore them, and will require nothing of them” (verse 12).

      The chapter is about lending to a poor brother under the law of Moses, not about interest as such; latter-day revelation contains no restriction against interest charges.
    sources: [bd-usury, keil-nehemiah, oshb-wlc, esv, lds-scriptures]

  - ref: 8
    phrase: and will ye even sell your brethren?
    kind: history
    title: Redeemed by their brethren, sold by their brethren
    body: |
      Nehemiah's charge in verse 8 sets those who redeemed their brethren beside those who sold them. Jews in exile, Nehemiah among them, had been buying back fellow Jews sold to foreigners, as far as their means allowed; the creditors in Jerusalem were selling their brothers into bondage, so that the redeemers would have to buy them back again. What some had sacrificed to bring out of bondage, others were undoing at home. The law let a poor Israelite sell his own service, and his children's, to raise money, but a brother so bought was not to be compelled “to serve as a bondservant: But as an hired servant,” and at the jubilee he went home, “both he and his children with him” ([[Lev. 25:39–41]]). Selling him as a slave the law forbade outright, giving the Lord's own claim as the reason: “For they are my servants, which I brought forth out of the land of Egypt: they shall not be sold as bondmen” ([[Lev. 25:42]]). The nobles “held their peace, and found nothing to answer.”

      Verse 9 adds a second argument: “the reproach of the heathen our enemies.” The neighbors were already mocking the wall ([[Neh. 4:1–3]]); a people that treated its own poor harshly would hand them better material for slander.
    sources: [keil-nehemiah, ludlow-nehemiah-minute, nrsvue, lds-scriptures]

  - ref: 13
    phrase: Also I shook my lap
    kind: symbol
    title: Shaking out the fold of the garment
    body: |
      Nehemiah sealed the creditors' oath with a curse acted out. The “lap” is the fold of the garment, and shaking it out was something like turning out one's pockets. As elsewhere in the Old Testament, a physical sign showed what would happen to anyone who broke the oath, and Nehemiah's words spell it out: may God shake that man out of his house and out of all he has worked for, and leave him “shaken out, and emptied.”

      Nehemiah had called the priests and put the creditors under oath (verse 12); the whole congregation answered “Amen,” and praised the LORD. The chapter's last word on the matter is that the promise was kept: “the people did according to this promise.”
    sources: [ludlow-nehemiah-minute, esv]

  - ref: 14
    phrase: I and my brethren have not eaten the bread of the governor
    kind: scripture
    title: A governor who would not be a burden
    body: |
      “The bread of the governor” was the governor's food allowance, which his predecessors had taken from the people; the note at [[Mal. 1:8]] says more about it. The governors before Nehemiah had laid heavy burdens on the people, and even their servants lorded it over them (verse 15). Nehemiah gives two reasons for doing otherwise for all twelve years: “the fear of God” (verse 15), and, at the end, that “the bondage was heavy upon this people” (verse 18). That last “bondage” is not the debt slavery of verse 5. The Hebrew is *ʿăbōdâ*, “service” or “labor,” and modern translations read “because of the heavy burden of labor on the people.” Meanwhile he worked on the wall himself, bought no land, and fed a hundred and fifty Jews and officials, with visitors from the nations around, at his own cost (verses 16–18). He was evidently a man of means who chose to serve without pay.

      King Benjamin made the same choice: “I, myself, have labored with mine own hands that I might serve you, and that ye should not be laden with taxes” ([[Mosiah 2:14]]). The righteous kings of the Book of Mormon held the same standard of public conduct and worked for their living rather than burden their people (see also [[Mosiah 29:40]]).
    sources: [esv, nrsvue, oshb-wlc, ot-manual-32, ludlow-nehemiah-minute, lds-scriptures]

  - ref: 19
    phrase: Think upon me, my God, for good
    kind: words
    title: The first prayer to be remembered
    body: |
      “Think upon me” is the Hebrew *zokrâ-lî*, “remember me,” the same imperative that the King James translates “Remember me, O my God” at [[Neh. 13:14]], [[Neh. 13:22]] and [[Neh. 13:31]]; modern translations make this verse “Remember for my good, O my God, all that I have done for this people.” So this is the first of a refrain that closes the book, and asking God for help and for remembrance is one of the book's major themes.

      Its place in the chapter matters. Nehemiah has just set out his record as governor, and the last verse turns that account away from the reader and toward God, asking Him to remember what was done “for this people.” The twelve years are offered as a record for God to keep.
    sources: [oshb-wlc, esv, ludlow-nehemiah-minute]

christ: |
  The law Nehemiah enforced was the word of Jehovah, the premortal Jesus Christ, and it rested on what He had done: the Israelites were His servants because He had brought them out of Egypt, so they were not to be sold as bondmen ([[Lev. 25:42]], quoted in the note on verse 8). A people the Lord had redeemed could not be sold by their own brethren.

  This community was struggling with what Zion does away with: the Lord called Enoch's people Zion because they were of one heart and one mind and dwelt in righteousness, “and there was no poor among them” ([[Moses 7:18]]). Those the Lord has redeemed are His servants, and a people seeking to be Zion is measured by the same standard as Enoch's: one heart, and no poor among them.

explore: |
  - **The law behind the assembly.** [[Ex. 22:25]]; [[Lev. 25:35–42]]; [[Deut. 15:7–8]]; [[Deut. 23:19–20]].
  - **The covenant comes back to it.** [[Neh. 10:31]], where the people promise to “leave the seventh year, and the exaction of every debt.”
  - **Rulers who would not burden their people.** [[Mosiah 2:12–19]]; [[Mosiah 29:40]].
  - **The refrain.** [[Neh. 13:14]], [[Neh. 13:22]], [[Neh. 13:31]].

