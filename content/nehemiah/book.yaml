description: A phrase-by-phrase companion to the book of Nehemiah, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: The king’s cupbearer rebuilds the wall of Jerusalem in fifty-two days; then the people hear the law read, confess, and bind themselves by covenant; then the city is filled, the wall dedicated, and the covenant tested.
