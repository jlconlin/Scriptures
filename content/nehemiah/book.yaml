  blurb: The cupbearer who wept over Jerusalem’s broken wall, rebuilt it with a tool in one hand and a weapon in the other, and stood by while Ezra read the law to a people who learned that “the joy of the LORD is your strength.”

intro: |
  The book of Nehemiah opens in the Persian palace at Shushan, “in the twentieth year” of King Artaxerxes ([[Neh. 1:1]]; [[Neh. 2:1]]), some thirteen years after Ezra came to Jerusalem. Nehemiah, “the king’s cupbearer” ([[Neh. 1:11]]), hears that “the wall of Jerusalem also is broken down, and the gates thereof are burned with fire” ([[Neh. 1:3]]), and he sits down and weeps, fasts, and prays. The king sends him to Judah as governor, and he tells the people, “come, and let us build up the wall of Jerusalem, that we be no more a reproach” ([[Neh. 2:17]]). They build with their enemies mocking and plotting, “every one with one of his hands wrought in the work, and with the other hand held a weapon” ([[Neh. 4:17]]), and when those enemies invite Nehemiah to a meeting he answers, “I am doing a great work, so that I cannot come down” ([[Neh. 6:3]]). The wall is finished “in fifty and two days” ([[Neh. 6:15]]).

  Then the book turns from the wall to the people inside it. Ezra reads the law from a pulpit of wood, and the Levites “gave the sense, and caused them to understand the reading” ([[Neh. 8:8]]); the people weep, and are told, “neither be ye sorry; for the joy of the LORD is your strength” ([[Neh. 8:10]]). They keep the Feast of Tabernacles, confess the whole history of Israel before a God “ready to pardon, gracious and merciful, slow to anger, and of great kindness” ([[Neh. 9:17]]), and “make a sure covenant, and write it” ([[Neh. 9:38]]). The last chapters fill the city, dedicate the wall so that “the joy of Jerusalem was heard even afar off” ([[Neh. 12:43]]), and then show Nehemiah, back from the king, finding the covenant already broken and setting it right again. Most of the book is told in his own voice, and it ends on his own prayer: “Remember me, O my God, for good” ([[Neh. 13:31]]). This companion goes through all thirteen chapters and tries to anticipate the questions a careful reader would ask.

  For the Persian kings, the return and the rebuilding of Jerusalem, see [A Timeline of the Old Testament](/old-testament/guides/israels-story/#return) and [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

# BRIEF.md, “Divisions”. Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: nehwall
    range: [1, 7]
    name: The Wall Rebuilt
    blurb: Nehemiah weeps and prays in Shushan, comes to Jerusalem with the king’s letters, and sets every family to build its part of the wall. He answers mockery, threats and plots with prayer and a guard, stops the nobles from taking usury of their brethren, finishes the wall in fifty-two days, and finds the register of those who first came back.
    color: '#7a5c3a'
    darkColor: '#d9b98f'
  - key: nehlaw
    range: [8, 10]
    name: The Law Read and the Covenant Made
    blurb: Ezra reads the law to all who can understand, and the people weep, rejoice, and keep the Feast of Tabernacles. They confess their fathers’ sins and God’s mercies from the Creation on, and seal a written covenant to keep the law, the Sabbath and the house of God.
    color: '#2e6a8a'
    darkColor: '#8fc6e3'
  - key: nehcity
    range: [11, 13]
    name: The City Filled and the Covenant Kept
    blurb: A tenth of the people come to live in Jerusalem, and the wall is dedicated with two companies singing along its top. Nehemiah returns from the king to find Tobiah lodged in the temple, the Levites unpaid, the Sabbath sold and the marriages mixed again, and he sets each right.
    color: '#6b4a7a'
    darkColor: '#c9a8dc'

