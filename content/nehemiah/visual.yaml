summary: >-
  Nehemiah is the book of a wall rebuilt by a people who prayed and then worked: the gates burned and the
  stones broken, then families building stretch after stretch, a tool in one hand and a weapon in the other,
  until it was finished in fifty-two days and even the enemies saw that "this work was wrought of our God."
  Once the wall stands, the people gather inside it to hear the law and keep the Feast of Tabernacles, and
  are told that "the joy of the LORD is your strength." The image holds one idea a reader can see without
  being told: a burned, broken wall being built up again, with the builder's trowel and the watchman's sword
  set down together on the new stone.
motifs:
  - "A city wall half rebuilt (Nehemiah 1:3; 2:17): the wall crosses the picture and is plainly in two states. On the left it is a ruin: a low, ragged stretch of blackened, soot-stained stones, a few large fallen blocks on the ground at its foot, and charred, split gate timbers leaning against it. On the right the same wall rises again in clean, pale, newly cut squared stone. Between them the new work climbs from the ground in four broad steps, each course set back from the one below by the same depth, each with a lit flat top and a shaded end, so the eye sees at once that the wall is being built and is not yet finished."
  - "A mason's trowel and a short sword (Nehemiah 4:17-18): large, in the foreground at the center, on the lowest step of the new stonework. They are two separate objects that do not touch. The trowel lies flat on the stone beside a small patch of wet grey mortar: a leaf-shaped iron blade and a short plain wooden handle. The sword stands on the same step and leans against the riser of the next: a short, straight, bronze-hilted sword in a plain leather scabbard, its hilt at the top. Nobody holds them."
  - "A booth of leafy branches on a rooftop (Nehemiah 8:15-16): small, at the upper right, one plain flat-roofed stone house shows above the top of the new wall, and on its roof stands a little open shelter of fresh green palm and olive branches on wooden poles. Simple and empty."
composition: >-
  A wide landscape seen from just outside the wall, at a level viewpoint, in early morning. The sun is low
  at the right, outside the picture, so the new pale stone is brightly lit and every shadow falls to the
  left, toward the ruin, which stays in cooler shade. The blackened ruin, its fallen blocks and the charred
  timbers fill the left third; the new wall's four steps rise from the center to the upper right. The trowel
  and sword on the lowest step are the focal point and the largest objects after the wall itself. Above the
  top step at the right, one rooftop with its small green booth catches the light. Beyond the low ruin,
  soft bare hills of olive and clay fall away to a pale horizon under a deep indigo-to-cream sky. The ground
  in front is level, bare earth. No people, no scaffolding, no smoke, no flames, no armies, no city skyline
  beyond the one rooftop, no animals, and nothing lettered.
asset: /assets/nehemiah-book-art.jpg
alt: A city wall half rebuilt in early morning light, a blackened ruin with fallen blocks and charred gate timbers on the left and new pale stone rising in four broad steps on the right, with a mason's trowel lying beside wet mortar and a short sword leaning next to it on the lowest step, and a small booth of green branches on a rooftop behind the new wall.
key:
  - '**The blackened wall and the fallen blocks** on the left are Jerusalem as Nehemiah heard of it in Persia: “the wall of Jerusalem also is broken down, and the gates thereof are burned with fire” ([[Neh. 1:3]]). He sat down and wept, and then he prayed.'
  - '**The charred timbers** leaning on the ruin are what was left of the gates, which he found “consumed with fire” when he rode out by night to look ([[Neh. 2:13]]).'
  - '**The new pale stone, rising in steps,** is the wall going up, not yet done. Nehemiah told the people, “come, and let us build up the wall of Jerusalem, that we be no more a reproach,” and they answered, “Let us rise up and build” ([[Neh. 2:17–18]]). It was finished “in fifty and two days” ([[Neh. 6:15]]).'
  - '**The trowel and the sword,** side by side on the newest stone, are how it was built while enemies threatened: “every one with one of his hands wrought in the work, and with the other hand held a weapon” ([[Neh. 4:17]]). The people prayed, worked and kept watch at once: “we made our prayer unto our God, and set a watch against them day and night” ([[Neh. 4:9]]).'
  - '**The booth of green branches on the rooftop** is from the Feast of Tabernacles, kept after Ezra read the law inside the finished wall. The people “made themselves booths, every one upon the roof of his house” ([[Neh. 8:16]]), “and there was very great gladness” ([[Neh. 8:17]]). With the wall standing, the people gathered inside it to hear the law and keep the feast.'
status: approved
