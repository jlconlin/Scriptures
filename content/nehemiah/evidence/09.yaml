chapter: 9
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'The assembly met on the twenty-fourth day of the seventh month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'Now in the twenty and fourth day of this month the children of Israel were assembled with fasting, and with sackclothes, and earth upon them.'
  - where: 'setting'
    claim: 'The fast came two days after the end of the Feast of Tabernacles'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: 'On the twenty-fourth day of the month, i.e., two days after the termination of the feast of tabernacles, the children of Israel re-assembled in the temple to humble themselves before God with mourning and fasting'
  - where: 'setting'
    claim: 'The prayer reviews Abraham, the Exodus, the law, the conquest and the monarchy; the weight on the Exodus may reflect their own Exodus-like return'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The heavier emphasis on the Exodus not only highlights its importance to ancient Israelites but also may be indicative of their own experience of an Exodus-like return from Babylon.'
  - where: 'setting'
    claim: 'The prayer resembles Psalm 106, a confession of God''s faithfulness and Israel''s unfaithfulness, in plan and detail'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: 'This confession of sin much resembles the confession of the faithfulness of God and the unfaithfulness of Israel in the Psalm 106:1, both in its plan and details'
  - where: 'setting'
    claim: 'In some Bibles verse 38 begins chapter 10'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Some Bible versions start the tenth chapter of Nehemiah with what is 9:38 in the King James Version, which is an introduction to a covenant-making ceremony.'
  - where: 'setting'
    claim: 'In the Hebrew Bible verse 38 is numbered 10:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/548.htm'
    quote: '1 אֲנַחְנוּ כֹּרְתִים אֲמָנָה we are plighting faith (make a sure covenant AV RV) Nehemiah 10:1.'
  - where: 'thread'
    claim: 'The prayer frames the exile as judgment for disobedience followed by mercy; Ezra–Nehemiah has a theology of God''s faithfulness despite human failure'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The fullest version of this view is the Levites'' long historical prayer in Nehemiah 9, which rehearses the entire sweep of Israelite history and frames the exile as divine judgment for disobedience, followed by divine mercy (see Neh 9:31).'
  - where: 'thread'
    claim: 'Woven through the prayer: though punished, Israel was not abandoned by God, who will keep working with them'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Woven throughout these passages is the covenant notion that though Israel has sometimes been punished, God has not abandoned them and will continue working with them.'
  - where: 'thread'
    claim: '"Dealt proudly" in verse 16 is the same word as in verse 10'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: 'Words are accumulated to describe the stiff-necked resistance of the people. הזידוּ as above, Nehemiah 9:10.'
  - where: 'thread'
    claim: 'The prayer stops at confessing God righteous, without an explicit request for pardon or deliverance'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: 'it does not rise to the praise of God, to the hallelujah, but stops at the confession that God is righteous and true in all that He has done, and that Israel has done wickedly, without definitely uttering a request for pardon and deliverance from oppression.'
  - where: 'thread'
    claim: 'The prayer''s history falls into a theme (6–8) and four parts (9–15, 16–25, 26–31, 32–37), which the sections follow'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: 'These verses form the theme of that blessing the name of His glory, to which the Levites exhorted. This theme is then elucidated by facts from Israel''s history, in four strophes.'

  # ---- notes ----
  - where: 'note 9:1 “A fast after the feast”'
    claim: 'The Day of Atonement was the only fast ordered by the law; other fasts arose in and after the exile; fasting showed sorrow, often with sackcloth'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law. Other fasts were instituted during the exile … It was regarded as a natural way of showing sorrow. Along with the fasting were often combined other ceremonies, such as rending of the garments, putting on sackcloth'
  - where: 'note 9:1 “A fast after the feast”'
    claim: 'The fast resembles the Day of Atonement but comes after Tabernacles, not before'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This fast seems to be similar to the observance of Yom Kippur; however, in this case it comes after the Feast of Tabernacles and not before. … True fasting goes beyond simply abstaining from food but should include prayer, scripture study, and communing with the Lord.'
  - where: 'note 9:1 “A fast after the feast”'
    claim: 'The Day of Atonement fell on the tenth day of the seventh month; the feast ran seven days with a solemn assembly on the eighth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'Also on the tenth day of this seventh month there shall be a day of atonement'
  - where: 'note 9:2 “Separated from all strangers”'
    claim: 'The separation was not the dissolving of the marriages nor a rule of admission, but a voluntary renunciation of heathen connections and customs'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: 'This separation from strangers does not specially relate to the dissolution of the marriages contracted with heathen women, nor to any measures taken that only Israelites should be admitted to this assembly (Bertheau). It was rather a voluntary renunciation of connection with the heathen, and of heathen customs.'
  - where: 'note 9:5 “Who prayed the prayer”'
    claim: 'Levites led the praise and confession; the Greek version says Ezra said the prayer, the Hebrew names no one'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'A list is given of Levites who led a communal praise of God and confession of the community’s sins. (According to the ancient Greek version of the Old Testament, Ezra said this prayer, but in the Hebrew version no identification is made.)'
  - where: 'note 9:5 “Who prayed the prayer”'
    claim: 'The Septuagint opens verse 6 with "And Esdras said"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/nehemiah/9.htm'
    quote: '6And Esdras said, Thou art the only true Lord; thou madest the heaven, and the heaven of heavens'
  - where: 'note 9:5 “Who prayed the prayer”'
    claim: 'Verse 5: the Levites call the people to stand and bless; the words turn to address God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'Stand up and bless the LORD your God for ever and ever: and blessed be thy glorious name, which is exalted above all blessing and praise.'
  - where: 'note 9:17 “A God ready to pardon”'
    claim: '"Hardened their necks" recalls the calf (Ex. 32:9); verse 17 has Kadesh in view, its clause taken almost verbally from Num. 14:4'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: '"They hardened their necks" refers to Exodus 32:9; Exodus 33:3; Exodus 34:9 … while in Nehemiah 9:17, the second great rebellion of the people at Kadesh, on the borders of the promised land, Numbers 14, is contemplated.'
  - where: 'note 9:17 “A God ready to pardon”'
    claim: 'The Hebrew "in their rebellion" is probably a copyist''s error for "in Egypt," as the Septuagint read; "a God of pardons"; the attributes recall Ex. 34:6'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: 'The comparison with Numbers 14:4 also shows that בּמרים is a clerical error for בּמצרים, as the lxx read … סליחות אלוהּ, a God of pardons; comp. Daniel 9:9; Psalm 130:4. וגו ורחוּם חנּוּן is a reminiscence of Exodus 34:6.'
  - where: 'note 9:17 “A God ready to pardon”'
    claim: 'The Septuagint reads "to return to their slavery in Egypt"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/nehemiah/9.htm'
    quote: 'and they hardened their neck, and appointed a leader to return to their slavery in Egypt: but thou, O God, art merciful and compassionate, long-suffering, and abundant in mercy'
  - where: 'note 9:17 “A God ready to pardon”'
    claim: 'The pillar after the calf (Num. 14:14) and the good spirit given to the seventy elders (Num. 11:17, 25), recalling Ps. 143:10'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/9.htm'
    quote: 'The words, Nehemiah 9:20, "Thou gavest Thy good Spirit," etc., refer to the occurrence, Numbers 11:17, Numbers 11:25, where God endowed the seventy elders with the spirit of prophecy for the confirmation of Moses'' authority. The definition "good Spirit" recalls Psalm 143:10.'
  - where: 'note 9:17 “A God ready to pardon”'
    claim: 'Num. 14:4, the people at Kadesh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'And they said one to another, Let us make a captain, and let us return into Egypt.'
  - where: 'note 9:36 “Servants in their own land”'
    claim: '"Now therefore" in verse 32 shifts to the people''s own day'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Verse 32, with the phrase “now therefore,” shifts the focus to Nehemiah’s day and the people’s current situation.'
  - where: 'note 9:36 “Servants in their own land”'
    claim: 'Ezra 9:9: bondmen in the sight of the kings of Persia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'For we were bondmen; yet our God hath not forsaken us in our bondage, but hath extended mercy unto us in the sight of the kings of Persia'
  - where: 'note 9:38 “A sure covenant, written and sealed”'
    claim: 'BDB renders the clause "we are plighting faith"'
    key: bdb
    url: 'https://biblehub.com/hebrew/548.htm'
    quote: '1 אֲנַחְנוּ כֹּרְתִים אֲמָנָה we are plighting faith (make a sure covenant AV RV) Nehemiah 10:1.'
  - where: 'note 9:38 “A sure covenant, written and sealed”'
    claim: 'Amanah is the feminine of amen, "something fixed"'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/548.htm'
    quote: 'Feminine of ''amen; something fixed, i.e. A covenant. An allowance -- certain portion, sure.'
  - where: 'note 9:38 “A sure covenant, written and sealed”'
    claim: 'Seals commemorated treaties and religious ceremonies; Nehemiah 9:38 is a public sealing of a covenant; the KnoWhy sets it beside Benjamin''s "seal you his"'
    key: sc-knowhy-558
    url: 'https://scripturecentral.org/knowhy/how-does-christ-seal-you-his'
    quote: 'In the ancient biblical world, “Seals commemorated important political events such as marriage, treaties, and public celebrations … [and] also were utilized in religious ceremonies.” … In a public ceremony, Nehemiah and other religious and political leaders sealed a covenant of loyalty to the Lord and his laws (Nehemiah 9:38).'
  - where: 'note 9:38 “A sure covenant, written and sealed”'
    claim: 'Seals marked ownership and protected a document''s contents from tampering'
    key: sc-knowhy-558
    url: 'https://scripturecentral.org/knowhy/how-does-christ-seal-you-his'
    quote: 'Sealing documents was also meant to ensure their authenticity and integrity. … Seals protected the contents of a document or container from tampering.'
  - where: 'note 9:38 “A sure covenant, written and sealed”'
    claim: 'Mosiah 5:15, Benjamin''s prayer that Christ may seal his people his'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'that Christ, the Lord God Omnipotent, may seal you his, that you may be brought to heaven'

  # ---- christ ----
  - where: 'christ'
    claim: 'The risen Lord says He gave the law and covenanted with Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel'
  - where: 'christ'
    claim: 'Remembering God''s great acts and trusting He will continue them because of the covenant (Moroni 10:3)'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Throughout scripture we are encouraged to remember the great things God has done for His people and to have faith that He will continue to do great things because of the covenant (see Moroni 10:3).'
  - where: 'christ'
    claim: 'Moroni 10:3: remember how merciful the Lord has been from the creation of Adam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/10?lang=eng'
    quote: 'that ye would remember how merciful the Lord hath been unto the children of men, from the creation of Adam even down until the time that ye shall receive these things'
