chapter: 3
claims:
  - where: when
    claim: 'The walls were rebuilt in about 444 B.C.'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Under Nehemiah’s direction, the walls of Jerusalem were rebuilt in about 444 BC.'
  - where: when
    claim: 'The twentieth year of Artaxerxes is about 445 B.C.'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The timeframe for this discussion appears to be December in the twentieth year of King Artaxerxes’s reign (approximately 445 BC).'
  - where: setting
    claim: 'Chapter 3 names the builders and their portions; chapter 4 tells of Sanballat''s attempts to obstruct the work'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'the portion of wall and the gates on which different families were respectively employed, being specified in Nehemiah 3; while the attempts of Sanballat and his associates to obstruct the building and the defensive measures resorted to by Nehemiah follow'
  - where: setting
    claim: 'The list follows the course of the wall and names the gates in their order'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'Hence we are justified in inferring that the course of the wall is adhered to in this statement, and that the gates are mentioned in the actual order in which they were found in the walls.'
  - where: setting
    claim: 'The sheep gate stood in the northeast near the temple, the fish gate in the northwest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'A gate probably in the northeast wall of Jerusalem near the temple, for access of sacrificial animals. … Probably a northwestern gate, with access to the merchants’ quarter'
  - where: setting
    claim: 'The valley gate lay on the west'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'The valley-gate lay in the west, in the neighbourhood of the present Jaffa gate'
  - where: setting
    claim: 'The section by the sepulchres of David is on the eastern side of Zion; the wall then passed over Ophel'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: '"Opposite the sepulchres of David" is the length of wall on the eastern side of Zion'
  - where: setting
    claim: 'With 2:13–15 and 12:27–40 the chapter is the chief authority for the topography of the pre-exilic city'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'This description of the walls of Jerusalem, together with the short statements in Nehemiah 2:13-15 and Nehemiah 12:27-40, forms the chief authority for the topography of ancient Jerusalem (before the captivity)'
  - where: setting
    claim: 'The doors were set up only after the breaches were repaired (6:1); the list summarizes each party''s work'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'The setting up of the doors in the gates did not, according to Nehemiah 6:1, take place till after all the breaches in the wall had been repaired'
  - where: thread
    claim: 'The list counts forty-two sections of wall'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'throughout this long enumeration of forty-two sections of wall'
  - where: thread
    claim: 'Group after group of Jews took up the work'
    key: amistad-modern-nehemiahs
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/12/wanted-modern-nehemiahs?lang=eng'
    quote: 'The sons of Hassenaah rebuilt the next gate, as group after group of Jews mobilized to the cause (see Neh. 3:1–32).'
  - where: section 2 plain
    claim: 'Apothecaries are perfumers; "on this side the river" is west of the Euphrates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'OR perfumers, ointment makers. … IE on the west side of the Euphrates.'
  - where: section 2 plain
    claim: 'A section of the commentary runs from the old gate to the valley gate'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'From the gate of the old wall to the valley gate.'
  - where: section 4 plain
    claim: 'The tower of verse 25 is the upper tower standing out from the king''s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'OR the upper tower that stands out from the king’s house.'
  - where: section 5 plain
    claim: 'The going up of the corner is the upper chamber of the corner; the section is Ophel and the east side of the temple area'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'OR to the upper chamber of the corner.'
  - where: section 5 plain
    claim: 'A section of the commentary covers Ophel and the east side of the temple area from verse 28'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'The wall of Ophel and the eastern side of the temple area. - Nehemiah 3:28'
  - where: 'note 3:1 “The priests consecrate their stretch”'
    claim: 'The verb of verse 1 is used for consecrating holy places: Sinai, the altar, the tabernacle, the place of sacrifice; and the gate in Neh. 3:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'a. places: Sinai Exodus 19:23 (J), alter, etc., Exodus 29:36,37; Exodus 30:29 (P), tabernacle, etc. … place of sacrifice 1 Kings 8:64 2Chronicles 7:7; gate Nehemiah 3:1 (twice in verse)'
  - where: 'note 3:1 “The priests consecrate their stretch”'
    claim: 'The sheep gate was near the temple, for the sacrificial animals'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'A gate probably in the northeast wall of Jerusalem near the temple, for access of sacrificial animals.'
  - where: 'note 3:5 “Nobles who would not bend their necks”'
    claim: 'The neck is the place of the yoke (Jer. 27:11) and, figuratively in Neh. 3:5, of bearing a load'
    key: bdb
    url: 'https://biblehub.com/hebrew/6677.htm'
    quote: 'place of yoke Genesis 27:40 (singular; J), Deuteronomy 28:48; Isaiah 10:27; Jeremiah 27:2,8,11,12; … of bearing load, Nehemiah 3:5 (figurative)'
  - where: 'note 3:5 “Nobles who would not bend their necks”'
    claim: 'To bring the neck to service is to put it under someone''s yoke, to subject oneself to his service'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'The expression "to bring the neck to service" is, according to Jeremiah 27:11, to be understood as meaning: to bring the neck under the yoke of any one, i.e., to subject oneself to the service of another.'
  - where: 'note 3:5 “Nobles who would not bend their necks”'
    claim: '"Their Lord" is a plural noun with a plural suffix in the Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'lemma="113" n="0" morph="HNcmpc/Sp3mp" id="166t4">אֲדֹנֵי/הֶֽם'
  - where: 'note 3:5 “Nobles who would not bend their necks”'
    claim: 'The plural of adon is a plural of rank; the lexicon lists Neh. 3:5 under a human governor'
    key: bdb
    url: 'https://biblehub.com/hebrew/113.htm'
    quote: 'elsewhere intensive plural of rank, lord, master, (1) reference to men: … (e) governor Nehemiah 3:5'
  - where: 'note 3:5 “Nobles who would not bend their necks”'
    claim: 'Keil judges the reading "God" decidedly correct, the wall being a service required by God'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'The former view seems to us decidedly correct, for it cannot be discerned how the suffix should … prevent our thinking of the service of God, if the repairing of the wall of Jerusalem may be regarded as a service required by God and rendered to Him.'
  - where: 'note 3:9 “Rulers of the districts”'
    claim: 'The Hebrew word behind "part" means district, properly circle or circuit, in Neh. 3:9–18'
    key: bdb
    url: 'https://biblehub.com/hebrew/6418.htm'
    quote: '2 district (properly circle, circuit); — absolute ׳פ 2 Samuel 3:29'
  - where: 'note 3:9 “Rulers of the districts”'
    claim: 'The district sense in verses 9, 12, 14–18'
    key: bdb
    url: 'https://biblehub.com/hebrew/6418.htm'
    quote: '2 district, Nehemiah 3:9,12,14,15,16,17 (twice in verse); Nehemiah 3:18.'
  - where: 'note 3:12 “Shallum and his daughters”'
    claim: 'Some women assisted with the rebuilding (verse 12)'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Some women assisted with the reconstruction as well (verse 12). The city walls were divided into sections, with workers assigned to each section.'
  - where: christ
    claim: 'Nehemiah''s story of rebuilding walls and lives teaches of a merciful Father who gave His Son; the return to Their presence is possible through Christ'
    key: amistad-modern-nehemiahs
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/12/wanted-modern-nehemiahs?lang=eng'
    quote: 'Nehemiah’s story of inspired leadership and mission to rebuild walls and lives teaches us of a loving and merciful Father in Heaven. He gave His Only Begotten Son, Jesus Christ, to atone for the sins of all mankind.'
  - where: christ
    claim: 'Latter-day disciples are also doing a great work, concerning the Lord''s house, His law, and the protection found in Him'
    key: cfm-ot-2026-31
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/31?lang=eng'
    quote: 'Their experiences can inform and inspire ours because we too are doing a great work. And like theirs, our work has much to do with the house of the Lord, the law of the Lord, and the spiritual protection we find in Him.'
  - where: explore
    claim: 'The Student Manual prints a map of the estimated sites of the walls and gates'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'Nehemiah wrote in such detail about his night reconnaissance and the later reconstruction of the walls of Jerusalem that we have a good idea of the actual sites of much that he reported. The accompanying map shows the estimated locations.'
  - where: setting
    claim: 'Nehemiah wrote in such detail of his night ride and the rebuilding that the sites of much he reports can be estimated'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'Nehemiah wrote in such detail about his night reconnaissance and the later reconstruction of the walls of Jerusalem that we have a good idea of the actual sites of much that he reported.'
  - where: setting
    claim: 'The footnote places the horse gate as probable'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'Probably at southeast corner of temple area.'
  - where: setting
    claim: 'The footnote places the east gate as probable'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'Probably the area of the “Golden Gate.”'
  - where: 'note 3:5 “Nobles who would not bend their necks”'
    claim: 'The plural used here is used of kings, which neither the Jerusalem rulers nor Nehemiah were'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/3.htm'
    quote: 'the fact that אדנים is only used of kings, and is inapplicable whether to the authorities in Jerusalem or to Nehemiah, speaks against referring it to secular rulers or authorities'
