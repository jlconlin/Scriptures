chapter: 7
claims:
  - where: 'when'
    claim: 'The Bible Chronology dates the decree of Cyrus for the return to 537 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '537 | Decree of Cyrus for the return of the Jews.'
  - where: 'setting'
    claim: 'The book''s first part is 1:1–7:73, Nehemiah''s first visit and the rebuilding of the walls in spite of opposition'
    key: bd-nehemiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nehemiah?lang=eng'
    quote: 'The book divides into four parts: (a) 1:1–7:73, Nehemiah’s first visit to Jerusalem, and the rebuilding of the walls in spite of much opposition'
  - where: 'setting'
    claim: 'The Nehemiah of 7:7 is another man, of the first return (Ezra 2:2)'
    key: bd-nehemiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nehemiah?lang=eng'
    quote: '(2) Ezra 2:2 (Neh. 7:7).'
  - where: 'setting'
    claim: 'Nehemiah, wanting a list of the community, found the document of Ezra 2 and incorporated it; the texts vary in names and numbers'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'Nehemiah also, when he desired to give a list of the members of the community at Jerusalem, met with the same document, and incorporated it in the book which bears his name (Nehemiah 7:6-73).'
  - where: 'setting'
    claim: 'The register is of those who came first, with Zerubbabel and Joshua under Cyrus'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/7.htm'
    quote: 'at the beginning, i.e., with Zerubbabel and Joshua under Cyrus (Ezra 2), and not subsequently with Ezra (Ezra 7).'
  - where: 'setting'
    claim: 'The seventh month came before Nehemiah could carry out his plan; it was carried out after chapters 8–10'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/11.htm'
    quote: 'the seventh month of the year arrived, in which all the people assembled at Jerusalem to perform those acts of worship and solemnities (described Nehemiah 8-10) in which this month abounded.'
  - where: 'setting'
    claim: 'The second clause of 7:73 belongs to chapter 8; the seventh month is probably that of the same year as 6:15'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/8.htm'
    quote: 'The second clause of Nehemiah 7:73 belongs to Nehemiah 8, and forms one sentence with Nehemiah 8:1.'
  - where: 'setting'
    claim: 'The seventh month is most likely that of the year the wall was finished'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/8.htm'
    quote: 'Elul, the sixth month, is followed by Tishri, the seventh, and there is nothing against the inference that the seventh month of the same year is intended'
  - where: 'thread'
    claim: 'The chapter moves from securing the city to increasing its inhabitants, then to the law in chapters 8–10'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/7.htm'
    quote: 'Nehemiah first made arrangements for securing the city against hostile attacks (Nehemiah 7:1-3); then took measures to increase the inhabitants of Jerusalem (7:4-73 and Nehemiah 11:1 and Nehemiah 11:2); and finally endeavoured to fashion domestic and civil life according to the precepts of the law (Nehemiah 8-10)'
  - where: 'thread'
    claim: 'The people being listed were those who assembled in Jerusalem in the seventh month for chapters 8–10'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/11.htm'
    quote: 'had for this purpose convoked a public assembly, that a list of the whole Israelite population of the towns of Benjamin and Judah might be taken in hand, the seventh month of the year arrived, in which all the people assembled at Jerusalem'
  - where: 'note 7:2 “Two men over Jerusalem”'
    claim: 'Hanani is the brother who brought the news to Shushan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng'
    quote: 'That Hanani, one of my brethren, came, he and certain men of Judah; and I asked them concerning the Jews that had escaped, which were left of the captivity, and concerning Jerusalem.'
  - where: 'note 7:2 “Two men over Jerusalem”'
    claim: 'The palace is the fortress north of the temple, which probably held the royal garrison'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/7.htm'
    quote: 'is the fortress or citadel of the city lying to the north of the temple (see rem. on Nehemiah 2:8), in which was probably located the royal garrison, the commander of which was in the service of the Persian king.'
  - where: 'note 7:2 “Two men over Jerusalem”'
    claim: 'The reason clause explains the choice of Hananiah: truly faithful, more God-fearing than many'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/7.htm'
    quote: 'The choice of this man for so important a charge is explained by the additional clause'
  - where: 'note 7:2 “Two men over Jerusalem”'
    claim: 'The comparative sense: like a man truly called faithful; more God-fearing than many'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/7.htm'
    quote: 'like a man whom one may truly call faithful. מרבּים is comparative: more God-fearing than many.'
  - where: 'note 7:2 “Two men over Jerusalem”'
    claim: 'The Hebrew of 7:2 reads “like a man of truth” (ʾemet)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'כְּ/אִ֣ישׁ אֱמֶ֔ת'
  - where: 'note 7:2 “Two men over Jerusalem”'
    claim: 'Exodus 18:21 has “men of truth” with the same word ʾemet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אַנְשֵׁ֥י אֱמֶ֖ת'
  - where: 'note 7:2 “Two men over Jerusalem”'
    claim: 'The footnote on “feared” at 7:2 refers to Exodus 18:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng'
    quote: '“feared”: Ex. 18:21; Mosiah 29:13.'
  - where: 'note 7:3 “Gates opened late and a watch at every house”'
    claim: 'The gates were opened late in the day and guarded against attack'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'He specifically ordered that the gates be opened only during the middle of the day and that they be carefully guarded against potential attackers.'
  - where: 'note 7:5 “Beginning with a register”'
    claim: 'Many homes still needed to be built'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'A brief mention was also made to the fact that many homes still needed to be built.'
  - where: 'note 7:5 “Beginning with a register”'
    claim: 'Later rabbis held that Ezra''s list was the first return and Nehemiah''s the dedication of the temple'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'later rabbis expressed the opinion that Ezra’s list reflects the initial return from Babylon while Nehemiah’s list is linked to the dedication of the temple.'
  - where: 'note 7:10 “Joseph Smith and the two lists”'
    claim: 'Of 22 verses changed in Nehemiah, 17 in chapter 7 conform the numbers to Ezra; one more changes a name; the totals are the same with or without the changes'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'While there are twenty-two verses changed, seventeen of them are in chapter 7 and concern the numbers of the various families who returned from Babylon. They are changed to conform to the parallel account given in Ezra.'
  - where: 'note 7:10 “Joseph Smith and the two lists”'
    claim: 'One more verse changes a name; the sum totals are the same with or without the changes'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Another verse in chapter 7 has a name changed to conform with Ezra’s account. It is interesting to note that the sum total of the Ezra and Nehemiah accounts are the same with or without the changes made in Nehemiah.'
  - where: 'note 7:10 “Joseph Smith and the two lists”'
    claim: 'Such revisions are very rare; did they need revelation or did he look them up; his Bible''s cross-references and table may have been the source'
    key: jackson-salvation-souls
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/salvation-souls'
    quote: 'Revisions like these are very rare in the New Translation, but they raise a question. Were those obscure matters important enough to bring forth divine revelation, or did the Prophet notice the oddities or discrepancies and wisely decide to look them up in a printed source?'
  - where: 'note 7:10 “Joseph Smith and the two lists”'
    claim: 'His Bible had cross-references and a table mentioning the Ezra–Nehemiah discrepancy'
    key: jackson-salvation-souls
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/salvation-souls'
    quote: 'the Bible he used may have been his printed source, because it has cross-references to the parallel accounts, and a table in the back of his Bible mentions the discrepancy in the case of Ezra and Nehemiah.'
  - where: 'note 7:10 “Joseph Smith and the two lists”'
    claim: 'The list in Nehemiah 7 was revised to match Ezra 2, perhaps from the Bible''s footnotes'
    key: sc-knowhy-786
    url: 'https://scripturecentral.org/knowhy/did-the-joseph-smith-translation-of-the-bible-rely-on-scholarly-commentaries'
    quote: 'in Nehemiah 7 a list of families and numbers is likewise revised to match the parallel account in Ezra 2. As such, Jackson notes that Joseph Smith may have referred to a print source, such as his Bible’s footnotes, indicating the parallel accounts.'
  - where: 'christ'
    claim: 'The footnote on “register” at 7:5 refers to the Topical Guide, Book of Life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng'
    quote: '“register”: TG Book of Life.'
  - where: 'christ'
    claim: 'The Topical Guide''s Book of Life lists Revelation 21:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/book-of-life?lang=eng'
    quote: 'names are not written in the book of life , Rev. 13:8 ( 21:27 )'
  - where: 'christ'
    claim: 'Joseph Smith taught that the book of life is the record kept in heaven, and what is recorded on earth is recorded in heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'And the book which was the book of life is the record which is kept in heaven'
  - where: 'christ'
    claim: 'God does all things in order; genealogical records and priesthood lines of authority maintain that order'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This situation is a reminder that God does all things in order, and our genealogical records and priesthood lines of authority help to maintain that order.'
  - where: 'note 7:5 “Beginning with a register”'
    claim: 'In 11:1 one of ten was brought by lot to dwell in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/11?lang=eng'
    quote: 'the rest of the people also cast lots, to bring one of ten to dwell in Jerusalem the holy city, and nine parts to dwell in other cities.'
  - where: 'note 7:5 “Beginning with a register”'
    claim: 'Nehemiah wished to register the people by families and found and copied the register of the first returnees'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah desired to assemble the people to register them by families. He also found and copied the genealogical register of the first returnees from Babylon.'
  - where: 'note 7:5 “Beginning with a register”'
    claim: 'The first company came with Zerubbabel (7:7)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng'
    quote: 'Who came with Zerubbabel, Jeshua, Nehemiah, Azariah'
  - where: 'note 7:10 “Joseph Smith and the two lists”'
    claim: 'Ezra 2 gives Arah 775, Azgad 1,222, Senaah 3,630'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/2?lang=eng'
    quote: 'The children of Arah, seven hundred seventy and five.'
  - where: 'note 7:10 “Joseph Smith and the two lists”'
    claim: 'The Latter-day Saint edition prints no JST reading in this chapter; its footnote at verse 6 sends the reader to Ezra 2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng'
    quote: '“children”: Ezra 2:1 (1–70).'
  - where: 'explore'
    claim: 'The footnote on “gave” at 7:70 refers to D&C 109:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng'
    quote: '“gave”: D&C 109:5.'
