chapter: 11
claims:
  # ---- setting / thread ----
  - where: 'setting'
    claim: 'Verses 1–2 carry out the resolve of 7:4–5, after the worship of the seventh month (chapters 8–10)'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/11.htm'
    quote: 'Nehemiah 11:1 and Nehemiah 11:2 narrate the carrying out of Nehemiah''s resolution, Nehemiah 7:4, to make Jerusalem more populous, and follow Nehemiah 7:5 as to matter, but the end of Nehemiah 10 as to time.'
  - where: 'setting'
    claim: 'The register covers the whole province: Jerusalem in verses 4–24, the other towns in 25–36'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/11.htm'
    quote: 'the inhabitants of Jerusalem being enumerated vv. 4-24, and the inhabitants of the other cities of Judah and Benjamin, Nehemiah 11:25-36.'
  - where: 'setting'
    claim: 'The list of leaders in Jerusalem is similar to 1 Chronicles 9:2–17'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This list of leaders living in Jerusalem is similar to the list in 1 Chronicles 9:2–17.'
  - where: 'setting'
    claim: 'Nehemiah 7:4–5: the city large, the people few; God put it into Nehemiah''s heart to gather and reckon them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng'
    quote: 'Now the city was large and great: but the people were few therein, and the houses were not builded.'
  # ---- note 11:1 lot ----
  - where: 'note 11:1 “Why a tenth were brought in by lot”'
    claim: 'The purpose was to support and defend the city''s population; the other nine kept farmland, likely economically advantageous'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'To encourage, support, and defend a growing population within Jerusalem, lots were cast so that one out of ten residents would live within the city … The other nine out of the ten could continue living elsewhere where access to agricultural land likely made it economically advantageous.'
  - where: 'note 11:1 “Why a tenth were brought in by lot”'
    claim: 'Casting lots was a valid way of obtaining revelation in ancient Israel, as with Joshua and Achan'
    key: sc-knowhy-180
    url: 'https://scripturecentral.org/knowhy/why-could-seantum-be-convicted-without-any-witnesses'
    quote: 'Casting lots was considered to be a valid way of obtaining revelation from the Lord in Ancient Israel, and that is what Joshua does to determine the will of the Lord in this case.'
  - where: 'note 11:1 “The holy city”'
    claim: 'The title is used here and at 11:18; Jerusalem is so called on the ground of Joel 3:17 and Isa. 48:2, because the temple was there'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/11.htm'
    quote: 'The predicate, the holy city, occurs here and Nehemiah 11:18 for the first time. Jerusalem is so called, on the ground of the prophecies, Joel 3:17 and Isaiah 48:2, because the sanctuary of God, the temple, was there.'
  - where: 'note 11:1 “The holy city”'
    claim: 'Joel 3:17 ties Jerusalem''s holiness to the Lord dwelling in Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'I am the Lord your God dwelling in Zion, my holy mountain: then shall Jerusalem be holy'
  # ---- note 11:2 ----
  - where: 'note 11:2 “The men that willingly offered themselves”'
    claim: 'The verb nadab means to volunteer; BDB lists it for war (Judg. 5:2, 9) and for other service, Neh. 11:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/5068.htm'
    quote: '1 volunteer for war Judges 5:2,9; for service of other kinds 2Chronicles 17:16; Nehemiah 11:2.'
  - where: 'note 11:2 “The men that willingly offered themselves”'
    claim: 'Ludlow reads verse 2 as volunteers who chose to live in the city along with those chosen by lot'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'lots were cast so that one out of ten residents would live within the city along with any who voluntarily chose to live there (see verse 2'
  - where: 'note 11:2 “The men that willingly offered themselves”'
    claim: 'The nine who stayed elsewhere kept access to farmland, likely an economic advantage over the city'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The other nine out of the ten could continue living elsewhere where access to agricultural land likely made it economically advantageous.'
  - where: 'christ'
    claim: 'In early Church history members were encouraged to settle together in specific cities and some resisted, wanting their own land'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'There were cases in early Church history when members were encouraged to settle together in specific cities, but occasionally some would resist, wanting to continue living on their own land.'
  - where: 'note 11:2 “The men that willingly offered themselves”'
    claim: 'Judges 5:2 uses "willingly offered themselves" of those who went to battle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'Praise ye the Lord for the avenging of Israel, when the people willingly offered themselves.'
  # ---- note 11:3 ----
  - where: 'note 11:3 “A register of the province”'
    claim: 'The list names Judah and Benjamin, whose inheritance surrounded Jerusalem, then priests, Levites and gatekeepers, with names and totals'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This section of the chapter focuses on those living in Jerusalem from the tribes of Judah and Benjamin (the two tribes whose land of inheritance surrounded Jerusalem), the priests, the Levites, and the gatekeepers. A list of prominent names as well as total numbers within each group is given.'
  - where: 'note 11:3 “A register of the province”'
    claim: 'The Nethinims and the children of Solomon''s servants were counted among the first returners (Ezra 2:43–58)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/2?lang=eng'
    quote: 'All the Nethinims, and the children of Solomon’s servants, were three hundred ninety and two.'
  - where: 'note 11:23 “The king’s commandment”'
    claim: 'The king is the Persian Artaxerxes, not David; the command refers to the authority given Ezra to order the worship (Ezra 7)'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/11.htm'
    quote: 'The king is not David, who once regulated the services of the Levites (1 Chronicles 23:4.), but the Persian king Artaxerxes, who is mentioned as המּלך in Nehemiah 11:24; and המּלך מצות undoubtedly refers to the full power bestowed by Artaxerxes upon Ezra to order all that concerned the worship of God at Jerusalem'
  - where: 'note 11:23 “The king’s commandment”'
    claim: 'Pethahiah was an official handling the Jewish community''s affairs at the king''s court'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/11.htm'
    quote: 'can scarcely be understood of a royal commissioner at Jerusalem, but certainly designates an official transacting the affairs of the Jewish community at the hand of the king, at his court.'
  # ---- note 11:30 ----
  - where: 'christ'
    claim: 'After His resurrection saints went into the holy city (Matt. 27:53)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'And came out of the graves after his resurrection, and went into the holy city, and appeared unto many.'
  - where: 'christ'
    claim: 'The Church''s footnote at Neh. 11:1 points "holy" city to Matt. 4:5 and 27:53'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/11?lang=eng'
    quote: 'Matt. 4:5; 27:53; Rev. 11:2.'
  - where: 'note 11:3 “A register of the province”'
    claim: 'The chapter ends with the rest of the Israelites in the villages and towns of Judah and Benjamin around Jerusalem'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The last section of the chapter discusses the rest of the Israelites who lived in the areas of Judah and Benjamin around Jerusalem. It includes lists of villages and cities with significant populations.'
  - where: 'note 11:30 “From Beer-sheba unto the valley of Hinnom”'
    claim: 'Judah''s border ran up the valley of Hinnom to Jerusalem (Josh. 15:8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And the border went up by the valley of the son of Hinnom unto the south side of the Jebusite; the same is Jerusalem'
  - where: 'note 11:30 “From Beer-sheba unto the valley of Hinnom”'
    claim: 'Beer-sheba is among the uttermost cities of Judah toward the south (Josh. 15:21, 28)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And the uttermost cities of the tribe of the children of Judah toward the coast of Edom southward were Kabzeel'
  - where: 'note 11:30 “From Beer-sheba unto the valley of Hinnom”'
    claim: 'Kirjath-arba is Hebron (Gen. 23:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/23?lang=eng'
    quote: 'And Sarah died in Kirjath-arba; the same is Hebron in the land of Canaan'
