chapter: 4
claims:
  - where: when
    claim: 'Scripture Helps dates the rebuilding to about 444 B.C.'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Under Nehemiah’s direction, the walls of Jerusalem were rebuilt in about 444 BC.'
  - where: when
    claim: 'The twentieth year of Artaxerxes is about 445 B.C.'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The timeframe for this discussion appears to be December in the twentieth year of King Artaxerxes’s reign (approximately 445 BC).'
  - where: setting
    claim: 'Sanballat was governor of Samaria; Tobiah an Ammonite official with influence in Jerusalem; both feared for their positions'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Sanballat was the governor of Samaria. Tobiah was an Ammonite official and an influential member of the community in Jerusalem. These men were threatened by Nehemiah’s arrival because they were worried that their influential positions might be compromised.'
  - where: setting
    claim: 'The enemies surrounded Jerusalem and had to avoid a formal attack because the city was part of the Persian Empire; some Jews lacked confidence'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Opposition from the Sanballat, Tobiah, and others surrounding Jerusalem intensified … They conspired to attack Jerusalem, but they had to be careful to avoid formally attacking the city because it was part of the Persian Empire.'
  - where: setting
    claim: 'The book is mostly first-person narrative'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Like 1 Nephi, the book of Nehemiah is written mostly in first-person narrative.'
  - where: thread
    claim: 'Nehemiah set guards and armed workers, and the people also relied on God'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'For protection, Nehemiah developed a defensive strategy that included posting guards and arming the workers. They also relied on God’s assistance.'
  - where: thread
    claim: 'At the conspiracy Nehemiah prayed and set a watch'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/4.htm'
    quote: 'then prayed to God, and set a watch (Nehemiah 4:3). When the courage of the people began to fail, and their enemies spread a report of sudden attack being imminent, Nehemiah furnished the people on the wall with weapons'
  - where: section 1 plain
    claim: 'The chapter falls into 1–6, 7–12, 13–18, 19–23'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah 4:1–6. Sanballat and Tobiah the Ammonite are angry … Nehemiah 4:7–12. The Arabs, Ammonites, and Ashdodites conspire … Nehemiah 4:13–18. Nehemiah prepares the workers … Nehemiah 4:19–23.'
  - where: section 1 plain
    claim: 'The wall joined to half its height'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+4&version=ESV'
    quote: 'So we built the wall. And all the wall was joined together to half its height, for the people had a mind to work.'
  - where: section 3 plain
    claim: '“terrible” means revered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/4?lang=eng'
    quote: '14b “terrible”: OR feared, revered.'

  - where: 'note 4:2 “Sanballat’s four questions”'
    claim: 'Sanballat spoke publicly before his associates and the army; the questions doubt resources, God, speed, materials'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/4.htm'
    quote: 'saying publicly before his associates and subordinates … Will they sacrifice? i.e., bring sacrifices to obtain God''s miraculous assistance? The ridicule lies in the circumstance that Sanballat neither credited the Jews with ability to carry out the work, nor believed in the overruling providence of the God'
  - where: 'note 4:2 “Sanballat’s four questions”'
    claim: 'Fortify themselves = leave it to themselves'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/4.htm'
    quote: 'the sense is: Will they leave the building of the fortified walls to themselves? i.e., Do they think they are able with their poor resources to carry out this great work?'
  - where: 'note 4:2 “Sanballat’s four questions”'
    claim: 'Make an end in a day; limestone softened by fire; revive'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/4.htm'
    quote: 'Is this a matter to be as quickly executed as if it were the work of a single day? … Have they even the requisite materials? … The building-stone of Jerusalem was limestone, which gets softened by fire, losing its durability, and, so to speak, its vitality.'
  - where: 'note 4:2 “Sanballat’s four questions”'
    claim: 'The fox: even its light steps would break the wall'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/4.htm'
    quote: 'even if they build up walls, the light footsteps of the stealthy fox will suffice to tread them down, and to make breaches in their work.'

  - where: 'note 4:4 “A prayer against the mockers”'
    claim: 'The narrative switches to a petition; the petitioner is unidentified'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The narrative switches in verse 4 to a petition to God to have the two men’s taunts returned on their own heads. The petitioner is left unidentified.'
  - where: 'note 4:4 “A prayer against the mockers”'
    claim: '“Cover” iniquity means forgive; provoked wrath before the builders by despising God where they heard'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/4.htm'
    quote: 'He supplicates, moreover, that God would not cover, i.e., forgive (Psalm 85:3), their iniquity … "for they have provoked to wrath before the builders," i.e., openly challenged the wrath of God, by despising Him before the builders, so that they heard it.'
  - where: 'note 4:4 “A prayer against the mockers”'
    claim: 'Ps. 85:2 pairs forgiving iniquity with covering sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/85?lang=eng'
    quote: 'Thou hast forgiven the iniquity of thy people, thou hast covered all their sin.'

  - where: 'note 4:6 “Half its height, and a heart to work”'
    claim: 'The wall joined to half its height'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+4&version=ESV'
    quote: 'So we built the wall. And all the wall was joined together to half its height, for the people had a mind to work.'
  - where: 'note 4:6 “Half its height, and a heart to work”'
    claim: 'The Hebrew of “a mind” is lev, heart'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'לֵ֦ב'
  - where: 'note 4:6 “Half its height, and a heart to work”'
    claim: 'lev: inner man, mind, will, heart'
    key: bdb
    url: 'https://biblehub.com/hebrew/3820.htm'
    quote: 'לֵב599 noun masculine … inner man, mind will, heart'
  - where: 'note 4:6 “Half its height, and a heart to work”'
    claim: 'The wall was about halfway up when the plot was laid'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'the plan they laid to attack and prevent the repair of the walls, now about halfway up (see Nehemiah 4:6), was frustrated by Nehemiah'

  - where: 'note 4:7 “Walls made up”'
    claim: 'arukah: healing of a wound, new flesh; used of Israel’s restoration and of Jerusalem’s walls'
    key: bdb
    url: 'https://biblehub.com/hebrew/724.htm'
    quote: 'אֲרוּכָה noun feminine healing of a wound, restoration (properly the new flesh that grows at the wounded spot … — alwaysfig. … a. healing, restoration of Israel … Jeremiah 30:17 … b. restoration of walls of temple 2 Chronicles 24:13, of walls of Jerusalem'
  - where: 'note 4:7 “Walls made up”'
    claim: 'The Hebrew of “made up” is arukah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'אֲרוּכָה֙'
  - where: 'note 4:7 “Walls made up”'
    claim: 'The enemies surrounded Jerusalem and conspired to attack'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Opposition from the Sanballat, Tobiah, and others surrounding Jerusalem intensified once they heard that the walls had been rebuilt. They conspired to attack Jerusalem'

  - where: 'note 4:12 “Ten times over”'
    claim: 'NRSVue reads a warning of attack from every side'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+4&version=NRSVUE'
    quote: '12 When the Jews who lived near them came, they said to us ten times, “From all the places where they live they will come up against us.”'
  - where: 'note 4:12 “Ten times over”'
    claim: 'ESV reads a summons home'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+4&version=ESV'
    quote: '12 At that time the Jews who lived near them came from all directions and said to us ten times, “You must return to us.”'
  - where: 'note 4:12 “Ten times over”'
    claim: 'The verb is “ye shall return”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'תָּשׁ֥וּבוּ'
  - where: 'note 4:12 “Ten times over”'
    claim: 'Some opposition came from Jews who lacked confidence'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'There even seems to have been some opposition from other Jews who did not have confidence that they could rebuild the walls.'

  - where: 'note 4:14 “Moroni’s title of liberty”'
    claim: 'The charge in v. 14 is similar to Moroni’s (Alma 43:46–47; 46:12)'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'Nehemiah’s encouragement to the Jews to defend their families and homes (see v. 14) is similar to the charge Moroni gave in the Book of Mormon (see Alma 43:46–47; 46:12).'
  - where: 'note 4:14 “Moroni’s title of liberty”'
    claim: 'The exhortation is comparable to Moroni’s title of liberty'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah’s exhortation to “fight for your brethren, your sons, and your daughters, your wives, and your houses” is comparable to Captain Moroni’s plea to his people with the title of liberty in Alma 46:12'
  - where: 'note 4:14 “Moroni’s title of liberty”'
    claim: 'Alma 43:45–47 and 46:12 texts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/43?lang=eng'
    quote: 'they were not fighting for monarchy nor power but they were fighting for their homes and their liberties, their wives and their children … Ye shall defend your families even unto bloodshed.'
  - where: 'note 4:14 “Moroni’s title of liberty”'
    claim: 'Alma 46:12, the words on the title of liberty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/46?lang=eng'
    quote: 'In memory of our God, our religion, and freedom, and our peace, our wives, and our children'

  - where: 'note 4:17 “A weapon in the other hand”'
    claim: 'Image of workers with weapon in one hand and tool or basket in the other'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'A vivid image is given of many of the workers holding a weapon in one hand and a tool or basket in the other.'
  - where: 'note 4:17 “A weapon in the other hand”'
    claim: 'George Q. Cannon compared the Nauvoo Temple builders to Nehemiah’s'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'We have not been situated as we were in Nauvoo, when we finished our temple there, for then the workmen who labored upon it, were like the Jews in the days of Nehemiah … with their instruments of labor in one hand, and weapons to defend themselves in the other.'

  - where: 'note 4:20 “Our God shall fight for us”'
    claim: 'God fighting for them alludes to the divine warrior found throughout the Old Testament'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'They trusted that God would fight for them, an allusion to the symbol of a divine warrior found throughout the Old Testament.'
  - where: 'note 4:20 “Our God shall fight for us”'
    claim: 'Deut. 3:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: 'Ye shall not fear them: for the LORD your God he shall fight for you.'

  - where: 'note 4:23 “Every one his weapon”'
    claim: 'The Hebrew words: each man, his weapon, the water'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'הַ/מָּֽיִם'
  - where: 'note 4:23 “Every one his weapon”'
    claim: 'BDB: shelach = weapon; “the water” corrupt, read probably “in his right hand” or “in his hand”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7973.htm'
    quote: '1 missile, weapon, Nehemiah 4:11 and Nehemiah 4:17 (where הַמַּיִם corrupt; read probably בִּימִינוֺ or בְּיָדוֺ'
  - where: 'note 4:23 “Every one his weapon”'
    claim: 'ESV: each kept his weapon at his right hand'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+4&version=ESV'
    quote: 'none of us took off our clothes; each kept his weapon at his right hand.'
  - where: 'note 4:23 “Every one his weapon”'
    claim: 'NRSVue: each kept his weapon in his right hand'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+4&version=NRSVUE'
    quote: 'ever took off our clothes; each kept his weapon in his right hand.'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The footnote to v. 14 points to D&C 98:14; its words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: 'Therefore, be not afraid of your enemies, for I have decreed in my heart, saith the Lord, that I will prove you in all things, whether you will abide in my covenant'
  - where: christ
    claim: 'D&C 122 is addressed to Joseph Smith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: '1–4, The ends of the earth will inquire after the name of Joseph Smit…'
  - where: christ
    claim: 'Opposition is met by trust in God and His help'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'These verses remind us that often we will have opposition from others around us, but we should maintain our trust in God and His help.'
  - where: christ
    claim: 'The spiritual protection we find in Him'
    key: cfm-ot-2026-31
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/31?lang=eng'
    quote: 'our work has much to do with the house of the Lord, the law of the Lord, and the spiritual protection we find in Him.'

  - where: explore
    claim: 'The footnotes to v. 14 point to D&C 98:14 and Alma 46:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/4?lang=eng'
    quote: '14a “afraid”: D&C 98:14; 122:9. … 14d “wives”: Alma 46:12.'
