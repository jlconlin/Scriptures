chapter: 10
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'The assembly of chapter 9 met on the twenty-fourth day of the seventh month, and the covenant of 9:38 comes out of it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'And because of all this we make a sure covenant, and write it; and our princes, Levites, and priests, seal unto it.'
  - where: 'setting'
    claim: 'The covenant rests on the prayer and penitence that preceded it ("because of all this")'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'upon all this, i.e., upon the foundation of the preceding act of prayer and penitence, we made אמנה, i.e., a settlement, a sure agreement'
  - where: 'setting'
    claim: 'Some Bibles begin chapter 10 with the KJV''s 9:38'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Some Bible versions start the tenth chapter of Nehemiah with what is 9:38 in the King James Version, which is an introduction to a covenant-making ceremony.'
  - where: 'setting'
    claim: 'Chapters 8–10 are the climax of Ezra–Nehemiah'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The climactic chapters of Nehemiah 8–10 bring all three strategies together, but the primary emphasis falls on the people''s re-encounter with their own textual tradition.'
  - where: 'thread'
    claim: 'Scripture read presents new meanings and then requires new obligations of attentive readers'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The entire scene dramatizes the process of scripture presenting new meanings to—and then requiring new obligations from—attentive readers.'
  - where: 'thread'
    claim: 'The terms of the covenant revive the law of Moses (the shekel)'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'This appointed payment is evidently only a revival of the Mosaic precept, Exodus 30:13'
  - where: 'thread'
    claim: '"We will not forsake the house of our God" is answered in 13:11'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: '"And we will not forsake the house of our God," i.e., we will take care that the service of God''s house shall be provided for; comp. Nehemiah 13:11-14.'
  - where: 'thread'
    claim: 'The Sabbath pledge of 10:31 is taken up again in 13:15–22'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'As recounted in Nehemiah 13:15–22, Nehemiah’s efforts to rebuild Jerusalem physically and spiritually included eliminating the production and transportation of goods by Israelites and foreigners by securing the gates of Jerusalem on the Sabbath day.'
  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'To seal the document is to sign it with a seal bearing one''s name'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'Signing was effected by making an impression with a seal bearing a name'
  - where: 'section 2 plain'
    claim: 'The curse is an oath of self-imprecation; "knowledge… understanding" means children old enough to understand'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'אלה is an oath of self-imprecation, grievous punishments being imprecated in case of transgression; שׁבוּעה, a promissory oath to live conformably with the law.'
  - where: 'section 2 plain'
    claim: 'The holy day is the annual feasts; leaving the seventh year is letting the land lie and releasing loans'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'קדשׁ יום beside שׁבּת means the other holy days, the annual festivals, on which, according to the law, Numbers 28 and 29, no work was to be done.'
  - where: 'section 3 plain'
    claim: 'The shekel tax paid for the regular worship'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'העבודה, the service of the house of God, is not the building and repairs of the temple, but the regular worship.'
  # ---- note 10:1 ----
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'Sealing was signing by impressing a seal bearing one''s name; "those that sealed" means those upon the sealed document'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'Signing was effected by making an impression with a seal bearing a name; hence originated the idiom החתוּם על אשׁר, "he who was upon the sealed document," meaning he who had signed the document by sealing it.'
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'The written agreement was made to give the day of prayer a lasting influence; it was sealed by the heads of houses'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'For the purpose of giving a lasting influence to this day of prayer and fasting, the assembled people, after the confession of sin (given in Nehemiah 9), entered into a written agreement'
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'Fifteen of the twenty-one priests recur in chapter 12 as heads of priestly houses; they signed for their houses'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'Of these twenty-one names, fifteen occur in Nehemiah 12:2-7 as chiefs of the priests … Hence it is obvious that all the twenty-one names are those of heads of priestly classes, who signed the agreement in the names of the houses and families of their respective classes.'
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'Nehemiah heads the list as governor'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'At the head of the signatures stood Nehemiah the Tirshatha, as governor of the country'
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'The Tirshatha is the governor (footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: '1a “Tirshatha”: OR governor.'
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'Verse 28 names the community apart from the leaders; separated to the law means to live by it'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: '"The rest of the people, the priests," etc., are the members of the community, exclusive of the princes and heads of the priestly and Levitical orders. … separated from the heathen to the law of God, i.e., to live according thereto'
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'Women and children old enough to understand joined; the two words strengthen the meaning'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'Not, however, the men only, but also women and children of riper years, acceded to the covenant. כּל־יודע מבין, every one knowing, understanding (מבין and יודע being connected as an asyndeton, to strengthen the meaning), refers to sons and daughters of an age sufficient to enable them to understand the matter.'
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'The people did not sign but ratified what the leaders did for all and swore to keep it; "clave" means held with them'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'Non subscripsit quidem populus, remarks Clericus, sed ratum habuit, quid-quid nomine totius populi a proceribus factum erat, juravitque id a se observatum iri.'
  - where: 'note 10:1 “Signed with a seal”'
    claim: '"Clave to their brethren" means holding with them, uniting with them'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'they were holding with their brethren, i.e., uniting with them in this matter.'
  # ---- note 10:29 curse ----
  - where: 'note 10:29 “A curse and an oath”'
    claim: 'ʾālâ is properly an oath, usually in a bad sense a curse'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/423.htm'
    quote: '1. (properly) an oath, (usually, in a bad sense) a curse'
  - where: 'note 10:29 “A curse and an oath”'
    claim: 'The JST reads "an oath, that a curse should come upon them if they did not walk"; pronouns changed our to their, we to they'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The JST changed the verse to read, “And entered into an oath, that a curse should come upon them if they did not walk in God’s law.” The end of that verse and verse 30 also have several pronoun changes. Our is changed to their, and we is changed to they'
  - where: 'note 10:29 “A curse and an oath”'
    claim: 'The JST footnote gives "their God" for "our Lord"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: 'JST Neh. 10:29 … their God …'
  - where: 'note 10:29 “A curse and an oath”'
    claim: 'Biblical covenants carried blessings and curses contingent on obedience, which the people accepted'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The Blessings and Curses contingent on the obedience or disobedience to the stipulations are outlined in Exodus 23:20–33.'
  # ---- note 10:29 renewal ----
  - where: 'note 10:29 “A covenant renewed”'
    claim: 'Covenant-renewal assemblies after apostasy or in crisis; Joshua 24, Josiah, Ezra 9–10 and Nehemiah 9–10, Mosiah 1–6'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'the covenant children—typically following periods of apostasy, or at times of crisis or transition—are assembled by their leader to publicly rededicate themselves to the conditions of the covenant. Among these accounts are the assemblies recorded in Joshua 8:30–35 and chapter 24'
  - where: 'note 10:29 “A covenant renewed”'
    claim: 'The list includes Josiah, Ezra 9–10, Nehemiah 9–10 and Benjamin''s assembly'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: '2 Kings 22–23 when King Josiah, after the discovery of the book of the law, gathered the people to the temple; and Ezra 9–10 and Nehemiah 9–10 when Ezra recommitted the postexilic community at Jerusalem to the laws of the Mosaic covenant.'
  - where: 'note 10:29 “A covenant renewed”'
    claim: 'The covenant is everlasting because the same from the beginning, and new whenever restored'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The covenant is “everlasting” in that it is the same “from the beginning” (D&C 22:1), and yet it is “new,” both in the sense that it is a fulfillment of the “old covenant” or law of Moses, and it is always “new” to each dispensation in which it is restored and to each individual who enters into it.'
  - where: 'note 10:29 “A covenant renewed”'
    claim: 'Ezra–Nehemiah shows worship restored as recovery of past practice, with Moses as forerunner'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Moses is the legitimating forerunner for the entire postexilic project. The writers are careful to show that every act in the reestablishment of temple worship is a recovery of past practices, not solely an invention of their own.'
  # ---- note 10:31 ----
  - where: 'note 10:31 “The Sabbath market and the seventh year”'
    claim: 'Commerce, gathering food and wood, kindling fire desecrated the Sabbath'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'For example, gathering food (see Exodus 16:23–30), gathering wood (see Numbers 15:32–36), kindling fire (see Exodus 35:3), and engaging in commercial activities (see Nehemiah 10:31; 13:15–22) desecrated the Sabbath day.'
  # ---- note 10:34 ----
  - where: 'note 10:34 “Wood for the altar’s fire”'
    claim: 'The law required the fire kept burning but gave no directions for procuring wood; the covenant made it the congregation''s business, by lot; Nehemiah tells of it in 13:31'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'In the law we merely find it prescribed that wood should be constantly burning on the altar … The law gave no directions concerning the procuring of the wood … Nehemiah now gives orders, as he himself tells us, Nehemiah 13:31, which make this matter the business of the congregation'
  - where: 'note 10:34 “Wood for the altar’s fire”'
    claim: 'The order was probably settled over several years, not every house every year'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: 'The words, "at times appointed, year by year," justify the conclusion that the order was settled for several years, and not that all the different houses contributed in each year.'
  # ---- note 10:39 ----
  - where: 'note 10:39 “Not forsaking the house of God”'
    claim: 'The pledge supports the temple''s work and workers; the chapter ends with a forceful resolution'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Beginning in verse 35, the community also pledged to support the temple by bringing wood, firstfruits, firstlings, and other tithes and offerings for the temple storerooms. The chapter ends with a forceful resolution: “We will not forsake the house of our God” (verse 39).'
  - where: 'note 10:39 “Not forsaking the house of God”'
    claim: 'Malachi 3:8–12 concerns this same temple support and comes from the same time'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Malachi’s well-known passage about robbing God of tithes and offerings (Malachi 3:8–12) is focused on this type of temple support and came from the same time period.'
  - where: 'note 10:39 “Not forsaking the house of God”'
    claim: 'On his return Nehemiah found the Levites unpaid and fled to their fields, and asked why the house of God was forsaken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'Then contended I with the rulers, and said, Why is the house of God forsaken?'
  # ---- christ ----
  - where: 'christ'
    claim: 'The sacrament represents Christ''s atonement by flesh and blood, as the sacrifices of the law did'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The reality of the blood atonement that Jesus Christ accomplished is represented in the sacrament by the symbols of flesh and blood just as they were in the blood sacrifices of the law of Moses.'
  - where: 'christ'
    claim: 'The covenant is periodically renewed through the sacrament'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'as well as instructions for its periodic renewal through the sacrament.'
  - where: 'christ'
    claim: 'The pledged offerings are like tithing that builds and maintains temples today'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This pledge of offerings helps support the work and workers of the temple, similarly to how tithing helps build and maintain temples in our day.'
  # ---- added rows ----
  - where: 'note 10:1 “Signed with a seal”'
    claim: 'The plural of verse 1 means "they who were upon the document," i.e. who sealed it'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/10.htm'
    quote: '"they who were upon the document," explained: they who had signed or sealed the document.'
  - where: 'note 10:29 “A curse and an oath”'
    claim: 'shebuah is properly something sworn, an oath'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/7621.htm'
    quote: '1. (properly) something sworn, i.e. an oath'
  - where: 'note 10:29 “A covenant renewed”'
    claim: 'The renewal aspect of covenant is in the phrase "new and everlasting covenant"'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'The renewal aspect of covenant may be referred to in the phrase “new and everlasting covenant.”'
  - where: 'thread'
    claim: 'The yearly payment of 10:32 revives the half shekel of Ex. 30:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: '32a “charge”: Ex. 30:13 (11–16).'
  - where: 'note 10:29 “A covenant renewed”'
    claim: 'D&C 22:1 calls it a new and an everlasting covenant, from the beginning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/22?lang=eng'
    quote: 'this is a new and an everlasting covenant, even that which was from the beginning.'
