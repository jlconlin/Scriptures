chapter: 2
claims:
  - where: 'when'
    claim: 'Artaxerxes is Artaxerxes I Longimanus, king of Persia 465–425 B.C., who commissioned Nehemiah'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1) and to Nehemiah (Neh. 2:1; 5:14; 13:6).'
  - where: 'when'
    claim: 'Nehemiah''s appointment as governor is dated 444 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '444 | Nehemiah appointed governor of Judea.'
  - where: 'when'
    claim: 'Nehemiah''s coming to Jerusalem is dated 445 B.C.'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'Nehemiah’s appearance at Jerusalem can be firmly dated at 445 B.C.'
  - where: 'setting'
    claim: 'Artaxerxes I reigned 465–425 B.C.; the same king hindered the building (Ezra 4:7–23, including the order of 4:21)'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23)'
  - where: 'setting'
    claim: 'Chisleu preceded Nisan by three months and is placed in the same year'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'the month Chisleu there mentioned (Nehemiah 1:1), which, after the Hebrew method of computing the year, was the ninth month and preceded Nisan by three months, is placed in the same year.'
  - where: 'setting'
    claim: 'Chisleu and Nisan in the same year: explained by a civil year beginning in autumn, in which Chisleu is the third month and Nisan the seventh; Nisan is three months after Chisleu'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'Nehemiah here uses the computation of time current in anterior Asia, and also among the Jews after the captivity in civil matters, and which made the new year begin in autumn… Tishri is the first, Chisleu the third, and Nisan the seventh month.'
  - where: 'setting'
    claim: 'Nehemiah''s appointment as governor is dated 444 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '444 | Nehemiah appointed governor of Judea.'
  - where: 'setting'
    claim: 'Nehemiah''s coming to Jerusalem is dated 445 B.C.'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'Nehemiah’s appearance at Jerusalem can be firmly dated at 445 B.C.'
  - where: 'setting'
    claim: 'Two explanations of Chisleu and Nisan in the same year: the king''s regnal year began later than the calendar year, or a civil year beginning in autumn'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'This can only be explained on the grounds that either the twentieth year of Artaxerxes did not coincide with the year of the calendar, but began later, or that Nehemiah here uses the computation of time current in anterior Asia'
  - where: 'setting'
    claim: 'The three adversaries are named in this chapter (2:10, 19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard it, they laughed us to scorn'
  - where: 'thread'
    claim: 'The chapter credits the king''s grant and the people''s resolve to the hand of God (2:4, 8, 12, 18, 20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'And the king granted me, according to the good hand of my God upon me.'
  - where: 'note 2:3 “Why Nisan, and why the sepulchres”'
    claim: 'Nehemiah waited months after the news before speaking to the king, until Nisan; the KnoWhy asks why'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'However, Nehemiah still waits months to create the conditions to speak about this with the king, not talking about it with him until the month of Nissan (Nehemiah 2:1).'
  - where: 'note 2:3 “Why Nisan, and why the sepulchres”'
    claim: 'Nowruz, the Persian new year, fell in Nisan, when the king granted requests; Nehemiah likely waited for it'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'The ancient Persian (Iranian) new year celebration, known as Nowruz, takes place during the month of Nissan. One common tradition during Nowruz was that the king would give gifts or grant requests to anyone who asked.'
  - where: 'note 2:3 “Why Nisan, and why the sepulchres”'
    claim: 'Tombs and fire would have weighed with a Zoroastrian king'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'In Nehemiah’s brief comment, he appeals to Iranian religion by mentioning tombs and fire, two things a Zoroastrian would have seen as especially important.'
  - where: 'note 2:3 “Why Nisan, and why the sepulchres”'
    claim: 'The earth was holy; a tomb not kept sealed could let bones touch the earth, a serious sin'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'If a tomb were not maintained well and kept properly sealed, animals could disturb bones, causing them to come into contact with the earth, a serious sin for Zoroastrians.'
  - where: 'note 2:3 “Why Nisan, and why the sepulchres”'
    claim: 'Fire was sacred; burned gates would almost certainly have meant burned defenders'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'In Zoroastrianism, fire was also sacred… The gates of Jerusalem, as in the case of all ancient cities, would have been heavily defended places during an attack, and burning them would almost certainly have involved burning defenders.'
  - where: 'note 2:3 “Why Nisan, and why the sepulchres”'
    claim: 'The king''s religion would eventually be known as Zoroastrianism'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'Part of the answer to this question likely lies in the religion of the Achaemenid Persian rulers, a religion which would eventually be known as Zoroastrianism.'
  - where: 'note 2:4 “A prayer between the question and the answer”'
    claim: 'It would not have been becoming to serve the king with a sad face; Nehemiah feared because he could not tell how the king would take it'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'I had not been sad before him at the moment of presenting the cup to him (Bertheau), because it would not have been becoming to serve the king with a sad demeanour… he could not tell how the king would view the matter'
  - where: 'note 2:4 “A prayer between the question and the answer”'
    claim: '“Let the king live for ever” was the accustomed form of wishing the king well'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'He nevertheless openly expressed his desire, prefacing it by the accustomed form of wishing the king prosperity, saying: "Let the king live for ever;" comp. Daniel 2:4; Daniel 3:9.'
  - where: 'note 2:4 “A prayer between the question and the answer”'
    claim: 'The king''s question showed he was inclined to help; Nehemiah prayed to ensure divine help in the request he was about to make'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'The question shows that the king was inclined to relieve the distress of Jerusalem which had been just stated to him. "And so I prayed to the God of heaven," to ensure divine assistance in the request he was about to lay before the king.'
  - where: 'note 2:4 “A prayer between the question and the answer”'
    claim: 'Nehemiah was fearful but took courage from a prayer of the heart'
    key: amistad-modern-nehemiahs
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/12/wanted-modern-nehemiahs?lang=eng'
    quote: 'Nehemiah was fearful at first, but taking courage from a prayer of the heart, he asked the king for permission to temporarily journey to Jerusalem.'
  - where: 'note 2:8 “The king granted, by the good hand of my God”'
    claim: 'The Hebrew word behind “palace” (birah) is a late, probably borrowed word for a castle or fortress, used here of the fortress near the temple'
    key: bdb
    url: 'https://biblehub.com/hebrew/1002.htm'
    quote: 'בִּירָה noun feminine castle, palace (late & probably loan-word; compare As bîrtu, fortress… 1 of temple at Jerusalem 1 Chronicles 29:1,19 הַבִּירָה; of for-tress near temple Nehemiah 2:8; Nehemiah 7:2'
  - where: 'note 2:8 “The king granted, by the good hand of my God”'
    claim: 'The word in Neh 2:8 is birah (H1002)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'הַ/בִּירָ֤ה'
  - where: 'note 2:8 “The king granted, by the good hand of my God”'
    claim: 'The text of 2:6–8 and 2:18: the time set, the letters, the timber, the good hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'Then I told them of the hand of my God which was good upon me; as also the king’s words that he had spoken unto me.'
  - where: 'note 2:8 “The king granted, by the good hand of my God”'
    claim: 'Nearly the same words are used of Ezra''s journey (Ezra 7:6, 9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: 'according to the good hand of his God upon him'
  - where: 'note 2:10 “Sanballat, Tobiah and Geshem”'
    claim: 'Sanballat was governor of Samaria; Tobiah an Ammonite official influential in Jerusalem; both feared for their positions'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Sanballat was the governor of Samaria. Tobiah was an Ammonite official and an influential member of the community in Jerusalem. These men were threatened by Nehemiah’s arrival because they were worried that their influential positions might be compromised.'
  - where: 'note 2:10 “Sanballat, Tobiah and Geshem”'
    claim: 'Sanballat, called the Horonite, led the Samaritan opposition'
    key: bd-sanballat
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sanballat?lang=eng'
    quote: 'Called the Horonite, a leader of the Samaritan opposition to Nehemiah (Neh. 2:10, 19; 4:1, 7; 6:1–14; 13:28).'
  - where: 'note 2:10 “Sanballat, Tobiah and Geshem”'
    claim: 'All three, Geshem included, were Persian officials who opposed the rebuilding chiefly for fear of losing political authority'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Sanballat the Horonite, Tobiah the Ammonite, and Geshem the Arab, all Persian officials, viewed Nehemiah with suspicion and opposed his efforts to rebuild the city primarily because it could mean a loss of their political authority in the region.'
  - where: 'note 2:10 “Sanballat, Tobiah and Geshem”'
    claim: 'Sanballat and Tobiah had held power in Samaria and its environs during the exile'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Two of the figures who frequently opposed Nehemiah are Sanballat and Tobiah, who had political power in Samaria and its environs during the time of the Babylonian exile and did not want to lose it'
  - where: 'note 2:10 “Sanballat, Tobiah and Geshem”'
    claim: 'The text names them again in chapters 4, 6 and 13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'When Sanballat the Horonite, and Tobiah the servant, the Ammonite, heard of it, it grieved them exceedingly that there was come a man to seek the welfare of the children of Israel.'
  - where: 'note 2:17 “Why the wall mattered”'
    claim: 'The text of 2:17–18: the reproach, “let us,” and the people''s answer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'come, and let us build up the wall of Jerusalem, that we be no more a reproach.'
  - where: 'note 2:17 “Why the wall mattered”'
    claim: 'The report in Susa spoke of affliction and reproach (Neh. 1:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng'
    quote: 'are in great affliction and reproach'
  - where: 'note 2:17 “Why the wall mattered”'
    claim: 'No one, not the priests or nobles, knew of the night survey before the appeal (2:16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'neither had I as yet told it to the Jews, nor to the priests, nor to the nobles, nor to the rulers'
  - where: 'note 2:20 “No portion, nor right, nor memorial”'
    claim: 'The question “will ye rebel against the king?” was ironic: they did not credit the Jews with power to fortify a city; the charge returns in 6:6'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'The irony lies in the fact that they did not give the Jews credit for power to build fortifications, so as to be able to rebel. Comp. Nehemiah 6:6, where Sanballat, in an open letter to Nehemiah, again reproaches them with rebellion.'
  - where: 'note 2:20 “No portion, nor right, nor memorial”'
    claim: '“Right” is the word of 2 Sam. 19:28; only members of the congregation, who may hope to live on in their descendants in Jerusalem, have a memorial there'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'צדקה like 2 Samuel 19:29. זכּרון, memorial; only members of the congregation, who may hope to live in their descendants in Jerusalem, can be said to have a memorial there.'
  - where: 'note 2:20 “No portion, nor right, nor memorial”'
    claim: 'The word for “right” in Neh. 2:20 is tsedaqah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'וּ/צְדָקָ֛ה'
  - where: 'note 2:20 “No portion, nor right, nor memorial”'
    claim: 'The same word, tsedaqah, stands in 2 Sam. 19:28 (Hebrew 19:29)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'צְדָקָ֔ה'
  - where: 'note 2:20 “No portion, nor right, nor memorial”'
    claim: 'Tsedaqah, righteousness, in a case or cause means a right, as in 2 Sam. 19:29 (KJV 19:28)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6666.htm'
    quote: '3 righteousness, in a case or cause, בצדקתי החזקתי Job 27:6 on my righteousness I hold fast; ׳מה ישׁ לי עוד צ 2 Samuel 19:29 what right have I yet ?'
  - where: 'christ'
    claim: 'The work of disciples now centers on the Lord''s house and law, and the protection found in Him'
    key: cfm-ot-2026-31
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/31?lang=eng'
    quote: 'Their experiences can inform and inspire ours because we too are doing a great work. And like theirs, our work has much to do with the house of the Lord, the law of the Lord, and the spiritual protection we find in Him.'
  - where: 'christ'
    claim: 'The Lord made a way for His people to return to Jerusalem and, more importantly, to their covenants'
    key: cfm-ot-2026-31
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/31?lang=eng'
    quote: 'the Lord made a way for His people to return—both to Jerusalem and, more importantly, to their covenants.'
