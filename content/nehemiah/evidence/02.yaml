chapter: 2
claims:
  - where: 'when'
    claim: 'The walls were rebuilt in about 444 B.C.'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Under Nehemiah’s direction, the walls of Jerusalem were rebuilt in about 444 BC.'
  - where: 'when'
    claim: 'The twentieth year of Artaxerxes is approximately 445 B.C.'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The timeframe for this discussion appears to be December in the twentieth year of King Artaxerxes’s reign (approximately 445 BC).'
  - where: 'setting'
    claim: 'The Artaxerxes of Nehemiah 2:1 is Artaxerxes I Longimanus, 465–425 B.C., who had earlier hindered the building and commissioned Ezra and Nehemiah'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1) and to Nehemiah (Neh. 2:1; 5:14; 13:6).'
  - where: 'setting'
    claim: 'Nehemiah was the king’s cupbearer, a trusted position, because he tasted the wine'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'He was the king’s cupbearer, a significant and trusted position in the court of Artaxerxes because he would taste any wine to prove it was not poisoned before the king would drink.'
  - where: 'setting'
    claim: 'Scripture Helps divides Nehemiah 1–6 as the rebuilding of the walls'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Nehemiah 1–6: The rebuilding of Jerusalem’s walls.'
  - where: 'thread'
    claim: 'The need for God’s support to succeed is a common post-exilic theme, voiced in 2:20'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah’s strong response was that God would grant them success and that the leaders had no claim in Jerusalem. A common theme found in post-exilic literature is the need for God’s support in order to achieve success.'
  - where: 'section 1 plain'
    claim: '“Palace” (birah) in 2:8 is a castle or fortress; here the citadel belonging to the temple'
    key: bdb
    url: 'https://biblehub.com/hebrew/1002.htm'
    quote: 'בִּירָה noun feminine castle, palace (late & probably loan-word; compare As bîrtu, fortress'
  - where: 'section 1 plain'
    claim: 'The birah of 2:8 is the citadel by the temple; the house he enters is his own residence'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'the gates of the citadel which belongs to the house, i.e., to the temple. This citadel - בּירה, in Greek Βᾶρις - by the temple is mentioned here for the first time'
  - where: 'note 2:1 “Why he waited for Nisan, and why he was afraid”'
    claim: 'Nowruz, the Persian new year, fell in Nisan, when the king granted requests; Nehemiah likely waited for it'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'The ancient Persian (Iranian) new year celebration, known as Nowruz, takes place during the month of Nissan. One common tradition during Nowruz was that the king would give gifts or grant requests to anyone who asked.'
  - where: 'note 2:3 “Sepulchres and gates burned with fire”'
    claim: 'Nehemiah’s mention of tombs and fire appealed to things a Zoroastrian king held sacred'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'In Nehemiah’s brief comment, he appeals to Iranian religion by mentioning tombs and fire, two things a Zoroastrian would have seen as especially important.'
  - where: 'note 2:3 “Sepulchres and gates burned with fire”'
    claim: 'Earth was holy; a neglected tomb could let bones touch the soil, a serious sin'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'If a tomb were not maintained well and kept properly sealed, animals could disturb bones, causing them to come into contact with the earth, a serious sin for Zoroastrians.'
  - where: 'note 2:3 “Sepulchres and gates burned with fire”'
    claim: 'Fire was sacred; burned gates implied burned defenders, which would trouble Artaxerxes'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'burning them would almost certainly have involved burning defenders. Hearing that the gates of the city were burned would therefore have troubled a Zoroastrian like Artaxerxes.'
  - where: 'note 2:3 “Sepulchres and gates burned with fire”'
    claim: 'Nehemiah’s request shows concern for his ancestors and the covenant land'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah’s actions show concern for his ancestors and the covenant land. His initiative shows his courage to take action in order to resolve his concern. The emphasis on family history and temple work in the Church today likewise shows concern for ancestors and covenants.'
  - where: 'note 2:4 “A prayer between the question and the answer”'
    claim: 'Nehemiah took courage from a prayer of the heart before asking the king'
    key: amistad-modern-nehemiahs
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/12/wanted-modern-nehemiahs?lang=eng'
    quote: 'Nehemiah was fearful at first, but taking courage from a prayer of the heart, he asked the king for permission to temporarily journey to Jerusalem.'
  - where: 'note 2:4 “A prayer between the question and the answer”'
    claim: 'In chapter 1 Nehemiah already knew he would have to ask the king for leave'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'He had faith that God could gather the people to the land but realized that he would need to ask the king for permission to leave.'
  - where: 'note 2:8 “The good hand of my God upon me”'
    claim: 'The “palace” of 2:8 is a castle or fortress'
    key: bdb
    url: 'https://biblehub.com/hebrew/1002.htm'
    quote: 'בִּירָה noun feminine castle, palace (late & probably loan-word; compare As bîrtu, fortress'
  - where: 'note 2:8 “The good hand of my God upon me”'
    claim: 'The citadel by the temple; the timber for the gates, not the wall itself; the house is Nehemiah’s residence as governor'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'the timber not being used for building the wall itself, but for the gates (Nehemiah 3:3, Nehemiah 3:6). "And for the house into which I come (to dwell)." This must be Nehemiah''s official residence as Pecha.'
  - where: 'note 2:8 “The good hand of my God upon me”'
    claim: 'Nehemiah asked for letters of passage and resources from local leaders'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah also requested royal letters that would grant him passage and give him resources from the local leaders in the region around Jerusalem for the city’s rebuilding.'
  - where: 'note 2:10 “Sanballat, Tobiah and Geshem”'
    claim: 'Sanballat was governor of Samaria, Tobiah an Ammonite official influential in Jerusalem; both feared for their positions'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Sanballat was the governor of Samaria. Tobiah was an Ammonite official and an influential member of the community in Jerusalem. These men were threatened by Nehemiah’s arrival because they were worried that their influential positions might be compromised.'
  - where: 'note 2:10 “Sanballat, Tobiah and Geshem”'
    claim: 'Sanballat led the Samaritan opposition, through chapters 4, 6 and 13'
    key: bd-sanballat
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sanballat?lang=eng'
    quote: 'Called the Horonite, a leader of the Samaritan opposition to Nehemiah (Neh. 2:10, 19; 4:1, 7; 6:1–14; 13:28).'
  - where: 'note 2:10 “Sanballat, Tobiah and Geshem”'
    claim: 'All three were Persian officials who opposed the work chiefly for fear of losing political authority'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Sanballat the Horonite, Tobiah the Ammonite, and Geshem the Arab, all Persian officials, viewed Nehemiah with suspicion and opposed his efforts to rebuild the city primarily because it could mean a loss of their political authority in the region.'
  - where: 'note 2:12 “A ride by night”'
    claim: 'The night ride was a reconnaissance kept secret from Sanballat and others; water sources and walls its focus'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This was a reconnaissance expedition to survey the conditions of the city, which was done at night to keep it secret from Sanballat and others who might have tried to oppose the rebuilding. The water sources and walls were of particular focus.'
  - where: 'note 2:17 “No more a reproach”'
    claim: 'The walls safeguarded the city and restored its religious, economic and political influence; neighbors feared for their power'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Rebuilding Jerusalem’s walls was essential for safeguarding the city against potential attackers and military threats. It also helped reestablish Jerusalem’s religious, economic, and political influence in the region.'
  - where: 'note 2:17 “No more a reproach”'
    claim: 'The walls were finished in 52 days, and the enemies admitted God’s hand'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Nehemiah and his group finished rebuilding the walls in only 52 days. The speed and quality of the work were so remarkable that even their adversaries admitted that “this work was wrought of … God.”'
  - where: 'note 2:20 “No portion, nor right, nor memorial”'
    claim: 'The question “will ye rebel?” was irony: they did not think the Jews able to fortify; the charge returns at 6:6'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'The irony lies in the fact that they did not give the Jews credit for power to build fortifications, so as to be able to rebel. Comp. Nehemiah 6:6, where Sanballat, in an open letter to Nehemiah, again reproaches them with rebellion.'
  - where: 'note 2:20 “No portion, nor right, nor memorial”'
    claim: 'A memorial in Jerusalem belongs to members of the congregation who hope to live on there in their descendants'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'זכּרון, memorial; only members of the congregation, who may hope to live in their descendants in Jerusalem, can be said to have a memorial there.'
  - where: 'note 2:20 “No portion, nor right, nor memorial”'
    claim: 'Nehemiah answered that God would give success and the leaders had no claim in Jerusalem; the need for God’s support is a post-exilic theme'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah’s strong response was that God would grant them success and that the leaders had no claim in Jerusalem. A common theme found in post-exilic literature is the need for God’s support in order to achieve success.'
  - where: 'christ'
    claim: 'The work of Ezra and Nehemiah concerns the house of the Lord, His law, and the spiritual protection found in Him'
    key: cfm-ot-2026-31
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/31?lang=eng'
    quote: 'Their experiences can inform and inspire ours because we too are doing a great work. And like theirs, our work has much to do with the house of the Lord, the law of the Lord, and the spiritual protection we find in Him.'
  - where: 'christ'
    claim: 'Nephi’s testimony that God prepares a way applies to Nehemiah’s confidence'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Likewise, we believe in Nephi’s testimony that God will prepare a way for His people to accomplish anything he may command them to do (see 1 Nephi 3:7).'
  - where: 'note 2:1 “Why he waited for Nisan, and why he was afraid”'
    claim: 'This Artaxerxes had hindered the Jews from building'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23)'
  - where: 'note 2:3 “Sepulchres and gates burned with fire”'
    claim: 'The earth was holy, and tombs were cut into rock so no body touched the soil'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'This is why Zoroastrian tombs were always carved into the rock in such a way that no part of the body would ever come into contact with the soil.'
  - where: 'note 2:3 “Sepulchres and gates burned with fire”'
    claim: 'Fire was sacred and not to be corrupted by burning bodies'
    key: sc-knowhy-862
    url: 'https://scripturecentral.org/knowhy/why-does-nehemiah-appeal-to-the-persian-king-s-religion-when-asking-for-help'
    quote: 'In Zoroastrianism, fire was also sacred, as it was a representation of the primary Zoroastrian deity known as Ahura Mazda. As in the case of the earth, one was also not allowed to corrupt fire by burning bodies.'
  - where: 'note 2:4 “A prayer between the question and the answer”'
    claim: 'The prayer of 1:11 and the prayer of 4:9 (scripture read in the Church’s edition)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng'
    quote: 'O Lord, I beseech thee'
  - where: 'note 2:8 “The good hand of my God upon me”'
    claim: 'Nehemiah’s requests and the escort, from the chapter text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'Now the king had sent captains of the army and horsemen with me.'
  - where: 'note 2:12 “A ride by night”'
    claim: 'The route and the secrecy of the inspection, from the chapter text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'And the rulers knew not whither I went, or what I did'
  - where: 'note 2:17 “No more a reproach”'
    claim: 'The wall finished in fifty-two days and the enemies’ admission (6:15–16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/6?lang=eng'
    quote: 'So the wall was finished in the twenty and fifth day of the month Elul, in fifty and two days.'
