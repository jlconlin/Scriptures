chapter: 6
claims:
  - where: 'when'
    claim: 'The Artaxerxes of Nehemiah is Artaxerxes I, 465–425 B.C., who commissioned Nehemiah'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1) and to Nehemiah (Neh. 2:1; 5:14; 13:6).'
  - where: 'when'
    claim: 'The walls were rebuilt in about 444 B.C.'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Under Nehemiah’s direction, the walls of Jerusalem were rebuilt in about 444 BC.'
  - where: 'when'
    claim: 'Nehemiah''s arrival in Jerusalem is dated 445 B.C.'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'Nehemiah’s appearance at Jerusalem can be firmly dated at 445 B.C.'
  - where: 'setting'
    claim: 'The Artaxerxes who stopped the building in Ezra 4 is the king who later commissioned Nehemiah: earlier in the same reign'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1) and to Nehemiah (Neh. 2:1; 5:14; 13:6).'
  - where: 'setting'
    claim: 'Sanballat was governor of Samaria; Tobiah an Ammonite official influential in Jerusalem; both feared for their positions'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Sanballat was the governor of Samaria. Tobiah was an Ammonite official and an influential member of the community in Jerusalem. These men were threatened by Nehemiah’s arrival because they were worried that their influential positions might be compromised.'
  - where: 'setting'
    claim: 'The wall restored Jerusalem''s influence, and neighbors feared for their power'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'It also helped reestablish Jerusalem’s religious, economic, and political influence in the region. Many neighbors in the surrounding area opposed Nehemiah’s project because they feared the impact it would have on their power and control.'
  - where: 'setting'
    claim: 'Having failed by open force in chapter 4, the enemies turned to snares against Nehemiah himself'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'When Sanballat and the enemies associated with him were unable to obstruct the building of the wall of Jerusalem by Open violence (Nehemiah 4), they endeavoured to ruin Nehemiah by secret snares.'
  - where: 'setting'
    claim: 'An earlier letter to Artaxerxes called Jerusalem rebellious and the king stopped the building'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/4?lang=eng'
    quote: 'building the rebellious and the bad city, and have set up the walls thereof, and joined the foundations.'
  - where: 'thread'
    claim: 'The verb for making afraid in verse 14 is the one in verses 9 and 19'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'the case related (Nehemiah 6:10-13) is given as only one of the chief events of the kind (מיראים, like Nehemiah 6:9, Nehemiah 6:19)'
  - where: 'thread'
    claim: '“Cast down in their own eyes” means discouraged'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'they sank in their own eyes, i.e., they felt themselves cast down, discouraged.'
  - where: 'note 6:3 “Why Nehemiah would not come down”'
    claim: 'Uchtdorf: Nehemiah refused to let distractions stop him from doing what the Lord wanted'
    key: uchtdorf-great-work
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/we-are-doing-a-great-work-and-cannot-come-down?lang=eng'
    quote: 'Nehemiah refused to allow distractions to prevent him from doing what the Lord wanted him to do.'
  - where: 'note 6:3 “Why Nehemiah would not come down”'
    claim: 'Uchtdorf: the same answer each time, under pretense of resolving the conflict'
    key: uchtdorf-great-work
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/we-are-doing-a-great-work-and-cannot-come-down?lang=eng'
    quote: 'Four times they entreated him to leave the safety of the city and meet with them under the pretense of resolving the conflict, but Nehemiah knew that their intent was to do him harm.'
  - where: 'note 6:5 “An open letter and a charge of treason”'
    claim: 'The Artaxerxes who stopped the wall in Ezra 4 is the king who commissioned Nehemiah'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1) and to Nehemiah (Neh. 2:1; 5:14; 13:6).'
  - where: 'note 6:5 “An open letter and a charge of treason”'
    claim: 'Artaxerxes ordered the building stopped after the letter of Ezra 4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/4?lang=eng'
    quote: 'Give ye now commandment to cause these men to cease, and that this city be not builded, until another commandment shall be given from me.'
  - where: 'note 6:9 “A prayer in the middle of the story”'
    claim: 'The Hebrew of 6:9b has no word for God: “and now, strengthen my hands,” the verb an imperative'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י'
  - where: 'note 6:9 “A prayer in the middle of the story”'
    claim: 'The verb is imperative; “O God” must be supplied; Nehemiah carries himself back to the moment he prayed; ancient versions made it “I strengthened”'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'Nehemiah hastily transports himself into the situation and feelings of those days when he prayed to God for strength. To make this request fit into the train of thought, we must supply: I however thought, or said, Strengthen, O God, my hands. חזּק is imperative.'
  - where: 'note 6:9 “A prayer in the middle of the story”'
    claim: 'The Greek version reads a statement, “I have strengthened my hands”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/nehemiah/6.htm'
    quote: 'Their hands shall be weakened from this work, and it shall not be done. Now therefore I have strengthened my hands.'
  - where: 'note 6:11 “A hired prophet and the temple”'
    claim: 'Under the law only priests could enter the holy place; Scripture Helps points to Numbers 18:7'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Under the law of Moses, Nehemiah was forbidden to enter the holy place because only priests holding the Aaronic Priesthood were allowed to do so.'
  - where: 'note 6:11 “A hired prophet and the temple”'
    claim: 'Numbers 18:7: the priests serve within the veil; the stranger who comes near is put to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'thou and thy sons with thee shall keep your priest’s office for every thing of the altar, and within the veil; and ye shall serve… and the stranger that cometh nigh shall be put to death.'
  - where: 'note 6:11 “A hired prophet and the temple”'
    claim: 'The JST footnote at 6:11 rewords the second question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/6?lang=eng'
    quote: 'JST Neh. 6:11 … mine enemy, that such a man as I would go …'
  - where: 'note 6:11 “A hired prophet and the temple”'
    claim: 'The JST changes in Nehemiah 6 are mainly better wording and have no historical or doctrinal significance'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Two changes in chapter 6 are mainly a better selection of words or a rearrangement of phrases to make the text more readable but have no historical or doctrinal significance.'
  - where: 'note 6:16 “Fifty-two days, and whose work it was”'
    claim: 'The speed and quality of the work were remarkable, and the adversaries admitted it was God''s work'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The speed and quality of the work were so remarkable that even their adversaries admitted that “this work was wrought of … God.”'
  - where: 'note 6:16 “Fifty-two days, and whose work it was”'
    claim: 'The speed is credible: repair of breaches and gates only, many builders, stone at hand, strain that could not last longer'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'the amount of the work itself, which must not be regarded as the rebuilding of the whole wall, but only as the restoration of those portions that had been destroyed, the repair of the breaches… and of the ruined gates, - a large portion of wall and at least one gate having remained uninjured.'
  - where: 'note 6:16 “Fifty-two days, and whose work it was”'
    claim: 'Stone was at hand in the ruins; the whole community built'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'the material, so far as stone was concerned, was close at hand, stone needing for the most part to be merely brought out of the ruins'
  - where: 'note 6:16 “Fifty-two days, and whose work it was”'
    claim: 'The whole community worked together on the wall'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'the zeal and relatively very large number of builders - the whole community, both the inhabitants of Jerusalem and the men of Jericho, Tekoa, Gibeon, Mizpah, etc. having combined their efforts'
  - where: 'note 6:16 “Fifty-two days, and whose work it was”'
    claim: 'Such strain could be kept up for fifty-two days but hardly longer'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'the kind of exertion demanded by such laborious work and unintermitted watchfulness as are described Nehemiah 4, though it might be continued for fifty-two days, could scarcely endure during a longer period'
  - where: 'note 6:16 “Fifty-two days, and whose work it was”'
    claim: '“Cast down in their own eyes” is an idiom like the fallen countenance: they lost heart'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/6.htm'
    quote: 'must be explained according to פּניו יפּלוּ, his countenance fell (Genesis 4:5), and לב יפּל, the heart fails (i.e., the courage) (1 Samuel 17:32): they sank in their own eyes, i.e., they felt themselves cast down, discouraged.'
  - where: 'note 6:16 “Fifty-two days, and whose work it was”'
    claim: 'The Hebrew reads “they fell… in their eyes”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם'
  - where: 'note 6:18 “Tobiah’s friends inside Judah”'
    claim: 'Tobiah was an influential member of the community in Jerusalem'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Tobiah was an Ammonite official and an influential member of the community in Jerusalem.'
  - where: 'note 6:18 “Tobiah’s friends inside Judah”'
    claim: 'Meshullam son of Berechiah repaired two sections of the wall; Eliashib was allied to Tobiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'After him repaired Meshullam the son of Berechiah over against his chamber.'
  - where: 'christ'
    claim: 'The footnote at 6:13 cites D&C 3:7–8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/6?lang=eng'
    quote: 'D&C 3:7 (7–8)'
  - where: 'christ'
    claim: 'The Church teaches from Nehemiah 1–6 that God helps those who press forward in His work to overcome opposition and distraction'
    key: ot-institute-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/29-2-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'As we press forward in doing God’s work, He will help us overcome opposition and distraction.'
  - where: 'christ'
    claim: 'D&C 3:7: Joseph Smith should not have feared man more than God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'For, behold, you should not have feared man more than God.'
  - where: 'christ'
    claim: 'D&C 3:8: had he been faithful, the Lord would have supported him against the fiery darts of the adversary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'Yet you should have been faithful; and he would have extended his arm and supported you against all the fiery darts of the adversary'
  - where: 'explore'
    claim: 'Lehonti came down after the fourth summons, unlike Nehemiah'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The efforts by Nehemiah’s enemies to get him to come down to the valley to meet them is similar to Amalikiah’s temptation of Lehonti in Alma 47:10–11. In Lehonti’s case, he eventually agreed to meet Amalikiah halfway down the mountain after the fourth summons'
