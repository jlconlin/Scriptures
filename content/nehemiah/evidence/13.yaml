chapter: 13
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'The date of the reading of verses 1–3 cannot be fixed more precisely than "on that day"'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'The date of the occurrence here related cannot be more precisely defined from the ההוּא בּיּום.'
  - where: 'when'
    claim: 'The Bible Chronology dates Nehemiah''s second mission 432 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '432 | Nehemiah’s second mission to Jerusalem. Prophecy of Malachi.'
  - where: 'setting'
    claim: 'The Bible Chronology sets the second mission in 432 B.C. and the prophecy of Malachi beside it'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '432 | Nehemiah’s second mission to Jerusalem. Prophecy of Malachi.'
  - where: 'setting'
    claim: 'Artaxerxes is called king of Babylon because the Persian kings had conquered Babylon; Keil takes the title to mean also that Nehemiah went to Babylon; how long he stayed cannot be determined'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'How long he remained there cannot be determined … Artaxerxes is here called king of Babylon, because the Persian kings had conquered the kingdom of Babylon … Nehemiah uses this title to express also the fact that he had travelled to Babylon.'
  - where: 'setting'
    claim: 'Malachi may have been a contemporary of Nehemiah'
    key: scripture-helps-mal
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/49-malachi?lang=eng'
    quote: 'meaning Malachi may have been a contemporary of Ezra and Nehemiah.'
  - where: 'setting'
    claim: 'The four episodes of Nehemiah''s return: temple space, the Levites'' offerings, the Sabbath, intermarriage'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'upon return addressed several concerning issues among the community: misuse of temple space, lack of offerings to support the Levites, profaning the Sabbath, and intermarriage with Gentiles.'
  - where: 'setting'
    claim: 'Nehemiah governed twelve years, to the thirty-second year of Artaxerxes; the first person resumes at 12:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/5?lang=eng'
    quote: 'from the twentieth year even unto the two and thirtieth year of Artaxerxes the king, that is, twelve years'
  - where: 'thread'
    claim: '"Forsaken" in 13:11 answers 10:39, and the tithe of 13:12 answers 10:38'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'On נעזב, comp. Nehemiah 10:39. … all Judah (the whole community) brought the tithe of the corn, etc., into the store-chambers of the temple; comp. Nehemiah 10:38.'
  - where: 'thread'
    claim: 'The oath of 13:25 takes up the marriage promise of chapter 10 (Keil''s 10:31 is the Hebrew numbering of the KJV''s 10:30)'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'and made them swear by God: Ye shall not give your daughters, etc.; comp. Nehemiah 10:31.'
  - where: 'thread'
    claim: 'The Sabbath reform of 13:15–22 takes up the pledge of 10:31'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'After the return from the exile Nehemiah made the observance of the Sabbath one of the chief points of his reformation (10:31; 13:15–22)'
  - where: 'thread'
    claim: 'Nehemiah''s closing summary names two things: purification from foreign practices and the restored order of worship'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'On the arrangements connected with these two subjects, viz., the purification from heathen practices, and the restoration of the regular performance of divine worship, was Nehemiah''s whole energy concentrated'
  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'The people applied the law to all foreigners ("the mixed multitude")'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Upon reviewing the law, the Judahites broadened this commandment to separate from all foreigners as is outlined in Ezra 9–10.'
  - where: 'section 2 plain'
    claim: 'Eliashib was Tobiah''s relative ("allied unto")'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'a large room of the temple complex had been assigned to Tobiah by the priest Eliashib, one of Tobiah’s relatives.'
  - where: 'section 4 plain'
    claim: '"Outlandish" means foreign'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/outlandish'
    quote: 'OUTLAND''ISH, adjective 1. Foreign; not native. Nevertheless, even him did outlandish women cause to sin. Nehemiah 13:26.'
  - where: 'section 4 plain'
    claim: '"Strangers" in 13:30 means foreign ways, chiefly the foreign marriages'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'נכר, strange, means foreign heathen customs, and chiefly marriages with heathen women'
  # ---- notes ----
  - where: 'note 13:1 “The law read against Ammon and Moab”'
    claim: 'The law looked back to Ammon''s and Moab''s old hostility (Deut. 23:4–5); the people broadened it to all foreigners, as in Ezra 9–10'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Because of past antagonism from the Ammonites and Moabites toward the Israelites, the law prohibited intermarriage with them (see Deuteronomy 23:4–5). Upon reviewing the law, the Judahites broadened this commandment to separate from all foreigners as is outlined in Ezra 9–10.'
  - where: 'note 13:1 “The law read against Ammon and Moab”'
    claim: 'Ruth''s marriage into Israel led to David''s forebears'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'even leading to the forebears of David.'
  - where: 'note 13:1 “The law read against Ammon and Moab”'
    claim: 'The footnotes point verse 1 to Deut. 23:3 and "mixed" to Ex. 12:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: '“Ammonite”: Deut. 23:3 (3–5). … “mixed”: Ex. 12:38.'
  - where: 'note 13:4 “A chamber for Tobiah in the house of God”'
    claim: 'Eliashib, a relative of Tobiah ("allied unto"), gave him a large room of the temple; Nehemiah cast out his household items, purified the chambers and restored them'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'the priest Eliashib, one of Tobiah’s relatives. Nehemiah ordered that Tobiah and his household items be cast out, the chambers purified, and the temple equipment and offerings returned to this storage room.'
  - where: 'note 13:4 “A chamber for Tobiah in the house of God”'
    claim: 'The chapter heading calls the room Tobiah''s dwelling place in the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'Tobiah is ejected from his dwelling place in the temple'
  - where: 'note 13:4 “A chamber for Tobiah in the house of God”'
    claim: 'The room held the offerings and the tithes owed to the Levites, singers and porters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'where aforetime they laid the meat offerings, the frankincense, and the vessels, and the tithes of the corn, the new wine, and the oil, which was commanded to be given to the Levites'
  - where: 'note 13:11 “The house of God forsaken”'
    claim: 'The covenant ended "we will not forsake the house of our God"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: 'and we will not forsake the house of our God.'
  - where: 'note 13:18 “The Sabbath that cost Jerusalem before”'
    claim: 'Breaking the Sabbath was a major reason for the judgments ending in Jerusalem''s destruction; Nehemiah''s people had not learned the lesson'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'Many of Nehemiah’s people had not learned this important lesson from the past: a major reason for the divine judgments which culminated in the Babylonian destruction of Jerusalem was the violation of Sabbath law (compare Jeremiah 17:21–27'
  - where: 'note 13:18 “The Sabbath that cost Jerusalem before”'
    claim: 'Nehemiah 13 draws on Jeremiah 17 and urges Israelites a century and a half later to keep the Sabbath better than their ancestors'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'The passage in Nehemiah 13 dealing with closing the gates of Jerusalem on the Sabbath, cited above, draws on the content of this Jeremiah passage. By doing so, Nehemiah 13 encourages postexilic Israelites, those living in Jerusalem a century and a half after the time of Jeremiah'
  - where: 'note 13:18 “The Sabbath that cost Jerusalem before”'
    claim: 'Buying and selling profaned the Sabbath'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: '“profaning the Sabbath” included the acts of buying and selling on the day that Jehovah had set apart as sacred.'
  - where: 'note 13:18 “The Sabbath that cost Jerusalem before”'
    claim: 'Nehemiah made the Sabbath one of the chief points of his reformation'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'After the return from the exile Nehemiah made the observance of the Sabbath one of the chief points of his reformation (10:31; 13:15–22)'
  - where: 'note 13:18 “The Sabbath that cost Jerusalem before”'
    claim: 'Jeremiah warned of fire in the gates if burdens were carried in on the Sabbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'then will I kindle a fire in the gates thereof, and it shall devour the palaces of Jerusalem'
  - where: 'note 13:19 “Shutting the gates at dusk”'
    claim: 'The gates were shut as it grew dark before the Sabbath and opened after it; Keil reasons that a watch was needed because the gates could not be kept closed all day to the inhabitants'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'He commanded that the gates of Jerusalem should be closed when it began to be dark before the Sabbath, and not re-opened till the Sabbath was over. … The placing of the watch was necessary, because the gates could not be kept strictly closed during the whole of the day'
  - where: 'note 13:19 “Shutting the gates at dusk”'
    claim: 'With the merchants camped outside, Keil reads the Sabbath rest as broken outside the gates (the trade went on there)'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'Thus, because egress from the city could not be refused to the inhabitants, the rest of the Sabbath was broken outside the gates.'
  - where: 'note 13:22 “My kindnesses and Thy mercy”'
    claim: 'The word behind "good deeds" (13:14) and "mercy" (13:22) is the same, ḥesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'תֶּ֣מַח חֲסָדַ֗/י … כְּ/רֹ֥ב חַסְדֶּֽ/ךָ'
  - where: 'note 13:22 “My kindnesses and Thy mercy”'
    claim: 'Ḥesed is goodness, kindness; in the plural, pious acts, citing Neh. 13:14'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'חֶ֫סֶד: 247 noun masculine2Samuel 16:17 goodness, kindness; … plural pious acts2Chronicles 32:32; 35:26; Nehemiah 13:14.'
  - where: 'note 13:22 “My kindnesses and Thy mercy”'
    claim: '"The greatness of thy mercy" (13:22) is the abundant kindness of God, the phrase of Neh. 9:17 and Ex. 34:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'a. abundant: רַבחֶֿסֶד abundant, plenteous in kindness (goodness) Numbers 14:18 (J), Nehemiah 9:17 (Qr), Joel 2:13; … (compare Exodus 34:6 J E; Psalm 86:15); רֹב חַסְדְּךָ Nehemiah 13:22'
  - where: 'note 13:22 “My kindnesses and Thy mercy”'
    claim: 'Chapter 9 praised God as "of great kindness"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'but thou art a God ready to pardon, gracious and merciful, slow to anger, and of great kindness, and forsookest them not.'
  - where: 'note 13:24 “The Jews’ language”'
    claim: 'The Jews'' language is Hebrew'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'some of the children could no longer speak Hebrew (referred to here as the “Jews’ language”'
  - where: 'note 13:24 “The Jews’ language”'
    claim: 'The Hebrew is one adverb, "in Jewish," the same word as in 2 Kgs. 18:26 and Isa. 36:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/3066.htm'
    quote: 'adverb in Jewish = in the Jewish language 2 Kings 18:26,28 = Isaiah 36:11,13 2Chronicles 32:18; Nehemiah 13:24.'
  - where: 'note 13:24 “The Jews’ language”'
    claim: 'Ashdod was one of the five Philistine cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'five lords of the Philistines; the Gazathites, and the Ashdothites'
  - where: 'note 13:26 “Solomon’s example”'
    claim: '"Outlandish" means foreign'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/outlandish'
    quote: 'OUTLAND''ISH, adjective 1. Foreign; not native. Nevertheless, even him did outlandish women cause to sin. Nehemiah 13:26.'
  - where: 'note 13:26 “Solomon’s example”'
    claim: 'Nehemiah did not insist on dissolving the marriages but made the men swear to desist from such marriages'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'Nehemiah did not insist on the immediate dissolution of these marriages, but caused the men to swear that they would desist from such connections, setting before them, in Nehemiah 13:26, how grievous a sin they were committing.'
  - where: 'note 13:26 “Solomon’s example”'
    claim: 'Solomon''s wives turned his heart after other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'when Solomon was old, that his wives turned away his heart after other gods'
  - where: 'note 13:28 “The high priest’s grandson”'
    claim: 'The son of Joiada married Sanballat''s daughter and would not dismiss her; the marriage polluted the priesthood, whose sacredness a priest considered even in choosing a wife (Lev. 21:7, 14); "Remember them" asks God to punish'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'had married a daughter of Sanballat the Horonite … and would not comply with the demand of Nehemiah that he should dismiss this wife. … For this marriage was a pollution of the priesthood … which a priest was to consider even in the choice of a wife'
  - where: 'note 13:28 “The high priest’s grandson”'
    claim: '"Remember them" is a wish that God would punish them'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/13.htm'
    quote: 'that God would be mindful of them (להם, of those who had done such evil) on account of this pollution, etc., i.e., would punish or chastise them for it.'
  - where: 'note 13:28 “The high priest’s grandson”'
    claim: 'Josephus''s Manasseh, threatened with loss of the priesthood for marrying a foreign woman, Sanballat''s daughter, became first high priest on Gerizim'
    key: bd-temple-on-mount-gerizim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-on-mount-gerizim?lang=eng'
    quote: 'Manasseh, brother of Jaddua the high priest, was threatened by the Jews with deprivation of his priestly office because of a marriage he had contracted with a foreign woman. His father-in-law, Sanballat … Manasseh was its first high priest.'
  - where: 'note 13:28 “The high priest’s grandson”'
    claim: 'The Bible Dictionary compares Neh. 13:28 as probably the same event, though Josephus dates it 90 years later, and says the Gerizim worship embittered the schism'
    key: bd-temple-on-mount-gerizim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-on-mount-gerizim?lang=eng'
    quote: 'With this account must be compared Neh. 13:28, which from the names and circumstances probably relates to the same event. Josephus places the event 90 years later than the Bible. The establishment of the counterfeit worship on Gerizim embittered and perpetuated the schism'
  - where: 'note 13:28 “The high priest’s grandson”'
    claim: 'The footnote to verse 29 points to Mal. 2:8; the high priest marries a virgin of his own people (Lev. 21:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: '“covenant”: Mal. 2:8 (4–8). TG Priesthood, Oath and Covenant.'
  # ---- christ / explore ----
  - where: 'christ'
    claim: 'Latter-day Saints keep no list of Sabbath rules but are invited to consider their activities to keep the day holy'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'While we do not encourage lists of dos and don’ts in the Church today, we are invited to consider our activities on the Sabbath day to maintain its holiness.'
  - where: 'christ'
    claim: 'The Son of Man is Lord of the Sabbath; the Lord gives His holy day to keep a disciple unspotted from the world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'And that thou mayest more fully keep thyself unspotted from the world, thou shalt go to the house of prayer and offer up thy sacraments upon my holy day'
  - where: 'explore'
    claim: 'Malachi''s prophecy is set beside Nehemiah''s second mission'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '432 | Nehemiah’s second mission to Jerusalem. Prophecy of Malachi.'
