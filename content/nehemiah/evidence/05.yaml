chapter: 5
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Nehemiah was governor twelve years, about 445–433 B.C.'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Verse 14 points out that Nehemiah served as governor for twelve years (around 445–433 BC).'
  - where: 'when'
    claim: 'The walls were rebuilt in about 444 B.C.'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Under Nehemiah’s direction, the walls of Jerusalem were rebuilt in about 444 BC.'
  - where: 'setting'
    claim: 'The returnees relied on loans; Persian taxes, time on the rebuilding and debts squeezed them'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Because of the political turmoil, Persian taxes, time spent to assist in the reconstruction, and outstanding loans, some of the Jews were stuck in a tight financial corner.'
  - where: 'setting'
    claim: 'The "bondage" of verse 18 is the service of building the walls'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'העבדה is the service of building the walls of Jerusalem.'
  - where: 'setting'
    claim: 'Nehemiah held the same office as Zerubbabel; his second term is not dated'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah later served another term as governor as mentioned in 13:6, but the length of the second term is not specified.'
  - where: 'thread'
    claim: 'The fear of God was the inspiration for Nehemiah''s conduct'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The inspiration for his actions was his fear of God.'
  - where: 'thread'
    claim: 'The law forbidding usury to a poor brother is Ex. 22:25 and Lev. 25:36'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The law, moreover, forbade the taking of any usury from their brethren, their poor fellow-countrymen, Exodus 22:25 and Leviticus 25:36.'
  - where: 'christ'
    claim: 'Lev. 25:36 forbids usury to a poor brother, "that thy brother may live with thee"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'Take thou no usury of him, or increase: but fear thy God; that thy brother may live with thee.'
  - where: 'section 1 plain'
    claim: 'Verse 2: those without property ask that grain be provided'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'These were the words of those workers who had no property. נקחה (from לקח), not to take by force, but only to desire that corn may be provided.'
  - where: 'section 2 plain'
    claim: 'The hundredth was interest, probably one per cent a month'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The hundredth taken as interest is probably, like the centesima of the Romans, to be understood of a monthly payment.'
  - where: 'section 3 plain'
    claim: 'The bread of the governor is the food and wine the community had to furnish him'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: '"The bread of the Pechah" is, according to Nehemiah 5:15, the food and wine with which the community had to furnish him.'
  - where: 'section 2 plain'
    claim: 'Verse 10: the participle says Nehemiah and his men had themselves lent'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The participle נשׁים says: we are those who have lent.'
  - where: 'section 2 plain'
    claim: 'Verse 12: the priests were called and the creditors made to swear before them'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'Nehemiah called the priests, and made them (the creditors) swear to do according to this promise'
  - where: 'note 5:14 “The governor who paid his own way”'
    claim: 'He tells of his own example as part of his exhortation to the nobles'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'As part of his exhortation to the nobles to not enrich themselves at the expense of the poor, Nehemiah shared his example of wisely managing resources without enriching himself.'
  - where: 'christ'
    claim: 'Zion has no poor (Moses 7:18), as Ludlow sets beside Neh. 5'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This community was struggling to resolve issues that a Zion community eliminates: having no poor among them (see Moses 7:18).'
  # ---- notes ----
  - where: 'note 5:5 “The same flesh as their brethren”'
    claim: 'Lev. 25:39–41: a poor brother sold serves as a hired servant and goes free with his children at the jubilee'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'But as an hired servant, and as a sojourner, he shall be with thee, and shall serve thee unto the year of jubilee'
  - where: 'note 5:7 “Lending to a brother”'
    claim: 'BDB: mashsha, lending on interest, or usury, at Neh. 5:7 and 5:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/4855.htm'
    quote: 'מַשָּׁא noun masculineNehemiah 5:10 lending on interest, or usury; — Nehemiah 5:7 (as accusative of congnate meaning with verb), Nehemiah 5:10.'
  - where: 'note 5:7 “Lending to a brother”'
    claim: 'BDB: nashah, to lend, become a creditor'
    key: bdb
    url: 'https://biblehub.com/hebrew/5383.htm'
    quote: 'to lend, become a creditor'
  - where: 'note 5:7 “Lending to a brother”'
    claim: 'Usury in biblical English often means simply interest; Israel was forbidden it toward a fellow member; latter-day revelation has no restriction'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'In biblical English it often means simply charging interest on a loan. At other times it implies an unduly high rate of interest.'
  - where: 'note 5:7 “Lending to a brother”'
    claim: 'The restriction concerns lending to a fellow church member; latter-day revelation does not restrict interest'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'The restriction, however, seems to be when lending to a fellow church member. … Latter-day revelation does not contain restrictions against interest charges.'
  - where: 'note 5:7 “Lending to a brother”'
    claim: 'Ex. 22:25 forbids being a usurer to the poor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'If thou lend money to any of my people that is poor by thee, thou shalt not be to him as an usurer, neither shalt thou lay upon him usury.'
  - where: 'note 5:13 “The shaken lap”'
    claim: 'The lap of the garment is where things are carried; Nehemiah gathered it up and shook it out as a sign'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The symbolical action consisted in Nehemiah''s gathering up his garment as if for the purpose of carrying something, and then shaking it out with the words above stated, which declared the meaning of the act.'
  - where: 'note 5:13 “The shaken lap”'
    claim: 'Amen was the response of one to whom an oath was administered'
    key: bd-amen
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amen?lang=eng'
    quote: 'Amen was the proper response of a person to whom an oath was administered (1 Chr. 16:36; Neh. 5:13; 8:6).'
  - where: 'note 5:14 “The governor who paid his own way”'
    claim: 'Nehemiah did not use the governor''s food allowance and did not lay heavy burdens on the people'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'He claimed that he did not even use the governor’s food allowance. And unlike governors, he did not lay heavy burdens upon the people.'
  - where: 'note 5:14 “The governor who paid his own way”'
    claim: 'The Student Manual: righteous Book of Mormon kings worked for their living rather than burden their people (Mosiah 2:14; 29:40)'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'The righteous kings in the Book of Mormon had the same sense of public morality and worked for their livelihood rather than burdening their people (see Mosiah 2:14; 29:40).'
  - where: 'note 5:14 “The governor who paid his own way”'
    claim: 'Mosiah 2:14: Benjamin labored with his own hands so the people would not be laden with taxes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'And even I, myself, have labored with mine own hands that I might serve you, and that ye should not be laden with taxes'
  - where: 'note 5:19 “Think upon me, my God, for good”'
    claim: 'The last verse turns his defense toward God, asking Him to remember what he has done'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The last verse turns the focus of his defense to God, asking Him to remember all that Nehemiah has done for the people.'
  - where: 'note 5:19 “Think upon me, my God, for good”'
    claim: 'Asking God for assistance and remembrance is a major theme of the book'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This is another reminder of the major themes of the book: asking God for assistance and remembrance.'
  - where: 'note 5:19 “Think upon me, my God, for good”'
    claim: 'The refrain returns at 13:14, 22 and 31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'Remember me, O my God, for good.'
  # ---- christ / explore ----
  - where: 'christ'
    claim: 'Nehemiah tried to create a Zion-like community by relieving the poor; Zion has no poor (Moses 7:18)'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This is Nehemiah’s efforts to create a Zion-like community by alleviating the suffering of the poor.'
  - where: 'christ'
    claim: 'Moses 7:18: Zion had no poor among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'and there was no poor among them'
  - where: 'christ'
    claim: 'The footnote at Mosiah 2:14 cross-references Neh. 5:14–15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: '“labored”: Deut. 17:17; Neh. 5:14 (14–15); 1 Cor. 9:18 (4–18).'
  - where: 'christ'
    claim: 'Mosiah 2:14: Benjamin labored so the people would not be laden with taxes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'that ye should not be laden with taxes'
  - where: 'christ'
    claim: 'The footnote at Mosiah 2:17 cross-references Matt. 25:40 and D&C 42:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: '“service”: Matt. 25:40; D&C 42:31 (30–31). TG Service.'
  - where: 'christ'
    claim: 'The footnote at Mosiah 2:18 (“serve”) cross-references Luke 22:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: '“serve”: Luke 22:26.'
  - where: 'christ'
    claim: 'Luke 22:26–27: the chief as he that serves; the Lord among them as he that serves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'he that is chief, as he that doth serve. … I am among you as he that serveth.'
  - where: 'christ'
    claim: 'Matt. 25:40: done to the least of my brethren, done to me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/25?lang=eng'
    quote: 'Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.'
  - where: 'christ'
    claim: 'D&C 42:31: substance imparted to the poor, laid before the bishop, is done unto the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/42?lang=eng'
    quote: 'inasmuch as ye impart of your substance unto the poor, ye will do it unto me; and they shall be laid before the bishop of my church'
  - where: 'christ'
    claim: 'Mosiah 2:17: service of one''s fellow beings is service of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'when ye are in the service of your fellow beings ye are only in the service of your God'
  - where: 'explore'
    claim: 'Neh. 10:31: the covenant includes leaving the exaction of every debt in the seventh year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: 'and that we would leave the seventh year, and the exaction of every debt.'
