chapter: 5
claims:
  - where: 'setting'
    claim: 'The events of chapters 5 and 6 occurred during the building of the wall'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The events related in this and the following chapter also occurred during the building of the wall.'
  - where: 'setting'
    claim: 'Returnees relied on loans; Persian taxes, time given to the reconstruction and outstanding loans left some in a tight financial corner'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'they relied on loans and other assistance to restart their lives. Because of the political turmoil, Persian taxes, time spent to assist in the reconstruction, and outstanding loans, some of the Jews were stuck in a tight financial corner.'
  - where: 'setting'
    claim: 'Nehemiah was governor twelve years, around 445–433 B.C., the office Zerubbabel had held'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Verse 14 points out that Nehemiah served as governor for twelve years (around 445–433 BC). … This was the same position that Zerubbabel held earlier'
  - where: 'setting'
    claim: 'The episode gave Nehemiah occasion to tell how he had filled the office of governor'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The transaction above related gave Nehemiah occasion to speak in his narrative of the unselfishness with which he had filled the office of governor'
  - where: 'thread'
    claim: 'The returnees were being brought back into bondage by their own people; Nehemiah was trying to create a Zion-like community'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'the returnees were being reintroduced to bondage by their own people. … This is Nehemiah’s efforts to create a Zion-like community by alleviating the suffering of the poor.'
  - where: 'thread'
    claim: 'Verses 14–19 extend the unselfishness of the episode to Nehemiah''s whole career as governor'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'As in this occurrence he had used his credit to do away with the oppression of the people by wealthy usurers, so also had he shown himself unselfish during his whole official career'
  - where: 'section 2 plain'
    claim: 'Verse 7 as charging interest of a brother'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=ESV'
    quote: 'You are exacting interest, each from his brother.'
  - where: 'section 2 plain'
    claim: 'Verse 10 as Nehemiah and his men actually lending; verse 11 the interest'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=NRSVUE'
    quote: 'Moreover I and my brothers and my servants are lending them money and grain. Let us stop this taking of interest.'
  - where: 'section 3 plain'
    claim: 'Verse 18: the allowance not claimed because of the heavy labor on the people; prepared at his expense'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=ESV'
    quote: 'Now what was prepared at my expense for each day was one ox and six choice sheep and birds'
  - where: 'section 3 plain'
    claim: 'Verse 18 as the burden of labor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=NRSVUE'
    quote: 'because of the heavy burden of labor on the people'
  - where: 'note 5:8 “Redeemed by their brethren, sold by their brethren”'
    claim: 'The law let a poor Israelite sell himself and his children to raise money, but those sold were to go free at the jubilee (Lev. 25:39–41); this is the law behind verse 5'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'permitted Israelites, if they were poor, to sell themselves (Leviticus 25:39), and also their sons and daughters, to procure money. It required, however, that they who were thus sold should not be retained as slaves'
  - where: 'note 5:5 “Children given in pledge for their parents’ debts”'
    claim: 'The law on a poor brother sold to an Israelite (pointed to from this note): a hired servant until the jubilee'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'thou shalt not compel him to serve as a bondservant: But as an hired servant, and as a sojourner, he shall be with thee, and shall serve thee unto the year of jubilee'
  - where: 'note 5:8 “Redeemed by their brethren, sold by their brethren”'
    claim: 'The law on a poor brother sold to an Israelite: a hired servant until the jubilee, then home with his children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'thou shalt not compel him to serve as a bondservant: But as an hired servant, and as a sojourner, he shall be with thee, and shall serve thee unto the year of jubilee'
  - where: 'note 5:7 “Lending at interest to a poor brother”'
    claim: 'In biblical English usury often means simply charging interest; the law forbade it, apparently when lending to a fellow member; latter-day revelation has no restriction on interest'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'In biblical English it often means simply charging interest on a loan. At other times it implies an unduly high rate of interest. … The restriction, however, seems to be when lending to a fellow church member. … Latter-day revelation does not contain restrictions against interest charges.'
  - where: 'note 5:7 “Lending at interest to a poor brother”'
    claim: 'The Hebrew noun is a loan and the verb to lend; Exodus 22 uses the same word for a money-lender on interest; Nehemiah could not reproach lending as such'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'Nehemiah cannot reproach the nobles for lending loans, when he and his servants had, according to Nehemiah 5:10, done so likewise. … it is evident that נשׁה is one who lends money on usury, or carries on the business of a money-lender.'
  - where: 'note 5:7 “Lending at interest to a poor brother”'
    claim: 'Verse 10: Nehemiah and his men have lent; verse 11: restore pledged lands and remit the hundredth, probably one per cent a month, a heavy interest'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The hundredth taken as interest is probably, like the centesima of the Romans, to be understood of a monthly payment. One per cent. per month was a very heavy interest, and one which, in the case of the poor, might be exorbitant.'
  - where: 'note 5:7 “Lending at interest to a poor brother”'
    claim: 'Keil: the law forbade taking usury from a poor brother, Exodus 22:25 and Leviticus 25:36'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The law, moreover, forbade the taking of any usury from their brethren, their poor fellow-countrymen, Exodus 22:25 and Leviticus 25:36.'
  - where: 'note 5:7 “Lending at interest to a poor brother”'
    claim: 'Modern rendering of verse 10: Nehemiah and his men are lending'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=ESV'
    quote: 'Moreover, I and my brothers and my servants are lending them money and grain. Let us abandon this exacting of interest.'
  - where: 'note 5:7 “Lending at interest to a poor brother”'
    claim: 'Verses 7 and 10 have the same participle of the verb to lend'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'נֹשִׁ֥ים'
  - where: 'note 5:7 “Lending at interest to a poor brother”'
    claim: 'Exodus 22:25: the lender to the poor not to be as an usurer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'If thou lend money to any of my people that is poor by thee, thou shalt not be to him as an usurer, neither shalt thou lay upon him usury.'
  - where: 'note 5:8 “Redeemed by their brethren, sold by their brethren”'
    claim: 'Nehemiah and like-minded Jews in exile had redeemed Jews sold to the heathen, as far as their means allowed; the sale of brethren as bond-servants was forbidden by Leviticus 25:42'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'We (i.e., Nehemiah and the Jews living in exile, who were like-minded with him) have bought, in contrast to ye sell. … The sale of their brethren for bond-servants was forbidden by the law, Leviticus 25:42.'
  - where: 'note 5:8 “Redeemed by their brethren, sold by their brethren”'
    claim: 'Some had sacrificed to bring Jews out of bondage; the creditors were bringing returnees back into bondage'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah noted in his reproach that some had been sacrificing to bring Jews out of bondage back to Jerusalem, but through the greedy actions of these individuals he condemned, the returnees were being reintroduced to bondage by their own people.'
  - where: 'note 5:8 “Redeemed by their brethren, sold by their brethren”'
    claim: 'Verse 8: those sold would have to be bought back by the redeemers'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=NRSVUE'
    quote: 'but now you are selling your own kin, who must then be bought back by us!'
  - where: 'note 5:8 “Redeemed by their brethren, sold by their brethren”'
    claim: 'Verse 9: harsh conduct to brethren would give enemies occasion to slander'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'we ought not, by harsh and unloving conduct towards our brethren, to give our enemies occasion to calumniate us.'
  - where: 'note 5:8 “Redeemed by their brethren, sold by their brethren”'
    claim: 'Leviticus 25:42: the Lord''s servants brought out of Egypt are not to be sold as bondmen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'For they are my servants, which I brought forth out of the land of Egypt: they shall not be sold as bondmen.'
  - where: 'note 5:13 “Shaking out the fold of the garment”'
    claim: 'The gesture accompanied the oath, as in other Old Testament oath-making; it is shaking out the fold of the garment, like emptying one''s pockets'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Nehemiah, as found in other oath-making settings in the Old Testament, used a physical gesture to demonstrate what would happen to the people if they did not fulfill their oaths … something akin to emptying one’s pockets.'
  - where: 'note 5:13 “Shaking out the fold of the garment”'
    claim: 'Modern rendering of verse 13'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=ESV'
    quote: 'I also shook out the fold of my garment and said, “So may God shake out every man from his house and from his labor who does not keep this promise.'
  - where: 'note 5:14 “A governor who would not be a burden”'
    claim: 'The bread of the governor is the governor''s food allowance; former governors took a daily ration and laid heavy burdens'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=ESV'
    quote: 'neither I nor my brothers ate the food allowance of the governor. 15 The former governors who were before me laid heavy burdens on the people'
  - where: 'note 5:14 “A governor who would not be a burden”'
    claim: 'The word KJV renders “bondage” in verse 18 is ʿăbōdâ, service or labor'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'הָ/עֲבֹדָ֖ה'
  - where: 'note 5:14 “A governor who would not be a burden”'
    claim: 'Verse 18 rendered as the burden of labor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=NRSVUE'
    quote: 'yet with all this I did not demand the food allowance of the governor, because of the heavy burden of labor on the people.'
  - where: 'note 5:14 “A governor who would not be a burden”'
    claim: 'Nehemiah, a man of means, chose to serve without pay rather than take a salary from the people''s taxes'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'Nehemiah showed his greatness as the governor by not accepting a salary from the taxes of the people. He was wealthy and chose to serve without remuneration.'
  - where: 'note 5:14 “A governor who would not be a burden”'
    claim: 'The righteous Book of Mormon kings shared this public morality and worked rather than burden their people'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'The righteous kings in the Book of Mormon had the same sense of public morality and worked for their livelihood rather than burdening their people (see Mosiah 2:14; 29:40).'
  - where: 'note 5:14 “A governor who would not be a burden”'
    claim: 'King Benjamin labored with his own hands so his people would not be laden with taxes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'And even I, myself, have labored with mine own hands that I might serve you, and that ye should not be laden with taxes'
  - where: 'note 5:14 “A governor who would not be a burden”'
    claim: 'The inspiration for Nehemiah''s actions was the fear of God, which carries the notion of reverence'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The inspiration for his actions was his fear of God.'
  - where: 'note 5:19 “The first prayer to be remembered”'
    claim: '“Think upon me” in 5:19 is the same imperative zākar as “Remember me” in 13:14, 22 and 31'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'זָכְרָ/ה'
  - where: 'note 5:19 “The first prayer to be remembered”'
    claim: 'Modern rendering of verse 19'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nehemiah+5&version=ESV'
    quote: 'Remember for my good, O my God, all that I have done for this people.'
  - where: 'note 5:19 “The first prayer to be remembered”'
    claim: 'The last verse turns Nehemiah''s account toward God, asking Him to remember'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The last verse turns the focus of his defense to God, asking Him to remember all that Nehemiah has done for the people.'
  - where: 'note 5:19 “The first prayer to be remembered”'
    claim: 'Asking God for assistance and remembrance is a major theme of the book'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This is another reminder of the major themes of the book: asking God for assistance and remembrance.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The law''s reason: the Lord brought them out of Egypt, so they may not be sold as bondmen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'For they are my servants, which I brought forth out of the land of Egypt: they shall not be sold as bondmen.'
  - where: 'christ'
    claim: 'The community was struggling with what a Zion community eliminates, having no poor (Moses 7:18)'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This community was struggling to resolve issues that a Zion community eliminates: having no poor among them (see Moses 7:18).'
  - where: 'christ'
    claim: 'Moses 7:18: Zion had no poor among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'And the Lord called his people Zion, because they were of one heart and one mind, and dwelt in righteousness; and there was no poor among them.'
  - where: 'note 5:7 “Lending at interest to a poor brother”'
    claim: 'The footnote to verse 11 gives “the hundred pieces of silver” as another rendering of “the hundredth part”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/5?lang=eng'
    quote: 'the hundred pieces of silver'
  - where: 'explore'
    claim: 'The Bible Dictionary lists Ex. 22:25, Lev. 25:35–38 and Deut. 23:19–21 with Neh. 5:1–13 as the law against usury'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'Under the law of Moses, Israel was forbidden to charge usury, as in Ex. 22:25; Lev. 25:35–38; Deut. 23:19–21; Neh. 5:1–13'
  - where: 'explore'
    claim: 'Deut. 15:7–8 allowed lending to the poor on a pledge; Lev. 25:39–42 governs those who sold themselves'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/5.htm'
    quote: 'The law not only allowed to lend to the poor on a pledge (Deuteronomy 15:8), but also permitted Israelites, if they were poor, to sell themselves (Leviticus 25:39)'
