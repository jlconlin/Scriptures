chapter: 12
claims:
  - where: 'when'
    claim: 'The decree of Cyrus for the return is dated 537 B.C. in the Bible Chronology'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '537 | Decree of Cyrus for the return of the Jews.'
  - where: 'when'
    claim: 'Jaddua, the last high priest named, is dated 341 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '341 | Jaddua, high priest.'
  - where: 'setting'
    claim: 'The lists of chapter 12 are connected with Nehemiah''s register of 7:5, made partly earlier and partly later, and come before the dedication of the wall'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'These different lists are, in point of fact, all connected with the genealogical register of the Israelite population of the whole province, taken by Nehemiah (Nehemiah 7:5) … though the lists of the orders of priests and Levites in the present chapter were made partly at an earlier, and partly at a subsequent period.'
  - where: 'setting'
    claim: 'Verses 1–9 list the priests and Levites who came with Zerubbabel'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'An initial list of priests and Levites who came up with Zerubbabel covers the first nine verses.'
  - where: 'setting'
    claim: 'The high priests of verses 10–11 continue the list of 1 Chronicles 6:3–15'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This list of high priests is a continuation of the list in 1 Chronicles 6:3–15, extending it down to this later time period.'
  - where: 'setting'
    claim: 'The decree of Cyrus for the return is dated 537 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '537 | Decree of Cyrus for the return of the Jews.'
  - where: 'setting'
    claim: 'Eliashib is dated 453 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '453 | Eliashib, high priest.'
  - where: 'setting'
    claim: 'Jaddua is dated 341 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '341 | Jaddua, high priest.'
  - where: 'setting'
    claim: 'The Darius of verse 22 is Darius III, 336 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Darius Ⅲ (Neh. 12:22).'
  - where: 'setting'
    claim: 'Eliashib the high priest built the sheep gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'Then Eliashib the high priest rose up with his brethren the priests, and they builded the sheep gate'
  - where: 'setting'
    claim: 'Verse 27 picks up the story from 7:5'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This section picks up the story from Nehemiah 7:5 with the dedication of the Jerusalem wall.'
  - where: 'setting'
    claim: 'Nehemiah uses the first person in verses 31, 38 and 40 only of what he appointed or of his own place'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'only using the first (Nehemiah 12:31, Nehemiah 12:38, Nehemiah 12:40) person when speaking of what was appointed by himself, or of his own position.'
  - where: 'thread'
    claim: 'The joy of the day was the joy God had given by the success of building the wall'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'contributed to the enhancement of the general joy, the joy which God had given them by the success He had accorded to their work of building their wall.'
  - where: 'thread'
    claim: 'Verse 43 credits the joy to God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/12?lang=eng'
    quote: 'Also that day they offered great sacrifices, and rejoiced: for God had made them rejoice with great joy'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'David divided the priests into twenty-four courses serving a week each; only four returned and were subdivided again into twenty-four'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'David divided the priestly families into twenty-four courses. Four only returned from the captivity, and these were again subdivided into twenty-four. Each course officiated for a week at a time'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'The four houses of Ezra 2 were four of David''s orders, and the orders of Nehemiah 12 were formed from them'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'were the priests of the four (Davidic) orders of Jedaiah, Immer, Malchijah, and Harim … For the sake of restoring, according to the ancient institution, a greater number of priestly orders, the twenty-two orders enumerated in Nehemiah 12 were formed from these four divisions'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'Four houses of priests returned in Ezra 2, Jedaiah first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/2?lang=eng'
    quote: 'The priests: the children of Jedaiah, of the house of Jeshua, nine hundred seventy and three.'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'Ezra the scribe''s commission is dated 458 B.C., the return under Cyrus 537 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '458 | Commission of Ezra.'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'The footnote to Abijah in verse 4 points to Luke 1:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/12?lang=eng'
    quote: '4a “Abijah”: Luke 1:5.'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'Abijah was the eighth of David''s courses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/24?lang=eng'
    quote: 'The seventh to Hakkoz, the eighth to Abijah,'
  - where: 'note 12:24 “The singers and porters, after David’s order”'
    claim: 'The list was compiled from heads of clans, likely from temple documents; the Levites served in shifts; “man of God” probably points to David as author of the psalms used in temple liturgy'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Brief reference is made to the fact that the Levites served in shifts so that they could serve at the temple but also fulfill other responsibilities. The title “man of God” for David probably indicates his role as an author of biblical material, specifically the psalms, which were used as temple liturgy.'
  - where: 'note 12:24 “The singers and porters, after David’s order”'
    claim: 'David appointed Levites to praise with instruments he made'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/12?lang=eng'
    quote: '36a “musical”: 1 Chr. 23:5.'
  - where: 'note 12:30 “Purifying a wall”'
    claim: 'The purification was probably by sin offerings and burnt offerings, by analogy with 2 Chronicles 29:20, in a ritual unknown to us; then came the procession'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'This was probably done, judging from the analogy of 2 Chronicles 29:20, by the offering of sin-offerings and burnt-offerings, according to some special ritual unknown to us, as sacrifices of purification and dedication.'
  - where: 'note 12:30 “Purifying a wall”'
    claim: 'The footnote to “purified” points to Numbers 8:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/12?lang=eng'
    quote: '30a “purified”: Num. 8:7 (7–14)'
  - where: 'note 12:30 “Purifying a wall”'
    claim: 'The Levites were cleansed before they went in to serve'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/8?lang=eng'
    quote: 'And after that shall the Levites go in to do the service of the tabernacle of the congregation'
  - where: 'note 12:31 “Two thanksgiving choirs on the wall”'
    claim: 'The Hebrew of verse 31 has “two great thanksgivings and processions”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'שְׁתֵּ֣י תוֹדֹת֩ גְּדוֹלֹ֨ת וְ/תַהֲלֻכֹ֤ת'
  - where: 'note 12:31 “Two thanksgiving choirs on the wall”'
    claim: 'Todah in Neh. 12:31, 38, 40 means a thanksgiving choir or procession'
    key: bdb
    url: 'https://biblehub.com/hebrew/8426.htm'
    quote: '3 thanksgiving choir, procession, line, company Nehemiah 12:31,38,40'
  - where: 'note 12:31 “Two thanksgiving choirs on the wall”'
    claim: 'Two companies went in procession around the wall and met at the temple'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Two large thanksgiving companies, which were led by Ezra and Nehemiah, made processions around the wall and through various city gates. Both groups met at the temple, where the singers sang out and everyone rejoiced'
  - where: 'note 12:31 “Two thanksgiving choirs on the wall”'
    claim: 'Chapter 3 names the sheep gate and the towers of Meah and Hananeel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'they builded the sheep gate; they sanctified it, and set up the doors of it; even unto the tower of Meah they sanctified it, unto the tower of Hananeel.'
  - where: 'note 12:43 “Joy heard afar off”'
    claim: 'The rejoicing heard afar off is compared with Ezra 3:13'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'similarly at the beginning of the rebuilding of the temple in Ezra 3:13, the sounds of the people’s rejoicing could be heard afar off'
  - where: 'note 12:43 “Joy heard afar off”'
    claim: 'Latter-day Saints hold cultural celebrations and the Hosanna Shout at temple dedications'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'In a somewhat similar fashion, Latter-day Saints have held cultural celebrations and performed the Hosanna Shout to show rejoicing at the time of temple dedications.'
  - where: 'note 12:43 “Joy heard afar off”'
    claim: 'At the temple''s foundation joy and weeping could not be told apart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'So that the people could not discern the noise of the shout of joy from the noise of the weeping of the people'
  - where: 'note 12:44 “The portions given gladly”'
    claim: 'Overseers were needed for the treasury and tithes; the food was given generously, required by the law and in thanks; what had been in ruins was functioning again'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The food for the temple workers was generously donated by the people of Judah, partially because it was required by the law of Moses but also in order to thank the workers for their service. … What had been in ruins was now functioning again.'
  - where: 'thread'
    claim: 'The covenant of chapter 10 promised the offerings and tithes to the chambers of the house of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: 'unto the priests, to the chambers of the house of our God; and the tithes of our ground unto the Levites'
  - where: 'note 12:44 “The portions given gladly”'
    claim: 'On Nehemiah''s return the portions had not been given'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'And I perceived that the portions of the Levites had not been given them: for the Levites and the singers, that did the work, were fled every one to his field.'
  - where: 'note 12:44 “The portions given gladly”'
    claim: 'The Bible Chronology sets Malachi beside Nehemiah''s second mission'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '432 | Nehemiah’s second mission to Jerusalem. Prophecy of Malachi.'
  - where: 'christ'
    claim: 'Zacharias was of the course of Abia and served in the order of his course'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'And it came to pass, that while he executed the priest’s office before God in the order of his course,'
  - where: 'christ'
    claim: 'The footnote at verse 24 points to D&C 59:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/12?lang=eng'
    quote: '24a “thanks”: D&C 59:21.'
  - where: 'thread'
    claim: 'The storerooms of 12:44 are to be compared with the chambers promised in the covenant of 10:38–39'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'hence: these are chambers for store-places for the heave-offerings, etc.; comp. Nehemiah 10:38-39.'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'Verses 12–21 give the houses under Joiakim, a generation after the return; twenty-two houses are listed'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'under Joiakim, i.e., a generation after Zerubbabel''s return (Nehemiah 12:12-21), only twenty-two houses are enumerated'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'The full twenty-four may not have been formed at once, room being left for the priestly families without their register (Ezra 2:61); how the number was completed is not known'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'the full number of twenty-four was not immediately completed, only because, according to Ezra 2:61 and Nehemiah 7:63., three families of priests who could not find their registers returned'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'How the full twenty-four was completed cannot be determined'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/12.htm'
    quote: 'Whether, and how the full number of twenty-four was completed, cannot, for want of information, be determined.'
  - where: 'note 12:7 “Houses of priests for the temple’s courses”'
    claim: 'Zacharias, of the course of Abia, lived in the days of Herod'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'There was in the days of Herod, the king of Judæa, a certain priest named Zacharias, of the course of Abia'
  - where: 'christ'
    claim: 'Zacharias, of the course of Abia, lived in the days of Herod'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'There was in the days of Herod, the king of Judæa, a certain priest named Zacharias, of the course of Abia'
  - where: 'note 12:31 “Two thanksgiving choirs on the wall”'
    claim: 'Todah elsewhere means a thank offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/8426.htm'
    quote: '4 thank-offering'
  - where: 'note 12:31 “Two thanksgiving choirs on the wall”'
    claim: 'Chapter 3 records the building of the fish gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'But the fish gate did the sons of Hassenaah build'
  - where: 'note 12:31 “Two thanksgiving choirs on the wall”'
    claim: 'Chapter 3 records the repair of the old gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'Moreover the old gate repaired Jehoiada the son of Paseah'
  - where: 'note 12:31 “Two thanksgiving choirs on the wall”'
    claim: 'Chapter 3 records the repair of the tower of the furnaces'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'repaired the other piece, and the tower of the furnaces'
