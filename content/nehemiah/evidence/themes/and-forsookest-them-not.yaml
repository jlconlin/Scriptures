    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'נַעֲזֹ֖ב'
  - where: 'section “We will not forsake the house of our God”'
    claim: 'BDB lists Neh. 10:40 (KJV 10:39) under forsaking the house of YHWH'
    key: bdb
    url: 'https://biblehub.com/hebrew/5800.htm'
    quote: 'house of ׳י2Chronicles 24:18; Nehemiah 10:40'
  - where: 'section “We will not forsake the house of our God”'
    claim: 'Connection made by this page: the people answer God’s faithfulness in His own word. The prayer has just said three times (9:17, 19, 31) that God did not forsake them; “because of all this” (9:38) they covenant, and the covenant’s last line promises, in the same verb, not to forsake His house. The vow takes the shape of the mercy it answers and puts the people, in their promise, where God stood in their prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: 'and we will not forsake the house of our God'
