  - where: 'section “We will not forsake the house of our God”'
    claim: 'Neh. 10:39 (Heb. 10:40) is ʿāzab, Qal imperfect 1cp, the people speaking; of the nine H5800 verses in Nehemiah (occurrences.mjs nehemiah --hebrew H5800) it is the only one with a human subject and God’s house as object'
