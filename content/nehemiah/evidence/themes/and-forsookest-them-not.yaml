  - where: 'section “Why is the house of God forsaken?”'
    claim: 'Connection made by this page: the one verb runs from God to the people to the house. In ch. 9 it names what God did not do to Israel (9:17, 19, 31); in ch. 10 what Israel would not do to Him (10:39); in ch. 13 what has happened anyway (13:11). The vow that answered God in His own word has been broken. (The site’s notes on 10:39 and 13:11 join the last two.)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'Why is the house of God forsaken?'
