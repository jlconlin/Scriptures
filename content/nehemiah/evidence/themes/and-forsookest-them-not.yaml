  - where: 'section “Why hast thou forsaken me?”'
    claim: 'Connection made by this page: Neh. 9:17, 19, 31 (“thou didst not forsake them,” ʿăzabtām) and Ps. 22:1 (“why hast thou forsaken me,” ʿăzabtānî) are the same verb in the same tense and person, the one negated, the other not; Jesus cried Ps. 22:1 from the cross. Neh. 9:28 admits God left them to their enemies, but the prayer’s verdict is 9:31. Within Elder Holland’s teaching (the Father did not forsake the Son but withdrew the comfort of His Spirit, so that we will never be left alone), the page concludes that the mercy the prayer of Neh. 9 praises, a God who does not forsake a people who forsake Him, and the mercy secured on the cross are one mercy: the Son alone was left to feel the withdrawal. Not a claim that Neh. 9 foretells the cross, or that the Father abandoned the Son. No source read joins the two passages'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'My God, my God, why hast thou forsaken me?'
