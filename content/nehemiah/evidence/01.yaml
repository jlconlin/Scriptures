chapter: 1
claims:
  - where: when
    claim: 'The twentieth year is of Artaxerxes I (Longimanus)'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1) and to Nehemiah (Neh. 2:1; 5:14; 13:6).'
  - where: when
    claim: 'Ludlow dates the chapter to about 445 B.C.'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The timeframe for this discussion appears to be December in the twentieth year of King Artaxerxes’s reign (approximately 445 BC).'
  - where: when
    claim: 'Scripture Helps dates the rebuilding to about 444 B.C.'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Under Nehemiah’s direction, the walls of Jerusalem were rebuilt in about 444 BC.'
  - where: setting
    claim: 'Nehemiah continues Ezra; the Jews regarded the two as one book; the name means Comfort of the Lord; a Levite or of Judah; cupbearer to Artaxerxes'
    key: bd-nehemiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nehemiah?lang=eng'
    quote: 'Comfort of the Lord. (1) A Jew (either a Levite or of the tribe of Judah) who held the important office of “cupbearer” at the court of Artaxerxes … (which is a continuation of Ezra, the two being regarded by the Jews as forming one book)'
  - where: setting
    claim: 'Nehemiah’s first-person memoir is principally in chapters 1–7'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: '(Look for Ezra’s memoir in Ezra 7–10 and Nehemiah’s principally in Nehemiah 1–7.)'
  - where: setting
    claim: 'The name has been rendered “the Lord is compassionate”; the book is written in the first person'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The name Nehemiah means “the Lord is compassionate,” … Like 1 Nephi, the book of Nehemiah is written mostly in first-person narrative.'
  - where: setting
    claim: 'Artaxerxes I, 465–425 B.C., had earlier hindered the building'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23)'
  - where: setting
    claim: 'Chisleu is the ninth month, beginning at the new moon of December; Shushan is Susa, the chief city of Persia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng'
    quote: '“Chisleu”: IE the ninth of the Hebrew months, beginning at the new moon of December. … “Shushan”: OR Susa (the chief city of all Persia).'
  - where: setting
    claim: 'Nisan is the first month; one explanation of Chisleu and Nisan in the same year is a year counted from autumn, as the Jews did in civil matters after the captivity'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'Nisan is, according to the Hebrew calendar, the first month of the year … the computation of time current in anterior Asia, and also among the Jews after the captivity in civil matters, and which made the new year begin in autumn … Tishri is the first, Chisleu the third, and Nisan the seventh month.'
  - where: setting
    claim: 'The chapter falls into a report (1–3) and a prayer (4–11), and introduces the book’s themes'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The themes that will be important to Nehemiah, such as acknowledgement of the people’s breaking the covenant leading to exile, return, reconciliation, and restoration, are introduced.'
  - where: thread
    claim: 'The prayer draws on the law of Moses (Deuteronomy) for God’s covenant faithfulness, the scattering and the gathering'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/1.htm'
    quote: 'These words are no verbal quotation, but a free summary, in which Nehemiah had Deuteronomy 30:1-5 chiefly in view, of what God had proclaimed in the law of Moses concerning the dispersion of His people'
  - where: thread
    claim: 'Nehemiah knew he would need the king’s permission'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'He had faith that God could gather the people to the land but realized that he would need to ask the king for permission to leave.'

  - where: 'note 1:3 “Why the wall was still down”'
    claim: 'The province is the Persian district of Yehud'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'The province mentioned in verse 3 is the province of Yehud, the area so designated by the Persians around Jerusalem.'
  - where: 'note 1:3 “Why the wall was still down”'
    claim: 'The Babylonians broke down the walls of Jerusalem (2 Kgs. 25:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And all the army of the Chaldees, that were with the captain of the guard, brake down the walls of Jerusalem round about.'
  - where: 'note 1:3 “Why the wall was still down”'
    claim: 'The building Artaxerxes halted (Ezra 4:21) included setting up the walls of Jerusalem (Ezra 4:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/4?lang=eng'
    quote: 'the Jews which came up from thee to us are come unto Jerusalem, building the rebellious and the bad city, and have set up the walls thereof, and joined the foundations.'

  - where: 'note 1:4 “Days of mourning and fasting”'
    claim: 'Fasting was a natural way of showing sorrow, and a regular custom after the return'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'after the return, fasting is shown to be a regular custom (Luke 5:33; 18:12). It was regarded as a natural way of showing sorrow.'
  - where: 'note 1:4 “Days of mourning and fasting”'
    claim: 'The news came in Chisleu (the setting places the months)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng'
    quote: '“Chisleu”: IE the ninth of the Hebrew months, beginning at the new moon of December.'

  - where: 'note 1:6 “Confessing a people’s sins as his own”'
    claim: 'Nehemiah’s mourning, fasting and prayer resemble Ezra 9 and Daniel 9; he acknowledged the people’s sins, praised God and petitioned'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'His actions are similar to Ezra’s in Ezra 9:3–15 and Daniel’s in Daniel 9. His prayer acknowledged the people’s sins … Nehemiah praised God’s power as well as petitioned for His help in this situation.'
  - where: 'note 1:6 “Confessing a people’s sins as his own”'
    claim: 'A trusted servant at a foreign court'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'He was the king’s cupbearer, a significant and trusted position in the court of Artaxerxes'

  - where: 'note 1:8 “Holding God to His word”'
    claim: '“Great and terrible God” recalls Deut. 7:21, and “keepeth covenant and mercy” Deut. 7:9; the predicates point to covenant faithfulness'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/1.htm'
    quote: 'the further predicates of God, to His covenant faithfulness. "Thou great and terrible God" recalls Deuteronomy 7:21, and "who keepest covenant and mercy," etc., Deuteronomy 7:9 and Exodus 20:5-6.'
  - where: 'note 1:8 “Holding God to His word”'
    claim: 'Verses 8–9 are a free summary chiefly of Deut. 30:1–5; the chosen place is Jerusalem, where the Lord caused His name to dwell in the temple (Deut. 12:11)'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/1.htm'
    quote: 'These words are no verbal quotation, but a free summary, in which Nehemiah had Deuteronomy 30:1-5 chiefly in view … Jerusalem is meant, where the Lord caused His name to dwell in the temple; comp. Deuteronomy 12:11.'
  - where: 'note 1:8 “Holding God to His word”'
    claim: 'The fulfilled threat of scattering strengthened hope that God would keep the promise of gathering'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/1.htm'
    quote: 'Now this, God had shown Himself to be, by fulfilling the threats of His law that He would scatter His faithless and transgressing people among the nations. Thus His fulfilment of this one side of the covenant strengthened the hope that God would also keep His other covenant word'
  - where: 'note 1:8 “Holding God to His word”'
    claim: 'The temple stood and some had returned, but the restoration of the community with the Lord dwelling among them was incomplete'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/1.htm'
    quote: 'their restoration as a community, in the midst of whom the Lord had His dwelling … Those who had returned from captivity had indeed settled in the land of their fathers; and the temple … was rebuilt at Jerusalem.'
  - where: 'note 1:8 “Holding God to His word”'
    claim: 'Verse 10: God cannot leave His redeemed people in affliction; the words recall Deut. 9:26, 29'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/1.htm'
    quote: 'His people whom He has redeemed from Egypt by His great power and by His strong arm, God cannot leave in affliction and reproach. The words: "redeemed with great power" ... are reminiscences from Deuteronomy 7:8; Deuteronomy 9:26, Deuteronomy 9:29'
  - where: 'note 1:8 “Holding God to His word”'
    claim: 'Moses prayed for Israel in Deut. 9:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'I prayed therefore unto the LORD, and said, O Lord GOD, destroy not thy people and thine inheritance, which thou hast redeemed through thy greatness'

  - where: 'note 1:11 ““This man” is the king”'
    claim: 'Nehemiah trusted God could gather the people and knew he would have to ask the king for leave'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'He had faith that God could gather the people to the land but realized that he would need to ask the king for permission to leave.'
  - where: 'note 1:11 ““This man” is the king”'
    claim: 'The cupbearer guarded the king’s food and drink against poison; a post of great responsibility and trust, with regular access to the king'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The position of cupbearer was one of great responsibility and trust. The king’s cupbearer ensured that the king’s food and drink were not poisoned. The position also allowed access to the king on a regular basis'
  - where: 'note 1:11 ““This man” is the king”'
    claim: 'He would need the king’s permission and support to help his people'
    key: amistad-modern-nehemiahs
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/12/wanted-modern-nehemiahs?lang=eng'
    quote: 'To help his people, Nehemiah knew he would have to make some drastic changes in his life and that he would need the permission and support of the king.'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Nehemiah’s response is an example for prayer for the welfare of others'
    key: amistad-modern-nehemiahs
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/12/wanted-modern-nehemiahs?lang=eng'
    quote: 'What Nehemiah chose to do at that crucial time in his life provides us with an example of what we can do when our hearts are drawn out in prayer for the welfare of others.'
