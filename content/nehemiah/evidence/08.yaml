chapter: 8
claims:
  - where: 'setting'
    claim: 'Nehemiah''s first-person memoir is principally in Nehemiah 1–7'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Look for Ezra''s memoir in Ezra 7–10 and Nehemiah''s principally in Nehemiah 1–7.'
  - where: 'setting'
    claim: 'Ezra obtained his edict from Artaxerxes in 458 B.C.; his mission was to teach in Israel'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'The object of his mission was “to teach in Israel statutes and judgments.” In 458 B.C. he obtained from Artaxerxes an important edict'
  - where: 'setting'
    claim: 'The chronology of Ezra and Nehemiah is notoriously difficult, but chapter 8 brings them together'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Chapter 8 brings the stories of Nehemiah and Ezra together. While the chronology of both of these figures’ ministries is notoriously difficult to determine, there are touch points when they seem to have interacted.'
  - where: 'setting'
    claim: 'The Feast of Tabernacles ran from the 15th to the 21st of the seventh month, with an eighth day added'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'was celebrated on the 15th to 21st days of the seventh month. To the seven days was added an eighth, “the last day, that great day of the feast” (John 7:37), a day of holy convocation'
  - where: 'setting'
    claim: 'Nehemiah 8–10 are the climactic chapters of Ezra–Nehemiah'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The climactic chapters of Nehemiah 8–10 bring all three strategies together, but the primary emphasis falls on the people''s re-encounter with their own textual tradition.'
  - where: 'setting'
    claim: 'Nehemiah is named in the third person as the Tirshatha in verse 9; the wall was finished in Elul (6:15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'And Nehemiah, which is the Tirshatha, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people'

  - where: 'thread'
    claim: 'The people re-encounter scripture; they find the command of the booths and act on it at once; scripture presents new meanings and requires new obligations'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'In the course of reading, the people discover the commandment to observe Sukkot … and they immediately act on what they''ve found. … The entire scene dramatizes the process of scripture presenting new meanings to—and then requiring new obligations from—attentive readers.'
  - where: 'thread'
    claim: 'One Hebrew verb for understanding (bin) stands in verses 2, 3, 7, 8, 9 (the Levites “that taught”) and 12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'הַ/מְּבִינִ֨ים'
  - where: 'thread'
    claim: 'The reformed community, the finished walls and the rebuilt temple marked the end of a restoration begun nearly a century before'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The spiritually reformed community, completed walls, and reconstructed temple marked the end of a restoration that began nearly a century earlier when the exiled Jews returned to Jerusalem.'

  - where: 'note 8:1 “The people asked for the book”'
    claim: 'The law had largely been the priests'' possession; now brought within reach of every Jew; the open reading made the law the center of national life'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'Hitherto “the law” had been to a great extent the exclusive possession of the priests. It was now brought within the reach of every Jew. The open reading of “the book of the law” was a new departure and marked the law as the center of Jewish national life.'
  - where: 'note 8:1 “The people asked for the book”'
    claim: 'The footnote at 8:2 sends the reader to Deut. 31:11, the command to read the law before all Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'Deut. 31:11'
  - where: 'note 8:1 “The people asked for the book”'
    claim: 'Deuteronomy 31 commands the law read to men, women, children and strangers at the feast of tabernacles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/31?lang=eng'
    quote: 'Gather the people together, men, and women, and children, and thy stranger that is within thy gates'
  - where: 'note 8:1 “The people asked for the book”'
    claim: 'The people gathered as one man and asked Ezra to bring the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'And all the people gathered themselves together as one man into the street that was before the water gate; and they spake unto Ezra the scribe to bring the book of the law of Moses'

  - where: 'note 8:4 “A tower of wood”'
    claim: 'The Hebrew word behind “pulpit” is migdal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'מִגְדַּל עֵץ֮'
  - where: 'note 8:4 “A tower of wood”'
    claim: 'Migdal is a tower; in Neh 8:4 an elevated stage, a pulpit of wood'
    key: bdb
    url: 'https://biblehub.com/hebrew/4026.htm'
    quote: '1 tower Genesis 11:4,5 … 2 elevated stage, pulpit of wood Nehemiah 8:4.'
  - where: 'note 8:4 “A tower of wood”'
    claim: 'Nehemiah 8 is shaped to recall Sinai: assembly, Ezra as mediator, elevated platform, the people''s response; every act shown as recovery of past practice'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'is shaped to remind readers of the ancient covenant given on Sinai: the gathered assembly, Ezra''s role as mediator, his elevated platform, and, most importantly, the people''s affirmative response and communal covenant all echo Moses descending Sinai'
  - where: 'note 8:4 “A tower of wood”'
    claim: 'Like King Benjamin, Ezra stood on a specially made wooden tower to teach'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Like King Benjamin in the Book of Mormon, Ezra stood on a specially made wooden tower to better teach the people.'
  - where: 'note 8:4 “A tower of wood”'
    claim: 'A speaker on a platform is a feature shared by Nehemiah 8:4 and Mosiah 2:7 in a table of festival parallels'
    key: sc-knowhy-80
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-stay-in-their-tents-during-king-benjamins-speech'
    quote: 'Speaker on platform Nehemiah 8:4 Mosiah 2:7'
  - where: 'note 8:4 “A tower of wood”'
    claim: 'Benjamin''s people entered a covenant in the form of Israel''s covenant renewal, compared with Nehemiah 7:73–8:18; 9:1–13:31'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'Benjamin’s people also enter into such a covenant, and they follow the form of covenant renewal in Israel in detail.146 Through this covenant, the people became the sons and daughters of God (see Mosiah 5:1–7; compare Exodus 19:5; Jeremiah 31:33; Nehemiah 7:73–8:18; 9:1–13:31).'
  - where: 'note 8:4 “A tower of wood”'
    claim: 'The footnote at “pulpit” gives Mosiah 2:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'Mosiah 2:7 (7–8)'

  - where: 'note 8:6 “Hands lifted, then faces to the ground”'
    claim: 'The phrase for lifting up hands is used once of prayer, in Nehemiah 8:6'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'Finally, the phrase mōʿal yādayim “lifting up hands” is used once in the description of a prayer in the book of Nehemiah:'
  - where: 'note 8:6 “Hands lifted, then faces to the ground”'
    claim: 'Nehemiah 8:5–6 supports a cycle of prayer gestures after the exile: stand, lift hands with Amen, kneel, prostrate, stand again'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'Nehemiah 8:5–6 would support the idea that such a cycle existed in ancient Israelite prayer after the Babylonian captivity. At the reading of the “book of the law,” the people first stand up, then they lift up their hands while saying “Amen, amen,” then they kneel and finally prostrate themselves to the earth.'
  - where: 'note 8:6 “Hands lifted, then faces to the ground”'
    claim: 'After these actions they apparently stand again (verse 7)'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'After these actions, they apparently stand again (see verse 7).'
  - where: 'note 8:6 “Hands lifted, then faces to the ground”'
    claim: 'Raising the hands may have been one of a series of gestures of approach'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'The prayer gesture of raising the hands may also have been part of a series of “gestures of approach”'

  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The word for “distinctly” is mephorash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'מְפֹרָ֑שׁ'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'Parash: make distinct, declare; the participle in Neh 8:8 “made distinct,” compare the Aramaic of Ezra 4:18; taken as “interpreted” by some'
    key: bdb
    url: 'https://biblehub.com/hebrew/6567.htm'
    quote: 'Participle מְפֹרָשׁ Nehemiah 8:8 made distinct (compare B Aram Ezra 4:18), see BeRy KöEinl. 99, > interpreted, Ke and others'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The rabbis took it of an Aramaic paraphrase; Keil doubts the word means this and prefers an exposition and application; “gave the sense” made the law comprehensible; the last clause is of the hearers'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/8.htm'
    quote: 'The Rabbis understand מפרשׁ equals the Chaldee מפרשׁ, of a rendering of the law into the vulgar tongue … But this cannot be shown to be the meaning of פרשׁ … It is more correct to suppose a paraphrastic exposition and application of the law'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The hearers obtained an understanding of what was read'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/8.htm'
    quote: 'and gave the sense, made the law comprehensible to the hearers. … "and they (the hearers) attended to the reading," or, "obtained an understanding of what was read"'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'Procedure: Ezra read a section and the Levites expounded it, in succession or to different groups at once'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/8.htm'
    quote: 'Ezra first read a section of the law, and the Levites then expounded to the people the portion just read; the only point still doubtful being whether the thirteen (fourteen) Levites expounded in succession, or whether they all did this at the same time to different groups of people.'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The Levites moved among the people translating Hebrew into Aramaic and helping them understand'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Ezra reads from the Torah for hours as Levites circulate among the people, translating the Hebrew scripture into Aramaic and helping them understand its meaning.'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The Levites helped interpret, perhaps assisting those who after the exile spoke Aramaic more than Hebrew; the scene stresses understanding, not only reading'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Levites who helped transmit and interpret the law to the general public, perhaps also assisting those who, because of the exile, spoke Aramaic more than Hebrew. … the help of the elders highlights the importance of not only reading the scriptures but understanding them as well.'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'Ezra 4:18 reads “plainly read before me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/4?lang=eng'
    quote: 'The letter which ye sent unto us hath been plainly read before me.'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The Levites helped the people understand, likely explaining and perhaps translating from Hebrew to Aramaic'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'the Levites helped the people understand it, which likely involved explaining it and perhaps even translating it from Hebrew to Aramaic'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The footnote at “gave the sense” reads it as a commentary by the power of the Holy Ghost and points to Mosiah 1:2–5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'gave a commentary by the power of the Holy Ghost'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'Benjamin had his sons taught the language of their fathers that they might become men of understanding'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/1?lang=eng'
    quote: 'that thereby they might become men of understanding'

  - where: 'note 8:9 “Why they wept”'
    claim: 'The people wept likely from remorse for their own and their ancestors'' failures in keeping the commandments'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The people wept when they heard the law being read—likely because they felt remorse for their own failures and those of their ancestors in keeping God’s commandments.'
  - where: 'note 8:9 “Why they wept”'
    claim: 'The people wept whether from contrition, grief or joy; their attachment to scripture became personal and devotional'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Whether they wept out of contrition, grief, or joy, the people evidently experience a deep and tender attachment to the words of scripture. Its authority has become personal and devotional, not merely historical or institutional.'
  - where: 'note 8:9 “Why they wept”'
    claim: 'The community fast with confession came after the Feast of Tabernacles (Neh 9:1–3)'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This fast seems to be similar to the observance of Yom Kippur; however, in this case it comes after the Feast of Tabernacles and not before. It also included confession of sins, prostration before the Lord, and reading from the law.'
  - where: 'note 8:9 “Why they wept”'
    claim: 'The leaders told them not to weep because the day was holy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'This day is holy unto the LORD your God; mourn not, nor weep. For all the people wept, when they heard the words of the law.'

  - where: 'note 8:10 “The joy of the LORD is your strength”'
    claim: 'The word for “strength” is maoz'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Neh.xml'
    quote: 'מָֽעֻזְּ/כֶֽם'
  - where: 'note 8:10 “The joy of the LORD is your strength”'
    claim: 'Maoz: place or means of safety, protection; literally a place of safety; figuratively of God as refuge, with Neh 8:10 compared (cf.)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4581.htm'
    quote: 'place or means of safety, protection … 1 literally place of safety … 2. a. figurative, of God (׳י) as refuge Nahum 1:7; Psalm 27:1 … cf . הִיא מָעֻזְּכֶם ׳חֶדְוַת י Nehemiah 8:10'
  - where: 'note 8:10 “The joy of the LORD is your strength”'
    claim: 'Nehemiah called the people to remember the poor and share their joy by charitable service, not religious observance alone'
    key: ot-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-32?lang=eng'
    quote: 'He did not call for religious observance alone. He called on the people not only to join in a religious feast but to remember the poor, to share their joy in God’s goodness by charitable service.'
  - where: 'note 8:10 “The joy of the LORD is your strength”'
    claim: 'The people went to make great mirth because they had understood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'And all the people went their way to eat, and to drink, and to send portions, and to make great mirth, because they had understood the words that were declared unto them.'

  - where: 'note 8:17 “Not since the days of Joshua”'
    claim: 'The feast had not been observed in this fashion since Joshua; compare Solomon''s observance (2 Chr 7:8–10); daily reading; eighth-day assembly'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'According to verse 17, the festival had not been observed in this fashion since the days of Joshua. They celebrated the festival for seven days before holding a solemn assembly on the eighth (compare to Solomon’s observance of this holiday in 2 Chronicles 7:8–10).'
  - where: 'note 8:17 “Not since the days of Joshua”'
    claim: 'The observance was community-building as they reestablished their religious identity and practice'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This observance of the festival was an important community-building activity as they were reestablishing their religious identity and practice.'
  - where: 'note 8:17 “Not since the days of Joshua”'
    claim: 'The returned exiles had kept the feast of tabernacles (Ezra 3:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'They kept also the feast of tabernacles, as it is written, and offered the daily burnt offerings by number'

  - where: 'christ'
    claim: 'The footnotes at 8:9 and 8:12 send the reader to Mosiah 4:1–3; at 8:10 to D&C 59:12–16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'Mosiah 4:3'
  - where: 'christ'
    claim: 'Benjamin''s people were filled with joy, having received remission of sins through faith in Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/4?lang=eng'
    quote: 'they were filled with joy, having received a remission of their sins, and having peace of conscience, because of the exceeding faith which they had in Jesus Christ who should come'
  - where: 'christ'
    claim: 'D&C 59:15: the Lord''s day kept with a glad heart and a cheerful countenance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'with cheerful hearts and countenances, not with much laughter, for this is sin, but with a glad heart and a cheerful countenance—'
