chapter: 8
claims:
  - where: 'when'
    claim: 'The Feast of Tabernacles was kept from the fifteenth day of the seventh month'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'was celebrated on the 15th to 21st days of the seventh month'
  - where: 'setting'
    claim: 'The Bible Dictionary makes 8:1–10:39 the book''s second part, religious and social reforms'
    key: bd-nehemiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nehemiah?lang=eng'
    quote: '(b) 8:1–10:39, religious and social reforms'
  - where: 'setting'
    claim: 'Nehemiah''s first-person memoir is principally chapters 1–7'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Look for Ezra''s memoir in Ezra 7–10 and Nehemiah''s principally in Nehemiah 1–7.'
  - where: 'setting'
    claim: 'Ezra came to Jerusalem in 458 B.C.; the object of his mission was to teach'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'The object of his mission was “to teach in Israel statutes and judgments.” In 458 B.C. he obtained from Artaxerxes an important edict'
  - where: 'setting'
    claim: 'The chronology of Ezra and Nehemiah is hard to determine, but chapter 8 is a point where they meet'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Chapter 8 brings the stories of Nehemiah and Ezra together. While the chronology of both of these figures’ ministries is notoriously difficult to determine, there are touch points when they seem to have interacted.'
  - where: 'setting'
    claim: 'The gathering and celebration marked the end of a restoration begun nearly a century earlier'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The spiritually reformed community, completed walls, and reconstructed temple marked the end of a restoration that began nearly a century earlier when the exiled Jews returned to Jerusalem.'
  - where: 'setting'
    claim: 'The first day of the seventh month was a holy convocation; the people gathered in the seventh month after the wall (6:15; 7:73)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'In the seventh month, in the first day of the month, shall ye have a sabbath, a memorial of blowing of trumpets, an holy convocation.'
  - where: 'thread'
    claim: 'Nehemiah 8–10 are the climax; the people re-encounter their scripture, discover Sukkot and act on it; its authority becomes personal and devotional'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'the people discover the commandment to observe Sukkot … and they immediately act on what they''ve found. … Its authority has become personal and devotional, not merely historical or institutional.'
  - where: 'note 8:1 “The people asked for the book”'
    claim: 'The first of the seventh month was a holy convocation in the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'In the seventh month, in the first day of the month, shall ye have a sabbath, a memorial of blowing of trumpets, an holy convocation.'
  - where: 'note 8:1 “The people asked for the book”'
    claim: 'The law had been largely the possession of the priests; the open reading was a new departure and made the law the center of national life'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'Hitherto “the law” had been to a great extent the exclusive possession of the priests. It was now brought within the reach of every Jew. The open reading of “the book of the law” was a new departure and marked the law as the center of Jewish national life.'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'migdal is the ordinary word for tower, used of the towers of Nehemiah 3:25–27'
    key: bdb
    url: 'https://biblehub.com/hebrew/4026.htm'
    quote: '1 tower Genesis 11:4,5; … Nehemiah 3:25,26,27'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'In Nehemiah 8:4 it means an elevated stage'
    key: bdb
    url: 'https://biblehub.com/hebrew/4026.htm'
    quote: '2 elevated stage, pulpit of wood Nehemiah 8:4.'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'Like King Benjamin, Ezra stood on a wooden tower to teach; the scene recalls Sinai'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Like King Benjamin in the Book of Mormon, Ezra stood on a specially made wooden tower to better teach the people. Some scholars see Ezra reenacting the Israelites’ Sinai experience'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'The KnoWhy lists the speaker on a platform (Neh. 8:4 / Mosiah 2:7) among the marks Benjamin''s assembly shares with the Feast of Tabernacles'
    key: sc-knowhy-80
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-stay-in-their-tents-during-king-benjamins-speech'
    quote: 'Speaker on platform Nehemiah 8:4 Mosiah 2:7'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'and the reading of the law and covenant renewal (Neh. 8:1–3, 5)'
    key: sc-knowhy-80
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-stay-in-their-tents-during-king-benjamins-speech'
    quote: 'Reading law and renewal of covenant; commandments Deuteronomy 4:1-9, 11–25; 31:11; Nehemiah 8:1–3, 5'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'and ritual prostration (Neh. 8:6 / Mosiah 4:1)'
    key: sc-knowhy-80
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-stay-in-their-tents-during-king-benjamins-speech'
    quote: 'Ritual response, prostration on ground Nehemiah 8:6 Mosiah 4:1; 5:2'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'The likeness is a scholarly argument about Benjamin''s assembly and the Feast of Tabernacles'
    key: sc-knowhy-80
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-stay-in-their-tents-during-king-benjamins-speech'
    quote: 'LDS scholars have argued that this gathering at the temple to hear a speech was no ordinary occasion, but that the account in Mosiah 2–6 closely resembles what we know about ancient Israelite temple pilgrimage festivals, especially the Feast of Tabernacles.'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'In one scholar''s reading, the assembly, mediator, platform and response echo Moses descending Sinai'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'the gathered assembly, Ezra''s role as mediator, his elevated platform, and, most importantly, the people''s affirmative response and communal covenant all echo Moses descending Sinai to stand before the children of Israel.'
  - where: 'note 8:4 “A wooden tower to read from”'
    claim: 'Benjamin built a tower so that the multitude could hear'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'therefore he caused a tower to be erected, that thereby his people might hear the words which he should speak unto them.'
  - where: 'note 8:6 “Standing, hands raised, faces to the ground”'
    claim: '“Lifting up hands” is used once of prayer in Nehemiah'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'the phrase mōʿal yādayim “lifting up hands” is used once in the description of a prayer in the book of Nehemiah'
  - where: 'note 8:6 “Standing, hands raised, faces to the ground”'
    claim: 'Nehemiah 8:5–6 may support a cycle of prayer postures after the exile, inferred from texts and art'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'Nehemiah 8:5–6 would support the idea that such a cycle existed in ancient Israelite prayer after the Babylonian captivity. At the reading of the “book of the law,” the people first stand up, then they lift up their hands … then they kneel and finally prostrate themselves'
  - where: 'note 8:6 “Standing, hands raised, faces to the ground”'
    claim: 'The inference combines textual and artistic sources'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'Combining textual and artistic sources gives us the opportunity to explore this facet of the prayer gesture from a fresh perspective.'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'meforash means “made distinct”; compare the Aramaic of Ezra 4:18; others take it as “interpreted”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6567.htm'
    quote: 'Participle מְפֹרָשׁ Nehemiah 8:8 made distinct (compare B Aram Ezra 4:18), see BeRy KöEinl. 99, > interpreted, Ke and others'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: '“Gave the sense” is “set forth the understanding,” i.e. the meaning'
    key: bdb
    url: 'https://biblehub.com/hebrew/7922.htm'
    quote: 'Nehemiah 8:8 ("" הֵבִין) set forth (the) understanding (i.e. the meaning).'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The Levites likely explained the law and perhaps translated it into Aramaic'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'the Levites helped the people understand it, which likely involved explaining it and perhaps even translating it from Hebrew to Aramaic.'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The Levites circulated among the people translating into Aramaic and explaining'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Ezra reads from the Torah for hours as Levites circulate among the people, translating the Hebrew scripture into Aramaic and helping them understand its meaning.'
  - where: 'note 8:8 “Read distinctly, and the sense given”'
    claim: 'The Levites perhaps assisted those who after the exile spoke Aramaic more than Hebrew'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'perhaps also assisting those who, because of the exile, spoke Aramaic more than Hebrew.'
  - where: 'note 8:9 “Why the people wept”'
    claim: 'The portions read probably included passages that convicted the people of sin and showed its punishments'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/8.htm'
    quote: 'Undoubtedly it consisted of certain sections of Deuteronomy and other parts of the Thorah, which were adapted to convict the people of their sin in transgressing the commands of the Lord, and of the punishments to which they had thus exposed themselves.'
  - where: 'note 8:9 “Why the people wept”'
    claim: 'They likely wept from remorse for their own and their ancestors'' failures'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'likely because they felt remorse for their own failures and those of their ancestors in keeping God’s commandments.'
  - where: 'note 8:9 “Why the people wept”'
    claim: 'Whether contrition, grief or joy, they showed a deep and tender attachment to scripture'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Whether they wept out of contrition, grief, or joy, the people evidently experience a deep and tender attachment to the words of scripture.'
  - where: 'note 8:9 “Why the people wept”'
    claim: 'The people later fasted in sackcloth in the same month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'Now in the twenty and fourth day of this month the children of Israel were assembled with fasting, and with sackclothes, and earth upon them.'
  - where: 'note 8:10 “The joy of the LORD is your refuge”'
    claim: 'maʿoz means a place or means of safety, protection'
    key: bdb
    url: 'https://biblehub.com/hebrew/4581.htm'
    quote: 'a place or means of safety, protection'
  - where: 'note 8:10 “The joy of the LORD is your refuge”'
    claim: 'The lexicon compares Neh. 8:10 with the verses that call God a refuge (Nahum 1:7; Ps. 27:1)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4581.htm'
    quote: '2. a. figurative, of God (׳י) as refuge Nahum 1:7; Psalm 27:1'
  - where: 'note 8:10 “The joy of the LORD is your refuge”'
    claim: 'They were to eat, drink and share with any in need so that all might rejoice'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'Instead, they encouraged the people to go home, have good food and drink, and share with any who may be in need so that all may rejoice.'
  - where: 'note 8:17 “Not done so since Joshua”'
    claim: 'The verse does not say the feast went unkept since Joshua (Ezra 3:4; Solomon); the whole community had not dwelt in booths; earlier celebrations may have omitted the booths'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/8.htm'
    quote: 'The text only states that since the days of Joshua the whole community had not so celebrated it, i.e., had not dwelt in booths.'
  - where: 'note 8:17 “Not done so since Joshua”'
    claim: 'Earlier observers may have kept the feast with assemblies and sacrifices without booths'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/8.htm'
    quote: 'On former occasions, those who came up to Jerusalem may have regarded this precept as non-essential, and contented themselves by keeping the feast with solemn assemblies, sacrifices, and sacrificial feasts, without making booths'
  - where: 'note 8:17 “Not done so since Joshua”'
    claim: 'Not observed in this fashion since Joshua; compare Solomon in 2 Chr. 7:8–10; the festival reestablished religious identity'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'According to verse 17, the festival had not been observed in this fashion since the days of Joshua. … (compare to Solomon’s observance of this holiday in 2 Chronicles 7:8–10).'
  - where: 'note 8:17 “Not done so since Joshua”'
    claim: 'The observance was community-building as they reestablished their religious identity'
    key: ludlow-nehemiah-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/nehemiah-1-13'
    quote: 'This observance of the festival was an important community-building activity as they were reestablishing their religious identity and practice.'
  - where: 'note 8:17 “Not done so since Joshua”'
    claim: 'The returned exiles kept the feast of tabernacles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'They kept also the feast of tabernacles, as it is written'
  - where: 'christ'
    claim: 'The footnotes link 8:9 “wept” to Mosiah 4:1 and 8:12 “understood” to Mosiah 4:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: '9d “wept”: Mosiah 4:1 (1–2). … 12b “understood”: Mosiah 4:3.'
