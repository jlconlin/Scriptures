summary: >-
  The Book of Abraham begins with a man delivered from an altar by Jehovah, who
  puts His name and the priesthood of the fathers upon him. It then shows him the
  stars set one above another, with one nearest the throne of God, and the council
  that said "We will go down" and "Here am I, send me," and it ends with the
  Creation brought to pass as that council planned. Its visual center is an ordered
  heaven from which the plan of the Gods comes down to a quiet earth.
motifs:
  - "Primary: a natural, believable night sky as seen far from any city, thousands of stars of uneven size, brightness and spacing with faint star-dust between them, never in rows, lines, steps or a pattern and never drawn as sparkles or crosses. The stars grow gradually brighter and more numerous as the eye climbs toward the upper right, where one star clearly outshines all the others with a warm gold light, and one soft shaft of gold light descends from it toward the earth below."
  - "Supporting: in the lower left, an unmistakable ancient altar: raised, squared and about waist-high, built of fitted rough stones with one broad flat slab laid across the top as its table, standing on a low stone footing. No fire, no offering and nothing on it. Two loosed and cut cords lie on the ground at its foot. It is small and calm in a hollow of ground, never the focus."
  - "Supporting: a pale path leaving the altar's hollow and winding across open, dry country toward the far horizon, where the descending light comes to rest."
composition: >-
  A wide landscape divided into a large sky above and a quiet plain below. The stars
  thicken and brighten naturally from the left horizon up toward the single gold star at the upper right
  of center, with no rows or steps, and its shaft of light falls gently across the plain to the far horizon
  at the right. The small altar sits at the lower left; the path winds from it into
  the light. The sky is the subject and the altar a modest corner of the picture.
  The mood is order and calm, never a storm, never fire, and never a scene of
  sacrifice.
alt: A night sky full of stars that brighten toward one large golden star, a shaft of gold light falling to a distant horizon, and a small stone altar with loosed cords at the lower left, with a path winding from it across open ground.
status: proposed
