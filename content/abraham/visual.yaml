summary: >-
  The Book of Abraham begins with a man delivered from an altar by Jehovah, who
  puts His name and the priesthood of the fathers upon him. It then shows him the
  stars set one above another, with one nearest the throne of God, and the council
  that said "We will go down" and "Here am I, send me," and it ends with the
  Creation brought to pass as that council planned. Its visual center is an ordered
  heaven from which the plan of the Gods comes down to a quiet earth.
motifs:
  - "Primary: a night sky of stars arranged in rising tiers, one above another, the highest a single large star glowing gold, with one soft shaft of gold light descending from it toward the earth below."
  - "Supporting: in the lower left, a low, plain stone altar with no fire on it, two loosed and cut cords lying on the ground at its foot, small and calm in a hollow of ground, never the focus."
  - "Supporting: a pale path leaving the altar's hollow and winding across open, dry country toward the far horizon, where the descending light comes to rest."
composition: >-
  A wide landscape divided into a large sky above and a quiet plain below. The tiers
  of stars rise from the left horizon up to the single gold star at the upper right
  of center, and its shaft of light falls gently across the plain to the far horizon
  at the right. The small altar sits at the lower left; the path winds from it into
  the light. The sky is the subject and the altar a modest corner of the picture.
  The mood is order and calm, never a storm, never fire, and never a scene of
  sacrifice.
alt: A night sky of stars in rising tiers with one large golden star at the top, a shaft of gold light falling to a distant horizon, and a small bare stone altar with loosed cords at the lower left, with a path winding from it across open ground.
status: proposed
