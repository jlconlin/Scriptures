summary: >-
  The Book of Abraham begins with a man delivered from an altar by Jehovah, who
  puts His name and the priesthood of the fathers upon him. It then shows him the
  stars set one above another, with one nearest the throne of God, and the council
  that said "We will go down" and "Here am I, send me," and it ends with the
  Creation brought to pass as that council planned. Its visual center is an ordered
  heaven from which the plan of the Gods comes down to a quiet earth.
motifs:
  - "Primary: a natural night sky with a band of the Milky Way, its stars uneven in size and spacing and growing brighter and thicker toward the upper right, where one star outshines the rest with a warm gold light and sends one soft shaft of gold light down to the far horizon."
  - "Supporting: in the lower left, a built altar of fitted rough stones on a low footing, with one broad flat slab across its top. Nothing is on it. A cut cord lies on the ground at its foot."
  - "Supporting: a pale path that leaves the altar and winds across open, dry country toward the place on the horizon where the light comes to rest."
composition: >-
  A wide landscape with a large sky above and a quiet plain below. The stars thicken
  from the left toward the single gold star at the upper right, and its shaft of light
  falls across the plain to the far horizon at the right. The altar sits at the lower
  left and the path winds from it into the light. The sky is the subject and the altar
  a modest corner of the picture. The mood is order and calm.
asset: /assets/abraham-book-art.png
alt: A night sky thick with stars that brighten toward one golden star, whose light falls in a shaft to the far horizon. Below, a path winds across open country from a stone altar with a cut cord lying at its foot.
