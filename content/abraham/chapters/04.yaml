chapter: 4
title: The Six Times of Creation
tagline: The Gods go down, organize the heavens and the earth, and set forth six times of creation, watching what they order until it obeys.
when: 'Revealed to Joseph Smith beginning in 1835 and first published in the Times and Seasons beginning in March 1842. In the account, it follows the council of chapter 3.'

setting: |
  Abraham 4 is the Creation told a third time, after [[Gen. 1]] and [[Moses 2]]. It follows the same six periods, but Abraham calls each one a “time” where Genesis and Moses say “day” (see the note on [[Gen. 1:5]]). It also begins in a different place. Genesis opens “In the beginning”; Abraham opens with “And then the Lord said: Let us go down,” and the reader has already heard those words in the council of chapter 3: “We will go down… and we will take of these materials, and we will make an earth” ([[Abr. 3:24]]). What follows is told partly as done and partly as planned (see the note on [[Abr. 4:18]]).

  Among the things Abraham adds to those accounts are who goes down (verse 1), the word “expanse,” which two of the facsimile explanations also use (verse 6), and the Gods who watch what they have ordered “until they obeyed” (verse 18).

  The account was revealed to Joseph Smith beginning in 1835 and published in the *Times and Seasons* beginning in March 1842. The setting of [[Abr. 1]] gives what the Church says about that history.

thread: |
  Genesis says again and again of what God has made that it is good: “God saw that it was good” ([[Gen. 1:10]]). Abraham says that it obeys. The Gods “order,” and when the dry land and the seas appear, “the Gods saw that they were obeyed” ([[Abr. 4:10]]). In verse 18 they do more than see: “the Gods watched those things which they had ordered until they obeyed.” The word “good” is used once in the chapter, in verse 21, and there it belongs to “their plan.”

  Partway through, the chapter turns to what will be. On the fifth time the Gods see “that they would be obeyed” (verse 21); on the sixth, “the Gods saw they would obey” ([[Abr. 4:25]]), and what they say is “We will bless them” and “we will give them” (verses 28–30). Their last words are a resolve and a forecast: “We will do everything that we have said, and organize them; and behold, they shall be very obedient” ([[Abr. 4:31]]). The heading in the Church's edition takes the chapter in that sense, as the Gods' “plans for the six days of creation,” and the next chapter tells how “the Gods came down and formed these the generations of the heavens and of the earth” ([[Abr. 5:4]]).

sections:
  - range: 1-5
    heading: The Gods go down; the first time
    plain: |
      The Lord says, “Let us go down,” and the Gods organize and form the heavens and the earth. The earth is empty and desolate, with darkness on the deep and the Spirit of the Gods brooding on the waters. The Gods say, “Let there be light,” and there is light. They divide it from the darkness and call it Day and the darkness Night. This is the first time.
  - range: 6-8
    heading: The expanse; the second time
    plain: |
      The Gods order an expanse in the midst of the waters, dividing the waters under it from the waters above it, and call the expanse Heaven. This is the second time.
  - range: 9-13
    heading: Land, seas, and plants; the third time
    plain: |
      The Gods order the waters to gather in one place and the dry land to appear, and they call the land Earth and the waters Great Waters. They see that they were obeyed. They prepare and organize the earth to bring forth grass, herbs, and fruit trees, each from its own seed and after its kind. This is the third time.
  - range: 14-19
    heading: The lights; the fourth time
    plain: |
      The Gods organize lights in the expanse for signs, seasons, days, and years: the greater light to rule the day, the lesser to rule the night, and the stars. They set them in the expanse to give light and to divide light from darkness. Then they watch what they ordered until it obeys. This is the fourth time.
  - range: 20-23
    heading: Creatures of the waters and the air; the fifth time
    plain: |
      The Gods prepare the waters to bring forth great whales, every living creature in them, and every winged fowl. They see that they would be obeyed and that their plan was good, and they say they will bless the creatures and cause them to be fruitful and multiply. This is the fifth time.
  - range: 24-31
    heading: Animals, man, and the sixth time
    plain: |
      The Gods prepare and organize the earth to bring forth cattle, creeping things, and beasts. Then they take counsel together and go down to organize man in their own image, male and female. They say they will bless them, cause them to be fruitful, give them dominion over the creatures, and give plants for food. They say they will do everything they have said, and that what they organize will be very obedient. This is the sixth time.

notes:
  - ref: 1
    phrase: they, that is the Gods
    kind: scripture
    title: Who goes down
    body: |
      Those who go down are “they, that is the Gods,” and verse 1 takes up the words of the council in chapter 3. In the council one “like unto God” said, “We will go down… and we will take of these materials, and we will make an earth whereon these may dwell” ([[Abr. 3:24]]); here “the Lord said: Let us go down. And they went down at the beginning.” Abraham then writes “the Gods” through the whole chapter where Genesis has “God.”

      Abraham 4 does not name them. From Abraham's account and other prophetic sources “we have reason to believe that others may have assisted Jesus Christ with the Creation.” For the council behind the plural “us” and the Old Testament's own councils, see the note on [[Gen. 1:26]].
    sources: [lds-scriptures, sc-knowhy-832, scripture-helps-gen-1-2]
  - ref: 6
    phrase: an expanse in the midst of the waters
    kind: history
    title: The expanse and the facsimile explanations
    body: |
      “Expanse,” Abraham's word for what Genesis calls the “firmament” ([[Gen. 1:6]]), is also the word in two of Joseph Smith's explanations of the facsimiles. The explanation of Facsimile 1, figure 12, reads: “Raukeeyang, signifying expanse, or the firmament over our heads.” The explanation of Facsimile 2, figure 4, calls Raukeeyang a Hebrew word and gives it the same meaning. For the Hebrew behind the Genesis word, see the note on [[Gen. 1:6]].

      One of the parallels that have been noted between the explanations and Egyptian thought is at this word: Facsimile 1 has a crocodile deity swimming in what the explanation calls “the firmament over our heads,” and scholars have likewise found that Egyptians thought of heaven as an ocean. For what the facsimiles are and how far their explanations agree with what Egyptologists say, see the note on [[Abr. 1:12]]. Both explanations are on this site ([Facsimile 1](/abraham/facsimile-1/), [Facsimile 2](/abraham/facsimile-2/)).
    sources: [lds-scriptures, gt-origins-abraham]
  - ref: 18
    phrase: watched those things which they had ordered until they obeyed
    kind: words
    title: Watched until they obeyed
    body: |
      Where Genesis says that what God made was good, Abraham says that it obeyed, and from the fifth time on that it would obey. After the dry land and the seas, Genesis has “God saw that it was good” ([[Gen. 1:10]]); Abraham has “the Gods saw that they were obeyed” (verse 10), and says the same of the plants (verse 12). In verse 18 the Gods wait as well as see: they “watched those things which they had ordered until they obeyed.” Abraham does not say how long.

      After that the wording looks forward. “The Gods saw that they would be obeyed, and that their plan was good” (verse 21); “the Gods saw they would obey” (verse 25); and the chapter closes, “We will do everything that we have said, and organize them; and behold, they shall be very obedient” (verse 31). The heading in the Church's edition takes the chapter in that sense: “The Gods plan the creation of the earth and all life thereon—Their plans for the six days of creation are set forth.” Abraham does not explain how the going down of verse 1 and the obedience of the first four times stand to that planning, and the sources read for this chapter do not say.
    sources: [lds-scriptures]

christ: |
  Abraham's Creation account teaches that Jesus Christ organized the earth out of materials that already existed. For the “lights” of verse 14, a revelation to Joseph Smith says that He is “in the sun, and the light of the sun, and the power thereof by which it was made” ([[D&C 88:7]]), and “in the moon, and is the light of the moon, and the power thereof by which it was made” ([[D&C 88:8]]).

explore: |
  Read [[Abr. 3:22–28]] for the council and [[Abr. 5]] for what follows. The same Creation is told in [[Gen. 1]] and in [[Moses 2]], the Lord's own words to Moses.

parallels:
  - ref: Gen. 1:1–31
    note: The same Creation in the same six periods, as Genesis tells it.
    primary: true
  - ref: Moses 2:1–31
    note: The same Creation as the Lord's own words to Moses; each period is a “day,” not a “time.”

sources: [lds-scriptures, gt-origins-abraham, sc-knowhy-832, scripture-helps-gen-1-2, scripture-helps-moses-1]
