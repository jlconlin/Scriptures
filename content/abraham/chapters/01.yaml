chapter: 1
title: Abraham and the Priest of Elkenah
tagline: Abraham seeks the priesthood of the fathers, is bound on an idolatrous altar in Chaldea, and is delivered by Jehovah.
when: 'In Ur of the Chaldeans, in Abraham’s own time, before he left for Haran ([[Abr. 2:4]]). The chapter was first printed in the Times and Seasons beginning in March 1842.'

setting: |
  The Book of Abraham calls itself “the writings of Abraham while he was in Egypt, called the Book of Abraham, written by his own hand, upon papyrus.” Chapter 1 is Abraham’s first-person account of his youth. He is in “the land of the Chaldeans,” at his father’s house, and he wants a better place to live and the “blessings of the fathers.” His family has turned to the gods of Elkenah, Libnah, and Pharaoh, and the priest of Elkenah tries to kill him on an altar. Genesis 11:27–32 names Terah, his sons, and Ur of the Chaldees, and moves on to Haran; it has no altar and no deliverance. The chapter ends with Egypt’s beginnings, a famine, and Abraham’s promise to write from the records he holds.

  The book came to the Saints in 1835, when Michael Chandler brought Egyptian mummies and papyrus scrolls to Kirtland, Ohio, and members of the Church bought them. Joseph Smith “did not explain how he translated the book of Abraham”; the surviving fragments do not match the translation; some Latter-day Saints believe the text was on papyri now lost, and others that Joseph’s study of the papyri prompted a revelation. “The Church does not take a position on these theories. It simply affirms that the translation was accomplished by revelation.”

thread: |
  The thread of the chapter is a priesthood handed from the fathers, and who will keep it. Abraham begins by seeking “the blessings of the fathers” and the right to administer them. He is the heir of a line that runs back to Adam, and his own father has left it for the gods of Chaldea. The altar is where that choice becomes violent: those who will not bow to wood or stone die on it, and Abraham is to be next.

  The deliverance answers the altar. Abraham “lifted up my voice unto the Lord my God,” and the one who answers gives his name as Jehovah and says he will “put upon thee my name, even the Priesthood of thy father.” The priesthood Abraham sought in verses 2 and 4 is what the Lord promises him in verse 18.

  The rest of the chapter turns to lineage and records. Egypt’s first Pharaoh was a righteous man of a lineage that “could not have the right of Priesthood,” though the Pharaohs “would fain claim it.” Abraham holds the records of the fathers “concerning the right of Priesthood,” which he says the Lord “preserved in mine own hands.”

sections:
  - range: 1-4
    heading: Abraham seeks the blessings of the fathers
    plain: |
      In the land of the Chaldeans Abraham saw that he needed another place to live. Finding that there was greater happiness, peace, and rest for him, he sought the blessings of the fathers and the right to be ordained to administer them. He wanted to be a follower of righteousness, to have great knowledge, to be a father of many nations and a prince of peace, and to keep God’s commandments. He became a rightful heir and a High Priest. The right had come down from the fathers from the beginning, through the firstborn and Adam, to him, and he sought the appointment to the priesthood that God had made to the fathers concerning the seed.
  - range: 5-11
    heading: The fathers turn to idols, and the altar
    plain: |
      Abraham’s fathers had turned from the commandments of the Lord to the gods of the heathen and would not listen to him. Their hearts were set on evil and on the gods of Elkenah, Libnah, Mahmackrah, Korash, and Pharaoh. They offered their children to dumb idols and tried to kill Abraham by the hand of the priest of Elkenah, who was also the priest of Pharaoh. It was the custom of that priest to offer men, women, and children on an altar built in Chaldea, in the manner of the Egyptians. He offered a child there, by Potiphar’s Hill at the head of the plain of Olishem, and he had killed three virgins, daughters of Onitah, a descendant of Ham, because they would not worship gods of wood or stone.
  - range: 12-14
    heading: The picture at the beginning
    plain: |
      The priests laid violence on Abraham to kill him as they had the virgins. So that the reader may know the altar, Abraham refers to the picture at the beginning of the record. The altar was shaped like a bedstead such as the Chaldeans used, and it stood before the gods of Elkenah, Libnah, Mahmackrah, Korash, and a god like Pharaoh’s. Abraham gave the form of the gods in the figures at the beginning, which the Chaldeans call Rahleenos, meaning hieroglyphics.
  - range: 15-20
    heading: Jehovah delivers Abraham
    plain: |
      As the priests laid hands on him, Abraham called on the Lord, who heard him and filled him with the vision of the Almighty. The angel of the Lord’s presence stood by him and loosed his bands. The Lord’s voice said that His name was Jehovah, that He had come down to deliver Abraham and take him from his father’s house into a strange land, and to destroy the one who had lifted his hand against him. He would lead Abraham, put His name and the priesthood of his father upon him, and it would be with Abraham as it was with Noah. Through Abraham’s ministry the Lord’s name would be known forever. The Lord broke down the altar of Elkenah and the gods of the land, struck the priest dead, and there was great mourning in Chaldea and in Pharaoh’s court.
  - range: 21-27
    heading: Egypt, Pharaoh, and the priesthood
    plain: |
      The king of Egypt descended from Ham and from the Canaanites, and the Egyptians sprang from that line. Egypt was first discovered by a woman, the daughter of Ham and of Egyptus, who settled her sons there. The first government of Egypt was set up by Pharaoh, her eldest son, in the patriarchal manner of Ham. Pharaoh was a righteous man who ruled justly and tried to imitate the order of the first patriarchs, in the reign of Adam and of Noah. Noah blessed him with the blessings of the earth and of wisdom but cursed him as pertaining to the Priesthood. Pharaoh could not have the right of the Priesthood, though the Pharaohs claimed it from Noah through Ham, and so Abraham’s father was led away by their idolatry.
  - range: 28-31
    heading: The records, and the famine
    plain: |
      Abraham says he will try to set out the chronology back to the creation, because the records have come into his hands. After the priest of Elkenah died, the famine that had been foretold to Abraham came on Chaldea. His father, sorely troubled by it, repented of the evil he had meant to do to Abraham. The Lord preserved the records of the fathers concerning the priesthood in Abraham’s hands, along with a knowledge of the creation and of the planets and stars, and Abraham will write some of this for his posterity.

notes:
  - ref: 2
    phrase: sought for the blessings of the fathers
    kind: scripture
    title: Where Abraham found the priesthood
    body: |
      Abraham seeks the priesthood from “the fathers” because his own father will not give it, and later revelation names the man who ordained him. In Old Testament times the priesthood was “handed down from father to son,” beginning with Adam, but “because Abraham’s own father had turned away from God, Abraham sought the priesthood from another source.”

      Abraham’s own verses say only that it “was conferred upon me from the fathers” ([[Abr. 1:3]]), and they do not say when. The Doctrine and Covenants names the other source: “Abraham received the priesthood from Melchizedek, who received it through the lineage of his fathers, even till Noah” ([[D&C 84:14]]). A later revelation says that the order Abraham was seeking belongs to “the literal descendants of the chosen seed” ([[D&C 107:40]]).

      Joseph Smith’s history, under 27 August 1843, records him describing the ordination itself: “Abram, says to Melchisedec, I believe all that thou hast taught me concerning the Priesthood, and the coming of the Son of Man; so Melchisedeck ordained Abram and sent him away. Abram rejoiced saying now I have a Priesthood.” Genesis tells of the two men meeting in [[Gen. 14:18–20]].
    sources: [scripture-helps-gen-12-17, lds-scriptures, jsp-history-e1-1708]
  - ref: 3
    phrase: on the first man, who is Adam, our first father
    kind: words
    title: The right of the firstborn, traced to Adam
    body: |
      The 1921 edition, which this site’s text follows, reads “on the first man” where the current edition reads “or the first man.” The 1921 text is “even the right of the firstborn, on the first man, who is Adam, our first father, through the fathers unto me.” The edition now in the Gospel Library has “even the right of the firstborn, or the first man, who is Adam, or first father, through the fathers unto me.”

      The small words change the grammar. With “on,” the right of the firstborn rests on Adam, “our first father,” and comes from him “through the fathers.” With “or,” “the first man” and “first father” stand beside “the firstborn” as further names for the same person. In both, the right “came down from the fathers, from the beginning of time.” No source read for this chapter says why the wording was changed.
    sources: [lds-scriptures, pgp-1921]
  - ref: 6
    phrase: the god of Elkenah
    kind: words
    title: The gods of Elkenah and the rest
    body: |
      The five gods are named three times, and two of the chapter’s strange names, Elkenah and Olishem, have been set beside names in ancient records. Verses 6, 13, and 17 give nearly the same list, Elkenah, Libnah, Mahmackrah, Korash, and Pharaoh, and the explanation of Facsimile 1, the picture verse 12 refers to, names figures 5 through 9 as “the idolatrous god of Elkenah” and of each of the others. Verse 7 adds that the priest of Elkenah was “also the priest of Pharaoh” ([[Abr. 1:7]]).

      “The god of Elkenah has been suggested by some Latter-day Saint scholars to represent a shortened form of the divine title El Koneh Artzu,” which is known from northwest Semitic inscriptions and means “something like ‘El, Creator of the Earth.’” The “plain of Olishem” ([[Abr. 1:10]]) “has been connected by some scholars to a town in northwestern Syria called Ulisum,” which is “a very plausible match for Olishem following standard linguistic practices.” Both are scholars’ proposals, not settled identifications, and they come with the caution that “the truth and value of the book of Abraham cannot be settled by scholarly debate concerning the book’s translation.”
    sources: [lds-scriptures, gt-origins-abraham]
  - ref: 8
    phrase: men, women, and children
    kind: history
    title: The altar and the three virgins
    body: |
      The altar is where those who refused the gods of the land were put to death, and Abraham was to die on it as the three virgins had. The priest of Pharaoh, by Abraham’s account, offered “men, women, and children” on an altar in Chaldea ([[Abr. 1:8]]). The three daughters of Onitah “would not bow down to worship gods of wood or of stone, therefore they were killed upon this altar” ([[Abr. 1:11]]), and the priests “laid violence upon me, that they might slay me also, as they did those virgins” ([[Abr. 1:12]]). The explanation of Facsimile 1 calls it “the altar for sacrifice by the idolatrous priests.”

      Death for refusing the official worship has a place in what is known of Abraham’s world. “Recent scholarship has found instances of such punishment dating to Abraham’s time. People who challenged the standing religious order, either in Egypt or in the regions over which it had influence (such as Canaan), could and did suffer execution for their offenses.” The verses themselves tell only what was done at this one altar.
    sources: [lds-scriptures, gte-book-of-abraham]
  - ref: 12
    phrase: the representation at the commencement of this record
    kind: history
    title: The representation at the commencement of this record
    body: |
      The “representation” is Facsimile 1, one of three print illustrations published with the book in 1842, and how the pictures relate to Abraham’s text is not known. They are drawn from images on the papyri, and Joseph Smith’s explanations were published beside them. Verse 14 sends the reader to the same picture for “the fashion” of the gods.

      Most of those explanations do not match what Egyptologists say of the figures, though some parallels have been noted. One is that Facsimile 1 has a crocodile deity in what Joseph Smith called “the firmament over our heads,” which scholars have likened to Egyptian ideas of heaven as an ocean. There is evidence that some Jewish authors of the era when the papyri were made took Egyptian drawings and stories into their own sacred texts, including texts about Abraham, and it is “possible that these illustrations were repurposed in a similar way.”

      The explanation of the picture names the figures this chapter describes: “the Angel of the Lord,” “Abraham fastened upon an altar,” and “the idolatrous priest of Elkenah attempting to offer up Abraham as a sacrifice.” [Facsimile 1](/abraham/facsimile-1/) has the picture and the numbered explanation, with the Church’s caution about the explanations and notes on the figures.
    sources: [gt-origins-abraham, scripture-helps-gen-12-17, lds-scriptures]
  - ref: 16
    phrase: my name is Jehovah
    kind: christ
    title: My name is Jehovah
    body: |
      The one who delivers Abraham gives His name as Jehovah, who is the premortal Jesus Christ. Abraham cries to “the Lord my God,” and “the angel of his presence” stands by him and loosens his bands ([[Abr. 1:15]]). The voice that follows says, “my name is Jehovah, and I have heard thee, and have come down to deliver thee” ([[Abr. 1:16]]).

      This verse and [[Ex. 6:3]] are the two cited to show that “Jehovah was known to the ancient prophets.” In the King James wording the verse in Exodus seems to say the opposite, that the patriarchs did not know God by this name. The Joseph Smith Translation makes that clause a question: “And was not my name known unto them?” Abraham’s account answers that it was.
    sources: [lds-scriptures, gs-jehovah]
  - ref: 26
    phrase: cursed him as pertaining to the Priesthood
    kind: history
    title: Cursed as pertaining to the Priesthood
    body: |
      These verses say that Noah cursed Pharaoh as pertaining to the Priesthood, and they do not say what the curse was. Pharaoh is “a righteous man” who judged “wisely and justly,” whom Noah blessed “with the blessings of the earth, and with the blessings of wisdom, but cursed him as pertaining to the Priesthood” ([[Abr. 1:26]]). Verse 27 adds that Pharaoh “could not have the right of Priesthood” though “the Pharaohs would fain claim it,” and that Abraham’s father was therefore “led away by their idolatry.”

      Beyond that, “these verses do not clearly explain what the curses were or why they were given.” In the past “some have incorrectly associated the curse on Ham’s posterity with the priesthood and temple restriction pertaining to people of Black African descent in our dispensation.” The Church’s teaching now is direct: “Today, the Church disavows this and other past theories seeking to explain reasons for the priesthood and temple restriction.” The idea that Pharaoh lacked the priesthood as a descendant of Cain likewise “goes beyond what the scriptures teach and should not be perpetuated today.” Among the theories disavowed are that black skin is “a sign of divine disfavor or curse,” or that it reflects “unrighteous actions in a premortal life.”

      For Egypt’s place in the list of Ham’s sons, see the note on [[Gen. 10:1]].
    sources: [scripture-helps-gen-12-17, gte-race-priesthood, lds-scriptures]
  - ref: 29
    phrase: there should be a famine in the land
    kind: history
    title: A famine in Ur that Genesis does not mention
    body: |
      Abraham’s account has a famine in Chaldea that turns his father, for a time, from wanting him dead; Genesis has no famine in Ur. After the priest is struck, a famine “prevailed throughout all the land of Chaldea” as foretold, and Abraham’s father “was sorely tormented because of the famine, and he repented of the evil which he had determined against me” ([[Abr. 1:30]]). The repentance did not last. When the famine abated, “my father turned again unto his idolatry” ([[Abr. 2:5]]).

      Genesis 11:27–32 does not mention a famine in Ur. The famine it tells of is in the land of Canaan, and it sends Abram into Egypt: “there was a famine in the land: and Abram went down into Egypt to sojourn there” ([[Gen. 12:10]]). The Book of Abraham has that one as well, “a continuation of a famine in the land” ([[Abr. 2:21]]). It comes after the one in Ur, where the Lord “caused the famine to wax sore in the land of Ur, insomuch that Haran, my brother, died” ([[Abr. 2:1]]). For how Haran’s death is told in Genesis, see the note on [[Gen. 11:28]].
    sources: [lds-scriptures]

christ: |
  In this chapter Jehovah hears Abraham’s cry, comes down, has his bands loosed, breaks down the altar, and promises to put His own name and priesthood on the man He has delivered ([[Abr. 1:15–20]]). Jehovah “is the premortal Jesus Christ and came to earth as a son of Mary.”

explore: |
  - **The same story in Genesis.** The notes on [[Gen. 11:28]] and [[Gen. 11:31]] have what Genesis says of Ur, Terah, and Haran.
  - **The priesthood of the fathers.** [[D&C 84:6–17]] traces the priesthood from Moses back to Adam, and [[D&C 107:40–52]] from Adam down to Noah.
  - **What comes next.** [[Abr. 2]] has Abraham’s departure from Ur and, in [[Abr. 2:6–11]], the covenant in the Lord’s own words, which takes up the promise of [[Abr. 1:18–19]].
  - **Beside the chapter.** The Gospel Library’s *Scripture Helps: Old Testament* chapter on Genesis 12–17; Abraham 1–2 has sections on Abraham 1:2–3, on the facsimiles, and on the curses in verses 21–27.

