chapter: 2
title: 'The Covenant at Haran'
tagline: 'Abraham leaves Ur with a father who turns back to idols, hears the Lord state the covenant in His own words, and is told what to say of Sarai on the road to Egypt.'
when: 'Abraham 2 tells of the journey from Ur to Haran, Canaan, and the edge of Egypt; Joseph Smith translated part of it in 1835, and it was first printed in Nauvoo in 1842.'

setting: |
  Abraham 2 is the part of Abraham’s own account that runs beside [[Gen. 11:27–12:13]]. It begins in Ur of the Chaldees, where a famine has taken Abraham’s brother Haran, and follows the family to the land they named Haran, to the Lord’s appearing there, and on through Canaan to the border of Egypt. Genesis tells this briefly. Here Abraham tells what he was told: the Lord states the covenant in His own words, and tells him what Sarai should say. How Abraham came to be leaving, and how the record came to the Church, is told in [[Abr. 1]]; this chapter assumes it.

  The record came out in pieces. Joseph Smith worked on the translation during the summer and fall of 1835 and “completed at least the first chapter and part of the second chapter.” All five chapters and three illustrations were then printed in the Church’s newspaper in Nauvoo, the *Times and Seasons*, between March and May 1842. The first installment ended where Abraham reaches “the place of Sechem” and calls on the Lord “because we had already come into the land of this idolatrous nation” ([[Abr. 2:18]]); the next began with the Lord’s answer there, “Unto thy seed will I give this land” ([[Abr. 2:19]]).

  Chapters 1 and 2 are one story in the book: the Lord who delivers Abraham at the altar in Ur is the Lord who appears to him at Haran.

thread: |
  The chapter begins with a household going backward and ends with a household going forward. Abraham’s father “turned again unto his idolatry” and stays in Haran; Abraham prays, and the Lord appears. What the Lord says first is a task: Abraham is to be “a minister to bear my name,” and his seed are to carry “this ministry and Priesthood unto all nations.” The covenant is spoken in the first person by one who names Himself Jehovah. Abraham answers with the verb that runs through the book’s first two chapters, hearken: his fathers “hearkened not” to his voice, the Lord “hearkened” to it, and now Abraham says, “I will do well to hearken unto thy voice.” The rest of the chapter is that obedience at work, in leaving, in building altars, and in doing as he is told about Sarai.

sections:
  - range: 1-5
    heading: 'Famine, and a father who turns back'
    plain: |
      The Lord caused a famine in Ur, and Haran, Abraham’s brother, died, but Terah, their father, still lived there. Abraham married Sarai, and Nehor married Milcah; both were daughters of Haran. The Lord had told Abraham to leave his country, his kindred, and his father’s house for a land He would show him, so Abraham left Ur to go to Canaan, taking Lot and Sarai, and his father followed. They came to a land they named Haran. The famine eased, and Terah stayed there, since there were many flocks, and he went back to his idolatry.
  - range: 6-11
    heading: 'The Lord appears and states the covenant'
    plain: |
      Abraham and Lot pray, and the Lord appears. He tells Abraham to take Lot and go, for He means to take him away from Haran to make him a minister to bear His name in a strange land, which He will give to Abraham’s seed forever when they listen to His voice. He describes Himself as the Lord who dwells in heaven, whose footstool is the earth, and whom the sea, the wind, and the mountains obey. His name is Jehovah, and He knows the end from the beginning. He promises to make Abraham a great nation, to bless him, and to make his name great, so that his seed will bear the ministry and Priesthood to all nations. All who receive the gospel will be counted his seed and will honor him as father. In him and in his seed, in his Priesthood, all the families of the earth will be blessed with the blessings of salvation and eternal life.
  - range: 12-13
    heading: 'Abraham answers'
    plain: |
      When the Lord has withdrawn, Abraham says in his heart that he sought Him earnestly and has found Him. The Lord sent an angel to deliver him from the gods of Elkenah, so he will listen to the Lord’s voice and depart in peace.
  - range: 14-21
    heading: 'From Haran to the south'
    plain: |
      Abraham, sixty-two years old, leaves Haran with Lot, Sarai, their goods, and “the souls that we had won in Haran.” They live in tents on the way to Canaan, and “eternity was our covering and our rock and our salvation.” At Jershon Abraham builds an altar and prays that the famine will be turned away from his father’s house. At Sechem, in the plains of Moreh, in a land of idolaters, he sacrifices and calls on the Lord, who tells him the land will be given to his seed. Abraham builds another altar east of Bethel and calls on the Lord again. Going south, he finds the famine continuing and decides to go down into Egypt.
  - range: 22-25
    heading: 'At the edge of Egypt'
    plain: |
      As they near Egypt the Lord tells Abraham that Sarai is very beautiful, and that when the Egyptians see her they will say she is his wife, kill him, and keep her alive. He is to have her say she is his sister, so that he will live. Abraham tells Sarai all that the Lord said and asks her to say it, so that it may be well with him for her sake.

notes:
  - ref: 6
    phrase: 'make of thee a minister to bear my name in a strange land'
    kind: scripture
    title: 'The call is an errand'
    body: |
      The Lord puts the call to Abraham as a task before He puts it as a blessing. Genesis 12:2–3 promises a great nation and a blessing to all families; here the first thing said is that Abraham will be “a minister to bear my name in a strange land,” and verse 9 says what his seed will carry: “this ministry and Priesthood unto all nations” ([[Abr. 2:9]]). To be an heir of the covenant is to be “chosen to responsibly carry the gospel to all the peoples of the earth,” and President Ezra Taft Benson put the responsibility of Abraham’s seed as “to be missionaries.” The Genesis note on [[Gen. 12:3]] has the promise to the families of the earth.

      The land, too, is promised on a condition: “when they hearken to my voice” ([[Abr. 2:6]]). The promise of the land in [[Gen. 17:8]] names no condition, yet in the Savior’s words to the Nephites the gathering of Israel and the land of their inheritance depend on Israel believing in Him (see [[3 Ne. 20:31, 33]]), and on that reading the covenant “is actually conditional on the obedience of Abraham’s seed.”
    sources: [lds-scriptures, bd-abraham-covenant, pgp-manual-abr-2-1-13, sc-knowhy-408]
  - ref: 8
    phrase: 'My name is Jehovah'
    kind: christ
    title: 'The Lord who delivered him is Jehovah'
    body: |
      The speaker at Haran is Jehovah, who is the premortal Jesus Christ. The name was given to Abraham once before, at the altar in Ur: “behold, my name is Jehovah, and I have heard thee, and have come down to deliver thee” ([[Abr. 1:16]]). The two verses join the deliverance to the covenant. The one who came down to deliver Abraham now says, “I know the end from the beginning; therefore my hand shall be over thee.” The note on [[Abr. 1:16]] has more on the name.

      Verse 7 is the Lord’s own account of who He is, and it is a list of things that obey His voice: “I stretch my hand over the sea, and it obeys my voice… I say to the mountains—Depart hence—and behold, they are taken away.”
    sources: [gs-jehovah, lds-scriptures]
  - ref: 10
    phrase: 'shall be called after thy name'
    kind: scripture
    title: 'Adopted into Abraham’s family'
    body: |
      Abraham 2:10 says what the promise in [[Gen. 12:2–3]] does not, that people who are not Abraham’s descendants become his seed by receiving the gospel: “as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed, and shall rise up and bless thee, as their father.” Verse 11 keeps the other line too, “the literal seed, or the seed of the body,” so that there are two ways into the covenant.

      President Russell M. Nelson named both: “we can become heirs to the covenant either by birth or by adoption.” That is the language of covenants generally: a covenant “deals with family relationships, either through birth (Genesis 15:2–4) or adoption (Abraham 2:9–10).”
    sources: [lds-scriptures, nelson-everlasting-covenant, gee-wanderings]
  - ref: 11
    phrase: 'this right shall continue in thee, and in thy seed after thee'
    kind: scripture
    title: 'The right passes on'
    body: |
      “Right” in verse 11 is the word Abraham used of what he sought: “the right whereunto I should be ordained” and “the right belonging to the fathers” ([[Abr. 1:2]]), which “came down from the fathers” ([[Abr. 1:3]]). The Lord now says the chain does not end at Abraham: “this right shall continue in thee, and in thy seed after thee.” The priesthood was “handed down from father to son,” and the Doctrine and Covenants says “Abraham received the priesthood from Melchizedek” ([[D&C 84:14]]).

      The promises remain with Abraham’s seed, but “the promised blessings must be accepted by those who follow Abraham’s example of faith and commitment to God.” The right has also been given again: “The same keys of the priesthood given to Abraham have been restored to the earth in the latter days.” In the Kirtland Temple Elias “committed the dispensation of the gospel of Abraham, saying that in us and our seed all generations after us should be blessed” ([[D&C 110:12]]).
    sources: [lds-scriptures, scripture-helps-gen-12-17, hopkin-covenant, pgp-manual-abr-2-1-13]
  - ref: 14
    phrase: 'was sixty and two years old'
    kind: history
    title: 'Sixty-two, not seventy-five'
    body: |
      Abraham gives his age on leaving Haran as sixty-two where Genesis has “seventy and five” ([[Gen. 12:4]]), and neither text explains the difference. The note on [[Gen. 12:4]] has what the Church’s chronology does with the two figures; nothing found reconciles them.

      The sixty-two is not a change made in a later edition. The first printing in the *Times and Seasons* in 1842 reads “was sixty and two years old when I departed out of Haran,” as the book reads now.
    sources: [lds-scriptures, jsp-book-of-abraham-1842]
  - ref: 17
    phrase: 'that they might not perish'
    kind: history
    title: 'A prayer for the house he left'
    body: |
      Abraham builds an altar at Jershon and prays “that the famine might be turned away from my father’s house, that they might not perish.” His father was last seen in Haran, where Terah stayed and “turned again unto his idolatry” ([[Abr. 2:5]]). The text does not say what became of the household.

      The prayer at Jershon comes between the two famines of Abraham’s record (see the note on [[Abr. 1:29]]), and it is for the father who had once sought his life ([[Abr. 1:30]]) and has now gone back to his idols.
    sources: [lds-scriptures]
  - ref: 22
    phrase: 'the Lord said unto me: Behold, Sarai, thy wife, is a very fair woman to look upon'
    kind: history
    title: 'The Lord told Abraham what Sarai should say'
    body: |
      Genesis does not say who thought of calling Sarai Abraham’s sister; Abraham says the Lord told him. The Lord names the danger, “they will say—She is his wife; and they will kill you, but they will save her alive,” and gives the instruction: “see that ye do on this wise: Let her say unto the Egyptians, she is thy sister, and thy soul shall live” ([[Abr. 2:23–24]]). So “Abraham and Sarah obeyed the Lord’s counsel and were spared from a dangerous situation.”

      The instruction need not have asked for a falsehood. Sarai was Abraham’s kin as well as his wife. He later says of her, “indeed she is my sister; she is the daughter of my father, but not the daughter of my mother; and she became my wife” ([[Gen. 20:12]]). “Because Abraham and Sarah both descended from Terah, customs of their time would likely have allowed for Abraham to accurately refer to Sarah as his sister.” Abraham “appears to have been using somewhat ambiguous terminology and not necessarily making an outright false statement.” The note on [[Gen. 12:13]] has the rest: how far kin words reached in Hebrew, and the Egyptian word that meant both “sister” and “wife.”

      Abraham’s own telling adds that he told Sarai “all that the Lord had said unto me” and asked her: “I pray thee, thou art my sister, that it may be well with me for thy sake” ([[Abr. 2:25]]).
    sources: [lds-scriptures, scripture-helps-gen-12-17, smoot-sarai]

christ: |
  The one who appears to Abraham at Haran and tells him what the covenant is names Himself Jehovah (see the note on [[Abr. 2:8]]). Among the promises given to Abraham is that Jesus Christ would be born through his lineage. All the families of the earth are to be blessed “even with the blessings of the Gospel, which are the blessings of salvation, even of life eternal” ([[Abr. 2:11]]), and Paul ties being Abraham’s seed to Christ: “if ye be Christ’s, then are ye Abraham’s seed, and heirs according to the promise” ([[Gal. 3:29]]).

explore: |
  Read [[Abr. 1]], where Abraham seeks the blessings of the fathers and is delivered at the altar, and [[Gen. 12]], where the same journey is told in a few verses. [[Gen. 17:1–8]] and [[Gen. 22:15–18]] state the covenant again, and [[Gal. 3:6–9, 26–29]] tells how the gospel was preached to Abraham and what it means to be his seed. [[D&C 132:29–37]] speaks of Abraham and the covenant, and [[Abr. 3]] goes on to what the Lord showed him next.

parallels:
  - ref: Gen. 12:1–20
    note: The same journey from Haran to Canaan and on to Egypt, told briefly in Genesis; Abraham 2 runs beside verses 1–13 and adds the Lord’s statement of the covenant and His instruction about Sarai.
    primary: true
  - ref: Gen. 11:27–32
    note: Terah’s family and their move from Ur to Haran, which Abraham 2:1–5 tells from Abraham’s side.

