chapter: 5
title: The Creation Brought to Pass
tagline: 'The Gods rest on the seventh time as they had counseled, come down and put the man in the garden, and a help meet is found for Adam.'
when: 'Seen by Abraham in vision; Joseph Smith began translating the book in 1835, and this chapter was printed in the Times and Seasons on 15 March 1842. In the text, the seventh time and the Garden of Eden before the Fall.'

setting: |
  Abraham 5 finishes the Creation that [[Abr. 4]] begins. Inside the book, Abraham is telling what the Lord showed him: first the stars, then the spirits “organized before the world was,” and one among them saying, “We will go down, for there is space there… and we will make an earth” ([[Abr. 3:24]]). Chapters 4 and 5 follow from those words, and the Gods are the speakers. Abraham himself appears in them only once, at verse 13: “Now I, Abraham, saw.”

  The chapter runs beside [[Gen. 2]] and [[Moses 3]], and this commentary leaves to the notes on Genesis 2 what the accounts share: the Hebrew, the rivers of Eden, the rib, “one flesh,” and the breath of life, which in Abraham is “the man's spirit” (see the note on [[Gen. 2:7]]). The notes here keep to what Abraham's version adds: the counsel behind the work (verses 2–5), the Gods coming down (verse 4), the reckoning of Kolob (verse 13), and the help meet who is “found” (verse 21).

  The book came forth in two steps. It was revealed to Joseph Smith beginning in 1835, when he was studying Egyptian papyri the Saints had purchased, and this chapter was first printed in the *Times and Seasons* on 15 March 1842. For what is known and not known of the translation, see [[Abr. 1]].

thread: |
  Abraham 5 is a plan being kept. The Gods “counseled” five times in its first five verses, and the work they finish is “according to all that which they had said” (verse 5). Chapter 3 had announced the plan (“We will go down”), chapter 4 set forth six “times” of it (the note on [[Abr. 4:18]] takes up how much of that chapter is told as planned), and chapter 5 comes to the seventh, to rest, and then to the garden.

  The same word of counsel shapes the rest. The Gods come down, as they had said they would. They put a man into the body they had formed, give a commandment, and plan a help meet before they make one. Only one verse steps outside the Gods' speech: Abraham, reading the clock, sees that the time of the garden is not yet the time of this earth. And the account closes on what verse 14 proposed: for Adam “there was found an help meet for him.”

sections:
  - range: 1-3
    heading: The seventh time
    plain: |
      The heavens and the earth and all their hosts are to be finished. The Gods say among themselves that on the seventh time they will end the work they have counseled and rest from it. They conclude upon the seventh time and sanctify it, because that was their decision when they counseled together to form the heavens and the earth.
  - range: 4-13
    heading: The man in the garden
    plain: |
      The Gods come down and form the generations of the heavens and the earth, as they had said, before any plant was in the earth, with no rain and no man to till the ground. A mist rises and waters the ground. The Gods form man of the dust, take his spirit and put it into him, and breathe the breath of life, and he becomes a living soul. They plant a garden eastward in Eden and put the man there, whose spirit they had put into the body. They make every pleasant tree grow, with the tree of life and the tree of knowledge of good and evil in its midst. A river runs out of Eden and parts into four heads. The Gods put the man in the garden to dress and keep it and tell him he may eat freely of every tree but one; in the time he eats of it he will surely die. Abraham adds that he saw this was after the Lord's time, which was after the time of Kolob, since the Gods had not yet appointed Adam his reckoning.
  - range: 14-21
    heading: A help meet for the man
    plain: |
      The Gods say it is not good for the man to be alone, and that they will form a help meet for him. They cause a deep sleep to fall on Adam, take one of his ribs, close the flesh, and form a woman from it. Adam says she is bone of his bones and flesh of his flesh, and she shall be called Woman. Therefore a man leaves his father and mother, cleaves to his wife, and they are one flesh; they are naked and not ashamed. The Gods form every beast and fowl and bring them to Adam to be named, and whatever he calls each creature is its name. Adam names all the cattle, birds, and beasts, and for Adam there is found a help meet for him.

notes:
  - ref: 2
    phrase: On the seventh time we will end our work, which we have counseled
    kind: prophets
    title: Rest at the end of a counseled work
    body: |
      The rest of the seventh time comes in Abraham as the end of something planned. The verbs of planning are close together: “counseled” occurs five times in verses 2, 3, and 5, and verse 3 ends, “thus were their decisions at the time that they counseled among themselves to form the heavens and the earth.” The Gods decide the rest before the work is finished, and they decide it together. Why God rested, and what a day made holy means, is in the notes on [[Gen. 2:2]] and [[Gen. 2:3]].

      President Spencer W. Kimball described the planning in the terms of a builder: “Before this earth was created the Lord made a blueprint, as any great contractor will do before constructing. He drew up the plans, wrote the specifications, and presented them,” and he quoted [[Abr. 3:24–25]] as the place where the plan is spoken. The Church’s heading for this chapter puts it in two steps: “The Gods finish Their planning of the creation of all things—They bring to pass the Creation according to Their plans.” Chapter 5 says as much of itself: the Gods form the heavens and the earth “according to all that which they had said” (verse 5).

      In Abraham the creative periods are called “times,” not days. The book does not say how long a “time” was; for the length of the days of Creation, see the note on [[Gen. 1:5]].
    sources: [lds-scriptures, pgp-manual-abr-4-5]
  - ref: 4
    phrase: the Gods came down
    kind: scripture
    title: The Gods come down
    body: |
      Verse 4 carries out what [[Abr. 3:24]] announced: the one “like unto God” says to those with him, “We will go down, for there is space there, and we will take of these materials, and we will make an earth whereon these may dwell,” and the purpose follows in the next verse, “to see if they will do all things whatsoever the Lord their God shall command them” ([[Abr. 3:25]]). Chapter 4 opens with the going down, “Let us go down. And they went down at the beginning” ([[Abr. 4:1]]), and verse 4 of this chapter says it a second time: “the Gods came down and formed these the generations of the heavens and of the earth.”

      Genesis 2:4 has no going down; there “the LORD God made the earth and the heavens.” In Abraham those who planned the earth come down to form it, and chapter 3 has already said what it is for: a place where the spirits who will dwell on it are proved. [From Council to Creation](/abraham/themes/council-to-creation/)
    sources: [lds-scriptures]
  - ref: 13
    phrase: which was after the time of Kolob
    kind: scripture
    title: The reckoning not yet given to Adam
    body: |
      This verse is where Abraham steps out of the Gods' speech to say how the time in the garden was measured, and the answer is the time of Kolob. In [[Abr. 3:4]] the Lord had explained that “one revolution was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest.” Here Abraham sees that the Lord's time governs the garden “for as yet the Gods had not appointed unto Adam his reckoning,” so the word “time” in the warning (“in the time that thou eatest thereof”) is measured by the Lord's time, not by an earthly day. What this does for the warning of death is in the note on [[Gen. 2:17]].

      Joseph Smith's explanation of figure 1 of Facsimile 2 says of Kolob: “First in government, the last pertaining to the measurement of time… One day in Kolob is equal to a thousand years according to the measurement of this earth.” A facsimile is one of the three illustrations printed with the book in 1842, taken from images on the papyri, each with Joseph Smith's explanation of its figures. Most of the explanations do not match what Egyptologists say of the figures, though some parallels have been noted, and how the facsimiles relate to the text is not known. The explanation is quoted here as Joseph Smith's statement on the subject of the verse, and no more is built on it; [[Abr. 3:3]] has more on Facsimile 2 and Kolob. The image and the full explanation are on this site at [Facsimile 2](/abraham/facsimile-2/).

      The verse does not say how long the creative “times” of chapters 4 and 5 were, and nothing here dates the Creation.
    sources: [lds-scriptures, gt-origins-abraham]
  - ref: 21
    phrase: there was found an help meet for him
    kind: scripture
    title: Found, where Genesis says not found
    body: |
      Abraham ends with a help meet “found” for Adam, where Genesis and Moses say there was “not found” one, and the difference follows from the order of the accounts. In Genesis 2:19–20 and Moses 3:19–20 the animals are named first, and the verse closes, “there was not found an help meet for him,” before the woman is made. In Abraham the Gods plan a help meet (verse 14), form the woman from the rib (verses 15–16), and only then bring the animals for naming (verses 20–21). The reading is as old as the first printing: the *Times and Seasons* of 15 March 1842 has “and for Adam there was found an help meet for him.”

      None of the sources read for this chapter says why the two orders differ. What can be seen in the text is the sequence Abraham keeps: the help meet is proposed (verse 14), formed (verses 15–16), and found (verse 21). The meaning of “help meet” and the rib are in the notes on [[Gen. 2:18]] and [[Gen. 2:21]].
    sources: [lds-scriptures, jsp-book-of-abraham-1842-722]

christ: |
  The Creator's plan in this chapter has the Son in it, though Abraham does not name Him. The Lord's words in [[Moses 3:18]], on the same event as [[Abr. 5:14]], are spoken to someone: “I, the Lord God, said unto mine Only Begotten, that it was not good that the man should be alone.” Of the Creation generally, “From Abraham's account and other prophetic sources, we have reason to believe that others may have assisted Jesus Christ with the Creation.”

  Kolob, whose time verse 13 names, has also been read as a figure of Him: it is “symbolic of Jesus Christ, the central figure in God's plan of salvation.” That is a symbol drawn from Joseph Smith's explanation of Facsimile 2, where Kolob is “first in government”; verse 13 itself speaks only of time.

explore: |
  - **The same chapter in Genesis and Moses.** [[Gen. 2]] for the Hebrew of the shared verses, and [[Moses 3]] for the spiritual creation that comes before the natural.
  - **The plan this chapter completes.** [[Abr. 3:22–28]] and [[Abr. 4:1]].
  - **Kolob's time.** [[Abr. 3:1–5]] and Facsimile 2 in the Gospel Library.
  - **The Church's treatment of the Creation.** *Scripture Helps*, “Genesis 1–2; Moses 2–3; Abraham 4–5.”

parallels:
  - ref: Gen. 2:1–25
    note: The same account, told as the work of the Lord God. Abraham has the Gods counsel, come down, and put a spirit into the body; it ends with the help meet “found.”
    primary: true
  - ref: Moses 3:1–25
    note: The account as the Lord told it to Moses, with the spiritual creation first.

