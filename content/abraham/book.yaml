intro: |
  The Book of Abraham is, in the words of its headnote, “the writings of Abraham while he was in Egypt.” Joseph Smith began translating it in 1835, after the Church obtained some Egyptian papyri, and it was first published in Nauvoo in 1842. In it Abraham tells how he sought the blessings of the fathers, how Jehovah delivered him from the priest of Elkenah, and how the Lord covenanted with him at Haran. He is shown the stars and the spirits that “were organized before the world was,” and the book ends with the Creation as the Gods planned it.

  Chapters 1 and 2 run beside Genesis 11 and 12, and chapters 4 and 5 beside Genesis 1 and 2 and Moses 2 and 3, all of which are on this site. This companion goes through all five chapters and gives its attention to what the Book of Abraham has that those do not, linking to them for the rest. It tries to anticipate the questions a careful reader asks: *Who is speaking? What does this add to Genesis? Where did this book come from? Where is Christ in this?*

# The large movements of the book, described from the Church’s chapter headings.
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: chaldea
    range: [1, 2]
    name: From Ur to Egypt
    blurb: Abraham seeks the blessings of the fathers and is saved by Jehovah from the altar of the false priests. At Haran the Lord covenants with him, and he goes on through Canaan toward Egypt.
    color: '#a5673a'
    darkColor: '#e2a77e'
  - key: kolob
    range: [3, 3]
    name: The Stars and the Council
    blurb: By the Urim and Thummim Abraham learns of the sun, moon, and stars. The Lord shows him the spirits who lived before the world was, the choosing of a Redeemer, and the second estate.
    color: '#5b6fb5'
    darkColor: '#a8b6ec'
  - key: gods
    range: [4, 5]
    name: The Gods Plan the Creation
    blurb: The Gods plan the creation of the earth and all life on it, and bring it to pass as They planned. Adam names every living creature.
    color: '#3d8b5f'
    darkColor: '#84cfa3'

facsimilesBlurb: Three pictures were printed with the book in 1842, each with Joseph Smith’s explanation of its numbered figures. Here each plate is shown as the 1921 edition printed it, with that edition’s explanation.

