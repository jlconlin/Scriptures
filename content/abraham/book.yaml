description: A phrase-by-phrase companion to the Book of Abraham, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Chapters 1 and 2 tell in Abraham’s own voice what Genesis 11 and 12 tell briefly. Chapter 3 has no counterpart in Genesis, and chapters 4 and 5 tell the Creation again as the work of the Gods.
