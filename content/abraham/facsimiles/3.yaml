# A first pass (2026-10-07): the plate, the explanation, and a short introduction. Notes added 2026-10-07 under the
# author's rule: what the Church's own pages say, an explanation set beside the verse it goes with, no Egyptology of the site's own.
with: 3
title: 'Abraham in the King’s Court'
tagline: 'A court scene, explained as Abraham “reasoning upon the principles of Astronomy, in the king’s court.”'
image: /assets/facsimiles/abraham-facsimile-3.jpg
alt: 'A line drawing with numbered figures: a seated figure wearing a tall crown, a figure standing behind the seat, and three figures approaching from the right, under a band of stars and above a line of written characters.'
credit: 'The plate as printed in *The Pearl of Great Price*, 1921 edition (1929 printing; public domain), scanned at the [Internet Archive](https://archive.org/details/pearlofgreatpric0000jose_d8d6).'

about: |
  The explanation sets this scene in Egypt: its last line reads, “Abraham is reasoning upon the principles of Astronomy, in the king’s court.” In chapters 2 and 3 Abraham is on his way there. The Lord speaks to him “when I was come near to enter into Egypt” ([[Abr. 2:22]]), and after showing him the stars says, “I show these things unto thee before ye go into Egypt, that ye may declare all these words” ([[Abr. 3:15]]).

  The three facsimiles “were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.” “Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels,” and “We don’t know how the facsimiles relate to the text.”

notes:
  - ref: 1
    phrase: Abraham sitting upon Pharaoh’s throne, by the politeness of the king
    kind: history
    title: Abraham teaching astronomy in the king’s court
    body: |
      The explanation’s last line has no number and says what Abraham is doing in the scene: “Abraham is reasoning upon the principles of Astronomy, in the king’s court.” Beside it stands what the Lord says after showing Abraham the stars: “I show these things unto thee before ye go into Egypt, that ye may declare all these words” ([[Abr. 3:15]]). The note on [[Abr. 3:15]] has what that instruction covers.

      An editorial in the *Times and Seasons* of 15 July 1842, “The Government of God,” says of Egypt’s learning: “The learning of the Egyptians, and their knowledge of astronomy was no doubt taught them by Abraham and Joseph, as their records testify, who received it from the Lord.” Who wrote the editorial is “unclear”; it “does not appear to have been written by” Joseph Smith.
    sources: [lds-scriptures, jsp-times-seasons-1842-07-15]
  - ref: 1
    phrase: emblematical of the grand Presidency in Heaven
    kind: symbol
    title: The crown and the throne
    body: |
      The explanation says what the crown stands for: it is “representing the Priesthood, as emblematical of the grand Presidency in Heaven.” The figure “could also be symbolic of Abraham receiving his exaltation and sitting upon a throne in the presence of God (see D&C 132:37),” the verse that says of Abraham, Isaac and Jacob that they “have entered into their exaltation, according to the promises, and sit upon thrones” ([[D&C 132:37]]). That is offered as something the figure could be; the explanation does not say it.
    sources: [lds-scriptures, pgp-manual-abr-4-5]
  - ref: 3
    phrase: the ninth number of the Times and Seasons
    kind: history
    title: The ninth number of the Times and Seasons
    body: |
      The “ninth number” is the issue of 1 March 1842, which printed Facsimile 1, and the figure sends the reader back to it. In the 1842 printing this explanation reads “Signifies Abraham, in Egypt; referring to Abraham, as given in the 9th No. of the Times & Seasons.” That issue is “Vol. III. No. 9,” dated “March, 1, 1842,” and its first page carries “A Fac-simile from the Book of Abraham. No. 1.” The facsimile in that issue is Facsimile 1, whose figure 10 is “Abraham in Egypt,” and the current edition names that figure.

      The 1921 edition adds a second reference, “(Also as given in the first facsimile of this book.)” The current edition drops the reference to the issue and reads “Signifies Abraham in Egypt as given also in Figure 10 of Facsimile No. 1.”
    sources: [pgp-1921, jsp-book-of-abraham-1842-784, jsp-times-seasons-1842-03-01, lds-scriptures]

