with: 3
title: 'Abraham in the King’s Court'
tagline: 'A court scene, explained as Abraham “reasoning upon the principles of Astronomy, in the king’s court.”'
image: /assets/facsimiles/abraham-facsimile-3.jpg
alt: 'A line drawing with numbered figures: a seated figure wearing a tall crown, a figure standing behind the seat, and three figures approaching from the right, under a band of stars and above a line of written characters.'
credit: 'The plate as printed in *The Pearl of Great Price*, 1921 edition (1929 printing; public domain), scanned at the [Internet Archive](https://archive.org/details/pearlofgreatpric0000jose_d8d6).'

about: |
  The book’s own chapters end before Abraham reaches Egypt, so this plate shows a scene the text only looks ahead to. When the Lord has shown Abraham the stars He says, “I show these things unto thee before ye go into Egypt, that ye may declare all these words” ([[Abr. 3:15]]). The last line of the explanation below is that declaring: “Abraham is reasoning upon the principles of Astronomy, in the king’s court.” The text of the book does not itself refer to this plate.

  The Church’s page on the origins of the book says of all three: “These facsimiles were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.” It also says plainly: “Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.” And of the pictures and the book: “We don’t know how the facsimiles relate to the text.”

