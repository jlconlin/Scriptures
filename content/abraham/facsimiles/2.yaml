with: 3
title: 'Kolob and the Governing Ones'
tagline: 'A round plate whose explanation names Kolob, the measuring of time, and things that “cannot be revealed unto the world.”'
image: /assets/facsimiles/abraham-facsimile-2.jpg
alt: 'A circular line drawing divided into panels, with numbered figures: seated and standing figures, boats, a cow, and rows of written characters, ringed by a band of characters around the edge.'
credit: 'The plate as printed in *The Pearl of Great Price*, 1921 edition (1929 printing; public domain), scanned at the [Internet Archive](https://archive.org/details/pearlofgreatpric0000jose_d8d6).'

about: |
  The explanation of this plate speaks of Kolob and of the reckoning of time, as the Lord does to Abraham in chapter 3. There “the name of the great one is Kolob” ([[Abr. 3:3]]), one of its revolutions is a day to the Lord and a thousand years where Abraham stands ([[Abr. 3:4]]), and it “is set nigh unto the throne of God” ([[Abr. 3:9]]). The footnote to “Kolob” in verse 3 points to figures 1 to 5 of this plate.

  The plate is a hypocephalus, an Egyptian funerary disc laid with the dead. Such discs come from the Late Period and Ptolemaic times (about 664–30 BC), and 158 are known today.

  Some of the explanations are withheld: figure 8 “is to be had in the Holy Temple of God,” and figures 12 to 20 “will be given in the own due time of the Lord.”

  Like the other two facsimiles, this one was printed with the book in 1842 with Joseph Smith’s explanation of it. Most of the explanations differ from what Egyptologists say of the figures, though some parallels have been noted, and how the plates relate to Abraham’s text is not known; the page for [Facsimile 1](/abraham/facsimile-1/) gives the Church’s words.

notes:
  - ref: 1
    phrase: Kolob, signifying the first creation
    kind: words
    title: Proposals for the name Kolob
    body: |
      Semitic origins have been proposed for the name Kolob. Many uncertainties are acknowledged, though a few points in favor of the name’s being ancient are held to be reasonably certain. One proposal derives it from a root *qlb*, “heart, center, middle,” related to *qrb*, “to be near, close.” It is attractive because chapter 3 ties Kolob to nearness to God: “the name of the great one is Kolob, because it is near unto me” ([[Abr. 3:3]]; compare [[Abr. 3:9]], [[Abr. 3:16]]). Its drawback is that *qlb* in this sense is found only as far back as Arabic, considerably later than Abraham. In answer, some scholars derive both words from a reconstructed older root with relatives in Egyptian, Akkadian and Hebrew (*qereb*, “inside, middle”), and this is said to strengthen the etymology.

      A second proposal derives the name from Semitic *klb*, “dog,” and this has prompted some to identify Kolob with Sirius, the dog-star, whose rising marked the ideal Egyptian new year and the onset of the Nile flood. The two are said to share traits: each is tied to the throne of God, counted the greatest of stars, said to govern other stars, and linked with creation and the measuring of time. But most of these traits of Sirius are recorded in Egyptian sources of the Greco-Roman period, long after Abraham (though that, it is remarked, is the period of the Joseph Smith Papyri); the Egyptian word for “dog” is quite different from the Semitic one; and it is unclear which constellation the Mesopotamian “Dog” was. The identification “should therefore be accepted cautiously.”

      Kolob has also been set beside Egyptian thought about the sun: in the book’s account Kolob encircles, and so governs, the sun, which stood at the head of the Egyptian gods. The conclusion drawn is modest. Questions about the identification of Kolob remain, and the pieces of evidence, taken together, are held to reinforce the plausibility that the idea is ancient. For Kolob in the vision, see the note on [[Abr. 3:3]]; for the Lord’s time, the note on [[Abr. 5:13]].
    sources: [smoot-kolob]
  - ref: 1
    phrase: celestial time signifies one day to a cubit
    kind: words
    title: “One day to a cubit” as a measure of angle
    body: |
      A cubit measures length, not time, so this phrase has left Latter-day Saint commentators largely at a loss. One proposal is that it describes the motion of a heavenly body across the sky as an angle. Some ancient astronomers did measure angles in cubits: a Mesopotamian text of the fourth century BC records the moon’s position relative to stars of Gemini and Leo in cubits, other Mesopotamian texts place the planets the same way, and the Egyptians likewise measured angles in cubits. A finger held out at arm’s length covers about a degree of sky, and that angle is what the ancients are said to have called a cubit. On this proposal the phrase gives a rate of turning, not of distance, and describes the motion of Kolob among the stars. The proposal is judged plausible, since chapter 3 places Kolob relative to other bodies that can be observed ([[Abr. 3:9]], [[Abr. 3:12–13]]), though the precise meaning of the phrase “remains elusive.” For the day of a thousand years in the vision, see the note on [[Abr. 3:3]].
    sources: [smoot-fac2-cubit]
  - ref: 5
    phrase: said by the Egyptians to be the Sun
    kind: history
    title: What a hypocephalus was for
    body: |
      The whole plate is, in Egyptian terms, an image of the sun: a hypocephalus was an amulet in the form of a disc, made to emulate the sun’s disc and placed with a mummy. The name was given by modern Egyptologists and is Greek for “under the head.” That is how the direction in spell 162 of the Book of the Dead about where to put the amulet has widely been rendered. That spell gives its purposes: to protect the dead in the afterlife, to give them light and heat, to make them appear again as one who is on earth (that is, to raise them), and at last to make them divine. Hypocephali were also thought of as the eye of the sun god Re, which consumed enemies with fire. They never came into wide use, remaining with the priests and their families, especially at the temples of Amun at Karnak, Min at Akhmim and Ptah at Memphis.

      Hypocephali, or objects that served the same purpose, may also have been used for divination in the temple and as astronomical documents. They shared ideas with temple gates, which kept enemies out and let friends into sacred space, and with creation: they picture all that the sun encircles, the world of the living above and the underworld below. Because the figures and texts on them are obscure, scholars using different methods have reached different results, and room is to be left for more than one approach. What the object was for bears directly, it is argued, on how Joseph Smith’s explanation of Facsimile 2 is to be weighed.
    sources: [smoot-hypocephalus]
  - ref: 6
    phrase: this earth in its four quarters
    kind: symbol
    title: Figure 6 and the four creatures of the Apocalypse of Abraham
    body: |
      The four figures of figure 6 have been compared with four creatures in the Apocalypse of Abraham, an apocryphal writing in which what appear to be possible allusions to a hypocephalus have been pointed out. It is dated to about the beginning of the Christian era and tells of a vision Abraham saw while offering sacrifice. In it he is shown what is in the heavens, on the earth, in the sea and in the abyss, and the fullness of the world and its circle, in a picture with two sides. The first of these phrases is reported to be almost the wording of the left middle part of this plate. The writing also describes four fiery living creatures, each with four faces: a lion’s, a man’s, an ox’s and an eagle’s. These have been taken to be the four figures numbered 6 on the plate, and to be, almost certainly, a Semitic reworking of the four sons of Horus by way of Ezekiel 1–2. The weight placed on the comparison is that the writing is roughly of an age with the hypocephalus and tells of Abraham things that Joseph Smith’s explanation finds in the plate.
    sources: [smoot-hypocephalus, smoot-fac-semitic]
  - ref: 7
    phrase: Represents God sitting upon his throne
    kind: symbol
    title: Figure 7 on other hypocephali, a seated god and the wedjat-eye
    body: |
      The seated figure of figure 7 appears on other hypocephali, where the Egyptians themselves in some cases label him “the great god,” “Lord of Life” or “Lord of All.” The first of these titles is counted significant for Joseph Smith’s explanation, since one ancient Egyptian text gives the same title to Iaho Sabaoth, the Lord of Hosts. Some Egyptologists have suggested that the figure is the god Min, or Amun, though the Egyptians did not themselves name him so. Min was one of Egypt’s oldest gods, a god of the life-giving powers of nature and regarded as a creator, often shown with an arm raised and holding a flail, both signs of kingship. On this plate the figure was drawn or copied somewhat crudely. Egyptologists have tended to see it as drawn in the manner usual for Min, and so it seems to be, though Min is not always shown that way on hypocephali.

      Before the seated god a falcon- or snake-headed figure, perhaps the minor god Nehebkau, offers the wedjat-eye. This is the “whole” or “sound” eye of Horus, a sign of good gifts and of the body restored and renewed; in Coptic the same word came to mean “salvation, saved.” This fuller picture is offered as helping to make sense of Joseph Smith’s explanation of the figure and placing it in an Egyptian setting. There also appear to have been ancient connections between Abraham and objects of this kind: one Egyptian papyrus calls him “the pupil of the wedjat-eye.”
    sources: [smoot-fac2-fig7, smoot-hypocephalus]

