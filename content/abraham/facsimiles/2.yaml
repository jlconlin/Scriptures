with: 3
title: 'Kolob and the Governing Ones'
tagline: 'A round plate whose explanation names Kolob, the measuring of time, and things that “cannot be revealed unto the world.”'
image: /assets/facsimiles/abraham-facsimile-2.jpg
alt: 'A circular line drawing divided into panels, with numbered figures: seated and standing figures, boats, a cow, and rows of written characters, ringed by a band of characters around the edge.'
credit: 'The plate as printed in *The Pearl of Great Price*, 1921 edition (1929 printing; public domain), scanned at the [Internet Archive](https://archive.org/details/pearlofgreatpric0000jose_d8d6).'

about: |
  The explanation of this plate uses the names and the reckoning of time that Abraham is taught in chapter 3. There the Lord tells him that “the name of the great one is Kolob” ([[Abr. 3:3]]), that “one revolution was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest” ([[Abr. 3:4]]), and that Kolob “is set nigh unto the throne of God” ([[Abr. 3:9]]). Figure 1 below says the same of Kolob. The text of the book does not itself refer to this plate.

  Several of the explanations stop short on purpose: figure 8 “is to be had in the Holy Temple of God,” and the last lines say that more “will be given in the own due time of the Lord.”

  The Church’s page on the origins of the book says of all three: “These facsimiles were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.” It also says plainly: “Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.” And of the pictures and the book: “We don’t know how the facsimiles relate to the text.”

