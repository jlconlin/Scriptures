# A first pass (2026-10-07): the plate, the explanation, and a short introduction. Notes added 2026-10-07 under the
# author's rule: what the Church's own pages say, an explanation set beside the verse it goes with, no Egyptology of the site's own.
with: 3
title: 'Kolob and the Governing Ones'
tagline: 'A round plate whose explanation names Kolob, the measuring of time, and things that “cannot be revealed unto the world.”'
image: /assets/facsimiles/abraham-facsimile-2.jpg
alt: 'A circular line drawing divided into panels, with numbered figures: seated and standing figures, boats, a cow, and rows of written characters, ringed by a band of characters around the edge.'
credit: 'The plate as printed in *The Pearl of Great Price*, 1921 edition (1929 printing; public domain), scanned at the [Internet Archive](https://archive.org/details/pearlofgreatpric0000jose_d8d6).'

about: |
  The explanation of this plate speaks of Kolob and of the reckoning of time, as the Lord does to Abraham in chapter 3: “the name of the great one is Kolob” ([[Abr. 3:3]]); “one revolution was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest” ([[Abr. 3:4]]); Kolob “is set nigh unto the throne of God” ([[Abr. 3:9]]). The Church’s footnote to “Kolob” in verse 3 sends the reader to figures 1 to 5 of this plate.

  Some of the explanations are withheld: figure 8 “is to be had in the Holy Temple of God,” and figures 12 to 20 “will be given in the own due time of the Lord.”

  The three facsimiles “were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.” “Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels,” and “We don’t know how the facsimiles relate to the text.”

notes:
  - ref: 1
    phrase: One day in Kolob is equal to a thousand years according to the measurement of this earth
    kind: scripture
    title: A day in Kolob, in the explanation and in the vision
    body: |
      Figure 1 and Abraham 3:4 both reckon a day of Kolob at a thousand years. The explanation: “One day in Kolob is equal to a thousand years according to the measurement of this earth.” The verse: “one revolution was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest” ([[Abr. 3:4]]). The explanation has two things chapter 3 does not: that “celestial time signifies one day to a cubit,” and the name Jah-oh-eh. For Kolob in the vision, see the note on [[Abr. 3:3]]; for the Lord’s time “after the time of Kolob,” the note on [[Abr. 5:13]].
    sources: [lds-scriptures]
  - ref: 2
    phrase: as he offered sacrifice upon an altar, which he had built unto the Lord
    kind: scripture
    title: Which altar?
    body: |
      The explanation of figure 2 ends “as revealed from God to Abraham, as he offered sacrifice upon an altar, which he had built unto the Lord,” and it does not say which altar. Chapter 3, where the Lord shows Abraham the stars, mentions none. The altars Abraham builds are in the account of his journey: in Jershon he “built an altar … and made an offering unto the Lord” ([[Abr. 2:17]]); in the plains of Moreh he “offered sacrifice” ([[Abr. 2:18]]); and near Bethel he “built another altar unto the Lord” ([[Abr. 2:20]]). The vision of the stars and planets “occurred while he was traveling to Egypt,” and in it the Lord says, “I show these things unto thee before ye go into Egypt” ([[Abr. 3:15]]).
    sources: [lds-scriptures, scripture-helps-moses-1]
  - ref: 5
    phrase: Hah-ko-kau-beam, the stars represented by numbers 22 and 23
    kind: scripture
    title: Names in figure 5 and in Abraham 3:13
    body: |
      Figure 5 and Abraham 3:13 both name the sun, the moon and the stars. The figure is “another of the great stars in the expanse of space that help govern with power (see Abraham 3:2, 13).” The verse reads: “This is Shinehah, which is the sun … Olea, which is the moon. And he said unto me: Kokaubeam, which signifies stars, or all the great lights, which were in the firmament of heaven” ([[Abr. 3:13]]). The explanation has Enish-go-on-dosh, “said by the Egyptians to be the Sun”; “Floeese or the Moon”; and “Hah-ko-kau-beam, the stars.”

      Such stars “could also be symbolic of other great and noble spirits in the premortal existence (see Abraham 3:22–23).” That is given as a possibility: explanations of the facsimiles other than Joseph Smith’s “are tentative and subject to revision.”
    sources: [lds-scriptures, pgp-manual-abr-4-5]
  - ref: 6
    phrase: this earth in its four quarters
    kind: symbol
    title: The parallel the Church names for this plate
    body: |
      Scholars have noted a parallel at this figure: “Joseph Smith described the four figures in figure 6 of Facsimile 2 as ‘this earth in its four quarters.’ Other scholars have similarly interpreted identical figures in other ancient Egyptian texts.”
    sources: [gt-origins-abraham]
  - ref: 8
    phrase: but is to be had in the Holy Temple of God
    kind: history
    title: Writing “to be had in the Holy Temple of God”
    body: |
      Figure 8 is explained only by where its writing is to be had: it “cannot be revealed unto the world; but is to be had in the Holy Temple of God.” Two other figures speak of the priesthood: figure 3 represents “the grand Key-words of the Holy Priesthood,” and in figure 7 God is “revealing through the heavens the grand Key-words of the Priesthood.” Together, “the explanations for figures 3, 7, and 8 establish a clear relationship between the contents of facsimile 2 and the ordinances of the temple.”
    sources: [lds-scriptures, pgp-manual-abr-4-5]

