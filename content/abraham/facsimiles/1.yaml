title: 'Abraham on the Altar'
tagline: 'The picture Abraham points to in the first chapter: the altar, the priest of Elkenah, and the angel of the Lord.'
image: /assets/facsimiles/abraham-facsimile-1.jpg
alt: 'A line drawing with numbered figures: a man lies on a couch shaped like a lion, a standing figure holds a knife over him, a bird hovers at the right, and four jars with animal heads stand beneath the couch.'
credit: 'The plate as printed in *The Pearl of Great Price*, 1921 edition (1929 printing; public domain), scanned at the [Internet Archive](https://archive.org/details/pearlofgreatpric0000jose_d8d6).'

about: |
  This is the one facsimile the text itself sends the reader to. Abraham writes of the altar where the priests meant to kill him, “that you may have a knowledge of this altar, I will refer you to the representation at the commencement of this record” ([[Abr. 1:12]]), and of the gods it stood before, “I have given you the fashion of them in the figures at the beginning” ([[Abr. 1:14]]). Figures 2 to 9 below are that altar and those gods.

  The Church’s page on the origins of the book says of all three: “These facsimiles were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.” It also says plainly: “Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.” And of the pictures and the book: “We don’t know how the facsimiles relate to the text.”

