# A first pass (2026-10-07): the plate, the explanation, and a short introduction. Notes added 2026-10-07 under the
# author's rule: what the Church's own pages say, an explanation set beside the verse it goes with, no Egyptology of the site's own.
with: 1
title: 'Abraham on the Altar'
tagline: 'The picture Abraham points to in the first chapter: the altar, the priest of Elkenah, and the angel of the Lord.'
image: /assets/facsimiles/abraham-facsimile-1.jpg
alt: 'A line drawing with numbered figures: a man lies on a couch shaped like a lion, a standing figure holds a knife over him, a bird hovers at the right, and four jars with animal heads stand beneath the couch.'
credit: 'The plate as printed in *The Pearl of Great Price*, 1921 edition (1929 printing; public domain), scanned at the [Internet Archive](https://archive.org/details/pearlofgreatpric0000jose_d8d6).'

about: |
  Abraham sends the reader to this picture twice in his first chapter. Of the altar on which the priests meant to kill him he writes, “that you may have a knowledge of this altar, I will refer you to the representation at the commencement of this record” ([[Abr. 1:12]]), and that representation is Facsimile 1. Of the gods the altar stood before he writes, “I have given you the fashion of them in the figures at the beginning” ([[Abr. 1:14]]). The explanation below names the altar (figure 4) and the five gods (figures 5 to 9).

  The three facsimiles “were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.” “Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels,” and “We don’t know how the facsimiles relate to the text.”

notes:
  - ref: 1
    phrase: The Angel of the Lord
    kind: scripture
    title: The angel who delivers Abraham
    body: |
      The explanation names this figure “The Angel of the Lord,” and the book speaks three times of an angel who delivers Abraham. When the priests lifted their hands upon him, “the angel of his presence stood by me, and immediately unloosed my bands” ([[Abr. 1:15]]). Abraham later prays, “Thou didst send thine angel to deliver me from the gods of Elkenah” ([[Abr. 2:13]]), and the Lord tells him, “The Lord thy God sent his angel to deliver thee from the hands of the priest of Elkenah” ([[Abr. 3:20]]). For the voice that then says “my name is Jehovah,” see the note on [[Abr. 1:16]].
    sources: [lds-scriptures]
  - ref: 4
    phrase: standing before the gods of Elkenah, Libnah, Mahmackrah, Korash, and Pharaoh
    kind: scripture
    title: The explanation uses the verses' names, in the verses' order
    body: |
      The gods named in figure 4, and one by one in figures 5 to 9, are the five of Abraham’s first chapter, in the same order: the altar “stood before the gods of Elkenah, Libnah, Mahmackrah, Korash, and also a god like unto that of Pharaoh, king of Egypt” ([[Abr. 1:13]]). For the names, see the note on [[Abr. 1:6]]; for the picture the verses refer to, the note on [[Abr. 1:12]].
    sources: [lds-scriptures]
  - ref: 12
    phrase: Raukeeyang, signifying expanse, or the firmament over our heads
    kind: words
    title: Raukeeyang, the expanse, and the heavens
    body: |
      The explanation of figure 12 gives “expanse, or the firmament over our heads” as the meaning of Raukeeyang, and adds that here “the Egyptians meant it to signify Shaumau, to be high, or the heavens.” Abraham’s account of the second time has both words: “Let there be an expanse in the midst of the waters” ([[Abr. 4:6]]), and “the Gods called the expanse, Heaven” ([[Abr. 4:8]]). The note on [[Abr. 4:6]] sets this explanation beside that of Facsimile 2, figure 4, which uses the same word.

      Scholars have noted a parallel at this figure: “Facsimile 1 contains a crocodile deity swimming in what Joseph Smith called ‘the firmament over our heads.’ Scholars have similarly identified Egyptian conceptions of heaven as ‘a heavenly ocean.’”
    sources: [lds-scriptures, gt-origins-abraham]

sources:
