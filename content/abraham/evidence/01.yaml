chapter: 1
claims:
  - where: 'setting'
    claim: 'Michael Chandler brought the mummies and papyri to Kirtland in 1835'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'In 1835 a man named Michael Chandler brought four Egyptian mummies and several papyrus scrolls of ancient Egyptian writings to Kirtland, Ohio.'
  - where: 'setting'
    claim: 'The book’s headnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'The writings of Abraham while he was in Egypt, called the Book of Abraham, written by his own hand, upon papyrus.'
  - where: 'setting'
    claim: 'Genesis 11:27–32 names Terah, his sons, and Ur of the Chaldees, and goes on to Haran with no altar or deliverance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'And Terah took Abram his son, and Lot the son of Haran his son’s son, and Sarai his daughter in law, his son Abram’s wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there.'
  - where: 'when'
    claim: 'Joseph Smith translated some of the writings and published them as the Book of Abraham in the Times and Seasons beginning in March 1842'
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Joseph Smith later translated some of the writings and published them as the “Book of Abraham” in a Church publication called the Times and Seasons beginning in March 1842.'
  - where: 'setting'
    claim: 'Joseph did not explain how he translated; the fragments do not match the translation; two views; the Church takes no position'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'The Prophet Joseph Smith did not explain how he translated the book of Abraham.'
  - where: 'setting'
    claim: 'The fragments do not match the translation'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Both Latter-day Saint and non–Latter-day Saint Egyptologists agree that the characters on these fragments do not match the translation given in the book of Abraham.'
  - where: 'setting'
    claim: 'Two views of the papyri, and the Church takes no position'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'The Church does not take a position on these theories. It simply affirms that the translation was accomplished by revelation.'
  - where: 'setting'
    claim: 'Some believe the text was on missing papyri; others that study of the papyri prompted a revelation'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Some Latter-day Saints believe that the text of the book of Abraham was found on the papyri that are now missing. Others conclude that Joseph’s study of the papyri prompted a revelation about key events and teachings in the life of Abraham'
  - where: 'thread'
    claim: 'The chapter’s own verses: the fathers turned to idols (1:5–7), Abraham was delivered (1:15–17), the records were kept (1:31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'But the records of the fathers, even the patriarchs, concerning the right of Priesthood, the Lord my God preserved in mine own hands'
  - where: 'note 1:2 “Where Abraham found the priesthood”'
    claim: 'Priesthood handed down father to son from Adam; Abraham’s father had turned away so Abraham sought it from another source'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'Because Abraham’s own father had turned away from God, Abraham sought the priesthood from another source. The Doctrine and Covenants teaches that “Abraham received the priesthood from Melchizedek.”'
  - where: 'note 1:2 “Where Abraham found the priesthood”'
    claim: 'D&C 84:14 on Abraham receiving the priesthood from Melchizedek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Which Abraham received the priesthood from Melchizedek, who received it through the lineage of his fathers, even till Noah;'
  - where: 'note 1:2 “Where Abraham found the priesthood”'
    claim: 'D&C 107:40 on the order handed down from father to son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'The order of this priesthood was confirmed to be handed down from father to son, and rightly belongs to the literal descendants of the chosen seed, to whom the promises were made.'
  - where: 'note 1:3 “The right of the firstborn, traced to Adam”'
    claim: 'The current edition’s wording of 1:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'even the right of the firstborn, or the first man, who is Adam, or first father, through the fathers unto me.'
  - where: 'note 1:3 “The right of the firstborn, traced to Adam”'
    claim: 'The 1921 edition’s wording of 1:3'
    key: pgp-1921
    url: 'https://archive.org/download/pearlofgreatpric0000jose_d8d6/pearlofgreatpric0000jose_d8d6_djvu.txt'
    quote: 'even the right of the firstborn, on the first man,’ who is Adam,’ our first father, through the fathers, unto me.'
  - where: 'note 1:6 “The gods of Elkenah and the rest”'
    claim: 'Facsimile 1’s explanation labels figures 5–9 as the idolatrous gods named in the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'Fig. 5. The idolatrous god of Elkenah.'
  - where: 'note 1:6 “The gods of Elkenah and the rest”'
    claim: 'Elkenah has been suggested to be a shortened form of El Koneh Artzu; Olishem connected to Ulisum; the Church’s page says some names are similar to ancient ones'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'the god of Elkenah has been suggested by some Latter-day Saint scholars to represent a shortened form of the divine title El Koneh Artzu, which is known from a variety of northwest Semitic inscriptions and means something like “El, Creator of the Earth.”'
  - where: 'note 1:6 “The gods of Elkenah and the rest”'
    claim: 'Olishem proposed as Ulisum; the Church’s page also says there are interpretations not consistent with what is known'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'The “plain of Olishem,” for instance, has been connected by some scholars to a town in northwestern Syria called Ulisum.'
  - where: 'note 1:8 “The altar and the three virgins”'
    claim: 'Facsimile 1 labels the altar for sacrifice by the idolatrous priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'Fig. 4. The altar for sacrifice by the idolatrous priests, standing before the gods of Elkenah, Libnah, Mahmackrah, Korash, and Pharaoh.'
  - where: 'note 1:8 “The altar and the three virgins”'
    claim: 'The verses’ own account of the altar, the three virgins and the attempt on Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'These virgins were offered up because of their virtue; they would not bow down to worship gods of wood or of stone, therefore they were killed upon this altar'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'Three print facsimiles with Joseph Smith’s explanations were published in 1842; Abr. 1:12 refers to Facsimile 1'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'For example, Abraham 1:12 refers to “the representation at the commencement of this record,” meaning Facsimile 1.'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'Most explanations do not match Egyptologists; scholars have noted some parallels; the crocodile deity in the firmament'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'We do not know how the facsimiles relate to the text'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'We don’t know how the facsimiles relate to the text.'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'The same statement in Scripture Helps, at Abraham 1:12, 14'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: '“We don’t know how the facsimiles relate to the text. There is evidence that some Jewish authors during the era in which the papyri were created adapted and incorporated Egyptian drawings and stories into their own sacred texts'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'Facsimile 1’s figures 1–3 are the angel of the Lord, Abraham fastened upon an altar, and the priest of Elkenah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'Fig. 3. The idolatrous priest of Elkenah attempting to offer up Abraham as a sacrifice.'
  - where: 'note 1:16 “My name is Jehovah”'
    claim: 'Jehovah is the premortal Jesus Christ; Abr. 1:16 is cited as showing Jehovah was known to the ancient prophets'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'note 1:16 “My name is Jehovah”'
    claim: 'Jehovah was known to the ancient prophets (Ex. 6:3; Abr. 1:16)'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah was known to the ancient prophets (Ex. 6:3; Abr. 1:16).'
  - where: 'note 1:26 “Cursed as pertaining to the Priesthood”'
    claim: 'The verses do not clearly explain the curses; the Church disavows the past association with the priesthood and temple restriction'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'These verses do not clearly explain what the curses were or why they were given.'
  - where: 'note 1:26 “Cursed as pertaining to the Priesthood”'
    claim: 'The Church disavows past theories seeking to explain the restriction'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'Today, the Church disavows this and other past theories seeking to explain reasons for the priesthood and temple restriction.'
  - where: 'note 1:26 “Cursed as pertaining to the Priesthood”'
    claim: 'Speculation that Pharaoh lacked the priesthood as a descendant of Cain goes beyond scripture and should not be perpetuated'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'But this view goes beyond what the scriptures teach and should not be perpetuated today.'
  - where: 'note 1:26 “Cursed as pertaining to the Priesthood”'
    claim: 'The Church disavows theories that black skin is a sign of divine disfavor or reflects premortal unrighteousness'
    key: gte-race-priesthood
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng'
    quote: 'Today, the Church disavows the theories advanced in the past that black skin is a sign of divine disfavor or curse, or that it reflects unrighteous actions in a premortal life'
  - where: 'note 1:29 “A famine in Ur that Genesis does not mention”'
    claim: 'Abraham 2:1: the famine in Ur'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Now the Lord God caused the famine to wax sore in the land of Ur, insomuch that Haran, my brother, died'
  - where: 'note 1:29 “A famine in Ur that Genesis does not mention”'
    claim: 'Genesis 12:10 has a famine in the land of Canaan that sends Abram to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And there was a famine in the land: and Abram went down into Egypt to sojourn there; for the famine was grievous in the land.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'explore'
    claim: 'The Scripture Helps chapter on Genesis 12–17; Abraham 1–2 has sections on Abraham 1:2–3, 1:12 and 14, and 1:21–27'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'Abraham 1:12, 14: What are the facsimiles in the Book of Abraham?'
  - where: 'note 1:2 “Where Abraham found the priesthood”'
    claim: 'In Old Testament times the priesthood was handed down from father to son, beginning with Adam'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'In Old Testament times, the priesthood was “handed down from father to son,” beginning with Adam.'
  - where: 'note 1:6 “The gods of Elkenah and the rest”'
    claim: 'The truth and value of the book cannot be settled by scholarly debate'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'the truth and value of the book of Abraham cannot be settled by scholarly debate concerning the book’s translation.'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'Facsimile 1 contains a crocodile deity in the firmament; scholars identify Egyptian conceptions of heaven as a heavenly ocean; Jewish authors adapted Egyptian drawings'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Facsimile 1 contains a crocodile deity swimming in what Joseph Smith called “the firmament over our heads.” Scholars have similarly identified Egyptian conceptions of heaven as “a heavenly ocean.”'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'Jewish authors adapted and incorporated Egyptian drawings into their sacred texts; illustrations may have been repurposed'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'some Jewish authors during the era in which the papyri were created adapted and incorporated Egyptian drawings and stories into their own sacred texts'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'Facsimile 1 fig. 2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'Fig. 2. Abraham fastened upon an altar.'
  - where: 'note 1:26 “Cursed as pertaining to the Priesthood”'
    claim: 'Some have incorrectly associated the curse on Ham’s posterity with the priesthood and temple restriction'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'some have incorrectly associated the curse on Ham’s posterity with the priesthood and temple restriction pertaining to people of Black African descent in our dispensation. Today, the Church disavows this and other past theories'
  - where: 'note 1:2 “Where Abraham found the priesthood”'
    claim: 'Joseph Smith’s history, under 27 August (1843), records him saying that Melchizedek ordained Abram'
    key: jsp-history-e1-1708
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/80'
    quote: 'Abram, says to Melchisedec, I believe all that thou hast taught me concerning the Priesthood, and the coming of the Son of Man; so Melchisedeck ordained Abram and sent him away. Abram rejoiced saying now I have a Priesthood.'
  - where: 'note 1:6 “The gods of Elkenah and the rest”'
    claim: 'The Church’s page calls Ulisum a very plausible match for Olishem'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'This is a very plausible match for Olishem following standard linguistic practices.'
  - where: 'note 1:8 “The altar and the three virgins”'
    claim: 'Recent scholarship has found instances of execution for challenging the religious order, in Egypt and regions under its influence, dating to Abraham’s time'
    key: gte-book-of-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/translation-and-historicity-of-the-book-of-abraham?lang=eng'
    quote: 'Recent scholarship has found instances of such punishment dating to Abraham’s time. People who challenged the standing religious order, either in Egypt or in the regions over which it had influence (such as Canaan), could and did suffer execution for their offenses.'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'The facsimiles are based on images on the papyri and were included when the book was first published in 1842'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'The book of Abraham includes three print illustrations, known as facsimiles, which are based on images on the papyri.'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'It is possible the illustrations were repurposed as Jewish authors adapted Egyptian drawings'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'It is possible that these illustrations were repurposed in a similar way.'
  - where: 'note 1:12 “The representation at the commencement of this record”'
    claim: 'Facsimile 1 fig. 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'Fig. 1. The Angel of the Lord.'
  - where: 'note 1:16 “My name is Jehovah”'
    claim: 'The Joseph Smith Translation of Exodus 6:3 (footnote 3c) makes the clause a question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'And was not my name known unto them?'
  - where: 'note 1:16 “My name is Jehovah”'
    claim: 'Exodus 6:3 in the King James wording says God was not known to the patriarchs by the name Jehovah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'but by my name Jehovah was I not known to them.'
  - where: 'explore'
    claim: 'D&C 84:6–17 traces the priesthood back to Adam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'who received the priesthood by the commandments of God, by the hand of his father Adam, who was the first man'
  - where: 'explore'
    claim: 'D&C 107:40–52 gives the order from Adam by lineage, down to Noah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'This order was instituted in the days of Adam, and came down by lineage in the following manner:'
  - where: 'explore'
    claim: 'D&C 107:52 ends the list with Noah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'Noah was ten years old when he was ordained under the hand of Methuselah.'
