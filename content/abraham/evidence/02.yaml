chapter: 2
claims:
  - where: setting
    claim: 'Joseph Smith translated during summer and fall 1835, completing at least chapter 1 and part of chapter 2'
    key: gte-book-of-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/translation-and-historicity-of-the-book-of-abraham?lang=eng'
    quote: 'Joseph Smith worked on the translation of the book of Abraham during the summer and fall of 1835, by which time he completed at least the first chapter and part of the second chapter.'
  - where: setting
    claim: 'All five chapters and three facsimiles were printed in the Times and Seasons in Nauvoo between March and May 1842'
    key: gte-book-of-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/translation-and-historicity-of-the-book-of-abraham?lang=eng'
    quote: 'All five chapters of the book of Abraham, along with three illustrations (now known as facsimiles 1, 2, and 3), were published in the Times and Seasons, the Church’s newspaper in Nauvoo, between March and May 1842.'
  - where: setting
    claim: 'The first installment of the 1842 printing ended with the arrival at Sechem (Abr. 2:18)'
    key: jsp-book-of-abraham-1842
    url: 'https://www.josephsmithpapers.org/paper-summary/book-of-abraham-and-facsimiles-1-march-16-may-1842/4'
    quote: 'and I offered sacrifice there in the plains of Moreh, and called on the Lord devoutly because we had already come into the land of this idolatrous nation. [p. 706]'
  - where: setting
    claim: 'The next installment began with the Lord appearing in answer to prayer and giving the land to Abraham’s seed (Abr. 2:19)'
    key: jsp-book-of-abraham-1842
    url: 'https://www.josephsmithpapers.org/paper-summary/book-of-abraham-and-facsimiles-1-march-16-may-1842/5'
    quote: '14. And the Lord appeared unto me in answer to my prayers, and said unto me, unto thy seed I will give this land.'
  - where: setting
    claim: 'Abraham 2 tells of Haran’s death in the famine, the move to Haran, the Lord’s appearing, the journey through Canaan, and the approach to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Now the Lord God caused the famine to wax sore in the land of Ur, insomuch that Haran, my brother, died'
  - where: thread
    claim: 'Terah turned again to idolatry in Haran; the Lord’s call is to be a minister bearing His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'to make of thee a minister to bear my name in a strange land which I will give unto thy seed after thee for an everlasting possession, when they hearken to my voice.'
  - where: thread
    claim: 'Abraham’s fathers hearkened not to his voice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'and hearkened not unto my voice, but endeavored to take away my life by the hand of the priest of Elkenah.'
  - where: 'note 2:6 “The call is an errand”'
    claim: 'The call is to be a minister bearing the Lord’s name, with the land promised when they hearken; the seed bear the ministry and Priesthood to all nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'that in their hands they shall bear this ministry and Priesthood unto all nations;'
  - where: 'note 2:6 “The call is an errand”'
    claim: 'Heirs of the covenant are chosen to carry the gospel to all peoples'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'such are chosen to responsibly carry the gospel to all the peoples of the earth.'
  - where: 'note 2:6 “The call is an errand”'
    claim: 'President Benson: the responsibility of Abraham’s seed is to be missionaries'
    key: pgp-manual-abr-2-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/abraham-2-1-13?lang=eng'
    quote: 'The responsibility of the seed of Abraham, which we are, is to be missionaries to ‘bear this ministry and Priesthood unto all nations’ (Abraham 2:9)'
  - where: 'note 2:6 “The call is an errand”'
    claim: 'Of the land promised in Gen. 17:8: Christ’s words to the Nephites show the covenant is conditional on the obedience of Abraham’s seed (the article does not discuss Abr. 2:6)'
    key: sc-knowhy-408
    url: 'https://scripturecentral.org/knowhy/how-can-we-receive-the-blessings-of-the-abrahamic-covenant'
    quote: 'Yet when Christ visited the Nephites, He showed that this covenant is actually conditional on the obedience of Abraham’s seed.'
  - where: 'note 2:8 “The Lord who delivered him is Jehovah”'
    claim: 'Jehovah is the premortal Jesus Christ; Abr. 1:16 is cited as Jehovah known to the ancient prophets'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'note 2:8 “The Lord who delivered him is Jehovah”'
    claim: 'The Lord’s self-description in 2:7 lists the sea, wind, fire and mountains obeying Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'I stretch my hand over the sea, and it obeys my voice; I cause the wind and the fire to be my chariot; I say to the mountains—Depart hence—and behold, they are taken away by a whirlwind'
  - where: 'note 2:10 “Adopted into Abraham’s family”'
    claim: 'Abr. 2:10–11 say those who receive the gospel are accounted Abraham’s seed, and also name the literal seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'for as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed, and shall rise up and bless thee, as their father;'
  - where: 'note 2:10 “Adopted into Abraham’s family”'
    claim: 'President Nelson: heirs to the covenant by birth or by adoption'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Thus, we can become heirs to the covenant either by birth or by adoption.'
  - where: 'note 2:10 “Adopted into Abraham’s family”'
    claim: 'Abraham’s covenants are described in family terms, through birth or through adoption (Abr. 2:9–10)'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'A covenant deals with family relationships, either through birth (Genesis 15:2–4) or adoption (Abraham 2:9–10).'
  - where: 'note 2:11 “The right passes on”'
    claim: 'Abraham sought the right of the fathers, which came down from the fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'It was conferred upon me from the fathers; it came down from the fathers, from the beginning of time'
  - where: 'note 2:11 “The right passes on”'
    claim: 'The priesthood was handed down from father to son; Abraham received it from Melchizedek'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'In Old Testament times, the priesthood was “handed down from father to son,” beginning with Adam.'
  - where: 'note 2:11 “The right passes on”'
    claim: 'D&C 84:14: Abraham received the priesthood from Melchizedek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Which Abraham received the priesthood from Melchizedek, who received it through the lineage of his fathers, even till Noah;'
  - where: 'note 2:11 “The right passes on”'
    claim: 'D&C 110:12: Elias committed the dispensation of the gospel of Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'After this, Elias appeared, and committed the dispensation of the gospel of Abraham, saying that in us and our seed all generations after us should be blessed.'
  - where: 'note 2:11 “The right passes on”'
    claim: 'The promises remain with Abraham’s seed but must be accepted'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'the Book of Abraham confirms that the promises will remain with Abraham’s seed (Abraham 2:11) but also indicates that the promised blessings must be accepted by those who follow Abraham’s example of faith and commitment to God'
  - where: thread
    claim: 'Abraham 1:15: when Abraham lifted up his voice, the Lord hearkened and heard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'behold, I lifted up my voice unto the Lord my God, and the Lord hearkened and heard, and he filled me with the vision of the Almighty, and the angel of his presence stood by me'
  - where: thread
    claim: 'Abraham 2:12–13: Abraham says he will do well to hearken to the Lord’s voice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Thy servant has sought thee earnestly; now I have found thee; Thou didst send thine angel to deliver me from the gods of Elkenah, and I will do well to hearken unto thy voice'
  - where: 'note 2:11 “The right passes on”'
    claim: 'The keys of the priesthood given to Abraham were restored when Elias appeared in the Kirtland Temple (D&C 110:12), said of Abr. 2:11'
    key: pgp-manual-abr-2-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/abraham-2-1-13?lang=eng'
    quote: 'The same keys of the priesthood given to Abraham have been restored to the earth in the latter days.'
  - where: 'note 2:14 “Sixty-two, not seventy-five”'
    claim: 'Abraham 2:14 gives sixty-two as the age on leaving Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'and I, Abraham, was sixty and two years old when I departed out of Haran.'
  - where: 'note 2:14 “Sixty-two, not seventy-five”'
    claim: 'Genesis 12:4 gives seventy-five'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'Abram was seventy and five years old when he departed out of Haran.'
  - where: 'note 2:14 “Sixty-two, not seventy-five”'
    claim: 'The 1842 Times and Seasons printing reads sixty and two years'
    key: jsp-book-of-abraham-1842
    url: 'https://www.josephsmithpapers.org/paper-summary/book-of-abraham-and-facsimiles-1-march-16-may-1842/4'
    quote: 'was sixty and two years old when I departed out of Haran.'
  - where: 'note 2:17 “A prayer for the house he left”'
    claim: 'Abraham prays at Jershon that the famine be turned from his father’s house; Terah returned to idolatry; the famine continued'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'and prayed that the famine might be turned away from my father’s house, that they might not perish;'
  - where: 'note 2:17 “A prayer for the house he left”'
    claim: 'The famine led Terah to repent of the evil determined against Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'and he repented of the evil which he had determined against me, to take away my life.'
  - where: 'note 2:22 “The Lord told Abraham what Sarai should say”'
    claim: 'The Lord names the danger and gives the instruction; Abraham tells Sarai and asks her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'And it came to pass that I, Abraham, told Sarai, my wife, all that the Lord had said unto me—Therefore say unto them, I pray thee, thou art my sister, that it may be well with me for thy sake'
  - where: 'note 2:22 “The Lord told Abraham what Sarai should say”'
    claim: 'Abraham and Sarah obeyed the Lord’s counsel and were spared'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'Abraham and Sarah obeyed the Lord’s counsel and were spared from a dangerous situation.'
  - where: 'note 2:22 “The Lord told Abraham what Sarai should say”'
    claim: 'The Book of Abraham portrays God as instructing Abraham, a detail not in Genesis'
    key: smoot-sarai
    url: 'https://byustudies.byu.edu/article/did-abraham-lie-about-his-wife-sarai'
    quote: 'the Book of Abraham portrays God as instructing Abraham to engage in the subterfuge, a detail not found in the Genesis account.'
  - where: 'note 2:22 “The Lord told Abraham what Sarai should say”'
    claim: 'Abraham later says Sarah is his sister, his father’s daughter but not his mother’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/20?lang=eng'
    quote: 'And yet indeed she is my sister; she is the daughter of my father, but not the daughter of my mother; and she became my wife.'
  - where: 'note 2:22 “The Lord told Abraham what Sarai should say”'
    claim: 'Because both descended from Terah, the customs of their time would likely have allowed Abraham to call Sarah his sister accurately'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'Because Abraham and Sarah both descended from Terah, customs of their time would likely have allowed for Abraham to accurately refer to Sarah as his sister.'
  - where: 'note 2:22 “The Lord told Abraham what Sarai should say”'
    claim: 'Abraham used ambiguous terminology and did not necessarily make a false statement'
    key: smoot-sarai
    url: 'https://byustudies.byu.edu/article/did-abraham-lie-about-his-wife-sarai'
    quote: 'Abraham appears to have been using somewhat ambiguous terminology and not necessarily making an outright false statement.'
  - where: christ
    claim: 'Among the promises to Abraham: Jesus Christ would be born through his lineage'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'Jesus Christ would be born through his lineage.'
