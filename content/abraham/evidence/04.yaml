chapter: 4
claims:
  - where: when
    claim: The book was revealed to Joseph Smith beginning in 1835
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: "This book of scripture was revealed to Joseph Smith beginning in 1835 at a time when he was studying some ancient Egyptian papyri the Saints had purchased."
  - where: when
    claim: It was first published in the Times and Seasons beginning in March 1842
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: "Joseph Smith later translated some of the writings and published them as the “Book of Abraham” in a Church publication called the Times and Seasons beginning in March 1842."
  - where: setting
    claim: The plan of chapter 3 is to go down and make an earth of materials
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: "We will go down, for there is space there, and we will take of these materials, and we will make an earth whereon these may dwell;"
  - where: setting
    claim: In Abraham each creative period is called a time
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: "But in the book of Abraham, each period is referred to as a time."
  - where: thread
    claim: The Gods watch what they ordered until it obeys
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "And the Gods watched those things which they had ordered until they obeyed."
  - where: thread
    claim: Genesis says God saw that it was good
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/1?lang=eng'
    quote: "And God called the dry land Earth; and the gathering together of the waters called he Seas: and God saw that it was good."
  - where: thread
    claim: In Abraham 4 the word good is used of the plan (verse 21), and 4:31 forecasts obedience
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "And the Gods saw that they would be obeyed, and that their plan was good."
  - where: note 4:1 “Who goes down”
    claim: Chapter 3 announces going down and making an earth from materials
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: "We will go down, for there is space there, and we will take of these materials, and we will make an earth whereon these may dwell;"
  - where: note 4:1 “Who goes down”
    claim: Abraham 4:1 takes up the going down that the council of 3:24 announced
    key: sc-knowhy-832
    url: 'https://scripturecentral.org/knowhy/why-are-other-people-with-god-when-he-is-planning-the-creation'
    quote: "Chapter 4 goes on to express the fulfillment of their plans"
  - where: note 4:1 “Who goes down”
    claim: Others may have assisted Jesus Christ with the Creation
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: "we have reason to believe that others may have assisted Jesus Christ with the Creation."
  - where: note 4:6 “The expanse and the facsimile explanations”
    claim: The explanation of Facsimile 1, figure 12, uses the word expanse and the name Raukeeyang
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: "Fig. 12. Raukeeyang, signifying expanse, or the firmament over our heads; but in this case, in relation to this subject, the Egyptians meant it to signify Shaumau, to be high, or the heavens, answering to the Hebrew word, Shaumahyeem."
  - where: note 4:6 “The expanse and the facsimile explanations”
    claim: The explanation of Facsimile 2, figure 4, uses the same word
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: "Fig. 4. Answers to the Hebrew word Raukeeyang, signifying expanse, or the firmament of the heavens"
  - where: note 4:6 “The expanse and the facsimile explanations”
    claim: Facsimiles are three print illustrations published in 1842 with Joseph Smith's explanations; Abraham 1:12 refers to Facsimile 1
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: "The book of Abraham includes three print illustrations, known as facsimiles, which are based on images on the papyri."
  - where: note 4:6 “The expanse and the facsimile explanations”
    claim: Most explanations do not match Egyptologists' interpretations, though parallels have been noted, including the firmament in Facsimile 1
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: "Facsimile 1 contains a crocodile deity swimming in what Joseph Smith called “the firmament over our heads.” Scholars have similarly identified Egyptian conceptions of heaven as “a heavenly ocean.”"
  - where: note 4:6 “The expanse and the facsimile explanations”
    claim: Most explanations do not match modern Egyptologists' interpretations
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: "Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists."
  - where: note 4:6 “The expanse and the facsimile explanations”
    claim: It is not known how the facsimiles relate to the text
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: "We don’t know how the facsimiles relate to the text."
  - where: note 4:18 “Watched until they obeyed”
    claim: Abraham 4:10 says the Gods saw that they were obeyed, where Genesis 1:10 says it was good
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "and the Gods saw that they were obeyed."
  - where: note 4:18 “Watched until they obeyed”
    claim: Genesis 1:10 says God saw that it was good
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/1?lang=eng'
    quote: "and God saw that it was good."
  - where: christ
    claim: Jesus Christ organized the earth from materials
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: "Abraham’s Creation account teaches us that Jesus Christ organized the earth out of preexisting “materials.”"
  - where: christ
    claim: Christ is in the sun, moon and stars and the power by which they were made
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: "As also he is in the moon, and is the light of the moon, and the power thereof by which it was made;"
  - where: 'thread'
    claim: The Church's chapter heading describes Abraham 4 as the Gods' plans for the six days of creation
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "The Gods plan the creation of the earth and all life thereon—Their plans for the six days of creation are set forth."
  - where: 'thread'
    claim: In 4:21 and 4:25 the Gods see that they would be obeyed
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "And the Gods saw that they would be obeyed, and that their plan was good."
  - where: 'note 4:18 “Watched until they obeyed”'
    claim: The Church's chapter heading describes Abraham 4 as the Gods' plans for the six days of creation
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "The Gods plan the creation of the earth and all life thereon—Their plans for the six days of creation are set forth."
  - where: 'note 4:18 “Watched until they obeyed”'
    claim: Verse 21 says the Gods saw that they would be obeyed and that their plan was good
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "And the Gods saw that they would be obeyed, and that their plan was good."
  - where: 'note 4:18 “Watched until they obeyed”'
    claim: Verse 25 says the Gods saw they would obey
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "and the Gods saw they would obey."
  - where: 'note 4:18 “Watched until they obeyed”'
    claim: Verse 31 says they shall be very obedient
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "We will do everything that we have said, and organize them; and behold, they shall be very obedient."
  - where: 'note 4:18 “Watched until they obeyed”'
    claim: In verse 18 the Gods watched until they obeyed
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: "And the Gods watched those things which they had ordered until they obeyed."
  - where: 'christ'
    claim: The Church's footnote to “lights” in Abraham 4:14 points to D&C 88:7–11, which says Christ is in the sun and the power by which it was made
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: "As also he is in the sun, and the light of the sun, and the power thereof by which it was made."
