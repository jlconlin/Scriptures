chapter: 5
claims:
  - where: 'setting'
    claim: 'The book was revealed to Joseph Smith beginning in 1835, while he studied Egyptian papyri the Saints had purchased'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'revealed to Joseph Smith beginning in 1835 at a time when he was studying some ancient Egyptian papyri the Saints had purchased'
  - where: 'setting'
    claim: 'This chapter was printed in the Times and Seasons of 15 March 1842, page 722'
    key: pgp-manual-abr-4-5
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: '(see also “The Book of Abraham,” Times and Seasons, Mar. 15, 1842, 722)'
  - where: 'setting'
    claim: 'The Joseph Smith Papers page 722 of the 1842 printing carries the text of this chapter (it begins at “And the Gods came down and formed these”)'
    key: jsp-book-of-abraham-1842-722
    url: 'https://www.josephsmithpapers.org/paper-summary/book-of-abraham-and-facsimiles-1-march-16-may-1842/9'
    quote: 'And the Gods came down and formed these, the generations of the heavens, and of the earth, when they were formed'
  - where: 'when'
    claim: 'The book was revealed to Joseph Smith beginning in 1835'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'revealed to Joseph Smith beginning in 1835 at a time when he was studying some ancient Egyptian papyri the Saints had purchased'
  - where: 'when'
    claim: 'Printed in the Times and Seasons, 15 March 1842'
    key: pgp-manual-abr-4-5
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: '(see also “The Book of Abraham,” Times and Seasons, Mar. 15, 1842, 722)'
  - where: 'note 5:2 “Rest at the end of a counseled work”'
    claim: 'The creative periods in Abraham 4 are called “times,” not days'
    key: pgp-manual-abr-4-5
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'Additionally, the creative periods in Abraham 4 are called “times,” not days (see Abraham 4:8, 13, 19, 23, 31).'
  - where: 'note 5:2 “Rest at the end of a counseled work”'
    claim: 'President Kimball spoke of a blueprint made before the earth was created and quoted Abraham 3:24–25 for it; the manual prints the statement under Abraham 5:1–3, 5'
    key: pgp-manual-abr-4-5
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'Before this earth was created the Lord made a blueprint, as any great contractor will do before constructing. He drew up the plans, wrote the specifications, and presented them.'
  - where: 'note 5:2 “Rest at the end of a counseled work”'
    claim: 'The Church’s chapter heading for Abraham 5 says the Gods finish their planning and then bring the Creation to pass according to their plans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'The Gods finish Their planning of the creation of all things—They bring to pass the Creation according to Their plans'
  - where: 'note 5:2 “Rest at the end of a counseled work”'
    claim: 'Abraham 5:2–5 uses “counseled” five times (verses 2, 3, 5); the verses say the Gods concluded upon the seventh time and sanctified it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'the Gods concluded upon the seventh time, because that on the seventh time they would rest from all their works which they (the Gods) counseled among themselves to form'
  - where: 'note 5:4 “The Gods come down”'
    claim: 'In Abraham 3:24 the one like unto God says “We will go down … we will make an earth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'We will go down, for there is space there, and we will take of these materials, and we will make an earth whereon these may dwell'
  - where: 'note 5:4 “The Gods come down”'
    claim: 'Abraham 3:25 gives the purpose: to prove them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'we will prove them herewith, to see if they will do all things whatsoever the Lord their God shall command them'
  - where: 'note 5:4 “The Gods come down”'
    claim: 'Genesis 2:4 has no coming down: the LORD God “made the earth and the heavens”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'in the day that the LORD God made the earth and the heavens'
  - where: 'note 5:13 “The reckoning not yet given to Adam”'
    claim: 'Abraham 3:4 defines the Lord’s time by a revolution of Kolob, one thousand years by earth’s reckoning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'one revolution was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest'
  - where: 'note 5:13 “The reckoning not yet given to Adam”'
    claim: 'Facsimile 2, figure 1 (Joseph Smith’s explanation) names Kolob and says what a day in Kolob is'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'First in government, the last pertaining to the measurement of time. The measurement according to celestial time, which celestial time signifies one day to a cubit. One day in Kolob is equal to a thousand years according to the measurement of this earth'
  - where: 'note 5:13 “The reckoning not yet given to Adam”'
    claim: 'The Church says we do not know how the facsimiles relate to the text'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'We don’t know how the facsimiles relate to the text.'
  - where: 'note 5:13 “The reckoning not yet given to Adam”'
    claim: 'Most of the explanations do not match the interpretations of modern Egyptologists; scholars have noted some parallels'
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.'
  - where: 'note 5:13 “The reckoning not yet given to Adam”'
    claim: 'Abraham 5:13 is the only place in chapters 4–5 where Abraham names himself; the verse reads “for in the time that thou eatest”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'Now I, Abraham, saw that it was after the Lord’s time, which was after the time of Kolob; for as yet the Gods had not appointed unto Adam his reckoning.'
  - where: 'note 5:21 “Found, where Genesis says not found”'
    claim: 'Genesis 2:20 reads “there was not found an help meet for him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'but for Adam there was not found an help meet for him'
  - where: 'note 5:21 “Found, where Genesis says not found”'
    claim: 'Moses 3:20 reads “there was not found an help meet for him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: 'but as for Adam, there was not found an help meet for him'
  - where: 'note 5:21 “Found, where Genesis says not found”'
    claim: 'Abraham 5:14–16 form the woman before the animals are named in 5:20–21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'And Adam gave names to all cattle, to the fowl of the air, to every beast of the field; and for Adam, there was found an help meet for him.'
  - where: 'note 5:21 “Found, where Genesis says not found”'
    claim: 'The 1842 printing reads “and for Adam there was found an help meet for him”'
    key: jsp-book-of-abraham-1842-722
    url: 'https://www.josephsmithpapers.org/paper-summary/book-of-abraham-and-facsimiles-1-march-16-may-1842/9'
    quote: 'And Adam gave names to all cattle, to the fowl of the air, to every beast of the field; and for Adam there was found an help meet for him.'
  - where: 'christ'
    claim: 'Moses 3:18 has the Lord speaking to His Only Begotten before the help meet is made'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: 'And I, the Lord God, said unto mine Only Begotten, that it was not good that the man should be alone; wherefore, I will make an help meet for him.'
  - where: 'christ'
    claim: 'Others may have assisted Jesus Christ with the Creation'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'From Abraham’s account and other prophetic sources, we have reason to believe that others may have assisted Jesus Christ with the Creation.'
  - where: 'christ'
    claim: 'Kolob is read as symbolic of Jesus Christ'
    key: pgp-manual-abr-4-5
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'Kolob is also symbolic of Jesus Christ, the central figure in God’s plan of salvation.'
  - where: 'setting'
    claim: 'The breath of life in Abraham 5:7 is “the man’s spirit”'
    key: pgp-manual-abr-4-5
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'Abraham 5:7 helps us understand that the breath of life was “the man’s spirit”'
  - where: 'note 5:2 “Rest at the end of a counseled work”'
    claim: 'Abraham 5:5 says the Gods formed the heavens and the earth according to all they had said'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'According to all that which they had said concerning every plant of the field before it was in the earth'
  - where: 'christ'
    claim: 'Joseph Smith’s explanation of Facsimile 2, figure 1, calls Kolob first in government; the manual sets the symbol of Christ beside that explanation'
    key: pgp-manual-abr-4-5
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'the Prophet Joseph Smith (1805–44) said that Kolob is “first in government, the last pertaining to the measurement of time.”'
