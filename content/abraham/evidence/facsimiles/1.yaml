facsimile: 1
claims:
  - where: 'about'
    claim: 'Abr. 1:12: the priests meant to slay Abraham on the altar, and he refers the reader to the representation for it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'that you may have a knowledge of this altar, I will refer you to the representation at the commencement of this record'
  - where: 'about'
    claim: 'The representation of Abr. 1:12 is Facsimile 1'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Abraham 1:12 refers to “the representation at the commencement of this record,” meaning Facsimile 1.'
  - where: 'about'
    claim: 'Abr. 1:14 refers the reader to the figures for the fashion of the gods'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'I have given you the fashion of them in the figures at the beginning'
  - where: 'about'
    claim: 'The explanation names the altar in figure 4'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'The altar for sacrifice by the idolatrous priests'
  - where: 'about'
    claim: 'The explanation names the five gods in figures 5 to 9 (the last of them)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'The idolatrous god of Pharaoh.'
  - where: 'about'
    claim: 'The facsimiles were published in 1842 with Joseph Smith''s explanations'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'These facsimiles were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.'
  - where: 'about'
    claim: 'Most explanations do not match Egyptologists, though scholars have noted some parallels'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.'
  - where: 'about'
    claim: 'It is not known how the facsimiles relate to the text'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'We don’t know how the facsimiles relate to the text.'
  - where: 'note fig. 1 “The angel who delivers Abraham”'
    claim: 'The explanation names figure 1 the Angel of the Lord'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'The Angel of the Lord.'
  - where: 'note fig. 1 “The angel who delivers Abraham”'
    claim: 'Abr. 1:15 speaks of the angel of his presence who unloosed his bands'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'the angel of his presence stood by me, and immediately unloosed my bands'
  - where: 'note fig. 1 “The angel who delivers Abraham”'
    claim: 'Abr. 2:13 speaks of the angel sent to deliver Abraham'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Thou didst send thine angel to deliver me from the gods of Elkenah'
  - where: 'note fig. 1 “The angel who delivers Abraham”'
    claim: 'Abr. 3:20 speaks of the angel sent to deliver Abraham'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'The Lord thy God sent his angel to deliver thee from the hands of the priest of Elkenah.'
  - where: 'note fig. 1 “The angel who delivers Abraham”'
    claim: 'Abr. 1:16 has the voice say "my name is Jehovah"'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'behold, my name is Jehovah, and I have heard thee'
  - where: 'note fig. 4 “The explanation uses the verses'' names, in the verses'' order”'
    claim: 'The explanation lists the altar before the gods of Elkenah, Libnah, Mahmackrah, Korash and Pharaoh (figure 4)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'standing before the gods of Elkenah, Libnah, Mahmackrah, Korash, and Pharaoh'
  - where: 'note fig. 4 “The explanation uses the verses'' names, in the verses'' order”'
    claim: 'Figures 5 to 9 name the gods one by one, beginning with Elkenah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'The idolatrous god of Elkenah.'
  - where: 'note fig. 4 “The explanation uses the verses'' names, in the verses'' order”'
    claim: 'Abr. 1:13 lists the gods before whom the altar stood'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'it stood before the gods of Elkenah, Libnah, Mahmackrah, Korash, and also a god like unto that of Pharaoh, king of Egypt'
  - where: 'note fig. 12 “Raukeeyang, the expanse, and the heavens”'
    claim: 'The explanation of fig. 12 gives Raukeeyang as expanse and the firmament, and Shaumau as the heavens'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'Raukeeyang, signifying expanse, or the firmament over our heads; but in this case, in relation to this subject, the Egyptians meant it to signify Shaumau, to be high, or the heavens'
  - where: 'note fig. 12 “Raukeeyang, the expanse, and the heavens”'
    claim: 'Abr. 4:6 has "Let there be an expanse in the midst of the waters"'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'Let there be an expanse in the midst of the waters'
  - where: 'note fig. 12 “Raukeeyang, the expanse, and the heavens”'
    claim: 'Abr. 4:8 says the Gods called the expanse Heaven, at the second time'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'And the Gods called the expanse, Heaven.'
  - where: 'note fig. 12 “Raukeeyang, the expanse, and the heavens”'
    claim: 'Facsimile 2 figure 4 uses Raukeeyang for expanse, or the firmament of the heavens'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'Answers to the Hebrew word Raukeeyang, signifying expanse, or the firmament of the heavens'
  - where: 'note fig. 12 “Raukeeyang, the expanse, and the heavens”'
    claim: 'The Church names the crocodile deity in the firmament and a heavenly ocean as a parallel scholars have noted'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Facsimile 1 contains a crocodile deity swimming in what Joseph Smith called “the firmament over our heads.” Scholars have similarly identified Egyptian conceptions of heaven as “a heavenly ocean.”'
