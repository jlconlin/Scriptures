facsimile: 1
claims:
  - where: 'about'
    claim: 'Abr. 1:12: the priests meant to slay Abraham on the altar, and he refers the reader to the representation for it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'that you may have a knowledge of this altar, I will refer you to the representation at the commencement of this record'
  - where: 'about'
    claim: 'The representation of Abr. 1:12 is Facsimile 1'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Abraham 1:12 refers to “the representation at the commencement of this record,” meaning Facsimile 1.'
  - where: 'about'
    claim: 'Abr. 1:14 refers the reader to the figures for the fashion of the gods'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'I have given you the fashion of them in the figures at the beginning'
  - where: 'about'
    claim: 'The explanation names the altar in figure 4'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'The altar for sacrifice by the idolatrous priests'
  - where: 'about'
    claim: 'The explanation names the five gods in figures 5 to 9 (the last of them)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-1?lang=eng'
    quote: 'The idolatrous god of Pharaoh.'
  - where: 'about'
    claim: 'The facsimiles were published in 1842 with Joseph Smith''s explanations'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'These facsimiles were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.'
  - where: 'about'
    claim: 'Most explanations do not match Egyptologists, though scholars have noted some parallels'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.'
  - where: 'about'
    claim: 'It is not known how the facsimiles relate to the text'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'We don’t know how the facsimiles relate to the text.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Scholars have offered a number of approaches'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'Latter-­day Saint scholars and interested laypersons have offered a number of different approaches to understanding the fac­similes.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'First approach: figures original to Abraham, read as Egyptians of his day would'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'The facsimiles were original to Abraham. To interpret them we should look to how Egyptians in Abraham’s day, or Abraham himself, would have understood them.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Second approach: original to Abraham but modified'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'The facsimiles were original to Abraham but were modified over time for use by the ancient Egyptians.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Third approach: connected in the Ptolemaic period'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'The facsimiles were connected to the Book of Abraham when the Joseph Smith Papyri were created in the Ptolemaic period (ca. 330–30 BC).'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Further approaches hold the facsimiles were never part of the Book of Abraham (named on the page, not taken up)'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'The facsimiles were never part of the Book of Abraham but instead were completely reinterpreted by Joseph Smith to artistically depict the text he revealed or translated.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'No one explanation accounts for all the evidence'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'it appears that no one single explanation on its own can account for all the available evidence.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'The first approach is undermined by the papyri’s date'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'is severely undermined by the fact that the Joseph Smith Papyri date to many centuries after Abraham’s lifetime.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Proposal that the facsimiles may not have been drawn by Abraham'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'that the facsimiles may not have been drawn by Abraham’s hand,'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Proposal that an Egyptian Jewish editor adapted them'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'adopted or adapted by an Egyptian-­Jewish redactor as illustrations of the Book of Abraham'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Testament of Abraham: date and place'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: '(probably composed in Greek in the first century AD in Egypt)'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Testament of Abraham draws on Book of the Dead 125'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'the Testament of Abraham appears to be drawing directly from the judgment imagery in chapter 125 from the Egyptian Book of the Dead.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Abraham as substitute for Osiris in Facsimiles 1 and 3'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'Abraham is a Jewish substitute for the pagan god Osiris—just as is the case in Facsimiles 1 and 3.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'The theory requires rejecting the assumption that Abraham drew them, and a complex transmission'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'it does require Latter-­day Saints to reject some traditional assumptions about the facsimiles'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'It presupposes a more complex transmission of the text'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'This theory likewise presupposes a more complex transmission of the Book of Abraham text than perhaps traditionally recognized.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Acceptance not fatal to inspiration'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'acceptance of these two points to accommodate Barney’s theory is by no means fatal to the inspiration of the Book of Abraham'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'The theory is offered as perhaps not definitive'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'Barney’s theory, while perhaps not definitive, is “valuable and attractive”'
  - where: 'note fig. 2 “Egyptologists read the scene as a lion couch scene”'
    claim: 'Joseph Smith’s reading clashes with Egyptological ones; scene called a lion couch scene'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'Joseph Smith’s interpretation of this scene (sometimes called a lion couch scene, due to the prominent lion couch at the center of the illustrations) has clashed with Egyptological interpretations.'
  - where: 'note fig. 2 “Egyptologists read the scene as a lion couch scene”'
    claim: '1860 reading as resurrection of Osiris'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'In 1860, the French Egyptologist Théodule Devéria interpreted Facsimile 1 as depicting the resurrection of the god Osiris.'
  - where: 'note fig. 2 “Egyptologists read the scene as a lion couch scene”'
    claim: '1912 readings: Anubis preparing the body'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'the well known scene of Anubis preparing the body of the dead man,'
  - where: 'note fig. 2 “Egyptologists read the scene as a lion couch scene”'
    claim: '1912 readings: an embalmer'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'an embalmer preparing a body for burial,'
  - where: 'note fig. 2 “Egyptologists read the scene as a lion couch scene”'
    claim: '1912 readings: a dead man on a bier prepared for mummification'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'a dead man . . . lying on a bier” and being prepared for mummification'
  - where: 'note fig. 2 “Egyptologists read the scene as a lion couch scene”'
    claim: 'Similar readings given more recently'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'Similar interpretations of Facsimile 1 have been given in more recent years.'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Head and knife are missing in the fragment'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'In the original papyrus fragment, however, the areas with the bald head and knife are currently missing.'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'An unknown person tried to fill in the head'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'At some unknown point by some unknown person, an attempt was made to fill in the missing head of figure 3'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Two eyewitnesses to a knife'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'This gives us two independent eyewitnesses to the presence of a knife on Facsimile 1, regardless of what we might [otherwise] think.'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Eyewitness reports: a priest with a knife in his hand'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'a Priest, with a knife in his hand'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Knife shape matches Egyptian flint knives used for ritual slaughter'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'the crescent shape of the knife in figure 3’s hand is consistent with the shape of ancient Egyptian flint knives that were used in ancient Egypt for, among other activities, “ritual slaughter” and execration rites.'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Traces of a jackal headdress over the left shoulder'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'That the figure originally had a jackal headdress seems likely, since traces of the headdress over the left shoulder of figure 3 can be detected in the surviving papyrus fragment.'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Egyptologists have called the figure a priest, others Anubis'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'Some Egyptologists have identified this figure as a priest,'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'The identification as Anubis is to be accepted cautiously without a caption'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'without a hieroglyphic caption for this figure,14 this identification should be accepted cautiously'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Priest or god is a false dichotomy'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'appears to be a false dichotomy.'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'An embalming text has a priest wearing the head of Anubis'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'Anubis, the stolites priest wearing the head of this god, sits down'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'The text identifies the mask wearer as a priest'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'It furthermore identifies the individual wearing the mask as a priest.'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Leopard-skin robe on the original, consistent with a priest'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'which is not clearly depicted in the facsimile, but is undoubtedly shown on the original papyrus'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'The leopard-skin robe fits a priest'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'would also be consistent with identifying this figure as a priest'
  - where: 'note fig. 3 “The case that figure 3 could be a priest”'
    claim: 'Conclusion: a priest is not outside the realm of possibility'
    key: smoot-fac1-priest
    url: 'https://byustudies.byu.edu/article/the-idolatrous-priest-facsimile-1-figure-3'
    quote: 'the identification of this figure as a priest is not outside the realm of possibility from an Egyptological perspective.'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'Evidence suggests a connection between sacred violence and embalming and resurrection scenes'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'more recent investigation has turned up evidence that suggests a connection between sacred violence and scenes of the embalming and resurrection of the deceased'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'The evidence is in the roof chapels of the Dendara temple'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'Evidence linking Osiris’s mummification and resurrection with execration rituals can be detected “in the roof chapels of the Dendara Temple.”'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'Lion couch word sounds like slaughterhouse and offerings'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'the word for the “lion couch” (nmỉt) is homophonous, or nearly identical, with the word for “abattoir, slaughterhouse” (nmt) as well as for “offerings” (nmt).'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'Anubis and the sons of Horus hold knives'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'in the same chapel, we have depictions of Anubis and the sons of Horus (presumably the figures under the lion couch in Facsimile 1) holding knives.'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'Anubis smites adversaries with the knife'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'who smites the adversaries with his might, since the knife is in his hand'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'At least some Egyptians linked Osiris’s resurrection with slaughter of enemies'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'it can be seen that at least some ancient Egyptians associated scenes of the resurrection of Osiris with the slaughter of enemies.'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'Embalming was after death and never meant to kill'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'embalming and mummification were only ever performed after the death of a person and were never meant to inflict death or otherwise sacrifice the person on the lion couch.'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'The knives were for Osiris’s enemies, not Osiris'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'Anubis and the other figures attending to the mummification of the dead were meant to slaughter the enemies of Osiris, certainly not the figure of Osiris on the lion couch.'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'The parallels are not perfect matches'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'Nor is it to suggest that these parallels are perfect matches for how Joseph Smith interpreted this scene.'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'Excluding a sacrificial dimension is un-Egyptian, though no one definitive reading'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'is un-­Egyptian, even if we cannot come up with one definitive reading [of Facsimile 1] at this time.'
  - where: 'note fig. 4 “Hor, the Theban priest whose papyrus supplied the picture”'
    claim: 'Facsimiles 1 and 3 come from vignettes on P. Joseph Smith I'
    key: smoot-papyri-owners
    url: 'https://byustudies.byu.edu/article/the-ancient-owners-of-the-joseph-smith-papyri'
    quote: 'Joseph Smith incorporated Facsimiles 1 and 3 of the Book of Abraham from vignettes or illustrations contained on a papyrus now designated P. Joseph Smith I, XI–X'
  - where: 'note fig. 4 “Hor, the Theban priest whose papyrus supplied the picture”'
    claim: 'Owner was Hor (Horos), about 200 BC, priest of three deities at Thebes'
    key: smoot-papyri-owners
    url: 'https://byustudies.byu.edu/article/the-ancient-owners-of-the-joseph-smith-papyri'
    quote: 'Hor lived during “about the same time period as the Rosetta Stone” (that is, around 200 BC) and was a priest or prophet of three Egyptian deities in the ancient city of Thebes.'
  - where: 'note fig. 4 “Hor, the Theban priest whose papyrus supplied the picture”'
    claim: 'Min-Who-Massacres-His-Enemies was a combined Min and Resheph deity'
    key: smoot-papyri-owners
    url: 'https://byustudies.byu.edu/article/the-ancient-owners-of-the-joseph-smith-papyri'
    quote: 'This lesser-­known god was a syncretized, or combined, deity drawing from the Egyptian god Min and the Canaanite warrior-­god Resheph.'
  - where: 'note fig. 4 “Hor, the Theban priest whose papyrus supplied the picture”'
    claim: 'Worship by human sacrifice in effigy; slaying and burning on an altar'
    key: smoot-papyri-owners
    url: 'https://byustudies.byu.edu/article/the-ancient-owners-of-the-joseph-smith-papyri'
    quote: 'This deity was worshipped by performing human sacrifice in effigy.'
  - where: 'note fig. 4 “Hor, the Theban priest whose papyrus supplied the picture”'
    claim: 'Rituals: binding sinners, and slaying and burning enemies on an altar'
    key: smoot-papyri-owners
    url: 'https://byustudies.byu.edu/article/the-ancient-owners-of-the-joseph-smith-papyri'
    quote: 'one involves the subduing of sinners by binding them, and the other involves slaying enemies and burning them on an altar.'
  - where: 'note fig. 4 “Hor, the Theban priest whose papyrus supplied the picture”'
    claim: 'Stories about Abraham circulated in Egypt in his time'
    key: smoot-papyri-owners
    url: 'https://byustudies.byu.edu/article/the-ancient-owners-of-the-joseph-smith-papyri'
    quote: 'The papyri owners also lived at a time when stories about Abraham circulated in Egypt.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Ptolemaic approach: read as Egyptians of that time generally'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'To interpret them we should look to what Egyptians of that time generally may have thought these drawings represent.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Ptolemaic approach: read as Egyptian priests integrating Jewish, Greek and Mesopotamian practices'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'we should look specifically to how Egyptian priests who were integrating Jewish, Greek, and Mesopotamian religious practices into native Egyptian practices would have understood them.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'Ptolemaic approach: read as Jews of that era'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'we should look to how Jews of that era would have understood them.'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'The first paradigm is the more straightforward'
    key: smoot-fac-approaching
    url: 'https://byustudies.byu.edu/article/approaching-the-facsimiles'
    quote: 'the first paradigm is a more straightforward way of thinking about the facsimiles'
  - where: 'note fig. 10 “How Latter-day Saint scholars approach the facsimiles”'
    claim: 'The proposal: the facsimiles may have been Egyptian religious vignettes'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'but may have been Egyptian religious vignettes that were adopted or adapted by an Egyptian'
  - where: 'note fig. 3 “The case that a lion couch scene could include a sacrifice”'
    claim: 'The homophony could plausibly have contributed to the association'
    key: smoot-fac1-sacrifice
    url: 'https://byustudies.byu.edu/article/facsimile-1-as-a-sacrifice-scene'
    quote: 'This homophony could plausibly have contributed to an association'
  - where: 'note fig. 4 “Hor, the Theban priest whose papyrus supplied the picture”'
    claim: 'As prophet of Amun-Re Hor would have taken part in the daily execration ritual'
    key: smoot-papyri-owners
    url: 'https://byustudies.byu.edu/article/the-ancient-owners-of-the-joseph-smith-papyri'
    quote: 'He also would have participated in the daily execration ritual, in which a wax figure of an enemy was spat upon, trampled under the left foot, smitten with a spear, bound, and placed on the fire.'
