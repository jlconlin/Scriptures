facsimile: 2
claims:
  - where: 'about'
    claim: 'Abr. 3:3 names Kolob'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'the name of the great one is Kolob'
  - where: 'about'
    claim: 'Abr. 3:4 gives the reckoning of Kolob'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'one revolution was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest'
  - where: 'about'
    claim: 'Abr. 3:9 sets Kolob nigh unto the throne of God'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'Kolob is set nigh unto the throne of God'
  - where: 'about'
    claim: 'The explanation of figure 1 speaks of Kolob and the measurement of time'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'Kolob, signifying the first creation, nearest to the celestial, or the residence of God. First in government, the last pertaining to the measurement of time.'
  - where: 'about'
    claim: 'The Church''s footnote 3a to "Kolob" at Abr. 3:3 points to Facsimile 2, figures 1 to 5'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'See also Abr., fac. 2, figs. 1–5.'
  - where: 'about'
    claim: 'Figure 8 is to be had in the temple'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'cannot be revealed unto the world; but is to be had in the Holy Temple of God'
  - where: 'about'
    claim: 'Figures 12 to 20 will be given in the Lord''s due time'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'will be given in the own due time of the Lord'
  - where: 'about'
    claim: 'The facsimiles were published in 1842 with Joseph Smith''s explanations'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'These facsimiles were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.'
  - where: 'about'
    claim: 'Most explanations do not match Egyptologists, though scholars have noted some parallels'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.'
  - where: 'about'
    claim: 'It is not known how the facsimiles relate to the text'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'We don’t know how the facsimiles relate to the text.'
  - where: 'note fig. 1 “A day in Kolob, in the explanation and in the vision”'
    claim: 'The explanation of fig. 1 gives a day in Kolob as a thousand years, adds a cubit and Jah-oh-eh'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'which celestial time signifies one day to a cubit. One day in Kolob is equal to a thousand years according to the measurement of this earth, which is called by the Egyptians Jah-oh-eh.'
  - where: 'note fig. 1 “A day in Kolob, in the explanation and in the vision”'
    claim: 'Abr. 3:4 gives the reckoning of Kolob'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'one revolution was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest'
  - where: 'note fig. 1 “A day in Kolob, in the explanation and in the vision”'
    claim: 'Abr. 5:13 has the Lord''s time after the time of Kolob'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'it was after the Lord’s time, which was after the time of Kolob'
  - where: 'note fig. 2 “Which altar?”'
    claim: 'The explanation of fig. 2 places the revelation at an altar Abraham built'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'as revealed from God to Abraham, as he offered sacrifice upon an altar, which he had built unto the Lord.'
  - where: 'note fig. 2 “Which altar?”'
    claim: 'Abr. 2:17 has Abraham build an altar in Jershon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'built an altar in the land of Jershon, and made an offering unto the Lord'
  - where: 'note fig. 2 “Which altar?”'
    claim: 'Abr. 2:18 has Abraham offer sacrifice in the plains of Moreh'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'I offered sacrifice there in the plains of Moreh'
  - where: 'note fig. 2 “Which altar?”'
    claim: 'Abr. 2:20 has Abraham build another altar near Bethel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'there I built another altar unto the Lord'
  - where: 'note fig. 2 “Which altar?”'
    claim: 'Abr. 3:15 places the showing before Egypt'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'I show these things unto thee before ye go into Egypt'
  - where: 'note fig. 2 “Which altar?”'
    claim: 'The vision occurred while Abraham was traveling to Egypt'
    key: 'scripture-helps-moses-1'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Abraham’s vision of the stars and planets occurred while he was traveling to Egypt.'
  - where: 'note fig. 5 “Names in figure 5 and in Abraham 3:13”'
    claim: 'The explanation of fig. 5 says the Egyptians hold it to be the Sun'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'is said by the Egyptians to be the Sun'
  - where: 'note fig. 5 “Names in figure 5 and in Abraham 3:13”'
    claim: 'The explanation names Floeese as the Moon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'as also Floeese or the Moon, the Earth and the Sun in their annual revolutions'
  - where: 'note fig. 5 “Names in figure 5 and in Abraham 3:13”'
    claim: 'The explanation names Hah-ko-kau-beam as the stars'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'Kli-flos-is-es, or Hah-ko-kau-beam, the stars represented by numbers 22 and 23'
  - where: 'note fig. 5 “Names in figure 5 and in Abraham 3:13”'
    claim: 'Abr. 3:13 names Shinehah, Olea and Kokaubeam'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'This is Shinehah, which is the sun. And he said unto me: Kokob, which is star. And he said unto me: Olea, which is the moon. And he said unto me: Kokaubeam, which signifies stars'
  - where: 'note fig. 5 “Names in figure 5 and in Abraham 3:13”'
    claim: 'The manual ties figure 5 to Abr. 3:2, 13'
    key: 'pgp-manual-abr-4-5'
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'The drawing shown in figure 5 represents another of the great stars in the expanse of space that help govern with power (see Abraham 3:2, 13).'
  - where: 'note fig. 5 “Names in figure 5 and in Abraham 3:13”'
    claim: 'The manual offers the premortal-spirits reading as a possibility'
    key: 'pgp-manual-abr-4-5'
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'These stars could also be symbolic of other great and noble spirits in the premortal existence (see Abraham 3:22–23).'
  - where: 'note fig. 5 “Names in figure 5 and in Abraham 3:13”'
    claim: 'Explanations other than Joseph Smith''s are tentative'
    key: 'pgp-manual-abr-4-5'
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'are tentative and subject to revision by additional revelation and insight from modern prophets'
  - where: 'note fig. 6 “The parallel the Church names for this plate”'
    claim: 'The Church names fig. 6 as an example of a parallel scholars have noted'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Joseph Smith described the four figures in figure 6 of Facsimile 2 as “this earth in its four quarters.” Other scholars have similarly interpreted identical figures in other ancient Egyptian texts.'
  - where: 'note fig. 8 “Writing “to be had in the Holy Temple of God””'
    claim: 'Figure 8''s writing cannot be revealed to the world and is to be had in the temple'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'cannot be revealed unto the world; but is to be had in the Holy Temple of God'
  - where: 'note fig. 8 “Writing “to be had in the Holy Temple of God””'
    claim: 'The explanations of figs. 3, 7, 8 relate to temple ordinances'
    key: 'pgp-manual-abr-4-5'
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'the explanations for figures 3, 7, and 8 establish a clear relationship between the contents of facsimile 2 and the ordinances of the temple'
  - where: 'note fig. 8 “Writing “to be had in the Holy Temple of God””'
    claim: 'Figure 3 speaks of key-words of the Holy Priesthood'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'representing also the grand Key-words of the Holy Priesthood'
  - where: 'note fig. 8 “Writing “to be had in the Holy Temple of God””'
    claim: 'Figure 7 speaks of key-words of the Priesthood'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'revealing through the heavens the grand Key-words of the Priesthood'
