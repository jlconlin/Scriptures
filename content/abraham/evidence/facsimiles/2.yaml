facsimile: 2
claims:
  - where: 'about'
    claim: 'Abr. 3:3 names Kolob'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'the name of the great one is Kolob'
  - where: 'about'
    claim: 'Abr. 3:4 gives the reckoning of Kolob'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'one revolution was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest'
  - where: 'about'
    claim: 'Abr. 3:9 sets Kolob nigh unto the throne of God'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'Kolob is set nigh unto the throne of God'
  - where: 'about'
    claim: 'The explanation of figure 1 speaks of Kolob and the measurement of time'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'Kolob, signifying the first creation, nearest to the celestial, or the residence of God. First in government, the last pertaining to the measurement of time.'
  - where: 'about'
    claim: 'The Church''s footnote 3a to "Kolob" at Abr. 3:3 points to Facsimile 2, figures 1 to 5'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'See also Abr., fac. 2, figs. 1–5.'
  - where: 'about'
    claim: 'Figure 8 is to be had in the temple'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'cannot be revealed unto the world; but is to be had in the Holy Temple of God'
  - where: 'about'
    claim: 'Figures 12 to 20 will be given in the Lord''s due time'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'will be given in the own due time of the Lord'
  - where: 'about'
    claim: 'The facsimiles were published in 1842 with Joseph Smith''s explanations'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'These facsimiles were included when the book of Abraham was first published in 1842. Joseph Smith’s explanations of the images were published alongside the facsimiles.'
  - where: 'about'
    claim: 'Most explanations do not match Egyptologists, though scholars have noted some parallels'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.'
  - where: 'about'
    claim: 'It is not known how the facsimiles relate to the text'
    key: 'gt-origins-abraham'
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'We don’t know how the facsimiles relate to the text.'
  - where: 'about'
    claim: 'Facsimile 2 is a hypocephalus'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'Facsimile 2 of the Book of Abraham is a type of document called a hypocephalus.'
  - where: 'about'
    claim: 'A hypocephalus is Late Period and Ptolemaic funerary equipment, an amuletic disc'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'refers to a piece of Late Period and Ptolemaic [ca. 664–30 BC] funerary equipment. It is specifically, an amuletic disc'
  - where: 'about'
    claim: '158 are known'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'Today there are 158 known hypocephali that have been catalogued or published.'
  - where: 'about'
    claim: 'Placed with the mummy (at its head)'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'Spell 162 of the ancient Egyptian Book of the Dead specifies that these amulets were to be placed hr tp of the mummy'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Proposal: Semitic qlb "heart, center, middle", related to qrb "near"'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'meaning “heart, center, middle,” and so forth, and is thus related to the Semitic root qrb, meaning “to be near, close.”'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'It suits the near-to-God wordplay in Abraham 3'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'This explanation is enticing because throughout the third chapter of the Book of Abraham, Kolob is conceptually linked with the idea of being near God and his celestial residence'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Drawback: qlb attested only back to Arabic'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'qlb as a Semitic word for “heart, center” is only attested in Semitic languages as far back as Arabic (qalb; “heart, core”), which emerged considerably later than Abraham’s time.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Answer: a reconstructed Afroasiatic root with Egyptian, Akkadian, Hebrew relatives'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'some scholars believe that the Semitic qrb (and Arabic qalb) are ultimately derived from the reconstructed Afroasiatic root'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Cognates in Egyptian, Akkadian, Hebrew (qereb)'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'Egyptian (ḳꜣb; “interior, midst”), Akkadian (qerbum; “inside”), and Hebrew (qereb; “inside, middle”)'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Proposal: Semitic klb "dog"'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'Another promising proposal is that Kolob derives from the Semitic root klb, meaning “dog.”'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Some identify Kolob with Sirius, the dog-star'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'This, in turn, has prompted some to identify Kolob with Sirius, the dog­-star.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Sirius’s rising and the Nile flood'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'its heliacal rising coincided with the ideal Egyptian New Year day that was linked with the onset of the Nile inundation.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Shared traits of Sirius and Kolob'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'Both are associated with the throne of God.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Shared trait: greatest of stars'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'Both are recognized as the “greatest” (probably meaning brightest) of stars in earth’s night sky.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Shared traits: governing, creation, time'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'Both are depicted as governing other stars.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Most of Sirius’s features attested in Greco-Roman sources'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'most of Sirius’s features just reviewed are attested in Egyptian sources from the Greco-­Roman Period, long after Abraham’s day'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'The Egyptian word for dog differs'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'The Egyptian word for “dog” (ỉw) is also quite different from the Semitic word for the same.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Unclear which star Kalbu was'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'it is unclear if this Kalbu was identified anciently with the constellation Canis Major (which contains Sirius) or another, such as Hercules.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Identification with Sirius to be accepted cautiously'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'the identification of Kolob with Sirius should therefore be accepted cautiously.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Kolob governs and encircles the sun, head of the Egyptian pantheon'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'revolves around and thus encircles or controls the sun, which is the head of the Egyptian pantheon.'
  - where: 'note fig. 1 “Proposals for the name Kolob”'
    claim: 'Evidence tantalizing; questions remain'
    key: smoot-kolob
    url: 'https://byustudies.byu.edu/article/kolob-the-governing-one'
    quote: 'While questions about the identification of Kolob still remain, there are some very tantalizing pieces of evidence'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'Commentators have been at a loss'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'have largely been at a loss to explain what this might mean.'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'A cubit measures length'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'A cubit, after all, is a unit for measuring length, not time.'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'Proposal by a Latter-day Saint scientist; cubit used for angles'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'while the cubit was widely used in the ancient world to measure length, it was also used by some ancient astronomers to measure angles.'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'Mesopotamian text records moon against stars in cubits'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'This text records the angular position of the moon relative to various stars in the constellations Gemini and Leo and records those angles in cubits.'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'Mesopotamian texts also gave planets’ positions'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'Other Mesopotamian astronomical texts calculated the position of planets the same way.'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'Egyptians measured angles in cubits'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'The ancient Egyptians likewise measured angles in cubits'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'A finger at arm’s length is about a degree, a "cubit"'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'the pointer finger at arm’s length subtends an angle of about a degree, called a ‘cubit’ by the ancients.'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'The phrase refers to angular velocity'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'the phrase one day to a cubit in the Book of Abraham seems to refer to angular velocity rather than linear velocity.'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'Applied to Kolob, not the sun'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'the curious phrase one day to a cubit from the Book of Abraham describes precisely the movement of [Kolob].'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'Judged plausible because Kolob is placed relative to other bodies'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'Overall, this rings plausible, especially since the placement of Kolob in the cosmology of Abraham 3 is relative to other observable celestial bodies (Abr. 3:9, 12–13).'
  - where: 'note fig. 1 ““One day to a cubit” as a measure of angle”'
    claim: 'Precise meaning remains elusive'
    key: smoot-fac2-cubit
    url: 'https://byustudies.byu.edu/article/one-day-to-a-cubit-facsimile-2-figure-1'
    quote: 'while the precise meaning of “one day to a cubit” remains elusive'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Name from Greek "under the head"; coined by Egyptologists'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'comes from Greek, meaning literally “under the head.”'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Disc emulating a solar disc'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'emulating a solar disc.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Purposes under spell 162'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'to protect the deceased in the afterlife, to provide light and heat for the deceased, to make the deceased “appear again like one who is on earth” (that is, to resurrect them), and to ultimately transform the deceased into a god.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Conceived as the eye of Re'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'Hypocephali were also conceived of (and even sometimes explicitly identified as) the magical eye of the sun god Re that consumed enemies with fire.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Use never widespread; reserved for clergy and families'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: '“it is clear that the use of the hypocephalus never became widespread”'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Reserved for the clergy and their families'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'remained exclusive pieces of funerary equipment reserved for the clergy and for the members of their families'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Temples of Amun, Min, Ptah'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'especially the temple of Amun at Karnak, the temple of Min at Akhmim, and the temple of Ptah at Memphis.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Divination and astronomical documents'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'may have been used as divinatory devices in the Egyptian temple and as astronomical documents.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Link to temple gates and creation'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'Hypocephali also shared a conceptual link with temple gates.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Gates kept out enemies and admitted friends; focus on creation'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'they served, among other things, to keep out enemies and admit friends into sacred space and shared a focus on creation motifs.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Illustrate everything the sun encircles; the sun’s rebirth as (re)creation'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'hypocephali illustrate everything that the sun encircles, including the world of the living on the top and the underworld on the bottom.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Different methods, different results; leave room for a plurality of approaches'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'any modern interpretation of the meaning of the figures and texts contained on hypocephali should always leave room for the possibility of a plurality of approaches.'
  - where: 'note fig. 5 “What a hypocephalus was for”'
    claim: 'Knowing the purpose is crucial to evaluating Joseph Smith’s interpretation'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'understanding the purpose and function of the ancient Egyptian hypocephalus is therefore crucial to evaluating Joseph Smith’s interpretation of Facsimile 2'
  - where: 'note fig. 6 “Figure 6 and the four creatures of the Apocalypse of Abraham”'
    claim: 'The Apocalypse of Abraham: a vision while making a sacrifice'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'The Apocalypse of Abraham describes a vision Abraham saw while making a sacrifice to God.'
  - where: 'note fig. 6 “Figure 6 and the four creatures of the Apocalypse of Abraham”'
    claim: 'Plan of the universe in nearly the words of the left middle portion'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: '“what is in the heavens, on the earth, in the sea, and in the abyss” (almost the exact words used in the left middle portion of the Joseph Smith Hypocephalus)'
  - where: 'note fig. 6 “Figure 6 and the four creatures of the Apocalypse of Abraham”'
    claim: 'The fullness of the whole world and its circle, a picture with two sides'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'He is shown “the fullness of the whole world and its ­circle,” in a picture with two sides.'
  - where: 'note fig. 6 “Figure 6 and the four creatures of the Apocalypse of Abraham”'
    claim: 'A description of the four canopic figures labeled 6'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'There is even a description of what are clearly the four canopic figures labeled number 6 in the Joseph Smith Hypocephalus.'
  - where: 'note fig. 6 “Figure 6 and the four creatures of the Apocalypse of Abraham”'
    claim: 'Roughly contemporary; relate the same things about Abraham'
    key: smoot-hypocephalus
    url: 'https://byustudies.byu.edu/article/the-purpose-and-function-of-the-egyptian-hypocephalus'
    quote: 'they date from the beginning of the Christian era—they are roughly contemporary with the hypocephalus and the other Egyptian documents purchased by Joseph Smith—and they relate the same things about Abraham that Joseph Smith said are found in the hypocephalus'
  - where: 'note fig. 6 “Figure 6 and the four creatures of the Apocalypse of Abraham”'
    claim: 'Four fiery creatures with four faces'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'The Apocalypse also includes a description of four fiery living creatures, each with four faces: that of a lion, a man, an ox, and an eagle.'
  - where: 'note fig. 6 “Figure 6 and the four creatures of the Apocalypse of Abraham”'
    claim: 'Semitic transformation of the Sons of Horus (figure 6)'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'This is almost certainly a Semitic transformation of the Sons of Horus (via Ezekiel 1–2), which are represented as figure 6 of Facsimile 2.'
  - where: 'note fig. 6 “Figure 6 and the four creatures of the Apocalypse of Abraham”'
    claim: 'The Apocalypse of Abraham is an apocryphal text'
    key: smoot-fac-semitic
    url: 'https://byustudies.byu.edu/article/a-semitic-view-of-the-facsimiles'
    quote: 'another apocryphal text, the Apocalypse of Abraham'
  - where: 'note fig. 7 “Figure 7 on other hypocephali, a seated god and the wedjat-eye”'
    claim: 'Seated personage on several hypocephali, described as a polymorphic god'
    key: smoot-fac2-fig7
    url: 'https://byustudies.byu.edu/article/god-sitting-upon-his-throne-facsimile-2-figure-7'
    quote: 'the sitting personage in figure 7 has been described by one Egyptologist as “a polymorphic god sitting on his throne”'
  - where: 'note fig. 7 “Figure 7 on other hypocephali, a seated god and the wedjat-eye”'
    claim: 'Standing figure perhaps Nehebkau, offering the wedjat-eye'
    key: smoot-fac2-fig7
    url: 'https://byustudies.byu.edu/article/god-sitting-upon-his-throne-facsimile-2-figure-7'
    quote: 'Standing next to him is a “falcon­- or snake­-headed snake” believed to perhaps be the minor deity Nehebkau, who “offers the wedjat­-eye.”'
  - where: 'note fig. 7 “Figure 7 on other hypocephali, a seated god and the wedjat-eye”'
    claim: 'Egyptians identify him as the great god, Lord of Life, Lord of All'
    key: smoot-fac2-fig7
    url: 'https://byustudies.byu.edu/article/god-sitting-upon-his-throne-facsimile-2-figure-7'
    quote: 'In some hypocephali, the ancient Egyptians themselves simply identified this figure as, variously, “the great god”'
  - where: 'note fig. 7 “Figure 7 on other hypocephali, a seated god and the wedjat-eye”'
    claim: 'Iaho Sabaoth also called the Great God'
    key: smoot-fac2-fig7
    url: 'https://byustudies.byu.edu/article/god-sitting-upon-his-throne-facsimile-2-figure-7'
    quote: 'in one ancient Egyptian text the divine figure Iaho Sabaoth (Lord of Hosts) is also afforded the epithet “the Great God”'
  - where: 'note fig. 7 “Figure 7 on other hypocephali, a seated god and the wedjat-eye”'
