    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-3?lang=eng'
    quote: 'with a crown upon his head, representing the Priesthood, as emblematical of the grand Presidency in Heaven'
  - where: 'note fig. 1 “The crown and the throne”'
    claim: 'Figure 1 could be symbolic of exaltation and a throne'
