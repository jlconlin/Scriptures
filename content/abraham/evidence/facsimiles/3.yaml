    quote: 'I show these things unto thee before ye go into Egypt, that ye may declare all these words'
  - where: 'note fig. 1 “Abraham teaching astronomy in the king’s court”'
    claim: 'The Times and Seasons editorial of 15 July 1842 (p. 856) says the Egyptians were taught astronomy by Abraham and Joseph'
    key: 'jsp-times-seasons-1842-07-15'
    url: 'https://www.josephsmithpapers.org/paper-summary/times-and-seasons-15-july-1842/10'
    quote: 'The learning of the Egyptians, and their knowledge of astronomy was no doubt taught them by Abraham and Joseph, as their records testify, who received it from the Lord.'
  - where: 'note fig. 1 “Abraham teaching astronomy in the king’s court”'
    claim: 'The editorial is in the 15 July 1842 issue and is titled "The Government of God"'
    key: 'jsp-times-seasons-1842-07-15'
    url: 'https://www.josephsmithpapers.org/paper-summary/times-and-seasons-15-july-1842/9'
    quote: 'The first editorial in the 15 July 1842 issue was titled “The Government of God.”'
  - where: 'note fig. 1 “Abraham teaching astronomy in the king’s court”'
    claim: 'The Joseph Smith Papers: authorship unclear, apparently not Joseph Smith''s'
    key: 'jsp-times-seasons-1842-07-15'
    url: 'https://www.josephsmithpapers.org/paper-summary/times-and-seasons-15-july-1842/9'
    quote: 'Authorship of the editorial is unclear. Although attributed to the editor, it does not appear to have been written by JS.'
  - where: 'note fig. 1 “The crown and the throne”'
