    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'involves the deceased supplicant making a ‘negative confession’ asserting his or her faultless behavior on earth in the presence of forty-­two gods assembled in the Hall of the Two Truths, while the heart is weighted against the feather of Maat.'
