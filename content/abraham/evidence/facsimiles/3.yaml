    claim: 'Almost all essential elements absent'
    key: smoot-fac3-judgment
    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'Almost all of the elements which the Egyptians thought were important for the scene are conspicuous by their absence from Facsimile 3.'
  - where: 'note fig. 1 “A judgment scene, or a presentation scene?”'
    claim: 'It was part of the Book of Breathings, not the Book of the Dead'
    key: smoot-fac3-judgment
    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'the fact that Facsimile 3 was part of the Book of Breathings and not the Book of the Dead also raises the question of whether comparing it to chapter 125 from the Book of the Dead is the right approach in the first place.'
  - where: 'note fig. 1 “A judgment scene, or a presentation scene?”'
    claim: 'Four types of throne scenes in the Book of Breathings'
    key: smoot-fac3-judgment
    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'four types of throne scenes (invocation, weighing of the heart, presentation, and hybrid)'
