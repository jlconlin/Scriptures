    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'Facsimile 3 contains several anomalous artistic elements that are not standard in other illustrations, and its placement on the papyrus scroll obtained by Joseph Smith (not at the commencement of the text but at least two columns in)'
