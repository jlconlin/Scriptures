    key: smoot-fac3-judgment
    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'the type of scene with which Facsimile No. 3 compares best is that of the Presentation scene, which features the deceased being introduced into the presence of Osiris by one or more other Egyptian deities.'
  - where: 'note fig. 1 “A judgment scene, or a presentation scene?”'
    claim: 'Anomalous elements; placed at least two columns in'
