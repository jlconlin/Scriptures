    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'One copy of the Book of the Dead from the first century AD—broadly contemporaneous to the Joseph Smith Papyri—describes what appears to have been considered the “normative” version of a judgment scene for that time period'
  - where: 'note fig. 1 “A judgment scene, or a presentation scene?”'
    claim: 'The elements it lists: forty-two gods, Hathor, Thoth, Horus, Ammut, lotus, chapel'
    key: smoot-fac3-judgment
    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'The forty-­two gods [in front of] the deceased above the hall of the truths; a figure of Hathor'
