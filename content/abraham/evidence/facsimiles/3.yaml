    claim: 'Anything but a common funerary scene'
    key: smoot-fac3-judgment
    url: 'https://byustudies.byu.edu/article/facsimile-3-judgment-scene-or-presentation-scene'
    quote: 'although Facsimile No. 3 was attached to the Hor Book of Breathings, it is anything but a common funerary scene from that collection of texts.'
