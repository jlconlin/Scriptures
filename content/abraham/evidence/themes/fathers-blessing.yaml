page: fathers-blessing
claims:
  - where: 'section “Sent from Haran”'
    claim: '“Jehovah” occurs in the book only at 1:16 (the deliverer)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'behold, my name is Jehovah, and I have heard thee, and have come down to deliver thee'
  - where: 'section “Sent from Haran”'
    claim: '“Jehovah” occurs in the book only at 1:16 and 2:8 (2:8, the one who sends)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'My name is Jehovah, and I know the end from the beginning; therefore my hand shall be over thee.'
  - where: 'section “All the families of the earth”'
    claim: '“Gospel”, “families” and “all nations” occur in Abraham only in 2:9–11 (Gospel 2:10, 11; families 2:11; all nations 2:9 twice); “nations” is also at 1:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'shall all the families of the earth be blessed, even with the blessings of the Gospel, which are the blessings of salvation, even of life eternal'
  - where: 'section “All the families of the earth”'
    claim: 'Gen. 12:3 reads “in thee shall all families of the earth be blessed”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'and in thee shall all families of the earth be blessed.'
  - where: 'section “A comparison: “sought” and “father””'
    claim: 'Connection made by this page: “I sought for the blessings of the fathers” (1:2) set beside “Thy servant has sought thee earnestly; now I have found thee” (2:12), and “a father of many nations” (1:2) beside “bless thee, as their father” (2:10); no source cited here draws it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Thy servant has sought thee earnestly; now I have found thee'
  - where: 'section “A comparison: “sought” and “father””'
    claim: 'Connection made by this page (second half): “a father of many nations” (1:2) beside “as their father” (2:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'shall rise up and bless thee, as their father'
  - where: 'section “A comparison: “sought” and “father””'
    claim: '“Sought” is at 1:2, 1:4 and 2:12 only, with “seeking” at 1:26 (Pharaoh); “fathers” in the site’s text only in chapter 1 (1:2, 3, 4, 5, 26, 31), and at 1:1 as well in the Church’s current text; “father” in fifteen verses (Abraham’s father at 1:1, 16, 27, 30; 2:1, 3, 4, 5, 17; Adam 1:3; Noah 1:26; 1:18; 5:18; Abraham himself at 1:2 and 2:10); the fathers of 1:5 turned from righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'My fathers, having turned from their righteousness, and from the holy commandments which the Lord their God had given unto them, unto the worshiping of the gods of the heathen, utterly refused to hearken to my voice'
  - where: 'section “Jehovah, and the seed”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Jehovah, and the seed”'
    claim: 'Jesus Christ, Jehovah of the Old Testament, made promises to Abraham'
    key: nelson-teachings-abrahamic-covenant
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-russell-m-nelson/08-the-abrahamic-covenant?lang=eng'
    quote: 'Jesus Christ—Jehovah of the Old Testament—made remarkable promises to Abraham.'
  - where: 'section “Jehovah, and the seed”'
    claim: 'The Church edition’s footnote on “seed” in 2:10 cites Gal. 3:29 (26–29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Gen. 13:16 (14–16); Rom. 4:11; Gal. 3:29 (26–29); 2 Ne. 30:2.'
  - where: 'section “Jehovah, and the seed”'
    claim: 'Gal. 3:27, 29 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'And if ye be Christ’s, then are ye Abraham’s seed, and heirs according to the promise.'
  - where: 'section “Jehovah, and the seed”'
    claim: '“Bear this ministry and Priesthood unto all nations” refers to proclaiming the gospel and inviting all to receive ordinances by priesthood authority'
    key: bednar-becoming-missionary
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/10/becoming-a-missionary?lang=eng'
    quote: 'Thus, the phrase “bear this ministry and Priesthood unto all nations” refers to the responsibility to proclaim the gospel of Jesus Christ and to invite all to receive by proper priesthood authority the ordinances of salvation.'
  - where: 'section “Jehovah, and the seed”'
    claim: 'Gal. 3:27 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'For as many of you as have been baptized into Christ have put on Christ.'
  - where: 'section “All the families of the earth”'
    claim: 'Abr. 2:11: the right continues in Abraham and his seed, the literal seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'for I give unto thee a promise that this right shall continue in thee, and in thy seed after thee'
  - where: 'section “A comparison: “sought” and “father””'
    claim: 'Pharaoh seeks earnestly to imitate the order established by the fathers (1:26)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'seeking earnestly to imitate that order established by the fathers'
