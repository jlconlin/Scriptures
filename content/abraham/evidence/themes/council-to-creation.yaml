page: council-to-creation
claims:
  - where: 'opening'
    claim: 'The Church’s reading: the speaker of Abr. 3:24 is Jesus Christ, who created the earth for the spirit children'
    key: pgp-manual-abr-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/abraham-3-1-28?lang=eng'
    quote: 'Jesus Christ was the One who created the earth upon which the spirit children of Heavenly Father would dwell (see Abraham 3:24).'
  - where: 'section “We will go down”'
    claim: 'The Church’s reading is that the speaker is Jesus Christ, the Creator (the Student Manual)'
    key: pgp-manual-abr-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/abraham-3-1-28?lang=eng'
    quote: 'Jesus Christ was the One who created the earth upon which the spirit children of Heavenly Father would dwell (see Abraham 3:24).'
  - where: 'section “We will go down”'
    claim: 'An Apostle identifies the speaker of 3:24 as Jehovah, the Firstborn'
    key: mcconkie-christ-creation-1982
    url: 'https://www.churchofjesuschrist.org/study/ensign/1982/06/christ-and-the-creation?lang=eng'
    quote: 'He is the great Jehovah, the Firstborn of the Father. We hear him say'
  - where: 'section “We will go down”'
    claim: 'The Church’s edition points “one” (3:24) to the topic “Jesus Christ, Firstborn” and “we” to “Jesus Christ, Creator”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: '24a “one”: TG Jesus Christ, Firstborn.'
  - where: 'section “We will go down”'
    claim: 'Footnote on “we” (3:24): Jesus Christ, Creator'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: '24b “we”: TG Jesus Christ, Creator.'
  - where: 'section “We will go down”'
    claim: 'One source names “those who were with him” as Michael and a great host of valiant souls'
    key: mcconkie-christ-creation-1982
    url: 'https://www.churchofjesuschrist.org/study/ensign/1982/06/christ-and-the-creation?lang=eng'
    quote: 'We hear him say “unto those who were with him,” unto Michael and a great host of valiant souls'
  - where: 'section “We will go down”'
    claim: 'The study helps say only that others may have assisted Jesus Christ with the Creation'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'From Abraham’s account and other prophetic sources, we have reason to believe that others may have assisted Jesus Christ with the Creation.'
  - where: 'section “Whom shall I send?”'
    claim: 'Heavenly Father presented His plan of salvation in the Council in Heaven'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'In the premortal Council in Heaven, our Heavenly Father presented His plan of salvation.'
  - where: 'section “Whom shall I send?”'
    claim: 'Only one plan was presented in the premortal council, the Father’s (paraphrased on the page; quoted on the Moses page)'
    key: bednar-divine-nature-2026
    url: 'https://www.churchofjesuschrist.org/study/liahona/2026/01/03-partakers-of-the-divine-nature?lang=eng'
    quote: 'Note that only one plan was presented in the premortal council—the Father’s plan.'
  - where: 'section “Whom shall I send?”'
    claim: 'The question was who should be sent to carry out the Father’s plan'
    key: bednar-divine-nature-2026
    url: 'https://www.churchofjesuschrist.org/study/liahona/2026/01/03-partakers-of-the-divine-nature?lang=eng'
    quote: 'The essence of His question focused upon who should be sent to execute the terms and conditions of His plan.'
  - where: 'section “Let us go down”'
    claim: 'Read as one narrative, the council decides in 3:24–28 and executes the decision from 4:1'
    key: smoot-pgp-study-edition-abr-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/commentary-abraham-4'
    quote: 'Read as one continuous narrative, the divine council decides on a course of action in 3:24–28 and then executes that decision beginning here.'
  - where: 'section “Let us go down”'
    claim: 'The Church edition’s heading calls chapter 4 the Gods’ plans for the six days of creation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'The Gods plan the creation of the earth and all life thereon—Their plans for the six days of creation are set forth.'
  - where: 'section “Let us go down”'
    claim: 'The Church edition’s heading puts the bringing to pass in chapter 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'They bring to pass the Creation according to Their plans'
  - where: 'section “Let us go down”'
    claim: '“The Lord” speaks “Let us go down” in 4:1; it is the only speaking “the Lord” in chapters 4–5 (occurrences.mjs: 4:1 and 5:13 only); Abraham 4 does not say whether he is the Father or the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'And then the Lord said: Let us go down.'
  - where: 'section “Counsel, again”'
    claim: '“Plan” occurs only once in Abraham, at 4:21 (occurrences.mjs abraham "plan" --stem: 1 verse, 1 occurrence)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'And the Gods said: Let us prepare the waters'
  - where: 'section “According to all that which they had said”'
    claim: '“Counseled” stands five times in 5:2–5 (5:2 twice, 5:3 twice, 5:5 once) and “counsel” in all its forms six times in the book, all in 4:26 and 5:2–5 (occurrences.mjs abraham "counsel" --stem)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'On the seventh time we will end our work, which we have counseled; and we will rest on the seventh time from all our work which we have counseled.'
  - where: 'section “According to all that which they had said”'
    claim: 'The counsel of chapters 4–5 appears to be a natural continuation of the council in 3:22–28'
    key: smoot-divine-council
    url: 'https://byustudies.byu.edu/article/the-divine-council'
    quote: 'This language of the Gods taking counsel among themselves in Abraham 4–5 appears to be a natural continuation of the description of the premortal council in heaven described in Abraham 3:22–28.'
  - where: 'section “The same sentence, said and done”'
    claim: 'Connection made by this page: the complete list of “go down”, “went down” and “came down” in the Gods’ mouths or of them (3:24; 4:1; 4:26; 4:27; 5:4), with the uses that do not fit (2:21; 1:16–17; 3:21; 1:3); the join of 3:24 to 4:1 and 5:4 itself is made by the site’s notes on 4:1 and 5:4 and by the sources cited'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'We will go down, for there is space there, and we will take of these materials, and we will make an earth whereon these may dwell'
  - where: 'section “The same sentence, said and done”'
    claim: 'Gods “went down” at 4:27 (“go down”: 2:21, 3:24, 4:1, 4:26; “went down”: 4:1, 4:27; “came down”: 1:3, 3:21, 5:4; “come down”: 1:16, 1:17, 3:21; occurrences.mjs)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'So the Gods went down to organize man in their own image'
  - where: 'section “The same sentence, said and done”'
    claim: '“The Gods came down” at 5:4, followed by “according to all that which they had said” at 5:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'And the Gods came down and formed these the generations of the heavens and of the earth'
  - where: 'section “The same sentence, said and done”'
    claim: 'Abraham 2:21: Abraham “concluded to go down into Egypt” (not the Creation)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'concluded to go down into Egypt, to sojourn there'
  - where: 'section “The same sentence, said and done”'
    claim: 'Abraham 1:16–17: the Lord says he has “come down” to deliver Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'behold, my name is Jehovah, and I have heard thee, and have come down to deliver thee'
  - where: 'section “The same sentence, said and done”'
    claim: 'Abraham 3:21: the Lord says he has “come down” to Abraham and “came down in the beginning” (not quoted on the page)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'I came down in the beginning in the midst of all the intelligences thou hast seen.'
  - where: 'section “The same sentence, said and done”'
    claim: 'Abraham 1:3: a right “came down from the fathers”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'it came down from the fathers, from the beginning of time'
  - where: 'section “The same sentence, said and done”'
    claim: 'The entire Creation was planned by God before the work began'
    key: nelson-creation-2000
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2000/04/the-creation?lang=eng'
    quote: 'The entire Creation was planned by God. A council in heaven was once convened in which we participated.'
  - where: 'section “The same sentence, said and done”'
    claim: 'Of Abraham’s account: “they performed as they had planned”'
    key: mcconkie-christ-creation-1982
    url: 'https://www.churchofjesuschrist.org/study/ensign/1982/06/christ-and-the-creation?lang=eng'
    quote: 'Then he says they performed as they had planned'
  - where: 'section “The same sentence, said and done”'
    claim: 'Abraham gives a blueprint of the Creation'
    key: mcconkie-christ-creation-1982
    url: 'https://www.churchofjesuschrist.org/study/ensign/1982/06/christ-and-the-creation?lang=eng'
    quote: 'Abraham gives a blueprint as it were of the Creation'
  - where: 'section “By the Son”'
    claim: 'Under the direction of His Father, Jesus Christ was the creator of the earth'
    key: living-christ
    url: 'https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng'
    quote: 'Under the direction of His Father, He was the creator of the earth.'
  - where: 'section “By the Son”'
    claim: 'God, working through His Son, organized the elements to form the heavens and the earth'
    key: gs-create-creation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/create-creation?lang=eng'
    quote: 'God, working through His Son, Jesus Christ, organized the elements in nature to form the heavens and the earth.'
  - where: 'section “By the Son”'
    claim: 'Moses 1:33: “by the Son I created them, which is mine Only Begotten”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'by the Son I created them, which is mine Only Begotten.'
  - where: 'section “By the Son”'
    claim: 'Moses 2:1: “by mine Only Begotten I created these things”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng'
    quote: 'by mine Only Begotten I created these things; yea, in the beginning I created the heaven, and the earth upon which thou standest.'
  - where: 'section “By the Son”'
    claim: 'John 1:3: “All things were made by him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'All things were made by him; and without him was not any thing made that was made.'
  - where: 'section “By the Son”'
    claim: 'The Creator of 3:24 is the one “chosen and sent” in 3:27–28, in the Church’s reading'
    key: pgp-manual-abr-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/abraham-3-1-28?lang=eng'
    quote: 'He was also chosen and sent to earth to be the Savior (see verses 27–28; see also Moses 4:1–4).'
