chapter: 3
claims:
  - where: setting
    claim: The vision came while Abraham was traveling to Egypt
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Abraham’s vision of the stars and planets occurred while he was traveling to Egypt.'
  - where: setting
    claim: Michael Chandler brought mummies and papyrus scrolls to Kirtland in 1835
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'In 1835 a man named Michael Chandler brought four Egyptian mummies and several papyrus scrolls of ancient Egyptian writings to Kirtland, Ohio.'
  - where: 'note 3:1 “The Urim and Thummim in Ur”'
    claim: The first part may have been Abraham viewing the stars and conversing by the Urim and Thummim
    key: muhlestein-astronomy
    url: 'https://rsc.byu.edu/vol-10-no-1-2009/encircling-astronomy-egyptians-approach-abraham-3'
    quote: 'the first part of the chapter may not have been a vision but may have consisted of Abraham viewing the stars with his naked eye and conversing with the Lord about what he saw by means of the Urim and Thummim.'
  - where: setting
    claim: The book was published in the Times and Seasons beginning in March 1842
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Joseph Smith later translated some of the writings and published them as the “Book of Abraham” in a Church publication called the Times and Seasons beginning in March 1842.'
  - where: thread
    claim: Greatness in the chapter is measured by nearness to Kolob, and so to God
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Abraham learned that it is not size that makes one star or planet greater than another but rather its proximity to Kolob.'
  - where: thread
    claim: The Lord uses the stars to teach that a being, not a planet, is the governing source
    key: muhlestein-astronomy
    url: 'https://rsc.byu.edu/vol-10-no-1-2009/encircling-astronomy-egyptians-approach-abraham-3'
    quote: 'Here the concept of orbiting planets and their governing times was used as apperception to explain that a being—not a planet—was the governing source.'
  - where: 'note 3:1 “The Urim and Thummim in Ur”'
    claim: Urim and thummim come from Hebrew words meaning lights and perfections, and name an instrument for revelation and translation
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Urim and thummim come from Hebrew words meaning “lights” and “perfections.” The name Urim and Thummim was given to an instrument the Lord prepared to assist individuals in obtaining revelation and translating languages.'
  - where: 'note 3:1 “The Urim and Thummim in Ur”'
    claim: There was more than one such instrument; Israelite high priests and Book of Mormon prophets had them
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'The Old Testament records that Israelite high priests used a Urim and Thummim to receive revelation. In the New World, prophets of the Book of Mormon used a pair of stones they called “interpreters.”'
  - where: 'note 3:1 “The Urim and Thummim in Ur”'
    claim: The chapter appears to record two distinct visions, one by the Urim and Thummim and one face to face
    key: muhlestein-astronomy
    url: 'https://rsc.byu.edu/vol-10-no-1-2009/encircling-astronomy-egyptians-approach-abraham-3'
    quote: 'Abraham appears to have two distinct visions, one via the Urim and Thummim and recorded in the first part of chapter 3, and the second as he speaks with the Lord face to face'
  - where: 'note 3:3 “Kolob, in the vision and in Facsimile 2”'
    claim: Kolob can be a symbol of Jesus Christ
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'One of these stars, known to Heavenly Father as Kolob, can be a symbol of Jesus Christ.'
  - where: 'note 3:3 “Kolob, in the vision and in Facsimile 2”'
    claim: Greatness depends on proximity to Kolob, as the children of God's depends on proximity to God
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'The same is true with the children of God—their greatness and glory will depend upon their proximity to God.'
  - where: 'note 3:3 “Kolob, in the vision and in Facsimile 2”'
    claim: The facsimiles are three print illustrations based on images on the papyri
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'The book of Abraham includes three print illustrations, known as facsimiles, which are based on images on the papyri.'
  - where: 'note 3:3 “Kolob, in the vision and in Facsimile 2”'
    claim: Joseph's explanations mostly do not match Egyptologists' interpretations, though some parallels are noted
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'Most of the explanations Joseph published with the facsimiles do not match the interpretations of modern Egyptologists. However, scholars have noted some parallels.'
  - where: 'note 3:3 “Kolob, in the vision and in Facsimile 2”'
    claim: It is not known how the facsimiles relate to the text
    key: gt-origins-abraham
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/abraham-book-of?lang=eng'
    quote: 'We don’t know how the facsimiles relate to the text.'
  - where: 'note 3:3 “Kolob, in the vision and in Facsimile 2”'
    claim: The explanation of Facsimile 2, figure 1, on Kolob
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/fac-2?lang=eng'
    quote: 'Kolob, signifying the first creation, nearest to the celestial, or the residence of God. First in government, the last pertaining to the measurement of time.'
  - where: 'note 3:16 “One argument, used twice”'
    claim: The Lord uses the cosmic system apperceptively to teach doctrine
    key: muhlestein-astronomy
    url: 'https://rsc.byu.edu/vol-10-no-1-2009/encircling-astronomy-egyptians-approach-abraham-3'
    quote: 'In each of these visions, Abraham sees something of the cosmic system, which the Lord then uses apperceptively to teach doctrinal principles.'
  - where: 'note 3:16 “One argument, used twice”'
    claim: The planets and their governing times explain that a being is the governing source
    key: muhlestein-astronomy
    url: 'https://rsc.byu.edu/vol-10-no-1-2009/encircling-astronomy-egyptians-approach-abraham-3'
    quote: 'Here the concept of orbiting planets and their governing times was used as apperception to explain that a being—not a planet—was the governing source.'
  - where: 'note 3:15 “Why Abraham was shown the stars”'
    claim: The vision was to prepare Abraham to teach the Egyptians
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'During Abraham’s vision, the Lord instructed Abraham to teach the truths he learned to the Egyptians.'
  - where: 'note 3:15 “Why Abraham was shown the stars”'
    claim: "'All these words' means astronomy and gospel principles taught through it"
    key: muhlestein-astronomy
    url: 'https://rsc.byu.edu/vol-10-no-1-2009/encircling-astronomy-egyptians-approach-abraham-3'
    quote: 'the phrase “all these words” indicates that Abraham was to teach not only astronomy but also gospel principles the Lord explained through astronomic means.'
  - where: 'note 3:15 “Why Abraham was shown the stars”'
    claim: The Egyptian king and court were interested in the movements of the heavens
    key: muhlestein-astronomy
    url: 'https://rsc.byu.edu/vol-10-no-1-2009/encircling-astronomy-egyptians-approach-abraham-3'
    quote: 'the Egyptian king and his court were aware of and keenly interested in the movements of the sun, moon, planets, and stars.'
  - where: 'note 3:18 “Spirits that have no beginning”'
    claim: The term intelligences is used of spirit children and of the spirit element before they were begotten as spirit children
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'The term intelligences can be used to describe the spirit children of God. It can also describe “the spirit element that existed before we were begotten as spirit children.”'
  - where: 'note 3:18 “Spirits that have no beginning”'
    claim: D&C 93:29 on intelligence not being created
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng'
    quote: 'Intelligence, or the light of truth, was not created or made, neither indeed can be.'
  - where: 'note 3:21 “To deliver unto thee the works”'
    claim: The current edition reads "to declare unto thee the works"
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/3?lang=eng'
    quote: 'I now, therefore, have come down unto thee to declare unto thee the works which my hands have made'
  - where: 'note 3:21 “To deliver unto thee the works”'
    claim: The 1921 edition reads "to deliver unto thee the works"
    key: pgp-1921
    url: 'https://archive.org/download/pearlofgreatpric0000jose_d8d6/pearlofgreatpric0000jose_d8d6_djvu.txt'
    quote: 'I now, therefore, have come down unto thee to deliver unto thee the works which my hands have made'
  - where: 'note 3:23 “Chosen before birth”'
    claim: Foreordination is God's appointment of certain spirits to missions on earth and does not guarantee callings
    key: gt-foreordination
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/foreordination?lang=eng'
    quote: 'In the premortal spirit world, God appointed certain spirits to fulfill specific missions on earth. This is called foreordination. Foreordination does not guarantee that individuals will receive certain callings or responsibilities.'
  - where: 'note 3:23 “Chosen before birth”'
    claim: Such opportunities come through the righteous exercise of agency in this life
    key: gt-foreordination
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/foreordination?lang=eng'
    quote: 'Such opportunities come in this life as a result of the righteous exercise of agency, just as foreordination came as a result of righteousness in the premortal existence.'
  - where: 'note 3:23 “Chosen before birth”'
    claim: Foreordination applies to all members of the Church, not only the Savior and prophets
    key: gt-foreordination
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/foreordination?lang=eng'
    quote: 'The doctrine of foreordination applies to all members of the Church, not just to the Savior and His prophets.'
  - where: 'note 3:23 “Chosen before birth”'
    claim: D&C 138:55 on the noble and great ones chosen to be rulers
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138?lang=eng'
    quote: 'I observed that they were also among the noble and great ones who were chosen in the beginning to be rulers in the Church of God.'
  - where: 'note 3:23 “A council with God in the midst”'
    claim: The Book of Abraham depicts a divine council, a concept widely recognized by scholars as ancient
    key: smoot-divine-council
    url: 'https://byustudies.byu.edu/article/the-divine-council'
    quote: 'invokes the presence of what is now widely recognized by scholars as the unquestionably ancient concept of the divine council.'
  - where: 'note 3:23 “A council with God in the midst”'
    claim: The ancient Near Eastern councils might be echoes of the council in the Book of Abraham, or vice versa; there are similarities and differences
    key: smoot-divine-council
    url: 'https://byustudies.byu.edu/article/the-divine-council'
    quote: 'The polytheistic divine councils of the ancient Near East might well be echoes of the conception of the divine council portrayed in the Book of Abraham, or vice versa.'
  - where: 'note 3:23 “A council with God in the midst”'
    claim: Micaiah's vision in 1 Kings 22 is a divine council scene with one volunteering
    key: sc-knowhy-832
    url: 'https://scripturecentral.org/knowhy/why-are-other-people-with-god-when-he-is-planning-the-creation'
    quote: 'In this scene, the prophet Micaiah is reporting on what he saw when he witnessed a divine council scene of Yahweh sitting on a throne surrounded by advisors.'
  - where: 'note 3:23 “A council with God in the midst”'
    claim: Christ created the earth and was chosen and sent as Savior, per Abraham 3:24, 27–28
    key: pgp-manual-abr-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/abraham-3-1-28?lang=eng'
    quote: 'Jesus Christ was the One who created the earth upon which the spirit children of Heavenly Father would dwell (see Abraham 3:24). He was also chosen and sent to earth to be the Savior'
  - where: 'note 3:26 “What an estate is”'
    claim: First estate means premortal life
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'The term “first estate” refers to our premortal life.'
  - where: 'note 3:26 “What an estate is”'
    claim: Second estate means mortal existence; keeping it
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Our mortal existence on earth is known as our “second estate.” We keep our second estate by choosing to follow Jesus Christ and receiving the ordinances of His gospel.'
  - where: 'note 3:26 “What an estate is”'
    claim: Estate in Joseph Smith's time likely meant condition or state
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'The word “estate” in Joseph Smith’s time likely referred to a “condition” or “state.”'
  - where: 'note 3:27 “What Abraham’s account of the call adds”'
    claim: A third part followed Lucifer and failed to keep their first estate
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'A third part of the spirit children of Heavenly Father followed Lucifer and rebelled against God and the plan of salvation, thereby failing to keep their first estate.'
  - where: 'note 3:27 “What Abraham’s account of the call adds”'
    claim: Moses 4:1 is the parallel account
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: 'Behold, here am I, send me. I will be thy son'
  - where: christ
    claim: Christ created the earth and was chosen and sent as Savior
    key: pgp-manual-abr-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/abraham-3-1-28?lang=eng'
    quote: 'Jesus Christ was the One who created the earth upon which the spirit children of Heavenly Father would dwell (see Abraham 3:24). He was also chosen and sent to earth to be the Savior'
  - where: christ
    claim: Kolob can be a symbol of Christ
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'One of these stars, known to Heavenly Father as Kolob, can be a symbol of Jesus Christ.'
  - where: explore
    claim: Muhlestein's article is on Abraham 3
    key: muhlestein-astronomy
    url: 'https://rsc.byu.edu/vol-10-no-1-2009/encircling-astronomy-egyptians-approach-abraham-3'
    quote: 'Kerry Muhlestein, “Encircling Astronomy and the Egyptians: An Approach to Abraham 3,” Religious Educator 10, no. 1 (2009): 33–50.'
  - where: 'note 3:3 “Kolob, in the vision and in Facsimile 2”'
    claim: Greatness is proximity to Kolob, not size
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'Abraham learned that it is not size that makes one star or planet greater than another but rather its proximity to Kolob.'
  - where: 'note 3:15 “Why Abraham was shown the stars”'
    claim: The stars may have let Abraham share the gospel in a way that resonated with Egyptians
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'It is possible the Lord taught Abraham about the cosmos so that he could share the gospel with the Egyptians in a way that would resonate with them.'
  - where: 'note 3:23 “Chosen before birth”'
    claim: Foreordination does not guarantee callings
    key: gt-foreordination
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/foreordination?lang=eng'
    quote: 'Foreordination does not guarantee that individuals will receive certain callings or responsibilities. Such opportunities come in this life as a result of the righteous exercise of agency, just as foreordination came as a result of righteousness in the premortal existence.'
  - where: 'note 3:23 “A council with God in the midst”'
    claim: There are similarities and notable differences between the Book of Abraham's council and ancient ones
    key: smoot-divine-council
    url: 'https://byustudies.byu.edu/article/the-divine-council'
    quote: 'while there are striking similarities between the Book of Abraham and other ancient texts that feature a divine council, there are also notable differences.'
  - where: 'note 3:3 “Kolob, in the vision and in Facsimile 2”'
    claim: Greatness depends on proximity (full sentence pair)
    key: scripture-helps-moses-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/01-moses-1-abraham-3?lang=eng'
    quote: 'it is not size that makes one star or planet greater than another but rather its proximity to Kolob. The same is true with the children of God—their greatness and glory will depend upon their proximity to God.'
  - where: 'note 3:18 “Spirits that have no beginning”'
    claim: 'The Guide to the Scriptures gives three meanings of intelligence; the first is the light of truth, which has always existed, and the second the spirit children of God'
    key: gs-intelligence
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/intelligence-intelligences?lang=eng'
    quote: 'Intelligence has several meanings, three of which are: (1) It is the light of truth that gives life and light to all things in the universe. It has always existed. (2) The word intelligences may also refer to spirit children of God.'
  - where: 'note 3:18 “Spirits that have no beginning”'
    claim: 'The third meaning is the spirit element that existed before spirits were begotten'
    key: gs-intelligence
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/intelligence-intelligences?lang=eng'
    quote: '(3) The scriptures also may speak of intelligence as referring to the spirit element that existed before we were begotten as spirit children.'
  - where: 'note 3:26 “What an estate is”'
    claim: 'Webster (1828) gives “condition or circumstances” as a sense of “estate”'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/estate'
    quote: 'Condition or circumstances of any person or thing, whether high or low.'
