summary: >-
  Ezra tells how the Lord undid the exile: He stirred up a king and a remnant to go home, and the first thing
  the returned people did was set the altar "upon his bases" and offer to Him, months before the house had a
  foundation. Sixty years after the house was finished, Ezra comes with a book, having prepared his heart "to
  seek the law of the LORD, and to do it, and to teach", and in his prayer calls the return a small mercy,
  "a nail in his holy place". The image holds one quiet idea: an altar of unhewn stones set again on its old
  base, worship restored before the house, with the law and the Lord's small fixed mercy beside it.
motifs:
  - "A rebuilt altar on its old base (Ezra 3:2-3): the focal point, a squat square altar of rough, uncut fieldstones set on a flat, older foundation of larger weathered stones that is clearly wider than the altar above it. The altar's top is empty and clean, with at most a single thin thread of pale smoke rising; no flames. The old base is darker and worn, the stones of the altar paler and newly set, so the eye reads old and renewed together. Warm gold light rests on its top."
  - "A closed scroll (Ezra 7:10): a single rolled scroll of plain pale cloth-cream material, tied once with a cord, lying across a low flat stone beside the altar's base. Blank and closed, with no writing visible on any part of it."
  - "A wooden peg set in the old temple's stonework (Ezra 9:8, 'a nail in his holy place'): at the left, a short, low surviving course of the first temple's wall, two courses of large, squared, dressed stones in exactly the same dark, weathered, lichened stone as the altar's old base, so the eye reads the two as remains of one older holy building. A short, slender, dark wooden peg with a slightly broader head is driven firmly into a joint between two of these stones, clearly hammered in and fixed, protruding only a hand's length, with a little warm light on its head. Small and clean, and nothing hangs from it. It must read as a peg driven into the wall, not as a log or beam lying in it."
composition: >-
  A wide landscape of a bare hilltop terrace in the early light of a clear morning, seen from a
  slightly low, level viewpoint. The altar stands at center-right on its wider old base, the clear
  focal point, with open pale ground around it and a gentle gold glow gathered on its top. The closed
  scroll lies on a flat stone at its left foot, small but legible. At the left a short, low
  remnant of the old temple wall, large squared stones of the same dark weathered stone as the altar's
  base, stands a little in from the picture's edge with the peg driven into it, catching the light. Behind, soft hills of
  olive and clay fall away to a pale, quiet horizon under a deep indigo-to-cream sky; the ground at
  the right is level and empty, where a house will stand, with no walls or timber begun. No people,
  no other ruins or rubble, no fire, no city, no animals, and nothing lettered.
asset: /assets/ezra-book-art.jpg
alt: A square altar of rough fieldstones stands on a wider, older stone base on a hilltop in warm morning light, with a closed scroll tied with a cord on a flat stone at its foot and a small wooden nail driven into a low remnant of the old temple wall at the left.
key:
  - '**The altar of pale new stones** is the first thing the returned exiles built: “they set the altar upon his bases… and they offered burnt offerings thereon unto the LORD, even burnt offerings morning and evening” ([[Ezra 3:3]]). Worship began again before there was a house to worship in.'
  - '**The dark, weathered stones** under the altar and in the wall at the left are what was left of Solomon’s temple, which Nebuchadnezzar “destroyed” ([[Ezra 5:12]]). The new altar stands on the old base.'
  - '**The empty ground** to the right is where the house will stand: “the foundation of the temple of the LORD was not yet laid” ([[Ezra 3:6]]).'
  - '**The closed scroll** is the law of Moses that Ezra the scribe brought from Babylon. He “had prepared his heart to seek the law of the LORD, and to do it, and to teach in Israel statutes and judgments” ([[Ezra 7:10]]).'
  - '**The small nail driven into the old temple wall** is from Ezra’s prayer of confession. The nail of his day was a wooden one, and he calls the whole return a small, firm mercy fixed in the Lord’s own house: “for a little space grace hath been shewed from the LORD our God… to give us a nail in his holy place” ([[Ezra 9:8]]).'
status: approved
