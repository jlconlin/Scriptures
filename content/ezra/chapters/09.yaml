chapter: 9
title: Ezra's Confession
tagline: The leaders tell Ezra that the returned exiles, priests and Levites among them, have married into the peoples of the land and their abominations. He sits stunned until the evening sacrifice, then kneels and confesses the people's sin as his own, and asks for nothing.
when: 'Jerusalem, 458 B.C., between Ezra''s arrival in the fifth month (7:9) and the assembly of the ninth (10:9).'

setting: |
  Ezra came to Jerusalem in the fifth month of 458 B.C. with a commission from Artaxerxes to teach the law and to appoint magistrates and judges ([[Ezra 7:9]]; [[Ezra 7:25]]). Chapter 8 ended with the gold and silver weighed into the house of God and the king's orders delivered to the governors west of the Euphrates. “Now when these things were done” (verse 1), the leaders came to him with a report, and the book turns to Ezra's first reform on arriving: separating the Jews from their foreign wives.

  The chapter is told in Ezra's own voice. His first-person memoir, which began at [[Ezra 7:27]], runs through the prayer that fills verses 6–15; chapter 10 then tells in the third person what came of it. The law the report appeals to is the law of [[Deut. 7]] and [[Deut. 23:3]], which the site explains there. The problem did not end here: Malachi charges Judah with the same marriages ([[Mal. 2:11]]), and Nehemiah met them again ([[Neh. 13:23–27]]).

thread: |
  Chapter 9 carries the book's second thread: a restored community has to decide on what terms it belongs to the Lord. At the Passover of [[Ezra 6:21]] the mark of belonging was separation from “the filthiness of the heathen of the land” to seek the Lord; now the leaders report that the people, priests and Levites included, “have not separated themselves” (verse 1).

  The report takes two verses. The rest of the chapter is Ezra's answer, and he singles no one out. He tears his clothes, sits stunned through the day, and at the hour of the evening offering turns the report about others into a confession in which he stands among the guilty. The prayer moves in order: shame at a guilt that has reached the heavens (verse 6); the exile as its punishment (verse 7); the grace of a brief reprieve under the kings of Persia (verses 8–9); the commandments forsaken anyway (verses 10–12); the question whether the remnant will now be lost (verses 13–14); and the people left standing before a righteous God with nothing to plead (verse 15). The answer to the prayer comes from the people, in [[Ezra 10]]: a covenant to repent.

sections:
  - range: 1-4
    heading: The leaders' report
    plain: |
      When these things were done, the leaders came to me and said: The people of Israel, the priests and the Levites have not kept themselves apart from the peoples of the lands and their abominations, the abominations of the Canaanites, Hittites, Perizzites, Jebusites, Ammonites, Moabites, Egyptians and Amorites. They have taken some of their daughters as wives for themselves and for their sons, so that the holy seed has mixed itself with the peoples of those lands; and the leaders and officials have been first in this unfaithfulness. When I heard it, I tore my garment and my cloak, pulled hair from my head and my beard, and sat down stunned. Everyone who trembled at the words of the God of Israel gathered around me because of the unfaithfulness of the returned exiles, and I sat stunned until the evening sacrifice.
  - range: 5-9
    heading: Guilt and a brief grace
    plain: |
      At the evening sacrifice I rose from my humiliation with my garment and my cloak torn, fell on my knees and spread out my hands to the LORD my God, and said: O my God, I am ashamed and blush to lift up my face to You, my God, for our iniquities have risen higher than our heads, and our guilt has grown up to the heavens. From the days of our fathers to this day we have been deep in guilt, and for our iniquities we, our kings and our priests have been handed over to the kings of the lands, to the sword, to captivity, to plunder and to open shame, as we are today. But now, for a brief moment, the LORD our God has been gracious: He has left us a remnant that escaped and given us a secure peg in His holy place, so that our God may brighten our eyes and give us a little new life in our bondage. For we are slaves; yet our God has not forsaken us in our slavery, but has shown us His mercy before the kings of Persia, giving us new life to set up the house of our God and repair its ruins, and giving us a protecting wall in Judah and in Jerusalem.
  - range: 10-15
    heading: What shall we say after this?
    plain: |
      And now, our God, what can we say after this? We have forsaken Your commandments, which You gave by Your servants the prophets, saying: The land you are going to possess is unclean with the impurity of its peoples and their abominations, which have filled it from end to end with their uncleanness. So do not give your daughters to their sons or take their daughters for your sons, and never seek their peace or their prosperity, so that you may be strong, eat the good of the land, and leave it to your children as an inheritance forever. After all that has come upon us for our evil deeds and our great guilt (and You, our God, have punished us less than our iniquities deserved and have left us a remnant like this), shall we break Your commandments again and marry into the peoples who do these abominations? Would You not be angry with us until You had destroyed us, leaving no remnant and no survivor? O LORD God of Israel, You are righteous, for we are left as a remnant that has escaped, as we are today. Here we are before You in our guilt; we cannot stand before You because of this.

notes:
  - ref: 1
    phrase: doing according to their abominations
    kind: history
    title: The danger was their worship
    body: |
      The leaders' complaint is that the people had not kept themselves apart from the peoples of the land “doing according to their abominations,” and the word returns twice in Ezra's prayer (verses 11 and 14). The abominations of these peoples were their worship, and the law that forbade marrying them gives that as its reason: “For they will turn away thy son from following me, that they may serve other gods” ([[Deut. 7:4]]). Marriage with them was forbidden “because it led to idolatry,” and idolatry had already cost Israel its kingdom; those who entered such marriages had “married out of the covenant.”

      The law's concern was covenant and worship, not descent. Israel was forbidden to marry Canaanites “lest they abandon their covenants with the Lord,” and that law does not make marriage across peoples sinful in itself. Malachi later charges Judah in the same terms of worship: it “hath married the daughter of a strange god” ([[Mal. 2:11]]).
    sources: [lds-scriptures, ot-manual-29, scripture-helps-ezra, sc-knowhy-110]

  - ref: 5
    phrase: I fell upon my knees, and spread out my hands unto the LORD my God
    kind: history
    title: A public prayer at the hour of the offering
    body: |
      Ezra answered the report not with an order but with a public confession of the people's guilt, made at the hour of the evening sacrifice. First he tore his clothes and pulled at his hair and beard, and sat stunned through the day while those “that trembled at the words of the God of Israel” gathered around him (verses 3–4; on the trembling, see [[Isa. 66:2]]). Then, at the time of the evening sacrifice, he rose and knelt to pray. Scripture joins that hour to prayer elsewhere: the psalmist asks that “the lifting up of my hands” be received “as the evening sacrifice” ([[Ps. 141:2]]; the site explains that hour there), and Daniel was praying “about the time of the evening oblation” when Gabriel came ([[Dan. 9:21]]).

      The confession was made in front of the people it was about. The next chapter tells how Ezra prayed “weeping and casting himself down before the house of God,” while “a very great congregation of men and women and children” gathered to him, weeping too ([[Ezra 10:1]]).
    sources: [ludlow-ezra-minute, lds-scriptures]

  - ref: 6
    phrase: our iniquities are increased over our head
    kind: history
    title: Confessing in the plural
    body: |
      Ezra begins in the singular, “I am ashamed and blush,” and at once changes to the plural: “our iniquities,” “our trespass.” He had come only months before, sent “to teach in Israel statutes and judgments,” and nothing in the report names him among those who had married; yet he confesses the people's guilt as his own. He then joins this sin to every earlier one: “Since the days of our fathers have we been in a great trespass unto this day” (verse 7). The sword, the captivity and the spoil that “we, our kings, and our priests” had suffered were the punishment for that guilt, and the remnant in the land were still “bondmen” under the kings of Persia (verse 9).
    sources: [bd-ezra, lds-scriptures]

  - ref: 8
    phrase: to give us a nail in his holy place
    kind: symbol
    title: A peg in His holy place
    body: |
      The “nail” is a peg (Hebrew *yātēd*), the kind driven into a wall to hang things on, and it is used figuratively for a secure position. Isaiah uses it of Eliakim, fastened “as a nail in a sure place” ([[Isa. 22:23]]; the site explains that image there). Ezra's peg is fixed “in his holy place,” and verse 9 names what had been given there: the house of God set up and its desolations repaired.

      The words around the image are modest. The grace is for “a little space,” the reviving is “a little reviving,” the people are a remnant still “in our bondage.” Against that small hold, verse 14 sets what a new sin would bring: an anger that would leave “no remnant nor escaping.” On “that our God may lighten our eyes,” see [[Ps. 13:3]].

      The theme page [A Little Reviving in Our Bondage](/ezra/themes/a-little-reviving-in-our-bondage/) reads this prayer with the prophets' promise of a new heart and with John 8, as a picture of the difference between being brought home and being changed.
    sources: [bdb, lds-scriptures]

  - ref: 9
    phrase: to give us a wall in Judah and in Jerusalem
    kind: words
    title: A wall of protection
    body: |
      Ezra's “wall” is a figure, not the wall of the city, which was finished only under Nehemiah ([[Neh. 6:15]]). The word, *gādēr*, is the wall or fence put round a vineyard to protect it, as in the Lord's vineyard: “I will… break down the wall thereof” ([[Isa. 5:5]]). It is an image of protection from enemies, not of a walled place: such a wall, Ezra says, God had given them through the kings of Persia, who had let the house be built and kept the small community safe in the land.

      The verse completes the list of what grace had done “in the sight of the kings of Persia”: a reviving, a house set up, its ruins repaired, a protecting fence. It is the book's first thread, the Lord moving kings, in Ezra's own words.
    sources: [keil-ezra, lds-scriptures]

  - ref: 11
    phrase: Which thou hast commanded by thy servants the prophets
    kind: scripture
    title: The prophets and the law
    body: |
      Ezra gives a commandment “by thy servants the prophets,” but no one verse reads as he gives it. He has chiefly in view the marriage law of [[Deut. 7:1–3]]: the opening, “The land, unto which ye go to possess it,” recalls [[Deut. 7:1]], and “give not your daughters unto their sons, neither take their daughters unto your sons” is worded after [[Deut. 7:3]]. Into it he weaves other words of the law: “nor seek their peace or their wealth for ever” is almost word for word [[Deut. 23:6]], said there of Ammonites and Moabites. Ezra was not making a verbal quotation but giving the law's sense. He probably attributes the commandment to the prophets in general terms, as the books of Kings speak of what the Lord said “by all his servants the prophets” ([[2 Kgs. 17:23]]); Moses' own words in Deuteronomy are spoken after the manner of a prophet.

      The list in verse 1 joins the same laws: the Canaanite peoples of [[Deut. 7:1]], the Ammonites and Moabites of [[Deut. 23:3]], and the Egyptians. How the law itself reads is explained at [[Deut. 7]], [[Ex. 34:15]] and [[Deut. 23:3]].
    sources: [keil-ezra, lds-scriptures]

  - ref: 15
    phrase: we cannot stand before thee because of this
    kind: history
    title: A prayer that asks for nothing
    body: |
      Ezra's prayer ends without a request. It argues instead: having been punished less than their iniquities deserved and left a remnant (verse 13), should they break the commandments again and invite an anger that would leave “no remnant nor escaping” (verse 14)? Then it closes on God's righteousness and the people's guilt: “thou art righteous… we cannot stand before thee because of this.” Nowhere in it does Ezra ask for pardon.

      The people answered. When he had prayed, they gathered weeping, and Shechaniah spoke in the same plural Ezra had used: “We have trespassed against our God… yet now there is hope in Israel concerning this thing” ([[Ezra 10:2]]). Ezra had counseled repentance, and the people made a covenant to repent; what that covenant required, and what it cost, is the subject of [[Ezra 10]].

      The theme page [Till There Stood Up a Priest](/ezra/themes/till-there-stood-up-a-priest/) reads this last sentence with the priests of chapter 2, who were told to wait for a priest, and with the priest Hebrews 7 describes.
    sources: [scripture-helps-ezra, lds-scriptures]

christ: |
  Ezra names the return as “grace” shown “for a little space” (verse 8), and stands before the righteous God with nothing to offer but confession (verse 15). The Lord has since stated plainly what follows repentance: “he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more” ([[D&C 58:42]]). Ezra's confession led to the people's covenant to repent; how that pairing of confessing and forsaking applies to a disciple now is taken up with [[Ezra 10]].

