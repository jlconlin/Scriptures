chapter: 8
title: The Journey from Ahava
tagline: Ezra gathers the families who will go with him, sends for Levites, fasts rather than ask the king for soldiers, and brings the temple's gifts safely to Jerusalem by weight, “and the hand of our God was upon us.”
when: 'The journey of 458 B.C., from the first month to the fifth (7:9; 8:31).'

setting: |
  In 458 B.C. Ezra obtained from Artaxerxes a letter allowing any exiles who wished to go to Jerusalem to go with him, and entrusting him with offerings for the temple ([[Ezra 7:12–26]]). Chapter 7 ended with Ezra gathering “chief men to go up with me” ([[Ezra 7:28]]); chapter 8 is the journey itself, from the camp by the river Ahava to the house of God in Jerusalem.

  It is told in Ezra's own voice: the book's narrator gives way to Ezra's first-person memoir at [[Ezra 7:27]]. The chapter moves in five steps: the families who went (verses 1–14), the Levites Ezra had to send for (15–20), a fast for a safe road (21–23), the treasure handed to the priests and Levites (24–30), and the arrival, with offerings and the king's orders delivered (31–36).

  The journey took four months: they set out from Babylon on the first day of the first month and reached Jerusalem on the first of the fifth ([[Ezra 7:9]]). Where Ahava lay is not known, so the length of the road from there cannot be worked out. The reigns of the Persian kings are in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  Chapter 8 carries the first of the book's two threads into Ezra's own story: the Lord moves events to restore what was lost. Three times the chapter names “the hand of our God” (verses 18, 22, 31), the book's refrain for God's hand at work behind events (see the note on [[Ezra 7:6]]). Here the hand is not on a king but on a company of travellers. It brings the Levites Ezra lacked; it is what Ezra stakes his word on before the king, so that he will not ask for soldiers; and it brings them through the dangers of the road.

  The second thread runs underneath. The chapter opens with a register of who went, house by house, and Ezra stops the journey until the house of God has its ministers. A restored people is counted by its families and its temple servants before it moves, and what it carries is weighed out at the start and weighed in at the end.

sections:
  - range: 1-14
    heading: The families who went with Ezra
    plain: |
      These are the heads of the families, and this is the register of those who went up with me from Babylon in the reign of King Artaxerxes. From the priestly line of Phinehas, Gershom; from the line of Ithamar, Daniel; from the descendants of David, Hattush. Then the heads of twelve lay families, each with the number of men registered with him: Zechariah of the sons of Parosh, with 150 men; Elihoenai of Pahath-moab, with 200; the son of Jahaziel of Shechaniah, with 300; Ebed of Adin, with 50; Jeshaiah of Elam, with 70; Zebadiah of Shephatiah, with 80; Obadiah of Joab, with 218; the son of Josiphiah of Shelomith, with 160; Zechariah of Bebai, with 28; Johanan of Azgad, with 110; the last of the sons of Adonikam, Eliphelet, Jeiel and Shemaiah, with 60; and Uthai and Zabbud of Bigvai, with 70.
  - range: 15-20
    heading: Ezra sends for Levites
    plain: |
      I gathered them at the river that flows toward Ahava, and we camped there three days. When I looked over the people and the priests, I found none of the Levites there. So I sent for nine leading men and two men of understanding, and sent them to Iddo, the leader at the place called Casiphia, telling them exactly what to say to Iddo and his kinsmen the temple servants there: that they should send us ministers for the house of our God. Because the good hand of our God was upon us, they brought us a man of understanding from the sons of Mahli, a descendant of Levi son of Israel, and Sherebiah with his sons and kinsmen, eighteen men; and Hashabiah, and with him Jeshaiah of the sons of Merari, with their kinsmen and sons, twenty men; and 220 of the temple servants, whom David and the leaders had appointed to serve the Levites. Every one of them was recorded by name.
  - range: 21-23
    heading: A fast at the river
    plain: |
      There at the river Ahava I proclaimed a fast, so that we might humble ourselves before our God and ask Him for a safe journey for ourselves, our children and all our goods. For I was ashamed to ask the king for a troop of soldiers and horsemen to protect us from enemies on the road, because we had told the king, “The hand of our God is upon everyone who seeks Him, for good, but His power and His anger are against all who forsake Him.” So we fasted and asked our God for this, and He heard our prayer.
  - range: 24-30
    heading: The treasure weighed out
    plain: |
      Then I set apart twelve of the leading priests, together with Sherebiah, Hashabiah and ten of their kinsmen, and weighed out to them the silver, the gold and the vessels: the offering for the house of our God given by the king, his counsellors, his officials and all the Israelites there. I weighed into their hands 650 talents of silver, silver vessels weighing 100 talents, 100 talents of gold, twenty gold bowls of a thousand drams, and two vessels of fine shining copper, as precious as gold. I said to them, “You are holy to the LORD, and the vessels are holy, and the silver and gold are a freewill offering to the LORD God of your fathers. Guard them and keep them until you weigh them out before the chief priests, the Levites and the heads of the families of Israel in Jerusalem, in the rooms of the house of the LORD.” So the priests and Levites took charge of the silver, the gold and the vessels, by weight, to bring them to Jerusalem to the house of our God.
  - range: 31-36
    heading: Arrival in Jerusalem
    plain: |
      We left the river Ahava on the twelfth day of the first month to go to Jerusalem. The hand of our God was upon us, and He rescued us from enemies and from ambushes along the way. We reached Jerusalem and rested there three days. On the fourth day the silver, the gold and the vessels were weighed out in the house of our God into the hands of Meremoth son of Uriah the priest, with Eleazar son of Phinehas, and the Levites Jozabad son of Jeshua and Noadiah son of Binnui. Everything was counted and weighed, and the whole weight was recorded then. And the returned exiles, those who had come out of captivity, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering, all of it a burnt offering to the LORD. They delivered the king's orders to the royal satraps and to the governors of the province west of the Euphrates, and these supported the people and the house of God.

notes:
  - ref: 1
    phrase: this is the genealogy of them that went up with me from Babylon
    kind: history
    title: The houses that went up with Ezra
    body: |
      The list that opens the chapter is a register, and it is built like the people it describes. First come the priests, by two lines descended from Aaron: Phinehas, his grandson through Eleazar, and Ithamar, his son ([[Ex. 6:23–25]]); then Hattush, “of the sons of David”; then twelve lay houses, each with its head and the number of men enrolled with him. The men add up to about fifteen hundred, besides the priests and Davidic family, whose numbers are not given. Most of the lay houses had already sent members home with Zerubbabel ([[Ezra 2:3–15]]): Parosh, Shephatiah, Pahath-moab, Elam, Bebai, Azgad, Adonikam, Bigvai and Adin are all there. Ezra's company joins families already in the land.

      Why give it at all? Throughout Ezra and Nehemiah, showing an accurate line is how priests and leaders were qualified, and it was part of rebuilding and defining the identity of the community; the longer register in [[Ezra 2]] does the same work. Ezra's register numbers the men enrolled in each house, and by naming priests, a son of David and the old families it shows a company of the same people coming home.
    sources: [ludlow-ezra-minute, lds-scriptures]

  - ref: 15
    phrase: found there none of the sons of Levi
    kind: history
    title: No Levites at the river
    body: |
      Ezra's review of the camp turned up priests but no Levites, and he would not leave without them. The “sons of Levi” here are the Levites who were not priests: every priest descended from Aaron, who was of the tribe of Levi, so the priests were a subgroup of the Levites. Ezra had a commission to beautify the house of God ([[Ezra 7:27]]), and the house needed its servants. So he stopped the journey and sent eleven men to Iddo, “the chief at the place Casiphia,” with exact instructions, to ask for “ministers for the house of our God” (verse 17).

      The answer is credited to “the good hand of our God” (verse 18): Levites of the families of Mahli and Merari, eighteen with Sherebiah and twenty with Hashabiah, and 220 Nethinims, the temple servants of [[Ezra 2:43]], every one recorded by name. The trouble was worth it: two of the Levites who came, Sherebiah and Hashabiah, were trusted with the treasure (verse 24), and a Levite named Sherebiah stands among those who helped the people understand the law when Ezra read it ([[Neh. 8:7]]).
    sources: [ot-manual-29, ludlow-ezra-minute, lds-scriptures]

  - ref: 21
    phrase: to seek of him a right way for us
    kind: history
    title: A fast for a right way
    body: |
      Before setting out, Ezra called the whole company to a fast with a single, practical request: a safe road. This is a public petitionary fast, the kind Israel kept when it needed God's help with something in front of it, as all Israel did in the war with Benjamin ([[Judg. 20:26]]) and Jehoshaphat's Judah when an army came against it ([[2 Chr. 20:3]]). It is not a fast of mourning or of penitence; Ezra's fast in [[Ezra 10:6]] will be the second kind. Fasting to give force to a petition, particularly before a new undertaking, runs all through scripture.

      “A right way” is a smooth journey, and the phrase appears in many other texts of the exile that describe the return to Judah. They asked it for themselves, for their “little ones” and for all their goods: families with children, carrying the temple's treasure, travelling for months. To “afflict” themselves was to humble themselves before God and ask for what they could not provide.
    sources: [ricks-fasting, ludlow-ezra-minute]

  - ref: 22
    phrase: I was ashamed to require of the king a band of soldiers and horsemen
    kind: history
    title: Ashamed to ask for soldiers
    body: |
      Ezra gives his own reason for fasting instead of asking for an escort: he had already told the king that “the hand of our God is upon all them for good that seek him,” and to ask now for cavalry would have seemed to take it back. The journey was long and the times unsettled; having declared his confidence in God before Artaxerxes, he could hardly turn round and ask the king to protect him. So the company set out to make its confession good by humble prayer, asking God to be the defense they had said He was. Verse 23 gives the outcome in four words: “he was entreated of us.”

      The choice was Ezra's, not a rule. Later Nehemiah came to Jerusalem with “captains of the army and horsemen” the king had sent with him ([[Neh. 2:9]]), as befitted a governor, and he too credited his success to “the good hand of my God upon me” ([[Neh. 2:8]]). The reason verse 22 gives for Ezra is his own words to the king. The end of the journey bore out the phrase he had staked them on: “the hand of our God was upon us, and he delivered us from the hand of the enemy, and of such as lay in wait by the way” (verse 31), apparently from some attack the record does not describe.
    sources: [keil-ezra, ot-manual-29, keil-nehemiah, ludlow-ezra-minute, lds-scriptures]

  - ref: 28
    phrase: Ye are holy unto the LORD; the vessels are holy also
    kind: history
    title: Holy men for holy things
    body: |
      Ezra put an enormous treasure into the hands of men who, like the vessels, were holy to the Lord. A talent weighed about 75 pounds, so the 650 talents of silver, with silver vessels of another hundred, came to more than twenty-five tons of silver, and the hundred talents of gold to nearly four tons more. These were the freewill offerings of the king, his counsellors and the Jews who stayed behind ([[Ezra 7:15–16]]), and Ezra could not carry them himself. He set apart leading priests, with the Levites Sherebiah and Hashabiah and their kinsmen, and weighed the treasure into their hands (verses 24, 30).

      His charge to them joins the bearers and the burden: “Ye are holy unto the LORD; the vessels are holy also.” Holy means set apart, consecrated to the Lord, and in this sense people and objects can both be holy: the men who carried what was consecrated to the Lord were reminded that they were themselves consecrated to Him. The treasure was weighed into their hands at Ahava, to be weighed again “in the chambers of the house of the LORD” (verse 29), and at Jerusalem it was, “by number and by weight of every one: and all the weight was written at that time” (verse 34).
    sources: [bd-weights-and-measures, ludlow-ezra-minute, lds-scriptures]

  - ref: 35
    phrase: twelve bullocks for all Israel
    kind: symbol
    title: Offerings for all Israel
    body: |
      The new arrivals' first act of worship was offered for the whole people. The twelve bullocks and the twelve he goats of the sin offering stand for the twelve tribes, as the twelve goats “for a sin offering for all Israel” did at the dedication of the house ([[Ezra 6:17]]). The other numbers have been read the same way: ninety-six rams as eight twelves, and seventy-seven lambs as an intensified seven.

      The goats were a sin offering, which availed as atonement for the sins of all Israel; the rest was a burnt offering, of which those who offered it ate nothing, and it is read as the surrender of the whole nation to the Lord's service. Coming just after the treasure was delivered, these were the newcomers' first offerings at the house of God, and they were offered as purification offerings by those who had come out of the captivity as they joined in its worship.
    sources: [keil-ezra, ludlow-ezra-minute]

christ: |
  Ezra's company fasted before a journey it could not make safely on its own, and the Lord “was entreated of us” (verse 23). Jesus fasted forty days before He began His ministry ([[Matt. 4:2]]) and taught His disciples to fast in secret to their Father ([[Matt. 6:16–18]]); the Lord taught fasting as part of His gospel. Fasting with a specific purpose before a new undertaking can bring great strength, and the hand of God the chapter names three times rests on those who seek Him (verse 22).

