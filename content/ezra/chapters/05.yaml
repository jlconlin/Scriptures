chapter: 5
title: Who Hath Commanded You?
tagline: Prophets speak, the builders go back to work, and a Persian governor asks who gave them leave. He lets the work go on while he writes to Darius, and the elders' answer names their God, their fathers' sin, and Cyrus's decree.
when: 'The second year of Darius I, 520 B.C. (Ezra 4:24; Haggai 1:1).'

setting: |
  Chapter 4 ended with the work on the house of God stopped “unto the second year of the reign of Darius king of Persia” ([[Ezra 4:24]]). This chapter opens in that year, 520 B.C., under Darius the son of Hystaspes, when the people, “exhorted by the prophets Haggai and Zechariah,” took up the work again. Haggai's first message came on the first day of the sixth month ([[Hag. 1:1]]), and the builders were at work by the twenty-fourth ([[Hag. 1:15]]); Zechariah's first word came in the eighth month ([[Zech. 1:1]]). What the two prophets said is in their own books. This book records only that they spoke and stood by the builders (verses 1–2).

  The rest of the chapter is a Persian official's file. Tatnai, governor of the province west of the Euphrates, came to Jerusalem to ask who had authorized the building, let the work continue, and wrote to Darius; the chapter copies his letter (verses 6–17). Like the whole of Ezra 4:8–6:18 it is in Aramaic, “an official language of the Persian Empire.” The king's answer, and the finding of Cyrus's decree, is [[Ezra 6]]. The kings and dates are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  The chapter turns on one question, asked twice: “Who hath commanded you to build this house?” (verses 3 and 9). Before the governor asks it, the narrator has already answered it. The God of Israel had spoken through His prophets, and the leaders “rose up” and began to build (verses 1–2). The elders then answer the governor at length (verses 11–16): they are the servants of the God of heaven and earth, rebuilding a house that a great king of Israel built, which their God gave up to Nebuchadnezzar for their fathers' sins and which Cyrus decreed should rise again.

  Between the question and the answer stands verse 5: “the eye of their God was upon the elders of the Jews.” The governor could have halted the work while the letter went to the king; he did not. That is the book's first thread, the Lord moving kings and officials to restore what was lost, carried here by a governor's caution and a king's archive rather than by any miracle.

sections:
  - range: 1-2
    heading: The prophets speak and the work begins again
    plain: |
      Then the prophets Haggai and Zechariah, Iddo's descendant, prophesied to the Jews in Judah and Jerusalem in the name of the God of Israel, who was over them. So Zerubbabel son of Shealtiel and Jeshua son of Jozadak set to work and began to build the house of God in Jerusalem, and the prophets of God were with them, helping them.
  - range: 3-5
    heading: The governor's question
    plain: |
      At that time Tatnai, governor of the province west of the Euphrates, came to them with Shethar-boznai and their colleagues and asked, “Who gave you orders to build this house and to finish this structure?” They also asked for the names of the men who were doing the building. But the eye of their God was on the elders of the Jews, and the officials did not stop them while the matter went to Darius and until a written answer came back.
  - range: 6-10
    heading: The report to Darius
    plain: |
      This is a copy of the letter that Tatnai the governor, Shethar-boznai, and their colleagues the Apharsachites, officials of the province, sent to King Darius: “To King Darius, all peace. The king should know that we went to the province of Judea, to the house of the great God. It is being built with large stones, with timber set in the walls, and the work is going forward quickly and succeeding in their hands. We asked the elders who had authorized them to build this house and to finish this structure. We also asked their names, so that we could write down for you the names of the men in charge.”
  - range: 11-16
    heading: The elders' answer
    plain: |
      “This was their answer: ‘We are the servants of the God of heaven and earth, and we are rebuilding the house that stood here many years ago, which a great king of Israel built and finished. But because our fathers provoked the God of heaven to anger, He handed them over to Nebuchadnezzar the Chaldean, king of Babylon, who destroyed this house and carried the people off to Babylon. But in his first year as king of Babylon, King Cyrus issued a decree that this house of God be rebuilt. King Cyrus also took out of the temple in Babylon the gold and silver vessels of the house of God that Nebuchadnezzar had carried off from the temple in Jerusalem. He gave them to a man named Sheshbazzar, whom he had made governor, and told him, “Take these vessels, go, and put them in the temple in Jerusalem, and let the house of God be rebuilt on its site.” So Sheshbazzar came and laid the foundation of the house of God in Jerusalem, and from then until now it has been under construction and is not yet finished.’
  - range: 17-17
    heading: The request for a search
    plain: |
      “Now, if it pleases the king, let a search be made in the royal treasury there in Babylon to see whether King Cyrus did issue a decree to rebuild this house of God in Jerusalem, and let the king send us his decision on the matter.”

notes:
  - ref: 2
    phrase: with them were the prophets of God helping them
    kind: history
    title: The prophets of God helping them
    body: |
      The building started again because prophets spoke, not because the opposition had gone away. Ezra gives none of their words; their messages are their own books, where they not only prophesied about the temple but pressed the people to get on with it. Haggai's first message came on the first day of the sixth month of Darius's second year ([[Hag. 1:1]]). He answered the people's claim that the time had not come with “Is it time for you, O ye, to dwell in your ceiled houses, and this house lie waste?” ([[Hag. 1:4]]), and by the twenty-fourth day the governor, the high priest and the people “came and did work in the house of the LORD of hosts, their God” ([[Hag. 1:14]]).

      “Helping them,” then, means the prophets' word: Zerubbabel rebuilt the temple helped by Haggai's messages and by Zechariah's vision of the lampstand, where the word to Zerubbabel was “Not by might, nor by power, but by my spirit, saith the LORD of hosts” ([[Zech. 4:6]]) and the promise that “his hands shall also finish it” ([[Zech. 4:9]]). Zechariah is called “the son of Iddo” after his grandfather (see the note on [[Zech. 1:1]]).
    sources: [ludlow-ezra-minute, bd-zerubbabel, lds-scriptures]

  - ref: 3
    phrase: came to them Tatnai, governor on this side the river
    kind: history
    title: Tatnai, the governor over Judah’s governor
    body: |
      Tatnai was the provincial governor of the whole region west of the Euphrates, the province to which Judea and its own governor, Zerubbabel, answered. With him came Shethar-boznai, perhaps his secretary, and their staff. His question, “Who hath commanded you…?”, asks by whose authority they build, and he also asked for the names of the men in charge (verses 4, 10).

      His report reads differently from the letter of chapter 4. Those letter-writers accused the Jews of building a rebellious city that would stop paying tribute ([[Ezra 4:12–13]]); Tatnai describes what he saw, records the elders' own account, and asks the king to check it. He had the power to stop the building while he wrote, and he let it go on.

      Verse 4 has a puzzle of its own. The Aramaic says “Then said *we*,” as if the narrator were one of the builders answering. The Greek translation reads “they spoke,” and modern translations make the officials the askers: “They also asked them this.” One reading keeps the “we” as the original text, finding no good reason in the Greek to change it; then the writer of this account was an eyewitness and one of those at work on the house.
    sources: [ludlow-ezra-minute, keil-ezra, oshb-wlc, lxx-rahlfs, esv]

  - ref: 3
    phrase: to make up this wall
    kind: words
    title: A wall, or the structure?
    body: |
      The “wall” here is not the city wall of chapter 4. The Aramaic word (*ʾuššarnāʾ*) appears only here and in verse 9, both times beside “this house,” and its meaning and root are uncertain. Most have taken it as “wall,” as the King James translators did; one proposal connects it with an Assyrian word for a sanctuary; the Greek translation guessed “this preparation,” the building materials. Modern translations make it the building itself: “Who gave you a decree to build this house and to finish this structure?”

      The difference matters for reading the chapter. In [[Ezra 4:12–16]] the accusation was that the Jews were walling a rebellious city. Tatnai asks about the temple and its structure, and the elders answer about the temple and nothing else (verses 11–16).
    sources: [oshb-wlc, bdb, lxx-rahlfs, esv, nrsvue]

  - ref: 5
    phrase: the eye of their God was upon the elders of the Jews
    kind: symbol
    title: The eye of their God
    body: |
      Verse 5 is the narrator's explanation of why the work did not stop. Nothing dramatic happened: the governor sent a request for instructions to Darius, and the building went on while the letter traveled, so that the officials “did not stop them until a report reached Darius.” The narrator credits that ordinary decision to God, whose eye was on the elders: watching over men who had gone back to work before they had any answer from the king.
    sources: [ludlow-ezra-minute, nrsvue]

  - ref: 11
    phrase: We are the servants of the God of heaven and earth
    kind: history
    title: Servants of the God of heaven and earth
    body: |
      Asked for a permit, the elders begin with whose servants they are. Then they tell the governor a history. The house they are building is the one a great king of Israel built and finished long before, so the work is a restoration, not a new venture. One Latter-day Saint reading of Ezra–Nehemiah finds the book taking care to show worship resumed in continuity with the time before the exile, and counts this verse, with its temple rebuilt in the likeness of Solomon's, among the signs of it.

      The elders do not hide why the first house fell. “Our fathers had provoked the God of heaven unto wrath” (verse 12), so He gave them into Nebuchadnezzar's hand. To a Persian official they explain the ruin as their own God's judgment on their fathers' disobedience, and the return as His work through Cyrus.
    sources: [welch-religious-authority, ludlow-ezra-minute]

  - ref: 13
    phrase: the same king Cyrus made a decree to build this house of God
    kind: history
    title: Cyrus’s decree as their warrant
    body: |
      This is the elders' direct answer to “Who hath commanded you?”: Cyrus had (see [[Ezra 1:2–4]]). He had also sent back the temple's vessels with Sheshbazzar (verses 14–15), so the builders were completing a royal commission, not starting a rebellion. So Tatnai asks Darius to have the royal treasure house searched to see whether such a decree was made (verse 17).

      The search was made, and the order was found, with its measurements and its funding ([[Ezra 6:1–5]]). Darius let it stand, and the decrees of one king were often honored by his successors.
    sources: [ot-manual-29, ludlow-ezra-minute]

  - ref: 16
    phrase: Then came the same Sheshbazzar, and laid the foundation of the house of God
    kind: history
    title: Sheshbazzar and the unfinished house
    body: |
      The elders credit the foundation to Sheshbazzar, whom Cyrus “had made governor” (verse 14), while [[Ezra 3:8–10]] and [[Zech. 4:9]] give it to Zerubbabel. Sheshbazzar may be Zerubbabel's Persian name, or, as seems likelier, a second man, both of them of the royal line and both probably appointed by Cyrus. This chapter is part of the case for two men, since it names Zerubbabel (verse 2) and Sheshbazzar (verse 14) in the same account. The question is weighed at [[Ezra 1:8]].

      The elders also say that the house has been “in building” ever since, though [[Ezra 4:24]] says the work ceased. Their statement need not deny the stoppage; it simply leaves out what had caused the delay.
    sources: [bd-zerubbabel, ot-manual-29, ludlow-ezra-minute, keil-ezra]

christ: |
  The God of Israel in whose name Haggai and Zechariah spoke (verse 1) is Jehovah, and “Jehovah is the premortal Jesus Christ.” In this chapter He works in two ways at once: through prophets who stand beside the builders (verse 2), and through His eye on the elders while a governor's letter travels to the king (verse 5).

  The pattern holds for disciples now. Prophets in this dispensation have moved the Saints to sacrifice to build temples, as Haggai and Zechariah moved the builders of 520 B.C. The same Lord whose eye was on the elders while their case went to the king watches over those who take up His work at His prophets' word.

explore: |
  - **The prophets' own words to the builders.** [[Hag. 1:1–15]]; [[Hag. 2:1–9]]; [[Zech. 4:6–10]]; [[Zech. 8:9–13]].
  - **Two letters to two kings.** [[Ezra 4:11–16]] beside [[Ezra 5:7–17]], and the replies in [[Ezra 4:17–22]] and [[Ezra 6:1–12]].
  - **The decree and the vessels.** [[Ezra 1:1–11]]; [[Ezra 6:3–5]].

