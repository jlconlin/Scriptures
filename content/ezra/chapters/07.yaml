chapter: 7
title: Ezra Prepared His Heart
tagline: A priest of Aaron's line and a scribe expert in the law of Moses comes up from Babylon with a Persian king's letter in his hand, and the first words he speaks for himself bless the Lord who put it in the king's heart.
when: 'The seventh year of Artaxerxes I (verse 7), 458 B.C., about sixty years after chapter 6.'

setting: |
  “Now after these things” (verse 1) passes over nearly sixty years. Chapter 6 ended with the temple finished in the sixth year of Darius, 516 B.C. by the Bible Dictionary's count and 515 by others', and the book records nothing between that and Ezra's mission. The years it leaves out are the years of the book of Esther.

  Ezra's king is Artaxerxes I, called Longimanus, the son of Xerxes, who reigned over Persia from 465 to 425 B.C.; his seventh year (verse 7) is 458 B.C., the date the Church's chronology gives for Ezra's commission, about eighty years after the first exiles came home. The date is disputed among scholars, who differ over whether Ezra came before Nehemiah or after, though the scriptures seem to put him first. The kings and their dates are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  The chapter has three parts. Verses 1–10 introduce Ezra and his journey. Verses 11–26 copy the king's letter, which, like [[Ezra 4:8]]–6:18, is in Aramaic, an official language of the Persian Empire. Verses 27–28 return to Hebrew, and Ezra speaks for himself.

thread: |
  The chapter opens the book's second half by bringing two things to Jerusalem together: a man and a law. Nearly everything said of Ezra is said in terms of the law. He is a priest descended from Aaron, a scribe expert “in the law of Moses” (verse 6), a man who had prepared his heart “to seek the law of the LORD, and to do it, and to teach” it (verse 10). The king's letter sends him to inquire “according to the law of thy God which is in thine hand” (verse 14) and to set judges who know it (verse 25). The king's letter is a commission for both, the return of the Israelites and the establishment of the law among them, and in the last two verses Ezra gives thanks to God for it.

  Running beside that is the book's first thread, the Lord moving kings to restore what was lost. The king “granted him all his request,” but the narrator gives the reason: “according to the hand of the LORD his God upon him” (verse 6). The phrase returns at the safe arrival (verse 9) and again in Ezra's own mouth (verse 28), and it recurs through Ezra and Nehemiah (see the note on verse 6). A Persian decree is the means; Ezra's first words make sure the reader knows whose hand moved it.

sections:
  - range: 1-6
    heading: Ezra, priest and scribe
    plain: |
      Long after these events, in the reign of Artaxerxes king of Persia, came Ezra. He was the son of Seraiah, son of Azariah, son of Hilkiah, son of Shallum, son of Zadok, son of Ahitub, son of Amariah, son of Azariah, son of Meraioth, son of Zerahiah, son of Uzzi, son of Bukki, son of Abishua, son of Phinehas, son of Eleazar, son of Aaron the chief priest. This Ezra went up from Babylon. He was a scribe expert in the law of Moses, which the LORD God of Israel had given, and the king granted him everything he asked, because the hand of the LORD his God was on him.
  - range: 7-10
    heading: The journey
    plain: |
      Some of the Israelites, with priests, Levites, singers, gatekeepers and temple servants, went up to Jerusalem with him in the seventh year of King Artaxerxes. Ezra arrived in Jerusalem in the fifth month of that year. He had set out from Babylon on the first day of the first month and reached Jerusalem on the first day of the fifth, for the good hand of his God was on him. Ezra had set his heart to study the law of the LORD, to keep it, and to teach its statutes and judgments in Israel.
  - range: 11-20
    heading: 'The king''s letter: the people and the offerings'
    plain: |
      This is a copy of the letter King Artaxerxes gave to Ezra the priest and scribe, a scholar of the commandments and statutes the LORD gave Israel: “Artaxerxes, king of kings, to Ezra the priest, scribe of the law of the God of heaven: peace. I decree that any of the people of Israel in my kingdom, including their priests and Levites, who choose of their own free will to go up to Jerusalem may go with you. You are sent by the king and his seven counselors to inquire into Judah and Jerusalem by the law of your God, which you hold in your hand. Take the silver and gold that the king and his counselors have freely given to the God of Israel, whose dwelling is in Jerusalem, and all the silver and gold you can collect in the province of Babylon, along with the freewill offerings of the people and the priests for the house of their God in Jerusalem. With this money buy without delay bullocks, rams and lambs, with the offerings that go with them, and offer them on the altar of the house of your God in Jerusalem. Whatever you and your brethren think best to do with the rest of the silver and gold, do it according to the will of your God. Deliver to the God of Jerusalem the vessels given you for the service of His house. Anything else the house of your God needs that falls to you to provide, provide it from the king's treasury.
  - range: 21-24
    heading: Orders to the treasurers
    plain: |
      “I, King Artaxerxes, decree to all the treasurers west of the Euphrates: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, do it promptly, up to a hundred talents of silver, a hundred measures of wheat, a hundred baths of wine, a hundred baths of oil, and salt without limit. Whatever the God of heaven commands, let it be done carefully for the house of the God of heaven. Why should wrath fall on the king's realm and his sons? We also inform you that you may not impose toll, tribute or custom on any of the priests, Levites, singers, gatekeepers, temple servants, or other ministers of this house of God.
  - range: 25-26
    heading: Judges and the law
    plain: |
      “And you, Ezra, by the wisdom of your God that you hold, appoint magistrates and judges to judge all the people west of the Euphrates who know the laws of your God, and teach those who do not know them. Whoever will not keep the law of your God and the law of the king, let judgment be carried out on him promptly, whether death, banishment, confiscation of goods, or imprisonment.”
  - range: 27-28
    heading: Ezra blesses the Lord
    plain: |
      Blessed be the LORD God of our fathers, who put it into the king's heart to beautify the house of the LORD in Jerusalem, and who has shown me favor before the king, his counselors and all his mighty princes. I took courage, because the hand of the LORD my God was on me, and I gathered leading men from Israel to go up with me.

notes:
  - ref: 1
    phrase: Ezra the son of Seraiah
    kind: history
    title: Ezra’s descent from Aaron
    body: |
      The pedigree in verses 1–5 is Ezra's credential. It interrupts the sentence before it can say what Ezra did: verse 1 names him, and only in verse 6, “This Ezra went up from Babylon,” does the sentence pick him up again. In between, his line runs back through Phinehas and Eleazar to “Aaron the chief priest.” The verses stress his priestly descent because it gave his teaching its authority, and Ezra and Nehemiah consistently treat a demonstrated lineage as what qualifies a man for priesthood and leadership; this is the community that had put priests without a register out of the priesthood ([[Ezra 2:62]]).

      “Son of” here means descendant. Seraiah was the high priest Nebuchadnezzar put to death at Riblah ([[2 Kgs. 25:18]], where the site follows his line), some 130 years before Ezra's journey, so Ezra was his great- or great-great-grandson. Jeshua, the high priest who came back with Zerubbabel, was Seraiah's grandson through Jozadak; Ezra is not called a son of Jozadak, which probably means he came from a younger branch, a priest of the high priests' family but not in their succession. The list is also shortened in the usual way of long genealogies: between Azariah and Meraioth in verse 3, six names that 1 Chronicles 6 gives are left out.
    sources: [keil-ezra, ludlow-ezra-minute]

  - ref: 6
    phrase: a ready scribe in the law of Moses
    kind: words
    title: A ready scribe
    body: |
      In the King James English, a “ready scribe” is an expert one, not a quick one. The title itself had changed meaning: under the kings of Judah a scribe was a court official, something like a secretary of state, and after the captivity the title was given to Ezra and to others who taught the law.

      The phrase “in the law of Moses” matters as much as the title. Naming Ezra a scribe skilled in the law of Moses is one of the ways the book presents restored worship as a recovery of what was before the exile (see the note on [[Ezra 3:2]]): in its telling, Moses is the forerunner who gives the whole work of the return its legitimacy. Ezra is drawn in many ways like Moses, the man who brings the law to the people, as he does when he reads it to them in [[Neh. 8:1–8]].
    sources: [ludlow-ezra-minute, bd-scribe, welch-religious-authority]

  - ref: 6
    phrase: according to the hand of the LORD his God upon him
    kind: symbol
    title: The hand of the LORD upon him
    body: |
      The king granted Ezra “all his request,” and the narrator immediately says why: the hand of the LORD was on him. The phrase is Ezra's refrain. It explains the safe arrival in verse 9, where the hand is “good”: a journey from Babylon of about 1,100 miles, made in four months, from the first day of the first month to the first day of the fifth. It is on Ezra's own lips in verse 28, and it carries the next chapter ([[Ezra 8:18]], 22, 31). Through Ezra and Nehemiah the phrase reads the whole history of the return as the benevolent hand of God working behind the scenes.

      In chapter 8 Ezra acts on it: he is ashamed to ask the king for soldiers because he had told him that “the hand of our God is upon all them for good that seek him” ([[Ezra 8:22]]).
    sources: [welch-religious-authority, garner-ezra-unfolds]

  - ref: 10
    phrase: prepared his heart to seek the law of the LORD, and to do it, and to teach
    kind: prophets
    title: Seek, do, teach
    body: |
      Verse 10 gives the reason behind verses 6–9: Ezra had set his heart on three things, to seek the law, to do it, and to teach it. He was a teacher well versed in the scriptures who had given himself to both their study and their observance. Teaching was the object of his mission, and when he and Nehemiah later instructed the people in the law of Moses ([[Neh. 8:1–8]]), the law, until then largely the possession of the priests, was brought within reach of every Jew.

      The verse puts the heart first: Ezra prepared it before he sought, did or taught. He was “one of the great teachers and prophet-leaders in Israel,” and his preparation is the pattern for a latter-day prophet who, “like Ezra of old,” had “prepared himself to receive the word of the Lord” and was “prepared to do the Lord's will.”
    sources: [garner-ezra-unfolds, bd-ezra, condie-scriptural-leadership, lds-scriptures]

  - ref: 23
    phrase: for why should there be wrath against the realm of the king and his sons?
    kind: history
    title: Why a Persian king paid for the house of God
    body: |
      The king's letter gives generous support to the house of God. The king and his counselors give silver and gold (verse 15); Ezra may collect more in Babylon (verse 16); the treasurers west of the Euphrates are to supply him up to a hundred talents of silver and fixed amounts of wheat, wine and oil, with salt without limit (verses 21–22); and everyone who serves at the temple is exempt from tax (verse 24). It was rare for a government to support the worship of a religion not its own.

      Verse 23 gives the king's own reason. Whatever the God of heaven commands is to be done for His house, “for why should there be wrath against the realm of the king and his sons?” The motive recalls Darius's decree, that the priests might offer acceptable sacrifices “and pray for the life of the king, and of his sons” ([[Ezra 6:10]]). In this Artaxerxes was following Cyrus and Darius, and he went beyond them in giving the Jews their own judges (verse 25).
    sources: [ludlow-ezra-minute, keil-ezra]

  - ref: 26
    phrase: the law of thy God, and the law of the king
    kind: history
    title: The law of God made the law of the king
    body: |
      Ezra's commission gives the law of Moses the force of royal law. He is to appoint magistrates and judges for “all the people that are beyond the river, all such as know the laws of thy God,” and to teach those who do not (verse 25). Whoever will not keep “the law of thy God, and the law of the king” is to be punished, by death, banishment, confiscation or prison (verse 26). The letter thus allowed Ezra to apply God's law within the Jewish community, punishments included, and it charged him to teach the law as well as to set up courts for those who broke it.

      In the Aramaic of verse 26 one word, *dat*, stands for both laws: the law of God and the law of the king. It is the Persian loanword discussed at [[Deut. 33:2]], and verse 14 uses it of the law “which is in thine hand.”
    sources: [ludlow-ezra-minute, bd-ezra, ot-manual-29, oshb-wlc]

  - ref: 27
    phrase: Blessed be the LORD God of our fathers
    kind: history
    title: Ezra begins to speak
    body: |
      With verse 27 the language changes back from Aramaic to Hebrew, and the narrator's “he” becomes Ezra's “I.” Ezra and Nehemiah weave first-person memoir into third-person history and official documents, and Ezra's own memoir begins here and runs through the chapters that follow.

      His first words are praise, and they answer the letter just copied: Ezra blesses the God who put it into the king's heart to beautify the house of the LORD and who gave him favor before the king's court. Then he says what that favor did to him: “I was strengthened as the hand of the LORD my God was upon me” (verse 28), and he gathered the leaders of Israel to go with him. The story picks up from there in [[Ezra 8:15]], with the company assembled.
    sources: [bd-aramaic, ot-manual-29, welch-religious-authority, ludlow-ezra-minute]

christ: |
  Ezra's commission was to bring the law home and teach it, and the law he taught was itself a preparation: among the lasting values of his book is that “preparation is needed for the rule of Messiah, the law being the schoolmaster to bring men to Christ.” Ezra's reforms left a lasting mark on the people and helped shape the religious world into which Jesus Christ was born.

  Ezra's preparation began in the heart (verse 10), and the Lord asks the same of disciples now. Among the cross-references the footnote gives for Ezra's “prepared” is the Lord's word in this dispensation, “prepare thy heart to receive and obey the instructions which I am about to give unto you” ([[D&C 132:3]]): the heart is made ready before the word is received and obeyed.

explore: |
  - **Ezra reads the law to the people.** [[Neh. 8:1–12]], where verse 10's “to teach in Israel” is carried out.
  - **The hand of the Lord on the road.** [[Ezra 8:18–31]].
  - **Seraiah's line.** [[2 Kgs. 25:18–21]]; [[1 Chr. 6:3–15]].
  - **Kings moved for the house of God.** [[Ezra 1:1–4]]; [[Ezra 6:6–12]]; [[Ezra 6:22]].

