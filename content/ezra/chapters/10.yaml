  - **The same marriages later.** [[Neh. 13:23–31]]; [[Mal. 2:10–16]].
  - **A foreign wife in the line of Christ.** [[Ruth 1:16]]; [[Ruth 4:13–17]]; [[Matt. 1:5]].
  - **Another public prayer that draws a crowd.** [[Hel. 7:10–16]].
  - **Confessing and forsaking.** [[Lev. 5:5]]; [[D&C 58:42–43]].

