chapter: 10
title: The Covenant to Put Away the Strange Wives
tagline: While Ezra prays at the temple, a crowd gathers in tears, and one of them proposes a covenant. The people assemble in the winter rain, a court sits for three months, and the book ends on the names of the men who had married foreign wives, priests first.
when: 'The ninth month of 458 B.C. to the first month of the next year (verses 9, 16–17).'

setting: |
  Chapter 10 follows directly on [[Ezra 9]]. The princes had told Ezra that the people, the priests and the Levites had married into “the people of the lands” ([[Ezra 9:1]]), and Ezra had answered with a prayer of confession. This chapter opens while he is still praying. It also changes voice. Ezra had told the story of chapter 9 himself (“when I heard this thing,” [[Ezra 9:3]]); from here the account speaks of him in the third person.

  Ezra had come to Jerusalem in 458 B.C. with a commission from Artaxerxes to teach the law, and making the Jews separate from their foreign wives was his first reform there. The chapter dates its steps by the months: the assembly on the twentieth day of the ninth month, the court from the first day of the tenth to the first day of the first month of the next year. The book then ends, abruptly, on a list. The story does not end with it: the book of Nehemiah is its sequel and meets the same marriages again ([[Neh. 13:23–27]]).

thread: |
  The book's last chapter brings its second thread, who belongs to a restored community and on what terms, down to households. The account treats intermarriage with foreigners as the problem that had to be settled before the religious community of Jerusalem could be reconstituted, and the chapter shows it being settled step by step: a confession that becomes a covenant (verses 1–5), a summons with a penalty of being cut off (verses 6–8), an assembly that agrees and asks for time (verses 9–15), a court (verses 16–17), and a record of names (verses 18–44).

  The text does not hide the cost. The people weep before anything is decided, they sit trembling in the rain, four men apparently stand against the measure, and the last words of the book are that some of the men had children by these wives. The chapter's hope is in the first speech: “yet now there is hope in Israel concerning this thing” ([[Ezra 10:2]]), a hope that rests on a people turning back by covenant.

sections:
  - range: 1-5
    heading: Shechaniah proposes a covenant
    plain: |
      While Ezra prayed and confessed, weeping and throwing himself down before the house of God, a very large crowd of Israelites, men, women and children, gathered around him, for the people were weeping bitterly. Then Shechaniah son of Jehiel, of the family of Elam, spoke up and said to Ezra, “We have been unfaithful to our God and have married foreign women from the peoples of the land. Even so, there is still hope for Israel in this matter. So let us make a covenant with our God to send away all these wives and the children born to them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law. Get up, for this matter is your responsibility, and we will stand with you. Be strong and do it.” Then Ezra stood up and made the leading priests, the Levites and all Israel swear that they would do what had been proposed. And they swore it.
  - range: 6-8
    heading: Ezra fasts, and the people are summoned
    plain: |
      Then Ezra left the place before the house of God and went into the room of Johanan son of Eliashib. While he was there he ate no bread and drank no water, for he was mourning over the unfaithfulness of those who had returned from exile. A proclamation was sent throughout Judah and Jerusalem to all the returned exiles to gather at Jerusalem. Anyone who did not come within three days, by the decision of the leaders and elders, would have all his property forfeited, and he himself would be cut off from the assembly of the exiles.
  - range: 9-17
    heading: The assembly in the rain, and the court
    plain: |
      So within three days all the men of Judah and Benjamin gathered at Jerusalem. It was the twentieth day of the ninth month. All the people sat in the open square before the house of God, trembling over this matter and because of the heavy rain. Ezra the priest stood up and said to them, “You have been unfaithful and have married foreign women, adding to Israel's guilt. Now confess to the LORD, the God of your fathers, and do His will: separate yourselves from the peoples of the land and from the foreign wives.” The whole assembly answered with a loud voice, “You are right; we must do as you say. But there are many people, and it is the season of heavy rain; we cannot stand out in the open. Nor can this be done in a day or two, for many of us have sinned in this matter. Let our leaders act for the whole assembly. Let everyone in our towns who has married a foreign wife come at an appointed time, with the elders and judges of each town, until our God's fierce anger over this is turned away from us.” Only Jonathan son of Asahel and Jahaziah son of Tikvah, it seems, stood up against this, supported by Meshullam and Shabbethai the Levite. The returned exiles did as proposed. Ezra the priest and certain heads of families, family by family, all of them by name, were set apart, and on the first day of the tenth month they sat down to examine the cases. By the first day of the first month they had finished with all the men who had married foreign wives.
  - range: 18-24
    heading: The priests and Levites who had married foreign wives
    plain: |
      Among the priests, some were found who had married foreign wives: from the sons of Jeshua son of Jozadak and his brothers, Maaseiah, Eliezer, Jarib and Gedaliah. They pledged with a handshake to send away their wives, and, being guilty, they offered a ram from the flock as a guilt offering. Then come the names of the others: two of the family of Immer, five of Harim, and six of Pashur; then six Levites, one singer, and three gatekeepers.
  - range: 25-44
    heading: The men of Israel who had married foreign wives
    plain: |
      From the rest of Israel come the names, family by family: of Parosh, Elam, Zattu, Bebai, Bani, Pahath-moab, Harim, Hashum, Bani again, and Nebo. All these had married foreign wives, and some of them had wives by whom they had children.

notes:
  - ref: 2
    phrase: yet now there is hope in Israel concerning this thing
    kind: history
    title: Hope in Israel
    body: |
      The answer to Ezra's prayer comes from one man in the crowd. Shechaniah is “one of the sons of Elam,” and he does not accuse others: “We have trespassed against our God” ([[Ezra 10:2]]). His own family is in the list at the end of the chapter, where six of the sons of Elam are named ([[Ezra 10:26]]).

      His hope is not that the sin is small. It is that Israel can still turn: confession becomes a covenant made with God, and Ezra is asked to lead it, “we also will be with thee” ([[Ezra 10:4]]).
    sources: [lds-scriptures]

  - ref: 3
    phrase: according to the counsel of my lord
    kind: words
    title: Whose counsel, Ezra's or the Lord's?
    body: |
      “My lord” is Ezra, addressed with respect, and that is how the King James Version and modern translations such as the NRSVUE read it. The Hebrew vowels, though, give *ʾădōnāy*, the form otherwise used of God; the standard lexicon lists the verse under that form but notes that the reference here is to Ezra.

      The proposal claims authority beyond Shechaniah himself: the counsel of Ezra and of “those that tremble at the commandment of our God,” the same people who had gathered to Ezra in [[Ezra 9:4]]. What “tremble” meant is explained at [[Isa. 66:2]].
    sources: [nrsvue, bdb, oshb-wlc]

  - ref: 3
    phrase: let it be done according to the law
    kind: history
    title: According to the law
    body: |
      The law Shechaniah means is Moses' command that Israel make no marriages with the peoples of the land ([[Deut. 7:3]], the NRSVUE's cross-reference for this verse), explained on the site at [[Deut. 7:3]] and [[Ex. 34:15]]. Its reason, set out in the note on [[Ezra 9:1]], was religious: such marriages led to idolatry and away from Israel's covenants with the Lord. That is the issue in Ezra: covenant and worship.
    sources: [nrsvue, ot-manual-29, sc-knowhy-110]

  - ref: 8
    phrase: all his substance should be forfeited
    kind: words
    title: Forfeited to the temple
    body: |
      “Forfeited” renders a form of the Hebrew *ḥāram*, which here means devoted “to the temple treasures.” The property of a man who ignored the summons went to the treasury of the house of God.

      The second penalty went further: he would be “separated from the congregation of those that had been carried away” ([[Ezra 10:8]]). Whoever would not come and be judged with the community was cut off from it as well as losing his property.
    sources: [bdb, ludlow-ezra-minute]

  - ref: 9
    phrase: trembling because of this matter, and for the great rain
    kind: history
    title: The ninth month and the great rain
    body: |
      The ninth month falls in December, in the cold rainy season, and the people sat in the open square before the temple to hear Ezra. They trembled from cold and wet and from sorrow at once, and the rain shaped what followed: the assembly agreed with Ezra but asked not to be kept standing outside, since the cases could not be settled “a work of one day or two” ([[Ezra 10:13]]). So a court was set up instead, and it sat from the first day of the tenth month to the first day of the first month (verses 16–17), about three months.
    sources: [ot-manual-29, keil-ezra]

  - ref: 15
    phrase: were employed about this matter
    kind: words
    title: Four men who stood against it
    body: |
      The King James “were employed about this matter” sounds as if these men ran the inquiry. The footnote gives the probable sense of the Hebrew, “stood up against this,” and the NIV reads it that way: Jonathan and Jahaziah “opposed this,” supported by Meshullam and Shabbethai the Levite. Verse 15 opens with “only”: if that reading is right, then in an assembly that answered “with a loud voice” (verse 12), these four were the only dissent recorded.

      The text does not say why they objected, whether to the plan itself or to the delay and the court of verse 14, and nothing more is told of them. The next verse shows that they did not prevail: “the children of the captivity did so” ([[Ezra 10:16]]).
    sources: [lds-scriptures, niv]

  - ref: 18
    phrase: among the sons of the priests there were found that had taken strange wives
    kind: history
    title: The priests first
    body: |
      The list begins where the princes said the trespass began, with the leaders ([[Ezra 9:2]]). First come four men “of the sons of Jeshua the son of Jozadak, and his brethren,” the house of the high priest who had returned with Zerubbabel and rebuilt the altar ([[Ezra 3:2]]); they were probably distant cousins of the high priest rather than his own sons. Then come the families of Immer, Harim and Pashur. Together with Jeshua's house these were the priestly families of the first return ([[Ezra 2:36–39]]), so not one of them was free of the transgression.

      The priests also brought something: “a ram of the flock for their trespass” ([[Ezra 10:19]]). That is the offering the law of Moses requires for a trespass against the holy things of the LORD, “a ram without blemish out of the flocks” ([[Lev. 5:15]]). The chapter calls the sin a “trespass” against God (verses 2, 10), and the offering answers it as the law prescribed.
    sources: [keil-ezra, lds-scriptures]

  - ref: 44
    phrase: some of them had wives by whom they had children
    kind: history
    title: The wives and the children
    body: |
      The book of Ezra ends on this sentence, and it is hard both in meaning and in Hebrew. Read as the King James Version reads it, it is a plain statement that some of the marriages had produced children. But the Hebrew is uncertain; the NRSVUE marks it so and, following 1 Esdras, ends the book “and they sent them away with their children,” and the ESV and NIV give that sense in their footnotes. Verse 3 had covenanted to put away “all the wives, and such as are born of them.”

      No source tells what became of these women and children. The list is an odd place to end a book; it leads into Nehemiah, who met the same problem of intermarriage again ([[Neh. 13:23–27]]). Ezra's measure has been judged “decidedly coercive,” one that “appears… only partially carried out,” and “a troubling anomaly in the otherwise effective and inspiring ministry of Ezra”; that is one reader's judgment. The Church's own summary speaks of repentance instead: Ezra counseled the people to repent, and they made a covenant to repent of their sins.
    sources: [nrsvue, esv, niv, ludlow-ezra-minute, welch-religious-authority, scripture-helps-ezra, lds-scriptures]

christ: |
  Shechaniah's hope rests on repentance, and the priests' ram for their trespass was the law's provision for it: “the priest shall make an atonement for him with the ram of the trespass offering, and it shall be forgiven him” ([[Lev. 5:16]]). The law's sacrifices were “every whit pointing to that great and last sacrifice,” the Son of God ([[Alma 34:14]]), whose Atonement is what makes any “hope in Israel” more than a wish. The Lord's test of repentance in this dispensation is the one this chapter shows, that a person will confess his sins and forsake them ([[D&C 58:43]]); and the confession the people make together and the covenant they make with God are still where that hope begins.

