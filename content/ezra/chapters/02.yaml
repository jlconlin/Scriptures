chapter: 2
title: They Sought Their Register
tagline: The first exiles to come home are counted by family, by town and by their office in the temple, and the priests who cannot find their names in the record are told to wait until the Lord can settle their case.
when: 'The first return under Cyrus, about 538 B.C. The same list is given again in Nehemiah 7.'

setting: |
  Chapter 1 ended with Cyrus’s decree and the temple vessels counted out for the journey; chapter 2 counts the people who made it. It is a register of “the children of the province” (verse 1), Judah as it now stood, a district of the Persian empire. The leaders come first (verses 1–2), then the lay families, some named for an ancestor and some for a town (verses 3–35), then the priests, Levites, singers, doorkeepers and temple servants (verses 36–58). Next come the families and priests who could not prove their descent (verses 59–63), and last the totals, the gifts for the house of God and the settling of everyone in their towns (verses 64–70).

  The same list appears again, with variations, in [[Neh. 7:6–73]]. With their servants the company came to about fifty thousand people, and they were the smaller part of the exiles: by far the most chose to stay in Babylonia. The return itself and the Persian kings are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  A restored people has to know who belongs to it, and this chapter answers by the record. The list counts the people by houses, each traced to a father or a hometown, and each family goes back “every one unto his city” (verses 1 and 70), to the town where it had lived before the captivity. Though they came home to Judah, verse 2 counts them as “the people of Israel,” most likely because those who returned stood for the whole covenant people.

  Everyone in the list has a place, from the high priest’s family to the temple’s labourers. Then comes the test, at verses 59–63. Some families could not show “whether they were of Israel,” and some priests could not find their names in the register. In Ezra and Nehemiah, proving one’s descent qualified a man for the priesthood and was part of defining the community that had come home. The governor does not guess: those priests are to wait until a priest with the Urim and Thummim can ask the Lord. The chapter ends with the people giving freely for a house not yet built and settling into their towns.

sections:
  - range: 1-2
    heading: The leaders of the return
    plain: |
      These are the people of the province who came up out of captivity, from among those whom Nebuchadnezzar king of Babylon had carried away to Babylon. They came back to Jerusalem and Judah, each to his own town. They came with Zerubbabel, Jeshua, Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum and Baanah. This is the count of the men of the people of Israel.
  - range: 3-35
    heading: The families and the towns
    plain: |
      The descendants of Parosh, 2,172; of Shephatiah, 372; of Arah, 775; of Pahath-moab, through the lines of Jeshua and Joab, 2,812; of Elam, 1,254; of Zattu, 945; of Zaccai, 760; of Bani, 642; of Bebai, 623; of Azgad, 1,222; of Adonikam, 666; of Bigvai, 2,056; of Adin, 454; of Ater, through Hezekiah, 98; of Bezai, 323; of Jorah, 112; of Hashum, 223; of Gibbar, 95. The people of Bethlehem, 123; the men of Netophah, 56; the men of Anathoth, 128; the people of Azmaveth, 42; of Kirjath-arim, Chephirah and Beeroth, 743; of Ramah and Gaba, 621; the men of Michmas, 122; the men of Bethel and Ai, 223; the people of Nebo, 52; of Magbish, 156; of the other Elam, 1,254; of Harim, 320; of Lod, Hadid and Ono, 725; of Jericho, 345; of Senaah, 3,630.
  - range: 36-58
    heading: Priests, Levites and the servants of the temple
    plain: |
      The priests: the descendants of Jedaiah, of the house of Jeshua, 973; of Immer, 1,052; of Pashur, 1,247; of Harim, 1,017. The Levites: the descendants of Jeshua and Kadmiel, of the line of Hodaviah, 74. The singers: the descendants of Asaph, 128. The doorkeepers: the descendants of Shallum, Ater, Talmon, Akkub, Hatita and Shobai, 139 in all. The temple servants: the descendants of Ziha, Hasupha, Tabbaoth, Keros, Siaha, Padon, Lebanah, Hagabah, Akkub, Hagab, Shalmai, Hanan, Giddel, Gahar, Reaiah, Rezin, Nekoda, Gazzam, Uzza, Paseah, Besai, Asnah, Mehunim, Nephusim, Bakbuk, Hakupha, Harhur, Bazluth, Mehida, Harsha, Barkos, Sisera, Thamah, Neziah and Hatipha. The descendants of Solomon’s servants: of Sotai, Sophereth, Peruda, Jaalah, Darkon, Giddel, Shephatiah, Hattil, Pochereth of Zebaim, and Ami. All the temple servants and the descendants of Solomon’s servants numbered 392.
  - range: 59-63
    heading: Those who could not prove their descent
    plain: |
      These came up from Tel-melah, Tel-harsa, Cherub, Addan and Immer, but they could not show their family or their ancestry, whether they belonged to Israel: the descendants of Delaiah, Tobiah and Nekoda, 652. And among the priests: the descendants of Habaiah, of Koz, and of Barzillai, who had married one of the daughters of Barzillai the Gileadite and was called by their name. They searched for their family record among those registered by genealogy, but it was not found, so they were excluded from the priesthood as unclean. The governor told them not to eat of the most holy food until a priest arose who could consult the Urim and Thummim.
  - range: 64-70
    heading: The whole assembly and its gifts
    plain: |
      The whole assembly together numbered 42,360, besides their 7,337 male and female servants; and they had 200 singing men and singing women. They had 736 horses, 245 mules, 435 camels and 6,720 donkeys. When they came to the house of the LORD in Jerusalem, some of the heads of families gave freewill offerings for the house of God, to rebuild it on its old site. As they were able, they gave to the treasury for the work 61,000 drams of gold, 5,000 pounds of silver, and 100 priests’ garments. So the priests, the Levites, some of the people, the singers, the doorkeepers and the temple servants lived in their towns, and all Israel lived in their towns.

notes:
  - ref: 2
    phrase: 'Which came with Zerubbabel: Jeshua, Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, Baanah'
    kind: history
    title: Zerubbabel, Jeshua and the leaders of the return
    body: |
      The two men at the head of the list would lead the rebuilding of the temple as well as the journey. Zerubbabel was of the royal line of David and governor of Judah ([[Hag. 2:2]]). Jeshua is the high priest whom Haggai and Zechariah call Joshua ([[Hag. 1:1]], where both men are introduced). Moved by those two prophets, they directed the work on the house of the Lord together ([[Hag. 1:12–14]]; [[Zech. 4:9]]).

      The names that follow are less familiar, and one of them can mislead: the Nehemiah of this verse is not the Nehemiah who came to Jerusalem later and became its leader. Nehemiah’s copy of the list has one more name, Nahamani ([[Neh. 7:7]]).
    sources: [ot-manual-29, ludlow-ezra-minute, lds-scriptures]

  - ref: 43
    phrase: The Nethinims
    kind: history
    title: The Nethinims and Solomon’s servants
    body: |
      The temple servants, the Nethinim, close the list of the temple’s staff, and their name says how they came to it. *Nethinim* means “given” or “appointed”: these were men given to the service of the sanctuary, as the Levites had been, of whom the Lord said, “they are wholly given unto him out of the children of Israel” ([[Num. 3:9]]). Ezra later says that David and the princes had appointed them “for the service of the Levites” ([[Ezra 8:20]]). “Solomon’s servants” (verse 55) were probably another group of temple labourers, descended from the Canaanites whom Solomon put to “a tribute of bondservice” ([[1 Kgs. 9:21]]). The two groups are counted together, 392 in all (verse 58).

      The register names the humblest families of the house of God by their ancestors, as it names the priests, and its last verse settles them in their towns beside the priests and Levites (verse 70). The people who came home included those who would work in the temple, down to its labourers.
    sources: [bdb, ot-manual-29, ludlow-ezra-minute, lds-scriptures]

  - ref: 61
    phrase: which took a wife of the daughters of Barzillai the Gileadite, and was called after their name
    kind: history
    title: The sons of Barzillai
    body: |
      One priestly family may have lost its proof through the name it bore. Barzillai the Gileadite was the old man who “provided the king of sustenance” when David fled from Absalom to Mahanaim ([[2 Sam. 19:32]]). A priest married one of his daughters, probably an heiress, and took her family’s name, most likely so that he could take possession of her inheritance (compare the daughters who inherited in [[Num. 27:1–11]]). His descendants still counted themselves “of the children of the priests” when they came home. But a borrowed Gileadite name could cast doubt on a priestly descent, so that it had to be proved from the register, and the search did not find it.

      Another of the three families, Koz (Hakkoz), bore the name of one of the orders of priests, yet a name alone proved nothing, since others bore it too. The register asked for written descent, not reputation.
    sources: [keil-ezra, lds-scriptures]

  - ref: 62
    phrase: as polluted, put from the priesthood
    kind: scripture
    title: The register in a revelation of 1832
    body: |
      Joseph Smith read these verses as a warning to the Saints of his own day. In November 1832 he wrote from Kirtland to William W. Phelps in Independence, Missouri, about Saints who had gathered to Zion but had not consecrated their property and so had received no inheritance; part of the letter is now [[D&C 85]]. Those who did not receive their inheritance by consecration were not to have “their names enrolled with the people of God” ([[D&C 85:3]]), and of priesthood holders “whose names are not found written in the book of the law,” the revelation says: “it shall be done unto them as unto the children of the priest, as will be found recorded in the second chapter and sixty-first and second verses of Ezra” ([[D&C 85:11–12]]).

      The revelation sets the two cases side by side on the record. The priests of Ezra 2 “sought their register… but they were not found” (verse 62) and were put from the priesthood; in Zion, those whose names were not found in the book of the law “shall not find an inheritance among the saints of the Most High” ([[D&C 85:11]]). In the letter itself the Prophet drew the lesson at once: “how careful then had men aught to be what they do in the last days lest they are cut short of their expecttations.”
    sources: [lds-scriptures, jsp-letter-phelps-1832]

  - ref: 63
    phrase: till there stood up a priest with Urim and with Thummim
    kind: history
    title: Waiting for the Urim and Thummim
    body: |
      The governor’s ruling leaves to the Lord a question the record could not answer. In ancient Israel the priesthood passed by lineage, so the priests whose names were missing were set aside “as polluted” (verse 62). The Tirshatha, the Persian title for a provincial governor, here Zerubbabel, forbade them “the most holy things,” the holy food of the offerings that no one outside the priesthood could eat ([[Lev. 22:10]]).

      They were to wait until a priest with the Urim and Thummim, the instrument God prepared for obtaining revelation, which the high priest carried in his breastplate ([[Ex. 28:30]]), could ask the Lord and settle their status. What the register could not show, revelation could decide. The text never says that such a priest stood up. Jewish tradition counted the Urim and Thummim among five things the rebuilt temple lacked, with the ark of the covenant, the visible glory of the Lord, the holy fire on the altar and the spirit of prophecy, and Nehemiah’s copy of the list keeps the same ruling ([[Neh. 7:65]]).

      The rule of lineage belonged to that priesthood. In the Church today no one needs to descend from a particular lineage to hold the priesthood; “their authority is traced not through genealogy but through lines of authority.”

      The theme page [Till There Stood Up a Priest](/ezra/themes/till-there-stood-up-a-priest/) follows this unanswered ruling to Ezra's prayer in chapter 9 and to the priest of Hebrews 7, whose priesthood did not rest on a register.
    sources: [ludlow-ezra-minute, bd-tirshatha, bd-urim-and-thummim, bd-temple-of-zerubbabel, lds-scriptures]

  - ref: 64
    phrase: The whole congregation together was forty and two thousand three hundred and threescore
    kind: history
    title: Forty-two thousand, and a sum that falls short
    body: |
      The total in verse 64 is larger than the parts it sums. The separate figures in this chapter come to 29,818, yet the whole congregation is “forty and two thousand three hundred and threescore.” The same total, 42,360, stands in Nehemiah’s copy of the list ([[Neh. 7:66]]) and in 1 Esdras, in the Apocrypha. Both give separate figures that differ from these, and in both the figures fall short of the total. The cause is not known for certain. One explanation is that in copying so many names and figures, numbers were misread and items dropped, while the total, the same in every copy, was kept.

      The Joseph Smith Translation does not close the gap. It changed seventeen verses of Nehemiah 7 so that the families’ numbers agree with those in Ezra 2, possibly guided by the cross-references in Joseph Smith’s Bible to the parallel account, and the totals of the two lists are the same with or without the changes.

      The notes at [[Isa. 60:22]] (“a little one shall become a thousand”) and [[Isa. 49:20]] set this figure beside Isaiah’s promises of a people grown from a remnant.
    sources: [keil-ezra, nyman-jst-historical, sc-knowhy-786, lds-scriptures]

christ: |
  Zerubbabel, who heads the register, was a descendant of the captive king Jehoiachin and an ancestor of Jesus Christ ([[Matt. 1:12]], where his name is Zorobabel). The governor’s ruling also looked past the record to the Lord: what no register could settle waited for His word (verse 63). In 1832 the Lord spoke again of a record of names, giving inheritances in Zion to the Saints “whose names are found… enrolled in the book of the law of God” ([[D&C 85:7]]), and Latter-day Saints still give time and means to build and maintain His temples, as the heads of families gave “after their ability” (verse 69).

explore: |
  - **The list again.** Read [[Neh. 7:5–73]] beside this chapter.
  - **The record and the inheritance.** Read [[D&C 85:1–12]] with verses 59–63.
  - **Given to the temple.** Read [[Num. 3:5–10]], [[1 Chr. 9:2]] and [[Ezra 8:15–20]].
  - **The Urim and Thummim.** Read [[Ex. 28:30]], [[Num. 27:21]] and [[JS—H 1:35]].

parallels:
  - ref: Neh. 7:6–73
    note: The same register, with variations in the names and numbers.
  - ref: D&C 85:12
    note: The Lord cites verses 61–62 for priesthood holders whose names are not in the book of the law.

