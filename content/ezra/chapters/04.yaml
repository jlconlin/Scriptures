chapter: 4
title: Then Ceased the Work
tagline: Neighbors who claim to worship Israel’s God offer to help build the temple and are refused. They work against the builders through the reign of Cyrus, the chapter adds their later letters against Jerusalem’s walls, and the work on the house stops until Darius.
when: 'Verses 1–5 and 24 run from Cyrus to the second year of Darius I, 520 B.C. Verses 6–23 are letters from the later reigns of Ahasuerus (probably Xerxes) and Artaxerxes I, set here out of order.'

setting: |
  Chapter 3 ended with the foundation of the house laid, to shouting and weeping. Chapter 4 tells what came of it. Neighbors whom the text calls “the adversaries of Judah and Benjamin,” the Samaritans in the Church’s sources, offer to help build, are refused, and spend the rest of Cyrus’s reign working against the builders (verses 1–5). Verse 24 says the work on the house stopped until the second year of Darius. That year was 520 B.C., when the people, urged on by Haggai and Zechariah, took up the work again ([[Ezra 5:1–2]]; [[Hag. 1:1]]).

  Between those verses stand letters from later reigns: an accusation sent to Ahasuerus, probably Xerxes, and an exchange with Artaxerxes I about the city and its walls (verses 6–23). They are set here, out of time order, because they show the same adversaries at work, and verse 24 returns to the point the story had reached at verse 5 (see the note on verse 6). The kings and their dates are in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  With the letter of verse 8 the book changes language. From 4:8 to 6:18 it is written in Aramaic, an official language of the Persian Empire, as Daniel is from [[Dan. 2:4]] to the end of his seventh chapter.

thread: |
  The chapter gathers the opposition into one place. It opens with the returned exiles building the temple (verse 1) and closes with “Then ceased the work of the house of God” (verse 24), and between the two the adversaries try every means: an offer to share the work, discouragement, paid counselors at the Persian court, and, in later reigns, letters to the king. Setting the later letters here gives a “short and comprehensive view of all the hostile acts” against the restored community.

  What finally works is a king’s word. The builders had refused help on the strength of Cyrus’s command (verse 3); a later king’s command stops the walls (verse 21), and his own search of the records turns Jerusalem’s past into the case against it (verses 15, 19–20). The answer comes in the next two chapters, where prophets set the work going again ([[Ezra 5:1–2]]) and another search of the records turns up Cyrus’s decree ([[Ezra 6:1–3]]).

sections:
  - range: 1-3
    heading: The offer refused
    plain: |
      When the enemies of Judah and Benjamin heard that the returned exiles were building a temple to the LORD, the God of Israel, they came to Zerubbabel and the heads of the families and said, Let us build with you, for we worship your God as you do, and we have sacrificed to Him ever since Esarhaddon king of Assyria brought us here. But Zerubbabel, Jeshua, and the other heads of Israel’s families answered, You have no part with us in building a house to our God. We ourselves will build it to the LORD God of Israel, as King Cyrus of Persia commanded us.
  - range: 4-5
    heading: Hindered all the days of Cyrus
    plain: |
      Then the people of the land discouraged the people of Judah and troubled them in their building. They hired advisers to work against them and defeat their plans, all through the reign of Cyrus king of Persia and on until the reign of Darius king of Persia.
  - range: 6-16
    heading: Letters to later kings
    plain: |
      At the beginning of the reign of Ahasuerus they wrote an accusation against the people of Judah and Jerusalem. In the days of Artaxerxes, Bishlam, Mithredath, Tabeel, and their associates wrote to Artaxerxes king of Persia; the letter was written in Aramaic and translated. Rehum the chancellor and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes, in the name of themselves and their associates (Dinaites, Apharsathchites, Tarpelites, Apharsites, Archevites, Babylonians, Susanchites, Dehavites, and Elamites) and the other nations that the great and honored Asnappar deported and settled in the cities of Samaria and in the rest of the province west of the Euphrates.

      This is a copy of the letter: To King Artaxerxes, from your servants west of the river. Let the king know that the Jews who came up from you to us have reached Jerusalem and are rebuilding that rebellious and wicked city. They have set up its walls and joined its foundations. Let the king know that if this city is rebuilt and its walls finished, they will pay no tax, tribute, or duty, and the royal revenue will suffer. Since we are dependent on the palace and it is not right for us to watch the king dishonored, we have sent to inform the king, so that a search may be made in the records of your predecessors. There you will find that this city is rebellious, harmful to kings and provinces, and a place of sedition from long ago, which is why it was destroyed. We tell the king that if this city is rebuilt and its walls finished, you will have nothing left west of the river.
  - range: 17-23
    heading: The king’s answer
    plain: |
      The king sent an answer to Rehum the chancellor, Shimshai the scribe, and their associates living in Samaria and the rest of the province west of the river: Greetings. The letter you sent us has been read plainly before me. At my command a search was made, and it was found that this city has risen against kings from long ago and that rebellion and sedition have been made in it. Powerful kings have also ruled over Jerusalem and over the whole region west of the river, and tax, tribute, and duty were paid to them. So give orders to make these men stop, so that this city is not rebuilt until I give another order. Take care not to neglect this; why should harm grow, to the damage of the kings? As soon as the copy of King Artaxerxes’ letter was read before Rehum, Shimshai the scribe, and their associates, they hurried to the Jews in Jerusalem and stopped them by force.
  - range: 24-24
    heading: The work on the house stops
    plain: |
      Then the work on the house of God in Jerusalem stopped, and it stayed stopped until the second year of the reign of Darius king of Persia.

notes:
  - ref: 2
    phrase: we do sacrifice unto him since the days of Esar-haddon king of Assur, which brought us up hither
    kind: history
    title: Who offered to help, and why they were refused
    body: |
      The neighbors who offered to help were, by their own account, descendants of people an Assyrian king had settled in the land. Esarhaddon ruled Assyria from 681 to 668 B.C., and Second Kings tells how “the king of Assyria brought men from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed them in the cities of Samaria” ([[2 Kgs. 17:24]]). The people of Samaria were afterward “partly Israelite and partly gentile,” and their religion was “of a mixed character.” The narrator of Kings sums up that worship in one line: “They feared the LORD, and served their own gods” ([[2 Kgs. 17:33]]).

      Ezra calls them “adversaries” (verse 1) before they say a word, and the Church’s sources identify them as the Samaritans. Because of their descent and their mixed worship, the Jews did not count them “true worshippers of Jehovah,” and that likely influenced Zerubbabel’s answer. The answer itself gives a narrower reason, the king’s command: “we ourselves together will build unto the LORD God of Israel, as king Cyrus the king of Persia hath commanded us” (verse 3).

      The refusal had a long sequel. The Samaritans became “bitter opponents of the Jews” and in time built a rival temple of their own on Mount Gerizim.
    sources: [lds-scriptures, bd-assyria, bd-samaritans, scripture-helps-ezra]

  - ref: 5
    phrase: hired counsellors against them, to frustrate their purpose
    kind: history
    title: Hindered from Cyrus to Darius
    body: |
      The refusal turned the neighbors from would-be partners into opponents at court. One Latter-day Saint reading takes the “hired counsellors” as Persian officials paid off: the locals “attempted to bribe Persian ministers in order to thwart the plans of the returnees.” Verse 5 gives the span, “all the days of Cyrus king of Persia, even until the reign of Darius,” and verse 24 makes the end exact: the second year of Darius, 520 B.C. By the Student Manual’s count the work on the temple stood still for “fifteen to seventeen years.”

      The opposition was not the whole cause. The building was impeded by “the active opposition and… the intrigues of the Samaritans,” and after years without work “some Jews lost interest in rebuilding the temple.” That second cause is the one Haggai addressed when the people said, “The time is not come” ([[Hag. 1:2]]; see the note there).
    sources: [ludlow-ezra-minute, ot-manual-29, bd-temple-of-zerubbabel, scripture-helps-ezra]

  - ref: 6
    phrase: And in the reign of Ahasuerus, in the beginning of his reign
    kind: history
    title: Letters from later reigns
    body: |
      With verse 6 the chapter jumps forward in time. Verse 5 has carried the story to Darius; verse 6 names Ahasuerus, and verse 7 Artaxerxes, and both reigned after Darius. Ahasuerus here is “probably the same as” the king of Esther, who is “certainly to be identified with Xerxes.” Artaxerxes is Artaxerxes I, called Longimanus, king of Persia from 465 to 425 B.C., who “hinders Jews from building (Ezra 4:7–23).”

      The letters fit those later reigns. They say nothing of the temple. The accusers write that the Jews “have set up the walls thereof, and joined the foundations” of the city (verse 12), and the king orders “that this city be not builded” (verse 21). Verse 24 then repeats verse 5 and adds the year, and so takes up the story where verse 5 left it. What lies between is an “illustrative episode,” and its first words, “in the reign of Ahasuerus,” would have told Ezra’s first readers that it belonged to kings who “reigned not before but after Darius.”

      An older reading made the two names belong to Cambyses and the usurper called Pseudo-Smerdis, who ruled between Cyrus and Darius, and the Bible Chronology’s table pairs them that way. The identification with Xerxes and Artaxerxes I is followed here.
    sources: [bd-ahasuerus, bd-artaxerxes, keil-ezra, bible-chron-ot]

  - ref: 7
    phrase: written in the Syrian tongue, and interpreted in the Syrian tongue
    kind: words
    title: Written in Aramaic
    body: |
      “The Syrian tongue” is Aramaic, “an official language of the Persian Empire,” the language a letter to the Persian king would be written in. The word rendered “interpreted” means “interpret, translate”: the letter was written in Aramaic and translated.

      The verse’s second “in Aramaic” is read in two ways. It may be a marker telling the reader that the text itself now changes to Aramaic, or it may mean the letter was “written in the Aramaic script and set forth in the Aramaic language.” Either way, the change is real. From 4:8 to 6:18 the book itself is in Aramaic, so the letters of these chapters stand in the language in which they were written. Daniel makes the same change of language at [[Dan. 2:4]] (see the note there).
    sources: [bd-aramaic, bdb, esv, ludlow-ezra-minute]

  - ref: 10
    phrase: the great and noble Asnappar
    kind: history
    title: The great and noble Asnappar
    body: |
      Asnappar is probably Ashurbanipal, king of Assyria from 668 to 626 B.C.; on that reading the name is “the Aramaic version of Ashurbanipal.” He was the son of Esarhaddon, the king the neighbors named in verse 2.

      The two verses describe the same people. The Samaritans descended from “foreign colonists placed there by kings of Assyria and Babylonia,” and both verses are evidence for it. In verse 2 they spoke of themselves as worshippers of Israel’s God brought in by Esarhaddon. Writing to the Persian king, they list the nations they come from and the Assyrian who settled them in the cities of Samaria, and they call him “great and noble.”
    sources: [bdb, ot-manual-29, bd-assyria, bd-samaritans]

  - ref: 20
    phrase: There have been mighty kings also over Jerusalem
    kind: history
    title: What the king’s records showed
    body: |
      The king’s search of the records confirmed the accusation and found something more. The records showed that Jerusalem “hath made insurrection against kings” (verse 19). They also showed that “mighty kings” had ruled from Jerusalem over all the land west of the Euphrates, a description that fits David and Solomon most fully. Of Solomon it is written that “he had dominion over all the region on this side the river” ([[1 Kgs. 4:24]]).

      The king’s reply ties that greatness to the accusers’ charge. Those kings had collected “toll, tribute, and custom” from the region (verse 20), the same three payments the accusers said Persia would lose if Jerusalem were rebuilt (verse 13).
    sources: [keil-ezra, lds-scriptures]

  - ref: 21
    phrase: until another commandment shall be given from me
    kind: scripture
    title: Until another commandment
    body: |
      Artaxerxes stopped the building of the city but left room to change his order. The king who stopped it is the same Artaxerxes who gave commissions to Ezra and to Nehemiah, and with Nehemiah the wall comes back into view. Nehemiah heard in Susa that “the wall of Jerusalem also is broken down” ([[Neh. 1:3]]), asked the king to send him to the city “that I may build it” ([[Neh. 2:5]]), and received letters and timber “for the wall of the city” ([[Neh. 2:8]]). He gives the reason the king agreed: “according to the good hand of my God upon me.” Whether those letters were the “another commandment” of verse 21, the text does not say.
    sources: [bd-artaxerxes, lds-scriptures]

christ: |
  The adversaries of this chapter were Samaritans, and the hostility between Jews and Samaritans was still there in Jesus’ day. The Savior “took many opportunities during His ministry to break down cultural barriers between Jews and Samaritans”: He spoke with the woman at the well and stayed in her town ([[John 4:1–42]]), and He sent His apostles to Samaria ([[Acts 1:8]]), where Philip’s preaching found a ready hearing ([[Acts 8:4–25]]). The footnote to verse 21 points to the Lord’s word on a commanded work stopped by enemies: of those who “go with all their might” and are hindered, “it behooveth me to require that work no more at the hands of those sons of men, but to accept of their offerings” ([[D&C 124:49]]). He gave that word “for your consolation” to all who have been hindered in a work He commanded ([[D&C 124:53]]), so the offering of a disciple whose faithful work others stop is accepted.

explore: |
  - [[2 Kgs. 17:24–41]]: how the people of Samaria came to be there, and what their worship was.
  - [[Hag. 1:2–11]]: the people’s own part in the long delay.
  - [[Ezra 5:1–6:12]]: the work started again, a new inquiry to a king, and a search of the records that finds Cyrus’s decree.
  - [[Neh. 1:1–2:8]]: the wall still broken, and the same king’s letters for rebuilding it.
  - [[Dan. 10:2–3]]: Daniel’s three weeks of mourning, which the note there sets beside the opposition of verse 5.
  - [[D&C 124:49–53]]: the Lord’s word on a commanded work hindered by enemies.

