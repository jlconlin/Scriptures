chapter: 3
title: 'The Altar First'
tagline: 'Back in the land, the exiles raise the altar and keep the feast before a stone of the house is laid; the next spring they lay the foundation to David’s songs, and the old men’s weeping mingles with the shout.'
when: 'The first and second years after the return under Cyrus (verses 1, 8).'

setting: |
  Chapter 3 follows straight on from the register of chapter 2, which ends with every family settled “in their cities” ([[Ezra 2:70]]). Verse 1 gives no year for its seventh month, but verse 8 shows it is the year of the return itself, since the foundation is laid in “the second year of their coming.” The chapter has two halves: in the autumn the altar is raised and the sacrifices and the feast of tabernacles are kept again (verses 1–7), and in the second month of the next year the foundation of the house is laid (verses 8–13).

  The two men who lead are Jeshua the priest, the Joshua who is high priest in Haggai and Zechariah, and Zerubbabel, a governor of David’s line; the notes at [[Hag. 1:1]] and [[Zech. 3:1]] say who they were.

  What follows the foundation is a long halt. The people of the land opposed the building (chapter 4), and it was not taken up again until the second year of Darius, 520 B.C., when Haggai and Zechariah urged the people on ([Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers) has the dates). Both prophets look back to this chapter. Haggai asks who is left that saw the first house ([[Hag. 2:3]]), and Zechariah says, “The hands of Zerubbabel have laid the foundation of this house; his hands shall also finish it” ([[Zech. 4:9]]).

thread: |
  Ezra 3 is about worship given back in its old forms. The altar is built “as it is written in the law of Moses” (verse 2); the feast is kept “as it is written” (verse 4); the cedar comes from Lebanon by sea as it did for Solomon (verse 7); the singers stand “after the ordinance of David” (verse 10). Ezra and Nehemiah show temple worship “resumed in continuity with the pre-exilic past,” and this altar is where it begins.

  The order matters too. The altar comes before the house: offerings are made for months while “the foundation of the temple of the LORD was not yet laid” (verse 6). When the foundation is laid, the shout of those who rejoice that the house is begun and the weeping of the older men who had seen the first one rise together, and the chapter ends with two sounds that no one could tell apart.

sections:
  - range: 1-7
    heading: 'The altar and the feast'
    plain: |
      When the seventh month came, and the Israelites were settled in their towns, the people gathered in Jerusalem with one mind. Jeshua son of Jozadak and his fellow priests, and Zerubbabel son of Shealtiel and his kinsmen, set to work and built the altar of the God of Israel, so that burnt offerings could be offered on it as the law of Moses, the man of God, required.

      They set the altar up on its old site, because they were afraid of the peoples around them, and they offered burnt offerings on it to the LORD, morning and evening. They kept the feast of tabernacles as the law prescribes, with the set number of burnt offerings for each day of the feast. After that they offered the regular daily offering, the offerings for the new moons and for all the LORD’s holy feasts, and the freewill offerings that anyone chose to bring. From the first day of the seventh month they offered burnt offerings to the LORD, though the foundation of the temple had not yet been laid.

      They paid the stonemasons and the carpenters, and gave food, drink and oil to the people of Sidon and Tyre to bring cedar from Lebanon by sea to Joppa, under the permission Cyrus king of Persia had given them.
  - range: 8-13
    heading: 'The foundation laid'
    plain: |
      In the second month of the second year after they came to the house of God in Jerusalem, Zerubbabel son of Shealtiel, Jeshua son of Jozadak, the rest of their fellow priests and Levites, and everyone who had come back from captivity began the work. They appointed Levites twenty years old and over to oversee the building of the LORD’s house. Jeshua with his sons and kinsmen, and Kadmiel and his sons, the sons of Judah, stood together to direct the workmen, with the sons of Henadad and their sons and their Levite kinsmen.

      When the builders laid the foundation of the LORD’s temple, the priests stood in their vestments with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise the LORD as David king of Israel had ordained. They sang praise and thanks to the LORD, “For he is good; his mercy toward Israel lasts forever.” All the people raised a great shout of praise, because the foundation of the LORD’s house was laid.

      But many of the priests, Levites and heads of families who were old enough to have seen the first house wept aloud when they saw this foundation laid, while many others shouted for joy. No one could tell the shouts of joy from the sound of the people’s weeping, because the people shouted so loudly that the noise was heard far away.

notes:
  - ref: 1
    phrase: 'when the seventh month was come'
    kind: history
    title: 'The seventh month and the feast'
    body: |
      The people came to Jerusalem at the seventh month because it was the month of the feast of tabernacles, and they meant to keep it at an altar. The law set the feast in this month: “The fifteenth day of this seventh month shall be the feast of tabernacles for seven days unto the LORD” ([[Lev. 23:34]]). Verse 6 says the offerings began on the first day of the month, so the altar was standing two weeks ahead of the feast. Verse 4 adds that the feast was kept “as it is written,” with the burnt offerings counted out day by day as [[Num. 29:12–34]] prescribes, thirteen young bullocks on the first day, twelve on the second, and so on (the note at [[Num. 29:18]] explains “by number”).

      The month also carried a memory. Solomon had dedicated the first temple at this feast: “all the men of Israel assembled themselves unto king Solomon at the feast in the month Ethanim, which is the seventh month” ([[1 Kgs. 8:2]]). By keeping the same feast at the first altar on the ruined site, the returned exiles seem to have been tying the house they meant to build to the one that had been lost.
    sources: [ludlow-ezra-minute, lds-scriptures]

  - ref: 2
    phrase: 'as it is written in the law of Moses the man of God'
    kind: history
    title: 'The altar before the house'
    body: |
      The first thing the returned exiles built was the altar, not the temple, and the text stresses that they built it by the book: it was for burnt offerings “as it is written in the law of Moses,” whose law of the burnt offering opens Leviticus ([[Lev. 1]]). Raising an altar first in a new place is an old pattern in scripture: Abraham, Jacob and Lehi each did it ([[Gen. 13:4]]; [[Gen. 35:7]]; [[1 Ne. 2:7]]). The men who raised this one were the priest and the prince, Jeshua and Zerubbabel, whose standing reached back to the authority of the days before the exile.

      “As it is written in the law of Moses” is one of the ways the book shows that this worship was not new. Its writers are careful to present every act in the restored worship as “a recovery of past practices, not solely an invention of their own.” Verse 6 says what was still missing: “the foundation of the temple of the LORD was not yet laid.” The altar stood without a house for months, and, once the work had stopped (chapter 4), for years. When Haggai came, the people were saying, “The time is not come, the time that the LORD’s house should be built” ([[Hag. 1:2]]); the note there tells how an altar without a house became easy to live with.
    sources: [ludlow-ezra-minute, welch-religious-authority, lds-scriptures]

  - ref: 3
    phrase: 'for fear was upon them because of the people of those countries'
    kind: history
    title: 'An altar for protection'
    body: |
      Verse 3 sets the building of the altar beside the exiles’ fear of the peoples around them, and their first sacrifices seem to have been in part a petition to God to guard them from their neighbours. Conflict between those who came back and those who were already in the land runs through Ezra and Nehemiah, and it comes into the open in the next chapter, when “the people of the land weakened the hands of the people of Judah” ([[Ezra 4:4]]).

      “Upon his bases” uses a Hebrew word for a fixed resting place or base. They set the altar back on the site where the temple had stood, and the temple that followed was built there too, “on the ancient site.”
    sources: [ludlow-ezra-minute, bdb, ot-manual-29, bd-temple-of-zerubbabel]

  - ref: 7
    phrase: 'to bring cedar trees from Lebanon to the sea of Joppa'
    kind: scripture
    title: 'Cedar by sea, as for Solomon'
    body: |
      The arrangements of verse 7 repeat the ones Solomon made for the first temple. Then too the cedar came from Lebanon by way of the Phoenicians of Tyre and Sidon, floated down the coast: “we will bring it to thee in floats by sea to Joppa; and thou shalt carry it up to Jerusalem” ([[2 Chr. 2:16]]). Then too it was paid for in food and oil: “Solomon gave Hiram twenty thousand measures of wheat for food to his household, and twenty measures of pure oil” ([[1 Kgs. 5:11]]). Ezra’s builders gave “meat, and drink, and oil.” The second house can reasonably be taken to have been, “so far as circumstances permitted,” a reproduction of Solomon’s, and its cedar was brought the way his had been.
    sources: [bd-temple-of-zerubbabel, lds-scriptures]

  - ref: 10
    phrase: 'after the ordinance of David king of Israel'
    kind: history
    title: 'After the ordinance of David'
    body: |
      The foundation was laid with the worship David had ordered for the house of God, and the chapter shows it in three ways. The Levites who oversaw the work were appointed “from twenty years old and upward” (verse 8), the age at which “by the last words of David the Levites were numbered” ([[1 Chr. 23:27]]). The sons of Asaph with their cymbals were the singers David had set apart to “prophesy with harps, with psalteries, and with cymbals” ([[1 Chr. 25:1]]). And the priests stood “in their apparel,” their robes of office, with trumpets, as they had at the dedication of Solomon’s temple. There Asaph’s singers with cymbals and “an hundred and twenty priests sounding with trumpets” ([[2 Chr. 5:12]]) sang the words this chapter records, “For he is good; for his mercy endureth for ever” ([[2 Chr. 5:13]]). The note at [[Ps. 136:1]] follows that refrain through the Old Testament.

      “They sang together by course” (verse 11) means they sang in turn, two choirs, or a choir and a soloist, answering each other, in the custom David established ([[1 Chr. 25]]). The great shout of the people in verse 11 was likely something like the Hosanna Shout given at the Church’s solemn assemblies.
    sources: [lds-scriptures, keil-ezra, ot-manual-29]

  - ref: 12
    phrase: 'wept with a loud voice; and many shouted aloud for joy'
    kind: history
    title: 'Weeping and shouting'
    body: |
      The older priests, Levites and heads of families who wept were those who had seen the first house, and they may have wept because the new temple would not be as grand as the first. Josephus’s later account gives the same reason at more length: they recalled “how much greater and more sumptuous the old temple had been” and saw the new one poorer “on account of their poverty,” while the people at large, allowed at last to build, “desired no more.”

      Ezra’s own detail is verse 13. It does not say that the rejoicing drowned out the weeping. The weeping and the joy rose among the people together, and the shout was so loud that no one could tell one sound from the other, “and the noise was heard afar off.” Some of them were still living years later, when Haggai asked, “Who is left among you that saw this house in her first glory? and how do ye see it now? is it not in your eyes in comparison of it as nothing?” ([[Hag. 2:3]]). The Lord’s answer follows in [[Hag. 2:4–9]].
    sources: [josephus-antiquities, scripture-helps-ezra, keil-ezra, lds-scriptures]

christ: |
  Ezra 3 begins at an altar, and the offerings made on it were, as an angel told Adam, “a similitude of the sacrifice of the Only Begotten of the Father” ([[Moses 5:7]]). When Christ spoke to the Nephites out of the darkness He ended those offerings, “your sacrifices and your burnt offerings shall be done away,” and asked instead for “a broken heart and a contrite spirit” ([[3 Ne. 9:19–20]]). Latter-day temples keep altars as places where covenants are made, and the sacrifice brought to them now is that broken heart and contrite spirit, in remembrance of His atoning sacrifice.

explore: |
  - [[Hag. 1:1–11]]: the altar without the house, years later, and the prophet who would not let it stand that way.
  - [[Hag. 2:1–9]]: the Lord’s answer to those who had seen the first house.
  - [[Zech. 4:6–10]]: Zerubbabel’s hands, which laid this foundation, will finish the house.
  - [[1 Kgs. 8:1–11]] and [[2 Chr. 5:11–14]]: the first temple dedicated at the same feast, with the same trumpets, cymbals and song.
  - [Temple and Worship](/old-testament/guides/temple-and-worship/): the first and second temples.

sources: [keil-ezra, ludlow-ezra-minute, bdb, bd-temple-of-zerubbabel, welch-religious-authority, ot-manual-29, josephus-antiquities, scripture-helps-ezra, lds-scriptures]
