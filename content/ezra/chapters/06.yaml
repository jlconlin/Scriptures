chapter: 6
title: The House Finished
tagline: Darius finds Cyrus's decree in a fortress in Media, confirms it, and pays for the work. Through the prophesying of Haggai and Zechariah the house is finished, dedicated, and opened with a Passover, “for the LORD had made them joyful.”
when: 'From the second year of Darius I to the sixth, when the temple was finished (verse 15), 516 or 515 B.C.'

setting: |
  Chapter 5 ended with a question sent to the king. Tatnai, the Persian governor west of the Euphrates, had found the Jews building again at the word of Haggai and Zechariah, and wrote to Darius asking whether Cyrus had ever really ordered it ([[Ezra 5:3–17]]). This Darius is the son of Hystaspes, the king of Haggai and Zechariah's dated prophecies. Chapter 6 is his answer and what followed from it: the old decree found and renewed, the house finished, dedicated and put to use.

  The chapter closes the first half of the book, the house rebuilt (chapters 1–6). It also closes the long Aramaic section: the letters and the narrative around them, from [[Ezra 4:8]] through 6:18, are written in Aramaic, an official language of the Persian Empire, and the Hebrew returns at verse 19 with the Passover. The house was finished in Darius's sixth year, 516 B.C. by the Bible Dictionary's count and 515 by *Scripture Helps*'; the reigns are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers). About sixty years later, Ezra himself appears in [[Ezra 7]].

thread: |
  Chapter 6 completes the first of the book's two threads: the Lord moves kings to restore what was lost. Tatnai's inquiry could have stopped the work; instead Darius's search turns up the very decree the Jews had claimed (5:13; 6:3), and the king not only lets the work go on but pays for it, threatens anyone who hinders it, and asks the Jews to pray for him. Verse 14 sets “the commandment of the God of Israel” before the commands of the kings, and the last verse says plainly who moved the king: “the LORD had made them joyful, and turned the heart of the king” (verse 22). The book reads its history this way throughout, as the hand of God “working behind the scenes.”

  The second half of the chapter belongs to the people. The finished house is dedicated with joy, with a sin offering for all twelve tribes; its priests and Levites are set to their service “as it is written in the book of Moses”; and the first Passover gathers those who came back from captivity together with all who “separated themselves” to seek the LORD (verse 21). The restored community worships as Moses wrote, and it is defined by who comes to that table, a question the book takes up again in [[Ezra 9]] and [[Ezra 10]].

sections:
  - range: 1-5
    heading: Cyrus's decree is found
    plain: |
      King Darius gave an order, and a search was made in Babylon in the archives where the treasures were stored. A scroll was found at Ecbatana, in the fortress in the province of Media, and this was the record written in it: In his first year King Cyrus made a decree about the house of God in Jerusalem. Let the house be built as a place where sacrifices are offered, and let its foundations be firmly laid. Its height shall be sixty cubits and its width sixty cubits, with three courses of large stones and one course of new timber, and the cost shall be paid from the king's treasury. And the gold and silver vessels of the house of God, which Nebuchadnezzar took from the temple in Jerusalem and carried to Babylon, shall be returned and brought back to the temple in Jerusalem, each to its place, and you shall put them in the house of God.
  - range: 6-12
    heading: Darius renews the decree
    plain: |
      So now, Tatnai, governor of the province west of the river, Shethar-boznai, and your colleagues the officials of that province: keep away from there. Leave the work on this house of God alone. Let the governor of the Jews and the Jewish elders build this house of God on its site. I also decree what you are to do for these Jewish elders as they build: their costs are to be paid in full and without delay from the royal revenue, the tribute of the province west of the river, so that the work is not stopped. Whatever they need (young bulls, rams and lambs for burnt offerings to the God of heaven, and wheat, salt, wine and oil, as the priests in Jerusalem require) is to be given them every day without fail, so that they may offer sacrifices pleasing to the God of heaven and pray for the life of the king and his sons. I further decree that if anyone alters this order, a beam is to be pulled from his house and he is to be hanged on it, and his house made a dunghill. May the God who has caused His name to dwell there overthrow any king or people who reaches out a hand to alter this or to destroy this house of God in Jerusalem. I, Darius, have made the decree; let it be carried out with all speed.
  - range: 13-15
    heading: The house is finished
    plain: |
      Then Tatnai, the governor west of the river, Shethar-boznai and their colleagues did exactly and promptly as King Darius had ordered. And the Jewish elders built and prospered through the prophesying of Haggai the prophet and Zechariah the son of Iddo. They built and finished it by the command of the God of Israel and by the decree of Cyrus, Darius, and Artaxerxes king of Persia. The house was finished on the third day of the month Adar, in the sixth year of King Darius's reign.
  - range: 16-18
    heading: The dedication
    plain: |
      The people of Israel, the priests, the Levites and the rest of the returned exiles celebrated the dedication of this house of God with joy. For the dedication they offered a hundred bulls, two hundred rams and four hundred lambs, and as a sin offering for all Israel twelve male goats, one for each tribe of Israel. And they appointed the priests in their divisions and the Levites in their groups for the service of God in Jerusalem, as it is written in the book of Moses.
  - range: 19-22
    heading: The Passover
    plain: |
      The returned exiles kept the Passover on the fourteenth day of the first month. The priests and the Levites had purified themselves together; all of them were clean, and they slaughtered the Passover lamb for all the returned exiles, for their fellow priests, and for themselves. The Israelites who had come back from exile ate it, together with everyone who had separated himself from the uncleanness of the nations of the land and joined them to seek the LORD, the God of Israel. For seven days they kept the Feast of Unleavened Bread with joy, because the LORD had made them joyful and had turned the heart of the king of Assyria toward them, so that he helped them in the work on the house of God, the God of Israel.

notes:
  - ref: 2
    phrase: there was found at Achmetha, in the palace that is in the province of the Medes
    kind: history
    title: Found at Ecbatana, not Babylon
    body: |
      The decree turned up far from where Tatnai had told the king to look. His letter asked for a search “in the king's treasure house, which is there at Babylon” ([[Ezra 5:17]]), and the search began there (verse 1), but the scroll was found at Achmetha: Ecbatana, the old capital of the Medes, modern Hamadan. Darius had the archives searched for any earlier order about Jerusalem and its temple, and found one in another city.

      The record had to be found because it had been forgotten. Cyrus had died, Cambyses had followed him, and over the years his edict was forgotten altogether. The Jews' elders had told Tatnai that Cyrus himself commanded the house ([[Ezra 5:13]]), and now a Persian archive bore them out, in the words of verses 3–5. The decree that Tatnai's letter put in doubt is what Darius renews.
    sources: [bd-assyria, vandyke-ogden-twelve, ludlow-ezra-minute]

  - ref: 3
    phrase: the height thereof threescore cubits, and the breadth thereof threescore cubits
    kind: history
    title: Sixty cubits
    body: |
      The decree sets the height and breadth of the house at sixty cubits each and says nothing of its length. Solomon's house had been sixty cubits long, twenty broad and thirty high ([[1 Kgs. 6:2]]). Beyond the figures the Persian decrees prescribed, and the king's payment for the materials (verses 4 and 8), few definite statements survive about the dimensions of the house actually built. It was most likely about the same size as Solomon's temple, with a similar layout.

      What the book itself stresses is likeness rather than size. The elders describe the work as rebuilding “the house that was builded these many years ago, which a great king of Israel builded” ([[Ezra 5:11]]): the new house is raised in the likeness of Solomon's, part of the recovery of the old worship that verse 18 names.
    sources: [lds-scriptures, bd-temple-of-zerubbabel, scripture-helps-ezra, welch-religious-authority]

  - ref: 10
    phrase: pray for the life of the king, and of his sons
    kind: history
    title: Prayers for the king
    body: |
      Darius pays for the sacrifices out of the province's tribute (verses 8–9), and verse 10 says what he wanted in return: offerings pleasing to “the God of heaven,” and prayers for himself and his sons. Darius recognized the role of God in human affairs, and he probably thought the god he himself worshiped also wanted the temple in Judah rebuilt; the decrees of one Persian king were also often honored by the next. Like Cyrus before him ([[Ezra 1:2]]), he called the God of the Jews the God of heaven and wanted that God's blessing on himself and his dynasty, an acknowledgment a Persian king could make without renouncing his other gods.

      For the Jews the request was no compromise. The exiles had been told to seek the peace of the city where they were carried captive, “and pray unto the LORD for it” ([[Jer. 29:7]]), and they could pray in the Lord's house for the king under whom God had set them. The verse shows a foreign king paying for Israel's worship and asking to be remembered in it.
    sources: [ot-manual-29, keil-ezra, lds-scriptures]

  - ref: 14
    phrase: they prospered through the prophesying of Haggai the prophet and Zechariah the son of Iddo
    kind: scripture
    title: Through the prophesying of Haggai and Zechariah
    body: |
      Verse 14 credits the success of the building to two prophets before it credits any king. The work had stalled for years under poverty, failed harvests, the change of kings and the hostility of neighbors, and under those circumstances the Lord raised up Haggai and Zechariah to spur on a discouraged people. Their words are in their own books: Haggai's rebuke and promise, “I am with you” ([[Hag. 1:13]]), and Zechariah's word to the governor, “The hands of Zerubbabel have laid the foundation of this house; his hands shall also finish it” ([[Zech. 4:9]]).

      Here the promise is kept. The elders built under the prophets' encouragement until the house was finished in Darius's sixth year (verse 15). The prophets succeeded, and the second temple stood.
    sources: [vandyke-ogden-twelve, ludlow-ezra-minute, lds-scriptures]

  - ref: 14
    phrase: and Artaxerxes king of Persia
    kind: history
    title: Artaxerxes among the builders
    body: |
      Artaxerxes is named with Cyrus and Darius, though he reigned long after the house was finished (465–425 B.C.). He is the king who hindered the Jews from building in [[Ezra 4:7–23]] and who later commissioned Ezra, and this verse belongs with that commission. His letter to Ezra provided for the house of God and its offerings ([[Ezra 7:15–20]]), and Ezra blessed the Lord for putting it in the king's heart “to beautify the house of the LORD which is in Jerusalem” ([[Ezra 7:27]]).

      Before all three kings the verse sets “the commandment of the God of Israel.”
    sources: [bd-artaxerxes, lds-scriptures]

  - ref: 15
    phrase: this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king
    kind: history
    title: Finished in the sixth year of Darius
    body: |
      Adar is the twelfth month ([[Esth. 3:7]]), so the house was finished at the close of Darius's sixth year: 516 B.C. in the Bible Dictionary's reckoning, 515 in *Scripture Helps*' and some others'. That was more than twenty years after the first exiles came home; Haggai had first spoken in Darius's second year ([[Hag. 1:1]]; [[Ezra 4:24]]).

      The Student Manual counts from the other end: the second temple was completed in 516 B.C., “exactly seventy years after the temple was destroyed by Nebuchadnezzar in 586 B.C.,” and so it reads the finished house as a fulfillment of Jeremiah's seventy years. That count is the manual's; how the site reckons the seventy years is at [[Jer. 29:10]].
    sources: [lds-scriptures, bd-temple-of-zerubbabel, scripture-helps-ezra, vandyke-ogden-twelve, ot-manual-29]

  - ref: 17
    phrase: twelve he goats, according to the number of the tribes of Israel
    kind: symbol
    title: Twelve goats for twelve tribes
    body: |
      Those who rose up to return were “the chief of the fathers of Judah and Benjamin” ([[Ezra 1:5]]), with priests and Levites, yet the sin offering at the dedication was for “all Israel,” one goat for each of the twelve tribes. The likeliest reason is that the temple was meant for the whole covenant people, whose return to the Lord and to the land the prophets had given them to hope for ([[Ezek. 37:15–22]]; [[Jer. 31:27]]). The small community dedicated the house in the name of the whole people of the covenant.

      The burnt offerings were counted in hundreds; the sin offering was counted by tribes, and so claimed the house for Israel entire.
    sources: [keil-ezra, lds-scriptures]

  - ref: 18
    phrase: as it is written in the book of Moses
    kind: scripture
    title: As it is written in the book of Moses
    body: |
      The priests and Levites were set to their service “as it is written in the book of Moses.” The phrase is one of the ways the book shows the new house's worship as a recovery of past practice, “not solely an invention of their own.”

      That concern runs through Ezra. The altar was rebuilt “as it is written in the law of Moses” ([[Ezra 3:2]]), and Ezra himself is “a ready scribe in the law of Moses” ([[Ezra 7:6]]). Every act of restored worship is presented as a recovery of past practice, and Moses stands behind the whole of it. The returned exiles had lost their king and their independence; what gave their worship its authority was continuity with what God had given before.
    sources: [lds-scriptures, welch-religious-authority]

  - ref: 21
    phrase: all such as had separated themselves unto them from the filthiness of the heathen of the land
    kind: history
    title: Those who had separated themselves
    body: |
      The Passover was not only for those who had come back from Babylon. With them ate “all such as had separated themselves unto them” to seek the LORD God of Israel. The text names them only by what they did: they left the uncleanness of the peoples of the land and joined the returned community. Older interpreters divided over who they were. Some took them for converts from the nations; others read them as Israelites who had never been carried away, who had lived on in the land mingled with its peoples, and who now joined the new community to worship the God of their fathers in His temple by the law of Moses.

      What the verse does settle are the terms of belonging: separation and seeking the LORD. The same word returns in [[Ezra 9:1]] and [[Ezra 10:11]], where separating from the peoples of the land means giving up intermarriage and other ties with them.
    sources: [keil-ezra]

  - ref: 22
    phrase: turned the heart of the king of Assyria unto them
    kind: history
    title: The king of Assyria
    body: |
      “The king of Assyria” is the Persian king, Darius, king of what had once been Assyrian territory. When Cyrus took Babylon he entered on the whole inheritance of its empire, and Darius ruled it after him.

      The verse names plainly who stood behind Darius's decree, as verse 14 had in setting “the commandment of the God of Israel” before the kings': the LORD had made them joyful by turning the king's heart. The book began the same way, “the LORD stirred up the spirit of Cyrus” ([[Ezra 1:1]]), and it teaches its readers to see God's protective hand behind Cyrus's proclamation as behind Darius's. The first half of the book ends where it began.
    sources: [ot-manual-29, bd-assyria, welch-religious-authority]

christ: |
  The house is finished, and the first feast kept in it is the Passover, the feast of the lamb whose blood marked Israel's houses in Egypt ([[Ex. 12:13]]). Paul names that lamb: “Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]). The returned exiles found joy at the dedication and at the Passover, “for the LORD had made them joyful” (verses 16, 22), and scripture ties that joy to the Lord's house from David's day ([[1 Chr. 29:17]]). Prophets still direct the building of temples, and a disciple who enters the Lord's presence there “can receive a ‘fullness of joy.’”

