chapter: 1
title: The LORD Stirred Up the Spirit of Cyrus
tagline: In his first year over Babylon the Persian king sends the Jews home to build the LORD’s house, the exiles whose spirits God has stirred set out, and the temple’s vessels go back with them, counted one by one.
when: 'The first year of Cyrus king of Persia (verse 1), about 538 B.C.'

setting: |
  Ezra begins where Chronicles ends. Its first two and a half verses are also the last words of [[2 Chr. 36:22–23]], so that the record that closes the history of Judah’s fall is carried over to open the history of its restoration; that is why the book begins with “Now” (in Hebrew, “And”). Ezra and Nehemiah were once a single book, and they may have been written as a sequel to Chronicles.

  The Babylonians had taken Judah in 597 B.C. and carried thousands into exile, and in 539 B.C. Babylon itself fell to Cyrus, the first king of the Persian empire. About a year later he issued the decree that opens this chapter. The rulers and dates of the whole period are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  The book has two parts. Chapters 1–6 follow the first return and the rebuilding of the temple against heavy opposition; chapters 7–10 follow Ezra himself, who came some sixty years after the temple was dedicated. This chapter opens the first part in three steps: the decree (verses 1–4), the people who answered it and the gifts they were given (verses 5–6), and the temple vessels counted out for the journey (verses 7–11).

thread: |
  Ezra 1 carries the first of the book’s two threads: the LORD moves kings and people to restore what was lost. The chapter uses one verb for both. The LORD “stirred up” the spirit of Cyrus (verse 1), and those who went were “all them whose spirit God had raised” (verse 5); in Hebrew both are *hēʿîr*, and Ezra uses the verb nowhere else. The Lord rouses the king to send and the people to go, and between the two the decree asks everyone else to give.

  Behind it all stands an old promise. The verse opens “that the word of the LORD by the mouth of Jeremiah might be fulfilled,” and Cyrus’s acts fulfilled what Isaiah and Jeremiah had foretold. The chapter ends with the proof in hand: the vessels Nebuchadnezzar carried off come back, counted out to the prince of Judah.

sections:
  - range: 1-4
    heading: The decree of Cyrus
    plain: |
      In the first year of Cyrus king of Persia, so that the word the LORD had spoken through Jeremiah would be fulfilled, the LORD moved the spirit of Cyrus, and he sent a proclamation through his whole kingdom and also put it in writing: “This is what Cyrus king of Persia says: The LORD, the God of heaven, has given me all the kingdoms of the earth, and He has charged me to build Him a house at Jerusalem in Judah. Whoever among you belongs to His people, may his God be with him. Let him go up to Jerusalem in Judah and build the house of the LORD, the God of Israel; He is the God who is in Jerusalem. And every survivor, wherever he is living, is to be helped by the people of his place with silver, gold, goods and animals, besides the freewill offerings for the house of God in Jerusalem.”
  - range: 5-6
    heading: Those whose spirit God had raised
    plain: |
      Then the heads of the families of Judah and Benjamin set out, with the priests and the Levites, everyone whose spirit God had stirred to go up and build the LORD’s house in Jerusalem. All the people around them helped them with silver vessels, gold, goods, animals and precious things, besides everything that was given as a freewill offering.
  - range: 7-11
    heading: The vessels go home
    plain: |
      King Cyrus also brought out the vessels of the LORD’s house that Nebuchadnezzar had taken from Jerusalem and placed in the house of his gods. Cyrus king of Persia had Mithredath the treasurer bring them out, and he counted them out to Sheshbazzar, the prince of Judah. This was the count: thirty gold dishes, a thousand silver dishes, twenty-nine knives, thirty gold basins, four hundred and ten silver basins of a second kind, and a thousand other vessels. The vessels of gold and silver came to five thousand four hundred in all. Sheshbazzar brought them all up when the exiles were brought up from Babylon to Jerusalem.

notes:
  - ref: 1
    phrase: the LORD stirred up the spirit of Cyrus king of Persia
    kind: history
    title: Why a Persian king sent them home
    body: |
      Ezra gives the reason for the decree before he gives the decree: the LORD moved Cyrus, so that the word spoken through Jeremiah would be fulfilled. The verse alludes to Jeremiah’s prophecy that the exile would last seventy years and end when Babylon was punished ([[Jer. 25:11–12]]); the note on [[Jer. 29:10]] counts the years. Cyrus says the same in his own voice in verse 2: the LORD God of heaven gave him his kingdoms and charged him to build the house. Isaiah had named him as the one who would say to Jerusalem, “Thou shalt be built” ([[Isa. 44:28]]).

      How a Persian king came to say this, Ezra does not explain, and other answers stand beside his. Josephus tells that Cyrus learned of his task “by his reading the book which Isaiah left behind him” and that, admiring the divine power, he wanted to fulfil what was written; this is a later tradition, not part of Ezra’s account. A more ordinary motive has been suggested as well: Cyrus may have let the Jews go “as a token of gratitude for assistance given to him in his conquest.” And the permission was not for the Jews alone. Cyrus’s own record, the Cyrus Cylinder, extended it to other nations, letting them worship their own gods and rebuild their own temples (the notes on [[Isa. 45:1]] and [[Isa. 41:25]] set it beside Isaiah). Whatever moved Cyrus on his side, Ezra’s claim is about the other side: the LORD stirred him up.
    sources: [ludlow-ezra-minute, josephus-antiquities, bd-cyrus]

  - ref: 4
    phrase: whosoever remaineth in any place where he sojourneth
    kind: words
    title: Who helps whom
    body: |
      Verse 4 can be read in two ways, and the difference is who pays. “Whosoever remaineth” translates *hanniš’ār*, a participle of the verb “remain, be left over”; with the article it means “the survivors,” and it can be a technical term for the remnant, as in [[Isa. 4:3]].

      Read with the English sense of staying behind, the verse asks the Jews who choose to remain in Babylon to support those who go, with silver, gold, goods and animals alongside their freewill offerings for the temple. On this reading the project depended particularly on the support of those who stayed. Read with the Hebrew sense of “survivor,” the phrase means every surviving exile, wherever he lives, and the king commands “the men of his place,” the people he lives among, to help him on his way.

      On either reading the decree did more than permit a journey. It provided for one, and verse 6 reports that the provision was made.
    sources: [oshb-wlc, bdb, ludlow-ezra-minute]

  - ref: 5
    phrase: with all them whose spirit God had raised
    kind: history
    title: Not everyone went
    body: |
      Cyrus’s invitation went to all the LORD’s people (verse 3), but only some went: the heads of the families of Judah and Benjamin, the priests and the Levites, and, as the verse sums them up, “all them whose spirit God had raised.” “Raised” is the same Hebrew verb as “stirred up” in verse 1 (*hēʿîr*). The Lord who moved the king to send also moved the people who would go.

      The rest stayed. In Josephus’s words, “Yet did many of them stay at Babylon; as not willing to leave their possessions.” Those who stayed sent silver, gold, animals and other offerings toward the temple instead. How many did go is counted in [[Ezra 2:64–65]]. When the work later stalled, Haggai used the same words for the Lord’s stirring up the spirits of Zerubbabel and the people to build again; the note on [[Hag. 1:14]] explains the phrase.
    sources: [oshb-wlc, josephus-antiquities, ludlow-ezra-minute]

  - ref: 8
    phrase: Sheshbazzar, the prince of Judah
    kind: history
    title: Who was Sheshbazzar?
    body: |
      Sheshbazzar receives the vessels here and brings the exiles up (verse 11), and he is later remembered as the governor Cyrus appointed and the man who laid the temple’s foundation ([[Ezra 5:14–16]]). Yet the list of those who returned names Zerubbabel and not him ([[Ezra 2:2]]), and in Haggai Zerubbabel is the governor ([[Hag. 2:2]]). So readers have asked whether the two are one man.

      Sheshbazzar may be Zerubbabel’s Persian name. Yet 1 Esdras, in the Apocrypha, treats them as two people, and “the evidence seems to favor the idea of two separate persons,” both of Judah’s royal line and both probably appointed by Cyrus; Zerubbabel may be the better remembered because he outlived the older Sheshbazzar. Both names also appear in chapter 5, Zerubbabel at the rebuilding ([[Ezra 5:2]]) and Sheshbazzar in the elders’ account of the first foundation ([[Ezra 5:14–16]]), and there the text does not seem to support making them one man. Two persons is the likelier reading, and it is the one the guide [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers) follows. Zerubbabel himself is introduced at [[Hag. 1:1]].
    sources: [bd-zerubbabel, ot-manual-29, ludlow-ezra-minute]

  - ref: 11
    phrase: All the vessels of gold and of silver were five thousand and four hundred
    kind: history
    title: Five thousand four hundred
    body: |
      The total does not match the list. The items in verses 9–10 add up to 2,499 (30 + 1,000 + 29 + 30 + 410 + 1,000), not 5,400, and the Greek translation has the same figures. An old explanation held that the list names only the larger and more valuable vessels while the total counts large and small together, but that is “evidently arbitrary”: verse 11 plainly means to sum what came before. More probably the difference comes from an error somewhere in the numbers, which there is no longer any means to correct; it may lie in the total, which may once have read 2,500. Whatever the right figure, the list shows “not only specificity but also generosity.”

      The vessels’ journey is followed across the site. Nebuchadnezzar took them to his god’s house ([[Dan. 1:2]]), Belshazzar drank from them on the night Babylon fell ([[Dan. 5:2–4]]), and Jeremiah had said they would stay in Babylon “until the day that I visit them” ([[Jer. 27:22]]), the verse the Church’s footnote sets beside verse 7. The note on [[Isa. 52:11]] follows them home.
    sources: [keil-ezra, ludlow-ezra-minute, lds-scriptures]

christ: |
  The LORD who stirred up the spirit of Cyrus and kept the word He had given through Jeremiah is Jehovah, and “Jehovah is the premortal Jesus Christ.” This chapter’s first verse is a witness that “the promises of the Lord through His prophets shall all be fulfilled,” and in this dispensation He has said the same of His word: “my word shall not pass away, but shall all be fulfilled” ([[D&C 1:38]]).

  Speaking of Cyrus, President Ezra Taft Benson taught that “God, the Father of us all, uses the men of the earth, especially good men, to accomplish his purposes. It has been true in the past, it is true today, it will be true in the future.” The Lord still uses the people of the earth to accomplish His purposes, and His promises given through prophets are kept now as surely as Jeremiah’s was kept in the first year of Cyrus.

explore: |
  - **Cyrus named in advance.** Read [[Isa. 44:24–45:13]] beside this chapter; the notes on [[Isa. 45:1]] and [[Isa. 41:25]] set the Cyrus Cylinder beside Isaiah.
  - **The seventy years.** [[Jer. 25:11–12]]; [[Jer. 29:10]]; [[2 Chr. 36:20–23]]; [[Dan. 9:2]].
  - **The vessels, from Jerusalem to Babylon and back.** [[Jer. 27:16–22]]; [[Dan. 1:1–2]]; [[Dan. 5:1–4]]; [[Ezra 5:14–15]]; [[Ezra 6:5]].
  - **Gifts for a temple in the latter days.** The Kirtland Temple dedicatory prayer tells the Lord, in language that echoes verses 5–6, that “out of our poverty we have given of our substance to build a house to thy name” ([[D&C 109:5]]).

