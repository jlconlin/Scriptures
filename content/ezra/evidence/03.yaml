chapter: 3
claims:
  - where: 'when'
    claim: 'The seventh month of verse 1 falls in the year of the return; the foundation is laid in the second year'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'The year is not stated, but the year in which they returned from Babylon is intended, as appears from Ezra 3:8, which tells us that the foundations of the temple were laid in the second month of the second year of their return.'
  - where: 'setting'
    claim: 'The year of verse 1 is the year of the return, shown by verse 8'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'The year is not stated, but the year in which they returned from Babylon is intended, as appears from Ezra 3:8'
  - where: 'setting'
    claim: 'The chapter has two parts: the altar, sacrifices and feast of tabernacles in the seventh month; the foundation in the second month of the next year'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'On the approach of the seventh month, the people assembled in Jerusalem to restore the altar of burnt-offering and the sacrificial worship, and to keep the feast of tabernacles (Ezra 3:1-7); and in the second month of the following year the foundations of the new temple were laid'
  - where: 'setting'
    claim: 'Jeshua of Ezra is Joshua the high priest'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29'
    quote: 'The name Jeshua appears in the book of Ezra but is also spelled Joshua in Haggai. This man, Jeshua, was the high priest (see Haggai 1:1).'
  - where: 'setting'
    claim: 'Zerubbabel was a governor of Davidic descent'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Verse 2 mentions Jeshua, the priest, and Zerubbabel, a governor of Davidic descent.'
  - where: 'setting'
    claim: 'The building was impeded by opposition and resumed in the second year of Darius, 520 B.C., at the urging of Haggai and Zechariah'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'The building of Zerubbabel’s temple was impeded by the active opposition and by the intrigues of the Samaritans (Ezra 4:4–5, 23–24). In the second year of Darius Hystaspes (520 B.C.) the people, exhorted by the prophets Haggai and Zechariah, resumed their task'
  - where: 'thread'
    claim: 'Ezra-Nehemiah shows temple worship resumed in continuity with the pre-exilic past; the altar is rebuilt according to the law of Moses'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Ezra-Nehemiah validates the legitimacy of the reestablished priesthood by showing how temple worship has been resumed in continuity with the pre-exilic past. This is the second strategy. The altar is rebuilt according to the law of Moses (Ezra 3:2).'
  - where: 'thread'
    claim: 'The chapter ends with some rejoicing and the older men who knew the first temple weeping'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'People rejoiced to see the rebuilding of the temple, but others who were older and knew the previous temple wept that it could not be rebuilt to the same splendor as the original.'
  - where: 'section 1 plain'
    claim: '“Upon his bases” means upon its former place'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'They reared the altar על־מכונתו, upon its (former) place; not, upon its bases.'
  - where: 'section 1 plain'
    claim: 'The “grant” of Cyrus is his permission to rebuild'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'according to the grant of Cyrus to them, i.e., according to the permission given them by Cyrus, sc. to rebuild the temple.'
  - where: 'section 2 plain'
    claim: 'The Levites were appointed to oversee the building'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'began Zerubbabel and Joshua to appoint the Levites from twenty years old and upwards to the oversight of the work (the building) of the house of the Lord.'
  - where: 'note 3:1 “The seventh month and the feast”'
    claim: 'They wanted the altar complete in the seventh month to celebrate the feast of tabernacles; Solomon’s dedication was connected to that feast, and Ezra seems to connect the two temples'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'When Solomon completed the first temple, its dedication was connected to the Feast of Tabernacles. In this regard, Ezra seemed to be connecting this temple with the earlier one.'
  - where: 'note 3:1 “The seventh month and the feast”'
    claim: 'The feast of tabernacles began on the fifteenth of the seventh month; Solomon’s dedication fell at the feast of the seventh month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And all the men of Israel assembled themselves unto king Solomon at the feast in the month Ethanim, which is the seventh month.'
  - where: 'note 3:3 “An altar for protection”'
    claim: 'The altar was placed on the site where the temple had stood'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'The reconstruction began with the very heart of Israel’s religious facilities, the altar of the temple, which was placed on the very site where the temple formerly had stood. The altar was necessary so that worship and sacrifice could begin again according to the pattern laid down by Moses'
  - where: 'note 3:2 “The altar before the house”'
    claim: 'Building an altar first in a new place is a pattern in scripture (Abraham, Jacob, Lehi)'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'We see throughout scripture one of the first things that religious people do in a new location is build an altar to offer sacrifices of gratitude. … For example, Abraham (Genesis 13:4; 18), Jacob (Genesis 35:1, 3, 7), and Lehi (1 Nephi 2:7).'
  - where: 'note 3:2 “The altar before the house”'
    claim: 'Jeshua and Zerubbabel are connected with authority from before the exile'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Verse 2 mentions Jeshua, the priest, and Zerubbabel, a governor of Davidic descent. These officials are connected with the authority from before the exile.'
  - where: 'note 3:2 “The altar before the house”'
    claim: 'Every act of reestablished worship is shown as a recovery of past practice'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The writers are careful to show that every act in the reestablishment of temple worship is a recovery of past practices, not solely an invention of their own.'
  - where: 'note 3:2 “The altar before the house”'
    claim: 'Haggai 1:2: the people said the time to build had not come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: 'This people say, The time is not come, the time that the Lord’s house should be built.'
  - where: 'note 3:3 “An altar for protection”'
    claim: 'The sacrifices were in part a petition for protection; conflict with the locals recurs through Ezra and Nehemiah'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A recurring theme in Ezra and Nehemiah is the conflict between the returnees and the locals. Part of their sacrifices here in this verse seem to be a petition to God to protect them from the locals.'
  - where: 'note 3:3 “An altar for protection”'
    claim: 'The temple stood on the ancient site'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'it was, so far as circumstances permitted, in its principal parts a reproduction of Solomon’s temple, and on the ancient site (Ezra 3:3).'
  - where: 'note 3:7 “Cedar by sea, as for Solomon”'
    claim: 'The temple was a reproduction of Solomon’s so far as circumstances permitted'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'we may reasonably infer that it was, so far as circumstances permitted, in its principal parts a reproduction of Solomon’s temple'
  - where: 'note 3:7 “Cedar by sea, as for Solomon”'
    claim: 'Solomon’s timber came by sea to Joppa'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/2?lang=eng'
    quote: 'And we will cut wood out of Lebanon, as much as thou shalt need: and we will bring it to thee in floats by sea to Joppa; and thou shalt carry it up to Jerusalem.'
  - where: 'note 3:10 “After the ordinance of David”'
    claim: 'David numbered the Levites from twenty years old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'For by the last words of David the Levites were numbered from twenty years old and above:'
  - where: 'note 3:10 “After the ordinance of David”'
    claim: 'The appointment of verse 8 compares with 1 Chronicles 23'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'These together formed the community who appointed the Levites to preside over, i.e., to conduct the building of the temple. For the expression, comp. 1 Chronicles 23:4-24.'
  - where: 'note 3:10 “After the ordinance of David”'
    claim: 'David set apart the sons of Asaph to prophesy with cymbals'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/25?lang=eng'
    quote: 'Moreover David and the captains of the host separated to the service of the sons of Asaph, and of Heman, and of Jeduthun, who should prophesy with harps, with psalteries, and with cymbals'
  - where: 'note 3:10 “After the ordinance of David”'
    claim: 'At Solomon’s dedication Asaph’s singers with cymbals and priests with trumpets sang “For he is good; for his mercy endureth for ever”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'Also the Levites which were the singers, all of them of Asaph … having cymbals and psalteries and harps, stood at the east end of the altar, and with them an hundred and twenty priests sounding with trumpets'
  - where: 'note 3:10 “After the ordinance of David”'
    claim: 'The praise followed David’s custom (1 Chronicles 25); two choirs or a choir and soloist sang alternately; the shout was likely like the Hosanna Shout'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'was performed according to the custom established by David (see 1 Chronicles 25). Two choirs, or a choir and soloist, sang alternately. It is likely that the shout was similar to the Hosanna Shout used in connection with modern solemn assemblies.'
  - where: 'note 3:10 “After the ordinance of David”'
    claim: '“In their apparel” means in robes of office, compare 2 Chronicles 5:12'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'מלבּשׁים, clothed, sc. in their robes of office; comp. 2 Chronicles 5:12'
  - where: 'note 3:12 “Weeping and shouting”'
    claim: 'Josephus: the old men recalled the greater temple, saw the new one poorer through poverty, and wept; the people in general were content'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-11.html'
    quote: 'recollecting with themselves how much greater and more sumptuous the old temple had been; and seeing that now made how much inferior it was, on account of their poverty … considered with themselves how much their happy state was sunk below what it had been of old, as well as their temple.'
  - where: 'note 3:12 “Weeping and shouting”'
    claim: 'Josephus: the people in general were content because they were allowed to build a temple'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-11.html'
    quote: 'But the people in general were contented with their present condition; and because they were allowed to build them a temple, they desired no more'
  - where: 'note 3:12 “Weeping and shouting”'
    claim: 'The older generation’s sorrow may have been because the new temple would not be as grand'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'However, many of the older generation who could remember the temple of Solomon wept. This sorrow may have been because the new temple would not be as grand as the first.'
  - where: 'note 3:12 “Weeping and shouting”'
    claim: 'Verse 13 does not mean the weeping was drowned out; joy and weeping arose among the people and could not be distinguished'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'The meaning is not, that the people could not hear the loud weeping of the older priests, Levites, and heads of the people, because it was overpowered by the loud rejoicings of the multitude. The verse, on the contrary, contains a statement that among the people also … a shout of joy and a voice of weeping arose'
  - where: 'note 3:12 “Weeping and shouting”'
    claim: 'Some who had seen the first temple were still living in the second year of Darius'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'some (according to Hagg. Ezr 2:2) were still living in the second year of Darius Hystaspis who had beheld the glory of the earlier building.'
  - where: 'christ'
    claim: 'Sacrifice is a similitude of the sacrifice of the Only Begotten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth.'
  - where: 'christ'
    claim: 'Christ did away with blood sacrifice and asks a broken heart and contrite spirit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer up unto me no more the shedding of blood; yea, your sacrifices and your burnt offerings shall be done away'
  - where: 'christ'
    claim: 'Today’s temples have altars for making covenants; the sacrifice required is a broken heart and contrite spirit, in remembrance of Christ’s atoning sacrifice'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Today’s temples do not include sacrifices on altars, but they do feature altars as a place for making covenants. The sacrifice that the Lord requires alongside these covenants today is a broken heart and a contrite spirit to remind us of Jesus Christ’s atoning sacrifice.'
  - where: 'explore'
    claim: 'Zechariah: Zerubbabel’s hands laid the foundation and will finish the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/4?lang=eng'
    quote: 'The hands of Zerubbabel have laid the foundation of this house; his hands shall also finish it'
  - where: 'note 3:3 “An altar for protection”'
    claim: 'The word behind “bases” means a fixed resting place or base, used of the altar in Ezra 3:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/4350.htm'
    quote: 'noun feminine fixed resting-place, base'
  - where: 'note 3:1 “The seventh month and the feast”'
    claim: 'Numbers 29 prescribes thirteen young bullocks on the first day of the feast and twelve on the second'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/29?lang=eng'
    quote: 'thirteen young bullocks, two rams, and fourteen lambs of the first year'
  - where: 'note 3:1 “The seventh month and the feast”'
    claim: 'On the second day of the feast, twelve young bullocks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/29?lang=eng'
    quote: 'ye shall offer twelve young bullocks'
