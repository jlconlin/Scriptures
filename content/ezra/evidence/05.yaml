chapter: 5
claims:
  - where: 'when'
    claim: 'The second year of Darius Hystaspes is 520 B.C.'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'In the second year of Darius Hystaspes (520 B.C.) the people, exhorted by the prophets Haggai and Zechariah, resumed their task'
  - where: 'when'
    claim: 'Haggai''s second year of Darius is probably 520 B.C.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: 'Probably 520 B.C. Darius Hystaspes reigned 521–486 B.C.'
  - where: 'setting'
    claim: 'In 520 B.C. the people, exhorted by Haggai and Zechariah, resumed the work'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'In the second year of Darius Hystaspes (520 B.C.) the people, exhorted by the prophets Haggai and Zechariah, resumed their task'
  - where: 'setting'
    claim: 'The Darius of Ezra 5 is the son of Hystaspes'
    key: bd-darius
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/darius?lang=eng'
    quote: '(2) The son of Hystaspes and founder of the Persian dynasty (Ezra 4:5, 24; 5:5–7; 6:1–15; Hag. 1:1, 15; 2:10; Zech. 1:1, 7; 7:1).'
  - where: 'setting'
    claim: 'Ezra 4:8–6:18 is in Aramaic, an official language of the Persian Empire'
    key: bd-aramaic
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aramaic?lang=eng'
    quote: 'An official language of the Persian Empire, spoken widely throughout the Near East. Certain portions of the Old Testament are written in Aramaic (Ezra 4:8–6:18; 7:12–26;'
  - where: 'setting'
    claim: 'Tatnai was the provincial governor; the request went to Darius while the building continued'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'These verses contain a copy of the letter sent by the provincial governor Tatnai (Tattenai) and other officials to King Darius (522–486 BC), the successor to Cyrus.'
  - where: 'setting'
    claim: '“On this side the river” is west of the Euphrates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/5?lang=eng'
    quote: '3a “on”: IE on the west side of the Euphrates River, including Syria and Cilicia.'
  - where: 'thread'
    claim: 'The elders'' reply in verses 11–15 answers both of the officials'' questions'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/5.htm'
    quote: 'while the rulers of the Jews gave a circumstantial answer to both questions (Ezra 5:11-15).'
  - where: 'thread'
    claim: 'The book reads its history as God''s hand working behind the scenes'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'interpreting postexilic history as the benevolent hand of God working behind the scenes.'
  - where: 'note 5:2 “The prophets of God helping them”'
    claim: 'Haggai and Zechariah, in their own books, prophesied about the temple and urged the people to build'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'In their own respective books of scripture, they not only prophesied about rebuilding the temple but also strongly encouraged the inhabitants to make progress on the temple.'
  - where: 'note 5:2 “The prophets of God helping them”'
    claim: 'The Bible Dictionary names Haggai 1–2 and Zechariah 4:6–10 as the help given Zerubbabel in rebuilding the temple'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'He set up an altar in Jerusalem and rebuilt the temple (see Temple of Zerubbabel) (Ezra 3:2, 8; 4:2–3; 5:2); being helped by Haggai (Hag. 1:1–14; 2) and Zechariah (Zech. 4:6–10).'
  - where: 'note 5:2 “The prophets of God helping them”'
    claim: 'Haggai''s first word and the people''s start on the work are dated in Haggai 1; Zechariah''s first word in the eighth month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: 'Probably 520 B.C. Darius Hystaspes reigned 521–486 B.C.'
  - where: 'note 5:3 “Tatnai, the governor over Judah’s governor”'
    claim: 'Tatnai was the provincial governor who wrote to Darius'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The local governor demanded to know who ordered the rebuilding of the house. A request for further information was sent to King Darius while the building continued.'
  - where: 'note 5:3 “Tatnai, the governor over Judah’s governor”'
    claim: 'Judea and its governor Zerubbabel were under Tatnai; Shethar-boznai was perhaps his secretary'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/5.htm'
    quote: 'of Syria and Phoenicia, to which Judaea with its Pecha Zerubbabel was subordinate. With him came Shethar-Boznai, perhaps his secretary, and their companions, their subordinates.'
  - where: 'note 5:3 “Tatnai, the governor over Judah’s governor”'
    claim: 'The officials could have stopped the work and did not'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/5.htm'
    quote: 'Tatnai and Shethar-Boznai had power to prohibit them from proceeding; they allowed them, however, to go on with their work till the arrival of an answer from the king'
  - where: 'note 5:3 “Tatnai, the governor over Judah’s governor”'
    claim: 'Verse 4''s Aramaic verb is first person plural, “we said”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'אֲמַ֣רְנָא'
  - where: 'note 5:3 “Tatnai, the governor over Judah’s governor”'
    claim: 'The Greek reads “they spoke” in verse 4'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezra/5.htm'
    quote: '4Then they spoke thus to them, What are the names of the men that build this city?'
  - where: 'note 5:3 “Tatnai, the governor over Judah’s governor”'
    claim: 'Modern translations make the officials the askers in verse 4'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezra%205%3A3-5&version=ESV'
    quote: '4 They also asked them this: “What are the names of the men who are building this building?”'
  - where: 'note 5:3 “Tatnai, the governor over Judah’s governor”'
    claim: 'One reading keeps “we”: the writer was an eyewitness and one of the builders'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/5.htm'
    quote: 'it is obvious that the author of this account was an eye-witness of, and sharer in, the work of building.'
  - where: 'note 5:3 “Tatnai, the governor over Judah’s governor”'
    claim: 'That reading finds no reason in the Greek to alter the “we”'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/5.htm'
    quote: 'the εἴποσαν of the lxx being no critical authority for so doing'
  - where: 'note 5:3 “A wall, or the structure?”'
    claim: 'The Aramaic word occurs only in 5:3 and 5:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'וְ/אֻשַּׁרְנָ֥/א'
  - where: 'note 5:3 “A wall, or the structure?”'
    claim: 'Its meaning and root are uncertain; most render “wall”; one proposal derives it from a word for sanctuary'
    key: bdb
    url: 'https://biblehub.com/hebrew/846.htm'
    quote: 'meaning and √ dubious'
  - where: 'note 5:3 “A wall, or the structure?”'
    claim: 'One proposal derives it from Assyrian ašru, sanctuary'
    key: bdb
    url: 'https://biblehub.com/hebrew/846.htm'
    quote: 'from Assyrian ašru, sanctuary'
  - where: 'note 5:3 “A wall, or the structure?”'
    claim: 'The Greek reads “this preparation”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezra/5.htm'
    quote: 'Who has ordained a decree for you to build this house, and to provide this preparation?'
  - where: 'note 5:3 “A wall, or the structure?”'
    claim: 'The ESV reads “finish this structure”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezra%205%3A3-5&version=ESV'
    quote: '“Who gave you a decree to build this house and to finish this structure?”'
  - where: 'note 5:3 “A wall, or the structure?”'
    claim: 'The NRSVUE reads “finish this structure”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezra%205%3A3-5&version=NRSVUE'
    quote: '“Who gave you a decree to build this house and to finish this structure?”'
  - where: 'note 5:5 “The eye of their God”'
    claim: 'The request went to Darius while the building continued'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A request for further information was sent to King Darius while the building continued.'
  - where: 'note 5:5 “The eye of their God”'
    claim: 'Modern translations: they did not stop them until the report reached Darius'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezra%205%3A3-5&version=NRSVUE'
    quote: '5 But the eye of their God was upon the elders of the Jews, and they did not stop them until a report reached Darius and then answer was returned by letter in reply to it.'
  - where: 'note 5:11 “Servants of the God of heaven and earth”'
    claim: 'The book shows the temple rebuilt in the likeness of Solomon''s, in continuity with the past'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Ezra-Nehemiah validates the legitimacy of the reestablished priesthood by showing how temple worship has been resumed in continuity with the pre-exilic past. … The temple is constructed in the likeness of Solomon''s (Ezra 5:11).'
  - where: 'note 5:11 “Servants of the God of heaven and earth”'
    claim: 'The elders explain the ruin as God allowing it for their fathers'' disobedience, and the return as His work through Cyrus'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'These verses summarize the Jewish perspective that God had allowed the temple to be destroyed by Nebuchadnezzar because of their fathers’ disobedience but that through the instrumentality of Cyrus, the captured temple vessels were returned'
  - where: 'note 5:13 “Cyrus’s decree as their warrant”'
    claim: 'Darius honored the decree; a king''s decrees were often honored by his successors'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'And, the decrees of one king were often honored by his successors.'
  - where: 'note 5:13 “Cyrus’s decree as their warrant”'
    claim: 'Darius had the archives searched and the earlier order was found'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'At the order of King Darius, the archives were searched for any previous orders regarding Jerusalem and its temple. The previous order was found, which gave specific details for measurements and expenses related to the temple.'
  - where: 'note 5:16 “Sheshbazzar and the unfinished house”'
    claim: 'The Bible Dictionary takes Sheshbazzar as Zerubbabel''s Persian name'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'Zerubbabel was also known by the Persian name Sheshbazzar (Ezra 1:8, etc.).'
  - where: 'note 5:16 “Sheshbazzar and the unfinished house”'
    claim: 'Two persons is the likelier reading; both royal, both probably appointed by Cyrus'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'The evidence seems to favor the idea of two separate persons. Both were of the royal line of Judah, and both were probably appointed by Cyrus. Zerubbabel has become the more famous in history because he outlived the older Sheshbazzar.'
  - where: 'note 5:16 “Sheshbazzar and the unfinished house”'
    claim: 'Chapter 5 names both men, part of the case against one man with two names'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'however, in chapter 5 Zerubabbel and Sheshbazzar appear together. Therefore the text does not seem to support this idea.'
  - where: 'note 5:16 “Sheshbazzar and the unfinished house”'
    claim: '“Ever since in building” does not deny the stoppage; it leaves out its cause'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/5.htm'
    quote: 'This statement does not exclude the cessation from building from the last year of Cyrus to the second of Darius, narrated Ezra 4-6:7, as Bertheau and others suppose, but only leaves the unmentioned circumstance which had been the cause of the delay.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Prophets in this dispensation have inspired the Saints to sacrifice to build temples, as Haggai and Zechariah did'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'show how these two prophets inspired Zerubbabel, Jeshua, and the people to complete the holy temple in spite of persecution, hard times, and governmental red tape, much as prophets in this dispensation have inspired the Saints to sacrifice much to build temples.'
