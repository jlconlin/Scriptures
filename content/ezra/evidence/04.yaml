chapter: 4
claims:
  - where: 'when'
    claim: 'The work resumed in the second year of Darius I, 520 B.C.'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'In the second year of Darius Hystaspes (520 B.C.) the people, exhorted by the prophets Haggai and Zechariah, resumed their task'
  - where: 'when'
    claim: 'The Ahasuerus of Ezra 4:6 is probably Xerxes'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: '(3) Esth. 1:1, where Ahasuerus is certainly to be identified with Xerxes.'
  - where: 'when'
    claim: 'The Ahasuerus of Ezra 4:6 is probably the same as Esther''s'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: '(2) Ezra 4:6; probably the same as (3).'
  - where: 'when'
    claim: 'The Artaxerxes of Ezra 4:7–23 is Artaxerxes I Longimanus'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23)'
  - where: 'setting'
    claim: 'The adversaries of 4:1 were the Samaritans'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The “adversaries” identified in Ezra 4:1 were the Samaritans, who lived north of Jerusalem in the region of Samaria.'
  - where: 'setting'
    claim: 'In 520 B.C. the people, urged by Haggai and Zechariah, resumed building'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'In the second year of Darius Hystaspes (520 B.C.) the people, exhorted by the prophets Haggai and Zechariah, resumed their task'
  - where: 'setting'
    claim: 'Ahasuerus of Esther is Xerxes; the Ahasuerus of Ezra 4:6 probably the same'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: '(3) Esth. 1:1, where Ahasuerus is certainly to be identified with Xerxes.'
  - where: 'setting'
    claim: 'The Ahasuerus of Ezra 4:6 is probably the same as Esther''s'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: '(2) Ezra 4:6; probably the same as (3).'
  - where: 'setting'
    claim: 'Artaxerxes I hindered the building of 4:7–23'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23)'
  - where: 'setting'
    claim: 'Verse 24 returns to the point reached at verse 5'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/4.htm'
    quote: 'With this recapitulation of the contents of Ezra 4:5, the narrative, Ezra 4:24, returns to the point which it had reached at Ezra 4:5.'
  - where: 'setting'
    claim: 'Ezra 4:8–6:18 is in Aramaic, an official language of the Persian Empire; Daniel 2:4–7:28 too'
    key: bd-aramaic
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aramaic?lang=eng'
    quote: 'An official language of the Persian Empire, spoken widely throughout the Near East. Certain portions of the Old Testament are written in Aramaic (Ezra 4:8–6:18; 7:12–26; Jer. 10:11; Dan. 2:4–7:28).'
  - where: 'thread'
    claim: 'The later letters are placed here to give one view of all the hostile acts against the community'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/4.htm'
    quote: 'for the sake of giving a short and comprehensive view of all the hostile acts against the Jewish community on the part of the Samaritans and surrounding nations.'
  - where: 'section 3 plain'
    claim: 'Verse 7: the letter was written in Aramaic and translated'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezra+4%3A7&version=ESV'
    quote: 'The letter was written (B)in Aramaic and translated.'

  - where: 'note 4:2 “Who offered to help, and why they were refused”'
    claim: 'Samaritans: partly Israelite, partly gentile; their religion mixed'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'The population was therefore partly Israelite and partly gentile. Their religion was also of a mixed character (see 2 Kgs. 17:24–41), though they claimed, as worshippers of Jehovah, to have a share in the rebuilding of the temple at Jerusalem (Ezra 4:1–3).'
  - where: 'note 4:2 “Who offered to help, and why they were refused”'
    claim: 'After the refusal they became bitter opponents and built a rival temple on Gerizim; the antagonism continues in the New Testament'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'they became, as the books of Ezra and Nehemiah show, bitter opponents of the Jews, and started a rival temple of their own on Mount Gerizim.'
  - where: 'note 4:2 “Who offered to help, and why they were refused”'
    claim: 'Esarhaddon ruled Assyria 681–668'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'But their power was still mighty under Esarhaddon (681–668), who invaded and conquered Egypt, and his son Assurbanipal.'
  - where: 'note 4:2 “Who offered to help, and why they were refused”'
    claim: 'The king of Assyria settled men from Babylon and elsewhere in the cities of Samaria; they feared the LORD and served their own gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'And the king of Assyria brought men from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed them in the cities of Samaria instead of the children of Israel'
  - where: 'note 4:2 “Who offered to help, and why they were refused”'
    claim: 'The Jews did not count them true worshippers of Jehovah, which likely influenced Zerubbabel'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'the Jews did not consider them to be pure Israelites or true worshippers of Jehovah. These factors likely influenced Zerubbabel and his group to reject the Samaritans’ offer to help rebuild the temple.'

  - where: 'note 4:5 “Hindered from Cyrus to Darius”'
    claim: 'The locals bribed Persian officials'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The locals attempted to bribe Per - sian ministers in order to thwart the plans of the returnees.'
  - where: 'note 4:5 “Hindered from Cyrus to Darius”'
    claim: 'The work ceased for fifteen to seventeen years'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'The work on the temple ceased for fifteen to seventeen years because of the interference of the Samaritans'
  - where: 'note 4:5 “Hindered from Cyrus to Darius”'
    claim: 'The temple was impeded by opposition and intrigue; resumed in 520 B.C.'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'The building of Zerubbabel’s temple was impeded by the active opposition and by the intrigues of the Samaritans'
  - where: 'note 4:5 “Hindered from Cyrus to Darius”'
    claim: 'Some Jews lost interest in rebuilding'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'After years of not working on the reconstruction, some Jews lost interest in rebuilding the temple (see Haggai 1:2–6).'

  - where: 'note 4:6 “Letters from later reigns”'
    claim: 'Ahasuerus of Ezra 4:6 probably the same as Esther''s'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: '(2) Ezra 4:6; probably the same as (3).'
  - where: 'note 4:6 “Letters from later reigns”'
    claim: 'Esther''s Ahasuerus is Xerxes'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: '(3) Esth. 1:1, where Ahasuerus is certainly to be identified with Xerxes.'
  - where: 'note 4:6 “Letters from later reigns”'
    claim: 'Artaxerxes Longimanus, 465–425, hindered the building of 4:7–23'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23)'
  - where: 'note 4:6 “Letters from later reigns”'
    claim: 'The section between verses 5 and 24 is an illustrative episode; the kings reigned after Darius'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/4.htm'
    quote: 'What lies between is thereby characterized as an illustrative episode … letters are given addressed to the Kings Ahashverosh and Artachshasta, who, as all Ezra''s contemporaries would know, reigned not before but after Darius'
  - where: 'note 4:6 “Letters from later reigns”'
    claim: 'The older reading made the two kings Cambyses and Pseudo-Smerdis'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/4.htm'
    quote: 'older expositors have without hesitation referred the contents of Ezra 4:6 to the interruption to the building of the temple during the period from Cyrus to Darius, and understood the two names Ahashverosh and Artachshasta as belonging to Cambyses and (Pseudo) Smerdis'
  - where: 'note 4:6 “Letters from later reigns”'
    claim: 'The Bible Chronology pairs Ahasuerus with Cambyses'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Ahasuerus (Ezra 4:6). … =Cambyses, king of Persia, 529–521.'

  - where: 'note 4:6 “Letters from later reigns”'
    claim: 'The Bible Chronology pairs Artaxerxes with Pseudo-Smerdis'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Artaxerxes (Ezra 4:7). … =Pseudo-Smerdis.'

  - where: 'note 4:7 “Written in Aramaic”'
    claim: 'Aramaic was an official language of the Persian Empire; Ezra 4:8–6:18 is in Aramaic'
    key: bd-aramaic
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aramaic?lang=eng'
    quote: 'An official language of the Persian Empire, spoken widely throughout the Near East. Certain portions of the Old Testament are written in Aramaic (Ezra 4:8–6:18; 7:12–26; Jer. 10:11; Dan. 2:4–7:28).'
  - where: 'note 4:7 “Written in Aramaic”'
    claim: 'The verb rendered “interpreted” means interpret, translate'
    key: bdb
    url: 'https://biblehub.com/hebrew/8638.htm'
    quote: '[תִּרְגֵּם] verb quadriliteral interpret, translate'
  - where: 'note 4:7 “Written in Aramaic”'
    claim: 'The second “in Aramaic” marks that 4:8–6:18 is in Aramaic, or the letter was in Aramaic script and language'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezra+4%3A7&version=ESV'
    quote: 'Ezra 4:7 Hebrew written in Aramaic and translated in Aramaic, indicating that 4:8–6:18 is in Aramaic; another interpretation is The letter was written in the Aramaic script and set forth in the Aramaic language'
  - where: 'note 4:7 “Written in Aramaic”'
    claim: 'The section preserves the letters in Aramaic, the common language of the time'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'An interesting feature of this section is its preser - vation of the letters in Aramaic, the lingua franca of the time. The Aramaic section extends from Ezra 4:8 to 6:18.'

  - where: 'note 4:10 “The great and noble Asnappar”'
    claim: 'Asnappar is probably the Assyrian king Ashurbanipal'
    key: bdb
    url: 'https://biblehub.com/hebrew/620.htm'
    quote: 'Asnappar, who transported peoples to Samaria Ezra 4:10; … probably = Assyrian king Asšurbanipal ( B.C. 668-626)'
  - where: 'note 4:10 “The great and noble Asnappar”'
    claim: 'Asnappar is the Aramaic form of Ashurbanipal'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Asnappar is the Aramaic version of Ashurbanipal'
  - where: 'note 4:10 “The great and noble Asnappar”'
    claim: 'Ashurbanipal was the son of Esarhaddon'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'But their power was still mighty under Esarhaddon (681–668), who invaded and conquered Egypt, and his son Assurbanipal.'
  - where: 'note 4:10 “The great and noble Asnappar”'
    claim: 'The Samaritans descended from colonists placed by Assyrian kings, citing Ezra 4:2 and 4:10 together'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'They were the descendants of (1) foreign colonists placed there by kings of Assyria and Babylonia (2 Kgs. 17:24; Ezra 4:2, 10)'

  - where: 'note 4:20 “What the king’s records showed”'
    claim: 'The mighty kings of verse 20 are in full only David and Solomon; verse 20 answers verse 13'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/4.htm'
    quote: 'This applies in its full extent only to David and Solomon, and in a less degree to subsequent kings of Israel and Judah. On Ezra 4:20, comp. Ezra 4:13.'
  - where: 'note 4:20 “What the king’s records showed”'
    claim: 'Solomon had dominion over all the region on this side the river'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: 'For he had dominion over all the region on this side the river, from Tiphsah even to Azzah, over all the kings on this side the river'

  - where: 'note 4:21 “Until another commandment”'
    claim: 'The Artaxerxes who hindered the building of 4:7–23 also commissioned Ezra and Nehemiah'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1) and to Nehemiah (Neh. 2:1; 5:14; 13:6).'
  - where: 'note 4:21 “Until another commandment”'
    claim: 'Nehemiah asked the king to send him to build the city; the king granted timber for the wall'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'and for the wall of the city, and for the house that I shall enter into. And the king granted me, according to the good hand of my God upon me.'
  - where: 'note 4:21 “Until another commandment”'
    claim: 'Nehemiah heard that the wall of Jerusalem was broken down'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng'
    quote: 'the wall of Jerusalem also is broken down, and the gates thereof are burned with fire.'
  - where: 'christ'
    claim: 'The Savior broke down barriers between Jews and Samaritans'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The Savior took many opportunities during His ministry to break down cultural barriers between Jews and Samaritans (see Luke 9:51–56; John 4:1–42; Acts 1:8).'
  - where: 'christ'
    claim: 'The Apostles were sent to Samaria and Philip did a successful work there'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'but the people of Samaria were included among those to whom the Apostles were directed to preach the gospel (Acts 1:8), and a very successful work was done there by Philip (Acts 8:4–25).'
  - where: 'christ'
    claim: 'The footnote to Ezra 4:21 points to D&C 124:49'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/4?lang=eng'
    quote: '21a “cease”: D&C 124:49.'
  - where: 'christ'
    claim: 'The Lord accepts the offerings of those hindered by enemies, for their consolation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'And this I make an example unto you, for your consolation concerning all those who have been commanded to do a work and have been hindered by the hands of their enemies, and by oppression, saith the Lord your God.'
  - where: 'christ'
    claim: 'The animosity between Jews and Samaritans lasted into the Savior''s ministry'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The animosity between the Jews and Samaritans persisted over centuries and remained evident during the Savior’s mortal ministry.'
