chapter: 10
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Ezra obtained his edict from Artaxerxes in 458 B.C.'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'In 458 B.C. he obtained from Artaxerxes an important edict (Ezra 7:12–26) allowing him to take to Jerusalem any Jewish exiles who cared to go'
  - where: 'setting'
    claim: 'From 10:1 onward Ezra is spoken of in the third person'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/10.htm'
    quote: 'From this point onwards Ezra relates the further course of events in such wise as to cast his own person in the background, and speaks of himself in the third person.'
  - where: 'setting'
    claim: 'Ezra came to teach the law under Artaxerxes in 458; his first reform in Jerusalem was the separation from foreign wives; Nehemiah is the sequel'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'On arriving in Jerusalem his first reform was to cause the Jews to separate from their foreign wives, and a list is given of those who had offended in this way (Ezra 10). The later history of Ezra is found in the book of Nehemiah, which is a sequel to the book of Ezra.'
  - where: 'setting'
    claim: 'Ezra’s mission was to teach the law'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'The object of his mission was “to teach in Israel statutes and judgments.”'
  - where: 'thread'
    claim: 'Intermarriage was the problem to be settled in reconstituting the community of Jerusalem'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The issue of intermarriage with foreigners was the key problem that needed to be addressed in reconstituting the religious community of Jerusalem.'

  # ---- notes ----
  - where: 'note 10:2 “Hope in Israel”'
    claim: 'The text: Shechaniah of the sons of Elam confesses in the first person plural; sons of Elam appear in the list (10:26)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/10?lang=eng'
    quote: 'And Shechaniah the son of Jehiel, one of the sons of Elam, answered and said unto Ezra, We have trespassed against our God'

  - where: 'note 10:3 “Whose counsel, Ezra''s or the Lord''s?”'
    claim: 'The NRSVUE reads “the counsel of my lord”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezra%2010&version=NRSVUE'
    quote: 'according to the counsel of my lord and of those who tremble at the commandment of our God'
  - where: 'note 10:3 “Whose counsel, Ezra''s or the Lord''s?”'
    claim: 'The Masoretic text points the word as ʾădōnāy'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: '<w lemma="113" n="1.1" morph="HNcmpc/Sp1cs" id="15pSh">אֲדֹנָ֔/י</w>'
  - where: 'note 10:3 “Whose counsel, Ezra''s or the Lord''s?”'
    claim: 'BDB lists Ezra 10:3 under the divine form ʾădōnāy while noting the reference is to Ezra'
    key: bdb
    url: 'https://biblehub.com/hebrew/113.htm'
    quote: 'not Chron. except memorials Ezra 10:3 (reference to Ezra)'
  - where: 'note 10:3 “According to the law”'
    claim: 'The NRSVUE cross-references Ezra 10:3 to Deut. 7:2–3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezra%2010&version=NRSVUE'
    quote: '10.3 : v 44; Deut 7.2, 3; 2 Chr 34.31; Ezra 9.4'
  - where: 'note 10:3 “According to the law”'
    claim: 'The law forbade marriage with Canaanites lest Israel abandon its covenants'
    key: sc-knowhy-110
    url: 'https://scripturecentral.org/knowhy/why-did-book-of-mormon-prophets-discourage-nephite-lamanite-intermarriage'
    quote: 'the children of Israel were forbidden from intermarrying with Canaanites as they came to repossesses the land of promise, lest they abandon their covenants with the Lord.'
  - where: 'note 10:8 “Forfeited to the temple”'
    claim: 'The verb in 10:8 means devoted, i.e. forfeited, to the temple treasures'
    key: bdb
    url: 'https://biblehub.com/hebrew/2763.htm'
    quote: '2 devoted, i.e. forfeited, to the temple treasures Ezra 10:8.'
  - where: 'note 10:8 “Forfeited to the temple”'
    claim: 'Whoever did not come risked being cut off and losing property'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A proclamation was sent out for everyone to assemble in Jerusalem or risk being cut off from the congregation and their property being confiscated.'

  - where: 'note 10:9 “The ninth month and the great rain”'
    claim: 'The assembly was in the heavy December rains; cold, wet and sorrow made them tremble'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Ezra’s instructions about the strange wives occurred at the time of heavy December rains in Jerusalem. It was cold and wet, and these conditions, along with the people’s sorrow for their apostasy, caused them to tremble.'
  - where: 'note 10:9 “The ninth month and the great rain”'
    claim: 'The ninth month is December, the cold rainy season'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/10.htm'
    quote: 'The ninth month, corresponding with our December, is in the cold rainy time of the year (comp. Ezra 10:13)'

  - where: 'note 10:15 “Four men who stood against it”'
    claim: 'The footnote gives the probable sense “stood up against this”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/10?lang=eng'
    quote: 'HEB (probably) stood up against this.'
  - where: 'note 10:15 “Four men who stood against it”'
    claim: 'The NIV renders the verse as opposition, supported by two Levites'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ezra%2010&version=NIV'
    quote: 'Only Jonathan son of Asahel and Jahzeiah son of Tikvah, supported by Meshullam and Shabbethai … the Levite, opposed this.'

  - where: 'note 10:18 “The priests first”'
    claim: 'The first four names are sons and brothers of the high priest Jeshua, who returned with Zerubbabel'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/10.htm'
    quote: 'Among the priests there stand first, four names of sons and brethren of the high priest Jeshua, the son of Jozadak, who returned to Jerusalem with Zerubbabel.'
  - where: 'note 10:18 “The priests first”'
    claim: 'The four were probably distant cousins of the high priest'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/10.htm'
    quote: 'and were therefore distant cousins of the high priest'
  - where: 'note 10:18 “The priests first”'
    claim: 'Every priestly order of the first return (2:36–39) was involved'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/10.htm'
    quote: 'By comparing Ezra 2:36-39, we perceive that not one of the orders of priests who returned with Zerubbabel was free from participation in this transgression.'
  - where: 'note 10:18 “The priests first”'
    claim: 'The ram was the trespass offering of Lev. 5:14ff for a trespass against the Lord'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/10.htm'
    quote: 'This trespass-offering was imposed upon them according to the principle of the law, Leviticus 5:14, etc., because they had committed a … against the Lord, which needed expiation'
  - where: 'note 10:18 “The priests first”'
    claim: 'Lev. 5:15 requires a ram for a trespass in the holy things of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'If a soul commit a trespass, and sin through ignorance, in the holy things of the LORD; then he shall bring for his trespass unto the LORD a ram without blemish out of the flocks'

  - where: 'note 10:44 “The wives and the children”'
    claim: 'The NRSVUE marks the Hebrew of 10:44 uncertain and follows 1 Esdras 9:36'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezra%2010&version=NRSVUE'
    quote: '10.44 1 Esdras 9.36; meaning of Heb uncertain'
  - where: 'note 10:44 “The wives and the children”'
    claim: 'The NRSVUE text ends the book “and they sent them away with their children”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezra%2010&version=NRSVUE'
    quote: 'All these had married foreign women, and they sent them away with their children.'
  - where: 'note 10:44 “The wives and the children”'
    claim: 'The ESV footnote gives “they put them away with their children”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezra%2010&version=ESV'
    quote: 'Ezra 10:44 Or and they put them away with their children'
  - where: 'note 10:44 “The wives and the children”'
    claim: 'The NIV footnote likewise gives “they sent them away with their children”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ezra%2010&version=NIV'
    quote: 'Ezra 10:44 Or and they sent them away with their children'
  - where: 'note 10:44 “The wives and the children”'
    claim: 'The list is an odd ending; it is the segue to Nehemiah’s same problem'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'While this list may seem like an odd ending for the book of Ezra, in Hebrew tradition the books of Ezra and Nehemiah are often combined, and this list is merely the segue into the continued issue of intermar - riage that Nehemiah will pick up.'
  - where: 'note 10:44 “The wives and the children”'
    claim: 'Welch: the measure was decidedly coercive, partially carried out, a troubling anomaly'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'on one point, Ezra employs a means that is decidedly coercive … It appears that this decree is only partially carried out, but it remains a troubling anomaly in the otherwise effective and inspiring ministry of Ezra'
  - where: 'note 10:44 “The wives and the children”'
    claim: 'The Church’s summary: the people covenanted to repent'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Ezra sorrowed when he learned that some of the Jews in Jerusalem had married out of the covenant. He counseled the people to repent, and they made a covenant to repent of their sins.'
  - where: 'note 10:44 “The wives and the children”'
    claim: 'The KJV text of 10:44 as a statement about children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/10?lang=eng'
    quote: 'All these had taken strange wives: and some of them had wives by whom they had children.'

  # ---- christ / explore ----
  - where: 'christ'
    claim: 'The law of Moses and its sacrifices point to the great and last sacrifice, the Son of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'this is the whole meaning of the law, every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God'
  - where: 'explore'
    claim: 'Helaman 7 has a similar public prayer drawing a crowd'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A similar story of a prophet’s praying in public resulting in a crowd gathering around him is found in Helaman chapter 7, where Nephi prayed from his garden tower.'
