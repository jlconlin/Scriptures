chapter: 7
claims:
  - where: 'when'
    claim: 'Artaxerxes is Artaxerxes I Longimanus, king of Persia 465–425 B.C.'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1)'
  - where: 'when'
    claim: 'Ezra obtained the edict in 458 B.C.'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'In 458 B.C. he obtained from Artaxerxes an important edict (Ezra 7:12–26)'
  - where: 'when'
    claim: 'Nearly sixty years separate 7:1 from 6:22'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Nearly 60 years separate 7:1 from 6:22'
  - where: 'setting'
    claim: 'Nearly sixty years lie between 6:22 and 7:1, the years of Esther'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Nearly 60 years separate 7:1 from 6:22, during which time Esther is able to avert a complete massacre of the Jewish people'
  - where: 'setting'
    claim: 'The book records no events between the temple''s completion and Ezra''s mission; the temple was finished in 516 B.C. by the Bible Dictionary''s count'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'the preaching of Haggai and Zechariah and the completion of the temple, 516 B.C. There is no record in the book of any events between this date and the mission of Ezra.'
  - where: 'setting'
    claim: 'Ezra''s date is disputed; the scriptures seem to put him before Nehemiah; the temple was completed in 515 B.C. by this count'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'The date of Ezra’s mission is disputed. Some scholars date Ezra’s journey before that of Nehemiah, some after. The scriptures seem to indicate that Ezra’s group came to Jerusalem before Nehemiah.'
  - where: 'setting'
    claim: 'The temple was completed in 515 B.C. by this count'
    key: ot-manual-kings-j
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-j?lang=eng'
    quote: 'Not much is known of the state of Jewish affairs between the completion of the temple in 515 B.C. and the appearance in Jerusalem of Ezra and Nehemiah'
  - where: 'setting'
    claim: 'Artaxerxes Longimanus, son of Xerxes, reigned 465–425 B.C.'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.'
  - where: 'setting'
    claim: 'The Bible Chronology dates Ezra''s commission to 458 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '458 | Commission of Ezra.'
  - where: 'setting'
    claim: 'Ezra came about eighty years after the first return, with Artaxerxes'' permission'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'About 80 years after the first group of exiles returned to Jerusalem, King Artaxerxes of Persia granted Ezra permission to lead another group of exiles back to the city.'
  - where: 'setting'
    claim: 'Ezra 7:12–26 is in Aramaic, an official language of the Persian Empire'
    key: bd-aramaic
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aramaic?lang=eng'
    quote: 'An official language of the Persian Empire, spoken widely throughout the Near East. Certain portions of the Old Testament are written in Aramaic (Ezra 4:8–6:18; 7:12–26;'
  - where: 'thread'
    claim: '“The hand of the Lord” runs through Ezra–Nehemiah as God''s benevolent hand behind events'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The phrase “the hand of the Lord” appears throughout the record (Ezra 7:6, 7:28, 8:18, 8:22, 8:31; Nehemiah 2:8, 2:18), interpreting postexilic history as the benevolent hand of God working behind the scenes.'
  - where: 'thread'
    claim: 'Chapter 7 tells of Ezra''s arrival, the king''s letter about the return and establishing the law, and Ezra''s gratitude'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'It includes a letter of commission from the Persian king Artaxerxes discussing the return of the Israelites to Jerusalem and the establishment of the law among their community. Ezra expressed gratitude to God for these favorable conditions.'
  - where: 'section 1 plain'
    claim: '“Ready scribe” means an expert scribe'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The adjective “ready scribe” in the King James Version means “one who is expert.”'
  - where: 'section 4 plain'
    claim: '“Certify” means inform'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: '24a “certify”: OR inform.'
  - where: 'section 4 plain'
    claim: '“Beyond the river” is west of the Euphrates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: '25b “beyond the river”: IE on the west side of the Euphrates River.'
  - where: 'section 5 plain'
    claim: '“Beyond the river” is west of the Euphrates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: '25b “beyond the river”: IE on the west side of the Euphrates River.'
  - where: 'note 7:1 “Ezra’s descent from Aaron”'
    claim: 'The genealogy interrupts the sentence; its subject, Ezra, is taken up again in verse 6'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/7.htm'
    quote: 'where, after the interposition of the long genealogy, Ezra 7:1-5, the distant subject is again taken up'
  - where: 'note 7:1 “Ezra’s descent from Aaron”'
    claim: 'Seraiah was the high priest Nebuchadnezzar executed at Riblah, father of Josedec'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/7.htm'
    quote: 'Seraiah the son of Azariah, the son of Hilkiah, was the father of Josedec the high priest carried into captivity (1 Chronicles 6:14, etc.), and was himself the high priest whom Nebuchadnezzar slew at Riblah (2 Kings 25:18-21).'
  - where: 'note 7:1 “Ezra’s descent from Aaron”'
    claim: 'About 130 years separate Seraiah''s death from Ezra''s return, so Ezra was a later descendant, not a son'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/7.htm'
    quote: 'there is a period of 130 years. Hence Ezra could have been neither the son nor grandson of Seraiah, but only his great or great-great-grandson.'
  - where: 'note 7:1 “Ezra’s descent from Aaron”'
    claim: 'Jeshua the high priest was Seraiah''s grandson; Ezra likely came from a younger line, not the high-priestly one'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/7.htm'
    quote: 'we are justified in inferring from the fact that Ezra is not, like Joshua, designated as Ben Josedech, that he did not descend from that line of Seraiah in which the high-priestly dignity was hereditary, but from a younger son'
  - where: 'note 7:1 “Ezra’s descent from Aaron”'
    claim: 'Six names between Azariah and Meraioth are passed over to shorten the list'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/7.htm'
    quote: 'in Ezra 7:3, between Azariah and Meraioth, six members are passed over, as is frequently the case in the longer genealogies, for the sake of shortening the list of names.'
  - where: 'note 7:1 “Ezra’s descent from Aaron”'
    claim: 'The verses emphasize Ezra''s priestly lineage and establish his authority to teach'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'This establishes Ezra’s authority and reliability in teaching the people. Ezra is portrayed in many ways like Moses in bringing the law to the people. These verses also emphasize his priestly lineage.'
  - where: 'note 7:1 “Ezra’s descent from Aaron”'
    claim: 'Ezra–Nehemiah consistently uses lineage to qualify for priesthood and leadership'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A consistent theme throughout Ezra and Nehemiah is the demonstration of accurate lineage to qualify people for the priesthood and leadership.'
  - where: 'note 7:6 “A ready scribe”'
    claim: '“Ready scribe” means an expert'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The adjective “ready scribe” in the King James Version means “one who is expert.”'
  - where: 'note 7:6 “A ready scribe”'
    claim: 'Ezra is portrayed like Moses bringing the law to the people'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Ezra is portrayed in many ways like Moses in bringing the law to the people.'
  - where: 'note 7:6 “A ready scribe”'
    claim: 'Under the monarchy a scribe was a court official; after the captivity the title was given to Ezra and teachers of the law'
    key: bd-scribe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scribe?lang=eng'
    quote: 'In the days of the Hebrew monarchy this was the title of a court official, a secretary of state (2 Sam. 8:17; 2 Kgs. 12:10; 18:18). After the captivity we find the title given to Ezra (7:6, 21) and to others who acted as teachers of the law.'
  - where: 'note 7:6 “A ready scribe”'
    claim: 'Calling Ezra a scribe skilled in the law of Moses shows worship restored in continuity with the past, with Moses as forerunner'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Ezra himself is identified as a scribe skilled in the law of Moses (Ezra 7:6).'
  - where: 'note 7:6 “A ready scribe”'
    claim: 'Moses is the legitimating forerunner; every act is shown as recovery of past practice'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Moses is the legitimating forerunner for the entire postexilic project. The writers are careful to show that every act in the reestablishment of temple worship is a recovery of past practices, not solely an invention of their own.'
  - where: 'note 7:6 “The hand of the LORD upon him”'
    claim: 'The phrase recurs through Ezra–Nehemiah and reads history as God''s benevolent hand behind the scenes'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The phrase “the hand of the Lord” appears throughout the record (Ezra 7:6, 7:28, 8:18, 8:22, 8:31; Nehemiah 2:8, 2:18), interpreting postexilic history as the benevolent hand of God working behind the scenes.'
  - where: 'note 7:6 “The hand of the LORD upon him”'
    claim: 'The journey was about 1,100 miles in four months'
    key: garner-ezra-unfolds
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/12/ezra-unfolds-the-scriptures?lang=eng'
    quote: 'Ezra and his group made the difficult journey of about 1,100 miles in just four months'
  - where: 'note 7:10 “Seek, do, teach”'
    claim: 'Ezra was a teacher who devoted himself to studying and observing the commands'
    key: garner-ezra-unfolds
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/12/ezra-unfolds-the-scriptures?lang=eng'
    quote: 'Ezra was a teacher, well versed in the scriptures, who had devoted himself to the study and observance of their commands and decrees.'
  - where: 'note 7:10 “Seek, do, teach”'
    claim: 'Elder Condie called Ezra one of the great teachers and prophet-leaders, citing 7:10'
    key: condie-scriptural-leadership
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1990/04/some-scriptural-lessons-on-leadership?lang=eng'
    quote: 'One of the great teachers and prophet-leaders in Israel was Ezra, who “had prepared his heart to seek the law of the Lord, and to do it, and to teach in Israel statutes and judgments” (Ezra 7:10).'
  - where: 'note 7:10 “Seek, do, teach”'
    claim: 'Condie spoke of a latter-day prophet who, like Ezra of old, prepared himself to receive the word and do the Lord''s will'
    key: condie-scriptural-leadership
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1990/04/some-scriptural-lessons-on-leadership?lang=eng'
    quote: 'like Ezra of old, has prepared himself to receive the word of the Lord and is prepared to do the Lord’s will.'
  - where: 'note 7:10 “Seek, do, teach”'
    claim: 'The object of Ezra''s mission was to teach; with Nehemiah he instructed the people, bringing the law, until then largely the priests'', within reach of every Jew'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'Along with Nehemiah he took steps to instruct the people in the Mosaic law (Neh. 8). Hitherto “the law” had been to a great extent the exclusive possession of the priests. It was now brought within the reach of every Jew.'
  - where: 'note 7:10 “Seek, do, teach”'
    claim: 'The footnote links “statutes” in 7:10 to Ezra''s reading of the law in Nehemiah 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: '10c “statutes”: Neh. 8:3 (1–8).'
  - where: 'note 7:23 “Why a Persian king paid for the house of God”'
    claim: 'The letter allowed offerings for the temple, supplemental resources from the treasury, and exempted temple workers from taxes'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'They were also allowed to acquire offerings to support the rebuilding of the temple with the possibility of supplemental resources from the royal treasury. According to this letter, temple functionaries were exempt from taxes.'
  - where: 'note 7:23 “Why a Persian king paid for the house of God”'
    claim: 'A government supporting a nonstate religion was rare'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'This is a rare situation when government actually supported the religious practice of a nonstate religion.'
  - where: 'note 7:23 “Why a Persian king paid for the house of God”'
    claim: 'The king''s motive, that priests offer acceptable offerings and pray for the king and his sons, recalls Ezra 6:10'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/7.htm'
    quote: 'The motive of the royal order, that the priests may offer acceptable offerings to the God of heaven, and pray for the life of the king and of his sons, recalls Ezra 6:10.'
  - where: 'note 7:23 “Why a Persian king paid for the house of God”'
    claim: 'Artaxerxes followed Cyrus and Darius and went beyond them'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/7.htm'
    quote: 'By granting these privileges, Artaxerxes was not only treading in the footsteps of Cyrus and Darius Hystaspes, but even going beyond these princes in granting to the Jews a jurisdiction of their own.'
  - where: 'note 7:26 “The law of God made the law of the king”'
    claim: 'The letter allowed Ezra to apply God''s laws within the community, with punishments'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'It also allowed Ezra to apply the laws of God within their community, including any appropriate punishments for disobedience.'
  - where: 'note 7:26 “The law of God made the law of the king”'
    claim: 'Ezra was directed to appoint magistrates and judges'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'He was also directed to appoint magistrates and judges.'
  - where: 'note 7:26 “The law of God made the law of the king”'
    claim: 'Ezra was charged to teach the law and then set up a system of judgment'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Ezra, the scribe of the law, was charged by the Persian king to teach the people in Jerusalem of the law and then set up a judgment system for the lawbreakers (see Ezra 7:25–26).'
  - where: 'note 7:26 “The law of God made the law of the king”'
    claim: 'In 7:26 the same Aramaic noun dāt (H1882) stands for the law of God and the law of the king'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'וְ/דָתָ/א֙'
  - where: 'note 7:27 “Ezra begins to speak”'
    claim: 'The Aramaic section of the chapter is 7:12–26'
    key: bd-aramaic
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aramaic?lang=eng'
    quote: 'Certain portions of the Old Testament are written in Aramaic (Ezra 4:8–6:18; 7:12–26;'
  - where: 'note 7:27 “Ezra begins to speak”'
    claim: 'Ezra''s memoirs, in Hebrew, begin at verse 27'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: '(Ezra’s own memoirs, written in Hebrew, begin at verse 27.)'
  - where: 'note 7:27 “Ezra begins to speak”'
    claim: 'Ezra–Nehemiah incorporates first-person memoir; Ezra''s is in Ezra 7–10'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'Ezra-Nehemiah are notable among the historical books of the Old Testament for the way in which they incorporate first-person memoir into anonymous third-person historiographical reports, royal correspondence, and official documents in Aramaic and Hebrew. (Look for Ezra''s memoir in Ezra 7–10'
  - where: 'note 7:27 “Ezra begins to speak”'
    claim: 'Ezra thanks God for inclining the king''s heart, and gathers Israel''s leaders'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Ezra offered a prayer thanking God for inclining the hearts of the king and his officials toward the temple and the Israelite community. Ezra also gathered some of Israel’s leaders to return to Jerusalem.'
  - where: 'note 7:27 “Ezra begins to speak”'
    claim: 'Ezra 8:15 continues the narrative from the end of chapter 7, with the leaders assembled'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Verse 15 continues the narrative from the end of chapter 7, when the leading men of Israel were assembled.'
  - where: 'christ'
    claim: 'Among the book''s values: the law as schoolmaster to bring men to Christ'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: '(4) preparation is needed for the rule of Messiah, the law being the schoolmaster to bring men to Christ.'
  - where: 'christ'
    claim: 'Ezra''s reforms shaped the religious climate of Jesus'' lifetime'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Ezra’s reforms made a lasting impact on the people and contributed to the religious climate that existed during the life of Jesus Christ.'
  - where: 'christ'
    claim: 'The footnote to “prepared” in 7:10 lists D&C 132:3 among its cross-references'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: '10a “prepared”: 3 Ne. 17:3; D&C 29:8; 58:6; 78:7; 132:3.'
