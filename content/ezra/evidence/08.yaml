chapter: 8
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Ezra left Babylon on the first day of the first month and reached Jerusalem on the first day of the fifth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: 'For upon the first day of the first month began he to go up from Babylon, and on the first day of the fifth month came he to Jerusalem, according to the good hand of his God upon him.'
  - where: 'setting'
    claim: 'In 458 B.C. Ezra obtained from Artaxerxes an edict allowing any exiles who wished to go, with temple offerings entrusted to him'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'In 458 B.C. he obtained from Artaxerxes an important edict (Ezra 7:12–26) allowing him to take to Jerusalem any Jewish exiles who cared to go, along with offerings for the temple with which he was entrusted'
  - where: 'setting'
    claim: 'Ezra 7–10 contains Ezra''s first-person memoir'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'they incorporate first-person memoir into anonymous third-person historiographical reports, royal correspondence, and official documents in Aramaic and Hebrew. (Look for Ezra''s memoir in Ezra 7–10'
  - where: 'setting'
    claim: 'Ezra''s memoir begins at 7:27'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: '(Ezra’s own memoirs, written in Hebrew, begin at verse 27.)'
  - where: 'setting'
    claim: 'The chapter: the company, fasting, the offerings carried, safe arrival, sacrifices, the king''s decree delivered'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Besides spiritually preparing themselves for the temple through fasting, the returnees physically carried with them the offerings and vessels delivered to the temple. They safely arrived in Jerusalem, offered sacrifices to purify themselves, and delivered the king’s decree to the local officials.'
  - where: 'thread'
    claim: '“The hand of the Lord” recurs in Ezra 7–8 as the benevolent hand of God working behind the scenes'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The phrase “the hand of the Lord” appears throughout the record (Ezra 7:6, 7:28, 8:18, 8:22, 8:31; Nehemiah 2:8, 2:18), interpreting postexilic history as the benevolent hand of God working behind the scenes.'
  - where: 'setting'
    claim: 'The site of Ahava is not known, so the length of the road cannot be determined'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/8.htm'
    quote: 'as we do not even know the locality of the place of meeting at the river Ahava, the length of road to be traversed cannot be determined.'
  - where: 'thread'
    claim: 'Lineage and registers define the restored community'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A consistent theme throughout Ezra and Nehemiah is the demonstration of accurate lineage to qualify people for the priesthood and leadership. This was a part of reconstituting and defining the identity of the religious community'
  - where: 'section 5 plain'
    claim: 'The king''s orders went to the satraps and governors of the province Beyond the River'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The king’s orders were delivered to the satraps and governors of the land to ensure obedience to the royal decree.'

  # ---- note 8:1 ----
  - where: 'note 8:1 “The houses that went up with Ezra”'
    claim: 'The list gives the clans of those returning with Ezra and the number of males registered'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Chapter 8 provides another lengthy genealogical list of those returning with Ezra to Jerusalem. Besides specific names of various priests, this list includes numbers of males registered within the Israelite clans'
  - where: 'note 8:1 “The houses that went up with Ezra”'
    claim: 'Demonstrating lineage was part of reconstituting and defining the community''s identity throughout Ezra–Nehemiah'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A consistent theme throughout Ezra and Nehemiah is the demonstration of accurate lineage to qualify people for the priesthood and leadership. This was a part of reconstituting and defining the identity of the religious community'
  - where: 'note 8:1 “The houses that went up with Ezra”'
    claim: 'Ithamar was Aaron''s son; Phinehas was the son of Eleazar, Aaron''s son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'And Eleazar Aaron’s son took him one of the daughters of Putiel to wife; and she bare him Phinehas'
  - where: 'note 8:1 “The houses that went up with Ezra”'
    claim: 'Most of the lay houses already had members in the first return (Ezra 2:3–15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/2?lang=eng'
    quote: 'The children of Parosh, two thousand an hundred seventy and two.'

  # ---- note 8:15 ----
  - where: 'note 8:15 “No Levites at the river”'
    claim: 'The sons of Levi of 8:15 are the Levites who were not priests, not descendants of Aaron'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Priests were thus a subgroup of the Levites. The sons referred to in Ezra 8:15are those of the Levites who were not priests, that is, those Levites who were not descendants of Aaron.'
  - where: 'note 8:15 “No Levites at the river”'
    claim: 'Ezra found no Levites and sent messengers elsewhere for temple attendants; verse 20 gives 220 Nethinim'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'He found no Levites there, so he sent messengers to other locations to bring temple attendants. Verse 20 may be the result of this search, as it provides the sum of 220 Nethinim, or temple servants.'
  - where: 'note 8:15 “No Levites at the river”'
    claim: 'The Levites Ezra brought later helped the people understand the law (Neh. 8:7)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'Also Jeshua, and Bani, and Sherebiah, Jamin, Akkub, Shabbethai, Hodijah, Maaseiah, Kelita, Azariah, Jozabad, Hanan, Pelaiah, and the Levites, caused the people to understand the law'

  # ---- note 8:21 ----
  - where: 'note 8:21 “A fast for a right way”'
    claim: 'Ezra 8:21, 23 is an account of public petitionary fasting, like Judges 20:26 and 2 Chronicles 20:3'
    key: ricks-fasting
    url: 'https://rsc.byu.edu/book-mormon-keystone-scripture/fasting-book-mormon-bible'
    quote: 'Esther 4:16 provides an instance of communal petitionary fasting, and accounts of public petitionary fasting are found in Judges 20:26; 2 Chronicles 20:3 2 Chronicles 20:3; Ezra 8:21, 23'
  - where: 'note 8:21 “A fast for a right way”'
    claim: '“Right way” means a smooth journey, a phrase in exilic texts of the return; fasting intensifies petitions before new undertakings'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The phrase “right way” (or smooth journey) in verse 21 appears in many other exilic texts that describe the return to Judah. Fasting to intensify one’s petitions to God, particularly before beginning new undertakings, was common throughout scriptural history.'
  - where: 'note 8:21 “A fast for a right way”'
    claim: 'Penitential fasting (Ezra 10:6) is a different kind'
    key: ricks-fasting
    url: 'https://rsc.byu.edu/book-mormon-keystone-scripture/fasting-book-mormon-bible'
    quote: 'There are several references in the Old Testament (but, again, none in the New Testament) to the practice of penitential fasting.'
  - where: 'note 8:21 “A fast for a right way”'
    claim: 'Ezra 10:6 is listed among penitential fasts'
    key: ricks-fasting
    url: 'https://rsc.byu.edu/book-mormon-keystone-scripture/fasting-book-mormon-bible'
    quote: 'cf. also Deuteronomy 9:18; Ezra 10:6; Nehemiah 9:1; Joel 1:14, 2:12–17; Jonah 3:5–9'

  # ---- note 8:22 ----
  - where: 'note 8:22 “Ashamed to ask for soldiers”'
    claim: 'Having confessed God''s protection before the king, they wished to make it good by supplication'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/8.htm'
    quote: 'This confession, which they had uttered before the king, they desired to make good by earnest humble supplication, that God would prove Himself their help and defence against all their enemies.'
  - where: 'note 8:22 “Ashamed to ask for soldiers”'
    claim: 'Having boasted of confidence in God, Ezra could hardly ask for an escort'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Ezra is faced with a long and dangerous journey at a time of great unrest. And having boasted his confidence in God, he can hardly now apply to the king for an escort!'
  - where: 'note 8:22 “Ashamed to ask for soldiers”'
    claim: 'Nehemiah later travelled with a military escort the king gave him as governor, where Ezra had been ashamed to ask'
    key: keil-nehemiah
    url: 'https://biblehub.com/commentaries/kad/nehemiah/2.htm'
    quote: 'Ezra had been ashamed to request a military escort from the Persian monarch (Ezra 8:22); but the king gave to the high dignitary called Pecha a guard of soldiers'
  - where: 'note 8:22 “Ashamed to ask for soldiers”'
    claim: 'Nehemiah 2:9: the king sent captains and horsemen with Nehemiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/2?lang=eng'
    quote: 'Now the king had sent captains of the army and horsemen with me.'
  - where: 'note 8:22 “Ashamed to ask for soldiers”'
    claim: 'The hand of the Lord in 8:22 and 8:31 is God''s benevolent hand behind events'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: 'The phrase “the hand of the Lord” appears throughout the record (Ezra 7:6, 7:28, 8:18, 8:22, 8:31; Nehemiah 2:8, 2:18), interpreting postexilic history as the benevolent hand of God working behind the scenes.'

  # ---- note 8:28 ----
  - where: 'note 8:28 “Holy men for holy things”'
    claim: 'A talent was about 75.6 pounds'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Talent. (Hebrew kikkar); equivalent to 3,000 shekels (see Ex. 38:25, 26); about 75.6 pounds, or 34.272 kilograms.'
  - where: 'note 8:28 “Holy men for holy things”'
    claim: 'Kadosh means set apart or consecrated; people and objects can be holy; Ezra reminded the priests they themselves are consecrated'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'reminding the priests that they themselves are consecrated to the Lord. Verse 28 translates the Hebrew word kadosh to signify something that is set apart or consecrated for the Lord. People and objects can be considered holy or set apart.'
  - where: 'note 8:28 “Holy men for holy things”'
    claim: 'The gifts were the freewill offering of the king, his counsellors and the people (Ezra 7:15–16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: 'with the freewill offering of the people, and of the priests, offering willingly for the house of their God which is in Jerusalem'

  # ---- note 8:31 ----
  - where: 'note 8:22 “Ashamed to ask for soldiers”'
    claim: 'At 8:31, apparently some unexplained ambush occurred on the way, and God delivered the group'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A brief summary is given of Ezra and the group’s trip to Jerusalem. Apparently, some unexplained am - bush occurred along the way, but God delivered the group from it.'

  # ---- note 8:35 ----
  - where: 'note 8:35 “Offerings for all Israel”'
    claim: 'Twelve bullocks and twelve goats for the twelve tribes as in 6:17; 96 is 8 x 12 and 77 an intensified seven'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/8.htm'
    quote: '"burnt-offerings to the God of Israel, twelve bullocks for all Israel" (the twelve tribes), and twelve he-goats for a sin-offering, as in Ezra 6:17. Ninety-six (8 x 12) lambs and seventy-seven lambs (77, the intensified seven)'
  - where: 'note 8:35 “Offerings for all Israel”'
    claim: 'The sin offering atoned for all Israel; the burnt offerings typified the nation''s surrender to the Lord, a resolve to dedicate their lives'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/8.htm'
    quote: 'The sin-offerings availed as an atonement for the sins of all Israel, and the burnt-offerings typified the surrender of the entire nation to the service of the Lord.'
  - where: 'note 8:35 “Offerings for all Israel”'
    claim: 'Nothing of the burnt offering could be eaten by the offerers; sin offering preceded'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/8.htm'
    quote: '"All this was a burnt-offering for the Lord," of which, therefore, nothing could be eaten by the offerers. The sin-offering preceded the burnt-offering'
  - where: 'note 8:35 “Offerings for all Israel”'
    claim: 'The offerings were sacrificed as purification offerings shortly after arrival'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'They also sacrificed burnt offerings of bulls, rams, lambs, and he-goats as purification offerings.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Fasting before new undertakings; Jesus fasted before His ministry; strength from fasting with specific purposes'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Jesus fasted before beginning His formal ministry. We likewise can draw great strength from fasting with specific purposes in mind.'
  - where: 'christ'
    claim: 'The Lord taught the religious value of fasting'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'Our Lord taught the religious value of fasting (Matt. 6:16–18; 9:15; Luke 4:2).'
