chapter: 9
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Ezra''s commission from Artaxerxes is dated 458 B.C.'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'In 458 B.C. he obtained from Artaxerxes an important edict (Ezra 7:12–26) allowing him to take to Jerusalem any Jewish exiles who cared to go'
  - where: 'setting'
    claim: 'Ezra''s commission in 458 B.C.; his first reform on arriving was the separation from foreign wives'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'On arriving in Jerusalem his first reform was to cause the Jews to separate from their foreign wives, and a list is given of those who had offended in this way (Ezra 10).'
  - where: 'setting'
    claim: 'Ezra 7–10 contains Ezra''s first-person memoir'
    key: welch-religious-authority
    url: 'https://mi.byu.edu/old-testament-reflections/once-lost-religious-authority-is-hard-to-rebuild'
    quote: '(Look for Ezra''s memoir in Ezra 7–10 and Nehemiah''s principally in Nehemiah 1–7.)'
  - where: 'setting'
    claim: 'The Student Manual sets Ezra''s concern in Ezra 9 beside Nehemiah''s in Nehemiah 13:23–27'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Compare Ezra’s concern for the Jews’ unrighteous intermarrying recorded in Ezra 9:1–15with that of Nehemiah, the governor, recorded in Nehemiah 13:23–27.'
  - where: 'thread'
    claim: 'The prayer moves from shame, through God''s punishment and renewed pity, to the commands broken again, to guilt before a just God'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'The train of thought in this prayer is as follows: I scarcely dare to lift up my fact to God, through shame for the greatness of our misdeeds (Ezra 9:6).'
  - where: 'thread'
    claim: 'Ezra sorrowed at marriages out of the covenant; the people covenanted to repent'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Ezra sorrowed when he learned that some of the Jews in Jerusalem had married out of the covenant. He counseled the people to repent, and they made a covenant to repent of their sins.'

  # ---- plain sections ----
  - where: 'section 1 plain'
    claim: '“Astonied” (meshomem) means stunned, motionless'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'desolate, rigid, stunned, without motion'
  - where: 'section 1 plain'
    claim: '“Those that had been carried away” are the returned exiles'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'to fast and mourn over the transgression of those who had returned from captivity'
  - where: 'section 2 plain'
    claim: '“Heaviness” is humiliation; on arising he rent his clothes again'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'humiliation, generally through fasting, here through sitting motionless in deep affliction of soul'
  - where: 'section 2 plain'
    claim: '“A little space” is a brief moment, the time since Cyrus released them'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'He calls the short interval between their release from captivity by Cyrus, and the time when he is speaking'
  - where: 'section 2 plain'
    claim: 'The “nail” is a peg, figurative of a secure position'
    key: bdb
    url: 'https://biblehub.com/hebrew/3489.htm'
    quote: 'b. a peg for hanging Ezekiel 15:3; so figurative of Eliakim Isaiah 22:23,24; of secure position Ezra 9:8'
  - where: 'section 3 plain'
    claim: '“Such deliverance as this” is the escaped remnant'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'yea, Thou our God has spared us more than our iniquity deserved, and hast given us this escaped remnant'

  # ---- notes ----
  - where: 'note 9:1 “The danger was their worship”'
    claim: 'The law forbade the marriages because they would turn Israel to other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'For they will turn away thy son from following me, that they may serve other gods: so will the anger of the Lord be kindled against you, and destroy thee suddenly.'
  - where: 'note 9:1 “The danger was their worship”'
    claim: 'Intermarriage was forbidden because it led to idolatry, which had brought the nation down'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Intermarriage with people from some of the surrounding nations was expressly forbidden by the Lord because it led to idolatry (see Deuteronomy 7:1–5). Idolatry had led to the downfall of the Israelite nation'
  - where: 'note 9:1 “The danger was their worship”'
    claim: 'Scripture Helps describes the marriages as out of the covenant'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Ezra sorrowed when he learned that some of the Jews in Jerusalem had married out of the covenant.'
  - where: 'note 9:1 “The danger was their worship”'
    claim: 'Israel was forbidden to intermarry with Canaanites lest they abandon their covenants; this does not make such marriage inherently sinful'
    key: sc-knowhy-110
    url: 'https://scripturecentral.org/knowhy/why-did-book-of-mormon-prophets-discourage-nephite-lamanite-intermarriage'
    quote: 'the Israelites were forbidden from intermarrying with Canaanites, lest they abandon their covenants with the Lord. This is not to say that interracial marriage is inherently sinful.'

  - where: 'note 9:5 “A public prayer at the hour of the offering”'
    claim: 'At the evening sacrifice Ezra made a public confession of the people''s guilt'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'At the time of the evening sacrifice, Ezra made a public confession of the people’s guilt.'
  - where: 'note 9:5 “A public prayer at the hour of the offering”'
    claim: 'The psalmist joins the lifting up of hands in prayer to the evening sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'Let my prayer be set forth before thee as incense; and the lifting up of my hands as the evening sacrifice.'
  - where: 'note 9:5 “A public prayer at the hour of the offering”'
    claim: 'Daniel was praying about the time of the evening oblation when Gabriel came'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'touched me about the time of the evening oblation.'
  - where: 'note 9:5 “A public prayer at the hour of the offering”'
    claim: 'Ezra prayed weeping before the house of God, and a very great congregation gathered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/10?lang=eng'
    quote: 'Now when Ezra had prayed, and when he had confessed, weeping and casting himself down before the house of God, there assembled unto him out of Israel a very great congregation of men and women and children: for the people wept very sore.'

  - where: 'note 9:6 “Confessing in the plural”'
    claim: 'Ezra had come with a commission to teach the law'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: 'The object of his mission was “to teach in Israel statutes and judgments.”'
  - where: 'note 9:6 “Confessing in the plural”'
    claim: 'The remnant were still bondmen under the kings of Persia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'For we were bondmen; yet our God hath not forsaken us in our bondage, but hath extended mercy unto us in the sight of the kings of Persia'

  - where: 'note 9:8 “A peg in His holy place”'
    claim: 'The yathed is a peg for hanging, used figuratively of Eliakim and of a secure position in Ezra 9:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/3489.htm'
    quote: 'b. a peg for hanging Ezekiel 15:3; so figurative of Eliakim Isaiah 22:23,24; of secure position Ezra 9:8'
  - where: 'note 9:8 “A peg in His holy place”'
    claim: 'Verse 9 names the house of God set up and its desolations repaired'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'to set up the house of our God, and to repair the desolations thereof'

  - where: 'note 9:9 “A wall of protection”'
    claim: 'Gader is the wall or fence of a vineyard, an image of protection, given them by the kings of Persia'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'means the wall of a vineyard, the wall or fence built for its protection (Isaiah 5:2, Isaiah 5:5). Hence the wall, or enclosure, is an image of protection from the incursions and attacks of enemies. Such a wall has been given them in Judah and Jerusalem by the kings of Persia.'
  - where: 'note 9:9 “A wall of protection”'
    claim: 'The wall is a figure for a safe dwelling, not a walled place'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'The meaning is not that they possess a place defended by walls'
  - where: 'note 9:9 “A wall of protection”'
    claim: 'The city wall was finished under Nehemiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/6?lang=eng'
    quote: 'So the wall was finished in the twenty and fifth day of the month Elul, in fifty and two days.'

  - where: 'note 9:11 “The prophets and the law”'
    claim: 'The words Ezra cites are found in these terms in no one place; not a verbal quotation'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'They are not, therefore, to be regarded as a verbal quotation'
  - where: 'note 9:11 “The prophets and the law”'
    claim: 'Ezra had chiefly Deut. 7:1–3 in view'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'refers to the Mosaic age, and in using it Ezra had chiefly in view Deuteronomy 7:1-3'
  - where: 'note 9:11 “The prophets and the law”'
    claim: 'The prohibition follows Deut. 7:3; “nor seek their peace” is almost verbally Deut. 23 (Hebrew 23:7 = KJV 23:6), said of Ammonites and Moabites'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'The addition: nor seek their peace, etc., is taken almost verbally from Deuteronomy 23:7, where this is said in respect of the Ammonites and Moabites.'
  - where: 'note 9:11 “The prophets and the law”'
    claim: 'Ezra says “the prophets” generally, as the books of Kings do'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'He says quite generally, by His servants the prophets, as the author of the books of Kings does in similar cases'
  - where: 'note 9:11 “The prophets and the law”'
    claim: 'Moses speaks in Deuteronomy after the manner of the prophets'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'The sayings of Moses in Deuteronomy also bear a prophetical character'
  - where: 'note 9:11 “The prophets and the law”'
    claim: 'Kings speaks of what the Lord said by all his servants the prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'as he had said by all his servants the prophets.'
  - where: 'note 9:11 “The prophets and the law”'
    claim: 'Deut. 7:1 names the Canaanite peoples'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'the Hittites, and the Girgashites, and the Amorites, and the Canaanites, and the Perizzites, and the Hivites, and the Jebusites'
  - where: 'note 9:11 “The prophets and the law”'
    claim: 'Deut. 23:3 concerns Ammonites and Moabites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'An Ammonite or Moabite shall not enter into the congregation of the Lord'

  - where: 'note 9:15 “A prayer that asks for nothing”'
    claim: 'Shechaniah answered, we have trespassed, yet there is hope'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/10?lang=eng'
    quote: 'We have trespassed against our God, and have taken strange wives of the people of the land: yet now there is hope in Israel concerning this thing.'
  - where: 'note 9:15 “A prayer that asks for nothing”'
    claim: 'The people answered with a covenant to repent'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'He counseled the people to repent, and they made a covenant to repent of their sins.'

  # ---- christ ----
  - where: 'christ'
    claim: 'The Lord forgives those who confess and forsake their sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'By this ye may know if a man repenteth of his sins—behold, he will confess them and forsake them.'
  - where: 'christ'
    claim: 'Ezra''s counsel led to a covenant to repent'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'He counseled the people to repent, and they made a covenant to repent of their sins.'
