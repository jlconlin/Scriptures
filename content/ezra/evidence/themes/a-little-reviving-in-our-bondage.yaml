page: a-little-reviving-in-our-bondage
claims:
  - where: 'opening'
    claim: 'Connection made by this page: Ezra’s return, read as a picture, shows the difference between being brought back and being changed; coming home is one gift and a new heart another, and the second is what Jesus Christ came to give'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'to give us a nail in his holy place, that our God may lighten our eyes, and give us a little reviving in our bondage.'
  - where: 'section “A captivity ended”'
    claim: 'The Bible Dictionary says the captivity was brought to a close by the decree of Cyrus'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'The captivity was brought to a close by the decree of Cyrus in 536 B.C. (Ezra 1:2)'
  - where: 'section “The children of the captivity”'
    claim: 'The lexicon lists bĕnê haggôlâ, “exiles,” in Ezra at 4:1; 6:19, 20; 8:35; 10:7, 16'
    key: bdb
    url: 'https://biblehub.com/hebrew/1473.htm'
    quote: 'בני הגולה exiles Ezra 4:1; Ezra 6:19,20; Ezra 8:35; Ezra 10:7,16'
  - where: 'section “Bondmen, and not forsaken”'
    claim: 'The Church edition’s footnote at Ezra 9:8 “nail” cites Isaiah 22:23, the nail in a sure place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'Isa. 22:23 (23, 25)'
  - where: 'section “Bondmen, and not forsaken”'
    claim: 'Ezra 9:9 is a verbless clause, “bondmen we” (ʿăbādîm ʾănaḥnû)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'עֲבָדִ֣ים'
  - where: 'section “Bondmen, and not forsaken”'
    claim: 'A modern translation gives the clause of 9:9 in the present tense'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezra+9%3A8-9&version=ESV'
    quote: 'For we are slaves. Yet our God has not forsaken us in our slavery'
  - where: 'section “Bondmen, and not forsaken”'
    claim: 'Keil reads “bondmen” of the Persian yoke'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'still bondmen, for they are yet under the Persian yoke'
  - where: 'section “Bondmen, and not forsaken”'
    claim: 'The Student Manual calls the Israel of Ezra and Nehemiah a tiny nation in bondage'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'They were a tiny nation in bondage, surrounded by nations stronger than they were.'
  - where: 'section “Bondmen, and not forsaken”'
    claim: 'The Student Manual says of Ezra’s day that defeat and exile had not taught the people their lesson'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'even the horrors of defeat and exile had not taught the people their lesson'
  - where: 'section “Bondmen, and not forsaken”'
    claim: 'Connection made by this page: Ezra, kneeling before a finished temple, speaks of a people brought back, given a sure place and not forsaken, who are yet bondmen that have forsaken the commandments (9:7–10); arriving and being changed are different things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'for we have forsaken thy commandments'
  - where: 'section “A gathering and a new heart”'
    claim: 'The Church edition’s heading to Ezekiel 36 places the gathering and the new heart in the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'In the last days, all the house of Israel will be gathered to their own lands—The Lord will give them a new heart and a new spirit'
  - where: 'section “A gathering and a new heart”'
    claim: 'Scripture Helps reads Jeremiah’s new covenant as revealed anew in the last days'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'would be revealed anew in the last days'
  - where: 'section “A gathering and a new heart”'
    claim: 'Scripture Helps: the law written in the heart symbolizes true conversion'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'symbolizing their true conversion'
  - where: 'section “A gathering and a new heart”'
    claim: 'The Bible Dictionary calls the captivity a time of great spiritual revival, citing Ezek. 36:24–28, that stopped the old sin of idolatry'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'It put a stop to the old sin of idolatry; it was a time of great spiritual revival (Ezek. 36:24–28)'
  - where: 'section “A gathering and a new heart”'
    claim: 'The Student Manual says of Ezra’s generation that the lesson had not been learned'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'even the horrors of defeat and exile had not taught the people their lesson'
  - where: 'section “A gathering and a new heart”'
    claim: 'The Church edition’s footnote at Ezra 10:12 “do” cites Mosiah 5:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/10?lang=eng'
    quote: 'Mosiah 5:5 (1–5)'
  - where: 'section “A gathering and a new heart”'
    claim: 'Connection made by this page: Moses, Ezekiel and Jeremiah join the gathering of Israel to a changed heart; Ezra shows a gathering in full and the change only starting, in the weeping of 10:1, the book’s one “hope” (10:2) and the covenant answer of 10:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'A new heart also will I give you, and a new spirit will I put within you'
  - where: 'section “The servant and the Son”'
    claim: 'The New Testament Student Manual: a son has a rightful place in the house'
    key: nt-student-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-the-gospel-according-to-st-john/chapter-24-john-8-10?lang=eng'
    quote: 'has a rightful place'
  - where: 'section “The servant and the Son”'
    claim: 'The New Testament Student Manual: through His Atonement Christ extends that rightful place to His followers'
    key: nt-student-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-the-gospel-according-to-st-john/chapter-24-john-8-10?lang=eng'
    quote: 'Through His Atonement, Jesus Christ extends that rightful place to each of His followers'
  - where: 'section “The servant and the Son”'
    claim: 'The New Testament Student Manual: the father received the prodigal as a son, not a servant'
    key: nt-student-manual-18
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-the-gospel-according-to-st-luke/chapter-18-luke-15-17?lang=eng'
    quote: 'the father accepted the returning prodigal as his son, not as a servant or a sinner'
  - where: 'section “The servant and the Son”'
    claim: 'To redeem is to free a person from bondage by payment'
    key: gs-redeem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeem-redeemed-redemption?lang=eng'
    quote: 'To deliver, to purchase, or to ransom, such as to free a person from bondage by payment.'
  - where: 'section “The servant and the Son”'
    claim: 'Connection made by this page: Ezra’s “bondmen… for our iniquities” (9:7–9) set beside Jesus’ “servant of sin” and the Son who makes free (John 8:33–36), and beside the prodigal who planned to return as a hired servant and was received as a son (Luke 15:19–24); Ezra confesses the condition and the Son ends it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: 'And the servant abideth not in the house for ever: but the Son abideth ever.'
  - where: 'section “Returning and becoming”'
    claim: 'President Oaks: the Final Judgment acknowledges what we have become'
    key: oaks-challenge-become
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2000/10/the-challenge-to-become?lang=eng'
    quote: 'It is an acknowledgment of the final effect of our acts and thoughts—what we have become.'
  - where: 'section “Returning and becoming”'
    claim: 'President Oaks: the commandments, ordinances and covenants are not a list of deposits but a plan for becoming'
    key: oaks-challenge-become
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2000/10/the-challenge-to-become?lang=eng'
    quote: 'are not a list of deposits required to be made in some heavenly account. The gospel of Jesus Christ is a plan that shows us how to become what our Heavenly Father desires us to become.'
  - where: 'section “Returning and becoming”'
    claim: 'Elder Christofferson: through Christ we become holy as He and the Father are holy'
    key: christofferson-born-again
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/born-again?lang=eng'
    quote: 'through Christ you will become holy, as He and our Father are holy'
  - where: 'section “Returning and becoming”'
    claim: 'Elder Christofferson: being born again is more a process than an event, and the central purpose of mortality'
    key: christofferson-born-again
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/born-again?lang=eng'
    quote: 'Being born again, unlike our physical birth, is more a process than an event. And engaging in that process is the central purpose of mortality.'
  - where: 'section “Returning and becoming”'
    claim: 'Connection made by this page: the journey back to the Lord’s house in Ezra is read as an image of a disciple’s hope to return to God’s presence, and Ezra’s prayer at its end as a reminder that arriving is not all God intends; the doctrine of becoming is the Savior’s and His servants’ (3 Ne. 12:48; 27:27)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/27?lang=eng'
    quote: 'what manner of men ought ye to be? Verily I say unto you, even as I am'
