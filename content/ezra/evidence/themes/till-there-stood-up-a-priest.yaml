page: till-there-stood-up-a-priest
claims:
  - where: 'opening'
    claim: 'Connection made by this page: the lists of Ezra 2 and Ezra 10 and the prayer between them are read together as one question, who can serve as a priest before God; the book leaves a need exposed, and Hebrews describes the priest who meets it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/2?lang=eng'
    quote: 'till there stood up a priest with Urim and with Thummim'
  - where: 'section “Not found”'
    claim: 'Under the law the priests had to be Aaron’s sons'
    key: bd-priests
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'The priests must be Aaron’s sons'
  - where: 'section “Not found”'
    claim: 'The Urim and Thummim was an instrument for obtaining revelation from the Lord'
    key: bd-urim-and-thummim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/urim-and-thummim?lang=eng'
    quote: 'An instrument prepared of God to assist man in obtaining revelation from the Lord'
  - where: 'section “Not found”'
    claim: 'Keil: the governor’s expectation of a high priest with Urim and Thummim was unfulfilled'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'This expectation, however, was unfulfilled.'
  - where: 'section “Not found”'
    claim: 'The Bible Dictionary reports that the Jews reckoned the Urim and Thummim among what the second temple lacked'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'The Jews reckoned the temple of Zerubbabel to be in five points inferior to the temple of Solomon'
  - where: 'section “Not found”'
    claim: 'The Bible Dictionary’s list of the five points includes the Urim and Thummim, citing Ezra 2:63'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: '(3) the Urim and the Thummim (Ezra 2:63)'
  - where: 'section “Before thee in our trespasses”'
    claim: 'Keil: Ezra does not pray for pardon, wanting the congregation to know the greatness of their transgression and to act'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/9.htm'
    quote: 'Ezra does not pray for the pardon of their sin, for he desires only to bring the congregation to the knowledge of the greatness of their transgression'
  - where: 'section “Before thee in our trespasses”'
    claim: '“Stand” in 9:15 is H5975 ʿāmad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'לַ/עֲמ֛וֹד'
  - where: 'section “Before thee in our trespasses”'
    claim: '“Stood up” in 2:63 is H5975 ʿāmad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'עֲמֹ֥ד'
  - where: 'section “Before thee in our trespasses”'
    claim: 'The lexicon gives 2:63 the sense arise, appear'
    key: bdb
    url: 'https://biblehub.com/hebrew/5975.htm'
    quote: 'arise, appear, come on the scene'
  - where: 'section “Before thee in our trespasses”'
    claim: '“Found” at 10:18 is H4672 in the Niphal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'וַ/יִּמָּצֵא֙'
  - where: 'section “Before thee in our trespasses”'
    claim: '“Not found” at 2:62 is H4672 in the Niphal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'נִמְצָ֑אוּ'
  - where: 'section “Before thee in our trespasses”'
    claim: 'Connection made by this page: 2:63 and 9:15 share a verb and, more to the point, a subject, a priest before God; with “not found” (2:62) and “found” (10:18) they show that a register can tell who is a son of Aaron and could not make him able to stand before God; the ram of 10:19 is offered by guilty priests for themselves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'for we cannot stand before thee because of this'
  - where: 'section “The high priest in filthy garments”'
    claim: '“Standing” in Zech. 3:1 is H5975'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'עֹמֵ֕ד'
  - where: 'section “The high priest in filthy garments”'
    claim: 'The Church edition’s heading reads Zechariah 3 of the Messiah, the Branch'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'Zechariah speaks about the Messiah—The Branch will come'
  - where: 'section “The high priest in filthy garments”'
    claim: '“Who shall stand” in Mal. 3:2 is H5975'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mal.xml'
    quote: 'הָ/עֹמֵ֖ד'
  - where: 'section “The high priest in filthy garments”'
    claim: 'Connection made by this page: Zechariah 3 and Malachi 3:2–3, in Ezra’s verb, agree with his prayer and go beyond it: the high priest is cleansed by Another and then given a place among those who stand (3:4, 7), and the Lord Himself will purify the sons of Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'Behold, I have caused thine iniquity to pass from thee'
  - where: 'section “Another priest”'
    claim: 'The Joseph Smith Translation puts “without father, without mother, without descent” on the order of the priesthood'
    key: jst-heb-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-heb/7?lang=eng'
    quote: 'For this Melchizedek was ordained a priest after the order of the Son of God, which order was without father, without mother, without descent'
  - where: 'section “Another priest”'
    claim: 'The New Testament Student Manual contrasts the Melchizedek Priesthood with the Aaronic order, which came by lineage'
    key: nt-student-manual-49
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-49-hebrews-7-13?lang=eng'
    quote: 'unlike the Levitical or Aaronic order in ancient times, the Melchizedek Priesthood is not conferred based on lineage alone'
  - where: 'section “Another priest”'
    claim: 'The New Testament Student Manual: the Savior’s right to the priesthood rests not on ancestry'
    key: nt-student-manual-49
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-49-hebrews-7-13?lang=eng'
    quote: 'His right to the priesthood would be based not on ancestry but on “the power of an endless life”'
  - where: 'section “Another priest”'
    claim: 'Scripture Central: Christ could be the Great High Priest without being a Levite or a descendant of Aaron'
    key: sc-knowhy-643
    url: 'https://scripturecentral.org/knowhy/how-does-the-joseph-smith-translation-teach-us-about-melchizedek'
    quote: 'Jesus Christ could act as the Great High Priest without being either a Levite or a descendent of Aaron'
  - where: 'section “Another priest”'
    claim: 'Connection made by this page: by the test of Ezra 2:62 the name of Jesus, of Judah, would not have been found among the sons of Aaron (Heb. 7:13–14); the need Ezra 2:63 and 9:15 leave exposed is met by the priest of Hebrews 7, sinless where Ezra said “our iniquities,” pleading where Ezra’s prayer asked nothing, and living for ever to intercede. The page does not say 2:63 prophesies Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'For it is evident that our Lord sprang out of Juda; of which tribe Moses spake nothing concerning priesthood.'
  - where: 'section “Through the merits of the Holy Messiah”'
    claim: 'Connection made by this page: Ezra’s “we cannot stand before thee” set beside 2 Ne. 2:8, Moro. 6:4 and Heb. 4:14–16; the priests of 2:62–63, told to wait for a priest, picture in that one respect everyone who comes before God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'there is no flesh that can dwell in the presence of God, save it be through the merits, and mercy, and grace of the Holy Messiah'
