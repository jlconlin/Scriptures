chapter: 1
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Persia conquered Babylon in 539 B.C. and the decree of Cyrus came about a year later'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'In 539 BC, Persia conquered the kingdom of Babylon. About a year later, the Lord inspired King Cyrus of Persia to issue a decree allowing many exiled Jews in Babylon to return to Jerusalem to rebuild the temple.'
  - where: 'setting'
    claim: 'Ezra opens with the record that also concludes Chronicles, transferred to the beginning of the history of the restoration; hence the opening “and”'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/1.htm'
    quote: 'The opening word, "and in the first year," etc., is to be explained by the circumstance that what is here recorded forms also, in 2 Chronicles 36:22 and 2 Chronicles 36:23, the conclusion of the history of the kingdom of Judah at its destruction by the Chaldeans, and is transferred thence to the beginning of the history of the restoration'
  - where: 'setting'
    claim: 'The first two and a half verses are also in 2 Chronicles 36:22–23'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The first two and a half verses are also found in 2 Chronicles 36:22–23'
  - where: 'setting'
    claim: 'Ezra and Nehemiah were once one book, perhaps a sequel to Chronicles; the second group came about 60 years after the temple was dedicated'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'led the second group to Jerusalem about 60 years after the temple was dedicated. The books of Ezra and Nehemiah were once a single book. They may have been written as a sequel to the books of Chronicles.'
  - where: 'setting'
    claim: 'Babylon captured Judah in 597 B.C. and exiled thousands; Cyrus defeated Babylon in 539 B.C. and let exiled peoples return'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'The Babylonians captured the Southern Kingdom of Judah in 597 BC and exiled thousands of Israelites to Babylon. Later, in 539 BC, Babylon was itself defeated by Cyrus, the first king of the Persian empire.'
  - where: 'setting'
    claim: 'The book has two parts, chapters 1–6 (first return, temple rebuilt despite opposition) and 7–10 (Ezra’s group)'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Ezra 1–6: The first group of Jews returned to Jerusalem to rebuild the temple. Although they faced great opposition, they eventually completed and dedicated the temple.'
  - where: 'setting'
    claim: 'The chapter falls into the decree (1–4), the offerings (5–6), and the vessels (7–11)'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: '1:1–4. The Lord stirs up the spirit of Cyrus … 1:5–6. Offerings to build the temple … 1:7–11. Catalogue of temple vessels and offerings'
  - where: 'thread'
    claim: 'The same verb (H5782, “stirred up” / “raised”) is used in 1:1 and 1:5, and only there in Ezra'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'הֵעִ֣יר'
  - where: 'thread'
    claim: 'Cyrus’s actions fulfilled the prophecies of Isaiah and Jeremiah'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'Cyrus’s actions fulfilled prophecies that Isaiah and Jeremiah made many years earlier.'
  - where: 'section 1 plain'
    claim: '“Whosoever remaineth” rendered “every survivor”: the participle with the article means the survivors'
    key: bdb
    url: 'https://biblehub.com/hebrew/7604.htm'
    quote: 'be left alive, survive, Genesis 7:23 (J), Ezekiel 9:8 (but on text see above); ׳הַנּ = the survivors'

  # ---- note 1:1 ----
  - where: 'note 1:1 “Why a Persian king sent them home”'
    claim: 'Ezra 1:1 alludes to Jeremiah’s prophecy of the seventy-year exile ending when Babylon was destroyed'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'This passage alludes to a prophecy of Jeremiah concerning the seventy-year exile when Babylon was destroyed (see Jeremiah 25:12).'
  - where: 'note 1:1 “Why a Persian king sent them home”'
    claim: 'Josephus says Cyrus knew of it by reading Isaiah’s book, admired the divine power, and desired to fulfil what was written'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-11.html'
    quote: 'This was known to Cyrus by his reading the book which Isaiah left behind him of his Prophecies. … when Cyrus read this, and admired the divine power, an earnest desire and an ambition seized upon him, to fulfil what was so written.'
  - where: 'note 1:1 “Why a Persian king sent them home”'
    claim: 'The Bible Dictionary suggests the decree was possibly a token of gratitude for help in the conquest'
    key: bd-cyrus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cyrus?lang=eng'
    quote: 'He issued a decree allowing the Jews to return to the land of Judah and rebuild the temple, possibly as a token of gratitude for assistance given to him in his conquest'
  - where: 'note 1:1 “Why a Persian king sent them home”'
    claim: 'The Cyrus Cylinder extended the decree to other nations, letting them worship their own gods and build their own temples'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The Cyrus Cylinder expanded this decree to other nations, giving them permission to worship their own gods and build their own temples.'

  # ---- note 1:4 ----
  - where: 'note 1:4 “Who helps whom”'
    claim: '“Whosoever remaineth” is the participle hanniš’ār of H7604'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'הַ/נִּשְׁאָ֗ר'
  - where: 'note 1:4 “Who helps whom”'
    claim: 'The verb means remain, be left over; the participle with the article = the survivors, and as a technical term the remnant (Isa. 4:3)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7604.htm'
    quote: 'be left alive, survive, Genesis 7:23 (J), Ezekiel 9:8 (but on text see above); ׳הַנּ = the survivors, Genesis 14:10; 1 Samuel 11:11; Ezekiel 17:21; participle as technical term = the (purified) remainder, remnant (compare שְׁאָר, שְׁאֵרִית) Isaiah 4:3'
  - where: 'note 1:4 “Who helps whom”'
    claim: 'One reading: those who remained behind were to send resources; the project depended particularly on them'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'This project required financial support, particularly from those Jews who decided to remain in Babylon.'

  # ---- note 1:5 ----
  - where: 'note 1:5 “Not everyone went”'
    claim: '“Raised” in 1:5 is the same verb as “stirred up” in 1:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezra.xml'
    quote: 'הֵעִ֤יר'
  - where: 'note 1:5 “Not everyone went”'
    claim: 'Josephus: many stayed in Babylon, unwilling to leave their possessions'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-11.html'
    quote: 'Yet did many of them stay at Babylon; as not willing to leave their possessions.'
  - where: 'note 1:5 “Not everyone went”'
    claim: 'Those who stayed behind sent offerings to support the temple construction'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Those who stayed behind sent silver, gold, animals, precious things, and other offerings to support the temple construction.'

  # ---- note 1:8 ----
  - where: 'note 1:8 “Who was Sheshbazzar?”'
    claim: 'The Bible Dictionary takes Sheshbazzar as Zerubbabel’s Persian name'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'Zerubbabel was also known by the Persian name Sheshbazzar (Ezra 1:8, etc.).'
  - where: 'note 1:8 “Who was Sheshbazzar?”'
    claim: 'Student Manual: Sheshbazzar is governor in 5:14 but not in the list of returnees; 1 Esdras makes them two; evidence favors two persons, both royal, both probably appointed by Cyrus; Zerubbabel outlived the older Sheshbazzar'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'The book of 1 Esdras 6:18 in the Apocrypha and other authorities say they are two people. The evidence seems to favor the idea of two separate persons. Both were of the royal line of Judah, and both were probably appointed by Cyrus.'
  - where: 'note 1:8 “Who was Sheshbazzar?”'
    claim: 'Zerubbabel became better known because he outlived the older Sheshbazzar; Sheshbazzar is not in the list of returnees'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Ezra 5:14indicates that Cyrus made Sheshbazzar the governor, but his name is not mentioned in the list of the returning Jews. … Zerubbabel has become the more famous in history because he outlived the older Sheshbazzar.'
  - where: 'note 1:8 “Who was Sheshbazzar?”'
    claim: 'Ludlow doubts the identification because chapter 5 mentions both'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'however, in chapter 5 Zerubabbel and Sheshbazzar appear together. Therefore the text does not seem to support this idea.'

  # ---- note 1:11 ----
  - where: 'note 1:11 “Five thousand four hundred”'
    claim: 'The items add to 2,499; the Septuagint has the same numbers; the old harmonization is arbitrary; the difference arose from errors in the numbers, perhaps in the total, which may have been 2,500'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/1.htm'
    quote: 'making together 2499. The same numbers are found in the lxx. Ancient interpreters reconciled the difference by the supposition that in the separate statements only the larger and more valuable vessels are specified'
  - where: 'note 1:11 “Five thousand four hundred”'
    claim: 'Keil: the harmonization is arbitrary; the error is in the numbers, perhaps the total'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/1.htm'
    quote: 'This reconciliation of the discrepancy is, however, evidently arbitrary … The difference between the two statements has certainly arisen from errors in the numbers … instead of 5400, perhaps 2500 should be read'
  - where: 'note 1:11 “Five thousand four hundred”'
    claim: 'The list shows specificity and generosity'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The accompanying list of amounts of gold, silver, and vessels shows not only specificity but also generosity.'
  - where: 'note 1:11 “Five thousand four hundred”'
    claim: 'The Church’s footnote at 1:7 points to Jeremiah 27:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/1?lang=eng'
    quote: '7a “brought forth”: Jer. 27:22.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Bible Dictionary reads Ezra 1:1 as teaching that the Lord’s promises through prophets are fulfilled, with D&C 1:37–38'
    key: bd-ezra
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezra?lang=eng'
    quote: '(1) the promises of the Lord through His prophets shall all be fulfilled (Ezra 1:1; see also Jer. 25:13; 29:10; D&C 1:37–38; 5:20)'
  - where: 'christ'
    claim: 'President Benson: God uses the men of the earth to accomplish his purposes, past, present and future'
    key: benson-civic-standards
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1972/04/civic-standards-for-the-faithful-saints?lang=eng'
    quote: 'God, the Father of us all, uses the men of the earth, especially good men, to accomplish his purposes. It has been true in the past, it is true today, it will be true in the future.'

  # ---- explore / parallels ----
  - where: 'explore'
    claim: 'D&C 109:5, on the Saints’ gifts to build the temple, echoes the language of Ezra 1:5–6'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Joseph Smith used language that echoes that of these verses when he invited the Saints of his day to contribute precious things and whatever could be given to the construction of the temple'
  - where: 'parallels'
    claim: '2 Chronicles 36:22–23 has the first two and a half verses'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'The first two and a half verses are also found in 2 Chronicles 36:22–23'
