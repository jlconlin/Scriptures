chapter: 2
claims:
  - where: when
    claim: 'The decree of Cyrus about a year after the fall of Babylon in 539, so about 538 B.C.'
    key: scripture-helps-ezra
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/29-ezra-1-3-7-nehemiah-2-4-6-8?lang=eng'
    quote: 'In 539 BC, Persia conquered the kingdom of Babylon. About a year later, the Lord inspired King Cyrus of Persia to issue a decree'
  - where: setting
    claim: 'The province is Judah as a district of the Persian empire'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'i.e., the province of Judaea as a district of the Persian empire'
  - where: setting
    claim: 'The chapter lists the returnees and the temple workers; the list recurs in Nehemiah 7 with variations; many Jews stayed in Babylon'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'This list also appears in Nehemiah 7:6–73 with variations. … Even though this is an extensive list, historical records reveal that many Jews decided to stay in and near Babylon'
  - where: setting
    claim: 'About fifty thousand made the first return; most exiles chose not to return'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'approximately fifty thousand people made the first trip back to Jerusalem. … By far, most of the expatriated Jews chose not to return to Jerusalem at this time'
  - where: setting
    claim: 'The divisions of the list'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'of families who could not prove their Israelite descent, and of certain priests whose genealogy could not be found, Ezra 2:59-63; and it closes with the sum-total of the persons, and of their beasts of burden'
  - where: thread
    claim: 'Proving lineage qualified for priesthood and was part of defining the community'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'A consistent theme throughout Ezra and Nehemiah is the demonstration of accurate lineage to qualify people for the priesthood and leadership. This was a part of reconstituting and defining the identity of the religious community when they returned to Judea.'
  - where: thread
    claim: 'Each returned to the city of his ancestors; called the people of Israel as the whole covenant people'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'i.e., to the city in which he or his ancestors had dwelt before the captivity. … They are called the people of Israel, not the people of Judah, because those who returned represented the entire covenant people.'
  - where: section 3 plain
    claim: 'The porters are doorkeepers; Nethinim are temple servants'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'Sons of the door-keepers; sons of Shallum, Ater. Etc. 139 138'
  - where: section 5 plain
    claim: '"set it up in his place" means rebuild'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'to set it up in its place (העמיד, to set up, i.e., to rebuild … 61,000 darics of gold'
  - where: 'note 2:2 “Zerubbabel, Jeshua and the leaders of the return”'
    claim: 'Zerubbabel was of the royal Davidic line through Jehoiachin and governor of Judah'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'which descent means he was of the royal Davidic line'
  - where: 'note 2:2 “Zerubbabel, Jeshua and the leaders of the return”'
    claim: 'Jeshua is the Joshua of Haggai, the high priest; with Zerubbabel he directed the rebuilding, moved by Haggai and Zechariah'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'The name Jeshua appears in the book of Ezra but is also spelled Joshua in Haggai. This man, Jeshua, was the high priest (see Haggai 1:1). Zerubbabel and Jeshua, being motivated by the prophetic inspiration of Haggai and Zechariah, together directed the rebuilding of the temple'
  - where: 'note 2:2 “Zerubbabel, Jeshua and the leaders of the return”'
    claim: 'The Nehemiah of the list is not the later leader'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: '(The Nehemiah that appears on this list is not the Nehemiah who arrived in Jerusalem and later became a leader.)'
  - where: 'note 2:2 “Zerubbabel, Jeshua and the leaders of the return”'
    claim: 'Nehemiah 7:7 adds Nahamani'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng'
    quote: 'Raamiah, Nahamani, Mordecai'
  - where: 'note 2:43 “The Nethinims and Solomon’s servants”'
    claim: 'Nethinim means given; given to the sanctuary as the Levites were'
    key: bdb
    url: 'https://biblehub.com/hebrew/5411.htm'
    quote: 'Nethinim (properly those given to the service of the sanctuary, as Levites are called'
  - where: 'note 2:43 “The Nethinims and Solomon’s servants”'
    claim: 'Nethinims means given or appointed'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Nethinims, meaning “given” or “appointed” in Hebrew, was the name given the servants in the temple who attended the Levites'
  - where: 'note 2:43 “The Nethinims and Solomon’s servants”'
    claim: 'Solomon''s servants probably temple laborers descended from the Canaanites of 1 Kings 9:21; the chapter lists those who would work in the temple'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Solomon’s servants (probably another group of temple laborers descended from the Canaanites mentioned in 1 Kings 9:21)'
  - where: 'note 2:43 “The Nethinims and Solomon’s servants”'
    claim: 'Levites wholly given; David appointed the Nethinims'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/8?lang=eng'
    quote: 'whom David and the princes had appointed for the service of the Levites'
  - where: 'note 2:61 “The sons of Barzillai”'
    claim: 'Barzillai''s descendants: a priest married a probable heiress of David''s Barzillai and took her name for the inheritance; the name cast doubt; the register search failed'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'The sons of Barzillai were the descendants of a priest who had married a daughter, probably an heiress (Num), of Barzillai the Gileadite, so well known in the history of David'
  - where: 'note 2:61 “The sons of Barzillai”'
    claim: 'Took her name to take her inheritance; did not renounce priesthood; the name cast doubt'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'had taken her name for the sake of taking possession of her inheritance … The assumption, however, of the name of Barzillai might have cast such a doubt upon their priestly origin as to make it necessary that this should be proved'
  - where: 'note 2:61 “The sons of Barzillai”'
    claim: 'Hakkoz a priestly order, but the name alone proved nothing'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'that of Hakkoz occurs as the seventh order of priests; but the names alone did not suffice to prove their priesthood, this being also borne by other persons.'
  - where: 'note 2:61 “The sons of Barzillai”'
    claim: 'Barzillai fed David at Mahanaim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'he had provided the king of sustenance while he lay at Mahanaim'
  - where: 'note 2:63 “Waiting for the Urim and Thummim”'
    claim: 'The Urim and Thummim was an instrument prepared of God for obtaining revelation from the Lord'
    key: bd-urim-and-thummim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/urim-and-thummim?lang=eng'
    quote: 'An instrument prepared of God to assist man in obtaining revelation from the Lord'
  - where: 'note 2:63 “Waiting for the Urim and Thummim”'
    claim: 'Lineage then qualified for priesthood; today authority is traced through lines of authority'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'In ancient times, priesthood authority was passed through lineage. Today, it is not required that someone be descended from a specific lineage to hold the priesthood. … their authority is traced not through genealogy but through lines of authority.'
  - where: 'note 2:63 “Waiting for the Urim and Thummim”'
    claim: 'They could not eat until a priest with Urim and Thummim could determine their status'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'They were told they could not eat the most holy things until a priest using Urim and Thummim could determine a change of status.'
  - where: 'note 2:63 “Waiting for the Urim and Thummim”'
    claim: 'Tirshatha is the Persian title of a provincial governor, used here of Zerubbabel'
    key: bd-tirshatha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tirshatha?lang=eng'
    quote: 'The Persian title for a local or provincial governor; used of Zerubbabel (Ezra 2:63; Neh. 7:65, 70)'
  - where: 'note 2:63 “Waiting for the Urim and Thummim”'
    claim: 'The second temple lacked five things, among them the Urim and Thummim'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'The Jews reckoned the temple of Zerubbabel to be in five points inferior to the temple of Solomon: in the absence of (1) the Ark of the Covenant … (2) the Shechinah … (3) the Urim and the Thummim (Ezra 2:63); (4) the holy fire upon the altar; (5) the spirit of prophecy.'
  - where: 'note 2:63 “Waiting for the Urim and Thummim”'
    claim: 'No stranger may eat the holy thing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/2?lang=eng'
    quote: '63a “holy”: Lev. 22:2 (2, 10, 15–16).'
  - where: 'note 2:62 “The register in a revelation of 1832”'
    claim: 'D&C 85 is an extract from a letter to Phelps, Kirtland, November 27, 1832, about Saints in Zion who had not consecrated and received inheritances'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/85?lang=eng'
    quote: 'This section is an extract from a letter of the Prophet to William W. Phelps, who was living in Independence, Missouri. It answers questions about those Saints who had moved to Zion but who had not followed the commandment to consecrate their properties'
  - where: 'note 2:62 “The register in a revelation of 1832”'
    claim: 'D&C 85:12 cites Ezra 2:61–62'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/85?lang=eng'
    quote: 'Therefore, it shall be done unto them as unto the children of the priest, as will be found recorded in the second chapter and sixty-first and second verses of Ezra.'
  - where: 'note 2:62 “The register in a revelation of 1832”'
    claim: 'The letter cites Ezra 2:61–62 and draws a warning for the last days'
    key: jsp-letter-phelps-1832
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-william-w-phelps-27-november-1832/3'
    quote: 'as you will find recorded in the second chapter and sixty first and second verses of Ezra now Broth— William if what I have said is true how careful then had men aught to be what they do in the last days lest they are cut short of their expecttations'
  - where: 'note 2:62 “The register in a revelation of 1832”'
    claim: 'Those whose names are not found in the book of the law shall find no inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/85?lang=eng'
    quote: 'whose names are not found written in the book of the law'
  - where: 'note 2:62 “The register in a revelation of 1832”'
    claim: 'They shall not find an inheritance among the Saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/85?lang=eng'
    quote: 'shall not find an inheritance among the saints of the Most High'
  - where: 'note 2:64 “Forty-two thousand, and a sum that falls short”'
    claim: 'Total 42,360 the same in Ezra, Nehemiah and 1 Esdras; the separate figures differ and fall short'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'is the same in both texts, as also in 1 Esdras, viz., 42,360; the sums of the separate statements being in all three different, and indeed amounting in each to less than the given total.'
  - where: 'note 2:64 “Forty-two thousand, and a sum that falls short”'
    claim: 'Ezra''s separate figures total 29,818'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'Total 29,818 31,089 30,143'
  - where: 'note 2:64 “Forty-two thousand, and a sum that falls short”'
    claim: 'One explanation of the differences: errors in copying, with the total kept'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/2.htm'
    quote: 'In transcribing such a multitude of names and figures, errors could scarcely be avoided, whether through false readings of numbers or the omission of single items. The sum-total being alike in all three texts, we are obliged to assume its correctness.'
  - where: 'note 2:64 “Forty-two thousand, and a sum that falls short”'
    claim: 'The JST changed seventeen verses of Nehemiah 7 to agree with Ezra; totals the same either way'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'seventeen of them are in chapter 7 and concern the numbers of the various families who returned from Babylon. They are changed to conform to the parallel account given in Ezra. … the sum total of the Ezra and Nehemiah accounts are the same with or without the changes'
  - where: 'note 2:64 “Forty-two thousand, and a sum that falls short”'
    claim: 'Joseph Smith may have used his Bible''s footnotes pointing to the parallel'
    key: sc-knowhy-786
    url: 'https://scripturecentral.org/knowhy/did-the-joseph-smith-translation-of-the-bible-rely-on-scholarly-commentaries'
    quote: 'in Nehemiah 7 a list of families and numbers is likewise revised to match the parallel account in Ezra 2. As such, Jackson notes that Joseph Smith may have referred to a print source, such as his Bible’s footnotes, indicating the parallel accounts.'
  - where: christ
    claim: 'Zerubbabel descended from Jehoiachin and was an ancestor of Jesus Christ (Matt. 1:12, Zorobabel)'
    key: ot-manual-29
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-29?lang=eng'
    quote: 'Zerubbabel was a descendant of Jehoiachin, the king who was carried away captive into Babylon … Zerubbabel was also an ancestor of Jesus Christ (see Matthew 1:12; Zorobabel is the Greek form).'
  - where: christ
    claim: 'Saints still sacrifice time and wealth for temples'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'Today, Saints still sacrifice time and wealth in order to build, participate in, and maintain temples of the Lord on the earth. And they in turn are blessed for their sacrifice.'
  - where: christ
    claim: 'Names enrolled in the book of the law of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/85?lang=eng'
    quote: 'the inheritances of the saints whose names are found, and the names of their fathers, and of their children, enrolled in the book of the law of God'
  - where: parallels
    claim: 'Nehemiah 7:6–73 repeats the list'
    key: ludlow-ezra-minute
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/ludlow/2022-07-15/ezra_ludlow.pdf'
    quote: 'This list also appears in Nehemiah 7:6–73 with variations.'
