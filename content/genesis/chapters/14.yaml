chapter: 14
title: Abram and Melchizedek
tagline: Four kings from the east raid the cities of the plain and carry off Lot. Abram rescues him with the men of his own household, and on the way home two kings come out to meet him. From Melchizedek, priest of the most high God, he receives bread, wine, and a blessing, and gives him a tenth of all; from the king of Sodom he will take nothing.
when: 'About 2000 B.C., the Bible Dictionary’s date for Melchizedek. Abram is living by the oaks of Mamre at Hebron, and Lot has moved into Sodom.'

setting: |
  Genesis 14 is unlike anything else in Abram’s story. For one chapter the herdsman of chapters 12 and 13 is caught up in the wars of kings: an alliance from the east puts down a revolt among the cities of the Jordan plain, and Lot, who had pitched his tent toward Sodom ([[Gen. 13:12]]) and now “dwelt in Sodom,” is carried off with the spoil. Abram, living by the oaks of Mamre at Hebron ([[Gen. 13:18]]), goes after them, brings Lot back, and is met on the way home by two kings.

  One of them is Melchizedek. The Bible says little about him: what it has “is relatively scarce, being limited to Gen. 14:18–20; Heb. 5:6; 7:1–3,” and [[Ps. 110:4]] names his priesthood. Latter-day revelation “gives us much more about him and his priesthood”: Alma’s sermon in [[Alma 13]], [[D&C 84:14]], [[D&C 107:1–4]], and Joseph Smith’s revision of this chapter, which gives verses 18–20 a longer form (printed as JST Genesis 14:25–40 in the Bible’s appendix) with an insertion “of about 470 words that tells Melchizedek’s story.”

  The chapter stands between Abram’s parting from Lot and the covenant of chapter 15, which begins “After these things.” It has three parts: the war of the kings (verses 1–12), the rescue of Lot (13–16), and the two kings who meet Abram (17–24).

thread: |
  The chapter ends with two kings coming out to meet Abram in the same valley (verses 17–18), and it turns on how differently he treats them. The king of Sodom, whose people Abram has just brought back, offers a bargain: “Give me the persons, and take the goods to thyself” (verse 21). Melchizedek, king of Salem, brings bread and wine and a blessing, and he gives the credit for the victory to God: it is “the most high God, which hath delivered thine enemies into thy hand” (verse 20). Abram gives the priest-king a tenth of all. To the king of Sodom he swears, by “the LORD, the most high God, the possessor of heaven and earth” (verse 22), the very title Melchizedek had just used, that he will not take so much as a sandal strap.

  The question underneath is who makes Abram rich. He will not have the king of Sodom say, “I have made Abram rich” (verse 23). And the next chapter opens with the Lord’s own word to Abram: “Fear not, Abram: I am thy shield, and thy exceeding great reward” ([[Gen. 15:1]]).
sections:
  - range: 1-12
    heading: The war of the kings
    plain: |
      In the days of Amraphel king of Shinar, Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations, these kings made war on Bera king of Sodom, Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is, Zoar). The five joined forces in the valley of Siddim (that is, the Salt Sea). For twelve years they had served Chedorlaomer, and in the thirteenth year they rebelled.

      In the fourteenth year Chedorlaomer and the kings with him came and defeated the Rephaim in Ashteroth-karnaim, the Zuzim in Ham, the Emim in Shaveh-kiriathaim, and the Horites in their hill country of Seir, as far as El-paran by the wilderness. Then they turned back to En-mishpat (that is, Kadesh) and conquered all the country of the Amalekites, and the Amorites who lived in Hazezon-tamar.

      Then the kings of Sodom, Gomorrah, Admah, Zeboiim, and Bela marched out and drew up for battle in the valley of Siddim against the four kings: four kings against five. The valley was full of tar pits; the kings of Sodom and Gomorrah fled and fell there, and those who were left fled to the hills. The victors took all the goods and food of Sodom and Gomorrah and went their way. They also took Lot, Abram’s nephew, who was living in Sodom, with his goods.
  - range: 13-16
    heading: Abram rescues Lot
    plain: |
      A man who had escaped came and told Abram the Hebrew. Abram was living by the oaks of Mamre the Amorite, brother of Eshcol and Aner, who were bound by treaty to Abram. When Abram heard that his kinsman had been taken captive, he called out his trained men, born in his own household, three hundred and eighteen of them, and chased the enemy as far as Dan. At night he divided his forces against them, attacked, and pursued them as far as Hobah, north of Damascus. He brought back all the goods, and his kinsman Lot with his goods, and the women and the other people.
  - range: 17-24
    heading: Two kings meet Abram
    plain: |
      After Abram came back from defeating Chedorlaomer and the kings with him, the king of Sodom went out to meet him in the valley of Shaveh (that is, the King’s Valley). And Melchizedek king of Salem brought out bread and wine; he was priest of God Most High. He blessed Abram and said, “Blessed be Abram by God Most High, Maker and Owner of heaven and earth. And blessed be God Most High, who has delivered your enemies into your hand.” And he gave him a tenth of everything.

      The king of Sodom said to Abram, “Give me the people, and keep the goods for yourself.” But Abram said to the king of Sodom, “I have raised my hand in an oath to the Lord, God Most High, Maker and Owner of heaven and earth: I will not take a thread or a sandal strap, or anything that is yours, so that you can never say, ‘I made Abram rich.’ I will take nothing but what my young men have eaten. As for the men who went with me, Aner, Eshcol, and Mamre, let them take their share.”

notes:
  - ref: 1
    phrase: Chedorlaomer king of Elam
    kind: history
    title: Kings from the east
    body: |
      The invaders came from Mesopotamia and beyond, and their names fit Abraham’s world. Shinar is the land of Babel ([[Gen. 11:2]]). Elam was “a mountainous country to the east of Babylonia,” and its king Chedorlaomer leads the alliance (verses 4–5, 9, 17). His name is “a known Elamite name: Kudur-Lagamar.” Tidal “is the Hebrew version of the Hittite Tudhaliya,” the name of an early Hittite king. Amraphel’s name is harder: the name of Amud-pi-el, a king of Qatna in Syria, “could easily become Amraphel in Hebrew,” and Amud-pi-el “had an alliance with Elam at this time,” though Qatna “seems somewhat distant to be considered part of Shinar.” These are possible matches, not proven identifications.

      The five kings they fought ruled much smaller places. “Anciently the most typical political entity was a small city-state wherein the king presided over one major city and the surrounding area,” so “Sodom had a king, Gomorrah a king, and so on.” For twelve years the cities of the plain served Chedorlaomer, and in the thirteenth they rebelled (verse 4), “presumably because the inhabitants had failed to pay the required yearly tribute.” What followed was not an occupation. The campaign “appears to reflect a quick raid, which was a common military tactic at the time, with the taking of hostages.” Lot was one of them (verse 12).
    sources: [bd-elam, gee-wanderings, lds-scriptures, ot-manual-gen-12-17, benson-lot]
  - ref: 3
    phrase: which is the salt sea
    kind: history
    title: Old names for later readers
    body: |
      The chapter keeps stopping to explain its place names. Bela “is Zoar” (verses 2, 8), the vale of Siddim “is the salt sea” (verse 3), En-mishpat “is Kadesh” (verse 7), and the valley of Shaveh “is the king’s dale” (verse 17). Each time, it seems, an old name is followed by the one later readers knew: to Bela, for instance, “the later name Zoar… is added as being better known.” The Salt Sea is the Dead Sea. In one reading the vale of Siddim “was changed into the Salt Sea on the destruction of its cities” in chapter 19, though where those cities stood “is uncertain.”

      Dan, in verse 14, is the same kind of updating, without the old name beside it. “The ancient name for Dan was Laish.” The town took the name Dan only after the tribe of Dan captured it: “they called the name of the city Dan… howbeit the name of the city was Laish at the first” ([[Judg. 18:29]]). By then it was the northern end of the land, “from Dan even to Beer-sheba.” A name like this shows the story handed down and retold in the names of a later day. Such updates “do not negate the historicity of the event, they simply reflect the sharing of the story over time and the superimposing of information to correspond to information of the respective present.”
    sources: [keil-genesis, bd-dead-sea, lds-scriptures, bd-dan, benson-lot]
  - ref: 5
    phrase: smote the Rephaims in Ashteroth Karnaim
    kind: history
    title: Peoples remembered as giants
    body: |
      Before they reached Sodom, the eastern kings struck the old peoples east of the Jordan and in Seir, and Israel remembered several of them as giants. In one reconstruction the march came south “past Damascus,” through peoples who “apparently” were “on the east side of Jordan, involved in the rebellion,” as far as the head of the Gulf of Aqaba, and then turned back against the Amalekites and the five kings (verses 5–8). Ashteroth Karnaim is “generally identified with Tell-‘Ashtara, in the plateau of Bashan.”

      The Rephaim were “a pre-Israelite people in Palestine, noted for their great stature,” and the Emims “a race of giants, living east of the Jordan in the time of Abraham; afterwards driven out by Moabites.” Deuteronomy names them again when Israel comes to the same country. The Emims lived in the land the Lord had given “unto the children of Lot for a possession,” and were “a people great, and many, and tall, as the Anakims” ([[Deut. 2:9–11]]); “the Horims also dwelt in Seir beforetime; but the children of Esau succeeded them” ([[Deut. 2:12]]); and “only Og king of Bashan remained of the remnant of giants” ([[Deut. 3:11]]). The raid that carried Lot off ran through the country his own descendants, Moab and Ammon ([[Gen. 19:36–38]]), would later hold.
    sources: [ryle-genesis, bd-rephaim, bd-emims, lds-scriptures]
  - ref: 10
    phrase: slimepits
    kind: words
    title: Tar pits
    body: |
      The KJV’s “slime” is bitumen or asphalt (Hebrew *chemar*), “abounding in vale of Siddim.” It is the same word as the “slime” the builders of Babel used for mortar ([[Gen. 11:3]]).

      “Fell there” need not mean the kings died in the pits. The line can be read to mean that as the kings of Sodom and Gomorrah fled, “some of the men fell into them and the rest fled to the hills.” The king of Sodom, at least, is alive to meet Abram in verse 17.
    sources: [bdb, niv, esv]
  - ref: 13
    phrase: Abram the Hebrew
    kind: words
    title: Abram the Hebrew
    body: |
      This is the first time the word *Hebrew* (*‘ivri*) appears in the Bible. It “may mean ‘one who had come from beyond (the Euphrates),’ from ʼeber, ‘to cross’; or it may be derived from” Eber, whom Genesis lists among Abram’s ancestors in the line of Shem ([[Gen. 11:14–26]]). The first meaning matches what Joshua told Israel: “Your fathers dwelt on the other side of the flood in old time,” that is, beyond the river, until the Lord “took your father Abraham from the other side of the flood” ([[Josh. 24:2–3]]).

      Elsewhere in the Bible the word is either “put into the mouth of foreigners” (Egyptians and Philistines) or “used to distinguish Israel from foreigners.” Here it sets Abram apart from his neighbors: he is called the Hebrew “in distinction from Mamre and his two brothers, who were Amorites, and had made a defensive treaty with him.” The KJV’s “confederate with Abram” is in Hebrew “possessors of a covenant (*berit*) with Abram.” Abram had allies among the people of the land, and they went with him (verse 24).
    sources: [bd-hebrew, biblehub-interlinear, lds-scriptures, bdb, keil-genesis]
  - ref: 14
    phrase: he armed his trained servants, born in his own house
    kind: history
    title: Abram’s household goes to war
    body: |
      Abram raised a small army from his own household. The word for “trained servants” (*chanikhim*) occurs only here and means “trained, tried, experienced”: “his tried and trusty men, born in his house.” The verb “armed” means to “empty out,” the verb used for drawing a sword; here it seems to mean that he “led forth” his men. There were 318 of them, all born in his own household, and his Amorite allies went too (verse 24). He divided them, attacked by night, and chased the enemy as far as Hobah, near Damascus (verse 15).

      He went because Lot was family. Lot was his nephew, “Abram’s brother’s son” (verse 12); “brother” in verses 14 and 16 has its wider sense of “relative,” as when Abram told Lot, “we be brethren” ([[Gen. 13:8]]). In a raid like this, captives “would be held until they were redeemed by the immediate family, or, if the family could not afford the hostage price, by a temple or the palace of the affected town.” Abram did not ransom Lot; he went after him. Lot’s capture with the goods of Sodom suggests that “by this time, Lot had become associated with Sodom and Gomorrah on more than a superficial level,” and the pursuit “also says much about Lot’s value to Abraham.”
    sources: [bdb, gee-wanderings, benson-lot, lds-scriptures]
  - ref: 18
    phrase: Melchizedek king of Salem
    kind: history
    title: The king of Salem
    body: |
      Melchizedek’s name means “king of righteousness,” and Salem means “peace.” Hebrews puts the two together: he is “first being by interpretation King of righteousness, and after that also King of Salem, which is, King of peace” ([[Heb. 7:2]]).

      Salem is almost certainly Jerusalem. The Tell el-Amarna tablets “of about 1400 B.C. give the name of the city as Uru-Salem,” which is “easily identified as Jerusalem.” In Hebrew, *Shalem* is a shortened form of the name Jerusalem, and a psalm uses it beside Zion: “In Salem also is his tabernacle, and his dwelling place in Zion” ([[Ps. 76:2]]). The meeting place points the same way. The king’s dale (verse 17), where Absalom later set up his pillar ([[2 Sam. 18:18]]), is “identified as the confluence of the three valleys southeast of Jerusalem.”
    sources: [bd-melchizedek, lds-scriptures, bd-salem, bdb, benson-lot]
  - ref: 18
    phrase: brought forth bread and wine
    kind: christ
    title: Bread and wine
    body: |
      Joseph Smith’s revision makes Melchizedek’s bread and wine an ordinance. Genesis says only that he “brought forth bread and wine”; the revision reads, “and he brake bread and blest it; and he blest the wine, he being the priest of the most high God” (JST Gen. 14:17, in the footnote to this verse). Read that way, “it seems clear that the giving of the bread and wine in the narrative was a sacramental act. Melchizedek broke the bread and then blessed the bread and the wine separately, and the text mentions that he had priesthood authority to do so.” It is “a foreshadowing sacramental ordinance,” and “the text gives every indication that it was a Christian event that celebrated in advance the atoning body and blood of Jesus Christ.”

      What it says about the sacrament before Christ is less certain. “Aside from this narrative, there is no reference to the sacrament in the Old Testament,” the accounts of the Last Supper “give the impression that he was introducing the ordinance then for the first time,” and there is none in the Book of Mormon until the risen Jesus gives it ([[3 Ne. 18:1–11]]). So this meeting “may have been a singular observance among these two extraordinarily great men and perhaps not the perpetuation of an earlier practice or the introduction of a new one.”
    sources: [lds-scriptures, jackson-promises-priesthood, sc-knowhy-643]
  - ref: 18
    phrase: he was the priest of the most high God
    kind: scripture
    title: What Restoration scripture adds
    body: |
      Genesis gives Melchizedek three verses and no family. Restoration scripture tells of his faith and his priesthood. Joseph Smith’s revision says that “when a child he feared God, and stopped the mouths of lions, and quenched the violence of fire,” and that he was “ordained an high priest after the order of the covenant which God made with Enoch” (JST Gen. 14:26–27). Alma says his people “had waxed strong in iniquity and abomination,” that he “did preach repentance unto his people. And behold, they did repent,” and that “he was called the prince of peace” ([[Alma 13:17–18]]). Of the high priests, “there were many before him, and also there were many afterwards, but none were greater” ([[Alma 13:19]]). The higher priesthood, “the Holy Priesthood, after the Order of the Son of God,” came to be called by his name “out of respect or reverence to the name of the Supreme Being” ([[D&C 107:3–4]]), and it was from Melchizedek that “Abraham received the priesthood” ([[D&C 84:14]]).

      His city followed the pattern of Enoch’s. His people “wrought righteousness, and obtained heaven, and sought for the city of Enoch which God had before taken” (JST Gen. 14:34). Read with the story of Enoch in [[Moses 7]], Melchizedek “performed miracles, preached righteousness, and established Zion, as Enoch had done before him,” and the revision gives “a record of a second translated community,” a second people taken to heaven as Enoch’s city had been.

      Was he Shem, the son of Noah? An ancient Jewish tradition says so. The Targum of Palestine, one of the “Aramaic paraphrases on the Books of the Old Testament,” reads, “And Malka Zadika, who was Shem bar Noah, the king of Yerushalem, came forth to meet Abram.” Among Latter-day Saints it is held possible, not taught: “while we cannot say for sure, the possibility is clearly there,” and “the truth is, we do not know the answer.” [[D&C 84:14]] says Melchizedek received the priesthood “through the lineage of his fathers, even till Noah,” and “many persons believe D&C 84:14 is proof that there are perhaps several generations between Melchizedek and Noah.” Scripture does not settle the question.
    sources: [jst-gen-14, lds-scriptures, judd-melchizedek, jackson-promises-priesthood, etheridge-targums, ot-manual-gen-12-17, gygi-shem-1973]
  - ref: 19
    phrase: possessor of heaven and earth
    kind: words
    title: Maker and owner of heaven and earth
    body: |
      The Hebrew is *qoneh shamayim va’arets*. The verb *qanah* usually means to “get, acquire,” and elsewhere to “buy.” Said of God, it means “originating, creating,” the sense it has here and in [[Deut. 32:6]]. The Septuagint, the ancient Greek translation, renders it “who made heaven and earth.” In one reading the word keeps both senses, God as “founder and possessor.” He made heaven and earth, and they are His.

      Abram repeats the whole title, word for word, when he swears to take nothing from the king of Sodom (verse 22).
    sources: [bdb, biblehub-interlinear, lxx-rahlfs, keil-genesis]
  - ref: 20
    phrase: he gave him tithes of all
    kind: scripture
    title: The first tithe
    body: |
      “The first recorded instance” of a tithe in scripture “is the payment made by Abraham to Melchizedek.” The Hebrew says only “and he gave him a tenth of everything,” so who paid whom “is ambiguous in the Hebrew text.” Later scripture settles it. Hebrews: “unto whom even the patriarch Abraham gave the tenth of the spoils” ([[Heb. 7:4]]). Alma: “even our father Abraham paid tithes of one-tenth part of all he possessed” ([[Alma 13:15]]). Hebrews speaks of the spoils, Alma of all that Abraham owned.

      Joseph Smith’s revision agrees with Alma and says what the tithe was for. Melchizedek was “the keeper of the storehouse of God; Him whom God had appointed to receive tithes for the poor,” and “Abram paid unto him tithes of all that he had, of all the riches which he possessed, which God had given him more than that which he had need” (JST Gen. 14:37–39). So “the storehouse was not to provide for him but ‘for the poor.’” Hebrews draws a different lesson from the same act: the one who receives the tithe and gives the blessing is the greater, for “without all contradiction the less is blessed of the better” ([[Heb. 7:6–7]]).
    sources: [bd-tithe, biblehub-interlinear, jackson-promises-priesthood, lds-scriptures, jst-gen-14, judd-melchizedek]
  - ref: 22
    phrase: the LORD, the most high God
    kind: words
    title: El Elyon, and the LORD
    body: |
      Melchizedek calls his God *El Elyon*, “God Most High.” *Elyon*, “Most High,” is a “name of God” in its own right, and the combined form *El Elyon* appears in this chapter and in [[Ps. 78:35]], “the high God their redeemer.” When Abram swears, he puts the divine name before it: *YHWH El Elyon*, “the LORD, the most high God.” Some have argued that “Melchizedek worshipped not Jehovah but a different god named El Elyon, or Most High God.” That is one of the “false conclusions” that “result from a lack of adequate sources and information.” Abram’s oath treats them as one God: he swears to the LORD by the title Melchizedek had just used.

      “I have lift up mine hand” (*harimoti yadi*) means “I have sworn, taken an oath with a gesture, symbolizing the appeal to God.” The Lord Himself speaks this way: “For I lift up my hand to heaven, and say, I live for ever” ([[Deut. 32:40]]).
    sources: [bdb, biblehub-interlinear, judd-melchizedek, ryle-genesis, lds-scriptures]
  - ref: 23
    phrase: lest thou shouldest say, I have made Abram rich
    kind: scripture
    title: Why Abram took nothing
    body: |
      Abram had won the goods: “according to the rights of war, all the booty belonged to Abram,” and the king of Sodom asks only for his people (verse 21). Abram refuses “a thread even to a shoelatchet,” the smallest things, and gives his reason: no one will say that the king of Sodom made him rich. He keeps back only what his young men have eaten, and leaves “an equitable share in the spoil” for his allies (verse 24).

      Joseph Smith’s revision closes the scene by saying who did make Abram rich: “God blessed Abram, and gave unto him riches, and honor, and lands for an everlasting possession; according to the covenant which he had made, and according to the blessing wherewith Melchizedek had blessed him” (JST Gen. 14:40). Genesis gives the same answer in its next words: “After these things the word of the LORD came unto Abram in a vision, saying, Fear not, Abram: I am thy shield, and thy exceeding great reward” ([[Gen. 15:1]]).
    sources: [ryle-genesis, jst-gen-14, keil-genesis, lds-scriptures]

christ: |
  Scripture itself makes Melchizedek a pattern of Christ’s priesthood. A psalm addressed to the one who sits at the Lord’s right hand says, “The LORD hath sworn, and will not repent, Thou art a priest for ever after the order of Melchizedek” ([[Ps. 110:4]]), and Hebrews applies it to Jesus, “made an high priest for ever after the order of Melchisedec” ([[Heb. 6:20]]), saying that Melchizedek was “made like unto the Son of God” ([[Heb. 7:3]]). In Genesis 14 itself “he is seen in a priestly role, pointing ahead to Jesus Christ,” above all in the bread and wine (see the note on verse 18).

  Restoration scripture says the priesthood he held points to Christ too. It is “after the order of the Son of God… neither by father nor mother; neither by beginning of days nor end of years; but of God” (JST Gen. 14:28; compare [[D&C 107:3]]), and its ordinances were given “that thereby the people might look forward on the Son of God, it being a type of his order, or it being his order” ([[Alma 13:16]]). In Joseph Smith’s revision of [[Heb. 7:3]], “without father, without mother” “clearly refers to the priesthood held by Melchizedek, not to Melchizedek himself.”

explore: |
  - **Alma on Melchizedek.** [[Alma 13:1–19]], a sermon on the high priesthood that uses Melchizedek as its example.
  - **Hebrews on Melchizedek.** [[Ps. 110:1–4]]; [[Heb. 5:5–10]]; [[Heb. 7:1–28]].
  - **The priesthood handed down.** [[D&C 84:6–17]]; [[D&C 107:1–4]].
  - **Joseph Smith’s revision.** JST Gen. 14:25–40, in the Joseph Smith Translation appendix. “Melchizedek: Seeking After the Zion of Enoch,” in *Sperry Symposium Classics: The Old Testament* (BYU Religious Studies Center), reads it beside the story of Enoch.
  - **Lot’s story continued.** [[Gen. 19]]; [[2 Pet. 2:6–9]].

