chapter: 27
title: Jacob Receives Isaac’s Blessing
tagline: Old and unable to see, Isaac sends Esau to hunt so that he can bless him. Rebekah, who overheard, sends Jacob in Esau’s place, dressed as his brother. Isaac blesses the wrong son, will not take the blessing back, and Jacob must flee from Esau’s anger.
when: 'Isaac’s old age, before Jacob leaves for Haran. The text gives no year; if this chapter follows chapter 26 directly, Isaac is about a hundred (see the note on verse 1).'

setting: |
  This chapter comes late in Isaac’s life, in the household of the twins. Before they were born the Lord told Rebekah that “the elder shall serve the younger” ([[Gen. 25:23]]); Esau sold his birthright ([[Gen. 25:33–34]]); and Isaac “loved Esau, because he did eat of his venison” ([[Gen. 25:28]]). Esau’s Hittite wives were “a grief of mind unto Isaac and to Rebekah” ([[Gen. 26:34–35]]). Now Isaac, old and unable to see, means to give Esau his blessing.

  A father’s blessing is not the birthright; Esau himself names them separately in verse 36 (see the note at verse 4). The question that has followed the chapter is how Jacob came to receive it; the notes at verses 13 and 33 take it up.

  Later scripture looks back on the scene twice, in [[Heb. 11:20]] and [[Heb. 12:16–17]] (see the notes at verses 33 and 38).

  The chapter has five parts: Isaac’s request (verses 1–5), Rebekah’s plan (6–17), Jacob before Isaac (18–29), Esau’s return (30–40), and Jacob’s flight (41–46).

thread: |
  Genesis 27 is about who decides where a blessing goes, and what becomes of a blessing once it is spoken. Isaac means his for Esau (verse 4). Rebekah, who overheard, means it for Jacob (verses 7–10). Esau, when it is gone, begs for another (verses 34, 38). His complaint in verse 36 turns on two Hebrew words that are almost the same, *bekhorah*, “birthright,” and *berakhah*, “blessing.” Chapter 25 told how the birthright went; this chapter tells how the blessing did.

  The Church reads the chapter from one verse. When Isaac learns that he has blessed the wrong son, he says, “yea, and he shall be blessed” (verse 33). The Church takes that as Isaac’s confirmation that the blessing went where the Lord intended, and Isaac gives Jacob “the blessing of Abraham” knowingly in the next chapter ([[Gen. 28:3–4]]). How Jacob and Rebekah brought it about is another matter: the Church’s current wording allows that they may have gone about it imperfectly (see the note at verse 13), and the text itself never says the plan was inspired.

  Genesis also counts the cost. Isaac “trembled very exceedingly” (verse 33). Esau “cried with a great and exceeding bitter cry” (verse 34), and then resolved to kill his brother (verse 41). Rebekah sends away the son she helped and says she fears losing both sons “in one day” (verse 45). The chapter closes on those costs, not on a triumph.

sections:
  - range: 1-5
    heading: Isaac sends Esau to hunt
    plain: |
      When Isaac was old and his eyes were so dim that he could not see, he called Esau, his elder son. “My son,” he said, and Esau answered, “Here I am.” Isaac said, “I am old, and I do not know the day of my death. Take your weapons, your quiver and your bow, go out to the field, and hunt some game for me. Make me the kind of savory food I love and bring it to me to eat, so that I may bless you before I die.” Rebekah was listening when Isaac spoke to his son Esau. So Esau went to the field to hunt.
  - range: 6-17
    heading: Rebekah’s plan
    plain: |
      Rebekah said to Jacob, her son, “I heard your father say to your brother Esau, ‘Bring me game and make me savory food to eat, so that I may bless you before the Lord before I die.’ Now, my son, listen to me and do what I tell you. Go to the flock and bring me two good young goats, and I will make them into savory food for your father, the kind he loves. You will take it to your father, so that he may eat it and bless you before he dies.”

      Jacob said to his mother Rebekah, “My brother Esau is a hairy man and I am smooth. Perhaps my father will feel me, and I will seem to him like a deceiver, and bring a curse on myself instead of a blessing.” His mother said, “Let your curse fall on me, my son. Only do as I say and go and get them.” He went, got them, and brought them to his mother, and she made the savory food his father loved.

      Then Rebekah took the best clothes of Esau, her older son, which were with her in the house, and put them on Jacob, her younger son. She put the skins of the young goats on his hands and on the smooth part of his neck. And she put the savory food and the bread she had made into the hand of her son Jacob.
  - range: 18-29
    heading: Jacob before Isaac
    plain: |
      Jacob went to his father and said, “My father.” Isaac said, “Here I am. Who are you, my son?” Jacob said, “I am Esau, your firstborn. I have done as you told me. Please sit up and eat my game, so that you may bless me.” Isaac said, “How did you find it so quickly, my son?” He answered, “Because the Lord your God brought it to me.” Isaac said, “Come near, so that I may feel you, my son, and know whether you really are my son Esau.” Jacob went near, and Isaac felt him and said, “The voice is Jacob’s voice, but the hands are the hands of Esau.” He did not recognize him, because his hands were hairy like his brother Esau’s, and he blessed him.

      “Are you really my son Esau?” Isaac asked. “I am,” Jacob said. Isaac said, “Bring it to me, and I will eat my son’s game, so that I may bless you.” Jacob brought it, and Isaac ate; he brought him wine, and he drank. Then Isaac said, “Come near and kiss me, my son.” Jacob came near and kissed him, and Isaac smelled his clothes and blessed him: “Ah, the smell of my son is like the smell of a field that the Lord has blessed. May God give you of the dew of heaven and of the richness of the earth, and plenty of grain and wine. Let peoples serve you and nations bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. Cursed be everyone who curses you, and blessed be everyone who blesses you.”
  - range: 30-40
    heading: Esau comes in
    plain: |
      Isaac had hardly finished blessing Jacob, and Jacob had only just left, when Esau came in from hunting. He too made savory food and brought it to his father. “Father, sit up and eat your son’s game,” he said, “so that you may bless me.” “Who are you?” said Isaac. “I am your son, your firstborn, Esau.” Isaac trembled violently and said, “Who was it, then, who hunted game and brought it to me? I ate it all before you came and I blessed him, and he will be blessed.”

      When Esau heard his father’s words, he cried out with a great and bitter cry and said, “Bless me, me also, my father!” Isaac said, “Your brother came deceitfully and took your blessing.” Esau said, “Is he not rightly named Jacob? He has taken my birthright, and now he has taken my blessing. Have you not kept a blessing for me?” Isaac answered, “I have made him lord over you and given him all his brothers as servants, and I have sustained him with grain and wine. What can I do for you, my son?” Esau said, “Have you only one blessing, my father? Bless me, me also, my father!” and he wept aloud.

      His father Isaac answered him, “Your dwelling will be of the richness of the earth and of the dew of heaven above. You will live by your sword and serve your brother; but when you grow restless, you will break his yoke from your neck.”
  - range: 41-46
    heading: Esau’s hatred and Jacob’s flight
    plain: |
      Esau hated Jacob because of the blessing his father had given him, and he said to himself, “The days of mourning for my father are near; then I will kill my brother Jacob.” When Rebekah was told what Esau had said, she sent for Jacob and said, “Esau is comforting himself with the thought of killing you. Now, my son, do as I say: run away to my brother Laban in Haran and stay with him a few days, until your brother’s anger turns away and he forgets what you did to him. Then I will send for you. Why should I lose you both in one day?”

      Then Rebekah said to Isaac, “I am weary of my life because of the Hittite women. If Jacob marries a Hittite woman like these, one of the women of this land, what good will my life be to me?”

notes:
  - ref: 1
    phrase: when Isaac was old, and his eyes were dim
    kind: history
    title: Isaac thought he was dying
    body: |
      Isaac believed his death was near, and he lived for decades afterward. His own words in verse 2 are “I know not the day of my death.” Genesis does not give his age here, but its numbers allow a count. Isaac was sixty when the twins were born ([[Gen. 25:26]]) and Esau was forty when he married the Hittite wives ([[Gen. 26:34]]); if this chapter follows that one directly, Isaac was about a hundred. He died at a hundred and eighty ([[Gen. 35:28–29]]), so the blessing he thought was his last came about eighty years before his death. The text itself gives no age and does not say how closely the chapters follow one another. The note at verse 45 takes up what the long interval meant for Esau’s threat and Jacob’s exile.
    sources: [schade-isaac-jacob, lds-scriptures]
  - ref: 4
    phrase: that my soul may bless thee before I die
    kind: history
    title: A father’s blessing, not the birthright
    body: |
      The blessing Isaac wants to give Esau is not the birthright, which Esau had already sold. Esau keeps the two apart himself: “he took away my birthright; and, behold, now he hath taken away my blessing” (verse 36; on the two Hebrew words, see the note there). The birthright was settled over the stew in [[Gen. 25:31–34]]. What Isaac speaks over Jacob is something else: land that is fruitful, rule over brothers and nations, and blessing and cursing of others (verses 28–29). Esau expects to receive such a blessing even though he has already lost the birthright.

      It is counted among priesthood blessings: “Worthy Melchizedek Priesthood holders can give blessings to their posterity. The scriptures record many such blessings,” and among them “Isaac’s (see Gen. 27:28–29, 39–40; 28:3–4; Heb. 11:20).” The line between the two is not sharp in every source. By selling his birthright Esau “lost both the leadership of the tribe and also the covenant blessing,” and the entry that says so cites this chapter for the second loss.
    sources: [oaks-priesthood-blessings-1987, bd-esau, lds-scriptures]
  - ref: 5
    phrase: Rebekah heard when Isaac spake to Esau his son
    kind: history
    title: What Rebekah and Isaac each knew
    body: |
      Rebekah acts on something Isaac may never have been told. The Lord answered her alone, before the twins were born: “the elder shall serve the younger” ([[Gen. 25:22–23]]). Genesis does not say she passed it on: “The reader is not told whether or not God revealed to Isaac what Rebekah knew about the boys or even whether Rebekah had relayed the answer to her prayer to him.”

      The silence matters, because readers fill it. Some picture Isaac’s will “pitted against God’s,” a father who is “deliberately prepared to overlook Esau’s misdemeanors and the God-given oracle.” The text does not support that picture: it “gives no indication that Isaac is attempting to oppose God or intentionally disregard a divine injunction.” What the text does say is why Isaac favored Esau: “Isaac loved Esau, because he did eat of his venison” ([[Gen. 25:28]]).
    sources: [olson-matriarchs, schade-isaac-jacob, lds-scriptures]
  - ref: 7
    phrase: bless thee before the LORD before my death
    kind: words
    title: Rebekah adds “before the LORD”
    body: |
      Rebekah’s report of Isaac’s words is not what Isaac said. In verse 4 he says, “that my soul may bless thee before I die.” Rebekah tells Jacob that Isaac will “bless thee before the LORD before my death,” where the Hebrew is *lifnei YHWH*, “before Yahweh.” She leaves out the hunting, and she adds the LORD’s presence.

      Readers differ on why. One holds that she shaped the report to persuade a reluctant Jacob, making the blessing sound weightier and Isaac’s wish for Esau lighter. Another, offered as speculation, holds that she misunderstood Isaac, taking a blessing “before the Lord” to be the birthright that she believed was Jacob’s. Genesis does not say.
    sources: [biblehub-interlinear, schade-isaac-jacob, lds-scriptures]
  - ref: 12
    phrase: I shall seem to him as a deceiver
    kind: words
    title: “Deceiver” is closer to “mocker”
    body: |
      The Hebrew word behind “deceiver” means “mocker.” It is *meta‘te‘a*, from a verb BDB defines as “mock,” and the only other place BDB lists it is 2 Chronicles 36:16, of Judah “mocking at his prophets,” where the KJV has “misused his prophets” ([[2 Chr. 36:16]]). Jacob’s fear is that Isaac will feel his smooth skin and take him for a mocker, with a curse in place of a blessing. The NRSVUE has “I shall seem to be mocking him.”

      Jacob names the cost himself: “I shall bring a curse upon me, and not a blessing.” Rebekah’s answer, “Upon me be thy curse, my son,” takes that risk on herself.
    sources: [biblehub-interlinear, bdb, nrsvue, lds-scriptures]
  - ref: 13
    phrase: Upon me be thy curse, my son
    kind: prophets
    title: Was Rebekah right?
    body: |
      The chapter does not say whether Rebekah’s plan was inspired, and the Church’s sources are careful about it. The current wording allows that “the actions of Rebekah and Jacob recorded in Genesis 27 were overzealous, imperfect attempts to help Jacob receive blessings the Lord had already promised to give him,” and adds that the account “may also be lacking details that could help us more clearly understand the actions and intentions of Rebekah and Jacob.” Jacob’s “supposed deception of his father in obtaining the blessing (Gen. 27) cannot be taken at face value,” and the reason given is Isaac’s later confirmation (see the note at verse 33).

      President Joseph Fielding Smith defended Jacob more fully: “I am here today to stand in the defense of Jacob,” and “He didn’t steal his brother’s blessing… he got the blessing the Lord gave him and had for him.” The current wording agrees that Jacob received what the Lord intended, and is more cautious about the means. The text itself points the same way: Jacob expects a curse (verse 12), Rebekah takes it on herself (verse 13), and, as one reading puts it, “The text does not tell us that Rebekah was inspired in her actions.”
    sources: [scripture-helps-gen-24-33, bd-jacob, schade-isaac-jacob, lds-scriptures]
  - ref: 15
    phrase: goodly raiment of her eldest son Esau
    kind: symbol
    title: Esau’s clothes and the goatskins
    body: |
      Rebekah dresses Jacob in two layers, and the scene uses both. The goatskins answer Jacob’s fear that his father will feel him (verses 11–12, 16). Esau’s clothes do their work later: when Isaac kisses his son he “smelled the smell of his raiment” and begins the blessing with “the smell of a field which the LORD hath blessed” (verse 27). Isaac calls it “the smell of my son.”

      One reading adds an image. It sees “the true covenant son” covered “with the skins of a sacrificed animal in preparation of inheriting stewardship over the covenant people,” and sets this beside the coats of skins the Lord made for Adam and Eve ([[Gen. 3:21]]; [[Moses 4:27]]). That is a reading of the picture, not a claim in the text; Genesis says only what Rebekah did.
    sources: [olson-matriarchs, lds-scriptures]
  - ref: 22
    phrase: The voice is Jacob’s voice, but the hands are the hands of Esau
    kind: history
    title: How Isaac was persuaded
    body: |
      Isaac did not accept Jacob at once. He asks who it is (verse 18) and how the game was found so quickly (verse 20); he has Jacob come near so that he can feel him and learn “whether thou be my very son Esau or not” (verse 21); and after the feel of the hands he asks again, “Art thou my very son Esau?” (verse 24). Last he has Jacob kiss him and smells his clothes (verses 26–27). “The voice is Jacob’s voice” shows what Isaac suspected; “because his hands were hairy, as his brother Esau’s hands” shows what overcame it (verse 23).

      Jacob’s answers are false: “I am Esau thy firstborn” (verse 19), and “I am” (verse 24). To the question about the game he says, “Because the LORD thy God brought it to me.” The Hebrew is “the LORD your God caused it to happen before me,” and Jacob says “thy God,” not “my God.” Genesis reports this without comment.
    sources: [biblehub-interlinear, lds-scriptures]
  - ref: 29
    phrase: cursed be every one that curseth thee, and blessed be he that blesseth thee
    kind: scripture
    title: Abraham’s words in Isaac’s blessing
    body: |
      The last line of the blessing repeats words God spoke to Abraham: “I will bless them that bless thee, and curse him that curseth thee” ([[Gen. 12:3]]). The rest of Isaac’s words are about land (the dew of heaven, the fatness of the earth, grain and wine in verse 28) and rule over brothers and peoples (verse 29). What these verses do not contain is the end of the promise to Abraham, “in thee shall all families of the earth be blessed” ([[Gen. 12:3]]).

      That promise comes after this chapter. Isaac sends Jacob off with “the blessing of Abraham, to thee, and to thy seed with thee” ([[Gen. 28:4]]), the Hebrew *birkat Avraham*, which BDB glosses as “the blessing given to Abraham.” The Lord then tells Jacob at Beth-el, “in thee and in thy seed shall all the families of the earth be blessed” ([[Gen. 28:14]]). The covenant is counted as “renewed with Isaac… and again with Jacob (Gen. 28; 35:9–13; 48:3–4).”
    sources: [bd-abraham-covenant, bdb, lds-scriptures]
  - ref: 33
    phrase: yea, and he shall be blessed
    kind: prophets
    title: Isaac trembles and does not take it back
    body: |
      When Isaac learns what happened, he confirms the blessing, and that is the turning point of the chapter. He “trembled very exceedingly,” literally trembled “a great trembling” (*charadah gedolah*), and BDB classes the verb here as trembling “in mental disturbance.” Then he answers his own question: “yea, and he shall be blessed.”

      The Church reads this verse as the key. “Isaac could have revoked the blessing at that time, but he seemed to affirm that it had been rightly delivered.” In the current wording, “Isaac thus confirmed that the blessing was given to the person the Lord intended,” and when Jacob left for Padan-aram, “Isaac clearly gave him the blessing of Abraham,” as [[Gen. 28:3–4]] records.

      Elder Dallin H. Oaks states the principle for priesthood blessings. If a servant of the Lord speaks as he is moved upon by the Holy Ghost, his words are “the will of the Lord”; but “if the words of a blessing only represent the priesthood holder’s own desires and opinions, uninspired by the Holy Ghost, then the blessing is conditioned on whether it represents the will of the Lord.” Hebrews names Isaac’s act as faith: “By faith Isaac blessed Jacob and Esau concerning things to come” ([[Heb. 11:20]]), which one reading takes to imply that “Isaac was directed by the Spirit.”
    sources: [bd-jacob, scripture-helps-gen-24-33, bdb, biblehub-interlinear, oaks-priesthood-blessings-1987, olson-matriarchs, lds-scriptures]
  - ref: 36
    phrase: Is not he rightly named Jacob?
    kind: words
    title: Jacob, birthright, and blessing
    body: |
      Esau’s bitter question plays on Jacob’s name. *Ya‘aqov* comes from a verb BDB defines as “follow at the heel; figurative assail insidiously, circumvent, overreach,” and it cites this verse: “he hath overreached me now twice.” “In Hebrew the name can be associated with the idea of replacing another by deception. Esau saw Jacob in this way.” The name was given at birth, when Jacob took hold of Esau’s heel ([[Gen. 25:26]]).

      The “two times” are what Esau names next: *bekhorati*, “my birthright,” and *birkhati*, “my blessing.” The two words have the same three consonants (b, k, r) in a different order, and the verse sets them side by side. Nobody in the story remarks on this. Esau says Jacob “took away” the birthright; chapter 25 says Esau “sold” it and “despised” it ([[Gen. 25:33–34]]).
    sources: [bdb, biblehub-interlinear, scripture-helps-gen-24-33, lds-scriptures]
  - ref: 38
    phrase: Hast thou but one blessing, my father?
    kind: scripture
    title: Esau’s tears and Hebrews 12
    body: |
      Genesis lets Esau’s grief be heard. He “cried with a great and exceeding bitter cry” (verse 34), and after asking “Hast thou but one blessing, my father?” he “lifted up his voice, and wept.” Hebrews looks back on the scene: Esau, “who for one morsel of meat sold his birthright,” “when he would have inherited the blessing, he was rejected: for he found no place of repentance, though he sought it carefully with tears” ([[Heb. 12:16–17]]). Hebrews does not say whose repentance Esau could not find. One reading connects the verse with Isaac’s “yea, and he shall be blessed” (verse 33): “Even the great and bitter lamentation into which Esau broke out could not change his father’s mind.”
    sources: [lds-scriptures, keil-genesis]
  - ref: 39
    phrase: thy dwelling shall be the fatness of the earth
    kind: words
    title: Esau’s blessing, “of” or “away from”?
    body: |
      Whether Esau’s blessing promises him rich land or poor land depends on one Hebrew prefix. The KJV reads “thy dwelling shall be the fatness of the earth, and of the dew of heaven,” as if repeating Jacob’s “of the dew of heaven, and the fatness of the earth” (verse 28). But both verses use the prefix *min*, which BDB calls a “preposition expressing the idea of separation, hence out of, from.” In verse 28 an interlinear glosses it “from the dew” and “and from the fatness.” In verse 39 the NRSVUE reads, “away from the fatness of the earth shall your home be and away from the dew of heaven on high,” and the ESV and NIV also have “away from.”

      In one reading the context requires “away from”: Isaac has just said he gave Jacob the grain and wine (verse 37), and the next line is “by thy sword shalt thou live.” The older rendering, found in the Vulgate and in Luther, has the KJV’s sense: “thy dwelling shall partake of the fat of the earth and the dew of heaven.” A Latter-day Saint reading keeps that sense, in which Isaac “blessed Esau with ‘the fatness of the earth, and the dew of heaven from above.’” The Hebrew allows both readings, and translators divide.
    sources: [biblehub-interlinear, bdb, esv, niv, nrsvue, keil-genesis, olson-matriarchs, lds-scriptures]
  - ref: 40
    phrase: thou shalt break his yoke from off thy neck
    kind: history
    title: Edom serves, and breaks loose
    body: |
      Esau’s blessing matches the pattern of Edom’s history, which one reading sums up as “a constant reiteration of servitude, revolt, and reconquest.” Esau “is Edom” ([[Gen. 36:1]]), and the brothers “became the ancestors of rival nations, the Israelites and Edomites.” Under David, “all they of Edom became David’s servants” ([[2 Sam. 8:14]]), which answers “shalt serve thy brother,” and Jacob’s “be lord over thy brethren” in verse 29: “The kingdom of Edom, populated by Esau’s descendants, would eventually become a vassal state to Israel.” Later, “In his days Edom revolted from under the hand of Judah, and made a king over themselves” ([[2 Kgs. 8:20]]), and “unto this day” ([[2 Kgs. 8:22]]). The NRSVUE’s “when you break loose” carries a footnote: “Meaning of Heb uncertain.”

      “Shalt serve thy brother” repeats what Rebekah had been told before the twins were born: “Two nations are in thy womb… and the elder shall serve the younger” ([[Gen. 25:23]]).
    sources: [lds-scriptures, nrsvue, sc-knowhy-462, bd-esau, olson-matriarchs, keil-genesis]
  - ref: 45
    phrase: why should I be deprived also of you both in one day?
    kind: history
    title: A few days, and both sons in one day
    body: |
      Rebekah plans a short exile and fears a double loss. “Deprived of you both” means, in one reading, “Jacob through Esau’s vengeance, and Esau as a murderer by the avenger of blood,” under the law of [[Gen. 9:6]]. She puts it mildly: Jacob need stay only “a few days” (verse 44). He stays twenty years ([[Gen. 31:41]]).

      Esau had planned to act when “the days of mourning for my father are at hand” (verse 41), and Isaac lived to a hundred and eighty ([[Gen. 35:28–29]]), so the day was long in coming; the brothers met first at Jacob’s return, with an embrace ([[Gen. 33:4]]). Rebekah promised, “then I will send, and fetch thee from thence,” but Genesis records no message from her; Jacob returns when “the LORD said unto Jacob, Return unto the land of thy fathers” ([[Gen. 31:3]]). After Jacob’s departure ([[Gen. 28:5]]), Rebekah is named again only as Jacob’s mother ([[Gen. 29:12]]), in the death of her nurse Deborah ([[Gen. 35:8]]), and as buried at Machpelah ([[Gen. 49:31]]).
    sources: [keil-genesis, lds-scriptures]
  - ref: 46
    phrase: I am weary of my life because of the daughters of Heth
    kind: history
    title: Rebekah gives Isaac a different reason
    body: |
      To Isaac, Rebekah gives a second reason for sending Jacob away: Esau’s wives. They “were a grief of mind unto Isaac and to Rebekah” ([[Gen. 26:34–35]], explained there), and she fears Jacob will marry the same way. She says nothing to him of Esau’s threat; in one reading she spoke this way to gain Isaac’s consent “without hurting his feelings by telling him of Esau’s murderous intentions.”

      Isaac acts on it. Chapter 28 opens with Isaac calling Jacob, blessing him, and charging him, “Thou shalt not take a wife of the daughters of Canaan” ([[Gen. 28:1–2]]). There Jacob is sent “not to flee Esau but to find a daughter of Laban so Jacob could marry in the covenant.”
    sources: [keil-genesis, schade-isaac-jacob, lds-scriptures]

christ: |
  Behind the struggle over the blessing is the covenant line through which Christ would come. Among the promises to Abraham was the assurance “that (1) Christ would come through his lineage,” and the covenant “was renewed with Isaac… and again with Jacob.” At Beth-el, just after this story, the Lord tells Jacob, “in thee and in thy seed shall all the families of the earth be blessed” ([[Gen. 28:14]]). Paul reads the promise to Abraham’s seed as a promise of Christ: “He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ” ([[Gal. 3:16]]). Matthew’s genealogy runs through the same line: “Abraham begat Isaac; and Isaac begat Jacob” ([[Matt. 1:2]]).

  The firstborn’s place, and how the faithful come into it through Christ, are taken up in [[Gen. 25]].

explore: |
  - **The blessing carried on.** [[Gen. 28:1–5]]; [[Gen. 28:10–22]].
  - **The brothers meet again.** [[Gen. 32–33]]; Esau’s family in [[Gen. 36]].
  - **Later scripture.** [[Heb. 11:20]]; [[Heb. 12:14–17]]; [[Mal. 1:2–3]]; [[Rom. 9:10–13]].
  - **How priesthood blessings are given.** [[D&C 1:38]]; [[D&C 68:4]].
  - **“Isaac and Jacob: Succession Narratives, Birthrights, and Blessings”** (BYU Religious Studies Center, in *From Creation to Sinai*, 2021) takes up this chapter at length, and “The Matriarchs” in the same book takes up Rebekah.

