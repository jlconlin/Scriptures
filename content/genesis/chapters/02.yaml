chapter: 2
title: The Garden of Eden
tagline: God rests on the seventh day and sanctifies it. Then the LORD God forms the man from the ground, plants a garden for him, gives him work and a commandment, and builds the woman, and the two become one flesh.
when: 'The beginning, before the Fall. The scriptures “do not provide details about how or when the earth was created,” so no date is given.'

setting: |
  Chapter 2 finishes one account of the Creation and begins another. Its first three verses close the six days of chapter 1 with the seventh, the day God rested, blessed, and sanctified, and the Sabbath commandment rests on them ([[Ex. 20:11]]). Verse 4 opens with “These are the generations,” the formula that begins each new section of Genesis, and the story narrows from the whole earth to one garden, one man, and one woman.

  In [[Moses 3]] the Lord retells the chapter to Moses verse for verse, in the first person, with additions that answer some of a reader's questions (see the notes on verses 5 and 9). [[Abr. 5]] tells it as the work of the Gods, and in a different order: the woman is made before the man names the animals.

  Later scripture leans on this chapter. Asked whether a man may put away his wife, Jesus answers with verse 24 ([[Matt. 19:3–6]]). Paul quotes verse 7 of Adam and Christ ([[1 Cor. 15:45]]) and verse 24 of Christ and the Church ([[Eph. 5:31–32]]). Lehi explains why the two trees stood in the garden ([[2 Ne. 2:15–16]]). The Fall follows directly in [[Gen. 3]], and the garden, the trees, and the commandment of this chapter are its setting.

thread: |
  Genesis 2 is the story of **God supplying what is lacking.** Verse 5 lists what the earth does not yet have: no plant has sprung up, for “the LORD God had not caused it to rain upon the earth, and there was not a man to till the ground.” Then each lack is met. A mist waters the ground (verse 6). The LORD God forms a man from the ground and breathes life into him (verse 7), plants a garden (verse 8), and puts the man in it “to dress it and to keep it” (verse 15). “Dress” is the same Hebrew verb as “till” in verse 5: now there is a man to work the ground.

  One lack remains, and God names it Himself. In chapter 1 everything God made was good; here, for the first time, He says, “It is not good” (verse 18). The man alone is incomplete, and “it is not enough for God to pronounce that Adam alone is ‘not good,’ Adam himself needs to know and recognize his incompleteness.” So the animals pass before him to be named, and none is a help fit for him. Only then does the LORD God build the woman and bring her to him, and Adam's first recorded words are a cry of recognition. The chapter ends with the two as “one flesh,” naked and not ashamed. What they do not yet know is the subject of chapter 3.

sections:
  - range: 1-3
    heading: The seventh day
    plain: |
      So the heavens and the earth were finished, with everything in them. On the seventh day God ended the work He had been doing, and on the seventh day He rested from all His work. God blessed the seventh day and made it holy, because on it He rested from all the work He had done in creating.
  - range: 4-7
    heading: The man formed from the ground
    plain: |
      This is the account of the heavens and the earth when they were created, in the day the LORD God made the earth and the heavens. Before any plant of the field was in the earth, and before any herb of the field had sprung up (for the LORD God had not yet sent rain on the earth, and there was no man to work the ground), a mist rose from the earth and watered the whole surface of the ground. Then the LORD God formed the man from the dust of the ground and breathed into his nostrils the breath of life, and the man became a living soul.
  - range: 8-17
    heading: The garden and the commandment
    plain: |
      The LORD God planted a garden in Eden, in the east, and put there the man He had formed. Out of the ground He made every tree grow that is beautiful to look at and good for food, with the tree of life in the middle of the garden and the tree of the knowledge of good and evil.

      A river flowed out of Eden to water the garden, and from there it divided into four branches. The first is the Pison, which winds around the whole land of Havilah, where there is gold; the gold of that land is good, and bdellium and onyx are there. The second river is the Gihon, which winds around the whole land of Cush. The third is the Hiddekel, which flows east of Assyria, and the fourth is the Euphrates.

      The LORD God took the man and put him in the garden of Eden to work it and to keep it. And the LORD God commanded the man, “You may eat freely from every tree of the garden, but you must not eat from the tree of the knowledge of good and evil, for on the day you eat from it you will surely die.”
  - range: 18-25
    heading: The woman and the first marriage
    plain: |
      Then the LORD God said, “It is not good for the man to be alone. I will make a helper corresponding to him.” Out of the ground the LORD God formed every beast of the field and every bird of the air, and brought them to the man to see what he would call them; and whatever the man called each living creature, that was its name. Adam gave names to all the cattle, the birds, and the beasts of the field, but for Adam no helper corresponding to him was found.

      So the LORD God caused a deep sleep to fall on Adam, and while he slept He took one of his ribs and closed up the flesh in its place. From the rib He had taken from the man, the LORD God built a woman and brought her to the man. Adam said, “This at last is bone of my bones and flesh of my flesh. She shall be called Woman, because she was taken out of Man.” That is why a man leaves his father and mother and holds fast to his wife, and they become one flesh. The man and his wife were both naked, and they were not ashamed.

notes:
  - ref: 2
    phrase: he rested on the seventh day
    kind: words
    title: Why God rested
    body: |
      God rests because the work is finished, not because He is tired. Isaiah says the Creator “fainteth not, neither is weary” ([[Isa. 40:28]]). The Hebrew verb is *shavat*, “cease, desist, rest,” used here of God desisting from labor, and the chapter's first verse gives the reason: “Thus the heavens and the earth were finished.”

      Verse 2 raises a small puzzle. God “ended his work” *on* the seventh day: did He work on it? The Septuagint, the ancient Greek translation, avoids the question by reading “And God finished on the sixth day his works,” and the Samaritan and Syriac texts do the same. The Hebrew has “seventh,” and the Lord's words to Moses keep it: “on the seventh day I, God, ended my work… and all things which I had made were finished” ([[Moses 3:2]]). One answer is that the seventh day's work was of another kind: God's rest is “not so much a cessation of work as… a change in the type of work or purpose of the work as God now blesses and sanctifies.”
    sources: [lds-scriptures, bdb, biblehub-interlinear, lxx-rahlfs, keil-genesis, belnap-beginning]
  - ref: 3
    phrase: sanctified it
    kind: words
    title: A day made holy
    body: |
      To sanctify is to set something apart for God. The Hebrew *qiddesh* means to “set apart as sacred, consecrate, dedicate,” and the law uses it for setting apart Mount Sinai, the altar, and the tabernacle, and for consecrating priests. Here its object is a day, and this is the verb's first appearance in the Bible; it does not occur again until Exodus. Before any place or person is made holy, a span of time is.

      Sanctifying is “the moving of an object or item to a divine state.” Read that way, “the Creation was not truly complete until it had been sanctified, a process similar to that of a temple dedication.”
    sources: [bdb, belnap-beginning]
  - ref: 4
    phrase: These are the generations of the heavens and of the earth
    kind: history
    title: Why the Creation is told again
    body: |
      Verse 4 begins a second account. “The first Creation account runs from Genesis 1:1 through 2:3. The second begins at 2:4.” The two differ. Chapter 1 counts days and makes man and woman together at the end; chapter 2 “has no mention of the number of days” and “reports that man was created first, then Eden, plants, animals, and finally woman.”

      The heading may account for part of the difference. *Toledot*, “generations,” is an “account of a man and his descendants,” and in one reading the heading introduces not the origin of heaven and earth but “what happened to the heavens and the earth after their creation”: the history that follows, beginning with man in the garden.

      Many scholars explain the differences by sources. In the Documentary Hypothesis, Genesis 1 comes from a priestly writer who “calls God Elohim,” and Genesis 2 from one who “calls God Jehovah.” Others point out that “ancient people read the Torah as a unified whole for thousands of years,” and that “the two chapters can be read as a unity to teach the reader something about God.” The Latter-day Saint position makes room for sources without giving up Moses: he “used several documentary sources from which he compiled the book of Genesis, besides a divine revelation to him.” The Book of Moses adds an answer of its own in the next verse.
    sources: [shannon-genesis-creation, sc-knowhy-400, bdb, keil-genesis, sc-knowhy-850, bd-pentateuch]
  - ref: 4
    phrase: the LORD God
    kind: words
    title: The LORD God
    body: |
      From verse 4 on, God is called “the LORD God,” Hebrew *YHWH Elohim*: the divine name joined to the title used throughout chapter 1. The double name “occurs here twenty times though rarely met with elsewhere”; it runs through chapters 2 and 3, the story of Eden. In the King James Bible “LORD” in small capitals stands for the name Jehovah, and “Jehovah is the premortal Jesus Christ” (see the note on [[Gen. 1:1]]).

      The change of name is one of the differences that source theories rest on. Latter-day Saints, whose theology “considers Elohim and Jehovah to be separate,” may read it differently: “the creative actions of Elohim in Genesis 1, followed by the creative actions of Jehovah in Genesis 2, could provide other insight.” The text does not explain the change, and that reading is offered as a possibility, not a teaching.
    sources: [biblehub-interlinear, keil-genesis, bd-jehovah, sc-knowhy-850]
  - ref: 5
    phrase: every plant of the field before it was in the earth
    kind: scripture
    title: Created spiritually first
    body: |
      The King James wording of verse 5 can be read to say that the plants existed before they were in the earth, and the Lord's words to Moses say exactly that: “For I, the Lord God, created all things, of which I have spoken, spiritually, before they were naturally upon the face of the earth… for in heaven created I them” ([[Moses 3:5]]). Two verses later He says it again of the man: “nevertheless, all things were before created; but spiritually were they created and made according to my word” ([[Moses 3:7]]). Here the Joseph Smith Translation answers the question a reader asks of a strangely worded verse.

      The Hebrew itself describes a bare land: the word rendered “before,” *terem*, means “not yet,” and a modern translation reads “when no plant of the field was yet in the earth and no vegetation of the field had yet sprung up.” No rain had fallen, and there was no one to work the ground.

      The addition in Moses is a comment inserted into the account, not a second story. In President Joseph Fielding Smith's words, Moses 3:5 and Genesis 2:5 “are interpolations… thrown into the account of the physical creation, explaining that all things were first created in the spirit existence in heaven before they were placed upon this earth.” Neither Genesis nor Moses narrates the spirit creation itself: “There is just the simple statement that they were so created before the physical creation.”
    sources: [biblehub-interlinear, nrsvue, lds-scriptures, pgp-manual-moses-3]
  - ref: 7
    phrase: formed man of the dust of the ground
    kind: words
    title: The potter and the clay
    body: |
      “Formed” is a potter's word. The Hebrew *yatsar* is used “of a potter who forms out of clay a vessel,” and here of God “(as a potter) forming Adam.” It is the verb behind Jeremiah's visit to the potter's house: “as the clay is in the potter's hand, so are ye in mine hand, O house of Israel” ([[Jer. 18:6]]).

      The man (*ha-adam*) is formed from the dust of the ground (*ha-adamah*), and the two words sound alike. *Adamah* is the ground “as tilled, yielding sustenance,” the ground the man is made to work (verses 5 and 15). The tie comes back in the sentence on Adam after the Fall: “till thou return unto the ground; for out of it wast thou taken: for dust thou art, and unto dust shalt thou return” ([[Gen. 3:19]]).

      How Adam's and Eve's bodies were made is not revealed. “Though the details of what happened on earth before Adam and Eve, including how their bodies were created, have not been revealed, our teachings regarding man's origin are clear and come from revelation.” What the Church teaches and does not teach about evolution is in the note on [[Gen. 1:5]].
    sources: [bdb, biblehub-interlinear, lds-scriptures, new-era-evolution-2016]
  - ref: 7
    phrase: breathed into his nostrils the breath of life; and man became a living soul
    kind: scripture
    title: The breath of life and a living soul
    body: |
      The breath God breathes is *neshamah*, “breath,” and “as breathed in by God it is God's breath in man.” What the man becomes, a “living soul” (*nephesh chayyah*), is the same Hebrew phrase Genesis uses for the animals: it designates them as “living creatures” in chapter 1 ([[Gen. 1:24]]) and in verse 19. Animals share the breath as well. In the Flood, “All in whose nostrils was the breath of life… died” ([[Gen. 7:22]]), and the Lord's words to Moses say of the animals, “I, God, breathed into them the breath of life” ([[Moses 3:19]]).

      Restoration scripture says what Genesis leaves out. Abraham's account puts the man's own spirit into the body: “the Gods formed man from the dust of the ground, and took his spirit (that is, the man's spirit), and put it into him; and breathed into his nostrils the breath of life, and man became a living soul” ([[Abr. 5:7]]). The verse “helps us understand that the breath of life was ‘the man's spirit,’” a spirit created first, “in heaven” ([[Moses 3:5]]). Revelation defines the result of the union: “the spirit and the body are the soul of man” ([[D&C 88:15]]).
    sources: [bdb, biblehub-interlinear, pike-breath, lds-scriptures, pgp-manual-abr-4-5]
  - ref: 8
    phrase: a garden eastward in Eden
    kind: words
    title: Eden, the garden of delight
    body: |
      Eden is the name of a region, and the garden was planted in it, toward the east. Hebrew speakers probably heard in the name the word *‘eden*, “luxury, dainty, delight,” and the Septuagint, translating verse 15, calls it “the garden of Delight.”

      The prophets made Eden the picture of a land restored. Isaiah promises that the Lord “will make her wilderness like Eden, and her desert like the garden of the Lord” ([[Isa. 51:3]]), and Ezekiel calls it “Eden the garden of God” ([[Ezek. 28:13]]).
    sources: [bdb, lxx-rahlfs, lds-scriptures]
  - ref: 9
    phrase: the tree of life also in the midst of the garden, and the tree of knowledge of good and evil
    kind: scripture
    title: Two trees
    body: |
      Genesis names two trees in the garden and does not say why they are there. Lehi does: “it must needs be that there was an opposition; even the forbidden fruit in opposition to the tree of life; the one being sweet and the other bitter. Wherefore, the Lord God gave unto man that he should act for himself” ([[2 Ne. 2:15–16]]). The sweetness and the bitterness are among the “additional details about the Garden of Eden story that are not mentioned in the Genesis account.”

      The commandment of verse 17 makes the same point in Genesis' own way, since it tells Adam what will follow if he eats; it is “our first indication that humankind possesses individual agency.” The Lord's words to Moses say it outright: “nevertheless, thou mayest choose for thyself, for it is given unto thee; but, remember that I forbid it” ([[Moses 3:17]]).
    sources: [lds-scriptures, sc-knowhy-400, belnap-beginning]
  - ref: 10
    phrase: a river went out of Eden to water the garden
    kind: history
    title: Where was Eden?
    body: |
      Genesis locates Eden by four rivers, and two of them are known: Hiddekel is the Tigris, and the fourth river is the Euphrates. The Pison and the Gihon have not been identified with certainty; for each there are only “theories of identification.” The land the King James Bible calls “Ethiopia” is Hebrew *Cush*, the “land and people of southern Nile-valley,” and Gihon is also the name of a spring at Jerusalem ([[1 Kgs. 1:33]]).

      Latter-day Saint leaders have placed Eden in America. President Brigham Young taught that “the Lord commenced his work upon what is now called the American continent, where the Garden of Eden was made,” and President Heber C. Kimball named the place: “Jackson County, in the State of Missouri.” Revelation places Adam's last gathering of his righteous posterity at Adam-ondi-Ahman ([[D&C 107:53]]; [[D&C 116:1]]), in what is now Daviess County, Missouri. To reconcile this with the rivers, one suggestion is that “the descendants of Noah evidently named some rivers, and perhaps other landmarks, after places they had known before the Flood”; it is offered as a “theory.”
    sources: [bdb, lds-scriptures, pgp-manual-moses-3, ot-manual-gen-1-2]
  - ref: 15
    phrase: to dress it and to keep it
    kind: words
    title: Work in the garden
    body: |
      Adam had work to do before the Fall. The two Hebrew verbs are *‘avad*, “work, serve,” the verb translated “till the ground” in verse 5, and *shamar*, “keep, have charge of,” used here of the garden.

      Both verbs return at the end of chapter 3. The LORD God sends the man out “to till the ground from whence he was taken” ([[Gen. 3:23]]), and sets cherubim “to keep the way of the tree of life” ([[Gen. 3:24]]), where “keep” is *shamar* again, now in the sense “keep, guard.” The man put in the garden to keep it ends outside it, while others keep the way back.
    sources: [bdb, biblehub-interlinear, lds-scriptures]
  - ref: 17
    phrase: in the day that thou eatest thereof thou shalt surely die
    kind: scripture
    title: Why Adam did not die that day
    body: |
      Adam did not die on the day he ate: “all the days that Adam lived were nine hundred and thirty years” ([[Moses 6:12]]). Yet the warning in Hebrew doubles the verb, *mot tamut*, “dying you shall die,” which the King James Bible renders “surely die.” Restoration scripture gives two answers.

      The first concerns the “day.” Abraham's account adds, “Now I, Abraham, saw that it was after the Lord's time, which was after the time of Kolob; for as yet the Gods had not appointed unto Adam his reckoning” ([[Abr. 5:13]]), and one day of the Lord's time is “one thousand years according to the time appointed unto that whereon thou standest” ([[Abr. 3:4]]). So Adam and Eve “did not die physically within a twenty-four hour period, as we now measure a day,” but Adam did “die within the period of one Kolob day.”

      The second is that another kind of death came with the transgression itself. The Lord told Joseph Smith that He “caused that he should be cast out from the Garden of Eden, from my presence, because of his transgression, wherein he became spiritually dead, which is the first death” ([[D&C 29:41]]). Separation from God's presence came with the transgression; the death of the body came later.
    sources: [biblehub-interlinear, lds-scriptures, pgp-manual-abr-4-5]
  - ref: 18
    phrase: an help meet for him
    kind: words
    title: A help meet
    body: |
      “Help meet” is two words, not one: a help that is “meet,” fit, for him. In 1828 English *meet* meant “Fit; suitable; proper; qualified.” The Hebrew *‘ezer kenegdo* means “a help corresponding to him i.e. equal and adequate to himself,” and the Septuagint renders it “a help suitable to him” and, in verse 20, “a help like to himself.”

      *‘Ezer*, help, is not a servant's word. It is used of God Himself: “he is our help and our shield” ([[Ps. 33:20]]); Moses named a son Eliezer, “for the God of my father, said he, was mine help” ([[Ex. 18:4]]). Together the two Hebrew words “mean helper, ally, or rescuer in an equal relation or role.”
    sources: [webster-1828, bdb, lxx-rahlfs, lds-scriptures, scripture-helps-gen-1-2]
  - ref: 21
    phrase: he took one of his ribs
    kind: words
    title: The rib
    body: |
      The Hebrew *tsela‘* means “rib” here, but elsewhere it is a “side”: the ridge of a hill, the side chambers of the temple, the side of the ark of the covenant, of the tabernacle, and of the altar. The next verse uses an unexpected verb as well: the LORD God “built” (*vayyiven*) the side He had taken into a woman.

      The rib is to be read as a figure. President Spencer W. Kimball said, “The story of the rib, of course, is figurative.” President Russell M. Nelson explained the figure: “the rib, coming as it does from the side, seems to denote partnership. The rib signifies neither dominion nor subservience, but a lateral relationship as partners, to work and to live, side by side.”
    sources: [bdb, biblehub-interlinear, kimball-womanhood-1976, nelson-eve-1987]
  - ref: 23
    phrase: This is now bone of my bones, and flesh of my flesh
    kind: words
    title: Bone of my bones
    body: |
      Adam's first recorded words begin, in Hebrew, “This at last.” The Book of Moses gives them as knowledge: “This I know now is bone of my bones” ([[Moses 3:23]]).

      “Bone of my bones, and flesh of my flesh” is also a formula of kinship and loyalty. Laban greets Jacob, his future son-in-law, with “Surely thou art my bone and my flesh” ([[Gen. 29:14]]), and the tribes come to make David king saying, “Behold, we are thy bone and thy flesh” ([[2 Sam. 5:1]]). In such cases the words “establish or maintain a legitimately recognized relationship.” Read that way, Adam's words recognize “the covenantal relationship between himself and the woman, a relationship institutionalized in marriage.”

      The name he gives her carries the same recognition. She is *ishshah*, woman, “because she was taken out of” *ish*, man: the two words sound alike, as the two people are alike.
    sources: [biblehub-interlinear, lds-scriptures, belnap-beginning]
  - ref: 24
    phrase: they shall be one flesh
    kind: scripture
    title: One flesh
    body: |
      Jesus quotes verse 24 as God's own words, though Genesis does not mark who speaks it, Adam or the narrator: “he which made them at the beginning made them male and female, And said, For this cause shall a man leave father and mother, and shall cleave to his wife: and they twain shall be one flesh?” Then He draws the conclusion: “What therefore God hath joined together, let not man put asunder” ([[Matt. 19:4–6]]). His “they twain” follows the Septuagint's “they two shall be one flesh”; the Hebrew says only “they shall become one flesh.”

      “Cleave” (*davaq*) means “cling, cleave, keep close,” and it is the word for Israel's bond with God: “him shalt thou serve, and to him shalt thou cleave” ([[Deut. 10:20]]). Latter-day prophets read the verse as the first marriage, performed by God: “the Lord set the norm himself by bringing together Adam and Eve, his first male and first female on this earth, and performing a holy marriage ceremony to make them husband and wife.” Revelation repeats the words, “they twain shall be one flesh,” and adds that this is so “that the earth might answer the end of its creation” ([[D&C 49:16]]). “One flesh” means “the complete merger of a man and a woman—their hearts, hopes, lives, love, family, future, everything.”
    sources: [lds-scriptures, lxx-rahlfs, biblehub-interlinear, bdb, kimball-teachings-18, holland-purity-1998]
  - ref: 25
    phrase: they were both naked, the man and his wife, and were not ashamed
    kind: words
    title: Naked and not ashamed
    body: |
      The Hebrew words for “naked” here and “subtil” in the next verse sound almost alike. “Naked” is *‘arummim*; the next verse calls the serpent “more subtil” ([[Gen. 3:1]]), *‘arum*, “crafty, shrewd”: “a pun long recognized in the Garden of Eden narrative.”

      In scripture nakedness “is often associated with the social experiences of shame and humiliation,” and “this is the only place in the scriptures where nakedness does not bring about negative social consequences.” Lehi describes the state they were in: had they stayed in the garden, “they would have remained in a state of innocence, having no joy, for they knew no misery; doing no good, for they knew no sin” ([[2 Ne. 2:23]]). It ends when “the eyes of them both were opened, and they knew that they were naked” ([[Gen. 3:7]]).
    sources: [bdb, belnap-beginning, lds-scriptures]

christ: |
  Paul reads verse 7 as a figure of Christ: “The first man Adam was made a living soul; the last Adam was made a quickening spirit” ([[1 Cor. 15:45]]). The first Adam received life when the LORD God breathed into him; the last Adam is “quickening,” in older English “giving life.”

  Paul reads verse 24 the same way. After quoting it he writes, “This is a great mystery: but I speak concerning Christ and the church” ([[Eph. 5:31–32]]).

  Lehi saw a tree in vision, and Nephi calls it “a representation of the tree of life” ([[1 Ne. 15:22]]). When Nephi asked its meaning, the angel showed him the virgin with her child and said, “Behold the Lamb of God, yea, even the Son of the Eternal Father! Knowest thou the meaning of the tree which thy father saw?” Nephi answered, “it is the love of God” ([[1 Ne. 11:21–22]]). At the end of the Bible the tree stands again beside the river that flows “out of the throne of God and of the Lamb” ([[Rev. 22:1–2]]).

  And the day God sanctified when the Creation was finished, Jesus claimed as His own: “the Son of man is Lord also of the sabbath” ([[Mark 2:28]]).

explore: |
  - **The same chapter in Restoration scripture.** Read [[Moses 3]] and [[Abr. 5]] beside this chapter; [[Moses 3:5–9]] tells of the spiritual creation.
  - **Lehi on the garden.** [[2 Ne. 2:14–26]], with [[Alma 42:2–15]] on the cherubim and the tree of life.
  - **The chapter in the New Testament.** [[Matt. 19:3–9]]; [[1 Cor. 15:45–49]]; [[Eph. 5:25–33]]; [[Rev. 22:1–5]].
  - **The help meet.** KnoWhy #833 (Scripture Central), “What Does it Mean that Eve is a ‘Help Meet’ for Adam?”, follows the Hebrew *‘ezer kenegdo* further.

parallels:
  - ref: Moses 3:1–25
    note: The same account, verse for verse, as the Lord's words to Moses, with additions on the spiritual creation (3:5, 7, 9) and on agency (3:17).
  - ref: Abr. 5:1–21
    note: The account as the work of the Gods; the woman is made before the animals are named.

