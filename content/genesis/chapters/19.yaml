chapter: 19
title: Sodom and Gomorrah Destroyed
tagline: The messengers who left Abraham’s tent reach Sodom at evening. Lot takes them in, the men of the city surround his house, and at dawn the messengers lead Lot and his family out by the hand before the LORD overthrows the cities of the plain. Lot’s wife looks back; Lot and his daughters end in a cave, where Moab and Ammon begin.
when: 'The evening after the visitors left Abraham at Mamre, and the next morning, when Abraham was ninety-nine and Isaac was to be born the next year (17:1, 21). The text gives no year.'

setting: |
  Genesis 19 is the second half of a story that begins at Abraham’s tent. In chapter 18 the visitors ate with Abraham, promised Sarah a son, and turned toward Sodom, whose “cry” had come up before the LORD, while Abraham stayed to plead for the city ([[Gen. 18:20–33]]). Chapter 19 opens that same evening as the messengers reach Sodom. Who they were is discussed at [[Gen. 18:2]]; Joseph Smith’s revision counts three of them, not two, and calls them “holy men.”

  Lot had come here by stages. He chose the well-watered plain and “pitched his tent toward Sodom” ([[Gen. 13:10–12]]); he was living in the city when he was carried off as a captive ([[Gen. 14:12]]); now he has a house there, a wife, daughters, and sons-in-law.

  Sodom became scripture’s standing example of a city ripe for judgment. Isaiah calls the leaders of Jerusalem “rulers of Sodom” ([[Isa. 1:10]]), the prophets measure later destructions by Sodom’s overthrow (see the note on verse 24), and in the New Testament the Savior and Peter both look back to it ([[Luke 17:28–32]]; [[2 Pet. 2:6–9]]).

  The chapter has five parts: Lot takes in the messengers (verses 1–3), the men of Sodom at his door (4–11), the warning and the flight to Zoar (12–22), the overthrow of the cities (23–29), and Lot’s daughters (30–38).

thread: |
  Genesis 19 is a story of rescue as much as of destruction, and it turns on hands and eyes. The messengers “put forth their hand” to pull Lot inside when the mob comes at the door (verse 10). At dawn, when he lingers, they take him, his wife, and his daughters by the hand and set them outside the city, “the LORD being merciful unto him” (verse 16). Then comes the command, “look not behind thee” (verse 17). Lot’s wife looks back and perishes with the city (verse 26). Abraham, who had pleaded for Sodom the day before, looks down on the plain from the place where he had stood before the LORD and sees only smoke (verse 28). The narrator tells what neither of them could see: “God remembered Abraham, and sent Lot out of the midst of the overthrow” (verse 29).

  The chapter also answers chapter 18. There Abraham ran to meet strangers, offered water for their feet, and fed them; here Lot does the same, and the men of his city surround the house to abuse his guests. There Abraham asked whether the Judge of all the earth would “slay the righteous with the wicked” ([[Gen. 18:25]]); here the answer comes in the event. The city falls, but not before Lot is out. The messenger can do nothing “till thou be come thither” (verse 22).

sections:
  - range: 1-3
    heading: Lot takes in the messengers
    plain: |
      The two angels came to Sodom in the evening while Lot was sitting at the city gate. When Lot saw them he got up to meet them and bowed low to the ground. “Please, my lords,” he said, “turn aside to your servant’s house. Spend the night, wash your feet, and you can be on your way early in the morning.” “No,” they said, “we will spend the night in the square.” But he urged them so strongly that they came with him into his house. He made them a meal, baked bread without yeast, and they ate.
  - range: 4-11
    heading: The men of Sodom at the door
    plain: |
      Before they had gone to bed, the men of Sodom, young and old, from every part of the city, surrounded the house. They called to Lot, “Where are the men who came to you tonight? Bring them out to us, so that we can have our way with them.” Lot went out to them, shut the door behind him, and said, “Please, my brothers, do not do this wicked thing.” In the King James text he then offers them his two unmarried daughters instead, if only they will leave his guests alone, since the men have come under the shelter of his roof.

      “Get out of the way!” they said. “This fellow came here as a stranger, and now he wants to be our judge! We will treat you worse than them.” They pushed hard against Lot and moved in to break down the door. But the men inside reached out, pulled Lot into the house with them, and shut the door. Then they struck the men at the door, small and great, with blindness, so that they wore themselves out trying to find the doorway.
  - range: 12-22
    heading: The warning and the flight to Zoar
    plain: |
      The men said to Lot, “Do you have anyone else here, sons-in-law, sons, daughters, anyone in the city who belongs to you? Get them out of this place, because we are going to destroy it. The outcry against its people has grown so great before the LORD that he has sent us to destroy it.” So Lot went out and spoke to the men engaged to (or married to) his daughters: “Hurry, get out of this place, because the LORD is about to destroy the city!” But his sons-in-law thought he was joking.

      As dawn broke, the angels urged Lot on: “Hurry! Take your wife and the two daughters who are here, or you will be swept away in the city’s iniquity.” When he hesitated, the men took him, his wife, and his two daughters by the hand, because the LORD was merciful to him, and they brought him out and left him outside the city. Once they were out, one of them said, “Run for your life! Don’t look back, and don’t stop anywhere in the plain. Flee to the mountains, or you will be swept away.”

      Lot answered, “Oh no, my lord! You have been kind to your servant and shown me great mercy in saving my life, but I cannot run to the mountains; disaster will catch me and I will die. Look, this town is near enough to run to, and it is small. Let me escape there. It is only a small place, isn’t it? Then I will live.” He answered, “Very well, I grant this request too. I will not overthrow the town you speak of. Hurry, escape there, because I can do nothing until you arrive.” That is why the town was called Zoar.
  - range: 23-29
    heading: The overthrow of the cities
    plain: |
      The sun had risen over the land when Lot reached Zoar. Then the LORD rained burning sulfur and fire on Sodom and Gomorrah, from the LORD out of heaven. He overthrew those cities and the whole plain, everyone living in the cities, and everything that grew from the ground. But Lot’s wife, behind him, looked back, and she became a pillar of salt.

      Early the next morning Abraham went back to the place where he had stood before the LORD. He looked down toward Sodom and Gomorrah and the whole land of the plain, and he saw smoke rising from the land like the smoke of a furnace. So when God destroyed the cities of the plain, he remembered Abraham, and he brought Lot out of the catastrophe that overthrew the cities where Lot had lived.
  - range: 30-38
    heading: Lot’s daughters
    plain: |
      Lot went up from Zoar and settled in the mountains with his two daughters, because he was afraid to stay in Zoar; he and his two daughters lived in a cave. The older daughter said to the younger, “Our father is old, and there is no man in the land to marry us, as people do everywhere. Let us make our father drunk and sleep with him, so that we can keep our father’s family line alive.” On two nights they made him drunk, first the older and then the younger lay with him, and he did not know it. So both of Lot’s daughters became pregnant by their father. The older bore a son and named him Moab; he is the ancestor of the Moabites to this day. The younger also bore a son and named him Ben-ammi; he is the ancestor of the Ammonites to this day.

notes:
  - ref: 1
    phrase: Lot sat in the gate of Sodom
    kind: history
    title: Lot at the gate
    body: |
      Lot is sitting where a town’s public life went on. In Israel the city gate was the place where cases were judged and where a stranger was welcomed in: “the one who invited a stranger to come in through the gate became the agent by which acceptance was provided.” Lot’s seat there “may indicate the location of his home, his standing in the community as a compassionate individual.”

      Verse 9 shows how the men of Sodom saw him: “This one fellow came in to sojourn, and he will needs be a judge.” The Hebrew doubles the verb, *vayyishpot shafot*, “and he judges, judging.” In one reading the foreigner “is always wanting to play the judge,” probably because Lot had often reproved them. Peter says that Lot “vexed his righteous soul from day to day with their unlawful deeds” ([[2 Pet. 2:8]]).

      Joseph Smith’s revision puts Lot elsewhere and sharpens the taunt. In his manuscript Lot “sat in the door of his house in the City of Sodom,” and the mob says that “this one man came in to sojourn among us, And he will needs now make himself to be a Judge.”
    sources: [benson-lot, biblehub-interlinear, keil-genesis, lds-scriptures, jsp-ot2]
  - ref: 3
    phrase: he pressed upon them greatly
    kind: words
    title: Pressing them in, pressing him hard
    body: |
      Lot receives the strangers as Abraham had the day before. Both men rise to meet the visitors, bow to the ground, offer water for their feet, and set out a meal ([[Gen. 18:2–8]]), and both explain it the same way: “for therefore are ye come to your servant” ([[Gen. 18:5]]), “for therefore came they under the shadow of my roof” (verse 8). Whatever else is said of Lot, “nothing suggests that Lot’s was less than that offered by the patriarch.”

      One verb ties the night together. When the messengers say they will sleep in the street, Lot “pressed upon them greatly” (*vayyiftsar*, from a verb meaning “push, press,” here “urge”) until they come under his roof. In verse 9 the men of Sodom “pressed sore upon the man” with the same verb, *vayyiftseru*, now in its physical sense, and come near to breaking the door. One man presses strangers to come in where they will be safe; a whole city presses to drag them out. That is the contrast the chapter draws: “Abraham and Lot in contradistinction to the men of Sodom.”
    sources: [lds-scriptures, benson-lot, biblehub-interlinear, bdb]
  - ref: 5
    phrase: that we may know them
    kind: scripture
    title: What was the sin of Sodom?
    body: |
      The men of Sodom meant to abuse Lot’s guests sexually. *Know* (*yada‘*) is the ordinary Hebrew verb, used here, as in [[Judg. 19:22]], in its sexual sense; Lot answers in the same terms when he speaks of daughters “which have not known man” (verse 8). The demand came from the whole city, “both old and young, all the people from every quarter” (verse 4), and it was also an assault on guests under a host’s protection, a “violation of the social norms of hospitality and the proper treatment of guests.” Jude says that Sodom and the cities around it gave “themselves over to fornication, and going after strange flesh” ([[Jude 1:7]]).

      Scripture and the Church’s teachers name more than one sin, and they belong together. Ezekiel lists “pride, fulness of bread, and abundance of idleness,” and says that Sodom did not “strengthen the hand of the poor and needy” ([[Ezek. 16:49–50]]). Isaiah, rebuking Jerusalem, says its people “declare their sin as Sodom, they hide it not” ([[Isa. 3:9]]). “Sexual immorality was widely accepted and practiced in Sodom and nearby cities.” And Joseph Smith, preaching in Nauvoo in January 1843, gave another reason: the judgments of God had fallen on peoples and cities “in consequence of rejecting the gospel of Jesus Christ & the Prophets whom God hath sent,” as with “the cities of Sodom & gomoroah who were destroyed for rejecting the Prophets.” A proud and comfortable city that ignored the poor, made no secret of its immorality, and turned on the messengers sent to it: that is the Sodom the scriptures remember.
    sources: [biblehub-interlinear, bdb, benson-lot, lds-scriptures, scripture-helps-gen-18-23, jsp-discourse-1843-01-22]
  - ref: 8
    phrase: let me, I pray you, bring them out unto you
    kind: scripture
    title: Did Lot offer his daughters?
    body: |
      In the King James text Lot offers his two daughters to the mob to protect his guests, and readers have rightly recoiled. Joseph Smith’s revision tells the scene differently, and the Church follows it: “Lot did not offer his daughters to the angry mob. Instead, the mob demanded Lot’s visitors *and* his daughters.”

      In the revision (JST Gen. 19:9–15, in the appendix) the mob says, “We will have the men, and thy daughters also; and we will do with them as seemeth us good,” and the narrator adds, “Now this was after the wickedness of Sodom.” Lot refuses: “let me, I pray you, plead with my brethren that I may not bring them out unto you; and ye shall not do unto them as seemeth good in your eyes; For God will not justify his servant in this thing.” He asks once more that his guests be left alone, “that they may have peace in my house.” The mob grows angry and comes at the door, and the “angels of God, which were holy men,” pull Lot inside.

      The change alters the picture of Lot. He is not a father bargaining with his daughters but “a man who willingly places himself between a wicked mob and those that are under his protection—his family and guests.”
    sources: [benson-lot, scripture-helps-gen-18-23, jst-gen-19, jsp-ot2]
  - ref: 11
    phrase: smote the men that were at the door of the house with blindness
    kind: words
    title: A sudden blindness
    body: |
      The word for this blindness, *sanwerim*, is rare; the lexicon renders it “sudden blindness.” It comes back when Elisha prays that the Syrian army be struck blind ([[2 Kgs. 6:18]]), and in both stories it is a miracle, and in Elisha’s a passing one. The men of Sodom still grope for the door until they are worn out. In one reading it was a blindness “in which the eye sees, but does not see the right object,” a punishment for “their utter moral blindness.” Joseph Smith’s revision adds that “they were angery, so that they wearied themselves to find the door And could not find it.”
    sources: [biblehub-interlinear, bdb, keil-genesis, jsp-ot2]
  - ref: 14
    phrase: But he seemed as one that mocked unto his sons in law
    kind: words
    title: Sons-in-law who thought he was joking
    body: |
      “Mocked” here means joking: the Hebrew *kimtsacheq* is “as one jesting.” The sons-in-law took Lot’s warning as a bad joke. The verb is the one for laughter that runs through these chapters. Abraham laughed at the promise of a son ([[Gen. 17:17]]), Sarah laughed in the tent ([[Gen. 18:12–15]]), and the son’s name, Isaac, means “he laugheth” ([[Gen. 21:3–6]]). Here the word is used of a warning taken as a joke.

      Who these sons-in-law were is not certain. The Hebrew calls them “the ones taking his daughters,” and the participle can mean men who had already married Lot’s daughters or men about to marry them. The Septuagint, the ancient Greek translation, reads “who had married his daughters”; modern translations such as the NRSVUE read “who were to marry his daughters.” If they were married, Lot had other daughters who stayed behind in the city; if only betrothed, they were promised to the two who escaped. “The KJV Genesis account is not clear,” and Joseph Smith’s revision keeps its wording, “which maried his daughters.”
    sources: [biblehub-interlinear, bdb, lxx-rahlfs, nrsvue, benson-lot, jsp-ot2]
  - ref: 16
    phrase: the LORD being merciful unto him
    kind: christ
    title: Mercy that takes him by the hand
    body: |
      Lot was saved by the LORD’s mercy, not by his own speed. Even after the warning “he lingered” (*vayyitmahmah*, “linger, tarry, wait”), and the messengers took him, his wife, and his daughters by the hand and set them outside the city. The reason given is *bechemlat YHWH*, “in the compassion of the LORD” upon him.

      The noun *chemlah*, “compassion, mercy,” occurs only twice in the Bible: here, and in Isaiah’s memory of the Exodus, “in his love and in his pity he redeemed them” ([[Isa. 63:9]]). Latter-day revelation repeats Isaiah’s words in its description of the Lord’s coming: “in his love, and in his pity, he redeemed them, and bore them, and carried them all the days of old” ([[D&C 133:53]]). The LORD who pitied Lot is Jehovah, and “Jehovah is the premortal Jesus Christ.”

      Joseph Smith’s revision extends the mercy to the whole family: “the Lord being merciful unto them.”
    sources: [biblehub-interlinear, bdb, lds-scriptures, bd-jehovah, jsp-ot2]
  - ref: 20
    phrase: is it not a little one?
    kind: words
    title: A little city spared
    body: |
      Lot bargains for a small town, and it is spared at his word. Told to flee to the mountain, he asks for “this city” instead and twice calls it *mits‘ar*, “a small thing.” The messenger grants it: “I will not overthrow this city, for the which thou hast spoken” (verse 21). It had been called Bela ([[Gen. 14:2]]); “therefore,” says verse 22, it was named Zoar, a name that echoes Lot’s word, “on account of Lot’s calling it little.”

      The messenger also says, “I cannot do any thing till thou be come thither” (verse 22). The judgment waits for Lot to be safe, and Joseph Smith’s revision says so outright: “the Lord did not destroy Sodom untill Lot had entered into Zoar.” Lot did not stay long in the town he had asked for. “He feared to dwell in Zoar” and went up into the mountain after all (verse 30).
    sources: [biblehub-interlinear, bdb, lds-scriptures, keil-genesis, jsp-ot2]
  - ref: 24
    phrase: brimstone and fire from the LORD out of heaven
    kind: scripture
    title: Fire from the LORD, and a byword ever after
    body: |
      The verse names the LORD twice: the LORD rained fire “from the LORD out of heaven.” Joseph Smith’s revision gives the messengers a part in it. In his manuscript the Lord rained on Sodom and Gomorrah “for the Angels called upon the name of the Lord for brimstone & fire, from the Lord out of Heaven; And thus they overthrew those Cities.” They had been sent for this (verse 13); in the revision of chapter 18 the Lord tells them, “ye shall go down now, And see that their iniquitise are rewarded unto them.”

      The destruction became the standard by which later scripture measures God’s judgments. The verb of verses 21, 25, and 29, *hafakh*, “overthrow,” gave the prophets a noun, *mahpekhah*, used “always of overthrow of Sodom, Gomorrah etc.” Moses warned Israel that its land could become “like the overthrow of Sodom” ([[Deut. 29:23]]); Isaiah said Babylon would be “as when God overthrew Sodom and Gomorrah” ([[Isa. 13:19]]); and Amos told Israel, “I have overthrown some of you, as God overthrew Sodom and Gomorrah” ([[Amos 4:11]]). The fire and brimstone themselves pass into the New Testament and the Book of Mormon as the picture of final judgment ([[Luke 17:29]]; [[Rev. 21:8]]; [[2 Ne. 9:16]]).
    sources: [biblehub-interlinear, jsp-ot2, bdb, lds-scriptures]
  - ref: 26
    phrase: his wife looked back from behind him
    kind: prophets
    title: Remember Lot’s wife
    body: |
      Lot’s wife did exactly what the messenger had forbidden, and the Hebrew says so in his own words. “Look not behind thee” (verse 17) and “his wife looked back from behind him” use the same verb, *nabat*, with the same word for “behind.” The word for her look “conveys not just a simple glance but a longing or studying gaze.” President Jeffrey R. Holland put it this way: “what was wrong with Lot’s wife was that she wasn’t just *looking* back; in her heart she wanted to *go* back.” And a little further on: “she looked back longingly. In short, her attachment to the past outweighed her confidence in the future.”

      Genesis does not explain the pillar of salt. What scripture keeps is the warning. Speaking of the day “when the Son of man is revealed,” the Savior said, “he that is in the field, let him likewise not return back. Remember Lot’s wife. Whosoever shall seek to save his life shall lose it” ([[Luke 17:30–33]]). The Lord repeats the warning in latter-day revelation to those leaving spiritual Babylon: “he that goeth, let him not look back lest sudden destruction shall come upon him” ([[D&C 133:14–15]]).

      Abraham also looks toward the cities the next morning (verse 28), “with no dire consequences.” His verb is a different one, *shaqaf*, “look out and down,” which “means simply to ‘watch.’”
    sources: [biblehub-interlinear, bdb, scripture-helps-gen-18-23, holland-best-2010, lds-scriptures]
  - ref: 29
    phrase: God remembered Abraham
    kind: scripture
    title: Saved for Abraham’s sake
    body: |
      Lot was brought out because of Abraham. The narrator sums up the night in one sentence: “God remembered Abraham, and sent Lot out of the midst of the overthrow.” Abraham’s plea for the righteous ([[Gen. 18:23–32]]) did not save the city, but it was not wasted. *Remembered* (*vayyizkor*) is the verb of [[Gen. 8:1]], “God remembered Noah,” and Peter sets the two rescues side by side: God “saved Noah” and “delivered just Lot,” for “The Lord knoweth how to deliver the godly out of temptations” ([[2 Pet. 2:5–9]]). In this, “Lot was comparable to Noah.”

      Genesis does not say whether Abraham, looking down that morning on smoke “as the smoke of a furnace” (verse 28), knew that Lot was alive. Joseph Smith’s revision has God tell him: “God spake unto Abraham, Saying, I have remembered Lot, And sent him out of the midst of the overthrow, that thy brother might not be destroyed.” It ends, “And Abraham was comforted.”
    sources: [biblehub-interlinear, lds-scriptures, benson-lot, jsp-ot2]
  - ref: 31
    phrase: there is not a man in the earth to come in unto us
    kind: history
    title: The daughters’ plan
    body: |
      Genesis tells the last scene without comment: on two nights Lot’s daughters made him drunk, and each conceived a child by him. Joseph Smith’s revision supplies the judgment the narrator leaves out. In his manuscript “the first born dealt wickedly,” and of both, “they done wickedly” (JST Gen. 19:37, 39). They “seemed to understand that they were doing something wrong, as they planned to make their father drunk so he would not realize what was happening,” and the revision, by naming their act and not his, appears “to demonstrate that Lot is to be understood as innocent in these matters.”

      Why they did it, the text does not say, and the elder daughter’s words can be read two ways. “There is not a man in the earth” may mean that they believed the whole world had burned: “the daughters may have thought that the whole world had been destroyed in the holocaust that befell Sodom and Gomorrah and that Lot was the only source of children left to them.” Or it may mean only that no man would marry them now. Lot had lost his flocks, his house, and his city and was living in a cave, “homeless and apparently lacking any possessions to make a dowry possible.” Their stated aim was to “preserve seed of our father”; the verb, *unechayyeh*, is “a form of the verb ‘to live,’” to keep their father’s line alive.

      Neither reading excuses the act. “Incest was absolutely forbidden to ancient Israelites,” and “there is no way to justify the wickedness of what the two daughters did.” The story is one more sign that the Old Testament “records the evils of the people as well as their righteousness.”
    sources: [jsp-ot2, scripture-helps-gen-18-23, benson-lot, ot-manual-gen-18-23, biblehub-interlinear]
  - ref: 37
    phrase: called his name Moab
    kind: history
    title: Moab, Ammon, and Ruth
    body: |
      The chapter ends by telling where two of Israel’s nearest neighbors came from. *Moab* is taken to mean “from my father,” and *Ben-ammi* “son of my people”; the Septuagint spells out both, adding the mothers’ words, “saying, He is of my father” and “saying, The son of my family.” The land of Moab “lay east of the Dead Sea,” and the Moabites “spoke a language that closely resembled Hebrew, but there was constant warfare between the two nations.” An origin story like this one “is unfavorable to these people, which might have fueled tension between them and the Israelites.”

      Yet the Lord treated them as Lot’s heirs. On the way to Canaan Moses was told, “Distress not the Moabites... because I have given Ar unto the children of Lot for a possession,” and the same of Ammon ([[Deut. 2:9]]; [[Deut. 2:19]]). The law later barred Ammonites and Moabites from “the congregation of the Lord” ([[Deut. 23:3]]), but a Moabite woman, Ruth, became the great-grandmother of David ([[Ruth 4:13–17]]) and is named in the genealogy of Jesus Christ ([[Matt. 1:5]]). The line that began in a cave above the ruins of Sodom runs, through Ruth, to the Savior.
    sources: [benson-lot, bdb, lxx-rahlfs, bd-moab, scripture-helps-gen-18-23, lds-scriptures]

christ: |
  The LORD who rains judgment on the cities of the plain is Jehovah, and “Jehovah is the premortal Jesus Christ.” In mortality He told this story Himself. “As it was in the days of Lot,” He said, people ate, drank, bought, sold, planted, and built, “But the same day that Lot went out of Sodom it rained fire and brimstone from heaven, and destroyed them all. Even thus shall it be in the day when the Son of man is revealed” ([[Luke 17:28–30]]). He also used Sodom to measure the guilt of those who had seen His own works: “if the mighty works, which have been done in thee, had been done in Sodom, it would have remained until this day” ([[Matt. 11:23–24]]).

  The chapter shows His mercy as plainly as His judgment. Lot lingered, and the messengers took him by the hand, “the LORD being merciful unto him” (verse 16; see the notes on verses 16 and 29).

