chapter: 43
title: Mercy Before the Man
tagline: The grain runs out, and Jacob finally lets Benjamin go because Judah pledges himself as surety for him. Jacob prays that God will give his sons mercy before the man in Egypt. That man is Joseph, who is moved to tears at the sight of Benjamin and sets a table for the brothers who sold him.
when: 'During the first two years of the seven-year famine ([[Gen. 41:54]]; [[Gen. 45:6]]). The text gives no year.'

setting: |
  Chapter 42 ended in a standoff. Ten of Jacob’s sons had gone down to Egypt for grain and bowed to the governor without knowing him as their brother ([[Gen. 42:6]]). He called them spies, kept Simeon bound, and had their money put back in their sacks ([[Gen. 42:9]]; [[Gen. 42:24–25]]). Jacob would not let Benjamin go: “My son shall not go down with you” ([[Gen. 42:38]]).

  Chapter 43 is the second journey. It runs straight into chapter 44 and the revelation of chapter 45, and Stephen later calls this return the time when “Joseph was made known to his brethren” ([[Acts 7:13]]). The chapter has three parts: Jacob lets Benjamin go (verses 1–14), the brothers are brought into Joseph’s house (15–25), and the meal (26–34).

  The chapter never says why Joseph does what he does. In chapters 42–45 he “tested his brothers several times before revealing his identity,” and the notes below say where a reason is only inferred. Chapters 37 and 38 stand behind the scenes: the dreams are coming true ([[Gen. 37:5–11]]), and Judah, who had proposed selling Joseph, is the brother who now speaks ([[Gen. 37:26–27]]; [[Gen. 38]]).

thread: |
  Genesis 43 turns on one Hebrew word. In verse 14 Jacob asks God to “give you mercy before the man,” and the word is *rachamim*. Sixteen verses later the same word is what stirs in Joseph: “his bowels did yearn upon his brother” (verse 30). Jacob does not know that the man he is praying about is his own son. Genesis does not say that the prayer was answered; it uses Jacob’s word for what Joseph feels.

  Around that word, earlier scenes of the story come back changed. Judah, who proposed selling Joseph ([[Gen. 37:26–27]]), becomes surety for Benjamin (verse 9). The brothers who “could not speak peaceably” to Joseph ([[Gen. 37:4]]) are told “Peace be to you” (verse 23) and are asked after their father’s peace (verse 27); the Hebrew word is *shalom* each time. And all eleven bow to him, as his dreams had said (verses 26, 28).

  God is named three times in the chapter, always by a character and never by the narrator, which is how the last chapters of Genesis speak of Him (see the note on verse 14).

sections:
  - range: 1-14
    heading: Jacob lets Benjamin go
    plain: |
      The famine in the land was severe. When the grain they had brought from Egypt was all eaten, their father told them, “Go back and buy us a little food.” Judah answered, “The man warned us solemnly, ‘You will not see my face unless your brother is with you.’ If you send our brother with us, we will go down and buy food for you. If you will not send him, we will not go, because the man said, ‘You will not see my face unless your brother is with you.’”

      Israel said, “Why did you treat me so badly as to tell the man that you had another brother?” They answered, “The man questioned us closely about ourselves and our family: ‘Is your father still alive? Do you have another brother?’ We answered him according to his questions. How could we know that he would say, ‘Bring your brother down’?” Judah said to Israel his father, “Send the boy with me, and we will get up and go, so that we may live and not die, we and you and our little ones. I will be surety for him; you can require him from my hand. If I do not bring him back to you and set him before you, let me bear the blame forever. If we had not delayed, we could have gone and come back twice by now.”

      Their father Israel said, “If it must be so, then do this: take some of the best products of the land in your bags and carry them down to the man as a gift, a little balm and a little honey, spices and myrrh, nuts and almonds. Take double the money, and carry back in your hands the money that was returned in the mouths of your sacks; perhaps it was a mistake. Take your brother, too, and go back to the man. May God Almighty give you mercy before the man, so that he will send back your other brother and Benjamin. As for me, if I am bereaved of my children, I am bereaved.”
  - range: 15-25
    heading: Brought to Joseph’s house
    plain: |
      The men took the gift, double the money, and Benjamin, and went down to Egypt and stood before Joseph. When Joseph saw Benjamin with them, he said to the man in charge of his house, “Take these men to my house, slaughter an animal and prepare a meal, for these men will eat with me at noon.” The man did as Joseph said and brought them to Joseph’s house.

      The brothers were afraid because they had been brought there. They said, “It is because of the money that was put back in our sacks the first time that we are brought in, so that he can find a reason to attack us, seize us as slaves, and take our donkeys.” So they went up to Joseph’s steward and spoke to him at the door of the house. “Please, sir,” they said, “we came down once before to buy food. When we came to the lodging place and opened our sacks, each man’s money was there in the mouth of his sack, the full amount. We have brought it back in our hands, and we have brought other money to buy food. We do not know who put our money in our sacks.” He said, “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks. I received your money.” Then he brought Simeon out to them.

      The steward brought the men into Joseph’s house, gave them water to wash their feet, and fed their donkeys. They got the gift ready for Joseph’s arrival at noon, because they had heard that they would eat there.
  - range: 26-34
    heading: The meal
    plain: |
      When Joseph came home, they brought into the house the gift they had with them and bowed to the ground before him. He asked how they were, and said, “Is your father well, the old man you told me about? Is he still alive?” They answered, “Your servant our father is well; he is still alive.” And they bowed low and paid him honor.

      Joseph looked up and saw his brother Benjamin, his mother’s son, and said, “Is this your younger brother, whom you told me about?” And he said, “God be gracious to you, my son.” Then Joseph hurried out, because he was overcome with feeling for his brother, and he looked for a place to weep. He went into his private room and wept there. After washing his face he came out, controlled himself, and said, “Serve the meal.”

      They served him by himself, the brothers by themselves, and the Egyptians who ate with him by themselves, because Egyptians could not eat with Hebrews; that was detestable to them. The brothers were seated before him in order of age, from the firstborn to the youngest, and they looked at one another in amazement. Portions were taken to them from his table, but Benjamin’s portion was five times as large as any of theirs. And they drank and were merry with him.

notes:
  - ref: 3
    phrase: Judah spake unto him
    kind: history
    title: Why Judah speaks
    body: |
      Genesis does not say why Judah is the one who answers Jacob. One reading is that his three older brothers, Reuben, Simeon, and Levi, had each been set aside. In chapter 42 Reuben, the eldest, had offered his two sons as a pledge, and Jacob had refused him: “My son shall not go down with you” ([[Gen. 42:37–38]]). The next two sons were Simeon and Levi ([[Gen. 29:32–35]]). Simeon was bound in Egypt ([[Gen. 42:24]]), and the two of them had killed the men of Shechem, for which Jacob later cursed their anger ([[Gen. 34:25–30]]; [[Gen. 49:5–7]]). So the fourth son speaks, on this reading, because Reuben “had already been refused” and Levi “had forfeited his father’s confidence through his treachery to the Shechemites.” What the passages about Judah do show, this one among them, is a man who “was a natural leader among the sons of Jacob.”

      He is also the brother who had proposed selling Joseph: “let us sell him to the Ishmeelites” ([[Gen. 37:26–27]]). The note on verse 9 takes up what his offer now says.
    sources: [lds-scriptures, keil-genesis, bd-judah]
  - ref: 7
    phrase: asked us straitly of our state, and of our kindred
    kind: history
    title: Did Joseph ask, or did they tell?
    body: |
      The brothers’ account of the first journey differs a little from chapter 42’s, and the two are best read as filling each other out. Here they say the man “asked us straitly” (that is, pressed them with questions) about their father and another brother. In chapter 42, when Joseph had called them spies, they gave the information themselves: “Thy servants are twelve brethren… the youngest is this day with our father” ([[Gen. 42:13]]). The later account is “explaining and supplementing the former.” Accused of spying, “they would naturally give an account of themselves,” and Joseph, “anxious to know about his father and brother, would certainly put numerous questions to them,” which they “would answer… fully and frankly, little suspecting who was the questioner.”

      A reader may also notice that Jacob speaks of the grain and says nothing of Simeon, who is not referred to until “your other brother” in verse 14 and not named until verse 23. Some scholars explain both differences by sources. On that view this chapter is taken from one proposed source, which scholars label “J,” and the family’s answer in [[Gen. 42:13]] from another, labelled “E,” so that this verse is “evidently independent” of that one, and Jacob “seems to forget about Simeon” because of “the change from the E to the J narrative.” Moses “used several documentary sources from which he compiled the book of Genesis,” but where those sources divide in this story is a scholarly proposal, not a Church teaching. On either reading the brothers’ defense is the same: “could we certainly know that he would say, Bring your brother down?”
    sources: [lds-scriptures, ellicott-genesis, ryle-genesis, bd-pentateuch]
  - ref: 9
    phrase: I will be surety for him
    kind: words
    title: Judah offers himself
    body: |
      Judah pledges himself, where Reuben had pledged his sons. Reuben had offered Jacob’s grandsons: “Slay my two sons, if I bring him not to thee” ([[Gen. 42:37]]). Judah says, “of my hand shalt thou require him: if I bring him not unto thee, and set him before thee, then let me bear the blame for ever.” The Hebrew of the last clause is literally “I shall have sinned against thee for ever.” What he stakes is his standing with his father, since it would be no slight matter “to stand in his father’s presence all the rest of his life as one guilty of a grievous crime.” He argues in his father’s own words: “that we may live, and not die” (verse 8) is what Jacob said when he first sent them to Egypt ([[Gen. 42:2]]), and the Hebrew is the same in both places.

      It is “significant” that the brother “who suggested that Joseph be sold” is the one now “willing to become ‘the surety’ for Benjamin.” The offer is read as “evidence of sincere repentance on the brothers’ part,” and Judah makes good on it in [[Gen. 44:32–33]].

      The verb for “surety” is *‘arab*, “take on pledge, give in pledge,” and, with a person as its object, “go surety for the safety of,” with this verse and [[Gen. 44:32]] as the examples. It shares its letters with the noun for the pledge Judah left with Tamar (*‘erabon*, [[Gen. 38:17–20]]); the note on [[Gen. 38:18]] follows that link. The same verb is used “of God” in two prayers: “Be surety for thy servant for good” ([[Ps. 119:122]]) and “undertake for me” ([[Isa. 38:14]]). The note on Isaiah’s verse follows the word into the New Testament.
    sources: [lds-scriptures, oshb-wlc, bdb, ryle-genesis, ellicott-genesis, ot-manual-gen-37-50]
  - ref: 11
    phrase: carry down the man a present
    kind: history
    title: What Jacob sends
    body: |
      Jacob sends three things: a gift of “the best fruits in the land,” the money that had come back in the sacks, and a second sum for the new grain, which the brothers call “other money” (verse 22). In chapter 42 he had said, “all these things are against me” ([[Gen. 42:36]]); now it is “If it must be so now, do this.” Of the money that came back in the sacks he says only, “peradventure it was an oversight,” and he tells them to carry it back.

      Three of the goods in the gift were the cargo of the caravan that bought Joseph: “spicery and balm and myrrh, going to carry it down to Egypt” ([[Gen. 37:25]]). The Hebrew words are the same, *nekot*, *tsori*, and *lot*. They were goods that traders carried from Gilead to Egypt. Genesis does not remark on the match.
    sources: [lds-scriptures, oshb-wlc]
  - ref: 14
    phrase: God Almighty
    kind: words
    title: God Almighty
    body: |
      Jacob sends his sons off with a blessing in the name *El Shaddai*, “God Almighty,” the name under which the covenant came to him and to his fathers. It is the name the Lord used with Abraham ([[Gen. 17:1]]), the name in Isaac’s blessing on Jacob ([[Gen. 28:3]]), and the name God gave when He made Jacob his own promise: “I am God Almighty: be fruitful and multiply; a nation and a company of nations shall be of thee” ([[Gen. 35:11]]). The notes on those verses say what the name may mean and follow it through the covenant. On one reading Jacob’s choice of it is deliberate. He uses *El Shaddai* here and again when he adopts Joseph’s sons ([[Gen. 48:3]]) because Jehovah “had manifested Himself not only to him… but also to his fathers Abraham and Isaac” under that name, and in such set blessings it was “more significant and impressive than the simple name Jehovah.”

      His last words are resignation. “If I be bereaved of my children, I am bereaved” is literally “And I, if I am bereaved, I am bereaved,” that is, “if I am to lose my children, let it be so!”

      God is named in this chapter only by the characters: Jacob here, the steward in verse 23 (“your God, and the God of your father”), and Joseph in verse 29 (“God be gracious unto thee”). The narrator never says “the LORD.” That is the pattern of the last chapters of Genesis. By one count, after Genesis 40:1 the name Jehovah “almost entirely disappears, occurring only once in Genesis 40–50,” in Jacob’s words at [[Gen. 49:18]], and apart from [[Gen. 46:1–2]], wherever God is referred to in those chapters “it is always by the persons concerned.”
    sources: [lds-scriptures, oshb-wlc, keil-genesis]
  - ref: 16
    phrase: Joseph saw Benjamin with them
    kind: history
    title: What changes when Joseph sees Benjamin
    body: |
      Joseph’s manner toward the brothers changes when he sees Benjamin, the brother he had demanded as proof. He had told them, “bring your youngest brother unto me; so shall your words be verified, and ye shall not die” ([[Gen. 42:20]]). Now their words are verified, and the man who “spake roughly unto them” ([[Gen. 42:7]]) orders a feast. On one reading more had been at stake for him than their honesty. At the first visit he had seen “neither his full brother Benjamin, nor his father,” and the question was, “Have his brothers killed those most dear to him?” Now Benjamin stands in front of him.

      The testing is not over. In these chapters Joseph “seemed to be giving his brothers opportunities to prove that they had changed and would not betray Benjamin as they had betrayed him,” and the hardest of those comes in chapter 44 (see the notes on [[Gen. 42:15]] and [[Gen. 44:2]]). Genesis records what Joseph does and not his reasons.
    sources: [lds-scriptures, gee-clothes-cups, scripture-helps-gen-42-50]
  - ref: 18
    phrase: take us for bondmen
    kind: history
    title: Why the invitation frightens them
    body: |
      The brothers take the invitation for a trap, and what they expect is the penalty for theft. They suppose they are brought in “because of the money that was returned in our sacks,” so that Joseph may “seek occasion against us, and fall upon us, and take us for bondmen.” The Hebrew behind “seek occasion” is literally “roll himself upon us”: the favor is meant “to put them off their guard, and then suddenly seize them on a false charge.” Slavery was what a thief could expect. Israel’s later law says that a thief who cannot make restitution “shall be sold for his theft” ([[Ex. 22:3]]), and when the cup is found in the next chapter the brothers name that penalty themselves: “we also will be my lord’s bondmen” ([[Gen. 44:9]]). So they stop the steward “at the door of the house” (verse 19) and explain about the money before they go in.

      Their fear has a history. At the first journey they had said, “We are verily guilty concerning our brother” ([[Gen. 42:21]]), and when the money turned up in a sack they saw God’s hand in it: “What is this that God hath done unto us?” ([[Gen. 42:28]]). When the cup is found, Judah will say, “God hath found out the iniquity of thy servants” ([[Gen. 44:16]]).
    sources: [lds-scriptures, oshb-wlc, ryle-genesis]
  - ref: 23
    phrase: your God, and the God of your father, hath given you treasure in your sacks
    kind: words
    title: Who put the money in the sacks?
    body: |
      The steward credits God with what Joseph had arranged, and tells the brothers not to be afraid of it. In verse 22 they say they “cannot tell who put our money in our sacks.” The reader knows: “Joseph commanded to fill their sacks with corn, and to restore every man’s money into his sack” ([[Gen. 42:25]]). The steward answers, “Peace be to you, fear not: your God, and the God of your father, hath given you treasure in your sacks: I had your money.” “I had your money” is literally “your money came unto me”: their payment had been received, and they were “innocent.” The silver in the sacks, then, is a gift, and the word for it, *matmon*, means “hidden treasure.” When the money first turned up, the brothers had asked, “What is this that God hath done unto us?” ([[Gen. 42:28]]). The steward gives the same event to the same God, as a kindness.

      How the steward came to speak of “the God of your father” the text does not say; on one reading, “Joseph had evidently instructed his steward what to say.” “Peace” is *shalom*, here “a formula of encouragement and reassurance” (for the word’s place in this story, see the note on [[Gen. 37:14]]).
    sources: [lds-scriptures, oshb-wlc, bdb, ryle-genesis]
  - ref: 28
    phrase: made obeisance
    kind: scripture
    title: All eleven bow
    body: |
      This is the second time the brothers bow to Joseph, and the first time all eleven are there. The second dream had “the sun and the moon and the eleven stars” making obeisance to him ([[Gen. 37:9]]). At the first journey the brothers “bowed down themselves before him with their faces to the earth” ([[Gen. 42:6]]), but only ten had come, because Jacob “sent not” Benjamin ([[Gen. 42:3–4]]); Joseph remembered his dreams then ([[Gen. 42:9]]). Now Benjamin is among them, and the wording is the dreams’ own: the Hebrew verb for bowing and the word for “to the earth” (verse 26) are those of [[Gen. 37:10]] (see the note on [[Gen. 37:8]]). “The phraseology in this verse is the same as that used in Genesis 37:7, 9. It had taken over two decades, but the Lord’s revelations were now fulfilled.”

      The father’s part in the second dream is left open. In the dream he bows too ([[Gen. 37:10]]); here Jacob is not in the room, and Genesis does not say that his part was fulfilled.
    sources: [lds-scriptures, oshb-wlc, ot-manual-gen-37-50]
  - ref: 30
    phrase: his bowels did yearn upon his brother
    kind: words
    title: Jacob’s word for mercy comes back
    body: |
      Jacob’s prayer for mercy and Joseph’s feeling for Benjamin use the same Hebrew word. In verse 14 Jacob asked God to “give you mercy before the man,” and the word is *rachamim*, “compassion.” In verse 30 the same word is what stirs in Joseph: *nikhmeru rachamav*, “his bowels did yearn,” where the verb means to “grow warm and tender.”

      The word fits the scene. Many derive *rachamim* from *rechem*, “womb,” so that its sense was “originally brotherhood, brotherly feeling, of those born from same womb,” or “motherly feeling.” The verse before has just called Benjamin “his mother’s son” (verse 29). Rachel died bearing him ([[Gen. 35:16–18]]), and “Joseph and Benjamin are the only two children of Rachel.” The same phrase describes the mother in Solomon’s judgment, whose “bowels yearned upon her son” ([[1 Kgs. 3:26]]).

      Joseph goes into his chamber to weep, washes his face, and “refrained himself.” The restraint holds until [[Gen. 45:1]], where the same verb returns: “Joseph could not refrain himself.”
    sources: [oshb-wlc, bdb, ryle-genesis, lds-scriptures]
  - ref: 32
    phrase: an abomination unto the Egyptians
    kind: history
    title: Three tables
    body: |
      The Egyptians eat apart because eating with Hebrews would defile them, and the usual explanation is what Hebrew herdsmen killed and ate. Joseph is served “by himself,” his brothers “by themselves,” and the Egyptians who eat with him “by themselves,” “because the Egyptians might not eat bread with the Hebrews; for that is an abomination unto the Egyptians.” The Hebrew word, *to‘evah*, is “the technical term expressing that which was abhorrent and a source of ceremonial pollution.” Moses uses it when he says that Israel’s sacrifices would be “the abomination of the Egyptians” ([[Ex. 8:26]]), and a later verse says that “every shepherd is an abomination unto the Egyptians” ([[Gen. 46:34]]). Genesis does not say what the offense was. Egyptians pictured several of their gods as cattle, “especially female cattle,” and the Hebrews, as herdsmen, slaughtered and ate them, which the Egyptians would see as “a terrible abomination.” Herodotus’s *Histories* report the same scruple toward Greeks: cows “are sacred to Isis,” and for that reason no Egyptian would use a Greek’s knife or cauldron, or eat meat cut with a Greek knife.

      Why Joseph sits alone Genesis does not say either. The natural reason is his rank, and not that he was a Hebrew: he sits apart “on account of his position.”
    sources: [lds-scriptures, oshb-wlc, ot-manual-gen-37-50, keil-genesis, herodotus-histories, ryle-genesis]
  - ref: 33
    phrase: the firstborn according to his birthright, and the youngest according to his youth
    kind: history
    title: Seated by age
    body: |
      The brothers are seated in order of age, and it astonishes them because, as far as they know, the man who arranged it has no way of knowing their birth order. The men “marvelled one at another” (*vayyitmehu*, “each to his fellow”). On one reading, finding themselves placed by age, they “must have supposed that Joseph possessed powers of divination.” The reader knows the plain answer: he is their brother.

      Divination is named outright in the next chapter. Joseph’s steward speaks of the cup “whereby indeed he divineth” ([[Gen. 44:5]]), and Joseph asks, “wot ye not that such a man as I can certainly divine?” ([[Gen. 44:15]]). The note on [[Gen. 44:5]] takes up what that claim means.
    sources: [oshb-wlc, ellicott-genesis, lds-scriptures]
  - ref: 34
    phrase: Benjamin’s mess was five times so much as any of theirs
    kind: history
    title: Five times as much
    body: |
      Benjamin’s portion is a mark of honor, and Genesis does not say what else Joseph meant by it. A “mess” (Hebrew *mas’et*) is a “portion (carried to some one), especially from table of king or superior,” as when Uriah was followed by “a mess of meat from the king” ([[2 Sam. 11:8]]).

      In the Church’s reading, Joseph’s conduct in chapters 42–45 is a series of tests, “most of [which] focused on young Benjamin, who had become Jacob’s favored son after Joseph was sold into slavery.” On one reading the portions are one of them: Joseph meant “to draw out his brethren to show their real feelings towards Benjamin, that he might see whether they would envy and hate him on account of this distinction,” as they had once hated Joseph over his coat. What the text records is the next line: “And they drank, and were merry with him.” The Hebrew verb is the one for becoming drunk (*shakar*), used here “of social drinking”: they “drank largely with him,” that is, “they were perfectly satisfied with what they ate and drank; not, they were intoxicated.” The meal “banished all their anxiety and fear,” and no envy is recorded.
    sources: [bdb, oshb-wlc, lds-scriptures, scripture-helps-gen-42-50, keil-genesis]

christ: |
  Judah, who had proposed selling a brother, pledges himself for another: “of my hand shalt thou require him” (verse 9). He makes good on the pledge in chapter 44, where he asks to stay “instead of the lad a bondman to my lord” ([[Gen. 44:33]]), and it is that offer which “can remind us of Jesus Christ, who was Judah’s descendant”: “As Judah offered to take Benjamin’s punishment so that Benjamin could return to his father, so Jesus Christ took our sins upon Himself so that we can return to our Heavenly Father.” The passage the Church points to is [[Mosiah 15:9]], where the Son, “having the bowels of mercy,” is “standing betwixt them and justice.”

  The other likeness is in Joseph. The brother who was sold receives the brothers who sold him, has given them back the silver they paid ([[Gen. 42:25]]), and sets bread before them. The likeness is drawn this way: “Joseph provided bread for Israel and saved them from death, all without cost. Jesus, the Bread of Life, did the same for all men” (see [[Gen. 42:35]]).

explore: |
  - **Judah’s pledge carried out.** [[Gen. 44:18–34]]; compare [[Gen. 38:17–26]].
  - **Joseph makes himself known.** [[Gen. 45:1–15]]; [[Acts 7:9–14]].
  - **Mercy asked “before this man.”** Nehemiah prays in nearly the same Hebrew words ([[Neh. 1:11]]); compare [[Dan. 1:9]].

