chapter: 6
title: Noah Found Grace
tagline: The earth fills with violence, and the LORD grieves that He made man. One man finds grace. Noah walks with God, receives the promise of God’s covenant, and builds the ark exactly as he is told.
when: 'In the days of Noah, before the Flood. Noah is five hundred years old at the end of chapter 5 and six hundred when the Flood comes (5:32; 7:6). The text gives no year.'

setting: |
  Genesis 6 turns from the long line of Adam’s descendants in chapter 5 to the man through whom that line would survive. Halfway through the chapter a new heading begins: “These are the generations of Noah” (verse 9). The book is built on such headings. “Each new section begins ‘These are the generations,’” and chapters 4–9 make up Noah’s part of the book. This chapter sets up the Flood: the corruption that brought it (verses 1–13) and the ark that would carry Noah’s family through it (verses 14–22). The Flood itself comes in chapters 7–8, and the covenant made after it in chapter 9.

  The first thirteen verses are told again, at greater length, in [[Moses 8:13–30]], part of Joseph Smith’s revision of Genesis. The Book of Moses adds much that Genesis leaves out: the Lord ordained Noah and sent him to “declare his Gospel unto the children of men, even as it was given unto Enoch” ([[Moses 8:19]]), and the people would not listen and sought his life ([[Moses 8:20]]; [[Moses 8:26]]). The notes below bring it in where it answers a question about a verse in Genesis.

  Later scripture comes back to Noah often. Isaiah speaks of “the waters of Noah” ([[Isa. 54:9]]), Ezekiel names him with Daniel and Job ([[Ezek. 14:14]]), and Jesus, Hebrews, and Peter all return to him ([[Matt. 24:37–39]]; [[Heb. 11:7]]; [[1 Pet. 3:20]]). “The authenticity of the Genesis account of the Flood is confirmed by latter-day revelation.”

thread: |
  Genesis 6 tells of a creation coming undone, in the words of the Creation. In chapter 1, “God saw every thing that he had made, and, behold, it was very good” ([[Gen. 1:31]]). Here “God looked upon the earth, and, behold, it was corrupt” (verse 12). In Hebrew the two lines begin the same way, *vayyar Elohim… vehinneh*, “and God saw… and behold,” and the second reverses the first: what had been declared “good” in the Creation was “now reversed and undone through wickedness.” What God resolves to destroy is the list from the Creation: “man, and beast, and the creeping thing, and the fowls of the air” (verse 7). The Flood that follows is commonly read as a re-creation, “paralleling the context and language of the creation stories in Genesis.”

  The ruin is the people’s own doing. One Hebrew verb carries it: the earth “was corrupt,” all flesh “had corrupted his way,” and so God says, “I will destroy them” (verses 11–13; see the note on verse 13).

  Against all this stands one man. When Noah was born, his father hoped that the boy would “comfort us concerning our work and toil of our hands” ([[Gen. 5:29]]). Verse 6 uses the same two words of God. It “repented” the LORD (*nacham*, the verb translated “comfort”), and it “grieved” Him (*yit‘atstsev*, built on the same three letters as the word for “toil”). Noah “found grace in the eyes of the LORD” (verse 8). With him God will establish His covenant (verse 18), the first time the word *covenant* appears in the Bible. The chapter ends with a single line about Noah: “according to all that God commanded him, so did he” (verse 22).

sections:
  - range: 1-4
    heading: The sons of God and the daughters of men
    plain: |
      When people began to multiply on the earth and daughters were born to them, the sons of God saw that the daughters of men were beautiful, and they married any of them they chose. The Lord said, “My Spirit will not always strive with man, for he is flesh. Yet his days will be a hundred and twenty years.” There were giants on the earth in those days, and afterward too, when the sons of God had children by the daughters of men. These were the mighty men of old, men of renown.
  - range: 5-8
    heading: The Lord’s grief
    plain: |
      The Lord saw how great human wickedness had become on the earth, and that everything the thoughts of people’s hearts devised was evil all the time. The Lord was sorry that He had made man on the earth, and it grieved Him to the heart. So the Lord said, “I will wipe from the face of the earth the people I have created, and with them the beasts, the creeping things, and the birds of the air, for I am sorry that I made them.” But Noah found favor in the eyes of the Lord.
  - range: 9-13
    heading: Noah in a corrupt world
    plain: |
      This is the family history of Noah. Noah was a just man, of complete integrity in his generation, and Noah walked with God. He had three sons: Shem, Ham, and Japheth. The earth was corrupt in God’s sight and full of violence. God looked at the earth and saw how corrupt it was, for all flesh had corrupted its way on the earth. So God said to Noah, “The end of all flesh has come before me, for the earth is filled with violence through them. I am going to destroy them along with the earth.”
  - range: 14-22
    heading: The ark
    plain: |
      “Make yourself an ark of gopher wood. Make rooms in it, and coat it with pitch inside and out. Make it three hundred cubits long, fifty cubits wide, and thirty cubits high. Make a window (or a roof) for the ark and finish it to a cubit from the top. Put the door in its side, and build it with lower, second, and third stories.

      “I am bringing a flood of waters on the earth to destroy all flesh that has the breath of life under heaven. Everything on the earth will die. But with you I will establish my covenant. You will go into the ark, you and your sons, your wife, and your sons’ wives with you. Bring into the ark two of every kind of living thing, male and female, to keep them alive with you: two of every kind of bird, animal, and creeping thing will come to you. And take with you every kind of food that is eaten, and store it up as food for you and for them.”

      Noah did everything just as God commanded him.

notes:
  - ref: 2
    phrase: the sons of God saw the daughters of men
    kind: scripture
    title: Who were the sons of God?
    body: |
      The Book of Moses answers this question: the “sons of God” were Noah’s covenant family, and the trouble was that their daughters married men who rejected God. The Hebrew phrase is *bene ha-Elohim*, and in Job the same words name heavenly beings ([[Job 1:6]]; [[Job 38:7]]). Some ancient Jewish readers took Genesis that way. The book of 1 Enoch, probably written in the last centuries before Christ, retells these verses as a story of fallen angels: “the angels, the children of the heaven, saw and lusted after them.” Others have read the phrase of Seth’s godly line. The words alone cannot settle the question, because scripture also calls God’s faithful people His sons: “Ye are the sons of the living God” ([[Hos. 1:10]]).

      Latter-day revelation settles it. “Noah and his sons hearkened unto the Lord, and gave heed, and they were called the sons of God” ([[Moses 8:13]]). The next verses turn the Genesis wording around: “the sons of men saw that those daughters were fair” and married them, and the Lord told Noah, “The daughters of thy sons have sold themselves” ([[Moses 8:14–15]]). Joseph Fielding Smith summed it up: “the daughters of the sons of God, that is to say of those who held the priesthood, were transgressing the commandment of the Lord and were marrying out of the Church.” When Noah preached, the men who rejected him claimed the title for themselves: “Behold, we are the sons of God; have we not taken unto ourselves the daughters of men?” ([[Moses 8:21]]).
    sources: [biblehub-interlinear, keil-genesis, charles-1-enoch, sc-knowhy-835, lds-scriptures, ot-manual-gen-4-11]
  - ref: 3
    phrase: My spirit shall not always strive with man
    kind: words
    title: Will not always strive
    body: |
      The Hebrew verb behind “strive” is uncertain, but Restoration scripture keeps the King James word and makes it a warning. The verb, *yadon*, occurs only here, and its meaning is “dubious.” The ancient translations read it as “abide in, dwell”: “My spirit will not abide in man for ever.” The Septuagint, the ancient Greek translation, has “My Spirit shall certainly not remain among these men for ever.” Either way, God’s Spirit will not stay with a people forever.

      The Book of Moses keeps “strive” and gives a reason: “My Spirit shall not always strive with man, for he shall know that all flesh shall die” ([[Moses 8:17]]). Later scripture uses the line as a warning to repent while there is time. Nephi says, “the Spirit of the Lord will not always strive with man. And when the Spirit ceaseth to strive with man then cometh speedy destruction” ([[2 Ne. 26:11]]). The Lord says the same to the brother of Jared ([[Ether 2:15]]) and to this dispensation: “my Spirit shall not always strive with man” ([[D&C 1:33]]).
    sources: [biblehub-interlinear, bdb, lxx-rahlfs, lds-scriptures]
  - ref: 3
    phrase: his days shall be an hundred and twenty years
    kind: scripture
    title: A hundred and twenty years to repent
    body: |
      The Book of Moses shows that the 120 years were a time of warning, not a new limit on human life. Read alone, the verse can sound like a shorter lifespan, and “many scholars, who have only Genesis to study,” have read it that way. Not every reader of Genesis alone has: in one reading the verse means “not that human life should in future never attain a greater age than 120 years, but that a respite of 120 years should still be granted to the human race,” to be published by Noah as a “preacher of righteousness” ([[2 Pet. 2:5]]).

      The Book of Moses says it outright: “yet his days shall be an hundred and twenty years; and if men do not repent, I will send in the floods upon them” ([[Moses 8:17]]). This is the Church’s reading: 120 years “was the amount of time God allotted for Noah to preach repentance before He sent the Flood.” The verses that follow show how the time was used. Noah “called upon the children of men that they should repent; but they hearkened not unto his words” ([[Moses 8:20]]).
    sources: [ot-manual-gen-4-11, lds-scriptures, keil-genesis, scripture-helps-gen-6-11]
  - ref: 4
    phrase: There were giants in the earth in those days
    kind: words
    title: Giants, or fallen ones?
    body: |
      The Hebrew word is *nephilim*, and no one knows for certain what it means. “Giants” comes from the Septuagint, which has *gigantes*. The word’s origin is “dubious,” and the proposed etymologies are “all very precarious.” It looks like a form of *naphal*, “fall,” and it has been read two ways from that root: as “fallen ones,” or, in one older commentary, as men who “fell upon the people and oppressed them,” that is, tyrants. The only other passage that uses the word does suggest size: the spies in Canaan felt like grasshoppers beside the Nephilim ([[Num. 13:33]]).

      Whether they were tall is left open: *nephilim* “can also mean ‘fallen ones.’ It is not clear if these people were large in stature, and the term may simply have been a description of their fallen spiritual state.” The Book of Moses describes them by what they did: “in those days there were giants on the earth, and they sought Noah to take away his life; but the Lord was with Noah” ([[Moses 8:18]]). So the word may describe not tall people but “apostates who had fallen from the truth.” The “mighty men… of renown” at the end of the verse appear in the Book of Moses as the people’s own boast about their sons: “the same are mighty men, which are like unto men of old, men of great renown” ([[Moses 8:21]]).
    sources: [biblehub-interlinear, bdb, lxx-rahlfs, keil-genesis, scripture-helps-moses-7, lds-scriptures, schade-rainbow]
  - ref: 5
    phrase: every imagination of the thoughts of his heart was only evil continually
    kind: words
    title: The imagination of the heart
    body: |
      The verse looks past what people did to what they planned. “Imagination” translates *yetser*, a word that can mean a potter’s vessel, “formed by the potter,” and in the mind “what is framed,” an “imagination, device, purpose.” Every such purpose was evil “continually,” in Hebrew “all the day.”

      The Book of Moses adds that “every man was lifted up in the imagination of the thoughts of his heart, being only evil continually” ([[Moses 8:22]]). The Flood does not end the problem. After it, when Noah offers sacrifice, the Lord promises never again to curse the ground, “for the imagination of man’s heart is evil from his youth” ([[Gen. 8:21]]), and the Hebrew word is the same *yetser*.
    sources: [biblehub-interlinear, bdb, lds-scriptures]
  - ref: 6
    phrase: it repented the LORD that he had made man on the earth
    kind: prophets
    title: Can God repent?
    body: |
      Joseph Smith asked this question himself, and his revision of Genesis answers it. The Hebrew verb, *nacham*, is not repentance from sin. It means to “be sorry, moved to pity, have compassion” for others, or to “be sorry, rue, suffer grief, repent” of one’s own doings; “a different Hebrew word is used when indicating remorse for sin.” Even so, the English line seemed to Joseph Smith to contradict [[Num. 23:19]]: “God is not a man, that he should lie; neither the son of man, that he should repent.” In October 1843 he said, “I believe the bible as it read when it came from the pen of the original writers,” and of this verse, “it ought to read ‘it repented Noah that God made man’ This I believe, and then the other quotation stands fair.” His revision reads that way: “And it repented Noah, and his heart was pained that the Lord had made man on the earth” ([[Moses 8:25]]).

      The Septuagint, the ancient Greek translation, does not say that God repented either: it says that God “laid it to heart that he had made man upon the earth, and he pondered it deeply.” Neither change makes God unfeeling. The verse shows “both God and Noah being filled with pity toward the wicked state of the people”: “The Lord is not repenting for creating his children; rather, he is about to have compassion on them.”
    sources: [biblehub-interlinear, bdb, scripture-helps-gen-6-11, jsp-history-e1, lds-scriptures, lxx-rahlfs, schade-rainbow]
  - ref: 6
    phrase: it grieved him at his heart
    kind: scripture
    title: The God who weeps
    body: |
      The wickedness of His children hurt God, and the Book of Moses shows it even more plainly than Genesis. The Hebrew says He “was vexed to his heart.” Enoch saw the same grief in vision: “the God of heaven looked upon the residue of the people, and he wept.” Enoch asked, “How is it that thou canst weep, seeing thou art holy, and from all eternity to all eternity?” ([[Moses 7:28–29]]). The Lord answered that these were “the workmanship of mine own hands,” given agency and commanded to love one another and to “choose me, their Father,” and that “the whole heavens shall weep over them… seeing these shall suffer” ([[Moses 7:32–37]]). Read beside Moses 7, the verse shows that “God is heartbroken over his children.”
    sources: [biblehub-interlinear, bdb, lds-scriptures, schade-rainbow]
  - ref: 8
    phrase: But Noah found grace in the eyes of the LORD
    kind: words
    title: Grace in the eyes of the LORD
    body: |
      The Hebrew *chen* means “favour, grace,” and to “find favour in the eyes of” someone is an everyday phrase in Genesis. Jacob uses it when he sends gifts ahead to Esau, “to find grace in the sight of my lord” ([[Gen. 33:8]]). Here the eyes are the LORD’s. The Hebrew sentence also plays on sound: Noah is *Noach* (נח), and grace is *chen* (חן), the same two letters reversed.

      The Book of Moses ties the grace to Noah’s faithfulness: “And thus Noah found grace in the eyes of the Lord; for Noah was a just man, and perfect in his generation; and he walked with God” ([[Moses 8:27]]). The verse before says what “thus” points back to. Noah grieved over the people, and the Lord said, “he hath called upon me; for they have sought his life” ([[Moses 8:26]]). Genesis puts the grace first and Noah’s righteousness after (verses 8–9); the Book of Moses joins them with “for.”
    sources: [bdb, biblehub-interlinear, schade-rainbow, lds-scriptures]
  - ref: 9
    phrase: Noah was a just man and perfect in his generations, and Noah walked with God
    kind: words
    title: Perfect, and walking with God
    body: |
      “Perfect” here does not mean sinless. The Hebrew *tamim* means “complete, sound,” and of people “sound, wholesome, unimpaired, innocent, having integrity.” It is the usual word for an animal fit to be sacrificed. President Russell M. Nelson, noting that “scriptures have described Noah, Seth, and Job as perfect men,” taught that “this does not mean that these people never made mistakes or never had need of correction.”

      “Walked with God” links Noah to his great-grandfather Enoch, who “walked with God: and he was not; for God took him” ([[Gen. 5:24]]). The same two ideas come together again when God makes His covenant with Abram: “walk before me, and be thou perfect” ([[Gen. 17:1]]). Noah, Abraham, and Isaac are all said to walk with God “in connection with their making a covenant with God,” so the phrase may describe “the formal creation of a relationship with God through making and keeping sacred covenant bonds and obligations.” Noah’s covenant is promised in verse 18. The Book of Moses adds that his three sons also walked with God ([[Moses 8:27]]).
    sources: [bdb, nelson-perfection-pending, schade-rainbow, lds-scriptures, sc-knowhy-835]
  - ref: 13
    phrase: I will destroy them with the earth
    kind: words
    title: Corrupt, corrupted, destroy
    body: |
      In Hebrew the judgment uses the same verb as the sin. *Shachat* means to “spoil, ruin,” and in its passive form to “be corrupted.” The earth “was corrupt” (verse 11) and “behold, it was corrupt” (verse 12): both passive. Then the verb turns active: “all flesh had corrupted his way” (verse 12), and God says, “I will destroy them” (*mashchitam*, verse 13), and again, “to destroy all flesh” (verse 17). The passive forms put the cause on the people, who “brought this upon themselves”; the active form makes God the one “reversing and cleansing the corruption.” The violence (*chamas*, “violence, wrong”) filled the earth “through them,” literally “from their faces.”

      Genesis says God will destroy them “with the earth.” The Book of Moses reads, “behold I will destroy all flesh from off the earth” ([[Moses 8:30]]). The earth is not destroyed but cleansed. Enoch had heard the earth itself cry out, “When shall I rest, and be cleansed from the filthiness which is gone forth out of me?” ([[Moses 7:48]]). The Flood “was the baptism of the earth and symbolized a cleansing.”
    sources: [bdb, biblehub-interlinear, schade-rainbow, lds-scriptures, gs-flood-noah]
  - ref: 14
    phrase: Make thee an ark of gopher wood
    kind: words
    title: An ark is a box
    body: |
      The Hebrew *tevah* is “properly chest, box,” probably a word borrowed from Egyptian. It names only one other vessel in the Bible: the basket in which the infant Moses was laid among the reeds of the Nile, which his mother “daubed… with slime and with pitch” ([[Ex. 2:3]]). Noah’s box was enormous, “300 cubits (about 450 feet) long, 50 cubits wide, and 30 cubits high.”

      No one knows what “gopher wood” was. The word occurs only here, and it is “dubious.” It is sometimes taken as cypress (“gopher or cypress wood”); the Septuagint says simply “an ark of square timber.”
    sources: [biblehub-interlinear, bdb, lds-scriptures, bd-ark, lxx-rahlfs]
  - ref: 14
    phrase: pitch it within and without with pitch
    kind: symbol
    title: Pitch and atonement
    body: |
      The Hebrew is *vekhapharta… bakkopher*, “cover it… with pitch,” and the same consonants, *k-p-r*, form the Old Testament’s word for atonement. President Nelson explained, “In Hebrew, the basic word for atonement is kaphar, a verb that means ‘to cover’ or ‘to forgive.’” The likeness has been drawn this way: “the atonement of Jesus Christ provides us with a protective covering; it shields us from the power of the adversary, just as the pitch protected the ark from the life-threatening waters.”

      How closely the two words are related is less certain than the likeness. The word for pitch is “also the root word for ‘atone,’” yet the pitch verb can also be explained as a separate verb made from the noun *kopher*, “pitch” (compare Assyrian *kupru*). Either way, the likeness is a devotional reading of the image (“it has been suggested”), not something the verse itself says.
    sources: [biblehub-interlinear, nelson-atonement, scripture-helps-gen-6-11, bdb]
  - ref: 16
    phrase: A window shalt thou make to the ark
    kind: words
    title: A window, a roof, or a light?
    body: |
      The word translated “window,” *tsohar*, is not the usual Hebrew word for a window, and its meaning is uncertain. It is “probably roof,” though others read it as “light, window,” from its likeness to *tsohorayim*, “noon.” In one reading it was an opening for light and air running around the ark “within a cubit of the edge of the roof,” which would explain “in a cubit shalt thou finish it above.” It is not the word used later for the window Noah opens to send out the raven ([[Gen. 8:6]]).

      The question touches the Book of Mormon. The Jaredite barges were “tight like unto the ark of Noah” ([[Ether 6:7]]), and the Lord told the brother of Jared, “ye cannot have windows, for they will be dashed in pieces” ([[Ether 2:23]]). The answer was sixteen stones that the Lord touched “one by one with his finger” so that they shone ([[Ether 3:1–6]]). An old Jewish tradition took *tsohar* as a source of light. In the Talmud, Rabbi Johanan says that God told Noah, “Put there diamonds and pearls, that they shall give you light as the middle of the day.” It is therefore possible, in one Latter-day Saint reading, that “the brother of Jared knew something of the stones which illuminated Noah’s vessel.” The Bible says nothing of such stones; the connection is a suggestion, not a teaching.
    sources: [biblehub-interlinear, bdb, keil-genesis, lds-scriptures, rodkinson-sanhedrin, sc-knowhy-240]
  - ref: 18
    phrase: with thee will I establish my covenant
    kind: scripture
    title: My covenant
    body: |
      This is the first time the word *covenant* (*berit*) appears in the Bible, and God calls it “my covenant” without saying which covenant He means. Joseph Smith’s revision says which covenant is meant: “with thee will I establish my covenant, even as I have sworn unto thy father, Enoch, that of thy posterity shall come all nations” (JST Gen. 8:23–24, in the footnote to this verse). The Book of Moses tells of that oath. Enoch, having seen the Flood in vision, prayed “in the name of thine Only Begotten, even Jesus Christ, that thou wilt have mercy upon Noah and his seed,” and the Lord “covenanted with Enoch, and sware unto him with an oath, that he would stay the floods; that he would call upon the children of Noah” ([[Moses 7:50–51]]). So the covenant with Noah “was a renewal of a covenantal relationship with Adam and Eve and, later, with others, such as Enoch.”

      Here the covenant is only promised. It is spelled out after the Flood, with the rainbow as its token ([[Gen. 9:8–17]]).
    sources: [hopkin-covenant, lds-scriptures]
  - ref: 22
    phrase: according to all that God commanded him, so did he
    kind: scripture
    title: Thus did Noah
    body: |
      Genesis gives Noah no words in this chapter, only what he did. Hebrews reads the deed as faith: “By faith Noah, being warned of God of things not seen as yet, moved with fear, prepared an ark to the saving of his house; by the which he condemned the world, and became heir of the righteousness which is by faith” ([[Heb. 11:7]]). The flood was a thing “not seen as yet” when he built for it.
    sources: [lds-scriptures]

christ: |
  Jesus made the days of Noah a pattern for His own coming: “as the days of Noe were, so shall also the coming of the Son of man be. For as in the days that were before the flood they were eating and drinking, marrying and giving in marriage, until the day that Noe entered into the ark, And knew not until the flood came” ([[Matt. 24:37–39]]). The Book of Moses puts those very words in the mouths of the men who answered Noah: “are we not eating and drinking, and marrying and giving in marriage?” ([[Moses 8:21]]). What Noah preached to them was the gospel of Christ: “be baptized in the name of Jesus Christ, the Son of God” ([[Moses 8:24]]).

  The generation that perished was not beyond His reach. Enoch was told that those who died in the Flood would be shut in a prison, but that the Lord’s Chosen “suffereth for their sins; inasmuch as they will repent in the day that my Chosen shall return unto me” ([[Moses 7:38–39]]). Peter says that Christ “went and preached unto the spirits in prison; Which sometime were disobedient, when once the longsuffering of God waited in the days of Noah” ([[1 Pet. 3:19–20]]), and President Joseph F. Smith saw how: from among the righteous the Lord “organized his forces and appointed messengers” to carry the gospel to them ([[D&C 138:28–30]]). There “they would have the opportunity to be taught the gospel of Jesus Christ and repent of their sins.”

  Noah’s service to Christ did not end with the ark. Joseph Smith taught that Noah is Gabriel, who “stands next… to Adam” in the priesthood. As Gabriel he was sent to Mary to tell her that she would bear a son and “call his name Jesus” ([[Luke 1:26–31]]).

explore: |
  - **Genesis 6 in the Book of Moses.** Read [[Moses 8:13–30]] beside verses 1–13.
  - **Enoch’s vision of the Flood.** [[Moses 7:28–69]]: the God who weeps, the earth that mourns, and the covenant that Noah’s seed would survive.
  - **The days of Noah and the last days.** [[Matt. 24:36–44]]; [[Luke 17:26–27]]; [[1 Pet. 3:18–21]]; [[D&C 138:28–37]].
  - **Another vessel “like unto the ark of Noah.”** [[Ether 2:16–25]]; [[Ether 6:4–12]].
  - **The Flood through the lens of the Restoration.** “The Rainbow as a Token in Genesis” (in *From Creation to Sinai*, BYU Religious Studies Center) reads the whole Flood story, from Genesis 6 to the rainbow, with the Book of Moses.

