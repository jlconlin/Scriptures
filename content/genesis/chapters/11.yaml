chapter: 11
title: The Tower of Babel
tagline: Noah’s descendants settle in Shinar and build a city and a tower to make a name for themselves and avoid being scattered. The Lord confounds their language and scatters them. Then the record follows the line of Shem, whose name means “name,” ten generations down to Abram and his barren wife Sarai, who leave Ur for Haran.
when: 'From the generations after the Flood to Terah’s death in Haran. The Church’s Bible Chronology lists the Tower of Babel among the undated events of the early patriarchs, so no year is given.'

setting: |
  Genesis 11 is the hinge between the history of the whole human family and the history of Abraham’s family. Chapter 10 listed the nations that came from Noah’s sons and ended, “by these were the nations divided in the earth after the flood” ([[Gen. 10:32]]). Verses 1–9 tell the story behind that division. Babel stands in “the land of Shinar,” the plain of Babylonia, and Genesis has already named it as the first city of Nimrod’s kingdom ([[Gen. 10:10]]). The tower was “the transitional event between the dispensations of Noah and Abraham.”

  Then the record starts again, “These are the generations of Shem” (verse 10), and runs to Terah, Abram’s father. A second heading, “these are the generations of Terah” (verse 27), opens the story of Abraham that fills the chapters to come.

  Restoration scripture adds to both halves. The Book of Mormon remembers “the great tower” as the place from which Jared and his brother set out ([[Ether 1:33]]). The Book of Abraham, which presents itself as Abraham’s own record, tells what Genesis passes over in verses 27–32: the idolatry of his fathers in Ur, the famine, and the Lord’s call that set the family moving ([[Abr. 1:1–31]]; [[Abr. 2:1–5]]).

thread: |
  Genesis 11 is about two ways of getting a name. At Babel the people say, “let us make us a name” (verse 4): a reputation, fame, or monument of their own making, a tower with its top in the heavens and a city to hold them together, “lest we be scattered.” What they fear is what happens. The Lord scatters them, and the name the place keeps is Babel, which in Hebrew sounds like *balal*, “confound.”

  Then the record turns to Shem, and Shem’s name is the Hebrew word *shem*, “name,” the same word the builders used in verse 4. His line narrows from the nations to one family and seems to end in a dead end: “Sarai was barren; she had no child” (verse 30). The next words God speaks in Genesis are to Abram: “I will make of thee a great nation, and I will bless thee, and make thy name great… and in thee shall all families of the earth be blessed” ([[Gen. 12:2–3]]). The builders tried to make a name for themselves, and God promises to make Abram’s name great. They tried not to be scattered, and in Abram God promises a blessing to all the families of the earth. The story of the tower and the call of Abram that follows it belong together.

sections:
  - range: 1-4
    heading: Making a name
    plain: |
      At that time the whole earth had one language and the same words. As people moved from the east, they found a plain in the land of Shinar and settled there. They said to one another, “Come, let us make bricks and fire them hard.” They used brick instead of stone, and tar for mortar. Then they said, “Come, let us build ourselves a city, and a tower with its top in the heavens, and make a name for ourselves, so that we will not be scattered over the face of the whole earth.”
  - range: 5-9
    heading: The Lord scatters them
    plain: |
      The Lord came down to see the city and the tower that the people were building. The Lord said, “They are one people, and they all have one language, and this is only the beginning of what they will do. From now on nothing they plan to do will be out of their reach. Come, let us go down and confuse their language there, so that they cannot understand one another.” So the Lord scattered them from there over the face of all the earth, and they stopped building the city. That is why it is called Babel: there the Lord confused the language of the whole earth, and from there the Lord scattered them over the face of all the earth.
  - range: 10-26
    heading: From Shem to Terah
    plain: |
      This is the family record of Shem. Two years after the Flood, when Shem was a hundred years old, his son Arphaxad was born, and Shem lived five hundred years more and had other sons and daughters. Arphaxad was 35 when Salah was born and lived 403 years more. Salah was 30 when Eber was born and lived 403 years more. Eber was 34 when Peleg was born and lived 430 years more. Peleg was 30 when Reu was born and lived 209 years more. Reu was 32 when Serug was born and lived 207 years more. Serug was 30 when Nahor was born and lived 200 years more. Nahor was 29 when Terah was born and lived 119 years more. Each of them had other sons and daughters. When Terah was seventy, he became the father of Abram, Nahor, and Haran.
  - range: 27-32
    heading: Terah’s family leaves Ur
    plain: |
      This is the family record of Terah. Terah was the father of Abram, Nahor, and Haran, and Haran was the father of Lot. Haran died while his father Terah was still living, in the land where he was born, Ur of the Chaldees. Abram and Nahor both married. Abram’s wife was Sarai. Nahor’s wife was Milcah, the daughter of Haran, who was also the father of Iscah. Sarai was barren; she had no children.

      Terah took his son Abram, his grandson Lot (Haran’s son), and his daughter-in-law Sarai, Abram’s wife, and they set out together from Ur of the Chaldees to go to the land of Canaan. But when they came to Haran, they settled there. Terah lived 205 years, and he died in Haran.

notes:
  - ref: 1
    phrase: of one language, and of one speech
    kind: words
    title: One lip, one set of words
    body: |
      The Hebrew says the whole earth was “one lip” (*safah ’echat*) and “one set of words” (*devarim ’achadim*). *Safah* is the ordinary word for “lip,” and it also means speech or language. The story keeps using it: the people are one people with one “lip” (verse 6), and the Lord confounds their “lip” (verses 7 and 9).

      Genesis does not say what that language was. Latter-day revelation tells of a first language: in the days of Adam’s children “a book of remembrance was kept… in the language of Adam,” and their children were taught “a language which was pure and undefiled” ([[Moses 6:5–6]]). The Book of Mormon tells of one family whose language was not confounded at the tower ([[Ether 1:34–35]]), and President Joseph Fielding Smith taught that the Jaredites likely kept the language of Adam: “they carried with them the speech of their fathers, the Adamic language, which was powerful even in its written form.” Genesis itself does not say whether the one language of verse 1 was Adam’s.
    sources: [biblehub-interlinear, bdb, lds-scriptures, bom-manual-ether-1-5]
  - ref: 3
    phrase: they had brick for stone, and slime had they for mortar
    kind: history
    title: Brick for stone
    body: |
      The builders were using new technology. “Sun-dried bricks had been used for a long time, but baking bricks made them stronger, so larger structures could be built with this new technology.” The Hebrew of “burn them throughly” is literally “burn them to a burning”: these were bricks “baked with fire, as in an oven or a kiln.” The “slime” is *chemar*, “bitumen, asphalt,” used here as mortar.

      Genesis states it as a contrast: brick *for* stone. When Israel later built for the Lord, the rule ran the other way. An altar was to be of stone untouched by any tool ([[Ex. 20:25]]), and the temple was founded on “great stones, costly stones, and hewed stones” ([[1 Kgs. 5:17]]). Set beside those, the tower was “completely man-made.”

      Genesis does not say who led the work, or why a people so soon after the Flood wanted a tower of fired brick and tar. Babel was the first city of Nimrod’s kingdom ([[Gen. 10:10]]; see the note at [[Gen. 10:9]]), and “Early Jewish and Christian traditions reported that Nimrod built the tower.” Josephus, the first-century Jewish historian, puts the Flood at the center of it. His Nimrod says “He would be revenged on God, if he should have a mind to drown the world again: for that he would build a Tower too high for the waters to be able to reach,” and the bitumen was used “that it might not be liable to admit water.” Read that way, “the aspiration to build a tower to heaven, with water-impervious materials, may also have been an attempt to survive a flood should God attempt to destroy men again.” That is a tradition and a possibility, not what the text says.
    sources: [ensign-babel-2018, biblehub-interlinear, bdb, lds-scriptures, donaldson-babel-1994, josephus-antiquities]
  - ref: 4
    phrase: a tower, whose top may reach unto heaven
    kind: symbol
    title: A counterfeit temple
    body: |
      The tower is usually taken to be a temple tower. Its top was to be “in the heavens” (*rosho vashshamayim*, literally “its head in the heavens”), and a tower of fired brick on the plain of Shinar is “usually associated with ziggurats, which were stepped temple towers designed to be elevated above a plain, like a man-made mountain.” The city’s own name pointed upward too: in Babylonian it meant “gate of god” (see the note on verse 9).

      Latter-day Saints read the tower as a counterfeit temple, and that is the Church’s current reading: “Early Jewish and Christian traditions suggest that the Tower of Babel was a counterfeit temple.” Verse 4 itself hints at it. A tower “whose top may reach unto heaven” recalls one purpose of temples, “to serve as places where God and man can meet,” and “let us make us a name” recalls another, “holy places where individuals take upon themselves the name of Jesus Christ.” They were building “their own temple, their gate to heaven, without divine approval or priesthood keys.”

      The Book of Mormon names who prompted it. The being who enticed Adam and Eve and plotted with Cain is “that same being who put it into the hearts of the people to build a tower sufficiently high that they might get to heaven” ([[Hel. 6:26–28]]). [From Babel’s Scattering to the Blessing of All Families](/genesis/themes/babel-to-blessing/)
    sources: [biblehub-interlinear, ensign-babel-2018, scripture-helps-gen-6-11, parry-flood-babel, donaldson-babel-1994, lds-scriptures]
  - ref: 4
    phrase: lest we be scattered abroad upon the face of the whole earth
    kind: scripture
    title: Afraid of being scattered
    body: |
      The builders’ second reason was fear of being scattered, though after the Flood God had told Noah and his sons, “Be fruitful, and multiply, and replenish the earth” ([[Gen. 9:1]]), and chapter 10 shows the families spreading out. Josephus read their fear as disobedience: God had “commanded them to send colonies abroad, for the through peopling of the earth,” but “they did not obey God.” What they feared came anyway: the word *scatter* “is found three times in the story of the tower” (verses 4, 8, 9).

      Latter-day scripture answers Babel’s scattering with gathering. “The opposite of scattering is gathering, and this dispensation is the era for gathering,” and the Lord’s people are told to leave Babylon itself: “Go ye out of Babylon; gather ye out from among the nations” ([[D&C 133:7]]).

      One Latter-day Saint reading goes further. Moroni told Joseph Smith that Elijah would reveal the priesthood, and “If it were not so, the whole earth would be utterly wasted at his coming” ([[D&C 2:1–3]]). In 1828 *waste* could mean “to destroy by scattering.” Babel’s builders tried to “bind or seal the people together somehow so they would not be scattered… and all this without authority from God”; the sealing power restored through Elijah binds families together by God’s authority. The pairing is a suggestion, not an interpretation that D&C 2 itself gives.
    sources: [lds-scriptures, josephus-antiquities, parry-flood-babel, ensign-babel-2018, webster-1828]
  - ref: 6
    phrase: nothing will be restrained from them, which they have imagined to do
    kind: words
    title: Why the Lord came down
    body: |
      The Lord answers the builders in their own words. Twice they said *havah*, “come” (the KJV’s “Go to”): “Go to, let us make brick” (verse 3) and “Go to, let us build us a city” (verse 4). Now the Lord says it: *havah, neredah*, “come, let us go down” (verse 7). In one reading the echo is “an ironical imitation” of the builders. Their tower was to reach the heavens, and “the LORD came down to see” it (verse 5). “Came down” here is “an anthropomorphic description of God’s interposition in the actions of men,” a judge looking into the facts before passing sentence. The plural “let us” is the same as at the Creation; see the note on [[Gen. 1:26]].

      The Lord’s words in verse 6 are not a worry that the builders would actually reach heaven. The Hebrew says that nothing they plan “will be cut off” or withheld from them (*lo yibbatser*); a modern translation has “this is only the beginning of what they will do; nothing that they propose to do will now be impossible for them.” Their “attempt to dodge the judgment of God was based on their human ingenuity rather than on repentance,” and “the Lord’s response was to humble these people.”

      Joseph Smith’s revision of the Bible states the reason plainly. At verse 8 it adds that they left off building the city, “and they hearkened not unto the Lord.”
    sources: [biblehub-interlinear, keil-genesis, nrsvue, donaldson-babel-1994, lds-scriptures]
  - ref: 8
    phrase: So the LORD scattered them abroad from thence
    kind: scripture
    title: The Book of Mormon’s witness
    body: |
      The Book of Mormon treats the tower as history. The book of Ether begins with Jared and his brother coming “from the great tower, at the time the Lord confounded the language of the people, and swore in his wrath that they should be scattered upon all the face of the earth; and according to the word of the Lord the people were scattered” ([[Ether 1:33]]). “Latter-day Saints accept the story as it is presented in Genesis. Further, we have the second witness of the Book of Mormon.”

      Ether also shows the event from inside. Jared asked his brother to pray “that he will not confound us that we may not understand our words,” and then asked the same for their friends, and both prayers were granted ([[Ether 1:34–37]]). Prayers were being asked and answered while the confounding was under way, so it “may have happened over time and not in an instant.”
    sources: [lds-scriptures, parry-flood-babel, scripture-helps-gen-6-11]
  - ref: 9
    phrase: Therefore is the name of it called Babel
    kind: words
    title: Gate of God, or confusion
    body: |
      Genesis explains the name by a pun. *Babel* sounds like *balal*, “mingle, mix, confuse, confound,” the verb translated “confound” in verses 7 and 9. The Babylonians heard something else in the name: *Bab-ilu*, “gate of god.” So a name that meant “gate of god” in Babylon, Genesis hears as “confusion.”

      *Babel* is also the Hebrew word translated “Babylon” everywhere else in the Old Testament. “Thus, in biblical typology, what the people are building in this story is Babylon.” The story that begins here comes full circle when Judah is carried away captive to Babylon ([[2 Kgs. 25:8–11]]): “The narrative begun by Genesis ends in 2 Kings 25, in which the children of Israel found themselves—because they broke the covenant—back in Babylon where the story began.” In latter-day revelation Babylon stands for the world ([[D&C 1:16]]), the place the Saints are told to leave (see the note on “lest we be scattered,” verse 4).
    sources: [bdb, biblehub-interlinear, donaldson-babel-1994, bd-babylon, lds-scriptures]
  - ref: 10
    phrase: These are the generations of Shem
    kind: history
    title: From Shem to Abram
    body: |
      The list leads from the scattered nations to one man. Shem’s descendants were given in chapter 10 with all their branches ([[Gen. 10:21–31]]). Now the record follows one line straight down, in one reading “to show the direct descent of the Terahites through Peleg from Shem.” Like the list from Adam to Noah in chapter 5, it runs ten generations, Shem to Abram, and like that list it closes with a father of three sons ([[Gen. 5:32]]; verse 26).

      The ages tell a story of their own. Shem “reached the age of 600, Arphaxad lived only 438 years, Salah 433, and Eber 464.” From Peleg, of whom Genesis says “in his days was the earth divided” ([[Gen. 10:25]]), the totals fall by about half again, to 239, 239, and 230, and Nahor lived to 148. As lives grew shorter, “the children were born proportionally earlier,” at about thirty instead of a hundred. By these numbers “nearly all the patriarchs from Shem to Terah were alive at the time of Abram’s migration.” Why the early lives were so long is taken up at [[Gen. 5:5]].
    sources: [keil-genesis, lds-scriptures]
  - ref: 12
    phrase: Arphaxad lived five and thirty years
    kind: scripture
    title: Luke’s extra name
    body: |
      Luke’s genealogy of Jesus has a name this list does not. In Genesis, Arphaxad is the father of Salah (verse 12). Luke goes from Sala to “Cainan, which was the son of Arphaxad, which was the son of Sem” ([[Luke 3:35–36]]). Luke’s list agrees with the Septuagint, the ancient Greek translation of the Old Testament: “Arphaxad lived a hundred and thirty-five years, and begot Cainan,” and “Cainan lived a hundred and thirty years and begot Sala.”

      The Greek numbers differ too. In the Septuagint most of these fathers have their sons a hundred years later than in the Hebrew: Arphaxad at 135 instead of 35, Salah at 130 instead of 30, Eber at 134 instead of 34. That lengthens the time from the Flood to Abram by centuries. The Hebrew, the Septuagint, and the Samaritan text “do not agree together, so that many dates cannot be fixed with certainty,” which is why no years are given for this part of Genesis.
    sources: [lds-scriptures, lxx-rahlfs, bd-chronology]
  - ref: 14
    phrase: and begat Eber
    kind: words
    title: Eber and the Hebrews
    body: |
      Eber is the ancestor from whom the Hebrews are thought to take their name: “The word Hebrew is a patronymic name derived from Eber.” There is another possible explanation. When Abram is first called “the Hebrew” ([[Gen. 14:13]]), the word “may mean ‘one who had come from beyond (the Euphrates),’ from *ʼeber*, ‘to cross.’” Joshua uses that sense of Abraham’s family. He reminded Israel that “your fathers dwelt on the other side of the flood,” that is, beyond the river, “even Terah, the father of Abraham” ([[Josh. 24:2]]), and the Hebrew for “on the other side” there is *be‘ever*, the same letters as Eber’s name. Genesis does not say which explanation is right.
    sources: [bd-eber, bdb, bd-hebrew, biblehub-interlinear, lds-scriptures]
  - ref: 28
    phrase: Haran died before his father Terah
    kind: history
    title: How Haran died
    body: |
      “Before his father” means in his father’s lifetime and presence; the Hebrew *‘al-pene* is literally “upon the face of,” and the Septuagint reads, “Arrhan died in the presence of Tharrha his father.” Genesis gives no cause of death. The Book of Abraham does: “the Lord God caused the famine to wax sore in the land of Ur, insomuch that Haran, my brother, died; but Terah, my father, yet lived in the land of Ur” ([[Abr. 2:1]]).

      In Abraham’s telling, the famine that took Haran was part of what moved the family: it “created an additional sense of urgency for Abraham to leave Ur” (on Terah, see the note on verse 31). Haran’s son Lot went with his uncle from then on (verse 31; [[Gen. 12:4]]).
    sources: [biblehub-interlinear, lxx-rahlfs, lds-scriptures, pgp-manual-abr-2-1-13]
  - ref: 28
    phrase: Ur of the Chaldees
    kind: history
    title: Where was Ur?
    body: |
      No one knows for certain where Abraham’s Ur was. The traditional answer, followed in the Church’s study helps, is the city at modern Mugheir in Iraq: “Ur, the birthplace of Abraham, is generally identified with the modern town of Mugheir in present-day Iraq. It is about 150 miles (240 kilometers) from the Persian Gulf,” and “in those days it was a busy seaport town.”

      The Book of Abraham gives details that point elsewhere. Its Ur had an altar “by the hill called Potiphar’s Hill, at the head of the plain of Olishem” ([[Abr. 1:10]]). Reading that clue, a BYU scholar places Abraham’s Ur at the edge of the plain of Olishem, in “an area that straddles modern Turkey and Syria,” and notes that “While the tendency has been to put Ur in the south of Mesopotamia, near the Persian Gulf, a number of scholars have argued for a northern location.” Even “Chaldees” is not quite what it seems: the Hebrew is *kasdim*, “which may not be the same thing as the later tribe, the kaldu, which we now equate with the Chaldeans.” This is a question of geography, and the text leaves it open.
    sources: [pgp-manual-abr-1-1-3, bd-ur, lds-scriptures, gee-wanderings, biblehub-interlinear]
  - ref: 29
    phrase: the name of Abram’s wife was Sarai
    kind: history
    title: Who was Sarai?
    body: |
      The verse gives Milcah’s father but not Sarai’s. Abraham later says of her, “she is the daughter of my father, but not the daughter of my mother” ([[Gen. 20:12]]). Josephus made her Haran’s daughter, like Milcah: “Haran left a son, Lot: as also Sarai and Milcha his daughters.” One reading of [[Abr. 2:2]] does the same, calling Haran “the father of Abraham’s wife Sarah,” though that verse speaks only of Milcah as “the daughter of Haran.” Either way Sarai was of Terah’s family, and “Because Abraham and Sarah both descended from Terah, customs of their time would likely have allowed for Abraham to accurately refer to Sarah as his sister.” That question belongs to [[Gen. 12:13]].

      Iscah, Milcah’s sister, appears here and nowhere else in Genesis, and the text does not say why she is named.
    sources: [lds-scriptures, josephus-antiquities, bd-haran, scripture-helps-gen-12-17]
  - ref: 30
    phrase: But Sarai was barren; she had no child
    kind: scripture
    title: The barren mother of a nation
    body: |
      Genesis says it twice, “barren” (*‘aqarah*) and “she had no child,” just before God promises Abram a great nation ([[Gen. 12:2]]). The word comes back for the next two mothers of the covenant line. Rebekah “was barren” ([[Gen. 25:21]]), and so was Rachel ([[Gen. 29:31]]). Each time a son is born only after the Lord acts ([[Gen. 21:1–2]]; [[Gen. 25:21]]; [[Gen. 30:22–23]]).

      Later scripture comes back to it. Isaiah calls Israel to “look unto Abraham your father, and unto Sarah that bare you” ([[Isa. 51:2]]), and then speaks to Zion as a barren woman whose children will be many: “Sing, O barren, thou that didst not bear” ([[Isa. 54:1]]). Paul quotes that verse in his comparison of Sarah and Hagar and applies it to the Christians he is writing to: “Rejoice, thou barren that bearest not… Now we, brethren, as Isaac was, are the children of promise” ([[Gal. 4:27–28]]).
    sources: [bdb, biblehub-interlinear, lds-scriptures]
  - ref: 31
    phrase: And Terah took Abram his son
    kind: scripture
    title: Who led the family out of Ur?
    body: |
      Genesis makes Terah the head of the move; the Book of Abraham says the call was Abram’s. In Genesis it is Terah who “took Abram his son, and Lot… and Sarai,” and set out for Canaan. Abraham tells it from the son’s side: “Now the Lord had said unto me: Abraham, get thee out of thy country… Therefore I left the land of Ur, of the Chaldees, to go into the land of Canaan… and also my father followed after me” ([[Abr. 2:3–4]]). “Abram, not Terah, was the leader of the journey to the promised land,” and Abraham’s words correct the impression Genesis gives. When the call first came is taken up at [[Gen. 12:1]].

      The difference matters because of who Terah was. Joshua remembered that Terah and his fathers “served other gods” ([[Josh. 24:2]]). In Abraham’s words his fathers had turned “unto the worshiping of the gods of the heathen” and tried “to take away my life by the hand of the priest of Elkenah” ([[Abr. 1:5–7]]). Terah “had given himself to the worship of false gods and was willing to offer his own son as a sacrifice.” He followed his son only after the famine in Ur had turned him, for a time, from his idolatry ([[Abr. 1:30]]).
    sources: [lds-scriptures, woods-ascension, pgp-manual-abr-1-4-31, pgp-manual-abr-2-1-13]
  - ref: 31
    phrase: they came unto Haran, and dwelt there
    kind: words
    title: Haran the brother, Haran the city
    body: |
      In English the city has the brother’s name, but in Hebrew they are spelled differently. The brother is *Haran* (*haran*, with a soft *h*), and the city is *Charan* (*charan*, with a harsh *ch*), which the New Testament spells “Charran” ([[Acts 7:4]]). The city lay in northern Mesopotamia, and its name has been connected with the Assyrian word for “road”: it stood at a “junction of trading-routes.”

      The Book of Abraham suggests a link anyway. Abraham’s company came “unto the land which we denominated Haran” ([[Abr. 2:4]]), so the place was “apparently named in memory of Abraham’s deceased brother Haran.” Abraham’s family kept its ties there. Later Rebekah would send her son Jacob to “Laban my brother to Haran” ([[Gen. 27:43]]).
    sources: [biblehub-interlinear, bdb, bd-haran, lds-scriptures]
  - ref: 32
    phrase: Terah died in Haran
    kind: scripture
    title: Did Abram leave before Terah died?
    body: |
      By Genesis’s own numbers, Terah was still alive when Abram went on to Canaan. Terah was seventy when his sons were born (verse 26), Abram was seventy-five when he left Haran ([[Gen. 12:4]]), and Terah lived to 205, so he “died at the age of 205, or sixty years after the departure of Abram for Canaan.” His death is reported here to close his story before Abram’s begins; in one reading it comes now “because Abram never met with his father again after leaving Haran, and there was consequently nothing more to be related concerning him.” Stephen put it the other way, saying Abraham left Haran “when his father was dead” ([[Acts 7:4]]); in the same reading, Stephen “merely inferred this” from the order of the narrative.

      The Book of Abraham agrees that Abram left a living father behind, and says why Terah stayed: “my father tarried in Haran and dwelt there, as there were many flocks in Haran; and my father turned again unto his idolatry, therefore he continued in Haran” ([[Abr. 2:5]]). It gives Abraham’s age on leaving Haran as sixty-two, not seventy-five ([[Abr. 2:14]]); that difference is taken up at [[Gen. 12:4]].
    sources: [lds-scriptures, keil-genesis]

christ: |
  The builders wanted a name; Shem’s line leads to the One whose name saves. Luke traces the ancestry of Jesus back through this chapter’s names: “Abraham, which was the son of Thara, which was the son of Nachor, Which was the son of Saruch, which was the son of Ragau, which was the son of Phalec, which was the son of Heber, which was the son of Sala, Which was the son of Cainan, which was the son of Arphaxad, which was the son of Sem” ([[Luke 3:34–36]]). God promised Abraham that Jesus Christ would be born through his lineage, and “It is only through the name of Jesus Christ that we can be saved and reach God’s presence. We take His name upon ourselves through the ordinances of His gospel.” King Benjamin taught the same: “There is no other name given whereby salvation cometh; therefore, I would that ye should take upon you the name of Christ” ([[Mosiah 5:8]]).

  The scattering of tongues is undone through Christ as well: “the gospel of Jesus Christ is reversing the effects of Babel.” At Pentecost the disciples “were all filled with the Holy Ghost,” and a crowd “out of every nation under heaven” was “confounded, because that every man heard them speak in his own language” ([[Acts 2:4–6]]). In one reading this was “a type of pledge” that the division of tongues will one day be overcome. Elder Spencer W. Kimball, reporting on the dedication of the Swiss Temple, where Saints of many nations met “under one roof,” said, “Everyone of them heard the ordinances of the gospel, the ordinances of the temple, in his own tongue. The confusion of Babel is in reverse.”

explore: |
  - **Abraham’s own account.** [[Abr. 1:1–31]] and [[Abr. 2:1–5]] tell verses 27–32 from inside the family: Ur, the altar, the famine, and the call.
  - **The tower in the Book of Mormon.** [[Ether 1:33–43]]; [[Hel. 6:26–28]]; [[Omni 1:22]].
  - **Babylon after Babel.** [[Isa. 47]]; [[Jer. 51:6–10]]; [[Rev. 18:1–4]]; [[D&C 133:4–14]].
  - **The places of Abraham’s life.** The Religious Studies Center chapter “The Wanderings of Abraham” (in *From Creation to Sinai*) walks through Ur, Haran, and the places Abraham went next.

