chapter: 20
title: Abraham and Abimelech
tagline: In Gerar Abraham again calls Sarah his sister, and the king takes her. God warns the king in a dream, names Abraham a prophet, and heals the king’s house when Abraham prays, keeping Sarah safe for the son the LORD has promised her.
when: 'As Genesis places it, Abraham was ninety-nine or a hundred (17:1; 21:5) and Sarah about ninety (17:17), in the year between the promise that Isaac would be born “at this set time in the next year” (17:21) and his birth (21:1–5). The text gives no year.'

setting: |
  Chapter 20 is the second of three stories in which a patriarch living among foreigners calls his wife his sister: Abraham and Sarai in Egypt ([[Gen. 12:10–20]]), Abraham and Sarah here in Gerar, and Isaac and Rebekah in Gerar ([[Gen. 26:1–11]]). The questions the stories share, whether Abraham lied, what “sister” could mean, and the Lord’s instruction before Egypt in the Book of Abraham, are taken up at [[Gen. 12:13]]. The notes here take up what is new in this chapter.

  Its place in Genesis is what makes it tense. In chapter 17 God promised that Sarah would bear Isaac “at this set time in the next year” ([[Gen. 17:21]]). At Mamre the promise was repeated: “At the time appointed… Sarah shall have a son” ([[Gen. 18:14]]). Sodom fell in chapter 19. Then, in the months before Isaac’s birth ([[Gen. 21:1–2]]), the woman who is to bear him is taken into a foreign king’s house.

  Most of the chapter is talk: God and Abimelech in a dream, then Abimelech and Abraham face to face. Abraham does not speak to God until he prays in verse 17. Abimelech returns in [[Gen. 21:22–34]] to make a covenant with Abraham at Beer-sheba. A psalm later sums up stories like this one: the Lord “reproved kings for their sakes” ([[Ps. 105:14]]), warning them not to touch His anointed and to “do my prophets no harm” ([[Ps. 105:15]]).

thread: |
  The chapter turns on the fear of God. Abraham explains himself to Abimelech: “I thought, Surely the fear of God is not in this place” (verse 11). By then the reader knows he was wrong. God came to Abimelech in a dream; the king answered with a plea of innocence, rose early, and told his servants, and “the men were sore afraid” (verse 8). The servants’ fear and Abraham’s “fear of God” share one Hebrew root, *yare’*, “fear.”

  Yet God does not exchange the two men’s places. He tells the king that Abraham “is a prophet, and he shall pray for thee” (verse 7), and the king’s house is healed only when Abraham prays (verse 17). Through it all the one the LORD is guarding is Sarah, “Abraham’s wife” (verse 18), and the next chapter begins, “the LORD visited Sarah as he had said” ([[Gen. 21:1]]). The promise is kept by the LORD, who “can maintain His covenant and secure the realization of His promise,” at a moment when the man who carries it is afraid.

sections:
  - range: 1-2
    heading: Abraham in Gerar
    plain: |
      Abraham moved on from there into the Negev, the south country, and settled between Kadesh and Shur, living as a foreigner in Gerar. Abraham said of his wife Sarah, “She is my sister,” and Abimelech, king of Gerar, sent and took Sarah.
  - range: 3-7
    heading: God warns Abimelech in a dream
    plain: |
      But God came to Abimelech in a dream by night and said to him, “You are as good as dead because of the woman you have taken, for she is a married woman.” Abimelech had not gone near her. He said, “Lord, will you kill a nation that is innocent? Didn’t he tell me, ‘She is my sister’? And she herself said, ‘He is my brother.’ I did this with a clear conscience and clean hands.”

      God said to him in the dream, “Yes, I know you did this with a clear conscience. It was I who kept you from sinning against me; that is why I did not let you touch her. Now give the man back his wife. He is a prophet, and he will pray for you, and you will live. But if you do not give her back, know that you will surely die, you and all who are yours.”
  - range: 8-13
    heading: Abimelech confronts Abraham
    plain: |
      Early in the morning Abimelech called all his servants and told them everything, and the men were terrified. Then Abimelech called Abraham and said, “What have you done to us? How have I wronged you, that you have brought such a great sin on me and my kingdom? You have done things to me that should never be done.” And Abimelech asked Abraham, “What did you have in mind when you did this?”

      Abraham answered, “I thought, ‘There is surely no fear of God in this place, and they will kill me because of my wife.’ Besides, she really is my sister, the daughter of my father though not of my mother, and she became my wife. When God made me wander from my father’s house, I said to her, ‘This is the kindness you can show me: everywhere we go, say of me, He is my brother.’”
  - range: 14-18
    heading: Sarah restored and Abimelech healed
    plain: |
      Then Abimelech took sheep and cattle and male and female servants and gave them to Abraham, and he gave his wife Sarah back to him. Abimelech said, “My land is open to you; live wherever you like.” To Sarah he said, “I have given your brother a thousand pieces of silver. He is a covering of the eyes for you before all who are with you and before everyone.” And so Sarah was reproved.

      Then Abraham prayed to God, and God healed Abimelech, his wife, and his female servants, so that they bore children. For the Lord had closed every womb in Abimelech’s household because of Sarah, Abraham’s wife.

notes:
  - ref: 1
    phrase: dwelled between Kadesh and Shur, and sojourned in Gerar
    kind: history
    title: Between Kadesh and Shur
    body: |
      Abraham moved into the Negev, the south country. “From thence” is not explained; the last place Genesis put him was Mamre, where the LORD had visited him ([[Gen. 18:1]]). Kadesh and Shur are near where the angel found Hagar, “by the fountain in the way to Shur,” at a well “between Kadesh and Bered” ([[Gen. 16:7, 14]]).

      Gerar was “a place in southwestern Palestine, near Gaza,” where Isaac would also live. A town near Gaza is hard to describe as “between Kadesh and Shur,” and the verse is read in more than one way: it may pass over a move from the desert to the coast, or Abraham may have kept his camp between Kadesh and Shur and gone from there to Gerar. Either way he “sojourned” (*gur*) in Gerar: he lived there as a foreigner, which matters in verse 11. Genesis gives no reason for the move.
    sources: [ryle-genesis, lds-scriptures, biblehub-interlinear, bd-gerar, delitzsch-genesis, bdb]
  - ref: 2
    phrase: And Abraham said of Sarah his wife, She is my sister
    kind: scripture
    title: Again?
    body: |
      The word “again” in Joseph Smith’s translation makes Gerar a second event, not the Egypt story told a second time. In both of his manuscripts the verse reads, “Abraham said again of Sarah his wife, she is my sister,” and so the Prophet understood it.

      Many scholars do take the Egypt and Gerar stories as “two versions of the same story.” In one such reading it is “almost incredible” that Abraham would do the same thing again, with Sarah “advanced in years” and the promise of a son just given, and the chapter is “most probably… a duplicate” of the tradition in chapter 12. Another reading answers that a repetition “in the space of 24 years is by no means startling,” since apart from the one shared point “all the more minute details are entirely different.” The text bears that out. In Egypt the princes praised Sarai’s beauty to Pharaoh ([[Gen. 12:15]]); here no one mentions it. Pharaoh learns the truth through plagues and sends Abraham off, “take her, and go thy way” ([[Gen. 12:19]]); Abimelech is warned by God in a dream and offers Abraham his land (verse 15). In Egypt Abram says nothing in his defense; here he explains himself at length (verses 11–13).
    sources: [jsp-ot1, jsp-ot2, strathearn-wife-sister, ryle-genesis, keil-genesis, lds-scriptures]
  - ref: 2
    phrase: Abimelech king of Gerar sent, and took Sarah
    kind: history
    title: Why take a woman of ninety?
    body: |
      Sarah was about ninety ([[Gen. 17:17]]), and Genesis does not say why the king wanted her. One reading supposes that the king “was not concerned for sensual enjoyment, but that he desired to ally himself as brother-in-law to Abraham the wealthy nomad prince.” Marrying the sister of a rich stranger would make the king his kinsman. It remains an inference; the text gives no motive.

      *Abimelech* means “Father-king.” Isaac later deals with an Abimelech in Gerar too, there called “king of the Philistines” ([[Gen. 26:1]]). The two kings are “possibly the same person”; some take the name as a title of Philistine kings, as Pharaoh was a title in Egypt.
    sources: [lds-scriptures, delitzsch-genesis, bd-abimelech, bdb]
  - ref: 3
    phrase: Behold, thou art but a dead man
    kind: words
    title: A dead man
    body: |
      The Hebrew is two words, *hinnekha met*, “behold, you are dying.” The form is a participle, which puts death before the king “as certainly at hand.” Yet verse 7 adds a condition: return the woman and “thou shalt live”; refuse and “thou shalt surely die.”

      Joseph Smith’s translation puts that condition at the start of the dream: “behold, thou hast taken a woman which is not thine own; for she is Abrahams wife. And the Lord said unto him, thou shalt return her unto Abraham, for if thou do it not thou shalt die.” In both texts the warning leaves the king a way to live, and he takes it at dawn (verse 8).
    sources: [biblehub-interlinear, delitzsch-genesis, jsp-ot2]
  - ref: 4
    phrase: wilt thou slay also a righteous nation?
    kind: scripture
    title: Abraham’s question in a king’s mouth
    body: |
      Abimelech asks God the question Abraham had asked about Sodom a short time before: “Wilt thou also destroy the righteous with the wicked?… Shall not the Judge of all the earth do right?” ([[Gen. 18:23, 25]]). The word for “righteous” is the same, *tsaddiq*, righteous in conduct “towards God.” Here it can be read “an innocent nation”: the king “appeals to the instinct of justice, that God will not punish the innocent, as if they were guilty.” He speaks for a whole nation, and the danger is to all of them: God’s warning covers “thou, and all that are thine” (verse 7), and the king will tell Abraham that he has brought a great sin “on me and on my kingdom” (verse 9).

      The reversal is plain in the text. At Sodom Abraham pleaded for the righteous among a wicked people. In Gerar a foreign king pleads his own righteousness to God, and it is Abraham’s words that have put him in danger. God does not dispute the plea (verse 6).
    sources: [lds-scriptures, biblehub-interlinear, bdb, ryle-genesis]
  - ref: 6
    phrase: I also withheld thee from sinning against me
    kind: words
    title: Kept from sin
    body: |
      God accepts Abimelech’s plea and tells him something he did not know: his innocence was partly God’s doing. How God kept him back is explained in verse 17: God “healed Abimelech,” so the king himself had been struck along with his household. Joseph Smith’s translation states it outright: “Abimelech had not come near her; for the Lord had not suffered him.”

      God calls what nearly happened a sin “against me”: “the violation of moral law is sin against God.” Abimelech will call it “a great sin” when he confronts Abraham (verse 9).
    sources: [ryle-genesis, jsp-ot2]
  - ref: 7
    phrase: for he is a prophet, and he shall pray for thee
    kind: words
    title: The first prophet
    body: |
      This is the first time the Bible calls anyone a prophet (Hebrew *navi*, “spokesman, speaker, prophet”), and the first prophet it names is Abraham. What God says Abraham will do as a prophet, though, is not to speak to Abimelech but to speak for him. The verb *hitpallel* with *be’ad*, “on behalf of,” means to “intercede.” Abraham had already stood “before the LORD” to plead for Sodom ([[Gen. 18:22–33]]), which is called “prophetic intercession,” and “Abraham is a distinctive example of this.”

      The same pattern comes back in scripture. God sends Job’s friends to Job with an offering: “my servant Job shall pray for you: for him will I accept” ([[Job 42:8]]), and the sending of Abimelech to Abraham’s prayers “recalls” that verse.
    sources: [ryle-genesis, bdb, biblehub-interlinear, shannon-abraham, lds-scriptures, delitzsch-genesis]
  - ref: 11
    phrase: Surely the fear of God is not in this place
    kind: history
    title: No fear of God in this place?
    body: |
      Abraham’s fear came from being a foreigner. He assumed that a people who did not fear God “would not be afraid of any Divine retribution, if they took the life of a stranger”; “the stranger had no rights,” and no kinsman nearby to avenge his death. The “fear of God” (*yir’at Elohim*) is reverence, piety. Joseph later reassures his brothers with the same appeal: “This do, and live; for I fear God” ([[Gen. 42:18]]).

      Abraham was wrong about Gerar, as verse 8 shows. The king acted throughout as a man answerable to God, and one reading calls him “the God-fearing heathen monarch.” Genesis does not hide the contrast, but it does not end there: it is still Abraham’s prayer that God hears (verse 17).
    sources: [ryle-genesis, bdb, biblehub-interlinear, lds-scriptures, delitzsch-genesis]
  - ref: 12
    phrase: she is the daughter of my father, but not the daughter of my mother
    kind: history
    title: Sister and wife
    body: |
      Abraham says that Sarah was his half-sister, a daughter of his father Terah by another mother. This is the only place Genesis says so. When it records the marriage, it names Nahor’s wife Milcah as “the daughter of Haran,” and Haran as “the father of Iscah” too, but gives no father for Sarai ([[Gen. 11:29]]). The Jewish historian Josephus has a different family tree: Haran left “Sarai and Milcha his daughters,” and “Abram married Sarai,” his niece. In this he was following a rabbinic tradition that identified Sarai with Iscah. The Church’s wording does not choose between them: “Because Abraham and Sarah both descended from Terah, customs of their time would likely have allowed for Abraham to accurately refer to Sarah as his sister.”

      A reader may also notice that the law of Moses would later forbid exactly this marriage, to “thy sister, the daughter of thy father, or daughter of thy mother” ([[Lev. 18:9]]).
    sources: [lds-scriptures, josephus-antiquities, strathearn-wife-sister, scripture-helps-gen-12-17, ryle-genesis]
  - ref: 13
    phrase: when God caused me to wander from my father’s house
    kind: history
    title: Abraham’s explanation
    body: |
      Abraham’s last answer is that the arrangement was an old one. From the time “God caused me to wander from my father’s house,” he had asked Sarah to call him her brother wherever they went. In Abraham’s own record the instruction first came from the Lord, as they drew near Egypt: “Let her say unto the Egyptians, she is thy sister, and thy soul shall live” ([[Abr. 2:22–25]]). Genesis 20 records no new word from the Lord for Gerar, and the reason Abraham gives here is his own fear (verse 11).

      He may also be choosing his words for a foreign king. In Hebrew the verb “caused me to wander” (*hit’u*) is plural, though “God” (*Elohim*) normally takes a singular verb. The plural appears in a few places “when an Israelite speaks to heathen, or else heathen are speaking of God.” In one reading Abraham is “accommodating himself to the polytheistic standpoint of the Philistine king,” describing his call as a wandering and “saying nothing about Jehovah, and the object of his wandering as revealed by Him.”

      The Old Testament “is willing to show us the complexities of men and women like Abraham and Sarah,” and “we do not need to see the patriarchs and matriarchs as always acting perfectly,” which “does not mean that we should ascribe to them gross unrighteousness.” Of Abraham, Isaac, and Jacob, latter-day revelation says that “they have entered into their exaltation” ([[D&C 132:37]]).
    sources: [lds-scriptures, biblehub-interlinear, ryle-genesis, keil-genesis, shannon-abraham]
  - ref: 16
    phrase: he is to thee a covering of the eyes
    kind: words
    title: A covering of the eyes
    body: |
      The Hebrew of this verse is difficult (“the text in the original is very doubtful”), and Joseph Smith’s translation gives it a plain sense: “behold, he shall give unto thee a covering of the eyes, And it shall be a token unto all, that thou mayest not be taken again from Abraham thy husband.” Abraham, the “brother” who has received the silver, is to give Sarah a covering that will be a token to everyone, so that she is not taken from her husband again.

      Otherwise the phrase is read as a figure: a covering of the eyes “so that they cannot see the wrong, figurative of a present offered in compensation for it.” Jacob uses a related idiom when he plans to “appease” Esau with a present ([[Gen. 32:20]]); the Hebrew says, literally, to cover his face. On either reading the gift was large. Silver was weighed, not coined, and a thousand pieces (shekels) was a great sum when the law later valued a servant’s life at “thirty shekels of silver” ([[Ex. 21:32]]).

      The last words, “thus she was reproved,” are uncertain too. The King James translators rendered the Hebrew verb (*yakach*) “reproved,” Joseph Smith’s translation keeps the word, and in 1828 to *reprove* still meant “to blame; to censure.” Read with different vowels, the same word means “thou art set right, righted, justified,” and the verse is also translated to end, “you are completely vindicated.” Abimelech’s “thy brother” has an edge either way: it repeats the word Sarah had used, and one reading hears it as sarcasm.
    sources: [ryle-genesis, jsp-ot2, jsp-ot1, bdb, lds-scriptures, keil-genesis, webster-1828, biblehub-interlinear, nrsvue]
  - ref: 18
    phrase: the LORD had fast closed up all the wombs of the house of Abimelech
    kind: history
    title: Wombs closed because of Sarah
    body: |
      Verse 18 says what God healed in Abimelech’s household: no one in it could bear children until Abraham prayed and “they bare children” (verse 17). In Genesis a closed womb and an opened one are both the Lord’s doing. Sarai said of her own childlessness, “the LORD hath restrained me from bearing” ([[Gen. 16:2]]); the LORD “opened” Leah’s womb ([[Gen. 29:31]]); and God “remembered Rachel… and opened her womb” ([[Gen. 30:22]]).

      All of this happened “because of Sarah,” and the timing gives it point. Abraham and Sarah “were still awaiting the time when they would be given a son to carry on the covenant.” A whole royal household was made barren for the sake of a barren woman of ninety who had been promised a child.

      Verse 18 is also the only place in the chapter where the narrator uses the name the LORD (*YHWH*, Jehovah); everywhere else it is “God.” In one reading the change is deliberate: the disease came “not as Elohim… but as Jehovah, the God of salvation,” to guard His purpose and “the birth of the promised son from Sarah.”
    sources: [lds-scriptures, strathearn-wife-sister, biblehub-interlinear, ryle-genesis, keil-genesis]

christ: |
  The LORD who closes the wombs of Abimelech’s house “because of Sarah” (verse 18) is Jehovah, “the premortal Jesus Christ.” Among the promises made to Abraham was that “Jesus Christ would be born through his lineage,” and Paul names the seed to whom the promises were made: “to thy seed, which is Christ” ([[Gal. 3:16]]). The Lord who kept Sarah safe in Gerar was guarding the line through which He Himself would be born.

explore: |
  - **The three wife-sister stories.** [[Gen. 12:10–20]]; [[Gen. 26:1–11]]. “The Wife/Sister Experience: Pharaoh’s Introduction to Jehovah” (Sperry Symposium, Religious Studies Center) reads all three in the light of the Book of Abraham.
  - **Abraham the intercessor.** [[Gen. 18:22–33]]; [[Gen. 20:7, 17]]; compare [[Job 42:7–10]].
  - **Abimelech again.** [[Gen. 21:22–34]], the covenant at Beer-sheba.
  - **The promise kept.** [[Gen. 18:9–15]]; [[Gen. 21:1–7]]; [[Heb. 11:11]].

