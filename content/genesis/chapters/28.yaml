chapter: 28
title: Jacob’s Ladder at Beth-el
tagline: Isaac blesses Jacob with the blessing of Abraham and sends him to Padan-aram for a wife, while Esau adds another wife of his own. On the road Jacob dreams of a ladder to heaven, and the LORD stands there and gives him the covenant directly. Jacob wakes in awe, names the place Beth-el, and vows that the LORD will be his God.
when: 'After Jacob received his father’s blessing and Esau threatened him ([[Gen. 27:41–46]]). The text gives no year.'

setting: |
  Jacob leaves home at Beer-sheba, where Isaac was then living ([[Gen. 26:23–25]]). Behind him is the scene of [[Gen. 27:1–40]], in which Isaac pronounced a blessing on Jacob and Esau swore to kill him. Rebekah arranged his flight to her brother Laban at Haran ([[Gen. 27:41–46]]), and Isaac now sends him with a second blessing, this time given knowingly.

  Genesis 28 is the first of three scenes in which the covenant with Abraham is renewed with Jacob: this chapter, [[Gen. 35:9–13]], and [[Gen. 48:3–4]]. “It was through Jacob that the covenant of Abraham continued.” Later scripture comes back to the dream. Hosea looks back on the place: “he found him in Beth-el, and there he spake with us” ([[Hosea 12:4]]); and Jesus tells Nathanael that he will see “the angels of God ascending and descending upon the Son of man” ([[John 1:51]]).

  The chapter has five parts: Isaac’s charge and blessing (verses 1–5), Esau’s response (6–9), the dream and the LORD’s promise (10–15), Jacob’s waking and the naming of Beth-el (16–19), and his vow (20–22).

thread: |
  Genesis 28 is about how the covenant made with Abraham becomes Jacob’s own. It reaches him twice, by two different hands. First Isaac gives it, knowing whom he blesses: “God Almighty bless thee… and give thee the blessing of Abraham” (verses 3–4). Then, on the road and alone, God gives it Himself: “I am the LORD God of Abraham thy father, and the God of Isaac” (verse 13).

  Jacob’s answer is the vow at the end of the chapter. God has introduced Himself by two other men’s names, and Jacob says, “then shall the LORD be my God” (verse 21). The conditions he sets are God’s own promises given back to Him (see the note on verse 20). Later the text shows that the vow was remembered: God calls Himself “the God of Beth-el, where thou anointedst the pillar, and where thou vowedst a vow unto me” ([[Gen. 31:13]]).

  Esau stands at the edge of the chapter as a contrast to Jacob. He acts after he has “seen” what pleases his father (verses 6 and 8), while of Jacob it is said that he “obeyed his father and his mother” (verse 7). And the chapter is a beginning, not an arrival. Jacob’s wrestle at the Jabbok ([[Gen. 32:24–30]]) is “the culmination of a process begun 20 years before at Bethel” (see the note on verse 17).

sections:
  - range: 1-5
    heading: Isaac’s charge and blessing
    plain: |
      Isaac called Jacob, blessed him, and gave him a charge: “Do not marry a Canaanite woman. Go to Padan-aram, to the house of Bethuel, your mother’s father, and take a wife from the daughters of Laban, your mother’s brother. May God Almighty bless you and make you fruitful and many, so that you become an assembly of peoples. May He give you the blessing of Abraham, to you and to your descendants with you, so that you inherit the land where you now live as a stranger, which God gave to Abraham.” So Isaac sent Jacob away, and he went to Laban, son of Bethuel the Syrian and brother of Rebekah, the mother of Jacob and Esau.
  - range: 6-9
    heading: Esau’s answer
    plain: |
      Esau saw that Isaac had blessed Jacob and sent him to Padan-aram to find a wife there, and that when he blessed him he had charged him not to marry a Canaanite woman; and that Jacob had obeyed his father and mother and gone to Padan-aram. Esau also saw that the Canaanite women did not please his father Isaac. So Esau went to Ishmael and, in addition to the wives he already had, married Mahalath, the daughter of Abraham’s son Ishmael and the sister of Nebajoth.
  - range: 10-15
    heading: The ladder and the promise
    plain: |
      Jacob left Beer-sheba and set out toward Haran. He came to a certain place and stayed there for the night because the sun had set. He took some of the stones of that place, put them under his head, and lay down to sleep. He dreamed: a ladder stood on the earth with its top reaching to heaven, and the angels of God were going up and down on it. The LORD stood above it and said, “I am the LORD, the God of your father Abraham and the God of Isaac. The land on which you are lying I will give to you and to your descendants. Your descendants will be like the dust of the earth, and you will spread out to the west and the east, to the north and the south. All the families of the earth will be blessed through you and your descendants. I am with you, and I will keep you wherever you go and bring you back to this land. I will not leave you until I have done what I have promised you.”
  - range: 16-19
    heading: “The gate of heaven”
    plain: |
      Jacob woke from his sleep and said, “Surely the LORD is in this place, and I did not know it.” He was afraid and said, “How awesome this place is! This is nothing less than the house of God, and this is the gate of heaven.” Early in the morning Jacob took the stone he had put under his head, set it up as a pillar, and poured oil on top of it. He called that place Beth-el; the city had been called Luz at first.
  - range: 20-22
    heading: Jacob’s vow
    plain: |
      Then Jacob made a vow: “If God will be with me and will keep me on this journey, and will give me bread to eat and clothes to wear, so that I come back to my father’s house in peace, then the LORD will be my God, and this stone that I have set up as a pillar will be God’s house. And of all that You give me, I will surely give You a tenth.”

notes:
  - ref: 1
    phrase: Thou shalt not take a wife of the daughters of Canaan
    kind: history
    title: Why Jacob must marry within the family
    body: |
      Isaac forbids a Canaanite wife because the covenant was meant to pass through a household that shared it. The charge repeats an older one. Abraham made his servant swear not to take a wife for Isaac “of the daughters of the Canaanites, among whom I dwell,” but to go “unto my country, and to my kindred” ([[Gen. 24:3–4]]). Esau, at forty, had married two Hittite women, who “were a grief of mind unto Isaac and to Rebekah” ([[Gen. 26:34–35]]; see the note on [[Gen. 26:34]]), and Rebekah told Isaac, “I am weary of my life because of the daughters of Heth” ([[Gen. 27:46]]). Her fear was for the covenant: if Jacob followed Esau, “all her life’s work, all her planning and teaching about the importance of the covenant God made with Abraham… would be worthless and wasted.” So Jacob is sent “to adherents of the covenant” to find a wife, “to ensure the claiming of that covenant.”

      Padan-aram, “the house of Bethuel,” is the country of Rebekah’s family. Haran, named in verse 10, is the city where Abraham first settled on leaving Ur and where his father Terah “tarried.” Laban is placed at both ([[Gen. 27:43]]; [[Gen. 28:2]]), and the lexicon locates Paddan, with a “perhaps,” “near Haran.”
    sources: [lds-scriptures, skinner-keeper-covenants, schade-isaac-jacob, bd-haran, bdb]
  - ref: 3
    phrase: And God Almighty bless thee, and make thee fruitful, and multiply thee, that thou mayest be a multitude of people
    kind: words
    title: God Almighty and an assembly of peoples
    body: |
      Isaac blesses Jacob in the name by which God made His covenant with Abraham, and with a promise larger than a big family. “God Almighty” is *El Shaddai*, the name God used when He told Abraham, “I will make my covenant between me and thee, and will multiply thee exceedingly” ([[Gen. 17:1–2]]); the note on that verse says what the name may mean. “A multitude of people” is, word for word, “an assembly of peoples” (*liqhal ‘ammim*). The Hebrew is plural, peoples and not a people, and *qahal* is an assembly called together.

      Isaac’s wish becomes God’s promise. When Jacob returns to Beth-el, God Himself says, “I am God Almighty: be fruitful and multiply; a nation and a company of nations shall be of thee” ([[Gen. 35:11]]), and the Hebrew has *qahal* again, “an assembly of nations.” Near the end of his life Jacob tells Joseph that God Almighty appeared to him at Luz and said, “I will make of thee a multitude of people” ([[Gen. 48:3–4]]), the same Hebrew words Isaac used here.
    sources: [biblehub-interlinear, bdb, lds-scriptures]
  - ref: 4
    phrase: the blessing of Abraham
    kind: scripture
    title: The blessing of Abraham, given knowingly
    body: |
      “The blessing of Abraham” is the covenant itself, and Isaac gives it to Jacob knowing whom he blesses. Abraham’s own account of it is in the Book of Abraham: a great nation, “this ministry and Priesthood” carried “unto all nations,” and all “the families of the earth” blessed through him and his seed ([[Abr. 2:9–11]]). Its promises include the assurances “that (1) Christ would come through his lineage, and that (2) Abraham’s posterity would receive certain lands as an eternal inheritance,” and the covenant was renewed with Isaac “and again with Jacob.” Isaac’s wording has the same two parts: “to thee, and to thy seed with thee,” and “that thou mayest inherit the land wherein thou art a stranger, which God gave unto Abraham.”

      The verse also answers a question left by chapter 27, where Isaac pronounced his blessing on Jacob thinking he was blessing Esau (see the note on [[Gen. 27:33]]). Here Isaac knows, and that is “an additional proof that Jacob received the blessing meant for him and that Isaac confirmed it upon him”: the blessings of the covenant “appear to have been intended for Jacob—not for Esau—and were not to be gained by deceit.” Genesis does not comment on the earlier scene itself; this is how Latter-day Saint sources read the two chapters together.
    sources: [lds-scriptures, bd-abraham-covenant, ot-manual-gen-24-36, schade-isaac-jacob]
  - ref: 9
    phrase: took unto the wives which he had Mahalath
    kind: history
    title: Esau’s third wife, a daughter of Ishmael
    body: |
      Esau answers his parents’ displeasure by marrying again, and still outside the line of promise. The text twice says he “saw” (verses 6 and 8): Isaac had blessed Jacob, forbidden a Canaanite wife, and sent him away, and “the daughters of Canaan pleased not Isaac.” So he goes “unto Ishmael,” meaning Ishmael’s family, since Ishmael had died ([[Gen. 25:17]]), and marries Mahalath “in addition to the wives he already had” (Hebrew *‘al nashav*). He does not send the Canaanite wives away.

      Mahalath is Abraham’s granddaughter, which looks like a step toward the family. But Ishmael’s line had been set apart from the family of promise (“in Isaac shall thy seed be called,” [[Gen. 21:12]]), and Esau’s life shows “disobedience and some displeasing choices of wives,” this marriage among them. One reading goes further: the marriage “only furnished another proof that he had no thought of the religious interests of the chosen family.” Mahalath is taken to be the “Bashemath” whom [[Gen. 36:3]] calls Ishmael’s daughter and Nebajoth’s sister.
    sources: [biblehub-interlinear, keil-genesis, bd-jacob, lds-scriptures]
  - ref: 12
    phrase: a ladder set up on the earth
    kind: symbol
    title: A ladder, or a stairway
    body: |
      The Hebrew word for the ladder occurs only here, and it is not clear whether it means a ladder or “a ramp or stairway.” One proposed background is Mesopotamian: the comparable Akkadian word names what “the messenger of the gods uses when he wants to pass from one realm to another,” and that stairway is what the Babylonians “sought to represent in the architecture of the ziggurats” (their temple towers), built “to provide a way for the deity to descend to the temple and the town.” On this view “Jacob’s background would have given him familiarity with this concept.” It is a scholarly hypothesis, not something Genesis says.

      Within the story the image is plainer. The ladder stands “on the earth,” where Jacob lies, and reaches to heaven. One reading takes it as “a visible symbol of the real and uninterrupted fellowship between God in heaven and His people upon earth,” with the angels carrying “up the wants of men to God” and bringing “down the assistance and protection of God to men,” and notes that it stands just where Jacob lay “in solitude, poor, helpless, and forsaken by men.”
    sources: [bdb, schade-isaac-jacob, frederick-use-of-ot, keil-genesis, lds-scriptures]
  - ref: 12
    phrase: the top of it reached to heaven
    kind: prophets
    title: Rungs of covenant, rounds of glory
    body: |
      Latter-day prophets use the ladder as a picture of going up to God, and they name the rungs differently. President Marion G. Romney said that Jacob “realized that the covenants he made with the Lord there were the rungs on the ladder that he himself would have to climb in order to obtain the promised blessings—blessings that would entitle him to enter heaven and associate with the Lord.” Joseph Smith used the ladder when he spoke of Paul’s vision of the third heaven ([[2 Cor. 12:2]]): Paul “could understand the three principal rounds of Jacob’s Ladder, the Telestial, the Terrestrial and the Celestial glories or Kingdoms.”

      The two statements were made for different purposes. Joseph Smith was explaining Paul, in a sermon the record places on 21 May 1843, and did not comment on the Genesis story itself; President Romney was explaining Jacob and the temple. What they share is the ladder as a way up into God’s presence, and Paul’s and Joseph Smith’s visions have been counted among the “Jacob-like experiences” of later prophets. Genesis names no rungs, so each is a prophet’s use of the image and not something the text states.
    sources: [romney-temples-1971, jsp-history-d1, skinner-keeper-covenants, lds-scriptures]
  - ref: 12
    phrase: the angels of God ascending and descending on it
    kind: christ
    title: Jesus takes the ladder’s place
    body: |
      Jesus points back to this verse when He meets Nathanael. He says, “Hereafter ye shall see heaven open, and the angels of God ascending and descending upon the Son of man” ([[John 1:51]]). It is the dream of Genesis 28:12, with the angels now traveling on a person instead of on a ladder. The allusion can be read on two levels. Jesus is “reaffirming that the Abrahamic covenant is still in effect for Abraham’s descendants,” and He is also saying something about Himself: “He has become the ladder, the link uniting heaven and earth.” Set beside His later words, “I am the door: by me if any man enter in, he shall be saved” ([[John 10:9]]), “Jesus, then, becomes the new Beth-el, the true ‘gate of heaven.’”

      John never uses the word *ladder*. This is a reading of the allusion, and a well-grounded one, but it is a reading. In Genesis itself Christ is present in another way: the LORD who speaks in verse 13 is Jehovah, and “Jehovah is the premortal Jesus Christ.”
    sources: [lds-scriptures, frederick-use-of-ot, bd-jehovah]
  - ref: 13
    phrase: the LORD stood above it
    kind: words
    title: Above it, or beside him
    body: |
      The Hebrew does not settle whether the LORD stood above the ladder or beside Jacob. The verb is *nitsav*, “take one’s stand,” and with the preposition *‘al* the lexicon glosses it “by, on,” as when Abraham’s servant, looking for Rebekah, says, “I stand here by the well” ([[Gen. 24:13]]). The word here, *‘alav*, can mean “over him” or “over it,” and both the ladder and Jacob are grammatically masculine. The versions divide. The KJV (with a footnote in the Latter-day Saint edition) and the NIV read “above it,” the NRSVUE reads “beside him,” and each gives the other possibility in a footnote. One reading takes it as above: “Above in heaven stood Jehovah, and explained in words the symbol which he saw.” Either way the LORD is present and speaks to Jacob in person.
    sources: [biblehub-interlinear, bdb, nrsvue, niv, keil-genesis, lds-scriptures]
  - ref: 14
    phrase: in thee and in thy seed shall all the families of the earth be blessed
    kind: scripture
    title: “In thee and in thy seed”
    body: |
      The blessing for all the families of the earth is now spoken to Jacob, and it joins the two forms it had taken before. To Abraham it was first “in thee shall all families of the earth be blessed” ([[Gen. 12:3]]), then “in thy seed shall all the nations of the earth be blessed” ([[Gen. 22:18]]; to Isaac, [[Gen. 26:4]]). At Beth-el it is “in thee and in thy seed.” The Book of Abraham explains the pairing: “in thee (that is, in thy Priesthood) and in thy seed (that is, thy Priesthood)… shall all the families of the earth be blessed, even with the blessings of the Gospel, which are the blessings of salvation, even of life eternal” ([[Abr. 2:11]]). The note on [[Gen. 22:18]] gives the New Testament and Book of Mormon reading of “seed.”

      The promise to Jacob is fulfilled twice over. Paul names the seed as Christ ([[Gal. 3:16]]), and the promise “was literally fulfilled in the mortal advent of the Savior, Jesus Christ.” It is fulfilled again as Jacob’s seed, “all latter-day peoples who accept the restored gospel,” become “missionaries of the name and gospel of the Son of God.” [From Babel’s Scattering to the Blessing of All Families](/genesis/themes/babel-to-blessing/)
    sources: [lds-scriptures, skinner-keeper-covenants]
  - ref: 17
    phrase: this is the gate of heaven
    kind: prophets
    title: Beth-el as a temple
    body: |
      Latter-day prophets read Beth-el as a temple. President Marion G. Romney: “Because he had met the Lord and entered into covenants with him there, Jacob considered the site so sacred that he named the place Bethel,” and “Temples are to us all what Bethel was to Jacob.” Jacob “had a templelike experience on the occasion of this vision,” but it was a beginning. The promises given at Beth-el “were conditional rather than absolute. Nowhere does the text say they were sealed or ratified with surety at this point,” and the text does not call this “the ultimate theophany,” which “would come later, after years of his righteousness.”

      Jacob’s own words fit the reading. “How dreadful” translates a participle, *nora’*, that the lexicon also lists as an attribute of God Himself (“a mighty God and terrible,” [[Deut. 7:21]]). On one reading, Jacob did not doubt that God is everywhere, but did not imagine that Jehovah would be near him “even here, far away from his father’s house and from the places consecrated to His worship.” [From Hiding from God to Meeting Him](/genesis/themes/hiding-to-meeting/)
    sources: [romney-temples-1971, skinner-keeper-covenants, bdb, keil-genesis, lds-scriptures]
  - ref: 18
    phrase: set it up for a pillar, and poured oil upon the top of it
    kind: symbol
    title: A pillar anointed with oil
    body: |
      Jacob turns the stone he slept on into a marker of his meeting with the LORD there. The pillar in this verse is “a stone, set up… and anointed as memorial of divine appearance,” and with the oil Jacob “sanctified the site of his vision.”

      The act is remembered. God later calls Himself “the God of Beth-el, where thou anointedst the pillar” ([[Gen. 31:13]]), and when Jacob comes back he sets up a pillar again and pours a drink offering and oil on it ([[Gen. 35:14]]).
    sources: [bdb, skinner-keeper-covenants, lds-scriptures]
  - ref: 19
    phrase: 'Beth-el: but the name of that city was called Luz at the first'
    kind: history
    title: Beth-el, once Luz
    body: |
      Beth-el, “house of God,” is a new name for a place that already had a name and a history. [[Gen. 35:6]] says “Luz… that is, Beth-el.” Beth-el became “one of the most sacred spots in Israel,” and it was already holy ground in Abraham’s day: “Here Abraham built his altar on his first arrival in Canaan.” Abraham had pitched his tent on a mountain east of Beth-el and “called upon the name of the LORD” there ([[Gen. 12:8]]; [[Abr. 2:20]]).

      Genesis tells of a second naming when Jacob returns from Padan-aram: he calls the place *El-beth-el* and, after God appears to him again, names it Beth-el once more. Chapter 35 tells that story ([[Gen. 35:1–15]]).
    sources: [bd-bethel, lds-scriptures]
  - ref: 20
    phrase: If God will be with me, and will keep me in this way that I go
    kind: words
    title: Jacob’s “if” repeats God’s own words
    body: |
      Jacob’s vow sounds like a bargain, but its conditions are the promises God has just made, in nearly the same Hebrew. God said, “I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land” (verse 15). Jacob answers, “If God will be with me, and will keep me in this way that I go,” and, “So that I come again to my father’s house in peace” (verses 20–21). “With you” (*‘immakh*) becomes “with me” (*‘immadi*); “will keep thee” (*ushmartikha*) becomes “will keep me” (*ushmarani*); and God’s “I will bring thee back” (*vahashivotikha*) becomes Jacob’s “that I may return” (*veshavti*), from the same verb. Only the bread and clothing are Jacob’s own.

      So the vow is less a bargain than an answer: Jacob “vowed, or covenanted, to live in complete harmony with God’s will.” The text shows the vow kept in mind. At the end of his years in Padan-aram God says, “I am the God of Beth-el… where thou vowedst a vow unto me” ([[Gen. 31:13]]), and when Jacob returns he tells his household that God “answered me in the day of my distress, and was with me in the way which I went” ([[Gen. 35:3]]), which echoes the words of his vow in the past tense.
    sources: [biblehub-interlinear, skinner-keeper-covenants, lds-scriptures]
  - ref: 22
    phrase: I will surely give the tenth unto thee
    kind: history
    title: Tithing before the law
    body: |
      Jacob promises a tenth of everything God will give him, long before any law required it. The Hebrew repeats the verb, literally “tithing I tithe to Thee” (*‘asser ‘a‘asserennu*), which the KJV renders “I will surely give the tenth.” Abraham’s payment to Melchizedek is the first recorded tithe (see the note on [[Gen. 14:20]]), and this vow comes next. Only later did the law direct the tithe to the Levites ([[Num. 18:21]]); then “the law enforced the payment and provided rules.” Jacob’s is a promise made to the LORD Himself, at what he has just called His house.

      Genesis does not say how Jacob kept it. One reading infers from the altar he built at Beth-el on his return ([[Gen. 35:7]]) that he “probably also dedicated the tenth to God.”
    sources: [biblehub-interlinear, bdb, bd-tithe, keil-genesis, lds-scriptures]

christ: |
  The LORD who stands above the ladder and speaks to Jacob is Jehovah: Jacob “heard the voice of the Lord Jehovah, the premortal Christ.” What He promises points toward His own coming, for all the families of the earth would be blessed in Jacob’s seed (verse 14), and that seed is Christ ([[Gal. 3:16]]; see the note on verse 14). Jesus later takes the dream to Himself, telling Nathanael that the angels of God would be seen “ascending and descending upon the Son of man” ([[John 1:51]]); the note on verse 12 shows how that has been read.

explore: |
  - **The other two renewals.** [[Gen. 35:1–15]] (Jacob at Beth-el on his return) and [[Gen. 48:3–4]] (Jacob recalls it to Joseph).
  - **The wrestle at the Jabbok.** [[Gen. 32:22–32]]. “Jacob: Keeper of Covenants” (*Ensign*, Mar. 1998) follows the thread from Beth-el to the Jabbok.
  - **Temple language.** Marion G. Romney, “Temples—The Gates to Heaven” (*Ensign*, Mar. 1971), with [[D&C 132:37]].
  - **Jesus and the ladder.** [[John 1:47–51]]; [[John 10:9]].
  - **The covenant stated.** [[Abr. 2:6–11]]; [[Gen. 22:15–18]].
  - **A prophet looks back.** [[Hosea 12:3–5]].

