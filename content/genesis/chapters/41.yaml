chapter: 41
title: There Was Bread
tagline: After two forgotten years in prison, Joseph is brought before Pharaoh, says that God and not he will give the answer, and is set over Egypt. He stores the grain of seven good years, and when the famine comes, “in all the land of Egypt there was bread.”
when: 'Joseph is thirty (verse 46), two full years after the butler was restored to office (40:21–23; 41:1). The text gives no year, and the Pharaoh is not named.'

setting: |
  Joseph has been in Egypt about thirteen years. He was seventeen when his brothers sold him ([[Gen. 37:2]]) and is thirty when he stands before Pharaoh (verse 46). In between he served in Potiphar’s house, was sent to prison on a false charge, and there interpreted the dreams of Pharaoh’s chief butler and baker ([[Gen. 39–40]]). The butler, restored to his office, “forgat him” ([[Gen. 40:23]]), and chapter 41 opens two years later. It is the turning point of the story: the forgotten prisoner ends the chapter ruling Egypt.

  The Bible Dictionary counts this Pharaoh among the Hyksos. They were “a group of Egyptianized Semites” who came to rule Egypt, and on one dating Joseph belongs to the time when they “began to take control of all of Egypt, in about 1650 BC.” The setting fits the story, but “we have no way of proving or disproving this hypothesis.”

  Later scripture returns to this chapter. A psalm says of Joseph’s release, “The king sent and loosed him” ([[Ps. 105:20]]), and Stephen says that God “gave him favour and wisdom in the sight of Pharaoh king of Egypt” ([[Acts 7:10]]). The two sons born in verses 50–52 became the tribes of Ephraim and Manasseh, and “one portion of Joseph’s descendants came to America about 600 B.C. and established two great peoples.”

  The chapter has seven parts: the dreams (verses 1–8), the butler (9–16), the interpretation (17–32), Joseph’s counsel (33–36), his rise (37–46), the plenteous years and two sons (47–52), and the famine (53–57).

thread: |
  Genesis 41 keeps asking who is doing this, and keeps answering God. The dreams are Pharaoh’s, but it is God who has “shewed Pharaoh what he is about to do” (verses 25, 28). The wise men of Egypt cannot read them (verse 8), the butler can only remember a prisoner (9–13), and Joseph, hurried out of the dungeon, begins by saying, “It is not in me” (16). By the end of the chapter *Elohim*, “God,” has been named nine times, even in the names Joseph gives his sons (51–52), and the name Jehovah does not occur at all.

  A second line runs beside it: forgetting. The butler “forgat” Joseph (40:23). The plenty “shall be forgotten” in the famine (verse 30). And God makes Joseph “forget” his toil (51). What turns the story is a man remembering at last (9).

  God works through people who act. Joseph proposes a plan, Pharaoh puts him in charge, and the grain is gathered until it cannot be counted. When the famine comes, “in all the land of Egypt there was bread” (54), and Pharaoh sends a hungry people to the one man who has it: “Go unto Joseph; what he saith to you, do” (55).

sections:
  - range: 1-8
    heading: Pharaoh’s two dreams
    plain: |
      Two full years later, Pharaoh had a dream. He was standing by the Nile, and seven healthy, fat cows came up out of the river and fed in the meadow. Then seven other cows came up after them, ugly and thin, and stood beside the first cows on the bank. The ugly, thin cows ate the seven fat ones, and Pharaoh woke up. He fell asleep and dreamed a second time: seven plump, good ears of grain grew on one stalk, and seven thin ears, scorched by the east wind, sprang up after them. The thin ears swallowed the seven full ones, and Pharaoh woke and saw that it was a dream. In the morning his spirit was troubled. He sent for all the magicians and wise men of Egypt and told them his dream, but none of them could interpret it for him.
  - range: 9-16
    heading: The butler remembers
    plain: |
      Then the chief butler said to Pharaoh, “Today I remember my faults. When Pharaoh was angry with his servants, he put me and the chief baker in custody in the house of the captain of the guard. We each had a dream the same night, and each dream had its own meaning. A young Hebrew was there with us, a servant of the captain of the guard. We told him our dreams, and he interpreted them, each according to his dream. And it turned out just as he said: I was restored to my office, and the baker was hanged.”

      Pharaoh sent for Joseph, and they hurried him out of the dungeon. He shaved, changed his clothes, and came in before Pharaoh. Pharaoh said to him, “I have had a dream, and no one can interpret it. I have heard it said of you that you need only hear a dream to interpret it.” Joseph answered, “Not I. God will give Pharaoh an answer that is for his good.”
  - range: 17-32
    heading: The dreams told and interpreted
    plain: |
      Pharaoh told Joseph his dreams. He stood on the bank of the river, and seven fat, good-looking cows came up out of it and fed in the meadow. Then seven other cows came up after them, poor, very ugly, and thin, such as he had never seen in all the land of Egypt. The thin, ugly cows ate the first seven fat ones, and when they had eaten them no one could tell that they had, for they looked as ugly as before. Then he woke. In his second dream he saw seven full, good ears on one stalk, and seven withered, thin ears, scorched by the east wind, that sprang up after them and swallowed the seven good ears. He had told the magicians, but no one could explain it to him.

      Joseph said to Pharaoh, “The dream of Pharaoh is one. God has shown Pharaoh what he is about to do. The seven good cows are seven years, and the seven good ears are seven years: the dream is one. The seven thin, ugly cows that came up after them are seven years, and so are the seven empty ears scorched by the east wind: they will be seven years of famine. This is what I have told Pharaoh: God has shown Pharaoh what he is about to do. Seven years of great plenty are coming throughout the land of Egypt. After them seven years of famine will come, and all the plenty will be forgotten in Egypt, and the famine will consume the land. The plenty will not be known in the land because of the famine that follows, for the famine will be very severe. The dream was repeated to Pharaoh twice because the matter is settled by God, and God will soon bring it about.”
  - range: 33-36
    heading: Joseph’s counsel
    plain: |
      “Now let Pharaoh look for a discerning and wise man and set him over the land of Egypt. Let Pharaoh appoint officials over the land to take a fifth of the produce of Egypt during the seven years of plenty. Let them gather all the food of these good years that are coming and store up grain under Pharaoh’s authority, to be kept as food in the cities. This food will be a reserve for the land against the seven years of famine that will come on Egypt, so that the land will not perish in the famine.”
  - range: 37-46
    heading: Joseph set over Egypt
    plain: |
      The plan seemed good to Pharaoh and to all his servants. Pharaoh said to them, “Can we find anyone like this man, one in whom is the Spirit of God?” He said to Joseph, “Since God has shown you all this, there is no one as discerning and wise as you. You will be over my house, and all my people will be ruled by your word. Only on the throne will I be greater than you. See, I have set you over all the land of Egypt.”

      Pharaoh took his signet ring off his hand and put it on Joseph’s hand. He dressed him in fine linen and hung a gold chain around his neck. He had him ride in his second chariot, and men cried out before him, “Bow the knee!” (the Hebrew word is uncertain). So he set him over all Egypt. Pharaoh said to Joseph, “I am Pharaoh, and without you no one will lift hand or foot in all the land of Egypt.” He gave Joseph the name Zaphnath-paaneah and gave him Asenath, the daughter of Potiphera, priest of On, as his wife. Joseph went out over the land of Egypt. He was thirty years old when he stood before Pharaoh, king of Egypt, and he left Pharaoh’s presence and went through all the land.
  - range: 47-52
    heading: The plenteous years and two sons
    plain: |
      In the seven years of plenty the land produced by the handful. Joseph gathered all the food of those seven years and stored it in the cities, putting in each city the food of the fields around it. He piled up grain like the sand of the sea, so much that he stopped counting, for it could not be counted.

      Before the years of famine came, two sons were born to Joseph by Asenath, daughter of Potiphera, priest of On. Joseph named the firstborn Manasseh, “For God has made me forget all my toil and all my father’s house.” The second he named Ephraim, “For God has made me fruitful in the land of my affliction.”
  - range: 53-57
    heading: The famine
    plain: |
      The seven years of plenty in Egypt came to an end, and the seven years of famine began, as Joseph had said. There was famine in all lands, but in all Egypt there was bread. When all Egypt was hungry and the people cried to Pharaoh for bread, Pharaoh told all the Egyptians, “Go to Joseph, and do what he tells you.” The famine spread over all the face of the earth, and Joseph opened all the storehouses and sold grain to the Egyptians, for the famine was severe in Egypt. And all the earth came to Egypt to buy grain from Joseph, because the famine was severe in all lands.

notes:
  - ref: 8
    phrase: magicians of Egypt
    kind: history
    title: The magicians and wise men of Egypt
    body: |
      The experts of Egypt are called first, and they fail. “Magicians” is *chartummim*, “one possessed of occult knowledge, diviner, astrologer, magician”; because the word “is always applied to Egyptian magicians” (the one exception, in [[Dan. 2:2]], is marked “late”), it “suggests Egyptian origin.” Their failure is a little surprising, because “in some ways, it is remarkable that these magicians could not have come up with some kind of logical explanation using their own well-known symbolism.” One reading finds the clue in Egypt’s own religion, where the cow “represented the earth, agriculture, and food; and the Nile, by its overflowing, was the source of the fertility of the land.”

      Egyptian dream manuals add a newer kind of evidence. They classify a dream as good or bad and read it as a sign of what will happen. By their rules these dreams “would have perplexed the Egyptian priests because a connection with a cow was seen as good, while measuring barley was seen as bad,” and Joseph “does not interpret the dream the way that the Egyptian dream interpretation manuals would have.” Genesis itself gives no reason for the failure. It says only that “there was none that could interpret them unto Pharaoh,” so that whatever comes next does not come from the experts.
    sources: [bdb, ot-manual-gen-37-50, keil-genesis, gee-clothes-cups, lds-scriptures]
  - ref: 9
    phrase: I do remember my faults this day
    kind: words
    title: The butler mentions what he owes
    body: |
      The butler’s verb is the one Joseph begged him to use. In prison Joseph said, “make mention of me unto Pharaoh” ([[Gen. 40:14]]); the Hebrew is *hizkir*, the causative of “remember,” that is, “mention.” The butler’s “I do remember my faults” uses the same verb as a participle, *mazkir*: literally, *my faults I am mentioning today*. What he failed to do before is its opposite: he did not remember (*zakar*) Joseph but forgot (*shakach*) him ([[Gen. 40:23]]).

      “Faults” is *chata’ai*, “my sins,” from the same root as the verb the KJV renders “offended” when it tells why the butler went to prison (*chat’u*, [[Gen. 40:1]]); both are used of a wrong done to another person. Genesis does not say which fault the butler has in mind: the offense that put him in prison, or the lapse that left Joseph there ([[Gen. 40:23]]). In mentioning his own failings he finally mentions Joseph, as he was asked two years before.
    sources: [oshb-wlc, biblehub-interlinear, bdb, lds-scriptures]
  - ref: 14
    phrase: hastily out of the dungeon
    kind: words
    title: Out of the pit
    body: |
      The KJV’s “dungeon” is *bor*, “pit” or “cistern,” the same word as the pit where Joseph’s brothers threw him, “empty, there was no water in it” ([[Gen. 37:24]]). Used of a prison, the word means a “pit with no water in it,” and Joseph used it of his own prison when he asked the butler to remember him: “they should put me into the dungeon” ([[Gen. 40:15]]). So the verse brings him out of a pit a second time, and “hastily”: the Hebrew says they “hurried him.”

      The shaving fits Egyptian custom: “While Semites tended to grow beards, Egyptians would shave.” Joseph is made presentable before he “came in unto Pharaoh,” and from here on he looks like an Egyptian, which is one reason given for his brothers’ not knowing him when they come ([[Gen. 42:8]]).
    sources: [oshb-wlc, biblehub-interlinear, bdb, gee-clothes-cups, lds-scriptures]
  - ref: 16
    phrase: It is not in me
    kind: words
    title: Joseph gives the credit away
    body: |
      Joseph’s first words to Pharaoh refuse the credit. “It is not in me” is one Hebrew word, *bil’adai*, “apart from me,” used here as “a particle of deprecation… not to me! i.e. I claim nothing.” He had said the same to the butler and baker: “Do not interpretations belong to God?” ([[Gen. 40:8]]). The word comes back from Pharaoh’s mouth at the end of the scene, *bil’adekha*, “without thee shall no man lift up his hand or foot in all the land of Egypt” ([[Gen. 41:44]]). Joseph says, in effect, *apart from me, God*; Pharaoh says *apart from you, no one*.

      “An answer of peace” is *shalom*, a word that covers “welfare, health, prosperity” as well as peace, so Joseph’s promise is that God will answer for Pharaoh’s welfare.
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 21
    phrase: it could not be known that they had eaten them
    kind: structure
    title: Pharaoh’s retelling adds a detail
    body: |
      When Pharaoh tells his dreams again he adds a detail the narrator left out, and Joseph builds on it. In verses 1–7 the lean cows eat the fat ones. In Pharaoh’s own account nothing shows that they have: “it could not be known that they had eaten them; but they were still ill favoured, as at the beginning.” He also says he had never seen cows so bad “in all the land of Egypt for badness” (verse 19).

      Joseph’s interpretation takes up the detail in the same Hebrew verb. The feeding “could not be known” (*lo noda’*, verse 21), and the plenty “shall not be known” (*lo yivvada’*) in the land because of the famine (verse 31), for “all the plenty shall be forgotten” (verse 30). The famine will leave no trace of the good years. That is what Joseph’s plan in the next verses is built to prevent: plenty that is only eaten is gone, so it must be stored.
    sources: [oshb-wlc, biblehub-interlinear, lds-scriptures]
  - ref: 25
    phrase: God hath shewed Pharaoh what he is about to do
    kind: words
    title: God is the one doing it
    body: |
      In Joseph’s interpretation the doer is God. “What he is about to do” is a participle, *’oseh*, “[is] doing,” and Joseph says it in verse 25 and again in verse 28, with the verbs “declared” (*higgid*) and “shown” (*her’ah*). Whose action the famine is, and whose the plenty, is settled before anyone asks what to do about it.

      The whole chapter speaks this way. Joseph says *Elohim*, “God,” to Pharaoh (verses 16, 25, 28, 32), Pharaoh says it back to him (38–39), and Joseph says it again when he names his sons (51–52). He spoke of “God” to Potiphar’s wife as well ([[Gen. 39:9]]). The dreams themselves (verses 1–28) are among the ways in which “God communicates with men.”
    sources: [oshb-wlc, biblehub-interlinear, bd-dreams, lds-scriptures]
  - ref: 32
    phrase: the dream was doubled unto Pharaoh twice
    kind: words
    title: Why the dream came twice
    body: |
      Joseph explains the doubling himself: “the thing is established by God, and God will shortly bring it to pass.” The Hebrew is a pair of participles: the matter is “established” (*nakhon*), and God is “hastening” (*memahher*) to do it. So the second dream adds certainty and nearness, not new information, since the two dreams already have one meaning (verses 25–26).

      Joseph’s own dreams in chapter 37 also came as a pair ([[Gen. 37:5–9]]), and Genesis says that he “remembered the dreams” when his brothers bowed before him ([[Gen. 42:9]]). Genesis does not itself apply Joseph’s rule to them.
    sources: [biblehub-interlinear, lds-scriptures]
  - ref: 34
    phrase: take up the fifth part of the land of Egypt
    kind: prophets
    title: A plan as well as an interpretation
    body: |
      Joseph was asked for the meaning of a dream, and he gives Pharaoh a plan as well: find “a man discreet and wise,” appoint officers, take “the fifth part” in the good years, and store the grain in the cities “that the land perish not” (verses 33–36). “Take up the fifth part” is one Hebrew verb, *chimmesh*, “to fifth,” that is, to “take the fifth part of” the land, “i.e. the fifth part of the produce.” The fifth later becomes a standing law in Egypt ([[Gen. 47:26]]).

      Latter-day leaders hold up the plan as preparation made in answer to revelation. President Hinckley: “Let us never lose sight of the dream of Pharaoh concerning the fat cattle and the lean, the full ears of corn and the blasted ears, the meaning of which was interpreted by Joseph to indicate years of plenty and years of scarcity.” Bishop Waddell says that Pharaoh “listened to Joseph, responded to what God had showed him in a dream, and immediately set about preparing for what was to come,” and that “it was not enough to know that challenging times would come. They had to act, and because of their effort, ‘there was bread.’”
    sources: [bdb, hinckley-prepared, waddell-bread, lds-scriptures]
  - ref: 38
    phrase: a man in whom the Spirit of God is
    kind: words
    title: Pharaoh answers in Joseph’s own words
    body: |
      Pharaoh’s verdict echoes Joseph’s. Joseph had asked for “a man discreet and wise” (*navon vechakham*, verse 33), and Pharaoh says there is “none so discreet and wise as thou art” (verse 39), the same two Hebrew words. Joseph had also credited God, and Pharaoh now says that Joseph has “the Spirit of God” (*ruach Elohim*) in him, words that have become part of Joseph’s portrait as “a visionary man, a dreamer and interpreter of dreams.”

      What Pharaoh means is what he has just seen, insight and wisdom that come from God. Joseph never claimed it; Pharaoh draws the conclusion from what he heard: “forasmuch as God hath shewed thee all this.” The Book of Mormon has a similar scene. Ammon, “filled with the Spirit of God,” perceives king Lamoni’s thoughts, and the king asks whether he is “that Great Spirit” ([[Alma 18:16–18]]).
    sources: [oshb-wlc, biblehub-interlinear, bd-joseph, lds-scriptures]
  - ref: 42
    phrase: Pharaoh took off his ring from his hand
    kind: history
    title: Ring, linen, and gold chain
    body: |
      Each of Pharaoh’s gifts is a mark of office. The ring is the signet, a “signet-ring, of king, taken from his hand and given as token of authority” (compare [[Esth. 3:10]]; [[Esth. 8:2]]). In Egypt “only the highest-ranking officials… were allowed to use the king’s seal and act in the king’s stead.” The “fine linen” is *shesh*, “fine Egyptian linen”; the Hebrew word is “a loanword from Egyptian” for “the best type of cloth,” and “clothing was normally given by higher ranking officials to lower ranking ones.” The gold chain is *ravid*, “chain, ornament for neck.”

      The “second chariot” puts Joseph next to Pharaoh (*mishneh* means “second”). The cry before him, *avrekh*, which the KJV renders “Bow the knee,” is uncertain: its “meaning [is] dubious; many Egyptian derivatives [have been] proposed.” Pharaoh keeps the line he has drawn: “only in the throne will I be greater than thou” (verse 40).
    sources: [bdb, gee-clothes-cups, lds-scriptures]
  - ref: 45
    phrase: Zaphnath-paaneah
    kind: history
    title: An Egyptian name and an Egyptian wife
    body: |
      Pharaoh gives Joseph an Egyptian name and an Egyptian wife, and the text explains neither. The name’s “meaning is uncertain.” Josephus says that Pharaoh called Joseph “Psothom Phanech,” a name that “denotes the revealer of secrets,” and rabbinic commentaries, “following the Targum,” read it the same way. Egyptian originals have also been proposed, one meaning “the god speaks and he lives,” another “Who is called The One Who Lives.” All the names in the verse “are Egyptian names that have linguistic and culture parallels from the time of Joseph.”

      The wife is Asenath, daughter of “Poti-pherah priest of On.” On is Heliopolis, “city of the sun.” On one reading, the name and the marriage were Pharaoh’s way of making Joseph “perfectly naturalized.” A Hyksos setting would suggest more: if Joseph served a Semitic king, the priest of On “was likely a relative of that king,” making Asenath “a fellow Semite through whose children the priesthood line and covenant would continue.” That is a hypothesis with “no way of proving or disproving” it. Genesis says only that she bore two sons, and that Joseph named them for what God had done (verses 51–52).
    sources: [bd-zaphnath-paaneah, bd-on, josephus-antiquities, bdb, sc-knowhy-842, keil-genesis, muhlestein-israel-egypt, lds-scriptures]
  - ref: 49
    phrase: as the sand of the sea
    kind: scripture
    title: Grain as numerous as the sand
    body: |
      Joseph’s grain is measured with the figure used for the promise to Abraham’s children. “As the sand of the sea” (*kechol hayyam*) is “usually sand of seashore, simile of numberlessness, vastness, so of Abraham’s seed,” as in [[Gen. 22:17]], and of Jacob’s, as in [[Gen. 32:12]]; the “corn gathered by Joseph” is among its uses. The counting matches as well. Jacob’s seed “cannot be numbered for multitude,” and Joseph “left numbering; for it was without number.” Both verses use the root *saphar*, “count.”

      Genesis does not say that the echo is intended, but it does say what the grain is for. Joseph tells his brothers that God sent him “to preserve you a posterity in the earth, and to save your lives by a great deliverance” ([[Gen. 45:7]]).
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 51
    phrase: hath made me forget all my toil
    kind: words
    title: Manasseh, made to forget
    body: |
      Joseph names his firstborn Manasseh, “causing to forget,” and credits God for the forgetting. The verb is *nashah* (here *nashshani*, “hath made me forget”), a different word from the *shakach* used of the butler, who “forgat” Joseph ([[Gen. 40:23]]), and of the plenty that “shall be forgotten” (verse 30).

      Joseph had not forgotten his father. One reading is that forgetting “all my father’s house” means only that “now that he was married and had a child, he ceased to suffer from home sickness… but his love for his father was as warm as ever,” and later scenes bear it out. When his brothers come, he asks, “Is your father well, the old man of whom ye spake? Is he yet alive?” ([[Gen. 43:27]]), and he asks again as soon as he tells them who he is: “doth my father yet live?” ([[Gen. 45:3]]).
    sources: [bdb, ellicott-genesis, lds-scriptures]
  - ref: 52
    phrase: hath caused me to be fruitful in the land of my affliction
    kind: scripture
    title: Fruitful in the land of affliction
    body: |
      Joseph’s word for what God has done, *hifrani*, “hath made me fruitful,” is a word of the covenant. It is the verb God used when He promised Abraham, “I will make thee exceeding fruitful” ([[Gen. 17:6]]), and the one Isaac used when he blessed Jacob, “make thee fruitful, and multiply thee” ([[Gen. 28:3]]); in each it is God who makes fruitful. Joseph finds that fruitfulness in Egypt, which he still calls “the land of my affliction.”

      Ephraim, “fruitful,” becomes more than a name. Jacob will set him ahead of his older brother ([[Gen. 48:19–20]]), and in the last days it has been the tribe of Ephraim’s “privilege first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel.” The Lord speaks of “the richer blessing upon the head of Ephraim and his fellows” ([[D&C 133:34]]). Manasseh has his place too: Lehi’s family descended from him ([[Alma 10:3]]).
    sources: [bdb, bd-ephraim, lds-scriptures]
  - ref: 54
    phrase: in all the land of Egypt there was bread
    kind: christ
    title: Bread in Egypt
    body: |
      Joseph’s bread is one of the places where the Church’s materials set him beside Jesus Christ. “By following God’s guidance, Joseph had enough bread to save Egypt from famine,” and Jesus Christ is “the bread of life” ([[John 6:35]]); both “were saviors to their people and provided them with lifesaving bread.” The Egyptians themselves later say to Joseph, “Thou hast saved our lives” ([[Gen. 47:25]]).

      Genesis also says that Joseph “sold” the grain (verse 56), and [[Gen. 47:13–19]] tells what Egypt paid for it.
    sources: [liahona-joseph-jesus, scripture-helps-gen-37-41, lds-scriptures]
  - ref: 55
    phrase: Go unto Joseph; what he saith to you, do
    kind: prophets
    title: “Go unto Joseph” in the last days
    body: |
      Elder Russell M. Nelson reads Pharaoh’s command as a pattern for the Restoration. In a 1997 address he set Joseph of Egypt beside Joseph Smith: both were seventeen when told of their destiny, both were imprisoned on false charges. He then quotes this verse and says, “In the latter days, people starving for nourishment that only the gospel can provide are again to be fed—by Joseph,” and he cites the Lord’s word to Joseph Smith that “this generation shall have my word” through him ([[D&C 5:10]]). The ancient Joseph had foreseen it: “A choice seer will I raise up out of the fruit of thy loins” ([[2 Ne. 3:7]]). It has been “primarily Joseph’s descendants whom the Lord has called upon first in these last days to carry the gospel to the nations of the earth.”
    sources: [nelson-remnants, bd-joseph, lds-scriptures]
  - ref: 56
    phrase: the famine was over all the face of the earth
    kind: history
    title: How wide was the famine?
    body: |
      Genesis describes the famine’s reach in two ways, and neither says exactly how far it went. In verse 54 the plural is “all lands” (*ha-aratsot*), a form that “denotes lands, countries, often in contrast to Canaan.” In verses 56–57 the word is *ha-arets*, “the earth” or “the land,” since the singular can mean either (“all the face of the earth,” “all the earth”). The only buyers Genesis goes on to name are Jacob’s sons, who come because “the famine was in the land of Canaan” ([[Gen. 42:5]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

christ: |
  Joseph is brought hastily from the pit and, in one audience, set over a kingdom, and from there he feeds a famished world. Besides the bread (see the note on verse 54), the Church’s manuals draw the likeness to the Savior at three points in this chapter. Joseph began his work at thirty, as Jesus began His ministry ([[Gen. 41:46]]; [[Luke 3:23]]). Heralds cried “Bow the knee” before Joseph ([[Gen. 41:43]]), and all will bow the knee to Christ ([[D&C 88:104]]). And both “gave God the glory for the good things they did”: Joseph says, “It is not in me: God shall give Pharaoh an answer of peace,” and Jesus says, “I do nothing of myself; but as my Father hath taught me, I speak these things” ([[John 8:28]]).

explore: |
  - **The dreams fulfilled.** Joseph’s brothers bow to him in [[Gen. 42:6]] and [[Gen. 43:26–28]], and he names God’s purpose in [[Gen. 45:5–8]] and [[Gen. 50:20]].
  - **What Egypt paid.** [[Gen. 47:13–26]] continues the famine story and the fifth.
  - **Ephraim before Manasseh.** [[Gen. 48:13–20]]; [[D&C 133:26–34]].
  - **Another interpreter before another king.** Compare Joseph’s “It is not in me” with [[Dan. 2:27–30]], and read [[Ps. 105:16–22]].
  - **Joseph’s prophecy of a latter-day seer.** [[2 Ne. 3:4–22]]; [[Alma 46:23–27]] on the remnant of Joseph’s coat.
  - **Egypt in the Joseph story.** “Clothes and Cups: The Tangible World of Joseph,” in *From Creation to Sinai* (BYU Religious Studies Center), sets the story in its Egyptian material world.

