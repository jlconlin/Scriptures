chapter: 29
title: Seven Years for Rachel, and the LORD Who Saw Leah
tagline: Jacob reaches Haran, rolls the stone from a well for Rachel, and serves seven years for her, only to wake beside Leah. After Leah’s wedding week he has Rachel too, with seven more years to serve, and the LORD, who saw that Leah was loved less, gives her four sons, the fourth named Judah, “praise.”
when: 'Jacob’s arrival in Haran, the start of twenty years there ([[Gen. 31:41]]). The text gives no year.'

setting: |
  Jacob comes to Haran with two charges behind him. His father told him to take a wife from the daughters of Laban, his mother’s brother ([[Gen. 28:1–2]]), and at Beth-el the LORD promised, “I am with thee, and will keep thee in all places whither thou goest” ([[Gen. 28:15]]). He would stay twenty years, fourteen of them worked for Laban’s two daughters and six for his flock ([[Gen. 31:41]]).

  Having “received the birthright,” he “traveled to his mother’s homeland to find a wife.” Chapter 29 begins that stay. In Haran his household takes shape: of the twelve sons, all but Benjamin were born there, and Genesis 29 and 30 tell of eleven of them and Dinah.

  Later scripture remembers the two sisters as one pair. Bethlehem blessed Ruth with the prayer that she would be “like Rachel and like Leah, which two did build the house of Israel” ([[Ruth 4:11]]).

  The chapter has three parts: Jacob at the well and in Laban’s house (verses 1–14), the seven years and the wedding night (15–30), and the births of Leah’s first four sons (31–35).

thread: |
  Genesis 29 is a chapter about looking. Jacob “looked, and behold a well” (verse 2). When he “saw Rachel” he rolled the stone from the well (verse 10). Rachel is “beautiful and well favoured,” literally “beautiful in form and beautiful in appearance” (verse 17), and the Hebrew word for “appearance,” *mar’eh*, is a noun made from the verb “see.” On the morning after the wedding he looks again: “behold, it was Leah” (verse 25). Jacob sees only what an evening feast, and probably a veil, let him see.

  The LORD is not named in the chapter until verse 31, and when He is named, He sees: “the LORD saw that Leah was hated” (the Hebrew verb is the same *ra’ah*, “see”). Leah names her first son Reuben, “see, a son,” because “the LORD hath looked upon my affliction” (verse 32). Her first three sons are named with her husband in view. The fourth naming is the only one that says nothing of Jacob’s feelings: “Now will I praise the LORD.” He is Judah, from whom the Savior descends ([[Matt. 1:2–3]]).

  The chapter also puts Jacob on the other side of a trick. Laban’s excuse (“the younger before the firstborn”) and the word Jacob uses for the trick (“beguiled”) both recall Jacob’s own part in Isaac’s house. The note on verse 25 says how far the text lets that echo be pressed.

sections:
  - range: 1-14
    heading: At the well in Haran
    plain: |
      Jacob went on to the land of the people of the east. In the open country he saw a well with three flocks of sheep lying beside it, and a great stone over its mouth. When all the flocks had gathered, the shepherds rolled the stone away, watered the sheep, and put it back. Jacob asked them where they were from. “From Haran.” “Do you know Laban, Nahor’s descendant?” “We do.” “Is he well?” “He is well, and look, his daughter Rachel is coming with the sheep.”

      Jacob said it was still broad day, not time to bring the animals in; they should water the sheep and take them back to pasture. They said they could not until all the flocks were gathered and the stone was rolled away. While he was still speaking, Rachel arrived with her father’s sheep, for she was the shepherd. When Jacob saw Rachel, the daughter of his mother’s brother, with his uncle’s sheep, he went up, rolled the stone from the well, and watered Laban’s flock. He kissed Rachel and wept aloud. He told her he was her father’s relative, Rebekah’s son, and she ran and told her father.

      When Laban heard the news about his sister’s son, he ran to meet him, embraced him, kissed him, and brought him home. Jacob told him everything. Laban said, “You are my own bone and flesh,” and Jacob stayed with him a month.
  - range: 15-30
    heading: Seven years for Rachel, and seven more
    plain: |
      Laban said, “Because you are my relative, should you work for me for nothing? Tell me what your wages should be.” Laban had two daughters, Leah the elder and Rachel the younger. Leah’s eyes were “tender” (weak or soft; see the note), and Rachel was beautiful in form and appearance. Jacob loved Rachel and said, “I will serve you seven years for Rachel, your younger daughter.” Laban answered, “Better that I give her to you than to another man. Stay with me.” Jacob served seven years for Rachel, and they seemed to him like a few days because he loved her.

      Then Jacob said, “Give me my wife, for my time is complete.” Laban gathered all the men of the place and made a feast. In the evening he took his daughter Leah and brought her to Jacob, and Jacob went in to her. Laban gave his servant Zilpah to Leah. In the morning, there was Leah. Jacob said to Laban, “What have you done to me? Did I not serve you for Rachel? Why have you deceived me?”

      Laban said, “It is not done in our place to give the younger before the firstborn. Finish this one’s wedding week, and we will give you the other also, for seven more years of service.” Jacob did so. When he had finished Leah’s week, Laban gave him Rachel as his wife, and gave his servant Bilhah to Rachel. Jacob went in to Rachel also, and he loved Rachel more than Leah (the verse that follows says “hated”), and he served Laban seven more years.
  - range: 31-35
    heading: The LORD sees Leah
    plain: |
      When the LORD saw that Leah was loved less (the KJV says “hated”), He opened her womb, but Rachel was barren. Leah conceived and bore a son and named him Reuben, saying, “The LORD has looked on my affliction; now my husband will love me.” She conceived again and bore a son and said, “The LORD has heard that I am hated, and so he has given me this one also,” and named him Simeon. She conceived again and bore a son and said, “Now at last my husband will be joined to me, because I have borne him three sons,” and named him Levi. She conceived again and bore a son and said, “This time I will praise the LORD,” and named him Judah. Then she stopped bearing.

notes:
  - ref: 1
    phrase: the land of the people of the east
    kind: history
    title: Where Jacob arrived
    body: |
      Jacob has come to the country around Haran, where Laban’s family lived. “His branch of the family remained at Haran when Abraham moved on into Canaan.” “The people of the east” is the Hebrew *bene qedem*, “sons of the east,” that is, “dwellers in the east, tribes east or northeast of Canaan.” The phrase is general; the shepherds name the place when they answer, “Of Haran are we” (verse 4).
    sources: [bd-laban, bdb, lds-scriptures]
  - ref: 2
    phrase: a great stone was upon the well’s mouth
    kind: history
    title: Why the stone, and why the shepherds waited
    body: |
      The stone over the well explains why the shepherds will not water their flocks yet. A well here was a cistern, “often covered with a large stone requiring two or three men to remove it,” which “protected the water from the rays of the sun and from mischief or pollution.” The shepherds’ answer, “We cannot, until all the flocks be gathered together” (verse 8), states their rule, and in one reading the well “seems to have belonged to the community, and was not opened for use, until all the herdsmen and shepherds had come.”

      How heavy the stone was the text does not say. The shepherds roll it away together (verse 3); Jacob, when he sees Rachel, “went near, and rolled the stone” (verse 10), which one reading takes as “a feat of great personal strength.” What that effort means in the story is taken up at verse 10.
    sources: [ryle-genesis, lds-scriptures]
  - ref: 10
    phrase: rolled the stone from the well’s mouth
    kind: scripture
    title: A betrothal at a well
    body: |
      This scene belongs to a pattern in which a traveler from far away meets his future wife at a well. Abraham’s servant meets Rebekah at one ([[Gen. 24:11–20]]), and Moses will meet Zipporah at one ([[Ex. 2:15–21]]). Scholars call this a “type-scene,” a story “modeled after a basic outline, with the specifics being changed depending on the individual story being told.” Listeners who knew the pattern expected a betrothal and listened for what was different.

      In Genesis 29 the difference is the stone. “The effort Jacob has to put in to move the stone out of the way before being able to water Rachel’s flocks is fitting in light of the effort Jacob is going to have to make before he is able to marry Rachel: seven years of work.” As in the pattern, the woman runs home to tell her family (verse 12), as Rebekah did ([[Gen. 24:28]]).
    sources: [sc-knowhy-854, lds-scriptures]
  - ref: 5
    phrase: Laban the son of Nahor
    kind: words
    title: Son of Nahor, grandson of Nahor
    body: |
      Jacob asks after “Laban the son of Nahor,” but Laban was Nahor’s grandson. His father was Bethuel ([[Gen. 24:24]]; [[Gen. 24:29]]), and he is “Son of Bethuel, grandson of Nahor, grandnephew of Abraham.” The Hebrew *ben*, “son,” covers “grandson” and descendant, and that is its sense here. In one reading Nahor is named as the more famous ancestor, as Jehu is called “the son of Nimshi” though Nimshi was his grandfather ([[2 Kgs. 9:20]]; [[2 Kgs. 9:2]]).

      Hebrew “brother” (*ach*) is as wide. Jacob tells Rachel that he is “her father’s brother” (verse 12) when he is Laban’s sister’s son; there and in verse 15 the word means “relative,” “nephew.” That is why Laban can say “brother” to Jacob in verse 15 and mean a nephew.
    sources: [bd-laban, bdb, ryle-genesis, lds-scriptures]
  - ref: 14
    phrase: my bone and my flesh
    kind: words
    title: Kin first, then wages
    body: |
      “My bone and my flesh” is the language of close kinship, and Laban follows it with a question of wages. The expression stands with Adam’s “bone of my bones, and flesh of my flesh” ([[Gen. 2:23]]), with Abimelech’s appeal to his mother’s kin at Shechem ([[Judg. 9:2]]), and with the tribes’ words to David ([[2 Sam. 5:1]]). Laban says it when they meet (verse 14); when Jacob has stayed a month, he raises the question of pay: “Because thou art my brother, shouldest thou therefore serve me for nought? tell me, what shall thy wages be?” (verse 15).

      The verse does not say whether the offer was generous. What followed was twenty years in which “There was a good deal of mutual deception, each trying to outdo the other.”
    sources: [bdb, bd-laban, lds-scriptures]
  - ref: 17
    phrase: Leah was tender eyed
    kind: words
    title: What “tender eyed” means
    body: |
      “Tender eyed” may mean weak eyes or soft, lovely ones, and the Hebrew does not decide. The word is *rakkot*, plural of *rak*, “tender, delicate, soft”; the sense given for this verse is “delicate, weak, of eyes.” Taken in its gentler sense, the word “means ‘soft, delicate, or lovely,’” and then the verse “seems to suggest that Leah’s eyes were her most attractive feature.” Most translations choose “weak”: the Greek Septuagint reads “the eyes of Lea were weak,” and the ESV, NIV, and NRSVUE all say “weak,” though the ESV and NIV give “soft” and “delicate” in their footnotes and the NRSVUE marks the Hebrew’s meaning as uncertain.

      What the verse says plainly is that Rachel was “beautiful in form and beautiful in appearance,” and that Jacob loved her (verse 18).
    sources: [bdb, biblehub-interlinear, lxx-rahlfs, esv, nrsvue, niv, ot-manual-gen-24-36, lds-scriptures]
  - ref: 18
    phrase: I will serve thee seven years for Rachel thy younger daughter
    kind: history
    title: Seven years of work in place of a bride-price
    body: |
      Jacob offers labor because he has nothing else to give. A bridegroom customarily brought a gift, the *mohar*, as when Abraham’s servant gave Rebekah’s family “precious things” ([[Gen. 24:53]]). That servant had come with ten camels ([[Gen. 24:10]]). Jacob “cannot as bridegroom, or suitor, offer the usual gifts… So he offers the equivalent in work.” Hosea sums up the bargain: “Israel served for a wife, and for a wife he kept sheep” ([[Hosea 12:12]]).

      The bride-price mattered to the bride. Rather than giving each daughter a dowry “derived at least in part from the bride price paid to the bride’s family,” Laban had “quite devoured” it, and Leah and Rachel were angry with him for it ([[Gen. 31:14–16]]). The later quarrel traces back to this bargain: the sisters say their father “hath sold us” ([[Gen. 31:15]]).
    sources: [ryle-genesis, olson-matriarchs, lds-scriptures]
  - ref: 20
    phrase: they seemed unto him but a few days
    kind: words
    title: A few days that were seven years
    body: |
      “A few days” is the phrase Rebekah used when she sent Jacob away. She told him to stay with Laban “a few days,” until Esau’s fury turned ([[Gen. 27:44]]), and the stay became twenty years ([[Gen. 31:41]]). The Hebrew is *yamim achadim* in both verses, “in the sense of ‘a short time,’” and Rebekah’s plan “was, in this respect, destined to be signally frustrated.” Jacob’s love, meanwhile, made seven of those years seem few: “for the love he had to her.”
    sources: [oshb-wlc, ryle-genesis, lds-scriptures]
  - ref: 23
    phrase: he took Leah his daughter
    kind: history
    title: How Jacob could not tell
    body: |
      The switch could work because the bride was brought in the evening, after a feast, and probably veiled. Laban “passed her off as his daughter Rachel; being veiled, the mistake was not discovered till after the marriage had taken place.” A bride could come veiled: Rebekah “took a vail, and covered herself” when she met Isaac ([[Gen. 24:65]]), and “veils most often indicated respectability,” so that Leah “was probably veiled for her wedding.” The text sets the scene in verse 22: Laban “gathered together all the men of the place, and made a feast,” and Leah is brought “in the evening.”

      Genesis reports Jacob’s dismay and says nothing of Leah’s. In one Latter-day Saint reading, Leah and Rachel were “pawns in their father’s strategy,” and “no mention is made of the women’s response.” Later the two sisters say together that Laban “hath sold us” ([[Gen. 31:14–15]]). Whether Leah had any say in it, Genesis does not tell.
    sources: [bd-leah, olson-matriarchs, lds-scriptures]
  - ref: 25
    phrase: wherefore then hast thou beguiled me
    kind: words
    title: 'Beguiled, and the trickster'
    body: |
      “Beguiled” is the word that sets Laban’s trick beside Jacob’s own, and the text leaves open what the echo is for. Jacob’s word for what Laban did and Isaac’s word for what Jacob did share a Hebrew root. “Beguiled” is *rimmitani*, from *ramah*, “beguile, deceive.” When Isaac learned that Jacob had received the blessing, he said that Jacob “came with subtilty” ([[Gen. 27:35]]), in Hebrew *bemirmah*, “treachery, craftiness,” a noun “from *ramah* in the sense of deceiving.” Laban’s excuse in the next verse adds a second echo. Its “younger” (*hatse‘irah*) is the word of the LORD’s answer to Rebekah, “the elder shall serve the younger” ([[Gen. 25:23]]). And “the firstborn” is the title Jacob had claimed before his father: “I am Esau thy firstborn” ([[Gen. 27:19]]).

      Read as comedy, the scene is poetic justice, in which Jacob “goes from being the trickster (in the Esau story) to being tricked.” That reading “seems to read Jacob’s experiences from back to front,” judging the earlier story by the later one, and “The text never states that such trials come as a result of divine retribution because of Jacob’s deceitful past.” Nor do the Church’s sources take Genesis 27 as a simple fraud: “The supposed deception of his father in obtaining the blessing… cannot be taken at face value” (see the notes at [[Gen. 27:13]] and [[Gen. 27:33]]). So the echo is in the words; the text does not say it is a judgment.
    sources: [lds-scriptures, bdb, strongs-concordance, oshb-wlc, schade-isaac-jacob, bd-jacob]
  - ref: 26
    phrase: to give the younger before the firstborn
    kind: history
    title: Laban’s rule about the younger
    body: |
      Laban defends the switch by appeal to a local custom he had not mentioned seven years before. “Laban’s excuse was specious, that it was necessary to conform to local customs, and that Jacob, as a stranger, did not know them.” If there was such a custom, he “should in decency and honour have explained the custom to Jacob before consenting to the marriage with the younger sister.” Genesis gives no other evidence of the rule, and Jacob does not dispute it: he finishes Leah’s week and agrees to seven more years (verses 27–28).
    sources: [ryle-genesis, lds-scriptures]
  - ref: 28
    phrase: he gave him Rachel his daughter to wife also
    kind: history
    title: Two wives, by a deception Jacob did not plan
    body: |
      Jacob did not plan two marriages. He asked for Rachel, received Leah by Laban’s trick, and then took Rachel as well. The order matters. Laban says, “Fulfil her week,” and after Leah’s wedding week Jacob received Rachel, with the seven further years of service still ahead (verses 27–30). In one reading this makes “two wives in eight days.” Jacob’s later words, “I served thee fourteen years for thy two daughters” ([[Gen. 31:41]]), look back over the whole.

      The Church’s position on plural marriage in biblical times is set out in the note on [[Gen. 16:3]]: latter-day revelation says that Isaac and Jacob “did none other things than that which they were commanded” ([[D&C 132:37]]).

      The story shows how hard these marriages were. Leviticus later forbids taking “a wife to her sister, to vex her” ([[Lev. 18:18]]). But in Jacob’s time “there was no positive law on the point in existence then.” The later law was meant “to prevent the evil effects of jealousy,” and that jealousy is what this household goes on to show ([[Gen. 30:1]]).
    sources: [keil-genesis, ryle-genesis, lds-scriptures]
  - ref: 31
    phrase: Leah was hated
    kind: words
    title: “Hated” means loved less
    body: |
      “Hated” here means loved less, as the two verses on either side show. Verse 30 says Jacob “loved also Rachel more than Leah”; verse 31 calls Leah *sene’uah*, “hated,” using the passive participle of *sane’*. The lexicon files the verse with Deuteronomy 21:15–17, where a man has two wives, “one beloved, and another hated,” and “hated” names a place in a household that the law protects: he “may not make the son of the beloved firstborn before the son of the hated, which is indeed the firstborn.” Leah uses the word of herself in verse 33.

      So the word describes Jacob’s preference and does not say that he treated Leah badly: “Though we have no reason to assume that Jacob treated Leah poorly… Regardless of the translation, the text indicates that Jacob preferred Rachel.” The text gives Leah’s side in her own words (verses 32–34); of Jacob’s it says only that he loved Rachel more.
    sources: [bdb, scripture-helps-gen-24-33, lds-scriptures]
  - ref: 32
    phrase: the LORD hath looked upon my affliction
    kind: scripture
    title: The affliction the LORD sees
    body: |
      Leah’s words use the language Genesis and Exodus use for what the LORD does for the afflicted. Hebrew *ra’ah be‘onyi*, “has looked on my affliction,” is listed with the same noun in other verses: Hagar is told that the LORD “hath heard thy affliction” ([[Gen. 16:11]]); Jacob will say, twenty years later, “God hath seen mine affliction and the labour of my hands” ([[Gen. 31:42]]); and the LORD says at the burning bush, “I have surely seen the affliction of my people” ([[Ex. 3:7]]). When Israel hears that the LORD “had looked upon their affliction,” they bow and worship ([[Ex. 4:31]]). Simeon’s name in verse 33 uses the paired verb, “heard.” Of Leah in particular: “Similar to Hagar’s experience, God showed His tender love and care for Leah in her difficult circumstances by blessing her with children.”

      The naming is a play on sound. *Reuben* is read as “see, a son” (*re’u ben*), which sounds like *ra’ah be‘onyi*; the name is explained by its sound, not by its strict derivation. [The God Who Sees, Hears, and Remembers](/genesis/themes/god-who-sees/)
    sources: [bdb, oshb-wlc, lds-scriptures, scripture-helps-gen-24-33, ryle-genesis]
  - ref: 35
    phrase: Now will I praise the LORD
    kind: structure
    title: From her husband to the LORD
    body: |
      Leah’s four naming speeches end with the LORD alone. In the first she names the LORD and “my husband” (verse 32). In the second she names the LORD and says she was hated (verse 33). In the third she names only her husband: “Now this time will my husband be joined unto me” (verse 34). The fourth names only the LORD and says nothing of Jacob: “Now will I praise the LORD” (verse 35). Her third speech and her fourth share one Hebrew word, *hapa‘am*, “this time,” which the KJV renders “Now this time” in verse 34 and “Now” in verse 35: this time her husband, this time the LORD.

      The names fit the speeches. *Levi* is read as “joined” (*lavah*), the word of her third hope; *Yehudah* sounds like *odeh*, “I will praise,” which the verse sets beside it. In one Latter-day Saint reading, the four names “may reflect her growing realization that the Lord’s grace and enduring love for her personally was compensation for any feelings of heartbreak or inferiority.” The shift is in the words of the text; what it shows of Leah’s heart is that reading’s suggestion.
    sources: [oshb-wlc, lds-scriptures, olson-matriarchs, ryle-genesis, bdb]

christ: |
  The line of the Savior runs through the son Leah named in praise. Matthew’s genealogy has “Jacob begat Judas and his brethren; And Judas begat Phares and Zara of Thamar” ([[Matt. 1:2–3]]); Hebrews says, “it is evident that our Lord sprang out of Juda” ([[Heb. 7:14]]); and in John’s vision He is “the Lion of the tribe of Juda” ([[Rev. 5:5]]). Jacob’s blessing takes up Leah’s word: “Judah, thou art he whom thy brethren shall praise” ([[Gen. 49:8]]). Judah came through Leah, the wife loved less, not through Rachel, and “through her son Judah, Leah was an ancestor of the kings of Israel and Judah from David until Jesus Christ.”

  The One who sees her is Jehovah, who “is the premortal Jesus Christ.” The Septuagint renders Leah’s “affliction” with the Greek *tapeinōsis*, the word Mary uses in her song: “he hath regarded the low estate of his handmaiden” ([[Luke 1:48]]).

explore: |
  - **Other wells.** [[Gen. 24:10–27]]; [[Ex. 2:15–21]]. KnoWhy #854 (Scripture Central) explains the type-scene through Ruth 2.
  - **Jacob and Laban afterward.** [[Gen. 30:25–43]]; [[Gen. 31:1–55]], where Jacob says that Laban “changed my wages ten times” ([[Gen. 31:7]]) and Leah and Rachel speak of their dowry ([[Gen. 31:14–16]]).
  - **The sons born in Haran.** [[Gen. 30:1–24]]; [[Gen. 35:16–26]]; Jacob’s blessings in [[Gen. 49:1–28]].
  - **Plural marriage.** [[Gen. 16:1–3]]; [[D&C 132:34–37]]; [[Jacob 2:27–30]].
  - **Judah.** [[Gen. 38:1–30]]; [[Gen. 49:8–12]].
  - **Hosea’s summary of Jacob’s years.** [[Hosea 12:12]].

