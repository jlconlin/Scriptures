chapter: 44
title: Let Thy Servant Abide Instead of the Lad
tagline: Joseph has his silver cup hidden in Benjamin’s sack, and the brothers come back to answer for it. Judah, who once proposed selling Joseph, steps forward and offers to be a servant in Benjamin’s place so that the boy can go home to his father.
when: 'The second year of the famine ([[Gen. 45:6]]), more than twenty years after Joseph was sold into Egypt. The text gives no year.'

setting: |
  Genesis 44 is the last scene in Joseph’s testing of his brothers. More than twenty years have passed since they sold him ([[Gen. 37:28]]). He now rules Egypt under Pharaoh ([[Gen. 41:40–44]]), and the famine has brought his brothers to him a second time. They still do not know who he is ([[Gen. 42:7–8]]). This time they have Benjamin with them, the youngest, whom Jacob let go only after Judah pledged himself for him ([[Gen. 43:8–9]]). They have just eaten at Joseph’s table ([[Gen. 43:31–34]]) and are on the road home.

  What follows reads as a test: Joseph “seemed to be giving his brothers opportunities to prove that they had changed and would not betray Benjamin as they had betrayed him.” The chapter has two halves. In the first (verses 1–17) Joseph’s silver cup is found in Benjamin’s sack, and Joseph says that only Benjamin need stay. In the second (verses 18–34) Judah, who had proposed selling Joseph ([[Gen. 37:26–27]]), speaks for all the brothers and offers to stay in Benjamin’s place.

  The weight of the chapter falls on Judah. Jacob will bless him as the one his brothers shall praise ([[Gen. 49:8–12]]), and Matthew names him in the line of Jesus Christ ([[Matt. 1:2–3, 16]]). Joseph’s answer comes in [[Gen. 45:1–3]].

thread: |
  Genesis 44 sets a trap and then shows what a man does inside it. Joseph hides his cup in the youngest brother’s sack, has the brothers overtaken on the road, and says that only the one with the cup need stay: “get you up in peace unto your father” (verse 17). The sequence reads as a test of whether the brothers will give up a favored son of Rachel as they gave up the first. Benjamin is again the favored son, and the others can again go home and tell their father a story.

  Judah’s speech is the answer, and it answers chapter 37 in three places. There the father’s love for one son bred hatred: “when his brethren saw that their father loved him more than all his brethren, they hated him” ([[Gen. 37:4]]). Here Judah says of Benjamin, “his father loveth him” (verse 20), and makes that the reason to spare him. There Jacob’s cry over the bloodied coat was “Joseph is without doubt rent in pieces” ([[Gen. 37:33]]); here Judah repeats Jacob’s words to Joseph’s face (verse 28). And the brother who said “let us sell him” ([[Gen. 37:27]]) now asks to be the servant himself: “let thy servant abide instead of the lad a bondman to my lord” (verse 33).

  Genesis does not say what changed Judah; it shows that he has changed. One reading looks to chapter 38, where Judah is himself deceived and made to see his fault ([[Gen. 38:25–26]]), as the possible cause, though the text does not say so. The chapter stops before Joseph answers; he does in [[Gen. 45:1–3]].

sections:
  - range: 1-6
    heading: The cup in the sack
    plain: |
      Joseph told his steward, “Fill the men’s sacks with as much food as they can carry, and put each man’s money in the top of his sack. Put my cup, the silver cup, in the top of the youngest one’s sack, along with his grain money.” The steward did as he was told. At daybreak the men were sent off with their donkeys. They had not gone far from the city when Joseph said to his steward, “Go after those men, and when you catch them, say, ‘Why have you repaid good with evil? Isn’t this the cup my lord drinks from and uses for divination? What you have done is wrong.’” The steward caught up with them and said these words to them.
  - range: 7-13
    heading: The search
    plain: |
      They answered, “Why does my lord say such things? Far be it from your servants to do that! We even brought back to you from Canaan the money we found in the tops of our sacks. How could we steal silver or gold from your master’s house? If any of your servants is found with it, he must die, and the rest of us will become my lord’s slaves.” “Very well,” he said, “let it be as you say: the one who is found with it will be my slave, and the rest of you will be free of blame.” Each man quickly lowered his sack to the ground and opened it. The steward searched, starting with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack. The brothers tore their clothes, loaded their donkeys, and went back to the city.
  - range: 14-17
    heading: Back before Joseph
    plain: |
      Judah and his brothers came to Joseph’s house, where he still was, and threw themselves on the ground in front of him. Joseph said, “What have you done? Didn’t you know that a man like me can find things out by divination?” Judah said, “What can we say to my lord? What can we speak? How can we prove ourselves innocent? God has found out the guilt of your servants. We are my lord’s slaves, all of us, and the one in whose possession the cup was found.” But Joseph said, “Far be it from me to do that. Only the man in whose possession the cup was found will be my slave. As for the rest of you, go up in peace to your father.”
  - range: 18-29
    heading: Judah’s account
    plain: |
      Judah stepped up to him. “My lord, please let your servant speak a word in my lord’s hearing, and do not be angry with your servant, for you are like Pharaoh himself. My lord asked his servants, ‘Do you have a father or a brother?’ We told my lord, ‘We have an old father, and a young son born to him in his old age. His brother is dead, and he is the only one left of his mother, and his father loves him.’ Then you said to your servants, ‘Bring him down to me so that I can see him for myself.’ We said to my lord, ‘The boy cannot leave his father; if he does, his father will die.’ But you said, ‘Unless your youngest brother comes down with you, you will not see my face again.’ When we went back to your servant my father, we told him what my lord had said. Later our father said, ‘Go back and buy us a little food.’ We said, ‘We cannot go down. If our youngest brother is with us, we will go, but we cannot see the man’s face unless our youngest brother is with us.’ Your servant my father said to us, ‘You know that my wife bore me two sons. One went away from me, and I said, “He must have been torn to pieces,” and I have not seen him since. If you take this one from me too, and harm comes to him, you will bring my gray head down to the grave in misery.’”
  - range: 30-34
    heading: Judah’s offer
    plain: |
      “So if I go back to your servant my father and the boy is not with us, since his own life is tied to the boy’s life, then when he sees that the boy is not with us, he will die, and your servants will have brought the gray head of our father down to the grave in sorrow. Your servant became responsible for the boy to my father, saying, ‘If I do not bring him back to you, I will bear the blame before you, my father, all my life.’ So now, please let your servant stay as my lord’s slave in place of the boy, and let the boy go back with his brothers. How can I go back to my father if the boy is not with me? I could not bear to see the misery that would come on my father.”

notes:
  - ref: 2
    phrase: put my cup, the silver cup, in the sack’s mouth of the youngest
    kind: history
    title: A test aimed at Benjamin
    body: |
      The cup in Benjamin’s sack is “part of Joseph’s test for his brothers,” and it puts them where they once failed. Genesis does not state Joseph’s purpose; it is read from what he does. The cup gives him grounds to accuse Benjamin, so that he “can test his brothers and see whether their attitudes toward his mother’s children have changed or whether they will abandon Benjamin to prison or death the way that they had abandoned Joseph.”

      The text shows how carefully it was built. At the meal the day before, Benjamin’s portion was “five times so much as any of theirs,” and the brothers “were merry with him” ([[Gen. 43:34]]). Now the money goes back into every sack, as it had on the first journey ([[Gen. 42:25]]; the brothers’ plea in verse 8 is that they had returned that money, [[Gen. 43:21]]), and the cup is added to the youngest man’s. The steward goes after them only when they are “gone out of the city, and not yet far off” (verse 4), after they have their grain and are on the way home. The test is not coldness. When Joseph first heard his brothers speak of their guilt, he “turned himself about from them, and wept” ([[Gen. 42:24]]), and the sight of Benjamin sent him looking for a place to weep: “he sought where to weep” ([[Gen. 43:30]]).
    sources: [scripture-helps-gen-42-50, gee-clothes-cups, lds-scriptures]
  - ref: 5
    phrase: whereby indeed he divineth
    kind: words
    title: Divining by a cup
    body: |
      The steward says that Joseph divines by the cup, and Joseph says it himself in verse 15 (“such a man as I can certainly divine”), but Genesis never says how, or whether, he did. The Hebrew verb is *nachash*, “practise divination, divine, observe signs”; the lexicon takes it here as divination “by means of cup,” “with implied power to learn secret things” in verse 15. It is also the verb the law uses when it forbids the practice ([[Lev. 19:26]]; [[Deut. 18:10]]), and divination, “any superstitious method of trying to discover the course of future events,” is “frequently condemned in scripture.” The KJV translates the same verb differently when Laban uses it: “I have learned by experience that the LORD hath blessed me for thy sake” ([[Gen. 30:27]]), where the lexicon reads “observe the signs or omens.”

      Egyptian texts do describe divining with a vessel. A papyrus of the third century A.D. has spells for “vessel-divination” in which a boy’s face is “bent down to this vessel” and a god is asked to “cause the eyes of this boy to be opened.” These texts “date long after Joseph’s time,” though “these practices are thought to be much older than the texts describing them.”

      What Joseph did, the Church leaves open: “The Genesis account does not provide enough details to know how Joseph used his silver cup.” Scripture condemns divination, but it also knows instruments such as “the Urim and Thummim, seer stones, rods, and the Liahona,” which “have been used for righteous purposes.” The cup “may have been used for righteous purposes,” or “it is also possible that Joseph only claimed he used the cup for divination as part of his ruse.” One Latter-day Saint reading takes the first way, with the cup as a means of revelation, “both seeing the future and seeing into the hearts of those around him.” Joseph’s own earlier words credit God with the interpreting of dreams: “Do not interpretations belong to God?” ([[Gen. 40:8]]); “It is not in me: God shall give Pharaoh an answer of peace” ([[Gen. 41:16]]).
    sources: [bdb, bd-divination, griffith-demotic-magical, gee-clothes-cups, scripture-helps-gen-42-50, lds-scriptures]
  - ref: 9
    phrase: With whomsoever of thy servants it be found, both let him die
    kind: history
    title: A vow, and a softened sentence
    body: |
      The brothers name the penalty themselves, and it is the harshest one: death for the thief and slavery for the rest. The vow is like Jacob’s at Laban’s search for the household gods, “With whomsoever thou findest thy gods, let him not live” ([[Gen. 31:32]]), which he made because he “knew not that Rachel had stolen them.” Here again the vow is made by men who do not know where the object is.

      The steward lowers the sentence: “he with whom it is found shall be my servant; and ye shall be blameless” (verse 10). He “mitigates their severity,” keeping the thief alive and letting the others go. In verse 17 Joseph holds to this milder sentence, and that is what lets him say that only one man need stay.
    sources: [ryle-genesis, lds-scriptures]
  - ref: 14
    phrase: Judah and his brethren came to Joseph’s house
    kind: history
    title: They go back together, and Judah leads
    body: |
      All the brothers come back with Benjamin, and Judah goes first. Nobody takes the road to Canaan. The brothers “rent their clothes,” as Reuben did at the empty pit and Jacob over the coat ([[Gen. 37:29]]; [[Gen. 37:34]]); each man loads his own donkey, and they return together. They have made this choice before Joseph has said a word to them. The offer that tests them further comes in verse 17.

      Judah’s place at the head is not new. When Jacob refused to send Benjamin, Reuben offered his own two sons as a pledge, and Jacob said no ([[Gen. 42:37–38]]). Judah then offered himself, “I will be surety for him; of my hand shalt thou require him,” and Jacob agreed ([[Gen. 43:9–11]]; see the note on [[Gen. 43:9]]). Judah “was a natural leader among the sons of Jacob,” and his answer in verse 16 is one of the places that shows it.
    sources: [bd-judah, lds-scriptures]
  - ref: 16
    phrase: God hath found out the iniquity of thy servants
    kind: history
    title: What iniquity has God found?
    body: |
      The iniquity that Judah says God has found out is most likely the old one, the sale of Joseph, and not the theft of the cup. The brothers know that they did not take the cup, yet Judah does not say so. On this reading he “confesses the wrong-doing of himself and his brothers”: “So mysterious a misfortune could only be explained as a Divine recompense for secret guilt.” The text supports it. On the first journey the brothers had said, “We are verily guilty concerning our brother… therefore is this distress come upon us” ([[Gen. 42:21]]), and when the money turned up in a sack, “What is this that God hath done unto us?” ([[Gen. 42:28]]).

      Genesis does not name the sin in verse 16, so this is a reading, though a well-founded one. Judah does not argue his case; he puts all of them under the sentence, Benjamin with the rest: “we are my lord’s servants, both we, and he also with whom the cup is found.”
    sources: [ryle-genesis, lds-scriptures]
  - ref: 17
    phrase: get you up in peace unto your father
    kind: history
    title: “God forbid,” and the way home
    body: |
      Joseph’s offer in verse 17 is the point where the test turns: the brothers may go home if they leave Benjamin behind. He begins with the brothers’ own word. “God forbid” has no “God” in it. The Hebrew *chalilah* is an exclamation the lexicon glosses “far be it (for me, thee, etc.),” and it is what the brothers cried in verse 7. Now Joseph says it: far be it from him to do what Judah offered in verse 16, to hold all of them. Only the man with the cup will stay, “and as for you, get you up in peace unto your father.”

      For ten men who have just offered to be slaves, this is release, at the price of one brother. They are free to go. But Jacob has said what it would mean if harm came to Benjamin: they would “bring down my gray hairs with sorrow to the grave” ([[Gen. 42:38]]). This is the choice the test was built to set before them: whether they would betray Benjamin as they had once betrayed Joseph. Judah’s speech is their answer.
    sources: [bdb, oshb-wlc, scripture-helps-gen-42-50, lds-scriptures]
  - ref: 18
    phrase: thou art even as Pharaoh
    kind: structure
    title: A speech built to move Joseph
    body: |
      Judah’s speech is a plea built to move Joseph, not a transcript of the earlier meetings. It opens with deference: “thou art even as Pharaoh,” and Joseph does hold Pharaoh’s power ([[Gen. 41:40–44]]). The speech falls into “two unequal divisions”: “a simple recapitulation of the story” (verses 18–31) and “his self-sacrificing offer of himself as a substitute for Benjamin” (31–34). The points it presses are Joseph’s own demand to see Benjamin, the old father’s unwillingness, the certainty that losing Benjamin would kill Jacob, and the offer.

      The retelling is shaped by that purpose. In chapter 42 Joseph had called the brothers spies and held Simeon ([[Gen. 42:9–24]]); Judah mentions neither. The brothers had told Joseph “one is not” ([[Gen. 42:13]]); Judah says “his brother is dead,” which “adds a most effective touch to the story.” And the protest in verse 22, “The lad cannot leave his father,” is not in chapter 42: “The expostulation here mentioned is not there recorded.” Genesis does not say that Judah invents anything, since it may have been said at the first meeting. It shows that Judah chooses what will move a listener.
    sources: [ryle-genesis, lds-scriptures]
  - ref: 20
    phrase: a child of his old age, a little one
    kind: words
    title: Benjamin has taken Joseph’s place
    body: |
      Judah describes Benjamin in the words Genesis used for Joseph, because Benjamin has taken Joseph’s place in Jacob’s heart. “A child of his old age” echoes Joseph’s description in [[Gen. 37:3]], “the son of his old age” (the Hebrew word *zequnim*, “old age,” is in both). Judah’s “he alone is left of his mother” repeats Jacob’s own “he is left alone” ([[Gen. 42:38]]), and Benjamin “had become Jacob’s favored son after Joseph was sold into slavery.” Judah’s last clause is “his father loveth him.” In chapter 37 the same Hebrew verb began the trouble: “when his brethren saw that their father loved him more than all his brethren, they hated him” ([[Gen. 37:4]]). Judah, a son of Leah, now offers the father’s love for Rachel’s son as the reason to spare him. He also repeats, without comment, Jacob’s “my wife bare me two sons” (verse 27), words in which Jacob “regards Rachel alone as his actual wife.”

      “A little one” is not an infant. The Hebrew *qatan* means “small, young,” and “especially of children, youth”; for a younger brother it is simply “youngest,” and the KJV translates a variant form of the same word “youngest” in verses 23 and 26. Nothing in this story gives Benjamin’s age; by one reckoning he was 23 or 24 when the family went down to Egypt.
    sources: [oshb-wlc, bdb, keil-genesis, scripture-helps-gen-42-50, bd-judah, lds-scriptures]
  - ref: 28
    phrase: Surely he is torn in pieces
    kind: scripture
    title: Judah tells Joseph about Joseph
    body: |
      Judah quotes Jacob’s words about Joseph to Joseph himself. “Surely he is torn in pieces” is Jacob’s verdict on the bloodied coat: “an evil beast hath devoured him; Joseph is without doubt rent in pieces” ([[Gen. 37:33]]), and the Hebrew uses the same doubled verb in both (*taroph toraph*). The coat was the brothers’ own work: they “killed a kid of the goats, and dipped the coat in the blood” ([[Gen. 37:31]]). Judah was among them, and now, without knowing who is listening, he hands the result back to Joseph in his father’s words: “I saw him not since.” The text does not describe Joseph’s face, but the next chapter opens with him unable to “refrain himself” ([[Gen. 45:1]]).
    sources: [oshb-wlc, lds-scriptures]
  - ref: 30
    phrase: his life is bound up in the lad’s life
    kind: words
    title: His soul is bound to his soul
    body: |
      The KJV’s “life” is the Hebrew *nephesh*, which means “soul” as well as “life,” and the clause reads literally “his soul is bound to his soul.” The lexicon files the word here under “life itself” and the verb *qashar*, “bind,” under “strong affection,” and the same figure describes Jonathan and David: “the soul of Jonathan was knit with the soul of David” ([[1 Sam. 18:1]]). So the verse is about love, not only dependence. Judah’s warning in verse 31, “he will die,” is about grief, which Judah had watched. After the coat came home, Jacob “mourned for his son many days” and “refused to be comforted” ([[Gen. 37:34–35]]). Judah’s whole argument is that Jacob will not live through it a second time.
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 32
    phrase: thy servant became surety for the lad unto my father
    kind: words
    title: Surety, and “bear the blame”
    body: |
      Judah’s offer rests on a pledge he had already made. “Surety” is the Hebrew *‘arab*, “go surety for the safety of” someone, and verse 32 repeats to Joseph the promise Judah made to Jacob: “I will be surety for him; of my hand shalt thou require him” ([[Gen. 43:9]]). The KJV’s “bear the blame” is a single Hebrew verb, *chata’*, “sin,” and the lexicon glosses the phrase “I shall incur the blame of sinning against thee all my days.” Judah is saying that to come home without Benjamin would be a sin against his father that no time would end. The note on [[Gen. 43:9]] has more on the pledge; for the other pledge in Judah’s life, the signet and staff he left with Tamar, and the same Hebrew root, see the note on [[Gen. 38:18]].
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 33
    phrase: let thy servant abide instead of the lad a bondman to my lord
    kind: christ
    title: Instead of the lad
    body: |
      Judah offers to become Joseph’s servant in Benjamin’s place, and the offer can remind us of the Savior: “As Judah offered to take Benjamin’s punishment so that Benjamin could return to his father, so Jesus Christ took our sins upon Himself so that we can return to our Heavenly Father.” Jesus Christ was also “Judah’s descendant” ([[Matt. 1:2–3, 16]]).

      The Hebrew word is the plain one for substitution. “Instead of” is *tachat*, “in place of, instead of,” and the lexicon lists this verse with the ram on Moriah, which Abraham offered “in the stead of his son” ([[Gen. 22:13]]; see the note there). [Judah](/genesis/themes/judah/)
    sources: [scripture-helps-gen-42-50, oshb-wlc, bdb, lds-scriptures]
  - ref: 34
    phrase: lest peradventure I see the evil that shall come on my father
    kind: structure
    title: A speech about a father
    body: |
      Judah’s speech ends where it has been aiming from the start, at Jacob. In the Hebrew of verses 18–34 the word “father” comes fourteen times and “the lad” seven. Judah’s last words are not about his own sentence but about the father: he could not bear to see what would come on him. He has said what he will give (verse 33) and now says why. He and his brothers “were determined to protect Benjamin to spare their father from the anguish of losing another son.” When Joseph can hold back no longer, his first words are on the same subject: “I am Joseph; doth my father yet live?” ([[Gen. 45:3]]).
    sources: [oshb-wlc, scripture-helps-gen-42-50, lds-scriptures]

christ: |
  Judah “became surety” for his brother (verse 32) and offers to stay “instead of the lad” (verse 33), so that Benjamin can go home to his father. The passage the Church points to beside these verses is Abinadi’s, in which the Son is “standing betwixt them and justice,” having “taken upon himself their iniquity and their transgressions” ([[Mosiah 15:9]]). The likeness has limits. Judah’s offer to be one brother’s servant was never put to the test, and he made it as the brother who once said “let us sell him” ([[Gen. 37:27]]). The Savior’s was carried out, “having redeemed them, and satisfied the demands of justice” ([[Mosiah 15:9]]).

explore: |
  - **Judah before and after.** Read [[Gen. 37:26–27]], then [[Gen. 38]], then [[Gen. 43:8–9]] beside this chapter. KnoWhy #841, “Why is the Judah and Tamar Story in the Middle of the Joseph Story?” (Scripture Central), follows the links between Judah’s two stories.
  - **What Joseph says next.** [[Gen. 45:1–15]] and, after Jacob’s death, [[Gen. 50:15–21]].
  - **Judah’s blessing.** [[Gen. 49:8–12]]; [[1 Chr. 5:2]].
  - **The surety.** Hezekiah’s prayer uses Judah’s verb of God ([[Isa. 38:14]]); the notes there and on [[Gen. 43:9]] follow the word further.
  - **The cup.** The Religious Studies Center chapter “Clothes and Cups: The Tangible World of Joseph” (in *From Creation to Sinai*) sets Joseph’s cup beside what is known of Egyptian cup divination.

