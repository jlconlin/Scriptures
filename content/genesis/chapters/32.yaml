chapter: 32
title: Jacob Wrestles at Peniel
tagline: Jacob comes home to the edge of Canaan, where angels meet him and word comes that Esau is coming to meet him with four hundred men. He prays, sends droves of animals ahead, and sends his family across the Jabbok. Left alone, he wrestles until dawn with a man who renames him Israel; he names the place Peniel, “face of God,” and limps away.
when: 'The return from Haran, twenty years after Jacob left Canaan ([[Gen. 31:41]]). The text gives no year.'

setting: |
  Jacob is coming home after twenty years in Laban’s house ([[Gen. 31:41]]), because the LORD said, “Return unto the land of thy fathers, and to thy kindred; and I will be with thee” ([[Gen. 31:3]]). He left because his brother Esau had said in his heart, “then will I slay my brother Jacob” ([[Gen. 27:41–45]]). Chapter 31 ends with the parting from Laban. Now Jacob stands at the border of the land, and the brother he has not seen since he left is coming to meet him.

  The chapter has six parts: angels at Mahanaim (verses 1–2), the news of Esau (3–8), Jacob’s prayer (9–12), the present for Esau (13–21), the crossing of the Jabbok (22–23), and the wrestle at Peniel (24–32). Here Jacob is given the name Israel; it is given again at Beth-el ([[Gen. 35:10]]), and it becomes the name of his descendants.

  Hosea looks back on this night ([[Hosea 12:3–5]]), and the Book of Mormon uses wrestling as a figure for mighty prayer ([[Enos 1:2]]; [[Alma 8:10]]); the note on verse 26 takes these up.

thread: |
  Genesis 32 turns on one Hebrew word, *panim*, “face.” In verse 20 Jacob, planning how to meet the brother he fled, uses it four times: he will “appease” (literally, “cover”) Esau’s face with a present that goes “before” his own face, “afterward I will see his face,” and perhaps Esau “will accept of me,” which in Hebrew is “will lift up my face.” The present itself passes over “before his face” (verse 21, which the KJV renders “before him”). That night, alone, Jacob meets another face. He names the place *Peniel*, “face of God,” “for I have seen God face to face” (verse 30). The next chapter finishes the thought. When Esau has run to meet him, Jacob says, “I have seen thy face, as though I had seen the face of God” ([[Gen. 33:10]]).

  The order of events carries the chapter’s argument. Jacob first does everything he can to prepare for Esau: he sends messengers, prays, and sends droves of animals ahead. Only after all of that is he left alone, and the wrestle begins. The text does not explain the order, but the experience “confirmed for Jacob the Lord’s promises and helped prepare him to meet his brother.”

  With the face come a name and a blessing. Asked, “What is thy name?” Jacob (“supplanter”) says “Jacob,” and is given “Israel.” He will not let the man go “except thou bless me” (verse 26), and the man “blessed him there” (verse 29).

sections:
  - range: 1-2
    heading: The camp of God at Mahanaim
    plain: |
      Jacob went on his way, and angels of God met him. When he saw them he said, “This is God’s camp!” and he named that place Mahanaim.
  - range: 3-8
    heading: News of Esau
    plain: |
      Jacob sent messengers ahead to his brother Esau in the land of Seir, the country of Edom. He told them to say, “Your servant Jacob says: I have lived with Laban until now. I have cattle, donkeys, flocks, and servants, and I am sending this message to my lord so that I may find favor with you.” The messengers came back and said, “We went to your brother Esau, and he is coming to meet you with four hundred men.” Jacob was terrified and distressed. He divided the people with him, and the flocks, herds, and camels, into two camps, thinking, “If Esau attacks one camp, the other can escape.”
  - range: 9-12
    heading: Jacob’s prayer
    plain: |
      Jacob prayed, “God of my father Abraham and God of my father Isaac, Lord, who told me, ‘Go back to your country and your relatives, and I will make you prosper’: I am not worthy of all the kindness and faithfulness you have shown your servant. I crossed this Jordan with only my staff, and now I have become two camps. Save me, I pray, from my brother Esau, for I am afraid he will come and strike me down, mothers and children together. You said, ‘I will surely make you prosper, and I will make your descendants like the sand of the sea, too many to count.’”
  - range: 13-21
    heading: The present for Esau
    plain: |
      Jacob stayed there that night and chose from what he had a present for Esau: two hundred female goats and twenty male goats, two hundred ewes and twenty rams, thirty nursing camels with their young, forty cows and ten bulls, twenty female donkeys and ten foals. He put them in the hands of his servants, drove by drove, and told them, “Go on ahead of me, and leave a space between the droves.” He told the first, “When my brother Esau meets you and asks, ‘Whose are you, where are you going, and whose animals are these?’ say, ‘They belong to your servant Jacob. They are a present sent to my lord Esau, and Jacob himself is right behind us.’” He gave the same instructions to the second, the third, and all who followed the droves: “Say this to Esau when you meet him, and add, ‘Your servant Jacob is right behind us.’” For he thought, “I will appease him with the present going ahead of me, and afterward I will see his face; perhaps he will receive me.” So the present went on ahead of him, and Jacob spent that night in the camp.
  - range: 22-23
    heading: Across the Jabbok
    plain: |
      That same night Jacob got up and took his two wives, his two maidservants, and his eleven sons, and crossed the Jabbok at the ford. He took them and sent them across the stream, and sent over everything he had.
  - range: 24-32
    heading: The wrestle at Peniel
    plain: |
      Jacob was left alone, and a man wrestled with him until daybreak. When the man saw that he could not overpower Jacob, he touched the socket of Jacob’s hip, and Jacob’s hip was put out of joint as they wrestled. The man said, “Let me go, for it is daybreak.” Jacob said, “I will not let you go unless you bless me.” The man asked, “What is your name?” “Jacob.” Then he said, “Your name will no longer be Jacob but Israel, because you have striven with God and with men and have prevailed.” Jacob asked, “Please tell me your name.” The man said, “Why do you ask my name?” and he blessed him there. Jacob named the place Peniel, saying, “I have seen God face to face, and my life has been spared.” The sun rose as he passed Penuel, and he was limping because of his hip. That is why the Israelites to this day do not eat the sinew of the hip socket: the man touched Jacob’s hip socket at the sinew.

notes:
  - ref: 2
    phrase: This is God’s host
    kind: words
    title: Two camps at Mahanaim
    body: |
      The name Mahanaim means “two camps,” and the Hebrew word for camp, *machaneh*, comes back through the chapter. “God’s host” is literally “the camp of God.” The “angels of God” in verse 1 are the same Hebrew phrase (*mal’akhei Elohim*) as the angels Jacob saw ascending and descending the ladder at Beth-el ([[Gen. 28:12]]), where the LORD promised to “bring thee again into this land” ([[Gen. 28:15]]). The angels were likely a reminder of that vision, and “a sign and a reminder of divine protection and assistance” before the meeting with Esau.

      Then Jacob uses the word himself. He divides his people “into two bands” (verse 7), speaks of “the one company” (verse 8), prays “now I am become two bands” (verse 10), and spends the night “in the company” (verse 21). The Hebrew is the same word each time, *machaneh*, and the two bands of verses 7 and 10 are literally “two camps.” The text does not say the echo is intended. The next verse repeats a different word: the “messengers” Jacob sends to Esau (verse 3) are *mal’akhim*, the same noun as “angels.” The noun has both senses: “one sent with a message” (verse 3) and “angel, as messenger of God” (verses 1–2).
    sources: [biblehub-interlinear, bdb, skinner-jacob-presence, lds-scriptures]
  - ref: 4
    phrase: my lord Esau
    kind: history
    title: “My lord Esau,” “thy servant Jacob”
    body: |
      In his messages Jacob takes the lower place. Three times he calls Esau “my lord” (verses 4, 5, 18) and three times calls himself Esau’s “servant” (verses 4, 18, 20). That is the reverse of what the family had been told. The LORD said to Rebekah before the twins were born that “the elder shall serve the younger” ([[Gen. 25:23]]); Isaac’s blessing said, “be lord over thy brethren” ([[Gen. 27:29]]); and he told Esau, “I have made him thy lord” ([[Gen. 27:37]]). The text does not explain why Jacob speaks as he does; his messages were sent “in hopes of laying the groundwork for a peaceful reunion with his brother.” When the brothers meet, Jacob bows to the ground seven times ([[Gen. 33:3]]), and the text lets the contrast stand without comment.
    sources: [lds-scriptures, skinner-jacob-presence]
  - ref: 6
    phrase: four hundred men
    kind: history
    title: Esau, Seir, and four hundred men
    body: |
      Genesis does not say why Esau is coming with four hundred men, and Jacob’s fear rests on what he remembers. Esau had settled in Mount Seir and “was living there on Jacob’s return”: the messengers find him in “the land of Seir, the country of Edom” (verse 3; literally “the field of Edom”). What Jacob knew of Esau’s mind was the threat Rebekah had reported to him: “then will I slay my brother Jacob” ([[Gen. 27:41–43]]).

      To Jacob more than his own life seemed to be at stake: “In Jacob’s mind, his family, as well as the covenant itself, faced annihilation.” What happened when they met is told in [[Gen. 33:4]].
    sources: [biblehub-interlinear, bd-esau, skinner-jacob-presence, lds-scriptures]
  - ref: 9
    phrase: the LORD which saidst unto me, Return unto thy country
    kind: words
    title: Jacob prays God’s words back to Him
    body: |
      The prayer is built from what God has already said to Jacob. Twice Jacob recalls what God said to him (verses 9, 12). The command to return is in [[Gen. 31:3]] and [[Gen. 31:13]]. “I will deal well with thee” and “I will surely do thee good” are not word for word in the earlier promises, which said “I will be with thee” ([[Gen. 31:3]]) and “will bring thee again into this land” ([[Gen. 28:15]]). The figure of the seed as “the dust of the earth” was given to Jacob at Beth-el ([[Gen. 28:14]]); the “sand which is upon the sea shore” was the LORD’s figure to Abraham ([[Gen. 22:17]]).

      The fear in the petition is stark: “lest he will come and smite me, and the mother with the children” (verse 11) is, in one reading, “a proverbial expression for unsparing cruelty, taken from the bird which covers its young to protect them.” That is why the reminder of the promise matters: “How could this promise come to pass if Jacob and his family were annihilated?”
    sources: [biblehub-interlinear, lds-scriptures, keil-genesis, skinner-jacob-presence]
  - ref: 10
    phrase: I am not worthy of the least of all the mercies
    kind: words
    title: Too small for all the kindnesses
    body: |
      In Hebrew Jacob says he is too small for all of God’s kindness; the word “least” is not there. *Qatonti* means “I am too insignificant for all the kindnesses,” and Jacob adds “and all the faithfulness” (*chasadim… emet*). Kindness and faithfulness, “mercy and faithfulness,” are a pair used of God; it is the pair Abraham’s servant blessed God for at the well, “his mercy and his truth” ([[Gen. 24:27]]).

      Jacob then measures what has come to him: “with my staff I passed over this Jordan; and now I am become two bands.” He had crossed the Jordan the other way with only a staff, and twenty years in Laban’s house ([[Gen. 31:41]]) lie between. Now he is, literally, “two camps” (see the note on verse 2).
    sources: [biblehub-interlinear, bdb, lds-scriptures]
  - ref: 20
    phrase: I will appease him with the present
    kind: words
    title: Covering a face
    body: |
      “Appease” translates a Hebrew verb that means “cover,” and what Jacob means to cover is a face. The verb is *kapar*; here it means “let me cover his face by the present,” so “that he does not see the offence,” that is, to pacify him. The verse ends, in Hebrew, with Esau lifting up Jacob’s face, and to lift up someone’s face is “to receive him in a friendly manner.” The present is large, 550 animals besides the camels’ colts, sent in droves with space between them, which, in one reading, “was to serve the purpose of gradually mitigating the wrath of Esau.” The face-words of this verse return at Peniel (see the thread).
    sources: [biblehub-interlinear, bdb, keil-genesis]
  - ref: 24
    phrase: a man
    kind: history
    title: Who wrestled with Jacob?
    body: |
      The text calls the wrestler “a man,” and his identity is left open: “It is unclear who the man was. Some think he was an angel, while others suggest he was a mortal messenger sent from God. The Hebrew word used for the man in these verses supports both possibilities and could even refer to God Himself.” The text itself uses several names. The narrator says *ish*, “man.” Hosea looks back and says Jacob “had power over the angel, and prevailed,” and goes on, “he found him in Beth-el, and there he spake with us; Even the Lord God of hosts” ([[Hosea 12:4–5]]), moving from “the angel” to “the Lord God of hosts” without marking a change of person. Jacob names the place “for I have seen God face to face” (verse 30). Later, blessing Joseph’s sons, he speaks of “the Angel which redeemed me from all evil” ([[Gen. 48:16]]), which one Latter-day Saint scholar takes as a reference to this night. The Hebrew lexicon lists that verse and Hosea’s “angel” ([[Hosea 12:4]]) together under “the theophanic angel” (the angel in whom God appears).

      The visitor also refuses to give his name (verse 29), as the angel of the LORD does to Manoah: “Why askest thou thus after my name, seeing it is secret?” ([[Judg. 13:18]]).

      Faithful readers have taken the passage differently. President Joseph Fielding Smith thought it “more than likely… a messenger sent to Jacob to give him the blessing.” The word *ish* is “the same word… used elsewhere to denote divine messengers.” Another reading reasons from the all-night wrestle and the dislocated hip that the visitor had a tangible body. It weighs two possibilities: a translated being, or, as more likely, God the Father, since Jehovah “did not yet possess a physical body.” These are readings, not Church doctrine, and the Church’s newest statement does not choose among them.
    sources: [scripture-helps-gen-24-33, lds-scriptures, bdb, biblehub-interlinear, ot-manual-gen-24-36, skinner-jacob-presence]
  - ref: 25
    phrase: he touched the hollow of his thigh
    kind: symbol
    title: Prevailing and limping
    body: |
      In one verse Jacob prevails and is lamed. The man “saw that he prevailed not against him,” yet he touches Jacob’s hip and puts it out of joint, and Jacob still does not let go: the demand for a blessing comes after the injury ([[Gen. 32:26]]). The injury has been read as a reason to think the wrestle “was physical as well as spiritual, because the text is emphatic in its description of Jacob’s dislocated hip.”

      What the injury means, the text does not say. In one reading, Jacob had until now wrestled “for God against man” with “the power of the flesh,” and the touch on his hip declared that “the carnal nature of his previous wrestling was… powerless and wrong,” so that he prevailed “by the power of faith and prayer.” The same reading takes the night as God’s answer to Jacob’s prayer of verses 9–12: “To save him from the hand of his brother, it was necessary that God should first meet him as an enemy, and show him that his real opponent was God Himself.” In verse 31 the sun rises on him and “he halted upon his thigh.”
    sources: [keil-genesis, skinner-jacob-presence, lds-scriptures]
  - ref: 26
    phrase: I will not let thee go, except thou bless me
    kind: scripture
    title: Wrestling as prayer
    body: |
      Scripture itself reads the wrestle as prayer. Hosea says of Jacob, “he had power over the angel, and prevailed: he wept, and made supplication unto him” ([[Hosea 12:4]]). What Jacob asks for is a blessing, not a victory.

      The Book of Mormon uses the same image for prayer. Enos tells of “the wrestle which I had before God, before I received a remission of my sins” ([[Enos 1:2]]), and Alma “labored much in the spirit, wrestling with God in mighty prayer” ([[Alma 8:10]]). “Other men and women in every dispensation have had to wrestle at some point in their lives for blessings, greater truth, and light from God.” Enos’s “wrestle… before God” has also been read as an allusion to Jacob’s wrestle at Peniel (in Hebrew, “before” is “to the face of”). That is a proposal, and Enos himself does not mention Jacob.
    sources: [lds-scriptures, skinner-jacob-presence, bowen-wrestled-man]
  - ref: 27
    phrase: What is thy name? And he said, Jacob
    kind: words
    title: Saying his own name
    body: |
      Asked his name, Jacob answers with the name his brother had turned into an accusation. Jacob (*Ya‘aqov*) is tied to “heel” from birth: “his hand took hold on Esau’s heel; and his name was called Jacob” ([[Gen. 25:26]]). When he took the blessing, Esau said, “Is not he rightly named Jacob? for he hath supplanted me these two times” ([[Gen. 27:36]]). The name means “Supplanter,” and “in Hebrew the name can be associated with the idea of replacing another by deception.”

      Three words in the scene sound alike in Hebrew: *Ya‘aqov* (Jacob), *Yabboq* (the Jabbok), and *ye’aveq* (“wrestled”), a play on “Jacob” that runs through verses 22–24. He answers with the name that recalls the heel and the supplanting, and the man gives him a new one.
    sources: [lds-scriptures, bd-jacob, scripture-helps-gen-24-33, biblehub-interlinear, bowen-wrestled-man]
  - ref: 28
    phrase: Israel
    kind: words
    title: Israel, “striven with God” or “let God prevail”
    body: |
      The name Israel is explained in the verse, and the Church’s sources hold two meanings together. The KJV says “as a prince hast thou power with God.” The Hebrew verb is *sarah*, “persist, exert oneself, persevere,” and the verse reads, word for word, you have striven with God and with men, and you have prevailed. Hosea uses the same verb of Jacob ([[Hosea 12:3–4]]). The name itself means “El persisteth, persevereth (or jussive Let El persist),” that is, “may God persist.”

      Both senses are in the Church’s own definition: “One who prevails with God or Let God prevail.” President Nelson took up the second. He reported, “With the help of two Hebrew scholars, I learned that one of the Hebraic meanings of the word Israel is ‘let God prevail,’” and said of this night that Jacob “demonstrated that he was willing to let God prevail in his life. In response, God changed Jacob’s name to Israel.” So the name can be read as Jacob’s achievement (“you have prevailed”) and as his surrender (“let God prevail”); the Church’s sources use both. Either way, the new name “represented Jacob’s personal transformation.”
    sources: [bdb, biblehub-interlinear, bd-israel, nelson-let-god-prevail, scripture-helps-gen-24-33, lds-scriptures]
  - ref: 30
    phrase: Peniel
    kind: words
    title: Peniel, and a life delivered
    body: |
      *Peniel* means “face of God.” Verse 31 spells the place *Penuel*, another form of the same name. The name answers the face-words of verse 20 (see the thread).

      Jacob’s words here also take up a word from his prayer. He had asked, “Deliver me” (*hatsileni*) “from the hand of my brother” (verse 11). Here he says, “my life is preserved,” literally “my soul has been delivered” (*wattinnatsel nafshi*). Both are forms of the one verb, *natsal*, “deliver.” What the blessing given “there” (verse 29) contained is not recorded: “The text is silent about the nature of the additional blessing.”
    sources: [bdb, bd-peniel, biblehub-interlinear, skinner-jacob-presence]
  - ref: 30
    phrase: I have seen God face to face
    kind: scripture
    title: Seeing God and living
    body: |
      Jacob’s words seem to contradict what the LORD later told Moses, and revelation offers a way to read the two together. The LORD said to Moses, “Thou canst not see my face: for there shall no man see me, and live” ([[Ex. 33:20]]), yet the same chapter says “the Lord spake unto Moses face to face, as a man speaketh unto his friend” ([[Ex. 33:11]]). The Joseph Smith Translation adds a qualification to Exodus 33:20: “no sinful man hath at any time, neither shall there be any sinful man at any time, that shall see my face and live.” And Moses says of his own vision, “my natural eyes could not have beheld; for I should have withered and died in his presence; but his glory was upon me; and I beheld his face, for I was transfigured before him” ([[Moses 1:11]]).

      In these texts no sinful person can see God’s face and live, and Moses saw it only because God’s glory was upon him and he was transfigured. Jacob’s “my life is preserved” says he knew how unusual his experience was. Who the visitor was is a separate question (see the note on verse 24).
    sources: [lds-scriptures, jst-ex-33]
  - ref: 32
    phrase: Therefore the children of Israel eat not of the sinew which shrank
    kind: history
    title: The sinew, and the first “children of Israel”
    body: |
      The chapter closes with a practice kept “unto this day”: the people do not eat the sinew of the thigh. The Hebrew *gid* is a “sinew,” here “of thigh”; in one reading it is the sciatic nerve, “the principal nerve in the neighbourhood of the hip.” The verse gives its reason in the story: the man touched it.

      This is also where the phrase “the children of Israel” first appears in the Bible (Hebrew *bene Yisra’el*; the next place is [[Gen. 36:31]]). The name given in verse 28 becomes the name of a people within a few verses, a name that “also applies to his descendants and to their kingdom,” and the first thing said of them is that they keep this custom.
    sources: [bdb, keil-genesis, oshb-wlc, bd-israel]

christ: |
  Jacob prays to “the God of my father Abraham, and God of my father Isaac” (verse 9), the God the Book of Mormon names as the one who would be “lifted up” and crucified ([[1 Ne. 19:10]]; see [[Gen. 26:24]]). The chapter’s other link to the Savior is in one word. The verb Jacob uses to “appease” Esau, *kapar*, “cover” (see the note on verse 20), is also the Hebrew verb of atonement: it is used of the priest who “shall make the atonement” ([[Lev. 16:32]]), and with God as the subject it expresses the thought that “God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.” Atonement is “the setting ‘at one’ of those who have been estranged.”

  Verse 20 has also been read as “I will atone his face” and set beside Jacob’s words after the reconciliation, “I have seen thy face, as though I had seen the face of God” ([[Gen. 33:10]]), and beside Enos, who after his own wrestle looks to the day he will stand before “my Redeemer” and “see his face with pleasure” ([[Enos 1:27]]). That is one scholar’s reading, not a Church teaching.

explore: |
  - **Hosea’s reading.** Read [[Hosea 12:2–6]] beside verses 24–30.
  - **Enos’s wrestle.** [[Enos 1:1–8]], then [[Enos 1:27]].
  - **The meeting.** [[Gen. 33:1–11]], and the name Israel given again at [[Gen. 35:9–15]].
  - **Jacob’s own summary.** [[Gen. 48:15–16]], and [[D&C 132:37]] on Jacob among the exalted.
  - **“Let God Prevail.”** President Nelson’s talk (general conference, October 2020) on the name Israel.
  - **An especially good essay.** “Jacob in the Presence of God” (Religious Studies Center, *Sperry Symposium Classics: The Old Testament*) follows the whole of Jacob’s life from Beth-el to the Jabbok.

