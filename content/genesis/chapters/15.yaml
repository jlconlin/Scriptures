chapter: 15
title: The Covenant between the Pieces
tagline: Still childless, Abram asks what God’s promises are worth. God shows him the stars, Abram believes, and when he asks how he can know the land will be his, God makes a covenant with him in the old way, passing alone as fire between the halves of the animals.
when: 'After the battle of the kings in chapter 14, and before Sarai gives Hagar to Abram “after Abram had dwelt ten years in the land of Canaan” ([[Gen. 16:3]]). Abram had arrived at seventy-five ([[Gen. 12:4]]). The text gives no year.'

setting: |
  The Lord had already promised Abram a great nation, the land, and a blessing for all families of the earth ([[Gen. 12:1–3]]; [[Gen. 13:14–17]]). Years had passed and Abram still had no child. Chapter 14 had just shown him rescuing Lot from four kings, receiving Melchizedek’s blessing, and refusing any reward from the king of Sodom ([[Gen. 14:14–24]]). Now “the word of the LORD” comes to him in a vision.

  The chapter has two scenes, each opened by a question from Abram: the promise of a son under the night sky (verses 1–6), and the covenant for the land, made at sunset and in the dark (verses 7–21). In the story of the covenant, this is where God “formally initiates that relationship”; chapter 17 expands it, with new names and circumcision, and chapter 22 confirms it by oath ([[Gen. 17:1–8]]; [[Gen. 22:16–18]]).

  Later scripture comes back to this chapter. Paul and James build on verse 6 ([[Rom. 4:3]]; [[Gal. 3:6]]; [[James 2:23]]). Nehemiah’s prayer retells it: God found Abram’s heart “faithful” (*ne’eman*, from the same root as “believed” in verse 6), made a covenant to give him the land, “and hast performed thy words; for thou art righteous” ([[Neh. 9:7–8]]). And Joseph Smith’s revision adds verses in which Abram learns of the Resurrection and sees the days of the Son of Man.

thread: |
  Abram asks God two questions, and each gets an answer he can see. The first is “what wilt thou give me, seeing I go childless?” (verse 2). God takes him outside and shows him the stars: “So shall thy seed be” (verse 5). The second is “whereby shall I know that I shall inherit it?” (verse 8). This time God answers with a covenant ceremony: the animals are cut in two, and fire passes between the pieces (verses 9–17).

  Between the two questions stands the verse the rest of scripture remembers: “he believed in the LORD; and he counted it to him for righteousness” (verse 6). The chapter does not set that faith against action. Abram believes, then does what he is told with the animals, and God answers by making a covenant with him. In one reading this is how God “reckoned Abram’s faith to him as righteousness, by making a covenant with him.”

  The surprise is who binds himself. In the old covenant rite the parties walked between the halves of the slain animals, but here Abram is asleep, and only the smoking furnace and burning lamp pass through. God alone takes the oath, and He gives Abram the land in the past tense (“have I given,” verse 18) even though Abram’s seed must first be strangers and slaves for four hundred years.

sections:
  - range: 1-6
    heading: The promise of a son
    plain: |
      After these events the word of the Lord came to Abram in a vision: “Do not be afraid, Abram. I am your shield. Your reward will be very great.” But Abram said, “Lord God, what will you give me, when I am still childless, and the heir of my house is Eliezer of Damascus? You have given me no children, so a servant of my household will be my heir.”

      Then the word of the Lord came to him: “This man will not be your heir. A son from your own body will be your heir.” He brought Abram outside and said, “Look up at the sky and count the stars, if you can count them. So many will your descendants be.” Abram believed the Lord, and the Lord counted it to him as righteousness.
  - range: 7-11
    heading: The covenant prepared
    plain: |
      The Lord said to him, “I am the Lord, who brought you out of Ur of the Chaldeans to give you this land to inherit.” Abram asked, “Lord God, how can I know that I will inherit it?” The Lord said, “Bring me a heifer, a female goat, and a ram, each three years old, and a turtledove and a young pigeon.” Abram brought them all, cut the animals in half, and laid each half opposite the other, but he did not cut the birds in half. When birds of prey came down on the carcasses, Abram drove them away.
  - range: 12-16
    heading: The prophecy in the dark
    plain: |
      As the sun was going down, a deep sleep fell on Abram, and a great and terrifying darkness came over him. The Lord said to him, “Know for certain that your descendants will be strangers in a land that is not theirs. They will be slaves there and will be oppressed for four hundred years. But I will judge the nation they serve, and afterward they will come out with great wealth. As for you, you will go to your fathers in peace and be buried at a good old age. In the fourth generation your descendants will come back here, because the wickedness of the Amorites has not yet reached its full measure.”
  - range: 17-21
    heading: The covenant made
    plain: |
      When the sun had set and it was dark, a smoking firepot and a flaming torch passed between the pieces. That day the Lord made a covenant with Abram: “To your descendants I have given this land, from the river of Egypt to the great river, the Euphrates: the land of the Kenites, the Kenizzites, the Kadmonites, the Hittites, the Perizzites, the Rephaim, the Amorites, the Canaanites, the Girgashites, and the Jebusites.”

notes:
  - ref: 1
    phrase: the word of the LORD came unto Abram in a vision
    kind: words
    title: The word of the LORD came
    body: |
      This is the first time the Bible says that “the word of the LORD came” to anyone. The phrase is “a technical expression in the O.T. for a Divine revelation to a prophet,” and outside this chapter it occurs nowhere else in the five books of Moses. It treats Abram as a prophet, and God Himself later calls him one: “he is a prophet, and he shall pray for thee” ([[Gen. 20:7]]).

      The revelation comes “in a vision” (*bammachazeh*), and it ends in a deep sleep (verse 12).
    sources: [ryle-genesis, oshb-wlc, biblehub-interlinear, lds-scriptures]
  - ref: 1
    phrase: I am thy shield, and thy exceeding great reward
    kind: words
    title: Shield and reward
    body: |
      God’s first words answer the chapter before. By the war with the eastern kings Abram had made “powerful enemies,” and God calls Himself his shield (*magen*), the noun behind the verb Melchizedek had just used for the God who “delivered thine enemies into thy hand” ([[Gen. 14:20]]; see the thread of chapter 14).

      “Reward” is *sakar*, “hire, wages,” used of reward “for work done, faithfulness.” Abram had just refused the king of Sodom’s spoils: “I will not take from a thread even to a shoelatchet” ([[Gen. 14:23]]). Now God speaks of Abram’s wages. The Hebrew can be read two ways: as the KJV has it, with God Himself as the reward, or as “thy reward shall be exceeding great,” the reading the Septuagint follows (“thy reward shall be very great”). Either way, Abram asks at once what God will give him while he has no child.
    sources: [ellicott-genesis, biblehub-interlinear, bdb, ryle-genesis, lxx-rahlfs, lds-scriptures]
  - ref: 2
    phrase: the steward of my house is this Eliezer of Damascus
    kind: history
    title: An heir from the household
    body: |
      Without a son, Abram’s estate would pass to a member of his household, and the customs of his world allowed for that. The Hebrew for “steward” is unusual: *ben-mesheq*, “son of possession,” a word whose meaning is “conjectured from context.” It may have been chosen for its sound beside *Dammeseq*, “Damascus.” In verse 3 the “one born in my house” is literally “a son of my house.”

      Probably Eliezer “was a servant who was legally adopted as Abraham’s son.” Adopting an heir “was a legitimate practice of the time.” The Babylonian law code of Hammurabi, from “shortly after Abraham’s time,” provides for a man who adopted a son and later had children of his own: if he wished “to put this adopted son out, then this son shall not simply go his way.” The father had to give him “one-third of a child’s portion” of his wealth.

      So God’s answer, “This shall not be thine heir,” turns aside an heir that custom would have accepted. The next chapter tries another custom, when Sarai gives Abram her maid Hagar ([[Gen. 16:1–3]]), and Ishmael then “superseded him as heir.” Neither is the son God means. The heir must be “he that shall come forth out of thine own bowels” (verse 4), and in time God makes clear that it will be Sarah’s son ([[Gen. 17:19]]).
    sources: [biblehub-interlinear, bdb, sc-knowhy-838, hammurabi-king, lds-scriptures]
  - ref: 5
    phrase: tell the stars, if thou be able to number them
    kind: scripture
    title: Counting the stars
    body: |
      God answers a childless man by taking him outside at night and giving him something to look at: the stars are “a visual demonstration or sign of the promise of progeny.” Paul makes these words the measure of Abraham’s faith: he “against hope believed in hope, that he might become the father of many nations, according to that which was spoken, So shall thy seed be” ([[Rom. 4:18]]). How the promise grows from dust to stars to sand is at [[Gen. 13:16]].
    sources: [hopkin-covenant, lds-scriptures]
  - ref: 6
    phrase: he believed in the LORD
    kind: christ
    title: What Abram saw
    body: |
      Joseph Smith’s revision answers a question Genesis leaves open: what Abram believed, and how a man who would die owning none of the land could still inherit it. Just before “he believed in the LORD,” it adds three verses. Abram asks, “Lord God, how wilt thou give me this land for an everlasting inheritance?” The Lord answers with the Resurrection: “if thou shalt die, yet thou shalt possess it, for the day cometh, that the Son of Man shall live; but how can he live if he be not dead? he must first be quickened.” Then “Abram looked forth and saw the days of the Son of Man, and was glad, and his soul found rest, and he believed in the Lord; and the Lord counted it unto him for righteousness” (JST Gen. 15:9–12).

      Other scripture says the same of Abraham. Jesus told His critics, “Your father Abraham rejoiced to see my day: and he saw it, and was glad” ([[John 8:56]]), and the wording of the revision suggests that Jesus was speaking of this vision. The Book of Mormon says it too: “Abraham saw of his coming, and was filled with gladness and did rejoice” ([[Hel. 8:17]]). So the land promise was “not limited to Israel inheriting Canaan after the Exodus, but was also an individual promise to Abram that would be fulfilled in eternity,” and it rests on the Savior’s own rising from the dead. The notes at [[Gen. 13:15]] and [[Gen. 17:8]] follow that everlasting inheritance further.
    sources: [jst-gen-15, parker-cutting, lds-scriptures]
  - ref: 6
    phrase: he counted it to him for righteousness
    kind: scripture
    title: Faith counted as righteousness
    body: |
      This is the first time the noun “righteousness” (*tsedaqah*) appears in the Bible, and it is tied to faith. Noah had been called “just” (*tsaddiq*, [[Gen. 6:9]]), but here for the first time someone is counted righteous. “Believed” is *he’emin*, from a root meaning to confirm or support; with God as its object it means “trust in, believe in.” “Counted” is *chashav*, to “think, account.” The Hebrew verb says only “he reckoned it”; the Joseph Smith Translation names who did the counting: “the Lord counted it unto him for righteousness.”

      The New Testament draws two lessons from this one verse. Paul notes that it was said of Abraham before he was circumcised, “Not in circumcision, but in uncircumcision” ([[Rom. 4:9–10]]), so that “they which are of faith, the same are the children of Abraham” ([[Gal. 3:6–7]]). James sees it fulfilled years later, when Abraham offered Isaac: “Seest thou how faith wrought with his works, and by works was faith made perfect?” ([[James 2:21–23]]).

      Genesis 15 holds the two together. In the covenants of Abraham’s world the lesser party pledged “exclusive loyalty (faith),” and Abram’s faith is that kind of trust. He believes, and then he does what God tells him with the animals. In one reading, “by this readiness to perform what God commanded him, Abram gave a practical proof that he believed.”
    sources: [oshb-wlc, bdb, biblehub-interlinear, jst-gen-15, gee-wanderings, keil-genesis, lds-scriptures]
  - ref: 8
    phrase: whereby shall I know that I shall inherit it?
    kind: scripture
    title: Asking how, after believing
    body: |
      Abram asks for assurance right after the text says he believed, and the question asks for confirmation, not out of doubt: Abram “trusted the Lord completely,” yet “he wanted some sort of confirmation of Jehovah’s promise to him about the land.” The stars had answered his question about a son. This question is about the land, where he lived as a stranger ([[Heb. 11:9]]).

      Zacharias asks the same question, in the same English words, when Gabriel promises him a son: “Whereby shall I know this?” ([[Luke 1:18]]). He is struck dumb “because thou believest not my words” ([[Luke 1:20]]). Abram has just been said to believe, and he receives no rebuke. God answers him with a covenant.
    sources: [parker-cutting, lds-scriptures]
  - ref: 10
    phrase: divided them in the midst, and laid each piece one against another
    kind: history
    title: The covenant between the pieces
    body: |
      Abram is preparing an ancient covenant ceremony in which the parties passed between the halves of slain animals. The five kinds of animals “comprise all those that were later acceptable as sacrifices under the law of Moses.” The birds are left whole, as in the law’s later sacrifices, where a bird was offered whole: the priest “shall not divide it asunder” ([[Lev. 1:17]]).

      Records from Abraham’s own era describe such ceremonies. A letter from Mari, an ancient city in modern Syria, gives “a contemporary eyewitness account” of kings who settled their terms and then sacrificed a donkey: “So, by their donkey-stallion (sacrifice) and their discussion, the king was bound by covenant.” A treaty inscription from Sefire, from the eighth century BC, spells out what the cutting meant: “[As] this calf is cut up, thus Matti‘el and his nobles shall be cut up.” Israel still knew the rite in Jeremiah’s day, when the men of Judah who “cut the calf in twain, and passed between the parts thereof” broke their covenant ([[Jer. 34:18–19]]; see the note at [[Jer. 34:18]]).

      So the act of passing between the carcasses “was likely a symbol that the individual was willing to die if they broke the oath.” The Book of Mormon records a covenant made on the same principle: Moroni’s people rent their garments “as a covenant” that if they transgressed, “the Lord should rend them even as they had rent their garments” ([[Alma 46:21]]). That makes verse 17 remarkable (see the note there).
    sources: [parker-cutting, gee-wanderings, keil-genesis, scripture-helps-gen-12-17, valletta-captain, lds-scriptures]
  - ref: 11
    phrase: Abram drove them away
    kind: symbol
    title: Birds of prey
    body: |
      The “fowls” are birds of prey (*ha‘ayit*), carrion birds drawn to the carcasses, and Abram guards the pieces until the covenant is made. He “waited on the Lord, protecting the two rows of carcasses from scavenging birds of prey.” The text gives the detail without explaining it.

      One reading takes the scene as a picture of what the Lord then tells Abram about his descendants (verses 13–16): Abram’s experience is “a type of his posterity’s future.” The clean animals, every kind later fit for sacrifice, stand for the house of Israel; the birds of prey, unclean under the law of Moses ([[Lev. 11:13–19]]), stand for “oppressive foreign nations”; and the fire that passes between the pieces is the Lord’s presence among them. The reading is built on the prophecy that follows, but the text itself does not draw it.
    sources: [biblehub-interlinear, bdb, parker-cutting, lds-scriptures]
  - ref: 12
    phrase: a deep sleep fell upon Abram
    kind: words
    title: A deep sleep from God
    body: |
      The “deep sleep” (*tardemah*) is the kind God sends. The word is used “usually by supernatural agency”: it is the sleep the Lord caused to fall on Adam ([[Gen. 2:21]]) and the “deep sleep from the LORD” that fell on Saul’s camp ([[1 Sam. 26:12]]). Here it seems to have been “divinely induced to prepare Abram for revelation,” and in it the Lord tells Abram his descendants’ future. The “horror of great darkness” comes before a dark prophecy, and in one reading the setting sun itself foreshadows “a dark and dreadful period of suffering for his posterity.”

      The timing raises a question. In verse 5 Abram is counting stars, but in verse 12 the sun is only now going down. One scholarly view is that “we have here a combination of the two threads of prophetic narrative,” and Moses did compile Genesis from “several documentary sources… besides a divine revelation to him.” Another reading takes the whole chapter as one revelation that “culminates in a prophetic sleep.” The text does not settle it.
    sources: [biblehub-interlinear, bdb, lds-scriptures, parker-cutting, keil-genesis, ryle-genesis, bd-pentateuch]
  - ref: 13
    phrase: they shall afflict them four hundred years
    kind: history
    title: Four hundred years, four generations
    body: |
      God tells Abram that the land will wait. His descendants will first be strangers and slaves in a land not their own, and the numbers given for how long are round ones. The fulfillment is Israel’s bondage in Egypt, which Exodus puts at “four hundred and thirty years” ([[Ex. 12:40–41]]); the 400 of this verse “agrees in round numbers” with it. The ancient texts already counted these years differently. The Septuagint, the early Greek translation, counts Exodus’s 430 years for the time “in the land of Egypt and the land of Chanaan,” and Paul counts 430 years from the covenant with Abraham to the law ([[Gal. 3:17]]).

      Verse 16 gives a second measure, “the fourth generation,” which matches the line from Levi to Moses in Exodus: Levi, Kohath, Amram, Moses ([[Ex. 6:16–20]]). To fit 400 years, “a generation must have been computed as 100 years,” about a lifetime then: Isaac was born when Abraham was a hundred ([[Gen. 21:5]]). Verse 14 was fulfilled as well: God judged Egypt, and Israel came out “with great substance,” the silver, gold, and clothing they asked of the Egyptians ([[Ex. 12:35–36]]). Stephen quoted this prophecy and its purpose: “after that shall they come forth, and serve me in this place” ([[Acts 7:6–7]]).
    sources: [lds-scriptures, ryle-genesis, lxx-rahlfs]
  - ref: 15
    phrase: thou shalt go to thy fathers in peace
    kind: words
    title: Going to his fathers
    body: |
      To “go to thy fathers” speaks of life after death, not of a family grave. “Abram’s ancestors had died in Babylonia, but the phrase, used here for the first time, evidently involves the thought of the immortality of the soul.” Abram would be buried in Canaan, far from them ([[Gen. 25:9–10]]), so the fathers he would join were not in the same tomb.

      The promise came true: “Abraham gave up the ghost, and died in a good old age, an old man, and full of years; and was gathered to his people” ([[Gen. 25:8]]). Latter-day revelation says where he went after that: Abraham “hath entered into his exaltation and sitteth upon his throne” ([[D&C 132:29]]).
    sources: [ellicott-genesis, lds-scriptures]
  - ref: 16
    phrase: the iniquity of the Amorites is not yet full
    kind: scripture
    title: Not yet full
    body: |
      Abram’s descendants must wait because the land’s inhabitants have not yet sinned their way out of it. The Amorites were “northwest Semitic-speaking peoples who lived about the time of Abraham in the areas that encompass Palestine and Syria,” and here their name is “the common name of all the inhabitants of Canaan.” God would not take the land from them before their wickedness was complete.

      Nephi explains the principle to his brothers, speaking of the people Israel later drove out of Canaan: “do ye suppose that they were righteous? Behold, I say unto you, Nay.… the Lord esteemeth all flesh in one; he that is righteous is favored of God. But behold, this people had rejected every word of God, and they were ripe in iniquity” ([[1 Ne. 17:33–35]]). The same law would bind Israel: “That the land spue not you out also, when ye defile it, as it spued out the nations that were before you” ([[Lev. 18:28]]).
    sources: [bd-amorites, keil-genesis, ellicott-genesis, lds-scriptures]
  - ref: 17
    phrase: a smoking furnace, and a burning lamp
    kind: symbol
    title: Fire between the pieces
    body: |
      The smoking firepot and the torch stand for the Lord Himself, and He alone passes between the pieces. The “furnace” (*tannur*) is a “portable stove or fire-pot,” and the “lamp” (*lappid*) is a torch. The plural of *lappid* is the word for the “lightnings” at Sinai ([[Ex. 20:18]]). Together they “represented God’s presence,” like the pillar of cloud and of fire that would later lead Israel out of Egypt ([[Ex. 13:21–22]]).

      In the rite of verse 10, the one who walked between the halves accepted their fate if he broke his word. Abram does not walk between them; he is in a deep sleep, and “there is nothing to suggest” that he swore an oath. The Lord, in effect, “swore an oath that he would lose his own life if he did not give Abram and his seed the land.” Here “the stronger party, God, performs the role often required of the weaker party.” The scene is “a gracious act by God to confirm his promises, prompted by Abram’s great faith,” and it “likely assured Abraham that the Lord would fulfill His promises.” Abram had asked how he could know, and this is God’s answer.
    sources: [bdb, biblehub-interlinear, scripture-helps-gen-12-17, parker-cutting, hopkin-covenant, lds-scriptures]
  - ref: 18
    phrase: the LORD made a covenant with Abram
    kind: words
    title: The first covenant cut
    body: |
      Here, for the first time in the Hebrew Bible, a covenant is “cut.” The Hebrew is *karat berit*, which “can also be translated as ‘to cut a covenant,’” and this verse “corresponds to the first occurrence” of the phrase. God’s covenant with Noah was “established” (*heqim*, [[Gen. 9:9]]). The idiom names the rite Abram has just seen: this ceremony “introduces the phrase ‘to cut a covenant’ that elsewhere became common in the biblical texts,” and the verb *karat* is used ninety times for making covenants. In chapter 17 the same verb names the penalty for refusing circumcision, to be “cut off” (see the note at [[Gen. 17:14]]). [The Covenant with Abraham](/genesis/themes/covenant-with-abraham/)
    sources: [biblehub-interlinear, scripture-helps-gen-12-17, parker-cutting, hopkin-covenant, lds-scriptures]
  - ref: 18
    phrase: Unto thy seed have I given this land, from the river of Egypt unto the great river, the river Euphrates
    kind: history
    title: Given already, from Egypt to the Euphrates
    body: |
      The words of the covenant are in the past tense, “Unto thy seed have I given this land” (*natatti*, “I have given”). Abram owned none of it, and his descendants would not return for four generations, but God speaks of the gift as already made. A grant of land to the lesser party was one of the regular parts of a covenant in Abraham’s world, and these verses are that grant.

      The borders are as wide as the promise: from “the river of Egypt,” the Wadi El Arish in northern Sinai, to the Euphrates. These are “the ideal boundaries of the future territory of Israel.” The Euphrates boundary “was reached in the time of David,” when he went “to recover his border at the river Euphrates” ([[2 Sam. 8:3]]). It was “probably only in the days of Solomon” that the whole picture was even approximately realized, when Solomon “reigned over all kingdoms from the river unto the land of the Philistines, and unto the border of Egypt” ([[1 Kgs. 4:21]]).
    sources: [biblehub-interlinear, gee-wanderings, ryle-genesis, bd-euphrates, lds-scriptures]
  - ref: 19
    phrase: The Kenites, and the Kenizzites, and the Kadmonites
    kind: history
    title: Ten peoples in the land
    body: |
      The list names the peoples who held the land when it was promised, ten of them. Only here does the Bible list ten; the other lists are shorter ([[Ex. 3:8]]; [[Deut. 7:1]]). Some are known from elsewhere in the Bible. The Rephaim were a “pre-Israelite people in Palestine, noted for their great stature,” whom the eastern kings had defeated in chapter 14 ([[Gen. 14:5]]). The Hittites “were a branch of the Canaanites.” On the Amorites, see verse 16.

      Not every people on the list stayed an enemy. The Kenites were “probably a Midianite tribe,” and Moses’ marriage into Jethro’s family was a cause of “the long-standing friendship between the Kenites and Israelites.” Saul spared the Kenites because they “shewed kindness to all the children of Israel” ([[1 Sam. 15:6]]; see also [[Judg. 1:16]]).
    sources: [ryle-genesis, bd-rephaim, bd-hittites, bd-kenites, lds-scriptures]

christ: |
  The LORD who cuts this covenant is Jehovah, and “Jehovah is the premortal Jesus Christ.” Paul says that in the promises to Abraham the scripture “preached before the gospel unto Abraham” ([[Gal. 3:8]]), and in Joseph Smith’s revision Abram’s own inheritance rests on the Son of Man’s death and rising (see the note on verse 6).

  The fire between the pieces points the same way. In the rite, whoever passed between the halves called death on himself if the covenant failed, and here only God passes. “From a Christian viewpoint, God is possibly implying that he himself would be willing to be ‘torn asunder,’ suffering the effects of the broken covenant.” It is offered as a possibility, a reading rather than what the text states.

explore: |
  - **The rite in Jeremiah.** [[Jer. 34:8–22]], where Judah breaks a covenant made between the halves of a calf.
  - **A covenant of rent garments.** [[Alma 46:11–24]], where Moroni’s people covenant by the same logic.
  - **Abraham’s faith in the New Testament.** [[Rom. 4:1–25]]; [[Gal. 3:6–18]]; [[James 2:21–23]]; [[Heb. 11:8–13]].
  - **The covenant in the Book of Abraham.** [[Abr. 2:6–11]]; [[Abr. 3:11–15]].
  - **The covenant renewed.** [[Gen. 17:1–14]]; [[Gen. 22:15–18]]; [[Neh. 9:7–8]].
  - **Cutting covenants.** Jared T. Parker’s “Cutting Covenants” (Religious Studies Center) follows the rite from Genesis 15 through the ancient treaties and Jeremiah 34.

