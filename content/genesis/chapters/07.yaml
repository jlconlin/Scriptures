chapter: 7
title: The Waters Prevail
tagline: Noah, his household, and the animals go into the ark, the LORD shuts the door, and the waters rise over the mountains until nothing that breathes is left alive outside the ark.
when: 'Noah’s six hundredth year (verses 6 and 11). The Church’s Bible chronology lists the Flood among the events of the early patriarchs and gives it no date.'

setting: |
  Genesis 7 is the middle of the Flood story. Noah’s history runs through chapter 9, to his death. Chapter 6 gave the reason for the Flood, the violence that filled the earth, and the plans for the ark. Chapter 7 brings Noah’s household and the animals into the ark and carries the waters to their height. Chapter 8 turns with “God remembered Noah” ([[Gen. 8:1]]).

  The Book of Moses retells Genesis only as far as [[Gen. 6:13]] ([[Moses 8:30]]), but it adds what Genesis leaves out. Noah preached faith, repentance, and baptism to people who would not listen ([[Moses 8:19–24]]), through the 120 years the Lord had allotted before the Flood ([[Moses 8:17]]). Enoch saw the Flood in vision long before it came ([[Moses 7:41–43]]). “The authenticity of the Genesis account of the Flood is confirmed by latter-day revelation.”

  Later scripture returns to the chapter more than once. Jesus made the days of Noah the pattern for the days before His coming ([[Matt. 24:37–39]]), and Peter made the ark a figure of baptism ([[1 Pet. 3:20–21]]).

thread: |
  Genesis 7 is the Creation running backward, with one household kept safe inside it. In chapter 1 God divided the waters above from the waters below and gathered the seas so that dry land appeared. Now “the fountains of the great deep” burst and “the windows of heaven” open (verse 11), and the deep is *tehom*, the same deep as in [[Gen. 1:2]]. The creatures are named by their kinds, wild beasts, cattle, creeping things, and birds (verse 14), as on the fifth and sixth days. Then everything “in whose nostrils was the breath of life” dies (verse 22), the breath God breathed into Adam ([[Gen. 2:7]]). As the waters rise, “the work of creation, as stated in Genesis 1, is effectively undone.”

  Against that, the chapter keeps saying that Noah did as he was told: “according unto all that the LORD commanded him” (verse 5), just as in [[Gen. 6:22]], and again in verses 9 and 16. The waters that drown every living thing outside the ark are the same waters that “bare up the ark” (verse 17). By verse 24 the waters stand at their height, and there the chapter stops. The next words, “God remembered Noah” ([[Gen. 8:1]]), are the turning point of the whole story.

sections:
  - range: 1-5
    heading: The command to go in
    plain: |
      The LORD said to Noah, “Go into the ark, you and your whole household, because I have seen that you are righteous before me in this generation. Take seven pairs of every clean animal, a male and its mate, and one pair of every animal that is not clean, a male and its mate. Take seven pairs of the birds of the sky as well, male and female, to keep their kind alive on the earth. In seven days I will send rain on the earth for forty days and forty nights, and I will wipe out every living thing I have made from the face of the ground.” And Noah did everything the LORD commanded him.
  - range: 6-16
    heading: Into the ark
    plain: |
      Noah was six hundred years old when the floodwaters came on the earth. Noah went into the ark with his sons, his wife, and his sons’ wives to escape the waters. Clean and unclean animals, birds, and everything that creeps on the ground came to Noah into the ark two by two, male and female, as God had commanded him. After the seven days the waters of the flood came on the earth.

      In Noah’s six hundredth year, on the seventeenth day of the second month, on that very day, all the springs of the great deep burst open and the floodgates of the sky were opened, and rain fell on the earth forty days and forty nights. On that same day Noah and his sons Shem, Ham, and Japheth, with Noah’s wife and his sons’ three wives, went into the ark, together with every kind of wild animal, every kind of livestock, every kind of creeping thing, and every kind of bird. They came to Noah into the ark two by two, of all flesh that has the breath of life, male and female, as God had commanded. Then the LORD shut him in.
  - range: 17-24
    heading: The waters prevail
    plain: |
      For forty days the flood came on the earth. The waters rose and lifted the ark high above the ground. The waters swelled and rose greatly, and the ark floated on their surface. They rose so high that all the high mountains under the whole sky were covered; the waters stood fifteen cubits above the mountains.

      Every living thing that moved on the earth died: birds, livestock, wild animals, everything that swarms on the ground, and every human being. Everything on dry land that had the breath of life in its nostrils died. God wiped out every living thing on the face of the ground, people and animals, creeping things and birds; they were wiped from the earth. Only Noah was left, and those who were with him in the ark. And the waters prevailed on the earth for a hundred and fifty days.

notes:
  - ref: 1
    phrase: for thee have I seen righteous before me in this generation
    kind: history
    title: Saved because he was righteous
    body: |
      God saves Noah because Noah is righteous, and He saves Noah’s household with him. The verse names only Noah (“thee have I seen righteous”), but latter-day revelation says it of the sons as well: Noah “was a just man, and perfect in his generation; and he walked with God, as did also his three sons, Shem, Ham, and Japheth” ([[Moses 8:27]]). Noah and his family “were saved because they were righteous.”

      That is where Genesis parts from the flood stories of Mesopotamia, which survive in versions “much older than when the biblical text is thought to have been written.” In *Atrahasis*, “annoyed at all the noise, the gods decide to destroy all humans with a giant flood.” Another god, sworn to secrecy, warns the hero by talking to the reed wall of his house so that he will overhear. The *Epic of Gilgamesh* tells it much the same way. The likenesses are real (an ark, the animals, birds sent out, a sacrifice afterward), and the stories “clearly share a common basic tradition.”

      The differences carry the meaning. In the Babylonian versions “the gods cause the flood because they were simply annoyed by the humans, not because of serious human sin,” and the hero escapes the plan of the chief god with the help of another. In Genesis “the flood hero is saved by the main god himself who wishes to save and not to completely destroy humanity.” The biblical account “differs from all others in its religious value and the purpose of it.”
    sources: [lds-scriptures, bd-noah, sc-knowhy-837]
  - ref: 2
    phrase: Of every clean beast thou shalt take to thee by sevens
    kind: words
    title: Seven pairs of the clean
    body: |
      Noah takes more than two of each clean animal. The Hebrew is *shiv‘ah shiv‘ah ish ve-ishto*, “seven seven, a male and his mate,” and the pairing words show that seven pairs are meant; modern translations read “seven pairs of all clean animals.” One older reading counts seven animals instead, “three pair and a single one, probably a male for sacrifice.”

      The extra clean animals were probably wanted for sacrifice, and perhaps for food. When Noah leaves the ark, his first act is to build an altar and offer “of every clean beast, and of every clean fowl” ([[Gen. 8:20]]). The distinction between clean and unclean animals is spelled out later in the law of Moses ([[Lev. 11]]), but it “did not originate with Moses.” Restoration scripture takes sacrifice back to Adam, who offered “the firstlings of their flocks” and learned that it was “a similitude of the sacrifice of the Only Begotten of the Father” ([[Moses 5:5–7]]).

      Chapter 6 told Noah to bring “two of every sort” ([[Gen. 6:19–20]]), and verses 9 and 15 here still say “two and two.” On why the story counts both ways, see the note on verse 13.
    sources: [biblehub-interlinear, nrsvue, ryle-genesis, keil-genesis, lds-scriptures]
  - ref: 11
    phrase: the fountains of the great deep broken up, and the windows of heaven were opened
    kind: symbol
    title: The deep and the windows of heaven
    body: |
      The Flood comes from below and from above at once, as Israelites pictured the world. “The great deep” is *tehom*, “deep, sea, abyss,” here the waters under the earth: they imagined “enormous reservoirs of water” beneath its surface, and the fountains are the channels from those reservoirs, torn open. “The windows of heaven” are sluices in the sky, “through which rain pours destructively.” Above the firmament of [[Gen. 1:6–8]] “were stored the masses of water which supplied the rainfall of the earth.”

      So both of the boundaries God set for the waters in chapter 1 give way at once (see the thread above). Isaiah takes up the open windows for judgment ([[Isa. 24:18]]), and Malachi turns the same word to blessing, “open you the windows of heaven” ([[Mal. 3:10]]).
    sources: [bdb, ryle-genesis, lds-scriptures, sc-knowhy-629]
  - ref: 13
    phrase: In the selfsame day entered Noah
    kind: structure
    title: Why the story tells it twice
    body: |
      Verses 13–16 tell again what verses 7–9 have just told: Noah, his family, and the animals go into the ark. The whole Flood story repeats itself this way. God commands Noah twice to go into the ark (6:18–22; 7:1–5), the entry is told twice, and periods of 7, 40, and 150 days come back again and again.

      Many scholars explain the repetitions as “two different sources, which were woven together by a later editor.” In that view one account has Noah take “seven pairs of every clean animal,” the other “one pair of every kind,” and the two are told apart partly by the name they use for God; verse 16 has both, “as God had commanded him: and the LORD shut him in.” That need not trouble a Latter-day Saint reader: Moses “used several documentary sources from which he compiled the book of Genesis, besides a divine revelation to him.” Differences of this kind “need not throw us into testimonial panic,” and “sometimes the discrepancies help us comprehend significant details.”

      Other scholars read the repetition as design. Laid out as a chiasm (a pattern whose steps lead up to a center and then come back down in reverse order), the story climbs through the seven days, the rain, the LORD shutting Noah in, the forty days, the mountains covered, and the 150 days, and then retraces those steps in reverse as the waters go down. At the center is “God remembered Noah” ([[Gen. 8:1]]). On this reading the repeated steps “guide readers toward the central message,” and whatever center scholars choose, “God and salvation are the focal points of the story.”
    sources: [sc-knowhy-629, ryle-genesis, bd-pentateuch, schade-rainbow]
  - ref: 16
    phrase: and the LORD shut him in
    kind: christ
    title: The LORD shut him in
    body: |
      The LORD Himself closed the door. The Hebrew says He shut it “behind him” (*vayyisgor YHWH ba‘ado*), the idiom for shutting a door on someone inside. The same idiom describes people shutting themselves in, as when Isaiah tells God’s people, “shut thy doors about thee… until the indignation be overpast” ([[Isa. 26:20]]). Here no one in the ark shuts the door; the LORD does, from outside. Noah does not leave until God tells him, “Go forth of the ark” ([[Gen. 8:16]]).

      “The LORD” in small capitals stands for the name Jehovah, and “Jehovah is the premortal Jesus Christ.” The one who shut the door on Noah later used that day as a warning about His own coming: before the Flood people were “eating and drinking, marrying and giving in marriage, until the day that Noe entered into the ark, And knew not until the flood came, and took them all away; so shall also the coming of the Son of man be” ([[Matt. 24:38–39]]).
    sources: [biblehub-interlinear, bdb, bd-jehovah, lds-scriptures]
  - ref: 17
    phrase: the waters increased, and bare up the ark
    kind: scripture
    title: The waters that bore up the ark
    body: |
      The waters that destroyed everything outside the ark are the same waters that carried it. Peter says it in a few words: eight souls “were saved by water” ([[1 Pet. 3:20]]).

      Restoration scripture shows the ark in the Lord’s keeping. Enoch, shown the Flood in vision, saw “that Noah built an ark; and that the Lord smiled upon it, and held it in his own hand; but upon the residue of the wicked the floods came and swallowed them up” ([[Moses 7:43]]). He saw why, too: “the posterity of all the sons of Noah should be saved with a temporal salvation” ([[Moses 7:42]]), because the Lord “truly covenanted with Enoch that Noah should be of the fruit of his loins” ([[Moses 8:2]]). The ark carried that covenant, so that it was “brought through the flood, and perpetuated by subsequent generations, rather than coming to an end with the flood.”
    sources: [lds-scriptures, schade-rainbow]
  - ref: 19
    phrase: all the high hills, that were under the whole heaven, were covered
    kind: prophets
    title: 'The mountains covered: the earth’s baptism'
    body: |
      The verse means the highest ground there was. “High hills” here and “the mountains” in verse 20 are the same Hebrew word, *heharim*, and the waters stood “fifteen cubits,” about 22 feet, above them. Fifteen cubits is half the ark’s height of thirty ([[Gen. 6:15]]), which may be why the number is given: an ark sunk to half its depth would just clear the peaks. The Church’s chapter heading reads the verses plainly: “water covers the whole earth.”

      Latter-day prophets have read the covering as the earth’s baptism. President John Taylor quoted these two verses and concluded, “That is, the earth was immersed. It was a period of baptism.” The Church’s study helps teach the same and say what it meant: “This was the baptism of the earth and symbolized a cleansing.” They also read [[Ether 13:2]] as the waters receding from “the land of America.” Enoch had heard the earth itself cry, “When shall I rest, and be cleansed from the filthiness which is gone forth out of me?” ([[Moses 7:48]]). The filthiness was not the earth’s own; she mourned “because of the wickedness of my children.” In one reading the earth “was physically washed and symbolically cleansed so that it could become free from the blood and sins of the mortals who polluted its surface.”

      What scripture gives is the Flood’s cause and purpose; it attests to the Flood “without providing the specific details of the history or science behind it.”
    sources: [biblehub-interlinear, ryle-genesis, lds-scriptures, ot-manual-gen-4-11, gs-flood-noah, hoskisson-flood, schade-rainbow]
  - ref: 21
    phrase: and every man
    kind: scripture
    title: What became of those who drowned
    body: |
      Genesis records only that they died. Restoration scripture follows them further. Before the Flood came, Enoch watched “the God of heaven” look on these people, “and he wept” ([[Moses 7:28]]). The Lord told him, “these which thine eyes are upon shall perish in the floods; and behold, I will shut them up; a prison have I prepared for them. And that which I have chosen hath pled before my face. Wherefore, he suffereth for their sins; inasmuch as they will repent in the day that my Chosen shall return unto me” ([[Moses 7:38–39]]). Enoch was being shown “the redemptive power of the Atonement of Christ and how it would reach those shut up in a spirit prison.”

      The New Testament says it happened. After His death Christ “went and preached unto the spirits in prison; Which sometime were disobedient, when once the longsuffering of God waited in the days of Noah” ([[1 Pet. 3:19–20]]). On October 3, 1918, President Joseph F. Smith “wondered at the words of Peter” about these same people, and was shown how it was done: “from among the righteous, he organized his forces and appointed messengers,” and “thus was the gospel preached to those who had died in their sins” ([[D&C 138:28–32]]). So “rather than all being lost through the flood, all could be gained through the redemptive power of Christ.”
    sources: [lds-scriptures, schade-rainbow]
  - ref: 24
    phrase: an hundred and fifty days
    kind: history
    title: Seven, forty, and a hundred and fifty days
    body: |
      The 150 days include the forty days of rain. The rain fell “forty days and forty nights” (verse 12), and together with the waters from the deep it raised the flood to its height, where it stood until the 150 days were over. Genesis dates the Flood to the day. The deep broke open on the seventeenth day of the second month of Noah’s six hundredth year (verse 11), and the ark came to rest on the seventeenth day of the seventh month, “after the end of the hundred and fifty days” ([[Gen. 8:3–4]]): five months, “reckoning 30 days to a month, exactly 150 days.” The waters then took about as long again to go down, and the earth was dry on the twenty-seventh day of the second month of the next year ([[Gen. 8:14]]). The Flood lasted “a year and ten days.”

      The seven days of verses 4 and 10 come before all of it. Noah’s household and the animals went into the ark and waited a week before the rain began. “Throughout the Genesis story, a period of probation and patience precedes the fulfilment of the Divine word,” and Peter calls the whole time before the Flood the time when “the longsuffering of God waited” ([[1 Pet. 3:20]]).
    sources: [keil-genesis, lds-scriptures, schade-rainbow, ryle-genesis, scripture-helps-gen-6-11]

christ: |
  Peter reads this chapter as a figure of baptism. In the ark “eight souls were saved by water. The like figure whereunto even baptism doth also now save us… by the resurrection of Jesus Christ” ([[1 Pet. 3:20–21]]). His word for “figure” is *antitypon*, “a thing resembling another, its counterpart”; in this verse it is used “as baptism corresponds to the deluge.” “Just as the deliverance of Noah’s family from the Flood represented a new beginning for the earth, so baptism by water represents being born again to a new life in Christ.”

  When Enoch was shown this Flood, he was shown in the same vision what would answer it: he “saw the day of the coming of the Son of Man, even in the flesh,” and rejoiced, “the Lamb is slain from the foundation of the world” ([[Moses 7:47]]). That Atonement reached even those the waters took (see the note on verse 21).

explore: |
  - **Enoch’s vision of the Flood.** [[Moses 7:28–69]] sees the Flood before it comes and follows it to the coming of the Son of Man in the last days ([[Moses 7:60–65]]).
  - **The oath after the waters.** [[Isa. 54:9–10]] looks back to God’s promise to Noah in chapter 9.
  - **Further reading.** “The Rainbow as a Token in Genesis,” in *From Creation to Sinai* (BYU Religious Studies Center), reads the whole Flood story through Restoration scripture. KnoWhy #629 (Scripture Central) lays out the chiasm of Genesis 6–9.

