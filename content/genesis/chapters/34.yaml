chapter: 34
title: Dinah and the Men of Shechem
tagline: Shechem seizes Jacob’s daughter Dinah and then asks to marry her. Her brothers answer with a lie about circumcision, and on the third day Simeon and Levi kill every male in the city. Jacob fears for his house; his sons answer with a question about their sister.
when: 'While Jacob’s household lived beside Shechem, after his return from Paddan-aram and before the move to Beth-el ([[Gen. 33:18–19]]; [[Gen. 35:1]]). The text gives no year.'

setting: |
  After twenty years in Paddan-aram ([[Gen. 31:41]]) and a wary meeting with Esau ([[Gen. 33]]), Jacob came to Shechem. He “pitched his tent before the city,” bought a field from “the children of Hamor, Shechem’s father,” and built an altar ([[Gen. 33:18–20]]). Chapter 34 is what happened there. It is the only story told about Dinah, Leah’s daughter, who appears elsewhere only in her birth notice and in the list of Jacob’s household ([[Gen. 30:21]]; [[Gen. 46:15]]).

  Later scripture comes back to the chapter through Dinah’s brothers rather than through Dinah: Jacob’s dying words curse the anger of Simeon and Levi ([[Gen. 49:5–7]]; see the note on verse 31).

  The chapter has seven parts: Shechem and Dinah (verses 1–4), the family hears (5–7), the proposal (8–12), the sons’ answer (13–17), the city agrees (18–24), the killing and plunder (25–29), and Jacob’s rebuke with the brothers’ reply (30–31).

thread: |
  Genesis 34 is full of speeches, and Dinah gives none of them. Shechem and Hamor speak (verses 4, 8–12, 20–23), her brothers speak (14–17, 31), and Jacob speaks once (30). The narrator names her six times (verses 1, 3, 5, 13, 25, 26), and after the first verse she is never again the subject of a verb: she is seized, wanted, bargained over, and at the end “taken out.” The men name her by what she is to them: “the damsel” (Shechem, verses 4 and 12), “your daughter” (Hamor, verse 8), “our sister” (her brothers, verses 14 and 31).

  The other silence is God’s. Neither “God” nor “the LORD” appears anywhere in the chapter, no one prays, and no one is told what to do. The one thing of His that does appear is the sign of His covenant, circumcision, which the brothers make a condition of peace (verses 14–16) and then a trap (verse 25). The sons of Jacob take what Shechem did for “folly in Israel” (verse 7), and the Hebrew word for how they answer him, “deceitfully” (verse 13), occurs in Genesis only here and in Isaac’s words about Jacob ([[Gen. 27:35]]).

  The chapter ends with a question and no verdict (verse 31). Jacob gives his verdict at the end of his life, when he curses the anger of Simeon and Levi ([[Gen. 49:5–7]]; see the note on verse 31).

sections:
  - range: 1-4
    heading: Shechem and Dinah
    plain: |
      Dinah, the daughter Leah bore to Jacob, went out to see the women of the land. Shechem, son of Hamor the Hivite, the ruler of the region, saw her, seized her, and violated her. Afterward he was drawn to her, loved the young woman, and spoke tenderly to her. He told his father Hamor, “Get me this girl as my wife.”
  - range: 5-7
    heading: The family hears
    plain: |
      Jacob heard that Shechem had violated his daughter Dinah. His sons were out in the field with his livestock, so he kept silent until they came. Meanwhile Hamor, Shechem’s father, came out to speak with Jacob. When Jacob’s sons heard what had happened, they came in from the field, grieved and very angry, because Shechem had done a shameful thing in Israel by lying with Jacob’s daughter, a thing that must not be done.
  - range: 8-12
    heading: Hamor’s proposal
    plain: |
      Hamor said to them, “My son Shechem longs for your daughter. Please give her to him as his wife. Let us intermarry: give us your daughters and take ours for yourselves. Live among us; the land is open to you. Settle here, trade, and acquire property.” Shechem said to her father and brothers, “Let me find favor with you, and I will give whatever you ask. Name any bride-price and gift, however high, and I will pay it, only give me the girl as my wife.”
  - range: 13-17
    heading: The sons’ answer
    plain: |
      Jacob’s sons answered Shechem and his father Hamor deceitfully, because Shechem had defiled their sister Dinah. They said, “We cannot give our sister to an uncircumcised man; that would be a disgrace to us. We will agree only on this condition: if you become like us and every male among you is circumcised, then we will give you our daughters, take yours, live among you, and become one people. But if you will not listen and be circumcised, we will take our daughter and go.”
  - range: 18-24
    heading: The city agrees
    plain: |
      Their words pleased Hamor and Shechem. The young man did not delay, because he was delighted with Jacob’s daughter, and he was the most honored man in his father’s house. Hamor and Shechem went to the gate of their city and said to the men there, “These men are friendly toward us. Let them live in the land and trade in it; the land is wide enough for them. We can take their daughters as wives and give them ours. But the men will agree to live with us as one people only on this condition: that every male among us be circumcised, as they are. Will not their livestock, their property, and all their animals be ours? Only let us agree to their terms, and they will stay with us.” All who went out of the city gate listened to Hamor and Shechem, and every male was circumcised.
  - range: 25-29
    heading: Simeon and Levi
    plain: |
      On the third day, while the men were still in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, attacked the unsuspecting city, and killed every male. They killed Hamor and his son Shechem with the sword, took Dinah out of Shechem’s house, and left. Then Jacob’s sons came over the dead and plundered the city, because their sister had been defiled. They took the flocks, herds, and donkeys, and everything in the city and the fields. They carried off all the wealth, all the children, and the wives, and plundered everything in the houses.
  - range: 30-31
    heading: Jacob and his sons
    plain: |
      Jacob said to Simeon and Levi, “You have brought trouble on me by making me odious to the people of this land, the Canaanites and the Perizzites. We are few in number; if they gather against me and attack, I and my household will be destroyed.” They answered, “Should he have treated our sister like a prostitute?”

notes:
  - ref: 1
    phrase: went out to see the daughters of the land
    kind: history
    title: Dinah goes out, and the text does not blame her
    body: |
      Genesis gives Dinah one act in this chapter, going out, and does not count it as a fault. She is introduced by her mother, “the daughter of Leah, which she bare unto Jacob” (her birth is noted in [[Gen. 30:21]]), and she goes out “to see the daughters of the land.” What is done to her comes in the next verse, and Shechem is the subject of every verb: he saw her, took her, lay with her, and humbled her.

      Jacob’s household was camped beside a Canaanite city ([[Gen. 33:18–19]]), so she was going out to people who lived there. The text gives her no age. Counting the years between Jacob’s return and Joseph’s sale puts her “probably between 13 and 15 at the time”; that is an inference from the chronology, not a statement of the text.
    sources: [oshb-wlc, keil-genesis, lds-scriptures]
  - ref: 2
    phrase: he took her, and lay with her, and defiled her
    kind: words
    title: What “defiled” hides
    body: |
      The verse describes sexual violence, and the KJV’s “defiled” blurs it. Three Hebrew verbs carry the sentence: *laqach*, “took”; *shakav*, “lay with” her; and *‘innah*, “humble, a woman by cohabitation.” The same verb is used of a man who has “humbled” a woman in the later law ([[Deut. 22:29]]) and of Amnon, who “forced” Tamar ([[2 Sam. 13:14]]). Translators say it in plain words: “by force” (NRSVUE), “raped her” (NIV), “seized her … and humiliated her” (ESV). Read with verse 3, the passage makes it evident “that there had been no consent on the part of Dinah, that the whole was an act of violence, and that she was now detained by force in the house of Shechem.” Verse 26 says her brothers took her “out of Shechem’s house.”

      Where the KJV has “defiled” in verses 5, 13, and 27, the Hebrew has a different word, *tame’*, to make unclean. That is the word the narrator uses for how Jacob and his sons took the news. Verse 2 names what was done to Dinah; the word for what it meant to her family comes after.

      Verse 3 then reports Shechem’s feelings: his soul “clave” to Dinah, he “loved the damsel,” and “spake kindly,” which in Hebrew is “spoke to her heart” (*dibber ‘al-lev*), the phrase for comfort in [[Isa. 40:2]] and [[Gen. 50:21]].
    sources: [oshb-wlc, bdb, nrsvue, niv, esv, clarke-commentary, ot-manual-gen-24-36, lds-scriptures]
  - ref: 2
    phrase: Hamor the Hivite, prince of the country
    kind: history
    title: A city beside Jacob’s tents
    body: |
      Shechem is a man in this verse and a city in the verses around it, and Jacob’s tents stand “before the city.” The Hivites were one of the Canaanite peoples, descended from Canaan ([[Gen. 10:15–17]]); they were “a Canaanitish race.” Hamor, Shechem’s father, was “prince of the country,” and Jacob had already dealt with his family: he “pitched his tent before the city” and bought a field from “the children of Hamor, Shechem’s father, for an hundred pieces of money” ([[Gen. 33:18–19]]).

      In the world of Israel’s ancestors, Shechem was among the “preeminent sites” of the Middle Bronze Age, a time of “cities with massive fortifications complete with gates and ramparts,” and a pastoralist such as Abraham “would have been on the margins of Canaanite society.” That is the setting for Jacob’s words in verse 30, “I being few in number,” and for a question the chapter raises: how could two men overcome such a city? The note on verse 25 gives the circumstance the text supplies.
    sources: [bd-hivites, pierce-ancestors, lds-scriptures]
  - ref: 5
    phrase: held his peace until they were come
    kind: words
    title: Jacob’s silence
    body: |
      Jacob says nothing from verse 5 until verse 30, and the text gives no reason. The Hebrew verb (*hecherish*) means “be silent”; Abraham’s servant “held his peace” in the same way while he watched Rebekah at the well ([[Gen. 24:21]]). Read plainly, he “remained quiet, without taking any active proceedings,” until his sons came from the field, and the sons “had the chief voice in the question of their sister’s marriage,” as Laban and Bethuel did when Rebekah’s marriage was settled ([[Gen. 24:50]]; [[Gen. 24:55]]). Here Shechem speaks to “her father and… her brethren” together (verse 11), and in the event it is the sons who answer (verse 13).
    sources: [bdb, keil-genesis, lds-scriptures]
  - ref: 7
    phrase: wrought folly in Israel
    kind: words
    title: “Folly in Israel”
    body: |
      “Folly” here is a strong moral word, and “in Israel” marks the act as a disgrace by the covenant people’s standard. The expression recurs in the law ([[Deut. 22:21]]), in Judges ([[Judg. 20:6]]), and in Tamar’s plea to Amnon, “no such thing ought to be done in Israel: do not thou this folly” ([[2 Sam. 13:12]]), which echoes the end of this verse, “which thing ought not to be done.” The Hebrew, *nevalah*, means here “disgraceful folly, especially of sins of un-chastity,” and to have “wrought folly in Israel” is to “do a thing disgraceful according to Israel’s standard.”

      Who is “Israel” here, before there was a nation of that name? One reading takes it of Jacob himself, who had just been given the name ([[Gen. 32:28]]): because “Jacob had become Israel,” the wrong done to his daughter “was a crime against Israel.” “To work folly” “was a standing phrase for crimes against the honour and calling of Israel as the people of God.” So the verse measures Shechem’s act by Israel’s standard, and not only as an injury to a sister.
    sources: [bdb, keil-genesis, lds-scriptures]
  - ref: 9
    phrase: make ye marriages with us
    kind: history
    title: What Hamor offers
    body: |
      Hamor and Shechem offer a great deal, and what they offer would make Jacob’s family and theirs one people. Hamor proposes intermarriage (“give your daughters unto us, and take our daughters unto you”), a place to live, trading rights, and land (verses 9–10). Shechem adds a payment at any figure Jacob names (verse 12). The “dowry” (*mohar*) is the “purchase-price of wife,” a payment to the bride’s family, and here, as in the law, it is also “‘compensation’ for wrong.” The later law has a man who lays hold of an unbetrothed virgin pay and marry her, and “he may not put her away all his days” ([[Deut. 22:28–29]]; compare [[Ex. 22:16–17]]). Shechem’s offer resembles what that law would later require.

      But the proposal asks for the one thing Abraham and Isaac had guarded against. Abraham made his servant swear not to take a wife for Isaac “of the daughters of the Canaanites” ([[Gen. 24:3]]), and Isaac forbade it to Jacob ([[Gen. 28:1]]). Hamor’s plan is that the two peoples “should be amalgamated on the basis of (1) intermarriage, (2) trading rights, (3) rights of occupation of land.” The sons’ stated reason for refusing, in verse 14, is the covenant sign.
    sources: [bdb, ryle-genesis, lds-scriptures]
  - ref: 13
    phrase: deceitfully
    kind: words
    title: The word Isaac used of Jacob
    body: |
      The Hebrew word for “deceitfully,” *mirmah*, occurs in Genesis in only one other place: Isaac’s words to Esau about Jacob, “Thy brother came with subtilty, and hath taken away thy blessing” ([[Gen. 27:35]]). The text does not comment on the echo, and it should not be pressed far: one deceit was a man’s, for a blessing, and the other a family’s, for a sister. But the narrator uses of Jacob’s sons the word Isaac used of their father. The verse gives their stated reason right after it: “because he had defiled Dinah their sister.”
    sources: [oshb-wlc, lds-scriptures]
  - ref: 14
    phrase: uncircumcised
    kind: history
    title: The covenant sign as bait
    body: |
      Circumcision was “the token of the Abrahamic covenant,” and the brothers make it the price of the marriage. It symbolized separation “from the world, the uncircumcised with whom Israel might not mix,” and “the various Canaanite tribes appear to have been uncircumcised,” with this chapter cited. So the first half of the demand fits the covenant: Jacob’s family could not give a daughter to a man still outside it (verse 14).

      The second half is what makes the offer believable. The covenant did let outsiders in. Abraham circumcised all “born in the house, or bought with money of any stranger” ([[Gen. 17:12–13]]; [[Gen. 17:23]]), and a stranger who wished to keep the Passover could do so once “all his males be circumcised” ([[Ex. 12:48]]). The brothers’ “If ye will be as we be” (verse 15) therefore offered what looked like a way into the covenant people, and Hamor repeats it to his city: “to be one people” (verse 22). The text calls the answer deceitful (verse 13), and the treachery “is made to turn upon their insistence on the sacred national rite of circumcision.” Those who received the sign “enjoyed the privileges and undertook the responsibilities of the covenant,” but to set up a whole town for slaughter “on the pretext of bringing them into the covenant was an evil and wicked thing.”
    sources: [bd-circumcision, ryle-genesis, ot-manual-gen-24-36, lds-scriptures]
  - ref: 23
    phrase: Shall not their cattle and their substance and every beast of theirs be ours?
    kind: history
    title: What Hamor told the town
    body: |
      Hamor tells his city something different from what he told Jacob. To Jacob he spoke of Shechem’s longing for Dinah (verse 8). At “the gate of their city,” the city gate being “often a place for public business,” he does not mention Dinah at all. He argues from the guests’ peacefulness (“These men are peaceable with us”), the room in the land, marriage, and last, profit: “Shall not their cattle and their substance and every beast of theirs be ours?” The men of the gate agree, and every male is circumcised (verse 24).
    sources: [lds-scriptures, bd-gate]
  - ref: 25
    phrase: boldly
    kind: words
    title: Boldly, or unawares?
    body: |
      The KJV makes the attack sound brave, but the Hebrew says the city felt safe. The word, *betach*, means “security,” with this verse first among its listed uses, and the Septuagint translates it “securely.” Modern versions follow: “unawares” (NRSVUE), “while it felt secure” (ESV), “the unsuspecting city” (NIV). The preceding “when they were sore” is *ko’avim*, “be in pain, physical… as result of circumcision.” So on the third day, when the men were in pain and the city trusted the agreement it had made, two men with swords came in.
    sources: [bdb, lxx-rahlfs, nrsvue, esv, niv, lds-scriptures]
  - ref: 25
    phrase: Simeon and Levi
    kind: history
    title: Two brothers, or all of them?
    body: |
      Verses 25–26 name two killers, but the verses around them speak of all the sons. “The sons of Jacob” answer deceitfully (verse 13); “Simeon and Levi” kill the males and take Dinah from Shechem’s house (verses 25–26); “the sons of Jacob” plunder the city (verse 27); and Jacob rebukes only “Simeon and Levi” (verse 30). Both were Leah’s sons, full brothers of Dinah ([[Gen. 29:33–34]]), as verse 25 says (“Dinah’s brethren”). The Septuagint ties the speech to them as well: in verse 14 it is “Symeon and Levi, the brothers of Dina” who say that they cannot give their sister to an uncircumcised man.

      Read as it stands, the text has the two do the killing, while “the sons of Jacob” in verse 27 are all of Jacob’s sons, Simeon and Levi included, who shared the plunder. One scholarly view explains the unevenness otherwise, as two accounts of the event combined, one blaming all the sons and the other Simeon and Levi alone. The Bible Dictionary allows that Moses “used several documentary sources from which he compiled the book of Genesis,” but does not assign verses to them.
    sources: [lds-scriptures, lxx-rahlfs, keil-genesis, ryle-genesis, bd-pentateuch]
  - ref: 30
    phrase: Ye have troubled me
    kind: words
    title: What Jacob objects to
    body: |
      Jacob’s one speech in the chapter is about danger more than about right and wrong: his rebuke turns “not so much upon the dastardly treachery and cruelty of his sons, as upon the evil effects it will produce.” “Troubled” (*‘akar*, “stir up, disturb, trouble”) is the verb Joshua uses of Achan, whose theft brought trouble on all Israel: “Why hast thou troubled us?” ([[Josh. 7:25]]). “To make me to stink” is a metaphor for being made hateful; another rendering is “making me odious” (NRSVUE). Jacob’s fear is that “I being few in number,” the neighboring peoples will unite against his house.

      The fear did not come true. When the household set out for Beth-el, “the terror of God was upon the cities that were round about them, and they did not pursue after the sons of Jacob” ([[Gen. 35:5]]). God speaks and acts in the story only afterward: He commands Jacob to go up to Beth-el ([[Gen. 35:1]]), and His “terror” protects the household.

      Jacob’s moral judgment comes in his dying words (see the note on verse 31), but even this response “indicates that their recourse was less than honorable as well, even if it was culturally appropriate.”
    sources: [bdb, ryle-genesis, nrsvue, pierce-ancestors, lds-scriptures]
  - ref: 31
    phrase: Should he deal with our sister as with an harlot?
    kind: scripture
    title: The chapter ends on a question
    body: |
      The brothers’ last word is a question, and the chapter does not answer it. It is a fair question about what Shechem did, and nothing in the chapter denies the wrong to Dinah; verse 7 has already called it “folly.” But the question does not settle whether what the brothers did in answer was right.

      The answer comes near the end of Genesis. Jacob, blessing his sons, says: “Simeon and Levi are brethren; instruments of cruelty are in their habitations.” He refuses to be joined to their council, and says: “Cursed be their anger, for it was fierce; and their wrath, for it was cruel: I will divide them in Jacob, and scatter them in Israel” ([[Gen. 49:5–7]]). The reference to Simeon and Levi’s violence “appears, at first, to refer to Genesis 34,” and the dividing and scattering are explained by where their tribes later lived (below). The Church’s current guidance gives this chapter and Jacob’s words as its example for a plain statement: “Those who acted violently without divine direction were not following the will of God.” It adds that “we should not think that examples of violence in the Old Testament would ever be justification for committing violence today.”

      The tribes bear the sentence out in their inheritance. Simeon’s land lay “within the inheritance of the children of Judah” ([[Josh. 19:1]]), and the Levites received forty-eight cities “within the possession of the children of Israel” ([[Josh. 21:41]]): the cities of Simeon “are scattered throughout the southern part of Israelite territory, intermixed with the cities of Judah,” and those of the Levites “are similarly scattered across all of Israelite territory.”
    sources: [lds-scriptures, scripture-helps-violence, sc-knowhy-843]

christ: |
  Jacob’s last words pass over his three oldest sons in turn, Reuben ([[Gen. 49:3–4]]), then Simeon and Levi, and the leading blessing goes to Judah: “Judah, thou art he whom thy brethren shall praise… The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come” ([[Gen. 49:8–10]]). The blessings on Simeon and Levi “help to explain the third blessing, the blessing of Judah” (see the note on [[Gen. 35:22]]). The name Shiloh in that verse “has been regarded by many biblical scholars as a prophecy of the coming of Messiah,” and was “fulfilled in Jesus Christ’s being literally of the lineage.” The New Testament says it in plain words: “our Lord sprang out of Juda” ([[Heb. 7:14]]), and Matthew’s genealogy runs from “Jacob begat Judas and his brethren” ([[Matt. 1:2]]). On that reading, Genesis 34 is the violence behind the blessing on Simeon and Levi, and so part of the background to the blessing of Judah.

explore: |
  - **A brother’s answer to a sister’s wrong.** [[2 Sam. 13:11–29]] tells of Tamar and Amnon, where the same words, “no such thing ought to be done in Israel,” are used, and where a brother, Absalom, answers after two full years at a feast to which Amnon is invited (verses 23–29).
  - **Jacob’s last words, and their fulfillment.** [[Gen. 49:1–10]]; [[Josh. 19:1–9]]; [[Josh. 21:1–8]]. KnoWhy #843 (Scripture Central), “Why is Judah Blessed with a Scepter Until Shiloh Comes?”, sets the blessings on Reuben, Simeon, Levi, and Judah side by side.
  - **Shechem later.** [[Gen. 37:12–14]] (the brothers pasture their flocks at Shechem again), [[Josh. 21:21]] (a city of refuge), and [[Josh. 24:32]] (Joseph’s bones buried in the field Jacob bought).
  - **The Church’s statement on violence in the Old Testament.** The appendix “Violence and Destruction in the Old Testament” in *Scripture Helps: Old Testament* is the Church’s current guidance on reading chapters like this one.

