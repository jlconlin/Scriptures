  - **Abel in the New Testament.** [[Heb. 11:4]]; [[Heb. 12:24]]; [[Matt. 23:35]].
  - **The mark of Cain.** KnoWhy #836 (Scripture Central), “What Were the Curse and Mark of Cain?”, sets out what ancient Jewish and Christian readers guessed and where the racial reading came from.

