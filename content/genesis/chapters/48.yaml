chapter: 48
title: God Make Thee as Ephraim and as Manasseh
tagline: Near death in Egypt, Jacob takes Joseph's two sons as his own, crosses his hands to lay his right hand on the younger, and blesses them in the name of the God who has shepherded and redeemed him.
when: 'The last days of Jacob’s life, in Goshen in Egypt. He lived seventeen years there and died at 147 ([[Gen. 47:28]]); the chapter dates this scene only as “after these things,” and the text gives no year.'

setting: |
  Genesis 48 takes place in Goshen, in Egypt, near the end of Jacob's life. He lived there seventeen years and died at 147 ([[Gen. 47:27–28]]). The chapter follows the scene in which he made Joseph swear to bury him in Canaan ([[Gen. 47:29–31]]). Joseph now brings his two sons, Manasseh and Ephraim, born in Egypt to Asenath, “the daughter of Poti-pherah priest of On,” before the famine ([[Gen. 41:50–52]]). Jacob adopts them as his own sons and blesses them, setting the younger before the elder. Chapter 49 gives a blessing to each of the twelve sons, and chapter 50 closes with Jacob's burial and Joseph's death.

  Other scripture builds on what happens here. The chronicler explains that Reuben's birthright “was given unto the sons of Joseph” ([[1 Chr. 5:1–2]]). Hebrews counts the blessing as faith: “By faith Jacob, when he was a dying, blessed both the sons of Joseph” ([[Heb. 11:21]]). Jeremiah calls Ephraim the Lord's “firstborn” ([[Jer. 31:9]]). Latter-day revelation names “the children of Ephraim” in the gathering of Israel ([[D&C 133:30–34]]), and the Book of Mormon traces Lehi to Manasseh ([[Alma 10:3]]).

  The chapter has five parts: Jacob adopts the boys (verses 1–7), the scene of the blessing and the crossed hands (8–14), the blessing itself (15–16), Joseph's objection and Jacob's answer (17–20), and Jacob's last words to Joseph (21–22).

thread: |
  Genesis 48 is about how a blessing is handed on, and it turns on God's choice, not on the order of birth. Jacob begins with what God promised him at Luz (verses 3–4). Then he takes Joseph's two Egyptian-born sons as his own, “as Reuben and Simeon” (verse 5), and blesses them with his hands crossed, so that his right hand falls on the younger, Ephraim. Joseph objects, and Jacob answers, “I know it, my son, I know it” (verse 19). The text does not say why Ephraim was chosen; the Church's reading is that it was the Lord's will.

  Two things in the blessing are worth watching. One is the name. Jacob asks that “my name be named on them” (verse 16), and the Joseph Smith Translation says that name was Israel. The other is the one who blesses. Jacob calls on the God before whom his fathers walked, who shepherded him all his life, and “the Angel which redeemed me” (verses 15–16). The verb “bless” that follows is singular in Hebrew: he names one giver three ways.

  The chapter ends by looking ahead. God will bring Joseph's family back to the land of their fathers (verse 21), and Joseph is given “one portion above thy brethren” (verse 22), a word that is also the name of the city of Shechem.

sections:
  - range: 1-7
    heading: Jacob adopts Joseph's sons
    plain: |
      Some time later Joseph was told, “Your father is ill,” and he took his two sons, Manasseh and Ephraim, with him. When Jacob heard that Joseph was coming, he gathered his strength and sat up in bed. He told Joseph, “God Almighty appeared to me at Luz in the land of Canaan and blessed me. He said, ‘I will make you fruitful and increase your numbers. I will make you a multitude of peoples, and I will give this land to your descendants after you as an everlasting possession.’

      “Now your two sons, Ephraim and Manasseh, who were born to you in Egypt before I came to you here, are mine, just as Reuben and Simeon are mine. Any children you have after them will be yours; in their inheritance they will be counted under the names of their brothers. As for me, when I was coming from Paddan, Rachel died beside me in the land of Canaan, a short way from Ephrath, and I buried her there on the road to Ephrath,” that is, Bethlehem.
  - range: 8-14
    heading: The blessing begins
    plain: |
      Israel saw Joseph's sons and asked, “Who are these?” Joseph answered, “They are my sons, whom God has given me here.” “Bring them to me,” Israel said, “so that I may bless them.” His eyes were failing with age and he could not see. Joseph brought the boys close, and Jacob kissed and embraced them. He said to Joseph, “I never expected to see your face again, and now God has let me see your children too.”

      Joseph took the boys from between his knees and bowed with his face to the ground. Then he took them both, Ephraim at his right hand (toward Israel's left) and Manasseh at his left (toward Israel's right), and brought them near. But Israel crossed his hands: he put his right hand on the head of Ephraim, the younger, and his left on the head of Manasseh, the firstborn.
  - range: 15-16
    heading: Jacob's blessing
    plain: |
      He blessed Joseph and said, “May the God before whom my fathers Abraham and Isaac walked, the God who has been my shepherd all my life to this day, the Angel who has redeemed me from all harm, bless these boys. May they be called by my name and by the names of my fathers Abraham and Isaac, and may they increase greatly on the earth.”
  - range: 17-20
    heading: The younger before the elder
    plain: |
      When Joseph saw his father lay his right hand on Ephraim's head, he was displeased. He took his father's hand to move it from Ephraim's head to Manasseh's, and said, “Not so, my father. This one is the firstborn; put your right hand on his head.” His father refused. “I know, my son, I know. He too will become a people, and he too will be great. Nevertheless his younger brother will be greater than he, and his descendants will become a multitude of nations.”

      He blessed them that day: “By you Israel will pronounce this blessing: ‘May God make you like Ephraim and Manasseh.’” So he put Ephraim ahead of Manasseh.
  - range: 21-22
    heading: Jacob's last words to Joseph
    plain: |
      Israel said to Joseph, “I am about to die, but God will be with you and will take you back to the land of your fathers. And I give you one portion more than your brothers, which I took from the Amorites with my sword and my bow.”

notes:
  - ref: 2
    phrase: Israel strengthened himself
    kind: words
    title: Jacob and Israel in verse 2
    body: |
      The narrator calls the old man Jacob when Joseph is announced and Israel when he sits up, and one reading takes the change as deliberate. Jacob was his birth name; God gave him the name Israel, first at the ford ([[Gen. 32:28]]) and again at Beth-el ([[Gen. 35:10]]). The reading is that “Jacob, enfeebled with age, gathered up his strength for a work, which he was about to perform as Israel, the bearer of the grace of the promise.” From verse 8 on the narrator calls him Israel, through the blessing and his last words (verses 8–14, 21). Genesis does not explain the change.
    sources: [keil-genesis, lds-scriptures]
  - ref: 3
    phrase: God Almighty appeared unto me at Luz
    kind: scripture
    title: The promise at Luz
    body: |
      Before he adopts the boys, Jacob recalls a promise God had already made him. Luz was the old name of Beth-el ([[Gen. 28:19]]), and when God appeared to him there after he came out of Padan-aram, He said, “I am God Almighty: be fruitful and multiply; a nation and a company of nations shall be of thee, and kings shall come out of thy loins” ([[Gen. 35:9–12]]). Jacob gives the substance of it to Joseph in verses 3–4, and with “And now” (verse 5) turns to Joseph's sons.

      One reading is that the promise “empowered the patriarch to adopt the sons of Joseph in the place of children.” God had promised him a multitude of peoples, so he could take the two boys, born in Egypt “before his arrival, and therefore outside the range of his house,” and count them among his descendants. The text does not state the reasoning; it gives the promise and then the adoption.
    sources: [lds-scriptures, keil-genesis]
  - ref: 5
    phrase: are mine; as Reuben and Simeon, they shall be mine
    kind: history
    title: Why Jacob adopts Joseph’s sons
    body: |
      Jacob adopts Ephraim and Manasseh so that Joseph receives the firstborn's share through two tribes. The birthright had passed to Joseph: Reuben was the firstborn, but “forasmuch as he defiled his father's bed, his birthright was given unto the sons of Joseph” ([[1 Chr. 5:1–2]]; compare [[Gen. 49:3–4]]). The firstborn was owed a double portion ([[Deut. 21:17]]), “twice as much as any other son.” Jacob does not give Joseph a double share of one tribe. He makes Joseph's two sons tribes, “as Reuben and Simeon,” the first two of his own sons, so that “Joseph's double portion was shared by his sons, Ephraim and Manasseh,” and “each son's descendants became a separate tribe of Israel.”

      The count stays at twelve. The tribe of Levi was not “to receive tribal inheritance,” and “Two sons of Joseph, Manasseh and Ephraim, were given land inheritances. They were numbered among the tribes, in the stead of their father, Joseph.” Verse 6 limits the adoption to these two: any later sons of Joseph are to be “called after the name of their brethren in their inheritance,” counted within Ephraim and Manasseh.

      Joseph Smith's revision of these verses says why Jacob honors Joseph this way. In it Jacob says that God “hath blessed me in raising thee up to be a servant unto me, in saving my house from death; In delivering my people, thy brethren, from famine which was sore in the land,” and that Joseph will be “a light unto my people, to deliver them in the days of their captivity, from bondage; and to bring salvation unto them, when they are altogether bowed down under sin” (JST Gen. 48:8–11). The promise looks past Egypt: “Just as ancient Joseph saved his family temporally, his descendants will save Israel spiritually in the latter days.”
    sources: [lds-scriptures, scripture-helps-gen-42-50, ludlow-birthright, nelson-gathering, jst-gen-48]
  - ref: 7
    phrase: Rachel died by me
    kind: history
    title: Why Rachel is mentioned
    body: |
      Jacob's mention of Rachel in the middle of the adoption is explained, on one reading, by whose sons the boys are. Rachel was Joseph's mother ([[Gen. 30:22–24]]). She died on the road to Ephrath, giving birth to Benjamin, and Jacob set a pillar on her grave ([[Gen. 35:16–20]]). By adopting Joseph's sons Jacob, on this reading, honors “Joseph's mother, who had died so early,” and so “this explains the allusion”: she died “without living to see her first-born exalted to the position of a saviour to the whole house of Israel.” Genesis does not say this. It gives only the memory (“Rachel died by me”) and the place, “Ephrath; the same is Beth-lehem.”
    sources: [keil-genesis, lds-scriptures]
  - ref: 8
    phrase: Who are these?
    kind: history
    title: Jacob asks who the boys are
    body: |
      Jacob's question is odd, since he has just named the boys (verse 5), and the text gives its own answer two verses later: “the eyes of Israel were dim for age, so that he could not see” (verse 10). He could make out that others stood with Joseph, but not who they were.

      Some scholars explain the question another way, by how the chapter was put together. On this view most of the chapter comes from one source and verses 3–7 from another, so that at verse 8 “the narrative resumes the thread which was interrupted at Genesis 48:3,” in a story that “assumes that Jacob had not before met Joseph's sons.” That is one scholarly view. The Bible Dictionary's statement is that Moses “used several documentary sources from which he compiled the book of Genesis”; it does not say where one source ends and another begins.
    sources: [lds-scriptures, ryle-genesis, bd-pentateuch]
  - ref: 12
    phrase: from between his knees
    kind: history
    title: Between his knees
    body: |
      Joseph's bringing the boys “from between his knees” may mark a gesture of adoption, or simply the end of an embrace. The knees are Jacob's. One reading takes it as the formal act: “To set a child upon the knees was to symbolize reception or adoption into the family.” Rachel, giving Bilhah to Jacob, says Bilhah “shall bear upon my knees, that I may also have children by her” ([[Gen. 30:3]]), and Machir's children “were brought up upon Joseph's knees” ([[Gen. 50:23]]). The plainer reading is that Jacob, who had just “kissed them, and embraced them” (verse 10), “was sitting with the youths between his knees,” and Joseph now takes them back to set them before him for the blessing. Genesis does not describe a ceremony either way.
    sources: [ryle-genesis, keil-genesis, lds-scriptures]
  - ref: 14
    phrase: guiding his hands wittingly
    kind: words
    title: Crossing his hands
    body: |
      The Hebrew verb here is better read “crossing his hands”; the KJV's “wittingly” follows the other possible sense. The verb, *sikkel*, has the same consonants as a verb meaning “be prudent,” and that is the sense “wittingly” reflects. Here it is more likely a different verb, “lay crosswise,” which is how the Septuagint, the early Greek translation, took it: “guiding his hands crosswise.”

      What the gesture signifies is clearer than the verb. Joseph had put Manasseh at Jacob's right hand ([[Gen. 48:13]]), so the ordinary placing would have laid the right hand on the firstborn. Jacob crossed his arms to put it on the younger. The Church reads the right hand as “signifying that Ephraim would eventually receive Joseph's birthright.” It was no mistake of a man who could not see: when Joseph objects, Jacob answers, “I know it, my son, I know it” (verse 19). Elder Dallin H. Oaks named this blessing among those a father gives by the priesthood: “Worthy Melchizedek Priesthood holders can give blessings to their posterity. The scriptures record many such blessings,” Jacob's in this chapter and the next among them.
    sources: [bdb, biblehub-interlinear, lxx-rahlfs, scripture-helps-gen-42-50, oaks-priesthood-blessings-1987, lds-scriptures]
  - ref: 16
    phrase: The Angel which redeemed me from all evil
    kind: christ
    title: The Angel who redeemed him
    body: |
      Jacob blesses the boys in the name of one God whom he names three ways, and the third name is the Angel who redeemed him. The first is “the God, before whom my fathers Abraham and Isaac did walk.” The second is “the God which fed me all my life long”; the Hebrew verb is “shepherd,” so the phrase is “God, who shepherded me.” The third is “the Angel which redeemed me from all evil.” The verb is *ga'al*, “redeem, act as kinsman,” and with God as the subject it implies “personal relationship.” This is the only time the verb appears in Genesis, and so the first time in the Bible. The verb that follows, “bless,” is singular: Jacob asks one blessing of the God he has named three ways.

      Jacob's own history shows where he met this Angel. In a dream “the angel of God spake unto me” ([[Gen. 31:11]]), and said, “I am the God of Beth-el” ([[Gen. 31:13]]). The words here look back to the night he wrestled at Peniel ([[Gen. 32:24–30]]); in blessing Joseph's sons he “referred to events on the night of his wrestle.” That night ended with his saying, “I have seen God face to face, and my life is preserved” ([[Gen. 32:30]]). Hosea says that Jacob “had power over the angel, and prevailed: he wept, and made supplication unto him: he found him in Beth-el… Even the Lord God of hosts” ([[Hosea 12:4–5]]).

      Genesis does not say more about who the Angel is, and it does not separate him from God in these scenes: “In some passages the ‘angel of the Lord’ speaks as the voice of God Himself.” The name Hosea gives him is the divine name, which in the KJV “is generally denoted by Lord or God, printed in small capitals.” The Church teaches that “Jehovah is the premortal Jesus Christ,” and that “Jesus Christ is the great Redeemer of mankind because He, through His Atonement, paid the price for the sins of mankind.”
    sources: [bdb, oshb-wlc, biblehub-interlinear, lds-scriptures, skinner-keeper-covenants, bd-angels, bd-jehovah, gs-redeemer]
  - ref: 16
    phrase: let my name be named on them
    kind: words
    title: My name on them
    body: |
      Jacob asks that his own name, and his fathers', be put on the boys, and the Joseph Smith Translation says which name that is. The name God gave Jacob was Israel ([[Gen. 35:10]]). To have that name “named on them” is the language of adoption, “let them be counted as the children of Israel,” and the revision adds to verse 5 that the boys “shall be called after my name. (Therefore they were called Israel.)”
    sources: [jst-gen-48, ryle-genesis, lds-scriptures]
  - ref: 16
    phrase: let them grow into a multitude
    kind: symbol
    title: Like fish
    body: |
      The verb behind “grow into a multitude” may picture fish multiplying. Hebrew *dagah* means “multiply, increase.” It has been derived from the word for fish, *dag*, in the sense “to spawn, i.e. become numerous,” and Targum Onkelos, an ancient Aramaic paraphrase, makes the picture explicit: “and as the fish of the sea may they multiply.” The prayer asks for the boys what God had promised Jacob himself, “a multitude of people” (verse 4).
    sources: [bdb, strongs-concordance, etheridge-targums]
  - ref: 19
    phrase: his younger brother shall be greater than he
    kind: scripture
    title: The younger again
    body: |
      The chapter never says why Ephraim is chosen. The Church's reading is that Jacob's answer to Joseph “made it clear that this was the Lord's will,” and the Joseph Smith Translation and [[D&C 133:32–34]] “indicate that Jacob was directed by the Lord in giving the greater blessing to Ephraim.”

      It was not the first time. “The preference given to the younger reminds us of the blessing of Jacob himself.” Before he and Esau were born the Lord had said, “the elder shall serve the younger” ([[Gen. 25:23]]), and in Abraham's family “the birthright son … was not always the eldest”: so it was with Isaac, with Jacob, and with Joseph. The two blessing scenes are told alike. Isaac, too, gave his blessing when his “eyes were dim, so that he could not see” ([[Gen. 27:1]]), as Jacob's are here (verse 10). [The Birthright and the Firstborn](/genesis/themes/birthright/)
    sources: [scripture-helps-gen-42-50, ludlow-birthright, ryle-genesis, lds-scriptures]
  - ref: 20
    phrase: In thee shall Israel bless
    kind: words
    title: A blessing formula
    body: |
      The blessing becomes a saying: Israel will bless by saying, “God make thee as Ephraim and as Manasseh.” The Hebrew “in thee” is better “by thee,” and the sense is that “the blessing upon Ephraim and Manasseh shall be quoted as a formula for the invocation of Divine favour,” like the blessing on a bride at the gate, “The Lord make the woman that is come into thine house like Rachel and like Leah, which two did build the house of Israel” ([[Ruth 4:11]]).
    sources: [ryle-genesis, lds-scriptures]
  - ref: 20
    phrase: he set Ephraim before Manasseh
    kind: scripture
    title: Ephraim’s birthright
    body: |
      Ephraim's place before Manasseh is why the Church speaks of Ephraim's birthright. “Thus Ephraim received the birthright of Joseph, and Joseph received the birthright of Jacob (Israel).” Jeremiah names Ephraim the Lord's “firstborn” ([[Jer. 31:9]]), though Ephraim was not the firstborn of Joseph or of Jacob. Genesis 48 itself says only that Ephraim will be the greater. What that means in the last days comes from later scripture and Church teaching: “Ephraim was given the birthright in Israel… and in the last days it has been the tribe of Ephraim's privilege first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel.”

      Latter-day revelation describes that work. “The children of Ephraim” crown the gathered from the north countries with glory in Zion, “the richer blessing upon the head of Ephraim and his fellows” ([[D&C 133:30–34]]), and Isaiah says that “Ephraim shall not envy Judah, and Judah shall not vex Ephraim” ([[Isa. 11:13]]). The older brother is not set aside: Jacob says that Manasseh also “shall become a people, and he also shall be great,” and the Book of Mormon traces Lehi's family to him ([[Alma 10:3]]).
    sources: [ludlow-birthright, bd-ephraim, lds-scriptures]
  - ref: 22
    phrase: one portion above thy brethren
    kind: words
    title: Shechem, the one portion
    body: |
      Jacob's “one portion” is the Hebrew *shekhem*, which is also the name of the city Shechem, where he had bought a field ([[Gen. 33:18–19]]). The word means “shoulder,” and it is used here as a play on the name of the place. The Septuagint takes the hint and names the place: “And I give to thee Sicima, a select portion above thy brethren.” When Israel brought Joseph's bones up out of Egypt, “buried they in Shechem, in a parcel of ground which Jacob bought of the sons of Hamor the father of Shechem for an hundred pieces of silver: and it became the inheritance of the children of Joseph” ([[Josh. 24:32]]), and John places Sychar “near to the parcel of ground that Jacob gave to his son Joseph” ([[John 4:5]]).

      The “one portion above thy brethren” is also the firstborn's extra share. The birthright son received a double portion, “one portion as a son, the second portion as the new head responsible for the family.”
    sources: [bdb, lxx-rahlfs, biblehub-interlinear, lds-scriptures, ludlow-birthright]
  - ref: 22
    phrase: with my sword and with my bow
    kind: history
    title: Sword and bow
    body: |
      Jacob's claim to have taken the land “with my sword and with my bow” does not match anything Genesis tells about him, and readers have handled it differently. The only fighting at Shechem in Genesis was by Simeon and Levi, who “took each man his sword” and slew the males ([[Gen. 34:25]]); Jacob rebuked them ([[Gen. 34:30]]) and later cursed their anger ([[Gen. 49:5–7]]). His own acquisition there was a purchase ([[Gen. 33:19]]).

      The Targums, the ancient Aramaic paraphrases, show how early readers took the words. Onkelos has Jacob say he took the land “by my prayer and by my deprecation” (that is, entreaty). The Targum of Palestine has him join his sons at Shechem: “I arose and helped you with my sword and with my bow.” One reading rejects both the purchase and the sack of Shechem and takes the past tense as a *prophetic perfect*, Hebrew's way of speaking of a certain future act as already done: “Jacob would wrest the land from the Amorites, not in his own person, but in that of his posterity.” Genesis does not decide between these.
    sources: [lds-scriptures, etheridge-targums, ryle-genesis, keil-genesis]

christ: |
  Jacob's blessing names God as his redeemer and his shepherd. “The Angel which redeemed me from all evil” (verse 16) stands with God as the one giver of the blessing. Hosea calls the angel Jacob met “the Lord God of hosts” ([[Hosea 12:4–5]]), and the Church teaches that “Jehovah is the premortal Jesus Christ,” “the great Redeemer of mankind” (see the note on verse 16). The God who “fed me all my life long” (verse 15) is in Hebrew the God who shepherded him. In the next chapter Jacob calls Him “the shepherd, the stone of Israel” ([[Gen. 49:24]]), and Jesus says, “I am the good shepherd: the good shepherd giveth his life for the sheep” ([[John 10:11]]).

