chapter: 37
title: What Will Become of His Dreams
tagline: Jacob’s favorite son, Joseph, dreams that his family will bow to him. His brothers throw him in a pit, sell him to traders bound for Egypt, and send his bloodied coat to their father. In trying to see “what will become of his dreams,” they start them on the road to fulfillment.
when: 'Joseph is seventeen (verse 2) and lives with his father Jacob in the vale of Hebron (verse 14). The text gives no year.'

setting: |
  Genesis 36 closed the line of Esau. Chapter 37 turns to the family through whom the covenant goes on, and “These are the generations of Jacob” opens the last section of the book, the one in which “Joseph’s role as a preserver of Israel is also given emphasis.”

  The family is divided. Jacob has twelve sons by four women ([[Gen. 35:22–26]]). Rachel, Joseph’s mother, has died giving birth to Benjamin ([[Gen. 35:16–19]]), and Reuben, the firstborn, has lost standing by what he did with Bilhah ([[Gen. 35:22]]; [[Gen. 49:3–4]]). The scenes move between three places: Jacob’s home in the vale of Hebron, Shechem, some sixty miles north, and Dothan, some fifteen miles beyond that, on the road to Egypt. The next chapter turns aside to Judah ([[Gen. 38:1]]), and Joseph’s story picks up again in Egypt ([[Gen. 39:1]]).

  Later scripture comes back to this chapter. A psalm says that God “sent a man before them, even Joseph, who was sold for a servant” ([[Ps. 105:17]]). Stephen retells the sale before the high priest ([[Acts 7:9–14]]). The Book of Mormon adds what became of Joseph’s coat ([[Alma 46:23–24]]).

  The chapter has six parts: the favored son (verses 1–4), the dreams (5–11), the errand to Shechem (12–17), the plot and the pit (18–24), the sale (25–30), and the coat brought to Jacob (31–36).

thread: |
  Genesis 37 is the story of a plan to stop a prophecy. The brothers say so themselves: “we shall see what will become of his dreams” (verse 20). The pit and the sale that follow put Joseph on the road to Egypt, where the dreams come true. At the end of the story Joseph names what happened: “ye thought evil against me; but God meant it unto good” ([[Gen. 50:20]]). The chapter closes with the brothers sure they have won and Joseph in the house of an officer of Pharaoh (verse 36).

  The coat holds the chapter together. A father makes it (verse 3), the brothers strip it off (23), they dip it in goat’s blood and send it home (31–32), and Jacob knows it at once and reads his son’s death in it (33). The Hebrew phrase for the garment, *ketonet passim*, “long-sleeved tunic,” appears in verses 3, 23, and 32. It is the same garment in each scene: given in love, stripped off in hatred, and brought back as proof of death.

  Beneath both runs a word that fails. The brothers “could not speak peaceably” to Joseph (verse 4); Hebrew *shalom*, “peace,” is the thing they will not give him. Jacob then sends him to see how their *shalom* is (verse 14). The chapter ends with a father who “refused to be comforted” (verse 35) for a son who is alive in Egypt.

sections:
  - range: 1-4
    heading: The favored son
    plain: |
      Jacob settled in Canaan, where his father had lived as a foreigner. This is the story of Jacob’s family. Joseph, seventeen years old, was tending the flock with his brothers, the sons of Bilhah and Zilpah, and he brought his father a bad report about them. Israel loved Joseph more than any of his other sons, because Joseph was born when he was old, and he had a long robe made for him. His brothers saw that their father loved him most, and they hated him and could not say a friendly word to him.
  - range: 5-11
    heading: The dreams
    plain: |
      Joseph had a dream, and when he told his brothers they hated him even more. “Listen to this dream,” he said. “We were tying up sheaves of grain in the field, and my sheaf stood up and the others gathered around and bowed down to it.” His brothers said, “Do you think you will be our king? Will you rule over us?” They hated him more for his dreams and for what he said. Then he had another dream and told it to his brothers: “The sun, the moon, and eleven stars were bowing down to me.” He told it to his father as well, and his father scolded him. “What kind of dream is that? Are your mother and I and your brothers really going to bow down to the ground before you?” His brothers were jealous of him, but his father kept the matter in mind.
  - range: 12-17
    heading: The errand to Shechem
    plain: |
      His brothers had gone to pasture their father’s flock near Shechem. Israel said to Joseph, “Your brothers are pasturing the flock at Shechem. Come, I will send you to them.” “Here I am,” Joseph said. “Go and see how your brothers and the flocks are doing, and bring word back to me.” So he sent him from the valley of Hebron, and Joseph came to Shechem. A man found him wandering in the countryside and asked what he was looking for. “I am looking for my brothers,” Joseph said. “Can you tell me where they are pasturing?” The man said, “They have gone on from here. I heard them say, ‘Let’s go to Dothan.’” So Joseph went after them and found them at Dothan.
  - range: 18-24
    heading: The plot and the pit
    plain: |
      They saw him in the distance, and before he reached them they plotted to kill him. “Here comes that dreamer,” they said to one another. “Come on, let’s kill him and throw him into one of the pits. We can say a wild animal ate him. Then we’ll see what comes of his dreams.” Reuben heard this and rescued him from their hands. “Let’s not take his life,” he said. “Don’t shed any blood. Throw him into this pit in the wilderness, but don’t lay a hand on him.” He meant to rescue Joseph and take him back to his father. When Joseph reached his brothers, they stripped off his long robe and threw him into the pit. The pit was empty, with no water in it.
  - range: 25-30
    heading: The sale
    plain: |
      Then they sat down to eat. Looking up, they saw a caravan of Ishmaelites coming from Gilead, their camels loaded with spices, balm, and myrrh, on the way down to Egypt. Judah said to his brothers, “What do we gain if we kill our brother and hide his blood? Come, let’s sell him to the Ishmaelites and not lay a hand on him. He is our brother, our own flesh.” His brothers agreed. When some Midianite traders came by, Joseph was pulled up out of the pit and sold to the Ishmaelites for twenty pieces of silver, and he was taken to Egypt. When Reuben went back to the pit and found Joseph gone, he tore his clothes. He went back to his brothers and said, “The boy is gone! And I, where can I go?”
  - range: 31-36
    heading: The coat brought to Jacob
    plain: |
      They took Joseph’s robe, killed a goat, and dipped the robe in its blood. They sent the long robe to their father with the message, “We found this. See whether it is your son’s robe.” He recognized it. “It is my son’s robe,” he said. “A wild animal has eaten him. Joseph has been torn to pieces.” Jacob tore his clothes, put sackcloth on his waist, and mourned for his son many days. All his sons and daughters tried to comfort him, but he refused to be comforted. “No,” he said, “I will go down to the grave mourning for my son.” So his father wept for him. Meanwhile the Midianites had sold Joseph in Egypt to Potiphar, one of Pharaoh’s officers, the captain of the guard.

notes:
  - ref: 2
    phrase: These are the generations of Jacob
    kind: words
    title: Why Joseph’s story is “the generations of Jacob”
    body: |
      “These are the generations of Jacob” opens the story of Jacob’s sons, and the heading is not a slip. The Hebrew is *toledot*, an “account of a man and his descendants.” The whole book is built on these headings: its structure “rests on several genealogies. Each new section begins ‘These are the generations,’ and there follows a genealogical list of certain portions of family history.”

      The formula tells what came of a man through his children, not the story of the man himself. Esau’s line has just been given under it ([[Gen. 36:1]]), and the “generations of Isaac” ([[Gen. 25:19]]) turned out to be the story of Isaac’s sons, Jacob and Esau. So “the generations of Jacob” is the history of “the removal, through Joseph’s instrumentality, of the family of Jacob from Canaan into Egypt,” and it runs to the end of Genesis.
    sources: [bdb, bd-genesis, ellicott-genesis, lds-scriptures]
  - ref: 2
    phrase: their evil report
    kind: words
    title: What was the evil report?
    body: |
      Genesis does not say what Joseph reported, only that he reported it. The word is *dibbah*, defined as an “evil report, specifically a (true) report of evil doing,” with this verse given as the example. By that definition Joseph is not slandering his brothers; he is telling his father about real wrongdoing. The narrator gives no details. Even so, the report “brought upon him the odium of tale-bearing.”

      The report is the first of three causes of hatred in the chapter, followed by the father’s love (verses 3–4) and the dreams (verses 5–11).
    sources: [bdb, ryle-genesis]
  - ref: 3
    phrase: a coat of many colours
    kind: words
    title: What was Joseph’s coat?
    body: |
      The Hebrew is *ketonet passim*, and it may not mean “many colours.” *Ketonet* is the ordinary tunic worn next to the body. *Passim* is a word found only in this phrase, and it is taken to mean a “tunic reaching to palms and soles,” that is, a long tunic with sleeves, longer than the everyday kind. “Many colours” comes from the Septuagint, the ancient Greek translation, which reads “a coat of many colours,” and from the Latin Vulgate that followed it.

      The same two Hebrew words describe the garment of King David’s daughter Tamar, which the KJV renders “a garment of divers colours upon her: for with such robes were the king’s daughters that were virgins apparelled” ([[2 Sam. 13:18]]). So the coat was a mark of rank as much as of beauty. It may also have marked the birthright: “It is possible that Joseph received this coat to represent his role as Jacob’s birthright son.” Joseph “obtained the birthright in Israel because he was worthy and because it was his natural right,” when Reuben lost it, and First Chronicles says the same: Reuben defiled his father’s bed, “his birthright was given unto the sons of Joseph,” and “the birthright was Joseph’s” ([[1 Chr. 5:1–2]]). Genesis never says the coat meant this. If it did, it “would explain the intense hostility and jealousy the coat provoked,” for with Reuben set aside several of the older sons could have thought the birthright theirs: Simeon as the next of Leah’s sons, Judah because Simeon and Levi had disgraced themselves at Shechem, and Dan and Gad as the firstborn of the two handmaids.
    sources: [bdb, lxx-rahlfs, ryle-genesis, bd-joseph, scripture-helps-gen-37-41, ot-manual-gen-37-50, lds-scriptures]
  - ref: 5
    phrase: Joseph dreamed a dream
    kind: scripture
    title: Were Joseph’s dreams from God?
    body: |
      Genesis tells the dreams but does not say who sent them. When the Lord speaks to a patriarch in a dream, Genesis says so ([[Gen. 28:12–13]]); here no one speaks. Joseph Smith’s revision of Genesis 48 answers the question directly. Jacob tells Joseph there, “thy father’s house hath bowed down unto thee, even as it was shown unto thee, before thou wast sold into Egypt by the hands of thy brethren” (JST Gen. 48:10). The dreams were shown to Joseph.

      Dreams are “one way that God reveals His will to men and women on earth,” though “not all dreams are revelations,” and the Lord told Aaron and Miriam that to a prophet He would “speak unto him in a dream” ([[Num. 12:6]]). Joseph was “a visionary man, a dreamer and interpreter of dreams.”
    sources: [jst-gen-48, gs-dream, bd-joseph, lds-scriptures]
  - ref: 8
    phrase: Shalt thou indeed reign over us?
    kind: scripture
    title: The brothers’ question names the fulfillment
    body: |
      The brothers’ scornful questions describe, almost word for word, what Joseph becomes. In Hebrew each verb is said twice: “Shalt thou indeed reign (*malok timlok*)? or shalt thou indeed have dominion (*mashol timshol*)?” When Joseph reveals himself in Egypt, he says that God “hath made me a father to Pharaoh, and lord of all his house, and a ruler throughout all the land of Egypt” ([[Gen. 45:8]]). The word for “ruler” there is *moshel*, from the same verb as “have dominion.”

      The bowing in the dreams is fulfilled in the same way. “Made obeisance” and “bow down” both translate *hishtachavah*, the verb that appears when Joseph’s brothers arrive in Egypt: “bowed down themselves before him with their faces to the earth” ([[Gen. 42:6]]). Genesis makes the link itself: “Joseph remembered the dreams which he dreamed of them” ([[Gen. 42:9]]). When they bow again on the second journey, in the same words as the dreams ([[Gen. 43:28]]), “the Lord’s revelations were now fulfilled.”

      Book of Mormon readers will hear the question again. Laman says that Nephi means to “make himself a king and a ruler over us” ([[1 Ne. 16:38]]), the same charge Joseph’s brothers made: that he “wanted to usurp their authority” and “was lying about being guided by God.” Laman, Lemuel, and others once bound Nephi to leave him “in the wilderness to be devoured by wild beasts” ([[1 Ne. 7:16]]), as Joseph’s brothers plan to say that “some evil beast hath devoured him” (verse 20).
    sources: [oshb-wlc, biblehub-interlinear, ot-manual-gen-37-50, sc-knowhy-416, lds-scriptures]
  - ref: 10
    phrase: thy mother
    kind: history
    title: Whose “mother” bows to Joseph?
    body: |
      Joseph’s mother Rachel is already dead. She died on the road to Ephrath when Benjamin was born ([[Gen. 35:16–19]]), so when Jacob asks, “Shall I and thy mother and thy brethren indeed come to bow down ourselves to thee,” the question has a puzzle in it. Readers take it in two ways. One treats the sun, moon, and stars as a general picture of the whole family, “not to be too literally interpreted,” and suggests that Bilhah “had done a mother’s part by Joseph after Rachel’s death.” The other reads the moon as Rachel herself; one scholarly view that divides the chapter among sources takes “thy mother” to imply that in this version of the story Rachel was still alive.

      The text does not choose between them, and the meaning of the dream does not depend on the choice. The sun is Jacob and eleven stars are the eleven brothers, and the dream shows the whole house bowing. Jacob’s own reaction is also two-sided. He rebukes the dream, yet “his father observed the saying” in verse 11, literally “kept the word.” One reading traces Luke’s words about Mary to this phrase: she “kept all these sayings in her heart” ([[Luke 2:51]]).
    sources: [ellicott-genesis, ryle-genesis, lds-scriptures]
  - ref: 12
    phrase: went to feed their father’s flock in Shechem
    kind: history
    title: Why were the brothers at Shechem?
    body: |
      The brothers have gone back to Shechem, the city that Simeon and Levi destroyed after Dinah’s wrong ([[Gen. 34:25–29]]), and Jacob feared the result: “they shall gather themselves together against me, and slay me; and I shall be destroyed, I and my house” ([[Gen. 34:30]]). Yet Genesis recorded that as the family left, “the terror of God was upon the cities that were round about them, and they did not pursue after the sons of Jacob” ([[Gen. 35:5]]).

      The text does not say why the brothers returned. One reading is that Jacob’s sons “seem to have retained Shechem” by their “high-handed proceedings,” and that Jacob’s wealth was great enough to send flocks “so far away as to Shechem, a distance of sixty miles.” The errand sounds routine, but it takes Joseph to a place with a bloody history, to brothers who hate him.
    sources: [ellicott-genesis, lds-scriptures]
  - ref: 13
    phrase: Here am I
    kind: words
    title: Sent by his father, sent by God
    body: |
      “Here am I” is *hinneni*, “behold, I.” It is the answer Abraham gave God, Isaac, and the angel in chapter 22 ([[Gen. 22:1]]; [[Gen. 22:7]]; [[Gen. 22:11]]). Here it is Joseph’s answer to a father who says, “I will send thee unto them,” and then “he sent him out of the vale of Hebron” (verse 14). The verb for “send” is *shalach*.

      The same verb carries the story’s later reading. Joseph tells his brothers, “ye sold me hither: for God did send me before you to preserve life” ([[Gen. 45:5]]), and, more sharply, “it was not you that sent me hither, but God” ([[Gen. 45:8]]). The psalm sums it up in one line: “He sent a man before them, even Joseph, who was sold for a servant” ([[Ps. 105:17]]). Jacob sends Joseph to Shechem, and God sends him to Egypt by the road the brothers’ hatred would open.
    sources: [oshb-wlc, biblehub-interlinear, lds-scriptures]
  - ref: 14
    phrase: see whether it be well with thy brethren
    kind: words
    title: Joseph is sent to ask for their shalom
    body: |
      The errand is a question about peace. The Hebrew of Jacob’s command is “see the *shalom* of thy brothers, and the *shalom* of the flock.” Ten verses earlier *shalom* was what the brothers would not give Joseph: they “could not speak peaceably unto him” (verse 4), which on one reading means that they would not offer him the usual greeting, “Peace be with thee.” So the son who is unwelcome to his brothers is sent to ask how they are.

      What he meets is a conspiracy (verse 18). The word comes back when the roles are reversed. Years later Joseph, ruler in Egypt, meets the same brothers and “asked them of their welfare” (*leshalom*, [[Gen. 43:27]]), and he asks whether their old father is well.
    sources: [oshb-wlc, biblehub-interlinear, keil-genesis, lds-scriptures]
  - ref: 20
    phrase: we shall see what will become of his dreams
    kind: scripture
    title: Trying to see the dreams fail
    body: |
      The brothers’ plan ends in a test: *venir’eh mah yihyu chalomotav*, “and we shall see what will become of his dreams.” They want to watch the dreams fail.

      The rest of Genesis is the answer. At the end, Joseph says, “ye thought evil against me; but God meant it unto good” ([[Gen. 50:20]]). The Hebrew uses the same verb for both intentions: “you planned (*chashavtem*) evil against me; God planned (*chashavah*) it for good.” One reading goes further and sees in the sale the start of what the Lord told Abraham, that his seed would be “a stranger in a land that is not theirs” ([[Gen. 15:13]]): the sale was “to prepare the way, according to the wonderful counsel of God, for the fulfilment of the divine revelation to Abraham respecting the future history of his seed.”
    sources: [oshb-wlc, biblehub-interlinear, keil-genesis, lds-scriptures]
  - ref: 21
    phrase: And Reuben heard it, and he delivered him out of their hands
    kind: history
    title: Reuben, the firstborn, tries to save Joseph
    body: |
      Reuben talks his brothers out of killing Joseph. The narrator names his motive: “that he might rid him out of their hands, to deliver him to his father again” (verse 22). His plan was to throw Joseph into a cistern and come back for him. The pit was “empty, there was no water in it” (verse 24), so Joseph would not drown. In one reading, Reuben as the eldest was “specially responsible for his younger brother,” and the plan worked on the others because Joseph would “inevitably perish even in that pit,” so their malice was “satisfied.”

      Reuben was already a man who had lost ground. He had “lay with Bilhah his father’s concubine” ([[Gen. 35:22]]), and Jacob later says he is “unstable as water” ([[Gen. 49:4]]). The birthright “was given unto the sons of Joseph” ([[1 Chr. 5:1]]). So the son who forfeited the birthright pleads for the son to whom it would pass. But the sale was settled while Reuben was away, and when he found the pit empty he tore his clothes: “The child is not; and I, whither shall I go?” (verses 29–30). Years later he says to them in Egypt, “Spake I not unto you, saying, Do not sin against the child? … therefore, behold, also his blood is required” ([[Gen. 42:22]]).
    sources: [keil-genesis, lds-scriptures]
  - ref: 26
    phrase: What profit is it if we slay our brother
    kind: history
    title: Judah’s proposal, and the man he becomes
    body: |
      Judah proposes selling Joseph instead of killing him, and his reasons are mixed. “What profit is it if we slay our brother, and conceal his blood?” he asks, and then: “let us sell him to the Ishmeelites, and let not our hand be upon him; for he is our brother and our flesh.” In one reading his motive was “the feeling of horror… at incurring the guilt of fratricide,” while he would still like “to get rid of him, that his dreams might not come true.”

      Judah is the one who later offers to become a slave himself in place of Benjamin: “let thy servant abide instead of the lad a bondman to my lord” ([[Gen. 44:33]]). By then “Judah’s change of heart was shown to be complete.” The story placed between the two scenes, in which Judah is himself deceived ([[Gen. 38]]), “might help explain the change that is occurring in Judah,” though the text does not say what changed him.
    sources: [keil-genesis, sc-knowhy-841, ot-manual-gen-37-50, lds-scriptures]
  - ref: 28
    phrase: Then there passed by Midianites merchantmen
    kind: history
    title: Who sold Joseph, Ishmaelites or Midianites?
    body: |
      The chapter names the traders three ways and does not say who did what. They are “Ishmeelites” in verses 25, 27, and 28, “Midianites” in verse 28, and in verse 36 the Hebrew has *Medanim*, which the KJV also renders “Midianites.” The verbs in verse 28 (“they drew and lifted up… and sold”) have no stated subject, so it is unclear whether the brothers or the Midianites pulled Joseph out of the pit. Joseph later says both that his brothers sold him ([[Gen. 45:4]]) and that he “was stolen away out of the land of the Hebrews” ([[Gen. 40:15]]).

      Readers account for this in three ways. One is that “Ishmaelite” and “Midianite” were not strict tribal labels: both peoples descended from Abraham ([[Gen. 16:15]]; [[Gen. 25:2]]), and on this reading the two “were often confounded,” so traders could be called by either name. In Judges, the people Gideon defeats are “the kings of Midian,” yet “they were Ishmaelites” ([[Judg. 8:24]], [[Judg. 8:26]]). A second is that the chapter joins two accounts: in one, Midianites pull Joseph from the pit and carry him off, which is why Reuben later finds the pit empty and why Joseph says he was “stolen away”; in the other, the brothers sell him to Ishmaelites on Judah’s advice. Moses “used several documentary sources from which he compiled the book of Genesis,” but how those sources divide this chapter is a scholarly proposal, not a Church teaching. A third reading holds that, whatever lies behind the text, the confusion “can be seen as reflecting Joseph’s own confusion as he is taken to Egypt against his will.” On any reading, Joseph’s own words hold the brothers responsible: “ye sold me hither” ([[Gen. 45:5]]).
    sources: [keil-genesis, ryle-genesis, sc-knowhy-850, bd-pentateuch, oshb-wlc, lds-scriptures]
  - ref: 28
    phrase: for twenty pieces of silver
    kind: history
    title: The price of a slave
    body: |
      Twenty pieces of silver was an ordinary price. The Hebrew says only “for twenty of silver”; “pieces” is the translators’ word, and “shekels” is another way to fill the gap. The law of Moses sets the value of a male between five and twenty years old at “twenty shekels” ([[Lev. 27:5]]), and gives thirty shekels as the price of a servant gored by an ox ([[Ex. 21:32]]).

      Ancient documents show prices rising across the centuries. On the figures reported, the price was about ten pieces of silver in Third-Dynasty Ur, about twenty in the Old Babylonian period (Hammurabi’s laws and the archives at Mari), and thirty by the fifteenth century BC at Nuzi. Joseph’s price matches the Old Babylonian one. So the price alone does not explain the sale: the brothers “did not sell Joseph cheaply,” as if only to be rid of him, nor dear, as if for gain, and the reader is “left to look for a stronger reason why that transaction occurred.” Joseph gives it later: “God did send me before you to preserve life” ([[Gen. 45:5]]).
    sources: [biblehub-interlinear, oshb-wlc, sc-knowhy-842, lds-scriptures]
  - ref: 32
    phrase: know now whether it be thy son’s coat or no
    kind: words
    title: “Please recognize”
    body: |
      The message that carries the coat to Jacob is the same Hebrew phrase that later exposes Judah. “Know now” is *haker-na*, “recognize, please.” In Genesis 38 Judah’s signet, cord, and staff are returned to him with the words “Discern, I pray thee, whose are these” ([[Gen. 38:25]]), and the Hebrew is the same two words, which the KJV translates two ways. The son who helped deceive his father with a garment is later exposed by the same request (see the note on [[Gen. 38:25]]).

      Jacob’s answer in verse 33, “And he knew it,” uses the same verb: *vayyakkirah*, “and he recognized it.” The sons put the question as if they were unsure. The father recognizes the coat at once, and what he reads from it is wrong.
    sources: [biblehub-interlinear, sc-knowhy-841, lds-scriptures]
  - ref: 33
    phrase: Joseph is without doubt rent in pieces
    kind: scripture
    title: What the Book of Mormon adds about the coat
    body: |
      The brothers strip the coat and dip it in blood, but Genesis does not say they tore it. The Book of Mormon adds that they did. Captain Moroni tells his army: “we are a remnant of the seed of Joseph, whose coat was rent by his brethren into many pieces.” He recalls “the words of Jacob, before his death,” who “saw that a part of the remnant of the coat of Joseph was preserved and had not decayed,” and said: “Even as this remnant of garment of my son hath been preserved, so shall a remnant of the seed of my son be preserved by the hand of God, and be taken unto himself” ([[Alma 46:23–24]]). Genesis does not record this prophecy, and Moroni passes it on as “the language of Jacob” ([[Alma 46:26]]). Moroni’s people were that remnant: “one portion of Joseph’s descendants came to America about 600 B.C. and established two great peoples.”

      Moroni draws the warning in the same breath: “let us remember to keep the commandments of God, or our garments shall be rent by our brethren, and we be cast into prison, or be sold, or be slain” ([[Alma 46:23]]). The fates he names are the ones Joseph met or nearly met in Genesis: the coat rent, the plot to kill him (verse 20), the sale (verse 28), and later prison ([[Gen. 39:20]]).
    sources: [lds-scriptures, bd-joseph]
  - ref: 35
    phrase: I will go down into the grave unto my son mourning
    kind: words
    title: “The grave” is Sheol, and Joseph is not in it
    body: |
      “The grave” here is *sheol*, “the abode of departed spirits (corresponding to the Greek Hades), translated in the KJV ‘grave,’ ‘pit,’ and ‘hell,’ depending on the context,” and this verse is one of the examples. It is not a burial. Jacob thinks Joseph was devoured by an animal and not buried, so he could not be buried with him; what he says is that he will go down among the dead, still mourning, to where he supposes his son is.

      Two phrases from this scene return in Jeremiah. Reuben says of Joseph, “The child is not” (*einennu*, verse 30), and Jacob “refused to be comforted” (*vayema’en lehitnachem*, verse 35). In Jeremiah, Rachel, Joseph’s mother, “refused to be comforted for her children, because they were not” ([[Jer. 31:15]]); the Hebrew has the same verbs for “refuse” and “comfort,” and “they are not” (*einennu*) is the word Reuben used. Jeremiah does not say he is echoing Genesis; the shared words are the link.
    sources: [bd-sheol, ellicott-genesis, ryle-genesis, oshb-wlc, biblehub-interlinear, lds-scriptures]

christ: |
  “Joseph in many ways is a Christ figure,” and this chapter carries the first part of the likeness: a beloved son, rejected by some of his father’s other children, plotted against, stripped of his clothing, and sold for the price of a slave on the proposal of a man named Judah (“Judas” is the Greek form of the name). Joseph’s oldest brother “looked for him in an empty pit; Christ’s senior Apostle looked for him in an empty tomb.”

  The likeness is in where the sale leads. Joseph, “as a type of Christ, entered Egypt in the lowly status of a slave in order to prepare a place for his family who would unwittingly follow him into Egypt.” What the brothers meant for evil God “meant… unto good, to bring to pass, as it is this day, to save much people alive” ([[Gen. 50:20]]); the note on [[Gen. 50:20]] sets this beside what came of Christ’s being delivered up. Stephen’s retelling runs the same way: the patriarchs, “moved with envy, sold Joseph into Egypt: but God was with him” ([[Acts 7:9]]). The likeness between Joseph’s making himself known to his brothers and the Savior’s coming again is taken up in the note on [[Gen. 45:3]].

explore: |
  - **Judah in the middle of Joseph’s story.** Read [[Gen. 38]] and then [[Gen. 44:18–34]]. KnoWhy #841, “Why is the Judah and Tamar Story in the Middle of the Joseph Story?” (Scripture Central), follows the links.
  - **The dreams come true.** [[Gen. 42:6–9]]; [[Gen. 43:26–28]]; [[Gen. 50:18–21]].
  - **Joseph’s prophecies.** [[Gen. 49:22–26]]; [[2 Ne. 3:4–22]]; and [[Gen. 50:24–26]] with its Joseph Smith Translation (JST Gen. 50:24–38).
