chapter: 42
title: Joseph Knew His Brethren, but They Knew Not Him
tagline: Famine sends ten of Jacob’s sons to Egypt to buy grain, and they bow to the governor without knowing him. Joseph accuses them of spying, holds them three days, and keeps Simeon until they bring Benjamin. Their silver turns up in their sacks, and Jacob refuses to let Benjamin go.
when: 'Within the first two years of the seven years of famine (Gen. 45:6), more than twenty years after Joseph was sold. The text gives no calendar year.'

setting: |
  Joseph was about seventeen when his brothers sold him ([[Gen. 37:2]]; [[Gen. 37:28]]) and thirty when Pharaoh set him over Egypt ([[Gen. 41:46]]). Seven years of plenty followed, then the famine he had foretold: “the dearth was in all lands; but in all the land of Egypt there was bread” ([[Gen. 41:54]]). Egypt was “blessed with the most stable and regular agricultural system the world had ever had,” and “often when there was a famine, the people went to Egypt.” Abraham had gone down there in a famine too ([[Gen. 12:10]]). So “all countries came into Egypt to Joseph for to buy corn” ([[Gen. 41:57]]), and Jacob’s sons are among them.

  Chapters 42–45 are one story in four steps: this first journey, a second with Benjamin ([[Gen. 43]]), the silver cup ([[Gen. 44]]), and Joseph making himself known ([[Gen. 45]]).

  Later scripture remembers the famine and this journey. A psalm says the Lord “called for a famine upon the land” and “sent a man before them, even Joseph” ([[Ps. 105:16–17]]). Stephen retells it before the high priest: “when Jacob heard that there was corn in Egypt, he sent out our fathers first. And at the second time Joseph was made known to his brethren” ([[Acts 7:12–13]]).

  The chapter has five parts: Jacob sends ten sons (verses 1–5); the governor accuses them of spying (6–17); three days, a confession, and a hostage (18–24); the silver in the sacks (25–28); and Jacob’s refusal (29–38).

thread: |
  Genesis 42 turns on who recognizes whom. “Joseph knew his brethren, but they knew not him” (verse 8). The brothers who sold the dreamer cannot see him in the governor, while the governor sees them at once. What they cannot see in him they begin to see in themselves. On the third day they say, “We are verily guilty concerning our brother” (verse 21); the man they are speaking about hears them (verse 23) and turns away to weep (verse 24).

  Joseph’s harshness has a purpose, and it centers on the youngest brother. The spying charge, the three days, and the hostage all lead to one demand: bring Benjamin. That demand is read as a test of the brothers (see the note at verse 15), and chapter 42 does not finish it. It ends with Simeon in Egypt, the silver in the sacks, and a father who will not let go of the last son of Rachel.

  Jacob is the one person in the chapter who sees none of it. He counts his losses (“Joseph is not, and Simeon is not, and ye will take Benjamin away: all these things are against me,” verse 36), and the man who has bound Simeon is the Joseph he mourns. The reader knows what Jacob does not, and Joseph will say it himself when he is known: “God did send me before you to preserve life” ([[Gen. 45:5]]).

sections:
  - range: 1-5
    heading: Jacob sends ten sons to Egypt
    plain: |
      Jacob learned that there was grain in Egypt and said to his sons, “Why are you just staring at each other? I have heard there is grain in Egypt. Go down and buy some for us, so that we may live and not die.” Ten of Joseph’s brothers went down to buy grain. Jacob kept Benjamin, Joseph’s brother, at home; he was afraid that something terrible might happen to him. So the sons of Israel went along with the others who came to buy, because the famine had reached Canaan.
  - range: 6-17
    heading: The governor and the spies
    plain: |
      Joseph was the ruler of the land and the one who sold grain to everyone. His brothers came and bowed down to him with their faces to the ground. Joseph saw his brothers and knew who they were, but he acted like a stranger and spoke harshly to them. “Where have you come from?” “From the land of Canaan, to buy food.” Joseph knew his brothers, but they did not know him. He remembered the dreams he had dreamed about them and said, “You are spies! You have come to see where our land is undefended.”

      “No, my lord,” they said. “Your servants have come to buy food. We are all sons of one man; we are honest men, not spies.” “No,” he said, “you have come to see where the land is undefended.” They answered, “We are twelve brothers, sons of one man in Canaan. The youngest is with our father right now, and one is no more.” Joseph said, “It is just as I told you: you are spies. This is how you will be tested: as Pharaoh lives, you will not leave here unless your youngest brother comes. Send one of you to get your brother, and the rest will be kept in prison, so that your words can be tested to see whether you are telling the truth. If not, then as Pharaoh lives, you are spies.” And he held them all in custody for three days.
  - range: 18-24
    heading: Three days, a confession, and a hostage
    plain: |
      On the third day Joseph said to them, “Do this and live, for I fear God. If you are honest men, let one of your brothers stay confined in the prison where you have been held. The rest of you go and carry grain home for your hungry households. But bring your youngest brother to me, so that your words may be shown true and you will not die.” And they did so.

      They said to one another, “Truly we are guilty over our brother. We saw his distress when he pleaded with us, and we would not listen. That is why this distress has come on us.” Reuben answered, “Did I not tell you not to wrong the boy? But you would not listen, and now we must answer for his blood.” They did not know that Joseph understood them, because there was an interpreter between them. Joseph turned away from them and wept. When he came back, he spoke to them, took Simeon from among them, and bound him before their eyes.
  - range: 25-28
    heading: The silver in the sacks
    plain: |
      Joseph ordered their sacks filled with grain, each man’s silver put back in his sack, and food given them for the journey. And it was done. They loaded their donkeys and left. At the place where they stopped for the night, one of them opened his sack to feed his donkey and found his silver in the mouth of the sack. “My silver has been returned!” he said. “Here it is in my sack.” Their hearts sank, and they turned to one another trembling: “What is this that God has done to us?”
  - range: 29-38
    heading: Jacob refuses
    plain: |
      When they reached their father Jacob in Canaan, they told him everything that had happened. “The man who is lord of the land spoke harshly to us and took us for spies. We told him we were honest men, twelve brothers, sons of one father; one is no more, and the youngest is with our father in Canaan. The man said, ‘This is how I will know you are honest: leave one of your brothers with me, take food for your starving households, and go. Bring your youngest brother to me, and I will know you are not spies but honest men. Then I will give your brother back to you, and you may trade in the land.’”

      As they emptied their sacks, each man found his bundle of silver in his sack. When they and their father saw the bundles, they were afraid. Their father Jacob said, “You have robbed me of my children. Joseph is gone, Simeon is gone, and now you want to take Benjamin. Everything is against me!” Reuben said to his father, “You may kill my two sons if I do not bring him back to you. Put him in my care, and I will bring him back.” But Jacob said, “My son will not go down with you. His brother is dead, and he alone is left. If harm comes to him on the journey, you will bring my gray head down to the grave in sorrow.”

notes:
  - ref: 1
    phrase: corn in Egypt
    kind: words
    title: “Corn” means grain
    body: |
      “Corn” here means grain in general, not maize. In 1828 the word still “comprehends all the kinds of grain which constitute the food of men and horses”; in Great Britain it “is generally applied to wheat, rye, oats and barley,” while in the United States, “by custom, it is appropriated to maiz.” The Hebrew is *sheber*, “corn, grain, as food stuff.”
    sources: [webster-1828, bdb]
  - ref: 4
    phrase: Lest peradventure mischief befall him
    kind: history
    title: Why Jacob keeps Benjamin at home
    body: |
      Benjamin stays home because he is the last of Rachel’s sons. Rachel had died giving birth to him ([[Gen. 35:16–18]]), and with Joseph gone he “was Jacob’s only remaining son from his beloved wife Rachel.” Jacob gives the reason himself at the end of the chapter: “his brother is dead, and he is left alone” (verse 38).

      Jacob’s word for the danger, *ason*, “mischief, evil, harm,” is a rare one. It occurs only here, in verse 38, in Judah’s report of what Jacob said ([[Gen. 44:29]]), and in the law about a pregnant woman who is struck ([[Ex. 21:22–23]]). In Genesis it is always Jacob’s word, and always about Benjamin.
    sources: [bdb, ot-seminary-lesson-37, lds-scriptures]
  - ref: 6
    phrase: bowed down themselves before him with their faces to the earth
    kind: scripture
    title: The dreams begin to come true
    body: |
      The brothers’ bow is what Joseph dreamed, though only ten of them are bowing. In the first dream his brothers’ sheaves “made obeisance” to his sheaf ([[Gen. 37:7]]), and Jacob’s rebuke of the second dream used the words “to bow down ourselves to thee to the earth” ([[Gen. 37:10]]). The Hebrew verb and the word for “to the earth” are the same here as there (see the note on [[Gen. 37:8]]). Genesis ties the scenes together itself: “Joseph remembered the dreams which he dreamed of them” (verse 9). At this meeting Joseph “fulfills the earlier dreams he had,” since “he was now a ruler—a high government official.”

      But Benjamin is at home (verse 4), and the second dream had eleven stars ([[Gen. 37:9]]). The bow is repeated when Benjamin is with them ([[Gen. 43:26]]; [[Gen. 43:28]]). By then, “It had taken over two decades, but the Lord’s revelations were now fulfilled.”
    sources: [gee-clothes-cups, ot-manual-gen-37-50, biblehub-interlinear, lds-scriptures]
  - ref: 7
    phrase: he knew them, but made himself strange unto them
    kind: words
    title: Recognized, and not recognized
    body: |
      Genesis plays on one Hebrew verb here, and the KJV’s “knew... strange... knew” hides it. Joseph “recognized” his brothers (*vayyakkirem*), “made himself strange” to them (*vayyitnakker*, a reflexive form of the same root, “he acted as a stranger toward them”), and in verse 8 they “did not recognize” him (*hikkiruhu*). The root *nakar* is the one used when Jacob “knew” the coat ([[Gen. 37:33]]) and when Judah “acknowledged” the pledge ([[Gen. 38:26]]). The brothers who once asked their father to recognize Joseph’s coat cannot recognize Joseph.

      Why not? More than twenty years had passed, and “who would believe that a brother who was sold as a slave to a caravan of Arabians would have become the second most powerful man in Egypt?” Genesis also gives the marks of a disguise. Egyptians shaved while Semites tended to grow beards, and Joseph “shaved himself” ([[Gen. 41:14]]); Pharaoh had given him a new name ([[Gen. 41:45]]); and he spoke through an interpreter “as though he could not understand them” (verse 23).
    sources: [biblehub-interlinear, bdb, gee-clothes-cups, ot-manual-gen-37-50, lds-scriptures]
  - ref: 9
    phrase: to see the nakedness of the land
    kind: words
    title: “The nakedness of the land”
    body: |
      The charge is that the brothers came to find the land’s weak points. The Hebrew *ervat ha’arets* is literally “the nakedness of the land,” a figure for “its exposed, undefended parts”: where could an enemy get in? The charge would have sounded natural from an Egyptian official, given “the constant exposure of the Egyptians, on their eastern border, to raids and attacks from nomad hordes of Asiatics.” Joseph repeats it in verse 12 after the brothers have denied it.
    sources: [biblehub-interlinear, bdb, ryle-genesis]
  - ref: 15
    phrase: Hereby ye shall be proved
    kind: history
    title: What Joseph is testing
    body: |
      Joseph says outright that he is testing them, and the test centers on Benjamin. The Hebrew verb, *bachan*, “examine, try,” is used elsewhere of God testing a person’s heart: “Thou hast proved mine heart” ([[Ps. 17:3]]; compare [[Jer. 12:3]]). The proof Joseph asks for is the youngest brother: “except your youngest brother come hither.” Joseph “seemed to be giving his brothers opportunities to prove that they had changed and would not betray Benjamin as they had betrayed him,” and most of his tests turn on Benjamin, who “had become Jacob’s favored son after Joseph was sold into slavery.” The brothers had tried to kill Joseph and then sold him, and before he forgave them “he needed to see fruits meet for repentance—that is, evidence of their repentance.”

      The spying charge also led the brothers to tell Joseph about their family. When the brothers first stood before him he saw neither Benjamin nor his father, and on one reading he “accuses them of being spies... as a way of finding out about his family.” Defending themselves, they tell him that the youngest brother is with their father (verse 13). Genesis does not state Joseph’s motive. It shows what happens next (verses 21–24).
    sources: [biblehub-interlinear, bdb, scripture-helps-gen-42-50, gee-clothes-cups, lds-scriptures]
  - ref: 18
    phrase: This do, and live; for I fear God
    kind: words
    title: On the third day Joseph changes his terms
    body: |
      After three days Joseph softens his demand and gives a reason: “I fear God.” In verse 16 one brother was to go home for Benjamin while nine stayed in prison; now nine go home with grain and one stays bound (verse 19). “Ward” (*mishmar*) is the word Genesis uses for the confinement of Pharaoh’s butler and baker, “into the prison, the place where Joseph was bound” ([[Gen. 40:3]]). The brothers spend three days in the kind of place Joseph knew well; he “had endured a long experience of captive life in Egypt.”

      Until now Joseph has spoken as an Egyptian official, swearing “by the life of Pharaoh” (verses 15–16), “an Egyptian form of oath.” Now he speaks of God. In Genesis, “the fear of God” is what is expected to restrain a person from harming a stranger. Abraham had once assumed it was missing: “Surely the fear of God is not in this place; and they will slay me for my wife’s sake” ([[Gen. 20:11]]). One reading is that Joseph is telling his brothers that the ruler of Egypt “fears God, who protects the stranger and the defenceless,” and that there is perhaps “a reference to his brothers’ disregard of this fear of God in their former treatment of himself.”
    sources: [ryle-genesis, bdb, biblehub-interlinear, lds-scriptures]
  - ref: 21
    phrase: we saw the anguish of his soul, when he besought us, and we would not hear
    kind: words
    title: What the brothers remember that Genesis 37 does not say
    body: |
      The brothers confess something chapter 37 never recorded: that Joseph begged. There they strip him, throw him into the pit, and sit down to eat ([[Gen. 37:23–25]]), and nothing is said of what he said. Now, years later, they remember “the anguish of his soul, when he besought us, and we would not hear.” Two things in the Hebrew are worth seeing.

      First, Joseph’s “anguish” (*tsarat*) is the same word as the “distress” (*hatsarah*) that has now come on them: “therefore is this distress come upon us.” They measure what is happening to them by what they did to him. Second, the verb *shama’*, “hear, listen,” runs through the next three verses. They “would not hear” (verse 21); Reuben says, “ye would not hear” (verse 22); and in verse 23, “they knew not that Joseph understood them.” The word translated “understood” is the same verb, *shome’a*, here in the sense “understand (language).” The brothers would not listen to Joseph then. Joseph is listening to them now, and the interpreter (*melits*) who stands between them is why they speak so openly in front of him.
    sources: [biblehub-interlinear, bdb, lds-scriptures]
  - ref: 22
    phrase: his blood is required
    kind: scripture
    title: Reuben uses the language of Genesis 9:5
    body: |
      Reuben’s “his blood is required” is the language God used to Noah about the shedding of blood. In Hebrew it is *damo hinneh nidrash*, “behold, his blood is being sought.” The verb *darash*, “require,” is the one in [[Gen. 9:5]]: “at the hand of every man’s brother will I require the life of man.” The brothers did not kill Joseph, because Reuben had stopped them ([[Gen. 37:21–22]]), but they believe he is dead, and Reuben says the accounting is now being demanded. The phrase suggests that “Reuben realized they would be held accountable for what they had done to Joseph.”
    sources: [biblehub-interlinear, bdb, ot-seminary-lesson-37, lds-scriptures]
  - ref: 24
    phrase: turned himself about from them, and wept
    kind: history
    title: Joseph weeps, and the test goes on
    body: |
      Joseph weeps at what he overhears, and then goes on with the test. “Not knowing that Joseph recognized and could understand them, the brothers expressed their sorrow and regret for what they had done years earlier to him.”

      He turns away to hide his tears, as he will again when Benjamin comes (“he sought where to weep,” [[Gen. 43:30]]), and he weeps aloud when he makes himself known ([[Gen. 45:2]]). Here he does not yet show himself: he comes back, speaks to them, and binds Simeon in front of them.
    sources: [ot-seminary-2026-gen-42-45, lds-scriptures]
  - ref: 24
    phrase: took from them Simeon, and bound him before their eyes
    kind: history
    title: Why Simeon?
    body: |
      Genesis does not say why Joseph chose Simeon, and two reasons have been proposed. The first is birth order. Simeon was Jacob’s second son by Leah, after Reuben ([[Gen. 29:32–33]]), and Reuben had spoken for Joseph (verse 22; [[Gen. 37:21–22]]). On this reading Reuben “may have been spared” for “his previous kindness,” and Simeon was held “as the next oldest after Reuben.”

      The second reason is an inference. Simeon and Levi were the brothers who “slew all the males” of Shechem ([[Gen. 34:25]]), and Jacob later calls them “instruments of cruelty” ([[Gen. 49:5]]). On this reading Simeon was “the most cruel” of the brothers, “an inference” from those chapters “taken in conjunction with the present passage.” The text states neither reason.
    sources: [ryle-genesis, lds-scriptures]
  - ref: 25
    phrase: restore every man’s money into his sack
    kind: history
    title: Why Joseph gives the silver back
    body: |
      Genesis does not say why Joseph returned the silver. “Money” here is silver (*kesef*); before coinage, “payments were made by weight,” and the brothers later speak of “our money in full weight” ([[Gen. 43:21]]). One reading is that the silver was part of the test: Joseph “tested their honesty by returning their money in the grain sacks to see whether they would keep the money.”

      What the silver did is in the text. When they found it, “their heart failed them, and they were afraid” (verse 28), and the discovery frightened their father too (verse 35). Jacob’s own response when they must go back is practical: “carry it again in your hand; peradventure it was an oversight” ([[Gen. 43:12]]). The note at verse 35 takes up the other side of it: grain that in the end cost the brothers nothing.
    sources: [bd-money, biblehub-interlinear, gee-clothes-cups, lds-scriptures]
  - ref: 27
    phrase: in the inn
    kind: history
    title: Where the silver was found
    body: |
      The “inn” was probably a night’s camping place, not a building. The Hebrew *malon* is a “lodging-place,” here “merely a resting-place, not an inn,” since “there can hardly have been caravanserais at that time, either in the desert or by the desert road.”

      The verse also raises a puzzle. Here one man finds his silver at the night’s stop; in verse 35, all of them find theirs at home; and in chapter 43 the brothers tell Joseph’s steward that all of them found it at the lodging place ([[Gen. 43:21]]). One reading is that, in their alarm, they “neglected... to examine the rest of the sacks.” Another, a scholarly view, is that the verses come from two tellings of the story joined in Genesis, with verses 27–28 and verse 35 assigned to different sources. Moses “used several documentary sources” in compiling Genesis.
    sources: [bdb, keil-genesis, ryle-genesis, bd-pentateuch, lds-scriptures]
  - ref: 28
    phrase: What is this that God hath done unto us?
    kind: words
    title: The brothers see God’s hand, and their own guilt
    body: |
      The brothers take the returned silver as God’s doing. In Hebrew, “their heart failed them” is literally “their hearts went out” (*vayyetse libbam*), and they “trembled” (*vayecheredu*) to one another. One reading is that they “looked upon this incomprehensible affair as a punishment from God,” as they had taken their arrest in verse 21: “therefore is this distress come upon us.”

      God (*Elohim*) is named twice in this chapter: by Joseph, who says he fears Him (verse 18), and here by the brothers. Joseph will name Him again when he is known ([[Gen. 45:5–8]]).
    sources: [biblehub-interlinear, keil-genesis, lds-scriptures]
  - ref: 35
    phrase: every man’s bundle of money was in his sack
    kind: christ
    title: Bread without price
    body: |
      The brothers went home with grain that had cost them nothing, and that is read as a likeness of Christ. This is the verse cited for it: Joseph and Jesus “were saviors to their people and provided them with lifesaving bread,” and “Joseph provided bread for Israel and saved them from death, all without cost. Jesus, the Bread of Life, did the same for all men.” Genesis gives the facts the reading rests on. The brothers came to buy grain with silver, went home with the grain, and found every man’s *tseror*, his “bundle or pouch (purse) of money,” back in his sack.

      Jesus said, “I am the bread of life: he that cometh to me shall never hunger” ([[John 6:35]]). Jacob in the Book of Mormon invites: “he that hath no money, come buy and eat; yea, come buy wine and milk without money and without price” ([[2 Ne. 9:50]]). This is the Church’s reading of Joseph as a type of Christ. Genesis itself gives no reason for the returned silver (see the note at verse 25), and the brothers’ response here is fear, not gladness.
    sources: [scripture-helps-gen-37-41, ot-manual-gen-37-50, bdb, lds-scriptures]
  - ref: 36
    phrase: all these things are against me
    kind: words
    title: “Against me” is literally “upon me”
    body: |
      Jacob’s “all these things are against me” can also be read “all these things are upon me,” as burdens he must carry. The Hebrew is *alay hayu kullanah*, and one rendering of it is “are upon me, are burdens which I have to bear.” His list is of three losses in order: Joseph is not, Simeon is not, Benjamin will be taken. He uses the same word, *enennu*, “is not,” of Simeon as of Joseph, though Simeon is alive in Egypt.
    sources: [biblehub-interlinear, ellicott-genesis, lds-scriptures]
  - ref: 37
    phrase: Slay my two sons
    kind: history
    title: Reuben’s offer
    body: |
      Reuben offers his own sons as a pledge, and Jacob refuses. The offer need not be taken literally: one reading is that Reuben “simply means to offer his father a strong assurance that Benjamin would run no danger.”

      The offer that moves Jacob comes later, from Judah, who pledges himself and not his sons: “I will be surety for him; of my hand shalt thou require him” ([[Gen. 43:9]]); “let thy servant abide instead of the lad a bondman to my lord” ([[Gen. 44:33]]). That offer is among the “indications that Joseph’s brothers had indeed changed”: Judah “offered to take Benjamin’s punishment rather than allow Benjamin to be held in Egypt as a servant or slave.”

      Jacob’s refusal ends with the words “then shall ye bring down my gray hairs with sorrow to the grave.” The Hebrew for “the grave” is *sheol*, “the abode of departed spirits,” where Jacob has said he is going to join Joseph ([[Gen. 37:35]]). Judah quotes the words back to Joseph when he pleads for Benjamin ([[Gen. 44:29–31]]).
    sources: [ellicott-genesis, bd-sheol, biblehub-interlinear, scripture-helps-gen-42-50, lds-scriptures]

christ: |
  Many aspects of Joseph’s life “can remind us of Jesus Christ,” and two of the likenesses the Church draws are in this chapter. Joseph and Jesus both “were not recognized by those who should have known them.” Joseph’s brothers stand before him and know him not (verse 8); of Jesus, His hearers said, “Is not this Jesus, the son of Joseph, whose father and mother we know?” ([[John 6:42]]). The other likeness, the bread Joseph gave, is taken up in the note at verse 35.

  The revealing is still ahead, on the brothers’ second journey, and that scene too is read as a likeness of Christ (see the note on [[Gen. 45:3]]).

explore: |
  - **The second journey and the cup.** [[Gen. 43]] and [[Gen. 44]], with Judah’s pledge for Benjamin ([[Gen. 43:8–9]]; [[Gen. 44:18–34]]).
  - **Joseph makes himself known.** [[Gen. 45:1–8]]; [[Acts 7:9–16]]; [[Ps. 105:16–22]].
  - **The dreams.** [[Gen. 37:5–11]]; [[Gen. 43:26–28]].
  - **Joseph’s disguise and the cup.** “Clothes and Cups: The Tangible World of Joseph” (Religious Studies Center, BYU) follows Joseph’s garments and his silver cup through the story.

