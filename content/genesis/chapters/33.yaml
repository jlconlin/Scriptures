chapter: 33
title: Jacob and Esau Meet
tagline: Jacob bows seven times, and Esau runs to him and weeps. Jacob presses his gift on his brother, saying that Esau’s face is “as though I had seen the face of God,” and the two part. Jacob settles at Succoth and Shechem, buys a field, and builds an altar he calls El-elohe-Israel.
when: 'The return from Haran, after twenty years away ([[Gen. 31:41]]). The text gives no year.'

setting: |
  Jacob is coming home after twenty years in Laban’s house ([[Gen. 31:41]]). He left Canaan because his brother Esau had said in his heart, “then will I slay my brother Jacob” ([[Gen. 27:41]]). On the road back, messengers told him that Esau was coming to meet him with four hundred men ([[Gen. 32:6]]); he prayed, sent a large present ahead, and spent the night wrestling at the ford of the Jabbok ([[Gen. 32:22–24]]). This chapter is the meeting he had been preparing for, and reconciling with Esau was “one way Israel demonstrated his transformation.”

  The chapter has three parts: the meeting and the gift (verses 1–11), the brothers parting (12–16), and Jacob’s journey to Succoth and then across the Jordan to Shechem, where he buys a field and builds an altar (17–20). Esau goes back to Seir; the story next brings the two brothers together when they bury their father ([[Gen. 35:29]]). Jacob’s camp at Shechem leads straight into the next chapter, the story of Dinah and Shechem the son of Hamor ([[Gen. 34:1–2]]).

thread: |
  Genesis 33 answers chapter 32 with one word, *grace*. In his first message to Esau, Jacob said he had sent “that I may find grace in thy sight” ([[Gen. 32:5]]). In this chapter the Hebrew noun for that favor, *chen*, comes back three times as Jacob’s request (verses 8, 10, 15: “find grace in the sight of my lord”). The verb it comes from, *chanan*, “be gracious,” comes twice, both times with God as the giver: the children God “hath graciously given” (verse 5) and “God hath dealt graciously with me” (verse 11). The King James Version renders all five with “grace” or “graciously.” One root carries both what Jacob hopes for from his brother and what he credits to God, and in verse 10 the two come together in a phrase that recalls Peniel, “the face of God” ([[Gen. 32:30]]).

  From there the chapter turns from the meeting to a place to live. The gift is pressed on Esau until he takes it (verses 9–11), and the brothers part with courtesy (12–16). Jacob settles at Succoth and then comes to Shechem (verse 18). The Hebrew word there, *shalem*, can mean “safe,” and read that way it answers the “in peace” of his vow at Beth-el ([[Gen. 28:21]]). There he buys land and builds an altar, and in its name, *El-elohe-Israel* (verse 20), he uses the new name he received at Peniel ([[Gen. 32:28]]).

sections:
  - range: 1-3
    heading: Jacob goes out to meet Esau
    plain: |
      Jacob looked up and saw Esau coming with four hundred men. He divided his children among Leah, Rachel, and the two maidservants. He put the maidservants and their children in front, Leah and her children next, and Rachel and Joseph last. He himself went ahead of them all and bowed down to the ground seven times as he came near his brother.
  - range: 4-7
    heading: The embrace
    plain: |
      Esau ran to meet him, threw his arms around him, and kissed him, and they both wept. Esau looked up, saw the women and children, and asked, “Who are these with you?” Jacob answered, “The children God has graciously given your servant.” The maidservants and their children came forward and bowed down. Leah and her children came and bowed down. Last of all Joseph and Rachel came forward and bowed down.
  - range: 8-11
    heading: The gift
    plain: |
      Esau asked, “What did you mean by all these droves I met?” Jacob said, “To find favor in my lord’s eyes.” Esau answered, “I have plenty, my brother. Keep what is yours.” But Jacob said, “No, please. If I have found favor in your eyes, take my gift from my hand. To see your face is like seeing the face of God, and you have received me kindly. Please take my blessing that has been brought to you, because God has been gracious to me and I have everything.” He urged him, and Esau took it.
  - range: 12-16
    heading: The brothers part
    plain: |
      Esau said, “Let us set out, and I will go ahead of you.” Jacob said, “My lord knows that the children are young and that the flocks and herds are nursing their young. If they are driven hard for even one day, all the animals will die. Let my lord go on ahead of his servant, and I will follow slowly, at the pace of the livestock and the children, until I come to my lord in Seir.” Esau offered to leave some of his men with him, but Jacob said, “Why? Let me only find favor in my lord’s eyes.” That day Esau started back toward Seir.
  - range: 17-20
    heading: Succoth and Shechem
    plain: |
      Jacob traveled to Succoth, built himself a house there, and made shelters for his livestock, which is why the place is called Succoth, “booths.” After he came from Paddan-aram, he came to Shalem, a city of Shechem in the land of Canaan (or, as the Hebrew can also be read, came safely to the city of Shechem), and camped in front of the city. He bought the piece of land where he had pitched his tent from the sons of Hamor, Shechem’s father, for a hundred pieces of money. There he set up an altar and called it El-elohe-Israel.

notes:
  - ref: 2
    phrase: Rachel and Joseph hindermost
    kind: history
    title: Why the family is in a line
    body: |
      Jacob lines up his household from the handmaids to Rachel and Joseph, and the text does not say why. Two readings are possible. One is protection: Jacob put “those foremost whom he least esteemed, that if the foremost met with any evil, those who were behind might escape.” He had already split his camp for that reason, so that if Esau struck one company, “the other company which is left shall escape” ([[Gen. 32:8]]), and he had prayed that Esau would not “smite me, and the mother with the children” ([[Gen. 32:11]]).

      The other is display. Some have faulted Jacob for putting the handmaids in the most dangerous place, but it “would be a natural thing … in the Middle East for a clan leader to show off his family and possessions in such a way that the best and most highly favored is saved until last.” On that reading Jacob meant “to keep his choicest treasure to the last.” The line is never tested, because Esau runs to Jacob (verse 4).
    sources: [clarke-commentary, ot-manual-gen-24-36, lds-scriptures]
  - ref: 3
    phrase: bowed himself to the ground seven times
    kind: history
    title: The sevenfold bow
    body: |
      Jacob’s seven bows were “a sign of respect for his older brother,” and an attempt to win him over: by them Jacob sought “to propitiate him; for the cause of the quarrel had been Jacob’s usurpation of Esau’s right of precedence as the first born.” The number has a parallel in court etiquette. A letter from a Canaanite king to the king of Egypt, preserved among the Tel-el-Amarna tablets, says, “At the feet of the king, my lord, seven times and seven times do I fall.”

      Jacob goes ahead of his family to do it (verse 3), and then his household follows him: the handmaids, Leah, and then Joseph and Rachel each come and bow in turn (verses 6–7).
    sources: [madsen-jacob-esau, ellicott-genesis, ryle-genesis]
  - ref: 4
    phrase: Esau ran to meet him
    kind: prophets
    title: Esau had changed too
    body: |
      Latter-day teaching reads this meeting as Esau’s generosity as much as Jacob’s humility. Elder Neal A. Maxwell, speaking of how to teach “the principle of generosity in human relationships,” pointed to these chapters: Jacob “is anxious and assembles many gifts, but he had no reason to fear, for ‘Esau ran to meet him, and embraced him, and fell on his neck, and kissed him: and they wept.’” He went on: “Notice how not only Jacob but Esau has grown. Though Jacob’s anxiety was understandable, generous Esau soon relieved him of his concern.” He linked the scene to Joseph’s later generosity toward his brothers (see [[Gen. 50:19–21]]). Jacob’s humble approach was not “lost on Esau,” and after the embrace the brothers “now knew they could be friends.”

      The text does not say what Esau meant to do when he set out with four hundred men, and it does not make him the hero of the story: it is “fruitless to attempt to depict Esau as the hero,” because “the biblical text just does not portray him that way.” But “there were not any permanent hard feelings,” and at the end of the story the two brothers joined together to bury their father (see [[Gen. 35:29]]). [Brothers at Odds, and Reconciled](/genesis/themes/brothers-reconciled/)
    sources: [maxwell-teaching-opportunities, madsen-jacob-esau, schade-isaac-jacob, lds-scriptures]
  - ref: 4
    phrase: kissed him
    kind: words
    title: Dots over a kiss
    body: |
      In the Hebrew Bible, the word “kissed him” (*vayishaqehu*) has a dot over every letter. The dots belong to the Masoretic text, the traditional Hebrew text of the Old Testament, and a Masoretic note says of this word, “All of it punctuated.” Marks like these are called *puncta extraordinaria*, “extraordinary dots.” Why they were put here is not known; one likely explanation is that “the text was at an early date uncertain.”

      Later Jewish readers took the dots opposite ways. One rabbinic explanation said Esau came “not to kiss him, but to bite him,” a tradition that grew out of “the Israelite hatred of Edom.” Others held that the dots draw attention “to the change that had taken place in Esau, and the sincerity with which he received his brother Jacob.” Nothing in the verse supports the suspicious reading: Esau runs, embraces, and kisses, and both brothers weep.
    sources: [oshb-wlc, ryle-genesis, clarke-commentary, ellicott-genesis]
  - ref: 5
    phrase: graciously given
    kind: words
    title: Who gave the children
    body: |
      Jacob answers “Who are those with thee?” by crediting God. “Hath graciously given” is one Hebrew verb, *chanan*, “shew favour, be gracious,” which is used of God “in the bestowal of favours.” The Septuagint, the ancient Greek translation, reads “The children with which God has mercifully blessed thy servant.” Jacob uses the same verb of God again in verse 11, “God hath dealt graciously with me” (see the thread above).
    sources: [bdb, lxx-rahlfs, oshb-wlc]
  - ref: 9
    phrase: I have enough, my brother
    kind: words
    title: Two kinds of “enough”
    body: |
      The KJV gives Esau and Jacob the same words, but the Hebrew does not. Esau says *yesh-li rav*, “I have much” (verse 9): *rav* here is “abundant, enough,” and the Septuagint reads “I have much.” Jacob says *yesh-li kol*, “I have all” (verse 11): *kol* here is “all things,” and the Septuagint reads “I have all things.”

      Esau’s “much” fits his later life: it appears “that Isaac’s blessing upon Esau had come to pass and that he enjoyed an abundance of material possessions,” and later Genesis says of the two brothers, “their riches were more than that they might dwell together” ([[Gen. 36:7]]). Jacob’s “all” is a different claim. One reading is that “in the kindness of Esau he has everything,” perhaps also with an allusion to the blessing he had received at Peniel the night before ([[Gen. 32:29]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, schade-isaac-jacob, ryle-genesis, lds-scriptures]
  - ref: 10
    phrase: as though I had seen the face of God
    kind: words
    title: A brother’s face like God’s
    body: |
      Jacob says that Esau’s welcome is like seeing God’s face. The Hebrew is *kir’ot penei Elohim*, “as one sees the face of God.” It sounds like *Peniel* (“face of God”), the name Jacob gave the place of the wrestle the night before ([[Gen. 32:30]]), and the phrase very likely holds “a side allusion to the name of the locality, Peniel.” Read one way, it is “an elaborate compliment,” like the words used to David, “as an angel of God” ([[1 Sam. 29:9]]; [[2 Sam. 14:17]]). Read another, it is a recognition: in his brother’s face Jacob has “been met with divine (heavenly) friendliness.”

      “Thou wast pleased with me” is the verb *ratsah*, “be pleased with, accept favourably,” a verb used of God’s favor and, in this verse, of a brother’s. The wrestle at Peniel “helped prepare him to meet his brother.” Here is the meeting, and Jacob describes it in words that echo that night. What the Hebrew does not decide is whether he means a compliment or a recognition.
    sources: [oshb-wlc, ryle-genesis, keil-genesis, bdb, scripture-helps-gen-24-33, lds-scriptures]
  - ref: 11
    phrase: my blessing
    kind: words
    title: A gift called a blessing
    body: |
      Jacob calls his gift “my blessing,” and the word is an ordinary one for a gift. *Berakah*, “blessing,” can mean “a gift, present,” as it does here and in [[Josh. 15:19]] and [[2 Kgs. 5:15]]. Abigail, bringing provisions to David, calls them “this blessing which thine handmaid hath brought unto my lord” ([[1 Sam. 25:27]]). Before the meeting, Jacob had meant to “appease him with the present that goeth before me, and afterward I will see his face” ([[Gen. 32:20]]).

      Esau first refuses it, and Jacob “urged him, and he took it” (verse 11). Taking it mattered: “according to custom, the acceptance of the gift signified a reliable friendship had been formed.” Until Esau accepted, Jacob could not be sure of his welcome.
    sources: [bdb, madsen-jacob-esau, clarke-commentary, lds-scriptures]
  - ref: 14
    phrase: unto Seir
    kind: history
    title: Did Jacob mean to go to Seir?
    body: |
      Jacob promises to follow Esau “unto Seir” but never goes there in the story, and a reader may ask whether he deceived his brother. His stated reason for traveling separately is practical: “the children are tender, and the flocks and herds with young are with me: and if men should overdrive them one day, all the flock will die” (verse 13), and he declines Esau’s offer of men (verse 15).

      The text does not say whether he meant it. One reading is that “Jacob was perfectly sincere in his expressed purpose of visiting Esau at Seir,” but that “circumstances afterwards occurred that rendered it either improper or impracticable.” The narrative follows Jacob instead to Succoth and then to Shechem (verses 17–18).
    sources: [clarke-commentary]
  - ref: 17
    phrase: built him an house
    kind: history
    title: A house at Succoth
    body: |
      Jacob stops at Succoth and builds more than a camp. *Sukkot* means “booths,” which the verse gives as the reason for the place’s name. What Jacob built for himself was “not a ‘tent’ or a ‘booth,’ but a ‘house,’ as a sign of the more permanent character of his sojourn in the land.” How long he stayed is not said.

      The site “is not yet identified with any certainty,” but the passage implies “that it lay on the east of the Jordan, and south of the Jabbok.” Joshua puts Succoth “on the other side Jordan eastward” ([[Josh. 13:27]]), and Gideon crosses the Jordan to reach the men of Succoth ([[Judg. 8:4–5]]). That matters for verse 18: Jacob has not yet crossed back into Canaan, and in that verse he is “suddenly transferred from the east to the west side of the Jordan.”
    sources: [ryle-genesis, lds-scriptures]
  - ref: 18
    phrase: Shalem, a city of Shechem
    kind: words
    title: A city called Shalem, or “safely”?
    body: |
      The KJV takes *Shalem* as the name of a city, but the NIV, ESV, and NRSVUE take it as a word meaning “safely.” The Septuagint reads “Salem, a city of Secima,” as a place-name. But the word is also an adjective, *shalem*, “safe, unharmed, of person,” and the verse can be read with that sense instead of a place-name. The Samaritan Pentateuch reads *shalom*, “peace,” which is close to the “in peace” (*beshalom*) of [[Gen. 28:21]]. The NIV has Jacob “arrived safely,” and the ESV and NRSVUE “came safely.”

      On that reading, the verse answers Jacob’s vow at Beth-el, “So that I come again to my father’s house in peace” ([[Gen. 28:21]]): “What Jacob had asked for in his vow at Bethel … was now fulfilled.”
    sources: [lxx-rahlfs, bdb, niv, esv, nrsvue, keil-genesis, oshb-wlc, lds-scriptures]
  - ref: 19
    phrase: an hundred pieces of money
    kind: history
    title: The field at Shechem
    body: |
      Jacob pays for the ground under his tent, and that field stays in Israel’s story. The Hebrew coin word is *qesitah*, a “unit of (unknown) value, perhaps weight,” found only here, in [[Josh. 24:32]], and in [[Job 42:11]]. The Septuagint reads “a hundred lambs”; Joshua calls the price “pieces of silver.”

      Abraham had bought a burial cave ([[Gen. 23:16–20]]); Jacob buys the ground he lives on. One reading is that the purchase “showed that Jacob, in reliance upon the promise of God, regarded Canaan as his own home and the home of his seed.” Later, Joseph’s bones were buried there, and the field “became the inheritance of the children of Joseph” ([[Josh. 24:32]]).
    sources: [bdb, lxx-rahlfs, keil-genesis, lds-scriptures]
  - ref: 20
    phrase: El-elohe-Israel
    kind: words
    title: El, the God of Israel
    body: |
      Jacob names the altar with his new name, and the name is a confession. *El-elohe-Israel* means “El (God) is the God of Israel.” “Israel” is the name Jacob received at the Jabbok ([[Gen. 32:28]]), so the altar says that the God who changed his name is his God.

      The name also looks back to a vow. At Beth-el Jacob had vowed, “then shall the LORD be my God” ([[Gen. 28:21]]), and with this altar he gives glory to “the God of Israel” “according to his vow.” For the keeping of that vow at Beth-el itself, see the note on [[Gen. 35:1]]. In building it he does what Abraham had done at Sichem when he first entered Canaan ([[Gen. 12:6–7]]). The Septuagint reads the verse differently: Jacob “called on the God of Israel,” with no name for the altar. At Beth-el, later, Jacob again names a place for God: El-beth-el ([[Gen. 35:7]]).
    sources: [lds-scriptures, keil-genesis, lxx-rahlfs]

christ: |
  Reconciling estranged brothers is the kind of healing the Savior gives: “He is the great Mediator, and He is able to soften hearts and heal wounds. He knows how to bring people to a unity of heart and mind.”

  The field in verse 19 comes up in the Gospels too. John sets Jesus’s meeting with the Samaritan woman “near to the parcel of ground that Jacob gave to his son Joseph,” where “Jacob’s well was there. Jesus therefore, being wearied with his journey, sat thus on the well” ([[John 4:5–6]]). By tradition, the field Jacob bought is the plain where Jacob’s well is still pointed out.

explore: |
  - **The night before.** [[Gen. 32:3–32]]: the message, the present, the prayer, and the wrestle.
  - **The brothers elsewhere.** [[Gen. 35:27–29]] (they bury Isaac), [[Gen. 36:6–8]] (Esau moves to Seir), and [[Gen. 50:19–21]] (Joseph forgives his brothers, the scene Elder Maxwell links to this one).
  - **The priestly blessing.** [[Num. 6:24–26]] uses the same verb *chanan*, “be gracious,” as verses 5 and 11, together with “face.”
  - **A Church article on the whole story.** “Jacob and Esau,” *Ensign*, January 2002, follows the brothers from birth to the burial of Isaac.

