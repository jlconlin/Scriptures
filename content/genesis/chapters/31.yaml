chapter: 31
title: I Will Be with Thee
tagline: At the end of twenty years in Haran the Lord tells Jacob to go home. Jacob leaves without telling Laban, Rachel takes her father’s household gods, and Laban overtakes them in Gilead. God has warned Laban in a dream, and the two men part with a heap of stones between them.
when: 'The end of Jacob’s twenty years with Laban in Padan-aram (verses 38, 41). The text gives no year.'

setting: |
  Jacob came to Padan-aram as a fugitive from Esau, with the Lord’s promise at Beth-el that He would “bring thee again into this land” ([[Gen. 28:15]]). By the end of this chapter he has been there twenty years: “I served thee fourteen years for thy two daughters, and six years for thy cattle” ([[Gen. 31:41]]; compare [[Gen. 29:18–28]]; [[Gen. 30:25–43]]). He has become rich, Laban’s sons resent it, and Laban himself has turned cold.

  The chapter is Jacob’s departure from Laban, in five parts: God’s command to go home (verses 1–3), Jacob’s talk with Rachel and Leah (4–16), the secret flight and Rachel’s theft (17–21), Laban’s pursuit and the quarrel in Gilead (22–42), and the covenant that ends it (43–55). It sits between the years of service in chapters 29–30 and Jacob’s meeting with Esau in chapters 32–33, and it leaves Rachel’s theft of her father’s household gods unsettled; later Jacob has his household put away its “strange gods” near Shechem ([[Gen. 35:2–4]]).

  Hosea sums up these years in one verse: “Jacob fled into the country of Syria, and Israel served for a wife, and for a wife he kept sheep” ([[Hosea 12:12]]).

thread: |
  Genesis 31 is a quarrel over who gave Jacob what he has, and the chapter’s answer is God. Laban’s sons say Jacob “hath taken away all that was our father’s” (verse 1). Jacob says “God hath taken away the cattle of your father, and given them to me” (verse 9), and Rachel and Leah say the same of “all the riches which God hath taken from our father” (verse 16). Laban answers, “all that thou seest is mine” (verse 43), and then proposes a covenant. Underneath is the promise of Beth-el, “I am with thee” ([[Gen. 28:15]]), which God repeats in verse 3 and Jacob cites in verse 42: “Except the God of my father, the God of Abraham, and the fear of Isaac, had been with me, surely thou hadst sent me away now empty.” Laban admits that only a dream held his hand (verse 29).

  A second thread is one Hebrew verb, *ganav*, “steal,” which occurs eight times in the chapter. Rachel steals her father’s household gods (verse 19). Jacob “steals the heart” of Laban by leaving without a word (verses 20, 26, 27). Laban charges Jacob with stealing his gods (30). Jacob, not knowing who the thief is, says that whoever has them shall not live (32). And Jacob says Laban made him pay for what was “stolen by day, or stolen by night” (39, twice). Jacob himself had started the word, saying that any animal not speckled “shall be counted stolen with me” ([[Gen. 30:33]]).

sections:
  - range: 1-3
    heading: The command to go home
    plain: |
      Jacob heard that Laban’s sons were saying, “Jacob has taken everything that belonged to our father, and he has gotten all his wealth from it.” Jacob also saw that Laban no longer looked at him as he used to. Then the Lord said to him, “Go back to the land of your fathers and to your relatives, and I will be with you.”
  - range: 4-16
    heading: Jacob and his wives
    plain: |
      Jacob sent for Rachel and Leah to meet him in the field where his flock was. He told them, “I can see that your father’s attitude toward me has changed, but the God of my father has been with me. You know I have served your father with all my strength. Your father has cheated me and changed my wages ten times, but God did not let him harm me. When he said, ‘The speckled ones will be your wages,’ all the flock bore speckled young; when he said, ‘The striped ones,’ all bore striped young. So God has taken your father’s livestock and given it to me.”

      Jacob told them of a dream in the breeding season, in which he saw the rams that mated with the flock were striped, speckled, and spotted. The angel of God said to him in the dream, “Jacob,” and he answered, “Here I am.” The angel said, “Look: all the rams mating with the flock are striped, speckled, and spotted, for I have seen all that Laban is doing to you. I am the God of Beth-el, where you anointed a pillar and made a vow to me. Now get up, leave this land, and return to the land of your relatives.”

      Rachel and Leah answered, “Do we still have any share in our father’s house? He treats us like foreigners: he sold us and has used up the money paid for us. All the wealth God took from our father belongs to us and our children. Do whatever God has told you.”
  - range: 17-21
    heading: The flight
    plain: |
      Jacob put his children and wives on camels and drove off all his livestock and everything he had gained in Padan-aram, to go to his father Isaac in Canaan. Laban was away shearing his sheep, and Rachel stole her father’s household gods. Jacob deceived Laban the Aramean by not telling him he was leaving. He fled with everything he had, crossed the river, and headed for the hill country of Gilead.
  - range: 22-24
    heading: Laban pursues, and God warns him
    plain: |
      On the third day Laban was told that Jacob had fled. He took his relatives, chased Jacob for seven days, and caught up with him in the hill country of Gilead. But God came to Laban in a dream that night and said, “Be careful not to say anything to Jacob, either good or bad.”
  - range: 25-42
    heading: The search and the quarrel
    plain: |
      Jacob had pitched his tent in the hills, and Laban and his relatives camped in the hills of Gilead. Laban said, “What have you done? You deceived me and carried off my daughters like prisoners of war. Why did you slip away secretly instead of telling me, so I could send you off with a feast, with songs and tambourines and harps? You did not even let me kiss my grandchildren and my daughters goodbye. That was foolish. I have the power to harm you, but last night the God of your father told me, ‘Be careful not to say anything to Jacob, either good or bad.’ You wanted to go home, but why did you steal my gods?”

      Jacob answered, “I was afraid you would take your daughters from me by force. But if you find your gods with anyone here, that person will not live. Point out in front of our relatives anything that is yours, and take it.” Jacob did not know Rachel had stolen them. Laban searched Jacob’s tent, Leah’s, and the tents of the two maidservants and found nothing; then he went into Rachel’s tent. She had put the household gods in the camel’s saddle and was sitting on them. Laban searched the whole tent and found nothing. She said, “Do not be angry, my lord, that I cannot stand up before you; I am having my monthly period.” He searched, but did not find them.

      Jacob lost his temper. “What is my crime?” he said. “What is my sin, that you have chased me so hard? You have searched all my belongings; what have you found of yours? Put it here before our relatives and let them decide between us. Twenty years I have been with you. Your ewes and goats never miscarried, and I never ate the rams of your flock. I never brought you an animal torn by wild beasts; I took the loss myself, and you demanded payment for anything stolen, by day or by night. The heat consumed me by day and the cold by night, and sleep fled from my eyes. I served you fourteen years for your two daughters and six years for your flock, and you changed my wages ten times. If the God of my father, the God of Abraham and the Fear of Isaac, had not been with me, you would have sent me away empty-handed. God saw my hardship and the work of my hands, and last night He rebuked you.”
  - range: 43-55
    heading: The covenant at Gilead
    plain: |
      Laban answered, “These women are my daughters, these children are my children, these flocks are my flocks. Everything you see is mine. But what can I do today about my daughters or the children they have borne? Come, let us make a covenant, you and I, and let it be a witness between us.”

      Jacob took a stone and set it up as a pillar. He told his relatives to gather stones, and they made a heap and ate there on the heap. Laban called it Jegar-sahadutha, and Jacob called it Galeed. Laban said, “This heap is a witness between us today.” It was also called Mizpah, because he said, “May the Lord keep watch between you and me when we are out of each other’s sight. If you mistreat my daughters or take other wives besides my daughters, though no one else is with us, remember that God is witness between us.” He added, “Here is the heap and here is the pillar I have set up between us. This heap is a witness and this pillar is a witness that I will not cross it to harm you and you will not cross it to harm me. May the God of Abraham and the God of Nahor, the God of their father, judge between us.” Jacob swore by the Fear of his father Isaac. He offered a sacrifice on the mountain and invited his relatives to a meal, and they spent the night there. Early in the morning Laban kissed his grandchildren and his daughters, blessed them, and went home.

notes:
  - ref: 3
    phrase: Return unto the land of thy fathers
    kind: scripture
    title: The promise of Beth-el comes due
    body: |
      The command to go home answers a promise made at Beth-el twenty years earlier. Fleeing Esau, Jacob heard the Lord say, “I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land” ([[Gen. 28:15]]). Verse 3 is the second half of that promise: “Return… and I will be with thee.”

      The wait was long. When Joseph was born Jacob had already asked Laban, “Send me away, that I may go unto mine own place” ([[Gen. 30:25]]), and Laban persuaded him to stay. “It takes twenty years for the Lord to send instruction to Jacob that he must finally return home,” and it comes “only after Jacob has experienced great blessings of family but also great hardship and maltreatment.” Jacob goes when the Lord says, “Return.”
    sources: [lds-scriptures, schade-isaac-jacob]
  - ref: 7
    phrase: changed my wages ten times
    kind: words
    title: “Ten times” is a round number
    body: |
      “Ten times” most likely means “again and again,” not a count. The Hebrew word for “times” (*monim*), “counted number, time,” occurs only here and in verse 41, where Jacob repeats the charge. The phrase is used “to denote frequency… by a round number,” as in [[Num. 14:22]] and [[Job 19:3]]. The record gives no way to count ten changes (“ten times cannot be counted”), but “the nature of Laban makes it not unlikely that once Jacob began to prosper, Laban kept changing the terms of their agreement.”
    sources: [bdb, ryle-genesis, ot-manual-gen-24-36]
  - ref: 9
    phrase: God hath taken away the cattle of your father
    kind: words
    title: God snatched the flocks away
    body: |
      Jacob credits God with the flocks, and he uses a stronger verb than Laban’s sons do. The verb behind “taken away” here is *natsal*, which in its causative form means “snatch away, deliver”; here it has the sense of taking property away, as when a shepherd snatches prey from the mouth of a lion ([[1 Sam. 17:35]]). Rachel and Leah use the same verb in verse 16: “all the riches which God hath taken from our father.” Laban’s sons in verse 1 use the ordinary verb for “take” (*laqach*): Jacob “hath taken away all that was our father’s.” The KJV says “taken away” in both verses, which hides the difference: the sons say Jacob took the flocks; Jacob and his wives say God snatched them away.
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 10
    phrase: ringstraked, speckled, and grisled
    kind: words
    title: The dream of the rams
    body: |
      The rams in Jacob’s dream wear the three kinds of marking that decided his wages. The Hebrew words are *‘aqod*, “striped, streaked”; *naqod*, “speckled”; and *barod*, “spotted, marked (as if sprinkled with hail?)”. The KJV’s “grisled” is the old spelling of “grizzled,” that is, gray, which is not quite the sense of the Hebrew, and the exact sense of the third word is uncertain. The first two are marks named in the wage terms of verse 8 and of [[Gen. 30:32–35]].

      The dream is not told in chapter 30, where Jacob’s peeled rods seem to do the work ([[Gen. 30:37–43]]; see the note on [[Gen. 30:37]]). In the dream the angel gives the reason for the increase: “I have seen all that Laban doeth unto thee” (verse 12). The two accounts need not compete, since “self-help and divine help do not exclude one another.” Some scholars assign the two chapters to different source documents, and Moses did use “several documentary sources from which he compiled the book of Genesis.” But the difference need not be “a contradiction… pointing to a difference in the sources”: speaking to his wives, Jacob “passes over his own stratagem in silence” and gives God the credit.
    sources: [bdb, ryle-genesis, keil-genesis, bd-pentateuch, lds-scriptures]
  - ref: 13
    phrase: I am the God of Beth-el
    kind: scripture
    title: Beth-el is a promise and a vow
    body: |
      God names Himself by Beth-el to remind Jacob of a vow as well as a promise. The one who speaks in verse 11 is “the angel of God,” and he speaks in the first person: “I am the God of Beth-el.” At Beth-el the Lord had said, “I am the Lord God of Abraham thy father” ([[Gen. 28:13]]), and Jacob had answered with a vow: if God brought him home in peace, “then shall the Lord be my God,” and “of all that thou shalt give me I will surely give the tenth unto thee” ([[Gen. 28:21–22]]). The command to go home is God keeping His word. The vow still has to be kept, and Jacob does not stop at Beth-el on the way. It takes a later command from God, “Arise, go up to Beth-el” (see the note on [[Gen. 35:1]]).
    sources: [lds-scriptures]
  - ref: 14
    phrase: Is there yet any portion or inheritance for us in our father’s house?
    kind: history
    title: Rachel and Leah’s answer
    body: |
      Rachel and Leah answer as women who have been cheated, and they side with Jacob. Laban, they say, “hath sold us, and hath quite devoured also our money”: he kept the bride-price earned by Jacob’s fourteen years of work instead of providing each daughter with a dowry from it. A dowry mattered: it “was compensation for a daughter’s separation from the family property and was a critical part of establishing a new household,” including “her security should she become widowed or divorced.” So “portion or inheritance” is a real complaint, and their conclusion is the one Jacob needed: “now then, whatsoever God hath said unto thee, do.”

      Jacob had called them out to the field (verse 4), and “before acting upon the command, Jacob counseled with Leah and Rachel.” “Their finest moment in scripture occurs when their voices combine to give inspired counsel to their husband,” and the sisters “eventually overcame their rivalry and united in their family’s best interest.” (For Laban’s trick at their wedding, see [[Gen. 29:21–28]].)
    sources: [olson-matriarchs, lds-scriptures]
  - ref: 19
    phrase: Rachel had stolen the images that were her father’s
    kind: history
    title: What were the images?
    body: |
      The “images” were *teraphim*, household figures, and the text never says why Rachel took them. Teraphim were “a kind of idol, object of reverence, and means of divination”; where the word comes from is doubtful. Rachel’s were small enough to hide in a camel’s saddle and sit on (verse 34), though the one Michal laid in David’s bed was the size of a man ([[1 Sam. 19:13]]). Elsewhere teraphim are used for divination ([[Ezek. 21:21]]; [[Zech. 10:2]]), and Laban calls them “my gods” (verse 30), with the same word, *elohim*, that is used of God.

      Why Rachel took them is an old question. Josephus, in the first century, says that Jacob had taught her to despise such worship, and that she took the figures so that, if her father overtook them, she could use them to win his pardon. Others suggest that she meant to stop her father’s idolatry, or that the figures “were tied to legal rights of inheritance,” which would fit her complaint in verses 14–16. That last view leans on ancient tablets from Nuzi, which some scholars have read as tying possession of the household gods to inheritance. None of these explanations has “been overwhelmingly accepted in the absence of further evidence.”

      The text does show how the search ended. Rachel sat on them and pleaded “the custom of women” (verse 35); Josephus explains that Laban stopped searching, “not supposing that his daughter in such circumstances would approach to those images.” Later, when Jacob told his household to “put away the strange gods that are among you,” the gods they handed over were hidden under the oak by Shechem ([[Gen. 35:2–4]]). “If Laban’s teraphim were indeed household gods, Rachel did not keep them.”
    sources: [bdb, scripture-helps-gen-24-33, josephus-antiquities, olson-matriarchs, lds-scriptures]
  - ref: 20
    phrase: stole away unawares
    kind: words
    title: Stealing Laban’s heart
    body: |
      In Hebrew Jacob “stole the heart of Laban the Aramean” (*vayignov Ya‘aqov et-lev Lavan*). “Steal the heart” is an idiom meaning “deceive,” here and in verse 26, where Laban uses it of Jacob, and in verse 27, “stole me.” So the KJV’s “stole away unawares” in verse 20 and Laban’s “stolen away unawares to me” in verse 26 are the same Hebrew idiom, spoken first by the narrator and then by the man deceived. It is one of the eight uses of *ganav*, “steal,” that run through the chapter.

      Whether Jacob was right to go in secret is a question the text leaves open. He gives his reason in verse 31: “Because I was afraid: for I said, Peradventure thou wouldest take by force thy daughters from me.” Between the two men “there was a good deal of mutual deception, each trying to outdo the other.” Jacob’s “actions may not have been the best choice,” but “given past experiences, perhaps he feared Laban would take his family by force,” and God’s protection of him can be read as “upholding a righteous sufferer.” The Lord commands the return (verses 3, 13); nothing in the chapter says He commanded the secrecy.
    sources: [bdb, oshb-wlc, biblehub-interlinear, bd-laban, schade-isaac-jacob, lds-scriptures]
  - ref: 24
    phrase: Take heed that thou speak not to Jacob either good or bad
    kind: words
    title: Neither good nor bad
    body: |
      God’s warning to Laban is an idiom that forbids him to try to change what has been decided. The Hebrew is literally “Guard yourself lest you speak to Jacob from good to evil.” Laban knew the idiom, and used it himself when he agreed to Rebekah’s marriage: “we cannot speak unto thee bad or good” ([[Gen. 24:50]]). It means “not to say anything decisive and emphatic for the purpose of altering what had already occurred.”

      That is why Laban scolds Jacob in verses 26–30 but does not harm him or force him back. He says so himself: “It is in the power of my hand to do you hurt: but the God of your father spake unto me yesternight” (verse 29). God coming to a man outside the covenant line in a dream is not unique to Laban; He did the same for Abimelech ([[Gen. 20:3]]). Jacob reads the warning as a verdict on the twenty years: God “hath seen mine affliction and the labour of my hands, and rebuked thee yesternight” (verse 42).
    sources: [biblehub-interlinear, keil-genesis, ryle-genesis, lds-scriptures]
  - ref: 32
    phrase: With whomsoever thou findest thy gods, let him not live
    kind: scripture
    title: Jacob’s rash oath
    body: |
      Jacob, certain he is innocent, condemns the thief without knowing it is Rachel. The narrator spells out the irony: “For Jacob knew not that Rachel had stolen them.” The plain sense of his words is “I yield him up to thee even to be put to death.” Genesis does not say whether they had any consequence. Rachel dies in childbirth on the way to Ephrath ([[Gen. 35:16–19]]), and the rabbis read the oath as a prophecy of her early death, but the text draws no line between the two.

      Joseph’s brothers later give “as rash an answer” about Joseph’s missing cup: “With whomsoever of thy servants it be found, both let him die” ([[Gen. 44:9]]). The cup is found in the sack of Benjamin, Rachel’s other son ([[Gen. 44:12]]).
    sources: [ellicott-genesis, lds-scriptures]
  - ref: 43
    phrase: These daughters are my daughters
    kind: history
    title: Whose daughters, whose flocks?
    body: |
      Laban’s reply claims everything and answers nothing, but it may have had some legal footing. “Laban’s insistence that Jacob had no right to take away his wives and their children from their family home indicates a coexisting and competing system of marriage in that era.” “Arguably, Laban was legally protected in his demands to keep his daughters’ families at their maternal home.” The text does not decide the point. Laban answers his own question, “what can I do this day unto these my daughters, or unto their children which they have born?”, by proposing a covenant (verse 44).
    sources: [olson-matriarchs, lds-scriptures]
  - ref: 49
    phrase: The LORD watch between me and thee
    kind: words
    title: Mizpah is a warning, not a blessing
    body: |
      In context Mizpah is a guard against each other, not a farewell blessing. The name means “Watchtower,” and it names “the heap of stones raised by Jacob and Laban.” Laban explains it: the Lord is to watch “when we are absent one from another,” literally “when we are hidden” (*nissater*) one from another. What follows spells out what is being guarded against: no mistreating Laban’s daughters, no crossing the heap and pillar “for harm” (verses 50, 52). God is invoked “because of the mutual distrust of the two parties, to watch lest one or the other should violate the compact,” so “the popular use of the word Mizpah, based on this verse, ignores the context.”

      The covenant is sealed with a meal. Jacob “offered sacrifice upon the mount, and called his brethren to eat bread” (verse 54); “To partake of food together was the sign of restored friendship and trust between disputing parties.” Isaac’s covenant with Abimelech had been sealed the same way, with a feast, an oath, and a parting “in peace” ([[Gen. 26:28–31]]).
    sources: [bd-mizpah, biblehub-interlinear, ryle-genesis, lds-scriptures]
  - ref: 53
    phrase: The God of Abraham, and the God of Nahor, the God of their father, judge betwixt us
    kind: words
    title: Laban’s gods
    body: |
      Laban’s oath seems to call on more than one god, and Jacob does not swear by it. The Hebrew verb “judge” (*yishpetu*) is plural, and the last words, “the God of their father,” are missing from the Septuagint and some Hebrew manuscripts, so they may be a later gloss. Taken with the plural verb, the verse seems to treat the God of Abraham as different from the God of Nahor, and the Revised Version’s margin reads “gods.” That fits what Joshua says of the family: “Terah, the father of Abraham, and the father of Nachor… served other gods” ([[Josh. 24:2]]).

      Yet Laban is not simply a pagan. He tells Jacob, “I have learned by experience that the Lord hath blessed me for thy sake” ([[Gen. 30:27]]), uses the divine name in verse 49, and calls the *teraphim* his gods. He was “not a mere idolater, though he did call the teraphim his gods,” and to use teraphim “was probably not to worship strange gods but to worship the true God in a corrupt manner.” The picture is a mixed religion.
    sources: [oshb-wlc, lxx-rahlfs, ryle-genesis, ellicott-genesis, bd-teraphim, lds-scriptures]
  - ref: 53
    phrase: Jacob sware by the fear of his father Isaac
    kind: words
    title: The Fear of Isaac
    body: |
      Jacob answers Laban’s oath by swearing by “the Fear of Isaac,” a name for God used only here and in verse 42. The Hebrew *pachad* means “dread,” and in these two verses it is used “as designation of deity.” God is named by what Isaac felt toward Him. The name “clearly shews not that Isaac was regarded as a deity; but that He whom Isaac feared was the true God of Jacob.” Laban has just set the God of Abraham beside the god of Nahor; Jacob “swears by the one Being who was the sole object of Isaac’s worship.”
    sources: [bdb, biblehub-interlinear, ryle-genesis, ellicott-genesis]

christ: |
  The Lord who speaks in this chapter is Jehovah, and “Jehovah is the premortal Jesus Christ.” Verse 3 opens, “the LORD said unto Jacob.” The Lord who promised at Beth-el, “I am with thee” ([[Gen. 28:13–15]]), speaks again through “the angel of God” in verse 13: “I am the God of Beth-el.” By those words the angel “is shewn to be not a created angel, but Jehovah Himself in a manifested form.” In this chapter He keeps His word: He calls Jacob home (verse 3), shows him what Laban was doing (verse 12), and in a dream stops Laban from harming him (verse 24). Jacob’s own summary is that God “hath seen mine affliction and the labour of my hands” (verse 42).

explore: |
  - **The vow at Beth-el.** Read [[Gen. 28:10–22]] beside verse 13, and [[Gen. 35:1–7]], where Jacob pays it.
  - **How the twenty years were earned.** [[Gen. 29:15–30]] (the two wives) and [[Gen. 30:25–43]] (the flocks and the rods), which this chapter retells from Jacob’s side.
  - **What comes next.** The angels of God meet Jacob at once ([[Gen. 32:1–2]]), and the brother he fled waits ahead ([[Gen. 33:1–11]]).
  - **Rachel, Leah, and Jacob’s years with Laban.** In *From Creation to Sinai* (BYU Religious Studies Center), “The Matriarchs” follows Rachel and Leah through this chapter, and “Isaac and Jacob” reads Jacob’s years with Laban as the endurance of a righteous man.

