chapter: 24
title: The Lord Led Me
tagline: Abraham sends his senior servant back to his kindred to find a wife for Isaac. At the well the servant prays for a sign, and Rebekah gives it before he has finished praying. Her family agrees that “the thing proceedeth from the LORD,” and she answers, “I will go.”
when: 'After Sarah’s death (chapter 23). Isaac was forty when he married (25:20), so Abraham was 140 (21:5). The text gives no year.'

setting: |
  Genesis 24 is the longest chapter in Genesis, sixty-seven verses, and much of that length comes from telling one story twice. The narrator describes the meeting at the well (verses 10–27), and then the servant describes it again to Rebekah’s family (verses 34–49). The chapter stands between Sarah’s burial (chapter 23) and Abraham’s death ([[Gen. 25:7–8]]), and it carries the covenant story from Abraham to Isaac. It ends with Rebekah in “his mother Sarah’s tent.”

  Abraham’s family had divided long before. They had moved from Ur to Haran in northern Mesopotamia ([[Gen. 11:31]]; [[Abr. 2:4]]); at the Lord’s word Abraham went on into Canaan, and his brother Nahor’s branch of the family “remained at Haran.” News of that branch reached Abraham after the offering of Isaac, and the list of Nahor’s family named Bethuel’s daughter, Rebekah ([[Gen. 22:20–23]]).

  The question Abraham raises in verse 3 is whom the heir of the promise will marry, and the chapter tells how “the Lord prepared a way for Isaac and Rebekah to marry within the covenant.” Rebekah becomes the mother of Esau and Jacob ([[Gen. 25:21–26]]), and in chapter 27 she acts again, “ensuring the bestowal of the birthright on the younger child, as God intended.”

thread: |
  The key word of Genesis 24 is the Hebrew *hesed*, which the KJV translates “kindness” (verses 12 and 14), “mercy” (verse 27), and “kindly” (verse 49). It occurs eleven times in Genesis, and four of them are in this chapter. The servant asks the LORD to “shew kindness unto my master Abraham” (verse 12). He also asks for a way to know that the prayer is answered: a young woman who gives him the drink he asks for and offers, unasked, to water his camels too. “Thereby shall I know that thou hast shewed kindness unto my master” (verse 14). When it happens, he blesses the LORD, who “hath not left destitute my master of his mercy and his truth” (*hesed* and *emet*, verse 27). Then he asks Rebekah’s family for the same two things, to “deal kindly and truly with my master” (verse 49). *Hesed* is the loyalty of a covenant relationship (see the note on verse 12). In this chapter the LORD’s kindness to Abraham arrives through the kindness of people.

  The second strand is the journey. The servant sums up his own: “I being in the way, the LORD led me” (verse 27). Rebekah’s answer settles the story. Asked “Wilt thou go with this man?” she says, “I will go” (verse 58). Her answer echoes Abraham’s own departure ([[Gen. 12:1]]; see the note on verse 58).

sections:
  - range: 1-9
    heading: Abraham’s charge
    plain: |
      Abraham was now very old, and the Lord had blessed him in everything. He said to his senior servant, the one in charge of everything he owned, “Put your hand under my thigh. I want you to swear by the Lord, the God of heaven and of earth, that you will not take a wife for my son from the Canaanites I live among. Go to my own country and my own relatives and get a wife for my son Isaac.”

      The servant asked, “What if the woman will not come back with me to this land? Should I take your son back to the country you came from?” Abraham said, “Make sure you never take my son back there. The Lord, the God of heaven, who brought me out of my father’s house and my homeland and swore to give this land to my descendants, will send His angel ahead of you, and you will find a wife for my son there. If the woman will not come, you are free of this oath. Only do not take my son back there.” So the servant put his hand under Abraham’s thigh and swore to it.
  - range: 10-27
    heading: The prayer at the well
    plain: |
      The servant took ten of his master’s camels, with all his master’s goods at his disposal, and set out for Mesopotamia, to the town where Nahor lived. He made the camels kneel by the well outside the town in the evening, when the women come out to draw water, and prayed: “Lord, God of my master Abraham, make it happen for me today, and show kindness to my master. I am standing by the well while the young women of the town come out for water. Let it be that the girl I ask, ‘Please let me drink from your jar,’ and who answers, ‘Drink, and I will water your camels too,’ is the one You have chosen for Your servant Isaac. That is how I will know You have shown kindness to my master.”

      Before he had finished, Rebekah came out with her jar on her shoulder. She was the daughter of Bethuel, the son of Abraham’s brother Nahor and his wife Milcah. She was very beautiful, a virgin; no man had been with her. She went down to the well, filled her jar, and came up. The servant ran to her and asked for a little water. “Drink, my lord,” she said, and quickly lowered her jar and gave him a drink. Then she said, “I will draw water for your camels too, until they have had enough,” and she hurried back and forth to the well until all the camels had drunk. The man watched her in silence, waiting to learn whether the Lord had made his journey a success.

      When the camels had finished, he took out a gold nose ring weighing half a shekel and two gold bracelets weighing ten shekels. “Whose daughter are you?” he asked. “Is there room in your father’s house for us to spend the night?” She said, “I am the daughter of Bethuel, the son Milcah bore to Nahor. We have plenty of straw and feed, and room for you to stay.” The man bowed and worshipped the Lord: “Blessed be the Lord, the God of my master Abraham, who has not withheld His kindness and faithfulness from my master. The Lord led me on the way to the house of my master’s relatives.”
  - range: 28-49
    heading: The servant tells his errand
    plain: |
      The girl ran and told her mother’s household. Her brother Laban, seeing the ring and the bracelets on his sister and hearing her story, ran out to the man at the well. “Come in, you who are blessed by the Lord,” he said. “Why stand out here? I have made the house ready, and there is room for the camels.” The camels were unloaded and fed, water was brought to wash the feet of the servant and his men, and food was set before him. But he said, “I will not eat until I have told you why I am here.”

      “I am Abraham’s servant,” he said. “The Lord has blessed my master greatly, with flocks and herds, silver and gold, servants, camels, and donkeys. Sarah bore him a son in her old age, and he has given that son everything he has.” Then he told them about the oath, his prayer at the well, Rebekah’s answer, and the gifts. “I bowed and worshipped the Lord, who led me by the right road to find my master’s relative for his son. Now, if you will deal kindly and faithfully with my master, tell me; and if not, tell me, so that I know which way to turn.”
  - range: 50-61
    heading: “I will go”
    plain: |
      Laban and Bethuel answered, “This comes from the Lord; it is not for us to say yes or no. Here is Rebekah. Take her and go, and let her be your master’s son’s wife, as the Lord has said.” The servant bowed to the ground before the Lord. He brought out silver and gold jewelry and clothing for Rebekah, and costly gifts for her brother and mother. They ate and stayed the night.

      In the morning he said, “Let me go back to my master.” Her brother and mother said, “Let her stay with us a few days, ten or so; then she can go.” He answered, “Do not hold me back, now that the Lord has made my journey a success.” They said, “Let us call the girl and ask her.” They asked Rebekah, “Will you go with this man?” She said, “I will go.” So they sent her off with her nurse, Abraham’s servant, and his men, and they blessed her: “Our sister, may you become thousands upon thousands, and may your descendants take the gate of those who hate them.” Rebekah and her young women mounted the camels and followed the man.
  - range: 62-67
    heading: Isaac and Rebekah
    plain: |
      Isaac had come from the direction of Beer-lahai-roi, for he was living in the Negev. In the evening he went out into the field to meditate, and he looked up and saw camels coming. Rebekah looked up and saw Isaac, and she got down from her camel. “Who is that man walking across the field to meet us?” she asked. “He is my master,” said the servant. So she took her veil and covered herself. The servant told Isaac everything he had done. Isaac brought her into his mother Sarah’s tent, and she became his wife, and he loved her. So Isaac was comforted after his mother’s death.

notes:
  - ref: 2
    phrase: his eldest servant of his house, that ruled over all that he had
    kind: history
    title: The unnamed servant
    body: |
      The servant is never named in this chapter. The Hebrew calls him the “elder” (*zeqan*) of Abraham’s house, “the one who is ruling” over everything Abraham owned, so “eldest” means senior in rank as much as in years: he was Abraham’s “upper servant, who had the management of all his house.” He is usually identified with “Eliezer, the ‘eldest servant of his house,’” the steward Abraham had named years before: “the steward of my house is this Eliezer of Damascus” ([[Gen. 15:2]]).

      If so, the story has a quiet turn in it. When Abraham was childless he had said, “one born in my house is mine heir” ([[Gen. 15:3]]), and Eliezer was most likely “a servant who was legally adopted as Abraham’s son.” The Lord told Abraham that Eliezer would not be his heir ([[Gen. 15:4]]). If this is Eliezer, the man who once stood to inherit everything is now sent to find a wife for the son who did. The chapter never draws attention to him. He is “the servant” or “the man,” and he prays to “the LORD God of my master Abraham” (verses 12, 27, 42, 48).
    sources: [biblehub-interlinear, keil-genesis, hallen-rebekah, lds-scriptures, sc-knowhy-838]
  - ref: 2
    phrase: Put, I pray thee, thy hand under my thigh
    kind: words
    title: A hand under the thigh
    body: |
      The gesture was a way of taking an oath. It appears here (verses 2 and 9) and once more, when the dying Jacob asks Joseph to “put, I pray thee, thy hand under my thigh, and deal kindly and truly with me; bury me not, I pray thee, in Egypt” ([[Gen. 47:29]]). Both times an old man makes sure his wishes will be kept after he is gone. Abraham “made the servant take an oath in order that his wishes might be inviolably fulfilled, even if he himself should die in the interim.”

      The Hebrew word, *yarek*, means “thigh,” and also the loins “as seat of procreative power.” Jacob’s descendants are those who “came out of his loins” ([[Gen. 46:26]]), literally out of his *yarek*. In one reading, this “so-called bodily oath, was no doubt connected with the significance of the hip as the part from which the posterity issued.” That suits an oath about who would bear Abraham’s posterity.

      Joseph Smith also stopped at this verse. In his first manuscript of the Bible revision he wrote “put forth I pray thee thy hand under my head,” and in verse 9 the servant put his hand “under the head of Abraham.” The revised manuscript has “thy hand under my hand,” and in verse 9, “the servent put his hand, under the hand of Abraham.” The Church’s manual reads the revised gesture as “a token of the covenant being made between the two men, perhaps similar to our shaking hands.”
    sources: [lds-scriptures, keil-genesis, biblehub-interlinear, bdb, jsp-ot1, jsp-ot2, ot-manual-gen-24-36]
  - ref: 3
    phrase: thou shalt not take a wife unto my son of the daughters of the Canaanites
    kind: history
    title: Why not a Canaanite wife?
    body: |
      Abraham’s concern was the covenant. “The Canaanites of Abraham’s time worshipped idols and engaged in other practices that were contrary to the worship of Jehovah,” and “had Isaac married a Canaanite, he would not have been able to enter the Lord’s covenant of marriage and receive the Lord’s promised blessings associated with the Abrahamic covenant.” The law of Moses later forbade such marriages for the same reason: “they will turn away thy son from following me” ([[Deut. 7:3–4]]).

      Abraham’s kindred in Haran were not free of other gods either. Joshua says Abraham’s father “served other gods” ([[Josh. 24:2]]), and Laban later had household gods of his own ([[Gen. 31:30]]). But Rebekah’s family knew the LORD’s name and spoke of Him (verses 31 and 50). In Canaan “there was no one… whom Isaac could marry in the covenant. The covenant could only be preserved with someone from Abraham’s family in Haran.” The next generation shows what was at stake. Esau married two Hittite women, “which were a grief of mind unto Isaac and to Rebekah” ([[Gen. 26:34–35]]), and Isaac sent Jacob to this same family for a wife ([[Gen. 28:1–2]]).
    sources: [scripture-helps-gen-24-33, lds-scriptures, ot-seminary-2026-gen-24]
  - ref: 6
    phrase: Beware thou that thou bring not my son thither again
    kind: scripture
    title: Isaac must not go back
    body: |
      Abraham’s refusal rests on the promise of the land. He sends the servant to “my country, and to my kindred” (verse 4), the same two words (*eretz*, *moledet*) the Lord had used when He told Abraham to leave them: “Get thee out of thy country, and from thy kindred” ([[Gen. 12:1]]). In verse 7 Abraham recalls that call and the promise that followed it. The LORD “took me from my father’s house, and from the land of my kindred,” and swore, “Unto thy seed will I give this land” ([[Gen. 12:7]]). Isaac is that seed, and he stays in the land.

      So the bride must make Abraham’s journey instead. The servant’s worry is that the woman will not “follow” him (verse 5), literally “go after” him, and Abraham releases him from the oath if she will not (verse 8). He does not release him from the one condition he repeats: “only bring not my son thither again.”
    sources: [biblehub-interlinear, lds-scriptures]
  - ref: 10
    phrase: went to Mesopotamia, unto the city of Nahor
    kind: history
    title: The city of Nahor
    body: |
      The “city of Nahor” is the town where Abraham’s brother Nahor lived, and later chapters show it was Haran: Rebekah sends Jacob “to Laban my brother to Haran” ([[Gen. 27:43]]). Haran was “the place of Abraham’s (Abram’s) first settlement on leaving Ur of the Chaldees.” It lay “in the district near the source of the Euphrates and was a trading center of great importance.” The servant’s errand meant a journey of “nearly 1,200 miles” there and back.
    sources: [lds-scriptures, bd-haran, ot-seminary-2026-gen-24]
  - ref: 12
    phrase: shew kindness unto my master Abraham
    kind: words
    title: 'Kindness: hesed'
    body: |
      The servant asks God for *hesed*. The word means “goodness, kindness,” and it is used for the “kindness of men towards men, in doing favours and benefits.” It is also used for God. With *emet* (“firmness, faithfulness, truth”) it describes the LORD Himself, “abundant in goodness and truth” ([[Ex. 34:6]]). *Hesed* “has no adequate English equivalent. Translators of the King James Version of the Bible must have struggled with how to render” it. In President Nelson’s words, *hesed* “is a special kind of love and mercy that God feels for and extends to those who have made a covenant with Him.” So the servant is asking the LORD to keep faith with Abraham, the man He has covenanted with.

      The first half of his prayer is just as direct. “Send me good speed this day” is in Hebrew “cause it to happen before me today.” The verb, used of the LORD, means to “cause (the right thing) to occur.” He has made his plan; he asks God to make it happen.
    sources: [bdb, lds-scriptures, nelson-everlasting-covenant, biblehub-interlinear]
  - ref: 14
    phrase: let the same be she that thou hast appointed for thy servant Isaac
    kind: history
    title: A sign that tested character
    body: |
      The sign the servant asks for is a test of character, and it is his own plan. “Instead of just asking the Lord to solve his problem, he presented a plan for the Lord to confirm.” The plan was “a sign connected with the custom of the country.” He came at evening, “the time that women go out to draw water” (verse 11), and he would ask for a drink. The sign was what came next: a young woman who, without being asked, offers to water ten camels “until they have done drinking” (verse 19). Rebekah “hasted” and “ran” and drew for all of them (verses 18–20), and her “energy, discipline, and work ethic matched the servant’s list of characteristics for which he sought and prayed.”

      Even then he does not jump to a conclusion. He watches her “wondering… to wit whether the LORD had made his journey prosperous or not” (verse 21), and asks whose daughter she is (verse 23). He “did not give himself blindly up to first impressions, however, but tested the circumstances.” Only when she names Bethuel, the son of Nahor, does he bow and worship (verses 24–26).
    sources: [ot-manual-gen-24-36, keil-genesis, olson-matriarchs, lds-scriptures]
  - ref: 20
    phrase: ran again unto the well to draw water, and drew for all his camels
    kind: structure
    title: A bride found at a well
    body: |
      Genesis and Exodus tell three stories of a bride found at a well: Rebekah here, Rachel ([[Gen. 29:1–12]]), and Zipporah ([[Ex. 2:15–21]]). They follow what is called a “type-scene,” a story “modeled after a basic outline, with the specifics being changed depending on the individual story being told.” Hearers knew the pattern: “when a man went to another country, met a woman at a well, and obtained water from said well, … it was likely going to become a betrothal scene of some sort.” Then “the woman would often run home to tell her family, and arrangements would be made between the man and the family for marriage.” Rebekah “ran” home (verse 28) as Rachel later “ran and told her father” ([[Gen. 29:12]]). “Each version had differences, and these differences allowed the type-scene to fit each character’s historical circumstance and, perhaps more importantly, provide the audience with some deeper meaning.”

      In this telling the bridegroom is not even there, because Abraham “sent his servant to find a wife for Isaac rather than sending Isaac himself.” And the one who draws the water is the woman. At the other two wells the man waters the flock: Jacob “rolled the stone from the well’s mouth, and watered the flock” ([[Gen. 29:10]]), and “Moses stood up and helped them, and watered their flock” ([[Ex. 2:17]]). Here Rebekah does the work, and she drives the story. “Rebekah becomes an agent of change in all the stories in which she appears,” as she will again in chapter 27.
    sources: [sc-knowhy-854, lds-scriptures, olson-matriarchs]
  - ref: 29
    phrase: Rebekah had a brother, and his name was Laban
    kind: history
    title: Laban, and the family that answers
    body: |
      The narrator introduces Laban by what he notices first. He came out “when he saw the earring and bracelets upon his sister’s hands” (verse 30): “as soon as Laban her brother had seen the splendid presents and heard her account, he hurried out to the stranger at the well.” His welcome, “Come in, thou blessed of the LORD” (verse 31), is warm, and it uses the LORD’s name. He will matter far more in the next generation, when Jacob “lived with him and served him for 20 years. There was a good deal of mutual deception, each trying to outdo the other” (chapters 29–31).

      Rebekah’s brother and mother, more than her father, deal with the guest. Rebekah runs to “her mother’s house” (verse 28); Laban answers first, with Bethuel (verse 50); the gifts go to “her brother and to her mother” (verse 53); and it is “her brother and her mother” who ask her to stay (verse 55). That a brother “should have taken part with her father in deciding, was in accordance with the usual custom.”
    sources: [bd-laban, keil-genesis, lds-scriptures]
  - ref: 34
    phrase: I am Abraham’s servant
    kind: structure
    title: The story told twice
    body: |
      From verse 34 to verse 49 the servant tells the family everything the reader has just watched happen. The retelling is not a copy. The servant “rehearsed his story in detail to Laban with great diplomacy,” and the differences can be seen by setting the two side by side:

      - He begins with Abraham’s wealth and adds that Isaac is heir to it all: “unto him hath he given all that he hath” (verses 35–36).
      - Abraham sent him to “my country” (verse 4); the servant says “my father’s house” (verse 38).
      - He says nothing of Abraham’s insistence that Isaac must never come back (verses 6 and 8).
      - At the well he gave Rebekah the gold first and asked whose daughter she was afterward (verses 22–23). In his telling he asks first, and then “put the earring upon her face” (verse 47).

      What does not change is the center of the story. Both tellings have the prayer, the sign, and the answer that came “before I had done speaking in mine heart” (verse 45). And the family answers as he hoped: “The thing proceedeth from the LORD” (verse 50).
    sources: [bradshaw-genesis-24, lds-scriptures]
  - ref: 58
    phrase: I will go
    kind: words
    title: “I will go”
    body: |
      Rebekah’s answer is a single word in Hebrew, *elekh*, “I will go.” It answers the family’s question, “Wilt thou go?” (*hatelkhi*), and it uses the verb the Lord used when He sent Abraham: “Get thee out” (*lekh-lekha*, literally “go, for yourself”) “of thy country, and from thy kindred, and from thy father’s house” ([[Gen. 12:1]]). Abraham had to leave his country and his father’s house at the Lord’s word, and now Rebekah does the same. Her answer “is reminiscent of Abraham’s original departure.”

      She was not obliged to go so soon. Her brother and mother asked for “a few days, at the least ten” (verse 55); the Hebrew is simply “days or ten.” The family asked her, “inquire at her mouth” (verse 57), and “in their response, her family honored her opinion and wishes.” She chose to go at once.
    sources: [biblehub-interlinear, lds-scriptures, bradshaw-genesis-24, olson-matriarchs]
  - ref: 60
    phrase: be thou the mother of thousands of millions
    kind: scripture
    title: The blessing on the bride
    body: |
      “Thousands of millions” is in Hebrew “thousands of myriads” (*alfe revavah*), that is, thousands of ten thousands. The second half of the blessing is close to the words the LORD swore to Abraham at Moriah. There He said, “thy seed shall possess the gate of his enemies” ([[Gen. 22:17]]); here her family says, “let thy seed possess the gate of those which hate them.” (The note on [[Gen. 22:17]] explains the gate.)
    sources: [biblehub-interlinear, lds-scriptures]
  - ref: 62
    phrase: the well Lahai-roi
    kind: history
    title: Hagar’s well
    body: |
      Isaac is coming from Hagar’s well. There the angel of the LORD found her when she fled from Sarai, and she called the LORD “Thou God seest me”: “Wherefore the well was called Beer-lahai-roi” ([[Gen. 16:13–14]]). (The note on [[Gen. 16:14]] explains the name.) Isaac lived in the “south country,” the Negev (verse 62), and after Abraham’s death he “dwelt by the well Lahai-roi” ([[Gen. 25:11]]). The text does not say what brought him there now.
    sources: [lds-scriptures]
  - ref: 63
    phrase: Isaac went out to meditate in the field
    kind: words
    title: What Isaac was doing in the field
    body: |
      No one is sure what the Hebrew verb here (*lasuach*) means. The NRSVue translates “to walk” and notes, “Meaning of Heb uncertain.” One proposal reads it as a near-identical verb meaning to “go or rove about.” The ancient translators heard devotion in it. The Septuagint has “to meditate,” as the KJV does, and the Aramaic Targum Onkelos says Isaac “went forth to pray in the field, at the presence of the evening.”

      Whatever he was doing, the scene is built on two people looking up. Isaac “lifted up his eyes, and saw, and, behold, the camels were coming” (verse 63); “Rebekah lifted up her eyes, and when she saw Isaac, she lighted off the camel” (verse 64).
    sources: [biblehub-interlinear, nrsvue, bdb, lxx-rahlfs, etheridge-targums]
  - ref: 65
    phrase: she took a veil, and covered herself
    kind: history
    title: The veil
    body: |
      Rebekah veils herself for the man she is about to marry. The word (*tsa’if*) means a “wrapper, shawl, or veil.” “It was common for unmarried women in Rebekah’s day to go about in public with their faces unveiled. So when Rebekah put on a veil, it was a sign of her virtue, reverence, humility, and modesty and showed respect for her future spouse.” In the ancient world “veils most often indicated respectability.”

      The servant’s answer is worth noticing too. All through the chapter “my master” has meant Abraham; now he says of Isaac, “It is my master.” The phrase “subtly conveys the passing of the torch from Abraham to Isaac.”
    sources: [bdb, hallen-rebekah, olson-matriarchs, bradshaw-genesis-24]
  - ref: 67
    phrase: Isaac was comforted after his mother’s death
    kind: history
    title: Comforted after his mother
    body: |
      The Hebrew ends simply “after his mother”; the KJV supplies “death.” Sarah died at 127 ([[Gen. 23:1]]). She had borne Isaac at ninety ([[Gen. 17:17]]), so he was thirty-seven, and he married at forty ([[Gen. 25:20]]). He had been without her for about three years. He brings Rebekah into “his mother Sarah’s tent.”
    sources: [biblehub-interlinear, lds-scriptures]

christ: |
  The God who leads the servant is “the LORD God of my master Abraham,” Jehovah, and “Jehovah is the premortal Jesus Christ.” The “mercy” and “truth” the servant praises in verse 27 are His covenant love and faithfulness (see the note on verse 12). In Genesis 24 that love works through ordinary things: a prayer answered “before he had done speaking” (verse 15), a young woman’s generosity at a well, and a road the servant could see only afterward: “I being in the way, the LORD led me.”

  The meeting at the well comes back in the Gospel of John. Jesus sits by Jacob’s well in Samaria and asks a woman for a drink ([[John 4:5–7]]). “Even the New Testament has a woman-at-the-well type-scene,” but it turns out differently. Marriage is spoken of, and the woman goes into the town, “but to testify of Him, rather than be married to Him.” “This scene emphasizes the new kind of covenant relationship that Jesus is going to have with all people, not just with one woman.”

explore: |
  - **The other wells.** Read [[Gen. 29:1–20]], [[Ex. 2:15–21]], and [[John 4:5–42]] beside verses 10–28. KnoWhy #854 (Scripture Central), “Why Does Boaz Allude to a Well in Connection with His Meeting Ruth?”, sets the well stories side by side.
  - **Rebekah’s whole story.** [[Gen. 25:19–28]]; [[Gen. 26:34–35]]; [[Gen. 27:1–28:5]]. “The Matriarchs,” in *From Creation to Sinai* (BYU Religious Studies Center), follows her through it.
  - **Hesed.** [[Ex. 34:6–7]]; [[Ps. 136]]. President Russell M. Nelson, “The Everlasting Covenant” (*Liahona*, Oct. 2022), explains the word.
  - **Marriage in the covenant.** [[D&C 131:1–4]]; [[D&C 132:29–37]].

