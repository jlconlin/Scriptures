chapter: 40
title: Interpretations Belong to God
tagline: Two of Pharaoh’s officers join Joseph in prison and have dreams on the same night. Joseph tells the butler he will be restored and the baker that he will be executed, both within three days. He asks the butler to remember him, and the butler forgets.
when: 'In Egypt, while Joseph is in prison: after he was sold at seventeen (37:2) and before he stood before Pharaoh at thirty (41:46). The text gives no year; the next chapter opens “at the end of two full years” (41:1).'

setting: |
  Chapter 40 picks up where chapter 39 left Joseph. Sold into Egypt, he prospered in the house of Potiphar, “an officer of Pharaoh, captain of the guard,” until Potiphar’s wife accused him falsely and he was put “into the prison, a place where the king’s prisoners were bound” ([[Gen. 39:1–23]]). There “the LORD was with Joseph” ([[Gen. 39:21]]). Chapter 40 begins when two of Pharaoh’s own officers are sent to that prison.

  Dreams run through the Joseph story: his own in chapter 37, these two men’s here, Pharaoh’s in chapter 41. Here Joseph interprets dreams for others, and the butler’s memory of that later brings him to Pharaoh ([[Gen. 41:9–14]]).

  Later scripture looks back on these years. A psalm says that Joseph’s “feet they hurt with fetters” and that he was held “until the time that his word came: the word of the LORD tried him” ([[Ps. 105:17–19]]). Stephen tells the council that “God was with him, And delivered him out of all his afflictions” ([[Acts 7:9–10]]).

thread: |
  Genesis 40 is built on one phrase said twice and one request that goes unanswered. Joseph tells each officer that “within three days shall Pharaoh lift up thy head” (verses 13 and 19). For the butler, “lift up thy head” means restoration; for the baker, with the added “from off thee,” it means execution. Verse 20 gives both men one verb, “he lifted up the head of the chief butler and of the chief baker,” and the next two verses divide them. All of it comes true on the third day, “as Joseph had interpreted to them” (verse 22), and Joseph had said where the interpretation came from: “Do not interpretations belong to God?” (verse 8).

  The second thread is memory. Joseph asks the butler to “think on me” and to “make mention of me unto Pharaoh” (verse 14), and the chapter’s last verse says the butler did not “remember Joseph, but forgat him.” Joseph is left in what he calls “the dungeon” (verse 15), in Hebrew the same word as the pit his brothers put him in. Chapter 41 opens “at the end of two full years.” Psalm 105 says of that time, “the word of the LORD tried him.”

sections:
  - range: 1-4
    heading: The officers in prison
    plain: |
      Some time after these events, Pharaoh’s chief cupbearer and chief baker offended their master, the king of Egypt. Pharaoh was angry with his two officers and put them in custody in the house of the captain of the guard, in the prison where Joseph was held. The captain of the guard assigned Joseph to them, and he attended them. They were in custody for some time.
  - range: 5-8
    heading: Two dreams in one night
    plain: |
      One night both men had a dream, each with its own meaning. In the morning Joseph found them troubled and asked why they looked so downcast. “We had dreams,” they said, “and there is no one to interpret them.” Joseph said to them, “Don’t interpretations belong to God? Tell me your dreams.”
  - range: 9-15
    heading: The butler’s dream and Joseph’s request
    plain: |
      The chief cupbearer told his dream. “In my dream there was a vine in front of me, with three branches. It budded, blossomed, and its clusters ripened into grapes. Pharaoh’s cup was in my hand, and I took the grapes, squeezed them into Pharaoh’s cup, and put the cup in Pharaoh’s hand.” Joseph said, “This is what it means: the three branches are three days. In three days Pharaoh will lift up your head and restore you to your position, and you will put Pharaoh’s cup in his hand as you used to do when you were his cupbearer. But remember me when things go well with you. Please show me kindness: mention me to Pharaoh and get me out of this house. I was kidnapped from the land of the Hebrews, and here too I have done nothing to deserve being put in the dungeon.”
  - range: 16-19
    heading: The baker’s dream
    plain: |
      When the chief baker saw that the interpretation was favorable, he said to Joseph, “I also had a dream: there were three baskets of white bread on my head. In the top basket were all kinds of baked food for Pharaoh, and the birds were eating it out of the basket on my head.” Joseph answered, “This is what it means: the three baskets are three days. In three days Pharaoh will lift up your head, off of you, and hang you on a tree, and the birds will feed on your body.”
  - range: 20-23
    heading: The third day
    plain: |
      On the third day, Pharaoh’s birthday, he gave a feast for all his servants and lifted up the heads of the chief cupbearer and the chief baker in front of them. He restored the chief cupbearer to his position, and the cupbearer put the cup in Pharaoh’s hand. But he hanged the chief baker, just as Joseph had interpreted to them. The chief cupbearer, however, did not remember Joseph; he forgot him.

notes:
  - ref: 1
    phrase: the butler of the king of Egypt and his baker
    kind: words
    title: Pharaoh’s butler and baker
    body: |
      The butler and the baker were high officers of Pharaoh’s court, but Genesis does not say how they offended him. “Butler” is the Hebrew *mashqeh*, literally “one giving drink,” a cupbearer; it is the word for Nehemiah’s office: “For I was the king’s cupbearer” ([[Neh. 1:11]]). In 1828 a butler was still “A servant or officer in the houses of princes and great men, whose principal business is to take charge of the liquors.” Each man is called “chief” (*sar*) in verse 2, the chief of the butlers and the chief of the bakers, and Pharaoh is angry with “two of his officers.”

      “Offended” is the Hebrew *chat’u*, “sinned” (the Septuagint has “trespassed against their lord the king”), and in 1828 *offend* still had the sense “To transgress the moral or divine law; to sin; to commit a crime.” The text names no crime. It says only that Pharaoh was angry with them and put them in custody.
    sources: [bdb, biblehub-interlinear, oshb-wlc, webster-1828, lxx-rahlfs, lds-scriptures]
  - ref: 3
    phrase: the house of the captain of the guard
    kind: history
    title: Whose prison, and who was in charge?
    body: |
      The prison was in the house of the captain of the guard, and that captain is most likely Potiphar. “Captain of the guard” is the title the narrator gave Potiphar in [[Gen. 37:36]] and [[Gen. 39:1]] (the note on 39:1 explains it), and verse 7 calls the place “the ward of his lord’s house,” the house of Joseph’s master. Chapter 40 never names him, but Joseph’s master “is the officer in whose house is the prison.”

      How Joseph fits into that prison is told two ways. In chapter 39 “the keeper of the prison committed to Joseph’s hand all the prisoners” ([[Gen. 39:22]]); here the captain “charged Joseph with them, and he served them,” and the butler later remembers him as “servant to the captain of the guard” ([[Gen. 41:12]]). Read together, they describe one role: Joseph “had charge of all the prisoners” and “apparently visited them and took them their rations.” An Egyptian text tells of a prisoner to whom “a man of the household staff of Pharaoh was assigned,” and whose rations were brought in daily from the palace; “Joseph would have served this role to the other prisoners.” Another view, a scholarly proposal and not a Church teaching, holds that chapters 39 and 40 draw on different written accounts and that words in verses 3, 5, and 15 were added to bring the two together (see the note on [[Gen. 37:28]]). The Septuagint reads verse 4 differently: “the chief keeper of the prison committed them to Joseph,” as in chapter 39.
    sources: [lds-scriptures, gee-clothes-cups, ryle-genesis, lxx-rahlfs]
  - ref: 8
    phrase: Do not interpretations belong to God?
    kind: history
    title: Why there was no interpreter
    body: |
      The officers have no interpreter within reach, and Joseph answers that the meaning of a dream is God’s to give. In prison the two men “were cut off from society including those who served as dream interpreters.” In Egypt such interpreters “consulted manuals, a number of which are known,” in which “the situation in the dream is described, classified as either good or bad, and is then interpreted as a sign of what will happen in the future.” One such manual says that if a man sees himself in a dream eating grapes, “it is good because his own things will be given to him,” and it counts a dream of being given white bread as good too. Set beside it, Joseph’s reading of the butler’s dream “aligns with the ancient Egyptian interpretations of similar dreams,” and his reading of the baker’s does not. But “This was not the method that Joseph used”: his “interpretations from the Lord did not necessarily match those that Egyptian sages gave.”

      Joseph claims no such craft, here or before Pharaoh ([[Gen. 41:16]]). Pharaoh’s own “magicians” and “wise men” fail him ([[Gen. 41:8]]), and he says of Joseph, “Can we find such a one as this is, a man in whom the Spirit of God is?” ([[Gen. 41:38]]). Joseph was “a visionary man, a dreamer and interpreter of dreams.”

      Daniel’s story has the same shape: “The secret which the king hath demanded cannot the wise men, the astrologers, the magicians, the soothsayers, shew unto the king; But there is a God in heaven that revealeth secrets” ([[Dan. 2:27–28]]). Genesis does not say who sent the officers’ dreams. Joseph says only that the meaning is God’s to give.
    sources: [gee-clothes-cups, lds-scriptures, bd-joseph]
  - ref: 13
    phrase: shall Pharaoh lift up thine head
    kind: words
    title: To lift up the head
    body: |
      For the butler, “lift up thine head” means that the king will raise him out of disgrace. The Hebrew is *nasa’ et-rosh*, “lift the head,” and the same words describe what Evil-merodach of Babylon did for the exiled king of Judah: he “did lift up the head of Jehoiachin king of Judah out of prison” ([[2 Kgs. 25:27]]; repeated in [[Jer. 52:31]]). So here Pharaoh will “lift it up with favour,” and the next words in the verse say the same, “restore thee unto thy place.” The Septuagint renders the phrase “Pharao shall remember thy office.”

      The idiom does not say by itself which kind of lifting is meant. For the butler the words that follow say so; for the baker the next words say something else (see the notes on verses 19 and 20).
    sources: [oshb-wlc, biblehub-interlinear, ryle-genesis, lxx-rahlfs, lds-scriptures]
  - ref: 14
    phrase: think on me when it shall be well with thee
    kind: words
    title: Remember me
    body: |
      Joseph asks the butler to remember him and to mention him to Pharaoh, and in Hebrew the two requests are forms of one verb: “think on me” is *zekartani* (“remember me”), and “make mention of me unto Pharaoh” is *hizkartani* (the causative form of the same verb, “mention”). In this verse and in verse 23 the verb means remembering a person “to their advantage” (see the note on verse 23).
    sources: [biblehub-interlinear, bdb]
  - ref: 15
    phrase: stolen away out of the land of the Hebrews
    kind: words
    title: Stolen from the land of the Hebrews
    body: |
      “Stolen away” means kidnapped, and Joseph says it without naming who did it; the text does not say why. The Hebrew is *ganab*, the verb the law uses for taking a person: “he that stealeth a man, and selleth him … shall surely be put to death” ([[Ex. 21:16]]; compare [[Deut. 24:7]]). The Hebrew repeats the verb (“being stolen, I was stolen”), the construction the KJV renders “For indeed.” When he does speak plainly, he says, “I am Joseph your brother, whom ye sold into Egypt” ([[Gen. 45:4]]). For who sold him, Ishmaelites or Midianites, see the note on [[Gen. 37:28]]; for “Hebrew” as a name for Joseph’s people, the note on [[Gen. 39:14]].
    sources: [bdb, biblehub-interlinear, lds-scriptures]
  - ref: 15
    phrase: the dungeon
    kind: words
    title: The pit again
    body: |
      Joseph is in the same kind of place his brothers put him. The KJV says “dungeon,” but the Hebrew is *bor*, “pit,” the word translated “pit” in chapter 37, where the brothers “cast him into a pit: and the pit was empty, there was no water in it” ([[Gen. 37:24]]). Used of a prison, the word means a “dungeon (pit with no water in it … compare Genesis 37:24 above),” and the Septuagint has Joseph say, “they have cast me into this pit.”

      In Genesis the word occurs only in Joseph’s story: the pit of chapter 37 (verses 20, 22, 24, 28, 29), here, and in [[Gen. 41:14]], where Pharaoh’s servants “brought him hastily out of the dungeon.” The word for the pit where his troubles began is also the word for the place he is brought out of when his imprisonment ends. And “here also” joins the two halves of his sentence: stolen from his own land, and here put in a pit, having done nothing in either place to deserve it.
    sources: [oshb-wlc, biblehub-interlinear, bdb, lxx-rahlfs, lds-scriptures]
  - ref: 16
    phrase: three white baskets
    kind: words
    title: White baskets and bakemeats
    body: |
      The “white baskets” are baskets of white bread, and “bakemeats” are baked foods. “White” is the Hebrew *chori*, “white bread or cake,” so the phrase is “three baskets of white bread”; the Septuagint has “three baskets of mealy food.” “Bakemeats” in verse 17 is, in Hebrew, all kinds of “food for Pharaoh, the work of a baker.” In KJV English *meat* means “Food in general,” as in [[Gen. 1:29]].
    sources: [biblehub-interlinear, bdb, lxx-rahlfs, webster-1828, lds-scriptures]
  - ref: 19
    phrase: hang thee on a tree
    kind: history
    title: Beheaded and hung
    body: |
      Joseph’s reading for the baker can be taken as two acts: the head is taken off, and the body is hung up. The first is the butler’s idiom with one Hebrew word added, *me‘alekha*, “from off thee” (literally “from upon you”), which turns lifting the head into removing it; the Septuagint has “Pharao shall take away thy head from off thee.” The second, “hang thee on a tree,” is then read as the display of the body after the execution, “impaled, and allowed to hang exposed to public view.” The law of Moses has the same Hebrew phrase, and there too the hanging follows the death: “And if a man have committed a sin worthy of death, and he be to be put to death, and thou hang him on a tree: His body shall not remain all night upon the tree” ([[Deut. 21:22–23]]). Verse 22 says only that Pharaoh “hanged” him.

      What the reading adds, that the body would be left exposed to birds, mattered to an Egyptian. In Egypt “The safety of the soul after death was believed to depend on the care taken of the dead body,” and so the picture was “terrible to the Egyptian mind.”
    sources: [biblehub-interlinear, bdb, lxx-rahlfs, ryle-genesis, bd-egypt, lds-scriptures]
  - ref: 20
    phrase: he lifted up the head of the chief butler and of the chief baker
    kind: structure
    title: One verb, two fates
    body: |
      The two dreams and their interpretations follow one pattern, and they part at a single phrase. Each man says “in my dream” (verses 9, 16); each sees three of something and something of Pharaoh’s, his cup or his food. Joseph begins each answer with the same words, “The three … are three days,” and goes on, “Yet within three days shall Pharaoh lift up thy head” (verses 12–13, 18–19). In Hebrew the sentences are identical until the butler hears “and restore thee unto thy place” and the baker hears “from off thee.”

      Verse 20 then holds the two men together once more. One verb, “he lifted up,” governs both, and the Hebrew repeats its object: “the head of the chief butler and the head of the chief baker.” Only verses 21–22 separate them, the butler restored and the baker hanged, “as Joseph had interpreted to them.”
    sources: [oshb-wlc, biblehub-interlinear, lds-scriptures]
  - ref: 23
    phrase: did not the chief butler remember Joseph, but forgat him
    kind: scripture
    title: Two years forgotten
    body: |
      The chapter ends with Joseph’s one request, to be remembered, left undone. Two years later the butler does remember. Before Pharaoh he says, “I do remember my faults this day” ([[Gen. 41:9]]); the Hebrew verb is *mazkir*, the same verb in the same stem (the causative *hiphil*, “mention”) as Joseph’s “make mention of me” in verse 14. What he mentions first is his own fault, and he brings up Joseph only when Pharaoh needs an interpreter ([[Gen. 41:9–14]]).

      Psalm 105 reads the delay as a trial: Joseph “was laid in iron: Until the time that his word came: the word of the LORD tried him” ([[Ps. 105:18–19]]). The Hebrew verb for “tried” here means to “test (and prove true).”
    sources: [biblehub-interlinear, bdb, oshb-wlc, scripture-helps-gen-37-41, lds-scriptures]

christ: |
  Joseph does not take the gift as his own: “Do not interpretations belong to God?” (verse 8), and before Pharaoh, “It is not in me: God shall give Pharaoh an answer of peace” ([[Gen. 41:16]]). That is one of the likenesses between Joseph and Jesus Christ: “They gave God the glory for the good things they did.” Joseph’s words stand beside the Savior’s: “I do nothing of myself; but as my Father hath taught me, I speak these things. And he that sent me is with me” ([[John 8:28–29]]).

