chapter: 35
title: Jacob Returns to Beth-el
tagline: After the killing at Shechem, God tells Jacob to go back to Beth-el, and he first clears his household of its foreign gods. There God confirms the name Israel and the covenant of Abraham. On the road Rachel dies giving birth to Benjamin, Reuben sins against his father, and Isaac dies.
when: 'After Jacob’s return from Padan-aram and the killing at Shechem ([[Gen. 33:18–20]]; [[Gen. 34:25–31]]). The text gives no year. Verses 27–29 close Isaac’s story and are told ahead of their time (see the note on verse 28).'

setting: |
  Jacob has come home to Canaan after twenty years with Laban ([[Gen. 31:41]]). Near Shechem he bought a field and built an altar ([[Gen. 33:18–20]]). Then his daughter Dinah was assaulted ([[Gen. 34:2]]), and Simeon and Levi killed the men of the city; Jacob told them, “I shall be destroyed, I and my house” ([[Gen. 34:25–31]]). Genesis 35 is the way out. God tells him to go back to Beth-el, where, as a fugitive, he had vowed that if God brought him home in peace, “then shall the LORD be my God” ([[Gen. 28:20–22]]).

  Jacob himself looks back on this chapter at the end of his life. He tells Joseph that God Almighty appeared to him at Luz, and that “Rachel died by me” on the way to Ephrath ([[Gen. 48:3–7]]). Reuben’s act in verse 22 is answered in Jacob’s last blessing ([[Gen. 49:3–4]]) and explained in [[1 Chr. 5:1–2]].

thread: |
  Genesis 35 is about a vow kept and a family completed. In the first half Jacob goes back to Beth-el to do what he promised there as a fugitive ([[Gen. 28:20–22]]). He has the household’s foreign gods put away, builds the altar, and is given the covenant of Abraham in the order and nearly the words in which Abraham received it (see the note on verse 11). In the second half the promise of “a nation and a company of nations” (verse 11) begins to be fulfilled, and each step comes with a loss. The twelfth son is born as Rachel dies. The twelve sons are counted right after the sin of the eldest. And the story of Isaac ends with his burial.

sections:
  - range: 1-5
    heading: Go up to Beth-el
    plain: |
      God told Jacob, “Go up to Beth-el and stay there, and build an altar to the God who appeared to you when you fled from your brother Esau.” Jacob said to his household and everyone with him, “Get rid of the foreign gods you have, purify yourselves, and change your clothes. Let us go up to Beth-el, where I will build an altar to God, who answered me when I was in distress and was with me wherever I went.” They gave Jacob all their foreign gods and the rings in their ears, and Jacob buried them under the oak near Shechem. When they set out, a terror from God fell on the cities around them, and no one chased Jacob’s sons.
  - range: 6-8
    heading: The altar and Deborah’s grave
    plain: |
      Jacob and all his people came to Luz, that is, Beth-el, in the land of Canaan. He built an altar there and named the place El-beth-el, “God of Beth-el,” because God had appeared to him there when he was running from his brother. Deborah, Rebekah’s nurse, died and was buried below Beth-el under an oak, which was named Allon-bachuth, “oak of weeping.”
  - range: 9-15
    heading: God appears again
    plain: |
      On his return from Padan-aram, God appeared to Jacob again and blessed him. God said, “Your name is Jacob; you will no longer be called Jacob. Israel will be your name,” and so He called him Israel. God said, “I am God Almighty. Be fruitful and multiply. A nation and a company of nations will come from you, and kings will come from your body. The land I gave to Abraham and Isaac I will give to you, and to your descendants after you.” Then God went up from him. Jacob set up a stone pillar at the place where God had spoken with him, poured a drink offering and oil on it, and called the place Beth-el.
  - range: 16-20
    heading: Rachel dies at Ephrath
    plain: |
      They left Beth-el, and while they were still some distance from Ephrath, Rachel went into labor, and the birth was hard. The midwife said, “Do not be afraid; you have another son.” As she was dying she named him Ben-oni, “son of my sorrow,” but his father called him Benjamin, “son of the right hand.” Rachel died and was buried on the road to Ephrath, which is Beth-lehem. Jacob set up a pillar over her grave, and it is still called the pillar of Rachel’s grave.
  - range: 21-26
    heading: Reuben, and the twelve sons
    plain: |
      Israel moved on and pitched his tent beyond the tower of Eder. While he lived in that region, Reuben went and lay with Bilhah, his father’s concubine, and Israel heard of it. Jacob had twelve sons. Leah’s sons: Reuben, the firstborn, Simeon, Levi, Judah, Issachar, and Zebulun. Rachel’s: Joseph and Benjamin. Bilhah’s, Rachel’s maid: Dan and Naphtali. Zilpah’s, Leah’s maid: Gad and Asher. These are the sons born to Jacob in Padan-aram.
  - range: 27-29
    heading: Isaac’s death
    plain: |
      Jacob came to his father Isaac at Mamre, by the city of Arba, which is Hebron, where Abraham and Isaac had lived as strangers. Isaac lived 180 years. He died, old and full of years, and was gathered to his people, and his sons Esau and Jacob buried him.

notes:
  - ref: 1
    phrase: Arise, go up to Beth-el
    kind: history
    title: Why God sends Jacob back to Beth-el now
    body: |
      God’s command comes while Jacob’s vow at Beth-el is still unkept and after Shechem had turned dangerous. He made the vow there as a fugitive: if God would be with him and bring him home “in peace; then shall the LORD be my God” ([[Gen. 28:20–21]]). When God told him to leave Laban, He introduced Himself as “the God of Beth-el, where thou anointedst the pillar, and where thou vowedst a vow unto me” ([[Gen. 31:13]]). Yet back in Canaan Jacob stopped at Shechem, bought a field there, and built an altar of his own ([[Gen. 33:18–20]]).

      Genesis gives no reason for the delay and no length for it. The attack by Simeon and Levi ([[Gen. 34:25–30]]) had made Jacob’s position at Shechem “dangerous,” so that he had to leave in any case. In one reading the delay was also a lapse that the command corrected: it “stirred him up to perform what had been neglected.” “Dwell there” does not mean to settle for good, since Jacob moves on in verse 16; with “make there an altar,” it is a direction “to stay there and perform his vow.”
    sources: [lds-scriptures, keil-genesis, ellicott-genesis]
  - ref: 2
    phrase: Put away the strange gods that are among you
    kind: history
    title: Whose gods were they?
    body: |
      The “strange gods” are foreign gods, and Genesis does not say whose they were. The Hebrew is *elohe ha-nekar*, “gods of the foreigner,” the phrase Joshua uses at Shechem (see the note on verse 4). The text allows three sources. Rachel had taken her father’s household gods without Jacob’s knowledge ([[Gen. 31:19]]; [[Gen. 31:32–35]]; the note on [[Gen. 31:19]] says what is known about them). The company also included the servants Jacob had gathered in Padan-aram ([[Gen. 30:43]]), and, after Shechem, the women and children of that city, whom Jacob’s sons carried off ([[Gen. 34:29]]).

      That the command goes to “all that were with him” suggests “that others in the traveling group brought similar artifacts of idolatry.” This is a reading of what the text leaves unsaid; Genesis names only Rachel’s.
    sources: [bdb, lds-scriptures, olson-matriarchs]
  - ref: 2
    phrase: be clean, and change your garments
    kind: scripture
    title: Washing and new clothes before meeting God
    body: |
      Before going up to Beth-el the household is told to purify themselves and change their clothes, as Israel would before God came down at Sinai. The Hebrew is *hittaharu*, “purify yourselves” (so the Septuagint), and *hachalifu simlotekhem*, “change your garments.” At Sinai Moses was to “sanctify them to day and to morrow, and let them wash their clothes,” and they did ([[Ex. 19:10]]; [[Ex. 19:14]]). The scene at Beth-el is “the first of a long series of such acts constantly recurring in the history of Israel,” and “parallel to the sanctification of the people at Sinai.”

      Genesis does not say how they washed. It does say why: they were going up to the place where God had appeared to Jacob, which “was the equivalent of a modern temple,” and Jacob had his household “prepare themselves for the experience much as modern Saints prepare themselves.” For Beth-el as a temple, see the note on [[Gen. 28:17]].
    sources: [oshb-wlc, lxx-rahlfs, lds-scriptures, ellicott-genesis, ot-manual-gen-24-36]
  - ref: 4
    phrase: all their earrings which were in their ears
    kind: history
    title: Earrings, and the oak at Shechem
    body: |
      Jacob collects the earrings with the gods because they were probably more than jewelry: “possibly amulets with inscriptions to false gods,” worn “as amulets and charms.” Earrings and idolatry meet again at Sinai, where Aaron made the golden calf from the people’s golden earrings ([[Ex. 32:2–4]]). The Hebrew says only that Jacob “hid” the gods and rings. The Septuagint adds that he “destroyed them to this day.”

      The place returns too. Later Joshua gathers Israel to Shechem and tells them to put away “the strange gods which are among you” ([[Josh. 24:23]]), in Hebrew nearly the words of Jacob’s command in verse 2, and sets up a great stone “under an oak, that was by the sanctuary of the LORD” ([[Josh. 24:26]]). In one reading Joshua stood “under the same ‘oak’ of Shechem” when he “testified against the primitive worship of strange gods.” The text does not say it is the same tree, but it is the same city and the same command.
    sources: [ot-manual-gen-24-36, keil-genesis, lds-scriptures, ellicott-genesis, ryle-genesis, lxx-rahlfs, oshb-wlc]
  - ref: 5
    phrase: the terror of God was upon the cities
    kind: words
    title: A terror from God
    body: |
      The “terror of God” is a fear sent by God that kept the cities from going after Jacob’s sons. It is a “mysterious dread or panic, inspired by God.” The words “did not pursue” assume the killing at Shechem in chapter 34, and the terror answers the fear Jacob voiced then: “they shall gather themselves together against me, and slay me” ([[Gen. 34:30]]).

      Verse 5 gives the events in order: Jacob clears out the gods, and then “they journeyed: and the terror of God was upon the cities.” The text gives the sequence and does not state a cause.
    sources: [bdb, ryle-genesis, lds-scriptures]
  - ref: 7
    phrase: called the place El-beth-el
    kind: words
    title: El-beth-el, the God of Beth-el
    body: |
      Jacob now gives the place a name of God Himself. In chapter 28 he named it Beth-el, “house of God” ([[Gen. 28:19]]). *El Beth-el* is “the God of Bethel, who had his seat there,” the same title God used when He told Jacob to leave Laban: “I am the God of Beth-el” (Hebrew *ha-El Beth-El*; [[Gen. 31:13]]).

      It is the second time Jacob has named a place of worship for God. At Shechem he called his altar El-elohe-Israel (see the note on [[Gen. 33:20]]). After God appears again, Jacob names the place Beth-el once more (verse 15).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 8
    phrase: Deborah Rebekah’s nurse died
    kind: history
    title: Deborah, Rebekah’s nurse
    body: |
      Genesis names Deborah only here. When Rebekah left her family, the text said only that they sent her away “and her nurse” ([[Gen. 24:59]]). How Deborah came to be with Jacob it does not say. One reading offers two possibilities: Rebekah sent her to care for her daughters-in-law and grandsons, or she “had gone of her own accord into Jacob’s household after the death of her mistress.” The mourning and the name show that she “must have been a faithful and highly esteemed servant.”

      *Allon-bachuth* is “oak of weeping”: *bakut* is “weeping,” and the tree a “mourning oak.” Genesis never records Rebekah’s own death. We learn only at the end of Jacob’s life that she was buried in the cave of Machpelah, beside Isaac: “there they buried Isaac and Rebekah his wife” ([[Gen. 49:31]]).
    sources: [lds-scriptures, keil-genesis, bdb]
  - ref: 9
    phrase: God appeared unto Jacob again
    kind: scripture
    title: The second Beth-el answers the first
    body: |
      The second visit to Beth-el repeats the first, with one promise left out. The same acts come back. Jacob sets up a stone pillar and pours oil on it ([[Gen. 28:18]]; verse 14 here), names the place Beth-el ([[Gen. 28:19]]; verse 15), and is promised land and descendants ([[Gen. 28:13–14]]; verses 11–12). What is missing is the promise of company on a journey: “I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land” ([[Gen. 28:15]]).

      Jacob has already said that this promise was kept. In verse 3 he calls God the one who “was with me in the way which I went,” the condition of his own vow at Beth-el: “If God will be with me, and will keep me in this way that I go” ([[Gen. 28:20]]). One Latter-day Saint reading of the Jacob story explains the omission the same way: the Lord “reiterates the promise of land and seed,” with no promise of company “because, presumably, Jacob has completed that journey and finished faithfully.” That last clause is an inference; the text does not say why the promise is not repeated.
    sources: [lds-scriptures, ryle-genesis, huston-jacob-cycle]
  - ref: 10
    phrase: Israel shall be thy name
    kind: history
    title: The name Israel, given a second time
    body: |
      God gives Jacob the name Israel at Beth-el as He already had at the Jabbok ([[Gen. 32:28]]), and both are counted: the name “was given to Jacob at Penuel (Gen. 32:28) and at Bethel (Gen. 35:10).” What the name means is taken up in the note on [[Gen. 32:28]]. Here, after Jacob has kept his vow, God “now confirmed to him the name of Israel, which He had already given him.”

      In one scholarly view, verses 9–15 are instead a second telling of the naming of Israel and of Beth-el, from a different source than chapters 28 and 32. Genesis presents two events, and the Church’s reading follows it: the name was given “at Penuel… and at Bethel.”
    sources: [bd-israel, keil-genesis, ryle-genesis, lds-scriptures]
  - ref: 11
    phrase: I am God Almighty
    kind: scripture
    title: The covenant of Abraham, in Abraham’s order
    body: |
      God’s words to Jacob follow the order of His words to Abraham in [[Gen. 17:1–8]], and several phrases match in Hebrew. He begins, “I am God Almighty” (*ani El Shaddai*), as He did to Abram ([[Gen. 17:1]]), using “the name by which God had entered into the covenant with Abraham”; the KJV translates it “the Almighty God” there and “God Almighty” here, but the Hebrew is the same. He changes a name, and says the old one will “not be called any more” ([[Gen. 17:5]]; verse 10 here). He promises nations and that “kings shall come out of” him, in nearly the same Hebrew words as in [[Gen. 17:6]], with “thy loins” here in place of “thee.” He gives the land ([[Gen. 17:8]]; verse 12 here). Last, “God went up” from him, as He had from Abraham ([[Gen. 17:22]]; verse 13 here).

      That last phrase marks “the acknowledgment of the patriarch as the heir of the Abrahamic covenant.” The covenant “was renewed with Isaac… and again with Jacob (Gen. 28; 35:9–13; 48:3–4).” Isaac had already blessed Jacob in the name *El Shaddai* and with a “multitude” (*qahal*) of peoples, the word behind “company of nations” here; see the note on [[Gen. 28:3]].
    sources: [oshb-wlc, lds-scriptures, ellicott-genesis, bd-abraham-covenant]
  - ref: 14
    phrase: he poured a drink offering thereon
    kind: history
    title: A pillar, when the law forbids pillars
    body: |
      Jacob’s stone pillar raises a question, because the law later forbids pillars. He sets one up again and pours a drink offering and oil on it, just as in chapter 28 (see the note on [[Gen. 28:18]]). Leviticus says, “neither rear you up a standing image,” and Deuteronomy, “Neither shalt thou set thee up any image; which the LORD thy God hateth” ([[Lev. 26:1]]; [[Deut. 16:22]]). The Hebrew word in both is *matstsevah*, the word used here.

      One answer is that the law forbade what pillars later became. Jacob’s pouring out of oil and a drink offering “was in itself natural and right,” but “as these memorial pillars were subsequently worshipped, they were expressly forbidden.” Leviticus names the danger: “any image of stone… to bow down unto it.” Jacob’s pillar marks the place “where he talked with him,” as the text repeats in verses 13–15.
    sources: [lds-scriptures, oshb-wlc, ellicott-genesis]
  - ref: 18
    phrase: 'she called his name Ben-oni: but his father called him Benjamin'
    kind: words
    title: Ben-oni and Benjamin
    body: |
      Rachel names her son Ben-oni, “son of my sorrow,” and Jacob renames him *Binyamin*, “son of (the) right hand.” The text does not say why Jacob changed it. In one reading “the father cannot acquiesce in a name of such sad memories,” and chose the right hand because it “was regarded as the auspicious side” (compare [[Gen. 48:13–19]]).

      The midwife’s words, “thou shalt have this son also,” look back to Rachel’s own words. When Joseph was born she named him and said, “The LORD shall add to me another son” ([[Gen. 30:24]]); “Joseph” relates to the Hebrew root *yasaph*, “to add.” The midwife’s words are “perhaps” a reference to that prayer. If so, the prayer is answered at the cost of her life.
    sources: [bdb, ryle-genesis, lds-scriptures]
  - ref: 19
    phrase: was buried in the way to Ephrath, which is Beth-lehem
    kind: history
    title: Rachel’s grave on the road to Beth-lehem
    body: |
      Rachel is buried “in the way to Ephrath, which is Beth-lehem,” the town later called “Bethlehem-Judah, also called Ephrath,” “five miles south of Jerusalem.” Jacob does not forget the place. Near the end of his life he tells Joseph, “Rachel died by me in the land of Canaan in the way, when yet there was but a little way to come unto Ephrath: and I buried her there in the way of Ephrath; the same is Beth-lehem” ([[Gen. 48:7]]).

      Two later passages can seem to put her elsewhere. Saul is told he will find “two men by Rachel’s sepulchre in the border of Benjamin at Zelzah” ([[1 Sam. 10:2]]); the verse shows that the grave was a known landmark in Samuel’s day, and it is counted with Genesis 35 and 48 among the passages on “her grave.” Jeremiah hears Rachel weeping at Ramah ([[Jer. 31:15]]), but Ramah was “the place at which the exiles were assembled before their departure for Babylon”; she weeps there for her children, not at her tomb (see the note on [[Jer. 31:15]]).
    sources: [lds-scriptures, bd-bethlehem, bd-rachel]
  - ref: 22
    phrase: Reuben went and lay with Bilhah his father’s concubine
    kind: history
    title: Reuben’s sin, and why the record stops
    body: |
      Reuben’s sin is told in one sentence, and the rest of Genesis shows why it is recorded. Reuben, Jacob’s firstborn, lay with Bilhah, Rachel’s maid and the mother of Dan and Naphtali. Jacob had taken her as a wife ([[Gen. 30:3–4]]; for plural marriage in Genesis, see [[Gen. 16:1–4]]), and the text calls her “his father’s concubine.” Then: “and Israel heard it.” The sentence stops there. The Hebrew text itself marks a section break at that point, in the middle of the verse, before the list of the sons begins. The Septuagint adds: “and the thing appeared grievous before him.”

      Jacob answers at the end of his life: “Reuben, thou art my firstborn, my might… Unstable as water, thou shalt not excel; because thou wentest up to thy father’s bed” ([[Gen. 49:3–4]]). Chronicles states the result: “forasmuch as he defiled his father’s bed, his birthright was given unto the sons of Joseph” ([[1 Chr. 5:1]]). Reuben “lost his birthright because of transgression,” and the blessing passed to Joseph, Rachel’s firstborn. Jacob’s blessings also explain why the next two sons did not take Reuben’s place: Simeon and Levi, whose anger Jacob curses ([[Gen. 49:5–7]]), are passed over as well, and Judah becomes “something of an ‘honorary’ firstborn” ([[Gen. 49:8–10]]; compare [[1 Chr. 5:2]]).
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs, bd-reuben, sc-knowhy-843]
  - ref: 26
    phrase: which were born to him in Padan-aram
    kind: history
    title: Twelve sons, “born in Padan-aram”
    body: |
      The list gathers the twelve sons in four groups by mother, Leah’s six first, with Reuben as “Jacob’s firstborn,” and ends, “these are the sons of Jacob, which were born to him in Padan-aram.” That summary is not exact, since Benjamin was born on the road in Canaan (verses 16–18), and the closing words are “to be taken only generally.” The list is “arranged according to their respective mothers,” and its point is what Jacob brought home: he “had left his father’s house with no other possession than a staff, and now he returned with 12 sons.”

      Benjamin’s birth “completed the number twelve,” and the promise of “a nation and a company of nations” (verse 11) now has its twelve sons.
    sources: [keil-genesis, ellicott-genesis, lds-scriptures]
  - ref: 28
    phrase: the days of Isaac were an hundred and fourscore years
    kind: history
    title: Isaac’s death, told ahead of its time
    body: |
      Genesis reports Isaac’s death here, though he lived through much of the Joseph story. The text’s own ages show it. Isaac was sixty when Jacob was born ([[Gen. 25:26]]), so he died when Jacob was 120. Jacob was 130 when he stood before Pharaoh in the second year of the famine ([[Gen. 47:9]]; [[Gen. 45:6]]), and Joseph, thirty at his rise and nine years past it, was then 39 ([[Gen. 41:46]]; [[Gen. 41:53–54]]). So Joseph was born when Jacob was 91, and was sold at seventeen ([[Gen. 37:2]]), when Jacob was 108 and Isaac 168. Isaac lived twelve years more and died when Joseph was about twenty-nine, a year before his rise in Egypt. The sums assume that the years run on without gaps. So Joseph was sold “about twelve years before the death of Isaac,” and Isaac was alive when Jacob mourned him.

      The death comes here because this is where Isaac’s own account ends. In the book’s outline by family histories, “Isaac. The account of his life (21:1–35:29)… Jacob. After Isaac’s death we have (a) the genealogy of Esau (Gen. 36)… and (b) the history of the patriarchs till the death of Joseph.” The next section opens, “These are the generations of Jacob” ([[Gen. 37:2]]).
    sources: [lds-scriptures, ellicott-genesis, bd-genesis]
  - ref: 29
    phrase: his sons Esau and Jacob buried him
    kind: history
    title: Esau and Jacob bury their father
    body: |
      The brothers bury Isaac together, and Esau had once planned otherwise. When Jacob took the blessing, Esau said in his heart, “The days of mourning for my father are at hand; then will I slay my brother Jacob” ([[Gen. 27:41]]). The days of mourning have come, and the two stand at one grave. They had already been reconciled in chapter 33, where Esau “ran to meet him, and embraced him… and they wept” ([[Gen. 33:4]]).

      It is the second such burial in the story: “his sons Isaac and Ishmael buried him” was said of Abraham ([[Gen. 25:9]]), and “his sons Esau and Jacob” now do the same for Isaac. Genesis does not say where Isaac was buried here. Jacob’s last charge to his sons does: “there they buried Isaac and Rebekah his wife” in the cave of Machpelah ([[Gen. 49:31]]).
    sources: [lds-scriptures]

christ: |
  Rachel’s grave ties the chapter to the place of Christ’s birth. She is buried “in the way to Ephrath, which is Beth-lehem” (verse 19), and Bethlehem-Judah, “also called Ephrath,” is “Christ’s birthplace.” Micah later says that out of “Beth-lehem Ephratah” will come “he… that is to be ruler in Israel; whose goings forth have been from of old, from everlasting” ([[Micah 5:2]]). When Herod killed the children of Bethlehem, Matthew heard Jeremiah’s “Rachel weeping for her children” ([[Matt. 2:16–18]]); he “quotes the passage in his description of the mourning at Bethlehem (where Rachel’s grave was).”

  The promise given at Beth-el reaches Him by way of Judah. God tells Jacob that “kings shall come out of thy loins” (verse 11), and among the promises of the covenant renewed with him is that Christ would come through his lineage (see the note on [[Gen. 28:4]]). With Reuben passed over, and Simeon and Levi after him (see the note on verse 22), Jacob’s blessing of Judah says, “The sceptre shall not depart from Judah… until Shiloh come” ([[Gen. 49:10]]). That name “has been regarded by many biblical scholars as a prophecy of the coming of Messiah,” an interpretation “confirmed by JST Gen. 50:24.”

explore: |
  - **Jacob looks back.** [[Gen. 48:3–7]]: Luz, God Almighty, and Rachel’s grave in one speech.
  - **The first Beth-el.** [[Gen. 28:10–22]], read beside verses 1–15.
  - **Reuben, Simeon, Levi, and Judah in Jacob’s last blessing.** [[Gen. 49:3–10]]; [[1 Chr. 5:1–2]]. KnoWhy #843, “Why is Judah Blessed with a Scepter Until Shiloh Comes?” (Scripture Central), reads Jacob’s blessings of Reuben, Simeon, Levi, and Judah together.
  - **Foreign gods put away at Shechem.** [[Josh. 24:14–26]].
  - **Rachel’s weeping, and the Lord’s answer.** [[Jer. 31:15–17]].

