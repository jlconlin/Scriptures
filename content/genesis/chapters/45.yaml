chapter: 45
title: God Sent Me Before You to Preserve Life
tagline: Joseph can hold back no longer and tells his brothers who he is. He asks them not to grieve over what they did, because God sent him ahead to keep the family alive; Pharaoh invites them all to Egypt, and Jacob, hearing that Joseph lives, says, “It is enough.”
when: 'The second year of the famine ([[Gen. 45:6]]), about twenty-two years after Joseph was sold. The text gives no year.'

setting: |
  In Genesis 45 Joseph, after two visits from his brothers, tells them who he is. He was seventeen when his brothers sold him ([[Gen. 37:2]]) and thirty when he stood before Pharaoh ([[Gen. 41:46]]). Now, in the second year of a seven-year famine ([[Gen. 41:27]]), he rules Egypt, and his brothers have come to him for grain a second time. Over their two visits ([[Gen. 42]]; [[Gen. 43]]) Joseph seems to have been testing his brothers, mostly through Benjamin, who “had become Jacob’s favored son after Joseph was sold into slavery.” There are signs that they had changed: Reuben’s remorse, and above all Judah, who had once proposed selling Joseph and now offers to stay as a bondman in Benjamin’s place ([[Gen. 44:33–34]]). The chapter opens as Judah stops speaking.

  It has five parts: Joseph makes himself known (verses 1–3); he tells his brothers that God sent him (4–8); he sends for his father and embraces them (9–15); Pharaoh adds an invitation and Joseph sends them off with gifts (16–24); and Jacob hears the news (25–28). Later scripture returns to the scene. Stephen retells it to the council ([[Acts 7:9–14]]), a psalm recalls it ([[Ps. 105:16–23]]), and Lehi finds Joseph’s line on the brass plates ([[1 Ne. 5:14]]). Chapter 46 takes Jacob down to Egypt.

thread: |
  Genesis 45 sets what the brothers did beside what God did with it, in two verbs, and then follows one word through the chapter.

  The brothers “sold” Joseph (verses 4–5; Hebrew *makhar*). God “sent” him (*shalach*, verses 5 and 7), and in verse 8 the same verb is taken from the brothers: “it was not you that sent me hither, but God.” Joseph never says that the sale did not happen; he names it twice before he mentions God. What he refuses is that the sale was the last word.

  What God sent him to do is “to preserve life” (verse 5), and the root behind that phrase, *chayah*, “live,” is the thread of the chapter. Joseph asks, “doth my father yet live?” (verse 3); God sent him “to save your lives” (verse 7); the brothers tell Jacob that “Joseph is yet alive” (verse 26); Jacob’s spirit “revived” (literally, “lived,” verse 27); and Jacob answers, “Joseph my son is yet alive” (verse 28). A family that had counted one son dead for more than twenty years, and still faced five years of famine, hears in the chapter’s last verse that he is alive.

  The third strand is speech. In chapter 37 the brothers hated Joseph and “could not speak peaceably unto him” ([[Gen. 37:4]]). Here they first “could not answer him” (verse 3), and only after the embraces “his brethren talked with him” (verse 15).

sections:
  - range: 1-3
    heading: Joseph makes himself known
    plain: |
      Joseph could not hold back any longer in front of all his attendants. He shouted, “Everyone out!” and no one stayed with him when he told his brothers who he was. He wept so loudly that the Egyptians heard, and Pharaoh’s household heard. Then he said to his brothers, “I am Joseph. Is my father still alive?” They could not answer him, because they were too shaken to speak.
  - range: 4-8
    heading: “It was not you that sent me hither, but God”
    plain: |
      “Come close to me,” Joseph said, and they came close. “I am your brother Joseph, whom you sold into Egypt. Now do not be upset, and do not be angry with yourselves for selling me here, because God sent me ahead of you to save lives. There has been famine in the land for two years, and for five more years there will be no plowing and no harvest. God sent me ahead of you to preserve a remnant for you on the earth and to keep you alive by a great deliverance. So it was not you who sent me here, but God. He has made me a father to Pharaoh, lord of his whole household, and ruler of all Egypt.”
  - range: 9-15
    heading: “Go up to my father”
    plain: |
      “Hurry back to my father and tell him, ‘Your son Joseph says: God has made me lord of all Egypt. Come down to me without delay. You will live in the land of Goshen, near me, with your children, your grandchildren, your flocks, and everything you have. I will provide for you there, since five years of famine remain, so that you and your household do not lose everything.’ You can see for yourselves, and so can my brother Benjamin, that it is I who am speaking to you. Tell my father about all my honor in Egypt and everything you have seen, and bring him here quickly.” Then he threw his arms around Benjamin and wept, and Benjamin wept on his neck. He kissed all his brothers and wept over them, and after that his brothers talked with him.
  - range: 16-24
    heading: Pharaoh’s invitation and Joseph’s gifts
    plain: |
      The news that Joseph’s brothers had come reached Pharaoh’s house, and it pleased Pharaoh and his servants. Pharaoh told Joseph to tell his brothers: load your animals, go to Canaan, bring your father and your households, and come to me. “I will give you the best of the land of Egypt, and you will eat the fat of the land.” Joseph was also to tell them to take wagons from Egypt for their children and wives and to bring their father, and not to worry about their belongings, since the best of Egypt was theirs. The sons of Israel did so. Joseph gave them wagons as Pharaoh had said, and food for the journey. He gave each of them a set of clothes, but to Benjamin he gave three hundred pieces of silver and five sets of clothes. To his father he sent ten donkeys loaded with Egypt’s finest goods and ten female donkeys loaded with grain, bread, and food for the trip. As he sent his brothers off he told them, “Do not quarrel on the way.”
  - range: 25-28
    heading: Jacob hears the news
    plain: |
      They went up out of Egypt to their father Jacob in Canaan and told him, “Joseph is still alive, and he is ruler over all Egypt.” Jacob’s heart went numb, because he did not believe them. But when they told him everything Joseph had said, and he saw the wagons Joseph had sent to carry him, the spirit of their father Jacob revived. Israel said, “It is enough! My son Joseph is still alive. I will go and see him before I die.”

notes:
  - ref: 1
    phrase: Cause every man to go out from me
    kind: history
    title: Why Joseph clears the room
    body: |
      Joseph sends his Egyptian attendants out because he can no longer hold in what he has held in through two visits. He “could not refrain himself” (Hebrew *hit’appeq*, “restrain oneself,” a verb that in Genesis is used only of Joseph, here and at [[Gen. 43:31]]). The first time he heard his brothers confess, he “turned himself about from them, and wept” ([[Gen. 42:24]]). The second time, at the sight of Benjamin, he “sought where to weep,” went into his chamber and wept there, then “washed his face, and went out, and refrained himself” ([[Gen. 43:30–31]]). Both times he hid it.

      What breaks the restraint is Judah’s plea. Judah’s offer to stay in Benjamin’s place is one of several “indications that Joseph’s brothers had indeed changed”: his “response indicates that he has changed. Only then does Joseph reveal who he is to his brothers.” Sending the attendants out says something as well. “The first sign that Joseph had forgiven his brothers is by dismissing his staff and leaving himself alone with ten men who had previously tried to kill him.”
    sources: [bdb, lds-scriptures, scripture-helps-gen-42-50, gee-clothes-cups]
  - ref: 2
    phrase: wept aloud
    kind: history
    title: Weeping that is heard
    body: |
      Joseph’s weeping, hidden twice before, is now heard. “He wept aloud” is, in Hebrew, “he gave his voice in weeping” (*vayyitten ’et-qolo bivkhi*), and “the Egyptians and the house of Pharaoh heard.” The verse need not mean that the sound itself carried to the palace. One reading is that he wept so loudly “that the Egyptians outside could hear it; and the house of Pharaoh, i.e., the royal family, was told of it.”

      Verse 16 tells that second step in full, and with the same noun. “The fame thereof” is in Hebrew *haqqol*, “the sound,” the word that is “his voice” (*qolo*) in verse 2: it “was heard in Pharaoh’s house, saying, Joseph’s brethren are come.” Pharaoh answers with the invitation of verses 17–20.
    sources: [biblehub-interlinear, keil-genesis, lds-scriptures]
  - ref: 3
    phrase: I am Joseph
    kind: christ
    title: The second time Joseph is made known
    body: |
      Stephen, retelling the story to the council, says that “at the second time Joseph was made known to his brethren” ([[Acts 7:13]]). It matches Genesis: on the first visit “Joseph knew his brethren, but they knew not him” ([[Gen. 42:8]]), and only now, on the second, does he make himself known (verse 1).

      The Church’s seminary course treats that second revealing as a type, one of the ways Joseph’s life is “a type and shadow of Christ.” It sets “Joseph reveals himself to his brothers when they came the second time” beside the Savior’s coming “in the clouds of heaven with power and great glory” ([[Matt. 24:30–31]]). This is a devotional likeness, not something Genesis or Stephen states. Stephen’s “second time” shows only that the detail was noticed within the New Testament itself.
    sources: [lds-scriptures, ot-seminary-2026-gen-42-45]
  - ref: 3
    phrase: doth my father yet live
    kind: words
    title: Why Joseph asks about his father
    body: |
      Joseph asks about a father he has twice been told is alive because his father is what he cares about most, not because he doubts it. On the earlier visit he had asked, “Is he yet alive?” ([[Gen. 43:27]]), and the brothers answered, “he is yet alive” ([[Gen. 43:28]]). Judah’s plea in chapter 44 circled around the father and ended on him: “lest peradventure I see the evil that shall come on my father” ([[Gen. 44:34]]). Joseph’s first question takes up where Judah stopped. It is the question of a son: “the thought of his father is uppermost in his mind,” and since “he does not wait for an answer, or expect one,” it is not a request for information.

      The brothers cannot answer: “they were troubled at his presence” (Hebrew *nivhalu mippanav*; the verb means “be disturbed, dismayed, terrified”). Their silence is picked up again at verse 15.
    sources: [lds-scriptures, ryle-genesis, bdb, biblehub-interlinear]
  - ref: 5
    phrase: God did send me before you
    kind: prophets
    title: Sold by his brothers, sent by God
    body: |
      Joseph holds two things together: his brothers did sell him, and God sent him. He names the first plainly, “whom ye sold into Egypt” (verse 4), repeats it in verse 5, and only then says, “God did send me before you.” Hebrew uses a different verb for each act: *makhar*, “sell,” for what the brothers did, and *shalach*, “send,” for what God did (verses 5 and 7). Verse 8 then takes the second verb away from them: “it was not you that sent [*shelachtem*] me hither, but God.” At the end of the book one verb covers both intentions: “ye thought evil against me; but God meant it unto good” ([[Gen. 50:20]]), where “thought” and “meant” are the same Hebrew verb, *chashav*, “intend.”

      Does this mean God made the brothers do it? The Church’s answer is no. Joseph’s words “should not be misunderstood to mean that God caused Joseph’s brothers to sell him into slavery. Rather, Joseph was recognizing God’s omniscience and His ability to bring good out of difficult situations.” Elder Neal A. Maxwell said it this way: “The evil intent of Joseph’s brothers was folded into the plans of God, who knows the beginning from the end and all that is in between.” The whole story of Joseph is “an illustration of the way in which God works in history, preserving his people.”

      Psalm 105 keeps both halves in two verses: God “called for a famine upon the land” and “sent a man before them, even Joseph, who was sold for a servant” ([[Ps. 105:16–17]]). [Joseph: Sold, and Sent](/genesis/themes/joseph-sent-ahead/)
    sources: [biblehub-interlinear, lds-scriptures, scripture-helps-gen-42-50, bd-joseph]
  - ref: 5
    phrase: to preserve life
    kind: words
    title: '“Alive”: the word the chapter turns on'
    body: |
      “To preserve life” is Joseph’s own summary of why he was sent, and its Hebrew root runs through the whole chapter. *Lemichyah* comes from *chayah*, “live”; its noun *michyah* means “preservation of life, sustenance.” The same root is in verse 7, “to save your lives” (*lehachayot*, “to give life”; the lexicon files it under “preserve alive, let live”). It also frames the news about Jacob. Joseph asks, “doth my father yet live?” (verse 3, *chay*). The brothers announce, “Joseph is yet alive” (verse 26, *chay*). “The spirit of Jacob their father revived” (verse 27) is literally that his spirit “lived” (*vattechi*), which the lexicon files under “revive… from discouragement of the spirit.” And Jacob answers, “Joseph my son is yet alive” (verse 28). Joseph uses the same causative verb at the end of the book, when God meant it “to save much people alive” ([[Gen. 50:20]]).
    sources: [bdb, strongs-concordance, biblehub-interlinear, lds-scriptures]
  - ref: 6
    phrase: earing nor harvest
    kind: words
    title: “Earing” means plowing
    body: |
      “Earing” is an old English word for plowing, so verse 6 says that for five more years there will be neither plowing nor harvest. In 1828 the word was still defined as “A plowing of land. Genesis 45:6.” The Hebrew word, *charish*, is “ploughing, ploughing-time,” and the same pair returns in “in earing time and in harvest” ([[Ex. 34:21]]). The verse also gives the time left: two years of famine are past and five remain, which makes the seven that Joseph had read in Pharaoh’s dreams ([[Gen. 41:27]]; [[Gen. 41:30]]).
    sources: [webster-1828, bdb, lds-scriptures, biblehub-interlinear]
  - ref: 7
    phrase: a posterity in the earth
    kind: words
    title: A remnant and a great deliverance
    body: |
      The KJV’s “posterity” and “deliverance” are two nouns from the Bible’s vocabulary of the remnant. Hebrew *she’erit* means “rest, residue, remnant,” and in this verse the lexicon glosses it “remainder = descendants”; elsewhere it becomes “faithful remnant of Israel or Judah (technical term of prophets).” *Peletah* is “escape, deliverance” here and “elsewhere probably always escaped remnant,” specifically that of “those of Judah escaped from Assyrians.” The two nouns stand side by side again in Isaiah’s word to Hezekiah: “out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion” ([[2 Kgs. 19:31]]). The Septuagint, the ancient Greek translation, renders both as “remnant”: “that there might be left to you a remnant upon the earth, even to nourish a great remnant of you.”

      The Book of Mormon remembers the preservation. Lehi finds on the brass plates that he descends from “that Joseph who was the son of Jacob, who was sold into Egypt, and who was preserved by the hand of the Lord, that he might preserve his father, Jacob, and all his household from perishing with famine” ([[1 Ne. 5:14]]), and that “that same God who had preserved them” led them out of Egypt ([[1 Ne. 5:15]]). Lehi then tells his son Joseph what the ancient Joseph was promised: “the Lord hath said unto me, I will preserve thy seed forever” ([[2 Ne. 3:16]]).
    sources: [bdb, lxx-rahlfs, lds-scriptures]
  - ref: 8
    phrase: a father to Pharaoh
    kind: history
    title: A father to Pharaoh
    body: |
      “A father to Pharaoh” is not a claim of kinship. It is probably “an honorific title of the chief minister.” Whether an Egyptian court title lies behind the Hebrew is disputed: the Egyptian titles that have been compared with it have been called “identical in form but altogether different in meaning.”

      Pharaoh’s own appointment of Joseph is told in [[Gen. 41:40–44]]. Joseph’s point here is that it was God who “hath made” him father to Pharaoh, lord of his house, and ruler of Egypt.
    sources: [skinner-genesis, lds-scriptures]
  - ref: 10
    phrase: land of Goshen
    kind: history
    title: Why Goshen
    body: |
      Goshen, the district Joseph names for the family’s home, was probably in the eastern part of the Nile delta. It was “the part of Egypt in which the Israelites dwelt,” it “contained pasture land,” and it “lay somewhere between Palestine and the capital of Egypt.” One identification is the Wadi Tumilat, “a stretch of low ground extending from the eastern arm of the Delta to the Valley of Suez and the Salt Lakes.”

      Joseph gives two reasons here: “thou shalt be near unto me,” and there is room for “thy flocks, and thy herds.” Later he ties the choice to the family’s trade, telling his brothers to say that they keep cattle “that ye may dwell in the land of Goshen; for every shepherd is an abomination unto the Egyptians” ([[Gen. 46:33–34]]).
    sources: [bd-goshen, ryle-genesis, lds-scriptures]
  - ref: 15
    phrase: his brethren talked with him
    kind: structure
    title: From “could not speak peaceably” to “talked with him”
    body: |
      The brothers who once could not speak peaceably to Joseph speak with him at last. In chapter 37 they hated him and “could not speak peaceably unto him” ([[Gen. 37:4]]); the Hebrew is *lo yakhlu dabbero leshalom*, “they were not able to speak to him in peace.” In this chapter the same words come back in two steps. When Joseph says “I am Joseph,” “his brethren could not answer him” (verse 3; *lo yakhlu*, “they were not able,” again). Only “after that,” after the embraces and the tears, “his brethren talked with him” (*dibberu ’itto*, from *dbr*, “speak,” the verb of 37:4).

      Genesis records nothing of what they said. The verse marks the moment itself: “It was now that the brothers first ventured to approach him, the string of their tongues is now loosened, and they are able to talk with him.” The echo of chapter 37 is an observation from the Hebrew wording; the text does not remark on it. [Joseph: Sold, and Sent](/genesis/themes/joseph-sent-ahead/)
    sources: [lds-scriptures, biblehub-interlinear, delitzsch-genesis]
  - ref: 16
    phrase: it pleased Pharaoh well
    kind: history
    title: Pharaoh makes the family his guests
    body: |
      Pharaoh adds an invitation of his own to Joseph’s, and what pleases him is the brothers’ coming. “It pleased Pharaoh well, and his servants” is the idiom used when Pharaoh first approved Joseph’s plan against the famine: “the thing was good in the eyes of Pharaoh, and in the eyes of all his servants” ([[Gen. 41:37]]). The Hebrew idiom is the same here: *vayyitav be‘eynei Par‘oh uve‘eynei ‘avadav*, “it was good in the eyes of Pharaoh and in the eyes of his servants.”

      Pharaoh promises “the good of the land of Egypt” and “the fat of the land” (verse 18). “The good” means “the best produce,” and “the fat of the land” “repeats the same thought, in different imagery.” He tells them to “regard not your stuff,” which is, literally, “let not your eye be sparing” over “your vessels,” that is, “have no compunction at leaving things behind” (verse 20).

      Why does the chapter report Pharaoh’s invitation at such length? One reading is that it mattered for Israel’s later standing in Egypt that the family should go there “not as men who had forced themselves on the country… but as invited guests.” The text itself does not say so.
    sources: [lds-scriptures, biblehub-interlinear, ryle-genesis, ellicott-genesis]
  - ref: 22
    phrase: to Benjamin he gave three hundred pieces of silver, and five changes of raiment
    kind: history
    title: Changes of raiment, and five for Benjamin
    body: |
      Joseph’s parting gifts honor all the brothers and single out Benjamin. “Changes of raiment” (Hebrew *chalifot semalot*, “changes of garments”) are clothes to change into, and “gifts of clothing were marks of special favour in the East.” Each brother receives one set. Benjamin receives five, and three hundred pieces of silver. The “five” repeats the meal in chapter 43, where “Benjamin’s mess was five times so much as any of theirs” ([[Gen. 43:34]]).

      Genesis gives no reason for the larger gift. Benjamin is the brother on whom Joseph’s tests had turned: he “had become Jacob’s favored son after Joseph was sold into slavery,” and “most of these tests focused on young Benjamin.” Nor does the text say how the other brothers took it.
    sources: [biblehub-interlinear, ellicott-genesis, lds-scriptures, scripture-helps-gen-42-50]
  - ref: 24
    phrase: fall not out by the way
    kind: words
    title: “See that ye fall not out by the way”
    body: |
      Joseph’s parting words rest on one verb, *tirgezu*, from *ragaz*, “be agitated, quiver, quake, be excited, perturbed,” and the question is what kind of agitation he means. The KJV takes it as quarreling, as the ancient versions did: the Septuagint has “Be not angry by the way,” and “this is the meaning given to the passage in all the versions.” On that reading Joseph “feared that they might reproach one another for their treatment of him, and try to throw the blame on the one or two chiefly guilty.” Reuben had already reproached the others once ([[Gen. 42:22]]).

      The other reading is “be not afraid.” The lexicon lists this verse among uses of the verb for a person “in fear, awe,” and the brothers’ fear that Joseph might still take revenge does surface after Jacob’s death ([[Gen. 50:15]]). But this rendering has also been judged to rest “on insufficient grounds,” and the KJV follows the ancient versions.
    sources: [bdb, biblehub-interlinear, lxx-rahlfs, ellicott-genesis, lds-scriptures]
  - ref: 26
    phrase: Jacob’s heart fainted
    kind: words
    title: Too good to believe
    body: |
      Jacob’s heart goes numb at the news because it is too good to be true. The Hebrew *vayyafag libbo* is “his heart went numb”; the lexicon’s gloss for the verb is “grow numb,” or, as English would put it, “his heart stood still.”

      The brothers “told him all the words of Joseph” (verse 27), and words were not enough. What revived him was seeing “the wagons which Joseph had sent to carry him.” The Hebrew word, *‘agalot*, means “cart, used for transporting persons and things,” and these had come “out of the land of Egypt” at Pharaoh’s command (verse 19). “He did not believe, until he had some ocular proof of the truth of the statement.”
    sources: [biblehub-interlinear, bdb, ryle-genesis, lds-scriptures]
  - ref: 28
    phrase: It is enough
    kind: history
    title: '“It is enough”: Israel’s answer'
    body: |
      Jacob’s answer turns on the word “enough” (Hebrew *rav*). What is enough is the news itself. In one reading the father’s heart is “indifferent to Joseph’s grandeur” and his gifts: “the fact that his son lives is sufficient consolation for all he has endured.” When Joseph was lost, Jacob had said he would “go down into the grave unto my son mourning” ([[Gen. 37:35]]). Now he says, “I will go and see him before I die.”

      The name changes, too. The narrator calls him “Jacob” in verses 25–27 and “Israel” in verse 28. Israel, the name given to Jacob at Penuel and again at Bethel ([[Gen. 32:28]]; [[Gen. 35:10]]), means “One who prevails with God or Let God prevail.” One reading takes the change as deliberate: when his “crushed spirit… was revived by the certainty that his son Joseph was still alive, Jacob was changed into Israel.” Against it stands the caution that “we must not lay too much stress upon this change of name,” since both names “were long both in use” for the patriarch. The text itself does not say. Before Israel goes down, God speaks to him at Beer-sheba ([[Gen. 46:1–4]]).
    sources: [biblehub-interlinear, lds-scriptures, skinner-genesis, keil-genesis, ellicott-genesis, bd-israel]

christ: |
  Latter-day Saint teaching reads Joseph as a type of Christ, a life that foreshadows His: “the life and mission of Joseph typifies the life and mission of Jesus.” The likenesses reach back through the whole story: a favored son rejected by his brothers; sold into the hands of the Gentiles; a Judah who proposed the sale and a Judas who made it. In Genesis 45 they turn to deliverance and forgiveness. By selling Joseph, his brothers “actually set up the conditions that would bring about their eventual temporal salvation,” as Jesus, given into the hands of the Gentiles, became “the Deliverer for all mankind”; and Joseph “provided bread for Israel and saved them from death, all without cost.” The one who was sold greets the ones who sold him with “I am Joseph your brother” and says, “be not grieved, nor angry with yourselves.” The Church’s seminary course sets beside that forgiveness the Lord’s own promise: “as often as my people repent will I forgive them their trespasses against me” ([[Mosiah 26:30]]).

explore: |
  - **The tests that lead here.** Read [[Gen. 42]], [[Gen. 43]], and Judah’s plea in [[Gen. 44:18–34]].
  - **What follows.** [[Gen. 46:1–7]] gives God’s word to Israel before he goes down; [[Gen. 50:15–21]] gives the brothers’ fear after Jacob’s death and Joseph’s reply.
  - **The story retold.** [[Acts 7:9–16]]; [[Ps. 105:16–23]]; [[1 Ne. 5:14–16]]; [[2 Ne. 3:4–16]].
  - **The remnant in Isaiah.** [[Isa. 37:31–32]], where the two nouns of verse 7 stand together again, and [[Isa. 10:20–22]].

