chapter: 18
title: Abraham Pleads for Sodom
tagline: Three visitors come to Abraham’s tent in the heat of the day and are welcomed with a feast. The promise of a son is repeated where Sarah can hear it, and she laughs. Then the LORD tells Abraham what He means to do to Sodom, and Abraham pleads for the city, from fifty righteous down to ten.
when: 'Abraham is ninety-nine, after the covenant of chapter 17 and within a year of Isaac’s birth (17:21, 24; 21:5). He is living by the oaks of Mamre at Hebron. The text gives no year.'

setting: |
  Genesis 18 follows straight on from the covenant of chapter 17. Abraham is ninety-nine and newly circumcised, and God has promised that Sarah will bear Isaac “at this set time in the next year” ([[Gen. 17:21]]). Now the promise is repeated, this time where Sarah can hear it. Abraham is still living by the oaks of Mamre at Hebron ([[Gen. 13:18]]), about twenty miles south of Jerusalem. His nephew Lot has moved down into Sodom ([[Gen. 14:12]]).

  Chapters 18 and 19 are one story told in two places. In the heat of the day three visitors come to Abraham’s tent and are given a feast; at evening the messengers come to Lot in Sodom ([[Gen. 19:1–3]]). “In both cases, hospitality lies at the heart of the narrative.” Between the two scenes comes Abraham’s plea for the city.

  Joseph Smith’s revision changes this chapter a good deal. It makes the visitors “holy men” sent by God, turns the Lord’s words about Sodom into a commission to them, and leaves Abraham alone with the Lord to plead. The notes on verses 1, 2, 3, 21 and 27 bring it in where it answers a reader’s question.

  Later scripture draws on both halves of the chapter. The question of verse 14 comes back at the announcement of Jesus’ birth ([[Luke 1:37]]), and the fate of Sodom “is used throughout scripture as an example of the consequences of wickedness.”

thread: |
  Genesis 18 sets a promise of life beside a sentence of death, and Abraham stands in the middle of both. The chapter turns on two questions. The first is the LORD’s, asked when Sarah laughs at the thought of a son: “Is any thing too hard for the LORD?” (verse 14). The second is Abraham’s, asked when the LORD tells him what He will do to Sodom: “Shall not the Judge of all the earth do right?” (verse 25). One is about God’s power, the other about His justice.

  Verse 19 joins the two halves. God chose Abraham so that he would teach his household “to do justice and judgment” (*tsedaqah umishpat*, righteousness and justice). A few verses later Abraham presses the Judge of all the earth to do *mishpat* Himself, and he pleads for mercy in the name of that justice.

  The welcome at the tent prepares for the plea. Abraham’s “willingness to extend love and protection to strangers is not limited to travelers.” The man who ran to serve three travelers stands before the LORD for a city of strangers, and he does not stop asking until the number is ten.

sections:
  - range: 1-8
    heading: Three visitors
    plain: |
      The Lord appeared to Abraham by the oaks of Mamre as he sat at the entrance of his tent in the heat of the day. He looked up and saw three men standing near him. As soon as he saw them he ran from the tent door to meet them, bowed to the ground, and said, “My lord, if I have found favor in your sight, do not pass by your servant. Let a little water be brought, and wash your feet, and rest under the tree. I will bring a bit of bread so that you can refresh yourselves, and after that you can go on, since this is why you have come to your servant.” They said, “Do as you have said.”

      Abraham hurried into the tent to Sarah and said, “Quick! Three measures of fine flour; knead it and make cakes.” He ran to the herd, chose a tender, good calf, and gave it to a young man, who hurried to prepare it. Then he brought butter and milk and the calf he had prepared and set it before them, and he stood by them under the tree while they ate.
  - range: 9-15
    heading: The promise and Sarah’s laughter
    plain: |
      They asked him, “Where is Sarah your wife?” He said, “There, in the tent.” One said, “I will surely come back to you when the season comes round, and Sarah your wife will have a son.” Sarah was listening at the tent door behind him. Abraham and Sarah were old, far along in years, and Sarah was long past the age of bearing children. So Sarah laughed to herself: “After I am worn out, shall I have this delight, with my lord old too?”

      The Lord said to Abraham, “Why did Sarah laugh and say, ‘Shall I really bear a child, now that I am old?’ Is anything too hard for the Lord? At the appointed time I will come back to you, when the season comes round, and Sarah will have a son.” Sarah denied it, saying, “I did not laugh,” because she was afraid. He said, “No, you did laugh.”
  - range: 16-21
    heading: What the Lord will do
    plain: |
      The men got up from there and looked toward Sodom, and Abraham walked with them to see them on their way. The Lord said, “Shall I hide from Abraham what I am about to do? Abraham will surely become a great and mighty nation, and all the nations of the earth will be blessed in him. For I have chosen him, so that he will command his children and his household after him to keep the way of the Lord by doing what is right and just, so that the Lord may bring about for Abraham what He has promised him.”

      Then the Lord said, “The outcry against Sodom and Gomorrah is great, and their sin is very grievous. I will go down now and see whether they have done all that the outcry that has reached me says. And if not, I will know.”
  - range: 22-33
    heading: Abraham pleads for Sodom
    plain: |
      The men turned from there and went toward Sodom, but Abraham still stood before the Lord. Abraham came near and said, “Will you destroy the righteous along with the wicked? Suppose there are fifty righteous in the city; will you destroy it, and not spare the place for the sake of the fifty righteous in it? Far be it from you to do such a thing, to kill the righteous with the wicked, so that the righteous fare as the wicked. Far be it from you! Shall not the Judge of all the earth do what is just?” The Lord said, “If I find fifty righteous in the city of Sodom, I will spare the whole place for their sake.”

      Abraham answered, “I have taken it on myself to speak to the Lord, I who am only dust and ashes. Suppose the fifty righteous are five short; will you destroy the whole city for lack of five?” He said, “I will not destroy it if I find forty-five there.” Again Abraham spoke: “Suppose forty are found there.” He said, “For the sake of forty I will not do it.” Then he said, “Let not the Lord be angry, and I will speak: suppose thirty are found there.” He said, “I will not do it if I find thirty there.” He said, “I have taken it on myself to speak to the Lord: suppose twenty are found there.” He said, “For the sake of twenty I will not destroy it.” Then he said, “Let not the Lord be angry, and I will speak just once more: suppose ten are found there.” He said, “For the sake of ten I will not destroy it.” When the Lord had finished speaking with Abraham, He went His way, and Abraham went back to his place.

notes:
  - ref: 1
    phrase: And the LORD appeared unto him
    kind: christ
    title: The LORD appears to Abraham
    body: |
      The one who appeared to Abraham at Mamre was the LORD, Jehovah (*YHWH*), whom the Church identifies as the premortal Christ. In the KJV the name “is generally denoted by Lord or God, printed in small capitals. Jehovah is the premortal Jesus Christ.” Abraham’s own record speaks of such meetings plainly: “Thus I, Abraham, talked with the Lord, face to face, as one man talketh with another” ([[Abr. 3:11]]).

      President Joseph Fielding Smith taught that the verse stands on its own, apart from the three men of verse 2: it should be read as “‘And the Lord appeared unto him in the plains of Mamre.’ That is a complete thought.” Joseph Smith’s manuscript keeps the verse as it stands, and it keeps the Lord present after the visitors leave: when “the Angels… went toward Sodom,” “Abraham stood yet before the Lord” (verse 22). The chapter ends as it began, with the LORD, who “went his way, as soon as he had left communing with Abraham” (verse 33).
    sources: [bd-jehovah, biblehub-interlinear, lds-scriptures, ot-manual-gen-18-23, jsp-ot2]
  - ref: 2
    phrase: three men stood by him
    kind: history
    title: Who were the three men?
    body: |
      Verse 2 calls them simply “men” (Hebrew *’anashim*), and the KJV leaves it unclear whether the LORD of verse 1 was one of them. Joseph Smith’s revision answers the question. In his manuscript they are “Angels, which were holy men, & were sent forth after the order of God” (verse 22 in the KJV), and it is “three Angels” who reach Sodom that evening, not two as in the KJV ([[Gen. 19:1]]). “After the order of God” echoes the revision’s account of Melchizedek, whose priesthood is “this order of God” (JST Gen. 14:32), and it has been read as “the order of the Melchizedek Priesthood.”

      The revision also changes who speaks to Abraham and Sarah. Where the KJV has “he said” (verse 10) and “the LORD said” (verse 13), the manuscript has “one of them blessed Abraham” and promised, “I will certainly return unto thee from my Journey,” and it is “the Angel of the Lord” who asks why Sarah laughed, adding that he will return “from my Journey, which the Lord hath sent me.” The messenger speaks for the Lord, and Abraham pleads with the Lord Himself after the messengers have gone.

      President Joseph Fielding Smith taught, “These three men were mortals. They had bodies and were able to eat, to bathe, and sit and rest from their weariness. Not one of these three was the Lord.” Beyond that, who they were is not revealed: “Although we do not know the identity of these messengers, Abraham treated them with deference and great respect.”
    sources: [biblehub-interlinear, jsp-ot2, lds-scriptures, scripture-helps-gen-18-23, horton-jst-genesis, ot-manual-gen-18-23]
  - ref: 3
    phrase: My Lord
    kind: words
    title: Lord, or lord?
    body: |
      Abraham’s first word to his guests is *’adonay*, and the Hebrew letters alone do not show whether he is speaking to God or to a man. The Masoretic text, the traditional Hebrew text that the KJV translates, gives the word slightly different vowels “to distinguish divine reference from human,” and here it has the divine form, the same form Abraham uses when he speaks “unto the Lord” in verses 27–32. Even so, the reading of this verse is not settled: “There is uncertainty as to” Genesis 18:3. The verse itself wavers between one and many: “thy sight… thy servant,” and then “wash your feet, and rest yourselves” (verse 4). Read with other vowels, the same word could be a polite “my lord” to one guest, or “my lords” to all three.

      Joseph Smith’s manuscript makes it a greeting to fellow servants of God: “my brethren, if now I have found favour in your Sight, pass not away, I pray you, from thy Servent.” That fits his reading of the visitors as holy men (see the note on verse 2). In that reading Abraham bows to them as honored guests, not as God.
    sources: [biblehub-interlinear, bd-masoretic-text, bdb, ryle-genesis, jsp-ot2]
  - ref: 6
    phrase: three measures of fine meal
    kind: history
    title: A morsel of bread, and a feast
    body: |
      Abraham offered the strangers “a little water” and “a morsel of bread” (verses 4–5), and then served them a feast. A “measure” was a *se’ah*, so three measures of fine flour come to “roughly ninety-three cups of flour,” and “Sarah would be able to make a lot of cakes with that much flour.” Then he chose a calf “tender and good,” served with butter and milk. The gap between what he offered and what he gave “serves to highlight Abraham’s hospitality and generosity.” Everything happens in a hurry: he “ran” to meet them, “hastened” into the tent, “ran” to the herd, and the young man “hasted” to dress the calf.

      Such welcome mattered, because “the ancient world could be a hostile place, and so there were cultural protections to protect and preserve travelers.” The same visitors reach Sodom that evening, where Lot, “like his uncle,” presses them to come in and makes them a feast, and the men of the city surround his house to take them ([[Gen. 19:1–5]]; see the notes there).
    sources: [shannon-abraham, biblehub-interlinear, benson-lot]
  - ref: 10
    phrase: according to the time of life
    kind: words
    title: When the season comes round
    body: |
      “The time of life” means about a year from now. The Hebrew *ka‘et chayyah* is literally “at the time (when it is) reviving,” that is, “the spring,” when the year comes back to life. God had already set the date: Sarah would bear Isaac “at this set time in the next year” ([[Gen. 17:21]]). The phrase comes again when Elisha promises a son to a childless woman of Shunem: “About this season, according to the time of life, thou shalt embrace a son” ([[2 Kgs. 4:16]]).
    sources: [bdb, biblehub-interlinear, lds-scriptures]
  - ref: 12
    phrase: Sarah laughed within herself
    kind: words
    title: Why Sarah laughed
    body: |
      Sarah laughed because what she overheard was, by every human measure, impossible. Verse 11 says plainly that she was past the age of bearing children. Her words in Hebrew are “After I am worn out (*beloti*), shall I have delight (*‘ednah*)?” Here *‘ednah* has a sexual sense: she is thinking of the act that would make the promise possible. She laughed “within herself” (*beqirbah*), silently, yet the question came at once: “Wherefore did Sarah laugh?” Afraid, she denied it, and the denial was not allowed to stand: “Nay; but thou didst laugh.”

      The laugh is not a verdict on her faith. Sarah’s “astonished laughter at the news that she was to conceive and bear a son should not be interpreted as proving her lack of faith.” Servants of the Lord in scripture are often “astonished beyond belief at the miraculous goodness of the Lord”: Zacharias, promised a son in old age, asked “Whereby shall I know this?” and was struck dumb ([[Luke 1:18–20]]). And “after approximately seventy years of childlessness, who could condemn her temporary inability to believe the joyous promise?” Hebrews counts her among the faithful: “Through faith also Sara herself received strength to conceive seed” ([[Heb. 11:11]]).

      Abraham had laughed at the same promise ([[Gen. 17:17]]; see the note there on Joseph Smith’s reading and on the name *Isaac*, “he laugheth,” which plays on both laughs).
    sources: [biblehub-interlinear, bdb, ot-manual-gen-18-23, lds-scriptures]
  - ref: 14
    phrase: Is any thing too hard for the LORD?
    kind: christ
    title: Nothing too wonderful
    body: |
      This question comes back in the New Testament, when the angel Gabriel announces the birth of Jesus. The Hebrew verb is *pala’*, to “be beyond one’s power, difficult to do,” and also to “be extraordinary, wonderful”; a modern translation reads, “Is anything too wonderful for the LORD?” The word for “thing” is *davar*, which also means “word.” Jeremiah prays the same question in the same words: “there is nothing too hard for thee,” and the Lord answers him, “is there any thing too hard for me?” ([[Jer. 32:17]]; [[Jer. 32:27]]).

      The Septuagint, the ancient Greek translation, renders the verse “Shall anything be impossible with the Lord?” That Greek wording “finds an echo” in Gabriel’s words to Mary: “For with God nothing shall be impossible” ([[Luke 1:37]]). The verb is the same (*adynateō*, “be impossible”), and so is the word for “thing” (*rhēma*, which also means “word”), and the Church’s footnotes link the two verses. Both are promises of a son to a woman who could not bear one by natural means, Sarah because she was old and Mary because she was a virgin. Sarah wonders within herself how it can be, and Mary asks (verses 12–13; [[Luke 1:34]]); both are answered with God’s power.
    sources: [biblehub-interlinear, bdb, nrsvue, lxx-rahlfs, ryle-genesis, greek-nt, lds-scriptures]
  - ref: 17
    phrase: Shall I hide from Abraham that thing which I do
    kind: scripture
    title: Why the LORD tells Abraham
    body: |
      The LORD reasons aloud and decides to tell Abraham what He is about to do. The thought of the verse is the one Amos would state as a rule: “Surely the Lord God will do nothing, but he revealeth his secret unto his servants the prophets” ([[Amos 3:7]]). Two chapters later God calls Abraham a prophet and in the same sentence says what a prophet does for others: “he is a prophet, and he shall pray for thee, and thou shalt live” ([[Gen. 20:7]]).

      Verses 18–19 give God’s reasons: Abraham will become a great nation in whom all nations will be blessed, and he will teach his household the way of the LORD. What follows suggests one more. God tells Abraham His plans for Sodom, Abraham objects, “and the intercessory probing begins”; “One cannot help but sense that God had intended this all along.”
    sources: [ryle-genesis, lds-scriptures, sears-intercession]
  - ref: 19
    phrase: For I know him
    kind: words
    title: Known, that is, chosen
    body: |
      “I know him” means more than acquaintance: it means God has chosen him. The Hebrew *yeda‘tiv*, “I have known him,” is the knowing the lexicon finds in God’s regard for Israel “as chosen people” in [[Amos 3:2]] (“You only have I known of all the families of the earth”), and it cites this verse beside it. A modern translation reads, “I have chosen him.”

      The verse also says what he was chosen for, in a chain of purposes: that “he will command his children and his household after him,” that “they shall keep the way of the LORD, to do justice and judgment,” and so “that the LORD may bring upon Abraham that which he hath spoken of him.” The promises reach Abraham’s descendants by way of what he teaches them. President Spencer W. Kimball said of Abraham that “he knew that if he failed to teach and exemplify the gospel to his children he would have failed to fulfill the most important stewardship he had received.” The word *mishpat*, “judgment,” comes back six verses later, when Abraham asks whether the Judge of all the earth will do it (verse 25).
    sources: [biblehub-interlinear, bdb, nrsvue, kimball-abraham-1975, lds-scriptures]
  - ref: 20
    phrase: the cry of Sodom and Gomorrah is great
    kind: words
    title: The outcry against Sodom
    body: |
      The “cry” is an outcry, and in the Bible the word is often a cry of distress that God hears. The Hebrew word, spelled two ways in verses 20 and 21, is used of the “outcry against” Sodom, and elsewhere for the “cry of distress especially as heard by” the LORD, as when He says of Israel in Egypt that He has “heard their cry” ([[Ex. 3:7]]), and for the “cry of poor” ([[Prov. 21:13]]). The text does not say who raised the outcry.

      What Sodom’s sin was is the subject of the next chapter, where the men of the city surround Lot’s house ([[Gen. 19:4–5]]). Scripture and the Church’s sources name several sins together: pride and neglect of “the poor and needy” ([[Ezek. 16:49–50]]), sexual immorality, which “was widely accepted and practiced in Sodom and nearby cities,” and the rejection of the prophets sent to them. The note on [[Gen. 19:5]] gathers them.
    sources: [biblehub-interlinear, bdb, scripture-helps-gen-18-23, lds-scriptures]
  - ref: 21
    phrase: I will go down now, and see
    kind: scripture
    title: Does the LORD need to go and see?
    body: |
      The LORD speaks as though He must go down and see Sodom for Himself before He judges it. Joseph Smith’s revision gives the errand to the messengers. In his manuscript the Angel of the Lord tells Abraham, “the Lord said unto us, Because the cry of Sodom & gomorah is great, & because their sin is very grievious, I will destroy them. & I will send you, & ye shall go down now, And see that their iniquitise are rewarded unto them.” The angels go not to find out what God does not know but to carry out what He has decided: “you shall know that I will do it, for it shall be before your eyes.”

      In the revision, then, Abraham pleads knowing what has been decreed. The angels leave, and “Abraham stood yet before the Lord, remembering the things which had been told him.”
    sources: [lds-scriptures, jsp-ot2]
  - ref: 25
    phrase: Shall not the Judge of all the earth do right?
    kind: words
    title: Mercy argued from justice
    body: |
      Abraham pleads for mercy, but he argues from justice. His question is in the language of the courtroom: “the Judge” is *ha-shofet*, and “do right” is *ya‘aseh mishpat*, literally “do justice,” the “attribute of the [judge], justice, right, rectitude,” here “of God.” Sweeping away the righteous with the wicked would not be just, so Abraham “is pleading for mercy… but he does so with an appeal to the Lord’s justice and righteous judgment.”

      A scene like this can cause “theological discomfort”: the prophet sounds “very much like a legal advocate, which leaves God playing the role of prosecutor.” But God opened the conversation, and He grants every request Abraham makes. “Despite their literary presentation as such, intercessory episodes are not really a fight to change God’s mind”; they are better read as explorations of “the simultaneous operation of both justice and mercy within God himself.” The repetition is part of the lesson. God “could have simply told Abraham he would spare Sodom if he could find ten righteous people,” but He let Abraham ask again and again, and through the asking “Abraham came to understand that God was willing to show mercy and spare the wicked in Sodom and Gomorrah if even a few righteous people lived there.” Moses would plead for Israel the same way after the golden calf ([[Ex. 32:9–14]]).
    sources: [biblehub-interlinear, bdb, shannon-abraham, sears-intercession, scripture-helps-gen-18-23]
  - ref: 26
    phrase: I will spare all the place for their sakes
    kind: words
    title: Spared for the sake of the righteous
    body: |
      The verb translated “spare” here and in verse 24 is *nasa’*. In one reading Abraham asks whether God will “destroy and not forgive” the city, the word meaning “to take away and bear the guilt, i.e., forgive” the place for the sake of the righteous in it. God answers in the same word.

      That a few righteous people can preserve a wicked city is a principle the Book of Mormon states outright. Amulek told the people of Ammonihah that “if it were not for the prayers of the righteous, who are now in the land, that ye would even now be visited with utter destruction,” and warned, “if ye will cast out the righteous from among you then will not the Lord stay his hand” ([[Alma 10:22–23]]). Through Samuel the Lamanite the Lord said of Zarahemla, “it is because of those who are righteous that it is saved” ([[Hel. 13:12–14]]). “In other scriptural accounts, God has often shown mercy by sparing the wicked because of the righteous.” Jeremiah was told to search Jerusalem “if ye can find a man… and I will pardon it” ([[Jer. 5:1]]).
    sources: [biblehub-interlinear, keil-genesis, scripture-helps-gen-18-23, lds-scriptures]
  - ref: 27
    phrase: which am but dust and ashes
    kind: words
    title: Dust and ashes
    body: |
      By calling himself “dust and ashes,” Abraham confesses that he is a mortal creature, and still he presses on. The two Hebrew words sound alike: *‘afar va-’efer*. Dust is what man was made from and returns to ([[Gen. 2:7]]; [[Gen. 3:19]]), and the Church’s footnote links King Benjamin’s people, who “viewed themselves in their own carnal state, even less than the dust of the earth” as they pleaded for mercy ([[Mosiah 4:2]]).

      Joseph Smith’s manuscript turns the phrase toward the city. There Abraham speaks “unto the Lord which is able to destroy the City And lay all the people in dust And ashes.” In that reading the dust and ashes are what Sodom will become if the Lord does not spare it.
    sources: [biblehub-interlinear, ryle-genesis, lds-scriptures, jsp-ot2]
  - ref: 32
    phrase: I will not destroy it for ten’s sake
    kind: history
    title: Why stop at ten?
    body: |
      The text does not say why Abraham stopped at ten. The next chapter shows that Sodom was destroyed, and in one reading that judgment “proves that there were not ten ‘righteous persons’ in Sodom.” Abraham never names Lot, but “his presence looms over Abraham’s interaction with God”: Lot “was living in the city, and thus the destruction of Sodom would include him.”

      The plea was answered all the same: “God remembered Abraham, and sent Lot out of the midst of the overthrow” ([[Gen. 19:29]]; see the note there). Abraham’s “intercession had not been in vain.”
    sources: [keil-genesis, benson-lot, lds-scriptures]

christ: |
  The LORD who comes to Abraham’s tent is Jehovah, “the premortal Jesus Christ.” Abraham calls Him “the Judge of all the earth” (verse 25). The Church’s footnote to that verse points to “Jesus Christ, Judge,” and John records that “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). The question asked over Sarah’s laughter comes back at His own birth (see the note on verse 14).

  Abraham’s own place in the scene, standing before the Lord and pleading for others, can be read as a type of Christ. Latter-day Saints may read prophetic intercession “as typological for the role of Jesus,” who is “our ‘advocate with the Father.’” In latter-day revelation He is the one “who is pleading your cause before him,” and His plea ends, “Wherefore, Father, spare these my brethren that believe on my name” ([[D&C 45:3–5]]).

explore: |
  - **What happened to Sodom.** [[Gen. 19:1–29]], especially verses 27–29, where Abraham goes back to the place where he stood before the Lord.
  - **Prophets who pleaded for a people.** [[Ex. 32:9–14]]; [[Amos 7:1–6]]; [[Jer. 5:1]]. “O Lord God, Forgive! Prophetic Intercession in Amos” (Religious Studies Center, 2017) works through what these scenes teach about justice and mercy, and reads them as a type of Christ.
  - **Nothing too hard.** [[Rom. 4:19–21]], Paul on Abraham’s faith in the promise of a son.
  - **Joseph Smith’s revision.** His manuscript of this chapter is Old Testament Revision 2, pages 44–47, in the Joseph Smith Papers.

