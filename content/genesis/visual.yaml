alt: A spring beneath a tree in a garden feeds a broad river that winds toward a far mountain, where a small ark rests under a rainbow. On golden ground at the right stand a stone altar laid with firewood, a ram caught by its horns in a thicket, and a ring of grain sheaves around one upright sheaf, beneath a starry sky.
