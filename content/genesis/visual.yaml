summary: >-
  Genesis tells of creation, the Fall, Noah's covenant, and God's covenant family
  through Abraham, Isaac, and Jacob.
motifs:
  - A fruitless Tree of Life beside a fountain of living water.
  - A river dividing a verdant garden from a drier but fertile covenant landscape.
  - A stone altar, a ram in a thicket, stars, and a covenant arc.
composition: The river leads through the center; Eden is on the left and covenant sacrifice on the right.
asset: /assets/genesis-covenant-landscape.png
alt: A fountain flows beneath the Tree of Life into a river dividing a verdant garden from an open, covenant-marked landscape.
