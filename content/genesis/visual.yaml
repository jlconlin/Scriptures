summary: >-
  Genesis tells of creation, the Fall, Noah's covenant, and God's covenant family
  through Abraham, Isaac, and Jacob.
motifs:
  - "In the near left corner, the edge of a green garden: one fruitless tree with a small spring at its roots, the source of the river."
  - "A wide, calm river that runs from the spring to the far horizon in one broad sweep with a single bend."
  - "On a far mountain, one very small ark of weathered wood lying aground near the summit, with a rainbow arching over it, partly hidden by the tree."
  - "In the right foreground, the nearest thing on that side: a low altar of rough field stones with a bundle of split firewood laid across its top."
  - "Behind the altar, a cream-white ram caught by its horns in a living thorn thicket and struggling to get free, the ground trampled bare under its feet."
  - "Beyond the ram, in an open field, a ring of bound sheaves of grain around one taller sheaf standing upright at its center."
  - "A deep indigo sky in which the stars are out."
composition: >-
  The river is the road through the book, read from the near left to the far right:
  the garden corner, then the ark and rainbow far off, then the altar, the ram and
  the sheaves on open golden ground at the right, which is the focal point. The
  garden is a modest corner, never the subject. Only these three places, with wide,
  empty ground and open water between them and no building anywhere (a tower for
  Babel was tried and taken out as too prominent; author, 2026-10-12). The light is
  the low, warm sun of early evening behind the viewer and a little to the left, so
  shadows fall away toward the right distance and the rainbow stands in the darker
  sky ahead, opposite the sun.
asset: /assets/genesis-book-art.png
alt: A spring beneath a tree in a garden feeds a broad river that winds toward a far mountain, where a small ark rests under a rainbow. On golden ground at the right stand a stone altar laid with firewood, a ram caught by its horns in a thicket, and a ring of grain sheaves around one upright sheaf, beneath a starry sky.
status: approved
