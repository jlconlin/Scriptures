name: Genesis
slug: genesis

# Site-level fields (see "Adding a new book" in DEVELOPMENT.md)
order: 0
abbr: gen                # [[Gen. 1:1]] links here
gospelLibrary: ot/gen
eyebrow: The Old Testament
heroQuote:
  text: '“In thee shall all families of the earth be blessed.”'
  cite: 'The Lord to Abram, [[Gen. 12:3]]'
description: A phrase-by-phrase companion to the book of Genesis, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Genesis follows one family line at a time and narrows, from all mankind to Noah, to Abraham, to the twelve sons of Jacob.
home:
  blurb: The book of beginnings, from the Creation to the family of Abraham, Isaac, Jacob, and Joseph.

intro: |
  Genesis is a Greek word meaning “origin” or “beginning.” The book is an account of beginnings: the creation of the earth, the Fall, the gospel revealed to Adam, the Flood, the tower of Babel, and the family of Abraham that became the house of Israel. Its frame is a series of family records, each opening “These are the generations.” Latter-day revelation names Moses as its author ([[Moses 1:40–41]]; [[1 Ne. 5:10–11]]).

  This companion goes through all fifty chapters and tries to anticipate the questions a careful reader asks: *Who is this? Where is this? What did that word or custom mean? Where is Christ in this?* What the Gospel Library already puts beside the verse (the footnotes, the Joseph Smith Translation, the chapter heading) is not repeated here for its own sake; it comes in where it answers the question.

# The large movements of the book, following the Bible Dictionary’s outline (“Genesis”), which arranges
# the book by family line. Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: beginnings
    range: [1, 3]
    name: The Creation and the Fall
    blurb: The earth is made and called very good. Adam and Eve are placed in Eden, partake of the fruit, and are sent out into the world, with a promise about the woman’s seed.
    color: '#2b7a8a'
    darkColor: '#74c4d4'
  - key: noah
    range: [4, 11]
    name: From Adam to Noah and the Nations
    blurb: Cain and Abel, the line of Seth down to Enoch and Noah, the Flood and the covenant of the rainbow, and the scattering at the tower of Babel. The record then follows the line of Shem to Abram.
    color: '#5c6b9a'
    darkColor: '#a9b6e0'
  - key: abraham
    range: [12, 25]
    name: Abraham
    blurb: The Lord calls Abram out of his country and covenants with him for a land, a posterity, and a blessing for all families of the earth. Melchizedek, Hagar and Ishmael, Sodom, the birth of Isaac, and the offering on Moriah.
    color: '#a8642a'
    darkColor: '#e0a070'
  - key: jacob
    range: [26, 36]
    name: Isaac and Jacob
    blurb: The covenant passes to Isaac and then to Jacob, the younger son. Jacob’s dream at Beth-el, his years with Laban, the births of his sons, and the night he is named Israel.
    color: '#4f8a4a'
    darkColor: '#93cf8d'
  - key: joseph
    range: [37, 50]
    name: Joseph and His Brothers
    blurb: Joseph is sold into Egypt, rises to rule it, and saves the family that sold him. The book closes with Jacob’s blessings on his sons and Joseph’s death in Egypt.
    color: '#8a4a7a'
    darkColor: '#d59ac6'

