    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/genesis/37-14.htm
    quote: שְׁל֤וֹם the welfare
  - where: note 37:2 “Why Joseph’s story is “the generations of Jacob””
    claim: Toledot means an account of a man and his descendants; Gen. 37:2 is listed
    key: bdb
    url: https://biblehub.com/hebrew/8435.htm
    quote: account of a man and his descendants
  - where: note 37:2 “Why Joseph’s story is “the generations of Jacob””
    claim: Genesis’s structure rests on genealogies and each section begins “These are the generations”
    key: bd-genesis
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng
    quote: The structure of the book of Genesis rests on several genealogies. Each new section begins “These are the generations,”
  - where: note 37:2 “Why Joseph’s story is “the generations of Jacob””
    claim: This toledot runs to the end of Genesis and is the history of the family’s removal to Egypt through Joseph
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/37.htm
    quote: This Tôldôth, therefore, extends to the end of Genesis, and is the history of the removal, through Joseph’s instrumentality, of the family of Jacob from Canaan into Egypt
  - where: note 37:2 “What was the evil report?”
    claim: Dibbah is “evil report, specifically a (true) report of evil doing,” with Gen. 37:2 as the example
    key: bdb
    url: https://biblehub.com/hebrew/1681.htm
    quote: evil report, specifically a (true) report of evil doing Genesis 37:2
  - where: note 37:2 “What was the evil report?”
    claim: Joseph’s action brought the odium of tale-bearing
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/37.htm
    quote: But Joseph’s action brought upon him the odium of tale-bearing.
  - where: note 37:3 “What was Joseph’s coat?”
    claim: "Passim occurs only in this phrase: a tunic reaching to palms and soles (Gen. 37:3, 23, 32; 2 Sam. 13:18–19)"
    key: bdb
    url: https://biblehub.com/hebrew/6446.htm
    quote: tunic reaching to palms and soles
  - where: note 37:3 “What was Joseph’s coat?”
    claim: Ketonet passim is a tunic with long skirts and sleeves; also used of a king’s daughter in 2 Sam. 13:18
    key: bdb
    url: https://biblehub.com/hebrew/3801.htm
    quote: tunic with long skirts and sleeves
  - where: note 37:3 “What was Joseph’s coat?”
    claim: The Septuagint reads “a coat of many colours”
    key: lxx-rahlfs
    url: https://biblehub.com/sep/genesis/37.htm
    quote: and he made for him a coat of many colours
  - where: note 37:3 “What was Joseph’s coat?”
    claim: The “many colours” rendering from the LXX and Vulgate is “certainly incorrect”
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/37.htm
    quote: tunicam polymitam, is certainly incorrect.
  - where: note 37:3 “What was Joseph’s coat?”
    claim: The same two Hebrew words describe the garment of the king’s daughter, KJV “garment of divers colours”
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/13?lang=eng
    quote: "And she had a garment of divers colours upon her: for with such robes were the king’s daughters that were virgins apparelled."
  - where: note 37:3 “What was Joseph’s coat?”
    claim: Joseph obtained the birthright when Reuben lost it
    key: bd-joseph
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/joseph?lang=eng
    quote: Joseph obtained the birthright in Israel because he was worthy and because it was his natural right.
  - where: note 37:3 “What was Joseph’s coat?”
    claim: Scripture Helps says the coat may have represented the birthright
    key: scripture-helps-gen-37-41
    url: https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng
    quote: It is possible that Joseph received this coat to represent his role as Jacob’s birthright son.
  - where: note 37:3 “What was Joseph’s coat?”
    claim: Reuben’s birthright went to Joseph’s sons
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng
    quote: his birthright was given unto the sons of Joseph the son of Israel
  - where: note 37:3 “What was Joseph’s coat?”
    claim: If the coat signaled the birthright, that would explain the hostility it provoked
    key: ot-manual-gen-37-50
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng
    quote: this fact would explain the intense hostility and jealousy the coat provoked among the other sons of Jacob
  - where: note 37:3 “What was Joseph’s coat?”
    claim: Simeon, as next of Leah’s sons, could have assumed the birthright
    key: ot-manual-gen-37-50
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng
    quote: Since he was the second son of Leah and next in line following Reuben, he could have assumed the birthright would come to him
  - where: note 37:3 “What was Joseph’s coat?”
    claim: Judah could argue Simeon and Levi had lost the right at Shechem
    key: ot-manual-gen-37-50
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng
    quote: He could have argued that not only Reuben had lost the right, but so had Simeon and Levi, through the massacre of the Shechemites
  - where: note 37:3 “What was Joseph’s coat?”
    claim: Dan and Gad, the handmaids’ firstborn, could have claimed it
    key: ot-manual-gen-37-50
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng
    quote: He was the firstborn son of Zilpah and therefore could easily have thought he should have taken the birthright after Reuben forfeited it.
  - where: note 37:5 “Were Joseph’s dreams from God?”
    claim: Dreams are one way God reveals His will, though not all dreams are revelations
    key: gs-dream
    url: https://www.churchofjesuschrist.org/study/scriptures/gs/dream?lang=eng
    quote: One way that God reveals His will to men and women on earth. Not all dreams are revelations, however.
  - where: note 37:5 “Were Joseph’s dreams from God?”
    claim: Joseph was a visionary man, a dreamer and interpreter of dreams
    key: bd-joseph
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/joseph?lang=eng
    quote: Joseph was a visionary man, a dreamer and interpreter of dreams
  - where: note 37:5 “Were Joseph’s dreams from God?”
    claim: "JST Gen. 48:10: the bowing was shown to Joseph before he was sold"
    key: jst-gen-48
    url: https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/48?lang=eng
