    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng
    quote: The phraseology in this verse is the same as that used in Genesis 37:7, 9 . It had taken over two decades, but the Lord’s revelations were now fulfilled.
