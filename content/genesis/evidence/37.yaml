chapter: 37
claims:
  - where: setting
    claim: Genesis stresses Joseph as a preserver of Israel
    key: bd-genesis
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng
    quote: Joseph’s role as a preserver of Israel is also given emphasis.
  - where: setting
    claim: Shechem is about sixty miles from Jacob’s home near Hebron
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/37.htm
    quote: while dwelling a little to the north of Hebron, he should send part of his. cattle so far away as to Shechem, a distance of sixty miles
  - where: setting
    claim: Dothan is about 15 miles north of Shechem
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/37.htm
    quote: a hill on the S. side of the plain of Jezreel, and some 15 miles N. of Shechem
  - where: setting
    claim: Dothan lay on the trade route from Gilead toward Egypt
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/37.htm
    quote: Dothan lay on the trade route that led from Gilead through the valley of Jezreel towards Egypt.
  - where: setting
    claim: “These are the generations of Jacob” opens the last section of the book (this toledot extends to the end of Genesis)
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/37.htm
    quote: This Tôldôth, therefore, extends to the end of Genesis
  - where: thread
