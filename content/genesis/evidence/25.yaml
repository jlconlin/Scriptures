chapter: 25
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Isaac was forty at his marriage and sixty when the twins were born; Abraham lived 175 years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And Isaac was forty years old when he took Rebekah to wife'
  - where: 'setting'
    claim: 'Abraham was a hundred when Isaac was born'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21?lang=eng'
    quote: 'And Abraham was an hundred years old, when his son Isaac was born unto him.'
  - where: 'setting'
    claim: 'Isaac was sixty when the twins were born, so Abraham was 160 and lived fifteen years more (to 175)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'and Isaac was threescore years old when she bare them.'
  - where: 'setting'
    claim: 'Genesis is built on genealogies; each new section begins “These are the generations”'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'The structure of the book of Genesis rests on several genealogies. Each new section begins “These are the generations,”'
  - where: 'setting'
    claim: 'Abraham is the chief figure from 12:1 to 25:18'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Abraham is now the chief figure (12:1–25:18).'
  - where: 'setting'
    claim: 'Rebekah waited twenty years for children (Isaac 40 at marriage, 60 at the birth)'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'it would be another twenty years after her marriage to Isaac before Rebekah gave birth to her two sons.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Genesis lets side branches go and follows the chosen line: of Abraham’s children the lines of Ishmael and Keturah branch off'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Of Abraham’s own children there branches off first the line of Ishmael and next the children of Keturah'
  - where: 'thread'
    claim: 'The brothers’ agency will play a major role in their experiences with the covenant'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'it does begin to suggest that the brothers’ agency will play a major role in their respective experiences with the covenant.'
  - where: 'thread'
    claim: 'Election is an opportunity for service, accomplished by individual faithfulness'
    key: bd-election
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/election?lang=eng'
    quote: 'Election is an opportunity for service and is both on a national and an individual basis. On a national basis the seed of Abraham carry the gospel to the world. But it is by individual faithfulness that it is done.'

  - where: 'thread'
    claim: 'Jacob did not trick Esau; Esau gave the birthright up because he despised it'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'what is clear is that Jacob did not trick Esau, but Esau willingly gave up the birthright because he despised it.'

  # ---------- section plain ----------
  - where: 'section 2 plain'
    claim: '“Full of years” is literally “satisfied”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-8.htm'
    quote: 'wə·śā·ḇê·a‘; וְשָׂבֵ֑עַ and satisfied'
  - where: 'section 3 plain'
    claim: '“By their towns, and by their castles”: villages and encampments; twelve princes of tribes'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/25.htm'
    quote: 'These are the Ishmaelites "in their villages and encampments, twelve princes according to their tribes."'
  - where: 'section 3 plain'
    claim: 'Verse 18: he settled alongside all his people'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2025&version=NRSVUE'
    quote: 'he settled down … alongside … all his people'
  - where: 'section 4 plain'
    claim: '“Syrian” is “the Aramean”; Padan-aram'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-20.htm'
    quote: 'הָֽאֲרַמִּ֔י the Aramaean'
  - where: 'section 4 plain'
    claim: 'The children crushed one another within her'
    key: bdb
    url: 'https://biblehub.com/hebrew/7533.htm'
    quote: 'the children crushed (thurst, struck) one another within her'
  - where: 'section 4 plain'
    claim: '“Hairy garment”: like a hairy cloak'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-25.htm'
    quote: 'kə·’ad·de·reṯ כְּאַדֶּ֣רֶת like a cloak'
  - where: 'section 5 plain'
    claim: '“Cunning” means skillful'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/cunning'
    quote: 'Knowing; skillful; experienced; well-instructed.'
  - where: 'section 5 plain'
    claim: '“Sod” is the past tense of seethe (boil)'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/sod'
    quote: 'SOD , preterit tense of seethe'
  - where: 'section 5 plain'
    claim: 'Jacob boiled a stew'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-29.htm'
    quote: 'way·yā·zeḏ וַיָּ֥זֶד And boiled'
  - where: 'section 5 plain'
    claim: '“Loved” in verse 28 in the sense of favored'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: 'is used in the sense of “favored” or “preferred.” Thus, Isaac favored Esau and Rebekah favored Jacob.'

  # ---------- note 25:1 Keturah ----------
  - where: 'note 25:1 “Keturah, Abraham’s last wife”'
    claim: 'Keturah was Abraham’s wife after Sarah’s death; various tribes, including the Midianites, came from her; she appears only in Gen. 25 and 1 Chr. 1'
    key: bd-keturah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/keturah?lang=eng'
    quote: 'Wife of Abraham after Sarah’s death (Gen. 25:1, 4; 1 Chr. 1:32–33); hence sprang various tribes, including the Midianites.'
  - where: 'note 25:1 “Keturah, Abraham’s last wife”'
    claim: 'Verse 6 uses pilagshim, “concubines”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-6.htm'
    quote: 'hap·pî·laḡ·šîm הַפִּֽילַגְשִׁים֙ of the concubines'
  - where: 'note 25:1 “Keturah, Abraham’s last wife”'
    claim: 'Chronicles calls Keturah Abraham’s concubine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/1?lang=eng'
    quote: 'Now the sons of Keturah, Abraham’s concubine'
  - where: 'note 25:1 “Keturah, Abraham’s last wife”'
    claim: 'A concubine was legally married but with lower legal and social status than a wife'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'a concubine was a woman within a household who was legally married to a man but had a lower legal and social status than a wife.'
  - where: 'note 25:1 “Keturah, Abraham’s last wife”'
    claim: 'D&C 132:37: Abraham received concubines; accounted to him for righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'Abraham received concubines, and they bore him children; and it was accounted unto him for righteousness, because they were given unto him'

  # ---------- note 25:2 Midian ----------
  - where: 'note 25:2 “Midian and the priesthood of Jethro”'
    claim: 'Through Keturah’s line Moses received the Melchizedek Priesthood from Jethro'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'Through Keturah’s line, Moses received the Melchizedek Priesthood from his father-in-law, Jethro'
  - where: 'note 25:2 “Midian and the priesthood of Jethro”'
    claim: 'Jethro was a prince and priest of Midian; Moses received the Melchizedek Priesthood from him'
    key: bd-jethro
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jethro?lang=eng'
    quote: 'a prince and priest of Midian who gave Moses a home after his flight from Egypt and afterwards became his father-in-law'
  - where: 'note 25:2 “Midian and the priesthood of Jethro”'
    claim: 'D&C 84 traces Jethro’s priesthood back to Esaias, who lived in Abraham’s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Esaias also lived in the days of Abraham, and was blessed of him'

  # ---------- note 25:8 gathered ----------
  - where: 'note 25:8 “Gathered to his people”'
    claim: 'Hebrew: vayye’asef el-‘ammav, “and he was gathered to his people”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-8.htm'
    quote: 'way·yê·’ā·sep̄ וַיֵּאָ֖סֶף and he was gathered'
  - where: 'note 25:8 “Gathered to his people”'
    claim: 'BDB lists the phrase for Abraham, Ishmael, Isaac, Jacob, Aaron, Moses'
    key: bdb
    url: 'https://biblehub.com/hebrew/622.htm'
    quote: 'be gathered to one''s fathers'
  - where: 'note 25:8 “Gathered to his people”'
    claim: 'BDB lists the phrase “to one’s people” at Gen. 25:8, 17; 35:29; 49:29, 33; Num. 20:24, 26; Deut. 32:50'
    key: bdb
    url: 'https://biblehub.com/hebrew/622.htm'
    quote: 'elsewhere to one''s people'
  - where: 'note 25:8 “Gathered to his people”'
    claim: 'The expression is distinguished from dying and being buried; it denotes reunion with those gone before and presupposes life after death'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/25.htm'
    quote: 'but is constantly distinguished from departing this life and being buried, denotes the reunion in Sheol with friends who have gone before, and therefore presupposes faith in the personal continuance of a man after death'
  - where: 'note 25:8 “Gathered to his people”'
    claim: 'The phrase is evidence of the patriarchs’ gospel knowledge; Sheol is the spirit world'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: 'is the Hebrew word for the world of spirits where one goes when one dies, the equivalent of the spirit world.'
  - where: 'note 25:8 “Gathered to his people”'
    claim: 'The phrase is one more evidence of the patriarchs’ gospel knowledge'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: 'The phrase “gathered to his people” is one more evidence of their gospel knowledge.'
  - where: 'note 25:8 “Gathered to his people”'
    claim: 'Terah died in Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'and Terah died in Haran.'
  - where: 'note 25:8 “Gathered to his people”'
    claim: 'D&C 132:29: Abraham has entered into his exaltation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'hath entered into his exaltation and sitteth upon his throne.'

  - where: 'note 25:8 “Gathered to his people”'
    claim: '“Full of years” is literally “satisfied” (sabea‘)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-8.htm'
    quote: 'wə·śā·ḇê·a‘; וְשָׂבֵ֑עַ and satisfied'

  # ---------- note 25:9 Isaac and Ishmael ----------
  - where: 'note 25:9 “Isaac and Ishmael at the grave”'
    claim: 'The text does not say Ishmael was bad or that tension lasted; Isaac and Ishmael worked together to bury their father'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'The text does not state that Ishmael was a bad person, nor that there was a long-lasting tension between Ishmael and Isaac in subsequent years.'
  - where: 'note 25:9 “Isaac and Ishmael at the grave”'
    claim: 'Isaac and Ishmael worked together to bury their father'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'both Isaac and Ishmael would work together to bury their father and console the family at Abraham’s passing'
  - where: 'note 25:9 “Isaac and Ishmael at the grave”'
    claim: 'Machpelah: Sarah, Abraham, Isaac, Rebekah, Leah, and Jacob were buried there'
    key: bd-machpelah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/machpelah?lang=eng'
    quote: 'The field and cave bought by Abraham (Gen. 23:9, 17), where were buried Sarah (23:19), Abraham (25:9), Isaac, Rebekah, and Leah (49:30–31), and Jacob (50:13).'
  - where: 'note 25:9 “Isaac and Ishmael at the grave”'
    claim: 'Esau and Jacob later buried Isaac together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'and his sons Esau and Jacob buried him.'

  # ---------- note 25:11 Lahai-roi ----------
  - where: 'note 25:11 “Isaac at Hagar’s well”'
    claim: 'After Abraham’s death the blessing passed to Isaac, who lived at Hagar’s well, where he had lived before'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/25.htm'
    quote: 'After Abraham''s death the blessing was transferred to Isaac, who took up his abode by Hagar''s well, because he had already been there'
  - where: 'note 25:11 “Isaac at Hagar’s well”'
    claim: 'Isaac was already living there when Rebekah came'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/24?lang=eng'
    quote: 'And Isaac came from the way of the well Lahai-roi; for he dwelt in the south country.'

  # ---------- note 25:12 generations ----------
  - where: 'note 25:12 “Ishmael’s line first, then Isaac’s”'
    claim: 'The Hebrew heading is toledot, “generations”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-12.htm'
    quote: 'tō·lə·ḏōṯ תֹּלְדֹ֥ת the generations'
  - where: 'note 25:12 “Ishmael’s line first, then Isaac’s”'
    claim: 'Cain’s line branches off while the history follows Seth'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'The line of Cain branching off; while the history follows the fortunes of Seth'
  - where: 'note 25:12 “Ishmael’s line first, then Isaac’s”'
    claim: 'Of Abraham’s children the lines of Ishmael and Keturah branch off'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Of Abraham’s own children there branches off first the line of Ishmael and next the children of Keturah'
  - where: 'note 25:12 “Ishmael’s line first, then Isaac’s”'
    claim: 'God’s relation to Israel holds the first place throughout'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'God’s relation to Israel holds the first place throughout in the writer’s mind.'
  - where: 'note 25:12 “Ishmael’s line first, then Isaac’s”'
    claim: 'The short account shows the promises to Ishmael were fulfilled; by the plan of Genesis it precedes Isaac’s history'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/25.htm'
    quote: 'To show that the promises of God, which had been made to Ishmael (Genesis 16:10. and Genesis 17:20), were fulfilled, a short account is given of his descendants; and according to the settled plan of Genesis, this account precedes the history of Isaac.'
  - where: 'note 25:12 “Ishmael’s line first, then Isaac’s”'
    claim: 'God promised Ishmael twelve princes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'twelve princes shall he beget, and I will make him a great nation.'

  - where: 'note 25:12 “Ishmael’s line first, then Isaac’s”'
    claim: 'The account of Isaac’s life runs 21:1–35:29'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Isaac. The account of his life (21:1–35:29)'
  - where: 'note 25:12 “Ishmael’s line first, then Isaac’s”'
    claim: 'Esau’s genealogy (ch. 36), then he drops out of the narrative'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'the genealogy of Esau (Gen. 36), who then drops out of the narrative'

  # ---------- note 25:18 ----------
  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'The Hebrew verb is naphal, “he fell”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-18.htm'
    quote: 'nā·p̄āl. נָפָֽל׃פ has he fallen'
  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'The phrase is ‘al-pene kol-echav, “against the faces of all his brothers”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-18.htm'
    quote: '‘al- עַל־ Against'
  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'BDB lists Gen. 25:18 under the sense “settle”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5307.htm'
    quote: 'settle Genesis 25:18'
  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'NRSVUE: “he settled down alongside all his people,” note “Heb he fell”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2025&version=NRSVUE'
    quote: '25.18 Heb he fell'
  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'NRSVUE alternative: “down in opposition to”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2025&version=NRSVUE'
    quote: '25.18 Or down in opposition to'
  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'Gen. 16:12 has the same phrase, ‘al-pene kol-echav yishkon, “over against all his brothers he shall dwell”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-12.htm'
    quote: 'wə·‘al- וְעַל־ and over against'
  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'Gen. 16:12: “he shall dwell” (yishkon)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-12.htm'
    quote: 'yiš·kōn. יִשְׁכֹּֽן׃ he shall dwell'
  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'This fulfills the angel’s announcement that Ishmael would encamp in the presence of his brethren (one reading)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/25.htm'
    quote: 'Thus, according to the announcement of the angel, Ishmael "encamped in the presence of all his brethren."'

  - where: 'note 25:18 “He settled facing his brothers”'
    claim: 'Ishmael’s descendants dwelt from Havilah toward Shur'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/25.htm'
    quote: 'Ishmael died at the age of 137, and his descendants dwelt in Havilah'

  # ---------- note 25:21 barren ----------
  - where: 'note 25:21 “Twenty years of waiting”'
    claim: 'Twenty years passed after the marriage before Rebekah gave birth'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'it would be another twenty years after her marriage to Isaac before Rebekah gave birth to her two sons.'
  - where: 'note 25:21 “Twenty years of waiting”'
    claim: 'All but one of the matriarchs faced barrenness; a son was the assurance of the covenant’s continuation'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'all but one of the matriarchs faced trial and refinement through a period of barrenness.'
  - where: 'note 25:21 “Twenty years of waiting”'
    claim: 'A son was the assurance of the continuation of the covenant'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'a son for these matriarchs was the assurance of the continuation of God’s covenant with Abraham.'
  - where: 'note 25:21 “Twenty years of waiting”'
    claim: 'The same verb ‘atar is used for Isaac’s plea and the LORD’s answer'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-21.htm'
    quote: 'way·ye‘·tar 21 וַיֶּעְתַּ֨ר 21 And entreated'
  - where: 'note 25:21 “Twenty years of waiting”'
    claim: 'The same verb ‘atar (Niphal) for the answer'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-21.htm'
    quote: 'way·yê·‘ā·ṯer וַיֵּעָ֤תֶר Was entreated'
  # ---------- note 25:22 ----------
  - where: 'note 25:22 “Why do I live?”'
    claim: 'The verb ratsats: the children crushed one another'
    key: bdb
    url: 'https://biblehub.com/hebrew/7533.htm'
    quote: 'the children crushed (thurst, struck) one another within her'
  - where: 'note 25:22 “Why do I live?”'
    claim: 'Hebrew: lammah zeh anokhi, “why this I?”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/25-22.htm'
    quote: 'lām·māh לָ֥מָּה why … zeh זֶּ֖ה this … ’ā·nō·ḵî; אָנֹ֑כִי I'
  - where: 'note 25:22 “Why do I live?”'
    claim: 'NRSVUE: “why do I live?” with note that the Hebrew is uncertain and it follows the Syriac'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2025&version=NRSVUE'
    quote: 'If it is to be this way, why do I live?'
  - where: 'note 25:22 “Why do I live?”'
    claim: 'NRSVUE note: Syriac; meaning of Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2025&version=NRSVUE'
    quote: '25.22 Syr: Meaning of Heb uncertain'
  - where: 'note 25:22 “Why do I live?”'
    claim: 'ESV: “why is this happening to me?” or “why do I live?”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2025&version=ESV'
    quote: 'If it is thus, why is this happening to me?'
  - where: 'note 25:22 “Why do I live?”'
    claim: 'ESV note: Or why do I live?'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2025&version=ESV'
    quote: 'Genesis 25:22 Or why do I live?'
  - where: 'note 25:22 “Why do I live?”'
    claim: 'Darash, “inquire of,” is the verb for consulting God, Gen. 25:22; Ex. 18:15; 1 Sam. 9:9'
    key: bdb
