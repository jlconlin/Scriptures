    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'And I hated Esau, and laid his mountains and his heritage waste for the dragons of the wilderness.'

  - where: 'note 25:23 “Chosen before they were born?”'
