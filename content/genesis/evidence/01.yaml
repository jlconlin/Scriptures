chapter: 1
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The scriptures do not say how or when the earth was created'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'the scriptures do not provide details about how or when the earth was created.'
  - where: setting
    claim: 'Bible Dictionary: Moses wrote the Pentateuch, using documentary sources for Genesis besides revelation'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'The Pentateuch was written by Moses, although it is evident that he used several documentary sources from which he compiled the book of Genesis, besides a divine revelation to him.'
  - where: setting
    claim: 'The Bible does not name the author of the Pentateuch; many scholars see several writers and editors'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'The Bible itself does not identify who wrote the Pentateuch. Many scholars believe that there were multiple writers, editors, and others involved in producing the text we have today'
  - where: setting
    claim: 'Restoration scripture confirms Moses’s central involvement'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'Restoration scripture confirms Moses’s central involvement in these works'
  - where: setting
    claim: 'Scribes and copyists left traces on the Pentateuch'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'It is also evident that scribes and copyists have left their traces upon the Pentateuch as we have it today'
  - where: setting
    claim: 'Moses 1 records visions that prepared Moses to write Genesis and is an introduction to Genesis'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Of exceptional worth is Moses 1, giving an account of some visions and experiences of Moses previous to and in preparation for writing Genesis. This chapter is an introduction to Genesis'
  - where: setting
    claim: 'Genesis is built on genealogies, each section beginning “These are the generations”'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'The structure of the book of Genesis rests on several genealogies. Each new section begins “These are the generations,”'
  - where: setting
    claim: 'Genesis 1–3: the creation and early history of the world, all mankind as yet one family'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Adam (Gen. 1–3). The creation and early history of the world; all mankind as yet one family.'
  - where: setting
    claim: 'The first Creation account is Genesis 1:1–2:3; the second begins at 2:4'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'The first Creation account runs from Genesis 1:1 through 2:3. The second begins at 2:4.'
  - where: setting
    claim: 'The book of Moses is a portion of the JST and the best available account of the early chapters'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'The Joseph Smith Translation especially, a portion of which is presented in the book of Moses, offers the best available account of the early chapters.'
  - where: setting
    claim: 'Abraham 4 is the Gods’ plan of the Creation (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'The Gods plan the creation of the earth and all life thereon'

  # ---------- thread ----------
  - where: thread
    claim: 'Tohu (Gen. 1:2) is the formlessness of the primeval earth; Isaiah 45:18 uses it of the Creation'
    key: bdb
    url: 'https://biblehub.com/hebrew/8414.htm'
    quote: 'formlessness, of primaeval earth Genesis 1:2 (P), of land reduced to primaeval chaos Jeremiah 4:23'
  - where: 'note 1:4 “Creation by dividing”'
    claim: 'The verb badal, divide, occurs in Gen. 1:4, 6, 7, 14, 18 (WLC: lemma 914 in those verses only, in chapter 1)'
    key: bdb
    url: 'https://biblehub.com/hebrew/914.htm'
    quote: 'divide, separate, subject God Genesis 1:4 followed by וּבֵין....בֵּין between light and darkness, compare Genesis 1:7; subject heavenly bodies Genesis 1:14; Genesis 1:18; subject firmament'
  - where: thread
    claim: 'Creation in two stages: first the physical environment ordered, then life'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'the formation and ordering of the basic physical environment of land, sea, and sky, is completed'
  - where: thread
    claim: 'Humans are the main purpose of the Creation in this narrative'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'Humans will thus constitute the main purpose behind God’s creations.'
  - where: thread
    claim: 'The creation of humanity is the culmination of the Creation account'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'The culmination of Creation in both Genesis 1 and 2 is the creation of humanity.'

  # ---------- 1:1 In the beginning ----------
  - where: 'note 1:1 “The beginning of this earth”'
    claim: 'Bereshit is preposition + noun with no article (interlinear parsing)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/1-1.htm'
    quote: 'In the beginning Prep‑b ¦ N‑fs'
  - where: 'note 1:1 “The beginning of this earth”'
    claim: 'BDB reads Gen. 1:1 as a time clause, “in the beginning when God created”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7225.htm'
    quote: 'Genesis 1:1 in the beginning when god created … absolute in the beginning God created'
  - where: 'note 1:1 “The beginning of this earth”'
    claim: 'Bereshit lacks the article: “in a beginning”'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'In fact, the Hebrew here, bereshit, lacks the definite article and would be better translated as “in a beginning.”'
  - where: 'note 1:1 “The beginning of this earth”'
    claim: 'The NJPS renders Gen. 1:1–2a as a time clause'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: '“When God began to create heaven and earth—the earth being unformed and void” (Gen. 1:1–2a).'
  - where: 'note 1:1 “The beginning of this earth”'
    claim: 'The idea that nothing existed before is not the Latter-day Saint position nor that of Genesis'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: '“In the beginning” reflects a notion that this was where everything started, and there was nothing before. This is not the Latter-day Saint position, and it is not really the position of the book of Genesis.'
  - where: 'note 1:1 “The beginning of this earth”'
    claim: 'Genesis 1 presumes something already there when God begins to create'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'the original Genesis 1 presumes that there is already something there when God begins his creative activity'

  # ---------- 1:1 God ----------
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'Elohim is plural in form; the verb bara is singular (Qal perfect 3ms)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/1-1.htm'
    quote: 'created V‑Qal‑Perf‑3ms … God N‑mp'
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'Elohim is the name-title Latter-day Saints use for the Father'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'God the Eternal Father, whom we designate by the exalted name-title “Elohim,”'
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'When one speaks of God it is generally the Father'
    key: bd-god
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/god?lang=eng'
    quote: 'When one speaks of God, it is generally the Father who is referred to; that is, Elohim.'
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'Gen. 1:1 says God created, but it was the Lord Jesus who was the creator'
    key: bd-god
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/god?lang=eng'
    quote: 'Thus the scripture says that “God created the heaven and the earth” (Gen. 1:1), but we know that it was actually the Lord (Jesus) who was the creator'
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'Jesus Christ created the earth under the direction of the Father'
    key: living-christ
    url: 'https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng'
    quote: 'He was the Great Jehovah of the Old Testament, the Messiah of the New. Under the direction of His Father, He was the creator of the earth.'
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'Jesus Christ (Jehovah) was the executive of the Father in the creation'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'That Jesus Christ, whom we also know as Jehovah, was the executive of the Father, Elohim, in the work of creation'
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'The KJV prints the name Jehovah as LORD in small capitals'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 1:1 “Elohim, and who created”'
    claim: 'Gen. 2:4 is the first verse with “the Lord God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'These are the generations of the heavens and of the earth when they were created, in the day that the Lord God made the earth and the heavens,'

  # ---------- 1:2 without form, and void ----------
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'Tohu means formlessness; used of the primeval earth and of land reduced to chaos in Jer. 4:23; Isa. 45:18'
    key: bdb
    url: 'https://biblehub.com/hebrew/8414.htm'
    quote: 'formlessness, confusion, unreality, emptiness'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'Bohu means emptiness, always with tohu; Gen. 1:2, Jer. 4:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/922.htm'
    quote: 'emptiness'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'Tohu wabohu refers to material present but unorganized, not nothing'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'tohû wābohû does not mean “nothing” or indicate an absence, but instead refers to a state in which material was present, but in an unorganized, unformed, state.'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'The deep (tehom) is the primeval ocean in Hebrew cosmogony'
    key: bdb
    url: 'https://biblehub.com/hebrew/8415.htm'
    quote: 'primaeval ocean, deep, in Hebrew cosmogony'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'The deep reflects the common ancient Near Eastern association of the sea with unorganized material'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'reflecting the common ancient Near Eastern association of the sea or ocean with the unorganized material of this precreative state'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'Bara: shape, fashion, create, always of divine activity'
    key: bdb
    url: 'https://biblehub.com/hebrew/1254.htm'
    quote: 'shape, fashion, create, always of divine activity'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'Bara means something like organize, not creation out of nothing'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'The word “create” is translated from the Hebrew bara, a word that means something like “organize” rather than active creation out of nothing.'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'Joseph Smith (1844): create comes from baurau, which means to organize; God organized the world out of chaotic matter'
    key: jsp-discourse-1844-04-07
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-7-april-1844-as-published-in-times-and-seasons/4'
    quote: 'The word create came from the word baurau; it does not mean so; it means to organize; the same as a man would organize a ship. Hence we infer that God had materials to organize the world out of chaos'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'First Presidency and Twelve (1916): the Creator is an Organizer and did not bring the elements into primal existence'
    key: father-and-son-1916
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-father-and-the-son?lang=eng'
    quote: 'In the sense so expressed, the Creator is an Organizer. God created the earth as an organized sphere; but He certainly did not create, in the sense of bringing into primal existence, the ultimate elements'
  - where: 'note 1:2 “Organized, not made from nothing”'
    claim: 'Abraham reads “empty and desolate” for “without form, and void”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'And the earth, after it was formed, was empty and desolate, because they had not formed anything but the earth'

  # ---------- 1:2 Spirit ----------
  - where: 'note 1:2 “The Spirit brooding over the waters”'
    claim: 'Ruach means breath, wind, spirit'
    key: bdb
    url: 'https://biblehub.com/hebrew/7307.htm'
    quote: 'breath, wind, spirit'
  - where: 'note 1:2 “The Spirit brooding over the waters”'
    claim: 'The NJPS renders “a wind from God”; spirit and wind are the same Hebrew word and hard to separate'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'In Hebrew, the word for “spirit” and the word for “wind” are the same. This makes it very difficult (if not impossible) to differentiate between the theological and the natural meaning of this word.'
  - where: 'note 1:2 “The Spirit brooding over the waters”'
    claim: 'NJPS wording of Gen. 1:2b'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'Genesis 1:2 (NJPS) goes on, “With darkness over the surface of the deep, and a wind from God sweeping over the water.”'
  - where: 'note 1:2 “The Spirit brooding over the waters”'
    claim: 'Rachaph: hover, perhaps brood; used of the eagle hovering over its young in Deut. 32:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/7363.htm'
    quote: 'Deuteronomy 32:11 (poem) of vulture hovering over young'
  - where: 'note 1:2 “The Spirit brooding over the waters”'
    claim: 'BDB on Gen. 1:2: hovering, or perhaps brooding'
    key: bdb
    url: 'https://biblehub.com/hebrew/7363.htm'
    quote: 'hovering over face of waters, or perhaps (see Syriac) brooding'
  - where: 'note 1:2 “The Spirit brooding over the waters”'
    claim: 'The scene opens with a sense of potential, strengthened by the Spirit’s preparatory action'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'Thus, the Creation event opens with a sense of potential or expectation, a sense strengthened by what appears to be divine preparatory action'

  # ---------- 1:3 And God said ----------
  - where: 'note 1:3 “Creation by the word”'
    claim: 'The Lord told Moses He created by the word of His power, the Only Begotten Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And by the word of my power, have I created them, which is mine Only Begotten Son, who is full of grace and truth.'

  # ---------- 1:3 Light ----------
  - where: 'note 1:3 “Light before the sun”'
    claim: 'John Taylor: God caused light before the sun appeared, for God is light'
    key: pgp-manual-moses-2
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-2-1-31?lang=eng'
    quote: 'caused light to shine upon … before the sun appeared in the firmament … for God is light, and in him there is no darkness. He is the light of the sun and the power thereof by which it was made'
  - where: 'note 1:3 “Light before the sun”'
    claim: 'Light indicates the presence of Deity; the first light may create an environment where the divine is present'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'Throughout the ancient Near East and the Bible, the presence of light indicates the presence of Deity.'
  - where: 'note 1:3 “Light before the sun”'
    claim: 'The creation of light may indicate an environment in which the divine is always present'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'the creation of light can indicate direct, divine activity or the creation of an environment in which the divine may be directly and always present'

  # ---------- 1:4 divided ----------
  - where: 'note 1:4 “Creation by dividing”'
    claim: 'Hibdil, to separate, is the theological underpinning of Genesis 1'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'Creation in Genesis 1 is fundamentally a process of dividing in order to put things into their proper places.'
  - where: 'note 1:4 “Creation by dividing”'
    claim: '“After their kind” continues the division even where the verb is absent'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'Even when the specific sense of hibdil is not used, division is a major feature of creation in Genesis 1'
  - where: 'note 1:4 “Creation by dividing”'
    claim: 'Lev. 10:10 “put difference” is hibdil; priests making distinctions engage in divine behavior'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'The verb that the KJV translates here as “put difference” is hibdil, the same verb that appears in the Creation account in Genesis 1.'
  - where: 'note 1:4 “Creation by dividing”'
    claim: 'Priests making distinctions are engaged in divine behavior'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'Leviticus shows that when priests are making these kinds of distinctions, they are engaged in divine behavior.'
  - where: 'note 1:4 “Creation by dividing”'
    claim: 'Badal is used of the Lord setting Israel apart from other peoples, Lev. 20:24, 26'
    key: bdb
    url: 'https://biblehub.com/hebrew/914.htm'
    quote: 'setting off Israel from other peoples Leviticus 20:24 (H) Numbers 16:9 (P); Leviticus 20:26'

  # ---------- 1:5 day ----------
  - where: 'note 1:5 “How long is a day?”'
    claim: 'BDB: yom in Gen. 1 is a day as defined by evening and morning'
    key: bdb
    url: 'https://biblehub.com/hebrew/3117.htm'
    quote: 'day as defined by evening and morning Genesis 1:5,8,13,19,23,31'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'BDB: in Gen. 2:4 “in the day” means the time of, the act represented vividly as a single day'
    key: bdb
    url: 'https://biblehub.com/hebrew/3117.htm'
    quote: '= the time of (forcible and pregnantly, representing the act vividly as that of a single day): (1) before infinitive'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'BDB lists Gen. 2:4 under beyom before an infinitive'
    key: bdb
    url: 'https://biblehub.com/hebrew/3117.htm'
    quote: 'בְּיוֺם Genesis 2:4,17'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'Nelson: creation periods called days in Genesis and Moses, times in Abraham'
    key: nelson-creation-2000
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2000/04/the-creation?lang=eng'
    quote: 'In Genesis and Moses, those periods are called days. But in the book of Abraham, each period is referred to as a time.'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'Nelson: each phase a period between two identifiable events'
    key: nelson-creation-2000
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2000/04/the-creation?lang=eng'
    quote: 'Whether termed a day, a time, or an age, each phase was a period between two identifiable events—a division of eternity.'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'We do not know how long the Creation took'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'Using our measurement of time, we do not know how long it took God to create the earth.'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'The Church has no official position on evolution (2025)'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'The scriptures teach that Adam was the first man. Some have wondered how to reconcile this truth with the theory of organic evolution. The Church has no official position on the theory of evolution.'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'Organic evolution is a matter for scientific study; nothing has been revealed on it'
    key: new-era-evolution-2016
    url: 'https://www.churchofjesuschrist.org/study/new-era/2016/10/to-the-point/what-does-the-church-believe-about-evolution?lang=eng'
    quote: 'Organic evolution, or changes to species’ inherited traits over time, is a matter for scientific study. Nothing has been revealed concerning evolution.'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'What is taught: all are descendants of Adam and Eve; no spirit children of the Father on earth before them'
    key: new-era-evolution-2016
    url: 'https://www.churchofjesuschrist.org/study/new-era/2016/10/to-the-point/what-does-the-church-believe-about-evolution?lang=eng'
    quote: 'We are all descendants of Adam and Eve, our first parents, who were created in God’s image. There were no spirit children of Heavenly Father on the earth before Adam and Eve were created.'
  - where: 'note 1:5 “How long is a day?”'
    claim: 'Scripture Helps (2025) repeats the same teaching'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'We are all descendants of Adam and Eve, our first parents, who were created in God’s image. There were no spirit children of Heavenly Father on the earth before Adam and Eve were created.'

  # ---------- 1:6 firmament ----------
  - where: 'note 1:6 “The firmament”'
    claim: 'Raqia: extended surface, (solid) expanse, as if beaten out; regarded by Hebrews as solid, supporting waters'
    key: bdb
    url: 'https://biblehub.com/hebrew/7549.htm'
    quote: 'extended surface, (solid) expanse (as if beaten out; compare Job 37:18)'
  - where: 'note 1:6 “The firmament”'
    claim: 'Septuagint stereoma, Vulgate firmamentum'
    key: bdb
    url: 'https://biblehub.com/hebrew/7549.htm'
    quote: 'στερέωμα, ᵑ9 firmamentum'
  - where: 'note 1:6 “The firmament”'
    claim: 'BDB: the vault of heaven regarded by Hebrews as solid, supporting waters above it'
    key: bdb
