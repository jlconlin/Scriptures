  # ---------- note 38:24 “By what right did Judah sentence her?” ----------
  - where: 'note 38:24 “By what right did Judah sentence her?”'
    claim: 'Tamar was still responsible to Judah as head of her husband’s family, and he sentenced her as head of Er’s clan'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'Even though she lived with her own father, by law Tamar was still responsible to Judah, the head of her husband’s family.'
  - where: 'note 38:24 “By what right did Judah sentence her?”'
    claim: 'Judah sentenced Tamar as head of Er’s clan and protector of the family’s honor'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'As head of Er’s clan and protector of the family’s honor, Judah therefore sentenced Tamar to be burned.'
  - where: 'note 38:24 “By what right did Judah sentence her?”'
    claim: 'The later law specifies stoning except for a priest’s daughter (Lev. 21:9; Deut. 22:21); whether burning was unusual in Judah’s day is speculation'
    key: spackman-judah-tamar
    url: 'https://rsc.byu.edu/vol-11-no-1-2010/story-judah-tamar'
    quote: 'Scholars speculate on whether being burned was out of the ordinary at this time. The Torah later specifies stoning, unless the woman is a daughter of a priest'
  - where: 'note 38:24 “By what right did Judah sentence her?”'
    claim: 'Judah applies a double standard: he visited a zonah but condemns her for acting as one'
    key: spackman-judah-tamar
    url: 'https://rsc.byu.edu/vol-11-no-1-2010/story-judah-tamar'
    quote: 'Judah clearly applies a double standard by having visited a zonah (harlot) but condemning his daughter-in-law for having acted as one.'

