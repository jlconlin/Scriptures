  # ---------- note 38:29 “Tamar and Perez in the line of Christ” ----------
  - where: 'note 38:29 “Tamar and Perez in the line of Christ”'
    claim: 'The Church: through Pharez, Tamar becomes an ancestor of Jesus Christ'
    key: scripture-helps-gen-37-41
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng'
    quote: 'Through her son Pharez, Tamar would become an ancestor of Jesus Christ.'
  - where: 'note 38:29 “Tamar and Perez in the line of Christ”'
    claim: 'Tamar is one of four women named in Matthew’s genealogy; a plausible reason is that each had an irregular marital history and showed initiative in carrying out God’s plan, making them types of Mary'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'Tamar is one of only four women named in the genealogy that introduces the reader to Mary, the mother of Jesus. The other three are Rahab, Ruth, and Bathsheba.'
  - where: 'note 38:29 “Tamar and Perez in the line of Christ”'
    claim: 'A plausible reason for the four women: irregular marital history and initiative in God’s plan, making them types of Mary'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'A plausible explanation for this unusual inclusion is that each of these four women combine two elements that make them types of Mary, the mother of Jesus: (1) they experienced an irregular marital history that could be misjudged as scandalous by outsiders and (2) each woman showed initiative in carrying out God’s plan'
  - where: 'setting'
    claim: 'Later scripture remembers Tamar through Pharez: the people of Bethlehem blessed Ruth with the house of Pharez'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'Centuries after she joined with Jacob’s clan, Tamar’s descendants noted her lasting contribution to set aright Judah and his family.'

