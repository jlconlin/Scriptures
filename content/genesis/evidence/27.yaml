chapter: 27
claims:

  - where: 'when'
    claim: 'Counting from Esau’s marriage at forty gives Isaac about a hundred at this time'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'Genesis 26:34 informs us that Esau is forty when he marries a Hittite wife. This would make Isaac one hundred years old when he is depicted as old and concerned about dying in the first few verses of Genesis 27.'

  - where: 'setting'
    claim: 'Esau’s Hittite wives were a grief of mind to Isaac and Rebekah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: 'Which were a grief of mind unto Isaac and to Rebekah.'

  - where: 'setting'
    claim: 'Isaac loved Esau because he ate of his venison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And Isaac loved Esau, because he did eat of his venison: but Rebekah loved Jacob.'

  - where: 'setting'
    claim: 'The Lord told Rebekah the elder shall serve the younger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'and the elder shall serve the younger.'

  - where: 'setting'
    claim: 'Esau distinguishes birthright and blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'he took away my birthright; and, behold, now he hath taken away my blessing.'

  - where: 'setting'
    claim: 'Hebrews 11:20 and 12:17 look back on the scene'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith Isaac blessed Jacob and Esau concerning things to come.'

  - where: 'setting'
    claim: 'Hebrews 12:17: when he would have inherited the blessing he was rejected'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'when he would have inherited the blessing, he was rejected'

  - where: 'thread'
    claim: 'Isaac blesses Jacob knowingly in chapter 28 and gives him the blessing of Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/28?lang=eng'
    quote: 'And Isaac called Jacob, and blessed him, and charged him'

  - where: 'thread'
    claim: 'Church reading of verse 33: Isaac could have revoked but seemed to affirm'
    key: bd-jacob
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jacob?lang=eng'
    quote: 'Isaac could have revoked the blessing at that time, but he seemed to affirm that it had been rightly delivered.'

  - where: 'thread'
    claim: 'Esau’s complaint pairs bekhorah (birthright) and berakhah (blessing); same consonants'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/27-36.htm'
    quote: 'bə·ḵō·rā·ṯî בְּכֹרָתִ֣י my birthright'

  - where: 'thread'
    claim: 'Isaac gives Jacob the blessing of Abraham in chapter 28 (the Church reads the verse 33 confirmation this way)'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'Isaac thus confirmed that the blessing was given to the person the Lord intended.'

  - where: 'thread'
    claim: 'The Church’s current wording allows that Rebekah and Jacob may have gone about it imperfectly'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'It is possible that the actions of Rebekah and Jacob recorded in Genesis 27 were overzealous, imperfect attempts to help Jacob receive blessings the Lord had already promised to give him.'

  - where: 'thread'
    claim: 'The text does not say the plan was inspired'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'The text does not tell us that Rebekah was inspired in her actions'

  - where: 'thread'
    claim: 'Isaac trembled very exceedingly (verse 33), Esau’s bitter cry (34), Esau’s plan to kill Jacob (41), Rebekah’s fear of losing both sons (45)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'And Isaac trembled very exceedingly, and said, Who?'

  - where: 'thread'
    claim: 'Esau’s bitter cry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'he cried with a great and exceeding bitter cry'

  - where: 'thread'
    claim: 'Esau resolves to kill Jacob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'then will I slay my brother Jacob.'

  - where: 'thread'
    claim: 'Rebekah fears losing both in one day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'why should I be deprived also of you both in one day?'

  - where: 'note 27:1 “Isaac thought he was dying”'
    claim: 'Isaac’s own words: I know not the day of my death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'Behold now, I am old, I know not the day of my death:'

  - where: 'note 27:1 “Isaac thought he was dying”'
    claim: 'Isaac was sixty when the twins were born'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'and Isaac was threescore years old when she bare them.'

  - where: 'note 27:1 “Isaac thought he was dying”'
    claim: 'Esau was forty when he married the Hittite wives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: 'And Esau was forty years old when he took to wife Judith the daughter of Beeri the Hittite'

  - where: 'note 27:1 “Isaac thought he was dying”'
    claim: 'If sequential, Isaac was about a hundred; he lived another eighty years'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'This would make Isaac one hundred years old when he is depicted as old and concerned about dying in the first few verses of Genesis 27.'

  - where: 'note 27:1 “Isaac thought he was dying”'
    claim: 'Isaac lived another eighty years and died at 180'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'Isaac subsequently goes on to live another eighty years before he dies at the age of 180'

  - where: 'note 27:1 “Isaac thought he was dying”'
    claim: 'Isaac died at a hundred and eighty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'And the days of Isaac were an hundred and fourscore years.'

  - where: 'note 27:4 “A father’s blessing, not the birthright”'
    claim: 'The birthright was settled over the stew in chapter 25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And Jacob said, Sell me this day thy birthright.'

  - where: 'note 27:4 “A father’s blessing, not the birthright”'
    claim: 'Priesthood holders can bless posterity; Isaac’s blessings are recorded'
    key: oaks-priesthood-blessings-1987
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1987/04/priesthood-blessings?lang=eng'
    quote: 'Worthy Melchizedek Priesthood holders can give blessings to their posterity. The scriptures record many such blessings, including Adam’s (see D&C 107:53–57), Isaac’s (see Gen. 27:28–29, 39–40; 28:3–4; Heb. 11:20)'

  - where: 'note 27:4 “A father’s blessing, not the birthright”'
    claim: 'Esau lost leadership and covenant blessing (27:28–29, 36)'
    key: bd-esau
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esau?lang=eng'
    quote: 'by which he lost both the leadership of the tribe and also the covenant blessing (Gen. 27:28–29, 36; Heb. 12:16–17)'

  - where: 'note 27:4 “A father’s blessing, not the birthright”'
    claim: 'Isaac’s blessing of Jacob: rule over brothers and nations, blessing and cursing others'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'Let people serve thee, and nations bow down to thee: be lord over thy brethren'

  - where: 'note 27:4 “A father’s blessing, not the birthright”'
    claim: 'Esau still asks for a blessing after losing the birthright'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'Bless me, even me also, O my father.'

  - where: 'note 27:4 “A father’s blessing, not the birthright”'
    claim: 'Esau names birthright and blessing separately'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'he took away my birthright; and, behold, now he hath taken away my blessing.'

  - where: 'note 27:5 “What Rebekah and Isaac each knew”'
    claim: 'The Lord answered Rebekah when she inquired: the elder shall serve the younger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And she went to inquire of the Lord.'

  - where: 'note 27:5 “What Rebekah and Isaac each knew”'
    claim: 'The reader is not told whether Isaac knew'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'The reader is not told whether or not God revealed to Isaac what Rebekah knew about the boys or even whether Rebekah had relayed the answer to her prayer to him.'

  - where: 'note 27:5 “What Rebekah and Isaac each knew”'
    claim: 'One view: Isaac’s will pitted against God’s; deliberately prepared to overlook the oracle'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'He is quite deliberately prepared to overlook Esau’s misdemeanors and the God-given oracle.'

  - where: 'note 27:5 “What Rebekah and Isaac each knew”'
    claim: 'One view: Isaac’s will pitted against God’s'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'Isaac’s will is pitted against God’s and Rebekah’s.'

  - where: 'note 27:5 “What Rebekah and Isaac each knew”'
    claim: 'Another: no indication Isaac opposes God'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'the text gives no indication that Isaac is attempting to oppose God or intentionally disregard a divine injunction.'

  - where: 'note 27:5 “What Rebekah and Isaac each knew”'
    claim: 'Isaac loved Esau because he ate his venison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And Isaac loved Esau, because he did eat of his venison: but Rebekah loved Jacob.'

  - where: 'note 27:7 “Rebekah adds “before the LORD””'
    claim: 'Isaac said “that my soul may bless thee before I die”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'that my soul may bless thee before I die.'

  - where: 'note 27:7 “Rebekah adds “before the LORD””'
    claim: 'One reading: she shaped the report to persuade, playing down Isaac’s desire for Esau and stressing the importance of the blessing'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'Rebekah seems to be playing down the strength of Isaac’s desire to bless Esau, while by adding “in the Lord’s presence,” she is emphasizing the importance of what Isaac proposes to do.'

  - where: 'note 27:7 “Rebekah adds “before the LORD””'
    claim: 'Rebekah’s report omits the hunting'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'Rebekah omits all the remarks about hunting, which might have put Jacob off'

  - where: 'note 27:7 “Rebekah adds “before the LORD””'
    claim: 'Another reading (speculation): she misunderstood, possibly confusing the blessing with the birthright'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'Rebekah’s actions may have been motivated by good intentions but were based on a misunderstanding of what she thought Isaac meant'

  - where: 'note 27:7 “Rebekah adds “before the LORD””'
    claim: 'Possibly confusing this blessing with the birthright'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: '(possibly confusing this blessing with the birthright)'

  - where: 'note 27:7 “Rebekah adds “before the LORD””'
    claim: 'The author calls these speculations'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'my speculations about this incident continue to be speculations.'

