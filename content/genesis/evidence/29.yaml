    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/29.htm
    quote: A well was a cistern or tank, often covered with a large stone requiring two or three men to remove it. This stone protected the water from the rays of the sun and from mischief or pollution.
