    quote: 'וּמֵעִצְּב֣וֹן and from the toil'
  - where: 'note 3:16 “Sorrow, desire, and rule”'
    claim: 'The noun translated “sorrow” does not necessarily carry the emotional sense of the English'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
