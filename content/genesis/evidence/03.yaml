    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/25soares?lang=eng'
    quote: 'There is no superiority or inferiority in the marriage relationship, and neither walks ahead of or behind the other. They walk side by side, as equals, the divine offspring of God.'

  # ---------- note 3:17 ----------
  - where: 'note 3:17 “The ground is cursed, not Adam”'
    claim: 'The serpent is cursed, not Adam or Eve'
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'the serpent was cursed, not Adam or Eve'
  - where: 'note 3:17 “The ground is cursed, not Adam”'
    claim: 'Romney: the curse was on the ground for Adam’s sake, and was a blessing to him'
    key: romney-own-way-1976
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/in-mine-own-way?lang=eng'
    quote: 'Note that the curse was not placed upon Adam, but upon the ground for Adam’s sake. Rather than a curse upon Adam, it was a blessing to him.'
