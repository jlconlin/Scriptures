chapter: 3
claims:
  # ---------- setting ----------
  - where: setting
    claim: 'Genesis treats the Fall as an event without discussing its doctrine; the doctrine is taught most clearly in the Book of Mormon'
    key: ot-manual-gen-3
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-3-the-fall?lang=eng'
    quote: 'treats the Fall as an event but does not discuss the doctrine of the Fall'
  - where: setting
    claim: 'The doctrine of the Fall is taught most clearly in the Book of Mormon'
    key: ot-manual-gen-3
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-3-the-fall?lang=eng'
    quote: 'Actually, the doctrine of the Fall is taught most clearly in the Book of Mormon.'
  - where: setting
    claim: 'Moses 4 was revealed June–October 1830; its heading: how Satan became the devil, he tempts Eve, Adam and Eve fall'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: '(June–October 1830) How Satan became the devil—He tempts Eve—Adam and Eve fall, and death enters the world.'
  - where: setting
    claim: 'Moses 4:1–4 tells of Satan’s rebellion before the serpent appears in 4:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: 'And he became Satan, yea, even the devil, the father of all lies, to deceive and to blind men'
  - where: setting
    claim: 'The Fall narrative teaches through symbolism and other literary devices, without detracting from its historicity'
    key: sc-knowhy-831
    url: 'https://scripturecentral.org/knowhy/why-is-knowing-genre-important-for-understanding-the-old-testament'
    quote: 'Yet the Fall narrative also teaches many things to readers of the Bible using symbolism and other literary devices'
  - where: setting
    claim: 'Latter-day revelation shows the Fall was a historical event that literally occurred'
    key: bd-fall
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fall-of-adam-and-eve?lang=eng'
    quote: 'Latter-day revelation supports the biblical account of the Fall, showing that it was a historical event that literally occurred in the history of man.'
  - where: setting
    claim: 'An apostle testified to an actual Adam and Eve who fell from an actual Eden'
    key: holland-justice-2015
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/where-justice-love-and-mercy-meet?lang=eng'
    quote: 'there was an actual Adam and Eve who fell from an actual Eden, with all the consequences that fall carried with it.'

  # ---------- thread ----------
  - where: thread
    claim: 'The Church describes the Fall as having a twofold direction, downward yet forward'
    key: topics-fall
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng'
    quote: 'It has a twofold direction—downward yet forward. In addition to introducing physical and spiritual death, it gave us the opportunity to be born on the earth and to learn and progress.'
  - where: thread
    claim: 'The serpent is cursed, not Adam or Eve'
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'This was not shameful in any way, and the serpent was cursed, not Adam or Eve.'
  - where: thread
    claim: 'Hiding from the presence began the separation; cherubim keep the way of a potential return'
    key: bowen-cut-off
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/cut-off-face-presence'
    quote: 'with cherubim as sentinels keeping the “way” of their potential return.'
  - where: thread
    claim: 'Alma defines being cut off from the presence of the Lord as spiritual death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/42?lang=eng'
    quote: 'the fall had brought upon all mankind a spiritual death as well as a temporal, that is, they were cut off from the presence of the Lord'

  # ---------- sections ----------
  - where: section 2 plain
    claim: '“In the cool of the day” rendered “in the breeze of the day”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-8.htm'
    quote: 'לְר֣וּחַ in the breeze … הַיּ֑וֹם of the day'
  - where: section 3 plain
    claim: '“For thy sake” rendered “because of you” (ba‘avurekha, “on your account”)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-17.htm'
    quote: 'בַּֽעֲבוּרֶ֔ךָ on your account'

  # ---------- note 3:1 ----------
  - where: 'note 3:1 “Who is the serpent?”'
    claim: 'The serpent is ‘arum, crafty'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-1.htm'
    quote: 'עָר֔וּם cunning'
  - where: 'note 3:1 “Who is the serpent?”'
    claim: '‘arum means crafty, shrewd, sensible; in Proverbs, in a good sense, the prudent man'
    key: bdb
    url: 'https://biblehub.com/hebrew/6175.htm'
    quote: 'adjective crafty, shrewd, sensible ; — 1 crafty , ׳ ע as predicate, of serpent Genesis 3:1'
  - where: 'note 3:1 “Who is the serpent?”'
    claim: '‘arum in Proverbs is the prudent man'
    key: bdb
    url: 'https://biblehub.com/hebrew/6175.htm'
    quote: '= prudent man Proverbs 14:15'
  - where: 'note 3:1 “Who is the serpent?”'
    claim: 'Adam and Eve were ‘arummim, naked, in Gen. 2:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/6174.htm'
    quote: 'plural עֲרוּמִּים Genesis 2:25'
  - where: 'note 3:1 “Who is the serpent?”'
    claim: 'The pun between “naked” and “subtle,” and its irony'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'The narrative irony is that while Adam and Eve are physically naked and unaware, they will not remain in this state'
  - where: 'note 3:1 “Who is the serpent?”'
    claim: 'Satan, by contrast, will not progress and is unaware that he is naked before God'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'Satan, on the other hand, who knows not the mind of God, will never progress beyond his current state, unaware that he is, in fact, naked before God.'
  - where: 'note 3:1 “Who is the serpent?”'
    claim: 'Latter-day Saints understand the serpent as Satan on the basis of latter-day scripture as well as Christian interpretation'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'Like other Christians, Latter-day Saints also understand the figure to be Satan, but this understanding emerges from more than common Christian interpretation; it includes material concerning the Creation and the Garden of Eden from latter-day scripture as well.'
  - where: 'note 3:1 “Who is the serpent?”'
    claim: 'Moses 4:6 suggests the beguiling will not have the devastating consequences Satan expects'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'it also suggests that the act will not, in fact, have the devastating consequences Satan believes will result'
  - where: 'note 3:1 “Who is the serpent?”'
    claim: 'Moses 4:6–7: Satan put it into the heart of the serpent and spoke by its mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: 'And Satan put it into the heart of the serpent'

  # ---------- note 3:3 ----------
  - where: 'note 3:3 “The command, and the choice”'
    claim: 'One Latter-day Saint reading takes “neither shall ye touch it” as Eve’s own rejection of the serpent, not spoken by God in the text'
    key: schade-bowen-fall
    url: 'https://rsc.byu.edu/book-moses/moses-4-fall-doctrinal-perspectives-insights'
    quote: 'then adding her own rejection of his advances, something not spoken of by God in the text (“neither shall ye touch it, lest ye die,” Genesis 3:3)'
  - where: 'note 3:3 “The command, and the choice”'
    claim: 'Adam and Eve could not keep the first commandment without transgressing the barrier of Eden'
    key: oaks-plan-1993
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1993/10/the-great-plan-of-happiness?lang=eng'
    quote: 'They could not fulfill the Father’s first commandment without transgressing the barrier between the bliss of the Garden of Eden and the terrible trials and wonderful opportunities of mortal life.'
  - where: 'note 3:3 “The command, and the choice”'
    claim: 'For unrevealed reasons the Fall could not happen without a transgression'
    key: oaks-plan-1993
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1993/10/the-great-plan-of-happiness?lang=eng'
    quote: 'For reasons that have not been revealed, this transition, or “fall,” could not happen without a transgression'
  - where: 'note 3:3 “The command, and the choice”'
    claim: 'The Church’s current teaching: the command to have children and the prohibition of the fruit seem to conflict'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'The account of Adam and Eve presents seemingly conflicting commandments from God.'

  # ---------- note 3:4 ----------
  - where: 'note 3:4 “Did they die?”'
    claim: 'God’s warning in Gen. 2:17 is mot tamut, “dying you shall die”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-17.htm'
    quote: 'מ֥וֹת dying … תָּמֽוּת׃ you shall die'
  - where: 'note 3:4 “Did they die?”'
    claim: 'The serpent answers lo mot temutun, the same words with “not” in front'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-4.htm'
    quote: 'לֹֽא־ Not … מ֖וֹת dying … תְּמֻתֽוּן׃ you⁺ will die'
  - where: 'note 3:4 “Did they die?”'
    claim: 'The adversary wove lies in with truth: eyes opened, knowing good and evil, but not die'
    key: schade-bowen-fall
    url: 'https://rsc.byu.edu/book-moses/moses-4-fall-doctrinal-perspectives-insights'
    quote: 'The adversary started simple and then began to weave lies in with truth. Their eyes would be opened, and they would know good from evil, but he also stated that they would not die'
  - where: 'note 3:4 “Did they die?”'
    claim: 'After eating they left the garden and the presence of the Lord (spiritual death), and their bodies became mortal (physical death)'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'they were forced to leave the garden and the presence of the Lord, causing them to suffer spiritual death. Additionally, when they fell, their bodies changed to a mortal state, and they ultimately experienced physical death.'
  - where: 'note 3:4 “Did they die?”'
    claim: 'Abraham 5:13: “in the time that thou eatest,” after the Lord’s time'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'for in the time that thou eatest thereof, thou shalt surely die. Now I, Abraham, saw that it was after the Lord’s time'
  - where: 'note 3:4 “Did they die?”'
    claim: 'Moses 4:25 adds “for thou shalt surely die” in the sentence on Adam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: 'until thou shalt return unto the ground—for thou shalt surely die—for out of it wast thou taken'

  # ---------- note 3:5 ----------
  - where: 'note 3:5 “Knowing good and evil”'
    claim: 'Adam, taught the plan, says his eyes are opened because of his transgression'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'Blessed be the name of God, for because of my transgression my eyes are opened, and in this life I shall have joy'

  # ---------- note 3:6 ----------
  - where: 'note 3:6 “Eve’s choice”'
    claim: 'Latter-day Saints, informed by revelation, celebrate Eve’s act and honor her wisdom and courage'
    key: oaks-plan-1993
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1993/10/the-great-plan-of-happiness?lang=eng'
    quote: 'Some Christians condemn Eve for her act, concluding that she and her daughters are somehow flawed by it. Not the Latter-day Saints! Informed by revelation, we celebrate Eve’s act and honor her wisdom and courage in the great episode called the Fall'
  - where: 'note 3:6 “Eve’s choice”'
    claim: '“To make one wise” is lehaskil, Hiphil infinitive of sakal'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-6.htm'
    quote: 'לְהַשְׂכִּ֔יל to make one wise Prep‑l ¦ V‑Hifil‑Inf'
  - where: 'note 3:6 “Eve’s choice”'
    claim: 'sakal: be prudent, circumspect'
    key: bdb
    url: 'https://biblehub.com/hebrew/7919.htm'
    quote: 'verb be prudent'
  - where: 'note 3:6 “Eve’s choice”'
    claim: 'Adam showed his wisdom by doing the same'
    key: oaks-plan-1993
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1993/10/the-great-plan-of-happiness?lang=eng'
    quote: 'Adam showed his wisdom by doing the same.'
  - where: 'note 3:6 “Eve’s choice”'
    claim: 'The act was a transgression, not a sin: wrong because formally prohibited, not inherently wrong'
    key: oaks-plan-1993
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1993/10/the-great-plan-of-happiness?lang=eng'
    quote: 'the act that produced the Fall was not a sin—inherently wrong—but a transgression—wrong because it was formally prohibited.'

  - where: 'note 3:6 “Eve’s choice”'
    claim: 'The second article of faith: punished for own sins, not Adam’s transgression'
    key: oaks-plan-1993
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1993/10/the-great-plan-of-happiness?lang=eng'
    quote: 'the careful wording in the second article of faith: “We believe that men will be punished for their own sins, and not for Adam’s transgression”'

  # ---------- note 3:8 ----------
  - where: 'note 3:8 “Hiding from the presence”'
    claim: '“In the cool of the day” is literally “in the breeze (ruach) of the day”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-8.htm'
    quote: 'לְר֣וּחַ in the breeze … הַיּ֑וֹם of the day'
  - where: 'note 3:8 “Hiding from the presence”'
    claim: 'The wind of the day: the time when a cool wind springs up'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/3.htm'
    quote: 'Lit. “in the wind of the day”; that is, at the time of day when, in the East, a cool wind springs up, and people leave their houses.'
  - where: 'note 3:8 “Hiding from the presence”'
    claim: '“From the presence of” is mippene, “from the face of”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-8.htm'
    quote: 'מִפְּנֵי֙ from the face Prep‑m ¦ N‑cpc'
  - where: 'note 3:8 “Hiding from the presence”'
    claim: 'Panim is translated concretely as face or abstractly as presence'
    key: bowen-cut-off
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/cut-off-face-presence'
    quote: 'The Hebrew plural noun pānîm is often translated concretely as “face” or sometimes less concretely with the abstract noun “presence.”'
  - where: 'note 3:8 “Hiding from the presence”'
    claim: 'Hiding from the Lord’s presence began their being driven out and cut off from his presence'
    key: bowen-cut-off
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/cut-off-face-presence'
    quote: 'Adam and Eve “hid themselves from the Lord’s presence” on account of their disobedience, initiating their being “driven out”'
  - where: 'note 3:8 “Hiding from the presence”'
    claim: 'Jacob and Alma: the Fall cut mankind off from the presence of the Lord (spiritual death)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'because man became fallen they were cut off from the presence of the Lord'

  # ---------- note 3:9 ----------
  - where: 'note 3:9 “Why God asks”'
    claim: 'God knows all things; He asks for the sake of personal accountability (McConkie, as printed in the manual)'
    key: pgp-manual-moses-4
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-4-1-19?lang=eng'
    quote: 'personal accountability for all of one’s acts underlies the whole gospel plan and is the natural outgrowth of the law of free agency'
  - where: 'note 3:9 “Why God asks”'
    claim: 'God asks because of personal accountability (the manual’s answer to why an all-knowing God asks)'
    key: pgp-manual-moses-4
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-4-1-19?lang=eng'
    quote: 'Why then did God ask Adam and Eve the questions in Moses 4:15–19 ? Because, as Elder Bruce R. McConkie'
  - where: 'note 3:9 “Why God asks”'
    claim: 'Gen. 3:9 is one word, ’ayyekkah, “Where [are] you”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-9.htm'
    quote: 'אַיֶּֽכָּה׃ Where … you Interrog ¦ 2ms'
  - where: 'note 3:9 “Why God asks”'
    claim: '’ay is the interrogative “where?”; with the suffix in Gen. 3:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/335.htm'
    quote: 'interrogative adverb where? a. so with suffix'
  - where: 'note 3:9 “Why God asks”'
    claim: 'Moses 4:15 reads “Where goest thou?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: 'And I, the Lord God, called unto Adam, and said unto him: Where goest thou?'
  - where: 'note 3:9 “Why God asks”'
    claim: 'The Hebrew has no verb of motion for the “going” of Moses 4:15, so the precise sense is unclear'
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'Because there is no verb of motion in the Hebrew text for “going” in this line, the precise interpretation is unclear'
  - where: 'note 3:9 “Why God asks”'
    claim: 'One reading: “Come back to me” seems to be God’s message'
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: '“Come back to me” seems to be God’s message; a meaning of the word repent is literally “to return,”'

  # ---------- note 3:13 ----------
  - where: 'note 3:13 “Blame, or an honest answer?”'
    claim: 'The exchange is sometimes portrayed as a blame game'
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'sometimes portrayed as a kind of blame game in which Adam and Eve seek to duck responsibility'
  - where: 'note 3:13 “Blame, or an honest answer?”'
    claim: 'The honest-answer reading is offered as another way to view the responses'
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'Another way to view their responses is to concede the possibility that they were offering their honest reflections about what had happened.'
  - where: 'note 3:13 “Blame, or an honest answer?”'
    claim: 'Latter-day Saint reading: the answers are honest reflections, less about deflecting blame than explaining their decisions'
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'In this view Adam and Eve’s responses were less about casting or deflecting blame than about explaining why they had made their respective decisions.'
  - where: 'note 3:13 “Blame, or an honest answer?”'
    claim: 'Both take responsibility; the decision made was theirs alone'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'In both instances, the two individuals take responsibility for their own agency, noting that whatever the circumstances were at the moment of decision, the decision made was theirs alone.'
  - where: 'note 3:13 “Blame, or an honest answer?”'
    claim: '“Beguiled” (nasha, Hiphil) means beguile, deceive; used of kings misleading their people'
    key: bdb
    url: 'https://biblehub.com/hebrew/5377.htm'
    quote: 'beguile , usually with accusative of person Genesis 3:13'
  - where: 'note 3:13 “Blame, or an honest answer?”'
    claim: 'Eve’s “beguiled” shows her innocent intentions, having trusted one who deliberately misled her'
    key: schade-bowen-fruit
    url: 'https://rsc.byu.edu/book-moses/moses-4-partaking-fruit-knowledge-accountability-redemption'
    quote: 'When she said she was “beguiled,” this evidenced the innocent, good intentions behind her decision, she having trusted one who had flagrantly and deliberately attempted to mislead her.'

  - where: 'note 3:13 “Blame, or an honest answer?”'
    claim: 'God addresses the serpent with a sentence, not a question (Gen. 3:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/3?lang=eng'
    quote: 'And the Lord God said unto the serpent, Because thou hast done this, thou art cursed above all cattle'

  # ---------- note 3:15 ----------
  - where: 'note 3:15 “The seed of the woman”'
    claim: 'The pronoun in the Hebrew is hu, “he”; the same verb shuph is used for both blows'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-15.htm'
    quote: 'ה֚וּא he … יְשׁוּפְךָ֣ shall bruise you'
  - where: 'note 3:15 “The seed of the woman”'
    claim: 'Hu is “he” but is also used for the neuter “it” (hence the KJV “it”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1931.htm'
    quote: 'pronoun of the 3rd person singular , he, she, used also (in both Genders) for the neuter it'
  - where: 'note 3:15 “The seed of the woman”'
    claim: 'Rom. 16:20 (“the God of peace shall bruise Satan”) is read of Jesus Christ with Gen. 3:15 (Joseph Fielding Smith, as printed in the manual)'
    key: ot-manual-gen-3
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-3-the-fall?lang=eng'
    quote: 'The ‘God of peace,’ who according to the scriptures is to bruise Satan, is Jesus Christ.'
  - where: 'note 3:15 “The seed of the woman”'
    claim: 'BDB lists shuph, bruise, in both clauses of Gen. 3:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/7779.htm'
    quote: 'verb bruise'
  - where: 'note 3:15 “The seed of the woman”'
    claim: 'Moses 4:21 reads “he shall bruise thy head”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/4?lang=eng'
    quote: 'and he shall bruise thy head, and thou shalt bruise his heel'
  - where: 'note 3:15 “The seed of the woman”'
    claim: 'The Septuagint: “he shall watch against thy head”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/3.htm'
    quote: 'he shall watch against thy head, and thou shalt watch against his heel'
  - where: 'note 3:15 “The seed of the woman”'
    claim: 'Talmage: the promise was made to the woman, not the man or the pair; fulfilled in the birth of Jesus of a mortal mother and immortal Father'
    key: talmage-jesus-christ
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-5?lang=eng'
    quote: 'was to be realized through the offspring of woman; the promise was not made specifically to the man, nor to the pair. The only instance of offspring from woman dissociated from mortal fatherhood is the birth of Jesus the Christ'
  - where: 'note 3:15 “The seed of the woman”'
    claim: 'Church’s current teaching: the seed is Jesus Christ; He bruises Satan’s head while Satan bruises only His heel'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'God declared that Jesus Christ would bruise Satan’s head, while Satan would only be able to bruise the Savior’s heel.'

  # ---------- note 3:16 ----------
