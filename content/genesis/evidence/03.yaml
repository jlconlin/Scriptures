    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/03/the-blessings-and-responsibilities-of-womanhood?lang=eng'
    quote: 'I wonder if those who translated the Bible might have used the term distress instead of sorrow.'
  - where: 'note 3:16 “Sorrow, desire, and rule”'
    claim: 'teshuqah: longing; used also in Gen. 4:7 and Song 7:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/8669.htm'
    quote: 'noun feminine longing ; — of woman for man'
  - where: 'note 3:16 “Sorrow, desire, and rule”'
    claim: 'The husband’s rule described the most common marriage arrangement in ancient Israel'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'this describes the most common power dynamic in marriage arrangements of ancient Israel'
  - where: 'note 3:16 “Sorrow, desire, and rule”'
    claim: 'Kimball: “rule” gives the wrong impression; he preferred “preside”'
    key: kimball-womanhood-1976
    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/03/the-blessings-and-responsibilities-of-womanhood?lang=eng'
    quote: 'I have a question about the word rule. It gives the wrong impression. I would prefer to use the word preside because that’s what he does.'
  - where: 'note 3:16 “Sorrow, desire, and rule”'
    claim: 'Soares: no superiority or inferiority in marriage; they walk side by side as equals'
