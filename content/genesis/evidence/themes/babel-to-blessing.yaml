page: babel-to-blessing
claims:
  - where: 'section “The families divided”'
    claim: 'Gen. 10:5, 32 text; mishpachah (H4940) occurs in 12 verses of Genesis, five of them in chapter 10 (10:5, 18, 20, 31, 32)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'לְ/מִשְׁפְּחֹתָ֖/ם'
  - where: 'section “A name, and a scattering”'
    claim: 'The verb puts (H6327) occurs five times in Genesis: 10:18, 11:4, 8, 9 and 49:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'נָפ֖וּץ'
  - where: 'section “From Shem to Abram”'
    claim: 'Shem means “name” or “reputation”'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'Shem means “name” or “reputation.”'
  - where: 'section “From Shem to Abram”'
    claim: 'The tower was the transitional event between the dispensations of Noah and Abraham; the covenant with Abraham followed the scattering'
    key: donaldson-babel-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/02/i-have-a-question/is-there-additional-background-information-on-the-tower-of-babel?lang=eng'
    quote: 'The tower of Babel was the transitional event between the dispensations of Noah and Abraham. It is instructive to note that immediately following mankind’s scattering, the Lord intervened by establishing his covenant with Abraham'
  - where: 'section “The call”'
    claim: 'Babel sought a name, Abraham’s is made great by God; Babel feared scattering, the covenant gathers and seals families; all families will be blessed'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'In contrast, the Abrahamic covenant includes the blessing of families being gathered together and sealed for eternity. Abraham was promised that through him and his seed, all families of the earth would be blessed.'
  - where: 'section “The call”'
    claim: '“Families” in 12:3 is the same Hebrew word (mishpachah) as 10:5, 20, 31, 32'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'מִשְׁפְּחֹ֥ת'
  - where: 'section “The call”'
    claim: '“Name” (shem, H8034) is one word at 11:4 and 12:2 (verbs asah and gadal); it occurs 113 times in 95 verses of Genesis'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'שְׁמֶ֑/ךָ'
  - where: 'section “The call”'
    claim: 'One reading: “all the families of the ground” points to the division of the one family into many (10:5, 20, 31); the blessing was to unite the divided families'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/12.htm'
    quote: 'The blessing of Abraham was once more to unite the divided families'
  - where: 'section “Spread abroad”'
    claim: 'Gen. 28:14 “spread abroad” is parats (H6555), not puts; “the families of the ground” (ha-adamah) is the phrase of 12:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וּ/פָרַצְתָּ֛'
  - where: 'section “The gospel preached before”'
    claim: 'Gal. 3:8 and 3:14: the scripture preached the gospel before to Abraham; the blessing comes to the Gentiles through Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'And the scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed.'
  - where: 'section “The gospel preached before”'
    claim: 'The risen Lord quotes the promise to the Nephites (3 Ne. 20:25–26)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'The Father having raised me up unto you first, and sent me to bless you in turning away every one of you from his iniquities'
  - where: 'section “The gospel preached before”'
    claim: 'D&C 110:11–12: keys of the gathering of Israel; the dispensation of the gospel of Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Elias appeared, and committed the dispensation of the gospel of Abraham, saying that in us and our seed all generations after us should be blessed.'
  - where: 'section “The gospel preached before”'
    claim: 'Connection made by this page: Rev. 7:9 (all nations, kindreds, people, tongues before the Lamb) set beside Gen. 10:5, 20, 31 (tongue, families, nations); a comparison of King James words only, Revelation being Greek and Genesis Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/7?lang=eng'
    quote: 'a great multitude, which no man could number, of all nations, and kindreds, and people, and tongues, stood before the throne, and before the Lamb'
