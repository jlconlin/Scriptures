page: brothers-reconciled
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Gen. 27:41; 37:20, 28; 33:4; 45:14–15 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/33?lang=eng'
    quote: 'And Esau ran to meet him, and embraced him, and fell on his neck, and kissed him: and they wept.'
  - where: 'opening'
    claim: 'Gen. 45:14–15 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'And he fell upon his brother Benjamin’s neck, and wept; and Benjamin wept upon his neck.'
  - where: 'opening'
    claim: '“fell on the neck” (ṣawwār, H6677) in Genesis only at 33:4, 45:14 (twice) and 46:29; the three embraces share nāpal ʿal-ṣawwār, nāšaq, bākâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'צַוָּארָ֖/ו'
  - where: 'opening'
    claim: 'ʾāšēm “guilty” (H818) once in Genesis, 42:21 ʾăšēmîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'אֲשֵׁמִ֣ים'
  - where: 'opening'
    claim: 'nāśāʾ (H5375) rendered “forgive” only at 50:17 (śāʾ nāʾ, twice); pešaʿ “trespass” (H6588) in Genesis only at 31:36 and 50:17 (twice)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'פֶּ֣שַׁע'
  - where: 'opening'
    claim: 'Gen. 31:36 “What is my trespass? what is my sin”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'What is my trespass? what is my sin, that thou hast so hotly pursued after me?'
  - where: 'opening'
    claim: 'Scripture Helps table “How was Joseph similar to Jesus Christ?”: Gen. 45:3–5, “They willingly forgave those who repented,” Mosiah 26:30'
    key: scripture-helps-gen-37-41
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng'
    quote: 'They willingly forgave those who repented.'
  - where: 'opening'
    claim: 'Connection made by this page: Genesis distinguishes the three brother stories by what is said of the wrong (denied, covered and unspoken, spoken three times), and gives its words for guilt, trespass and forgiveness only to the third; no commentary read sets the three apart in this way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'Forgive, I pray thee now, the trespass of thy brethren, and their sin'
  # ---------- section “Where is Abel thy brother?” ----------
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Skinner: the Lord’s question “intended to elicit a confession of guilt,” as Rashi judged'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'it seems the question was intended to elicit a confession of guilt. This also was the judgment of the great medieval Jewish biblical exegete Rashi.'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Gen. 4:9, 13, 15, 16 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/4?lang=eng'
    quote: 'And he said, I know not: Am I my brother’s keeper?'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Keil on 4:9: “Adam and Eve fear before God, and acknowledge their sin; Cain boldly denies it”'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/4.htm'
    quote: 'Adam and Eve fear before God, and acknowledge their sin; Cain boldly denies it'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Cambridge on 4:9: “a statement which is a falsehood” and “a question which is defiance”; “The first words of the first murderer renounce the obligations of brotherhood.”'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/4.htm'
    quote: 'The first words of the first murderer renounce the obligations of brotherhood.'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Student Manual 4-4: “the Moses account explains that the Lord warned Cain that if he did not repent, he would rule over Satan”'
    key: ot-manual-gen-4-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-4-11-the-patriarchs?lang=eng'
    quote: 'the Moses account explains that the Lord warned Cain that if he did not repent, he would rule over Satan'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Church footnote 4:13a “My”: “OR My iniquity is too great to be forgiven.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/4?lang=eng'
    quote: 'My iniquity is too great to be forgiven'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'ʿāwōn (H5771) at 4:13 and 44:16 (also 15:16; 19:15); 4:13 “bear” is nāśāʾ (H5375, minnĕśōʾ), the verb rendered “forgive” at 50:17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'מִ/נְּשֹֽׂא'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Cambridge on 4:13: “not that of repentance for his sin, but of entreaty for the mitigation of his doom”'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/4.htm'
    quote: 'is not that of repentance for his sin, but of entreaty for the mitigation of his doom'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Keil on 4:13: ʿāwōn nāśāʾ “signifies to take away and bear sin or guilt”; “God takes guilt away by forgiving it”; “man carries it away and bears it, by enduring its punishment”; the context sustains the second'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/4.htm'
    quote: 'God takes guilt away by forgiving it (Exodus 34:7); man carries it away and bears it, by enduring its punishment'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Connection made by this page: the root nāśāʾ runs through the three stories, 4:7 śĕʾēt “accepted” (H7613, a noun from the root), 4:13 “bear,” 32:20 yiśśāʾ pānāy “accept of me” (lift my face), 50:17 “forgive”: Cain speaks of guilt as a weight he must carry, Jacob hopes to have his face lifted by a gift, the brothers ask the one they wronged to carry what they did; no commentary read joins the verses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'שָׂ֣א'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Moses 5:33, 34, 38, 39, 40–41 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'Satan tempted me because of my brother’s flocks. And I was wroth also; for his offering thou didst accept and not mine'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Moses 5:39 “because of mine iniquities”; 5:41 “shut out from the presence of the Lord”; 5:33 “I am free”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'And Cain was shut out from the presence of the Lord'
  - where: 'section “Where is Abel thy brother?”'
    claim: 'Cambridge on 4:15: “on account of Cain’s entreaty, Jehovah’s mercy is shewn to the first murderer”'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/4.htm'
    quote: 'on account of Cain’s entreaty, Jehovah’s mercy is shewn to the first murderer'
