page: brothers-reconciled
claims:
  - where: 'section “Cain and Abel”'
    claim: 'Cain kills Abel; the Lord says the voice of his brother’s blood cries from the ground'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/4?lang=eng'
    quote: 'the voice of thy brother’s blood crieth unto me from the ground.'
  - where: 'section “Cain and Abel”'
    claim: 'Cain went out from the presence of the LORD and dwelt in Nod; no reconciliation is recorded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/4?lang=eng'
    quote: 'And Cain went out from the presence of the LORD, and dwelt in the land of Nod'
  - where: 'section “Esau and Jacob”'
    claim: 'Esau resolves to kill Jacob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'then will I slay my brother Jacob.'
  - where: 'section “Esau and Jacob”'
    claim: 'Jacob had spent twenty years in Laban’s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'Thus have I been twenty years in thy house'
  - where: 'section “Esau and Jacob”'
    claim: 'Esau runs to meet Jacob and embraces him; in Genesis 33 neither brother speaks of the blessing or the birthright, and Jacob urges his present on Esau (33:8–11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/33?lang=eng'
    quote: 'And Esau ran to meet him, and embraced him, and fell on his neck, and kissed him: and they wept.'
  - where: 'section “Esau and Jacob”'
    claim: 'Jacob sent the present to appease Esau'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/32?lang=eng'
    quote: 'I will appease him with the present that goeth before me'
  - where: 'section “Esau and Jacob”'
    claim: 'Esau’s generosity could be linked to Joseph’s later generosity toward his brothers'
    key: maxwell-teaching-opportunities
    url: 'https://www.churchofjesuschrist.org/study/ensign/1981/04/teaching-opportunities-from-the-old-testament?lang=eng'
    quote: 'This episode on generosity could be linked to the later generosity of Joseph toward his brothers.'
  - where: 'section “Hated and sold”'
    claim: 'Connection made by this page: Cain’s “thy brother’s blood” (4:10) set beside Judah’s “slay our brother, and conceal his blood” (37:26); the Hebrew verb for “slay” (harag, H2026) is at 4:8 and 37:26; dam (H1818, 10 verses, 11 occurrences in Genesis) and ach (H251) stand in one verse at 4:10, 4:11, 9:5 and 37:26, and in adjoining verses at 42:21–22; at 9:5 “brother” is “every man’s brother”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'What profit is it if we slay our brother, and conceal his blood?'
  - where: 'section “Hated and sold”'
    claim: 'Hebrew “slew” (harag, H2026) at 4:8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יַּהַרְגֵֽ/הוּ'
  - where: 'section “Hated and sold”'
    claim: 'Hebrew “slay” (harag, H2026) at 37:26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'נַהֲרֹג֙'
  - where: 'section “Hated and sold”'
    claim: 'Hebrew “brother” (ach, H251) at 4:10 and 37:26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'אָחִ֔י/נוּ'
  - where: 'section “Hated and sold”'
    claim: 'Hebrew “blood” (dam) at 4:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'דְּמֵ֣י'
  - where: 'section “Hated and sold”'
    claim: 'Hebrew “blood” (dam) at 37:26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'דָּמֽ/וֹ'
  - where: 'section “Guilt found out”'
    claim: 'Reuben’s remorse and Judah’s offer are given as indications that the brothers had changed'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Throughout this account, we see indications that Joseph’s brothers had indeed changed.'
  - where: 'section “Guilt found out”'
    claim: 'Reuben says Joseph’s blood is required'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'therefore, behold, also his blood is required'
  - where: 'section “Sold, and sent”'
    claim: 'Hebrew “sold” (makar, H4376) at 45:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'מְכַרְתֶּ֥ם'
  - where: 'section “Sold, and sent”'
    claim: 'Hebrew “sent” (shalach, H7971) at 45:5; makar and shalach occur in the same verse of Genesis only at 45:5 (makar at 25:31, 33; 31:15; 37:27, 28, 36; 45:4, 5; 47:20, 22; shalach at 37:13, 14, 22, 32; 45:5 and elsewhere, never in those verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'שְׁלָחַ֥/נִי'
  - where: 'section “Sold, and sent”'
    claim: 'Ps. 105:17 says God sent a man before them, Joseph, who was sold for a servant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/105?lang=eng'
    quote: 'He sent a man before them, even Joseph, who was sold for a servant'
  - where: 'section “Sold, and sent”'
    claim: 'Ps. 105:17 has both Hebrew verbs: shalach (H7971, “sent”) and makar (H4376, “sold”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִמְכַּ֥ר'
  - where: 'section “Sold, and sent”'
    claim: 'Joseph’s words do not mean God caused the sale; they recognize God’s omniscience and His ability to bring good out of it'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Joseph’s words should not be misunderstood to mean that God caused Joseph’s brothers to sell him into slavery. Rather, Joseph was recognizing God’s omniscience and His ability to bring good out of difficult situations.'
  - where: 'section “Brothers again”'
    claim: 'Connection made by this page: “could not speak peaceably unto him” (37:4) set beside “his brethren talked with him” (45:15); the same Hebrew verb for speaking (dabar, H1696), the ordinary verb, 73 occurrences in Genesis, also at 42:7, 42:30, 44:16, 44:18 and 45:12 between the two'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'Moreover he kissed all his brethren, and wept upon them: and after that his brethren talked with him.'
  - where: 'section “Brothers again”'
    claim: 'Hebrew verb for speaking at 37:4 (dabar, H1696)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'דַּבְּר֥/וֹ'
  - where: 'section “Brothers again”'
    claim: 'Hebrew verb for speaking at 45:15 (dabar, H1696)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'דִּבְּר֥וּ'
  - where: 'section “Brothers again”'
    claim: 'Connection made by this page: Esau’s meeting with Jacob (33:4) set beside Joseph and Benjamin and his brothers (45:14–15); the same Hebrew verbs for falling on the neck, kissing and weeping; falling on the neck is in Genesis at 33:4, 45:14 and 46:29 (Joseph and his father); all three acts together only at 33:4 and 45:14–15; at 50:1 Joseph falls on his father’s face, weeps and kisses him (the three verbs, with “face” for “neck”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/33?lang=eng'
    quote: 'And Esau ran to meet him, and embraced him, and fell on his neck, and kissed him: and they wept.'
  - where: 'section “Brothers again”'
    claim: 'Hebrew “wept” (bakah, H1058) at 33:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יִּבְכּֽוּ'
  - where: 'section “Brothers again”'
    claim: 'Hebrew “fell on the neck” (nafal, al tsavvar) at 33:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'צַוָּארָ֖/ו'
  - where: 'section “Brothers again”'
    claim: 'Hebrew “kissed” (nashaq, H5401a) and “wept” (bakah) at 45:15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יְנַשֵּׁ֥ק'
  - where: 'section “Brothers again”'
    claim: 'Hebrew “fell on the neck” at 45:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'צַוְּארֵ֥י'
  - where: 'section “Brothers again”'
    claim: '“Thought” and “meant” at 50:20 are one Hebrew verb, chashav (H2803)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'חֲשַׁבְתֶּ֥ם'
  - where: 'section “Brothers again”'
    claim: 'Second occurrence of chashav at 50:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'חֲשָׁבָ֣/הּ'
  - where: 'section “Joseph and the Savior”'
    claim: 'The Bible does not represent Joseph as typical of Christ in the way it does Israel’s guidance into and out of Egypt'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/37.htm'
    quote: 'neither Joseph nor his career is represented, either by the prophets or by Christ and His apostles, as typical of Christ, - in anything like the same way, for example, as the guidance of Israel into and out of Egypt'
  - where: 'section “Joseph and the Savior”'
    claim: 'Believing commentators of all centuries have read Joseph’s life as a type of the life of Christ'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/37.htm'
    quote: 'of all centuries have done, as a type of the life of Christ'
  - where: 'section “Joseph and the Savior”'
    claim: 'Likeness: sold for the price of a slave (Joseph twenty pieces of silver, Christ thirty)'
    key: scripture-helps-gen-37-41
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng'
    quote: 'They were sold for the price of a slave in their day—Joseph for 20 pieces of silver and Christ for 30.'
  - where: 'section “Joseph and the Savior”'
    claim: 'Likeness: saviors to their people, providing lifesaving bread'
    key: scripture-helps-gen-37-41
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng'
    quote: 'They were saviors to their people and provided them with lifesaving bread.'
  - where: 'section “Joseph and the Savior”'
    claim: 'Likeness: willingly forgave those who repented'
    key: scripture-helps-gen-37-41
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng'
    quote: 'They willingly forgave those who repented.'
