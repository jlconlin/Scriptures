page: covenant-with-abraham
claims:
  - where: 'opening'
    claim: 'One reading: promise (12), formal initiation (15), expansion (17), formal confirmation (22)'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'In Genesis 12:1–3, God promises a covenantal relationship with Abraham after he leaves Ur and travels to the land of Canaan. He formally initiates that relationship in Genesis 15'
  - where: 'section “Promised and made”'
    claim: 'God’s presence passing through the animals likely assured Abraham the Lord would fulfill His promises'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'Similarly, God’s presence passing through the animals likely assured Abraham that the Lord would fulfill His promises.'
  - where: 'section “Sworn”'
    claim: 'The Lord says “sware/sworn” of Himself in Genesis only at 22:16 and 26:3 (24:7 and 50:24 are Abraham and Joseph speaking of Him)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/22?lang=eng'
    quote: 'By myself have I sworn, saith the LORD'
  - where: 'section “Sworn”'
    claim: 'The Lord’s second first-person oath statement, to Isaac'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: 'I will perform the oath which I sware unto Abraham thy father'
  - where: 'section “Sworn”'
    claim: 'One commentary reads the later references to an oath (Gen. 24:7; 26:3; 50:24) as looking back to the oath of 22:16'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/22.htm'
    quote: 'so that subsequently not only do we find repeated references to this oath (Genesis 24:7; Genesis 26:3; Genesis 50:24; Exodus 13:5'
  - where: 'section “Renewed”'
    claim: 'The covenant was renewed with Isaac and again with Jacob'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'It was renewed with Isaac (Gen. 26:1–4, 24) and again with Jacob (Gen. 28; 35:9–13; 48:3–4).'
  - where: 'section “Renewed”'
    claim: 'Gen. 28:13–15 and 35:9–12 contain no oath word; the land promise to Jacob at 35:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'And the land which I gave Abraham and Isaac, to thee I will give it'
  - where: 'section “A grave for a possession”'
    claim: 'The Hebrew word for “possession” (achuzzah) (H272) occurs nine times in Genesis: 17:8; 23:4, 9, 20; 36:43 (Edom); 47:11 (Egypt); 48:4; 49:30; 50:13'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'אֲחֻזַּת'
  - where: 'section “A grave for a possession”'
    claim: 'Who is buried at Machpelah'
    key: bd-machpelah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/machpelah?lang=eng'
    quote: 'where were buried Sarah (23:19), Abraham (25:9), Isaac, Rebekah, and Leah (49:30–31), and Jacob (50:13).'
  - where: 'section “Joseph’s bones”'
    claim: 'Connection made by this page: the oath God swore (50:24) and the oaths of Jacob and Joseph (47:31; 50:25) are set side by side; the verb is shava (H7650), the ordinary verb for swearing, 19 times in Genesis'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'And Joseph took an oath of the children of Israel, saying, God will surely visit you, and ye shall carry up my bones from hence.'
  - where: 'section “Joseph’s bones”'
    claim: 'Joseph speaks of the land God sware, in the verse before the oath he takes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'unto the land which he sware to Abraham, to Isaac, and to Jacob.'
  - where: 'section “Joseph’s bones”'
    claim: 'Jacob makes Joseph swear at 47:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'And he said, Swear unto me. And he sware unto him.'
  - where: 'section “Joseph’s bones”'
    claim: 'The verb in 50:24 (nishba), 50:25 (vayyashba) and 47:31 (vayyishava) is H7650 shava, as at 50:5–6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יַּשְׁבַּ֣ע'
  - where: 'section “Joseph’s bones”'
    claim: 'Moses took Joseph’s bones because he had straitly sworn Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'for he had straitly sworn the children of Israel'
  - where: 'section “Joseph’s bones”'
    claim: 'Joseph’s bones were buried at Shechem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'And the bones of Joseph, which the children of Israel brought up out of Egypt, buried they in Shechem'
  - where: 'section “Joseph’s bones”'
    claim: 'Hebrews counts Joseph’s commandment as faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith Joseph, when he died, made mention of the departing of the children of Israel; and gave commandment concerning his bones.'
  - where: 'section “The seed, which is Christ”'
    claim: 'Christ would come through Abraham’s lineage'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'Included in the divine promises to Abraham were the assurances that (1) Christ would come through his lineage'
  - where: 'section “The seed, which is Christ”'
    claim: 'Jesus Christ is at the center of the Abrahamic covenant'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Jesus Christ is at the center of the Abrahamic covenant.'
  - where: 'section “The seed, which is Christ”'
    claim: 'Abraham 2:11 gives the blessing of all families as the blessings of the Gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'even with the blessings of the Gospel'
