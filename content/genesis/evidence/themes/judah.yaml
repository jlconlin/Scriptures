page: judah
claims:
  - where: 'opening'
    claim: 'Judah’s offer can remind us of Jesus Christ, Judah’s descendant'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Judah’s actions can remind us of Jesus Christ, who was Judah’s descendant.'
  - where: 'section “Discern, I pray thee”'
    claim: 'The brothers’ words at 37:32 and Tamar’s at 38:25 are the same Hebrew form (hakker, imperative of nakar, H5234, with na)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'הַכֶּר'
  - where: 'section “Discern, I pray thee”'
    claim: 'The same Hebrew phrase is used in 37:32 and 38:25'
    key: sc-knowhy-841
    url: 'https://scripturecentral.org/knowhy/why-is-the-judah-and-tamar-story-in-the-middle-of-the-joseph-story'
    quote: 'This is the exact same Hebrew phrase used in Genesis 38:25, when Tamar asks Judah to “please recognize” the items he had left with her.'
  - where: 'section “Discern, I pray thee”'
    claim: 'Through Pharez, Tamar becomes an ancestor of Jesus Christ'
    key: scripture-helps-gen-37-41
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng'
    quote: 'Through her son Pharez, Tamar would become an ancestor of Jesus Christ.'
  - where: 'section “Discern, I pray thee”'
    claim: 'The Tamar story is the only one in Genesis that might explain Judah’s transformation'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'The only story included in the Genesis narrative to possibly explain Judah’s transformation is the story of Tamar.'
  - where: 'section “Discern, I pray thee”'
    claim: 'Genesis 38 might help explain the change in Judah'
    key: sc-knowhy-841
    url: 'https://scripturecentral.org/knowhy/why-is-the-judah-and-tamar-story-in-the-middle-of-the-joseph-story'
    quote: 'Genesis 38 might help explain the change that is occurring in Judah.'
  - where: 'section “I will be surety for him”'
    claim: 'The verb arav (H6148, “be surety”) occurs in Genesis only at 43:9 and 44:32; the noun eravon (H6162, “pledge”) only at 38:17, 18, 20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'עֵרָב֖וֹן'
  - where: 'section “I will be surety for him”'
    claim: 'Judah progresses from leaving tokens as a pledge to offering himself as a pledge'
    key: spackman-judah-tamar
    url: 'https://rsc.byu.edu/vol-11-no-1-2010/story-judah-tamar'
    quote: 'Judah progresses from selfishness (offering tokens of himself as a pledge to pay a prostitute) to selflessness and redemption in the Joseph story'
  - where: 'section “I will be surety for him”'
    claim: 'The verb arav is glossed “take on pledge, give in pledge”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6148.htm'
    quote: 'take on pledge, give in pledge, exchange'
  - where: 'section “I will be surety for him”'
    claim: 'The same verb is used of God at Psalm 119:122'
    key: bdb
    url: 'https://biblehub.com/hebrew/6148.htm'
    quote: 'of God Isaiah 38:14 go surety for me , Psalm 119:122'
  - where: 'section “I will be surety for him”'
    claim: 'Psalm 119:122 asks God to be surety'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'Be surety for thy servant for good'
  - where: 'section “Instead of the lad”'
    claim: 'Judah’s offer likened to Christ taking our sins upon Himself'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'As Judah offered to take Benjamin’s punishment so that Benjamin could return to his father, so Jesus Christ took our sins upon Himself so that we can return to our Heavenly Father.'
  - where: 'section “Instead of the lad”'
    claim: 'Mosiah 15:9 is the passage cited with that paragraph (its endnote 13)'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'See Mosiah 15:9.'
  - where: 'section “Instead of the lad”'
    claim: 'Mosiah 15:9 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/15?lang=eng'
    quote: 'standing betwixt them and justice; having broken the bands of death, taken upon himself their iniquity and their transgressions'
  - where: 'section “Until Shiloh come”'
    claim: '“Praise” in 49:8 is the verb yadah (H3034) of Judah’s naming (29:35); the verb occurs in Genesis only in these two verses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'יוֹד֣וּ/ךָ'
  - where: 'section “Until Shiloh come”'
    claim: 'Shiloh as a prophecy of the Messiah, confirmed by JST Gen. 50:24; read as “He to whom it belongs”'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'This interpretation is confirmed by JST Gen. 50:24 (Appendix)'
  - where: 'section “Until Shiloh come”'
    claim: 'Shiloh can be read as a short form of “He to whom it belongs”'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'Shiloh can be read as a short form for “He to whom it belongs.”'
  - where: 'section “Until Shiloh come”'
    claim: 'Heb. 7:14, our Lord sprang out of Juda'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'For it is evident that our Lord sprang out of Juda'
  - where: 'section “Until Shiloh come”'
    claim: 'Rev. 5:5, Lion of the tribe of Juda'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/5?lang=eng'
    quote: 'behold, the Lion of the tribe of Juda, the Root of David, hath prevailed'
  - where: 'section “Set beside”'
    claim: 'Connection made by this page: “instead of the lad” (Gen. 44:33) and “in the stead of his son” (Gen. 22:13) use the same Hebrew word, tachat; tachat (H8478) is the ordinary preposition, 31 occurrences in Genesis; a comparison of the words only'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'תַּ֥חַת'
  - where: 'section “Set beside”'
    claim: 'Connection made by this page: Gen. 22:13 ram “in the stead of his son” set beside Gen. 44:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/22?lang=eng'
    quote: 'offered him up for a burnt offering in the stead of his son'
