page: birthright
claims:
  - where: 'opening'
    claim: 'The birthright was the firstborn’s inheritance, generally land and the authority to preside'
    key: bd-birthright
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/birthright?lang=eng'
    quote: 'Under the patriarchal order, the right or inheritance of the firstborn is known as birthright. This generally included a land inheritance as well as the authority to preside.'
  - where: 'opening'
    claim: 'The faithful receive through Jesus Christ the inheritance of the firstborn'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'since they receive through Jesus Christ the inheritance of the firstborn (D&C 93:21–22).'
  - where: 'section “Sold”'
    claim: 'By this account (which rests the rule on custom and tradition) Isaac held the birthright as the firstborn son of the first wife'
    key: ludlow-birthright
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/i-have-a-question/what-laws-governed-the-inheritance-of-birthright-in-the-old-testament?lang=eng'
    quote: 'When Sarah gave birth to Isaac, Isaac held the birthright because he was the firstborn son of the first wife.'
  - where: 'section “Sold”'
    claim: 'The only transfer of the birthright Genesis narrates is at 25:31–34; by occurrences.mjs the English word is at 25:31–34, 27:36 (Esau looking back) and 43:33, and Hebrew bekorah (H1062) at those six verses and 4:4 (“firstlings”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'and he sold his birthright unto Jacob.'
  - where: 'section “Lost”'
    claim: 'Reuben lost his birthright because of transgression (paraphrased on the page)'
    key: bd-reuben
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/reuben?lang=eng'
    quote: 'Although Reuben was the firstborn of Jacob and Leah, he lost his birthright because of transgression (Gen. 35:22; 49:3–4).'
  - where: 'section “Crossed”'
    claim: 'The scriptures do not explain why Ephraim was chosen instead of Manasseh'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'While the scriptures do not explain why Ephraim was chosen instead of his older brother, Manasseh'
  - where: 'section “Crossed”'
    claim: 'Jacob’s response made clear it was the Lord’s will'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Jacob’s response to Joseph’s attempt to intervene made it clear that this was the Lord’s will.'
  - where: 'section “Crossed”'
    claim: 'Neither the Bible nor modern scripture explains why Jacob departed from primogeniture'
    key: ludlow-birthright
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/i-have-a-question/what-laws-governed-the-inheritance-of-birthright-in-the-old-testament?lang=eng'
    quote: 'Neither the Bible nor modern scripture explains specifically why Jacob departed from the usual practice of primogeniture'
  - where: 'section “Crossed”'
    claim: 'The JST and D&C 133:32–34 indicate Jacob was directed by the Lord'
    key: ludlow-birthright
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/i-have-a-question/what-laws-governed-the-inheritance-of-birthright-in-the-old-testament?lang=eng'
    quote: 'indicate that Jacob was directed by the Lord in giving the greater blessing to Ephraim'
  - where: 'section “Joseph’s, and Judah’s”'
    claim: 'Genesis 48–49 does not use the word “birthright” (checked with occurrences.mjs, English and Hebrew H1062; the verse says Ephraim was set before Manasseh)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'and he set Ephraim before Manasseh.'
  - where: 'section “Reasons”'
    claim: 'A firstborn could lose the birthright because of unrighteousness'
    key: bd-birthright
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/birthright?lang=eng'
    quote: 'There are several instances in the scriptures of the one who was the firstborn losing his birthright because of unrighteousness and his office being given to another'
  - where: 'section “Reasons”'
    claim: 'The firstborn had to be worthy and could lose the birthright by unrighteousness'
    key: gs-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/firstborn?lang=eng'
    quote: 'The firstborn had to be worthy to assume this responsibility (1 Chr. 5:1–2) and could lose his birthright by unrighteousness.'
  - where: 'section “The Firstborn”'
    claim: 'As Firstborn in the spirit and Only Begotten in the flesh, Jesus is the Father’s heir'
    key: new-era-birthright-2005
    url: 'https://www.churchofjesuschrist.org/study/new-era/2005/11/you-have-a-birthright?lang=eng'
    quote: 'As the Firstborn of Heavenly Father in the spirit and the Father’s Only Begotten Son in the flesh, Jesus is the Father’s heir.'
  - where: 'section “The Firstborn”'
    claim: 'Jesus Christ is the most notable of those holding a birthright'
    key: new-era-birthright-2005
    url: 'https://www.churchofjesuschrist.org/study/new-era/2005/11/you-have-a-birthright?lang=eng'
    quote: 'The most notable of those holding a birthright is Jesus Christ.'
  - where: 'section “The Firstborn”'
    claim: 'Joseph and Ephraim received the inheritance as though firstborn'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'Joseph, though not the firstborn of Jacob, received the inheritance as though he were the firstborn (1 Chr. 5:1–2), as also did Ephraim (Gen. 48; Jer. 31:9).'
  - where: 'section “The Firstborn”'
    claim: 'The faithful receive through Jesus Christ the inheritance of the firstborn'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'since they receive through Jesus Christ the inheritance of the firstborn (D&C 93:21–22).'
  - where: 'section “Joseph’s, and Judah’s”'
    claim: 'The Church edition’s footnote at Gen. 27:29 “bow” points to Gen. 49:8 (and the footnote at 49:8 points back to 27:29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'Gen. 49:8; 1 Ne. 7:20.'
  - where: 'section “The Firstborn”'
    claim: 'The faithful are made members of the Church of the Firstborn in eternity'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'The faithful saints were made members of the Church of the Firstborn in eternity'
  - where: 'section “The Firstborn”'
    claim: 'Connection made by this page: 1 Chr. 5:1 (Reuben’s birthright given to another in his place) set beside Rom. 8:17 and D&C 93:21–22 (the faithful heirs with and through the Firstborn); the Bible Dictionary “Firstborn” prints the two facts in one paragraph but does not compare them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/8?lang=eng'
    quote: 'heirs of God, and joint-heirs with Christ'
