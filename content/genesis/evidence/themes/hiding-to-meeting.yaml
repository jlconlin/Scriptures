page: hiding-to-meeting
claims:
  - where: 'section “Hid, and driven out”'
    claim: 'Adam says he was afraid and hid (3:10); God places cherubim and a flaming sword to keep the way of the tree of life (3:24)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/3?lang=eng'
    quote: 'I heard thy voice in the garden, and I was afraid, because I was naked; and I hid myself.'
  - where: 'section “Hid, and driven out”'
    claim: 'Adam and Eve were shut out from his presence (Moses 5:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'they heard the voice of the Lord from the way toward the Garden of Eden, speaking unto them, and they saw him not; for they were shut out from his presence.'
  - where: 'section “Hid, and driven out”'
    claim: 'Alma 42:7: the first parents were cut off temporally and spiritually from the presence of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/42?lang=eng'
    quote: 'our first parents were cut off both temporally and spiritually from the presence of the Lord'
  - where: 'section “From thy face shall I be hid”'
    claim: 'Cain says “from thy face shall I be hid” (4:14) and went out from the presence of the LORD (4:16); the text goes on with Cain in Nod and tells of no return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/4?lang=eng'
    quote: 'And Cain went out from the presence of the LORD, and dwelt in the land of Nod, on the east of Eden.'
  - where: 'section “The LORD appeared”'
    claim: 'The niphal of ra’ah (H7200) with God as subject, “appeared,” is first used at 12:7 (also 17:1); in chapters 1–11 the niphal occurs only at 1:9, 8:5, 9:14 and none has God as subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יֵּרָ֤א'
  - where: 'section “The LORD appeared”'
    claim: 'Restoration scripture tells of the Lord appearing to Adam’s posterity at Adam-ondi-Ahman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'And the Lord appeared unto them'
  - where: 'section “The LORD appeared”'
    claim: 'Enoch and Noah walked with God (5:24; 6:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/6?lang=eng'
    quote: 'Noah was a just man and perfect in his generations, and Noah walked with God.'
  - where: 'section “The gate of heaven”'
    claim: 'The ladder, the LORD standing above it, and Jacob’s words at waking (28:12–17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/28?lang=eng'
    quote: 'this is none other but the house of God, and this is the gate of heaven.'
  - where: 'section “The gate of heaven”'
    claim: 'Marion G. Romney: temples are to us what Bethel was to Jacob'
    key: romney-temples-1971
    url: 'https://www.churchofjesuschrist.org/study/ensign/1971/03/temples-the-gates-to-heaven?lang=eng'
    quote: 'Temples are to us all what Bethel was to Jacob.'
  - where: 'section “Face to face”'
    claim: 'Jacob’s words at Peniel and to Esau (32:30; 33:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/32?lang=eng'
    quote: 'for I have seen God face to face, and my life is preserved.'
  - where: 'section “Face to face”'
    claim: 'It is unclear who the man was; the Hebrew word supports both possibilities and could even refer to God Himself'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'It is unclear who the man was. Some think he was an angel, while others suggest he was a mortal messenger sent from God. The Hebrew word used for the man in these verses supports both possibilities and could even refer to God Himself.'
  - where: 'section “Face to face”'
    claim: 'Joseph Fielding Smith: Jacob’s later saying he had beheld the Lord did not refer to his wrestling'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: 'Later in this chapter when Jacob said he had beheld the Lord, that did not have reference to his wrestling.'
  - where: 'section “Face to face”'
    claim: 'Joseph Fielding Smith thought the wrestler more likely a messenger'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: 'More than likely it was a messenger'
  - where: 'section “Face to face”'
    claim: 'Connection made by this page: “presence” (3:8, 4:16) and “face” (4:14, 32:30, 33:10) are one Hebrew noun, panim; a man and woman hide from the face, a brother is hidden from it, Jacob says he has seen it and lived; a comparison of words only, no source draws it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/4?lang=eng'
    quote: 'Behold, thou hast driven me out this day from the face of the earth; and from thy face shall I be hid'
  - where: 'section “Face to face”'
    claim: 'panim (H6440) is in 3:8, 4:14, 4:16, 32:30 and 33:10; the Genesis count is 141 occurrences in 126 verses; it is the ordinary word for face and before'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וּ/מִ/פָּנֶ֖י/ךָ'
  - where: 'section “Face to face”'
    claim: 'The same “from the face of” (mippene) is used of fleeing human faces: Hagar from Sarai (16:8) and Jacob from Esau (35:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'מִ/פְּנֵ֖י'
  - where: 'section “Before whom my fathers did walk”'
    claim: 'Jacob blesses Joseph: God before whom Abraham and Isaac did walk, the Angel which redeemed him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'God, before whom my fathers Abraham and Isaac did walk, the God which fed me all my life long unto this day, The Angel which redeemed me from all evil, bless the lads'
  - where: 'section “Before whom my fathers did walk”'
    claim: 'The hithpael of halak (H1980) occurs eight times in Genesis: 3:8; 5:22; 5:24; 6:9; 13:17 (through the land); 17:1; 24:40; 48:15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'הִתְהַלְּכ֨וּ'
  - where: 'section “The way back”'
    claim: 'Ether 3:13: redeemed from the fall, brought back into the Lord’s presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/3?lang=eng'
    quote: 'ye are redeemed from the fall; therefore ye are brought back into my presence'
  - where: 'section “The way back”'
    claim: 'Hel. 14:17: the resurrection of Christ redeems mankind and brings them back into the presence of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/14?lang=eng'
    quote: 'the resurrection of Christ redeemeth mankind, yea, even all mankind, and bringeth them back into the presence of the Lord.'
  - where: 'section “The way back”'
    claim: 'John 1:51 alludes to Gen. 28:12'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'an allusion to Genesis 28:12'
  - where: 'section “The way back”'
    claim: 'One reading: in John the angels ascend and descend upon Jesus, who becomes the true gate of heaven'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'in John’s account, the angels are “ascending and descending” upon Jesus. He has become the ladder, the link uniting heaven and earth.'
  - where: 'section “The way back”'
    claim: 'Frederick: Jesus becomes the new Beth-el, the true gate of heaven'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Jesus, then, becomes the new Beth-el, the true “gate of heaven.”'
