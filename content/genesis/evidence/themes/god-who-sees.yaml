page: god-who-sees
claims:
  - where: 'section “Remembered”'
    claim: 'In Gen. 8:1 the narrator says God remembered (the person-side example is Gen. 16:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/8?lang=eng'
    quote: 'And God remembered Noah, and every living thing, and all the cattle that was with him in the ark: and God made a wind to pass over the earth, and the waters assuaged;'
  - where: 'section “Remembered”'
    claim: 'God remembered Abraham and sent Lot out; the narrator speaks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/19?lang=eng'
    quote: 'God remembered Abraham, and sent Lot out of the midst of the overthrow'
  - where: 'section “Remembered”'
    claim: 'The sense of “remember” with God as subject is to act for someone: with kindness, granting requests, protecting, delivering'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'individuals, with kindness, granting requests, protecting, delivering etc.'
  - where: 'section “Remembered”'
    claim: 'The lexicon lists Gen. 8:1 and 19:29 under this sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'also Genesis 8:1 (P), Genesis 19:29 (P)'
  - where: 'section “Remembered”'
    claim: 'God’s seeing precedes judgment or inquiry at 6:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/6?lang=eng'
    quote: 'GOD saw that the wickedness of man was great in the earth'
  - where: 'section “Remembered”'
    claim: 'The LORD came down to see the city and tower (11:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'And the Lord came down to see the city and the tower'
  - where: 'section “Remembered”'
    claim: 'The LORD goes down to see whether Sodom has done according to the cry (18:21)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'I will go down now, and see whether they have done altogether according to the cry of it'
  - where: 'section “Thou God seest me”'
    claim: 'Hagar is Sarah’s Egyptian handmaid'
    key: bd-hagar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hagar?lang=eng'
    quote: 'An Egyptian handmaid of Sarah and mother of Abraham’s son Ishmael'
  - where: 'section “Thou God seest me”'
    claim: 'Gen. 16:11 is the first Genesis occurrence of the noun “affliction” (H6040; also 29:32, 31:42, 41:52)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'עָנְיֵ'
  - where: 'section “Thou God seest me”'
    claim: 'Gen. 16:11 is the first Genesis verse in which God is the subject of “hear” (shama‘, H8085) (the angel speaks)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'שָׁמַ֥ע'
  - where: 'section “Thou God seest me”'
    claim: 'Hagar names the LORD “Thou God seest me”; in Genesis she is the first person to say aloud that God sees (El ro’i / ra’iti)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/16?lang=eng'
    quote: 'And she called the name of the Lord that spake unto her, Thou God seest me'
  - where: 'section “Thou God seest me”'
    claim: 'The Hebrew of 16:13 uses the verb ra’ah (“see”), ra’iti'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'רָאִ֖יתִי'
  - where: 'section “Thou God seest me”'
    claim: 'Hagar is the only person in the Old Testament to name God himself (paraphrased on the page)'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'Hagar’s extraordinary encounter at the well concludes with her becoming the only person in the Old Testament to name God'
  - where: 'section “Thou God seest me”'
    claim: 'At 21:17–19 the narrator says God heard and opened her eyes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21?lang=eng'
    quote: 'And God opened her eyes, and she saw a well of water'
  - where: 'section “The LORD will see”'
    claim: 'The Church edition’s footnote gives Jehovah-jireh as “The Lord will see, or provide”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/22?lang=eng'
    quote: 'IE The Lord will see, or provide (v. 8).'
  - where: 'section “The LORD will see”'
    claim: 'The Hebrew verb in 22:8 is yir’eh, from ra’ah “see”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'יִרְאֶה'
  - where: 'section “Leah and Rachel”'
    claim: 'Leah’s “affliction” (29:32) is the same Hebrew noun as 16:11 (H6040)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'בְּ/עָנְיִ֔/י'
  - where: 'section “Jacob”'
    claim: 'Jacob’s “affliction” (31:42) is again the noun H6040'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'עָנְיִ֞'
  - where: 'section “God will surely visit you”'
    claim: '“Visit” (paqad) with God as subject in Genesis occurs at 21:1 and 50:24–25; the doubled form paqod yifqod is in 50:24 and 50:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'פָּקֹ֧ד'
  - where: 'section “God will surely visit you”'
    claim: 'Ex. 3:16 has the same doubled construction (paqod paqadti)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פָּקֹ֤ד'
  - where: 'section “God will surely visit you”'
    claim: 'Ex. 2:24: God heard their groaning and remembered his covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'And God heard their groaning, and God remembered his covenant'
  - where: 'section “God will surely visit you”'
    claim: 'Ex. 3:7 has the noun “affliction” (H6040) of Gen. 16:11, 29:32 and 31:42'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'עֳנִ֥י'
  - where: 'section “God will surely visit you”'
    claim: 'Ex. 4:31 has “visited” (paqad, H6485), “looked” (ra’ah, H7200) and “affliction” (H6040) together'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'עָנְיָ֔/ם'
  - where: 'section “God will surely visit you”'
    claim: 'Ex. 4:31: the people hear that the LORD had visited them and looked upon their affliction'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'that the Lord had visited the children of Israel, and that he had looked upon their affliction'
  - where: 'section “God hath visited his people”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “God hath visited his people”'
    claim: 'At Nain the people say God hath visited his people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'That God hath visited his people.'
  - where: 'section “God hath visited his people”'
    claim: 'Jesus had compassion on the widow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'when the Lord saw her, he had compassion on her'
  - where: 'section “God hath visited his people”'
    claim: 'The footnote on “visited” (Luke 7:16) points to Ex. 3:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'Ex. 3:16; Luke 1:68; D&C 110:7.'
  - where: 'section “God hath visited his people”'
    claim: 'Zacharias: visited and redeemed his people, to remember his holy covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'Blessed be the Lord God of Israel; for he hath visited and redeemed his people'
  - where: 'section “God hath visited his people”'
    claim: 'A commentary reads Joseph’s “visit” as God’s gracious visitation, as in Ex. 3:16, Ex. 4:31 and Luke 1:68'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/50.htm'
    quote: 'The visitation of God in a gracious and merciful sense, as in Exodus 3:16; Exodus 4:31; cf. Luke 1:68'
  - where: 'section “God hath visited his people”'
    claim: 'Connection made by this page: Gen. 50:24 “God will surely visit you” set beside Luke 7:16 “God hath visited his people”; a commentary links 50:24 to Luke 1:68 and the Church footnote at Luke 7:16 cites Ex. 3:16 and Luke 1:68, but the step to Luke 7:16 is the page’s own'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'That God hath visited his people.'
