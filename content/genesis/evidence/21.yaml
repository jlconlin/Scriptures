chapter: 21
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Abraham was a hundred when Isaac was born'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21?lang=eng'
    quote: 'And Abraham was an hundred years old, when his son Isaac was born unto him.'
  - where: 'when'
    claim: 'Abraham was then sojourning in Gerar, in the south country'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/20?lang=eng'
    quote: 'And Abraham journeyed from thence toward the south country, and dwelled between Kadesh and Shur, and sojourned in Gerar.'
  - where: 'setting'
    claim: 'The Bible Dictionary’s outline begins Isaac’s account at 21:1 and runs it to 35:29; the covenant was to be upon Isaac'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Isaac. The account of his life (21:1–35:29) depicts him as a peacemaker and declares that from among the several sons of Abraham, the covenant was to be upon Isaac (Gen. 21:12; Rom. 9:7).'
  - where: 'setting'
    claim: 'The promise of the son was set for a definite time, the next year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'But my covenant will I establish with Isaac, which Sarah shall bear unto thee at this set time in the next year.'
  - where: 'setting'
    claim: 'Paul uses the story of Hagar as an allegory of two covenants'
    key: bd-hagar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hagar?lang=eng'
    quote: 'Paul uses the story as an allegory to show the difference between the two covenants, the one a covenant of bondage and the other one of freedom (Gal. 4:24).'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Isaac’s name means “he laughs,” and Genesis plays on it in 17:17, 18:12, and 21:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/3327.htm'
    quote: 'Isaac, son of Abraham and Sarah (he laugheth, compare play upon name Genesis 18:12f. (J), Genesis 21:6 (E), Genesis 17:17,19 (P)'
  - where: 'thread'
    claim: 'Ishmael means “God hears”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3458.htm'
    quote: 'proper name, masculine El heareth'
  - where: 'thread'
    claim: 'The verb “mocking” in verse 9 is a form of the same root, tsachaq'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-9.htm'
    quote: '6711 [e]mə·ṣa·ḥêq.מְצַחֵֽק׃mockingV‑Piel‑Prtcpl‑ms'

  # ---------- note 21:1 ----------
  - where: 'note 21:1 “The LORD visited Sarah”'
    claim: 'Paqad, “visit,” used of the LORD means to visit graciously; BDB lists Gen. 21:1, Gen. 50:24, and Jer. 29:10 under this sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/6485.htm'
    quote: 'especially of ׳י, visit graciously Genesis 21:1; Genesis 50:24,25 = Exodus 13:19 (all E), Isaiah 23:17; Jeremiah 15:15 ("" זָכַר), Jeremiah 27:22; Jeremiah 29:10'
  - where: 'note 21:1 “The LORD visited Sarah”'
    claim: 'The Hebrew of verse 1: the LORD visited (paqad) Sarah as He had said, and did as He had spoken'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-1.htm'
    quote: '6485 [e]pā·qaḏפָּקַ֥דvisitedV‑Qal‑Perf‑3ms'
  - where: 'note 21:1 “The LORD visited Sarah”'
    claim: 'Paqad means to pay attention to, attend to, see to'
    key: bdb
    url: 'https://biblehub.com/hebrew/6485.htm'
    quote: 'b. attend to, in act, see to, with accusative of person'
  - where: 'note 21:1 “The LORD visited Sarah”'
    claim: 'Hebrews credits Sarah’s conception to her faith that God was faithful'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Through faith also Sara herself received strength to conceive seed, and was delivered of a child when she was past age, because she judged him faithful who had promised.'

  # ---------- note 21:6 ----------
  - where: 'note 21:6 “Laughter God made for Sarah”'
    claim: 'Verse 6 in Hebrew: tsechoq (laughter) God has made for me; all who hear will laugh (yitschaq) for/with me'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-6.htm'
    quote: '6712 [e]ṣə·ḥōqצְחֹ֕קLaughterN‑ms'
  - where: 'note 21:6 “Laughter God made for Sarah”'
    claim: 'The verb in “will laugh” is yitschaq, spelled with the same letters as Isaac’s name'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-6.htm'
    quote: '6711 [e]yiṣ·ḥaq-יִֽצְחַק־will laughV‑Qal‑Imperf‑3ms'
  - where: 'note 21:6 “Laughter God made for Sarah”'
    claim: 'Isaac’s name in verse 3 is Yitschaq'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-3.htm'
    quote: '3327 [e]yiṣ·ḥāq.יִצְחָֽק׃IsaacN‑proper‑ms'
  - where: 'note 21:6 “Laughter God made for Sarah”'
    claim: 'BDB names the wordplay on Isaac’s name in 17:17, 18:12, and 21:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/3327.htm'
    quote: 'Isaac, son of Abraham and Sarah (he laugheth, compare play upon name Genesis 18:12f. (J), Genesis 21:6 (E), Genesis 17:17,19 (P)'
  - where: 'note 21:6 “Laughter God made for Sarah”'
    claim: 'With the preposition l-, the verb means to laugh at or concerning; BDB lists 21:6 there'
    key: bdb
    url: 'https://biblehub.com/hebrew/6711.htm'
    quote: 'laugh, Genesis 18:12,13,15 (twice in verse) (J), Genesis 17:17 (P); with ל at, concerning, Genesis 21:6.'
  - where: 'note 21:6 “Laughter God made for Sarah”'
    claim: 'The Septuagint reads “shall rejoice with me”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/21.htm'
    quote: 'And Sarrha said, The Lord has made laughter for me, for whoever shall hear shall rejoice with me.'

  # ---------- note 21:9 ----------
  - where: 'note 21:9 “What was Ishmael doing?”'
    claim: 'The Piel of tsachaq means “jest,” “sport, play”; BDB puts 21:9 under “sport, play”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6711.htm'
    quote: '2 sport, play Genesis 21:9 (E) Exodus 32:6 (J); make sport for Judges 16:25'
  - where: 'note 21:9 “What was Ishmael doing?”'
    claim: 'The Septuagint reads “sporting with Isaac her son”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/21.htm'
    quote: 'And Sarrha having seen the son of Agar the Egyptian who was born to Abraam, sporting with Isaac her son,'
  - where: 'note 21:9 “What was Ishmael doing?”'
    claim: 'The verb is a wordplay on Isaac’s name; “laughing” or “playing” would be a better translation but would not explain Sarah’s reaction'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'This is a wordplay on the name Isaac, since the verb translated as “mocking” has the same root as Isaac’s name. It is actually probably better translated as “laughing” or “playing,” but these translations would not explain Sarah’s violent reaction.'
  - where: 'note 21:9 “What was Ishmael doing?”'
    claim: 'What “mocking” means is unclear, but it carries negative connotations and appears to pose a threat to the family'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'What exactly is meant by “mocking” is unclear; however, the biblical account seems to carry negative connotations, and the “mocking” appears to pose some sort of a threat to the family and their beliefs.'
  - where: 'note 21:9 “What was Ishmael doing?”'
    claim: 'Paul attributes harmful motives to Ishmael; scholars’ readings range from innocent play to abuse'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'Modern scholars have debated what Ishmael was actually doing, ranging from innocently playing with Isaac to molesting him.[26] The Apostle Paul attributed harmful motives in Ishmael, who “persecuted” Isaac (Galatians 4:29).'
  - where: 'note 21:9 “What was Ishmael doing?”'
    claim: 'Paul calls it persecution'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/4?lang=eng'
    quote: 'But as then he that was born after the flesh persecuted him that was born after the Spirit, even so it is now.'

  # ---------- note 21:10 ----------
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'Under Hammurabi’s laws (Babylonian), a maid’s sons shared the inheritance only if the father had called them “my sons”; otherwise they did not share, but the maid and her sons were freed'
    key: hammurabi-king
    url: 'https://avalon.law.yale.edu/ancient/hamcode.asp'
    quote: 'If, however, the father while still living did not say to the sons of the maid-servant: "My sons," and then the father dies, then the sons of the maid-servant shall not share with the sons of the wife, but the freedom of the maid and her sons shall be granted.'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'Hammurabi’s law 170: acknowledged sons of the maid divide the property with the wife’s sons'
    key: hammurabi-king
    url: 'https://avalon.law.yale.edu/ancient/hamcode.asp'
    quote: 'then the sons of the wife and of the maid-servant shall divide the paternal property in common.'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'The Code of Hammurabi is an ancient Babylonian law code'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'A similar circumstance and corresponding law appears in an ancient Babylonian law code, the Code of Hammurabi'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'The text seems to imply Hagar left as a free woman, perhaps paralleling an ancient law code'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'As far as the fate of Hagar is concerned, the language of the text seems to imply that she left as a free woman. Leaving with this free status perhaps parallels another ancient Near Eastern legal code'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'One reading: God’s “hearken unto her voice” shows Sarah’s request was divine will; her concern was that the birthright might go to the wrong child'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'This suggests that Sarah’s request was more than a vindictive response to perceived slights against her son but was, in fact, divine will.'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'The clause about Isaac indicates what may have prompted Sarah’s concern: that the birthright might go to the wrong child'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'indicates what may have prompted Sarah’s concern—namely, that the birthright may go to the wrong child.'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'Another reading: not to overlook the tragedy by calling it God’s will'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'I do not think we are supposed to overlook this tragic moment by seeing it as God’s will since the Lord tells Abraham to'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'Sarah seems to have feared Ishmael would hurt or displace Isaac'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'she seems to have lived in fear that somehow Ishmael would hurt or displace Isaac, so she had Hagar and Ishmael banished to the wilderness (Genesis 21:9–10).'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'Abraham agreed only because the Lord sanctioned it and promised to make Ishmael a nation'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'It seems that Abraham agrees to Sarah’s demand only because the Lord sanctions it and promises Abraham once again that he will make Ishmael a great nation (vv. 12–13).'
  - where: 'note 21:10 “Why Sarah asked Abraham to send them away”'
    claim: 'Abraham consented because the Lord promised to protect and bless Ishmael; the episode is heartfelt, not heartless'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'The episode is thus heartfelt, not heartless, and reflects obedience rather than malice.'

  # ---------- note 21:12 ----------
  - where: 'note 21:12 “In Isaac shall thy seed be called”'
    claim: 'Paul quotes verse 12 to say the children of the promise are counted for the seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/9?lang=eng'
    quote: 'That is, They which are the children of the flesh, these are not the children of God: but the children of the promise are counted for the seed.'
  - where: 'note 21:12 “In Isaac shall thy seed be called”'
    claim: 'Paul quotes verse 10 as scripture and reads the two sons as an allegory of two covenants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/4?lang=eng'
    quote: 'Nevertheless what saith the scripture? Cast out the bondwoman and her son: for the son of the bondwoman shall not be heir with the son of the freewoman.'
  - where: 'note 21:12 “In Isaac shall thy seed be called”'
    claim: 'Paul’s allegory: the two covenants, bondage and freedom'
    key: bd-hagar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hagar?lang=eng'
    quote: 'Paul uses the story as an allegory to show the difference between the two covenants, the one a covenant of bondage and the other one of freedom (Gal. 4:24).'
  - where: 'note 21:12 “In Isaac shall thy seed be called”'
    claim: 'From among Abraham’s sons, the covenant was to be upon Isaac'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'from among the several sons of Abraham, the covenant was to be upon Isaac (Gen. 21:12; Rom. 9:7).'
  - where: 'note 21:12 “In Isaac shall thy seed be called”'
    claim: 'Those who receive the gospel are called after Abraham’s name and accounted his seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'for as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed, and shall rise up and bless thee, as their father;'

  # ---------- note 21:13 ----------
  - where: 'note 21:13 “A nation from Ishmael”'
    claim: 'Ishmael played a role in fulfilling the promise of innumerable posterity'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'Although the Lord declared that the Abrahamic covenant would continue through Isaac, Ishmael also played a role in the fulfillment of Abraham’s promised blessings'
  - where: 'note 21:13 “A nation from Ishmael”'
    claim: 'Twelve princes were promised in 17:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'And as for Ishmael, I have heard thee: Behold, I have blessed him, and will make him fruitful, and will multiply him exceedingly; twelve princes shall he beget, and I will make him a great nation.'
  - where: 'note 21:13 “A nation from Ishmael”'
    claim: 'The twelve princes are listed in 25:12–16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'These are the sons of Ishmael, and these are their names, by their towns, and by their castles; twelve princes according to their nations.'
  - where: 'note 21:13 “A nation from Ishmael”'
    claim: 'Latter-day revelation: from Hagar sprang many people, fulfilling the promises'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'God commanded Abraham, and Sarah gave Hagar to Abraham to wife. And why did she do it? Because this was the law; and from Hagar sprang many people. This, therefore, was fulfilling, among other things, the promises.'
  - where: 'note 21:13 “A nation from Ishmael”'
    claim: 'Hagar’s descendants are part of the promises of the Abrahamic covenant'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'The wording of this promise makes it very clear that Hagar’s descendants are part and parcel with the promises of what we call the Abrahamic covenant'

  # ---------- note 21:14 ----------
  - where: 'note 21:14 “How old was Ishmael?”'
    claim: 'Ishmael was born when Abraham was 86, so he was about 14 when Isaac was born; he was a teenager, not a helpless child'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'Genesis 16:16 tells us that Ishmael was born when Abraham was eighty-six years old, making Ishmael around fourteen years old when Isaac was born. Thus, at the time Hagar and Ishmael wandered in the wilderness, Ishmael was not a helpless, unaccountable child, but a teenager.'
  - where: 'note 21:14 “How old was Ishmael?”'
    claim: 'Estimates of Ishmael’s age at the expulsion range from 15 to 17'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'Some estimates as to Ishmael’s age at the time of the incident range from fifteen to seventeen.'
  - where: 'note 21:14 “How old was Ishmael?”'
    claim: 'If Isaac was weaned at about three or four, Ishmael was close to seventeen'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'Assuming that Isaac would have been about three or four at his weaning and that Ishmael was thirteen when he was circumcised before Isaac’s birth, Ishmael would have been close to seventeen years old'
  - where: 'note 21:14 “How old was Ishmael?”'
    claim: 'The Septuagint reads that Abraham put the child on her shoulder'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/21.htm'
    quote: 'and gave them to Agar, and he put the child on her shoulder, and sent her away'
  - where: 'note 21:14 “How old was Ishmael?”'
    claim: 'One reading: “the boy” depends on “took,” not on “putting it on her shoulder”; yeled, like na‘ar, can mean a boy or young man; Ishmael was 15 or 16'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/21.htm'
    quote: 'For ואת־היּלד does not depend upon שׂם and ויּתּן because of the copula ו, but upon יקּח, the leading verb of the sentence, although it is separated from it by the parenthesis "putting it upon her shoulder."'
  - where: 'note 21:14 “How old was Ishmael?”'
    claim: 'Keil: yeled does not mean an infant; Ishmael 15 or 16'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/21.htm'
    quote: 'For ילד like נער does not mean an infant, but a boy, and also a young man (Genesis 4:23); - Ishmael must have been 15 or 16 years old'
  - where: 'note 21:14 “How old was Ishmael?”'
    claim: 'One reading: “cast” means she let go of the boy when he fell exhausted from thirst'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/21.htm'
    quote: 'signifies that she suddenly left hold of the boy, when he fell exhausted from thirst'
  - where: 'note 21:14 “How old was Ishmael?”'
    claim: 'The Hebrew of verse 14: “putting [them] on her shoulder, and the boy”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-14.htm'
    quote: '7760 [e]śāmשָׂ֧םputting'

  # ---------- note 21:17 ----------
  - where: 'note 21:17 “God heard”'
    claim: 'Hebrew of verse 17: God heard (shama‘) the voice of the boy'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-17.htm'
    quote: '8085 [e]   17way·yiš·ma‘   17'
  - where: 'note 21:17 “God heard”'
