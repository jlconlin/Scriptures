    key: bdb
    url: 'https://biblehub.com/hebrew/3458.htm'
    quote: '1 son of Abraham and Hagar Genesis 16:11 (name explanation ׳רגו ׳שָׁמַע י)'
  - where: 'note 21:17 “God heard”'
    claim: 'The naming in 16:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/16?lang=eng'
    quote: 'and shalt call his name Ishmael; because the Lord hath heard thy affliction.'
  - where: 'note 21:17 “God heard”'
