  # ---------- note 21:31 ----------
  - where: 'note 21:31 “Well of seven, well of the oath”'
    claim: 'Beer-sheba: “well of seven,” explained by the seven lambs, or “well of oath”; compare 26:33'
    key: bdb
    url: 'https://biblehub.com/hebrew/884.htm'
    quote: 'Beersheba (well of seven, explained Genesis 21:30,31 as place of swearing by seven lambs, or, well of oath, see שְׁבֻעָה; compare same meaning otherwise derived Genesis 26:33)'
  - where: 'note 21:31 “Well of seven, well of the oath”'
    claim: 'The verb “swear” is probably “to seven oneself,” to bind oneself by seven things'
    key: bdb
    url: 'https://biblehub.com/hebrew/7650.htm'
    quote: 'verb swear (probably, so to say, seven oneself, or bind oneself by seven things'
  - where: 'note 21:31 “Well of seven, well of the oath”'
    claim: 'Verse 31 in Hebrew: Be’er-sheva‘ … because there they swore (nishbe‘u)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-31.htm'
    quote: '7650 [e]niš·bə·‘ūנִשְׁבְּע֖וּswore an oathV‑Nifal‑Perf‑3cp'
  - where: 'note 21:31 “Well of seven, well of the oath”'
    claim: 'The Septuagint translates the name as “The Well of the Oath”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/21.htm'
    quote: 'Therefore he named the name of that place, The Well of the Oath, for there they both swore.'
  - where: 'note 21:31 “Well of seven, well of the oath”'
    claim: 'One reading: the lambs were a gift securing the well as Abraham’s property, not a purchase; no sacrifice'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/21.htm'
    quote: 'It was not to redeem the well, but to secure the well as his property against any fresh claims on the part of the Philistines, that the present was given'
  - where: 'note 21:31 “Well of seven, well of the oath”'
    claim: 'Isaac’s servants later name a well Shebah, and the city Beer-sheba'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: 'And he called it Shebah: therefore the name of the city is Beer-sheba unto this day.'
  - where: 'note 21:31 “Well of seven, well of the oath”'
    claim: 'Beersheba became the home of Abraham, Isaac, and Jacob and the southern limit of Israel'
    key: bd-beersheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beersheba?lang=eng'
    quote: 'The home of Abraham (Gen. 21:31), Isaac (26:23), and Jacob (28:10); so called from the covenant Abraham made here with Abimelech, king of Gerar (21:31). It was afterwards in the tribe of Simeon (Josh. 19:2) and was regarded as the southern limit of Israel'

