    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'both had encounters with a ruler, or successive rulers, in the area named Abimelech (Genesis 20:1, 26:6).'
  - where: 'note 21:22 “Abimelech asks for an oath”'
