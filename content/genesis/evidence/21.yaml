  - where: 'note 21:17 “God heard”'
    claim: 'Hagar receives comfort and direction from God; He loves all, bond and free'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Hagar receives comfort and direction from God, reminding the reader once again that he is not a respecter of persons and that he loves all of his children, black and white, male and female, and, as is especially germane to this story, bond and free (2 Nephi 26:33).'
  - where: 'note 21:17 “God heard”'
    claim: 'Hagar is worthy to receive revelation herself'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
