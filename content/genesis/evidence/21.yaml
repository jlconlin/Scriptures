  # ---------- note 21:19 ----------
  - where: 'note 21:19 “Two sons, two rescues”'
    claim: 'Parallels between Gen. 21 and 22: early rising and something placed on the one sent; an angel from heaven at the last moment; opened/lifted eyes and seeing water/ram'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'Abraham rose up early in the morning and placed bread and water upon Hagar'
  - where: 'note 21:19 “Two sons, two rescues”'
    claim: 'KnoWhy table: Hagar’s eyes opened / Abraham lifts eyes'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'Hagar’s eyes are opened and she sees water'
  - where: 'note 21:19 “Two sons, two rescues”'
    claim: 'Both depart from Beer-sheba; an angel saves both sons at the last moment'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'Both Abraham and Hagar go into the wilderness from Beer-Sheba.'
  - where: 'note 21:19 “Two sons, two rescues”'
    claim: 'An angel saves both sons from death at the last moment'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'An angel saves both sons from death at the last moment by keeping Abraham from killing Isaac and providing water to Ishmael.'
  - where: 'note 21:19 “Two sons, two rescues”'
    claim: 'Both stories name a place for seeing: the well in 16:13–14 and the mount in 22:14'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'Name of the well related to seeing (Genesis 16:13-14) Name of the mount related to seeing (Genesis 22:14)'
  - where: 'note 21:19 “Two sons, two rescues”'
    claim: 'God enabled Hagar to see what she could not see on her own'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'Again we see an emphasis on sight in Hagar’s story, but this time God has enabled her to see what she cannot see on her own.'

  # ---------- note 21:22 ----------
  - where: 'note 21:22 “Abimelech asks for an oath”'
    claim: 'Abimelech was king of Gerar, the king of chapter 20, and made the covenant of 21:22–32'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: '(1) King of Gerar; takes Sarah (Gen. 20:2); warned in a dream, reproves Abraham for denying her, and is healed (20:3–18; 21:22–32).'
  - where: 'note 21:22 “Abimelech asks for an oath”'
    claim: 'The Abimelech of Isaac’s story may be the same person, a tradition preserved in two forms'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: '(1) and (2) are possibly the same person, an early tradition having been preserved in two different forms.'
  - where: 'note 21:22 “Abimelech asks for an oath”'
    claim: 'Abimelech had offered Abraham his land to dwell in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/20?lang=eng'
    quote: 'And Abimelech said, Behold, my land is before thee: dwell where it pleaseth thee.'
  - where: 'note 21:22 “Abimelech asks for an oath”'
    claim: 'The same men say the same thing to Isaac in 26:26–28'
    key: lds-scriptures
