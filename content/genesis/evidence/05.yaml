  # ---------- note 5:29 ----------
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'The Hebrew: noach; yenachamenu, “shall give us comfort”; “and from the toil”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/5-29.htm'
    quote: 'נֹ֖חַ … Noah … יְנַחֲמֵ֤נוּ … shall give us comfort'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'Noah is played on with the related root nwḥ, “rest”'
    key: bowen-two-noahs
    url: 'https://journal.interpreterfoundation.org/this-son-shall-comfort-us-an-onomastic-tale-of-two-noahs/'
    quote: 'interplays the form nōaḥ with forms of the related root nwḥ (to “rest”)'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'Nacham: be sorry, console; Piel comfort'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'be sorry, console, oneself'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'Genesis 5:29 gives the traditional etymology of Noah'
    key: bdb
    url: 'https://biblehub.com/hebrew/5146.htm'
    quote: 'Genesis 5:29 (where traditional etymology)'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'Genesis plays on Noah with nwḥ “rest” and nḥm “comfort, regret”'
    key: bowen-two-noahs
    url: 'https://journal.interpreterfoundation.org/this-son-shall-comfort-us-an-onomastic-tale-of-two-noahs/'
    quote: 'the partly homonymous and partly synonymous but distinct verbal root nḥm (to “regret” or “be sorry”; “console oneself,” or “comfort” someone)'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'The wordplay runs through 6:6–7, 8:4, 8:21 (sweet savour)'
    key: bowen-two-noahs
    url: 'https://journal.interpreterfoundation.org/this-son-shall-comfort-us-an-onomastic-tale-of-two-noahs/'
    quote: 'The wordplay then shifts from nḥm to nwḥ (“rest”), with the ark coming to “rest” (wattānaḥ, Genesis 8:4)'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'The wordplay runs through 6:6–7, 8:4, 8:21 (sweet savour)'
    key: bowen-two-noahs
    url: 'https://journal.interpreterfoundation.org/this-son-shall-comfort-us-an-onomastic-tale-of-two-noahs/'
    quote: 'of the sacrifice that appeased the Lord after the flood (Genesis 8:21)'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'Gen. 6:6 “repented” is nacham'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'Genesis 6:6 HEB: וַיִּנָּ֣חֶם יְהוָ֔ה'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'The Septuagint renders “This one will cause us to cease”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/5.htm'
    quote: 'This one will cause us to cease from our works, and from the toils of our hands'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: '‘Itstsabon, “toil,” is the word of Gen. 3:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/6093.htm'
    quote: 'absolute Genesis 3:17 toil; construct עִצְּבוֺן יָדֵינוּ Genesis 5:29 (both of agriculture)'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'Moses 7:48–49 plays on Noah’s name with “rest”'
    key: bowen-two-noahs
    url: 'https://journal.interpreterfoundation.org/this-son-shall-comfort-us-an-onomastic-tale-of-two-noahs/'
    quote: 'The twofold repetition of “rest” with the name “Noah” (“rest”) in Moses 7:48‒49 constitutes yet another play on the meaning of the name Noah.'
  - where: 'note 5:29 “Noah: rest and comfort”'
    claim: 'The rest comes through Noah’s seed, but not for a very long time'
    key: bowen-two-noahs
    url: 'https://journal.interpreterfoundation.org/this-son-shall-comfort-us-an-onomastic-tale-of-two-noahs/'
    quote: 'Any forthcoming “rest” for the suffering earth will come through Noah’s seed, and in particular through Messiah, his suffering descendant, but not for a very long time.'

