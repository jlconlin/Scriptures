chapter: 44
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'The second year of the famine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'For these two years hath the famine been in the land'
  - where: 'when'
    claim: 'More than twenty years had passed since the brothers sold Joseph'
    key: ot-manual-gen-37-50
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng'
    quote: 'Over twenty years had passed since his brothers had sold Joseph into slavery'
  - where: 'setting'
    claim: 'The brothers sold Joseph to the Ishmeelites, who brought him to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'and sold Joseph to the Ishmeelites for twenty pieces of silver: and they brought Joseph into Egypt'
  - where: 'setting'
    claim: 'Joseph rules Egypt under Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'only in the throne will I be greater than thou'
  - where: 'setting'
    claim: 'On the first visit and again now the brothers did not know Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'And Joseph knew his brethren, but they knew not him.'
  - where: 'setting'
    claim: 'Judah pledged himself for Benjamin before Jacob let Benjamin go'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'I will be surety for him; of my hand shalt thou require him'
  - where: 'setting'
    claim: 'The brothers ate at Joseph’s table the day before'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'And they sat before him, the firstborn according to his birthright, and the youngest according to his youth'
  - where: 'setting'
    claim: 'The Church’s manual reads the sequence as a test'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Joseph seemed to be giving his brothers opportunities to prove that they had changed and would not betray Benjamin as they had betrayed him.'
  - where: 'setting'
    claim: 'Judah proposed selling Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'Come, and let us sell him to the Ishmeelites, and let not our hand be upon him'
  - where: 'setting'
    claim: 'Jacob blesses Judah as the one his brothers shall praise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/49?lang=eng'
    quote: 'Judah, thou art he whom thy brethren shall praise'
  - where: 'setting'
    claim: 'Matthew names Judah in the line of Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'Jacob begat Judas and his brethren; And Judas begat Phares and Zara of Thamar'
  - where: 'setting'
    claim: 'Joseph answers in the next chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'Then Joseph could not refrain himself before all them that stood by him'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The Church’s manual reads the sequence as a test; Benjamin had become the favored son'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Most of these tests focused on young Benjamin, who had become Jacob’s favored son after Joseph was sold into slavery.'
  - where: 'thread'
    claim: 'The sequence is a test: Joseph gave the brothers opportunities to prove they would not betray Benjamin as they had betrayed him'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Joseph seemed to be giving his brothers opportunities to prove that they had changed and would not betray Benjamin as they had betrayed him.'
  - where: 'thread'
    claim: 'In chapter 37 the father’s love for Joseph made the brothers hate him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'And when his brethren saw that their father loved him more than all his brethren, they hated him'
  - where: 'thread'
    claim: 'Jacob’s cry over the coat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'It is my son’s coat; an evil beast hath devoured him; Joseph is without doubt rent in pieces.'
  - where: 'thread'
    claim: 'Genesis 38 as a possible explanation of Judah’s change; the text does not say'
    key: sc-knowhy-841
    url: 'https://scripturecentral.org/knowhy/why-is-the-judah-and-tamar-story-in-the-middle-of-the-joseph-story'
    quote: 'Genesis 38 might help explain the change that is occurring in Judah.'
  - where: 'thread'
    claim: 'The Judah-and-Tamar reading is uncertain'
    key: sc-knowhy-841
    url: 'https://scripturecentral.org/knowhy/why-is-the-judah-and-tamar-story-in-the-middle-of-the-joseph-story'
    quote: 'It is impossible to know for sure how to understand Judah’s actions in the narrative'
  - where: 'thread'
    claim: 'In chapter 38 Judah is made to see his fault'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/38?lang=eng'
    quote: 'She hath been more righteous than I'

  # ---------- note 44:2 “A test aimed at Benjamin” ----------
  - where: 'note 44:2 “A test aimed at Benjamin”'
    claim: 'Placing the cup in Benjamin’s bag was part of Joseph’s test for his brothers'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Part of Joseph’s test for his brothers involved placing his silver cup in Benjamin’s bag.'
  - where: 'note 44:2 “A test aimed at Benjamin”'
    claim: 'The cup was put in Benjamin’s sack so that Joseph could test whether the brothers would abandon Benjamin as they had abandoned Joseph'
    key: gee-clothes-cups
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'so that Joseph can test his brothers and see whether their attitudes toward his mother’s children have changed or whether they will abandon Benjamin to prison or death the way that they had abandoned Joseph'
  - where: 'note 44:2 “A test aimed at Benjamin”'
    claim: 'At the meal Benjamin’s portion was five times the others’ and the brothers were merry with him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'but Benjamin’s mess was five times so much as any of theirs. And they drank, and were merry with him.'
  - where: 'note 44:2 “A test aimed at Benjamin”'
    claim: 'On the first journey the money was put back into the sacks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'Then Joseph commanded to fill their sacks with corn, and to restore every man’s money into his sack'
  - where: 'note 44:2 “A test aimed at Benjamin”'
    claim: 'The brothers had brought back the money found in their sacks the first time'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'every man’s money was in the mouth of his sack, our money in full weight: and we have brought it again in our hand'
  - where: 'note 44:2 “A test aimed at Benjamin”'
    claim: 'The steward went after them when they were out of the city and not yet far off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/44?lang=eng'
    quote: 'And when they were gone out of the city, and not yet far off, Joseph said unto his steward'
  - where: 'note 44:2 “A test aimed at Benjamin”'
    claim: 'Joseph wept when he heard the brothers speak of their guilt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'And he turned himself about from them, and wept; and returned to them again'
  - where: 'note 44:2 “A test aimed at Benjamin”'
    claim: 'At the sight of Benjamin Joseph sought where to weep'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'and he sought where to weep; and he entered into his chamber, and wept there'

  # ---------- note 44:5 “Divining by a cup” ----------
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The Hebrew verb is nachash, “practise divination, divine, observe signs”; at 44:5 by means of a cup, at 44:15 with implied power to learn secret things'
    key: bdb
    url: 'https://biblehub.com/hebrew/5172.htm'
    quote: 'practise divination, divine, observe signs'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The lexicon takes 44:5 as divination by means of a cup, with implied power to learn secret things in 44:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/5172.htm'
    quote: 'practise divination Genesis 44:5 (J; by means of cup, i.e. by hydromancy), with implied power to learn secret things Genesis 44:15'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The same verb is forbidden in Deuteronomy 18:10 and Leviticus 19:26'
    key: bdb
    url: 'https://biblehub.com/hebrew/5172.htm'
    quote: 'forbidden in D and H: Deuteronomy 18:10'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'At Genesis 30:27 the lexicon reads the verb as “observe the signs or omens”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5172.htm'
    quote: 'observe the signs or omens Genesis 30:27'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'Laban’s words in Genesis 30:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/30?lang=eng'
    quote: 'I have learned by experience that the Lord hath blessed me for thy sake'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'Joseph says in verse 15 that such a man as he can certainly divine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/44?lang=eng'
    quote: 'wot ye not that such a man as I can certainly divine?'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The Bible Dictionary defines divination as a superstitious method of discovering future events, frequently condemned in scripture'
    key: bd-divination
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/divination?lang=eng'
    quote: 'Any superstitious method of trying to discover the course of future events.'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The Bible Dictionary says such practices are frequently condemned in scripture'
    key: bd-divination
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/divination?lang=eng'
    quote: 'they are frequently condemned in scripture'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'A third-century A.D. Egyptian papyrus has spells for vessel-divination'
    key: griffith-demotic-magical
    url: 'https://archive.org/download/demoticmagicalpa01grifuoft/demoticmagicalpa01grifuoft_djvu.txt'
    quote: 'THE MS., dating from the third century A.D.'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'In the papyrus a boy’s face is bent down to the vessel'
    key: griffith-demotic-magical
    url: 'https://archive.org/download/demoticmagicalpa01grifuoft/demoticmagicalpa01grifuoft_djvu.txt'
    quote: 'whose face is bent down to this vessel here to-day'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'In the papyrus the boy whose face is bent down is the one the god is asked to protect'
    key: griffith-demotic-magical
    url: 'https://archive.org/download/demoticmagicalpa01grifuoft/demoticmagicalpa01grifuoft_djvu.txt'
    quote: 'do thou protect this boy whose face is bent down'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'In the papyrus the god is asked to cause the boy’s eyes to be opened'
    key: griffith-demotic-magical
    url: 'https://archive.org/download/demoticmagicalpa01grifuoft/demoticmagicalpa01grifuoft_djvu.txt'
    quote: 'cause the eyes of this boy to be opened'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The papyrus calls the procedure vessel-divination'
    key: griffith-demotic-magical
    url: 'https://archive.org/download/demoticmagicalpa01grifuoft/demoticmagicalpa01grifuoft_djvu.txt'
    quote: 'this vessel-divina- tion here to-day'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'Egyptian texts on cup divination date long after Joseph’s time; the practice is thought to be much older'
    key: gee-clothes-cups
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'Egyptian texts describing divination through cups reveal a variety of procedures … and date long after Joseph’s time'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The practices are thought to be much older than the texts'
    key: gee-clothes-cups
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'These practices are thought to be much older than the texts describing them.'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The Church leaves open how or whether Joseph used the cup: righteous purposes, or only a claim in the ruse'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'The Genesis account does not provide enough details to know how Joseph used his silver cup.'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'The cup may have been used for righteous purposes, or Joseph may only have claimed it'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'While the cup may have been used for righteous purposes, it is also possible that Joseph only claimed he used the cup for divination as part of his ruse'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'Scripture also knows instruments used for righteous purposes: the Urim and Thummim, seer stones, rods, and the Liahona'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Objects such as the Urim and Thummim, seer stones, rods, and the Liahona have been used for righteous purposes.'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'A Latter-day Saint reading takes the cup as a means of revelation'
    key: gee-clothes-cups
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'Joseph’s use of the cup extends to revelation—both seeing the future and seeing into the hearts of those around him.'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'Joseph’s earlier words: interpretations belong to God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/40?lang=eng'
    quote: 'Do not interpretations belong to God?'
  - where: 'note 44:5 “Divining by a cup”'
    claim: 'Joseph’s earlier words to Pharaoh: it is not in me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'It is not in me: God shall give Pharaoh an answer of peace.'

  # ---------- note 44:9 “A vow, and a softened sentence” ----------
  - where: 'note 44:9 “A vow, and a softened sentence”'
    claim: 'The brothers propose the harshest possible penalty; compare Jacob’s proposal at 31:32'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'Joseph’s brethren propose the harshest possible penalty, death for the thief, and slavery for all the company. Cf. Jacob’s proposal in'
  - where: 'note 44:9 “A vow, and a softened sentence”'
    claim: 'Jacob’s vow at Laban’s search, made without knowing Rachel had taken the household gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'With whomsoever thou findest thy gods, let him not live'
  - where: 'note 44:9 “A vow, and a softened sentence”'
    claim: 'Jacob did not know that Rachel had stolen the gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'For Jacob knew not that Rachel had stolen them.'
  - where: 'note 44:9 “A vow, and a softened sentence”'
    claim: 'The steward mitigates the severity of the brothers’ terms'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'Joseph’s steward, while accepting the terms, mitigates their severity.'
  - where: 'note 44:9 “A vow, and a softened sentence”'
    claim: 'In verse 17 Joseph holds to the milder sentence the steward proposed'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'Joseph deprecates Judah’s proposal, and insists on the milder sentence already proposed by his steward.'

  # ---------- note 44:14 “They go back together, and Judah leads” ----------
  - where: 'note 44:14 “They go back together, and Judah leads”'
    claim: 'Reuben rent his clothes at the empty pit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'And Reuben returned unto the pit; and, behold, Joseph was not in the pit; and he rent his clothes.'
  - where: 'note 44:14 “They go back together, and Judah leads”'
    claim: 'Jacob rent his clothes over the coat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'And Jacob rent his clothes, and put sackcloth upon his loins, and mourned for his son many days.'
  - where: 'note 44:14 “They go back together, and Judah leads”'
    claim: 'Reuben offered his own two sons as a pledge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'Slay my two sons, if I bring him not to thee: deliver him into my hand, and I will bring him to thee again.'
  - where: 'note 44:14 “They go back together, and Judah leads”'
    claim: 'Jacob refused Reuben’s offer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'My son shall not go down with you'
  - where: 'note 44:14 “They go back together, and Judah leads”'
    claim: 'Judah offered himself as surety and Jacob agreed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'If it must be so now, do this'
  - where: 'note 44:14 “They go back together, and Judah leads”'
    claim: 'The Bible Dictionary cites 44:16 among passages showing Judah a natural leader'
    key: bd-judah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judah?lang=eng'
    quote: 'From these passages we see that he was a natural leader among the sons of Jacob'
  - where: 'note 44:14 “They go back together, and Judah leads”'
    claim: 'The passages the Bible Dictionary lists include 44:16'
    key: bd-judah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judah?lang=eng'
    quote: 'Fourth son of Jacob and Leah (Gen. 29:35; 37:26–27; 43:3, 8; 44:16; 49:8–12'

  # ---------- note 44:16 “What iniquity has God found?” ----------
  - where: 'note 44:16 “What iniquity has God found?”'
    claim: 'One commentary reads Judah as confessing the wrong-doing of himself and his brothers, a Divine recompense for secret guilt'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'Judah confesses the wrong-doing of himself and his brothers'
  - where: 'note 44:16 “What iniquity has God found?”'
    claim: 'So mysterious a misfortune could only be explained as a Divine recompense for secret guilt'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'So mysterious a misfortune could only be explained as a Divine recompense for secret guilt.'
  - where: 'note 44:16 “What iniquity has God found?”'
    claim: 'On the first journey the brothers said they were guilty concerning their brother and that the distress had come upon them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'We are verily guilty concerning our brother, in that we saw the anguish of his soul, when he besought us, and we would not hear; therefore is this distress come upon us.'
  - where: 'note 44:16 “What iniquity has God found?”'
    claim: 'When the money turned up the brothers asked what God had done to them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'What is this that God hath done unto us?'
  # ---------- note 44:17 “God forbid,” and the way home ----------
  - where: 'note 44:17 ““God forbid,” and the way home”'
    claim: 'The Hebrew chalilah is an exclamation, “far be it (for me, thee, etc.)”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2486.htm'
    quote: 'far be it (for me, thee, etc.)'
  - where: 'note 44:17 ““God forbid,” and the way home”'
    claim: 'The lexicon lists Genesis 44:7 and 44:17 under chalilah'
    key: bdb
    url: 'https://biblehub.com/hebrew/2486.htm'
    quote: 'Genesis 44:7 ,17 (all J)'
  - where: 'note 44:17 ““God forbid,” and the way home”'
    claim: 'The Hebrew of 44:7 uses chalilah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'חָלִ֨ילָה֙ לַ/עֲבָדֶ֔י/ךָ מֵ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה'
  - where: 'note 44:17 ““God forbid,” and the way home”'
    claim: 'The Hebrew of 44:17 uses chalilah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'חָלִ֣ילָה לִּ֔י מֵ/עֲשׂ֖וֹת זֹ֑את'
  - where: 'note 44:17 ““God forbid,” and the way home”'
    claim: 'Jacob said that harm to Benjamin would bring his gray hairs down with sorrow to the grave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'then shall ye bring down my gray hairs with sorrow to the grave'
  - where: 'note 44:17 ““God forbid,” and the way home”'
    claim: 'Joseph seemed to be giving his brothers opportunities to prove they had changed and would not betray Benjamin'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Joseph seemed to be giving his brothers opportunities to prove that they had changed and would not betray Benjamin as they had betrayed him.'

  # ---------- note 44:18 “A speech built to move Joseph” ----------
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'Joseph holds Pharaoh’s power'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'Thou shalt be over my house, and according unto thy word shall all my people be ruled'
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'Judah’s opening words are words of deference'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'Judah’s opening words are those of graceful deference'
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'The speech falls into two unequal divisions: recapitulation and offer'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'Judah’s speech falls into two unequal divisions: (1) Genesis 44:18-31 a simple recapitulation of the story, (2) Genesis 44:31-34 his self-sacrificing offer of himself as a substitute for Benjamin.'
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'The points the speech emphasizes'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'The points emphasized are (a) Joseph’s previous demand to see Benjamin, (b) the aged father’s unwillingness to let him go, (c) the certainty that the loss of Benjamin would be Jacob’s death, (d) the offer to stay in Benjamin’s place.'
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'In chapter 42 Joseph called the brothers spies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'And Joseph remembered the dreams which he dreamed of them, and said unto them, Ye are spies'
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'In chapter 42 Joseph took Simeon and bound him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'and took from them Simeon, and bound him before their eyes'
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'The brothers told Joseph “one is not”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'the youngest is this day with our father, and one is not'
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'Judah’s “his brother is dead” adds a most effective touch'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'This allusion to the “dead” brother in addressing Joseph adds a most effective touch to the story.'
  - where: 'note 44:18 “A speech built to move Joseph”'
    claim: 'The protest in verse 22 is not recorded in chapter 42'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/44.htm'
    quote: 'The expostulation here mentioned is not there recorded.'

