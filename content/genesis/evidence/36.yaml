chapter: 36
claims:
  - where: setting
    claim: Genesis records Esau’s generations before dealing with Jacob’s (Gen. 37:2)
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: After the burial of Isaac, the P narrative disposes of the “generations of Esau,” before dealing with “the generations of Jacob” ( Genesis 37:2 ).
  - where: setting
    claim: 1 Chronicles 1:35–54 repeats the lists, with variations and in shortened form
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: 1 Chronicles 1:35-54 repeats, with some variations, and in an abbreviated form, the lists of names
  - where: setting
    claim: "Israel and Edom: kinship and mutual hatred"
    key: bd-edom
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng
    quote: In spite of the kinship there seems to have been great mutual hatred, and wars were of constant occurrence
  - where: setting
    claim: In D&C 1:36 Idumea is used to represent the world
    key: bd-idumea
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/idumea?lang=eng
    quote: In D&C 1:36 Idumea is used to represent the world.
  - where: note 36:1 “Why Genesis gives Esau’s family”
    claim: Edom means “Red”; it is Esau’s name and the name of his descendants and their country in Mount Seir
    key: bd-edom
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng
    quote: Red. Name of Esau ( Gen. 25:30 ); of his descendants ( Gen. 36 ; 1 Chr. 1:35–42 ); of their country in Mount Seir
  - where: thread
    claim: The Hebrew repeats “he is Edom” in verses 1, 8 and 19
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: וְאֵלֶּה תֹּלְדוֹת עֵשָׂו הוּא אֱדוֹם … וַיֵּשֶׁב עֵשָׂו בְּהַר שֵׂעִיר עֵשָׂו הוּא אֱדוֹם … אֵלֶּה בְנֵי עֵשָׂו וְאֵלֶּה אַלּוּפֵיהֶם הוּא אֱדוֹם
  - where: thread
    claim: Verse 43 ends “he is Esau the father of Edom” (Hebrew)
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: הוּא עֵשָׂו אֲבִי אֱדוֹם
  - where: note 36:1 “Why Genesis gives Esau’s family”
    claim: The Bible Dictionary on the kinship and the later hostility
    key: bd-edom
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng
    quote: mention is made of the blood relationship between the Israelites and the Edomites. In spite of the kinship there seems to have been great mutual hatred
  - where: note 36:2 “Esau’s wives have different names”
    claim: Moses used documentary sources; scribes and copyists have left traces on the Pentateuch
    key: bd-pentateuch
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng
    quote: although it is evident that he used several documentary sources from which he compiled the book of Genesis, besides a divine revelation to him. It is also evident that scribes and copyists have left their traces upon the Pentateuch as we have it today
  - where: note 36:2 “Esau’s wives have different names”
    claim: The names of Esau’s wives differ from chapters 26 and 28; one explanation is that Moses used genealogical documents unaltered, and that the names are surnames given at marriage
    key: keil-genesis
    url: https://biblehub.com/commentaries/kad/genesis/36.htm
    quote: This difference arose from the fact, that Moses availed himself of genealogical documents for Esau's family and tribe, and inserted them without alteration. It presents no irreconcilable discrepancy, therefore
  - where: note 36:2 “Esau’s wives have different names”
    claim: Women often received new names at marriage
    key: keil-genesis
    url: https://biblehub.com/commentaries/kad/genesis/36.htm
    quote: as a rule the women received new names when they were married
  - where: note 36:2 “Esau’s wives have different names”
    claim: Adah is the Bashemath of 26:34, and Aholibamah a Horite wife distinct from Judith (Hivite and Horite differ by one letter)
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/36.htm
    quote: In Genesis 26:34 , she is called “Bashemath the daughter of Elon the Hittite,”
  - where: note 36:2 “Esau’s wives have different names”
    claim: Hivi and Hori differ in Hebrew by one stroke, so Aholibamah was probably a Horite and distinct from Judith
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/36.htm
    quote: as Hivi (Hivite) and Hori (Horite) differ in Hebrew only in the length of the top of the middle letter, and as mistakes in the transcription of Biblical names are of constant occurrence, it seems certain that Aholibamah was a Horite
  - where: note 36:2 “Esau’s wives have different names”
    claim: "Another view: two differing versions of the tradition"
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: Thus there are two widely differing versions of P tradition. For the differences are too considerable to have arisen from corruptions in the text.
  - where: note 36:2 “Esau’s wives have different names”
    claim: The Hebrew says “daughter of Anah, daughter of Zibeon,” but verse 24 makes Anah a son of Zibeon; the Septuagint reads “son”
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: “Daughter,” as in Genesis 36:14 . But the reading “son” is found in LXX, Sam. and Syr. Pesh., and is to be preferred; see Genesis 36:24 .
  - where: note 36:2 “Esau’s wives have different names”
    claim: Brenton’s Septuagint reads Anah as “the son of Sebegon [Zibeon], the Evite [Hivite]”
    key: lxx-rahlfs
    url: https://biblehub.com/sep/genesis/36.htm
    quote: Olibema, daughter of Ana the son of Sebegon, the Evite
  - where: note 36:2 “Esau’s wives have different names”
    claim: "BDB: read Horite also in 36:2 for the Hebrew text’s Hivite"
    key: bdb
    url: https://biblehub.com/hebrew/2752.htm
    quote: read ׳ הַחִ also Genesis 36:2 for ᵑ0 הַחִוִּי
  - where: note 36:2 “Esau’s wives have different names”
    claim: Hebrew of verse 2 reads Hivite (hachivvi) and verse 20 Horite (hachori)
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: וְאֶת אָהֳלִיבָמָה בַּת עֲנָה בַּת צִבְעוֹן הַחִוִּי
  - where: note 36:6 “Why Esau left, and when”
    claim: The brothers separated in friendly fashion; Esau was living in Seir when Jacob returned
    key: bd-esau
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/esau?lang=eng
    quote: He was living there on Jacob’s return from Padan-aram ( Gen. 32:3–32 ; 35:1, 29 ). By that time he saw clearly that the covenant blessing and the land of Canaan would not be his, and the brothers separated in friendly fashion.
  - where: note 36:6 “Why Esau left, and when”
    claim: A final amicable encounter at Isaac’s burial; later distrust and war between their descendants
    key: olson-matriarchs
    url: https://rsc.byu.edu/creation-sinai/matriarchs
    quote: A final amicable encounter is recorded when the brothers met to bury their dead father (35:29).
  - where: note 36:6 “Why Esau left, and when”
    claim: Later distrust and war between the descendants, but not in Rebekah’s day
    key: olson-matriarchs
    url: https://rsc.byu.edu/creation-sinai/matriarchs
    quote: In the millennia that followed, distrust and war frequently defined the relationship between Esau and Jacob’s descendants. The same, however, could not be said in Rebekah’s day.
  - where: note 36:6 “Why Esau left, and when”
    claim: "One reading: Esau went to Seir before Jacob’s return, once his family and flocks had grown, knowing Jacob was heir"
    key: keil-genesis
    url: https://biblehub.com/commentaries/kad/genesis/36.htm
    quote: does not imply (in contradiction to Genesis 32:4 ; Genesis 33:14-16 ) that he did not leave the land of Canaan till after Jacob's return. The words may be understood without difficulty as meaning, that after founding a house of his own, when his family and flocks increased, Esau sought a home in Seir
  - where: note 36:7 “The land of their sojournings”
    claim: The Hebrew of 36:7 echoes 13:6 (their possessions were great; to dwell together)
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: כִּי הָיָה רְכוּשָׁם רָב מִשֶּׁבֶת יַחְדָּו … וְלֹא נָשָׂא אֹתָם הָאָרֶץ לָשֶׁבֶת יַחְדָּו כִּי הָיָה רְכוּשָׁם רָב
  - where: note 36:7 “The land of their sojournings”
    claim: The departure is explained by growing wealth, as with Abraham and Lot
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: "The departure of Esau into Seir is here explained as necessitated by the growing wealth of Esau and Jacob in Canaan: cf. the separation of Abraham and Lot in ch. 13."
  - where: note 36:7 “The land of their sojournings”
    claim: megurim (“sojournings”) is always plural and occurs in the phrase “land of sojournings” at Gen. 17:8; 28:4; 36:7; 37:1; Ex. 6:4
    key: bdb
    url: https://biblehub.com/hebrew/4033.htm
    quote: sojourning( -place) , always plural ׳ אֶרֶץ מ Genesis 17:8 ; Genesis 28:4 ; Genesis 36:7 ; Genesis 37:1 ; Exodus 6:4
  - where: note 36:7 “The land of their sojournings”
    claim: Hebrew of 36:7 and 37:1 (eretz megureihem; be-eretz megurei aviv)
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: וְלֹא יָכְלָה אֶרֶץ מְגוּרֵיהֶם לָשֵׂאת אֹתָם … וַיֵּשֶׁב יַעֲקֹב בְּאֶרֶץ מְגוּרֵי אָבִיו בְּאֶרֶץ כְּנָעַן
  - where: note 36:7 “The land of their sojournings”
    claim: Hebrew of 17:8 and 28:4 (eretz megurecha) and 17:8 “everlasting possession” (la-achuzzat olam)
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: אֵת אֶרֶץ מְגֻרֶיךָ אֵת כָּל אֶרֶץ כְּנַעַן לַאֲחֻזַּת עוֹלָם … לְרִשְׁתְּךָ אֶת אֶרֶץ מְגֻרֶיךָ אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  - where: note 36:7 “The land of their sojournings”
    claim: Verse 8 (“Esau dwelt”) and 37:1 (“Jacob dwelt”) use the same Hebrew verb, vayeshev
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: וַיֵּשֶׁב עֵשָׂו בְּהַר שֵׂעִיר … וַיֵּשֶׁב יַעֲקֹב בְּאֶרֶץ מְגוּרֵי אָבִיו
  - where: note 36:7 “The land of their sojournings”
    claim: Verse 43’s “land of their possession” is eretz achuzzatam; achuzzah means land possessed, one’s own land (36:43), and “everlasting possession” (17:8)
    key: bdb
    url: https://biblehub.com/hebrew/272.htm
    quote: with אֶרֶץ , אֲחֻזָּה ׳ א = land possessed, one's own land Genesis 36:43
  - where: note 36:7 “The land of their sojournings”
    claim: "Hebrew of 36:43: eretz achuzzatam"
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: לְמֹשְׁבֹתָם בְּאֶרֶץ אֲחֻזָּתָם הוּא עֵשָׂו אֲבִי אֱדוֹם
  - where: note 36:12 “Amalek, Esau’s grandson”
    claim: The Amalekites were constantly at war with the Hebrews from Moses to Saul and David
    key: gs-amalekites-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/gs/amalekites-old-testament?lang=eng
    quote: They were constantly at war with the Hebrews from the time of Moses ( Ex. 17:8 ) to Saul and David
  - where: note 36:12 “Amalek, Esau’s grandson”
    claim: As the descendant of a concubine, Amalek denotes a subordinate clan
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: Here a grandson of Esau; but, as the descendant from a concubine, he denotes a subordinate clan.
  - where: note 36:15 “Dukes were clan chiefs”
    claim: "Hebrew alluph: chief (tribal) of Edom; from eleph, thousand; chiliarch"
    key: bdb
    url: https://biblehub.com/hebrew/441.htm
    quote: chief, chiliarch (denominative from II. אֶלֶף see Di Genesis 36:15 ) — ׳ א absolute Genesis 36:15 +; plural construct אַלּוּפֵי ( אַלֻּפֵי ) Exodus 15:15 +; suffix אַלּוּפֵיהֶם Genesis 36:19 ,30 — chief (tribal) of Edom Genesis 36:15
  - where: note 36:15 “Dukes were clan chiefs”
    claim: The Septuagint renders the word “chiefs”
    key: lxx-rahlfs
    url: https://biblehub.com/sep/genesis/36.htm
    quote: These are the chiefs of the son of Esau, even the sons of Eliphas, the first-born of Esau
  - where: note 36:15 “Dukes were clan chiefs”
    claim: “Duke” came into the English version from the Latin dux; in Old English it meant leader or chief
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: The word “duke” has been introduced into the English version from the Lat. dux which translates the LXX
  - where: note 36:15 “Dukes were clan chiefs”
    claim: Webster 1828 gives the sense “a chief; a prince” and cites Gen. 36:15
    key: webster-1828
    url: https://webstersdictionary1828.com/Dictionary/duke
    quote: A chief; a prince; as the dukes of Edom. Genesis 36:15 .
  - where: note 36:15 “Dukes were clan chiefs”
    claim: The word is connected with eleph, a thousand or a clan
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: The Heb. allûph is connected with eleph = 1000, or “a clan”; and hence is used for “the chieftain of a clan,” or “a chiliarch,” especially in Edom
  - where: note 36:20 “The Horites, who were there first”
    claim: The original inhabitants were the Horites, probably cave dwellers; the land passed by conquest to Esau’s descendants
    key: bd-edom
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng
    quote: The original inhabitants were “the children of Seir,” or Horites ( Gen. 14:6 ; 36:20 ), and were probably dwellers in holes or caverns. It passed by conquest into the possession of the descendants of Esau
  - where: note 36:20 “The Horites, who were there first”
    claim: The Edomites subjugated the Horites and also fused with them by intermarriage and peaceful settlement
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: They subjugated the natives who were called Horites ( Genesis 14:6 ), and, while largely dispossessing them, also became fused with them by intermarriage and peaceful settlement
  - where: note 36:24 “What Anah found”
    claim: The Hebrew word yemim occurs only here, its meaning is dubious, perhaps hot springs (Vulgate aquae calidae)
    key: bdb
    url: https://biblehub.com/hebrew/3222.htm
    quote: apparently plural meaning dubious; only in הוּא עֲנָה אֲשֶׁר מָצָא אֶתהַֿיֵּמִם בַּמִּדְבָּר Genesis 36:24
  - where: note 36:24 “What Anah found”
    claim: Perhaps hot springs; Latin aquae calidae
    key: bdb
    url: https://biblehub.com/hebrew/3222.htm
    quote: perhaps hot springs , ᵑ9 aquae calidae
  - where: note 36:24 “What Anah found”
    claim: “Mules” is the traditional Jewish rendering; Jerome says the Punic word means hot springs; generally adopted
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/36.htm
    quote: Mules is the traditional rendering of the Jews
  - where: note 36:24 “What Anah found”
    claim: Jerome says the word in Punic means hot springs
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/36.htm
    quote: Jerome, moreover, says that “the word in Punic, a language allied to Hebrew, means hot springs;” and this translation is now generally adopted.
  - where: note 36:24 “What Anah found”
    claim: The Septuagint treats the word as a name (Jamin)
    key: lxx-rahlfs
    url: https://biblehub.com/sep/genesis/36.htm
    quote: this is the Ana who found Jamin in the wilderness
  - where: note 36:24 “What Anah found”
    claim: The Authorized Version and Luther render “mules”; the Septuagint makes it a proper name; the Latin has hot springs
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: The A.V. and Luther render “mules,” and LXX makes it a proper name
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: From the verse one may infer that the writer lived after the foundation of the Israelite monarchy
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: From this verse we infer that the writer lived at a time subsequent to the foundation of the Israelite monarchy.
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: The Edomite kings had different places of residence and were not hereditary kings
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: the Edomite kings, (1) had different places of residence, (2) were not hereditary kings.
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: The last two lists were probably added when the books of Samuel were composed; such additions are not derogatory to inspiration
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/36.htm
    quote: These last two documents, forming Genesis 36:31-43 , were probably added at the time when the Books of Samuel were composed
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: Additions by prophets are not derogatory to the authority or inspiration of scripture
    key: ellicott-genesis
    url: https://biblehub.com/commentaries/ellicott/genesis/36.htm
    quote: there is nothing derogatory to the authority or inspiration of Holy Scripture in believing that the prophets were from time to time moved by the Spirit to add to what had been written.
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: "Another reading: the list is pre-Mosaic and the heading was written with the promise of kings in mind"
    key: keil-genesis
    url: https://biblehub.com/commentaries/kad/genesis/36.htm
    quote: the heading, "These are the kings that reigned in the land of Edom, before there reigned any king over the children of Israel," does not refer to the time when the monarchy was introduced into Israel under Saul, but was written with the promise in mind, that kings should come out of the loins of Jacob
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: On that reading the list is of pre-Mosaic kings, and Edom became a kingdom earlier than Israel
    key: keil-genesis
    url: https://biblehub.com/commentaries/kad/genesis/36.htm
    quote: At any rate the list is evidently a record relating to the Edomitish kings of a pre-Mosaic age.
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: The heading expresses that Edom became a kingdom earlier than Israel
    key: keil-genesis
    url: https://biblehub.com/commentaries/kad/genesis/36.htm
    quote: merely expresses the thought, that Edom became a kingdom at an earlier period than Israel.
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: The kings follow one another but no son succeeds his father; different families and places
    key: keil-genesis
    url: https://biblehub.com/commentaries/kad/genesis/36.htm
    quote: the son never succeeds the father, but they all belong to different families and places
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: Scribes and copyists have left traces on the Pentateuch
    key: bd-pentateuch
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng
    quote: It is also evident that scribes and copyists have left their traces upon the Pentateuch as we have it today
  - where: note 36:31 “Kings of Edom before Israel had a king”
    claim: "Hebrew of 35:11: “kings shall come out of thy loins”"
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml
    quote: וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ
  - where: note 36:33 “From Bozrah to the one who comes in red”
    claim: "Bozrah: a town southeast of the Dead Sea, perhaps the chief Edomite city"
    key: ryle-genesis
    url: https://biblehub.com/commentaries/cambridge/genesis/36.htm
    quote: A town lying 20 miles south-east of the Dead Sea, of great importance in old times—perhaps the chief Edomite city.
  - where: note 36:33 “From Bozrah to the one who comes in red”
    claim: Isaiah 63:1 has “from Edom” and 63:2 “red” (adom), from the same root
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml
    quote: מִי זֶה בָּא מֵאֱדוֹם … מַדּוּעַ אָדֹם לִלְבוּשֶׁךָ
  - where: note 36:33 “From Bozrah to the one who comes in red”
    claim: "BDB: Edom’s etymology is “red” (compare Gen. 25:25)"
    key: bdb
    url: https://biblehub.com/hebrew/123.htm
    quote: where etymology = red
  - where: note 36:33 “From Bozrah to the one who comes in red”
    claim: Edom’s name means red (the stew was red)
    key: bd-edom
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng
    quote: Red. Name of Esau ( Gen. 25:30 )
  - where: note 36:33 “From Bozrah to the one who comes in red”
    claim: D&C 133:46–48 renders Isaiah 63:1–2 as the Lord coming down from heaven, red in His apparel
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng
    quote: Who is this that cometh down from God in heaven with dyed garments; yea, from the regions which are not known, clothed in his glorious apparel, traveling in the greatness of his strength?
  - where: note 36:33 “From Bozrah to the one who comes in red”
    claim: "D&C 133:47–48: “I am he who spake in righteousness… And the Lord shall be red in his apparel”"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng
    quote: I am he who spake in righteousness , mighty to save. 48 And the Lord shall be red in his apparel
  - where: thread
    claim: Edom is named after the red stew (Esau’s name Edom)
    key: bd-edom
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng
    quote: Red. Name of Esau ( Gen. 25:30 )
  - where: thread
    claim: megurim in 17:8, 28:4, 36:7, 37:1
    key: bdb
    url: https://biblehub.com/hebrew/4033.htm
