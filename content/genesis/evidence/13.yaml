chapter: 13
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Abram comes back from Egypt; the story follows straight on from Genesis 12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And Abram journeyed, going on still toward the south.'
  - where: 'setting'
    claim: 'The Book of Abraham’s account of the journey breaks off as Abraham goes down into Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'I, Abraham, concluded to go down into Egypt, to sojourn there, for the famine became very grievous.'
  - where: 'setting'
    claim: 'Lot is the son of Abram’s brother Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'Terah begat Abram, Nahor, and Haran; and Haran begat Lot.'
  - where: 'setting'
    claim: 'In the Book of Abraham the Lord tells Abraham to take Lot with him'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: '“Arise, and take Lot with thee; for I have purposed to take thee away out of Haran'
  - where: 'setting'
    claim: 'Abraham and his family did not wander a barren land; the hill country had fortified towns'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'Thus, Abraham and his progeny would not have wandered in a barren land devoid of settlement as they moved their flocks to different seasonal pastures.'
  - where: 'setting'
    claim: 'Scripture Helps lists Genesis 13:14–18 among the passages of the Abrahamic covenant'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: '(Compare Genesis 12:1–3; 13:14–18; 15:1–21; 17:1–10.)'
  - where: 'setting'
    claim: 'Hebron becomes the family’s burial place'
    key: bd-hebron
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hebron?lang=eng'
    quote: 'It was the burying place of Abraham and his family'
  - where: 'setting'
    claim: 'Abraham came back to Hebron and Mamre often'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'Hebron and the plain of Mamre are recorded as places frequented by Abraham and Jacob'

  - where: 'when'
    claim: 'Abraham lived in tents in Canaan'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'The second half of Abraham’s life, the time he spent in Canaan, was spent dwelling in a tent'
  - where: 'setting'
    claim: 'The hill country around Hebron had fortified towns'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'According to the surveyors, these sites were fortified during this period and located along routes through the hill country and the Shephelah.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Verse 10: Lot “lifted up” (nasa) his eyes and “saw” (ra’ah)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-10.htm'
    quote: 'way·yiś·śā- וַיִּשָּׂא־ And lifted up'
  - where: 'thread'
    claim: 'Verse 14: the LORD tells Abram “lift up” (nasa) his eyes and “look” (ra’ah)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-14.htm'
    quote: 'śā שָׂ֣א Lift up'
  - where: 'thread'
    claim: 'Having given up the more fertile land, Abram receives a promise of even more'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Having given up some of the more fertile parts of the land in a generous gesture to preserve the good feelings in the relationship between Lot and him, Abraham receives a promise of even more land'

  - where: 'thread'
    claim: 'Verse 14: “your eyes … and look”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-14.htm'
    quote: '‘ê·ne·ḵā עֵינֶ֙יךָ֙ your eyes'
  - where: 'thread'
    claim: 'Verse 14: “and look” (ra’ah)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-14.htm'
    quote: 'ū·rə·’êh, וּרְאֵ֔ה and look'
  - where: 'thread'
    claim: 'Verse 10: “his eyes”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-10.htm'
    quote: '‘ê·nāw, עֵינָ֗יו his eyes'

  # ---------- note 13:2 ----------
  - where: 'note 13:2 “Rich enough to need room”'
    claim: '“Very rich” is kabed, literally heavy, weighty'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-2.htm'
    quote: 'kā·ḇêḏ כָּבֵ֣ד'
  - where: 'note 13:2 “Rich enough to need room”'
    claim: '“Very rich” is kabed, literally heavy, weighty'
    key: bdb
    url: 'https://biblehub.com/hebrew/3513.htm'
    quote: 'verb be heavy, weighty, burdensome, honoured'
  - where: 'note 13:2 “Rich enough to need room”'
    claim: 'Keil glosses the word “lit., weighty”'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/13.htm'
    quote: 'lit., weighty) in possessions'
  - where: 'note 13:2 “Rich enough to need room”'
    claim: 'Pharaoh gave Abram livestock and servants for Sarai’s sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And he entreated Abram well for her sake: and he had sheep, and oxen, and he asses, and menservants, and maidservants, and she asses, and camels.'
  - where: 'note 13:2 “Rich enough to need room”'
    claim: 'They had substance gathered in Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'and all our substance that we had gathered, and the souls that we had won in Haran'
  - where: 'note 13:2 “Rich enough to need room”'
    claim: 'Much of their wealth was livestock, which needs pasture'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Because livestock need land to pasture, as their wealth grew, Abraham and Lot were no longer able to live in close proximity.'

  # ---------- note 13:4 ----------
  - where: 'note 13:4 “Back to the first altar”'
    claim: '“The south” is the Negev, the south-country south of Judah'
    key: bdb
    url: 'https://biblehub.com/hebrew/5045.htm'
    quote: 'south-country, Negeb, south'
  - where: 'note 13:4 “Back to the first altar”'
    claim: 'The Negev is the region south of Judah'
    key: bdb
    url: 'https://biblehub.com/hebrew/5045.htm'
    quote: 'specifically the region south of Judah'
  - where: 'note 13:4 “Back to the first altar”'
    claim: 'Verse 1 reads “to the Negev”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-1.htm'
    quote: 'han·neḡ·bāh. הַנֶּֽגְבָּה׃ to the Negev'
  - where: 'note 13:4 “Back to the first altar”'
    claim: 'Before the famine Abraham built an altar between Bethel and Hai and called again on the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'and there I built another altar unto the Lord, and called again upon the name of the Lord.'
  - where: 'note 13:4 “Back to the first altar”'
    claim: 'At earlier altars Abraham made offerings, sacrificed, prayed, and called on the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'I offered sacrifice there in the plains of Moreh, and called on the Lord devoutly, because we had already come into the land of this idolatrous nation.'
  - where: 'note 13:4 “Back to the first altar”'
    claim: 'The altar was a sacred place to confer again with the Lord'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'the altar being a sacred place for him to confer again with the Lord'

  # ---------- note 13:7 ----------
  - where: 'note 13:7 “A land already full”'
    claim: 'The Canaanites were not a single people but a patchwork'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'To assume that the Canaanites were a single group of people would be incorrect'
  - where: 'note 13:7 “A land already full”'
    claim: 'The Perizzites are among the peoples of the land promised to Abraham (Gen. 15:19–21)'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'Genesis 15:19–21 lists “the Kenites, and the Kenizzites, and the Kadmonites, and the Hittites, and the Perizzites'
  - where: 'note 13:7 “A land already full”'
    claim: 'Grazing and water rights belonged to kin groups and their allies; outsiders moved on'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'Grazing and water rights would have been shared between members of the same kinship group or their allies, prompting outside groups to move their flocks elsewhere in search of pastures without tribal claims.'
  - where: 'note 13:7 “A land already full”'
    claim: 'Local and migrating pastoralists came into conflict'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'local pastoralists who were living in villages and migratory pastoralists would have interacted and even come into conflict with each other'
  - where: 'note 13:7 “A land already full”'
    claim: 'The quarrel in verse 7 was over pasture'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'This seems to have been a quarrel over pastureland.'
  - where: 'note 13:7 “A land already full”'
    claim: 'The hill country could not support the herds of Abram, Lot, and the native peoples'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'The hill country of Canaan could not support the numerous flocks, herds, and property of the two men and the native peoples.'

  - where: 'note 13:7 “A land already full”'
    claim: 'A patchwork of peoples and places made up the Canaanites'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'suggests that a patchwork of peoples and places comprised the Canaanites'

  # ---------- note 13:8 ----------
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'Hebrew reads “men, brothers, we are”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-8.htm'
    quote: '’a·ḥîm אַחִ֖ים brothers'
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: '“Brethren” here means kinship in general'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: '“Brethren” in Genesis 13:8 clearly refers to general kinship rather than to a specific relationship as brothers.'
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'Genesis 14:14 calls Lot Abram’s brother'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/14?lang=eng'
    quote: 'And when Abram heard that his brother was taken captive'
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'Verse 11 reads literally “a man from his brother”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-11.htm'
    quote: '’îš אִ֖ישׁ a man'
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'Verse 11 reads literally “a man from his brother”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-11.htm'
    quote: '’ā·ḥîw. אָחִֽיו׃ his brother'
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'The normal offer among kin was to pasture flocks together (a Mari text)'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'The normal offer to friends and family is to pasture the flocks together: “Let my sheep and your sheep pasture together. Pasturage is plentiful here.”'
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'The text cited is a letter from the Mari archives'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Jack M. Sasson, From the Mari Archives: An Anthology of Old Babylonian Letters'
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'An Assyrian text records an agreement dividing wadis and steppe with a stela between'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'An Assyrian text describes just an agreement: “Puli-ila holds wadis while Barḫalanum holds the steppe. Between them is a stela.'
  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'Abraham and Lot followed a pattern known from their day'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Abraham and Lot are following a pattern known from their day.'

  - where: 'note 13:8 “Brothers, though uncle and nephew”'
    claim: 'Hebrew has “men” before “brothers”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-8.htm'
    quote: '’ă·nā·šîm אֲנָשִׁ֥ים men'

  # ---------- note 13:9 ----------
  - where: 'note 13:9 “The elder gives up the choice”'
    claim: 'Lot should have let Abraham choose first; Abraham could have taken his rights'
    key: ot-manual-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-12-17-abraham-father-of-the-faithful?lang=eng'
    quote: 'By all rights Lot should have insisted that Abraham choose first. Lot had been nurtured and protected by Abraham, and Abraham was the patriarch of the clan. Abraham could have taken his rights and given Lot what was left.'
  - where: 'note 13:9 “The elder gives up the choice”'
    claim: 'No resentment in Abraham; he later rescues Lot'
    key: ot-manual-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-12-17-abraham-father-of-the-faithful?lang=eng'
    quote: 'yet there is not a trace of resentment in Abraham. In fact, in the next few chapters is recorded Abraham’s intervention to save Lot’s life.'
  - where: 'note 13:9 “The elder gives up the choice”'
    claim: 'Abram was the elder and the leader, yet left the choice to the younger, trusting the Lord'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/13.htm'
    quote: 'Although Abram was the older, and the leader of the company, he was magnanimous enough to leave the choice to his nephew, who was the younger, in the confident assurance that the Lord would so direct the decision, that His promise would be fulfilled.'
  - where: 'note 13:9 “The elder gives up the choice”'
    claim: 'As the elder Abraham could claim any part; he offers Lot the choice'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Although Abraham is the elder of the two, and so would be able to claim any part of the land for himself, he offers the choice to Lot to pick whatever part he wants'
  - where: 'note 13:9 “The elder gives up the choice”'
    claim: '“Separate thyself” is the verb parad'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-9.htm'
    quote: 'hip·pā·reḏ הִפָּ֥רֶד Separate V‑Nifal‑Imp‑ms'

  # ---------- note 13:10 ----------
  - where: 'note 13:10 “Like Eden, like Egypt”'
    claim: 'The “plain” is the kikkar, the round district of the Jordan valley'
    key: bdb
    url: 'https://biblehub.com/hebrew/3603.htm'
    quote: 'the round (or oval) especially of the Jordan valley'
  - where: 'note 13:10 “Like Eden, like Egypt”'
    claim: '“The garden of the LORD” is Eden, parallel in Isaiah 51:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'he will make her wilderness like Eden, and her desert like the garden of the Lord'
  - where: 'note 13:10 “Like Eden, like Egypt”'
    claim: 'The garden of the LORD is the garden Jehovah planted; Egypt made fertile by the Nile'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/13.htm'
    quote: 'the garden planted by Jehovah in paradise, and "as Egypt," the land rendered so fertile by the overflowing of the Nile'
  - where: 'note 13:10 “Like Eden, like Egypt”'
    claim: 'After its destruction the land is brimstone and salt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'And that the whole land thereof is brimstone, and salt, and burning, that it is not sown, nor beareth, nor any grass groweth therein, like the overthrow of Sodom'
  - where: 'note 13:10 “Like Eden, like Egypt”'
    claim: 'Abraham later sees the smoke of the plain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/19?lang=eng'
    quote: 'and, lo, the smoke of the country went up as the smoke of a furnace.'
  - where: 'note 13:10 “Like Eden, like Egypt”'
    claim: 'The cities of the plain probably stood at the southern end of the Dead Sea'
    key: bd-gomorrah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gomorrah?lang=eng'
    quote: 'The five “cities of the plain,” of which Gomorrah was one, probably stood at the southern end of the Dead Sea.'
  - where: 'note 13:10 “Like Eden, like Egypt”'
    claim: 'Scholarship has not securely located the cities except Zoar'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'biblical scholarship has been unable to connect them to any specific place, with the notable exception of Zoar'
  - where: 'note 13:10 “Like Eden, like Egypt”'
    claim: 'Zoar was also called Bela'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/14?lang=eng'
    quote: 'and the king of Bela, which is Zoar.'

  # ---------- note 13:12 ----------
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'The Hebrew preposition is ‘ad'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/13-12.htm'
    quote: '‘aḏ- עַד־ toward'
  - where: 'note 13:12 “Toward Sodom”'
    claim: '‘Ad means “as far as, even to,” and BDB lists this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/5704.htm'
    quote: 'preposition as far as, even to, up to, until'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'BDB lists Genesis 13:12 under the spatial sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/5704.htm'
    quote: 'Genesis 13:3,12 + often'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'NRSVue: “moved his tent as far as Sodom”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2013&version=NRSVUE'
    quote: 'while Lot settled among the cities of the plain and moved his tent as far as Sodom.'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Newer translations emphasize location rather than orientation'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'Newer translations, however, emphasize the location rather than the orientation of Lot’s tent.'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Lot later dwelt in Sodom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/14?lang=eng'
    quote: 'And they took Lot, Abram’s brother’s son, who dwelt in Sodom, and his goods, and departed.'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Lot sat in the gate of Sodom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/19?lang=eng'
    quote: 'And there came two angels to Sodom at even; and Lot sat in the gate of Sodom'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Elder Perry: Lot’s problems traced to the decision to face Sodom'
    key: perry-deliverance-2012
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-power-of-deliverance?lang=eng'
    quote: 'Most of the problems that Lot later encountered in his life, and there were several, can be traced back to his early decision to position the door of his tent to look upon Sodom.'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Elder Perry: we do not know which way Abraham’s tent faced, but v. 18 hints'
    key: perry-deliverance-2012
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-power-of-deliverance?lang=eng'
    quote: 'We do not know which way Abraham’s tent door faced, but there’s a strong hint in the last verse of the 13th chapter of Genesis.'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Elder Perry believes Abraham’s door faced the altar, as Mosiah 2 tents faced the temple'
    key: perry-deliverance-2012
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-power-of-deliverance?lang=eng'
    quote: 'While I do not know, I personally believe the door of Abraham’s tent faced the altar he built unto the Lord.'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Elder Perry compares King Benjamin’s people facing their tents toward the temple'
    key: perry-deliverance-2012
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-power-of-deliverance?lang=eng'
    quote: 'King Benjamin instructed them to position the doors of their tents facing the temple (see Mosiah 2:1–6).'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'The text is silent about why Lot chose'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'the text is silent as to the reasons for Lot’s selection'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Peter calls Lot just and righteous'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-pet/2?lang=eng'
    quote: 'For that righteous man dwelling among them, in seeing and hearing, vexed his righteous soul from day to day with their unlawful deeds'

  - where: 'note 13:12 “Toward Sodom”'
    claim: 'Elder Perry: Lot pitched his tent facing Sodom'
    key: perry-deliverance-2012
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-power-of-deliverance?lang=eng'
    quote: 'Given a choice of land, Lot chose the plain of Jordan, and he pitched his tent facing Sodom, a city of great wickedness.'
  - where: 'note 13:12 “Toward Sodom”'
    claim: 'The silence may be read as indictment or plain fact'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'this silence may be taken either as an indictment or as a mere statement of fact'

  # ---------- note 13:13 ----------
  - where: 'note 13:13 “Sodom, becoming wicked”'
    claim: 'Joseph Smith’s revision: the men of Sodom “becoming sinners,” the Lord angry with them'
    key: jsp-ot1
