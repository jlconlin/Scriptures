    quote: 'the name of Abram’s wife was Sarai; and the name of Nahor’s wife, Milcah, the daughter of Haran, the father of Milcah, and the father of Iscah.'
  - where: 'note 20:12 “Sister and wife”'
    claim: 'Josephus makes Sarai a daughter of Haran; Abram married his niece'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-1.html'
    quote: 'Haran left a son, Lot : as also Sarai and Milcha his daughters'
  - where: 'note 20:12 “Sister and wife”'
    claim: 'Josephus: these married their nieces'
