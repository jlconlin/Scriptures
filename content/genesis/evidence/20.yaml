    quote: 'Because Abraham and Sarah both descended from Terah, customs of their time would likely have allowed for Abraham to accurately refer to Sarah as his sister.'
  - where: 'note 20:12 “Sister and wife”'
    claim: 'The law later forbade marriage with a half-sister'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
