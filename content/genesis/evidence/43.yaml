    claim: 'Reuben offered his sons’ lives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'Slay my two sons, if I bring him not to thee'
