  - where: 'note 43:32 “Three tables”'
    claim: 'Egyptian deities were represented by cattle; Hebrews slaughtered and ate them; a terrible abomination to Egyptians'
    key: ot-manual-gen-37-50
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng'
    quote: 'Several Egyptian deities were represented by cattle, especially female cattle. Since the Hebrews were herdsmen who slaughtered and ate cattle, regardless of sex, this practice would have been viewed by the Egyptians as a terrible abomination.'
  - where: 'note 43:32 “Three tables”'
    claim: 'Herodotus: cows are sacred to Isis'
    key: herodotus-histories
    url: 'https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0126%3Abook%3D2%3Achapter%3D41'
    quote: 'All Egyptians sacrifice unblemished bulls and bull-calves; they may not sacrifice cows: these are sacred to Isis.'
  - where: 'note 43:32 “Three tables”'
    claim: 'Herodotus: because cows are sacred, no Egyptian will kiss a Greek, use a Greek’s knife, spit, or cauldron, or taste meat cut with a Greek knife'
    key: herodotus-histories
    url: 'https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0126%3Abook%3D2%3Achapter%3D41'
    quote: 'For this reason, no Egyptian man or woman will kiss a Greek man, or use a knife, or a spit, or a cauldron belonging to a Greek, or taste the flesh of an unblemished bull that has been cut up with a Greek knife.'
  - where: 'note 43:32 “Three tables”'
    claim: 'Joseph did not eat with the Egyptians because of his position as Grand Vizier, not because he was a Hebrew or a priest’s son-in-law'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/43.htm'
    quote: 'The natural reason for this is not, as some have supposed, because Joseph was a member of the family of a priest ( Genesis 41:45 ), or even because he was a Hebrew, but on account of his position as the Grand Vizier.'
