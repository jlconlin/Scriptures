chapter: 43
claims:
  - where: 'setting'
    claim: 'Ten of Jacob’s sons went down to Egypt on the first journey (Benjamin stayed home)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'And Joseph’s ten brethren went down to buy corn in Egypt.'
  - where: 'setting'
    claim: 'On the first journey the brothers bowed to Joseph before they knew him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'Joseph’s brethren came, and bowed down themselves before him with their faces to the earth.'
  - where: 'setting'
    claim: 'Joseph called them spies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'Ye are spies; to see the nakedness of the land ye are come.'
  - where: 'setting'
    claim: 'Joseph kept Simeon bound'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'took from them Simeon, and bound him before their eyes'
  - where: 'setting'
    claim: 'Joseph had their money restored into their sacks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'to restore every man’s money into his sack'
  - where: 'setting'
    claim: 'Jacob refused to let Benjamin go'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'My son shall not go down with you'
  - where: 'setting'
    claim: 'Chapter 43 and chapter 44 form one continuous story'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/43.htm'
    quote: 'This and the following chapter form a continuous story'
  - where: 'setting'
    claim: 'Stephen calls the second visit the time Joseph was made known to his brethren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And at the second time Joseph was made known to his brethren'
  - where: 'setting'
    claim: 'In chapters 42–45 Joseph tested his brothers several times before revealing his identity'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'In Genesis 42–45, Joseph tested his brothers several times before revealing his identity.'
  - where: 'when'
    claim: 'The seven years of famine began after the seven plentiful years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'the seven years of dearth began to come'
  - where: 'when'
    claim: 'When Joseph revealed himself the famine had lasted two years, so chapters 42–44 fall within the first two'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'For these two years hath the famine been in the land'
  - where: 'thread'
    claim: 'Jacob’s prayer in verse 14 asks God to give “rachamim” before the man (Hebrew)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ'
  - where: 'thread'
    claim: 'In verse 30 the word for Joseph’s compassion is the same word (rachamav)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'כִּֽי נִכְמְר֤וּ רַחֲמָי/ו֙ אֶל אָחִ֔י/ו'
  - where: 'thread'
    claim: 'BDB lists both Genesis 43:14 and 43:30 under rachamim, “compassion”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7356.htm'
    quote: 'compassion'
  - where: 'thread'
    claim: 'In chapter 37 the brothers could not speak peaceably (le-shalom) to Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'and could not speak peaceably unto him'
  - where: 'thread'
    claim: 'Hebrew of 37:4 has shalom'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וְ/לֹ֥א יָכְל֖וּ דַּבְּר֥/וֹ לְ/שָׁלֹֽם'
  - where: 'thread'
    claim: 'The steward says shalom to the brothers in 43:23'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יֹּאמֶר֩ שָׁל֨וֹם לָ/כֶ֜ם אַל תִּירָ֗אוּ'
  - where: 'thread'
    claim: 'Joseph asks after their shalom and their father’s shalom in 43:27'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יִּשְׁאַ֤ל לָ/הֶם֙ לְ/שָׁל֔וֹם וַ/יֹּ֗אמֶר הֲ/שָׁל֛וֹם אֲבִי/כֶ֥ם הַ/זָּקֵ֖ן'
  - where: 'thread'
    claim: 'In chapter 37 Judah proposed selling Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'let us sell him to the Ishmeelites'
  - where: 'thread'
    claim: 'God is named in verse 14 by Jacob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'And God Almighty give you mercy before the man'
  - where: 'thread'
    claim: 'God is named in verse 23 by the steward'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'your God, and the God of your father, hath given you treasure in your sacks'
  - where: 'thread'
    claim: 'God is named in verse 29 by Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'God be gracious unto thee, my son.'
  - where: 'thread'
    claim: 'The brothers bow to Joseph in verses 26 and 28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/43?lang=eng'
    quote: 'bowed themselves to him to the earth'
  - where: 'thread'
    claim: 'Judah, who suggested that Joseph be sold, is the one who becomes surety for Benjamin'
    key: ot-manual-gen-37-50
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng'
    quote: 'It is significant that Judah, who suggested that Joseph be sold (see Genesis 37:26–27), became the one who was willing to become “the surety” for Benjamin.'
  - where: 'thread'
    claim: 'When the brothers bow in 43:28 the dreams are fulfilled'
    key: ot-manual-gen-37-50
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng'
    quote: 'It had taken over two decades, but the Lord’s revelations were now fulfilled.'
  - where: 'thread'
    claim: 'In Genesis 40–50 God is referred to almost always by the characters, not by the narrator'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/37.htm'
    quote: 'In every other instance in which God is referred to in Genesis 40-50, it is always by the persons concerned'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Reuben offered his two sons as a pledge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'Slay my two sons, if I bring him not to thee: deliver him into my hand, and I will bring him to thee again.'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Jacob refused Reuben'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'My son shall not go down with you; for his brother is dead'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Birth order: Reuben, Simeon, Levi, Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/29?lang=eng'
    quote: 'And she conceived again, and bare a son; and said, Now this time will my husband be joined unto me, because I have born him three sons: therefore was his name called Levi. And she conceived again, and bare a son: and she said, Now will I praise the Lord: therefore she called his name Judah'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Simeon was bound in Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'took from them Simeon, and bound him before their eyes'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Simeon and Levi killed the males of Shechem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/34?lang=eng'
    quote: 'Simeon and Levi, Dinah’s brethren, took each man his sword, and came upon the city boldly, and slew all the males.'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Jacob later cursed the anger of Simeon and Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/49?lang=eng'
    quote: 'Cursed be their anger, for it was fierce; and their wrath, for it was cruel'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Judah spoke because Reuben had been refused and Levi had forfeited his father’s confidence (one commentary’s inference)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/43.htm'
    quote: 'Judah undertook the consultation with his father about Benjamin''s going, because Reuben, the eldest son, had already been refused, and Levi, who followed Reuben and Simeon, had forfeited his father''s confidence through his treachery to the Shechemites'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Judah is described as a natural leader among the sons of Jacob'
    key: bd-judah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judah?lang=eng'
    quote: 'he was a natural leader among the sons of Jacob'
  - where: 'note 43:3 “Why Judah speaks”'
    claim: 'Judah proposed selling Joseph to the Ishmeelites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'Come, and let us sell him to the Ishmeelites, and let not our hand be upon him'
  - where: 'note 43:7 “Did Joseph ask, or did they tell?”'
    claim: 'In chapter 42 the brothers volunteered the information about the family'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'Thy servants are twelve brethren, the sons of one man in the land of Canaan; and, behold, the youngest is this day with our father'
  - where: 'note 43:7 “Did Joseph ask, or did they tell?”'
    claim: 'The questions Joseph would put and the brothers’ frank answers (Ellicott)'
    key: ellicott-genesis
    url: 'https://biblehub.com/commentaries/ellicott/genesis/43.htm'
    quote: 'Joseph, anxious to know about his father and brother, would certainly put numerous questions to them concerning their home and family. And they would answer them fully and frankly, little suspecting who was the questioner'
  - where: 'note 43:7 “Did Joseph ask, or did they tell?”'
    claim: 'The Cambridge Bible calls verse 7 independent of 42:13'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/43.htm'
    quote: 'This verse is evidently independent of Genesis 42:13 (E), where the information was voluntarily given by the brethren in proof of their sincerity.'
  - where: 'note 43:7 “Did Joseph ask, or did they tell?”'
    claim: 'The Cambridge Bible puts Jacob’s silence about Simeon down to the change from E to J'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/43.htm'
    quote: 'That Jacob seems to forget about Simeon, is due to the change from the E to the J narrative.'
  - where: 'note 43:7 “Did Joseph ask, or did they tell?”'
    claim: 'The Cambridge Bible takes the chapter from the J narrative, which the Compiler harmonizes with E'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/43.htm'
    quote: 'This chapter is taken from the J narrative, which the Compiler harmonizes with E'
  - where: 'note 43:7 “Did Joseph ask, or did they tell?”'
    claim: 'Moses used several documentary sources for Genesis'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'The Pentateuch was written by Moses, although it is evident that he used several documentary sources from which he compiled the book of Genesis'
  - where: 'note 43:7 “Did Joseph ask, or did they tell?”'
    claim: 'The account in chapter 43 explains and supplements chapter 42’s; accused of spying, the brothers would naturally give an account of themselves'
    key: ellicott-genesis
    url: 'https://biblehub.com/commentaries/ellicott/genesis/43.htm'
    quote: 'But really this history must be taken as explaining and supplementing the former. Accused of being spies, they would naturally give an account of themselves'
