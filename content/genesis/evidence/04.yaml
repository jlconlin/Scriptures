    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'And Adam and Eve, his wife, called upon the name of the Lord'
  - where: 'note 4:26 “Calling on the name of the LORD”'
