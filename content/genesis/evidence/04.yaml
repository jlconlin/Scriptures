  - where: 'note 4:21 “Lyre and pipe, bronze and iron”'
    claim: 'The arts came from Cain’s line but are not cursed; they became the common property of humanity'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/4.htm'
    quote: 'Hence these inventions have become the common property of humanity'

  # ---------- note 4:23 ----------
  - where: 'note 4:21 “Lyre and pipe, bronze and iron”'
    claim: 'The worldly disposition of the Cainites reached its culminating point in Lamech’s song (one reading)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/4.htm'
    quote: 'In the arts, which owed their origin to Lamech''s sons, this disposition reached its culminating point; and it appears in the form of pride and defiant arrogance in the song'
  - where: 'note 4:23 “Lamech’s song”'
    claim: 'The song is poetry in rhythm and parallel lines'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/4.htm'
    quote: 'In this song, which contains in its rhythm, its strophic arrangement of the thoughts, and its poetic diction, the germ of the later poetry'
  - where: 'note 4:23 “Lamech’s song”'
    claim: 'Lamech threatens to avenge himself many times over what God promised for Cain (one reading)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/4.htm'
    quote: 'for every injury done to my person, I will take ten times more vengeance than that with which God promised to avenge the murder of my ancestor Cain'
  - where: 'note 4:23 “Lamech’s song”'
    claim: 'Moses 5:49–50: Lamech’s covenant with Satan; he slew Irad for the oath’s sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'Wherefore Lamech, being angry, slew him, not like unto Cain, his brother Abel, for the sake of getting gain, but he slew him for the oath’s sake.'
  - where: 'note 4:23 “Lamech’s song”'
    claim: 'Moses 5:53–55: the wives declared it abroad; the works of darkness prevailed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'because that Lamech had spoken the secret unto his wives, and they rebelled against him, and declared these things abroad, and had not compassion'
  - where: 'note 4:23 “Lamech’s song”'
    claim: 'Hebrew “seventy and seven”; the Septuagint “seventy times seven”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-24.htm'
    quote: 'שִׁבְעִ֥ים seventy Number‑cp … וְשִׁבְעָֽה׃ and sevenfold'
  - where: 'note 4:23 “Lamech’s song”'
    claim: 'Hebrew “seventy and seven”; the Septuagint “seventy times seven”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/4.htm'
    quote: 'Because vengeance has been exacted seven times on Cain''s behalf, on Lamech''s it shall be seventy times seven.'

  # ---------- note 4:25 ----------
  - where: 'note 4:25 “Seth, the appointed seed”'
    claim: 'Shet (Seth) explained by shat, “has appointed”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-25.htm'
    quote: 'שֵׁ֑ת Seth N‑proper‑ms … כִּ֣י For Conj … שָֽׁת־ has appointed'
  - where: 'note 4:25 “Seth, the appointed seed”'
    claim: 'BDB: shith, put, set; Gen. 4:25 explains the name Seth'
    key: bdb
    url: 'https://biblehub.com/hebrew/7896.htm'
    quote: 'Genesis 4:25 (J; explanation of name שֵׁת )'
  - where: 'note 4:25 “Seth, the appointed seed”'
    claim: 'Seth was appointed to a priestly role in Abel’s place'
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Seth would become an “appointed” priesthood leader “in place of Abel.”'
  - where: 'note 4:25 “Seth, the appointed seed”'
    claim: '“Another seed” recalls the seed of the woman; Seth restored hope of a line through whom the Messiah would come'
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Seth restored the hope that Adam and Eve could have a righteous posterity who lived the gospel, a lineage through whom the Messiah would come.'
  - where: 'note 4:25 “Seth, the appointed seed”'
    claim: '“Another seed” recalls the seed of the woman; Seth restored hope of a line through whom the Messiah would come'
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'it recalls the “seed” of Eve from the Fall narrative who would “bruise” or crush the serpent’s head (Moses 4:21)'
  - where: 'note 4:25 “Seth, the appointed seed”'
    claim: 'Moses 6:3: God revealed himself to Seth, who offered an acceptable sacrifice like Abel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'And God revealed himself unto Seth, and he rebelled not, but offered an acceptable sacrifice, like unto his brother Abel.'

  # ---------- note 4:26 ----------
