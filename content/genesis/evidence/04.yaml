chapter: 4
claims:
  # ---------- setting ----------
  - where: 'setting'
    claim: 'Moses 5:16 is where the Book of Moses account begins to line up with Genesis 4:1'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'we find that Moses 5:16 is where the account begins to align with Genesis 4:1'
  - where: 'setting'
    claim: 'Moses 5:1–15 (sacrifice as a similitude of the Only Begotten; the gospel taught; Satan among the children) comes before Genesis 4:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth.'
  - where: 'setting'
    claim: 'The Old Testament never refers to the Cain and Abel story again explicitly'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'it is never referenced or alluded to again explicitly anywhere in the Old Testament'
  - where: 'setting'
    claim: 'Genesis 4 lists many firsts: first son, first offering, first murder, first city'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'the first mention of offerings or sacrifice in the Hebrew Bible (4:3)'
  - where: 'setting'
    claim: 'Genesis 4 lists many firsts: first son, first offering, first murder, first city'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'the first murder in human history (4:8)'
  - where: 'setting'
    claim: 'Genesis 4 lists many firsts: first son, first offering, first murder, first city'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'the first construction of a city (4:17)'
  - where: 'setting'
    claim: 'The story is told in seventeen verses'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'presents the story of Cain and Abel in seventeen succinct verses'
  - where: 'setting'
    claim: 'The Book of Moses is part of the Joseph Smith Translation'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'The Book of Moses is part of the Joseph Smith Translation of the Bible.'
  - where: 'setting'
    claim: 'Moses 6:2–4 parallels Genesis 4:25–26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'God hath appointed me another seed, instead of Abel, whom Cain slew.'
  - where: 'setting'
    claim: 'Moses 6:2–4 parallels Genesis 4:25–26'
    key: schade-bowen-moses-6
    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Regarding Genesis 4:25–26, the biblical text parallel to Moses 6:3–4'
  - where: 'setting'
    claim: 'Abel was the first righteous man to be killed (reading of Matt. 23:35)'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'Abel being the first whose life was taken in innocence and righteousness.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Hebrew ’ach, “brother,” occurs seven times in verses 2–11 (vv. 2; 8 twice; 9 twice; 10; 11)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי'
  - where: 'thread'
    claim: 'Verse 8 has “Abel his brother” twice'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-8.htm'
    quote: 'הֶ֥בֶל Abel N‑proper‑ms … אָחִ֖יו his brother'
  - where: 'thread'
    claim: 'The words of 4:7 (desire, rule over) are the words of 3:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/8669.htm'
    quote: 'of woman for man, אֶלאִֿישֵׁח תְּשׁוּקָתֵח Genesis 3:16 (J); of man for woman, אֲנִי לְדוֺדִי וְאֵלַי תְּשׁוּקָתוֺ Cant 7:11; of beast to devour, figurative אֵלֶיךָ תְּשׁוּקָתוֺ Genesis 4:7 (J).'
  - where: 'thread'
    claim: 'Genesis 4 does not name Satan; the Book of Moses does'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'despite the fact that the text of Genesis does not specifically reference Satan in the story of Cain and Abel'
  - where: 'thread'
    claim: 'The posterity of Adam and Eve became divided as some accepted the gospel and others did not'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'The posterity of Adam and Eve became divided as some accepted the gospel and others did not.'
  - where: 'thread'
    claim: 'Seth’s line: these men began to call upon the name of the Lord, and the Lord blessed them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'And then began these men to call upon the name of the Lord, and the Lord blessed them'

  # ---------- note 4:1 ----------
  - where: 'note 4:1 “A son gotten from the LORD”'
    claim: 'Qaniti, “I have acquired,” is from qanah'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-1.htm'
    quote: '7069 [e] qā·nî·ṯî קָנִ֥יתִי I have acquired V‑Qal‑Perf‑1cs'
  - where: 'note 4:1 “A son gotten from the LORD”'
    claim: 'BDB lists Gen. 4:1 under “acquire,” with ’et-YHWH meaning “with the help of” the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/7069.htm'
    quote: 'c. of Eve, acquiring קַיִן , ׳ אֶתיֿ (i.e. with the help of ), Genesis 4:1 (J).'
  - where: 'note 4:1 “A son gotten from the LORD”'
    claim: 'BDB gives Eve’s explanation of the name Cain as from qanah, “acquire”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7014.htm'
    quote: 'eldest son of Adam and Eve (explanation Genesis 4:1 from קָנָה acquire'
  - where: 'note 4:1 “A son gotten from the LORD”'
    claim: 'Eve’s words express thanksgiving for God’s providence in giving a son'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'This last phrase conveys thanksgiving for God’s providence in providing a son.'
  - where: 'note 4:1 “A son gotten from the LORD”'
    claim: 'The “knowing” of Adam and Eve is contrasted with Cain, who will not know God, that is, keep a covenant relationship'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'The sacred union expressed with “knowing” each other in intimacy to create God-given life is now contrasted with Cain, who does not know God'
  - where: 'note 4:1 “A son gotten from the LORD”'
    claim: 'The Book of Moses gives Eve’s hope and Cain’s refusal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'I have gotten a man from the Lord; wherefore he may not reject his words. But behold, Cain hearkened not, saying: Who is the Lord that I should know him?'

  # ---------- note 4:3 ----------
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Neither Genesis nor Moses says why Abel’s offering was accepted and Cain’s was not'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'Neither the Genesis nor the Moses account specifically states why Abel’s offering was accepted by the Lord but Cain’s was not.'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Minchah, “gift, offering,” used of offerings to God whether grain or animals, Gen. 4:3–5'
    key: bdb
    url: 'https://biblehub.com/hebrew/4503.htm'
    quote: '3 offering made to God, of any kind, whether grain or animals Genesis 4:3 ,4,5'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Satan commanded Cain to make the offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'And Cain loved Satan more than God. And Satan commanded him, saying: Make an offering unto the Lord.'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Cain followed Satan’s instructions and his intentions were not pure (the Church’s current reading)'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'Cain followed Satan’s instructions and his intentions were not pure.'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Cain had rejected the Lord before the Lord rejected his sacrifice'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'the Book of Moses text shows that Cain had rejected the Lord—his words and his ways—before the Lord rejected Cain’s sacrifice.'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Adam and Eve were commanded to offer the firstlings of their flocks; Adam himself tilled the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'should offer the firstlings of their flocks, for an offering unto the Lord'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Farming itself is not being demeaned; Adam began to till the earth'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'This observation is not intended to demean the occupation of farming'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Possible that Cain did not offer the firstfruits, or that an animal sacrifice was then required'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'It is possible that Cain did not offer the firstfruits … It is also possible that at that point in time, the Lord’s requirement was for Cain to offer an animal sacrifice'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Adam and Eve were commanded to offer both the firstlings of the flock and the firstfruits of the field (the work Scripture Helps cites for this)'
    key: ballard-sacrifice
    url: 'https://www.churchofjesuschrist.org/study/liahona/2002/03/the-law-of-sacrifice?lang=eng'
    quote: 'Adam and Eve were taught the law of sacrifice and were commanded to practice it by giving offerings. These included two emblems: the firstlings of the flock and the firstfruits of the field.'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'Produce offerings were acceptable at other times, but for this offering the Lord required the shedding of blood (the work Scripture Helps cites for this possibility)'
    key: ellertson-ritual
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/sanctifying-power-true-ritual-worship'
    quote: 'Apparently, offerings of the fruit of the ground were acceptable at other times, especially under Mosaic law; however, for this particular offering, the Lord required the shedding of blood.'
  - where: 'note 4:3 “What was wrong with Cain’s offering?”'
    claim: 'In later law, fruit offerings came only after the expiatory sacrifice; Cain was removing Christ from the offering'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'Cain was thus removing Christ from the equation. Fruits could be offered in later biblical law, but it was only after the expiatory sacrifice used in similitude of the Son of God.'

  # ---------- note 4:4 ----------
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'Abel brought “from the firstborn” of his flock and “their fat”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-4.htm'
    quote: 'mib·bə·ḵō·rō·wṯ מִבְּכֹר֥וֹת from the firstborn'
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'Firstlings were the most valuable; the fat was the prized portion of a sacrifice'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'Later sections in the Bible tell us that firstlings of the flock were the most valuable and important.'
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'Firstlings were the most valuable; the fat was the prized portion of a sacrifice'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'The fat of sacrificial animals is also attested as the highly prized portion of the sacrifice'
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'Joseph Smith and other leaders in Kirtland wrote the 1834 letter'
    key: jsp-letter-1834-03
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-circa-march-1834/2'
    quote: 'JS and other … leaders in Kirtland prepared this installment for publication'
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'Abel offered by faith in the atonement; Cain could not offer in faith'
    key: jsp-letter-1834-03
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-circa-march-1834/2'
    quote: 'By faith in this atonement or plan of redemption, Abel offered to God a sacrifice that was accepted, which was the firstlings of the flock. Cain offered of the fruit of the ground, and was not accepted, because he could not do it in faith'
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'Sacrifice was instituted as a type of the great Sacrifice'
    key: jsp-letter-1834-03
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-circa-march-1834/2'
    quote: 'as the sacrifice was instituted for a type, by which man was to discern the great Sacrifice which God had prepared'
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'Abel was taught more of the plan than the Bible records'
    key: jsp-letter-1834-03
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-circa-march-1834/2'
    quote: 'it is evident in our minds, that he was instructed more fully into the plan than what the bible speaks'
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'The angel’s explanation of sacrifice to Adam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'Why dost thou offer sacrifices unto the Lord? And Adam said unto him: I know not, save the Lord commanded me.'
  - where: 'note 4:4 “By faith Abel offered”'
    claim: 'Joseph Smith taught that Cain did not exercise faith in the redemption of Jesus Christ (the Church’s current wording)'
    key: scripture-helps-gen-3-4
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/03-genesis-3-4-moses-4-5?lang=eng'
    quote: 'The Prophet Joseph Smith taught that Cain in his offering did not exercise faith in the redemption of Jesus Christ.'

  # ---------- note 4:7 (accepted) ----------
  - where: 'note 4:7 “The Lord pleads with Cain”'
    claim: 'Se’et, “lifting up,” in 4:7'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-7.htm'
    quote: 'שְׂאֵ֔ת … elevation V‑Qal‑Inf'
  - where: 'note 4:7 “The Lord pleads with Cain”'
    claim: 'BDB calls se’et in 4:7 dubious and lists acceptance, forgiveness, uplifting of countenance'
    key: bdb
    url: 'https://biblehub.com/hebrew/7613.htm'
    quote: '4 Genesis 4:7 is dubious; — is there not acceptance ? ᵑ6 ᵑ9 and others; forgiveness ᵑ7 Holz and others; uplifting of countenance, cheerfulness'
  - where: 'note 4:7 “The Lord pleads with Cain”'
    claim: 'Verse 5: “his face fell”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-5.htm'
    quote: 'וַֽיִּפְּל֖וּ and fell Conj‑w ¦ V‑Qal‑ConsecImperf‑3mp … פָּנָֽיו׃ his face'
  - where: 'note 4:7 “The Lord pleads with Cain”'
    claim: 'Satan was pleased at the rejection; Moses 5:23 as a promise; Cain afterward listened no more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'Now Satan knew this, and it pleased him.'
  - where: 'note 4:7 “The Lord pleads with Cain”'
    claim: 'Satan was pleased at the rejection; Moses 5:23 as a promise; Cain afterward listened no more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'And Cain was wroth, and listened not any more to the voice of the Lord, neither to Abel, his brother, who walked in holiness before the Lord.'
  - where: 'note 4:7 “The Lord pleads with Cain”'
    claim: 'Even after the offering the Lord did not reject Cain but warned him'
    key: ot-manual-gen-4-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-4-11-the-patriarchs?lang=eng'
    quote: 'Even after the unacceptable offering, the Lord did not reject Cain, but gave him specific warning about the dangerous path he was walking.'
  - where: 'note 4:7 “The Lord pleads with Cain”'
    claim: 'God tells Cain that he himself, not only his offering, will be accepted'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'God is telling Cain that he (not just his offering) will be accepted if he does what is right'

  # ---------- note 4:7 (sin at the door) ----------
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'Robets, a masculine participle, “crouching”; chatta’t, “sin,” is feminine'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-7.htm'
    quote: 'חַטָּ֣את sin N‑fs … רֹבֵ֑ץ is crouching V‑Qal‑Prtcpl‑ms'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'Rabats is used of animals lying down, including a lion in its lair'
    key: bdb
    url: 'https://biblehub.com/hebrew/7257.htm'
    quote: 'of wild beasts, lion, in lair, Genesis 49:9'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'The phrase describes crouching ready to pounce'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'the Hebrew expression for “sin lieth at the door” describes “crouching” in a ready-to-pounce posture, not a passive lying down.'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'Mesopotamian rabisu demons lurked outside doors'
    key: sc-knowhy-834
    url: 'https://scripturecentral.org/knowhy/why-does-the-lord-tell-cain-that-sin-lieth-at-the-door'
    quote: 'In ancient Mesopotamia, demons called rabisu were thought to lurk outside a person’s door, waiting to attack the person when he or she came out of their house'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'Scholars do not know whom “his” refers to; sin is feminine, the pronoun masculine'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'Scholars of the Bible do not know to whom the personal pronoun his is referring.'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'Scholars do not know whom “his” refers to; sin is feminine, the pronoun masculine'
    key: schade-bowen-moses-5
    url: 'https://rsc.byu.edu/book-moses/moses-5-cains-offering-curse'
    quote: 'the word sin in Hebrew is feminine and thus does not match the gender of the personal pronoun here, which is masculine.'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'BDB lists teshuqah in 4:7 as of a beast to devour, and in 3:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/8669.htm'
    quote: 'of beast to devour, figurative אֵלֶיךָ תְּשׁוּקָתוֺ Genesis 4:7 (J).'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: '“Rule over” is mashal in both 4:7 and 3:16'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/4-7.htm'
    quote: '4910 [e] tim·šāl- תִּמְשָׁל־ must rule'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: '“Rule over” is mashal in both 4:7 and 3:16'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/3-16.htm'
    quote: '4910 [e] yim·šāl- יִמְשָׁל־ will rule'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'Moses 5:23–24 names Satan as the one who desires Cain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'sin lieth at the door, and Satan desireth to have thee; and except thou shalt hearken unto my commandments, I will deliver thee up, and it shall be unto thee according to his desire. And thou shalt rule over him;'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'Satan is waiting to pounce on Cain and have him unless he hearkens'
    key: sc-knowhy-834
    url: 'https://scripturecentral.org/knowhy/why-does-the-lord-tell-cain-that-sin-lieth-at-the-door'
    quote: 'Satan, an embodiment of sin, is waiting outside the door so he can pounce on Cain and thus “have” him unless Cain hearkens unto the Lord’s commandments'
  - where: 'note 4:7 “Sin crouching at the door”'
    claim: 'Cain will rule over Satan, as one with a body over one without'
    key: skinner-cain-abel
    url: 'https://rsc.byu.edu/creation-sinai/cain-abel-genesis-4-moses-5'
    quote: 'ironically Cain will come to rule over Satan, demonstrating that a person possessing a physical body holds power over one who does not possess a body'

