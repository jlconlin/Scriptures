    url: 'https://rsc.byu.edu/book-moses/moses-6-enoch'
    quote: 'Moses thus witnessed the priestly duties of the family of Adam and Eve continuing through Seth.'
  - where: 'note 4:26 “Calling on the name of the LORD”'
