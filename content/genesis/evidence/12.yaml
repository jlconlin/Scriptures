    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'Abram and Sarai are tested in Pharaoh’s court.'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'Sarai was Abraham’s half-sister'
