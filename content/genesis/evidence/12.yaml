    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/12.htm'
    quote: 'Probably we have here an example of one of the sacred trees under which, in primitive times, a priest, or seer, gave oracles and returned answers to devout questioners.'
  - where: 'note 12:6 “The oak of Moreh”'
    claim: 'This may be the tree mentioned later at Shechem (Gen. 35:4; Josh. 24:26)'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/12.htm'
    quote: 'If so, this terebinth may have been the famous tree mentioned elsewhere in connexion with Shechem: cf. Genesis 35:4 , Joshua 24:26'
  - where: 'note 12:6 “The oak of Moreh”'
    claim: 'Shechem lay in the central hill country at the foot of Mount Gerizim'
