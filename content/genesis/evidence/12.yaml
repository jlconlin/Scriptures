    url: 'https://biblehub.com/commentaries/cambridge/genesis/12.htm'
    quote: 'In all probability Moreh is not a proper name, but the participle of the verb meaning to “teach” or “instruct,” whence comes also the substantive Torah, “law” or “instruction.”'
  - where: 'note 12:6 “The oak of Moreh”'
