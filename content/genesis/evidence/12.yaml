    quote: 'Abraham and Sarah obeyed the Lord’s counsel and were spared from a dangerous situation. Because Abraham and Sarah both descended from Terah, customs of their time would likely have allowed for Abraham to accurately refer to Sarah as his sister.'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'The chapter heading calls it a test in Pharaoh’s court'
