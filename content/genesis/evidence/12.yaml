    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/20?lang=eng'
    quote: 'And yet indeed she is my sister; she is the daughter of my father, but not the daughter of my mother; and she became my wife.'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'Hebrew, like other ancient Semitic languages, does not separate siblings from their offspring; Lot is called Abram’s brother'
    key: strathearn-wife-sister
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/wife-sister-experience'
    quote: 'This state is reflected in ancient Semitic languages, including biblical Hebrew, in which there is no definite linguistic separation between siblings and their offspring.'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'Lot is twice called Abram’s brother'
    key: strathearn-wife-sister
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/wife-sister-experience'
    quote: 'twice he refers to Lot as his brother (see Genesis 14:14, 16) even though, by western standards, he is clearly Abraham’s “nephew”'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'Egyptian had two words for wife: hmt only “wife”; snt principally “sister” but also “wife”; Abraham used an ambiguous term and said nothing false'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'In the Egyptian of Abraham’s day, there are two words for wife . One ( ḥmt ) means only “wife”; [79] the other ( snt ) means principally “sister” [80] but can also mean “wife.”'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'Abraham used an ambiguous term and said nothing false'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'So by using an ambiguous term, Abraham was not saying something that was false.'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'In Egyptian “sister” was a term of affection for a wife'
    key: smoot-sarai
    url: 'https://byustudies.byu.edu/article/did-abraham-lie-about-his-wife-sarai'
    quote: 'a wife was often called the ‘sister’ ( snt ) of her husband, but not because they had the same parents: instead, the term was one of affection'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'The ambiguity would have worked especially well against the Egyptians'
    key: smoot-sarai
    url: 'https://byustudies.byu.edu/article/did-abraham-lie-about-his-wife-sarai'
    quote: 'Abraham could be viewed as taking advantage of an ambiguity that would have worked especially well in thwarting the murderous intentions of the Egyptians.'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'Egyptian kings had the reputation of seizing any woman they wanted'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Egyptian kings, at all time periods from the Old Kingdom through the Roman period, at least had the reputation of being able to seize and marry any woman whom they desired.'
  - where: 'note 12:13 “Did Abram lie?”'
    claim: 'The Genesis Apocryphon has Abram warned in a dream; it harmonizes with the Book of Abraham'
