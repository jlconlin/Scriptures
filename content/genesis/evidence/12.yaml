    url: 'https://biblehub.com/commentaries/cambridge/genesis/12.htm'
    quote: 'one of the most ancient and important towns in the central hill country of Palestine, at the foot of Mt Gerizim'
  - where: 'note 12:6 “The oak of Moreh”'
    claim: 'Jacob buried foreign gods under the oak by Shechem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'and Jacob hid them under the oak which was by Shechem.'
  - where: 'note 12:6 “The oak of Moreh”'
    claim: 'Joshua set up a stone under the oak by the sanctuary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord.'

