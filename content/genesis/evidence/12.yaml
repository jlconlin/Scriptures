chapter: 12
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'Abram was seventy-five when he left Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'Abram was seventy and five years old when he departed out of Haran.'
  - where: 'when'
    claim: 'The Book of Abraham gives sixty-two'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'I, Abraham, was sixty and two years old when I departed out of Haran.'
  - where: 'when'
    claim: 'Abraham’s life is usually dated between about 2100 and 1750 B.C.'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Abraham’s life is usually dated to either the Middle Bronze Age I (MB I; approximately 2100–2000 BC) or the Middle Bronze Age II (MB II; approximately 2000–1750 BC)'
  - where: 'when'
    claim: 'A Latter-day Saint reading of the Book of Abraham places Abraham 1 in the 1800s B.C.'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'This gives a maximal time of the Egyptian Middle Kingdom empire from about 1871 to 1788 BC.'
  - where: 'when'
    claim: 'A Latter-day Saint reading of the Book of Abraham places Abraham 1 in the 1800s B.C.'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Abraham chapter 1 will have had to have taken place at this time'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'From chapter 12 to 25:18 Abraham is the chief figure, after Babel and the line of Shem'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'the line of Shem only pursued ( 11:10–32 ) as far as Terah and Abram, where the genealogical table breaks off; (c) Abraham is now the chief figure ( 12:1–25:18 ).'
  - where: 'setting'
    claim: 'Terah brought the family from Ur to Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there.'
  - where: 'setting'
    claim: 'The Book of Abraham tells the story in Abraham’s own voice, including the Lord’s words in Ur and in Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Now the Lord had said unto me: Abraham, get thee out of thy country, and from thy kindred, and from thy father’s house, unto a land that I will show thee.'
  - where: 'setting'
    claim: 'The Book of Abraham tells of his family’s idolatry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'my father turned again unto his idolatry'
  - where: 'setting'
    claim: 'Abraham was delivered from an altar in Ur'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'And as they lifted up their hands upon me, that they might offer me up and take away my life, behold, I lifted up my voice unto the Lord my God, and the Lord hearkened and heard'
  - where: 'setting'
    claim: 'Genesis 12:1–3 promises the covenant; chapter 15 formally initiates it, 17 expands it, 22 confirms it'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'In Genesis 12:1–3, God promises a covenantal relationship with Abraham after he leaves Ur and travels to the land of Canaan. He formally initiates that relationship in Genesis 15'
  - where: 'setting'
    claim: 'Genesis 12:1–3 promises the covenant; chapter 15 formally initiates it, 17 expands it, 22 confirms it'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'In Genesis 17, he expands on a second promise provided in Genesis 12, a promise that Abraham’s royal seed would bless all nations of the earth. That promise is formally confirmed in Genesis 22.'
  - where: 'setting'
    claim: 'Isaiah, Hebrews and Paul return to the call (Isa. 51:2; Heb. 11:8; Gal. 3:8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'Look unto Abraham your father, and unto Sarah that bare you: for I called him alone, and blessed him, and increased him.'

  # ---------- thread ----------
  - where: 'thread'
    claim: '“I will shew thee” in verse 1 is the causative (Hiphil) of ra’ah, “see”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-1.htm'
    quote: 'אַרְאֶֽךָּ׃ I will show you V‑Hifil‑Imperf‑1cs ¦ 2ms'
  - where: 'thread'
    claim: 'The Hiphil of ra’ah means to cause one to see, to show'
    key: bdb
    url: 'https://biblehub.com/hebrew/7200.htm'
    quote: 'a. cause one to see something, shew'
  - where: 'thread'
    claim: '“Appeared” in verse 7 is the Niphal of ra’ah, used twice in the verse of God appearing'
    key: bdb
    url: 'https://biblehub.com/hebrew/7200.htm'
    quote: '1 appear , especially a. of ׳ י (God): with אֶל person Genesis 12:7 (twice in verse)'
  - where: 'thread'
    claim: '“Appeared” in verse 7 is the Niphal of ra’ah'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-7.htm'
    quote: 'וַיֵּרָ֤א'
  - where: 'thread'
    claim: 'The Egyptians “shall see” Sarai in verse 12 with the same verb'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-12.htm'
    quote: 'יִרְא֤וּ see V‑Qal‑Imperf‑3mp'
  - where: 'thread'
    claim: 'The Egyptians “beheld” Sarai in verse 14 with the same verb'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-14.htm'
    quote: 'וַיִּרְא֤וּ that saw Conj‑w ¦ V‑Qal‑ConsecImperf‑3mp'
  - where: 'thread'
    claim: 'Pharaoh’s princes “saw” her in verse 15 with the same verb'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-15.htm'
    quote: 'וַיִּרְא֤וּ'

  # ---------- section plain ----------
  - where: 'section 2 plain'
    claim: 'The “plain of Moreh” is the oak (or terebinth) of Moreh'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2012&version=NRSVUE'
    quote: 'Abram passed through the land to the place at Shechem, to the oak'
  - where: 'section 2 plain'
    claim: '“Toward the south” is toward the Negev'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-9.htm'
    quote: 'הַנֶּֽגְבָּה׃פ toward the Negev'
  - where: 'section 2 plain'
    claim: 'The Negeb is the south country, the region south of Judah'
    key: bdb
    url: 'https://biblehub.com/hebrew/5045.htm'
    quote: 'south-country , i.e. a. specifically the region south of Judah'
  - where: 'section 3 plain'
    claim: 'Verse 19 reads “and I took her to me for a wife”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-19.htm'
    quote: 'וָאֶקַּ֥ח and I took Conj‑w ¦ V‑Qal‑ConsecImperf‑1cs'

  # ---------- note 12:1 “When did the Lord call Abram?” ----------
  - where: 'note 12:1 “When did the Lord call Abram?”'
    claim: 'The Hebrew has the ordinary narrative form wayyomer, “and he said”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-1.htm'
    quote: 'וַיֹּ֤אמֶר 1 And had said 1 Conj‑w ¦ V‑Qal‑ConsecImperf‑3ms'
  - where: 'note 12:1 “When did the Lord call Abram?”'
    claim: 'The KJV’s “had said” was probably adopted because of Stephen’s words in Acts 7:2'
    key: ellicott-genesis
    url: 'https://biblehub.com/commentaries/ellicott/genesis/12.htm'
    quote: 'Heb., And Jehovah said unto Abram.'
  - where: 'note 12:1 “When did the Lord call Abram?”'
    claim: 'The KJV’s “had said” was probably adopted because of Stephen’s words in Acts 7:2'
    key: ellicott-genesis
    url: 'https://biblehub.com/commentaries/ellicott/genesis/12.htm'
    quote: 'The rendering “had said” was doubtless adopted because of St. Stephen’s words'
  - where: 'note 12:1 “When did the Lord call Abram?”'
    claim: 'Stephen puts the call in Mesopotamia before Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'The God of glory appeared unto our father Abraham, when he was in Mesopotamia, before he dwelt in Charran,'
  - where: 'note 12:1 “When did the Lord call Abram?”'
    claim: 'The Book of Abraham sets the words of Genesis 12:1 in Ur'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Therefore I left the land of Ur, of the Chaldees, to go into the land of Canaan'
  - where: 'note 12:1 “When did the Lord call Abram?”'
    claim: 'The idolatrous priests tried to offer Abraham on an altar and the Lord delivered him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'And as they lifted up their hands upon me, that they might offer me up and take away my life, behold, I lifted up my voice unto the Lord my God'
  - where: 'note 12:1 “When did the Lord call Abram?”'
    claim: 'At his deliverance the Lord promised to take him from his father’s house and kinsfolk'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'and have come down to deliver thee, and to take thee away from thy father’s house, and from all thy kinsfolk, into a strange land which thou knowest not of'
  - where: 'note 12:1 “When did the Lord call Abram?”'
    claim: 'In Haran Abraham and Lot prayed, and the Lord appeared and told him to take Lot and leave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'But I, Abraham, and Lot, my brother’s son, prayed unto the Lord, and the Lord appeared unto me, and said unto me: Arise, and take Lot with thee; for I have purposed to take thee away out of Haran'

  # ---------- note 12:1 “What Abram left behind” ----------
  - where: 'note 12:1 “What Abram left behind”'
    claim: 'Abram is to leave not only where he lives but his kindred and his father’s house'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Jehovah’s command to Abraham is to leave not only where he lives but also his “kindred” and his “father’s house.”'
  - where: 'note 12:1 “What Abram left behind”'
    claim: 'The Lord calls Abraham to leave old relationships and build a new covenant relationship'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'The Lord is calling Abraham to leave his old relationships and to build a new covenant relationship with the Lord'
  - where: 'note 12:1 “What Abram left behind”'
    claim: 'Hebrews: he went out not knowing where'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'By faith Abraham, when he was called to go out into a place which he should after receive for an inheritance, obeyed; and he went out, not knowing whither he went.'
  - where: 'note 12:1 “What Abram left behind”'
    claim: 'Terah returned to his idolatry in Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'my father turned again unto his idolatry, therefore he continued in Haran.'
  - where: 'note 12:1 “What Abram left behind”'
    claim: '“Get thee out” is lekh-lekha, “go, for yourself”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-1.htm'
    quote: 'לֶךְ־ Go V‑Qal‑Imp‑ms lə·ḵā לְךָ֛ for yourself'
  - where: 'note 12:1 “What Abram left behind”'
    claim: 'The same two words come in Genesis 22:2'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-2.htm'
    quote: 'וְלֶךְ־ and go Conj‑w ¦ V‑Qal‑Imp‑ms lə·ḵā, לְךָ֔'
  - where: 'note 12:1 “What Abram left behind”'
    claim: 'The first call asked him to leave his father’s house; the call in Genesis 22 asks him to offer his son'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/22.htm'
    quote: "As he had left his country, kindred, and father's house at the call of God"
  - where: 'note 12:1 “What Abram left behind”'
    claim: 'The first call asked him to leave his father’s house; the call in Genesis 22 asks him to offer his son'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/22.htm'
    quote: 'so was he in his walk with God cheerfully to offer up even his only son'

  # ---------- note 12:2 “A blessing to others” ----------
  - where: 'note 12:2 “A blessing to others”'
    claim: 'The Lord promises Abraham blessings and the ability to bless the whole world'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'the Lord promises to Abraham to give him blessings and to give him the ability to bless the whole world'
  - where: 'note 12:2 “A blessing to others”'
    claim: 'At its core the covenant is centered on blessing others'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'At its core, the Abrahamic covenant is centered on its ability to bless others'
  - where: 'note 12:2 “A blessing to others”'
    claim: '“Make thy name great” contrasts with Babel (Gen. 11:4)'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/12.htm'
    quote: 'make thy name great ] Contrast Genesis 11:4 .'
  - where: 'note 12:2 “A blessing to others”'
    claim: 'The Babel builders said “let us make us a name”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'and let us make us a name, lest we be scattered abroad upon the face of the whole earth.'
  - where: 'note 12:2 “A blessing to others”'
    claim: 'The Book of Abraham: a blessing to his seed, who bear the ministry and Priesthood to all nations; those who receive the gospel are counted his seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'thou shalt be a blessing unto thy seed after thee, that in their hands they shall bear this ministry and Priesthood unto all nations;'
  - where: 'note 12:2 “A blessing to others”'
    claim: 'The Book of Abraham: a blessing to his seed, who bear the ministry and Priesthood to all nations; those who receive the gospel are counted his seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'for as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed'
  - where: 'note 12:2 “A blessing to others”'
    claim: 'President Nelson: all who accept the gospel join Abraham’s lineage, by birth or adoption'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'All who accept the gospel become part of the lineage of Abraham.'
  - where: 'note 12:2 “A blessing to others”'
    claim: 'President Nelson: all who accept the gospel join Abraham’s lineage, by birth or adoption'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Thus, we can become heirs to the covenant either by birth or by adoption.'

  # ---------- note 12:3 “Many who bless, one who curses” ----------
  - where: 'note 12:3 “Many who bless, one who curses”'
    claim: '“Them that bless thee” is a plural participle'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-3.htm'
    quote: 'מְבָ֣רְכֶ֔יךָ those blessing you V‑Piel‑Prtcpl‑mpc ¦ 2ms'
  - where: 'note 12:3 “Many who bless, one who curses”'
    claim: '“Him that curseth thee” is a singular participle of qalal'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-3.htm'
    quote: 'וּמְקַלֶּלְךָ֖ and him who curses you Conj‑w ¦ V‑Piel‑Prtcpl‑msc ¦ 2ms'
  - where: 'note 12:3 “Many who bless, one who curses”'
    claim: 'God’s “I will curse” is ’arar'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-3.htm'
    quote: 'אָאֹ֑ר I will curse V‑Qal‑Imperf‑1cs'
  - where: 'note 12:3 “Many who bless, one who curses”'
    claim: 'Qalal: root sense be slight, trifling; in the Piel, curse, properly make contemptible'
    key: bdb
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: 'verb be slight, swift, trifling (probably originally be light'
  - where: 'note 12:3 “Many who bless, one who curses”'
    claim: 'Qalal: root sense be slight, trifling; in the Piel, curse, properly make contemptible'
    key: bdb
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: 'curse (properly make contemptible ): 1 with accusative of person homin. Exodus 21:27 (E), Genesis 12:3 (J)'
  - where: 'note 12:3 “Many who bless, one who curses”'
    claim: '’Arar is the verb of the curses on the serpent and the ground'
    key: bdb
    url: 'https://biblehub.com/hebrew/779.htm'
    quote: 'Passive participle אָרוּר , chiefly as exclamation, "" בָּרוּךְ Genesis 3:14,17'
  - where: 'note 12:3 “Many who bless, one who curses”'
    claim: 'In one reading the plural of blessers and singular of the curser is significant: many will bless, only an individual here and there will curse'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/12.htm'
    quote: 'grace expects that there will be many to bless, and that only an individual here and there will render not blessing for blessing, but curse for curse.'
  - where: 'note 12:3 “Many who bless, one who curses”'
    claim: 'In one reading qalal is a man’s contemptuous cursing, ’arar God’s judicial curse'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/12.htm'
    quote: 'lit., to treat as light or little, to despise, denotes "blasphemous cursing on the part of a man;" ארר "judicial cursing on the part of God."'

  # ---------- note 12:3 “The gospel preached to Abraham” ----------
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'Paul calls the promise the gospel preached beforehand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'And the scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed.'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'The verb is a Niphal, nivrekhu'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-3.htm'
    quote: 'וְנִבְרְכ֣וּ and shall be blessed Conj‑w ¦ V‑Nifal‑ConjPerf‑3cp'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'The lexicon gives “bless oneself” for the Niphal here'
    key: bdb
    url: 'https://biblehub.com/hebrew/1288.htm'
    quote: 'Niph`al Perfect נִבְרְכוּ Genesis 12:3 ; Genesis 18:18 ; Genesis 28:14 (J) bless oneself'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'A modern translation gives “bless themselves” as an alternative'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2012&version=NRSVUE'
    quote: 'by you all the families of the earth shall bless themselves'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'The Septuagint reads the verb as passive'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/12.htm'
    quote: 'and in thee shall all the tribes of the earth be blessed.'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'In one reading the reflexive sense breaks off the point of the promise, that the nations really receive the blessing'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/12.htm'
    quote: 'But the Niphal נברך has only the passive signification "to be blessed." And the promise not only meant that all families of the earth would wish for the blessing which Abram possessed, but that they would really receive this blessing'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'In one reading the reflexive sense breaks off the point of the promise'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/12.htm'
    quote: 'By the explanation "wish themselves blessed" the point of the promise is broken off'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'Peter reads it as passive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/3?lang=eng'
    quote: 'saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed.'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'Abraham 2:11 explains the blessing as priesthood, seed, and the gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'and in thee (that is, in thy Priesthood) and in thy seed (that is, thy Priesthood)'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'Abraham 2:11 explains the blessing as priesthood, seed, and the gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'shall all the families of the earth be blessed, even with the blessings of the Gospel, which are the blessings of salvation, even of life eternal.'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'Elias committed the dispensation of the gospel of Abraham in 1836'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'After this, Elias appeared, and committed the dispensation of the gospel of Abraham, saying that in us and our seed all generations after us should be blessed.'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'D&C 110 was received in 1836'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Visions manifested to Joseph Smith the Prophet and Oliver Cowdery in the temple at Kirtland, Ohio, April 3, 1836.'
  - where: 'note 12:3 “The gospel preached to Abraham”'
    claim: 'Elias conferred the right to convey the blessings of the Abrahamic covenant'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Thus, the Master conferred upon Joseph Smith and Oliver Cowdery priesthood authority and the right to convey the unique blessings of the Abrahamic covenant to others.'

  # ---------- note 12:4 “Seventy-five or sixty-two?” ----------
  - where: 'note 12:4 “Seventy-five or sixty-two?”'
    claim: 'Abraham 2:14 gives sixty-two'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'So I, Abraham, departed as the Lord had said unto me, and Lot with me; and I, Abraham, was sixty and two years old when I departed out of Haran.'
