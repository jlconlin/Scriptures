chapter: 30
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Jacob served fourteen years for his wives and six for his cattle, twenty years in all'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'I served thee fourteen years for thy two daughters, and six years for thy cattle'
  - where: 'when'
    claim: 'The births fall in the fourteen years of service; Joseph was born at the end of them, and Jacob then asked to leave'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/30.htm'
    quote: 'Joseph was born at the end of the 14 years of service that had been agreed upon'
  - where: 'setting'
    claim: 'At Beth-el the Lord promised to be with Jacob and keep him in all places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/28?lang=eng'
    quote: 'behold, I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land'
  - where: 'setting'
    claim: 'Jacob served seven years for Rachel and then seven more; Rachel was loved more than Leah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/29?lang=eng'
    quote: 'he loved also Rachel more than Leah, and served with him yet seven other years'
  - where: 'setting'
    claim: 'Leah bore Reuben, Simeon, Levi, and Judah while Rachel was barren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/29?lang=eng'
    quote: 'when the Lord saw that Leah was hated, he opened her womb: but Rachel was barren'
  - where: 'setting'
    claim: 'Leah’s fourth son was Judah (the end of chapter 29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/29?lang=eng'
    quote: 'Now will I praise the Lord: therefore she called his name Judah; and left bearing'
  - where: 'setting'
    claim: 'Benjamin is born later, as Rachel dies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'as her soul was in departing, (for she died) that she called his name Ben-oni: but his father called him Benjamin'
  - where: 'setting'
    claim: 'Ruth is blessed to be like Rachel and Leah, who built the house of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'like Rachel and like Leah, which two did build the house of Israel'
  - where: 'setting'
    claim: 'Genesis counts the sons of Zilpah and of Bilhah among the sons of Jacob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/46?lang=eng'
    quote: 'These are the sons of Zilpah, whom Laban gave to Leah his daughter, and these she bare unto Jacob'
  - where: 'setting'
    claim: 'Genesis counts the sons of Bilhah among the sons of Jacob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/46?lang=eng'
    quote: 'These are the sons of Bilhah, which Laban gave unto Rachel his daughter, and she bare these unto Jacob'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Leah’s “hire” (v. 18), Laban’s “wages” (v. 28), and Jacob’s “hire” (vv. 32, 33) are one Hebrew noun, sakar'
    key: bdb
    url: 'https://biblehub.com/hebrew/7939.htm'
    quote: 'wages, of servant, Genesis 30:28 ; Genesis 30:32'
  - where: 'thread'
    claim: 'Leah’s “hire” in v. 18 is the suffixed form of sakar'
    key: bdb
    url: 'https://biblehub.com/hebrew/7939.htm'
    quote: 'suffix שְׂכָרִי Genesis 30:18'
  - where: 'thread'
    claim: 'Jacob later says God took the cattle of Laban and gave them to him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'Thus God hath taken away the cattle of your father, and given them to me.'
  - where: 'thread'
    claim: 'Rachel’s speeches in the chapter use Elohim; Leah named her first four sons with the LORD (chapter 29) but speaks of God here'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/30.htm'
    quote: 'It is to be noticed, that Rachel speaks of Elohim only, whereas Leah regarded her first four sons as the gift of Jehovah.'

  # ---------- section plain departures ----------
  - where: 'section 2 plain'
    claim: 'Leah’s word at Gad’s birth, as written in the Hebrew text, is “How fortunate”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-11.htm'
    quote: 'בְּגָד How fortunate'
  - where: 'section 3 plain'
    claim: 'The Hebrew of Leah’s second clause at Zebulun’s birth is “will honor me”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-20.htm'
    quote: 'יִזְבְּלֵ֣נִי will honor me'
  - where: 'section 5 plain'
    claim: 'The trees are poplar, almond, and plane (luz is the almond tree)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3869.htm'
    quote: 'almond-tree, almond-wood'
  - where: 'section 5 plain'
    claim: 'armon is the plane tree'
    key: bdb
    url: 'https://biblehub.com/hebrew/6196.htm'
    quote: 'plane-tree (as stripped of bark)'
  - where: 'section 5 plain'
    claim: 'libneh is the poplar'
    key: bdb
    url: 'https://biblehub.com/hebrew/3839.htm'
    quote: 'poplar (apparently = Arabic'

  # ---------- note 30:1 ----------
  - where: 'note 30:1 “What Rachel was asking for”'
    claim: 'The verb for Rachel’s envy is qana, “be envious of”, used with ב of the person in Gen. 30:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/7065.htm'
    quote: 'be envious of with ב person, Genesis 30:1'
  - where: 'note 30:1 “What Rachel was asking for”'
    claim: 'The Hebrew of her request is “Give me sons, and if not, I will die”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-1.htm'
    quote: 'בָנִ֔ים sons … וְאִם־ and if … אַ֖יִן not … מֵתָ֥ה will die'
  - where: 'note 30:1 “What Rachel was asking for”'
    claim: 'Barrenness meant the lack of the cultural and visual evidence that gave women value'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'the beautiful Rachel was fortunate to receive Jacob’s adoring love but was deprived of bearing children, the cultural and visual evidence that gave women value in her society'
  - where: 'note 30:1 “What Rachel was asking for”'
    claim: 'A son was the assurance of the continuation of God’s covenant with Abraham'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'a son for these matriarchs was the assurance of the continuation of God’s covenant with Abraham'
  - where: 'note 30:1 “What Rachel was asking for”'
    claim: 'Rachel’s plea read as a longing to fulfill her God-given covenant responsibility'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'was more than an instinctive maternal yearning. It was a profound longing to fulfill her God-given responsibility to continue the Abrahamic covenant through future generations.'
  - where: 'note 30:1 “What Rachel was asking for”'
    claim: 'All but one of the matriarchs faced barrenness'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'all but one of the matriarchs faced trial and refinement through a period of barrenness'
  - where: 'note 30:1 “What Rachel was asking for”'
    claim: 'The sisters’ struggle is often written off as petty jealousy without counting a mother’s responsibility for her children’s and her own security'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'often marginalized as petty jealousy without accounting for a mother’s responsibility to ensure a secure future both for her children and for herself'

  # ---------- note 30:2 ----------
  - where: 'note 30:2 “Am I in the place of God?”'
    claim: 'The Hebrew of Jacob’s question is “Am I in the place of God?”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-2.htm'
    quote: 'הֲתַ֤חַת In the place … אֱלֹהִים֙ of God'
  - where: 'note 30:2 “Am I in the place of God?”'
    claim: 'Jacob’s reply indicates his realization of the same truth (that only God could help her, as with Leah)'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'As he did for Leah, God would also lead Rachel to where only he could help her.'
  - where: 'note 30:2 “Am I in the place of God?”'
    claim: 'Jacob’s reply indicates his realization of the same truth'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'indicates his realization of the same truth (30:2)'
  - where: 'note 30:2 “Am I in the place of God?”'
    claim: 'Joseph’s words in Gen. 50:19 are the same Hebrew phrase, “in the place of God am I”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/50-19.htm'
    quote: 'הֲתַ֥חַת in the place … אֱלֹהִ֖ים of God'
  - where: 'note 30:3 “Born on Rachel’s knees”'
    claim: 'Receiving the child on the parent’s knees meant acceptance into the family; the phrase retains the trace of a ceremony of legitimatization and adoption; compare Gen. 50:23, Job 3:12'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/30.htm'
    quote: 'The child being received on the knees of the parent was regarded as being accepted into the family. The words retain the trace of a primitive ceremony of legitimatization and adoption.'
  - where: 'note 30:3 “Born on Rachel’s knees”'
    claim: 'Joseph’s great-grandchildren were brought up upon Joseph’s knees'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'the children also of Machir the son of Manasseh were brought up upon Joseph’s knees'
  - where: 'note 30:3 “Born on Rachel’s knees”'
    claim: 'Hebrew “and I shall be built up from her” (Nifal of banah)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-3.htm'
    quote: 'וְאִבָּנֶ֥ה and shell be built up … מִמֶּֽנָּה from her'
  - where: 'note 30:3 “Born on Rachel’s knees”'
    claim: 'Lexicon: of a childless wife, by means of a concubine: “I shall be built up, i.e. become the mother of a family, from or through her” (Gen. 16:2; 30:3)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1129.htm'
    quote: 'c. of childless wife, by means of concubine'
  - where: 'note 30:3 “Born on Rachel’s knees”'
    claim: 'Lexicon gloss “I shall be built up, i.e. become the mother of a family”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1129.htm'
    quote: 'I shall be built up , i.e. become the mother of a family, from or through her'
  - where: 'note 30:3 “Born on Rachel’s knees”'
    claim: 'The maids were the property of Rachel and Leah, and their children were legally the wives’ children'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: 'when the handmaids had children, the children were viewed legally as the children of Rachel and Leah'
  - where: 'note 30:3 “Born on Rachel’s knees”'
    claim: 'The Hebrew verb “build” describes women creating a family or nation through childbirth (Gen. 16:2; 30:3)'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'women creating an individual, family, or nation through childbirth (Genesis 16:2; 30:3)'
  - where: 'note 30:3 “Born on Rachel’s knees”'
    claim: 'Ruth is blessed to be like Rachel and Leah, who built the house of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'like Rachel and like Leah, which two did build the house of Israel'

  # ---------- note 30:8 ----------
  - where: 'note 30:8 “Wrestlings of God”'
    claim: 'The Hebrew is “wrestlings of God I have wrestled with my sister, and indeed I have prevailed”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-8.htm'
    quote: 'נַפְתּוּלֵ֨י With wrestlings … אֱלֹהִ֧ים׀ of God … יָכֹ֑לְתִּי I have prevailed'
  - where: 'note 30:8 “Wrestlings of God”'
    claim: '“Of God” may be an intensive (cf. “a mighty prince”) or “strugglings in prayer for God’s blessing”; the original meaning has probably been lost'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/30.htm'
    quote: '“of God” being added as an intensive or superlative (cf. Genesis 23:6, “a mighty prince”); or “wrestlings,” i.e. “strugglings in prayer for God’s blessing” of children. The original meaning has probably been lost.'
  - where: 'note 30:8 “Wrestlings of God”'
    claim: 'The Septuagint: “God has helped me, and I contended with my sister and prevailed”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/30.htm'
    quote: 'God has helped me, and I contended with my sister and prevailed'
  # ---------- note 30:11 ----------
  - where: 'note 30:11 “Gad: fortune, not a troop”'
    claim: 'The consonants as written (ketiv) are bgd, “with fortune”; the marginal reading (qere) is ba gad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'בגד … בָּ֣א גָ֑ד'
  - where: 'note 30:11 “Gad: fortune, not a troop”'
    claim: 'The Hebrew as written is rendered “How fortunate” in the interlinear'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-11.htm'
    quote: 'בְּגָד How fortunate'
  - where: 'note 30:11 “Gad: fortune, not a troop”'
    claim: 'The Septuagint reads “It is happily”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/30.htm'
    quote: 'happily: and she called his name, Gad'
  - where: 'note 30:11 “Gad: fortune, not a troop”'
    claim: 'Lexicon: gad here is “fortune, good fortune”, Kt bgd, Qr ba gad'
    key: bdb
    url: 'https://biblehub.com/hebrew/1409.htm'
    quote: 'fortune, good fortune'
  - where: 'note 30:11 “Gad: fortune, not a troop”'
    claim: 'Lexicon: Gad as proper name, god of fortune, Isa. 65:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/1409.htm'
    quote: 'proper name, masculine god of fortune'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'Bible Dictionary: the Hebrew name denotes “love fruit”; the fruit was supposed to ensure conception'
    key: bd-mandrake
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mandrake?lang=eng'
    quote: 'The Hebrew name denotes “love fruit.” The fruit had a pleasant taste and odor and was supposed to ensure conception'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'The etymology of dudaim is uncertain; it may share a root with dodim, “love”; the only other mention is Song 7:13'
    key: sc-knowhy-840
    url: 'https://scripturecentral.org/knowhy/why-does-rachel-want-leah-s-mandrakes'
    quote: 'The etymology is uncertain, but the Hebrew word'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'The only other place mandrakes are mentioned in the Bible is Song 7:13'
    key: sc-knowhy-840
    url: 'https://scripturecentral.org/knowhy/why-does-rachel-want-leah-s-mandrakes'
    quote: 'The only other place mandrakes are mentioned in the Bible is in Song of Songs 7:13'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'Egyptian art shows mandrakes tied to life and fertility; a king holds a mandrake while pouring water into the queen’s cupped hand'
    key: sc-knowhy-840
    url: 'https://scripturecentral.org/knowhy/why-does-rachel-want-leah-s-mandrakes'
    quote: 'In one scene, a king is holding a mandrake in one hand while pouring water into the cupped hand of the queen, in a scene clearly meant to imply life and fertility.'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'The root of the mandrake has long been thought to resemble a human baby'
    key: sc-knowhy-840
    url: 'https://scripturecentral.org/knowhy/why-does-rachel-want-leah-s-mandrakes'
    quote: 'That the root of the mandrake plant has long been thought to resemble a human baby'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'The text says God, not the mandrakes, opened Rachel’s womb'
    key: sc-knowhy-840
    url: 'https://scripturecentral.org/knowhy/why-does-rachel-want-leah-s-mandrakes'
    quote: 'The text specifically states that God, not the mandrakes, opened Rachel’s womb and allowed her to have children.'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'Leah bore three more children before Rachel bore Joseph'
    key: sc-knowhy-840
    url: 'https://scripturecentral.org/knowhy/why-does-rachel-want-leah-s-mandrakes'
    quote: 'Genesis 30:18-24 reports that Leah bears Jacob three children, Issachar, Zebulun, and Dinah, before Rachel finally bears Joseph'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'The Hebrew word dudaim, mandrakes, in v. 14'
    key: bdb
    url: 'https://biblehub.com/hebrew/1736.htm'
    quote: 'mandrake (as love-producing'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'Reuben found the mandrakes in the days of wheat harvest, in the field'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/30?lang=eng'
    quote: 'And Reuben went in the days of wheat harvest, and found mandrakes in the field'
  - where: 'note 30:14 “Mandrakes, and who opened the womb”'
    claim: 'Mandrake roots resemble small human figures'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'The mandrake plant has flesh-colored roots that can sometimes resemble small human figures'

  # ---------- note 30:18 ----------
  - where: 'note 30:18 “Hire, the chapter’s word for wages”'
    claim: 'Leah’s words in v. 16 are “hiring, I have hired you” (infinitive absolute plus perfect of sakar)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-16.htm'
    quote: 'שָׂכֹ֣ר hiring … שְׂכַרְתִּ֔יךָ I have hired you'
  - where: 'note 30:18 “Hire, the chapter’s word for wages”'
    claim: 'In v. 18 Leah says “God has given me my reward/hire”, sekhari'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-18.htm'
    quote: 'נָתַ֤ן Has given me … אֱלֹהִים֙ God … שְׂכָרִ֔י my reward'
  - where: 'note 30:18 “Hire, the chapter’s word for wages”'
    claim: 'The same noun (wages, of a servant) is used in vv. 28, 32, 33'
    key: bdb
    url: 'https://biblehub.com/hebrew/7939.htm'
    quote: '1 wages , of servant, Genesis 30:28 ; Genesis 30:32 ; Genesis 30:83'
  - where: 'note 30:18 “Hire, the chapter’s word for wages”'
    claim: 'Laban says “Appoint me thy wages”; God hearkened unto Leah (v. 17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/30?lang=eng'
    quote: 'Appoint me thy wages, and I will give it.'
  - where: 'note 30:18 “Hire, the chapter’s word for wages”'
    claim: 'God hearkened unto Leah and she conceived'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/30?lang=eng'
    quote: 'And God hearkened unto Leah, and she conceived, and bare Jacob the fifth son.'

  # ---------- note 30:20 ----------
  - where: 'note 30:20 “Zebulun and the dowry”'
    claim: 'The Hebrew of v. 20: “God has endowed me with a good endowment (zebed)”; second clause “will honor me”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-20.htm'
    quote: 'זְבָדַ֨נִי Has endowed me … זֵ֣בֶד'
  - where: 'note 30:20 “Zebulun and the dowry”'
    claim: 'Lexicon: zabad = bestow upon, endow with; zebed in Gen. 30:20 = dowry'
    key: bdb
    url: 'https://biblehub.com/hebrew/2064.htm'
    quote: 'bestow upon, endow with'
  - where: 'note 30:20 “Zebulun and the dowry”'
    claim: 'Lexicon: zebed = dowry (Aramaic, Gen. 30:20)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2064.htm'
    quote: 'Genesis 30:20 , dowry'
  - where: 'note 30:20 “Zebulun and the dowry”'
    claim: 'Lexicon: zabal is probably “exalt, honour”; Gen. 30:20b “my husband will honour me”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2082.htm'
    quote: 'probably exalt, honour'
  - where: 'note 30:20 “Zebulun and the dowry”'
    claim: 'Rachel and Leah say their father sold them and devoured their money'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'Are we not counted of him strangers? for he hath sold us, and hath quite devoured also our money.'
  - where: 'note 30:20 “Zebulun and the dowry”'
    claim: 'Laban failed to give them their dowries or bride wealth earned from the fourteen years Jacob worked'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'Thus, Leah and Rachel were angry with Laban because he failed to give them their dowries or bride wealth earned from the fourteen years Jacob worked for them (31:14–16).'

  # ---------- note 30:22 ----------
  - where: 'note 30:22 “God remembered Rachel”'
    claim: 'The Hebrew of v. 22: God remembered Rachel, listened to her, opened her womb'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/30-22.htm'
    quote: 'וַיִּזְכֹּ֥ר And remembered … וַיִּשְׁמַ֤ע and listened … וַיִּפְתַּ֖ח and He opened'
  - where: 'note 30:22 “God remembered Rachel”'
    claim: 'When God is the subject, zakar means to remember persons with kindness, granting requests, protecting, delivering; Gen. 30:22 with 1 Sam. 1:11, 19, and Gen. 8:1; 19:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'individuals, with kindness, granting requests, protecting, delivering etc., with accusative of person, Genesis 30:22'
  - where: 'note 30:22 “God remembered Rachel”'
    claim: 'The lexicon lists Gen. 8:1 and Gen. 19:29 with 1 Sam. 1:19 in the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'also Genesis 8:1 (P), Genesis 19:29 (P)'
  - where: 'note 30:22 “God remembered Rachel”'
    claim: 'God remembered Noah and everything in the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/8?lang=eng'
    quote: 'And God remembered Noah, and every living thing, and all the cattle that was with him in the ark'
  - where: 'note 30:22 “God remembered Rachel”'
    claim: 'God remembered Abraham when He destroyed the cities of the plain'
    key: lds-scriptures
