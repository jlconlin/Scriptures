  # ---------- note 30:25 ----------
  - where: 'note 30:25 “Why Jacob asks to leave now”'
    claim: 'Joseph was born at the end of the fourteen years of service'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/30.htm'
    quote: 'Joseph was born at the end of the 14 years of service that had been agreed upon'
  - where: 'note 30:25 “Why Jacob asks to leave now”'
    claim: 'Jacob served fourteen years for his two daughters and six for the cattle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'Thus have I been twenty years in thy house; I served thee fourteen years for thy two daughters, and six years for thy cattle'
  - where: 'note 30:25 “Why Jacob asks to leave now”'
    claim: 'The Lord’s instruction to return comes only in 31:3, after Laban changes the wage agreement ten times'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'After Rachel gave birth to Joseph, her first son and Jacob’s eleventh, and after Laban changed his payment agreement with Jacob for the tenth time, the Lord directed Jacob to return to his homeland in Canaan (Genesis 31:3).'
  - where: 'note 30:25 “Why Jacob asks to leave now”'
    claim: 'It takes twenty years for the Lord to send instruction to return, a duration none could have foreseen'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'It takes twenty years for the Lord to send instruction to Jacob that he must finally return home (Genesis 31:3), a duration of time none could have foreseen'
  - where: 'note 30:25 “Why Jacob asks to leave now”'
    claim: 'The Lord told Jacob to return to the land of his fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'And the Lord said unto Jacob, Return unto the land of thy fathers, and to thy kindred; and I will be with thee.'
  - where: 'note 30:25 “Why Jacob asks to leave now”'
    claim: 'Eleven children in seven years: the births are grouped by mother, not by date'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/30.htm'
    quote: 'the intention to arrange them according to the mothers prevails over the chronological order'
  - where: 'note 30:25 “Why Jacob asks to leave now”'
    claim: 'Reconstruction: Leah’s first four sons in the first four years; Rachel, having discovered her barrenness, gave her maid; eleven sons within seven years'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/30.htm'
    quote: 'Leah’s first four births followed as rapidly as possible one after the other, so that four sons were born in the first four years of the second period of Jacob’s service.'
  - where: 'note 30:25 “Why Jacob asks to leave now”'
    claim: 'Jacob may easily have had eleven sons within seven years of his marriage'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/30.htm'
    quote: 'In this way Jacob may easily have had eleven sons within seven years of his marriage.'

