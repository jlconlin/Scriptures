  - where: 'note 30:2 “Am I in the place of God?”'
    claim: 'A commentary sets Jacob’s question beside Gen. 50:19'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/30.htm'
    quote: 'Am I in God’s stead ] See Genesis 50:19'
  - where: 'note 30:2 “Am I in the place of God?”'
    claim: 'The two questions differ only in the form of “I” (anokhi in 30:2, ani in 50:19)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי'
  - where: 'note 30:11 “Gad: fortune, not a troop”'
    claim: 'The Septuagint (en tychē, “with fortune”) follows the written text (ketiv)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1409.htm'
    quote: 'Kt, i.e. בְּגָד ( בָּא גָד֑ Qr), ᵐ5 ἐν τύχῃ , by or with good fortune'
  - where: 'note 30:20 “Zebulun and the dowry”'
    claim: 'What a dowry was: compensation for a daughter’s separation from the family property, part of establishing a new household, and her security if widowed or divorced'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'The dowry was compensation for a daughter’s separation from the family property and was a critical part of establishing a new household, including what she contributed toward an inheritance for the next generation and her security should she become widowed or divorced.'
