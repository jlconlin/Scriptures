chapter: 11
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'The Bible Chronology lists the Tower of Babel among the undated events of the early patriarchs'
    key: bd-chronology
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Ministry of Noah; the Flood. Tower of Babel. Ministry of Melchizedek.'
  - where: 'when'
    claim: 'The Bible Chronology lists the Tower of Babel among the undated events of the early patriarchs'
    key: bd-chronology
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '(Those desiring calculated dates on these events may wish to consult published chronologies.)'
  - where: 'setting'
    claim: 'Shinar is Babylonia'
    key: bdb
    url: 'https://biblehub.com/hebrew/8152.htm'
    quote: 'proper name, of a location Shinar = Babylonia'
  - where: 'setting'
    claim: 'The tower was the transitional event between the dispensations of Noah and Abraham'
    key: donaldson-babel-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/02/i-have-a-question/is-there-additional-background-information-on-the-tower-of-babel?lang=eng'
    quote: 'The tower of Babel was the transitional event between the dispensations of Noah and Abraham.'
  - where: 'setting'
    claim: 'The Book of Abraham presents itself as Abraham’s own record'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'The writings of Abraham while he was in Egypt, called the Book of Abraham, written by his own hand, upon papyrus.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'To make a name is to build a reputation, fame, or a monument'
    key: ot-seminary-lesson-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-genesis/lesson-18-genesis-10-11?lang=eng'
    quote: 'explain that the biblical meaning of making a name is to build a reputation, fame, or a monument'
  - where: 'thread'
    claim: 'Babel is a play on balal, “confound”'
    key: bdb
    url: 'https://biblehub.com/hebrew/894.htm'
    quote: 'Genesis 11:9 (where name connected with בלל confuse, confound )'
  - where: 'thread'
    claim: '“Name” in verse 4 is shem, and Shem in verse 10 is the same word'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-4.htm'
    quote: 'šêm; שֵׁ֑ם a name N‑ms'
  - where: 'thread'
    claim: '“Name” in verse 4 is shem, and Shem in verse 10 is the same word'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-10.htm'
    quote: 'šêm, שֵׁ֔ם of Shem N‑proper‑ms'
  - where: 'thread'
    claim: 'Shem means “name”'
    key: bd-shem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shem?lang=eng'
    quote: 'Shem Name. Son of Noah'
  - where: 'thread'
    claim: 'Contrast between Babel’s self-made name and God making Abraham’s name great'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'In contrast to the people of Babel, who sought to make a name for themselves, God promised that He would make Abraham’s name great.'
  - where: 'thread'
    claim: 'The scattered families are those the Abrahamic covenant promises to bless'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'Despite their intentions, the Lord did scatter them throughout the earth. In contrast, the Abrahamic covenant includes the blessing of families being gathered together and sealed for eternity.'
  - where: 'thread'
    claim: 'A definite connection between Babel and the call of Abram that follows'
    key: woods-ascension
    url: 'https://rsc.byu.edu/vol-23-no-2-2022/ascension-abraham'
    quote: 'There appears to be a definite connection between the story of the Tower of Babel in Genesis 11 and what immediately follows in the next chapter of the Abrahamic narrative.'
  - where: 'thread'
    claim: 'Abram sought a divine name in contrast to the builders’ name'
    key: woods-ascension
    url: 'https://rsc.byu.edu/vol-23-no-2-2022/ascension-abraham'
    quote: 'In contrast, Abram sought the blessing of adhering to a divine name, to make “a great nation” (12:2)'

  # ---------- section plain ----------
  - where: 'section 1 plain'
    claim: '“Slime” is bitumen, tar'
    key: bdb
    url: 'https://biblehub.com/hebrew/2564.htm'
    quote: 'bitumen, asphalt'
  - where: 'section 1 plain'
    claim: 'The tower’s top “in the heavens”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-4.htm'
    quote: 'wə·rō·šōw וְרֹאשׁ֣וֹ and its top … ḇaš·šā·ma·yim, בַשָּׁמַ֔יִם in the heavens'
  - where: 'section 2 plain'
    claim: 'Nothing they propose will be impossible; this is only the beginning'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2011&version=NRSVUE'
    quote: 'this is only the beginning of what they will do; nothing that they propose to do will now be impossible for them'
  - where: 'section 4 plain'
    claim: '“Before his father” means in his presence, while he lived'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/11.htm'
    quote: 'And Arrhan died in the presence of Tharrha his father'

  # ---------- note 11:1 ----------
  - where: 'note 11:1 “One lip, one set of words”'
    claim: 'Hebrew: safah echat, devarim achadim'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-1.htm'
    quote: 'śā·p̄āh שָׂפָ֣ה language … ’e·ḥāṯ; אֶחָ֑ת one … ū·ḏə·ḇā·rîm וּדְבָרִ֖ים and speech'
  - where: 'note 11:1 “One lip, one set of words”'
    claim: 'Safah means lip, speech; used in 11:1 and 11:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/8193.htm'
    quote: 'lip, speech, edge ; — absolute ׳ שׂ Genesis 11:1 +, construct שְׂפַת Genesis 11:7'
  - where: 'note 11:1 “One lip, one set of words”'
    claim: 'The same word in verses 6, 7, 9'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-9.htm'
    quote: 'śə·p̄aṯ שְׂפַ֣ת the language N‑fsc'
  - where: 'note 11:1 “One lip, one set of words”'
    claim: 'Joseph Fielding Smith: the Jaredites likely spoke the Adamic language'
    key: bom-manual-ether-1-5
    url: 'https://www.churchofjesuschrist.org/study/manual/book-of-mormon-student-manual/chapter-50-ether-1-5?lang=eng'
    quote: 'President Joseph Fielding Smith (1876–1972) taught that the Jaredites likely spoke in the language of Adam'
  - where: 'note 11:1 “One lip, one set of words”'
    claim: 'Joseph Fielding Smith: they carried with them the Adamic language'
    key: bom-manual-ether-1-5
    url: 'https://www.churchofjesuschrist.org/study/manual/book-of-mormon-student-manual/chapter-50-ether-1-5?lang=eng'
    quote: 'they carried with them the speech of their fathers, the Adamic language, which was powerful even in its written form'

  # ---------- note 11:3 ----------
  - where: 'note 11:3 “Brick for stone”'
    claim: 'Baked bricks were a new technology that allowed larger structures'
    key: ensign-babel-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/02/the-tower-of-babel?lang=eng'
    quote: 'Sun-dried bricks had been used for a long time, but baking bricks made them stronger, so larger structures could be built with this new technology.'
  - where: 'note 11:3 “Brick for stone”'
    claim: 'Chemar is bitumen, asphalt, used for cement in building Babel; also in Gen. 14:10 and Ex. 2:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/2564.htm'
    quote: 'used for cement in building Babel Genesis 11:3 (J); abounding in vale of Siddim'
  - where: 'note 11:3 “Brick for stone”'
    claim: 'Israel’s altars of uncut stone and temple of quarried stone contrast with man-made brick'
    key: ensign-babel-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/02/the-tower-of-babel?lang=eng'
    quote: 'And they built their temples out of quarried stone rather than man-made brick (see 1 Kings 5:15–18).'
  - where: 'note 11:3 “Brick for stone”'
    claim: 'The tower was completely man-made'
    key: ensign-babel-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/02/the-tower-of-babel?lang=eng'
    quote: 'Was completely man-made.'
  - where: 'note 11:3 “Brick for stone”'
    claim: 'Josephus: Nimrod stirred the people to it'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-1.html'
    quote: 'Now it was Nimrod who excited them to such an affront and contempt of God.'
  - where: 'note 11:3 “Brick for stone”'
    claim: 'Josephus: a tower too high for the waters, to avenge himself on God'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-1.html'
    quote: 'He would be revenged on God, if he should have a mind to drown the world again: for that he would build a Tower too high for the waters to be able to reach'
  - where: 'note 11:3 “Brick for stone”'
    claim: 'Babel was in Nimrod’s kingdom (Gen. 10:10); Nimrod is the traditional builder'
    key: donaldson-babel-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/02/i-have-a-question/is-there-additional-background-information-on-the-tower-of-babel?lang=eng'
    quote: 'Early Jewish and Christian traditions reported that Nimrod built the tower of Babel, referred to as a pagan temple, in an attempt to contact heaven.'

  # ---------- note 11:4 tower ----------
  - where: 'note 11:4 “A counterfeit temple”'
    claim: 'Hebrew: “its head in the heavens”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-4.htm'
    quote: 'wə·rō·šōw וְרֹאשׁ֣וֹ and its top … ḇaš·šā·ma·yim, בַשָּׁמַ֔יִם in the heavens'
  - where: 'note 11:4 “A counterfeit temple”'
    claim: 'Usually associated with ziggurats, stepped temple towers'
    key: ensign-babel-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/02/the-tower-of-babel?lang=eng'
    quote: 'Because of its location and materials, usually associated with ziggurats, which were stepped temple towers designed to be elevated above a plain, like a man-made mountain.'
  - where: 'note 11:4 “A counterfeit temple”'
    claim: 'Two statements in verse 4 hint at a temple: meeting God, and taking the name of Christ'
    key: parry-flood-babel
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/01/the-flood-and-the-tower-of-babel?lang=eng'
    quote: 'Two statements hint at an attempt to build a temple: “Let us build … a tower, whose top may reach unto heaven” (4) recalls one of the purposes of temples: to serve as places where God and man can meet.'
  - where: 'note 11:4 “A counterfeit temple”'
    claim: '“Make us a name” recalls taking on the name of Jesus Christ in temples'
    key: parry-flood-babel
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/01/the-flood-and-the-tower-of-babel?lang=eng'
    quote: 'recalls another purpose of temples: to serve as holy places where individuals take upon themselves the name of Jesus Christ'
  - where: 'note 11:4 “A counterfeit temple”'
    claim: 'They built without divine approval or priesthood keys'
    key: donaldson-babel-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/02/i-have-a-question/is-there-additional-background-information-on-the-tower-of-babel?lang=eng'
    quote: 'Nimrod and his people were building their own temple, their gate to heaven, without divine approval or priesthood keys.'
  - where: 'note 11:4 “A counterfeit temple”'
    claim: 'Scripture Helps: early traditions call it a counterfeit temple; true temples gather people to God through covenants'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'Early Jewish and Christian traditions suggest that the Tower of Babel was a counterfeit temple.'
  - where: 'note 11:4 “Afraid of being scattered”'
    claim: '“Scatter” occurs three times in the story'
    key: parry-flood-babel
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/01/the-flood-and-the-tower-of-babel?lang=eng'
    quote: 'is found three times in the story of the tower (Gen. 11:4, 8–9).'
  - where: 'note 11:4 “Afraid of being scattered”'
    claim: 'This dispensation is the era for gathering'
    key: parry-flood-babel
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/01/the-flood-and-the-tower-of-babel?lang=eng'
    quote: 'The opposite of scattering is gathering, and this dispensation is the era for gathering.'
  - where: 'note 11:4 “Afraid of being scattered”'
    claim: 'D&C 2:3 and the 1828 sense of “waste” set beside Babel; the builders tried to seal the people together without authority'
    key: ensign-babel-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/02/the-tower-of-babel?lang=eng'
    quote: 'Doctrine and Covenants 2:3 says the sealing power would be restored so that the earth would not be “wasted” at the Second Coming.'
  - where: 'note 11:4 “Afraid of being scattered”'
    claim: 'They tried to bind or seal the people together so they would not be scattered, without authority'
    key: ensign-babel-2018
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/02/the-tower-of-babel?lang=eng'
    quote: 'bind or seal the people together somehow so they would not be scattered … rather than take the Lord’s name upon them—and all this without authority from God'
  - where: 'note 11:4 “Afraid of being scattered”'
    claim: 'Webster 1828: waste = to destroy by scattering'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/waste'
    quote: 'To cause to be lost; to destroy by scattering or by injury.'

  # ---------- note 11:6 ----------
  - where: 'note 11:6 “Why the Lord came down”'
    claim: 'Havah, “come,” in verses 3 and 4'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-3.htm'
    quote: 'hā·ḇāh הָ֚בָה Come … nil·bə·nāh נִלְבְּנָ֣ה let us make'
  - where: 'note 11:6 “Why the Lord came down”'
    claim: 'Havah, neredah, “come, let us go down,” in verse 7'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-7.htm'
    quote: 'hā·ḇāh הָ֚בָה Come … nê·rə·ḏāh, נֵֽרְדָ֔ה let Us go down'
  - where: 'note 11:6 “Why the Lord came down”'
    claim: '“Go to” in verse 7 is an ironical imitation of verses 3 and 4 (one reading)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/11.htm'
    quote: '"Up" (הבה "go to," an ironical imitation of the same expression in'
  - where: 'note 11:6 “Why the Lord came down”'
    claim: '“Came down” is an anthropomorphic description of God’s judicial cognizance'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/11.htm'
    quote: 'is an anthropomorphic description of God''s interposition in the actions of men, primarily a "judicial cognizance of the actual fact,"'
  - where: 'note 11:6 “Why the Lord came down”'
    claim: 'Lo yibbatser, “will not be restrained/cut off”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-6.htm'
    quote: 'lō- לֹֽא־ nothing … yib·bā·ṣêr יִבָּצֵ֣ר will be restrained'
  - where: 'note 11:6 “Why the Lord came down”'
    claim: 'Literally “cut off from them, prevented”'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/11.htm'
    quote: 'lit., cut off from them, prevented'
  - where: 'note 11:6 “Why the Lord came down”'
    claim: 'NRSVUE: nothing they propose will be impossible; this is only the beginning'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2011&version=NRSVUE'
    quote: 'this is only the beginning of what they will do; nothing that they propose to do will now be impossible for them'
  - where: 'note 11:6 “Why the Lord came down”'
    claim: 'JST Gen. 11:6 adds “and they hearkened not unto the Lord” (footnote 8a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'JST Gen. 11:6 … city, and they hearkened not unto the Lord …'

  # ---------- note 11:9 ----------
  - where: 'note 11:9 “Gate of God, or confusion”'
    claim: 'Balal: mingle, mix, confuse, confound; Gen. 11:7, 9'
    key: bdb
    url: 'https://biblehub.com/hebrew/1101.htm'
    quote: 'verb mingle, mix, confuse, confound'
  - where: 'note 11:9 “Gate of God, or confusion”'
    claim: 'Verse 9: Babel … balal'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/11-9.htm'
    quote: 'bā·ḇel, בָּבֶ֔ל Babel … bā·lal בָּלַ֥ל confused'
  - where: 'note 11:9 “Gate of God, or confusion”'
    claim: 'Assyrian Bab-ilu, “gate of god”'
    key: bdb
    url: 'https://biblehub.com/hebrew/894.htm'
    quote: 'Babel, Babylon (in Assyrian written Bab-ilu, gate of god'
  - where: 'note 11:9 “Gate of God, or confusion”'
    claim: 'Babel meant “confusion” in Hebrew but “gate of God” in Akkadian'
    key: donaldson-babel-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/02/i-have-a-question/is-there-additional-background-information-on-the-tower-of-babel?lang=eng'
    quote: 'Finally, the word Babel in Hebrew meant “confusion,” but in Babylonian or Akkadian, the meaning was “gate of God.”'
  - where: 'note 11:9 “Gate of God, or confusion”'
    claim: 'Babel is the same Hebrew word as Babylon; typologically they are building Babylon'
    key: donaldson-babel-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/02/i-have-a-question/is-there-additional-background-information-on-the-tower-of-babel?lang=eng'
    quote: 'the word Babel in Hebrew is the same word translated everywhere else in the Old Testament as “Babylon.” Thus, in biblical typology, what the people are building in this story is Babylon.'
  - where: 'note 11:9 “Gate of God, or confusion”'
    claim: 'The narrative begun in Genesis ends in 2 Kings 25 back in Babylon'
    key: donaldson-babel-1994
    url: 'https://www.churchofjesuschrist.org/study/ensign/1994/02/i-have-a-question/is-there-additional-background-information-on-the-tower-of-babel?lang=eng'
    quote: 'The narrative begun by Genesis ends in 2 Kings 25, in which the children of Israel found themselves—because they broke the covenant—back in Babylon where the story began.'
  - where: 'note 11:9 “Gate of God, or confusion”'
    claim: 'In D&C 1:16 Babylon means “the world”'
    key: bd-babylon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/babylon?lang=eng'
    quote: 'In D&C 1:16, Babylon means “the world.”'

  # ---------- note 11:8 ----------
  - where: 'note 11:8 “The Book of Mormon’s witness”'
    claim: 'Latter-day Saints accept the story; the Book of Mormon is a second witness'
    key: parry-flood-babel
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/01/the-flood-and-the-tower-of-babel?lang=eng'
    quote: 'But Latter-day Saints accept the story as it is presented in Genesis. Further, we have the second witness of the Book of Mormon.'
  - where: 'note 11:8 “The Book of Mormon’s witness”'
    claim: 'The confounding may have happened over time'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'These events indicate that the confounding of language may have happened over time and not in an instant.'

  # ---------- note 11:10 ----------
  - where: 'note 11:10 “From Shem to Abram”'
    claim: 'The list traces the direct descent of the Terahites from Shem (one reading)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/11.htm'
    quote: 'They are repeated here to show the direct descent of the Terahites through Peleg from Shem'
  - where: 'note 11:10 “From Shem to Abram”'
    claim: 'The genealogy closes, like Gen. 5:32, with three sons'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/11.htm'
    quote: 'the genealogy closes, like that in'
  - where: 'note 11:10 “From Shem to Abram”'
    claim: 'Lifespans after the flood half those before, and halved again with Peleg; the figures'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/11.htm'
    quote: 'Shem, who was born before the flood, reached the age of 600, Arphaxad lived only 438 years, Salah 433, and Eber 464; and again, with Peleg the duration of life fell to 239 years, Reu also lived only 239 years, Serug 230, and Nahor not more than 148'
  - where: 'note 11:10 “From Shem to Abram”'
    claim: 'Children were born earlier as lives shortened'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/11.htm'
    quote: 'But while the length of life diminished, the children were born proportionally earlier.'
  - where: 'note 11:10 “From Shem to Abram”'
    claim: 'Nearly all the patriarchs from Shem to Terah were alive at Abram’s migration'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/11.htm'
    quote: 'nearly all the patriarchs from Shem to Terah were alive at the time of Abram''s migration'

  # ---------- note 11:12 ----------
  - where: 'note 11:12 “Luke’s extra name”'
    claim: 'Septuagint: Arphaxad at 135 begot Cainan; Cainan at 130 begot Sala'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/11.htm'
    quote: 'And Arphaxad lived a hundred and thirty-five years, and begot Cainan.'
  - where: 'note 11:12 “Luke’s extra name”'
    claim: 'Septuagint: Cainan begot Sala at 130'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/11.htm'
    quote: 'And Cainan lived a hundred and thirty years and begot Sala'
  - where: 'note 11:12 “Luke’s extra name”'
    claim: 'Septuagint: Sala at 130, Heber at 134, Phaleg at 130'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/11.htm'
    quote: 'And Sala lived an hundred and thirty years, and begot Heber.'
  - where: 'note 11:12 “Luke’s extra name”'
    claim: 'Septuagint: Heber at 134'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/11.htm'
    quote: 'And Heber lived an hundred and thirty-four years, and begot Phaleg.'
  - where: 'note 11:12 “Luke’s extra name”'
    claim: 'Luke 3:36 has Cainan between Sala and Arphaxad'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Which was the son of Cainan, which was the son of Arphaxad, which was the son of Sem'
  - where: 'note 11:12 “Luke’s extra name”'
    claim: 'The Hebrew, Greek, and Samaritan texts do not agree on early dates'
