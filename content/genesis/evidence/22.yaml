  # ---------- note 22:12 ----------
  - where: 'note 22:12 “Why test what God already knows?”'
    claim: 'Hebrew: ‘attah yada‘ti, “now I know”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-12.htm'
    quote: 'yā·ḏa‘·tî, יָדַ֗עְתִּי I know V‑Qal‑Perf‑1cs'
  - where: 'note 22:12 “Why test what God already knows?”'
    claim: 'George Q. Cannon: God did not do this for His own sake; it was to teach Abraham'
    key: ot-seminary-lesson-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/abraham/lesson-30?lang=eng'
    quote: 'God did not do this for His own sake for He knew by His foreknowledge what Abraham would do; but the purpose was to impress upon Abraham a lesson and to enable him to attain unto knowledge that he could not obtain in any other way.'
  - where: 'note 22:12 “Why test what God already knows?”'
    claim: 'Hugh B. Brown: Abraham needed to learn something about Abraham'
    key: ot-seminary-lesson-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/abraham/lesson-30?lang=eng'
    quote: 'Why … was Abraham commanded to go to Mount Moriah and offer his only hope of posterity?'
  - where: 'note 22:12 “Why test what God already knows?”'
    claim: 'Hugh B. Brown: Abraham needed to learn something about Abraham'
    key: ot-seminary-lesson-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/abraham/lesson-30?lang=eng'
    quote: 'He finally said, ‘Abraham needed to learn something about Abraham’'
  - where: 'note 22:12 “Why test what God already knows?”'
    claim: '“Now I know” confirms that the test was of Abraham’s willingness to do whatever the Lord commanded'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'this is testing whether or not Abraham will do anything that the Lord commands him to do.'

  # ---------- note 22:13 ----------
  - where: 'note 22:13 “A ram in Isaac’s place”'
    claim: 'Tachat, “instead of”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-13.htm'
    quote: 'ta·ḥaṯ תַּ֥חַת instead Prep'
  - where: 'note 22:13 “A ram in Isaac’s place”'
    claim: 'God himself provided the offering; Abraham did not offer from his own herds'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'God, in the end, does not require Abraham to offer an animal sacrifice from his own herds at all. In this case, the offering God himself provided was that of a ram in the place of Isaac.'

