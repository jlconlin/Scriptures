chapter: 22
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Before the command Abraham was living at Beer-sheba'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21?lang=eng'
    quote: 'And Abraham planted a grove in Beer-sheba, and called there on the name of the Lord, the everlasting God.'
  - where: 'setting'
    claim: 'The offering of Isaac was one of Abraham’s last trials'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Abraham’s last trials were the offering of his son, Isaac, and the death of his beloved Sarah.'
  - where: 'setting'
    claim: 'Perhaps the greatest test for Abraham'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'Perhaps the greatest test for Abraham occurred when he was commanded to sacrifice Isaac.'
  - where: 'setting'
    claim: 'The story is known as the “binding of Isaac,” the Akedah'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'certain similarities between that story and details found in the story known as the “binding of Isaac” quickly become obvious'
  - where: 'setting'
    claim: 'The story is known as the “binding of Isaac,” the Akedah'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'Table 1: Hagar and the Akedah'
  - where: 'setting'
    claim: 'The verb “bound” in verse 9 is ‘aqad, “bind”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6123.htm'
    quote: 'verb bind (Late Hebrew id., bind bent limbs together'
  - where: 'setting'
    claim: 'The verb “bound” in verse 9 is ‘aqad, “bind”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-9.htm'
    quote: 'וַֽיַּעֲקֹד֙ and he bound Conj‑w ¦ V‑Qal‑ConsecImperf‑3ms'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Ra’ah, “see,” can mean “provide,” and verse 8 is listed under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/7200.htm'
    quote: 'provide, furnish ,, with accusative of thing Deuteronomy 33:21 (poem), + ל person Genesis 22:8'
  - where: 'thread'
    claim: 'Verse 4: Abraham lifted his eyes and saw (ra’ah) the place'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יִּשָּׂ֨א אַבְרָהָ֧ם אֶת עֵינָ֛י/ו וַ/יַּ֥רְא אֶת הַ/מָּק֖וֹם מֵ/רָחֹֽק'
  - where: 'thread'
    claim: 'Abraham answers God (v. 1), Isaac (v. 7), and the angel (v. 11) with the same phrase'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'when Isaac asks his question in 22:7, Abraham responds to him in the same way he did to the Lord. Abraham says the same thing again in Genesis 22:11'
  - where: 'thread'
    claim: 'The Hebrew in verse 7 is hinneni, “Behold, I”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-7.htm'
    quote: 'hin·nen·nî הִנֶּ֣נִּֽי Behold, I'
  - where: 'thread'
    claim: 'Isaac’s silence is explained by his trust in his father'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'Isaac’s silence can only be explained in terms of his trust in and obedience to his father.'
  - where: 'thread'
    claim: 'The promise is formally confirmed in Genesis 22'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'That promise is formally confirmed in Genesis 22.'

  # ---------- section plain ----------
  - where: 'section 1 plain'
    claim: '“Tempt” rendered “tested”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5254.htm'
    quote: 'test, try, prove, tempt … but not in modern sense of the word … God tests or proves Abraham Genesis 22:1'
  - where: 'section 3 plain'
    claim: 'Jehovah-jireh means “the LORD will see, or provide”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/22?lang=eng'
    quote: 'IE The Lord will see, or provide (v. 8).'
  - where: 'section 4 plain'
    claim: 'Possessing the gate of enemies means taking their cities'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/22.htm'
    quote: 'thy seed shall inherit the cities of their enemies'

  # ---------- note 22:1 ----------
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'The verb is nissah, Piel of nasah'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-1.htm'
    quote: 'nis·sāh נִסָּ֖ה tested V‑Piel‑Perf‑3ms'
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'BDB: test, try, prove, tempt, but not in the modern sense; God tests or proves Abraham'
    key: bdb
    url: 'https://biblehub.com/hebrew/5254.htm'
    quote: 'test, try, prove, tempt … but not in modern sense of the word … God tests or proves Abraham Genesis 22:1'
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'Webster 1828: modern sense is to incite to evil; in Scripture, to try, to prove, citing Gen. 22:1'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/tempt'
    quote: 'To incite or solicit to an evil act'
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'Webster 1828: in Scripture, to try, to prove, citing Gen. 22:1'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/tempt'
    quote: 'In Scripture, to try; to prove; to put to trial for proof. God did tempt Abraham.'
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'The first manuscript of Joseph Smith’s Bible revision reads “God did try Abraham”'
    key: jsp-ot1
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-1/55'
    quote: 'God did try Abraham and said unto him Abraham and Abraham said Behold here am I'
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'The revised manuscript keeps “God did try Abraham”'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/60'
    quote: 'And it came to pass, after these things, that God did try Abraham, And said unto him, Abraham'
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'Hebrews uses the verb for being tried/tested of Abraham'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/hebrews/11-17.htm'
    quote: 'peirazomenos πειραζόμενος   , being tested'
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'D&C 101:4: tried even as Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Therefore, they must needs be chastened and tried, even as Abraham , who was commanded to offer up his only son.'
  - where: 'note 22:1 “To tempt is to test”'
    claim: 'D&C 101 was given when the Saints had been driven from their homes in Jackson County, Missouri'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'At this time the Saints who had gathered in Missouri were suffering great persecution. Mobs had driven them from their homes in Jackson County'

  # ---------- note 22:2 only son ----------
  - where: 'note 22:2 “Only son, though Ishmael lived”'
    claim: 'Yachid means “only one,” especially of an only son; used in 22:2, 12, 16 and of mourning for an only son'
    key: bdb
    url: 'https://biblehub.com/hebrew/3173.htm'
    quote: 'only one , especially of an only son, Genesis 22:2 ,12,16 … mourning for an only son'
  - where: 'note 22:2 “Only son, though Ishmael lived”'
    claim: 'Hebrew of verse 2: yechidecha, “your only”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-2.htm'
    quote: 'yə·ḥî·ḏə·ḵā יְחִֽידְךָ֤ only'
  - where: 'note 22:2 “Only son, though Ishmael lived”'
    claim: 'The Septuagint renders “thy son, the beloved one, whom thou hast loved”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/22.htm'
    quote: 'Take thy son, the beloved one, whom thou hast loved - Isaac, and go into the high land'
  - where: 'note 22:2 “Only son, though Ishmael lived”'
    claim: 'Hebrews 11:17 calls Isaac monogenes, “only begotten”'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/hebrews/11-17.htm'
    quote: 'monogenē μονογενῆ only begotten son Adj-AMS'
  - where: 'note 22:2 “Only son, though Ishmael lived”'
    claim: 'John 3:16 uses the same word, monogenes, of the Son'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/3-16.htm'
    quote: 'monogenē μονογενῆ   , only begotten Adj-AMS'

  # ---------- note 22:2 Moriah ----------
  - where: 'note 22:2 “Where was Moriah?”'
    claim: 'Moriah appears at Gen. 22:2 and 2 Chr. 3:1 (temple site)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4179.htm'
    quote: 'place for sacrificing Isaac, ᵐ5 τ. γῆν τ. ὑψηλήν (text dubious, see Di); ׳ הַר הַמּוֺ 2Chronicles 3:1 site of temple'
  - where: 'note 22:2 “Where was Moriah?”'
    claim: 'Identifying the temple hill with Abraham’s Moriah is a tradition first recorded by Josephus'
    key: bd-moriah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moriah?lang=eng'
    quote: 'Mount Moriah, the hill on which Solomon built the temple ( 2 Chr. 3:1 ); a tradition first recorded by the Jewish historian Josephus, who regards this as identical with (1).'
  - where: 'note 22:2 “Where was Moriah?”'
    claim: 'Josephus identifies the mountain with the temple mount'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-1.html'
    quote: 'It was that mountain upon which King David afterwards built the temple.'
  - where: 'note 22:2 “Where was Moriah?”'
    claim: 'The Septuagint reads “the high land” instead of Moriah'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/22.htm'
    quote: 'and go into the high land, and offer him there for a whole-burnt-offering'
  - where: 'note 22:2 “Where was Moriah?”'
    claim: 'Scripture Helps: tradition holds that Moriah was the temple mount'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'Isaac was to be offered on a mountain in the land of Moriah, which tradition holds was the temple mount in Jerusalem'
  - where: 'note 22:2 “Where was Moriah?”'
    claim: 'Student Manual: Abraham performed the similitude in the same area where the Father would sacrifice His Son'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'Not only did Abraham perform the similitude, but he performed it in the same area in which the Father would make the sacrifice of His Son.'
  - where: 'note 22:2 “Where was Moriah?”'
    claim: 'A Latter-day Saint scholar doubts the location: Jerusalem was fortified and stood on the hilltop; Moriah was some distance from the Negev'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Jerusalem was a fortified city in Abraham’s day … and stood at the top of the hill. It is unlikely that Moriah was at Jerusalem. Moriah was, however, some distance from the area in the Negev where Abraham lived'

  # ---------- note 22:2 burnt offering ----------
  - where: 'note 22:2 “Why would God ask for a human sacrifice?”'
    claim: '‘Olah: whole burnt offering, “that which goes up”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5930.htm'
    quote: 'whole burnt-offering ( that which goes up'
  - where: 'note 22:2 “Why would God ask for a human sacrifice?”'
    claim: 'The burnt offering was named for the rising smoke and was burned whole'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The burnt offering got its Hebrew name from the idea of the smoke of the sacrifice ascending to heaven. The characteristic rite was the burning of the whole animal on the altar'
  - where: 'note 22:2 “Why would God ask for a human sacrifice?”'
    claim: 'The test touched the integrity of God; Abraham knew God forbids human sacrifice'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'But an equally difficult, if not greater, test was what could be described as the question of the integrity of God.'
  - where: 'note 22:2 “Why would God ask for a human sacrifice?”'
    claim: 'Abraham knew God forbids human sacrifice; the command would end the covenant line'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'Abraham knew that the law of God forbids human sacrifice or murder of any sort.'
  - where: 'note 22:2 “Why would God ask for a human sacrifice?”'
    claim: 'Human sacrifice was known in the ancient world but rejected by later biblical authors; Abraham had nearly been sacrificed'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Human sacrifice wass known elsewhere in the ancient world … but was rejected by later biblical authors.'

  # ---------- note 22:5 ----------
  - where: 'note 22:5 “Both of them will come back”'
    claim: 'The verbs are first-person plural: we will worship, we will come back'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-5.htm'
    quote: 'וְנִֽשְׁתַּחֲוֶ֖ה and we will worship Conj‑w ¦ V‑Hitpael‑ConjImperf‑1cp'
  - where: 'note 22:5 “Both of them will come back”'
    claim: 'The verbs are first-person plural: we will come back'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-5.htm'
    quote: 'wə·nā·šū·ḇāh וְנָשׁ֥וּבָה and we will come back Conj‑w ¦ V‑Qal‑ConjImperf.Cohort‑1cp'

  # ---------- note 22:6 Isaac's age ----------
  - where: 'note 22:6 “How old was Isaac?”'
    claim: 'The same Hebrew word is used for the servants (“young men”) and for Isaac (“the lad”)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-5.htm'
    quote: 'nə·‘ā·rāw, נְעָרָ֗יו his young men'
  - where: 'note 22:6 “How old was Isaac?”'
    claim: 'The same Hebrew word is used for Isaac (“the lad”)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-5.htm'
    quote: 'wə·han·na·‘ar, וְהַנַּ֔עַר and the boy'
  - where: 'note 22:6 “How old was Isaac?”'
    claim: 'Isaac was 37 at Sarah’s death; he could have been in his thirties; exact age not important'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'Thus, Isaac would have been 37 at the time of her death.'
  - where: 'note 22:6 “How old was Isaac?”'
    claim: 'Isaac could have been in his thirties; exact age not important'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'Isaac could have been in his thirties, as was the Savior at the time of His Crucifixion. Nevertheless, Isaac’s exact age is not really important.'
  - where: 'note 22:6 “How old was Isaac?”'
    claim: 'Josephus says Isaac was twenty-five'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-1.html'
    quote: 'Now Isaac was twenty-five years old'
  - where: 'note 22:6 “How old was Isaac?”'
    claim: 'Strong enough to carry the wood, he was likely strong enough to resist'
    key: sc-knowhy-412
    url: 'https://scripturecentral.org/knowhy/how-abrahams-sacrifice-of-isaac-illuminates-the-atonement'
    quote: 'If Isaac was strong enough to carry the wood for a burnt offering on his back, he was likely strong enough to overpower his aged father if he had not wanted to be sacrificed.'
  - where: 'note 22:6 “How old was Isaac?”'
    claim: 'Scripture Helps: Isaac was an adult and a willing participant'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'While Isaac’s age is not mentioned in the Bible, events in the account suggest he was an adult—and a willing participant.'

