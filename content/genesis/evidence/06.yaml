chapter: 6
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Noah was five hundred at the end of chapter 5 and six hundred when the Flood came'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/7?lang=eng'
    quote: 'And Noah was six hundred years old when the flood of waters was upon the earth.'
  - where: 'setting'
    claim: 'Genesis is built on sections that begin “These are the generations”; the Bible Dictionary gives chapters 4–9 to Noah'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'The structure of the book of Genesis rests on several genealogies. Each new section begins “These are the generations,”'
  - where: 'setting'
    claim: 'The Bible Dictionary’s division for Noah is Genesis 4–9'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Noah ( Gen. 4–9 ). The line of Cain branching off'
  - where: 'setting'
    claim: 'The Book of Moses is part of the Joseph Smith Translation'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'The Joseph Smith Translation especially, a portion of which is presented in the book of Moses'
  - where: 'setting'
    claim: 'Moses 8 adds that Noah was ordained and sent to declare the gospel, and that the people sought his life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'commanded him that he should go forth and declare his Gospel unto the children of men, even as it was given unto Enoch'
  - where: 'setting'
    claim: 'Later scripture returns to Noah (Isaiah, Ezekiel, Matthew, Hebrews, Peter); latter-day revelation confirms the account'
    key: bd-noah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/noah?lang=eng'
    quote: 'The authenticity of the Genesis account of the Flood is confirmed by latter-day revelation as recorded in Moses 7:34, 42–43 ; 8:8–30'
  - where: 'setting'
    claim: 'Other references to Noah include Isaiah 54:9 and Ezekiel 14:14'
    key: bd-noah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/noah?lang=eng'
    quote: 'Other references to Noah are Isa. 54:9 ; Ezek. 14:14, 20 ; Matt. 24:37–38'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Genesis 1:31 opens “and God saw … and behold” (vayyar Elohim … vehinneh)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/1-31.htm'
    quote: 'way·yar וַיַּ֤רְא And saw'
  - where: 'thread'
    claim: 'Genesis 1:31 continues “and behold, very good”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/1-31.htm'
    quote: 'wə·hin·nêh- וְהִנֵּה־ and behold'
  - where: 'thread'
    claim: 'Genesis 6:12 opens “and God saw”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-12.htm'
    quote: 'way·yar וַיַּ֧רְא And saw'
  - where: 'thread'
    claim: 'Genesis 6:12 opens with the same words, “and God saw … and behold”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-12.htm'
    quote: 'wə·hin·nêh וְהִנֵּ֣ה and behold'
  - where: 'thread'
    claim: '“God saw … and behold” in 6:12 reverses the verdict of 1:31'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: '“The Lord saw” is a reversal of the positive evaluation of everything God created ([Genesis] 1:31)'
  - where: 'thread'
    claim: 'What had been declared good in the Creation was now reversed and undone through wickedness'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'All that had been declared “good” by God in creation was now reversed and undone through wickedness.'
  - where: 'thread'
    claim: 'Verse 7 uses the language of Creation (man, beast, creeping things, fowls of the air)'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'Genesis 6:7 and Moses 8:26 set the stage for covenantal restoration as they employ the language of Creation ( man , beast , creeping things , and fowls of the air )'
  - where: 'thread'
    claim: 'The Flood is commonly read as a re-creation, paralleling the Creation'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'It is commonly accepted in biblical studies that the flood constitutes a re-creation of life, paralleling the context and language of the creation stories in Genesis.'
  - where: 'thread'
    claim: 'In Genesis 5:29 “comfort” is the verb nacham'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/5-29.htm'
    quote: 'יְנַחֲמֵ֤נוּ shall give us comfort'
  - where: 'thread'
    claim: 'In Genesis 5:29 “toil” is ‘itstsavon (letters ‘-ts-b)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/5-29.htm'
    quote: 'ū·mê·‘iṣ·ṣə·ḇō·wn וּמֵעִצְּב֣וֹן and from the toil'
  - where: 'thread'
    claim: 'In 6:6 “repented” is the same verb nacham'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-6.htm'
    quote: 'way·yin·nā·ḥem וַיִּנָּ֣חֶם And regretted'
  - where: 'thread'
    claim: 'The verb “grieved” in 6:6 is the root of the “toil” of 5:29'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'is paralleled by the anguish of God (the verb ʿṣb, “it grieved him,” v. 6)'
  - where: 'thread'
    claim: 'In 6:6 “grieved” is from the letters ‘-ts-b'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-6.htm'
    quote: 'way·yiṯ·‘aṣ·ṣêḇ וַיִּתְעַצֵּ֖ב and He was grieved'
  - where: 'thread'
    claim: 'Genesis 6:18 is the first time the word covenant (berit) appears in the Bible'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'see Genesis 6:18 for the first instance of the Hebrew word'

  # ---------- section plains ----------
  - where: 'section 2 plain'
    claim: '“Repented” rendered “was sorry”; nacham means be sorry, rue'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'be sorry, rue, suffer grief, repent , of one''s own doings'
  - where: 'section 2 plain'
    claim: '“Imagination” rendered as what the heart devised; yetser is imagination, device, purpose'
    key: bdb
    url: 'https://biblehub.com/hebrew/3336.htm'
    quote: 'imagination, device, purpose'
  - where: 'section 2 plain'
    claim: '“Grace” rendered “favor”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2580.htm'
    quote: 'favour, grace'
  - where: 'section 3 plain'
    claim: '“Perfect” rendered “of complete integrity”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'sound, wholesome, unimpaired, innocent, having integrity'
  - where: 'section 3 plain'
    claim: '“Generations” rendered “family history”'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'there follows a genealogical list of certain portions of family history'
  - where: 'section 4 plain'
    claim: 'The “window” may be a roof'
    key: bdb
    url: 'https://biblehub.com/hebrew/6672.htm'
    quote: 'noun feminine probably roof'

  # ---------- note 6:2 ----------
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: 'The Hebrew phrase is bene ha-Elohim'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-2.htm'
    quote: 'hā·’ĕ·lō·hîm הָֽאֱלֹהִים֙ of God'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: 'In Job the phrase “sons of God” is used of angels'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/6.htm'
    quote: 'in Job 1:6 ; Job 2:1 , and Job 38:7 , and in Daniel 3:25 , are unquestionably angels'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: 'Readings of the phrase include angels and the godly line of Seth'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/6.htm'
    quote: 'being regarded as (a) the sons of princes, (b) angels, (c) the Sethites or godly men'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: 'The phrase cannot be settled by language alone'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/6.htm'
    quote: 'cannot be elucidated by philological means, but must be interpreted by theology alone'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: 'Scripture also calls God’s people His sons (Hos. 1:10)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/6.htm'
    quote: 'in Deuteronomy 32:5 the Israelites are called His (God''s) sons, and in Hosea 1:10 , "sons of the living God;"'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: '1 Enoch retells the verses as angels lusting after women'
    key: charles-1-enoch
    url: 'https://archive.org/download/apocryphapseudep02charuoft/apocryphapseudep02charuoft_djvu.txt'
    quote: 'And the angels, the children of the heaven, saw and lusted after them'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: 'The 1 Enoch story arises from Genesis 6:1–4'
    key: charles-1-enoch
    url: 'https://archive.org/download/apocryphapseudep02charuoft/apocryphapseudep02charuoft_djvu.txt'
    quote: 'The entire myth of the angels and the daughters of men in Enoch arises from Gen. vi. 1-4'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: '1 Enoch was written before Christ (about 250–100 BC)'
    key: sc-knowhy-835
    url: 'https://scripturecentral.org/knowhy/why-does-genesis-say-that-enoch-walked-with-god-and-that-god-took-him'
    quote: 'The oldest surviving apocryphal text about Enoch, 1 Enoch, was likely written over time between roughly 250 and 100 BC'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: 'Moses 8:13–15, 21: Noah and his sons were called the sons of God; the daughters of Noah’s sons married the sons of men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'And the Lord said unto Noah: The daughters of thy sons have sold themselves'
  - where: 'note 6:2 “Who were the sons of God?”'
    claim: 'Joseph Fielding Smith: the daughters of priesthood holders married out of the Church'
    key: ot-manual-gen-4-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-4-11-the-patriarchs?lang=eng'
    quote: 'the daughters of the sons of God, that is to say of those who held the priesthood, were transgressing the commandment of the Lord and were marrying out of the Church'

  # ---------- note 6:3 strive ----------
  - where: 'note 6:3 “Will not always strive”'
    claim: 'The Hebrew verb is yadon'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-3.htm'
    quote: 'yā·ḏō·wn יָד֨וֹן shall strive'
  - where: 'note 6:3 “Will not always strive”'
    claim: 'The verb is dubious and occurs only here'
    key: bdb
    url: 'https://biblehub.com/hebrew/1777.htm'
    quote: 'verb dubious; only in'
  - where: 'note 6:3 “Will not always strive”'
    claim: 'The ancient versions read “abide in, dwell”: My spirit will not abide in man for ever'
    key: bdb
    url: 'https://biblehub.com/hebrew/1777.htm'
    quote: 'abide in, dwell , — My spirit will not abide in man for ever'
  - where: 'note 6:3 “Will not always strive”'
    claim: 'The Septuagint reads “remain among”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/6.htm'
    quote: 'My Spirit shall certainly not remain among these men for ever, because they are flesh'
  - where: 'note 6:3 “Will not always strive”'
    claim: 'Moses 8:17 keeps “strive” and adds “for he shall know that all flesh shall die”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'My Spirit shall not always strive with man, for he shall know that all flesh shall die'

  # ---------- note 6:3 120 years ----------
  - where: 'note 6:3 “A hundred and twenty years to repent”'
    claim: 'Many scholars with only Genesis read the verse as a shortened lifespan'
    key: ot-manual-gen-4-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-4-11-the-patriarchs?lang=eng'
    quote: 'Many scholars, who have only Genesis to study, believe that this statement prophesied the shortened life expectancy that would take place after the Flood.'
  - where: 'note 6:3 “A hundred and twenty years to repent”'
    claim: 'One commentary without the Book of Moses reads the 120 years as a respite, not a lifespan'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/6.htm'
    quote: 'not that human life should in future never attain a greater age than 120 years, but that a respite of 120 years should still be granted to the human race'
  - where: 'note 6:3 “A hundred and twenty years to repent”'
    claim: 'The sentence was to be published by Noah as “preacher of righteousness”'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/6.htm'
    quote: 'to be published by him as "preacher of righteousness"'
  - where: 'note 6:3 “A hundred and twenty years to repent”'
    claim: 'The Church’s reading: the 120 years were the time allotted for Noah to preach repentance'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'The book of Moses clarifies that 120 years was the amount of time God allotted for Noah to preach repentance before He sent the Flood.'
  - where: 'note 6:3 “A hundred and twenty years to repent”'
    claim: 'Moses 8:17: if men do not repent, the floods will come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'yet his days shall be an hundred and twenty years; and if men do not repent, I will send in the floods upon them'

  # ---------- note 6:4 giants ----------
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'The Hebrew word is nephilim'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-4.htm'
    quote: 'han·nə·p̄i·lîm הַנְּפִלִ֞ים The Nephilim'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: '“Giants” follows the Septuagint’s gigantes'
    key: bdb
    url: 'https://biblehub.com/hebrew/5303.htm'
    quote: 'noun masculine plural giants , according to'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'The Septuagint reads “giants”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/6.htm'
    quote: 'Now the giants were upon the earth in those days'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'The etymology is dubious; all conjectures very precarious'
    key: bdb
    url: 'https://biblehub.com/hebrew/5303.htm'
    quote: 'etymology dubious'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'All proposed etymologies are very precarious'
    key: bdb
    url: 'https://biblehub.com/hebrew/5303.htm'
    quote: 'all very precarious'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'The word looks like a form of naphal, “to fall”'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'a root meaning “to fall,” perhaps as in “fallen one”'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'The only other passage with the word is Numbers 13:33'
    key: bdb
    url: 'https://biblehub.com/hebrew/5303.htm'
    quote: 'Numbers 13:33 (JE)'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'One reading: from naphal “fall upon,” men who fell upon and oppressed the people (tyrants)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/6.htm'
    quote: 'they were called Nephilim because they fell upon the people and oppressed them'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'The Church’s newest reading: nephilim can mean “fallen ones”; stature unclear; perhaps a description of their fallen spiritual state'
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'can also mean “fallen ones.” It is not clear if these people were large in stature, and the term may simply have been a description of their fallen spiritual state.'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'Moses 8:18: the giants sought Noah’s life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'And in those days there were giants on the earth, and they sought Noah to take away his life'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'The word may refer to apostates who had fallen from the truth'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'may not have reference to tall people but rather to apostates who had fallen from the truth'
  - where: 'note 6:4 “Giants, or fallen ones?”'
    claim: 'Moses 8:21: “men of great renown” is the people’s boast'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'And our wives bear unto us children, and the same are mighty men, which are like unto men of old, men of great renown.'

  # ---------- note 6:5 ----------
  - where: 'note 6:5 “The imagination of the heart”'
    claim: '“Imagination” is yetser'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-5.htm'
    quote: 'yê·ṣer יֵ֙צֶר֙ inclination'
  - where: 'note 6:5 “The imagination of the heart”'
    claim: 'Yetser can mean a potter’s vessel, “formed by the potter”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3336.htm'
    quote: 'pottery , formed by the potter'
  - where: 'note 6:5 “The imagination of the heart”'
    claim: 'Yetser: what is framed in the mind, imagination, device, purpose'
    key: bdb
    url: 'https://biblehub.com/hebrew/3336.htm'
    quote: 'of what is framed in the mind'
  - where: 'note 6:5 “The imagination of the heart”'
    claim: 'The same word is used in Genesis 8:21'
    key: bdb
    url: 'https://biblehub.com/hebrew/3336.htm'
    quote: 'Genesis 8:21 (J)'
  - where: 'note 6:5 “The imagination of the heart”'
    claim: '“Continually” is literally “all the day”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-5.htm'
    quote: 'kāl- כָּל־ all … hay·yō·wm. הַיּֽוֹם׃ the day'

  # ---------- note 6:6 repented ----------
  - where: 'note 6:6 “Can God repent?”'
    claim: 'The verb is nacham'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/6-6.htm'
    quote: 'way·yin·nā·ḥem וַיִּנָּ֣חֶם And regretted'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'Nacham: be sorry, moved to pity, have compassion'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'be sorry, moved to pity, have compassion , for others'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'Nacham: be sorry, rue, suffer grief, repent of one’s own doings'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'be sorry, rue, suffer grief, repent , of one''s own doings'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'A different Hebrew word is used for remorse for sin'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'A different Hebrew word is used when indicating remorse for sin and is the one more often translated as “repent” in the Old Testament.'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'Joseph Smith, 15 October 1843: he believed the Bible as it came from the original writers; Gen. 6:6 conflicts with Num. 23:19'
    key: jsp-history-e1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/127'
    quote: 'I believe the bible as it read when it came from the pen of the original writers'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'Joseph Smith: it ought to read “it repented Noah that God made man”'
    key: jsp-history-e1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/127'
    quote: 'which I do not believe; but it ought to read ‘it repented Noah that God made man’ This I believe, and then the other quotation stands fair.'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'The discourse was given in 1843 (15 October)'
    key: jsp-history-e1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/127'
    quote: 'October 15'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'Moses 8:25 reads “it repented Noah”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'And it repented Noah, and his heart was pained that the Lord had made man on the earth'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'The Septuagint: God laid it to heart and pondered it deeply'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/6.htm'
    quote: 'then God laid it to heart that he had made man upon the earth, and he pondered it deeply'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'Genesis 6:6 and Moses 8:25 show God and Noah filled with pity'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'Genesis 6:6 and Moses 8:25 depict both God and Noah being filled with pity toward the wicked state of the people'
  - where: 'note 6:6 “Can God repent?”'
    claim: 'The Lord is not repenting of creating His children but is about to have compassion on them'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'The Lord is not repenting for creating his children; rather, he is about to have compassion on them'

  # ---------- note 6:6 grieved ----------
  - where: 'note 6:6 “The God who weeps”'
    claim: 'The Hebrew of “grieved him at his heart”'
