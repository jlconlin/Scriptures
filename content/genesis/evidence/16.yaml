chapter: 16
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Abram was seventy-five when he left Haran; Hagar is given ten years after he came into Canaan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'Abram was seventy and five years old when he departed out of Haran.'
  - where: 'setting'
    claim: 'Sarai’s offer of Hagar follows a practice known elsewhere in the region for a childless wife (Nuzi parallel)'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'the Genesis account seems to follow a practice witnessed elsewhere in the region'
  - where: 'setting'
    claim: 'The two Hagar stories (Gen. 16 and 21) both revolve around the near-death of Hagar and Ishmael, and parallel the offering of Isaac'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'Genesis 16:4–16 and Genesis 21:9–21 revolve around the near-death of Hagar and her son Ishmael.'
  - where: 'setting'
    claim: 'The second Hagar story (Gen. 21) is told much like the offering of Isaac (Gen. 22)'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'The similarities (not necessarily in the same order) between the narratives in Genesis 21 and 22 are as follows'
  - where: 'setting'
    claim: 'Latter-day revelation says God commanded the marriage and that Hagar’s descendants were part of the promises to Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'God commanded Abraham, and Sarah gave Hagar to Abraham to wife. And why did she do it? Because this was the law; and from Hagar sprang many people.'
  - where: 'setting'
    claim: 'Paul uses the story as an allegory of two covenants, one of bondage and one of freedom'
    key: bd-hagar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hagar?lang=eng'
    quote: 'Paul uses the story as an allegory to show the difference between the two covenants, the one a covenant of bondage and the other one of freedom'
  - where: 'setting'
    claim: 'The narrative is silent for thirteen years after Ishmael’s birth'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'For thirteen years, the narrative is silent about Hagar and everyone else in Abraham’s household.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The sight words of verse 4 (“she saw,” “in her eyes”) mark a shift in Hagar’s perception'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'The sight words that begin and end this moment—“she saw” and “in her eyes”—reveal a shift in Hagar’s perception.'
  - where: 'thread'
    claim: 'Verse 6 in Hebrew: do to her “what is good in your eyes”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-6.htm'
    quote: 'haṭ·ṭō·wḇ הַטּ֣וֹב what is good Art ¦ Adj‑ms … bə·‘ê·nā·yiḵ; בְּעֵינָ֑יִךְ in your eyes'
  - where: 'thread'
    claim: 'Verse 2: Abram “listened” (shama‘, Strong’s 8085) to the voice of Sarai'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-2.htm'
    quote: 'way·yiš·ma‘ וַיִּשְׁמַ֥ע And listened'
  - where: 'thread'
    claim: 'Verse 11: the LORD has heard (shama‘, the same verb) her affliction'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-11.htm'
    quote: 'šā·ma‘ שָׁמַ֥ע has listened V‑Qal‑Perf‑3ms … Yah·weh יְהוָ֖ה YHWH'
  - where: 'thread'
    claim: 'Abram and Sarai never call Hagar by name, only “my maid”'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'coupled with how Abraham and Sarah refer to her only as Sarah’s'
  - where: 'thread'
    claim: '‘anah (Piel) in 16:6, “humble, mishandle, afflict”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: '1 humble, mishandle, afflict: individual Genesis 16:6'
  - where: 'thread'
    claim: 'The same verb (Hithpael) in 16:9, “humble oneself” under her hands'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: '1 humble oneself (with תַּחַת יָדֶיהָ ) Genesis 16:9'
  - where: 'thread'
    claim: 'BDB places ‘oni, “affliction,” in the section of the root ‘anah III, “be bowed down, afflicted”'
    key: bdb
    url: 'https://raw.githubusercontent.com/openscriptures/HebrewLexicon/master/BrownDriverBriggs.xml'
    quote: 'vb. be bowed down, afflicted'
  - where: 'thread'
    claim: '‘oni: noun, “affliction,” in the same root section (p. 777)'
    key: bdb
    url: 'https://raw.githubusercontent.com/openscriptures/HebrewLexicon/master/BrownDriverBriggs.xml'
    quote: 'עֳנִי n.m. affliction, poverty'
  - where: 'thread'
    claim: '‘oni in Gen. 16:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/6040.htm'
    quote: 'noun masculine affliction, poverty'

  # ---------- section plains ----------
  - where: 'section 3 plain'
    claim: 'Second half of v. 13 can be rendered “Have I really seen him here who sees me?”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2016&version=ESV'
    quote: 'Hebrew Have I really seen him here who sees me?'
  - where: 'section 3 plain'
    claim: 'Beer-lahai-roi: well of the living One that sees me'
    key: bdb
    url: 'https://biblehub.com/hebrew/883.htm'
    quote: 'literally well of the living One that seeth me'
  - where: 'section 2 plain'
    claim: 'Verse 12 literally: “over against the face of all his brothers he shall dwell”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-12.htm'
    quote: 'wə·‘al- וְעַל־ and over against Conj‑w ¦ Prep … pə·nê פְּנֵ֥י the face'

  # ---------- note 16:1 ----------
  - where: 'note 16:1 “Who Hagar was”'
    claim: 'shiphchah: a maid-servant as belonging to a mistress (Gen. 16:1, 3, 6, 8)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8198.htm'
    quote: 'literally, maid, maid-servant , as belonging to a mistress Genesis 16:1 ,3,6,8'
  - where: 'note 16:1 “Who Hagar was”'
    claim: 'shiphchah is used even where she is the master’s concubine (Gen. 16:2, 5)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8198.htm'
    quote: 'even where concubine of master'
  - where: 'note 16:1 “Who Hagar was”'
    claim: 'How Hagar came into Sarah’s service is uncertain'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'How Hagar came to be in servitude to Sarah is uncertain.'
  - where: 'note 16:1 “Who Hagar was”'
    claim: 'Early rabbis conjectured she was a gift from Pharaoh (Gen. 12:16)'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'Was she, as early rabbis conjectured, a gift from the Pharaoh received during Abraham’s time in Egypt'
  - where: 'note 16:1 “Who Hagar was”'
    claim: 'Hagar was Sarah’s enslaved Egyptian maid'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'this includes Sarah’s decision to give her enslaved Egyptian maid Hagar to Abraham as a concubine'

  # ---------- note 16:2 ----------
  - where: 'note 16:2 “Built up through her”'
    claim: 'Hebrew of verse 2: ’ulay ’ibbaneh mimmennah, “perhaps I shall be built up from her”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-2.htm'
    quote: '’ū·lay אוּלַ֥י perhaps Adv … ’ib·bā·neh אִבָּנֶ֖ה I shall be built up V‑Nifal‑Imperf‑1cs … mim·mên·nāh; מִמֶּ֑נָּה from her'
  - where: 'note 16:2 “Built up through her”'
    claim: 'banah of a childless wife by means of a concubine: become the mother of a family; also Gen. 30:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/1129.htm'
    quote: 'of childless wife, by means of concubine אִבָּנֶה מִמֶּגָּה Genesis 16:2 ; Genesis 30:3 I shall be built up , i.e. become the mother of a family, from or through her'
  - where: 'note 16:2 “Built up through her”'
    claim: '“Built up” sounds like the Hebrew for children'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2016&version=ESV'
    quote: 'Genesis 16:2 Hebrew be built up , which sounds like the Hebrew for children'
  - where: 'note 16:2 “Built up through her”'
    claim: 'A second wife was known but uncommon, usually for childlessness, sickness or misconduct, with the first wife’s consent'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'but not commonly practiced. It was usually under conditions of childlessness, sickness, or misconduct, and with the consent of the first wife.'
  - where: 'note 16:2 “Built up through her”'
    claim: 'Here: childlessness and the instigation of the first wife'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'childlessness and not just the consent but the instigation of the first wife (Genesis 16:2)'
  - where: 'note 16:2 “Built up through her”'
    claim: 'The Nuzi texts, from Mesopotamia, mid-second millennium BC'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'a similar custom was followed in Mesopotamia during this period. The Nuzi texts, written by the Hurrians in the mid-second millennium BC'
  - where: 'note 16:2 “Built up through her”'
    claim: 'Under Nuzi law the barren wife was to choose a second wife for her husband'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'according to Nuzi law, the barren wife bore the responsibility to choose a second wife for her husband in the event of infertility'
  - where: 'note 16:2 “Built up through her”'
    claim: 'Sarah is first named as the mother in Gen. 17:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'Sarah thy wife shall bear thee a son indeed; and thou shalt call his name Isaac'
  - where: 'note 16:2 “Built up through her”'
    claim: 'The promise of numberless posterity in Gen. 15:4–5 was made to Abraham and did not name Sarah'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'What did it feel like to believe that the Lord’s promise of numberless posterity made to her husband did not include her as well (Genesis 15:4–5)?'
  - where: 'note 16:2 “Built up through her”'
    claim: 'Abraham and Sarah waited on the Lord many years'
    key: sc-knowhy-838
    url: 'https://scripturecentral.org/knowhy/why-did-the-lord-tell-abraham-that-neither-his-servant-nor-ishmael-would-be-his-heir'
    quote: 'Abraham and Sarah waited together on the Lord for many, many years.'
  - where: 'note 16:2 “Built up through her”'
    claim: 'Their steps fit the law codes and were also acts of faith toward the promises'
    key: sc-knowhy-838
    url: 'https://scripturecentral.org/knowhy/why-did-the-lord-tell-abraham-that-neither-his-servant-nor-ishmael-would-be-his-heir'
    quote: 'This was consistent with the norms in the law codes of the day but were also acts of faith as they tried to fulfill the Lord’s promises.'

  # ---------- note 16:3 ----------
  - where: 'note 16:3 “Commanded, says latter-day revelation”'
    claim: 'D&C 132:35: Abraham not under condemnation, for the Lord commanded it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'Was Abraham, therefore, under condemnation? Verily I say unto you, Nay; for I, the Lord, commanded it.'
  - where: 'note 16:3 “Commanded, says latter-day revelation”'
    claim: 'D&C 132:65: Sarah administered according to the law when the Lord commanded Abraham to take Hagar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'who administered unto Abraham according to the law when I commanded Abraham to take Hagar to wife'
  - where: 'note 16:3 “Commanded, says latter-day revelation”'
    claim: 'The idea was likely not Sarah’s alone'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'The idea to give Hagar to Abraham, however, was likely not Sarah’s alone.'
  - where: 'note 16:3 “Commanded, says latter-day revelation”'
    claim: 'D&C 132:34, 65 indicate the Lord revealed the plan to Sarah and Abraham'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'indicating that the Lord revealed the plan to Sarah and Abraham'
  - where: 'note 16:3 “Commanded, says latter-day revelation”'
    claim: 'The Church reads the marriage as a commandment Abraham and Sarah obeyed'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'From latter-day revelation we understand that this was a commandment from God that Abraham and Sarah obeyed.'
  - where: 'note 16:3 “Commanded, says latter-day revelation”'
    claim: 'D&C 132:37: Isaac and Jacob did only what they were commanded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'as Isaac also and Jacob did none other things than that which they were commanded'
  - where: 'note 16:3 “Commanded, says latter-day revelation”'
    claim: 'Monogamy is the Lord’s standing law of marriage; in biblical times He commanded some to practice plural marriage'
    key: gte-plural-marriage-kirtland
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/plural-marriage-in-kirtland-and-nauvoo?lang=eng'
    quote: 'Latter-day Saints believe that monogamy—the marriage of one man and one woman—is the Lord’s standing law of marriage. In biblical times, the Lord commanded some of His people to practice plural marriage'
  - where: 'note 16:3 “Commanded, says latter-day revelation”'
    claim: 'Divine approval did not make the marriages easier'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'divine approval did not make the actual marriages any easier'

  # ---------- note 16:4 ----------
  - where: 'note 16:4 “Sarai grew small in her eyes”'
    claim: 'qalal: be slight; of a person, trifling, of little account (Gen. 16:4, 5)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: '3 trifling , i.e. of little account., of person, Genesis 16:4 ,5'
  - where: 'note 16:4 “Sarai grew small in her eyes”'
    claim: 'qalal, sense 1: be slight'
    key: bdb
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: '1 be slight , of water, be abated'
  - where: 'note 16:4 “Sarai grew small in her eyes”'
    claim: 'Hebrew of verse 4: watteqal ... be‘eneha'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-4.htm'
    quote: 'wat·tê·qal וַתֵּקַ֥ל and became despised'
  - where: 'note 16:4 “Sarai grew small in her eyes”'
    claim: 'Code of Hammurabi §146: a maid given as wife who bears children and assumes equality with the wife may not be sold but may be kept as a slave'
    key: hammurabi-king
    url: 'https://avalon.law.yale.edu/ancient/hamcode.asp'
    quote: 'and then this maid assume equality with the wife: because she has borne him children her master shall not sell her for money, but he may keep her as a slave, reckoning her among the maid-servants.'
  - where: 'note 16:4 “Sarai grew small in her eyes”'
    claim: 'Legally the first wife took precedence over the second and had power over her'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'Legally, Sarah, as the first wife, takes precedence over the second wife and has power over her.'
  - where: 'note 16:4 “Sarai grew small in her eyes”'
    claim: 'Hagar’s pregnancy raised her status, and the two women’s standing in the household was in flux'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'Carrying Abraham’s child raises Hagar’s status within the household'
  - where: 'note 16:4 “Sarai grew small in her eyes”'
    claim: 'Sarah’s harshness may echo this custom, treating Hagar as an ordinary slave rather than as family'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'This custom may echo Sarah’s response to Hagar by … perhaps treating her like a regular enslaved servent rather than as part of the family'

  # ---------- note 16:5 ----------
  - where: 'note 16:5 “The wrong done to me”'
    claim: 'chamas: violence, wrong; Gen. 6:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/2555.htm'
    quote: 'violence, wrong — absolute ׳ ח Genesis 6:11 + 44 t.'
  - where: 'note 16:5 “The wrong done to me”'
    claim: 'With the suffix in Gen. 16:5 and Jer. 51:35 it means “wrong done to me”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2555.htm'
    quote: 'suffix חֲמָסִי Genesis 16:5 ; Jeremiah 51:35 (in both = wrong done to me )'
  - where: 'note 16:5 “The wrong done to me”'
    claim: 'Hebrew of verse 5: chamasi ‘aleka'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-5.htm'
    quote: 'ḥă·mā·sî חֲמָסִ֣י My wrong … ‘ā·le·ḵā עָלֶיךָ֒ upon you'
  - where: 'note 16:5 “The wrong done to me”'
    claim: 'Sarah seems to feel she made a mistake, answering being despised with a rejoinder to her husband'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Sarah seems to feel that she has made a mistake on some level since she responds to being despised with a rejoinder to her husband'

  # ---------- note 16:6 ----------
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: 'Abram’s answer reasserts Hagar’s status as bondwoman and Sarah’s role in the household'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'In turning the matter over to Sarah, Abraham reasserts Hagar’s status as a bondwoman and reinforces Sarah’s managerial role in running the household.'
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: 'Hebrew of verse 6: watte‘anneha, “and dealt harshly with her”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/16-6.htm'
    quote: 'wat·tə·‘an·ne·hā וַתְּעַנֶּ֣הָ And dealt harshly with her'
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: '‘anah (Piel) of a nation in bondage: Gen. 15:13; Ex. 1:11–12'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: 'a nation by war or in bondage Genesis 15:13 (J) Exodus 1:11,12'
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: 'Hagar’s affliction is linked to what the Lord told Abraham of his descendants’ affliction (Gen. 15:13)'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'Hagar’s ordeal finds a type with what the Lord prophesied to Abraham: his posterity would live in a strange land where they would be afflicted (Genesis 15:13).'
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: 'What Sarah did is not known'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'Whether this implies Sarah treated Hagar as her maidservant—asking her to clean or fetch water—or suggests actual abuse we do not know.'
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: 'The same word describes the Hebrews’ suffering under the Egyptians'
    key: easton-hagar
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/you-are-god-who-sees-me'
    quote: 'notably, the same word describes the suffering of the Hebrews when they were enslaved by the Egyptians'
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: 'The Hagar story is the flight of an Egyptian from the ancestors of the Hebrews'
    key: sc-knowhy-839
    url: 'https://scripturecentral.org/knowhy/why-might-similarities-between-the-expulsion-of-hagar-and-abraham-s-near-sacrifice-of-isaac-be-meaningful-and-significant'
    quote: 'The Bible will later tell the story about the flight of the Hebrews from Egypt, but the Hagar narrative tells the story of the flight of Hagar, an Egyptian, from the ancestors of the Hebrews'
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: 'All three acted in very human ways'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Hagar’s taking advantage of her mistress’s infertility for self-aggrandizement, Sarah’s dealing harshly with Hagar, and Abraham’s unwillingness to intervene in the struggles between his wives are very human responses'
  - where: 'note 16:6 “Afflicted, as Israel would be in Egypt”'
    claim: 'Despite imperfections, all three loved the Lord and were blessed by Him'
    key: scripture-helps-gen-12-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/07-genesis-12-17-abraham-1-2?lang=eng'
    quote: 'Despite their circumstances and imperfections, Abraham, Sarah, and Hagar loved the Lord and were greatly blessed by Him.'

