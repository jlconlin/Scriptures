chapter: 18
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Abraham was ninety-nine at the covenant of chapter 17, and Isaac was promised for the next year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'But my covenant will I establish with Isaac, which Sarah shall bear unto thee at this set time in the next year.'
  - where: 'when'
    claim: 'Abraham lived by the oaks of Mamre at Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/13?lang=eng'
    quote: 'Then Abram removed his tent, and came and dwelt in the plain of Mamre, which is in Hebron'
  - where: 'setting'
    claim: 'Hebron, also called Mamre, lies about twenty miles south of Jerusalem'
    key: bd-hebron
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hebron?lang=eng'
    quote: '20 miles south of Jerusalem; known also as Mamre and Kirjath-arba'
  - where: 'setting'
    claim: 'Lot had moved into Sodom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/14?lang=eng'
    quote: 'And they took Lot, Abram’s brother’s son, who dwelt in Sodom'
  - where: 'setting'
    claim: 'Hospitality lies at the heart of both the Mamre and the Sodom narratives'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'In both cases, hospitality lies at the heart of the narrative, and this ultimately may demonstrate the righteousness of Lot.'
  - where: 'setting'
    claim: 'Joseph Smith’s manuscript makes the visitors holy men sent by God'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/53'
    quote: 'And the Angels, which were holy men, & were sent forth after the order of God, turned their faces from thence'
  - where: 'setting'
    claim: 'Joseph Smith’s manuscript gives the Lord’s words about Sodom as a commission to the angels'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/53'
    quote: 'the Angel of the Lord said unto Abraham, the Lord said unto us, Because the cry of Sodom & gomorah is great'
  - where: 'setting'
    claim: 'Abraham pleads after the angels leave, standing before the Lord'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/53'
    quote: 'But Abraham stood yet before the Lord, remembering the things which had been told him.'
  - where: 'setting'
    claim: 'The Septuagint’s wording of verse 14 is echoed in Luke 1:37'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/18.htm'
    quote: 'finds an echo in St Luke 1:37'
  - where: 'setting'
    claim: 'The fate of Sodom is used throughout scripture as an example of the consequences of wickedness'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'The fate of Sodom and Gomorrah is used throughout scripture as an example of the consequences of wickedness.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Verse 19: “justice and judgment” is tsedaqah and mishpat'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-19.htm'
    quote: 'ṣə·ḏā·qāh צְדָקָ֖ה what is right'
  - where: 'thread'
    claim: 'Verse 19: “justice and judgment” is tsedaqah and mishpat'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-19.htm'
    quote: 'ū·miš·pāṭ; וּמִשְׁפָּ֑ט and just'
  - where: 'thread'
    claim: 'Verse 25: “do right” is “do mishpat,” justice'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-25.htm'
    quote: 'miš·pāṭ. מִשְׁפָּֽט׃ justice'
  - where: 'thread'
    claim: 'Abraham pleads for mercy by appealing to the Lord’s justice'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Note that Abraham is pleading for mercy for the people of Sodom and Gomorrah, but he does so with an appeal to the Lord’s justice and righteous judgment.'
  - where: 'thread'
    claim: 'Abraham’s protection of strangers underscores his plea for Sodom'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Abraham’s willingness to extend love and protection to strangers is not limited to travelers and underscores a key interaction between him and Lord concerning the people in Sodom and Gomorrah'

  # ---------- section plain (renderings that depart from the KJV wording) ----------
  - where: 'section 1 plain'
    claim: '“Plains of Mamre” rendered “oaks of Mamre”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-1.htm'
    quote: 'bə·’ê·lō·nê בְּאֵלֹנֵ֖י by the Oaks'
  - where: 'section 1 plain'
    claim: '“Comfort ye your hearts” rendered “refresh yourselves”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-5.htm'
    quote: 'וְסַעֲד֤וּ that you may refresh'
  - where: 'section 2 plain'
    claim: '“According to the time of life” rendered “when the season comes round”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2416.htm'
    quote: 'כָּעֵת חַיָּה at the time (when it is) reviving, the spring Genesis 18:10,14 (J), 2 Kings 4:16,17.'
  - where: 'section 2 plain'
    claim: '“After I am waxed old” rendered “after I am worn out”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-12.htm'
    quote: 'ḇə·lō·ṯî בְלֹתִי֙ I am worn out'
  - where: 'section 2 plain'
    claim: '“Pleasure” rendered “delight”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5730.htm'
    quote: 'עֶדְנָה noun feminine delight; — Genesis 18:12 (sexual).'
  - where: 'section 3 plain'
    claim: '“I know him” rendered “I have chosen him”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2018&version=NRSVUE'
    quote: 'No, for I have chosen'
  - where: 'section 3 plain'
    claim: '“Justice and judgment” rendered “what is right and just”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-19.htm'
    quote: 'ṣə·ḏā·qāh צְדָקָ֖ה what is right'
  - where: 'section 3 plain'
    claim: '“The cry of Sodom” rendered “the outcry against Sodom”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2201.htm'
    quote: '1 outcry, against, זַעֲקַת ׳סְדֹם וגו Genesis 18:20 (J).'
  - where: 'section 4 plain'
    claim: '“Do right” rendered “do what is just”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-25.htm'
    quote: 'miš·pāṭ. מִשְׁפָּֽט׃ justice'

  # ---------- note 18:1 “The LORD appears to Abraham” ----------
  - where: 'note 18:1 “The LORD appears to Abraham”'
    claim: 'In the KJV, Jehovah is printed LORD in small capitals; Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'the name is generally denoted by Lord or God, printed in small capitals. Jehovah is the premortal Jesus Christ'
  - where: 'note 18:1 “The LORD appears to Abraham”'
    claim: 'The Hebrew of verse 1 has YHWH'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-1.htm'
    quote: 'Yah·weh, יְהוָ֔ה YHWH'
  - where: 'note 18:1 “The LORD appears to Abraham”'
    claim: 'Joseph Fielding Smith: verse 1 is a complete thought, separate from the three men'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'The first verse of that chapter should read as follows: ‘And the Lord appeared unto him in the plains of Mamre.’ That is a complete thought.'
  - where: 'note 18:1 “The LORD appears to Abraham”'
    claim: 'Joseph Smith’s manuscript keeps verse 1: the Lord appeared to Abraham'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/51'
    quote: 'And the Lord appeared unto Abraham, in the plain of Mamree; And he sat in his tent door in the heat of the'
  - where: 'note 18:1 “The LORD appears to Abraham”'
    claim: 'In the manuscript, the Lord remains with Abraham after the angels leave'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/53'
    quote: 'turned their faces from thence … went toward Sodom … But Abraham stood yet before the Lord'

  # ---------- note 18:2 “Who were the three men?” ----------
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'The Hebrew calls them ’anashim, “men”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-2.htm'
    quote: '’ă·nā·šîm, אֲנָשִׁ֔ים men'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'JST: the visitors are angels which were holy men, sent forth after the order of God'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/53'
    quote: 'And the Angels, which were holy men, & were sent forth after the order of God'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'The KJV has two angels arrive at Sodom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/19?lang=eng'
    quote: 'And there came two angels to Sodom at even'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'JST 19:1: three angels come to Sodom'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/54'
    quote: 'there came three Angels to sodom in the evening'
  - where: 'note 18:2 “Who were the three men?”'
    claim: '“After the order of God” read as the order of the Melchizedek Priesthood'
    key: horton-jst-genesis
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-book-genesis'
    quote: 'which were holy men, and were sent forth after the order of God” (i.e., the order of the Melchizedek Priesthood)'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'The JST of Genesis 14 calls Melchizedek’s priesthood “this order of God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/14?lang=eng'
    quote: 'And men having this faith, coming up unto this order of God, were translated and taken up into heaven.'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'JST: one of them blessed Abraham and promised to return from his journey'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/52'
    quote: 'one of them blessed Abraham; And he said, I will certainly return unto thee from my Journey'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'JST: the Angel of the Lord asks why Sarah laughed and says the Lord has sent him'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/52'
    quote: 'And the Angel of the Lord said unto Abraham, Wherefore did Sarah laugh'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'JST: the Angel of the Lord asks why Sarah laughed and says the Lord has sent him'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/52'
    quote: 'behold I will return unto thee from my Journey, which the Lord hath sent me'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'Joseph Fielding Smith: the three were mortals who could eat and rest; none was the Lord'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'These three men were mortals. They had bodies and were able to eat, to bathe, and sit and rest from their weariness. Not one of these three was the'
  - where: 'note 18:2 “Who were the three men?”'
    claim: 'The Church’s current guide: we do not know the identity of the messengers'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'Although we do not know the identity of these messengers, Abraham treated them with deference and great respect.'

  # ---------- note 18:3 “Lord, or lord?” ----------
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'Verse 3 has ’adonay'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-3.htm'
    quote: '’ă·ḏō·nāy, אֲדֹנָ֗י My lord'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'Verse 27 uses ’adonay of God'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-27.htm'
    quote: '’ă·ḏō·nāy, אֲדֹנָ֔י the Lord'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'The Masoretic text is the traditional Hebrew text, used by the KJV'
    key: bd-masoretic-text
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/masoretic-text?lang=eng'
    quote: 'The traditional Hebrew text of the Old Testament was the result of the standardization and stabilization begun by the council of Jamnia, held about A.D. 90. See Jamnia. The Old Testament of the KJV uses the Masoretic text.'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'The Masoretic vowels distinguish divine from human reference'
    key: bdb
    url: 'https://biblehub.com/hebrew/113.htm'
    quote: 'are variations of Masoretic pointing to distinguish divine reference from human'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'BDB marks the reading of Gen. 18:3 as uncertain'
    key: bdb
    url: 'https://biblehub.com/hebrew/113.htm'
    quote: 'There is uncertainty as to'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'BDB lists Gen. 18:3 with a question mark beside 18:27–32 under reference to God'
    key: bdb
    url: 'https://biblehub.com/hebrew/113.htm'
    quote: 'Genesis 18:3(?); Genesis 18:27,30,31,32'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'The Masoretic text reads it as addressed to God; it may also be “my lords” to all three'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/18.htm'
    quote: '“my lords,” adonâi, as if Abraham addressed his three visitors together: compare the plural in Genesis 18:4-5'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'The Masoretic text reads it as addressed to God, as in verses 27–32'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/18.htm'
    quote: '(1) “O Lord,” as in Genesis 18:27; Genesis 18:30-32, Adonâi, addressed to God. So the Massoretic Heb. text'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'With other vowels, a polite “my lord” to one'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/18.htm'
    quote: '(3) “my lord” (with change of vocalization), adônî'
  - where: 'note 18:3 “Lord, or lord?”'
    claim: 'JST: “my brethren… your sight… I pray you”'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/52'
    quote: 'And said, my brethren, if now I have found favour in your Sight, pass not away, I pray you, from thy Servent'

  # ---------- note 18:6 “A morsel of bread, and a feast” ----------
  - where: 'note 18:6 “A morsel of bread, and a feast”'
    claim: 'A measure is a seah; three measures is about ninety-three cups of flour; a lot of cakes'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: '“Measure” translates an ancient measurement called a seah, meaning that Abraham’s three measures of flour is the equivalent of roughly ninety-three cups of flour. Sarah would be able to make a lot of cakes with that much flour.'
  - where: 'note 18:6 “A morsel of bread, and a feast”'
    claim: 'The Hebrew of verse 6 has “three seahs”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-6.htm'
    quote: 'sə·’îm סְאִים֙ seahs'
  - where: 'note 18:6 “A morsel of bread, and a feast”'
    claim: 'The gap between offer and meal highlights his hospitality and generosity'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'There is a little bit of incongruity in what Abraham offers the strangers and what he ends up giving them that serves to highlight Abraham’s hospitality and generosity.'
  - where: 'note 18:6 “A morsel of bread, and a feast”'
    claim: 'The ancient world was hostile; customs protected travelers'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'The ancient world could be a hostile place, and so there were cultural protections to protect and preserve travelers.'
  - where: 'note 18:6 “A morsel of bread, and a feast”'
    claim: 'Lot, like his uncle, welcomes the same visitors in Sodom with a feast'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'Thus, like his uncle, Lot is depicted in a favorable setting: offering hospitality to the unknown strangers, including preparing a feast for them.'

  # ---------- note 18:10 “When the season comes round” ----------
  - where: 'note 18:10 “When the season comes round”'
    claim: 'Ka‘et chayyah: “at the time (when it is) reviving,” the spring; also 2 Kgs. 4:16–17'
    key: bdb
    url: 'https://biblehub.com/hebrew/2416.htm'
    quote: 'כָּעֵת חַיָּה at the time (when it is) reviving, the spring Genesis 18:10,14 (J), 2 Kings 4:16,17.'
  - where: 'note 18:10 “When the season comes round”'
    claim: 'The Hebrew phrase in verse 10'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-10.htm'
    quote: 'kā·‘êṯ כָּעֵ֣ת according to the time'
  - where: 'note 18:10 “When the season comes round”'
    claim: 'Isaac promised for this set time next year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'which Sarah shall bear unto thee at this set time in the next year'

  # ---------- note 18:12 “Why Sarah laughed” ----------
  - where: 'note 18:12 “Why Sarah laughed”'
    claim: '“Waxed old” is literally “worn out”; “within herself” is beqirbah'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-12.htm'
    quote: 'ḇə·lō·ṯî בְלֹתִי֙ I am worn out'
  - where: 'note 18:12 “Why Sarah laughed”'
    claim: '“Waxed old” is literally “worn out”; “within herself” is beqirbah'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-12.htm'
    quote: 'bə·qir·bāh בְּקִרְבָּ֣הּ within herself'
  - where: 'note 18:12 “Why Sarah laughed”'
    claim: '‘Ednah, “delight,” used here in a sexual sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/5730.htm'
    quote: 'עֶדְנָה noun feminine delight; — Genesis 18:12 (sexual).'
  - where: 'note 18:12 “Why Sarah laughed”'
    claim: 'Sarah’s laughter should not be read as proof she lacked faith'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'Sarah’s astonished laughter at the news that she was to conceive and bear a son should not be interpreted as proving her lack of faith.'
  - where: 'note 18:12 “Why Sarah laughed”'
    claim: 'Servants of the Lord are often astonished; Zacharias struck dumb'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'Often in the scriptures the servants of the Lord are astonished beyond belief at the miraculous goodness of the Lord.'
  - where: 'note 18:12 “Why Sarah laughed”'
    claim: 'Servants of the Lord are often astonished; Zacharias struck dumb'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'Zachariah was struck dumb so that he would know that his wife Elizabeth would conceive'
  - where: 'note 18:12 “Why Sarah laughed”'
    claim: 'After about seventy years of childlessness her disbelief is understandable'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'after approximately seventy years of childlessness, who could condemn her temporary inability to believe the joyous promise?'
  - where: 'note 18:12 “Why Sarah laughed”'
    claim: 'Isaac means “he laugheth,” with plays on the name in 17:17, 18:12, 21:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/3327.htm'
    quote: 'Isaac, son of Abraham and Sarah (he laugheth, compare play upon name Genesis 18:12f. (J), Genesis 21:6 (E), Genesis 17:17,19 (P)'

  # ---------- note 18:14 “Nothing too wonderful” ----------
  - where: 'note 18:14 “Nothing too wonderful”'
    claim: 'The verb in verse 14 is pala’; “thing” is davar'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-14.htm'
    quote: 'הֲיִפָּלֵ֥א Is too difficult'
  - where: 'note 18:14 “Nothing too wonderful”'
    claim: 'The verb in verse 14 is pala’; “thing” is davar'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-14.htm'
    quote: 'dā·ḇār; דָּבָ֑ר is any word'
  - where: 'note 18:14 “Nothing too wonderful”'
    claim: 'Pala’: be beyond one’s power, difficult to do; Gen. 18:14 and Jer. 32:17, 27 listed together'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: '1 be beyond one''s power, difficult to do'
  - where: 'note 18:14 “Nothing too wonderful”'
    claim: 'Pala’: be beyond one’s power, difficult to do; Gen. 18:14 and Jer. 32:17, 27 listed together'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: 'Genesis 18:14 (J) Jeremiah 32:17,27'
  - where: 'note 18:14 “Nothing too wonderful”'
    claim: 'Pala’ also means be extraordinary, wonderful'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: 'be extraordinary, wonderful'
  - where: 'note 18:14 “Nothing too wonderful”'
    claim: 'A modern translation: “Is anything too wonderful for the Lord?”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%2018&version=NRSVUE'
