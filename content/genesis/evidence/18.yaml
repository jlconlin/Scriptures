  # ---------- note 18:25 “Mercy argued from justice” ----------
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'Shophet (“judge”) and mishpat (“justice”) in verse 25'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-25.htm'
    quote: 'הֲשֹׁפֵט֙ Shall the Judge'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'Shophet (“judge”) and mishpat (“justice”) in verse 25'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/18-25.htm'
    quote: 'יַעֲשֶׂ֖ה do'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'Mishpat as the attribute of the judge, of God'
    key: bdb
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: '2 attribute of the שֹׁפֵט, justice, right, rectitude: a. of God'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'Abraham pleads for mercy by appealing to the Lord’s justice'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Note that Abraham is pleading for mercy for the people of Sodom and Gomorrah, but he does so with an appeal to the Lord’s justice and righteous judgment.'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'Intercession can cause theological discomfort: the prophet as advocate, God as prosecutor'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'the theological discomfort that may arise when modern readers study intercessory accounts in scripture. Defensive arguments like Amos’s make the prophet sound very much like a legal advocate, which leaves God playing the role of prosecutor'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'Intercessory episodes are not really a fight to change God’s mind; justice and mercy within God'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Despite their literary presentation as such, intercessory episodes are not really a fight to change God’s mind. Perhaps it is better to understand them as creative explorations into one of the marvelous paradoxes of our theology: the simultaneous operation of both justice and mercy within God himself.'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'God could simply have named ten; the eleven verses teach mercy'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'God could have simply told Abraham he would spare Sodom if he could find ten righteous people.'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'God could simply have named ten; the eleven verses teach mercy'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'eleven verses of Abraham pleading for a lower and lower and lower threshold, while God shows mercy again and again and again'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'Through the exchange Abraham came to understand God’s willingness to show mercy'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'God counseled with Abraham, and through that process Abraham came to understand that God was willing to show mercy and spare the wicked in Sodom and Gomorrah if even a few righteous people lived there.'
  - where: 'note 18:25 “Mercy argued from justice”'
    claim: 'Moses similarly pleaded for Israel after the golden calf (Ex. 32:9–14)'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'where Moses similarly pleaded with the Lord on behalf of the Israelites who had rebelled by creating and worshipping the golden calf'

