  # ---------- note 19:11 “A sudden blindness” ----------
  - where: 'note 19:11 “A sudden blindness”'
    claim: 'The word is sanwerim'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/19-11.htm'
    quote: 'bas·san·wê·rîm, בַּסַּנְוֵרִ֔ים with blindness'
  - where: 'note 19:11 “A sudden blindness”'
    claim: 'Sanwerim: sudden blindness; also 2 Kings 6:18; miraculous, and in Kings temporary'
    key: bdb
    url: 'https://biblehub.com/hebrew/5575.htm'
    quote: 'sudden blindness'
  - where: 'note 19:11 “A sudden blindness”'
    claim: 'Sanwerim: sudden blindness; also 2 Kings 6:18; miraculous, and in Kings temporary'
    key: bdb
    url: 'https://biblehub.com/hebrew/5575.htm'
    quote: 'compare 2 Kings 6:18 ; 2 Kings 2:18 (all cases miraculous, and in Kings temporary)'
