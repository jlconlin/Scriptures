  # ---------- note 19:8 “Did Lot offer his daughters?” ----------
  - where: 'note 19:8 “Did Lot offer his daughters?”'
    claim: 'The Church’s reading: the JST shows Lot did not offer his daughters; the mob demanded visitors and daughters'
    key: scripture-helps-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/08-genesis-18-23?lang=eng'
    quote: 'Joseph Smith’s inspired translation clarifies that Lot did not offer his daughters to the angry mob. Instead, the mob demanded Lot’s visitors and his daughters.'
  - where: 'note 19:8 “Did Lot offer his daughters?”'
    claim: 'JST 19:11–12: “We will have the men, and thy daughters also”; “Now this was after the wickedness of Sodom”'
    key: jst-gen-19
