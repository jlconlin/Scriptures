chapter: 19
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The messengers reach Sodom in the evening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/19?lang=eng'
    quote: 'And there came two angels to Sodom at even'
  - where: 'when'
    claim: 'Abraham was ninety-nine; Isaac was to be born at the set time the next year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'which Sarah shall bear unto thee at this set time in the next year'
  - where: 'when'
    claim: 'Abraham was ninety-nine; Isaac was to be born at the set time the next year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'And when Abram was ninety years old and nine, the Lord appeared to Abram'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'The visitors turned toward Sodom while Abraham stood before the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'And the men turned their faces from thence, and went toward Sodom: but Abraham stood yet before the Lord.'
  - where: 'setting'
    claim: 'Joseph Smith’s revision has three angels come to Sodom'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/54'
    quote: 'there came three Angels to sodom in the evening'
  - where: 'setting'
    claim: 'Joseph Smith’s revision calls them holy men'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/55'
    quote: 'the Angels of God, which were holy men, put forth their hand'
  - where: 'setting'
    claim: 'Lot pitched his tent toward Sodom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/13?lang=eng'
    quote: 'Lot dwelled in the cities of the plain, and pitched his tent toward Sodom'
  - where: 'setting'
    claim: 'Peter looks back to Sodom and Lot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-pet/2?lang=eng'
    quote: 'And delivered just Lot, vexed with the filthy conversation of the wicked'
  - where: 'setting'
    claim: 'The Savior compares the days of Lot to the day the Son of man is revealed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/17?lang=eng'
    quote: 'Even thus shall it be in the day when the Son of man is revealed.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Abraham asked whether the Judge of all the earth would slay the righteous with the wicked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'to slay the righteous with the wicked'
  - where: 'thread'
    claim: 'Abraham looked down toward Sodom (shaqaf, a different verb from the wife’s look)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/19-28.htm'
    quote: 'way·yaš·qêp̄, 28 וַיַּשְׁקֵ֗ף 28 And he looked'

  # ---------- note 19:1 “Lot at the gate” ----------
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'Judgment took place at the city gate'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'Later Israelite history associates the judgment of lesser individuals with taking place at the city gate.'
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'The gate was where a stranger was welcomed in'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'Consequently, the one who invited a stranger to come in through the gate became the agent by which acceptance was provided.'
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'Lot’s seat at the gate may indicate his standing in the community'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'Lot’s sitting at the gate may indicate the location of his home, his standing in the community as a compassionate individual'
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'The Hebrew of verse 9 doubles the verb: “and he judges, judging”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/19-9.htm'
    quote: 'way·yiš·pōṭ וַיִּשְׁפֹּ֣ט and he judges'
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'The Hebrew of verse 9 doubles the verb: “and he judges, judging”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/19-9.htm'
    quote: 'šā·p̄ō·wṭ, שָׁפ֔וֹט judging V‑Qal‑InfAbs'
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'One reading: the foreigner is always wanting to play the judge, probably because Lot had reproved them (2 Pet. 2:7–8)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/19.htm'
    quote: 'the man, who came as a foreigner, is always wanting to play the judge" (probably because Lot had frequently reproved them for their licentious conduct, 2 Peter 2:7, 2 Peter 2:8)'
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'Peter: Lot vexed his righteous soul from day to day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-pet/2?lang=eng'
    quote: 'vexed his righteous soul from day to day with their unlawful deeds'
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'JST: Lot sat in the door of his house in the City of Sodom'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/54'
    quote: 'And Lot sat in the door of his house in the City of Sodom.'
  - where: 'note 19:1 “Lot at the gate”'
    claim: 'JST: he will needs now make himself to be a Judge'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/54'
    quote: 'this one man came in to sojourn among us, And he will needs now make himself to be a Judge'

  # ---------- note 19:3 “Pressing them in, pressing him hard” ----------
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'Abraham ran to meet the visitors and bowed toward the ground'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'he ran to meet them from the tent door, and bowed himself toward the ground'
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'Abraham offered water to wash their feet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'Let a little water, I pray you, be fetched, and wash your feet'
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'Abraham: “for therefore are ye come to your servant”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'for therefore are ye come to your servant'
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'Lot’s hospitality was no less than Abraham’s'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'nothing suggests that Lot’s was less than that offered by the patriarch'
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'Verse 3: vayyiftsar, “and he insisted”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/19-3.htm'
    quote: 'way·yip̄·ṣar- 3 וַיִּפְצַר־ 3 And he insisted'
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'Verse 9: the same verb, vayyiftseru, “and they pressed”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/19-9.htm'
    quote: 'way·yip̄·ṣə·rū וַיִּפְצְר֨וּ And they pressed'
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'The verb means push, press; physically, or “urge” in verse 3'
    key: bdb
    url: 'https://biblehub.com/hebrew/6484.htm'
    quote: 'verb push, press'
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'The verb means push, press; physically, or “urge” in verse 3'
    key: bdb
    url: 'https://biblehub.com/hebrew/6484.htm'
    quote: 'physically Genesis 19:2 ; = urge Genesis 19:3'
  - where: 'note 19:3 “Pressing them in, pressing him hard”'
    claim: 'The contrast is Abraham and Lot against the men of Sodom'
    key: benson-lot
    url: 'https://rsc.byu.edu/creation-sinai/lot'
    quote: 'This is the contrast in hospitality—Abraham and Lot in contradistinction to the men of Sodom.'

