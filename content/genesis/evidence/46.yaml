  - where: 'note 46:28 “Goshen, a place apart”'
    claim: 'Pharaoh called it the best of the land; Genesis also calls it the land of Rameses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'in the best of the land, in the land of Rameses, as Pharaoh had commanded'
  - where: 'note 46:28 “Goshen, a place apart”'
    claim: 'Pharaoh said to settle them in Goshen, the best of the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'in the best of the land make thy father and brethren to dwell; in the land of Goshen let them dwell'
  - where: 'note 46:28 “Goshen, a place apart”'
    claim: 'Pharaohs settled foreigners together in the delta, as the Hebrews were apparently settled'
    key: sc-knowhy-844
    url: 'https://scripturecentral.org/knowhy/why-were-the-hebrews-allowed-to-settle-in-egypt'
    quote: 'examples, from roughly the period when the Hebrews would have been in Egypt, of the Pharaoh settling foreigners together as a group in the delta region of Egypt, just as the Hebrews were apparently settled there in the delta'
  - where: 'note 46:28 “Goshen, a place apart”'
    claim: 'Some foreigners were settled together because of their profession'
    key: sc-knowhy-844
    url: 'https://scripturecentral.org/knowhy/why-were-the-hebrews-allowed-to-settle-in-egypt'
    quote: 'Some of these people were all settled together as a group because of their profession.'
  - where: 'note 46:28 “Goshen, a place apart”'
