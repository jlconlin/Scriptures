    key: sc-knowhy-844
    url: 'https://scripturecentral.org/knowhy/why-were-the-hebrews-allowed-to-settle-in-egypt'
    quote: 'Even the seemingly-strange detail of Jacob’s family being given a place where all of them could live together within Egypt has historical parallels.'

