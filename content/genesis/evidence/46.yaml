chapter: 46
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'Jacob tells Pharaoh he is 130 years old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'The days of the years of my pilgrimage are an hundred and thirty years'
  - where: 'when'
    claim: 'Joseph says two years of famine have passed and five remain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'For these two years hath the famine been in the land: and yet there are five years'
  - where: 'when'
    claim: 'Jacob lived seventeen years in Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'And Jacob lived in the land of Egypt seventeen years'

  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'Exodus opens by repeating the names of those who came into Egypt, and gives seventy souls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'Now these are the names of the children of Israel, which came into Egypt'
  - where: 'setting'
    claim: 'Stephen counts seventy-five souls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'and all his kindred, threescore and fifteen souls'
  - where: 'thread'
    claim: 'In Hebrew Jacob is to go down (mered, from yarad) and the Lord says He will go down (erēd) and bring up (aʿalkha)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-4.htm'
    quote: 'will go down'
  - where: 'thread'
    claim: 'In Hebrew Jacob is to go down (mered, from yarad) and the Lord says He will go down (erēd) and bring up (aʿalkha)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-3.htm'
    quote: 'from going down'
  - where: 'thread'
    claim: 'Exodus 3:8 uses the same pair of verbs, come down and bring up'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/exodus/3-8.htm'
    quote: 'and to bring them up from'

  # ---------- note 46:1 ----------
  - where: 'note 46:1 “Why Jacob stops at Beer-sheba”'
    claim: 'Beer-sheba was the home of Abraham, Isaac, and Jacob and the southern limit of Israel'
    key: bd-beersheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beersheba?lang=eng'
    quote: 'The home of Abraham (Gen. 21:31), Isaac (26:23), and Jacob (28:10)'
  - where: 'note 46:1 “Why Jacob stops at Beer-sheba”'
    claim: 'Beer-sheba was regarded as the southern limit of Israel'
    key: bd-beersheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beersheba?lang=eng'
    quote: 'was regarded as the southern limit of Israel'
  - where: 'note 46:1 “Why Jacob stops at Beer-sheba”'
    claim: 'Abraham called on the Lord at Beer-sheba'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21?lang=eng'
    quote: 'And Abraham planted a grove in Beer-sheba, and called there on the name of the Lord, the everlasting God.'
  - where: 'note 46:1 “Why Jacob stops at Beer-sheba”'
    claim: 'The Lord appeared to Isaac at Beer-sheba the same night and said fear not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: 'And the Lord appeared unto him the same night, and said, I am the God of Abraham thy father: fear not, for I am with thee'
  - where: 'note 46:1 “Why Jacob stops at Beer-sheba”'
    claim: 'The Hebrew of the Lord’s “fear not” is the same in Gen. 46:3'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-3.htm'
    quote: 'tî·rā תִּירָא֙ do fear'
  - where: 'note 46:1 “Why Jacob stops at Beer-sheba”'
    claim: 'The Hebrew of the Lord’s “fear not” is the same in Gen. 26:24'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-24.htm'
    quote: 'tî·rā תִּירָא֙ do fear'
  - where: 'note 46:1 “Why Jacob stops at Beer-sheba”'
    claim: 'God spoke to Israel in visions of the night'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-2.htm'
    quote: 'bə·mar·’ōṯ בְּמַרְאֹ֣ת in visions'

  # ---------- note 46:3 fear ----------
  - where: 'note 46:3 “Why Jacob might fear Egypt”'
    claim: 'Abraham went down into Egypt in a famine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And there was a famine in the land: and Abram went down into Egypt to sojourn there'
  - where: 'note 46:3 “Why Jacob might fear Egypt”'
    claim: 'The Book of Abraham says Abraham concluded to go down into Egypt because of famine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'I, Abraham, concluded to go down into Egypt, to sojourn there, for the famine became very grievous.'
  - where: 'note 46:3 “Why Jacob might fear Egypt”'
    claim: 'The Lord told Isaac in a famine not to go down into Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: 'Go not down into Egypt; dwell in the land which I shall tell thee of'
  - where: 'note 46:3 “Why Jacob might fear Egypt”'
    claim: 'The Lord told Abraham his seed would be strangers in a land not theirs for four hundred years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/15?lang=eng'
    quote: 'Know of a surety that thy seed shall be a stranger in a land that is not theirs, and shall serve them'
  - where: 'note 46:3 “Why Jacob might fear Egypt”'
    claim: 'One commentary infers that Jacob would recall the prophecy to Abraham of affliction in a foreign land'
    key: ellicott-genesis
    url: 'https://biblehub.com/commentaries/ellicott/genesis/46.htm'
    quote: 'that the descendants of Abraham were to be reduced to slavery, and suffer affliction in a foreign land for four hundred years'
  - where: 'note 46:3 “Why Jacob might fear Egypt”'
    claim: 'The same commentary sets Jacob’s hesitation beside the command to Isaac to stay in the land'
    key: ellicott-genesis
    url: 'https://biblehub.com/commentaries/ellicott/genesis/46.htm'
    quote: 'Isaac, too, when going into Egypt, had been commanded to remain in Palestine'

  # ---------- note 46:3 nation ----------
  - where: 'note 46:3 “The great nation is made in Egypt”'
    claim: 'The Lord promised Abraham “I will make of thee a great nation”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And I will make of thee a great nation, and I will bless thee, and make thy name great'
  - where: 'note 46:3 “The great nation is made in Egypt”'
    claim: 'The Hebrew of Gen. 12:2 is lĕgoy gadol, “into a great nation”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/12-2.htm'
    quote: 'lə·ḡō·w לְג֣וֹי into a nation'
  - where: 'note 46:3 “The great nation is made in Egypt”'
    claim: 'The Hebrew of Gen. 46:3 is lĕgoy gadol, “into a great nation,” with “there”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-3.htm'
    quote: 'lə·ḡō·w לְג֥וֹי into a nation'
  - where: 'note 46:3 “The great nation is made in Egypt”'
    claim: 'Deut. 26:5 says Jacob went down to Egypt and became there a great nation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'A Syrian ready to perish was my father, and he went down into Egypt, and sojourned there with a few, and became there a nation, great, mighty, and populous'
  - where: 'note 46:3 “The great nation is made in Egypt”'
    claim: 'The Hebrew of Deut. 26:5 has “went down” (wayyēred), “there” (shām), and goy gadol again'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/deuteronomy/26-5.htm'
    quote: 'lə·ḡō·w לְג֥וֹי a nation'
  - where: 'note 46:3 “The great nation is made in Egypt”'
    claim: 'The Hebrew of Deut. 26:5 has “and he went down” (wayyēred)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/deuteronomy/26-5.htm'
    quote: 'way·yê·reḏ וַיֵּ֣רֶד and he went down'
  - where: 'note 46:3 “The great nation is made in Egypt”'
    claim: 'Exodus says Israel multiplied and the land was filled with them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'And the children of Israel were fruitful, and increased abundantly, and multiplied, and waxed exceeding mighty; and the land was filled with them.'

  # ---------- note 46:4 go down ----------
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Hebrew of Gen. 46:4: “I will go down” (ērēd)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-4.htm'
    quote: 'אֵרֵ֤ד will go down'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Hebrew of Gen. 46:4: “will bring you up” (aʿalkha)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-4.htm'
    quote: 'אַֽעַלְךָ֣ will bring you up'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'The second verb is reinforced by an infinitive absolute (“bringing”)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-4.htm'
    quote: 'עָלֹ֑ה bringing'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Exodus 3:8 has the same pair of verbs: “I have come down” (wāʾērēd)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/exodus/3-8.htm'
    quote: 'וָאֵרֵ֞ד and I have come down'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Exodus 3:8 has the same pair of verbs: “and to bring them up” (ûlĕhaʿălōtô)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/exodus/3-8.htm'
    quote: 'וּֽלְהַעֲלֹתוֹ֮ and to bring them up from'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Jacob’s sons buried him at Machpelah in Canaan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'For his sons carried him into the land of Canaan, and buried him in the cave of the field of Machpelah'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Jacob tells Joseph God will bring them again to the land of their fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'but God shall be with you, and bring you again unto the land of your fathers.'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Joseph tells his brothers God will bring them out of the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'God will surely visit you, and bring you out of this land unto the land which he sware to Abraham, to Isaac, and to Jacob.'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'The speaker of Exodus 3:8 is “the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'And the Lord said, I have surely seen the affliction of my people which are in Egypt'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'The speaker in Gen. 46:2–3 is Elohim (God)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-2.htm'
    quote: 'אֱלֹהִ֤ים׀ God'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Scriptural words spoken by “God” or the “Lord” are almost always the words of Jehovah, Jesus Christ'
    key: oaks-teachings-christ-2023
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/51oaks?lang=eng'
    quote: 'the scriptural records of words spoken by “God” or the “Lord” are almost always the words of Jehovah, our risen Lord, Jesus Christ'
  - where: 'note 46:4 “The Lord goes down with Israel”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'

  # ---------- note 46:4 eyes ----------
  - where: 'note 46:4 “A promise that Jacob will not die mourning”'
    claim: 'The custom: the closest relative closed the eyes of the dead and gave a parting kiss'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'In Hebrew custom, it was the responsibility of the closest and most beloved relative to close the eyes of a deceased person and give them a parting kiss.'
  - where: 'note 46:4 “A promise that Jacob will not die mourning”'
    claim: 'Joseph fell on his father’s face and kissed him at Jacob’s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'And Joseph fell upon his father’s face, and wept upon him, and kissed him.'
  - where: 'note 46:4 “A promise that Jacob will not die mourning”'
    claim: 'Jacob said he would go down to the grave mourning his son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'For I will go down into the grave unto my son mourning.'
  - where: 'note 46:4 “A promise that Jacob will not die mourning”'
    claim: 'Jacob said he would go and see Joseph before he died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'Joseph my son is yet alive: I will go and see him before I die.'
  - where: 'note 46:4 “A promise that Jacob will not die mourning”'
    claim: 'Jacob lived seventeen more years in Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'And Jacob lived in the land of Egypt seventeen years'

  # ---------- note 46:8 list ----------
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'The list is arranged according to the four mothers'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/46.htm'
    quote: 'The sons are arranged according to the four mothers.'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'Pharez, a twin born after Joseph’s sale, already has two sons in the list'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/46.htm'
    quote: 'Pharez, one of the twin-sons of Judah, who were not born till after the sale of Joseph, should already have had two sons'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'Benjamin is called “the lad” shortly before'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/44?lang=eng'
    quote: 'The lad cannot leave his father'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'One reading: grandsons and great-grandsons born later came into Egypt in the loins of their fathers'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/46.htm'
    quote: 'came into Egypt in lumbis patrum'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'The New Testament speaks of Levi paying tithes in Abraham while in his loins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'For he was yet in the loins of his father, when Melchisedec met him.'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'Reuben’s sons reappear as his families in Numbers 26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'Hanoch, of whom cometh the family of the Hanochites: of Pallu, the family of the Palluites'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'Pharez’s sons are heads of families in Numbers 26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'of Hezron, the family of the Hezronites: of Hamul, the family of the Hamulites'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'One reading: the list gives the founders of Israel’s tribes and families'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/46.htm'
    quote: 'the germs and roots of all the tribes and families of the whole nation'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'Er and Onan, who died in Canaan, are not reckoned in the count'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/46.htm'
    quote: 'whereas Er and Onan, the sons of Judah who died in Canaan, are not reckoned'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'Exodus opens with the same heading and the names of Jacob’s sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'Now these are the names of the children of Israel, which came into Egypt'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'Exodus gives the same total of seventy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'And all the souls that came out of the loins of Jacob were seventy souls'
  - where: 'note 46:8 “A list of the families Israel would become”'
    claim: 'The seventy of Exodus 1:5 and Deuteronomy 10:22 are the seed that grew into the people Moses led out'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/46.htm'
    quote: 'the seventy souls of the house of Jacob which went into Egypt are said to constitute the seed which, under the blessing of the Lord, had grown into the numerous people that Moses led out of Egypt'

  # ---------- note 46:12 Pharez ----------
  - where: 'note 46:12 “Perez, Hezron, and the line to Christ”'
    claim: 'Er’s and Onan’s deaths are told in Genesis 38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/38?lang=eng'
    quote: 'And Er, Judah’s firstborn, was wicked in the sight of the Lord; and the Lord slew him.'
  - where: 'note 46:12 “Perez, Hezron, and the line to Christ”'
    claim: 'Pharez is the twin born to Judah and Tamar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/38?lang=eng'
    quote: 'therefore his name was called Pharez.'
  - where: 'note 46:12 “Perez, Hezron, and the line to Christ”'
    claim: 'Ruth traces Pharez to Hezron to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'Now these are the generations of Pharez: Pharez begat Hezron'
  - where: 'note 46:12 “Perez, Hezron, and the line to Christ”'
    claim: 'Ruth traces the line to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'And Obed begat Jesse, and Jesse begat David.'
  - where: 'note 46:12 “Perez, Hezron, and the line to Christ”'
    claim: 'Matthew’s genealogy includes Phares and Esrom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram'

  # ---------- note 46:26 numbers ----------
  - where: 'note 46:26 “Sixty-six, seventy, or seventy-five”'
    claim: 'Reckoning Jacob and Joseph with his two sons gives 70, apart from them 66, besides the sons’ wives'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/46.htm'
    quote: 'If we reckon these, the house of Jacob consisted of 70 souls; and apart from these, of 66, besides his sons’ wives.'
  - where: 'note 46:26 “Sixty-six, seventy, or seventy-five”'
    claim: 'Leah’s group counts to 32, or 33 with Jacob'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/46.htm'
    quote: 'or with Jacob, 33 souls'
  - where: 'note 46:26 “Sixty-six, seventy, or seventy-five”'
    claim: 'Exodus gives seventy souls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'And all the souls that came out of the loins of Jacob were seventy souls'
  - where: 'note 46:26 “Sixty-six, seventy, or seventy-five”'
    claim: 'Deuteronomy gives threescore and ten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'Thy fathers went down into Egypt with threescore and ten persons'
  - where: 'note 46:26 “Sixty-six, seventy, or seventy-five”'
    claim: 'Stephen says seventy-five'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'and all his kindred, threescore and fifteen souls'
  - where: 'note 46:26 “Sixty-six, seventy, or seventy-five”'
    claim: 'The Septuagint of verse 20 adds names after Manasseh and Ephraim'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/46.htm'
    quote: 'And there were sons born to Manasses, which the Syrian concubine bore to him,  even  Machir. And Machir begot Galaad. And the sons of Ephraim, the brother of Manasses; Sutalaam, and Taam. And the sons of Sutalaam; Edom.'
  - where: 'note 46:26 “Sixty-six, seventy, or seventy-five”'
    claim: 'The Septuagint of verse 27 reads seventy-five souls'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/46.htm'
    quote: 'were seventy-five souls'

  # ---------- note 46:28 Judah ----------
  - where: 'note 46:28 “Why Judah goes ahead”'
    claim: 'Hebrew: Jacob sent Judah “to direct” (lĕhorot) “before him” to Goshen'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-28.htm'
    quote: 'לְהוֹרֹ֥ת to direct'
  - where: 'note 46:28 “Why Judah goes ahead”'
    claim: 'The Hebrew text names Goshen in verse 28'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-28.htm'
    quote: 'gō·šə·nāh; גֹּ֑שְׁנָה to Goshen'
  - where: 'note 46:28 “Why Judah goes ahead”'
    claim: 'The Hebrew text names Goshen in verse 29'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/46-29.htm'
    quote: 'gō·šə·nāh; גֹּ֑שְׁנָה to Goshen'
  - where: 'note 46:28 “Why Judah goes ahead”'
    claim: 'The Septuagint has Judah meet Jacob at the city of Heroes in the land of Ramesses'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/46.htm'
    quote: 'to meet him to the city of Heroes, into the land of Ramesses'
