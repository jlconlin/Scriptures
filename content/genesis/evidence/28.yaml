chapter: 28
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'Esau threatened to kill Jacob after the blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: "The days of mourning for my father are at hand; then will I slay my brother Jacob."
  - where: 'setting'
    claim: 'Isaac was living at Beer-sheba when Jacob left'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: "And he went up from thence to Beer-sheba."
  - where: 'setting'
    claim: 'Esau swore to kill Jacob after the blessing of chapter 27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: "then will I slay my brother Jacob."
  - where: 'setting'
    claim: 'Rebekah arranged Jacob’s flight to her brother Laban at Haran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: "arise, flee thou to Laban my brother to Haran;"
  - where: 'setting'
    claim: 'Isaac’s second blessing is given knowingly; the Church’s manual reads it as proof that Jacob received the blessing meant for him'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: "Isaac clearly gave him the blessing of Abraham (see Genesis 28:3–4), an additional proof that Jacob received the blessing meant for him and that Isaac confirmed it upon him."
  - where: 'setting'
    claim: 'The Bible Dictionary lists three renewals of the covenant with Jacob: Gen. 28; 35:9–13; 48:3–4'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: "It was renewed with Isaac (Gen. 26:1–4, 24) and again with Jacob (Gen. 28; 35:9–13; 48:3–4)."
  - where: 'setting'
    claim: 'The covenant of Abraham continued through Jacob (Gen. 28)'
    key: bd-jacob
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jacob?lang=eng'
    quote: "It was through Jacob that the covenant of Abraham continued (Gen. 28:1–4, 12–22)"
  - where: 'setting'
    claim: 'John 1:51 alludes to Genesis 28:12'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: "The noteworthy phrase here is “the angels of God ascending and descending upon the Son of man,” an allusion to Genesis 28:12"

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The promise came to Jacob from Isaac, knowingly, and Jacob was alone when God gave it'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "just where Jacob was lying in solitude, poor, helpless, and forsaken by men."
  - where: 'thread'
    claim: 'Isaac’s second blessing is given knowingly (the Church’s reading)'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: "Isaac clearly gave him the blessing of Abraham (see Genesis 28:3–4), an additional proof that Jacob received the blessing meant for him"
  - where: 'thread'
    claim: 'Chapter 32 as the culmination of a process begun at Bethel'
    key: skinner-keeper-covenants
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/03/jacob-keeper-of-covenants?lang=eng'
    quote: "Thus the events described in chapter 32 of Genesis report the culmination of a process begun 20 years before at Bethel, when Jacob became a candidate for exaltation by vowing to live according to the Abrahamic covenant."

  # ---------- sections (plain-words renderings) ----------
  - where: 'section 1 plain'
    claim: 'Verse 3: the Hebrew is “an assembly of peoples”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/28-3.htm'
    quote: "and thou hast become an assembly of peoples"
  - where: 'section 2 plain'
    claim: 'Verse 9: Esau married Mahalath in addition to the wives he had'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/28-9.htm'
    quote: "in addition to the wives he already had."
  - where: 'section 4 plain'
    claim: 'Verse 17: “dreadful” (nora’) can mean awe-inspiring, hence “awesome”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3372.htm'
    quote: "cause astonishment and awe"

  # ---------- note 28:1 ----------
  - where: 'note 28:1 “Why Jacob must marry within the family”'
    claim: 'Rebekah’s fear was that her life’s work for the covenant would be wasted if Jacob followed Esau'
    key: skinner-keeper-covenants
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/03/jacob-keeper-of-covenants?lang=eng'
    quote: "Rebekah felt that all her life’s work, all her planning and teaching about the importance of the covenant God made with Abraham, all her care in guarding and guiding its perpetuation according to divine desires, would be worthless and wasted"
  - where: 'note 28:1 “Why Jacob must marry within the family”'
    claim: 'Jacob is sent to adherents of the covenant to find a wife, to ensure the claiming of the covenant'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: "Jacob is to go to adherents of the covenant and find a wife to ensure the claiming of that covenant."
  - where: 'note 28:1 “Why Jacob must marry within the family”'
    claim: 'Haran is where Abraham first settled on leaving Ur and where Terah tarried'
    key: bd-haran
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haran?lang=eng'
    quote: "first settlement on leaving Ur of the Chaldees"
  - where: 'note 28:1 “Why Jacob must marry within the family”'
    claim: 'Terah tarried at Haran'
    key: bd-haran
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haran?lang=eng'
    quote: "and Terah, Abraham’s father, tarried there."
  - where: 'note 28:1 “Why Jacob must marry within the family”'
    claim: 'The lexicon locates Paddan, tentatively, near Haran'
    key: bdb
    url: 'https://biblehub.com/hebrew/6307.htm'
    quote: "perhaps Paddânâ, near Haran"

  # ---------- note 28:3 ----------
  - where: 'note 28:3 “God Almighty and an assembly of peoples”'
    claim: 'The Hebrew of “God Almighty” in verse 3 is El Shaddai'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/28-3.htm'
    quote: "And may El-"
  - where: 'note 28:3 “God Almighty and an assembly of peoples”'
    claim: 'Genesis 17:1 also has El Shaddai'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/17-1.htm'
    quote: "Shaddai"
  - where: 'note 28:3 “God Almighty and an assembly of peoples”'
    claim: '“A multitude of people” is “an assembly of peoples” (liqhal ‘ammim), plural peoples'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/28-3.htm'
    quote: "liq·hal"
  - where: 'note 28:3 “God Almighty and an assembly of peoples”'
    claim: 'Qahal is an assembly, convocation, congregation'
    key: bdb
    url: 'https://biblehub.com/hebrew/6951.htm'
    quote: "assembly, convocation, congregation"
  - where: 'note 28:3 “God Almighty and an assembly of peoples”'
    claim: 'Genesis 35:11 has qahal again: an assembly of nations'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/35-11.htm'
    quote: "an assembly of nations is from thee"
  - where: 'note 28:3 “God Almighty and an assembly of peoples”'
    claim: 'Genesis 48:4 has the same Hebrew as 28:3: an assembly of peoples'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/48-4.htm'
    quote: "given thee for an assembly of peoples"

  # ---------- note 28:4 ----------
  - where: 'note 28:4 “The blessing of Abraham, given knowingly”'
    claim: 'The Bible Dictionary names Christ coming through his lineage and the land as promises included in the covenant'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: "Included in the divine promises to Abraham were the assurances that (1) Christ would come through his lineage, and that (2) Abraham’s posterity would receive certain lands as an eternal inheritance"
  - where: 'note 28:4 “The blessing of Abraham, given knowingly”'
    claim: 'The covenant was renewed with Isaac and again with Jacob'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: "It was renewed with Isaac (Gen. 26:1–4, 24) and again with Jacob (Gen. 28; 35:9–13; 48:3–4)."
  - where: 'note 28:4 “The blessing of Abraham, given knowingly”'
    claim: 'The Church’s manual reads Isaac’s second blessing as proof that Jacob received the blessing meant for him'
    key: ot-manual-gen-24-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-24-36-the-covenant-line-continues-with-isaac-and-jacob?lang=eng'
    quote: "an additional proof that Jacob received the blessing meant for him and that Isaac confirmed it upon him."
  - where: 'note 28:4 “The blessing of Abraham, given knowingly”'
    claim: 'A BYU study: the covenant blessings were intended for Jacob, not Esau, and not to be gained by deceit'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: "To summarize this event, the blessings associated with the covenant appear to have been intended for Jacob—not for Esau—and were not to be gained by deceit."

  # ---------- note 28:9 ----------
  - where: 'note 28:9 “Esau’s third wife, a daughter of Ishmael”'
    claim: 'The Hebrew says Esau took Mahalath in addition to (‘al) the wives he had'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/28-9.htm'
    quote: "in addition to the wives he already had."
  - where: 'note 28:9 “Esau’s third wife, a daughter of Ishmael”'
    claim: 'Esau went to Ishmael’s family; Ishmael himself was dead'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "he went to Ishmael - i.e., to the family of Ishmael, for Ishmael himself had been dead fourteen years"
  - where: 'note 28:9 “Esau’s third wife, a daughter of Ishmael”'
    claim: 'The marriage only proved Esau had no thought for the chosen family’s religious interests (Keil’s reading)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "it only furnished another proof that he had no thought of the religious interests of the chosen family"
  - where: 'note 28:9 “Esau’s third wife, a daughter of Ishmael”'
    claim: 'Ishmael’s line had been separated from the family of promise by God’s appointment'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "Ishmael had been separated from the house of Abraham and family of promise by the appointment of God"
  - where: 'note 28:9 “Esau’s third wife, a daughter of Ishmael”'
    claim: 'Keil identifies Mahalath with the Bashemath of Gen. 36:3'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "(called Bashemath in Genesis 36:3, a descendant of Abraham therefore)"
  - where: 'note 28:9 “Esau’s third wife, a daughter of Ishmael”'
    claim: 'The Bible Dictionary counts Esau’s marriages (Gen. 26:34–35; 28:8–9) among his displeasing choices of wives'
    key: bd-jacob
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jacob?lang=eng'
    quote: "Esau’s life shows disobedience and some displeasing choices of wives (Gen. 26:34–35; 28:8–9)."

  # ---------- note 28:12 ladder ----------
  - where: 'note 28:12 “A ladder, or a stairway”'
    claim: 'Sullam is a masculine noun glossed “ladder”; BDB lists only Genesis 28:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/5551.htm'
    quote: "noun masculine ladder; — Genesis 28:12"
  - where: 'note 28:12 “A ladder, or a stairway”'
    claim: 'It is not clear whether the ladder is a ladder or a ramp or stairway (the study prints this from a commentary it quotes in its endnote)'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: "It is not clear whether the ‘ladder’ describes a ladder or ‘a ramp or stairway’"
  - where: 'note 28:12 “A ladder, or a stairway”'
    claim: 'Mesopotamian myth’s stairway for the gods’ messenger (Akkadian word comparable to sullam)'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: "is used in Mesopotamian mythology to describe what the messenger of the gods uses when he wants to pass from one realm to another."
  - where: 'note 28:12 “A ladder, or a stairway”'
    claim: 'The Babylonians sought to represent that stairway in ziggurats, built for the deity to descend'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: "Babylonians sought to represent in the architecture of the ziggurats. These had been built to provide a way for the deity to descend to the temple and the town."
  - where: 'note 28:12 “A ladder, or a stairway”'
    claim: 'The view the study quotes (a Bible-background commentary, in its endnote) holds that Jacob’s background gave him familiarity with the concept'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: "Jacob’s background would have given him familiarity with this concept"
  - where: 'note 28:12 “A ladder, or a stairway”'
    claim: 'Keil: the ladder as a symbol of fellowship between God and His people'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "The ladder was a visible symbol of the real and uninterrupted fellowship between God in heaven and His people upon earth."
  - where: 'note 28:12 “A ladder, or a stairway”'
    claim: 'Keil: the angels carry up the wants of men and bring down God’s help'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "The angels upon it carry up the wants of men to God, and bring down the assistance and protection of God to men."
  - where: 'note 28:12 “A ladder, or a stairway”'
    claim: 'Keil: the ladder stood just where Jacob lay in solitude'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "just where Jacob was lying in solitude, poor, helpless, and forsaken by men."

  # ---------- note 28:12 prophets ----------
  - where: 'note 28:12 “Rungs of covenant, rounds of glory”'
    claim: 'President Romney: the covenants Jacob made were the rungs of the ladder'
    key: romney-temples-1971
    url: 'https://www.churchofjesuschrist.org/study/ensign/1971/03/temples-the-gates-to-heaven?lang=eng'
    quote: "Jacob realized that the covenants he made with the Lord there were the rungs on the ladder that he himself would have to climb in order to obtain the promised blessings"
  - where: 'note 28:12 “Rungs of covenant, rounds of glory”'
    claim: 'President Romney: blessings that would entitle him to enter heaven and associate with the Lord'
    key: romney-temples-1971
    url: 'https://www.churchofjesuschrist.org/study/ensign/1971/03/temples-the-gates-to-heaven?lang=eng'
    quote: "blessings that would entitle him to enter heaven and associate with the Lord."
  - where: 'note 28:12 “Rungs of covenant, rounds of glory”'
    claim: 'Joseph Smith: Paul understood the three principal rounds of Jacob’s ladder, the degrees of glory'
    key: jsp-history-d1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-d-1-1-august-1842-1-july-1843/199'
    quote: "Paul ascended into the third Heavens and he could understand the three principal rounds of Jacob’s Ladder, the Telestial, the Terrestrial and the Celestial glories or Kingdoms"
  - where: 'note 28:12 “Rungs of covenant, rounds of glory”'
    claim: 'The sermon on this page is dated May 21 (volume D-1 covers Aug. 1842–July 1843)'
    key: jsp-history-d1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-d-1-1-august-1842-1-july-1843/199'
    quote: "May 21"
  - where: 'note 28:12 “Rungs of covenant, rounds of glory”'
    claim: 'The page belongs to History, 1838–1856, volume D-1 [1 August 1842–1 July 1843]'
    key: jsp-history-d1
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-d-1-1-august-1842-1-july-1843/199'
    quote: "History, 1838–1856, volume D-1"
  - where: 'note 28:12 “Rungs of covenant, rounds of glory”'
    claim: 'Paul’s and Joseph Smith’s visions are counted among the Jacob-like experiences of later prophets (the article quotes Joseph Smith’s Jacob’s-ladder statement right after Romney)'
    key: skinner-keeper-covenants
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/03/jacob-keeper-of-covenants?lang=eng'
    quote: "Other great prophets have left us accounts of their Jacob-like experiences, especially the Apostle Paul and the Prophet Joseph Smith."

  # ---------- note 28:12 christ ----------
  - where: 'note 28:12 “Jesus takes the ladder’s place”'
    claim: 'The allusion: Jesus reaffirms that the Abrahamic covenant is still in effect'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: "Jesus is reaffirming that the Abrahamic covenant is still in effect for Abraham’s descendants."
  - where: 'note 28:12 “Jesus takes the ladder’s place”'
    claim: 'In John’s account the angels ascend and descend upon Jesus, who has become the ladder'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: "He has become the ladder, the link uniting heaven and earth."
  - where: 'note 28:12 “Jesus takes the ladder’s place”'
    claim: 'The study adds John 10:9, “I am the door”'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: "I am the door: by me if any man enter in, he shall be saved"
  - where: 'note 28:12 “Jesus takes the ladder’s place”'
    claim: 'The study concludes Jesus becomes the new Beth-el, the true gate of heaven'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: "Jesus, then, becomes the new Beth-el, the true “gate of heaven.”"

  # ---------- note 28:13 ----------
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'The Hebrew ‘alav is a preposition with 3ms suffix, glossed “above it”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/28-13.htm'
    quote: "above it"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'The Niphal means take one’s stand'
    key: bdb
    url: 'https://biblehub.com/hebrew/5324.htm'
    quote: "Niph`al take one's stand, stand"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'Niphal of nasav with ‘al, “by, on”, listing Gen. 24:13 and 28:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/5324.htm'
    quote: "location (by, on) Genesis 24:13,43; Genesis 28:13"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'Sullam is a masculine noun'
    key: bdb
    url: 'https://biblehub.com/hebrew/5551.htm'
    quote: "noun masculine ladder; — Genesis 28:12"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'The NRSVUE reads “beside him” and notes “Or stood above it”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis+28%3A13&version=NRSVUE'
    quote: "And the LORD stood beside him"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'The NRSVUE footnote gives the other reading'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis+28%3A13&version=NRSVUE'
    quote: "Or stood above it"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'The NIV reads “above it”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Genesis+28%3A13&version=NIV'
    quote: "There above it stood the LORD"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'The NIV footnote gives “There beside him”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Genesis+28%3A13&version=NIV'
    quote: "Or There beside him"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'The Latter-day Saint edition’s footnote gives “beside him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/28?lang=eng'
    quote: "beside him"
  - where: 'note 28:13 “Above it, or beside him”'
    claim: 'Keil takes the LORD to stand above in heaven'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/28.htm'
    quote: "Above in heaven stood Jehovah, and explained in words the symbol which he saw."
  - where: 'note 28:12 “Jesus takes the ladder’s place”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: "Jehovah is the premortal Jesus Christ and came to earth being born of Mary"
  - where: 'christ'
    claim: 'Jacob heard the voice of the Lord Jehovah, the premortal Christ'
    key: skinner-keeper-covenants
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/03/jacob-keeper-of-covenants?lang=eng'
    quote: "He heard the voice of the Lord Jehovah, the premortal Christ"

  # ---------- note 28:14 ----------
  - where: 'note 28:14 “In thee and in thy seed”'
    claim: 'The promise was literally fulfilled in the Savior (Gal. 3:16)'
    key: skinner-keeper-covenants
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/03/jacob-keeper-of-covenants?lang=eng'
    quote: "That promise was literally fulfilled in the mortal advent of the Savior, Jesus Christ (see Gal. 3:16), and it is not impossible that Jacob glimpsed that fulfillment."
  - where: 'note 28:14 “In thee and in thy seed”'
    claim: 'The promise is also fulfilled as latter-day peoples become missionaries'
    key: skinner-keeper-covenants
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/03/jacob-keeper-of-covenants?lang=eng'
    quote: "Jacob’s seed—all latter-day peoples who accept the restored gospel—have become missionaries of the name and gospel of the Son of God."

  # ---------- note 28:17 ----------
  - where: 'note 28:17 “Beth-el as a temple”'
    claim: 'President Romney: Jacob considered the site so sacred he named it Bethel'
    key: romney-temples-1971
    url: 'https://www.churchofjesuschrist.org/study/ensign/1971/03/temples-the-gates-to-heaven?lang=eng'
    quote: "Because he had met the Lord and entered into covenants with him there, Jacob considered the site so sacred that he named the place Bethel"
  - where: 'note 28:17 “Beth-el as a temple”'
    claim: 'President Romney: temples are to us what Bethel was to Jacob'
    key: romney-temples-1971
    url: 'https://www.churchofjesuschrist.org/study/ensign/1971/03/temples-the-gates-to-heaven?lang=eng'
    quote: "Temples are to us all what Bethel was to Jacob."
  - where: 'note 28:17 “Beth-el as a temple”'
    claim: 'Skinner: Jacob had a templelike experience, and the point ties the other five together'
    key: skinner-keeper-covenants
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/03/jacob-keeper-of-covenants?lang=eng'
    quote: "Sixth—and this point ties the other five points together—Jacob had a templelike experience on the occasion of this vision."
