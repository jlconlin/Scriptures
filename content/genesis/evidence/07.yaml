  # ---------- note 7:24 ----------
  - where: 'note 7:24 “Seven, forty, and a hundred and fifty days”'
    claim: 'The 40 days of rain raised the waters, which stood at their height for 150 days'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/7.htm'
    quote: 'relate to the 40 days'' rain combined with the bursting forth of the foundations beneath the earth. By these the water was eventually raised to the height given, at which it remained 150 days'
  - where: 'note 7:24 “Seven, forty, and a hundred and fifty days”'
    claim: 'The ark rested on the 17th day of the 7th month after the 150 days (8:3–4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/8?lang=eng'
    quote: 'and after the end of the hundred and fifty days the waters were abated.'
  - where: 'note 7:24 “Seven, forty, and a hundred and fifty days”'
    claim: 'From 17/2 to 17/7 is 150 days if months are 30 days'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'The decrease first became perceptible when the ark rested upon the mountains of Ararat on the 17th day of the seventh month; i.e.,, reckoning 30 days to a month, exactly 150 days after the flood commenced.'
  - where: 'note 7:24 “Seven, forty, and a hundred and fifty days”'
    claim: 'The Flood lasted a year and ten days (to 27/2 of the 601st year)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'As the flood commenced on the 17th of the second month of the 600th year of Noah''s life, and ended on the 27th of the second month of the 601st year, it lasted a year and ten days'
  - where: 'note 7:24 “Seven, forty, and a hundred and fifty days”'
    claim: '150 days for the waters to rise and 150 to recede, then a drying period, over a year in all'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'Genesis 7:24 and 8:3 talk of it taking 150 days for the flood waters to rise and another 150 for them to recede, along with a drying period that takes even more time, over a year, to complete.'
  - where: 'note 7:24 “Seven, forty, and a hundred and fifty days”'
    claim: 'The seven days of waiting: a period of patience precedes God’s word being fulfilled'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/7.htm'
    quote: 'Moreover, throughout the Genesis story, a period of probation and patience precedes the fulfilment of the Divine word.'
  - where: 'note 7:24 “Seven, forty, and a hundred and fifty days”'
    claim: 'Peter calls the time before the Flood the time when the longsuffering of God waited'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'Peter referred to this period as the time when “the longsuffering of God waited.”'

