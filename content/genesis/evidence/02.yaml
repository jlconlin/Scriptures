chapter: 2
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The scriptures do not say how or when the earth was created'
    key: scripture-helps-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/02-genesis-1-2-moses-2-3-abraham-4-5?lang=eng'
    quote: 'the scriptures do not provide details about how or when the earth was created.'
  - where: setting
    claim: 'Each new section of Genesis begins “These are the generations”'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'The structure of the book of Genesis rests on several genealogies. Each new section begins “These are the generations,”'
  - where: setting
    claim: 'Abraham 5 tells of the woman (5:16) before the naming of the animals (5:20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'formed they a woman, and brought her unto the man … And out of the ground the Gods formed every beast of the field, and every fowl of the air, and brought them unto Adam'
  - where: setting
    claim: 'Jesus quotes Gen. 2:24 when asked about putting away a wife (Matt. 19:3–6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/19?lang=eng'
    quote: 'Is it lawful for a man to put away his wife for every cause? … For this cause shall a man leave father and mother, and shall cleave to his wife'
  - where: setting
    claim: 'Moses 3 retells the chapter in the first person, with additions (e.g., 3:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: 'For I, the Lord God, created all things, of which I have spoken, spiritually, before they were naturally upon the face of the earth.'

  # ---------- thread ----------
  - where: thread
    claim: 'Adam himself had to recognize his incompleteness; the naming of the animals shows the lack'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'it is not enough for God to pronounce that Adam alone is ‘not good,’ Adam himself needs to know and recognize his incompleteness'
  - where: thread
    claim: '“Till” (2:5; 3:23) is the verb ‘avad, the same as “dress” in 2:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/5647.htm'
    quote: 'verb work, serve … with accusative of thing, till the ground Genesis 2:5 ; Genesis 3:23'
  - where: thread
    claim: 'In 2:15 the Hebrew verb for “dress” is ‘avad (5647), “to work it”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-15.htm'
    quote: 'to work it … and to keep it'

  # ---------- sections ----------
  - where: section 2 plain
    claim: 'Hebrew terem, “not yet”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-5.htm'
    quote: 'not yet … had come to be … on the earth'
  - where: section 3 plain
    claim: 'KJV “Ethiopia” is Hebrew Cush'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'HEB Cush. Moses 3:13.'
  - where: section 3 plain
    claim: 'Hiddekel is the Tigris'
    key: bdb
    url: 'https://biblehub.com/hebrew/2313.htm'
    quote: 'proper name, of a river Tigris'
  - where: section 4 plain
    claim: '‘ezer kenegdo: a help corresponding to him'
    key: bdb
    url: 'https://biblehub.com/hebrew/5048.htm'
    quote: 'a help corresponding to him i.e. equal and adequate to himself'
  - where: section 4 plain
    claim: '2:22 the verb is “built”; 2:23 “at last”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-22.htm'
    quote: 'And built … the side'

  # ---------- 2:2 rest ----------
  - where: 'note 2:2 “Why God rested”'
    claim: 'Shavat means cease, desist, rest; used of God desisting from labour in Gen. 2:2–3'
    key: bdb
    url: 'https://biblehub.com/hebrew/7673.htm'
    quote: 'verb cease, desist, rest … 2 desist from labour, rest: a. with … (of god) Genesis 2:2 ,3(P)'
  - where: 'note 2:2 “Why God rested”'
    claim: 'The Hebrew of 2:2 says God finished “by the day … seventh”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-2.htm'
    quote: 'And finished … God … by the day … seventh'
  - where: 'note 2:2 “Why God rested”'
    claim: 'The Septuagint reads “on the sixth day” God finished his works'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/2.htm'
    quote: 'And God finished on the sixth day his works which he made, and he ceased on the seventh day from all his works which he made.'
  - where: 'note 2:2 “Why God rested”'
    claim: 'The Samaritan and Syriac also read “sixth”'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/2.htm'
    quote: 'of the work of creation on the seventh day (not on the sixth, as the lxx, Sam., and Syr. erroneously render it)'
  - where: 'note 2:2 “Why God rested”'
    claim: 'Moses 3:2 keeps “seventh” and adds that all things were finished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: 'And on the seventh day I, God, ended my work, and all things which I had made; and I rested on the seventh day from all my work, and all things which I had made were finished'
  - where: 'note 2:2 “Why God rested”'
    claim: 'One answer: God’s rest is not inactivity but a change in the kind of work, as He blesses and sanctifies'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'the narrative suggests that there is not so much a cessation of work as there is a change in the type of work or purpose of the work as God now blesses and sanctifies'

  # ---------- 2:3 sanctified ----------
  - where: 'note 2:3 “A day made holy”'
    claim: 'Qiddesh (Piel): set apart as sacred, consecrate, dedicate: Sinai, altar, tabernacle, priests, the seventh day'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: '1 set apart as sacred, consecrate, dedicate: a. places: Sinai Exodus 19:23 (J), alter, etc., Exodus 29:36,37 ; Exodus 30:29 (P), tabernacle … c. persons: priests … d. 7th day (by God) Genesis 2:3'
  - where: 'note 2:3 “A day made holy”'
    claim: 'The verb’s first occurrence is Gen. 2:3; the next is Ex. 13:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'Genesis 2:3 HEB: … KJV: day, and sanctified it: because … Exodus 13:2 HEB:'
  - where: 'note 2:3 “A day made holy”'
    claim: 'Sanctification moves a thing into a divine state'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'Thus, the act of sanctification is the moving of an object or item to a divine state.'
  - where: 'note 2:3 “A day made holy”'
    claim: 'In this reading the Creation was complete only when sanctified, like a temple dedication'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'Thus, it could be understood that the Creation was not truly complete until it had been sanctified, a process similar to that of a temple dedication.'

  # ---------- 2:4 generations ----------
  - where: 'note 2:4 “Why the Creation is told again”'
    claim: 'The first account runs 1:1–2:3, the second begins at 2:4; days belong to the first, the garden to the second'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'The first Creation account runs from Genesis 1:1 through 2:3. The second begins at 2:4. … The splitting up of the Creation into days is a characteristic of the first Creation account, while the creation of the Garden of Eden is a characteristic of the second account.'
  - where: 'note 2:4 “Why the Creation is told again”'
    claim: 'Genesis 2 gives no days and orders man, Eden, plants, animals, woman'
    key: sc-knowhy-400
    url: 'https://scripturecentral.org/knowhy/why-do-we-have-three-different-accounts-of-the-creation'
    quote: 'on the other hand, has no mention of the number of days. In addition, it reports that man was created first, then Eden, plants, animals, and finally woman.'
  - where: 'note 2:4 “Why the Creation is told again”'
    claim: 'Toledot: account of a man and his descendants'
    key: bdb
    url: 'https://biblehub.com/hebrew/8435.htm'
    quote: 'generations , especially in Genealogies = account of a man and his descendants'
  - where: 'note 2:4 “Why the Creation is told again”'
    claim: 'One reading: the heading introduces what happened to heaven and earth after creation, not their origin'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/2.htm'
    quote: 'so the tholedoth of the heavens and the earth do not describe the origin of the universe, but what happened to the heavens and the earth after their creation.'
  - where: 'note 2:4 “Why the Creation is told again”'
    claim: 'In the first account male and female are made at the same time; in the second the woman after the man'
    key: shannon-genesis-creation
    url: 'https://byustudies.byu.edu/article/the-genesis-creation-account-in-its-ancient-context'
    quote: 'In the first Creation account, males and females are created at the same time (Gen. 1:26–27), while in the second account, the female is created after and from the male (Gen. 2:18–22).'
  - where: 'note 2:4 “Why the Creation is told again”'
    claim: 'Documentary Hypothesis: Gen. 1 from P (Elohim), Gen. 2 from J (Jehovah)'
    key: sc-knowhy-850
    url: 'https://scripturecentral.org/knowhy/why-do-parts-of-old-testament-stories-seem-to-contradict-themselves'
    quote: 'One of the most common explanations for these kinds of inconsistencies is known as the Documentary Hypothesis. … Genesis 1 is generally held to be written by P (concerned with order and calls God Elohim), and Genesis 2 is usually thought to be written by J (concerned with human drama and calls God Jehovah).'
  - where: 'note 2:4 “Why the Creation is told again”'
    claim: 'Ancient readers read the Torah as a whole; the two chapters can be read as a unity'
    key: sc-knowhy-850
    url: 'https://scripturecentral.org/knowhy/why-do-parts-of-old-testament-stories-seem-to-contradict-themselves'
    quote: 'some scholars began to point out that ancient people read the Torah as a unified whole for thousands of years … However, the two chapters can be read as a unity to teach the reader something about God.'
  - where: 'note 2:4 “Why the Creation is told again”'
    claim: 'Bible Dictionary: Moses compiled Genesis from documentary sources and revelation'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'The Pentateuch was written by Moses, although it is evident that he used several documentary sources from which he compiled the book of Genesis, besides a divine revelation to him.'

  # ---------- 2:4 the LORD God ----------
  - where: 'note 2:4 “The LORD God”'
    claim: 'Hebrew of 2:4: YHWH Elohim'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-4.htm'
    quote: 'the generations … YHWH … God'
  - where: 'note 2:4 “The LORD God”'
    claim: 'The double name occurs twenty times in Gen. 2:4–3:24, rarely elsewhere'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/2.htm'
    quote: 'the use of the double name, which occurs here twenty times though rarely met with elsewhere, is always significant'
  - where: 'note 2:4 “The LORD God”'
    claim: 'LORD in small capitals = Jehovah; Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 2:4 “The LORD God”'
    claim: 'In the KJV the name Jehovah is printed as LORD in small capitals'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
  - where: 'note 2:4 “The LORD God”'
    claim: 'Latter-day Saints see Elohim and Jehovah as separate; Elohim in Gen. 1 and Jehovah in Gen. 2 could give insight'
    key: sc-knowhy-850
    url: 'https://scripturecentral.org/knowhy/why-do-parts-of-old-testament-stories-seem-to-contradict-themselves'
    quote: 'Of course, Latter-day Saint theology considers Elohim and Jehovah to be separate deity … For Latter-day Saints, the creative actions of Elohim in Genesis 1, followed by the creative actions of Jehovah in Genesis 2, could provide other insight.'

  # ---------- 2:5 spiritual creation ----------
  - where: 'note 2:5 “Created spiritually first”'
    claim: 'The Hebrew word rendered “before” is terem, “not yet”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-5.htm'
    quote: 'not yet … had come to be … on the earth'
  - where: 'note 2:5 “Created spiritually first”'
    claim: 'Modern translation: no plant of the field was yet in the earth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%202&version=NRSVUE'
    quote: 'when no plant of the field was yet in the earth and no vegetation of the field had yet sprung up'
  - where: 'note 2:5 “Created spiritually first”'
    claim: 'Moses 3:5 and 3:7 add the spiritual creation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: 'nevertheless, all things were before created; but spiritually were they created and made according to my word.'
  - where: 'note 2:5 “Created spiritually first”'
    claim: 'Joseph Fielding Smith: Moses 3:5 and Gen. 2:5 are parenthetical statements in the account of the physical creation'
    key: pgp-manual-moses-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-3-1-25?lang=eng'
    quote: 'are interpolations … thrown into the account of the physical creation, explaining that all things were first created in the spirit existence in heaven before they were placed upon this earth.'
  - where: 'note 2:5 “Created spiritually first”'
    claim: 'There is no account of the spirit creation itself, only a statement'
    key: pgp-manual-moses-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-3-1-25?lang=eng'
    quote: 'There is no account of the creation of man or other forms of life when they were created as spirits. There is just the simple statement that they were so created before the physical creation.'

  # ---------- 2:7 dust ----------
  - where: 'note 2:7 “The potter and the clay”'
    claim: 'Yatsar is used of a potter forming a vessel, and of God forming Adam as a potter'
    key: bdb
    url: 'https://biblehub.com/hebrew/3335.htm'
    quote: 'a. of a potter who forms out of clay a vessel … 2 of divine activity: a. (as a potter) forming Adam out of'
  - where: 'note 2:7 “The potter and the clay”'
    claim: 'Jer. 18 uses the potter (the same verb, participle yotser)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3335.htm'
    quote: 'of a potter who forms out of clay a vessel Isaiah 29:16 ; Isaiah 41:25 ; Jeremiah 18:4'
  - where: 'note 2:7 “The potter and the clay”'
    claim: 'The man (ha-adam) is formed from dust of the ground (ha-adamah)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-7.htm'
    quote: 'And formed … the man … dust … of … the ground'
  - where: 'note 2:7 “The potter and the clay”'
    claim: 'Adamah is the ground as tilled, used in 2:5, 3:17, 3:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/127.htm'
    quote: 'ground (as tilled, yielding sustenance) Genesis 2:5,9 ; Genesis 3:17,23'
  - where: 'note 2:7 “The potter and the clay”'
    claim: 'How the bodies of Adam and Eve were created has not been revealed (the statement Scripture Helps quotes)'
    key: new-era-evolution-2016
    url: 'https://www.churchofjesuschrist.org/study/new-era/2016/10/to-the-point/what-does-the-church-believe-about-evolution?lang=eng'
    quote: 'Though the details of what happened on earth before Adam and Eve, including how their bodies were created, have not been revealed, our teachings regarding man’s origin are clear and come from revelation.'

  # ---------- 2:7 breath ----------
  - where: 'note 2:7 “The breath of life and a living soul”'
    claim: 'Neshamah: breath; breath of life in 2:7; as breathed in by God it is God’s breath in man'
    key: bdb
    url: 'https://biblehub.com/hebrew/5397.htm'
    quote: 'noun feminine breath … breath of life … Genesis 2:7 (J) … as breathed in by God it is God''s breath in man'
  - where: 'note 2:7 “The breath of life and a living soul”'
    claim: 'Hebrew of 2:7: “a soul living” (nephesh chayyah)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/2-7.htm'
    quote: 'and He breathed … into his nostrils … the breath … of life … a soul … living'
  - where: 'note 2:7 “The breath of life and a living soul”'
    claim: 'Nephesh chayyah also designates animals as living creatures (Gen. 1:20, 24; 2:19)'
    key: pike-breath
    url: 'https://byustudies.byu.edu/article/the-latter-day-saint-reimaging-of-the-breath-of-life-genesis-27'
    quote: 'that this Hebrew phrase also occurs in Genesis 1:20 and 24 designating animals as “living creatures” (see also Gen. 2:19), and that it occurs at the end of Genesis 2:7 in reference to the first human'
  - where: 'note 2:7 “The breath of life and a living soul”'
    claim: 'Moses 3:7 and 3:19: both man and animals were given the breath of life'
    key: pike-breath
    url: 'https://byustudies.byu.edu/article/the-latter-day-saint-reimaging-of-the-breath-of-life-genesis-27'
    quote: 'Moses 3:7 and 3:19 explicitly indicate that both man and animals were given “the breath of life” in creation'
  - where: 'note 2:7 “The breath of life and a living soul”'
    claim: 'Moses 3:19: God breathed into the animals the breath of life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: 'and they were also living souls; for I, God, breathed into them the breath of life'
  - where: 'note 2:7 “The breath of life and a living soul”'
    claim: 'Abraham 5:7 adds that the Gods put the man’s spirit into him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/5?lang=eng'
    quote: 'And the Gods formed man from the dust of the ground, and took his spirit (that is, the man’s spirit), and put it into him; and breathed into his nostrils the breath of life, and man became a living soul.'

  - where: 'note 2:7 “The breath of life and a living soul”'
    claim: 'Moses 3:5: the children of men were created first in heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: 'And I, the Lord God, had created all the children of men; and not yet a man to till the ground; for in heaven created I them'
  - where: 'note 2:7 “The breath of life and a living soul”'
    claim: 'Abraham 5:7 helps us understand that the breath of life was the man’s spirit (the Church’s current reading, followed over the BYU Studies article’s)'
    key: pgp-manual-abr-4-5
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-abraham/facsimiles-2-3-abraham-4-5?lang=eng'
    quote: 'helps us understand that the breath of life was “the man’s spirit”'

  # ---------- 2:8 Eden ----------
  - where: 'note 2:8 “Eden, the garden of delight”'
    claim: 'Eden is a territory in which the garden lay; Hebrew probably associated it with ‘eden, delight'
    key: bdb
    url: 'https://biblehub.com/hebrew/5731.htm'
    quote: 'proper name, of a territory (probably associated by Hebrew with I. … district in which lay garden of'
  - where: 'note 2:8 “Eden, the garden of delight”'
    claim: '‘Eden (noun): luxury, dainty, delight'
    key: bdb
    url: 'https://biblehub.com/hebrew/5730.htm'
    quote: 'luxury, dainty, delight'
  - where: 'note 2:8 “Eden, the garden of delight”'
    claim: 'Septuagint 2:15: “the garden of Delight”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/2.htm'
    quote: 'And the Lord God took the man whom he had formed, and placed him in the garden of Delight, to cultivate and keep it.'
  - where: 'note 2:8 “Eden, the garden of delight”'
    claim: 'Eden used by the prophets as a simile of fertility'
    key: bdb
    url: 'https://biblehub.com/hebrew/5731.htm'
    quote: 'all simile of fertility'

  # ---------- 2:9 two trees ----------
  - where: 'note 2:9 “Two trees”'
    claim: 'Lehi gives details about Eden not in Genesis: the tree of life sweet, the forbidden fruit bitter'
    key: sc-knowhy-400
    url: 'https://scripturecentral.org/knowhy/why-do-we-have-three-different-accounts-of-the-creation'
    quote: 'Lehi provided additional details about the Garden of Eden story that are not mentioned in the Genesis account. He described the fruit of the tree of life as sweet and the forbidden fruit as bitter'
  - where: 'note 2:9 “Two trees”'
    claim: 'The command with its stated consequence is the first indication of agency'
    key: belnap-beginning
    url: 'https://rsc.byu.edu/creation-sinai/beginning'
    quote: 'Though often understood as merely prohibitive, the divine injunction is our first indication that humankind possesses individual agency.'
  - where: 'note 2:9 “Two trees”'
    claim: 'Moses 3:17 adds “thou mayest choose for thyself”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/3?lang=eng'
    quote: 'nevertheless, thou mayest choose for thyself, for it is given unto thee; but, remember that I forbid it'

  # ---------- 2:10 rivers ----------
  - where: 'note 2:10 “Where was Eden?”'
    claim: 'Hiddekel is the Tigris'
    key: bdb
    url: 'https://biblehub.com/hebrew/2313.htm'
    quote: 'proper name, of a river Tigris'
  - where: 'note 2:10 “Where was Eden?”'
    claim: 'Pishon: not identified with certainty; only theories'
    key: bdb
    url: 'https://biblehub.com/hebrew/6376.htm'
    quote: 'one of the rivers of Eden Genesis 2:11 … on theories of identification see Commentaries'
  - where: 'note 2:10 “Where was Eden?”'
    claim: 'Gihon: theories only; also a spring near Jerusalem'
    key: bdb
    url: 'https://biblehub.com/hebrew/1521.htm'
    quote: 'one of the rivers of Eden Genesis 2:13 (on theories of identity see Commentaries … 2 spring of water near Jerusalem'
  - where: 'note 2:10 “Where was Eden?”'
    claim: 'Cush (KJV Ethiopia): land and people of the southern Nile valley'
    key: bdb
    url: 'https://biblehub.com/hebrew/3568.htm'
    quote: '2 land and people of southern Nile-valley , or Upper Egypt'
  - where: 'note 2:10 “Where was Eden?”'
    claim: 'Brigham Young and Heber C. Kimball placed Eden in America, in Jackson County, Missouri'
    key: pgp-manual-moses-3
    url: 'https://www.churchofjesuschrist.org/study/manual/the-pearl-of-great-price-student-manual-2018/the-book-of-moses/moses-3-1-25?lang=eng'
    quote: 'In the beginning, after this earth was prepared for man, the Lord commenced his work upon what is now called the American continent, where the Garden of Eden was made … The spot chosen for the garden of Eden was Jackson County, in the State of Missouri'
  - where: 'note 2:10 “Where was Eden?”'
    claim: 'Adam-ondi-Ahman is in what is now Daviess County, Missouri'
    key: ot-manual-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-1-2-the-creation?lang=eng'
    quote: 'they eventually dwelt at a place called Adam-ondi-Ahman, situated in what is now Daviess County, Missouri.'
  - where: 'note 2:10 “Where was Eden?”'
    claim: 'The manual’s theory: Noah’s descendants named rivers after places known before the Flood'
    key: ot-manual-gen-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-1-2-the-creation?lang=eng'
