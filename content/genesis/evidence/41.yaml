chapter: 41
claims:
  - where: "setting"
    claim: "Joseph was about 17 when sold and 30 before Pharaoh; about 13 years in Potiphar’s house and prison"
    key: scripture-helps-gen-37-41
    url: "https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng"
    quote: "He was sold into slavery when he was about 17, and he was 30 years of age when Pharaoh appointed him to be second-in-command over Egypt. Altogether, he spent about 13 years in Potiphar’s house and in prison."
  - where: "setting"
    claim: "The Bible Dictionary counts the Pharaoh of Joseph among the Hyksos"
    key: bd-pharaoh
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng"
    quote: "(2) Pharaoh (also one of the Hyksos) and Joseph (Gen. 39–50)."
  - where: "setting"
    claim: "The Hyksos were Egyptianized Semites who came to rule Egypt"
    key: muhlestein-israel-egypt
    url: "https://rsc.byu.edu/creation-sinai/israel-egypt-canaan"
    quote: "thus a group of Egyptianized Semites ruled the eastern part of the Nile Delta as Egyptian kings. Their influence spread, and they came to rule more and more of the country until they eventually controlled all of Egypt by about 1650 BC."
  - where: "setting"
    claim: "One dating (Muhlestein): the most likely setting for Joseph is the beginning of Hyksos control, about 1650 BC"
    key: muhlestein-israel-egypt
    url: "https://rsc.byu.edu/creation-sinai/israel-egypt-canaan"
    quote: "we cannot date Joseph precisely, but the most likely setting for Joseph is when the Hyksos began to take control of all of Egypt, in about 1650 BC."
  - where: "setting"
    claim: "He says plainly the setting cannot be proved or disproved"
    key: muhlestein-israel-egypt
    url: "https://rsc.byu.edu/creation-sinai/israel-egypt-canaan"
    quote: "However, while the setting fits the story, we must be clear that we have no way of proving or disproving this hypothesis."
  - where: "setting"
    claim: "Ephraim and Manasseh, Joseph’s children, became tribes of Israel"
    key: bd-joseph
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/joseph?lang=eng"
    quote: "The tribes of Ephraim and Manasseh, Joseph’s children, were among the ten tribes of the Northern Kingdom of Israel"
  - where: "setting"
    claim: "One portion of Joseph’s descendants came to America about 600 B.C. and established two great peoples"
    key: bd-joseph
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/joseph?lang=eng"
    quote: "Also, one portion of Joseph’s descendants came to America about 600 B.C. and established two great peoples."
  - where: "setting"
    claim: "The Church’s edition of Genesis 41: text and chapter heading (Pharaoh dreams; Joseph marries Asenath; Manasseh and Ephraim; famine)"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng"
    quote: "Pharaoh dreams of the cattle and the ears of grain—Joseph interprets the dreams as seven years of plenty and seven of famine—He proposes a grain storage program—Pharaoh makes him ruler of all Egypt—Joseph marries Asenath"
  - where: "thread"
    claim: "Elohim (God) occurs nine times in chapter 41 (verses 16, 25, 28, 32 twice, 38, 39, 51, 52) and the name YHWH not at all; count made by searching the chapter in the WLC. Verse 16: Elohim yaaneh"
    key: oshb-wlc
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml"
    quote: "אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת שְׁל֥וֹם פַּרְעֹֽה"
  - where: "thread"
    claim: "Verses 25 and 28: ha-Elohim ‘oseh (“God … is doing”)"
