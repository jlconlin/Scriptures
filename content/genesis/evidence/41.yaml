    key: bdb
    url: "https://biblehub.com/hebrew/5382.htm"
    quote: "Pi`el Perfect3masculine singular suffix נַשַּׁ֫נִי Genesis 41:51 (E) God hath made me forget"
  - where: "section 1 plain"
    claim: "Joseph and Pharaoh stand by the Nile (the river)"
    key: keil-genesis
    url: "https://biblehub.com/commentaries/kad/genesis/41.htm"
    quote: "He was standing by the Nile, and saw seven fine fat cows ascend from the Nile"
  - where: "section 2 plain"
    claim: "“Answer of peace”: shalom covers welfare, so “an answer that is for his good”"
    key: bdb
    url: "https://biblehub.com/hebrew/7965.htm"
    quote: "completeness, soundness, welfare, peace"
  - where: "section 2 plain"
    claim: "Verse 15: the Hebrew verb is “hear” (KJV “understand”): Pharaoh has heard that Joseph hears a dream and can interpret it"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/genesis/41-15.htm"
    quote: "[that] you hear"
  - where: "section 4 plain"
    claim: "“Take up the fifth part of the land” means take the fifth part of the produce"
    key: bdb
    url: "https://biblehub.com/hebrew/2567.htm"
    quote: "and he shall fifth (take the fifth part of) the land of Egypt, i.e. the fifth part of the produce"
  - where: "section 5 plain"
    claim: "The cry “Bow the knee” (abrek) is of uncertain meaning"
    key: bdb
    url: "https://biblehub.com/hebrew/86.htm"
    quote: "proclaimed before Joseph Genesis 41:43 (meaning dubious; many Egyptian derivatives proposed;"
  - where: "section 5 plain"
    claim: "“Ring” is the king’s signet-ring"
    key: bdb
    url: "https://biblehub.com/hebrew/2885.htm"
    quote: "signet, signet-ring, ring"
  - where: "note 41:8 “The magicians and wise men of Egypt”"
    claim: "Chartummim: one possessed of occult knowledge, diviner, astrologer, magician"
    key: bdb
    url: "https://biblehub.com/hebrew/2748.htm"
    quote: "one possessed of occult knowledge, diviner, astrologer, magician"
  - where: "note 41:8 “The magicians and wise men of Egypt”"
    claim: "The word is always applied to Egyptian magicians (Daniel 2:2, late, excepted), which suggests an Egyptian origin"
    key: bdb
    url: "https://biblehub.com/hebrew/2748.htm"
    quote: "the fact that the word is always applied to Egyptian magicians, except Daniel 2:2 (late), suggests Egyptian origin"
  - where: "note 41:8 “The magicians and wise men of Egypt”"
    claim: "The manual: remarkable that the magicians could not have used their own symbolism"
    key: ot-manual-gen-37-50
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng"
    quote: "in some ways, it is remarkable that these magicians could not have come up with some kind of logical explanation using their own well-known symbolism"
  - where: "note 41:8 “The magicians and wise men of Egypt”"
    claim: "The manual prints Keil’s reading: the cow as symbol of earth, agriculture, food; the Nile as source of fertility"
    key: ot-manual-gen-37-50
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng"
    quote: "the cow was the symbol of Isis, the goddess of the all-sustaining earth, and in the hieroglyphics it represented the earth, agriculture, and food; and the Nile, by its overflowing, was the source of the fertility of the land."
  - where: "note 41:8 “The magicians and wise men of Egypt”"
    claim: "Keil’s own text of that reading"
    key: keil-genesis
    url: "https://biblehub.com/commentaries/kad/genesis/41.htm"
    quote: "For the cow was the symbol of Isis, the goddess of the all-sustaining earth, and in the hieroglyphics it represented the earth, agriculture, and food; and the Nile, by its overflowing, was the source of the fertility of the land."
  - where: "note 41:8 “The magicians and wise men of Egypt”"
    claim: "Egyptian dream manuals classify a dream as good or bad and read it as a sign of the future"
    key: gee-clothes-cups
    url: "https://rsc.byu.edu/creation-sinai/clothes-cups"
    quote: "In Egyptian manuals for interpreting dreams the situation in the dream is described, classified as either good or bad, and is then interpreted as a sign of what will happen in the future."
  - where: "note 41:8 “The magicians and wise men of Egypt”"
    claim: "Pharaoh’s dreams would have perplexed the priests because a cow was seen as good, measuring barley as bad"
    key: gee-clothes-cups
    url: "https://rsc.byu.edu/creation-sinai/clothes-cups"
    quote: "Pharaoh’s dreams would have perplexed the Egyptian priests because a connection with a cow was seen as good, while measuring barley was seen as bad."
  - where: "note 41:8 “The magicians and wise men of Egypt”"
    claim: "Joseph does not interpret as the manuals would have"
    key: gee-clothes-cups
    url: "https://rsc.byu.edu/creation-sinai/clothes-cups"
    quote: "Joseph, however, does not interpret the dream the way that the Egyptian dream interpretation manuals would have"
