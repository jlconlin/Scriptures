  # ---------- note 8:22 ----------
  - where: 'note 8:22 “As long as the earth lasts”'
    claim: 'The Hebrew reads “all the days of the earth”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-22.htm'
    quote: 'yə·mê יְמֵ֣י the days … hā·’ā·reṣ; הָאָ֑רֶץ of the earth'
  - where: 'note 8:22 “As long as the earth lasts”'
    claim: '“All the days of the earth”: as long as the earth lasts, day and night and the seasons will not be interrupted again'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'so long as the earth shall continue, the regular alternation of day and night and of the seasons of the year, so indispensable to the continuance of the human race, would never be interrupted again.'
  - where: 'note 8:22 “As long as the earth lasts”'
    claim: 'The Church’s edition cross-references “night” in 8:22 to Jer. 33:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/8?lang=eng'
    quote: 'Jer. 33:20 (20, 25).'
  - where: 'note 8:22 “As long as the earth lasts”'
    claim: 'The natural order is called a covenant because God pledged its continuance after the Flood (Jer. 33:20 with Gen. 8:22)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/33.htm'
    quote: 'These divine arrangements in nature are called a covenant; because God, after the flood, gave a pledge that they should uninterruptedly continue, in a covenant made with the human race; cf. Genesis 9:9 with Genesis 8:22 .'
  - where: 'note 8:22 “As long as the earth lasts”'
    claim: 'As this covenant cannot be broken, neither can the covenant with David and the Levites'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/33.htm'
    quote: 'As this covenant of nature cannot be broken by men, so also the covenant of grace of the Lord with David and the Levites cannot be broken'

