chapter: 8
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'The Church’s chronology lists Noah and the Flood among the early events without a date'
    key: bd-chronology
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Ministry of Noah; the Flood. Tower of Babel.'
  - where: 'when'
    claim: 'The chronology gives no dates for these events'
    key: bd-chronology
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '(Those desiring calculated dates on these events may wish to consult published chronologies.)'
  - where: 'setting'
    claim: 'The Book of Moses ends with the words of Genesis 6:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'And God said unto Noah: The end of all flesh is come before me, for the earth is filled with violence, and behold I will destroy all flesh from off the earth.'
  - where: 'setting'
    claim: 'The Church’s edition prints the JST of 8:20–22 as JST Gen. 9:4–6, in which Noah asks the Lord not to curse the earth again'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'JST, Genesis 9:4–6. Compare Genesis 8:20–22 After the Flood, Noah asks the Lord not to curse the earth again.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The word for “wind” in 8:1 is ruach'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-1.htm'
    quote: 'rū·aḥ ר֙וּחַ֙ a wind'
  - where: 'thread'
    claim: 'The word for “Spirit” in 1:2 is the same ruach'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/1-2.htm'
    quote: 'wə·rū·aḥ וְר֣וּחַ And the Spirit'
  - where: 'thread'
    claim: 'The wind of 8:1 recalls the creative wind of 1:2'
    key: ellicott-genesis
    url: 'https://biblehub.com/commentaries/ellicott/genesis/8.htm'
    quote: 'A wind (comp. the creative wind in Genesis 1:2 ) began to blow as soon as the rains ceased'
  - where: 'thread'
    claim: 'As the waters rise in chapter 7, the work of creation is undone'
    key: sc-knowhy-629
    url: 'https://scripturecentral.org/knowhy/why-is-the-story-of-noah-and-the-ark-so-repetitive'
    quote: 'In the first half of the chiasm, the work of creation, as stated in Genesis 1, is effectively undone as the flood waters rise.'
  - where: 'thread'
    claim: 'In 8:17 God renews the blessing of the creation (cf. 1:22)'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'He renewed the blessing of the creation ( Genesis 8:17 cf. Genesis 1:22 )'
  - where: 'thread'
    claim: '“Breed abundantly” in 8:17 is the word of 1:20, and the creation command is repeated'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'The same word as in Genesis 1:20 , “let the waters bring forth abundantly”'
  - where: 'thread'
    claim: 'The repeated creation command marks a new era'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'The repetition of the Creation command marks the beginning of a new era in the history of the world.'
  - where: 'thread'
    claim: 'The Hebrew of 8:17: swarm, be fruitful'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-17.htm'
    quote: 'wə·šā·rə·ṣū וְשָֽׁרְצ֣וּ and a let them swarm'
  - where: 'thread'
    claim: 'It is commonly accepted that the Flood is told as a re-creation paralleling the language of Genesis 1'
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'It is commonly accepted in biblical studies that the Flood constituted a re-creation of life, paralleling the context and language of the creation stories in Genesis.'
  - where: 'thread'
    claim: '“God remembered Noah” is the center of the Flood story’s chiasm'
    key: sc-knowhy-629
    url: 'https://scripturecentral.org/knowhy/why-is-the-story-of-noah-and-the-ark-so-repetitive'
    quote: 'it neatly divides the narrative in half, at its exact center point, when God remembers Noah (Genesis 8:1).'
  - where: 'thread'
    claim: 'Rest wordplay: the ark rests, the dove finds no rest, the “rest-giving” aroma'
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'the wordplay shifts from nḥm to nwḥ (“rest”), with the ark coming to “rest” ( wattānaḥ , 8:4), the dove’s attempt to find “rest” ( mānôaḥ , v. 9)'

  - where: 'thread'
    claim: 'Noah’s name was heard as “rest”'
    key: bowen-two-noahs
    url: 'https://journal.interpreterfoundation.org/this-son-shall-comfort-us-an-onomastic-tale-of-two-noahs/'
    quote: 'The narrator explains that Noah ( nōa ḥ “ … rest”) was so named because he would “comfort”'

  # ---------- note 8:1 ----------
  - where: 'note 8:1 “God remembered Noah”'
    claim: 'With God as subject, zakar means to remember people with kindness, protecting, delivering; Gen. 8:1 is an example'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'remember persons: a. individuals, with kindness, granting requests, protecting, delivering etc., with accusative of person, Genesis 30:22 (E)'
  - where: 'note 8:1 “God remembered Noah”'
    claim: 'Gen. 8:1 and 19:29 are listed under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'also Genesis 8:1 (P), Genesis 19:29 (P)'
  - where: 'note 8:1 “God remembered Noah”'
    claim: 'The same verb is used of God remembering His covenant, including Gen. 9:15–16'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'remember his own covenant (with them), accusative, Genesis 9:15,16'
  - where: 'note 8:1 “God remembered Noah”'
    claim: 'JST names the covenant God remembers as the one made with Enoch'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'I will look upon it, that I may remember the everlasting covenant, which I made unto thy father Enoch'
  - where: 'note 8:1 “God remembered Noah”'
    claim: 'The chiasm divides the story at its center, God remembering Noah'
    key: sc-knowhy-629
    url: 'https://scripturecentral.org/knowhy/why-is-the-story-of-noah-and-the-ark-so-repetitive'
    quote: 'it neatly divides the narrative in half, at its exact center point, when God remembers Noah (Genesis 8:1).'

  # ---------- note 8:4 ----------
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'Ararat is the name of a territory, Urartu, in eastern Armenia between the Araxes and Lakes Van and Urmia'
    key: bdb
    url: 'https://biblehub.com/hebrew/780.htm'
    quote: 'a district in Eastern Armenia between the river Araxes & lakes Van & Oroomiah'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'The land of Ararat in 2 Kgs. 19:37 probably refers to the same district'
    key: bdb
    url: 'https://biblehub.com/hebrew/780.htm'
    quote: 'to this probably reference in 2 Kings 19:37 = Isaiah 37:38'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'The Hebrew of 2 Kgs. 19:37 reads “the land of Ararat” where the KJV has Armenia'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_kings/19-37.htm'
    quote: '’e·reṣ אֶ֣רֶץ into the land … ’ă·rā·rāṭ; אֲרָרָ֑ט of Ararat'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'Ararat is a district, not a mountain; Assyrian Urartu'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'Ararat is not a mountain, but a district mentioned in Isaiah 37:38 ; Jeremiah 51:27 . It is the country which appears in the Assyrian inscriptions as “Urartu.”'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'The Hebrew reads “the mountains of Ararat”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-4.htm'
    quote: 'hā·rê הָרֵ֥י the mountains'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'Scripture gives no location for Mount Ararat'
    key: ot-manual-gen-4-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-4-11-the-patriarchs?lang=eng'
    quote: 'No location for Mount Ararat is given in the scriptures.'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'Latter-day Saint teachers have reasoned that Noah lived in the same general area as Adam'
    key: ot-manual-gen-4-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-4-11-the-patriarchs?lang=eng'
    quote: 'it is likely that Noah and his family lived somewhere in the general area.'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'Joseph Fielding Smith: a considerable distance between the ark’s start and its landing'
    key: ot-manual-gen-4-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-4-11-the-patriarchs?lang=eng'
    quote: 'Without any question a considerable distance separated the point where the Ark commenced the journey and where it landed.'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'Adam-ondi-Ahman is Spring Hill, in Daviess County, Missouri'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/116?lang=eng'
    quote: 'Spring Hill, Daviess County, Missouri, May or June 1838.'

  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'The loftiest mountain of Ararat is called Mount Ararat today'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'There were high mountains in Ararat; and the loftiest among them, called in the present day Mount Ararat'
  - where: 'note 8:4 “The mountains of Ararat”'
    claim: 'The quoted words are Elder Joseph Fielding Smith’s'
    key: ot-manual-gen-4-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-4-11-the-patriarchs?lang=eng'
    quote: 'Commenting on the distance traveled, Elder Joseph Fielding Smith said'

  # ---------- note 8:7 ----------
  - where: 'note 8:7 “The raven”'
    claim: 'The Hebrew says the raven went out “going out and returning”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-7.htm'
    quote: 'yā·ṣō·w יָצוֹא֙ going out … wā·šō·wḇ, וָשׁ֔וֹב and returning'
  - where: 'note 8:7 “The raven”'
    claim: 'The Septuagint says the raven did not return'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/8.htm'
    quote: 'And he sent forth a raven; and it went forth and returned not until the water was dried from off the earth.'
  - where: 'note 8:7 “The raven”'
    claim: 'The raven stayed out because mountain tops and carcases gave it resting places and food'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'as the mountain tops and the carcases floating upon the water afforded both resting-places and food'
  - where: 'note 8:7 “The raven”'
    claim: 'The raven settles on carcases; the dove only on what is dry and clean'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'the raven in seeking its food settles upon every carcase that it sees, whereas the dove will only settle upon what is dry and clean'
  - where: 'note 8:7 “The raven”'
    claim: 'In Gilgamesh the hero sends a dove and a swallow, which come back for lack of a place to alight'
    key: bm-deluge-1920
    url: 'https://archive.org/stream/babylonianstoryo00brituoft/babylonianstoryo00brituoft_djvu.txt'
    quote: 'I brought out a dove and let her go free. … Because she had no place to alight on she came back. … I brought out a- swallow and let her go free.'
  - where: 'note 8:7 “The raven”'
    claim: 'The raven in Gilgamesh did not come back'
    key: bm-deluge-1920
    url: 'https://archive.org/stream/babylonianstoryo00brituoft/babylonianstoryo00brituoft_djvu.txt'
    quote: 'I brought out a raven and let her go free. … She ate, she pecked in the ground, she croaked, she came not back.'

  # ---------- note 8:9 ----------
  - where: 'note 8:9 “No rest for the dove”'
    claim: 'The Hebrew word is manoach, “a resting place”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-9.htm'
    quote: 'mā·nō·w·aḥ מָנ֜וֹחַ a resting place'
  - where: 'note 8:9 “No rest for the dove”'
    claim: 'Manoach is a resting-place for the sole of the foot here and in Deut. 28:65'
    key: bdb
    url: 'https://biblehub.com/hebrew/4494.htm'
    quote: 'resting-place לְכַף רֶגֶל Genesis 8:9 (J), compare Deuteronomy 28:65'
  - where: 'note 8:9 “No rest for the dove”'
    claim: 'The verb “rested” in 8:4 is nuach (vattanach)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-4.htm'
    quote: 'wat·tā·naḥ'
  - where: 'note 8:9 “No rest for the dove”'
    claim: 'The wordplay on Noah’s name shifts to “rest”: the ark’s rest, the dove’s, and the “rest-giving” aroma'
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'the “sweet savour” ( rēaḥ hannîḥōaḥ , “soothing,” literally “rest-giving” aroma) of Noah’s sacrifice to the Lord after the Flood (v. 21)'

  - where: 'note 8:9 “No rest for the dove”'
    claim: 'Noah’s name was heard as “rest”'
    key: bowen-two-noahs
    url: 'https://journal.interpreterfoundation.org/this-son-shall-comfort-us-an-onomastic-tale-of-two-noahs/'
    quote: 'The narrator explains that Noah ( nōa ḥ “ … rest”) was so named because he would “comfort”'

  # ---------- note 8:11 ----------
  - where: 'note 8:11 “The olive leaf”'
    claim: 'Taraph means fresh-plucked'
    key: bdb
    url: 'https://biblehub.com/hebrew/2965.htm'
    quote: 'adjective fresh-plucked'
  - where: 'note 8:11 “The olive leaf”'
    claim: 'The leaf showed the waters had sunk and life had revived; symbol of peace; not in the Babylonian story'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'This would shew two things, (1) that the waters had sunk to a level at which the olive would grow, and (2) that life had revived upon the earth. The scene has universally been accepted as symbolical of reconciliation and peace.'
  - where: 'note 8:11 “The olive leaf”'
    claim: 'The olive leaf has no counterpart in the Babylonian story'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'It finds no counterpart in the Babylonian story.'
  - where: 'note 8:11 “The olive leaf”'
    claim: 'Joseph Smith called D&C 88 the “olive leaf,” the Lord’s message of peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'The Prophet designated it as the “‘olive leaf’ … plucked from the Tree of Paradise, the Lord’s message of peace to us.”'
  - where: 'note 8:11 “The olive leaf”'
    claim: 'It is possible Joseph Smith named D&C 88 the “olive leaf” with Noah’s dove in mind, as a sign of spiritual safety to the Saints in Missouri'
    key: dc-student-manual-2017-88
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-33-doctrine-and-covenants-88-1-69?lang=eng'
    quote: 'It is possible that Joseph Smith labeled this revelation as an “olive leaf” to provide a sign to the brethren in Missouri that spiritual safety was to be found in living the gospel, just as Noah learned that it was safe to walk again on the earth after the dove he sent out returned with an olive leaf in its beak'

  # ---------- note 8:20 ----------
  - where: 'note 8:20 “Noah’s first act”'
    claim: 'The burnt offering is wholly consumed and goes up in the flame to God'
    key: bdb
    url: 'https://biblehub.com/hebrew/5930.htm'
    quote: 'the whole burnt-offering (beast or fowl) is entirely consumed and goes up i the flame of the altar to God expressing the ascent of the soul in worship'
  - where: 'note 8:20 “Noah’s first act”'
    claim: 'Olah means “that which goes up”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5930.htm'
    quote: 'whole burnt-offering ( that which goes up'
  - where: 'note 8:20 “Noah’s first act”'
    claim: 'JST adds that Noah gave thanks and rejoiced'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'and offered burnt offerings on the altar; and gave thanks unto the Lord, and rejoiced in his heart.'
  - where: 'note 8:20 “Noah’s first act”'
    claim: 'Moses 5:7: sacrifice a similitude of the Only Begotten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth'
  - where: 'note 8:20 “Noah’s first act”'
    claim: 'John Taylor quotes the JST of these verses'
    key: taylor-mediation
    url: 'https://archive.org/download/examinationintoa00tayl_0/examinationintoa00tayl_0_djvu.txt'
    quote: 'The details of this act are given us somewhat dif- ferently in the inspired translation'
  - where: 'note 8:20 “Noah’s first act”'
    claim: 'John Taylor: the first act after the Flood was a recognition of the Atonement'
    key: taylor-mediation
    url: 'https://archive.org/download/examinationintoa00tayl_0/examinationintoa00tayl_0_djvu.txt'
    quote: 'the first act after the des- truction of the world by a flood was a recognition of the great expiatory principle of the atonement, which was to be made by the Only Begotten Son of God, as revealed by the angel to Adam.'
  - where: 'note 8:20 “Noah’s first act”'
    claim: 'The book is by President John Taylor'
    key: taylor-mediation
    url: 'https://archive.org/download/examinationintoa00tayl_0/examinationintoa00tayl_0_djvu.txt'
    quote: 'By PRESIDENT JOHN TAYLOR.'

  # ---------- note 8:21a ----------
  - where: 'note 8:21 “A soothing aroma”'
    claim: '“Sweet savour” is reach hannichoach in Hebrew'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-21.htm'
    quote: 'rê·aḥ רֵ֣יחַ the aroma … han·nî·ḥō·aḥ הַנִּיחֹחַ֒ pleasing'
  - where: 'note 8:21 “A soothing aroma”'
    claim: 'Nichoach: soothing, tranquillizing odour of sacrifices acceptable to the LORD; Lev. 1:9, 13, 17 and often'
    key: bdb
    url: 'https://biblehub.com/hebrew/5207.htm'
    quote: 'soothing, tranquillizing odour of sacrifices acceptable to'
  - where: 'note 8:21 “A soothing aroma”'
    claim: '“Smelled” is a very strong anthropomorphism found only here; “sweet savour” is a technical term of Levitical sacrifice'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'A very strong anthropomorphism which only occurs here. “Sweet savour” is a technical expression in the language of Levitical sacrifice.'
  - where: 'note 8:21 “A soothing aroma”'
    claim: 'The term says the offering is acceptable to God'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'The technical term is employed to express that the offering is acceptable to God.'
  - where: 'note 8:21 “A soothing aroma”'
    claim: 'Nichoach is “rest-giving,” a play on Noah’s name'
    key: schade-bowen-moses-8
    url: 'https://rsc.byu.edu/book-moses/moses-8-noah-flood'
    quote: 'the “sweet savour” ( rēaḥ hannîḥōaḥ , “soothing,” literally “rest-giving” aroma) of Noah’s sacrifice to the Lord after the Flood (v. 21)'

  # ---------- note 8:21b ----------
  - where: 'note 8:21 “Noah’s prayer”'
    claim: 'JST: the Lord blesses Noah, and Noah smells the savour and resolves to call on the Lord'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'And the Lord spake unto Noah, and he blessed him. And Noah smelled a sweet savor, and he said in his heart; I will call on the name of the Lord, that he will not again curse the ground any more for man’s sake'
  - where: 'note 8:21 “Noah’s prayer”'
    claim: 'In the first manuscript the prayer continues through the seasons, “may not cease with man”'
    key: jsp-ot1
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-1/25'
    quote: 'and that seed time and harvest and cold and heat and summer and winter and day and night may not cease with man'
  - where: 'note 8:21 “Noah’s prayer”'
    claim: 'The first manuscript has Noah smelling the savour and calling on the Lord'
    key: jsp-ot1
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-1/25'
    quote: 'and Noah smelled a sweet savour and he said in his heart I will call on the name of the Lord'
  - where: 'note 8:21 “Noah’s prayer”'
    claim: 'Moses 8:25 is the JST of Gen. 6:6, where it is Noah whom it repented'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'Moses 8:25  and the Joseph Smith Translation of  Genesis 6:6  revise this verse to say, “And it repented  Noah'
  - where: 'note 8:21 “Noah’s prayer”'
    claim: 'John Taylor: by faith Enoch obtained a covenant that the earth would never again be flooded after Noah’s day'
    key: taylor-mediation
    url: 'https://archive.org/download/examinationintoa00tayl_0/examinationintoa00tayl_0_djvu.txt'
    quote: 'by it he obtained a covenant from the Lord that after Noah''s day He would never again cover the earth by a flood'

  # ---------- note 8:21c ----------
  - where: 'note 8:21 “The same reason, now for mercy”'
    claim: 'The reason given seems inappropriate, since it was the reason for the Flood'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'This hardly seems an appropriate reason.'
  - where: 'note 8:21 “The same reason, now for mercy”'
    claim: 'In Keil’s reading man needs God’s forbearance'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'because evil is innate in man, and for that reason he needs the forbearance of God'
  - where: 'note 8:21 “The same reason, now for mercy”'
    claim: '“From his youth” read as from when a person begins to act consciously'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/8.htm'
    quote: 'from his youth up (i.e., from the very time when he begins to act with consciousness)'
  - where: 'note 8:21 “The same reason, now for mercy”'
    claim: 'Read as the reason God will not curse again, the clause says man is essentially sinful and must not be expected to be otherwise'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/8.htm'
    quote: 'that of the margin gives the reason why God will not again curse the ground, i.e. man is essentially sinful; he must not be expected to be otherwise.'
  - where: 'note 8:21 “The same reason, now for mercy”'
    claim: 'The conjunction is ki, rendered “though” in the interlinear'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/8-21.htm'
    quote: 'kî כִּ֠י though'
  - where: 'note 8:21 “The same reason, now for mercy”'
    claim: 'NRSVUE reads “for”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis%208%3A21&version=NRSVUE'
    quote: 'for the inclination of the human heart is evil from youth'
  - where: 'note 8:21 “The same reason, now for mercy”'
