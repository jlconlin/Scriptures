  - where: 'note 42:7 “Recognized, and not recognized”'
    claim: 'Semites grew beards, Egyptians shaved; Joseph is said to have shaved'
    key: gee-clothes-cups
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'While Semites tended to grow beards, Egyptians would shave, and Joseph is specifically said to have shaved (Genesis 41:14).'
  - where: 'note 42:7 “Recognized, and not recognized”'
    claim: 'Joseph was called by a different name (given by Pharaoh, Gen. 41:45) and used an interpreter as though he could not understand them'
    key: gee-clothes-cups
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'He was also called by a different name (Genesis 41:45) and used an interpreter as though he could not understand them (Genesis 42:23).'
