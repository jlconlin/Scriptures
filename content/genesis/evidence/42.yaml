chapter: 42
claims:
  - where: 'when'
    claim: 'More than twenty years since the brothers last saw Joseph (the manual counts twenty-two: 13 in slavery and prison, 7 of plenty, 2 of famine)'
    key: ot-manual-gen-37-50
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-37-50-joseph-the-power-of-preparation?lang=eng'
    quote: 'It had been twenty-two years since the sons of Jacob had last seen Joseph—thirteen years of slavery and prison for Joseph, seven years of plenty, and two years of famine'
  - where: 'setting'
    claim: 'Egypt had the most stable agricultural system'
    key: muhlestein-egypt-bible
    url: 'https://rsc.byu.edu/vol-11-no-3-2010/egypt-bible'
    quote: 'agriculturally they were blessed with the most stable and regular agricultural system the world had ever had'
  - where: 'setting'
    claim: 'People went to Egypt in famine, as in Joseph’s day'
    key: muhlestein-egypt-bible
    url: 'https://rsc.byu.edu/vol-11-no-3-2010/egypt-bible'
    quote: 'Often when there was a famine, the people went to Egypt. The same thing occurred in Joseph’s day.'
  - where: 'thread'
    claim: 'Joseph’s treatment of his brothers is read as a test of whether they had changed'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Joseph seemed to be giving his brothers opportunities to prove that they had changed and would not betray Benjamin as they had betrayed him.'
  - where: 'thread'
    claim: 'The tests focus on Benjamin'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Most of these tests focused on young Benjamin, who had become Jacob’s favored son after Joseph was sold into slavery.'
