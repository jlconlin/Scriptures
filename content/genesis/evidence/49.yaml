    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'Let Reuben live, and not die; and let not his men be few.'
  - where: 'note 49:4 “Water that boils over”'
