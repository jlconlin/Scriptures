chapter: 49
claims:
  - where: 'when'
    claim: 'Jacob lived seventeen years in Egypt; his whole age was 147'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'And Jacob lived in the land of Egypt seventeen years: so the whole age of Jacob was an hundred forty and seven years.'
  - where: 'when'
    claim: 'Jacob adopted Ephraim and Manasseh in ch. 48, just before this chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'And now thy two sons, Ephraim and Manasseh, which were born unto thee in the land of Egypt before I came unto thee into Egypt, are mine'
  - where: 'setting'
    claim: 'The family lived in Goshen in Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'And Israel dwelt in the land of Egypt, in the country of Goshen'
  - where: 'setting'
    claim: 'Jacob made Joseph swear to bury him in Canaan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/47?lang=eng'
    quote: 'bury me not, I pray thee, in Egypt … and bury me in their buryingplace … Swear unto me. And he sware unto him.'
  - where: 'setting'
    claim: 'Jacob blessed Joseph’s sons and set Ephraim before Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'And he blessed them that day, saying, In thee shall Israel bless, saying, God make thee as Ephraim and as Manasseh: and he set Ephraim before Manasseh.'
  - where: 'setting'
    claim: 'Genesis 49 is in an older stage of Hebrew than most of the OT'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'the Blessings of Jacob (Genesis 49) and of Moses (Deuteronomy 33), … are all written in this earliest stage of the language.'
  - where: 'setting'
    claim: 'The Hebrew contains obscure and archaic terms and phrases, making translation hard'
    key: bradshaw-judah-joseph
    url: 'https://interpreterfoundation.org/knowhy-otl12a-how-should-we-understand-the-rich-symbolism-in-jacobs-blessings-of-judah-and-joseph/'
    quote: 'present difficult problems in translation, since they contain several obscure and archaic terms and phrases'
  - where: 'setting'
    claim: 'Reuben lay with Bilhah (35:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'Reuben went and lay with Bilhah his father’s concubine: and Israel heard it.'
  - where: 'setting'
    claim: 'Simeon and Levi slew the males of Shechem (34:25–26)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/34?lang=eng'
    quote: 'two of the sons of Jacob, Simeon and Levi, Dinah’s brethren, took each man his sword, and came upon the city boldly, and slew all the males.'
  - where: 'setting'
    claim: 'Genesis 49 appears to refer to Reuben’s sin; the Simeon and Levi lines appear to refer to Genesis 34'
    key: sc-knowhy-843
    url: 'https://scripturecentral.org/knowhy/why-is-judah-blessed-with-a-scepter-until-shiloh-comes'
    quote: 'The reference to the violence of Simeon and Levi appears, at first, to refer to Genesis 34.'
  - where: 'setting'
    claim: 'Reuben’s sin is the one Jacob refers to in 49:3–4'
    key: sc-knowhy-843
    url: 'https://scripturecentral.org/knowhy/why-is-judah-blessed-with-a-scepter-until-shiloh-comes'
    quote: 'Genesis 49 appears to refer to that sin.'
  - where: 'setting'
    claim: 'Reuben lost the birthright because of transgression (Gen. 35:22; 49:3–4)'
    key: bd-reuben
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/reuben?lang=eng'
    quote: 'he lost his birthright because of transgression (Gen. 35:22; 49:3–4)'
  - where: 'thread'
    claim: 'Genesis 49 refers to Reuben’s sin (35:22) and to Simeon and Levi’s violence (Gen. 34)'
    key: sc-knowhy-843
    url: 'https://scripturecentral.org/knowhy/why-is-judah-blessed-with-a-scepter-until-shiloh-comes'
    quote: 'The reference to the violence of Simeon and Levi appears, at first, to refer to Genesis 34.'
  - where: 'thread'
    claim: 'Reuben lost the birthright because of transgression (Gen. 35:22; 49:3–4)'
    key: bd-reuben
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/reuben?lang=eng'
    quote: 'he lost his birthright because of transgression (Gen. 35:22; 49:3–4)'
  - where: 'setting'
    claim: 'Chronicles says where Reuben’s birthright went'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'forasmuch as he defiled his father’s bed, his birthright was given unto the sons of Joseph'
  - where: 'setting'
    claim: 'Judah’s blessing is behind the title Lion of the tribe of Juda (Rev. 5:5)'
    key: sc-knowhy-843
    url: 'https://scripturecentral.org/knowhy/why-is-judah-blessed-with-a-scepter-until-shiloh-comes'
    quote: 'Revelation 5:5 employs imagery from this blessing and refers to Jesus as the “Lion of the Tribe of Judah.”'
  - where: 'setting'
    claim: 'Shiloh is the Messiah, in the Church’s reading'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'This interpretation is confirmed by JST Gen. 50:24 (Appendix)'
  - where: 'setting'
    claim: 'Joseph’s branches are applied by the Church to the Book of Mormon peoples (the Lehi family)'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'Lehi and his family, who migrated from Jerusalem to the Americas, played a key role in the fulfillment of this prophecy.'
  - where: 'setting'
    claim: 'Moses blessed the tribes again before his death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'And this is the blessing, wherewith Moses the man of God blessed the children of Israel before his death.'
  - where: 'thread'
    claim: 'Judah was the fourth of Leah’s sons; Reuben was the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun: The sons of Rachel; Joseph, and Benjamin'
  - where: 'thread'
    claim: 'Chronicles: birthright to Joseph, chief ruler from Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'For Judah prevailed above his brethren, and of him came the chief ruler; but the birthright was Joseph’s'
  - where: 'thread'
    claim: 'Judah’s blessing runs to Shiloh, whom the Church identifies as the Messiah'
    key: benson-message-judah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/12/a-message-to-judah-from-joseph?lang=eng'
    quote: 'It was revealed to Joseph Smith that Shiloh is the Messiah.'
  - where: 'thread'
    claim: 'Joseph’s branches read as the scattering of his descendants, including Book of Mormon peoples'
    key: scripture-helps-gen-42-50
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/11-genesis-42-50?lang=eng'
    quote: 'can refer to the scattering of Joseph’s descendants across the earth.'
  - where: 'thread'
    claim: 'Genesis 49:18 is the only line addressed to the LORD'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/49-18.htm'
    quote: 'לִֽישׁוּעָתְךָ֖ For Your salvation'
  - where: 'section 1 plain'
    claim: 'Plain rendering “in the days to come” for the KJV’s “in the last days” (see the note on verse 1)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis+49&version=NRSVUE'
    quote: 'that I may tell you what will happen to you in days to come'
  - where: 'section 2 plain'
    claim: 'Plain rendering “reckless as boiling water” for “unstable as water”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6349.htm'
    quote: 'wantonness, recklessness, unbridled license'
  - where: 'section 2 plain'
    claim: 'Plain rendering of verse 5 follows the NRSVUE (“weapons … swords”), not the KJV’s “in their habitations”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis+49&version=NRSVUE'
    quote: 'weapons of violence are their swords'
  - where: 'section 2 plain'
    claim: 'Plain rendering of verse 6: killed men, hamstrung oxen (see the note on verse 6)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis+49&version=NRSVUE'
    quote: 'for in their anger they killed men, and at their whim they hamstrung oxen.'
  - where: 'section 3 plain'
    claim: 'Plain rendering “like a lioness” for the KJV’s “as an old lion”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis+49&version=NRSVUE'
    quote: 'he stretches out like a lion, like a lioness'
  - where: 'section 3 plain'
    claim: 'Plain rendering “ruler’s staff” and “obedience” (see the notes on verse 10)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis+49&version=NRSVUE'
    quote: 'nor the ruler’s staff from between his feet'
  - where: 'section 4 plain'
    claim: 'Plain rendering of verse 19: Gad raided, and raiding at their heels (see the note on verse 16)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Genesis+49&version=NRSVUE'
    quote: 'Gad shall be raided by raiders, but he shall raid at their heels.'
  - where: 'note 49:1 “Jacob’s “last days””'
    claim: 'The Hebrew is be’acharit hayyamim, “in the last/end of the days”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/49-1.htm'
    quote: 'בְּאַחֲרִ֥ית in the last … הַיָּמִֽים׃ days'
  - where: 'note 49:1 “Jacob’s “last days””'
    claim: 'Lexicon: the phrase reaches as far as the speaker’s perspective; often Messianic future'
    key: bdb
    url: 'https://biblehub.com/hebrew/319.htm'
    quote: 'a prophetic phrase denoting the final period of the history so far as the speaker''s perspective reaches; the sense thus varies with the context, but it often = the ideal or Messianic future'
  - where: 'note 49:1 “Jacob’s “last days””'
    claim: 'Lexicon lists Gen. 49:1 under the period of Israel’s possession of Canaan, and Isa. 2:2 under the same phrase'
    key: bdb
    url: 'https://biblehub.com/hebrew/319.htm'
    quote: 'Genesis 49:1 (of the period of Israel''s possession of Canaan)'
  - where: 'note 49:1 “Jacob’s “last days””'
    claim: 'Lexicon lists Isa. 2:2 under the same phrase'
    key: bdb
    url: 'https://biblehub.com/hebrew/319.htm'
    quote: 'Hosea 3:5 ; Isaiah 2:2 ( = Micah 4:1)'
  - where: 'note 49:1 “Jacob’s “last days””'
    claim: 'Isa. 2:2 reads “in the last days”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/2?lang=eng'
    quote: 'And it shall come to pass in the last days, that the mountain of the Lord’s house shall be established in the top of the mountains'
  - where: 'note 49:1 “Jacob’s “last days””'
    claim: 'The Septuagint reads “in the last days” here'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/genesis/49.htm'
    quote: 'that I may tell you what shall happen to you in the last days.'
  - where: 'note 49:1 “Jacob’s “last days””'
    claim: 'The blessings’ time frame varies: some fulfilled in Old Testament times, others much later'
    key: bradshaw-judah-joseph
    url: 'https://interpreterfoundation.org/knowhy-otl12a-how-should-we-understand-the-rich-symbolism-in-jacobs-blessings-of-judah-and-joseph/'
    quote: 'some of the future events will have their fulfillment in Old Testament times while others will occur much later'
  - where: 'note 49:2 “A poem in the oldest Hebrew”'
    claim: 'Staircase parallelism, with Gen. 49:22 as an example'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'Genesis 49:22 contains one such parallelism: “A fruitful bough is Joseph, a fruitful bough by a spring.”'
  - where: 'note 49:2 “A poem in the oldest Hebrew”'
    claim: 'Staircase parallelism defined'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'an unusual kind of parallelism, known as “staircase parallelism,” in which the first half of a line is repeated in the next line, with the second half of each line being different.'
  - where: 'note 49:2 “A poem in the oldest Hebrew”'
    claim: 'Genesis 49 is in Archaic Biblical Hebrew, the oldest of three stages; also Song of the Sea, Song of Deborah, Moses’ blessing'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'The Song of the Sea (Exodus 15), the Song of Deborah (Judges 5), the Blessings of Jacob (Genesis 49) and of Moses (Deuteronomy 33)'
  - where: 'note 49:2 “A poem in the oldest Hebrew”'
    claim: 'Archaic Biblical Hebrew is the oldest of three stages and survives in small portions of otherwise Classical books'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'However, small portions of these Classical Biblical Hebrew books contain segments written in the oldest stage of the three: Archaic Biblical Hebrew.'
  - where: 'note 49:2 “A poem in the oldest Hebrew”'
    claim: 'Archaic Biblical Hebrew is older than the rest; likely dates from 1000 BC at the latest'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'Archaic Biblical Hebrew is much older than some might suppose, likely dating from 1000 BC at the latest.'
  - where: 'note 49:2 “A poem in the oldest Hebrew”'
    claim: 'Scribes likely kept such poems as early, esteemed material'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'songs or poems which were likely held in high regard as some of the earliest material known from ancient Israel'
  - where: 'note 49:2 “A poem in the oldest Hebrew”'
    claim: 'At 49:10 and 49:22 translators have few options beyond conjectural emendation'
    key: bradshaw-judah-joseph
    url: 'https://interpreterfoundation.org/knowhy-otl12a-how-should-we-understand-the-rich-symbolism-in-jacobs-blessings-of-judah-and-joseph/'
    quote: 'have been particularly troublesome, leaving translators with few options outside of … conjectural emendation … to reconstruct the text'
  - where: 'note 49:2 “A poem in the oldest Hebrew”'
    claim: 'The Hebrew of the blessings contains obscure and archaic terms and phrases'
    key: bradshaw-judah-joseph
    url: 'https://interpreterfoundation.org/knowhy-otl12a-how-should-we-understand-the-rich-symbolism-in-jacobs-blessings-of-judah-and-joseph/'
    quote: 'present difficult problems in translation, since they contain several obscure and archaic terms and phrases'
