    claim: 'Gen. 49:3 uses reshit + ’on (“beginning of strength”)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/49-3.htm'
    quote: 'וְרֵאשִׁ֣ית and the first … אוֹנִ֑י of my strength'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'Deut. 21:17 uses the same words for the firstborn: reshit ’ono'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/deuteronomy/21-17.htm'
    quote: 'רֵאשִׁ֣ית the beginning … אֹנ֔וֹ of his strength'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'The firstborn is “the beginning of his strength” and gets a double portion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'by giving him a double portion of all that he hath: for he is the beginning of his strength; the right of the firstborn is his.'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'Birthright included land and authority to preside; Reuben lost it'
    key: bd-birthright
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/birthright?lang=eng'
    quote: 'This generally included a land inheritance as well as the authority to preside.'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'Reuben is named among those who lost the birthright'
    key: bd-birthright
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/birthright?lang=eng'
    quote: 'such is the case with Esau (Gen. 25:24–34; 27) and Reuben (1 Chr. 5:1–2; Jer. 31:9)'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'Chronicles: where the pieces went'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'his birthright was given unto the sons of Joseph the son of Israel … For Judah prevailed above his brethren, and of him came the chief ruler; but the birthright was Joseph’s'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'The Targum of Palestine lists birthright, high priesthood, kingdom and where each goes'
    key: etheridge-targums
    url: 'https://archive.org/download/targumsonkelosa00ethegoog/targumsonkelosa00ethegoog_djvu.txt'
    quote: 'To thee belonged the birthright, and the high priesthood, and the kingdom: but because thou hast sinned, my son, the birthright is given to Joseph, and the kingdom to Jehuda, and the priesthood to Levi.'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'The Palestinian (Jonathan) Targum is a diffuse paraphrase with Jewish traditions'
    key: etheridge-targums
    url: 'https://archive.org/download/targumsonkelosa00ethegoog/targumsonkelosa00ethegoog_djvu.txt'
    quote: 'the more diffuse paraphrase of the Jonathan or Palestinian Targum, variegated with the picturesque traditions of the Jews'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'Levites ministered in the sanctuary'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The work of ministering in the sanctuary was assigned to this tribe.'
  - where: 'note 49:3 “What the firstborn would have had”'
    claim: 'The Lord took the Levites instead of all the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'I have taken the Levites from among the children of Israel instead of all the firstborn that openeth the matrix'
  - where: 'note 49:4 “Water that boils over”'
