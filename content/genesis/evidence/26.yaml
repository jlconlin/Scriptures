  # ---------- note 26:34 ----------
  - where: 'note 26:34 “Why Esau’s marriages grieved his parents”'
    claim: 'The Hittites were a branch of the Canaanites'
    key: bd-hittites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hittites?lang=eng'
    quote: 'The ancient people descended from Heth (Gen. 10:15). They were a branch of the Canaanites'
  - where: 'note 26:34 “Why Esau’s marriages grieved his parents”'
    claim: 'Marrying a Canaanite would have kept Isaac from the covenant of marriage and the Abrahamic blessings'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'Had Isaac married a Canaanite, he would not have been able to enter the Lord’s covenant of marriage and receive the Lord’s promised blessings associated with the Abrahamic covenant.'
  - where: 'note 26:34 “Why Esau’s marriages grieved his parents”'
    claim: 'Esau’s marriages are further examples of his disregard for the birthright'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'Additional examples of Esau’s disregard for his birthright are his marriages to Canaanite women outside of the covenant.'
  - where: 'note 26:34 “Why Esau’s marriages grieved his parents”'
    claim: 'In marrying a Hittite Esau gave up the blessings of the covenant his father and grandfather preserved'
    key: schade-isaac-jacob
    url: 'https://rsc.byu.edu/creation-sinai/isaac-jacob'
    quote: 'The chapter ends with a lament after Esau chooses to marry a Hittite and give up the blessings of the Abrahamic covenant his father and grandfather had sacrificed so dearly to preserve'
  - where: 'note 26:34 “Why Esau’s marriages grieved his parents”'
    claim: 'Isaac married at forty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And Isaac was forty years old when he took Rebekah to wife'
  - where: 'note 26:34 “Why Esau’s marriages grieved his parents”'
    claim: 'Rebekah never turned her back on Esau'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'She is never shown to turn her back on Esau, neither when he married the daughters of Hittites (Genesis 26:34–35)'
  - where: 'note 26:34 “Why Esau’s marriages grieved his parents”'
    claim: 'Esau’s marriage into Ishmael’s family may have been an attempt to repair his relationship with his mother'
    key: olson-matriarchs
    url: 'https://rsc.byu.edu/creation-sinai/matriarchs'
    quote: 'It also allows for the interpretation that Esau may have tried to repair his relationship with his mother when he married into a family more closely related to their immediate ancestors.'

