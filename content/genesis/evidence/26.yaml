chapter: 26
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'Isaac was sixty when the twins were born'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'and Isaac was threescore years old when she bare them.'
  - where: 'when'
    claim: 'Esau’s marriage at forty was in Isaac’s hundredth year'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/26.htm'
    quote: 'Esau married two wives in the 40th year of his age, the 100th of Isaac''s life'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Isaac’s life gathers around his birth, Moriah, his marriage, and his dealings with his sons'
    key: bd-isaac
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/isaac?lang=eng'
    quote: 'The main interest of his life gathers around his birth, the sacrifice on Mount Moriah (Gen. 22), his marriage (24; 25), and his dealings with his sons (27; 28).'
  - where: 'setting'
    claim: 'The incidents of this chapter resemble events in Abraham’s life'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/26.htm'
    quote: 'The incidents of Isaac''s life which are collected together in this chapter, from the time of his sojourn in the south country, resemble in many respects certain events in the life of Abraham'
  - where: 'setting'
    claim: 'The incidents also have their own distinctive features'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/26.htm'
    quote: 'but the distinctive peculiarities are such as to form a true picture of the dealings of God'
  - where: 'setting'
    claim: 'Famine drove Abraham to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And there was a famine in the land: and Abram went down into Egypt to sojourn there'
  - where: 'setting'
    claim: 'Abraham’s quarrel over a well with Abimelech’s servants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21?lang=eng'
    quote: 'And Abraham reproved Abimelech because of a well of water, which Abimelech’s servants had violently taken away.'
  - where: 'setting'
    claim: 'Abimelech and Phichol made an oath with Abraham, and the place was called Beer-sheba'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21?lang=eng'
    quote: 'Abimelech and Phichol the chief captain of his host spake unto Abraham'
  - where: 'setting'
    claim: 'Isaac lived in the region of Gerar and Beersheba, in the Negev'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'allowed settlements to flourish in marginal areas like the biblical Negev and the location of Beersheba and Gerar'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Verse 3: “I will be with you … and I will bless you” (’ehyeh ‘immakh, va’avarekhekka)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-3.htm'
    quote: 'וְאֶֽהְיֶ֥ה and I will be … עִמְּךָ֖ with you'
  - where: 'thread'
    claim: 'Verse 24: “for I am with you … and I will bless you”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-24.htm'
    quote: 'אִתְּךָ֣ with you … וּבֵֽרַכְתִּ֙יךָ֙ and I will bless you'
  - where: 'thread'
    claim: 'Verse 28: “YHWH has been with you” (hayah YHWH ‘immakh)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-28.htm'
    quote: 'הָיָ֣ה has been … עִמָּךְ֒ with you'
  - where: 'thread'
    claim: 'Verse 29: “you are now blessed of YHWH”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-29.htm'
    quote: 'בְּר֥וּךְ blessed … יְהוָֽה׃ of YHWH'
  - where: 'thread'
    claim: 'When God renews the covenant with Isaac and Jacob, they give their own witness, such as sacrifice'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'they do offer sacrifice or provide some type of unique witness that they will obey God’s command when God reinitiates the Abrahamic covenant with them'
  - where: 'thread'
    claim: 'Esau’s marriages were outside the covenant'
    key: scripture-helps-gen-24-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/09-genesis-24-33?lang=eng'
    quote: 'Additional examples of Esau’s disregard for his birthright are his marriages to Canaanite women outside of the covenant.'

  # ---------- note 26:1 ----------
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'The Abimelech of chapter 20 and of chapter 26 are possibly the same person'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: '(1) and (2) are possibly the same person, an early tradition having been preserved in two different forms.'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'Abraham and Isaac both met a ruler, or successive rulers, named Abimelech in the region of Gerar'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'Both Abraham and Isaac lived in the region of Gerar during droughts, and both had encounters with a ruler, or successive rulers, in the area named Abimelech'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'Philistines came from Caphtor, occupied the coast before Abraham, a confederation of five cities'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'A tribe that originally came from Caphtor (Crete, or perhaps part of Egypt) (Amos 9:7) and occupied before the days of Abraham (Gen. 21:32) the rich lowland on the Mediterranean coast'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'The Philistines were strongest in the time of Saul and David'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'Philistine power being at its height at the time of Saul’s death but rapidly declining during the reign of David'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'The Philistines were a confederation of five cities'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'One older commentary: the region was not yet Philistine, and the name is an anachronism of the writer'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/26.htm'
    quote: 'Strictly speaking, this portion of Palestine having not yet been occupied by the Philistines, their name is here used by a not unnatural anachronism on the part of the Hebrew writer'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'Gerar was near Gaza in southwestern Palestine'
    key: bd-gerar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gerar?lang=eng'
    quote: 'A place in southwestern Palestine, near Gaza (Gen. 10:19).'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'Gerar lay on the border of the Canaanites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/10?lang=eng'
    quote: 'And the border of the Canaanites was from Sidon, as thou comest to Gerar, unto Gaza'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'Gerar’s Middle Bronze Age fortifications enclose forty acres, one of the largest sites in southern Canaan; Beersheba was under Gerar’s control'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'The fortifications at biblical Gerar in the western Negev date to the Middle Bronze Age and enclose an area of forty acres, making the site one of the largest in southern Canaan.'
  - where: 'note 26:1 “Abimelech, the Philistines, and Gerar”'
    claim: 'Beersheba was under Gerar’s control'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'Concerning Abraham’s activity in the region of Gerar and Beersheba, a place under the control of Gerar'

  # ---------- note 26:2 ----------
  - where: 'note 26:2 “Why Isaac had to stay in the land”'
    claim: 'Isaac meant to go to Egypt too, and was stopped at Gerar'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/26.htm'
    quote: 'Isaac also intended to go there, but on the way, viz., in Gerar, he received instruction through a divine manifestation that he was to remain there.'
  - where: 'note 26:2 “Why Isaac had to stay in the land”'
    claim: 'As the heir to whom Canaan was promised, Isaac was not to leave it'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/26.htm'
    quote: 'As he was the seed to whom the land of Canaan was promised, he was directed not to leave it.'
  - where: 'note 26:2 “Why Isaac had to stay in the land”'
    claim: 'Verse 2 reads ’asher ’omar ’eleikha, “of which I shall tell you”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-2.htm'
    quote: 'אֲשֶׁ֖ר of which … אֹמַ֥ר I shall tell … אֵלֶֽיךָ׃ to you'
  - where: 'note 26:2 “Why Isaac had to stay in the land”'
    claim: 'Genesis 22:2 has the same Hebrew phrase'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-2.htm'
    quote: 'אֲשֶׁ֖ר of which … אֹמַ֥ר I will tell … אֵלֶֽיךָ׃ to you'
  - where: 'note 26:2 “Why Isaac had to stay in the land”'
    claim: 'The phrase “which I shall tell thee of” compares with the similar phrase in Gen. 22:2'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/26.htm'
    quote: 'which I shall tell thee of] Cf. the similar phrase in Genesis 12:1, Genesis 22:2.'
  - where: 'note 26:2 “Why Isaac had to stay in the land”'
    claim: 'Abraham forbade taking Isaac back, because the LORD had sworn the land to his seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/24?lang=eng'
    quote: 'that sware unto me, saying, Unto thy seed will I give this land'
  - where: 'note 26:2 “Why Isaac had to stay in the land”'
    claim: 'God later told Jacob not to fear going down to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/46?lang=eng'
    quote: 'fear not to go down into Egypt; for I will there make of thee a great nation'

  # ---------- note 26:3 ----------
  - where: 'note 26:3 “Heir and stranger in the same land”'
    claim: 'Gur, “sojourn,” means to dwell as a newcomer without original rights, used of the patriarchs in Canaan at Gen. 26:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/1481.htm'
    quote: 'dwell as a new-comer (compare גֵּר ) without original rights'
  - where: 'note 26:3 “Heir and stranger in the same land”'
    claim: 'BDB lists Gen. 26:3 under the patriarchs’ sojourning in Canaan'
    key: bdb
    url: 'https://biblehub.com/hebrew/1481.htm'
    quote: 'of partriarchs in Canaan Genesis 26:3 (J) Genesis 35:27'
  - where: 'note 26:3 “Heir and stranger in the same land”'
    claim: 'Verse 3 has gur, “Sojourn,” as an imperative'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-3.htm'
    quote: 'גּ֚וּר 3 Sojourn 3 V‑Qal‑Imp‑ms'
  - where: 'note 26:3 “Heir and stranger in the same land”'
    claim: 'Stephen: God gave Abraham no inheritance in it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And he gave him none inheritance in it, no, not so much as to set his foot on'
  - where: 'note 26:3 “Heir and stranger in the same land”'
    claim: 'They died not having received the promises'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'These all died in faith, not having received the promises, but having seen them afar off'

  # ---------- note 26:5 ----------
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'Verse 5: ‘eqev ’asher shama‘ Avraham beqoli, “because Abraham listened to my voice”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-5.htm'
    quote: 'עֵ֕קֶב … because … אֲשֶׁר־ that … שָׁמַ֥ע listened'
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'Genesis 22:18 has the same phrase, ‘eqev ’asher shama‘ta beqoli'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/22-18.htm'
    quote: 'עֵ֕קֶב because … אֲשֶׁ֥ר that … שָׁמַ֖עְתָּ you have listened'
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'The four Hebrew terms: mishmarti, mitsvotai, chuqqotai, wetorotai'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-5.htm'
    quote: 'מִשְׁמַרְתִּ֔י My charge … מִצְוֺתַ֖י My commandments … חֻקּוֹתַ֥י My statutes … וְתוֹרֹתָֽי׃ and My laws'
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'The words describing Abraham’s obedience frequently recur among the legal expressions of a later date'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/26.htm'
    quote: 'The piety of Abraham is described in words that indicate a perfect obedience to all the commands of God, and therefore frequently recur among the legal expressions of a later date.'
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'Deuteronomy uses the same words for the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'Therefore thou shalt love the Lord thy God, and keep his charge, and his statutes, and his judgments, and his commandments, alway.'
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'Abraham sought to receive instructions and keep the commandments of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng'
    quote: 'desiring to receive instructions, and to keep the commandments of God'
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'Abraham received the priesthood from Melchizedek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Which Abraham received the priesthood from Melchizedek'
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'The gospel was preached to Abraham'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'preached before the gospel unto Abraham'
  - where: 'note 26:5 “Laws before Sinai”'
    claim: 'Latter-day Saints, drawing on D&C 84:23–27 and Joseph Smith’s teaching, read the law of Moses as a renewal of the covenant status that existed from the beginning'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'Latter-day Saints have a relatively unique approach to the Mosaic covenant, which has been influenced by Restoration scriptures such as Doctrine and Covenants 84:23–27. Here and elsewhere, Joseph Smith taught that the Mosaic law was a renewal of the covenant status'

  # ---------- note 26:7 ----------
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'The wife-sister story is told of Abraham in Gen. 12 and 20 and of Isaac in Gen. 26'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'Sarah and Abraham in Genesis 12:10–20 and 20:1–18; Rebekah and Isaac in 26:1–16'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'The Book of Abraham records the Lord telling Abraham to say Sarai was his sister'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/2?lang=eng'
    quote: 'Let her say unto the Egyptians, she is thy sister, and thy soul shall live.'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'Sarah was Abraham’s half-sister'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/20?lang=eng'
    quote: 'she is the daughter of my father, but not the daughter of my mother; and she became my wife.'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'Rebekah was the daughter of Bethuel son of Nahor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/24?lang=eng'
    quote: 'Rebekah came out, who was born to Bethuel, son of Milcah, the wife of Nahor, Abraham’s brother'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'Hebrew kin terms did not separate siblings from their offspring; Abraham calls Lot his brother; even for Sarah writers are uneasy relying on this'
    key: strathearn-wife-sister
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/wife-sister-experience'
    quote: 'in which there is no definite linguistic separation between siblings and their offspring'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'Writers are uncomfortable relying solely on the kinship explanation'
    key: strathearn-wife-sister
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/wife-sister-experience'
    quote: 'those who write about this biblical incident generally feel uncomfortable relying solely on such an explanation'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'Abram calls Lot his brother'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/14?lang=eng'
    quote: 'And when Abram heard that his brother was taken captive'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'It can be uncomfortable to think of the patriarchs lying; they could make less than perfect choices; they are exalted'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'It can be uncomfortable to think of Abraham, Sarah, Isaac, and Rebekah lying to save their own skins.'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'As fallen human beings they could make less than perfect choices'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'It simply means that we can acknowledge that as fallen human beings, they could sometimes make less than perfect choices.'
  - where: 'note 26:7 “Isaac repeats his father’s words”'
    claim: 'Modern revelation says they have entered exaltation'
    key: shannon-abraham
    url: 'https://rsc.byu.edu/creation-sinai/abraham-man-relationships'
    quote: 'we know from modern revelation that they have entered into their exaltation (Doctrine and Covenants 132:37)'

  # ---------- note 26:8 ----------
  - where: 'note 26:8 “A play on Isaac’s name”'
    claim: '“Sporting” is metsacheq, Piel participle of tsachaq'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/26-8.htm'
    quote: 'מְצַחֵ֔ק was caressing V‑Piel‑Prtcpl‑ms'
  - where: 'note 26:8 “A play on Isaac’s name”'
    claim: 'Tsachaq means laugh; in the Piel sport, play; at 26:8 of conjugal caresses; Gen. 21:9 uses the same participle'
    key: bdb
    url: 'https://biblehub.com/hebrew/6711.htm'
    quote: 'toy with ( אֶת ), of conjugal caresses Genesis 26:8'
  - where: 'note 26:8 “A play on Isaac’s name”'
    claim: 'Tsachaq: verb laugh; Piel sport, play (Gen. 21:9)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6711.htm'
    quote: '2 sport, play Genesis 21:9 (E) Exodus 32:6 (J)'
  - where: 'note 26:8 “A play on Isaac’s name”'
    claim: 'Isaac means “he laugheth,” with plays on the name including Gen. 26:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/3327.htm'
    quote: 'he laugheth , compare play upon name Genesis 18:12 f. (J), Genesis 21:6 (E), Genesis 17:17 ,19 (P); Genesis 26:8 (J)'
  - where: 'note 26:8 “A play on Isaac’s name”'
    claim: 'Ishmael’s “mocking” in Gen. 21:9 is the same Piel participle, metsacheq'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/21-9.htm'
    quote: 'מְצַחֵֽק׃ mocking V‑Piel‑Prtcpl‑ms'
  - where: 'note 26:8 “A play on Isaac’s name”'
    claim: 'Isaac means “he laugheth”'
    key: bd-isaac
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/isaac?lang=eng'
    quote: 'He laugheth. The son born to Abraham and Sarah in their old age'

  # ---------- note 26:12 ----------
  - where: 'note 26:12 “A hundredfold in a year of famine”'
    claim: 'Isaac practiced both agriculture and pastoralism near Gerar'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'Isaac is depicted engaging in both agriculture and pastoralism in the region of Gerar (Genesis 26:12, 14)'
  - where: 'note 26:12 “A hundredfold in a year of famine”'
    claim: 'The ancestors were economically integrated with the settled towns'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'the ancestors were not outcasts or shunned by society but were economically integrated into the larger economies of the Canaanite kingdoms'
  - where: 'note 26:12 “A hundredfold in a year of famine”'
    claim: 'A hundredfold was an unusual yield; 25- to 50-fold was usual even in fertile regions'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/26.htm'
    quote: 'This was an unusual blessing, as the yield even in very fertile regions is not generally greater than from twenty-five to fifty-fold'
  - where: 'note 26:12 “A hundredfold in a year of famine”'
    claim: 'Isaac received the promised blessing'
    key: keil-genesis
    url: 'https://biblehub.com/commentaries/kad/genesis/26.htm'
    quote: 'so did he received while in Gerar the promised blessing'

  # ---------- note 26:18 ----------
  - where: 'note 26:18 “His father’s wells”'
    claim: 'Isaac’s people came into conflict with the settled population’s herders over water'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'his group soon comes into conflict with the herders from the sedentary population over access to water'
  - where: 'note 26:18 “His father’s wells”'
    claim: 'Seizure and defense of wells in the Tale of Sinuhe parallels Abraham and Isaac'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'also finds parallels in the lives of Abraham and Isaac in the Negev (Genesis 21:25; 26:15, 20)'
