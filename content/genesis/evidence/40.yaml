    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'Can we find such a one as this is, a man in whom the Spirit of God is?'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'Bible Dictionary: Joseph a visionary man, a dreamer and interpreter of dreams'
    key: 'bd-joseph'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joseph?lang=eng'
    quote: 'Joseph was a visionary man, a dreamer and interpreter of dreams'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'Daniel 2:27–28: the wise men cannot show the king; there is a God in heaven that revealeth secrets'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'The secret which the king hath demanded cannot the wise men, the astrologers, the magicians, the soothsayers, shew unto the king; But there is a God in heaven that revealeth secrets'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'Genesis 40 does not say who sent the officers’ dreams (verse 5 text)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/40?lang=eng'
    quote: 'And they dreamed a dream both of them, each man his dream in one night'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'In prison the officers were cut off from those who served as dream interpreters'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'Being in prison, they were cut off from society including those who served as dream interpreters.'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'Egyptian dream interpreters consulted manuals, several of which are known'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'Dream interpreters consulted manuals, a number of which are known from ancient Egypt.'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'The manuals describe the dream, classify it as good or bad, and read it as a sign of the future'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'In Egyptian manuals for interpreting dreams the situation in the dream is described, classified as either good or bad, and is then interpreted as a sign of what will happen in the future.'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'The Egyptian dream manual on eating grapes: good'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'if a man sees himself in a dream eating grapes, it is good because his own things will be given to him.'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'The Egyptian dream manual on being given white bread: good'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'If a man sees himself in a dream and white bread … is given to him, it is good because it means that things will cheer him up'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'Joseph’s interpretation of the butler’s dream aligns with Egyptian interpretations of similar dreams'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'In this case, Joseph’s interpretation aligns with the ancient Egyptian interpretations of similar dreams.'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'Joseph’s interpretation of the baker’s dream differed from the Egyptian interpretation of similar dreams'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'The baker also had a dream, but Joseph’s interpretation of it differed from the ancient Egyptian interpretation of similar dreams.'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'The manuals’ method was not Joseph’s; they show how Egyptians would have read the dreams'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'This was not the method that Joseph used to interpret dreams but the manuals tell us how Egyptians would have interpreted them'
  - where: 'note 40:8 “Why there was no interpreter”'
    claim: 'Joseph’s interpretations from the Lord did not necessarily match those of Egyptian sages'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'Joseph’s interpretations from the Lord did not necessarily match those that Egyptian sages gave'
