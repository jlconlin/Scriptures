    claim: 'Septuagint: they trespassed against their lord the king'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/genesis/40.htm'
    quote: 'trespassed against their lord the king of Egypt'
  - where: 'note 40:1 “Pharaoh’s butler and baker”'
    claim: 'Pharaoh was wroth against two of his officers and put them in ward'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/40?lang=eng'
    quote: 'And Pharaoh was wroth against two of his officers, against the chief of the butlers, and against the chief of the bakers.'
  - where: 'note 40:1 “Pharaoh’s butler and baker”'
    claim: 'Webster 1828: offend can mean transgress the moral law, sin, commit a crime'
    key: 'webster-1828'
    url: 'https://webstersdictionary1828.com/Dictionary/offend'
    quote: 'To transgress the moral or divine law; to sin; to commit a crime.'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
