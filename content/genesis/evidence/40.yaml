    quote: 'Joseph’s master (cf. Genesis 37:36) is the officer in whose house is the prison'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'Chapter 39:22: keeper of the prison commits the prisoners to Joseph'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/39?lang=eng'
    quote: 'And the keeper of the prison committed to Joseph’s hand all the prisoners that were in the prison'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'Verse 4: the captain charged Joseph with them, and he served them'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/40?lang=eng'
    quote: 'And the captain of the guard charged Joseph with them, and he served them'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'The butler calls Joseph servant to the captain of the guard (41:12)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'an Hebrew, servant to the captain of the guard'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'Cambridge: this differs from 39:22, where Joseph is a prisoner appointed by the keeper'
    key: 'ryle-genesis'
    url: 'https://biblehub.com/commentaries/cambridge/genesis/40.htm'
    quote: 'This is different from the idea given in Genesis 39:22, where he is a prisoner, and appointed by the “keeper of the prison” to look after the other prisoners.'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'Cambridge: chapter 40 from E; compiler harmonizes with J by inserting words in verses 3, 5, 15'
    key: 'ryle-genesis'
    url: 'https://biblehub.com/commentaries/cambridge/genesis/40.htm'
    quote: 'Though the narrative is from E, the Compiler endeavours to harmonize the account with that of J by inserting words in Genesis 40:3; Genesis 40:5; Genesis 40:15'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'Septuagint: the chief keeper of the prison committed them to Joseph'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/genesis/40.htm'
    quote: 'the chief keeper of the prison committed them to Joseph'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'Joseph had charge of all the prisoners and apparently visited them and took them their rations'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'While he could not leave the prison, he had charge of all the prisoners (Genesis 39:21–23) and apparently visited them and took them their rations.'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'An Egyptian record tells of a prisoner to whom a man of Pharaoh’s household staff was assigned and whose rations were brought daily from the palace'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'an agent, a staff bearer, a man of the household staff of Pharaoh was assigned to him, and it came to pass that his rations used to be brought in daily from Pharaoh’s palace in Memphis.'
  - where: 'note 40:3 “Whose prison, and who was in charge?”'
    claim: 'Joseph would have served this role to the other prisoners'
    key: 'gee-clothes-cups'
    url: 'https://rsc.byu.edu/creation-sinai/clothes-cups'
    quote: 'Joseph would have served this role to the other prisoners.'
  - where: 'note 40:8 “Why there was no interpreter”'
