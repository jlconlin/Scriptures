  - where: 'note 40:1 “Pharaoh’s butler and baker”'
    claim: 'Butler = Hebrew mashqeh, literally one giving drink, cupbearer'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4945.htm'
    quote: 'butler, cup-bearer (properly Participle Hiph`il = one giving drink)'
