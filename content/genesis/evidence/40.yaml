chapter: 40
claims:
  - where: 'when'
    claim: 'Joseph was seventeen when he was sold'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'Joseph, being seventeen years old, was feeding the flock with his brethren'
  - where: 'when'
    claim: 'Joseph was thirty when he stood before Pharaoh'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'And Joseph was thirty years old when he stood before Pharaoh king of Egypt.'
  - where: 'when'
    claim: 'Chapter 41 opens “at the end of two full years”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'And it came to pass at the end of two full years, that Pharaoh dreamed'
  - where: 'setting'
    claim: 'Potiphar is “an officer of Pharaoh, captain of the guard”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/39?lang=eng'
    quote: 'Potiphar, an officer of Pharaoh, captain of the guard, an Egyptian, bought him'
  - where: 'setting'
    claim: 'Joseph was put into the prison where the king’s prisoners were bound'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/39?lang=eng'
    quote: 'And Joseph’s master took him, and put him into the prison, a place where the king’s prisoners were bound'
  - where: 'setting'
    claim: 'The LORD was with Joseph in the prison (39:21)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/39?lang=eng'
    quote: 'But the Lord was with Joseph, and shewed him mercy, and gave him favour in the sight of the keeper of the prison.'
  - where: 'setting'
    claim: 'Joseph prospered in Potiphar’s house until he was wrongly accused and sent to prison'
    key: 'scripture-helps-gen-37-41'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/10-genesis-37-41?lang=eng'
    quote: 'He prospered in Potiphar’s house until he was wrongly accused and sent to prison.'
  - where: 'setting'
    claim: 'Joseph’s own dream in chapter 37'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'And Joseph dreamed a dream, and he told it his brethren: and they hated him yet the more.'
  - where: 'setting'
    claim: 'The butler remembers Joseph before Pharaoh in chapter 41'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'Then spake the chief butler unto Pharaoh, saying, I do remember my faults this day'
  - where: 'setting'
    claim: 'Pharaoh sends for Joseph in chapter 41'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'Then Pharaoh sent and called Joseph, and they brought him hastily out of the dungeon'
  - where: 'setting'
    claim: 'Psalm 105: fetters, iron, until his word came, the word of the LORD tried him'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/105?lang=eng'
    quote: 'Whose feet they hurt with fetters: he was laid in iron: Until the time that his word came: the word of the Lord tried him.'
  - where: 'setting'
    claim: 'Stephen: God was with Joseph and delivered him out of all his afflictions'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'but God was with him, And delivered him out of all his afflictions'
  - where: 'thread'
