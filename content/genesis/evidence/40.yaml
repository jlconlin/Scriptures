    claim: 'The same Hebrew word names Nehemiah’s office (Neh. 1:11)'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4945.htm'
    quote: 'absolute ׳מ Genesis 40:5 (E), Nehemiah 1:11'
  - where: 'note 40:1 “Pharaoh’s butler and baker”'
    claim: 'Webster 1828 defines a butler as an officer in the houses of princes who takes charge of the liquors'
    key: 'webster-1828'
    url: 'https://webstersdictionary1828.com/Dictionary/butler'
    quote: 'A servant or officer in the houses of princes and great men, whose principal business is to take charge of the liquors'
  - where: 'note 40:1 “Pharaoh’s butler and baker”'
    claim: 'Each is called chief (sar) in verse 2'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים'
  - where: 'note 40:1 “Pharaoh’s butler and baker”'
    claim: '“Offended” is Hebrew chat’u, “sinned”'
    key: 'biblehub-interlinear'
    url: 'https://biblehub.com/interlinear/genesis/40-1.htm'
    quote: 'חָֽטְא֛וּ sinned'
