  # ---------- note 23:17 ----------
  - where: 'note 23:17 “A sale on the record”'
    claim: 'Qum: be established, confirmed, of a purchase; be assured to; Gen. 23:17, 20'
    key: bdb
    url: 'https://biblehub.com/hebrew/6965.htm'
    quote: 'of purchase Leviticus 27:19 , with ל person be assured to Leviticus 25:30 ; Genesis 23:17 ,20'
  - where: 'note 23:17 “A sale on the record”'
    claim: 'Boaz bought at the gate before the elders and people, who were witnesses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'And all the people that were in the gate, and the elders, said, We are witnesses.'
  - where: 'note 23:17 “A sale on the record”'
    claim: 'The Church’s footnote to verse 10 points to Gen. 34:20 and Ruth 4:1: the city gate as a place of public business'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/23?lang=eng'
    quote: 'Gen. 34:20 ; Ruth 4:1 .'
  - where: 'note 23:17 “A sale on the record”'
    claim: 'No written deed is mentioned, but parallels from Mari and Emar suggest a witnessed tablet'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'No mention is made of a written land deed, but parallels from Mari and Emar in Syria suggest that Abraham received a tablet with the details of the transaction that was witnessed by both parties.'
  - where: 'note 23:17 “A sale on the record”'
    claim: 'A substantial amount of narrative space is given to the land transaction'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'A substantial amount of narrative space is taken on the negotiation of a land transaction.'
  - where: 'note 23:17 “A sale on the record”'
    claim: 'One reading: the narrative derives from legal documents Abraham’s family preserved (an argument from the story’s length)'
    key: gee-wanderings
    url: 'https://rsc.byu.edu/creation-sinai/wanderings-abraham'
    quote: 'The fact that this narrative was kept argues that it is derived from legal documents that Abraham had, and his family had preserved and shows that the Genesis narrative was built from written sources that arguably derive from Abraham himself.'

