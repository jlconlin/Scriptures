chapter: 9
claims:
  # ---------- setting ----------
  - where: 'setting'
    claim: 'Joseph Smith’s changes to Genesis 9 are printed in the footnotes and the Bible’s appendix'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/9?lang=eng'
    quote: 'JST Gen. 9:10–15 (Appendix).'
  - where: 'setting'
    claim: 'The JST appendix prints the Genesis 9 changes on shedding blood and on the covenant with Enoch'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'Man is accountable for shedding the blood of animals and of men. God establishes with Noah and his sons the same covenant He made with Enoch.'
  - where: 'setting'
    claim: 'Genesis is divided by “These are the generations”; the section on Noah runs through chapter 9'
    key: bd-genesis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'
    quote: 'Each new section begins “These are the generations,” and there follows a genealogical list of certain portions of family history. Some major divisions of Genesis are: Adam ( Gen. 1–3 ).'

  - where: 'setting'
    claim: 'The Book of Moses ends with the equivalent of Gen. 6:13 (Moses 8:30, the last verse of the book)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/8?lang=eng'
    quote: 'And God said unto Noah: The end of all flesh is come before me, for the earth is filled with violence, and behold I will destroy all flesh from off the earth.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The word covenant comes seven times in Genesis 9:8–17'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'the word “covenant” (berit) is repeated seven times in Genesis 9:8–17.'
  - where: 'thread'
    claim: 'JST: the bow reminds God of the covenant with Enoch, that Zion would come again'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'which I made unto thy father Enoch; that, when men should keep all my commandments, Zion should again come on the earth'

  # ---------- note 9:1 ----------
  - where: 'note 9:1 “Noah begins again, like Adam”'
    claim: 'Genesis 9:1–3 alludes to the covenant language of the Garden of Eden: multiply and replenish, then dominion over the creatures'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'Here we have allusions to the covenant language found in the Garden of Eden—specifically, references to the commandments pertaining to marriage (multiply and replenish the earth, followed by the concept of dominion over the other creations; Genesis 9:2–3).'
  - where: 'note 9:1 “Noah begins again, like Adam”'
    claim: 'Joseph Smith: Adam had dominion over every living creature; Noah is Gabriel, next to Adam in priesthood authority, father of all living in his day, given the dominion'
    key: jsp-discourse-1839-a-richards
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-4-august-1839-a-as-reported-by-willard-richards/1'
    quote: 'he had dominion given him over every living Creature … Then to Noah who is Gabriel … he stands next in authority to Adam in the Priesthood; he was called of God to this office … was the Father of all living … in his day … To him was Given the Dominion'
  - where: 'note 9:1 “Noah begins again, like Adam”'
    claim: 'Noah is also the angel Gabriel'
    key: bd-noah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/noah?lang=eng'
    quote: 'We learn from latter-day revelation that Noah is also the angel Gabriel'

  # ---------- note 9:3 ----------
  - where: 'note 9:3 “Meat, with a limit”'
    claim: '“Meat” in 1828 English means food in general'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/meat'
    quote: 'Food in general; any thing eaten for nourishment, either by man or beast.'
  - where: 'note 9:3 “Meat, with a limit”'
    claim: 'JST: blood is not to be shed except for food to save life; God requires the blood of every beast'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'blood shall not be shed, only for meat, to save your lives; and the blood of every beast will I require at your hands'
  - where: 'note 9:3 “Meat, with a limit”'
    claim: 'The Church reads the JST as holding Noah’s posterity accountable for their treatment of animal life'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'emphasizing that God would hold Noah and his posterity accountable for how they treated the life of animals'

  # ---------- note 9:4 ----------
  - where: 'note 9:4 “The life is in the blood”'
    claim: 'Hebrew: flesh “with its life” (be-nafsho, from nefesh), its blood'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-4.htm'
    quote: 'bə·nap̄·šōw בְּנַפְשׁ֥וֹ with its life Prep‑b ¦ N‑fsc ¦ 3ms'
  - where: 'note 9:4 “The life is in the blood”'
    claim: 'Israel regarded blood as the seat of life; blood was forbidden as food from Gen. 9:4, and the restriction continued at the Jerusalem conference'
    key: bd-blood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blood?lang=eng'
    quote: 'Regarded by the Israelites as the seat of the life or vital energy of all flesh'
  - where: 'note 9:4 “The life is in the blood”'
    claim: 'The atoning power of sacrifice was in the blood, as the life and as a type of Christ'
    key: bd-blood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blood?lang=eng'
    quote: 'The atoning power of a sacrifice was in the blood because it was regarded as containing the life of the animal and because the sacrifice was a type of the great sacrifice who is Jesus Christ'
  - where: 'note 9:4 “The life is in the blood”'
    claim: 'The Jerusalem council kept the laws from Noah’s day for Gentile converts because they applied to all, unlike the law of Moses'
    key: sc-knowhy-680
    url: 'https://scripturecentral.org/knowhy/why-was-the-jerusalem-council-important'
    quote: 'Because these laws dated back to the time of Noah, they had universal applicability, whereas the law of Moses was issued only to the house of Israel.'

  # ---------- note 9:6 ----------
  - where: 'note 9:6 “Blood for blood, because of God’s image”'
    claim: 'Hebrew word order: sheds – blood – of man / by man – his blood – shall be shed'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-6.htm'
    quote: 'šō·p̄êḵ 6 שֹׁפֵךְ֙ 6 Whoever sheds'
  - where: 'note 9:6 “Blood for blood, because of God’s image”'
    claim: 'Hebrew word order, second half: by man – his blood – shall be shed (the reverse of the first half)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-6.htm'
    quote: 'bā·’ā·ḏām בָּֽאָדָ֖ם by the man'
  - where: 'note 9:6 “Blood for blood, because of God’s image”'
    claim: 'Hebrew word order: his blood shall be shed closes the clause'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-6.htm'
    quote: 'yiš·šā·p̄êḵ; יִשָּׁפֵ֑ךְ shall be shed'
  - where: 'note 9:6 “Blood for blood, because of God’s image”'
    claim: 'JST: man shall not shed the blood of man; every man’s brother shall preserve the life of man'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'for man shall not shed the blood of man. … For a commandment I give, that every man’s brother shall preserve the life of man, for in mine own image have I made man.'
  - where: 'note 9:6 “Blood for blood, because of God’s image”'
    claim: 'The Church leaves capital punishment to civil law and neither promotes nor opposes it'
    key: newsroom-capital-punishment
    url: 'https://newsroom.churchofjesuschrist.org/official-statement/capital-punishment'
    quote: 'regards the question of whether and in what circumstances the state should impose capital punishment as a matter to be decided solely by the prescribed processes of civil law. We neither promote nor oppose capital punishment.'

  # ---------- note 9:9 ----------
  - where: 'note 9:9 “The covenant God made with Enoch”'
    claim: 'heqim (“establish”) means to confirm a covenant already made; Noah is not entering a new one'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'which means to confirm or ratify pre-existing promises, oaths, vows, or covenants, and suggests that Noah is already in a covenant relationship with God and is thus not entering into a totally new one.'
  - where: 'note 9:9 “The covenant God made with Enoch”'
    claim: 'JST: the covenant established with Noah is the one made with Enoch'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'I will establish my covenant with you, which I made unto your father Enoch, concerning your seed after you.'
  - where: 'note 9:9 “The covenant God made with Enoch”'
    claim: 'The covenant with Noah (Gen. 9) is the one recorded in Moses 7:49–52'
    key: bd-noah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/noah?lang=eng'
    quote: 'The Lord’s covenant with Noah affirmed that the earth would never be covered with a flood again (Gen. 9:1–17; Moses 7:49–52).'

  # ---------- note 9:13 ----------
  - where: 'note 9:13 “Why a bow?”'
    claim: 'qeshet: bow for hunting and battle; second meaning rainbow, Ezek. 1:28 and Gen. 9:13, 14, 16'
    key: bdb
    url: 'https://biblehub.com/hebrew/7198.htm'
    quote: 'bow : a. for hunting Genesis 27:3 … 2 rainbow'
  - where: 'note 9:13 “Why a bow?”'
    claim: 'God calls it “my bow” (qashti); Hebrew of verse 13'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-13.htm'
    quote: 'qaš·tî קַשְׁתִּ֕י My bow'
  - where: 'note 9:13 “Why a bow?”'
    claim: 'In its ancient context the bow suggested war; the rainbow represents reconciliation'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'In its ancient Near Eastern context, the bow could be associated with war and devastation'
  - where: 'note 9:13 “Why a bow?”'
    claim: 'The bow represents reconciliation between God and his children'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'In this light, the bow represents a reconciliation between God and his children’s unrighteous state'
  - where: 'note 9:13 “Why a bow?”'
    claim: 'Whether the rainbow was new: the wording suggests it, but a token need not be a new natural feature'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/9.htm'
    quote: 'The giving of a “token” is not necessarily equivalent to the creation of a feature in nature … Nevertheless, the simplicity of the language favours the most literal interpretation; and the promise in Genesis 9:14-15 suggests that the rainbow was a new phenomenon.'
  - where: 'note 9:13 “Why a bow?”'
    claim: '“Token” is ’ot, “sign,” in 9:12'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-12.htm'
    quote: 'אֽוֹת־ the sign N‑csc'
  - where: 'note 9:13 “Why a bow?”'
    claim: 'The same word ’ot is used of circumcision as the token of the covenant in Gen. 17:11'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/17-11.htm'
    quote: 'lə·’ō·wṯ לְא֣וֹת a sign Prep‑l ¦ N‑csc'

  # ---------- note 9:16 ----------
  - where: 'note 9:16 “When Zion looks downward”'
    claim: 'JST: what God remembers is the covenant with Enoch that Zion would come again'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'that I may remember the everlasting covenant, which I made unto thy father Enoch; that, when men should keep all my commandments, Zion should again come on the earth, the city of Enoch which I have caught up unto myself.'
  - where: 'note 9:16 “When Zion looks downward”'
    claim: 'JST: posterity look upward, Zion looks downward; the church of the firstborn comes down out of heaven'
    key: jst-gen-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gen/9?lang=eng'
    quote: 'when thy posterity shall embrace the truth, and look upward, then shall Zion look downward, and all the heavens shall shake with gladness'
  - where: 'note 9:16 “When Zion looks downward”'
    claim: 'The return of Enoch’s people in the last days was part of the covenant; a scholar’s suggestion about the rainbow’s trajectory'
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'explains that the return of Enoch and his people to the earth in the last days was also part of the Lord’s covenant.'
  - where: 'note 9:16 “When Zion looks downward”'
    claim: 'In Restoration scripture the rainbow is more than a promise against floods: it represents covenant promises leading to God’s presence'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'the token of the rainbow thus goes much further beyond a promise of never again sending the floods upon the earth; the rainbow additionally represented the covenantal promises that would result in gaining the presence of God'
  - where: 'note 9:16 “When Zion looks downward”'
    claim: 'Enoch saw the latter-day reunification (Moses 7:62–64) as part of the rainbow covenant'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'Enoch saw the preparations necessary for this reunification in the latter days'
  - where: 'note 9:16 “When Zion looks downward”'
    claim: 'One scholar suggested the rainbow’s trajectory recalls Zion’s ascension and descent'
    key: scripture-helps-moses-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/05-moses-7?lang=eng'
    quote: 'one scholar suggested that the trajectory of a rainbow can remind us of the ascension of Zion from earth to heaven and of its future descent back to earth.'
  - where: 'note 9:16 “When Zion looks downward”'
    claim: 'The ascending and descending arch of the rainbow may depict Enoch’s city taken up and returning in the latter days'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'Just as Enoch and his city had been taken up into heaven, so would they return in the latter days to fulfill that covenant (possibly depicted in the ascending and descending arch at each end of the rainbow).'

  # ---------- note 9:21 ----------
  - where: 'note 9:21 “Noah’s vineyard”'
    claim: 'Verse 20: ish ha-adamah, “a man of the ground”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-20.htm'
    quote: 'אִ֣ישׁ a man N‑msc … הָֽאֲדָמָ֑ה of the ground'
  - where: 'note 9:21 “Noah’s vineyard”'
    claim: 'The KJV “began to be an husbandman” renders a Hebrew that reads literally “Noah began man of the soil and planted”'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/9.htm'
    quote: 'This expression is an extremely awkward rendering of the strange Hebrew, which is literally “And Noah began man of the soil and planted,” &c.'
  - where: 'note 9:21 “Noah’s vineyard”'
    claim: 'One reading: “began” means Noah was the first to plant a vineyard'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/9.htm'
    quote: 'Better, “And Noah the husbandman began and planted a vineyard,” i.e. was the first to do so.'
  - where: 'note 9:21 “Noah’s vineyard”'
    claim: 'One reading: Noah, the first to make wine, drank it in ignorance'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/9.htm'
    quote: 'The representation is that of the man who first made wine out of grapes, and drinking of it in ignorance was overcome by its potency.'
  - where: 'note 9:21 “Noah’s vineyard”'
    claim: 'Joseph Smith’s revised manuscript rewords verse 20 (“began to till the earth”) and leaves verse 21 unchanged'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/39'
    quote: 'Noah began to till the Earth. And … he was an husbandman; & he planted a vineyard, & he drank of the wine And was drunken; & he was uncovered within his tent'

  # ---------- note 9:22 ----------
  - where: 'note 9:22 “What did Ham do?”'
    claim: 'The Church: Ham’s offense is unclear; perhaps dishonoring his father or disrespecting something sacred; we do not know'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'It’s also not clear what Ham’s offense was, but it appears that he may have dishonored his father or perhaps disrespected something sacred. Because we do not have all of the relevant details of the story, we do not know exactly what happened or its meaning.'

  # ---------- note 9:24 ----------
  - where: 'note 9:24 “Ham was the youngest”'
    claim: 'Hebrew: beno ha-qatan, “his son the little/youngest”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-24.htm'
    quote: 'bə·nōw בְּנ֥וֹ his son N‑msc ¦ 3ms … haq·qā·ṭān. הַקָּטָֽן׃ the youngest'
  - where: 'note 9:24 “Ham was the youngest”'
    claim: 'qatan: younger of two; youngest son of several, 1 Sam. 16:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/6996.htm'
    quote: '= younger , of two children … youngest son (of several) 1 Samuel 16:11'
  - where: 'note 9:24 “Ham was the youngest”'
    claim: 'Japheth was Noah’s eldest son (Moses 8:12)'
    key: bd-japheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/japheth?lang=eng'
    quote: 'Eldest son of Noah (Moses 8:12'

  # ---------- note 9:25 ----------
  - where: 'note 9:25 “Why Canaan, and what the curse does not say”'
    claim: 'Scripture does not clearly explain why Canaan was cursed for Ham’s offense'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'The scriptures don’t clearly explain why Ham’s son Canaan was cursed for his father’s offense against Noah.'
  - where: 'note 9:25 “Why Canaan, and what the curse does not say”'
    claim: '‘eved ‘avadim, “servant of servants,” means the humblest servant'
    key: bdb
    url: 'https://biblehub.com/hebrew/5650.htm'
    quote: 'servant of servants, humblest servant, Genesis 9:25'
  - where: 'note 9:25 “Why Canaan, and what the curse does not say”'
    claim: 'JST adds a veil of darkness over Canaan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/9?lang=eng'
    quote: 'and a veil of darkness shall cover him, that he shall be known among all men.'
  - where: 'note 9:25 “Why Canaan, and what the curse does not say”'
    claim: 'The meaning of the veil of darkness is unclear; the curse has been misused to justify slavery and discrimination'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'The meaning of this “veil of darkness” is unclear. Some have incorrectly used the cursing of Canaan to justify slavery and discrimination—particularly toward people of Black African descent.'
  - where: 'note 9:25 “Why Canaan, and what the curse does not say”'
    claim: 'The restriction’s explanation drew on ideas identifying Black people as descendants of Cain and Ham; the Church has disavowed it'
    key: topics-race
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/race-and-the-church-of-jesus-christ-of-latter-day-saints?lang=eng'
    quote: 'drew on then-common ideas that identified Black people as descendants of the biblical figures Cain and Ham. The Church has since disavowed this justification for the restriction'

  # ---------- note 9:26 ----------
  - where: 'note 9:26 “The blessing goes to Shem’s God”'
    claim: 'The blessing is invoked on Jehovah the God of Shem, meaning Shem’s welfare lies in Him'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/9.htm'
    quote: 'The blessing invoked, not upon Shem himself, but upon Jehovah the God of Shem, is intended to convey the thought that herein will lie the true welfare of the descendants of Shem.'
  - where: 'note 9:26 “The blessing goes to Shem’s God”'
    claim: 'Jehovah is the covenant name; the LORD in small capitals; Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'The covenant or proper name of the God of Israel. … Jehovah is the premortal Jesus Christ'

  # ---------- note 9:27 ----------
  - where: 'note 9:27 “Room for Japheth”'
    claim: '“Enlarge” is yaft (Hiphil jussive of patah) beside the name Yefet'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/genesis/9-27.htm'
    quote: 'yap̄t 27 יַ֤פְתְּ 27 May enlarge'
  - where: 'note 9:27 “Room for Japheth”'
    claim: 'patah: be spacious, wide, open; Gen. 9:27 may God make wide for Japheth'
    key: bdb
    url: 'https://biblehub.com/hebrew/6601.htm'
    quote: 'verb be spacious, wide, open … may God make wide for Japhet (give him an extensive inheritance)'
  - where: 'note 9:27 “Room for Japheth”'
    claim: 'The wordplay on Japheth; the blessing is from Elohim, not Jehovah'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/9.htm'
    quote: 'The blessing on Japheth is introduced with the name not of “Jehovah,” but of “Elohim.”'
  - where: 'note 9:27 “Room for Japheth”'
    claim: 'The one who dwells is Japheth, a prayer for peace and shared privileges'
    key: ryle-genesis
    url: 'https://biblehub.com/commentaries/cambridge/genesis/9.htm'
    quote: 'The “he” in this clause is not God, but Japheth. The clause contains the prayer that Japheth may ever continue on terms of peace with Shem, and that his descendants, dwelling as guests among the Israelites, may partake of their privileges.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The LORD (Jehovah) who speaks as Redeemer in Isa. 54 is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The risen Savior quoted Isaiah 54 to the Nephites and commanded them to search Isaiah (3 Ne. 23 heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/23?lang=eng'
    quote: 'Jesus approves the words of Isaiah—He commands the people to search the prophets'

  # ---------- explore ----------
  - where: 'explore'
    claim: 'The rainbow chapter in From Creation to Sinai follows the covenant from Enoch through Noah'
    key: schade-rainbow
    url: 'https://rsc.byu.edu/creation-sinai/rainbow-token-genesis'
    quote: 'the story of Noah and the flood offers a covenantal picture of salvation that would bridge heaven and earth and link generations of people to the presence of God, as symbolized within the token of the rainbow.'
