    quote: 'True, in the early days of the Church, conversion often meant emigration as well. But now the gathering takes place in each nation. … “Every nation is the gathering place for its own people.”'
  - where: 'note 1:10 “The gathering, then and now”'
    claim: 'Nelson: the choice to come unto Christ not a matter of physical location; Zion is the pure in heart'
