    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/13?lang=eng'
    quote: 'there are many plain and precious things taken away from the book, which is the book of the Lamb of God.'

  # ---- note 1:9 ----
  - where: 'note 1:9 “Not a closed creed”'
    claim: 'Talmage: the Saints announce no creed as a complete code of faith; the Articles are not a complete exposition, as Article 9 says'
    key: talmage-articles-faith
    url: 'https://archive.org/download/studyofarticleso0000jame/studyofarticleso0000jame_djvu.txt'
    quote: 'The Latter-day Saints announce no such creed as a complete code of faith; for they accept the principle of continuous revelation as an essential feature of their belief.'
  - where: 'note 1:9 “Not a closed creed”'
    claim: 'Joseph Smith, 1843: creeds set up stakes'
    key: jsp-discourse-1843-10-15
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-15-october-1843/2'
    quote: 'presence of Good [God] & learn all things. but the creeds set up stakes & say hitherto shalt thou come & no further.— which I cannot subscribe to.'
  - where: 'note 1:9 “Not a closed creed”'
    claim: 'Joseph Smith, 1843: all creeds have some truth'
    key: jsp-discourse-1843-10-15
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-15-october-1843/1'
    quote: 'I cannot beleive in any of the creeds of the different denomination. because they all have some things in them I cannot subscribe to though all of them have some thuth [truth].'
  - where: 'note 1:9 “Not a closed creed”'
    claim: 'Unlike creeds, the Articles are living and open'
    key: welch-whittaker-1979
    url: 'https://www.churchofjesuschrist.org/study/ensign/1979/09/we-believe-development-of-the-articles-of-faith?lang=eng'
    quote: 'Unlike creeds which are delimiting and dogmatic, the Articles of Faith are living and open. They invite further thought.'

