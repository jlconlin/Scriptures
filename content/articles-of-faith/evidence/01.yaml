  # ---- note 1:10 paradisiacal ----
  - where: 'note 1:10 “Paradisiacal glory”'
    claim: 'Church footnote glosses paradisiacal as a condition like the Garden of Eden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng'
    quote: '10f “paradisiacal”: IE a condition like the Garden of Eden; see Isa. 11:1–9; 35; 51:1–3; 65:17–25'
  - where: 'note 1:10 “Paradisiacal glory”'
    claim: 'The earth when created was paradisiacal before the Fall; Joseph Smith said it would be renovated'
    key: matthews-restoration-all-things
    url: 'https://rsc.byu.edu/sperry-symposium-classics-doctrine-covenants/restoration-all-things-0'
    quote: 'Furthermore, the earth when created was paradisiacal, before the Fall of Adam. The promise is that “the earth will be renewed and receive its paradisiacal glory” (Articles of Faith 1:10). The Prophet Joseph Smith said the earth is to be renovated.'
  - where: 'note 1:10 “Paradisiacal glory”'
    claim: 'Latter-day Saints premillennialists; Christ returns at beginning of Millennium; paradise like Eden established then'
    key: benson-articles-faith
    url: 'https://rsc.byu.edu/joseph-smith-doctrinal-restoration/articles-faith'
    quote: 'Latter-day Saints are premillennialists in that they believe that Christ will return to the earth at the beginning of the Millennium to usher in a peaceful reign for one thousand years'
  - where: 'note 1:10 “Paradisiacal glory”'
    claim: 'Many things must be done before; paradise like Eden'
    key: benson-articles-faith
    url: 'https://rsc.byu.edu/joseph-smith-doctrinal-restoration/articles-faith'
    quote: 'our belief has the flavor of postmillennialism because many things much be done by humankind with help from God before that great day can come. [53] Additionally, Joseph taught that paradise, similar to the Edenic state lost at the Fall of Adam, would be established on earth at this time.'

  # ---- note 1:11 ----
  - where: 'note 1:11 “The same privilege for others”'
    claim: 'Cowdery’s 1834 list: no man or government may compel religion'
