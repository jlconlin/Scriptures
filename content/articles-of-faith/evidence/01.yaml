    quote: 'In 1 Corinthians 13:7, Paul declares that charity, the greatest spiritual gift that Saints should seek, “beareth all things, believeth all things, hopeth all things, endureth all things.” According to both Joseph Smith and Paul, Saints filled with this love would then be able to perform these very actions.'
  - where: 'note 1:13 “Paul’s admonition, made our own”'
    claim: 'Phil. 4:8 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/philip/4?lang=eng'
    quote: 'if there be any virtue, and if there be any praise, think on these things.'

