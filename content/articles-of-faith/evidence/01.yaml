    quote: 'the civil magistrate should restrain crime, but never control conscience; should punish guilt, but never suppress the freedom of the soul.'

  # ---- note 1:12 ----
  - where: 'note 1:12 “Subject to the law”'
    claim: 'JSP endnote 33 points to the 1835 Declaration on Government and Law (D&C 134)'
    key: jsp-church-history-1842
    url: 'https://www.josephsmithpapers.org/paper-summary/church-history-1-march-1842/5'
    quote: '33: See Declaration on Government and Law, ca. Aug. 1835 [D&C 134].'
  - where: 'note 1:12 “Subject to the law”'
    claim: 'Talmage cites Titus 3:1 and Paul on civil authorities as ministers of God'
    key: talmage-articles-faith
    url: 'https://archive.org/download/studyofarticleso0000jame/studyofarticleso0000jame_djvu.txt'
    quote: 'Paul, writing to Titus … urged him to teach them to be orderly and law-abiding: “Put them in mind to be subject to principalities and powers, to obey magistrates, to be ready to every good work.’”'
  - where: 'note 1:12 “Subject to the law”'
    claim: 'Wood: Article 12 restates the NT view that the state is legitimate and owed general deference'
    key: wood-international-diplomacy
    url: 'https://rsc.byu.edu/lengthening-our-stride/international-diplomacy-church'
    quote: 'In a fundamental way, this restates the New Testament understanding that the state is in fact legitimate and is owed general deference. It recognized, as Jesus did, that there are both divine obligations and temporal political obligations incumbent upon us.'
  - where: 'note 1:12 “Subject to the law”'
    claim: 'Wood: for over a century the pressing issue was the relation with the United States; Article 12 and D&C 134 its ground principles'
    key: wood-international-diplomacy
    url: 'https://rsc.byu.edu/lengthening-our-stride/international-diplomacy-church'
    quote: 'Although the universal implications of the Restoration and the relation of the Church to foreign governments were early recognized, for over a century, the most pressing issue was to establish such a solid and durable relation with the United States'
  - where: 'note 1:12 “Subject to the law”'
    claim: 'D&C 134:5 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/134?lang=eng'
    quote: 'We believe that all men are bound to sustain and uphold the respective governments in which they reside, while protected in their inherent and inalienable rights by the laws of such governments'

  # ---- note 1:13 ----
  - where: 'note 1:13 “Paul’s admonition, made our own”'
    claim: 'JSP endnotes 34 and 35: 1 Cor. 13:7 and Phil. 4:8'
    key: jsp-church-history-1842
    url: 'https://www.josephsmithpapers.org/paper-summary/church-history-1-march-1842/5'
    quote: 'we follow the admonition of Paul “we believe all things we hope all things,”34 we have endured many things and hope to be able to endure all things. If there is any thing virtuous, lovely, or of good report or praise worthy we seek after these things.35'
  - where: 'note 1:13 “Paul’s admonition, made our own”'
