chapter: 1
title: We Believe
tagline: Joseph Smith closes a letter to a Chicago editor with thirteen plain statements of what the Latter-day Saints believe, from the Godhead to the way they mean to live among their neighbors.
when: '1 March 1842, Nauvoo, Illinois.'

setting: |
  The Articles of Faith are the last lines of a letter. John Wentworth, editor of the *Chicago Democrat*, asked Joseph Smith for an account of the Latter-day Saints to pass to a friend, George Barstow, who was writing a history of New Hampshire. Joseph Smith answered from Nauvoo with “the following sketch of the rise, progress, persecution, and faith of the Latter-Day Saints,” and asked only that it be printed “entire, ungarnished, and without misrepresentation.” The letter ran in the *Times and Seasons* on 1 March 1842. It told of his own religious experiences, the contents of the Book of Mormon and the history of the Church, and it closed with thirteen unnumbered statements of belief.

  Those statements were written for readers outside the Church who knew the Bible, and that shapes their wording. Franklin D. Richards printed them in his 1851 *Pearl of Great Price*, and in the October 1880 general conference the Church accepted that book as scripture, so the Articles entered the canon. In October 1890 they were presented again by themselves for a sustaining vote, just before the Manifesto was read.

  In April 1899 James E. Talmage, later one of the Twelve Apostles, published *The Articles of Faith*, lectures commissioned and reviewed by the First Presidency. It went through more than fifty English editions, and the notes below draw on it where an article needs explaining.

thread: |
  **A statement of belief that does not argue.**

  Twelve of the thirteen articles begin “We believe,” and none of them stops to defend itself. The approach is “declarative and affirmative”: each states a point of doctrine and moves on. Yet many of the lines are sharpest when set beside what most churches then taught, about the Trinity, original sin, the limits of the Atonement, authority, spiritual gifts and a closed Bible. Joseph Smith says what the Saints believe without naming anyone who believes otherwise, and much of the wording is Paul's, words a Bible reader would recognize.

  So the notes ask four kinds of question of the articles: where in scripture it comes from, what it was answering in 1842, what a word means now, and what prophets have taught about it since. The list opens with the Father, the Son and the Holy Ghost and ends with “we seek after these things,” and Article 9 keeps it open in the middle: what God “will yet reveal” is not in it.

sections:
  - range: 1-1
    heading: The Godhead
    plain: |
      We believe in God the Eternal Father, in his Son Jesus Christ, and in the Holy Ghost.
  - range: 2-2
    heading: Our own sins
    plain: |
      We believe that people will be punished for the sins they commit themselves, not for Adam's transgression.
  - range: 3-3
    heading: Saved through the Atonement
    plain: |
      We believe that because of the Atonement of Christ, every human being can be saved by obeying the laws and receiving the ordinances of the gospel.
  - range: 4-4
    heading: The first principles and ordinances
    plain: |
      We believe that the first principles and ordinances of the gospel are, in order: faith in the Lord Jesus Christ; repentance; baptism by immersion for the forgiveness of sins; and the laying on of hands for the gift of the Holy Ghost.
  - range: 5-5
    heading: Called of God
    plain: |
      We believe that a man must be called of God, by revelation and by the laying on of hands of those who have authority, before he may preach the gospel and perform its ordinances.
  - range: 6-6
    heading: The same organization
    plain: |
      We believe in the same organization that the Church had in the time of the apostles: apostles, prophets, pastors, teachers, evangelists, and the rest.
  - range: 7-7
    heading: The gifts of the Spirit
    plain: |
      We believe in the gifts of the Spirit: speaking in tongues, prophecy, revelation, visions, healing, the interpretation of tongues, and the others.
  - range: 8-8
    heading: The word of God
    plain: |
      We believe the Bible is the word of God, as far as it has been translated correctly. We also believe the Book of Mormon is the word of God.
  - range: 9-9
    heading: Revelation, past, present and to come
    plain: |
      We believe everything God has revealed and everything he reveals now, and we believe that he will yet reveal many great and important things about his kingdom.
  - range: 10-10
    heading: Gathering, Zion and the earth renewed
    plain: |
      We believe that Israel will truly be gathered and the Ten Tribes restored; that Zion will be built on the American continent; that Christ will reign in person on the earth; and that the earth will be made new and receive a glory like Eden's.
  - range: 11-11
    heading: Freedom of worship
    plain: |
      We claim the right to worship Almighty God as our own conscience directs, and we grant everyone else the same right, to worship how, where, or what they choose.
  - range: 12-12
    heading: Subject to the law
    plain: |
      We believe in submitting to kings, presidents, rulers and magistrates, and in obeying, honoring and upholding the law.
  - range: 13-13
    heading: We seek after these things
    plain: |
      We believe in being honest, true, chaste, kind and virtuous, and in doing good to everyone. We follow Paul's counsel: we believe all things and hope all things; we have endured many things and hope to be able to endure all things. Whatever is virtuous, lovely, of good report or praiseworthy, we seek it out.

notes:
  - ref: 1
    phrase: We believe
    kind: history
    title: Earlier lists, and a plainer one
    body: |
      Joseph Smith's thirteen statements were not the first of their kind. Oliver Cowdery had published a list of the Church's beliefs in 1834, Joseph Young another in 1836, Orson Pratt a long one in 1840, and Orson Hyde, in Frankfurt in 1842, sixteen “Articles of Faith and Points of Doctrine,” each “an essay of some length, rather than a sentence or a paragraph.” The overlap is real: Pratt's first article is almost word for word the Prophet's. But the dependence probably runs both ways, since “the Prophet himself probably already stood closely behind those earlier formulations.”

      What sets the 1842 list apart is what it leaves out. The earlier lists explain and argue; these state. That is the best reason to doubt that the Articles were written as a reply to the controversies of the day: they “lack the argumentative language commonly found in the earlier articles of faith.” They still take sides. Many of them state beliefs “long debated in Christianity,” and the notes below give that background where it explains the wording. But the Articles never name an opponent.
    sources: [sc-knowhy-828, welch-whittaker-1979, benson-articles-faith]

  - ref: 1
    phrase: in God, the Eternal Father, and in His Son, Jesus Christ, and in the Holy Ghost
    kind: christ
    title: Three named one by one
    body: |
      The first article confesses faith in Jesus Christ as the Son of God, and it names the Father, the Son and the Holy Ghost each with his own “in.” Pratt's 1840 list had opened with nearly the same words. Unlike Joseph Young's 1836 list, the article calls God the Eternal Father and names the Holy Ghost as a member of the Godhead.

      The words themselves do not say that the three are separate beings, and Joseph Smith “did not emphasize this fact.” Latter-day Saints read the article in the light of his other revelations. In the First Vision he saw “two Personages,” and one, “pointing to the other,” said, “This is My Beloved Son. Hear Him!” ([[JS—H 1:17]]). A revelation of 1843 says the rest: “The Father has a body of flesh and bones as tangible as man's; the Son also; but the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit” ([[D&C 130:22]]).
    sources: [sc-knowhy-828, benson-articles-faith, lds-scriptures]

  - ref: 2
    phrase: not for Adam’s transgression
    kind: history
    title: Our own sins, not Adam’s guilt
    body: |
      The second article denies inherited guilt, not the Fall. Many Christians then held the doctrine of original sin, the teaching, “generally credited to Augustine,” that all are born sinful and guilty because Adam's sin is counted against his descendants. The article sets that teaching aside.

      Orson Pratt's list of 1840 had spoken of the same subject from Adam's side: “all mankind, by the transgression of their first parents, and not by their own sins, were brought under the curse and penalty of that transgression,” and through Christ all are “fully redeemed” from it. Joseph Smith's article speaks of what each person will be punished for, and that is his own sins.

      The Fall's effects remain real. Joseph Smith's revelation of Moses gives both halves: “the Son of God hath atoned for original guilt, wherein the sins of the parents cannot be answered upon the heads of the children,” and yet children are “conceived in sin,” and as they grow, “sin conceiveth in their hearts” ([[Moses 6:54–55]]; see the note at [[Moses 6:54]]). People inherit a fallen nature, but each is responsible for his or her own choices.
    sources: [benson-articles-faith, sc-knowhy-828, lds-scriptures]

  - ref: 3
    phrase: all mankind may be saved, by obedience to the laws and ordinances of the Gospel
    kind: prophets
    title: Saved from the Fall, and from our own sins
    body: |
      “All mankind may be saved” sets aside the belief that Christ died only for the elect, and “by obedience” sets out what each person must do. The two halves of the verse are not in tension. Elder James E. Talmage read the article as describing two effects of the one Atonement. The first is unconditional: it secures “to all mankind alike, exemption from the penalty of the fall, thus providing a plan of General Salvation.” The second opens “a way for Individual Salvation whereby mankind may secure remission of personal sins,” and because those sins are each person's own acts, their forgiveness is conditioned on each person's obedience to “the laws and ordinances of the Gospel.”

      Read that way, Article 3 completes Article 2: all are redeemed “from the effects of Adam's transgression both with respect to the death of the body and inherited sin,” and the same sacrifice is the means of forgiveness for each person's own sins. Grace comes first in the sentence, and the obedience is keeping covenants with Christ.
    sources: [talmage-articles-faith, benson-articles-faith]

  - ref: 4
    phrase: the first principles and ordinances of the Gospel
    kind: history
    title: Why the list stops at four
    body: |
      In 1842 the article read, “We believe that these ordinances are 1st, Faith in the Lord Jesus Christ; 2d, Repentance; 3d, Baptism …” The wording now, “the first principles and ordinances of the Gospel,” is one of the small changes made since. Orson Pratt's 1840 list had called the same four “the first conditions of the gospel.” Hebrews names the same foundation in nearly the same order: “the principles of the doctrine of Christ … repentance from dead works, and of faith toward God, of the doctrine of baptisms, and of laying on of hands” ([[Heb. 6:1–2]]).

      “First” matters, because the list is a beginning and not the whole. The Book of Mormon adds what follows: “He that endureth to the end, the same shall be saved” ([[2 Ne. 31:15]]), and Nephi concludes that “unless a man shall endure to the end … he cannot be saved” ([[2 Ne. 31:16]]). Joseph Young's list of 1836 had included that duty. The Articles do not drop it; it comes at the end, in Article 13: “we have endured many things, and hope to be able to endure all things.”

      The fourth item also set the Saints apart. Some churches agreed with them on faith, repentance and baptism by immersion; Joseph Smith taught that the gift of the Holy Ghost does not simply follow baptism but is conferred by an ordinance, the laying on of hands, as in [[Acts 8:17]].
    sources: [jsp-church-history-1842, welch-whittaker-1979, sc-knowhy-828, reynolds-fifth-principle, benson-articles-faith, lds-scriptures]

  - ref: 5
    phrase: by prophecy, and by the laying on of hands
    kind: words
    title: Called by prophecy
    body: |
      “By prophecy” here means by revelation. In 1842 Joseph Smith put the words in quotation marks, “prophesy, and by laying on of hands,” because they are Paul's to Timothy: “the gift that is in thee, which was given thee by prophecy, with the laying on of the hands of the presbytery” ([[1 Tim. 4:14]]). A month later the *Times and Seasons* glossed the phrase: officers were chosen “by ‘prophesy (revelation) and by laying on of hands’—by a divine communication, and a divinely appointed ordinance.”

      So the article names three requirements: a call that comes from God by inspiration, the laying on of hands that confirms it, and authority from God in the one who extends the call and performs the ordinance. In America then, many preachers were self-appointed, and many churches held to a “priesthood of all believers.” The article says that no one takes the ministry on himself; it has to be given.
    sources: [jsp-church-history-1842, jsp-times-seasons-1842-04-01, benson-articles-faith, lds-scriptures]

  - ref: 6
    phrase: the same organization that existed in the Primitive Church
    kind: history
    title: The same organization, in what sense
    body: |
      The list in Article 6 is Paul's: “he gave some, apostles; and some, prophets; and some, evangelists; and some, pastors and teachers” ([[Eph. 4:11]]). A Bible reader in 1842 would have recognized the verse. The “Primitive Church” is the Church Christ established in His lifetime and the apostles continued after His ascension; where the 1921 text has “viz.,” today's reads “namely.”

      Much has been claimed for this article, “perhaps too much.” It is not an organizational chart. The closing “etc.” shows that Joseph Smith was suggesting rather than listing everything, and in the same letter he said the Book of Mormon peoples had “pastors” and “evangelists,” though the Book of Mormon gives no one either title. He was affirming what kind of church it is, not matching office names.

      That is what “the same” means here: the names in Paul's list are best understood by what each does, and that work goes on. The Church still has servants sent with authority, who speak by the Holy Ghost, care for the Saints as shepherds, teach them, and carry the gospel to the world. Titles and arrangements change with continuing revelation; the Lord “is thus free to constantly adjust the Church's outer garment.”
    sources: [jsp-church-history-1842, underwood-same-organization, talmage-articles-faith, lds-scriptures]

  - ref: 6
    phrase: pastors, teachers, evangelists
    kind: words
    title: Pastors and evangelists
    body: |
      Neither word names an office the Church has today under that title, and both are clearer in Greek. “Pastor” is *poimēn*, which the King James Version renders “shepherd” everywhere except [[Eph. 4:11]]: “I am the good shepherd” in [[John 10:14]] is the same word. A pastor is a shepherd of the flock, and no office called “pastor” appears in either the New Testament church or the Latter-day Saint one; the shepherding does. The Church's footnote points the word to the Topical Guide's “Bishop,” and the New Testament joins the two ideas when it calls Christ “the Shepherd and Bishop of your souls” ([[1 Pet. 2:25]]).

      “Evangelist,” *euangelistēs*, is one who announces the *euangelion*, the gospel or good news: a preacher or missionary. Joseph Smith also gave the word a narrower Latter-day Saint sense. In 1839 he taught that an evangelist “is a patriarch,” and that “whereever the Church of Christ is established in the earth, there should be a patriarch for the benefit of the posterity of the Saints as it was with Jacob.” The Church's footnote on the word points to “Patriarch.” Some Latter-day Saints see the two senses meet in the patriarch's work, since his blessings are good news for the life of each Saint who receives one.
    sources: [underwood-same-organization, jsp-discourse-1839-evangelist, lds-scriptures]

  - ref: 7
    phrase: the gift of tongues, prophecy, revelation, visions, healing
    kind: scripture
    title: Gifts that had not ceased
    body: |
      Article 7 answers a question then in dispute: whether the gifts of the New Testament church had ceased. Four of the gifts it names, prophecy, healing, tongues and their interpretation, are in Paul's list ([[1 Cor. 12:8–10]]), and the Church's footnote on “interpretation” points to the Book of Mormon passage that answers the question directly. Moroni speaks to those who “deny the revelations of God, and say that they are done away, that there are no revelations, nor prophecies, nor gifts, nor healing, nor speaking with tongues, and the interpretation of tongues,” and says that such a person “knoweth not the gospel of Christ” ([[Morm. 9:7–8]]). At the end of his record he says why: the gifts “never will be done away, even as long as the world shall stand, only according to the unbelief of the children of men” ([[Moro. 10:19]]).
    sources: [benson-articles-faith, welch-whittaker-1979, lds-scriptures]

  - ref: 8
    phrase: as far as it is translated correctly
    kind: history
    title: As far as it is translated correctly
    body: |
      The qualification applies to the Bible as it has come down, not to the Bible as it was first written. Latter-day Saints “believe the original records to be the word of God unto man,” and translations “equally authentic” as far as they are correct. Joseph Smith drew the same line in a sermon of 1843: “I believe the bible, as it ought to be, as it came from the pen of the original writers.”

      Two kinds of loss fall under the reservation. Nephi saw that “there are many plain and precious things taken away from the book, which is the book of the Lamb of God” ([[1 Ne. 13:28]]), and between 1830 and 1833 the Prophet worked through the King James Version under revelation, revising about 3,400 verses in what he then called the “New Translation.” The reservation also covers ordinary human error, “erroneous translation, which may occur as a result of human incapacity,” of the kind biblical scholars generally admit in both translating the text and copying it by hand (“transcription”). The second half of the article sets the Book of Mormon beside the Bible as “the word of God” with no qualification attached.
    sources: [jsp-discourse-1843-10-15, jsp-church-history-1842, talmage-articles-faith, lds-scriptures]

  - ref: 9
    phrase: He will yet reveal many great and important things
    kind: prophets
    title: Not a closed creed
    body: |
      Article 9 explains why the Articles of Faith do not claim to be a complete statement of belief. Most churches set out their beliefs in creeds, but “the Latter-day Saints announce no such creed as a complete code of faith; for they accept the principle of continuous revelation as an essential feature of their belief.” This article shows it: a list that says God “will yet reveal many great and important things” cannot claim to be complete.

      Joseph Smith's own objection to the creeds, in a sermon of 1843, was of the same kind. He could not accept any of them, though “all of them have some thuth [truth],” because he wanted to come into the presence of God and “learn all things. but the creeds set up stakes & say hitherto shalt thou come & no further.— which I cannot subscribe to.” The Articles, by contrast, are “living and open. They invite further thought.”
    sources: [talmage-articles-faith, jsp-discourse-1843-10-15, welch-whittaker-1979]

  - ref: 10
    phrase: the literal gathering of Israel and in the restoration of the Ten Tribes
    kind: prophets
    title: The gathering, then and now
    body: |
      The gathering the article names is of Israel, and the keys for it have been restored. Joseph Young's list of 1836 had said that God would “gather the literal descendants of Jacob to the lands anciently possessed by their fathers.” The keys of that work were given by Moses, who “committed unto us the keys of the gathering of Israel from the four parts of the earth, and the leading of the ten tribes from the land of the north” ([[D&C 110:11]]).

      Where the gathering happens has changed. As Elder Russell M. Nelson taught in 2006, “in the early days of the Church, conversion often meant emigration as well. But now the gathering takes place in each nation.” “Every nation is the gathering place for its own people,” because “the choice to come unto Christ is not a matter of physical location; it is a matter of individual commitment.”
    sources: [lds-scriptures, nelson-gathering]

  - ref: 10
    phrase: this [the American] continent
    kind: history
    title: Three wordings of one line
    body: |
      This line has read three ways. In 1842 it read, “That Zion will be built upon this continent,” in a letter written from Illinois to an American editor. The 1921 edition, printed on this site, keeps “this” and adds the bracket “[the American]” to say which continent, as did Elder Talmage's study in its 1924 printing. Today's edition reads, “that Zion (the New Jerusalem) will be built upon the American continent.” The tenth article is one of the few that have changed at all since 1842.

      “Zion” here is the city, the New Jerusalem, as today's wording says, and a revelation names the land of Missouri as “the land of promise, and the place for the city of Zion,” with Independence as “the center place” ([[D&C 57:2–3]]).
    sources: [jsp-church-history-1842, talmage-articles-faith, welch-whittaker-1979, lds-scriptures]

  - ref: 10
    phrase: receive its paradisiacal glory
    kind: words
    title: Paradisiacal glory
    body: |
      “Paradisiacal” means like paradise, and the Church's footnote gives the sense: “a condition like the Garden of Eden.” The promise is a return. The earth “when created was paradisiacal, before the Fall of Adam,” and Joseph Smith said that it is to be renovated.

      The article puts that renewal with Christ's personal reign. Latter-day Saints believe that Christ will come at the beginning of the Millennium and then reign for a thousand years, and that paradise, “similar to the Edenic state lost at the Fall of Adam,” will be established on the earth at that time. Joseph Smith placed the gathering of Israel, the restoration of the Ten Tribes and the building of Zion among the events leading up to the Millennium, and much must be done “by humankind with help from God before that great day can come.”
    sources: [lds-scriptures, matthews-restoration-all-things, benson-articles-faith]

  - ref: 11
    phrase: allow all men the same privilege
    kind: history
    title: The same privilege for others
    body: |
      Article 11 is the only one that does not begin “We believe”: it claims a right for the Saints and in the same sentence grants it to everyone else, with no limit on whom or what they worship: “let them worship how, where, or what they may.” The Saints had written the principle down before. Oliver Cowdery's 1834 list said that “no man, combination of men, or government of men, have power or authority to compel or force others to embrace any system of religion.” The 1835 declaration on government, now [[D&C 134]], says that “the civil magistrate should restrain crime, but never control conscience; should punish guilt, but never suppress the freedom of the soul” ([[D&C 134:4]]), and that governments must protect “all citizens in the free exercise of their religious belief” ([[D&C 134:7]]).
    sources: [sc-knowhy-828, lds-scriptures]

  - ref: 12
    phrase: subject to kings, presidents, rulers, and magistrates
    kind: scripture
    title: Subject to the law
    body: |
      Behind Article 12 stands the declaration on government of 1835: “We believe that all men are bound to sustain and uphold the respective governments in which they reside, while protected in their inherent and inalienable rights by the laws of such governments” ([[D&C 134:5]]). Elder Talmage's study of this article cites Paul's counsel to Titus: “Put them in mind to be subject to principalities and powers, to obey magistrates” ([[Titus 3:1]]). The article restates the New Testament view that the state is legitimate and owed general deference, with obligations to God and obligations to the state, as Jesus taught.

      The article names “kings” as well as “presidents,” and the declaration speaks of “all men” and “the respective governments in which they reside,” so the duty is not tied to one country, though for more than a century the Church's most pressing concern was its relation to the United States. The declaration also states the condition that goes with the duty: it holds “while protected in their inherent and inalienable rights by the laws of such governments.”
    sources: [jsp-church-history-1842, talmage-articles-faith, wood-international-diplomacy, lds-scriptures]

  - ref: 13
    phrase: we follow the admonition of Paul
    kind: scripture
    title: Paul’s admonition, made our own
    body: |
      Article 13 joins two passages of Paul, and Joseph Smith changes each to “we.” The first is the description of charity: it “beareth all things, believeth all things, hopeth all things, endureth all things” ([[1 Cor. 13:7]]). What Paul says charity does, the article says the Saints do, as people filled with that love can. The tense changes too: Paul's charity “endureth all things,” and the article says “we have endured many things, and hope to be able to endure all things.”

      The second is [[Philip. 4:8]]: “whatsoever things are true, whatsoever things are honest … if there be any virtue, and if there be any praise, think on these things.” Paul says *think on* them; the article says *seek after* them.
    sources: [jsp-church-history-1842, sc-knowhy-693, lds-scriptures]

christ: |
  The Articles are about Christ from beginning to end. Article 1 names Him the Son of the Eternal Father; Article 3 makes His Atonement the reason anyone is saved, from the Fall without condition and from personal sin through “obedience to the laws and ordinances of the Gospel”; Article 4 begins the path with “Faith in the Lord Jesus Christ”; Article 10 looks to the day when He “will reign personally upon the earth.”

  The first principles are a beginning, and the Book of Mormon shows the rest of the way: “ye must press forward with a steadfastness in Christ, having a perfect brightness of hope, and a love of God and of all men” ([[2 Ne. 31:20]]). A disciple who has received faith, repentance, baptism and the gift of the Holy Ghost goes on in the same Christ, enduring, and still seeking what is virtuous, lovely and praiseworthy.

explore: |
  - **The doctrine behind Articles 2–4.** [[Moses 6:51–68]], where the first principles and ordinances are taught to Adam, and [[2 Ne. 31]], the doctrine of Christ.
  - **Authority and organization.** [[Heb. 5:4]], [[Eph. 4:11–14]], [[D&C 107]].
  - **Government and conscience.** [[D&C 134]], the 1835 declaration behind Articles 11 and 12.
  - **A study to read whole.** Elder James E. Talmage's *The Articles of Faith* (1899), which takes the articles one by one.

