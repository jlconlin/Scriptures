description: A phrase-by-phrase companion to the book of Lamentations, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Five poems over the fall of Jerusalem. The first four follow the Hebrew alphabet, and the hope of the book stands at the middle of the middle poem.
