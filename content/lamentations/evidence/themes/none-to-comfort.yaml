page: none-to-comfort
claims:
  - where: 'section “None to comfort her”'
    claim: 'The poet says it of her (1:2, 9, 17); the city says it of herself (1:16, 21)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'there is none to comfort me'
  - where: 'section “None to comfort her”'
    claim: 'All five (1:2, 9, 16, 17, 21) are one Hebrew participle, menachem (H5162; fresh script: 6 occurrences in 6 verses, the sixth at 2:13)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מְנַחֵ֖ם'
  - where: 'section “Who can heal thee?”'
    claim: 'The verb of 2:13 is the same root (H5162), the sixth and last of six uses in six verses; chapters 3, 4 and 5 have none'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וַ/אֲנַֽחֲמֵ֔/ךְ'
  - where: 'section “Therefore have I hope”'
    claim: 'The hope that perished at 3:18 is the noun tokhelet (H8431, only here); the hope of 3:21 and 3:24 is the verb ʾohil (H3176, two occurrences)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וְ/תוֹחַלְתִּ֖/י'
  - where: 'section “Therefore have I hope”'
    claim: 'The noun H8431 is from the verb yachal (H3176)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/hebrew/8431.htm'
    quote: 'From yachal; expectation -- hope.'
  - where: 'section “Shut out, and heard”'
    claim: 'Fear not (3:57) is the only speech of the Lord that the book quotes, and the man reports it (“thou saidst”). All five chapters read for this: 1:10, 1:17 and 2:17 report that the Lord commanded without quoting Him, and 3:37 is a general question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'thou saidst, Fear not.'
  - where: 'section “Shut out, and heard”'
    claim: 'NIV renders the verbs of 3:57 in the past'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=NIV'
    quote: 'You came near when I called you, and you said, “Do not fear.”'
  - where: 'section “Shut out, and heard”'
    claim: 'ESV renders 3:56 in the past'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=ESV'
    quote: 'you heard my plea'
  - where: 'section “Shut out, and heard”'
    claim: 'NRSVUE renders 3:56–57 in the past'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=NRSVUE'
    quote: 'You came near when I called on you'
  - where: 'section “Shut out, and heard”'
    claim: 'An older commentary takes 3:56–57 as present assurance'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: '“Thou hast heard my voice” expresses the full assurance of faith from which the request comes'
  - where: 'section “No reply”'
    claim: 'Lamentations does not contain any responses from the Lord'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'unlike many books in the Old Testament, Lamentations does not contain any responses from the Lord'
  - where: 'section “No reply”'
    claim: 'NRSVUE has “unless” at 5:22'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=NRSVUE'
    quote: 'unless you have utterly rejected us and are angry with us beyond measure'
  - where: 'section “No reply”'
    claim: 'ESV has “unless” at 5:22'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=ESV'
    quote: 'unless you have utterly rejected us'
  - where: 'section “No reply”'
    claim: 'NIV has “unless” at 5:22'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=NIV'
    quote: 'unless you have utterly rejected us'
  - where: 'section “The word that stops”'
    claim: 'Hebrew ʾayin (H369, the particle “there is not”) stands at 1:2, 7, 9, 17, 21; 2:9; 3:49; 4:4; 5:3, 7, 8 (fresh script: 11 occurrences in 11 verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'אֵ֥ין'
  - where: 'section “The word that stops”'
    claim: 'Connection made by this page: “comfort” stands at 1:2, 9, 16, 17, 21 and 2:13 and nowhere after, the “none” that goes with it is also the “none” of 5:8, and the middle poem speaks of hope, mercies and waiting; no source read sets these side by side'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/5?lang=eng'
    quote: 'there is none that doth deliver us out of their hand'
  - where: 'section “Hope, not yet comfort”'
    claim: 'Come, Follow Me asks what messages of hope in Christ are found in Lamentations 3:20–33 and sends the reader also to Matthew 5:4'
    key: cfm-ot-2026-44
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/44?lang=eng'
    quote: 'What messages of hope in Christ do you find? (see especially Lamentations 3:20–33; see also Matthew 5:4'
  - where: 'section “Hope, not yet comfort”'
    claim: 'Matthew 5:4 is future tense (“shall be comforted”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'Blessed are they that mourn: for they shall be comforted.'
  - where: 'section “Hope, not yet comfort”'
    claim: 'Isa. 51:19 has the same Hebrew verb form as Lam. 2:13 (Piel imperfect, first person singular, with the suffix “thee”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'אֲנַחֲמֵֽ/ךְ'
  - where: 'section “Hope, not yet comfort”'
    claim: 'Isa. 51:19 and Lam. 2:13 share the Hebrew word sheber (H7667) for “destruction” and “breach” (fresh script: 5 occurrences in Lamentations, 9 in Isaiah)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'וְ/הַ/שֶּׁ֛בֶר'
  - where: 'section “Hope, not yet comfort”'
    claim: 'Connection made by this page: Lam. 2:13 (“that I may comfort thee… thy breach is great”) set beside Isa. 51:19 (“by whom shall I comfort thee?”) and, seven verses earlier, 51:12 (“I, even I, am he that comforteth you”); no source read draws it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'I, even I, am he that comforteth you'
