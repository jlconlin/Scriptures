page: hand-and-heart
claims:
  - where: 'section “He afflicted her”'
    claim: 'Jeremiah is clear that unrighteousness and rebellion were the main reasons for the destruction of Jerusalem (the talk says this of Jeremiah; it quotes no verse of Lamentations)'
    key: cook-lamentations-bondage
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/10/lamentations-of-jeremiah-beware-of-bondage?lang=eng'
    quote: 'Jeremiah is clear that unrighteousness and rebellion were the main reasons for the destruction of Jerusalem and captivity in Babylon.'
  - where: 'section “As an enemy”'
    claim: 'The Hebrew has the prefix ke- (“as, like”) on “enemy” in 2:4 and 2:5 (fresh script, hebrew.mjs lamentations 2:4–5)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'כְּ/אוֹיֵב'
  - where: 'section “As an enemy”'
    claim: 'The days of old are read as the times of Moses, the threatenings of Lev. 26 and Deut. 28'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: '"The days of old" are the times of Moses; for Jeremiah has before his mind the threatenings of the law, Leviticus 26:23., Deuteronomy 28:15.'
  - where: 'section “As an enemy”'
    claim: 'The Church edition’s footnotes 10b at Lam. 4:10 (Lev. 26:29; Deut. 28:57) and 16a at Lam. 4:16 (Deut. 28:50) lead to Leviticus 26 and Deuteronomy 28 (footnotes.mjs lamentations 4; this row quotes Deut. 28:50)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'A nation of fierce countenance, which shall not regard the person of the old, nor shew favour to the young'
  - where: 'section “As an enemy”'
    claim: '“Not pitied” (chamal, H2550) stands in exactly four verses, 2:2, 2:17, 2:21, 3:43 (fresh script: 4 occurrences in 4 verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'חָמָֽלְתָּ'
  - where: 'section “Against one man”'
    claim: 'The divine name (H3068) first stands in chapter 3 at 3:18 (fresh script: 3:18, 22, 24…); Adonai (H136) first at 3:31; so neither is in 3:1–17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מֵ/יְהוָֽה'
  - where: 'section “From his heart”'
    claim: 'Hebrew of 3:33 “willingly” is mi-libbo, “from his heart”; lev (H3820) with a suffix for the Lord occurs only here (fresh script: 9 occurrences in 9 verses, 3:33 the only one of the Lord)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מִ/לִּבּ֔/וֹ'
  - where: 'section “From his heart”'
    claim: 'The ESV renders 3:33 “from his heart”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A31-33&version=ESV'
    quote: 'for he does not afflict from his heart'
  - where: 'section “From his heart”'
    claim: 'An older commentary renders 3:33 “from His heart”'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'For He doth not afflict from His heart, and grieve the children of men.'
  - where: 'section “From his heart”'
    claim: 'The verb yagah (H3013) stands in five verses (fresh script: 1:4 “afflicted,” of the virgins; 1:5 and 1:12 “hath afflicted,” Hiphil hogah; 3:32 “cause grief,” the same form hogah; 3:33 “grieve”); “afflict” in 3:33 is another verb, innah (H6031: 3:33 and 5:11)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'הוֹגָ֔ה'
  - where: 'section “From his heart”'
    claim: 'The verses are read as saying that the Lord does not take pleasure in punishing people'
    key: ot-seminary-teacher-lesson-138
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-lamentations/lesson-138-lamentations?lang=eng'
    quote: 'Jeremiah explained that the Lord does not take pleasure in punishing people.'
  - where: 'section “From his heart”'
    claim: 'Connection made by this page: “though he cause grief” (3:32) set beside “the LORD hath afflicted her” (1:5) and “hath afflicted me” (1:12); the shared verb is the Hebrew text’s (row above), the comparison is the page’s, and no source read makes it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'But though he cause grief, yet will he have compassion according to the multitude of his mercies.'
  - where: 'section “Search and try”'
    claim: '“Prayer” (tefillah, H8605) occurs only at 3:8 and 3:44 (fresh script: 2 occurrences in 2 verses), where the Lord shuts it out (3:8) and covers Himself with a cloud against it (3:44)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'תְּפִלָּֽה'
  - where: 'section “Turn thou us”'
    claim: 'The verb shuv (H7725) stands in 13 verses (fresh script, 14 occurrences: 1:8 “turneth backward”; 1:11, 1:16, 1:19 “relieve”; 1:13 “turned me back”; 2:3 “drawn back his right hand”; 2:8 “not withdrawn his hand”; 2:14 “turn away thy captivity”; 3:3 “turneth his hand”; 3:21 “recall”; 3:40 “turn again”; 3:64 “render”; 5:21 twice). The Lord is its subject at 1:13, 2:3, 2:8 and 3:3; the people’s at 3:40; asked of Him at 5:21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'הֲשִׁיבֵ֨/נוּ'
  - where: 'section “Turn thou us”'
    claim: 'Connection made by this page: “let us… turn again to the LORD” (3:40) set beside “Turn thou us unto thee” (5:21); the shared verb is the Hebrew text’s (row above), the comparison is the page’s, and no source read makes it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'Let us search and try our ways, and turn again to the'
  - where: 'section “Turn thou us”'
    claim: '“Fear not” (3:57) is the only speech of the Lord that the book quotes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'thou saidst, Fear not.'
  - where: 'section “Turn thou us”'
    claim: 'NRSVUE has “unless” at 5:22'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=NRSVUE'
    quote: 'unless you have utterly rejected us and are angry with us beyond measure'
  - where: 'section “Turn thou us”'
    claim: 'ESV has “unless” at 5:22'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=ESV'
    quote: 'unless you have utterly rejected us'
  - where: 'section “Turn thou us”'
    claim: 'NIV has “unless” at 5:22'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3%3A55-57%3B+Lamentations+5%3A19-22&version=NIV'
    quote: 'unless you have utterly rejected us'
  - where: 'section “Turn thou us”'
    claim: 'The Church edition’s footnote 21a on “Turn” at Lam. 5:21 leads to Jer. 31:18 (this row quotes the target verse)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'turn thou me, and I shall be turned; for thou art the Lord my God.'
  - where: 'section “Turn thou us”'
    claim: 'The Hebrew verb of Jer. 31:18 (hashiveni, ve-ashuvah) is shuv (H7725), as in Lam. 5:21 (fresh script, hebrew.mjs jeremiah 31:18)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'הֲשִׁיבֵ֣/נִי'
  - where: 'section “One city, not a rule”'
    claim: 'Not all who experience trials deserve them because of unrighteousness (the manual says this in its block on Lamentations 4, in a point about the righteous)'
    key: ot-seminary-teacher-lesson-138
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-lamentations/lesson-138-lamentations?lang=eng'
    quote: 'It also does not mean that all who experience trials somehow deserve those trials because of unrighteousness.'
  - where: 'section “One city, not a rule”'
    claim: 'Connection made by this page: John 9:3 set beside these poems; no source read joins the verse to Lamentations, and the page states no doctrine from it beyond the verse’s own words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/9?lang=eng'
    quote: 'Neither hath this man sinned, nor his parents'
  - where: 'section “Jehovah”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Jehovah”'
    claim: 'The Church edition’s footnote 33a on “afflict” at Lam. 3:33 leads to D&C 133:53 (this row quotes the target verse)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'In all their afflictions he was afflicted. And the angel of his presence saved them; and in his love, and in his pity, he redeemed them'
  - where: 'section “Jehovah”'
    claim: 'D&C 133:53 stands in a passage about the Lord and His redeemed at His coming (verses 46–53; this row quotes verse 52)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'And now the year of my redeemed is come; and they shall mention the loving kindness of their Lord'
  - where: 'section “Jehovah”'
    claim: '“His hand” (yad, H3027, with a suffix for the Lord) stands at 1:14, 2:8 and 3:3 (fresh script: 15 occurrences in 14 verses, these three of the Lord; “his right hand,” H3225, at 2:3 and 2:4 besides); His heart only at 3:33 (row under “From his heart”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'יָד֖/וֹ'
