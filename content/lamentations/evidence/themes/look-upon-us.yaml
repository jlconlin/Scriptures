page: look-upon-us
claims:
  - where: 'section “The city asks”'
    claim: 'One older commentary reads 1:9 and 1:11 as one sigh, repeated in an intensified form'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'the sigh which is uttered as a prayer (Lamentations 1:9) is repeated in an intensified form'
  - where: 'section “To whom thou hast done this”'
    claim: 'Hebrew verbs of 1:11 (see, look): reʾeh and habbiṭah, in this order'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'רְאֵ֤ה'
  - where: 'section “To whom thou hast done this”'
    claim: 'Same verbs in the same order at 2:20 (reʾeh, then habbiṭah; the second is H5027, in 1:11, 1:12, 2:20, 3:63, 4:16, 5:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וְֽ/הַבִּ֔יטָ/ה'
  - where: 'section “To whom thou hast done this”'
    claim: 'An older commentary takes the prayer of 2:20 as the one the city has been commanded to make'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'In Lamentations 2:20 follows the prayer which the city has been commanded to make.'
  - where: 'section “Till the LORD look down”'
    claim: 'Hebrew “look down” (yashqif, H8259) occurs once in Lamentations, at 3:50 (fresh script: 1 occurrence in 1 verse)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'יַשְׁקִ֣יף'
  - where: 'section “Thou hast seen”'
    claim: 'Perfects of 3:55–60 as “the full assurance of faith from which the request comes” (present certainty); the same commentary rejects a reading of 3:55–58 as thanksgiving for a past deliverance'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: '“Thou hast heard my voice” expresses the full assurance of faith from which the request comes'
  - where: 'section “Thou hast seen”'
    claim: 'The same commentary rejects the reading of 3:55–58 as thanks for a past deliverance (the perfects taken as past): it finds no thanksgiving in these verses'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'we can discover no thanksgiving in Lamentations 3:55-58'
  - where: 'section “Remember, O LORD”'
    claim: 'Hebrew “remember” (zekhor, H2142) is the first word of 5:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'זְכֹ֤ר'
  - where: 'section “Remember, O LORD”'
    claim: 'At 5:1 the pair comes as habbiṭah, then reʾeh (look, see), the reverse of 1:11 and 2:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וּ/רְאֵ֥ה'
  - where: 'section “What the verses do”'
    claim: 'At 3:19 the Hebrew verb (H2142, the verb of 5:1) is parsed as an imperative (HVqv2ms) with “mine affliction”, where the King James has “Remembering”; the verse names no addressee'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'זְכָר'
  - where: 'section “What the verses do”'
    claim: 'At 4:16 the verb behind “consider” in 1:11, 2:20 and 5:1 (H5027) is used of the Lord not looking: “he will no more regard them” (fresh script: H5027 in 6 verses, 1:11, 1:12, 2:20, 3:63, 4:16, 5:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'לְ/הַבִּיטָ֑/ם'
  - where: 'section “What the verses do”'
    claim: 'Connection made by this page: the appeals of 1:9, 1:11, 1:20, 2:20, 3:50, 3:59–63 and 5:1, set side by side, ask the same thing with the same verbs and change in speaker (“I,” unnamed, “I,” “we”) and form (commands, a wait, “thou hast seen,” commands beginning with “remember”); 3:19, 3:63 and 4:16 do not fit so neatly; no source read treats them as a sequence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/5?lang=eng'
    quote: 'Remember, O LORD, what is come upon us: consider, and behold our reproach.'
  - where: 'section “No reply”'
    claim: 'Hebrew “answer” (anah, H6030) does not occur in Lamentations (fresh script: 0 occurrences)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'osisID="Lam.5.22"'
  - where: 'section “No reply”'
    claim: 'Lamentations does not contain any responses from the Lord'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'unlike many books in the Old Testament, Lamentations does not contain any responses from the Lord.'
  - where: 'section “Two verses set beside these prayers”'
    claim: 'Hebrew of Ex. 3:7: verb raʾah and noun ʿoni, as in 1:9 (reʾeh … ʿoni)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'עֳנִ֥י'
  - where: 'section “Two verses set beside these prayers”'
    claim: 'Hebrew “affliction” (ʿoni) and “behold” (reʾeh) at 1:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'עָנְיִ֔/י'
  - where: 'section “Two verses set beside these prayers”'
    claim: 'Ex. 3:7: the Lord says He has surely seen the affliction of His people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'I have surely seen the affliction of my people which are in Egypt'
  - where: 'section “Two verses set beside these prayers”'
    claim: 'Connection made by this page: Ex. 3:7 “I have surely seen the affliction of my people” set beside Lam. 1:9 “behold my affliction” (the same Hebrew verb, H7200, and noun, H6040); Exodus speaks of Israel in Egypt, not of Jerusalem; no source read joins them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'I have surely seen the affliction of my people which are in Egypt'
  - where: 'section “Two verses set beside these prayers”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Two verses set beside these prayers”'
    claim: 'Connection made by this page: Luke 19:41 “he beheld the city, and wept over it” set beside Lamentations “Behold, O LORD”; Luke is Greek and Lamentations Hebrew, so what joins them is the act and the city, not a shared word; it is not offered as an answer to the prayer; no source read joins them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/19?lang=eng'
    quote: 'And when he was come near, he beheld the city, and wept over it,'
  - where: 'section “Two verses set beside these prayers”'
    claim: 'Luke 19:43–44 foretells a siege of the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/19?lang=eng'
    quote: 'thine enemies shall cast a trench about thee, and compass thee round'
