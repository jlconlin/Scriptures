page: asked-of-the-lord
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Scripture Helps: Lamentations contains no responses from the Lord; it captures the suffering and longing before the Lord later showed mercy'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'unlike many books in the Old Testament, Lamentations does not contain any responses from the Lord. It captures only the suffering and longing that the people felt before the Lord later showed mercy to them.'
  - where: 'opening'
    claim: 'ʿānâ “answer” (H6030) does not occur in Lamentations; “comfort” (H5162) is a participle five times (1:2, 9, 16, 17, 21) and a verb once (2:13)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מְנַחֵ֖ם'
  - where: 'opening'
    claim: 'Ps. 25:18 “Look upon mine affliction,” rĕʾēh ʿonyî, the Psalms’ petition in the words of Lam. 1:9 (also Ps. 9:13; 119:153)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עָ֭נְיִ/י'
  - where: 'opening'
    claim: 'Connection made by this page: the poems ask three things (to be seen, 1:9, 11, 20; 2:20; 3:50; 5:1; to be comforted, by the fivefold “none to comfort”; to be remembered and turned, 5:20–21), and each is answered elsewhere in the Lord’s voice and the book’s own words (Ex. 3:7; Isa. 51:12; Isa. 49:15; Jer. 31:18–20; D&C 101:7–9); the commentators carry 5:21/Jer. 31:18 and 2:13/Isa. 51:19; the other pairings and the reading of the three asks as one prayer are the page’s own'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/5?lang=eng'
    quote: 'Turn thou us unto thee, O Lord, and we shall be turned; renew our days as of old.'

  # ---------- Behold, O LORD ----------
  - where: 'section “Behold, O LORD”'
    claim: 'Keil on 1:9: the sigh is the daughter of Zion’s, humbled through shame and repentance'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'humbled through shame and repentance'
  - where: 'section “Behold, O LORD”'
    claim: 'Keil on 1:11: the sigh of 1:9 is repeated in an intensified form'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'repeated in an intensified form'
  - where: 'section “Behold, O LORD”'
    claim: '1:11 and 2:20 have rĕʾēh then habbîṭâ (H7200, H5027) in the same order; 5:1 has habbîṭâ then ûrĕʾēh; 4:16 uses H5027 of the Lord not regarding'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וְֽ/הַבִּ֔יטָ/ה'
  - where: 'section “Behold, O LORD”'
    claim: '5:1 “and behold,” ûrĕʾēh, after “consider”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וּ/רְאֵ֥ה'
  - where: 'section “Behold, O LORD”'
    claim: '3:63 “Behold,” habbîṭâ, the imperative of 1:11 and 2:20; 2:1 “remembered not,” zākar of the Lord'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'הַבִּ֔יטָ/ה'
  - where: 'section “Behold, O LORD”'
    claim: '2:1 “remembered not,” zākar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'זָכַ֥ר'
  - where: 'section “Behold, O LORD”'
    claim: '4:16 “regard,” lĕhabbîṭām, the Lord not looking'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'לְ/הַבִּיטָ֑/ם'
  - where: 'section “Behold, O LORD”'
    claim: 'Ex. 3:7 “I have surely seen the affliction,” rāʾōh rāʾîtî (H7200 doubled) + ʿŏnî (H6040), the verb and noun of Lam. 1:9 rĕʾēh… ʿonyî'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'רָאִ֛יתִי'
  - where: 'section “Behold, O LORD”'
    claim: 'Lam. 1:9 “my affliction,” ʿonyî (H6040)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'עָנְיִ֔/י'
  - where: 'section “Behold, O LORD”'
    claim: 'Connection made by this page: Ex. 3:7 answers 1:9 in the same verb and noun; no commentary read pairs them; Exodus speaks of Egypt, not this city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'I have surely seen the affliction of my people which are in Egypt'

  # ---------- None to comfort her ----------
  - where: 'section “None to comfort her”'
    claim: '1:2, 9, 16, 17, 21 mĕnaḥēm, Piel participle; 2:13 waʾănaḥămēk, Piel imperfect 1cs; no H5162 after 2:13'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וַ/אֲנַֽחֲמֵ֔/ךְ'
  - where: 'section “None to comfort her”'
    claim: 'Keil on 1:2: the thought that she has no comforter is repeated at 1:9, 16, 17, 21; the lovers are the allied nations'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'a thought which is repeated in Lamentations 1:9, Lamentations 1:16, Lamentations 1:17, and Lamentations 1:21'
  - where: 'section “None to comfort her”'
    claim: 'The Old Testament Student Manual (24-27): none appeared to comfort Judah; she put forth her hands but no one responded'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'none appeared to comfort Judah. She put forth her hands in a plea for help, but no one responded'
  - where: 'section “None to comfort her”'
    claim: 'Keil on 2:13: the answer to “Who can heal thee?” is “no man”'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'The answer to the last question, "Who can heal thee?" (רפא with ל) is, "no man;"'
  - where: 'section “None to comfort her”'
    claim: 'Isa. 51:12 mĕnaḥemkem, Piel participle construct + 2mp suffix, “your comforter”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'מְנַחֶמְ/כֶ֑ם'
  - where: 'section “None to comfort her”'
    claim: 'Delitzsch on Isa. 51:12: Jehovah Himself begins to speak, “I am your comforter”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/51.htm'
    quote: 'Jehovah Himself begins to speak now, setting His seal upon what is longed and hoped for. "I am your comforter'
  - where: 'section “None to comfort her”'
    claim: 'The Septuagint renders Lam. 1:2 “none to comfort her” with the participle ὁ παρακαλῶν'
    key: swete-lxx-lamentations
    url: 'https://biblehub.com/sepd/lamentations/1.htm'
    quote: 'οὐχ ὑπάρχει ὁ παρακαλῶν αὐτὴν'
  - where: 'section “None to comfort her”'
    claim: 'The Septuagint renders Isa. 51:12 with the same participle, ὁ παρακαλῶν σε'
    key: swete-lxx-isaiah
    url: 'https://biblehub.com/sepd/isaiah/51.htm'
    quote: 'ἐγώ εἰμι ἐγώ εἰμι ὁ παρακαλῶν σε'
  - where: 'section “None to comfort her”'
    claim: 'Delitzsch on Isa. 51:19 names Lam. 2:13 as the real explanation and takes the speaker as the prophet, humanly speaking'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/51.htm'
    quote: 'This is the real explanation, according to Lamentations 2:13'
  - where: 'section “None to comfort her”'
    claim: 'Delitzsch: the whole group is in the tone of the Lamentations of Jeremiah'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/51.htm'
    quote: 'The whole of the group is in the tone of the Lamentations of Jeremiah.'
  - where: 'section “None to comfort her”'
    claim: 'Delitzsch: the prophet, humanly speaking, is obliged to exclaim “How should I comfort thee”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/51.htm'
    quote: 'Even the prophet, humanly speaking, is obliged to exclaim'
  - where: 'section “None to comfort her”'
    claim: 'The Cambridge Bible on Isa. 51:17–20: the resemblances to Lamentations are so striking (its dating conjecture is not used)'
    key: cambridge-isaiah
    url: 'https://biblehub.com/commentaries/cambridge/isaiah/51.htm'
    quote: 'so striking'
  - where: 'section “None to comfort her”'
    claim: 'President Hinckley applies Isa. 51:12 to the Lord as comforter of the bereaved'
    key: hinckley-work-of-the-master
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/04/this-is-the-work-of-the-master?lang=eng'
    quote: 'May they be comforted, sustained, and blessed by Him who declared, “I, even I, am he that comforteth you” (Isa. 51:12).'
  - where: 'section “None to comfort her”'
    claim: 'Come, Follow Me 2026 (lesson 44) reads Lam. 3:20–33 as messages of hope in Christ and sends the reader to Matt. 5:4'
    key: cfm-ot-2026-44
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/44?lang=eng'
    quote: 'Matthew 5:4'
  - where: 'section “None to comfort her”'
    claim: 'Connection made by this page: Isa. 51:12’s participle is Lam. 1:2’s, in Hebrew and in the Septuagint; the pairing is the page’s own; Delitzsch pairs 51:19 with 2:13; the middle poem speaks of hope and waiting, never of comfort'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'I, even I, am he that comforteth you'

  # ---------- Remember, and turn thou us ----------
  - where: 'section “Remember, and turn thou us”'
    claim: 'Keil on 5:19–21: since His throne endures He cannot let His kingdom perish on earth; “lead us back to Thyself, that we may return” is the re-establishment of the gracious relation'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'He cannot let His kingdom perish on the earth'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Keil: 5:21 signifies the re-establishment of the gracious relation'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'they signify the re-establishment of the gracious relation'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Keil renders 5:21 “Lead us back to Thyself, that we may return”'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'Lead us back to Thyself, that we may return'
  - where: 'section “Remember, and turn thou us”'
    claim: 'The Cambridge Bible on 5:22: better “Unless”; the sentence is an hypothesis not to be accepted as fact; there is yet hope'
    key: cambridge-lamentations
    url: 'https://biblehub.com/commentaries/cambridge/lamentations/5.htm'
    quote: 'The whole sentence is an hypothesis not to be accepted as fact. God’s anger cannot last for ever, and thus there is yet hope.'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Ellicott on 5:22: read “unless”; stated as per impossible; God has not rejected, and therefore He will renew'
    key: ellicott-lamentations
    url: 'https://biblehub.com/commentaries/ellicott/lamentations/5.htm'
    quote: 'it is stated as per impossible; God has not rejected, and therefore He will renew.'
  - where: 'section “Remember, and turn thou us”'
    claim: 'NRSVUE 5:22 “unless”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5&version=NRSVUE'
    quote: 'unless you have utterly rejected us and are angry with us beyond measure'
  - where: 'section “Remember, and turn thou us”'
    claim: 'ESV 5:22 “unless”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5&version=ESV'
    quote: 'unless you have utterly rejected us'
  - where: 'section “Remember, and turn thou us”'
    claim: 'NIV 5:22 “unless”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5&version=NIV'
    quote: 'unless you have utterly rejected us'
  - where: 'section “Remember, and turn thou us”'
    claim: 'The Septuagint of 5:22 begins ὅτι, “for,” neither “but” nor “unless”'
    key: swete-lxx-lamentations
    url: 'https://biblehub.com/sepd/lamentations/5.htm'
    quote: 'ὅτι ἀπωθούμενος ἀπώσω ἡμᾶς'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Keil on 5:21–22: many Hebrew MSS repeat 5:21 after 5:22 for synagogue reading; the ending’s hope merely glimmers from afar, like the morning star through the clouds (Gerlach’s phrase)'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'merely glimmers from afar, like the morning star through the clouds'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Keil: the repetition of 5:21 in many manuscripts, that the poem may not end with the wrath of God'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'that the poem may not end with the mention of the wrath of God'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Lam. 5:21 hăšîbēnû (hiphil imperative + 1cp) wĕnāšûbâ (qal cohortative); Jer. 31:18 hăšîbēnî wĕʾāšûbâ, the same construction'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'הֲשִׁיבֵ֨/נוּ'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Jer. 31:18 hăšîbēnî, hiphil imperative + 1cs'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'הֲשִׁיבֵ֣/נִי'
  - where: 'section “Remember, and turn thou us”'
    claim: 'The Church’s footnote at Lam. 5:21 “Turn” leads to Jer. 31:18 (with Ps. 51:10; 80:3; Mosiah 7:33; Morm. 9:6; D&C 98:47)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/5?lang=eng'
    quote: 'Jer. 31:18'
  - where: 'section “Remember, and turn thou us”'
    claim: 'The Church’s footnote at Jer. 31:18 “turn” leads to Lam. 5:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'Lam. 5:21'
  - where: 'section “Remember, and turn thou us”'
    claim: 'The Cambridge Bible on Lam. 5:21: suggestive of Jer. 31:18'
    key: cambridge-lamentations
    url: 'https://biblehub.com/commentaries/cambridge/lamentations/5.htm'
    quote: 'suggestive of Jeremiah 31:18'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Ellicott on Jer. 31:18: the cry is reproduced in Lam. 5:21'
    key: ellicott-jeremiah
    url: 'https://biblehub.com/commentaries/ellicott/jeremiah/31.htm'
    quote: 'is reproduced in Lamentations 5:21'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Ellicott on Jer. 31:20: Remembering, I remember; pitying, I pity; Jehovah could not bring himself to utter the sentence of rejection'
    key: ellicott-jeremiah
    url: 'https://biblehub.com/commentaries/ellicott/jeremiah/31.htm'
    quote: 'Remembering, I remember; pitying, I pity. The thought expressed is that Jehovah could not bring himself to utter the sentence of rejection. His love turned to the penitent who turned to Him.'
  - where: 'section “Remember, and turn thou us”'
    claim: 'The Cambridge Bible on Jer. 31:18: the Lord has heard Ephraim confessing that his punishment was the just consequence of his sin'
    key: cambridge-jeremiah
    url: 'https://biblehub.com/commentaries/cambridge/jeremiah/31.htm'
    quote: 'confessing that his punishment was the just consequence of his sin, and praying for acceptance.'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Keil on 5:21: impossible without repentance and conversion on the part of Israel'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'impossible without repentance and conversion on the part of Israel'
  - where: 'section “Remember, and turn thou us”'
    claim: '3:40 “turn again,” wĕnāšûbâ, the same cohortative as the qere of 5:21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וְ/נָשׁ֖וּבָה'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Keil on Jer. 31:20: the troubled bowels denote the most heartfelt sympathy'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'the most heartfelt sympathy'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Jer. 31:20 “I do earnestly remember,” zākōr ʾezkĕrennû (H2142), the verb of Lam. 5:1 zĕkōr; Lam. 5:20 “forget,” tiškāḥēnû (H7911)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'אֶזְכְּרֶ֖/נּוּ'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Lam. 5:1 “Remember,” zĕkōr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'זְכֹ֤ר'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Lam. 5:20 “forget us,” tiškāḥēnû (H7911)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'תִּשְׁכָּחֵ֔/נוּ'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Isa. 49:15 “yet will I not forget thee,” ʾeškāḥēk (H7911), the verb of Lam. 5:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'אֶשְׁכָּחֵֽ/ךְ'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Hopkin reads Isa. 49:14–16 as the Lord’s reply to a Zion not confident He will remember her; he does not cite Lamentations'
    key: hopkin-caph
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/christ-covenants-caph'
    quote: 'is still not confident that the Lord will remember her'
  - where: 'section “Remember, and turn thou us”'
    claim: 'Connection made by this page: Jer. 31:18 answers 5:21 and 31:20 is the reply (the Church’s footnotes, Cambridge, Ellicott and the site’s 5:21 note make the join); the Hebrew matches of 31:20’s “remember” with 5:1/5:20 and Isa. 49:15’s “forget” with 5:20 are the page’s own; the book’s own confession (1:18; 3:40–42; 5:16) is kept beside the answers given to penitents'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'I do earnestly remember him still: therefore my bowels are troubled for him; I will surely have mercy upon him, saith the Lord.'
  - where: 'section “Remember, and turn thou us”'
    claim: '1 Ne. 21:14 adds “but he will show that he hath not” to Zion’s complaint'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/21?lang=eng'
    quote: 'my Lord hath forgotten me—but he will show that he hath not'

  # ---------- Not from his heart ----------
  - where: 'section “Not from his heart”'
    claim: 'Ellicott on 3:33: literally not from the heart, the centre of volition as well as emotion'
    key: ellicott-lamentations
    url: 'https://biblehub.com/commentaries/ellicott/lamentations/3.htm'
    quote: 'Literally, not from the heart, as being the centre of volition as well as emotion'
  - where: 'section “Not from his heart”'
    claim: 'ESV 3:33: he does not afflict from his heart'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+3&version=ESV'
    quote: 'for he does not afflict from his heart'
  - where: 'section “Not from his heart”'
    claim: 'Keil on 3:31–33: the grounds of comfort; when He has caused sorrow He shows pity once more; compassion outweighs sorrow'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'when He has caused sorrow, He shows pity once more, according to the fulness of His grace. Compassion outweighs sorrow.'
  - where: 'section “Not from his heart”'
    claim: 'Keil: In 3:31–33 follow the grounds of comfort'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'In Lamentations 3:31-33 follow the grounds of comfort.'
  - where: 'section “Not from his heart”'
    claim: 'The seminary teacher manual sums up 3:31–39 as the Lord not taking pleasure in punishing, then turns to 3:40–41 and afflictions from sin'
    key: ot-seminary-teacher-lesson-138
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-lamentations/lesson-138-lamentations?lang=eng'
    quote: 'the Lord does not take pleasure in punishing people. Invite a student to read Lamentations 3:40–41 aloud. Ask the class to follow along, looking for what the afflictions we experience as a result of sin might inspire us to do.'
  - where: 'section “Not from his heart”'
    claim: 'The seminary teacher manual’s general caution in its Lamentations lesson (said in its Lamentations 4 section): trials do not mean the sufferer deserves them'
    key: ot-seminary-teacher-lesson-138
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-lamentations/lesson-138-lamentations?lang=eng'
    quote: 'It also does not mean that all who experience trials somehow deserve those trials because of unrighteousness.'
  - where: 'section “Not from his heart”'
    claim: '3:32 wĕriḥam (H7355, Piel) is the only raḥam in Lamentations; 3:33 millibbô, “from his heart”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וְ/רִחַ֖ם'
  - where: 'section “Not from his heart”'
