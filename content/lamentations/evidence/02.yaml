chapter: 2
claims:
  - where: 'setting'
    claim: 'Chapters 1, 2 and 4 have 22 verses beginning with the successive letters of the alphabet'
    key: 'bd-lamentations'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lamentations-book-of?lang=eng'
    quote: 'Lam. 1–2; 4 having each 22 verses beginning with the successive letters of the alphabet'
  - where: 'setting'
    claim: 'Jeremiah 52 tells the siege and capture of Jerusalem by the Chaldeans'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'Jerusalem is besieged and taken by the Chaldeans'
  - where: 'setting'
    claim: 'The famine was severe in the siege'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'And in the fourth month, in the ninth day of the month, the famine was sore in the city, so that there was no bread for the people of the land.'
  - where: 'when'
    claim: 'Date of the book'
    key: 'bd-lamentations'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lamentations-book-of?lang=eng'
    quote: 'The date of the book must be some years after the fall of the city, of which the writer was an eyewitness.'
  - where: 'note 2:1 “The footstool the Lord did not remember”'
    claim: 'David speaks of a house for the ark and the footstool of God'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'an house of rest for the ark of the covenant of the Lord, and for the footstool of our God'
  - where: 'note 2:1 “The footstool the Lord did not remember”'
    claim: 'A psalm tells Israel to worship at His footstool'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/99?lang=eng'
    quote: 'Exalt ye the Lord our God, and worship at his footstool; for he is holy.'
  - where: 'note 2:5 “The right hand turned against Israel”'
    claim: 'Lamentations 1:18 confesses rebellion'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'The Lord is righteous; for I have rebelled against his commandment'
  - where: 'note 2:6 “His tabernacle and his place of meeting”'
    claim: 'The word for the enclosure means a hedge or enclosure; it denotes the temple or its holy place'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'signifies a hedge or enclosure. The context unmistakeably shows that by this we are to understand the temple, or the holy place of the temple'
  - where: 'note 2:6 “His tabernacle and his place of meeting”'
    claim: 'The second word means place of meeting, not time'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'This noun, as here used, does not mean the "time," but the "place of meeting;"'
  - where: 'note 2:6 “His tabernacle and his place of meeting”'
    claim: 'The garden comparison has perplexed expositors; one explanation is the owner who destroys a pleasure-ground'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'has perplexed expositors, and given occasion for all kinds of artificial and untenable explanations'
  - where: 'note 2:6 “His tabernacle and his place of meeting”'
    claim: 'The garden as pleasure-ground the owner may destroy'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'the garden is viewed as a pleasure-ground, which its owner, if it does not suit its purpose, destroys or gives up again, without much hesitation.'
  - where: 'note 2:9 “No law, and no vision from the Lord”'
    claim: 'The Hebrew word for law here is torah'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'תּוֹרָ֔ה'
  - where: 'note 2:9 “No law, and no vision from the Lord”'
    claim: 'Psalm 74 voices the same loss of prophets'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/74?lang=eng'
    quote: 'We see not our signs: there is no more any prophet'
  - where: 'note 2:11 “My liver is poured upon the earth”'
    claim: 'The expression occurs nowhere else and is variously explained'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'occurs nowhere else, and is variously explained.'
  - where: 'note 2:11 “My liver is poured upon the earth”'
    claim: 'One suggestion: the liver is the chief organ through which pain is felt; the inner man dissolved in pain'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'as the chief bodily organ through which not merely lust, but also pain, is felt; and the pouring out of the liver on the earth may thus mean that the inner man is dissolved in pain and sorrow'
  - where: 'note 2:11 “My liver is poured upon the earth”'
    claim: 'The context shows the effect of pain consuming the bodily organs'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'it is evident from the context, and universally admitted, that it is the effect of pain in consuming the bodily organs that is here meant to be expressed.'
  - where: 'note 2:11 “My liver is poured upon the earth”'
    claim: 'The famine of the siege'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'the famine was sore in the city, so that there was no bread for the people of the land.'
  - where: 'note 2:11 “Mormon mourns his people at Cumorah”'
    claim: 'Mormon 6:17'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/6?lang=eng'
    quote: 'O ye fair ones, how could ye have departed from the ways of the Lord!'
  - where: 'note 2:11 “Mormon mourns his people at Cumorah”'
    claim: 'Mormon 6:18'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/6?lang=eng'
    quote: 'Behold, if ye had not done this, ye would not have fallen. But behold, ye are fallen, and I mourn your loss.'
  - where: 'note 2:11 “Mormon mourns his people at Cumorah”'
    claim: 'Mormon 6:22'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/6?lang=eng'
    quote: 'the Father, yea, the Eternal Father of heaven, knoweth your state; and he doeth with you according to his justice and mercy.'
  - where: 'note 2:11 “Mormon mourns his people at Cumorah”'
    claim: 'Ancient poets applied funeral laments to whole cities; Jeremiah did this for Jerusalem'
    key: 'sc-knowhy-232'
    url: 'https://scripturecentral.org/knowhy/how-did-mormon-react-to-seeing-his-people-slain'
    quote: 'Ancient poets also applied the forms of funeral laments to whole cities, “as if the city were a deceased person” in city laments. Jeremiah did this as he lamented the destruction of Jerusalem'
  - where: 'note 2:14 “Prophets who did not uncover the iniquity”'
    claim: 'The Hebrew verb of 2:14 “discovered” is galah (H1540)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'גִלּ֥וּ'
  - where: 'note 2:14 “Prophets who did not uncover the iniquity”'
    claim: 'Jeremiah 6:14 on the prophets healing slightly'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/6?lang=eng'
    quote: 'They have healed also the hurt of the daughter of my people slightly, saying, Peace, peace; when there is no peace.'
  - where: 'note 2:14 “Prophets who did not uncover the iniquity”'
    claim: 'Jeremiah 14:14 on the prophets prophesying lies'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng'
    quote: 'The prophets prophesy lies in my name: I sent them not'
  - where: 'note 2:16 “Pe comes before ayin”'
    claim: 'Verse 16 begins with pe (patsu)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'פָּצ֨וּ'
  - where: 'note 2:16 “Pe comes before ayin”'
    claim: 'Verse 17 begins with ayin (asah)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'עָשָׂ֨ה'
  - where: 'note 2:16 “Pe comes before ayin”'
    claim: 'Chapter 1 follows the traditional order; in the other three the pe verse precedes the ayin verse'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'in the first only does the order of the letters entirely agree with the traditional arrangement of the alphabet, while, in the other three, the verse beginning with פ stands before that beginning with ע.'
  - where: 'note 2:17 “The word commanded in the days of old”'
    claim: 'Leviticus 26:31 warns of waste cities and desolate sanctuaries'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will make your cities waste, and bring your sanctuaries unto desolation'
  - where: 'note 2:17 “The word commanded in the days of old”'
    claim: 'Leviticus 26:29 warns of eating sons and daughters'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And ye shall eat the flesh of your sons, and the flesh of your daughters shall ye eat.'
  - where: 'note 2:17 “The word commanded in the days of old”'
    claim: 'Deuteronomy 28:53 warns of the same in a siege'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'And thou shalt eat the fruit of thine own body, the flesh of thy sons and of thy daughters'
  - where: 'note 2:17 “The word commanded in the days of old”'
    claim: 'Jeremiah 19:9 says the same'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: 'And I will cause them to eat the flesh of their sons and the flesh of their daughters'
  - where: 'note 2:17 “The word commanded in the days of old”'
    claim: 'The days of old are the times of Moses; the threatenings of the law'
    key: 'keil-lamentations'
    url: 'https://biblehub.com/commentaries/kad/lamentations/2.htm'
    quote: 'are the times of Moses; for Jeremiah has before his mind the threatenings of the law, Leviticus 26:23., Deuteronomy 28:15.'
  - where: 'note 2:18 “The poem turns from describing to praying”'
    claim: 'The book captures the suffering and longing before the Lord later showed mercy'
    key: 'scripture-helps-jer-31-33'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'It captures only the suffering and longing that the people felt before the Lord later showed mercy to them.'
  - where: 'note 2:18 “The poem turns from describing to praying”'
    claim: 'Verse 19 tells the city to pour out the heart before the Lord'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/2?lang=eng'
    quote: 'pour out thine heart like water before the face of the Lord: lift up thy hands toward him'
  - where: 'note 2:20 “A prayer that asks the Lord to look”'
    claim: 'Verse 20 asks the Lord to behold and consider'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/2?lang=eng'
    quote: 'Behold, O LORD, and consider to whom thou hast done this.'
  - where: 'note 2:22 “The day of appointed meeting returns”'
    claim: 'moed in 2:6 (twice)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מוֹעֲד֑/וֹ'
  - where: 'note 2:22 “The day of appointed meeting returns”'
    claim: 'moed in 2:7'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מוֹעֵֽד'
  - where: 'note 2:22 “The day of appointed meeting returns”'
    claim: 'moed in 2:22'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מוֹעֵ֤ד'
  - where: 'note 2:22 “The day of appointed meeting returns”'
    claim: 'Verses 6 and 22 in the chapter text'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/2?lang=eng'
    quote: 'Thou hast called as in a solemn day my terrors round about'
  - where: 'christ'
    claim: 'Your house is left desolate'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'Behold, your house is left unto you desolate.'
  - where: 'christ'
    claim: 'Centuries later the Savior would also lament O Jerusalem'
    key: 'sc-knowhy-232'
    url: 'https://scripturecentral.org/knowhy/how-did-mormon-react-to-seeing-his-people-slain'
    quote: 'Centuries later, the Savior too would lament, “O Jerusalem!” (Matthew 23:37; Luke 13:34).'
  - where: 'note 2:1 “The footstool the Lord did not remember”'
    claim: 'The Hebrew word for footstool (hadom) is never used of a literal stool'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1916.htm'
    quote: 'footstool, never literal'
  - where: 'note 2:1 “The footstool the Lord did not remember”'
    claim: 'In Lam. 2:1 the footstool refers to the sanctuary'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1916.htm'
    quote: 'elsewhere with reference to sanctuary'
  - where: 'note 2:1 “The footstool the Lord did not remember”'
    claim: 'In Ps. 99:5 and 1 Chr. 28:2 it is perhaps the ark, as the place on which God rests'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1916.htm'
    quote: 'or perhaps of ark (as place on which God rests) Psalm 99:5; Psalm 132:7'
  - where: 'note 2:5 “The right hand turned against Israel”'
    claim: 'Lamentations 3:33: the Lord does not afflict willingly'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'For he doth not afflict willingly nor grieve the children of men.'
  - where: 'note 2:6 “His tabernacle and his place of meeting”'
    claim: 'The lexicon gives the word behind “tabernacle” (sok) as booth, pavilion'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7900.htm'
    quote: 'booth, pavilion'
  - where: 'note 2:6 “His tabernacle and his place of meeting”'
    claim: 'moed covers appointed time, place, meeting'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'appointed time, place, meeting'
  - where: 'note 2:6 “His tabernacle and his place of meeting”'
    claim: 'moed as the meeting of God with his people'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'tent of meeting (of God with his people'
  - where: 'note 2:9 “No law, and no vision from the Lord”'
    claim: 'torah means direction, instruction, law'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8451.htm'
    quote: 'direction, instruction, law'
  - where: 'note 2:9 “No law, and no vision from the Lord”'
    claim: 'Psalm 74 is about fire cast into the sanctuary'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/74?lang=eng'
    quote: 'They have cast fire into thy sanctuary'
  - where: 'note 2:11 “Mormon mourns his people at Cumorah”'
    claim: 'Mormon applied the same form to the destruction of his people'
    key: 'sc-knowhy-232'
    url: 'https://scripturecentral.org/knowhy/how-did-mormon-react-to-seeing-his-people-slain'
    quote: 'Mormon similarly applied the form'
  - where: 'note 2:14 “Prophets who did not uncover the iniquity”'
    claim: 'galah means uncover, remove'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: 'uncover, remove'
  - where: 'note 2:20 “A prayer that asks the Lord to look”'
    claim: 'The verb behind “consider” in 2:20 is the hiphil imperative of nabat (H5027)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'הַבִּ֔יטָ'
  - where: 'note 2:20 “A prayer that asks the Lord to look”'
    claim: 'nabat means look'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5027.htm'
    quote: 'Hiph`il look'
  - where: 'note 2:20 “A prayer that asks the Lord to look”'
    claim: 'Verse 20 asks whether priest and prophet should be slain in the sanctuary'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/2?lang=eng'
    quote: 'shall the priest and the prophet be slain in the sanctuary of the Lord?'
  - where: 'note 2:22 “The day of appointed meeting returns”'
    claim: 'moed means appointed time, place, meeting'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'appointed time, place, meeting'
  - where: 'note 2:22 “The day of appointed meeting returns”'
    claim: 'The “assembly” of Lam. 1:15 is the same word, a festal meeting'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'Lamentations 1:15 called a festal meeting against me'
  - where: 'christ'
    claim: 'Jeremiah lamented the destruction of Jerusalem'
    key: 'sc-knowhy-232'
    url: 'https://scripturecentral.org/knowhy/how-did-mormon-react-to-seeing-his-people-slain'
    quote: 'Jeremiah did this as he lamented the destruction of Jerusalem'
  - where: 'christ'
    claim: 'Matthew 23:37, the Savior’s lament over Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'O Jerusalem, Jerusalem, thou that killest the prophets'
