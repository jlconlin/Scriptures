chapter: 1
claims:
  # ---- setting ----
  - where: 'setting'
    claim: 'The book was written after the fall of the city, about 586 B.C.'
    key: gs-lamentations
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/lamentations-book-of?lang=eng'
    quote: 'The book was written after the fall of the city about 586 B.C.'
  - where: 'setting'
    claim: 'The book names no author; tradition attributes it to Jeremiah, who witnessed the events'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Although no author is mentioned by name, this book is traditionally attributed to the prophet Jeremiah, who witnessed the events being described.'
  - where: 'setting'
    claim: 'The Bible Dictionary dates the book some years after the fall, by an eyewitness'
    key: bd-lamentations
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lamentations-book-of?lang=eng'
    quote: 'The date of the book must be some years after the fall of the city, of which the writer was an eyewitness.'
  - where: 'setting'
    claim: 'Some modern critics question whether all of the book was written by Jeremiah'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'though some modern critics question whether all of the book was written by him'
  - where: 'setting'
    claim: 'The Septuagint opens with a sentence about Jeremias weeping, which the Hebrew lacks (the Hebrew begins with the first letter heading)'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/lamentations/1.htm'
    quote: 'that Jeremias sat weeping, and lamented with this lamentation over Jerusalem, and said'
  - where: 'setting'
    claim: 'The Church edition titles the book “The Lamentations of Jeremiah”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'The Lamentations of Jeremiah'
  - where: 'setting'
    claim: 'The book contains no responses from the Lord; it records the suffering before the Lord later showed mercy'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'unlike many books in the Old Testament, Lamentations does not contain any responses from the Lord.'
  # ---- note 1:1 ----
  - where: 'note 1:1 “A cry, and a city as a woman”'
    claim: 'The Hebrew title word means “alas! how …”'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The heading to the book of Lamentations in the Hebrew texts is aychah which is translated as “alas! how …”'
  - where: 'note 1:1 “A cry, and a city as a woman”'
    claim: 'The word expresses complaint mingled with astonishment, opens chapters 1, 2 and 4, and Jerusalem is personified as a woman and mother'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'איכה is here, as in Lamentations 2:1; Lamentations 4:1-2, an expression of complaint mingled with astonishment'
  - where: 'note 1:1 “A cry, and a city as a woman”'
    claim: 'Jerusalem is personified as a woman and viewed as mother of a great multitude; sitting alone a token of sorrow'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'Her sitting alone is a token of deep sorrow'
  - where: 'note 1:1 “A cry, and a city as a woman”'
    claim: 'The manual reads the widow image as a woman whose husband was dead'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'He likened abandoned Jerusalem to a woman whose husband was dead (see v. 1).'
  - where: 'note 1:1 “A cry, and a city as a woman”'
    claim: 'The Hebrew behind “tributary” names one who gives forced service, so the verse means abject servitude'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'The words, "The princess has become a soccager," signify nothing more than, "She who once ruled over peoples and countries has now fallen into abject servitude,"'
  - where: 'note 1:1 “A cry, and a city as a woman”'
    claim: 'The Hebrew mas behind “tributary” is forced labor, used of conquered populations; Lam. 1:1 is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'of conquered populations, subject to forced labour'
  # ---- note 1:2 ----
  - where: 'note 1:2 “Five times, no one to comfort her”'
    claim: 'The participle “comforter” (root H5162) stands in five verses of chapter 1 (1:2, 9, 16, 17, 21); the same root comes once more in the book, as a finite verb, in 2:13'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'osisID="Lam.1.17"'
  - where: 'note 1:2 “Five times, no one to comfort her”'
    claim: 'The manual reads the lovers as the false gods she worshiped'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'All her “lovers” (the false gods she worshiped) abandoned her to her enemies (see vv. 2–3).'
  - where: 'note 1:2 “Five times, no one to comfort her”'
    claim: 'At v. 19 the false lovers and the former allies both deserted her'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Her false “lovers” and former allies deserted her (see v. 19).'
  # ---- note 1:5 ----
  - where: 'note 1:5 “The poem states the cause, and says who did it”'
    claim: 'Jer. 30:15: the Lord, through Jeremiah, gives the multitude of her iniquity as the cause and says He has done it (the Church footnote at Lam. 1:5 points to Jer. 30:14–17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'thy sorrow is incurable for the multitude of thine iniquity: because thy sins were increased, I have done these things unto thee.'
  - where: 'note 1:5 “The poem states the cause, and says who did it”'
    claim: 'The Bible Dictionary speaks of destruction by Jehovah’s own hand and the feeling of sin awakened by it'
    key: bd-lamentations
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lamentations-book-of?lang=eng'
    quote: 'the deep impression made by the destruction of the holy city and temple by Jehovah’s own hand (1:21; 2:1–11; 3:42–44); the feeling of sin awakened by it'
  - where: 'note 1:5 “The poem states the cause, and says who did it”'
    claim: 'The book has no answer from the Lord'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Lamentations does not contain any responses from the Lord.'
  # ---- note 1:8 ----
  - where: 'note 1:8 “Her nakedness seen”'
    claim: 'The nakedness of Jerusalem means her sins and vices brought to light; the allies despise her'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'The nakedness of Jerusalem means her sins and vices that have now come to the light.'
  - where: 'note 1:8 “Her nakedness seen”'
    claim: 'She turns away for shame, withdrawing so that the people no longer look on her'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'turns away for shame, i.e., withdraws from the people so that they may no longer look on her in her shame'
  # ---- note 1:10 ----
  - where: 'note 1:10 “Foreigners in the sanctuary”'
    claim: 'Deut. 23:3 bars Ammonites and Moabites from the congregation of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'An Ammonite or Moabite shall not enter into the congregation of the Lord'
  - where: 'note 1:10 “Foreigners in the sanctuary”'
    claim: 'The enemy’s entry into the sanctuary is an unheard-of sacrilege because the nations were not to enter even the congregation; “pleasant things” are not only temple vessels'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'The clause characterizes the enemy''s forcing his way into the sanctuary, i.e., the temple of Jerusalem, as an unheard of act of sacrilege'
  - where: 'note 1:10 “Foreigners in the sanctuary”'
    claim: 'The pleasant things include the precious vessels of the city, palaces and temple'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'and must rather, under that expression, include all the precious vessels of the city, i.e., of the palaces and the temple'
  # ---- note 1:11 ----
  - where: 'note 1:11 “Bread, and the famine of the siege”'
    claim: 'Jeremiah 52:6 dates the famine to the ninth day of the fourth month: no bread for the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'in the ninth day of the month, the famine was sore in the city, so that there was no bread for the people of the land.'
  # ---- note 1:12 ----
  - where: 'note 1:12 “Who is speaking now”'
    claim: 'The Church heading names both voices: Jeremiah laments, and Jerusalem herself complains'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'Jeremiah laments the miserable condition of Jerusalem—Jerusalem herself complains of her deep sorrow.'
  - where: 'note 1:12 “Who is speaking now”'
    claim: 'The prophet speaks in the name of the godly; the address to passers-by is a poetic turn'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'the apostrophe addressed to the nations, as well as that to passers-by (Lamentations 1:12), is nothing more than a poetic turn, used to express the boundless magnitude of this her sorrow and her suffering'
  - where: 'note 1:12 “Who is speaking now”'
    claim: 'Keil reads v. 17 as a pause that divides the lament into two'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'he introduces into the complaint a suitable pause, that both serves to divide the lamentation into two, and also brings a turn in its contents'
  # ---- note 1:16 ----
  - where: 'note 1:16 “The acrostic, and the order of its letters”'
    claim: 'Chapters 1, 2, 4 have 22 verses beginning with successive Hebrew letters; 3 has 66; 5 is not acrostic'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Chapters 1, 2, and 4 each have 22 verses that begin with successive letters of the Hebrew alphabet.'
  - where: 'note 1:16 “The acrostic, and the order of its letters”'
    claim: 'Verse 15 begins with samekh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'סִלָּ֨ה'
  - where: 'note 1:16 “The acrostic, and the order of its letters”'
    claim: 'Verse 17 begins with pe'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'פֵּֽרְשָׂ֨ה'
  - where: 'note 1:16 “The acrostic, and the order of its letters”'
    claim: 'In the first poem only is the traditional order kept; in the other three pe stands before ayin; the form is no copyist’s error'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'in the first only does the order of the letters entirely agree with the traditional arrangement of the alphabet, while, in the other three, the verse beginning with פ stands before that beginning with ע'
  - where: 'note 1:16 “The acrostic, and the order of its letters”'
    claim: 'The alphabetic arrangement gives continuity and exhaustive completeness'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'In order to give an air of continuity as well as of exhaustive completeness to the lamentation'
  - where: 'note 1:16 “The acrostic, and the order of its letters”'
    claim: 'One explanation rejects a later transposition of the verses and an unfixed alphabet'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'This deviation from the rule does not admit of being explained by the assumption that the verses in question were afterwards transposed'
  - where: 'note 1:16 “The acrostic, and the order of its letters”'
    claim: 'That explanation puts most of the deviations down to the poets’ free use of the form'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'we shall be obliged to seek for the reason of most, if not all of these deviations from the norm, in the free use made of such forms by the Hebrew poets'
  # ---- note 1:17 ----
  - where: 'note 1:17 “A menstruous woman”'
    claim: 'The imagery is symbolic of uncleanness from wickedness and does not imply menstruation is sinful'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'the imagery is symbolic, indicating that Jerusalem had become unclean due to the people’s wickedness. This symbolism reflects ancient purity laws and does not imply that menstruation itself is sinful or shameful.'
  - where: 'note 1:17 “A menstruous woman”'
    claim: 'Leviticus 15:19 sets a woman apart seven days and makes whoever touches her unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'she shall be put apart seven days: and whosoever toucheth her shall be unclean until the even.'
  - where: 'note 1:17 “A menstruous woman”'
    claim: 'The Hebrew niddah is the word, also in 1:8 in a lengthened form, meaning what one should flee from; she is shunned'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'נדּה (prop. what one should flee from) signifies in particular the uncleanness of the menstrual discharge in women'
  - where: 'note 1:17 “A menstruous woman”'
    claim: 'In 1:8 the word is a lengthened form of niddah, transferred to Jerusalem as an unclean woman, and therefore shunned'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'it is transferred to Jerusalem, personified as such an unclean woman, and therefore shunned'
  - where: 'note 1:17 “A menstruous woman”'
    claim: 'Jerusalem’s neighbours are the “round about” who are hostile'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'סביביו are the neighbouring nations round about Israel.'
  # ---- note 1:21 ----
  - where: 'note 1:21 “A prayer that the Lord will repay her enemies”'
    claim: 'The prayer of verse 22 asks the Lord to bring the enemies’ wickedness before Him and to do to them as He has done to her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'Let all their wickedness come before thee; and do unto them, as thou hast done unto me for all my transgressions'
  # ---- christ ----
  - where: 'christ'
    claim: 'The book records the suffering and longing before the Lord later showed mercy'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'It captures only the suffering and longing that the people felt before the Lord later showed mercy to them.'
  - where: 'christ'
    claim: 'D&C 101:9: in the day of wrath the Lord will remember mercy (footnote at 1:2 “comfort”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'I will not utterly cast them off; and in the day of wrath I will remember mercy.'
  - where: 'christ'
    claim: 'Jehovah (the LORD of the King James text) is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Jer. 30:17, in the passage the Church footnote at Lam. 1:5 points to (Jer. 30:14–17): the Lord will heal the city’s wounds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'For I will restore health unto thee, and I will heal thee of thy wounds, saith the Lord; because they called thee an Outcast, saying, This is Zion, whom no man seeketh after.'
  - where: 'christ'
    claim: 'D&C 101:2 (footnote at Lam. 1:5): the Saints were afflicted in consequence of their transgressions'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'in consequence of their transgressions'
  - where: 'christ'
    claim: 'Lam. 3:22 is the book’s own statement of the Lord’s mercies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'mercies that we are not consumed'
