chapter: 5
claims:
  - where: 'setting'
    claim: 'Verse 2 begins with nun and verse 6 with mem, so the chapter is not in alphabetical order'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'נַחֲלָתֵ֨/נוּ֙'
  - where: 'setting'
    claim: 'Verse 6 begins with Egypt (mem)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מִצְרַ֨יִם֙'
  - where: 'setting'
    claim: 'The poet speaks in the name of the congregation'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'The author of this prayer speaks throughout in the name of the people, or, to speak more correctly, in the name of the congregation'
  - where: 'setting'
    claim: 'The speakers are those still in Judah'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'This complaint shows, moreover, that it is those in Judea who are speaking.'
  - where: 'setting'
    claim: 'Lamentations contains no responses from the Lord'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'unlike many books in the Old Testament, Lamentations does not contain any responses from the Lord.'
  - where: 'setting'
    claim: 'The book captures the suffering before the Lord later showed mercy'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'It captures only the suffering and longing that the people felt before the Lord later showed mercy to them.'
  - where: 'setting'
    claim: 'Ephraim makes the request of Lam. 5:21 in Jer. 31:18 (the Church footnote 21a on “Turn” at Lam. 5:21 lists Jer. 31:18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'turn thou me, and I shall be turned; for thou art the Lord my God.'
  - where: 'thread'
    claim: 'The description of misery is in two parts marked by the confessions of verses 7 and 16; verses 17–18 introduce the request of 19–22'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'By this confession, the description given of their misery is divided into two strophes (Lamentations 5:2-7 and Lamentations 5:8-16), which are followed by the request for deliverance (Lamentations 5:19-22), introduced by Lamentations 5:17 and Lamentations 5:18.'
  - where: 'thread'
    claim: 'The confession of verse 16 answers the idea that the speakers thought themselves innocent'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'This false view, however, they themselves opposed with the confession in Lamentations 5:16'
  - where: 'thread'
    claim: 'Verse 22 is read as a condition or as a question as well as a statement'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'Or, hast Thou indeed utterly rejected us? art thou very wroth against us?'
  - where: 'section 1 plain'
    claim: '“Orphans” and “widows” in verse 3 are comparisons'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'In like manner, the first clause also is to be understood as a comparison.'
  - where: 'section 2 plain'
    claim: '“By their hand” in verse 12 is the hand of the enemy'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'Princes are suspended by the hand of the enemy'
  - where: 'note 5:4 “Paying for their own water and wood”'
    claim: 'Orphans and widows are comparisons'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'they are not really widows, but like widows, because they have lost the protection which the mother of a family has in her husband.'
  - where: 'note 5:4 “Paying for their own water and wood”'
    claim: 'Water and wood are the greatest necessities of life'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'Water and wood are mentioned in Lamentations 5:4 as the greatest necessities of life, without which it is impossible to exist.'
  - where: 'note 5:4 “Paying for their own water and wood”'
    claim: 'They must buy water and wood because the country is in enemy hands; the stress is on “our”'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'because the country, with its waters and forests, is in the possession of the enemy. The emphasis lies on "our water...our wood."'
  - where: 'note 5:4 “Paying for their own water and wood”'
    claim: 'The purchase is not to be taken literally but as heavy duties'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'The purchase of water and wood can scarcely be taken literally, but must be understood as signifying that the people had to pay heavy duties for the use of the water and the wood which the country afforded.'
  - where: 'note 5:6 “Egypt and Assyria”'
    claim: 'Giving the hand is submission'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'To give the hand is a sign of submission or subjection'
  - where: 'note 5:6 “Egypt and Assyria”'
    claim: 'Asshur is read as Babylon, with Jer. 2:18 compared'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'Asshur, as the name of the great Asiatic empire, stands for Babylon, as in Ezra 6:22, cf. Jeremiah 2:18.'
  - where: 'note 5:6 “Egypt and Assyria”'
    claim: 'Jer 2:18 pairs Egypt and Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/2?lang=eng'
    quote: 'what hast thou to do in the way of Egypt, to drink the waters of Sihor? or what hast thou to do in the way of Assyria, to drink the waters of the river?'
  - where: 'note 5:7 “Whose sin? The fathers’ and the people’s own”'
    claim: 'Jeremiah 31:29–30 on the proverb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'But every one shall die for his own iniquity: every man that eateth the sour grape, his teeth shall be set on edge.'
  - where: 'note 5:7 “Whose sin? The fathers’ and the people’s own”'
    claim: 'Ezekiel 18:20 and the proverb of verse 2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/18?lang=eng'
    quote: 'The son shall not bear the iniquity of the father, neither shall the father bear the iniquity of the son'
  - where: 'note 5:7 “Whose sin? The fathers’ and the people’s own”'
    claim: 'The fall was not due to one generation alone'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'For the fall of the kingdom had not been brought about by the guilt of that generation merely'
  - where: 'note 5:7 “Whose sin? The fathers’ and the people’s own”'
    claim: 'Verse 7 read with verse 16: the speakers atone for their fathers’ sins also'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'The misfortune we suffer has not been incurred by ourselves alone, but we are compelled to atone for the sins of our fathers also.'
  - where: 'note 5:7 “Whose sin? The fathers’ and the people’s own”'
    claim: 'The reading is joined to Jer. 31:29 and Ezek. 18:2'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'God does not punish the sins of the fathers in innocent children, but in children who continue the sins of the fathers'
  - where: 'note 5:12 “What happened to the princes and elders”'
    claim: 'Verses 11–14 tell the maltreatment of every station, sex, and age'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'With this must further be considered the maltreatment which persons of every station, sex, and age have to endure.'
  - where: 'note 5:12 “What happened to the princes and elders”'
    claim: '“By their hand” is the hand of the enemy'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'Princes are suspended by the hand of the enemy'
  - where: 'note 5:12 “What happened to the princes and elders”'
    claim: 'Hanging the executed was an added shame (Deut. 21:22)'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'To hang those who had been put to death was something superadded to the simple punishment by death'
  - where: 'note 5:12 “What happened to the princes and elders”'
    claim: 'The verse is not restricted to the events of Jer. 39:6 but applies to the speakers’ present condition'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'The words are not to be restricted to the events mentioned in Jeremiah 39:6, but also apply to the present condition of those who are complaining'
  - where: 'note 5:12 “What happened to the princes and elders”'
    claim: 'Deut. 21:22 on hanging one put to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'and thou hang him on a tree'
  - where: 'note 5:12 “What happened to the princes and elders”'
    claim: 'The king of Babylon slew the nobles of Judah at Riblah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'Then the king of Babylon slew the sons of Zedekiah in Riblah before his eyes: also the king of Babylon slew all the nobles of Judah.'
  - where: 'note 5:12 “What happened to the princes and elders”'
    claim: 'Jer 52:10 slew all the princes of Judah in Riblah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'he slew also all the princes of Judah in Riblah.'
  - where: 'note 5:19 “The turn in verse 19”'
    claim: 'Ps 102:12 parallel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'But thou, O Lord, shalt endure for ever; and thy remembrance unto all generations.'
  - where: 'note 5:19 “The turn in verse 19”'
    claim: 'Psalm 102 heading: Zion will be built up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'The psalmist offers a prayer of the afflicted—Zion will be built up'
  - where: 'note 5:19 “The turn in verse 19”'
    claim: 'Zion’s glory is ended but the Lord’s throne endures'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'The glory of Zion, the earthly habitation of the Lord, is at an end, but the throne of the Lord endures eternally.'
  - where: 'note 5:19 “The turn in verse 19”'
    claim: 'The thought is the ground of hope, in nearly the words of Ps. 102 (Keil’s 102:13 is the King James 102:12)'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'This thought is expressed as the ground of hope, in nearly the same words as are found in Psalm 102:13.'
  - where: 'note 5:21 “A prayer to be turned back”'
    claim: 'Lam 5:21 uses two forms of shuv (H7725); the second shown'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'וְֽ/נָשׁ֔וּבָה'
  - where: 'note 5:21 “A prayer to be turned back”'
    claim: 'Jer 31:18 has hashiveni and v-ashuvah (H7725); the second shown'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/אָשׁ֔וּבָה'
  - where: 'note 5:21 “A prayer to be turned back”'
    claim: 'The verbs mean the re-establishment of the gracious relation, not conversion only'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'they signify the re-establishment of the gracious relation, which is, of course, impossible without repentance and conversion on the part of Israel.'
  - where: 'note 5:21 “A prayer to be turned back”'
    claim: 'The prayer is not for a return to the land, because the speakers are not the exiles'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'because it is not the exiles who address this petition to the Lord.'
  - where: 'note 5:21 “A prayer to be turned back”'
    claim: 'The second half of the verse shows what the bringing back means'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'is shown in the second hemistich, "renew our days, as they were in former times,"'
  - where: 'note 5:21 “A prayer to be turned back”'
    claim: 'Jer 31:18 text (the Church footnote 21a on “Turn” at Lam. 5:21 lists Jer. 31:18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'turn thou me, and I shall be turned; for thou art the Lord my God.'
  - where: 'note 5:21 “A prayer to be turned back”'
    claim: 'The Lord’s reply to Ephraim in Jer. 31:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'since I spake against him, I do earnestly remember him still: therefore my bowels are troubled for him; I will surely have mercy upon him, saith the Lord.'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'Hebrew begins ki im'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'כִּ֚י'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'ki im can mean “but” and came to mean “unless”'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'after a negative clause, signifies nisi, but (Ger. sondern). This meaning developed into that of a strong limitation'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'The conditional rendering'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'unless Thou hast utterly rejected us, - art very wroth against us.'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'On the conditional reading the case is only a possibility'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'This case, however, is merely stated as a possibility, the actual occurrence of which is out of the question.'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'The verse rendered as a question'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'Or, hast Thou indeed utterly rejected us? art thou very wroth against us?'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'The same idea is in Jer. 14:19 as a question'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'The idea is the same as that expressed by Jeremiah (Jeremiah 14:19) in the form of a question'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'Many manuscripts repeat verse 21 after verse 22 for synagogue reading'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/5.htm'
    quote: 'In many Hebrew MSS Lam 5:21 is found repeated after Lamentations 5:22, to make the whole more suitable for public reading in the synagogue, that the poem may not end with the mention of the wrath of God'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'NRSVUE reading, first line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5%3A19-22&version=NRSVUE'
    quote: 'unless you have utterly rejected us'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'NRSVUE reading, second line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5%3A19-22&version=NRSVUE'
    quote: 'and are angry with us beyond measure.'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'NIV reading, first line'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5%3A19-22&version=NIV'
    quote: 'unless you have utterly rejected us'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'NIV reading, second line'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5%3A19-22&version=NIV'
    quote: 'and are angry with us beyond measure.'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'ESV reading, first line'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5%3A19-22&version=ESV'
    quote: 'unless you have utterly rejected us,'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'ESV reading, second line'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Lamentations+5%3A19-22&version=ESV'
    quote: 'and you remain exceedingly angry with us.'
  - where: 'note 5:22 “How the last verse is read”'
    claim: 'Jer 14:19 asks the question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng'
    quote: 'Hast thou utterly rejected Judah? hath thy soul lothed Zion?'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ'
  - where: 'christ'
    claim: 'The Lord’s reply to Ephraim’s request (Jer. 31:18, 20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'since I spake against him, I do earnestly remember him still: therefore my bowels are troubled for him; I will surely have mercy upon him, saith the Lord.'
