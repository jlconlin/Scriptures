    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-22.htm'
    quote: 'חַֽסְדֵ֤י'
  - where: 'note 3:25 “Three lines that begin “good””'
    claim: 'Verse 23 begins with chet (chadashim)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-23.htm'
    quote: 'חֲדָשִׁים֙'
