chapter: 3
claims:
  - where: 'when'
    claim: 'The book mourns the destruction of Jerusalem and its temple'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Lamentations is a collection of five poetic laments mourning the destruction of Jerusalem and its temple.'
  - where: 'setting'
    claim: 'Five laments on the destruction of Jerusalem; no author named, traditionally Jeremiah'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Although no author is mentioned by name, this book is traditionally attributed to the prophet Jeremiah, who witnessed the events being described.'
  - where: 'setting'
    claim: 'Chapter 3 expands the acrostic to 66 verses, three lines per letter'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Lamentations 3 expands the pattern to 66 verses, with three lines per Hebrew letter.'
  - where: 'setting'
    claim: 'The book has no responses from the Lord; mercy came later'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'unlike many books in the Old Testament, Lamentations does not contain any responses from the Lord. It captures only the suffering and longing that the people felt before the Lord later showed mercy to them.'
  - where: 'note 3:1 “The man who speaks”'
    claim: 'The Church heading: Jeremiah speaking for Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'Jeremiah, speaking for Judah, laments the calamity but trusts in the Lord and prays for deliverance.'
  - where: 'note 3:1 “The man who speaks”'
    claim: 'The poem begins as a man’s complaint; the shift from I to we shows he speaks for the nation; some expositors read it as the writer’s own sufferings'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'This third poem begins with the complaint of a man over grievous personal suffering.'
  - where: 'note 3:1 “The man who speaks”'
    claim: 'Keil: we is used instead of I in 3:22 and 3:40–47, so the prophet is not bewailing his own sufferings; others think otherwise'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'in Lamentations 3:22 and Lamentations 3:40-47, we is used instead of I; from which it is evident that the prophet, in the remainder of the poem, is not speaking of himself, or bewailing his own personal sufferings'
  - where: 'note 3:1 “The man who speaks”'
    claim: 'Keil names expositors who take the writer’s personal sufferings as the subject'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'are of opinion that the writer here makes his personal sufferings the subject of complaint'
  - where: 'note 3:1 “The man who speaks”'
    claim: 'The Student Manual calls it the writer’s individual lament over his and his people’s condition'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'contains the writer’s individual lament over his and his people’s distressed condition'
  - where: 'note 3:1 “The man who speaks”'
    claim: 'The rod of his wrath is the rod of God’s anger'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'as in Proverbs 22:8, is the rod of God'
  - where: 'note 3:15 “Wormwood and gall”'
    claim: 'Wormwood is used only figuratively, of bitter things, in the Hebrew Bible'
    key: bdb
    url: 'https://biblehub.com/hebrew/3939.htm'
    quote: 'only figurative of bitter things'
  - where: 'note 3:15 “Wormwood and gall”'
    claim: 'BDB lists Lamentations 3:15 and 3:19 among its occurrences'
    key: bdb
    url: 'https://biblehub.com/hebrew/3939.htm'
    quote: 'Lamentations 3:15'
  - where: 'note 3:21 “Remember, remembrance, recall”'
    claim: 'The Hebrew of 3:19 begins with an imperative: Remember'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-19.htm'
    quote: 'Remember'
  - where: 'note 3:21 “Remember, remembrance, recall”'
    claim: 'The Hebrew idiom of 3:21 is listed by BDB under memory, call to mind'
    key: bdb
    url: 'https://biblehub.com/hebrew/3820.htm'
    quote: 'call to mind Isaiah 44:19; Lamentations 3:21'
  - where: 'note 3:22 “Mercies and compassions”'
    claim: 'BDB glosses the word for mercy as goodness, kindness'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'goodness, kindness'
  - where: 'note 3:22 “Mercies and compassions”'
    claim: 'The plural noun of 3:22 means compassion, according to many from the word for womb; motherly or brotherly feeling'
    key: bdb
    url: 'https://biblehub.com/hebrew/7356.htm'
    quote: 'absolute plural intensive compassion (according to many denominative from רֶחֶם, originally brotherhood, brotherly feeling, of those born from same womb, see NöZMG xl (1886), 151 (yet see 152) WeGGN 1893, 475 Gerber126, or motherly feeling'
  - where: 'note 3:22 “Mercies and compassions”'
    claim: 'BDB lists Lamentations 3:22 under this plural'
    key: bdb
    url: 'https://biblehub.com/hebrew/7356.htm'
    quote: 'suffix רַחֲמָיו Lamentations 3:22'
  - where: 'note 3:23 “Hope in the Lord’s mercies”'
    claim: 'Come, Follow Me asks what messages of hope in Christ are in 3:20–33'
    key: cfm-ot-2026-44
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/44?lang=eng'
    quote: 'What messages of hope in Christ do you find? (see especially Lamentations 3:20–33; see also Matthew 5:4; James 4:8–10; Alma 36:17–20).'
  - where: 'note 3:23 “Hope in the Lord’s mercies”'
    claim: 'Come, Follow Me links 3:22–26 to the forgiveness Jesus Christ offers'
    key: cfm-ot-2026-44
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/44?lang=eng'
    quote: 'What do we find in Lamentations 3:22–26 that helps us understand the forgiveness Jesus Christ offers?'
  - where: 'note 3:23 “Hope in the Lord’s mercies”'
    claim: 'The hymn is headed with Lamentations 3:22–23'
    key: hymn-great-faithfulness
    url: 'https://www.churchofjesuschrist.org/study/music/hymns-for-home-and-church/great-is-thy-faithfulness?lang=eng'
    quote: 'Lamentations 3:22–23'
  - where: 'note 3:23 “Hope in the Lord’s mercies”'
    claim: 'The hymn’s lines on compassions and mercies'
    key: hymn-great-faithfulness
    url: 'https://www.churchofjesuschrist.org/study/music/hymns-for-home-and-church/great-is-thy-faithfulness?lang=eng'
    quote: 'Morning by morning, new mercies I see.'
  - where: 'note 3:25 “Three lines that begin “good””'
    claim: 'Three lines per Hebrew letter in chapter 3'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Lamentations 3 expands the pattern to 66 verses, with three lines per Hebrew letter.'
  - where: 'note 3:25 “Three lines that begin “good””'
    claim: 'Verse 25 begins with the Hebrew word tov, good'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-25.htm'
    quote: 'ṭō·wḇ'
  - where: 'note 3:25 “Three lines that begin “good””'
    claim: 'Verse 26 begins with the Hebrew word tov, good'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-26.htm'
    quote: 'ṭō·wḇ'
  - where: 'note 3:25 “Three lines that begin “good””'
    claim: 'Verse 27 begins with the Hebrew word tov, good'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-27.htm'
    quote: 'ṭō·wḇ'
  - where: 'note 3:27 “The yoke, the silence, the cheek”'
    claim: 'Keil: the yoke is that of sufferings; youth is the time of vigour'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'In the present context the yoke is that of sufferings, and the time of youth is mentioned as the time of freshness and vigour, which render the bearing of burdens more easy.'
  - where: 'note 3:27 “The yoke, the silence, the cheek”'
    claim: 'Keil, citing Ngelsbach: a gradation across 3:28–30; compares Isaiah 50:6 and Matthew 5:39'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'The sitting alone and in silence is comparatively the easiest; it is harder to place the mouth in the dust, and yet cling to hope; it is most difficult of all to give the cheek to the smiter'
  - where: 'note 3:27 “The yoke, the silence, the cheek”'
    claim: 'Keil cites Isaiah 50:6 and Matthew 5:39 for the cheek'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'Let him present his cheek to him who smites him, as was done by Job (Job 16:10) and the servant of Jahveh (Isaiah 50:6); cf. Matthew 5:39.'
  - where: 'note 3:38 “Evil and good from the mouth of the Most High”'
    claim: 'Keil reads 3:37–38 as: nothing happens that the Lord has not appointed; cf. Isaiah 45:7 and Amos 3:6'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'Nothing takes place on the earth which the Lord has not appointed'
  - where: 'note 3:38 “Evil and good from the mouth of the Most High”'
    claim: 'Keil: 3:39 applies the principle to the downfall of Judah, and renders it Let every one sigh for his sins'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: '"Why does a man sigh as long as he lives? Let every one [sigh] for his sins."'
  - where: 'note 3:38 “Evil and good from the mouth of the Most High”'
    claim: 'Keil applies it to the grievous suffering at the downfall of Judah'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'the application of the general principle to the particular case in question, viz., the grievous suffering of individuals at the downfall of the kingdom of Judah'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'Verse 46 begins with pe'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-46.htm'
    quote: 'פָּצ֥וּ'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'Verse 49 begins with ayin'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-49.htm'
    quote: 'עֵינִ֧י'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'In chapter 1 the verse with ayin (1:16) comes before the verse with pe (1:17)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/1-16.htm'
    quote: 'עַל־'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'Verse 1:17 begins with pe'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/1-17.htm'
    quote: 'פֵּֽרְשָׂ֨ה'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'The Hebrew of 3:1 has raah, “seen” (affliction)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-1.htm'
    quote: 'רָאָ֣ה'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'The Hebrew of 3:50 has the same verb, the Lord will see'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-50.htm'
    quote: 'וְ/יֵ֔רֶא'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'The Hebrew of 3:59 has the same verb, thou hast seen'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-59.htm'
    quote: 'רָאִ֤יתָה'
  - where: 'note 3:53 “The dungeon”'
    claim: 'Jeremiah was cast into a dungeon with mire and no water (Jer. 38:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'And in the dungeon there was no water, but mire: so Jeremiah sunk in the mire.'
  - where: 'note 3:53 “The dungeon”'
    claim: 'Some expositors refer 3:52–54 to Jeremiah’s own sufferings and the pit of Jer. 38:6'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'The complaint in these verses (52-54) is regarded by some expositors as a description of the personal sufferings of Jeremiah; and the casting into the pit is referred to the incident mentioned in Jeremiah 38:6.'
  - where: 'note 3:53 “The dungeon”'
    claim: 'Keil: the account is figurative; the pit points to death or Sheol, as 3:55 shows'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'The figurative character of the whole account thus shows itself in the very fact that the separate portions of it are taken from reminiscences of passages in the Psalms'
  - where: 'note 3:53 “The dungeon”'
    claim: 'The Hebrew word for dungeon in 3:53 is bor, the same as in Jer. 38:6'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-53.htm'
    quote: 'ḇab·bō·wr'
  - where: 'note 3:56 “Prayer shut out, prayer heard”'
    claim: 'The book has no responses from the Lord'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Lamentations does not contain any responses from the Lord.'
  - where: 'note 3:63 “Their song”'
    claim: 'BDB: the noun in 3:14 is a subject of mocking song'
    key: bdb
    url: 'https://biblehub.com/hebrew/5058.htm'
    quote: 'subject of mocking song Job 30:9'
  - where: 'note 3:63 “Their song”'
    claim: 'BDB: the noun in 3:63 is a mocking, derisive song, related to the foregoing'
    key: bdb
    url: 'https://biblehub.com/hebrew/4485.htm'
    quote: 'noun feminine (mocking, derisive) song (compare foregoing); — מַנְגִּינָתָם Lamentations 3:63'
  - where: 'christ'
    claim: 'Come, Follow Me asks for messages of hope in Christ in 3:20–33'
    key: cfm-ot-2026-44
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/44?lang=eng'
    quote: 'What messages of hope in Christ do you find? (see especially Lamentations 3:20–33; see also Matthew 5:4; James 4:8–10; Alma 36:17–20).'
  - where: 'christ'
    claim: 'The book has no response from the Lord; mercy later'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'It captures only the suffering and longing that the people felt before the Lord later showed mercy to them.'
  - where: 'explore'
    claim: 'Laments also appear in the Book of Mormon (Mormon 6:16–22)'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Laments also appear in the Book of Mormon (see Mormon 6:16–22).'
