    claim: 'Verse 24 begins with chet (chelqi)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-24.htm'
    quote: 'חֶלְקִ֤'
  - where: 'note 3:53 “The dungeon”'
    claim: 'Keil: nothing is known of enemies covering Jeremiah with a stone'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'there is nothing mentioned or known of his enemies having stoned him, or having covered him over with a stone'
  - where: 'note 3:64 “Recompence left with the Lord”'
    claim: 'The closing verses are addressed to the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'Render unto them a recompence, O LORD, according to the work of their hands.'
  - where: 'note 3:15 “Wormwood and gall”'
    claim: 'BDB: rosh (KJV gall) is a bitter and poisonous herb, always figurative'
    key: bdb
    url: 'https://biblehub.com/hebrew/7219.htm'
    quote: 'a bitter and poisonous herb, them venom, always figurative'
  - where: 'note 3:18 “The name comes late”'
    claim: 'Verse 18 is the first verse of the chapter to name the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'My strength and my hope is perished from the'
  - where: 'note 3:33 “He doth not afflict willingly”'
    claim: 'The Hebrew behind “willingly” in 3:33 is a form of the word for heart (leb, Strong’s 3820), glossed “with His heart”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/lamentations/3-33.htm'
    quote: 'with His heart'
  - where: 'note 3:38 “Evil and good from the mouth of the Most High”'
    claim: 'Keil on 3:39: man is to sigh only over his sin'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/3.htm'
    quote: 'Man is not to sigh over suffering and sorrow, but only over his sin'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'Keil: the pe-before-ayin order is not an oversight, since it is repeated in three poems'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'the irregularity is repeated in three poems'
  - where: 'note 3:48 “The tears that wait for the Lord to see”'
    claim: 'Keil’s explanation: the poets kept the alphabet’s order only so far as it fitted the course of thought'
    key: keil-lamentations
    url: 'https://biblehub.com/commentaries/kad/lamentations/1.htm'
    quote: 'the composers bound themselves rigorously by the order of the alphabet only so long as it fitted in to the course of thought without any artificiality'
