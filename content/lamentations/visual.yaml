summary: >-
  Lamentations is five poems of grief over a fallen Jerusalem, in which the Lord does
  not answer, yet at the center of the book a mourner remembers that the Lord's
  compassions fail not and are new every morning. The image is the emptied city seen
  from close by, with the first morning light just touching it.
motifs:
  - "A city gate seen from directly in front and close, filling most of the picture: a tall stone gateway in a high wall, its doors gone, standing open and empty."
  - "Through the gateway, an empty street of stone houses in cool shadow, with no one in it."
  - "A few squared stones lying fallen in the gateway and the street, quiet and still, with no fire or smoke."
  - "Early morning light falling as a warm band across only the top courses of the wall and the upper arch, while everything below stays in cool indigo shadow."
composition: >-
  A frontal, architectural view, not a landscape: the wall runs edge to edge and the
  open gateway stands a little left of center as the single focal point. No horizon,
  no sun or sun disc in view, no distant hills, and no object placed in the
  foreground. Most of the picture is cool, shadowed stone in indigo and muted clay;
  the only warm color is the band of morning light along the top of the wall. The mood
  is still and waiting; the light is gentle and has only begun to arrive.
alt: An empty city gate stands open in a high stone wall, with a few fallen stones in the street beyond and morning light touching only the top of the wall.
status: proposed
