summary: >-
  Lamentations is five poems of grief over a fallen Jerusalem, in which the Lord does
  not answer, yet at the center of the book a mourner remembers that the Lord's
  compassions fail not and are new every morning. The image sets the emptied city on
  one side and the new morning on the other, and the morning is the stronger of the two.
motifs:
  - "Most important: fresh morning light pouring in from the right side of the picture, clean, clear and new, falling on open ground with young green growth and on the near end of the road. The sun itself is out of the frame."
  - "On the left, in cool shadow: a tall stone city gate in a high wall, its doors gone, standing open and empty, with a shadowed street of old stone houses seen through it."
  - "An empty road running from the gate across the picture toward the light, with no one on it."
  - "Subtle and small: a plain gold crown, dimmed and fallen on its side, lying among a few fallen stones beside the gate in the shadow."
  - "Subtle and small: two foxes walking in the empty street just inside the gate, seen as simple dark shapes."
composition: >-
  The picture divides between old and new. The left half is the old city: gate, wall,
  street, fallen stones and crown, in indigo and muted clay shadow, quiet and worn.
  The right half is open and bright, the morning light warm gold and parchment cream
  over fresh olive green, with a clear sky. The edge of the light falls diagonally
  across the road, so the road leads the eye out of the gate and into the morning,
  and the light just reaches the top of the gate. The light is the focal point and
  takes the larger share of attention; the crown and the foxes are small details to
  be found on a second look, never featured. No sun disc, no distant hills on a
  horizon, and no large object in the foreground.
