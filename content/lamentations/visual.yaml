summary: >-
  Lamentations is five poems of grief over a fallen Jerusalem, in which the Lord does
  not answer, yet at the center of the book a mourner remembers that the Lord's
  compassions fail not and are new every morning. The image holds both: a quiet,
  emptied city and the first thin light of a morning that has not yet fully come.
motifs:
  - Primary: the first pale gold light of dawn along a low horizon, rising behind the city and not yet reaching it.
  - A solitary hill city seen from a distance, its walls intact and quiet, its gate empty, with no smoke, fire, or ruin.
  - A single tarnished gold bowl resting on a flat stone in the near foreground, its gold dimmed, with a thin line of dawn light along its rim.
composition: >-
  A wide, low, open landscape under a large dusk-blue sky. The distant city sits small
  and alone on a hill at the left third, in deep indigo shadow. The dawn light spreads
  from the right of the horizon as the focal point, a soft band of restrained gold
  against indigo, with open empty space around it. The dim gold bowl on its stone sits
  low in the right foreground, catching the first light on one edge only. The mood is
  still, patient, and waiting; the dawn is gentle and unfinished, never triumphant, and
  nothing is burning or broken.
alt: A walled city stands small on a distant hill under a dark sky as pale gold dawn light spreads along the horizon, and a dulled gold bowl rests on a stone in the foreground.
status: proposed
