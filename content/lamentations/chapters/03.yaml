chapter: 3
title: The Man, the Mercies, and the Pit
tagline: A man says that the Lord has shut him in, bent a bow at him, and filled him with bitterness. Then he remembers, and says that the Lord’s mercies are new every morning. The poem ends in the dungeon, asking the Lord to see and to judge.
when: 'After the fall of Jerusalem. The book mourns “the destruction of Jerusalem and its temple” and gives no date of its own.'

setting: |
  Lamentations is “a collection of five poetic laments mourning the destruction of Jerusalem and its temple.” It names no author, and it “is traditionally attributed to the prophet Jeremiah, who witnessed the events being described.”

  This is the middle poem, and it is three times the length of the others. The first, second, and fourth chapters have 22 verses, one for each letter of the Hebrew alphabet. Here the pattern “expands… to 66 verses, with three lines per Hebrew letter.” After two poems about the city, this one is spoken by a man. Its first eighteen verses are his complaint. Verses 19–39 turn to remembering and to hope. Verses 40–51 confess and weep. Verses 52–66 look back from the pit and ask the Lord to judge.

  As everywhere in the book, the Lord gives no response here (see the note on [[Lam. 3:56]]). The siege itself is told in [[Jer. 37–39]].

thread: |
  The chapter is about what the man does with his affliction. For eighteen verses he lists it, and nearly every line has the Lord as its subject. Then, in verse 21, he “recalls” something to his mind, and the poem changes. The verses that follow speak of the Lord’s mercies.

  After that turn the poem does three things that the first part did not. It speaks of the Lord’s heart (verses 31–33), it moves from “I” to “we” and confesses (verses 40–42), and it prays to be seen: the weeping goes on “till the LORD look down, and behold” (verse 50; see the note on [[Lam. 3:48]]).

  The poem does not end in comfort, and the Lord does not speak. Verse 57 remembers a time when He did, and verses 64–66 leave the enemies with Him. The hope of verses 21–26 stands in the middle of the chapter and is not taken back, but nothing in the chapter tells the man that it has come.

sections:
  - range: 1-18
    heading: “I am the man”
    plain: |
      I am the man who has seen affliction by the rod of His wrath. He has led me into darkness and not into light, and turned His hand against me all the day. He has made my flesh and skin old and broken my bones. He has built against me and compassed me with gall and travail, set me in dark places like those long dead, hedged me about so that I cannot get out, and made my chain heavy. When I cry and shout, He shuts out my prayer. He has enclosed my ways with hewn stone and made my paths crooked. He has been to me a bear lying in wait and a lion in secret places, and has pulled me in pieces and made me desolate. He has bent His bow and set me as the mark for the arrow, and caused the arrows of His quiver to enter my reins. I was a derision to all my people and their song all the day. He has filled me with bitterness, broken my teeth with gravel stones, and covered me with ashes. You have removed my soul far from peace; I forgot prosperity. I said, “My strength and my hope are perished from the Lord.”
  - range: 19-39
    heading: “This I recall to my mind”
    plain: |
      Remember my affliction and my misery, the wormwood and the gall. My soul has them still in remembrance and is humbled in me. This I recall to my mind, and therefore I have hope: it is of the Lord’s mercies that we are not consumed, for His compassions do not fail. They are new every morning; great is Your faithfulness. The Lord is my portion, my soul says; therefore I will hope in Him. The Lord is good to those who wait for Him, to the soul that seeks Him. It is good to hope and quietly wait for the salvation of the Lord, and good for a man to bear the yoke in his youth. He sits alone and keeps silence because he has borne it; he puts his mouth in the dust, if there may be hope; he gives his cheek to the one who strikes him and is filled full with reproach. For the Lord will not cast off forever. Though He causes grief, He will have compassion according to the multitude of His mercies, for He does not afflict willingly or grieve the children of men. To crush all the prisoners of the earth under His feet, to turn aside a man’s right before the face of the Most High, to subvert a man in his cause: the Lord does not approve. Who is it that speaks and it comes to pass, when the Lord has not commanded it? Does not evil and good proceed from the mouth of the Most High? Why should a living man complain, a man for the punishment of his sins?
  - range: 40-51
    heading: “Let us search and try our ways”
    plain: |
      Let us search and try our ways and turn again to the Lord. Let us lift up our heart with our hands to God in the heavens. We have transgressed and rebelled; You have not pardoned. You have covered with anger and pursued us; You have slain and not pitied. You have covered Yourself with a cloud so that our prayer should not pass through. You have made us the offscouring and refuse in the midst of the peoples. All our enemies have opened their mouths against us. Fear and a snare have come upon us, desolation and destruction. My eye runs down with rivers of water for the destruction of the daughter of my people. My eye trickles down and does not cease, without any intermission, until the Lord looks down and beholds from heaven. My eye affects my heart because of all the daughters of my city.
  - range: 52-66
    heading: “Thou drewest near in the day that I called upon thee”
    plain: |
      My enemies chased me hard, like a bird, without cause. They have cut off my life in the dungeon and cast a stone upon me. Waters flowed over my head; then I said, “I am cut off.” I called on Your name, Lord, out of the low dungeon. You have heard my voice; do not hide Your ear at my breathing, at my cry. You drew near in the day that I called on You, and said, “Fear not.” Lord, You have pleaded the causes of my soul and redeemed my life. Lord, You have seen my wrong; judge my cause. You have seen all their vengeance and all their imaginations against me, and heard their reproach. Behold their sitting down and their rising up; I am their music. Render to them a recompense, Lord, according to the work of their hands. Give them sorrow of heart, Your curse on them. Persecute and destroy them in anger from under the heavens of the Lord.

notes:
  - ref: 1
    phrase: the man that hath seen affliction
    kind: history
    title: The man who speaks
    body: |
      The chapter is spoken by a man, and the poem leaves open how far he is one person and how far he is the whole people. The Church’s chapter heading has him as both: “Jeremiah, speaking for Judah.” The poem begins as the complaint of a man over grievous personal suffering, and it can be read as the poet’s own story, in which “the writer here makes his personal sufferings the subject of complaint.” Against that, the “I” gives way to “we” in verses 22 and 40–47, which can be taken to show that the poet “is not speaking of himself, or bewailing his own personal sufferings.” The two can be held together: the chapter “contains the writer’s individual lament over his and his people’s distressed condition.” Which it is in a given verse is a judgment about how the poem works, not something the text states.

      “The rod of his wrath” is “the rod of God” in anger, the thing He strikes with. The “he” of the verses that follow is not named until verse 18 (see the note there).
    sources: [lds-scriptures, keil-lamentations, ot-manual-24]
  - ref: 15
    phrase: made me drunken with wormwood
    kind: symbol
    title: Wormwood and gall
    body: |
      “Wormwood” and “gall” are the chapter’s two words for bitterness, and both are figures of speech. Gall comes in verse 5, wormwood in verse 15, and the two together in verse 19, where the man asks that they be remembered. The Hebrew word for wormwood is used “only figurative of bitter things,” with Lamentations 3:15 and 3:19 among its occurrences. The word the King James renders “gall” (*rosh*) is “a bitter and poisonous herb,” and it too is “always figurative.”
    sources: [bdb]
  - ref: 18
    phrase: perished from the LORD
    kind: structure
    title: The name comes late
    body: |
      The chapter names the Lord for the first time in verse 18, and only to say that the man’s hope has perished from Him. Verses 1–17 speak of “he” and “thou” without naming anyone, and nearly every line of the complaint has the Lord as its subject.

      Nothing in these verses answers him. What the poem does next is a change in the man himself: he remembers (verses 19–21).
    sources: [lds-scriptures]
  - ref: 21
    phrase: This I recall to my mind
    kind: words
    title: Remember, remembrance, recall
    body: |
      The turn of the poem is made of memory words, which run through three verses. The Hebrew of verse 19 begins with an imperative, “Remember” (the King James has “Remembering”), and verse 20 says that the soul has “them still in remembrance.” In verse 21 comes “This I recall to my mind,” an idiom of memory, “call to mind,” found also in [[Isa. 44:19]]. The man has been remembering his affliction, and the verse joins his hope to the recalling: “therefore have I hope.” The verses that follow speak of the Lord’s mercies (see the note on [[Lam. 3:22]]).
    sources: [biblehub-interlinear, bdb, lds-scriptures]
  - ref: 22
    phrase: that we are not consumed, because his compassions fail not
    kind: words
    title: Mercies and compassions
    body: |
      “Mercies” and “compassions” are two different Hebrew words. The lexicon glosses the first (*chesed*, here in the plural) as “goodness, kindness.” The second is a plural noun meaning “compassion,” which, “according to many,” comes from the word for womb, so that it carries the feeling “of those born from same womb” or a “motherly feeling.” That derivation is a scholarly one and not certain. The man says that the Lord’s mercies explain why “we are not consumed,” and that His compassions “fail not.”
    sources: [bdb, lds-scriptures]
  - ref: 23
    phrase: great is thy faithfulness
    kind: christ
    title: Hope in the Lord’s mercies
    body: |
      The Church reads this part of the chapter as hope in Jesus Christ, though the poem itself speaks only of “the LORD.” Its question for readers of verses 20–33 is, “What messages of hope in Christ do you find?” and of verses 22–26, what they teach about “the forgiveness Jesus Christ offers.” The hymn “Great Is Thy Faithfulness” is headed with this passage and sings, “Morning by morning, new mercies I see.” That is the Church’s application of these verses; the poem itself names no Savior. [“None to Comfort Her”](/lamentations/themes/none-to-comfort/)
    sources: [cfm-ot-2026-44, hymn-great-faithfulness]
  - ref: 25
    phrase: The LORD is good unto them that wait for him
    kind: structure
    title: Three lines that begin “good”
    body: |
      This chapter is an alphabetic poem with three verses to each Hebrew letter, and the three verses of one letter, 25–27, all begin with the same Hebrew word, *tov*, “good.” The verses before them (22–24) all begin with the letter *chet*: “mercies” (*chasdei*), “new” (*chadashim*), “my portion” (*chelqi*). Three things are called good in turn: the Lord, to those who wait for Him (verse 25); waiting quietly for His salvation (verse 26); and bearing the yoke in youth (verse 27).
    sources: [biblehub-interlinear, scripture-helps-jer-31-33]
  - ref: 27
    phrase: bear the yoke in his youth
    kind: symbol
    title: The yoke, the silence, the cheek
    body: |
      Verses 27–30 describe a way of bearing suffering, and verses 28–30 can be read as steps in it. The yoke is “that of sufferings,” and youth is named as “the time of freshness and vigour, which render the bearing of burdens more easy.” Then comes a rising scale: to sit alone in silence is “comparatively the easiest,” to “place the mouth in the dust, and yet cling to hope” is harder, and “most difficult of all” is “to give the cheek to the smiter.” Verse 29 keeps hope in view (“if so be there may be hope”), and verses 31–33 give the grounds for it.

      The verses do not say who offers the cheek. The same is said of Job ([[Job 16:10]]) and of the Lord’s servant ([[Isa. 50:6]]), and the Savior asks it of His disciples in [[Matt. 5:39]].
    sources: [keil-lamentations, lds-scriptures]
  - ref: 33
    phrase: doth not afflict willingly
    kind: scripture
    title: He doth not afflict willingly
    body: |
      Verses 31–33 are the book’s own statement of the Lord’s heart, and they answer verses 1–18 without denying them. The man has said that the Lord did these things; now he says what the Lord is like while doing them. He gives three reasons for comfort: the Lord “will not cast off for ever” (31); though He causes grief He has compassion “according to the multitude of his mercies” (32); and “he doth not afflict willingly” (33). “Willingly” translates a Hebrew phrase built on the word for heart, word for word “with His heart.” The verses do not explain why a given suffering comes. They say only that the Lord’s heart is not in it. [The Lord’s Hand and Heart](/lamentations/themes/hand-and-heart/)
    sources: [biblehub-interlinear, lds-scriptures]
  - ref: 38
    phrase: Out of the mouth of the most High proceedeth not evil and good?
    kind: scripture
    title: Evil and good from the mouth of the Most High
    body: |
      Verses 37–38 ask two questions, and verse 39 turns their answer on the complaint. Verse 37 asks who can speak and have it happen unless the Lord commanded it; verse 38 asks whether “evil and good” do not come from the Most High’s mouth. The sense is that “nothing takes place on the earth which the Lord has not appointed,” as in [[Isa. 45:7]] and [[Amos 3:6]]. Verse 39 then applies the principle “to the particular case in question, viz., the grievous suffering of individuals at the downfall of the kingdom of Judah.” One rendering of it is, “Why does a man sigh as long as he lives? Let every one [sigh] for his sins.” On that reading, “Man is not to sigh over suffering and sorrow, but only over his sin.” The King James makes the whole verse one question, about complaining for “the punishment of his sins.” Either way the verse is spoken to a people whose sins the book has already named ([[Lam. 1:5]]; [[Lam. 1:18]]), and it leads into the confession of verses 40–42. The poem’s own statement of the Lord’s heart is in verse 33.
    sources: [keil-lamentations, lds-scriptures]
  - ref: 48
    phrase: Mine eye runneth down with rivers of water
    kind: structure
    title: The tears that wait for the Lord to see
    body: |
      The weeping of verses 48–51 is given an end: it goes on “till the LORD look down, and behold from heaven” (50). The verb is the one the chapter began with. In verse 1 the man “hath seen affliction” (Hebrew *raah*); in verse 50 he waits for the Lord to “behold” (the same verb); and in verse 59 he says, “thou hast seen my wrong” (the same verb again). The man saw what was done to him, and near the end he says that the Lord has seen it too. That is a pattern in the words themselves; whether the poet planned it the text does not say.

      The acrostic also changes here. Verses 46–48 begin with the Hebrew letter *pe* and verses 49–51 with *ayin*, so *pe* comes first; in chapter 1 the verse that begins with *ayin* (1:16) stands before the one that begins with *pe* (1:17). The text gives no reason (see the note on [[Lam. 1:16]]). [“See, O LORD, and Consider”](/lamentations/themes/look-upon-us/)
    sources: [biblehub-interlinear, lds-scriptures]
  - ref: 53
    phrase: in the dungeon
    kind: history
    title: The dungeon
    body: |
      The dungeon of verses 53–55 may recall what happened to Jeremiah, though the poem does not say so. In [[Jer. 38:6]] the rulers let Jeremiah down by cords into a dungeon where “there was no water, but mire,” and the Hebrew word there (*bor*) is the one used here. The verses have been read of that event, and they have also been read as a figure: the pit is death, or Sheol, and the details are borrowed from the Psalms. One argument for the figure is that “there is nothing mentioned or known of his enemies having stoned him, or having covered him over with a stone” in Jeremiah’s story, although verse 53 has it. The poem does not say which.
    sources: [lds-scriptures, keil-lamentations, biblehub-interlinear]
  - ref: 56
    phrase: Thou hast heard my voice
    kind: structure
    title: Prayer shut out, prayer heard
    body: |
      In verses 55–57 the man says that the Lord heard his prayer, where earlier he said that it was shut out. In verse 8 the Lord “shutteth out my prayer,” and in verse 44 He has covered Himself with a cloud “that our prayer should not pass through.” Here the man calls “out of the low dungeon” and says, “Thou hast heard my voice.” The poem keeps both. It does not take back verses 8 and 44, and it places the answer in the past, in the day “that I called upon thee: thou saidst, Fear not” (57).

      “Fear not” are the only words of the Lord that the chapter quotes. The book “does not contain any responses from the Lord,” and this is not one in the present; it is remembered from a day that has passed. [“See, O LORD, and Consider”](/lamentations/themes/look-upon-us/)
    sources: [scripture-helps-jer-31-33, lds-scriptures]
  - ref: 63
    phrase: I am their musick
    kind: words
    title: Their song
    body: |
      “Musick” here is a taunt, the same mockery the man complained of in verse 14, where he was “their song all the day.” The two are different Hebrew words from the same family. The first is a noun used for the “subject of mocking song,” and the second means a “(mocking, derisive) song,” with this verse as its one example. The man is the song his enemies sing at him, which is why “musick” here is not praise.
    sources: [bdb, lds-scriptures]
  - ref: 64
    phrase: Render unto them a recompence
    kind: history
    title: Recompence left with the Lord
    body: |
      The closing verses ask the Lord to repay the enemies, as an appeal to His justice. Every verb is addressed to Him: “thou hast seen,” “thou hast heard,” “render,” “give,” “persecute.” The chapter has just said, “judge thou my cause” (59), and the prayer is that the same judgment reach those who did the harm (see the note on [[Lam. 1:21]]).
    sources: [lds-scriptures]

christ: |
  The poem names no Savior, and the Lord does not speak in it. What the Church’s sources draw from it is “hope in Christ,” above all from verses 20–33 (see the note on [[Lam. 3:23]]). The book “captures only the suffering and longing that the people felt before the Lord later showed mercy to them,” so the mercies of verses 22–23 are spoken of before that mercy is seen.

explore: |
  - **The cistern in Jeremiah’s own story.** [[Jer. 38:1–13]]; the later promises of mercy are in [[Jer. 31:31–34]].
  - **A lament in the Book of Mormon.** [[Morm. 6:16–22]].
  - **The next poem.** [[Lam. 4:1–22]] returns to the city.

