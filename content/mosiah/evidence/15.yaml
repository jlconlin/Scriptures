# Evidence ledger for Mosiah 15 (a bare chapter, 2026-10-07; the rows for its two notes came with them from Isaiah 52)
chapter: 15
claims:
  - where: when
    claim: Abinadi’s words in Mosiah 15 are dated about 148 BC (Mosiah 15 chapter heading)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/15?lang=eng
    quote: About 148 B.C.
  - where: when
    claim: Zeniff’s people, over whom Noah reigned, lived in the land of Lehi-Nephi (Mosiah 9 chapter heading)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/9?lang=eng
    quote: Zeniff leads a group from Zarahemla to possess the land of Lehi-Nephi
  - where: note 15:18 “Whose feet are beautiful”
    claim: Abinadi applies Isaiah 52:7 first to the prophets and then, ultimately, to the Redeemer
    key: sc-knowhy-89
    url: https://scripturecentral.org/knowhy/why-would-noahs-priests-quiz-abinadi-on-isaiah
    quote: he applied its words regarding good tidings, peace, and salvation first to the prophets (Mosiah 15:11–17). Then, he applied it ultimately to the Redeemer himself (Mosiah 15:18–19).
  - where: note 15:18 “Whose feet are beautiful”
    claim: Abinadi quoted Isaiah 53 in answer to the priests’ charge, as the fuller context of the passage they used
    key: sc-knowhy-89
    url: https://scripturecentral.org/knowhy/why-would-noahs-priests-quiz-abinadi-on-isaiah
    quote: It is in response to this charge that Abinadi quoted Isaiah 53, thereby supplying the fuller context of the passage used by the priests.
  - where: note 15:29 “The watchmen’s song at the last day”
    claim: Abinadi places Isa. 52:8–10 after his warning to the priests, as a last-day prophecy of the Lord's first and second comings (Pike, p. 265)
    key: isaiah-in-bom
    url: https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf
    quote: Jesus' suffering at his first coming allows him to exercise justice, to save or destroy, at his second coming, which is the context in which Abinadi places Isaiah 52:8-10.
  - where: note 15:29 “The watchmen’s song at the last day”
    claim: Abinadi applies the last-day prophecy to the priests as a last witness and warning (Pike, p. 265)
    key: isaiah-in-bom
    url: https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf
    quote: last witness and warning from Abinadi to the priests as he applies a prophecy concerning the last days to the priests
