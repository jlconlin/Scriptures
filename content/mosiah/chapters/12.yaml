# A bare chapter (2026-10-07): the text and the notes moved here from Isaiah 52. It has no setting, thread, sections,
# christ or explore yet, and is to be written in full with the rest of Mosiah (content/mosiah/BRIEF.md).
chapter: 12
title: 'Abinadi before King Noah’s Priests'
tagline: 'Abinadi is imprisoned for his prophecies, and King Noah’s priests question him from Isaiah.'
when: 'About 148 BC, in the land of Lehi-Nephi'

notes:
  - ref: 21
    phrase: How beautiful upon the mountains are the feet of him that bringeth good tidings
    kind: history
    title: Why the priests asked about Isaiah
    body: |
      The priests chose [[Isa. 52:7–10]] to trap Abinadi. Mormon gives their purpose: they questioned him “that they might cross him, that thereby they might have wherewith to accuse him” ([[Mosiah 12:19]]). Under the law of Moses a false prophet could be put to death ([[Deut. 18:20]]), and the priests likely expected Isaiah’s verses to expose Abinadi as one. In those verses the true messenger brings good tidings and publishes peace, and Abinadi had prophesied destruction ([[Mosiah 12:1–12]]).

      The passage may also have flattered the colony that heard it quoted. Zeniff’s people had gone back up from Zarahemla to reclaim “the land of our fathers’ first inheritance” ([[Mosiah 9:1]]), the land where Nephi had built a temple ([[2 Ne. 5:8]], [[2 Ne. 5:16]]), and they likely saw themselves in Isaiah’s “he hath redeemed Jerusalem” ([[Mosiah 12:23]]).

      Abinadi does not answer the question yet. His answer comes in [[Mosiah 15:13–18]], after he has quoted Isaiah 53 in full ([[Mosiah 14]]); see the note on [[Mosiah 15:18]]. What the verse meant in Isaiah’s own setting is in the note on [[Isa. 52:7]].
    sources: [sc-knowhy-89]
  - ref: 29
    phrase: If ye teach the law of Moses why do ye not keep it?
    kind: scripture
    title: Abinadi begins where Isaiah goes next
    body: |
      Abinadi’s challenge to the priests’ worthiness matches the order of Isaiah 52. There, right after the verses the priests quoted, comes the call to be clean: “touch no unclean thing… be ye clean, that bear the vessels of the LORD” ([[Isa. 52:11]]). Abinadi does not quote that verse, but he begins his answer on its subject, the cleanness of those who serve in the Lord’s house ([[Mosiah 12:26–31]]). The note on [[Isa. 52:11]] explains the vessels.
    sources: [isaiah-in-bom]

parallels:
  - ref: Isa. 52:7–10
    note: The priests quote these verses to Abinadi in verses 21–24.

sources: [lds-scriptures, mosiah-12-heading, sc-knowhy-89, isaiah-in-bom]
