# A bare chapter (2026-10-07): the text and the notes moved here from Isaiah 52 and 53. It has no setting, thread, sections,
# christ or explore yet, and is to be written in full with the rest of Mosiah (content/mosiah/BRIEF.md).
chapter: 15
title: 'The Father and the Son; the Beautiful Feet'
tagline: 'Abinadi teaches that God himself will come down and redeem His people, and answers the priests’ question about Isaiah.'
when: 'About 148 BC, in the land of Lehi-Nephi'

notes:
  - ref: 10
    phrase: And who shall be his seed?
    kind: christ
    title: The seed of Christ
    body: |
      Abinadi asks the court who the servant’s seed is, and he takes the question from the chapter of Isaiah he has just quoted. He reads “he shall see his seed” ([[Isa. 53:10]]) together with “who shall declare his generation?” ([[Isa. 53:8]]). His answer: “all those who have hearkened unto their words, and believed that the Lord would redeem his people, and have looked forward to that day for a remission of their sins, I say unto you, that these are his seed” ([[Mosiah 15:11]]). And he gives the reason: “For these are they whose sins he has borne; these are they for whom he has died” ([[Mosiah 15:12]]).

      Abinadi’s reading makes the servant a father: those whose sins he carried become his offspring. His answer also meets the priests’ challenge about who may speak for God: the seed include the prophets, “these are they who have published peace” ([[Mosiah 15:13–14]]), the very “good tidings” of [[Isa. 52:7]] that the priests had quoted at him (see the note on [[Mosiah 15:18]]). King Benjamin taught the same thing a generation later: “because of the covenant which ye have made ye shall be called the children of Christ, his sons, and his daughters” ([[Mosiah 5:7]]). Alma heard Abinadi and believed his words ([[Mosiah 17:2]]).

      What the line means within Isaiah’s song is in the note on [[Isa. 53:10]].
    sources: [isaiah-in-bom]
  - ref: 18
    phrase: the founder of peace, yea, even the Lord, who has redeemed his people
    kind: christ
    title: Whose feet are beautiful
    body: |
      Here Abinadi answers the question the priests asked in [[Mosiah 12:20–24]]: the feet that are beautiful upon the mountains are, in the end, the Lord’s. He reaches that answer by reading the “feet” in widening circles. First they are the prophets: “these are they who have published peace… And O how beautiful upon the mountains were their feet!” ([[Mosiah 15:14–15]]). Then they are all who are “still publishing peace” ([[Mosiah 15:16]]), and all who “shall hereafter publish peace” ([[Mosiah 15:17]]). Finally, “this is not all”: the feet belong to “him that bringeth good tidings, that is the founder of peace, yea, even the Lord, who has redeemed his people.”

      Abinadi’s interpretation joins the two halves of Isaiah 52: in his reading, the messenger announcing salvation ([[Isa. 52:7]]) and the suffering servant of [[Isa. 52:13–15]] are the same person. The priests asked about a verse of good tidings, and Abinadi answered with Isaiah 53 ([[Mosiah 14]]). Within days he was burned for his testimony ([[Mosiah 17:6]], [[Mosiah 17:13–20]]).

      Why the priests chose these verses is in the note on [[Mosiah 12:21]].
    sources: [sc-knowhy-89]
  - ref: 29
    phrase: thy watchmen shall lift up their voice
    kind: scripture
    title: The watchmen’s song at the last day
    body: |
      Abinadi returns to the rest of the priests’ passage ([[Isa. 52:8–10]]) and applies it to the last day. He quotes it after warning that those who rebel against God and die in their sins “have no part in the first resurrection” ([[Mosiah 15:26–27]]), and after saying that “the time shall come that the salvation of the Lord shall be declared to every nation, kindred, tongue, and people” ([[Mosiah 15:28]]). So the song of the watchmen, which the priests had quoted, comes back to them as a warning. The note on [[Isa. 52:8]] explains “eye to eye.”
    sources: [isaiah-in-bom]

parallels:
  - ref: Isa. 52:7–10
    note: Abinadi explains verse 7 in verses 14–18 and quotes verses 8–10 in verses 29–31.
  - ref: Isa. 53:8, 10
    note: Abinadi asks who the servant’s seed is and answers in verses 10–13.

sources: [lds-scriptures, sc-knowhy-89, isaiah-in-bom]
