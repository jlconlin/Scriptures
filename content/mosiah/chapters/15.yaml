# A bare chapter (2026-10-07): the text and the notes moved here from Isaiah 52. It has no setting, thread, sections,
# christ or explore yet, and is to be written in full with the rest of Mosiah (content/mosiah/BRIEF.md).
chapter: 15
title: 'The Father and the Son; the Beautiful Feet'
tagline: 'Abinadi teaches that God himself will come down and redeem His people, and answers the priests’ question about Isaiah.'
when: 'About 148 BC, in the land of Lehi-Nephi'

notes:
  - ref: 18
    phrase: the founder of peace, yea, even the Lord, who has redeemed his people
    kind: christ
    title: Whose feet are beautiful
    body: |
      Here Abinadi answers the question the priests asked in [[Mosiah 12:20–24]]: the feet that are beautiful upon the mountains are, last and most of all, the Lord’s. He reaches that answer by reading the “feet” in widening circles. First they are the prophets: “these are they who have published peace… And O how beautiful upon the mountains were their feet!” ([[Mosiah 15:14–15]]). Then they are all who are “still publishing peace” ([[Mosiah 15:16]]), and all who “shall hereafter publish peace” ([[Mosiah 15:17]]). Finally, “this is not all”: the most beautiful feet belong to “him that bringeth good tidings, that is the founder of peace, yea, even the Lord, who has redeemed his people.”

      Abinadi’s interpretation joins the two halves of Isaiah 52. The messenger announcing salvation ([[Isa. 52:7]]) and the suffering servant of [[Isa. 52:13–15]] are the same person. The priests asked about a pleasant verse, and Abinadi answered with Isaiah 53 ([[Mosiah 14]]). Within days he was burned for his testimony ([[Mosiah 17:6]], [[Mosiah 17:13–20]]).

      Why the priests chose these verses is in the note on [[Mosiah 12:21]].
    sources: [sc-knowhy-89]
  - ref: 29
    phrase: thy watchmen shall lift up their voice
    kind: scripture
    title: The watchmen’s song at the last day
    body: |
      Abinadi returns to the rest of the priests’ passage ([[Isa. 52:8–10]]) and gives it to the last day. He quotes it after warning that those who rebel against God and die in their sins “have no part in the first resurrection” ([[Mosiah 15:26–27]]), and after saying that “the time shall come that the salvation of the Lord shall be declared to every nation, kindred, tongue, and people” ([[Mosiah 15:28]]). So the song of the watchmen, which the priests had quoted as good news for themselves, comes back to them as a warning. The note on [[Isa. 52:8]] explains “eye to eye.”
    sources: [isaiah-in-bom]

parallels:
  - ref: Isa. 52:7–10
    note: Abinadi explains verse 7 in verses 14–18 and quotes verses 8–10 in verses 29–31.

sources: [lds-scriptures, sc-knowhy-89, isaiah-in-bom]
