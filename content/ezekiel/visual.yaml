summary: >-
  Ezekiel, a priest among the captives, sees the glory of the Lord leave the
  temple and then return, and sees water flow out from under its threshold to
  bring life to a barren land. The image rests on that returning presence and
  the water it sends out, not on the judgment that came between.
motifs:
  - A stone temple gateway facing east, its tall doors standing open, with a clear stream issuing from beneath its threshold into the light.
  - Seen through the open doors, inside the temple, a raised stand of pale stone and gold. On it rests one sacred scroll made from two. It has two wooden rollers with turned gold ends, one of dark wood and one of light wood, lying side by side, and a single unbroken sheet of parchment is wound onto both, so that the two rolls are plainly one scroll. The rolls lie close together with only a narrow band of blank parchment showing between them, and one golden cord is tied around both. No writing is visible, and the light within falls on it.
  - Fruit trees with full green leaves standing on both banks of the stream.
  - Far downstream, a small, narrow, pale salt lake lying still in a barren desert valley, its cracked white shore just beginning to turn green where the stream reaches it.
composition: >-
  The gateway stands left of center, seen nearly straight on so that the viewer
  looks through its open doors into the temple. The interior is bright and calm,
  and at its center, framed by the doorway, the stand with the one scroll on its two
  rollers is the still point of the picture: honored, kept, plainly sacred, not large.
  The stream comes out from under the threshold below them and runs across the
  foreground, so that the water seems to flow from the place where the scroll
  is kept. Trees line both banks. To the right the land opens to dry desert
  hills and the small, distant salt lake, pale and flat, not an ocean, with no
  sun on the water. No figures, no fire, no ruin; nothing lies on the ground or
  on an outside wall.
alt: Through the open doors of a stone temple gateway, a sacred scroll wound on two rollers, one dark and one light, rests on a stand in the light, and a stream flows from the threshold between fruit trees toward a pale salt lake in a desert valley.
status: proposed
