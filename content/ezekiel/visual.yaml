summary: >-
  Ezekiel, a priest among the captives, sees the glory of the Lord leave the
  temple and then return, and sees water flow out from under its threshold to
  bring life to a barren land. The image rests on that returning presence and
  the water it sends out, not on the judgment that came between.
motifs:
  - A low stone threshold of a temple gateway facing east, its doors open, with a clear stream issuing from beneath it into the light.
  - Two closed scrolls of equal size lying side by side on a stone ledge built into the gatepost at waist height, bound together by a single cord; rolled shut, with no writing visible.
  - Fruit trees with full green leaves standing on both banks of the stream.
  - Far downstream, a small, narrow, pale salt lake lying still in a barren desert valley, its cracked white shore just beginning to turn green where the stream reaches it.
composition: >-
  The open gateway sits left of center on a gentle rise, catching low gold light from
  the east, and the stream runs from its threshold across the foreground. On the
  near gatepost a plain stone ledge holds the two bound scrolls, small but clearly
  seen, lit by the same light. Trees line both banks. The land beyond is dry
  desert hills; the salt lake is small and distant, pale and flat, not an ocean,
  with hazy barren hills on its far side and no sun on the water. The gateway is
  modest and the water leads the eye; no figures, no fire, no ruin, nothing lying
  on the ground.
alt: A stone temple gateway stands open on a rise, two bound scrolls resting on a ledge of its gatepost, with a stream flowing from its threshold between fruit trees toward a pale salt lake in a desert valley.
status: proposed
