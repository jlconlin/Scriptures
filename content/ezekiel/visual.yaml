summary: >-
  Ezekiel, a priest among the captives, sees the glory of the Lord leave the
  temple and then return, joins two sticks into one in his hand, and sees water
  flow out from under the temple's threshold to bring life to a barren land.
  The image rests on what is kept in the house and what flows out of it, not on
  the judgment that came between.
motifs:
  - A stone temple gateway facing east, its tall golden doors standing open, with a clear stream issuing from beneath its threshold.
  - Seen through the open doors, inside the temple, a raised stand of pale stone and gold. On it stands one sacred scroll made from two, its two rollers side by side, one dark and one light, with a single sheet of blank parchment wound onto both and one cord around them.
  - Fruit trees with full green leaves on both banks of the stream.
  - Far downstream, a small, pale salt lake lying still in a barren desert valley, its white shore turning green where the stream reaches it.
composition: >-
  The gateway stands left of center, seen nearly straight on, so that the viewer
  looks through its open doors into a bright, calm interior. Framed by the
  doorway, the stand with the scroll on its two rollers is the still point of
  the picture, not large. The stream comes out from under the threshold below
  it and runs across the foreground, as if from the place where the scroll is
  kept. Trees line both banks. To the right the land opens to dry desert hills
  and the small, distant salt lake. No figures.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The stream flowing from under the threshold** is the river of Ezekiel’s last vision: “waters issued out from under the threshold of the house eastward” ([[Ezek. 47:1]]).'
  - '**The fruit trees on both banks** grow where the river goes: “on this side and on that side, shall grow all trees for meat” ([[Ezek. 47:12]]).'
  - '**The pale salt lake turning green** is the Dead Sea made alive by the river: “the waters shall be healed” ([[Ezek. 47:8]]).'
  - '**The scroll on two rollers, one dark and one light,** is the two sticks joined in Ezekiel’s hand, the stick of Judah and the stick of Joseph made “one stick” ([[Ezek. 37:16–17]]), which Latter-day Saints understand as the Bible and the Book of Mormon.'
  - '**The open golden doors** face east, the way the glory of the Lord returned to the temple: “by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]).'
