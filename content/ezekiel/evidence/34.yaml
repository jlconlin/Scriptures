  - where: 'note 34:16 “Destroy, or watch over?”'
    claim: 'The Greek has “guard” where the Hebrew has “destroy”'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/34.htm'
    quote: 'and will guard the strong, and will feed them with judgment'
  - where: 'note 34:16 “Destroy, or watch over?”'
    claim: 'The Hebrew verb is ashmid, a Hiphil of shamad (H8045), “I will destroy” (scripts/hebrew.mjs ezekiel 34:16)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אַשְׁמִ֖יד'
  - where: 'note 34:16 “Destroy, or watch over?”'
    claim: 'The Septuagint, Syriac and Vulgate read a form of shamar, “keep,” where the Hebrew text has “destroy” (Keil prints the two Hebrew forms)'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/34.htm'
    quote: 'has been changed by the lxx, Syr., and Vulg. into'
  - where: 'note 34:16 “Destroy, or watch over?”'
    claim: 'The other reading rendered in English (Luther’s, as Keil gives it)'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/34.htm'
    quote: 'I will watch over them.'
  - where: 'note 34:16 “Destroy, or watch over?”'
    claim: 'The Hebrew reading is defended: the fat and strong are those of verses 18–19'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/34.htm'
    quote: 'The fat and strong sheep are characterized in Ezekiel 34:18 and Ezekiel 34:19 as those which spoil the food and water of the others.'
  - where: 'note 34:16 “Destroy, or watch over?”'
    claim: 'The reading “watch over” does not agree with “I will feed them with judgment”'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/34.htm'
    quote: 'But this is evidently a mistake, as it fails to harmonize with'
  - where: 'note 34:16 “Destroy, or watch over?”'
    claim: 'Verses 17–21 carry the thought further'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/34.htm'
    quote: 'This thought is carried out still further in Ezekiel 34:17-21, the sheep themselves being directly addressed'
  - where: 'note 34:16 “Destroy, or watch over?”'
    claim: 'A modern translation follows the Hebrew and renders “judgment” as justice'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+34&version=NRSVUE'
    quote: 'but the fat and the strong I will destroy. I will feed them with justice.'

  - where: 'note 34:17 “Judgment inside the flock”'
    claim: 'The Church’s footnote gives the Hebrew as “between sheep and sheep”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'HEB between sheep and sheep; i.e., between one sheep and another.'
  - where: 'note 34:17 “Judgment inside the flock”'
    claim: 'The fat and strong are read as the rich and strong of the nation'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/34.htm'
    quote: 'The allusion, therefore, is to the rich and strong ones of the nation, who oppress the humble and poor, and treat them with severity.'
  - where: 'note 34:17 “Judgment inside the flock”'
    claim: 'The scene is not the dividing of sheep from goats in Matthew 25:32'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/34.htm'
    quote: 'The thought is not that Jehovah will divide the rams and he-goats from the sheep, as some have explained it, from an inappropriate comparison with Matthew 25:32'
  - where: 'note 34:17 “Judgment inside the flock”'
    claim: 'Sheep are separated from sheep, the fat from the lean'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/34.htm'
    quote: 'sheep will be separated from sheep, the fat sheep being placed on one side with the rams and he-goats, and kept apart from the lean'

