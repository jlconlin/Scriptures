    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'רֹעִ֗ים'
  - where: 'note 34:23 “My servant David is the Messiah”'
    claim: '“My servant David” in Ezekiel 34:23–24 refers to the Son of David, the messianic king'
    key: 'seely-messiah'
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'referring to the Son of David, the messianic king'
  - where: 'note 34:23 “My servant David is the Messiah”'
    claim: 'Scripture Helps: not King David but Jesus Christ, his descendant'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'This does not refer to King David, who died about four centuries before Ezekiel’s ministry. Rather, it is a reference to Jesus Christ, the Good Shepherd, who was a descendant of David.'
  - where: 'note 34:23 “My servant David is the Messiah”'
    claim: 'King David died about four centuries before Ezekiel'
    key: 'pike-shepherd'
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Given that King David died about four centuries before Ezekiel prophesied'
  - where: 'note 34:23 “My servant David is the Messiah”'
    claim: 'David, the shepherd who became king, was a flawed type of the Messiah'
    key: 'pike-shepherd'
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'of whom the shepherd-turned-king David was a tragically flawed “type.”'
  - where: 'note 34:23 “My servant David is the Messiah”'
    claim: 'The Church’s footnote on “David” in 34:24 points to Jeremiah 23:5, 30:9 and Hosea 3:5'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'Jer. 23:5 (5–6); 30:9; Hosea 3:5'
  - where: 'note 34:23 “My servant David is the Messiah”'
    claim: 'The Church’s edition of John 10:16 has a footnote on “one” to Ezekiel 37:22'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'Ezek. 37:22'
  - where: 'note 34:23 “My servant David is the Messiah”'
    claim: 'Jesus’s “I am the good shepherd” read as a claim to be Jehovah, the Messiah and King'
    key: 'pike-shepherd'
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Referring to Himself as the Good Shepherd of Israel was an open announcement by Jesus that He was Jehovah, the Messiah, the King of Israel.'

