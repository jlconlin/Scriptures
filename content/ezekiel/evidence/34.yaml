  - where: 'note 34:25 “The words of the blessings in Leviticus 26”'
    claim: 'Leviticus 26:4–13 has the rain in season, the trees and the land’s increase, lying down unafraid, the evil beasts removed, the yoke broken (of Egypt), and “your God … my people”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will give peace in the land, and ye shall lie down, and none shall make you afraid: and I will rid evil beasts out of the land'
  - where: 'note 34:25 “The words of the blessings in Leviticus 26”'
    claim: 'The blessings of Leviticus 26 were promised on condition of faithfulness, and the warnings follow in the same chapter'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'As long as they were faithful, righteous, and committed to the covenant, Moses promised them blessings. The land would be blessed, their enemies would be set aside'
  - where: 'note 34:25 “The words of the blessings in Leviticus 26”'
