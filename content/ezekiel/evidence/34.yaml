    claim: 'The Church’s edition of Luke 19:10 has a footnote to Ezekiel 34:16'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/19?lang=eng'
    quote: 'Ezek. 34:16; 2 Ne. 26:25 (23–29)'
  - where: 'note 34:16 “Verse 4 answered in reverse”'
    claim: 'The Church’s edition of Luke 15:4 has a footnote to Ezekiel 34:16'
    key: 'lds-scriptures'
