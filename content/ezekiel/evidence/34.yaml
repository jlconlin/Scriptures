chapter: 34
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is 33:21: the twelfth year of the captivity, tenth month, when word comes that the city is smitten'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year of the captivity, 1:2), so the twelfth year is about 585 B.C. by count'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'

  - where: 'setting'
    claim: 'A second large deportation came in 586 B.C., after the one of 597 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'Ezekiel was carried away with Jehoiachin (the earlier deportation)'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'Chapters 33–39 are the book’s prophecies of restoration'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(3) 33–39, prophecies of restoration'
  - where: 'setting'
    claim: 'Ezekiel’s oracle against the shepherds is in a tone very similar to Jeremiah 23:1–8'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'In a tone very similar to Jeremiah’s (see Jeremiah 23:1–8), Ezekiel condemned the pastors, or shepherds'
  - where: 'setting'
    claim: 'Jeremiah 23:1–6 has a woe on the pastors, a gathering of the flock, and a king raised to David, and no judgment among the sheep'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'And I will gather the remnant of my flock out of all countries whither I have driven them, and will bring them again to their folds'
  - where: 'setting'
    claim: 'The promise of one shepherd, David, returns at 37:24'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'And David my servant shall be king over them; and they all shall have one shepherd'
  - where: 'setting'
    claim: 'In John 10 Jesus calls Himself the Good Shepherd'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'I am the good shepherd: the good shepherd giveth his life for the sheep.'

  - where: 'thread'
    claim: '“Shepherd” and “feed” are one Hebrew root (H7462), six times in 34:2; it occurs 31 times in chapter 34 and 32 times in the book (scripts/hebrew.mjs ezekiel --word 7462: 32 occurrences in 16 verses, 15 of them in chapter 34)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'רֹעִ֣ים'
  - where: 'thread'
    claim: '“My flock” or “my sheep” (tsoni, H6629 with the suffix “my”) comes fifteen times in chapter 34 (scripts/hebrew.mjs ezekiel --word 6629; verses 6, 8, 10, 11, 12, 15, 17, 19, 22, 31)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'צֹאנִ֣/י'
  - where: 'thread'
    claim: 'In chapter 6 the refrain “ye shall know that I am the LORD” follows judgment'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'And the slain shall fall in the midst of you, and ye shall know that I am the Lord.'

  - where: 'note 34:2 “The shepherds are Israel’s rulers”'
    claim: 'The shepherd was one of the commonest metaphors for kings in the ancient Near East'
    key: 'seely-messiah'
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'One of the most common metaphors for kings in the ancient Near East was the shepherd.'
  - where: 'note 34:2 “The shepherds are Israel’s rulers”'
    claim: 'The title carried duties of care; the article applies Ezekiel 34:2–4 to this'
    key: 'seely-messiah'
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'Kings were called to shepherd their people, to care for them, to reach out to the poor and oppressed, to offer release from prison.'
  - where: 'note 34:2 “The shepherds are Israel’s rulers”'
    claim: 'Nebuchadnezzar II claimed the shepherdship of his country and people from Marduk'
    key: 'pike-shepherd'
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Nebuchadnezzar II (Babylonia; 604–562 BC): “Marduk . . . gave me the shepherdship of the country and the people,”'
  - where: 'note 34:2 “The shepherds are Israel’s rulers”'
    claim: 'The Student Manual takes the shepherds as the religious leaders of Ezekiel’s day'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'the religious leaders of Ezekiel’s day'
  - where: 'note 34:2 “The shepherds are Israel’s rulers”'
    claim: 'Scripture Helps (endnote 20): likely the spiritual leaders and also the kings'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'This was likely referring not only to Israel’s spiritual leaders but also to its kings, who were often compared to shepherds in ancient Near Eastern culture'

  - where: 'note 34:4 “Ruled as Egypt ruled”'
    claim: 'The Hebrew word is perek (H6531), the last word of 34:4; it occurs only here in Ezekiel (scripts/hebrew.mjs ezekiel --word 6531)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וּ/בְ/פָֽרֶךְ'
  - where: 'note 34:4 “Ruled as Egypt ruled”'
    claim: 'The word means harshness, severity'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6531.htm'
    quote: 'noun [masculine] harshness, severity'
  - where: 'note 34:4 “Ruled as Egypt ruled”'
    claim: 'The lexicon lists it in Leviticus 25, Ezekiel 34:4 and Exodus 1:13–14; in Leviticus and Ezekiel always with the verb “rule”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6531.htm'
    quote: 'rule harshly); Exodus 1:13'
  - where: 'note 34:4 “Ruled as Egypt ruled”'
    claim: 'The King James Version translates the word “rigour” in Leviticus 25:46'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'over your brethren the children of Israel, ye shall not rule one over another with rigour'
  - where: 'note 34:4 “Ruled as Egypt ruled”'
    claim: 'A modern translation of the clause'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+34&version=NRSVUE'
    quote: 'but with force and harshness you have ruled them'
  - where: 'note 34:4 “Ruled as Egypt ruled”'
    claim: '“The bands of your yoke” is said in Leviticus 26:13 of the deliverance from Egypt'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'which brought you forth out of the land of Egypt, that ye should not be their bondmen; and I have broken the bands of your yoke'

  - where: 'note 34:11 “One verb for searching and for requiring”'
    claim: 'The verb darash (H1875) stands in 34:6, 34:8, 34:10 and 34:11 (scripts/hebrew.mjs ezekiel 34:6, 34:8, 34:10, 34:11)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְֽ/דָרַשְׁתִּ֧י'
  - where: 'note 34:11 “One verb for searching and for requiring”'
    claim: 'The lexicon lists 34:6, 8, 11 under seeking with the idea of demanding, with lost sheep as object'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1875.htm'
