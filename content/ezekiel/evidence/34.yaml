  - where: 'note 34:11 “One verb for searching and for requiring”'
    claim: 'Those verses are the ones listed there'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: 'with accusative lost sheep Deuteronomy 22:2; Ezekiel 34:6,8,11'
  - where: 'note 34:11 “One verb for searching and for requiring”'
    claim: 'The lexicon lists 34:10 under “exact, often with collateral idea of avenging”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: 'exact, often with collateral idea of avenging'
  - where: 'note 34:11 “One verb for searching and for requiring”'
    claim: 'In the same sense it lists Ezekiel 33:6, the watchman'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: 'Genesis 9:5 (P) Ezekiel 33:6'
  - where: 'note 34:11 “One verb for searching and for requiring”'
    claim: 'Ezekiel 33:6 has darash (H1875) for “require” (scripts/hebrew.mjs ezekiel 33:6)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אֶדְרֹֽשׁ'
  - where: 'note 34:11 “One verb for searching and for requiring”'
    claim: 'The watchman’s sentence in 33:6'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'but his blood will I require at the watchman’s hand'
  - where: 'note 34:11 “One verb for searching and for requiring”'
    claim: 'A modern translation of “I, even I”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+34&version=NRSVUE'
    quote: 'I myself will search for my sheep'

  - where: 'note 34:13 “Gathered in the last days”'
    claim: 'The captivity ended with Cyrus’s decree in 536 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'The captivity was brought to a close by the decree of Cyrus in 536 B.C.'
  - where: 'note 34:13 “Gathered in the last days”'
    claim: 'Only part of the people returned'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'Only part of the people availed themselves of this permission; the rest remained behind and formed the dispersion.'
  - where: 'note 34:13 “Gathered in the last days”'
    claim: 'The Church’s chapter heading places the gathering in the last days'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'In the last days, the Lord will gather the lost sheep of Israel'
  - where: 'note 34:13 “Gathered in the last days”'
    claim: 'The Bible Dictionary on Ezekiel and the millennial reign'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'spoke much about the future restoration of Israel and the glory of the millennial reign of the Lord'
  - where: 'note 34:13 “Gathered in the last days”'
    claim: 'The prophecies of Ezekiel 34 and 37 will be most fully realized in the Millennium'
    key: 'pike-shepherd'
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'These prophecies will be most fully realized during the Millennium, when the kingdom of God is fully established on this earth.'
  - where: 'note 34:13 “Gathered in the last days”'
    claim: 'Ezekiel 37:21 repeats the promise, and the one king and shepherd follow in 37:22–24'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'and will gather them on every side, and bring them into their own land'

  - where: 'note 34:16 “Verse 4 answered in reverse”'
    claim: 'The Hebrew words for the lost (H6), the driven away (H5080), the broken (H7665) and the sick (H2470) and the verbs seek (H1245), bring back (H7725), bind (H2280), strengthen (H2388) stand in both 34:4 and 34:16, in opposite order (scripts/hebrew.mjs ezekiel 34:2-4 and 34:16-17)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הָ/אֹבֶ֤דֶת'
