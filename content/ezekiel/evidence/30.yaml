chapter: 30
claims:
  - where: 'when'
    claim: 'The second oracle is dated to the eleventh year, first month, seventh day'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/30?lang=eng'
    quote: 'And it came to pass in the eleventh year, in the first month, in the seventh day of the month'
  - where: 'when'
    claim: 'The nearest dated heading above verses 1–19 is 29:17, the twenty-seventh year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'And it came to pass in the seven and twentieth year, in the first month, in the first day of the month'
  - where: 'when'
    claim: 'The heading of verses 1–19 has no date, and the oracle need not belong to the twenty-seventh year'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/30.htm'
    quote: 'The heading does not contain any chronological information; and the contents furnish no definite criteria for determining with precision the date of the prophecy.'
  - where: 'when'
    claim: 'Ezekiel’s ministry began about 592 B.C. (the fifth year), so the eleventh year is about 586 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'Chapters 25–32 are the prophecies against Israel’s enemies'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(2) 25–32, prophecies against Israel’s enemies'
  - where: 'setting'
    claim: 'The nations of chapters 25–32, in order, with Egypt last'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'These eight chapters contain prophecies against several foreign nations: Ammon, Moab, Edom, Philistia, Tyre, Sidon, and Egypt.'
  - where: 'setting'
    claim: 'The first Egypt oracle is dated to the tenth year, tenth month'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'In the tenth year, in the tenth month, in the twelfth day of the month'
  - where: 'setting'
    claim: 'The date of verses 1–19 cannot be fixed from the heading or the contents'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/30.htm'
    quote: 'no definite criteria for determining with precision the date of the prophecy'
  - where: 'setting'
    claim: 'Some put the undated oracle with that of the tenth year, others with that of the twenty-seventh'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/30.htm'
    quote: 'Jerome assigns this oracle to the same period as the prophecy in Ezekiel 29:1-16, whilst others connect it more closely with Ezekiel 29:17-21'
  - where: 'setting'
    claim: 'The siege began in the ninth year, tenth month'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'the king of Babylon set himself against Jerusalem this same day'
  - where: 'setting'
    claim: 'The second oracle falls in the second year of the siege'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/30.htm'
    quote: 'this short word of threatening against Egypt falls in the second year of the siege of Jerusalem by the Chaldeans'
  - where: 'setting'
    claim: 'It comes about three months after the oracle of 29:1'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/30.htm'
    quote: 'the prophecy before us was separated from the former by an interval of three months'
  - where: 'setting'
    claim: 'Jeremiah dates the breach of the wall to the fourth month of Zedekiah’s eleventh year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'And in the eleventh year of Zedekiah, in the fourth month, the ninth day of the month, the city was broken up.'
  - where: 'setting'
    claim: 'The Pharaoh of these chapters is Hophra, who sent an army to help Zedekiah'
    key: 'bd-pharaoh'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: '(8) Pharaoh Hophra, who sent an army to the assistance of Zedekiah (Jer. 37:5–11; 43:9; Ezek. 17:17; 29:2–3; 30:21–25; 31:2, 18; 32:2, 31–32)'
  - where: 'thread'
    claim: 'The previous chapter calls Egypt a staff of reed to the house of Israel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'because they have been a staff of reed to the house of Israel'
  - where: 'note 30:2 “Woe worth the day”'
    claim: '“Worth” is an old verb surviving only in this phrase, meaning “be”'
    key: 'webster-1828'
    url: 'https://webstersdictionary1828.com/Dictionary/worth'
    quote: 'This verb is now used only in the phrases, wo worth the day, wo worth the man, etc., in which the verb is in the imperative mode, and the noun in the dative; wo be to the day.'
