    claim: 'The covenant warning in Leviticus uses the word'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And they that are left of you shall pine away in their iniquity in your enemies’ lands'
