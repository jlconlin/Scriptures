    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'In chapter 33, Ezekiel gives one of the most profound and clear expositions of why judgments come upon a people.'
  - where: 'note 33:11 “An oath that He does not want their death”'
    claim: 'God takes no pleasure in the judgments'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
