chapter: 33
claims:
  - where: 'when'
    claim: 'The chapter’s date is the twelfth year, tenth month, fifth day of the captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'And it came to pass in the twelfth year of our captivity, in the tenth month, in the fifth day of the month'
  - where: 'when'
    claim: '“Our captivity” in 33:21 is the same count as the captivity of the king in 1:2'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/33.htm'
    quote: 'after our being led away (Ezekiel 33:21 and Ezekiel 40:1), coincides with'
  - where: 'when'
    claim: 'The captivity began in about 597 B.C., so its twelfth year is about 585 B.C.'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC'
  - where: 'setting'
    claim: 'The Bible Dictionary begins the prophecies of restoration at chapter 33'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(1) 1–24, prophecies of judgment against Jerusalem and the nation; (2) 25–32, prophecies against Israel’s enemies; (3) 33–39, prophecies of restoration'
  - where: 'setting'
    claim: 'Jeremiah dates the breach of the city to the eleventh year of Zedekiah, the fourth month'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'And in the eleventh year of Zedekiah, in the fourth month, the ninth day of the month, the city was broken up.'
  - where: 'setting'
    claim: 'The destruction of the city took place in the fifth month of the eleventh year'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/33.htm'
    quote: 'the destruction of Jerusalem, which took place in the fifth month of the eleventh year'
  - where: 'setting'
    claim: 'The fifth month is when Nebuzar-adan came to Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'Now in the fifth month, in the tenth day of the month, which was the nineteenth year of Nebuchadrezzar king of Babylon, came Nebuzar-adan'
  - where: 'setting'
    claim: 'Verses 1–20 have been read as given on the evening before the fugitive arrived'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/33.htm'
    quote: 'coincided in point of time with the working of God upon the prophet on the evening preceding the arrival of the fugitive'
  - where: 'setting'
    claim: 'They are placed first, on that reading, as a renewal of the call'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/33.htm'
    quote: 'it is placed before this historical statement because it was a renewal of his call'
  - where: 'setting'
    claim: 'Verses 2–9 return to the charge of 3:17–21'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/33.htm'
    quote: 'is essentially a return to the word in Ezekiel 3:17-21'
  - where: 'setting'
    claim: 'Verses 12–20 are taken from 18:20–32'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/33.htm'
    quote: 'more precisely from Ezekiel 18:20-32 of that chapter'
  - where: 'setting'
    claim: 'The people addressed in verses 23–29 are those left in Judah; verses 30–33 concern the exiles'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/33.htm'
    quote: 'Ezekiel 33:30-33 treat of the Israelites by the Chaboras'
  - where: 'thread'
    claim: 'The last verse repeats the sentence of the call (2:5), as the Church’s footnote notes'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'Ezek. 2:5'
  - where: 'thread'
    claim: 'At the call Ezekiel was told they would know a prophet had been among them'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/2?lang=eng'
    quote: 'yet shall know that there hath been a prophet among them'
  - where: 'section 1 plain'
    claim: '“A man of their coasts” is a man from among them'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2033&version=ESV'
    quote: 'take a man from among them, and make him their'
  - where: 'section 3 plain'
    claim: 'The complaint of verse 10 and the oath of verse 11, as the Church’s edition has them'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'If our transgressions and our sins be upon us, and we pine away in them, how should we then live?'
  - where: 'note 33:2 “The watchman’s charge, given a second time”'
    claim: 'Verses 7–9 give the watchman’s charge to Ezekiel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'So thou, O son of man, I have set thee a watchman unto the house of Israel'
  - where: 'note 33:2 “The watchman’s charge, given a second time”'
    claim: 'A modern translation renders “a man of their coasts” as a man from among them'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2033&version=ESV'
    quote: 'the people of the land take a man from among them'
  - where: 'note 33:3 “The trumpet”'
    claim: 'The Hebrew word for trumpet in 33:3 is shofar (H7782)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בַּ/שּׁוֹפָ֖ר'
  - where: 'note 33:3 “The trumpet”'
    claim: 'A shofar is a curved animal horn'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7782.htm'
    quote: 'is a curved horn, as of cow or ram'
  - where: 'note 33:3 “The trumpet”'
    claim: 'It was used mostly in war'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7782.htm'
    quote: 'horn, mostly as used in war'
  - where: 'note 33:3 “The trumpet”'
    claim: 'Jeremiah has the watchmen, the trumpet, and the hearers’ refusal'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/6?lang=eng'
    quote: 'Also I set watchmen over you, saying, Hearken to the sound of the trumpet. But they said, We will not hearken.'
  - where: 'note 33:10 “Pining away: a word from the covenant warnings”'
    claim: 'The verb in 33:10 is maqaq (H4743), a Niphal participle'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נְמַקִּ֖ים'
  - where: 'note 33:10 “Pining away: a word from the covenant warnings”'
    claim: 'The verb means decay, rot, fester, and figuratively pine away'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4743.htm'
    quote: 'verb decay, rot, fester, figurative pine away'
  - where: 'note 33:10 “Pining away: a word from the covenant warnings”'
    claim: 'Its use for pining away as punishment for iniquity is in four verses'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4743.htm'
    quote: 'as punishment for, iniquity Ezekiel 4:17; Ezekiel 24:23; Ezekiel 33:10; Leviticus 26:39'
  - where: 'note 33:10 “Pining away: a word from the covenant warnings”'
    claim: 'The form in 33:10 is a participle'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4743.htm'
    quote: 'Participle plural'
  - where: 'note 33:10 “Pining away: a word from the covenant warnings”'
    claim: 'One modern translation: rot away'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2033&version=ESV'
    quote: 'we rot away because of them'
  - where: 'note 33:10 “Pining away: a word from the covenant warnings”'
    claim: 'Another: waste away'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2033&version=NRSVUE'
    quote: 'we waste away because of them'
