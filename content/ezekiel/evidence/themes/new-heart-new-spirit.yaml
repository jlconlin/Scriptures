page: new-heart-new-spirit
claims:
  - where: opening
    claim: 'The LORD of the Old Testament is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Given”'
    claim: 'The recovery is for the Lord''s reasons, not earned by Israel (36:32)'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'will be done for the Lord''s reasons, not because Israel has earned it (see v. 32).'
  - where: 'section “Given”'
    claim: 'Verses 26–27 read as conversion and receiving the Lord''s Spirit'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'They are to be converted to the Lord and receive His Spirit (see vv. 26–27).'
  - where: 'section “Given”'
    claim: 'Connection made by this page: Ezek. 18:31 “make” and 36:27 “cause” are the same Hebrew verb (asah), the ordinary verb for do or make; 18:31 text'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וַ/עֲשׂ֥וּ לָ/כֶ֛ם לֵ֥ב חָדָ֖שׁ וְ/ר֣וּחַ חֲדָשָׁ֑ה'
  - where: 'section “Given”'
    claim: 'Connection made by this page: Ezek. 36:27 “cause you to walk in my statutes” uses the same verb (asah), which 36:27 uses a second time with the people as subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/עָשִׂ֗יתִי אֵ֤ת אֲשֶׁר בְּ/חֻקַּ/י֙ תֵּלֵ֔כוּ'
  - where: 'section “Poured out”'
    claim: 'Connection made by this page: shafakh “pour” of the Lord''s fury at 36:18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וָ/אֶשְׁפֹּ֤ךְ'
  - where: 'section “Poured out”'
    claim: 'Connection made by this page: shafakh “pour” of the Lord''s spirit at 39:29 (the only use of the verb with the spirit in Ezekiel)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שָׁפַ֤כְתִּי'
  - where: 'section “Given”'
    claim: 'Connection made by this page: the command of 18:31 set beside the gift of 36:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/18?lang=eng'
    quote: 'make you a new heart and a new spirit'
  - where: 'section “Given”'
    claim: 'Connection made by this page: 36:27 “cause you to walk in my statutes”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'cause you to walk in my statutes'
  - where: 'section “Poured out”'
    claim: 'Connection made by this page: 36:18 “I poured my fury upon them” set beside 39:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'Wherefore I poured my fury upon them'
  - where: 'section “Poured out”'
    claim: 'Connection made by this page: 39:29 “I have poured out my spirit”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/39?lang=eng'
    quote: 'I have poured out my spirit upon the house of Israel'
  - where: 'section “Promised, then commanded”'
    claim: 'The covenant sentence of Ezek. 11:20 is also in Jer. 31:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'and will be their God, and they shall be my people'
  - where: 'section “Jesus Christ”'
    claim: 'Ezekiel''s stony heart as conversion (11:19–20), and King Benjamin''s people (endnote)'
    key: christofferson-converted
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2004/04/when-thou-art-converted?lang=eng'
    quote: 'Surely this is what happened to the people of King Benjamin when they said their hearts had been changed'
  - where: 'section “Jesus Christ”'
    claim: 'The change comes through the Atonement of Christ; quotes Ezek. 36:26'
    key: renlund-mighty-change
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/10/preserving-the-hearts-mighty-change?lang=eng'
    quote: 'Through the Atonement of Christ and by obedience to the laws and ordinances of the gospel, we undergo this ultimate operation, this spiritual change of heart.'
  - where: 'section “Given”'
    claim: '36:27 ends with the verb again, the people as subject (“do them”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וַ/עֲשִׂיתֶֽם'
  - where: 'section “Given”'
    claim: 'The future Israel must be spiritually worthy and submit to the Lord’s will'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'The Israel of the future must be spiritually worthy and must submit themselves to the Lord’s will.'
  - where: 'section “Poured out”'
    claim: 'shafakh is also used of shedding blood in 36:18 (second verb)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שָׁפְכ֣וּ'
  - where: 'section “Poured out”'
    claim: '36:18 speaks of the blood they had shed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'for the blood that they had shed upon the land'
  - where: 'section “Poured out”'
    claim: 'shafakh is used of casting a siege mound (4:2)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/שָׁפַכְתָּ֥'
  - where: 'section “Poured out”'
    claim: '4:2 “cast a mount against it”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'cast a mount against it'
  - where: 'section “Poured out”'
    claim: 'The Church’s footnote 29b on “poured” points to Zechariah 12:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/39?lang=eng'
    quote: 'Zech. 12:10'
  - where: 'section “Poured out”'
    claim: 'Zech. 12:10 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/12?lang=eng'
    quote: 'the spirit of grace and of supplications: and they shall look upon me whom they have pierced'
  - where: 'section “To the hopeless”'
    claim: 'The speakers are the whole house of Israel (37:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'these bones are the whole house of Israel'
  - where: 'section “To the hopeless”'
    claim: 'The Church reads Ezekiel’s vision as the Resurrection (D&C 138:43)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138?lang=eng'
    quote: 'Ezekiel, who was shown in vision the great valley of dry bones, which were to be clothed upon with flesh, to come forth again in the resurrection of the dead'
  - where: 'section “Jesus Christ”'
    claim: 'Mosiah 5:7: hearts changed through faith on his name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'your hearts are changed through faith on his name'
