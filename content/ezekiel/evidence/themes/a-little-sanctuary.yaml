page: a-little-sanctuary
claims:
  - where: 'section “Among the captives”'
    claim: 'The vision gave assurance that the Lord could still be with the exiled people'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'provided assurance that the Lord could still be with the people, even though they had been exiled to Babylon.'
  - where: 'section “Among the captives”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Get you far from the LORD”'
    claim: '“Get you far” (11:15) and “cast far off” (11:16) are one Hebrew root, H7368'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'רַֽחֲקוּ֙'
  - where: 'section “Get you far from the LORD”'
    claim: '“Cast far off” (11:16) is the same root, H7368'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הִרְחַקְתִּים֙'
  - where: 'section “Get you far from the LORD”'
    claim: 'Connection made by this page: “go far off” (8:6) is the same Hebrew root, H7368, as “get you far” and “cast far off” (11:15–16)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'רָֽחֳקָה֙'
  - where: 'section “Get you far from the LORD”'
    claim: 'The Hebrew verb in 11:16 is a past narrative form'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וָאֱהִ֤י'
  - where: 'section “Get you far from the LORD”'
    claim: 'NRSVUE reads “for a little while,” margin “a little sanctuary”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2011%3A3%2C15-16%2C19&version=NRSVUE'
    quote: 'yet I have been a sanctuary to them for a little while in the countries where they have gone'
  - where: 'section “For evermore”'
    claim: 'The Church reads Ezek. 37:26–28 of a temple in the reunification of Israel'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Ezekiel prophesied in 37:26–28 about a holy sanctuary or temple that would be part of the great reunification of Israel.'
  - where: 'section “Jesus Christ”'
    claim: 'At Ezek. 48:35 the temple is said to be built as a symbol that the Lord is with His people'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'The temple will be built as a symbol to Israel that the Lord is with His people.'
  - where: 'section “For evermore”'
    claim: 'Presence not limited to one place does not make temples unnecessary'
    key: sc-knowhy-719
    url: 'https://scripturecentral.org/knowhy/how-did-jacobs-and-ezekiels-peoples-each-respond-to-exile'
    quote: 'However, Ezekiel does not imply that because God’s presence is not limited to one location, temples or promised lands are unnecessary or simply symbolic.'
  - where: 'section “Jesus Christ”'
    claim: 'Isa. 8:14 “for a sanctuary” uses the same Hebrew word, miqdash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'מִקְדָּ֑שׁ'
  - where: 'section “Jesus Christ”'
    claim: 'The footnote at Isa. 8:14 glosses “sanctuary” and points to Ezek. 11:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/8?lang=eng'
    quote: 'IE security for those who trust Him, but dismay and suffering for unbelievers. Ezek. 11:16 (15–21).'
  - where: 'section “Jesus Christ”'
    claim: 'The Isaiah 8 chapter heading names Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/8?lang=eng'
    quote: 'Christ will be as a stone of stumbling and a rock of offense'
  - where: 'section “Jesus Christ”'
    claim: 'JST Ezek. 48:35 footnote joins the city’s name to Rev. 21:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'and the name of the city from that day shall be called, Holy; for the Lord shall be there. Rev. 21:3.'
  - where: 'section “Jesus Christ”'
    claim: 'Connection made by this page: Ezek. 11:16 (“yet will I be to them as a little sanctuary”) set beside Rev. 21:22, where the Lord God Almighty and the Lamb are the temple; in both the Lord Himself is spoken of as the sanctuary or temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/21?lang=eng'
    quote: 'And I saw no temple therein: for the Lord God Almighty and the Lamb are the temple of it.'
  - where: opening
    claim: 'Connection made by this page: the promise of 11:16 (“a little sanctuary”) and that of 37:26 (“my sanctuary in the midst of them”) share the word “sanctuary” (miqdash, H4720)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'will set my sanctuary in the midst of them for evermore'
  - where: 'section “The house lost, the Lord with them”'
    claim: 'The Lord says of the gathered flock that they shall know He is with them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'Thus shall they know that I the LORD their God am with them'
