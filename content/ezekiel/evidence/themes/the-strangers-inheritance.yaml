  - where: 'section “The law”'
    claim: 'A stranger is a non-Israelite resident with permission; the law’s provisions secured justice'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities. There were various provisions in the law with regard to the treatment of strangers, all of which were intended to secure for them justice and fair treatment'
  - where: 'section “Wronged”'
    claim: 'The lexicon lists Ezekiel 22:7 and 22:29 under the charge that the ger has been oppressed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1616.htm'
    quote: 'charge that גֵּר has been oppressed Ezekiel 22:7; Malachi 3:5 (both "" id.); also Ezekiel 22:29'
  - where: 'section “A different matter”'
    claim: 'Keil: the law let foreigners living in Israel offer sacrifice; the apparent discrepancy vanishes with “uncircumcised in heart and flesh,” godless heathen'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'The offering of sacrifice in the temple of Jehovah is not only permitted in the Mosaic law to foreigners living in Israel, but to some extent prescribed'
  - where: 'section “A different matter”'
    claim: 'Keil: the apparent discrepancy vanishes with “uncircumcised in heart and flesh,” godless heathen'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'The apparent discrepancy vanishes, if we consider the more precise definition of בּני , viz., "uncircumcised in heart and flesh." Their being uncircumcised in heart is placed first, for the purpose of characterizing the foreigners as godless heathen'
  - where: 'section “Given an inheritance”'
    claim: '“As born in the country” in 47:22 is ezrach (H249), the word in Lev. 19:34'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כְּ/אֶזְרָח֙'
  - where: 'section “Given an inheritance”'
    claim: 'Lev. 19:34 has the same word, ezrach (H249)'
    key: bdb
    url: 'https://biblehub.com/hebrew/249.htm'
    quote: 'Numbers 15:29 (P), compare Ezekiel 47:22; אֶזְרַח הָאָרֶץ Exodus 12:19,48; Numbers 9:14 (all P); מִכֶּם ׳א Leviticus 19:34'
  - where: 'section “Given an inheritance”'
    claim: 'One commentator observes strangers were never allowed an inheritance in the land'
    key: gill-exposition
    url: 'https://biblehub.com/commentaries/gill/ezekiel/47.htm'
    quote: 'never were allowed to have any inheritance in the land'
  - where: 'section “Given an inheritance”'
    claim: 'The Church’s manual reads 47:22–23 of converts not of blood Israel'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Undoubtedly there will be converts who are not part of blood Israel who will receive an inheritance because of their devotion to the gospel.'
  - where: 'section “Given an inheritance”'
    claim: 'The manual: these strangers may be some of the gentile peoples who will accept the gospel in the last days'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'These strangers may be some of the gentile peoples who will accept the gospel in the last days.'
  - where: 'section “Given an inheritance”'
    claim: 'Connection made by this page: 22:7, 22:29 and 47:22–23 set beside each other, joined by the same word ger (22:29 and 47:23 quoted)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/47?lang=eng'
    quote: 'in what tribe the stranger sojourneth, there shall ye give him his inheritance'
  - where: 'section “Jesus Christ”'
    claim: 'The LORD is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ'
  - where: 'section “Jesus Christ”'
    claim: 'An older commentary calls Eph. 3:6 the best commentary on 47:22'
    key: gill-exposition
    url: 'https://biblehub.com/commentaries/gill/ezekiel/47.htm'
    quote: 'Ephesians 3:6, is the best commentary on this passage'
  - where: 'section “Jesus Christ”'
    claim: 'Gill: inheritance in a literal sense never granted; the passage respects Gospel times'
    key: gill-exposition
    url: 'https://biblehub.com/commentaries/gill/ezekiel/47.htm'
    quote: 'what in a literal sense was never granted'
  - where: 'section “Jesus Christ”'
    claim: 'Gill: this respects Gospel times'
    key: gill-exposition
    url: 'https://biblehub.com/commentaries/gill/ezekiel/47.htm'
    quote: 'but this respects Gospel times'
  - where: 'section “Jesus Christ”'
    claim: 'Another older commentary cites Eph. 3:6 and others for the strangers’ privileges not being less than Israel’s'
    key: jfb-ezekiel
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/47.htm'
    quote: 'spiritually their privileges are not to be less than those of Israel (Ro 10:12; Ga 3:28; Eph 3:6'
  - where: 'section “Jesus Christ”'
    claim: 'Connection made by this page: Ezek. 47:22 set beside Eph. 2:12, 13, 19 (strangers made nigh, fellowcitizens), English words only'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/2?lang=eng'
    quote: 'ye are no more strangers and foreigners, but fellowcitizens with the saints'
  - where: 'section “Jesus Christ”'
    claim: 'Eph. 3:6 continues: partakers of his promise in Christ by the gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/3?lang=eng'
    quote: 'That the Gentiles should be fellowheirs, and of the same body, and partakers of his promise in Christ by the gospel'
