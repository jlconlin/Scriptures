page: stand-in-the-gap
claims:
  - where: opening
    claim: 'Moses stood before the Lord in the breach (Ps. 106:23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'Therefore he said that he would destroy them, had not Moses his chosen stood before him in the breach, to turn away his wrath, lest he should destroy them.'
  - where: opening
    claim: 'The figure, used in Ezek. 13:5 and 22:30 and compared with Ps. 106:23, means averting calamity by instruction and intercession'
    key: bdb
    url: 'https://biblehub.com/hebrew/6556.htm'
    quote: 'figurative of effect to avert calamity, עָלָה בַּמְּרָצוֺת Ezekiel 13:5 ("" גָּדַר), עָמַד בַּמֶּרֶץ Ezekiel 22:30 ("" id.), compare Psalm 106:23, by instruction and (especially) intercession.'
  - where: 'section “The prophet, the prophets, the righteous”'
    claim: 'Ezekiel’s pleas at 9:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'that I fell upon my face, and cried, and said, Ah Lord GOD! wilt thou destroy all the residue of Israel in thy pouring out of thy fury upon Jerusalem?'
  - where: 'section “The prophet, the prophets, the righteous”'
    claim: 'Ezekiel’s plea at 11:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'Then fell I down upon my face, and cried with a loud voice, and said, Ah Lord GOD! wilt thou make a full end of the remnant of Israel?'
  - where: 'section “The prophet, the prophets, the righteous”'
    claim: 'The Church edition glosses “gaps” in 13:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/13?lang=eng'
    quote: 'IE breaks in the wall.'
  - where: 'section “The prophet, the prophets, the righteous”'
    claim: 'Noah, Daniel and Job would deliver only themselves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'Though these three men, Noah, Daniel, and Job, were in it, they should deliver but their own souls by their righteousness, saith the Lord GOD.'
  - where: 'section “No man found”'
    claim: 'Ezek. 22:30 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'And I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none.'
  - where: 'section “No man found”'
    claim: 'The root perets (gap) in 22:30, as in 13:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בַּ/פֶּ֧רֶץ'
  - where: 'section “No man found”'
    claim: 'The same root perets in 13:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בַּ/פְּרָצ֔וֹת'
  - where: 'section ““I will seek””'
    claim: 'baqash in 22:30'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אֲבַקֵּ֣שׁ'
  - where: 'section ““I will seek””'
    claim: 'baqash in 34:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מְבַקֵּֽשׁ'
  - where: 'section ““I will seek””'
    claim: 'Connection made by this page: the verb of 22:30 “I sought” is the verb of 34:6 “seek after”, 34:4 and 34:16 “I will seek”; one Hebrew root (baqash)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אֲבַקֵּשׁ֙'
  - where: 'section ““I will seek””'
    claim: 'Connection made by this page: 34:6 and 34:16, English words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'and none did search or seek after them.'
  - where: 'section ““I will seek””'
    claim: 'Ezek. 34:16 “I will seek that which was lost”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'I will seek that which was lost, and bring again that which was driven away, and will bind up that which was broken'
  - where: 'section “The intercessor”'
    claim: 'The LORD of Ezekiel is understood to be the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ'
  - where: 'section “The intercessor”'
    claim: 'Isa. 59:16 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/59?lang=eng'
    quote: 'And he saw that there was no man, and wondered that there was no intercessor: therefore his arm brought salvation unto him'
  - where: 'section “The intercessor”'
    claim: 'Isa. 59 chapter heading names the Messiah as intercessor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/59?lang=eng'
    quote: 'The Messiah will intercede, come to Zion, and redeem the repentant.'
  - where: 'section “The intercessor”'
    claim: 'Footnote 16b on “intercessor” gives Heb. 7:25 and D&C 45:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/59?lang=eng'
    quote: 'Jer. 27:18; Heb. 7:25 (25–26); D&C 45:3 (3–5).'
  - where: 'section “The intercessor”'
    claim: 'Isaiah’s “intercessor” is a different Hebrew word (mapgia) from Ezekiel’s gap words'
    key: bdb
    url: 'https://biblehub.com/hebrew/6293.htm'
    quote: 'Participle מַפְגִּיעַ Isaiah 59:16 one interposing.'
  - where: 'section “The intercessor”'
    claim: 'Prophetic intercession has been read as typological for the role of Jesus'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'understands prophetic intercession as typological for the role of Jesus.'
  - where: 'section “The intercessor”'
    claim: 'Connection made by this page: Ezek. 22:30 set beside Mosiah 15:9, English words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/15?lang=eng'
    quote: 'standing betwixt them and justice'
  - where: opening
    claim: 'These verses have been listed together as texts of prophetic intercession'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Other biblical texts involving prophetic intercession include'
  - where: opening
    claim: 'Ezek. 9:8; 11:13; 13:5; 14:14, 20; 22:30 are in that list'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'Ezekiel 9:8; 11:13; 13:5; 14:14, 20; 22:30'
  - where: 'section “The prophet, the prophets, the righteous”'
    claim: 'The first plea is answered with the reason for the judgment (9:9–10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'The iniquity of the house of Israel and Judah is exceeding great, and the land is full of blood'
  - where: 'section “The prophet, the prophets, the righteous”'
    claim: 'The second plea is answered with a promise (11:16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'yet will I be to them as a little sanctuary in the countries where they shall come.'
  - where: 'section “The prophet, the prophets, the righteous”'
    claim: 'Ezek. 14:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'they shall deliver neither sons nor daughters'
  - where: 'section “No man found”'
    claim: 'The root gader (hedge) in 22:30'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'גָּדֵר֩'
  - where: 'section “No man found”'
    claim: 'The root gader (hedge) in 13:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'גָדֵ֖ר'
  - where: 'section ““I will seek””'
    claim: 'baqash in 34:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בִקַּשְׁתֶּ֑ם'
  - where: 'section ““I will seek””'
    claim: 'baqash is in ten verses of Ezekiel (3:18, 3:20, 7:25, 7:26, 22:30, 26:21, 33:8, 34:4, 34:6, 34:16); in 3:18, 3:20, 33:8 “his blood will I require”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אֲבַקֵּֽשׁ'
  - where: 'section ““I will seek””'
    claim: 'Ezek. 34:4 “neither have ye sought that which was lost”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'neither have ye sought that which was lost'
  - where: 'section “The intercessor”'
    claim: 'Connection made by this page: Ezek. 22:30 “I found none” set beside Isa. 59:16 “no man… no intercessor” (Ezekiel verse)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'And I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none.'
  - where: 'section “The intercessor”'
    claim: 'Connection made by this page: Ezek. 22:30 set beside Isa. 59:16 (Isaiah verse)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/59?lang=eng'
    quote: 'And he saw that there was no man, and wondered that there was no intercessor'
