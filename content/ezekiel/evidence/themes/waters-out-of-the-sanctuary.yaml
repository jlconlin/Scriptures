page: waters-out-of-the-sanctuary
claims:
  - where: 'opening'
    claim: 'Ezek. 47–48 is the latter-day temple in Jerusalem and the river that heals the Dead Sea'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '…and Ezek. 47–48, the description of the latter-day temple in Jerusalem, the river running from the temple into the Dead Sea to heal it, and the building of a city “foursquare.”'
  - where: 'opening'
    claim: 'Joseph Smith placed the temple, the water and the healing of the Dead Sea before the Son of Man appears'
    key: ttp-joseph-smith-21
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-21?lang=eng'
    quote: 'Judah must return, Jerusalem must be rebuilt, and the temple, and water come out from under the temple, and the waters of the Dead Sea be healed [see Ezekiel 47:1–9].'
  - where: 'section “The glory returns”'
    claim: 'Connection made by this page: Ezek. 8:6 and 43:9 use the same Hebrew root rachaq (“far”); 8:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: '<w lemma="l/7368" n="0.2.0" morph="HR/Vqc" id="26oMP">לְ/רָֽחֳקָה֙</w>'
  - where: 'section “The glory returns”'
    claim: 'Connection made by this page: Ezek. 8:6 and 43:9 use the same Hebrew root rachaq (“far”); 43:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: '<w lemma="7368" morph="HVpj3mp" id="26zs3">יְרַחֲק֧וּ</w>'
  - where: 'section “Water from the threshold”'
    claim: 'The sea the river enters is the Dead Sea, where the water brought life and healing'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'The water ultimately flowed from Jerusalem down into the Dead Sea, where it brought life and healing.'
  - where: 'section “Water from the threshold”'
    claim: 'Connection made by this page: the noun miphtan (threshold) is the same in Ezek. 10:18 and 47:1; 10:18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: '<w lemma="4670" morph="HNcmsc" id="26Xre">מִפְתַּ֣ן</w>'
  - where: 'section “Water from the threshold”'
    claim: 'Connection made by this page: the noun miphtan (threshold) is the same in Ezek. 10:18 and 47:1; 47:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: '<w lemma="4670" morph="HNcmsc" id="26E23">מִפְתַּ֤ן</w>'
  - where: 'section “Water from the threshold”'
    claim: 'Connection made by this page: the verb yatsa'' (go out) is the same in Ezek. 10:18 (glory) and 47:1 (waters); 10:18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: '<w lemma="c/3318" n="1.1.0" morph="HC/Vqw3ms" id="26RAc">וַ/יֵּצֵא֙</w>'
  - where: 'section “Water from the threshold”'
    claim: 'Connection made by this page: the verb yatsa'' (go out) is the same in Ezek. 10:18 (glory) and 47:1 (waters); 47:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: '<w lemma="3318" n="1.1.1" morph="HVqrmpa" id="26q3j">יֹצְאִ֗ים</w>'
  - where: 'section “Jesus Christ”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Jesus Christ”'
    claim: 'The Church edition joins Ezek. 43:2 “voice” to D&C 110:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: '2c “voice”: Ezek. 1:24; Rev. 1:15; D&C 110:3.'
  - where: 'section “Jesus Christ”'
    claim: 'D&C 110:3–4: the voice as great waters is the voice of Jehovah, who was slain and is advocate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'and his voice was as the sound of the rushing of great waters, even the voice of Jehovah, saying:'
  - where: 'section “Jesus Christ”'
    claim: 'D&C 110:4: I am he who was slain; I am your advocate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'I am he who liveth, I am he who was slain; I am your advocate with the Father.'
  - where: 'section “Jesus Christ”'
    claim: 'Rev. 22:1: river of water of life from the throne of God and of the Lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/22?lang=eng'
    quote: 'And he shewed me a pure river of water of life, clear as crystal, proceeding out of the throne of God and of the Lamb.'
  - where: 'section “Jesus Christ”'
    claim: 'The Church edition footnote at Ezek. 47:1 “waters” sends the reader to Rev. 22:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/47?lang=eng'
    quote: '1b “waters”: Joel 3:18; Zech. 14:8; Rev. 22:1.'
  - where: 'section “Jesus Christ”'
    claim: 'Living water is a symbol of the Lord Jesus Christ and His teachings'
    key: gs-living-water
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/living-water?lang=eng'
    quote: 'A symbol of the Lord Jesus Christ and His teachings.'
  - where: 'section “Jesus Christ”'
    claim: 'Zech. 14:8 has “living waters”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: 'And it shall be in that day, that living waters shall go out from Jerusalem'
  - where: 'section “Jesus Christ”'
    claim: 'Seminary guide reads the river symbolically: the temple ordinances come from the source of living waters, even Jesus Christ'
    key: seminary-ezek-47
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-ezekiel/ezekiel-47-the-healing-waters-of-the-temple?lang=eng'
    quote: 'This event is also symbolic of the spiritual renewal and rebirth that comes to individuals and families as they participate in the sacred, uplifting, and empowering ordinances of the temple that come from the source of “living waters,” even Jesus Christ.'
  - where: 'section “Jesus Christ”'
    claim: 'Connection made by this page: John 7:38, rivers of living water flowing out, set beside Ezek. 47:1, waters issuing out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water.'
  - where: 'section “Jesus Christ”'
    claim: 'Connection made by this page: John 7:37, the invitation to come and drink'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'In the last day, that great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink.'
