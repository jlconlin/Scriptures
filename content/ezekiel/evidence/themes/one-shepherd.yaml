page: one-shepherd
claims:
  - where: 'opening'
    claim: 'The noun tsemach (H6780) comes three times in Ezekiel, 16:7 and 17:9–10, of a bud and of a vine’s growth'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כְּ/צֶ֤מַח'
  - where: 'section “The crown taken off”'
    claim: 'Ezek. 21:27 is read of Jesus Christ the King'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Judah would be overturned and her king deposed until He comes who has the right to reign over Israel and all flesh: Jesus Christ the King'
  - where: 'section “The crown taken off”'
    claim: 'The Church edition footnote at 21:27 gives Gen. 49:10; Gen. 49:10 reads “until Shiloh come”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/49?lang=eng'
    quote: 'The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come'
  - where: 'section “The shepherds charged”'
    claim: 'The shepherds were likely not only spiritual leaders but also kings'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'This was likely referring not only to Israel’s spiritual leaders but also to its kings, who were often compared to shepherds in ancient Near Eastern culture'
  - where: 'section “The shepherds charged”'
    claim: 'Shepherd was one of the most common metaphors for kings in the ancient Near East'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'One of the most common metaphors for kings in the ancient Near East was the shepherd.'
  - where: 'section “I, even I”'
    claim: 'The Church edition footnote at 34:16 gives Luke 15:4 and 19:10 (Luke 15:4 text shown)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/15?lang=eng'
    quote: 'and go after that which is lost, until he find it?'
  - where: 'section “One shepherd”'
    claim: 'Heading of Ezek. 34: The Messiah will be their Shepherd'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'The Messiah will be their Shepherd'
  - where: 'section “One shepherd”'
    claim: 'The one shepherd is Jesus Christ, not King David'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'This does not refer to King David, who died about four centuries before Ezekiel’s ministry. Rather, it is a reference to Jesus Christ, the Good Shepherd, who was a descendant of David.'
  - where: 'section “One shepherd”'
    claim: 'The prince prepares a sin offering for himself and the people (45:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'And upon that day shall the prince prepare for himself and for all the people of the land a bullock for a sin offering.'
  - where: 'section “Jesus Christ”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Jesus Christ”'
    claim: 'John 10:11, 16; the Church edition footnote at Ezek. 37:22 gives John 10:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'Jer. 50:4; John 10:16.'
  - where: 'section “Jesus Christ”'
    claim: 'Those who heard Jesus in Jerusalem would have had Ezekiel’s messianic passages quickly in mind'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Both the widely accepted royal nature of the title “shepherd” and the specific messianic passages in Ezekiel must have come quickly and powerfully to the minds of those who heard Jesus’s proclamation in Jerusalem.'
  - where: 'section “Jesus Christ”'
    claim: 'Jesus’s devotion to His sheep is a public announcement of His forthcoming sacrifice'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Jesus’s devotion to His “sheep” as He taught here is a public announcement of His forthcoming sacrifice.'
  - where: 'section “Jesus Christ”'
    claim: 'Hebrew mishpat (H4941) is the word for “right” in 21:27 and occurs 43 times in 37 verses in Ezekiel'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/מִּשְׁפָּ֖ט'
  - where: 'section “Jesus Christ”'
    claim: 'Connection made by this page: 34:16 “with judgment” is the same Hebrew word as “right” in 21:27'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בְ/מִשְׁפָּֽט'
  - where: 'section “Jesus Christ”'
    claim: 'Connection made by this page: “until he come whose right it is” (21:27) set beside “I will feed them with judgment” (34:16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'I will feed them with judgment'
  - where: 'section “Jesus Christ”'
    claim: 'Connection made by this page: the crown passage (21:25–27) joined to the shepherd chapters 34 and 37; Church sources read 21:27 and 34:23 each of Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'until he come whose right it is; and I will give it him'
