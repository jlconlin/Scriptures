chapter: 17
claims:
  - where: 'when'
    claim: 'The book’s second date is the sixth year, sixth month (8:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'when'
    claim: 'The book’s third date is the seventh year (20:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month'
  - where: 'when'
    claim: 'The book counts its years from Jehoiachin’s captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'Ezekiel prophesied from 592 B.C., so the sixth year is about 591'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The next date after that is the ninth year, the day the siege begins (24:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month'

  - where: 'setting'
    claim: 'Ezekiel was among the captives in Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'as I was among the captives by the river of Chebar'
  - where: 'setting'
    claim: 'Ezekiel was carried away with Jehoiachin; his ministry began in 592 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'The chapter falls between the dates of 8:1 and 20:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month'
  - where: 'setting'
    claim: 'Nebuchadnezzar made Mattaniah king and renamed him Zedekiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah.'
  - where: 'setting'
    claim: 'Zedekiah was the last king of Judah'
    key: bd-zedekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'The last king of Judah, his name changed from Mattaniah to Zedekiah'
  - where: 'setting'
    claim: 'Nebuchadnezzar made Zedekiah swear by God, and he rebelled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'And he also rebelled against king Nebuchadnezzar, who had made him swear by God'
  - where: 'setting'
    claim: 'Kings records that Zedekiah rebelled against the king of Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'that Zedekiah rebelled against the king of Babylon'
  - where: 'setting'
    claim: 'Jeremiah told Zedekiah to serve the king of Babylon and live'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'I spake also to Zedekiah king of Judah according to all these words, saying, Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live.'
  - where: 'setting'
    claim: 'The siege begins in the ninth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadnezzar king of Babylon came, he, and all his host, against Jerusalem'
  - where: 'thread'
    claim: 'The chapter has three parts: parable (1–10), interpretation (11–21), promise (22–24)'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'Ezekiel 17:1-10 contain the parable; Ezekiel 17:11-21, the interpretation and application of it to King Zedekiah; and Ezekiel 17:22-24, the promise of the Messianic kingdom.'
  - where: 'thread'
    claim: 'The second eagle is the king of Egypt'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'The other eagle mentioned in Ezekiel 17:7 is the king of Egypt, according to Ezekiel 17:15.'

  - where: 'section 1 plain'
    claim: '“A land of traffick” is a land of trade'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'carried it to a land of trade and set it in a city of merchants'
  - where: 'section 1 plain'
    claim: 'The vine is low and spreading, planted in fertile soil by abundant water'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'planted it in fertile soil. He placed it beside abundant waters'
  - where: 'section 2 plain'
    claim: 'The vine reaches toward the second eagle from the bed where it was planted'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'shot forth its branches toward him from the bed where it was planted, that he might water it'
  - where: 'section 3 plain'
    claim: '“Base” means lowly or humble; “the mighty” are the chief men; “much people” is a large army'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'that the kingdom might be humble and not lift itself up, and keep his covenant that it might stand'
  - where: 'section 3 plain'
    claim: 'The envoys ask for horses and a large army'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=NRSVUE'
    quote: 'by sending ambassadors to Egypt, that they might give him horses and a large army'
  - where: 'section 4 plain'
    claim: '“Make for him” is help him; “mounts” and “forts” are siege works; “plead” is enter into judgment; “trespass” is treachery'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'will not help him in war, when mounds are cast up and siege walls built to cut off many lives'
  - where: 'section 4 plain'
    claim: '“Plead with him” is to enter into judgment with him; the trespass is treachery'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'enter into judgment with him there for the treachery he has committed against me'
  - where: 'section 5 plain'
    claim: 'The Lord Himself takes a sprig and plants it on a high and lofty mountain; birds of every kind live under it'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'I myself will take a sprig from the lofty top of the cedar and will set it out.'

  - where: 'note 17:2 “A riddle and a parable”'
    claim: 'The Hebrew words are chidah and mashal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חִידָ֖ה'
  - where: 'note 17:2 “A riddle and a parable”'
    claim: 'Chidah is a dark utterance needing interpretation; Ezekiel 17:2 is classed as an allegory'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'riddle = dark, obscure utterance Numbers 12:8 … of something put indirectly and needing interpretation; — an allegory'
  - where: 'note 17:2 “A riddle and a parable”'
    claim: 'Mashal is proverb or parable; in Ezekiel 17:2 a similitude'
    key: bdb
    url: 'https://biblehub.com/hebrew/4912.htm'
    quote: '4 similitude, parable, Ezekiel 17:2; Ezekiel 21:5; Ezekiel 24:3.'
  - where: 'note 17:2 “A riddle and a parable”'
    claim: 'A modern translation renders the pair riddle and allegory'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=NRSVUE'
    quote: 'propound a riddle and speak an allegory to the house of Israel'
  - where: 'note 17:2 “A riddle and a parable”'
    claim: 'Ezekiel’s hearers complained that he spoke parables'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'they say of me, Doth he not speak parables?'

  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'The great eagle is Nebuchadnezzar, who is compared to an eagle in Jeremiah 48:40'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'Not only is Nebuchadnezzar compared to an eagle in Jeremiah 48:40; Jeremiah 49:22'
  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'Jeremiah 48:40 has the eagle spreading its wings over Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'Behold, he shall fly as an eagle, and shall spread his wings over Moab.'
  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'The many-coloured feathers have been read as the many peoples under Nebuchadnezzar'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'The feathers of variegated ornamental colours point to the many peoples, differing in language, manners, and customs, which were united under the sceptre of Nebuchadnezzar'
  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'Lebanon stands for Jerusalem, as in Jeremiah 22:23'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'as in Jeremiah 22:23, of Jerusalem, or Mount Zion, with its royal palace so rich in cedar wood'
  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'Jeremiah addresses the royal house as an inhabitant of Lebanon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng'
    quote: 'O inhabitant of Lebanon, that makest thy nest in the cedars'
  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'The cedar is the house of David and its top is Jehoiachin'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'The cedar is the royal house of David, and the top of it is King Jehoiachin.'
  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'Jehoiachin reigned three months'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Jehoiachin was eighteen years old when he began to reign, and he reigned in Jerusalem three months.'
  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'Jehoiachin was carried to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And he carried away Jehoiachin to Babylon'
  - where: 'note 17:3 “The eagle, Lebanon, and the cedar”'
    claim: 'The eagle is the king of Babylon and the branch is Jehoiachin'
    key: sc-knowhy-440
    url: 'https://scripturecentral.org/knowhy/did-prophets-such-as-ezekiel-know-the-writings-of-zenos'
    quote: 'This allegory appears to be making reference to the King of Babylon, in the first place, as the eagle, and how he carried off the king of Judah, Jehoiachin, into Babylon.'

  - where: 'note 17:4 “A land of merchants: Babylon”'
    claim: 'The Hebrew of “a land of traffick” is “the land of Canaan”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כְּנַ֔עַן'
  - where: 'note 17:4 “A land of merchants: Babylon”'
    claim: 'Canaan is also a common noun for merchant; Ezekiel 17:4 is a land of merchants'
    key: bdb
    url: 'https://biblehub.com/hebrew/3667.htm'
    quote: 'merchant (s) (because Canaanites, especially Phoenicians, were traders)'
  - where: 'note 17:4 “A land of merchants: Babylon”'
    claim: 'The lexicon lists Ezekiel 17:4 as a land of merchants'
    key: bdb
    url: 'https://biblehub.com/hebrew/3667.htm'
    quote: 'Ezekiel 17:4 a land of merchants'
  - where: 'note 17:4 “A land of merchants: Babylon”'
    claim: 'Modern translations have “a land of trade”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'carried it to a land of trade and set it in a city of merchants'
  - where: 'note 17:4 “A land of merchants: Babylon”'
    claim: 'The Septuagint keeps the name Canaan'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/17.htm'
    quote: 'he cropped off the ends of the tender twigs, and brought them into the land of Chanaan'
  - where: 'note 17:4 “A land of merchants: Babylon”'
    claim: 'Ezekiel 16:29 uses “the land of Canaan” with Chaldea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/16?lang=eng'
    quote: 'Thou hast moreover multiplied thy fornication in the land of Canaan unto Chaldea'

  - where: 'note 17:6 “A vine kept low”'
    claim: 'Nebuchadnezzar made Zedekiah, Jehoiachin’s uncle, king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And the king of Babylon made Mattaniah his father’s brother king in his stead'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'Kings says the mighty of the land were carried to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'and the mighty of the land, those carried he into captivity from Jerusalem to Babylon'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'The same Hebrew adjective, shaphal, is in verses 6 and 14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שְׁפָלָ֔ה'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'Shaphal means low; it is used of the vine in 17:6 and the tree in 17:24'
    key: bdb
    url: 'https://biblehub.com/hebrew/8217.htm'
    quote: 'low, in height, of vine Ezekiel 17:6, tree Ezekiel 17:24'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'In 17:14 the word describes a modest, unambitious kingdom'
    key: bdb
    url: 'https://biblehub.com/hebrew/8217.htm'
    quote: 'of a modest, unambitious kingdom Ezekiel 17:14'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'Modern translations render “base” as “humble”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'that the kingdom might be humble and not lift itself up'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'The word for “willow tree” is glossed “a kind of willow”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6851.htm'
    quote: 'a kind of willow'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'A modern translation marks verse 5 as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=NRSVUE'
    quote: 'Meaning of Heb uncertain'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'Jeremiah said nations that accepted Babylon’s yoke would remain in their land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'those will I let remain still in their own land, saith the Lord'
  - where: 'note 17:6 “A vine kept low”'
    claim: 'Jeremiah told Zedekiah to serve Babylon and live'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live.'

  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'Kings says Zedekiah rebelled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'that Zedekiah rebelled against the king of Babylon'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'The Church’s footnote on “Pharaoh” at 17:17 points to Jeremiah 44:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/17?lang=eng'
    quote: 'Jer. 44:30'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'Jeremiah names Pharaoh-hophra beside Zedekiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'I will give Pharaoh-hophra king of Egypt into the hand of his enemies, and into the hand of them that seek his life; as I gave Zedekiah king of Judah into the hand of Nebuchadrezzar'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'The law forbade the king to multiply horses or send the people back to Egypt for them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'But he shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he should multiply horses'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'Isaiah warned against going down to Egypt for help and relying on horses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/31?lang=eng'
    quote: 'Woe to them that go down to Egypt for help; and stay on horses'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'Horses abounded in Egypt and Israel was forbidden to seek them there (Deut. 17:16; Isa. 31:1)'
    key: jfb-ezekiel
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/17.htm'
    quote: 'horses—in which Egypt abounded and which were forbidden to Israel to seek from Egypt, or indeed to "multiply" at all (De 17:16; Isa 31:1, 3'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: '“Make for him” means help him'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'Pharaoh with his mighty army and great company will not help him in war'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'An Egyptian army came out during the siege and the Chaldeans left Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'Then Pharaoh’s army was come forth out of Egypt: and when the Chaldeans that besieged Jerusalem heard tidings of them, they departed from Jerusalem.'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'Jeremiah said Pharaoh’s army would go back to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'Behold, Pharaoh’s army, which is come forth to help you, shall return to Egypt into their own land.'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'The second eagle is the king of Egypt'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'The other eagle mentioned in Ezekiel 17:7 is the king of Egypt, according to Ezekiel 17:15.'
  - where: 'note 17:15 “Horses from Egypt”'
    claim: 'Jeremiah 37:5 is the event verse 17 foretells: the Egyptian army came out but gave no lasting help'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'although an Egyptian army came to the rescue of Jerusalem at the time when it was besieged by the Chaldeans, it was repulsed by the Chaldeans who marched to meet it, without having rendered any permanent assistance to the besieged'

  - where: 'note 17:19 “An oath to Nebuchadnezzar that the Lord calls His own”'
    claim: 'Nebuchadnezzar made Zedekiah swear by God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'who had made him swear by God'
  - where: 'note 17:19 “An oath to Nebuchadnezzar that the Lord calls His own”'
    claim: 'The oath is called Jehovah’s because it was sworn by Jehovah, so that breaking it was a breach of faith toward Him'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'because the oath had been sworn by Jehovah, and the covenant of fidelity towards Nebuchadnezzar had thereby been made implicite with Jehovah Himself; so that the breaking of the oath and covenant became a breach of faith towards Jehovah'
  - where: 'note 17:19 “An oath to Nebuchadnezzar that the Lord calls His own”'
    claim: 'Giving the hand was a pledge of fidelity'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'he gave his hand, i.e., as a pledge of fidelity'
  - where: 'note 17:19 “An oath to Nebuchadnezzar that the Lord calls His own”'
    claim: 'A second reason: the Lord had delivered the kingdom to Nebuchadnezzar, so revolt was rebellion against God'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'Jehovah had delivered up His people and kingdom into the power of Nebuchadnezzar, so that revolt from him really became rebellion against God'
  - where: 'note 17:19 “An oath to Nebuchadnezzar that the Lord calls His own”'
    claim: 'The Lord said through Jeremiah that He had given the lands to Nebuchadnezzar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'And now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant'
  - where: 'note 17:19 “An oath to Nebuchadnezzar that the Lord calls His own”'
    claim: 'Ezekiel 16:59 uses the same words of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/16?lang=eng'
    quote: 'I will even deal with thee as thou hast done, which hast despised the oath in breaking the covenant'
  - where: 'note 17:19 “An oath to Nebuchadnezzar that the Lord calls His own”'
    claim: 'The same expressions are used here as in 16:59, where they describe Jerusalem’s apostasy from Jehovah'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/17.htm'
    quote: 'the very same expressions are used in Ezekiel 17:16, Ezekiel 17:18, and Ezekiel 17:19, to designate this breach of oath, which are applied in Ezekiel 16:59 to the treacherous apostasy of Jerusalem (Israel) from Jehovah, the covenant God'
  - where: 'note 17:19 “An oath to Nebuchadnezzar that the Lord calls His own”'
    claim: 'A modern translation renders the trespass as treachery against the Lord'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2017&version=ESV'
    quote: 'for the treachery he has committed against me'

  - where: 'note 17:20 “The net, a second time”'
    claim: 'Chapter 12 speaks of the prince in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/12?lang=eng'
