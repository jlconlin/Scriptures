chapter: 15
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is the sixth year, sixth month (8:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'when'
    claim: 'The book counts from Jehoiachin’s captivity; its fifth year is the first date'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'Ezekiel prophesied from 592 B.C., so the sixth year is about 591'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The next date in the book is the seventh year, at 20:1'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month'
  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'The elders come to inquire in the seventh year (20:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'certain of the elders of Israel came to inquire of the Lord, and sat before me'
  - where: 'setting'
    claim: 'The siege of Jerusalem begins in the ninth year (24:1–2)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'the king of Babylon set himself against Jerusalem this same day'
  - where: 'setting'
    claim: 'The large deportations under Nebuchadnezzar were in 597 B.C. and 586 B.C.; 597 is about six years before the sixth year of the captivity (about 591)'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'The chapter has been read as directed against the confidence that a chosen people could not be rejected, as chapter 14 was against confidence in the righteousness of the godly'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/15.htm'
    quote: 'As the previous word of God overthrows false confidence in the righteousness of the godly, what follows in this chapter is directed against the fancy that Israel cannot be rejected'
  - where: 'setting'
    claim: 'The Hebrew word for vine, gephen (H1612), occurs in Ezekiel only at 15:2, 6; 17:6, 7, 8; 19:10 (scripts/hebrew.mjs ezekiel --word 1612)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כַ/גֶּ֛פֶן'
  - where: 'setting'
    claim: 'Chapter 17’s parable has two great eagles and a vine'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/17?lang=eng'
    quote: 'There was also another great eagle with great wings and many feathers: and, behold, this vine did bend her roots toward him'
  - where: 'setting'
    claim: 'Chapter 19 is a lamentation for the princes of Israel, with a vine in verse 10'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/19?lang=eng'
    quote: 'Moreover take thou up a lamentation for the princes of Israel'
  - where: 'thread'
    claim: 'The chapter treats the vine only as wood; its worth lies in fruit, which the parable does not mention'
    key: 'talmage-jesus-christ-30'
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The worthlessness of a vine save only for its fruit was set forth by the Lord through His prophet Ezekiel (15:2–5)'
  - where: 'thread'
    claim: 'Verses 6–8 apply the parable: God will deal with the inhabitants of Jerusalem as with the vine wood'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/15.htm'
    quote: 'God will deal with the inhabitants of Jerusalem in the same manner as with the vine-wood, which cannot be used for any kind of work'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'One rendering of verse 7 has a past and a future: they have gone out of the fire and the fire will consume them'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/15.htm'
    quote: 'They have gone out of the fire, and the fire will consume them'
  - where: 'note 15:2 “A vine judged by its wood”'
    claim: 'The Hebrew of verse 2 is “the wood of the vine” (ets ha-gephen)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/גֶּ֖פֶן'
  - where: 'note 15:2 “A vine judged by its wood”'
    claim: 'Modern translations render it “the wood of the vine”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2015&version=ESV'
    quote: 'the wood of the vine surpass any wood, the vine branch that is among the trees of the forest?'
  - where: 'note 15:2 “A vine judged by its wood”'
    claim: 'The Hebrew noun ets means both tree and wood'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6086.htm'
    quote: 'noun masculineGenesis 2:9 tree, trees, wood'
  - where: 'note 15:2 “A vine judged by its wood”'
    claim: 'Vine wood is fit only for burning'
    key: 'talmage-jesus-christ-30'
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'the wood of the grape plant is fit for nothing but burning'
  - where: 'note 15:2 “A vine judged by its wood”'
    claim: 'Israel is such a vine, precious only if fruitful'
    key: 'talmage-jesus-christ-30'
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'And Israel is represented as such a vine, precious if but fruitful, otherwise nothing but fuel and that of poor quality.'
  - where: 'note 15:2 “A vine judged by its wood”'
    claim: 'Israel is often compared to a vine or vineyard (Ps. 80; Isa. 5; Jer. 2:21)'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/15.htm'
    quote: 'Israel is frequently compared to a vine or a vineyard (cf. Psalm 80:9.; Isaiah 5; Hosea 10:1; Jeremiah 2:21)'
  - where: 'note 15:2 “A vine judged by its wood”'
    claim: 'Isaiah’s vineyard was planted with the choicest vine and brought forth wild grapes'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/5?lang=eng'
    quote: 'planted it with the choicest vine'
  - where: 'note 15:2 “The vine branch among the forest trees”'
    claim: 'The word for branch is zemorah (H2156); it stands directly after “any wood” with no word for “or than”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/זְּמוֹרָ֕ה'
  - where: 'note 15:2 “The vine branch among the forest trees”'
    claim: 'zemorah is a twig (as pruned); rendered vine, branch, slip'
    key: 'strongs-concordance'
    url: 'https://biblehub.com/hebrew/2156.htm'
    quote: 'from zamar; a twig (as pruned) -- vine, branch, slip.'
  - where: 'note 15:2 “The vine branch among the forest trees”'
    claim: 'On the King James reading of verse 2 the whole vine, as wood, is inferior to a branch of a forest tree'
    key: 'talmage-jesus-christ-30'
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'the whole vine as wood is inferior to a branch from a forest tree'
  - where: 'note 15:2 “The vine branch among the forest trees”'
    claim: 'The English Standard Version takes the branch as a second name for the vine'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2015&version=ESV'
    quote: 'the wood of the vine surpass any wood, the vine branch that is among the trees of the forest?'
  - where: 'note 15:2 “The vine branch among the forest trees”'
    claim: 'The New Revised Standard Version Updated Edition does the same'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2015&version=NRSVUE'
    quote: 'the vine branch that is among the trees of the forest?'
  - where: 'note 15:3 “Not even a peg”'
    claim: 'The Hebrew word is yathed (H3489)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'יָתֵ֔ד'
  - where: 'note 15:3 “Not even a peg”'
    claim: 'yathed means pin, peg, especially a tent-pin'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3489.htm'
    quote: 'pin, peg, especially'
  - where: 'note 15:3 “Not even a peg”'
    claim: 'In Ezek. 15:3 it is a peg for hanging, the sense it has of Eliakim in Isa. 22:23–24'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3489.htm'
    quote: 'a peg for hanging Ezekiel 15:3; so figurative of Eliakim Isaiah 22:23,24'
  - where: 'note 15:4 “The true vine and the branches that are burned”'
    claim: 'The English Standard Version’s cross-references set John 15:6 beside Ezek. 15:4'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2015&version=ESV'
    quote: 'Ezekiel 15:4 : [John 15:6]'
  - where: 'note 15:4 “The true vine and the branches that are burned”'
    claim: 'The New Revised Standard Version Updated Edition’s cross-references do the same'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2015&version=NRSVUE'
    quote: '15.4 : v 6; Ezek 19.14; Jn 15.6'
  - where: 'note 15:4 “The true vine and the branches that are burned”'
    claim: 'A severed branch is worthless except as fuel'
    key: 'talmage-jesus-christ-33'
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'if cut away or broken off withers, dries, and becomes utterly worthless except as fuel for the burning'
  - where: 'note 15:4 “The true vine and the branches that are burned”'
    claim: 'The apostles were useless without Christ as a bough severed from the tree'
    key: 'talmage-jesus-christ-33'
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Those ordained servants of the Lord were as helpless and useless without Him as is a bough severed from the tree.'
  - where: 'note 15:4 “The true vine and the branches that are burned”'
    claim: 'John 15 is the Savior’s discourse; Jesus is the vine and the disciples the branches'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'I am the true vine, and my Father is the husbandman.'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'Verse 4 “is cast” is natan (H5414), Niphal perfect: is given'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נִתַּ֣ן'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'Verse 6 “which I have given” is natan, Qal perfect first person'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נְתַתִּ֥י/ו'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'Verse 6 “so will I give” is natan, Qal perfect first person'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נָתַ֔תִּי'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'Verse 7 “I will set my face” and verse 8 “I will make” are both natan (ve-natatti)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/נָתַתִּ֥י'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'The second “set” in verse 7 is a different verb, sum (H7760)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בְּ/שׂוּמִ֥/י'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'The English Standard Version keeps the perfect in verse 6'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2015&version=ESV'
    quote: 'so have I given up the inhabitants of Jerusalem'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'Moses’ covenant warnings (Leviticus 26, Deuteronomy 28) are the most important antecedent of Ezekiel’s message'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Probably the most important historical and prophetic antecedent dates back to Moses and his warnings to the people of Israel as they entered the promised land. Leviticus 26 and Deuteronomy 28 are whole chapters warning the people'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'Lev. 26:17 “I will set my face” is ve-natatti panai, the verb and noun of Ezek. 15:7 (scripts/hebrew.mjs leviticus 26:17)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/נָתַתִּ֤י'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'Lev. 26:33 “desolate” is shemamah (H8077), the noun of Ezek. 15:8 (scripts/hebrew.mjs leviticus 26:33)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'שְׁמָמָ֔ה'
  - where: 'note 15:6 “One verb from the fire to the land”'
    claim: 'Ezek. 14:8 has “I will set my face against that man”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'And I will set my face against that man'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'The first verb of the clause is a perfect (yatsa’u, H3318, Qal perfect): they have come out'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'יָצָ֔אוּ'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'The second verb is an imperfect (H398): will consume them; the Hebrew has “the fire” twice and no words for “one” and “another”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תֹּֽאכְלֵ֑/ם'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'The New Revised Standard Version Updated Edition’s rendering of verse 7'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2015&version=NRSVUE'
    quote: 'although they escape from the fire, the fire shall still consume them'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'The English Standard Version’s cross-references set 2 Kgs. 25:9 beside verse 7'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2015&version=ESV'
    quote: 'Ezekiel 15:7 : [2 Kgs. 25:9]'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'Verse 7 applies verses 4–5 to Jerusalem: Israel has been in the fire already'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/15.htm'
    quote: 'Israel has been in the fire already. It resembles a wild vine which has been consumed at both ends by the fire, while the middle has been scorched'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'One reading extends the earlier fire to all the judgments from the fall of the ten tribes to Jehoiachin'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/15.htm'
    quote: 'all the judgments which fell upon the covenant nation, from the destruction of the kingdom of the ten tribes to the catastrophe in the reign of Jehoiachin'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'Another reading maps the stick onto the land, with Jerusalem as the middle'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/15.htm'
    quote: 'both the extremities of the land is wasted; and the middle, Jerusalem, is now threatened with a siege'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'The rest of Israel was carried captive in 721 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel'
  - where: 'note 15:7 “Out of one fire, into another”'
    claim: 'The first large deportation under Nebuchadnezzar was in 597 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'note 15:7 “Out of one fire, into another”'
