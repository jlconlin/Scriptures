  - where: 'explore'
    claim: 'The Lord’s parable of the vineyard represents Israel as a vineyard, the figure of the Old Testament passages'
    key: 'talmage-jesus-christ-30'
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The aptness of our Lord’s representation of Israel as a vineyard could not have escaped the perception of the Jews, to whom Old Testament similes of analogous form were familiar figures.'
  - where: 'explore'
    claim: 'The parable of the vineyard and husbandmen begins at Matt. 21:33'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/21?lang=eng'
    quote: 'There was a certain householder, which planted a vineyard'
  - where: 'explore'
    claim: 'Chapter 16 presents Jerusalem as a harlot'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/16?lang=eng'
    quote: 'Jerusalem has become as a harlot, reveling in her idols and worshipping false gods'
