    url: 'https://interpreterfoundation.org/journal/the-life-giving-water-of-the-restoration'
    quote: 'Anciently the term Arabah (or, in Hebrew, Arava or Aravah) referred to pretty much the entirety of the Jordan Rift Valley'
  - where: 'note 47:8 “The Dead Sea made fresh”'
    claim: 'A modern translation notes that the sea is the Dead Sea'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2047&version=ESV'
    quote: 'Ezekiel 47:8 That is, the Dead Sea'
  - where: 'note 47:8 “The Dead Sea made fresh”'
    claim: 'The Dead Sea has no outlet, so the salts accumulate'
    key: bd-dead-sea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dead-sea?lang=eng'
    quote: 'It is fed by the Jordan and by several smaller streams and has no outlet except by evaporation. All the mineral salts that the streams bring down are consequently accumulated'
