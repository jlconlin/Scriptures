    claim: 'The Dead Sea today supports no life'
    key: tvedtnes-tree-healing
    url: 'https://interpreterfoundation.org/journal/tree-of-life-tree-of-healing'
    quote: 'The sea east of Jerusalem is, of course, the Dead Sea, which today supports no life.'
  - where: 'note 47:8 “The Dead Sea made fresh”'
    claim: 'The verb rapha, to heal, used of salt water means to be made fresh; the same verb is in 2 Kings 2:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/7495.htm'
    quote: 'of (bad) water 2 Kings 2:22, salt waters (prediction), i.e. be made fresh, Ezekiel 47:8,9,11'
  - where: 'note 47:8 “The Dead Sea made fresh”'
    claim: 'The verb is used literally of healing a person'
    key: bdb
