    key: bdb
    url: 'https://biblehub.com/hebrew/4670.htm'
    quote: 'Ezekiel 9:3; Ezekiel 10:4,18; Ezekiel 47:1'
  - where: 'note 47:1 “Water from the threshold”'
    claim: 'In 10:4 and 10:18 the glory stands over the threshold of the house and then departs from it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'Then the glory of the Lord departed from off the threshold of the house, and stood over the cherubims.'
  - where: 'note 47:1 “Water from the threshold”'
    claim: 'In 9:3 the glory goes up to the threshold of the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'And the glory of the God of Israel was gone up from the cherub, whereupon he was, to the threshold of the house.'
  - where: 'note 47:1 “Water from the threshold”'
    claim: 'The Lord identifies the temple of the vision as His throne (43:7)'
    key: tvedtnes-tree-healing
    url: 'https://interpreterfoundation.org/journal/tree-of-life-tree-of-healing'
    quote: 'Ezekiel’s vision of water flowing from the latter-day temple (which the Lord identifies as his throne in Ezek. 43:7)'
  - where: 'note 47:1 “Water from the threshold”'
    claim: 'Ancient Jerusalem depended on one small spring, the Gihon'
    key: peterson-water
    url: 'https://interpreterfoundation.org/journal/the-life-giving-water-of-the-restoration'
    quote: 'a city that was sustained, anciently, by one main but relatively small and vulnerable source of water, the Gihon Spring'
  - where: 'note 47:1 “Water from the threshold”'
    claim: 'No resident of Jerusalem had seen so much water there'
    key: peterson-water
    url: 'https://interpreterfoundation.org/journal/the-life-giving-water-of-the-restoration'
    quote: 'neither Ezekiel nor any other ancient or modern resident of the city had ever seen such a quantity of water in the area before'
  - where: 'note 47:2 “A trickle at the outer gate”'
    claim: 'The east gate is shut because the Lord entered by it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the Lord, the God of Israel, hath entered in by it, therefore it shall be shut.'
