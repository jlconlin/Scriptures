chapter: 47
claims:
  - where: 'when'
    claim: 'The vision of chapters 40–48 is dated to the twenty-fifth year of the captivity, the fourteenth after the city was smitten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'
  - where: 'when'
    claim: 'The captivity began in about 597 B.C., so its twenty-fifth year is about 573 B.C.'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC'
  - where: 'setting'
    claim: 'The guide of the vision carries a line (40:3) and still has it in 47:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'with a line of flax in his hand, and a measuring reed'
  - where: 'setting'
    claim: 'The glory of the Lord came into the house by the east gate in chapter 43'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And the glory of the Lord came into the house by the way of the gate whose prospect is toward the east.'
  - where: 'setting'
    claim: 'The chapters between give the ordinances of worship and sacrifice (heading of chapter 46)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/46?lang=eng'
    quote: 'The ordinances of worship and of sacrifice are explained.'
  - where: 'setting'
    claim: 'Chapter 46 ends in the outer (“utter”) court'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/46?lang=eng'
    quote: 'Then he brought me forth into the utter court, and caused me to pass by the four corners of the court'
  - where: 'setting'
    claim: 'Chapters 47–48 are summarized as the latter-day temple in Jerusalem, the river healing the Dead Sea, and the building of a city'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'Ezek. 47–48, the description of the latter-day temple in Jerusalem, the river running from the temple into the Dead Sea to heal it, and the building of a city “foursquare.”'
  - where: 'setting'
    claim: 'The Church’s footnote at 47:1 joins the waters to Joel 3:18, Zechariah 14:8 and Revelation 22:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/47?lang=eng'
    quote: 'Joel 3:18; Zech. 14:8; Rev. 22:1.'
  - where: 'setting'
    claim: 'Chapter 48 divides the land among the tribes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'This is the land which ye shall divide by lot unto the tribes of Israel for inheritance, and these are their portions, saith the Lord God.'
  - where: 'thread'
    claim: 'In chapter 43 the glory came from the east'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And, behold, the glory of the God of Israel came from the way of the east'
  - where: 'thread'
    claim: 'The water at the outer gate is a trickle'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2047&version=ESV'
    quote: 'and behold, the water was trickling out on the south side'
  - where: 'thread'
    claim: 'The east gate of the outer court is shut (44:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Then he brought me back the way of the gate of the outward sanctuary which looketh toward the east; and it was shut.'
