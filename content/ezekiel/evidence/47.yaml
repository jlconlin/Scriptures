    quote: 'a measuring reed of six cubits long by the cubit and an hand breadth'
  - where: 'note 47:3 “Deeper with every thousand cubits”'
    claim: 'Elder Renlund: the stream had no tributaries yet grew into a mighty river, as temple blessings grow through the generations'
    key: renlund-sealing
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/family-history-and-temple-work-sealing-and-healing?lang=eng'
    quote: 'First, though the small stream had no tributaries, it grew into a mighty river, becoming wider and deeper the farther it flowed. Something similar happens with the blessings that flow from the temple as individuals are sealed as families.'
  - where: 'note 47:3 “Deeper with every thousand cubits”'
    claim: 'Elder Renlund: the river renewed everything it touched, as temple blessings heal'
    key: renlund-sealing
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/family-history-and-temple-work-sealing-and-healing?lang=eng'
    quote: 'Second, the river renewed everything that it touched. The blessings of the temple likewise have a stunning capacity to heal.'
