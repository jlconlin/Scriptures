    claim: 'The “desert” is the Arabah'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2047&version=ESV'
    quote: 'This water flows toward the eastern region and goes down into the Arabah, and enters the sea'
