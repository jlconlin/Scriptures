    claim: 'A modern translation has the water trickling out on the south side'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2047&version=ESV'
    quote: 'the water was trickling out on the south side'
  - where: 'note 47:2 “A trickle at the outer gate”'
    claim: 'Verse 1 puts the right side and the south side together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/47?lang=eng'
    quote: 'the waters came down from under from the right side of the house, at the south side of the altar'
