chapter: 20
claims:
  - where: 'when'
    claim: 'Ezekiel’s ministry is dated from 592 B.C., the fifth year of the captivity; the seventh year is then about 590 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The book’s first date is the fifth year of Jehoiachin’s captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'The next date in the book is the ninth year, at 24:1'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month'

  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'The book’s second date is the sixth year (8:1), when elders also sat before Ezekiel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month, as I sat in mine house, and the elders of Judah sat before me'
  - where: 'setting'
    claim: 'The chapter is dated eleven months and five days after chapter 8 and two years and five months before the siege'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'this word of God was uttered only eleven months and five days after the one in Ezekiel 8; two years, one month, and five days after the call of Ezekiel to be a prophet (Ezekiel 1:2); and two years and five months before the blockading of Jerusalem by the Chaldeans'
  - where: 'setting'
    claim: 'The siege of Jerusalem begins on the date of 24:1, so the city is still standing in chapter 20'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'the king of Babylon set himself against Jerusalem this same day'
  - where: 'setting'
    claim: 'Chapter 23 tells the history as the story of two sisters and begins it in Egypt'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'Two sisters, Samaria and Jerusalem, committed whoredoms'
  - where: 'setting'
    claim: 'The Church’s chapter heading names the rebellions from Egypt to Ezekiel’s day and a gathering in the last days'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'In the last days, the Lord will gather Israel and restore His gospel covenant'
  - where: 'setting'
    claim: 'The Hebrew Bible numbers 20:45–49 as 21:1–5 (scripts/hebrew.mjs prints “Ezek 20:46 (Hebrew 21:2)”)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תֵּימָ֔נָ/ה'
  - where: 'setting'
    claim: 'The oracle of the forest is explained in the next verses, 21:1–7'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'This request is granted; and the simile is first of all interpreted in Ezekiel 21:1-7'

  - where: 'thread'
    claim: 'The history has been divided into five periods: Egypt, the wilderness, the new generation, Canaan, and the prophet’s own time'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/20.htm'
    quote: 'the recital of the people''s rebellions during five distinct periods: in Egypt, the wilderness, on the borders of Canaan when a new generation arose, in Canaan, and in the time of the prophet'
  - where: 'thread'
    claim: 'The second division of the chapter begins at verse 33, against the people’s wish to merge with the nations'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/20.htm'
    quote: 'Here begins the second division of the prophecy. Lest the covenant people should abandon their distinctive hopes and amalgamate with the surrounding heathen'
  - where: 'thread'
    claim: 'The verb of verse 33 is “be king”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2020&version=ESV'
    quote: 'with wrath poured out I will be king over you'

  - where: 'note 20:1 “An inquiry the Lord will not take”'
    claim: 'Elders came to Ezekiel’s home in exile more than once (8:1; 14:1; 20:1), so that he worked in a personal, face-to-face setting'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'the elders of the Jews came to his home to counsel with him (for example, see Ezekiel 8:1; 14:1; 20:1). Most often they rejected his counsel, but it is interesting that he functioned as a prophet in a very personal, face-to-face setting'
  - where: 'note 20:1 “An inquiry the Lord will not take”'
    claim: 'A modern translation renders the question of verse 3 more sharply'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2020&version=NRSVUE'
    quote: 'Why are you coming? To consult me? As I live, says the Lord God, I will not be consulted by you.'
  - where: 'note 20:1 “An inquiry the Lord will not take”'
    claim: 'The elders of chapter 14 had idols in their heart and the Lord asked whether He should be inquired of by them'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'these men have set up their idols in their heart, and put the stumblingblock of their iniquity before their face: should I be inquired of at all by them?'
  - where: 'note 20:1 “An inquiry the Lord will not take”'
    claim: 'The refusal is read with Alma 12:9–11; had the elders wanted God’s word they would have obeyed what they had'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'If the elders really wanted God’s word, they would have obeyed that which they already had from His prophets. God will not be mocked. He will not give more to those who reject that which He has already given (see Alma 12:9–11).'
  - where: 'note 20:1 “An inquiry the Lord will not take”'
    claim: 'Alma teaches that the hardened heart receives the lesser portion of the word'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/12?lang=eng'
    quote: 'he that will harden his heart, the same receiveth the lesser portion of the word'

  - where: 'note 20:4 “A question that is a command”'
    claim: '“Cause them to know” is a Hiphil imperative (morphology HVhv2ms)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הוֹדִיעֵֽ/ם'
  - where: 'note 20:4 “A question that is a command”'
    claim: 'A modern translation renders the clause “Let them know”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2020&version=ESV'
    quote: 'Let them know the abominations of their fathers'
  - where: 'note 20:4 “A question that is a command”'
    claim: 'The same question opens the indictment of Jerusalem, followed by the command to show her abominations'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'wilt thou judge, wilt thou judge the bloody city? yea, thou shalt shew her all her abominations'
  - where: 'note 20:4 “A question that is a command”'
    claim: 'The same question opens the indictment of the two sisters, followed by the command to declare their abominations'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'wilt thou judge Aholah and Aholibah? yea, declare unto them their abominations'

  - where: 'note 20:5 “The lifted hand is an oath”'
    claim: 'Modern translations render “lifted up mine hand” as “I swore”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2020&version=ESV'
    quote: 'I swore to them, saying, I am the Lord your God'
  - where: 'note 20:5 “The lifted hand is an oath”'
    claim: 'The Church’s footnote on the phrase gives “covenanted”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'OR covenanted'
  - where: 'note 20:5 “The lifted hand is an oath”'
    claim: 'The verb of verse 5 is nasa, “lift” (H5375), with yad, “hand” (H3027)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וָ/אֶשָּׂ֣א'
  - where: 'note 20:5 “The lifted hand is an oath”'
    claim: 'In Exodus 6:8 the King James “did swear” is the same verb nasa (H5375) with “my hand” (H3027)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'נָשָׂ֨אתִי֙'
  - where: 'note 20:5 “The lifted hand is an oath”'
    claim: 'Ezekiel 20:28 has the same verb form and noun as Exodus 6:8'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נָשָׂ֨אתִי֙'
  - where: 'note 20:5 “The lifted hand is an oath”'
    claim: 'Exodus 6:8 speaks of the land the Lord swore to give'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'concerning the which I did swear to give it to Abraham, to Isaac, and to Jacob'
  - where: 'note 20:5 “The lifted hand is an oath”'
    claim: 'Psalm 106 remembers the lifted hand against the wilderness generation'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'Therefore he lifted up his hand against them, to overthrow them in the wilderness'
  - where: 'note 20:5 “The lifted hand is an oath”'
    claim: 'Psalm 106 continues with their seed scattered in the lands'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'To overthrow their seed also among the nations, and to scatter them in the lands.'

  - where: 'note 20:7 “Idolatry in Egypt”'
    claim: 'The Pentateuch does not expressly state a refusal to give up idolatry in Egypt'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'It is true that there is nothing expressly stated in the Pentateuch as to the refusal of the Israelites to obey the command of God, or their unwillingness to give up idolatry in Egypt'
  - where: 'note 20:7 “Idolatry in Egypt”'
    claim: 'It is inferred from Exodus 6:9, 12 and from the golden calf'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'the Israelites did not hearken to Moses when he communicated to them the determination of God to lead them out of Egypt, and still more plainly from their relapse into Egyptian idolatry, from the worship of the golden calf at Sinai'
  - where: 'note 20:7 “Idolatry in Egypt”'
    claim: 'Leviticus 17:7 and Joshua 24:14 are the passages that mention Egyptian idolatry'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'Egyptian idolatry is only mentioned in Leviticus 17:7 (cf. Joshua 24:14)'
  - where: 'note 20:7 “Idolatry in Egypt”'
    claim: 'Joshua told Israel to put away the gods their fathers served in Egypt'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'put away the gods which your fathers served on the other side of the flood, and in Egypt'
  - where: 'note 20:7 “Idolatry in Egypt”'
    claim: 'The law speaks of sacrifices offered to devils'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/17?lang=eng'
    quote: 'And they shall no more offer their sacrifices unto devils, after whom they have gone a whoring'
  - where: 'note 20:7 “Idolatry in Egypt”'
    claim: '“Abominations of their eyes” is explained of abominable things looked on with delight'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'although they were abominable and execrable things, they were looked upon with delight by them'
  - where: 'note 20:7 “Idolatry in Egypt”'
    claim: 'The history is a picture of the nation’s apostasy from the earliest time'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'the following picture of the apostasy of the nation from time immemorial'

  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'The verb halal in the Niphal means be polluted, defiled, and is used of the name of God in 20:9, 14, 22'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'be polluted, defiled, of holy places Ezekiel 7:24; Ezekiel 25:3, name of God Ezekiel 20:9,14,22'
  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'The same verb is used of profaning the sabbath in 20:13, 16, 21, 24'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'the sabbath Exodus 31:14 (P), Isaiah 56:2,6; Ezekiel 20:13,16,21,24'
  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'Modern translations have “profaned”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2020&version=ESV'
    quote: 'that it should not be profaned in the sight of the nations'
  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'Moses argued after the golden calf from what the Egyptians would say'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'Wherefore should the Egyptians speak, and say, For mischief did he bring them out, to slay them in the mountains'
  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'Moses argued at the borders of the land from what the nations would say'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Because the Lord was not able to bring this people into the land which he sware unto them, therefore he hath slain them in the wilderness.'
  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'Had the Lord destroyed Israel, the heathen might have said He was unable to deliver His people; Numbers 14:16 and Exodus 32:12 are compared'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'The heathen might then have said that Jehovah had been unable to liberate His people from their hand and power (cf. Numbers 14:16 and Exodus 32:12)'
  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'The threat of 20:13 is compared with Exodus 32:10 and Numbers 14:11–12'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'For the threat referred to in Ezekiel 20:13, compare Exodus 32:10; Numbers 14:11-12.'
  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'The decree to cut Israel off was revoked at Moses’s intercession'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'after He had revoked the decree to cut Israel off, at the intercession of Moses'
  - where: 'note 20:9 “Spared three times for the sake of the name”'
    claim: 'Ezekiel 36:22 says the Lord acts not for their sakes but for His holy name’s sake'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'I do not this for your sakes, O house of Israel, but for mine holy name’s sake'

  - where: 'note 20:11 “The law that gives life”'
    claim: 'The clause is from Leviticus 18:5'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'Ye shall therefore keep my statutes, and my judgments: which if a man do, he shall live in them'
  - where: 'note 20:11 “The law that gives life”'
    claim: 'Nehemiah 9:29 uses the clause of the judgments Israel sinned against'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'but sinned against thy judgments, (which if a man do, he shall live in them;)'
  - where: 'note 20:11 “The law that gives life”'
    claim: 'Paul quotes the clause as Moses’s description of the righteousness of the law'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'For Moses describeth the righteousness which is of the law, That the man which doeth those things shall live by them.'
  - where: 'note 20:11 “The law that gives life”'
    claim: 'Paul quotes the clause again in Galatians'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'The man that doeth them shall live in them.'

  - where: 'note 20:12 “The Sabbath as the sign”'
    claim: 'Exodus 31:13 has nearly the wording of verse 12'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/31?lang=eng'
    quote: 'Verily my sabbaths ye shall keep: for it is a sign between me and you throughout your generations; that ye may know that I am the Lord that doth sanctify you.'
  - where: 'note 20:12 “The Sabbath as the sign”'
    claim: 'The verb for polluting the sabbaths (20:13, 16, 21, 24) is the verb used of the name in 20:9, 14, 22'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'the sabbath Exodus 31:14 (P), Isaiah 56:2,6; Ezekiel 20:13,16,21,24'

  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'The Hebrew of verse 25 is “statutes not good” (huqqim lo tovim), with no “my”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'טוֹבִ֑ים'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'One reading: since they would not follow His good statutes, He gave them their own (20:18) and their fathers’'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/20.htm'
    quote: 'Since they would not follow My statutes that were good, "I gave them" their own (Eze 20:18) and their fathers'' "which were not good"'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'The statutes not good are not the ceremonial commandments of the Mosaic law, though some earlier commentators supposed so'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'It is perfectly self-evident that we are not to understand by these statutes and rights, which were not good, either the Mosaic commandments of the ceremonial law, as some of the Fathers and earlier Protestant commentators supposed'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'The commandments God gave were good and had the promise of life'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'The ceremonial commandments given by God were good, and had the promise attached to them, that obedience to them would give life'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'The example in verse 26 is the sacrifice of the firstborn'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'consisted in their causing that which opened the womb to pass through, i.e., in the sacrifice of the first-born'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'The law forbade passing children through the fire to Molech'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'And thou shalt not let any of thy seed pass through the fire to Molech'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'One answer: God is said to do what He only permits'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/20.htm'
    quote: 'in which God is a thousand times said to do, what in the course of his providence or justice he only permits to be done'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'On that answer He abandoned them to the customs of the heathen'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/20.htm'
    quote: 'then he abandoned them, and they abandoned themselves to the customs and ordinances of the heathen'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'On that answer God never gave any such law'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/20.htm'
    quote: 'God never gave any such, at any time, to any people'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'The other answer: “give” is a judicial sentence and more than permission'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'can only be used in the sense of a judicial sentence, and must not be taken merely as indicating divine permission'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'Acts 7:42 is set beside the verse, and child sacrifice is called a statute sternly prohibited in the law'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'Acts 7:42 ("God turned, and gave them up to worship the host of heaven"), in the sense of hardening, whereby whoever will not renounce idolatry is so given up to its power, that it draws him deeper and deeper in'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'Child sacrifice was sternly prohibited in the law of God'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/20.htm'
    quote: 'a statute so sternly prohibited in the law of God'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'Psalm 81:12 is set beside the verse as righteous retribution'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/20.htm'
    quote: 'Righteous retribution (Ps 81:12; Ho 8:11; Ro 1:24; 2Th 2:11). Eze 20:39 proves this view to be correct'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'Psalm 81:12 speaks of the Lord giving Israel up'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/81?lang=eng'
    quote: 'So I gave them up unto their own hearts’ lust: and they walked in their own counsels.'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'Acts 7:42 speaks of God giving Israel up'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'Then God turned, and gave them up to worship the host of heaven'
  - where: 'note 20:25 “Statutes that were not good”'
    claim: 'Verse 39 is not a command to serve idols but a judicial declaration'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/20.htm'
