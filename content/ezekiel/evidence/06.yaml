chapter: 6
claims:
  - where: 'when'
    claim: 'The book’s first date is the fifth year of Jehoiachin’s captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'The next date in the book is the sixth year, at 8:1'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'Ezekiel was carried away with Jehoiachin, settled at Tel Abib on the Chebar, and prophesied 592–570 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin. He settled at Tel Abib on the Chebar and prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'The second date in the book is the sixth year (8:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month'
  - where: 'setting'
    claim: 'The deportation that followed Jerusalem’s fall was in 586 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'Chapter 5 is about the judgment of Jerusalem itself'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'The judgment of Jerusalem will include famine, pestilence, war, and the scattering of her inhabitants.'
  - where: 'setting'
    claim: 'Chapters 6 and 7 are two further oracles that develop the judgment shown in the signs of chapters 4–5'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'are appended in Ezekiel 6:1-14 and 7 two additional oracles, which present a further development of the contents of these signs, the judgment portrayed by them in its extent and greatness'
  - where: 'setting'
    claim: 'The chapter takes up the threat of Leviticus 26:30'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'The announcement of their destruction is appended to the threatening in Leviticus 26:30, which Ezekiel takes up and describes at greater length.'
  - where: 'setting'
    claim: 'Leviticus 26:30 threatens high places, images, and carcases on idols'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will destroy your high places, and cut down your images, and cast your carcases upon the carcases of your idols'
  - where: 'setting'
    claim: 'Leviticus 26:33 threatens scattering and the sword'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will scatter you among the heathen, and will draw out a sword after you'
  - where: 'setting'
    claim: 'Leviticus 26 is the antecedent of the warnings: Moses’ warnings to Israel if they broke the covenant'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'But if they broke that covenant, then Moses began a series of grim warnings (see Leviticus 26:14–39'
  - where: 'thread'
    claim: 'The judgment is the one warned of in Leviticus 26:30–33'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'and your land shall be desolate, and your cities waste'
  - where: 'thread'
    claim: 'Verses 8–10 add the prospect of a remnant converted among the nations, between two descriptions of judgment'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'and to this is added the prospect of a remnant of the people, who are dispersed among the heathen, coming to be converted to the Lord (Ezekiel 6:8-10)'
  - where: 'thread'
    claim: 'The warnings of Leviticus 26 are the antecedent of Ezekiel’s judgments'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Probably the most important historical and prophetic antecedent dates back to Moses and his warnings to the people of Israel'
  - where: 'thread'
    claim: 'Verses 13–14 return to the thoughts of verses 4–7'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'the thoughts in Ezekiel 6:13 and Ezekiel 6:14 are only a variation of Ezekiel 6:4-7'

  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'Ezekiel is among the captives in Babylon, at Tel Abib on the Chebar'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'He settled at Tel Abib on the Chebar'
  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'Verse 3 widens the address and names the high places'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'to the mountains, and to the hills, to the rivers, and to the valleys; Behold, I, even I, will bring a sword upon you, and I will destroy your high places.'
  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'Altars on hilltops were an early custom'
    key: 'bd-high-places'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'Among early nations it was the custom to erect altars on hilltops'
  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'Israel had altars to Jehovah at several high places, which became local centers of His worship'
    key: 'bd-high-places'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'Altars to Jehovah were built at several high places… Such altars became local centers of the worship of Jehovah.'
  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'With idolatry many of these altars were turned to heathen worship'
    key: 'bd-high-places'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'When idolatry came in, many of these altars were desecrated and used for heathen worship.'
  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'Deuteronomy 12:2 commanded Israel to destroy the nations’ places of worship on mountains, hills, and under green trees'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'Ye shall utterly destroy all the places, wherein the nations which ye shall possess served their gods, upon the high mountains, and upon the hills, and under every green tree'
  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'Verse 13 has the same list of hill, mountain, and green tree'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'upon every high hill, in all the tops of the mountains, and under every green tree'
  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'Ezekiel 36:4 addresses the land in the same fourfold words'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'to the mountains, and to the hills, to the rivers, and to the valleys, to the desolate wastes'
  - where: 'note 6:2 “Why the mountains are addressed”'
    claim: 'Ezekiel 36:8 promises the mountains fruit for the returning people'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to my people of Israel; for they are at hand to come.'

  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'The Hebrew behind “images” in 6:4 is hammanim (H2553)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חַמָּֽנֵי'
  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'hamman means a sun-pillar used in idolatrous worship, and stands beside “high places” in Lev. 26:30 and Ezek. 6:4, 6'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2553.htm'
    quote: 'sun-pillar, used in idolatrous worship'
  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'The Hebrew behind “idols” in 6:4 is gillulim (H1544)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'גִּלּוּלֵי'
  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'gillulim is explained as logs, blocks, shapeless things, with another explanation, dungy things; 39 times in Ezekiel; also in Lev. 26:30'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1544.htm'
    quote: 'only plural idols (= logs, blocks, shapeless things'
  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'Another explanation recorded is “dungy things”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1544.htm'
    quote: 'dungy things'
  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'The word occurs 39 times in Ezekiel'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1544.htm'
    quote: 'idols (39 t. Ezekiel)'
  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'Six of the occurrences are in chapter 6 (verses 4, 5, 6, 9, and 13 twice), by the count of scripts/hebrew.mjs ezekiel --word 1544'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'גִּלּֽוּלֵי'
  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'High places, images (hammanim), and idols (gillulim) stand together in Leviticus 26:30'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will destroy your high places, and cut down your images, and cast your carcases upon the carcases of your idols, and my soul shall abhor you.'
  - where: 'note 6:4 “Sun-pillars and a scornful word for idols”'
    claim: 'The lexicon lists the Leviticus 26:30 form of hammanim with the Ezekiel 6 verses'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2553.htm'
    quote: 'Leviticus 26:30 (H), 2 Chron 14:4, compare Ezekiel 6:4,6'

  - where: 'note 6:5 “Bones around the altars”'
    claim: 'Josiah filled the places of the images and groves with human bones'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And he brake in pieces the images, and cut down the groves, and filled their places with the bones of men.'
  - where: 'note 6:5 “Bones around the altars”'
    claim: 'Josiah burned bones from the sepulchres on the altar and so polluted it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'took the bones out of the sepulchres, and burned them upon the altar, and polluted it'
  - where: 'note 6:5 “Bones around the altars”'
    claim: 'Josiah’s reform removed the high places'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And he slew all the priests of the high places that were there upon the altars, and burned men’s bones upon them'
  - where: 'note 6:5 “Bones around the altars”'
    claim: 'In 6:5 the dead are laid before the idols'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'And I will lay the dead carcases of the children of Israel before their idols; and I will scatter your bones round about your altars.'
  - where: 'note 6:5 “Bones around the altars”'
    claim: 'Bones scattered round an altar were reckoned a pollution of it, as at 2 Kings 23:14'
    key: 'gill-exposition'
    url: 'https://biblehub.com/commentaries/gill/ezekiel/6.htm'
    quote: 'which were reckoned a pollution of them; see 2 Kings 23:14'

  - where: 'note 6:7 “Ye shall know that I am the LORD”'
    claim: 'The sentence comes in verses 7, 10, 13, and 14'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'And the slain shall fall in the midst of you, and ye shall know that I am the'
  - where: 'note 6:7 “Ye shall know that I am the LORD”'
    claim: 'In verse 10 the survivors also learn that He did not speak in vain'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'and that I have not said in vain that I would do this evil unto them'
  - where: 'note 6:7 “Ye shall know that I am the LORD”'
    claim: 'In verse 13 the knowledge comes when the slain lie among the idols'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'when their slain men shall be among their idols round about their altars'
  - where: 'note 6:7 “Ye shall know that I am the LORD”'
    claim: 'In verse 14 the sentence follows the desolation of the land'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'So will I stretch out my hand upon them, and make the land desolate'
  - where: 'note 6:7 “Ye shall know that I am the LORD”'
    claim: 'The sentence is still being said near the end of the book (39:28)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/39?lang=eng'
    quote: 'Then shall they know that I am the'
  - where: 'note 6:8 “A remnant that remembers”'
    claim: 'Ezekiel’s harshest judgments are followed at once by hope, and 6:8–10 is an example given'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'even the most harsh and caustic predictions and judgments were counterbalanced by an immediate addendum of hope'
  - where: 'note 6:8 “A remnant that remembers”'
    claim: 'The article cites 6:8–10 after the bones before the altars of 6:4–5'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'the bones of the people will lie unburied before the altars of their false gods (see Ezekiel 6:4–5), the Lord tells Ezekiel: “Yet will I leave a remnant'
  - where: 'note 6:8 “A remnant that remembers”'
    claim: 'The remnant remembers among the nations where they are captives, and loathes itself'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'shall remember me among the nations whither they shall be carried captives'
  - where: 'note 6:8 “A remnant that remembers”'
    claim: 'They loathe themselves for the evils they committed'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'and they shall lothe themselves for the evils which they have committed in all their abominations'
  - where: 'note 6:8 “A remnant that remembers”'
    claim: 'The phrase recurs at 20:43, after the Lord brings them into the land (20:42)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And there shall ye remember your ways, and all your doings, wherein ye have been defiled; and ye shall lothe yourselves in your own sight'
  - where: 'note 6:8 “A remnant that remembers”'
    claim: 'The phrase recurs at 36:31'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'and shall lothe yourselves in your own sight for your iniquities and for your abominations'

  - where: 'note 6:9 “Who is broken?”'
    claim: 'The verb is nishbarti (H7665), Niphal perfect, first person singular'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נִשְׁבַּ֜רְתִּי'
  - where: 'note 6:9 “Who is broken?”'
    claim: 'The ESV keeps the Lord as the one broken'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+6%3A9-14&version=ESV'
    quote: 'I have been broken over their whoring heart that has departed from me'
  - where: 'note 6:9 “Who is broken?”'
    claim: 'The NRSVUE has the Lord crushed'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+6%3A9-14&version=NRSVUE'
    quote: 'how I was crushed by their wanton heart that turned away from me'
  - where: 'note 6:9 “Who is broken?”'
    claim: 'The lexicon also lists Ezekiel 6:9 where the verb means to break the heart, with a pointer to its Niphal section'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7665.htm'
    quote: 'break, rupture, heart (figurative) Psalm 69:21'
  - where: 'note 6:9 “Who is broken?”'
    claim: 'The Niphal has been taken as middle, not passive: the Lord breaks their heart to Himself'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'here is not to be taken as passive, but middle'
  - where: 'note 6:9 “Who is broken?”'
    claim: 'That reading translates “when I have broken to me their whorish heart”'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'when I have broken to me their whorish heart, which had departed from me'
  - where: 'note 6:9 “Who is broken?”'
    claim: 'The Septuagint has an oath instead of breaking'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/6.htm'
    quote: 'I have sworn an oath against their heart that goes a-whoring from me'
  - where: 'note 6:9 “Who is broken?”'
    claim: '“Whorish heart” refers to Israel’s idolatry'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The expression “whorish heart” refers to the idolatry practiced by Israel.'
  - where: 'note 6:9 “Who is broken?”'
    claim: 'The prophets’ figure makes Jehovah the husband and Israel the wife'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'These metaphors are used in the same way as those used by Hosea, Jeremiah, Ezekiel, and others in which Jehovah is the husband and the nation Israel is the wife.'
  - where: 'note 6:9 “Who is broken?”'
    claim: 'In chapter 16 the husband represents the Lord'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The husband represents the Lord (see Ezekiel 16:8, 32, 38).'

  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'To smite with the hand is to strike one hand against the other, to clap'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: '"to strike one hand against the other," i.e., "to clap the hands;" cf. Numbers 24:10'
  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'Clapping and stamping are gestures of violent excitement'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'Through clapping of the hands and stamping of the feet - the gestures which indicate violent excitement'
  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'The gestures make known the Lord’s displeasure at the idolatry'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'the displeasure of Jehovah at the horrible idolatry of the people'
  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'Balak struck his hands together in anger'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'And Balak’s anger was kindled against Balaam, and he smote his hands together'
  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'The Lord says He will smite His hands together in fury'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'I will also smite mine hands together, and I will cause my fury to rest'
  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'The Hebrew behind “Alas” is ach (H253)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אָ֔ח'
  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'ach is an interjection, ah! alas!, at Ezek. 6:11 and 21:20 (Hebrew numbering; 21:15 in the King James)'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/253.htm'
    quote: 'interjection (onomatopoetic) ah! alas! Ezekiel 6:11; Ezekiel 21:20'
  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'It is an exclamation of lamentation, only here and once in chapter 21'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/6.htm'
    quote: 'an exclamation of lamentation, occurring only here and in Ezekiel 21:20'
  - where: 'note 6:11 “Clapping, stamping, and Alas”'
    claim: 'The Septuagint renders the cry “Aha, aha!”'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/6.htm'
    quote: 'Clap with thy hand, and stamp with thy foot and say, Aha, aha! for all the abominations of the house of Israel'

  - where: 'note 6:12 “Far off, near, and left in the city”'
    claim: 'In chapter 5 Ezekiel shaves and divides his hair'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'then take thee balances to weigh, and divide the hair'
  - where: 'note 6:12 “Far off, near, and left in the city”'
    claim: 'Chapter 5 names pestilence, famine, and the sword (with scattering) at the sign of the hair'
    key: 'lds-scriptures'
