  # ---------- note 3:26 ----------
  - where: 'note 3:26 “A watchman made silent”'
    claim: 'One reading: the unrighteous rose against Ezekiel, binding him physically or by rejecting his message'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'the unrighteous rose up against Ezekiel. They sought to quiet his preaching and hinder his work, either by physical binding and confinement (though there is no scriptural record that this did actually happen), or by rejecting his message'
  - where: 'note 3:26 “A watchman made silent”'
    claim: 'Another reading: no hostile act by the exiles is recorded in the book'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/3.htm'
    quote: 'of hostile attacks by the exiles upon the prophet there is not a trace to be discovered in the entire remainder of the book'
  - where: 'note 3:26 “A watchman made silent”'
    claim: 'In 4:8 it is God who binds him'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/3.htm'
    quote: 'according to Ezekiel 4:8, it is also God who binds him with cords'
  - where: 'note 3:26 “A watchman made silent”'
    claim: 'The binding is by a spiritual power, not material cords'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/3.htm'
    quote: 'but God binds him by a spiritual power, so that he can neither leave his house nor go forth to his countrymen'
  - where: 'note 3:26 “A watchman made silent”'
    claim: 'The silence is not total: he speaks when God inspires him'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/3.htm'
    quote: 'the prophet is not to keep entire silence, except when God inspires him to speak'
  - where: 'note 3:26 “A watchman made silent”'
    claim: 'He reproves only as God directs'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/3.htm'
    quote: 'will place their sins before them to no greater extent, and in no other way, than God expressly directs him'
  - where: 'note 3:26 “A watchman made silent”'
    claim: 'People could come to him in his house'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/3.htm'
    quote: 'From this it is seen that his contemporaries might come to him and observe his proceedings.'
  - where: 'note 3:26 “A watchman made silent”'
