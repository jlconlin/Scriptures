chapter: 3
claims:
  # ---------- when, setting ----------
  - where: 'when'
    claim: 'The vision that chapter 3 continues is dated to the fifth year of king Jehoiachin''s captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'In the fifth day of the month, which was the fifth year of king Jehoiachin’s captivity,'
  - where: 'when'
    claim: 'Ezekiel''s ministry began about 592 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'The vision is dated to the fifth year of the captivity and set among the captives by the river of Chebar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'as I was among the captives by the river of Chebar, that the heavens were opened, and I saw visions of God.'
  - where: 'setting'
    claim: 'About 592 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'The roll was held out in a hand in 2:9–10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/2?lang=eng'
    quote: 'behold, an hand was sent unto me; and, lo, a roll of a book was therein;'
  - where: 'setting'
    claim: 'Ezekiel lived at Tel-abib on the Chebar'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'He settled at Tel Abib on the Chebar'
  - where: 'setting'
    claim: 'The Church''s chapter heading summarizes the chapter from the watchman verses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Ezekiel is made a watchman unto the house of Israel'
  - where: 'setting'
    claim: 'The symbolic acts of chapters 4–5 follow, performed in his house'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/3.htm'
    quote: 'he is to perform in his own house what is commanded him in Ezekiel 4 and 5'
  - where: 'setting'
    claim: 'The watchman''s charge returns in Ezekiel 33:7–9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'So thou, O son of man, I have set thee a watchman unto the house of Israel; therefore thou shalt hear the word at my mouth, and warn them from me.'
  - where: 'setting'
    claim: 'Chapters 33–39 are the book''s prophecies of restoration, after the judgments of 1–24'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(1) 1–24, prophecies of judgment against Jerusalem and the nation; (2) 25–32, prophecies against Israel’s enemies; (3) 33–39, prophecies of restoration'
  - where: 'setting'
    claim: 'The dumbness is lifted when word comes that the city is smitten (33:21–22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'one that had escaped out of Jerusalem came unto me, saying, The city is smitten.'

  # ---------- section plain ----------
  - where: 'section 2 plain'
    claim: 'Verse 5: obscure speech and difficult language'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%203&version=NRSVUE'
    quote: 'For you are not sent to a people of obscure speech and difficult language but to the house of Israel'
  - where: 'section 2 plain'
    claim: 'Verse 7: hard foreheads and stubborn hearts'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%203&version=NRSVUE'
    quote: 'all the house of Israel have a hard forehead and a stubborn heart'
  - where: 'section 2 plain'
    claim: 'Verse 11: “them of the captivity” are the exiles'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%203&version=NRSVUE'
    quote: 'then go to the exiles, to your people, and speak to them'
  - where: 'section 3 plain'
    claim: 'Verse 14: “the heat of my spirit” is rage, anger'
    key: bdb
    url: 'https://biblehub.com/hebrew/2534.htm'
    quote: 'Ezekiel 3:14 the rage of my spirit.'
  - where: 'section 3 plain'
    claim: 'Verse 15: “astonished” rendered “stunned”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%203&version=NRSVUE'
    quote: 'And I sat there among them, stunned, for seven days.'
  - where: 'section 4 plain'
    claim: 'Verse 17: “whenever you hear a word from my mouth, you shall give them warning”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%203&version=NRSVUE'
    quote: 'whenever you hear a word from my mouth, you shall give them warning from me'

  # ---------- note 3:1 ----------
  - where: 'note 3:1 “Eating the roll”'
    claim: 'The roll was written with lamentations, mourning, and woe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/2?lang=eng'
    quote: 'and there was written therein lamentations, and mourning, and woe.'
  - where: 'note 3:1 “Eating the roll”'
    claim: 'Eating written words represented internalizing and memorizing them'
    key: sc-knowhy-306
    url: 'https://scripturecentral.org/knowhy/how-can-one-feast-upon-the-words-of-christ'
    quote: 'written words represented internalizing and memorizing them. Thus, once Ezekiel “ate” the words of the Lord, he was able to speak them because he knew them.'
  - where: 'note 3:1 “Eating the roll”'
    claim: 'Jeremiah, a contemporary in Jerusalem, also ate the Lord''s words and had joy'
    key: sc-knowhy-306
    url: 'https://scripturecentral.org/knowhy/how-can-one-feast-upon-the-words-of-christ'
    quote: 'said that he had eaten the words of the Lord and experienced joy (Jeremiah 15:16)'
  - where: 'note 3:1 “Eating the roll”'
    claim: 'The Psalms call the word sweet like honey'
    key: sc-knowhy-306
    url: 'https://scripturecentral.org/knowhy/how-can-one-feast-upon-the-words-of-christ'
    quote: 'The Psalms also describe the word of the Lord as sweet like honey (Psalm 19:10; 119:103).'
  - where: 'note 3:1 “Eating the roll”'
    claim: 'The Lord''s word can be sweet even when it brings sorrow'
    key: sc-knowhy-306
    url: 'https://scripturecentral.org/knowhy/how-can-one-feast-upon-the-words-of-christ'
    quote: 'word brings sorrow, it can still be sweet'
  - where: 'note 3:1 “Eating the roll”'
    claim: 'Jeremiah 15:16 is the Church edition''s footnote reference at verse 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Jer. 15:16; Ezek. 2:8; Rev. 10:10 (9–10)'
  - where: 'note 3:1 “Eating the roll”'
    claim: 'A heavenly book is a feature shared by Lehi''s and Ezekiel''s calls'
    key: sc-knowhy-459
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-first-visions-so-similar-to-much-later-apocalyptic-writings'
    quote: 'a heavenly book (1 Nephi 1:11–12; Ezekiel 2:8–10)'
  - where: 'note 3:1 “Eating the roll”'
    claim: 'Lehi was given a book, read woe to Jerusalem, and praised God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'gave unto him a book, and bade him that he should read.'

  # ---------- note 3:5 ----------
  - where: 'note 3:5 “Not a problem of language”'
    claim: 'The two adjectives in verses 5–6 are H6012 and H3515'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'עִמְקֵ֥י'
  - where: 'note 3:5 “Not a problem of language”'
    claim: 'The first adjective means deep, here unintelligible of speech'
    key: bdb
    url: 'https://biblehub.com/hebrew/6012.htm'
    quote: 'adjective deep, unfathomable'
  - where: 'note 3:5 “Not a problem of language”'
    claim: 'In Ezekiel 3:5–6 it means unintelligible of speech'
    key: bdb
    url: 'https://biblehub.com/hebrew/6012.htm'
    quote: 'i.e. unintelligible of speech Isaiah 33:19; Ezekiel 3:5,6'
  - where: 'note 3:5 “Not a problem of language”'
    claim: 'The second adjective means heavy, and occurs twice in Exodus 4:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/3515.htm'
    quote: 'adjective heavy'
  - where: 'note 3:5 “Not a problem of language”'
    claim: 'It is used of a hard language in Ezekiel 3:5–6'
    key: bdb
    url: 'https://biblehub.com/hebrew/3515.htm'
    quote: 'd. hard, difficult, of a thing to be done Exodus 18:18 (E) Numbers 11:14 (J); of a language to be understood Ezekiel 3:5,6.'
  - where: 'note 3:5 “Not a problem of language”'
    claim: 'A modern translation: obscure speech and difficult language'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%203&version=NRSVUE'
    quote: 'a people of obscure speech and difficult language'
  - where: 'note 3:5 “Not a problem of language”'
    claim: 'The Church edition''s footnote at verse 6 gives Matthew 11:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Matt. 11:21 (21, 23)'

  # ---------- note 3:8 ----------
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: '“Impudent” in verse 7 is stout of forehead, that is, obstinate'
    key: bdb
    url: 'https://biblehub.com/hebrew/4696.htm'
    quote: 'Ezekiel 3:7 the house of Israel are stout of forehead (i.e. obstinate;'
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: 'The adjective in verse 8 means firm, hard, of face and forehead'
    key: bdb
    url: 'https://biblehub.com/hebrew/2389.htm'
    quote: 'e. firm, hard, of face'
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: 'The same adjective is used of Israel in verse 7: hard (impudent) of forehead'
    key: bdb
    url: 'https://biblehub.com/hebrew/2389.htm'
    quote: 'Ezekiel 3:7 hard (= impudent) of forehead'
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: 'The adjective H2389 stands once in verse 7, twice in verse 8, and once in verse 9; forehead (H4696) in verses 7, 8 (twice), and 9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חֲזָקִ֖ים'
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: 'Shamir, adamant, is a figure of the prophet''s firmness here and of a hard heart in Zechariah 7:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/8068.htm'
    quote: 'firmness Ezekiel 3:9; Zechariah 7:12 figurative of hard heart.'
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: 'Ezekiel means “God will strengthen”'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'God will strengthen.'
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: 'The name is formed from the verb chazaq and el'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/3168.htm'
    quote: 'God will strengthen; Jechezkel, the name of two Israelites'
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: 'The lexicon gives the name as “God strengtheneth”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3168.htm'
    quote: 'proper name, masculine (God strengtheneth, compare foregoing'
  - where: 'note 3:8 “A forehead as hard as theirs”'
    claim: 'The verb chazaq (H2388) is the verb of verse 14, “was strong”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חָזָֽקָה'

  # ---------- note 3:12 ----------
  - where: 'note 3:12 “A voice of praise behind him”'
    claim: 'The words are probably the acclamation of the living creatures'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/3.htm'
    quote: 'Blessed be the glory of the Lord - Probably the acclamation of the living creatures'
  - where: 'note 3:12 “A voice of praise behind him”'
    claim: 'A comparison of Lehi''s and Ezekiel''s calls lists angelic songs of praise, 1 Nephi 1:14 beside Ezekiel 3:12'
    key: sc-knowhy-459
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-first-visions-so-similar-to-much-later-apocalyptic-writings'
    quote: 'angelic songs of praise (1 Nephi 1:14; Ezekiel 3:12)'
  - where: 'note 3:12 “A voice of praise behind him”'
    claim: 'Lehi exclaimed praise after reading the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'when my father had read and seen many great and marvelous things, he did exclaim many things unto the Lord'
  - where: 'note 3:12 “A voice of praise behind him”'
    claim: 'The Septuagint has the blessing, as the King James Version does'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/3.htm'
    quote: 'Blessed be the glory of the Lord from his place'
  - where: 'note 3:12 “A voice of praise behind him”'
    claim: 'The NRSVue has no spoken blessing in verse 12'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%203&version=NRSVUE'
    quote: 'as the glory of the Lord rose from its place, I heard behind me the sound of loud rumbling'

  # ---------- note 3:14 ----------
  - where: 'note 3:14 “Sweet in the mouth, bitter on the way”'
    claim: 'Mar is the word for a bitter taste, of food opposed to sweet (matoq)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4751.htm'
    quote: 'food Proverbs 27:7 (opposed to מָתוֺק)'
  - where: 'note 3:14 “Sweet in the mouth, bitter on the way”'
    claim: 'The lexicon''s entry for mar, bitter, bitterness'
    key: bdb
    url: 'https://biblehub.com/hebrew/4751.htm'
    quote: 'adjective and substantive bitter, bitterness'
  - where: 'note 3:14 “Sweet in the mouth, bitter on the way”'
    claim: 'Verse 3 has matoq (H4966), sweet, and verse 14 has mar (H4751)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'לְ/מָתֽוֹק'
  - where: 'note 3:14 “Sweet in the mouth, bitter on the way”'
    claim: '“The heat of my spirit” is the rage of my spirit'
    key: bdb
    url: 'https://biblehub.com/hebrew/2534.htm'
    quote: 'Ezekiel 3:14 the rage of my spirit.'
  - where: 'note 3:14 “Sweet in the mouth, bitter on the way”'
    claim: 'The Septuagint has no word for bitterness in verse 14'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/3.htm'
    quote: 'and I went in the impulse of my spirit; and the hand of the Lord was mighty upon me.'
  - where: 'note 3:14 “Sweet in the mouth, bitter on the way”'
    claim: 'Elder McConkie on John''s bitterness, as the Student Manual prints him'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'word was sent caused him to despair and have sorrow of soul'
  - where: 'note 3:14 “Sweet in the mouth, bitter on the way”'
    claim: 'Elder McConkie said Ezekiel had a similar experience'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Ezekiel had a similar experience. He was commanded to eat a roll (a book)'
  - where: 'note 3:14 “Sweet in the mouth, bitter on the way”'
    claim: 'John ate the little book: sweet in the mouth, bitter in the belly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/10?lang=eng'
    quote: 'it was in my mouth sweet as honey: and as soon as I had eaten it, my belly was bitter.'

  # ---------- note 3:15 ----------
  - where: 'note 3:15 “Seven days at Tel-abib”'
    claim: 'Tel-abib was a location in Babylonia on the Chebar'
    key: bdb
    url: 'https://biblehub.com/hebrew/8512.htm'
    quote: 'proper name, of a location in Babylonia on the'
  - where: 'note 3:15 “Seven days at Tel-abib”'
    claim: 'The Chebar was a canal off the Euphrates north of Babylon, where many exiles lived'
    key: bd-chebar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chebar?lang=eng'
    quote: 'A canal or waterway that left the Euphrates River north of Babylon and flowed 60 miles southeast before reentering the Euphrates. On its banks lived many of the exiles carried from Judah by Nebuchadnezzar'
  - where: 'note 3:15 “Seven days at Tel-abib”'
    claim: 'Ezekiel settled at Tel-abib'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'He settled at Tel Abib on the Chebar'
  - where: 'note 3:15 “Seven days at Tel-abib”'
    claim: 'The participle in verse 15 means showing horror'
    key: bdb
    url: 'https://biblehub.com/hebrew/8074.htm'
    quote: 'Ezekiel 3:15 shewing horror'
  - where: 'note 3:15 “Seven days at Tel-abib”'
    claim: 'A modern translation has “stunned”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%203&version=NRSVUE'
    quote: 'And I sat there among them, stunned, for seven days.'

  # ---------- note 3:17 ----------
  - where: 'note 3:17 “The watchman”'
    claim: 'The verb behind “watchman” means look out, spy, keep watch'
    key: bdb
    url: 'https://biblehub.com/hebrew/6822.htm'
    quote: 'verb look out or about, spy keep watch'
  - where: 'note 3:17 “The watchman”'
    claim: 'The participle is the watchman of Samuel and Kings and is used figuratively of prophets in Hosea, Jeremiah, Ezekiel, and Isaiah'
    key: bdb
    url: 'https://biblehub.com/hebrew/6822.htm'
    quote: 'figurative of prophets Hosea 9:8; Jeremiah 6:17; Ezekiel 3:17; Ezekiel 33:7; Isaiah 56:10'
  - where: 'note 3:17 “The watchman”'
    claim: 'The word in verse 17 is the participle of H6822'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'צֹפֶ֥ה'
  - where: 'note 3:17 “The watchman”'
    claim: 'What ancient watchmen were'
    key: ensign-watchmen
    url: 'https://www.churchofjesuschrist.org/study/ensign/2016/04/watchmen-on-the-tower?lang=eng'
    quote: 'Watchmen were sentries stationed on a wall or in a tower in order to look out for and warn of dangers approaching from afar.'
  - where: 'note 3:17 “The watchman”'
    claim: 'A military watchman faced execution for failing to warn'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The analogy of the watchman referred to the military watchman who had to stay awake and who faced execution if he failed to warn the city when the enemy appeared.'
  - where: 'note 3:17 “The watchman”'
    claim: 'Ezekiel 33:1–9 gives the parable of the sword, the trumpet, and the watchman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'If when he seeth the sword come upon the land, he blow the trumpet, and warn the people;'

  # ---------- note 3:18 ----------
  - where: 'note 3:18 “Answerable for the warning, not for the outcome”'
    claim: 'The Bible Dictionary names chapters 3 and 18 for the prophet''s warning and individual responsibility'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'Ezek. 3 and 18, which show the significance of a prophet’s warning and the individual responsibility of every person for the consequences of his own behavior'
  - where: 'note 3:18 “Answerable for the warning, not for the outcome”'
    claim: 'Jacob and Joseph answered for the people''s sins if they did not teach'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/1?lang=eng'
    quote: 'answering the sins of the people upon our own heads if we did not teach them the word of God with all diligence'
  - where: 'note 3:18 “Answerable for the warning, not for the outcome”'
    claim: 'The footnote on “blood” at Jacob 1:19 gathers Acts 20:26 and Mosiah 2:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/1?lang=eng'
    quote: 'Acts 20:26; 2 Ne. 9:44; Mosiah 2:27'
  - where: 'note 3:18 “Answerable for the warning, not for the outcome”'
    claim: 'Jacob 1:19 is placed under the Topical Guide heading Priesthood, Magnifying Callings within'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/1?lang=eng'
    quote: 'TG Leadership; Priesthood, Magnifying Callings within.'
  - where: 'note 3:18 “Answerable for the warning, not for the outcome”'
    claim: 'Ezekiel 3:17 is placed under the same Topical Guide heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'TG Priesthood, Magnifying Callings within.'
  - where: 'note 3:18 “Answerable for the warning, not for the outcome”'
    claim: 'King Benjamin gathered his people to rid his garments of their blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'that I might rid my garments of your blood'
  - where: 'note 3:18 “Answerable for the warning, not for the outcome”'
    claim: 'Paul declared himself pure from the blood of all men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/20?lang=eng'
    quote: 'I am pure from the blood of all men.'

  # ---------- note 3:20 ----------
  - where: 'note 3:20 “The stumblingblock the Lord lays”'
    claim: 'In Ezekiel 3:20 the word is figurative of calamity, in divine judgment, with Jeremiah 6:21'
    key: bdb
    url: 'https://biblehub.com/hebrew/4383.htm'
    quote: 'b. figurative of misfortune, calamity'
  - where: 'note 3:20 “The stumblingblock the Lord lays”'
    claim: 'The lexicon lists Ezekiel 3:20 with Jeremiah 6:21 under divine judgment'
    key: bdb
    url: 'https://biblehub.com/hebrew/4383.htm'
    quote: 'in divine judgment Jeremiah 6:21; Ezekiel 3:20'
  - where: 'note 3:20 “The stumblingblock the Lord lays”'
    claim: 'The ethical sense, an occasion of iniquity, is mostly of idols, as in Ezekiel 14:3–4'
    key: bdb
    url: 'https://biblehub.com/hebrew/4383.htm'
    quote: 'c. in ethical sense'
  - where: 'note 3:20 “The stumblingblock the Lord lays”'
    claim: 'The ethical uses in Ezekiel mostly refer to idols'
    key: bdb
    url: 'https://biblehub.com/hebrew/4383.htm'
    quote: 'so Ezekiel 14:3,4,7; Ezekiel 18:30; Ezekiel 44:12 (mostly with reference to idols.)'
