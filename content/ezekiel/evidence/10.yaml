chapter: 10
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The vision of chapters 8–11 is dated to the sixth year, sixth month, fifth day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month, as I sat in mine house, and the elders of Judah sat before me'
  - where: 'when'
    claim: 'The Bible Dictionary dates the start of Ezekiel’s ministry (the fifth year) to 592 B.C., so the sixth year is about 591'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  # ---- setting ----
  - where: 'setting'
    claim: 'Ezekiel was in his house with the elders of Judah when the vision began'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'as I sat in mine house, and the elders of Judah sat before me, that the hand of the Lord God fell there upon me'
  - where: 'setting'
    claim: 'He was brought to Jerusalem in vision'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'the spirit lifted me up between the earth and the heaven, and brought me in the visions of God to Jerusalem'
  - where: 'setting'
    claim: 'At the end of the vision he is brought back to the captives and tells them what he saw'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'brought me in a vision by the Spirit of God into Chaldea, to them of the captivity. So the vision that I had seen went up from me.'
  - where: 'setting'
    claim: 'He told the captives all that he was shown'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'Then I spake unto them of the captivity all the things that the Lord had shewed me.'
  - where: 'setting'
    claim: 'Chapter 8 ends in the inner court with men worshipping the sun with their backs to the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'he brought me into the inner court of the Lord’s house, and, behold, at the door of the temple of the Lord, between the porch and the altar, were about five and twenty men, with their backs toward the temple'
  - where: 'setting'
    claim: 'Chapter 8 shows idolatry practised in the temple (the Student Manual’s section headings on 8:3–18)'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Ezekiel’s Vision of Idolatrous Abominations in Jerusalem'
  - where: 'setting'
    claim: 'Six men with weapons and a seventh clothed with linen came in chapter 9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'six men came from the way of the higher gate, which lieth toward the north, and every man a slaughter weapon in his hand; and one man among them was clothed with linen'
  - where: 'setting'
    claim: 'The seventh marked those who grieved over the abominations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'set a mark upon the foreheads of the men that sigh and that cry for all the abominations that be done in the midst thereof'
  - where: 'setting'
    claim: 'The six struck down the rest, beginning at the sanctuary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'but come not near any man upon whom is the mark; and begin at my sanctuary'
  - where: 'setting'
    claim: 'The captain of Nebuchadnezzar’s guard burned the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'came Nebuzar-adan, captain of the guard, a servant of the king of Babylon, unto Jerusalem'
  - where: 'setting'
    claim: 'He burned the house of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And he burnt the house of the Lord, and the king’s house, and all the houses of Jerusalem'
  # ---- thread ----
  - where: 'thread'
    claim: 'The departure is completed in 11:23, when the glory goes to the mountain east of the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'And the glory of the Lord went up from the midst of the city, and stood upon the mountain which is on the east side of the city.'
  - where: 'thread'
    claim: 'Cherubim were the figures over the ark'
    key: bd-cherubim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cherubim?lang=eng'
    quote: 'They are found in the Holy of Holies, on the Mercy Seat of the Ark'
  - where: 'thread'
    claim: 'The glory that leaves the temple had already been seen by Ezekiel among the exiles'
    key: shannon-location
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'Both the glory and the cherubim were already seen by Ezekiel on the banks of Chebar, as described in Ezekiel 1.'
  - where: 'thread'
    claim: 'The reason for the departure is given at 8:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'the great abominations that the house of Israel committeth here, that I should go far off from my sanctuary?'
  - where: 'thread'
    claim: 'A promise to the exiles is given at 11:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'yet will I be to them as a little sanctuary in the countries where they shall come'
  - where: 'thread'
    claim: 'The house had been defiled, and without His presence it could be destroyed'
    key: shannon-location
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'It had been defiled through Israel’s abominations, and without his protecting presence it was able to be destroyed.'
  # ---- sections ----
  - where: 'section 3 plain'
    claim: '“Upon their four sides” means in any of their four directions'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+10&version=NRSVUE'
    quote: 'When they moved, they moved in any of the four directions without veering as they moved'
  - where: 'section 3 plain'
    claim: 'The Hebrew of “were lifted up” (verse 15) is the verb rendered “mounted up” in verse 19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וַ/יֵּר֨וֹמּוּ'
  # ---- note 10:2 linen ----
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'The man clothed with linen came in with six armed men, with a writer’s inkhorn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'one man among them was clothed with linen, with a writer’s inkhorn by his side'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'He was sent to mark the foreheads of those who sigh and cry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'set a mark upon the foreheads of the men that sigh and that cry for all the abominations'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'He reported that he had done it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'the man clothed with linen, which had the inkhorn by his side, reported the matter, saying, I have done as thou hast commanded me'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'The Hebrew for “linen” in 10:2 is baddim (Strong’s 906), plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/בַּדִּ֗ים'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'The word means white linen, the material of priestly vestments, including Leviticus 16:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/906.htm'
    quote: 'white linen (derivation unknown)'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'It is the material of priestly vestments, including those of Leviticus 16:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/906.htm'
    quote: 'as material of different priestly vestments Exodus 28:42; Exodus 39:28; Leviticus 6:3 (twice in verse); Leviticus 16:4 (4 t. in verse)'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'The phrase “clad in linen garments” is used of an angel in Ezekiel 9–10 and Daniel'
    key: bdb
    url: 'https://biblehub.com/hebrew/906.htm'
    quote: 'clad in (the) linen garments, of angel Ezekiel 9:2,3,11; Ezekiel 10:2,6,7; Daniel 10:5; Daniel 12:6,7.'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'Aaron put on holy linen garments to enter the holy place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'He shall put on the holy linen coat, and he shall have the linen breeches upon his flesh'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'The linen garments were those he wore when he went into the holy place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'shall put off the linen garments, which he put on when he went into the holy place'
  - where: 'note 10:2 “The scribe of chapter 9, sent a second time”'
    claim: 'Daniel saw a man clothed in linen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'behold a certain man clothed in linen, whose loins were girded with fine gold of Uphaz'
  # ---- note 10:2 coals ----
  - where: 'note 10:2 “Fire from under the throne, for the city”'
    claim: 'The coals refer to the judgments and the burning of the city'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'is a reference to the judgments and eventual burning and destruction which would come upon the city.'
  - where: 'note 10:2 “Fire from under the throne, for the city”'
    claim: '“He went out” has been read as telling that he scattered the coals to burn the city'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/10.htm'
    quote: 'indicates that the man clothed in white linen scattered the coals over the city, to set it on fire and consume it.'
  - where: 'note 10:2 “Fire from under the throne, for the city”'
    claim: 'Verse 7 ends with the man taking the fire and going out; the fire is taken from between the cherubims'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'fill thine hand with coals of fire from between the cherubims, and scatter them over the city'
  - where: 'note 10:2 “Fire from under the throne, for the city”'
    claim: 'Jerusalem and the temple were burned by Nebuchadnezzar’s captain of the guard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And he burnt the house of the Lord, and the king’s house, and all the houses of Jerusalem'
  - where: 'note 10:2 “Fire from under the throne, for the city”'
    claim: 'The fire that consumes the city is kindled from the fire of God’s wrath (Keil, quoting Kliefoth)'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/10.htm'
    quote: 'In the fire of God, the fire of His wrath, will kindle the fire for consuming the city'
  # ---- note 10:4 cherub ----
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: '9:3 says the same of the glory in nearly the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'And the glory of the God of Israel was gone up from the cherub, whereupon he was, to the threshold of the house.'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'In 10:4 “the cherub” is singular with the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/כְּר֔וּב'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'In 9:3 “the cherub” is singular with the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/כְּרוּב֙'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'The cherubim of the ark were in the inner sanctuary; the Lord promised to commune from between them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'I will commune with thee from above the mercy seat, from between the two cherubims which are upon the ark of the testimony'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'Verse 4 has been read as a second rising of the glory to the threshold'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/10.htm'
    quote: 'it is evident from Ezekiel 10:4 that the glory of Jehovah had risen up again from the throne, and removed to the threshold of the temple'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'On that reading the command of verse 2 was given from the threshold, as in 9:3'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/10.htm'
    quote: 'Jehovah issued the command in Ezekiel 10:2, not from His throne, but from the threshold of the temple'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'One reading (which Keil reports and rejects): the glory came out from the interior of the sanctuary'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'The meaning of this is not that it removed from the interior of the sanctuary to the outer threshold of the temple-building'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'The other reading: the glory was already over the cherub in the court'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'for it was already stationed, according to Ezekiel 8:16, above the cherub, between the porch and the altar'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'The singular “cherub” is used collectively for the cherubim'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'is used collectively) to do this'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'The right side of the house (verse 3) is the south'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/10.htm'
    quote: 'the cherubim were standing to the right of the house, i.e., on the south or rather south-east of the temple house'
  - where: 'note 10:4 “The first step: from the cherub to the threshold”'
    claim: 'The NRSVUE renders “threshold of the house” as the entryway of the temple'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+10&version=NRSVUE'
    quote: 'Then the glory of the Lord rose up from the cherub to the entryway of the temple'
  # ---- note 10:4 cloud ----
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'A cloud and the glory filled the tabernacle when it was set up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'Then a cloud covered the tent of the congregation, and the glory of the Lord filled the tabernacle.'
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'The cloud filled Solomon’s temple when the ark was brought in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'So that the priests could not stand to minister because of the cloud: for the glory of the Lord had filled the house of the Lord.'
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'The occasion was the placing of the ark in the temple (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And it came to pass, when the priests were come out of the holy place, that the cloud filled the house of the Lord'
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'Ezekiel was a priest'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'A priest of the family of Zadok'
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'The court was full of the brightness; the wings sounded as the voice of the Almighty God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'as the voice of the Almighty God when he speaketh'
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'The court was full of the brightness of the glory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'the court was full of the brightness'
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'The Hebrew of “the Almighty God” in 10:5 is El Shaddai (Strong’s 410 and 7706)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שַׁדַּ֖י'
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'Chapter 1 compares the sound of the wings to the voice of the Almighty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'I heard the noise of their wings, like the noise of great waters, as the voice of the Almighty'
  - where: 'note 10:4 “The cloud that filled the house at its dedication”'
    claim: 'In the last vision the glory fills the house again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'and, behold, the glory of the Lord filled the house'
  # ---- note 10:13 ----
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'Verse 13 has both words: ophannim first, then galgal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'לָ/א֖וֹפַנִּ֑ים'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'The word behind “O wheel” is galgal (Strong’s 1534), as in 10:2 and 10:6; in Ezekiel it also occurs at 23:24 and 26:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/גַּלְגַּ֖ל'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'The word in verse 19 for wheels is ophannim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/הָ/אֽוֹפַנִּ֖ים'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'Galgal means wheel, whirl, whirlwind'
    key: bdb
    url: 'https://biblehub.com/hebrew/1534.htm'
    quote: 'wheel, whirl, whirlwind'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'It is used of war-chariot wheels in Ezekiel 23:24 and 26:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/1534.htm'
    quote: 'of war-chariot Isaiah 5:28; Jeremiah 47:3, also collective Ezekiel 23:24; Ezekiel 26:10; perhaps also in Ezekiel''s vision Ezekiel 10:2,6,13'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'Verse 2 sends the man in between the wheels; verse 13 has “O wheel”; verse 15 has the cherubims lifted up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'As for the wheels, it was cried unto them in my hearing, O wheel.'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'Verse 2: “Go in between the wheels”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'Go in between the wheels, even under the cherub'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'Verse 15: the cherubims were lifted up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'And the cherubims were lifted up.'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'The Septuagint reads the verse as a naming and keeps the Hebrew word'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/10.htm'
    quote: 'And these wheels were called Gelgel in my hearing.'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'The NRSVUE reads it as a naming: the wheelwork'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+10&version=NRSVUE'
    quote: 'As for the wheels, they were called in my hearing “the wheelwork.”'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: '“In my hearing” shows an address, not a naming; the word is a command to whirl'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/10.htm'
    quote: 'is used here in the sense of addressing, calling, and not of naming.'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'The wheels were to revolve, to set themselves in motion'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/10.htm'
    quote: 'to revolve or whirl, to set themselves in motion by revolving'
  - where: 'note 10:13 “O wheel: a name or a summons”'
    claim: 'The cry gave the signal for the departure, and verse 15 tells the rising'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/10.htm'
    quote: 'These words therefore gave the signal for their departure, and accordingly the rising up of the cherubim is related in Ezekiel 10:15.'
  # ---- note 10:14 ----
  - where: 'note 10:14 “The face of a cherub where the ox was”'
    claim: 'Chapter 1 lists a man, a lion, an ox and an eagle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'they four had the face of a man, and the face of a lion, on the right side: and they four had the face of an ox on the left side; they four also had the face of an eagle'
  - where: 'note 10:14 “The face of a cherub where the ox was”'
    claim: 'Verse 14 reads “the face of a cherub”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
