chapter: 21
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is the seventh year, fifth month, tenth day (20:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month'
  - where: 'when'
    claim: 'The next date in the book is the ninth year (24:1), the day the siege begins (24:2)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'the king of Babylon set himself against Jerusalem this same day'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year); the seventh year is counted from it as about 590 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'

  - where: 'setting'
    claim: 'Chapter 20 ends with a parable of a fire in the forest of the south field and the hearers’ complaint'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'prophesy against the forest of the south field'
  - where: 'setting'
    claim: 'In the Hebrew Bible 21:1 is 21:6, so the Hebrew chapter 21 begins at 20:45'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=ESV'
    quote: 'Ch 21:6 in Hebrew'
  - where: 'setting'
    claim: 'Zedekiah was the last king of Judah'
    key: 'bd-zedekiah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'The last king of Judah, his name changed from Mattaniah to Zedekiah'
  - where: 'setting'
    claim: 'Nebuchadnezzar made Zedekiah swear by God, and he rebelled'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'And he also rebelled against king Nebuchadnezzar, who had made him swear by God'
  - where: 'setting'
    claim: 'Envoys of the king of the Ammonites came to Jerusalem to Zedekiah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'and to the king of the Ammonites, and to the king of Tyrus, and to the king of Zidon, by the hand of the messengers which come to Jerusalem unto Zedekiah king of Judah'
  - where: 'setting'
    claim: 'The Ammonites were settled east of Mount Gilead'
    key: 'bd-ammon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'they were settled east of Mount Gilead, from the Jabbok southwards'

  - where: 'thread'
    claim: 'The Hebrew word for sword, chereb (H2719), occurs fifteen times in chapter 21, in verses 3, 4, 5, 9 (twice), 11, 12, 14 (three times), 15, 19, 20, 28 (twice) (scripts/hebrew.mjs ezekiel --word H2719)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חֶ֥רֶב'

  - where: 'note 21:2 “The parable of the forest, said plainly”'
    claim: 'The parable of 20:45–49 has the three commands, the fire, the green and dry tree, south to north, and the fire not quenched'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And all flesh shall see that I the Lord have kindled it: it shall not be quenched.'
  - where: 'note 21:2 “The parable of the forest, said plainly”'
    claim: 'The Church’s footnote on “face” at 21:2 points back to Ezekiel 20:46'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'Ezek. 20:46'
  - where: 'note 21:2 “The parable of the forest, said plainly”'
    claim: 'Verses 1–5 explain the parable: the forest of the south is Jerusalem, its holy places and the land of Israel'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/21.htm'
    quote: 'was enigmatical. This is explained to signify Jerusalem with its holy places'
  - where: 'note 21:2 “The parable of the forest, said plainly”'
    claim: 'The parable’s fire is explained as the sword of the Lord'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/21.htm'
    quote: 'In accordance with this, the fire kindled by the Lord is interpreted as being the sword of the Lord.'

  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'The Septuagint reads “the transgressor and unrighteous” in verse 3'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/21.htm'
    quote: 'I will destroy out of thee the transgressor and unrighteous'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'The Hebrew has tsaddiq (H6662), righteous, and rasha (H7563), wicked'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'צַדִּ֥יק'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'The verse views the outward aspect of a national calamity and does not contradict chapter 18'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/21.htm'
    quote: 'not contradictory of Eze 18:4, 9 and Ge 18:23. Ezekiel here views the mere outward aspect of the indiscriminate universality of the national calamity'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'The mark of chapter 9 was not an exemption from the common calamity'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/21.htm'
    quote: 'The godly were sealed with a mark (Eze 9:4), not for outward exemption from the common calamity'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'Ezekiel and Daniel were among the righteous cut off from the land (Clarke, as the manual prints him)'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'both Ezekiel and Daniel, and indeed several others, prophets and righteous men, were thus cut off from the land, and carried into captivity'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'Had only the wicked been carried off there would have been none to set an example or preach repentance (Clarke, as the manual prints him)'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'there would be none to set a good example, to preach repentance, to reprove sin'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'Joseph Smith taught that the Saints will not escape all the judgments (the manual sets it at Ezekiel 21:4)'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'It is a false idea that the Saints will escape all the judgments, whilst the wicked suffer; for all flesh is subject to suffer'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'Joseph Smith: many of the Saints will escape'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'still many of the Saints will escape, for the just shall live by faith'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'Joseph Smith: many of the righteous will fall to disease and pestilence and yet be saved'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'yet many of the righteous shall fall a prey to disease, to pestilence, etc., by reason of the weakness of the flesh, and yet be saved in the Kingdom of God'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'Joseph Smith: suffering is not proof of transgression'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'it is an unhallowed principle to say that such and such have transgressed because they have been preyed upon by disease or death'
  - where: 'note 21:3 “Why the righteous fall with the wicked”'
    claim: 'In chapter 9 those with the mark were spared'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'but come not near any man upon whom is the mark'

  - where: 'note 21:6 “Groaning, striking the thigh, clapping the hands”'
    claim: 'The ESV renders “with the breaking of thy loins” as “with breaking heart and bitter grief”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=ESV'
    quote: 'with breaking heart and bitter grief'
  - where: 'note 21:6 “Groaning, striking the thigh, clapping the hands”'
    claim: 'The NRSVUE renders it “with body collapsed”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=NRSVUE'
    quote: 'moan with body collapsed and bitter grief before their eyes'
  - where: 'note 21:6 “Groaning, striking the thigh, clapping the hands”'
    claim: 'The Church’s footnote on “hands” at 21:7 points to Ezekiel 7:17, which has the same words'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'Ezek. 7:17'
  - where: 'note 21:6 “Groaning, striking the thigh, clapping the hands”'
    claim: 'The ESV’s cross-reference at 21:12 joins the smitten thigh to Jeremiah 31:19'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=ESV'
    quote: 'Ezekiel 21:12 : Jer. 31:19'

  - where: 'note 21:10 “The rod of my son”'
    claim: 'The Hebrew words are shebet (rod, H7626), beni (my son), mo’eset (despising, H3988), kol ets (every tree, H6086)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שֵׁ֥בֶט'
  - where: 'note 21:10 “The rod of my son”'
    claim: 'The NRSVUE marks 21:10 and 21:13 “Meaning of Heb uncertain”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=NRSVUE'
    quote: 'Meaning of Heb uncertain'
  - where: 'note 21:10 “The rod of my son”'
    claim: 'The Septuagint has no “rod of my son” in verse 10'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/21.htm'
    quote: 'slay, set at nought, despise every tree'
  - where: 'note 21:10 “The rod of my son”'
    claim: 'The Church’s footnote on “contemn” at 21:13 gives the Hebrew as “reject”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'HEB reject'
  - where: 'note 21:10 “The rod of my son”'
    claim: '“Sceptre” in Genesis 49:10 is the same Hebrew word, shebet (H7626)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'שֵׁ֨בֶט֙'
  - where: 'note 21:10 “The rod of my son”'
    claim: 'The Church’s manual reads the line as Nebuchadnezzar’s sword having contempt for the power promised to Judah, comparing Genesis 49:9–10'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'had contempt for any strength or power promised to Judah (compare Genesis 49:9–10). His sword destroyed the regal government of Judah just as it had brought down other nations'
  - where: 'note 21:10 “The rod of my son”'
    claim: 'The ESV makes Judah the one who despises the rod'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=ESV'
    quote: 'You have despised the rod, my son,'
  - where: 'note 21:10 “The rod of my son”'
    claim: 'The ESV’s footnote calls its text a probable reading and gives the Hebrew as it stands'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=ESV'
    quote: 'Probable reading; Hebrew The rod of my son despises everything of wood'
  - where: 'note 21:10 “The rod of my son”'
    claim: 'The NRSVUE reads the rod as discipline'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=NRSVUE'
    quote: 'You have despised the rod and all discipline'

  - where: 'note 21:14 “Twice, three times”'
    claim: 'The NRSVUE renders “Let the sword fall twice, thrice”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=NRSVUE'
    quote: 'Let the sword fall twice, thrice;'
  - where: 'note 21:14 “Twice, three times”'
    claim: 'The ESV notes that the Hebrew behind “three times” is “its third”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=ESV'
    quote: 'Hebrew its third'
  - where: 'note 21:14 “Twice, three times”'
