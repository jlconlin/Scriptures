    key: 'bd-rabbah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: 'There are still extensive ruins at the modern Amman.'

  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'The verb in “made his arrows bright” (qilqal, H7043) means shake, used here in divination'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: 'Ezekiel 21:26 (in divination)'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'The ESV renders “He shakes the arrows”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=ESV'
    quote: 'He shakes the arrows; he consults'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'The NRSVUE renders “he shakes the arrows; he consults the teraphim”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=NRSVUE'
    quote: 'he shakes the arrows; he consults the teraphim; he inspects the liver'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'Teraphim (H8655) were a kind of idol and a means of divination; BDB lists Genesis 31:19 and this verse'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8655.htm'
    quote: 'a kind of idol, object of reverence, and means of divination'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'The Bible Dictionary describes teraphim and names this verse for their use in Babylon'
    key: 'bd-teraphim'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/teraphim?lang=eng'
    quote: 'Images of the size and form of a man (1 Sam. 19:13, 16) used from patriarchal times (Gen. 31:30, 32) and onwards'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'Teraphim were used for magical purposes in Israel and in Babylon'
    key: 'bd-teraphim'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/teraphim?lang=eng'
    quote: 'in worship and for magical purposes both in Israel and in Babylon (Ezek. 21:21)'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'The Septuagint has the king examine the victims'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/21.htm'
    quote: 'and to enquire of the graven images, and to examine the victims'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'The Bible Dictionary defines divination as superstitious'
    key: 'bd-divination'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/divination?lang=eng'
    quote: 'Any superstitious method of trying to discover the course of future events'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'Such practices are frequently condemned in scripture'
    key: 'bd-divination'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/divination?lang=eng'
    quote: 'they are frequently condemned in scripture'
  - where: 'note 21:21 “Arrows, teraphim, and a liver”'
    claim: 'The NRSVUE’s cross-reference at 21:21 joins the verse to Proverbs 16:33'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2021&version=NRSVUE'
    quote: 'Num 23.23; Judg 17.5; Prov 16.33'
