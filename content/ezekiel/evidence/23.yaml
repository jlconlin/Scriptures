chapter: 23
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is the seventh year, fifth month, tenth day (20:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month'
  - where: 'when'
    claim: 'The next date in the book is the ninth year (24:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year), so the seventh year is about 590 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'

  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'The chapter stands under the date of 20:1, when elders came to inquire of the Lord'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'certain of the elders of Israel came to inquire of the Lord, and sat before me'
  - where: 'setting'
    claim: 'The question “wilt thou judge” opens the indictment at 20:4'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'Wilt thou judge them, son of man, wilt thou judge them? cause them to know the abominations of their fathers'
  - where: 'setting'
    claim: 'The same question opens chapter 22'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'wilt thou judge, wilt thou judge the bloody city? yea, thou shalt shew her all her abominations'
  - where: 'setting'
    claim: 'Samaria was the capital of the northern kingdom of Israel'
    key: 'bd-samaria'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'a city built by Omri and made the capital of the kingdom of Israel'
  - where: 'setting'
    claim: 'The northern kingdom was carried away in 721 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel'
  - where: 'setting'
    claim: 'The chapter describes the idolatries and foreign alliances of both cities under the figure of chapter 16'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The idolatries and foreign alliances of Jerusalem and Samaria are here described under the same strong figure which is used in c. 16.'
  - where: 'thread'
    claim: 'Jerusalem took Assyria, then Babylon, and then turned to Egypt again'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'made first the Assyrians and then the Babylonians her paramours (vv. 11–16). Being alienated from the latter she has turned to her early lovers of Egypt (vv. 17–21)'
  - where: 'thread'
    claim: 'Verses 36–49 go over the sin and judgment of both sisters again'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The sin and judgment of the two sisters are described afresh (vv. 36–49).'
  - where: 'note 23:2 “Two sisters, one husband”'
    claim: 'Jeremiah spoke of Israel and Judah as sisters in the days of Josiah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'The Lord said also unto me in the days of Josiah the king, Hast thou seen that which backsliding Israel hath done?'

  - where: 'note 23:2 “Two sisters, one husband”'
    claim: 'The chapter’s sexual language is metaphorical'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'All the references to whoredoms, to other impure sexual practices, and to various parts of the female anatomy are metaphorical.'
  - where: 'note 23:2 “Two sisters, one husband”'
    claim: 'It is the prophets’ figure of Jehovah as husband and Israel as wife'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'in which Jehovah is the husband and the nation Israel is the wife'
  - where: 'note 23:2 “Two sisters, one husband”'
    claim: 'Unfaithfulness has two senses, one of marriage and one of worship'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'One meaning relates to marriage (adultery) and the other to worship (idolatry).'
  - where: 'note 23:2 “Two sisters, one husband”'
    claim: 'The Church’s footnote on “daughters” points to Jeremiah 3:7'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'Jer. 3:7 (7–8, 10)'
  - where: 'note 23:2 “Two sisters, one husband”'
    claim: 'Jeremiah’s two sisters: Judah saw Israel put away and did not fear'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'yet her treacherous sister Judah feared not, but went and played the harlot also'
  - where: 'note 23:2 “Two sisters, one husband”'
    claim: 'Verse 11 is joined to Jeremiah 3:11 in a modern translation’s cross-references'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2023&version=ESV'
    quote: 'Ezekiel 23:11 : Jer. 3:11; See ch. 16:47'

  - where: 'note 23:3 “Idolatry that began in Egypt”'
    claim: 'Ezekiel 20 says Israel was told in Egypt to put away Egypt’s idols and did not'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'neither did they forsake the idols of Egypt'

  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'The Hebrew names are Oholah and Oholibah'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אָהֳלִיבָֽה'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'A modern translation spells them Oholah and Oholibah'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2023&version=ESV'
    quote: 'Oholah was the name of the elder and Oholibah the name of her sister.'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'The Church’s footnote gives Aholah as “A tent”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'HEB A tent.'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'The Church’s footnote gives Aholibah as “My tent is in her”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'HEB My tent is in her.'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'The lexicon explains Oholah as she who has a tent, a worshipper at a tent-shrine'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/170.htm'
    quote: 'she who has a tent, tent-woman, i.e. worshipper at tent-shrine'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'The lexicon explains Oholibah as “tent in her” and takes the two names as the same in meaning'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/172.htm'
    quote: 'tent in her = (in meaning)'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'One commentary takes the tent as the sanctuary'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/23.htm'
    quote: 'is the sanctuary: both tabernacle and temple'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'On that reading Jerusalem had the Lord’s sanctuary and Samaria one of her own'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/23.htm'
    quote: 'Jerusalem had the sanctuary of Jehovah; Samaria, on the other hand, had her own sanctuary, i.e., one invented by herself.'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: '“The elder” is the Hebrew “the great one”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/גְּדוֹלָה֙'
  - where: 'note 23:4 “Aholah and Aholibah”'
    claim: 'It has been taken as the greater sister, because ten tribes belonged to Samaria'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/23.htm'
    quote: 'the greater sister (not the elder, see the comm. on Ezekiel 16:46); because ten tribes, the greater portion of Israel, belonged to Samaria'

  - where: 'note 23:5 “Samaria and Assyria”'
    claim: 'The Church’s footnote on “Assyrians” points to Menahem’s tribute, the fall of Samaria, and Hosea'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: '2 Kgs. 15:19; 17:6 (3–6); Hosea 8:9'
  - where: 'note 23:5 “Samaria and Assyria”'
    claim: 'A modern translation’s cross-references join verse 5 to the same passages and to Hoshea’s service (2 Kgs. 17:3)'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2023&version=ESV'
    quote: 'Ezekiel 23:5 : 2 Kgs. 15:19; 17:3; Hos. 8:9'
  - where: 'note 23:5 “Samaria and Assyria”'
    claim: 'Hoshea served Assyria and then sent to Egypt'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng'
    quote: 'for he had sent messengers to So king of Egypt, and brought no present to the king of Assyria'
  - where: 'note 23:5 “Samaria and Assyria”'
    claim: 'Samaria fell after a siege of three years'
    key: 'bd-samaria'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'the Assyrians could not capture it until after a siege of three years'
  - where: 'note 23:5 “Samaria and Assyria”'
    claim: 'The northern kingdom was carried away in 721 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel'
  - where: 'note 23:5 “Samaria and Assyria”'
    claim: '“Famous among women” is rendered “a byword among women”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2023&version=ESV'
    quote: 'a byword among women'

  - where: 'note 23:14 “Pictures on the wall”'
    claim: 'The Hebrew word for “vermilion” means a red colour'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8350.htm'
    quote: 'red colour, vermilion (etymology unknown)'
  - where: 'note 23:14 “Pictures on the wall”'
    claim: 'The lexicon lists the word in one other verse, Jeremiah 22:14'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8350.htm'
    quote: 'Jeremiah 22:14'
  - where: 'note 23:14 “Pictures on the wall”'
    claim: 'Jeremiah 22:14 speaks of a wide house painted with vermilion'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng'
    quote: 'it is ceiled with cedar, and painted with vermilion'
  - where: 'note 23:14 “Pictures on the wall”'
    claim: 'A modern translation’s cross-references join verses 14 and 16 to Jehoiakim’s service of Babylon (2 Kgs. 24:1)'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2023&version=ESV'
    quote: 'Ezekiel 23:14 : ch. 16:29; [2 Kgs. 20:12, 13; 24:1]'
  - where: 'note 23:14 “Pictures on the wall”'
    claim: 'The same cross-references join verse 17 to Zedekiah’s embassy to Egypt (Ezek. 17:15)'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2023&version=ESV'
    quote: 'Ezekiel 23:17 : ver. 22, 28; [ch. 17:15]'
  - where: 'note 23:14 “Pictures on the wall”'
    claim: 'Jerusalem’s story goes from Assyria to Babylon and then, alienated from Babylon, to the lovers of her youth in Egypt (verses 17–21)'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'made first the Assyrians and then the Babylonians her paramours (vv. 11–16). Being alienated from the latter she has turned to her early lovers of Egypt (vv. 17–21)'
  - where: 'note 23:14 “Pictures on the wall”'
    claim: 'Jehoiakim served Nebuchadnezzar three years and rebelled'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Jehoiakim became his servant three years: then he turned and rebelled against him'
  - where: 'note 23:14 “Pictures on the wall”'
    claim: 'The Church’s footnote on verse 12 points to Ahaz’s appeal to Assyria'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: '2 Kgs. 16:7 (7–18)'

  - where: 'note 23:17 “Alienated from whom?”'
    claim: 'The verb of verse 17 is yaqa (H3363)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וַ/תֵּ֥קַע'
  - where: 'note 23:17 “Alienated from whom?”'
    claim: 'The verb is used of Jacob’s dislocated thigh'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3363.htm'
    quote: 'dislocated Genesis 32:26'
  - where: 'note 23:17 “Alienated from whom?”'
    claim: 'Elsewhere it is used of the soul torn away from someone, in Jeremiah 6:8 and Ezekiel 23:17–18'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3363.htm'
    quote: 'torn away, alienated from any one'
  - where: 'note 23:17 “Alienated from whom?”'
    claim: '“Mind” is the Hebrew nephesh, soul'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נַפְשָׁ֖/הּ'
  - where: 'note 23:17 “Alienated from whom?”'
    claim: 'A modern translation: she turned from them in disgust'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2023&version=ESV'
    quote: 'she turned from them in disgust'
  - where: 'note 23:17 “Alienated from whom?”'
    claim: 'The Joseph Smith Translation of verse 17'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'from me by them'
  - where: 'note 23:17 “Alienated from whom?”'
    claim: 'The Joseph Smith Translation of verse 22'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'by whom thy mind is alienated from me'
  - where: 'note 23:17 “Alienated from whom?”'
    claim: 'With the change the sisters are turned from God by their lovers'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The sisters’ minds were turned not from their lovers (the false gods) but from God by their lovers.'
  - where: 'note 23:17 “Alienated from whom?”'
    claim: 'The manual names verse 28 as changed as well'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Joseph Smith made small but significant changes in'

  - where: 'note 23:23 “The lovers return as an army”'
    claim: 'Pekod is a people in the Babylonian army'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6489.htm'
    quote: 'a people in Babylonian army Ezekiel 23:23'
  - where: 'note 23:23 “The lovers return as an army”'
    claim: 'Pekod was a tribe of southeast Babylonia bordering Elam'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6489.htm'
