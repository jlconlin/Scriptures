    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/23.htm'
    quote: 'not to be interpreted, as the earlier expositors suppose, from the custom prevalent among the Egyptians and other nations of cutting off the nose of an adulteress'
  - where: 'note 23:24 “Judged by Babylon’s judgments”'
    claim: 'One commentary reads it as the mutilation of prisoners of war'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/23.htm'
    quote: 'depict, by one particular example, the mutilation of prisoners captured by their enemies'

