  - where: 'note 23:23 “The lovers return as an army”'
    claim: 'Jeremiah names Pekod in his oracle against Babylon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'against the inhabitants of Pekod'

  - where: 'note 23:24 “Judged by Babylon’s judgments”'
    claim: 'A modern translation: the judgment is committed to them'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2023&version=ESV'
    quote: 'I will commit the judgment to them'
  - where: 'note 23:24 “Judged by Babylon’s judgments”'
    claim: 'The Hebrew has been read “I give up to them,” not “I place before them”'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/23.htm'
    quote: 'I give up to them (not, I place before them)'
  - where: 'note 23:24 “Judged by Babylon’s judgments”'
    claim: 'The Church’s footnote on “judge” points to the judgment of Zedekiah at Riblah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: '2 Kgs. 25:6 (6–7)'
  - where: 'note 23:24 “Judged by Babylon’s judgments”'
    claim: 'Zedekiah’s sons were killed before him and his eyes put out'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah'
  - where: 'note 23:24 “Judged by Babylon’s judgments”'
