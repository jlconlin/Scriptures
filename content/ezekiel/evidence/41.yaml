  - where: 'christ'
    claim: 'Hebrews speaks of the tabernacle’s inner room as the Holiest of all'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'And after the second veil, the tabernacle which is called the Holiest of all;'
  - where: 'christ'
    claim: 'Hebrews reads the holy places made with hands as figures of heaven, which Christ entered'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'For Christ is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself'
  - where: 'christ'
    claim: 'Hebrews speaks of entering the holiest by the blood of Jesus'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus'
