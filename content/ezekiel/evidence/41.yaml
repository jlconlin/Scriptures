chapter: 41
claims:
  - where: 'when'
    claim: 'The vision of chapters 40–48 is dated to the twenty-fifth year of the captivity, the fourteenth year after the city was smitten'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'
  - where: 'when'
    claim: 'Ezekiel’s ministry is dated 592–570 B.C.; the fifth year (1:2) being 592, the twenty-fifth is about 572'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'

  - where: 'setting'
    claim: 'Chapter 40 ends at the porch of the house, after the wall, gates and courts'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'And he brought me to the porch of the house, and measured each post of the porch'
  - where: 'setting'
    claim: 'A common cubit was about 18 inches and the long cubit of 40:5 about 21 inches'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041%3A1-4%2C12%2C21-22&version=ESV'
    quote: 'A cubit was about 18 inches or 45 centimeters; a long cubit (see 40:5) was about 21 inches or 53 centimeters'
  - where: 'setting'
    claim: 'Solomon’s temple was burned and destroyed by Nebuchadnezzar'
    key: 'bd-temple-of-solomon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'Finally it was burned to the ground and utterly destroyed by Nebuchadnezzar (2 Kgs. 25:9)'

  - where: 'thread'
    claim: 'The glory enters the house in chapter 43'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And the glory of the Lord came into the house by the way of the gate whose prospect is toward the east.'

  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: '“Tabernacle” in 41:1 is ohel (H168), “tent”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הָ/אֹֽהֶל'
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'The lexicon sets Ezekiel 41:1 beside the places where the wilderness tent of meeting is called “the tent”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/168.htm'
    quote: '(compare Ezekiel 41:1)'
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'The Septuagint has no “tent” or “tabernacle” in verse 1'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/41.htm'
    quote: 'And he brought me into the temple, the porch of which he measured, six cubits the breadth on one side, and six cubits the breadth of the porch on the other side.'
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'The NRSVUE leaves the clause out and notes that the Hebrew has “tent”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041&version=NRSVUE'
    quote: '41.1 Compare Gk: Heb tent'
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'The NRSVUE renders hekal in verse 1 “the nave”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041&version=NRSVUE'
    quote: 'Then he brought me to the nave and measured the posts'
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'One explanation of the Hebrew: the inner space is called a tent to show its identity with the tabernacle'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: 'to show the substantial identity of this space and the tabernacle'
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: '“Temple” in 41:1 is hekal (H1964)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/הֵיכָ֑ל'
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'In Ezekiel 41 hekal is the hall or nave, the holy place, not the whole house'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1964.htm'
    quote: "hall or nave of Ezekiel's temple, the holy place"
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'Solomon’s outer room was forty cubits long and his inner room twenty by twenty by twenty'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'And the oracle in the forepart was twenty cubits in length, and twenty cubits in breadth, and twenty cubits in the height thereof'
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'The dimensions of the holy of holies correspond to Solomon’s'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: "The dimensions of the holy of holies also correspond to the space covered by the holy of holies in Solomon's temple"
  - where: 'note 41:1 “The tent, and the rooms of Solomon’s temple”'
    claim: 'Solomon’s temple doubled the dimensions of the tabernacle'
    key: 'bd-temple-of-solomon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'The temple was built after the model of the tabernacle, the dimensions of each part being exactly double.'

  - where: 'note 41:3 “The guide goes into the inner room alone”'
    claim: 'Verse 1 has “he brought me” (Hiphil with first-person suffix); verse 3 has “he went” (Qal, no suffix)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וּ/בָ֣א'
  - where: 'note 41:3 “The guide goes into the inner room alone”'
    claim: 'The change of verb is explained by the prophet not being allowed into the most holy place'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: 'because the prophet was not allowed to tread the most holy place, and therefore the angel went in alone'
  - where: 'note 41:3 “The guide goes into the inner room alone”'
    claim: 'Aaron himself was not to enter within the veil at all times'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'that he come not at all times into the holy place within the veil before the mercy seat'
  - where: 'christ'
    claim: 'Hebrews: the high priest alone entered the second room, once a year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'But into the second went the high priest alone once every year, not without blood'
  - where: 'note 41:3 “The guide goes into the inner room alone”'
    claim: 'The Septuagint has seven cubits on each side of the door'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/41.htm'
    quote: 'the side-pieces of the door, seven cubits on one side, and seven cubits on the other side'
  - where: 'note 41:3 “The guide goes into the inner room alone”'
    claim: 'The NRSVUE makes the entrance six cubits wide and the sidewalls seven, following the Greek'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041&version=NRSVUE'
    quote: 'the width of the entrance, six cubits, and the sidewalls of the entrance, seven cubits'
  - where: 'note 41:3 “The guide goes into the inner room alone”'
    claim: 'The NRSVUE notes that the Hebrew has “width” where it follows the Greek'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041&version=NRSVUE'
    quote: '41.3 Gk: Heb width'
  - where: 'note 41:3 “The guide goes into the inner room alone”'
    claim: 'One reading keeps the Hebrew and takes the six cubits as the height of the door and the seven as its breadth'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: "we agree with Kliefoth in taking the six cubits as a statement of the height"
  - where: 'note 41:3 “The guide goes into the inner room alone”'
    claim: 'That reading rejects the Greek figures because they add up to more than the twenty cubits of the room'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: "the reading of the lxx is proved to be a false correction, by the fact that it yields a breadth of twenty-two or twenty-four cubits"

  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'The Hebrew is qodesh ha-qodashim, “holy of holies”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/קֳּדָשִֽׁים'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'The Holy of Holies is the most sacred room of tabernacle and temple'
    key: 'bd-holy-of-holies'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-of-holies?lang=eng'
    quote: 'The most sacred room in the tabernacle and, later, in the temple, as contrasted with the Holy Place.'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'The tabernacle’s Holy of Holies held only the ark'
    key: 'bd-tabernacle'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'The Holy of Holies contained only one piece of furniture: the Ark of the Covenant'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'The mercy seat on the ark was God’s throne in Israel'
    key: 'bd-tabernacle'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tabernacle?lang=eng'
    quote: 'It was God’s throne in Israel.'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'Solomon put two cherubim ten cubits high in the oracle'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'And within the oracle he made two cherubims of olive tree, each ten cubits high.'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'Ezekiel’s temple has no cherub statues, only carvings'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3742.htm'
    quote: 'Ezekiel knows of no cherubic statues in the new temple, but represents the inner walls of the temple as carved with alternating palm trees and cherubim'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'Jeremiah foretold that the ark would not be remembered and Jerusalem would be called the throne of the LORD'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'At that time they shall call Jerusalem the throne of the Lord'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'An older commentary notes the ark is not mentioned and reads it by Jer. 3:16–17: the Lord comes in place of the ark'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/41.htm'
    quote: 'no mention is made of the ark of the covenant. Fairbairn thus interprets this'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'The reading: Jehovah Himself comes in the room of the ark'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/41.htm'
    quote: 'Jehovah Himself, in the full display of the divine Shekinah, shall come in the room of the ark of the covenant (Jer 3:16, 17).'
  - where: 'note 41:4 “A most holy place with nothing named in it”'
    claim: 'The reading: the interior stands empty awaiting His entrance'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/41.htm'
    quote: 'The interior of the temple stands empty, waiting for His entrance to fill it with His glory (Eze 43:1-12).'

  - where: 'note 41:6 “Side rooms that rest against the house”'
    claim: 'Solomon’s temple had three levels of side chambers, five, six and seven cubits broad, resting on ledges in the wall'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'The nethermost chamber was five cubits broad, and the middle was six cubits broad, and the third was seven cubits broad'
  - where: 'note 41:6 “Side rooms that rest against the house”'
    claim: 'The NRSVUE reads verse 6 as offsets supporting the side chambers so that the temple wall does not'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041&version=NRSVUE'
    quote: 'There were offsets all around the wall of the temple to serve as supports for the side chambers so that they should not be supported by the wall of the temple.'
  - where: 'note 41:6 “Side rooms that rest against the house”'
    claim: 'The NRSVUE takes “thirty in order” as thirty in each story'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041&version=NRSVUE'
    quote: 'The side chambers were in three stories, one over another, thirty in each story.'
  - where: 'note 41:6 “Side rooms that rest against the house”'
    claim: 'Verse 6 is explained by comparison with 1 Kings 6:6, where the ledges on the temple wall are mentioned'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: "That this is the meaning of the words is rendered certain by a comparison with 1 Kings 6:6, where the ledges on the temple wall are expressly mentioned"
  - where: 'note 41:6 “Side rooms that rest against the house”'
    claim: 'Verse 7 describes a widening of the side rooms from storey to storey, as in 1 Kings 6:6'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: "it occasioned a widening of the side-rooms proceeding upwards from storey to storey, as is plainly stated in 1 Kings 6:6"
  - where: 'note 41:6 “Side rooms that rest against the house”'
    claim: 'The beams were not let into the walls because that would have violated the sanctity of the house'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: "or were dovetailed into them, which would have done violence to the sanctity of the temple house"

  - where: 'note 41:12 “The separate place and the measures of a hundred cubits”'
    claim: '“Separate place” is gizrah (H1508)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/גִּזְרָ֜ה'
  - where: 'note 41:12 “The separate place and the measures of a hundred cubits”'
    claim: 'Gizrah means cutting, separation'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1508.htm'
    quote: 'noun feminine cutting, separation'
  - where: 'note 41:12 “The separate place and the measures of a hundred cubits”'
    claim: 'In Ezekiel 41–42 (its only uses in this sense) it is a yard adjoining the temple'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1508.htm'
    quote: 'separate place AV RV compare Da; i.e. yard, or space adjoining temple on three sides.'
  - where: 'note 41:12 “The separate place and the measures of a hundred cubits”'
    claim: 'The NRSVUE has “the temple yard”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041&version=NRSVUE'
    quote: 'The building that was facing the temple yard on the west side was seventy cubits deep'
  - where: 'note 41:12 “The separate place and the measures of a hundred cubits”'
    claim: 'The ESV has “the separate yard”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2041%3A1-4%2C12%2C21-22&version=ESV'
    quote: 'the separate yard on the west side was seventy cubits broad'
  - where: 'note 41:12 “The separate place and the measures of a hundred cubits”'
    claim: 'The inner court was a hundred cubits square'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'So he measured the court, an hundred cubits long, and an hundred cubits broad, foursquare'
  - where: 'note 41:12 “The separate place and the measures of a hundred cubits”'
    claim: 'Elder Talmage, as the Student Manual prints him, named spaciousness and symmetry as a predominant characteristic of Ezekiel’s temple'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'A predominant characteristic of the Temple described by Ezekiel was the spaciousness of its premises and the symmetry of both the Holy House and its associated buildings.'

  - where: 'note 41:18 “Cherubim and palm trees on every wall”'
    claim: 'Solomon’s walls were carved with cherubim and palm trees'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'And he carved all the walls of the house round about with carved figures of cherubims and palm trees and open flowers, within and without.'
  - where: 'note 41:18 “Cherubim and palm trees on every wall”'
    claim: 'Images of cherubim in the sanctuary marked borders and controlled access'
    key: 'shannon-guarded'
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'These images were particularly associated with borders, where they symbolically controlled access from one point to another.'
  - where: 'note 41:18 “Cherubim and palm trees on every wall”'
    claim: 'The cherubim guard the way back into God’s presence'
    key: 'shannon-guarded'
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'The cherubim symbolically and iconographically guard the way back into God’s presence.'
  - where: 'note 41:18 “Cherubim and palm trees on every wall”'
    claim: 'The guardianship of the cherubim is explicit in Genesis 3:24'
    key: 'shannon-guarded'
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'The role of the cherubim as guardians is made explicit by their appearance in Genesis 3:24'
  - where: 'note 41:18 “Cherubim and palm trees on every wall”'
    claim: 'One explanation of the two faces: carving can show only two'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/41.htm'
    quote: 'In sculpture only two faces could be shown, and consequently these cherubic figures had only two faces, and not four, like those in the vision.'
  - where: 'note 41:18 “Cherubim and palm trees on every wall”'
    claim: 'The exact form of cherubim is unknown'
    key: 'bd-cherubim'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cherubim?lang=eng'
    quote: 'Figures representing heavenly creatures, the exact form being unknown.'
  - where: 'note 41:18 “Cherubim and palm trees on every wall”'
    claim: 'The number and form of cherubim vary from one representation to another'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3742.htm'
    quote: 'It is evident that the number and the form of the cherubim vary in the representations (compare Ezekiel 41:18-25).'
  - where: 'note 41:18 “Cherubim and palm trees on every wall”'
    claim: 'Palm figures were already on the gate at 40:16'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8561.htm'
    quote: "in Ezekiel's temple Ezekiel 40:16,22,26"

