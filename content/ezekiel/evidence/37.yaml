    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'archaeologist Max Mallowan discovered a set of sixteen hinged wax writing boards in Assyria'
  - where: 'note 37:16 “What a stick was”'
    claim: 'The discovery was in 1953, at biblical Calah'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'The discovery in 1953 of these writing boards from biblical Calah in Mesopotamia'
  - where: 'note 37:16 “What a stick was”'
    claim: 'The site is Nimrud'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'Max Mallowan claimed to have discovered at Nimrud'
