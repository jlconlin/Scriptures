    claim: 'An older reading: not boards, simply pieces of wood'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'Nor have we even to think of flat boards, but simply of pieces of wood upon which a few words could be written, and which could be held in one hand.'
  - where: 'note 37:16 “What a stick was”'
