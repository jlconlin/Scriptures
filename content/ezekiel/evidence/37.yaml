    key: bdb
    url: 'https://biblehub.com/hebrew/1237.htm'
    quote: '2 plain (sometimes valley-plain, broad valley) Genesis 11:2; also Ezekiel 3:22,23; Ezekiel 8:4; Ezekiel 37:1,2'
  - where: 'note 37:1 “The plain of an earlier vision”'
    claim: 'A modern translation notes “plain” as an alternative to “valley” here'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2037&version=ESV'
