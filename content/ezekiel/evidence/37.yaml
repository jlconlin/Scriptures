    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'appears to point back to Ezekiel 3:22, to the valley where Ezekiel received the first revelation'
  - where: 'note 37:1 “The plain of an earlier vision”'
    claim: 'In 3:22–23 Ezekiel was sent into the plain and saw the glory of the Lord there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Then I arose, and went forth into the plain: and, behold, the glory of the Lord stood there'
  - where: 'note 37:1 “The plain of an earlier vision”'
    claim: 'Modern revelation says Ezekiel was shown the valley in vision'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138?lang=eng'
    quote: 'Ezekiel, who was shown in vision the great valley of dry bones'
  - where: 'note 37:1 “The plain of an earlier vision”'
    claim: 'The vision of chapter 8 opens with the hand of the Lord upon Ezekiel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'the hand of the Lord God fell there upon me'
  - where: 'note 37:1 “The plain of an earlier vision”'
    claim: 'The vision of chapter 40 opens with the hand of the Lord upon Ezekiel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'in the selfsame day the hand of the Lord was upon me, and brought me thither'

  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'The Hebrew ruach (H7307) occurs ten times in the chapter: 37:1, 5, 6, 8, 9 (four times), 10, 14 (scripts/hebrew.mjs ezekiel --word 7307)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הָ/ר֑וּחַ'
  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'The word means breath, wind, or spirit'
    key: bdb
    url: 'https://biblehub.com/hebrew/7307.htm'
    quote: 'breath, wind, spirit'
  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'The lexicon sets these verses under breath as the sign of life, and allows breath or spirit for verse 14'
    key: bdb
    url: 'https://biblehub.com/hebrew/7307.htm'
    quote: 'e. as sign and symbol of life:'
  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'For 37:14 the lexicon allows either breath or spirit'
    key: bdb
    url: 'https://biblehub.com/hebrew/7307.htm'
    quote: 'Ezekiel 37:14 (breath or spirit)'
  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'The two steps have been traced to the creation of man in Genesis 2, and “breathe” in verse 9 points back to Genesis 2:7'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'points back to Genesis 2:7. The representation of the bringing of the dead bones to life in two acts may also be explained from the fact that it is based upon the history of the creation of man in Genesis 2'
  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'The raising is depicted, like the first creation, as a work of God'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'serves plainly to depict the creative revivification here, like the first creation there, as a work of the almighty God'
  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'The verb “breathe” in 37:9 is naphach (H5301)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וּ/פְחִ֛י'
  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'Genesis 2:7 has the same verb (H5301), and a different noun for “breath” (neshamah, H5397) (scripts/hebrew.mjs genesis 2:7)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַ/יִּפַּ֥ח'
  - where: 'note 37:9 “One word for breath, wind, and spirit”'
    claim: 'Genesis 2:7: man formed, then given the breath of life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'formed man of the dust of the ground, and breathed into his nostrils the breath of life'

  - where: 'note 37:11 “The Lord explains the bones”'
    claim: 'The saying of 37:11 is set beside the saying of 33:10'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2037&version=ESV'
    quote: 'Ezekiel 37:11 : [ch. 33:10; Isa. 49:14]'
  - where: 'note 37:11 “The Lord explains the bones”'
    claim: 'The exiles’ earlier saying, 33:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'If our transgressions and our sins be upon us, and we pine away in them, how should we then live?'
  - where: 'note 37:11 “The Lord explains the bones”'
    claim: '“Very dry” seems to mean the bones had been there a long time'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'The fact that the bones were “very dry” seems to indicate that they had been there for a long time'
  - where: 'note 37:11 “The Lord explains the bones”'
    claim: 'Ezekiel’s answer has been read as implying that by human judgment the bones could not live'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'implies that, according to human judgment, it was inconceivable that they could come to life any more'
  - where: 'note 37:11 “The Lord explains the bones”'
    claim: 'The bones are Israel in its lost and hopeless state; their new life can represent Israel restored to spiritual life'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'He explained that the bones represented the house of Israel in their lost and hopeless state. The bones receiving new life can represent the house of Israel being restored to a new spiritual life.'
  - where: 'note 37:11 “The Lord explains the bones”'
    claim: '“The whole house of Israel” has been read as pointing forward to the reunion of the two kingdoms'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'points forward to the reunion of the tribes of Israel that are severed into two nations'

