chapter: 37
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is 33:21, the twelfth year, tenth month, when word came that the city had fallen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year), so the twelfth year is about 585'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The next date in the book is the twenty-fifth year (40:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'

  - where: 'setting'
    claim: 'Chapters 33–39 are the book’s prophecies of restoration, and 40–48 the visions of the temple'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(3) 33–39, prophecies of restoration; (4) 40–48, visions of the reconstruction of the temple and its w'
  - where: 'setting'
    claim: 'The northern kingdom was carried away by Assyria, the last of it in 721 B.C.'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel (2 Kgs. 17:3)'
  - where: 'setting'
    claim: 'Chapter 36 promised the Lord’s spirit within His people (36:27)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'And I will put my spirit within you, and cause you to walk in my statutes'
  - where: 'setting'
    claim: 'The chapter contains two revelations: a vision (1–14) and a symbolic act (15–28)'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'This chapter contains two revelations from God (Ezekiel 37:1-14 and Ezekiel 37:15-28). In the first, the prophet is shown in a vision the resurrection of Israel to a new life. In the second, he is commanded to exhibit, by means of a symbolical act'

  - where: 'thread'
    claim: 'The closing promise repeats what chapters 34 and 36 promised'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'The whole promise, however, is merely a repetition of that contained in Ezekiel 34:11-31 and Ezekiel 36:22-30.'
  - where: 'thread'
    claim: 'What is new in the repeated promise is “for ever”'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'What is new in this promise, which is repeated from Ezekiel 34 and 36, is contained in'
  - where: 'thread'
    claim: 'The Hebrew word for “ever” (olam, H5769) comes twice in verse 25, twice in verse 26 and once in verse 28 (scripts/hebrew.mjs ezekiel 37:25, 37:26, 37:28)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'לְ/עוֹלָֽם'

  - where: 'section 1 plain'
    claim: 'The “shaking” of verse 7 is rendered a rattling in modern translations'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2037&version=ESV'
    quote: 'there was a sound, and behold, (M)a rattling, and the bones came together, bone to its bone'

  - where: 'note 37:1 “The plain of an earlier vision”'
    claim: 'The Hebrew word is biqah (H1237) with the article: “the valley” or “the plain”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/בִּקְעָ֑ה'
