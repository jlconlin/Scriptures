    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'Stick is merely one specific meaning used by King James translators; others include tree, timber, helve, plank, stalk, staff, stock, gallows.'
