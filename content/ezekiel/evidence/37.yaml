    key: bdb
    url: 'https://biblehub.com/hebrew/1504.htm'
    quote: '2 be cut off = destroyed Lamentations 3:54; Ezekiel 37:11.'
  - where: 'note 37:11 “We are cut off”'
    claim: 'ESV rendering'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2037&version=ESV'
