    quote: 'He was told to write on wood, join the two boards into one, and inscribe the names of the owners on the covers. These three simple but specific actions were typical of scribal procedures'
  - where: 'note 37:16 “What a stick was”'
    claim: 'Its conclusion'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'Ezekiel most likely was writing on wax writing boards'
  - where: 'note 37:16 “What a stick was”'
    claim: 'Its concession'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'the evidence that writing boards were regularly used in Ezekiel’s day is insufficient to show that writing board was exactly what Ezekiel was referring to'
  - where: 'note 37:16 “What a stick was”'
    claim: 'The New English Bible’s rendering, as the article quotes it'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'Man, take one leaf of a wooden tablet and write on it'
  - where: 'note 37:16 “What a stick was”'
    claim: 'The translation quoted is the New English Bible'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'Here is how one modern translation, the New English Bible, translates Ezekiel 37:15–19'
