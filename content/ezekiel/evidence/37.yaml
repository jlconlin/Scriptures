    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'Their own tablets, however, tell us that sometimes they copied their texts from a wooden tablet (is leu).'
  - where: 'note 37:16 “What a stick was”'
    claim: 'The rods of Numbers 17 are called matteh, not etz'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'The tribal leaders in that passage wrote on rods or tribal staves, but the word matteh instead of ’ets is used.'
  - where: 'note 37:16 “What a stick was”'
    claim: 'An older commentary also denies that the word means a staff here'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/37.htm'
    quote: 'neither the passage referred to nor Ezekiel 21:15 furnishes any proof that'
  - where: 'note 37:16 “What a stick was”'
    claim: 'Babylonian scribes filled wooden tablets with wax'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'scribes were filling their wooden tablets with wax'
  - where: 'note 37:16 “What a stick was”'
    claim: 'Boards were joined by thongs or hinges and folded together'
    key: meservy-sticks
    url: 'https://www.churchofjesuschrist.org/study/ensign/1987/02/ezekiels-sticks-and-the-gathering-of-israel?lang=eng'
    quote: 'By joining two boards together by thongs or metal hinges, a scribe could fold them together'
