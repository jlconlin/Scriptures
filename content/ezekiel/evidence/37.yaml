    quote: 'Ezekiel assured not only contemporary Israelites, whose graves were far from home, but later readers who might die in Rome, or in Russia, or in America, or in Germany that by means of the resurrection God would bring them back to their land.'

  - where: 'note 37:12 “A prophecy of the Resurrection”'
