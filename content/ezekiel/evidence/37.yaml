    quote: 'Ezekiel also had a vision of the return of the Israelites to their homeland, symbolized by resurrection and the reunion of the “sticks” of various tribes'

  - where: 'note 37:16 “What a stick was”'
    claim: 'The Hebrew word is etz (H6086)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'עֵ֣ץ'
  - where: 'note 37:16 “What a stick was”'
    claim: 'The word means tree, trees, wood'
    key: bdb
    url: 'https://biblehub.com/hebrew/6086.htm'
    quote: 'tree, trees, wood'
  - where: 'note 37:16 “What a stick was”'
    claim: 'It is used of pieces or articles of wood'
    key: bdb
    url: 'https://biblehub.com/hebrew/6086.htm'
    quote: 'to denote pieces [or articles] of wood'
  - where: 'note 37:16 “What a stick was”'
    claim: 'The general meaning is wood; “stick” is one of several King James renderings'
