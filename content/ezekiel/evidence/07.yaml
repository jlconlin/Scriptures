chapter: 7
claims:
  - where: 'when'
    claim: 'The book’s first date is the fifth year of Jehoiachin’s captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'The next date in the book is the sixth year, at 8:1'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'

  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'The second date in the book is the sixth year (8:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month'
  - where: 'setting'
    claim: 'The deportation that followed Jerusalem’s fall was in 586 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'Zedekiah was the last king of Judah'
    key: 'bd-zedekiah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'The last king of Judah, his name changed from Mattaniah to Zedekiah'
  - where: 'setting'
    claim: 'Chapter 7 is the second of two oracles and completes the announcement of judgment on Jerusalem and Judah'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'completes the announcement of judgment upon Jerusalem and Judah, by expanding the thought, that the end will come both quickly and inevitably upon the land and people'
  - where: 'setting'
    claim: 'The chapter is written in short clauses, in a form like a lamentation'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'the theme is given in short, expressive, and monotonous clauses'
  - where: 'setting'
    claim: 'The second section resembles the lamentation of chapter 19'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'in a form resembling the lamentation in Ezekiel 19:1-14, a more minute description of the end predicted'
  - where: 'setting'
    claim: 'Lamentations says from inside the fallen city that the end is come'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/4?lang=eng'
    quote: 'our end is near, our days are fulfilled; for our end is come'
  - where: 'setting'
    claim: 'Chapter 4 is a sign of the siege'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'Ezekiel symbolically illustrates the siege and famine that will befall Jerusalem.'
  - where: 'setting'
    claim: 'Chapter 5 is about the judgment of Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'The judgment of Jerusalem will include famine, pestilence, war, and the scattering of her inhabitants.'
  - where: 'setting'
    claim: 'Chapter 6 was spoken to the mountains of Israel and their high places'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'Ye mountains of Israel, hear the word of the Lord God'
  - where: 'setting'
    claim: 'Chapter 6 names the high places'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'I will destroy your high places'
  - where: 'setting'
    claim: 'Chapter 8 begins a vision of Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'Ezekiel sees in vision the wickedness and abominations of the people of Judah in Jerusalem'

  - where: 'thread'
    claim: 'The Hebrew of verse 27 says the people are judged by their own judgments'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'according to their judgments I will judge them'

  - where: 'note 7:2 “The end, five times over”'
    claim: 'The Hebrew word for “end” is qets (H7093); it stands twice in 7:2, once in 7:3, twice in 7:6'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'קֵ֣ץ'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'The lexicon classes these verses with Amos 8:2 as the end of a people’s life'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7093.htm'
    quote: 'end of life, of a people Amos 8:2; Ezekiel 7:2 (twice in verse); Ezekiel 7:3,6 (twice in verse)'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'Amos saw a basket of summer fruit and heard that the end was come on Israel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/8?lang=eng'
    quote: 'A basket of summer fruit. Then said the Lord unto me, The end is come upon my people of Israel'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'The Church’s footnote at 7:2 points to Amos 8:2 and Lamentations 4:18'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/7?lang=eng'
    quote: 'Lam. 4:18; Amos 8:2'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'In Amos 8:2 “summer fruit” is qayits (H7019) and “end” is qets (H7093)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Amos.xml'
    quote: 'קָ֑יִץ'
  - where: 'note 7:2 “The end, five times over”'
    claim: '“It watcheth” in 7:6 is heqits (H6974), a Hiphil perfect'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הֵקִ֣יץ'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'The verb means to awake; the lexicon renders the clause and notes the wordplay'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6974.htm'
    quote: 'the end cometh, it hath awaked unto thee (Co strike out הֵקִיץ, but the word-play favours it)'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'A modern translation renders “it has awakened against you”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'An end has come; the end has come; it has awakened against you.'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'The Hebrew word for “land” in “four corners of the land” can also be “earth”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'Ezekiel 7:2 Or earth'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'The same phrase is used of the whole earth in Isaiah 11:12'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/11?lang=eng'
    quote: 'gather together the dispersed of Judah from the four corners of the earth'
  - where: 'note 7:2 “The end, five times over”'
    claim: 'Lamentations 4:18 says the same from inside the city'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/4?lang=eng'
    quote: 'our end is near, our days are fulfilled; for our end is come'

  - where: 'note 7:7 “Morning, or doom?”'
    claim: 'The Hebrew word is tsephirah (H6843); in Ezekiel it occurs only at 7:7 and 7:10 (scripts/hebrew.mjs ezekiel --word 6843)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/צְּפִירָ֛ה'
  - where: 'note 7:7 “Morning, or doom?”'
    claim: 'The word’s ordinary meaning is a plait, chaplet or diadem, as in Isaiah 28:5'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6843.htm'
    quote: 'chaplet, coronet, diadem'
  - where: 'note 7:7 “Morning, or doom?”'
    claim: 'The lexicon calls the sense here dubious, the King James “morning” (from Aramaic) unsuitable, and reports that most read doom or fate'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6843.htm'
    quote: 'is dubious; AV morning (as Ki, from Aramaic) is unsuitable; most (after AW ) doom, fate (as coming round upon one'
  - where: 'note 7:7 “Morning, or doom?”'
    claim: 'Isaiah 28:5 has the word as “diadem”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/28?lang=eng'
    quote: 'for a crown of glory, and for a diadem of beauty, unto the residue of his people'
  - where: 'note 7:7 “Morning, or doom?”'
    claim: 'A modern translation has “Your doom has come to you”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'Your doom has come to you, O inhabitant of the land.'
  - where: 'note 7:7 “Morning, or doom?”'
    claim: 'That translation marks the word as uncertain, in verse 10 as well'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'The meaning of the Hebrew word is uncertain; also verse 10'
  - where: 'note 7:7 “Morning, or doom?”'
    claim: 'Another modern translation also has “doom”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=NRSVUE'
    quote: 'Your doom has come to you'

  - where: 'note 7:7 “A shout on the mountains”'
    claim: 'The Hebrew word hed occurs only here and means a joyous shout, set against the noise of battle'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1906.htm'
    quote: 'only Ezekiel 7:7'
  - where: 'note 7:7 “A shout on the mountains”'
    claim: 'The lexicon’s gloss'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1906.htm'
    quote: '(joyous) shout on mountains (opposed to'
  - where: 'note 7:7 “A shout on the mountains”'
    claim: 'A modern translation: a day of tumult, not of joyful shouting on the mountains'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'of joyful shouting on the mountains'
  - where: 'note 7:7 “A shout on the mountains”'
    claim: 'Another modern translation: of tumult, not of reveling on the mountains'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=NRSVUE'
    quote: 'of tumult, not of reveling on the mountains'

  - where: 'note 7:9 “The LORD that smiteth”'
    claim: 'The added word is makkeh (H5221), a participle: “who strikes”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מַכֶּֽה'
  - where: 'note 7:9 “The LORD that smiteth”'
    claim: 'A modern translation renders “the Lord, who strikes”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'Then you will know that I am the Lord, who strikes'
  - where: 'note 7:9 “The LORD that smiteth”'
    claim: 'The words about the eye that does not spare come from 5:11, where the reason is the defiled sanctuary'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'because thou hast defiled my sanctuary with all thy detestable things, and with all thine abominations, therefore will I also diminish thee; neither shall mine eye spare, neither will I have any pity'
  - where: 'note 7:9 “The LORD that smiteth”'
    claim: 'A modern translation takes the clause about the abominations as “while your abominations are in your midst”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'while your abominations are in your midst'

  - where: 'note 7:10 “A rod in bloom”'
    claim: 'The rod is an instrument of chastisement, and the pride is that of the Chaldeans whom God uses'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'the rod as an instrument of chastisement (Isaiah 10:5)'
  - where: 'note 7:10 “A rod in bloom”'
    claim: 'The proud and violent people are the Chaldeans'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'God makes use of a proud and violent people, namely the Chaldeans'
  - where: 'note 7:10 “A rod in bloom”'
    claim: 'Sprouting and blossoming usually picture prosperity; here they picture the growth of the punishing power'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'Sprouting and blossoming, which are generally used as figurative representations of fresh and joyous prosperity, denote here the vigorous growth of that power which is destined to inflict the punishment'
  - where: 'note 7:10 “A rod in bloom”'
    claim: 'Isaiah calls Assyria the rod of the Lord’s anger'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/10?lang=eng'
    quote: 'O Assyrian, the rod of mine anger, and the staff in their hand is mine indignation'
  - where: 'note 7:10 “A rod in bloom”'
    claim: '“Violence” in 7:11 and in 7:23 is the same Hebrew word, chamas (H2555)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הֶ/חָמָ֥ס'
  - where: 'note 7:10 “A rod in bloom”'
    claim: 'Jerome took the “pride” as that of the Jews who despised God’s threats, as this commentary reports him'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/7.htm'
    quote: 'that "pride" refers to the Jews who despised'

  - where: 'note 7:13 “No jubilee to come”'
    claim: 'The words are explained from the law of the jubilee in Leviticus 25'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'are to be explained from the legal regulations concerning the year of Jubilee in Leviticus 25, according to which all landed property that had been sold was to revert to its original owner'
  - where: 'note 7:13 “No jubilee to come”'
    claim: 'The return will not happen, even for a seller still alive, because Israel will be banished'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'because Israel will be banished from the land'
  - where: 'note 7:13 “No jubilee to come”'
    claim: 'Jerome’s comment on the buyer and the seller, as Keil prints it'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'But when slavery and captivity stare you in the face, rejoicing and mourning are equally absurd.'
  - where: 'note 7:13 “No jubilee to come”'
    claim: 'In the jubilee, land that had changed hands reverted to its original family'
    key: 'bd-jubilee-year-of'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jubilee-year-of?lang=eng'
    quote: 'land that had changed hands, except in non-Levitical walled cities, reverted to the family to which it had belonged at the original settlement'
  - where: 'note 7:13 “No jubilee to come”'
    claim: 'The Old Testament records no observance of a jubilee, but the prophets allude to it'
    key: 'bd-jubilee-year-of'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jubilee-year-of?lang=eng'
    quote: 'We have no record in the Old Testament of the observance of any year of jubilee, but the prophets allude to it in various passages.'
  - where: 'note 7:13 “No jubilee to come”'
    claim: 'The law: the land is not sold for ever; in the jubilee each returns to his possession'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'In the year of this jubilee ye shall return every man unto his possession.'
  - where: 'note 7:13 “No jubilee to come”'
    claim: 'The land is not sold for ever'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'The land shall not be sold for ever: for the land is mine'

  - where: 'note 7:16 “Doves driven to the mountains”'
    claim: 'Valley doves frightened from their home are the picture; they are contrasted with mountain doves as tame with wild'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'when alarmed by the bird-catcher or the hawk, are obliged to forsake their natural abode, and fly elsewhere to save their lives. The mountain doves are contrasted with those of the valleys, as wild with tame.'
  - where: 'note 7:16 “Doves driven to the mountains”'
    claim: 'The ancients heard a dove’s cooing as a moan'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/7.htm'
    quote: 'The cooing of doves was regarded by the ancients as a moan'
  - where: 'note 7:16 “Doves driven to the mountains”'
    claim: 'Isaiah uses the same comparison'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/59?lang=eng'
    quote: 'We roar all like bears, and mourn sore like doves'
  - where: 'note 7:16 “Doves driven to the mountains”'
    claim: 'Chapter 6 promised a remnant that escapes'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'Yet will I leave a remnant, that ye may have some that shall escape the sword among the nations'

  - where: 'note 7:19 “Gold as an unclean thing”'
    claim: 'The Hebrew behind “removed” is niddah (H5079)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'לְ/נִדָּ֣ה'
  - where: 'note 7:19 “Gold as an unclean thing”'
    claim: 'Niddah means impurity, something abhorrent and shunned'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: 'impurity (as abhorrent, shunned)'
  - where: 'note 7:19 “Gold as an unclean thing”'
    claim: 'It is a term of ceremonial impurity, used figuratively of the gold in 7:19 and 7:20'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: 'figurative (with allusion to cerem. usage), impure thing, Ezekiel 7:19,20 (of gold)'
  - where: 'note 7:19 “Gold as an unclean thing”'
    claim: 'A modern translation: their gold is like an unclean thing'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'their gold is like an unclean thing'
  - where: 'note 7:19 “Gold as an unclean thing”'
    claim: 'The same word ends verse 20, where the King James has “set it far from them”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'I make it an unclean thing to them'
  - where: 'note 7:19 “Gold as an unclean thing”'
    claim: 'Zephaniah 1:18 has nearly the same sentence'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: 'Neither their silver nor their gold shall be able to deliver them in the day of the Lord’s wrath'
  - where: 'note 7:19 “Gold as an unclean thing”'
    claim: '“The stumblingblock of their iniquity” is used again of idols set up in the heart'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'these men have set up their idols in their heart, and put the stumblingblock of their iniquity before their face'

  - where: 'note 7:20 “The ornament and the secret place”'
    claim: 'The ornament is the temple, despoiled because the people had desecrated it with idols'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'is a reference to the temple, the most beautiful ornament of Jerusalem. The temple will be despoiled and desecrated by conquerors because the people had despoiled and spiritually desecrated it with their idols.'
  - where: 'note 7:20 “The ornament and the secret place”'
    claim: 'The Church’s footnote on “place” at 7:22 points to Jeremiah 7:14 and Ezekiel 24:21'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/7?lang=eng'
    quote: 'Jer. 7:14; Ezek. 24:21'
  - where: 'note 7:20 “The ornament and the secret place”'
    claim: 'Ezekiel 24:21 speaks of the sanctuary profaned'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Behold, I will profane my sanctuary, the excellency of your strength, the desire of your eyes'
  - where: 'note 7:20 “The ornament and the secret place”'
    claim: 'Chapter 5 had already charged the people with defiling the sanctuary with detestable things'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'because thou hast defiled my sanctuary with all thy detestable things'
  - where: 'note 7:20 “The ornament and the secret place”'
    claim: 'A modern translation reads jewelry'
    key: 'niv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207%3A19-27&version=NIV'
    quote: 'They took pride in their beautiful jewelry'
  - where: 'note 7:20 “The ornament and the secret place”'
    claim: 'The Hebrew of “therein” is bo, “in it” or “of it”; a modern translation has the images made “of it”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%207&version=ESV'
    quote: 'they made their abominable images and their detestable things of it'
  - where: 'note 7:20 “The ornament and the secret place”'
    claim: 'The Hebrew word is the preposition b with a third-person masculine singular suffix'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'ב֑/וֹ'
  - where: 'note 7:20 “The ornament and the secret place”'
    claim: 'The word behind “secret place” means something treasured or cherished; the lexicon takes it of Jerusalem'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6845.htm'
    quote: 'treasured, cherished place'
  - where: 'note 7:20 “The ornament and the secret place”'
