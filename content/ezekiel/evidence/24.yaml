chapter: 24
claims:
  - where: 'when'
    claim: 'The book counts its dates from Jehoiachin’s captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'The captivity began in about 597 B.C., so its ninth year is about 588 B.C.'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC'

  - where: 'setting'
    claim: 'Kings and Jeremiah give the same day for the beginning of the blockade'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'is mentioned in Jeremiah 52:4; Jeremiah 39:1, and 2 Kings 25:1, as the day on which Nebuchadnezzar blockaded the city of Jerusalem'
  - where: 'setting'
    claim: 'The Church’s footnote at 24:1 joins the date to 2 Kings 25:1 and Jeremiah 39:1 and 52:4'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: '2 Kgs. 25:1; Jer. 39:1; 52:4'
  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'The chapter has two words of God and a three-verse sequel'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'Apart, therefore, from the last three verses, this chapter contains two words of God'
  - where: 'setting'
    claim: 'Chapters 1–24 are the first division of the book, and 25–32 are against other nations'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(1) 1–24, prophecies of judgment against Jerusalem and the nation; (2) 25–32, prophecies against Israel’s enemies'
  - where: 'setting'
    claim: 'The model siege was commanded in chapter 4'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'consume away for their iniquity'

  - where: 'thread'
    claim: 'The same Hebrew phrase, the desire of the eyes, is used of the wife (24:16) and of the sanctuary (24:21)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מַחְמַ֥ד'

  - where: 'section 2 plain'
    claim: 'Verse 5: the fuel is piled under the pot (the Hebrew has “the bones”)'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'pile the logs under it'

  - where: 'note 24:2 “A date to be written down”'
    claim: 'The same date in Kings, as the day Nebuchadnezzar came against Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadnezzar king of Babylon came, he, and all his host, against Jerusalem, and pitched against it'
  - where: 'note 24:2 “A date to be written down”'
    claim: 'The ninth year of Jehoiachin’s captivity is the ninth year of Zedekiah’s reign'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'the tenth day of the tenth month of the ninth year after the carrying away of Jehoiachin (Ezekiel 1:2), or what is the same thing, of the reign of Zedekiah, who was appointed king in his stead'
  - where: 'note 24:2 “A date to be written down”'
    claim: 'Writing the name of the day means making a note of it'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'Writing the name of the day is equivalent to making a note of the day.'
  - where: 'note 24:2 “A date to be written down”'
    claim: 'Modern translations: the king of Babylon has laid siege to Jerusalem'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'The king of Babylon has laid siege to Jerusalem this very day'
  - where: 'note 24:2 “A date to be written down”'
    claim: 'The purpose of the recorded date: the fall was not chance or Babylon’s power'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'that the destruction of the city was not to be ascribed to chance or to the power of the Babylonians, but to the will of Him who had long ago foretold'
  - where: 'note 24:2 “A date to be written down”'
    claim: 'The recorded date would show Ezekiel a true prophet, who knew in Babylon the state of Jerusalem'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'Ezekiel was a true prophet, because even when in Babylon, which was at so great a distance, he had known and had publicly announced the state of Jerusalem'
  - where: 'note 24:2 “A date to be written down”'
    claim: 'After the captivity the day was kept as a fast (Zechariah 8:19)'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'after the captivity this day was still kept as a fast-day in consequence (Zechariah 8:19)'
  - where: 'note 24:2 “A date to be written down”'
    claim: 'Zechariah names the fast of the tenth month and promises it will become joy'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/8?lang=eng'
    quote: 'the fast of the tenth, shall be to the house of Judah joy and gladness, and cheerful feasts'

  - where: 'note 24:3 “The pot is Jerusalem”'
    claim: 'The pot is Jerusalem and the flesh and bones are its inhabitants'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The pot in this parable represents the city of Jerusalem. Its inhabitants are symbolized by the flesh and bones in the pot.'
  - where: 'note 24:3 “The pot is Jerusalem”'
    claim: 'The choice pieces are the leading inhabitants'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The choice pieces denote the strongest and most important inhabitants of the city'
  - where: 'note 24:3 “The pot is Jerusalem”'
    claim: 'The boiling is the siege'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Boiling the contents of the pot on the fires represents the siege of Jerusalem by the Babylonians.'
  - where: 'note 24:3 “The pot is Jerusalem”'
    claim: 'The leaders in Jerusalem had called the city the caldron and themselves the flesh'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'this city is the caldron, and we be the flesh'
  - where: 'note 24:3 “The pot is Jerusalem”'
    claim: 'The Lord answered that He would bring them out of it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'but I will bring you forth out of the midst of it'
  - where: 'note 24:3 “The pot is Jerusalem”'
    claim: 'Verse 5 in a modern translation: logs piled under the pot'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'pile the logs under it'
  - where: 'note 24:3 “The pot is Jerusalem”'
    claim: 'The translation notes that the Hebrew of verse 5 has “the bones”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'Compare verse 10; Hebrew the bones'

  - where: 'note 24:6 “Scum, or rust”'
    claim: 'The Hebrew word means rust on a metal pot'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2457.htm'
    quote: 'rust on metal pot, symbol of impurity of Jerusalem'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'The lexicon defines the noun as rust, perhaps in the sense of filth'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2457.htm'
    quote: 'rust (perhaps as filth'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'A modern translation has “corrosion”, and copper for brass in verse 11'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'the pot whose corrosion is in it, and whose corrosion has not gone out of it'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'Verse 11 in a modern translation: the copper is heated and the corrosion consumed'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'that it may become hot, and its copper may burn'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'The heating of the empty pot is the burning of the city after the siege'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The heating of the empty pot represents the burning of the city of Jerusalem after the siege.'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'Kings records the burning of the temple and the city'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And he burnt the house of the Lord, and the king’s house, and all the houses of Jerusalem'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'The noun in verse 12 is “toil”, and who is wearied is unclear'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8383.htm'
    quote: 'she hath wearied (me or herself) with toil'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'A modern translation marks verse 12 as uncertain'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'Ezekiel 24:12 The meaning of the Hebrew is uncertain'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'One modern translation of verse 12'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'She has wearied herself with toil'
  - where: 'note 24:6 “Scum, or rust”'
    claim: 'Another modern translation of verse 12 makes the Lord the one wearied'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=NRSVUE'
    quote: 'In vain I have wearied myself'

  - where: 'note 24:6 “No lot is cast”'
    claim: 'The Hebrew verb is a perfect: no lot has fallen'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נָפַ֥ל'
  - where: 'note 24:6 “No lot is cast”'
    claim: 'A modern translation notes the literal Hebrew'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'Ezekiel 24:6 Hebrew no lot has fallen upon it'
  - where: 'note 24:6 “No lot is cast”'
    claim: 'The lexicon’s explanation: no discrimination; the whole city is included'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1486.htm'
    quote: 'no lot is fallen over it, i.e. no discrimination is made, destruction is to include the whole city'
  - where: 'note 24:6 “No lot is cast”'
    claim: 'A modern translation of the clause'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'Take out of it piece after piece, without making any choice'
  - where: 'note 24:6 “No lot is cast”'
    claim: 'The Church edition’s footnote on the clause: none of the pieces is to be selected for consecration'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'let none of the pieces be selected for consecration'

  - where: 'note 24:7 “Blood left uncovered”'
    claim: 'The law required blood poured out to be covered with dust'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/17?lang=eng'
    quote: 'he shall even pour out the blood thereof, and cover it with dust'
  - where: 'note 24:7 “Blood left uncovered”'
    claim: 'The Hebrew phrase means a smooth, bare rock'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6706.htm'
    quote: 'a smooth, bare, rock Ezekiel 24:7,8'
  - where: 'note 24:7 “Blood left uncovered”'
    claim: 'Blood on rock cannot be absorbed and cries for vengeance'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'like blood poured out upon a hard rock, which the stone cannot absorb, and which cries to God for vengeance'
  - where: 'note 24:7 “Blood left uncovered”'
    claim: 'Genesis 4:10 is set beside the verse'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'because it is uncovered (cf. Genesis 4:10; Job 16:18; and Isaiah 26:21)'
  - where: 'note 24:7 “Blood left uncovered”'
    claim: 'Abel’s blood cried from the ground'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/4?lang=eng'
    quote: 'the voice of thy brother’s blood crieth unto me from the ground'
  - where: 'note 24:7 “Blood left uncovered”'
    claim: 'The city has done nothing to cover its sin and shown no repentance'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'has done nothing to cover her sin, has shown no sign of repentance or atonement'
  - where: 'note 24:7 “Blood left uncovered”'
    claim: 'In verse 8 God is the one who causes the blood to lie uncovered'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'He has caused the blood that was shed to fall upon a bare rock, that it might lie uncovered'
  - where: 'note 24:7 “Blood left uncovered”'
    claim: 'Jerusalem was called the bloody city in chapter 22'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'wilt thou judge the bloody city'

  - where: 'note 24:13 “A cleansing that was refused”'
    claim: 'The earlier cleansing was the effort to convert the people through the prophets'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'to convert the people from their sinful ways, partly by threats and promises communicated through the prophets'
  - where: 'note 24:13 “A cleansing that was refused”'
    claim: 'and through chastisements; 2 Chronicles 36:15 is cited'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: '(vid., 2 Chronicles 36:15), and partly by means of chastisements'
  - where: 'note 24:13 “A cleansing that was refused”'
    claim: 'The Lord sent messengers because He had compassion'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people'
  - where: 'note 24:13 “A cleansing that was refused”'
    claim: 'They were mocked until there was no remedy'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'until the wrath of the Lord arose against his people, till there was no remedy'
  - where: 'note 24:13 “A cleansing that was refused”'
    claim: 'Verse 12 is read as the failure of milder means of cleaning the pot'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/24.htm'
    quote: 'the pains, or wearisome exertions, to make it clean by milder means'
  - where: 'note 24:13 “A cleansing that was refused”'
    claim: 'A modern translation of the clause'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'because I would have cleansed you and you were not cleansed from your uncleanness'
  - where: 'note 24:13 “A cleansing that was refused”'
    claim: 'The fury brought to rest was first spoken of in 5:13'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'I will cause my fury to rest upon them'

  - where: 'note 24:14 “Who will judge”'
    claim: 'The Hebrew verb is third person plural'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שְׁפָט֔וּ'
  - where: 'note 24:14 “Who will judge”'
    claim: 'The Septuagint has the Lord as the judge'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/24.htm'
    quote: 'I will judge thee, saith the Lord, according to thy ways, and according to thy devices'
  - where: 'note 24:14 “Who will judge”'
    claim: 'One modern translation follows it'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=NRSVUE'
    quote: 'According to your ways and your doings I will judge you'
  - where: 'note 24:14 “Who will judge”'
    claim: 'Another makes the verb passive'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'according to your ways and your deeds you will be judged'

  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'The phrase means that in which the eyes take delight'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4261.htm'
    quote: 'desire of the eyes, i.e. that in which the eyes take delight'
  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'The noun occurs three times in Ezekiel, at 24:16, 21 and 25 (hebrew.mjs --word 4261)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מַחְמַ֥ד'
  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'The lexicon counts three occurrences in Ezekiel'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4261.htm'
    quote: '1 Kings 20:6 3t. Ezekiel'
  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'Lamentations 2:4 has the same noun'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4261.htm'
    quote: 'Lamentations 2:4; Hosea 9:16'
  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'Lamentations 2:4 in the King James Version'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/2?lang=eng'
    quote: 'slew all that were pleasant to the eye'
  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'The word for “stroke” here means a blow, a fatal stroke'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4046.htm'
    quote: 'blow, = fatal stroke Ezekiel 24:16'
  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'Elsewhere it is plague or pestilence as divine judgment'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4046.htm'
    quote: 'plague, pestilence (divine judgment)'
  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'A modern translation: at a stroke'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'I am about to take the delight of your eyes away from you at a stroke'
  - where: 'note 24:16 “The desire of thine eyes”'
    claim: 'Another: with one blow'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=NRSVUE'
    quote: 'with one blow I am about to take away from you the delight of your eyes'

  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'Ashes on the head, bare feet, covered lips and mourning bread were signs of grief'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Putting ashes on the head, making one’s feet bare, covering the lips, and eating bread of mourning were all signs of grief'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'The “tire” is a headdress or turban, a sign of joy as opposed to mourning'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6287.htm'
    quote: 'head-dress, turban (? originally ornament)'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'The headdress is a sign of joy, opposed to mourning'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6287.htm'
    quote: 'sign of joy Isaiah 61:3 (opposed to mourning, and so)'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'The word behind “lips” is the moustache'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8222.htm'
    quote: 'noun [masculine] moustache'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'A modern translation: upper lip, bread of mourners, groan quietly'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=NRSVUE'
    quote: 'Groan quietly; make no mourning for the dead. Bind on your turban, and put your sandals on your feet; do not cover your upper lip or eat the bread of mourners'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'Another modern translation of “Forbear to cry”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2024&version=ESV'
    quote: 'Sigh, but not aloud; make no mourning for the dead'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'The leper covered his upper lip'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he shall put a covering upon his upper lip'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'Seers put to shame cover their lips'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/3?lang=eng'
    quote: 'they shall all cover their lips'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'Hosea speaks of the bread of mourners'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/9?lang=eng'
    quote: 'their sacrifices shall be unto them as the bread of mourners'
  - where: 'note 24:17 “The signs of mourning he may not show”'
    claim: 'Jeremiah speaks of a cup of consolation given to mourners'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng'
