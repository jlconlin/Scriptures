chapter: 14
claims:
  - where: 'when'
    claim: 'The book’s second date is the sixth year, sixth month (8:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'when'
    claim: 'The book’s third date is the seventh year, fifth month (20:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year), so the sixth year is about 591 B.C.; the captivity is Jehoiachin’s'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin. He settled at Tel Abib on the Chebar and prophesied during a period of 22 years, 592–570 B.C.'

  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'Chapter 13 is against prophets who said Peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/13?lang=eng'
    quote: 'Because, even because they have seduced my people, saying, Peace; and there was no peace'
  - where: 'setting'
    claim: 'The chapter contains two words of God, verses 1–11 and 12–23'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'This chapter contains two words of God, which have obviously an internal connection with each other.'
  - where: 'setting'
    claim: 'Jeremiah records a like word with Moses and Samuel; the Church footnote at 14:14 joins it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng'
    quote: 'Though Moses and Samuel stood before me, yet my mind could not be toward this people'
  - where: 'setting'
    claim: 'Chapter 18 argues that each bears his own righteousness or wickedness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/18?lang=eng'
    quote: 'the righteousness of the righteous shall be upon him, and the wickedness of the wicked shall be upon him'
  - where: 'setting'
    claim: 'The Joseph Smith Translation changes 14:9 (footnote 9a in the Church edition)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'I the Lord have not deceived'

  - where: 'thread'
    claim: 'The second word of God removes the hope that Jerusalem will be spared for the righteous in it'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'The second (Ezekiel 14:12-23) denounces the false hope that God will avert the judgment and spare Jerusalem because of the righteousness of the godly men therein.'
  - where: 'thread'
    claim: 'The first word of God: the Lord answers idolaters with judgment and destroys the prophets who answer them'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'will answer all who do not turn from idolatry with severe judgments, and will even destroy the prophets who venture to give an answer to such inquirers'

  - where: 'section 1 plain'
    claim: '“Set up their idols in their heart” is rendered “taken their idols into their hearts”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'these men have taken their idols into their hearts'
  - where: 'section 1 plain'
    claim: '“Take the house of Israel in their own heart” is rendered “lay hold of the hearts”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'that I may lay hold of the hearts of the house of Israel'
  - where: 'section 2 plain'
    claim: '“A sign and a proverb” is rendered “a sign and a byword”; “by myself” as “myself”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'make him a sign and a byword'
  - where: 'section 3 plain'
    claim: '“Trespassing grievously” is rendered “acting faithlessly”; “staff of the bread” as “supply of bread”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'by acting faithlessly'
  - where: 'section 3 plain'
    claim: '“Noisome beasts … spoil it” is rendered wild beasts that ravage it'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'wild beasts to pass through the land, and they ravage it'
  - where: 'section 3 plain'
    claim: '“Their own souls” means their own lives'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=NRSVUE'
    quote: 'they would save only their own lives by their righteousness'
  - where: 'section 4 plain'
    claim: 'The Hebrew for “noisome” is “wild or evil” (Church footnote 15a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'HEB wild or evil'

  - where: 'note 14:1 “Elders in the prophet’s house”'
    claim: 'The elders sat before Ezekiel in his house at 8:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'as I sat in mine house, and the elders of Judah sat before me'
  - where: 'note 14:1 “Elders in the prophet’s house”'
    claim: 'The third visit is dated to the seventh year, a year after the date of 8:1, and those elders come to inquire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month, that certain of the elders of Israel came to inquire of the Lord, and sat before me.'
  - where: 'note 14:1 “Elders in the prophet’s house”'
    claim: 'In exile the elders came to Ezekiel’s home to counsel with him (8:1; 14:1; 20:1)'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'while he was in exile the elders of the Jews came to his home to counsel with him (for example, see Ezekiel 8:1; 14:1; 20:1)'
  - where: 'note 14:1 “Elders in the prophet’s house”'
    claim: 'He worked as a prophet face to face'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'he functioned as a prophet in a very personal, face-to-face setting'

  - where: 'note 14:3 “Idols taken into the heart”'
    claim: 'The Hebrew verb is the hiphil (causative) of the verb “go up” (H5927), with “upon their heart”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הֶעֱל֤וּ'
  - where: 'note 14:3 “Idols taken into the heart”'
    claim: 'A modern translation renders “taken their idols into their hearts”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'these men have taken their idols into their hearts'
  - where: 'note 14:3 “Idols taken into the heart”'
    claim: 'The word for idols is gillulim; mikshol (H4383) occurs eight times in Ezekiel (3:20; 7:19; 14:3, 4, 7; 18:30; 21:15; 44:12), three of them in this chapter'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מִכְשׁ֣וֹל'
  - where: 'note 14:3 “Idols taken into the heart”'
    claim: 'At 7:19 the stumblingblock of their iniquity is silver and gold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/7?lang=eng'
    quote: 'their silver and their gold shall not be able to deliver them in the day of the wrath of the Lord: they shall not satisfy their souls, neither fill their bowels: because it is the stumblingblock of their iniquity'
  - where: 'note 14:3 “Idols taken into the heart”'
    claim: 'A modern translation renders “placed their iniquity as a stumbling block before them”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=NRSVUE'
    quote: 'placed their iniquity as a stumbling block before them'
  - where: 'note 14:3 “Whether the Lord will be consulted”'
    claim: 'The Hebrew writes the verb “inquire” (H1875) twice, infinitive absolute and finite niphal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אִדָּרֵ֖שׁ'
  - where: 'note 14:3 “Whether the Lord will be consulted”'
    claim: 'A modern translation: “Should I indeed let myself be consulted by them?”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'Should I indeed let myself be consulted by them?'
  - where: 'note 14:3 “Whether the Lord will be consulted”'
    claim: 'The Church’s footnote on “inquired” points to Ezek. 20:3 and 36:37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'Ezek. 20:3; 36:37'
  - where: 'note 14:3 “Whether the Lord will be consulted”'
    claim: 'The promise to be inquired of follows the promise of cleansing and a new heart in chapter 36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'I will yet for this be inquired of by the house of Israel, to do it for them'

  - where: 'note 14:4 “The answer the Lord gives”'
    claim: 'Modern translations render verse 7’s “by myself” as “myself”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'I the Lord will answer him myself'
  - where: 'note 14:4 “The answer the Lord gives”'
    claim: 'The Septuagint has “according to the things in which his mind is entangled”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/14.htm'
    quote: 'I the Lord will answer him according to the things in which his mind is entangled'
  - where: 'note 14:4 “The answer the Lord gives”'
    claim: 'Verse 8 states the answer: face set against him, a sign and a proverb, cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'And I will set my face against that man, and will make him a sign and a proverb, and I will cut him off from the midst of my people'

  - where: 'note 14:5 “Laid hold of by the heart”'
    claim: 'Taphas means lay hold of, seize'
    key: bdb
    url: 'https://biblehub.com/hebrew/8610.htm'
    quote: 'lay hold of, seize (with the hand)'
  - where: 'note 14:5 “Laid hold of by the heart”'
    claim: 'Ezek. 14:5 is listed as a figurative use: seize Israel by their heart'
    key: bdb
    url: 'https://biblehub.com/hebrew/8610.htm'
    quote: 'figurative Ezekiel 14:5 seize Israel (accusative) by (ב) their heart (terrorize them)'
  - where: 'note 14:5 “Laid hold of by the heart”'
    claim: 'A modern translation: “that I may lay hold of the hearts of the house of Israel”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=ESV'
    quote: 'that I may lay hold of the hearts of the house of Israel'
  - where: 'note 14:5 “Laid hold of by the heart”'
    claim: 'The verb “estranged” is the niphal of zur, the same form as in Isa. 1:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'Isaiah 1:4; Ezekiel 14:5; be estranged Isaiah 1:4'
  - where: 'note 14:5 “Laid hold of by the heart”'
    claim: 'The same root gives the word for foreigners'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'foreigners (as such usually enemies)'
  - where: 'note 14:5 “Laid hold of by the heart”'
    claim: 'Isaiah 1:4 is a charge against the nation, ending “they are gone away backward”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'they have provoked the Holy One of Israel unto anger, they are gone away backward'

  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'Leviticus 17:10 has the Israelite and the stranger, the face set against, and the cutting off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/17?lang=eng'
    quote: 'whatsoever man there be of the house of Israel, or of the strangers that sojourn among you, that eateth any manner of blood; I will even set my face against that soul that eateth blood, and will cut him off from among his people'
  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'The Church’s footnote on “face” in verse 8 points to Lev. 17:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'Lev. 17:10'
  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'Leviticus 20:6 has the same sentence against those who turn to familiar spirits and wizards'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'And the soul that turneth after such as have familiar spirits, and after wizards, to go a whoring after them, I will even set my face against that soul, and will cut him off from among his people.'
  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'Deuteronomy 28:37 has “a proverb, and a byword” among the covenant curses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'And thou shalt become an astonishment, a proverb, and a byword, among all nations whither the Lord shall lead thee.'
  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'Nazar (niphal) means to devote or dedicate oneself, or hold sacredly aloof; in Ezek. 14:7 it is used with “from” the Lord, of apostasy'
    key: bdb
    url: 'https://biblehub.com/hebrew/5144.htm'
    quote: 'devote, dedicate oneself unto'
  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'BDB marks the use in Ezek. 14:7 as “of apostasy” and gives “hold sacredly aloof from” for Lev. 22:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/5144.htm'
    quote: 'Ezekiel 14:7 (of apostasy); hold sacredly aloof from'

  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'The wording of verse 7 is taken almost verbatim from Leviticus 17:8, 10, 13'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'The phraseology of Ezekiel 14:7 is adopted almost verbatim from Leviticus 17:8'

  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'The law obliged foreigners in Israel to avoid idolatry (Lev. 20:2; 18:26; 17:10)'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'On the obligation of foreigners to avoid idolatry and all moral abominations'

  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: 'The threat of verse 8 is made up of passages in the law, among them Leviticus 20:3, 5–6'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'The threat is composed of passages in the law'

  - where: 'note 14:7 “The law’s sentence, for Israelite and stranger”'
    claim: '“A sign and a proverb” follows Deuteronomy 28:37, somewhat freely'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'though somewhat freely, after Deuteronomy 28:37'

  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'The Church edition’s footnote gives the Joseph Smith Translation of 14:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/14?lang=eng'
    quote: 'I the Lord have not deceived'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'The full sentence of the Joseph Smith Translation'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: '“And if the prophet be deceived when he hath spoken a thing, I the Lord have not deceived that prophet.”'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'The Septuagint has the same sense as the Hebrew'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/14.htm'
    quote: 'I the Lord have caused that prophet to err'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'Pittah means to persuade, to entice'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'to persuade, to entice by friendly words'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'BDB lists Ezek. 14:9 with Jer. 20:7 (the Lord as subject, a prophet as object) and compares 1 Kgs. 22:20–22'
    key: bdb
    url: 'https://biblehub.com/hebrew/6601.htm'
    quote: 'object prophet, Jeremiah 20:7; Ezekiel 14:9, compare 1 Kings 22:20,21,22'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'Jeremiah 20:7 has the same verb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng'
    quote: 'thou hast deceived me, and I was deceived: thou art stronger than I, and hast prevailed'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'In Micaiah’s vision a spirit offers to be a lying spirit in the mouth of Ahab’s prophets and is told to persuade him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'I will go forth, and I will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt persuade him, and prevail also: go forth, and do so.'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'One explanation: Hebrew states as done by the Lord what He only permits'
    key: clarke-ezekiel
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/14.htm'
    quote: 'it is common in the Hebrew language to state a thing as done by the Lord which he only suffers or permits to be done'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'The prophets of chapter 13 prophesy out of their own hearts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/13?lang=eng'
    quote: 'say thou unto them that prophesy out of their own hearts, Hear ye the word of the Lord'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'The prophet here is one who really thinks he has a word of God, unlike the prophets of 13:2'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'one who really thinks that he has a word of God'
  - where: 'note 14:9 “Does the Lord deceive a prophet?”'
    claim: 'The word he gives is any word other than verses 6–8 that could confirm the sinner in security'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'The allusion is simply to a word of a different character from that contained in Ezekiel 14:6-8, which either demands repentance or denounces judgment upon the impenitent: every word, therefore, which could by any possibility confirm the sinner in his security.'

  - where: 'note 14:11 “What the judgment is for”'
    claim: 'The covenant sentence stands with the promise of a new heart at 11:19–20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'That they may walk in my statutes, and keep mine ordinances, and do them: and they shall be my people, and I will be their God.'
  - where: 'note 14:11 “What the judgment is for”'
    claim: 'It returns in chapter 37, in the passage on the two kingdoms made one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'so shall they be my people, and I will be their God'
  - where: 'note 14:11 “What the judgment is for”'
    claim: 'A modern translation’s cross-references join 14:11 to 11:20 and 37:27'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2014&version=NRSVUE'
    quote: '14.11 : Ezek 11.20; 37.27; 44.10, 15'

  - where: 'note 14:14 “Why Noah, Daniel, and Job”'
    claim: 'Daniel was a contemporary of Ezekiel in Babylon, respected by Nebuchadnezzar'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Daniel, who was a contemporary of Ezekiel in Babylon, was one of the most righteous men on the earth at the time and was highly favored of God. He was even respected by Nebuchadnezzar'
  - where: 'note 14:14 “Why Noah, Daniel, and Job”'
    claim: 'Noah and Job are called perfect, meaning completely upright in living the commandments given them'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The Lord referred to both Noah and Job as being perfect (see Genesis 6:9; Job 1:1, 8; 2:3), meaning that they were completely upright before God in living the commandments He had given them.'
  - where: 'note 14:14 “Why Noah, Daniel, and Job”'
    claim: 'Daniel was taken captive to Babylon'
    key: bd-daniel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel?lang=eng'
    quote: 'he was taken captive to Babylon and received the name of Belteshazzar'
  - where: 'note 14:14 “Why Noah, Daniel, and Job”'
    claim: 'The Bible Dictionary counts Ezek. 14:14, 20 and 28:3 as references to the Daniel of the book of Daniel'
    key: bd-daniel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel?lang=eng'
    quote: 'There are references to him in Ezek. 14:14, 20; 28:3; Heb. 11:33.'
  - where: 'note 14:14 “Why Noah, Daniel, and Job”'
    claim: 'The siege in which Daniel was taken is dated to the third year of Jehoiakim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'In the third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon unto Jerusalem, and besieged it.'
  - where: 'note 14:14 “Why Noah, Daniel, and Job”'
    claim: 'The order is not chronological but follows the deliverance each experienced'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'For the enumeration is not intended to be chronological, but is arranged according to the subject-matter'
  - where: 'note 14:14 “Why Noah, Daniel, and Job”'
    claim: 'Noah saved his family, Daniel his friends, Job not even his children'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/14.htm'
    quote: 'Noah saved his family along with himself; Daniel was able to save his friends (Daniel 2:17-18); but Job, with his righteousness, was not even able to save his children.'
  - where: 'note 14:14 “Why Noah, Daniel, and Job”'
    claim: 'Noah’s house entered the ark because he was righteous'
    key: lds-scriptures
