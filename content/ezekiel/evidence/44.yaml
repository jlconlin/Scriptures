chapter: 44
claims:
  - where: 'when'
    claim: 'The vision of chapters 40–48 is dated to the twenty-fifth year of the captivity, the fourteenth after the city was smitten'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'
  - where: 'when'
    claim: 'The book’s first date is the fifth year of Jehoiachin’s captivity, from which the twenty-fifth is counted'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'

  - where: 'setting'
    claim: 'In the vision Ezekiel is set on a very high mountain in the land of Israel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the visions of God brought he me into the land of Israel, and set me upon a very high mountain'
  - where: 'setting'
    claim: 'The guide carries a measuring reed'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'with a line of flax in his hand, and a measuring reed; and he stood in the gate'
  - where: 'setting'
    claim: 'In chapter 43 the glory of the LORD returned to the house'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'So the spirit took me up, and brought me into the inner court; and, behold, the glory of the Lord filled the house.'
  - where: 'setting'
    claim: 'The chapter’s directions come in three parts: the prince; foreigners, Levites and priests; the conduct and privileges of the priests'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'secondly, as to the admission of foreigners and the appointment of Levites and priests for the service'
  - where: 'setting'
    claim: 'The vision prescribes the temple’s service in detail (Talmage, as the Student Manual prints him)'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'The service of the Temple was prescribed in detail; the ordinances of the altar, the duties of the priests, the ministry of the Levites'
  - where: 'setting'
    claim: 'Ezekiel was a priest of Zadok’s family'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'A priest of the family of Zadok'
  - where: 'setting'
    claim: 'The chapter restates the priests’ law of Leviticus (the Church’s footnotes on verses 20–25 give Leviticus 21 and 10)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Lev. 21:14 (7, 13–14).'
  - where: 'setting'
    claim: 'The offerings of this temple begin with the consecration of the altar in 43:18–27'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'These are the ordinances of the altar in the day when they shall make it, to offer burnt offerings thereon'

  - where: 'thread'
    claim: 'The Hebrew noun behind “charge” (mishmeret, H4931) comes five times in verses 8–16: twice in 8, and in 14, 15 and 16 (scripts/hebrew.mjs ezekiel --word 4931)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מִשְׁמֶ֣רֶת'

  - where: 'section 1 plain'
    claim: '“The gate of the outward sanctuary” is the outer gate of the sanctuary'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=ESV'
    quote: 'to the outer gate of the sanctuary'
  - where: 'section 4 plain'
    claim: '“Poll” is cut or trim (footnote 20b)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'OR cut, trim.'
  - where: 'section 4 plain'
    claim: '“Her that is put away” is a divorced woman (footnote 22b)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'OR divorced.'

  - where: 'note 44:2 “A gate closed because the Lord came through it”'
    claim: 'The gate of verse 1 is the outer east gate, and it is to remain shut'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=ESV'
    quote: 'This gate shall remain shut; it shall not be opened, and no one shall enter by it'
  - where: 'note 44:2 “A gate closed because the Lord came through it”'
    claim: 'The east gate is the first gate the guide measured'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'Then came he unto the gate which looketh toward the east, and went up the stairs thereof, and measured the threshold of the gate'
  - where: 'note 44:2 “A gate closed because the Lord came through it”'
    claim: 'When the glory left, it went from the midst of the city to the mountain east of it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'And the glory of the Lord went up from the midst of the city, and stood upon the mountain which is on the east side of the city.'
  - where: 'note 44:2 “A gate closed because the Lord came through it”'
    claim: 'The gate is not shut to keep the glory from departing'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'This reason is of course not to be understood in the way suggested by the Rabbins, namely, that the departure of the Shechinah from the temple was to be prevented by the closing of the gate'
  - where: 'note 44:2 “A gate closed because the Lord came through it”'
    claim: 'The gateway was made holy by the glory’s entrance and is kept holy by being closed to the people'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'because this gateway had been rendered holy through the entrance of the Shechinah into the temple thereby, it was not to remain open to the people, so as to be desecrated, but was to be kept perpetually holy'
  - where: 'note 44:2 “A gate closed because the Lord came through it”'
    claim: 'The inner east gate is shut on working days and opened on the sabbath'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/46?lang=eng'
    quote: 'The gate of the inner court that looketh toward the east shall be shut the six working days; but on the sabbath it shall be opened'

  - where: 'note 44:3 “Who is the prince?”'
    claim: 'The Hebrew word for “prince” in 44:3 is nasi (H5387) (scripts/hebrew.mjs ezekiel 44:3)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נָ֥שִׂיא'
  - where: 'note 44:3 “Who is the prince?”'
    claim: 'The lexicon sets 44:3 for comparison beside 34:24 and 37:25 under “future Davidic king”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5387.htm'
    quote: 'future Davidic king Ezekiel 34:24; Ezekiel 37:25, compare Ezekiel 44:3'
  - where: 'note 44:3 “Who is the prince?”'
    claim: 'The Church’s footnote on “prince” gives Ezekiel 34:24 and 37:25'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Ezek. 34:24; 37:25 (24–25); 45:7; 48:21.'
  - where: 'note 44:3 “Who is the prince?”'
    claim: 'The David of 34:23–24 is Jesus Christ, a descendant of David, not the ancient king'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'This does not refer to King David, who died about four centuries before Ezekiel’s ministry. Rather, it is a reference to Jesus Christ, the Good Shepherd, who was a descendant of David.'
  - where: 'note 44:3 “Who is the prince?”'
    claim: 'The prince has been read as not the Messiah but a civil ruler under Him, because he offers for himself'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/44.htm'
    quote: 'not King Messiah, as He never would offer a burnt offering for Himself, as the prince is to do (Eze 46:4). The prince must mean the civil ruler under Messiah.'
  - where: 'note 44:3 “Who is the prince?”'
    claim: 'On that reading his place at the east gate shows his nearness to God as one ruling under Him'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/44.htm'
    quote: 'as ruling under God, he is to stand in a place of peculiar nearness to God'
  - where: 'note 44:3 “Who is the prince?”'
    claim: 'The Church’s footnote on “bread” gives Genesis 31:54'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Gen. 31:54.'
  - where: 'note 44:3 “Who is the prince?”'
    claim: 'Eating bread before the Lord is a custom connected with sacrifices'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/44.htm'
    quote: 'a custom connected with sacrifices (Ge 31:54; Ex 18:12; 24:11; 1Co 10:18)'
  - where: 'note 44:3 “Who is the prince?”'
    claim: 'Chapter 46 says where the prince stands while his offerings are prepared'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/46?lang=eng'
    quote: 'the priests shall prepare his burnt offering and his peace offerings, and he shall worship at the threshold of the gate'

  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: '“Strangers” is bene nekar, sons of a foreigner (scripts/hebrew.mjs ezekiel 44:7)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נֵכָ֗ר'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'The phrase means foreigner, and the lexicon lists Ezekiel 44:7 and 44:9 under it'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5236.htm'
    quote: 'foreigner Genesis 17:12'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'Modern translations render it “foreigners”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=ESV'
    quote: 'admitting foreigners'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'An uncircumcised heart is a figure of character, and the lexicon puts Jeremiah 9:25 and Ezekiel 44:7, 9 together under it'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6189.htm'
    quote: 'of character'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'The emphasis of the prohibition is on the uncircumcised heart'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'The emphasis of the prohibition lies here, as in Ezekiel 44:7, upon their being uncircumcised in heart'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'Israelites without circumcision of heart would be kept away as well'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'but also Israelites who were circumcised in flesh, were to keep at a distance from the sanctuary if they failed to possess circumcision of heart'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'Solomon’s prayer for the foreigner is set beside the verse'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'Solomon accordingly prays to the Lord in his temple-prayer that He will also hearken to the prayer of the foreigner'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'The command does not abolish the place of foreigners living in Israel, since 47:22–23 gives them a possession'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'for this would be at variance with Ezekiel 47:22 and Ezekiel 47:23, according to which the foreigners'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'The NRSVUE supplies “foreigners” in verse 8'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=NRSVUE'
    quote: 'you have appointed foreigners to act for you in keeping my charge in my sanctuary'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'The NRSVUE notes that the Hebrew lacks the word'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=NRSVUE'
    quote: 'Heb lacks foreigners'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'The ESV has “others” in verse 8'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=ESV'
    quote: 'you have set others to keep my charge for you in my sanctuary'
  - where: 'note 44:7 “Strangers uncircumcised in heart”'
    claim: 'Verse 8 has been taken spiritually and not literally'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'Allowing them to tread the temple is regarded as equivalent to appointing them to take charge of the worship in the temple.'

  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: 'The work of the Levites was to assist the priests'
    key: 'bd-levites'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The work of the Levites was to assist the priests'
  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: 'Levites slaughtered the sacrifices and assisted in the temple'
    key: 'bd-levites'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'slaughtered the sacrifices (2 Chr. 29:34; 35:11; Ezra 6:20); and generally assisted in the temple'
  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: 'Levites are sometimes spoken of as distinct from the priests'
    key: 'bd-levites'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The Levites are sometimes spoken of as distinct from the priests'
  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: 'The Church’s footnote on verse 13 gives 2 Kings 23:9'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Num. 18:3; 2 Kgs. 23:9.'
  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: 'Josiah brought the priests out of the cities of Judah and defiled the high places'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And he brought all the priests out of the cities of Judah, and defiled the high places where the priests had burned incense'
  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: '“Bear their iniquity” is “bear their punishment” in the ESV'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=ESV'
    quote: 'shall bear their punishment'
  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: 'Where the King James Version has “lifted up mine hand against them,” the ESV has “sworn concerning them”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=ESV'
    quote: 'sworn concerning them'
  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: 'Temple gatekeepers were Levites with nonsacrificial duties'
    key: 'shannon-guarded'
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'part of the Levites, charged with nonsacrificial responsibilities in the temple'
  - where: 'note 44:11 “Levites kept from the altar, kept in the house”'
    claim: 'Gatekeepers kept the temple’s boundaries by controlling access through the gates'
    key: 'shannon-guarded'
    url: 'https://rsc.byu.edu/ascending-mountain-lord/come-near-unto-me-guarded-space-its-mediators-jerusalem-temple'
    quote: 'These officers were therefore responsible for maintaining the boundaries within the temple by controlling access to the temple through the gates.'

  - where: 'note 44:15 “Why the sons of Zadok”'
    claim: '“The priests the Levites” is “the Levitical priests” in the ESV'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=ESV'
    quote: 'the Levitical priests'
  - where: 'note 44:15 “Why the sons of Zadok”'
    claim: 'Scripture sometimes speaks as though all Levites were priests, in the phrase “the priests, the Levites,” found in Deuteronomy'
    key: 'bd-levites'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'sometimes as though all Levites were also priests, “the priests, the Levites” (Deut. 18:1; Josh. 3:3)'
  - where: 'note 44:15 “Why the sons of Zadok”'
    claim: 'The Bible Dictionary gives “Righteous” for the name Zadok'
    key: 'bd-zadok'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'Righteous. The priest'
  - where: 'note 44:15 “Why the sons of Zadok”'
    claim: 'The Student Manual takes the choice of Zadok’s descendants as holding for the latter-day temple in Jerusalem'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Apparently the Lord desired the descendants of the righteous Zadok to officiate in the latter-day temple in Jerusalem'
  - where: 'note 44:15 “Why the sons of Zadok”'
    claim: 'The table of verse 16 is the one named at 41:22'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Ezek. 41:22; Mal. 1:12 (7, 12).'

  - where: 'note 44:18 “Linen, and nothing that causes sweat”'
    claim: 'Wool is forbidden so that the priest will not sweat'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'the motive being assigned for this regulation, namely, that the priest is not to cause himself to sweat by wearing woollen clothing'
  - where: 'note 44:18 “Linen, and nothing that causes sweat”'
    claim: 'Sweat produces uncleanness, and the clean body shows the priest clean and blameless'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'Sweat produces uncleanness; and the priest, by keeping his body clean, is to show even outwardly that he is clean and blameless.'
  - where: 'note 44:18 “Linen, and nothing that causes sweat”'
    claim: 'In these rules the bodily condition stands for the state of the soul'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'as the bodily condition shadows forth the state of the soul, or the spiritual constitution of the servants of God'
  - where: 'note 44:18 “Linen, and nothing that causes sweat”'
    claim: 'Linen has been called a symbol of purity, and wool a cause of perspiration'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/44.htm'
    quote: 'symbolical of purity. Wool soon induces perspiration in the sultry East and so becomes uncleanly.'
  - where: 'note 44:18 “Linen, and nothing that causes sweat”'
    claim: 'The ESV renders the end of verse 19 as transmitting holiness'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2044&version=ESV'
    quote: 'lest they transmit holiness to the people with their garments'
  - where: 'note 44:18 “Linen, and nothing that causes sweat”'
    claim: 'The rule about leaving the garments was given when the chambers were measured (42:14; the Church’s footnote on “garments” in verse 19)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/42?lang=eng'
    quote: 'but there they shall lay their garments wherein they minister; for they are holy; and shall put on other garments'

  - where: 'note 44:22 “The law of the priests, with one rule made stricter”'
    claim: 'Priests were under special restrictions about the dead, marriage, and wine'
    key: 'bd-priests'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'They were under special restrictions with respect to uncleanness for the dead, marriage, wine or strong drink when engaged in sacerdotal duties'
  - where: 'note 44:22 “The law of the priests, with one rule made stricter”'
    claim: 'The kin for whom a priest may be defiled are the same in Leviticus 21:1–3 (the Church’s footnote on verse 25)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'for his mother, and for his father, and for his son, and for his daughter, and for his brother'
  - where: 'note 44:22 “The law of the priests, with one rule made stricter”'
    claim: 'Leviticus 21:1–3 includes the unmarried sister'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'And for his sister a virgin, that is nigh unto him, which hath had no husband; for her may he be defiled.'
  - where: 'note 44:22 “The law of the priests, with one rule made stricter”'
    claim: 'Leviticus 21:13–14 is spoken of the high priest (the passage begins at verse 10)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'And he that is the high priest among his brethren, upon whose head the anointing oil was poured'
  - where: 'note 44:22 “The law of the priests, with one rule made stricter”'
    claim: 'The Church’s footnote on “widow” gives Leviticus 21:14 with verses 7 and 13–14'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Lev. 21:14 (7, 13–14).'
  - where: 'note 44:22 “The law of the priests, with one rule made stricter”'
    claim: 'The Church’s footnote on verse 31 gives Leviticus 22:8'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Lev. 22:8.'
  - where: 'note 44:22 “The law of the priests, with one rule made stricter”'
    claim: 'Ezekiel said he had never eaten what dies of itself or is torn'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'have I not eaten of that which dieth of itself, or is torn in pieces'

  - where: 'note 44:23 “Priests as teachers and judges”'
    claim: 'A priest exercised his office mainly at the altar but also by teaching the law; Leviticus 10:10–11 and Malachi 2:7 are cited for the teaching'
    key: 'bd-priests'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/priests?lang=eng'
    quote: 'but also by teaching the people the law (Lev. 10:10, 11; Deut. 33:10; Mal. 2:7)'
  - where: 'note 44:23 “Priests as teachers and judges”'
    claim: 'The priest’s office was exercised mainly at the altar'
    key: 'bd-priests'
