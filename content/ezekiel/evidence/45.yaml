chapter: 45
claims:
  - where: 'when'
    claim: 'The vision of chapters 40–48 is dated to the twenty-fifth year of the captivity, the fourteenth after the city was smitten'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'
  - where: 'when'
    claim: 'The book counts its years from the captivity of Jehoiachin; the twenty-fifth year is counted from that first date (about 597 B.C. in the brief, so about 573)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'

  - where: 'setting'
    claim: 'The glory entered the house by the east gate in chapter 43, before the laws of chapters 43–46'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'came into the house by the way of the gate whose prospect is toward the east'
  - where: 'setting'
    claim: 'The whole land is divided in strips from the Mediterranean to the Jordan and the Dead Sea'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'the Holy Land will be divided in strips running between the Mediterranean Sea on the west and the Dead Sea and the Jordan River on the east'
  - where: 'setting'
    claim: 'A strip in the middle is for the prince, the city, the Levites and the priests'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Each of the twelve tribes will be given a strip of land with a strip out of the middle for the prince, the city, and the Levites, that is, the priests.'
  - where: 'setting'
    claim: 'The fuller account of the reserved land and the tribes comes in chapter 48'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'shall be the offering which ye shall offer of five and twenty thousand reeds in breadth, and in length as one of the other parts, from the east side unto the west side'

  - where: 'thread'
    claim: 'The chapter moves from the land (1–8) to honest measures (9–12), the people’s offering (13–17) and the feasts (18–25)'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/45.htm'
    quote: 'Regulations concerning the weights and measures, Ezekiel 45:9-12; with ordinances respecting the provisions for the ordinary and extraordinary sacrifices, Ezekiel 45:13-25.'
  - where: 'thread'
    claim: 'The same word, oblation, is used of the land in verse 1 and of the produce in verse 13'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'contribution for prince, in Ezekiel''s scheme: Ezekiel 45:13,16'

  - where: 'section 1 plain'
    claim: 'The plain words keep the King James reading of verse 8, with the Church footnote’s sense of the first clause'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'In the land shall be his possession in Israel: and my princes shall no more oppress my people'

  - where: 'note 45:1 “The land itself is the offering”'
    claim: 'The Hebrew word for “oblation” in verse 1 is terumah'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תְרוּמָ֨ה'
  - where: 'note 45:1 “The land itself is the offering”'
    claim: 'Terumah means a contribution or offering for sacred uses'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'contribution, offering, for sacred uses'
  - where: 'note 45:1 “The land itself is the offering”'
    claim: 'Its root sense is something lifted off or separated'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: '(properly something lifted off, separated)'
  - where: 'note 45:1 “The land itself is the offering”'
    claim: 'In Ezekiel 45 and 48 the word is used of a tract of land'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'tract of land to be set apart for temple, and for use of priests and Levites, in Ezekiel''s scheme'
  - where: 'note 45:1 “The land itself is the offering”'
    claim: 'The same word names the people’s contribution in verses 13 and 16'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'contribution for prince, in Ezekiel''s scheme: Ezekiel 45:13,16'
  - where: 'note 45:1 “The land itself is the offering”'
    claim: 'Aaron was to have no inheritance in the land'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance among the children of Israel.'
  - where: 'note 45:1 “The land itself is the offering”'
    claim: 'The preceding chapter says the same of the priests of this temple'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'And it shall be unto them for an inheritance: I am their inheritance: and ye shall give them no possession in Israel: I am their possession.'
  - where: 'note 45:1 “The land itself is the offering”'
    claim: 'Chapter 48 places the sanctuary in the midst of the priests’ portion'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'and the sanctuary of the Lord shall be in the midst thereof'

  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The Hebrew of verse 1 gives the numbers without a unit of measure, and one commentator takes them as rods (reeds), not cubits'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/45.htm'
    quote: 'In the numbers mentioned the measure to be employed is not given. But it is obvious that cubits are not meant'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The argument for reeds: only the fifty of verse 2 is marked as cubits'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/45.htm'
    quote: 'the open space around the sanctuary is fixed at fifty cubits'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The Hebrew of verse 1 has “ten” thousand for the breadth'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'עֲשָׂ֣רָה'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The Septuagint has twenty thousand for the breadth'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/45.htm'
    quote: 'in length twenty and five thousand reeds, and in breadth twenty thousand'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The ESV prints cubits and twenty thousand, noting that the Hebrew has 10,000'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=ESV'
    quote: 'Septuagint; Hebrew 10,000'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The NRSVUE likewise follows the Greek, with cubits'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=NRSVUE'
    quote: 'twenty-five thousand cubits long and twenty thousand cubits wide'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The Greek reading has been judged more correct because verses 3 and 5 require it'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/45.htm'
    quote: 'This reading appears more correct than the Masoretic, as it is demanded by Ezekiel 45:3 and Ezekiel 45:5.'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The long cubit of this vision was about 21 inches (so 25,000 are a little over eight miles and 20,000 about six and a half)'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=ESV'
    quote: 'a long cubit (see 40:5) was about 21 inches or 53 centimeters'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'The reed of the vision is six long cubits'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'a measuring reed of six cubits long by the cubit and an hand breadth'
  - where: 'note 45:1 “How large, and in what unit”'
    claim: 'With the city’s land the whole reserved block is twenty-five thousand by twenty-five thousand'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'All the oblation shall be five and twenty thousand by five and twenty thousand'

  - where: 'note 45:5 “Twenty chambers, or cities to live in”'
    claim: 'The Hebrew of verse 5 ends with “twenty chambers”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'לְשָׁכֹֽת'
  - where: 'note 45:5 “Twenty chambers, or cities to live in”'
    claim: 'The Septuagint reads cities to dwell in'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/45.htm'
    quote: 'they shall have cities to dwell in for a possession'
  - where: 'note 45:5 “Twenty chambers, or cities to live in”'
    claim: 'The ESV follows the Septuagint and notes the Hebrew'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=ESV'
    quote: 'Septuagint; Hebrew as their possession, twenty chambers'
  - where: 'note 45:5 “Twenty chambers, or cities to live in”'
    claim: 'The ESV text of verse 5 reads cities to live in'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=ESV'
    quote: 'as their possession for cities to live in'
  - where: 'note 45:5 “Twenty chambers, or cities to live in”'
    claim: 'The NRSVUE also reads cities'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=NRSVUE'
    quote: 'as their holding for cities to live in'
  - where: 'note 45:5 “Twenty chambers, or cities to live in”'
    claim: 'Under the law the Levites had cities with common land around them, the word rendered “suburbs”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4054.htm'
    quote: 'common-land, usually plural, and usually as attached to a city or town, especially as surrounding Levitical cities Numbers 35:2,3,4,5,7'
  - where: 'note 45:5 “Twenty chambers, or cities to live in”'
    claim: 'In verse 2 the same word is the open space about the temple'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4054.htm'
    quote: 'open land or space about the temple Ezekiel 45:2'

  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'The prince’s land is given to guard against exaction by princes'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/45.htm'
    quote: 'On both sides of this domain the prince is also to receive a possession in land, to guard against all exaction on the part of the princes in time to come.'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'Ahab’s treatment of Naboth is given as the example of unjust expulsion'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/45.htm'
    quote: 'unjust expulsion from one''s possession, of which Ahab''s conduct toward Naboth furnished a glaring example (1 Kings 21)'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'Samuel’s warning is set beside Ezekiel 45:8'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'compare Ezekiel 45:8, and such passages as 1 Samuel 8:14'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'Samuel warned that a king would take fields and vineyards'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: 'And he will take your fields, and your vineyards, and your oliveyards, even the best of them, and give them to his servants.'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'Naboth refused to give Ahab the inheritance of his fathers'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/21?lang=eng'
    quote: 'forbid it me, that I should give the inheritance of my fathers unto thee'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'Ezekiel had charged Jerusalem’s princes with preying on the people'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'Her princes in the midst thereof are like wolves ravening the prey'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'Modern translations render it “Enough”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=NRSVUE'
    quote: 'Enough, O princes of Israel! Put away violence and oppression, and do what is just and right. Cease your evictions of my people'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'The ESV has the same wording'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=ESV'
    quote: 'Enough, O princes of Israel! Put away violence and oppression, and execute justice and righteousness.'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'The Hebrew word behind “exactions” in verse 9'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'גְרֻשֹֽׁתֵי'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'The word means expulsion and occurs only in this form, in this verse'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1646.htm'
    quote: 'noun feminine expulsion, violence. Only plural suffix'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'It is rendered “your acts of expulsion”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1646.htm'
    quote: 'Ezekiel 45:9 your acts of expulsion'
  - where: 'note 45:8 “Land enough for the prince, and no more”'
    claim: 'Chapter 46 forbids the prince to take the people’s inheritance and has him provide for his sons from his own land'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/46?lang=eng'
    quote: 'Moreover the prince shall not take of the people’s inheritance by oppression, to thrust them out of their possession; but he shall give his sons inheritance out of his own possession'

  - where: 'note 45:10 “Honest measures in a temple vision”'
    claim: 'The law already required just balances and a just ephah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Just balances, just weights, a just ephah, and a just hin, shall ye have'
  - where: 'note 45:10 “Honest measures in a temple vision”'
    claim: 'Amos described merchants who falsified the ephah, the shekel and the balances'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/8?lang=eng'
    quote: 'making the ephah small, and the shekel great, and falsifying the balances by deceit'
  - where: 'note 45:10 “Honest measures in a temple vision”'
    claim: 'The ephah is a dry measure equal to the bath, a tenth of a homer'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Ephah (dry). Said to be equivalent to a bath; one-tenth of a homer.'
  - where: 'note 45:10 “Honest measures in a temple vision”'
    claim: 'The size of the homer'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'A homer is also believed to be 230 liters (or about 6½ U.S. bushels dry measure).'
  - where: 'note 45:10 “Honest measures in a temple vision”'
    claim: 'The bath is a liquid measure'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Bath (liquid). Said to be approximately 8¼ U.S. gallons, or 31.3 liters.'
  - where: 'note 45:10 “Honest measures in a temple vision”'
    claim: 'The values of biblical measures varied over time, so modern equivalents are approximate'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'varied from time to time, which makes it difficult to arrive at a correct understanding of these things today'
  - where: 'note 45:10 “Honest measures in a temple vision”'
    claim: 'The maneh is elsewhere reckoned at 50 shekels'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Pound. (Hebrew Maneh); equivalent to 50 shekels'
  - where: 'note 45:10 “Honest measures in a temple vision”'
    claim: 'The Septuagint of verse 12 has different figures'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/45.htm'
    quote: 'your pound shall be five shekels, fifteen shekels and fifty shekels'

  - where: 'note 45:16 “A fixed share for the public offerings”'
    claim: 'The rates are a sixtieth of the grain, a hundredth of the oil, and one animal in two hundred'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/45.htm'
    quote: 'of corn the sixtieth part, of oil the hundredth part, and of the flock the two hundredth head'
  - where: 'note 45:16 “A fixed share for the public offerings”'
    claim: 'The cor equals ten baths (so a tenth of a bath is a hundredth)'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Cor (liquid and dry). Said to equal 10 baths.'
  - where: 'note 45:16 “A fixed share for the public offerings”'
    claim: 'The law of Moses did not say where the festal sacrifices were to come from; this provision is new'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/45.htm'
    quote: 'But the Mosaic law contains no regulation as to the sources from which the priests were to meet the demands for the festal sacrifices. So far, the instructions in the verses before us are new.'
  - where: 'note 45:16 “A fixed share for the public offerings”'
    claim: 'The law named the firstborn, firstfruits and tithes as contributions to the sanctuary'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/45.htm'
    quote: 'the Mosaic law makes no mention of any contributions to the sanctuary, with the exception of the first-born, the first-fruits and the tithes'
  - where: 'note 45:16 “A fixed share for the public offerings”'
    claim: 'A modern translation takes verse 16 as an offering made through the prince'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=NRSVUE'
    quote: 'All the people of the land shall join in making this offering in Israel through the prince.'
  - where: 'note 45:16 “A fixed share for the public offerings”'
    claim: 'In verse 19 it is the priest who handles the blood'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'And the priest shall take of the blood of the sin offering'

  - where: 'note 45:17 “Reconciliation is atonement”'
    claim: 'The Hebrew verb behind “make reconciliation” is kipper'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כַפֵּ֖ר'
  - where: 'note 45:17 “Reconciliation is atonement”'
    claim: 'Modern translations render it “make atonement” in verse 17'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2045&version=ESV'
    quote: 'to make atonement on behalf of the house of Israel'
  - where: 'note 45:17 “Reconciliation is atonement”'
    claim: 'The construction “on behalf of” is used of Aaron in Leviticus and of the prince here'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'Leviticus 16:6,11,17,24 (by Aaron), Ezekiel 45:17 (by the prince)'
  - where: 'note 45:17 “Reconciliation is atonement”'
    claim: 'The verb is used in verse 15 of the people’s contribution'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'by the תרומה Ezekiel 45:15'
  - where: 'note 45:17 “Reconciliation is atonement”'
    claim: 'Atonement denotes the reconciliation of man to God'
    key: 'bd-atonement'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/atonement?lang=eng'
    quote: 'The word describes the setting “at one” of those who have been estranged and denotes the reconciliation of man to God.'
  - where: 'note 45:17 “Reconciliation is atonement”'
    claim: 'President Joseph Fielding Smith taught that blood sacrifice will be restored long enough to complete the restoration, and that afterward sacrifice will be of another kind'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'blood sacrifices will be performed long enough to complete the fulness of the restoration in this dispensation. Afterwards sacrifice will be of some other character.'
  - where: 'note 45:17 “Reconciliation is atonement”'
    claim: 'Verse 20 uses the verb of the house itself'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'so shall ye reconcile the house'

  - where: 'note 45:18 “A yearly cleansing of the house”'
    claim: 'The cleansing on the first day of the first month is not in the law of Moses'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/45.htm'
    quote: 'There is nothing of this in the Mosaic law; it seems to have been a new ceremony. An annual purification of the sanctuary may be intended.'
  - where: 'note 45:18 “A yearly cleansing of the house”'
    claim: 'The altar was cleansed the same way when it was first consecrated'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And thou shalt take of the blood thereof, and put it on the four horns of it, and on the four corners of the settle, and upon the border round about: thus shalt thou cleanse and purge it.'
  - where: 'note 45:18 “A yearly cleansing of the house”'
    claim: 'The Hebrew word for “erreth” in verse 20'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שֹׁגֶ֖ה'
  - where: 'note 45:18 “A yearly cleansing of the house”'
    claim: 'The verb is the law’s term for a sin of ignorance or inadvertence'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7686.htm'
    quote: 'specifically commit sin of ignorance, inadvertence Leviticus 4:13; Numbers 15:22 (P) Ezekiel 45:20'
  - where: 'note 45:18 “A yearly cleansing of the house”'
    claim: 'The law provided for one of the common people who sins through ignorance'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'And if any one of the common people sin through ignorance'
  - where: 'note 45:18 “A yearly cleansing of the house”'
