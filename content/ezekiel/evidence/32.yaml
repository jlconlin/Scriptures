chapter: 32
claims:
  - where: 'when'
    claim: 'Ezekiel counts years from Jehoiachin’s captivity, and his ministry began in 592 B.C. (the fifth year), so the twelfth year is about 585 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'Word of the city’s fall reached Ezekiel in the twelfth year, tenth month, fifth day'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten.'

  - where: 'setting'
    claim: 'The fugitive’s report is dated to the tenth month of the twelfth year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month'
  - where: 'setting'
    claim: 'Chapters 25–32 are the prophecies against Israel’s enemies'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(2) 25–32, prophecies against Israel’s enemies'
  - where: 'setting'
    claim: 'The eight chapters name Ammon, Moab, Edom, Philistia, Tyre, Sidon and Egypt'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'These eight chapters contain prophecies against several foreign nations: Ammon, Moab, Edom, Philistia, Tyre, Sidon, and Egypt.'
  - where: 'setting'
    claim: 'Chapter 29 calls Egypt a staff of reed to the house of Israel (the site’s chapter 29, thread and note on 29:6, read in this session; the verse is Ezek. 29:6)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'a staff of reed to the house of Israel'
  - where: 'setting'
    claim: 'The chapter contains two lamentations composed at different times'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/32.htm'
    quote: 'The chapter contains two lamentations composed at different times: the first, in vv. 1-16, relating to the fall of Pharaoh'
  - where: 'setting'
    claim: 'The second poem expands the closing thought of chapter 31'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/32.htm'
    quote: 'The whole of it is simply an elegiac expansion of the closing thought of the previous chapter (Ezekiel 31).'
  - where: 'setting'
    claim: 'The Hebrew word for lamentation (qinah, H7015) occurs in Ezekiel at 2:10; 19:1, 14; 26:17; 27:2, 32; 28:12; 32:2, 16, and not after (scripts/hebrew.mjs ezekiel --word 7015)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'קִינָה֙'
  - where: 'setting'
    claim: 'Chapter 31 ends with Pharaoh brought down to the nether parts of the earth'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/31?lang=eng'
    quote: 'yet shalt thou be brought down with the trees of Eden unto the nether parts of the earth'


