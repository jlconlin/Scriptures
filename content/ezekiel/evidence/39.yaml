chapter: 39
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is the twelfth year, tenth month (33:21)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month'
  - where: 'when'
    claim: 'The next date in the book is the twenty-fifth year (40:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C., from which the twelfth year is counted as about 585'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'Chapter 38 sets the invasion in the latter years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'in the latter years thou shalt come into the land that is brought back from the sword'

  - where: 'setting'
    claim: 'Chapter 38 opens the prophecy with the word of the Lord coming to Ezekiel, and chapter 39 has no new heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'And the word of the Lord came unto me, saying,'
  - where: 'setting'
    claim: 'Chapter 38 tells of Gog coming against a people gathered to the mountains of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'is gathered out of many people, against the mountains of Israel'
  - where: 'setting'
    claim: 'The nearest date before the chapter is the day word came that the city was smitten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'one that had escaped out of Jerusalem came unto me, saying, The city is smitten'
  - where: 'setting'
    claim: 'The temple vision begins in the twenty-fifth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity'
  - where: 'setting'
    claim: 'Chapters 33–39 are the third of the book’s four divisions, prophecies of restoration'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(3) 33–39, prophecies of restoration'
  - where: 'setting'
    claim: 'John sees the birds called to the supper of the great God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'Come and gather yourselves together unto the supper of the great God'
  - where: 'setting'
    claim: 'John names Gog and Magog for the nations gathered after the thousand years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/20?lang=eng'
    quote: 'And when the thousand years are expired, Satan shall be loosed out of his prison'
  - where: 'setting'
    claim: 'D&C 29:21, a revelation about the Lord’s coming, names Ezekiel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'according as it is spoken by the mouth of Ezekiel the prophet'

  - where: 'thread'
    claim: 'Ezekiel shows the destruction of Gog’s forces in three ways'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'Ezekiel depicts in three special ways the total destruction of his powerful forces'
  - where: 'thread'
    claim: 'The three pictures are ordered by subject, not by time'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'are not arranged in chronological order, but according to the subject-matter'
  - where: 'thread'
    claim: 'The feast is mentioned last because the enemy’s disgrace culminates in it'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'is mentioned last as being the more striking, because it is in this that their ignominious destruction culminates'
  - where: 'thread'
    claim: 'The restoration of verse 25 begins with the return from Babylon but is not limited to it'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'The restoration of the captives of Jacob commences with the liberation of Israel from the Babylonian exile, but is not to be restricted to this.'
  - where: 'thread'
    claim: 'Verse 25 turns to the prophet’s own time'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'to the prophet''s own time, to which Ezekiel had already gone back by mentioning the carrying away of Israel'
  - where: 'thread'
    claim: 'Chapter 38 has already told Gog’s defeat on the mountains of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'And I will call for a sword against him throughout all my mountains, saith the Lord God'

  - where: 'section 1 plain'
    claim: '“Heathen” is rendered “nations” in the plain words, as in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=NRSVUE'
    quote: 'and the nations shall know that I am the Lord, the Holy One in Israel'
  - where: 'section 1 plain'
    claim: '“Carelessly” means securely, without care (the Church’s footnote 6b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/39?lang=eng'
    quote: 'HEB securely, confidently, without care'

  - where: 'note 39:1 “Gog, named again”'
    claim: 'Chapter 38 opens with the same address to Gog, the land of Magog, chief prince of Meshech and Tubal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'Behold, I am against thee, O Gog, the chief prince of Meshech and Tubal'
  - where: 'note 39:1 “Gog, named again”'
    claim: 'Gog is the king of Magog whose invasion Ezekiel prophesied'
    key: bd-gog
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gog?lang=eng'
    quote: 'King of Magog, whose invasion of Israel was prophesied by Ezekiel (Ezek. 38–39)'
  - where: 'note 39:1 “Gog, named again”'
    claim: 'Chapter 38 names the allies and describes the army'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'Gomer, and all his bands; the house of Togarmah of the north quarters, and all his bands: and many people with thee.'

  - where: 'note 39:2 “A sixth left, or led on?”'
    claim: 'The Hebrew word behind “leave but the sixth part of thee” is a verb (H8338), found in Ezekiel only here (hebrew.mjs --word 8338: one occurrence)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/שִׁשֵּׁאתִ֔י/ךָ'
  - where: 'note 39:2 “A sixth left, or led on?”'
    claim: 'The King James rendering is explained as a confusion with a similar word for dividing into sixths'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/8338.htm'
    quote: 'leave by the sixth part (by confusion with shashah)'
  - where: 'note 39:2 “A sixth left, or led on?”'
    claim: 'The Septuagint has “assemble thee, and guide thee”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/39.htm'
    quote: 'and I will assemble thee, and guide thee, and raise thee up on the extremity of the north'
  - where: 'note 39:2 “A sixth left, or led on?”'
    claim: 'The English Standard Version has “drive you forward”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=ESV'
    quote: 'I will turn you about and drive you forward'
  - where: 'note 39:2 “A sixth left, or led on?”'
    claim: 'The English Standard Version’s note gives “drag you along”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=ESV'
    quote: 'Or and drag you along'
  - where: 'note 39:2 “A sixth left, or led on?”'
    claim: 'The New Revised Standard Version Updated Edition also has “drive you forward”, followed by bring up and lead against the mountains'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=NRSVUE'
    quote: 'I will turn you around and drive you forward and bring you up from the remotest parts of the north and lead you against the mountains of Israel'
  - where: 'note 39:2 “A sixth left, or led on?”'
    claim: 'Chapter 38 says the Lord turns Gog and brings him forth with hooks in his jaws'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'And I will turn thee back, and put hooks into thy jaws, and I will bring thee forth'
  - where: 'note 39:2 “A sixth left, or led on?”'
    claim: 'The word the King James rendering is said to be confused with (shashah, H8341) is built on the Hebrew for six and means to divide into sixths'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/8341.htm'
    quote: 'A denominative from shesh; to sixth or divide into sixths'

  - where: 'note 39:6 “Fire on Magog and the far coasts”'
    claim: 'Magog is the land Gog comes from'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'set thy face against Gog, the land of Magog'
  - where: 'note 39:6 “Fire on Magog and the far coasts”'
    claim: 'Modern translations render “isles” as coastlands'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=ESV'
    quote: 'who dwell securely in'
  - where: 'note 39:6 “Fire on Magog and the far coasts”'
    claim: 'The New Revised Standard Version Updated Edition has “coastlands”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=NRSVUE'
    quote: 'I will send fire on Magog and on those who live securely in the coastlands'
  - where: 'note 39:6 “Fire on Magog and the far coasts”'
    claim: 'The Church’s footnote 6b glosses “carelessly”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/39?lang=eng'
    quote: 'HEB securely, confidently, without care'
  - where: 'note 39:6 “Fire on Magog and the far coasts”'
    claim: 'The Hebrew word (H983, la-betach) is the same in 39:6, in 38:11 of the people who dwell safely, and in 39:26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'לָ/בֶ֑טַח'
  - where: 'note 39:6 “Fire on Magog and the far coasts”'
    claim: 'In 38:11 Gog plans to go against those that dwell safely'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'I will go to them that are at rest, that dwell safely'
  - where: 'note 39:6 “Fire on Magog and the far coasts”'
    claim: 'Fire is among the judgments on Gog in 38:22, to which the Church’s footnote 6a points'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'an overflowing rain, and great hailstones, fire, and brimstone'
  - where: 'note 39:6 “Fire on Magog and the far coasts”'
    claim: 'D&C 29:21 attributes to Ezekiel the casting down of the great and abominable church by devouring fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'shall be cast down by devouring fire, according as it is spoken by the mouth of Ezekiel the prophet'

  - where: 'note 39:7 “The name no longer profaned”'
    claim: 'The Hebrew verb is a first-person form (H2490) with the name as its object and no “them”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אַחֵ֥ל'
  - where: 'note 39:7 “The name no longer profaned”'
    claim: 'A modern translation renders the clause without “them”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=NRSVUE'
    quote: 'I will not let my holy name be profaned any more'
  - where: 'note 39:7 “The name no longer profaned”'
    claim: 'The same verb (H2490) is used in 36:20 of Israel profaning the name'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וַֽ/יְחַלְּל֖וּ'
  - where: 'note 39:7 “The name no longer profaned”'
    claim: 'In chapter 36 the name was profaned when Israel went among the nations as exiles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'they profaned my holy name, when they said to them, These are the people of the Lord, and are gone forth out of his land'
  - where: 'note 39:7 “The name no longer profaned”'
    claim: 'Chapter 38 says the Lord will be sanctified in Gog before the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'that the heathen may know me, when I shall be sanctified in thee, O Gog, before their eyes'

  - where: 'note 39:8 “Which day”'
    claim: 'Chapter 38 sets the invasion in the latter days and speaks of “that day”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'Surely in that day there shall be a great shaking in the land of Israel'
  - where: 'note 39:8 “Which day”'
    claim: 'The Bible Dictionary places the prophecy at the Second Coming and distinguishes a second battle at the end of the thousand years'
    key: bd-gog
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gog?lang=eng'
    quote: 'All this appears to be at the Second Coming of the Lord. Another battle, called the battle of Gog and Magog, will occur at the end of the 1,000 years.'
  - where: 'note 39:8 “Which day”'
    claim: 'The Bible Dictionary identifies the later battle with Revelation 20:7–9 and D&C 88:111–16'
    key: bd-gog
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gog?lang=eng'
    quote: 'This is described by John in Rev. 20:7–9; see also D&C 88:111–16.'
  - where: 'note 39:8 “Which day”'
    claim: 'The prophecies do not name modern nations'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'The prophecies do not name the modern nations which will be fighting for and against Israel'
  - where: 'note 39:8 “Which day”'
    claim: 'The Student Manual gives the passage on the modern nations as Elder Bruce R. McConkie’s'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'The following from Elder Bruce R. McConkie sums up the events of the battle of Armageddon'

  - where: 'note 39:9 “Seven years of firewood”'
    claim: 'The seven years and seven months are read as symbolic of a completed divine judgment'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'is symbolical, stamping the overthrow as a punishment inflicted by God, the completion of a divine judgment'
  - where: 'note 39:9 “Seven years of firewood”'
    claim: 'On this reading the burning is about removing every trace of the enemy, not about an age of peace'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'This is not referred to here; but the motive is the complete annihilation of the enemy, the removal of every trace of him.'
  - where: 'note 39:9 “Seven years of firewood”'
    claim: 'The list reaches down to the handstaves'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'enumerating every kind of weapon that was combustible, even to the hand-staves which men were accustomed to carry'
  - where: 'note 39:9 “Seven years of firewood”'
    claim: 'The plundering of verse 10 answers Gog’s purpose in 38:12'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'the Israelites do to the enemy what he intended to do to them (Ezekiel 38:12)'
  - where: 'note 39:9 “Seven years of firewood”'
    claim: 'Gog came to take a spoil and a prey'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'To take a spoil, and to take a prey'
  - where: 'note 39:9 “Seven years of firewood”'
    claim: 'The weapons are so many that they supply seven years of fuel'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'The quantity of the weapons will be so great, that they will supply the Israelites with all the fuel they need for seven years.'

  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'Hamon-gog means the multitude of Gog'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=ESV'
    quote: 'Hamon-gog means the multitude of Gog'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'Hamonah means multitude'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=ESV'
    quote: 'Hamonah means multitude'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The Hebrew names in verses 11 and 16 are forms of hamon'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הֲמוֹנָ֖ה'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The verse describes a future event, not a place known in Ezekiel’s day'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'depicts a future event and is not making reference to a known location of that day'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The valley is assumed to be near Jerusalem, where the battle centers'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Since the final battle centers around Jerusalem (see Enrichment I), it is assumed that the valley of Hamongog is somewhere nearby.'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: '“Passengers” is travelers in the Hebrew (the Church’s footnote 11a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/39?lang=eng'
    quote: 'HEB travelers'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'Opinions differ about the name and the place'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'There are different opinions as to both the designation and the situation of this place.'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'One reading takes the sea as the Dead Sea and the valley as the Jordan valley above it'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'is no doubt the valley of the Jordan above the Dead Sea'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The Jordan valley there was the main crossing from Gilead'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'is probably the valley of the Jordan, the principal crossing place from Gilead into Canaan proper'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The Hebrew clause has the verb “stop” and “the travelers” and no word for noses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/חֹסֶ֥מֶת'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The verb’s other use is of muzzling an ox (Deut. 25:4)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2629.htm'
    quote: 'Deuteronomy 25:4 thou shalt not muzzle an ox when it is treading'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The lexicon renders the clause as stopping the way of the passers-by'
    key: bdb
    url: 'https://biblehub.com/hebrew/2629.htm'
    quote: 'Ezekiel 39:11 and it shall stop (the way of) the passers-by'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The English Standard Version has “It will block the travelers”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=ESV'
    quote: 'It will block the travelers, for there Gog and all his multitude will be buried'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The New Revised Standard Version Updated Edition has “block the path of the travelers”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=NRSVUE'
    quote: 'it shall block the path of the travelers'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The lexicon takes Hamonah as a city to be founded in memory of Gog’s defeat and calls the text doubtful'
    key: bdb
    url: 'https://biblehub.com/hebrew/1997.htm'
    quote: 'a city apparently to be founded to commemorate defeat of Gog'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'The lexicon marks the text of verse 16 as dubious'
    key: bdb
    url: 'https://biblehub.com/hebrew/1997.htm'
    quote: 'but text dubious'
  - where: 'note 39:11 “The valley of Hamon-gog”'
    claim: 'One modern translation makes verse 16a a parenthesis'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2039&version=NRSVUE'
    quote: '(A city Hamonah is there also.)'

  - where: 'note 39:12 “Burial that cleanses the land”'
    claim: 'The law made anyone unclean seven days who touched the slain, a bone, or a grave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'And whosoever toucheth one that is slain with a sword in the open fields, or a dead body, or a bone of a man, or a grave, shall be unclean seven days.'
  - where: 'note 39:12 “Burial that cleanses the land”'
    claim: 'The men set apart have a permanent duty; some search and others bury'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'are people who have a permanent duty to discharge'
  - where: 'note 39:12 “Burial that cleanses the land”'
    claim: 'Those who go about search and set up a sign; the buriers do the burying'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/39.htm'
    quote: 'those who go about do not perform the task of burying, but simply search for bones that have been left, and put up a sign for the buriers of the dead'
  - where: 'note 39:12 “Burial that cleanses the land”'
    claim: 'The word for “sign” is used of a signpost here and of a gravestone in 2 Kings 23:17'
