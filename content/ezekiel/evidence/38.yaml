  # ---------- note 38:22 fire ----------
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'The revelation was received in September 1830'
    key: sc-knowhy-784
    url: 'https://scripturecentral.org/knowhy/where-did-ezekiel-prophesy-that-the-great-and-abominable-church-would-be-destroyed'
    quote: 'In September 1830, Joseph Smith received a revelation that discussed some of the signs that will occur before the Savior returned to the earth.'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'The language of D&C 29:21 is not in the book of Ezekiel'
    key: sc-knowhy-784
    url: 'https://scripturecentral.org/knowhy/where-did-ezekiel-prophesy-that-the-great-and-abominable-church-would-be-destroyed'
    quote: 'Nowhere in the Old Testament book of Ezekiel is this language found, nor is it found in Joseph Smith’s inspired translation of the Bible.'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'First possibility: a prophecy once in the book and lost'
    key: sc-knowhy-784
    url: 'https://scripturecentral.org/knowhy/where-did-ezekiel-prophesy-that-the-great-and-abominable-church-would-be-destroyed'
    quote: 'it is possible that the Lord is referring to a prophecy that was once found in the book of Ezekiel'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'Second possibility: another book of Ezekiel’s no longer extant'
    key: sc-knowhy-784
    url: 'https://scripturecentral.org/knowhy/where-did-ezekiel-prophesy-that-the-great-and-abominable-church-would-be-destroyed'
    quote: 'was included in another of Ezekiel’s books that is no longer extant'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'Third possibility: a paraphrase of an extant prophecy, chapters 38–39'
    key: sc-knowhy-784
    url: 'https://scripturecentral.org/knowhy/where-did-ezekiel-prophesy-that-the-great-and-abominable-church-would-be-destroyed'
    quote: 'the Lord paraphrased an extant prophecy of Ezekiel using language from the Book of Mormon. Specifically, the prophecy of the battle of Gog and Magog in Ezekiel 38–39 could fit the description of the great and abominable church being destroyed.'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'Nephi’s vision uses the names found in D&C 29:21'
    key: sc-knowhy-784
    url: 'https://scripturecentral.org/knowhy/where-did-ezekiel-prophesy-that-the-great-and-abominable-church-would-be-destroyed'
    quote: 'Nephi saw this same vision and employed the terms'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'Each of the three is judged plausible; none is settled'
    key: sc-knowhy-784
    url: 'https://scripturecentral.org/knowhy/where-did-ezekiel-prophesy-that-the-great-and-abominable-church-would-be-destroyed'
    quote: 'each of the three scenarios is “entirely plausible.”'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'D&C 29:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'And the great and abominable church, which is the whore of all the earth, shall be cast down by devouring fire, according as it is spoken by the mouth of Ezekiel the prophet'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
    claim: 'The Church’s footnote to “fire” in verse 22 gives Ezek. 39:6 and D&C 29:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'Ezek. 39:6; D&C 29:21.'
  - where: 'note 38:22 “The fire that modern revelation credits to Ezekiel”'
