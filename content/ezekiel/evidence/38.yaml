chapter: 38
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The nearest date above the chapter is 33:21, the twelfth year, tenth month, when word came that the city had fallen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten.'
  - where: 'when'
    claim: 'Ezekiel’s ministry is dated from 592 B.C. (the fifth year), so the twelfth year is about 585'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The next date in the book is the twenty-fifth year (40:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Chapters 33–39 are the book’s prophecies of restoration; chapters 25–32 are against Israel’s enemies'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(2) 25–32, prophecies against Israel’s enemies; (3) 33–39, prophecies of restoration'
  - where: 'setting'
    claim: 'Chapter 34 promises that the Lord will gather the flock to their own land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'And I will bring them out from the people, and gather them from the countries, and will bring them to their own land'
  - where: 'setting'
    claim: 'Chapter 36 promises a new heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'A new heart also will I give you, and a new spirit will I put within you'
  - where: 'setting'
    claim: 'Chapter 37 has the valley of dry bones and the promise to bring the people into the land, and a covenant of peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'I will open your graves, and cause you to come up out of your graves, and bring you into the land of Israel.'
  - where: 'setting'
    claim: 'Chapter 39 continues the prophecy with Gog’s fall and burial'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/39?lang=eng'
    quote: 'And seven months shall the house of Israel be burying of them, that they may cleanse the land.'
  - where: 'setting'
    claim: 'John uses the names Gog and Magog'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/20?lang=eng'
    quote: 'Gog and Magog, to gather them together to battle'
  - where: 'setting'
    claim: 'D&C 29:21 appeals to Ezekiel by name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'according as it is spoken by the mouth of Ezekiel the prophet'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The chapter falls into three parts: the summons of Gog (1–9), his motive and the Lord’s purpose (10–16), and the judgment (17–23)'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/38.htm'
    quote: 'with the intention of plundering Israel, now dwelling in security, that the Lord may sanctify Himself upon him before all the world (Ezekiel 38:10-16)'

  # ---------- note 38:2 Gog ----------
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'Gog has been understood as a symbolic name for the leader or leaders of the last-days power'
    key: ot-manual-kings-i
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-i?lang=eng'
    quote: 'Gog is a symbolic name for the leader or leaders of this great evil power that will arise in the last days.'
  - where: 'note 38:2 “Gog of the land of Magog”'
    claim: 'Gog is the king of Magog'
    key: bd-gog
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gog?lang=eng'
    quote: 'King of Magog, whose invasion of Israel was prophesied by Ezekiel'
  - where: 'note 38:2 “Gog of the land of Magog”'
    claim: 'The other Gog of the Old Testament is a Reubenite'
    key: bd-gog
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gog?lang=eng'
    quote: '(1) A Reubenite (1 Chr. 5:4).'
  - where: 'note 38:2 “Gog of the land of Magog”'
    claim: 'Magog is a son of Japheth and a country near the Black Sea'
    key: bd-magog
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/magog?lang=eng'
    quote: 'A country or people near the Black Sea, and equivalent to Scythian'
  - where: 'note 38:2 “Gog of the land of Magog”'
    claim: 'The Hebrew has “land of the Magog,” with the article and no preposition'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/מָּג֔וֹג'
  - where: 'note 38:2 “Gog of the land of Magog”'
    claim: 'A modern translation renders “Gog, of the land of Magog”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2038&version=NRSVUE'
    quote: 'set your face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal'
  - where: 'note 38:2 “Gog of the land of Magog”'
    claim: 'Magog is a son of Japheth in the table of nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/10?lang=eng'
    quote: 'The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.'
  - where: 'note 38:2 “Gog of the land of Magog”'
    claim: 'A Gog stands in Reuben’s genealogy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'The sons of Joel; Shemaiah his son, Gog his son, Shimei his son,'
  - where: 'note 38:2 “Gog of the land of Magog”'
    claim: 'John writes the two names as a pair'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/20?lang=eng'
    quote: 'Gog and Magog, to gather them together to battle'

  # ---------- note 38:2 Rosh ----------
  - where: 'note 38:2 “Chief prince, or prince of Rosh”'
    claim: 'The Hebrew words are nesi rosh; rosh is the word for head'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'רֹ֖אשׁ'
  - where: 'note 38:2 “Chief prince, or prince of Rosh”'
    claim: 'The word before it is nasi, prince'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נְשִׂ֕יא'
  - where: 'note 38:2 “Chief prince, or prince of Rosh”'
    claim: 'rosh, head, is used for a chief'
    key: bdb
    url: 'https://biblehub.com/hebrew/7218.htm'
    quote: 'head = chief (man) Judges 10:18'
  - where: 'note 38:2 “Chief prince, or prince of Rosh”'
    claim: 'The Septuagint takes rosh as a name'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/38.htm'
    quote: 'set thy face against Gog, and the land of Magog, Rhos, prince of Mesoch and Thobel'
  - where: 'note 38:2 “Chief prince, or prince of Rosh”'
    claim: 'The ESV keeps “chief prince” and gives “prince of Rosh” in a footnote'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2038&version=ESV'
    quote: 'Or Magog, the prince of Rosh, Meshech'
  - where: 'note 38:2 “Chief prince, or prince of Rosh”'
    claim: 'Meshech and Tubal are sons of Japheth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/10?lang=eng'
    quote: 'The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.'
  - where: 'note 38:2 “Chief prince, or prince of Rosh”'
    claim: 'Tubal and Meshech traded slaves and bronze with Tyre'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'Javan, Tubal, and Meshech, they were thy merchants: they traded the persons of men and vessels of brass in thy market.'
  - where: 'note 38:2 “Chief prince, or prince of Rosh”'
    claim: 'Meshech and Tubal lie among the slain in chapter 32'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/32?lang=eng'
    quote: 'There is Meshech, Tubal, and all her multitude: her graves are round about him: all of them uncircumcised, slain by the sword'

  # ---------- note 38:4 hooks ----------
  - where: 'note 38:4 “Led by a hook, and still his own plan”'
    claim: 'The Hebrew word is a hook or ring in the nose of a captive; used of Sennacherib, of Pharaoh as a crocodile, and here'
    key: bdb
    url: 'https://biblehub.com/hebrew/2397.htm'
    quote: 'hook, ring, in nose of captive'
  - where: 'note 38:4 “Led by a hook, and still his own plan”'
    claim: 'The lexicon lists 29:4, of Pharaoh as a crocodile, with this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/2397.htm'
    quote: 'in jaws of crocodile (metaphor of Pharaoh)'
  - where: 'note 38:4 “Led by a hook, and still his own plan”'
    claim: 'Isaiah uses the image of Sennacherib'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'therefore will I put my hook in thy nose, and my bridle in thy lips'
  - where: 'note 38:4 “Led by a hook, and still his own plan”'
    claim: 'Ezekiel uses it of Pharaoh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'But I will put hooks in thy jaws'
  - where: 'note 38:4 “Led by a hook, and still his own plan”'
    claim: 'Gog is pictured as a beast compelled to follow its leader'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/38.htm'
    quote: 'Gog is represented as an unmanageable beast, which is compelled to follow its leader'
  - where: 'note 38:4 “Led by a hook, and still his own plan”'
    claim: 'The Septuagint has no hooks in verse 4'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/38.htm'
    quote: 'and I will gather thee, and all thine host, horses and horsemen'
  - where: 'note 38:4 “Led by a hook, and still his own plan”'
    claim: 'Verses 10–16 give the motive by which Gog incurred guilt though led by God'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/38.htm'
    quote: 'incurred guilt, notwithstanding the fact that he was led by God'

  # ---------- note 38:5 allies ----------
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'Magog, Meshech and Tubal were in northern Asia Minor'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Magog, Meshech, and Tubal were in northern Asia Minor'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'Gomer and Togarmah have been associated with peoples of Asia Minor and Europe'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Gomer and Togarmah have been associated with peoples in Asia Minor and Europe'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'The list from every direction teaches that all nations will fight against Israel'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'That these nations would come from north and south, east and west, represents the teaching that all nations will fight against Israel (compare Zechariah 14:2).'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'The names are of ancient areas; no list of modern nations can be made from them'
    key: ot-manual-kings-i
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-i?lang=eng'
    quote: 'These designations refer to general areas of the ancient world, so a list of modern nations fighting in Armageddon cannot be compiled from these sources.'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'One identification: Gomer the Cimmerians, Togarmah the Armenians'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/38.htm'
    quote: 'Gomer: the Cimmerians; and the house of Togarmah: the Armenians'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'The peoples come from north, east and south, the borders of the known world'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/38.htm'
    quote: 'and east (Persians) and south (Ethiopians), i.e., on the borders of the then known world'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'The north is described as the extreme north'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/38.htm'
    quote: 'of peoples living at the extreme north'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'The absence of Israel’s former foes has been taken to point to a later time'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/38.htm'
    quote: 'This points to a time when their former foes, Ammon, Moab, Edom, Philistines, and Syrians, and the old imperial powers, Egypt, Asshur, Babel, Javan, will all have passed away from the stage of history'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'The Persians lived east of Elam'
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'The Persians were a tribe who in the 8th century B.C. inhabited a district east of Elam.'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'Cush lay south of Egypt'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'Libya, formerly Put or Phut, lay west of Egypt'
    key: bd-libya
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/libya?lang=eng'
    quote: 'The district west of Egypt and bordering on the Mediterranean; formerly called Put or Phut'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'The Church’s footnote: Ethiopia and Libya are Cush and Phut in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'HEB Cush and Phut.'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'Gomer and Togarmah are in the table of nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/10?lang=eng'
    quote: 'And the sons of Gomer; Ashkenaz, and Riphath, and Togarmah.'
  - where: 'note 38:5 “Allies from every quarter”'
    claim: 'Zechariah has all nations gathered against Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/14?lang=eng'
    quote: 'For I will gather all nations against Jerusalem to battle'

  # ---------- note 38:8 two battles ----------
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'The Bible Dictionary places Ezekiel’s battle at the Second Coming and John’s at the end of the thousand years'
    key: bd-gog
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gog?lang=eng'
    quote: 'All this appears to be at the Second Coming of the Lord. Another battle, called the battle of Gog and Magog, will occur at the end of the 1,000 years.'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'The Bible Dictionary joins Rev. 20:7–9 and D&C 88:111–16 to the later battle'
    key: bd-gog
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gog?lang=eng'
    quote: 'This is described by John in Rev. 20:7–9; see also D&C 88:111–16.'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'President Joseph Fielding Smith’s statement, as the manual prints it'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Before the coming of Christ, the great war, sometimes called Armageddon, will take place as spoken of by Ezekiel, chapters 38 and 39. Another war of Gog and Magog will be after the millennium.'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'The names are used for both battles as a symbol'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'because they symbolize an alliance of great, evil power'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'In Revelation 20 fire from heaven devours Gog and Magog'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/20?lang=eng'
    quote: 'and fire came down from God out of heaven, and devoured them'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'D&C 88 describes Michael and the hosts of heaven against the devil and his armies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'And the devil shall gather together his armies; even the hosts of hell, and shall come up to battle against Michael and his armies.'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'Verse 8 has “end of the years”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/שָּׁנִ֜ים'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'Verse 16 has “end of the days”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בְּ/אַחֲרִ֨ית'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'The lexicon lists 38:16 under the prophets’ phrase “end of the days” (with Isa. 2:2) and compares 38:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/319.htm'
    quote: 'Ezekiel 38:16 (of the period of Gog''s attack upon restored Israel)'
  - where: 'note 38:8 “Two battles under one name”'
    claim: 'The same lexicon paragraph lists Isaiah 2:2 for the phrase'
    key: bdb
    url: 'https://biblehub.com/hebrew/319.htm'
    quote: 'Isaiah 2:2 ( = Micah 4:1) Jeremiah 23:20'

  # ---------- note 38:11 unwalled ----------
  - where: 'note 38:11 “A land without walls”'
    claim: 'The Hebrew word means open region, hamlet; here a land of hamlets, opposed to a wall; the same word is used of Jerusalem in Zechariah 2:4 (Hebrew 2:8)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6519.htm'
    quote: 'open region, hamlet'
  - where: 'note 38:11 “A land without walls”'
    claim: 'The lexicon renders the phrase in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/6519.htm'
    quote: 'Ezekiel 38:11 a land of hamlets (opposed to'
  - where: 'note 38:11 “A land without walls”'
    claim: 'The lexicon lists Zechariah’s verse under the same word'
    key: bdb
    url: 'https://biblehub.com/hebrew/6519.htm'
    quote: 'Zechariah 2:8 as open regions shall Jerusalem sit'
  - where: 'note 38:11 “A land without walls”'
    claim: 'The word in verse 11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'פְּרָז֔וֹת'
  - where: 'note 38:11 “A land without walls”'
    claim: 'The promise of dwelling safely in chapter 34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'and they shall dwell safely in the wilderness, and sleep in the woods'
  - where: 'note 38:11 “A land without walls”'
    claim: 'Zechariah: Jerusalem inhabited as towns without walls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/2?lang=eng'
    quote: 'Jerusalem shall be inhabited as towns without walls for the multitude of men and cattle therein'
  - where: 'note 38:11 “A land without walls”'
    claim: 'Zechariah: the Lord is the wall'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/2?lang=eng'
    quote: 'will be unto her a wall of fire round about, and will be the glory in the midst of her'

  # ---------- note 38:13 merchants ----------
  - where: 'note 38:13 “The merchants’ question”'
    claim: 'Tarshish is probably Tartessus in Spain'
    key: bd-tarshish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng'
    quote: 'Probably Tartessus in Spain'
  - where: 'note 38:13 “The merchants’ question”'
    claim: 'Sheba is in southern Arabia'
    key: bd-sheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheba?lang=eng'
    quote: 'his descendants gave their name to a portion of southern Arabia'
  - where: 'note 38:13 “The merchants’ question”'
    claim: 'Tarshish, Dedan and Sheba are in the trade list of Tyre'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'Tarshish was thy merchant by reason of the multitude of all kind of riches; with silver, iron, tin, and lead, they traded in thy fairs.'
  - where: 'note 38:13 “The merchants’ question”'
    claim: 'Dedan in the trade list'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'Dedan was thy merchant in precious clothes for chariots.'
  - where: 'note 38:13 “The merchants’ question”'
    claim: 'Sheba in the trade list'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'they occupied in thy fairs with chief of all spices, and with all precious stones, and gold'
  - where: 'note 38:13 “The merchants’ question”'
    claim: 'The Hebrew has “young lions”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כְּפִרֶ֨י/הָ֙'
  - where: 'note 38:13 “The merchants’ question”'
    claim: 'The word is young lion'
    key: bdb
    url: 'https://biblehub.com/hebrew/3715.htm'
    quote: 'noun masculine young lion'
  - where: 'note 38:13 “The merchants’ question”'
    claim: 'ESV: “its leaders,” with the footnote “Hebrew young lions”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2038&version=ESV'
