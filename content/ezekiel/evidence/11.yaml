    quote: 'And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door'
  - where: 'note 11:10 “Judged at the border”'
    claim: 'He took an officer over the men of war and sixty men of the people of the land'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And out of the city he took an officer that was set over the men of war'
  - where: 'note 11:10 “Judged at the border”'
    claim: 'They were brought to the king of Babylon at Riblah and killed there'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And Nebuzar-adan captain of the guard took these, and brought them to the king of Babylon to Riblah'
  - where: 'note 11:10 “Judged at the border”'
    claim: 'Jeremiah records that the nobles of Judah were slain at Riblah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'Then the king of Babylon slew the sons of Zedekiah in Riblah before his eyes: also the king of Babylon slew all the nobles of Judah.'
  - where: 'note 11:10 “Judged at the border”'
    claim: 'The Church edition’s footnote at verse 10 points to these passages'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: '2 Kgs. 25:21 (19–21); Jer. 39:6; 52:10'
  - where: 'note 11:10 “Judged at the border”'
    claim: 'The threat has been read as fulfilled at Riblah, on the frontier and not in Jerusalem'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/11.htm'
    quote: 'not in Jerusalem, but on the frontier of Israel'
  - where: 'note 11:10 “Judged at the border”'
    claim: 'The threat has been read as literally fulfilled at Riblah'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/11.htm'
    quote: 'This threat was literally fulfilled in the bloody scenes at Riblah (Jeremiah 52:24-27).'
  - where: 'note 11:13 “A death in the vision, and the prophet’s cry”'
    claim: 'Ezekiel was brought to Jerusalem in vision'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'and brought me in the visions of God to Jerusalem'
  - where: 'note 11:13 “A death in the vision, and the prophet’s cry”'
