chapter: 11
claims:
  - where: 'when'
    claim: 'The vision of chapters 8–11 is dated to the sixth year, sixth month, fifth day'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year), so the sixth year is about 591'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin. He settled at Tel Abib on the Chebar'
  - where: 'setting'
    claim: 'The deportation that followed Jerusalem’s fall was in 586 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'The vision began as Ezekiel sat in his house with the elders of Judah before him'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'as I sat in mine house, and the elders of Judah sat before me, that the hand of the Lord God fell there upon me'
  - where: 'setting'
    claim: 'He was taken in vision to Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'and brought me in the visions of God to Jerusalem, to the door of the inner gate that looketh toward the north'
  - where: 'setting'
    claim: 'Chapter 8 shows abominations committed in the temple'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'even the great abominations that the house of Israel committeth here, that I should go far off from my sanctuary'
  - where: 'setting'
    claim: 'Chapter 9 shows the marking of the righteous and the slaying of the rest'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'Ezekiel sees the marking of the righteous and the slaughter of all others, beginning at the Lord’s sanctuary.'
  - where: 'setting'
    claim: 'In chapter 10 the glory and the cherubim move to the east gate'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'every one stood at the door of the east gate of the Lord’s house; and the glory of the God of Israel was over them above'
  - where: 'setting'
    claim: 'Chapter 11 is the concluding part of the vision, in three parts'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/11.htm'
    quote: 'This chapter contains the concluding portion of the vision'
  - where: 'setting'
    claim: 'The promise recurs in chapter 36'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'A new heart also will I give you, and a new spirit will I put within you'
  - where: 'setting'
    claim: 'The glory returns in chapter 43'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And the glory of the Lord came into the house by the way of the gate whose prospect is toward the east.'
  - where: 'thread'
    claim: 'The refrain “ye shall know that I am the LORD” is explained at chapter 6'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'and ye shall know that I am the Lord'
  - where: 'note 11:1 “The twenty-five men at the east gate”'
    claim: 'Earlier in the vision about twenty-five men stood in the inner court between the porch and the altar, worshipping the sun'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'between the porch and the altar, were about five and twenty men, with their backs toward the temple of the Lord, and their faces toward the east; and they worshipped the sun toward the east'
  - where: 'note 11:1 “The twenty-five men at the east gate”'
    claim: 'The Jaazaniah of chapter 8 is the son of Shaphan'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'in the midst of them stood Jaazaniah the son of Shaphan'
  - where: 'note 11:1 “The twenty-five men at the east gate”'
    claim: 'The glory had moved to the east gate at the end of chapter 10'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'every one stood at the door of the east gate of the Lord’s house; and the glory of the God of Israel was over them above'
  - where: 'note 11:3 “What the princes were saying about houses”'
    claim: 'The Hebrew is four words, “not near, to build houses”; the verb is a Qal infinitive construct'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בְּנ֣וֹת'
  - where: 'note 11:3 “What the princes were saying about houses”'
    claim: 'NRSVUE renders “The time is not near to build houses”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2011%3A3%2C15-16%2C19&version=NRSVUE'
    quote: 'they say, ‘The time is not near to build houses; this city is the pot, and we are the meat.’'
  - where: 'note 11:3 “What the princes were saying about houses”'
    claim: 'ESV renders the same and notes in the margin that it may be a question'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2011%3A3%2C15-16%2C19&version=ESV'
    quote: 'Or Is not the time near'
  - where: 'note 11:3 “What the princes were saying about houses”'
    claim: 'The Septuagint takes it as a question about houses newly built'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/11.htm'
    quote: 'who say, Have not the houses been newly built? This is the caldron, and we are the flesh.'
  - where: 'note 11:3 “What the princes were saying about houses”'
    claim: 'Jeremiah wrote to the exiles to build houses, since the captivity would be long'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'This captivity is long: build ye houses, and dwell in them'
  - where: 'note 11:3 “What the princes were saying about houses”'
    claim: 'One explanation: the leaders ridicule Jeremiah’s letter'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'This word of Jeremiah the authorities in Jerusalem ridiculed, saying ‘house-building is not near,’ i.e. the house-building in exile is still a long way off; it will not come to this, that Jerusalem should fall either permanently or entirely into the hands of the king of Babylon.'
  - where: 'note 11:3 “What the princes were saying about houses”'
    claim: 'The explanation that the leaders ridicule Jeremiah’s letter is Keil’s, read on his own page'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/11.htm'
    quote: 'the house-building in exile is still a long way off; it will not come to this, that Jerusalem should fall either permanently or entirely into the hands of the king of Babylon'
  - where: 'note 11:3 “The caldron and the flesh”'
    claim: 'The leaders mean that the city protects them as a pot protects meat'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The point of comparison is this: as the pot protects the flesh from burning, so does the city of Jerusalem protect us from destruction.'
  - where: 'note 11:3 “The caldron and the flesh”'
    claim: 'The word is a household pot for boiling, symbolic of Jerusalem in Ezekiel 11 and 24'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5518.htm'
    quote: 'household utensil for boiling'
  - where: 'note 11:3 “The caldron and the flesh”'
    claim: 'The lexicon lists the word as symbolic of Jerusalem in 11:3, 7, 11 and 24:3, 6'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5518.htm'
    quote: 'symbolic of Jerusalem Ezekiel 11:3,7,11; Ezekiel 24:3,6'
  - where: 'note 11:3 “The caldron and the flesh”'
    claim: 'In Ezekiel the word occurs only in 11:3, 7, 11 and 24:3, 6 (scripts/hebrew.mjs ezekiel --word 5518: 5 occurrences)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַסִּ֔יר'
  - where: 'note 11:3 “The caldron and the flesh”'
    claim: 'The previous scene said the land is full of blood'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'the land is full of blood, and the city full of perverseness'
  - where: 'note 11:3 “The caldron and the flesh”'
    claim: 'Chapter 24 uses the pot for Jerusalem again'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Woe to the bloody city, to the pot whose scum is therein'
  - where: 'note 11:3 “The caldron and the flesh”'
    claim: 'The comparison of the pot protecting the meat is Keil’s, read on his own page'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/11.htm'
    quote: 'The point of comparison is this: as the pot protects the flesh from burning, so does the city of Jerusalem protect us from destruction.'
