chapter: 29
claims:
  - where: 'when'
    claim: 'The book counts its years from the captivity of Jehoiachin'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'The siege of Jerusalem began in the ninth year, tenth month, tenth day: a year and two days before the date of 29:1'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month'
  - where: 'when'
    claim: 'Ezekiel prophesied 592–570 B.C.; the tenth year counted from the fifth (592) is about 587, the twenty-seventh about 570'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The date of 29:17 is the latest in the book'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'was the latest of all the predictions of Ezekiel that are supplied with dates'

  - where: 'setting'
    claim: 'Word of the city’s fall reached Ezekiel in the twelfth year, tenth month, fifth day: a week short of two years after the date of 29:1'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month'
  - where: 'setting'
    claim: 'Chapters 25–32 are the prophecies against other nations'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(2) 25–32, prophecies against Israel’s enemies'
  - where: 'setting'
    claim: 'The four chapters on Egypt have been counted as seven words of God, of which this chapter has the first two'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'The announcement of the judgment upon Egypt is proclaimed in seven'
  - where: 'setting'
    claim: 'The second word is 29:17–21'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'The second (Ezekiel 29:17-21) gives a special prediction of the conquest and plundering of Egypt by Nebuchadnezzar.'
  - where: 'setting'
    claim: 'Chapter 26 is dated to the eleventh year, later than 29:1'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'And it came to pass in the eleventh year, in the first day of the month'
  - where: 'setting'
    claim: 'The temple vision is dated to the twenty-fifth year, two years before 29:17'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity'
  - where: 'setting'
    claim: 'The Pharaoh of Jeremiah 37 and 43 and of Ezekiel 29 is the same king'
    key: 'bd-pharaoh'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: 'Pharaoh Hophra, who sent an army to the assistance of Zedekiah (Jer. 37:5–11; 43:9; Ezek. 17:17; 29:2–3'

  - where: 'thread'
    claim: 'Egypt’s guilt in Ezekiel is Pharaoh’s self-deification and the treacherous help given to Israel'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'the guilt of Egypt and its Pharaoh mentioned by Ezekiel is not any crime against Jehovah, but simply Pharaoh''s deification of himself, and the treacherous nature of the help which Egypt afforded to Israel'

  - where: 'section 2 plain'
    claim: '“Be at a stand” rendered as a standstill'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'OR come to a standstill'

  - where: 'note 29:2 “Pharaoh Hophra”'
    claim: 'The Pharaoh of Ezekiel 29:2–3 is Hophra, who sent an army to help Zedekiah'
    key: 'bd-pharaoh'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: 'Pharaoh Hophra, who sent an army to the assistance of Zedekiah (Jer. 37:5–11; 43:9; Ezek. 17:17; 29:2–3'
  - where: 'note 29:2 “Pharaoh Hophra”'
    claim: 'Jeremiah names Hophra'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'Behold, I will give Pharaoh-hophra king of Egypt into the hand of his enemies'
  - where: 'note 29:2 “Pharaoh Hophra”'
    claim: 'The Chaldeans left Jerusalem when Pharaoh’s army came out, and Jeremiah said they would come back'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'And the Chaldeans shall come again, and fight against this city, and take it, and burn it with fire.'

  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'The Hebrew word is tannin, here spelled tannim (H8577)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/תַּנִּים֙'
  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'The lexicon’s gloss of tannin'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8577.htm'
    quote: 'serpent, dragon, sea-monster'
  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'The same word, in the same spelling, stands at Ezekiel 32:2, where the King James has “whale”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8577.htm'
    quote: 'Ezekiel 29:3; Ezekiel 32:2 (by confusion with plural of'
  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'Tannin covers snakes, crocodiles and legendary sea serpents'
    key: 'sc-knowhy-732'
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-dragons'
    quote: 'is a broad term describing reptilian creatures of various sizes: snakes, crocodiles, and even legendary sea serpents'
  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'Because of the Nile, the tannin of Ezekiel 29:3 and 32:2 is likely a crocodile'
    key: 'sc-knowhy-732'
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-dragons'
    quote: 'seem likely to be a crocodile (Exodus 7:9–10, 12; Ezekiel 29:3; 32:2)'
  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'The tannin is a creature of the water'
    key: 'sc-knowhy-732'
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-dragons'
    quote: 'it is primarily associated with water and is typically described in or with water'
  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'Several passages speak of Jehovah slaying a sea monster called tannin'
    key: 'sc-knowhy-732'
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-dragons'
    quote: 'Several biblical passages seem to make reference to Jehovah slaying a great sea monster (tannin) as part of the Creation'
  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'The Bible Dictionary takes the word as a figure here'
    key: 'bd-dragon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dragon?lang=eng'
    quote: 'Used figuratively in Ezek. 29:3.'
  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'Isaiah 51:9–10 sets the wounding of the dragon beside the drying of the sea'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'Art thou not it which hath dried the sea, the waters of the great deep'

  - where: 'note 29:3 “The dragon in the Nile”'
    claim: 'Isaiah 51:9 has the same Hebrew word, tannin (H8577), for “dragon” (scripts/hebrew.mjs isaiah 51:9)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'תַּנִּֽין'

  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'The river is the Nile'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'IE the Nile'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'A modern translation prints the name'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2029&version=ESV'
    quote: 'My Nile is my own'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'The plural “rivers” are the Nile’s arms and canals'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'we are to understand the arms and canals of the Nile'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'Egypt owed its existence to the Nile'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'Egypt is indebted to the Nile not only for its greatness, but for its actual existence'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'Pharaoh regards himself as the creator, and this pride is his sin'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'This pride, in which he forgets God and attributes divine power to himself, is the cause of his sin, for which he will be overthrown by God'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'Pharaoh says the river is his because he regards himself as its creator'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'because he regards himself as the creator'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'The Student Manual prints the same reading of Pharaoh’s pride'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'By his insufferable pride in placing himself among the gods, Pharaoh has exposed his whole land to God’s anger.'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'The same pride was charged to the prince of Tyre in the chapter before'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/29.htm'
    quote: 'the same extravagant pride and profanity which were in the preceding chapter laid to the charge of the prince of Tyre'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'The Hebrew verb in the last clause has a first-person ending (“I made me”)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'עֲשִׂיתִֽ/נִי'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'The Latin rendering “I made myself” is rejected'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'The rendering of the Vulgate, ego feci memetipsum, is false.'
  - where: 'note 29:3 “The boast over the Nile”'
    claim: 'Verse 9, without the ending, shows the sense'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'as Ezekiel 29:9, where the suffix is wanting, clearly shows'

  - where: 'note 29:4 “Hooked, hauled out, and left in the desert”'
    claim: 'Crocodiles were caught with large hooks in ancient times'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'The figure is derived from the manner in which even in ancient times the crocodile was caught with large hooks of a peculiar construction'
  - where: 'note 29:4 “Hooked, hauled out, and left in the desert”'
    claim: 'The fish are the people of Egypt'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'The fishes which hang upon the scales of the monster, and are drawn along with it out of the Nile, are the inhabitants of Egypt, for the Nile represents the land.'
  - where: 'note 29:4 “Hooked, hauled out, and left in the desert”'
    claim: 'The wilderness is dry land where a water animal dies'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'The wilderness is the dry and barren land, in which animals that inhabit the water must perish'
  - where: 'note 29:4 “Hooked, hauled out, and left in the desert”'
    claim: 'The Church’s footnote on “hooks” points to Ezekiel 38:4'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'Ezek. 38:4'
  - where: 'note 29:4 “Hooked, hauled out, and left in the desert”'
    claim: 'Chapter 32 returns to the image with a net'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/32?lang=eng'
    quote: 'I will therefore spread out my net over thee with a company of many people'

  - where: 'note 29:6 “The reed that breaks”'
    claim: 'The Church’s footnote on “reed” points to the Assyrian officer’s taunt'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: '2 Kgs. 18:21; Isa. 36:6'
  - where: 'note 29:6 “The reed that breaks”'
    claim: 'The Hebrew of verse 7 has “to stand”; a modern translation follows the Syriac'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2029&version=ESV'
    quote: 'Ezekiel 29:7 Syriac (compare Psalm 69:23); Hebrew to stand'
  - where: 'note 29:6 “The reed that breaks”'
    claim: 'The translation’s rendering of the last clause of verse 7'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2029&version=ESV'
    quote: 'made all their loins to shake'
  - where: 'note 29:6 “The reed that breaks”'
    claim: 'The Church’s footnote on “be at a stand”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'OR come to a standstill'

  - where: 'note 29:10 “From Migdol to Syene”'
    claim: 'The Hebrew has two place-names'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'HEB from Migdol to Syene'
  - where: 'note 29:10 “From Migdol to Syene”'
    claim: 'A modern translation’s rendering'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2029&version=ESV'
    quote: 'from Migdol to Syene, as far as the border of Cush'
  - where: 'note 29:10 “From Migdol to Syene”'
    claim: 'Migdol was at the northern end of Egypt'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'the most northerly place in Egypt'
  - where: 'note 29:10 “From Migdol to Syene”'
    claim: 'Syene was the southern border town, by modern Aswan'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'the most southerly border town of Egypt in the direction of Cush, i.e., Ethiopia, on the eastern bank of the Nile, some ruins of which are still to be seen in the modern Assvan'
  - where: 'note 29:10 “From Migdol to Syene”'
    claim: 'The border of Cush is the same southern limit, not a further one'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'does not give a fresh terminal point, still further advanced, but simply defines with still greater clearness the boundary toward the south'
  - where: 'note 29:10 “From Migdol to Syene”'
    claim: 'Jews were living at Migdol after Jerusalem fell'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'all the Jews which dwell in the land of Egypt, which dwell at Migdol'
  - where: 'note 29:10 “From Migdol to Syene”'
    claim: 'Chapter 30 uses the phrase again'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/30?lang=eng'
    quote: 'from the tower of Syene shall they fall in it by the sword'

  - where: 'note 29:11 “Forty years”'
    claim: 'One count: the reign of Amasis'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/29.htm'
    quote: 'it is probable that this desolation continued during the whole of the reign of Amasis, which was just forty years'
  - where: 'note 29:11 “Forty years”'
    claim: 'Another count: from Nebuchadnezzar’s war to Cyrus'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/29.htm'
    quote: 'if we reckon from the commencement of the war against Pharaoh-hophra by Nebuchadnezzar, to the third or fourth year of Cyrus, the term will be about forty years'
  - where: 'note 29:11 “Forty years”'
    claim: 'Forty read as a symbolic term'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'but is a symbolical term denoting a period appointed by God for punishment and penitence'
  - where: 'note 29:11 “Forty years”'
    claim: 'On that reading the number cannot be calculated'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'which is not to be understood in a chronological sense, or capable of being calculated'
  - where: 'note 29:11 “Forty years”'
    claim: 'The two verbs for scattering in 29:12 (H6327, H2219) are those used of Jerusalem in 22:15'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְֽ/זֵרִיתִ֖י/ם'
  - where: 'note 29:11 “Forty years”'
    claim: 'Ezekiel 22:15 has the same two verbs'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/זֵרִיתִ֖י/ךְ'
  - where: 'note 29:11 “Forty years”'
    claim: 'The Church’s footnote on “gather” points to Jeremiah 46:26'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'Jer. 46:26'

  - where: 'note 29:15 “A lowly kingdom”'
    claim: 'The Church’s footnote on “base”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'OR lowly'
  - where: 'note 29:15 “A lowly kingdom”'
    claim: 'A modern translation’s rendering'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2029&version=ESV'
    quote: 'It shall be the most lowly of the kingdoms'
  - where: 'note 29:15 “A lowly kingdom”'
