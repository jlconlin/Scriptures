    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תִתְנַשֵּׂ֥א'
  - where: 'note 29:15 “A lowly kingdom”'
    claim: 'Ezekiel 17:14 has the same adjective and the same verb, in the same reflexive stem'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הִתְנַשֵּׂ֑א'
  - where: 'note 29:15 “A lowly kingdom”'
    claim: 'Pathros is Upper Egypt'
    key: 'bd-pathros'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pathros?lang=eng'
    quote: 'Upper Egypt.'
  - where: 'note 29:15 “A lowly kingdom”'
    claim: 'The Church’s footnote on “habitation”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'HEB origin'
  - where: 'note 29:15 “A lowly kingdom”'
    claim: 'Pathros is the south of Egypt'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Pathros (see v. 14) was the name for upper Egypt, or the south part of Egypt.'
  - where: 'note 29:15 “A lowly kingdom”'
    claim: 'The Student Manual reads the verse as fulfilled in Egypt’s decline'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'From that point on, Egypt ceased to play an important role in world affairs.'
  - where: 'note 29:15 “A lowly kingdom”'
    claim: 'Egypt passed under Persia, Alexander and Rome'
    key: 'bd-egypt'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng'
    quote: 'Egypt was invaded by Cambyses and became a province of the Persian empire. It next became part of the dominions of Alexander the Great, and on the downfall of the Greek empire passed into the hands of the Romans.'

  - where: 'note 29:16 “A reminder of iniquity”'
    claim: 'Trust in Egypt brings Israel’s guilt to remembrance before God'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'making Egypt the ground of confidence, brings into remembrance before God the guilt of Israel, which consists in the fact that the Israelites turn to the Egyptians and seek salvation from them'
  - where: 'note 29:16 “A reminder of iniquity”'
    claim: '“Look after them” means turn to them for help'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2029&version=ESV'
    quote: 'recalling their iniquity, when they turn to them for aid'
  - where: 'note 29:16 “A reminder of iniquity”'
    claim: 'Another translation makes Israel the one who remembers'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2029&version=NRSVUE'
    quote: 'they will recall their iniquity when they turned to them for aid'
  - where: 'note 29:16 “A reminder of iniquity”'
    claim: 'Ezekiel 21:23 has a like expression'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'but he will call to remembrance the iniquity, that they may be taken'

  - where: 'note 29:16 “A reminder of iniquity”'
    claim: 'The same commentary sets the clause beside Ezekiel 21:23–24 (21:28–29 in the Hebrew numbering)'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/29.htm'
    quote: 'so that He is obliged to punish them (vid., Ezekiel 21:28-29)'

  - where: 'note 29:18 “The siege of Tyre paid nothing”'
    claim: 'Chapter 26 had named Nebuchadnezzar as the one brought against Tyre'
