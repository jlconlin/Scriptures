chapter: 31
claims:
  - where: 'when'
    claim: 'The oracle is dated to the eleventh year, third month, first day'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/31?lang=eng'
    quote: 'And it came to pass in the eleventh year, in the third month, in the first day of the month'
  - where: 'when'
    claim: 'Ezekiel’s ministry began about 592 B.C. (the fifth year of the captivity), so the eleventh year is about 586 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The oracle comes two months less six days after the one before it (30:20)'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'In two months minus six days from the time when the preceding word of God was uttered, Ezekiel received another threatening word against the king and the people of Egypt'
  - where: 'setting'
    claim: 'Chapters 25–32 are prophecies against Israel’s enemies'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(2) 25–32, prophecies against Israel’s enemies'
  - where: 'setting'
    claim: 'The date is two months less six days after the previous oracle'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'In two months minus six days from the time when the preceding word of God was uttered'
  - where: 'setting'
    claim: 'The previous dated oracle (30:20) is of the eleventh year, first month, seventh day'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/30?lang=eng'
    quote: 'And it came to pass in the eleventh year, in the first month, in the seventh day of the month'
  - where: 'setting'
    claim: 'The date is about a month before Jerusalem was taken'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/31.htm'
    quote: 'a month before Jerusalem was taken by the Chaldeans'
  - where: 'setting'
    claim: 'Jeremiah dates the breach of the wall to the eleventh year of Zedekiah, fourth month, ninth day'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'And in the eleventh year of Zedekiah, in the fourth month, the ninth day of the month, the city was broken up.'
  - where: 'setting'
    claim: 'The Pharaoh of this chapter is Hophra, who sent an army to help Zedekiah; the Bible Dictionary lists Ezek. 31:2, 18 under him'
    key: 'bd-pharaoh'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: 'Pharaoh Hophra, who sent an army to the assistance of Zedekiah (Jer. 37:5–11; 43:9; Ezek. 17:17; 29:2–3; 30:21–25; 31:2, 18; 32:2, 31–32)'
  - where: 'setting'
    claim: 'The fall of Assyria was still fresh in mind when the oracle was given'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'The fall of that great empire was still so fresh in the mind at the time'
  - where: 'setting'
    claim: 'By the book’s own count the eleventh year of the captivity is the year the city was smitten (the twenty-fifth year is the fourteenth after it)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'in the fourteenth year after that the city was smitten'
  - where: 'setting'
    claim: 'The chapter describes Assyria as a cedar and draws the conclusion for Pharaoh in verse 18'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'The question, whom Pharaoh resembles, is then repeated in Ezekiel 31:18; and from the preceding comparison the conclusion is drawn, that he will perish like that lofty cedar.'
  - where: 'setting'
    claim: 'The picture of the cedar recalls the figure of chapter 17'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'The picture of the glory of this cedar recalls in several respects the similar figurative description in Ezekiel 17.'
  - where: 'thread'
    claim: 'The question of verse 2 is repeated in verse 18 and the story of the cedar stands between'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'proceeds to depict Asshur as a mighty towering cedar (Ezekiel 31:3-9) which has been felled and cast down by the prince of the nations on account of its height and pride (Ezekiel 31:10-14), so that everything mourned over its fall'
  - where: 'thread'
    claim: 'The Hebrew verb yarad, “go down” (Strong’s 3381), occurs six times in verses 14–18: once in 14, 15, 17 and 18 and twice in 16 (scripts/hebrew.mjs ezekiel 31:14–18)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'יָרְד֥וּ'

  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'The Hebrew word in verse 3 is ashshur, the proper name Assyria (Strong’s 804, tagged as a proper noun)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אַשּׁ֜וּר'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'A modern translation keeps Assyria'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2031&version=NRSVUE'
    quote: 'Consider Assyria, a cedar of Lebanon,'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'An older commentary asks why the Assyrian is introduced'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/31.htm'
    quote: 'Why is the Assyrian introduced here, when the whole chapter concerns Egypt?'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'It reports a proposal to read the word as a kind of cedar, so that the description is of Egypt'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/31.htm'
    quote: 'should be translated the tall cedar, the very stately cedar; hence there is reference to his lofty top; and all the following description belongs to Egypt, not to Assyria.'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'Pharaoh is nowhere said to be the cedar; the question is asked again in verse 18'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'For it is not anywhere affirmed that Pharaoh resembled this cedar; on the contrary, the question, whom does he resemble? is asked again in Ezekiel 31:18'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'The cedar’s fall is past and Pharaoh’s is future, so the cedar can only be Assyria'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'the cedar, whose destruction is not only threatened in Ezekiel 31:10-17, but declared to have already taken place, can only be Asshur, and not Egypt at all.'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'The chapter heading in the Church’s edition takes the chapter as a comparison of Pharaoh with the Assyrians'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/31?lang=eng'
    quote: 'Pharaoh’s glory and fall are compared to that of the Assyrians.'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'The fall of Assyria was still fresh in mind'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'The fall of that great empire was still so fresh in the mind at the time, that the reminiscence could not fail to make a deep impression upon the prophet''s hearers.'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'The Church footnote on “Assyrian” in verse 3 points to Isaiah 10:5'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/31?lang=eng'
    quote: 'Isa. 10:5'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'A modern translation’s cross-references join verse 3 to Isaiah 10:33–34'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2031&version=ESV'
    quote: 'Ezekiel 31:3 : [Isa. 10:34]; See Dan. 4:10, 20-22'
  - where: 'note 31:3 “Why a word to Pharaoh describes Assyria”'
    claim: 'Isaiah 10:33–34 speaks of the high ones hewn down and Lebanon falling'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/10?lang=eng'
    quote: 'and the high ones of stature shall be hewn down, and the haughty shall be humbled.'

  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: '“Shroud” in older English meant a shelter or cover'
    key: 'webster-1828'
    url: 'https://webstersdictionary1828.com/Dictionary/shroud'
    quote: '1. A shelter; a cover; that which covers, conceals or protects.'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'The Hebrew word is choresh (Strong’s 2793), followed by a participle of the verb to give shade (6751)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חֹ֥רֶשׁ'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'Choresh means wood, wooded height'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2793.htm'
    quote: 'noun masculineEzekiel 31:3 wood, wooded height'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'A modern translation has “forest shade” and “its top among the clouds”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2031&version=ESV'
    quote: 'its top among the clouds.'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'A modern translation has “forest shade”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2031&version=NRSVUE'
    quote: 'with fair branches and forest shade,'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'The Septuagint has no equivalent of the “shadowing shroud” and has the top among the clouds'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/31.htm'
    quote: 'Behold, the Assyrian was a cypress in Libanus, and was fair in shoots, and high in stature: his top reached to the midst of the clouds.'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'The Hebrew word behind “thick boughs” is abotim (Strong’s 5688), in verses 3, 10 and 14'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'עֲבֹתִ֔ים'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'The word’s ordinary sense is cord, rope'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5688.htm'
    quote: '1 cord, rope:'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'The lexicon allows “interwoven foliage (?)” but judges that in Ezekiel 31:3, 10, 14 it is certainly clouds, as the Septuagint has'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5688.htm'
    quote: '2 interwoven foliage (?) in phrase (עַלֿ)בֵּין עֲבֹתִים of top of a vine Ezekiel 19:11 (clouds Ew Hi-Sm Toy, read then עָבוֺת); of cedar, Ezekiel 31:3,10,14, but in these certainly clouds'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'The modern translation gives the King James reading as an alternative in a footnote'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2031&version=ESV'
    quote: 'Ezekiel 31:3 Or its top went through the thick boughs'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'The Church footnote at verse 10 points to Isaiah 14:13–15'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/31?lang=eng'
    quote: 'Isa. 14:13 (13–15)'
  - where: 'note 31:3 “Shade, and a top in the clouds”'
    claim: 'A modern translation’s cross-references join verse 10 to Isaiah 14:13–14'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2031&version=NRSVUE'
    quote: '31.10 : Isa 14.13, 14; Ezek 28.17; Dan 5.20'

  - where: 'note 31:4 “Great because of the waters”'
