    claim: 'A modern translation has “could not rival it”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2031&version=ESV'
    quote: 'in the garden of God could not rival it,'
  - where: 'note 31:8 “The envy of Eden”'
    claim: 'The same translation has fir trees and plane trees'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2031&version=ESV'
    quote: 'neither were the plane trees'
