    claim: 'The Church footnote on “Eden” in verse 9 points to Ezekiel 28:13'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/31?lang=eng'
    quote: 'Ezek. 28:13'
  - where: 'note 31:8 “The envy of Eden”'
    claim: 'The comparison means that all other nations were inferior to Assyria'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/31.htm'
    quote: 'all the other nations and kingdoms in God''s creation were far inferior to Asshur in greatness and glory.'
  - where: 'note 31:8 “The envy of Eden”'
    claim: 'The Eden imagery suits Assyria because Eden’s rivers afterward watered Assyria'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/31.htm'
    quote: 'the imagery, that is applied to the Assyrian king, is taken from Eden; peculiarly appropriate, as Eden was watered by rivers that afterwards watered Assyria (Ge 2:10-14).'
  - where: 'note 31:8 “The envy of Eden”'
