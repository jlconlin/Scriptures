    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6004.htm'
    quote: 'Ezekiel 31:8 dubious, but probably (as Thes) cedars did not eclipse him'
  - where: 'note 31:8 “The envy of Eden”'
    claim: 'The verb’s meaning is darken, dim'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6004.htm'
    quote: 'verb darken, dim'
