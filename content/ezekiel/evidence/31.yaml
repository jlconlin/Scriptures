    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/31?lang=eng'
    quote: 'I have made him fair by the multitude of his branches'

  - where: 'note 31:6 “The tree that shelters the nations”'
