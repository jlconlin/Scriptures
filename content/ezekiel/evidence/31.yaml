  - where: 'note 31:11 “Who cut the cedar down”'
    claim: 'The Medes, allied with the Babylonians, took Nineveh about 607 B.C.'
    key: 'bd-assyria'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'Again the Medes advanced in alliance with the Babylonians, and Nineveh fell, about 607 B.C.'
  - where: 'note 31:11 “Who cut the cedar down”'
    claim: 'A more recent Latter-day Saint account dates the fall of Nineveh to 612 B.C.'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'in 612 B.C. Nineveh fell. Basically that signaled the end of the Assyrian Empire.'
  - where: 'note 31:11 “Who cut the cedar down”'
    claim: 'Nabopolassar was king of Babylon, and Nebuchadnezzar his son led his army'
