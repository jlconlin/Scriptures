  - where: 'note 31:8 “The envy of Eden”'
    claim: 'The Hebrew verb in “could not hide him” is amam (Strong’s 6004)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'עֲמָמֻ'
  - where: 'note 31:8 “The envy of Eden”'
