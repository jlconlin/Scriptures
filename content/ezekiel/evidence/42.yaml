  - where: 'note 42:13 “Where the most holy things are eaten”'
    claim: 'The “meat offering” is a meal offering'
    key: 'bd-sacrifices'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'specially denotes an unbloody or meal offering'
  - where: 'note 42:13 “Where the most holy things are eaten”'
    claim: 'A modern translation has “grain offering”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2042&version=ESV'
    quote: 'the grain offering'
  - where: 'note 42:13 “Where the most holy things are eaten”'
