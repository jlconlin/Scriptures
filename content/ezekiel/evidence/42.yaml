    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'Wherefore have ye not eaten the sin offering in the holy place, seeing it is most holy'
  - where: 'note 42:13 “Where the most holy things are eaten”'
