  - where: 'note 42:16 “Reeds or cubits”'
    claim: 'It is a separating domain between the sanctuary and the common land'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/42.htm'
    quote: 'a space which was intended to form a separating domain between the sanctuary and the common land'
  - where: 'note 42:16 “Reeds or cubits”'
