  - where: 'note 42:13 “Where the most holy things are eaten”'
    claim: 'The priests who come near were named in chapter 40 as the sons of Zadok'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'these are the sons of Zadok among the sons of Levi'

  - where: 'note 42:14 “Holy garments stay inside”'
    claim: 'The rule is repeated in 44:19 with its reason'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'they shall put off their garments wherein they ministered, and lay them in the holy chambers, and they shall put on other garments; and they shall not sanctify the people with their garments'
  - where: 'note 42:14 “Holy garments stay inside”'
    claim: 'The sanctifying of 44:19 is explained from the law’s rule that touching most holy flesh sanctifies, as with the altar (Ex. 29:37) and in Ezek. 46:20'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'analogous to the rule laid down in the law, that touching most holy sacrificial flesh would sanctify'
  - where: 'note 42:14 “Holy garments stay inside”'
    claim: 'The same commentary joins Ezek. 46:20 and Ex. 29:37 to the rule'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'which Ezekiel repeats in Ezekiel 46:20, and which does not stand in anything like an isolated position in the law, but is also affirmed in Exodus 29:37'
  - where: 'note 42:14 “Holy garments stay inside”'
    claim: 'Under the law of Moses the priests took off the official garments when the service was ended (Lev. 16:23 among the verses named), set beside the rule of Ezek. 44:17–19'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/44.htm'
    quote: 'according to Leviticus 6:4; Leviticus 16:23, were to take them off when the service was ended'
  - where: 'note 42:14 “Holy garments stay inside”'
    claim: 'On the Day of Atonement Aaron left the linen garments in the holy place'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'shall put off the linen garments, which he put on when he went into the holy place, and shall leave them there'
  - where: 'note 42:14 “Holy garments stay inside”'
    claim: 'A modern translation takes “those things which are for the people” as a place'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2042&version=NRSVUE'
    quote: 'they shall put on other garments before they go near to the area open to the people'

