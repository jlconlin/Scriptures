chapter: 42
claims:
  - where: 'when'
    claim: 'The vision of chapters 40–48 is dated to the twenty-fifth year of the captivity, the fourteenth after the city was smitten'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'

  - where: 'setting'
    claim: 'In the vision Ezekiel is set on a very high mountain in the land of Israel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the visions of God brought he me into the land of Israel, and set me upon a very high mountain'
  - where: 'setting'
    claim: 'The guide carries a line of flax and a measuring reed'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'with a line of flax in his hand, and a measuring reed; and he stood in the gate'
  - where: 'setting'
    claim: 'Chapter 40 begins at the wall outside the house and goes through the courts'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'And behold a wall on the outside of the house round about'
  - where: 'setting'
    claim: 'Chapter 40 measures the outer court and the inner court with its gates'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'And without the inner gate were the chambers of the singers in the inner court, which was at the side of the north gate'
  - where: 'setting'
    claim: 'Chapter 41 measures the temple house, the separate place, and the building behind it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/41?lang=eng'
    quote: 'So he measured the house, an hundred cubits long; and the separate place, and the building, with the walls thereof, an hundred cubits long'
  - where: 'setting'
    claim: 'Modern translators mark the Hebrew of verses 3 and 5 as uncertain'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2042&version=ESV'
    quote: 'The meaning of the Hebrew word is uncertain; also verse 5'
  - where: 'setting'
    claim: 'Chapter 43 begins at the east gate'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'Afterward he brought me to the gate, even the gate that looketh toward the east'

  - where: 'thread'
    claim: 'The priests of Jerusalem were charged with putting no difference between the holy and profane'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'they have put no difference between the holy and profane'

  - where: 'section 1 plain'
    claim: '“Utter court” is the outer court'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2042&version=ESV'
    quote: 'Then he led me out into'
  - where: 'section 1 plain'
    claim: 'The galleries take space from the upper chambers (where the King James has “the galleries were higher than these”)'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2042&version=ESV'
    quote: 'Now the upper chambers were narrower, for the galleries took more away from them than from the lower and middle chambers of the building'
  - where: 'section 4 plain'
    claim: '“The profane place” is the common ground'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2042&version=ESV'
    quote: 'to make a separation between the holy and the common'

