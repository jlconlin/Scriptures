  - where: 'note 42:1 “The yard and the priests’ chambers”'
    claim: 'In verse 10 the Hebrew has “east” and the Septuagint “south,” which a modern translation follows'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2042&version=ESV'
