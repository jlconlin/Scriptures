    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+27&version=ESV'
    quote: 'men of Gamad were in your towers'
  - where: 'note 27:11 “Who the Gammadims were”'
    claim: 'The Septuagint has guards'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/27.htm'
    quote: 'there were guards in thy towers'

  - where: 'note 27:12 “The trade list, from Tarshish to Tarshish”'
    claim: 'Tarshish was probably Tartessus in Spain, and ships of Tarshish were the largest ships'
    key: 'bd-tarshish'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng'
    quote: 'Probably Tartessus in Spain; ships of Tarshish (the name came to be used to denote ships of the largest size, suitable for long voyages)'
  - where: 'note 27:12 “The trade list, from Tarshish to Tarshish”'
    claim: 'The list begins with Tarshish in the west, moves north and east, and ends with Tarshish'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'commences with Tarshish (Tartessus) in the extreme west, then turns to the north, passes through the different lands of Anterior Asia and the Mediterranean to the remotest north-east, and ends by mentioning Tarshish again'
  - where: 'note 27:12 “The trade list, from Tarshish to Tarshish”'
    claim: 'The order is not strictly geographical'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'the enumeration does not follow a strictly geographical order'
  - where: 'note 27:12 “The trade list, from Tarshish to Tarshish”'
    claim: 'Javan was regarded as the founder of the Greek race'
    key: 'bd-javan'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/javan?lang=eng'
    quote: 'Son of Japheth; regarded as the founder of the Greek race'
  - where: 'note 27:12 “The trade list, from Tarshish to Tarshish”'
    claim: 'Javan, Tubal, and Meshech are sons of Japheth'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/10?lang=eng'
    quote: 'The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.'
  - where: 'note 27:12 “The trade list, from Tarshish to Tarshish”'
    claim: 'Elishah and Tarshish are sons of Javan'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/10?lang=eng'
    quote: 'And the sons of Javan; Elishah, and Tarshish, Kittim, and Dodanim.'
  - where: 'note 27:12 “The trade list, from Tarshish to Tarshish”'
    claim: 'The Church’s footnotes join Meshech and Togarmah to Genesis 10 and to Gog’s army in chapter 38'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'Gen. 10:3 (2–3); Ezek. 38:6.'
  - where: 'note 27:12 “The trade list, from Tarshish to Tarshish”'
    claim: 'Meshech: Genesis 10:2 and Ezekiel 38:2'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'Gen. 10:2 (2–3); Ps. 120:5; Ezek. 38:2.'
