chapter: 27
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is 26:1, the eleventh year, the first day of the month, with no month given'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'And it came to pass in the eleventh year, in the first day of the month'
  - where: 'when'
    claim: 'The next date in the book, at 29:1, is the tenth year, so the dates are not in order'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'In the tenth year, in the tenth month, in the twelfth day of the month'
  - where: 'when'
    claim: 'Ezekiel’s ministry is dated from 592 B.C. (the fifth year, 1:2), so the eleventh year is about 586 B.C. by count'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'

  - where: 'setting'
    claim: 'Chapters 25–32 are the book’s prophecies against Israel’s enemies'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(2) 25–32, prophecies against Israel’s enemies'
  - where: 'setting'
    claim: 'Tyre (Tyrus in Ezekiel 26–28) was a commercial seaport allied with David and Solomon'
    key: 'bd-tyre'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng'
    quote: 'an important commercial and seaport town of Syria, in alliance with David (2 Sam. 5:11; 1 Chr. 14:1); with Solomon (1 Kgs. 5; 2 Chr. 2:3–16'
  - where: 'setting'
    claim: 'The Bible Dictionary lists Ezekiel 26–28 under Tyre, so Tyrus is Tyre'
    key: 'bd-tyre'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng'
    quote: 'its destruction (Jer. 25:22; 27:3; 47:4; Ezek. 26; 27:2–3, 8, 32; 28:2, 12; 29:18; Zech. 9:2–3)'
  - where: 'setting'
    claim: 'The Phoenicians, whose chief cities were Tyre and Sidon, were a great commercial people with trading stations across the Mediterranean'
    key: 'bd-phoenicia'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phoenicia?lang=eng'
    quote: 'They were a great commercial people, distributing the wares of Egypt and Babylon, and having trading stations all over the Mediterranean'
  - where: 'setting'
    claim: 'Phoenicia was the coastland north of the Philistine territory; the Hebrews dealt most with Tyre and Sidon'
    key: 'bd-phoenicia'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phoenicia?lang=eng'
    quote: 'The coastland extending from the Philistine territory to the mouth of the Orontes.'
  - where: 'setting'
    claim: 'Chapter 26 names Nebuchadrezzar as the king who will come against Tyre'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'Behold, I will bring upon Tyrus Nebuchadrezzar king of Babylon, a king of kings, from the north'
  - where: 'setting'
    claim: 'Chapter 28 addresses the prince of Tyrus'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/28?lang=eng'
    quote: 'Son of man, say unto the prince of Tyrus'
  - where: 'setting'
    claim: 'The latest date in the book, the twenty-seventh year, heads the word about Nebuchadrezzar’s service against Tyre'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'And it came to pass in the seven and twentieth year, in the first month, in the first day of the month'
  - where: 'setting'
    claim: 'Nebuchadrezzar’s army served a great service against Tyrus'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'Nebuchadrezzar king of Babylon caused his army to serve a great service against Tyrus'

  - where: 'thread'
    claim: 'The lament has three parts: Tyre’s glory (3–11), its commerce (12–25), and its ruin (26–36)'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'The lamentation commences with a picture of the glory of the city of Tyre, its situation, its architectural beauty, its military strength and defences (Ezekiel 27:3-11), and its wide-spread commercial relations (Ezekiel 27:12-25)'
  - where: 'thread'
    claim: 'The third part is lamentation over the ruin'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'and then passes into mournful lamentation over the ruin of all this glory (Ezekiel 27:26-36)'
  - where: 'thread'
    claim: 'The closing line of the chapter matches the close of chapter 26'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'In Ezekiel 27:36 Ezekiel brings the lamentation to a close in a similar manner to the threat contained in Ezekiel 26'
  - where: 'thread'
    claim: 'Chapter 28’s lament for the king closes with the same line'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/28?lang=eng'
    quote: 'thou shalt be a terror, and never shalt thou be any more'

  - where: 'section 2 plain'
    claim: '“Occupy” in verse 9 means trade'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'HEB trade or exchange'
  - where: 'section 4 plain'
    claim: '“Occupied” means traded'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'HEB traded'

  - where: 'note 27:2 “A funeral song for a city still standing”'
    claim: 'The noun in 27:2 is qinah'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'קִינָֽה'
  - where: 'note 27:2 “A funeral song for a city still standing”'
    claim: 'The same noun is in 26:17, 28:12, and 27:32'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'קִינָ֔ה'
  - where: 'note 27:2 “A funeral song for a city still standing”'
    claim: 'In chapter 26 Nebuchadrezzar’s coming is still future'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'Behold, I will bring upon Tyrus Nebuchadrezzar king of Babylon'
  - where: 'note 27:2 “A funeral song for a city still standing”'
    claim: 'The seamen take up a lamentation of their own in verse 32'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'And in their wailing they shall take up a lamentation for thee, and lament over thee, saying'
  - where: 'note 27:2 “A funeral song for a city still standing”'
    claim: 'A modern translation closes the seamen’s quoted song at the end of verse 36'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+27&version=NRSVUE'
    quote: 'and shall be no more forever.”'

  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'The Hebrew phrase means perfect in beauty and is used of Jerusalem (Ezek. 16:14; Lam. 2:15), Tyre, and the king of Tyre'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3632.htm'
    quote: '(of the king of Tyre) entire, perfect in beauty; Ezekiel 27:3'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'The lexicon lists Lamentations 2:15, of Jerusalem, with the same phrase'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3632.htm'
    quote: 'Lamentations 2:15 (of Jerusalem)'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'The words in Ezekiel 27:3 are kelilat yofi'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כְּלִ֥ילַת'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'Lamentations 2:15 has the same word'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'כְּלִ֣ילַת'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'The verb of verse 4 (perfected) is the same as in verse 11'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כָּלְל֖וּ'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'A modern translation renders verses 4 and 11 alike'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+27&version=NRSVUE'
    quote: 'your builders made perfect your beauty.'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'Verse 11 in the same translation'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+27&version=NRSVUE'
    quote: 'they made perfect your beauty.'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'The Septuagint has Tyre say she clothed herself with her beauty'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/27.htm'
    quote: 'Thou hast said, I have clothed myself with my beauty.'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'The Church’s footnote on “beauty” in verse 3 joins Lamentations 2:15 and Ezekiel 28:12'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'Lam. 2:15; Ezek. 28:12.'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'Verses 4 and 11 in the King James text'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'thy builders have perfected thy beauty'
  - where: 'note 27:3 “A phrase that belonged to Jerusalem”'
    claim: 'Verse 11'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'they have made thy beauty perfect'

  - where: 'note 27:5 “The city as a ship”'
    claim: 'From verse 4 Tyre is pictured as a ship, and its destruction as a shipwreck'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'Tyre is depicted allegorically as a beautiful ship, splendidly built and equipped throughout, and its destruction is afterwards represented as a shipwreck occasioned by the east wind'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'The comparison was suggested by the city’s situation in the sea'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'The comparison of Tyre to a ship was very naturally suggested by the situation of the city in the midst of the sea, completely surrounded by water.'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'Tyre was separated from the mainland by a strait of half a mile'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/27.htm'
    quote: 'Tyre, in consonance with her seagirt position, separated by a strait of half a mile from the mainland, is described as a ship built of the best material'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'Senir is Hermon'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/27.htm'
    quote: 'Senir—the Amorite name of Hermon'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'The Hebrew of “in the midst of the seas” is “in the heart of the seas”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בְּ/לֵ֥ב'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'A modern translation renders verse 4 “in the heart of the seas”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+27&version=NRSVUE'
    quote: 'Your borders are in the heart of the seas;'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'The same phrase at verse 27'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+27&version=NRSVUE'
    quote: 'sink into the heart of the seas'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'Chittim is Cyprus'
    key: 'bd-chittim'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chittim?lang=eng'
    quote: 'He gave his name to the island of Chittim, now called Cyprus'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'Zidon had been the most important city of Phoenicia'
    key: 'bd-zidon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zidon?lang=eng'
    quote: 'In ancient times it was the most important city of Phoenicia'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'The men of Gebal repair the leaks (the calkers)'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'The elders of Gebal and its skilful men were with thee to repair thy leaks'
  - where: 'note 27:5 “The city as a ship”'
    claim: 'The mariners of verse 8 are rowers'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+27&version=ESV'
    quote: 'were your rowers;'

