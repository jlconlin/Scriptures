    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/27.htm'
    quote: 'see Joel 4:6, from which we learn that the Phoenicians sold prisoners of war to them'
  - where: 'note 27:13 “Slaves among the wares”'
