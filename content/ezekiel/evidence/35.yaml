chapter: 35
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is the twelfth year, tenth month, fifth day (33:21), when word came that Jerusalem had fallen'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten'
  - where: 'when'
    claim: 'The captivity from which the book counts began in 597 B.C., so its twelfth year is about 585 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'

  - where: 'setting'
    claim: 'The second large deportation under Nebuchadnezzar was in 586 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'Chapter 34 promises that the flock will no more bear the shame of the heathen'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'neither bear the shame of the heathen any more'
  - where: 'setting'
    claim: 'Edom is the country of Esau’s descendants in Mount Seir, south of the Dead Sea'
    key: 'bd-edom'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'of their country in Mount Seir (Gen. 32:3; 36:9; Deut. 2:5, 12, 22). This country lay south of the Dead Sea'
  - where: 'setting'
    claim: 'Chapters 25–32 and 35 answer the question whether the other nations were exempt from the Lord’s judgments'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Whoever said that the other nations are exempt from the wrath of the Lord? Chapters 25 to 32 and chapter 35 describe the judgments that would come or had already come upon Ammon, Moab, Edom'
  - where: 'setting'
    claim: 'Psalm 137 remembers what the children of Edom said in the day of Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/137?lang=eng'
    quote: 'the children of Edom in the day of Jerusalem; who said, Rase it, rase it, even to the foundation thereof'
  - where: 'setting'
    claim: 'Obadiah speaks of Edom in the day foreigners entered Jerusalem’s gates'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'and foreigners entered into his gates, and cast lots upon Jerusalem, even thou wast as one of them'
  - where: 'setting'
    claim: 'Chapter 34 promises the flock one shepherd'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'And I will set up one shepherd over them'

  - where: 'thread'
    claim: 'The theme (verses 2–4) is worked out in two strophes that begin at verses 5 and 10, each closing with the formula of knowing the Lord'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'is vindicated and earnestly elaborated in two strophes'
  - where: 'thread'
    claim: 'The Hebrew noun for desolation (shemamah, Strong’s 8077) occurs seven times in chapter 35 (verses 3, 4, 7 twice, 9, 14, 15) of twenty-two in Ezekiel, counted with scripts/hebrew.mjs ezekiel --word 8077; this is the form in verse 3'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שְׁמָמָ֥ה'
  - where: 'thread'
    claim: 'Chapter 36 promises Israel’s mountains that their cities will be inhabited'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'and the cities shall be inhabited, and the wastes shall be builded'

  - where: 'note 35:2 “Why Edom again, and why here”'
    claim: 'Chapter 36 names all Idumea as the enemy who claimed the land, and is addressed to the mountains of Israel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'against all Idumea, which have appointed my land into their possession'
  - where: 'note 35:2 “Why Edom again, and why here”'
    claim: 'Ezekiel 35 and 36:1–15 form one prophecy'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'The two sections, Ezekiel 35:1-15 and Ezekiel 36:1-15, form a connected prophecy'
  - where: 'note 35:2 “Why Edom again, and why here”'
    claim: 'The promise to the mountains of Israel is the counterpart of the threat against Seir'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'as to form the obverse and completion of the latter'

