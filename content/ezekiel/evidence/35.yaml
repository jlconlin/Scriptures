    claim: 'Amos 1:11 is joined to Ezekiel 35:5 as an earlier statement of Edom’s retained enmity'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'was manifested, as Amos (Amos 1:11) has already said, in the constant retention of its malignity toward the covenant nation'
