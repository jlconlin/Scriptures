chapter: 26
claims:
  - where: 'when'
    claim: 'The book counts its dates from Jehoiachin’s captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'The captivity began in about 597 B.C., so its eleventh year is about 586 B.C.'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC'
  - where: 'when'
    claim: 'The city was smitten in the eleventh year of the captivity (the twenty-fifth year is the fourteenth after)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'

  - where: 'setting'
    claim: 'The prophecy on Tyre has four parts: threat, lamentation, threat against the king, lamentation over his fall'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'the second (Ezekiel 27), a lamentation over this destruction; the third (Ezekiel 28:1-10), the threat against the king of Tyre; the fourth (Ezekiel 28:11-19), a lamentation over his fall'
  - where: 'setting'
    claim: 'Chapters 25–32 are prophecies against foreign nations'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'These eight chapters contain prophecies against several foreign nations: Ammon, Moab, Edom, Philistia, Tyre, Sidon, and Egypt.'
  - where: 'setting'
    claim: 'They are like the collections in Isaiah 13–23 and Jeremiah 46–51'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'These chapters in Ezekiel are similar to those in Isaiah and Jeremiah where prophetic burdens are pronounced on certain foreign nations (see Isaiah 13–23; Jeremiah 46–51).'
  - where: 'setting'
    claim: 'Tyre was a commercial seaport allied with David and Solomon'
    key: 'bd-tyre'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng'
    quote: 'an important commercial and seaport town of Syria, in alliance with David (2 Sam. 5:11; 1 Chr. 14:1); with Solomon'
  - where: 'setting'
    claim: 'Tyre was in two parts, mainland and island'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/26.htm'
    quote: 'As there were two places called Tyre, one on the main land, and the other on a rock in the sea, opposite to that on the main land'
  - where: 'setting'
    claim: 'Jeremiah was told to send yokes to the king of Tyrus by the messengers who came to Zedekiah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'and to the king of Tyrus, and to the king of Zidon, by the hand of the messengers which come to Jerusalem unto Zedekiah king of Judah'

  - where: 'thread'
    claim: 'The chapter has four sections, each beginning “thus saith the Lord”'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'In four sections, commencing with the formula, "thus saith the Lord," Tyre, the mistress of the sea, is threatened with destruction.'
  - where: 'thread'
    claim: 'The comparison of the army to waves suits Tyre’s situation'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'The comparison of the advancing army to the advancing waves of the sea is very significant when the situation of Tyre is considered.'

  - where: 'section 2 plain'
    claim: '“Buckler” is a shield (the Church’s footnote 8a)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'OR shield.'
  - where: 'section 1 plain'
    claim: '“Replenished” is “filled”'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'to be filled with merchandise and wealth, as in Ezekiel 27:25'

  - where: 'note 26:1 “A date with no month”'
    claim: 'Jerusalem was besieged until the eleventh year of Zedekiah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'So the city was besieged unto the eleventh year of king Zedekiah.'
  - where: 'note 26:1 “A date with no month”'
    claim: 'The city was broken up in the fourth month'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'And in the fourth month, in the ninth day of the month, the famine was sore in the city'
  - where: 'note 26:1 “A date with no month”'
    claim: 'The temple was burned in the fifth month'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'Now in the fifth month, in the tenth day of the month'
  - where: 'note 26:1 “A date with no month”'
    claim: 'Ezekiel’s twenty-fifth year of the captivity is the fourteenth after the city was smitten, so the eleventh year is the year of the fall'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'
  - where: 'note 26:1 “A date with no month”'
    claim: 'Word of the fall reached Ezekiel in the twelfth year, tenth month, fifth day'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten.'
  - where: 'note 26:1 “A date with no month”'
    claim: 'The NRSVUE reads the twelfth year, eleventh month'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=NRSVUE'
    quote: 'In the twelfth year, in the eleventh month, on the first day of the month, the word of the Lord came to me'
  - where: 'note 26:1 “A date with no month”'
    claim: 'The NRSVUE follows a Greek manuscript; the Hebrew has the eleventh year'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=NRSVUE'
    quote: 'Gk ms: Heb eleventh year'
  - where: 'note 26:1 “A date with no month”'
    claim: 'The NIV reads the same and calls it the probable original reading'
    key: 'niv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=NIV'
    quote: 'Probable reading of the original Hebrew text; Masoretic Text does not have month of the twelfth.'
  - where: 'note 26:1 “A date with no month”'
    claim: 'Brenton’s Septuagint has the same date as the Hebrew'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/26.htm'
    quote: 'And it came to pass in the eleventh year, on the first day of the month, that the word of the Lord came to me'
  - where: 'note 26:1 “A date with no month”'
    claim: 'The Hebrew of 26:1 has the year, “on the first” and “of the month,” with no number for the month'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שָׁנָ֖ה'

  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: '“Aha” expressed malicious joy; the manual joins 25:3 and 26:2'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Aha was used as an expression of malicious joy. Because the Ammonites rejoiced when Judah fell and the temple was profaned'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'Ammon said “Aha” against the sanctuary'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/25?lang=eng'
    quote: 'Because thou saidst, Aha, against my sanctuary, when it was profaned'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'The Hebrew word is daltot, “doors” (H1817), plural'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'דַּלְת֥וֹת'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'The word is the swinging door of a gate'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1817.htm'
    quote: 'which denotes the whole structure of gate, including posts, open space, etc., while ׳ד is swinging door'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'BDB lists 26:2 as a figure of Jerusalem as gate of people'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1817.htm'
    quote: 'of Jerusalem as gate of people Ezekiel 26:2'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'ESV rendering of verse 2'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=ESV'
    quote: 'Aha, the gate of the peoples is broken; it has swung open to me. I shall be replenished, now that she is laid waste'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: '“Replenished” is to be filled with merchandise and wealth, as in 27:25'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'to be filled with merchandise and wealth, as in Ezekiel 27:25'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: '27:25 uses “replenished” of Tyre'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'thou wast replenished, and made very glorious in the midst of the seas'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'Jerusalem as a centre of trade'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/26.htm'
    quote: 'She is broken that was the gates of the people - Jerusalem, a general emporium.'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'The caravans will no longer stop at Jerusalem’s market'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/26.htm'
    quote: 'The caravans from Palmyra, Petra, and the East will no longer be intercepted by the market ("the gates") of Jerusalem, but will come to me.'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'Keil objects that Jerusalem was never Tyre’s commercial rival'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'But nothing is known to warrant the idea that Jerusalem was ever able to enter into rivalry with Tyre as a commercial city.'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'Jerusalem’s importance to the nations lay in its sanctuary'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'but in its sanctuary, or the sacred calling which it had received for the whole world of nations'
  - where: 'note 26:2 “Why Tyre said “Aha””'
    claim: 'Tyre resented Jerusalem’s attraction upon the nations'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'the force of attraction which Jerusalem had hitherto exerted upon the nations, as the seat of the divine revelation of mercy'

  - where: 'note 26:4 “The city called Rock, scraped bare”'
    claim: 'Tyre means “Rock”'
    key: 'bd-tyre'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng'
    quote: 'Rock. “The strong city” (Josh. 19:29)'
  - where: 'note 26:4 “The city called Rock, scraped bare”'
    claim: 'The phrase is tsechiach sela, a smooth, bare rock; it occurs in Ezek. 24:7, 8 and 26:4, 14'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6706.htm'
    quote: 'shining, glaring, surface construct צְחִיחַ סֶלַע i.e. a smooth, bare, rock Ezekiel 24:7,8; Ezekiel 26:4,14'
  - where: 'note 26:4 “The city called Rock, scraped bare”'
    claim: 'The noun for rock in 26:4 is sela (H5553)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'סָֽלַע'
  - where: 'note 26:4 “The city called Rock, scraped bare”'
    claim: 'The name Tyre is Tsor (H6865)'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6865.htm'
    quote: 'Tyre, famous Phoenician city'
  - where: 'note 26:4 “The city called Rock, scraped bare”'
    claim: 'ESV has “a bare rock”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=ESV'
    quote: 'I will scrape her soil from her and (H)make her a bare rock'
  - where: 'note 26:4 “The city called Rock, scraped bare”'
    claim: 'The same phrase is used of Jerusalem’s blood in 24:8'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'I have set her blood upon the top of a rock, that it should not be covered.'

  - where: 'note 26:7 “Nebuchadrezzar, king of kings”'
    claim: 'Nebuchadnezzar was the great king of Babylon; his reign'
    key: 'bd-nebuchadnezzar'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng'
    quote: 'The great king of Babylon (604–561 B.C.)'
  - where: 'note 26:7 “Nebuchadrezzar, king of kings”'
    claim: 'He besieged and took Jerusalem'
    key: 'bd-nebuchadnezzar'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng'
    quote: 'besieges Jerusalem (24:10–11) and takes it, carrying away the king and people'
  - where: 'note 26:7 “Nebuchadrezzar, king of kings”'
    claim: 'The Hebrew spelling in Ezekiel is Nebuchadrezzar throughout'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=ESV'
    quote: 'Hebrew Nebuchadrezzar; so throughout Ezekiel'
  - where: 'note 26:7 “Nebuchadrezzar, king of kings”'
    claim: 'The name occurs in Ezekiel at 26:7, 29:18, 29:19 and 30:10 only (scripts/occurrences.mjs ezekiel "Nebuchadrezzar"; “Nebuchadnezzar” does not occur)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'Behold, I will bring upon Tyrus Nebuchadrezzar king of Babylon, a king of kings, from the north'
  - where: 'note 26:7 “Nebuchadrezzar, king of kings”'
    claim: 'Daniel calls Nebuchadnezzar a king of kings, because the God of heaven gave him a kingdom'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'Thou, O king, art a king of kings: for the God of heaven hath given thee a kingdom, power, and strength, and glory.'
  - where: 'note 26:7 “Nebuchadrezzar, king of kings”'
    claim: 'The message of Jeremiah 27 was sent to the king of Tyrus among others'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'and to the king of Tyrus, and to the king of Zidon, by the hand of the messengers which come to Jerusalem unto Zedekiah king of Judah'

  - where: 'note 26:8 “Siege works against an island”'
    claim: 'The daughters are the towns dependent on Tyre in the open country'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: '"Her daughters" also, that is to say, the towns dependent upon Tyre, "on the field," i.e., the open country'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'ESV: daughters on the mainland; a roof of shields; battering rams'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=ESV'
    quote: 'your daughters on the mainland. (P)He will set up a siege wall against you and throw up a mound against you, and raise (Q)a roof of shields against you. 9 (R)He will direct the shock of his battering rams against your walls'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'ESV at verse 6: her daughters on the mainland'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=ESV'
    quote: 'and her daughters on the mainland shall be killed by the sword'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'NRSVUE: daughter towns inland; a ramp'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=NRSVUE'
    quote: 'and its daughter towns inland'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'NRSVUE: the mount is a ramp'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2026&version=NRSVUE'
    quote: 'cast up a ramp against you'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'The shield-roof protected the besiegers at their work'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'signifies the construction of a roof with shields, by which the besiegers were accustomed to defend themselves from the missiles of the defenders of the city wall'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'The Church’s footnote gives “battering rams” for “engines of war”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'OR battering rams.'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'Clarke: these works could act only against the mainland city'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/26.htm'
    quote: 'This seems to be spoken of Palaetyre, or Tyre on the main land; for forts, mounts, engines of war, horses, and chariots could not be brought to act against the other.'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'Keil: verse 10 means the island will be entered like a land fortress, by an embankment'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/26.htm'
    quote: 'It means that the enemy will enter it as they march into a land-fortress into which a breach has been made by force. The words presuppose that the besieger has made a road to the city by throwing up an embankment or dam.'
  - where: 'note 26:8 “Siege works against an island”'
    claim: 'The two places were one city'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/26.htm'
    quote: 'The two formed only one city, and one state.'

  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'The word of 29:17–18 is dated to the twenty-seventh year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'And it came to pass in the seven and twentieth year, in the first month, in the first day of the month'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'Nebuchadrezzar had no wages for his service against Tyre'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'caused his army to serve a great service against Tyrus: every head was made bald, and every shoulder was peeled: yet had he no wages, nor his army, for Tyrus'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'The siege has been reckoned at thirteen years'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/26.htm'
    quote: 'which was taken by Nebuchadnezzar after an arduous siege of thirteen years'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'He took the mainland city but not the island; the shore city was not rebuilt'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Nebuchadnezzar conquered the mainland city but was unable to subdue all of Tyre because of its strategic position on the island. After a few decades Tyre regained her wealth and splendor, though the ruined city on the shore was not rebuilt'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'The change from “he” to “they” at verse 12'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/26.htm'
    quote: 'The change in this verse from the individual conqueror "he," to the general "they," marks that what he did was not the whole, but only paved the way for others to complete the work begun by him.'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'Clarke doubts whether “many nations” does not mean nations in successive ages'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/26.htm'
    quote: 'but I doubt whether this may not refer to the different nations which in successive ages fought against Tyre'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'The manual: these details appeared unfulfilled for nearly three hundred years'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'For nearly three hundred years these prophecies appeared to be inaccurate.'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'Alexander besieged the island in 332 B.C.'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Then in 332 B.C., Alexander the Great swept out of the northern Mediterranean world.'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'The siege was difficult because the city lay on an island'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'he laid siege to Tyre—a difficult task since the city lay on an island a half mile off the shore'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'Alexander built the causeway from the ruins of old Tyre'
    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/26.htm'
    quote: 'he actually took the timbers, stones, rubbish, etc. of old Tyre, and filled up the space between it and new Tyre, and thus connected the latter with the main land'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'The manual prints Hastings: Tyre ceased to be an island'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Tyre ceased to be an island, and henceforth was permanently joined to the mainland.'
  - where: 'note 26:14 “How the prophecy was fulfilled”'
    claim: 'Tyre supplied material for the temple of Zerubbabel, after the exile'
    key: 'bd-tyre'
