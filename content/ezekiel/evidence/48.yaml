chapter: 48
claims:
  - where: 'when'
    claim: 'The vision of chapters 40–48 is dated to the twenty-fifth year of the captivity, the fourteenth year after the city was smitten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'in the fourteenth year after that the city was smitten'
  - where: 'when'
    claim: 'Ezekiel’s ministry is dated 592–570 B.C., so the twenty-fifth year of the captivity, counted from the fifth year in 592, is about 572 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'

  - where: 'setting'
    claim: 'Chapters 40–48 are the fourth division of the book, on the temple and its worship'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(4) 40–48, visions of the reconstruction of the temple and its worship'
  - where: 'setting'
    claim: 'Chapters 47–48 together give Israel the land of promise as a permanent inheritance'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Israel will receive the land of promise as their permanent inheritance (Ezekiel 47–48).'
  - where: 'setting'
    claim: 'The holy portion was first described in chapter 45'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'ye shall offer an oblation unto the LORD, an holy portion of the land'

  - where: 'thread'
    claim: 'Seven tribes are placed north of the central band and five south of it'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'seven tribes receiving their hereditary portions to the north of the heave and five to the south'
  - where: 'thread'
    claim: 'The book opens with the glory of the Lord seen among the captives by the river Chebar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'as I was among the captives by the river of Chebar'

  - where: 'section 3 plain'
    claim: '“Profane” in verse 15 is “common” (footnote 15a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'OR common.'

  - where: 'note 48:1 “Twelve strips across the land”'
    claim: 'The land is divided in strips running from the Mediterranean to the Jordan and the Dead Sea, one for each tribe, with a strip out of the middle'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'the Holy Land will be divided in strips running between the Mediterranean Sea on the west and the Dead Sea and the Jordan River on the east'
  - where: 'note 48:1 “Twelve strips across the land”'
    claim: 'Unlike Joshua’s division, every portion runs the whole breadth of the land'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'all the tribe-portions were to extend uniformly across the entire breadth of the land from the eastern boundary to the Mediterranean Sea on the west, so that they were to form parallel tracts of country'
  - where: 'note 48:1 “Twelve strips across the land”'
    claim: 'Under Joshua several territories covered only half the breadth of the land'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'several of the tribe-territories covered only half the breadth of the land'
  - where: 'note 48:1 “Twelve strips across the land”'
    claim: 'Two and a half tribes had formerly lived east of the Jordan; now all twelve are west of it, and Gad is brought over'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'Gad, which had to be brought over from Gilead to Canaan'
  - where: 'note 48:1 “Twelve strips across the land”'
    claim: 'No single principle explains the order of the tribes'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'In the order of the several tribe-territories it is impossible to discover any universal principle of arrangement.'
  - where: 'note 48:1 “Twelve strips across the land”'
    claim: 'Dan is placed on the northern border because part of the tribe had moved north in the time of the Judges and Dan became the name of the land’s northern limit'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'a portion of the Danites had migrated to the north, conquered the city of Laish, and given it the name of Dan, so that from that time forward Dan is generally named as the northern boundary of the land'
  - where: 'note 48:1 “Twelve strips across the land”'
    claim: 'The central band lies between Judah and Benjamin probably because Jerusalem had stood on the border of those two tribes'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'is probably connected with the circumstance that Jerusalem formerly stood on the boundary of these two tribes'
  - where: 'note 48:1 “Twelve strips across the land”'
    claim: 'The tribes inherit equally, and Joseph has two portions (47:13–14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/47?lang=eng'
    quote: 'And ye shall inherit it, one as well as another'

  - where: 'note 48:8 “An offering made of land”'
    claim: 'The oblation of land is commanded at 45:1, with the dividing of the land by lot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'ye shall offer an oblation unto the LORD, an holy portion of the land'
  - where: 'note 48:8 “An offering made of land”'
    claim: '“Profane” in verse 15 is “common” (footnote 15a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'OR common.'
  - where: 'note 48:8 “An offering made of land”'
    claim: 'The Hebrew of verse 8 gives the number and then “breadth,” with no unit of measure (scripts/hebrew.mjs ezekiel 48:8: five, and twenty, thousand, breadth)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'רֹ֗חַב'
  - where: 'note 48:8 “An offering made of land”'
    claim: 'A modern translation supplies cubits in verse 8'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2048&version=ESV'
    quote: 'the portion which you shall set apart, 25,000 cubits in breadth'
  - where: 'note 48:8 “An offering made of land”'
    claim: 'Reckoned in cubits, twenty-five thousand is about eight miles'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2048&version=NIV'
    quote: 'That is, about 8 miles or about 13 kilometers; also in verses 9, 10, 13, 15, 20 and 21'
  - where: 'note 48:8 “An offering made of land”'
    claim: 'The reed of the vision is six cubits long (40:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'a measuring reed of six cubits long by the cubit and an hand breadth'

  - where: 'note 48:15 “Suburbs: open land around the city”'
    claim: 'The Hebrew word is migrash (Strong’s 4054) (scripts/hebrew.mjs ezekiel 48:15)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'לְ/מִגְרָ֑שׁ'
  - where: 'note 48:15 “Suburbs: open land around the city”'
    claim: 'Migrash is common or open land, perhaps at first pasture, usually attached to a town'
    key: bdb
    url: 'https://biblehub.com/hebrew/4054.htm'
    quote: 'common, common-land, open land (perhaps originally pasture-land, as place of [cattle] driving)'
  - where: 'note 48:15 “Suburbs: open land around the city”'
    claim: 'The word is used especially of the land around the Levites’ cities, and here of the lands around the holy city'
    key: bdb
    url: 'https://biblehub.com/hebrew/4054.htm'
    quote: 'especially as surrounding Levitical cities Numbers 35:2,3,4,5,7'
  - where: 'note 48:15 “Suburbs: open land around the city”'
    claim: 'The lexicon lists verses 15 and 17 as the lands surrounding the holy city'
    key: bdb
    url: 'https://biblehub.com/hebrew/4054.htm'
    quote: 'lands surrounding the holy city Ezekiel 48:15,17'
  - where: 'note 48:15 “Suburbs: open land around the city”'
    claim: 'The Church’s footnote on “suburbs” points to the Levites’ cities in Numbers 35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'Num. 35:2 (1–5); Ezek. 45:2'
  - where: 'note 48:15 “Suburbs: open land around the city”'
    claim: 'Those who serve the city are its workers, who till the land beside it'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2048&version=ESV'
    quote: 'And the workers of the city, from all the tribes of Israel, shall till it.'
  - where: 'note 48:15 “Suburbs: open land around the city”'
    claim: 'The possession of the city is for the whole house of Israel (45:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'it shall be for the whole house of Israel'

  - where: 'note 48:21 “Land for the prince”'
    claim: 'The prince’s portion on both sides of the oblation is first given at 45:7, and 45:8 joins it to the end of the princes’ oppression'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'In the land shall be his possession in Israel: and my princes shall no more oppress my people'
  - where: 'note 48:21 “Land for the prince”'
    claim: 'The prince may not take the people’s inheritance and gives his sons land from his own (46:18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/46?lang=eng'
    quote: 'the prince shall not take of the people’s inheritance by oppression'

  - where: 'note 48:31 “Twelve gates, with Levi and Joseph among them”'
    claim: 'At the gates Levi is counted and Ephraim and Manasseh are one tribe, Joseph'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'Levi is included here, and consequently Ephraim and Manasseh are united in the one tribe of Joseph.'
  - where: 'note 48:31 “Twelve gates, with Levi and Joseph among them”'
    claim: 'In the land Joseph has two portions (47:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/47?lang=eng'
    quote: 'Joseph shall have two portions'
  - where: 'note 48:31 “Twelve gates, with Levi and Joseph among them”'
    claim: 'The northern gates are three sons of Leah, who also stand first in the blessing of Moses'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'The three sons of Leah commence the series with the northern gates. They also stand first in the blessing of Moses in Deuteronomy 33:6-8'
  - where: 'note 48:31 “Twelve gates, with Levi and Joseph among them”'
    claim: 'East: Rachel’s two sons and the elder son of her maid; south: Leah’s other three; west: the other three sons of the maids'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'for the southern gates, the three other sons of Leah; and lastly, for the western gates, the three other sons of the maids'
  - where: 'note 48:31 “Twelve gates, with Levi and Joseph among them”'
    claim: 'The gates’ names mark the city as the city of all Israel'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'Being thus indicated by the names of its gates as the city of all Israel'
  - where: 'note 48:31 “Twelve gates, with Levi and Joseph among them”'
    claim: 'The Church’s footnote on “gates” joins the verse to Revelation 21:12–13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'Rev. 21:12 (12–13)'

  - where: 'note 48:35 “The city’s new name”'
    claim: 'The name is two Hebrew words, the divine name (Strong’s 3068) and shammah (Strong’s 8033) (scripts/hebrew.mjs ezekiel 48:35)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'יְהוָ֥ה'
  - where: 'note 48:35 “The city’s new name”'
    claim: 'The name is given in English as Jehovah-shammah, and the city is taken to be Jerusalem'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Jerusalem will then be called the Lord is there (Jehovah-shammah; see Ezekiel 48:35)'
  - where: 'note 48:35 “The city’s new name”'
    claim: '“Jerusalem” (Strong’s 3389) occurs in 26 verses of Ezekiel, the last of them 36:38, and not in chapters 40–48 (scripts/hebrew.mjs ezekiel --word 3389)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'יְרוּשָׁלִַ֨ם֙'
  - where: 'note 48:35 “The city’s new name”'
    claim: 'The vision ends with Jerusalem receiving a new name'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'his temple vision concludes with the city of Jerusalem receiving the comforting new name of “The LORD is there” (Ezekiel 48:35)'
  - where: 'note 48:35 “The city’s new name”'
    claim: 'The Joseph Smith Translation of the verse (footnote 35a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'and the name of the city from that day shall be called, Holy; for the Lord shall be there'

  - where: 'christ'
    claim: 'The glory of the Lord returns to the house by the east gate and fills it (43:4–5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'the glory of the LORD filled the house'
  - where: 'christ'
    claim: '“From that day” means from then on'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/48.htm'
    quote: 'from day forward, equivalent to henceforward'
  - where: 'christ'
    claim: 'The vision of the temple in chapters 40–48 came soon after the prophecy of a sanctuary in 37:26–28'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Soon after this vision, Ezekiel received a detailed vision of what the new temple in Jerusalem would be like (see Ezekiel 40–48).'
  - where: 'christ'
    claim: 'The temple is a symbol to Israel that the Lord is with His people'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'The temple will be built as a symbol to Israel that the Lord is with His people.'
  - where: 'christ'
    claim: 'The Church’s footnote to the Joseph Smith Translation of verse 35 points to Revelation 21:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'for the Lord shall be there. Rev. 21:3.'

  - where: 'explore'
    claim: 'The Church’s footnote on “Dan” in verse 1 points to the camp of Israel in Numbers 2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'Num. 2:25 (25–31)'
  - where: 'explore'
    claim: 'The Church’s footnote on “Ephraim” in verse 5 points to Ether 13:5–12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/48?lang=eng'
    quote: 'Ether 13:6 (5–12)'
  - where: 'explore'
    claim: 'John’s city has twelve gates with the tribes’ names (Rev. 21:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/21?lang=eng'
    quote: 'names written thereon, which are the names of the twelve tribes of the children of Israel'
  - where: 'explore'
    claim: 'Ether says the Jerusalem Lehi left would be built up again, a holy city unto the Lord (Ether 13:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/13?lang=eng'
    quote: 'it should be built up again, a holy city unto the Lord'
