chapter: 36
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is 33:21, the twelfth year, tenth month, when word came that the city had fallen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year), so the twelfth year is about 585'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The next date in the book is the twenty-fifth year (40:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'in the fourteenth year after that the city was smitten'

  - where: 'setting'
    claim: 'A survivor reached Ezekiel with the news that Jerusalem had fallen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'one that had escaped out of Jerusalem came unto me, saying, The city is smitten'
  - where: 'setting'
    claim: 'Chapters 33–39 are the book’s prophecies of restoration'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(3) 33–39, prophecies of restoration'
  - where: 'setting'
    claim: 'Chapter 35 is spoken against mount Seir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/35?lang=eng'
    quote: 'set thy face against mount Seir, and prophesy against it'
  - where: 'setting'
    claim: 'Mount Seir was the country of Edom'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'of their country in Mount Seir'
  - where: 'setting'
    claim: 'In chapter 6 the mountains of Israel were told their high places would be destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'I will destroy your high places'

  - where: 'thread'
    claim: 'The promise to the land can be kept only if the cause of stumbling is removed, by cleansing and a new heart'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'But this can only be done by His removing the occasion to stumble or sin'

  - where: 'section 1 plain'
    claim: 'Verse 3, “taken up in the lips of talkers, and are an infamy of the people”: the land became the object of talk and slander'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'an object of gossip and slander among the people'
  - where: 'section 5 plain'
    claim: 'Verse 29, “call for the corn”: the Hebrew is “summon the grain”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'HEB summon the grain'

  - where: 'note 36:2 “The enemy on the ancient heights”'
    claim: 'Idumea in verse 5 is Edom in the Hebrew (the Church’s footnote 5b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'HEB Edom'
  - where: 'note 36:2 “The enemy on the ancient heights”'
    claim: 'Idumea is Edom'
    key: bd-idumea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/idumea?lang=eng'
    quote: 'Edom. Isa. 34:5–6; Ezek. 35:15; 36:5'
  - where: 'note 36:2 “The enemy on the ancient heights”'
    claim: 'Edom’s boast and its words against the mountains of Israel are quoted in chapter 35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/35?lang=eng'
    quote: 'They are laid desolate, they are given us to consume'
  - where: 'note 36:2 “The enemy on the ancient heights”'
    claim: '“Ancient high places” is rendered “ancient heights,” the hill country'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'The ancient heights have become our possession'

  - where: 'note 36:8 “How near the promise is”'
    claim: 'Modern translations take the clause of the people, who will soon come home'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=ESV'
    quote: 'they will soon come home'
  - where: 'note 36:8 “How near the promise is”'
    claim: 'The New Revised Standard Version Updated Edition reads the clause the same way'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'for they shall soon come home'
  - where: 'note 36:8 “How near the promise is”'
    claim: 'Keil takes the promised blessings, not the people, as what is “at hand”'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'The promised blessings are the subject, or the branches and fruits, which the mountains are to bear'
  - where: 'note 36:8 “How near the promise is”'
    claim: 'The return from Babylon was a small beginning of the fulfillment'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'This promise was no doubt fulfilled in certain weak beginnings after the return of a portion of the people under Zerubbabel and Ezra'
  - where: 'note 36:8 “How near the promise is”'
    claim: 'Those who returned stayed under foreign rule and still bore the nations’ contempt'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'not only continued under the rule of the heathen, but had also in various ways to bear the contempt of the heathen still'
  - where: 'note 36:8 “How near the promise is”'
    claim: 'Verse 10 means all the house of Israel, not only Judah'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Those men who will multiply upon the land are from all the house of Israel, not just the kingdom of Judah'
  - where: 'note 36:8 “How near the promise is”'
    claim: 'The Student Manual: only verses 16–22 do not deal with the last days'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'do not deal with the last days are those that explain why the Lord scattered Israel (see vv. 16–22)'
  - where: 'note 36:8 “How near the promise is”'
    claim: 'The Student Manual: the promises are not yet fully fulfilled and are being fulfilled now'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'None of the following events have fully transpired, though today is the day when these prophecies are being fulfilled'
  - where: 'note 36:8 “How near the promise is”'
    claim: 'The Church’s chapter heading places the gathering in the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'In the last days, all the house of Israel will be gathered to their own lands'

  - where: 'note 36:13 “The land that eats its people”'
    claim: 'The spies said the same of Canaan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'is a land that eateth up the inhabitants thereof'
  - where: 'note 36:13 “The land that eats its people”'
    claim: 'Ezekiel has been read as referring to the spies’ report'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'That the land devours its inhabitants, is what the spies say of the land of Canaan in Numbers 13:32'
  - where: 'note 36:13 “The land that eats its people”'
    claim: 'The nations blamed on the land what the judgments had done'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'These judgments had depopulated the land; and this fact was attributed by the heathen in their own way to the land'
  - where: 'note 36:13 “The land that eats its people”'
    claim: 'The people were devoured by the consequences of their sins'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/35.htm'
    quote: 'the people are devoured by the consequences of their sins'

  - where: 'note 36:17 “The uncleanness of a removed woman”'
    claim: 'The Hebrew is niddah, used especially of menstruation; the lexicon compares this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: 'especially of menstruation'
  - where: 'note 36:17 “The uncleanness of a removed woman”'
    claim: 'A modern translation of the comparison'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'like the uncleanness of a menstrual period'
  - where: 'note 36:17 “The uncleanness of a removed woman”'
    claim: 'The same word names the “water of separation” of Numbers 19, water that removes impurity'
    key: bdb
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: 'water of impurity (i.e. to remove it, compare Di) Numbers 19:9,13,20,21'
  - where: 'note 36:17 “The uncleanness of a removed woman”'
    claim: 'The Church’s footnote on “defiled” points to Leviticus 18:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'Lev. 18:25; 2 Ne. 13:8; 25:14'
  - where: 'note 36:17 “The uncleanness of a removed woman”'
    claim: 'Ezekiel was a priest'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'A priest of the family of Zadok'

  - where: 'note 36:20 “How the exile profaned the name”'
    claim: 'The nations who saw Israel scattered assumed the Lord had abandoned or failed them'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'Many of these people saw that the Israelites were scattered and assumed that the Lord had abandoned or failed them'
  - where: 'note 36:20 “How the exile profaned the name”'
    claim: 'A modern translation of the nations’ words'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=ESV'
    quote: 'and yet they had to go out of his land'
  - where: 'note 36:20 “How the exile profaned the name”'
    claim: 'The verb is used of profaning the name of God, in Leviticus and in each of verses 20–23'
    key: bdb
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'the name of God Leviticus 18:21; Leviticus 19:12; Leviticus 20:3; Leviticus 21:6; Leviticus 22:2,32 (all H), Amos 2:7; Jeremiah 34:16; Ezekiel 20:39; Ezekiel 36:20,21,22,23'
  - where: 'note 36:20 “How the exile profaned the name”'
    claim: 'The Joseph Smith Translation reads “out of this land” (footnote 20b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'out of this land'
  - where: 'note 36:20 “How the exile profaned the name”'
    claim: '“Pity” in verse 21 is “concern” in the Hebrew (footnote 21a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'HEB concern'
  - where: 'note 36:20 “How the exile profaned the name”'
    claim: 'A modern translation has “concern” in verse 21'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'But I had concern for my holy name'

  - where: 'note 36:23 “Not for your sakes”'
    claim: 'To sanctify the name is to vindicate its holiness'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=ESV'
    quote: 'And I will vindicate the holiness of my great name'
  - where: 'note 36:23 “Not for your sakes”'
    claim: '“Sanctified in you before their eyes” is the Lord’s holiness displayed through Israel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'when through you I display my holiness before their eyes'
  - where: 'note 36:23 “Not for your sakes”'
    claim: 'The same construction (sanctified in someone, before the eyes of others) is at 20:41, 28:25, 38:16 and 39:27'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'Ezekiel 20:41; Ezekiel 28:25; Ezekiel 36:23; Ezekiel 38:16; Ezekiel 39:27'
  - where: 'note 36:23 “Not for your sakes”'
    claim: 'The Church’s footnote on “sakes” points to Deuteronomy 9:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'Deut. 9:5'
  - where: 'note 36:23 “Not for your sakes”'
    claim: 'The recovery is for the Lord’s reasons, not because Israel has earned it'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'will be done for the Lord’s reasons, not because Israel has earned it'

  - where: 'note 36:25 “Clean water”'
    claim: 'The lexicon lists this verse under sprinkling water for purification'
    key: bdb
    url: 'https://biblehub.com/hebrew/2236.htm'
    quote: 'water for purification'
  - where: 'note 36:25 “Clean water”'
    claim: 'The water of Numbers 19 was made with the ashes of the heifer and running water, and was called the water of separation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'they shall take of the ashes of the burnt heifer of purification for sin, and running water shall be put thereto in a vessel'
  - where: 'note 36:25 “Clean water”'
    claim: 'The figure is taken from the law’s purifications, especially the sprinkling of Numbers 19; Psalm 51 is compared'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/36.htm'
    quote: 'is taken from the lustrations prescribed by the law, more particularly the purifying from defilement from the dead by sprinkling with the water prepared from the ashes of a red heifer (Numbers 19:17-19; compare Psalm 51:9)'
  - where: 'note 36:25 “Clean water”'
    claim: 'Hebrews 10:22 and Ezekiel 36:25 are cited together for the requirement of “pure water” in baptism and other cleansing rites, and for Mosiah 18:5'
    key: sc-knowhy-320
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-practice-baptism'
    quote: 'baptism and other rituals for cleansing were required to be done with “pure water” (see Hebrews 10:22; cf. Ezekiel 36:25), which is likely why Mosiah 18:5 specifies this aspect of the waters of Mormon'

  - where: 'note 36:26 “A new heart”'
    claim: 'The heart in scripture is a symbol of the mind and will'
    key: gs-heart
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/heart?lang=eng'
    quote: 'A symbol of the mind and will of man and the figurative source of all emotions and feelings'
  - where: 'note 36:26 “A new heart”'
    claim: 'The promise is first made at 11:19 and commanded at 18:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/18?lang=eng'
    quote: 'make you a new heart and a new spirit'
  - where: 'note 36:26 “A new heart”'
    claim: 'The Church’s footnote at 2 Corinthians 3:3 joins Paul’s “fleshy tables of the heart” to Ezekiel 11:19–20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/3?lang=eng'
    quote: 'Ezek. 11:19 (19–20)'
  - where: 'note 36:26 “A new heart”'
    claim: 'Elder Christofferson, citing Jeremiah 31:33 and Ezekiel 11:19–20, describes the promise as conversion and gives King Benjamin’s people (Mosiah 5:2) as the example'
    key: christofferson-converted
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2004/04/when-thou-art-converted?lang=eng'
    quote: 'Ezekiel said conversion is like the Lord taking away our “stony heart” and giving us a heart that loves Him and His gospel (see Ezekiel 11:19–20). Surely this is what happened to the people of King Benjamin'
  - where: 'note 36:26 “A new heart”'
    claim: 'Verses 25–28 are among Ezekiel’s promises that Israel will return to the covenant and be converted to the gospel'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Israel will return to the covenant and experience an eventual conversion to the gospel'

  - where: 'note 36:26 “A change of heart that has to be kept”'
    claim: 'Elder Renlund quotes verse 26 as the Lord’s explanation of the change of heart'
    key: renlund-mighty-change
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/10/preserving-the-hearts-mighty-change?lang=eng'
    quote: 'The Lord explained the operation that we all need'
  - where: 'note 36:26 “A change of heart that has to be kept”'
    claim: 'Transgression leaves the heart diseased and hardened; the change comes through the Atonement and obedience to laws and ordinances'
    key: renlund-mighty-change
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/10/preserving-the-hearts-mighty-change?lang=eng'
    quote: 'Through the Atonement of Christ and by obedience to the laws and ordinances of the gospel, we undergo this ultimate operation, this spiritual change of heart'
  - where: 'note 36:26 “A change of heart that has to be kept”'
    claim: 'The hearts are described as diseased and hardened'
    key: renlund-mighty-change
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/10/preserving-the-hearts-mighty-change?lang=eng'
    quote: 'our spiritual hearts have become diseased and hardened'
  - where: 'note 36:26 “A change of heart that has to be kept”'
    claim: 'The change is a beginning; repentance, baptism and confirmation are necessary but not sufficient'
    key: renlund-mighty-change
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/10/preserving-the-hearts-mighty-change?lang=eng'
    quote: 'this mighty change of our spiritual hearts is just the beginning. Repentance, baptism, and confirmation are necessary but not sufficient'
  - where: 'note 36:26 “A change of heart that has to be kept”'
    claim: 'The natural man tends to reject the changed heart and let it harden'
    key: renlund-mighty-change
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/10/preserving-the-hearts-mighty-change?lang=eng'
    quote: 'the tendency of the natural man is to reject the spiritually changed heart and allow it to harden'

  - where: 'note 36:27 “My spirit within you”'
    claim: 'Chapter 11 promised “a new spirit” and did not say “my spirit”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'I will put a new spirit within you'
  - where: 'note 36:27 “My spirit within you”'
    claim: 'A modern translation of “cause you to walk in my statutes”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'make you follow my statutes'
  - where: 'note 36:27 “My spirit within you”'
    claim: 'The Student Manual: verses 26–27 are conversion to the Lord and receiving His Spirit'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'They are to be converted to the Lord and receive His Spirit'

  - where: 'note 36:31 “Remembering after the blessing”'
    claim: 'The same sentence about loathing follows the gathering in chapter 20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'ye shall lothe yourselves in your own sight for all your evils that ye have committed'
  - where: 'note 36:31 “Remembering after the blessing”'
    claim: 'In chapter 16 the shame comes when the Lord is pacified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/16?lang=eng'
    quote: 'when I am pacified toward thee for all that thou hast done'

  - where: 'note 36:37 “The Lord will be asked again”'
    claim: 'The verb form means to let oneself be inquired of, is used only of God, and occurs in Ezekiel at 14:3, 20:3, 20:31 and 36:37'
    key: bdb
    url: 'https://biblehub.com/hebrew/1875.htm'
    quote: 'let oneself be inquired of, consulted, only of God Ezekiel 14:3 (twice in verse); Ezekiel 20:3,31,31; Ezekiel 36:37; Isaiah 65:1'
  - where: 'note 36:37 “The Lord will be asked again”'
    claim: 'A modern translation of the clause'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'I will also let the house of Israel ask me to do this for them'
  - where: 'note 36:37 “The Lord will be asked again”'
    claim: 'The Church’s footnote on “inquired” points to Jeremiah 29:13 and Ezekiel 14:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'Ps. 102:17; Jer. 29:13; Ezek. 14:3; 3 Ne. 13:8'

  - where: 'note 36:38 “Flocks for the feasts”'
    claim: '“Holy flock” is “flock for sacrifices” in the Hebrew (footnote 38a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'HEB flock for sacrifices'
  - where: 'note 36:38 “Flocks for the feasts”'
    claim: 'A modern translation of the comparison'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=ESV'
    quote: 'Like the flock for sacrifices'
  - where: 'note 36:38 “Flocks for the feasts”'
    claim: 'Another translation has “a consecrated flock”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A2-3%2C8%2C13-15%2C17%2C20-23%2C25-27%2C37-38&version=NRSVUE'
    quote: 'Like a consecrated flock'
  - where: 'note 36:38 “Flocks for the feasts”'
