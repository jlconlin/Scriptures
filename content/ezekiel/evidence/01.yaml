chapter: 1
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Ezekiel prophesied from about 592 B.C.; the exiles were carried away about 597 B.C.'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC. He prophesied there from about 592 to 570 BC.'
  - where: 'when'
    claim: 'The Bible Dictionary dates his ministry 592–570 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  # ---- setting ----
  - where: 'setting'
    claim: 'Ezekiel was a priest carried away with Jehoiachin; he settled at Tel Abib on the Chebar and prophesied 22 years'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'A priest of the family of Zadok, and one of the captives carried away by Nebuchadnezzar along with Jehoiachin. He settled at Tel Abib on the Chebar and prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'The captivity was in about 597 B.C.; he prophesied from about 592 to 570 B.C.'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC. He prophesied there from about 592 to 570 BC.'
  - where: 'setting'
    claim: 'Jeremiah in Judah before the destruction of Jerusalem, Daniel in the courts of Babylon, and Lehi were prophets of the same years'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'Jeremiah was called to warn the Israelites in Judah prior to the destruction of Jerusalem. Daniel prophesied within the royal courts of Babylon. And Lehi was commanded to leave Jerusalem'
  - where: 'setting'
    claim: 'Those carried away with Jehoiachin were the princes, the mighty men and the craftsmen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and smiths'
  - where: 'setting'
    claim: 'Jeremiah wrote from Jerusalem to the people carried away to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'the words of the letter that Jeremiah the prophet sent from Jerusalem unto the residue of the elders which were carried away captives'
  - where: 'setting'
    claim: 'The city and temple were still standing: Ezekiel is later taken in vision to the temple to announce the judgment still to come on it'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'to announce the judgment which, in consequence of these abominations, was to burst upon the city and the temple'
  - where: 'setting'
    claim: 'The exiles wondered whether God could be with them away from the temple'
    key: sc-knowhy-719
    url: 'https://scripturecentral.org/knowhy/how-did-jacobs-and-ezekiels-peoples-each-respond-to-exile'
    quote: 'Is God’s presence confined to his temple, or can he still be with us here?'
  - where: 'setting'
    claim: 'Chapters 1–3 are the vision of God in His glory and the call'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'Ezekiel 1–3: Ezekiel’s vision of God in His glory and his call to be a watchman for Israel.'
  - where: 'setting'
    claim: 'The vision returns in the plain (3:23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'the glory of the Lord stood there, as the glory which I saw by the river of Chebar: and I fell on my face'
  - where: 'setting'
    claim: 'In chapter 10 the creatures are named cherubim and the glory departs from the threshold of the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'Then the glory of the Lord departed from off the threshold of the house, and stood over the cherubims.'
  - where: 'setting'
    claim: 'In chapter 43 the glory returns to the temple, in a vision like the one by the Chebar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'and the visions were like the vision that I saw by the river Chebar; and I fell upon my face'
  # ---- thread ----
  - where: 'thread'
    claim: 'The principle behind the vision for the exiles: God’s presence is mobile, not confined to the temple'
    key: sc-knowhy-719
    url: 'https://scripturecentral.org/knowhy/how-did-jacobs-and-ezekiels-peoples-each-respond-to-exile'
    quote: 'God’s presence is mobile and not confined to the temple in Jerusalem'
  - where: 'thread'
    claim: 'The full meaning of the vision has not been revealed'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'While some have attempted to explain what these figures represent, the full meaning of Ezekiel’s vision has not been revealed to us by the Lord.'
  - where: 'thread'
    claim: 'What matters most is that Ezekiel saw the glory of the Lord on His throne, an assurance that the Lord could still be with the exiles'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'provided assurance that the Lord could still be with the people, even though they had been exiled to Babylon'
  - where: 'thread'
    claim: 'The vision has been read as a pledge that the judgment on the kingdom would not remove what was essential'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'a real pledge that the essential element of the theocracy was not to be removed by the penal judgment which was passing over the sinful people and kingdom'
  - where: 'thread'
    claim: 'Each later appearance is said to be like the first'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'In all three passages it is expressly testified that the divine appearance was like the first which he witnessed on the occasion of his call.'
  - where: 'thread'
    claim: 'The glory seen in the temple in chapter 8 is the one seen before'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'the glory of the God of Israel was there, according to the vision that I saw in the plain'
  - where: 'thread'
    claim: 'In chapter 43 the glory comes into the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And the glory of the Lord came into the house by the way of the gate whose prospect is toward the east.'
  # ---- sections ----
  - where: 'section 2 plain'
    claim: 'The “whirlwind” is a storm wind (Hebrew ruach se‘arah)'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'a tempestuous wind came from the north'
  - where: 'section 3 plain'
    claim: 'There are four wheels, one beside each creature, as the later vision counts them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'behold the four wheels by the cherubims, one wheel by one cherub, and another wheel by another cherub'
  - where: 'section 3 plain'
    claim: 'The “rings” of the wheels are their rims'
    key: bdb
    url: 'https://biblehub.com/hebrew/1354.htm'
    quote: '6 rim of wheel, felloe 1 Kings 7:33; Ezekiel 1:18 (twice in verse)'
  - where: 'section 4 plain'
    claim: 'The “firmament” is an expanse'
    key: bdb
    url: 'https://biblehub.com/hebrew/7549.htm'
    quote: 'extended surface, (solid) expanse (as if beaten out; compare Job 37:18)'
  # ---- note 1:1 thirtieth ----
  - where: 'note 1:1 “Thirty years from what?”'
    claim: 'The two dates are the same day, since both name the fifth day of the month'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'The real identity of these two dates is placed beyond doubt by the mention of the same day of the month'
  - where: 'note 1:1 “Thirty years from what?”'
    claim: 'What the thirty years are counted from is disputed and cannot be settled'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'But the era, in accordance with which this date is reckoned, is matter of dispute, and can no longer be ascertained with certainty.'
  - where: 'note 1:1 “Thirty years from what?”'
    claim: 'One proposal counts from the accession of Nabopolassar of Babylon; no such era is known'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'many of the older expositors have supposed that Ezekiel means the thirtieth year of the era of Nabopolassar. Nothing, however, is know of any such era.'
  - where: 'note 1:1 “Thirty years from what?”'
    claim: 'Another counts from Josiah’s eighteenth year, when the book of the law was found'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'are of opinion that the thirtieth year is reckoned from the eighteenth year of the reign of Josiah, because in that year the book of the law was discovered'
  - where: 'note 1:1 “Thirty years from what?”'
    claim: 'The same commentary rejects the reading of the prophet’s own age, because a month and day follow'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'is forbidden by the addition "in the fourth month, on the fifth day of the month," which points to an era generally recognised'
  - where: 'note 1:1 “Thirty years from what?”'
    claim: 'Some have taken it as the thirtieth year of Ezekiel’s life, which would make him about twenty-five when carried away'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'some scholars have assumed that maybe it was the thirtieth year of his own life. If that were the case, he would have been about twenty-five when he was taken into captivity.'
  - where: 'note 1:1 “Thirty years from what?”'
    claim: 'Ezekiel does not say the thirtieth year of what'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Though Ezekiel doesn’t say the thirtieth year of what'
  - where: 'note 1:1 “Thirty years from what?”'
    claim: 'The captivity is dated about 597 B.C. and the ministry from about 592'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'carried away to Babylon in about 597 BC. He prophesied there from about 592 to 570 BC.'
  # ---- note 1:1 heavens opened ----
  - where: 'note 1:1 “Lehi saw the heavens open in the same years”'
    claim: 'Lehi saw the heavens open and God on His throne'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'he saw the heavens open, and he thought he saw God sitting upon his throne, surrounded with numberless concourses of angels'
  - where: 'note 1:1 “Lehi saw the heavens open in the same years”'
    claim: 'Ezekiel, like Lehi, saw the Lord on His throne with heavenly beings; the two were among several prophets called at about the same time'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'He then saw the Lord seated on his throne, accompanied by angelic beings, just like Lehi did.'
  - where: 'note 1:1 “Lehi saw the heavens open in the same years”'
    claim: 'Many prophets were called at roughly the same time, Ezekiel among them'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'there were many other prophets called by God at roughly the same time (1 Nephi 1:4), including Habakkuk, Ezekiel, Daniel, and others'
  - where: 'note 1:1 “Lehi saw the heavens open in the same years”'
    claim: 'The two accounts have been set side by side element by element: a dated introduction'
    key: sc-knowhy-459
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-first-visions-so-similar-to-much-later-apocalyptic-writings'
    quote: 'a historical introduction (1 Nephi 1:4; Ezekiel 1:1–3)'
  - where: 'note 1:1 “Lehi saw the heavens open in the same years”'
    claim: 'A vision of the throne'
    key: sc-knowhy-459
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-first-visions-so-similar-to-much-later-apocalyptic-writings'
    quote: 'a throne-theophany (1 Nephi 1:8; Ezekiel 1:26–28)'
  - where: 'note 1:1 “Lehi saw the heavens open in the same years”'
    claim: 'A heavenly book'
    key: sc-knowhy-459
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-first-visions-so-similar-to-much-later-apocalyptic-writings'
    quote: 'a heavenly book (1 Nephi 1:11–12; Ezekiel 2:8–10)'
  - where: 'note 1:1 “Lehi saw the heavens open in the same years”'
    claim: 'The commission of the prophet'
    key: sc-knowhy-459
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-first-visions-so-similar-to-much-later-apocalyptic-writings'
    quote: 'the commission of the prophet (1 Nephi 1:18; 2:1; Ezekiel 2:2–3)'
  - where: 'note 1:1 “Lehi saw the heavens open in the same years”'
    claim: 'Isaiah lived about a century before Lehi; Jeremiah and Ezekiel were roughly his contemporaries'
    key: sc-knowhy-459
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-first-visions-so-similar-to-much-later-apocalyptic-writings'
    quote: 'Isaiah lived approximately one hundred years before Lehi, and Jeremiah and Ezekiel were roughly contemporary with the Book of Mormon prophet.'
  # ---- note 1:3 Chebar ----
  - where: 'note 1:3 “A priest among the exiles, by a canal in Babylonia”'
    claim: 'The Chebar was a canal that left the Euphrates north of Babylon; many exiles lived on its banks'
    key: bd-chebar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chebar?lang=eng'
    quote: 'A canal or waterway that left the Euphrates River north of Babylon and flowed 60 miles southeast before reentering the Euphrates. On its banks lived many of the exiles carried from Judah by Nebuchadnezzar'
  - where: 'note 1:3 “A priest among the exiles, by a canal in Babylonia”'
    claim: 'Ezekiel was a priest of the family of Zadok who settled at Tel Abib on the Chebar'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'A priest of the family of Zadok, and one of the captives carried away by Nebuchadnezzar along with Jehoiachin. He settled at Tel Abib on the Chebar'
  - where: 'note 1:3 “A priest among the exiles, by a canal in Babylonia”'
    claim: 'The exiles lived as a community at Tel-abib by the Chebar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Then I came to them of the captivity at Tel-abib, that dwelt by the river of Chebar, and I sat where they sat'
  - where: 'note 1:3 “A priest among the exiles, by a canal in Babylonia”'
    claim: 'Jeremiah’s letter told the exiles to seek the peace of the city where they lived'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'And seek the peace of the city whither I have caused you to be carried away captives'
  - where: 'note 1:3 “A priest among the exiles, by a canal in Babylonia”'
    claim: 'Those deported with Jehoiachin included the king’s household, officers and the mighty of the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And he carried away Jehoiachin to Babylon, and the king’s mother, and the king’s wives, and his officers, and the mighty of the land'
  - where: 'note 1:3 “A priest among the exiles, by a canal in Babylonia”'
    claim: 'The exiles’ question was whether God’s presence was confined to the temple'
    key: sc-knowhy-719
    url: 'https://scripturecentral.org/knowhy/how-did-jacobs-and-ezekiels-peoples-each-respond-to-exile'
    quote: 'Many of these exiles likely wondered, “How could we be taken away from the Holy City to this place, and how do we worship here? Is God’s presence confined to his temple, or can he still be with us here?”'
  - where: 'note 1:3 “A priest among the exiles, by a canal in Babylonia”'
    claim: 'The Septuagint keeps the first person in verse 3'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/1.htm'
    quote: 'and the hand of the Lord was upon me.'
  # ---- note 1:4 whirlwind ----
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'The Hebrew is ruach se‘arah, “wind of storm”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'סְעָרָ֜ה'
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'Not a wind spinning on its axis but a furious, powerful wind'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'rather, the idea of a furious or powerful wind is what was intended'
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'Cloud, fire, brightness and lightning go with God’s presence throughout scripture'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'These figures are used throughout the scriptures in association with the glory, power, and majesty of God’s presence or that of His messengers.'
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'A commentary translates “a tempestuous wind”'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'a tempestuous wind came from the north'
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'In the prophets, Jeremiah above all, the north is where the enemies who execute judgment on Jerusalem come from'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'the north is the quarter from which the enemies who were to execute judgment upon Jerusalem and Judah break in'
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'On that reading the coming from the north signifies that God will bring the judgment on Judah from there'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'the coming of this divine appearance from the north signifies that it is from the north that God will bring to pass the judgment upon Judah'
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'The cloud points back to the thick cloud at Sinai'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/1.htm'
    quote: 'This cloud points back to the "thick cloud" in which Jehovah, in the ancient time, descended upon Mount Sinai amid thunders and lightnings (Exodus 19:16)'
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'Sinai: thunders, lightnings and a thick cloud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'there were thunders and lightnings, and a thick cloud upon the mount'
  - where: 'note 1:4 “A storm wind from the north”'
    claim: 'Jeremiah was told that evil would break out of the north'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'Out of the north an evil shall break forth upon all the inhabitants of the land.'
  # ---- note 1:4 amber ----
  - where: 'note 1:4 “Amber: a shining substance no one can name”'
    claim: 'The Hebrew word is hashmal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חַשְׁמַ֖ל'
  - where: 'note 1:4 “Amber: a shining substance no one can name”'
    claim: 'Its derivation and exact meaning are doubtful; it is some shining substance, usually taken as an alloy of gold and silver'
    key: bdb
    url: 'https://biblehub.com/hebrew/2830.htm'
    quote: 'etymology and exact meaning dubious; evidently some shining substance; AV amber; supposed by Thes (q. v.) and most to be a brilliant amalgam of gold and silver'
  - where: 'note 1:4 “Amber: a shining substance no one can name”'
    claim: 'The Greek rendering is elektron; the word comes only in the phrase “like the appearance of,” at 1:4, 1:27 and 8:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/2830.htm'
    quote: 'electrum; see also Dl in BaerEzech. xii; only in the combination'
  - where: 'note 1:4 “Amber: a shining substance no one can name”'
    claim: 'The lexicon renders the phrase “like the appearance of” and lists the three verses'
    key: bdb
    url: 'https://biblehub.com/hebrew/2830.htm'
    quote: 'like the appearance of'
  # ---- note 1:5 living creatures ----
  - where: 'note 1:5 “The living creatures are cherubim”'
    claim: 'In chapter 10 Ezekiel identifies the living creatures as cherubim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'This is the living creature that I saw under the God of Israel by the river of Chebar; and I knew that they were the cherubims.'
  - where: 'note 1:5 “The living creatures are cherubim”'
    claim: 'Cherubim are figures of heavenly creatures whose exact form is unknown, found in the Holy of Holies on the mercy seat of the ark'
    key: bd-cherubim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cherubim?lang=eng'
    quote: 'Figures representing heavenly creatures, the exact form being unknown. They are found in the Holy of Holies, on the Mercy Seat of the Ark'
  - where: 'note 1:5 “The living creatures are cherubim”'
    claim: 'Cherubim keep the way of the tree of life in the account of the Fall'
    key: bd-cherubim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cherubim?lang=eng'
    quote: 'cherubim are represented as keeping “the way of the tree of life”'
  - where: 'note 1:5 “The living creatures are cherubim”'
    claim: 'The cherubim of the ark supported the Lord’s throne'
    key: shannon-location
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'The cherubim here supported Jehovah’s throne, such that Jehovah is often described in the Old Testament as sitting between the cherubim on the mercy seat.'
  - where: 'note 1:5 “The living creatures are cherubim”'
    claim: 'Ezekiel 1 is one of the fullest ancient descriptions of cherubim'
    key: shannon-location
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'incidentally providing us with one of the fullest descriptions of ancient cherubim'
  - where: 'note 1:5 “The living creatures are cherubim”'
    claim: 'John’s four beasts: lion, calf, man, eagle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/4?lang=eng'
    quote: 'And the first beast was like a lion, and the second beast like a calf, and the third beast had a face as a man, and the fourth beast was like a flying eagle.'
  - where: 'note 1:5 “The living creatures are cherubim”'
    claim: 'John’s beasts have six wings each'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/4?lang=eng'
