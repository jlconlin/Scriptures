  # ---- rows added in review ----
  - where: thread
    claim: 'The warnings of Moses (Leviticus 26, Deuteronomy 28) are the antecedent of Ezekiel’s message of judgment, given in case Israel broke the covenant'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'But if they broke that covenant, then Moses began a series of grim warnings'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Moses’ warnings are probably the most important antecedent to Ezekiel’s time and message'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Probably the most important historical and prophetic antecedent dates back to Moses and his warnings to the people of Israel as they entered the promised land.'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Blessings if Israel kept the covenant; a series of grim warnings (Leviticus 26:14–39; Deuteronomy 28:15–68) if they broke it'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'But if they broke that covenant, then Moses began a series of grim warnings'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'Ezekiel repeatedly reminded the people that they had the law and the covenant; 5:5–7 is among the references given'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'that they had the law and the covenant'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'The principle is that of Doctrine and Covenants 82:3: more is required of those given more'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'The first answer is based on the principle taught in Doctrine and Covenants 82:3'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'Doctrine and Covenants 82:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/82?lang=eng'
    quote: 'unto whom much is given much is required'
  - where: 'note 5:10 “The worst of the famine”'
    claim: 'Moses warned in Leviticus 26:29 and Deuteronomy 28:53 that cannibalism would result'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
