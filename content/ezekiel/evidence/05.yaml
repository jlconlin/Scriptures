  - where: 'note 5:10 “The worst of the famine”'
    claim: 'The prophecy was fulfilled more than once (Lamentations 4:9–10 is cited)'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
