chapter: 5
claims:
  # ---- when, setting ----
  - where: when
    claim: 'The date heading the chapter stands under: the fifth year of Jehoiachin’s captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: when
    claim: 'The Bible Dictionary begins Ezekiel’s ministry in 592 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: when
    claim: 'The next date in the book is the sixth year, sixth month (8:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: setting
    claim: 'The Bible Dictionary begins Ezekiel’s ministry in 592 B.C. and places him at Tel Abib on the Chebar'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'He settled at Tel Abib on the Chebar and prophesied during a period of 22 years, 592–570 B.C.'
  - where: setting
    claim: 'Ezekiel is with the exiles at Tel-abib by the river Chebar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Then I came to them of the captivity at Tel-abib, that dwelt by the river of Chebar'
  - where: setting
    claim: 'The siege of Jerusalem begins in the ninth year by the book’s own dates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'the king of Babylon set himself against Jerusalem this same day'
  - where: setting
    claim: 'The ninth year, tenth month, tenth day is the date of 24:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month'
  - where: setting
    claim: 'In chapter 4 Ezekiel is told to draw Jerusalem on a tile'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'take thee a tile, and lay it before thee, and portray upon it the city, even Jerusalem'
  - where: setting
    claim: 'In chapter 4 he is told to lay siege to the model city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'and thou shalt lay siege against it. This shall be a sign to the house of Israel.'
  - where: setting
    claim: 'In chapter 4 he lies on his side for a set number of days and eats bread made for those days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'according to the number of the days that thou shalt lie upon thy side, three hundred and ninety days shalt thou eat thereof'
  - where: setting
    claim: 'The acted siege has its own “days”, which 5:2 refers to'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'till thou hast ended the days of thy siege'
  - where: setting
    claim: 'The city of 5:2 is the one portrayed on the tile'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/5.htm'
    quote: 'Another third part he was to cut in small portions about the city, (that figure which he had pourtrayed upon the brick)'
  - where: setting
    claim: 'At verse 5 the figure is dropped and the Lord speaks in plain terms'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/5.htm'
    quote: 'The type or allegory is then dropped, and God is introduced declaring in plain terms the vengeance that was coming on the whole nation'

  # ---- thread ----
  - where: thread
    claim: 'The speech gives the cause of the judgment in verses 5–9 and its nature in verses 10–17'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'in which the judgment that is announced is laid down as to its cause (5-9) and as to its nature (10-17)'
  - where: thread
    claim: 'The penalties come from the warnings of Leviticus 26 (scatter, and a sword drawn after)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will scatter you among the heathen, and will draw out a sword after you'
  - where: thread
    claim: 'The next chapter promises a remnant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'Yet will I leave a remnant, that ye may have some that shall escape the sword among the nations'
  - where: thread
    claim: 'The knife of verse 1 is the Hebrew word for sword (cherev)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חֶ֣רֶב'

  # ---- section plains ----
  - where: section 1 plain
    claim: 'Skirts renders kanaph, the skirt, corner or loose end of a garment (“the edge of your robe”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3671.htm'
    quote: 'a. of garment = skirt, corner, or loose flowing end'
  - where: section 2 plain
    claim: 'Verse 6 as rebelling against the judgments and becoming more wicked than the nations; verse 7 as more turbulent and “have not even acted”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+5&version=NRSVUE'
    quote: 'Because you are more turbulent than the nations that are all around you and have not followed my statutes or kept my ordinances and have not even acted according to the ordinances of the nations'
  - where: section 2 plain
    claim: 'Verse 6: rebelled, becoming more wicked than the nations'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+5&version=NRSVUE'
    quote: 'But she has rebelled against my ordinances and my statutes, becoming more wicked than the nations and the countries all around her'
  - where: section 3 plain
    claim: 'Verse 13: the anger is spent; the Lord satisfies (eases) Himself'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+5&version=NRSVUE'
    quote: 'My anger shall spend itself, and I will vent my fury on them and satisfy myself'
  - where: section 3 plain
    claim: 'Verse 10: any who survive are scattered to every wind'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+5&version=NRSVUE'
    quote: 'and any of you who survive I will scatter to every wind'
  - where: section 4 plain
    claim: 'Verse 15: a warning and a horror to the nations'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+5&version=NRSVUE'
    quote: 'You shall be a mockery and a taunt, a warning and a horror, to the nations around you'
  - where: section 4 plain
    claim: 'Verses 16–17: deadly arrows of famine; wild animals that rob of children; bloodshed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+5&version=NRSVUE'
    quote: 'I will send famine and wild animals against you, and they will rob you of your children; pestilence and bloodshed shall pass through you'

  # ---- note 5:1 knife ----
  - where: 'note 5:1 “The knife is a sword”'
    claim: 'The word translated knife in verse 1 is cherev (Strong’s 2719)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'חֶ֣רֶב'
  - where: 'note 5:1 “The knife is a sword”'
    claim: 'The same word is the “knife” that strikes the second third in verse 2 (and occurs six times in the chapter: 5:1; 5:2 twice; 5:12 twice; 5:17, by hebrew.mjs)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בַ/חֶ֨רֶב֙'
  - where: 'note 5:1 “The knife is a sword”'
    claim: 'Cherev is the ordinary word for a sword as a weapon of war'
    key: bdb
    url: 'https://biblehub.com/hebrew/2719.htm'
    quote: 'sword, as weapon of war'

  # ---- note 5:1 beard ----
  - where: 'note 5:1 “A shaved head and beard”'
    claim: 'Cutting off the hair was a sign of mourning and also of great disgrace, as in 2 Samuel 10:4'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/5.htm'
    quote: 'Cutting off the hair was a sign of mourning; see on Jeremiah 45:5 (note); Jeremiah 48:37 (note); and also a sign of great disgrace; see 2 Samuel 10:4.'
  - where: 'note 5:1 “A shaved head and beard”'
    claim: 'The prophet represents the nation'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/5.htm'
    quote: 'The prophet represents the Jewish nation.'
  - where: 'note 5:1 “A shaved head and beard”'
    claim: 'His hair represents the people'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/5.htm'
    quote: 'His hair, the people.'
  - where: 'note 5:1 “A shaved head and beard”'
    claim: 'The razor represents the Chaldeans'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/5.htm'
    quote: 'The razor, the Chaldeans.'
  - where: 'note 5:1 “A shaved head and beard”'
    claim: 'The Ammonites shaved half the beards of David’s servants, who were greatly ashamed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/10?lang=eng'
    quote: 'shaved off the one half of their beards, and cut off their garments in the middle'
  - where: 'note 5:1 “A shaved head and beard”'
    claim: 'Isaiah’s hired razor is the king of Assyria, and it shaves head and beard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/7?lang=eng'
    quote: 'shave with a razor that is hired, namely, by them beyond the river, by the king of Assyria, the head, and the hair of the feet: and it shall also consume the beard'

  # ---- note 5:2 thirds ----
  - where: 'note 5:2 “Three thirds, explained in verse 12”'
    claim: 'Verse 12 explains the act of verses 1–4; what was done to the hair would be done to Judah'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'That which he was to do to his hair would also be done to Judah.'
  - where: 'note 5:2 “Three thirds, explained in verse 12”'
    claim: 'The scattered third are those taken captive and scattered far from home'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The third that was scattered in the wind represented those who would be taken captive and scattered far from their homeland.'
  - where: 'note 5:2 “Three thirds, explained in verse 12”'
    claim: 'Verse 12 in the Church edition: the three fates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'A third part of thee shall die with the pestilence, and with famine shall they be consumed in the midst of thee: and a third part shall fall by the sword round about thee'
  - where: 'note 5:2 “Three thirds, explained in verse 12”'
    claim: 'The Septuagint has four fourths in verse 2'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/5.htm'
    quote: 'A fourth part thou shalt burn in the fire in the midst of the city'
  - where: 'note 5:2 “Three thirds, explained in verse 12”'
    claim: 'The Septuagint has four fourths in verse 12: pestilence, famine, scattering, sword'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/5.htm'
    quote: 'A fourth part of thee shall be cut off by pestilence, and a fourth part of thee shall be consumed in the midst of thee with famine: and as for another fourth part of thee, I will scatter them to every wind'

  # ---- note 5:2 covenant curses ----
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:33 has scattering and a sword drawn out after'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will scatter you among the heathen, and will draw out a sword after you: and your land shall be desolate, and your cities waste.'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:33 uses the verb zarah (2219) for scatter, as Ezekiel 5:2 and 5:12 do'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'אֱזָרֶ֣ה'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Ezekiel 5:2 uses the verb heriq (7324) for drawing the sword, the verb of Leviticus 26:33'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אָרִ֥יק'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'The lexicon lists Leviticus 26:33 and Ezekiel 5:2, 12 together under the idiom “draw the sword” with this verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/2719.htm'
    quote: 'Exodus 15:9; Leviticus 26:33; Ezekiel 5:2,12; Ezekiel 12:14; Ezekiel 28:7'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:15: despising statutes and abhorring judgments is breaking the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And if ye shall despise my statutes, or if your soul abhor my judgments, so that ye will not do all my commandments, but that ye break my covenant'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:29: eating the flesh of sons and daughters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And ye shall eat the flesh of your sons, and the flesh of your daughters shall ye eat.'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:31: cities made waste'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will make your cities waste, and bring your sanctuaries unto desolation'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:26: the staff of bread broken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And when I have broken the staff of your bread, ten women shall bake your bread in one oven'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:22: wild beasts that rob of children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'I will also send wild beasts among you, which shall rob you of your children'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:25: sword and pestilence; the sword avenges the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will bring a sword upon you, that shall avenge the quarrel of my covenant: and when ye are gathered together within your cities, I will send the pestilence among you'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:28: the Lord’s fury'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'Then I will walk contrary unto you also in fury; and I, even I, will chastise you seven times for your sins.'
  - where: 'note 5:2 “The curses of the covenant”'
    claim: 'Leviticus 26:44 limits the penalties: Israel is not cast away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And yet for all that, when they be in the land of their enemies, I will not cast them away, neither will I abhor them, to destroy them utterly, and to break my covenant with them'

  # ---- note 5:3 skirts ----
  - where: 'note 5:3 “The few hairs kept, and then burned”'
    claim: 'Skirts is kanaph (3671)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בִּ/כְנָפֶֽי/ךָ'
  - where: 'note 5:3 “The few hairs kept, and then burned”'
    claim: 'Kanaph of a garment is its skirt, corner or loose flowing end; Ezekiel 5:3 is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/3671.htm'
    quote: 'a. of garment = skirt, corner, or loose flowing end'
  - where: 'note 5:3 “The few hairs kept, and then burned”'
    claim: 'The hairs bound in the skirts belong with those who were scattered'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'There would further be a sword drawn after them who would be scattered (see Ezekiel 5:2, 12), which was signified by those hairs Ezekiel bound to his skirts and later cast into the fire.'
  - where: 'note 5:3 “The few hairs kept, and then burned”'
    claim: 'Some of those taken captive and preserved would later be cast into the fire, to be destroyed or to be purified'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'to be destroyed, or to be cleansed and purified from iniquity by tribulations'
  - where: 'note 5:3 “The few hairs kept, and then burned”'
    claim: 'The manual points to the promise of escape for some in 6:8–10'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'That all of Judah would not be completely destroyed is attested to by the Lord’s promise of eventual escape for some (see Ezekiel 6:8–10).'
  - where: 'note 5:3 “The few hairs kept, and then burned”'
    claim: 'Ezekiel 6:8 promises a remnant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'Yet will I leave a remnant, that ye may have some that shall escape the sword among the nations'
  - where: 'note 5:3 “The few hairs kept, and then burned”'
    claim: 'Ezekiel 12:16 promises a few men left from sword, famine and pestilence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/12?lang=eng'
    quote: 'But I will leave a few men of them from the sword, from the famine, and from the pestilence'

  # ---- note 5:5 midst ----
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'A modern translation: set in the center of the nations'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+5&version=NRSVUE'
    quote: 'This is Jerusalem; I have set her in the center of the nations, with countries all around her.'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'Jerusalem is central in the history of salvation, the city from which the law goes forth to all nations'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'in relation to the history of salvation, as the city in which God hath set up His throne of grace, from which shall go forth the law and the statutes for all nations'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'The commentary joins this to Isaiah 2:2 and Micah 4:1'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'in order that the salvation of the whole world may be accomplished (Isaiah 2:2.; Micah 4:1.)'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'The charge opens with the city’s exalted position to show its guilt'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'To place the culpability of Jerusalem in its proper prominence, the censure of her sinful conduct opens with the mention of the exalted position which God had assigned her upon earth.'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'Because Jerusalem did worse than the nations, the judgment is executed before their eyes'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'Since Jerusalem has acted worse than the heathen, God will execute His judgments upon her before the eyes of the heathen.'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'The word for midst (tavek, 8432) is in verses 2, 4, 5, 8, 10 and 12 (six times, by hebrew.mjs --word 8432)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בְּ/ת֥וֹךְ'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'The word for round about (saviv, 5439) is in verses 2, 5, 6, 7 (twice), 12, 14 and 15 (eight times, by hebrew.mjs --word 5439)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'סְבִיבוֹתֶ֑י/הָ'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'A modern translation renders “instruction” in verse 15 as a warning'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel+5&version=NRSVUE'
    quote: 'You shall be a mockery and a taunt, a warning and a horror, to the nations around you'
  - where: 'note 5:5 “Jerusalem in the midst of the nations”'
    claim: 'Isaiah 2:3: the law goes forth from Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/2?lang=eng'
    quote: 'for out of Zion shall go forth the law, and the word of the'

  # ---- note 5:7 ----
  - where: 'note 5:7 “Worse than the nations, and yet like them”'
    claim: 'Ezekiel 11:12 blames Jerusalem for doing after the manners of the heathen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'but have done after the manners of the heathen that are round about you'
  - where: 'note 5:7 “Worse than the nations, and yet like them”'
    claim: 'The “not” is wanting in the Peshito (Syriac) and several Hebrew manuscripts'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'because wanting in the Peshito and several Hebrew manuscripts'
  - where: 'note 5:7 “Worse than the nations, and yet like them”'
    claim: 'The omission is explained as an attempt to avoid the contradiction with 11:12'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'it has only been omitted to avoid the supposed contradiction with Ezekiel 11:12'
  - where: 'note 5:7 “Worse than the nations, and yet like them”'
    claim: 'The nations had laws opposed to God’s and laws rooted in the law written on their hearts'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'The heathen had laws which were opposed to those of God, but also such as were rooted in the law of God written upon their hearts.'
  - where: 'note 5:7 “Worse than the nations, and yet like them”'
    claim: 'Israel followed the nations’ wicked laws and neglected their good ones'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/5.htm'
    quote: 'Israel, which hated the law of God, followed the wicked and sinful laws of the heathen, and neglected to observe their good laws.'
  - where: 'note 5:7 “Worse than the nations, and yet like them”'
    claim: 'The commentary judges the passage by Jeremiah 2:10–11'
    key: keil-ezekiel
