chapter: 12
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is the sixth year, sixth month (8:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
