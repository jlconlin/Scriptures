    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/28?lang=eng'
    quote: 'Within two full years will I bring again into this place all the vessels'
  - where: 'setting'
    claim: 'Jeremiah told the exiles to build houses and dwell in them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
