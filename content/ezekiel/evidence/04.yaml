chapter: 4
claims:
  - where: 'when'
    claim: 'The book''s first date is the fifth year of Jehoiachin''s captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'In the fifth day of the month, which was the fifth year of king Jehoiachin’s captivity,'
  - where: 'when'
    claim: 'Ezekiel prophesied from 592 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The next date in the book is the sixth year, at 8:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'setting'
    claim: 'The book''s first date is the fifth year of Jehoiachin''s captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'In the fifth day of the month, which was the fifth year of king Jehoiachin’s captivity,'
  - where: 'setting'
    claim: 'About 592 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'Ezekiel is a priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'The word of the Lord came expressly unto Ezekiel the priest, the son of Buzi, in the land of the Chaldeans by the river Chebar'
  - where: 'setting'
    claim: 'He lives among the exiles at Tel-abib by the Chebar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Then I came to them of the captivity at Tel-abib, that dwelt by the river of Chebar'
  - where: 'setting'
    claim: 'He has been told to shut himself in his house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Go, shut thyself within thine house.'
  - where: 'setting'
    claim: 'He has been told he will be bound'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'they shall put bands upon thee, and shall bind thee with them, and thou shalt not go out among them'
  - where: 'setting'
    claim: 'He has been told he will be dumb and no reprover'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'And I will make thy tongue cleave to the roof of thy mouth, that thou shalt be dumb, and shalt not be to them a reprover'
  - where: 'setting'
    claim: 'Nebuchadnezzar had twice taken captives, and Jerusalem was still intact until the third siege'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Twice Nebuchadnezzar had gone to war against Judah and taken captives both times. Both times, however, he retreated, thinking he had taught Judah a lesson. So Jerusalem was still intact until the third siege'
  - where: 'setting'
    claim: 'The siege begins in the ninth year, tenth month, tenth day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month, the word of the Lord came unto me, saying,'
  - where: 'setting'
    claim: 'That day the king of Babylon set himself against Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'the king of Babylon set himself against Jerusalem this same day'
  - where: 'setting'
    claim: 'The explanation in chapter 5 begins “This is Jerusalem”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'Thus saith the Lord God; This is Jerusalem: I have set it in the midst of the nations and countries that are round about her.'
  - where: 'thread'
    claim: 'Ezekiel carries out the siege as God''s representative and at the same time portrays the besieged people'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/4.htm'
    quote: 'carries out in a symbolical manner the siege of Jerusalem, he is in this situation to portray at the same time the destiny of the people of Israel beleaguered in their metropolis'
  - where: 'thread'
    claim: 'The sign says siege, then hunger, then dispersion among the heathen and unclean bread'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/4.htm'
    quote: 'it says that Jerusalem is soon to be besieged, and during the siege is to suffer hunger and terror as a punishment for the sins of Israel and Judah'
  - where: 'thread'
    claim: 'The Lord Himself is against the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/5?lang=eng'
    quote: 'Behold, I, even I, am against thee, and will execute judgments in the midst of thee in the sight of the nations.'
  - where: 'section 1 plain'
    claim: 'The tile is a brick'
    key: bdb
    url: 'https://biblehub.com/hebrew/3843.htm'
    quote: 'noun feminine brick, tile'
  - where: 'section 1 plain'
    claim: 'Portray means engrave or cut'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'IE engrave or cut in it a representation of the city.'
  - where: 'section 1 plain'
    claim: 'The pan is a flat plate or griddle'
    key: bdb
    url: 'https://biblehub.com/hebrew/4227.htm'
    quote: 'noun feminine flat plate, pan, or griddle for baking'
  - where: 'section 3 plain'
    claim: 'Fitches are spelt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'OR spelt (a type of wheat).'
  - where: 'section 3 plain'
    claim: 'Meat is food'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'HEB food.'
  - where: 'section 3 plain'
    claim: '“From time to time” is at the hours of meals'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/4.htm'
    quote: 'he shall not eat the daily ration at once, but divided into portions according to the daily hours of meals'
  - where: 'section 3 plain'
    claim: 'The bread is baked over the dung as fuel'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/4.htm'
    quote: 'he is to bake it over the dung, i.e., so that dung forms the material of the fire'
  - where: 'section 3 plain'
    claim: 'Defiled is unclean'
    key: bdb
    url: 'https://biblehub.com/hebrew/2931.htm'
    quote: 'adjective unclean'
  - where: 'section 4 plain'
    claim: 'Astonishment is fearfulness, anxiety'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'IE fearfulness, anxiety.'
  - where: 'section 4 plain'
    claim: 'Astonied is appalled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'HEB appalled.'
  - where: 'section 4 plain'
    claim: 'Consume away is pine away, waste away'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/4.htm'
    quote: 'Because bread and water shall fail, and they shall pine away one with another, and disappear in their guilt.'

