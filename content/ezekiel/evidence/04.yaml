  - where: 'note 4:4 “Bearing iniquity: 390 days and 40”'
    claim: 'The house of Israel here appears to be the Northern Kingdom'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'in this case it appears the Northern Kingdom is meant'
  - where: 'note 4:4 “Bearing iniquity: 390 days and 40”'
