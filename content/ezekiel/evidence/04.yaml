    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/4.htm'
    quote: 'is to show to the people how they are to be cast down by the siege of Jerusalem'
  - where: 'note 4:4 “Bearing iniquity: 390 days and 40”'
    claim: 'The Updated NRSV has guilt for iniquity'
    key: nrsvue
