    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/4.htm'
    quote: 'is not fully explained by the circumstance that the kingdom of the ten tribes lay to the left, i.e., to the north, the kingdom of Judah to the right, i.e., to the south of Jerusalem'
