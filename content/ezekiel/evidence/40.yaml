chapter: 40
claims:
  - where: 'when'
    claim: 'The captivity began in about 597 B.C., so its twenty-fifth year is about 573 B.C.'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC'

  - where: 'setting'
    claim: 'Ezekiel was earlier brought in the visions of God to Jerusalem and its temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'brought me in the visions of God to Jerusalem, to the door of the inner gate that looketh toward the north'
  - where: 'setting'
    claim: 'Chapters 40–48 are the fourth division of the book'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(4) 40–48, visions of the reconstruction of the temple and its worship'
  - where: 'setting'
    claim: 'Chapters 40–48 are unlike other prophecy'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'Ezek. 40–48 is unique in prophecy'
  - where: 'setting'
    claim: 'Chapters 47–48 are called the description of the latter-day temple in Jerusalem'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'the description of the latter-day temple in Jerusalem'
  - where: 'setting'
    claim: 'The promise of a sanctuary in chapter 37 is joined to the temple of chapters 40–47'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'The temple will be rebuilt in Jerusalem again (Ezekiel 37:26–28; chapters 40–47).'
  - where: 'setting'
    claim: 'Elder Talmage wrote that the temple of the vision has not been built'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Certain it is that the Temple of the vision has not yet been builded.'
  - where: 'setting'
    claim: 'Joseph Smith taught that Jerusalem and the temple must be rebuilt before the Savior appears'
    key: ttp-joseph-smith-21
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-21?lang=eng'
    quote: 'Judah must return, Jerusalem must be rebuilt, and the temple, and water come out from under the temple'
  - where: 'setting'
    claim: 'Joseph Smith: all this before the Son of Man appears'
    key: ttp-joseph-smith-21
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-21?lang=eng'
    quote: 'and all this must be done before the Son of Man will make His appearance'
  - where: 'setting'
    claim: 'The same statement of Joseph Smith is given for chapters 40–48'
    key: scripture-helps-ezek
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'It will take some time to rebuild the walls of the city and the temple'

  - where: 'thread'
    claim: 'Elder Talmage, as the manual prints him, on the exclusiveness of the plan'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'The plan provided for even greater exclusiveness than had characterized the sacred area of the Temple of Solomon'

  - where: 'section 2 plain'
    claim: '“Looketh” toward the east is “faces” (footnote 6b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'OR faces.'

  - where: 'note 40:1 “The tenth day of the first month”'
    claim: 'The Septuagint reads “in the first month”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/40.htm'
    quote: 'in the twenty-fifth year of our captivity, in the first month, on the tenth day of the month'
  - where: 'note 40:1 “The tenth day of the first month”'
    claim: 'The phrase is read as a short form of Exodus 12:2, the first month'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'is a contracted repetition of the definition contained in Exodus 12:2'
  - where: 'note 40:1 “The tenth day of the first month”'
    claim: 'The tenth day began the preparations for the Passover and suited the revelation'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'The tenth day of this month was the day on which the preparations for the Passover, the feast of the elevation of Israel into the people of God, were to commence, and therefore was well adapted for the revelation of the new constitution of the kingdom of God'
  - where: 'note 40:1 “The tenth day of the first month”'
    claim: 'The seventh-month reading is rejected because that new year is later'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'the custom of beginning the year with the month Tishri was introduced long after the captivity'
  - where: 'note 40:1 “The tenth day of the first month”'
    claim: 'The jubilee year began on the tenth day of the seventh month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'on the tenth day of the seventh month, in the day of atonement'

  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'Moses was caught up into a high mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'was caught up into an exceedingly high mountain'
  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'An angel accompanied Nephi through his vision'
    key: sc-knowhy-492
    url: 'https://scripturecentral.org/knowhy/why-were-lehi-and-nephi-guided-by-angelic-escorts-in-their-visions'
    quote: 'accompanied Nephi for the remainder of his vision, directing his attention towards crucial historical scenes'
  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'A heavenly guide is common to apocalyptic visions'
    key: sc-knowhy-492
    url: 'https://scripturecentral.org/knowhy/why-were-lehi-and-nephi-guided-by-angelic-escorts-in-their-visions'
    quote: 'One feature common to apocalypses, both Jewish and Christian, is the presence of a heavenly being who guides the recipient of a revelation through a visionary experience'
  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'Ezekiel 40–48 is named among the examples'
    key: sc-knowhy-492
    url: 'https://scripturecentral.org/knowhy/why-were-lehi-and-nephi-guided-by-angelic-escorts-in-their-visions'
    quote: 'See further Zechariah 1–6 and Ezekiel 40–48.'
  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'The mountain is identified with Mount Zion, with Micah 4:1 and Isaiah 2:2'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'The very high mountain is Mount Zion, which is exalted above the tops of all the mountains (Micah 4:1; Isaiah 2:2)'
  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'The Hebrew word for “frame” means structure'
    key: bdb
    url: 'https://biblehub.com/hebrew/4011.htm'
    quote: 'Ezekiel 40:2 like the structure of city'
  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'ESV rendering of verse 2'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=ESV'
    quote: 'a very high mountain, on which was a structure like a city to the south'
  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'NRSVUE rendering of verse 2'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=NRSVUE'
    quote: 'a very high mountain on which was a structure like a city to the south'
  - where: 'note 40:2 “A very high mountain, and something like a city”'
    claim: 'The structure is read as the temple compound, not the city'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'what Ezekiel saw as a city-edifice can only be the building of the new temple, with its surrounding wall and its manifold court buildings'

  - where: 'note 40:3 “The man like brass”'
    claim: 'The Church’s chapter heading calls the guide a heavenly messenger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'A heavenly messenger shows Ezekiel in vision a city where the temple is located'
  - where: 'note 40:3 “The man like brass”'
    claim: 'The Septuagint has “shining brass”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/40.htm'
    quote: 'the appearance of him was as the appearance of shining brass'
  - where: 'note 40:3 “The man like brass”'
    claim: 'The man was probably a messenger, not the Lord'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'was probably not the Lord but an authorized messenger'
  - where: 'note 40:3 “The man like brass”'
    claim: 'In chapter 43 the voice comes from the house while the man stands by Ezekiel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And I heard him speaking unto me out of the house; and the man stood by me.'

  - where: 'note 40:3 “A cord and a rod”'
    claim: 'The line of flax is a cord used as a measuring line'
    key: bdb
    url: 'https://biblehub.com/hebrew/6616.htm'
    quote: 'Ezekiel 40:3 (as measuring line)'
  - where: 'note 40:3 “A cord and a rod”'
    claim: 'The rod measured short distances and the cord longer ones'
    key: brown-cube
    url: 'https://interpreterfoundation.org/journal/cube-gate-and-measuring-tools-a-biblical-pattern'
    quote: 'was used for measuring short distances, while the cord measured longer ones'
  - where: 'note 40:3 “A cord and a rod”'
    claim: 'The line is used at the river in chapter 47'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/47?lang=eng'
    quote: 'when the man that had the line in his hand went forth eastward, he measured a thousand cubits'
  - where: 'note 40:3 “A cord and a rod”'
    claim: 'The Church’s footnote on “measuring” joins verse 3 to Ezekiel 47:3 and Revelation 11:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'Ezek. 42:16 (16–19); 47:3; Rev. 11:1.'

  - where: 'note 40:4 “Why every measurement is reported”'
    claim: 'The house is shown so that Israel may be ashamed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'shew the house to the house of Israel, that they may be ashamed of their iniquities: and let them measure the pattern'
  - where: 'note 40:4 “Why every measurement is reported”'
    claim: 'Elder Talmage on the immediate purpose of the vision'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'The immediate purpose of this revelation through the vision of the prophet appears to have been that of awakening the people of Israel to a realization of their fallen state and a conception of their departed glory.'
  - where: 'note 40:4 “Why every measurement is reported”'
    claim: 'Elder Talmage: whether Ezekiel took the design as one to be realized is not declared'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'or as but a grand yet unattainable ideal, is not declared'
  - where: 'note 40:4 “Why every measurement is reported”'
    claim: 'Height measurements are scarce in the description'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'Zimmerli correctly notes the scarcity of height measurements in the otherwise meticulous description of temple architecture'

  - where: 'note 40:5 “A longer cubit”'
    claim: 'The ordinary cubit'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'The distance from the elbow to the tip of the finger, normally about 17½ inches'
  - where: 'note 40:5 “A longer cubit”'
    claim: 'The long cubit is about 21 inches and the reed about 10½ feet (footnote 5c)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'Thus each would be about 21 inches or 53 centimeters; and the total length of the measuring reed is about 10½ feet or 3.2 meters.'

  - where: 'note 40:6 “The east gate, measured first”'
    claim: 'The glory enters by the east gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'came into the house by the way of the gate whose prospect is toward the east'
  - where: 'note 40:6 “The east gate, measured first”'
    claim: 'The Church’s footnote on “gate” in verse 6 points to 43:1–2 and 44:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'Ezek. 42:15; 43:1 (1–2); 44:1; 47:2.'
  - where: 'note 40:6 “The east gate, measured first”'
    claim: 'The little chambers are “side rooms” in the ESV'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=ESV'
    quote: 'And there were three side rooms on either side of the east gate.'
  - where: 'note 40:6 “The east gate, measured first”'
    claim: 'The gateway served as a station for guards'
    key: brown-cube
    url: 'https://interpreterfoundation.org/journal/cube-gate-and-measuring-tools-a-biblical-pattern'
    quote: 'This gateway seems to have served as a station for guards'
  - where: 'note 40:6 “The east gate, measured first”'
    claim: 'The three-part gate is like city gates found at Solomon’s cities'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'The tripartite gate structure described by Ezekiel here is similar to the city-gate structures archaeologists have uncovered at some of Solomon’s cities.'

  - where: 'note 40:16 “Palm trees on the posts”'
    claim: 'Solomon’s temple was carved with palm trees'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'carved figures of cherubims and palm trees and open flowers'
  - where: 'note 40:16 “Palm trees on the posts”'
    claim: 'Palms on the six gates; palms and cherubim on the sanctuary walls'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'While the six gates of the temple courtyards were all decorated with palm trees, the walls of the sanctuary were decorated with both palm trees and cherubim'
  - where: 'note 40:16 “Palm trees on the posts”'
    claim: 'The decoration is read as Eden imagery'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'Imagery of the Garden of Eden is also prevalent in the architecture of the sanctuary'
  - where: 'note 40:16 “Palm trees on the posts”'
    claim: 'The cherubim and palm trees of the sanctuary are joined to the cherubim of Genesis 3:24'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'The author of Genesis uses this same imagery when God expels Adam from the Garden of Eden'
  - where: 'note 40:16 “Palm trees on the posts”'
    claim: 'The sanctuary is the holiest building of the compound'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'the sanctuary (the holiest building within the temple compound'

  - where: 'note 40:22 “Seven steps, then eight”'
    claim: 'The Septuagint numbers the steps to the house as ten'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/40.htm'
    quote: 'and they went up to it by ten steps'
  - where: 'note 40:22 “Seven steps, then eight”'
    claim: 'The Septuagint gives seven steps at the first gate'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/40.htm'
    quote: 'And he entered by seven steps into the gate that looks eastward'
  - where: 'note 40:22 “Seven steps, then eight”'
    claim: 'The ESV follows the Septuagint in verse 49'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=ESV'
    quote: 'Ezekiel 40:49 Septuagint; Hebrew and by steps that would go up to it'
  - where: 'note 40:22 “Seven steps, then eight”'
    claim: 'The NRSVUE follows the Greek in verse 49'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=NRSVUE'
    quote: 'ten steps led up to it'
  - where: 'note 40:22 “Seven steps, then eight”'
    claim: 'The stairs take the reader progressively higher'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'the audience moves progressively higher up the temple compound'
  - where: 'note 40:22 “Seven steps, then eight”'
    claim: 'The emphasis is on height in general'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'the emphasis of the author was on the general concept of height, not on a precise physical measurement'
  - where: 'note 40:22 “Seven steps, then eight”'
    claim: 'Ascent signifies approach to more sacred space'
    key: rennaker-holiness
    url: 'https://rsc.byu.edu/ascending-mountain-lord/approaching-holiness-sacred-space-ezekiels-temple-vision'
    quote: 'the symbolism of ascending vertically towards increasingly sacred space'

  - where: 'note 40:39 “Tables for sacrifice in a temple still to be built”'
    claim: 'President Joseph Fielding Smith, as the manual prints him: animal sacrifice to complete the restoration'
    key: ot-manual-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'blood sacrifices will be performed long enough to complete the fulness of the restoration in this dispensation. Afterwards sacrifice will be of some other character.'

  - where: 'note 40:44 “Singers, or two chambers?”'
    claim: 'The Septuagint reads two chambers'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/40.htm'
    quote: 'there were two chambers in the inner court'
  - where: 'note 40:44 “Singers, or two chambers?”'
    claim: 'The Septuagint puts the second chamber at the south gate'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/40.htm'
    quote: 'one behind the southern gate, but which looks to the north'
  - where: 'note 40:44 “Singers, or two chambers?”'
    claim: 'The Hebrew words for singers and two differ by one letter; the Greek is followed'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'we are compelled to alter שׁרים into שׁתים'
  - where: 'note 40:44 “Singers, or two chambers?”'
    claim: 'Singers and priests are distinct in Israel’s worship'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'a sharp distinction is made between the Levitical singers and the priests'
  - where: 'note 40:44 “Singers, or two chambers?”'
    claim: 'Only two chambers are mentioned in verses 45–46'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'only two cells, or cell-buildings, are mentioned in Ezekiel 40:45 and Ezekiel 40:46'
  - where: 'note 40:44 “Singers, or two chambers?”'
    claim: 'ESV rendering of verse 44'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=ESV'
    quote: 'two (BN)chambers in the (BO)inner court, one at the side of the north gate facing south, the other at the side of the south gate facing north'
  - where: 'note 40:44 “Singers, or two chambers?”'
    claim: 'ESV footnote on verse 44'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=ESV'
    quote: 'Septuagint; Hebrew were chambers for singers'
  - where: 'note 40:44 “Singers, or two chambers?”'
    claim: 'NRSVUE rendering of verse 44'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=NRSVUE'
    quote: 'two chambers in the inner court, one at the side of the north gate facing south, the other at the side of the south gate facing north'

  - where: 'note 40:46 “The sons of Zadok”'
    claim: 'Zadok stayed faithful to David in Adonijah’s rebellion'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'during the rebellion of Adonijah, Abiathar joined the rebels, while Zadok remained faithful to David'
  - where: 'note 40:46 “The sons of Zadok”'
    claim: 'Zadok anointed Solomon and replaced Abiathar'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'He anointed Solomon (1:32–45); and was finally put in the room of Abiathar.'
  - where: 'note 40:46 “The sons of Zadok”'
    claim: 'Ezekiel was of Zadok’s family'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'A priest of the family of Zadok'
  - where: 'note 40:46 “The sons of Zadok”'
    claim: 'The reason for the choice is given in chapter 44'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'the sons of Zadok, that kept the charge of my sanctuary when the children of Israel went astray from me'
  - where: 'note 40:46 “The sons of Zadok”'
    claim: 'ESV rendering of verse 46'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2040&version=ESV'
    quote: 'who alone among the sons of Levi may come'

  - where: 'note 40:48 “At the porch of the house”'
    claim: 'Solomon’s porch was twenty cubits long'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'twenty cubits was the length thereof, according to the breadth of the house'
  - where: 'note 40:48 “At the porch of the house”'
    claim: 'Two pillars stood before Solomon’s porch'
    key: bd-temple-of-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-solomon?lang=eng'
    quote: 'In front of the porch stood two great pillars of hollow brass, called Jachin and Boaz.'
  - where: 'note 40:48 “At the porch of the house”'
    claim: 'The pillars of verse 49 correspond to Jachin and Boaz'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/40.htm'
    quote: 'like the columns Jachin and Boaz in Solomon'
  - where: 'note 40:48 “At the porch of the house”'
    claim: 'Ezekiel passes six gates before the house'
