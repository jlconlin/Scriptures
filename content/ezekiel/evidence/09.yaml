chapter: 9
claims:
  - where: 'when'
    claim: 'The vision of chapters 8–11 is dated to the sixth year, sixth month, fifth day'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month, as I sat in mine house, and the elders of Judah sat before me'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year), so the sixth year is about 591 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The vision ends in chapter 11, when Ezekiel is returned to the captives'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'So the vision that I had seen went up from me'

  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'He was taken in vision to Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'brought me in the visions of God to Jerusalem, to the door of the inner gate that looketh toward the north'
  - where: 'setting'
    claim: 'The deportation that followed Jerusalem’s fall was in 586 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'Chapter 8 shows successive scenes of idolatry at the temple, each called greater than the last, ending in the inner court'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'turn thee yet again, and thou shalt see greater abominations than these'
  - where: 'setting'
    claim: 'Chapter 8 closes with the sentence that chapter 9 carries out'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'Therefore will I also deal in fury: mine eye shall not spare, neither will I have pity'
  - where: 'setting'
    claim: 'In chapter 10 the man clothed with linen scatters coals over the city'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'fill thine hand with coals of fire from between the cherubims, and scatter them over the city'
  - where: 'setting'
    claim: 'In chapter 10 the glory moves from the threshold to the east gate'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'every one stood at the door of the east gate'
  - where: 'setting'
    claim: 'In chapter 11 the glory leaves the city and Ezekiel is brought back to the captives'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'brought me in a vision by the Spirit of God into Chaldea, to them of the captivity'

  - where: 'thread'
    claim: 'The Lord’s departure is caused by the abominations'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'the great abominations that the house of Israel committeth here, that I should go far off from my sanctuary'
  - where: 'thread'
    claim: 'The six are told to go after the man with the inkhorn, and not to touch the marked'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'Go ye after him through the city, and smite'

  - where: 'section 1 plain'
    claim: 'The “higher gate” is the upper gate facing north; the inkhorn is a writing case; the brasen altar is the bronze altar'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%209&version=NRSVUE'
    quote: 'six men came from the direction of the upper gate, which faces north, each with his weapon for slaughter in his hand; among them was a man clothed in linen with a writing case at his side'
  - where: 'section 2 plain'
    claim: 'The glory had gone up from the cherub on which it rested'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%209&version=NRSVUE'
    quote: 'the glory of the God of Israel had gone up from the cherub on which it rested'
  - where: 'section 3 plain'
    claim: 'The “ancient men” are elders in front of the temple'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%209&version=NRSVUE'
    quote: 'So they began with the elders who were in front of the house'
  - where: 'section 4 plain'
    claim: '“Full of blood” is bloodshed; “recompense their way upon their head” is to bring their deeds down on their heads'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%209&version=NRSVUE'
    quote: 'the land is full of bloodshed and the city full of perversity'
  - where: 'section 4 plain'
    claim: '“Perverseness” is perverted justice'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4297.htm'
    quote: 'noun [masculine] that which is perverted, justice'

  - where: 'note 9:1 “Overseers of the city, or its punishments”'
    claim: 'The Hebrew behind “them that have charge” is pequddot (H6486), plural'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'פְּקֻדּ֣וֹת'
  - where: 'note 9:1 “Overseers of the city, or its punishments”'
    claim: 'The noun’s senses include oversight and visitation'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6486.htm'
    quote: 'noun feminine oversight, mustering, visitation, store'
  - where: 'note 9:1 “Overseers of the city, or its punishments”'
    claim: 'BDB lists Ezekiel 9:1 under visitation in the sense of punishment'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6486.htm'
    quote: '= punishment Hosea 9:7; Isaiah 10:3; Micah 7:4; Ezekiel 9:1'
  - where: 'note 9:1 “Overseers of the city, or its punishments”'
    claim: 'The word also means an overseer, the abstract standing for the person'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6486.htm'
    quote: 'overseer (abstract for concrete), 2 Kings 11:8; Ezekiel 44:11'
  - where: 'note 9:1 “Overseers of the city, or its punishments”'
    claim: 'The NRSVUE renders the phrase as executioners of the city'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%209&version=NRSVUE'
    quote: 'Draw near, you executioners of the city, each with his destroying weapon in his hand'
  - where: 'note 9:1 “Overseers of the city, or its punishments”'
    claim: 'The Septuagint reads the judgment of the city, with no persons'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/9.htm'
    quote: 'The judgement of the city has drawn nigh; and each had the weapons of destruction in his hand'
  - where: 'note 9:1 “Overseers of the city, or its punishments”'
    claim: 'The phrase “in mine ears with a loud voice” is in the verse just before, of the people’s cry'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'though they cry in mine ears with a loud voice, yet will I not hear them'

  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The Hebrew for his clothing is baddim (H906, plural)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בַּדִּ֔ים'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'bad is white linen, the material of priestly vestments, including Leviticus 16:4'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/906.htm'
    quote: 'white linen (derivation unknown)'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'It is the material of the priestly vestments'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/906.htm'
    quote: 'in P as material of different priestly vestments Exodus 28:42; Exodus 39:28; Leviticus 6:3'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'BDB takes the wearer in Ezekiel 9–10 and Daniel 10 and 12 to be an angel'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/906.htm'
    quote: 'clad in (the) linen garments, of angel Ezekiel 9:2,3,11; Ezekiel 10:2,6,7; Daniel 10:5; Daniel 12:6,7'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The high priest wore linen on the Day of Atonement'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'He shall put on the holy linen coat, and he shall have the linen breeches upon his flesh'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The high priest’s Day of Atonement dress was of this material'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'The dress worn by the high priest, when presenting the sin-offering on the great day of atonement (Leviticus 16:4, Leviticus 16:23), was made of'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'Daniel saw a man clothed in linen'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'behold a certain man clothed in linen, whose loins were girded with fine gold of Uphaz'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The NRSVUE calls it a writing case'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%209&version=NRSVUE'
    quote: 'a man clothed in linen with a writing case at his side'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The writing materials were carried in the girdle at the hip, as scribes in the East carried them'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'in the girdle on his hips, in which scribes in the East are accustomed to carry their writing materials'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The Septuagint has a sapphire girdle and no writing kit'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/9.htm'
    quote: 'clothed with a long robe down to the feet, and a sapphire girdle was on his loins'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The man has been identified with the angel of Jehovah as heavenly high priest'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'It has been inferred from this, that the figure clothed in white linen was the angel of Jehovah, who appears as the heavenly high priest, to protect and care for his own'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'Keil does not regard that identification as established; other angels wear shining linen'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'Nevertheless, we cannot regard this view as established'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'Shining white linen is not peculiar to the angel of Jehovah'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'is not a dress peculiar to the angel of Jehovah or to Christ. The seven angels, with the vials of wrath, also appear in garments of shining white linen'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'Nothing in the description indicates a being equal with God'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'there is nothing whatever to indicate a being equal with God'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'He is the leader of the seven, as high priest to Levites or chancellor to officials'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'he stood in the same relation to them as the high priest to the Levites, or the chancellor to the other officials'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The same figure is sent in chapter 10 to scatter coals over the city'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'And he spake unto the man clothed with linen, and said, Go in between the wheels, even under the cherub, and fill thine hand with coals of fire'
  - where: 'note 9:2 “The man clothed with linen”'
    claim: 'The higher gate has been taken as the gate of 8:3 and 8:5'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'The upper gate is the gate leading from the outer court to the inner, or upper court, which stood on higher ground, - the gate mentioned in Ezekiel 8:3 and Ezekiel 8:5'

  - where: 'note 9:3 “The glory begins to leave”'
    claim: 'Cherubim are found on the mercy seat of the ark and in Ezekiel’s visions'
    key: 'bd-cherubim'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cherubim?lang=eng'
    quote: 'They are found in the Holy of Holies, on the Mercy Seat of the Ark (Ex. 25:18, 22; 1 Kgs. 6:23–28; Heb. 9:5), and in the visions of Ezekiel (Ezek. 10; 11:22)'
  - where: 'note 9:3 “The glory begins to leave”'
    claim: 'In the vision the throne is above the cherubim'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'in the firmament that was above the head of the cherubims there appeared over them as it were a sapphire stone, as the appearance of the likeness of a throne'
  - where: 'note 9:3 “The glory begins to leave”'
    claim: 'At the start of the vision the Lord speaks of going far from His sanctuary'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'that I should go far off from my sanctuary'
  - where: 'note 9:3 “The glory begins to leave”'
    claim: '10:4 repeats the move to the threshold'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'went up from the cherub, and stood over the threshold of the house'
  - where: 'note 9:3 “The glory begins to leave”'
    claim: 'The glory leaves the threshold and stands over the cherubim at the east gate'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/10?lang=eng'
    quote: 'departed from off the threshold of the house, and stood over the cherubims'
  - where: 'note 9:3 “The glory begins to leave”'
    claim: 'The glory leaves the city for the mountain on the east'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'went up from the midst of the city, and stood upon the mountain which is on the east side of the city'
  - where: 'note 9:3 “The glory begins to leave”'
    claim: 'The glory returns from the east in the last vision'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'the glory of the God of Israel came from the way of the east'

  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'The Hebrew for “mark” is taw (H8420); in Ezekiel only at 9:4 and 9:6, by the count of scripts/hebrew.mjs ezekiel --word 8420'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תָּ֜ו'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'BDB’s definition, and the word’s one other use in Job 31:35 as a written mark of attestation'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8420.htm'
    quote: 'mark on forehead, sign of exemption from judgment Ezekiel 9:4,6'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'In Job 31:35 it is a written mark in attestation'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8420.htm'
    quote: 'Job 31:35 = my (written) mark (in attestation)'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'Taw is the last letter of the Hebrew alphabet and had the form of a cross in the earlier writing'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'the last letter of the Hebrew alphabet, had the form of a cross in the earlier writing'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'To mark a taw is to make a cross-shaped mark'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'is therefore the same as to make a mark in the form of a cross'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'Early Christians saw in it an allusion to the cross'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'the early Christians, according to a statement in Origen, looked upon the sign itself as significant, and saw therein a prophetic allusion to the sign of the cross'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'Keil denies a direct prophecy of the cross, since the letter’s form was the common sign and could serve as a signature'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'A direct prophecy of the cross of Christ is certainly not to be found here, since the form of the letter Tâv was the one generally adopted as a sign, and, according to Job 31:35, might supply the place of a signature'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'Keil still finds the coincidence remarkable to one who considers God’s foreknowledge'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'there is something remarkable in this coincidence to the thoughtful observer of the ways of God, whose counsel has carefully considered all before hand'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'The forehead was chosen as the most visible part of the body, so that the executioners could distinguish the marked'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'was to be marked upon the forehead, the most visible portion of the body'
  - where: 'note 9:4 “The mark is the letter taw”'
    claim: 'The mark showed that the faithful belonged to God'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'This mark was to be put on these faithful ones for their protection when the faithless were to be destroyed. It showed that they belonged to God.'

  - where: 'note 9:4 “Who receives the mark”'
    claim: 'anach means to sigh or groan, in token of grief'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/584.htm'
    quote: 'sigh, in token of grief Isaiah 24:7; Proverbs 29:2; Lamentations 1:4'
  - where: 'note 9:4 “Who receives the mark”'
    claim: 'BDB glosses the verb “sigh, groan”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/584.htm'
    quote: 'sigh, groan, mostly in poetry & late'
  - where: 'note 9:4 “Who receives the mark”'
    claim: 'anaq means to cry or groan; in the Niphal, in mourning or lamentation, as at Ezekiel 9:4'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/602.htm'
    quote: 'verb cry, groan'
  - where: 'note 9:4 “Who receives the mark”'
    claim: 'The Niphal is used of mourning and lamentation'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/602.htm'
    quote: 'in mourning, lamentation'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'Ezekiel is in the visions of God, and the vision ends at 11:24'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng'
    quote: 'So the vision that I had seen went up from me'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'The chapter is the first act of the judgment, shown in a figurative representation'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/9.htm'
    quote: 'The first act of the judgment is thus shown to the prophet in a figurative representation'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'The command repeats the sentence of 8:18'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'mine eye shall not spare, neither will I have pity'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'The Chaldeans killed in the sanctuary and had no compassion on young or old'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man, or him that stooped for age'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'The Chronicler says the Lord brought the king of the Chaldees upon them'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'Therefore he brought upon them the king of the Chaldees'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'The passage has been read as showing that the Lord can preserve whom He will'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'This passage shows that even in war, plagues, and starvation, the Lord can preserve whom He will and leave the rest to die'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'The manual allows for martyrs and other exceptions'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Even though there will be martyrs and other exceptions'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'Ezekiel 21:3–4 says the sword will cut off the righteous and the wicked'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'will cut off from thee the righteous and the wicked'
  - where: 'note 9:5 “A vision of what Babylon would do”'
    claim: 'On Ezekiel 21:4 the manual prints Joseph Smith’s statement that the Saints will not escape all the judgments'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'It is a false idea that the Saints will escape all the judgments, whilst the wicked suffer'

  - where: 'note 9:6 “The Passover before it and the seal after it”'
    claim: 'At the Passover the blood was a token and the Lord passed over'
