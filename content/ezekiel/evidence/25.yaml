chapter: 25
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is the ninth year, tenth month, tenth day (24:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month'
  - where: 'when'
    claim: 'The next date in the book is the eleventh year (26:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'And it came to pass in the eleventh year, in the first day of the month'
  - where: 'when'
    claim: 'The captivity from which the book counts began in 597 B.C., so its ninth year is about 588 B.C.; Jerusalem fell in 586 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'

  - where: 'setting'
    claim: 'Chapters 25–32 are the book’s second division, prophecies against Israel’s enemies'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(2) 25–32, prophecies against Israel’s enemies'
  - where: 'setting'
    claim: 'Seven nations are addressed in chapters 25–32: Ammon, Moab, Edom, Philistia, Tyre, Sidon, Egypt'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'These eight chapters contain prophecies against several foreign nations: Ammon, Moab, Edom, Philistia, Tyre, Sidon, and Egypt.'
  - where: 'setting'
    claim: 'The four oracles of chapter 25 are one word of the Lord'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'the utterances against Ammon, Moab, Edom, and the Philistines, being all comprehended in one word of God'
  - where: 'setting'
    claim: 'Ammon lay east of Gilead'
    key: 'bd-ammon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'they were settled east of Mount Gilead, from the Jabbok southwards'
  - where: 'setting'
    claim: 'Moab lay east of the Dead Sea'
    key: 'bd-moab'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'The land of Moab lay east of the Dead Sea.'
  - where: 'setting'
    claim: 'Edom lay south of the Dead Sea'
    key: 'bd-edom'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'This country lay south of the Dead Sea, having Moab on the north'
  - where: 'setting'
    claim: 'The Philistines held the Mediterranean coast'
    key: 'bd-philistines'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert'
  - where: 'setting'
    claim: 'The oracles of chapter 25 have been placed just after the fall of Jerusalem, which they presuppose'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'belong to the time immediately succeeding the fall of Jerusalem, since they presuppose its having occurred'
  - where: 'setting'
    claim: 'The dated oracles of 25–32 are arranged by subject, not by date'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'the arrangement is based upon the subject-matter of the prophecies, and the chronological sequence is kept subordinate to this'
  - where: 'setting'
    claim: 'Ezekiel’s mouth was to be opened when one who escaped came to him'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'In that day shall thy mouth be opened to him which is escaped, and thou shalt speak, and be no more dumb'
  - where: 'setting'
    claim: 'The news of the city’s fall reaches Ezekiel at 33:21'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'one that had escaped out of Jerusalem came unto me, saying, The city is smitten'
  - where: 'setting'
    claim: 'The oracles on the nations stand in the time of the prophet’s silence toward Israel'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'the Lord directed him to speak against the heathen nations'
  - where: 'setting'
    claim: 'The exiles’ question was why the other nations were not destroyed if Judah was destroyed for being like them'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'If we are being destroyed for being like the other nations (which Ezekiel and other prophets had said many times), then why aren’t those nations destroyed?'
  - where: 'setting'
    claim: 'Chapters 25–32 answer that the nations were not exempt'
    key: 'lund-ezekiel'
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Chapters 25 to 32 and chapter 35 describe the judgments that would come or had already come upon Ammon, Moab, Edom, Philistia, Tyre, Sidon, Egypt'
  - where: 'thread'
    claim: 'The charges against all four are malicious delight at Israel’s fall and revengeful hostility'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'their malicious delight at the fall of Israel, and their revengeful, hostile behaviour towards the covenant nation'
  - where: 'thread'
    claim: 'The root for vengeance occurs ten times in verses 12–17 (three in 12, two in 14, three in 15, two in 17); this is the noun of verse 14'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נִקְמָתִ֜/י'

  - where: 'note 25:3 “Aha”'
    claim: 'The Hebrew interjection expresses joy, here satisfaction at an enemy’s misfortune; it is listed at Ezekiel 25:3, 26:2 and 36:2'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1889.htm'
    quote: 'Of satisfaction over the misfortune of an enemy or rival, Psalm 35:21; Psalm 35:25'
  - where: 'note 25:3 “Aha”'
    claim: 'The word in verse 3 is heʾach'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הֶאָ֜ח'
  - where: 'note 25:3 “Aha”'
    claim: 'Aha expressed malicious joy'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Aha was used as an expression of malicious joy.'
  - where: 'note 25:3 “Aha”'
    claim: 'Tyre says Aha over Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'because that Tyrus hath said against Jerusalem, Aha, she is broken that was the gates of the people'
  - where: 'note 25:3 “Aha”'
    claim: 'The enemy says Aha over the mountains of Israel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'Because the enemy hath said against you, Aha, even the ancient high places are ours in possession'
  - where: 'note 25:3 “Aha”'
    claim: 'The word behind “despite” means despite, contempt, and is listed only at Ezekiel 25:6, 25:15 and 36:5'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7589.htm'
    quote: 'despite, contempt'
  - where: 'note 25:3 “Aha”'
    claim: 'The word of verse 6'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שָֽׁאטְ/ךָ֙'
  - where: 'note 25:3 “Aha”'
    claim: 'The Ammonites descended from Lot'
    key: 'bd-ammon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'A tribe descended from Lot, the nephew of Abraham'
  - where: 'note 25:3 “Aha”'
    claim: 'Zephaniah speaks of Ammon’s revilings'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: 'I have heard the reproach of Moab, and the revilings of the children of Ammon'
  - where: 'note 25:3 “Aha”'
    claim: 'The earlier oracle against Ammon concerned their reproach'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'concerning the Ammonites, and concerning their reproach'

  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'The word translated palaces means an encampment of nomads, and Ezekiel 25:4 is listed under that sense'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2918.htm'
    quote: 'encampment, especially of circular encampment of nomad tribes'
  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'The Hebrew word of verse 4'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'טִירֽוֹתֵי/הֶם֙'
  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'A modern translation has encampments, a pasture for camels, and a fold for flocks'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2025&version=ESV'
    quote: 'they shall set their encampments among you and make their dwellings in your midst'
  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'A modern translation has a pasture for camels in verse 5'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2025&version=ESV'
    quote: 'a pasture for camels'
  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'A modern translation has a fold for flocks in verse 5'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2025&version=ESV'
    quote: 'a fold for flocks'
  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'The men of the east are in Hebrew the sons of the east (bene qedem)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'קֶ֜דֶם'
  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'The same Hebrew name stands behind “children of the east” in Judges 6:3'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'קֶ֖דֶם'
  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'The children of the east came up with Midian and Amalek when Israel had sown'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/6?lang=eng'
    quote: 'when Israel had sown, that the Midianites came up, and the Amalekites, and the children of the east'
  - where: 'note 25:4 “Encampments, not palaces”'
    claim: 'Rabbah was the chief city of the Ammonites'
    key: 'bd-rabbah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: 'Chief city of the Ammonites, in the deep fertile valley of the Upper Jabbock'

  - where: 'note 25:8 “Like all the nations”'
    claim: 'Moab’s saying has been read as despising Israel’s election'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'misunderstanding and despising the divine election of Israel'
  - where: 'note 25:8 “Like all the nations”'
    claim: 'The saying means Judah had no pre-eminence over the nations'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'had no pre-eminence over them, and shared the same fate as they'
  - where: 'note 25:8 “Like all the nations”'
    claim: 'Seir is the mountain ridge of Edom'
    key: 'bd-seir'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/seir?lang=eng'
    quote: 'the mountain ridge that ran south from the Dead Sea through the land of Edom'
  - where: 'note 25:8 “Like all the nations”'
    claim: 'The Septuagint names Moab alone in verse 8'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/25.htm'
    quote: 'Because Moab has said, Behold, are not the house of Israel and Juda like all the other nations?'
  - where: 'note 25:8 “Like all the nations”'
    claim: 'The Septuagint lacks “and Seir”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2025&version=ESV'
    quote: 'Septuagint lacks and Seir'
  - where: 'note 25:8 “Like all the nations”'
    claim: 'One modern translation follows the Greek'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2025&version=NRSVUE'
    quote: 'Because Moab said, “The house of Judah is like all the other nations,”'

  - where: 'note 25:9 “Moab’s shoulder laid open”'
    claim: 'The word is shoulder, here figurative for the side of Moab exposed to invasion'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/3802.htm'
    quote: 'shoulder of Moab Ezekiel 25:9 (figurative, i.e. the side of M. exposed to invasion)'
  - where: 'note 25:9 “Moab’s shoulder laid open”'
    claim: 'The Hebrew word of verse 9'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'כֶּ֤תֶף'
  - where: 'note 25:9 “Moab’s shoulder laid open”'
    claim: 'A modern translation has “lay open the flank”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2025&version=ESV'
    quote: 'I will lay open the flank of Moab from the cities'
  - where: 'note 25:9 “Moab’s shoulder laid open”'
    claim: 'Reuben built Kirjathaim'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'And the children of Reuben built Heshbon, and Elealeh, and Kirjathaim'
  - where: 'note 25:9 “Moab’s shoulder laid open”'
    claim: 'Baal-meon is in the next verse of the same list'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'And Nebo, and Baal-meon, (their names being changed,) and Shibmah'
  - where: 'note 25:9 “Moab’s shoulder laid open”'
    claim: 'Jeremiah’s oracle on Moab lists Kiriathaim'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'And upon Kiriathaim, and upon Beth-gamul, and upon Beth-meon'

  - where: 'note 25:10 “What became of Ammon”'
    claim: 'Josephus dates Nebuchadnezzar’s war on Ammon and Moab to the fifth year after Jerusalem’s destruction'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'year after the destruction of Jerusalem, which was the twenty third of the reign of Nebuchadnezzar'
  - where: 'note 25:10 “What became of Ammon”'
    claim: 'Nebuchadnezzar made war on Ammon and Moab and subjected them'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'he made war against the Ammonites, and Moabites: and when he had brought all those nations under subjection'
  - where: 'note 25:10 “What became of Ammon”'
    claim: 'Ezekiel 25:2–10 is cited for Ammon’s fall under Assyria and Chaldea, after a long independence'
    key: 'bd-ammon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'till they fell under the power of Assyria and Chaldea (2 Kgs. 24:2; Ezek. 25:2–10; Amos 1:13–15; Zeph. 2:8)'
  - where: 'note 25:10 “What became of Ammon”'
    claim: 'Ammon kept its identity until two centuries after Christ'
    key: 'bd-ammon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'Even under foreign rule the obstinate little nation retained its individuality for two centuries after Christ till it disappeared, absorbed by the advance of the Arabs.'
  - where: 'note 25:10 “What became of Ammon”'
    claim: 'The earlier oracle against Ammon ended with the same promise'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'thou shalt be no more remembered'

  - where: 'note 25:12 “What Edom did”'
    claim: 'Psalm 137 is a psalm of the captivity and remembers Edom’s words in the day of Jerusalem'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/137?lang=eng'
    quote: 'the children of Edom in the day of Jerusalem; who said, Rase it, rase it, even to the foundation thereof'
  - where: 'note 25:12 “What Edom did”'
    claim: 'Obadiah says Edom cut off those who escaped'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'Neither shouldest thou have stood in the crossway, to cut off those of his that did escape'
  - where: 'note 25:12 “What Edom did”'
    claim: 'Ezekiel 35 says Edom shed Israel’s blood in the time of their calamity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/35?lang=eng'
    quote: 'hast shed the blood of the children of Israel by the force of the sword in the time of their calamity'
  - where: 'note 25:12 “What Edom did”'
    claim: 'Edom is the name of Esau and his descendants'
    key: 'bd-edom'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'Name of Esau (Gen. 25:30); of his descendants'
  - where: 'note 25:12 “What Edom did”'
    claim: 'Kinship did not prevent hatred between Israel and Edom'
    key: 'bd-edom'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'In spite of the kinship there seems to have been great mutual hatred, and wars were of constant occurrence'
  - where: 'note 25:12 “What Edom did”'
    claim: 'Amos condemned Edom for pursuing his brother, and named Teman'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: 'because he did pursue his brother with the sword'
  - where: 'note 25:12 “What Edom did”'
    claim: 'Jeremiah addresses the inhabitants of Dedan in his oracle on Edom'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'Flee ye, turn back, dwell deep, O inhabitants of Dedan; for I will bring the calamity of Esau upon him'
  - where: 'note 25:12 “What Edom did”'
    claim: 'A modern translation reads from Teman even to Dedan'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2025&version=ESV'
    quote: 'from Teman even to Dedan they shall fall by the sword'

  - where: 'note 25:14 “Edom and the hand of Israel”'
    claim: 'Obadiah gives Esau’s house to the house of Jacob'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble'
  - where: 'note 25:14 “Edom and the hand of Israel”'
    claim: 'Amos has Israel possess the remnant of Edom when David’s tabernacle is raised'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'That they may possess the remnant of Edom, and of all the heathen'
  - where: 'note 25:14 “Edom and the hand of Israel”'
    claim: 'Isaiah 11:14 speaks of Israel when the Lord has gathered it'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'would be successfully attacked and overcome by Israel, when the Lord had gathered it again from its dispersion'
  - where: 'note 25:14 “Edom and the hand of Israel”'
    claim: 'One reading: fulfilment began with the Maccabees but is not limited to that'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'commenced with the subjugation of the Edomites by the Maccabees; but it is not to be limited to that event'
  - where: 'note 25:14 “Edom and the hand of Israel”'
    claim: 'The complete fulfilment is placed when the kingdom of God is perfected'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'at the time when the kingdom of God is perfected'
  - where: 'note 25:14 “Edom and the hand of Israel”'
    claim: 'Edom stands as a type of the world’s enmity toward God’s people'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'as a type of the implacable enmity of the heathen world towards the people and kingdom of God'
  - where: 'note 25:14 “Edom and the hand of Israel”'
    claim: 'Idumea is Edom’s other name, and modern revelation uses it for the world'
    key: 'bd-idumea'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/idumea?lang=eng'
    quote: 'In D&C 1:36 Idumea is used to represent the world.'

  - where: 'note 25:14 “Vengeance for vengeance”'
    claim: 'In Edom’s case the refrain takes a harsher form'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'in the case of Edom (Ezekiel 25:14) the formula takes a harsher form'
  - where: 'note 25:14 “Vengeance for vengeance”'
    claim: 'Edom’s “taking vengeance” (verse 12) and the Lord’s “my vengeance” (verse 14) are the same root; this is the verb of verse 12'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'בִּ/נְקֹ֥ם'
  - where: 'note 25:14 “Vengeance for vengeance”'
    claim: 'The noun “my vengeance” in verse 14'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נִקְמָתִ֜/י'
  - where: 'note 25:14 “Vengeance for vengeance”'
    claim: 'The formula returns for all seven nations'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'This formula regularly returns in the case of all the nations'
  - where: 'note 25:14 “Vengeance for vengeance”'
    claim: 'One reading: the nations will recognize God’s punitive righteousness, with no prospect of salvation implied'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/25.htm'
    quote: 'these nations will discern in their destruction the punitive righteousness of God, so that it presents no prospect of future salvation'
  - where: 'note 25:14 “Vengeance for vengeance”'
