chapter: 46
claims:
  - where: 'when'
    claim: 'Chapters 40–48 stand under the date of 40:1, the twenty-fifth year of the captivity and the fourteenth after the city was smitten'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'
  - where: 'setting'
    claim: 'The glory of the Lord has returned to the house, by the east gate'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And the glory of the Lord came into the house by the way of the gate whose prospect is toward the east.'
  - where: 'setting'
    claim: 'Ezekiel received the laws of 44:5–46:18 standing in front of the house; 47:1 has him led back to the door of the house'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'since Ezekiel had received the sacrificial thorah (Ezekiel 44:5-46:18) in front of the house (Ezekiel 44:4)'
  - where: 'setting'
    claim: '47:1 begins with Ezekiel led back to the door of the house'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: '"he led me back to the door of the house" (Ezekiel 47:1)'
  - where: 'setting'
    claim: 'Chapter 45 assigns the prince a portion beside the holy portion and the city'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'And a portion shall be for the prince on the one side and on the other side of the oblation of the holy portion, and of the possession of the city'
  - where: 'setting'
    claim: 'It is the prince’s part to give the offerings at feasts, new moons and sabbaths'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'And it shall be the prince’s part to give burnt offerings, and meat offerings, and drink offerings, in the feasts, and in the new moons, and in the sabbaths'
  - where: 'setting'
    claim: 'Chapter 45 appointed the sacrifices of the yearly feasts before this chapter turns to the Sabbath and new moon'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'after the appointment of the sacrifices to be offered at the yearly feasts (Ezekiel 45:18-25), and before the regulation of the sacrifices for the Sabbath and new moon (Ezekiel 46:4-7)'
  - where: 'setting'
    claim: 'The earlier description of the temple buildings passed over the kitchens, which are added here'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'In the list and description of the subordinate buildings of the temple, the sacrificial kitchens are passed over; and they are therefore referred to here again in a supplementary manner.'
  - where: 'thread'
    claim: 'Verses 16–18 concern the prince’s right to hand down or give away his land; 19–24 describe kitchens for priests and people'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'a regulation pointing back to Ezekiel 45:7-9, concerning the right of the prince to hand down or give away his landed property (Ezekiel 46:16-18); and a brief description of the sacrificial kitchens for priests and people'
  - where: 'note 46:1 “A gate that opens on holy days”'
    claim: 'The outer east gate is shut permanently because the Lord entered by it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the Lord, the God of Israel, hath entered in by it, therefore it shall be shut.'
  - where: 'note 46:1 “A gate that opens on holy days”'
    claim: 'The glory came into the house by the east gate'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And the glory of the Lord came into the house by the way of the gate whose prospect is toward the east.'
  - where: 'note 46:1 “A gate that opens on holy days”'
    claim: 'The law appointed special sacrifices at the new moon'
    key: 'bd-new-moon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/new-moon?lang=eng'
    quote: 'The law appointed that at the new moon special sacrifices should be offered'
  - where: 'note 46:1 “A gate that opens on holy days”'
    claim: 'The prophets often name new moons with Sabbaths'
    key: 'bd-new-moon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/new-moon?lang=eng'
    quote: 'The prophets often speak of “new moons” along with “Sabbaths.”'
  - where: 'note 46:1 “A gate that opens on holy days”'
    claim: 'Numbers calls the new moons the beginnings of the months'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'And in the beginnings of your months ye shall offer a burnt offering unto the Lord'
  - where: 'note 46:2 “How near the prince may come, and who he is”'
    claim: 'The outer east gate is for the prince to sit in and eat bread before the Lord'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'It is for the prince; the prince, he shall sit in it to eat bread before the Lord'
  - where: 'note 46:2 “How near the prince may come, and who he is”'
    claim: 'The prince goes no further than the post of the gate, as the people’s representative; the inner court is the priests’'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/46.htm'
    quote: 'he is to go no further, but "stand by the post"'
  - where: 'note 46:2 “How near the prince may come, and who he is”'
    claim: 'The inner court belongs to the priests; the prince presents his offerings as representative of the people'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/46.htm'
    quote: 'the court within belonging exclusively to the priests. There, as representative of the people'
  - where: 'note 46:2 “How near the prince may come, and who he is”'
    claim: 'The same commentary takes the prince’s sons as a further argument'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/46.htm'
    quote: 'The mention of the prince''s sons is another argument against Messiah being meant'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'The law’s Sabbath offering was two lambs'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'And on the sabbath day two lambs of the first year without spot'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'The law’s new moon offering was two bullocks, a ram and seven lambs'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'two young bullocks, and one ram, seven lambs of the first year without spot'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'The law added a kid of the goats as a sin offering at the new moon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'And one kid of the goats for a sin offering unto the Lord shall be offered, beside the continual burnt offering'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'The law required a lamb morning and evening'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'The one lamb shalt thou offer in the morning, and the other lamb shalt thou offer at even;'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'The law’s daily meat offering was a tenth of an ephah with a fourth of a hin of oil'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'And a tenth part of an ephah of flour for a meat offering, mingled with the fourth part of an hin of beaten oil.'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'Ezekiel’s Sabbath offering is larger than the law’s; the new moon offering is reduced and omits the sin offering'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'the thorah of Ezekiel, on the contrary, omits the sin-offering, and reduces the burnt-offering to one bullock, one ram, and six lambs'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'The Sabbath burnt offering is considerably increased'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'The burnt-offering for the Sabbath is considerably increased when compared with that appointed in the Mosaic law.'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'The omission of the evening sacrifice is judged deliberate; the daily meat offering is increased'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'the silence as to the evening sacrifice is not a mere oversight of the matter, but that in the new order of worship the evening sacrifice is to be omitted'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'The daily meat offering is increased from a tenth to a sixth of an ephah and from a fourth to a third of a hin'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'The new thorah omits the evening sacrifice, but increases the meat-offering to the sixth of an ephah of meal and the third of a hin of oil'
  - where: 'note 46:4 “Not the offerings of the law of Moses”'
    claim: 'One explanation of the larger Sabbath offering'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/46.htm'
    quote: 'The offerings on Sabbaths are larger than those of the Mosaic law, to imply that the worship of God is to be conducted by the prince and people in a more munificent spirit of self-sacrificing liberality than formerly.'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: '“Meat” is used in the older sense of food; the Hebrew is minchah, chiefly of grain'
    key: 'bd-meat-offering'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'Hebrew minchah. The English word meat in this context is used in the older sense of “food.” The Minchah consisted chiefly of grain'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: 'No burnt or peace offering was complete without it'
    key: 'bd-meat-offering'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'no burnt or peace offering was complete without it'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: 'A modern translation has “grain offering” and “as much as he wishes to give”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2046&version=NRSVUE'
    quote: 'the grain offering with the lambs shall be as much as he wishes to give, together with a hin of oil to each ephah'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: 'An ephah is a dry measure, a tenth of a homer'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Ephah (dry). Said to be equivalent to a bath; one-tenth of a homer.'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: 'A homer is believed to be 230 liters'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'A homer is also believed to be 230 liters'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: 'Biblical measures varied from time to time'
    key: 'bd-weights-and-measures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'varied from time to time, which makes it difficult to arrive at a correct understanding of these things today'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: 'The hin is a liquid measure of about six liters'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1969.htm'
    quote: 'hin, a liquid measure'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: 'The Hebrew hin is reckoned at 6.06 litres'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1969.htm'
    quote: 'the Hebrew hin (6.06 litres) was, however, much larger than the Egyptian hin'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: '“To temper” is to moisten the flour'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2046&version=NRSVUE'
    quote: 'one-sixth of an ephah and one-third of a hin of oil to moisten the choice flour'
  - where: 'note 46:9 “In by one gate and out by the other”'
    claim: '“Solemn feasts” are the appointed festivals'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2046&version=NRSVUE'
    quote: 'When the people of the land come before the Lord at the appointed festivals'
  - where: 'note 46:9 “In by one gate and out by the other”'
    claim: 'The law required attendance three times a year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/16?lang=eng'
    quote: 'Three times in a year shall all thy males appear before the Lord thy God in the place which he shall choose'
  - where: 'note 46:9 “In by one gate and out by the other”'
    claim: 'The practical reason given for the one-way rule'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/46.htm'
    quote: 'in order that, in such a throng as should attend the festivals, the ingress and egress should be the more unimpeded, those going out not being in the way of those coming in'
  - where: 'note 46:9 “In by one gate and out by the other”'
    claim: 'At the feasts the prince joins the crowd'
    key: 'jfb-ezekiel'
    url: 'https://biblehub.com/commentaries/jfb/ezekiel/46.htm'
    quote: 'not isolated as at other times, but joining the great throng of worshippers'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: 'The Hebrew for “liberty” in verse 17 is deror'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'דְּר֔וֹר'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: 'The year of liberty is the year of jubilee; the word is that of Leviticus 25:10'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1865.htm'
    quote: 'Ezekiel 46:17 i.e. year of Jubilee (cf Leviticus 25:10)'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: 'The jubilee law proclaims liberty in the fiftieth year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'And ye shall hallow the fiftieth year, and proclaim liberty throughout all the land unto all the inhabitants thereof'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: 'In the jubilee land reverted to its original family'
    key: 'bd-jubilee-year-of'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jubilee-year-of?lang=eng'
    quote: 'In it land that had changed hands, except in non-Levitical walled cities, reverted to the family to which it had belonged at the original settlement'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: 'The prince was assigned his own portion'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'And a portion shall be for the prince on the one side and on the other side of the oblation of the holy portion'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: 'The promise that the princes would no more oppress'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'In the land shall be his possession in Israel: and my princes shall no more oppress my people'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: 'Samuel’s warning about a king taking fields and giving them to his servants'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: 'And he will take your fields, and your vineyards, and your oliveyards, even the best of them, and give them to his servants.'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: '1 Samuel 8:14 is compared with this law; the prince’s portion was given so that he would not seize land as former princes had'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'that he might not seize upon a possession by force, as the former princes had done'
  - where: 'note 46:17 “The year of liberty and the prince’s land”'
    claim: 'The commentary cites 1 Samuel 8:14 on verse 18'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'compare Ezekiel 45:8, and such passages as 1 Samuel 8:14; 1 Samuel 22:7'
  - where: 'explore'
    claim: 'The Church footnote on “oppression” (18b) gives Mosiah 2:14; King Benjamin laboured so his people would not be laden with taxes'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'And even I, myself, have labored with mine own hands that I might serve you, and that ye should not be laden with taxes'
  - where: 'note 46:20 “Two kinds of kitchen”'
    claim: 'The kitchens in the corners of the outer court were for the sacrificial meals that went with the peace offerings (shelamim), held by those who presented them'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/46.htm'
    quote: 'kitchens were required for the preparation of the sacrificial meals, which were connected with the offering of the shelamim, and were held by those who presented them'
  - where: 'note 46:5 “A meat offering of flour and oil”'
    claim: 'Another estimate of the hin is about 3.5 liters'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2046&version=ESV'
    quote: 'A hin was about 4 quarts or 3.5 liters'
  - where: 'note 46:20 “Two kinds of kitchen”'
    claim: 'The priests are not to sanctify the people with their garments'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'and they shall put on other garments; and they shall not sanctify the people with their garments'
  - where: 'note 46:20 “Two kinds of kitchen”'
    claim: 'A modern translation: “communicate holiness to the people”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2046&version=NRSVUE'
    quote: 'in order not to bring them out into the outer court and so communicate holiness to the people'
  - where: 'note 46:20 “Two kinds of kitchen”'
    claim: 'The remainder of the meal offering was eaten by the priests in a holy place'
    key: 'bd-sacrifices'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'the remainder was eaten by the priests in a holy place'
  - where: 'note 46:20 “Two kinds of kitchen”'
    claim: 'The flesh of the sin offering was eaten in a holy place by the priest and his sons'
    key: 'bd-sacrifices'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The remainder of the flesh was eaten in a holy place by the priest and his sons.'
  - where: 'note 46:20 “Two kinds of kitchen”'
    claim: 'Only the peace offering ended in a meal for the sacrificer'
    key: 'bd-sacrifices'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The sacrificial meal (in the case of the peace offering only). The fat having been burnt and the priests’ pieces removed, the rest of the flesh was eaten by the sacrificer, his household, and the poorer Levites at the tabernacle.'
  - where: 'note 46:20 “Two kinds of kitchen”'
    claim: 'The characteristic rite of the peace offering was the meal, a symbol of fellowship'
    key: 'bd-sacrifices'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The characteristic rite was the sacrificial meal. A feast symbolized fellowship and friendship among all its partakers and providers'
  - where: 'note 46:22 “An uncertain word for the corner courts”'
    claim: 'The Hebrew word in verse 22 is qeturot'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'קְטֻר֔וֹת'
  - where: 'note 46:22 “An uncertain word for the corner courts”'
    claim: 'The lexicon gives “enclosed courts” but would probably read a word meaning “small,” with the Greek'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7000.htm'
    quote: 'Ezekiel 46:22 enclosed courts'
  - where: 'note 46:22 “An uncertain word for the corner courts”'
    claim: 'The lexicon prefers the reading “small”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7000.htm'
    quote: 'but read probably'
  - where: 'note 46:22 “An uncertain word for the corner courts”'
    claim: 'A modern translation has “small courts,” from the Greek, Syriac and Vulgate'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2046&version=NRSVUE'
    quote: 'in the four corners of the court were small courts, forty cubits long and thirty wide'
  - where: 'note 46:22 “An uncertain word for the corner courts”'
    claim: 'Its footnote marks the Hebrew as uncertain'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2046&version=NRSVUE'
    quote: 'Gk Syr Vg: Meaning of Heb uncertain'
  - where: 'note 46:22 “An uncertain word for the corner courts”'
    claim: 'Another modern translation has the same, with the same caution'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2046&version=ESV'
    quote: 'Septuagint, Syriac, Vulgate; the meaning of the Hebrew word is uncertain'
  - where: 'christ'
    claim: 'The glory came in by the east gate'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'And the glory of the Lord came into the house by the way of the gate whose prospect is toward the east.'
  - where: 'christ'
    claim: 'The outer east gate is shut because the Lord entered by it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'because the Lord, the God of Israel, hath entered in by it, therefore it shall be shut'
  - where: 'christ'
    claim: 'Sacrifices from Adam on were a similitude of the sacrifice of the Only Begotten'
    key: 'bd-sacrifices'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'offering the firstlings of their flocks in a similitude of the sacrifice that would be made of the Only Begotten Son of God (Moses 5:4–8)'
  - where: 'christ'
    claim: 'Peter speaks of Christ as a lamb without blemish'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/1?lang=eng'
    quote: 'But with the precious blood of Christ, as of a lamb without blemish and without spot:'
  - where: 'explore'
    claim: 'The law’s daily offering is called a continual burnt offering'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'This shall be a continual burnt offering throughout your generations at the door of the tabernacle of the congregation before the Lord'
