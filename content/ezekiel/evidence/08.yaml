    key: 'clarke-ezekiel'
    url: 'https://biblehub.com/commentaries/clarke/ezekiel/8.htm'
    quote: 'It is very likely that these images pourtrayed on the wall were the objects of Egyptian adoration'
  - where: 'note 8:10 “Pictures of animals on the wall”'
