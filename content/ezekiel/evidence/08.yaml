    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'in this spot, with their backs to the temple, the adoration of the sun took place, as complete a renunciation of Yahweh [Jehovah] as possible'
  - where: 'note 8:16 “Backs to the temple, faces to the sun”'
    claim: 'The place was where priests offered prayer, facing the temple'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Between the porch and the altar was the place where the priests offered prayer (Joel 2:17), with their faces, of course, towards the Temple'
  - where: 'note 8:16 “Backs to the temple, faces to the sun”'
