  - where: 'note 8:14 “Who Tammuz was”'
    claim: 'Tammuz was a Babylonian god, the Greek Adonis; the weeping was an autumn festival; the month name is later'
    key: 'bd-tammuz'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tammuz?lang=eng'
    quote: 'Greek Adonis. The Babylonian god of spring slain by summer heat, or the god of summer slain by winter cold.'
  - where: 'note 8:14 “Who Tammuz was”'
    claim: 'The Bible Dictionary places the weeping in the autumn'
    key: 'bd-tammuz'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tammuz?lang=eng'
    quote: 'The “weeping for Tammuz” was a festival in the autumn, a lament over the season’s decline (Ezek. 8:14). Tammuz was the Jewish name for June or July after the Captivity.'
  - where: 'note 8:14 “Who Tammuz was”'
    claim: 'The myth: his early death and Istar’s descent; his death stood for the spring growth destroyed by summer heat; seven days of women’s mourning in the fourth month'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'the myth regarding him told of his early death and of the descent of Istar his bride into the underworld in search of him. The death of Tammuz symbolised the destruction of the spring vegetation by the heat of summer'
  - where: 'note 8:14 “Who Tammuz was”'
    claim: 'The manual’s source places the mourning in the fourth month, June–July'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'it was celebrated annually by seven days of women’s mourning in the 4th month (June–July), which was called Tammuz'
  - where: 'note 8:14 “Who Tammuz was”'
    claim: 'Tammuz was worshipped in Babylonia and in Phoenicia'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'a deity worshipped both in Babylonia and in Phoenicia'
  - where: 'note 8:14 “Who Tammuz was”'
    claim: 'The name occurs once in Ezekiel (hebrew.mjs --word 8542: one occurrence, 8:14)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תַּמּֽוּז'

