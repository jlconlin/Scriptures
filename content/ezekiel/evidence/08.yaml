  - where: 'note 8:8 “Why Ezekiel has to dig, and whether the scenes are literal”'
    claim: 'The cell is hidden so that the prophet must enlarge the hole to see the door'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/8.htm'
    quote: 'the cell is so completely hidden in the wall, that the prophet is obliged to enlarge the hole by breaking through the wall before he can see the door'
  - where: 'note 8:8 “Why Ezekiel has to dig, and whether the scenes are literal”'
    claim: 'The four scenes are the form of the vision, on this reading'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/8.htm'
    quote: 'belong to the visionary drapery of this divine revelation. It is altogether erroneous to interpret the vision as signifying that all these forms of idolatry were practised in the temple itself'
  - where: 'note 8:8 “Why Ezekiel has to dig, and whether the scenes are literal”'
    claim: 'Seventy-one men could not have fitted in a gate cell; the scene shows what the elders did secretly through the land'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/8.htm'
    quote: 'is one feature in the visionary form given to the revelation of what the elders of the people were doing secretly throughout the whole land'
  - where: 'note 8:8 “Why Ezekiel has to dig, and whether the scenes are literal”'
    claim: 'The cells at the gates were too small for seventy-one men'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/8.htm'
    quote: 'the cells and recesses at the gates cannot have been large enough to allow of seventy-one men taking part in a festive idolatrous service'
  - where: 'note 8:8 “Why Ezekiel has to dig, and whether the scenes are literal”'
    claim: 'The temple is chosen as the setting because Israel was called to worship there'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/8.htm'
    quote: 'arises from the fact that the temple was the place where Israel was called to worship the Lord its God'
  - where: 'note 8:8 “Why Ezekiel has to dig, and whether the scenes are literal”'
    claim: 'Chronicles, in its account of the kingdom’s end, says priests and people polluted the temple'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'Moreover all the chief of the priests, and the people, transgressed very much after all the abominations of the heathen'
  - where: 'note 8:8 “Why Ezekiel has to dig, and whether the scenes are literal”'
    claim: '2 Chronicles 36 tells of Judah’s last kings and Nebuchadnezzar’s conquest'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'Various kings rule in Judah—Nebuchadnezzar overruns Judah'

