chapter: 19
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is the sixth year, sixth month (8:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'when'
    claim: 'The next date in the book is the seventh year (20:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month'
  - where: 'when'
    claim: 'The years are counted from Jehoiachin’s captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C., so the sixth year is about 591 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'setting'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'The siege is dated to the ninth year (24:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month'
  - where: 'setting'
    claim: 'Jehoahaz reigned three months'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'Jehoahaz was twenty and three years old when he began to reign; and he reigned three months in Jerusalem.'
  - where: 'setting'
    claim: 'Pharaoh made Jehoiakim king and took Jehoahaz to Egypt'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And Pharaoh-nechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim, and took Jehoahaz away: and he came to Egypt, and died there.'
  - where: 'setting'
    claim: 'Jehoiakim reigned eleven years'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'Jehoiakim was twenty and five years old when he began to reign, and he reigned eleven years in Jerusalem'
  - where: 'setting'
    claim: 'Jehoiachin, his son, reigned three months and was carried to Babylon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Jehoiachin was eighteen years old when he began to reign, and he reigned in Jerusalem three months.'
  - where: 'setting'
    claim: 'Jehoiachin was carried to Babylon with the captives'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And he carried away Jehoiachin to Babylon, and the king’s mother, and the king’s wives, and his officers, and the mighty of the land'
  - where: 'setting'
    claim: 'Nebuchadnezzar made Zedekiah, Jehoiachin’s uncle, king'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah.'
  - where: 'setting'
    claim: 'Zedekiah was the last king of Judah'
    key: 'bd-zedekiah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'The last king of Judah, his name changed from Mattaniah to Zedekiah'
  - where: 'setting'
    claim: 'The lament closes the preceding prophecies of Judah’s overthrow'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/19.htm'
    quote: 'forms a finale to the preceding prophecies of the overthrow of Judah'
  - where: 'setting'
    claim: 'Chapter 17 is a parable of Israel subject to Babylon seeking help from Egypt, with its explanation'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/17?lang=eng'
    quote: 'Say now to the rebellious house, Know ye not what these things mean?'
  - where: 'setting'
    claim: 'Later passages called lamentations are over Tyre, its king, and Pharaoh'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7015.htm'
    quote: 'Ezekiel 26:17; Ezekiel 27:2; Ezekiel 28:12; Ezekiel 32:2'
  - where: 'thread'
    claim: 'The song passes from the fate of the princes to the fate of the kingdom and people'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/19.htm'
    quote: 'From the lamentable fate of the princes transported to Egypt and Babylon, the ode passes to a description of the fate, which the lion-like rapacity of the princes is preparing for the kingdom and people.'
  - where: 'thread'
    claim: 'The picture from verse 12 on was still future in part when spoken'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/19.htm'
    quote: 'The picture from Ezekiel 19:12 onwards is prophetic.'
  - where: 'thread'
    claim: 'Jehoahaz died in Egypt; Jehoiachin was carried to Babylon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And he carried away Jehoiachin to Babylon'
  - where: 'note 19:1 “A funeral song for a royal house”'
    claim: 'Qinah means elegy or dirge; it is the word of 2 Samuel 1:17'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7015.htm'
    quote: 'elegy, dirge 2 Samuel 1:17; Ezekiel 19:14 (twice in verse); Ezekiel 32:16'
  - where: 'note 19:1 “A funeral song for a royal house”'
    claim: 'The Hebrew word in 19:1 is qinah (H7015)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'קִינָ֔ה'
  - where: 'note 19:1 “A funeral song for a royal house”'
    claim: 'The lexicon counts Ezekiel 19:2 and following as five-beat lines, like Lamentations (three and two beats)'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7015.htm'
    quote: 'Amos 5:2; Ezekiel 19:2ff. Ezekiel 26:17b ff. are pentameter'
  - where: 'note 19:1 “A funeral song for a royal house”'
    claim: 'The five beats are three and two, sometimes two and three'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/7015.htm'
    quote: 'is in all parts pentameter, 3 2 varying sometimes with 2+ 3, yet always 5 in line'
