  - where: 'note 19:1 “A funeral song for a royal house”'
    claim: 'The NRSVUE puts the closing clause in the present'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2019&version=NRSVUE'
