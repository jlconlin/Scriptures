chapter: 28
claims:
  - where: 'when'
    claim: 'The nearest date above the chapter is 26:1, the eleventh year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'And it came to pass in the eleventh year, in the first day of the month'
  - where: 'when'
    claim: 'The next date in the book, 29:1, is the tenth year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'In the tenth year, in the tenth month, in the twelfth day of the month'
  - where: 'when'
    claim: 'The book counts from Jehoiachin’s captivity; the fifth year is 592 B.C., so the eleventh is about 586 B.C.'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'
  - where: 'when'
    claim: 'The book’s first date is the fifth year of Jehoiachin’s captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'setting'
    claim: 'Chapters 25–32 are the prophecies against Israel’s enemies'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(2) 25–32, prophecies against Israel’s enemies'
  - where: 'setting'
    claim: 'The nations addressed in chapters 25–32'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'These eight chapters contain prophecies against several foreign nations: Ammon, Moab, Edom, Philistia, Tyre, Sidon, and Egypt.'
  - where: 'setting'
    claim: 'Chapter 26 gives Tyre’s offence against Jerusalem and names Nebuchadrezzar'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'Behold, I will bring upon Tyrus Nebuchadrezzar king of Babylon'
  - where: 'setting'
    claim: 'Chapter 27 is a lamentation for Tyre'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'Now, thou son of man, take up a lamentation for Tyrus'
  - where: 'setting'
    claim: 'Tyre was a commercial seaport, allied with David and Solomon'
    key: 'bd-tyre'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng'
    quote: 'an important commercial and seaport town of Syria, in alliance with David (2 Sam. 5:11; 1 Chr. 14:1); with Solomon'
  - where: 'setting'
    claim: 'The Phoenicians were a commercial people with trading stations across the Mediterranean'
    key: 'bd-phoenicia'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phoenicia?lang=eng'
    quote: 'They were a great commercial people, distributing the wares of Egypt and Babylon, and having trading stations all over the Mediterranean'
  - where: 'setting'
    claim: 'Zidon was in ancient times the most important city of Phoenicia'
    key: 'bd-zidon'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zidon?lang=eng'
    quote: 'In ancient times it was the most important city of Phoenicia'
  - where: 'setting'
    claim: 'The Bible Dictionary dates the second large deportation from Judah to 586 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'thread'
    claim: 'The heart “lifted up” is named in verses 2, 5 and 17, and the refrain of knowing the LORD comes in verses 22, 23, 24 and 26'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/28?lang=eng'
    quote: 'Thine heart was lifted up because of thy beauty'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'The word for “prince” in 28:2 is nagid (H5057); it occurs in Ezekiel only here (scripts/hebrew.mjs ezekiel --word 5057)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נְגִ֨יד'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'The word for “king” in 28:12 is melek (H4428)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מֶ֣לֶךְ'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'The lexicon glosses nagid as leader, ruler, prince'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5057.htm'
    quote: 'noun masculine leader (literally probably one in front), ruler, prince'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'The lexicon lists Ezekiel 28:2 as a use of the word of a foreign ruler'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5057.htm'
    quote: 'of a foreign ruler or prince Ezekiel 28:2; Daniel 9:25,26.'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'Josephus introduces the passage as the records of the Phoenicians'
    key: 'josephus-apion'
    url: 'https://penelope.uchicago.edu/josephus/apion-1.html'
    quote: 'I will now add the records of the Phenicians'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'Those records put Nebuchadnezzar’s thirteen-year siege of Tyre in the days of king Ithobal'
    key: 'josephus-apion'
    url: 'https://penelope.uchicago.edu/josephus/apion-1.html'
    quote: 'Nabuchodonosor besieged Tyre for thirteen years, in the days of Ithobal, their King.'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'The ruler is “prince” in verse 2 and “king” in verse 12, and is not named'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/28?lang=eng'
    quote: 'Son of man, take up a lamentation upon the king of Tyrus'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'Keil: the threat applies not to the one king Ithobal but to the king as founder of Tyre’s might'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/28.htm'
    quote: 'the whole of this threat applies, not to the one king, Ithobal, who was reigning at the time of the siege of Tyre by the Chaldeans, but to the king as the founder and creator of the might of Tyre'
  - where: 'note 28:2 “The ruler of Tyre”'
    claim: 'Keil: that is, to the royalty that was to perish with Tyre'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/28.htm'
    quote: 'to the supporter of that royalty which was to perish along with Tyre itself'
  - where: 'note 28:2 “A throne in the heart of the seas”'
