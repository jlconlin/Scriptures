    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'יַמִּ֑ים'
  - where: 'note 28:2 “A throne in the heart of the seas”'
    claim: 'The same two Hebrew words (H3820, H3220) end 28:8'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'יַמִּֽים'
  - where: 'note 28:2 “A throne in the heart of the seas”'
    claim: '“Man” in “thou art a man, and not God” is adam (H120), the word in “son of man” at the head of the verse; the clause is four Hebrew words'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אָדָם֙'
  - where: 'note 28:2 “A throne in the heart of the seas”'
    claim: 'A modern translation has “in the heart of the seas” and “the seat of the gods”'
    key: 'esv'
