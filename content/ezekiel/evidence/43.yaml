    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'the keepers of the charge of the altar: these are the sons of Zadok among the sons of Levi'

  # ---- note 43:26 ----
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'The altar of the tabernacle was consecrated before use, as this one is to be'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'so also is the altar of burnt-offering in the new sanctuary to be consecrated before it is used'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'Moses performed the whole consecration of the tabernacle altar'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'At the altar in the tabernacle Moses performed the whole act of consecration, as the mediator of the covenant'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'Ezekiel was to do it through the priests'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'he was to do it through the medium of the priests'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'The command is given to Ezekiel as a prophet, not as the nation’s representative'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'not as the representative of the nation, but as a prophet'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'Nothing is said here of anointing the altar'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'nothing is said about the anointing of the altar'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'The priests are already in office; only the altar is consecrated'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'Here, on the contrary, the existence of the priesthood is presupposed, and only the altar is consecrated.'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: '“Purge” in 43:20 and 43:26 is the verb kipper (H3722)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'יְכַפְּרוּ֙'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'With the sin offering, kipper means purge, as Ezekiel 43:20, 26 show'
    key: 'milgrom-temple'
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'kipper means “purge” and nothing else, as indicated by its synonyms'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'The English Standard Version renders the verb “make atonement” and notes the Hebrew “fill its hand”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=ESV'
    quote: 'Hebrew fill its hand'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'The English Standard Version: “and so consecrate it”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=ESV'
    quote: 'Seven days shall they make atonement for the altar and cleanse it, and so consecrate it.'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'The verb in 43:26 is “fill” (H4390) with “hand”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מִלְא֖וּ'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'Exodus 29:9, of consecrating Aaron and his sons, has the same verb with “hand”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'מִלֵּאתָ֥'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: '“Fill the hand” is the idiom for consecrating'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4390.htm'
    quote: '(literally fill the hand) Exodus 32:29'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'The idiom comes from the consecration of priests; applied to the altar it means supplying it with offerings'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'Filling the hand of the altar, therefore, is equivalent to providing it with sacrificial gifts'
  - where: 'note 43:26 “The altar made ready as Moses made his”'
    claim: 'The Church edition’s footnotes on verses 25 and 27 point to Exodus 29:35–36, Leviticus 8:33 and Leviticus 9:1'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'Ex. 29:35 (35–36); Lev. 8:33.'

