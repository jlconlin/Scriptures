chapter: 43
claims:
  - where: 'when'
    claim: 'The vision of chapters 40–48 is dated to the twenty-fifth year of the captivity, the fourteenth after the city was smitten'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten'

  - where: 'setting'
    claim: 'In the vision Ezekiel is set on a very high mountain in the land of Israel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/40?lang=eng'
    quote: 'In the visions of God brought he me into the land of Israel, and set me upon a very high mountain'
  - where: 'setting'
    claim: 'After the description of the building the vision sets out the ordinances of the altar, the duties of priests and Levites, and the regulations for offerings and feasts (Talmage, as the manual prints him)'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'the ordinances of the altar, the duties of the priests, the ministry of the Levites, the regulations governing oblations and feasts were all set forth'
  - where: 'setting'
    claim: 'The vision in which the glory left is dated to the sixth year (nineteen years before the twenty-fifth)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'setting'
    claim: 'The glory left the temple in the earlier vision and returns in chapter 43'
    key: 'shannon-location'
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'The divine glory had led left the temple in chapter 10, but in chapter 43 it returns to the temple'

  - where: 'thread'
    claim: 'Verses 7–10 warn against the ways that made the Lord leave, but the message is one of return'
    key: 'shannon-location'
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'returning to the ways that caused the Lord to leave the temple in the first place, but the message is one of return'
  - where: 'thread'
    claim: 'The consecration of the altar takes seven days, and the regular offerings begin on the eighth'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'The consecration of the altar was completed in seven days; and from the eighth day onwards the priests were to offer the regular sacrifices upon it'

  - where: 'section 4 plain'
    claim: '“Settle” may be rendered “ledge” (the Church edition’s footnote 14a)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'OR ledge, border.'

  # ---- note 43:2 glory ----
  - where: 'note 43:2 “Back by the way it left”'
    claim: 'The return of the glory signifies that the temple is again a fit place for Jehovah’s presence'
    key: 'shannon-location'
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'signifying that this temple is once again an acceptable place for Jehovah’s presence to dwell'
  - where: 'note 43:2 “Back by the way it left”'
    claim: 'Ezekiel joins this vision to the earlier one in verse 3'
    key: 'shannon-location'
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'In Ezekiel 43:3, the prophet explicitly connects this vision to his previous vision.'
  - where: 'note 43:2 “Back by the way it left”'
    claim: 'Entering the ancient temple was a movement from east to west'
    key: 'shannon-location'
    url: 'https://rsc.byu.edu/jacob/location-location-location'
    quote: 'Entrance into the ancient temple was a movement from east to west, mirroring the movement of the sun.'
  - where: 'note 43:2 “Back by the way it left”'
    claim: 'The verb “filled” is the one used of the glory filling the tabernacle and Solomon’s temple, and of Ezekiel 43:5'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/4390.htm'
    quote: 'filling tabernacle and temple; Exodus 40:34,35 (P) 1 Kings 8:10,11'
  - where: 'note 43:2 “Back by the way it left”'
    claim: 'The Church edition’s footnote on “glory” in verse 5 points to 1 Kings 8:10–11'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: '1 Kgs. 8:11 (10–11); Ezek. 44:4.'
  - where: 'note 43:2 “Back by the way it left”'
    claim: 'The east gate is afterward shut because the Lord entered by it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the Lord, the God of Israel, hath entered in by it, therefore it shall be shut.'

  # ---- note 43:2 voice ----
  - where: 'note 43:2 “The sound of many waters”'
    claim: 'The Hebrew noun qol means both sound and voice'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6963.htm'
    quote: 'sound, voice'
  - where: 'note 43:2 “The sound of many waters”'
    claim: 'The English Standard Version takes it as the sound of the approach'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=ESV'
    quote: 'the sound of his coming was like the sound of many waters'
  - where: 'note 43:2 “The sound of many waters”'
    claim: 'In the first vision the noise like great waters was of the creatures’ wings'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'I heard the noise of their wings, like the noise of great waters, as the voice of the Almighty'
  - where: 'note 43:2 “The sound of many waters”'
    claim: 'The Church edition’s footnote at D&C 110:3 (“voice”) cites Ezekiel 43:2'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Ezek. 1:24; 43:2; Rev. 1:15; D&C 133:22.'
  - where: 'note 43:2 “The sound of many waters”'
    claim: 'The Church edition’s footnote at Ezekiel 43:2 (“voice”) cites D&C 110:3'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/43?lang=eng'
    quote: 'Ezek. 1:24; Rev. 1:15; D&C 110:3.'
  - where: 'note 43:2 “The sound of many waters”'
    claim: 'The vision of D&C 110 was given to Joseph Smith and Oliver Cowdery in the Kirtland Temple on April 3, 1836'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Visions manifested to Joseph Smith the Prophet and Oliver Cowdery in the temple at Kirtland, Ohio, April 3, 1836.'
  - where: 'note 43:2 “The sound of many waters”'
    claim: 'The Student Manual, on Ezekiel 43:1–5, says the Lord’s glory has filled all temples built in His name and by His authority, citing D&C 110:1–5 among others'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Unquestionably, His glory has filled all of the temples that have been built in His name and by His authority.'

  # ---- note 43:3 ----
  - where: 'note 43:3 “Ezekiel did not destroy the city”'
    claim: 'The Hebrew of 43:3 has a first-person suffix (“when I came”) and the verb shachat, “destroy” (H7843)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שַׁחֵ֣ת'
  - where: 'note 43:3 “Ezekiel did not destroy the city”'
    claim: '“Destroy” in Ezekiel’s cry at 9:8 is the same verb (H7843)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מַשְׁחִ֣ית'
  - where: 'note 43:3 “Ezekiel did not destroy the city”'
    claim: 'In chapter 9 the destroyers of the city are summoned and Ezekiel cries out'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'Cause them that have charge over the city to draw near, even every man with his destroying weapon in his hand.'
  - where: 'note 43:3 “Ezekiel did not destroy the city”'
    claim: 'Some Hebrew manuscripts and the Vulgate read “he came”; most Hebrew manuscripts have “I”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=ESV'
    quote: 'Some Hebrew manuscripts and Vulgate; most Hebrew manuscripts when I'
  - where: 'note 43:3 “Ezekiel did not destroy the city”'
    claim: 'Modern translations read “when he came to destroy the city”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=NRSVUE'
    quote: 'when he came to destroy the city'
  - where: 'note 43:3 “Ezekiel did not destroy the city”'
    claim: 'The New Revised Standard Version’s cross-references at 43:3 include Jeremiah 1:10'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=NRSVUE'
    quote: 'Jer 1.10; Ezek 1.3, 4, 28; 3.23'
  - where: 'note 43:3 “Ezekiel did not destroy the city”'
    claim: 'Jeremiah was set over the nations “to destroy”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'to root out, and to pull down, and to destroy, and to throw down, to build, and to plant'
  - where: 'note 43:3 “Ezekiel did not destroy the city”'
    claim: 'The Septuagint has “when I went in to anoint the city”'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/43.htm'
    quote: 'when I went in to anoint the city'

  # ---- note 43:6 ----
  - where: 'note 43:6 “A voice from the house, and the man beside him”'
    claim: 'The Hebrew has a participle, “one speaking,” with no pronoun “him”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'מִדַּבֵּ֥ר'
  - where: 'note 43:6 “A voice from the house, and the man beside him”'
    claim: 'A modern translation: “I heard one speaking to me out of the temple”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=ESV'
    quote: 'I heard one speaking to me out of the temple'
  - where: 'note 43:6 “A voice from the house, and the man beside him”'
    claim: 'The guide of 40:3 was probably an authorized messenger, not the Lord'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'This “man” was probably not the Lord but an authorized messenger.'
  - where: 'note 43:6 “A voice from the house, and the man beside him”'
    claim: 'The guide speaks in the earlier chapters (41:4, for one)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/41?lang=eng'
    quote: 'and he said unto me, This is the most holy place.'

  # ---- note 43:7 throne ----
  - where: 'note 43:7 “Throne and footstool, and no ark”'
    claim: 'The mercy seat on the ark was regarded as Jehovah’s earthly dwelling place'
    key: 'bd-ark-of-the-covenant'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'the Mercy Seat which formed its covering was regarded as the earthly dwelling place of Jehovah'
  - where: 'note 43:7 “Throne and footstool, and no ark”'
    claim: 'The ark is called God’s footstool in 1 Chronicles 28:2'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'The ark of the covenant is called the footstool of God in 1 Chronicles 28:2 and Psalm 132:7'
  - where: 'note 43:7 “Throne and footstool, and no ark”'
    claim: 'No ark is mentioned in the temple Ezekiel saw'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'In the sanctuary which Ezekiel saw, no reference is made to the ark of the covenant'
  - where: 'note 43:7 “Throne and footstool, and no ark”'
    claim: '“I will dwell” in 43:7 is the verb shakan (H7931)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אֶשְׁכָּן'
  - where: 'note 43:7 “Throne and footstool, and no ark”'
    claim: '“That I may dwell” in Exodus 25:8 is the same verb (H7931)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'שָׁכַנְתִּ֖י'
  - where: 'note 43:7 “Throne and footstool, and no ark”'
    claim: '“For ever” was not true of the tabernacle or Solomon’s temple, though the Lord dwelt in them'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'in which Jehovah also had His dwelling-place, though not for ever'

  # ---- note 43:7 carcases ----
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'The Hebrew noun is peger, a corpse or carcass'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6297.htm'
    quote: 'corpse, carcass'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'The noun in 43:7 is peger (H6297), and “in their high places” is bamotam (H1116)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'פִגְרֵ֥י'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'The English Standard Version translates literally, and notes “at their deaths” as another reading'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=ESV'
    quote: 'the dead bodies of their kings at their high places'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'The same words can be read “at their deaths”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=ESV'
    quote: 'Or at their deaths'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'Reading the letters of “their high places” as “in their death” has been proposed'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'for that reason Ewald and Hitzig propose to read'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'No king is known to have been buried near the temple'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'not a single instance can be adduced of the burial of a king in the vicinity of the temple'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'The New International Version understands funeral offerings'
    key: 'niv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=NIV'
    quote: 'the funeral offerings for their kings at their death'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'The New Revised Standard Version understands sacrifices to dead kings'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=NRSVUE'
    quote: 'by sacrificing to their kings at their death'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'In Leviticus 26:30 the word is used figuratively of idols'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6297.htm'
    quote: 'figurative of idols'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'Leviticus 26:30 speaks of “the carcases of your idols”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'cast your carcases upon the carcases of your idols'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'One reading takes the corpses as the dead idols for which the kings built altars or high places in the temple'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'The corpses of the kings are therefore the dead idols, for which the kings (for example, Manasseh) had built altars or high places'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'Manasseh built altars in the two courts of the temple'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'And he built altars for all the host of heaven in the two courts of the house of the Lord.'
  - where: 'note 43:7 “What the “carcases of their kings” were”'
    claim: 'On the idol reading only the temple wall stood between the Lord and the idols'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'between Jehovah and the carcase-gods'

  # ---- note 43:10 ----
  - where: 'note 43:10 “Why a plan should make them ashamed”'
    claim: 'Elder James E. Talmage on the immediate purpose of the vision (as the Student Manual prints him)'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'awakening the people of Israel to a realization of their fallen state and a conception of their departed glory'
  - where: 'note 43:10 “Why a plan should make them ashamed”'
    claim: 'The Hebrew for “pattern” is toknit (H8508)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תָּכְנִֽית'
  - where: 'note 43:10 “Why a plan should make them ashamed”'
    claim: 'toknit means measurement, proportion'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8508.htm'
    quote: 'measurement, proportion'
  - where: 'note 43:10 “Why a plan should make them ashamed”'
    claim: 'The New International Version: “Let them consider its perfection”'
    key: 'niv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=NIV'
    quote: 'Let them consider its perfection'

  # ---- note 43:12 ----
  - where: 'note 43:12 “The whole mountaintop most holy”'
    claim: '“Most holy” in 43:12 is qodesh qodashim'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'קָדָשִׁ֔ים'
  - where: 'note 43:12 “The whole mountaintop most holy”'
    claim: 'The same two words name the most holy place of the tabernacle in Exodus 26:33'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'קֳּדָשִֽׁים'
  - where: 'note 43:12 “The whole mountaintop most holy”'
    claim: 'The guide calls the inner room of this temple the most holy place'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/41?lang=eng'
    quote: 'and he said unto me, This is the most holy place.'
  - where: 'note 43:12 “The whole mountaintop most holy”'
    claim: 'The whole precinct, courts included, is most holy, which distinguishes this sanctuary from the earlier one'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'but also the whole of its surroundings (all its courts), are to be most holy, the new sanctuary is to be distinguished from the earlier one'
  - where: 'note 43:12 “The whole mountaintop most holy”'
    claim: 'The promise that the temple will not be profaned again is summed up in this clause'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/43.htm'
    quote: 'namely, that the temple shall not be profaned any more - is compressed into this clause'
  - where: 'note 43:12 “The whole mountaintop most holy”'
    claim: 'The outer wall separates the sanctuary from the profane place'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/42?lang=eng'
    quote: 'to make a separation between the sanctuary and the profane place'

  # ---- note 43:15 ----
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'The “settle” is a ledge surrounding Ezekiel’s altar, a lower (lesser) and a greater'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5835.htm'
    quote: '1 ledge surrounding Ezekiel'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'The altar rises from a base to a lower ledge, an upper ledge, and the altar hearth with four horns; the hearth is twelve cubits square'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=ESV'
    quote: 'The altar hearth shall be'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'Twelve long cubits are about 21 feet; the long cubit is the unit throughout chapters 40–48'
    key: 'niv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=NIV'
    quote: 'That is, about 21 feet or about 6.4 meters'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'The “bottom” is the word for bosom, used of the hollow bottom of the altar'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2436.htm'
    quote: 'of hollow bottom of altar Ezekiel 43:13,14,17'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'The New International Version renders it “gutter”'
    key: 'niv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2043&version=NIV'
    quote: 'Its gutter is a cubit deep and a cubit wide'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'The second word for “altar” in 43:15 is ’ari’el (H741)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אֲרִאֵ֣יל'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'The first word for “altar” in 43:15 is spelled har’el (H2025)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַרְאֵ֖ל'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: '’ari’el means hearth, altar-hearth'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/741.htm'
    quote: 'hearth, altar-hearth'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'The lexicon refers har’el to the entry for ’ari’el; the page glosses the spelling as “Mountain of God”'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2025.htm'
    quote: 'Ezekiel 43:15 see'
  - where: 'note 43:15 “A stepped altar, called the hearth of God”'
    claim: 'Some derive ’ari’el from words meaning “hearth of El”'
