  # ---- note 43:18 ----
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
    claim: 'The death of Jesus Christ ended the shedding of blood as a gospel ordinance'
    key: 'bd-sacrifices'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'This continued until the death of Jesus Christ, which ended the shedding of blood as a gospel ordinance.'
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
    claim: 'The temple of the vision has not been built (Talmage, as the manual prints him)'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'Certain it is that the Temple of the vision has not yet been builded.'
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
    claim: 'Joseph Smith taught that the offering of sacrifice will be continued at the last time'
    key: 'jsp-history-c1-addenda-18'
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'the offering of sacrifice which also shall be continued at the last time'
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
    claim: 'Joseph Smith: all ordinances of any dispensation will be had in the last'
    key: 'jsp-history-c1-addenda-18'
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'shall all be had in the last dispensation'
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
    claim: 'Joseph Smith: not the law of Moses with all its ceremonies, but sacrifice as before Moses'
    key: 'jsp-history-c1-addenda-18'
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'It is not to be understood that the law of Moses will be established again with all its rights and variety of ceremonies'
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
    claim: 'Joseph Smith: the sacrifices will be restored when the temple is built and the sons of Levi purified'
    key: 'jsp-history-c1-addenda-18'
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'when the Temple of the Lord shall be built and the Sons of Levi be purified, be fully restored'
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
    claim: 'Joseph Smith raised the objection himself'
    key: 'jsp-history-c1-addenda-18'
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-c-1-2-november-1838-31-july-1842/553'
    quote: 'It may be asked by some what necessity for Sacrifice since the great Sacrifice was offered?'
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
    claim: 'President Joseph Fielding Smith (as the Student Manual prints him on Ezekiel 43:18–27; the words naming Ezekiel’s temple are the manual’s bracketed insertion): very likely a place will be provided for the sons of Levi to offer'
    key: 'ot-manual-27'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-27?lang=eng'
    quote: 'it is very likely that provision will be made for some ceremonies and ordinances which may be performed by the Aaronic Priesthood and a place provided where the sons of Levi may offer their offering in righteousness'
  - where: 'note 43:18 “Sacrifice in a temple still to be built”'
