chapter: 22
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The nearest date above the chapter is the seventh year, fifth month (20:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month'
  - where: 'when'
    claim: 'The next date in the book is the ninth year (24:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Again in the ninth year, in the tenth month, in the tenth day of the month'
  - where: 'when'
    claim: 'That day is the day the king of Babylon set himself against Jerusalem (24:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'the king of Babylon set himself against Jerusalem this same day'
  - where: 'when'
    claim: 'Ezekiel’s ministry began in 592 B.C. (the fifth year), so the seventh year is about 590 B.C.'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'prophesied during a period of 22 years, 592–570 B.C.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'In the seventh year elders came to inquire of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'certain of the elders of Israel came to inquire of the Lord, and sat before me'
  - where: 'setting'
    claim: 'Chapter 20 begins with the same question to the prophet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'Wilt thou judge them, son of man, wilt thou judge them? cause them to know the abominations of their fathers'
  - where: 'setting'
    claim: 'Chapter 20 reviews Israel’s history from Egypt to Ezekiel’s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'From the time of their deliverance from Egypt to the day of Ezekiel'
  - where: 'setting'
    claim: 'Chapter 22 is appended to the prediction of judgment in chapter 21 as a description of the sins that occasion it'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'To the prediction of the judgment in Ezekiel 21 there is appended another description of the sins of Jerusalem and Israel, by which this judgment is occasioned.'
  - where: 'setting'
    claim: 'The chapter contains three words of God, connected in substance and design'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'The chapter contains three words of God, which are connected together both in substance and design'
  - where: 'setting'
    claim: 'The opening question continues the reproof that began at 20:4'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'proves this address to be a continuation of the reproof of Israel''s sins, which commenced in Ezekiel 20:4'
  - where: 'setting'
    claim: 'Chapters 1–24 are the first division of the book, judgment on Jerusalem and the nation'
    key: bd-ezekiel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: '(1) 1–24, prophecies of judgment against Jerusalem and the nation'
  - where: 'setting'
    claim: 'Chapter 22 is one of the chapters whose major theme is that Jerusalem will be destroyed'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'It is the major theme of chapters 4, 5, 6,7, 8, 9, 11,12, 15, 19, 21, 22, and 24.'
  - where: 'setting'
    claim: 'The question that theme answers'
    key: lund-ezekiel
    url: 'https://rsc.byu.edu/isaiah-prophets/ezekiel-prophet-judgment-prophet-promise'
    quote: 'Is Jerusalem really going to be destroyed?'
  - where: 'setting'
    claim: 'The list of sins alludes to Leviticus'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'the allusion to Leviticus 18 and 19 is very obvious'
  - where: 'setting'
    claim: 'The review of the ranks is like Zephaniah 3:3–4'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'which is so similar to the one before us, that Ezekiel appears to have had it in his mind'
  - where: 'setting'
    claim: 'Verse 28 repeats chapter 13 on the false prophets'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'is repeated for the most part verbatim from Ezekiel 13:10'
  - where: 'setting'
    claim: 'The gap of verse 30 is that of 13:5'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'who did not enter into the gap according to Ezekiel 13:5'

  # ---------- section plain ----------
  - where: 'section 2 plain'
    claim: '“Set light by” means treated lightly or dishonored (Church footnote 7a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'HEB treated lightly or dishonored'
  - where: 'section 2 plain'
    claim: '“Carry tales to” can be rendered “slander in order to” (Church footnote 9a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'OR slander in order to'
  - where: 'section 2 plain'
    claim: 'The Hebrew of “humbled her that was set apart for pollution” (Church footnote 10b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'HEB abused her who is unclean in her time of menstruation'

  # ---------- note 22:2 ----------
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'A modern translation renders the clause after the question as a command'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'Then declare to her all her abominations'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'The same question opens chapter 20, about the fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'Wilt thou judge them, son of man, wilt thou judge them? cause them to know the abominations of their fathers'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'The question comes again at 23:36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'Son of man, wilt thou judge Aholah and Aholibah? yea, declare unto them their abominations'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'The Hebrew of “bloody city” is ir ha-damim; “blood” (H1818) is plural with the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/דָּמִ֑ים'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'The plural of “blood” means guilt of bloodshed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1818.htm'
    quote: 'guilt of bloodshed, blood-guiltiness'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'The lexicon sets Nahum 3:1 beside Ezekiel 22:2 and 24:6 for the phrase'
    key: bdb
    url: 'https://biblehub.com/hebrew/1818.htm'
    quote: 'עִיר דָּמִים Nahum 3:1; עִיר הַדָּמִים Ezekiel 22:2; Ezekiel 24:6'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'Nahum 3:1 has the same two words (city, bloods) without the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'דָּמִ֑ים'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'Nahum’s woe on the bloody city, in the chapter on Nineveh’s downfall'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/3?lang=eng'
    quote: 'Woe to the bloody city! it is all full of lies and robbery'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'Nahum 3 is about Nineveh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/3?lang=eng'
    quote: 'The miserable downfall of Nineveh is foretold.'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'Ezekiel uses the name again in chapter 24, dated to the day the siege begins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Woe to the bloody city, to the pot whose scum is therein'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'Chapter 24 is dated to the day the king of Babylon set himself against Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'the king of Babylon set himself against Jerusalem this same day'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'A modern translation’s cross-reference joins the “bloody city” of 22:2 to 2 Kings 21:16'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'Ezekiel 22:2 : [ch. 16:38; 23:37; 24:6; 2 Kgs. 21:16]; See ch. 7:23'
  - where: 'note 22:2 “Judge the bloody city”'
    claim: 'Manasseh filled Jerusalem with innocent blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'Moreover Manasseh shed innocent blood very much, till he had filled Jerusalem from one end to another'

  # ---------- note 22:4 ----------
  - where: 'note 22:4 “A city that brought its own day near”'
    claim: 'A modern translation: the appointed time of your years has come'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=NRSVUE'
    quote: 'you have brought your days near; the appointed time of your years has come'
  - where: 'note 22:4 “A city that brought its own day near”'
    claim: 'Another modern translation has the same sense'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'the appointed time of your years has come'
  - where: 'note 22:4 “A city that brought its own day near”'
    claim: 'The Church’s footnote on “time” (3c) points to Ezekiel 21:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'Ezek. 21:25'
  - where: 'note 22:4 “A city that brought its own day near”'
    claim: 'Ezekiel 21:25 says the prince’s day is come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'And thou, profane wicked prince of Israel, whose day is come, when iniquity shall have an end'
  - where: 'note 22:4 “A city that brought its own day near”'
    claim: 'A modern translation renders “infamous” as a defiled name'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'your name is defiled'
  - where: 'note 22:4 “A city that brought its own day near”'
    claim: 'and “much vexed” as full of tumult'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'you are full of tumult'

  # ---------- note 22:7 ----------
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Verses 9–11 allude to Leviticus 18 and 19'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'the allusion to Leviticus 18 and 19 is very obvious'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'The refrain “to shed blood” divides the list into three groups under blood-guiltiness'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'the enumeration is divided into three groups of sins, which are placed in the category of blood-guiltiness'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'The first group (verses 6–8): sins against morality, with contempt of what is holy'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'With insolence and violence toward men there is associated contempt of all that is holy.'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'The second group (verses 9–11): slander, idolatry, lewdness and incest'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'in addition to slander and idolatry, the crimes of lewdness and incest are the principal sins for which the people are reproved'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'The third group (verse 12): covetousness'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'is composed of sins of covetousness'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'The princes of Israel are primarily the kings who put the innocent to death'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'primarily the profligate kings, who caused innocent persons to be put to death'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'The reproof of slander points back to Leviticus 19:16'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'The reproof of slander also points back to the prohibition in Leviticus 19:16.'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Slander to shed blood is false testimony in court'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'refers to malicious charges and false testimony in a court of justice'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'The list ends with forgetting God'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'The reproof finishes with forgetfulness of God, which is closely allied to covetousness.'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Eating on the mountains is referred to 18:6, and usury to 18:8'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'For eating upon the mountains, see Ezekiel 18:6.'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'The Hebrew of “men that carry tales” is men of slander, informers'
    key: bdb
    url: 'https://biblehub.com/hebrew/7400.htm'
    quote: 'men of slander, informers'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Leviticus 19:16 on the talebearer and a neighbour’s blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Thou shalt not go up and down as a talebearer among thy people: neither shalt thou stand against the blood of thy neighbour'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Leviticus 18:7–8 forbids a father’s wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'The nakedness of thy father’s wife shalt thou not uncover: it is thy father’s nakedness.'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Leviticus 18:9 forbids a sister, the daughter of thy father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'The nakedness of thy sister, the daughter of thy father, or daughter of thy mother'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Leviticus 18:15 forbids a daughter-in-law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'Thou shalt not uncover the nakedness of thy daughter in law'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Leviticus 18:19 forbids approaching a woman in her uncleanness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'as long as she is put apart for her uncleanness'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Leviticus 18:20 forbids a neighbour’s wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'Moreover thou shalt not lie carnally with thy neighbour’s wife, to defile thyself with her.'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'Leviticus 20:12 sets the penalty for the sin with a daughter-in-law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'And if a man lie with his daughter in law, both of them shall surely be put to death'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'In the Hebrew of 22:12 the object “me” (word 13) stands before the verb “forgotten” (word 14)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/אֹתִ֣/י'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'A modern translation keeps the order'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'me you have forgotten'

  # ---------- note 22:13 ----------
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'For verse 7 the commandment to honour parents (Exodus 20:12) and the laws on the stranger, widow and fatherless (Exodus 22:20 in the Hebrew numbering) are compared'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: '(Exodus 20:12). In the reproofs which follow, compare Exodus 22:20'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'For verse 8, chapter 20:13 is compared'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'For Ezekiel 22:8, see Ezekiel 20:13'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'A modern translation’s cross-reference joins verse 7 to Exodus 20:12'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'Ezekiel 22:7 : Deut. 27:16; [Eph. 6:2]; See Ex. 20:12'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'and to Exodus 22:21–22'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'Ezekiel 22:7 : Ex. 22:21, 22'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'and verse 8 to Ezekiel 20:13'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'Ezekiel 22:8 : See ch. 20:13'
  - where: 'note 22:7 “The law read back as an indictment”'
    claim: 'and verse 11 to Leviticus 18:15 and 20:12'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'Ezekiel 22:11 : Lev. 18:15; 20:12; [Amos 2:7]'
  - where: 'note 22:13 “The Lord strikes His hands”'
    claim: 'Smiting the hands shows great emotion; in 22:13, anger'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'Smiting the hands also showed contempt (see Job 27:23), anger (see Ezekiel 22:13), or triumph (see Ezekiel 25:6), or indicated a pledge (see Ezekiel 21:17).'
  - where: 'note 22:13 “The Lord strikes His hands”'
    claim: 'It can also show alarm and horror'
    key: ot-manual-26
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'expresses signs of great emotion—in this case great alarm and horror at the impending calamity'
  - where: 'note 22:13 “The Lord strikes His hands”'
    claim: 'A modern translation: I strike my hands together'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=NRSVUE'
    quote: 'I strike my hands together at the dishonest gain you have made'
  - where: 'note 22:13 “The Lord strikes His hands”'
    claim: 'In chapter 21 the Lord says He will smite His hands together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/21?lang=eng'
    quote: 'I will also smite mine hands together, and I will cause my fury to rest'

  # ---------- note 22:16 ----------
  - where: 'note 22:16 “Inheritance, or profaned?”'
    claim: 'The Hebrew form is nichalt, tagged as a Niphal of chalal (H2490)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'וְ/נִחַ֥לְתְּ'
  - where: 'note 22:16 “Inheritance, or profaned?”'
    claim: 'The lexicon lists the form at 22:16 under “profane,” Niphal'
    key: bdb
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'Ezekiel 22:16, נִחֲלוּ Ezekiel 7:24'
  - where: 'note 22:16 “Inheritance, or profaned?”'
    claim: 'The passive sense is be polluted, defiled'
    key: bdb
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'Pass., be polluted, defiled'
  - where: 'note 22:16 “Inheritance, or profaned?”'
    claim: 'The same verb is used of the sabbath at 22:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'the sabbath Exodus 31:14 (P), Isaiah 56:2,6; Ezekiel 20:13,16,21,24; Ezekiel 22:8'
  - where: 'note 22:16 “Inheritance, or profaned?”'
    claim: 'and of sacred things and of God at 22:26'
    key: bdb
    url: 'https://biblehub.com/hebrew/2490.htm'
    quote: 'and even God himself Ezekiel 22:16,26'
  - where: 'note 22:16 “Inheritance, or profaned?”'
    claim: 'The Septuagint has heritages, with the Lord acting'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ezekiel/22.htm'
    quote: 'And I will give heritages in thee in the sight of the nations'
  - where: 'note 22:16 “Inheritance, or profaned?”'
    claim: 'A modern translation gives the inheritance reading in its margin'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=NIV'
    quote: 'Or When I have allotted you your inheritance'
  - where: 'note 22:16 “Inheritance, or profaned?”'
    claim: 'A modern translation: profaned by your own doing'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2022&version=ESV'
    quote: 'you shall be profaned by your own doing'
