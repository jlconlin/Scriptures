    claim: 'The figure represents the coming siege as a melting process that separates silver ore from baser metals'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'represents the siege awaiting Jerusalem as a melting process, through which God will separate the silver ore contained in Israel from the baser metals mingled with it'
  - where: 'note 22:18 “Dross in the furnace”'
    claim: 'The smelting was experienced in the last siege of Jerusalem'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'This smelting process was experienced by Israel in the last siege of Jerusalem by the Chaldeans.'
