  - where: 'note 22:18 “Dross in the furnace”'
    claim: 'The passages where the refining is referred to'
    key: keil-ezekiel
    url: 'https://biblehub.com/commentaries/kad/ezekiel/22.htm'
    quote: 'as in the case in Isaiah 1:22, Isaiah 1:25; Jeremiah 6:27-30; Malachi 3:2-3'
