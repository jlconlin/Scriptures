chapter: 2
claims:
  - where: 'when'
    claim: 'The vision is dated to the fifth day of the fourth month, the fifth year of Jehoiachin’s captivity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'In the fifth day of the month, which was the fifth year of king Jehoiachin’s captivity,'
  - where: 'when'
    claim: 'Ezekiel prophesied from about 592 B.C.; the exiles were carried away in about 597 B.C.'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC. He prophesied there from about 592 to 570 BC.'
  - where: 'setting'
    claim: 'Ezekiel was a priest carried away with Jehoiachin, who settled at Tel Abib on the Chebar'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'A priest of the family of Zadok, and one of the captives carried away by Nebuchadnezzar along with Jehoiachin. He settled at Tel Abib on the Chebar'
  - where: 'setting'
    claim: 'The exiles were carried to Babylon in about 597 B.C.'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'a priest among the Israelites who were carried away to Babylon in about 597 BC.'
  - where: 'setting'
    claim: 'At the end of chapter 1 Ezekiel sees the glory, falls on his face, and hears a voice'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'This was the appearance of the likeness of the glory of the Lord. And when I saw it, I fell upon my face, and I heard a voice of one that spake.'
  - where: 'setting'
    claim: 'The call runs on into chapter 3: the roll is eaten (3:1–3) and Ezekiel returns to the captives and sits seven days (3:15)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Then I came to them of the captivity at Tel-abib, that dwelt by the river of Chebar, and I sat where they sat, and remained there astonished among them seven days.'
  - where: 'setting'
    claim: 'Chapters 4–24 are prophecies against Jerusalem'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'Ezekiel 4–24: Prophecies against Jerusalem.'
  - where: 'setting'
    claim: 'Lehi was handed a book in vision'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'the first came and stood before my father, and gave unto him a book, and bade him that he should read.'
  - where: 'setting'
    claim: 'Lehi was a prophet of the same years as Ezekiel'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'Ezekiel’s ministry overlapped with those of other prophets'
  - where: 'setting'
    claim: 'John was told to eat a book'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/10?lang=eng'
    quote: 'Take it, and eat it up; and it shall make thy belly bitter, but it shall be in thy mouth sweet as honey.'
  - where: 'thread'
    claim: 'The Hebrew of verse 6 has “do not be afraid” three times'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תִּירָ֨א'
  - where: 'thread'
    claim: 'The chapter repeats “rebellious”; verse 8 turns it on Ezekiel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/2?lang=eng'
    quote: 'But thou, son of man, hear what I say unto thee; Be not thou rebellious like that rebellious house: open thy mouth, and eat that I give thee.'

  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'The Hebrew is ben adam'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אָדָם֙'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'The Hebrew can be translated “son of a human”'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'The original Hebrew phrase can also be translated as “son of a human.”'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'Ezekiel is called son of man over 90 times'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'Ezekiel is called “son of man” over 90 times throughout the book.'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'The term seems to stress Ezekiel’s mortality beside God’s divine, eternal nature'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'The term seems to be emphasizing Ezekiel’s mortality in contrast to the divine, eternal nature of God.'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'It is not the title Son of Man, which refers to Christ'
    key: 'scripture-helps-ezek'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/43-ezekiel-1-3-33-34-36-37?lang=eng'
    quote: 'It is not to be confused with the title ‘Son of Man,’ which refers to Christ.'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'In the Old Testament the expression often means simply a man'
    key: 'bd-son-of-man'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: 'In the Old Testament the expression “son of man” is frequently used to denote simply “a man”'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'Son of Man is a title Jesus used of Himself in the Gospels'
    key: 'bd-son-of-man'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: 'A title of our Lord, found in the Gospels about 80 times, used by Him in speaking of Himself'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'As an address it occurs elsewhere only at Daniel 8:17'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/2.htm'
    quote: 'Elsewhere it occurs only once, Daniel 8:17.'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'The address marks the distance between human weakness and the divine power that enables him to speak'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/2.htm'
    quote: 'to mark the distance between the human weakness of his nature and the divine power which gives him the capacity and the impulse to speak'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'It shows how powerfully the word of God works in a feeble man'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/2.htm'
    quote: 'how powerfully the word of God operates in feeble man'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'Daniel had fallen on his face when he was called son of man'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'I was afraid, and fell upon my face: but he said unto me, Understand, O son of man'
  - where: 'note 2:1 “Son of man means a human being”'
    claim: 'Ezekiel had fallen on his face before the glory'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'And when I saw it, I fell upon my face, and I heard a voice of one that spake.'

  - where: 'note 2:2 “The command to stand comes with the power to stand”'
    claim: 'The spirit is the power from God, conveyed through the word, that gave him strength to stand and take up the command'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/2.htm'
    quote: 'the spirit-power which proceeds from God, and which is conveyed through the word which imparted to him the strength to stand before the face of God, and to undertake His command'
  - where: 'note 2:2 “The command to stand comes with the power to stand”'
    claim: 'The Septuagint adds that the spirit took him up and raised him'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/2.htm'
    quote: 'And the Spirit came upon me, and took me up, and raised me, and set me on my feet'
  - where: 'note 2:2 “The command to stand comes with the power to stand”'
    claim: 'The same happens again at 3:23–24'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Then the spirit entered into me, and set me upon my feet, and spake with me'
