    quote: 'In a similar manner, when Ezekiel saw the Lord on his throne, he was given “a roll of a book” (a scroll).'
  - where: 'note 2:9 “A book handed to a prophet”'
    claim: 'Lehi and Ezekiel were contemporaries with the common message of Jerusalem’s destruction'
    key: 'sc-knowhy-469'
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'reveals similarities that go beyond the common message of Jerusalem’s destruction'
