chapter: 18
claims:
  - where: 'when'
    claim: 'The nearest date before the chapter is the sixth year, sixth month (8:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/8?lang=eng'
    quote: 'And it came to pass in the sixth year, in the sixth month, in the fifth day of the month'
  - where: 'when'
    claim: 'The book counts its years from the captivity of king Jehoiachin'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'which was the fifth year of king Jehoiachin’s captivity'
  - where: 'when'
    claim: 'The next date in the book is the seventh year (20:1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And it came to pass in the seventh year, in the fifth month, the tenth day of the month'
  - where: 'when'
    claim: 'The captivity began with the deportation of 597 B.C., so its sixth year is about 591 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'

  - where: 'setting'
    claim: 'Ezekiel was among the captives carried away with Jehoiachin'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin'
  - where: 'setting'
    claim: 'The deportations under Nebuchadnezzar were in 597 B.C. and 586 B.C.'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'The watchman’s charge says the wicked man dies in his iniquity'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'the same wicked man shall die in his iniquity; but his blood will I require at thine hand'
  - where: 'setting'
    claim: 'After the fall the people are saying something different (33:10), and the teaching is given again'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'If our transgressions and our sins be upon us, and we pine away in them, how should we then live?'
  - where: 'setting'
    claim: 'The Bible Dictionary names chapters 3 and 18 for the individual responsibility of every person'
    key: 'bd-ezekiel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng'
    quote: 'Ezek. 3 and 18, which show the significance of a prophet’s warning and the individual responsibility of every person for the consequences of his own behavior'

  - where: 'thread'
    claim: 'Verses 21–26 take up the case the first half left out, a life that changes course'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/18.htm'
    quote: 'took for granted that there was a constant persistence in the course once taken'

  - where: 'section 5 plain'
    claim: '“Not equal” rendered “unfair”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2018&version=NRSVUE'
    quote: 'Yet you say, “The way of the Lord is unfair.” Hear now, O house of Israel: Is my way unfair? Is it not your ways that are unfair?'

  - where: 'note 18:2 “The proverb of the sour grapes”'
    claim: 'The Hebrew noun (boser, H1155) means unripe or sour grapes'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/1155.htm'
    quote: 'unripe or sour grapes'
  - where: 'note 18:2 “The proverb of the sour grapes”'
    claim: 'The verb said of the teeth (qahah, H6949) means be blunt, dull; in the Qal it is used only of teeth, in Jer. 31:29–30 and Ezek. 18:2'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6949.htm'
    quote: 'verb be blunt, dull'
  - where: 'note 18:2 “The proverb of the sour grapes”'
    claim: 'The Qal of the verb occurs in Jer. 31:29–30 and Ezek. 18:2, all of teeth'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6949.htm'
    quote: 'Ezekiel 18:2 (all of teeth)'
  - where: 'note 18:2 “The proverb of the sour grapes”'
    claim: 'The Hebrew of 18:2 has boser (H1155) and the verb qahah (H6949)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תִּקְהֶֽינָה'
  - where: 'note 18:2 “The proverb of the sour grapes”'
    claim: 'The Septuagint has “unripe grapes”'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/ezekiel/18.htm'
    quote: 'The fathers have eaten unripe grapes, and the children''s teeth have been set on edge'
  - where: 'note 18:2 “The proverb of the sour grapes”'
    claim: 'The Church footnote on verse 2 joins Jer. 31:29 and Lam. 5:7 to the proverb'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/18?lang=eng'
    quote: 'Jer. 31:29; Lam. 5:7'
  - where: 'note 18:2 “The proverb of the sour grapes”'
    claim: 'In 12:22–23 the Lord quotes a proverb and says it will cease'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/12?lang=eng'
    quote: 'I will make this proverb to cease, and they shall no more use it as a proverb in Israel'

  - where: 'note 18:4 “The soul, and what it is to die”'
    claim: 'Nephesh here stands for the man'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/18.htm'
    quote: 'is used here, as in many other passages, for "man,"'
  - where: 'note 18:4 “The soul, and what it is to die”'
    claim: 'The Hebrew word for “soul” in 18:4 is nephesh (H5315)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'נֶ֥פֶשׁ'
  - where: 'note 18:4 “The soul, and what it is to die”'
    claim: 'A modern translation has “lives” and “person”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2018&version=NRSVUE'
    quote: 'Know that all lives are mine; the life of the parent as well as the life of the child is mine: it is only the person who sins who shall die.'
  - where: 'note 18:4 “The soul, and what it is to die”'
    claim: 'As Father of all, the Lord cannot treat father and son differently'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/18.htm'
    quote: 'as the Father of all, He cannot treat the one in a different manner from the other'
  - where: 'note 18:4 “The soul, and what it is to die”'
    claim: 'The Student Manual reads the chapter of spiritual life and death'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'to teach the principles of accountability as they relate to spiritual life and death'
  - where: 'note 18:4 “The soul, and what it is to die”'
    claim: 'Death here is the destruction the law threatens, as in Deut. 30:15'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/18.htm'
    quote: '"Death" is used to denote the complete destruction with which transgressors are threatened by the law, as in Deuteronomy 30:15'
  - where: 'note 18:4 “The soul, and what it is to die”'
    claim: 'Deut. 30:15 sets life and death before Israel'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'See, I have set before thee this day life and good, and death and evil'
  - where: 'note 18:4 “The soul, and what it is to die”'
    claim: '“Him that dieth” in verse 32 has been taken to mean that those in sin are lying in death'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/18.htm'
    quote: 'to indicate to the people that while in sin they are lying in death'

  - where: 'note 18:6 “Eating upon the mountains”'
    claim: 'Chapter 6 addresses the mountains and their high places'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'I will destroy your high places'
  - where: 'note 18:6 “Eating upon the mountains”'
    claim: 'The mountain tops were where offerings were made to idols (6:13)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/6?lang=eng'
    quote: 'in all the tops of the mountains, and under every green tree, and under every thick oak, the place where they did offer sweet savour to all their idols'
  - where: 'note 18:6 “Eating upon the mountains”'
    claim: 'The law commanded the destruction of the nations’ places of worship on the mountains'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'upon the high mountains, and upon the hills, and under every green tree'
  - where: 'note 18:6 “Eating upon the mountains”'
    claim: 'The phrase returns in the list of Jerusalem’s sins (22:9)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'in thee they eat upon the mountains'
  - where: 'note 18:6 “Eating upon the mountains”'
    claim: 'The lexicon lists eating as an act of worship (Deut. 12:7 among its examples) and sets Ezek. 18:6, 11, 15 and 22:9 beside it'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/398.htm'
    quote: 'as act of worship Genesis 31:54'
  - where: 'note 18:6 “Eating upon the mountains”'
    claim: 'The same entry names Ezek. 18:6, 11, 15 and 22:9 in that group'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/398.htm'
    quote: 'Ezekiel 18:6,11,15; Ezekiel 22:9'
  - where: 'note 18:6 “Eating upon the mountains”'
    claim: 'Mountains are named as places of illicit worship, with Deut. 12:2'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2022.htm'
    quote: 'as places of illicit worship Isaiah 65:7'
  - where: 'note 18:6 “Eating upon the mountains”'
    claim: 'The Hebrew of 18:6 has har (H2022) and akal (H398)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אָכָ֔ל'

  - where: 'note 18:8 “Usury and increase”'
    claim: 'Neshek (H5392) is interest, literally something bitten off'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5392.htm'
    quote: 'interest, usury (literally something bitten off)'
  - where: 'note 18:8 “Usury and increase”'
    claim: 'Tarbith (H8636) is increment, interest'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8636.htm'
    quote: 'increment, interest, usury'
  - where: 'note 18:8 “Usury and increase”'
    claim: 'The Hebrew of 18:8 has neshek (H5392) and tarbith (H8636)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תַרְבִּית֙'
  - where: 'note 18:8 “Usury and increase”'
    claim: 'ESV rendering of 18:8'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2018&version=ESV'
    quote: 'does not lend at interest'
  - where: 'note 18:8 “Usury and increase”'
    claim: 'ESV rendering of “increase”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2018&version=ESV'
    quote: 'or take any profit'
  - where: 'note 18:8 “Usury and increase”'
    claim: 'NRSVUE rendering of 18:8'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2018&version=NRSVUE'
    quote: 'does not take advance or accrued interest'
  - where: 'note 18:8 “Usury and increase”'
    claim: 'The law forbids usury on a loan to the poor, and requires a pledged garment to be returned by sundown'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'If thou lend money to any of my people that is poor by thee, thou shalt not be to him as an usurer, neither shalt thou lay upon him usury.'
  - where: 'note 18:8 “Usury and increase”'
    claim: 'Leviticus has the pair “usury” and “increase”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'Take thou no usury of him, or increase: but fear thy God; that thy brother may live with thee.'

  - where: 'note 18:10 “Three generations, three verdicts”'
    claim: '“His blood shall be upon him” is the wording of the law'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'he hath cursed his father or his mother; his blood shall be upon him'

  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'The people’s question in verse 19 has been read as a pretext offered on the ground of the law'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/18.htm'
    quote: 'is to be taken as a pretext, which the people might offer on the ground of the law'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'The Church footnote on Ex. 20:5 limits the visiting to children who do as their parents did'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'insofar as the children learn and do the sinful things the parents do'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'The law has the rule that each dies for his own sin'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'every man shall be put to death for his own sin'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'Ezekiel’s teaching is a commentary on Deut. 24:16 and not a correction of the law'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/18.htm'
    quote: 'and not a correction of the law'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'Kings says Judah was removed for the sins of Manasseh'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'to remove them out of his sight, for the sins of Manasseh'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'The proverb’s background includes Ex. 20:5 and 2 Kgs. 24:3'
    key: 'keil-ezekiel'
    url: 'https://biblehub.com/commentaries/kad/ezekiel/18.htm'
    quote: 'the prophets announce that the Lord would put away Judah from before His face on account of the sins of Manasseh (2 Kings 24:3; Jeremiah 15:4)'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'Sins do not transfer, but what parents hand on can bless or curse; the topic remains difficult'
    key: 'sc-knowhy-712'
    url: 'https://scripturecentral.org/knowhy/how-do-latter-day-saints-see-gods-hand-in-history'
    quote: 'Though sins may not transfer to children from their parents, the trajectory given by the parents and the inherited culture and circumstance can be a blessing or curse of sorts'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'The KnoWhy calls it a difficult theological topic and compares Ex. 20:5 with Ezek. 18:2'
    key: 'sc-knowhy-712'
    url: 'https://scripturecentral.org/knowhy/how-do-latter-day-saints-see-gods-hand-in-history'
    quote: 'it remains a difficult theological topic (compare Exodus 20:5 to Jeremiah 31:30; Ezekiel 18:2)'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'The Student Manual joins the second article of faith to Ezek. 18:1–20'
    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'No one is punished for the sins of someone else. The second article of faith teaches this principle.'
  - where: 'note 18:20 “Beside the second commandment”'
    claim: 'The footnote to the second article of faith cites Ezek. 18:20 (1–20)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng'
    quote: 'Ex. 32:33; Deut. 24:16; Ezek. 18:20 (1–20)'

  - where: 'note 18:23 “No pleasure in the death of the wicked”'
    claim: 'The sentence is given again in 33:11 with “As I live” and “why will ye die”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'I have no pleasure in the death of the wicked; but that the wicked turn from his way and live: turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?'
  - where: 'note 18:23 “No pleasure in the death of the wicked”'
    claim: 'Nephi’s plea in Hel. 7:17'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/7?lang=eng'
    quote: 'O repent ye, repent ye! Why will ye die? Turn ye, turn ye unto the Lord your God.'
  - where: 'note 18:23 “No pleasure in the death of the wicked”'
    claim: 'Nephi called to the people of Zarahemla from his tower with a plea used by Jeremiah and Ezekiel (Ezek. 18:31; 33:11)'
    key: 'sc-knowhy-529'
    url: 'https://scripturecentral.org/knowhy/why-do-new-testament-words-and-phrases-show-up-in-the-book-of-mormon-part-3-revelations-to'
    quote: 'when he called out to the people of Zarahemla from his tower, “O repent ye, repent ye!” and add a plea used by Jeremiah and Ezekiel, “Why will ye die?”'

