    claim: 'The verb in 18:22 and 18:24 is zakar (H2142) in the Niphal (passive)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'תִזָּכַ֔רְנָה'
  - where: 'note 18:24 “Righteousness that is not remembered”'
