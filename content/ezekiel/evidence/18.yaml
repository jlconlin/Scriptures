    key: 'ot-manual-26'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-26?lang=eng'
    quote: 'The Lord has made it clear that all who wish to be saved must endure to the end in righteousness'
  - where: 'note 18:24 “Righteousness that is not remembered”'
