    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'תִּזָּכַרְןָ Ezekiel 3:20'
  - where: 'note 18:24 “Righteousness that is not remembered”'
    claim: 'ESV rendering of 18:22'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Ezekiel%2018&version=ESV'
    quote: 'None of the transgressions that he has committed shall be remembered against him'
