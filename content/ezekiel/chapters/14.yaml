chapter: 14
title: 'Idols in the Heart'
tagline: 'Elders come and sit before Ezekiel, and the Lord says they have brought their idols with them in their hearts. Neither a prophet’s agreeable word nor the righteousness of Noah, Daniel, and Job will turn the judgment from Jerusalem.'
when: 'No date of its own. The chapter stands between the book’s second date, “the sixth year, in the sixth month” of Jehoiachin’s captivity (8:1), about 591 B.C., and its third, “the seventh year, in the fifth month” (20:1).'

setting: |
  Ezekiel is in Babylon, “one of the captives carried away by Nebuchadnezzar along with Jehoiachin.” The chapter has no date. It falls after the book’s second date, the sixth year of the captivity ([[Ezek. 8:1]]), and before its third, the seventh year ([[Ezek. 20:1]]). Jerusalem has not yet fallen: the chapter speaks of judgments still to be sent on the city and of survivors who will yet be “brought forth” to the exiles.

  Some of the elders of the exile community come and sit before the prophet, as they did in 8:1 and will again in 20:1. The chapter before this one dealt with prophets who “seduced my people, saying, Peace; and there was no peace” ([[Ezek. 13:10]]). This one turns to the people who go to prophets, and then to the prophet who tells them what they want to hear.

  There are two words of the Lord here, verses 1–11 and verses 12–23. The second names three righteous men who could not save a guilty land. Jeremiah records a word of the same kind, with Moses and Samuel in their place ([[Jer. 15:1]]), and Ezekiel argues the principle in full in chapter 18. The Joseph Smith Translation changes verse 9.

thread: |
  The chapter takes away two hopes, and it takes them away with the same rule.

  The first hope is that a person can keep his idols and still get a word from the Lord by going to a prophet. The Lord says He will answer such a man Himself, and the answer is judgment (verses 4, 7–8). A prophet who gives him some other word shares his fate: “the punishment of the prophet shall be even as the punishment of him that seeketh unto him” (verse 10).

  The second hope is that the righteous few will shield the city. Four times the Lord supposes a land under one of His judgments with Noah, Daniel, and Job living in it, and each time the three would deliver only themselves. Then the rule is turned on Jerusalem, which will receive all four judgments together.

  In both halves each person stands for himself. Inquirer and prophet each bear their own iniquity; the righteous deliver only themselves. And both halves end by stating a purpose. The first is so “that they may be my people, and I may be their God” (verse 11). The second is so that the exiles “shall know that I have not done without cause all that I have done” (verse 23). The sentence that runs through the book since chapter 6 stands in verse 8: “ye shall know that I am the LORD” (see the note on [[Ezek. 6:7]]).

sections:
  - range: 1-5
    heading: 'Idols in the heart'
    plain: |
      Some of the elders of Israel come and sit in front of Ezekiel. The word of the Lord comes to him: these men have set up their idols in their hearts and have put the stumblingblock of their iniquity in front of their faces. Should He let Himself be inquired of by them at all? Ezekiel is to tell them that any man of the house of Israel who sets up his idols in his heart, puts his stumblingblock before his face, and then comes to the prophet will be answered by the Lord, according to the multitude of his idols. He will do this to lay hold of the house of Israel by their hearts, because all of them are estranged from Him through their idols.
  - range: 6-11
    heading: 'The inquirer and the prophet'
    plain: |
      So Ezekiel is to say to the house of Israel: Repent. Turn from your idols, and turn your faces away from all your abominations. Any Israelite, or any foreigner living in Israel, who separates himself from the Lord, sets up his idols in his heart, and then comes to a prophet to inquire of the Lord will be answered by the Lord Himself. He will set His face against that man, make him a sign and a byword, and cut him off from His people, and they will know that He is the Lord.

      If the prophet is deceived and speaks a word, the verse says that the Lord has deceived that prophet (the Joseph Smith Translation reads that He has not; see the note on [[Ezek. 14:9]]). The Lord will stretch out His hand against him and destroy him from among His people Israel. Both will bear their punishment, the prophet’s the same as the inquirer’s, so that the house of Israel will no longer stray from Him or defile themselves with their transgressions, but will be His people, and He their God.
  - range: 12-20
    heading: 'Noah, Daniel, and Job'
    plain: |
      The word of the Lord comes again. Suppose a land sins against Him by acting faithlessly, and He stretches out His hand against it, breaks its supply of bread, sends famine, and cuts off man and beast. Even if Noah, Daniel, and Job were in it, they would save only their own lives by their righteousness. Suppose He sent wild beasts through the land to ravage it, until it was desolate and no one could pass through. As He lives, those three men would save neither sons nor daughters; they alone would be saved, and the land would be desolate. Suppose He brought a sword on that land: the same. Suppose He sent a pestilence and poured out His fury on it in blood. As He lives, Noah, Daniel, and Job would save neither son nor daughter, only their own lives by their righteousness.
  - range: 21-23
    heading: 'All four upon Jerusalem'
    plain: |
      How much more, then, when the Lord sends all four of His severe judgments on Jerusalem: sword, famine, wild beasts, and pestilence, to cut off man and beast. Yet some will be left in it and brought out, sons and daughters. They will come out to the exiles, who will see their ways and their deeds and be comforted over the evil the Lord has brought on Jerusalem. The sight of how they live will comfort the exiles, who will know that He did nothing in the city without cause.

notes:
  - ref: 1
    phrase: 'sat before me'
    kind: history
    title: 'Elders in the prophet’s house'
    body: |
      These are leaders of the exile community, and this is the second of three times the book shows them sitting in front of Ezekiel. The first was at the opening of the temple vision, “as I sat in mine house, and the elders of Judah sat before me” ([[Ezek. 8:1]]; see the note there). The third is dated to the seventh year, when “certain of the elders of Israel came to inquire of the LORD, and sat before me” ([[Ezek. 20:1]]). During the exile the elders “came to his home to counsel with him,” so that he worked as a prophet “in a very personal, face-to-face setting.”

      This time the text does not say what they asked, or that they asked anything. The word of the Lord comes before they are heard, and it is about the men and not about a question of theirs. The visitors of chapter 20 do come “to inquire,” and are told so directly: “I will not be inquired of by you” ([[Ezek. 20:3]]).
    sources: [lds-scriptures, lund-ezekiel]

  - ref: 3
    phrase: 'set up their idols in their heart'
    kind: words
    title: 'Idols taken into the heart'
    body: |
      The charge is about what these men have let into their minds; the text mentions no image in their houses. The Hebrew says they have made their idols “go up” upon their heart: the verb is the common one for going up, in the form that means to bring something up. A modern translation has “these men have taken their idols into their hearts.” The word for idols is *gillulim*, Ezekiel’s usual and scornful one (see the note on [[Ezek. 6:4]]).

      “The stumblingblock of their iniquity” is a phrase Ezekiel has used before. *Mikshol*, a thing a person trips over, comes eight times in his book and three times in this chapter (verses 3, 4, and 7). He first joined it to “iniquity” in chapter 7, where it was silver and gold: “because it is the stumblingblock of their iniquity” ([[Ezek. 7:19]]). Here the men have “put” it “before their face.” Another modern translation has that they “placed their iniquity as a stumbling block before them.”
    sources: [oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 3
    phrase: 'should I be inquired of at all by them'
    kind: scripture
    title: 'Whether the Lord will be consulted'
    body: |
      The question expects the answer no, and the Hebrew presses it by writing the verb twice, which the King James gives as “at all.” One modern translation has “Should I indeed let myself be consulted by them?” The form of the verb matters too. It does not ask whether the men may inquire but whether the Lord will allow Himself to be inquired of: “shall I let myself be consulted by them?”

      The refusal is spoken outright to the elders of chapter 20: “As I live, saith the Lord GOD, I will not be inquired of by you” ([[Ezek. 20:3]]). It is not the book’s last word on the matter. After the promise of cleansing and a new heart, the Lord says, “I will yet for this be inquired of by the house of Israel, to do it for them” ([[Ezek. 36:37]]). In this chapter the question is followed by a command, in verse 6: “Repent, and turn yourselves from your idols.”
    sources: [oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 4
    phrase: 'according to the multitude of his idols'
    kind: words
    title: 'The answer the Lord gives'
    body: |
      The Lord does promise these inquirers an answer, and verses 7–8 say more about it. Verse 7 repeats the sentence with a different ending, “I the LORD will answer him by myself,” which a modern translation gives as “I the Lord will answer him myself.” Verse 8 goes straight on to what He will do: “I will set my face against that man, and will make him a sign and a proverb, and I will cut him off from the midst of my people.”

      For “according to the multitude of his idols” the ancient Greek translation has that he is answered “according to the things in which his mind is entangled.”
    sources: [esv, lxx-rahlfs, lds-scriptures]

  - ref: 5
    phrase: 'take the house of Israel in their own heart'
    kind: words
    title: 'Laid hold of by the heart'
    body: |
      “Take” is a verb for seizing, and this clause gives the purpose of the severe answer. The Hebrew *taphas* means to “lay hold of, seize,” and is used of arresting a person or capturing a city. This verse is listed as a figurative use, to “seize Israel” by “their heart,” with the gloss “terrorize them.” A modern translation has “that I may lay hold of the hearts of the house of Israel.”

      The reason follows: “they are all estranged from me through their idols.” The verb is related to the Hebrew word for “foreigners,” and the same form is used in Isaiah’s charge against Judah, “they are gone away backward” ([[Isa. 1:4]]).
    sources: [bdb, esv, lds-scriptures]

  - ref: 7
    phrase: 'or of the stranger that sojourneth in Israel'
    kind: scripture
    title: 'The law’s sentence, for Israelite and stranger'
    body: |
      Verses 7–8 take their wording from the law, which bound the foreigner living in Israel along with the native-born. The wording of verse 7 has been traced, almost word for word, to Leviticus 17: “whatsoever man there be of the house of Israel, or of the strangers that sojourn among you, that eateth any manner of blood; I will even set my face against that soul that eateth blood, and will cut him off from among his people” ([[Lev. 17:10]]). Ezekiel’s sentence has the same parts in the same order: the Israelite and the stranger, the Lord’s face set against the offender, and the cutting off from the people.

      The threat of verse 8 is likewise “composed of passages in the law.” One of them is the law on familiar spirits. “The soul that turneth after such as have familiar spirits, and after wizards,” the Lord says there, “I will even set my face against that soul, and will cut him off from among his people” ([[Lev. 20:6]]). And “a sign and a proverb” follows, “though somewhat freely,” the covenant curse: “thou shalt become an astonishment, a proverb, and a byword” ([[Deut. 28:37]]).

      The man’s offence is described with an unexpected verb. “Separateth himself” is *nazar*, which elsewhere means to “devote, dedicate oneself” or to “hold sacredly aloof.” Here it is used with “from” the Lord, “of apostasy.” A word for setting oneself apart to God is used of a man who sets himself apart from Him.
    sources: [lds-scriptures, keil-ezekiel, bdb]

  - ref: 9
    phrase: 'I the LORD have deceived that prophet'
    kind: scripture
    title: 'Does the Lord deceive a prophet?'
    body: |
      The Joseph Smith Translation changes this verse to say the opposite of what the King James says: “And if the prophet be deceived when he hath spoken a thing, I the Lord have not deceived that prophet.” The question a reader puts to the King James wording is the one the change answers.

      The ancient Greek translation reads much as the King James does: “I the Lord have caused that prophet to err.” The Hebrew verb is *pittah*, “to persuade, to entice by friendly words.” This verse is listed with two other places where the Lord is its subject and a prophet its object. One is Jeremiah’s complaint, “O LORD, thou hast deceived me, and I was deceived” ([[Jer. 20:7]]). The other is Micaiah’s vision of the heavenly court before Ahab’s last battle, where a spirit says, “I will be a lying spirit in the mouth of all his prophets,” and is told, “Thou shalt persuade him, and prevail also” ([[1 Kgs. 22:22]]).

      The King James wording has been explained as a Hebrew way of speaking: “it is common in the Hebrew language to state a thing as done by the Lord which he only suffers or permits to be done.” That explanation, like the Joseph Smith Translation, does not make the Lord the deceiver.

      The prophet in view need not be one of the frauds of chapter 13, who “prophesy out of their own hearts” ([[Ezek. 13:2]]). He has been read as “one who really thinks that he has a word of God,” and who lets himself be talked into giving the inquirer something other than the call to repent in verses 6–8: any word “which could by any possibility confirm the sinner in his security.”

      Verse 10 then gives the two men one sentence: “the punishment of the prophet shall be even as the punishment of him that seeketh unto him.”
    sources: [lds-scriptures, ot-manual-26, lxx-rahlfs, bdb, keil-ezekiel, clarke-ezekiel]

  - ref: 11
    phrase: 'that they may be my people, and I may be their God'
    kind: scripture
    title: 'What the judgment is for'
    body: |
      Verse 11 gives the purpose of the severity of verses 4–10: “that the house of Israel may go no more astray from me, neither be polluted any more with all their transgressions; but that they may be my people, and I may be their God.” Its last clause is the sentence the book gave with the promise of a new heart, “they shall be my people, and I will be their God” ([[Ezek. 11:20]]). It comes again when the two kingdoms are made one: “so shall they be my people, and I will be their God” ([[Ezek. 37:23]]).
    sources: [lds-scriptures, nrsvue]

  - ref: 14
    phrase: 'Noah, Daniel, and Job'
    kind: history
    title: 'Why Noah, Daniel, and Job'
    body: |
      The three are named as patterns of righteousness, and one of them was alive when Ezekiel spoke. Scripture calls both Noah and Job “perfect” ([[Gen. 6:9]]; [[Job 1:1]]), which is to say fully upright in keeping the commandments given them. Daniel is the Daniel of the book that bears his name, “a contemporary of Ezekiel in Babylon.” He was “taken captive to Babylon” in a siege dated to the third year of Jehoiakim ([[Dan. 1:1]]), and by one older reckoning he “had been Fourteen years in captivity” at this point. These two verses and [[Ezek. 28:3]] are counted among the references to him. So the list includes a righteous man of the exiles’ own day.

      The order is not the order of time, since Daniel stands between two men of the distant past. The text does not explain it. One explanation is that “the enumeration is not intended to be chronological” but follows how far each man’s righteousness reached: “Noah saved his family along with himself; Daniel was able to save his friends,” “but Job, with his righteousness, was not even able to save his children.” The passages are these. To Noah the Lord said, “Come thou and all thy house into the ark; for thee have I seen righteous before me in this generation” ([[Gen. 7:1]]). When the wise men of Babylon were to be killed, Daniel “made the thing known to Hananiah, Mishael, and Azariah, his companions” ([[Dan. 2:17]]). Of Job’s children the messenger reported that the house “fell upon the young men, and they are dead” ([[Job 1:19]]).
    sources: [ot-manual-26, bd-daniel, keil-ezekiel, clarke-ezekiel, lds-scriptures]

  - ref: 16
    phrase: 'they shall deliver neither sons nor daughters'
    kind: scripture
    title: 'No one delivered on another’s righteousness'
    body: |
      The second oracle removes a hope that scripture itself seemed to allow: that a few righteous people might save a guilty city. Abraham had asked this for Sodom and was told, “I will not destroy it for ten’s sake” ([[Gen. 18:32]]). The first half of the chapter has been read as leaving that possibility “still open,” that the Lord would spare Judah and Jerusalem “for the sake of the righteous therein, as He had promised the patriarch Abraham,” and the second half as closing it. Jeremiah was given the same word in another form: “Though Moses and Samuel stood before me, yet my mind could not be toward this people” ([[Jer. 15:1]]).

      The wording changes after the first case. Verse 14 says only that the three would “deliver but their own souls by their righteousness.” The next three cases add an oath, “as I live,” and a denial, “neither sons nor daughters.” One explanation of the difference is that the first statement, that the Lord would not sweep away the righteous with the wicked, “needed no asseveration, inasmuch as this truth was not called in question.” On that explanation the oath is kept for the thing the people were hoping against.

      For “souls” a modern translation has “lives”: “they would deliver but their own lives by their righteousness.” The subject is who survives the judgment on the land.

      The principle is that each person stands or falls by his own actions and cannot lean on someone else’s righteousness. Ezekiel argues it at length four chapters later: “the righteousness of the righteous shall be upon him, and the wickedness of the wicked shall be upon him” ([[Ezek. 18:20]]). That chapter is noted for teaching each person’s responsibility for the consequences of his own conduct.
    sources: [keil-ezekiel, ot-manual-26, bd-ezekiel, esv, lds-scriptures]

  - ref: 21
    phrase: 'my four sore judgments'
    kind: scripture
    title: 'Four judgments from the law'
    body: |
      The four judgments have their counterparts among the covenant curses of Leviticus 26, and Jerusalem is to receive all of them at once. Verses 13–19 take them one at a time, each against a land that is not named. Famine comes first, in the law’s phrase, “when I have broken the staff of your bread” ([[Lev. 26:26]]; see the note on [[Ezek. 5:16]]). Then come the beasts: “I will also send wild beasts among you, which shall rob you of your children” ([[Lev. 26:22]]). Sword and pestilence are from one verse: “I will bring a sword upon you, that shall avenge the quarrel of my covenant” ([[Lev. 26:25]]). Moses’s warnings in that chapter are probably the chief antecedent of Ezekiel’s judgments generally (see the note on [[Ezek. 5:2]]).

      Ezekiel had already named the same four together at the end of chapter 5: “So will I send upon you famine and evil beasts, and they shall bereave thee” ([[Ezek. 5:17]]).

      “Sore” and “noisome” translate one Hebrew adjective, the ordinary word for “evil” or harmful. Word for word, the verse speaks of four evil judgments and of an evil beast. A modern translation has “my four disastrous acts of judgment” and “wild beasts.”

      “How much more” applies the rule to the city. The four cases were suppositions about any land under a single judgment. Jerusalem is named, and all four are sent on it.

      John’s vision of the pale horse has the same list, power “to kill with sword, and with hunger, and with death, and with the beasts of the earth” ([[Rev. 6:8]]).
    sources: [lds-scriptures, lund-ezekiel, oshb-wlc, esv]

  - ref: 22
    phrase: 'ye shall be comforted concerning the evil'
    kind: words
    title: 'Comforted by seeing the cause'
    body: |
      The comfort promised here has been explained as coming not from any goodness in the survivors but from the exiles seeing for themselves that the judgment was deserved. The survivors are called “sons and daughters,” the words of the refrain in verses 16, 18, and 20, and they are taken as “not of righteous persons, but some of the guilty,” brought out of the city to Babylon. Of their “way” and “doings” it has been said, “The context certainly points to wicked ways and evil works.” On this reading it is the sight of such conduct that shows the Lord had “not done without cause” what He did. The Hebrew behind that phrase, *chinnam*, is the word for something done “gratuitously, without cause, undeservedly.”

      The Hebrew uses one verb for both “ye shall be comforted” and “they shall comfort you.” The newcomers comfort the exiles “not by expressions of pity, but by the sight of their conduct.” Those who see it will understand “not only that the punishment endured was a chastisement well deserved, but that God in His righteousness would stay the punishment when it had fulfilled His purpose.”
    sources: [keil-ezekiel, jfb-ezekiel, bdb, oshb-wlc, lds-scriptures]

christ: |
  The LORD who says “I the LORD will answer him by myself” is Jehovah, the premortal Jesus Christ (see the note on [[Ezek. 1:26]]). In this chapter He sees what is set up in the heart, and He states the purpose of His judgments.

  That purpose is in verse 11: “that they may be my people, and I may be their God.” When the sentence returns at [[Ezek. 37:23]], the next verse names a king: “And David my servant shall be king over them; and they all shall have one shepherd” ([[Ezek. 37:24]]). The servant David of the book’s shepherd promise is understood to be Jesus Christ, the Good Shepherd, a descendant of David.

explore: |
  - The chapter just before this one, on the prophets who say “Peace”: [[Ezek. 13:1–16]].
  - The elders’ next visit, and the Lord’s later promise to be inquired of: [[Ezek. 20:1–3]] and [[Ezek. 36:37]].
  - The full argument that each person answers for himself: [[Ezek. 18]].
  - Jeremiah’s parallel word, with Moses and Samuel as the intercessors and “four kinds” of destroyers: [[Jer. 15:1–4]].
  - Abraham’s plea for Sodom: [[Gen. 18:23–33]].
  - Micaiah’s vision of the lying spirit: [[1 Kgs. 22:19–23]].
  - The covenant curses behind the four judgments: [[Lev. 26:21–26]].

