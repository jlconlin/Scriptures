chapter: 10
title: The Glory at the Threshold
tagline: In the temple court Ezekiel sees again the throne he saw by the Chebar. Fire is taken from under it for the city, and the glory of the LORD moves from the house to the east gate.
when: 'No date of its own: the chapter stands under the heading of 8:1, the fifth day of the sixth month in the sixth year of Jehoiachin’s captivity, about 591 B.C.'

setting: |
  This chapter is the third scene of one vision, which begins at [[Ezek. 8:1]] and ends at [[Ezek. 11:25]]. Ezekiel was sitting in his house in Babylonia, with the elders of Judah before him, when the spirit lifted him and brought him “in the visions of God to Jerusalem” ([[Ezek. 8:3]]). When the vision is over he is brought back “to them of the captivity,” and he tells them everything he was shown ([[Ezek. 11:24–25]]).

  What he has seen so far explains what happens here. In chapter 8 he was led through the temple and shown the idolatry practised inside it, ending in the inner court with men who stood with their backs to the temple and worshipped the sun. In chapter 9 six men with weapons were summoned, and a seventh clothed in linen; the seventh marked the foreheads of those who grieved over the abominations, and the six struck down the rest, beginning at the sanctuary.

  Now, in that same court, the throne of chapter 1 is before him. The temple was still standing when Ezekiel reported this to the exiles; Nebuchadnezzar’s captain of the guard burned it afterwards ([[2 Kgs. 25:9]]).

thread: |
  The chapter shows two things together: **fire for Jerusalem is taken from beneath the Lord’s throne, and His glory begins to leave His temple.** The house had been defiled, and “without his protecting presence it was able to be destroyed.”

  It moves in two steps, with a long description between them. In the first (verses 1–8) the man in linen is sent in among the wheels for fire, and a cherub puts the fire into his hands. In the second (verses 18–19) the glory, which has been standing at the threshold of the house, takes its place over the cherubim, and they carry it out to the east gate. The departure is finished in the next chapter, when the glory goes up from the city to the mountain on its east ([[Ezek. 11:23]]).

  Between the two steps Ezekiel describes the wheels and the creatures all over again (verses 9–17), and at the end he does it a third time (verses 20–22). This is not carelessness. Three times he says that this is what he saw by the river Chebar, and once he adds that he now knows what the creatures are: cherubim, the beings whose images stood over the ark. The repetition makes the chapter’s second point. What leaves the temple is the same glory that had already come to the exiles.

  The chapter does not explain itself the way Ezekiel’s sign-acts do. The reason for the departure was given at the start of the vision ([[Ezek. 8:6]]), and a promise to the exiles comes at its end ([[Ezek. 11:16]]).

sections:
  - range: 1-2
    heading: The throne, and a command to take fire
    plain: |
      Then I looked, and in the firmament over the heads of the cherubim there appeared something like a sapphire stone, in form like a throne. He spoke to the man clothed with linen: Go in between the wheels, under the cherub; fill your hands with coals of fire from between the cherubim and scatter them over the city. And he went in while I watched.
  - range: 3-8
    heading: The cloud fills the house, and a cherub hands over the fire
    plain: |
      The cherubim were standing on the right side of the house when the man went in, and the cloud filled the inner court. The glory of the Lord rose from the cherub and stood over the threshold of the house; the house was filled with the cloud, and the court was full of the brightness of the Lord’s glory. The sound of the cherubim’s wings could be heard as far as the outer court, like the voice of Almighty God when He speaks. When He commanded the man clothed with linen to take fire from between the wheels, from between the cherubim, the man went in and stood beside the wheels. One cherub reached out his hand to the fire that was between the cherubim, took some of it, and put it into the hands of the man clothed with linen, who took it and went out. Under the cherubim’s wings there appeared the form of a man’s hand.
  - range: 9-17
    heading: The wheels and the cherubim, seen again
    plain: |
      I looked, and there were four wheels beside the cherubim, one wheel beside each, gleaming like beryl. All four looked alike, as if a wheel were inside a wheel. They could go in any of their four directions without turning as they went; wherever the head faced, they followed. Their whole body, their backs, their hands, their wings and the wheels were full of eyes all around. As for the wheels, it was cried to them in my hearing, O wheel. Each had four faces: the first was the face of a cherub, the second the face of a man, the third the face of a lion, and the fourth the face of an eagle. And the cherubim rose. This is the living creature that I saw by the river Chebar. When the cherubim went, the wheels went beside them; when the cherubim lifted their wings to rise from the earth, the wheels did not turn away from beside them. When those stood, these stood; when those rose, these rose with them, for the spirit of the living creature was in them.
  - range: 18-22
    heading: The glory leaves the threshold for the east gate
    plain: |
      Then the glory of the Lord left the threshold of the house and stood over the cherubim. The cherubim lifted their wings and rose from the earth as I watched, the wheels beside them as they went out, and they stopped at the door of the east gate of the Lord’s house, with the glory of the God of Israel over them above. This is the living creature that I saw under the God of Israel by the river Chebar, and I knew that they were cherubim. Each had four faces and four wings, and the likeness of a man’s hands under their wings. Their faces, their appearance and they themselves were the same that I saw by the river Chebar. Each went straight forward.

notes:
  - ref: 2
    phrase: the man clothed with linen
    kind: history
    title: The scribe of chapter 9, sent a second time
    body: |
      The man clothed with linen is the figure who marked the faithful in chapter 9, and here he is given a second errand. He came in with six others who carried weapons, “clothed with linen, with a writer’s inkhorn by his side” ([[Ezek. 9:2]]), and when his first errand was done he reported, “I have done as thou hast commanded me” ([[Ezek. 9:11]]). The next thing said to him is this verse.

      The text calls him a man and never names him, but his clothing says something. “Linen” is *baddîm*, “white linen,” the material of the priests’ vestments, among them the holy garments Aaron put on to enter the holy place ([[Lev. 16:4]]). The phrase “clothed in linen garments” is used of an angel, in this vision and again of the “man clothed in linen” whom Daniel saw ([[Dan. 10:5]]). He is, then, a heavenly messenger, and what he wears is the material of a priest’s vestments.
    sources: [lds-scriptures, bdb, oshb-wlc]
  - ref: 2
    phrase: coals of fire from between the cherubims, and scatter them over the city
    kind: symbol
    title: Fire from under the throne, for the city
    body: |
      The coals have been understood as the burning of Jerusalem, shown before it happened: they point to “the judgments and eventual burning and destruction which would come upon the city.”

      The vision stops short of showing the fire fall. A cherub puts it into the man’s hands, and verse 7 ends with him going out. That last word has been taken to tell the rest: he went out and scattered the coals over the city “to set it on fire and consume it.” The event came afterwards, when the captain of Nebuchadnezzar’s guard “burnt the house of the LORD, and the king’s house, and all the houses of Jerusalem” ([[2 Kgs. 25:9]]).

      What the detail signifies is where the fire comes from. It is not brought in from outside. It is taken “from between the cherubims,” from under the throne Ezekiel has just seen above them (verse 1), and one of the cherubim hands it over. The image has been read accordingly: the fire that consumes the city is kindled from the fire of God, “the fire of His wrath.”
    sources: [ot-manual-26, keil-ezekiel, lds-scriptures]
  - ref: 4
    phrase: the glory of the LORD went up from the cherub
    kind: history
    title: 'The first step: from the cherub to the threshold'
    body: |
      This verse tells of a short move, from “the cherub” to the doorway of the temple building. The same thing was said, in nearly the same words, when the slaughter of chapter 9 began: “the glory of the God of Israel was gone up from the cherub, whereupon he was, to the threshold of the house” ([[Ezek. 9:3]]). The text does not say whether verse 4 tells that move again or tells a second one. It has been read as a second: the glory “had risen up again” from the throne and gone to the threshold, so that the command about the fire in verse 2 was given from the doorway, as the command about the mark had been.

      In both verses the Hebrew is singular, *the* cherub, and 9:3 says the glory had been upon it. Two answers have been given to which cherub is meant. One is that the glory came out from the interior of the sanctuary, where the cherubim of the ark were; the Lord had promised to commune with Israel “from between the two cherubims which are upon the ark” ([[Ex. 25:22]]). The other is that the singular is used collectively for the living cherubim of the vision, over whom the glory was “already stationed” in the court, and who stand on the “right side” of the house in verse 3, which is its south side. On this second reading the glory steps from its throne to the door and, in verse 18, back to the throne. The verse itself does not say.

      “Threshold” is the entrance of the house itself; a recent translation has “the entryway of the temple.” The glory has not yet left the building. It stands in the doorway.
    sources: [lds-scriptures, oshb-wlc, keil-ezekiel, nrsvue]
  - ref: 4
    phrase: the house was filled with the cloud
    kind: scripture
    title: The cloud that filled the house at its dedication
    body: |
      A cloud had filled the Lord’s house twice before in scripture, when the tabernacle was set up and when Solomon’s temple was dedicated, and here the same sign appears as the glory stands at the door. When the tabernacle was first set up, “a cloud covered the tent of the congregation, and the glory of the LORD filled the tabernacle” ([[Ex. 40:34]]). When Solomon brought the ark into the temple, “the priests could not stand to minister because of the cloud: for the glory of the LORD had filled the house of the LORD” ([[1 Kgs. 8:11]]).

      Ezekiel, a priest, sees the cloud fill the inner court and then the house, and the court “full of the brightness” of the glory. He hears it too: the sound of the cherubim’s wings carries to the outer court, “as the voice of the Almighty God when he speaketh.” The comparison is the one he used by the Chebar, where the wings sounded “as the voice of the Almighty” ([[Ezek. 1:24]]).

      So the house is filled once more, as at its beginning. The next time the book speaks of the house being filled is in its last vision, of another temple: “behold, the glory of the LORD filled the house” ([[Ezek. 43:5]]).
    sources: [lds-scriptures]
  - ref: 13
    phrase: O wheel
    kind: words
    title: 'O wheel: a name or a summons'
    body: |
      The verse has two different Hebrew words for the wheels, and translators disagree about what is being said. The ordinary word in this vision is *ʾôpannîm*, the “wheels” of verses 9 and 19 and the first word of this verse. The word behind “O wheel” is *galgal*, “wheel, whirl, whirlwind,” which Ezekiel uses elsewhere for the wheels of war chariots ([[Ezek. 23:24]]; [[Ezek. 26:10]]). It is also the word in the commands of verses 2 and 6, where the man is sent in “between the wheels.”

      One reading takes the verse as a naming: Ezekiel hears the wheels given the name the voice had used for them. The ancient Greek translation reads it so, keeping the Hebrew word as a name, “these wheels were called Gelgel in my hearing,” and a recent English version has “they were called in my hearing ‘the wheelwork.’”

      The other reading, which the King James Version follows, takes it as a cry addressed to the wheels. On this view “in my hearing” shows that someone is calling to them, not naming them, and the word is a command: whirl, set yourselves in motion. The cry then “gave the signal for their departure,” and that fits what follows, since two verses later “the cherubims were lifted up.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, keil-ezekiel]
  - ref: 14
    phrase: the first face was the face of a cherub
    kind: words
    title: The face of a cherub where the ox was
    body: |
      The four faces listed here are a cherub, a man, a lion and an eagle; by the Chebar they were a man, a lion, an ox and an eagle ([[Ezek. 1:10]]). Why “the face of a cherub” stands where the ox stood has no settled answer.

      The Hebrew is more exact than the English: it is “the face of *the* cherub,” with the article. Two explanations have been given.

      The first keeps the text and reads it closely. Ezekiel is not listing the four faces of each creature again but naming, for each of the four cherubim, the one face “which was turned toward him.” The article then points to “one particular cherub,” the one who has just handed the fire to the man in linen (verse 7), whose face needed no description. A copyist’s slip is judged unlikely on this view, since it is hard to see how the one word could have come from the other.

      The second starts from the idea that the faces stand for classes of living creatures in God’s kingdom; if so, “the problem is not difficult,” because a cherub, as a servant of God, is in the same category with all of them. That rests on a meaning for the faces, and the full meaning of the vision has not been revealed (see the note on [[Ezek. 1:10]]).

      The ancient Greek version gives no help here: one English translation of the Septuagint marks verse 14 as omitted.

      Ezekiel himself says the faces had not changed: in verse 22 they were “the same faces which I saw by the river of Chebar.”
    sources: [oshb-wlc, keil-ezekiel, ot-manual-26, scripture-helps-ezek, lxx-rahlfs, lds-scriptures]
  - ref: 15
    phrase: This is the living creature that I saw by the river of Chebar
    kind: scripture
    title: The same glory he saw among the exiles
    body: |
      Three times in this chapter Ezekiel stops to say that what he sees in the temple is what he saw in Babylonia: here, in verse 20, and in verse 22. That insistence is why verses 9–17 and 21–22 go over the wheels, the faces, the wings and the hands again, much of it in the words of [[Ezek. 1:15–21]]. Not every detail is the same. There the rims of the wheels “were full of eyes” ([[Ezek. 1:18]]); here the creatures’ bodies, backs, hands and wings are full of eyes as well (verse 12).

      The identity matters in both directions. For Jerusalem, it means that what is leaving the temple is the glory of the LORD itself, the presence that made the house holy. For the exiles, it means that what came to them by the Chebar was that same presence. The two visions have been read together in this way: the reason Ezekiel could see the Lord from his place in exile is that “Jehovah has left his house in Jerusalem.”

      Before the vision ends the Lord speaks of those He has scattered among the countries: “yet will I be to them as a little sanctuary in the countries where they shall come” ([[Ezek. 11:16]]).
    sources: [lds-scriptures, shannon-location]
  - ref: 18
    phrase: the glory of the LORD departed from off the threshold of the house
    kind: scripture
    title: Why the Lord leaves His house
    body: |
      The glory goes because the house has been defiled, and the vision said so before it showed it. In its first scene the Lord asked Ezekiel whether he saw “the great abominations that the house of Israel committeth here, that I should go far off from my sanctuary?” ([[Ezek. 8:6]]). The rest of chapter 8 shows those abominations, one after another, inside the temple. This verse is the going far off. The temple had become a place where the Lord could no longer fittingly dwell, “so he leaves it behind to destruction.”

      That is why the fire of verse 2 and the departure of this verse belong together: without His presence the house could be destroyed. The principle has been put plainly: the God of Israel will not abide in a polluted sanctuary, and when the cherubim lift their wings the house is left to its doom.

      A revelation to Joseph Smith states the same rule in both directions, and it has been set beside Ezekiel’s vision. Of a house His people were to build to Him, the Lord said that if no unclean thing came into it, “my glory shall rest upon it” ([[D&C 97:15]]). “But if it be defiled I will not come into it, and my glory shall not be there; for I will not come into unholy temples” ([[D&C 97:17]]). [Waters out of the Sanctuary](/ezekiel/themes/waters-out-of-the-sanctuary/) follows the house from this departure to the river.
    sources: [lds-scriptures, shannon-location, milgrom-temple]
  - ref: 19
    phrase: the door of the east gate of the LORD’s house
    kind: scripture
    title: Out by the east gate, and back by the same way
    body: |
      The glory stops at the east gate, the front of the temple, and the last vision of the book shows it coming back by the same gate. In this chapter it moves from the cherub to the threshold (verse 4), from the threshold to its place over the cherubim (verse 18), and then with them to the east gate, where they stop. They are still there when the next chapter opens ([[Ezek. 11:1]]); where the glory goes from the gate is told in the note on [[Ezek. 11:23]].

      East was the direction the temple faced: “the forefront of the house stood toward the east” ([[Ezek. 47:1]]). The men who worshipped the sun at its door had “their backs toward the temple of the LORD, and their faces toward the east” ([[Ezek. 8:16]]). So the glory goes out by the front, through the court to the gate.

      In the last vision of the book Ezekiel is taken to the gate that looks east, “and, behold, the glory of the God of Israel came from the way of the east” ([[Ezek. 43:2]]). Then “the glory of the LORD came into the house by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]).
    sources: [lds-scriptures]
  - ref: 20
    phrase: I knew that they were the cherubims
    kind: history
    title: 'The creatures named: cherubim and the temple'
    body: |
      Ezekiel names the creatures only when he sees them in the temple, where figures of cherubim stood. By the Chebar he called them living creatures ([[Ezek. 1:5]]). Here he says, “I knew that they were the cherubims.” He does not say how he knew.

      Figures of cherubim stood in the Holy of Holies and on the mercy seat of the ark (see the note on [[Ezek. 1:5]]). Solomon set in the inner room “two cherubims of olive tree, each ten cubits high” ([[1 Kgs. 6:23]]). The plan David gave Solomon calls the figures over the ark “the chariot of the cherubims” ([[1 Chr. 28:18]]), and a psalm says of the Lord, “he rode upon a cherub, and did fly” ([[Ps. 18:10]]). Ezekiel was a priest, and in the scriptures of his people cherubim stand where the Lord’s presence is and bear Him.

      Both are at work in this chapter. Cherubim have been described as the guardians of the way into the place where God dwells, and also as His chariot. When the glory leaves, “it is carried on the backs of the cherubim away from the temple,” so that they attend the Lord even when He “rejects his house entirely.” Their connection to the temple “becomes increasingly clear” as the book goes on.

      A word on the word: *cherubim* (Hebrew *kĕrûbîm*) is already a plural, so the King James “cherubims” adds an English plural to a Hebrew one.
    sources: [lds-scriptures, bd-cherubim, shannon-guarded, bd-ezekiel, oshb-wlc]

christ: |
  The glory that leaves the temple is the visible presence of Jehovah, the premortal Christ (see the note on [[Ezek. 1:26]]). It is He who goes out from the house to the east gate.

  His leaving the house is not His leaving His people. Before this vision closes He promises the scattered exiles that He Himself will be “as a little sanctuary” to them where they are ([[Ezek. 11:16]]).

explore: |
  - **Follow the glory.** Read its movements in order: [[Ezek. 8:4]], [[Ezek. 9:3]], [[Ezek. 10:4]], [[Ezek. 10:18–19]], [[Ezek. 11:22–23]], and then the return in [[Ezek. 43:1–5]].
  - **The cloud in the house.** Compare verses 3–4 with [[Ex. 40:34–35]] and [[1 Kgs. 8:10–11]].
  - **Fire cast on the earth.** Compare the coals scattered here with the fire an angel takes from the altar in John’s vision ([[Rev. 8:5]]).
  - **A temple and its holiness.** Read [[D&C 97:15–17]] beside verse 18, and then [[1 Cor. 3:16–17]].
  - **Cherubim in the temple.** “‘Come Near unto Me’: Guarded Space and Its Mediators in the Jerusalem Temple” (in *Ascending the Mountain of the Lord*) explains the cherubim as guardians of sacred space and as the Lord’s chariot.

parallels:
  - ref: Ezek. 1:4–28
    note: The first vision of the throne, by the river Chebar, which this chapter says three times is the same.
  - ref: Ezek. 43:1–5
    note: The glory returns from the east and fills the house.
  - ref: 1 Kgs. 8:10–11
    note: The cloud and the glory fill Solomon’s temple at its dedication.
  - ref: D&C 97:15–17
    note: The Lord’s glory rests on a house kept undefiled and will not be in one that is defiled.
  - ref: Rev. 8:5
    note: An angel casts fire from the altar into the earth.

