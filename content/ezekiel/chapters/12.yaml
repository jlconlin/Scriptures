chapter: 12
title: An Exile’s Pack and a Proverb Silenced
tagline: Before exiles who will not see, Ezekiel packs a bag, breaks out through a wall in the dark, and eats his bread trembling; then the Lord answers the two sayings by which the people keep prophecy at a distance.
when: 'No date of its own. The chapter stands under the heading of the vision of chapters 8–11, “the sixth year, in the sixth month” (8:1) of Jehoiachin’s captivity, about 591 B.C.; the siege it foresees begins in the ninth year (24:1–2).'

setting: |
  The chapter has no date of its own. It stands under the heading of the vision that fills chapters 8–11, “the sixth year, in the sixth month” ([[Ezek. 8:1]]) of Jehoiachin’s captivity, about 591 B.C. That vision has just ended: the Spirit brought Ezekiel back “into Chaldea, to them of the captivity,” and he told them everything he had been shown ([[Ezek. 11:24–25]]). The prophecies of judgment against Jerusalem go on from here to chapter 24.

  Jerusalem is still standing, with Zedekiah, the “last king of Judah,” ruling in it. The siege will begin in the ninth year ([[Ezek. 24:1–2]]). The people who watch Ezekiel are captives carried away along with Jehoiachin, and what they want to hear is that they are going home. Others were saying so. A prophet in Jerusalem had promised that within “two full years” the temple vessels would come back, and Jeconiah and the captives with them ([[Jer. 28:3–4]]). Jeremiah had written to the exiles telling them to build houses and settle, and not to let the prophets and diviners among them deceive them, because the captivity would last seventy years ([[Jer. 29:5–10]]).

  The chapter is five words of the Lord, each with its own opening (verses 1, 8, 17, 21, 26). In the first three Ezekiel acts out two signs and is given the meaning of the first. In the last two the Lord quotes what the people are saying about prophecy and answers it.

thread: |
  The chapter is about the ways a people avoids a prophet, and the Lord closes them one at a time. The first is not looking. The house of Israel has “eyes to see, and see not,” so Ezekiel is told to preach with his body: seven times in verses 3–7 the thing is to be done “in their sight.” He packs what an exile carries, breaks out through a wall after dark, and goes off with his face covered. The next morning the Lord supplies the meaning. The one leaving is “the prince in Jerusalem,” and everyone there goes with him.

  The second is saying that visions come to nothing: “The days are prolonged, and every vision faileth.” The third is politer. It grants the vision and moves it out of reach: “he prophesieth of the times that are far off.” To both the Lord gives the same answer, and it is a deadline: “in your days, O rebellious house, will I say the word, and will perform it.”

  Seeing runs through the first half. The people will not see; the prince covers his face “that he see not the ground”; he is carried to Babylon, “yet shall he not see it.” The chapter ends on what cannot be put off: “the word which I have spoken shall be done.”

sections:
  - range: 1-7
    heading: Packing for exile, in their sight
    plain: |
      Son of man, you live among a rebellious house. They have eyes to see and do not see, and ears to hear and do not hear. So pack an exile’s baggage, and go into exile by day while they watch, from your place to another place. Perhaps they will see, rebellious as they are. Bring your baggage out by day while they watch. In the evening go out yourself while they watch, as people go who are led away. Dig through the wall while they watch, and take your things out through it. Lift the pack on your shoulder and carry it out in the dark, with your face covered so that you cannot see the land, because I have made you a sign to the house of Israel. I did as I was commanded. I brought my baggage out by day, in the evening I dug through the wall with my hand, and in the dark I carried it out on my shoulder while they watched.
  - range: 8-16
    heading: 'The meaning: the prince and all Jerusalem'
    plain: |
      In the morning the Lord said: Has the rebellious house not asked you what you are doing? Tell them that this oracle is about the prince in Jerusalem and all the house of Israel there. Say: I am a sign for you. What I have done will be done to them; they will go into exile, into captivity. The prince among them will shoulder his pack in the dark and go out. They will dig through the wall to bring him out. He will cover his face so that he does not see the land with his eyes. I will spread my net over him and he will be caught in my snare. I will bring him to Babylon, the land of the Chaldeans, but he will not see it, and there he will die. All who are around him to help him, and all his troops, I will scatter to every wind, and I will draw a sword after them. They will know that I am the LORD when I scatter them among the nations. But I will leave a few of them, spared from sword, famine, and pestilence, to tell all their abominations among the nations where they go; and they will know that I am the LORD.
  - range: 17-20
    heading: Bread eaten with trembling
    plain: |
      Son of man, eat your bread shaking, and drink your water trembling and anxious. Say to the people of the land: This is what the Lord GOD says about those who live in Jerusalem and in the land of Israel. They will eat their bread in anxiety and drink their water in dismay, because their land will be stripped of all that fills it, on account of the violence of everyone who lives there. The inhabited cities will be laid waste and the land will be a desolation, and you will know that I am the LORD.
  - range: 21-25
    heading: '“Every vision faileth”'
    plain: |
      Son of man, what is this proverb you have about the land of Israel: “The days go on and on, and every vision comes to nothing”? Tell them: I will put an end to this proverb; they will not repeat it in Israel any more. Say to them instead: “The days are near, and the fulfillment of every vision.” There will be no more empty visions or smooth divinations in the house of Israel. I am the LORD. What I speak will be done, and it will not be put off any longer. In your own days, rebellious house, I will speak the word and carry it out.
  - range: 26-28
    heading: '“For many days to come”'
    plain: |
      Son of man, the house of Israel is saying, “The vision he sees is for a time many days off; he prophesies about distant times.” So tell them: None of my words will be put off any longer. The word I speak will be done, says the Lord GOD.

notes:
  - ref: 2
    phrase: which have eyes to see, and see not
    kind: scripture
    title: Eyes that see not, and a sign done in their sight
    body: |
      The charge that opens the chapter explains the method of what follows: a people who will not see are given something to look at. The words are old ones. Moses told Israel that the Lord had not yet given them “eyes to see, and ears to hear” ([[Deut. 29:4]]). Isaiah was sent to a people who would “see ye indeed, but perceive not” ([[Isa. 6:9]]). Jeremiah spoke to those “which have eyes, and see not; which have ears, and hear not” ([[Jer. 5:21]]). Ezekiel’s verse gives the cause twice, at its beginning and its end: “a rebellious house.” Nothing is wrong with the eyes.

      So the Lord has Ezekiel act. “In their sight” comes seven times in verses 3–7, and in Hebrew it is the word of verse 2 again: before their eyes. The hope stated in verse 3, “it may be they will consider,” uses the plain verb of verse 2 as well: perhaps they will see. The verb then follows the sign to its end. The prince will cover his face “that he see not the ground with his eyes” (verse 12), and of Babylon it is said, “yet shall he not see it” (verse 13).
    sources: [lds-scriptures, oshb-wlc]
  - ref: 5
    phrase: Dig thou through the wall
    kind: history
    title: Out through the wall, in the dark
    body: |
      Ezekiel leaves by a hole he breaks in a wall at nightfall, and verse 7 says he did it: “I digged through the wall with mine hand.” The performance “evidently took place in the strictness of the letter.” The order matters. By day he carries his pack out where it can be seen. In the evening he breaks the hole. In the dark he goes out through it with the pack on his shoulder. The pack, the King James “stuff for removing,” is in Hebrew the baggage of exile: “a pilgrim’s staff and traveller’s wallet, with the provisions and utensils necessary for a journey.”

      The wall is most likely that of his own house. The word, *qir*, is the usual one for the wall “of house or chamber,” though the lexicon leaves these verses “indeterminate”; on the reading followed here he was to go out “not by the door of the house, but through a hole which he had broken in the wall.” The verb is the one used of burglars who “dig into houses.” The King James “twilight” is a word the lexicon finds elsewhere only for the dark “attending sunset” in [[Gen. 15:17]], taken either as dusk or as “the darkness of the depth of night.”

      Verse 12 says what it means: the prince will go out in the dark, through a wall. When Jerusalem fell, the king and his soldiers “fled by night by the way of the gate between two walls” ([[2 Kgs. 25:4]]). The flight by night matches the sign. The digging is less certain. “It is not expressly stated, indeed, in the historical accounts that a breach was made in the wall,” though the mention of a gate between two walls has been taken to make one very probable, and it has also been stated outright that they escaped “through a breach in the wall.” What the sign shows either way is a king leaving his capital secretly, at night.
    sources: [keil-ezekiel, clarke-ezekiel, bdb, oshb-wlc, lds-scriptures]
  - ref: 6
    phrase: thou shalt cover thy face, that thou see not the ground
    kind: symbol
    title: The covered face
    body: |
      The covered face is the one part of the sign whose explanation points two ways. “Ground” is the ordinary Hebrew word for “land,” so Ezekiel walks out unable to see the land. In verse 12 that is the land the prince is leaving: he covers his face and does not see it “with his eyes.” Verse 13 then turns to the land he is going to: he will be brought to Babylon, “yet shall he not see it.”

      What the gesture itself would have been has been read three ways. It may be “a sign of the shame and grief with which Zedekiah left the city,” though it is “not mentioned in the historical accounts.” The old Greek translation adds a purpose: the prince covers his face “that he may not be seen by any eye, and he himself shall not see the ground.” And because Zedekiah’s eyes were put out before he was taken to Babylon, the third reading is blunt: “Referring to the blinding of Zedekiah.” The first and third have been held together: the words refer first to a king who fled in sorrow and did not want to see the land, and they “were fulfilled in another way” when he was blinded and did not see the land he was taken to. None of the three is settled. The fulfillment is at verse 13.
    sources: [keil-ezekiel, clarke-ezekiel, lxx-rahlfs, oshb-wlc, lds-scriptures]
  - ref: 10
    phrase: the prince in Jerusalem
    kind: history
    title: 'The prince is Zedekiah, and the burden is his'
    body: |
      “The prince in Jerusalem” is Zedekiah, the “last king of Judah,” and the title given him here is not “king.” The word is *nasi*, “one lifted up,” a chief, and this verse is among those where Ezekiel uses it “of Zedekiah.” The chapter does not say why, and no source read for it gives a reason.

      “This burden concerneth the prince” is, in Hebrew, two nouns set side by side: *ha-nasi ha-massa*, the prince, the burden. *Massa* means a “load, burden,” and it is also the word for a prophet’s “utterance, oracle,” which is its sense in this verse. The verb for what Ezekiel does with his pack and what the prince will do with his, “bear” (verses 6, 7, 12), is built on the same three consonants, so that in Hebrew the title, the oracle, and the carrying sound alike.
    sources: [bdb, oshb-wlc, bd-zedekiah]
  - ref: 11
    phrase: I am your sign
    kind: words
    title: A sign for the exiles about those at home
    body: |
      The sign is given to one group about another: “I am *your* sign: like as I have done, so shall it be done unto *them*.” The word is *mopheth*, a “wonder, sign, portent,” and here a “sign or token of future event.” It is a word used of people as well as of acts: in [[Isa. 8:18]], and of Ezekiel here and again later, “Thus Ezekiel is unto you a sign” ([[Ezek. 24:24]]). The book’s first acted sign is called “a sign to the house of Israel” ([[Ezek. 4:3]]).

      “Them” is the prince and the people in Jerusalem (verse 10). “You” is the exiles in front of him, who were carried away with Jehoiachin. Why they need a sign about a distant city is answered by what they were hoping for: a sign of the king going out with a pack on his shoulder “would deprive them of all hope of a speedy return to their native land.”
    sources: [bdb, oshb-wlc, keil-ezekiel, bd-ezekiel, lds-scriptures]
  - ref: 13
    phrase: yet shall he not see it, though he shall die there
    kind: scripture
    title: Brought to Babylon without seeing it
    body: |
      The prince will be brought to Babylon, die there, and never see it. The verse does not say how that can be, and the history of the city’s fall does. The Chaldean army “overtook him in the plains of Jericho: and all his army were scattered from him” ([[2 Kgs. 25:5]]), which is verse 14. At Riblah they killed his sons in front of him, “and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon” ([[2 Kgs. 25:7]]), where he was kept “in prison till the day of his death” ([[Jer. 52:11]]).

      Jeremiah had told the same king something that sounded like the opposite: “thine eyes shall behold the eyes of the king of Babylon” ([[Jer. 34:3]]). Josephus tells that Zedekiah heard both prophecies, noticed that Ezekiel said he “should not see Babylon” while Jeremiah said the king of Babylon would “carry him away thither in bonds,” and for that reason “disbelieved what they both appeared to agree in.” That is Josephus’s account and not scripture’s. But both sayings held: Zedekiah “looked into the eyes of the Babylonian king, yet he never saw the land of Babylon.” The note on [[Jer. 39:7]] sets the two prophecies beside the event.

      The verse also says who the hunter is. Nebuchadnezzar’s soldiers ran the king down, but the net is “my net” and the snare “my snare,” and Ezekiel repeats the sentence in chapter 17: “I will spread my net upon him, and he shall be taken in my snare” ([[Ezek. 17:20]]).
    sources: [lds-scriptures, josephus-antiquities, lund-ezekiel]
  - ref: 16
    phrase: that they may declare all their abominations among the heathen
    kind: history
    title: Why a few are spared
    body: |
      A few are left alive so that the nations will hear from Judah’s own people why Jerusalem fell. The verse gives the purpose itself: the survivors are to “declare all their abominations among the heathen whither they come.” Otherwise the fall of the Lord’s city could be taken for weakness in the Lord. On this reading, which is one commentary’s and not a statement of the text, the survivors speak “in order that the heathen may learn that it is not from weakness, but simply to punish idolatry, that God has given up His people.”

      The scattering and the sparing both end in the book’s refrain, which comes three times in this chapter (verses 15, 16, 20) and is explained where it first gathers, at [[Ezek. 6:7]].
    sources: [keil-ezekiel]
  - ref: 18
    phrase: eat thy bread with quaking
    kind: symbol
    title: A meal eaten in fear
    body: |
      The second sign is a way of eating: Ezekiel is to take his ordinary food shaking. The Hebrew for “quaking” is “generally an earthquake or violent convulsion; here, simply shaking.” In chapter 4 the bread was weighed and the water measured ([[Ezek. 4:16]]), and the point was hunger. Here it is not. Bread and water “is the standing expression for food,” and the sign lies “merely in the signs of anxiety and trouble with which Ezekiel was to eat.” The text does not report his doing it: “The carrying out of this sign is not mentioned.”

      Verse 19 names those the sign is about, “the inhabitants of Jerusalem”: the prophecy concerns those “who were still in the land,” and not the captives. It shows what life there will be before the end comes: every meal taken in dread, while the country around is emptied. The verse gives the cause in one word that the first sign did not: it is “because of the violence of all them that dwell therein.”
    sources: [keil-ezekiel, lds-scriptures]
  - ref: 22
    phrase: The days are prolonged, and every vision faileth
    kind: words
    title: A proverb against the prophets, rewritten
    body: |
      The saying is a popular proverb that turns the passing of time into an argument against prophecy: the days go by, and no vision comes to anything. The Hebrew *mashal* is here a “proverbial saying, brief terse sentence of popular sagacity,” and the lexicon sets beside it the proverb of the sour grapes in [[Ezek. 18:2]], the other saying about the land of Israel that the Lord quotes back to the people.

      The Lord’s answer keeps the proverb’s shape and reverses each half. For “the days are prolonged” he gives “the days are at hand.” For “every vision faileth” he gives “the effect of every vision,” where “effect” is the Hebrew for “word,” the same noun as “the word that I shall speak” in verse 25: the days are near, and so is the word of every vision. A new proverb is to drive out the old.

      Then comes a limit: “in your days, O rebellious house.” The book’s own dates measure it. This chapter stands under the sixth year ([[Ezek. 8:1]]). In the ninth, “the king of Babylon set himself against Jerusalem” ([[Ezek. 24:2]]). In the twelfth a fugitive reached the exiles with the words “The city is smitten” ([[Ezek. 33:21]]). By the book’s own count, the word was performed within a few years of the proverb.
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 24
    phrase: flattering divination
    kind: words
    title: Smooth divination
    body: |
      “Flattering divination” is the word of prophets who told people what they wished to hear. “Flattering” is the Hebrew *chalaq*, “smooth,” the word of the “smooth man” in [[Gen. 27:11]]; here it is “divination of flattery.” In these years in Jerusalem “false prophets began to abound, predicting that Babylon would be overthrown and the captives returned,” and the next chapter is given to them: they “see visions of peace for her, and there is no peace” ([[Ezek. 13:16]]).

      Verse 24 begins with “For,” so it is part of the answer to the proverb: the empty vision and the smooth divination are to cease in Israel, and the Lord’s own word is to be performed without more delay (verse 25).
    sources: [bdb, oshb-wlc, lund-ezekiel, lds-scriptures]
  - ref: 27
    phrase: he prophesieth of the times that are far off
    kind: scripture
    title: 'The second saying: not in our time'
    body: |
      The second saying does not deny the vision. It postpones it. The proverb of verse 22 said that visions fail; this one lets the vision stand and places what Ezekiel sees “many days to come,” in someone else’s lifetime. The Lord answers both with one verb. “Prolonged” in verses 25 and 28 is the Hebrew *mashak*, to “draw out, prolong,” and in these two verses it means “it shall not be postponed”; a related form describes hope “postponed, deferred” in [[Prov. 13:12]]. The people stretch the time out, and the Lord says it will stretch no further.

      Scripture names this evasion elsewhere. Amos speaks to those who “put far away the evil day” ([[Amos 6:3]]). The mistake is to ignore a warning by “thinking that the fulfillment is not imminent,” so that “repentance can come later”; it is the mind of those who say “Eat, drink, and be merry” in [[2 Ne. 28:7]], and the Savior warned against it in [[Matt. 24:37–44]].
    sources: [bdb, oshb-wlc, ot-manual-26, lds-scriptures]

christ: |
  The chapter names no deliverer and promises nothing but the fall of a city. Its witness is in the one who speaks. He is the LORD, and “Jehovah is the premortal Jesus Christ” (the note on [[Ezek. 1:26]] takes this up). The charge that opens the chapter, eyes that see not and ears that hear not, is one He made again in His mortal ministry, of those to whom He spoke in parables: “they seeing see not; and hearing they hear not” ([[Matt. 13:13]]). The likeness is one of words; Ezekiel’s chapter does not itself look ahead to that day.

explore: |
  - **The sign fulfilled.** [[2 Kgs. 25:1–7]] and [[Jer. 52:4–11]], with the notes on [[Jer. 39:7]] and [[Jer. 52:11]].
  - **The net again.** [[Ezek. 17:11–21]].
  - **The prophets of smooth things.** [[Ezek. 13:1–16]], and one of them in Jerusalem in [[Jer. 28:1–17]].
  - **Ezekiel as a sign once more.** [[Ezek. 24:15–27]].
  - **The other proverb the Lord forbids.** [[Ezek. 18:1–4]], with [[Jer. 31:29–30]].
  - **The word that does not return empty.** [[Isa. 55:10–11]], which the Church edition’s footnote joins to verse 25.

