chapter: 2
title: 'Sent to a Rebellious House'
tagline: 'The voice from the throne raises Ezekiel to his feet, sends him to a people who will not listen, and holds out a roll written on both sides with lamentations, mourning, and woe.'
when: 'The day of the first vision: the fifth day of the fourth month, in the fifth year of king Jehoiachin’s captivity (1:1–2), about 592 B.C. The chapter has no date of its own; it stands under the heading of chapter 1.'

setting: |
  Chapter 2 goes on from chapter 1 without a pause. Ezekiel was a priest, “one of the captives carried away by Nebuchadnezzar along with Jehoiachin,” who settled at Tel Abib on the river Chebar. The exiles were carried to Babylon in about 597 B.C., and the vision is dated to the fifth year of that captivity ([[Ezek. 1:1–2]]). He has just seen “the appearance of the likeness of the glory of the Lord” and fallen on his face, and he hears “a voice of one that spake” ([[Ezek. 1:28]]). This chapter is what the voice says.

  It is the first part of Ezekiel’s call, and the call does not end with the chapter. The roll he is shown in verses 9–10 is eaten in [[Ezek. 3:1–3]], the charge is repeated, and only at [[Ezek. 3:15]] does he come back to the captives, where he sits among them for seven days. So chapter 2 is best read as the opening of one scene: the Lord describes the people Ezekiel is sent to, tells him not to fear them, and gives him the first thing to obey.

  The message itself is not given yet. The chapters that follow the call (4–24) are prophecies against Jerusalem. Other prophets were handed a book as Ezekiel was: Lehi in Jerusalem in these same years ([[1 Ne. 1:11–13]]), and John, who was told to eat one ([[Rev. 10:9–10]]).

thread: |
  The chapter tells Ezekiel the truth about his mission before he begins it. The people are named by one word, over and over: the King James text has “rebellious” or “rebelled” seven times in ten verses. He is not promised that they will listen. He is told to speak “whether they will hear, or whether they will forbear,” and that in the end they “shall know that there hath been a prophet among them” ([[Ezek. 2:5]]).

  Against that the Lord sets what He gives. The man lying on his face is told to stand, and the spirit sets him on his feet. He is told three times not to be afraid. And the last command turns the chapter’s word on Ezekiel himself: “Be not thou rebellious like that rebellious house” ([[Ezek. 2:8]]). What marks him off from his people is that he will hear, open his mouth, and take in what the Lord hands him, which is a roll of mourning.

sections:
  - range: 1-2
    heading: 'Stand upon thy feet'
    plain: |
      The voice speaks to Ezekiel, who is lying on his face: Son of man, stand on your feet, and I will speak with you. As the voice speaks, the spirit enters him and sets him on his feet, and he hears the one who is speaking to him.
  - range: 3-5
    heading: 'Sent to a people who have rebelled'
    plain: |
      The Lord says He is sending Ezekiel to the children of Israel, a rebellious people who have rebelled against Him. They and their fathers have transgressed against Him to this very day. The children are hard-faced and hard-hearted. Ezekiel is sent to them, and he is to say, “Thus saith the Lord GOD.” Whether they listen or refuse to listen, since they are a rebellious house, they will know that a prophet has been among them.
  - range: 6-7
    heading: 'Be not afraid of them'
    plain: |
      Ezekiel is not to be afraid of them or of their words, though briers and thorns are around him and he lives among scorpions. He is not to fear what they say or be dismayed at their looks, though they are a rebellious house. He is to speak the Lord’s words to them whether they listen or refuse, for they are most rebellious.
  - range: 8-10
    heading: 'Open thy mouth, and the roll'
    plain: |
      Ezekiel himself is to listen to what the Lord says to him and not be rebellious like that rebellious house. He is to open his mouth and eat what the Lord gives him. He looks, and a hand is reaching toward him with the roll of a book in it. The roll is spread out in front of him. It is written on the front and on the back, and what is written on it is lamentations, mourning, and woe.

notes:
  - ref: 1
    phrase: 'Son of man'
    kind: words
    title: 'Son of man means a human being'
    body: |
      “Son of man” is the Lord’s name for Ezekiel, and it means a human being. The Hebrew is *ben adam*, which can also be translated “son of a human,” and in the Old Testament the expression often means simply “a man.” The Lord addresses Ezekiel this way more than ninety times in the book, and in this chapter He never uses his name. As a form of address it is said to occur in only one other place, when Daniel is told, “Understand, O son of man” ([[Dan. 8:17]]).

      Why this name, and why here? The term seems to stress Ezekiel’s mortality beside the divine and eternal nature of God, and the moment fits: he has just seen the glory of the Lord and fallen on his face ([[Ezek. 1:28]]), and the first word he hears says what he is. Daniel too had fallen on his face when he was called this. One older reading takes the point further. The address marks “the distance between the human weakness of his nature and the divine power which gives him the capacity and the impulse to speak,” so that it shows “how powerfully the word of God operates in feeble man.” That is an interpretation, and a plausible one; the text does not explain the name.

      It is not the Savior’s title. Jesus used “Son of Man” of Himself in the Gospels, and the phrase in Ezekiel “is not to be confused with the title ‘Son of Man,’ which refers to Christ.”
    sources: [scripture-helps-ezek, bd-son-of-man, keil-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 2
    phrase: 'the spirit entered into me'
    kind: scripture
    title: 'The command to stand comes with the power to stand'
    body: |
      Ezekiel does not get up by his own strength: the Lord tells him to stand, and the spirit that enters him sets him on his feet. He was on his face at the end of chapter 1 ([[Ezek. 1:28]]). The verse ties the spirit’s coming to the speaking: it entered him “when he spake unto me” ([[Ezek. 2:2]]). It has been explained as “the spirit-power which proceeds from God, and which is conveyed through the word,” giving him strength to stand before God and to take up what he is commanded. The ancient Greek translation, the Septuagint, is fuller: the spirit “took me up, and raised me, and set me on my feet.”

      The same thing happens again when Ezekiel next sees the glory and falls down: “Then the spirit entered into me, and set me upon my feet” ([[Ezek. 3:24]]).
    sources: [lds-scriptures, keil-ezekiel, lxx-rahlfs]

  - ref: 3
    phrase: 'a rebellious nation'
    kind: history
    title: 'Who Ezekiel is sent to'
    body: |
      Ezekiel is sent to his own people, and in practice to the exiles around him. The charge is given again in the next chapter in plainer terms: “get thee to them of the captivity, unto the children of thy people” ([[Ezek. 3:11]]), and he goes to “them of the captivity at Tel-abib, that dwelt by the river of Chebar” ([[Ezek. 3:15]]). The Lord says outright that this is not a mission to foreigners: “thou art not sent to a people of a strange speech and of an hard language, but to the house of Israel” ([[Ezek. 3:5]]).

      The accusation reaches back through the generations: “they and their fathers have transgressed against me, even unto this very day” ([[Ezek. 2:3]]). The charge is laid against the living as well as their fathers.

      One detail of the Hebrew is hidden by the King James wording. “Nation” is a plural, *goyim*, “nations.” The word is sometimes used of Israel, “especially of Israel and (or) Judah as sinful, rebellious,” which suits this verse, though that use is comparatively rare. The Septuagint has no such word here and reads simply “the house of Israel, them that provoke me,” and the word has been questioned on that ground. Why the Hebrew has the plural is not explained in the text.
    sources: [lds-scriptures, bd-ezekiel, oshb-wlc, bdb, lxx-rahlfs]

  - ref: 4
    phrase: 'impudent children and stiffhearted'
    kind: words
    title: 'Hard faces and strong hearts'
    body: |
      Both words speak of hardness, and the Hebrew is bodily: word for word the people are hard of face and strong of heart. The first adjective, *qasheh*, “hard, severe,” is the one in the old description of Israel as “a people stiff of neck, stubborn.” The second, *chazaq*, is the ordinary word for “strong, stout, mighty,” used here in the sense “hard of heart.” The Septuagint does not have this half of the verse (its verse 4 is only “And thou shalt say to them, Thus saith the Lord”), and the phrase is marked as omitted by some; the Hebrew text has it.

      The pair comes back in the next chapter with the parts exchanged, where “impudent and hardhearted” ([[Ezek. 3:7]]) is in Hebrew “hard (= impudent) of forehead” and hard of heart. Then the Lord uses the same word for what He does to His prophet: “I have made thy face strong against their faces, and thy forehead strong against their foreheads” ([[Ezek. 3:8]]). That verse has the same adjective, in the sense “firm, hard, of face.” The “looks” Ezekiel is told not to be dismayed at in verse 6 are in Hebrew the same “faces.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, lds-scriptures]

  - ref: 5
    phrase: 'yet shall know that there hath been a prophet among them'
    kind: scripture
    title: 'What the mission is measured by'
    body: |
      The Lord does not promise Ezekiel that anyone will listen; He promises that they will know a prophet was among them. The phrase “whether they will hear, or whether they will forbear” comes three times in the call, here, in verse 7, and at [[Ezek. 3:11]]. The Lord is frank about which it will be: “the house of Israel will not hearken unto thee; for they will not hearken unto me” ([[Ezek. 3:7]]). To refuse the prophet is to refuse the One who sent him.

      Notice too what Ezekiel is given to say. No message follows, only the words “Thus saith the Lord GOD” ([[Ezek. 2:4]]). Before he is told what to say, he is told whose words they will be: “thou shalt speak my words unto them” ([[Ezek. 2:7]]).

      When will they know? The book answers long afterward, in nearly the same words: “And when this cometh to pass, (lo, it will come,) then shall they know that a prophet hath been among them” ([[Ezek. 33:33]]). The proof is to come from events, when what he has said takes place.
    sources: [lds-scriptures]

  - ref: 6
    phrase: 'though briers and thorns be with thee, and thou dost dwell among scorpions'
    kind: symbol
    title: 'Briers, thorns, and scorpions'
    body: |
      The three images are of things that prick and sting, in a verse about the people’s words and looks, and the first two words are less certain than the translation suggests. The first has been taken, with a question mark, as “rebel,” and the ancient versions read both words as participles, “resisting and despising thee”; the English versions have “briers and thorns.” The Septuagint is an example of the other reading: “for they will madden and will rise up against thee round about.”

      The second word is the “brier” of a later promise, where it is “figurative of national distress”: “there shall be no more a pricking brier unto the house of Israel, nor any grieving thorn of all that are round about them, that despised them” ([[Ezek. 28:24]]). There the thorns are hostile neighbors; here they are with Ezekiel himself. On either reading of the words, the verse is about what he will meet from his own people: their words and their looks.

      What the Lord gives against it is not a promise that the thorns will be taken away. It is a command, given three times in this one verse in the Hebrew: do not be afraid. Jeremiah heard the same at his call, “Be not afraid of their faces” ([[Jer. 1:8]]).
    sources: [bdb, lxx-rahlfs, oshb-wlc, lds-scriptures]

  - ref: 8
    phrase: 'Be not thou rebellious like that rebellious house'
    kind: words
    title: 'The rebellious house, and the prophet who must not join it'
    body: |
      The chapter’s chief word is turned at last on Ezekiel himself. The King James text has “rebellious” or “rebelled” seven times in these ten verses. Two Hebrew words lie behind them: a verb in verse 3, used twice, and the noun *meri*, “rebellion,” five times in verses 5–8. “Rebellious house” is this book’s own name for Israel: the phrase, “rebellious house (referring to Israel),” is listed only from Ezekiel, and the noun comes sixteen times in the book. One later verse sets the two names side by side: “the house of Israel, the rebellious house” ([[Ezek. 12:9]]).

      In verse 8 the Lord uses the noun of the prophet: “be not a rebellious person.” What will make him different from his people is in the two commands that follow. The first is “hear what I say unto thee” ([[Ezek. 2:8]]), with the same verb as “whether they will hear.” The second is to open his mouth and eat what he is given.

      So before he says a word to Israel, Ezekiel has to do the thing Israel will not do, which is to listen and take in what the Lord hands him. He does: “So I opened my mouth” ([[Ezek. 3:2]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 9
    phrase: 'a roll of a book'
    kind: scripture
    title: 'A book handed to a prophet'
    body: |
      Ezekiel is one of several prophets whose call includes a book given to him in vision. Lehi, in Jerusalem in these same years, saw one who “gave unto him a book, and bade him that he should read” ([[1 Ne. 1:11]]), and what he read was woe on the same city: “Wo, wo, unto Jerusalem, for I have seen thine abominations!” ([[1 Ne. 1:13]]). “One of the central features of many of these prophets’ visions is the giving of a heavenly book for the prophet to read which revealed future events.” The pattern is wider than those years. At the beginning of most dispensations a book is given to the newly called prophet: Moses received tablets, Lehi a book about the destruction of Jerusalem, Ezekiel a roll “containing the Lord’s message for the house of Judah in his day,” and John a book with seven seals.

      John was also handed a little book and told, “Take it, and eat it up” ([[Rev. 10:9]]). A revelation to Joseph Smith explains John’s eating: “it was a mission, and an ordinance, for him to gather the tribes of Israel” ([[D&C 77:14]]). That is said of John’s book, not of Ezekiel’s, though the two experiences have been set side by side as similar.

      For Ezekiel the eating comes in the next chapter ([[Ezek. 3:1–3]]), and it likely stands for his accepting the Lord’s message and making it part of himself. Jeremiah uses the same figure, “Thy words were found, and I did eat them” ([[Jer. 15:16]]).
    sources: [lds-scriptures, sc-knowhy-469, bateman-pattern, ot-manual-26, scripture-helps-ezek]

  - ref: 10
    phrase: 'written within and without'
    kind: symbol
    title: 'A roll written on both sides'
    body: |
      The roll is written on front and back, and all that is written on it is grief. An ancient book was written in columns on parchment or papyrus and rolled up, and the writing was ordinarily on one side: this roll is “contrary to the state of rolls in general, which are written on the inside only.” Why both sides? An old suggestion is that it was “because the prophecy was long, and to the same effect; that they might see the mind of God wherever they looked.” The text does not say.

      The three words for its contents are all words of mourning. The first is the plural of the word for an “elegy, dirge,” the kind of poem Ezekiel will later be told to take up over the princes of Israel, over Tyre, and over Pharaoh ([[Ezek. 19:1]]; [[Ezek. 27:2]]; [[Ezek. 32:2]]). The second is “a moaning.” The third is found “only Ezekiel 2:10,” and its form is uncertain (“Text very dubious”); the Septuagint has “Lamentation, and mournful song, and woe.”

      What was on the roll? It has been read as “all that the prophet was to announce, and what we now read in his book,” and its contents were mournful because “they related to the destruction of the kingdom, the destruction of Jerusalem and of the temple.” That is a reasonable reading of a vision that gives only the three words. On the same reading the sign says something about a prophet’s speech: he “is to announce to the people of Israel only that which the Lord inspires him to announce.”
    sources: [bd-roll, clarke-commentary, bdb, lxx-rahlfs, keil-ezekiel, lds-scriptures]

christ: |
  The voice that speaks all through this chapter is the one Ezekiel heard when he saw “the appearance of the likeness of the glory of the Lord” ([[Ezek. 1:28]]), and it gives him the words “Thus saith the Lord GOD” ([[Ezek. 2:4]]). The Lord, Jehovah, “is the premortal Jesus Christ.” So it is He who raises a man from the ground with a word, sends him, and tells him three times not to be afraid.

  The roll has an echo in John’s vision. John saw in the hand of Him who sat on the throne “a book written within and on the backside, sealed with seven seals” ([[Rev. 5:1]]), and heard it sung to the Lamb: “Thou art worthy to take the book, and to open the seals thereof: for thou wast slain, and hast redeemed us to God by thy blood” ([[Rev. 5:9]]). Ezekiel’s roll is not said to be the same book. But each prophet is shown a book written on both sides, and in John’s vision it is the slain Lamb who is worthy to take it.

  “Son of man” in this chapter is Ezekiel, not the Savior; the note on [[Ezek. 2:1]] explains the name.

explore: |
  - The rest of the call: the roll eaten and found sweet, the forehead made hard, and the return to the captives in [[Ezek. 3:1–15]].
  - Other prophets’ calls: [[Isa. 6:8–10]], [[Jer. 1:4–10]], and Lehi in [[1 Ne. 1:6–20]].
  - The words of verse 5 when they come back at the end: [[Ezek. 33:30–33]].

