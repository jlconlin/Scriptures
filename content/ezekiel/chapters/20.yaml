chapter: 20
title: 'For My Name’s Sake'
tagline: 'Elders come to ask the Lord a question and are given, in place of an answer, the history of Israel’s rebellions from Egypt to their own day. Then the Lord promises to be their king all the same, and to bring them through a second wilderness to His holy mountain.'
when: 'The seventh year of Jehoiachin’s captivity, the fifth month, the tenth day (20:1): about 590 B.C. The date stands over chapters 20–23, until the next one at 24:1, the ninth year.'

setting: |
  Ezekiel is in Babylon, “one of the captives carried away by Nebuchadnezzar along with Jehoiachin,” and Jerusalem is still standing. This is the book’s third date. It falls “only eleven months and five days after” the temple vision of chapters 8–11 and, counting to the date in [[Ezek. 24:1–2]], “two years and five months before the blockading of Jerusalem by the Chaldeans.”

  For the third time elders sit down in front of the prophet (see the note on [[Ezek. 14:1]]), and this time the text says why they came: “to inquire of the LORD.” They receive no answer to their question. Ezekiel is told to set Israel’s past in front of them.

  Chapter 23 will tell that past as the story of two sisters who “committed whoredoms in Egypt” ([[Ezek. 23:3]]). This chapter tells it without a figure, one period after another: Egypt, the wilderness, the next generation, the land. The chapter has two halves: the rebellions from Egypt to Ezekiel’s day, and a gathering “in the last days.”

  The last five verses (45–49) begin a new oracle. The Hebrew Bible counts them as the first five verses of chapter 21, where the oracle is explained.

thread: |
  The elders want a word from the Lord, and the Lord gives them their own history. It has been divided into “five distinct periods,” and the first three have one shape. In Egypt (verses 5–9), with the generation that came out (10–17), and with their children in the wilderness (18–26), the same things happen in the same order. The Lord gives a gift and a command. The people rebel. He says He will pour out His fury. Then He holds back, and each time the reason is the same sentence: “I wrought for my name’s sake.”

  The fourth period, in the land (27–29), ends with no restraint mentioned, only the words “unto this day.” The fifth is “the time of the prophet.” Verses 30–31 turn to the men in the room and tell them they are doing what their fathers did. That is why they will get no answer.

  Then the chapter turns (32–44). The exiles are thinking of becoming like the nations around them. The Lord says it will not happen. He will be their king, and He will do the exodus over again: out from the peoples, into a wilderness, under the shepherd’s rod, into the covenant, and at last to His holy mountain. The reason given at the end is the reason given three times in the history. He will have “wrought with you for my name’s sake, not according to your wicked ways” (verse 44).

sections:
  - range: 1-4
    heading: 'The elders come to inquire'
    plain: |
      In the seventh year, on the tenth day of the fifth month, some of the elders of Israel come to inquire of the Lord and sit before Ezekiel. The word of the Lord comes to him: Say to the elders, Have you come to inquire of me? As I live, I will not be inquired of by you. Will you judge them, son of man? Make them know the abominations of their fathers.
  - range: 5-9
    heading: 'In Egypt'
    plain: |
      Say to them: On the day I chose Israel, I lifted up my hand to the descendants of Jacob and made myself known to them in Egypt, saying, I am the Lord your God. That day I lifted up my hand to bring them out of Egypt into a land I had searched out for them, flowing with milk and honey, the glory of all lands. I told each of them to throw away the abominations his eyes were set on and not to defile himself with the idols of Egypt. But they rebelled and would not listen. None of them threw away those abominations or left the idols of Egypt. I said I would pour out my fury on them there in Egypt. But I acted for my name’s sake, so that it would not be polluted in the sight of the nations they lived among, before whose eyes I had made myself known to them by bringing them out.
  - range: 10-17
    heading: 'The generation that came out'
    plain: |
      So I brought them out of Egypt into the wilderness. I gave them my statutes and showed them my judgments; the person who does them will live by them. I also gave them my sabbaths as a sign between me and them, so that they would know that I am the Lord who sanctifies them. But the house of Israel rebelled in the wilderness. They did not walk in my statutes, they despised my judgments, and they greatly polluted my sabbaths. I said I would pour out my fury on them in the wilderness and consume them. But I acted for my name’s sake, so that it would not be polluted before the nations who had seen me bring them out. I also lifted up my hand to them in the wilderness that I would not bring them into the land I had given them, because they despised my judgments and polluted my sabbaths, for their heart went after their idols. Yet my eye spared them, and I did not make an end of them in the wilderness.
  - range: 18-26
    heading: 'Their children in the wilderness'
    plain: |
      I said to their children in the wilderness: Do not walk in the statutes of your fathers or keep their judgments or defile yourselves with their idols. I am the Lord your God. Walk in my statutes, keep my judgments, and keep my sabbaths holy, and they will be a sign between me and you. But the children rebelled too. They did not walk in my statutes or keep my judgments, by which the person who does them will live, and they polluted my sabbaths. I said I would pour out my fury on them in the wilderness. But I withdrew my hand and acted for my name’s sake, so that it would not be polluted before the nations who had seen me bring them out. I also lifted up my hand to them in the wilderness that I would scatter them among the nations, because they had not kept my judgments, had despised my statutes and polluted my sabbaths, and had their eyes on their fathers’ idols. So I also gave them statutes that were not good and judgments by which they would not live. I polluted them in their own gifts, in that they made everything that opens the womb pass through the fire, so that I might make them desolate, and so that they would know that I am the Lord.
  - range: 27-32
    heading: 'In the land, and unto this day'
    plain: |
      So speak to the house of Israel: In this too your fathers blasphemed me and trespassed against me. When I brought them into the land I had lifted up my hand to give them, they saw every high hill and every thick tree, and there they offered their sacrifices, presented the offerings that provoked me, made their sweet savour, and poured out their drink offerings. I said to them, What is the high place you go to? And it is called Bamah to this day. So say to the house of Israel: Are you polluted in the way of your fathers, and do you go whoring after their abominations? When you offer your gifts and make your sons pass through the fire, you pollute yourselves with all your idols to this day. And shall I be inquired of by you? As I live, I will not be. What you have in mind will never be: that you say, We will be like the nations, like the families of the countries, and serve wood and stone.
  - range: 33-38
    heading: 'A second wilderness'
    plain: |
      As I live, says the Lord God, with a mighty hand, a stretched out arm, and fury poured out I will rule over you. I will bring you out from the peoples and gather you from the countries where you are scattered, with a mighty hand, a stretched out arm, and fury poured out. I will bring you into the wilderness of the peoples and plead with you there face to face, as I pleaded with your fathers in the wilderness of the land of Egypt. I will make you pass under the rod and bring you into the bond of the covenant. I will purge out the rebels and those who transgress against me. I will bring them out of the country where they sojourn, but they will not enter the land of Israel, and you will know that I am the Lord.
  - range: 39-44
    heading: 'On the holy mountain'
    plain: |
      As for you, house of Israel: Go, each of you, and serve his idols, now and afterward, if you will not listen to me; but do not pollute my holy name any more with your gifts and your idols. For on my holy mountain, the mountain of the height of Israel, all the house of Israel, all of them in the land, will serve me. There I will accept them, and there I will require your offerings, the firstfruits of your oblations, and all your holy things. I will accept you with your sweet savour when I bring you out from the peoples and gather you from the countries where you have been scattered, and I will be sanctified in you before the nations. You will know that I am the Lord when I bring you into the land of Israel, the country I lifted up my hand to give to your fathers. There you will remember your ways and all the doings by which you were defiled, and you will loathe yourselves for all the evils you have done. And you will know that I am the Lord when I have dealt with you for my name’s sake, and not according to your wicked ways or your corrupt doings.
  - range: 45-49
    heading: 'The fire in the forest of the south'
    plain: |
      The word of the Lord comes again: Son of man, set your face toward the south, drop your word toward the south, and prophesy against the forest of the south field. Say to the forest of the south: Hear the word of the Lord. I will kindle a fire in you, and it will devour every green tree in you and every dry tree. The blazing flame will not be quenched, and every face from the south to the north will be burned by it. All flesh will see that I the Lord have kindled it; it will not be quenched. Then I said, Ah, Lord God! They say of me, Does he not speak parables?

notes:
  - ref: 1
    phrase: 'came to inquire of the LORD'
    kind: history
    title: 'An inquiry the Lord will not take'
    body: |
      The elders came for a word from the Lord, and verse 31 gives the reason they are refused: they are still polluting themselves with their idols. Elders came to Ezekiel’s home more than once during the exile, so that he worked as a prophet in “a very personal, face-to-face setting.” The text never says what these men asked.

      The refusal comes twice. Verse 3 gives it before the history is told, and verse 31 repeats it in the same words afterward. One modern translation sharpens the opening question: “Why are you coming? To consult me?” Between the two refusals stands the reason. The elders’ own generation is “polluted after the manner of your fathers” (verse 30), so the Lord will not treat the visit as a real inquiry. He had said as much of the elders in chapter 14, whose idols were in the heart (see the note on [[Ezek. 14:3]]).

      The refusal has been read with a principle Alma taught: “he that will harden his heart, the same receiveth the lesser portion of the word” ([[Alma 12:10]]). Had the elders truly wanted God’s word, “they would have obeyed that which they already had from His prophets.”
    sources: [lund-ezekiel, ot-manual-26, nrsvue, lds-scriptures]

  - ref: 4
    phrase: 'Wilt thou judge them'
    kind: words
    title: 'A question that is a command'
    body: |
      The repeated question is followed at once by a command that says what judging them is: “cause them to know the abominations of their fathers,” where the Hebrew verb is an imperative. A modern translation has “Let them know.”

      The same question opens two later indictments, and each time the same instruction follows at once. Of Jerusalem: “wilt thou judge, wilt thou judge the bloody city? yea, thou shalt shew her all her abominations” ([[Ezek. 22:2]]). Of the two sisters: “wilt thou judge Aholah and Aholibah? yea, declare unto them their abominations” ([[Ezek. 23:36]]). In all three places, to judge is to set the abominations before the accused.
    sources: [oshb-wlc, esv, lds-scriptures]

  - ref: 5
    phrase: 'lifted up mine hand'
    kind: words
    title: 'The lifted hand is an oath'
    body: |
      To lift the hand is to swear, and the Lord does it seven times in this chapter. Modern translations simply write “I swore.” The phrase comes from the Exodus account. When the Lord promised Moses the land “concerning the which I did swear to give it to Abraham” ([[Ex. 6:8]]), the Hebrew behind the King James “did swear” is this same expression, a lifted hand, and verse 28 of this chapter has the same Hebrew verb and noun.

      What matters is what the oaths are for. The first are promises: to be their God, and to bring them out to a land He had searched out for them (verses 5–6). The next two are sentences. In the wilderness He lifts His hand that the first generation will not enter the land (verse 15), and that their children will be scattered among the nations (verse 23). A psalm remembers the same pair: “he lifted up his hand against them, to overthrow them in the wilderness,” and their seed He would overthrow among the nations, “to scatter them in the lands” ([[Ps. 106:26–27]]).

      The last two oaths in the chapter return to the promise: the land “for the which I lifted up mine hand to give it to your fathers” (verse 42). In verse 22 the hand moves the other way. “I withdrew mine hand” is how the chapter says a judgment was held back.
    sources: [oshb-wlc, esv, lds-scriptures]

  - ref: 7
    phrase: 'the idols of Egypt'
    kind: history
    title: 'Idolatry in Egypt'
    body: |
      The books of Moses do not record that Israel refused to give up idols in Egypt; the Lord states it here. “It is true that there is nothing expressly stated in the Pentateuch as to the refusal of the Israelites to obey the command of God, or their unwillingness to give up idolatry in Egypt,” but it has been inferred from the people’s refusal to listen to Moses ([[Ex. 6:9]]) and “still more plainly from their relapse into Egyptian idolatry” in the golden calf.

      Two other passages agree with Ezekiel. Joshua, at the end of his life, told Israel to “put away the gods which your fathers served on the other side of the flood, and in Egypt” ([[Josh. 24:14]]). And the law’s mention of sacrifices offered “unto devils, after whom they have gone a whoring” ([[Lev. 17:7]]) has been taken as a reference to Egyptian idolatry.

      Ezekiel calls the idols “the abominations of his eyes.” The phrase has been explained of things that were abominable and yet “were looked upon with delight by them.” Verse 24 uses the same picture of the next generation: “their eyes were after their fathers’ idols.”

      Beginning in Egypt changes the story. What follows has been called a picture of “the apostasy of the nation from time immemorial”: the rebellion is as old as the choosing.
    sources: [keil-ezekiel, lds-scriptures]

  - ref: 9
    phrase: 'I wrought for my name’s sake'
    kind: structure
    title: 'Spared three times for the sake of the name'
    body: |
      This sentence is the turning point of each scene in the history, and it gives the Lord’s reason for not ending Israel when Israel deserved it. It comes at verses 9, 14, and 22, each time after He has said He would pour out His fury, and each time with the same concern: that His name “should not be polluted before the heathen.” The Hebrew verb is used of profaning what is holy. This chapter uses it for what the people did to the sabbaths (verses 13, 16, 21, 24), and here, in the passive, of the name of God. Modern translations have “profaned.”

      The nations had watched the Lord bring this people out. Had He destroyed them, the nations might have said that He had been unable to deliver His people. Moses made that argument after the golden calf: “Wherefore should the Egyptians speak, and say, For mischief did he bring them out, to slay them in the mountains” ([[Ex. 32:12]]). He made it again when the people refused to enter the land. The nations would say it was because “the LORD was not able to bring this people into the land which he sware unto them” ([[Num. 14:16]]). The threat of verse 13 has been compared with those two occasions, when the decree to cut Israel off was revoked “at the intercession of Moses.”

      The restoration ends with the sentence a fourth time, and with what it excludes: “for my name’s sake, not according to your wicked ways” (verse 44). Later in the book the Lord says it again: “I do not this for your sakes, O house of Israel, but for mine holy name’s sake” ([[Ezek. 36:22]]).
    sources: [bdb, esv, keil-ezekiel, lds-scriptures]

  - ref: 11
    phrase: 'which if a man do, he shall even live in them'
    kind: scripture
    title: 'The law that gives life'
    body: |
      The clause is a quotation from the law, and the chapter has it three times before verse 25 speaks of judgments “whereby they should not live.” Its source is Leviticus: “Ye shall therefore keep my statutes, and my judgments: which if a man do, he shall live in them” ([[Lev. 18:5]]). Ezekiel has it here, at verse 13, and at verse 21, each time attached to the statutes Israel was given and then despised.

      Other scripture quotes the clause too. The prayer of confession in Nehemiah names it as the thing sinned against ([[Neh. 9:29]]), and Paul quotes it as Moses’s description of “the righteousness which is of the law” ([[Rom. 10:5]]; see also [[Gal. 3:12]]).

      The statutes were given for life. When the chapter comes to “statutes that were not good, and judgments whereby they should not live,” the words deny what this clause affirms (see the note on [[Ezek. 20:25]]).
    sources: [lds-scriptures]

  - ref: 12
    phrase: 'my sabbaths, to be a sign between me and them'
    kind: scripture
    title: 'The Sabbath as the sign'
    body: |
      The Sabbath is named apart from the rest of the law because it was the sign between the Lord and this people. Verse 12 is close to the wording of Exodus: “my sabbaths ye shall keep: for it is a sign between me and you throughout your generations; that ye may know that I am the LORD that doth sanctify you” ([[Ex. 31:13]]). What the sign teaches is first about the Lord: He is the one who makes them holy.

      The chapter then names the Sabbath in every count of the wilderness indictment. The first generation “greatly polluted” it (verse 13). It is named again in the reason they were kept out of the land (16), commanded afresh to their children (20), polluted by them (21), and named in the reason for the scattering (24). The verb is the one used for what the Lord would not let happen to His name (see the note on [[Ezek. 20:9]]).
    sources: [bdb, lds-scriptures]

  - ref: 25
    phrase: 'statutes that were not good'
    kind: scripture
    title: 'Statutes that were not good'
    body: |
      How the Lord could give “statutes that were not good” is a hard question that the Church’s helps on this chapter do not take up; the older commentaries agree that these are not the law of Moses and differ on the sense in which He “gave” them. What follows is from the text and from those commentaries.

      Start with the wording. Verse 11 speaks of “my statutes,” by which a man shall live. Verse 25 speaks of “statutes that were not good, and judgments whereby they should not live.” The second denies what the first affirms, and it lacks the word “my.” The chapter has already named another set of statutes. The children were told, “Walk ye not in the statutes of your fathers, neither observe their judgments” (verse 18), and they did. On one reading, then, “Since they would not follow My statutes that were good,” He gave them their own and their fathers’.

      That these are not the ceremonial commandments of the law of Moses, as some earlier Christian commentators supposed, has been called “perfectly self-evident.” Those commandments “were good, and had the promise attached to them, that obedience to them would give life.” Verse 26 names the example the Lord has in view, and it is making the firstborn pass through the fire, which the law forbade: “thou shalt not let any of thy seed pass through the fire to Molech” ([[Lev. 18:21]]).

      In what sense did He give them? Two answers have been offered, and they differ in strength. One is that this is a Hebrew way of speaking, in which God is “said to do, what in the course of his providence or justice he only permits to be done”: “he abandoned them, and they abandoned themselves to the customs and ordinances of the heathen.” The other holds that the word is more than permission. It is “a judicial sentence,” and two verses are set beside it: “So I gave them up unto their own hearts’ lust” ([[Ps. 81:12]]); “God turned, and gave them up to worship the host of heaven” ([[Acts 7:42]]). On this view the person who will not give up idolatry “is so given up to its power, that it draws him deeper and deeper in.”

      Neither reading has the Lord commanding child sacrifice. Verse 39 has been cited for the second reading: “Go ye, serve ye every one his idols” is “not a command to serve idols, but a judicial declaration.”

      The purpose stated in verse 26 does not stop at desolation. It ends, “to the end that they might know that I am the LORD.”
    sources: [keil-ezekiel, jfb-ezekiel, clarke-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 26
    phrase: 'all that openeth the womb'
    kind: history
    title: 'The firstborn, claimed and redeemed'
    body: |
      The phrase is the law’s own term for the firstborn, whom the Lord had told Israel to set apart to Him and to redeem. After the Passover Israel was told to “set apart unto the LORD all that openeth the matrix” ([[Ex. 13:12]]); the Hebrew there has the same verb and the same noun for the firstborn as this verse. But the law did not leave it there. A firstborn son was bought back: “all the firstborn of my children I redeem” ([[Ex. 13:15]]).

      What the verse describes is firstborn children made to “pass through the fire.” This was the worship of Molech, “a fire god, worshipped by passing children through or burning them in fire,” practised in Israel under Solomon, in the northern kingdom, and by Ahaz and Manasseh in Judah. Verse 31 says it had not stopped: “when ye make your sons to pass through the fire,” and “even unto this day.” Chapter 16 makes the same charge (see the note on [[Ezek. 16:20]]).

      “That I might make them desolate” is the purpose given for the words “I polluted them in their own gifts.” The Hebrew verb is taken here as “devastate.” It can also mean to appal, and one modern translation has “in order that I might horrify them.”
    sources: [bd-molech, oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 29
    phrase: 'Bamah'
    kind: words
    title: 'A name that stuck'
    body: |
      *Bamah* is the Hebrew word for “high place,” left untranslated, so the Lord’s question and the name are the same word. High places were hilltop altars. Some had been altars to Jehovah, but “many of these altars were desecrated and used for heathen worship,” and reforming kings ordered them removed so that sacrifice would be offered only in Jerusalem. Josiah “defiled them and brake them down,” and afterward there were high places “throughout Judah.”

      The name was still in use “unto this day.”

      Verse 28 lists what was done on the hills in the vocabulary of true worship: sacrifices, offerings, “sweet savour,” drink offerings. Chapter 6 has the same borrowing (see the note on [[Ezek. 6:13]]).
    sources: [bd-high-places, bdb, esv, oshb-wlc, lds-scriptures]

  - ref: 33
    phrase: 'with a mighty hand, and with a stretched out arm'
    kind: scripture
    title: 'Exodus words, with fury added'
    body: |
      These are the words scripture uses for the deliverance from Egypt, and here the Lord turns them toward Israel. Moses asked whether any god had ever taken a nation out of another “by a mighty hand, and by a stretched out arm” ([[Deut. 4:34]]); the Lord had promised, “I will redeem you with a stretched out arm, and with great judgments” ([[Ex. 6:6]]). Ezekiel keeps the hand and the arm and adds a third phrase, “with fury poured out,” twice. In the history that fury was announced three times and held back three times (verses 8, 13, 21). Here it is part of how He will rule.

      The occasion is verse 32. The exiles were saying, “We will be as the heathen, as the families of the countries, to serve wood and stone.” The Lord’s answer is that it “shall not be at all.” The Hebrew verb behind “rule” is the verb for reigning as a king, and modern translations have “I will be king over you.”
    sources: [esv, oshb-wlc, lds-scriptures]

  - ref: 35
    phrase: 'the wilderness of the people'
    kind: prophets
    title: 'A second wilderness'
    body: |
      The Lord promises to repeat the journey from Egypt, wilderness included, and Elder Orson Pratt read the promise of the gathering of Israel in the latter days. “People” is plural in Hebrew, “the wilderness of the peoples,” and verse 36 draws the comparison itself: “Like as I pleaded with your fathers in the wilderness of the land of Egypt.” To plead, here, is to “enter into controversy,” a word of the law court; modern translations have “enter into judgment.” “Face to face” has been taken as pointing back to Sinai: “The LORD talked with you face to face in the mount out of the midst of the fire” ([[Deut. 5:4]]).

      The wilderness has been explained not as a region but as “a figurative expression applied to the world of nations,” among whom Israel would still be living. On that reading the passage gathers more than one judgment into a single picture, the Babylonian captivity being only “the nearest and the first.”

      Elder Pratt, preaching in 1871, set its fulfillment in the latter-day gathering and stressed what the first wilderness had and the second would have, power and revelation: “So will he plead with Israel in the latter days, and show forth his mighty hand and power, when he gathers them from the nations; and he will give revelation as he did to their fathers in the wilderness of the land of Egypt.”

      The second wilderness has been read as sifting the people as the first did, a discipline “for the same purpose.” In the first, the Lord swore not to bring that generation into the land (verse 15). Of the rebels here He says, “they shall not enter into the land of Israel” (verse 38).
    sources: [ot-manual-26, keil-ezekiel, jfb-ezekiel, bdb, esv, oshb-wlc, lds-scriptures]

  - ref: 37
    phrase: 'pass under the rod'
    kind: symbol
    title: 'Counted under the shepherd’s rod'
    body: |
      The picture is of a shepherd counting his flock as the animals file past his staff one at a time. The law uses the phrase for the tithe of the flock: “whatsoever passeth under the rod, the tenth shall be holy unto the LORD” ([[Lev. 27:32]]). Jeremiah promised that in the restored land “shall the flocks pass again under the hands of him that telleth them” ([[Jer. 33:13]]). The ancient Greek translation has, for the second half of the verse, “I will bring you in by number.”

      The custom behind the law of the tithe has been described this way: the sheep were let out of the pen one by one, and “as the tenth came out, he marked it with the rod” as “set apart for the Lord.” The application drawn from it is that “the converted Israelites will be the Lord’s, just as tithing is.”

      The next verse purges out the rebels. Later in the book the Shepherd says, “I judge between cattle and cattle” ([[Ezek. 34:17]]).

      “The bond of the covenant” is less certain. The Hebrew noun occurs only here in Ezekiel. It is taken as a “bond of the covenant,” with the caution “text dubious.” As the verse stands, it joins the counting to the covenant: those who pass under the rod are brought into it.
    sources: [ot-manual-26, lxx-rahlfs, bdb, oshb-wlc, lds-scriptures]

  - ref: 40
    phrase: 'in mine holy mountain'
    kind: scripture
    title: 'One mountain in place of every high hill'
    body: |
      The promise answers the charge of verses 28–29: the fathers worshipped on “every high hill,” and the gathered people will worship on one mountain. The mountain has been read as Zion, or Moriah, named here in contrast with the high places, “the worship on which was an abomination to God.”

      The words of worship come back as well. On the hills “they made their sweet savour” (verse 28). Here, with the same two Hebrew words, the Lord says, “I will accept you with your sweet savour,” which a modern translation gives as “As a pleasing aroma I will accept you.”

      Three times the Lord acted so that His name “should not be polluted before the heathen.” At the end He says, “I will be sanctified in you before the heathen” (verse 41). For the remembering and self-loathing of verse 43, see the note on [[Ezek. 6:8]].
    sources: [jfb-ezekiel, esv, oshb-wlc, lds-scriptures]

  - ref: 46
    phrase: 'the forest of the south field'
    kind: symbol
    title: 'A fire in the forest of the south'
    body: |
      The forest is a figure for the kingdom of Judah, and the next chapter gives the same oracle without the figure. Verse 46 says “south” three times with three different Hebrew words. The third is *negev*, the name of “the district stretching southward from the hills of Judah,” and modern translations keep it: “the forest land in the Negeb.” The image has been explained piece by piece: “The forest of the field in the south is a figure denoting the kingdom of Judah”; the trees are people, the green tree “the righteous man” and the dry “the ungodly”; and the fire is “the fire of war.”

      In verse 49 Ezekiel reports what his hearers say of him: “Doth he not speak parables?” A modern translation has “Is he not a maker of parables?” In the verses that follow, each term is replaced. Ezekiel is to set his face toward Jerusalem, the holy places, and the land of Israel ([[Ezek. 21:2]]). The fire becomes “my sword,” and the green tree and the dry become “the righteous and the wicked” ([[Ezek. 21:3]]), cut off “from the south to the north” ([[Ezek. 21:4]]).
    sources: [ot-manual-26, bd-negev, oshb-wlc, esv, lds-scriptures]

christ: |
  Paul says of the generation that came out of Egypt that “they drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]), and he goes on to the rebellion in the wilderness that verse 13 of this chapter recounts ([[1 Cor. 10:5–10]]). Ancient Israel’s rebellion was against Christ (see the note on [[Ezek. 1:26]]).

  The second half of the chapter promises that the same Lord will be king over a people who have not earned it, “not according to your wicked ways” (verse 44). Beside “ye shall know that I am the LORD” in verse 42 stand the risen Savior’s words to the Nephites, that the scattered remnants “shall be brought to the knowledge of the Lord their God, who hath redeemed them” ([[3 Ne. 20:13]]). The gathering promised here has been read as fulfilled in Israel’s “conversion to Christ.”

  The last oracle has an echo in the Gospels. Jesus’s saying, “For if they do these things in a green tree, what shall be done in the dry?” ([[Luke 23:31]]), has been compared with the green tree and the dry tree of verse 47.

explore: |
  - The same history told as a psalm and as a prayer: [[Ps. 106]] and [[Neh. 9]].
  - The two times Moses pleaded what the nations would say: [[Ex. 32:9–14]] and [[Num. 14:11–23]].
  - The elders’ earlier visit, with idols in the heart: [[Ezek. 14:1–8]].
  - The Lord’s pity for His holy name, said in full: [[Ezek. 36:20–24]].
  - The Shepherd who judges between one of His flock and another: [[Ezek. 34:17–22]].
  - The riddle of the forest explained, and the sword that follows: [[Ezek. 21:1–17]].

