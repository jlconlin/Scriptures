chapter: 7
title: 'The End Is Come'
tagline: 'In short, hammering lines the Lord tells the land of Israel that its time has run out. Buying and selling, silver and gold, prophet, priest, and king will all fail on the day when each is judged by his own ways.'
when: 'No date of its own. The chapter stands under the heading of 1:2, “the fifth year of king Jehoiachin’s captivity” (about 592 B.C.), and before the next date in the book, the sixth year (8:1).'

setting: |
  Ezekiel is in Babylon, “one of the captives carried away by Nebuchadnezzar along with Jehoiachin.” The chapter has no date. It falls between the book’s first date, the fifth year of the captivity ([[Ezek. 1:2]]), and its second, the sixth year ([[Ezek. 8:1]]). Jerusalem is still standing. Zedekiah, the last king of Judah, was put on its throne when Jehoiachin was carried away, and “he reigned eleven years in Jerusalem” ([[2 Kgs. 24:17–18]]). The large deportation of 586 B.C. is about six years off.

  Chapters 4 and 5 were signs and words about the siege. Chapter 6 was spoken to the mountains of Israel and their shrines. This chapter is the second of that pair of oracles and the last word before the temple vision of chapters 8–11. It is addressed “unto the land of Israel,” and it “completes the announcement of judgment upon Jerusalem and Judah.”

  It also sounds different from what came before. The sentences are short and repeat themselves; the same few words (end, come, day, wrath) return again and again, and the whole has been compared in form to a lamentation.

  After the city fell, the book of Lamentations said the same thing from inside it: “our end is near, our days are fulfilled; for our end is come” ([[Lam. 4:18]]).

thread: |
  The chapter says one thing in many ways: the end has come, and it is the people’s own conduct coming back to them. “I will judge thee according to thy ways” is said in verse 3, again in verses 4, 8, and 9, and once more in the last verse, where the Hebrew is sharper still: by their own judgments they will be judged.

  Verses 2–4 state the theme. The rest shows the end arriving in one part of life after another, and each thing the people leaned on gives way in turn. The market stops mattering (verses 12–13). The army is called up and no one marches (14). Flight saves only a few, and they mourn (16). Silver and gold are thrown into the street (19). The Lord turns His face, and what was holy is handed to strangers (20–22). Finally the people look for a word from heaven, and prophet, priest, and elders have nothing to give (26).

  The sentence that ran through chapter 6 returns three times, at verses 4, 9, and 27: they “shall know that I am the LORD.”

sections:
  - range: 1-4
    heading: 'An end upon the land'
    plain: |
      The word of the Lord comes to Ezekiel. The Lord God says to the land of Israel: An end. The end has come on the four corners of the land. Now the end is on you. He will send His anger, judge the land according to its ways, and lay its abominations on it. His eye will not spare and He will not pity. Their ways will come back on them and their abominations will be among them, and they will know that He is the Lord.
  - range: 5-9
    heading: 'It is near'
    plain: |
      The Lord God says: An evil, a singular evil, is coming. The end has come; it has awakened against you. It comes to you who live in the land. The time has come and the day is near, a day of trouble and not of glad shouting on the mountains. Soon He will pour out His fury and spend His anger on them. He will judge them according to their ways and repay their abominations. His eye will not spare and He will not pity, and they will know that He, the Lord, is the one striking.
  - range: 10-14
    heading: 'The buyer and the seller'
    plain: |
      The day has come. The rod has blossomed and pride has budded; violence has grown into a rod of wickedness. None of them will be left, nor their multitude, nor anything that is theirs. The time has come. The buyer should not rejoice and the seller should not mourn, because wrath is on the whole multitude. The seller will not go back to what he sold, even if he is still alive, for the vision concerns them all and will not be turned back, and no one will hold on to his life by his iniquity. They blow the trumpet and make everything ready, but no one goes out to battle, because the Lord’s wrath is on them all.
  - range: 15-22
    heading: 'Silver in the streets'
    plain: |
      The sword is outside the city, and pestilence and famine are inside. Whoever is in the field dies by the sword; whoever is in the city is consumed by famine and pestilence. Those who escape will be on the mountains like doves of the valleys, all of them moaning, each over his own iniquity. Every hand will hang limp and every knee will be weak as water. They will put on sackcloth; horror will cover them, with shame on every face and every head shaved bald.

      They will throw their silver into the streets, and their gold will be an unclean thing. Silver and gold will not be able to save them in the day of the Lord’s wrath, nor fill their stomachs, because it was what made them stumble into iniquity. The beautiful ornament was set in majesty, but they made their abominable images in it, so the Lord has made it an unclean thing to them. He will give it to strangers as plunder and to the wicked of the earth as spoil, and they will profane it. He will turn His face from His people; robbers will enter His secret place and defile it.
  - range: 23-27
    heading: 'No vision, no law, no counsel'
    plain: |
      Make a chain, for the land is full of bloody crimes and the city full of violence. The Lord will bring the worst of the nations to take their houses. He will end the pride of the strong, and their holy places will be defiled. Destruction is coming. They will look for peace and there will be none. Disaster will follow disaster and rumour follow rumour. Then they will seek a vision from the prophet, but the law will be gone from the priest and counsel from the elders. The king will mourn, the prince will be wrapped in desolation, and the hands of the common people will tremble. The Lord will deal with them according to their way and judge them by their own judgments, and they will know that He is the Lord.

notes:
  - ref: 2
    phrase: 'An end, the end is come'
    kind: words
    title: 'The end, five times over'
    body: |
      “End” is the chapter’s key word, and Ezekiel did not coin the announcement. The Hebrew is *qets*. It comes twice in this verse, once in the next, and twice in verse 6, and these verses are classed with one earlier passage as the same use of the word: the “end of life, of a people.” That passage is in Amos. He was shown “A basket of summer fruit. Then said the LORD unto me, The end is come upon my people of Israel” ([[Amos 8:2]]). The vision turned on sound: “summer fruit” is *qayits* and “end” is *qets*. Ezekiel takes up the word and repeats it until it cannot be missed.

      Ezekiel adds a play of his own. In verse 6 “it watcheth for thee” is the verb *heqits*, “awake,” so that the line runs *ba ha-qets, heqits*: “the end cometh, it hath awaked unto thee.” A modern translation has “it has awakened against you.” The end is pictured as something that has been asleep and is now awake.

      “The four corners of the land” could be rendered “of the earth,” and the same phrase means the whole world in [[Isa. 11:12]]. Here the address is “unto the land of Israel,” so the King James “land” fits: no district of it is outside the sentence.
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 7
    phrase: 'The morning is come unto thee'
    kind: words
    title: 'Morning, or doom?'
    body: |
      No one is sure what the word translated “morning” means. The Hebrew is *tsephirah*, found in Ezekiel only here and in verse 10. Its one other use in the Old Testament is in Isaiah, where it is a “diadem of beauty” ([[Isa. 28:5]]); its ordinary sense is a “chaplet, coronet, diadem,” something plaited. A crown makes no sense in this verse.

      The King James “morning” follows a derivation from Aramaic. That has been judged “unsuitable,” and most interpreters take the word as “doom, fate,” from the idea of something “coming round upon one,” though the meaning here “is dubious.” Modern translations go the same way, “Your doom has come to you,” and one adds the note, “The meaning of the Hebrew word is uncertain.”

      The two renderings land close together. In the King James the picture is of daybreak on the day that has been announced; in the others it is of a turn that has come round at last. In both, the next words carry the point: “the time is come, the day of trouble is near.”
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 7
    phrase: 'not the sounding again of the mountains'
    kind: words
    title: 'A shout on the mountains'
    body: |
      This phrase contrasts two kinds of noise, and the one that is coming is not the glad one. The Hebrew word behind “sounding again” occurs “only Ezekiel 7:7” in the whole Bible. It is understood as a joyous “shout on mountains,” the opposite of the word before it, which is the tumult of battle. Modern translations render the pair as a day “of tumult, not of reveling on the mountains,” or not “of joyful shouting on the mountains.” The verse does not say whose glad shouting it has in mind.
    sources: [bdb, esv, nrsvue]

  - ref: 9
    phrase: 'I am the LORD that smiteth'
    kind: scripture
    title: 'The LORD that smiteth'
    body: |
      Verses 8–9 repeat verses 3–4 almost word for word, and the one thing added at the end is the point of the repetition. The first time, the sentence closes as it did all through chapter 6: “ye shall know that I am the LORD” (see the note on [[Ezek. 6:7]]). The second time one Hebrew word is attached, a participle: *makkeh*, the one striking. “Then you will know that I am the Lord, who strikes.”

      The addition tells the people how to read what is about to happen to them. They are to recognize not only who He is but whose hand this is.

      Two other phrases in the refrain come from earlier in the book. “Mine eye shall not spare, neither will I have pity” was first said in chapter 5, where the reason was given: “because thou hast defiled my sanctuary with all thy detestable things” ([[Ezek. 5:11]]). And “thine abominations shall be in the midst of thee” is taken in a modern translation as “while your abominations are in your midst”: the judgment falls with the idols still standing.
    sources: [oshb-wlc, esv, lds-scriptures]

  - ref: 10
    phrase: 'the rod hath blossomed, pride hath budded'
    kind: symbol
    title: 'A rod in bloom'
    body: |
      The image is of a dry stick that has put out flowers, and the stick is the one that will beat Judah. A rod in the prophets is “an instrument of chastisement.” Isaiah had called Assyria “the rod of mine anger” ([[Isa. 10:5]]). On one reading the rod here is Babylon: “God makes use of a proud and violent people, namely the Chaldeans,” and the blossoming, usually a picture “of fresh and joyous prosperity,” shows instead “the vigorous growth of that power which is destined to inflict the punishment.” The enemy has ripened. It is ready.

      There is a second, older way to hear the verse. Jerome took the “pride” as Judah’s own, that of a people who despised God’s threats. “Violence” in verse 11 is the same Hebrew word used in verse 23 of Jerusalem itself, “the city is full of violence.” The wording is compressed enough that both readings have been held.
    sources: [keil-ezekiel, jfb-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 13
    phrase: 'the seller shall not return to that which is sold'
    kind: history
    title: 'No jubilee to come'
    body: |
      This line refers to the law of the jubilee, and it says that law will not operate again. In Israel land could not be sold outright. “The land shall not be sold for ever: for the land is mine” ([[Lev. 25:23]]). A man who had “waxen poor” might sell part of his possession ([[Lev. 25:25]]), at a price reckoned by the years of crops left before the fiftieth year ([[Lev. 25:15–16]]), and then “land that had changed hands… reverted to the family to which it had belonged at the original settlement.” The law’s own words are, “In the year of this jubilee ye shall return every man unto his possession” ([[Lev. 25:13]]). Ezekiel’s wording follows it: the seller “shall not return.” The words “are to be explained from the legal regulations concerning the year of Jubilee,” and the return will not happen even for a seller who lives to see the year, “because Israel will be banished from the land.” The Old Testament has “no record… of the observance of any year of jubilee,” but “the prophets allude to it,” and this is one of the places.

      So verse 12 tells the buyer not to rejoice and the seller not to mourn. Jerome’s comment was that it is natural to be glad at a purchase and sorry at a sale, “But when slavery and captivity stare you in the face, rejoicing and mourning are equally absurd.” The buyer will not keep the field and the seller would have lost it anyway.
    sources: [keil-ezekiel, bd-jubilee-year-of, lds-scriptures]

  - ref: 16
    phrase: 'like doves of the valleys'
    kind: symbol
    title: 'Doves driven to the mountains'
    body: |
      The survivors are compared to birds that are out of their place. Doves of the valleys are the tame ones, and the picture has been explained as valley doves which, “when alarmed by the bird-catcher or the hawk, are obliged to forsake their natural abode, and fly elsewhere to save their lives.” The mountain doves and the valley doves are contrasted “as wild with tame.”

      The second half of the comparison is the sound. “The cooing of doves was regarded by the ancients as a moan,” and Isaiah uses it that way: “We roar all like bears, and mourn sore like doves” ([[Isa. 59:11]]).

      What they moan over is the detail that matters. It is not the city or their losses but, “every one for his iniquity.” This is the remnant promised in the previous chapter, “Yet will I leave a remnant” ([[Ezek. 6:8]]), who would remember the Lord among the nations and loathe what they had done. In a chapter that seems to leave no one alive (“none of them shall remain,” verse 11), this verse is the one sign that some do, and that their grief has turned to its real cause.
    sources: [keil-ezekiel, lds-scriptures]

  - ref: 19
    phrase: 'their gold shall be removed'
    kind: words
    title: 'Gold as an unclean thing'
    body: |
      “Removed” hides a much stronger word. The Hebrew says their gold will become *niddah*, “impurity,” something “abhorrent, shunned.” It is a term from the laws of ritual uncleanness, used here “with allusion to” that usage for an “impure thing.” Modern translations have “their gold is like an unclean thing.” People do not merely drop their money because it is heavy. They fling it away as something they do not want to touch.

      The verse gives two reasons. The first is practical: in a starving city gold “shall not satisfy their souls, neither fill their bowels.” There is nothing to buy. The second is moral: “it is the stumblingblock of their iniquity.” That phrase is Ezekiel’s own; he uses it later of elders who “have set up their idols in their heart, and put the stumblingblock of their iniquity before their face” ([[Ezek. 14:3]]). Wealth was the thing they tripped over.

      The same word closes verse 20, where the King James “therefore have I set it far from them” is, more literally, “I make it an unclean thing to them.” What the people do with their gold in verse 19, the Lord does with the “ornament” in verse 20 (see the note on [[Ezek. 7:20]] for what that is).

      The middle sentence of the verse is nearly identical to one in Zephaniah: “Neither their silver nor their gold shall be able to deliver them” ([[Zeph. 1:18]]), and there too it is on the day of the Lord’s wrath.
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 20
    phrase: 'the beauty of his ornament'
    kind: history
    title: 'The ornament and the secret place'
    body: |
      The ornament of verse 20 is the temple, “the most beautiful ornament of Jerusalem”: conquerors will despoil and desecrate it because the people had already desecrated it with their idols. That suits the words “he set it in majesty” and the charge already made in chapter 5, “thou hast defiled my sanctuary with all thy detestable things” ([[Ezek. 5:11]]). The “secret place” of verse 22 is then the same house. The Church’s footnote on “place” sends the reader to two verses about it, [[Jer. 7:14]] and the one where the Lord says, “I will profane my sanctuary, the excellency of your strength” ([[Ezek. 24:21]]). The Hebrew word comes from a verb meaning “hide, treasure up,” and is rendered a “treasured, cherished place,” or “my treasured place.”

      The Hebrew of verse 20 leaves room for another rendering, which some modern translations follow. The word behind “therein” is a small one that can mean “in it” or “of it,” so the line can say they made their images “of it,” and the ornament is then the silver and gold of verse 19: “They took pride in their beautiful jewelry,” as one translation has it. That is a translator’s choice in a difficult line, and it leaves the charge where it was.

      On either rendering something precious that the Lord gave was used for idols, and the result is the same sentence: “My face will I turn also from them.” The vision that follows shows both halves: an idol standing “at the gate of the altar” ([[Ezek. 8:5]]), and near its close, “the glory of the LORD went up from the midst of the city” ([[Ezek. 11:23]]).
    sources: [ot-manual-26, bdb, oshb-wlc, esv, niv, nrsvue, lds-scriptures]

  - ref: 23
    phrase: 'Make a chain'
    kind: symbol
    title: 'A chain for captives'
    body: |
      The command breaks into the oracle without warning, and the Hebrew verb is singular: it is addressed to one person. A chain is for prisoners. One explanation is that it stands for the captivity: those who live through sword and famine will be led away bound. The word is glossed as a chain “for captives,” with the caution, “but very dubious”; a modern translation notes that the word “Probably refers to an instrument of captivity.” The ancient Greek translators did not find a chain here at all and wrote, “And they shall work uncleanness.” So the meaning of the Hebrew is not certain, though the captivity reading fits what follows, where foreigners take possession of the houses.

      The text does not say whether Ezekiel actually made a chain, as he was told to act out the siege in chapter 4 ([[Ezek. 4:1–3]]). The reason for it is stated: “for the land is full of bloody crimes, and the city is full of violence.”
    sources: [bdb, oshb-wlc, esv, lxx-rahlfs, lds-scriptures]

  - ref: 26
    phrase: 'then shall they seek a vision of the prophet'
    kind: scripture
    title: 'No vision, no law, no counsel'
    body: |
      The last thing to fail in the chapter is the word of the Lord, and the wording answers a saying recorded in Jeremiah. In Jerusalem, the men plotting against Jeremiah had reassured each other that they could do without him: “for the law shall not perish from the priest, nor counsel from the wise, nor the word from the prophet” ([[Jer. 18:18]]). Ezekiel has law with the priest and counsel with the elders again, and the same Hebrew verb, without the “not.” The verse has been read as God setting aside that “idle boast.”

      Each of the three had his own way of knowing what God wanted. The prophet received vision. The priest gave “law,” which here means instruction (“instruction shall perish from the priest” in one modern translation), the teaching described in Malachi: “the priest’s lips should keep knowledge, and they should seek the law at his mouth” ([[Mal. 2:7]]). The “ancients” are the elders, and what is looked for from them is counsel. Verse 27 then runs down the ranks of the state, king, prince, and common people, and finds the same helplessness.

      The verse has been read as fulfilled in two places. Lamentations says after the fall, “the law is no more; her prophets also find no vision from the LORD” ([[Lam. 2:9]]). And in Ezekiel’s own book elders come to inquire of the Lord and sit before the prophet ([[Ezek. 20:1]]), and the answer he is given for them is, “I will not be inquired of by you” ([[Ezek. 20:3]]).

      The timing is the bitter part: “then shall they seek.” They ask only when disaster is piling on disaster. Amos, in the chapter that announced “the end,” spoke of a famine “of hearing the words of the LORD” ([[Amos 8:11]]).
    sources: [lds-scriptures, jfb-ezekiel, oshb-wlc, esv, nrsvue]

  - ref: 27
    phrase: 'according to their deserts will I judge them'
    kind: words
    title: 'Judged by their own judgments'
    body: |
      The closing line says more in Hebrew than “deserts” conveys: the people will be judged by the standard they themselves used. The word is the plural of *mishpat*, “judgment,” with “their” attached. Modern translations give it straight: “according to their judgments I will judge them,” or “according to their own judgments.”

      This is where the chapter has been heading since verse 3. The people’s “ways” are named four times in the first nine verses, and the last verse names them a fifth time and then tightens the point. The Lord brings no foreign measure to this people. A land “full of bloody crimes” (verse 23) is handed the kind of judgment it gave.
    sources: [oshb-wlc, esv, nrsvue, lds-scriptures]

christ: |
  The chapter does not speak of the Messiah. Its witness of Him is in who speaks and in what kind of judge He is. The LORD who says “I am the LORD” three times here is Jehovah, whom the Church’s study helps identify as the premortal Jesus Christ.

  The rule He judges by in this chapter is one that modern revelation sets at His coming. Ezekiel hears, “I will judge thee according to thy ways,” and at the last, by their own judgments. The Church’s footnote on “recompense” in verse 4 points to “the day when the Lord shall come to recompense unto every man according to his work, and measure to every man according to the measure which he has measured to his fellow man” ([[D&C 1:10]]).

  “The day of the wrath of the LORD” (verse 19) looks the same way. Zephaniah has the same sentence about silver and gold in his own oracle of Judah’s fall ([[Zeph. 1:18]]), and the Church’s heading to that chapter calls the destruction of Judah “symbolic of the Second Coming.”

explore: |
  - Amos’s vision of the summer fruit, the first “the end is come,” and the famine of hearing the word: [[Amos 8:1–12]].
  - The day of the Lord’s wrath, with the line Ezekiel shares: [[Zeph. 1:14–18]].
  - The law of the jubilee behind verses 12–13: [[Lev. 25:8–28]].
  - The companion oracle to the mountains, with its remnant: [[Ezek. 6]].
  - What comes next: in the sixth year Ezekiel is shown in vision the abominations this chapter keeps naming, and the Lord’s glory leaving the temple: [[Ezek. 8–11]].
  - The end as it looked from inside the city: [[Lam. 2:9]] and [[Lam. 4:18]].

