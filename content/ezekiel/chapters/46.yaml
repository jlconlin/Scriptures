chapter: 46
title: 'The Prince at the Gate'
tagline: 'The Lord sets the times when the inner east gate opens, what the prince brings on the Sabbath, the new moon, and every morning, how the crowds move at the feasts, and what the prince may do with his land. Then the guide shows Ezekiel the temple kitchens.'
when: 'No date of its own. The chapter stands under the heading of 40:1, “the five and twentieth year of our captivity… the fourteenth year after that the city was smitten,” as all of chapters 40–48 do.'

setting: |
  Ezekiel is still in the vision that began in chapter 40, standing in a temple that has not been built (the setting of [[Ezek. 40]] says what the Church’s sources teach about it). The measuring is finished. The glory of the Lord has come back into the house, and since then Ezekiel has been standing in front of it receiving its laws; that body of instruction runs from 44:5 to 46:18.

  Chapter 45 set apart land for the sanctuary, the priests, the city, and the prince, and then gave the prince a duty: it is his “part to give burnt offerings, and meat offerings, and drink offerings, in the feasts, and in the new moons, and in the sabbaths” ([[Ezek. 45:17]]). Chapter 45 went on to the yearly feasts. This chapter finishes the list with the Sabbath, the new moon, and the daily offering, and with rules for how the prince and the people come and go.

  At verse 19 the laws end and the tour resumes. The guide of [[Ezek. 40:3]] takes Ezekiel to two sets of kitchens, which the earlier description of the buildings had passed over. From there he is led back to the door of the house, where the waters of chapter 47 begin.

  How animal sacrifice can belong to a temple still to come is taken up at [[Ezek. 43:18–27]] and is not repeated here.

thread: |
  The chapter answers a set of practical questions about one building: who may come, how near, on what days, through which gate, and bringing what.

  The prince is the figure who ties the parts together. The inner east gate is opened for him, but he stops at its threshold and the priests make his offering (verses 1–2). He supplies the Sabbath and new moon sacrifices, in the numbers set for him (4–7). At the feasts he goes in and out among the people (10). He holds land, but he may not give it away for good outside his family, and he may not take anyone else’s (16–18).

  The kitchens at the end are of two kinds. The priests boil the trespass and sin offerings beside their own chambers, so that these are not carried into the outer court; the sacrifice of the people is boiled in the corners of the outer court.

sections:
  - range: 1-8
    heading: 'The east gate on the Sabbath and the new moon'
    plain: |
      The Lord God says that the east gate of the inner court is to be shut on the six working days and opened on the Sabbath and on the day of the new moon. The prince is to come in from outside by the porch of that gate and stand by its post while the priests prepare his burnt offering and his peace offerings. He is to worship at the threshold and then go out, and the gate is to stay open until evening. The people of the land are to worship at the door of the same gate on Sabbaths and new moons.

      On the Sabbath the prince’s burnt offering is six lambs and a ram, all without blemish, with a meat offering of an ephah for the ram, whatever he is able to give for the lambs, and a hin of oil to each ephah. On the new moon it is a young bullock, six lambs, and a ram, without blemish, with an ephah for the bullock, an ephah for the ram, what he can afford for the lambs, and a hin of oil to each ephah. The prince goes in by the porch of the gate and goes out the same way.
  - range: 9-12
    heading: 'Coming and going at the feasts'
    plain: |
      When the people of the land come before the Lord at the solemn feasts, whoever comes in by the north gate is to go out by the south gate, and whoever comes in by the south gate is to go out by the north. No one is to go back through the gate he came in by; each goes out by the one opposite. The prince goes in among them when they go in and goes out when they go out. At the feasts and solemnities the meat offering is an ephah for a bullock, an ephah for a ram, what he is able to give for the lambs, and a hin of oil to an ephah. When the prince makes a voluntary burnt offering or peace offerings, the east gate is opened for him and he makes his offering as on the Sabbath. Then he goes out, and the gate is shut after him.
  - range: 13-15
    heading: 'The lamb every morning'
    plain: |
      Every day a lamb of the first year without blemish is to be prepared as a burnt offering to the Lord, every morning. With it every morning goes a meat offering: a sixth of an ephah, and a third of a hin of oil to temper the fine flour. This is a perpetual ordinance. The lamb, the meat offering, and the oil are to be prepared every morning as a continual burnt offering.
  - range: 16-18
    heading: 'The prince’s inheritance'
    plain: |
      The Lord God says that if the prince gives a gift to any of his sons, it belongs to his sons as their inheritance. If he gives a gift from his inheritance to one of his servants, it is the servant’s until the year of liberty, and then it returns to the prince; his inheritance is for his sons. The prince is not to take any of the people’s inheritance by oppression and thrust them out of their possession. He is to give his sons their inheritance out of his own possession, so that the Lord’s people are not scattered, each from his possession.
  - range: 19-24
    heading: 'The kitchens'
    plain: |
      The guide brings Ezekiel through the entry at the side of the gate to the priests’ holy chambers that look north, and there is a place at their western end. He says it is where the priests are to boil the trespass offering and the sin offering and bake the meat offering, so that they do not carry them out into the outer court and sanctify the people. Then he brings Ezekiel into the outer court and past its four corners. In each corner there is a court, forty cubits long and thirty broad, all four the same size. A row of building runs around the inside of each, with boiling places made under the rows. The guide says these are the places where the ministers of the house are to boil the sacrifice of the people.

notes:
  - ref: 1
    phrase: 'shall be shut the six working days'
    kind: history
    title: 'A gate that opens on holy days'
    body: |
      The east gate of the inner court opens on holy days; the outer east gate never does. The outer gate is closed for good, for a reason the Lord states: “because the LORD, the God of Israel, hath entered in by it, therefore it shall be shut” ([[Ezek. 44:2]]). It was the way the glory came back: “the glory of the LORD came into the house by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]).

      The gate of this verse is the east gate of the inner court, and it follows the calendar. On the six working days it is shut. On the Sabbath and the new moon it is opened and stays open “until the evening” (verse 2); the prince worships at its threshold and the people at its door. When the prince brings a freewill offering on an ordinary day it is opened for him and shut again as soon as he leaves (verse 12).

      The new moon was the beginning of each month in Israel’s calendar. The law “appointed that at the new moon special sacrifices should be offered,” and the prophets often name new moons and Sabbaths together, as Ezekiel does here. Numbers calls these days “the beginnings of your months” ([[Num. 28:11]]).

      The text gives no reason for this gate’s rule as it gave one for the outer gate.
    sources: [lds-scriptures, bd-new-moon]

  - ref: 2
    phrase: 'he shall worship at the threshold of the gate'
    kind: history
    title: 'How near the prince may come, and who he is'
    body: |
      The prince comes nearer than the people do, but he does not enter the inner court and he does not make his own sacrifice. He walks in from outside to the porch of the gate, stands by its post, and bows down at the threshold while “the priests shall prepare his burnt offering and his peace offerings.” The people worship “at the door of this gate” (verse 3), farther back. He has been read here as the people’s representative who “is to go no further,” “the court within belonging exclusively to the priests.” At the outer east gate, which stays shut, he was given a place as well: “he shall sit in it to eat bread before the LORD” ([[Ezek. 44:3]]).

      The text never names him; the question is taken up in the note on [[Ezek. 44:3]]. This chapter says one more thing that bears on it: he has sons who inherit from him (verse 16). The mention of his sons has been read as “another argument against Messiah being meant.” That is one reading; no Church source read for this chapter says who the prince is.
    sources: [lds-scriptures, jfb-ezekiel]

  - ref: 4
    phrase: 'six lambs without blemish, and a ram without blemish'
    kind: scripture
    title: 'Not the offerings of the law of Moses'
    body: |
      The offerings listed here are not the ones Moses prescribed for the same days: some are larger and some smaller. A reader who sets the chapter beside Numbers 28 finds this:

      - **Sabbath.** The law: “on the sabbath day two lambs of the first year without spot” ([[Num. 28:9]]). Here: six lambs and a ram.
      - **New moon.** The law: “two young bullocks, and one ram, seven lambs,” with a kid of the goats as a sin offering ([[Num. 28:11]]; [[Num. 28:15]]). Here: one bullock, six lambs, and a ram, and no sin offering is mentioned.
      - **Every day.** The law: “The one lamb shalt thou offer in the morning, and the other lamb shalt thou offer at even” ([[Num. 28:4]]), with a tenth of an ephah of flour and a fourth of a hin of oil ([[Num. 28:5]]). Here: a lamb “every morning,” said three times in verses 13–15, with a sixth of an ephah and a third of a hin, and no evening lamb.

      So the Sabbath offering grows, the new moon offering shrinks, and the daily offering loses its evening lamb while the flour and oil that go with the morning lamb are increased. The silence about the evening has been judged deliberate: it “is not a mere oversight,” but “in the new order of worship the evening sacrifice is to be omitted.”

      The chapter does not say why. The larger Sabbath offering has been explained this way: worship is now to be carried on “in a more munificent spirit of self-sacrificing liberality than formerly.” That explanation speaks only of the Sabbath; no source read explains why the other offerings are smaller.
    sources: [lds-scriptures, keil-ezekiel, jfb-ezekiel]

  - ref: 5
    phrase: 'an ephah for a ram'
    kind: words
    title: 'A meat offering of flour and oil'
    body: |
      The “meat offering” has no meat in it; it is flour and oil, measured by the ephah and the hin. The English word is used in its older sense of food in general. The Hebrew is *minchah*, an offering that “consisted chiefly of grain,” and under the law “no burnt or peace offering was complete without it.” A modern translation says “grain offering.”

      The ephah is a dry measure, “one-tenth of a homer,” and a homer is “believed to be 230 liters,” which would make an ephah about 23 liters. The hin is “a liquid measure,” reckoned at about six liters by one estimate and about three and a half by another. These are approximations, since biblical measures “varied from time to time.” An ephah of flour and a hin of oil go with each bullock and each ram.

      For the lambs no amount is fixed. The prince gives “as he shall be able to give,” or in the wording of verse 7, “according as his hand shall attain unto”; a modern translation has “as much as he wishes to give.” The daily offering is small beside these: a sixth of an ephah, with a third of a hin of oil “to temper with the fine flour,” that is, “to moisten” it.
    sources: [bd-meat-offering, bd-weights-and-measures, bdb, nrsvue, esv]

  - ref: 9
    phrase: 'he shall not return by the way of the gate whereby he came in'
    kind: history
    title: 'In by one gate and out by the other'
    body: |
      Each worshipper at a feast leaves by the gate opposite the one he came in by, north to south or south to north. The “solemn feasts” are the “appointed festivals,” the days when the law required attendance: “Three times in a year shall all thy males appear before the LORD thy God in the place which he shall choose” ([[Deut. 16:16]]). A practical reason has been given for the rule: “that, in such a throng as should attend the festivals, the ingress and egress should be the more unimpeded, those going out not being in the way of those coming in.” The text states the rule and gives no reason.

      Verse 10 then says where the prince is on those days. On Sabbaths and new moons he has his own approach to the east gate. At the feasts he is “in the midst of them”: he goes in when the people go in and out when they go out. He is “not isolated as at other times, but joining the great throng of worshippers.”
    sources: [lds-scriptures, nrsvue, jfb-ezekiel]

  - ref: 17
    phrase: 'to the year of liberty'
    kind: history
    title: 'The year of liberty and the prince’s land'
    body: |
      The year of liberty is the jubilee, and its rule is applied here to the prince’s own estate. The Hebrew word for “liberty” is *deror*, the word of the jubilee law: “ye shall hallow the fiftieth year, and proclaim liberty throughout all the land” ([[Lev. 25:10]]). In that year “land that had changed hands… reverted to the family to which it had belonged at the original settlement” (the law is explained more fully at [[Ezek. 7:13]]). So a gift of land from the prince to a servant lasts only until the jubilee and then comes back. A gift to his sons is permanent.

      Verse 18 gives the other half of the law. The prince may not add to his holdings by taking the people’s. He was assigned a tract of his own in the division of the land, and the promise attached to it was “my princes shall no more oppress my people” ([[Ezek. 45:8]]).

      Earlier rulers had seized land. When the people first asked for a king, Samuel warned them what he would do: “he will take your fields, and your vineyards, and your oliveyards, even the best of them, and give them to his servants” ([[1 Sam. 8:14]]). The purpose of the law here is stated in the verse: “that my people be not scattered every man from his possession.”
    sources: [lds-scriptures, bdb, oshb-wlc, bd-jubilee-year-of, keil-ezekiel]

  - ref: 20
    phrase: 'to sanctify the people'
    kind: history
    title: 'Two kinds of kitchen'
    body: |
      The priests’ kitchen is placed beside their chambers so that the most holy offerings are not carried into the outer court. The reason the guide gives is the one given for the priests’ change of clothes, “they shall not sanctify the people with their garments” ([[Ezek. 44:19]]): in this law holiness passes by contact (see the note on [[Ezek. 42:14]]). A modern translation renders the phrase here “and so communicate holiness to the people.” The trespass offering, the sin offering, and the meat offering are the “most holy things” that the priests eat in those chambers ([[Ezek. 42:13]], with its note).

      The four corner kitchens of verses 21–24 are in the outer court, where the people are, and “the ministers of the house” boil there “the sacrifice of the people.” These have been explained as kitchens for the meals that went with the peace offerings and were held by those who brought them. The peace offering was the one sacrifice that ended in a meal for the worshipper: after the fat was burned and the priests’ pieces removed, the rest was eaten by the one who offered it, with his household and the poorer Levites, a feast that “symbolized fellowship and friendship among all its partakers.”
    sources: [lds-scriptures, nrsvue, bd-sacrifices, keil-ezekiel]

  - ref: 22
    phrase: 'courts joined'
    kind: words
    title: 'An uncertain word for the corner courts'
    body: |
      What the King James Version renders “joined” is a Hebrew word whose meaning is not known for certain. As it stands, *qeturot* is taken as “enclosed courts,” courts walled off within the larger court. The text may instead be read, with the ancient Greek translation, as a similar word meaning “small.” Modern translations follow the ancient Greek, Syriac, and Latin versions, “small courts,” and note that “the meaning of the Hebrew word is uncertain.” On either reading the picture is the same: a separate yard, forty cubits by thirty, set into each corner of the outer court.
    sources: [bdb, oshb-wlc, nrsvue, esv]

christ: |
  The prince bows and the people worship at the east gate “before the LORD” (verse 3), on the side of the house by which the glory of the Lord came in ([[Ezek. 43:4]]). Who that LORD is was said at [[Ezek. 1:26]].

  The offering made most often in the chapter is a lamb “without blemish,” every morning, “a continual burnt offering.” Sacrifice was explained to Adam as “a similitude of the sacrifice of the Only Begotten of the Father” ([[Moses 5:7]]). Peter uses the words of the altar for Him: “the precious blood of Christ, as of a lamb without blemish and without spot” ([[1 Pet. 1:19]]).

explore: |
  - The law’s own list of daily, Sabbath, and new moon offerings, to set beside verses 4–15: [[Num. 28:1–15]].
  - The jubilee law behind “the year of liberty”: [[Lev. 25:8–17]].
  - Samuel’s warning about what a king would take: [[1 Sam. 8:10–18]].
  - The outer east gate shut, and the prince’s place in it: [[Ezek. 44:1–3]].
  - The prince’s land and his duty to supply the offerings: [[Ezek. 45:7–17]].
  - A king who would not burden his people: [[Mosiah 2:12–14]].
  - What comes next: from the door of the house Ezekiel sees water running east: [[Ezek. 47:1–12]].

