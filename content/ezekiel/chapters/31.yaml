chapter: 31
title: 'The Cedar That Fell'
tagline: 'Pharaoh is asked whom he resembles in his greatness, and the answer is a story about someone else: Assyria, a cedar taller than any tree in Eden, cut down for its pride and sent to the grave. The last verse hands the story to Pharaoh.'
when: 'Dated “in the eleventh year, in the third month, in the first day of the month” of Jehoiachin’s captivity (about 586 B.C.), not quite two months after the oracle of 30:20 and while Jerusalem was under siege ([[Ezek. 24:1–2]]).'

setting: |
  Chapters 25–32 are the book’s prophecies against Israel’s enemies. Egypt comes last and has four chapters (29–32), and this chapter is a single oracle with its own date.

  The date falls two months, less six days, after the word about Pharaoh’s broken arm ([[Ezek. 30:20–21]]) and about a month before Jerusalem was taken. Jeremiah puts the breach of the wall in “the fourth month, the ninth day of the month” of Zedekiah’s eleventh year ([[Jer. 39:2]]), and by Ezekiel’s own count the eleventh year of the captivity is the year the city was smitten ([[Ezek. 40:1]]). The Pharaoh addressed is Hophra, the king who had sent an army to help Zedekiah (see the note on [[Ezek. 29:2]]).

  The oracle is one of Ezekiel’s extended figures, and like most of them it carries its own key, here in the last verse. It is unusual in that it hardly speaks of Egypt. It tells the story of Assyria, an empire whose fall was still fresh in memory, and it leaves Pharaoh to find himself in it.

  Ezekiel had already used a cedar of Lebanon in the riddle of chapter 17 ([[Ezek. 17:3]]; [[Ezek. 17:22–24]]). The picture of the grave that closes this chapter is carried on in the next, where Pharaoh is sent down to the pit and is told that “Asshur is there and all her company” ([[Ezek. 32:22]]).

thread: |
  The chapter is a question, a story, and the question again. Verse 2 asks Pharaoh, “Whom art thou like in thy greatness?” Verses 3–17 tell of the Assyrian. Verse 18 repeats the question and answers it in one sentence: “This is Pharaoh and all his multitude.”

  The story has three parts, and the Lord speaks in the first person in each. The cedar is made great (verses 3–9): it is tall because of the waters at its root, and the part ends, “I have made him fair.” The cedar is cut down (verses 10–14): its height has gone to its heart, and “I have therefore delivered him” to a foreign power. The cedar goes down to the grave (verses 15–17), and “I caused a mourning.”

  One word carries the argument. The tree’s height is its glory in verses 3 and 5, the charge against it in verse 10, and the warning to every other tree in verse 14. The direction of the whole is downward. The cedar begins with its top above every tree of the field. Its branches end in the valleys, and the tree itself in “the nether parts of the earth.” In Hebrew one verb, “to go down,” is used six times in verses 14–18, the last time of Pharaoh: “yet shalt thou be brought down.”

sections:
  - range: 1-2
    heading: 'A question for Pharaoh'
    plain: |
      In the eleventh year, on the first day of the third month, the word of the Lord comes to Ezekiel. He is to say to Pharaoh king of Egypt and to his multitude: Whom are you like in your greatness?
  - range: 3-9
    heading: 'The cedar in Lebanon'
    plain: |
      The Assyrian was a cedar in Lebanon, with fair branches and a shadowing shroud, very tall, its top among the thick boughs. The waters made it great. The deep set it up on high, with her rivers running around where it was planted and her little rivers going out to all the trees of the field. So it grew higher than every tree of the field, and its boughs multiplied and its branches grew long because of the abundant water. All the birds of heaven nested in its boughs, all the beasts of the field bore their young under its branches, and all great nations lived in its shadow. It was beautiful in its greatness and in the length of its branches, because its root was by great waters. The cedars in the garden of God could not hide it. The fir trees and the chestnut trees were not like it, and no tree in the garden of God was like it in beauty. The Lord made it fair with its many branches, so that all the trees of Eden in the garden of God envied it.
  - range: 10-14
    heading: 'Cut down for its pride'
    plain: |
      Therefore the Lord God says: Because you have lifted yourself up in height, and it has shot its top among the thick boughs, and its heart is lifted up in its height, He has delivered it into the hand of the mighty one of the heathen, who will surely deal with it. He has driven it out for its wickedness. Strangers, the terrible of the nations, have cut it off and left it. Its branches have fallen on the mountains and in all the valleys, its boughs lie broken by all the rivers of the land, and all the peoples of the earth have gone down from its shadow and left it. All the birds of heaven will stay on its ruin, and the beasts of the field will be on its branches. This is so that none of the trees by the waters will exalt themselves for their height or shoot their tops among the thick boughs, and none that drink water will stand up in their height. They are all delivered to death, to the nether parts of the earth, among the children of men, with those who go down to the pit.
  - range: 15-17
    heading: 'Down to the grave'
    plain: |
      The Lord God says: On the day it went down to the grave He caused a mourning. He covered the deep for it and held back its floods, and the great waters were stayed. He made Lebanon mourn for it, and all the trees of the field fainted for it. He made the nations shake at the sound of its fall, when He cast it down to hell with those who descend into the pit. All the trees of Eden, the choice and best of Lebanon, all that drink water, will be comforted in the nether parts of the earth. They too went down into hell with it, to those slain with the sword, and so did those who were its arm, who lived under its shadow among the heathen.
  - range: 18
    heading: 'This is Pharaoh'
    plain: |
      To whom, then, is Pharaoh like in glory and greatness among the trees of Eden? He will be brought down with the trees of Eden to the nether parts of the earth, and will lie among the uncircumcised with those slain by the sword. This is Pharaoh and all his multitude, says the Lord God.

notes:
  - ref: 3
    phrase: 'the Assyrian was a cedar in Lebanon'
    kind: history
    title: 'Why a word to Pharaoh describes Assyria'
    body: |
      The cedar is Assyria, and Pharaoh is meant to see himself in it. The Hebrew word is *ashshur*, the ordinary name of Assyria, and a modern translation keeps it: “Consider Assyria, a cedar of Lebanon.” The heading in the Church’s edition likewise takes the chapter as a comparison of Pharaoh’s glory and fall with Assyria’s.

      Because the rest of the chapter concerns Egypt, the word has also been taken as a kind of tree, “the tall cedar, the very stately cedar,” so that “all the following description belongs to Egypt, not to Assyria.” Two things in the text stand against that. Pharaoh is never said to be the cedar: he is asked whom he resembles in verse 2 and asked again in verse 18. And the tree’s fall is told as something that has happened (“have cut him off,” “his branches are fallen,” verse 12), while Pharaoh’s is still to come (“yet shalt thou be brought down,” verse 18). On that ground it has been argued that the cedar “can only be Asshur, and not Egypt at all.”

      Assyria suited the purpose because its fall was recent: “The fall of that great empire was still so fresh in the mind at the time, that the reminiscence could not fail to make a deep impression upon the prophet’s hearers.” Isaiah had spoken of the Assyrian in similar terms. He called him the rod of the Lord’s anger ([[Isa. 10:5]]) and went on, “the high ones of stature shall be hewn down,” and “Lebanon shall fall by a mighty one” ([[Isa. 10:33–34]]).
    sources: [oshb-wlc, nrsvue, clarke-ezekiel, keil-ezekiel, esv, lds-scriptures]

  - ref: 3
    phrase: 'with a shadowing shroud'
    kind: words
    title: 'Shade, and a top in the clouds'
    body: |
      Two phrases in this verse are clearer in other translations: the “shroud” is shade, and the “thick boughs” are probably clouds.

      “Shroud” in older English could mean “a shelter; a cover.” The Hebrew behind it is *choresh*, a “wood, wooded height,” joined to a word for giving shade, and a modern translation has “forest shade.” The ancient Greek translation passes over the phrase and says only that the tree “was fair in shoots, and high in stature.”

      “Among the thick boughs” translates *abotim*, a word that elsewhere means a “cord, rope.” The sense “interwoven foliage (?)” has been allowed for it, with the judgment that in verses 3, 10, and 14 of this chapter it is “certainly clouds.” That is how the Greek took it (“his top reached to the midst of the clouds”), and modern translations have “its top among the clouds,” with the King James reading in the margin.

      The word comes back in verse 10, where the top among the “thick boughs” is part of the charge against the tree. Isaiah’s king of Babylon speaks of the same height: “I will ascend above the heights of the clouds; I will be like the most High” ([[Isa. 14:14]]).
    sources: [webster-1828, bdb, oshb-wlc, esv, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 4
    phrase: 'the deep set him up on high'
    kind: symbol
    title: 'Great because of the waters'
    body: |
      The cedar is tall because of where it was planted, and the description says so three times. “The waters made him great” (verse 4); his branches grew long “because of the multitude of waters” (verse 5); he was fair “for his root was by great waters” (verse 7).

      “The deep” is *tehom*, the Hebrew word for the deep sea and for the waters under the earth, and a modern translation keeps the King James word: “the deep made it grow tall.” The deep sends “her rivers” around the cedar and only “her little rivers” to the other trees of the field, and verse 5 begins, “Therefore his height was exalted above all the trees of the field.”

      The text does not say what the waters stand for. The description ends with the Lord speaking: “I have made him fair by the multitude of his branches” (verse 9), and when the tree falls it is the Lord who shuts the same deep off: “I restrained the floods thereof, and the great waters were stayed” (verse 15). The other great trees are named in verses 14 and 16 by what they take in: “all that drink water.”
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 6
    phrase: 'All the fowls of heaven made their nests in his boughs'
    kind: scripture
    title: 'The tree that shelters the nations'
    body: |
      A great tree with birds in its branches and beasts beneath it is a picture of an empire, and the verse says so in its last clause: “under his shadow dwelt all great nations.”

      Scripture uses the picture several times. Nebuchadnezzar dreams of a tree in which “the fowls of the heaven dwelt in the boughs thereof” ([[Dan. 4:12]]), and Daniel tells him, “It is thou, O king” ([[Dan. 4:22]]). That tree too is ordered cut down ([[Dan. 4:14]]). Ezekiel has used it once already, of a cedar the Lord Himself plants ([[Ezek. 17:23]]; see the note on [[Ezek. 17:22]]).

      Verse 13 turns the picture over. After the fall the birds and beasts are still there, but on “his ruin,” or in a modern translation, “On its fallen trunk dwell all the birds of the heavens.” The next chapter says the same of Pharaoh without the figure of the tree: “I will cast thee forth upon the open field, and will cause all the fowls of the heaven to remain upon thee” ([[Ezek. 32:4]]).
    sources: [esv, nrsvue, lds-scriptures]

  - ref: 8
    phrase: 'The cedars in the garden of God could not hide him'
    kind: symbol
    title: 'The envy of Eden'
    body: |
      Assyria is measured against the trees of Eden, and none of them equals it. “Could not hide him” uses a verb meaning to darken or dim, and the sense is probably that the “cedars did not eclipse him”; a modern translation has “could not rival it.” The King James “fir” and “chestnut” trees are firs and “plane trees” there.

      “The garden of God” is “the garden of Paradise,” as in the lament over the king of Tyre ([[Ezek. 28:13]]; see the note there). What the comparison says has been put this way: “all the other nations and kingdoms in God’s creation were far inferior to Asshur in greatness and glory.” The image has also been called “peculiarly appropriate” to Assyria, “as Eden was watered by rivers that afterwards watered Assyria.” Genesis says of one of the four that it “goeth toward the east of Assyria” ([[Gen. 2:14]]).

      The trees of Eden come back in verses 16 and 18, and by then they are in the grave. There they have been read as “all the powerful and noble princes” who went down before the Assyrian.
    sources: [bdb, oshb-wlc, esv, keil-ezekiel, jfb-ezekiel, lds-scriptures]

  - ref: 10
    phrase: 'his heart is lifted up in his height'
    kind: scripture
    title: 'The charge is pride'
    body: |
      The cedar is not condemned for being tall, since the Lord made it so (verse 9), but for what its height did to its heart. In a modern translation the charge is that “its heart was proud of its height.” The Hebrew sentence begins by speaking to the tree (“thou hast lifted up thyself”) and then goes on about it (“he hath shot up his top”). A modern translation follows the ancient Syriac and Latin versions and reads the third person throughout.

      Ezekiel brings the same charge against the king of Tyre: “Thine heart was lifted up because of thy beauty” ([[Ezek. 28:17]]). Isaiah had brought it against Assyria itself, saying the Lord would punish “the fruit of the stout heart of the king of Assyria, and the glory of his high looks” ([[Isa. 10:12]]). And Isaiah’s day of the Lord falls “upon every one that is proud and lofty,” a list that goes on, “and upon all the cedars of Lebanon, that are high and lifted up” ([[Isa. 2:12–13]]).

      Verse 14 gives the reason the story is told. The cedar fell “to the end that none of all the trees by the waters exalt themselves for their height.”
    sources: [esv, lds-scriptures]

  - ref: 11
    phrase: 'the mighty one of the heathen'
    kind: history
    title: 'Who cut the cedar down'
    body: |
      The text names no one. Assyria is handed to “the mighty one of the heathen,” and “strangers, the terrible of the nations” do the cutting (verse 12). “Mighty one” is a Hebrew word for a “leader, chief,” and a modern translation has “the prince of the nations.”

      The history is known. The Medes advanced “in alliance with the Babylonians, and Nineveh fell.” The Bible Dictionary dates the fall to “about 607 B.C.”; a more recent Latter-day Saint account gives 612. The king of Babylon at the time was Nabopolassar, who in 605 sent his son Nebuchadnezzar against Necho of Egypt.

      Egypt had been close to these events. “In the last days of Nineveh” Pharaoh Necho “had advanced through Palestine to the Euphrates.” After the city fell, Egypt made an alliance with what was left of Assyria and, when the last battle with Babylon came, moved north “to side with Assyria.” The kingdom now being addressed had been Assyria’s ally in its last years.

      The phrase “the terrible of the nations” is used again of the force that will come on Tyre ([[Ezek. 28:7]]), and in the chapter before this one that force is named: “I will also make the multitude of Egypt to cease by the hand of Nebuchadrezzar king of Babylon. He and his people with him, the terrible of the nations, shall be brought to destroy the land” ([[Ezek. 30:10–11]]). Babylon, which had a hand in Assyria’s fall, is the power already appointed for Egypt.
    sources: [bdb, oshb-wlc, nrsvue, esv, bd-assyria, lund-ezekiel, lds-scriptures]

  - ref: 14
    phrase: 'to the nether parts of the earth'
    kind: words
    title: 'The grave under several names'
    body: |
      Four expressions in verses 14–18 name one place, the world of the dead. “The nether parts of the earth” is in Hebrew “the lowest earth (or land),” which is Sheol. “The grave” in verse 15 and “hell” in verses 16 and 17 both translate the one word *sheol*, “the Hebrew name for the abode of departed spirits,” which the King James Version renders “‘grave,’ ‘pit,’ and ‘hell,’ depending on the context.” A modern translation leaves it untranslated: “the cedar went down to Sheol.” “The pit” is a different word, explained at [[Ezek. 26:20]] (see the note there).

      So “I cast him down to hell” says first that the great king was put among the dead. The picture of a land underneath belongs to what has been called “the ancient belief that hell is below the earth,” said of the same phrase in the next chapter.

      In Ezekiel the word has a darker color as well. Sheol there is in particular a “land below, place of reproach, abode of uncircumcised.” The sentence passed on Pharaoh in verse 18, to “lie in the midst of the uncircumcised,” puts him in that place of reproach (see the note on [[Ezek. 28:10]]).

      Verse 14 uses the grave to level the great. The tall trees are delivered to death “in the midst of the children of men,” or in a modern translation, “along with mortals.” The next chapter walks through that country nation by nation ([[Ezek. 32:17–32]]).
    sources: [bdb, oshb-wlc, bd-sheol, esv, nrsvue, ot-manual-27, lds-scriptures]

  - ref: 15
    phrase: 'I covered the deep for him'
    kind: symbol
    title: 'The waters stop and Lebanon goes dark'
    body: |
      When the cedar goes down to the grave, the Lord puts the natural world into mourning for it: the deep is covered, its streams are held back, Lebanon mourns, and the trees of the field faint.

      The covering of the deep is hard, and it has been read in two ways. One takes it as a mourner’s covering: the verb is explained from the phrase for putting on sackcloth, “to veil or wrap in mourning.” The ancient Greek translation is close to this: “the deep mourned for him.” The other takes it as water closing over the tree, as in one modern translation: “I closed the deep over it and covered it.” Against that it has been said that “the tree Asshur was not destroyed by a flood, but cut down by strangers.”

      “I caused Lebanon to mourn” uses a verb whose first sense is to “be dark,” and so a modern translation has “I clothed Lebanon in gloom for it.”

      The deep is the one that raised the tree in verse 4. On the first reading its mourning is its drying up, and what the cedar lived on is gone: “the whole of the resources from which its prosperity and might had been derived were dried up.”
    sources: [keil-ezekiel, lxx-rahlfs, nrsvue, bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 16
    phrase: 'shall be comforted in the nether parts of the earth'
    kind: scripture
    title: 'The comfort of the dead'
    body: |
      The trees already in the grave are comforted, it seems, because the cedar now shares their fate. The verse gives no reason, but it has been read so: “the inhabitants of the nether world console themselves with the thought that the Assyrian is now sharing their fate.” The two passages nearest to this one carry the same thought.

      Isaiah’s taunt over the king of Babylon has the same scene. The dead kings rise from their thrones to meet him and say, “Art thou also become weak as we? art thou become like unto us?” ([[Isa. 14:10]]; see the note on [[Isa. 14:9]]). The trees speak there too: “Since thou art laid down, no feller is come up against us” ([[Isa. 14:8]]).

      In the next chapter Ezekiel gives Pharaoh the same comfort. Looking at the nations that lie in the pit, “Pharaoh shall see them, and shall be comforted over all his multitude” ([[Ezek. 32:31]]). That verse has been explained as Pharaoh and the kings before him being comforted “to know that they share a common fate.”

      The King James Version puts the comfort in the future, “shall be comforted.” A modern translation has “were comforted in the world below,” as part of the story of Assyria’s fall. The ancient Greek translation read the sentence differently again, with the trees doing the comforting: “all the trees of Delight comforted him in the heart.”

      Verse 17 adds who else went down. “They that were his arm” are, in a modern translation, “its allies,” the peoples who had lived in the cedar’s shade.
    sources: [keil-ezekiel, esv, nrsvue, lxx-rahlfs, ot-manual-27, lds-scriptures]

  - ref: 18
    phrase: 'This is Pharaoh and all his multitude'
    kind: words
    title: 'The story is handed to Pharaoh'
    body: |
      The last sentence applies everything said about the cedar to the king of Egypt. The question of verse 2 comes back, and what follows is a sentence of judgment and this one line. The ancient Greek translation makes the application plain: “Thus shall Pharao be, and the multitude of his host.”

      “Multitude” is *hamon*, a word for noise as well as for number: “sound, murmur, roar, crowd, abundance.” A modern translation has “his hordes.” The oracle is addressed in verse 2 “unto Pharaoh king of Egypt, and to his multitude,” and it closes on the same pair.

      The word runs through the prophecies against Egypt. Fifteen verses of chapters 29–32 have it, and the last of them leaves Pharaoh where this chapter says he will lie: “in the midst of the uncircumcised with them that are slain with the sword, even Pharaoh and all his multitude” ([[Ezek. 32:32]]).
    sources: [lxx-rahlfs, bdb, oshb-wlc, nrsvue, lds-scriptures]

christ: |
  The Lord speaks in the first person through the whole story: “I have made him fair” (verse 9), “I have therefore delivered him” (verse 11), “I cast him down” (verse 16).

  The Savior spoke in like terms to a town where His mighty works had been done: “And thou, Capernaum, which art exalted to heaven, shalt be thrust down to hell” ([[Luke 10:15]]).

  In His parable of the mustard seed the birds lodge in the branches of the kingdom of heaven ([[Matt. 13:31–32]]). With that parable in view, it has been said of the birds in the boughs of the Assyrian cedar that “the gospel kingdom shall gather all under its covert, for their good and for the glory of God, which the world kingdoms did for evil and for self-aggrandizement.”

explore: |
  - Isaiah’s taunt over a fallen king, with the dead who rise to meet him: [[Isa. 14:4–20]].
  - Isaiah on Assyria’s pride and its felling: [[Isa. 10:5–19]] and [[Isa. 10:33–34]].
  - Nebuchadnezzar’s dream of the great tree: [[Dan. 4:10–27]].
  - The cedar the Lord plants, and the high tree brought low: [[Ezek. 17:22–24]].
  - The pit where Asshur lies and Pharaoh is sent: [[Ezek. 32:17–32]].

