chapter: 3
title: The Roll, the Watchman, and the Closed Mouth
tagline: Ezekiel eats the written roll, is carried to the exiles at Tel-abib, is made a watchman answerable for their warning, and is then shut in his house to speak only when the Lord opens his mouth.
when: 'No new date: the chapter continues the vision dated in 1:1–2 to the fifth year of king Jehoiachin''s captivity (about 592 B.C.); verse 16 comes seven days after Ezekiel reaches Tel-abib'

setting: |
  Chapter 3 finishes what chapter 1 began. It gives no date of its own and stands under the heading of [[Ezek. 1:1–2]]: the fifth year of king Jehoiachin's captivity, about 592 B.C., among the exiles by the river Chebar in Babylonia. The vision of the throne became a commission in chapter 2, and the chapter break falls in the middle of a scene. The hand holding the written roll was stretched out in [[Ezek. 2:9–10]]; Ezekiel eats it in the first three verses here.

  The rest moves in three steps. The commission is completed (verses 4–11) and the vision lifts, leaving Ezekiel at Tel-abib, the settlement on the Chebar where he lived, and there he sits for a week among the exiles (verses 12–15). After the seven days the word of the Lord comes again and makes him a watchman (verses 16–21); the Church's chapter heading takes its summary from these verses. Last, the glory appears a second time, in the plain, and he is sent home to be bound and dumb except when the Lord speaks (verses 22–27). The acted signs of chapters 4–5 follow.

  Two things begun here are finished much later. The watchman's charge returns, nearly word for word, in [[Ezek. 33:7–9]], where the book turns from judgment to restoration, and the dumbness imposed in verse 26 is lifted in the same chapter, when word comes that Jerusalem has fallen ([[Ezek. 33:21–22]]).

thread: |
  The chapter follows the Lord's word through a man: **it is put into him, carried by him, required of him, and then held back in him until the Lord releases it.** He eats the roll before he says anything (verses 1–3). He is told that his hearers will refuse it and is made as hard as they are (verses 4–11). He is carried to them and sits a week without speaking (verses 12–15). He is made a watchman, answerable for giving the warning and not for what his hearers do with it (verses 16–21). And he is shut in his house with his tongue stopped, to speak only when the Lord opens his mouth (verses 22–27).

  One phrase frames the whole. The commission ends with “whether they will hear, or whether they will forbear” (verse 11), and the chapter ends with “He that heareth, let him hear; and he that forbeareth, let him forbear” (verse 27). The prophet's part is fixed and theirs is left open. So the chapter can make him a watchman and then silence him: in both he says what the Lord gives him, when the Lord gives it, and nothing of his own.

sections:
  - range: 1-3
    heading: Ezekiel eats the roll
    plain: |
      He said to me, “Son of man, eat what is in front of you. Eat this roll, and then go and speak to the house of Israel.” I opened my mouth and he gave me the roll to eat. He said, “Feed your belly with it; fill yourself with this roll that I am giving you.” I ate it, and in my mouth it was as sweet as honey.
  - range: 4-11
    heading: Sent to a people who will not listen
    plain: |
      “Go to the house of Israel and speak my words to them. You are not being sent to a people of obscure speech and difficult language, but to the house of Israel; not to many peoples whose words you cannot understand. If I sent you to them, they would listen to you. But the house of Israel will not listen to you, because they will not listen to me: all of them have hard foreheads and stubborn hearts. I have made your face as hard as their faces and your forehead as hard as their foreheads, like adamant, harder than flint. Do not fear them or be dismayed at their looks, rebellious house though they are. Take into your heart all the words I speak to you and hear them with your ears. Then go to the exiles, your own people, and tell them, ‘Thus saith the Lord GOD,’ whether they listen or refuse.”
  - range: 12-15
    heading: Carried to Tel-abib
    plain: |
      Then the spirit lifted me up, and behind me I heard a great rushing sound and a voice: “Blessed be the glory of the Lord from his place.” I heard the wings of the living creatures touching one another, and the wheels beside them, and a great rushing. The spirit lifted me and took me away. I went bitter and angry in spirit, with the hand of the Lord strong upon me. I came to the exiles at Tel-abib, who lived by the river Chebar. I sat where they sat, and stayed there among them, stunned, for seven days.
  - range: 16-21
    heading: The watchman's charge
    plain: |
      At the end of the seven days the word of the Lord came to me: “Son of man, I have made you a watchman for the house of Israel. When you hear a word from my mouth, warn them from me. If I say to a wicked man, ‘You will surely die,’ and you do not warn him or speak to turn him from his wicked way to save his life, he will die in his iniquity, but I will hold you answerable for his blood. If you do warn him and he does not turn, he will die in his iniquity, but you will have delivered your own soul. And if a righteous man turns from his righteousness and does wrong, and I put a stumblingblock in front of him, he will die. Because you did not warn him he will die in his sin, and the righteous things he did will not be remembered, but I will hold you answerable for his blood. But if you warn the righteous man not to sin and he does not sin, he will surely live, because he was warned, and you will have delivered your soul.”
  - range: 22-27
    heading: The glory in the plain, and the prophet shut in
    plain: |
      The hand of the Lord was on me there, and he said, “Get up, go out into the plain, and I will speak with you there.” I went out, and the glory of the Lord stood there, like the glory I had seen by the river Chebar, and I fell on my face. The spirit entered me and set me on my feet, and he said, “Go and shut yourself inside your house. They will put bands on you and bind you, and you will not go out among them. I will make your tongue stick to the roof of your mouth, so that you will be dumb and will not be the one who reproves them, for they are a rebellious house. But when I speak with you I will open your mouth, and you will say to them, ‘Thus saith the Lord GOD.’ Whoever will hear, let him hear; whoever refuses, let him refuse; for they are a rebellious house.”

notes:
  - ref: 1
    phrase: eat this roll
    kind: symbol
    title: Eating the roll
    body: |
      Ezekiel eats the roll to show that the message he will carry is taken in whole before a word of it is spoken. The roll was held out in the last chapter, written on both sides with “lamentations, and mourning, and woe” ([[Ezek. 2:10]]). Here the command to eat comes three times in verses 1 and 3, and “go speak” follows in the same breath. In ancient Jewish and Egyptian writings, eating or chewing written words “represented internalizing and memorizing them,” so that once Ezekiel had eaten the Lord's words “he was able to speak them because he knew them.” Verse 10 gives the command without the image: “all my words that I shall speak unto thee receive in thine heart.”

      The taste is the surprise. A roll of lamentation is “as honey for sweetness.” Jeremiah, prophesying in Jerusalem in the same years, also speaks of eating the Lord's words: “Thy words were found, and I did eat them; and thy word was unto me the joy and rejoicing of mine heart” ([[Jer. 15:16]]). The Psalmist says, “How sweet are thy words unto my taste! yea, sweeter than honey to my mouth!” ([[Ps. 119:103]]). The sweetness belongs to the word as the Lord's word, not to the news in it: even when that word brings sorrow, “it can still be sweet.” The bitterness comes in verse 14.

      A heavenly book is also one of the features Ezekiel's call shares with Lehi's. Lehi was handed a book in vision, read in it “Wo, wo, unto Jerusalem” ([[1 Ne. 1:13]]), and then praised God.
    sources: [sc-knowhy-306, sc-knowhy-459, lds-scriptures]
  - ref: 5
    phrase: a people of a strange speech and of an hard language
    kind: words
    title: Not a problem of language
    body: |
      The Lord tells Ezekiel that the obstacle in front of him is not language. The two Hebrew adjectives are “deep” and “heavy”: the first means speech that is “unintelligible,” and the second is used here “of a language to be understood,” that is, a hard one. A modern translation has “a people of obscure speech and difficult language.”

      Verse 6 then says something a reader may pass over: the foreigners would have listened. Verse 7 gives the reason Israel will not, and it has nothing to do with understanding or with the messenger: Israel “will not hearken unto thee; for they will not hearken unto me.” The people who share the prophet's language are the ones who refuse. The Savior said something like it of the towns that saw the most of His work: “if the mighty works, which were done in you, had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes” ([[Matt. 11:21]]).
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]
  - ref: 8
    phrase: thy forehead strong against their foreheads
    kind: words
    title: A forehead as hard as theirs
    body: |
      The Lord meets Israel's hardness by making His prophet as hard as they are. “Impudent” in verse 7 is, word for word, strong of forehead: “the house of Israel are stout of forehead (i.e. obstinate).” Verse 8 takes the same two words and gives them to Ezekiel. The adjective “strong” (*ḥazaq*) comes in verse 7 of Israel and then three times in verses 8–9 of the prophet, where it means “firm, hard, of face.”

      “Adamant” (*shamir*) is a stone that stands for hardness, and Zechariah uses it of Israel's own hearts: they “made their hearts as an adamant stone, lest they should hear the law” ([[Zech. 7:12]]).

      The prophet's own name is built on the same root. Ezekiel means “God will strengthen,” from the verb *ḥazaq*, and that verb comes in verse 14: “the hand of the LORD was strong upon me.” Notice what is not promised. The Lord does not tell Ezekiel that he will be heard (verse 7 has said he will not), only that he will not break: “fear them not, neither be dismayed at their looks.”
    sources: [bdb, oshb-wlc, strongs-concordance, bd-ezekiel, lds-scriptures]
  - ref: 12
    phrase: Blessed be the glory of the LORD from his place
    kind: scripture
    title: A voice of praise behind him
    body: |
      As the vision ends, Ezekiel hears words of praise behind him, together with the sound of the creatures' wings and of the wheels. The text does not say whose voice it is. It is “probably the acclamation of the living creatures,” whose wings are heard in the next verse. Set beside Lehi's call, the verse has been counted among the “angelic songs of praise” the two visions share, with Lehi's own cry when he had read the book given him: “Great and marvelous are thy works, O Lord God Almighty!” ([[1 Ne. 1:14]]).

      Translations differ here. The Septuagint agrees with the King James Version (“Blessed be the glory of the Lord from his place”), but the New Revised Standard Version has no spoken words at all: “as the glory of the Lord rose from its place, I heard behind me the sound of loud rumbling.” In that translation the sound is the glory itself rising; in the King James Version it is a blessing spoken as the vision ends.
    sources: [clarke-commentary, sc-knowhy-459, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 14
    phrase: I went in bitterness, in the heat of my spirit
    kind: words
    title: Sweet in the mouth, bitter on the way
    body: |
      The roll that was sweet in Ezekiel's mouth leaves him bitter and angry as he goes. “Bitterness” (*mar*) is the ordinary word for a bitter taste, the lexicon's opposite of the “sweet” (*matoq*) of verse 3, so the two verses answer each other. “The heat of my spirit” is stronger than it sounds: “the rage of my spirit.” The Septuagint has nothing for “bitterness” and reads only “I went in the impulse of my spirit.” The verse does not say whom the anger is against, or whether it is Ezekiel's own or the anger of the message he now carries. It adds only that the Lord's hand was “strong” upon him.

      John records a like experience. He is given a little book to eat, and “it was in my mouth sweet as honey: and as soon as I had eaten it, my belly was bitter” ([[Rev. 10:10]]). Elder Bruce R. McConkie explained John's bitterness as the weight of what the book held, which “caused him to despair and have sorrow of soul,” and added, “Ezekiel had a similar experience.”
    sources: [bdb, oshb-wlc, lxx-rahlfs, ot-manual-26, lds-scriptures]
  - ref: 15
    phrase: remained there astonished among them seven days
    kind: history
    title: Seven days at Tel-abib
    body: |
      Ezekiel's first act after his call is to sit for a week among the exiles. Tel-abib was a place in Babylonia on the Chebar, a canal that left the Euphrates north of Babylon and rejoined it some sixty miles to the southeast. Many of the exiles carried from Judah lived on its banks, and Ezekiel had settled there.

      “Astonished” is too mild. The Hebrew participle means “shewing horror”; a modern translation has “stunned.” The text does not say why seven days, and the note does not guess. What it does say is where he sat: “I sat where they sat.” The man who has just seen the throne of God comes back to the settlement of his own people and waits, and the word of the Lord does not come again until the week is over (verse 16).
    sources: [bdb, bd-chebar, bd-ezekiel, nrsvue]
  - ref: 17
    phrase: I have made thee a watchman unto the house of Israel
    kind: symbol
    title: The watchman
    body: |
      A watchman is a lookout, posted to see what the people behind him cannot yet see and to tell them. The Hebrew *tsopheh* is the participle of a verb meaning to “look out or about, spy, keep watch.” It is the word for the sentries of Samuel and Kings, and it is used “figurative of prophets” here and in Hosea, Jeremiah, and Isaiah. Such sentries stood on a wall or in a tower to see danger while it was still far off and give warning of it. The image is a military one, and it carries a penalty: such a watchman “faced execution if he failed to warn the city when the enemy appeared.”

      Ezekiel's post differs from an ordinary sentry's in one respect: the warning he gives comes from the Lord who posted him. “Hear the word at my mouth, and give them warning from me.” The same voice that says to the wicked “Thou shalt surely die” (verse 18) appoints a man to warn him first.

      Here the Lord states the charge directly. The fuller picture (a city, a sword coming, a trumpet) is drawn in [[Ezek. 33:1–9]], where the commission is given a second time.
    sources: [bdb, ensign-watchmen, ot-manual-26, lds-scriptures]
  - ref: 18
    phrase: his blood will I require at thine hand
    kind: scripture
    title: Answerable for the warning, not for the outcome
    body: |
      The watchman answers for whether he warned, not for whether anyone listened. Verses 18–21 set out four cases: a wicked man who is not warned, a wicked man who is warned and does not turn, a righteous man who turns to sin and is not warned, and a righteous man who is warned and does not sin. In the first three the sinner dies “in his iniquity” or “in his sin,” which is his own; the prophet's silence does not excuse him. What changes from case to case is the prophet's standing: either “his blood will I require at thine hand” or “thou hast delivered thy soul.” This chapter stands with chapter 18 as showing both “the significance of a prophet's warning” and each person's own responsibility for what he does. Both halves are in these four verses.

      The Book of Mormon describes the charge to teach in the same terms. Jacob and Joseph took “upon us the responsibility, answering the sins of the people upon our own heads if we did not teach them the word of God with all diligence; wherefore, by laboring with our might their blood might not come upon our garments” ([[Jacob 1:19]]). The Church's edition places that verse and Ezekiel 3:17 under one Topical Guide heading, on magnifying a calling, and joins to Jacob's words King Benjamin's and Paul's ([[Mosiah 2:27]]; [[Acts 20:26]]).
    sources: [bd-ezekiel, lds-scriptures]
  - ref: 20
    phrase: I lay a stumblingblock before him
    kind: words
    title: The stumblingblock the Lord lays
    body: |
      In this verse the stumblingblock is laid after the man has turned from righteousness, and the word here means a calamity sent in judgment, not a temptation. The order is plain: he turns, he commits iniquity, “and I lay a stumblingblock before him, he shall die.” The lexicon separates two uses of the word. In its “ethical sense” it is something that leads a person into sin, usually an idol, as in [[Ezek. 14:3–4]]. Here it is “figurative of misfortune, calamity,” a stumblingblock laid “in divine judgment,” as when the Lord says, “I will lay stumblingblocks before this people, and the fathers and the sons together shall fall upon them” ([[Jer. 6:21]]). The Septuagint translates it that way outright: “I shall bring punishment before him.”

      There is another reading, that the stumblingblock is a trial the Lord allows: “God is repeatedly represented as doing things which he only permits to be done. He lays a stumbling-block, i.e., he permits one to be laid.” The Hebrew has no word for permitting: the verb is the one translated “I have made” in verses 8, 9, and 17, in the first person. The verse is hard on either reading. But both agree with what the verse itself insists on: the man dies “in his sin,” his own, and the watchman who kept quiet is still held to account for him.
    sources: [bdb, lxx-rahlfs, clarke-commentary, lds-scriptures]
  - ref: 21
    phrase: he shall surely live, because he is warned
    kind: prophets
    title: To warn is to care
    body: |
      Elder D. Todd Christofferson taught the watchman's charge as an act of love, a duty felt most keenly by prophets and shared by everyone who has been warned. Verse 21 is the only one of the four cases that ends in life. Teaching from Ezekiel's commission, he said that the duty to warn “is a duty shared by others as well,” and he cited the revelation, “it becometh every man who hath been warned to warn his neighbor” ([[D&C 88:81]]). “The motivation for raising the warning voice is love,” he said. “To warn is to care.” He set beside the watchman's charge the plea the Lord gives Ezekiel to deliver: “I have no pleasure in the death of the wicked; but that the wicked turn from his way and live” ([[Ezek. 33:11]]).

      Elder Neil L. Andersen used the same image of the living prophet, whom “the Lord Jesus Christ has called” and “designated” as “His watchman on the tower.”
    sources: [christofferson-warning, andersen-prophet, lds-scriptures]
  - ref: 23
    phrase: the glory of the LORD stood there
    kind: history
    title: The glory in the plain
    body: |
      The glory Ezekiel saw by the Chebar meets him a second time in open country in Babylonia. The word for the place means a “plain (sometimes valley-plain, broad valley)”; a modern translation has “valley.” It comes five times in Ezekiel: twice here, once in [[Ezek. 8:4]] (the verse the Church edition's footnote joins to verse 22), and twice of the valley of dry bones ([[Ezek. 37:1–2]]). The book does not say that these are one place.

      He responds as he did the first time. He falls on his face, and the Spirit enters him and sets him on his feet. The first vision likely gave Ezekiel “assurance that the Lord could still be with the people, even though they had been exiled to Babylon,” and the text says that what stands in the plain is that same glory.
    sources: [bdb, oshb-wlc, nrsvue, scripture-helps-ezek]
  - ref: 26
    phrase: thou shalt be dumb, and shalt not be to them a reprover
    kind: history
    title: A watchman made silent
    body: |
      The man just made a watchman is told to stay in his house and say nothing of his own, and this shapes his ministry instead of stopping it. Two questions arise, and the text settles only one.

      *Who binds him?* “They shall put bands upon thee” has no named subject. It is read of his countrymen, who hindered him “either by physical binding and confinement (though there is no scriptural record that this did actually happen), or by rejecting his message.” It has also been read as the Lord's own act, because in the next chapter the Lord says, “I will lay bands upon thee” ([[Ezek. 4:8]]), and because “of hostile attacks by the exiles upon the prophet there is not a trace to be discovered in the entire remainder of the book.” On that reading no rope is meant: “God binds him by a spiritual power.” The verse itself names no one.

      *Is he silent altogether?* No, and verse 27 says so: “when I speak with thee, I will open thy mouth.” What he stops being is “a reprover” on his own account. He “is not to keep entire silence, except when God inspires him to speak,” and he sets Israel's sins before them “to no greater extent, and in no other way, than God expressly directs him.” He is next seen at home: chapter 8 opens with him sitting “in mine house, and the elders of Judah sat before me” ([[Ezek. 8:1]]).

      The book marks the end of the dumbness at the fall of Jerusalem, and the restraint is best taken as holding for the whole time between. The Lord promises that on the day a fugitive brings the news, “thou shalt speak, and be no more dumb” ([[Ezek. 24:27]]), and when the fugitive arrives in the twelfth year of the captivity, Ezekiel records, “my mouth was opened, and I was no more dumb” ([[Ezek. 33:22]]). By the book's own dates (the fifth year in [[Ezek. 1:2]], the twelfth in [[Ezek. 33:21]]) that is more than seven years after this chapter.
    sources: [keil-ezekiel, ot-manual-26, lds-scriptures]

christ: |
  The One who feeds Ezekiel the roll, makes him a watchman, and stops his mouth is the Lord whose glory he saw on the throne ([[Ezek. 1:26–28]]). Elder D. Todd Christofferson names Him in this passage: “In commissioning Ezekiel, Jehovah used the metaphor of a watchman.” He then turns from the watchman to the Savior's mortal ministry: “Because of His incomparable love and concern for others and their happiness, Jesus was not hesitant to warn.”

explore: |
  Read [[Ezek. 33:1–9]] beside verses 16–21: the watchman's charge is given again there, with the parable of the city and the trumpet, when the fall of Jerusalem is about to be reported. [[Ezek. 24:25–27]] and [[Ezek. 33:21–22]] close what verse 26 opens. For the righteous man who turns (verse 20), read [[Ezek. 18:24]] and [[Ezek. 33:12–13]]. For other prophets who take in the word before they speak it, read [[Jer. 15:16–17]] and [[Rev. 10:8–11]] with [[D&C 77:14]]. For a call in the same years with the same features (a throne, a book, praise, and a people who will not hear), read [[1 Ne. 1:8–20]]. Elder D. Todd Christofferson's “The Voice of Warning” (general conference, April 2017) is the fullest latter-day treatment of the watchman.

