chapter: 45
title: 'A Holy Portion of the Land'
tagline: 'When the land is divided, a tract of it is offered to the Lord for the sanctuary, the priests, and the Levites. The princes are told to stop taking, measures are made honest, and the year’s offerings and feasts are set.'
when: 'No date of its own. The chapter belongs to the vision dated at 40:1, “the five and twentieth year of our captivity… the fourteenth year after that the city was smitten” (about 573 B.C., counting from the book’s first date).'

setting: |
  Ezekiel is still in the vision that began in the twenty-fifth year of the captivity ([[Ezek. 40:1]]), and the temple he is shown has not been built (see the setting of [[Ezek. 40]]). The measuring of the building ended in chapter 42. In chapter 43 the glory of the Lord “came into the house by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]), and since then the vision has been giving laws: for the altar, for the priests and Levites, and now for the land, the ruler, and the calendar.

  The chapter turns to the dividing of the land, but it describes only the middle of it: the part reserved for the sanctuary, the priests, the Levites, the city, and the prince. The rest waits for [[Ezek. 47:13–48:29]], where the country is laid out “in strips” from the Mediterranean to the Jordan, one for each tribe, with “a strip out of the middle” for the portions named here. Chapter 48 repeats this reserved tract with more detail ([[Ezek. 48:8–22]]).

  From verse 13 the subject is the offerings of this temple: what the people give, what the prince must provide, and when. Chapter 46 continues it with the sabbaths, the new moons, and the daily offering.

thread: |
  The chapter starts with the land, turns to the ruler, and ends with the calendar.

  When the land is divided, a tract is offered to the Lord for the sanctuary and those who serve in it (verses 1–6). The prince receives an estate beside it, and the reason is given at once: “my princes shall no more oppress my people” (7–8). That sentence opens into a direct rebuke, “Let it suffice you, O princes of Israel,” and then a rule: honest scales, an honest ephah, an honest bath (9–12).

  Then the measures are put to use. A fixed share of grain, oil, and flock is given as an “oblation,” the word used of the land in verse 1, and the prince who receives it must supply the nation’s sacrifices from it (13–17). The year begins with the cleansing of the sanctuary itself (18–20), and two week-long feasts follow, in the first month and the seventh (21–25).

  Twice the chapter says what the offerings are for, “to make reconciliation” (verses 15, 17), and the cleansing of the sanctuary is to “reconcile the house” (verse 20).

sections:
  - range: 1-8
    heading: 'The holy portion and the prince’s land'
    plain: |
      When the land is divided by lot for an inheritance, the people are to offer a holy portion of it to the Lord, twenty-five thousand long and ten thousand broad, holy throughout. Within it a square of five hundred by five hundred is for the sanctuary, with fifty cubits of open ground around it. From this measure a tract twenty-five thousand by ten thousand is to be measured, and the sanctuary, the most holy place, will be in it. This holy portion is for the priests who come near to minister to the Lord: a place for their houses and a holy place for the sanctuary. A tract of the same size is for the Levites, the ministers of the house, as a possession for twenty chambers. Beside the holy portion, a tract five thousand broad and twenty-five thousand long belongs to the city; it is for the whole house of Israel.

      The prince has a portion on both sides of the holy portion and the city’s land, westward on the west and eastward on the east, as long as one of the tribes’ portions, from the west border to the east. This is his possession in Israel. The Lord’s princes will no longer oppress His people, and the rest of the land they will give to the house of Israel by their tribes.
  - range: 9-12
    heading: 'Enough, princes of Israel'
    plain: |
      The Lord God says: Let it be enough for you, princes of Israel. Put away violence and plunder, do judgment and justice, and take your exactions off my people. You are to have just balances, a just ephah, and a just bath. The ephah and the bath are to be one measure, each a tenth of a homer; the homer is the standard. The shekel is twenty gerahs. Twenty shekels, twenty-five shekels, and fifteen shekels are to be your maneh.
  - range: 13-17
    heading: 'The people’s offering and the prince’s duty'
    plain: |
      This is the oblation the people are to offer: a sixth of an ephah from each homer of wheat and the same from each homer of barley; of oil, a tenth of a bath from each cor, which is a homer of ten baths; and one lamb from every two hundred, from the fat pastures of Israel. These are for the meat offering, the burnt offering, and the peace offerings, to make reconciliation for them. All the people of the land give this oblation for the prince in Israel. It is the prince’s part to give the burnt offerings, meat offerings, and drink offerings at the feasts, the new moons, the sabbaths, and all the appointed times of the house of Israel. He is to prepare the sin offering, the meat offering, the burnt offering, and the peace offerings, to make reconciliation for the house of Israel.
  - range: 18-20
    heading: 'Cleansing the sanctuary'
    plain: |
      The Lord God says: On the first day of the first month, take a young bullock without blemish and cleanse the sanctuary. The priest is to take some of the blood of the sin offering and put it on the posts of the house, on the four corners of the settle of the altar, and on the posts of the gate of the inner court. The same is to be done on the seventh day of the month for everyone who errs and for the simple. So the house is reconciled.
  - range: 21-25
    heading: 'The Passover and the feast of the seventh month'
    plain: |
      On the fourteenth day of the first month is the Passover, a feast of seven days, when unleavened bread is eaten. On that day the prince prepares a bullock as a sin offering for himself and for all the people of the land. On each of the seven days he prepares a burnt offering to the Lord of seven bullocks and seven rams without blemish, and a kid of the goats as a sin offering, with a meat offering of an ephah for each bullock and each ram and a hin of oil for each ephah. On the fifteenth day of the seventh month, in the feast of seven days, he does the same: the sin offering, the burnt offering, the meat offering, and the oil.

notes:
  - ref: 1
    phrase: 'an oblation unto the LORD'
    kind: words
    title: 'The land itself is the offering'
    body: |
      A share of the land goes to the Lord, and the word for it is the word for an offering. The Hebrew is *terumah*, a “contribution, offering, for sacred uses,” at root “something lifted off, separated.” In these chapters it also names a “tract of land to be set apart for temple, and for use of priests and Levites.” The same word returns in verse 13 for the people’s wheat and barley. So the chapter has two oblations: one of land, made when the country is divided, and one of produce.

      Under the law of Moses the priests had no inheritance in the land. Aaron was told, “Thou shalt have no inheritance in their land” ([[Num. 18:20]]), and the chapter before this one has just said it again of the priests of this temple: “I am their inheritance” ([[Ezek. 44:28]]). Here the land is offered “unto the LORD,” and within it the priests are given “a place for their houses.”

      The arrangement is of bands lying side by side. One is for the priests, and “the sanctuary of the LORD shall be in the midst thereof” ([[Ezek. 48:10]]). One of equal size is for the Levites. A narrower one is for the city, and it is “for the whole house of Israel.” The prince’s land lies at either end, to the east and to the west.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 1
    phrase: 'the breadth shall be ten thousand'
    kind: words
    title: 'How large, and in what unit'
    body: |
      The Hebrew gives these figures without a unit, and its “ten thousand” is read as twenty thousand by the ancient Greek translation and by modern ones. In the Hebrew of verse 1 “the measure to be employed is not given.” The King James Version has reeds; modern translations have cubits. The same question arises over the sanctuary’s five hundred, and the case for each unit is set out in the note on [[Ezek. 42:16]]. Here too the reed has been defended, on the ground that only the fifty of verse 2 is marked as cubits.

      The breadth is a separate matter. The ancient Greek translation has “in breadth twenty thousand,” and modern translations print that figure with the note “Septuagint; Hebrew 10,000.” The reason lies in the next verses. Verse 3 measures out of this tract a strip ten thousand broad for the priests, and verse 5 gives the Levites another of the same size. Two such strips need twenty thousand, so the Greek figure has been judged “more correct.”

      On that reading, and in the long cubit of this vision, “about 21 inches,” the holy portion is a little over eight miles long and about six and a half broad. With the city’s five thousand of verse 6 the whole reserved block is square: “All the oblation shall be five and twenty thousand by five and twenty thousand” ([[Ezek. 48:20]]). If the unit is the reed of six cubits ([[Ezek. 40:5]]), every figure is six times larger.
    sources: [oshb-wlc, lxx-rahlfs, esv, nrsvue, keil-ezekiel, lds-scriptures]

  - ref: 5
    phrase: 'for a possession for twenty chambers'
    kind: words
    title: 'Twenty chambers, or cities to live in'
    body: |
      The Hebrew text ends this verse with “twenty chambers,” but the ancient Greek translation reads “cities to dwell in,” and modern translations follow the Greek. One has “as their possession for cities to live in,” with the note “Septuagint; Hebrew as their possession, twenty chambers.”

      The law had commanded Israel to give the Levites “cities to dwell in” ([[Num. 35:2]]), each with open ground around it. That open ground is the word the King James Version translates “suburbs,” and it stands in verse 2 of this chapter: the fifty cubits around the sanctuary are “open land or space about the temple.”
    sources: [oshb-wlc, lxx-rahlfs, esv, nrsvue, bdb]

  - ref: 8
    phrase: 'my princes shall no more oppress my people'
    kind: history
    title: 'Land enough for the prince, and no more'
    body: |
      The prince is given an estate of his own so that he will have no cause to take anyone else’s. Verse 7 places it on both sides of the holy portion and the city, reaching to the borders of the land, and verse 8 states the purpose. The grant is “to guard against all exaction on the part of the princes in time to come.”

      Israel’s kings had a record. Samuel warned what a king would do: “he will take your fields, and your vineyards, and your oliveyards, even the best of them” ([[1 Sam. 8:14]]). Ahab’s treatment of Naboth has been called the “glaring example.” Naboth had answered the king, “The LORD forbid it me, that I should give the inheritance of my fathers unto thee” ([[1 Kgs. 21:3]]). Ezekiel himself had said that Jerusalem’s princes were “like wolves ravening the prey” ([[Ezek. 22:27]]).

      Verse 9 then speaks to the princes directly. “Let it suffice you” is two words in Hebrew, *rab lakem*, which modern translations give as “Enough, O princes of Israel!” The word behind “exactions” is found only here, and means “acts of expulsion”: “Cease your evictions of my people.” The charge is that rulers have been turning people out of their property.

      The next chapter completes the rule. The prince must provide for his sons “out of his own possession,” and he “shall not take of the people’s inheritance by oppression, to thrust them out of their possession” ([[Ezek. 46:18]]).
    sources: [keil-ezekiel, bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 10
    phrase: 'a just ephah, and a just bath'
    kind: history
    title: 'Honest measures in a temple vision'
    body: |
      Verse 10 requires honest scales and honest measures, and the units it fixes are the ones in which the offerings of the next verses are counted. The requirement was already in the law: “Just balances, just weights, a just ephah, and a just hin, shall ye have” ([[Lev. 19:36]]). Amos had described the merchants who broke it, “making the ephah small, and the shekel great, and falsifying the balances by deceit” ([[Amos 8:5]]).

      The ephah measured dry goods and the bath liquids. Verse 11 makes them equal, each a tenth of a homer. The homer is put at about 230 liters, some 6½ U.S. bushels, and the bath at about 8¼ U.S. gallons. These are estimates, since the values of biblical measures “varied from time to time.” Verses 13 and 14 then set the people’s offering as a part of an ephah from each homer and a part of a bath from each cor.

      The weights of verse 12 are harder. The three sums of twenty, twenty-five, and fifteen shekels add up to sixty, but the maneh is elsewhere reckoned as “equivalent to 50 shekels.” The ancient Greek translation has other figures, which end in fifty: “five shekels, fifteen shekels and fifty shekels.” The text does not say why the maneh is given as three sums.
    sources: [bd-weights-and-measures, lxx-rahlfs, lds-scriptures]

  - ref: 16
    phrase: 'this oblation for the prince in Israel'
    kind: history
    title: 'A fixed share for the public offerings'
    body: |
      The people give a set fraction of their produce to the prince, and the prince supplies from it the sacrifices offered for the whole nation. The rates are small: “of corn the sixtieth part, of oil the hundredth part, and of the flock the two hundredth head.” Verse 17 names what he owes in return: the burnt, meat, and drink offerings at the feasts, the new moons, and the sabbaths.

      The arrangement is new. The law of Moses named the firstborn, the firstfruits, and the tithes as what Israel owed to the sanctuary, but it “contains no regulation as to the sources from which the priests were to meet the demands for the festal sacrifices. So far, the instructions in the verses before us are new.”

      The prince provides the offerings; he does not perform them. In verse 19 it is “the priest” who takes the blood. One modern translation has the people make their offering through him: “All the people of the land shall join in making this offering in Israel through the prince.”
    sources: [keil-ezekiel, bd-weights-and-measures, nrsvue, lds-scriptures]

  - ref: 17
    phrase: 'to make reconciliation for the house of Israel'
    kind: words
    title: 'Reconciliation is atonement'
    body: |
      “Make reconciliation” translates the Old Testament’s ordinary verb for atonement, *kipper*. It comes three times in the chapter, in verses 15, 17, and 20, and modern translations speak of atonement each time. In verse 17 it is made “on behalf of the house of Israel,” the same construction used in Leviticus of Aaron’s atoning for the people. The King James word is a fair one, since atonement “denotes the reconciliation of man to God.” The third use has a building for its object: “so shall ye reconcile the house” (verse 20).

      A reader will ask how sacrifices that atone can belong to a temple still to be built. President Joseph Fielding Smith taught that blood sacrifice will be offered again for a time, long enough to complete the restoration in this dispensation, and that afterward sacrifice will be of another kind. The question is taken up at [[Ezek. 43:18–27]], and the note on [[Ezek. 40:39]] introduces it.
    sources: [bdb, oshb-wlc, esv, bd-atonement, ot-manual-27, lds-scriptures]

  - ref: 18
    phrase: 'cleanse the sanctuary'
    kind: scripture
    title: 'A yearly cleansing of the house'
    body: |
      The year in this temple opens with the purifying of the building itself, a rite the law of Moses does not have. “There is nothing of this in the Mosaic law; it seems to have been a new ceremony. An annual purification of the sanctuary may be intended.” The blood of a bullock is put on the doorposts of the house, on the corners of the altar’s ledge, and on the posts of the inner gate. The altar was treated the same way when it was first consecrated: “thus shalt thou cleanse and purge it” ([[Ezek. 43:20]]).

      Verse 20 says whose sins have made the cleansing necessary: “every one that erreth, and for him that is simple.” The first word is the law’s term for one who commits a “sin of ignorance, inadvertence,” as in “if any one of the common people sin through ignorance” ([[Lev. 4:27]]). The second is the “simple” person of Proverbs, one of those who are “easily enticed, misled,” and who here “need atonement.” Atonement under the law could be made for “unconscious, unintentional sins.”

      The law also had a rite that cleansed the sanctuary: the Day of Atonement, in the seventh month, when the high priest made “an atonement for the holy place, because of the uncleanness of the children of Israel” ([[Lev. 16:16]]). Both rites make atonement for “sacred places.” Ezekiel’s calendar does not name that day. The ancient Greek translation dates the second cleansing “in the seventh month; on the first day of the month,” half a year after the first; the Hebrew keeps both in the first month.
    sources: [clarke-ezekiel, bdb, oshb-wlc, bd-sacrifices, bd-fasts, lxx-rahlfs, esv, lds-scriptures]

  - ref: 21
    phrase: 'ye shall have the passover'
    kind: scripture
    title: 'Two feasts, and offerings the law did not set'
    body: |
      Only two of the law’s yearly feasts are named here, and their offerings are not the ones the law prescribed. The first is the Passover with its seven days of unleavened bread. The second falls on the fifteenth day of the seventh month, the date of “the feast of tabernacles for seven days unto the LORD” ([[Lev. 23:34]]), though the chapter does not use the name.

      For each day of the Passover week the law required “two young bullocks, and one ram, and seven lambs of the first year” ([[Num. 28:19]]). Here it is seven bullocks and seven rams a day, and no lambs are listed. The “meat offering” of verse 24 is “a grain offering,” a full ephah with each animal. The burnt offerings and grain offerings are “much richer and more copious” than those of the law.

      More striking is what is absent. The chapter “omits not only the Pentecost, or feast of weeks, but also the day of trumpets, on the first of the seventh month, and the day of atonement on the tenth.” The text gives no reason. One reading is that the sin offerings of the first month (verses 18–20 and 22) take over the work of the autumn days, so that the prophet “practically transfers” them “to the first month.” That is an inference from the calendar’s shape, not a statement of the text. What the text does show is that the worship of this temple is not a copy of the Mosaic year.
    sources: [keil-ezekiel, bd-sacrifices, esv, lds-scriptures]

  - ref: 22
    phrase: 'for himself and for all the people of the land'
    kind: history
    title: 'The prince offers for himself'
    body: |
      The prince needs atonement along with the people he leads. On the day of the Passover he prepares a bullock as a sin offering “for himself and for all the people of the land.” He also has an estate with borders (verses 7–8), and he has sons who inherit from him: “If the prince give a gift unto any of his sons” ([[Ezek. 46:16]]).

      The text never names him. His title is *nasi*, “one lifted up,” a chief, the title given earlier to “my servant David a prince among them” ([[Ezek. 34:24]]). The vision does not say that the two are one, and who this prince is it leaves unsaid; see the note on [[Ezek. 44:3]], where he first appears.
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  The offerings of this chapter are made “to make reconciliation,” which is the Old Testament’s word for atonement (see the note on [[Ezek. 45:17]]). From Adam until the Savior’s death, animal sacrifices “were symbolic of the forthcoming death of Jesus Christ.” The one feast the chapter names is the Passover, and Paul gives its meaning in a sentence: “For even Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]).

explore: |
  - The reserved tract again, with the tribes on either side of it: [[Ezek. 48:8–22]].
  - The rest of the prince’s rules, his gate, his offerings, and his sons’ inheritance: [[Ezek. 46:1–18]].
  - The law’s calendar of feasts and its offerings, to set beside verses 18–25: [[Lev. 23]] and [[Num. 28:16–29:38]].
  - The Day of Atonement, when the holy place was cleansed under the law: [[Lev. 16]].
  - Naboth’s vineyard, a king taking a man’s inheritance: [[1 Kgs. 21:1–19]].
  - The altar’s consecration, where the question of sacrifice in this temple is taken up: [[Ezek. 43:18–27]].
  - Honest weights in the law and in Proverbs: [[Lev. 19:35–37]] and [[Prov. 11:1]].

