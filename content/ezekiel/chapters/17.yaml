chapter: 17
title: 'Two Eagles, a Vine, and a Tender Twig'
tagline: 'A riddle about an eagle, a cedar, and a vine turns out to be the story of King Zedekiah’s broken oath to Babylon. Then the Lord says that He will plant a twig of His own, and that it will become a cedar for every bird.'
when: 'No date of its own. The chapter stands between the book’s second date, “the sixth year, in the sixth month” (8:1) of Jehoiachin’s captivity, about 591 B.C., and its third, the seventh year (20:1); the siege it foresees begins in the ninth year (24:1).'

setting: |
  Ezekiel is “among the captives” in Babylon ([[Ezek. 1:1]]), and Jerusalem is still standing. The chapter falls between the sixth year of the captivity ([[Ezek. 8:1]]) and the seventh ([[Ezek. 20:1]]), about 591 B.C.

  The riddle is about events its hearers had lived through. When Nebuchadnezzar carried Jehoiachin to Babylon, Ezekiel was among the captives taken with him, and the king of Babylon “made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah” ([[2 Kgs. 24:17]]). Zedekiah, the last king of Judah, held his throne on an oath to Nebuchadnezzar, “who had made him swear by God” ([[2 Chr. 36:13]]). Then he “rebelled against the king of Babylon” ([[2 Kgs. 24:20]]), sending to Egypt for horses and soldiers (verse 15). In Jerusalem Jeremiah was telling him, “Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live” ([[Jer. 27:12]]). The siege begins in the ninth year ([[Ezek. 24:1]]).

  The chapter follows the long allegory of Jerusalem as an unfaithful wife ([[Ezek. 16]]).

thread: |
  The chapter has three parts: a riddle (verses 1–10), its explanation (11–21), and a promise (22–24). Planting runs through all three. An eagle crops the top of a cedar and carries it away, then plants a seed that grows into a low vine. The vine has soil and water enough, but it stretches toward a second eagle, and the Lord asks, “Shall it prosper?”

  The explanation names the main figures. The first eagle is the king of Babylon, the cedar top is the king he took from Jerusalem, the vine is the kingdom he left behind under oath, and the second eagle is the king of Egypt. The question asked about the vine is asked again about the king: “Shall he prosper? shall he escape that doeth such things?”

  The center of the chapter is the oath. Zedekiah swore it to Nebuchadnezzar, and in verse 19 the Lord calls it “mine oath” and “my covenant.” The broken word is why the king will die in Babylon.

  Then the Lord takes the eagle’s part Himself: “I will also take of the highest branch of the high cedar.” His planting is set on a mountain in Israel, and it is to “bear fruit, and be a goodly cedar,” as the vine was planted to “bear fruit” and “be a goodly vine” (verse 8). The chapter that began with a king who did not keep his word ends, “I the LORD have spoken and have done it.”

sections:
  - range: 1-6
    heading: 'The eagle, the cedar, and the vine'
    plain: |
      The word of the Lord comes to Ezekiel: put a riddle to the house of Israel and tell them a parable. A great eagle with great wings, long feathers, and plumage of many colours came to Lebanon and took the top of the cedar. He broke off its topmost young twig, carried it to a land of trade, and set it in a city of merchants. Then he took some of the seed of the land and planted it in a fertile field beside plentiful water, setting it like a willow. It grew into a spreading vine, low to the ground, with its branches turned toward the eagle and its roots under him. So it became a vine and put out branches and shoots.
  - range: 7-10
    heading: 'The second eagle'
    plain: |
      There was another great eagle with great wings and many feathers. The vine bent its roots toward him and stretched its branches toward him, so that he would water it from the bed where it was planted. Yet it had been planted in good soil by plentiful water, where it could grow branches, bear fruit, and be a fine vine. The Lord God says: Will it prosper? Will its roots not be pulled up and its fruit cut off, so that it withers? All its fresh leaves will wither, and it will take no great strength and no large force to pull it up by the roots. It is planted, but will it prosper? When the east wind touches it, it will wither completely, in the bed where it grew.
  - range: 11-15
    heading: 'What the riddle means'
    plain: |
      The word of the Lord comes again: Say to the rebellious house, Do you not know what these things mean? The king of Babylon came to Jerusalem, took its king and its princes, and brought them to Babylon. He took one of the royal family, made a covenant with him, and put him under oath. He also took away the leading men of the land, so that the kingdom would be lowly and not lift itself up, and would stand by keeping his covenant. But the new king rebelled, sending envoys to Egypt to get horses and a large army. Will he prosper? Can a man who does this escape? Can he break the covenant and get away?
  - range: 16-21
    heading: 'The broken oath'
    plain: |
      As I live, says the Lord God, he will die in Babylon, in the country of the king who made him king, whose oath he despised and whose covenant he broke. Pharaoh with his great army will not help him in the war, when siege mounds and siege walls are built to cut off many lives. He despised the oath and broke the covenant after giving his hand on it, and he will not escape. So the Lord God says: As I live, it is My oath that he despised and My covenant that he broke, and I will bring it down on his own head. I will spread My net over him and he will be caught in My snare. I will bring him to Babylon and enter into judgment with him there for his treachery against Me. His fugitives and all his troops will fall by the sword, and the survivors will be scattered to every wind. And you will know that I, the Lord, have spoken it.
  - range: 22-24
    heading: 'The Lord’s own planting'
    plain: |
      The Lord God says: I Myself will take a sprig from the top of the high cedar and set it out. From its topmost young twigs I will break off a tender one, and I will plant it on a high and lofty mountain, the mountain height of Israel. It will put out boughs, bear fruit, and become a splendid cedar. Birds of every kind will live under it, in the shade of its branches. And all the trees of the field will know that I, the Lord, have brought down the high tree and raised the low tree, dried up the green tree and made the dry tree flourish. I the Lord have spoken, and I have done it.

notes:
  - ref: 2
    phrase: 'put forth a riddle, and speak a parable'
    kind: words
    title: 'A riddle and a parable'
    body: |
      “Riddle” and “parable” name one speech from two sides: it is a comparison, and its meaning is not on the surface. “Riddle” is the Hebrew *chidah*, a “dark, obscure utterance,” used “of something put indirectly and needing interpretation,” and this verse is classed under it as “an allegory.” “Parable” is *mashal*, here in its sense of “similitude, parable.” One modern translation has “propound a riddle and speak an allegory.”

      What sets this riddle apart is that the Lord supplies the answer. Later in the book Ezekiel reports the complaint his hearers made about him, “Doth he not speak parables?” ([[Ezek. 20:49]]). Here a second word of the Lord follows at once: “Know ye not what these things mean? tell them” (verse 12), and verses 12–21 go through the story piece by piece.
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 3
    phrase: 'A great eagle with great wings'
    kind: symbol
    title: 'The eagle, Lebanon, and the cedar'
    body: |
      The first eagle is Nebuchadnezzar, whom the chapter itself names by his title: “the king of Babylon is come to Jerusalem, and hath taken the king thereof” (verse 12). Jeremiah used the same figure for the same conqueror: “he shall fly as an eagle, and shall spread his wings over Moab” ([[Jer. 48:40]]). The eagle’s feathers of “divers colours” have been taken to “point to the many peoples, differing in language, manners, and customs,” gathered under his rule.

      Lebanon in the riddle has been explained as a name for Jerusalem and not the mountain range to the north. The eagle comes to Jerusalem, a city “with its royal palace so rich in cedar wood.” Jeremiah speaks to the royal house the same way: “O inhabitant of Lebanon, that makest thy nest in the cedars” ([[Jer. 22:23]]).

      “The cedar is the royal house of David, and the top of it is King Jehoiachin.” He had “reigned in Jerusalem three months” ([[2 Kgs. 24:8]]) when Nebuchadnezzar “carried away Jehoiachin to Babylon” ([[2 Kgs. 24:15]]). On this reading the riddle refers to “the King of Babylon, in the first place, as the eagle, and how he carried off the king of Judah, Jehoiachin, into Babylon.”
    sources: [keil-ezekiel, sc-knowhy-440, lds-scriptures]

  - ref: 4
    phrase: 'a land of traffick'
    kind: words
    title: 'A land of merchants: Babylon'
    body: |
      The Hebrew behind “a land of traffick” is *erets kena‘an*, “the land of Canaan,” and the place it stands for in the riddle is Babylon. *Kena‘an* is also a common noun for “merchant (s) (because Canaanites, especially Phoenicians, were traders),” and this verse is listed under that sense as “a land of merchants.” Modern translations have “a land of trade.” The ancient Greek translation kept the name instead, and has the twigs brought “into the land of Chanaan.”

      The second half of the line shows which sense is meant, “a city of merchants,” and verse 12 names the place: the king and princes were “led … to Babylon.” Ezekiel had used the phrase in the chapter before, “in the land of Canaan unto Chaldea” (see the note on [[Ezek. 16:26]]).
    sources: [bdb, oshb-wlc, lxx-rahlfs, esv, lds-scriptures]

  - ref: 6
    phrase: 'a spreading vine of low stature'
    kind: symbol
    title: 'A vine kept low'
    body: |
      The second planting is Zedekiah’s kingdom, and it was low by design. Verses 13–14 give the key. The “king’s seed” is the uncle whom Nebuchadnezzar “made … king in his stead” ([[2 Kgs. 24:17]]). The “mighty of the land” had been taken away, as Kings also says: “the mighty of the land, those carried he into captivity from Jerusalem to Babylon” ([[2 Kgs. 24:15]]). The purpose is stated: “That the kingdom might be base, that it might not lift itself up.”

      “Base” here is not a moral word. The Hebrew is *shaphal*, “low,” the adjective used of the vine in verse 6, where it is translated “of low stature.” In verse 14 it describes “a modest, unambitious kingdom,” and modern translations say “humble.” The word comes once more in the last verse of the chapter, for the “low tree” that the Lord exalts (see the note on [[Ezek. 17:24]]).

      The riddle is careful to say that the vine lacked nothing. It had “a fruitful field” and “great waters” (verse 5) and “a good soil” (verse 8). The word translated “willow tree” is glossed “a kind of willow,” and one modern translation marks verse 5, “Meaning of Heb uncertain.” The sense of the whole is clear from verse 14: a low kingdom could “stand” by keeping the covenant. Jeremiah was saying this to Zedekiah in so many words. Nations that accepted Babylon’s yoke would “remain still in their own land” ([[Jer. 27:11]]), and to the king he said, “serve him and his people, and live” ([[Jer. 27:12]]).
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 15
    phrase: 'in sending his ambassadors into Egypt'
    kind: history
    title: 'Horses from Egypt'
    body: |
      The second eagle is the king of Egypt, and what Zedekiah wanted from him was an army. In the riddle the vine bends toward the second eagle “that he might water it” (verse 7). The explanation gives the fact behind the figure: envoys went to Egypt “that they might give him horses and much people.” Kings says that Zedekiah “rebelled against the king of Babylon” ([[2 Kgs. 24:20]]); Ezekiel says how. Jeremiah names “Pharaoh-hophra king of Egypt” beside “Zedekiah king of Judah” ([[Jer. 44:30]]).

      Asking Egypt for horses had a history in Israel. The law for a future king said, “he shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he should multiply horses” ([[Deut. 17:16]]). Isaiah had warned an earlier generation, “Woe to them that go down to Egypt for help; and stay on horses” ([[Isa. 31:1]]). Horses were what Egypt “abounded” in, and they were “forbidden to Israel to seek from Egypt.” Zedekiah’s embassy broke his oath to Babylon, and it also went back to a place the Lord had told Israel’s kings to leave alone.

      Verse 17 says how the alliance will end: Pharaoh will not “make for him,” that is, help him, when the siege works go up. Jeremiah records what happened. During the siege “Pharaoh’s army was come forth out of Egypt,” and the Chaldeans “departed from Jerusalem” ([[Jer. 37:5]]). Jeremiah’s word to the king was, “Pharaoh’s army, which is come forth to help you, shall return to Egypt into their own land” ([[Jer. 37:7]]). The Egyptian army gave the city no lasting help.
    sources: [lds-scriptures, keil-ezekiel, jfb-ezekiel]

  - ref: 19
    phrase: 'mine oath that he hath despised'
    kind: scripture
    title: 'An oath to Nebuchadnezzar that the Lord calls His own'
    body: |
      The Lord treats a broken treaty with a foreign king as an offense against Himself. In verse 16 the oath and the covenant belong to Nebuchadnezzar: “whose oath he despised, and whose covenant he brake.” Three verses later the same oath is “mine oath” and the same covenant “my covenant.”

      Chronicles records how the oath was taken: Nebuchadnezzar “had made him swear by God” ([[2 Chr. 36:13]]). One explanation starts there. The oath “had been sworn by Jehovah,” so the breaking of it “became a breach of faith towards Jehovah.” Verse 18 adds that “he had given his hand,” a gesture made “as a pledge of fidelity.”

      A second reason has been given. The Lord had “delivered up His people and kingdom into the power of Nebuchadnezzar,” as He said through Jeremiah: “now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant” ([[Jer. 27:6]]). Seen that way, “revolt from him really became rebellion against God.”

      The wording joins the king to his city. In the chapter before, Jerusalem is told, “thou hast done, which hast despised the oath in breaking the covenant” ([[Ezek. 16:59]]). That was said of the city’s unfaithfulness to the Lord. Here “the very same expressions” are used of Zedekiah’s oath to Babylon, and the king’s act is named a “trespass that he hath trespassed against me” (verse 20), which a modern translation renders “the treachery he has committed against me.”
    sources: [keil-ezekiel, esv, lds-scriptures]

  - ref: 20
    phrase: 'I will spread my net upon him'
    kind: scripture
    title: 'The net, a second time'
    body: |
      The Lord’s word that He will spread His net over Zedekiah repeats one from chapter 12, and the histories record how it was kept. There the Lord said of “the prince in Jerusalem” ([[Ezek. 12:10]]), “My net also will I spread upon him, and he shall be taken in my snare: and I will bring him to Babylon” ([[Ezek. 12:13]]). In chapter 12 the sentence went on to say that he would not see the land. Here it goes on to say what the Lord will do with him there: “plead with him,” which is the language of a court, “enter into judgment with him there.”

      When the city fell, the Chaldean army “overtook him in the plains of Jericho: and all his army were scattered from him” ([[2 Kgs. 25:5]]), as verse 21 says of his troops. He was blinded, bound, and “carried … to Babylon” ([[2 Kgs. 25:7]]), and the king of Babylon “put him in prison till the day of his death” ([[Jer. 52:11]]). Verse 16 had said it under oath: “in the midst of Babylon he shall die.” The note on [[Ezek. 12:13]] sets the prophecy beside the event more fully.
    sources: [lds-scriptures, esv]

  - ref: 22
    phrase: 'a tender one'
    kind: christ
    title: 'The tender twig'
    body: |
      In the last three verses the Lord does what the eagle did, and the twig He plants has been read as the Messiah. Verse 22 answers verses 3–4 phrase by phrase: the highest branch of the cedar, the top of its young twigs, the cropping, the setting. The Hebrew adds the pronoun “I” to the verbs “for the sake of emphasis,” and modern translations bring it out: “I myself will take … I myself will plant.” The eagle’s twig went to a city of merchants. This one is planted “in the mountain of the height of Israel.”

      Since the cedar is the house of David (see the note on [[Ezek. 17:3]]), the twig is a son of that house. One reading is that the Lord “is likely referring to the Messiah of the House of David, whom He himself would plant and cause to bear fruit for Israel.” An older reading is firmer and takes the shoot to be “the Messiah Himself,” with “tender” pointing to “the lowliness of His origin.” Both come from scholarship and not from the Church’s own helps, whose footnotes on this verse point to Mulek and to the scattering of Israel (see the next note).

      Isaiah is compared for the lowly beginning. He saw the Lord’s servant “grow up before him as a tender plant, and as a root out of a dry ground” ([[Isa. 53:2]]). Isaiah’s word there is *yoneq*, a “young plant, sapling,” and Ezekiel’s is its feminine form *yoneqet*, a “young shoot, twig.” Isaiah’s “rod out of the stem of Jesse” ([[Isa. 11:1]]) is compared with it.

      The twig becomes “a goodly cedar,” and “all fowl of every wing” live under it. The birds have been explained as “men from every kind of people and tribe.” The Savior’s parable of the mustard seed has been set beside this verse: the least of seeds “becometh a tree, so that the birds of the air come and lodge in the branches thereof” ([[Matt. 13:32]]). The same is said of two empires, which have been read as the opposite of this tree: the Assyrian cedar in whose boughs “all the fowls of heaven made their nests” ([[Ezek. 31:6]]), and the tree of Nebuchadnezzar’s dream, where “the fowls of the heaven dwelt in the boughs thereof” ([[Dan. 4:12]]).
    sources: [sc-knowhy-440, keil-ezekiel, jfb-ezekiel, bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 22
    phrase: 'will plant it upon an high mountain and eminent'
    kind: scripture
    title: 'Mulek, and branches planted elsewhere'
    body: |
      The Church’s footnotes join these verses to the Book of Mormon’s account of Mulek, a son of Zedekiah, and an early apostle taught that they were fulfilled in him. The people of Zarahemla “came out from Jerusalem at the time that Zedekiah, king of Judah, was carried away captive into Babylon” ([[Omni 1:15]]); Zarahemla “was a descendant of Mulek” ([[Mosiah 25:2]]); and Nephi the son of Helaman asks, “Will ye say that the sons of Zedekiah were not slain, all except it were Mulek?” ([[Hel. 8:21]]). The Bible reports only that Zedekiah’s sons were killed before his eyes ([[2 Kgs. 25:7]]); the Book of Mormon “clarifies that Mulek survived.”

      Elder Orson Pratt taught that the bringing of Mulek and his company “over the ocean” was “in fulfillment of the 22nd and 23rd verses of the seventeenth chapter of Ezekiel.” In his reading the “tender one” is one of Zedekiah’s sons, whom the Lord “planted” in America. The Church’s heading to the chapter does not name the twig. It says that the Lord will bring forth the goodly tree “in the last days.”

      Zenos’s allegory is another parable of branches. In it the lord of the vineyard says, “I take away many of these young and tender branches, and I will graft them whithersoever I will” ([[Jacob 5:8]]), and later finds that such a branch has borne fruit ([[Jacob 5:24]]). Ezekiel’s figures are “very similar to Zenos’s,” and it has been suggested that he is “possibly drawing on the writings of Zenos.” Zenos speaks “not only of the king of Judah or the royal family in Jerusalem” but of other portions of Israel taken away and scattered.
    sources: [lds-scriptures, ot-manual-26, gs-mulek, sc-knowhy-440]

  - ref: 24
    phrase: 'have exalted the low tree'
    kind: scripture
    title: 'High tree and low tree'
    body: |
      The closing verse turns the story of one king into a statement of how the Lord deals with kingdoms. It has four reversals: the high tree brought down, the low exalted, the green dried up, the dry made to flourish. “Low” is the word that has followed the vine through the chapter. The same adjective describes the vine in verse 6, the kingdom in verse 14, and the tree here. In verse 14 Nebuchadnezzar made a kingdom low in order to hold it. Here the Lord says that both the lowering and the raising are His.

      Ezekiel uses the same Hebrew word a few chapters on, where the crown is taken off: “exalt him that is low, and abase him that is high” ([[Ezek. 21:26]]). The rule is stated elsewhere in scripture too. Isaiah’s words in the Book of Mormon are, “the high ones of stature shall be hewn down, and the haughty shall be humbled” ([[2 Ne. 20:33]]), and a latter-day revelation says, “by thy word many high ones shall be brought low, and by thy word many low ones shall be exalted” ([[D&C 112:8]]).

      In the riddle’s own terms it is “all the trees of the field” who are to know this. Verse 21 said “ye shall know that I the LORD have spoken it” to Ezekiel’s hearers (on the book’s refrain, see the note on [[Ezek. 6:7]]). The last verse says it of every tree.
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

christ: |
  The twig of the last three verses has been read as the Messiah (see the note on [[Ezek. 17:22]]). It is promised when the house of David has just failed in its last reigning king: the cedar’s top is in Babylon, and the vine that replaced it is about to be torn up. The promise has been read as the Lord’s refusal to let His kingdom end with Zedekiah: He “would fulfil the promise which He had given to the seed of David.”

  The last verse speaks of the low exalted and the high brought down. Ezekiel has the same pair again with the command, “Remove the diadem, and take off the crown” ([[Ezek. 21:26]]), and there he adds how long that will last: “until he come whose right it is; and I will give it him” ([[Ezek. 21:27]]).

explore: |
  - The history behind the riddle: [[2 Kgs. 24:10–20]] and [[2 Kgs. 25:1–7]]; [[2 Chr. 36:11–13]].
  - Jeremiah’s counsel to the same king in the same years: [[Jer. 27:1–15]] and [[Jer. 37:5–10]].
  - Ezekiel’s other parables of the vine: Jerusalem as vine wood fit only for burning ([[Ezek. 15]]), and the vine whose fruit the east wind dried up ([[Ezek. 19:10–14]]).
  - The tender plant and the rod from the stem of Jesse: [[Isa. 53:2]]; [[Isa. 11:1–5]].
  - Mulek and the people of Zarahemla: [[Omni 1:14–17]]; [[Hel. 8:21]].
  - Zenos’s young and tender branches: [[Jacob 5:3–8]] and [[Jacob 5:19–25]].
  - The crown removed “until he come whose right it is”: [[Ezek. 21:25–27]].

