chapter: 43
title: 'The Glory Returns'
tagline: 'The glory that left Jerusalem by the east comes back the same way and fills the house. The Lord calls it the place of His throne, has Ezekiel show the house to Israel, and gives the measures of the altar and the seven days that make it ready.'
when: 'No date of its own. The chapter belongs to the vision dated at 40:1, “the five and twentieth year of our captivity… the fourteenth year after that the city was smitten”.'

setting: |
  Ezekiel is still inside the vision that opens at [[Ezek. 40:1]]. He has been set on “a very high mountain” in the land of Israel ([[Ezek. 40:2]]) and led through a temple by a man with a measuring reed. What that temple is, and when it is looked for, is taken up at [[Ezek. 40]].

  Three chapters of measuring have just ended ([[Ezek. 42:15–20]]). So far the vision has been walls, gates, courts, and rooms, with the guide measuring and Ezekiel watching. In this chapter the glory enters, and after it come the ordinances of the altar, the duties of the priests and Levites, and the rules for offerings and feasts, which fill chapters 43–46.

  The chapter also closes something the book opened long before. In the vision dated to the sixth year ([[Ezek. 8:1]]), nineteen years earlier by the book’s own count, Ezekiel watched the glory of the Lord go out of the temple and the city toward the east. Here he is brought to the east gate again.

thread: |
  The chapter moves in one line: **the Lord comes into the house, says what the house is, and then gives the altar at which His people will be accepted.**

  First the presence. The glory arrives from the east, enters by the east gate, and fills the house (verses 1–5). Then the claim. A voice from inside calls the house “the place of my throne” and says what had defiled the old one (verses 6–9). Then the commission. Ezekiel is to show the house to Israel so that they will be ashamed, and to write its plan and laws for those who are (verses 10–12). Last comes the altar: its measures (verses 13–17) and the seven days of offerings that cleanse it (verses 18–27).

  Two sentences are said twice. “I will dwell in the midst of them for ever” stands in verse 7 and again in verse 9, on either side of the charge against the kings. “This is the law of the house” opens and closes verse 12.

  Notice the order. The glory fills the house before a single offering is made on its altar; the cleansing and the sacrifices come afterward. And the chapter that begins with the Lord coming in ends with a promise about the people: “I will accept you.”

sections:
  - range: 1-5
    heading: 'The glory comes from the east'
    plain: |
      Then he brought me to the gate that faces east. And the glory of the God of Israel came from the east. His voice was like the noise of many waters, and the earth shone with His glory. What I saw was like the vision I saw when I came to destroy the city, and like the vision I saw by the river Chebar, and I fell on my face. The glory of the Lord came into the house through the gate that faces east. The spirit lifted me up and brought me into the inner court, and the glory of the Lord filled the house.
  - range: 6-9
    heading: 'The place of my throne'
    plain: |
      I heard someone speaking to me from the house, while the man stood beside me. He said: “Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell among the children of Israel for ever. The house of Israel will no longer defile my holy name, neither they nor their kings, by their whoredom or by the carcases of their kings in their high places. They set their threshold by my thresholds and their doorpost by my doorposts, with the wall between me and them, and they defiled my holy name by the abominations they committed, so I consumed them in my anger. Now let them put their whoredom and the carcases of their kings far from me, and I will dwell among them for ever.”
  - range: 10-12
    heading: 'Show the house to the house of Israel'
    plain: |
      “Son of man, show the house to the house of Israel, so that they may be ashamed of their iniquities, and let them measure the pattern. If they are ashamed of all they have done, show them the form of the house and its arrangement, its exits and its entrances, all its forms, all its ordinances, and all its laws. Write it where they can see it, so that they may keep its whole form and all its ordinances and do them. This is the law of the house: on the top of the mountain its whole limit all around shall be most holy. This is the law of the house.”
  - range: 13-17
    heading: 'The measures of the altar'
    plain: |
      These are the measures of the altar in cubits, the cubit being a cubit and a hand breadth. The bottom is a cubit, and the breadth a cubit, with a border of a span around its edge. From the bottom on the ground to the lower ledge is two cubits, and the breadth one cubit; from the lesser ledge to the greater ledge is four cubits, and the breadth one cubit. The altar is four cubits, and four horns rise from it. The altar is twelve cubits long and twelve broad, a square. The ledge is fourteen cubits long and fourteen broad, with a border of half a cubit around it and a bottom of a cubit all around. Its stairs face east.
  - range: 18-27
    heading: 'Seven days to cleanse the altar'
    plain: |
      He said to me: “Son of man, thus saith the Lord GOD: These are the ordinances of the altar on the day it is made, for offering burnt offerings on it and sprinkling blood on it. You are to give the priests, the Levites of the seed of Zadok who come near to minister to me, a young bullock for a sin offering. Take some of its blood and put it on the four horns, on the four corners of the ledge, and on the border all around; so you will cleanse and purge it. The bullock of the sin offering is to be burned in the appointed place of the house, outside the sanctuary. On the second day offer a kid of the goats without blemish for a sin offering, and they shall cleanse the altar as they did with the bullock. When the cleansing is finished, offer a young bullock and a ram without blemish. Bring them before the Lord; the priests shall cast salt on them and offer them as a burnt offering. For seven days prepare a goat every day for a sin offering, and a young bullock and a ram without blemish. For seven days they shall purge the altar and purify it, and they shall consecrate themselves. When those days are over, from the eighth day onward the priests shall offer your burnt offerings and your peace offerings on the altar, and I will accept you, saith the Lord GOD.”

notes:
  - ref: 2
    phrase: 'the glory of the God of Israel came from the way of the east'
    kind: scripture
    title: 'Back by the way it left'
    body: |
      The glory comes from the east because that is the way it went out. In the vision of the sixth year it moved from the house to the east gate and then stood on the mountain east of the city; the note on [[Ezek. 11:23]] follows the stages. Its return has been read as “signifying that this temple is once again an acceptable place for Jehovah’s presence to dwell.” Ezekiel himself joins the two visions in verse 3.

      It then “filled the house,” which is what scripture says of the tabernacle and of Solomon’s temple on the days they were finished (see the note on [[Ezek. 10:4]]).

      East was also the way in: entering the ancient temple “was a movement from east to west.” In the next chapter Ezekiel finds this gate shut and is told why: “because the LORD, the God of Israel, hath entered in by it, therefore it shall be shut” ([[Ezek. 44:2]]).
    sources: [shannon-location, bdb, lds-scriptures]

  - ref: 2
    phrase: 'his voice was like a noise of many waters'
    kind: scripture
    title: 'The sound of many waters'
    body: |
      The Hebrew word here means both “sound” and “voice,” and the King James translators chose “voice.” Some modern translations take it as the noise of the approach: “the sound of his coming was like the sound of many waters.” That fits the first vision, where the noise was of the creatures’ wings, “like the noise of great waters, as the voice of the Almighty” ([[Ezek. 1:24]]).

      Latter-day scripture uses the comparison of the Lord’s own voice, and the Church’s edition ties that verse to this one. When Joseph Smith and Oliver Cowdery saw Him in the temple at Kirtland on April 3, 1836, “his voice was as the sound of the rushing of great waters” ([[D&C 110:3]]).

      Ezekiel’s vision stands in a line of such occasions: the glory of the Lord “has filled all of the temples that have been built in His name and by His authority.”
    sources: [bdb, esv, ot-manual-27, lds-scriptures]

  - ref: 3
    phrase: 'when I came to destroy the city'
    kind: words
    title: 'Ezekiel did not destroy the city'
    body: |
      “When I came to destroy the city” refers to the vision of chapters 8–11, in which Ezekiel was brought to Jerusalem and watched its destroyers sent out; he destroyed nothing himself. There the Lord summoned “them that have charge over the city,” each “with his destroying weapon in his hand” ([[Ezek. 9:1]]), and Ezekiel cried out, “wilt thou destroy all the residue of Israel?” ([[Ezek. 9:8]]). “Destroy” in that cry is the Hebrew verb used here.

      The Hebrew text has “I came.” Some Hebrew manuscripts and the Latin Vulgate read “he came,” so that the Lord is the one who came to destroy, and some modern translations follow them: “when he came to destroy the city.” If “I” is kept, the wording has a counterpart in Jeremiah’s commission, which one modern translation sets beside this verse: he was set over nations “to root out, and to pull down, and to destroy” ([[Jer. 1:10]]). The ancient Greek translation goes another way altogether: “when I went in to anoint the city.”

      Whichever is right, the verse joins this vision to the two before it. What Ezekiel sees is what he saw leave Jerusalem and what he saw by the Chebar, and he does what he did then: “I fell upon my face” ([[Ezek. 1:28]]).
    sources: [oshb-wlc, esv, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 6
    phrase: 'I heard him speaking unto me out of the house'
    kind: words
    title: 'A voice from the house, and the man beside him'
    body: |
      Two figures are in this verse, and the one who speaks from the house is the Lord. The Hebrew has no “him”: Ezekiel hears “one speaking” to him from inside, while “the man” stands at his side. The man is the guide with the measuring reed who has led him since chapter 40, probably a messenger and not the Lord Himself (see the note on [[Ezek. 40:3]]). The voice speaks of “my throne” and “my holy name” and says “I will dwell,” and its second speech is marked “thus saith the Lord GOD” (verse 18).

      For three chapters the guide has measured, with a few words of explanation ([[Ezek. 40:45–46]]; [[Ezek. 41:4]]; [[Ezek. 42:13–14]]). In this chapter the law of the house is given by the voice.
    sources: [oshb-wlc, esv, ot-manual-27, lds-scriptures]

  - ref: 7
    phrase: 'the place of my throne, and the place of the soles of my feet'
    kind: symbol
    title: 'Throne and footstool, and no ark'
    body: |
      The Lord calls the house itself His throne and the place of His feet, names that had belonged to the ark. The mercy seat that covered the ark “was regarded as the earthly dwelling place of Jehovah,” and David spoke of building “an house of rest for the ark of the covenant of the LORD, and for the footstool of our God” ([[1 Chr. 28:2]]).

      In the temple Ezekiel is shown, no ark is mentioned; the note on [[Ezek. 41:4]] takes up its absence.

      “I will dwell” is the verb of the first command to build a sanctuary: “let them make me a sanctuary; that I may dwell among them” ([[Ex. 25:8]]). What is added is “for ever,” in verse 7 and again in verse 9. The tabernacle and Solomon’s temple were also the Lord’s dwelling, “though not for ever.” The promise had been given six chapters back, “I… will set my sanctuary in the midst of them for evermore” ([[Ezek. 37:26]]); here Ezekiel hears it from inside the house.
    sources: [bd-ark-of-the-covenant, keil-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: 'the carcases of their kings in their high places'
    kind: words
    title: 'What the “carcases of their kings” were'
    body: |
      What “the carcases of their kings” were is not agreed. The Hebrew word is the ordinary one for a “corpse, carcass,” and the phrase has been read three ways.

      *Royal graves.* Taken literally, kings were buried too near the temple: “the dead bodies of their kings at their high places.” Against this it is objected that “not a single instance can be adduced of the burial of a king in the vicinity of the temple.”

      *Rites for dead kings.* The Hebrew letters of “in their high places” can also be read “at their deaths,” and some translations then understand offerings made for the dead: “the funeral offerings for their kings at their death,” or “sacrificing to their kings at their death.”

      *Idols.* The law had already used this word for lifeless gods, “the carcases of your idols” ([[Lev. 26:30]]), where the lexicon marks it as “figurative of idols,” and Ezekiel echoed that verse earlier (see the note on [[Ezek. 6:5]]). On this reading “the corpses of the kings are therefore the dead idols, for which the kings (for example, Manasseh) had built altars or high places” in the temple itself. Kings records it: Manasseh “built altars for all the host of heaven in the two courts of the house of the LORD” ([[2 Kgs. 21:5]]).

      Verse 8 says how close it came: threshold against threshold, doorpost by doorpost, and only a wall “between me and them.” On the third reading the wall stood “between Jehovah and the carcase-gods.” The remedy in verse 9 is distance: “far from me.”
    sources: [bdb, oshb-wlc, esv, niv, nrsvue, keil-ezekiel, lds-scriptures]

  - ref: 10
    phrase: 'that they may be ashamed of their iniquities'
    kind: history
    title: 'Why a plan should make them ashamed'
    body: |
      Ezekiel is told to describe the temple to the exiles so that seeing it will make them ashamed. The same purpose has been given for the vision as a whole: to wake Israel to how far they had fallen and what glory they had lost (see the note on [[Ezek. 40:4]]).

      In “let them measure the pattern,” the word for “pattern” means “measurement, proportion,” and one translation has “Let them consider its perfection.”

      Verse 11 then makes the fuller teaching conditional. “If they be ashamed of all that they have done,” Ezekiel is to show them the form of the house, its ways in and out, its ordinances and its laws, and to write it down “in their sight, that they may keep” it.
    sources: [ot-manual-27, bdb, oshb-wlc, niv]

  - ref: 12
    phrase: 'the whole limit thereof round about shall be most holy'
    kind: words
    title: 'The whole mountaintop most holy'
    body: |
      The one law that sums up the house is that everything on the mountaintop is “most holy,” a name that had belonged to a single room. In the tabernacle the veil divided “between the holy place and the most holy” ([[Ex. 26:33]]), and the guide has just used the name for the inner room of this temple: “This is the most holy place” ([[Ezek. 41:4]]). Here it is spread over “the whole limit thereof round about.” Not only the inner room and not only the house but “also the whole of its surroundings (all its courts), are to be most holy,” and by this “the new sanctuary is to be distinguished from the earlier one.”

      The sentence is framed, before and after, by “This is the law of the house.” It gathers up what the measuring showed, down to the outer wall built “to make a separation between the sanctuary and the profane place” (see the note on [[Ezek. 42:20]]). It also answers verses 7–9: the promise that the house will not be profaned again “is compressed into this clause.”
    sources: [oshb-wlc, keil-ezekiel, lds-scriptures]

  - ref: 15
    phrase: 'So the altar shall be four cubits'
    kind: words
    title: 'A stepped altar, called the hearth of God'
    body: |
      The altar is a stepped block, and Ezekiel has unusual names for its parts. From a base at the ground it rises in stages, each narrower than the one below: a lower “settle,” a greater settle, and on top the hearth where the fire burns, twelve cubits square, with four horns rising from it. A settle is a “ledge surrounding” the altar. The cubit is the long one used through the vision ([[Ezek. 40:5]]), which makes the hearth “about 21 feet” on a side. The “bottom” of verse 13 is literally a bosom, the “hollow bottom of altar”; one translation makes it a gutter.

      The word behind “altar” in verses 15 and 16 is *’ari’el*, “hearth, altar-hearth”; its first appearance in verse 15 is spelled differently and is treated as another form of the same word. Its parts have been explained as “hearth of El,” that is, of God. Isaiah gives Jerusalem this name, “Woe to Ariel, to Ariel, the city where David dwelt!” ([[Isa. 29:1]]), and the note there discusses it.

      The last detail is the stairs: “his stairs shall look toward the east.” The law at Sinai had said, “Neither shalt thou go up by steps unto mine altar” ([[Ex. 20:26]]), and the Hebrew word for steps is the same. One reading of Exodus takes it to forbid climbing upon the altar, since the preposition there “could be rendered as upon.” Ezekiel’s text does not comment on the difference.
    sources: [bdb, oshb-wlc, niv, sc-knowhy-716, lds-scriptures]

  - ref: 18
    phrase: 'to offer burnt offerings thereon, and to sprinkle blood thereon'
    kind: prophets
    title: 'Sacrifice in a temple still to be built'
    body: |
      Latter-day prophets have taught that sacrifice by the sons of Levi will be restored for a time as part of the restoration of all things, and that teaching has been applied to the altar of these verses. From Adam on, sacrifices were offered “in a similitude of the sacrifice that would be made of the Only Begotten Son of God,” and His death “ended the shedding of blood as a gospel ordinance.” Yet this temple, which has not been built, has an altar for burnt offerings.

      Joseph Smith taught that “the offering of sacrifice… shall be continued at the last time,” because every ordinance the priesthood has been given in any dispensation “shall all be had in the last dispensation.” He did not mean the law of Moses with all its ceremonies, but sacrifice as it was before Moses. He named the conditions too: the temple built and the sons of Levi purified. The note on [[Mal. 3:3]] gives his words at more length, with the objection he raised against himself.

      Latter-day revelation speaks of such an offering. The Aaronic Priesthood will not be taken from the earth “until the sons of Levi do offer again an offering unto the Lord in righteousness” ([[D&C 13:1]]), and “the sons of Moses and also the sons of Aaron shall offer an acceptable offering and sacrifice in the house of the Lord” ([[D&C 84:31]]).

      President Joseph Fielding Smith’s words on temples still to be built have been applied to the one Ezekiel saw. He thought it “very likely” that such temples will have a place where the sons of Levi may make their offering, and he limited it: blood sacrifices “will be performed long enough to complete the fulness of the restoration in this dispensation. Afterwards sacrifice will be of some other character.” The Church’s sources read for this chapter say nothing more of how or for how long.

      Those who serve at this altar are “the priests the Levites that be of the seed of Zadok” (verse 19; see [[Ezek. 40:46]] and [[Ezek. 44:15]]).
    sources: [bd-sacrifices, jsp-history-c1-addenda-18, ot-manual-27, lds-scriptures]

  - ref: 26
    phrase: 'Seven days shall they purge the altar and purify it'
    kind: scripture
    title: 'The altar made ready as Moses made his'
    body: |
      The altar is made ready much as the altar of the tabernacle was. At Sinai the command ran, “Seven days thou shalt make an atonement for the altar, and sanctify it; and it shall be an altar most holy” ([[Ex. 29:37]]). Moses put the blood of the sin offering on its horns “and purified the altar” ([[Lev. 8:15]]), and the regular service began “on the eighth day” ([[Lev. 9:1]]). Ezekiel’s altar has seven days, blood on its horns, and an eighth day from which the priests offer.

      The commands are in the second person: “thou shalt give,” “thou shalt take,” “thou shalt offer.” “At the altar in the tabernacle Moses performed the whole act of consecration, as the mediator of the covenant.” Here the charge is given to Ezekiel “as a prophet,” the verbs pass to “they” for the priests, and it has been understood that he was to do it “through the medium of the priests.” Two more things differ from Sinai. Nothing is said of anointing the altar. And the priests are not consecrated with it: “the existence of the priesthood is presupposed, and only the altar is consecrated.”

      “Purge” in verses 20 and 26 is the Hebrew verb usually translated “make atonement.” With the sin offering and a thing as its object it “means ‘purge’ and nothing else”: the blood cleanses the place where the offerings will be made.

      “They shall consecrate themselves” is in Hebrew “fill its hand,” the expression used for installing a priest ([[Ex. 29:9]]). One modern translation refers it to the altar, “and so consecrate it,” and it has been explained as “providing it with sacrificial gifts.”

      The salt of verse 24 is the law’s: “with all thine offerings thou shalt offer salt,” which is called “the salt of the covenant of thy God” ([[Lev. 2:13]]).
    sources: [keil-ezekiel, milgrom-temple, bdb, esv, oshb-wlc, lds-scriptures]

  - ref: 27
    phrase: 'I will accept you'
    kind: words
    title: 'Accepted'
    body: |
      The chapter’s last words promise that the Lord will accept the people themselves. The Hebrew verb is used of God accepting a person who sacrifices, and its object here is “you,” not the offerings.

      The verb comes only three times in Ezekiel. The other two are in the promise that closes chapter 20, spoken to elders whose inquiry the Lord had just refused ([[Ezek. 20:3]]): “in mine holy mountain… there will I accept them,” and “I will accept you with your sweet savour, when I bring you out from the people” ([[Ezek. 20:40–41]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  The glory that enters the house is the presence of Jehovah (see the note on [[Ezek. 1:26]]). When He came to the temple at Kirtland, the voice like great waters (see the note on verse 2) is called “even the voice of Jehovah” ([[D&C 110:3]]), and He said who He is: “I am he who liveth, I am he who was slain; I am your advocate with the Father” ([[D&C 110:4]]).

  Compare “the way of the east” in verse 2 with the Savior’s words about His return: “as the lightning cometh out of the east, and shineth even unto the west; so shall also the coming of the Son of man be” ([[Matt. 24:27]]).

explore: |
  - The departure this chapter reverses: [[Ezek. 10:18–19]] and [[Ezek. 11:22–23]].
  - The glory filling the tabernacle and Solomon’s temple: [[Ex. 40:34–38]]; [[1 Kgs. 8:10–11]].
  - The Lord in the Kirtland Temple, and the condition on His glory resting on a house: [[D&C 110:1–10]]; [[D&C 97:15–17]].
  - The consecration of the first altar: [[Ex. 29:35–37]]; [[Lev. 8:14–15]]; [[Lev. 9:1]].
  - The offering of the sons of Levi: [[Mal. 3:3–4]]; [[D&C 13:1]]; [[D&C 84:31–32]]; [[D&C 128:24]].
  - Where the vision ends, with the city’s new name: [[Ezek. 48:35]].

parallels:
  - ref: Ezek. 10:18–19
    note: The glory leaves the house by the east gate.
  - ref: Ezek. 11:22–23
    note: The glory goes up from the city and stands on the mountain to the east.
  - ref: 1 Kgs. 8:10–11
    note: The glory fills Solomon’s temple.
  - ref: D&C 110:1–10
    note: The Lord appears in the Kirtland Temple with a voice like rushing waters and accepts the house.
  - ref: Ex. 29:36–37
    note: Seven days of atonement for the altar of the tabernacle.

