chapter: 34
title: 'I Will Feed My Flock'
tagline: 'The Lord charges the shepherds of Israel with feeding themselves, says He will search out the scattered sheep Himself, judges between the strong and the weak of the flock, and promises one shepherd, His servant David, and a covenant of peace.'
when: 'No date of its own. The chapter stands under the heading of 33:21, “the twelfth year of our captivity, in the tenth month,” when word came that Jerusalem had fallen (about 585 B.C., counting from the book’s first date).'

setting: |
  Word that Jerusalem had fallen reached the exiles in the twelfth year of the captivity ([[Ezek. 33:21]]), and this chapter stands under that date. Judah’s last king, Zedekiah, had seen his sons killed and had been blinded, and the Babylonians “bound him with fetters of brass, and carried him to Babylon” ([[2 Kgs. 25:7]]). A second large deportation, in 586 B.C., had followed the one that brought Ezekiel to Babylon.

  This chapter opens with a woe on the shepherds of Israel and closes with a covenant of peace.

  Jeremiah has the same oracle in short form, “in a tone very similar”: a woe on the pastors who scattered the flock, the Lord’s promise to gather it, and a king raised up to David ([[Jer. 23:1–6]]). Ezekiel gives each part more room and adds one of his own, a judgment among the sheep themselves.

  The promise of the one shepherd comes again in [[Ezek. 37:24]], and in the New Testament Jesus takes the shepherd’s title for Himself ([[John 10:11]]).

thread: |
  The chapter hangs on the question in verse 2: “should not the shepherds feed the flocks?” In Hebrew “shepherd” and “feed” are one root. That root comes thirty-one times in this chapter and once in all the rest of the book. A shepherd is one who feeds, and these shepherds “feed themselves.”

  The answer comes in four steps. The shepherds are charged and put out of their work (verses 1–10). The Lord says He will do that work Himself (11–16). He then turns to the flock and judges between its strong and its weak (17–22). Last, He names the one shepherd He will set over them, David, and describes the covenant of peace (23–31).

  Fifteen times the Lord says “my flock” or “my sheep.” The shepherds are once called “my shepherds” (verse 8), and never again.

  The book’s refrain, explained at [[Ezek. 6:7]], returns in verses 27 and 30. In the earlier chapters Israel was to know the Lord by the judgment He sent. Here they “shall know that I am the LORD, when I have broken the bands of their yoke.”

sections:
  - range: 1-6
    heading: 'Shepherds who feed themselves'
    plain: |
      The word of the Lord comes to Ezekiel: prophesy against the shepherds of Israel. Woe to the shepherds who feed themselves. Should not shepherds feed the flocks? They eat the fat, dress in the wool, and kill the fed animals, but they do not feed the flock. They have not strengthened the diseased, healed the sick, bound up the broken, brought back what was driven away, or looked for what was lost. They have ruled with force and cruelty. So the sheep were scattered for want of a shepherd and became food for every beast of the field. The Lord’s sheep wandered over every mountain and high hill and were scattered over the face of the earth, and no one searched for them.
  - range: 7-10
    heading: 'The flock taken from their hand'
    plain: |
      Therefore the shepherds are to hear the word of the Lord. As He lives, His flock became prey and food for every beast because there was no shepherd, and His shepherds did not search for the flock but fed themselves. Therefore He is against the shepherds. He will require His flock at their hand and make them stop feeding the flock. They will feed themselves no longer. He will deliver His flock from their mouth, so that it is no longer food for them.
  - range: 11-16
    heading: 'The Lord seeks His own sheep'
    plain: |
      The Lord God says that He Himself will search for His sheep and seek them out. As a shepherd seeks his flock on the day he is among his scattered sheep, so He will seek His, and deliver them from every place where they were scattered in the cloudy and dark day. He will bring them out from the peoples, gather them from the countries, and bring them to their own land. He will feed them on the mountains of Israel, by the rivers and in the inhabited places, in good pasture, and their fold will be on the high mountains of Israel. He will feed His flock and make them lie down. He will seek the lost, bring back what was driven away, bind up the broken, and strengthen the sick. The fat and the strong He will destroy; He will feed them with judgment.
  - range: 17-22
    heading: 'Judgment among the sheep'
    plain: |
      To His flock the Lord says that He judges between one animal and another, between the rams and the he goats. Was it too small a thing for them to eat the good pasture and drink the deep waters? They trample the rest of the pasture with their feet and foul the rest of the water. His flock eats what they have trodden and drinks what they have fouled. So He Himself will judge between the fat and the lean. Because they have pushed with side and shoulder and thrust at the diseased with their horns until they scattered them, He will save His flock. They will no longer be a prey, and He will judge between one and another.
  - range: 23-24
    heading: 'One shepherd, my servant David'
    plain: |
      The Lord will set up one shepherd over them, His servant David, who will feed them and be their shepherd. The Lord will be their God, and His servant David a prince among them. The Lord has spoken it.
  - range: 25-31
    heading: 'The covenant of peace'
    plain: |
      He will make a covenant of peace with them and rid the land of evil beasts, so that they live safely in the wilderness and sleep in the woods. He will make them and the places around His hill a blessing. The shower will come in its season, showers of blessing. The tree of the field will bear its fruit and the earth its increase, and they will be safe in their land. They will know that He is the Lord when He has broken the bands of their yoke and delivered them from those who made servants of them. They will no longer be a prey to the heathen, the beasts will not devour them, and no one will make them afraid. He will raise up for them a plant of renown; they will not be consumed with hunger or bear the shame of the heathen any more. They will know that the Lord their God is with them and that the house of Israel is His people. They are His flock, the flock of His pasture; they are men, and He is their God.

notes:
  - ref: 2
    phrase: 'the shepherds of Israel'
    kind: history
    title: 'The shepherds are Israel’s rulers'
    body: |
      The shepherds are Israel’s leaders, and “shepherd” was a title of kings. “One of the most common metaphors for kings in the ancient Near East was the shepherd,” and the title named a duty as much as a rank: kings were “to care for them, to reach out to the poor and oppressed.” The king of Babylon claimed the title too. An inscription of Nebuchadnezzar says that his god Marduk “gave me the shepherdship of the country and the people.”

      How far the word reaches in this chapter has been read in two ways. The charge has been taken as aimed at “the religious leaders of Ezekiel’s day.” The more recent reading is that it likely points “not only to Israel’s spiritual leaders but also to its kings.”

      Jeremiah’s “pastors” are the same Hebrew word and raise the same question; see the note on [[Jer. 23:1]] and the page [The Shepherds and the Branch](/jeremiah/themes/shepherds-and-the-branch/).
    sources: [seely-messiah, pike-shepherd, ot-manual-27, scripture-helps-ezek, oshb-wlc]

  - ref: 4
    phrase: 'with force and with cruelty have ye ruled them'
    kind: words
    title: 'Ruled as Egypt ruled'
    body: |
      “Cruelty” translates the Hebrew word that the King James Version elsewhere gives as “rigour,” the word first used of Israel’s slavery in Egypt. It is *perek*, “harshness, severity,” and it is found in three passages. In Exodus, “the Egyptians made the children of Israel to serve with rigour” ([[Ex. 1:13]]). In the law, Israel is told never to do that to one of its own: “over your brethren the children of Israel, ye shall not rule one over another with rigour” ([[Lev. 25:46]]). The third place is this verse.

      Ezekiel’s charge has both the noun and the verb of that law, “rule” and “rigour.” A modern translation has “with force and harshness you have ruled them.”

      Egypt comes back at the chapter’s end. The Lord will break “the bands of their yoke” (verse 27), words that Leviticus uses of the deliverance from Egypt (see the note on verse 25).
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 11
    phrase: 'I, even I, will both search my sheep, and seek them out'
    kind: words
    title: 'One verb for searching and for requiring'
    body: |
      The Lord’s “search” in this verse and His “require” in verse 10 are one Hebrew verb, *darash*, and it is the verb for what the shepherds did not do. “None did search” for the sheep (verse 6). “Neither did my shepherds search for my flock” (verse 8). Then the verb changes hands: “I will require my flock at their hand” (verse 10), and “I, even I, will both search my sheep.”

      In verses 6, 8, and 11, where the lost sheep are what is sought, the verb means to seek with a demand in it. In verse 10 it means to exact something, often with the thought of avenging. It has that second sense in the sentence about the watchman in the chapter before: “his blood will I require at the watchman’s hand” ([[Ezek. 33:6]]). The watchman is explained in the note on [[Ezek. 3:18]].

      A modern translation gives the doubled “I, even I” as “I myself will search for my sheep.”
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 13
    phrase: 'gather them from the countries, and will bring them to their own land'
    kind: scripture
    title: 'Gathered in the last days'
    body: |
      The gathering of this verse is set in the last days, though a return from Babylon came much sooner. The decree of Cyrus, in 536 B.C., let the exiles go home, but only part of them went, and “the rest remained behind and formed the dispersion.”

      Ezekiel “spoke much about the future restoration of Israel and the glory of the millennial reign of the Lord,” and the promise of the one shepherd that follows (verses 23–24) has been read as one that “will be most fully realized during the Millennium.”

      Ezekiel says it again in chapter 37 in nearly the same words, “and will gather them on every side, and bring them into their own land” ([[Ezek. 37:21]]), and there too the one shepherd follows at once.
    sources: [lds-scriptures, bd-captivities, bd-ezekiel, pike-shepherd]

  - ref: 16
    phrase: 'I will seek that which was lost'
    kind: scripture
    title: 'Verse 4 answered in reverse'
    body: |
      Verse 16 takes the shepherds’ failures listed in verse 4 and undoes them in reverse order. Verse 4 ends with the lost that no one sought, and before that the driven away that no one brought back, the broken that no one bound up, the sick that no one healed, and the diseased that no one strengthened. Verse 16 begins where that list ended: “I will seek that which was lost, and bring again that which was driven away, and will bind up that which was broken, and will strengthen that which was sick.” Healing is the one act not named again. The Hebrew words for the lost, the driven away, the broken, and the sick are the same in both verses.

      Jesus spoke of His own work in this verse’s terms. “The Son of man is come to seek and to save that which was lost” ([[Luke 19:10]]), and in His parable the shepherd leaves the ninety and nine to “go after that which is lost, until he find it” ([[Luke 15:4]]).
    sources: [oshb-wlc, lds-scriptures]

  - ref: 16
    phrase: 'but I will destroy the fat and the strong'
    kind: words
    title: 'Destroy, or watch over?'
    body: |
      The Hebrew text says the Lord will “destroy” the fat and the strong; the ancient Greek translation says He will “guard” them. The Greek reads, “and will guard the strong, and will feed them with judgment,” as if its translators saw *eshmor*, “I will watch over them,” where the Hebrew text has *ashmid*, “I will destroy.” The old Syriac and Latin versions read as the Greek does.

      The King James Version follows the Hebrew, and so does a modern translation: “but the fat and the strong I will destroy. I will feed them with justice.” The Hebrew reading has been defended from what follows. The fat and strong sheep “are characterized in Ezekiel 34:18 and Ezekiel 34:19 as those which spoil the food and water of the others,” and a promise to guard them would not agree with feeding them “with judgment.”

      “Judgment” here is justice, as that translation shows. Verses 17–21 carry the thought further.
    sources: [lxx-rahlfs, oshb-wlc, keil-ezekiel, nrsvue]

  - ref: 17
    phrase: 'I judge between cattle and cattle'
    kind: symbol
    title: 'Judgment inside the flock'
    body: |
      From this verse the Lord speaks to the flock and not to its shepherds, and the line He draws runs through the flock itself. The Hebrew has “between sheep and sheep.” Verses 18–21 say what the strong ones do: they eat the best pasture and trample the rest, drink the clear water and muddy what is left, and shoulder the weak aside until they are scattered.

      This has been read as a picture of “the rich and strong ones of the nation, who oppress the humble and poor.” On that reading it is a different scene from the parable in which a shepherd divides “his sheep from the goats” ([[Matt. 25:32]]). The rams and he goats here are not one kind of animal told apart from another. They stand with the fat, and “sheep will be separated from sheep,” the fat from the lean.

      The first ten verses lay the scattering to the shepherds. Verse 21 adds that the weak were scattered by the strong of their own flock as well.
    sources: [lds-scriptures, keil-ezekiel]

  - ref: 23
    phrase: 'one shepherd over them, and he shall feed them, even my servant David'
    kind: christ
    title: 'My servant David is the Messiah'
    body: |
      “My servant David” is Jesus Christ, the descendant of David, and not the king of that name, who had been dead about four centuries when Ezekiel wrote. The name stands for the Son of David, the messianic king. Jeremiah has the same promise: “David their king, whom I will raise up unto them” ([[Jer. 30:9]]), and the Branch raised “unto David” (see the note on [[Jer. 23:5]]).

      The name suits the figure. David was the shepherd who became king, taken “from the sheepfolds” ([[Ps. 78:70]]), and he has been called a flawed “type” of the Shepherd-King to come.

      When chapter 37 repeats the promise, the one shepherd is the one king of a people no longer divided: “one king shall be king to them all: and they shall be no more two nations” ([[Ezek. 37:22]]), and “they all shall have one shepherd” ([[Ezek. 37:24]]). The Savior said, “there shall be one fold, and one shepherd” ([[John 10:16]]). [One Shepherd](/ezekiel/themes/one-shepherd/) follows the shepherds and the one shepherd through the book.
    sources: [scripture-helps-ezek, seely-messiah, pike-shepherd, lds-scriptures]

  - ref: 24
    phrase: 'a prince among them'
    kind: words
    title: 'Prince here, king in chapter 37'
    body: |
      The David who is “prince” here is called both king and prince when the promise is repeated in chapter 37. The Hebrew word is *nasi*, “one lifted up,” a chief. Ezekiel used it of Zedekiah (see the note on [[Ezek. 12:10]]), and this verse is classed with those that speak of the “future Davidic king.” When the promise is repeated, the two titles stand in neighboring verses: “David my servant shall be king over them” ([[Ezek. 37:24]]), and “my servant David shall be their prince for ever” ([[Ezek. 37:25]]).

      The text does not say why “prince” is chosen here.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 25
    phrase: 'a covenant of peace'
    kind: scripture
    title: 'The words of the blessings in Leviticus 26'
    body: |
      The promises of the covenant of peace have the words of the blessings that Moses set before Israel in Leviticus 26:

      - Rain and harvest. “I will give you rain in due season, and the land shall yield her increase, and the trees of the field shall yield their fruit” ([[Lev. 26:4]]). Ezekiel has the shower “in his season,” the tree of the field, and the earth’s increase (verses 26–27).
      - Safety. “Ye shall lie down, and none shall make you afraid: and I will rid evil beasts out of the land” ([[Lev. 26:6]]). Ezekiel has the evil beasts gone, safe sleep, and “none shall make them afraid” (verses 25 and 28).
      - The yoke. “I have broken the bands of your yoke” ([[Lev. 26:13]]). In Leviticus that is said of Egypt. Ezekiel puts it in the future (verse 27).
      - The relationship. “I … will be your God, and ye shall be my people” ([[Lev. 26:12]]), which is how the chapter closes (verses 30–31).

      Those blessings were promised to a faithful Israel, and the same chapter of Leviticus carried the warnings for a faithless one. Moses’s promises and warnings in Leviticus 26 and Deuteronomy 28 have been called probably the “most important historical and prophetic antecedent” of Ezekiel’s prophecies. Earlier the book had the words of the warnings: “So will I send upon you famine and evil beasts” ([[Ezek. 5:17]]).

      Chapter 37 repeats the phrase and adds its length, “it shall be an everlasting covenant with them” ([[Ezek. 37:26]]).
    sources: [lds-scriptures, lund-ezekiel]

  - ref: 29
    phrase: 'a plant of renown'
    kind: words
    title: 'A planting for a name'
    body: |
      The Hebrew is a planting that is “for a name.” Modern translations take it of the land’s fruitfulness; it has also been read of the people and of Christ. The noun, *matta*, means “place, or act of planting; plantation,” and the translations have “a splendid vegetation,” or “a renowned place for planting.”

      The ancient Greek translation has “a plant of peace.” That would reflect *shalom*, “peace,” where the Hebrew text has *le-shem*, “for a name,” and the Greek has been judged probably right, a “peaceful (fruitful) planting-place.”

      Isaiah uses the same noun as a figure for the people, who are “the planting of the LORD” ([[Isa. 61:3]]). The plant has also been taken to be Christ, “as he is elsewhere called a branch and a rod.”
    sources: [bdb, nrsvue, esv, lxx-rahlfs, lds-scriptures, clarke-ezekiel]

  - ref: 31
    phrase: 'are men'
    kind: words
    title: 'The flock are human beings'
    body: |
      The last verse steps out of the figure and names what the sheep are: *adam*, humankind, the word of “son of man” (see the note on [[Ezek. 2:1]]). The ancient Greek translation has no such word. It reads, “ye are my sheep, even the sheep of my flock, and I am the Lord your God.” One modern translation leaves it out as well (“You are my sheep, the sheep of my pasture, and I am your God”), and another keeps it as “human sheep of my pasture.”

      If the word belongs here, it is not needed to explain the parable, which was understood without it. One reading is that the two halves are meant to be heard together, men on one side and “I am your God” on the other: the words “call attention to the depth and greatness of the divine condescension,” against the thought that mortals are “incapable of so intimate a connection with God.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, esv, keil-ezekiel]

christ: |
  “I am the good shepherd” ([[John 10:11]]) takes up this chapter. Ezekiel’s Lord says He will search for the sheep Himself and set one shepherd over them. Jesus takes the title and adds what Ezekiel’s promise does not say: “the good shepherd giveth his life for the sheep.”

  The saying has been called “an open announcement by Jesus that He was Jehovah, the Messiah, the King of Israel.” His hearers understood that a claim had been made. They “took up stones again to stone him” ([[John 10:31]]); what they would not accept was “Christ’s teaching that he was the one Shepherd of Israel.”

explore: |
  - Jeremiah’s shorter oracle against the shepherds, with its King raised up to David: [[Jer. 23:1–8]], and the page [The Shepherds and the Branch](/jeremiah/themes/shepherds-and-the-branch/).
  - The promise repeated, with one nation, one king, and an everlasting covenant: [[Ezek. 37:21–28]].
  - The Good Shepherd, the hireling, and the other sheep: [[John 10:1–18]].
  - The blessings and the warnings of the law that this chapter draws on: [[Lev. 26:3–13]].
  - Nephi on the day when there is “one fold and one shepherd”: [[1 Ne. 22:24–28]].
  - The shepherd who gathers the lambs with his arm: [[Isa. 40:11]]; and David’s own psalm, [[Ps. 23]].
  - The royal title “shepherd” across the ancient Near East and what it means for John 10: Dana M. Pike, “Jesus, the Great Shepherd-King.”

