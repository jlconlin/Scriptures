chapter: 37
title: 'Can These Bones Live?'
tagline: 'Ezekiel is shown a plain of dry bones that stand up alive at the word of the Lord, and is told to join two pieces of wood into one. The Lord explains both: a dead people will live, and a divided people will be one, under one king, with His sanctuary among them for ever.'
when: 'No date of its own. The chapter stands under the heading of 33:21, “the twelfth year of our captivity, in the tenth month” (about 585 B.C.), when word reached Ezekiel that Jerusalem had fallen, and before the next date in the book, the twenty-fifth year (40:1).'

setting: |
  Jerusalem has fallen. The nearest date above this chapter is the day the exiles in Babylon heard, “The city is smitten” ([[Ezek. 33:21]]), and chapters 33–39 are the book’s “prophecies of restoration.” Ezekiel’s hearers are captives from Judah. Their kingdom is gone. The northern kingdom of Israel had been carried away by Assyria long before, the last of it in 721 B.C.

  The chapter before this one ended with promises to these people, among them, “I will put my spirit within you” ([[Ezek. 36:27]]). In this chapter the people are saying, “our hope is lost” (verse 11).

  It has two parts, each a separate word of the Lord. In verses 1–14 Ezekiel is shown a plain covered with bones and is told to prophesy to them. In verses 15–28 he is told to act out a sign with two pieces of wood, as he had acted out signs of the siege ([[Ezek. 4:1–3]]). The closing verses look ahead to the last division of the book, the vision of the temple in chapters 40–48.

thread: |
  Two things that cannot happen are shown happening. A people as dead as scattered bones stands up alive, and two kingdoms long divided become one piece of wood in the prophet’s hand.

  Both halves are built the same way. Ezekiel is given something to see or to do. The people’s own words are quoted: their despair in verse 11, their question in verse 18. Then the Lord says what the sign means, in verses 12–14 and in verses 19–22. The reader is not left to guess at either one.

  The halves belong together. The bones are “the whole house of Israel,” and the second half names both parts of it, Judah and Joseph. In each explanation the Lord is the one who acts. I will open, I will bring, I will put, in the first; I will take, I will gather, I will make, I will save, in the second.

  The closing verses (21–28) repeat what chapters 34 and 36 promised: the gathering, the cleansing, one shepherd, a covenant of peace. What has been singled out as new is “for ever”: one Hebrew word in verses 25, 26, and 28, where the King James has “for ever,” “everlasting,” and “for evermore.” With it comes the promise of the Lord’s sanctuary in the midst of His people. The book’s refrain (see the note on [[Ezek. 6:7]]) closes each part. Israel will know that He is the LORD (verses 6, 13, 14), and so will the heathen (verse 28).

sections:
  - range: 1-10
    heading: 'The valley of dry bones'
    plain: |
      The hand of the Lord is on Ezekiel. He is carried out in the spirit of the Lord and set down in the middle of a valley full of bones. He is led all around them. There are very many, lying in the open, and they are very dry. The Lord asks him, Can these bones live? He answers, O Lord God, thou knowest. He is told to prophesy to the bones: the Lord will put sinews and flesh and skin on them and breath in them, and they will live and know that He is the Lord. Ezekiel prophesies. There is a noise and a rattling, and the bones come together, each to its own. Sinews, flesh, and skin cover them, but there is no breath in them. He is told to prophesy to the wind and call the breath from the four winds to breathe on these slain. He does. Breath enters them, and they live and stand on their feet, a very great army.
  - range: 11-14
    heading: 'These bones are the whole house of Israel'
    plain: |
      The Lord tells Ezekiel that the bones are the whole house of Israel. The people are saying, Our bones are dried, our hope is lost, we are cut off. So he is to tell them: The Lord God says, My people, I will open your graves, bring you up out of them, and bring you into the land of Israel. You will know that I am the Lord when I have done it. I will put my spirit in you and you will live, and I will place you in your own land. Then you will know that I the Lord have spoken it and done it.
  - range: 15-20
    heading: 'Two sticks made one'
    plain: |
      The word of the Lord comes again. Ezekiel is to take one stick and write on it, For Judah, and for the children of Israel his companions. He is to take another and write on it, For Joseph, the stick of Ephraim, and for all the house of Israel his companions. He is to join them into one stick, so that they are one in his hand. When his people ask what he means by this, he is to say: The Lord God will take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel with him, and put them with the stick of Judah, and make them one stick, and they will be one in the Lord’s hand. The sticks he has written on are to be in his hand where the people can see them.
  - range: 21-23
    heading: 'One nation'
    plain: |
      He is to tell them: The Lord God will take the children of Israel from among the heathen where they have gone, gather them from every side, and bring them into their own land. He will make them one nation in the land, on the mountains of Israel, with one king over them all. They will never again be two nations or two kingdoms. They will no longer defile themselves with idols, with detestable things, or with any of their transgressions. The Lord will save them out of all their dwelling places where they have sinned, and will cleanse them. They will be His people and He will be their God.
  - range: 24-28
    heading: 'One shepherd, and a sanctuary for evermore'
    plain: |
      David, the Lord’s servant, will be king over them, and they will all have one shepherd. They will walk in His judgments and keep His statutes. They will live in the land given to Jacob, where their fathers lived, they and their children and their children’s children for ever, and David will be their prince for ever. The Lord will make a covenant of peace with them, an everlasting covenant. He will place them and multiply them, and set His sanctuary in the midst of them for evermore. His tabernacle will be with them; He will be their God and they His people. The heathen will know that the Lord sanctifies Israel when His sanctuary is in the midst of them for evermore.

notes:
  - ref: 1
    phrase: 'the valley which was full of bones'
    kind: history
    title: 'The plain of an earlier vision'
    body: |
      The “valley” is in Hebrew “the plain,” the word used for the place where Ezekiel saw the glory of the Lord in chapter 3. The word is *biqah*, a broad valley or plain, and a modern translation gives “plain” as an alternative here. Ezekiel had been sent to such a place before, “Arise, go forth into the plain” ([[Ezek. 3:22]]), and there “the glory of the LORD stood” ([[Ezek. 3:23]]; see the note there). The article in this verse “appears to point back” to that plain. That is a likely reading and not a certain one, since the text does not name the place.

      What happens there is a vision. Ezekiel is carried out “in the spirit of the LORD,” and modern revelation speaks of him as one “who was shown in vision the great valley of dry bones” ([[D&C 138:43]]). His other visions begin as this one does, with the hand of the Lord upon him ([[Ezek. 8:1]]; [[Ezek. 40:1]]).
    sources: [oshb-wlc, bdb, esv, keil-ezekiel, lds-scriptures]

  - ref: 9
    phrase: 'Come from the four winds, O breath'
    kind: words
    title: 'One word for breath, wind, and spirit'
    body: |
      “Breath,” “wind,” and “spirit” in this vision are one Hebrew word, *ruach*, which means all three. It comes ten times in verses 1–14, four of them in this verse, and the King James translators chose a sense each time: the “spirit” that carries Ezekiel out (verse 1), the “breath” that the bodies lack (verse 8), the “wind” he is told to prophesy to, and the “spirit” the Lord promises to put in His people (verse 14). In these verses it has the sense of breath “as sign and symbol of life,” and in verse 14 it may be “breath or spirit.” So the breath of the vision and the spirit of the promise are the same word. Verse 14 repeats the promise of the chapter before, “I will put my spirit within you” ([[Ezek. 36:27]]; see the note there).

      The bones come to life in two steps, bodies first and breath afterward. That order has been traced to the creation of Adam, where God “formed man of the dust of the ground, and breathed into his nostrils the breath of life” ([[Gen. 2:7]]). The verb “breathe” in this verse is the verb of that one, though Genesis has a different noun for “breath.” On this reading the raising of Israel is pictured, like the first creation, as “a work of the almighty God.”
    sources: [oshb-wlc, bdb, keil-ezekiel, lds-scriptures]

  - ref: 11
    phrase: 'these bones are the whole house of Israel'
    kind: symbol
    title: 'The Lord explains the bones'
    body: |
      The Lord interprets the vision Himself: the bones are the house of Israel, and their dryness is the people’s own description of themselves. The exiles have a saying, “Our bones are dried, and our hope is lost.” A like saying is quoted earlier in this part of the book: “we pine away in them, how should we then live?” ([[Ezek. 33:10]]). The vision takes their figure of speech and shows it to the prophet as a plain covered with bones, “very dry” (verse 2), which seems to indicate that they had been there for a long time. Ezekiel’s guarded answer in verse 3 has been read the same way: by human judgment it was inconceivable that such bones could live.

      What their rising means is said in verses 12–14. The Lord will bring His people up, put His spirit in them, and place them in their own land. The bones stand for Israel “in their lost and hopeless state,” and their new life for Israel restored to its land and to spiritual life.

      The word “whole” matters. Ezekiel’s hearers were exiles from Judah, and the northern tribes had been carried away long before (see the note on [[Ezek. 37:22]]). The phrase has been read as pointing forward to the second half of the chapter, where the two are made one.
    sources: [scripture-helps-ezek, esv, keil-ezekiel, lds-scriptures]

  - ref: 11
    phrase: 'we are cut off for our parts'
    kind: words
    title: 'We are cut off'
    body: |
      “For our parts” is the King James rendering of a small Hebrew word, “for us,” and the verb before it means cut off in the sense of destroyed. Modern translations have “we are indeed cut off,” or “we are cut off completely.” The verb has the sense “be cut off = destroyed” in this verse and in one other, the cry from the pit in Lamentations: “then I said, I am cut off” ([[Lam. 3:54]]).
    sources: [oshb-wlc, bdb, esv, nrsvue, lds-scriptures]

  - ref: 12
    phrase: 'I will open your graves'
    kind: scripture
    title: 'A prophecy of the Resurrection'
    body: |
      Latter-day Saint scripture and the Church’s study helps read the vision in two ways at once, as the restoring of Israel and as a prophecy of the Resurrection of the dead. The first is the text’s own explanation (see the note on [[Ezek. 37:11]]). The second is stated in modern revelation. When President Joseph F. Smith saw the spirits of the dead, among them was “Ezekiel, who was shown in vision the great valley of dry bones, which were to be clothed upon with flesh, to come forth again in the resurrection of the dead, living souls” ([[D&C 138:43]]). Earlier in the same vision the hope of the righteous dead is put in the words of verses 7–8: “Their sleeping dust was to be restored unto its perfect frame, bone to his bone, and the sinews and the flesh upon them” ([[D&C 138:17]]).

      That Ezekiel can promise a dead nation’s return in the language of rising from the grave has been taken as a sign that the resurrection of the body was assumed, and had long been understood in Israel. The exiles are shown that God can restore them “even as the dead will be raised.” The vision has also been described as the return of the Israelites to their homeland, “symbolized by resurrection.”

      This verse joins the two itself, since the graves are opened in order to bring the people “into the land of Israel.” Israel is to inherit the land “in the Resurrection.” The promise then reaches Israelites whose graves were far from home, in Ezekiel’s day and afterward: by means of the resurrection God would bring them back to their land.
    sources: [lds-scriptures, bd-ezekiel, scripture-helps-ezek, ot-manual-27, meservy-sticks, sc-knowhy-719]

  - ref: 16
    phrase: 'take thee one stick, and write upon it'
    kind: words
    title: 'What a stick was'
    body: |
      The Hebrew word is *etz*, “wood,” and it has been argued that what Ezekiel wrote on was a wooden writing tablet. The text itself says only that he took wood and wrote on it. *Etz* is the ordinary word for a tree, for wood, and for things made of wood, and “stick” is one of several ways the King James translators rendered it. Had a staff been meant, the expected word would be *matteh*, the word for the tribal rods of [[Num. 17:2]], which also had names written on them.

      In Babylonia scribes wrote on wooden boards as well as on clay. The boards were filled with wax, and two or more could be hinged so that they folded together. A set of sixteen was found in 1953 at Nimrud, the biblical Calah, in Assyria. The argument from this is that Ezekiel does what a scribe did with such boards. He writes on wood, he marks each piece with its owner’s name, and he joins two into one in his hand. One modern translation renders it accordingly: “take one leaf of a wooden tablet and write on it.” The conclusion drawn is that Ezekiel “most likely was writing on wax writing boards,” with the caution that the common use of such boards is not enough by itself to show it.

      A plainer view agrees that no staff is meant but thinks of something simpler than boards: “pieces of wood upon which a few words could be written, and which could be held in one hand.” On either view the wood is something to write on, and what is written is a name. The Hebrew “for” before Judah and Joseph says to whom each piece belongs.
    sources: [oshb-wlc, bdb, meservy-sticks, keil-ezekiel]

  - ref: 16
    phrase: 'For Joseph, the stick of Ephraim'
    kind: history
    title: 'Judah’s wood and Joseph’s'
    body: |
      The two names stand for the two kingdoms into which Israel had divided, each with the tribes that went with it. Judah led the southern kingdom, and its “companions” were people of other tribes who lived within its borders, among them Benjamin and Levi and some from Ephraim and Manasseh. Joseph is named for the north, whose tribes were led by Ephraim. Ephraim was Joseph’s second son, set before his elder brother Manasseh in Jacob’s blessing, and his tribe became “a dominant tribe” among Joseph’s descendants. So the stick of Joseph can also be called the stick of Ephraim, and verse 19 says it is “in the hand of Ephraim.”

      The same names serve when the sticks are read as records (see the note on [[Ezek. 37:17]]).
    sources: [meservy-sticks, lds-scriptures, bd-ephraim, scripture-helps-ezek]

  - ref: 17
    phrase: 'they shall become one in thine hand'
    kind: scripture
    title: 'Two nations and two records'
    body: |
      The Lord’s own explanation of the joined sticks is the reunion of Israel, and Restoration scripture adds a second fulfillment: the records of Judah and of Joseph brought together.

      When the people ask what Ezekiel means, the answer in verses 19–22 is about peoples. The Lord will gather the children of Israel and “make them one nation,” with one king (see the note on [[Ezek. 37:22]]).

      The sticks are things written on, and they can also represent written records. Modern revelation uses Ezekiel’s phrase for a book. Moroni was sent “to reveal the Book of Mormon” and holds “the keys of the record of the stick of Ephraim” ([[D&C 27:5]]). The Book of Mormon tells of the same joining without the image of sticks. Joseph in Egypt was promised that what his descendants wrote and what Judah’s descendants wrote “shall grow together” ([[2 Ne. 3:12]]), and Nephi was told of the records of his seed and of the twelve apostles, “they both shall be established in one” ([[1 Ne. 13:41]]). On this reading the stick of Judah is the Bible and the stick of Joseph is the Book of Mormon, and their coming forth together is a latter-day fulfillment of the prophecy.

      The Lord joins the two Himself, speaking through Nephi: “when the two nations shall run together the testimony of the two nations shall run together also” ([[2 Ne. 29:8]]). The coming forth of the record is part of the gathering and reunion of the people. It has also been argued that the appearing of Joseph’s record was the sign that the gathering had begun, as the Savior told the Nephites it would be ([[3 Ne. 21:1–7]]).
    sources: [lds-scriptures, scripture-helps-ezek, sc-knowhy-56, meservy-sticks]

  - ref: 19
    phrase: 'they shall be one in mine hand'
    kind: prophets
    title: 'One in our hands'
    body: |
      Elder Boyd K. Packer of the Quorum of the Twelve Apostles taught in 1982 that the Church’s new editions of the scriptures were a step in the fulfilling of this prophecy. “The sticks, of course, are records or books,” he said. He told of two events, both in print shops. The first was the printing of the Book of Mormon, which came from the press in March 1830. The second began in June 1977 and produced a Latter-day Saint edition of the King James Bible and then new editions of the other standard works, with footnotes that lead from Ezekiel’s verses to the Book of Mormon. Of the result he said that the two records “are now woven together in such a way that as you pore over one you are drawn to the other,” and, “They are indeed one in our hands.”

      In verse 17 the sticks become one in Ezekiel’s hand. In this verse the Lord says they will be one in His.
    sources: [packer-scriptures]

  - ref: 22
    phrase: 'they shall be no more two nations'
    kind: history
    title: 'The two kingdoms'
    body: |
      Israel had been two nations since the days of Solomon’s son Rehoboam, and when Ezekiel spoke neither of them was standing. The northern tribes broke away under Rehoboam: “So Israel rebelled against the house of David unto this day” ([[1 Kgs. 12:19]]). Ephraim’s jealousy of Judah had “in great measure brought about the separation.” The northern kingdom was later carried into Assyria, the last of it in 721 B.C., and the later history of those captives “cannot be followed with certainty.” Now Judah was in exile too.

      So the promise of one nation under one king is made to a people who have no nation at all, and it includes tribes carried away long before. Other prophets had promised the same healing: “Ephraim shall not envy Judah, and Judah shall not vex Ephraim” ([[Isa. 11:13]]), and “the house of Judah shall walk with the house of Israel” ([[Jer. 3:18]]). The healing of this enmity belongs to the latter days, when the envy of Judah and Ephraim is to cease “through the operation of the gospel of Jesus Christ.”
    sources: [lds-scriptures, bd-ephraim, bd-captivities, nrsvue]

  - ref: 23
    phrase: 'out of all their dwellingplaces, wherein they have sinned'
    kind: words
    title: 'Dwellingplaces, or backslidings'
    body: |
      Some modern translations have “backslidings” here where the King James has “dwellingplaces,” and in Hebrew the difference is very small. The standard Hebrew text has *moshvotehem*, “their dwelling places.” The other reading is *meshuvotehem*, “their apostasies” or turnings back, which is written with the same consonants in a slightly different order. It has the support of the ancient Greek translation, which reads, “I will deliver them from all their transgressions whereby they have sinned.” Modern translations follow: “I will save them from all the backslidings in which they have sinned,” or “from all the apostasies into which they have fallen.” The first of these notes that the Hebrew manuscripts are divided, and the second that the standard text has “settlements.”

      The King James follows the Hebrew as it stands. On that reading the Lord saves His people out of the places where they sinned. On the other He saves them from the turning away itself, which is the word of Jeremiah’s promise, “I will heal your backslidings” ([[Jer. 3:22]]). The next words, “and will cleanse them,” are the same on either reading.
    sources: [oshb-wlc, bdb, lxx-rahlfs, esv, nrsvue, lds-scriptures]

  - ref: 24
    phrase: 'David my servant shall be king over them'
    kind: christ
    title: 'David, king for ever'
    body: |
      “David my servant” is the Messiah, as in chapter 34 (see the note on [[Ezek. 34:23]], where the name is explained).

      Here the promise is joined to the reunion of verse 22. The people are one nation again, “one king shall be king to them all,” and that king is David. The chapter also says how long He reigns: “my servant David shall be their prince for ever” (verse 25).

      The prophecy of one king over all Israel will be fulfilled in the end by Jesus Christ after His Second Coming.
    sources: [lds-scriptures, scripture-helps-ezek]

  - ref: 27
    phrase: 'My tabernacle also shall be with them'
    kind: scripture
    title: 'A sanctuary in the midst of them'
    body: |
      The last promise of the chapter is that the Lord will live among His people, and the rest of the book goes on to show it. “Tabernacle” here is *mishkan*, “dwelling-place,” the word used for the tabernacle in Exodus. The same promise stands among the blessings of the law: “I will set my tabernacle among you” ([[Lev. 26:11]]), and “I will walk among you, and will be your God, and ye shall be my people” ([[Lev. 26:12]]).

      These verses have been read as a prophecy of a temple that would be part of the reunification of Israel, and the vision that follows soon after shows one, measured in detail (chapters 40–48). The glory returns to it, and the Lord says, “I will dwell in the midst of the children of Israel for ever” ([[Ezek. 43:7]]). President Joseph Fielding Smith taught that Ezekiel foretold a temple in Jerusalem, to be used for ordinance work after Israel is gathered and cleansed. The last words of the book are the name of the city: “The LORD is there” ([[Ezek. 48:35]]).

      The covenant of peace in verse 26 was promised in [[Ezek. 34:25]] (see the note there). Here it is called everlasting.
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue, ot-manual-27]

christ: |
  The one who raises the bones is the Savior. Elder Bruce R. McConkie taught that Ezekiel “saw the dead live again, live literally and personally,” and that the one who will open the graves “is the Lord Jesus Christ who is the God of Israel.” He set the vision beside the Lord’s own rising: it would be with each of the dead as it was with Him when He stood among His disciples in a body they could handle. Jesus said of Himself, “the hour is coming, in the which all that are in the graves shall hear his voice” ([[John 5:28]]).

  The second half of the chapter names Him as king. “David my servant” is the Messiah (see the note on [[Ezek. 37:24]]), the one shepherd of a people made one. The Book of Mormon’s promise that the two records will be established in one ends with the same figure: “for there is one God and one Shepherd over all the earth” ([[1 Ne. 13:41]]).

explore: |
  - The same healing of Ephraim and Judah in Isaiah, with the gathering that goes with it: [[Isa. 11:11–13]].
  - Jeremiah on the two houses walking together: [[Jer. 3:18]] and [[Jer. 50:4]].
  - The records growing together and the testimony of two nations: [[2 Ne. 3:11–12]] and [[2 Ne. 29:7–14]].
  - The vision of the redemption of the dead, which names Ezekiel: [[D&C 138:11–17]] and [[D&C 138:43]].
  - One fold and one shepherd: [[John 10:16]].
  - The promises this chapter gathers up, the shepherd and the new heart: [[Ezek. 34:23–25]] and [[Ezek. 36:24–28]].
  - Where the sanctuary of verses 26–28 leads, the glory returning to the temple: [[Ezek. 43:1–7]].
  - For the full argument about wooden writing boards, and the case that the Book of Mormon’s coming marks the beginning of the latter-day gathering, see “Ezekiel’s Sticks and the Gathering of Israel,” *Ensign*, Feb. 1987.

