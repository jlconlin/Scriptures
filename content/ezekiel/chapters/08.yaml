chapter: 8
title: 'Abominations in the Temple'
tagline: 'Fourteen months after his call, Ezekiel is taken in vision to the temple in Jerusalem and led from one scene of idolatry to the next, each worse than the last, while the glory of the Lord still stands in the house.'
when: 'The sixth year of Jehoiachin’s captivity, the sixth month, the fifth day (8:1): about 591 B.C., fourteen months after the first vision (1:1–2). The date stands over chapters 8–19, until the next one at 20:1.'

setting: |
  Ezekiel is in Babylonia, one of the captives carried away with king Jehoiachin, living at Tel-abib on the Chebar. It is the sixth year of that captivity. Jerusalem is still standing, and the siege will not begin until the ninth year ([[Ezek. 24:1–2]]). The elders of the exiles are sitting in his house when the hand of the Lord falls on him.

  This chapter opens a single vision that runs to the end of chapter 11. In it Ezekiel is brought to the temple and shown four scenes of idolatry (chapter 8), watches the judgment of the city (chapter 9), and sees the glory of the Lord leave the temple and then the city ([[Ezek. 10:18–19]]; [[Ezek. 11:23]]). Then he is returned to Chaldea and tells the exiles all that he was shown ([[Ezek. 11:24–25]]). Chapter 8 is the charge on which the other three chapters rest.

  Idolatry in the temple was not new. Manasseh had built altars to the host of heaven in its courts and set an idol in the house ([[2 Kgs. 21:5]]; [[2 Kgs. 21:7]]), and Josiah had cleared them out ([[2 Kgs. 23:6]]; [[2 Kgs. 23:11]]). Jeremiah, Ezekiel’s contemporary, makes the same charge from inside the city: “they have set their abominations in the house which is called by my name, to pollute it” ([[Jer. 7:30]]).

thread: |
  The chapter is a guided walk. Four times Ezekiel is brought to a place and shown something, and three times he is told that worse is coming: “turn thee yet again, and thou shalt see greater abominations” (verses 6, 13, 15). The scenes move from an idol standing at a gate, to a hidden room where the nation’s elders burn incense to pictures, to women mourning a foreign god at the gate of the Lord’s house, and last to men at the very door of the temple who have turned their backs on it to bow to the sun.

  Two sentences in the chapter stand over the walk. The first is the Lord’s question in verse 6: these things are done “that I should go far off from my sanctuary.” The glory is still in the house in verse 4. The second is what the elders say in verse 12: “The LORD seeth us not; the LORD hath forsaken the earth.” The chapter itself contradicts them. The glory is in the house, and the Lord shows a prophet in another country what is done in the dark. He closes with the words “mine eye shall not spare.”

sections:
  - range: 1-4
    heading: 'Carried to Jerusalem'
    plain: |
      In the sixth year, on the fifth day of the sixth month, Ezekiel is sitting in his house with the elders of Judah in front of him when the hand of the Lord God falls on him. He sees a figure: fire from the waist down, and from the waist up a brightness like glowing amber. The figure reaches out something like a hand and takes him by a lock of his hair. The spirit lifts him between earth and heaven and brings him, in visions of God, to Jerusalem, to the entrance of the north gate of the inner court, where the image that provokes jealousy has its place. The glory of the God of Israel is there, as he had seen it in the plain.
  - range: 5-6
    heading: 'The image of jealousy'
    plain: |
      He is told to look north. North of the altar gate, in the entry, stands the image of jealousy. The Lord asks whether he sees what the house of Israel is doing here, great abominations done here, that He should go far off from His sanctuary. And he will see worse.
  - range: 7-13
    heading: 'The room behind the wall'
    plain: |
      He is brought to the entrance of the court, where there is a hole in the wall. Told to dig, he digs and finds a door. Told to go in and see, he finds the walls covered all around with pictures of creeping things and unclean animals and all the idols of the house of Israel. Seventy of Israel’s elders stand in front of them, Jaazaniah the son of Shaphan among them, each holding a censer, and a thick cloud of incense rises.

      The Lord asks whether he has seen what the elders do in the dark, each in his own room of images. They say that the Lord does not see them and that He has forsaken the earth. And he will see worse.
  - range: 14-15
    heading: 'Women weeping for Tammuz'
    plain: |
      He is brought to the entrance of the north gate of the Lord’s house. Women are sitting there, weeping for Tammuz. The Lord asks whether he has seen it, and tells him he will see worse than this.
  - range: 16-18
    heading: 'Backs to the temple'
    plain: |
      He is brought into the inner court. At the door of the temple, between the porch and the altar, are about twenty-five men with their backs to the temple and their faces to the east, bowing to the sun.

      The Lord asks whether it is a small thing for the house of Judah to do such abominations here, since they have also filled the land with violence and keep provoking Him to anger. They put the branch to their nose. Therefore He will act in fury. His eye will not spare and He will not pity, and though they cry loudly in His ears He will not hear them.

notes:
  - ref: 1
    phrase: 'the elders of Judah sat before me'
    kind: history
    title: 'The date, and the elders in Ezekiel’s house'
    body: |
      The vision is dated fourteen months after Ezekiel’s first, and the elders sitting before him are among those he will tell it to. The first vision came in the fourth month, on the fifth day, in the fifth year of Jehoiachin’s captivity ([[Ezek. 1:1–2]]). This one comes in the sixth month, on the fifth day, in the sixth year. The ancient Greek translation has the fifth month here, a month earlier.

      The elders matter to what follows. Twice more the book shows elders coming to sit before the prophet ([[Ezek. 14:1]]), the second time expressly “to inquire of the LORD” ([[Ezek. 20:1]]). When this vision ends, Ezekiel says, “Then I spake unto them of the captivity all the things that the LORD had shewed me” ([[Ezek. 11:25]]). Part of what he has to tell these elders in exile is what elders of Israel are doing in Jerusalem (verses 11–12).
    sources: [lds-scriptures, lxx-rahlfs]

  - ref: 2
    phrase: 'a likeness as the appearance of fire'
    kind: words
    title: 'A figure of fire, or of a man'
    body: |
      The Hebrew text says the figure had the appearance of fire, and the ancient Greek says it had the appearance of a man. The Greek translators have “the likeness of a man,” and modern translations follow them: “a form that had the appearance of a man,” “a figure that looked like a man.” The verse goes on to speak of “his loins” and “the form of an hand,” so a human shape is meant either way.

      Whichever word is original, Ezekiel describes the figure in the words of his first vision. There, on the throne above the creatures, was “the likeness as the appearance of a man” ([[Ezek. 1:26]]), with fire from the loins upward and downward and “the colour of amber” ([[Ezek. 1:27]]), the same three details in nearly the same words. Of that figure he wrote, “This was the appearance of the likeness of the glory of the LORD” ([[Ezek. 1:28]]). The one who speaks to him through the rest of this chapter calls the temple “my sanctuary” (verse 6).
    sources: [oshb-wlc, lxx-rahlfs, esv, nrsvue, lds-scriptures]

  - ref: 3
    phrase: 'in the visions of God to Jerusalem'
    kind: scripture
    title: 'Carried to Jerusalem in vision'
    body: |
      Ezekiel does not say that his body left Babylonia; he says he was brought to Jerusalem “in the visions of God.” The vision closes the same way it opens: “the spirit took me up, and brought me in a vision by the Spirit of God into Chaldea, to them of the captivity. So the vision that I had seen went up from me” ([[Ezek. 11:24]]).

      The phrase “visions of God” comes in two other places in the book: at the first vision ([[Ezek. 1:1]]) and at the vision of the future temple, where “in the visions of God brought he me into the land of Israel” ([[Ezek. 40:2]]). Lehi, a prophet of the same day, “was carried away in a vision” ([[1 Ne. 1:8]]). His words are like Ezekiel’s “visions of God” at the first vision and like Ezekiel’s later report that the hand of the Lord “carried me out in the spirit of the LORD” ([[Ezek. 37:1]]).
    sources: [lds-scriptures, sc-knowhy-469]

  - ref: 3
    phrase: 'the image of jealousy'
    kind: words
    title: 'The idol that provokes the Lord to jealousy'
    body: |
      The “image of jealousy” is an idol named for what it does to the Lord, and the text does not say which god it portrayed. Ezekiel explains the name himself: it is the image “which provoketh to jealousy.” The Hebrew word for “image,” *semel*, means an “image, statue,” and the phrase is “the statue of jealousy.” Ezekiel uses the word only in these two verses.

      The word is rare elsewhere too. Moses used it when he warned Israel against making “a graven image, the similitude of any figure” ([[Deut. 4:16]]). The Chronicler uses it for the idol Manasseh put in the temple: “he set a carved image, the idol which he had made, in the house of God” ([[2 Chr. 33:7]]). Kings, telling of the same act, has “a graven image of the grove” ([[2 Kgs. 21:7]]), and a “grove” in the King James Version is an Asherah, “either a living tree or a tree-like pole, set up as an object of worship.” Josiah later brought the grove out of the house and burned it ([[2 Kgs. 23:6]]). Whether Ezekiel sees that idol restored, or another like it, is not said.

      The second commandment speaks of images and of jealousy together. Israel was not to bow to images, “for I the LORD thy God am a jealous God” ([[Ex. 20:5]]), and the song of Moses foresaw the breach: “They provoked him to jealousy with strange gods” ([[Deut. 32:16]]).
    sources: [bdb, oshb-wlc, lds-scriptures, bd-grove]

  - ref: 6
    phrase: 'that I should go far off from my sanctuary'
    kind: scripture
    title: 'The Lord driven from His own house'
    body: |
      The one who goes far off is the Lord, and the next three chapters show Him go. The King James wording can be read more than one way. Modern translations make it plain: the abominations are committed “to drive me far from my sanctuary.”

      When the words are spoken the Lord has not gone. Two verses earlier “the glory of the God of Israel was there.” The stages of its leaving are set out in the note on [[Ezek. 11:23]].

      The vision carried a lesson for the exiles. The people had defiled the temple and trusted in it instead of God, and they needed to learn that His presence is not confined to it (see the note on [[Ezek. 1:28]]). In the middle of the vision He promises the scattered people, “yet will I be to them as a little sanctuary in the countries where they shall come” ([[Ezek. 11:16]]).
    sources: [esv, nrsvue, lds-scriptures, sc-knowhy-719]

  - ref: 8
    phrase: 'dig now in the wall'
    kind: symbol
    title: 'Why Ezekiel has to dig, and whether the scenes are literal'
    body: |
      Ezekiel has to dig through a wall to reach the second scene, and in verse 12 the Lord says what he finds behind it: this is what the elders do “in the dark.” The room is “so completely hidden in the wall” that the prophet must enlarge the hole before he can even see its door.

      That raises a question about the whole chapter: is Ezekiel shown ceremonies actually going on in the temple that day? He is seeing a vision, and one reading takes the four scenes as belonging “to the visionary drapery of this divine revelation” and not as a report of rites all being held in the temple at that hour. A cell at a gate could not have held seventy-one men at a service, yet the prophet sees them standing together. On this reading the hidden chamber gathers into one picture “what the elders of the people were doing secretly throughout the whole land,” and the temple is the stage because it was the place where Israel was called to worship the Lord. The text itself does not say this.

      That the temple itself was defiled, scripture says plainly. Jeremiah, who was in Jerusalem, says of these years, “they have set their abominations in the house which is called by my name, to pollute it” ([[Jer. 7:30]]). Chronicles, telling of the kingdom’s last years, says that the chief priests and the people “polluted the house of the LORD which he had hallowed in Jerusalem” ([[2 Chr. 36:14]]).
    sources: [keil-ezekiel, lds-scriptures]

  - ref: 10
    phrase: 'every form of creeping things, and abominable beasts'
    kind: history
    title: 'Pictures of animals on the wall'
    body: |
      The wall is covered with pictures of animals, and the text does not say which religion they came from. Moses’ warning against images names “the likeness of any thing that creepeth on the ground” ([[Deut. 4:18]]).

      The pictures have been thought “very likely” to be “the objects of Egyptian adoration,” since such figures are found painted “on the walls of the tombs of the kings and nobles of Egypt.” Ezekiel’s own summary is wider than any one nation: besides the animals there were “all the idols of the house of Israel.”
    sources: [clarke-ezekiel, lds-scriptures]

  - ref: 11
    phrase: 'seventy men of the ancients of the house of Israel'
    kind: history
    title: 'Seventy elders and a son of Shaphan'
    body: |
      The seventy stand for the whole nation, and the one man named, Jaazaniah, was the son of a Shaphan who was probably the scribe of Josiah’s day. The word translated “ancients” is the ordinary Hebrew word for elders. Their number is the number Moses took up Sinai, “seventy of the elders of Israel” ([[Ex. 24:9]]), and the number the Lord told him to gather to share his burden ([[Num. 11:16]]). So the “seventy elders represent the whole nation.”

      Jaazaniah is a different man from “Jaazaniah the son of Azur” ([[Ezek. 11:1]]). His father is “probably” the Shaphan of Josiah’s day. That Shaphan was the scribe to whom the high priest handed the newly found book of the law ([[2 Kgs. 22:8]]). Sons of Shaphan appear in Jeremiah on the prophet’s side. Ahikam kept Jeremiah from being put to death ([[Jer. 26:24]]). Elasah carried Jeremiah’s letter to these same exiles ([[Jer. 29:3]]). It was in the temple chamber of Gemariah that Baruch read Jeremiah’s roll aloud ([[Jer. 36:10]]), and Gemariah then begged the king not to burn it ([[Jer. 36:25]]). Why Jaazaniah is named the text does not say, and it is “impossible to decide.”
    sources: [keil-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 12
    phrase: 'in the chambers of his imagery'
    kind: words
    title: 'Rooms of images, and the excuse that the Lord does not see'
    body: |
      The “chambers of his imagery” are rooms of carved or painted images, and the elders’ excuse is that the Lord cannot see into them. Imagery here is not imagination. The Hebrew word, *maskith*, is a “show-piece, specifically carved figure, of idolatrous symbols,” and the phrase is rendered “in his room of pictures” or “in his room of images.”

      Their saying has two halves. The first is “The LORD seeth us not.” The second is that He “hath forsaken the earth,” where the Hebrew word also means “land,” so that some translations have “has forsaken the land.” The same saying is quoted again in the next chapter with the halves reversed ([[Ezek. 9:9]]). Isaiah quotes a like saying from his own day: “their works are in the dark, and they say, Who seeth us? and who knoweth us?” ([[Isa. 29:15]]). The elders’ saying was a rationalization, the claim “that the Lord had left the earth and could not see their wrongdoings.”

      The chapter contradicts both halves. The glory of the Lord is standing in the temple in verse 4, and the Lord shows the prophet what is done behind the wall.
    sources: [bdb, oshb-wlc, esv, nrsvue, sc-knowhy-637, lds-scriptures]

  - ref: 14
    phrase: 'women weeping for Tammuz'
    kind: history
    title: 'Who Tammuz was'
    body: |
      Tammuz was a god worshipped in Babylonia and in Phoenicia whose death was mourned every year, and the women are keeping that mourning at the gate of the Lord’s house. The Greeks knew the same figure as Adonis. He was “the Babylonian god of spring slain by summer heat, or the god of summer slain by winter cold.” In the myth he died young and his bride Istar went down to the underworld to look for him. His death stood for the withering of the spring growth under the summer sun, and women mourned it for seven days.

      The season of the mourning is given in two ways: as the fourth month, June to July, which later bore his name, or as “a festival in the autumn, a lament over the season’s decline.” Ezekiel’s vision is dated to the sixth month, and he does not say whether a festival was under way. This is the only verse in Ezekiel that names the god.
    sources: [bd-tammuz, oshb-wlc, ot-manual-26, lds-scriptures]

  - ref: 16
    phrase: 'with their backs toward the temple of the LORD'
    kind: symbol
    title: 'Backs to the temple, faces to the sun'
    body: |
      The men turn their backs on the temple and bow eastward to the sun, and they do it “between the porch and the altar,” at the door of the house. That is where Joel has the priests stand to weep and pray for the people ([[Joel 2:17]]), facing the temple. These men stand in that spot with their backs to it, “as complete a renunciation” of Jehovah as could be made. Jeremiah used the same picture as a figure of speech, “they have turned unto me the back, and not the face” ([[Jer. 32:33]]).

      The law had named this sin: “and when thou seest the sun, and the moon, and the stars, even all the host of heaven, shouldest be driven to worship them” ([[Deut. 4:19]]). It also had a history in this building. Manasseh “built altars for all the host of heaven in the two courts of the house of the LORD” ([[2 Kgs. 21:5]]), and Josiah removed “the horses that the kings of Judah had given to the sun, at the entering in of the house of the LORD” ([[2 Kgs. 23:11]]). Sun worship was an old Canaanite practice that had come back more recently from Assyria.

      Who the men are is not said. The place was the priests’ place of prayer, but the text calls them only “about five and twenty men,” and the Greek has “about twenty.” A different group of twenty-five, called “princes of the people” ([[Ezek. 11:1]]), appears at the east gate.
    sources: [ot-manual-26, lxx-rahlfs, lds-scriptures]

  - ref: 17
    phrase: 'they put the branch to their nose'
    kind: words
    title: 'The branch to the nose'
    body: |
      What putting the branch to the nose was is not known for certain. The Hebrew word, *zemorah*, is a “branch, twig, shoot,” used elsewhere in Ezekiel of the branch of a vine ([[Ezek. 15:2]]). Its use in this verse is marked “custom obscure” and “text dubious.”

      The usual explanation makes it one more act of sun worship. Persian sun-worshippers, on this account, “held bunches of the twigs of certain trees before their mouths, that they might not contaminate the sun with their breath.”

      The objections are worth knowing. The explanation has been said to suit “neither the context nor the words.” The word means a vine shoot and not the Persian bundle. That bundle was held before the mouth and not put to the nose. And the clause follows the charge of violence, where a new rite is not expected. On that view the phrase is a proverb whose origin and meaning “have not yet been satisfactorily explained.” The ancient Greek translators found no branch here at all. They wrote, “behold, these are as scorners.”

      The drift of the verse does not depend on the answer. The clause stands as the final item in a list of ways Judah has “returned to provoke me to anger.”
    sources: [bdb, ot-manual-26, keil-ezekiel, lxx-rahlfs, lds-scriptures]

  - ref: 18
    phrase: 'though they cry in mine ears with a loud voice'
    kind: scripture
    title: 'The cry that will not be heard'
    body: |
      The chapter ends with the Lord refusing ahead of time to hear the people’s cries when the judgment comes. The wording is picked up at once. The people will cry in His ears with a loud voice and not be heard; in the next verse, “He cried also in mine ears with a loud voice” ([[Ezek. 9:1]]), and that cry summons the men who are to strike the city. The words “mine eye shall not spare” are repeated when the judgment is carried out ([[Ezek. 9:10]]).

      Jeremiah was given the same word for the same people: “though they shall cry unto me, I will not hearken unto them” ([[Jer. 11:11]]).
    sources: [lds-scriptures]

christ: |
  The one who leads Ezekiel through the temple calls it “my sanctuary” (verse 6): He is the Lord (see the note on [[Ezek. 1:26]]).

  He does not abandon the house for good. The glory that leaves in chapter 11 returns in chapter 43, and He says of the temple Ezekiel sees there that it is “the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Israel for ever” ([[Ezek. 43:7]]).

explore: |
  - The rest of this vision: the mark and the slaughter ([[Ezek. 9]]), the glory leaving the temple ([[Ezek. 10]]), and its departure from the city with the promise of a new heart ([[Ezek. 11:16–23]]).
  - The glory’s return by the east gate: [[Ezek. 43:1–9]].
  - Manasseh’s idols in the temple and Josiah’s removal of them: [[2 Kgs. 21:1–9]] and [[2 Kgs. 23:4–14]].
  - Jeremiah’s temple sermon, preached in the city Ezekiel is shown: [[Jer. 7:1–20]].
  - Moses’ warning against images of creatures and the worship of the sun: [[Deut. 4:15–24]].
  - Elders who come to inquire with “idols in their heart”: [[Ezek. 14:1–8]].

