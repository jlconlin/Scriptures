chapter: 28
title: 'A Man, and Not God'
tagline: 'The ruler of Tyre has said in his heart, “I am a God.” The Lord answers him twice, once with a sentence of death and once with a lament that tells his fall as a casting out of Eden. Then Zidon is judged, and Israel is promised a safe home.'
when: 'No date of its own. The chapter stands under the heading of 26:1, “the eleventh year, in the first day of the month,” counted like the book’s other dates from Jehoiachin’s captivity (about 586 B.C.). The next date in the book, at 29:1, is the tenth year, which is earlier: the dates in chapters 25–32 are not in order.'

setting: |
  Chapters 25–32 turn from Jerusalem to its neighbours, the “prophecies against Israel’s enemies”: Ammon, Moab, Edom, Philistia, Tyre, Sidon, and Egypt. Chapter 26 states the charge, that Tyre said “Aha” over broken Jerusalem and expected to gain by it ([[Ezek. 26:2]]), and names Nebuchadrezzar as the one the Lord will bring against the city ([[Ezek. 26:7]]). Chapter 27 is a lamentation for the city. This chapter finishes the three with two words to Tyre’s ruler, and then adds a short word against Zidon and a promise to Israel.

  Tyre is the seaport introduced in [[Ezek. 26]], a city of the Phoenicians, a commercial people with trading stations all over the Mediterranean. Zidon, the other Phoenician city judged here, had in ancient times been the most important of them (see the note on [[Ezek. 28:24]]).

  Ezekiel speaks among the exiles in Babylonia. The year that stands over these chapters, about 586 B.C., is the year of the second large deportation from Judah.

thread: |
  The chapter is about a heart “lifted up,” and it says so three times (verses 2, 5, and 17). In the first word to the ruler of Tyre, his wisdom has brought him riches, and his heart is lifted up because of the riches. In the second he is full of wisdom and perfect in beauty, in the garden of God, and his heart is lifted up because of his beauty. The Lord’s answer each time is a fall: down “to the pit” (verse 8), “to the ground” (verse 17), “to ashes upon the earth” (verse 18).

  The first word (verses 1–10) is a sentence. It quotes the boast, answers it in one line, “yet thou art a man, and not God,” and ends with the question the prince will face when the sword arrives: “Wilt thou yet say before him that slayeth thee, I am God?” The second (verses 11–19) is a lamentation, and it tells the same fall with the scenery of Eden.

  The last seven verses turn. Zidon is judged in a few lines, and verse 24 looks back over all the neighbours as briers and thorns that will prick Israel no more. Then Israel hears a promise. “They shall know that I am the LORD,” in one form or another, comes four times in these verses (22, 23, 24, 26).

sections:
  - range: 1-10
    heading: 'The prince who said, I am a God'
    plain: |
      The word of the Lord comes to Ezekiel again. He is to say to the prince of Tyrus: Because your heart is lifted up, and you have said, I am a God, I sit in the seat of God in the midst of the seas (though you are a man and not God, and set your heart as the heart of God); you are wiser than Daniel, and no secret is hidden from you; by your wisdom and understanding you have gained riches and put gold and silver in your treasuries; by your great wisdom and your trade you have increased your riches, and your heart is lifted up because of them. Therefore, because you have set your heart as the heart of God, the Lord will bring strangers on you, the terrible of the nations. They will draw their swords against the beauty of your wisdom and defile your brightness. They will bring you down to the pit, and you will die the deaths of the slain in the midst of the seas. Will you still say, I am God, before the one who kills you? You will be a man, and no God, in his hand. You will die the deaths of the uncircumcised by the hand of strangers. The Lord God has spoken it.
  - range: 11-19
    heading: 'A lament for the king in Eden'
    plain: |
      The word of the Lord comes again: Take up a lamentation over the king of Tyrus. Say to him: You seal up the sum, full of wisdom and perfect in beauty. You have been in Eden, the garden of God. Every precious stone was your covering: sardius, topaz, diamond, beryl, onyx, jasper, sapphire, emerald, carbuncle, and gold. The workmanship of your tabrets and pipes was prepared in you on the day you were created. You are the anointed cherub that covers, and I set you so. You were on the holy mountain of God; you walked up and down among the stones of fire. You were perfect in your ways from the day you were created, until iniquity was found in you. By the multitude of your merchandise they filled you with violence, and you sinned. So I will cast you as profane out of the mountain of God and destroy you, covering cherub, from among the stones of fire. Your heart was lifted up because of your beauty; you corrupted your wisdom because of your brightness. I will cast you to the ground and lay you before kings, for them to look at. You have defiled your sanctuaries by your many iniquities, by the iniquity of your trade. So I will bring a fire out of the midst of you to devour you, and bring you to ashes on the earth in the sight of all who see you. All who know you among the peoples will be astonished at you. You will be a terror, and you will never be any more.
  - range: 20-24
    heading: 'Against Zidon'
    plain: |
      The word of the Lord comes again: Set your face against Zidon and prophesy against it. The Lord God says: I am against you, Zidon, and I will be glorified in the midst of you. They will know that I am the Lord when I have executed judgments in her and am sanctified in her. I will send pestilence into her and blood into her streets, and the wounded will be judged in the midst of her by the sword on every side; and they will know that I am the Lord. The house of Israel will no longer have a pricking brier or a grieving thorn among all those around them who despised them, and they will know that I am the Lord God.
  - range: 25-26
    heading: 'Israel gathered and safe'
    plain: |
      The Lord God says: When I have gathered the house of Israel from the peoples among whom they are scattered, and am sanctified in them in the sight of the heathen, they will dwell in their land, the land I gave to my servant Jacob. They will dwell there safely, and build houses and plant vineyards. They will dwell with confidence when I have executed judgments on all those around them who despise them, and they will know that I am the Lord their God.

notes:
  - ref: 2
    phrase: 'the prince of Tyrus'
    kind: history
    title: 'The ruler of Tyre'
    body: |
      The man addressed is the ruler of Tyre, called “prince” here and “king” in verse 12, and the chapter never gives his name. The Hebrew word here is *nagid*, a leader or ruler, and this verse is classed as a use of it “of a foreign ruler.” It is the only time the word appears in Ezekiel. Verse 12 has the ordinary word for a king, *melek*. The text does not say why the title changes between the two oracles.

      A name can be supplied from outside the Bible. Josephus, quoting what he calls “the records of the Phenicians,” has this entry: “Nabuchodonosor besieged Tyre for thirteen years, in the days of Ithobal, their King.” If that record is right, Ithobal was on the throne when Babylon’s army came.

      The oracle has been read as reaching past the one man. On that reading it applies “not to the one king, Ithobal,” but “to the king as the founder and creator of the might of Tyre,” the holder of “that royalty which was to perish along with Tyre itself.”
    sources: [oshb-wlc, bdb, josephus-apion, keil-ezekiel, lds-scriptures]

  - ref: 2
    phrase: 'in the midst of the seas'
    kind: symbol
    title: 'A throne in the heart of the seas'
    body: |
      The prince sets his throne “in the midst of the seas,” where the chapter before places his city, and the oracle makes that same place his grave. The Hebrew is “in the heart of the seas.” The chapter before this one describes Tyre so: “Thy borders are in the midst of the seas” ([[Ezek. 27:4]]). He calls his place there “the seat of God,” or, as one modern translation has it, “the seat of the gods.”

      The reply is four Hebrew words: “thou art a man, and not God.” “Man” is *adam*, the word in “son of man” (*ben adam*), the name by which Ezekiel has just been addressed in the same verse (see the note on [[Ezek. 2:1]]).

      Verse 8 then brings the phrase back. The strangers will bring him down to the pit, and he will die “in the midst of the seas,” the same Hebrew words as in the boast. Verse 9 asks whether he will repeat his claim “before him that slayeth thee,” and answers for him: “thou shalt be a man, and no God.”
    sources: [oshb-wlc, esv, lds-scriptures]

  - ref: 3
    phrase: 'thou art wiser than Daniel'
    kind: history
    title: 'Daniel, the measure of wisdom'
    body: |
      Ezekiel measures the prince against Daniel, a fellow exile who was then serving at the court of Babylon. He is taken to be the Daniel “who was a contemporary of Ezekiel in Babylon,” and this verse is counted among the references to “the hero of the book of Daniel.” Ezekiel has named him once already, with Noah and Job, for righteousness ([[Ezek. 14:14]]). Here he is named for wisdom.

      The book of Daniel tells of that wisdom. Of Daniel and his friends it says, “God gave them knowledge and skill in all learning and wisdom” ([[Dan. 1:17]]). Nebuchadnezzar found them “ten times better than all the magicians and astrologers that were in all his realm” ([[Dan. 1:20]]), and called Daniel’s God “a revealer of secrets” ([[Dan. 2:47]]).

      How the sentence should be heard is not agreed. The King James Version and modern translations make it a statement (“you are indeed wiser than Daniel”). The ancient Greek translation makes it a question: “art thou wiser than Daniel?”
    sources: [ot-manual-26, bd-daniel, lxx-rahlfs, esv, nrsvue, lds-scriptures]

  - ref: 5
    phrase: 'thine heart is lifted up because of thy riches'
    kind: scripture
    title: 'From wisdom to riches to pride'
    body: |
      Verses 4 and 5 trace the prince’s pride step by step: wisdom produced trade, trade produced riches, and the riches lifted up his heart. The lament goes over the same ground (verses 16–18) and adds what the trade did to the city: “they have filled the midst of thee with violence.” “Traffick” is the Hebrew word for merchandise or business dealings.

      Verse 12 still calls the king “full of wisdom.” What is charged, each time, is the heart: “thine heart is lifted up” (verses 2 and 5), “Thine heart was lifted up because of thy beauty” (verse 17).

      Two other passages set wisdom and riches side by side. Zechariah speaks of “Tyrus, and Zidon, though it be very wise” ([[Zech. 9:2]]): Tyre “heaped up silver as the dust” ([[Zech. 9:3]]), and “she shall be devoured with fire” ([[Zech. 9:4]]). And Jacob, in the Book of Mormon, speaks of the learned and the rich together. The learned “think they are wise” and set aside the counsel of God ([[2 Ne. 9:28]]), though “to be learned is good if they hearken unto the counsels of God” ([[2 Ne. 9:29]]); and he names in one breath “the wise, and the learned, and they that are rich, who are puffed up because of their learning, and their wisdom, and their riches” ([[2 Ne. 9:42]]).
    sources: [lds-scriptures, esv]

  - ref: 10
    phrase: 'the deaths of the uncircumcised'
    kind: words
    title: 'The deaths of the uncircumcised'
    body: |
      To die “the deaths of the uncircumcised” has been explained as dying violently, as the godless die. It is “such a death as godless men die,” “a violent death”: the king “who looks upon himself as a god, shall perish by the sword like a godless man.” The plural, “deaths,” here and in verse 8, has been taken to heighten the word: “a death so painful as to be equivalent to dying many times.”

      Ezekiel uses the phrase again for Egypt. Pharaoh is told, “thou shalt lie in the midst of the uncircumcised with them that be slain by the sword” ([[Ezek. 31:18]]), and “go down, and be thou laid with the uncircumcised” ([[Ezek. 32:19]]).

      The “strangers” who will do it are “the terrible of the nations” (verse 7), taken to be the Chaldean army, as chapter 26 has already named Nebuchadrezzar ([[Ezek. 26:7]]).
    sources: [keil-ezekiel, lds-scriptures]

  - ref: 12
    phrase: 'Thou sealest up the sum'
    kind: words
    title: 'The seal of perfection'
    body: |
      The two Hebrew words behind “Thou sealest up the sum” are uncertain; the renderings offered make the king a pattern, or a seal, of perfect proportion. They have been rendered “one sealing up (the) measure,” that is, “exhibiting perfect proportion,” or, as some manuscripts read, “the seal of (perfect) proportion,” with the caution, “but dubious.” Modern translations take the second course, “You were the signet of perfection,” with a note that the meaning of the Hebrew is uncertain. The ancient Greek translation has “a seal of resemblance.”

      “Perfect in beauty” is clearer, and it is Tyre’s own phrase. In the lament of the chapter before, the city says, “I am of perfect beauty” ([[Ezek. 27:3]]), with the same two Hebrew words (see the note there).

      This is a lamentation (Hebrew *qinah*), and it begins with what the king was before it tells what he became. Ezekiel is to say it “unto him,” to the king himself. For the form, see the note on [[Ezek. 19:1]].
    sources: [bdb, oshb-wlc, esv, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 13
    phrase: 'Thou hast been in Eden the garden of God'
    kind: scripture
    title: 'The king of Tyre in Eden'
    body: |
      The lament is upon the king of Tyre, and it tells his rise and fall as the story of Eden: he was created, set in the garden of God, blameless “till iniquity was found” in him, and then cast out. Readers have also seen Adam behind the figure, and some have seen Lucifer.

      **The king of Tyre.** This is what the text says. The lament is “upon the king of Tyrus” (verse 12), and the sins it names are a merchant’s: “the multitude of thy merchandise,” “the iniquity of thy traffick.” Naming Eden implies that Tyre had been thought an earthly paradise. Ezekiel uses Eden of other powers as well. Of Assyria, pictured as a cedar, he writes that “all the trees of Eden, that were in the garden of God, envied him” ([[Ezek. 31:9]]), and Pharaoh is to be “brought down with the trees of Eden” ([[Ezek. 31:18]]).

      **Adam.** The king’s story is told in the shape of Adam’s: “As Adam was created sinless, so was the prince of Tyre innocent in his conduct in the day of his creation, but only until perverseness was found in him.” The lament has been called “probably the most widely recognized parallel to Genesis 2-3 in all the Bible.” That bears on the Book of Mormon, where Lehi, Ezekiel’s contemporary, teaches the Fall at length ([[2 Ne. 2:17–25]]): “hints of the doctrine can be found in Old Testament writings that likely come from before or around Lehi’s time,” and this lament is counted among them.

      **Lucifer.** The words “Thou art the anointed cherub” have led some readers to see a heavenly being here, one “whose fall is similar to Satan’s fall in Isaiah 14:12-15.” That reading takes the king to be the cherub, at a point where the text is uncertain (see the note on [[Ezek. 28:14]]); on the other view, “Adam was the being cast out of Eden, and the cherub was the guardian.” The name Lucifer “appears only once in the Bible,” at [[Isa. 14:12]], in a taunt that is likewise addressed to an earthly king (see the note there), and it is latter-day revelation that “clarifies the fall of Lucifer”: he was “an angel of God who was in authority in the presence of God” ([[D&C 76:25]]) who rebelled. The reading is given here as one that some hold, not as what the lament means.

      Because the lament has been read of both falls, it has been called “one of the most powerful indications of what Jerusalem’s people believed in the days of Lehi,” who uses both stories in the one sermon.
    sources: [lds-scriptures, keil-ezekiel, pritchett-fall, sc-knowhy-28, bd-lucifer]

  - ref: 13
    phrase: 'every precious stone was thy covering'
    kind: symbol
    title: 'Nine stones from the high priest’s breastplate'
    body: |
      All nine stones named here are among the twelve set in the breastplate of Israel’s high priest. In the King James names they are the first, second, and fourth rows of [[Ex. 28:17–20]]; the third row (a ligure, an agate, and an amethyst) is missing. The ancient Greek translation of this verse has those three as well, “and ligure, and agate, and amethyst,” and so names twelve stones.

      The figure in the garden has accordingly been described as one who “wore a breastplate like that of the high priest, with precious stones.” It remains a reading. The Hebrew list has nine stones and not twelve, and in a different order from Exodus, and the verse itself says only that the stones were his “covering.”

      The “tabrets” and “pipes” that follow may not be musical instruments. The first Hebrew word is the usual one for a timbrel, but the second is explained as a “technical term of jeweller’s work,” and the pair is rendered “thy settings and thy sockets.” A modern translation follows, “crafted in gold were your settings,” with a note that the meaning is uncertain. On that reading the whole sentence is about the jewels and how they were mounted.
    sources: [lds-scriptures, lxx-rahlfs, sc-knowhy-400, bdb, esv]

  - ref: 14
    phrase: 'the anointed cherub that covereth'
    kind: words
    title: 'The cherub: the king himself, or his guardian?'
    body: |
      The Hebrew of this verse is uncertain, and the Hebrew text and the ancient Greek translation differ over whether the king is called a cherub or was placed beside one. The Hebrew text as it has come down makes him the cherub, and the King James Version follows it. So do some modern translations, with a caution: one has “guardian cherub,” with a note that the meaning of the phrase is uncertain. The ancient Greek translation reads, “From the day that thou wast created thou wast with the cherub,” and in verse 16, where the King James Version has the Lord destroying the “covering cherub,” the Greek has “the cherub has brought thee out of the midst of the stones of fire.”

      Where the cherub is the garden’s guardian and not the king, the one cast out has been taken to be Adam and not a fallen heavenly being (see the note on [[Ezek. 28:13]]). Genesis has such a guardian: after Adam was driven out, the Lord “placed at the east of the garden of Eden Cherubims” ([[Gen. 3:24]]).

      Two words in the phrase are worth knowing. “Anointed” translates a word found nowhere else in the Bible and marked “dubious.” “That covereth” is the verb used of the cherubim over the ark, “covering the mercy seat with their wings” ([[Ex. 25:20]]). Cherubim in scripture are found in the Holy of Holies and keeping the way of the tree of life (for cherubim, see the note on [[Ezek. 1:5]]).

      The place has two names as well. The lament calls it “Eden the garden of God” in verse 13 and “the holy mountain of God” here, and so “equates” the two: the garden is on a mountain. What the “stones of fire” are, the text does not say.
    sources: [esv, lxx-rahlfs, bdb, oshb-wlc, bd-cherubim, pritchett-fall, sc-knowhy-402, lds-scriptures]

  - ref: 19
    phrase: 'never shalt thou be any more'
    kind: history
    title: 'The last line, spoken to the king'
    body: |
      The lament ends with the sentence that closed the two chapters on Tyre itself, now said to its king. Chapter 26 ends “thou shalt be no more” ([[Ezek. 26:21]]) and chapter 27 “never shalt be any more” ([[Ezek. 27:36]]). For the line and for what became of the city, see the notes on [[Ezek. 27:36]] and [[Ezek. 26:14]].

      Ezekiel’s one later word on the siege speaks of the army and not of the king: of Nebuchadrezzar it says, “yet had he no wages, nor his army, for Tyrus” ([[Ezek. 29:18]]), which is understood to mean that he had not been able to conquer the island city.

      The Phoenician record that Josephus quotes goes a little further (see the note on [[Ezek. 28:2]]). After Ithobal, it says, “reigned Baal, ten years.” Then, in place of a king, “were Judges appointed, who judged the people,” several of them for only a few months, and after that the Tyrians “sent and fetched Merbalus from Babylon” to reign. The record does not say what happened to Ithobal himself.
    sources: [lds-scriptures, josephus-apion, ot-manual-27]

  - ref: 24
    phrase: 'a pricking brier unto the house of Israel'
    kind: history
    title: 'Zidon, and the brier and the thorn'
    body: |
      Zidon, “sometimes spelled Sidon,” was the other Phoenician city judged here, on the border of the tribe of Asher “but was never occupied by that tribe”: Asher did not drive out the inhabitants of Accho, “nor the inhabitants of Zidon” ([[Judg. 1:31]]). In ancient times it was “the most important city of Phoenicia,” so that the Old Testament often calls Phoenicians simply Zidonians.

      The brier and the thorn are Moses’s image. Of the peoples Israel would let remain in the land he said that they “shall be pricks in your eyes, and thorns in your sides” ([[Num. 33:55]]). Verse 24 says of all the neighbours who despised Israel that there will be “no more” such a brier or thorn.

      Zidon was also Jezebel’s city. Ahab “took to wife Jezebel the daughter of Ethbaal king of the Zidonians, and went and served Baal” ([[1 Kgs. 16:31]]). Phoenician religion’s “influence over the Israelites was disastrous, especially after the marriage of Ahab to Jezebel, a Phoenician princess.”

      Unlike the oracles before it, this one names no particular offence. Ammon is charged with saying “Aha” over the sanctuary ([[Ezek. 25:3]]), and Tyre with saying it over Jerusalem ([[Ezek. 26:2]]). Of Zidon the text says only that the Lord is against her, and verse 24 widens the judgment to “all that are round about them, that despised them.”
    sources: [bd-zidon, bd-phoenicia, lds-scriptures]

  - ref: 25
    phrase: 'shall be sanctified in them in the sight of the heathen'
    kind: scripture
    title: 'Sanctified in Zidon, sanctified in Israel'
    body: |
      The Lord says twice in four verses that He will be “sanctified,” once in Zidon by judging her (verse 22) and once in Israel by gathering them (verse 25), and the Hebrew verb is identical in the two places. A modern translation has “manifest my holiness in her” and “manifest my holiness in them.” The repeated word has been read as setting “the future fate of Israel in antithesis” to the fate of all the nations judged in these chapters, and verse 24 as the summing up of “the design of God’s judgments upon all the neighbouring nations which are threatened in Ezekiel 25-28.”

      So the nations learn who the Lord is in two ways, and both are done before their eyes. They see His judgments on themselves. Then they see a scattered people brought home, living in “their land that I have given to my servant Jacob,” building houses and planting vineyards. “Safely” and “with confidence” in verse 26 are the same Hebrew expression, said twice.

      The phrase is one of Ezekiel’s own. He has used it before of the gathering: “I will be sanctified in you before the heathen” ([[Ezek. 20:41]]). It returns in the chapter of the new heart, where the Lord says the nations will know Him “when I shall be sanctified in you before their eyes” ([[Ezek. 36:23]]).
    sources: [keil-ezekiel, oshb-wlc, esv, lds-scriptures]

christ: |
  The chapter closes with Israel dwelling “safely” in the land (verse 26), and the same words stand in two prophecies of the Messiah. One is Jeremiah’s prophecy of the righteous Branch of David: “In his days Judah shall be saved, and Israel shall dwell safely” ([[Jer. 23:6]]). The other is Ezekiel’s own chapter of the shepherds, where the flock is given “one shepherd” ([[Ezek. 34:23]]) and “they shall dwell safely, and none shall make them afraid” ([[Ezek. 34:28]]). That shepherd is understood to be Jesus Christ, the Good Shepherd.

explore: |
  - The two chapters this one completes: the charge against Tyre and the siege foretold, [[Ezek. 26]]; the lamentation for the city, [[Ezek. 27]].
  - The taunt against the king of Babylon, another ruler who said in his heart that he would be like God: [[Isa. 14:4–20]], with the note on [[Isa. 14:12]].
  - Eden and the cherubim placed at its gate: [[Gen. 2:8–15]] and [[Gen. 3:22–24]].
  - The high priest’s breastplate and its twelve stones: [[Ex. 28:15–21]].
  - Eden used again of a great power, Pharaoh set beside Assyria: [[Ezek. 31]].
  - What the book says later of the siege of Tyre: [[Ezek. 29:17–20]].
  - The learned and the rich in Jacob’s sermon: [[2 Ne. 9:28–29]], [[2 Ne. 9:42]].
  - The promise of this chapter’s last two verses at full length: [[Ezek. 34:25–31]] and [[Ezek. 36:22–28]].

