chapter: 1
title: The Heavens Were Opened
tagline: By a canal in Babylonia, five years into the exile, a priest sees a storm come out of the north, four living creatures, wheels full of eyes, and above them a throne. Only in the last verse does he say what it is, the glory of the LORD.
when: 'The fifth day of the fourth month in the fifth year of King Jehoiachin’s captivity, about 592 B.C. Verse 1 also calls it “the thirtieth year,” which the text does not explain.'

setting: |
  Ezekiel was a priest carried to Babylonia with King Jehoiachin in about 597 B.C., when Nebuchadnezzar took from Jerusalem “all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and smiths” ([[2 Kgs. 24:14]]). He settled among the exiles in Babylonia and prophesied there for about twenty-two years, from about 592 to 570 B.C. This chapter is where that begins.

  Jerusalem and its temple were still standing. Jeremiah was warning Judah there before the city’s destruction, and had written to these same exiles ([[Jer. 29:1]]). Daniel was in the royal court at Babylon, and Lehi was commanded in the same years to leave Jerusalem for a promised land. Ezekiel’s people were the deported community itself. They had been taken from the land and the temple.

  Chapters 1–3 are one experience: the vision of God in His glory (chapter 1), and the call given by the voice that begins to speak in verse 28 (chapters 2–3). The vision comes back later in the book: in the plain ([[Ezek. 3:23]]); in the temple, where the creatures are named cherubim and the glory departs (chapters 8–11); and in the temple to come, where the glory returns ([[Ezek. 43:1–5]]).

thread: |
  The chapter answers a question it never states: **can the Lord be found in Babylonia?**

  Ezekiel tells what he saw in the order he saw it, from the outside in and from the ground up. First a storm wind out of the north, with cloud and fire (verse 4). Out of the fire, four living creatures, each with four faces and four wings (verses 5–14). Beside them on the ground, four wheels with rims full of eyes (verses 15–21). Over the creatures’ heads, an expanse like ice (verses 22–25). Above the expanse, a throne; on the throne, a figure like a man, wrapped in fire and ringed with a brightness like a rainbow (verses 26–28). He does not name any of it until the end: “This was the appearance of the likeness of the glory of the LORD.” Then he falls on his face.

  Two things stand out in the telling. The first is motion. The creatures go “straight forward” and do not turn; the wheels go wherever the creatures go; one spirit moves them all. What Ezekiel describes moves, throne and all. The second is restraint. Ezekiel piles up *likeness* and *appearance* until, at the throne, he is three removes from saying he saw the Lord.

  What each creature, face and wheel stands for is another matter, and it has not been revealed. What the text itself names is the thing at the top: the glory of the Lord on His throne, which likely assured Ezekiel that the Lord could still be with a people in exile. The vision has also been read as a pledge that the judgment falling on the kingdom would not take away what mattered most.

sections:
  - range: 1-3
    heading: The date and the place
    plain: |
      In the thirtieth year, on the fifth day of the fourth month, while I was among the exiles by the river Chebar, the heavens were opened and I saw visions of God. (That fifth day of the month was in the fifth year of King Jehoiachin’s captivity.) The word of the Lord came to Ezekiel the priest, the son of Buzi, in the land of the Chaldeans by the river Chebar, and the hand of the Lord was on him there.
  - range: 4-14
    heading: The storm and the four living creatures
    plain: |
      I looked, and a storm wind was coming out of the north: a great cloud, fire folding in on itself, brightness around it, and in the middle of the fire something that gleamed like amber. Out of it came what looked like four living creatures. They had a human form, but each had four faces and four wings. Their feet were straight, the soles like the sole of a calf’s foot, and they sparkled like burnished brass. Under their wings on each of the four sides they had human hands. Their wings touched one another. They did not turn as they moved; each went straight ahead. Each had the face of a man, with a lion’s face on the right, an ox’s face on the left, and an eagle’s face. Two wings of each were stretched upward and joined its neighbor’s, and two covered its body. Wherever the spirit was going, they went, without turning. In among them was something like burning coals, like torches moving back and forth, and lightning came out of the fire. The creatures darted to and fro like flashes of lightning.
  - range: 15-21
    heading: The wheels
    plain: |
      As I watched the creatures, I saw a wheel on the ground beside each of them. The wheels gleamed like beryl, and all four looked alike; they were made as if one wheel were inside another. They could go toward any of their four sides without turning. Their rims were high and dreadful, and all four rims were full of eyes all around. When the creatures moved, the wheels moved beside them; when the creatures rose from the ground, the wheels rose too. Wherever the spirit was going, they went, and the wheels rose with them, because the spirit of the living creatures was in the wheels. When those moved, these moved; when those stood still, these stood still.
  - range: 22-25
    heading: The expanse and the sound of wings
    plain: |
      Over the heads of the living creatures was something like an expanse, fearsome, gleaming like crystal, stretched out above them. Under it their wings were stretched straight toward one another, and each had two that covered its body. When they moved I heard the sound of their wings, like the sound of great waters, like the voice of the Almighty, a sound of speech, like the noise of a host. When they stood still they let their wings down. And a voice came from above the expanse over their heads.
  - range: 26-28
    heading: The throne and the glory of the Lord
    plain: |
      Above the expanse was what looked like a throne, like sapphire, and on it a likeness like the appearance of a man. From his waist upward I saw something like gleaming amber, like fire all around within it; from his waist downward I saw something like fire; and there was brightness around him. The brightness around him looked like the bow that appears in the cloud on a day of rain. This was the appearance of the likeness of the glory of the Lord. When I saw it, I fell on my face, and I heard a voice speaking.

notes:
  - ref: 1
    phrase: in the thirtieth year
    kind: history
    title: Thirty years from what?
    body: |
      The text does not say what the thirtieth year is counted from, and no answer has been established. What can be said is that verses 1 and 2 give one date in two ways. Both name “the fifth day of the month,” so the “thirtieth year” is the fifth year of Jehoiachin’s captivity, which began in about 597 B.C.; that puts the vision at about 592, when Ezekiel’s ministry is dated to begin.

      Three counts have been proposed. One is Ezekiel’s own age: “some scholars have assumed that maybe it was the thirtieth year of his own life,” which would make him about twenty-five when he was carried away. Against it, the month and day that follow have been thought to point to a public reckoning, not a birthday. A second count runs from the era of Nabopolassar, who became king of Babylon thirty years before, but nothing is known of any such era. A third runs from the eighteenth year of King Josiah, when the book of the law was discovered; no trace of a reckoning from that event has been found anywhere else either. Weighed together, the three leave an era that “can no longer be ascertained with certainty.” That is still the honest answer.
    sources: [keil-ezekiel, lund-ezekiel, scripture-helps-ezek]
  - ref: 1
    phrase: the heavens were opened, and I saw visions of God
    kind: scripture
    title: Lehi saw the heavens open in the same years
    body: |
      Lehi, a Book of Mormon prophet called in Jerusalem at about the same time, “saw the heavens open, and he thought he saw God sitting upon his throne, surrounded with numberless concourses of angels” ([[1 Ne. 1:8]]), a close companion to Ezekiel’s opening words. Ezekiel, in Babylonia, sees the heavens opened and then the Lord on His throne, attended by heavenly beings, “just like Lehi did.”

      The likeness runs past the first verse. The two accounts have been set side by side step by step: each opens by fixing the time ([[1 Ne. 1:4]]; verses 1–3), each has a vision of the throne ([[1 Ne. 1:8]]; verses 26–28), each prophet is handed a book ([[1 Ne. 1:11–12]]; [[Ezek. 2:8–10]]), each is then commissioned, and each is rejected by his people. Isaiah’s vision of the Lord enthroned ([[Isa. 6:1–4]]) is the older member of the family, about a century before Lehi.

      The comparison explains something about each book. Nephi says there were “many prophets” in those years ([[1 Ne. 1:4]]); Ezekiel is one of them, and the accounts of his call and of Lehi’s are alike in more than their message about Jerusalem. And a reader who knows 1 Nephi 1 already knows the shape of Ezekiel 1–3: opened heavens, a throne, a book, a hard commission.
    sources: [sc-knowhy-469, sc-knowhy-459, lds-scriptures]
  - ref: 3
    phrase: in the land of the Chaldeans by the river Chebar
    kind: history
    title: A priest among the exiles, by a canal in Babylonia
    body: |
      The Chebar was “a canal or waterway that left the Euphrates River north of Babylon and flowed 60 miles southeast before reentering the Euphrates,” and many of the exiles from Judah lived along it. Ezekiel’s own settlement was Tel-abib ([[Ezek. 3:15]]). The “captives” of verse 1 were a deported community, drawn from the king’s household, the officers and “the mighty of the land” ([[2 Kgs. 24:15]]). Jeremiah’s letter told them, “Build ye houses, and dwell in them” ([[Jer. 29:5]]), and to “seek the peace of the city” where they now lived ([[Jer. 29:7]]).

      Ezekiel is introduced as “the priest,” of the family of Zadok. He is a priest far from the temple, among a people cut off from it. The question such exiles would have asked has been put this way: “Is God’s presence confined to his temple, or can he still be with us here?” The chapter names the place twice in three verses, and the Hebrew adds a small word the King James Version keeps: the hand of the LORD was upon him *there*.

      Verses 2–3 also change voice. Verse 1 is Ezekiel’s “I”; verses 2–3 speak of him as “Ezekiel” and “him,” giving the date by the captivity and naming the prophet; and verse 4 returns to “I.” The text does not say why. The Septuagint, the ancient Greek translation, also names the prophet in verse 3 but ends the verse in the first person: “the hand of the Lord was upon me.”
    sources: [bd-chebar, bd-ezekiel, sc-knowhy-719, lxx-rahlfs, lds-scriptures]
  - ref: 4
    phrase: a whirlwind came out of the north
    kind: symbol
    title: A storm wind from the north
    body: |
      The vision arrives as a storm, and both the storm and its direction would have meant something to an Israelite. “Whirlwind” translates *rûaḥ sĕʿārâ*, a wind of storm: not a wind spinning on its axis but “a furious or powerful wind,” a tempest. With it come cloud, fire, brightness and, in verse 13, lightning, which scripture uses again and again for the presence of God. The nearest likeness is Sinai, where “there were thunders and lightnings, and a thick cloud upon the mount” ([[Ex. 19:16]]); the cloud here has been read as pointing back to that one. On that reading, the God who came down on Sinai to make the covenant is the one arriving on the plain of Babylonia.

      Why from the north? One reading, and it is a reading, takes the direction from the prophets’ own usage. In Jeremiah above all, the north is the quarter from which the enemies who carry out the judgment on Jerusalem break in: “Out of the north an evil shall break forth upon all the inhabitants of the land” ([[Jer. 1:14]]). On that reading, the glory coming from the north says that the Lord Himself is bringing the judgment that the armies of the north will execute. The text does not explain the direction, so this stays a proposal.
    sources: [keil-ezekiel, ot-manual-26, oshb-wlc, lds-scriptures]
  - ref: 4
    phrase: as the colour of amber
    kind: words
    title: 'Amber: a shining substance no one can name'
    body: |
      “Amber” stands for a Hebrew word, *ḥašmal*, whose exact meaning is uncertain. Its “etymology and exact meaning” are “dubious”; it is “evidently some shining substance.” Most have taken it, with the ancient Greek translators’ *ēlektron*, as a bright alloy of gold and silver, so the picture is of glowing metal. “The colour of” is literally “like the appearance of,” an expression Ezekiel uses again for the brass of verse 7, the beryl of verse 16 and the crystal of verse 22.

      In the whole Old Testament the word stands only in Ezekiel, three times, and always in this phrase: here, in the heart of the fire; in verse 27, where it describes the figure on the throne; and in [[Ezek. 8:2]].
    sources: [bdb, oshb-wlc]
  - ref: 5
    phrase: the likeness of four living creatures
    kind: scripture
    title: The living creatures are cherubim
    body: |
      Ezekiel later identifies the four living creatures as cherubim; here he does not say what they are. When he sees them again in the temple, he writes: “This is the living creature that I saw under the God of Israel by the river of Chebar; and I knew that they were the cherubims” ([[Ezek. 10:20]]). The fuller account of that vision belongs to [[Ezek. 10:1–22]]; what this chapter needs from it is the name.

      Cherubim are “figures representing heavenly creatures, the exact form being unknown.” They belonged to the temple: they stood in the Holy of Holies, on the mercy seat of the ark, and they kept “the way of the tree of life” after the Fall ([[Gen. 3:24]]). The cherubim of the ark “supported Jehovah’s throne,” so that the Lord is spoken of as sitting between them. That is their place in this vision too: they are under the throne, and the throne goes where they go. What stood as figures over the ark in Jerusalem, Ezekiel sees as living creatures in Babylonia, in one of the fullest descriptions of cherubim that has come down from the ancient world.

      John saw four beasts around the throne with the same four likenesses, a lion, a calf, a man and an eagle ([[Rev. 4:6–7]]). His are not quite Ezekiel’s: each of John’s has one likeness and six wings ([[Rev. 4:8]]), as Isaiah’s seraphim have six ([[Isa. 6:2]]), where each of Ezekiel’s has four faces and four wings. The Lord told Joseph Smith that John’s four beasts were shown him “to represent the glory of the classes of beings in their destined order or sphere of creation” ([[D&C 77:3]]). Whether Ezekiel’s creatures represent the same thing “is unclear.”
    sources: [lds-scriptures, bd-cherubim, shannon-location, scripture-helps-ezek]
  - ref: 10
    phrase: they four had the face of a man, and the face of a lion
    kind: prophets
    title: What the four faces mean has not been revealed
    body: |
      The meaning of the faces, and of the wheels, has not been given: “the full meaning of Ezekiel’s vision has not been revealed to us by the Lord.”

      The principle behind that is Joseph Smith’s, and it has been set beside this chapter. In April 1843, in a sermon on the beasts of the book of Revelation, he said: “where God ever gives a vision of an image, or beast or figure of any kind he always holds himself responsible to give a revelation or interpretation of the meaning thereof, otherwise we are not responsible or accountable for our belief.” He went on: “Dont be afraid of being damned for not knowing the meaning of a vision or figure where God has not given a revelation or interpretation on the subject.” For John’s beasts an interpretation was given ([[D&C 77:2–4]]). For Ezekiel’s it has not been.

      Readings have been offered, and they should be held as readings. An ancient Jewish commentary takes the four as the chief of each kind: man among creatures, the eagle among birds, the ox among domestic animals, the lion among wild beasts, all of them great and all of them “stationed below the chariot of the Holy One.” The one part of the reading that the text itself supports is the last: whatever the four are, they are beneath the throne.
    sources: [scripture-helps-ezek, wjs-1843-04-08, ot-manual-26, lds-scriptures]
  - ref: 16
    phrase: as it were a wheel in the middle of a wheel
    kind: symbol
    title: Wheels that go every way without turning
    body: |
      One thing the text keeps repeating about the wheels is that they can go in any direction without turning. There is a wheel on the ground beside each creature (verse 15; the later vision counts “the four wheels by the cherubims, one wheel by one cherub,” [[Ezek. 10:9]]). They gleam like “beryl,” “a precious stone, perhaps yellow jasper, or other gold-coloured stone.” Their “rings” are their rims, high and dreadful, and full of eyes (verse 18).

      “A wheel in the middle of a wheel” has been pictured as a second wheel set into the first at right angles, “so that without being turned it could go towards all the four sides.” That is an attempt to draw what Ezekiel only compares (“as it were”), and it should not be pressed. What the picture is for is clear from verse 17, which says of the wheels what verses 9 and 12 say of the creatures: “they turned not when they went.” On one reading the wheels are there “to indicate the possibility and ease with which the throne can be moved in the direction of the four quarters of the heavens.”

      Verses 19–21 then say three times over that wheels and creatures move as one, “for the spirit of the living creature was in the wheels.” The spirit that rules the creatures (verse 12) is in the wheels too and governs their going, standing and rising. As for the eyes, the Lord said of the eyes of John’s beasts that they “are a representation of light and knowledge” ([[D&C 77:4]]). That was said of John’s vision, which has no wheels in it; whether it holds for these has not been revealed.
    sources: [keil-ezekiel, bdb, ot-manual-26, lds-scriptures]
  - ref: 22
    phrase: the likeness of the firmament
    kind: words
    title: 'The firmament: a platform like ice under the throne'
    body: |
      The “firmament” over the creatures’ heads is the base on which the throne rests. The Hebrew is *rāqîaʿ*, the word for the firmament of [[Gen. 1:6]]: an “extended surface,” an expanse, as of something beaten out flat. In this chapter it is a flat expanse, “as if of ice.” “Crystal” is *qeraḥ*, a word for ice, and ice is probably what is meant here too, though most translators have followed the Greek and written “crystal.”

      The chapter keeps that order, from the ground up: the bearers, then the platform over their heads, and only then the throne above it (verse 26). John sees before the throne “a sea of glass like unto crystal” ([[Rev. 4:6]]).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 26
    phrase: the likeness as the appearance of a man above upon it
    kind: christ
    title: The Lord on the throne, in the form of a man
    body: |
      The figure on the throne is the LORD, and Latter-day Saints understand the LORD of the Old Testament to be Jesus Christ before His birth: “Jehovah is the premortal Jesus Christ.” Verse 28 names what Ezekiel saw as “the glory of the LORD,” and the Church’s edition marks the word “appearance” in this verse with a reference to the premortal appearances of Jesus Christ.

      Ezekiel is as careful here as language allows. He does not say he saw a man, or the Lord; he saw “the likeness as the appearance of a man.” But the form he has to reach for is a human one. “Likeness” is *dĕmût*, the word used when God says, “Let us make man in our image, after our likeness” ([[Gen. 1:26]]).

      Isaiah, too, “saw also the Lord sitting upon a throne” ([[Isa. 6:1]]), and says nothing of His form.
    sources: [bd-jehovah, bdb, lds-scriptures]
  - ref: 28
    phrase: As the appearance of the bow that is in the cloud in the day of rain
    kind: symbol
    title: The bow in the cloud
    body: |
      The storm that opened the vision ends in a rainbow, and Ezekiel’s phrase for it, the bow in the cloud, is the phrase of the covenant with Noah. “I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth” ([[Gen. 9:13]]); the Hebrew nouns for “bow” and “cloud” are the same in both verses. In Genesis the bow is what God looks on to “remember the everlasting covenant” ([[Gen. 9:16]]). Here it is the brightness around the throne itself. John saw it there too: “a rainbow round about the throne” ([[Rev. 4:3]]).

      What it signifies in this vision the text does not say, and it has been read in more than one way. One reading divides the signs in two: the north, the fire and the lightning belong to wrath and judgment, and the rainbow and the human form to the mercy that follows. Against that division it has been asked why, if it were so, the form of the appearance should stay the same every time Ezekiel sees it. The other reading takes fire and bow together, “as symbols of the righteousness, holiness, and grace which God reveals” in governing His kingdom.
    sources: [lds-scriptures, oshb-wlc, keil-ezekiel]
  - ref: 28
    phrase: This was the appearance of the likeness of the glory of the LORD
    kind: history
    title: The glory of the LORD, seen in Babylonia
    body: |
      Only in the last verse does Ezekiel say what he has been describing, and even then not outright: it is “the appearance of the likeness of the glory” of the LORD, His “visible presence.” *Dĕmût*, “likeness,” meaning “something that appeared like,” is a word found chiefly in Ezekiel; it stands in seven verses of this chapter, three times in verse 26 alone. The hedging thickens as the vision climbs. He is plain about a storm; he is three steps back from the throne.

      Ezekiel will later see this glory in the temple, the court “full of the brightness of the LORD’s glory” ([[Ezek. 10:4]]). Its appearing first by the Chebar carries the chapter’s point: “God’s presence is mobile and not confined to the temple in Jerusalem.” For Ezekiel the sight likely gave assurance that the Lord could still be with His people, though they were exiled to Babylon.

      It is also the beginning of a story the book tells in three scenes. Ezekiel sees this glory again in the temple, where it rises from the cherub and stands over the threshold, and then “went up from the midst of the city” ([[Ezek. 11:23]]): the Lord leaves His house behind to its destruction. And he sees it come back, into the temple of his last vision: “the visions were like the vision that I saw by the river Chebar; and I fell upon my face” ([[Ezek. 43:3]]). He falls on his face each time, here, in the plain ([[Ezek. 3:23]]), and there. The glory that could come to the exiles is the glory that could leave Jerusalem, and that promises to return.
    sources: [bdb, oshb-wlc, shannon-location, sc-knowhy-719, scripture-helps-ezek, lds-scriptures]

christ: |
  The one on the throne is Jesus Christ. The LORD of the Old Testament is Jehovah, the premortal Christ, and it is the glory of Jehovah that Ezekiel sees above the expanse, in “the likeness as the appearance of a man.”

  What Ezekiel learns about Him here is where He can be found. He comes to a deported people, far from the temple. The rest of the book follows that glory out of a temple polluted by abominations and, at the end, back into the temple, where it fills the house ([[Ezek. 43:5]]).

explore: |
  - **The same vision, seen in the temple.** Read [[Ezek. 10:1–22]] beside this chapter. What is added (the name *cherubim*, the coals of fire) and what is the same?
  - **Three prophets before the throne.** Compare this chapter with [[Isa. 6:1–8]] and [[1 Ne. 1:6–15]]. What does each see, and what is each then sent to do?
  - **John’s vision.** Read [[Rev. 4:2–8]] with the Lord’s explanation of it in [[D&C 77:2–4]], and notice how much of Ezekiel’s language John uses and where his vision differs.
  - **The glory leaving and returning.** Follow it through [[Ezek. 10:18–19]], [[Ezek. 11:22–23]] and [[Ezek. 43:1–5]].
  - **Exile and the presence of God.** Avram R. Shannon’s “Location, Location, Location” (in *Jacob: Faith and Great Anxiety*) compares the experiences and teachings of Ezekiel and Jacob.

parallels:
  - ref: Ezek. 10:1–22
    note: The same vision seen again in the temple, where Ezekiel recognizes the living creatures as cherubim.
  - ref: 1 Ne. 1:8
    note: Lehi, in the same years, sees the heavens open and God upon His throne.
  - ref: Rev. 4:2–8
    note: John sees the throne, the rainbow, the sea of glass, and four beasts like a lion, a calf, a man and an eagle.
  - ref: Isa. 6:1–4
    note: Isaiah sees the Lord enthroned, attended by six-winged seraphim.

