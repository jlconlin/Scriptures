chapter: 21
title: 'The Sword Is Drawn'
tagline: 'The Lord draws His sword against Jerusalem and puts it in the hand of the king of Babylon, who stands at a fork in the road casting lots. The crown is taken from the last king of Judah, to be given to no one “until he come whose right it is.”'
when: 'No date of its own. The chapter stands under the heading of 20:1, “the seventh year, in the fifth month, the tenth day of the month” of Jehoiachin’s captivity (about 590 B.C.), and before the next date in the book, the ninth year (24:1), when the siege of Jerusalem begins.'

setting: |
  Ezekiel is among the exiles in Babylon, and Jerusalem is still standing. The last date given is the seventh year of the captivity, when “certain of the elders of Israel came to inquire of the LORD” ([[Ezek. 20:1]]). The next is the ninth year, the day “the king of Babylon set himself against Jerusalem” ([[Ezek. 24:2]]). This chapter falls between the two.

  The chapter continues the last five verses of chapter 20, a short parable of a fire in “the forest of the south field,” after which the prophet reported what his hearers said of him: “Doth he not speak parables?” ([[Ezek. 20:49]]). The Hebrew Bible begins its chapter 21 at that parable, so that verse 1 here is verse 6 there.

  In Jerusalem the king is Zedekiah, whose broken oath to Nebuchadnezzar this book has already told as a parable ([[Ezek. 17:11–21]]). Jeremiah mentions envoys from “the king of the Ammonites” among those who came “to Jerusalem unto Zedekiah” ([[Jer. 27:3]]). The Ammonites lived “east of Mount Gilead,” and their chief city, Rabbath, shares a road sign with Jerusalem in this chapter. They are given an oracle of their own at [[Ezek. 25:1–7]].

thread: |
  One sword runs through the whole chapter. The Hebrew word comes fifteen times in thirty-two verses, and each of the chapter’s parts takes the sword a step farther from its sheath.

  In verses 1–7 it is drawn, and it is the Lord’s: “my sword,” three times over. In verses 8–17 it is sharpened and polished and given “into the hand of the slayer,” who is not yet named. In verses 18–24 he is named. It is “the sword of the king of Babylon,” and the king stands at the parting of the way, using divination, with the lot for Jerusalem at his right hand. Verses 25–27 turn to the prince of Israel, and the crown comes off. In verses 28–32 it turns to the Ammonites, who had been on the other road.

  The chapter also moves from figure to plain speech: it opens by restating chapter 20’s parable and goes on to name a king, two cities, and three methods of divination.

  Judah’s part ends differently from Ammon’s. Ammon is to be “no more remembered.” The crown of Judah is to be “no more, until he come whose right it is.”

sections:
  - range: 1-7
    heading: 'The Lord’s sword leaves its sheath'
    plain: |
      The word of the Lord comes to Ezekiel. He is to set his face toward Jerusalem, speak toward the holy places, and prophesy against the land of Israel. The Lord says to the land: I am against you. I will draw my sword from its sheath and cut off from you the righteous and the wicked. Because I will cut off both, my sword will go out against all flesh from the south to the north, and all flesh will know that I, the Lord, have drawn it. It will not go back.

      Ezekiel is to sigh, with the breaking of his loins and with bitterness, where the people can see. When they ask why, he is to answer: Because of the news, for it is coming. Every heart will melt, all hands will be feeble, every spirit will faint, and all knees will be weak as water. It is coming and will be done, says the Lord God.
  - range: 8-17
    heading: 'A sword sharpened and polished'
    plain: |
      The word of the Lord comes again. Ezekiel is to say: A sword, a sword is sharpened and also polished. It is sharpened for a great slaughter and polished so that it will glitter. Should we then make merry? It despises the rod of my son, as it does every tree. It has been given to be polished so that it can be handled; it is sharpened and polished to be put into the hand of the slayer.

      Ezekiel is to cry and howl, because the sword will be on the Lord’s people and on all the princes of Israel; he is to strike his thigh. It is a trial, and what if the sword despises even the rod? It will be no more, says the Lord God.

      He is to prophesy and strike his hands together. Let the sword be doubled a third time, the sword of the slain, the sword of the great men who are slain, which enters their private rooms. The Lord has set the point of the sword against all their gates, so that hearts will faint and ruins be multiplied. It is made bright; it is wrapped up for the slaughter. Go one way or the other, to the right or to the left, wherever your face is set. The Lord too will strike His hands together and bring His fury to rest. He, the Lord, has said it.
  - range: 18-24
    heading: 'The king of Babylon at the parting of the way'
    plain: |
      The word of the Lord comes again. Ezekiel is to mark out two ways for the sword of the king of Babylon to come. Both start from one land. He is to choose a place at the head of the way to the city, and mark one way for the sword to come to Rabbath of the Ammonites and one to Judah, to fortified Jerusalem.

      For the king of Babylon stood at the parting of the way, at the head of the two ways, to use divination. He made his arrows bright, consulted images, and looked in the liver. At his right hand was the divination for Jerusalem: to appoint captains, to open the mouth in the slaughter, to raise the shout, to set battering rams against the gates, to cast up a mound, and to build a fort.

      To those who have sworn oaths it will look like a false divination. But he will call the iniquity to remembrance, so that they may be taken. So the Lord God says: Because you have made your iniquity remembered, your transgressions being uncovered so that your sins show in all you do, because you have come to remembrance, you will be taken with the hand.
  - range: 25-27
    heading: 'The crown removed'
    plain: |
      And you, profane wicked prince of Israel, whose day has come, when iniquity will have an end: the Lord God says, Remove the diadem and take off the crown. This will not be the same. Exalt him that is low and abase him that is high. I will overturn, overturn, overturn it, and it will be no more, until he comes whose right it is; and I will give it to him.
  - range: 28-32
    heading: 'The sword and the Ammonites'
    plain: |
      Ezekiel is to prophesy what the Lord God says about the Ammonites and their reproach: The sword, the sword is drawn. It is polished for the slaughter, to consume, because of its glittering, while they see empty visions for you and divine a lie for you, to bring you upon the necks of the wicked who are slain, whose day has come, when their iniquity will have an end.

      Shall I make it return to its sheath? I will judge you in the place where you were created, in the land of your birth. I will pour out my indignation on you, blow against you in the fire of my wrath, and give you into the hand of brutish men who are skilled at destroying. You will be fuel for the fire. Your blood will be in the midst of the land. You will be remembered no more, for I, the Lord, have spoken it.

notes:
  - ref: 2
    phrase: 'set thy face toward Jerusalem'
    kind: scripture
    title: 'The parable of the forest, said plainly'
    body: |
      Verses 1–5 are the parable of [[Ezek. 20:45–49]] said again without the figure, and each term of the parable gets its plain equivalent. That oracle began, “set thy face toward the south, and drop thy word toward the south, and prophesy against the forest of the south field” ([[Ezek. 20:46]]). This one has the same three commands with the names filled in: Jerusalem, the holy places, the land of Israel.

      The rest follows in order, as the note on [[Ezek. 20:46]] sets out: the fire becomes a sword, and the green tree and the dry become “the righteous and the wicked.” The endings match too. The fire “shall not be quenched” ([[Ezek. 20:48]]); the sword “shall not return any more.” And where “all flesh shall see that I the LORD have kindled it,” now “all flesh may know that I the LORD have drawn forth my sword.”
    sources: [lds-scriptures, keil-ezekiel]

  - ref: 3
    phrase: 'the righteous and the wicked'
    kind: prophets
    title: 'Why the righteous fall with the wicked'
    body: |
      An invading army does not sort the people in its path, and the verse says so twice: the sword will cut off righteous and wicked alike. A reader who has come through this book will feel the difficulty. In chapter 9 the men with the mark on their foreheads were spared ([[Ezek. 9:4–6]]), and chapter 18 insisted that “the soul that sinneth, it shall die” ([[Ezek. 18:4]]). The ancient Greek translation does not have the difficulty: the Septuagint reads “the transgressor and unrighteous.” The Hebrew text has “righteous” (*tsaddiq*) and “wicked.”

      The verse has been read as describing “the mere outward aspect” of a national calamity, which is not at odds with chapter 18. On this reading the mark of chapter 9 was “not for outward exemption from the common calamity.” The exile itself is the evidence. Ezekiel and Daniel were among the righteous “cut off from the land” and carried into captivity; otherwise the captives would have had no one to preach repentance or set them an example.

      Joseph Smith taught the same of the judgments of the last days: “It is a false idea that the Saints will escape all the judgments, whilst the wicked suffer; for all flesh is subject to suffer.” Many of the Saints will escape, he went on, yet many of the righteous will fall to disease and pestilence “and yet be saved in the Kingdom of God,” so that no one may say of those who suffer that they have transgressed.
    sources: [ot-manual-26, jfb-ezekiel, lxx-rahlfs, oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: 'Sigh therefore, thou son of man'
    kind: symbol
    title: 'Groaning, striking the thigh, clapping the hands'
    body: |
      Ezekiel’s sighing is a sign: he is to grieve “before their eyes,” and when the exiles ask, “Wherefore sighest thou?” his answer is the message: “For the tidings; because it cometh.” He mourns news that has not arrived. “With the breaking of thy loins” is “with breaking heart and bitter grief” in one modern translation and “moan with body collapsed and bitter grief before their eyes” in another. What the tidings will do to those who hear them, he says in the words of an earlier oracle: “All hands shall be feeble, and all knees shall be weak as water” ([[Ezek. 7:17]]).

      The song that follows adds two more gestures. He is to “smite therefore upon thy thigh” (verse 12), as Ephraim does in Jeremiah: “I smote upon my thigh: I was ashamed, yea, even confounded” ([[Jer. 31:19]]). And he is to “smite thine hands together” (verse 14), the gesture explained at [[Ezek. 6:11]]. In verse 17 the Lord says He will do the same: “I will also smite mine hands together.”
    sources: [lds-scriptures, esv, nrsvue]

  - ref: 10
    phrase: 'it contemneth the rod of my son, as every tree'
    kind: words
    title: 'The rod of my son'
    body: |
      The Hebrew of this line, which returns in verse 13, is uncertain, and translations disagree about who is despising what. The four Hebrew words are “rod” (*shebet*), “my son,” “despising,” and “every tree” or “all wood.” The Septuagint has no “rod of my son” at all: “slay, set at nought, despise every tree.”

      The King James Version makes the sword the one that despises (the Hebrew verb is “reject”). On this reading the rod is Judah’s sceptre, for *shebet* is the word in Jacob’s blessing, “The sceptre shall not depart from Judah” ([[Gen. 49:10]]): Nebuchadnezzar’s sword “had contempt for any strength or power promised to Judah.”

      Other translations make Judah the one that despises, and the rod a rod of correction: “You have despised the rod, my son,” or “You have despised the rod and all discipline.” The first of these notes that it is a “probable reading” and that the Hebrew as it stands says, “The rod of my son despises everything of wood.”
    sources: [ot-manual-26, nrsvue, esv, lxx-rahlfs, oshb-wlc, lds-scriptures]

  - ref: 14
    phrase: 'let the sword be doubled the third time'
    kind: words
    title: 'Twice, three times'
    body: |
      Modern translations take “doubled the third time” as a sword that falls more than once: “Let the sword fall twice, thrice.” The Hebrew behind “three times” is “its third.”

      The rest of the verse is also read differently now. Where the King James Version has “the sword of the great men that are slain, which entereth into their privy chambers,” a modern translation has “It is the sword for the great slaughter, which surrounds them.”
    sources: [nrsvue, esv]

  - ref: 19
    phrase: 'appoint thee two ways'
    kind: history
    title: 'A road that forks'
    body: |
      Ezekiel is told to mark out a road that leaves “one land” and divides, with one branch going to Rabbath of the Ammonites and the other to Jerusalem. For “choose thou a place” modern translations have “make a signpost.” The text gives the command only. It does not say what he drew the road on or report that he did it. Verses 21–22 then describe the king of Babylon standing at the head of the two ways, with the divination for Jerusalem at his right hand.

      Rabbath was the “chief city of the Ammonites,” in the valley of the upper Jabbok, and its ruins are “at the modern Amman.” This chapter does not say why the Ammonites were a target.
    sources: [esv, nrsvue, bd-rabbah]

  - ref: 21
    phrase: 'he made his arrows bright, he consulted with images, he looked in the liver'
    kind: history
    title: 'Arrows, teraphim, and a liver'
    body: |
      Nebuchadnezzar consults three oracles at the fork in the road, and the first is hidden by the King James wording. “He made his arrows bright” is in Hebrew a verb for shaking, used here “in divination,” and modern translations have “He shakes the arrows.” The “images” are *teraphim*, “a kind of idol, object of reverence, and means of divination.” The word is the “images” of Genesis, where “Rachel had stolen the images that were her father’s” ([[Gen. 31:19]]). They were used “for magical purposes both in Israel and in Babylon.” The third is the inspection of a liver, where the Septuagint has the king “examine the victims.”

      Divination is “any superstitious method of trying to discover the course of future events,” and such practices “are frequently condemned in scripture.” The chapter does not commend them. It reports what the king did, and before reporting it has the Lord tell Ezekiel to mark the road “that the sword of the king of Babylon may come.” Verses 23–24 then give the reason Jerusalem is taken, which is its remembered iniquity. Compare the proverb: “The lot is cast into the lap; but the whole disposing thereof is of the LORD” ([[Prov. 16:33]]).
    sources: [bdb, esv, nrsvue, lxx-rahlfs, bd-teraphim, bd-divination, lds-scriptures]

  - ref: 25
    phrase: 'profane wicked prince of Israel'
    kind: history
    title: 'Zedekiah and the sworn oaths'
    body: |
      The prince addressed is Zedekiah, “the last king of Judah,” whose title in this book is “prince” ([[Ezek. 12:10]]). Chronicles gives the charge against him: he “rebelled against king Nebuchadnezzar, who had made him swear by God” ([[2 Chr. 36:13]]). Chapter 17 said that the Lord counted that oath as His own ([[Ezek. 17:19]]).

      In verse 23 the people of Jerusalem, “them that have sworn oaths,” treat the Babylonian omen as “a false divination.” On one reading the oaths are their oaths of allegiance to Babylon: they fancy themselves safe because they had sworn them, “forgetting that they had violated them.” The rest of the verse says what the omen will do all the same: “he will call to remembrance the iniquity, that they may be taken.”

      “Profane” translates a word spelled like the “slain” of verse 14, and one modern translation notes “slain” as an alternative here and in verse 29. What became of Zedekiah when the city fell is told in Jeremiah: the king of Babylon “put out the eyes of Zedekiah” and “carried him to Babylon, and put him in prison till the day of his death” ([[Jer. 52:11]]).
    sources: [lds-scriptures, bd-zedekiah, jfb-ezekiel, esv, oshb-wlc]

  - ref: 26
    phrase: 'Remove the diadem, and take off the crown'
    kind: words
    title: 'The turban and the crown'
    body: |
      “Diadem” translates the word used everywhere else for the high priest’s headdress. It is *mitsnepheth*, the “turban of high priest,” and all its other occurrences are in Exodus and Leviticus, beginning with the “mitre” in the list of Aaron’s garments ([[Ex. 28:4]]). Here alone, in a verse addressed to the prince, it has been taken as a “sign of royalty.”

      “This shall not be the same” is in Hebrew “this, not this,” and a modern translation has “Things shall not remain as they are.”

      What follows, “exalt him that is low, and abase him that is high,” is the reversal that closed chapter 17, where the Lord has “brought down the high tree, have exalted the low tree” ([[Ezek. 17:24]]). Mary’s song has it too: “He hath put down the mighty from their seats, and exalted them of low degree” ([[Luke 1:52]]).
    sources: [bdb, oshb-wlc, lds-scriptures, esv]

  - ref: 27
    phrase: 'until he come whose right it is'
    kind: christ
    title: 'He whose right it is'
    body: |
      Judah is overturned and its king deposed “until He comes who has the right to reign over Israel and all flesh: Jesus Christ the King.”

      Ezekiel’s words take up Jacob’s blessing on Judah, where the sceptre is not to depart “until Shiloh come” ([[Gen. 49:10]]). The Hebrew here is *asher lo ha-mishpat*, and *shiloh* may be a short form of *asher-lo*, “whose right it is.” The Septuagint translates Ezekiel’s phrase “until he comes to whom it belongs,” and a modern translation, “until he comes, the one to whom judgment belongs.” What Shiloh means, and how the Church reads it, is explained at Genesis 49:10.

      “Overturn” is a noun in Hebrew, said three times: *avvah*, “distortion, ruin.” So a modern translation has “A ruin, ruin, ruin I will make it.”
    sources: [ot-manual-26, lds-scriptures, bdb, oshb-wlc, esv, lxx-rahlfs]

  - ref: 30
    phrase: 'Shall I cause it to return into his sheath?'
    kind: words
    title: 'Return it to its sheath'
    body: |
      “Shall I cause it to return” is a command in Hebrew, and modern translations print it as one: “Return it to its sheath.” The King James Version makes it a question. The verse does not say to whom the command is spoken.

      The “thee” who is judged in the rest of the passage is Ammon, since the oracle is “concerning the Ammonites, and concerning their reproach.” Their own oracle, in chapter 25, charges them with saying “Aha” over the profaned sanctuary, the desolate land, and the captives of Judah ([[Ezek. 25:3]]).
    sources: [lds-scriptures, esv, nrsvue, oshb-wlc]

christ: |
  The crown taken from Zedekiah is the Lord’s to give, and the one who receives it is Jesus Christ: “I will give it him.”

  When Jesus was born, “Judah no longer had royal power but rather was subject to Rome,” so the promise of Jacob’s blessing, which Ezekiel’s phrase takes up, appears to wait still for His Second Coming and the millennial day. The Church’s edition indexes verse 27 under the Second Coming.

  Modern revelation has Ezekiel’s phrase. The Saints are to “be subject to the powers that be, until he reigns whose right it is to reign, and subdues all enemies under his feet” ([[D&C 58:22]]). Another revelation describes the reign: “the Lord, even the Savior, shall stand in the midst of his people, and shall reign over all flesh” ([[D&C 133:25]]).

explore: |
  - The parable this chapter restates: [[Ezek. 20:45–49]].
  - Zedekiah’s oath and what the Lord said of it: [[Ezek. 17:11–21]].
  - Jacob’s blessing on Judah, with the sceptre and Shiloh: [[Gen. 49:8–12]].
  - The Lord’s sword in modern revelation: [[D&C 1:13]].
  - The Ammonites’ own oracle, and Jeremiah’s: [[Ezek. 25:1–7]]; [[Jer. 49:1–6]].
  - What comes next: the day the king of Babylon reaches Jerusalem, [[Ezek. 24:1–2]], and Zedekiah’s end, [[Jer. 52:4–11]].

