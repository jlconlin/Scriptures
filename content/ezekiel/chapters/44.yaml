chapter: 44
title: 'Who May Come Near'
tagline: 'The gate the Lord came through is shut, and the laws of the house say who may enter and how near each may come: the prince, the stranger, the Levites, and the sons of Zadok.'
when: 'No date of its own. The chapter stands under the heading of 40:1, “the five and twentieth year of our captivity… the fourteenth year after that the city was smitten.”'

setting: |
  Ezekiel is still inside the vision that began at [[Ezek. 40:1]]: a temple on a very high mountain in the land of Israel, shown to him by a guide with a measuring reed. (The setting of [[Ezek. 40]] says where the Church’s sources place that temple.) The building was measured in chapters 40–42. In chapter 43 the glory of the LORD returned to it, the altar was measured, and its consecration was laid down.

  With this chapter the vision turns from the building to the people who will use it. Its directions come in three parts: the place of the prince, then “the admission of foreigners and the appointment of Levites and priests for the service,” then the conduct and support of the priests. The vision as a whole has been described as prescribing the temple’s service in detail, “the ordinances of the altar, the duties of the priests, the ministry of the Levites.”

  The man who receives these laws was himself a “priest of the family of Zadok,” the family the chapter singles out. Much of what he hears restates the law of the priests in Leviticus and Numbers, and the notes say where it goes beyond that law.

  How sacrifice can belong to a temple still to come is a question for [[Ezek. 43:18–27]], where the offerings begin.

thread: |
  The chapter is about access: who may come how near to the Lord, and by which door. It begins at a gate that is shut, and the Lord tells Ezekiel to “mark well the entering in of the house, with every going forth of the sanctuary” (verse 5).

  From there it moves inward by degrees. Strangers uncircumcised in heart and flesh do not enter the sanctuary (verse 9). The Levites who went after idols serve at the gates and in the house, but “they shall not come near unto me” (verse 13). The sons of Zadok “shall come near to me” and “to my table” (verses 15–16). The rest of the chapter is what that nearness asks of them in dress, hair, wine, marriage, and mourning (verses 17–27), and then their inheritance and their food (verses 28–31).

  One word runs through the middle of it. “Charge” translates the same Hebrew noun five times in verses 8–16. Israel has “not kept the charge of mine holy things”; the Levites are made “keepers of the charge of the house”; the sons of Zadok “kept the charge of my sanctuary” and “shall keep my charge.”
sections:
  - range: 1-3
    heading: 'The shut gate and the prince'
    plain: |
      The guide brings Ezekiel back to the outer gate of the sanctuary that faces east, and it is shut. The Lord tells him that this gate is to stay shut. It is not to be opened and no one is to go in by it, because the Lord, the God of Israel, has gone in by it. It is for the prince. The prince will sit in it to eat bread before the Lord; he will come in by way of the porch of the gate and go out the same way.
  - range: 4-9
    heading: 'Strangers in the sanctuary'
    plain: |
      The guide brings Ezekiel by way of the north gate to the front of the house. Ezekiel looks, and the glory of the Lord fills the house of the Lord, and he falls on his face. The Lord tells him to pay close attention, with eyes and ears, to everything He says about the ordinances and laws of the house, and to mark well the entrance of the house and every exit of the sanctuary.

      He is to say to the rebellious house of Israel: Enough of all your abominations. You brought strangers, uncircumcised in heart and in flesh, into my sanctuary to pollute my house while you offered my bread, the fat and the blood, and they broke my covenant because of all your abominations. You have not kept the charge of my holy things; you set keepers of my charge in my sanctuary for yourselves. The Lord God says: No stranger uncircumcised in heart or in flesh is to enter my sanctuary, of any stranger among the children of Israel.
  - range: 10-16
    heading: 'The Levites and the sons of Zadok'
    plain: |
      The Levites who went far from the Lord when Israel went astray after idols will bear their iniquity. Yet they will be ministers in His sanctuary: they will have charge at the gates of the house, slay the burnt offering and the sacrifice for the people, and stand before the people to serve them. Because they served the people before their idols and caused the house of Israel to fall into iniquity, the Lord has lifted up His hand against them, and they will bear their iniquity. They are not to come near Him to do the office of a priest, nor near any of His holy things in the most holy place; they will bear their shame and their abominations. But He will make them keepers of the charge of the house, for all its service.

      The Levitical priests, the sons of Zadok, who kept the charge of His sanctuary when the children of Israel went astray, will come near to minister to Him and stand before Him to offer the fat and the blood. They will enter His sanctuary, come near to His table, and keep His charge.
  - range: 17-27
    heading: 'Rules for the priests'
    plain: |
      When they enter the gates of the inner court they are to wear linen, and no wool, while they minister there and within. They are to have linen bonnets on their heads and linen breeches on their loins, and are not to gird themselves with anything that causes sweat. When they go out to the people in the outer court they are to take off the garments they ministered in, lay them in the holy chambers, and put on others, and they are not to sanctify the people with their garments.

      They are not to shave their heads or let their hair grow long; they are only to trim it. No priest is to drink wine when he enters the inner court. They are not to marry a widow or a divorced woman, but maidens of the house of Israel, or the widow of a priest.

      They are to teach the Lord’s people the difference between the holy and the profane and between the unclean and the clean. In a controversy they are to stand as judges and judge by His judgments; they are to keep His laws and statutes in all His assemblies and hallow His sabbaths.

      They are not to go near a dead person and defile themselves, except for father, mother, son, daughter, brother, or a sister who has had no husband. After the priest is cleansed, seven days are counted for him, and on the day he goes into the inner court to minister in the sanctuary he is to offer his sin offering.
  - range: 28-31
    heading: 'The priests’ inheritance'
    plain: |
      It will be their inheritance: the Lord is their inheritance. Israel is to give them no possession; the Lord is their possession. They will eat the meat offering, the sin offering, and the trespass offering, and every dedicated thing in Israel will be theirs. The first of all the firstfruits and every oblation will be the priests’. The people are also to give the priest the first of their dough, so that he may cause the blessing to rest in their house. The priests are not to eat anything that died of itself or was torn, whether bird or beast.

notes:
  - ref: 2
    phrase: 'therefore it shall be shut'
    kind: symbol
    title: 'A gate closed because the Lord came through it'
    body: |
      The east gate stays shut because the Lord entered by it, and the closing has been explained as keeping holy the way He took. This is the outer east gate, the first one the guide measured (see the note on [[Ezek. 40:6]]). The glory had left the old temple on this side, stopping “at the door of the east gate of the LORD’s house” ([[Ezek. 10:19]]) and then on the mountain east of the city (see the note on [[Ezek. 11:23]]). In the vision it came back the same way: “the glory of the LORD came into the house by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]).

      One explanation sets aside the idea that the gate is shut to keep the glory from leaving again. The thought is that the gateway had been made holy by that entrance, and so “it was not to remain open to the people, so as to be desecrated, but was to be kept perpetually holy.”

      The inner east gate is treated differently. It “shall be shut the six working days; but on the sabbath it shall be opened” ([[Ezek. 46:1]]).
    sources: [keil-ezekiel, esv, lds-scriptures]

  - ref: 3
    phrase: 'It is for the prince'
    kind: history
    title: 'Who is the prince?'
    body: |
      The text does not say who the prince is: his title is the one given earlier to the promised David, yet he brings a sin offering for himself. The Hebrew word is *nasi*, the title of “my servant David a prince among them” ([[Ezek. 34:24]]; see the note there) and of [[Ezek. 37:25]], and this verse is compared with those two, where the word names the “future Davidic king.” That David is understood to be Jesus Christ, a descendant of David, and not the ancient king.

      The prince of chapters 44–46, though, is to “prepare for himself and for all the people of the land a bullock for a sin offering” ([[Ezek. 45:22]]). Because he offers for himself, he has been read as “not King Messiah” but “the civil ruler under Messiah,” a leader who, “as ruling under God,” is “to stand in a place of peculiar nearness to God.” That is one reading, and the vision does not settle it.

      What he is given is clearer. He is to sit in the gateway the Lord used, “to eat bread before the LORD.” Eating bread there has been explained as “a custom connected with sacrifices,” as when “Jacob offered sacrifice upon the mount, and called his brethren to eat bread” ([[Gen. 31:54]]). Chapter 46 says more about where the prince stands when his offerings are made ([[Ezek. 46:1–12]]).
    sources: [bdb, oshb-wlc, scripture-helps-ezek, jfb-ezekiel, lds-scriptures]

  - ref: 7
    phrase: 'uncircumcised in heart, and uncircumcised in flesh'
    kind: words
    title: 'Strangers uncircumcised in heart'
    body: |
      The people barred from the sanctuary are foreigners who have neither the sign of the covenant nor the heart for it, and the heart is named first. “Strangers” here are foreigners: the Hebrew is *bene nekar*, sons of a foreigner. An uncircumcised heart is a figure of speech for character. Moses used it of Israel: “Circumcise therefore the foreskin of your heart, and be no more stiffnecked” ([[Deut. 10:16]]). Jeremiah turned it on Judah: “all the house of Israel are uncircumcised in the heart” ([[Jer. 9:26]]; see the note on [[Jer. 9:25]]).

      So the line is not simply between nations. The weight of the prohibition has been placed “upon their being uncircumcised in heart,” so that “Israelites who were circumcised in flesh” would also have to keep away “if they failed to possess circumcision of heart.” Nor is the foreigner’s place in Israel done away. Solomon had prayed at the first temple for the stranger who “cometh out of a far country for thy name’s sake” ([[1 Kgs. 8:41]]), and this same vision gives “the strangers that sojourn among you” an inheritance among the tribes ([[Ezek. 47:22]]).

      What exactly Israel had done is less clear. Verse 8 says they “set keepers of my charge in my sanctuary for yourselves.” One modern translation has “you have set others to keep my charge.” Another supplies a word, “you have appointed foreigners to act for you in keeping my charge in my sanctuary,” with the note “Heb lacks foreigners”; on that rendering foreigners had been given duties in the temple. The words have also been taken less literally: allowing such people to walk in the temple “is regarded as equivalent to appointing them to take charge of the worship.” The text names no occasion.
    sources: [bdb, oshb-wlc, keil-ezekiel, esv, nrsvue, lds-scriptures]

  - ref: 11
    phrase: 'Yet they shall be ministers in my sanctuary'
    kind: history
    title: 'Levites kept from the altar, kept in the house'
    body: |
      The Levites who followed Israel into idolatry lose the altar and keep a place in the house. The sentence is in verse 13: they “shall not come near unto me, to do the office of a priest unto me.” What is left to them (the gates, the slaughter of the people’s sacrifices, the service of the house) is the work the law gave to Levites as distinct from priests. “The work of the Levites was to assist the priests”; they “slaughtered the sacrifices” and “generally assisted in the temple.” In the law they were to “keep the charge of the tabernacle of the congregation, for all the service of the tabernacle” ([[Num. 18:4]]), while Aaron and his sons kept the priest’s office “for every thing of the altar, and within the veil” ([[Num. 18:7]]).

      Something like it had happened before. When Josiah defiled the high places and brought their priests to Jerusalem, “the priests of the high places came not up to the altar of the LORD in Jerusalem, but they did eat of the unleavened bread among their brethren” ([[2 Kgs. 23:9]]).

      Two phrases in the sentence read differently in modern English. To “bear their iniquity” is to “bear their punishment,” and where the King James Version has “lifted up mine hand against them,” a modern translation has “sworn concerning them.”

      In the temple at Jerusalem the gatekeepers were Levites as well, “responsible for maintaining the boundaries within the temple by controlling access to the temple through the gates.”
    sources: [bd-levites, shannon-guarded, esv, lds-scriptures]

  - ref: 15
    phrase: 'the sons of Zadok'
    kind: history
    title: 'Why the sons of Zadok'
    body: |
      The reason for choosing Zadok’s family, left unsaid when they were first named (see the note on [[Ezek. 40:46]]), is given here: they “kept the charge of my sanctuary when the children of Israel went astray from me.” The contrast with the Levites of verses 10–14 is drawn again when the land is divided. The sons of Zadok “went not astray when the children of Israel went astray, as the Levites went astray” ([[Ezek. 48:11]]).

      “The priests the Levites” is “the Levitical priests” in another rendering. The phrase is Deuteronomy’s ([[Deut. 17:9]]; [[Deut. 18:1]]), one of the places where scripture speaks “as though all Levites were also priests.”

      Zadok’s name means “Righteous,” and the choice has been applied to the temple still to come: it appears that the Lord wanted “the descendants of the righteous Zadok to officiate in the latter-day temple in Jerusalem.”

      Their privilege is nearness. They “come near to me,” they “stand before me,” and they “come near to my table” (for the table, see the note on [[Ezek. 41:22]]).
    sources: [bd-zadok, bd-levites, ot-manual-27, esv, lds-scriptures]

  - ref: 18
    phrase: 'they shall not gird themselves with any thing that causeth sweat'
    kind: symbol
    title: 'Linen, and nothing that causes sweat'
    body: |
      The priests wear linen and no wool, and nothing that causes sweat; the rule has been read as bodily cleanness standing for cleanness of soul. The law of Moses had already dressed the priests in linen: “thou shalt make them linen breeches” ([[Ex. 28:42]]). Ezekiel’s law adds the ban on wool, and the clause about sweat has been taken as its motive: “that the priest is not to cause himself to sweat by wearing woollen clothing.”

      Why sweat matters is not said in the verse. One explanation is practical and symbolic at once: “Sweat produces uncleanness; and the priest, by keeping his body clean, is to show even outwardly that he is clean and blameless,” since in these rules “the bodily condition shadows forth the state of the soul.” Another calls linen “symbolical of purity” and observes that wool “soon induces perspiration in the sultry East.” These are readings; the verse gives only the rule.

      Verse 19 repeats a rule given when the priests’ chambers were measured. The garments worn in the inner court are left in the holy chambers, “lest they transmit holiness to the people.” The note on [[Ezek. 42:14]] explains it.
    sources: [keil-ezekiel, jfb-ezekiel, esv, lds-scriptures]

  - ref: 22
    phrase: 'Neither shall they take for their wives a widow'
    kind: scripture
    title: 'The law of the priests, with one rule made stricter'
    body: |
      Verses 20–27 restate the law of the priests from Leviticus, and the rule on marriage goes beyond it. Priests in Israel “were under special restrictions with respect to uncleanness for the dead, marriage, wine or strong drink when engaged in sacerdotal duties” (their duties as priests), and each of those is here. On hair: “They shall not make baldness upon their head” ([[Lev. 21:5]]). On wine: “Do not drink wine nor strong drink, thou, nor thy sons with thee, when ye go into the tabernacle of the congregation” ([[Lev. 10:9]]). On the dead: a priest may be defiled only for his nearest kin, and the list in verse 25 is the list of [[Lev. 21:1–3]].

      On marriage Leviticus has two rules. Ordinary priests were not to take “a woman put away from her husband” ([[Lev. 21:7]]). Only of the high priest was it said, “A widow, or a divorced woman, or profane, or an harlot, these shall he not take: but he shall take a virgin of his own people to wife” ([[Lev. 21:14]]). Ezekiel’s law applies the high priest’s rule to every priest, with one allowance: “a widow that had a priest before.” The reason Leviticus gives for its rule is the priest’s standing: “for he is holy unto his God” ([[Lev. 21:7]]). Ezekiel does not say why the rule is widened.

      The chapter’s last verse belongs with these. “That which dieth of itself, or is torn with beasts, he shall not eat” is the priests’ law ([[Lev. 22:8]]), and Ezekiel had kept it. Early in the book he protested that he had never eaten “of that which dieth of itself, or is torn in pieces” (see the note on [[Ezek. 4:14]]).
    sources: [bd-priests, lds-scriptures]

  - ref: 23
    phrase: 'teach my people the difference between the holy and profane'
    kind: scripture
    title: 'Priests as teachers and judges'
    body: |
      A priest exercised his office “mainly at the altar” but “also by teaching the people the law,” and this verse gives the priests of the new house the commission that Jerusalem’s priests had let go. The words come from the commission to Aaron: “that ye may put difference between holy and unholy, and between unclean and clean” ([[Lev. 10:10]]), and “that ye may teach the children of Israel all the statutes” ([[Lev. 10:11]]).

      Earlier in the book the charge against the priests of Jerusalem was made in the same terms: “they have put no difference between the holy and profane, neither have they shewed difference between the unclean and the clean, and have hid their eyes from my sabbaths” ([[Ezek. 22:26]]). Here the priests are to teach the one difference and make the other known, and in the next verse to “hallow my sabbaths.” “Profane” means common, not wicked (see the note on [[Ezek. 42:20]]); a modern translation has “the difference between the holy and the common.”

      Verse 24 adds judging: “in controversy they shall stand in judgment.” Deuteronomy had sent hard cases “unto the priests the Levites, and unto the judge that shall be in those days” ([[Deut. 17:9]]). Malachi measured the priests of his day by the same standard: “the priest’s lips should keep knowledge, and they should seek the law at his mouth” ([[Mal. 2:7]]).
    sources: [bd-priests, esv, lds-scriptures]

  - ref: 28
    phrase: 'I am their inheritance'
    kind: scripture
    title: 'No land, because the Lord is their portion'
    body: |
      The priests receive no territory of their own, and the Lord names Himself as what they have instead. It is the word once spoken to Aaron: “Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance among the children of Israel” ([[Num. 18:20]]).

      Verses 29–30 say what that means day to day. The priests eat from the offerings and receive the firstfruits and “the first of your dough.” That is the provision of the law, where what was set apart for “the maintenance of the priests” included portions of the altar offerings, the firstfruits, and dough. The dough offering is from Numbers: “Of the first of your dough ye shall give unto the LORD an heave offering” ([[Num. 15:21]]). Here it comes with a promise to the giver, “that he may cause the blessing to rest in thine house.”

      Having no possession does not leave them without a home. When the land is divided, the holy portion, with the sanctuary in it, “shall be for the priests” and “a place for their houses” ([[Ezek. 45:4]]).
    sources: [bd-priests, lds-scriptures]

christ: |
  The chapter turns on who may “come near,” and coming near is what a priest is for. “The essential idea of a Hebrew priest was that of a mediator between his people and God”: he could draw near to God while the people, for their sins and infirmities, had to stand far off. The epistle to the Hebrews sets out how Jesus Christ is “the great High Priest, of whom all the others were pre-figures.”

  The chapter is also full of gates and keepers. The gatekeepers of the Jerusalem temple have been called “representatives of the final gatekeeper,” the Holy One of Israel, who “employeth no servant there” ([[2 Ne. 9:41]]): in the end “only Jesus Christ is able to fully mediate for us and bring us finally into the presence of God.”

explore: |
  - The law of the priests that this chapter restates: [[Lev. 21:1–15]], [[Lev. 22:1–9]], and [[Num. 18:1–7]].
  - Zadok’s loyalty and his appointment in Abiathar’s place: [[1 Kgs. 1:32–39]] and [[1 Kgs. 2:26–35]].
  - The prince, the gates, and the sabbath: [[Ezek. 46:1–12]].
  - Foreigners who join themselves to the Lord and are brought to His house, named in Hebrew by the phrase used in verse 7: [[Isa. 56:6–7]].
  - The circumcised heart as the Lord’s own work: [[Deut. 30:6]]; and as a command: [[Jer. 4:4]].
  - On guarded space in the temple and those who kept it, Avram R. Shannon’s essay “‘Come Near unto Me’: Guarded Space and Its Mediators in the Jerusalem Temple” is worth reading whole.

