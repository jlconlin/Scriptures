chapter: 41
title: 'This Is the Most Holy Place'
tagline: 'The man with the measuring reed takes Ezekiel into the temple building, goes on alone into its inner room, and names it. Around the measurements are carved cherubim and palm trees, and one wooden table.'
when: 'No date of its own. The chapter continues the vision dated at 40:1, “the five and twentieth year of our captivity,” “the fourteenth year after that the city was smitten” (about 572 B.C.).'

setting: |
  Ezekiel is still in the vision that began at [[Ezek. 40:1]]. He has been set down in the land of Israel on “a very high mountain” ([[Ezek. 40:2]]) and is being led by a man “with a line of flax in his hand, and a measuring reed” ([[Ezek. 40:3]]). What this temple is and when it is to be built belongs to [[Ezek. 40]], where the vision opens.

  Chapter 40 worked from the outside in: the outer wall, the gates, the two courts, and at its end the porch of the house ([[Ezek. 40:48–49]]). This chapter goes through the porch into the building. It measures the long outer room and the square inner room (verses 1–4), then the walls and the tiers of small rooms built against them (5–11), then a large building behind the temple and the overall dimensions (12–15), and last the woodwork, the carvings, a wooden table, and the doors (16–26).

  The unit is the cubit. The man’s reed is six cubits “by the cubit and an hand breadth” ([[Ezek. 40:5]]), a long cubit of about 21 inches against a common one of about 18. The inner room, twenty cubits each way, is then a square of roughly thirty-five feet.

  The length and breadth of the two rooms are those of Solomon’s temple, which Nebuchadnezzar had burned to the ground fourteen years before the vision.

thread: |
  The chapter walks to the center of the house and back out again. The door of the inner room is narrower than the door of the outer one (verses 2–3), and the guide goes through it by himself. “He brought me to the temple” (verse 1), but then “went he inward” (verse 3): he measures the inner room and tells Ezekiel its name.

  In twenty-six verses the guide speaks twice. He says, “This is the most holy place” (verse 4), and he says, “This is the table that is before the LORD” (verse 22). Those are the only things in the chapter that Ezekiel is told and not simply shown. Everything else is numbers and woodwork.

  The walls six cubits thick, the tiers of side rooms, the separate yard, the measures of a hundred cubits: all of it is laid out around a room twenty cubits square in which the chapter names no object at all. The house is being described before the one it is for has come into it. That happens two chapters on, when “the glory of the LORD came into the house” ([[Ezek. 43:4]]).

sections:
  - range: 1-4
    heading: 'The outer room and the inner room'
    plain: |
      The man brings Ezekiel to the temple and measures its posts, six cubits broad on each side, the breadth of the tabernacle. The door is ten cubits wide, with five cubits of wall on each side of it. He measures the room: forty cubits long and twenty broad. Then he goes inward and measures the post of the door, two cubits, and the door, six cubits, and the breadth of the door, seven cubits. He measures the length there, twenty cubits, and the breadth, twenty cubits, before the temple, and he says to Ezekiel, “This is the most holy place.”
  - range: 5-11
    heading: 'The wall and the side chambers'
    plain: |
      He measures the wall of the house, six cubits, and the side chambers, each four cubits broad, all around the house. The side chambers are three, one over another, and thirty in order. They enter into a wall of the house made for the side chambers, so that they have a hold, but they have no hold in the wall of the house itself. There is a widening and a winding about, still upward, to the side chambers, so the breadth of the house is still upward, and so it increases from the lowest chamber to the highest by the middle.

      Ezekiel also sees the height of the house all around: the foundations of the side chambers are a full reed of six great cubits. The outer wall of the side chambers is five cubits thick, and what is left is the place of the side chambers within. Between the chambers there is a width of twenty cubits all around the house. The doors of the side chambers open toward the place that is left, one to the north and one to the south, and that place is five cubits broad all around.
  - range: 12-15
    heading: 'The building at the west and the measures of a hundred'
    plain: |
      The building that stands before the separate place at the west end is seventy cubits broad and ninety long, with a wall five cubits thick all around. He measures the house, a hundred cubits long; and the separate place and the building with its walls, a hundred cubits long; and the breadth of the front of the house and of the separate place toward the east, a hundred cubits. He measures the length of the building facing the separate place behind it, with its galleries on each side, a hundred cubits, along with the inner temple and the porches of the court.
  - range: 16-21
    heading: 'Wood, cherubim, and palm trees'
    plain: |
      The door posts, the narrow windows, and the galleries around on their three stories, opposite the door, are lined with wood all around, from the ground up to the windows, and the windows are covered. To the space above the door, to the inner house and outside, and on all the wall round about, within and without, it is all by measure.

      It is made with cherubim and palm trees, a palm tree between cherub and cherub. Every cherub has two faces: the face of a man toward the palm tree on one side, and the face of a young lion toward the palm tree on the other. It is made this way through all the house round about. From the ground to above the door there are cherubim and palm trees, and on the wall of the temple. The posts of the temple are squared, and the front of the sanctuary has the same appearance.
  - range: 22-26
    heading: 'The table and the doors'
    plain: |
      The altar of wood is three cubits high and two cubits long; its corners, its length, and its walls are of wood. The man says to Ezekiel, “This is the table that is before the LORD.” The temple and the sanctuary have two doors. Each door has two leaves, two turning leaves, two for the one door and two for the other. On the doors of the temple are cherubim and palm trees like those on the walls, and there are thick planks on the front of the porch outside. There are narrow windows and palm trees on both sides of the porch, and on the side chambers of the house, and thick planks.

notes:
  - ref: 1
    phrase: 'which was the breadth of the tabernacle'
    kind: words
    title: 'The tent, and the rooms of Solomon’s temple'
    body: |
      “Tabernacle” here is the Hebrew *ohel*, “tent,” the name of the sanctuary Israel carried in the wilderness, and it is unexpected in the description of a building. The verse is listed with the places where that sanctuary is called simply “the tent.” The ancient Greek translation has no such word here, and a modern translation that follows it leaves the clause out, with the note “Heb tent.” Where the Hebrew is kept, the clause has been explained as naming the inner space of this house a tent “to show the substantial identity of this space and the tabernacle.”

      The measurements are those of Solomon’s house. “Temple” in verse 1 does not mean the whole complex. It is *hekal*, the “hall or nave,” the outer of the building’s two rooms, which a modern translation renders “the nave.” That room is forty cubits by twenty (verse 2), and the inner room is twenty by twenty (verse 4). In Kings “the temple before it, was forty cubits long” ([[1 Kgs. 6:17]]), and “the oracle,” its inner room, was “twenty cubits in length, and twenty cubits in breadth” ([[1 Kgs. 6:20]]). Solomon’s temple in its turn was built on the model of the tabernacle, with each dimension doubled.

      One thing is missing. Kings also gives the inner room “twenty cubits in the height thereof.” Ezekiel is given length and breadth only.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, keil-ezekiel, bd-temple-of-solomon, lds-scriptures]

  - ref: 3
    phrase: 'Then went he inward'
    kind: history
    title: 'The guide goes into the inner room alone'
    body: |
      The guide goes into the inner room by himself. The verbs show it. Verse 1 has “he brought me to the temple”; verse 3 has only “he went,” with no “me.” The change has been explained from the holiness of the room: “the prophet was not allowed to tread the most holy place, and therefore the angel went in alone.” Ezekiel was “the priest” ([[Ezek. 1:3]]), but the law did not let even Aaron enter that room freely. He was told to “come not at all times into the holy place within the veil” ([[Lev. 16:2]]).

      The doorway is narrower as well. The entrance to the outer room is ten cubits wide (verse 2). For the entrance to the inner room the Hebrew gives “the door, six cubits; and the breadth of the door, seven cubits,” two figures for one opening, and they have been taken two ways. The ancient Greek has seven cubits “on one side” and seven “on the other,” and a modern translation follows it: the opening is six cubits wide and the seven is the wall beside it. An older reading keeps the Hebrew and takes “the six cubits as a statement of the height” of a door seven cubits broad. It rejects the Greek figures because, added up, they make the wall broader than a room of twenty cubits. On either reading the opening is narrower than the first.
    sources: [keil-ezekiel, oshb-wlc, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 4
    phrase: 'This is the most holy place'
    kind: scripture
    title: 'A most holy place with nothing named in it'
    body: |
      The guide names the room and describes nothing inside it. The Hebrew is *qodesh ha-qodashim*, “holy of holies,” the name of the “most sacred room in the tabernacle and, later, in the temple.” In the tabernacle that room “contained only one piece of furniture: the Ark of the Covenant,” and the ark’s cover, the mercy seat, “was God’s throne in Israel.” Solomon set the same ark in his inner room beneath two cherubim “each ten cubits high” ([[1 Kgs. 6:23]]). Ezekiel is told the length of the room, its breadth, and its name. The chapter mentions no ark, and it has been observed that “Ezekiel knows of no cherubic statues in the new temple,” only the carvings on its walls.

      Jeremiah had said that a day would come when the ark would not be missed: “they shall say no more, The ark of the covenant of the LORD: neither shall it come to mind” ([[Jer. 3:16]]), and “they shall call Jerusalem the throne of the LORD” ([[Jer. 3:17]]). Ezekiel’s silence has been read in the light of that promise. On this reading the Lord Himself “shall come in the room of the ark of the covenant,” and the interior of the temple “stands empty, waiting for His entrance to fill it with His glory.” That is one reading, and the chapter itself does not say why the room is described without furnishings. The book does supply the arrival. When the glory enters the house, a voice from inside says of it, “the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Israel for ever” ([[Ezek. 43:7]]).
    sources: [oshb-wlc, bd-holy-of-holies, bd-tabernacle, bdb, jfb-ezekiel, lds-scriptures]

  - ref: 6
    phrase: 'but they had not hold in the wall of the house'
    kind: history
    title: 'Side rooms that rest against the house'
    body: |
      The small rooms around the temple rest on ledges and are not built into its wall. Kings describes the like rooms of Solomon’s temple more plainly, and these verses have been explained by that account. There “against the wall of the house he built chambers round about” ([[1 Kgs. 6:5]]), on three levels, each a cubit broader than the one beneath it, “for without in the wall of the house he made narrowed rests round about, that the beams should not be fastened in the walls of the house” ([[1 Kgs. 6:6]]).

      The last words of Ezekiel’s verse 6 answer to that clause, and the “enlarging… still upward” of verse 7 is the same widening “from storey to storey.” A modern translation of verse 6 has, “There were offsets all around the wall of the temple to serve as supports for the side chambers so that they should not be supported by the wall of the temple,” and it takes “thirty in order” as “thirty in each story.”

      This chapter does not say what the rooms were for. Why the wall of the house is left untouched has been explained from its holiness: beams let into it “would have done violence to the sanctity of the temple house.”
    sources: [lds-scriptures, nrsvue, keil-ezekiel]

  - ref: 12
    phrase: 'the separate place'
    kind: words
    title: 'The separate place and the measures of a hundred cubits'
    body: |
      “The separate place” is a yard, an open space set off around the temple building. The Hebrew *gizrah* means a cutting or “separation,” and in these verses it is explained as a “yard, or space adjoining temple on three sides.” Modern translations have “the temple yard” or “the separate yard.” In this sense the word is found only in chapters 41 and 42 of Ezekiel.

      On the west, behind the temple, a building faces this yard. Its floor is larger than the temple’s two rooms together, and the chapter does not say what it is for.

      What the verses dwell on is the sum. The house is “an hundred cubits long.” The yard and the west building with its walls are “an hundred cubits long.” The front of the house with the yard on the east is “an hundred cubits” (verses 13–14). The inner court in front of the house was already “an hundred cubits long, and an hundred cubits broad, foursquare” ([[Ezek. 40:47]]). Elder James E. Talmage named as a predominant characteristic of this temple “the spaciousness of its premises and the symmetry of both the Holy House and its associated buildings.”
    sources: [oshb-wlc, bdb, nrsvue, esv, ot-manual-27, lds-scriptures]

  - ref: 18
    phrase: 'every cherub had two faces'
    kind: symbol
    title: 'Cherubim and palm trees on every wall'
    body: |
      The walls and doors of both rooms are carved from the ground to above the door with cherubim and palm trees in turn, as the walls of Solomon’s temple were. He “carved all the walls of the house round about with carved figures of cherubims and palm trees and open flowers” ([[1 Kgs. 6:29]]). Cherubim guard holy space from the beginning of scripture, where they are set at Eden “to keep the way of the tree of life” ([[Gen. 3:24]]). In the sanctuary their images “were particularly associated with borders, where they symbolically controlled access from one point to another”; they “symbolically and iconographically guard the way back into God’s presence.” What Ezekiel had already seen of living cherubim is told at [[Ezek. 10:20]].

      Here each cherub has two faces, a man’s and a young lion’s. The creatures of the earlier visions had four ([[Ezek. 1:10]]; [[Ezek. 10:14]]). One explanation is the medium: “In sculpture only two faces could be shown.” That is an inference, though a simple one. It agrees with the caution that the exact form of cherubim is “unknown,” and with the observation that “the number and the form of the cherubim vary in the representations.”

      Each face looks toward a palm tree. The chapter gives the palms no meaning. They were already on the posts of the first gate Ezekiel was shown ([[Ezek. 40:16]]).
    sources: [shannon-guarded, keil-ezekiel, bdb, bd-cherubim, lds-scriptures]

  - ref: 22
    phrase: 'This is the table that is before the LORD'
    kind: scripture
    title: 'An altar that is called a table'
    body: |
      The one furnishing named inside the building is described as an altar and then called a table. Verse 22 opens with *mizbeach*, “altar,” and the guide names it *shulchan*, “table.” A modern translation eases the join: in front of the holy place there was “something resembling” an altar of wood.

      The tabernacle had two wooden pieces before the veil that might be meant. The altar of incense was a cubit square and two cubits high, overlaid “with pure gold” ([[Ex. 30:1–3]]), and it stood “before the veil that is by the ark of the testimony” ([[Ex. 30:6]]). The table of shewbread was two cubits long, a cubit broad, and a cubit and a half high ([[Ex. 25:23]]). Ezekiel’s piece is larger than either: three cubits high and two long. The ancient Greek adds that it was two cubits broad, which the Hebrew lacks. The verse mentions no gold, no incense, and no bread, and it does not say which of the two this is.

      Elsewhere in scripture the two words stand side by side. In Malachi the priests offer “polluted bread upon mine altar” while saying, “The table of the LORD is contemptible” ([[Mal. 1:7]]; see the note on [[Mal. 1:7]]). Later in this vision the Lord calls the sacrifices “my bread, the fat and the blood” ([[Ezek. 44:7]]) and says of the faithful priests, “they shall come near to my table, to minister unto me” ([[Ezek. 44:16]]), where the table has been taken to be the altar of burnt offering.

      The guide says only one thing about its place. It is “before the LORD.”
    sources: [oshb-wlc, bdb, nrsvue, esv, lxx-rahlfs, lds-scriptures]

christ: |
  The room named in verse 4 bears the name of the inner room of the tabernacle and of the temple after it, and Hebrews says what that room stood for. Into the tabernacle’s inner room “went the high priest alone once every year, not without blood” ([[Heb. 9:7]]), and while that was so “the way into the holiest of all was not yet made manifest” ([[Heb. 9:8]]). Then Hebrews says, “Christ is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself, now to appear in the presence of God for us” ([[Heb. 9:24]]), and it speaks of “boldness to enter into the holiest by the blood of Jesus” ([[Heb. 10:19]]). Hebrews is speaking of the tabernacle. It is set beside Ezekiel’s room here because the name is the same.

  The chapter’s other spoken line names a table “before the LORD.” Who the LORD of this book is, is said at [[Ezek. 1:26]].

explore: |
  - Solomon’s temple, room by room, for comparison with verses 1–11 and 16–26: [[1 Kgs. 6:1–36]].
  - The tabernacle’s two rooms and the veil between them: [[Ex. 26:31–35]].
  - The one day and the one man for the most holy place: [[Lev. 16:1–17]].
  - The glory entering the house that this chapter measures: [[Ezek. 43:1–7]].
  - The tabernacle’s rooms read as “figures of the true”: [[Heb. 9:1–12]], [[Heb. 9:24]].

