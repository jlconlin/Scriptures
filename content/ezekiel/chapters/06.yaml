chapter: 6
title: 'Against the Mountains of Israel'
tagline: 'Ezekiel is told to face the hills of his homeland and announce that their shrines will become the graves of the people who built them. A remnant will live, remember, and know who the Lord is.'
when: 'No date of its own. The chapter stands under the heading of 1:2, “the fifth year of king Jehoiachin’s captivity” (about 592 B.C.), and before the next date in the book, the sixth year (8:1).'

setting: |
  Ezekiel is among the captives who were carried to Babylon with king Jehoiachin, settled “at Tel Abib on the Chebar,” where he prophesied from 592 to 570 B.C. This chapter has no date. It falls between the book’s first date, the fifth year of the captivity ([[Ezek. 1:2]]), and its second, the sixth year ([[Ezek. 8:1]]), so Jerusalem is still standing. The deportation that followed the city’s fall, in 586 B.C., is about six years away.

  Chapters 4 and 5 were signs and words about the siege of Jerusalem itself. Chapter 6 and chapter 7 are two further oracles that carry that judgment outward: this one turns from the city to the whole land, its mountains, hills, and valleys, and to the worship that was practiced there.

  The chapter is built on an older text. Its threats are those the Lord gave through Moses if Israel broke the covenant: “I will destroy your high places, and cut down your images, and cast your carcases upon the carcases of your idols” ([[Lev. 26:30]]), and “I will scatter you among the heathen, and will draw out a sword after you” ([[Lev. 26:33]]). Ezekiel announces that what was written there is now coming.

  Later in the book the Lord has Ezekiel speak to these same mountains again, and that time the word is a promise ([[Ezek. 36:1–8]]).

thread: |
  The places where Israel worshipped idols will be where Israel’s dead lie. That is the picture of verses 1–7, and it returns in verse 13: the slain “among their idols round about their altars.” The judgment is the one the law had warned of ([[Lev. 26:30–33]]), and the chapter says four times what it is for: “ye shall know that I am the LORD” (verses 7, 10, 13, 14).

  Between the two descriptions of ruin stand three verses about survivors (8–10). The Lord will leave a remnant, and among the nations they will remember Him, loathe what they did, and know Him. So the same sentence closes both the judgment and the promise.

sections:
  - range: 1-7
    heading: 'The high places will become graves'
    plain: |
      The word of the Lord comes to Ezekiel. He is to turn his face toward the mountains of Israel and prophesy against them. The Lord speaks to the mountains and hills, the rivers and valleys: He Himself is bringing a sword on them and will destroy their high places. The altars will be left desolate and the images broken. He will throw down the slain in front of their idols, lay the corpses of the children of Israel before those idols, and scatter their bones around the altars.

      Wherever they live, the cities will be laid waste and the high places made desolate, so that altars, idols, images, and everything they made are broken and wiped away. The slain will fall among them, and they will know that He is the Lord.
  - range: 8-10
    heading: 'A remnant will remember'
    plain: |
      Yet the Lord will leave a remnant. Some will escape the sword and live among the nations when the people are scattered. There, in the lands where they are captives, they will remember Him, and how He was broken by their unfaithful heart that turned from Him and by their eyes that went after idols. They will loathe themselves for the evil they did in all their abominations. They will know that He is the Lord, and that He did not speak emptily when He said He would bring this on them.
  - range: 11-14
    heading: 'Sword, famine, and pestilence'
    plain: |
      The Lord tells Ezekiel to strike with his hand, stamp his foot, and cry “Alas” over all the evil abominations of the house of Israel, because they will fall by sword, famine, and pestilence. The one far away will die of pestilence, the one nearby will fall by the sword, and the one who is left and besieged will die of famine. So the Lord will spend His fury on them.

      They will know that He is the Lord when their slain lie among their idols around the altars, on every high hill and mountaintop, under every green tree and every thick oak, in the places where they offered sweet savour to all their idols. He will stretch out His hand on them and make the land desolate, more desolate than the wilderness toward Diblath, wherever they live. And they will know that He is the Lord.

notes:
  - ref: 2
    phrase: 'set thy face toward the mountains of Israel'
    kind: history
    title: 'Why the mountains are addressed'
    body: |
      Ezekiel speaks to the mountains because the high places were on them. He is in Babylon and is told to face the hill country of his homeland; the next verse widens the address “to the mountains, and to the hills, to the rivers, and to the valleys,” and then names the target: “I will destroy your high places.”

      A high place was a hilltop altar. Altars on hills were an old custom, and Israel had altars to Jehovah at several of them, which “became local centers of the worship of Jehovah.” Then, “When idolatry came in, many of these altars were desecrated and used for heathen worship.” Israel had been told on entering the land to destroy the places where the nations served their gods, “upon the high mountains, and upon the hills, and under every green tree” ([[Deut. 12:2]]). Verse 13 of this chapter repeats that list almost item for item, now as the places where Israel’s own dead will lie.

      The land is addressed again in chapter 36, in the same words, “to the mountains, and to the hills, to the rivers, and to the valleys” ([[Ezek. 36:4]]). There the message is reversed: “But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to my people of Israel” ([[Ezek. 36:8]]). The mountains hear the judgment first and the restoration afterward.
    sources: [lds-scriptures, bd-high-places]

  - ref: 4
    phrase: 'your images shall be broken'
    kind: words
    title: 'Sun-pillars and a scornful word for idols'
    body: |
      “Images” and “idols” in this verse are two different Hebrew words, and both come from the warning in Leviticus. The King James “images” is *hammanim*, a “sun-pillar, used in idolatrous worship.” “Idols” is *gillulim*, explained as “logs, blocks, shapeless things,” with another explanation that makes it “dungy things.” It is Ezekiel’s usual word for idols, 39 times in his book, and six of those are in this chapter.

      Both words stand together with “high places” in one earlier verse: “I will destroy your high places, and cut down your images, and cast your carcases upon the carcases of your idols” ([[Lev. 26:30]]). Verses 3–5 here take up that sentence piece by piece. The threat is not new with Ezekiel; it is the law’s own.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 5
    phrase: 'scatter your bones round about your altars'
    kind: history
    title: 'Bones around the altars'
    body: |
      Bones scattered around an altar were reckoned a pollution of it, so this verse describes the shrines being defiled by the remains of the people who used them. The text does not explain the detail; the account of Josiah’s reform shows the practice. When Josiah destroyed the high places he “filled their places with the bones of men” ([[2 Kgs. 23:14]]), and he took bones from the tombs “and burned them upon the altar, and polluted it” ([[2 Kgs. 23:16]]).

      Here the bones are the worshippers’ own. The dead are laid “before their idols,” and the altars are ringed with their bones.
    sources: [lds-scriptures, gill-exposition]

  - ref: 7
    phrase: 'ye shall know that I am the LORD'
    kind: scripture
    title: 'Ye shall know that I am the LORD'
    body: |
      This sentence states the purpose of everything in the chapter, and it comes four times (verses 7, 10, 13, 14). It goes on in the next chapter, “and ye shall know that I am the LORD” ([[Ezek. 7:4]]), and it is still being said near the end of the book: “Then shall they know that I am the LORD their God” ([[Ezek. 39:28]]).

      Each time it is tied to something the Lord does. In verse 7 it follows the fall of the slain; in verse 13 it comes “when their slain men shall be among their idols”; in verse 14 it follows the desolation of the land. In verse 10 it belongs to the survivors, who also learn that He has “not said in vain” what He would do. In this chapter, then, the knowledge comes through events: the people will know who He is by what He does.
    sources: [lds-scriptures]

  - ref: 8
    phrase: 'Yet will I leave a remnant'
    kind: scripture
    title: 'A remnant that remembers'
    body: |
      The promise of survivors comes in the middle of the judgment, and that is typical of this prophet: even his harshest predictions “were counterbalanced by an immediate addendum of hope.” Here the hope follows directly on the bones before the altars.

      What the remnant does is told in three verbs: they “shall remember me,” they “shall lothe themselves,” and they “shall know that I am the LORD.” Nothing is said here about their return. The change described is inward, and it happens “among the nations whither they shall be carried captives.”

      The loathing is named twice more in the book. In chapter 20 it comes after the Lord has brought them into the land: “there shall ye remember your ways… and ye shall lothe yourselves in your own sight” ([[Ezek. 20:43]]). It comes once more in chapter 36 ([[Ezek. 36:31]]).
    sources: [lund-ezekiel, lds-scriptures]

  - ref: 9
    phrase: 'I am broken with their whorish heart'
    kind: words
    title: 'Who is broken?'
    body: |
      In the King James Version it is the Lord who is broken, and the Hebrew has been read in more than one way. The verb is in the first person, “I,” in a form that can be passive. Read that way, the survivors remember how God Himself was hurt: “I have been broken over their whoring heart” in one modern translation, “I was crushed by their wanton heart” in another.

      The other reading makes the people’s heart the thing broken. The verse is also listed with those where the verb means to “break, rupture, heart,” and the form has been taken as middle (an action done for oneself) rather than passive, which gives “when I have broken to me their whorish heart”: the Lord breaks, for Himself, the heart that left Him. The ancient Greek translation has something else again: “I have sworn an oath against their heart that goes a-whoring from me.”

      On either reading the verse’s image is the same. A “whorish heart” “refers to the idolatry practiced by Israel,” in the prophets’ figure where “Jehovah is the husband and the nation Israel is the wife.” Idolatry in that figure is unfaithfulness to a husband. Ezekiel takes up the figure in chapter 16 ([[Ezek. 16]]).
    sources: [oshb-wlc, esv, nrsvue, bdb, keil-ezekiel, lxx-rahlfs, ot-manual-26]

  - ref: 11
    phrase: 'Smite with thine hand, and stamp with thy foot'
    kind: symbol
    title: 'Clapping, stamping, and Alas'
    body: |
      The prophet is told to act out the Lord’s feeling about Israel’s idolatry before he speaks it. To “smite with thine hand” is to strike one hand against the other, and clapping and stamping are “the gestures which indicate violent excitement.” Elsewhere the same gesture shows anger. When Balak’s “anger was kindled against Balaam,” he “smote his hands together” ([[Num. 24:10]]), and later in this book the Lord says of Himself, “I will also smite mine hands together, and I will cause my fury to rest” ([[Ezek. 21:17]]). Ezekiel’s body is to show “the displeasure of Jehovah at the horrible idolatry of the people.”

      The word that goes with the gesture is a lament. “Alas” is a small Hebrew cry, *ach*, “ah! alas!”, “an exclamation of lamentation” found only here and once in chapter 21. (The ancient Greek translation has “Aha, aha!” in its place.) In the Hebrew, the gesture of displeasure and the cry of grief come together. The judgment is deserved, and it is announced with a groan.
    sources: [keil-ezekiel, bdb, lxx-rahlfs, lds-scriptures]

  - ref: 12
    phrase: 'He that is far off shall die of the pestilence'
    kind: scripture
    title: 'Far off, near, and left in the city'
    body: |
      Verse 12 says that distance from the fighting will save no one: three places, three deaths. The same three deaths were named in the previous chapter, where Ezekiel divided his shaved hair in thirds and was told, “A third part of thee shall die with the pestilence, and with famine shall they be consumed in the midst of thee: and a third part shall fall by the sword round about thee; and I will scatter a third part into all the winds” ([[Ezek. 5:12]]). They are also Jeremiah’s: “I will consume them by the sword, and by the famine, and by the pestilence” ([[Jer. 14:12]]).

      One word in the verse is translated two ways. Where the King James has “he that remaineth and is besieged,” modern versions have “he who is left and is preserved” or “any who are left and are spared,” while the ancient Greek agrees with the King James: “he that is in the siege.” On the modern rendering, even the one who has come through the pestilence and the sword dies of famine.
    sources: [lds-scriptures, esv, nrsvue, lxx-rahlfs]

  - ref: 13
    phrase: 'sweet savour'
    kind: words
    title: 'A sweet savour offered to idols'
    body: |
      “Sweet savour” is the language of the Lord’s own altar, used here of offerings to idols. The Hebrew phrase means a “soothing, tranquillizing odour” and is the regular term for “sacrifices acceptable to” the Lord. It first appears when Noah offered after the Flood, “And the LORD smelled a sweet savour” ([[Gen. 8:21]]), and it runs through the laws of sacrifice. It is used of “sacrifice to idols” only in Ezekiel, here and in two later chapters.

      The choice of words carries the charge. The term for offerings acceptable to the Lord is given here to what Israel offered “to all their idols” on the hills.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 14
    phrase: 'the wilderness toward Diblath'
    kind: history
    title: 'Diblath or Riblah'
    body: |
      No one knows where Diblath was, and since Jerome some have taken the name as a copying slip for Riblah. The Hebrew here is *Diblathah*, and of that place the plain statement is, “The wilderness of Diblah is unknown.” The words themselves are “obscure”: they can be taken as the King James takes them, a comparison (“more desolate than the wilderness”), or as a boundary, from the wilderness as far as the place named.

      Riblah differs from it in Hebrew by its first letter, and the two letters are easily confused in manuscripts. The change was “already proposed by Jerome,” has been accepted by a number of scholars since, and modern translations adopt it: “from the wilderness to Riblah,” with a note that the Hebrew has Diblah. One of them reports that some Hebrew manuscripts do read Riblah. On this reading the phrase marks the whole land from end to end, the wilderness at one end and Riblah far to the north. It was at “Riblah in the land of Hamath” that the king of Babylon passed judgment on Zedekiah after Jerusalem fell ([[Jer. 52:9–10]]).

      The correction has been resisted on the grounds that all the ancient versions support the letter as it stands, and that Riblah lay outside the land’s northern border; on that view the King James comparison, “more desolate than the wilderness,” is the more probable sense. The question is not settled. Either way the sense of the verse is clear: the desolation covers the land “in all their habitations.”
    sources: [keil-ezekiel, clarke-commentary, bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

christ: |
  The chapter does not speak of the Messiah. Its witness is in who is speaking. The One who says “I am the LORD” four times here is Jehovah, and “Jehovah is the premortal Jesus Christ.” The name itself “denotes ‘the eternal I Am,’” the name the Savior took on His own lips: “Before Abraham was, I am” ([[John 8:58]]).

  Read with that in mind, the “I” of the chapter is His. In the King James wording of verse 9 it is He who is “broken” by His people’s unfaithful heart, and in verse 8 it is He who leaves a remnant that will remember Him.

explore: |
  - The warning this chapter carries out: [[Lev. 26:27–45]], from the high places and the scattering to the remembered covenant.
  - The second address to the mountains of Israel, where the judgment is reversed: [[Ezek. 36:1–15]].
  - The companion oracle that follows: [[Ezek. 7]].
  - Josiah’s destruction of the high places: [[2 Kgs. 23:4–20]].
  - The remnant’s remembering and self-loathing, twice more: [[Ezek. 20:42–44]] and [[Ezek. 36:31]].

