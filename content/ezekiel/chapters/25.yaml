chapter: 25
title: 'Because Thou Saidst, Aha'
tagline: 'Four neighbors watched Judah fall. Ammon cheered, Moab said Judah was a nation like any other, and Edom and the Philistines took their revenge. The Lord answers each in turn.'
when: 'No date of its own. The nearest date above it is the ninth year, tenth month, tenth day (24:1), about 588 B.C.; the next is the eleventh year (26:1). Verse 3 speaks of the sanctuary as already profaned and Judah as gone into captivity, so the chapter appears to look back on the fall of Jerusalem (586 B.C.).'

setting: |
  With this chapter the book turns from Jerusalem to its neighbors. Chapters 25–32 are “prophecies against Israel’s enemies,” seven nations in all: Ammon, Moab, Edom, and Philistia here, then Tyre, Sidon, and Egypt. The first four are gathered into a single word of the Lord. Ammon lay east of Gilead, Moab east of the Dead Sea, Edom south of it, and the Philistines on the Mediterranean coast.

  The chapter has no date. It stands after the ninth-year heading of [[Ezek. 24:1]] and before the eleventh year of [[Ezek. 26:1]], but verse 3 treats the temple’s profaning and Judah’s captivity as done, and the oracles have been placed just after Jerusalem’s fall, “since they presuppose its having occurred.” The dates in chapters 25–32 are not in order; the arrangement goes by nation.

  At the end of chapter 24 Ezekiel was told that his mouth would be opened when a fugitive brought him news of the city ([[Ezek. 24:26–27]]). That news comes at [[Ezek. 33:21]]. The words to the nations stand between.

  They answer a question the exiles could fairly ask: if Judah is destroyed for living like its neighbors, why are the neighbors left alone? They are not.

thread: |
  Four short oracles are built the same way. “Because” names what the nation did, “therefore” gives the sentence, and each closes with what the nation will come to know. Ammon gets the pattern twice (verses 3–5 and 6–7).

  Every charge is about one moment, the fall of Judah, and about how a neighbor behaved while watching it. Ammon said “Aha” and clapped. Moab said that Judah was like every other nation. Edom and the Philistines took revenge.

  The sentences fit the charges. The two that mocked are handed, land and towns, to the men of the east. The two that took vengeance meet the Lord’s: the Hebrew word for vengeance comes ten times in verses 12–17, six times for what Edom and the Philistines did and four for what the Lord will do.

  Through all of it the Lord says “my sanctuary” (verse 3) and “my people Israel” (verse 14), though the sanctuary is profaned and the people are captives.

sections:
  - range: 1-7
    heading: 'Ammon: Aha against the sanctuary'
    plain: |
      The word of the Lord comes to Ezekiel again. He is to set his face against the Ammonites and prophesy against them. The Lord God says: Because you said “Aha” against My sanctuary when it was profaned, against the land of Israel when it was desolate, and against the house of Judah when they went into captivity, I will give you to the men of the east as a possession. They will set their palaces and their dwellings in you, eat your fruit, and drink your milk. Rabbah will be a stable for camels and the Ammonites a resting place for flocks, and you will know that He is the Lord.

      Because you clapped your hands, stamped your feet, and rejoiced in heart with all your contempt against the land of Israel, the Lord will stretch out His hand on you and give you as spoil to the nations. He will cut you off from the peoples and make you perish out of the countries. He will destroy you, and you will know that He is the Lord.
  - range: 8-11
    heading: 'Moab: Judah is like all the heathen'
    plain: |
      The Lord God says: Because Moab and Seir say, “The house of Judah is like all the heathen,” He will open the side of Moab from the cities, from its cities on its frontiers, the glory of the country: Beth-jeshimoth, Baal-meon, and Kiriathaim. He will give it, with the Ammonites, to the men of the east as a possession, so that the Ammonites will not be remembered among the nations. He will execute judgments on Moab, and they will know that He is the Lord.
  - range: 12-14
    heading: 'Edom: vengeance on the house of Judah'
    plain: |
      The Lord God says: Because Edom has acted against the house of Judah by taking vengeance, and has greatly offended, and revenged himself on them, the Lord will stretch out His hand on Edom and cut off man and beast from it. He will make it desolate from Teman, and those of Dedan will fall by the sword. He will lay His vengeance on Edom by the hand of His people Israel. They will do in Edom according to His anger and His fury, and Edom will know His vengeance.
  - range: 15-17
    heading: 'The Philistines: the old hatred'
    plain: |
      The Lord God says: Because the Philistines have acted in revenge, and have taken vengeance with a spiteful heart, to destroy for the old hatred, He will stretch out His hand on the Philistines, cut off the Cherethims, and destroy the remnant of the sea coast. He will execute great vengeance on them with furious rebukes, and they will know that He is the Lord when He lays His vengeance on them.

notes:
  - ref: 3
    phrase: 'Because thou saidst, Aha'
    kind: words
    title: 'Aha'
    body: |
      “Aha” is a cry of pleasure at someone else’s ruin. The Hebrew *heʾach* is an interjection of joy, used in the Psalms and here for “satisfaction over the misfortune of an enemy or rival”; it has been called “an expression of malicious joy.” Ezekiel has the word three times, and each time a neighbor is watching Israel fall. Ammon says it here. Tyre says it in the next chapter: “Aha, she is broken that was the gates of the people” ([[Ezek. 26:2]]). And “the enemy” says it over Israel’s emptied hills: “Aha, even the ancient high places are ours in possession” ([[Ezek. 36:2]]).

      Verse 6 makes the charge a second time and adds the body to the voice: clapping, stamping, and a heart that rejoiced “with all thy despite.” The gestures are explained in the note on [[Ezek. 6:11]]. The word behind “despite” means “despite, contempt,” and it is listed in three places only, all in this book: here, in verse 15 of the Philistines, and at [[Ezek. 36:5]].

      The scorn was not new. The Ammonites were “descended from Lot, the nephew of Abraham.” Yet Zephaniah heard “the revilings of the children of Ammon” ([[Zeph. 2:8]]), and Ezekiel’s earlier word against them was “concerning the Ammonites, and concerning their reproach” ([[Ezek. 21:28]]).
    sources: [bdb, ot-manual-27, oshb-wlc, bd-ammon, lds-scriptures]

  - ref: 4
    phrase: 'they shall set their palaces in thee'
    kind: words
    title: 'Encampments, not palaces'
    body: |
      The “palaces” of verse 4 are nomads’ camps. The Hebrew word means an “encampment, especially of circular encampment of nomad tribes,” and a modern translation has “they shall set their encampments among you.” The “men of the east” are in Hebrew the “sons of the east,” the same name the King James Version gives as “children of the east” in the story of Gideon: “the Midianites came up, and the Amalekites, and the children of the east” ([[Judg. 6:3]]). The verse does not say more about who they are.

      So the sentence on Ammon is that nomads will pitch their camps on its land and live on its fruit and milk. The capital goes the same way. Rabbah was the “chief city of the Ammonites” (see the note on [[Ezek. 21:19]]); the “stable for camels” of verse 5 is “a pasture for camels” in a modern translation, and the people themselves become “a fold for flocks.”
    sources: [bdb, oshb-wlc, esv, bd-rabbah, lds-scriptures]

  - ref: 8
    phrase: 'the house of Judah is like unto all the heathen'
    kind: history
    title: 'Like all the nations'
    body: |
      Moab’s offense is a single sentence: Judah has turned out to be a nation like the rest. The saying has been read as “misunderstanding and despising the divine election of Israel”: to say that Judah was like all the nations was to say that it “had no pre-eminence over them, and shared the same fate as they.”

      “And Seir” joins Edom to the saying. Seir is “the mountain ridge that ran south from the Dead Sea through the land of Edom.” The ancient Greek translation does not have the two words, and one modern translation follows it (“Because Moab said”). The sentence in verses 9–11 falls on Moab alone, and Edom has its own oracle from verse 12.
    sources: [keil-ezekiel, bd-seir, lxx-rahlfs, nrsvue, esv]

  - ref: 9
    phrase: 'I will open the side of Moab'
    kind: words
    title: 'Moab’s shoulder laid open'
    body: |
      “Side” is the Hebrew word for a shoulder, and the picture is of a flank left open to an enemy: the side of Moab “exposed to invasion.” A modern translation has “I will lay open the flank of Moab.”

      The opening is made at three named towns, “the glory of the country.” Two of them had once been Israel’s. “The children of Reuben built Heshbon, and Elealeh, and Kirjathaim” ([[Num. 32:37]]), and Baal-meon is in the next verse of the same list ([[Num. 32:38]]). In Jeremiah’s oracle Kiriathaim is counted among the towns of Moab ([[Jer. 48:23]]).

      Moab then receives the sentence already passed on Ammon: its land goes to the men of the east. The note on [[Jer. 48:1]] says who the Moabites were.
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 10
    phrase: 'that the Ammonites may not be remembered among the nations'
    kind: history
    title: 'What became of Ammon'
    body: |
      Ammon was brought under Babylon within a few years of Jerusalem’s fall, but as a people it lasted for centuries more. Josephus writes that in the fifth “year after the destruction of Jerusalem, which was the twenty third of the reign of Nebuchadnezzar,” the king “made war against the Ammonites, and Moabites” and brought them “under subjection.” These verses are among those cited for the time when the Ammonites, long independent, “fell under the power of Assyria and Chaldea.”

      The people did not vanish then. Under foreign rule the nation “retained its individuality for two centuries after Christ till it disappeared, absorbed by the advance of the Arabs.”

      The promise itself is repeated from the earlier oracle against Ammon, which ended, “thou shalt be no more remembered” ([[Ezek. 21:32]]).
    sources: [josephus-antiquities, bd-ammon, lds-scriptures]

  - ref: 12
    phrase: 'by taking vengeance'
    kind: history
    title: 'What Edom did'
    body: |
      Edom is charged with deeds, not words: it took its revenge on Judah when Judah was down. Ezekiel does not say what the deeds were. Other scripture does. A psalm of the exiles prays, “Remember, O LORD, the children of Edom in the day of Jerusalem; who said, Rase it, rase it, even to the foundation thereof” ([[Ps. 137:7]]). Obadiah says Edom “stood in the crossway, to cut off those of his that did escape” ([[Obad. 1:14]]). Ezekiel’s own longer oracle against Edom says it “shed the blood of the children of Israel by the force of the sword in the time of their calamity” ([[Ezek. 35:5]]).

      The two peoples were kin. Edom was Esau’s nation, and Amos had condemned it “because he did pursue his brother with the sword” ([[Amos 1:11]]). “In spite of the kinship there seems to have been great mutual hatred.” The notes on [[Jer. 49:7]] and [[Mal. 1:3]] say more about Edom and Israel.

      The sentence names two places. Teman is the Edomite name in Amos’s oracle too, “I will send a fire upon Teman” ([[Amos 1:12]]), and Jeremiah warns the “inhabitants of Dedan” in his words to Edom ([[Jer. 49:8]]). A modern translation takes the pair as the two ends of one sweep: “from Teman even to Dedan they shall fall by the sword.”
    sources: [lds-scriptures, bd-edom, esv]

  - ref: 14
    phrase: 'by the hand of my people Israel'
    kind: scripture
    title: 'Edom and the hand of Israel'
    body: |
      In this chapter Edom is the only one of the four whose judgment is put into Israel’s hand. Ammon and Moab are given to the men of the east, and no agent is named for the Philistines. Other prophets say the like of Edom. Obadiah: “the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble” ([[Obad. 1:18]]). Amos: when the Lord raises up “the tabernacle of David that is fallen” ([[Amos 9:11]]), His people will “possess the remnant of Edom” ([[Amos 9:12]]). Isaiah, of gathered Israel: “they shall lay their hand upon Edom and Moab” ([[Isa. 11:14]]).

      When this was to happen is a matter of interpretation. One reading is that it “commenced with the subjugation of the Edomites by the Maccabees” but is not exhausted there, and that the complete fulfillment belongs to “the time when the kingdom of God is perfected.” The reason given is that Edom stands in these prophecies for more than itself, “as a type of the implacable enmity of the heathen world towards the people and kingdom of God.”

      Modern revelation uses Edom’s other name, Idumea, in that wider sense; the note on [[Isa. 34:5]] explains it.
    sources: [lds-scriptures, keil-ezekiel, bd-idumea]

  - ref: 14
    phrase: 'they shall know my vengeance'
    kind: scripture
    title: 'Vengeance for vengeance'
    body: |
      Three of the four oracles end “they shall know that I am the LORD”; Edom’s ends “they shall know my vengeance.” Here “the formula takes a harsher form,” and the word matches the charge. Edom acted “by taking vengeance” and “revenged himself”; the Lord answers twice with “my vengeance,” the same Hebrew root. The Philistines’ oracle does the same in verses 15 and 17.

      The refrain was explained at its first cluster (see the note on [[Ezek. 6:7]]). What is new in this chapter is the hearer, a foreign nation, and through the oracles that follow the formula “regularly returns in the case of all the nations.”

      The text does not say what the nations’ knowing amounts to. One reading is that they “will discern in their destruction the punitive righteousness of God,” so that the formula itself holds out no promise; on that reading Ezekiel is silent about any salvation that might come to the nations out of the judgment, “but without in the least degree denying it.” Jeremiah, for his part, closes his oracles on two of these peoples with a return: “Yet will I bring again the captivity of Moab in the latter days” ([[Jer. 48:47]]); “I will bring again the captivity of the children of Ammon” ([[Jer. 49:6]]). The promise Ezekiel attaches to these oracles is for Israel: when her neighbors are judged, “there shall be no more a pricking brier unto the house of Israel” ([[Ezek. 28:24]]).
    sources: [keil-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 16
    phrase: 'I will cut off the Cherethims'
    kind: words
    title: 'Cutting off the Cherethims'
    body: |
      “I will cut off” and “the Cherethims” sound alike in Hebrew: the verb is *hikratti* and the name is *keretim*, with the same three consonants in each. The Cherethims are “a name for Philistines or a part of them.” Zephaniah uses it as Ezekiel does, “Woe unto the inhabitants of the sea coast, the nation of the Cherethites!” ([[Zeph. 2:5]]), and in David’s story a district is called “the south of the Cherethites” ([[1 Sam. 30:14]]).

      The name is “perhaps = Cretans.” The ancient Greek translation has “Cretans” in this verse, and that has been preferred as the better translation. It suits what scripture says of the Philistines’ origin: the Lord brought “the Philistines from Caphtor” ([[Amos 9:7]]), and Caphtor is “Crete, or perhaps part of Egypt.” The note on [[Jer. 47:1]] says who the Philistines were.

      Their motive is “the old hatred,” in a modern translation “never-ending enmity.” The same two Hebrew words are used of Edom, which had “a perpetual hatred” ([[Ezek. 35:5]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, ot-manual-27, bd-philistines, esv, lds-scriptures]

christ: |
  Latter-day revelation makes Edom’s other name a name for the world the Lord will judge at His coming: He “shall come down in judgment upon Idumea, or the world” ([[D&C 1:36]]). The vengeance that Israel is to carry out on Edom (verse 14) has also been read as consisting chiefly in the judgment “which Israel will execute in the person of Christ.”

explore: |
  - Jeremiah on the same four peoples: [[Jer. 47]] (the Philistines), [[Jer. 48]] (Moab), [[Jer. 49:1–6]] (Ammon), and [[Jer. 49:7–22]] (Edom).
  - Zephaniah’s oracle on the Philistines, Moab, and Ammon: [[Zeph. 2:4–11]].
  - Obadiah, the whole of which is about Edom and “the day of Jerusalem”: [[Obad. 1:10–21]].
  - Ezekiel’s longer oracle against Edom, and the word to Israel’s mountains that answers “Aha”: [[Ezek. 35]]; [[Ezek. 36:1–7]].
  - Isaiah’s day of vengeance, with one who comes from Edom, and the revelation that repeats it: [[Isa. 63:1–4]]; [[D&C 133:46–51]].
  - What comes next: Tyre says “Aha” over Jerusalem and is answered at length: [[Ezek. 26:1–6]].
  - The promise to Israel that closes the oracles on her neighbors: [[Ezek. 28:24–26]].

