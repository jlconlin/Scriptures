chapter: 48
title: 'The LORD Is There'
tagline: 'The land is divided among the twelve tribes in bands from north to south, with a holy portion in the middle for the sanctuary, the priests, the Levites, and the city. The city has twelve gates named for the tribes, and it is given a new name.'
when: 'No date of its own. The chapter ends the vision dated at 40:1, “in the fourteenth year after that the city was smitten” (about 572 B.C., counting from the book’s first date).'

setting: |
  This is the last chapter of the book and the end of the vision that began at [[Ezek. 40:1]], when Jerusalem had been “smitten” for fourteen years.

  The vision has moved outward from the temple. Chapters 40–46 measured the house and gave its laws. Chapter 47 followed the river that runs out of it and then drew the borders of the land, with the promise that the tribes would inherit it “one as well as another” ([[Ezek. 47:14]]). This chapter fills those borders in. It names a place for every tribe, returns to the holy portion of land first described in [[Ezek. 45:1–8]], and ends at the city. The two chapters together give Israel the land of promise as a permanent inheritance.

  The temple at the center of this map belongs to the book’s fourth division, the visions of a rebuilt temple and its worship. When and where it will be built is taken up in the setting of [[Ezek. 40]].

thread: |
  The chapter is a map, and it is drawn around one point. It reads from north to south: seven tribes (verses 1–7), a band across the middle set apart as an offering (8–22), and five tribes below it (23–29). Then it goes back to the middle and ends at the city (30–35).

  The view narrows as the chapter goes. From the whole land it comes to the offering, a square of twenty-five thousand on each side, and the square is divided among the priests, the Levites, and the city. Three times the chapter says what stands in the middle of it all: “the sanctuary shall be in the midst of it” (verse 8, and again in verses 10 and 21).

  The tribes are placed around that center. Twelve strips of land go to them, and the city’s twelve gates carry their names.

  The last thing measured is the city, and the last thing said about it is its name. The book opened with Ezekiel “among the captives by the river of Chebar” ([[Ezek. 1:1]]), seeing the glory of the Lord far from Jerusalem. It closes with a city called “The LORD is there.”

sections:
  - range: 1-7
    heading: 'Seven tribes in the north'
    plain: |
      These are the names of the tribes. At the north end, along the way of Hethlon toward Hamath, to Hazar-enan and the border of Damascus, Dan has a portion from the east side to the west. Next to Dan, from the east side to the west, is a portion for Asher. Then come Naphtali, Manasseh, Ephraim, Reuben, and Judah, each beside the one before and each from the east side to the west.
  - range: 8-14
    heading: 'The holy portion: priests and Levites'
    plain: |
      Next to Judah, from the east side to the west, is the offering the people are to set apart. It is twenty-five thousand reeds broad and as long as one of the tribes’ portions, and the sanctuary is in the middle of it. The oblation offered to the Lord is twenty-five thousand long and ten thousand broad. This holy oblation, of that length on the north and south and that breadth on the west and east, is for the priests, with the sanctuary of the Lord in the middle. It is for the sanctified priests of the sons of Zadok, who kept the Lord’s charge and did not go astray when the children of Israel went astray, as the Levites did. It is a most holy thing to them, beside the border of the Levites. Alongside the priests’ border the Levites have twenty-five thousand in length and ten thousand in breadth. They are not to sell any of it, exchange it, or transfer the firstfruits of the land, because it is holy to the Lord.
  - range: 15-20
    heading: 'The city and its land'
    plain: |
      The five thousand left over in breadth, along the twenty-five thousand, is a common place for the city, for dwelling and for suburbs, and the city is in the middle of it. The city measures four thousand five hundred on each of its four sides, and its suburbs are two hundred and fifty on each side. What remains of the length beside the holy portion, ten thousand to the east and ten thousand to the west, grows food for those who serve the city, and they come from all the tribes of Israel. The whole oblation is twenty-five thousand by twenty-five thousand: the holy oblation is offered foursquare, together with the possession of the city.
  - range: 21-22
    heading: 'The prince’s portion'
    plain: |
      What is left on both sides of the holy oblation and the city’s possession belongs to the prince: from the twenty-five thousand to the east border, and westward to the west border, alongside the tribes’ portions. The holy oblation and the sanctuary of the house are in the middle of it. The possession of the Levites and the possession of the city lie in the middle of what is the prince’s. What is between the border of Judah and the border of Benjamin is his.
  - range: 23-29
    heading: 'Five tribes in the south'
    plain: |
      Then the rest of the tribes, each from the east side to the west: Benjamin, Simeon, Issachar, Zebulun, and Gad, each beside the one before. On the south side of Gad the border runs from Tamar to the waters of strife in Kadesh, and to the river toward the great sea. This is the land they are to divide by lot among the tribes of Israel for an inheritance, and these are their portions, says the Lord God.
  - range: 30-35
    heading: 'The gates and the name'
    plain: |
      These are the goings out of the city. The north side measures four thousand five hundred. The gates of the city are named for the tribes of Israel. On the north are three gates: Reuben, Judah, and Levi. The east side is four thousand five hundred, with three gates: Joseph, Benjamin, and Dan. The south side is four thousand five hundred, with three gates: Simeon, Issachar, and Zebulun. The west side is four thousand five hundred, with three gates: Gad, Asher, and Naphtali. It is eighteen thousand measures around. From that day the name of the city will be, The Lord is there.

notes:
  - ref: 1
    phrase: 'a portion for Dan'
    kind: history
    title: 'Twelve strips across the land'
    body: |
      The land is divided here as it never was under Joshua: every tribe receives a band that runs the whole width of the country, from the Mediterranean on the west to the Jordan and the Dead Sea on the east. In the first division the territories were of many shapes and sizes, and several “covered only half the breadth of the land.” Two tribes and a half had received their land east of the Jordan. Now all twelve are west of it, and Gad is “brought over from Gilead to Canaan.” The portions are also taken to be equal: the chapter gives none of them a measurement, and the rule was stated just before: “ye shall inherit it, one as well as another” ([[Ezek. 47:14]]).

      The order of the tribes from north to south is harder to account for, and it has been judged “impossible to discover any universal principle of arrangement.” Two things can be said. Dan stands first, on the northern border. Part of that tribe had moved north in the days of the Judges and named a city Dan ([[Judg. 18:27–29]]), and from then on Dan was generally named as the land’s northern limit. And the holy portion lies between Judah and Benjamin, “probably” because Jerusalem had stood on the border of those two tribes.

      Levi is not in the list; the Levites’ land is inside the holy portion (verse 13). Joseph is in it twice, as Manasseh and Ephraim, which is how the count comes to twelve: “Joseph shall have two portions” ([[Ezek. 47:13]]).
    sources: [ot-manual-27, keil-ezekiel, lds-scriptures]

  - ref: 8
    phrase: 'the offering which ye shall offer'
    kind: words
    title: 'An offering made of land'
    body: |
      The “offering,” or “oblation,” is land, the “holy portion of the land” commanded earlier in the vision (see the note on [[Ezek. 45:1]]). This chapter says how it is divided.

      There are three bands, and each is described differently. The priests’ band holds the sanctuary and is “a thing most holy” (verse 12). The Levites’ band is “holy unto the LORD,” which is the reason given for the rule that they may not sell or trade it (verse 14). The third band, half as wide, is the city’s, and it is called “profane,” which here means common (see the note on [[Ezek. 42:20]]). Ten thousand, ten thousand, and five thousand make the twenty-five thousand of verse 20, so the whole is “foursquare.”

      How large that is depends on a word the Hebrew does not have. Verse 8 gives the number and no unit; “reeds” is the translators’ choice. Modern translations choose cubits instead, “25,000 cubits in breadth,” which is “about 8 miles” on a side. A reed in this vision is “six cubits long” ([[Ezek. 40:5]]), so reeds would make each side six times longer. The same question comes up at the wall of the temple, where both answers are set out (see the note on [[Ezek. 42:16]]).
    sources: [oshb-wlc, esv, niv, lds-scriptures]

  - ref: 15
    phrase: 'for dwelling, and for suburbs'
    kind: words
    title: 'Suburbs: open land around the city'
    body: |
      “Suburbs” in this verse are open land around the city. The Hebrew word, *migrash*, means “common-land, open land,” perhaps at first pasture, and it is the usual word for the land around the Levites’ cities in the law of Moses ([[Num. 35:2–5]]). Here it is used of the “lands surrounding the holy city.”

      The numbers then fit together. The city is four thousand five hundred on a side, and the open land adds two hundred and fifty on every side (verse 17), which fills the five-thousand width of the city’s band. The rest of the band, ten thousand to the east and ten thousand to the west, grows food for “them that serve the city” (verse 18), also translated “the workers of the city,” who “till it.”

      The city belongs to no single tribe. Those who serve it come “out of all the tribes of Israel” (verse 19), and its land was assigned earlier in the same terms: “it shall be for the whole house of Israel” ([[Ezek. 45:6]]).
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 21
    phrase: 'the residue shall be for the prince'
    kind: scripture
    title: 'Land for the prince'
    body: |
      The prince receives what is left of the middle band, to the east and to the west of the square, and earlier chapters forbid him to take any of the people’s land. When this land was first assigned, the Lord said, “In the land shall be his possession in Israel: and my princes shall no more oppress my people; and the rest of the land shall they give to the house of Israel according to their tribes” ([[Ezek. 45:8]]). The law of the prince’s inheritance says it again: he “shall not take of the people’s inheritance by oppression,” and he is to provide for his sons “out of his own possession: that my people be not scattered every man from his possession” ([[Ezek. 46:18]]).

      His land lies on both sides of the holy portion, between Judah and Benjamin (verse 22), and the sanctuary is in the middle of it. The chapter does not say who the prince is. In this vision he first appears at [[Ezek. 44:3]].
    sources: [lds-scriptures]

  - ref: 31
    phrase: 'one gate of Reuben, one gate of Judah, one gate of Levi'
    kind: scripture
    title: 'Twelve gates, with Levi and Joseph among them'
    body: |
      The gates count the twelve tribes differently from the land. In the land Levi has no strip of his own, and “Joseph shall have two portions” ([[Ezek. 47:13]]). At the gates “Levi is included,” and so Ephraim and Manasseh “are united in the one tribe of Joseph.”

      The order of the gates has been read as going by the mothers of Jacob’s sons ([[Gen. 35:23–26]]). On the north are three sons of Leah: Reuben, Judah, and Levi, who also come first in the blessing of Moses ([[Deut. 33:6–8]]). On the east are Rachel’s two sons, Joseph and Benjamin, with Dan, the elder son of her maid. On the south are Leah’s other three, and on the west “the three other sons of the maids.” This is one reading; the text gives the names and no reason for their order.

      What the names do is plainer. They mark the city “as the city of all Israel.” John saw gates so named in the holy city shown to him: “twelve gates, and at the gates twelve angels, and names written thereon, which are the names of the twelve tribes of the children of Israel” ([[Rev. 21:12]]), with “on the east three gates; on the north three gates; on the south three gates; and on the west three gates” ([[Rev. 21:13]]).
    sources: [keil-ezekiel, lds-scriptures]

  - ref: 35
    phrase: 'The LORD is there'
    kind: words
    title: 'The city’s new name'
    body: |
      The book’s last words give the city a name, and in Hebrew it is two words: the divine name and *shammah*, “there.” It is sometimes left in Hebrew as “Jehovah-shammah.”

      “Jerusalem” is written in twenty-six verses of Ezekiel, the last of them [[Ezek. 36:38]], and not once in the nine chapters of this vision. At the start of the vision Ezekiel saw only “as the frame of a city” ([[Ezek. 40:2]]). The city is understood to be Jerusalem all the same, and the vision ends with “the city of Jerusalem receiving the comforting new name.”

      Joseph Smith’s translation changes the sentence: “and the name of the city from that day shall be called, Holy; for the Lord shall be there.” In that reading the city’s name is Holy.
    sources: [oshb-wlc, ot-manual-27, rennaker-holiness, lds-scriptures]

christ: |
  The last line of Ezekiel says where the Lord is. Earlier in the book the prophet watched the glory of the Lord leave the temple and the city by stages (see the note on [[Ezek. 11:23]]). In this vision he saw it come back by the east gate, and “the glory of the LORD filled the house” ([[Ezek. 43:5]]). The city’s name is given “from that day,” which is to say from then on.

  The Lord had promised it before the vision began: “My tabernacle also shall be with them: yea, I will be their God, and they shall be my people” ([[Ezek. 37:27]]). The vision of the temple came soon after that promise of a sanctuary, and the temple has been called a symbol to Israel that the Lord is with His people.

  John, in his vision of the holy city, heard “a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God” ([[Rev. 21:3]]).

  Who the LORD of Ezekiel’s visions is was said at the first of them (see the note on [[Ezek. 1:26]]).

explore: |
  - John’s holy city, with its twelve gates, its measuring reed, and its foursquare plan: [[Rev. 21:10–27]].
  - The camp of Israel in the wilderness, three tribes on each side of the tabernacle: [[Num. 2]].
  - Ether’s account of Jerusalem built up again as “a holy city unto the Lord,” and of a New Jerusalem for the seed of Joseph: [[Ether 13:5–11]].
  - The holy portion and the prince’s land as first given: [[Ezek. 45:1–8]].
  - The borders of the land, and the strangers who inherit with the tribes: [[Ezek. 47:13–23]].

