chapter: 30
title: 'The Day of Egypt'
tagline: 'The day of the LORD is coming on Egypt and on every people that props it up. Then, in a second word dated to the siege of Jerusalem, the Lord says He has already broken Pharaoh’s arm and will put His own sword in the hand of the king of Babylon.'
when: 'Two oracles. Verses 1–19 have no date and stand under the heading of 29:17, the twenty-seventh year, though they need not belong to it. Verses 20–26 are dated “in the eleventh year, in the first month, in the seventh day of the month” of Jehoiachin’s captivity (about 586 B.C.), while Jerusalem was under siege.'

setting: |
  Egypt is the last of the nations addressed in chapters 25–32, and it has four chapters (29–32). This chapter holds two of the Egypt oracles.

  The dates in this part of the book are not in order. The oracle that opens chapter 29 is dated to the tenth year, tenth month ([[Ezek. 29:1]]); the next jumps to “the seven and twentieth year” ([[Ezek. 29:17]]); and 30:20 goes back to the eleventh. The first oracle here (verses 1–19) has no date at all. Neither its heading nor its contents fix when it was spoken: some have put it with the oracle of the tenth year, others with that of the twenty-seventh.

  The second (verses 20–26) is dated exactly, and the date matters. Nebuchadrezzar had “set himself against Jerusalem” in the ninth year, tenth month ([[Ezek. 24:1–2]]), so this word comes in the second year of the siege, about three months after the oracle of 29:1. By Jeremiah’s reckoning the wall was breached in the fourth month of Zedekiah’s eleventh year ([[Jer. 39:2]]).

  Egypt was the help Jerusalem was counting on. Its king was Hophra (see the note on [[Ezek. 29:2]]), whose army marched out while the city was besieged, and Jeremiah, inside the walls, was told what would come of it: “Pharaoh’s army, which is come forth to help you, shall return to Egypt into their own land” ([[Jer. 37:7]]).

thread: |
  The chapter takes Egypt apart one support at a time. The previous chapter had called Egypt “a staff of reed to the house of Israel” that broke when it was leaned on ([[Ezek. 29:6–7]]). Here the Lord turns to the things Egypt itself leans on.

  First come those who hold her up: “They also that uphold Egypt shall fall” (verse 6), and “all her helpers shall be destroyed” (verse 8). Then the means is named, Nebuchadrezzar and his army (verses 10–12). Then the idols and the cities, eight places in Lower and Upper Egypt (verses 13–18). The second oracle comes last and is the most personal: Pharaoh’s own arm, the one that holds the sword, is already broken, and the other will be broken too (verses 21–22).

  Against all this falling one thing is made strong: “I will strengthen the arms of the king of Babylon, and put my sword in his hand” (verse 24). Four times, at verses 8, 19, 25, and 26, the result is the same: “they shall know that I am the LORD.”

sections:
  - range: 1-5
    heading: 'The day is near'
    plain: |
      The word of the Lord comes to Ezekiel again. He is to prophesy and say: Howl, and cry woe for the day. The day is near; the day of the Lord is near, a day of cloud, the time of the heathen. The sword will come on Egypt and great pain will be in Ethiopia when the slain fall in Egypt, when her multitude is taken away and her foundations are broken down. Ethiopia, Libya, Lydia, all the mingled people, Chub, and the men of the land that is in league will fall with them by the sword.
  - range: 6-9
    heading: 'Those who uphold Egypt'
    plain: |
      The Lord says that those who uphold Egypt will fall, and the pride of her power will come down; from the tower of Syene they will fall in her by the sword. They will be desolate among desolate countries, and her cities will lie among wasted cities. They will know that He is the Lord when He has set a fire in Egypt and all her helpers are destroyed. In that day messengers will go out from Him in ships to make the careless Ethiopians afraid, and great pain will come on them, as in the day of Egypt. It is coming.
  - range: 10-12
    heading: 'By the hand of Nebuchadrezzar'
    plain: |
      The Lord God says He will make the multitude of Egypt cease by the hand of Nebuchadrezzar king of Babylon. He and his people with him, the terrible of the nations, will be brought to destroy the land. They will draw their swords against Egypt and fill the land with the slain. The Lord will make the rivers dry, sell the land into the hand of the wicked, and lay the land waste, with all that is in it, by the hand of strangers. He, the Lord, has spoken it.
  - range: 13-19
    heading: 'The idols and the cities'
    plain: |
      The Lord God says He will destroy the idols and make the images cease out of Noph. There will be no more a prince of the land of Egypt, and He will put fear in the land. He will make Pathros desolate, set fire in Zoan, and execute judgments in No. He will pour His fury on Sin, the strength of Egypt, and cut off the multitude of No. He will set fire in Egypt: Sin will have great pain, No will be rent asunder, and Noph will have distresses daily. The young men of Aven and of Pi-beseth will fall by the sword, and these cities will go into captivity. At Tehaphnehes the day will be darkened when He breaks the yokes of Egypt there; the pomp of her strength will cease, a cloud will cover her, and her daughters will go into captivity. So He will execute judgments in Egypt, and they will know that He is the Lord.
  - range: 20-26
    heading: 'Pharaoh’s broken arm'
    plain: |
      In the eleventh year, on the seventh day of the first month, the word of the Lord comes to Ezekiel. The Lord has broken the arm of Pharaoh king of Egypt, and it will not be bound up to heal, nor wrapped to make it strong enough to hold the sword. The Lord God is against Pharaoh and will break his arms, the strong one and the one that was broken, and make the sword fall out of his hand. He will scatter the Egyptians among the nations and disperse them through the countries. He will strengthen the arms of the king of Babylon and put His sword in his hand, but He will break Pharaoh’s arms, and Pharaoh will groan before him like a man deadly wounded. The arms of the king of Babylon will be strengthened and the arms of Pharaoh will fall. They will know that He is the Lord when He puts His sword into the hand of the king of Babylon and he stretches it out on the land of Egypt. He will scatter the Egyptians among the nations, and they will know that He is the Lord.

notes:
  - ref: 2
    phrase: 'Woe worth the day'
    kind: words
    title: 'Woe worth the day'
    body: |
      “Worth” here is an old English verb meaning to be, not a word about value. By 1828 the verb survived “only in the phrases, wo worth the day, wo worth the man,” where it is an imperative: “wo be to the day.”

      The Hebrew is two short words, *hah la-yom*. The first is an “interjection expressing woe, alas!” and the phrase is “alas for the day!” Joel has almost the same cry, which the King James translates differently: “Alas for the day! for the day of the LORD is at hand” ([[Joel 1:15]]). The command before it, “Howl ye,” is plural. It is a call to wail, addressed to more than one hearer.
    sources: [webster-1828, bdb, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: 'a cloudy day; it shall be the time of the heathen'
    kind: scripture
    title: 'The day of the LORD, for the nations'
    body: |
      The day of the LORD, which other prophets announce for Zion and Judah, is here announced for Egypt. Joel’s day of the LORD is also a day of cloud, “for the day of the LORD cometh, for it is nigh at hand; A day of darkness and of gloominess, a day of clouds and of thick darkness” ([[Joel 2:1–2]]), and so is Zephaniah’s, “a day of clouds and thick darkness” ([[Zeph. 1:15]]). Ezekiel himself had announced such a day to the land of Israel: “the time is come, the day of trouble is near” ([[Ezek. 7:7]]).

      Here the last clause says whose day this one is. “Heathen” in the King James is the Hebrew *goyim*, “nations,” and the clause is literally a time of nations. Modern translations supply a word to make the sense plain, “a time of doom for the nations,” and note that the Hebrew lacks “doom.” The ancient Greek translation has “the end of the nations.”

      The cloud comes back at the end of the first oracle, where it settles on one city: “the day shall be darkened… a cloud shall cover her” (verse 18).
    sources: [lds-scriptures, oshb-wlc, esv, nrsvue, lxx-rahlfs]

  - ref: 5
    phrase: 'and Chub, and the men of the land that is in league'
    kind: history
    title: 'Egypt’s helpers'
    body: |
      The verse lists peoples who will fall with Egypt, and the last three in the list are uncertain. The first three are clearer once the King James names are set aside. “Ethiopia” is the Hebrew Cush, a country that ran “from Syene on the frontier of Egypt southward” and took in “the modern Nubia”: the land south of Egypt along the Nile. “Libya” is Put (or Phut) and “Lydia” is Lud. Cush and Phut stand beside Egypt in the table of nations, where Egypt’s Hebrew name is Mizraim: “the sons of Ham; Cush, and Mizraim, and Phut, and Canaan” ([[Gen. 10:6]]). Jeremiah names Ethiopians, Libyans, and Lydians as Egypt’s fighting men: “the Ethiopians and the Libyans, that handle the shield; and the Lydians, that handle and bend the bow” ([[Jer. 46:9]]).

      “The mingled people” translates a word for a “mixed company,” a “heterogeneous body attached to a people.” Jeremiah uses it of Egypt too: right after “Pharaoh king of Egypt, and his servants” he lists “all the mingled people” ([[Jer. 25:19–20]]).

      “Chub” is found as the name of a people in this verse alone. The ancient Greek translation has “Libyans” in the list, and it has been proposed that the Hebrew originally read *Lub*, Libya, one letter different. Some modern translations print “Libya” here for that reason, with a note that the Hebrew has “Cub.”

      “The men of the land that is in league” is, word for word, “the sons of the land of the covenant.” The Hebrew does not say which land or which covenant. Modern translations take it as an allied country (“the people of the allied land”), and one marks the meaning of the Hebrew as uncertain. The Greek translators wrote “the children of my covenant,” with “my” where the Hebrew has “the.”

      The verb that governs the whole list is not in doubt: they “shall fall with them by the sword.”
    sources: [bd-ethiopia, bdb, esv, nrsvue, lxx-rahlfs, oshb-wlc, lds-scriptures]

  - ref: 9
    phrase: 'messengers go forth from me in ships'
    kind: scripture
    title: 'Messengers sent to Cush'
    body: |
      Messengers go by ship to frighten Cush, the country south of Egypt, and the verse says the Lord is the one who sends them. Isaiah had spoken of envoys sent by water in that region, “ambassadors by the sea, even in vessels of bulrushes upon the waters” ([[Isa. 18:2]]), and Ezekiel has been read as having that verse in mind.

      On one reading, “from me” speaks of the Lord as present in Egypt while the judgment is carried out, as Isaiah had said: “the LORD rideth upon a swift cloud, and shall come into Egypt” ([[Isa. 19:1]]). Who the messengers are the verse does not say. The same reading takes them to be Egyptians fleeing south by ship, on the ground that an invading army would not be described as mere messengers.

      “Careless” does not mean negligent. The Hebrew is the word for “security,” and the phrase is Cush dwelling “securely”; a modern translation has “unsuspecting.”

      “As in the day of Egypt” can be taken two ways. Modern translations read it as the day now coming, “the day of Egypt’s doom,” noting that the Hebrew has only “the day of Egypt.” The King James “as in” has also been understood to point back to “the ancient, well-known day of judgment upon Egypt,” the Exodus, so that the pain in Cush is like the pain Egypt felt then.
    sources: [keil-ezekiel, bdb, esv, lds-scriptures]

  - ref: 13
    phrase: 'cause their images to cease out of Noph'
    kind: history
    title: 'Eight places, from the delta to the south'
    body: |
      Verses 13–18 name eight places, and together they cover both halves of the country, Lower Egypt, with the delta, and Upper Egypt, the south.

      - **Noph** is Memphis, the “ancient capital of Egypt,” in Lower Egypt.
      - **Pathros** is “Upper Egypt,” the south part of the country (see the note on [[Ezek. 29:15]]).
      - **Zoan** was in Lower Egypt, “in the Nile River delta”; the ancient Greek translation calls it Tanis.
      - **No** is “Thebes. Capital of Upper Egypt, taken by Assurbanipal about 660 B.C.”
      - **Sin** is Pelusium, the “east frontier city of Egypt.” The verse calls it “the strength of Egypt,” or in a modern translation “the stronghold of Egypt.”
      - **Aven** is On, or Heliopolis (see the note on [[Ezek. 30:17]]).
      - **Pi-beseth** is the Greek Bubastis, a “town of lower Egypt… about forty miles from Memphis.” The name is Egyptian, “House of Bast(et).”
      - **Tehaphnehes** is the Tahpanhes of Jeremiah (see the note on [[Ezek. 30:18]]).

      Verse 6 had already given the country’s length, which in the Hebrew is “from Migdol to Syene” (see the note on [[Ezek. 29:10]]).

      Verse 13 begins with the gods. Before any city is burned, “I will also destroy the idols,” and the images are to cease from the old capital. Jeremiah’s oracle against Egypt has the same concern: the Lord will punish “the multitude of No, and Pharaoh, and Egypt, with their gods, and their kings” ([[Jer. 46:25]]).
    sources: [ot-manual-27, bd-noph, bd-pathros, bd-no, bdb, esv, lxx-rahlfs, lds-scriptures]

  - ref: 17
    phrase: 'The young men of Aven'
    kind: words
    title: 'Aven: On under another name'
    body: |
      “Aven” is the city of On, and the name as the Hebrew text gives it here is a word of contempt. On is known from the story of Joseph, whose father-in-law was its priest ([[Gen. 41:45]]). It is the “sacred city of Heliopolis,” and it “was celebrated for worship of sun-god Ra.” The ancient Greek translation writes “Heliopolis” in this verse, and modern translations print “On.”

      The Hebrew consonants are those of On as it is spelled in [[Gen. 41:50]]. With the vowels of the traditional text, though, the word reads *aven*, which means “idolatry,” and the form has been described as “the contemptuous synonym” of the city’s name.

      Jeremiah, in Egypt, said of the same city under another of its names that Nebuchadrezzar would “break also the images of Beth-shemesh, that is in the land of Egypt” ([[Jer. 43:13]]). Beth-shemesh is Hebrew for the house of the sun.
    sources: [bdb, strongs-concordance, bd-on, ot-manual-27, oshb-wlc, lxx-rahlfs, esv, lds-scriptures]

  - ref: 18
    phrase: 'when I shall break there the yokes of Egypt'
    kind: scripture
    title: 'The yokes broken at Tehaphnehes'
    body: |
      The list ends at the border town to which the remnant of Judah fled after Jerusalem fell, and the breaking of yokes there has been read as the Exodus repeated. Tehaphnehes is Jeremiah’s Tahpanhes, identified with the Greek Daphnae and described as “the border fortress of the land towards Syria and Palestine.” Pharaoh had a house there. After Jerusalem fell, the Jews who would not listen to Jeremiah went down to it and took him along: “they obeyed not the voice of the LORD: thus came they even to Tahpanhes” ([[Jer. 43:7]]).

      The “yokes” are the bars of a yoke, a figure “of oppression.” The words “point back to” the Lord’s description of the Exodus, “I have broken the bands of your yoke, and made you go upright” ([[Lev. 26:13]]). On that reading the meaning is, “That which took place then is to be repeated here. The yokes which Egypt put upon the nations are to be broken.” Ezekiel uses the same expression later for Israel’s own deliverance, when they “shall know that I am the LORD, when I have broken the bands of their yoke” ([[Ezek. 34:27]]).

      The ancient Greek translation read the word differently, as “the scepters of Egypt,” and a modern translation has “the dominion of Egypt.” In each of these it is Egypt’s power over others that ends.

      The darkening of the day has been called the sign “of the dawning of the great day of judgment upon the nations.”
    sources: [keil-ezekiel, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 21
    phrase: 'I have broken the arm of Pharaoh king of Egypt'
    kind: history
    title: 'An arm already broken'
    body: |
      “I have broken” is past tense, and it has been read as pointing to something that had just happened: Pharaoh’s failed attempt to relieve Jerusalem. The Pharaoh is Hophra. Jeremiah records his march from inside the city: “Then Pharaoh’s army was come forth out of Egypt: and when the Chaldeans that besieged Jerusalem heard tidings of them, they departed from Jerusalem” ([[Jer. 37:5]]). For a moment the siege lifted. Jeremiah was told to say that it meant nothing, that the Egyptians would go home and the Chaldeans would come back ([[Jer. 37:7–8]]).

      Ezekiel’s oracle is dated to the second year of the siege, and the verb in verse 21 has been read as “a pure preterite,” a plain past: “God broke the arm of Pharaoh by the defeat which the Chaldeans inflicted upon Pharaoh Hophra, when he was marching to the relief of besieged Jerusalem.” Jeremiah says only that the army would return; that it was beaten in battle is this reading’s inference. Ezekiel had said beforehand that Pharaoh “with his mighty army and great company” would be no use to Zedekiah in the war ([[Ezek. 17:17]]).

      The arm is not bound, and no “roller” (the Hebrew word means a “bandage”) is put on “to make it strong to hold the sword.” The arm in view is the sword arm. Verse 22 then goes further: the Lord will break both arms, “the strong, and that which was broken,” the sound one as well as the injured one, so that the sword falls from his hand. Jeremiah names this king and says he will be given “into the hand of his enemies” ([[Jer. 44:30]]).
    sources: [keil-ezekiel, bd-pharaoh, bdb, lds-scriptures]

  - ref: 24
    phrase: 'put my sword in his hand'
    kind: symbol
    title: 'Two pairs of arms and one sword'
    body: |
      The oracle sets two kings side by side, and the sword that decides between them is the Lord’s. Arms are named six times in verses 21–25. Pharaoh’s are broken and “fall down”; the king of Babylon’s are strengthened. Nearly every verb has the Lord as its subject: “I will break,” “I will strengthen,” “I will cause the sword to fall,” “I will scatter.”

      Pharaoh’s sword drops from his hand (verse 22). The one in the hand of the king of Babylon is called “my sword,” twice (verses 24 and 25). Nebuchadrezzar wields it, but it is not his. The previous chapter said of his army, “they wrought for me” (see the note on [[Ezek. 29:20]], which also takes up his coming against Egypt), and Jeremiah has the Lord call him “my servant” ([[Jer. 43:10]]).

      The verse then says what this arrangement is for. They “shall know that I am the LORD, when I shall put my sword into the hand of the king of Babylon.” (For the refrain itself, see the note on [[Ezek. 6:7]].)
    sources: [lds-scriptures]

christ: |
  This chapter’s announcement of “the day of the LORD” has been read as resting on Joel’s ([[Joel 2:1–2]]). The war and desolation of Joel’s chapter are placed before the Second Coming. Ezekiel’s oracle is about Egypt and Nebuchadrezzar, and it is spoken in the language of that day.

  The cloudy day of verse 3 is spoken of again in two places. Later in Ezekiel the same speaker is a shepherd: “so will I seek out my sheep, and will deliver them out of all places where they have been scattered in the cloudy and dark day” ([[Ezek. 34:12]]). Modern revelation speaks of “the children of Jacob, who have been scattered upon the mountains for a long time, in a cloudy and dark day” ([[D&C 109:61]]). Here the cloudy day is Egypt’s, and the Lord scatters the Egyptians (verses 23 and 26). There the scattered are His own flock, and He goes looking for them.

explore: |
  - The first oracle against Egypt, with the “staff of reed” and the limit of forty years: [[Ezek. 29:1–16]].
  - Jeremiah’s sign at Tahpanhes and his own oracle of Nebuchadrezzar in Egypt: [[Jer. 43:8–13]] and [[Jer. 46:13–26]].
  - Pharaoh’s army comes out and goes home: [[Jer. 37:5–11]].
  - An earlier day when Egypt was told it would know the Lord: “the Egyptians shall know that I am the LORD, when I stretch forth mine hand upon Egypt” ([[Ex. 7:5]]).
  - Isaiah’s “burden of Egypt”: [[Isa. 19]].
  - What follows: Pharaoh as a great cedar cut down, and the lament over him: [[Ezek. 31–32]].

