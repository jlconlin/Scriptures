chapter: 18
title: 'The Soul That Sinneth'
tagline: 'The exiles say they are paying for their fathers’ sins. The Lord answers that every person stands before Him on his own account, that a person who turns is no longer judged by his past, and that He takes no pleasure in anyone’s death.'
when: 'No date of its own. The chapter stands under the heading of 8:1, “the sixth year, in the sixth month” of Jehoiachin’s captivity (about 591 B.C.), and before the next date in the book, the seventh year (20:1).'

setting: |
  Ezekiel is in Babylon among the people carried away with king Jehoiachin, one of the “large deportations under Nebuchadnezzar,” in 597 B.C. Jerusalem is still standing, and its fall, in 586 B.C., is a few years away.

  The chapter is an argument, with no vision, no sign to act out, and no parable. The Lord quotes what the people are saying four times (verses 2, 19, 25, and 29) and answers each saying in turn.

  The proverb He begins with was not Ezekiel’s hearers’ alone. Jeremiah quotes it and answers it the same way ([[Jer. 31:29–30]]), and the same thought is prayed as a lament ([[Lam. 5:7]]).

  The chapter belongs with two others in the book. The watchman’s charge has already said that a wicked man dies “in his iniquity” and that a righteous man who turns loses what he had ([[Ezek. 3:18–21]]). After the fall of the city much of verses 21–32 is spoken again, to people who by then are saying something different ([[Ezek. 33:10–20]]). Chapter 18 is named with chapter 3 among Ezekiel’s notable teachings, for showing “the individual responsibility of every person for the consequences of his own behavior.”

thread: |
  The chapter begins with an excuse and ends with an invitation, and the same principle carries it from the one to the other.

  The excuse is the proverb: the fathers ate, and we are the ones who suffer. The Lord’s answer is a ruling, stated in verse 4 and again in verse 20: “The soul that sinneth, it shall die.” Verses 5–18 try it on three generations of one family, a just man, his violent son, and a grandson who will not do as his father did, and each receives his own verdict.

  Then the argument goes further than the proverb asked. If a son is not bound by his father, a man is not bound by his own past either (verses 21–24). The wicked man who turns will live, and his sins will not be brought up. The righteous man who turns away will die, and his earlier righteousness will not be brought up. The people call this unfair. The Lord answers that the unfairness is in their ways, not His.

  The reason for the appeal is given as a question in verse 23 and as a statement in the last verse: the Lord has no pleasure in anyone’s death. So the ruling that took away the exiles’ excuse is also what leaves the door open: “turn yourselves, and live ye.”

sections:
  - range: 1-4
    heading: 'The proverb, and the Lord’s ruling'
    plain: |
      The word of the Lord comes to Ezekiel again. What do you mean, He asks, by using this proverb about the land of Israel: “The fathers have eaten sour grapes, and the children’s teeth are set on edge”? As He lives, the Lord God says, they will have no more reason to use it in Israel. Every soul is His, the father’s and the son’s alike. The soul that sins is the one that will die.
  - range: 5-9
    heading: 'A just man'
    plain: |
      Take a man who is just and does what is lawful and right. He has not eaten on the mountains or looked to the idols of the house of Israel. He has not defiled his neighbor’s wife or come near a woman in her time of uncleanness. He has oppressed no one. He has given the debtor back his pledge and robbed no one; he has given his bread to the hungry and clothed the naked. He has not lent on usury or taken increase. He has kept his hand from wrong and judged truly between one man and another. He has walked in the Lord’s statutes and kept His judgments. He is just, and he will surely live, says the Lord God.
  - range: 10-13
    heading: 'His violent son'
    plain: |
      Suppose he has a son who is a robber and a shedder of blood, and who does these things that his father would not do. He eats on the mountains and defiles his neighbor’s wife. He oppresses the poor and needy, robs, keeps the pledge, looks to the idols, and commits abomination. He lends on usury and takes increase. Will he live? He will not. He has done all these abominations and will surely die, and his blood will be on himself.
  - range: 14-20
    heading: 'The son who sees and does otherwise'
    plain: |
      Now suppose that man has a son who sees all his father’s sins, thinks about them, and does not do the same. He does not eat on the mountains or look to the idols, or defile his neighbor’s wife. He oppresses no one, keeps no pledge, and does not rob; he feeds the hungry and clothes the naked. He keeps his hand off the poor and takes no usury or increase. He carries out the Lord’s judgments and walks in His statutes. He will not die for his father’s iniquity; he will surely live. His father, who oppressed cruelly, robbed his brother, and did what is not good among his people, will die in his own iniquity.

      Yet you ask, Why does the son not bear the father’s iniquity? When the son has done what is lawful and right and has kept all the Lord’s statutes, he will surely live. The soul that sins is the one that will die. The son will not bear the father’s iniquity, and the father will not bear the son’s. The righteousness of the righteous will be on himself, and the wickedness of the wicked on himself.
  - range: 21-29
    heading: 'Turning, in either direction'
    plain: |
      If the wicked man turns from all the sins he has committed, keeps all the Lord’s statutes, and does what is lawful and right, he will surely live and not die. None of his transgressions will be mentioned to him; in the righteousness he has done he will live. Does the Lord take any pleasure in the death of the wicked, He asks, and not rather that he turn from his ways and live?

      But when the righteous man turns away from his righteousness, commits iniquity, and does the abominations the wicked do, will he live? None of the righteousness he has done will be mentioned. In his trespass and in his sin he will die.

      Yet you say, The way of the Lord is unfair. Listen, house of Israel: Is My way unfair? Is it not your ways that are unfair? When a righteous man turns from his righteousness, commits iniquity, and dies in it, he dies for the iniquity he has done. When the wicked man turns from his wickedness and does what is lawful and right, he saves his soul alive. Because he considers and turns from all his transgressions, he will surely live and not die. Yet the house of Israel says, The way of the Lord is unfair. Are not My ways fair, house of Israel? Is it not your ways that are unfair?
  - range: 30-32
    heading: 'Turn, and live'
    plain: |
      Therefore the Lord God will judge the house of Israel, every one according to his ways. Repent, and turn from all your transgressions, so that iniquity will not be your ruin. Throw off all the transgressions you have committed, and make yourselves a new heart and a new spirit. Why will you die, house of Israel? The Lord God has no pleasure in the death of the one who dies. So turn, and live.

notes:
  - ref: 2
    phrase: 'The fathers have eaten sour grapes, and the children’s teeth are set on edge'
    kind: scripture
    title: 'The proverb of the sour grapes'
    body: |
      The proverb says that one generation eats and the next one feels it. The Hebrew noun means “unripe or sour grapes,” and the old Greek translation has “unripe grapes.” The verb said of the teeth means to “be blunt, dull.”

      The saying is recorded elsewhere. Jeremiah quotes it and gives the answer Ezekiel gives: “every one shall die for his own iniquity” ([[Jer. 31:30]]). The same thought is said as a lament: “Our fathers have sinned, and are not; and we have borne their iniquities” ([[Lam. 5:7]]). The site’s note on [[Jer. 31:29]] treats the proverb there.

      The Lord has already quoted a popular saying in the book in order to end it. That one mocked the prophets: “The days are prolonged, and every vision faileth” ([[Ezek. 12:22]]). Of that one He said, “they shall no more use it as a proverb in Israel” ([[Ezek. 12:23]]). His answer to this one begins “As I live.”
    sources: [lds-scriptures, bdb, oshb-wlc, lxx-rahlfs]

  - ref: 4
    phrase: 'the soul that sinneth, it shall die'
    kind: words
    title: 'The soul, and what it is to die'
    body: |
      “Soul” in this verse means a person, and the verse says that every person belongs to the Lord. The Hebrew word is *nephesh*, “used here, as in many other passages,” for the man himself; one modern translation has “all lives are mine” and “it is only the person who sins who shall die.”

      “All souls are mine” is the ground of the ruling. The father and the son belong to the same Lord in the same way: “as the Father of all, He cannot treat the one in a different manner from the other.”

      The verse does not say what kind of death is meant, and the word has been explained in more than one way. The example of the three generations that follows teaches “the principles of accountability as they relate to spiritual life and death.” The word itself has also been traced to the law, where “death” is “the complete destruction with which transgressors are threatened,” as when Moses set before Israel “life and good, and death and evil” ([[Deut. 30:15]]). And the chapter’s last verse speaks of “him that dieth,” wording that has been taken to tell the people “that while in sin they are lying in death.”
    sources: [keil-ezekiel, nrsvue, ot-manual-26, oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: 'hath not eaten upon the mountains'
    kind: history
    title: 'Eating upon the mountains'
    body: |
      Eating “upon the mountains” is eating as an act of worship at a mountain shrine, which is why it stands in the list beside looking to idols. A meal was part of sacrifice in Israel’s own worship: at the place the Lord chose, “there ye shall eat before the LORD your God” ([[Deut. 12:7]]).

      The book has already said what was on the mountains. In chapter 6 the Lord speaks to the mountains of Israel and says, “I will destroy your high places” ([[Ezek. 6:3]]); the mountain tops are “the place where they did offer sweet savour to all their idols” ([[Ezek. 6:13]]). The law had told Israel to destroy the places where the nations served their gods “upon the high mountains, and upon the hills, and under every green tree” ([[Deut. 12:2]]). The phrase comes back in the book’s list of Jerusalem’s sins: “in thee they eat upon the mountains” ([[Ezek. 22:9]]).
    sources: [lds-scriptures, bdb, oshb-wlc]

  - ref: 8
    phrase: 'hath not given forth upon usury, neither hath taken any increase'
    kind: words
    title: 'Usury and increase'
    body: |
      “Usury” here is interest on a loan, and the law that has the same two words is about lending to the poor. The two Hebrew words are a pair, and each means interest. Modern translations give “does not lend at interest or take any profit,” or “advance or accrued interest.”

      The pair is in the law, where it protects a poor neighbor: “If thou lend money to any of my people that is poor by thee, thou shalt not be to him as an usurer” ([[Ex. 22:25]]), and “Take thou no usury of him, or increase: but fear thy God; that thy brother may live with thee” ([[Lev. 25:36]]). The pledge of verse 7 is in the same place. A neighbor’s garment taken as security is to be given back “by that the sun goeth down” ([[Ex. 22:26]]).
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 10
    phrase: 'If he beget a son'
    kind: structure
    title: 'Three generations, three verdicts'
    body: |
      Verses 5–18 try the proverb on three generations of one family, and each man receives his own verdict. The just man of verses 5–9 “shall surely live.” His son (verses 10–13) does what his father would not, and “he shall surely die.” The grandson (verses 14–18) “seeth all his father’s sins which he hath done, and considereth, and doeth not such like,” and “he shall not die for the iniquity of his father, he shall surely live.”

      The proverb complained that a father’s sin lands on his children. The first son is the reverse case: a father’s righteousness does not cover him. Then comes the son who is not condemned by his father. Verse 20 states both: “the righteousness of the righteous shall be upon him, and the wickedness of the wicked shall be upon him.”

      “His blood shall be upon him” (verse 13) is wording from the law, as in “he hath cursed his father or his mother; his blood shall be upon him” ([[Lev. 20:9]]).
    sources: [lds-scriptures]

  - ref: 20
    phrase: 'The son shall not bear the iniquity of the father'
    kind: scripture
    title: 'Beside the second commandment'
    body: |
      Verse 20 does not cancel the second commandment; it rules out one use of it. The people raise the objection themselves in verse 19, “doth not the son bear the iniquity of the father?” and their question has been read as “a pretext, which the people might offer on the ground of the law.”

      The commandment says that the Lord visits “the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me” ([[Ex. 20:5]]), and shows mercy “unto thousands of them that love me, and keep my commandments” ([[Ex. 20:6]]). The visiting has been explained as holding “insofar as the children learn and do the sinful things the parents do.” The same law has the rule Ezekiel states: “every man shall be put to death for his own sin” ([[Deut. 24:16]]). So this chapter has been called a commentary on that rule, “and not a correction of the law.”

      The proverb had more behind it than the commandment. The book of Kings says that Judah was removed “for the sins of Manasseh” ([[2 Kgs. 24:3]]). How that stands with verse 20 is not explained in the chapter, and the question has been called “a difficult theological topic”: sins may not pass from parents to children, yet “the trajectory given by the parents and the inherited culture and circumstance can be a blessing or curse of sorts.”

      Latter-day Saints state the principle in the second article of faith, to which this chapter has been joined: “No one is punished for the sins of someone else.” The article reads, “We believe that men will be punished for their own sins, and not for Adam’s transgression” ([[A of F 1:2]]).
    sources: [lds-scriptures, keil-ezekiel, sc-knowhy-712, ot-manual-26]

  - ref: 23
    phrase: 'Have I any pleasure at all that the wicked should die?'
    kind: scripture
    title: 'No pleasure in the death of the wicked'
    body: |
      The question says what the Lord wants: that the wicked turn from his ways and live. It is asked here, in the middle of the two cases of turning, and it is answered in the chapter’s last verse: “I have no pleasure in the death of him that dieth.”

      When the teaching is given again after the fall of Jerusalem, the sentence comes with an oath and a plea: “As I live, saith the Lord GOD, I have no pleasure in the death of the wicked; but that the wicked turn from his way and live: turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?” ([[Ezek. 33:11]]).

      The Book of Mormon has the plea on a prophet’s lips. Nephi, calling to the people of Zarahemla from his tower, cries, “O repent ye, repent ye! Why will ye die? Turn ye, turn ye unto the Lord your God” ([[Hel. 7:17]]). His “Why will ye die?” has been called “a plea used by Jeremiah and Ezekiel,” with this chapter’s verse 31 named beside it.
    sources: [lds-scriptures, sc-knowhy-529]

  - ref: 24
    phrase: 'All his righteousness that he hath done shall not be mentioned'
    kind: prophets
    title: 'Righteousness that is not remembered'
    body: |
      The second half of the chapter applies the ruling inside one life, and it cuts both ways. Verse 22 says of the wicked man who turns that his transgressions “shall not be mentioned unto him.” Verse 24 says the same of the righteous man who turns away: his righteousness “shall not be mentioned.” The Hebrew verb in both verses is the passive of “remember,” and a modern translation has “None of the transgressions that he has committed shall be remembered against him.” The watchman’s charge used the same verb of the same case: “his righteousness which he hath done shall not be remembered” ([[Ezek. 3:20]]).

      Verse 24 has been taught as a statement of the need to endure to the end: “all who wish to be saved must endure to the end in righteousness.” President Spencer W. Kimball put it in terms of Church service: however “brilliant” the service a leader once gave, if he “fails to live righteously ‘to the end’ the good works he did all stand in jeopardy.” Among the scriptures given for that teaching is a revelation to the Church: “unto that soul who sinneth shall the former sins return” ([[D&C 82:7]]).
    sources: [ot-manual-26, oshb-wlc, esv, lds-scriptures]

  - ref: 25
    phrase: 'The way of the Lord is not equal'
    kind: words
    title: 'Not equal: the charge of unfairness'
    body: |
      “Not equal” is a charge that the Lord’s way is unfair, and the Hebrew word is a word of measuring. The verb’s basic sense is “regulate, measure, estimate”; in the form used here it means to “be adjusted to the standard, i.e. right, equitable.” The old Greek translation has “The way of the Lord is not straight,” and modern translations have “not just” and “unfair.”

      The people say it twice (verses 25 and 29), both times just after the two cases of turning are stated. The chapter does not say which half offended them. The Lord’s answer is to state both cases again (verses 26–28) and to turn the word around: “are not your ways unequal?”

      The charge outlived the city. After Jerusalem fell, the exiles were still saying it, in the same words ([[Ezek. 33:17]]; [[Ezek. 33:20]]). The verdict that follows here, “every one according to his ways,” has the words spoken to the land: “will judge thee according to thy ways” ([[Ezek. 7:3]]).
    sources: [bdb, oshb-wlc, lxx-rahlfs, esv, nrsvue, lds-scriptures]

  - ref: 30
    phrase: 'Repent, and turn yourselves'
    kind: words
    title: 'One verb for repent, turn, and restore'
    body: |
      “Repent” and “turn yourselves” are two forms of one Hebrew verb, *shuv*, to “turn back, return,” and that verb runs through the whole chapter. One modern translation gives the pair as “Repent and turn.”

      The verb stands in twelve verses of the chapter. In the first half it is used of things: the just man “hath restored to the debtor his pledge” (verse 7) and “hath withdrawn his hand from iniquity” (verse 8). In the second half it is used of the person himself, in both directions: the wicked “will turn from all his sins” (verse 21), and the righteous “turneth away from his righteousness” (verse 24). The chapter’s last words use it once more: “turn yourselves, and live ye.”

      The chapter’s word for repentance, then, is a word for turning back. The last clause of verse 30 has a word the book has used before. “Ruin” is the Hebrew *mikshol*, the “stumblingblock” of [[Ezek. 3:20]], where the site has a note on it.
    sources: [oshb-wlc, bdb, esv, lds-scriptures]

  - ref: 31
    phrase: 'make you a new heart and a new spirit'
    kind: scripture
    title: 'A new heart, here commanded'
    body: |
      The new heart and new spirit are commanded in this verse; in chapters 11 and 36 they are the Lord’s gift. To the exiles the Lord has already promised, “I will put a new spirit within you” ([[Ezek. 11:19]]), and the appeal here has been read as pointing back to that promise. Later He will say, “A new heart also will I give you, and a new spirit will I put within you” ([[Ezek. 36:26]]). Here the people are told to make them.

      The difference has been explained in this way: “a man cannot, indeed, create either of these by his own power; God alone can give them,” but he “both can and should come to God to receive them.” On that reading the people are to turn to God, and He renews the heart and spirit they cannot make.

      The promise itself is treated more fully at [[Ezek. 36:26]], and its first appearance at [[Ezek. 11:19]].
    sources: [lds-scriptures, keil-ezekiel]

christ: |
  Amulek states a rule like verse 20’s when he teaches the Atonement. Israelite law “did not allow for vicarious punishment,” one person punished in another’s place: “every man shall be put to death for his own sin” ([[Deut. 24:16]]), and Ezekiel’s verse 20 has been set beside that law as the same rule in God’s own judgments. Amulek asks the Zoramites, “Now, if a man murdereth, behold will our law, which is just, take the life of his brother? I say unto you, Nay” ([[Alma 34:11]]), and he says, “there is not any man that can sacrifice his own blood which will atone for the sins of another” ([[Alma 34:11]]).

  In the same sermon Amulek says what the sacrifice must be: not a man’s, but “an infinite and eternal sacrifice” ([[Alma 34:10]]), and “that great and last sacrifice will be the Son of God, yea, infinite and eternal” ([[Alma 34:14]]).

explore: |
  - The same teaching given again after Jerusalem fell, to people now saying “how should we then live?”: [[Ezek. 33:10–20]].
  - Jeremiah’s answer to the proverb, followed at once by the new covenant: [[Jer. 31:29–34]].
  - The commandment and the law this chapter stands beside: [[Ex. 20:5–6]], [[Deut. 24:16]], and [[D&C 98:46–47]].
  - Noah, Daniel, and Job, who could deliver “but their own souls by their righteousness”: [[Ezek. 14:12–20]].
  - The watchman’s charge, which has verse 24’s case already: [[Ezek. 3:17–21]].
  - Amulek on why one man cannot atone for another: [[Alma 34:8–16]].
  - The new heart as the Lord’s gift: [[Ezek. 36:25–27]].

