chapter: 13
title: 'Peace, and There Was No Peace'
tagline: 'Two woes, one to the men and one to the women who prophesy “out of their own heart.” The men have whitewashed a flimsy wall and called it peace; the women hunt souls for a handful of barley. The Lord will bring the wall down and set the hunted free.'
when: 'No date of its own. The chapter stands under the heading of the vision of chapters 8–11, “in the sixth year, in the sixth month” (8:1) of Jehoiachin’s captivity, about 591 B.C., and before the next date in the book, “in the seventh year, in the fifth month” (20:1).'

setting: |
  Jerusalem is still standing, and Ezekiel is among the captives carried away with Jehoiachin, in the sixth year of that captivity ([[Ezek. 8:1]]), about 591 B.C.

  Chapter 12 answered two sayings by which the people kept prophecy at a distance ([[Ezek. 12:22]], [[Ezek. 12:27]]) and promised that “there shall be no more any vain vision nor flattering divination within the house of Israel” ([[Ezek. 12:24]]). This chapter turns to the people who supplied those visions. Chapter 12 has been said to denounce “the false expectations of the people,” and this chapter “the false leaders who fed those expectations.”

  Such prophets were in both places: in Jerusalem, and among the exiles, whose boast Jeremiah’s letter quotes: “The LORD hath raised us up prophets in Babylon” ([[Jer. 29:15]]). Jeremiah names several of them (see the note on [[Ezek. 13:2]]). Ezekiel’s oracle is about those who “prophesy concerning Jerusalem” (verse 16), and it has been taken as meant first for those still in the city and then for the exiles at the Chebar.

  Jeremiah’s long condemnation of false prophets, [[Jer. 23:9–40]], runs closely parallel to this chapter.

thread: |
  The chapter is two woes built on one plan. Verses 1–16 are against the men, verses 17–23 against the women, and each half says first what they do and then, with “Therefore” and “I am against you,” what the Lord will do. The charge under both is put in the same words: they prophesy “out of their own hearts” (verse 2), “out of their own heart” (verse 17). The fault is where the word comes from. They say, “The LORD saith,” and He has not spoken.

  What the chapter cares about most is what such a word does to the people who hear it. The men’s word hides danger: the people put up a flimsy wall, the prophets coat it and call it peace, and when the storm comes the wall and the coating go down together. The women’s word reverses right and wrong for the people who consult them, saddening the righteous and telling the wicked he will live, so that he does not turn.

  Against all of this stands one phrase. Seven times in the chapter the Lord calls Israel “my people,” and twice He says, “I will deliver my people out of your hand.” Four times (verses 9, 14, 21, 23) the result is the sentence that runs through the book since [[Ezek. 6:7]]: “ye shall know that I am the LORD.”

sections:
  - range: 1-7
    heading: 'Prophets out of their own hearts'
    plain: |
      The word of the Lord comes to Ezekiel: prophesy against the prophets of Israel, who prophesy out of their own hearts, and tell them to hear the word of the Lord. Woe to the foolish prophets, who follow their own spirit and have seen nothing. Israel’s prophets are like foxes in the deserts. They have not gone up into the breaks in the wall or built up the hedge around the house of Israel so that it could stand in the battle in the day of the Lord. What they have seen is empty, and their divination is a lie. They say, “The LORD saith,” when the Lord has not sent them, and they have made others hope that the word would be confirmed. The Lord asks them directly: have you not seen an empty vision and spoken a lying divination, saying “The LORD saith it,” although I have not spoken?
  - range: 8-9
    heading: 'Three things they lose'
    plain: |
      Therefore the Lord God says: because you have spoken what is empty and seen lies, I am against you. His hand will be on the prophets who see what is empty and divine lies. They will not be in the assembly of His people, they will not be written in the writing of the house of Israel, and they will not enter the land of Israel. Then they will know that He is the Lord God.
  - range: 10-16
    heading: 'The whitewashed wall'
    plain: |
      This is because they have led the Lord’s people astray, saying “Peace” when there was no peace. Someone builds a wall, and others coat it with untempered mortar. Tell those who coat it that it will fall: a flooding rain, great hailstones, and a stormy wind will tear it open. When the wall is down, people will ask them where the coating is that they put on it. The Lord God says He will send the wind, the rain, and the hailstones in His fury and anger to make an end of it. He will break down the wall they have coated and bring it to the ground, so that its foundation is laid bare; it will fall, and they will be destroyed in the middle of it, and they will know that He is the Lord. So He will spend His wrath on the wall and on those who coated it, and will say to them: the wall is gone, and so are those who coated it, the prophets of Israel who prophesy about Jerusalem and see visions of peace for her when there is no peace.
  - range: 17-19
    heading: 'The women who hunt souls'
    plain: |
      Ezekiel is to set his face against the daughters of his people who prophesy out of their own heart, and prophesy against them. Woe to the women who sew pillows to all armholes and make kerchiefs for heads of every stature, to hunt souls. Will they hunt the souls of the Lord’s people and keep alive the souls that come to them? They have profaned the Lord among His people for handfuls of barley and pieces of bread, putting to death souls that should not die and keeping alive souls that should not live, by lying to His people, who listen to lies.
  - range: 20-23
    heading: 'The pillows torn away'
    plain: |
      Therefore the Lord God says He is against their pillows, with which they hunt the souls to make them fly. He will tear them from their arms and let the souls go. He will tear their kerchiefs too and deliver His people out of their hand, so that His people are no longer in their hand to be hunted; and they will know that He is the Lord. Because they have saddened the heart of the righteous with lies, when the Lord had not saddened him, and have strengthened the hands of the wicked so that he does not turn from his wicked way, by promising him life, they will see no more empty visions and practice no more divination. The Lord will deliver His people out of their hand, and they will know that He is the Lord.

notes:
  - ref: 2
    phrase: 'prophesy out of their own hearts'
    kind: history
    title: 'Who these prophets were'
    body: |
      The men addressed here spoke in the Lord’s name without having been sent by Him. They are not prophets of another god. Verse 6 has them saying, “The LORD saith,” and the charge is only that “the LORD hath not sent them.” The phrase that names their fault, “out of their own hearts,” has been heard as an echo of Jeremiah’s: “they speak a vision of their own heart, and not out of the mouth of the LORD” ([[Jer. 23:16]]).

      Jeremiah names some of them. In Jerusalem there was Hananiah, who promised that Babylon’s yoke would be broken “within the space of two full years” ([[Jer. 28:11]]), and to whom Jeremiah said, “The LORD hath not sent thee; but thou makest this people to trust in a lie” ([[Jer. 28:15]]). In Babylonia there were Ahab the son of Kolaiah and Zedekiah the son of Maaseiah, “which prophesy a lie unto you in my name” ([[Jer. 29:21]]), and Shemaiah the Nehelamite, of whom the Lord said, “I sent him not, and he caused you to trust in a lie” ([[Jer. 29:31]]).

      What such men prophesied has been taken to be “a speedy return to Jerusalem,” and “out of their own hearts” to mean that it was “what they and the people wished.” Ezekiel’s own chapter gives the content in one word, in verse 10.
    sources: [lds-scriptures, jfb-ezekiel]

  - ref: 3
    phrase: 'foolish prophets'
    kind: words
    title: 'Fools, in the Bible’s sense'
    body: |
      “Foolish” is a moral word here and has little to do with intelligence. The Hebrew is *nabal*, “foolish, senseless, especially of the man who has no perception of ethical and religious claims.” Ezekiel uses it only in this verse.

      The rest of the verse says what the folly is. They “follow their own spirit, and have seen nothing.” Seeing is the chapter’s word for what a prophet does (verses 6–9, 16, 23), and these have seen nothing at all. The Septuagint, the ancient Greek translation, has no word for “foolish” in the verse and reads instead, “Woe to them that prophesy out of their own heart, and who see nothing at all.”
    sources: [bdb, oshb-wlc, lxx-rahlfs]

  - ref: 4
    phrase: 'like the foxes in the deserts'
    kind: symbol
    title: 'Foxes among the ruins'
    body: |
      The picture is of animals at home in a ruined place. The Hebrew behind “deserts” is a “waste place amid ruins,” and the animal is the “fox, perhaps also jackal,” named here “as haunting ruins.” The lament over the fallen city uses it the same way: “Because of the mountain of Zion, which is desolate, the foxes walk upon it” ([[Lam. 5:18]]). A modern translation has “like jackals among ruins.”

      What the comparison means has been read in two ways. One looks to the fox’s cunning: like foxes, such prophets “obtain their prey by subtlety.” The other looks to the fox’s digging, “the undermining of the ground by foxes,” and to the ruins. On that reading the ruins are the collapse of the nation, which these prophets “cannot prevent, but, on the contrary, accelerate by undermining the moral foundations of the state.”

      Verse 5 carries the picture on: the prophets “have not gone up into the gaps.”
    sources: [bdb, esv, lds-scriptures, ot-manual-26, keil-ezekiel]

  - ref: 5
    phrase: 'gone up into the gaps'
    kind: symbol
    title: 'What a prophet does at a broken wall'
    body: |
      To go up into the gaps is to stand in the breach of a broken wall, and the phrase is a figure for turning calamity away from a people “by instruction and (especially) intercession.” “Gaps” is the ordinary word for a “breach in wall”; one modern translation has, “You have not gone up into the breaches, or built up a wall for the house of Israel.”

      The same figure is used of Moses. The Lord “said that he would destroy them, had not Moses his chosen stood before him in the breach, to turn away his wrath” ([[Ps. 106:23]]). Ezekiel returns to the image when he lists Jerusalem’s sins, and there the Lord Himself is looking for someone to do it: “I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none” ([[Ezek. 22:30]]).

      In both of Ezekiel’s verses the danger comes from the Lord. The battle in this verse is “in the day of the LORD,” and the man sought in chapter 22 is to stand “before me for the land, that I should not destroy it.” The men of this chapter said “Peace.” [A Man to Stand in the Gap](/ezekiel/themes/stand-in-the-gap/) follows the figure through the book.
    sources: [bdb, esv, lds-scriptures]

  - ref: 6
    phrase: 'they have made others to hope that they would confirm the word'
    kind: words
    title: 'Whose hope it was'
    body: |
      The clause can be read of the prophets’ own hope as well as of their hearers’. The verb means to “wait for,” to “hope for,” and what is hoped for follows it: the confirming of a word. So modern translations have “and yet they expect him to fulfill their word” and “and yet they wait for the fulfillment of their word.” The Septuagint is different again: “they began to try to confirm the word.” What the verse denies in any case is their commission: “the LORD hath not sent them.”

      The King James wording, that they led others to hope, is what the rest of the chapter describes. The people were “seduced” with the word “Peace” (verse 10), and the wicked man was promised life (verse 22).
    sources: [bdb, oshb-wlc, esv, nrsvue, lxx-rahlfs]

  - ref: 9
    phrase: 'neither shall they be written in the writing of the house of Israel'
    kind: history
    title: 'Left off the register'
    body: |
      The sentence passed on the prophets is three exclusions, and the middle one is from a register of names. “Writing” is the Hebrew *kethab*, here a “register, enrolement.” It is the word used later for the genealogical roll of those who came back from Babylon, when certain families “sought their register among those that were reckoned by genealogy, but they were not found” ([[Ezra 2:62]]).

      The other two exclusions stand on either side of it. For “the assembly of my people” a modern translation has “the council of my people.” And they will not “enter into the land of Israel,” which is said again later of the rebels among the exiles: “I will bring them forth out of the country where they sojourn, and they shall not enter into the land of Israel” ([[Ezek. 20:38]]).
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 10
    phrase: 'saying, Peace; and there was no peace'
    kind: scripture
    title: 'The prophets of peace'
    body: |
      “Peace” is the whole of the false prophets’ message as Ezekiel reports it, and Jeremiah reports it in nearly the same words: “They have healed also the hurt of the daughter of my people slightly, saying, Peace, peace; when there is no peace” ([[Jer. 6:14]]; again at [[Jer. 8:11]]). Verse 16 and Hananiah’s promise point to what it meant in those years: Jerusalem would be spared, and the yoke of Babylon broken.

      Hananiah’s side of that argument had hearers in Lehi’s family. Lehi’s older sons did not “believe that Jerusalem, that great city, could be destroyed according to the words of the prophets” ([[1 Ne. 2:13]]): Laman and Lemuel “took Hananiah’s view that Jerusalem would be spared,” and Nephi and Lehi “preached, like Jeremiah, that Jerusalem would be destroyed.”

      Nephi said of the devil in the last days that he will “pacify, and lull them away into carnal security, that they will say: All is well in Zion” ([[2 Ne. 28:21]]), and the verse has been applied to false prophets, who “pacify and lull people into carnal security.”
    sources: [lds-scriptures, sc-knowhy-441, ot-manual-26]

  - ref: 10
    phrase: 'daubed it with untempered mortar'
    kind: symbol
    title: 'Whitewash on a flimsy wall'
    body: |
      The image is of a weak wall made to look sound, and two Hebrew words carry it. The first is the word for the wall. It is *chayits*, used in Ezekiel only here and explained as “a thin or party-wall”; one modern translation has “a flimsy wall.” The second is *taphel*, “whitewash,” which comes four times in this passage and once more at [[Ezek. 22:28]].

      The King James “untempered mortar” has been explained as mortar mixed without lime, which gives an earthen wall no protection from the weather. On another explanation the coat is “a mere thin covering of lime” that makes a poor wall look finished.

      The builders and the plasterers are different people. The builder is not named; the Hebrew has only a pronoun, and modern translations supply “the people.” On this reading “the people build up foolish hopes, and the prophets not only paint these hopes for them in splendid colours, but even predict their fulfilment.”

      Rain, hail, and wind come “in my fury,” so the storm is the Lord’s. When the wall is down the only thing left to ask is, “Where is the daubing?”

      The wall has been taken as Jerusalem. The figure is a “coating over Jerusalem, under figure of a wall, with a superficial coating, to hide its real weakness,” and in verse 14 the figure gives way to the fact: “ye shall be consumed in the midst thereof,” which one translation renders, “when the city falls, you shall perish within it.” Verse 16 then says outright that the plasterers are the prophets who “see visions of peace for her.”
    sources: [bdb, oshb-wlc, nrsvue, esv, ot-manual-26, keil-ezekiel]

  - ref: 17
    phrase: 'the daughters of thy people, which prophesy out of their own heart'
    kind: history
    title: 'Women who prophesied'
    body: |
      The second woe is to women who prophesy, and its charge is the one made against the men in verse 2: they prophesy “out of their own heart.” Israel’s scriptures name women who were prophetesses: Miriam ([[Ex. 15:20]]), Deborah, who judged Israel ([[Judg. 4:4]]), and Huldah, to whom Hilkiah the priest and others went in Jerusalem ([[2 Kgs. 22:14]]).

      The last verse calls what the women of this chapter do divination: “ye shall see no more vanity, nor divine divinations.” Divination is “any superstitious method of trying to discover the course of future events.” Jeremiah’s letter had warned the exiles against prophets and diviners together: “Let not your prophets and your diviners, that be in the midst of you, deceive you” ([[Jer. 29:8]]).
    sources: [lds-scriptures, esv, bd-divination]

  - ref: 18
    phrase: 'sew pillows to all armholes, and make kerchiefs upon the head of every stature'
    kind: words
    title: 'Bands and veils'
    body: |
      What the women made were most likely things used in magic arts, though exactly what they were is not known. “Pillows” is *kesatot*, found only in verses 18 and 20. It is glossed “band, fillet,” with an ancient explanation of it as a “charm or amulet.” “Cushion” is what the word came to mean in later Hebrew, and the Septuagint already reads it that way: “pillows under every elbow.” “Armholes” is literally the “joint of hand, i.e. elbow.” “Kerchiefs” is *mispachot*, found only in verses 18 and 21, a “long veil.”

      So a modern translation has the women “sew magic bands upon all wrists” and “make veils for the heads of persons of every stature,” and the Church edition’s footnote likewise calls the objects “trappings for magical arts.” How they were used the text does not say. Verse 20 has the bands on the women’s own arms.

      The verse has also been read as a figure. The Hebrew text has “my hands,” not “hands,” and on this reading the women “sew coverings together to wrap round all the joints of the hand of God”: that is, “they cover up and conceal the word of God by their prophesying,” and they fit a covering to every hearer’s head “so that the men neither hear nor see.” The Church’s footnote and the modern translations take the objects as real, and that is the reading followed here.
    sources: [bdb, oshb-wlc, lxx-rahlfs, esv, lds-scriptures, keil-ezekiel]

  - ref: 19
    phrase: 'for handfuls of barley and for pieces of bread'
    kind: scripture
    title: 'The fee, and what was done for it'
    body: |
      The barley and the bread are the women’s pay, and the rest of the verse says what they did for it. Micah had described prophets whose message followed their meals, who “bite with their teeth, and cry, Peace; and he that putteth not into their mouths, they even prepare war against him” ([[Micah 3:5]]), and a proverb says that “for a piece of bread that man will transgress” ([[Prov. 28:21]]).

      Their work was “to slay the souls that should not die, and to save the souls alive that should not live.” One modern translation renders the “souls” as lives (“in the hunt for lives,” verse 18) and has here “putting to death those who should not die and keeping alive those who should not live.” Verse 22 explains it. The women saddened the righteous, whom the Lord had not saddened, and they “strengthened the hands of the wicked, that he should not return from his wicked way, by promising him life.” The life and death have been read as spiritual: the women brought destruction on “those who might otherwise live (spiritually)” and upheld those who ought to have been condemned.

      The verse ends with a word about the customers. The lies are told “to my people that hear your lies,” or, in one translation, “who listen to lies.”
    sources: [lds-scriptures, nrsvue, esv, ot-manual-26]

  - ref: 20
    phrase: 'to make them fly'
    kind: words
    title: 'Souls caught like birds'
    body: |
      The clause pictures the women as fowlers and the souls as birds, and its Hebrew is difficult. The word is a form of a verb “to fly” and has been rendered “for (like ?) flying things, i. e. birds”; the Greek and Syriac lack it in the first half of the verse, and some would strike it out there. One translation keeps it: “your magic bands with which you hunt the souls like birds.” Another leaves the birds out of the first half of the verse, following the Greek and the Syriac, and notes, “Heb lives for birds.” The Church edition’s footnote on “fly” gives “free.”

      “Hunt” fits the picture. In the form used here the verb is listed only for verses 18 and 20, always with “souls” as its object, and the use is glossed “of magic arts, necromancy, etc.” Verse 21 adds the noun: the people will “be no more in your hand to be hunted,” or “as prey.”

      What the Lord does is clear whatever the birds are doing. He tears the bands from the women’s arms and the veils from the heads, “and will let the souls go.”
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

christ: |
  The LORD speaks throughout this chapter in the first person (on who He is, see the note on [[Ezek. 1:26]]). His promise here, “I will deliver my people out of your hand,” has its like later, against Israel’s shepherds: “I will deliver my flock from their mouth” ([[Ezek. 34:10]]), in the chapter that goes on to promise “one shepherd” ([[Ezek. 34:23]]).

  Ezekiel’s plastered wall has been explained as “the covering up of inward corruption by means of outward appearance,” as in the Savior’s words to the scribes and Pharisees: “ye are like unto whited sepulchres, which indeed appear beautiful outward” ([[Matt. 23:27]]). The likeness is in the image.

explore: |
  - Hananiah and Jeremiah face to face, and the letter to the exiles about the prophets among them: [[Jer. 28]] and [[Jer. 29:8–32]].
  - The whitewash and the gap again, in Ezekiel’s list of Jerusalem’s sins: [[Ezek. 22:25–31]].
  - Nephi on priestcraft ([[2 Ne. 26:29–31]]), which has been set beside the opening verses of this chapter.
  - Samuel the Lamanite on “foolish and blind guides” ([[Hel. 13:29]]).
  - What comes next: elders of Israel come and sit before Ezekiel, and the Lord says whom He will not answer: [[Ezek. 14]].

