chapter: 42
title: 'The Holy Chambers and the Wall'
tagline: 'The guide shows Ezekiel the rooms where the priests eat the most holy offerings and leave their holy garments, then measures the whole enclosure and its wall, which stands to separate the holy from the common.'
when: 'No date of its own. The chapter belongs to the vision dated at 40:1, “the five and twentieth year of our captivity… the fourteenth year after that the city was smitten” (about 572 B.C., counting from the book’s first date).'

setting: |
  Ezekiel is still inside the vision that opens at [[Ezek. 40:1]]. Jerusalem has been “smitten” for fourteen years. In “the visions of God” he has been set on “a very high mountain” in the land of Israel ([[Ezek. 40:2]]) and is being led through a temple by a man who carries “a line of flax in his hand, and a measuring reed” ([[Ezek. 40:3]]). What that temple is, and when it is looked for, is taken up at [[Ezek. 40]].

  This chapter finishes the measuring of the house. Chapter 40 began at the wall “on the outside of the house round about” and went through the gates and the two courts; chapter 41 measured the temple house, the yard beside it, and the building behind. Two things remain. The first is a pair of buildings for the priests, on the north and the south of that yard (verses 1–14). The second is the outside measure of the whole (verses 15–20).

  The guide speaks once in the chapter, in verses 13–14, to say what the priests’ rooms are for. Everything else is description, and some of it is hard to follow: modern translators mark the Hebrew of several of these verses as uncertain. The chapter ends at the east gate, and chapter 43 begins there.

thread: |
  The chapter is about keeping holy things in their place. That is easy to miss among the cubits, because the measurements take up eighteen of the twenty verses, but the two places where the text stops to give a reason give the same one.

  The first is the guide’s only speech. The rooms beside the temple yard are where the priests eat and store the most holy offerings, “for the place is holy,” and where they leave the clothes they served in before going out to the people, “for they are holy” (verses 13–14). The garments of the service do not go out into the outer court.

  The second is the last line. When every side has been measured, the wall is given a purpose: “to make a separation between the sanctuary and the profane place” (verse 20). “Profane” here means common, the ordinary ground outside.

  Both reasons are about what is holy and what lies outside it. Earlier in the book the priests of Jerusalem were charged with putting “no difference between the holy and profane” ([[Ezek. 22:26]]); the Hebrew words of that charge are the ones used of this wall (see the note on [[Ezek. 42:20]]).

sections:
  - range: 1-9
    heading: 'The chambers on the north'
    plain: |
      The guide leads Ezekiel out into the outer court on the north side and brings him to the chambers that stand opposite the separate place and opposite the building toward the north. The side with the north door is a hundred cubits long, and the breadth is fifty cubits. Facing the twenty cubits of the inner court on one side and the pavement of the outer court on the other, gallery stands against gallery in three stories. In front of the chambers is a walk ten cubits wide, leading inward, a way of one cubit, and their doors are toward the north. The upper chambers are shorter, because the galleries take more from them than from the lower and middle ones. The chambers are in three stories and have no pillars like the pillars of the courts, so the top level is narrowed more than the lowest and the middle. A wall runs outside the chambers on the side of the outer court, fifty cubits long, because the chambers on the outer court are fifty cubits long, while those facing the temple are a hundred. Below these chambers is the entry on the east, for anyone coming in from the outer court.
  - range: 10-12
    heading: 'The matching chambers'
    plain: |
      There are also chambers in the thickness of the court wall toward the east, opposite the separate place and opposite the building. The way in front of them looks like that of the chambers on the north: as long and as broad, with the same exits, the same arrangements, and the same doors. As with the doors of the chambers toward the south, there is a door at the head of the way, the way that runs along the wall toward the east, where one enters.
  - range: 13-14
    heading: 'What the chambers are for'
    plain: |
      The guide says: The north chambers and the south chambers that face the separate place are holy chambers. There the priests who come near to the Lord will eat the most holy things. There they will put the most holy things, the meat offering, the sin offering, and the trespass offering, because the place is holy. When the priests have gone in, they are not to go out of the holy place into the outer court as they are. They are to leave there the garments they minister in, because those are holy, and put on other garments before they come near to what belongs to the people.
  - range: 15-20
    heading: 'The measure of the whole'
    plain: |
      When the guide has finished measuring the inner house, he brings Ezekiel out by the gate that faces east and measures all around. With the measuring reed he measures the east side, five hundred reeds; the north side, five hundred reeds; the south side, five hundred reeds; and, turning, the west side, five hundred reeds. He measures it on all four sides. It has a wall around it, five hundred long and five hundred broad, to make a separation between the sanctuary and the profane place.

notes:
  - ref: 1
    phrase: 'the chamber that was over against the separate place'
    kind: history
    title: 'The yard and the priests’ chambers'
    body: |
      “The separate place” is a yard, the open space beside the temple house, and the chambers of this chapter are two buildings that face it, one on the north and one on the south. The Hebrew word is *gizrah*, from a root for cutting off: a “yard, or space adjoining temple on three sides.” Modern translations call it “the separate yard” or “the temple yard.” Ezekiel uses the word seven times, all in chapters 41 and 42. It first appears at [[Ezek. 41:12–15]], where the yard and the building west of it are measured.

      Ezekiel has already been shown other rooms: “thirty chambers were upon the pavement” of the outer court ([[Ezek. 40:17]]), and chambers by the inner gates for the priests on duty ([[Ezek. 40:44–46]]). The ones here are placed differently, by the yard, and verses 13–14 give them a use of their own.

      The north building gets nine verses and its twin only three. A reader looking for the southern one will notice that verse 10 says “toward the east.” The ancient Greek translation has “south” there, and modern translations follow it; verse 13 itself speaks of “the north chambers and the south chambers.”
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 3
    phrase: 'gallery against gallery in three stories'
    kind: words
    title: 'Three stories, stepped back'
    body: |
      The building is three stories high and its upper rooms are narrower than those below, though the details are less certain than the King James wording suggests. The word for “gallery” is *attiq*, found in the Bible only in this vision ([[Ezek. 41:15–16]] and verses 3 and 5 here). It is glossed “gallery, porch,” with the caution that its derivation is uncertain, and modern translations add a note at verses 3 and 5 that the meaning of the Hebrew is uncertain. One of them says the same of the whole of verse 12.

      Where the King James has the upper chambers “shorter” and the building “straitened,” modern translations read, “the upper chambers were narrower, for the galleries took more away from them than from the lower and middle chambers,” so that they “were set back from the ground more than the lower and the middle ones.” Verse 6 gives the reason: these stories had no pillars like the pillars of the courts.

      That is as far as the text takes us. Nothing is said about what the stepped shape means, and the chapter turns in verse 13 to what the rooms are for.
    sources: [bdb, esv, nrsvue, oshb-wlc]

  - ref: 13
    phrase: 'shall eat the most holy things'
    kind: history
    title: 'Where the most holy things are eaten'
    body: |
      “Most holy things” is a term from the law of Moses for the priests’ share of three offerings, and the law required that share to be eaten inside the sanctuary. The three are the ones the guide lists. Of the meat offering (a meal or grain offering, despite the English word), what was not burned went to the priests: “it is most holy, as is the sin offering, and as the trespass offering” ([[Lev. 6:17]]). Numbers has the same list: “every meat offering of theirs, and every sin offering of theirs, and every trespass offering of theirs… shall be most holy for thee and for thy sons” ([[Num. 18:9]]).

      Two rules went with the name. Only the priests ate it: “Every male among the priests shall eat thereof” ([[Lev. 7:6]]). And it could not leave holy ground: “in the holy place shall it be eaten, in the court of the tabernacle of the congregation” ([[Lev. 6:26]]).

      Eating it was a duty. When Aaron’s surviving sons failed to eat a sin offering, Moses asked why, “seeing it is most holy, and God hath given it you to bear the iniquity of the congregation, to make atonement for them before the LORD” ([[Lev. 10:17]]).

      In the house Ezekiel is shown, these chambers are where the portions are laid up and eaten. Later the guide takes him “into the holy chambers of the priests, which looked toward the north,” and shows him a place where the priests boil and bake the offerings, “that they bear them not out into the utter court, to sanctify the people” ([[Ezek. 46:19–20]]). The “priests that approach unto the LORD” are described in chapter 40: “the sons of Zadok among the sons of Levi, which come near to the LORD to minister unto him” ([[Ezek. 40:46]]).
    sources: [lds-scriptures, bd-sacrifices, esv]

  - ref: 14
    phrase: 'shall put on other garments'
    kind: history
    title: 'Holy garments stay inside'
    body: |
      The priests change clothes so that the garments they served in do not “sanctify the people,” a reason the text gives only when the rule is repeated two chapters later. The guide gives only half a reason here, “for they are holy.” The other half comes when the rule is repeated: they are to lay their garments in the holy chambers and put on others, “and they shall not sanctify the people with their garments” ([[Ezek. 44:19]]).

      The idea has been explained as “analogous to the rule laid down in the law, that touching most holy sacrificial flesh would sanctify.” That rule is in Leviticus: “Whatsoever shall touch the flesh thereof shall be holy” ([[Lev. 6:27]]). The altar is spoken of the same way: “whatsoever toucheth the altar shall be holy” ([[Ex. 29:37]]). The kitchens of [[Ezek. 46:20]] are given the same reason.

      The law of Moses also had the priests take off the garments of their service when it was ended. On the Day of Atonement, when Aaron came out from the holy place he was to “put off the linen garments, which he put on when he went into the holy place, and shall leave them there” ([[Lev. 16:23]]).

      Neither passage in Ezekiel says what would follow for a person made holy in this way. “Those things which are for the people,” at the end of the verse, is taken in one modern translation as a place, “the area open to the people.”
    sources: [lds-scriptures, keil-ezekiel, nrsvue]

  - ref: 16
    phrase: 'five hundred reeds'
    kind: words
    title: 'Reeds or cubits'
    body: |
      The Hebrew text makes each side five hundred reeds, but the oldest translation and the modern ones make it five hundred cubits, and the difference is sixfold. The guide’s reed is “six cubits long by the cubit and an hand breadth” ([[Ezek. 40:5]]), six of the longer cubits this vision uses. An ordinary cubit was “normally about 17½ inches,” and the long one is put at about 21. Five hundred such cubits come to “about 875 feet.” Five hundred reeds would be six times that, about a mile on each side.

      Several things favor cubits. The ancient Greek translation has “five hundred cubits with the measuring reed.” The measurements of chapters 40–42, added up, give the temple and its two courts a square of five hundred cubits. A later verse gives the sanctuary “five hundred in length, with five hundred in breadth, square round about,” and then adds “fifty cubits round about” ([[Ezek. 45:2]]). Modern translations print cubits, and Elder James E. Talmage described the plan the same way: “The area was to be a square of five hundred cubits, walled about.”

      The reeds have also been kept. The Hebrew says “reeds” in each of verses 16–19 and “with the measuring reed” besides, and on this reading what is measured is not the court wall of [[Ezek. 40:5]] but a much larger open space around it, three thousand cubits square, “a separating domain between the sanctuary and the common land.”

      Either way the purpose is the one verse 20 gives.
    sources: [oshb-wlc, lxx-rahlfs, esv, nrsvue, niv, keil-ezekiel, ot-manual-27, bd-weights-and-measures, lds-scriptures]

  - ref: 20
    phrase: 'to make a separation between the sanctuary and the profane place'
    kind: words
    title: 'Holy and common'
    body: |
      “Profane” in this verse means common, not wicked: the wall marks off ground set apart for God from ordinary ground. In the Old Testament “things or places were holy that were set apart for a sacred purpose; the opposite of holy is therefore common or profane.” The Hebrew word is *hol*, “commonness,” and Ezekiel later uses it for the land where the city itself stands, “a profane place for the city, for dwelling” ([[Ezek. 48:15]]). Modern translations have “to make a separation between the holy and the common.”

      The same words are used of the priests’ commission. After the deaths of Nadab and Abihu the Lord told Aaron that priests were to make this distinction: “that ye may put difference between holy and unholy, and between unclean and clean” ([[Lev. 10:10]]). The verb and the pair of nouns there are the ones in this verse. They are also the ones in Ezekiel’s charge against the priests of Jerusalem, “they have put no difference between the holy and profane” ([[Ezek. 22:26]]), and the nouns return when the priests of the new house are told to “teach my people the difference between the holy and profane” ([[Ezek. 44:23]]).

      The plan of the house as a whole “provided for even greater exclusiveness than had characterized the sacred area of the Temple of Solomon.” The chapter that follows states the holiness of the place as a law: “Upon the top of the mountain the whole limit thereof round about shall be most holy” ([[Ezek. 43:12]]).
    sources: [bd-holiness, bdb, oshb-wlc, esv, ot-manual-27, lds-scriptures]

christ: |
  The measuring ends at “the gate whose prospect is toward the east” (verse 15), and that gate is where the Lord comes in. Ezekiel had watched the glory leave the city and stand “upon the mountain which is on the east side of the city” (see the note on [[Ezek. 11:23]]). With the house measured and its wall drawn, the next thing he sees is this: “the glory of the God of Israel came from the way of the east” ([[Ezek. 43:2]]), and it “came into the house by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]). There the Lord says of the house, “the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Israel for ever” ([[Ezek. 43:7]]). Who the LORD of these visions is was said at the first of them (see the note on [[Ezek. 1:26]]).

  The offerings of verse 13 are sacrifices, and the law of sacrifices was given from the beginning “in a similitude of the sacrifice that would be made of the Only Begotten Son of God.” How such offerings have a place in a temple still to come is a question for [[Ezek. 43:18–27]].

explore: |
  - The law behind verse 13, with the priests’ portions and where they are eaten: [[Lev. 6:14–30]] and [[Num. 18:8–10]].
  - The priests’ commission to tell holy from common, given on the day Nadab and Abihu died: [[Lev. 10:8–20]].
  - The same commission broken and restored: [[Ezek. 22:26]] and [[Ezek. 44:15–23]].
  - The kitchens attached to these chambers: [[Ezek. 46:19–24]].
  - What comes next, at the gate where this chapter ends: [[Ezek. 43:1–12]].
  - The holy portion of the land, with the sanctuary’s five hundred square inside it: [[Ezek. 45:1–6]].

