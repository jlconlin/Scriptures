chapter: 24
title: 'The Boiling Pot and the Desire of the Eyes'
tagline: 'On the day the siege of Jerusalem begins, Ezekiel is given a parable of a corroded pot set on the fire, and then a sign in his own house: his wife dies that evening, and he is told not to mourn her.'
when: 'The ninth year, the tenth month, the tenth day (24:1), counted like the book’s other dates from Jehoiachin’s captivity (1:2): about 588 B.C. It is the day the siege of Jerusalem began (24:2).'

setting: |
  The date at the head of the chapter is the day the king of Babylon came against Jerusalem, and Ezekiel is told to write it down. Kings and Jeremiah give the same day for the beginning of the blockade ([[2 Kgs. 25:1]]; [[Jer. 39:1]]; [[Jer. 52:4]]). Ezekiel is not there. He was carried to Babylon with Jehoiachin, this is the ninth year of that captivity, and the word comes to him among the exiles on the day itself. The siege he was told to model on a tile in chapter 4 ([[Ezek. 4:1–3]]) has begun.

  The chapter has two words of the Lord and a short sequel. The first is a parable of a cooking pot (verses 3–14). The second is a sign in the prophet’s own house: his wife will die, and he is to show no mourning (verses 15–24). The last three verses concern Ezekiel himself and the day the news of the city’s fall will reach him.

  This is the last chapter of the first division of the book, the judgments on Jerusalem and the nation that fill chapters 1–24. The eight chapters that follow are spoken against Israel’s enemies. The report that “The city is smitten” comes at [[Ezek. 33:21]].

thread: |
  Both halves of the chapter say that the time for anything milder is over. The pot is corroded, it has been cleaned before and has not come clean, and so it will be emptied and set on the coals until the metal glows (verses 11–13). The sentence that closes the parable has three refusals in a row: “I will not go back, neither will I spare, neither will I repent.”

  Then the message moves into Ezekiel’s own house. He is told in advance that “the desire of thine eyes” will be taken, and that he is to go on as though nothing had happened. When the people ask what this means for them, the answer uses the same phrase: the sanctuary is “the desire of your eyes,” it is about to be profaned, and they will do as Ezekiel has done.

  The last three verses hold the one opening in the chapter: on the day the news of the city’s fall arrives, the prophet’s mouth will be opened, “and they shall know that I am the LORD.”

sections:
  - range: 1-2
    heading: 'The day written down'
    plain: |
      In the ninth year, on the tenth day of the tenth month, the word of the Lord comes to Ezekiel. He is to write down the name of the day, this very day, because on this day the king of Babylon has set himself against Jerusalem.
  - range: 3-5
    heading: 'The parable of the pot'
    plain: |
      Ezekiel is to speak a parable to the rebellious house. The Lord God says: Set the pot on, and pour water into it. Gather the pieces into it, every good piece, the thigh and the shoulder, and fill it with the choice bones. Take the best of the flock. Burn the bones under it, bring it to a full boil, and let the bones cook in it.
  - range: 6-14
    heading: 'Woe to the bloody city'
    plain: |
      The Lord God says: Woe to the bloody city, the pot with scum in it that has not gone out of it. Bring it out piece by piece, with no lot falling on it. Her blood is in the middle of her. She put it on the top of a rock and did not pour it on the ground to cover it with dust. So that fury would rise and take vengeance, the Lord has set her blood on the top of a rock, where it will not be covered.

      Woe to the bloody city. The Lord will make the pile for the fire great. Heap on wood, kindle the fire, cook the flesh through, spice it well, and let the bones be burned. Then set the pot empty on its coals so that its brass grows hot and burns, its filthiness melts in it, and its scum is consumed. She has wearied herself with lies, and her great scum did not leave her; her scum will be in the fire. There is lewdness in her filthiness. Because the Lord purged her and she was not purged, she will not be purged of her filthiness again until He has made His fury rest on her. The Lord has spoken it. It will come, and He will do it. He will not go back, or spare, or repent. They will judge her according to her ways and her doings.
  - range: 15-18
    heading: 'The desire of thine eyes'
    plain: |
      The word of the Lord comes to Ezekiel again. The Lord is about to take away the desire of his eyes with a stroke, and he is not to mourn or weep or let his tears run down. He is to hold back from crying and make no mourning for the dead. He is to bind his headdress on, put his shoes on his feet, leave his lips uncovered, and not eat the bread of men. Ezekiel speaks to the people in the morning. In the evening his wife dies. In the morning he does as he was commanded.
  - range: 19-24
    heading: 'Ezekiel is a sign'
    plain: |
      The people ask Ezekiel to tell them what these things mean for them. He answers with the word of the Lord to the house of Israel: The Lord will profane His sanctuary, the excellency of their strength, the desire of their eyes, and what their soul pities, and the sons and daughters they left behind will fall by the sword. They will do as Ezekiel has done. They will not cover their lips or eat the bread of men. Their headdresses will be on their heads and their shoes on their feet. They will not mourn or weep, but will pine away for their iniquities and mourn toward one another. Ezekiel is a sign to them: they will do everything he has done, and when it comes they will know that He is the Lord God.
  - range: 25-27
    heading: 'The day the mouth is opened'
    plain: |
      As for Ezekiel: in the day when the Lord takes from them their strength, the joy of their glory, the desire of their eyes, what they set their minds on, and their sons and daughters, one who escapes will come to him to let him hear it with his own ears. In that day his mouth will be opened to the one who has escaped. He will speak and be dumb no longer. He will be a sign to them, and they will know that He is the Lord.

notes:
  - ref: 2
    phrase: 'write thee the name of the day'
    kind: history
    title: 'A date to be written down'
    body: |
      Ezekiel is told to make a record of the date because it is the day the siege of Jerusalem began, an event he could not have known of where he was. The history of the kings gives the same day: “Nebuchadnezzar king of Babylon came, he, and all his host, against Jerusalem, and pitched against it” ([[2 Kgs. 25:1]]). Kings counts the ninth year of Zedekiah’s reign and Ezekiel the ninth year from the carrying away of Jehoiachin, which is the same count, since Zedekiah “was appointed king in his stead.” Where the King James Version says the king “set himself against” the city, a modern translation has, “The king of Babylon has laid siege to Jerusalem this very day.”

      The verse gives no reason for the writing beyond the event. It has been explained by what a written date would prove once travelers brought the news: “that the destruction of the city was not to be ascribed to chance or to the power of the Babylonians, but to the will of Him who had long ago foretold” it, and that “Ezekiel was a true prophet, because even when in Babylon, which was at so great a distance, he had known and had publicly announced the state of Jerusalem.”

      The day was not forgotten. After the captivity it “was still kept as a fast-day,” and it is the fast Zechariah names when he promises that “the fast of the tenth, shall be to the house of Judah joy and gladness, and cheerful feasts” ([[Zech. 8:19]]).
    sources: [keil-ezekiel, esv, lds-scriptures]

  - ref: 3
    phrase: 'Set on a pot'
    kind: symbol
    title: 'The pot is Jerusalem'
    body: |
      The pot is Jerusalem, the meat and bones in it are the people, and the fire under it is the siege. The Lord gives the key Himself in verse 6: “Woe to the bloody city, to the pot.” The picture is called a parable, something Ezekiel is to “utter,” and the text does not say that he set a real pot on a fire as he once built a model siege. The good cuts, thigh and shoulder and the best bones, have been read as “the strongest and most important inhabitants of the city.”

      The pot has been in the book before. In the temple vision the leaders in Jerusalem were heard saying, “this city is the caldron, and we be the flesh” ([[Ezek. 11:3]]), and the Lord answered, “I will bring you forth out of the midst of it” ([[Ezek. 11:7]]); see the note on [[Ezek. 11:3]]. Now the pot is set on the fire, and verse 6 has, “bring it out piece by piece.”

      One line of the recipe is puzzling in the King James Version: “burn also the bones under it.” Modern translations take the line as an instruction about fuel, “pile the logs under it,” and note that the Hebrew word is “the bones.”
    sources: [ot-manual-26, esv, lds-scriptures]

  - ref: 6
    phrase: 'whose scum is therein'
    kind: words
    title: 'Scum, or rust'
    body: |
      The Hebrew word behind “scum,” *chel’ah*, is defined as rust, “perhaps as filth,” so the picture is of a corroded pot. It is found in Ezekiel only in verses 6, 11, and 12 of this chapter. It is “rust on metal pot, symbol of impurity of Jerusalem,” and a modern translation has “the pot whose corrosion is in it, and whose corrosion has not gone out of it.”

      In verse 11 the pot is set “empty upon the coals” until, as the same translation puts it, “its copper may burn.” The empty pot on the fire “represents the burning of the city of Jerusalem after the siege.” Kings records it: Nebuchadnezzar’s captain “burnt the house of the LORD, and the king’s house, and all the houses of Jerusalem” ([[2 Kgs. 25:9]]).

      Verse 12, between the two, is obscure. The noun the King James Version gives as “lies” is taken to mean “toil,” and the Hebrew does not make clear who is worn out by it: “she hath wearied (me or herself) with toil.” One modern translation reads, “She has wearied herself with toil,” with a note that the meaning of the Hebrew is uncertain; another reads, “In vain I have wearied myself.”
    sources: [bdb, oshb-wlc, esv, nrsvue, ot-manual-26, lds-scriptures]

  - ref: 6
    phrase: 'let no lot fall upon it'
    kind: words
    title: 'No lot is cast'
    body: |
      The pieces are to come out of the pot with no choosing among them. The Hebrew is a statement, “no lot has fallen upon it,” and it is explained as meaning that “no discrimination is made, destruction is to include the whole city.” A lot decided between one and another; here none is cast. The clause has also been explained in terms of sacred use: none of the pieces is to be selected for consecration. Modern translations say it plainly: “Take out of it piece after piece, without making any choice,” or “making no choice at all.”
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 7
    phrase: 'she set it upon the top of a rock'
    kind: scripture
    title: 'Blood left uncovered'
    body: |
      Blood on a rock is blood that has not been covered, and verse 8 says what uncovered blood does: it causes “fury to come up to take vengeance.” The law required one who killed an animal in the hunt to “pour out the blood thereof, and cover it with dust” ([[Lev. 17:13]]). The blood shed in Jerusalem, “the bloody city” here and at [[Ezek. 22:2]], lies instead on what the Hebrew calls “a smooth, bare, rock,” where it cannot soak away. It is “like blood poured out upon a hard rock, which the stone cannot absorb, and which cries to God for vengeance,” as Abel’s did: “the voice of thy brother’s blood crieth unto me from the ground” ([[Gen. 4:10]]). The charge in the image is that the city “has done nothing to cover her sin, has shown no sign of repentance or atonement.”

      Verse 8 then changes the subject of the verb. In verse 7 “she set it upon the top of a rock”; in verse 8, “I have set her blood upon the top of a rock.” The city did not hide what it had done, and the Lord has seen to it that it stays in view: “He has caused the blood that was shed to fall upon a bare rock, that it might lie uncovered.”
    sources: [keil-ezekiel, bdb, lds-scriptures]

  - ref: 13
    phrase: 'because I have purged thee, and thou wast not purged'
    kind: scripture
    title: 'A cleansing that was refused'
    body: |
      The Lord says He has already tried to cleanse Jerusalem, and the fire comes only because that failed. The verse does not say what the earlier cleansing was. It has been explained as the long effort “to convert the people from their sinful ways, partly by threats and promises communicated through the prophets” and “partly by means of chastisements.” Chronicles says that the Lord “sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people” ([[2 Chr. 36:15]]), and the messengers were mocked “until the wrath of the LORD arose against his people, till there was no remedy” ([[2 Chr. 36:16]]). Inside the parable, verse 12 has been read the same way, as the failure of every attempt to clean the pot “by milder means.” A modern translation brings out the offer in the verb: “because I would have cleansed you and you were not cleansed from your uncleanness.”

      The sentence also has a limit in it. Jerusalem will not be purged “any more, till I have caused my fury to rest upon thee.” The phrase was first used in the explanation of the siege signs: “I will cause my fury to rest upon them” ([[Ezek. 5:13]]).
    sources: [keil-ezekiel, esv, lds-scriptures]

  - ref: 14
    phrase: 'shall they judge thee'
    kind: words
    title: 'Who will judge'
    body: |
      The Hebrew verb is plural, as the King James Version has it, and the verse does not say who “they” are. The ancient Greek translation has no “they” at all: “I will judge thee, saith the Lord, according to thy ways, and according to thy devices.” One modern translation follows it, “According to your ways and your doings I will judge you,” and another makes the verb passive, “you will be judged.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, esv]

  - ref: 16
    phrase: 'the desire of thine eyes with a stroke'
    kind: words
    title: 'The desire of thine eyes'
    body: |
      “The desire of thine eyes” is Ezekiel’s wife, as verse 18 shows, and the phrase means “that in which the eyes take delight.” The Hebrew noun, *machmad*, comes three times in Ezekiel, and all three are in this chapter: here of his wife, in verse 21 of the sanctuary, and in verse 25 of what the people are about to lose. Lamentations uses the same noun for what fell with the city, when the Lord “slew all that were pleasant to the eye” ([[Lam. 2:4]]).

      “With a stroke” is one word in Hebrew, *maggephah*. Here it is a “blow, = fatal stroke”; elsewhere it is the word for a “plague, pestilence (divine judgment).” Modern translations have “at a stroke” and “with one blow.” The text says no more than that. It gives no name for her and no illness, and the only reason it offers for her death is the sign that the death is made to be (verses 21–24).
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 17
    phrase: 'bind the tire of thine head upon thee'
    kind: history
    title: 'The signs of mourning he may not show'
    body: |
      Each command in verse 17 sets aside a custom of mourning. “Putting ashes on the head, making one’s feet bare, covering the lips, and eating bread of mourning were all signs of grief.” Ezekiel is to show none of them.

      - **The tire.** This is a “head-dress, turban,” which is elsewhere a “sign of joy.” He is to bind it on as usual.
      - **Shoes.** He keeps them on.
      - **Lips.** The Hebrew word is the “moustache,” or “upper lip.” Scripture has the gesture elsewhere: the leper was to “put a covering upon his upper lip” ([[Lev. 13:45]]), and seers put to shame “shall all cover their lips” ([[Micah 3:7]]).
      - **The bread of men.** A modern translation has “the bread of mourners,” the phrase Hosea uses ([[Hosea 9:4]]). Jeremiah speaks of a drink given in the same way: “neither shall men give them the cup of consolation to drink for their father or for their mother” ([[Jer. 16:7]]).

      “Forbear to cry” is rendered in modern translations “Sigh, but not aloud” and “Groan quietly.”

      Two others in scripture were given a like command. Jeremiah was told, “Enter not into the house of mourning, neither go to lament nor bemoan them” ([[Jer. 16:5]]). And when Nadab and Abihu died, Moses said to Aaron and his remaining sons, “Uncover not your heads, neither rend your clothes” ([[Lev. 10:6]]).
    sources: [ot-manual-26, bdb, nrsvue, esv, lds-scriptures]

  - ref: 18
    phrase: 'at even my wife died'
    kind: history
    title: 'One day, from morning to morning'
    body: |
      The whole event takes one verse, and it falls on the day named in verse 1: “Ezekiel’s wife died on the very day Nebuchadnezzar besieged Jerusalem.” He spoke to the people in the morning. She died in the evening. Modern translations make the last clause “on the next morning I did as I was commanded,” which is “within twelve hours of his wife’s death!”

      Ezekiel reports no word of his own about it. He says only that he obeyed. The people speak next, in verse 19, and their question already assumes that what he is doing is about them: “what these things are to us.”
    sources: [lund-ezekiel, esv, nrsvue]

  - ref: 21
    phrase: 'I will profane my sanctuary'
    kind: symbol
    title: 'What the sign means'
    body: |
      The Lord explains the sign Himself: what Ezekiel’s wife was to him, the temple is to the exiles, and it is about to be taken from them. Her death was “the ultimate symbol or type of Jerusalem’s coming destruction.” The temple is given her phrase, “the desire of your eyes,” and two more beside it.

      “The excellency of your strength” is, in Hebrew, the very phrase of the covenant warning in Leviticus: “I will break the pride of your power” ([[Lev. 26:19]]). A modern translation uses the same English in both places, “the pride of your power.” “That which your soul pitieth” is given as “the yearning of your soul” or “your heart’s desire.”

      The loss does not stop at the building. “Your sons and your daughters whom ye have left” are the children the exiles “left behind” in Jerusalem when they were carried away.

      The verse says “my sanctuary”: what the Lord will profane is His own. He had said earlier that He would turn His face from the people, and “they shall pollute my secret place” ([[Ezek. 7:22]]); see the note on [[Ezek. 7:20]]. The sign has also been read with the city in the wife’s place: “Jerusalem was the bride of Jehovah.”
    sources: [oshb-wlc, esv, nrsvue, lund-ezekiel, lds-scriptures]

  - ref: 23
    phrase: 'ye shall pine away for your iniquities'
    kind: scripture
    title: 'Why they will not mourn'
    body: |
      The exiles will no more mourn the temple than Ezekiel mourned his wife, and two explanations have been given for it. One is that mourning would be out of place: “there could be no mourning, for her tragedy was just and fully deserved.” The other is that the grief will be too heavy for the customs of grief: “they would not mourn and weep, but simply in their gloomy sorrow sigh in silence on account of their sins, and groan one toward another.” The “mourn” at the verse’s end is not the Hebrew verb for lamenting used in “ye shall not mourn.” It is a different verb, found in Ezekiel only here, which a modern translation gives as “groan to one another.”

      “Pine away for your iniquities” is the covenant warning again. Leviticus says of those who survive, “they that are left of you shall pine away in their iniquity in your enemies’ lands” ([[Lev. 26:39]]), with the same Hebrew verb (see the note on [[Ezek. 4:16]]). The verb comes three times in Ezekiel: of the besieged at [[Ezek. 4:17]], here, and once more after the city has fallen, when the exiles say it of themselves: “If our transgressions and our sins be upon us, and we pine away in them, how should we then live?” ([[Ezek. 33:10]]).
    sources: [lund-ezekiel, ot-manual-26, oshb-wlc, esv, lds-scriptures]

  - ref: 24
    phrase: 'Thus Ezekiel is unto you a sign'
    kind: words
    title: 'The prophet himself is the sign'
    body: |
      The sign here is the man and not something he makes or carries, and the Lord names him. “Ezekiel” appears only twice in the book: in its heading, “The word of the LORD came expressly unto Ezekiel the priest” ([[Ezek. 1:3]]), and here, where the Lord speaks of him to the people.

      The Hebrew word for “sign,” *mopheth*, is a “sign or token of future event,” and it is one of the words “applied to persons.” Isaiah used it of himself and his family: “I and the children whom the LORD hath given me are for signs and for wonders in Israel” ([[Isa. 8:18]]). Ezekiel has it four times, twice in chapter 12 and twice in this chapter. In chapter 12 he said, “I am your sign: like as I have done, so shall it be done unto them” ([[Ezek. 12:11]]), and “them” were the people of Jerusalem going into captivity. Here the sign is for the exiles in front of him: “according to all that he hath done shall ye do.”
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 27
    phrase: 'In that day shall thy mouth be opened'
    kind: scripture
    title: 'The end of the silence'
    body: |
      The chapter closes by telling Ezekiel that the silence laid on him at his call will end when a survivor brings word that Jerusalem has fallen. At his call he was told, “thou shalt be dumb, and shalt not be to them a reprover” ([[Ezek. 3:26]]), with the exception, “when I speak with thee, I will open thy mouth” ([[Ezek. 3:27]]); see the note on [[Ezek. 3:26]]. The Hebrew verb for being dumb comes three times in the book, there, here, and where the promise is kept. “In the twelfth year of our captivity, in the tenth month, in the fifth day of the month… one that had escaped out of Jerusalem came unto me, saying, The city is smitten” (33:21), “and my mouth was opened, and I was no more dumb” ([[Ezek. 33:22]]).

      By the book’s own dates that is nearly three years after the day of this chapter. “In that day” in verses 26 and 27 has accordingly been explained as not the day the temple is destroyed but “generally the time of this event, or more precisely, the day on which the tidings would reach the prophet.”

      On one reading the interval is itself part of the sign. The silence of chapter 3 “was to be observed in the strictest manner from the present time until the reception of the intelligence of the fall of Jerusalem.” On that reading the sign of verse 27 is wider than the sign of verse 24: it “refers to the whole of the ministry of the prophet, his silence hitherto, and that which he was still to observe, as well as his future words.”
    sources: [keil-ezekiel, oshb-wlc, lds-scriptures]

christ: |
  “I the LORD have spoken it: it shall come to pass, and I will do it” (verse 14). The LORD who speaks is the one the note on [[Ezek. 1:26]] identifies. Jacob praises Him for this very thing: “O the greatness and the justice of our God! For he executeth all his words, and they have gone forth out of his mouth, and his law must be fulfilled” ([[2 Ne. 9:17]]).

  The chapter’s last promise is that Ezekiel’s mouth will be opened. It is opened at [[Ezek. 33:22]], in the first of the book’s chapters of restoration (33–39), and among those chapters is the promise of “one shepherd” ([[Ezek. 34:23]]), which refers to Jesus Christ, the Good Shepherd.

explore: |
  - The first day of the siege and the burning of the temple in the histories: [[2 Kgs. 25:1–10]] and [[Jer. 52:4–13]].
  - The earlier saying about the caldron and the flesh: [[Ezek. 11:1–12]].
  - The covenant warnings whose words return in verses 21 and 23: [[Lev. 26:14–39]].
  - Jeremiah forbidden to enter the house of mourning: [[Jer. 16:5–7]].
  - The silence laid on Ezekiel, and its end: [[Ezek. 3:26–27]] and [[Ezek. 33:21–22]].
  - What was “pleasant to the eye” after it fell: [[Lam. 2:4]].
  - The fast of the tenth month turned to gladness: [[Zech. 8:19]].

