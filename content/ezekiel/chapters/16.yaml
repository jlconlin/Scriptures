chapter: 16
title: 'Jerusalem the Unfaithful Wife'
tagline: 'The Lord tells Jerusalem her whole history as the story of one woman: a baby left to die, a bride clothed as a queen, a wife who gave every gift to other lovers, and at the last a wife taken back by a covenant she did not keep.'
when: 'No date of its own. The chapter stands under the heading of 8:1, “the sixth year, in the sixth month” of Jehoiachin’s captivity (about 591 B.C.), and before the next date in the book, the seventh year (20:1).'

setting: |
  This chapter comes before the siege of Jerusalem, which begins in the ninth year ([[Ezek. 24:1–2]]). The one before it compared Jerusalem to a vine fit only for burning. This one answers anyone who still counted on the city’s standing with God. It shows that “by nature Israel is no better than other nations,” and it does so by telling the city’s history as the life of one woman. It falls into three parts: the Lord’s care and Jerusalem’s unfaithfulness (verses 2–34), the punishment (35–52), and the restoration (53–63).

  The figure was not new. In Hosea 2 and Jeremiah 3 Israel is already the Lord’s wife. Ezekiel carries it further than either, in language that is “some of the most scathing in all the scriptures.” It is a figure throughout. The wife is Jerusalem, standing for the nation. “The husband represents the Lord.” The adultery is idolatry, and the lovers are false gods and foreign powers. What the chapter condemns is what a nation did with its covenant.

  Chapter 23 tells the story again with two sisters, Samaria and Jerusalem ([[Ezek. 23]]).

thread: |
  The chapter turns on memory. Everything Jerusalem has was given to her, and the Lord says so in the possessives: the beauty was “my comeliness, which I had put upon thee” (verse 14); what she takes to her idols is “my gold,” “my silver,” “mine oil,” and at last “my children” (verses 17–21). Her sin is stated in one line, twice: “thou hast not remembered the days of thy youth” (verses 22 and 43). She forgot where she was found.

  So the story is told from the beginning. A newborn is thrown out to die and the Lord says, “Live” (1–7). He marries her and clothes her as a queen (8–14). She trusts the beauty and spends the gifts on other lovers, false gods and then Egypt, Assyria, and Chaldea, paying them to come (15–34). The sentence is the law’s sentence on an adulteress, and it leaves her as she began, “naked and bare” (35–43; the words of verses 7 and 22 return in verse 39). Then her pride is taken away by comparison: Sodom and Samaria did less (44–52).

  The end reverses the middle: “Nevertheless I will remember my covenant with thee” (verse 60; see the note on [[Ezek. 16:60]]). The book’s refrain follows, “thou shalt know that I am the LORD” (verse 62; see the note on [[Ezek. 6:7]]). The last verse adds that the Lord will be “pacified toward thee for all that thou hast done” (see the note on [[Ezek. 16:63]]).

sections:
  - range: 1-7
    heading: 'The child no one wanted'
    plain: |
      The word of the Lord comes to Ezekiel: make Jerusalem know her abominations. The Lord God says to her: Your origin and your birth are from the land of Canaan. Your father was an Amorite and your mother a Hittite. On the day you were born your cord was not cut. You were not washed clean with water, or rubbed with salt, or wrapped in cloths. No eye pitied you enough to do any of this. You were thrown out into the open field, loathed, on the day you were born. I passed by and saw you lying in your blood, and I said to you in your blood, Live. I said it again: Live. I made you grow like a plant of the field. You grew tall and came to womanhood, and still you were naked and bare.
  - range: 8-14
    heading: 'The marriage and the gifts'
    plain: |
      I passed by again and saw that you were of an age for love. I spread my skirt over you and covered your nakedness. I swore to you and entered into a covenant with you, and you became mine. I washed the blood from you and anointed you with oil. I clothed you in embroidered cloth, gave you sandals of fine leather, wrapped you in fine linen and covered you with silk. I put bracelets on your hands, a chain on your neck, a jewel on your nose, earrings in your ears, and a beautiful crown on your head. You had gold and silver, the finest clothing, and fine flour, honey, and oil to eat. You grew very beautiful and rose to be a queen. Your fame went out among the nations for your beauty, and it was perfect because of the splendour I had put on you.
  - range: 15-22
    heading: 'The gifts given away'
    plain: |
      But you trusted in your beauty and used your fame to play the harlot with anyone who passed by. You took your garments and made bright-coloured high places and were unfaithful on them. You took the jewels of my gold and my silver and made images of men, and were unfaithful with them. You dressed them in your embroidered clothes and set my oil and my incense before them. The food I gave you, fine flour and oil and honey, you set before them as a sweet savour. You took the sons and daughters you had borne to me and sacrificed them to the images. Was your harlotry so small a thing that you killed my children and made them pass through the fire? In all of it you did not remember the days of your youth, when you were naked and bare and lying in your blood.
  - range: 23-34
    heading: 'Egypt, Assyria, Chaldea'
    plain: |
      After all this (woe, woe to you, says the Lord God) you built yourself a raised place, a high place in every street and at the head of every road. You made your beauty a thing to be abhorred and offered yourself to everyone who passed by. You were unfaithful with the Egyptians, your neighbours, and provoked me to anger. So I stretched out my hand against you, cut down your allotted portion, and gave you over to those who hate you, the daughters of the Philistines, who were ashamed of your conduct. You were unfaithful with the Assyrians too, and were still not satisfied; then in the land of Canaan and on to Chaldea, and were not satisfied even then. How weak is your heart, to do all this. You were not even like a harlot, because you scorned payment. You were an adulterous wife, who takes strangers in place of her husband. Men give gifts to harlots, but you gave your gifts to all your lovers and hired them to come to you from every side. You were the opposite of other women: no one sought you out, and you paid when no pay was given to you.
  - range: 35-43
    heading: 'The sentence'
    plain: |
      Therefore, harlot, hear the word of the Lord. Because of your unfaithfulness with your lovers and with all your idols, and because of the blood of your children that you gave to them, I will gather all your lovers, those you loved and those you hated, against you from every side, and uncover you before them. I will judge you as women who break wedlock and shed blood are judged. I will give you into their hand. They will throw down your raised places, strip you of your clothes, take your jewels, and leave you naked and bare. They will bring a company against you, stone you, and run you through with swords. They will burn your houses and carry out judgments on you in the sight of many women. I will make you stop, and you will pay no more hire. Then my fury toward you will rest and my jealousy will leave you; I will be quiet and angry no more. Because you did not remember the days of your youth, I will bring your way down on your own head.
  - range: 44-52
    heading: 'Like mother, like daughter'
    plain: |
      Everyone who uses proverbs will say of you, As is the mother, so is her daughter. You are the daughter of your mother, who loathed her husband and her children, and the sister of your sisters, who did the same. Your mother was a Hittite and your father an Amorite. Your elder sister is Samaria, who lives with her daughters at your left hand; your younger sister, at your right hand, is Sodom with her daughters. You did not merely walk in their ways. You became more corrupt than they in all your ways. As I live, says the Lord God, Sodom and her daughters have not done what you and your daughters have done. This was the iniquity of Sodom: pride, fulness of bread, and careless ease, and she did not strengthen the hand of the poor and needy. They were haughty and committed abomination before me, and I took them away when I saw it. Samaria has not committed half your sins. You have made your sisters look righteous by all that you have done. So bear your own shame, you who judged your sisters; they are more righteous than you.
  - range: 53-63
    heading: 'The covenant remembered'
    plain: |
      I will bring back the captivity of Sodom and her daughters and of Samaria and her daughters, and yours in the midst of them, so that you may bear your shame and be confounded at all you have done, being a comfort to them. When your sisters return to their former estate, you and your daughters will return to yours. In the day of your pride you would not so much as speak of your sister Sodom, before your own wickedness was uncovered; now the daughters of Syria and of the Philistines despise you on every side. You have borne your lewdness and your abominations. I will deal with you as you have done, you who despised the oath and broke the covenant. Nevertheless I will remember my covenant with you in the days of your youth, and I will establish an everlasting covenant with you. Then you will remember your ways and be ashamed, when you receive your sisters, the elder and the younger, and I give them to you as daughters, though not by your covenant. I will establish my covenant with you, and you will know that I am the Lord. You will remember and be confounded, and never open your mouth again because of your shame, when I am pacified toward you for all that you have done, says the Lord God.

notes:
  - ref: 3
    phrase: 'thy father was an Amorite, and thy mother an Hittite'
    kind: history
    title: 'Canaanite parents'
    body: |
      The parentage given to Jerusalem is a statement about her character, not about her ancestry. The “descent and birth referred to are not physical, but spiritual descent,” in the sense in which Jesus said to His opponents, “Ye are of your father the devil” ([[John 8:44]]).

      The Amorites and the Hittites were peoples of Canaan (the Hittites “a branch of the Canaanites”), and the two are chosen because they were “recognised as the leaders in Canaanitish ungodliness.” Genesis speaks unfavourably of both. Of the first the Lord told Abraham, “the iniquity of the Amorites is not yet full” ([[Gen. 15:16]]). Of the second Rebekah said, “I am weary of my life because of the daughters of Heth” ([[Gen. 27:46]]).

      The city itself did have a Canaanite past: it was once “simply a Jebusite city.” But the Lord is speaking to “Jerusalem (which means Judah in general),” the people and not the walls. The charge comes back in verse 45 as a proverb, “As is the mother, so is her daughter.” The opening line prepares everything after it. Nothing in her origin set her above her neighbours.
    sources: [keil-ezekiel, ot-manual-26, bd-hittites, lds-scriptures]

  - ref: 4
    phrase: 'thou wast not salted at all, nor swaddled at all'
    kind: history
    title: 'A newborn no one tended'
    body: |
      Verse 4 lists the care a newborn was ordinarily given and says that this one received none of it. The cord was cut, the child was bathed, and then “the body was rubbed with salt, according to a custom very widely spread in ancient times.” The salt was meant to firm and clean the skin, and probably also, as “a protection from putrefaction,” to express “a hope and desire for the vigorous health of the child.” Last of all the baby was wrapped in cloths.

      Verse 5 says why none was done: “None eye pitied thee.” She was “cast into the field, i.e., exposed, in order that it might perish.”

      The neglect pictures the people’s spiritual state. With the cord uncut, they were still fed by the practices of the heathen neighbours who had given them birth. Unwashed and unsalted, they had not been cleansed of what they took from those parents. The message is that the Jews “had never really been cleansed from the corruptions of the world and born as God’s children.”

      The birth has also been placed in Israel’s history. On that reading the “day of the birth of Jerusalem, i.e., of Israel, was the period of its sojourn in Egypt, where Israel as a nation was born,” and the separate details are not matched to separate events but “have their explanation in the totality of the figure.”
    sources: [keil-ezekiel, ot-manual-26]

  - ref: 6
    phrase: 'I said unto thee when thou wast in thy blood, Live'
    kind: words
    title: 'Live, said twice'
    body: |
      The first thing the Lord does for the child is to speak one word to her, and the verse reports it twice. In Hebrew “Live” is a single imperative addressed to a female (*chayi*). Both times it stands beside the phrase “in thy blood,” and a modern translation keeps the repetition: “in your blood, ‘Live!’ I said to you,” and then the same words again. The verse does not say why the word is given twice.

      The command comes before the covenant of verse 8 and the washing of verse 9, while she is still unwashed and unclothed. In the next verse she is growing “as the bud of the field.”
    sources: [oshb-wlc, esv]

  - ref: 8
    phrase: 'I spread my skirt over thee'
    kind: symbol
    title: 'The skirt spread over her'
    body: |
      To spread the skirt of one’s garment over a woman was to take her as a wife (“in other words, I married thee”), and the rest of the verse says so: an oath, a covenant, “and thou becamest mine.” The Hebrew word is *kanaph*, “wing,” used of a garment for its “skirt, corner, or loose flowing end.” It is the word in Ruth’s request to Boaz: “spread therefore thy skirt over thine handmaid; for thou art a near kinsman” ([[Ruth 3:9]]). A modern translation has “I spread the corner of my garment over you and covered your nakedness.” The covering answers the “naked and bare” of verse 7.

      “I sware unto thee, and entered into a covenant with thee” joins two terms the Old Testament often pairs. Swearing an oath and making a covenant are together “indications of a mutually binding obligation.” Here it is the Lord who swears. In the same figure Jeremiah sets the wedding in the wilderness after Egypt: “I remember thee, the kindness of thy youth, the love of thine espousals, when thou wentest after me in the wilderness” ([[Jer. 2:2]]). The Lord took the foundling in, “adorned her like a bride,” and married her Himself.

      The oath is named once more, near the end. Jerusalem is the one “which hast despised the oath in breaking the covenant” (verse 59).
    sources: [keil-ezekiel, bdb, oshb-wlc, esv, benson-adam-eve, lund-ezekiel]

  - ref: 10
    phrase: 'shod thee with badgers’ skin'
    kind: words
    title: 'What the bride was given'
    body: |
      Two of the words for the bride’s clothing are rare, and the verses themselves say what the gifts mean. “Badgers’ skin” is *tachash*, “a kind of leather or skin.” Here it makes a woman’s sandals; everywhere else in the Old Testament it is the outer covering of the tabernacle and its furniture, as in “a covering above of badgers’ skins” ([[Ex. 26:14]]). The animal is uncertain (“probably the dugong”), and a modern translation says only “fine leather.” The text does not remark on the tabernacle’s leather being on her feet. “Silk” is *meshi*, which the Bible has only in verses 10 and 13 of this chapter. It is “a costly material for garments”; the rabbis took it for silk, but whether that rests on real tradition “is dubious.”

      She is given a crown and “didst prosper into a kingdom” (“advanced to royalty”), so the foundling has become a queen. And verse 14 says whose the splendour was. Her beauty “was perfect through my comeliness, which I had put upon thee.” The same possessive runs through the next section, where what she misuses is “my gold,” “my silver,” “mine oil,” and “My meat.”
    sources: [bdb, oshb-wlc, esv]

  - ref: 15
    phrase: 'But thou didst trust in thine own beauty'
    kind: symbol
    title: 'What the harlotry stands for'
    body: |
      The chapter turns at this verse, and from here on a wife’s unfaithfulness is its picture of idolatry. Verses 16–19 go back through the gifts of verses 10–13 one at a time. The garments become hangings for the high places. The gold and silver become images. The embroidered robes are put on the images, and the oil, the incense, the flour, and the honey are set in front of them. Hosea had said the same of the northern kingdom: “she did not know that I gave her corn, and wine, and oil, and multiplied her silver and gold, which they prepared for Baal” ([[Hosea 2:8]]).

      In these verses Ezekiel “used forceful language to describe Israel’s apostasy as a form of spiritual adultery.” Israel “played the part of the harlot (verse 15), whoring after false gods,” where she should have been “faithful to her marriage to Jehovah.”

      The first step is the one this verse names: she trusted in her own beauty, which verse 14 has just called the Lord’s gift.
    sources: [sc-knowhy-147, lund-ezekiel, lds-scriptures]

  - ref: 20
    phrase: 'these hast thou sacrificed unto them to be devoured'
    kind: history
    title: 'Children given to idols'
    body: |
      Verses 20–21 name the worst of the idolatry, the sacrifice of children, and Kings records that it was done. The verses do not name the god. Elsewhere the practice belongs to Molech, “a fire god, worshipped by passing children through or burning them in fire,” and two kings of Judah are recorded as doing it. Ahaz “made his son to pass through the fire, according to the abominations of the heathen” ([[2 Kgs. 16:3]]), and Manasseh “made his son pass through the fire” ([[2 Kgs. 21:6]]).

      The Lord calls the victims His own. They are the children “whom thou hast borne unto me,” and in the next verse “my children.” The charge returns twice in the sentence that follows: “the blood of thy children” is among its grounds (verse 36), and she is judged as one who has “shed blood” (verse 38). Ezekiel comes back to it at [[Ezek. 20:26]] and [[Ezek. 20:31]].
    sources: [bd-molech, lds-scriptures]

  - ref: 26
    phrase: 'committed fornication with the Egyptians thy neighbours'
    kind: history
    title: 'Egypt, Assyria, Chaldea'
    body: |
      Verses 26–29 name three lovers who are nations, and with them the figure takes in Judah’s politics as well as her worship. The harlotry of these verses has been read as “the inclination of Israel to heathen ways in all its extent, both religious and political.”

      Egypt comes first; one explanation is that Israel’s apostasy “commenced with the worship of the golden calf, and the longing in the wilderness for the fleshpots of Egypt.” Assyria came with King Ahaz, “who sought help from the Assyrians.” His message to Tiglath-pileser was, “I am thy servant and thy son: come up, and save me” ([[2 Kgs. 16:7]]).

      The third is obscured in English. The phrase “in the land of Canaan unto Chaldea” does not name two places. “Canaan” here is taken as a common noun, a word for merchants, “applied to Chaldaea,” and Ezekiel uses it so in the next chapter, where Babylon is “a land of traffick” ([[Ezek. 17:4]]). A modern translation has her unfaithful “with the trading land” of Chaldea.

      Three times the verses say she was not satisfied. The trouble that came of seeking Assyria’s friendship “did not sober” Judah or lead her to stop looking to other nations and their gods for help.
    sources: [keil-ezekiel, esv, lds-scriptures]

  - ref: 33
    phrase: 'thou givest thy gifts to all thy lovers'
    kind: symbol
    title: 'A harlot who pays'
    body: |
      These verses say Jerusalem was worse than a harlot, and the reason is an inversion: she paid. A harlot “takes presents from her lovers, and that is her motivation.” In Judah’s case “the false gods gave no benefits to Israel”: “In her spiritual adultery, Israel actually gave gifts to her lovers.” So verse 32 corrects the name. She is not a harlot but “a wife that committeth adultery.”

      Hosea had said it of the northern kingdom and Assyria: “they are gone up to Assyria, a wild ass alone by himself: Ephraim hath hired lovers” ([[Hosea 8:9]]).

      That is the sense of “the contrary is in thee from other women” (verse 34).
    sources: [ot-manual-26, lund-ezekiel, lds-scriptures]

  - ref: 40
    phrase: 'they shall stone thee with stones'
    kind: history
    title: 'The sentence the law gave'
    body: |
      The punishments of verses 38–41 answer the two crimes charged in verse 38, where she is judged “as women that break wedlock and shed blood are judged.” For adultery the law said, “the adulterer and the adulteress shall surely be put to death” ([[Lev. 20:10]]), and in the case of a betrothed woman it names stoning: “ye shall stone them with stones that they die” ([[Deut. 22:24]]). The blood is “the blood of thy children” (verse 36; see verses 20–21).

      The executioners are the lovers themselves, gathered with those she hated (verse 37). They throw down her high places, strip her, bring up “a company,” use the sword, and “burn thine houses with fire.” Kings records the day it happened to the city: “he burnt the house of the LORD, and the king’s house, and all the houses of Jerusalem” ([[2 Kgs. 25:9]]). She is left “naked and bare,” the words used of her before the Lord clothed her (verses 7 and 22).

      The passage ends in quiet: “So will I make my fury toward thee to rest … and I will be quiet, and will be no more angry.” The chapter goes on from there to the covenant (see the note on [[Ezek. 16:60]]).
    sources: [lds-scriptures]

  - ref: 46
    phrase: 'thine elder sister is Samaria'
    kind: history
    title: 'Two sisters: Samaria and Sodom'
    body: |
      Jerusalem is given two sisters, and both “had already fallen under the chastening hand of the Lord.” Samaria was “the capital of the kingdom of Israel,” the northern tribes, which Assyria carried away in 721 B.C. Sodom is the city of [[Gen. 19]]. They are sisters of Jerusalem not by descent but because all three “were all motivated by the same spirit of idolatry.”

      “Elder” and “younger” translate the ordinary Hebrew words for great and small (*gedolah*, *qetannah*) and “could more clearly be rendered greater and lesser.” The left hand is north and the right hand south. Samaria lay to the north of Jerusalem and Sodom to the south. The “daughters” are the “lesser cities in the surrounding areas” that depended on each.

      The comparison is the humiliation. Verse 56 says Jerusalem would not so much as mention Sodom “in the day of thy pride.” Now she is told that Sodom did less, that Samaria did not commit half her sins, and that she has “justified” them both, which is to say she has “made your sisters appear righteous” beside her. Jeremiah had said the same of the two kingdoms: “The backsliding Israel hath justified herself more than treacherous Judah” ([[Jer. 3:11]]).

      Chapter 23 returns to the figure with Sodom left out: “Samaria is Aholah, and Jerusalem Aholibah” ([[Ezek. 23:4]]).
    sources: [ot-manual-26, oshb-wlc, bd-samaria, bd-captivities, esv, lds-scriptures]

  - ref: 49
    phrase: 'this was the iniquity of thy sister Sodom'
    kind: prophets
    title: 'The sin of Sodom'
    body: |
      Ezekiel names Sodom’s sin as pride, plenty, ease, and no hand for the poor. The “abundance of idleness” is, in a modern translation, “prosperous ease.” Verse 50 adds that they “were haughty, and committed abomination before me,” and Genesis tells of the destruction ([[Gen. 19:24]]). The fate of those cities “was regarded as a warning against sensual wickedness.”

      Latter-day leaders have taught from these verses that pride was part of it. Elder Theodore M. Burton, then an Assistant to the Twelve, taught from them that “the Lord did not destroy Sodom and Gomorrah because of sexual impurity alone,” and that “it was pride and haughtiness, added to all these other sins, that brought about this utter destruction.” President Ezra Taft Benson cited these two verses when he named Sodom as a city that pride destroyed.

      The verses are here to measure Jerusalem: “Sodom thy sister hath not done … as thou hast done” (verse 48).
    sources: [benson-pride, burton-pride, bd-gomorrah, esv, lds-scriptures]

  - ref: 53
    phrase: 'the captivity of Sodom and her daughters'
    kind: scripture
    title: 'Sodom brought back?'
    body: |
      The promise of restoration names Sodom first, and Sodom had no captives to bring back. No “carrying away, or captivity, took place in the case of Sodom.” The phrase is a figure for restoring a people’s condition. Modern translations render it “I will restore their fortunes,” and verse 55 explains it as a return “to their former estate.”

      Verse 54 gives the reason: “That thou mayest bear thine own shame.” Jerusalem had despised these cities, and she is restored among them and not ahead of them, “so that all boasting on the part of Israel is precluded.”

      How a city whose people all perished could be restored, the text does not say. It has been read of “the literal Sodom,” with no earthly way for it to happen, so that “the realization of the prophecy must be sought for beyond the present order of things, in one that extends into the life everlasting.” That reading reasons from the Savior’s saying that it will be “more tolerable for the land of Sodom in the day of judgment” ([[Matt. 11:24]]) that the fire was not “the final decision with regard to its inhabitants.” And it appeals to Peter: “for this cause was the gospel preached also to them that are dead” ([[1 Pet. 4:6]]). It is one reading, from a commentary outside the Church. The chapter itself stops at the purpose the Lord gives in verse 54.
    sources: [keil-ezekiel, esv, nrsvue, lds-scriptures]

  - ref: 60
    phrase: 'Nevertheless I will remember my covenant with thee'
    kind: structure
    title: 'She forgot; He remembers'
    body: |
      The last part of the chapter turns on one verb, “remember,” and on who does the remembering. The Hebrew verb is *zakar*, and it comes five times in the chapter. The first two are the charge against Jerusalem: “thou hast not remembered the days of thy youth” (verses 22 and 43). The third is here, and its subject is the Lord: “I will remember my covenant with thee in the days of thy youth,” the very days she forgot. Only after that does she remember (verses 61 and 63).

      So the restoration does not begin with her. After “I will even deal with thee as thou hast done” (verse 59) the reader expects the end, and the word that comes is “Nevertheless,” which opens the promise of an everlasting covenant. Her remembering follows His, and it comes with shame (verses 61 and 63). The same order is in a later chapter, where Israel is first gathered and cleansed: “Then shall ye remember your own evil ways” ([[Ezek. 36:31]]), and the Lord adds, “Not for your sakes do I this” ([[Ezek. 36:32]]).

      The promise looks to the last days, when Israel “will return to the covenant and experience an eventual conversion to the gospel.”

      One phrase in verse 61 is not settled. The sisters are given to Jerusalem “for daughters, but not by thy covenant.” The Hebrew has only the preposition *min* (from) before “thy covenant,” and translators take it differently: “not on account of the covenant with you,” with “not apart from” as an alternative, or “not on the basis of my covenant with you.”
    sources: [oshb-wlc, lund-ezekiel, esv, niv, lds-scriptures]

  - ref: 63
    phrase: 'when I am pacified toward thee'
    kind: christ
    title: 'Atonement, made by the Lord'
    body: |
      “Pacified” translates the Old Testament’s word for atonement. The Hebrew verb is *kipper*, the verb of the law’s rites, where “the priest shall make atonement.” Modern translations bring it out here: “when I atone for you for all that you have done,” or “when I make atonement” for you.

      What is unusual is who does it. In the law a priest makes atonement for the people. In this verse God is the subject and Jerusalem the object, a use in which the verb means to “cover, i.e. treat as covered, view propitiously.” It belongs to a small group of passages where “God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.” Here it is made “for all that thou hast done.”
    sources: [bdb, oshb-wlc, esv, niv]

christ: |
  The husband of this chapter “represents the Lord” (who He is, the note on [[Ezek. 1:26]] says). The first half of the chapter is an account of what He did for a people who could do nothing for themselves. He said “Live.” He covered, washed, anointed, and clothed her, and bound Himself to her by an oath.

  After the sin and the sentence, the Lord says that He Himself will make the atonement “for all that thou hast done” (see the note on [[Ezek. 16:63]]). The chapter does not say how. It says who will do it, and that what follows is “an everlasting covenant” (verse 60).

explore: |
  - The same figure in Hosea, ending in a betrothal “for ever”: [[Hosea 2]].
  - Jeremiah on the two sisters, Israel and Judah: [[Jer. 3:6–11]].
  - The retelling with Samaria and Jerusalem as Aholah and Aholibah: [[Ezek. 23]].
  - Sodom in Genesis, and the Savior’s use of it against the towns that saw His works: [[Gen. 19:1–29]]; [[Matt. 11:20–24]].
  - Remembering and being ashamed after being gathered and cleansed, “not for your sakes”: [[Ezek. 36:22–32]].
  - Where much is given, much is required: [[D&C 82:3]].

