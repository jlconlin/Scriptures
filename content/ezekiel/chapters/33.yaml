chapter: 33
title: 'The Watchman, the Fugitive, and the Lovely Song'
tagline: 'The watchman’s charge is given a second time and the exiles are told to turn and live. Then a fugitive brings word that Jerusalem has fallen, Ezekiel’s mouth is opened, and he is given a word about the survivors in Judah and another about his own listeners.'
when: 'The chapter’s one date is in verse 21: the twelfth year of the captivity, the tenth month, the fifth day, counted like the book’s other dates from Jehoiachin’s captivity (1:2), about 585 B.C. Verses 1–20 stand before it and have no date of their own.'

setting: |
  The book turns here. Chapters 1–24 are prophecies of judgment on Jerusalem and chapters 25–32 are against Israel’s enemies; the “prophecies of restoration” begin with chapter 33. The judgment has happened. Jeremiah records that “in the eleventh year of Zedekiah, in the fourth month, the ninth day of the month, the city was broken up” ([[Jer. 39:2]]), and the destruction followed in the fifth month.

  The date comes in the middle of the chapter, when a survivor reaches the exiles in Babylonia. Verses 1–20 have been read as given on the evening before the man arrived, when the hand of the Lord was on Ezekiel (verse 22), and as set first “because it was a renewal of his call.” The text itself does not say when they were spoken.

  Most of that first half has been heard before. The watchman’s charge of verses 7–9 was given at Ezekiel’s call ([[Ezek. 3:17–21]]), and the teaching of verses 10–20 is that of [[Ezek. 18:20–32]]. What follows the news is new: a word about the people still living in Judah’s ruins (verses 23–29) and a word about Ezekiel’s own audience (verses 30–33).

thread: |
  Every scene in the chapter turns on the same thing: **what people do with a word once they have heard it.** In the parable the watchman answers for blowing the trumpet, and the man who hears it answers for himself (verses 2–6). The exiles have heard the judgment and concluded that nothing can be done; the Lord swears that He wants them to turn and live (verses 10–11). They hear that and call it “not equal” (verses 17, 20). Then the fugitive arrives and says, “The city is smitten” (verses 21–22).

  The last two scenes turn to those left in Judah and to Ezekiel’s own listeners. The people in the ruins of Judah reason from Abraham to a claim on the land and are answered with a list of what they do (verses 23–29). The exiles crowd in to listen, enjoy it, and “do them not” (verses 30–32).

  The chapter closes on a sentence from Ezekiel’s call. He was told then that, whether they heard or not, they “shall know that there hath been a prophet among them” ([[Ezek. 2:5]]). Verse 33 says it again, with the fall of the city now behind it: “then shall they know that a prophet hath been among them.”

sections:
  - range: 1-6
    heading: 'The watchman and the trumpet'
    plain: |
      The word of the Lord came to me again: “Son of man, say to your people: Suppose I bring the sword on a land, and the people of that land take one of their own men and set him as their watchman. If he sees the sword coming, blows the trumpet, and warns the people, then anyone who hears the trumpet and does not take warning, and is taken by the sword, has his blood on his own head. He heard the trumpet and did not take warning; his blood is on him. But whoever takes warning will deliver his soul. If the watchman sees the sword coming and does not blow the trumpet, and the people are not warned, and the sword takes any one of them, that person is taken away in his iniquity, but I will require his blood at the watchman’s hand.”
  - range: 7-9
    heading: 'Ezekiel is that watchman'
    plain: |
      “So you, son of man: I have set you as a watchman to the house of Israel. You will hear the word from my mouth and warn them from me. When I say to the wicked, ‘Wicked man, you will surely die,’ and you do not speak to warn him from his way, he will die in his iniquity, but I will require his blood at your hand. But if you warn the wicked to turn from his way and he does not turn, he will die in his iniquity, and you have delivered your soul.”
  - range: 10-11
    heading: 'How should we then live?'
    plain: |
      “Son of man, say to the house of Israel: This is what you are saying: ‘If our transgressions and our sins are upon us, and we pine away in them, how then can we live?’ Tell them: As I live, says the Lord God, I have no pleasure in the death of the wicked, but that the wicked turn from his way and live. Turn, turn from your evil ways! Why will you die, O house of Israel?”
  - range: 12-20
    heading: 'The righteous who sins and the wicked who turns'
    plain: |
      “Say to your people: The righteousness of the righteous will not deliver him in the day he transgresses, and the wicked will not fall by his wickedness in the day he turns from it; nor can the righteous live by his righteousness in the day he sins. When I tell the righteous that he will surely live, and he trusts in his own righteousness and commits iniquity, none of his righteous acts will be remembered; he will die for the iniquity he has committed. And when I tell the wicked, ‘You will surely die,’ and he turns from his sin and does what is lawful and right, gives back the pledge, returns what he robbed, and walks in the statutes of life without committing iniquity, he will surely live; he will not die. None of the sins he committed will be mentioned to him. He has done what is lawful and right; he will surely live.

      Yet your people say, ‘The way of the Lord is not equal.’ It is their own way that is not equal. When the righteous turns from his righteousness and commits iniquity, he will die for it. When the wicked turns from his wickedness and does what is lawful and right, he will live by it. Yet you say, ‘The way of the Lord is not equal.’ House of Israel, I will judge each of you by his ways.”
  - range: 21-22
    heading: 'The city is smitten'
    plain: |
      In the twelfth year of our captivity, in the tenth month, on the fifth day of the month, a man who had escaped from Jerusalem came to me and said, “The city is smitten.” The hand of the Lord had been upon me in the evening, before the man came, and had opened my mouth by the time he came to me in the morning. My mouth was opened, and I was no longer dumb.
  - range: 23-29
    heading: 'Those who live in the ruins'
    plain: |
      Then the word of the Lord came to me: “Son of man, those who live in the wastes of the land of Israel are saying, ‘Abraham was one, and he inherited the land. We are many; the land is given to us for an inheritance.’ So tell them: The Lord God says, You eat with the blood, you lift up your eyes to your idols, and you shed blood. And shall you possess the land? You stand upon your sword, you work abomination, and each of you defiles his neighbor’s wife. And shall you possess the land?

      Tell them: The Lord God says, As I live, those in the wastes will fall by the sword, the one in the open field I will give to the beasts to be devoured, and those in the forts and the caves will die of the pestilence. I will make the land most desolate. The pomp of her strength will cease, and the mountains of Israel will be so desolate that no one passes through. Then they will know that I am the Lord, when I have made the land most desolate because of all the abominations they have committed.”
  - range: 30-33
    heading: 'They hear, but they do not do'
    plain: |
      “As for you, son of man, your people are still talking against you by the walls and in the doors of the houses, saying to one another, each to his brother, ‘Come and hear what the word is that comes from the Lord.’ They come to you as people come, and sit before you as my people, and hear your words, but they will not do them. With their mouth they show much love, but their heart goes after their covetousness. To them you are like a very lovely song, sung by one with a pleasant voice who plays an instrument well. They hear your words and do not do them. When this comes to pass (and it will come), then they will know that a prophet has been among them.”

notes:
  - ref: 2
    phrase: 'set him for their watchman'
    kind: scripture
    title: 'The watchman’s charge, given a second time'
    body: |
      Verses 7–9 repeat the charge Ezekiel received at his call, and verses 2–6 put in front of it something the first giving did not have: a picture of an ordinary land and its lookout. At the call the Lord said only, “I have made thee a watchman unto the house of Israel” ([[Ezek. 3:17]]); the note there explains what a watchman was. Here the commission begins from the people’s side. A land under threat takes “a man of their coasts,” a man “from among them,” and posts him. Only then does the Lord say, “So thou.” Ezekiel is that man, with the difference verse 7 marks: the Lord, not the townspeople, set him there.

      Two more things are new. The first charge was spoken to Ezekiel about his own duty; this one he is told to “speak to the children of thy people.” And where chapter 3 followed the watchman through four cases (see the note on [[Ezek. 3:18]]), the parable spends two verses on the man who hears the trumpet and does nothing: “his blood shall be upon his own head.”

      Verses 7–9 then keep two of chapter 3’s four cases, the wicked man who is not warned and the wicked man who is. The righteous man who turns to sin is held for verses 12–20.
    sources: [lds-scriptures, esv]

  - ref: 3
    phrase: 'he blow the trumpet, and warn the people'
    kind: symbol
    title: 'The trumpet'
    body: |
      The watchman’s trumpet is the *shofar*, an animal’s horn, and its sound is an alarm of war.

      Jeremiah had used the same picture of Jerusalem before it fell, and had given the hearers’ reply: “Also I set watchmen over you, saying, Hearken to the sound of the trumpet. But they said, We will not hearken” ([[Jer. 6:17]]). The note there identifies the watchmen as the prophets.

      The parable says the same thing of the hearer as of the watchman. The one who takes warning “shall deliver his soul” (verse 5), and the watchman who gives it “hast delivered thy soul” (verse 9).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 10
    phrase: 'we pine away in them'
    kind: words
    title: 'Pining away: a word from the covenant warnings'
    body: |
      The exiles’ complaint uses a word from the warnings of the law. The verb means to “decay, rot, fester,” and in a figure to pine away; a modern translation has “we rot away because of them.” Its use for wasting away under punishment for iniquity is found in four verses. The first is the covenant warning that those left of Israel “shall pine away in their iniquity in your enemies’ lands” ([[Lev. 26:39]]). Ezekiel had used it twice of what was coming: the besieged would “consume away for their iniquity” ([[Ezek. 4:17]]), and when the temple fell the exiles would “pine away for your iniquities” ([[Ezek. 24:23]]). In verse 10 the people say it of themselves.

      Before the city fell, the saying among them was that the fathers had eaten sour grapes ([[Ezek. 18:2]]). Now they say “our transgressions and our sins,” and they say it in despair, without hope: “how should we then live?” The valley of bones has a like saying: “Our bones are dried, and our hope is lost” ([[Ezek. 37:11]]). Verse 11 answers the question.
    sources: [bdb, oshb-wlc, esv, nrsvue, scripture-helps-ezek, lds-scriptures]

  - ref: 11
    phrase: 'As I live, saith the Lord GOD'
    kind: scripture
    title: 'An oath that He does not want their death'
    body: |
      What chapter 18 put as a question the Lord now swears on His own life. There it was, “Have I any pleasure at all that the wicked should die?” ([[Ezek. 18:23]]; see the note there). Here it is an oath, “As I live,” followed by a plea with the verb doubled: “turn ye, turn ye.” The verb is the one explained in the note on [[Ezek. 18:30]], and it stands three times in this verse.

      The sentence accounts for the judgment just carried out as well as for the offer now made: God “takes no pleasure in sending these judgments, but the people leave him no choice.”

      The oath is sworn once more in the chapter. To those in the ruins of Judah the Lord says, “As I live, surely they that are in the wastes shall fall by the sword” (verse 27).
    sources: [lund-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 12
    phrase: 'in the day that he turneth from his wickedness'
    kind: scripture
    title: 'Judged in the day of turning'
    body: |
      Verses 12–20 give chapter 18’s ruling again: a person stands or falls by where he is now, not by what he was. Verse 12 says “in the day” three times: the day of the righteous man’s transgression, the day the wicked man turns, the day the righteous man sins. Chapter 18 states both halves at length; see the notes on [[Ezek. 18:24]] and on [[Ezek. 18:25]], the second for the complaint that “the way of the Lord is not equal,” which the people are still making in verses 17 and 20.

      Verse 13 says how the righteous man comes to fall: “if he trust to his own righteousness”; a modern translation has “if he trusts in his righteousness and does injustice.”

      The two cases are closed with one verb. Of the righteous man, “all his righteousnesses shall not be remembered” (verse 13). Of the wicked man who turns, none of his sins “shall be mentioned unto him” (verse 16), or in a modern translation, “None of the sins that he has committed shall be remembered against him.”
    sources: [scripture-helps-ezek, esv, oshb-wlc, lds-scriptures]

  - ref: 15
    phrase: 'restore the pledge, give again that he had robbed'
    kind: prophets
    title: 'Turning includes giving back'
    body: |
      Verse 15 says what the wicked man’s turning looks like in practice: he gives back what he holds that belongs to someone else. The pledge is security taken for a loan; the law told a lender who took his neighbor’s garment to “deliver it unto him by that the sun goeth down” ([[Ex. 22:26]]). The law also required one who had robbed to “restore that which he took violently away” and to add a fifth to it ([[Lev. 6:4–5]]). Zacchaeus went further: “if I have taken any thing from any man by false accusation, I restore him fourfold” ([[Luke 19:8]]).

      “Restore” in this verse is a form of the same Hebrew verb as “turn.”

      Elder Spencer W. Kimball cited this verse in teaching that restitution is part of repentance. One who has abandoned and confessed a sin “should next restore insofar as possible that which was damaged,” and “the true spirit of repentance demands this.”

      The commandments the man now walks in are called “the statutes of life.” The law says of its statutes, “which if a man do, he shall live in them” ([[Lev. 18:5]]), and Ezekiel has used the sentence already ([[Ezek. 20:11]]).
    sources: [ot-manual-27, esv, oshb-wlc, lds-scriptures]

  - ref: 21
    phrase: 'in the twelfth year of our captivity'
    kind: history
    title: 'How long the news took'
    body: |
      By the dates as they stand, word of Jerusalem’s fall reached the exiles about a year and a half after the city was taken. Ezekiel’s own count puts the fall in the eleventh year of the captivity: he calls the twenty-fifth year “the fourteenth year after that the city was smitten” ([[Ezek. 40:1]]). The fugitive arrives in the tenth month of the twelfth, “nearly a year and a half after it occurred.”

      Two explanations have been given. A few manuscripts and the old Syriac translation read “eleventh” for “twelfth,” which would bring the news in about six months, a time that has been judged more likely. The other keeps “twelfth” and points to the distance and to “the fearful confusion which followed the catastrophe.” The King James text follows the Hebrew as it stands, and nothing else in the chapter depends on which is right.

      “One that had escaped” is in Hebrew “the fugitive,” with the article: the man promised in [[Ezek. 24:26]].
    sources: [keil-ezekiel, clarke-commentary, ot-manual-27, oshb-wlc, lds-scriptures]

  - ref: 22
    phrase: 'my mouth was opened, and I was no more dumb'
    kind: scripture
    title: 'The silence ends'
    body: |
      The dumbness laid on Ezekiel at his call ends here, as promised, and it ends before the news arrives. The restraint and the promise of its end are explained in the notes on [[Ezek. 3:26]] and [[Ezek. 24:27]]. The hand of the Lord came on him in the evening, and “he had opened my mouth by the time the man came to me in the morning.” The words “simply affirm that the opening of the mouth took place before the arrival of the fugitive.”

      The release is not said to be a flood of speech. Being dumb no more “by no means involves immediate or continuous speaking, but simply recalls the command to be speechless.”

      On one reading, what changes is the work he is given. Until the city fell his task was “to show the people their sins, and to proclaim the consequent punishment.” Afterward “the object to be aimed at was to inspire those who were desponding and despairing of salvation with confidence and consolation.”
    sources: [keil-ezekiel, esv, lds-scriptures]

  - ref: 24
    phrase: 'Abraham was one, and he inherited the land'
    kind: history
    title: 'The claim of those left in the ruins'
    body: |
      The people still living in Judah argue from Abraham that the land is now theirs: if one man was given it, how much more the many. They are “the people who remained behind in the land of Judah after the destruction of Jerusalem.” Jeremiah says the Babylonian captain “left of the poor of the people, which had nothing, in the land of Judah, and gave them vineyards and fields at the same time” ([[Jer. 39:10]]).

      The argument takes for granted that the many are Abraham’s heirs because they are his children. It rests “upon their corporeal descent from Abraham,” and it has been compared to the confidence John the Baptist met: “think not to say within yourselves, We have Abraham to our father” ([[Matt. 3:9]]).

      The claim is older than the ruins. Before the city fell, its people said of the exiles, “unto us is this land given in possession” ([[Ezek. 11:15]]).

      Isaiah has the same fact about Abraham from the Lord’s own mouth: “I called him alone, and blessed him, and increased him” ([[Isa. 51:2]]). “Alone” there and “one” here are the same Hebrew word; see the note on [[Isa. 51:2]] for the use Isaiah makes of it. The Lord’s answer in verses 25–26 does not take up numbers. It lists what these people do and asks twice, “and shall ye possess the land?”
    sources: [keil-ezekiel, esv, oshb-wlc, lds-scriptures]

  - ref: 25
    phrase: 'Ye eat with the blood'
    kind: words
    title: 'The six charges and the sentence'
    body: |
      The Lord answers the claim to the land with six charges. “Ye eat with the blood” is, in modern translations, “You eat flesh with the blood.” The law forbade it to Israel: “Ye shall not eat any thing with the blood” ([[Lev. 19:26]]). It had been forbidden to Noah before that (see the note on [[Gen. 9:4]]). Then come lifting the eyes to idols and shedding blood. “Ye stand upon your sword” is to “resort to violence”; modern translations have “You rely on the sword” and “You depend on your swords.” The last two are abomination and adultery.

      The sentence in verse 27 names them by where they are: those in the wastes fall by the sword, those in the open field go to the beasts, and those in forts and caves die of pestilence. Sword, beasts, and pestilence are three of the “four sore judgments” that Ezekiel had named against Jerusalem ([[Ezek. 14:21]]).
    sources: [esv, nrsvue, lds-scriptures]

  - ref: 30
    phrase: 'still are talking against thee'
    kind: words
    title: 'Talking against him, or about him'
    body: |
      After the news Ezekiel is the talk of the settlement, and the talk need not be hostile. The Hebrew verb is in a reciprocal form, to “speak with one another, talk.” With the preposition used here it can mean “against,” as the King James translators took it; modern translations have “your people who talk together about you by the walls.” What they say to one another is an invitation: “Come, I pray you, and hear what is the word that cometh forth from the LORD.”

      People had come to him before. The elders “sat before me” ([[Ezek. 8:1]]; so also [[Ezek. 14:1]] and [[Ezek. 20:1]]). Now it is “the children of thy people,” coming “as the people cometh” and sitting “as my people.” Verse 31 says what is missing.
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 32
    phrase: 'a very lovely song of one that hath a pleasant voice'
    kind: symbol
    title: 'The prophet as a lovely song'
    body: |
      The exiles listen to Ezekiel as an audience listens to a good singer: they enjoy it, and they do nothing about it. The word behind “very lovely” means “(sensuous) love,” so that the phrase is “a love-song”; in this book it is found only in these two verses. Translations differ over how strong it is: “a singer of love songs” in one, “one who sings lustful songs with a beautiful voice” in another. It has also been explained more mildly, as “pleasant things,” what is to the hearers’ taste.

      The same word stands in verse 31, where the King James Version has “with their mouth they shew much love.” The old Greek translation has a different word there, “for there is falsehood in their mouth,” and one modern translation marks the Hebrew as uncertain. On any of these the verse sets mouth against heart: “their heart goeth after their covetousness.” Joseph Smith was told of the churches of his day, “they draw near to me with their lips, but their hearts are far from me” ([[JS—H 1:19]]).

      The refrain is “they hear thy words, but they do them not,” in verse 31 and again in verse 32. The Savior ends the Sermon on the Mount on that distinction: “every one that heareth these sayings of mine, and doeth them not, shall be likened unto a foolish man” ([[Matt. 7:26]]).

      Verse 33 says how the matter will be settled: “when this cometh to pass.” “This” has been explained as what Ezekiel prophesies, which “will come as surely as thy prophecies concerning the destruction of Jerusalem.” Then the people will know what the Lord said at Ezekiel’s call that they would know ([[Ezek. 2:5]]).
    sources: [bdb, oshb-wlc, keil-ezekiel, lxx-rahlfs, esv, nrsvue, lds-scriptures]

christ: |
  The Lord who swears “As I live” in verse 11 is the one the note on [[Ezek. 1:26]] identifies. What He swears to Ezekiel He also said to Alma about members of the church who had sinned: “as often as my people repent will I forgive them their trespasses against me” ([[Mosiah 26:30]]). A few verses earlier the speaker says who He is: “it is I that taketh upon me the sins of the world” ([[Mosiah 26:23]]).

  Nephi’s words about the Lord have been set beside verse 11 as well: “he loveth the world, even that he layeth down his own life that he may draw all men unto him. Wherefore, he commandeth none that they shall not partake of his salvation” ([[2 Ne. 26:24]]). Elder D. Todd Christofferson said of this verse that the Father and the Savior, far from wishing to condemn, “plead with us to repent.”

explore: |
  - The first giving of the watchman’s charge: [[Ezek. 3:16–21]].
  - The fuller form of verses 10–20, spoken before the city fell: [[Ezek. 18:20–32]].
  - The covenant warning whose word the exiles now use of themselves: [[Lev. 26:39]].
  - The fall of the city as Jeremiah tells it, and the people left in the land: [[Jer. 39:1–10]].
  - The earlier claim that the land belonged to those still in it: [[Ezek. 11:14–16]].
  - Hearing and doing at the end of the Sermon on the Mount: [[Matt. 7:24–27]].
  - What Ezekiel says next, with his mouth opened: [[Ezek. 34:1–16]].

