chapter: 19
title: 'A Lamentation for the Princes of Israel'
tagline: 'Ezekiel is told to sing a funeral song over the kings of Judah. Their mother is a lioness whose young are hunted and caged, and then a vine torn up, burned from its own branch, and left without a sceptre.'
when: 'No date of its own. The chapter stands under the heading of “the sixth year, in the sixth month” (8:1) of Jehoiachin’s captivity, about 591 B.C., and before the next date in the book, the seventh year (20:1).'

setting: |
  The chapter has no date of its own. It falls between “the sixth year, in the sixth month” ([[Ezek. 8:1]]) and the seventh year ([[Ezek. 20:1]]). In Jerusalem Zedekiah is still king, and the siege will not begin until the ninth year ([[Ezek. 24:1]]).

  Four kings followed Josiah, and the lament has their story behind it ([[2 Kgs. 23:30–34]]; [[2 Kgs. 24:6–18]]). Jehoahaz reigned three months and was taken to Egypt. Jehoiakim, set up by Pharaoh, reigned eleven years. His son Jehoiachin reigned three months and was taken to Babylon with the exiles Ezekiel lives among. Zedekiah, Jehoiachin’s uncle and the last king of Judah, was put on the throne by Nebuchadnezzar.

  The chapter “forms a finale to the preceding prophecies of the overthrow of Judah.” Chapter 17 told the story of these kings as a riddle of two eagles and a vine and then explained it. This chapter tells it as a funeral song and explains nothing. It is the first lamentation Ezekiel is told to take up; later ones are raised over Tyre, the king of Tyre, and Pharaoh ([[Ezek. 26:17]]; [[Ezek. 27:2]]; [[Ezek. 28:12]]; [[Ezek. 32:2]]).

thread: |
  One mother is described twice, first as a lioness and then as a vine, and both pictures end in the same place. The lioness raises a young lion; he learns to catch prey; the nations trap him and carry him off. She raises another, and the same thing happens. The vine grows tall by the water and puts out rods strong enough for sceptres; it is torn up, dried by the east wind, and replanted in a desert, and the fire that finishes it comes from one of its own rods.

  The song moves from the kings to the kingdom, and from what had already happened to what had not. Jehoahaz is long gone when Ezekiel sings, and Jehoiachin is a captive in Babylon.

  The song has no “Thus saith the Lord GOD,” no name of God anywhere in it, and no “ye shall know that I am the LORD.” It gives no explanation and no promise. Its last word on the house of David is that no rod is left “to be a sceptre to rule.” What the Lord says about that sceptre comes in other chapters.

sections:
  - range: 1-4
    heading: 'The lioness and her first whelp'
    plain: |
      Ezekiel is told to take up a lamentation for the princes of Israel and say: What is your mother? A lioness. She lay down among lions and raised her whelps among young lions. She brought up one of her whelps, and he became a young lion. He learned to catch prey, and he devoured men. The nations heard of him. He was taken in their pit, and they brought him in chains to the land of Egypt.
  - range: 5-9
    heading: 'The second whelp'
    plain: |
      When she saw that she had waited and her hope was lost, she took another of her whelps and made him a young lion. He went up and down among the lions, became a young lion, learned to catch prey, and devoured men. He knew their desolate palaces and laid waste their cities, and the land and all that filled it were desolate at the noise of his roaring. Then the nations set themselves against him on every side from the provinces and spread their net over him, and he was taken in their pit. They put him in ward in chains and brought him to the king of Babylon. They brought him into holds, so that his voice would no more be heard on the mountains of Israel.
  - range: 10-14
    heading: 'The vine and its rods'
    plain: |
      Your mother is like a vine in your blood, planted by the waters, fruitful and full of branches because of the many waters. She had strong rods for the sceptres of those who ruled, and she stood tall among the thick branches, seen in her height with her many branches. But she was plucked up in fury and cast down to the ground. The east wind dried up her fruit; her strong rods were broken and withered, and the fire consumed them. Now she is planted in the wilderness, in a dry and thirsty ground. Fire has gone out of a rod of her branches and devoured her fruit, so that she has no strong rod to be a sceptre to rule. This is a lamentation, and it shall be for a lamentation.

notes:
  - ref: 1
    phrase: 'take thou up a lamentation'
    kind: words
    title: 'A funeral song for a royal house'
    body: |
      A lamentation (Hebrew *qinah*) is an elegy or dirge, and Ezekiel is told to raise one over the kings of Judah while one of them is still on the throne. It is the word for what David sang “over Saul and over Jonathan his son” ([[2 Sam. 1:17]]). The poetry has a recognized shape as well: these lines are counted with those of the book of Lamentations as lines of five beats, most often three and then two.

      Lament was in Ezekiel’s commission from the start. The roll he was given to eat had written in it “lamentations, and mourning, and woe” ([[Ezek. 2:10]]).

      The closing line, “This is a lamentation, and shall be for a lamentation,” is translated in more than one way. The King James future has the song still to be sung. Other translations put the clause in the past or present: it “has become a lamentation,” or “is used as a lamentation.” On either reading the song was given before Jerusalem fell: the siege does not begin until the ninth year ([[Ezek. 24:1]]).
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 2
    phrase: 'What is thy mother? A lioness'
    kind: symbol
    title: 'The lioness and Jacob’s blessing on Judah'
    body: |
      The lioness is Judah, the tribe “of which the royal house came,” and the picture recalls Jacob’s blessing on Judah ([[Gen. 49:8–12]]). The link is in the Hebrew as well as the English. Jacob had said, “Judah is a lion’s whelp: from the prey, my son, thou art gone up: he stooped down, he couched as a lion” ([[Gen. 49:9]]). The words for whelp and prey and the verb for the lion lying down all come back in verses 2 and 3 of the lament.

      The mother has also been read more narrowly, as a queen. Two of the kings in question, Jehoahaz and Zedekiah, had the same mother, “Hamutal, the daughter of Jeremiah of Libnah” ([[2 Kgs. 23:31]]; [[2 Kgs. 24:18]]), and one explanation allows that the lioness, “if not the doomed country,” is Hamutal herself.
    sources: [lds-scriptures, oshb-wlc, ot-manual-26]

  - ref: 4
    phrase: 'they brought him with chains unto the land of Egypt'
    kind: history
    title: 'The first young lion: Jehoahaz'
    body: |
      The first young lion is Jehoahaz, the son of Josiah who was carried to Egypt. When Josiah was killed, “the people of the land took Jehoahaz the son of Josiah, and anointed him, and made him king in his father’s stead” ([[2 Kgs. 23:30]]). He was twenty-three and reigned three months, of which Kings says only that “he did that which was evil in the sight of the LORD” ([[2 Kgs. 23:32]]). Then “Pharaoh-nechoh put him in bands at Riblah in the land of Hamath, that he might not reign in Jerusalem” ([[2 Kgs. 23:33]]), and “he came to Egypt, and died there” ([[2 Kgs. 23:34]]).

      Verse 5 has the mother waiting until “her hope was lost.” Jeremiah, in Jerusalem, told the people not to expect this king back: “Weep ye not for the dead, neither bemoan him: but weep sore for him that goeth away: for he shall return no more, nor see his native country” ([[Jer. 22:10]]). He calls him Shallum, another name for Jehoahaz ([[Jer. 22:11]]).
    sources: [lds-scriptures, esv, bd-shallum]

  - ref: 5
    phrase: 'then she took another of her whelps'
    kind: history
    title: 'The second young lion: three kings have been named'
    body: |
      The second young lion is not named, and each of the three kings who followed Jehoahaz has been proposed. What the lament says of him is that the nations came against him “on every side from the provinces,” that he was brought “to the king of Babylon,” and that he was shut away so that his voice was heard no more in Israel.

      **Jehoiakim.** Jeremiah indicts him as a king whose heart was set on gain and “to shed innocent blood” ([[Jer. 22:17]]). Bands of Chaldees, Syrians, Moabites, and Ammonites were sent against him ([[2 Kgs. 24:2]]). Nebuchadnezzar “bound him in fetters, to carry him to Babylon” ([[2 Chr. 36:6]]). The difficulty is that Kings has him die as king, “So Jehoiakim slept with his fathers” ([[2 Kgs. 24:6]]), and he has been judged a less suitable example “because he died in Jerusalem.”

      **Zedekiah.** He was Hamutal’s “second son,” so that “another of her whelps” would be meant literally, and his end fits verse 9: the king of Babylon “put him in prison till the day of his death” ([[Jer. 52:11]]). Zedekiah, though, was still reigning when the lament was given; his carrying away was “still in the future at the time when these words were uttered.”

      **Jehoiachin** has also been proposed. Jehoiakim’s son reigned three months, “went out to the king of Babylon” ([[2 Kgs. 24:12]]), and was carried there, and he is the king by whose captivity Ezekiel dates his book ([[Ezek. 1:2]]).

      The text does not settle it.
    sources: [lds-scriptures, ot-manual-26, keil-ezekiel]

  - ref: 7
    phrase: 'he knew their desolate palaces'
    kind: words
    title: 'Palaces, or widows?'
    body: |
      The Hebrew of this clause says that he knew “his widows,” and the King James “desolate palaces” is one way of making sense of it. The noun in the text is the ordinary word for a widow (*almanah*), which resembles the word for a palace or citadel (*armon*), and the two have been connected at this verse.

      Translations divide accordingly. One translation keeps the widows and changes the verb, with a note that the Hebrew is “knew”: he “seized their widows.” Another takes the buildings and a different verb, “he ravaged their strongholds,” and notes that the Hebrew has “his widows.” The ancient Greek translation has neither: “he prowled in his boldness.”

      What the line means exactly is therefore uncertain. The rest of the verse is not: “he laid waste their cities; and the land was desolate.”
    sources: [esv, nrsvue, bdb, lxx-rahlfs]

  - ref: 9
    phrase: 'they put him in ward in chains'
    kind: words
    title: 'Hooks and a cage'
    body: |
      The capture is told as a lion hunt from beginning to end, with a pit, a net, hooks, and a cage. “Chains,” here and in verse 4, is a word for a hook or ring, used of the ring put through a captive’s nose; it is the word in the Lord’s threat to Sennacherib, “therefore will I put my hook in thy nose” ([[Isa. 37:29]]). “Ward” is a cage, and a modern translation has it so: “they put him in a cage.”

      The verse gives the reason for the cage: “that his voice should no more be heard upon the mountains of Israel.” “Voice” is the Hebrew word translated “noise” in verse 7, the roaring that left the land desolate, and the cage is there to end it.

      After the city fell, the book of Lamentations used the same picture of the king: “The breath of our nostrils, the anointed of the LORD, was taken in their pits” ([[Lam. 4:20]]).
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 10
    phrase: 'in thy blood'
    kind: words
    title: 'A phrase the text has probably lost'
    body: |
      “In thy blood” is what the Hebrew letters say, but the text is “probably” damaged here, and the phrase has been handled in several ways. One rendering of the Hebrew is “in thy likeness.” Two modern translations read “like a vine in a vineyard,” one noting that it follows some Hebrew manuscripts while most have “in your blood.” The ancient Greek translation has something else again: the mother is a vine “and as a blossom on a pomegranate tree.”

      None of the image depends on the phrase. However it is read, the mother is a vine planted by water, “fruitful and full of branches by reason of many waters,” and the lament’s concern is what became of it.
    sources: [lds-scriptures, bdb, esv, nrsvue, lxx-rahlfs]

  - ref: 12
    phrase: 'the east wind dried up her fruit'
    kind: symbol
    title: 'The vine of chapter 17, now uprooted'
    body: |
      The vine, the waters, and the east wind are the figures of chapter 17, where the Lord Himself supplies the key. There a vine is “planted in a good soil by great waters” ([[Ezek. 17:8]]), and the Lord asks, “shall it not utterly wither, when the east wind toucheth it?” ([[Ezek. 17:10]]). The explanation follows at once: “the king of Babylon is come to Jerusalem, and hath taken the king thereof” ([[Ezek. 17:12]]), and the vine is what he left planted there under oath, one “of the king’s seed” ([[Ezek. 17:13]]). Chapter 17 asked whether its vine would wither. In chapter 19 the vine is “plucked up in fury.”

      Verse 13 brings the song to Ezekiel’s own present: “And now she is planted in the wilderness, in a dry and thirsty ground.” The dry land has been read as Babylon, “a barren soil in which the kingdom of God could not flourish.” The uprooting “had already commenced with the carrying away of Jeconiah,” which is another name for Jehoiachin, and it would be complete only when Jerusalem fell. From verse 12 on, then, the song mixes what its first hearers had lived through with what was still to come.
    sources: [lds-scriptures, keil-ezekiel, bd-jehoiachin]

  - ref: 14
    phrase: 'fire is gone out of a rod of her branches'
    kind: history
    title: 'The fire comes from the vine’s own branch'
    body: |
      The fire that finishes the vine comes from one of its own ruling rods, and it has been read as Zedekiah, whose “breach of covenant” with Babylon “led to the overthrow of the kingdom.” Chapter 17 told of the oath he broke: “he rebelled against him in sending his ambassadors into Egypt” ([[Ezek. 17:15]]). Kings records it in a clause: “Zedekiah rebelled against the king of Babylon” ([[2 Kgs. 24:20]]).

      Kings also tells the end. His captors “slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon” ([[2 Kgs. 25:7]]).
    sources: [lds-scriptures, keil-ezekiel]

christ: |
  The lament’s last image is a sceptre that is missing: the vine “hath no strong rod to be a sceptre to rule.” The Hebrew word for “sceptre” there is the word in Jacob’s promise, “The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come” ([[Gen. 49:10]]), in the blessing the lament recalls from its first line. Shiloh there is Christ.

  The song itself does not say how the promise and the empty throne fit together. Two chapters later the Lord says of the crown, “I will overturn, overturn, overturn, it: and it shall be no more, until he come whose right it is; and I will give it him” ([[Ezek. 21:27]]), which points back to Jacob’s promise. The king is deposed until the One comes who has the right to reign, Jesus Christ.

explore: |
  - Jacob’s blessing on Judah, with the lion, the sceptre, and the vine: [[Gen. 49:8–12]].
  - The last four kings of Judah in order: [[2 Kgs. 23:30–37]], [[2 Kgs. 24]], and [[2 Kgs. 25:1–7]].
  - Jeremiah’s words in Jerusalem about the same kings: [[Jer. 22:10–19]].
  - The riddle of the eagles and the vine, with its explanation: [[Ezek. 17]].
  - The crown removed “until he come whose right it is”: [[Ezek. 21:25–27]].
  - The later laments of the book, over Tyre and over Pharaoh: [[Ezek. 27]] and [[Ezek. 32:1–16]].

