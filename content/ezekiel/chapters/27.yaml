chapter: 27
title: 'A Ship in the Midst of the Seas'
tagline: 'Ezekiel is told to sing a funeral song for Tyre while the city still stands. He pictures it as a splendid merchant ship, built, manned, and loaded by the nations, and then broken by the east wind while the seamen wail on the shore.'
when: 'No date of its own. The chapter stands under the heading of 26:1, “the eleventh year, in the first day of the month” (about 586 B.C.; the month is not given). The next date in the book, at 29:1, is the tenth year: the dates in chapters 25–32 are not in order.'

setting: |
  Chapters 25–32 of Ezekiel’s book are its prophecies against Israel’s enemies, and three of them, 26–28, are about one city: Tyre (the King James “Tyrus” in these chapters), the Phoenician seaport introduced in [[Ezek. 26]]. The Phoenicians were traders who carried the goods of Egypt and Babylon to stations all around the Mediterranean, and that trade is this chapter’s subject.

  The three chapters stand under one date, “the eleventh year, in the first day of the month” ([[Ezek. 26:1]]). In the eleventh year of Zedekiah “the city was broken up” ([[Jer. 39:2]]), and chapter 26 opens with Tyre’s answer to the news about Jerusalem: “I shall be replenished, now she is laid waste” ([[Ezek. 26:2]]).

  Chapter 26 announces the judgment and names the king who will carry it out. Chapter 28 turns to Tyre’s ruler. This chapter, between them, is a lamentation, a funeral song (see the note on [[Ezek. 19:1]]), and it is sung in advance. In the latest dated word in the book, from “the seven and twentieth year” ([[Ezek. 29:17]]), the Lord speaks of the “great service” that Nebuchadrezzar’s army had served against Tyrus ([[Ezek. 29:18]]).

  Isaiah had pronounced a burden on the same city ([[Isa. 23]]).

thread: |
  The chapter spends more than twenty verses building Tyre up and breaks her in one. It moves in three parts: “a picture of the glory of the city of Tyre, its situation, its architectural beauty, its military strength and defences,” then “its wide-spread commercial relations,” and then “mournful lamentation over the ruin of all this glory.”

  The name “the Lord GOD” comes once, in verse 3, and what follows it is Tyre’s own sentence: “I am of perfect beauty.” The lament then describes the timber, the crew, the garrison, and a long roll of trading partners, and then a single verse brings the wind.

  The last part belongs to the onlookers. Seamen wail on the shore and sing a dirge of their own inside Ezekiel’s, kings are afraid, and merchants hiss. The last line is nearly the one that closes each of the three chapters on Tyre: “thou shalt be a terror, and never shalt be any more.”

sections:
  - range: 1-3
    heading: 'A lamentation for Tyrus'
    plain: |
      The word of the Lord comes to Ezekiel again: Son of man, take up a lamentation for Tyrus. Say to Tyrus, who sits at the entry of the sea and is a merchant of the people for many isles: The Lord God says, O Tyrus, you have said, I am of perfect beauty.
  - range: 4-9
    heading: 'The ship and her crew'
    plain: |
      Your borders are in the midst of the seas, and your builders have perfected your beauty. They made all your ship boards of fir trees from Senir and took cedars from Lebanon to make masts for you. They made your oars of the oaks of Bashan. The company of the Ashurites made your benches of ivory, brought from the isles of Chittim. Fine linen with broidered work from Egypt was what you spread out as your sail, and blue and purple from the isles of Elishah covered you. The people of Zidon and Arvad were your mariners, and your own wise men, O Tyrus, were your pilots. The elders of Gebal and its wise men were in you as your calkers. All the ships of the sea and their mariners were in you to trade in your merchandise.
  - range: 10-11
    heading: 'The army on her walls'
    plain: |
      Men of Persia, Lud, and Phut were in your army as your men of war. They hung shield and helmet in you and set forth your comeliness. The men of Arvad with your army were on your walls all around, and the Gammadims were in your towers. They hung their shields on your walls all around. They made your beauty perfect.
  - range: 12-25
    heading: 'The merchants of the world'
    plain: |
      Tarshish was your merchant because of the multitude of every kind of riches, and traded in your fairs with silver, iron, tin, and lead. Javan, Tubal, and Meshech were your merchants; they traded the persons of men and vessels of brass in your market. The house of Togarmah traded in your fairs with horses, horsemen, and mules. The men of Dedan were your merchants, and many isles were the merchandise of your hand; they brought you horns of ivory and ebony as a present. Syria was your merchant because of the many wares of your making, and traded in your fairs with emeralds, purple, broidered work, fine linen, coral, and agate. Judah and the land of Israel were your merchants; they traded in your market wheat of Minnith, Pannag, honey, oil, and balm. Damascus was your merchant for the many wares of your making and for the multitude of all riches, in the wine of Helbon and white wool. Dan also and Javan, going to and fro, traded in your fairs; bright iron, cassia, and calamus were in your market. Dedan was your merchant in precious clothes for chariots. Arabia and all the princes of Kedar traded with you in lambs, rams, and goats. The merchants of Sheba and Raamah traded in your fairs with the chief of all spices, with all precious stones, and with gold. Haran, Canneh, and Eden, the merchants of Sheba, Asshur, and Chilmad were your merchants. These were your merchants in all sorts of things: blue clothes, broidered work, and chests of rich apparel, bound with cords and made of cedar. The ships of Tarshish sang of you in your market, and you were replenished and made very glorious in the midst of the seas.
  - range: 26-31
    heading: 'The east wind'
    plain: |
      Your rowers have brought you into great waters, and the east wind has broken you in the midst of the seas. Your riches, your fairs, your merchandise, your mariners and pilots, your calkers, those who trade in your merchandise, and all your men of war, with all the company in the midst of you, will fall into the midst of the seas in the day of your ruin. The suburbs will shake at the sound of the cry of your pilots. All who handle the oar, the mariners and all the pilots of the sea, will come down from their ships and stand on the land. They will make their voice heard against you and cry bitterly. They will cast dust on their heads and wallow in the ashes. They will make themselves utterly bald for you, gird themselves with sackcloth, and weep for you with bitterness of heart and bitter wailing.
  - range: 32-36
    heading: 'The seamen’s dirge'
    plain: |
      In their wailing they will take up a lamentation for you and lament over you: What city is like Tyrus, like the destroyed in the midst of the sea? When your wares went out from the seas, you filled many people. You enriched the kings of the earth with the multitude of your riches and your merchandise. In the time when you are broken by the seas in the depths of the waters, your merchandise and all your company in the midst of you will fall. All the inhabitants of the isles will be astonished at you; their kings will be sore afraid and troubled in their countenance. The merchants among the people will hiss at you. You will be a terror, and you will never be any more.

notes:
  - ref: 2
    phrase: 'take up a lamentation for Tyrus'
    kind: words
    title: 'A funeral song for a city still standing'
    body: |
      A lamentation is a funeral song (Hebrew *qinah*; see the note on [[Ezek. 19:1]]), and this one is raised over a city that has not yet fallen. In the chapter before, the judgment is still to come: “I will bring upon Tyrus Nebuchadrezzar king of Babylon” ([[Ezek. 26:7]]).

      It is the second of three such songs over Tyre, and all three use the same Hebrew noun. In the first, the “princes of the sea” come down from their thrones and “take up a lamentation” for the city ([[Ezek. 26:16–17]]). The third is “a lamentation upon the king of Tyrus” ([[Ezek. 28:12]]).

      This chapter has two singers. Ezekiel is told to sing, and inside his song the seamen who watch the wreck sing theirs: “they shall take up a lamentation for thee, and lament over thee” (verse 32), where the noun is *qinah* again. A modern translation carries the seamen’s words from there to the end of the chapter.
    sources: [lds-scriptures, oshb-wlc, nrsvue]

  - ref: 3
    phrase: 'I am of perfect beauty'
    kind: scripture
    title: 'A phrase that belonged to Jerusalem'
    body: |
      “Perfect beauty” is what Jerusalem had been called, and here Tyre says it of herself. The Hebrew is *kelilat yofi*, “entire, perfect in beauty,” and the same two words stand in Lamentations, where those who pass the ruined city ask, “Is this the city that men call The perfection of beauty, The joy of the whole earth?” ([[Lam. 2:15]]). Ezekiel had used the word of Jerusalem too, and had said where her beauty came from: “it was perfect through my comeliness, which I had put upon thee, saith the Lord GOD” ([[Ezek. 16:14]]).

      The verses that follow come back to the words twice: “thy builders have perfected thy beauty” (verse 4), and, of her soldiers, “they have made thy beauty perfect” (verse 11). The Hebrew verb is the same in both lines, and a modern translation renders both alike, “made perfect your beauty.” The ancient Greek translation has the boast as “I have clothed myself with my beauty.”

      The next chapter makes the boast a charge against Tyre’s king, who is also called “perfect in beauty” ([[Ezek. 28:12]]): “Thine heart was lifted up because of thy beauty” ([[Ezek. 28:17]]).
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 5
    phrase: 'They have made all thy ship boards of fir trees of Senir'
    kind: symbol
    title: 'The city as a ship'
    body: |
      From verse 4 on, Tyre “is depicted allegorically as a beautiful ship, splendidly built and equipped throughout,” so that her fall can be told as a shipwreck. The comparison “was very naturally suggested by the situation of the city in the midst of the sea”: Tyre lay in a “seagirt position, separated by a strait of half a mile from the mainland.” The King James “in the midst of the seas” is, word for word, “in the heart of the seas,” and the phrase comes back at verses 25, 26, and 27.

      Everything in the ship is the best, and all of it comes from somewhere else. The planks are from Senir, “the Amorite name of Hermon.” The mast is cedar of Lebanon, the oars are oak of Bashan, and the sail is Egyptian linen. The deck is from “the isles of Chittim,” and Chittim is the island “now called Cyprus.” The crew is as mixed as the timber. The rowers are from Arvad and from Zidon, once the chief city of Phoenicia. The men who stop the leaks are elders of Gebal. Only the pilots are Tyre’s own (verse 8).

      The trade list of verses 12–25 follows, and its last verse comes back to the ship (see the note on [[Ezek. 27:25]]).
    sources: [keil-ezekiel, jfb-ezekiel, bd-chittim, bd-zidon, nrsvue, esv, oshb-wlc]

  - ref: 6
    phrase: 'the company of the Ashurites have made thy benches of ivory'
    kind: words
    title: 'Boxwood, not Ashurites'
    body: |
      No people called Ashurites built this deck; the line is about wood. As the Hebrew text is divided, there are two words here, which the King James translators took as a company of people. Read as one word, the same letters mean “with box-wood,” the box-tree being “a small evergreen tree about 20 feet high, growing on Lebanon.” A modern translation likewise reads a wood and not a people, “they made your deck of pines from the coasts of Cyprus, inlaid with ivory,” and gives “boxwood” in its margin.

      Which tree is meant is not certain; a kind of cedar has also been proposed. Either way the sense is a deck of fine imported wood set with ivory, one more costly thing in a ship built of them.
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 11
    phrase: 'the Gammadims were in thy towers'
    kind: words
    title: 'Who the Gammadims were'
    body: |
      The word occurs nowhere else, and it is not known whether it names a people or describes the soldiers. It has been explained as “valorous men,” against which stands the judgment, “but proper name apparently needed.” A modern translation makes it a place, “men of Gamad were in your towers,” and the ancient Greek translators wrote only, “there were guards in thy towers.”
    sources: [bdb, esv, lxx-rahlfs]

  - ref: 12
    phrase: 'Tarshish was thy merchant'
    kind: history
    title: 'The trade list, from Tarshish to Tarshish'
    body: |
      Verses 12–25 list Tyre’s trading partners and their goods, and the list begins and ends with Tarshish. Tarshish was “probably Tartessus in Spain,” and “ships of Tarshish” (verse 25) came to mean “ships of the largest size, suitable for long voyages.” The list “commences with Tarshish (Tartessus) in the extreme west, then turns to the north, passes through the different lands of Anterior Asia and the Mediterranean to the remotest north-east, and ends by mentioning Tarshish again.” It is a sweep of the known world more than a route: the order is not strictly geographical.

      Many of the names come from the table of nations in Genesis. Javan, Tubal, and Meshech are sons of Japheth ([[Gen. 10:2]]), Javan being the name for the Greeks, and Elishah and Tarshish are sons of Javan ([[Gen. 10:4]]). Togarmah, Dedan, Sheba, and Raamah are in the same chapter ([[Gen. 10:3]]; [[Gen. 10:7]]). Tubal, Meshech, and Togarmah will return later in the book, in the army of Gog ([[Ezek. 38:2–6]]). “Syria” in verse 16 is Aram in the Hebrew, and one modern translation follows other manuscripts and reads Edom.

      The vocabulary is a merchant’s, and some of it is found nowhere else. The word translated “fairs” means “wares,” and it is used “only Ezekiel 27.” The word behind “merchandise” means “articles of exchange,” and it too is used “only of Tyre.” “Occupy” and “occupied” (verses 9, 16, 19, 21, 22) are older English for trade.

      What the long list is for appears at verse 27, where the goods and the people named in it “fall with the ship into the heart of the sea” (see the note on [[Ezek. 27:26]]).
    sources: [bd-tarshish, keil-ezekiel, bd-javan, bdb, nrsvue, lds-scriptures]

  - ref: 13
    phrase: 'they traded the persons of men'
    kind: history
    title: 'Slaves among the wares'
    body: |
      “The persons of men” are slaves: human beings stand in the list of goods, beside vessels of brass. The Hebrew is *nephesh adam*, and a modern translation has, “they exchanged human beings and vessels of bronze for your merchandise.” The traders named are Javan (the Greeks), Tubal, and Meshech.

      The Greeks were buyers as well as sellers, and other prophets charge Tyre itself with handing people over. Joel says to Tyre and Zidon, “The children also of Judah and the children of Jerusalem have ye sold unto the Grecians” ([[Joel 3:6]]). Amos condemns Tyre “because they delivered up the whole captivity to Edom, and remembered not the brotherly covenant” ([[Amos 1:9]]).

      Ezekiel’s lament passes over the item without comment; it sits in the list like any other. John’s list of the merchandise of Babylon has the same item, and puts it last: “slaves, and souls of men” ([[Rev. 18:13]]), words that refer “primarily to the abominable practice of human trafficking.”
    sources: [oshb-wlc, esv, keil-ezekiel, nrsvue, bd-tyre, bd-javan, nt-student-manual-56, lds-scriptures]

  - ref: 17
    phrase: 'Judah, and the land of Israel, they were thy merchants'
    kind: history
    title: 'What Judah sold to Tyre'
    body: |
      Judah and Israel are in Tyre’s list as suppliers of the land’s produce: wheat, honey, oil, and balm. The arrangement was old. In return for timber, “Solomon gave Hiram twenty thousand measures of wheat for food to his household, and twenty measures of pure oil” ([[1 Kgs. 5:11]]). It was still so in the days of the apostles, when the people of Tyre and Sidon wanted peace with Herod “because their country was nourished by the king’s country” ([[Acts 12:20]]).

      Two of the words are obscure. Minnith is a place named once elsewhere, in the account of Jephthah’s war with Ammon ([[Judg. 11:33]]). “Pannag” stands untranslated in the King James; it is an “unknown word, apparently some kind of food.” Modern translations offer “meal” or “millet,” one of them adding, “The meaning of the Hebrew word is uncertain.”
    sources: [bdb, esv, nrsvue, bd-tyre, lds-scriptures]

  - ref: 25
    phrase: 'The ships of Tarshish did sing of thee'
    kind: words
    title: 'Ships that carry, and a ship too full'
    body: |
      The ships may not sing at all. The Hebrew verb here is “perhaps travel, journey,” and a modern translation makes the ships of Tarshish carriers, which “traveled for you with your merchandise.” No rendering is secure; even “thy travellers (i.e. traders)” has been called “improbable.”

      The second half of the verse matters more for what follows. “Thou wast replenished, and made very glorious” can also be read of cargo: “you were filled and heavily laden.” The verb behind “made very glorious” has as its first sense “be heavy, in weight.” In the King James the line is the height of Tyre’s glory. In the other reading the ship is full and heavy “in the heart of the seas,” in the line before the wind rises.
    sources: [bdb, oshb-wlc, esv]

  - ref: 26
    phrase: 'the east wind hath broken thee'
    kind: symbol
    title: 'The east wind'
    body: |
      The east wind is the storm that breaks the ship, and it has been read as Nebuchadnezzar’s attack. In the Old Testament this wind is “often” spoken of “as violent and scorching”; in that region it “is characterized by continued gusts; and if it rises into a tempest, it generally causes great damage.” A psalm says to God, “Thou breakest the ships of Tarshish with an east wind” ([[Ps. 48:7]]). Ezekiel has used the image twice already, both times of a wind that withers a vine ([[Ezek. 17:10]]; see the note on [[Ezek. 19:12]]).

      The lament does not say who the wind is. The chapter before it names the king of Babylon ([[Ezek. 26:7]]), and so Jerome took the whole figure as “referring to the overthrow of the city by King Nabuchodonosor.” Another reading goes a step further: “Nebuchadnezzar is meant,” and the great waters are “the war with him” into which the rowers, “or rulers of the state vessel,” had brought her.

      Two details of the wording carry the point. She is brought into deep water by her own rowers. And she breaks “in the midst of the seas,” where verse 4 set her borders and verse 25 her glory; the repetition “forms an effective contrast.” Verse 27 then goes back over the riches, wares, mariners, pilots, calkers, traders, and soldiers of the earlier verses, and all of them “shall fall into the midst of the seas in the day of thy ruin.”
    sources: [bdb, keil-ezekiel, jfb-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 30
    phrase: 'shall cast up dust upon their heads'
    kind: scripture
    title: 'The seamen’s dirge, heard again over Babylon'
    body: |
      The mourning of the seamen is taken up in the book of Revelation, where it is sung over Babylon. Here the sailors leave their ships and stand on the shore. They throw dust on their heads, shave their heads, and put on sackcloth. Then they sing: “What city is like Tyrus, like the destroyed in the midst of the sea?” The word for “the destroyed” is an unusual one, perhaps “one silenced, brought to silence,” though its sense is “dubious.”

      John sees the same scene at the fall of Babylon: “every shipmaster, and all the company in ships, and sailors, and as many as trade by sea, stood afar off, And cried when they saw the smoke of her burning, saying, What city is like unto this great city! And they cast dust on their heads” ([[Rev. 18:17–19]]). The merchants weep there too, “for no man buyeth their merchandise any more” ([[Rev. 18:11]]).

      The two cities have been read as standing for the same thing. Of the Tyre of Isaiah’s burden ([[Isa. 23]]) it is said, “Like Babylon, Tyre represented the world and so eventually would come under the judgments of God.” In Revelation the riches of Babylon are destroyed, and it is those who had set their hearts on them who lament. In both books the dirge remembers the city for the wealth it gave. The seamen say to Tyre, “thou didst enrich the kings of the earth” (verse 33), and John’s shipmasters mourn the city “wherein were made rich all that had ships in the sea” ([[Rev. 18:19]]).
    sources: [lds-scriptures, bdb, ot-manual-14, nt-student-manual-56]

  - ref: 36
    phrase: 'thou shalt be a terror, and never shalt be any more'
    kind: scripture
    title: 'The last line of all three chapters on Tyre'
    body: |
      Each of the three chapters on Tyre ends with nearly this sentence. Chapter 26 closes, “I will make thee a terror, and thou shalt be no more” ([[Ezek. 26:21]]), and the lament for the king closes, “thou shalt be a terror, and never shalt thou be any more” ([[Ezek. 28:19]]). The Hebrew word for “terror,” a plural meaning “terror, dreadful event, calamity, destruction,” occurs in Ezekiel only in these three verses.

      The merchants’ hiss is scorn. The verb is used “in derision” of ruined cities, and one of the places is the verse about Jerusalem that also has Tyre’s boast: “they hiss and wag their head at the daughter of Jerusalem, saying, Is this the city that men call The perfection of beauty” ([[Lam. 2:15]]; see the note on [[Ezek. 27:3]]).

      “Never… any more” needs care, because Tyre did not vanish. Ezekiel’s own book says later of Nebuchadrezzar’s campaign, “yet had he no wages, nor his army, for Tyrus” ([[Ezek. 29:18]]). The city “supplied men and material to Zerubbabel,” and it is named in the Gospels and in Acts. One account of the fulfillment looks to the island city itself: “Today there is no island opposite Tyre,” only “a small peninsula jutting into the sea.” The lament does not explain its last line, and the question belongs with the prophecy it echoes (see the note on [[Ezek. 26:14]]).
    sources: [oshb-wlc, bdb, bd-tyre, ot-manual-27, lds-scriptures]

christ: |
  Tyre is the city the Lord GOD addresses in this chapter. Jesus Christ later spoke of the same city. Rebuking the towns of Galilee, He said, “if the mighty works, which were done in you, had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes” ([[Matt. 11:21]]), and He once “went into the borders of Tyre and Sidon” ([[Mark 7:24]]).

  The dirge itself is heard again in John’s vision, sung over Babylon (see the note on [[Ezek. 27:30]]). There the Lord calls His people out before the city falls: “Come out of her, my people, that ye be not partakers of her sins” ([[Rev. 18:4]]).

explore: |
  - The judgment this lament follows, and the first dirge over Tyre: [[Ezek. 26]].
  - The prince and the king of Tyre, where the boast of beauty is answered: [[Ezek. 28:1–19]].
  - Isaiah’s burden of Tyre, which ends with her merchandise made “holiness to the LORD” ([[Isa. 23:18]]): [[Isa. 23]].
  - John’s lament over Babylon, with its kings, merchants, shipmasters, and cargo list: [[Rev. 18:9–19]].
  - The table of nations behind the trade list: [[Gen. 10:2–7]].
  - Hiram of Tyre and Solomon: [[1 Kgs. 5:1–12]].

