chapter: 29
title: 'The Dragon of the Nile'
tagline: 'Pharaoh, who says the Nile is his own making, will be hauled out of it like a hooked crocodile. Egypt will be laid waste, scattered, and brought back as a lowly kingdom, so that Israel never leans on it again.'
when: 'Two dates, both counted from Jehoiachin’s captivity (1:2). Verses 1–16: “the tenth year, in the tenth month, in the twelfth day of the month” (about 587 B.C.), a year and two days after the siege of Jerusalem began (24:1–2). Verses 17–21: “the seven and twentieth year, in the first month, in the first day of the month” (about 570 B.C.), the latest date in the book.'

setting: |
  Ezekiel is in Babylon with the exiles, and Jerusalem is under siege. The date in verse 1 is a week short of two years before a survivor reaches Ezekiel with the words, “The city is smitten” ([[Ezek. 33:21]]).

  The chapter opens the last and longest part of the prophecies against other nations (chapters 25–32): four chapters on Egypt, which have been counted as seven separate words of the Lord. This chapter has the first two.

  The dates in this part of the book are not in order. Chapter 26 was dated to the eleventh year ([[Ezek. 26:1]]). This chapter goes back to the tenth, and verse 17 then moves to the twenty-seventh, more than sixteen years later and two years after the temple vision of chapter 40 ([[Ezek. 40:1]]). That short second word, verses 17–21, stands here with the other words about Egypt.

  Jeremiah spoke about the same Pharaoh, first from inside besieged Jerusalem and afterward in Egypt itself ([[Jer. 37:5–10]]; [[Jer. 43:8–13]]).

thread: |
  The first oracle brings two charges and gives each its sentence. Pharaoh has said the Nile is his and that he made it (verse 3). And Egypt has been a staff of reed to the house of Israel (verses 6–7). Each charge is stated with a “because” and answered with a “therefore” (verses 6–8; 9–10). Egypt is not accused of attacking the Lord’s people. Its guilt has been summed up as the king’s making a god of himself and “the treacherous nature of the help which Egypt afforded to Israel.”

  The sentence is the land laid waste, the people scattered among the nations, forty years, and then a gathering. It stops short of a full restoration. Egypt comes back low and stays low, and verse 16 says for whose sake: it “shall be no more the confidence of the house of Israel.”

  The second oracle, given many years later, names the one who will carry the sentence out. Nebuchadrezzar’s army worked for the Lord at Tyre and went unpaid, and Egypt will be its wages. The chapter then ends with Israel, whose horn will bud.

  The refrain that runs through the book comes four times (verses 6, 9, 16, 21) and ends both oracles: they “shall know that I am the LORD” (see the note on [[Ezek. 6:7]]).

sections:
  - range: 1-5
    heading: 'The dragon in his rivers'
    plain: |
      In the tenth year, on the twelfth day of the tenth month, the word of the Lord comes to Ezekiel: Set your face against Pharaoh king of Egypt, and prophesy against him and against all Egypt. The Lord God says: I am against you, Pharaoh king of Egypt, the great dragon lying in the midst of his rivers, who has said, My river is my own, and I have made it for myself. I will put hooks in your jaws and make the fish of your rivers stick to your scales. I will bring you up out of your rivers with all their fish sticking to your scales. I will leave you thrown into the wilderness, you and all the fish of your rivers. You will fall on the open fields and will not be brought together or gathered. I have given you as food to the beasts of the field and the birds of heaven.
  - range: 6-12
    heading: 'A staff of reed, and forty years'
    plain: |
      All who live in Egypt will know that He is the Lord, because they have been a staff of reed to the house of Israel. When Israel took hold of them by the hand, they broke and tore every shoulder. When Israel leaned on them, they broke and brought all their loins to a standstill. So the Lord God says: I will bring a sword on you and cut off man and beast from you. The land of Egypt will be desolate and waste, and they will know that He is the Lord, because Pharaoh has said, The river is mine, and I have made it. So the Lord is against him and against his rivers. He will make the land of Egypt utterly waste and desolate, from the tower of Syene to the border of Ethiopia. No foot of man or beast will pass through it, and it will not be inhabited for forty years. Egypt will be desolate among desolate countries, and its cities desolate among ruined cities, for forty years. The Lord will scatter the Egyptians among the nations and disperse them through the countries.
  - range: 13-16
    heading: 'Brought back, and kept low'
    plain: |
      Yet the Lord God says: At the end of forty years I will gather the Egyptians from the peoples where they were scattered. I will bring back the captivity of Egypt and return them to the land of Pathros, the land of their habitation, and there they will be a base kingdom. It will be the basest of the kingdoms and will not lift itself above the nations again. He will diminish them, so that they no longer rule over the nations. Egypt will no longer be the confidence of the house of Israel, which brings their iniquity to remembrance when they look to them. And they will know that He is the Lord God.
  - range: 17-21
    heading: 'Egypt as wages'
    plain: |
      In the twenty-seventh year, on the first day of the first month, the word of the Lord comes to Ezekiel: Nebuchadrezzar king of Babylon made his army serve a great service against Tyrus. Every head was made bald and every shoulder was peeled, yet neither he nor his army had wages from Tyrus for that service. So the Lord God says: I will give the land of Egypt to Nebuchadrezzar king of Babylon. He will take its multitude, its spoil, and its prey, and that will be the wages for his army. I have given him the land of Egypt for his labour, because they worked for me, says the Lord God. In that day I will make the horn of the house of Israel bud, and I will give you the opening of the mouth among them, and they will know that I am the Lord.

notes:
  - ref: 2
    phrase: 'Pharaoh king of Egypt'
    kind: history
    title: 'Pharaoh Hophra'
    body: |
      The Pharaoh addressed here is Hophra, the king “who sent an army to the assistance of Zedekiah.” Ezekiel does not name him here. Jeremiah does: “Behold, I will give Pharaoh-hophra king of Egypt into the hand of his enemies” ([[Jer. 44:30]]; see the note there).

      Egypt stood behind the revolt that brought the siege on. Zedekiah had sworn loyalty to Nebuchadnezzar and broke his oath “in sending his ambassadors into Egypt, that they might give him horses and much people” ([[Ezek. 17:15]]). During the siege the help came, briefly. “Pharaoh’s army was come forth out of Egypt,” and the Chaldeans drew off from the city ([[Jer. 37:5]]). Jeremiah told the king what the relief was worth: that army “shall return to Egypt into their own land” ([[Jer. 37:7]]), and the besiegers would be back.

      Ezekiel’s oracle is dated inside that siege. The text does not say whether it was spoken before the Egyptian army marched, while it was in the field, or after it had gone home.
    sources: [bd-pharaoh, lds-scriptures]

  - ref: 3
    phrase: 'the great dragon that lieth in the midst of his rivers'
    kind: symbol
    title: 'The dragon in the Nile'
    body: |
      Pharaoh is pictured as the great water-beast of the Nile, most likely a crocodile, under a name that also belongs to the sea monster the Lord defeats. The Hebrew is *tannin*, a “serpent, dragon, sea-monster.” It is “a broad term describing reptilian creatures of various sizes: snakes, crocodiles, and even legendary sea serpents.” The verse has a twin in chapter 32, where the King James translates the same word differently: “thou art as a whale in the seas” ([[Ezek. 32:2]]). The animal is a figure for the king, not a description of anything in the river.

      The word says more than “crocodile” would. A *tannin* “is primarily associated with water,” and several passages “seem to make reference to Jehovah slaying a great sea monster” of that name. Isaiah’s prayer to the arm of the Lord has the same Hebrew word: “Art thou not it that hath cut Rahab, and wounded the dragon?” ([[Isa. 51:9]]). His next verse speaks of the sea dried up for the ransomed to cross, which is the Exodus (see the note on [[Isa. 51:9]]). Ezekiel gives the name to the Pharaoh of his own day, and the verses that follow tell what the Lord will do with him.
    sources: [bdb, sc-knowhy-732, bd-dragon, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: 'My river is mine own, and I have made it for myself'
    kind: words
    title: 'The boast over the Nile'
    body: |
      The charge against Pharaoh is that he claims the Nile as his own work, which is to claim the place of a creator. The river is the Nile, and a modern translation prints the name: “My Nile is my own.” The plural “rivers” in the same verse are “the arms and canals of the Nile.”

      The size of the claim depends on what the river was. Egypt “is indebted to the Nile not only for its greatness, but for its actual existence,” so that a king who says he made the Nile is saying he made Egypt. On this reading Pharaoh calls the river his “because he regards himself as the creator,” and that pride, “in which he forgets God and attributes divine power to himself, is the cause of his sin.” The same thing has been put more shortly: his offence is “placing himself among the gods.” Verse 9 repeats the boast as the ground of the sentence.

      It is the second such boast in two chapters. The prince of Tyre was condemned for the same pride: “thou hast said, I am a God” ([[Ezek. 28:2]]).
    sources: [keil-ezekiel, ot-manual-27, clarke-ezekiel, esv, lds-scriptures]

  - ref: 4
    phrase: 'I will put hooks in thy jaws'
    kind: symbol
    title: 'Hooked, hauled out, and left in the desert'
    body: |
      The picture has been explained as a crocodile hunt that shows the fall of Pharaoh together with his people. It is drawn from life: “even in ancient times the crocodile was caught with large hooks.” The fish that cling to the beast’s scales and come out of the water with it “are the inhabitants of Egypt, for the Nile represents the land.” The wilderness is simply “the dry and barren land, in which animals that inhabit the water must perish.” The chapter itself does not say who the fish are. It gives the sentence in plain terms in verses 8–12: a sword, the land laid waste, and the Egyptians scattered.

      The Lord uses the same words of Gog, whom He will turn about and “put hooks into thy jaws” ([[Ezek. 38:4]]). Chapter 32 comes back to the water-beast and changes the tackle: “I will therefore spread out my net over thee” ([[Ezek. 32:3]]).
    sources: [keil-ezekiel, lds-scriptures]

  - ref: 6
    phrase: 'a staff of reed to the house of Israel'
    kind: scripture
    title: 'The reed that breaks'
    body: |
      The staff of reed had been said of Egypt before, by an enemy of Judah. In Hezekiah’s day the Assyrian king’s officer mocked Jerusalem for its ally: “Lo, thou trustest in the staff of this broken reed, on Egypt; whereon if a man lean, it will go into his hand, and pierce it” ([[Isa. 36:6]]; see the note there). Isaiah had given the same warning in the Lord’s name: “the Egyptians shall help in vain, and to no purpose” ([[Isa. 30:7]]). Now the Lord says it Himself, after Judah has leaned on Egypt once more (see the note on [[Ezek. 29:2]]).

      Verse 7 fills in the picture. The reed does not only fail to hold. It splits and tears the shoulder of the man who grasped it. The last clause is uncertain. The Hebrew verb is “to stand,” which the King James keeps as “be at a stand,” that is, “come to a standstill.” A modern translation follows the ancient Syriac version instead and has Egypt make “all their loins to shake.”

      What Egypt is charged with here is the harm its help did. Verse 16 says what the Lord means to do about that (see the note on [[Ezek. 29:16]]).
    sources: [lds-scriptures, esv]

  - ref: 10
    phrase: 'from the tower of Syene even unto the border of Ethiopia'
    kind: history
    title: 'From Migdol to Syene'
    body: |
      The phrase names the two ends of Egypt, north and south, and so means the whole country. Where the King James has “the tower of Syene,” the Hebrew has two place-names: “from Migdol to Syene, as far as the border of Cush.” Migdol was “the most northerly place in Egypt.” Syene was “the most southerly border town of Egypt in the direction of Cush, i.e., Ethiopia,” on the east bank of the Nile, with ruins beside the modern Aswan. The border of Cush is not a third point farther on but the same southern limit.

      Migdol appears elsewhere in scripture as one of the places where Jews settled after Jerusalem fell ([[Jer. 44:1]]). The next chapter uses the same measure of Egypt’s length ([[Ezek. 30:6]]).
    sources: [keil-ezekiel, esv, lds-scriptures]

  - ref: 11
    phrase: 'neither shall it be inhabited forty years'
    kind: history
    title: 'Forty years'
    body: |
      The forty years are named three times (verses 11, 12, 13), and the text does not say when they begin or end. Attempts to find them in history have been offered as probable and no more. One count is the reign of the Pharaoh Amasis, “which was just forty years.” Another runs from Nebuchadnezzar’s war on Egypt to the early years of Cyrus, when “the term will be about forty years.” A different reading sets all such counting aside. Forty, on that reading, “is a symbolical term denoting a period appointed by God for punishment and penitence,” and it “is not to be understood in a chronological sense, or capable of being calculated.” No source read for this chapter shows a time when Egypt lay empty.

      What the text does show is that the words of the sentence are words the book has already used of Judah. Ezekiel had lain on his side for Judah “forty days: I have appointed thee each day for a year” ([[Ezek. 4:6]]; see the note on [[Ezek. 4:4]]). The two Hebrew verbs for scattering in verse 12 are the pair used of Jerusalem: “I will scatter thee among the heathen, and disperse thee in the countries” ([[Ezek. 22:15]]). And the gathering of verse 13 is worded like the promise to the exiles: “I will even gather you from the people” ([[Ezek. 11:17]]).

      Jeremiah’s word on Egypt has the same turn at the end: “afterward it shall be inhabited, as in the days of old” ([[Jer. 46:26]]; see the note there).
    sources: [clarke-ezekiel, keil-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 15
    phrase: 'It shall be the basest of the kingdoms'
    kind: words
    title: 'A lowly kingdom'
    body: |
      “Base” here means lowly: Egypt is to be brought home and kept small. A modern translation has “the most lowly of the kingdoms.” The Hebrew adjective, and the verb beside it for lifting oneself up, are the words Ezekiel used for what Nebuchadnezzar intended Judah to be under Zedekiah: “That the kingdom might be base, that it might not lift itself up” ([[Ezek. 17:14]]).

      The return is real. Verse 14 uses the phrase that Ezekiel later uses of Israel: “Now will I bring again the captivity of Jacob” ([[Ezek. 39:25]]). The Egyptians come back to Pathros, which is Upper Egypt, the south of the country, and which the Hebrew calls the land of their origin.

      The limit is real too. Egypt will not “exalt itself any more above the nations.” The verse has been read as fulfilled in the country’s long decline: “From that point on, Egypt ceased to play an important role in world affairs.” In the centuries after Ezekiel it “became a province of the Persian empire,” then “part of the dominions of Alexander the Great,” and then “passed into the hands of the Romans.”
    sources: [ot-manual-27, bd-pathros, bd-egypt, oshb-wlc, esv, lds-scriptures]

  - ref: 16
    phrase: 'which bringeth their iniquity to remembrance'
    kind: words
    title: 'A reminder of iniquity'
    body: |
      The clause ties the lowering of Egypt to Israel’s guilt, and it has been read in two ways. On one, Egypt is the subject: “making Egypt the ground of confidence, brings into remembrance before God the guilt of Israel,” a guilt which lies in the fact “that the Israelites turn to the Egyptians and seek salvation from them.” To “look after them” is to turn toward them for help, “when they turn to them for aid.”

      Ezekiel has a like expression for Zedekiah’s broken oath, where it is the Lord who remembers: “he will call to remembrance the iniquity, that they may be taken” ([[Ezek. 21:23]]).

      Another translation takes the remembering as Israel’s own: “they will recall their iniquity when they turned to them for aid.”

      On both readings the iniquity is Israel’s turning to Egypt for help, and the verse says that this will end: Egypt “shall be no more the confidence of the house of Israel.”
    sources: [keil-ezekiel, esv, nrsvue, lds-scriptures]

  - ref: 18
    phrase: 'yet had he no wages, nor his army'
    kind: history
    title: 'The siege of Tyre paid nothing'
    body: |
      This later word says that Nebuchadnezzar’s army had no wages from Tyre for its siege, and it stands in the same book as the prophecy that sent him there. In the eleventh year the Lord had said He would bring Nebuchadrezzar against Tyrus ([[Ezek. 26:7]]) and that “they shall make a spoil of thy riches” ([[Ezek. 26:12]]). This word comes sixteen years after that one.

      The siege is said to have been long: “He was thirteen years employed in the siege.” The bald heads and peeled shoulders are the marks of that work, explained as heads worn bare “by wearing their helmets” and shoulders “bruised and peeled by carrying baskets of earth to the fortifications.”

      The verse does not say why there were no wages. The explanation that has been given is that Nebuchadnezzar “had not been able to conquer the island city,” and that the Tyrians carried their wealth away by ship before the siege ended.
    sources: [ot-manual-27, clarke-ezekiel, lds-scriptures]

  - ref: 20
    phrase: 'because they wrought for me'
    kind: scripture
    title: 'Babylon in the Lord’s hire'
    body: |
      The Lord speaks of Nebuchadnezzar’s army as labourers in His employ and of Egypt as their pay. A modern translation has “because they worked for me.”

      Jeremiah gives the king of Babylon a title from the Lord: “Nebuchadrezzar the king of Babylon, my servant” ([[Jer. 25:9]]), which comes again in [[Jer. 27:6]] and [[Jer. 43:10]]. The last of these is a word spoken in Egypt about Egypt: “he shall array himself with the land of Egypt, as a shepherd putteth on his garment” ([[Jer. 43:12]]).

      Being used by the Lord did not exempt a nation from His judgment. The nations around Israel “were sometimes used by the Lord as the rods for punishing Israel,” and yet “they were not exempt from his judgments either.”

      For whether and when Nebuchadnezzar came against Egypt, see the note on [[Jer. 43:11]].
    sources: [lund-ezekiel, esv, lds-scriptures]

  - ref: 21
    phrase: 'the horn of the house of Israel to bud forth'
    kind: symbol
    title: 'A horn for Israel'
    body: |
      A horn is an animal’s strength, and the promise is that Israel’s strength, cut off when Judah fell, will grow again. The horn “is a symbol of might and strength.” Lamentations uses the figure for what the fall of Jerusalem did: “He hath cut off in his fierce anger all the horn of Israel” ([[Lam. 2:3]]).

      The promise is tied to the sentence on Egypt. “In that day” has been explained as the day “when the judgment upon Egypt is executed,” and the budding horn as the counterpart of Egypt’s becoming a lowly kingdom.

      The Hebrew verb and noun of this promise also stand in a psalm’s promise of a horn for David ([[Ps. 132:17]]).

      Ezekiel names no person here. On one reading the horn “is neither Zerubbabel nor the Messiah, but the Messianic salvation,” the restored strength of the Lord’s people.
    sources: [keil-ezekiel, oshb-wlc, lds-scriptures]

  - ref: 21
    phrase: 'the opening of the mouth'
    kind: words
    title: 'Authority to speak'
    body: |
      The phrase is a Hebrew idiom for being able and authorized to speak, and here it is promised to Ezekiel himself. The Hebrew means “opening of mouth in speech or song,” and it comes in the book only here and at one earlier place, where shame takes speech away: “never open thy mouth any more because of thy shame” ([[Ezek. 16:63]]). A modern translation has “I will open your lips among them.”

      A reader will think of the dumbness laid on Ezekiel at his call and lifted when Jerusalem fell (see the note on [[Ezek. 24:27]]). That dumbness had ended long before this word came. It ended in the twelfth year, when “my mouth was opened, and I was no more dumb” ([[Ezek. 33:22]]), and this word is dated to the twenty-seventh. The verse does not say more about what the promised opening will be.
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

christ: |
  The chapter’s last promise is a horn made to bud for the house of Israel. The words are the words of the promise to David’s line: “There will I make the horn of David to bud: I have ordained a lamp for mine anointed” ([[Ps. 132:17]]). The Church’s edition heads that psalm as messianic and joins its “horn” to the prophecies about Jesus Christ.

  When John the Baptist was born, his father Zacharias blessed the God of Israel, who “hath raised up an horn of salvation for us in the house of his servant David” ([[Luke 1:69]]).

  Ezekiel’s verse names no person, and it has been read as a promise of the messianic salvation rather than of the Messiah himself (see the note on [[Ezek. 29:21]]). The psalm and Zacharias say in whose house that horn was raised.

explore: |
  - Egypt’s army comes out, the siege lifts, and Jeremiah says it will not last: [[Jer. 37:5–10]].
  - Isaiah’s warnings against leaning on Egypt: [[Isa. 30:1–7]]; [[Isa. 31:1–3]]; [[Isa. 36:4–6]].
  - Jeremiah’s words on Egypt and Nebuchadnezzar: [[Jer. 43:8–13]]; [[Jer. 46:13–26]].
  - Isaiah’s promise for Egypt, which goes further than Ezekiel’s lowly kingdom: [[Isa. 19:19–25]].
  - The kingdom that was to be “base” and would not stay so: [[Ezek. 17:11–18]].
  - The prophecy against Tyre that verse 18 looks back on: [[Ezek. 26:7–14]].
  - The rest of the words against Egypt, with the dragon again in the lament: [[Ezek. 30–32]].

parallels:
  - ref: '2 Ne. 8:9'
    note: 'Jacob quotes Isaiah’s line about the arm of the Lord that “wounded the dragon,” the same Hebrew word Ezekiel uses of Pharaoh.'

