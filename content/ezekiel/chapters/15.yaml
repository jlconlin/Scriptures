chapter: 15
title: 'The Wood of the Vine'
tagline: 'In eight verses the Lord asks what the wood of a vine is good for. The answer is fuel, and the vine is Jerusalem.'
when: 'No date of its own. The chapter stands under the heading of 8:1, “the sixth year, in the sixth month” of Jehoiachin’s captivity, about 591 B.C., and before the next date in the book, the seventh year (20:1).'

setting: |
  Ezekiel is in Babylon among the captives carried away with King Jehoiachin, and Jerusalem is still standing. The chapter has no date. It falls between the vision dated to the sixth year ([[Ezek. 8:1]]) and the elders’ visit in the seventh ([[Ezek. 20:1]]), and the siege that will end the city does not begin until the ninth year ([[Ezek. 24:1–2]]).

  The people the chapter is about had already been through one disaster. About six years earlier Nebuchadnezzar “carried away all Jerusalem” ([[2 Kgs. 24:14]]), which is how Ezekiel and his hearers came to be in Babylon; the second large deportation, in 586 B.C., was still ahead.

  Chapter 14 had just closed off one hope. Even if Noah, Daniel, and Job were in the land, “they should deliver but their own souls by their righteousness” ([[Ezek. 14:14]]): no one else’s goodness would save the city. This chapter has been read as closing off another, the confidence that a people chosen by God could not be rejected.

  It is the first of three passages in the book that use a vine. The Hebrew word for vine comes in Ezekiel only here, in the parable of the two eagles ([[Ezek. 17:6–8]]), and in the lament for the princes of Israel ([[Ezek. 19:10]]).

thread: |
  The chapter is a parable and its application. Verses 2–5 ask four questions about vine wood, and every one expects the answer no. Is it better than other wood? Can anything be made from it? Will it even do for a peg? Once the fire has burned both its ends and its middle, is it useful then? The argument moves from the lesser to the greater: if it was good for nothing whole, “how much less” when it is burned.

  Verses 6–8 apply it in one sentence: “so will I give the inhabitants of Jerusalem.” The vine wood is the people of the city, and the half-burned stick has been read as the city as it then was, already through one fire with another to come (the note on verse 7 gives the readings).

  The chapter never mentions fruit; it looks at the vine only as wood. Only the last verse gives the reason for the judgment: “they have committed a trespass.”

sections:
  - range: 1-5
    heading: 'What is vine wood good for?'
    plain: |
      The word of the Lord comes to Ezekiel. What is the vine more than any other tree, or than a branch among the trees of the forest? Is wood taken from it to make anything? Will anyone take even a peg from it to hang a vessel on? It is thrown on the fire for fuel. The fire eats both its ends, and the middle is burned. Is it fit for any work? When it was whole it was fit for no work. How much less can anything be made of it once the fire has eaten it and it is burned.
  - range: 6-8
    heading: 'So will I give Jerusalem'
    plain: |
      Therefore the Lord God says: Like the vine among the trees of the forest, which I have given to the fire for fuel, so will I give the people who live in Jerusalem. I will set my face against them. They will go out from one fire, and another fire will consume them, and you will know that I am the Lord when I set my face against them. I will make the land desolate, because they have committed a trespass, says the Lord God.

notes:
  - ref: 2
    phrase: 'What is the vine tree more than any tree'
    kind: symbol
    title: 'A vine judged by its wood'
    body: |
      Scripture often pictures Israel as a vine, and Ezekiel asks only about its wood. A psalm sings, “Thou hast brought a vine out of Egypt” ([[Ps. 80:8]]). Isaiah’s vineyard was planted “with the choicest vine” and “brought forth wild grapes” ([[Isa. 5:2]]). Jeremiah has the Lord say, “I had planted thee a noble vine” ([[Jer. 2:21]]).

      Ezekiel does not mention fruit at all. The Hebrew of his question is about “the wood of the vine,” and the same Hebrew noun, *ets*, serves for “tree” and for “wood” through the passage. As timber a vine fails completely: “the wood of the grape plant is fit for nothing but burning.” Israel, pictured as such a vine, is “precious if but fruitful, otherwise nothing but fuel and that of poor quality.”
    sources: [talmage-jesus-christ-30, keil-ezekiel, oshb-wlc, bdb, esv, lds-scriptures]

  - ref: 2
    phrase: 'a branch which is among the trees of the forest'
    kind: words
    title: 'The vine branch among the forest trees'
    body: |
      The King James “or than a branch” compares the vine with a branch of a forest tree, and the Hebrew can also be read without that second comparison. On the King James reading, “the whole vine as wood is inferior to a branch from a forest tree.”

      The Hebrew has no words for “or than.” The word for “branch,” *zemorah*, stands directly after “any wood,” and it is “a twig (as pruned).” Modern translations take it as a second name for the vine itself, asking what the wood of the vine has over other wood, “the vine branch that is among the trees of the forest?”
    sources: [talmage-jesus-christ-30, oshb-wlc, strongs-concordance, esv, nrsvue]

  - ref: 3
    phrase: 'a pin of it to hang any vessel thereon'
    kind: words
    title: 'Not even a peg'
    body: |
      The “pin” is a wooden peg for hanging things on. The Hebrew is *yathed*, a “pin, peg.” It is especially a tent-pin; in this verse it is “a peg for hanging.”

      Isaiah uses the same word in the same sense for a man who can be relied on. Eliakim is fastened “as a nail in a sure place” ([[Isa. 22:23]]), and on him hang “all vessels of small quantity” ([[Isa. 22:24]]) (see the note on [[Isa. 22:23]]).

      The questions of verse 3 go down a scale. First, can anything at all be made from vine wood? Then, can it at least be a peg? The answer to both is no, and verse 4 names the one use it has, fuel.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 4
    phrase: 'it is cast into the fire for fuel'
    kind: christ
    title: 'The true vine and the branches that are burned'
    body: |
      Jesus used the picture of a vine and of branches burned in the fire, and He made Himself the vine. “I am the true vine, and my Father is the husbandman” ([[John 15:1]]). Of a branch that does not remain in Him He said that “men gather them, and cast them into the fire, and they are burned” ([[John 15:6]]). Modern translations set that verse beside this one in their cross-references.

      In Ezekiel the vine is Jerusalem, and the parable speaks only of its wood. In John the vine is Christ, and the branch’s fruit comes from Him: “As the branch cannot bear fruit of itself, except it abide in the vine; no more can ye, except ye abide in me” ([[John 15:4]]). A branch cut from that vine “withers, dries, and becomes utterly worthless except as fuel for the burning,” and even the apostles were as “helpless and useless without Him as is a bough severed from the tree.”
    sources: [lds-scriptures, esv, nrsvue, talmage-jesus-christ-33]

  - ref: 6
    phrase: 'so will I give the inhabitants of Jerusalem'
    kind: words
    title: 'One verb from the fire to the land'
    body: |
      A single Hebrew verb, *natan*, “give,” runs from the parable through its application, and the King James has five English words for it. The vine wood “is cast” (given) to the fire in verse 4. In verse 6 the Lord says of it, “which I have given to the fire,” and then of the city, “so will I give.” In verse 7 the first “I will set my face” uses the same verb (word for word, I will give my face), and so does “I will make the land desolate” in verse 8 (I will give the land to desolation). The second “set” in verse 7 is a different verb.

      In the parable the wood simply “is cast” to the fire, with no one named. In the application the Lord names Himself as the giver: “I have given.” The verb said of the city is also a Hebrew perfect, and one modern translation renders it as already done: “so have I given up the inhabitants of Jerusalem.”

      Two of the phrases have counterparts in Leviticus 26, among the warnings of Moses that are probably the most important background to Ezekiel’s message of judgment (see the note on [[Ezek. 5:2]]). “I will set my face against you” ([[Lev. 26:17]]) has the same Hebrew verb and noun as verse 7, and “your land shall be desolate” ([[Lev. 26:33]]) has the noun of verse 8. The Lord had said the first of them in the chapter before this one ([[Ezek. 14:8]]). For “ye shall know that I am the LORD,” see the note on [[Ezek. 6:7]].
    sources: [oshb-wlc, esv, lund-ezekiel, lds-scriptures]

  - ref: 7
    phrase: 'they shall go out from one fire, and another fire shall devour them'
    kind: history
    title: 'Out of one fire, into another'
    body: |
      Verse 7 has been read as the key to the half-burned stick of verses 4–5: Jerusalem had been in the fire once already. The King James puts both halves of the line in the future and supplies “one” and “another.” The Hebrew has only “the fire” twice, and its first verb is a perfect, which can be read as past: “They have gone out of the fire, and the fire will consume them.” On that reading “Israel has been in the fire already.” Modern translations keep the one fire and take the first half differently: “although they escape from the fire, the fire shall still consume them.”

      The text does not say which earlier fire is meant. One reading takes it broadly, as “all the judgments which fell upon the covenant nation, from the destruction of the kingdom of the ten tribes to the catastrophe in the reign of Jehoiachin.” Assyria “carried Israel away” ([[2 Kgs. 17:6]]) in 721 B.C., and in 597 B.C. came the first large deportation under Nebuchadnezzar, the one that brought Ezekiel to Babylon. Another reading maps the stick onto the country: “both the extremities of the land is wasted; and the middle, Jerusalem, is now threatened with a siege.”

      When the city fell, Nebuchadnezzar’s captain “burnt the house of the LORD, and the king’s house, and all the houses of Jerusalem” ([[2 Kgs. 25:9]]), a verse one modern translation sets beside this one in its cross-references.
    sources: [oshb-wlc, nrsvue, esv, keil-ezekiel, clarke-ezekiel, bd-captivities, bd-ezekiel, lds-scriptures]

  - ref: 8
    phrase: 'they have committed a trespass'
    kind: words
    title: 'The trespass is broken faith'
    body: |
      The chapter’s last line gives the reason for the fire, and the word it uses is about loyalty. The Hebrew is a verb with its own noun, *ma‘alu ma‘al*. The verb means to “act unfaithfully, treacherously,” and the noun is an “unfaithful, treacherous act.” Modern translations have “they have acted faithlessly.”

      The pair is not new here. The oracle just before this one ([[Ezek. 14:12–23]]) began with it: “when the land sinneth against me by trespassing grievously” ([[Ezek. 14:13]]). Two chapters on it is used of one particular act, that of a king “whose oath he despised, and whose covenant he brake” ([[Ezek. 17:16]]): “his trespass that he hath trespassed against me” ([[Ezek. 17:20]]). The noun comes six times in the book.

      The same verb and noun stand in the covenant warnings of Leviticus: “If they shall confess their iniquity, and the iniquity of their fathers, with their trespass which they trespassed against me” ([[Lev. 26:40]]).

      This chapter does not say what the unfaithful acts were.
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

christ: |
  Jesus Christ used the vine of Himself and His disciples: “I am the vine, ye are the branches,” and “without me ye can do nothing” ([[John 15:5]]). Ezekiel’s parable has a vine with no fruit named and wood that is given to the fire. In the Savior’s, the branch that remains in Him “bringeth forth much fruit” ([[John 15:5]]). The note on verse 4 sets the two passages side by side.

explore: |
  - The Lord’s parable of the vineyard and the husbandmen, which uses the Old Testament figure of Israel as a vineyard: [[Matt. 21:33–41]].
  - Ezekiel’s other two vines, in the parable of the two eagles and the lament for the princes of Israel: [[Ezek. 17:1–10]] and [[Ezek. 19:10–14]].
  - What comes next: Jerusalem’s unfaithfulness told at length, under the figure of a harlot: [[Ezek. 16]].

