chapter: 4
title: A Siege Drawn on a Brick
tagline: Shut in his house and unable to preach, Ezekiel is told to act out Jerusalem’s end before the exiles, with a model siege, long days lying bound on his side, and a starvation diet baked over dung.
when: 'No date of its own. The chapter stands under the book’s first heading, “the fifth year of king Jehoiachin’s captivity” (1:2), about 592 B.C.; the next date is the sixth year (8:1).'

setting: |
  The chapter has no date of its own. It stands under the book’s first heading, “the fifth year of king Jehoiachin’s captivity” ([[Ezek. 1:2]]), about 592 B.C., and the next date, in the sixth year, comes at [[Ezek. 8:1]]. Ezekiel is a priest ([[Ezek. 1:3]]) living among the exiles at Tel-abib by the river Chebar ([[Ezek. 3:15]]). He has just been told to shut himself in his house, that he will be bound, and that his tongue will cleave to the roof of his mouth so that he cannot be “a reprover” to the people ([[Ezek. 3:24–26]]). What follows in chapters 4 and 5 is therefore a set of things to do, not a sermon.

  Jerusalem is still standing. Nebuchadnezzar had twice gone to war against Judah and taken captives, and the city “was still intact until the third siege.” That siege lies four years ahead by the book’s own count: its first day is written down at [[Ezek. 24:1–2]], in the ninth year. The exiles who watch Ezekiel still have a city at home.

  The chapter is one speech of the Lord, interrupted once by the prophet (verse 14). The signs continue into the next chapter, where the explanation begins with the words “This is Jerusalem” ([[Ezek. 5:5]]).

thread: |
  Four things are acted out in order. The Lord says what the last three mean before the chapter ends; the first is called only “a sign to the house of Israel,” and its explanation waits for the next chapter. A brick with the city cut into it and a small siege set around it: Jerusalem will be besieged (verses 1–3). The prophet lying bound on one side and then the other: the people will bear their iniquity, a day for each year (4–8). Bread of mixed grain weighed out, and water measured: “I will break the staff of bread in Jerusalem” (9–11, 16–17). The bread baked over dung: Israel will “eat their defiled bread among the Gentiles” (12–15). The signs of siege, hunger, and exile come in the order of the events.

  Ezekiel plays two parts at once. Facing the brick with the iron plate between, he stands for God and “carries out in a symbolical manner the siege of Jerusalem”; lying bound and hungry, he “is in this situation to portray at the same time the destiny of the people of Israel beleaguered in their metropolis.” The hardest thing the chapter says is in the first part. The army at the wall will be Nebuchadnezzar’s ([[2 Kgs. 25:1]]), but in the sign the besieger is the prophet acting for God, and the explanation says it in the Lord’s own words: “Behold, I, even I, am against thee” ([[Ezek. 5:8]]). The last words of the chapter give the reason: they will “consume away for their iniquity.”

sections:
  - range: 1-3
    heading: The city on a brick
    plain: |
      Son of man, take a brick, set it in front of you, and cut into it a picture of a city: Jerusalem. Lay siege to it. Build a fort against it, heap up a mound against it, pitch camps against it, and set battering rams all around it. Then take an iron griddle and stand it up as an iron wall between you and the city. Set your face against it. It will be under siege, and you will besiege it. This is a sign to the house of Israel.
  - range: 4-8
    heading: Lying bound under their iniquity
    plain: |
      Lie on your left side and lay the iniquity of the house of Israel on it. For as many days as you lie there you will bear their iniquity. I have given you the years of their iniquity as a number of days: three hundred and ninety days. When you have finished those, lie down again, on your right side, and bear the iniquity of the house of Judah forty days. I have given you a day for each year. Keep your face toward the siege of Jerusalem, with your arm bared, and prophesy against it. I will put bands on you so that you cannot turn from one side to the other until you have finished the days of your siege.
  - range: 9-15
    heading: Weighed bread, baked over dung
    plain: |
      Take wheat, barley, beans, lentils, millet, and spelt, put them in one vessel, and make bread of them. You will eat it for the three hundred and ninety days that you lie on your side. Your food will be weighed, twenty shekels a day, and eaten at set times. Your water will be measured, a sixth of a hin, and drunk at set times. Eat it as barley cakes, and bake it in their sight over human dung. The Lord said: This is how the children of Israel will eat their unclean bread among the nations where I will drive them. I said: Ah, Lord God, I have never been made unclean. From my youth until now I have not eaten what died of itself or was torn by beasts, and no foul flesh has come into my mouth. He said: See, I give you cow’s dung in place of human dung; prepare your bread over that.
  - range: 16-17
    heading: The staff of bread broken
    plain: |
      Son of man, I am about to break the staff of bread in Jerusalem. They will eat bread by weight and with care, and drink water by measure and in fear, so that bread and water run short, and they look at one another appalled and waste away in their iniquity.

notes:
  - ref: 1
    phrase: take thee a tile
    kind: words
    title: The tile is a brick
    body: |
      The “tile” is a clay brick, and Ezekiel is to cut a picture of Jerusalem into it. The Hebrew word, *lebenah*, means “brick, tile.” It is the word for the bricks of the builders of Babel, who “had brick for stone” ([[Gen. 11:3]]). Here it is a “tile, on which plan of city could be engraved.”

      Around the brick he is to lay out a whole siege in small: a fort, a mound, camps, and battering rams “round about.” The book of Kings tells the real siege in the same terms, when Nebuchadnezzar’s host “pitched against it; and they built forts against it round about” ([[2 Kgs. 25:1]]). That siege began in the ninth year ([[Ezek. 24:1–2]]). The command to make the model comes in the fifth or sixth.
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 3
    phrase: an iron pan
    kind: symbol
    title: The iron pan is a wall, and Ezekiel stands outside it
    body: |
      The iron pan stands for a wall, as the verse says, and Ezekiel, on the other side of it from the city, is the besieger. The Hebrew *machabath* is a “flat plate, pan, or griddle for baking.” Everywhere else it is a utensil for the grain offering “baken in a pan,” which a priest would know from the law ([[Lev. 2:5]]). Here it is “a plate of iron, signifying an iron wall, in prediction of siege of city.”

      What the detail signifies is in the words that follow: “set thy face against it… and thou shalt lay siege against it.” The one who besieges the model is the prophet. When the explanation of the signs comes, the Lord speaks of Jerusalem in the first person: “Behold, I, even I, am against thee” ([[Ezek. 5:8]]).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 3
    phrase: This shall be a sign to the house of Israel
    kind: history
    title: A sign acted out for the exiles
    body: |
      Ezekiel is told to act the message out, and the people who can see it are the exiles he lives among ([[Ezek. 3:15]]). He has been sent to his house and told that he will be dumb and no “reprover” to them ([[Ezek. 3:24–26]]), so the sign is something to watch: the bread is to be baked “in their sight” (verse 12). Later the book says it of the prophet himself: “I am your sign” ([[Ezek. 12:11]]), and “Ezekiel is unto you a sign” ([[Ezek. 24:24]]). He is not alone in this. “Other prophets have been instructed to use similar teaching techniques,” as in [[Jer. 27:1–11]] and [[Acts 21:11]].

      Whether Ezekiel carried out every part in literal fact is not known. The chapter gives the commands and does not tell of his doing them. On one view all of it “was done, not in idea, but in fact.” On another it “seems strange that the Lord would ask a prophet to lie immobile for fifteen months,” and he may have “performed the act in some kind of symbolic way.” The text does not settle it.
    sources: [lds-scriptures, ot-manual-26, clarke-ezekiel]
  - ref: 4
    phrase: thou shalt bear their iniquity
    kind: words
    title: 'Bearing iniquity: 390 days and 40'
    body: |
      To bear iniquity is to carry its consequences, and Ezekiel carries Israel’s as a picture of what is coming, not as a payment for it. The Hebrew phrase (*nasa avon*) and the reckoning both come from the wilderness. When the spies had searched the land forty days, Israel was sentenced to “bear your iniquities, even forty years,” “each day for a year” ([[Num. 14:34]]). The Updated NRSV has “guilt” where the King James has “iniquity.” In Ezekiel’s case the bearing is a demonstration (“purely epideictic and symbolical,” that is, for display). Lying bound, he is “to show to the people how they are to be cast down by the siege of Jerusalem.”

      “The house of Israel,” set beside “the house of Judah,” appears to be the Northern Kingdom. The one kingdom lay north of Jerusalem and the other south, but why the left side is Israel’s and the right Judah’s “is not fully explained” by that plain fact. On one reading the right side, with its shorter term, also marks “the pre-eminence of Judah over Israel.”

      What the two numbers count is not known. “The years do not fit any known history.” Taken as years of sinning, they run too long for the Northern Kingdom, which “lasted only 253 years,” and forty years back from Ezekiel falls in the reforming reign of Josiah, a poor place to begin Judah’s sin. Several counts have been tried. One runs the 390 years back from the sack of Jerusalem to the first year of Jeroboam, “when national idolatry began in Israel.” Another takes the 430 days together as the length of the siege itself once an interruption is subtracted. A third reads the numbers as years of punishment still to come and as a symbol: 390 and 40 make 430, the years of [[Ex. 12:40]], a number that “recalls the 430 years which in the far past Israel had spent in Egypt in bondage,” with that bondage taken “as a type of the banishment of rebellious Israel among the heathen.” The old Greek translation has a different figure in verse 5, “a hundred and ninety days.” None of these is established, and without a revealed key the passage cannot be definitely interpreted.
    sources: [keil-ezekiel, clarke-ezekiel, ot-manual-26, lxx-rahlfs, nrsvue, oshb-wlc, lds-scriptures]
  - ref: 7
    phrase: thine arm shall be uncovered
    kind: symbol
    title: The bared arm and the bands
    body: |
      The uncovered arm is an arm laid bare, and the same Hebrew verb describes the Lord’s own. The verb, *chasaph*, means “strip off, strip, make bare,” and it is used in one sense of the Lord’s arm, in “The LORD hath made bare his holy arm in the eyes of all the nations” ([[Isa. 52:10]]), and of the prophet’s here. The Updated NRSV has “with your arm bared you shall prophesy against it.” The verse does not say what the gesture means. It joins it to two other things, the face set toward the siege and the prophesying against the city.

      Verse 8 adds the bands. In the chapter before, the prophet was told that “they shall put bands upon thee” ([[Ezek. 3:25]]). Now the Lord says, “I will lay bands upon thee,” and gives the purpose, that he not turn “till thou hast ended the days of thy siege.” The phrase “thy siege” calls his time on his side a siege. It has a set length, and he is held to all of it.
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]
  - ref: 10
    phrase: twenty shekels a day
    kind: history
    title: Siege rations
    body: |
      The bread and water are a siege ration: poor grain, weighed out, and too little of it. Mixing wheat with barley, beans, lentils, millet, and spelt is what people do “in times of scarcity,” to stretch the finer grain with the coarser, and the mixture “was intended to show how scarce the necessaries of life should be during the siege.” Twenty shekels a day has been reckoned at nine or ten ounces. The estimates differ because the exact weight of the early shekel is uncertain. It is “at most the half of what a man needs in southern countries for his daily support.” Estimates of a sixth of a hin of water differ too: one is less than a pint, another about a pint and a half.

      “From time to time” means at fixed times. The day’s portion is not eaten at once but divided among the hours of meals, “so that he will never be completely satisfied.” Verse 9 names only the 390 days, which has been taken as brevity, the forty days being understood. The Lord’s own explanation of the diet waits until verse 16.
    sources: [clarke-ezekiel, keil-ezekiel, bd-weights-and-measures]
  - ref: 12
    phrase: thou shalt bake it with dung that cometh out of man
    kind: symbol
    title: Bread baked over dung is the bread of exile
    body: |
      The dung is fuel and not an ingredient, and the Lord says in the next verse what it signifies: exile. Dried cattle dung “is a common fuel in the east.” Human dung in its place has been explained from the siege, when no one could leave the city to gather anything else. But the text’s own explanation looks past the siege: “Even thus shall the children of Israel eat their defiled bread among the Gentiles, whither I will drive them.”

      “Defiled” is the Hebrew *tame*, “unclean,” the word of the purity laws, and it was used of soil as well as of food, as of “a foreign land” in Amos. Because “foreign lands were considered unclean,” what was eaten there was unclean too. Hosea had said the same of the northern tribes, who “shall eat unclean things in Assyria” ([[Hosea 9:3]]). So the sign reaches beyond the hunger of the siege to the life that follows it, away from the Lord’s land, where even daily bread is unclean.
    sources: [ot-manual-26, bdb, oshb-wlc, lds-scriptures]
  - ref: 14
    phrase: my soul hath not been polluted
    kind: history
    title: The priest objects, and the command is changed
    body: |
      Ezekiel’s one speech in the chapter is a priest’s protest, and the Lord answers it by changing the command. He is “Ezekiel the priest” ([[Ezek. 1:3]]), and the first two things he says he has never eaten are what the law kept from a priest’s table: “That which dieth of itself, or is torn with beasts, he shall not eat to defile himself therewith” ([[Lev. 22:8]]). “Abominable flesh” is the Hebrew *piggul*, elsewhere a “technical term of unclean sacrificial flesh,” the word for a peace offering “eaten at all on the third day” ([[Lev. 7:18]]). Its sense in this verse is “undefined,” so which flesh Ezekiel means is not certain. “Polluted” is from the same Hebrew root as “defiled” in verse 13. The Lord has just said that Israel will eat unclean bread, and the prophet answers that he himself has never been unclean.

      He does not refuse. He cries “Ah Lord GOD!” and states his case, and the reply grants it: “I have given thee cow’s dung for man’s dung.” The chapter makes no comment on the exchange.
    sources: [lds-scriptures, bdb, oshb-wlc, strongs-concordance]
  - ref: 16
    phrase: I will break the staff of bread
    kind: scripture
    title: The staff of bread and the curses of Leviticus 26
    body: |
      Verses 16–17 explain the rations in words that also stand in the covenant curses of Leviticus 26. “Staff of bread” is a figure from the staff a person leans on: bread is the support of life, the “food supply.” The figure is in the list of what would follow if Israel broke the covenant: “when I have broken the staff of your bread… they shall deliver you your bread again by weight: and ye shall eat, and not be satisfied” ([[Lev. 26:26]]). Ezekiel’s bread is weighed too, and both verses speak of the staff of bread broken. The chapter’s last words have a counterpart in the same list, where those who are left “shall pine away in their iniquity” ([[Lev. 26:39]]). “Consume away” and “pine away” translate one Hebrew verb, and “for their iniquity” is the same phrase in both.

      The famine came. At the end of the siege “the famine prevailed in the city, and there was no bread for the people of the land” ([[2 Kgs. 25:3]]). The book of Jeremiah has the same account ([[Jer. 52:6]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  The chapter names no deliverer. It is judgment from its first verse to its last. What it shows is a man made to carry his people’s iniquity in his own body, bound and on short rations, for as long as he is told. That bearing is a sign and not an atonement: it “is not to be viewed as vicarious and mediatorial, as in the sacrifice of atonement.” But the words are the words scripture uses where the bearing is more than a sign. The same Hebrew verb is used of the goat on the Day of Atonement, which “shall bear upon him all their iniquities unto a land not inhabited” ([[Lev. 16:22]]), and of the Servant who “bare the sin of many” ([[Isa. 53:12]]), in the chapter headed “Isaiah speaks about the Messiah.” Setting these beside Ezekiel is a comparison of words and not something the chapter says.

