chapter: 35
title: 'Against Mount Seir'
tagline: 'Edom, Israel’s brother nation, kept an old hatred, used the sword on the day Jerusalem fell, and claimed the emptied land. The Lord answers that He was there and heard it, and that Edom will become what it was glad to see.'
when: 'No date of its own. The chapter stands under the heading of 33:21, “the twelfth year of our captivity, in the tenth month, in the fifth day of the month” (about 585 B.C.), the day a fugitive brought word that Jerusalem had fallen.'

setting: |
  Ezekiel is among the exiles, and Jerusalem has fallen. The last date the book has given is the day a man who had escaped arrived to say, “The city is smitten” ([[Ezek. 33:21]]); the second of the “large deportations under Nebuchadnezzar,” in 586 B.C., is behind this chapter. The chapter stands among the book’s “prophecies of restoration,” chapters 33–39. Chapter 34 has just promised the scattered flock “one shepherd” ([[Ezek. 34:23]]) and a day when they will no longer “bear the shame of the heathen” ([[Ezek. 34:29]]).

  Then a whole chapter is spoken against a foreign people. Edom was the nation of Esau’s descendants, with its country “in Mount Seir,” which “lay south of the Dead Sea.” Ezekiel had already given it three verses among Judah’s neighbors ([[Ezek. 25:12–14]]). Those oracles and this one bear on a question that Judah’s fall raises, whether the nations around it were “exempt from the wrath of the Lord.”

  Other scripture remembers Edom in the day the city fell: Obadiah ([[Obad. 1:10–14]]) and a psalm of the exiles ([[Ps. 137:7]]).

thread: |
  The chapter is built on “Because… Therefore.” The sentence is announced first (verses 2–4), and then two charges are laid, each opening with “Because” (verses 5 and 10) and each ending, as the announcement does, with knowing “that I am the LORD.” The first charge is blood: an old enmity acted on with the sword. The second is words: a claim on the land, and contempt for the One whose land it was.

  In each case the punishment is the offense turned around. Edom did not hate blood, so blood will pursue it. The Lord will do “according to thine anger, and according to thine envy.” Edom rejoiced that Israel’s inheritance was desolate, “so will I do unto thee.” The Hebrew noun for desolation comes seven times in these fifteen verses, out of twenty-two in the whole book; Edom said of Israel’s mountains, “They are laid desolate,” and desolation is what it is given.

  The book’s refrain, “know that I am the LORD,” comes four times (verses 4, 9, 12, 15; see the note on [[Ezek. 6:7]]). And the chapter is half of something larger. What it takes from Seir, whose “cities shall not return,” the next chapter gives to the mountains of Israel: “the cities shall be inhabited, and the wastes shall be builded” ([[Ezek. 36:10]]).

sections:
  - range: 1-4
    heading: 'I am against thee, O mount Seir'
    plain: |
      The word of the Lord comes to Ezekiel: Set your face against mount Seir and prophesy against it. The Lord God says: I am against you, mount Seir. I will stretch out my hand against you and make you utterly desolate. I will lay your cities waste, and you will be desolate, and you will know that I am the Lord.
  - range: 5-9
    heading: 'Because of blood'
    plain: |
      Because you have kept a perpetual hatred, and have shed the blood of the children of Israel by the sword in the time of their calamity, the time when their iniquity came to its end, as I live, says the Lord God, I will prepare you for blood, and blood will pursue you. Since you have not hated blood, blood will pursue you. I will make mount Seir utterly desolate and cut off from it everyone who goes out and everyone who comes back. I will fill its mountains with its slain; on your hills, in your valleys, and in all your rivers those slain by the sword will fall. I will make you desolate for ever, and your cities will not return, and you will know that I am the Lord.
  - range: 10-13
    heading: 'Because of words'
    plain: |
      Because you have said, These two nations and these two countries will be mine, and we will possess it, whereas the Lord was there, as I live, says the Lord God, I will do to you according to the anger and the envy you showed out of your hatred against them, and I will make myself known among them when I have judged you. You will know that I am the Lord, and that I have heard all the blasphemies you have spoken against the mountains of Israel, saying, They are laid desolate; they are given to us to consume. With your mouth you have boasted against me and multiplied your words against me. I have heard them.
  - range: 14-15
    heading: 'As thou didst rejoice'
    plain: |
      The Lord God says: When the whole earth rejoices, I will make you desolate. As you rejoiced over the inheritance of the house of Israel because it was desolate, so I will do to you. You will be desolate, mount Seir, and all Idumea, all of it; and they will know that I am the Lord.

notes:
  - ref: 2
    phrase: 'set thy face against mount Seir'
    kind: history
    title: 'Why Edom again, and why here'
    body: |
      Mount Seir is Edom, and this oracle stands among the promises to Israel because it is the first half of one of them: the next chapter turns to the mountains of Israel and reverses what is said here. Seir is “the mountain ridge that ran south from the Dead Sea through the land of Edom,” and Genesis settles Esau on it: “Thus dwelt Esau in mount Seir: Esau is Edom” ([[Gen. 36:8]]). Ezekiel has already spoken against Edom among the neighbor nations (see the note on [[Ezek. 25:12]]). The question is why it is given a whole chapter now, after the news of the city’s fall and the promise of the one shepherd.

      The arrangement of the text points to the answer. No new “the word of the LORD came unto me” stands between this chapter and the opening of the next; that formula does not return until [[Ezek. 36:16]]. In between, the prophet is told, “prophesy unto the mountains of Israel” ([[Ezek. 36:1]]), and the enemy named in that prophecy is “all Idumea” ([[Ezek. 36:5]]). So the two passages have been read as “a connected prophecy,” with the promise to Israel’s mountains as “the obverse and completion” of the threat against Seir.
    sources: [bd-seir, keil-ezekiel, lds-scriptures]

  - ref: 5
    phrase: 'a perpetual hatred'
    kind: history
    title: 'An enmity as old as the two brothers'
    body: |
      The first charge is not a single act but an enmity that was kept, one that has been traced back to the brothers from whom the two nations came. The Hebrew is *eivat olam*. *Eivah* is “enmity, personal hostility,” the word used of the serpent and the woman in [[Gen. 3:15]]. As a charge against whole peoples it is listed in two places, here and in the Philistines’ “old hatred” ([[Ezek. 25:15]]), where the Hebrew phrase is the same. Modern translations have “perpetual enmity” or “an ancient enmity.”

      In Edom’s case the enmity is said to have “struck deeper root” than in the Philistines’, in the hostility of Esau toward Jacob: “And Esau hated Jacob because of the blessing wherewith his father blessed him” ([[Gen. 27:41]]). Amos had already charged the nation with keeping it: “his anger did tear perpetually, and he kept his wrath for ever” ([[Amos 1:11]]). And “In spite of the kinship,” wars between the two peoples “were of constant occurrence.” The notes on [[Jer. 49:7]] and [[Mal. 1:3]] say more about the two nations.
    sources: [bdb, oshb-wlc, esv, nrsvue, bd-edom, keil-ezekiel, lds-scriptures]

  - ref: 5
    phrase: 'in the time of their calamity'
    kind: history
    title: 'What Edom did, and when'
    body: |
      Edom’s act is dated to the fall of Jerusalem, and it was more than looking on. Where the King James has “shed the blood of the children of Israel by the force of the sword,” the Hebrew verb is “pour,” and the idiom, to pour someone out to the hands of the sword, means to “deliver over to” it. A modern translation has “gave over the people of Israel to the power of the sword.” The note on [[Ezek. 25:12]] gathers the other passages on what Edom did.

      Two phrases fix the time. “The time of their calamity” uses the Hebrew word that Obadiah has three times in a single verse, “in the day of their calamity” ([[Obad. 1:13]]). And “the time that their iniquity had an end” is, in Hebrew, the very phrase Ezekiel used earlier of Jerusalem’s ruler: “thou, profane wicked prince of Israel, whose day is come, when iniquity shall have an end” ([[Ezek. 21:25]]). It has been rendered “time of final punishment,” and modern translations follow: “at the time of their final punishment.”
    sources: [bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 6
    phrase: 'I will prepare thee unto blood'
    kind: words
    title: 'Blood, four times'
    body: |
      The sentence matches the crime, and the Hebrew word for blood, *dam*, comes four times in the one verse. The first clause is blunter than “prepare thee unto blood.” It can be rendered “I will make thee blood,” or, in a modern translation, “I will make you bloody.”

      Edom’s name means “Red,” and in Hebrew *edom* and *dam* sound alike. The expression has been explained as “probably chosen for the play upon the words,” so that “Edom shall become what its name suggests.” That is a judgment about the sound of the line; the text does not say so.

      “Blood shall pursue thee” pictures bloodshed as something on the killer’s track, “as blood-guiltiness invariably pursues a murderer, cries for vengeance, and so delivers him up to punishment.” The last clause gives the reason, and a modern translation makes the old word “sith” plain: “since you did not hate bloodshed, bloodshed will pursue you.” The ancient Greek translation has a shorter verse, with the word only twice: “thou hast sinned even to blood, therefore blood shall pursue thee.”
    sources: [keil-ezekiel, bd-edom, oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 10
    phrase: 'whereas the LORD was there'
    kind: scripture
    title: 'The LORD was there'
    body: |
      Edom’s second offense was to claim the land as if no one owned it, and the verse answers in a short clause: the LORD was there. The “two nations” and “two countries” are understood as “Israel and Judah with their lands.”

      The closing clause says what was wrong with the plan. A modern translation renders it “although the Lord was there.” A reader of Ezekiel may hesitate, since the book has shown the glory leaving Jerusalem: “the glory of the LORD went up from the midst of the city” ([[Ezek. 11:23]]). One answer is that the Lord “had really forsaken His dwelling-place in Canaan before the destruction of the temple, but without thereby renouncing His right to the land,” so that the clause marks Edom’s desire as “an attack upon Jehovah Himself.” The ancient Greek translation puts it in the present tense: “whereas the Lord is there.”

      Verse 11 draws the consequence: “I will make myself known among them, when I have judged thee.” “Them” has been taken as the Israelites. By punishing Edom, the Lord will “prove to Israel that He is a God who does not suffer His people and His possession to be attacked with impunity.” One modern translation follows the Greek instead and reads “among you.”

      The divine name and the Hebrew word “there” come together again in the last words of the book, the name of the city Ezekiel sees: “The LORD is there” ([[Ezek. 48:35]]).
    sources: [keil-ezekiel, oshb-wlc, esv, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 12
    phrase: 'I have heard all thy blasphemies'
    kind: words
    title: 'Words against the land, heard by the Lord'
    body: |
      What Edom said about Israel’s hills, the Lord takes as said about Himself. The speech is quoted: “They are laid desolate, they are given us to consume,” or, in other renderings, “given us to devour” and given “for food.” It is aimed at “the mountains of Israel.” Yet the next verse says, “with your mouth ye have boasted against me.” The Hebrew word translated “blasphemies” is defined as “contempt” toward the Lord, and it is used here of words spoken against a land.

      “I have heard” is said twice, in verses 12 and 13.

      The reply comes in the next chapter, which begins by quoting a like boast: “Because the enemy hath said against you, Aha, even the ancient high places are ours in possession” ([[Ezek. 36:2]]). The Lord then speaks “against all Idumea, which have appointed my land into their possession with the joy of all their heart” ([[Ezek. 36:5]]).
    sources: [bdb, esv, lxx-rahlfs, lds-scriptures]

  - ref: 14
    phrase: 'When the whole earth rejoiceth'
    kind: symbol
    title: 'Edom, Idumea, and the world'
    body: |
      The oracle ends by setting Edom over against the whole earth, and that contrast is one reason Edom has been read as standing for more than one small nation. The line has been explained to mean that “when joy is prepared for all the world,” desolation is prepared for Edom, from which “It follows… that Edom represents the world at enmity against God.” A modern translation has “While the whole earth rejoices, I will make you desolate.” Verse 15 then states the measure, as Obadiah had: “as thou hast done, it shall be done unto thee” ([[Obad. 1:15]]).

      “Idumea” in verse 15 is simply *Edom* in the Hebrew. The King James uses the later name: “From the time of the Maccabees it was known as Idumea.” Modern revelation takes up that name, and gives it its meaning: the Lord “shall come down in judgment upon Idumea, or the world” ([[D&C 1:36]]).

      So Edom is read on two levels. As history, the nation itself came to an end. As a figure, Edom or Idumea “has become a symbol for the wicked world that exists today.” The notes on [[Isa. 34:5]] and [[Mal. 1:4]] follow the name and the ruin further.
    sources: [keil-ezekiel, ot-manual-27, bd-edom, bd-idumea, esv, oshb-wlc, lds-scriptures]

christ: |
  The one who says “I am against thee,” who “was there” in the emptied land and heard what was said over it, is the LORD, Jehovah (see the note on [[Ezek. 1:26]]). Words spoken against the mountains of Israel He calls words “against me” (verse 13).

  The name the chapter ends on, Idumea, is the one modern revelation uses for the world He will judge at His coming ([[D&C 1:36]]; see the note on verse 14). Edom in this chapter has also been set beside Edom in Isaiah, where the prophet asks, “Who is this that cometh from Edom, with dyed garments from Bozrah?” ([[Isa. 63:1]]). A revelation to Joseph Smith takes up Isaiah’s question and answers it: “the Lord shall be red in his apparel” ([[D&C 133:48]]). The note on [[Isa. 63:1]] treats that passage.

explore: |
  - The other half of this prophecy, spoken to the mountains of Israel: [[Ezek. 36:1–15]].
  - Ezekiel’s earlier and shorter word against Edom: [[Ezek. 25:12–14]].
  - Obadiah’s charges against Edom in the day of Jerusalem’s calamity: [[Obad. 1:10–15]].
  - Jeremiah’s oracle against Edom: [[Jer. 49:7–22]].
  - Where the enmity begins: [[Gen. 27:41–45]].
  - The Lord coming from Edom, in Isaiah and in modern revelation: [[Isa. 63:1–6]] and [[D&C 133:46–51]].

