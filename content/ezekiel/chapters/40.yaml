chapter: 40
title: 'The Man with the Measuring Reed'
tagline: 'Fourteen years after Jerusalem fell, Ezekiel is set on a high mountain in the land of Israel and led by a shining guide through the walls, gates, and courts of a temple, while every part is measured.'
when: 'Dated in the text: “the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten” (40:1), about 573 B.C. The book gives no later date in chapters 41–48.'

setting: |
  It is the twenty-fifth year of the captivity, and Jerusalem has been “smitten” for fourteen years. Ezekiel is still among the exiles in Babylon when the hand of the Lord takes him, “in the visions of God,” to the land of Israel. He had been taken that way once before, to Jerusalem, to see the idolatry in the temple and to watch the glory of the Lord leave it ([[Ezek. 8:3]]; [[Ezek. 11:23]]). This time he is shown a temple and led through it.

  Chapters 40–48 are the last of the book’s four divisions, “visions of the reconstruction of the temple and its worship,” and they are “unique in prophecy.” They follow the promises of chapters 33–39, among them that the Lord “will set my sanctuary in the midst of them for evermore” ([[Ezek. 37:26]]).

  No temple has been built to this plan. Elder James E. Talmage wrote, “Certain it is that the Temple of the vision has not yet been builded.” It is to stand in Jerusalem before the Second Coming: the vision’s last chapters have been called “the description of the latter-day temple in Jerusalem,” and Joseph Smith taught that “Judah must return, Jerusalem must be rebuilt, and the temple,” and that “all this must be done before the Son of Man will make His appearance.”

thread: |
  The chapter is a guided walk from the outside of a walled compound to the door of the house at its center, and everything on the way is measured. The man begins at the outer wall (verse 5) and goes up into the east gate (6–16). He crosses the outer court to the north and south gates (17–27), enters the inner court by its south gate, and measures its three gates (28–37). Ezekiel is shown where the offerings are prepared and where the priests have their chambers (38–46). The inner court is measured with its altar (47), and the walk stops at the porch of the house (48–49). Chapter 41 goes inside.

  The prose repeats because the plan does. Every gate is “according to these measures,” fifty cubits long and twenty-five broad. It is a hundred cubits from each outer gate to the inner gate that faces it, and the inner court is a hundred cubits square.

  Two things change as the walk goes on. The ground rises, by seven steps and then by eight. And one court lies inside another: the double courts, it has been said, made this plan more exclusive than the sacred area of Solomon’s temple had been.

sections:
  - range: 1-4
    heading: 'The mountain and the guide'
    plain: |
      In the twenty-fifth year of the captivity, at the beginning of the year, on the tenth day of the month, in the fourteenth year after the city was smitten, the hand of the Lord is on Ezekiel and brings him there. In the visions of God he is brought into the land of Israel and set on a very high mountain, by which is something like the frame of a city on the south. There he sees a man whose appearance is like brass, with a line of flax and a measuring reed in his hand, standing in the gate. The man tells him to look with his eyes, hear with his ears, and set his heart on everything he is shown, because he was brought here to be shown it; and he is to declare all that he sees to the house of Israel.
  - range: 5-16
    heading: 'The wall and the east gate'
    plain: |
      A wall runs all around the outside of the house. The reed in the man’s hand is six cubits long, by the cubit and a handbreadth. He measures the wall: one reed broad and one reed high.

      He comes to the gate that faces east, goes up its stairs, and measures its threshold, one reed. Each little chamber is one reed long and one reed broad, with five cubits between them, and the threshold by the porch of the gate within is one reed. The porch of the gate is eight cubits and its posts two cubits, and the porch is inward. There are three little chambers on each side of the gate, all of one measure, and the posts on each side are of one measure. The entry of the gate is ten cubits broad, and the length of the gate thirteen cubits. There is a space of one cubit before the little chambers on each side, and the chambers are six cubits on each side. From the roof of one little chamber to the roof of the other, the gate is twenty-five cubits broad, door against door. He makes the posts sixty cubits, to the post of the court round about the gate. From the front of the gate of the entrance to the front of the porch of the inner gate is fifty cubits. There are narrow windows in the little chambers and their posts within the gate all around, and in the arches, and on each post are palm trees.
  - range: 17-27
    heading: 'The outer court and its north and south gates'
    plain: |
      He brings Ezekiel into the outer court. There are chambers there, and a pavement made for the court all around, with thirty chambers on the pavement. The pavement beside the gates, matching their length, is the lower pavement. From the front of the lower gate to the front of the inner court outside he measures a hundred cubits, eastward and northward.

      He measures the gate of the outer court that faces north. Its little chambers, three on each side, its posts, and its arches are by the measure of the first gate: fifty cubits long and twenty-five broad. Its windows, arches, and palm trees are like those of the east gate. Seven steps go up to it, and its arches are before them. A gate of the inner court stands opposite the gate on the north, as on the east, and from gate to gate is a hundred cubits.

      He brings Ezekiel toward the south, where there is a gate, and measures its posts and arches by the same measures. It has windows like the others and is fifty cubits long and twenty-five broad. Seven steps go up to it, its arches are before them, and it has palm trees on its posts, one on each side. There is a gate in the inner court toward the south, and from gate to gate is a hundred cubits.
  - range: 28-37
    heading: 'The three gates of the inner court'
    plain: |
      He brings Ezekiel to the inner court by the south gate and measures that gate by the same measures: its little chambers, posts, and arches, with windows all around, fifty cubits long and twenty-five broad. The arches round about are twenty-five cubits long and five broad. Its arches face the outer court, palm trees are on its posts, and eight steps go up to it.

      He brings him into the inner court toward the east and measures the gate there by the same measures, with its little chambers, posts, arches, and windows, fifty cubits long and twenty-five broad. Its arches face the outer court, palm trees are on its posts on each side, and eight steps go up to it.

      He brings him to the north gate and measures it by the same measures, with its little chambers, posts, arches, and windows, fifty cubits long and twenty-five broad. Its posts face the outer court, palm trees are on its posts on each side, and eight steps go up to it.
  - range: 38-47
    heading: 'Tables for the offerings and chambers for the priests'
    plain: |
      By the posts of the gates are chambers with their entries, where the burnt offering is washed. In the porch of the gate are two tables on each side, on which to slay the burnt offering, the sin offering, and the trespass offering. Outside, as one goes up to the entry of the north gate, are two tables, and two more on the other side at the porch of the gate: four tables on this side and four on that, eight tables on which the sacrifices are slain. Four tables of hewn stone are for the burnt offering, a cubit and a half long, a cubit and a half broad, and one cubit high, and on them are laid the instruments used to slay the burnt offering and the sacrifice. Within are hooks, a hand broad, fastened all around, and on the tables is the flesh of the offering.

      Outside the inner gate, in the inner court, are the chambers of the singers, at the side of the north gate and facing south, and one at the side of the east gate facing north. The man says that the chamber facing south is for the priests who keep the charge of the house, and the chamber facing north is for the priests who keep the charge of the altar. These are the sons of Zadok among the sons of Levi, who come near to the Lord to minister to Him. He measures the court: a hundred cubits long and a hundred broad, foursquare, with the altar before the house.
  - range: 48-49
    heading: 'The porch of the house'
    plain: |
      He brings Ezekiel to the porch of the house and measures each post of the porch, five cubits on each side; the breadth of the gate is three cubits on each side. The porch is twenty cubits long and eleven broad. He brings him by the steps that go up to it, and there are pillars by the posts, one on each side.

notes:
  - ref: 1
    phrase: 'in the beginning of the year, in the tenth day of the month'
    kind: history
    title: 'The tenth day of the first month'
    body: |
      The date has been read since the ancient Greek translation as the tenth day of the first month, the day on which Israel was told to choose the Passover lamb. The Hebrew phrase behind “the beginning of the year” does not name a month. The Greek supplies one: “in the first month, on the tenth day of the month.” On that reading the phrase is “a contracted repetition” of what the Lord said of the Passover month, “This month shall be unto you the beginning of months” ([[Ex. 12:2]]), and the day is the one in the next verse: “In the tenth day of this month they shall take to them every man a lamb” ([[Ex. 12:3]]). It was the day “on which the preparations for the Passover” began, and so it has been called “well adapted for the revelation of the new constitution of the kingdom of God.”

      There is another tenth day that opened a year. The trumpet of the jubilee sounded “on the tenth day of the seventh month, in the day of atonement” ([[Lev. 25:9]]). That reading has been set aside on the ground that “the custom of beginning the year with the month Tishri was introduced long after the captivity.” The text itself does not say which month is meant.
    sources: [keil-ezekiel, lxx-rahlfs, lds-scriptures]

  - ref: 2
    phrase: 'set me upon a very high mountain'
    kind: scripture
    title: 'A very high mountain, and something like a city'
    body: |
      Ezekiel is carried to a high mountain that he does not name, as Moses, Nephi, and John were for visions of their own. Moses “was caught up into an exceedingly high mountain” ([[Moses 1:1]]). Nephi “was caught away in the Spirit of the Lord, yea, into an exceedingly high mountain” ([[1 Ne. 11:1]]), and an angel led him through what he saw. John was carried “to a great and high mountain” and shown the holy Jerusalem ([[Rev. 21:10]]). A heavenly being who guides a prophet through a vision is “one feature common to apocalypses, both Jewish and Christian,” and these chapters are among the examples.

      The mountain is in “the land of Israel.” Earlier in the book the Lord had named the place where Israel would again serve Him: “in mine holy mountain, in the mountain of the height of Israel” ([[Ezek. 20:40]]). Later in this vision the house stands “upon the top of the mountain” ([[Ezek. 43:12]]). The mountain has been identified with Mount Zion, the mountain of the Lord’s house that Isaiah and Micah foresaw ([[Isa. 2:2]]; [[Micah 4:1]]).

      What Ezekiel sees on it is “as the frame of a city.” The Hebrew word means a “structure,” and modern translations have “a structure like a city to the south.” The man stands in its gate, and the gate turns out to belong to the wall around the house (verses 5–6). One reading takes the structure to be “the building of the new temple, with its surrounding wall and its manifold court buildings.” The city itself is described at the end of the vision ([[Ezek. 48:30–35]]).
    sources: [lds-scriptures, sc-knowhy-492, keil-ezekiel, bdb, esv, nrsvue]

  - ref: 3
    phrase: 'whose appearance was like the appearance of brass'
    kind: history
    title: 'The man like brass'
    body: |
      The shining guide “was probably not the Lord but an authorized messenger.” He shines as the creatures of the first vision did, whose feet “sparkled like the colour of burnished brass” ([[Ezek. 1:7]]); the ancient Greek translation has “shining brass” here. The man Daniel saw in vision had arms and feet “like in colour to polished brass” ([[Dan. 10:6]]).

      Later in the vision Ezekiel hears a voice from the house while the guide is beside him. When the glory of the Lord fills the house, he writes, “I heard him speaking unto me out of the house; and the man stood by me” ([[Ezek. 43:6]]).

      The man says very little. He gives the charge of verse 4, explains the two chambers in verses 45–46, and in the next chapter names one room: “This is the most holy place” ([[Ezek. 41:4]]). The rest of the time he measures.
    sources: [ot-manual-27, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: 'a line of flax in his hand, and a measuring reed'
    kind: symbol
    title: 'A cord and a rod'
    body: |
      The man carries two builder’s tools, a cord for long distances and a rod for short ones. The “line of flax” is a linen cord, used here “as measuring line,” and the reed is a rod. In this chapter only the reed is used. The line comes out at the river: “the man that had the line in his hand went forth eastward, he measured a thousand cubits” ([[Ezek. 47:3]]).

      Other prophets saw the same tools. Zechariah saw “a man with a measuring line in his hand” ([[Zech. 2:1]]). John was given “a reed like unto a rod” and told, “Rise, and measure the temple of God” ([[Rev. 11:1]]), and the angel who showed him the holy city “had a golden reed to measure the city, and the gates thereof, and the wall thereof” ([[Rev. 21:15]]).

      This chapter does not say what the measuring is for. When the last wall has been measured, the vision says what that wall is for: “to make a separation between the sanctuary and the profane place” ([[Ezek. 42:20]]).
    sources: [brown-cube, bdb, lds-scriptures]

  - ref: 4
    phrase: 'declare all that thou seest to the house of Israel'
    kind: scripture
    title: 'Why every measurement is reported'
    body: |
      The measurements are for the exiles, and the Lord says later what they are meant to do. “Thou son of man, shew the house to the house of Israel, that they may be ashamed of their iniquities: and let them measure the pattern” ([[Ezek. 43:10]]). If they are ashamed, Ezekiel is to “write it in their sight, that they may keep the whole form thereof” ([[Ezek. 43:11]]).

      Elder James E. Talmage wrote that the immediate purpose of the vision appears to have been to awaken Israel “to a realization of their fallen state and a conception of their departed glory.” Whether Ezekiel took the design as one to be built, he added, “or as but a grand yet unattainable ideal, is not declared.”

      The charge is to use eyes, ears, and heart, and the Lord repeats it when the tour of the building is done: “mark well, and behold with thine eyes, and hear with thine ears” ([[Ezek. 44:5]]). What Ezekiel is given to report is mostly lengths and breadths; the “scarcity of height measurements” in so exact a description has been noticed.
    sources: [lds-scriptures, ot-manual-27, rennaker-holiness]

  - ref: 5
    phrase: 'by the cubit and an hand breadth'
    kind: words
    title: 'A longer cubit'
    body: |
      The reed is about ten and a half feet long, because it is reckoned in a cubit longer than the ordinary one. A cubit was the “distance from the elbow to the tip of the finger, normally about 17½ inches.” Ezekiel’s cubit adds a handbreadth to that, which makes it about 21 inches, and six of them make a reed of about 10½ feet. The vision states the unit again when it comes to the altar: “The cubit is a cubit and an hand breadth” ([[Ezek. 43:13]]). The text does not say why the longer cubit is used.

      With that unit the chapter’s numbers can be pictured. The outer wall is as thick as it is high, about ten and a half feet. A gate fifty cubits long runs about eighty-seven feet, and the inner court of a hundred cubits is about a hundred and seventy-five feet on a side.
    sources: [lds-scriptures, bd-weights-and-measures]

  - ref: 6
    phrase: 'the gate which looketh toward the east'
    kind: history
    title: 'The east gate, measured first'
    body: |
      The first gate measured is the one the Lord will use. When the tour is finished Ezekiel is brought back to it, and “the glory of the LORD came into the house by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]). The glory had left the old temple toward the east (see the note on [[Ezek. 11:23]]). Afterward the gate is closed: “This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the LORD, the God of Israel, hath entered in by it” ([[Ezek. 44:2]]).

      The gate is a building in its own right. It is a passage fifty cubits long (verse 15) with three “little chambers” on each side (verse 10), which a modern translation calls “side rooms.” The gateway “seems to have served as a station for guards,” and its plan of three chambers to a side is “similar to the city-gate structures archaeologists have uncovered” at some of Solomon’s cities. The north and south gates are made to the same measures (verses 21 and 24).
    sources: [lds-scriptures, brown-cube, rennaker-holiness, esv]

  - ref: 16
    phrase: 'upon each post were palm trees'
    kind: symbol
    title: 'Palm trees on the posts'
    body: |
      The palm trees are ornaments on the gateposts, and Solomon’s temple had palm trees carved on its walls. Solomon “carved all the walls of the house round about with carved figures of cherubims and palm trees and open flowers” ([[1 Kgs. 6:29]]). In Ezekiel’s temple palms are on the posts of all six gates (verses 16, 22, 26, 31, 34, and 37). Inside the house they are joined by cherubim: “a palm tree was between a cherub and a cherub” ([[Ezek. 41:18]]).

      The cherubim and palm trees on the walls and doors of the house have been read as “imagery of the Garden of Eden,” where cherubim were set to keep the way of the tree of life ([[Gen. 3:24]]). The gates have the palms alone; the cherubim appear only at the house. The text itself gives the palms no meaning.
    sources: [lds-scriptures, rennaker-holiness]

  - ref: 22
    phrase: 'they went up unto it by seven steps'
    kind: symbol
    title: 'Seven steps, then eight'
    body: |
      Each stage of the walk is higher than the one before. The outer gates are reached by seven steps (verses 22 and 26) and the inner gates by eight (verses 31, 34, and 37). The house has steps of its own (verse 49). The Hebrew does not number those; the ancient Greek translation has “they went up to it by ten steps,” and modern translations follow it. The Greek also supplies the number at the first gate, where the Hebrew of verse 6 has only “the stairs”: “he entered by seven steps.”

      So the reader “moves progressively higher up the temple compound.” Because the first and last flights are not counted in the Hebrew, it has been argued that “the emphasis of the author was on the general concept of height, not on a precise physical measurement.” The stairs carry “the symbolism of ascending vertically towards increasingly sacred space”: the nearer to the house, the higher the ground, and the whole stands on a very high mountain (verse 2).
    sources: [rennaker-holiness, lxx-rahlfs, esv, nrsvue]

  - ref: 39
    phrase: 'to slay thereon the burnt offering'
    kind: prophets
    title: 'Tables for sacrifice in a temple still to be built'
    body: |
      A temple not yet built is furnished for animal sacrifice, and President Joseph Fielding Smith taught that such offerings will be restored for a time. The text counts eight tables at the gate on which the sacrifices are slain (verse 41), and four tables of hewn stone for the burnt offering, on which the instruments are laid (verse 42).

      When John the Baptist conferred the Aaronic Priesthood, he said it would not be taken from the earth “until the sons of Levi do offer again an offering unto the Lord in righteousness” ([[D&C 13:1]]). President Smith taught that animal sacrifice will be offered again long enough to complete the restoration in this dispensation, and that afterward sacrifice will be of another kind. The question belongs with the altar and its offerings, and is taken up at [[Ezek. 43:18–27]].
    sources: [lds-scriptures, ot-manual-27]

  - ref: 44
    phrase: 'the chambers of the singers'
    kind: words
    title: 'Singers, or two chambers?'
    body: |
      The Hebrew of verse 44 speaks of chambers “of the singers,” but the next two verses give the same rooms to priests, and the ancient Greek translation reads “two chambers.” In Hebrew the words for “singers” and “two” differ by one letter. The Greek reading has been preferred because in Israel’s worship “a sharp distinction is made between the Levitical singers and the priests,” and because verses 45–46 speak of only two rooms.

      The Greek also puts the second chamber at the south gate, not the east: “one behind the southern gate, but which looks to the north.” The two rooms then face each other across the inner court. Modern translations adopt both changes: “two chambers in the inner court, one at the side of the north gate facing south, the other at the side of the south gate facing north.” One of them notes, “Septuagint; Hebrew were chambers for singers.”

      The King James Version follows the Hebrew as it stands. On either reading, what the rooms are for is said in verses 45–46.
    sources: [keil-ezekiel, lxx-rahlfs, esv, nrsvue]

  - ref: 46
    phrase: 'these are the sons of Zadok'
    kind: history
    title: 'The sons of Zadok'
    body: |
      One priestly family is named to serve at the altar of this temple, the family of the priest who stayed loyal to David. Zadok “remained faithful to David” when Adonijah tried to take the throne. He anointed Solomon and “was finally put in the room of Abiathar.” Ezekiel was himself a priest “of the family of Zadok.”

      The verse does not give the reason for the choice. It comes later in the vision: the sons of Zadok “kept the charge of my sanctuary when the children of Israel went astray from me” ([[Ezek. 44:15]]). A modern translation makes the limit explicit, rendering this verse “who alone among the sons of Levi may come” near to the Lord. The fuller account, with the Levites who went astray, is at [[Ezek. 44:10–16]].
    sources: [bd-zadok, bd-ezekiel, lds-scriptures, esv]

  - ref: 48
    phrase: 'he brought me to the porch of the house'
    kind: history
    title: 'At the porch of the house'
    body: |
      The chapter stops at the entrance of the temple itself, at a porch as long as Solomon’s with two pillars by it, as his had. Solomon’s porch was twenty cubits long: “twenty cubits was the length thereof, according to the breadth of the house” ([[1 Kgs. 6:3]]). Ezekiel’s is twenty cubits long as well (verse 49). In front of Solomon’s porch “stood two great pillars of hollow brass, called Jachin and Boaz,” and the pillars of verse 49 stand by the posts “like the columns Jachin and Boaz.”

      The order of the walk has been read as meaningful. Ezekiel “is guided through six gates,” each with three chambers on a side, before he reaches the house, which has three parts of its own: the porch, the temple, and the most holy place ([[Ezek. 41:1–4]]). It has been suggested that “in two times three gates there is opened the access to the similarly tripartite seventh structure,” with “something of the rhythm” of the creation week and its seventh, sanctified day. That is a reading of the plan; the text does not say it.
    sources: [lds-scriptures, bd-temple-of-solomon, keil-ezekiel, rennaker-holiness]

christ: |
  The gate the man measures first is the gate by which the Lord comes in. When the measuring is done, Ezekiel is brought back to it: “And, behold, the glory of the God of Israel came from the way of the east” ([[Ezek. 43:2]]). This chapter measures the way in; He arrives in chapter 43 (for who the LORD of this book is, see the note on [[Ezek. 1:26]]).

  John too was taken to a great and high mountain, where an angel measured the holy Jerusalem with a reed ([[Rev. 21:10]]; [[Rev. 21:15]]). Of that city he wrote, “And I saw no temple therein: for the Lord God Almighty and the Lamb are the temple of it” ([[Rev. 21:22]]).

explore: |
  - Inside the house, to the room the guide names: [[Ezek. 41:1–4]].
  - What the wall around it all is for: [[Ezek. 42:15–20]].
  - The glory returning by the east gate, and what Israel is to do with the plan: [[Ezek. 43:1–12]].
  - The earlier vision of the temple, which this one answers: [[Ezek. 8–11]].
  - Solomon’s temple, for comparison: [[1 Kgs. 6]] and [[1 Kgs. 7:15–22]].
  - The mountain of the Lord’s house in the last days: [[Isa. 2:2–3]].
  - John’s city, measured with a golden reed: [[Rev. 21:10–27]].
  - How the vision arranges holy space, by height and by direction, is the subject of Jacob Rennaker’s “Approaching Holiness: Sacred Space in Ezekiel’s Temple Vision” (Religious Studies Center, 2013).

