chapter: 26
title: 'A Bare Rock in the Midst of the Sea'
tagline: 'Tyre cheered when Jerusalem fell, expecting to gain by it. The Lord answers that nations will come up against the island city like waves, and that the princes who traded with her will sing her funeral song.'
when: 'The eleventh year of Jehoiachin’s captivity (about 586 B.C.), “in the first day of the month.” The Hebrew text does not name the month. By the book’s own count this is the year Jerusalem was smitten ([[Ezek. 40:1]]).'

setting: |
  Chapter 25 spoke to four of Judah’s smaller neighbors. With this chapter the book turns to Tyre and stays there for almost three chapters. The prophecy has four parts: this chapter’s threat against the city, “a lamentation over this destruction” in chapter 27, a threat against Tyre’s ruler, and a lamentation over his fall ([[Ezek. 28:1–19]]). All of it belongs to the prophecies against foreign nations in chapters 25–32, which are like the collections in Isaiah 13–23 and Jeremiah 46–51.

  Tyre was “an important commercial and seaport town,” “in alliance with David” and with Solomon in earlier generations. In Ezekiel’s day it was a city in two parts, “one on the main land, and the other on a rock in the sea.” It had dealings with Jerusalem under Zedekiah as well: Jeremiah was told to send a yoke “to the king of Tyrus” by the messengers who had come to Zedekiah ([[Jer. 27:3]]).

thread: |
  The chapter opens with what Tyre said over Jerusalem, and before it ends others are saying a lament over Tyre. Tyre’s word is “Aha”: Jerusalem is broken, and Tyre expects to be filled (verse 2). The Lord’s answer comes in four parts, each beginning “thus saith the Lord GOD” (verses 3, 7, 15, and 19).

  The first gives the sentence in general terms: many nations will come, and the city will be left a bare rock where nets are spread (3–6). The second names the first of those nations, Babylon under Nebuchadrezzar, and follows his siege from the mainland towns to the streets of the city (7–14). The third looks out to sea, where the princes of the sea come down from their thrones and raise a lamentation (15–18). The fourth sends the city down to the dead (19–21).

  The sea is in every part. The nations come “as the sea causeth his waves to come up”; the stones and timber are laid “in the midst of the water”; the isles shake; and at the end “great waters shall cover thee.”

  The book’s refrain stands at verse 6, said here of a foreign city: “they shall know that I am the LORD” (see the note on [[Ezek. 6:7]]).

sections:
  - range: 1-6
    heading: 'Tyre’s “Aha” and the Lord’s answer'
    plain: |
      In the eleventh year, on the first day of the month, the word of the Lord comes to Ezekiel. Tyre has said against Jerusalem, “Aha, she is broken that was the gates of the people; she is turned to me; I shall be filled, now that she is laid waste.” Therefore the Lord God says that He is against Tyre. He will bring many nations up against her as the sea brings up its waves. They will destroy her walls and break down her towers. He will scrape her dust from her and make her like the top of a rock. She will be a place for spreading nets in the midst of the sea, for He has spoken it, and she will become spoil for the nations. Her daughters in the field will be killed by the sword, and they will know that He is the Lord.
  - range: 7-14
    heading: 'Nebuchadrezzar’s siege'
    plain: |
      The Lord God says that He will bring against Tyre Nebuchadrezzar king of Babylon, a king of kings, from the north, with horses, chariots, horsemen, companies, and many people. He will kill her daughters in the field with the sword. He will build a fort against her, cast up a mount against her, and lift up the shield against her. He will set engines of war against her walls and break down her towers with his axes. His horses will be so many that their dust covers her. Her walls will shake at the noise of horsemen, wheels, and chariots when he enters her gates as men enter a city that has been breached. The hoofs of his horses will tread down all her streets. He will kill her people with the sword, and her strong garrisons will go down to the ground.

      They will plunder her riches and her merchandise, break down her walls, destroy her pleasant houses, and lay her stones, timber, and dust in the midst of the water. The Lord will make the noise of her songs cease, and her harps will be heard no more. He will make her like the top of a rock, a place to spread nets on. She will be built no more, for the Lord has spoken it.
  - range: 15-18
    heading: 'The princes of the sea lament'
    plain: |
      The Lord God says to Tyre: Will not the isles shake at the sound of her fall, when the wounded cry and the slaughter is made within her? All the princes of the sea will come down from their thrones, lay aside their robes, and take off their embroidered garments. They will clothe themselves with trembling, sit on the ground, tremble at every moment, and be astonished at her. They will take up a lamentation for her and say: How is she destroyed, the city inhabited by seafaring men, the renowned city that was strong in the sea, she and her inhabitants, who put their terror on all who frequent it! Now the isles will tremble in the day of her fall, and the isles in the sea will be troubled at her departure.
  - range: 19-21
    heading: 'Down to the pit'
    plain: |
      The Lord God says: When He makes Tyre a desolate city, like the cities that are not inhabited, and brings up the deep over her so that great waters cover her, He will bring her down with those who descend into the pit, with the people of old time. He will set her in the low parts of the earth, in places desolate of old, with those who go down to the pit, so that she is not inhabited; and He will set glory in the land of the living. He will make her a terror, and she will be no more. Though she is sought for, she will never be found again.

notes:
  - ref: 1
    phrase: 'in the eleventh year, in the first day of the month'
    kind: history
    title: 'A date with no month'
    body: |
      The date gives a year and a day but no month, so the Hebrew text does not say whether this word came before or after Jerusalem fell. The eleventh year is the year of the fall. Jerusalem “was besieged unto the eleventh year of king Zedekiah” ([[Jer. 52:5]]); in the fourth month “the city was broken up” ([[Jer. 52:7]]), and in the fifth the temple was burned ([[Jer. 52:12–13]]). Ezekiel’s own book counts the same way, since its twenty-fifth year of the captivity is “the fourteenth year after that the city was smitten” ([[Ezek. 40:1]]).

      Tyre’s words in verse 2 speak of Jerusalem as already “broken” and “laid waste.” But Ezekiel was in Babylon, and the news did not reach him until “the twelfth year of our captivity, in the tenth month,” when a man who had escaped came saying, “The city is smitten” ([[Ezek. 33:21]]).

      Two modern translations do not keep the Hebrew date. Following a Greek manuscript, they read “In the twelfth year, in the eleventh month, on the first day of the month,” and one of them calls this the “Probable reading of the original Hebrew text.” By the book’s dates that would be less than a month after the fugitive arrived. The King James follows the Hebrew as it stands, as does the Greek translation commonly printed. With the Hebrew date the month is simply unknown.
    sources: [lds-scriptures, nrsvue, niv, lxx-rahlfs]

  - ref: 2
    phrase: 'she is broken that was the gates of the people'
    kind: history
    title: 'Why Tyre said “Aha”'
    body: |
      Tyre is glad that Jerusalem has fallen because it expects to profit, and that gladness is the charge the verse brings against it. “Aha” was “an expression of malicious joy.” Ammon is condemned for the same word in the chapter before: “Because thou saidst, Aha, against my sanctuary, when it was profaned” ([[Ezek. 25:3]]).

      The Hebrew calls Jerusalem the “doors” of the peoples. The word is the one for the swinging leaves of a city gate, and this verse is listed as a figure “of Jerusalem as gate of people.” A modern translation keeps the picture: “the gate of the peoples is broken; it has swung open to me.” To be “replenished” is to be filled “with merchandise and wealth,” the verb the next chapter uses of Tyre at its height: “thou wast replenished, and made very glorious in the midst of the seas” ([[Ezek. 27:25]]).

      In what sense Jerusalem was a gate is disputed. The usual explanation is trade. Jerusalem was “a general emporium,” and with it gone the caravans from the east “will no longer be intercepted by the market” there. The objection is that “nothing is known to warrant the idea that Jerusalem was ever able to enter into rivalry with Tyre as a commercial city.” On the other reading, Jerusalem’s importance to other nations lay “in its sanctuary,” and what Tyre resented was “the force of attraction which Jerusalem had hitherto exerted upon the nations.” The verse itself settles only the motive: “I shall be replenished, now she is laid waste.”
    sources: [ot-manual-27, bdb, oshb-wlc, esv, keil-ezekiel, clarke-ezekiel, jfb-ezekiel, lds-scriptures]

  - ref: 4
    phrase: 'like the top of a rock'
    kind: symbol
    title: 'The city called Rock, scraped bare'
    body: |
      Tyre, whose name means “Rock,” is to be stripped down to a bare rock. “The top of a rock” translates a Hebrew phrase for the glaring surface of a rock, “a smooth, bare, rock,” and modern translations have “a bare rock.” The verse uses a different word for “rock” from the one in Tyre’s name. The picture is of the site with everything built on it gone, and the soil too: “I will also scrape her dust from her.” What is left is fit for one use, “a place for the spreading of nets.”

      Ezekiel uses the phrase in only one other passage, and there it is said of Jerusalem. Two chapters earlier the blood shed in that city was set “upon the top of a rock, that it should not be covered” ([[Ezek. 24:8]]).

      The sentence of the bare rock and the nets is said twice. It closes the first part of the oracle here and the second part at verse 14, where three words are added: “built no more.”
    sources: [bd-tyre, bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 7
    phrase: 'Nebuchadrezzar king of Babylon, a king of kings'
    kind: history
    title: 'Nebuchadrezzar, king of kings'
    body: |
      Nebuchadrezzar, the king of Babylon who besieged and took Jerusalem, is the one man the oracle names after its “many nations.” This is the first verse in Ezekiel’s book to name him; he is named again at [[Ezek. 29:18–19]] and [[Ezek. 30:10]]. The spelling with an *r* is the Hebrew’s, “Nebuchadrezzar; so throughout Ezekiel,” and he is the Nebuchadnezzar of Kings and Daniel, the “great king of Babylon,” whose reign is given as 604–561 B.C.

      “King of kings” is the title Daniel gives him to his face, with its reason: “Thou, O king, art a king of kings: for the God of heaven hath given thee a kingdom, power, and strength, and glory” ([[Dan. 2:37]]). Jeremiah had sent word to the kings of the region, the king of Tyrus among them ([[Jer. 27:3]]), that the Lord had “given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant” ([[Jer. 27:6]]). In Ezekiel’s sentence the one who acts is the Lord: “Behold, I will bring upon Tyrus Nebuchadrezzar.”
    sources: [bd-nebuchadnezzar, esv, lds-scriptures]

  - ref: 8
    phrase: 'cast a mount against thee'
    kind: history
    title: 'Siege works against an island'
    body: |
      Verses 8–11 describe a siege on land, with ramps, rams, horses, and chariots, and readers have asked how that fits a city in the sea. The “daughters which are in the field” fall first. They are “the towns dependent upon Tyre,” and modern translations render the phrase “her daughters on the mainland” or “its daughter towns inland.” Then the works go up: a fort, a “mount” (a siege ramp), and the “buckler,” which modern translations take as “a roof of shields” under which the besiegers worked. The “engines of war” are battering rams.

      One explanation is that these verses are about the mainland half of the city, because “forts, mounts, engines of war, horses, and chariots could not be brought to act against the other.” Another explanation keeps the island in view and points to verse 10, where the enemy enters “as men enter into a city wherein is made a breach.” On that reading the comparison means the island will be entered as a fortress on land is, and the words “presuppose that the besieger has made a road to the city by throwing up an embankment or dam.” Either way the two places “formed only one city, and one state.”

      What came of the siege is in the note on [[Ezek. 26:14]].
    sources: [keil-ezekiel, clarke-ezekiel, esv, nrsvue, lds-scriptures]

  - ref: 14
    phrase: 'thou shalt be built no more'
    kind: history
    title: 'How the prophecy was fulfilled'
    body: |
      Nebuchadrezzar did besiege Tyre, but the book itself says he came away unpaid, and the rest of this chapter’s sentence has been read as carried out later by others of the “many nations.” In a word dated to the twenty-seventh year ([[Ezek. 29:17]]), the Lord says that Nebuchadrezzar “caused his army to serve a great service against Tyrus: every head was made bald, and every shoulder was peeled: yet had he no wages, nor his army, for Tyrus” ([[Ezek. 29:18]]). The siege has been reckoned at thirteen years. He is understood to have taken the city on the mainland, while the island held out against him.

      The chapter’s wording leaves room for more than one conqueror. Verse 3 promises “many nations,” and at verse 12 the verbs change from “he” to “they,” which has been taken to mark “that what he did was not the whole, but only paved the way for others to complete the work begun by him.” The details that had seemed unfulfilled for nearly three hundred years (the dust scraped off, the stones and timber laid in the water) are seen as fulfilled in 332 B.C., when Alexander the Great laid siege to the island city, half a mile off the shore. To reach it he “took the timbers, stones, rubbish, etc. of old Tyre, and filled up the space between it and new Tyre.” From then on the island was joined to the mainland.

      “Built no more” is the hard phrase, because there was a Tyre afterward. When the temple was rebuilt after the exile, cedar was bought from “them of Tyre” ([[Ezra 3:7]]). Jesus went “into the borders of Tyre and Sidon” ([[Mark 7:24]]). Paul’s ship “landed at Tyre,” and he found disciples there ([[Acts 21:3–4]]). One answer is that the mainland city is meant: the phrase was “fulfilled as to the mainland Tyre, under Nebuchadnezzar,” and “the ruined city on the shore was not rebuilt.” The chapter’s last words, “thou shalt be no more” ([[Ezek. 26:21]]), have been explained as speaking of what Tyre had been: “Not that there was to be no more a Tyre, but she was no more to be the Tyre that once was.”
    sources: [ot-manual-27, bd-tyre, clarke-ezekiel, jfb-ezekiel, lds-scriptures]

  - ref: 16
    phrase: 'come down from their thrones'
    kind: symbol
    title: 'Princes of the sea in mourning'
    body: |
      When the princes leave their thrones, take off their robes, and sit on the ground, they are doing what mourners do. The scene “recalls the description” of Nineveh’s king, who “arose from his throne, and he laid his robe from him, and covered him with sackcloth, and sat in ashes” ([[Jonah 3:6]]). Ezekiel’s princes put on no sackcloth. In place of their robes “they shall clothe themselves with trembling,” which is to put on terrors “in the place of the robes of state which they have laid aside.” The book has used the figure before, of Judah’s own ruler: “the prince shall be clothed with desolation” ([[Ezek. 7:27]]).

      Who these princes are is explained from Isaiah, who said of Tyre that her “merchants are princes” ([[Isa. 23:8]]; see the note on [[Isa. 23:8]]). They are taken to be “the merchants presiding over the colonies of Tyre, who resembled princes,” and the “isles” that shake are the islands and “the coast lands of the Mediterranean Sea.” A modern translation has “coastlands.”

      In the ancient Greek translation the trembling is fear for themselves: they “fear their own destruction.”
    sources: [keil-ezekiel, esv, lxx-rahlfs, lds-scriptures]

  - ref: 17
    phrase: 'take up a lamentation for thee'
    kind: words
    title: 'The first dirge over Tyre'
    body: |
      What the princes sing is a *qinah*, a funeral dirge, and it is raised here over a city that has not yet fallen. The word and its poetry are explained in the note on [[Ezek. 19:1]]. It is the first of several over Tyre. In the next chapter Ezekiel is told, “take up a lamentation for Tyrus” ([[Ezek. 27:2]]), and after that, “take up a lamentation upon the king of Tyrus” ([[Ezek. 28:12]]).

      One line of the dirge is uncertain. The King James “that wast inhabited of seafaring men” renders Hebrew that is, word for word, “inhabited from the seas,” as a modern translation has it: “you who were inhabited from the seas.” The ancient Greek has no word for “inhabited” and reads, “How art thou destroyed from out of the sea.” Another modern translation follows the Greek: “How you have vanished from the seas.”

      On either reading the dirge names what Tyre was, “the renowned city, which wast strong in the sea.”
    sources: [bdb, oshb-wlc, esv, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 20
    phrase: 'them that descend into the pit'
    kind: symbol
    title: 'The city goes down to the dead'
    body: |
      The last part of the oracle speaks of the city as of a person who has died and gone down to the grave. “The pit” is the “pit of the grave,” and “those going down to (the) pit” is a set phrase for the dead. It is used elsewhere beside Sheol, “the Hebrew name for the abode of departed spirits,” and here it stands beside “the low parts of the earth.”

      Tyre goes down by water. “The deep” in “I shall bring up the deep upon thee” is in this verse the “(deep) sea, overwhelming Tyre.” The company waiting there is “the people of old time,” or in a modern translation “the people of long ago.”

      Ezekiel comes back to this picture at length when he speaks of Egypt, where nation after nation lies in “the nether parts of the earth, with them that go down into the pit” ([[Ezek. 32:18]]). “All the Zidonians” are among them ([[Ezek. 32:30]]).
    sources: [bdb, oshb-wlc, bd-sheol, nrsvue, lds-scriptures]

  - ref: 20
    phrase: 'I shall set glory in the land of the living'
    kind: words
    title: 'Glory in the land of the living'
    body: |
      In the Hebrew this clause is a promise set against Tyre’s descent: while she goes down to the dead, the Lord will “set glory in the land of the living.” The King James follows the Hebrew, and so does a modern translation that has “but I will set beauty” there.

      The ancient Greek translation read the line differently, as one more thing denied to Tyre: she will not be inhabited, “nor stand upon the land of life.” Other modern translations follow the Greek (“or have a place in the land of the living”) and say so in their notes, and several students of the Hebrew text have adopted the correction. So the clause is uncertain.

      Taken as the Hebrew stands, what is the glory? The verse does not say, and two readings have been offered. In one, “the land of the living” is the earth as against the place of the dead, and the thought is that after the glory of an ungodly power is overthrown the Lord “will create that which is glorious on the earth to endure for ever; and this He really does by the establishing of His kingdom.” In the other the land is Judah and the glory is the Lord’s presence there, “the antitype to which shall be Messiah.”
    sources: [esv, nrsvue, niv, lxx-rahlfs, bdb, oshb-wlc, keil-ezekiel, jfb-ezekiel]

christ: |
  The Savior went to the borders of Tyre and Sidon, and there a woman, “a Greek, a Syrophenician by nation,” asked Him to heal her daughter ([[Mark 7:24–26]]). People “from the sea coast of Tyre and Sidon” were in the multitude that “came to hear him, and to be healed of their diseases” ([[Luke 6:17]]).

  He also set the city beside Chorazin and Bethsaida, which had seen more than it had: “if the mighty works, which were done in you, had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes,” and so “It shall be more tolerable for Tyre and Sidon at the day of judgment, than for you” ([[Matt. 11:21–22]]).

  One reading of the glory set “in the land of the living” in verse 20 also looks to Him (see the note on [[Ezek. 26:20]]).

explore: |
  - The other words on Tyre, the lamentation for the city and the two words to its ruler: [[Ezek. 27]] and [[Ezek. 28:1–19]].
  - What the book later says of Nebuchadrezzar’s siege: [[Ezek. 29:17–20]].
  - Isaiah’s burden of Tyre, with its merchant princes: [[Isa. 23]].
  - The pit and those who lie in it: [[Ezek. 32:17–32]].

