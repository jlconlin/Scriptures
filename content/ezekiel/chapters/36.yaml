chapter: 36
title: 'A New Heart and a New Spirit'
tagline: 'The mountains that heard the judgment in chapter 6 are told they will bear fruit for a people coming home. Then the Lord says why He will do it and how: for His holy name, by cleansing Israel and giving them a new heart.'
when: 'No date of its own. The chapter stands under the heading of 33:21, “the twelfth year of our captivity, in the tenth month” (about 585 B.C.), when word reached Ezekiel that Jerusalem had fallen, and before the next date in the book, the twenty-fifth year (40:1).'

setting: |
  Jerusalem has fallen. The land of Israel now lies empty, and its neighbors want it. Chapter 35 was spoken against mount Seir, the country of Edom, which had said of Israel and Judah, “These two nations and these two countries shall be mine” ([[Ezek. 35:10]]). Here Ezekiel turns from mount Seir to the mountains of Israel and speaks to them, as he did once before. In chapter 6 they were told, “I will destroy your high places” ([[Ezek. 6:3]]). Now they hear the opposite.

  There are two parts. Verses 1–15 are spoken to the land. Verse 16 begins a new word of the Lord, about the people: why they were scattered, why they will be gathered, and what the Lord will do in them when He brings them back.

  The promise of a new heart was first made to the exiles in [[Ezek. 11:19–20]]. It is given here at its fullest.

thread: |
  The chapter answers two taunts and then gives the one reason behind both answers.

  The first taunt is about the land. The enemy says “Aha” over the empty hills (verse 2), and people say that this land eats its inhabitants (verse 13). The Lord answers with an oath (verse 7) and a promise: the mountains will put out branches, the cities will be rebuilt, and the land will not bereave its people again.

  The second taunt is about the Lord Himself. When Israel arrived among the nations, people said, “These are the people of the LORD, and are gone forth out of his land” (verse 20). The punishment Israel had earned made their God look as though He had failed. So He will act, and He says twice that it is not for Israel’s sake (verses 22 and 32). It is for His holy name.

  What He does for His name goes beyond bringing them home. One reading ties this to verse 15: the promise that the land will no longer cause its people to fall “can only be done by His removing the occasion to stumble or sin.” The gathering (verse 24) is followed by cleansing (25), a new heart and a new spirit (26), His own spirit within them (27), and the covenant sentence, “ye shall be my people, and I will be your God” (28). Plenty follows, and the waste land becomes “like the garden of Eden” (35).

  The book’s refrain marks who is to learn from all this (see the note on [[Ezek. 6:7]]): the mountains (verse 11), the nations (23 and 36), and the house of Israel (38) will know that He is the LORD.

sections:
  - range: 1-7
    heading: 'The enemy’s boast and the Lord’s oath'
    plain: |
      Son of man, prophesy to the mountains of Israel and say: Mountains of Israel, hear the word of the Lord. The enemy has said against you, Aha, the ancient high places are ours. They have made you desolate and swallowed you up on every side, so that you became the possession of the rest of the nations and the subject of talk and slander. So hear the word of the Lord God, you mountains and hills, rivers and valleys, desolate wastes and forsaken cities, which became a prey and a mockery to the nations around you. In the fire of His jealousy the Lord has spoken against the rest of the nations and against all Idumea, who took His land for themselves with whole-hearted joy and spiteful minds, to cast it out as prey. He has spoken in His jealousy and fury because the land has borne the shame of the nations. He has lifted up His hand: the nations around you will bear their own shame.
  - range: 8-15
    heading: 'The mountains will bear fruit again'
    plain: |
      But you, mountains of Israel, will shoot out your branches and yield your fruit to my people Israel, for they are at hand to come. I am for you, and I will turn to you, and you will be tilled and sown. I will multiply men on you, all the house of Israel, all of it. The cities will be inhabited and the wastes rebuilt. I will multiply man and beast on you, and they will increase and be fruitful. I will settle you as you were in former times and do better for you than at your beginnings, and you will know that I am the Lord. My people Israel will walk on you and possess you; you will be their inheritance, and you will no longer bereave them. Because they say to you, You are a land that devours men and has bereaved your nations, you will devour men no more and bereave your nations no more. You will no longer hear the shame of the nations or bear the reproach of the peoples, and you will no longer cause your nations to fall.
  - range: 16-21
    heading: 'Why Israel was scattered'
    plain: |
      The word of the Lord comes again. Son of man, when the house of Israel lived in their own land, they defiled it by their way and their doings. Their way before me was like the uncleanness of a removed woman. So I poured out my fury on them for the blood they had shed on the land and for the idols with which they had polluted it. I scattered them among the nations and dispersed them through the countries; I judged them according to their way and their doings. And when they came to the nations, they profaned my holy name, when people said to them, These are the people of the Lord, and are gone forth out of his land. But I had pity for my holy name, which the house of Israel had profaned among the nations where they went.
  - range: 22-28
    heading: 'Cleansed, and given a new heart'
    plain: |
      So say to the house of Israel: I do not do this for your sakes, but for my holy name’s sake, which you have profaned among the nations. I will sanctify my great name, which you have profaned among them, and the nations will know that I am the Lord when I am sanctified in you before their eyes. I will take you from among the nations, gather you out of all countries, and bring you into your own land. Then I will sprinkle clean water on you, and you will be clean. I will cleanse you from all your filthiness and from all your idols. I will give you a new heart and put a new spirit within you. I will take the stony heart out of your flesh and give you a heart of flesh. I will put my spirit within you and cause you to walk in my statutes, and you will keep my judgments and do them. You will live in the land I gave to your fathers. You will be my people, and I will be your God.
  - range: 29-32
    heading: 'Plenty, and then remembering'
    plain: |
      I will save you from all your uncleannesses. I will call for the grain and increase it, and lay no famine on you. I will multiply the fruit of the tree and the increase of the field, so that you will never again bear the reproach of famine among the nations. Then you will remember your evil ways and your doings that were not good, and you will loathe yourselves in your own sight for your iniquities and abominations. Let it be known to you that I do not do this for your sakes. Be ashamed and confounded for your own ways, house of Israel.
  - range: 33-38
    heading: 'Like the garden of Eden'
    plain: |
      On the day I have cleansed you from all your iniquities, I will cause you to live in the cities, and the wastes will be rebuilt. The desolate land will be tilled, where it lay desolate in the sight of all who passed by. They will say, This land that was desolate has become like the garden of Eden, and the waste, desolate, and ruined cities are fenced and inhabited. Then the nations left around you will know that I the Lord build the ruined places and plant what was desolate. I the Lord have spoken it, and I will do it. I will yet be inquired of by the house of Israel, to do this for them: I will increase them with men like a flock. Like the holy flock, like the flock of Jerusalem at her solemn feasts, the waste cities will be filled with flocks of men, and they will know that I am the Lord.

notes:
  - ref: 2
    phrase: 'the ancient high places are ours in possession'
    kind: history
    title: 'The enemy on the ancient heights'
    body: |
      The enemy is Edom, and with it the other nations around Israel. Verse 2 says only “the enemy,” and verses 3 and 4 speak of “the residue of the heathen.” Verse 5 gives the name, “all Idumea,” which is Edom.

      The boast is quoted in the oracle against mount Seir that comes just before this one. Edom had said, “These two nations and these two countries shall be mine, and we will possess it; whereas the LORD was there” ([[Ezek. 35:10]]). It had also spoken against these very mountains: “They are laid desolate, they are given us to consume” ([[Ezek. 35:12]]). What Edom did when Jerusalem fell is gathered at [[Ezek. 25:12–14]], and the cry “Aha” is explained in the note on [[Ezek. 25:3]].

      “High places” in this verse means the hill country itself, not its shrines: the Hebrew phrase is “ancient mountains,” and one modern translation has “The ancient heights have become our possession.” The enemy says the hills are “ours in possession.” The Lord calls them “my land” (verse 5), and He tells the mountains that His people Israel “shall possess thee” (verse 12).
    sources: [lds-scriptures, bd-idumea, nrsvue]

  - ref: 8
    phrase: 'for they are at hand to come'
    kind: history
    title: 'How near the promise is'
    body: |
      The promise is spoken as near, and it has been understood to reach well beyond the return from Babylon. Modern translations take the clause to be about the people: “they will soon come home.” Most older commentators made the promised blessings the subject, “the branches and fruits, which the mountains are to bear,” as when the Lord says elsewhere, “my salvation is near to come” ([[Isa. 56:1]]).

      A portion of the people did come home, under Zerubbabel and Ezra. That return has been called a fulfillment “in certain weak beginnings.” The promise says more. Verse 10 speaks of “all the house of Israel, even all of it,” which means the people “from all the house of Israel, not just the kingdom of Judah.” Verse 15 promises an end to the nations’ reproach, and those who came back from Babylon “continued under the rule of the heathen.”

      The gathering promised here is placed in the last days. The whole chapter has been read that way except verses 16–22, which explain the scattering, and of the events it promises from verse 8 on it is said that none “have fully transpired, though today is the day when these prophecies are being fulfilled.”
    sources: [esv, nrsvue, keil-ezekiel, ot-manual-27, lds-scriptures]

  - ref: 13
    phrase: 'Thou land devourest up men'
    kind: scripture
    title: 'The land that eats its people'
    body: |
      The taunt is an old one, first said by Israel’s own spies. They came back from Canaan and reported that it “is a land that eateth up the inhabitants thereof” ([[Num. 13:32]]). Ezekiel has been read as referring to that report.

      Now the nations say it, and they have something to point to. One explanation is that the judgments threatened for Israel’s apostasy, “unfruitfulness, pestilence, and war,” had emptied the country, “and this fact was attributed by the heathen in their own way to the land.” On that reading the people were “devoured by the consequences of their sins,” and the nations blamed the soil.

      The Lord’s answer is that it will stop: “Thou shalt devour men no more” (verse 14), as verse 12 had already said, “thou shalt no more henceforth bereave them of men.” The second half of the chapter says where the cause lay, in the people’s “own way” and “doings” (verse 17), and what He will do about that.
    sources: [lds-scriptures, keil-ezekiel]

  - ref: 17
    phrase: 'as the uncleanness of a removed woman'
    kind: words
    title: 'The uncleanness of a removed woman'
    body: |
      “A removed woman” translates the Hebrew *niddah*, the law’s word for ritual impurity, used “especially of menstruation.” A modern translation has “like the uncleanness of a menstrual period.” The same word stands behind “removed” in [[Ezek. 7:19]] (see the note there). Under the law a woman in that condition “shall be put apart seven days” ([[Lev. 15:19]]).

      Ezekiel was a priest, and he describes Israel’s sin in the law’s terms of clean and unclean. What is defiled in this verse is the land. The law had warned of exactly that. Of the nations who lived in Canaan before Israel it says, “the land is defiled: therefore I do visit the iniquity thereof upon it, and the land itself vomiteth out her inhabitants” ([[Lev. 18:25]]), and it warned Israel “That the land spue not you out also” ([[Lev. 18:28]]). Verse 18 names the two things that did it, bloodshed and idols. Of the first the law says, “for blood it defileth the land” ([[Num. 35:33]]).

      The same word is in the law’s name for the water sprinkled on an unclean person. In Numbers 19 that water is called the “water of separation,” and “separation” there is *niddah*: “water of impurity,” that is, water to remove it. Verse 25 promises clean water, sprinkled.
    sources: [bdb, nrsvue, lds-scriptures, bd-ezekiel]

  - ref: 20
    phrase: 'they profaned my holy name'
    kind: history
    title: 'How the exile profaned the name'
    body: |
      Israel profaned the Lord’s name among the nations by arriving there as exiles. The verse says how: it happened “when they said to them, These are the people of the LORD, and are gone forth out of his land.” A modern translation gives the edge of the remark: these are His people, “and yet they had to go out of his land.” The nations who saw Israel scattered “assumed that the Lord had abandoned or failed them.”

      The Lord has spoken of this before. Three times in His account of Israel’s early history He says He acted for His name’s sake, “that it should not be polluted before the heathen” ([[Ezek. 20:9]]; also verses 14 and 22 there), and Moses had pleaded on that ground, saying the nations would conclude that “the LORD was not able to bring this people into the land which he sware unto them” ([[Num. 14:16]]). The note on [[Ezek. 20:9]] follows that concern through the history. In this chapter the nations are saying it.

      The Joseph Smith Translation changes one word of what they say, reading “out of this land” for “out of his land.” No explanation of the change is given.

      “I had pity for mine holy name” (verse 21) is “concern” in the Hebrew, and a modern translation has “But I had concern for my holy name.”
    sources: [lds-scriptures, scripture-helps-ezek, esv, nrsvue]

  - ref: 23
    phrase: 'I will sanctify my great name'
    kind: scripture
    title: 'Not for your sakes'
    body: |
      To sanctify the name is to show before the nations that it is holy after all. One modern translation has “I will vindicate the holiness of my great name,” and another renders the end of the verse “when through you I display my holiness before their eyes.” Ezekiel uses the expression of the gathering elsewhere, at [[Ezek. 20:41]] and [[Ezek. 28:25]], and again at [[Ezek. 39:27]].

      The name was profaned through Israel, and it is sanctified “in you,” through Israel. Verse 24 begins with “For” and says how: “I will take you from among the heathen.” The people whose scattering made the nations think little of the Lord will be the people whose gathering and cleansing show them who He is.

      “I do not this for your sakes” is said twice, here and in verse 32. Moses said the same thing to Israel before they entered the land the first time: “Understand therefore, that the LORD thy God giveth thee not this good land to possess it for thy righteousness; for thou art a stiffnecked people” ([[Deut. 9:6]]). The recovery, too, “will be done for the Lord’s reasons, not because Israel has earned it.”
    sources: [esv, nrsvue, bdb, lds-scriptures, ot-manual-27]

  - ref: 25
    phrase: 'sprinkle clean water upon you'
    kind: symbol
    title: 'Clean water'
    body: |
      The image comes from the law’s rites of purification, in which water was sprinkled on a person who had become unclean. The verb is used here of sprinkling “water for purification.” The figure has been explained as taken especially from the rite of Numbers 19 for a person defiled by contact with the dead. The ashes of a red heifer were mixed with running water, and “the clean person shall sprinkle upon the unclean on the third day, and on the seventh day” ([[Num. 19:19]]). A person who was not sprinkled stayed unclean: “the water of separation hath not been sprinkled upon him; he is unclean” ([[Num. 19:20]]).

      Here the Lord is the one who sprinkles: “will I sprinkle,” “will I cleanse you.” What is washed away is “all your filthiness” and “all your idols,” the defilement of verses 17–18. The psalmist’s prayer has been compared: “Purge me with hyssop, and I shall be clean” ([[Ps. 51:7]]).

      The verse speaks of what the Lord will do for gathered Israel and does not name an ordinance. Hebrews joins sprinkling and pure water in speaking of drawing near to God: “having our hearts sprinkled from an evil conscience, and our bodies washed with pure water” ([[Heb. 10:22]]). That verse and this one have been cited together for the statement that in the ancient world “baptism and other rituals for cleansing” were required to be done with “pure water.” This is likely why the Book of Mormon notes that at the waters of Mormon there was “a fountain of pure water” ([[Mosiah 18:5]]).
    sources: [bdb, lds-scriptures, keil-ezekiel, sc-knowhy-320]

  - ref: 26
    phrase: 'A new heart also will I give you'
    kind: scripture
    title: 'A new heart'
    body: |
      The new heart is a gift, and every verb in the verse is the Lord’s: give, put, take away, give. In scripture the heart is “a symbol of the mind and will of man.”

      The book says this three times. It is first promised to the exiles, with the stony heart and the heart of flesh already there (see the note on [[Ezek. 11:19]]). Then it is commanded: “make you a new heart and a new spirit” ([[Ezek. 18:31]]). Here it is promised again and set in order: after the cleansing of verse 25, before the gift of the Lord’s own spirit in verse 27, and all of it for the sake of His name.

      Paul writes of what is written “not in tables of stone, but in fleshy tables of the heart” ([[2 Cor. 3:3]]), and the Church’s footnote there points to the promise as Ezekiel first gave it ([[Ezek. 11:19–20]]).

      The promise is spoken to a people, the house of Israel, and it is among Ezekiel’s prophecies that Israel will “return to the covenant and experience an eventual conversion to the gospel.” Latter-day teaching also reads it of each person’s conversion. Elder D. Todd Christofferson cited Ezekiel’s first statement of the promise together with Jeremiah’s new covenant ([[Jer. 31:33]]) and said that Ezekiel described conversion as the Lord taking away the stony heart “and giving us a heart that loves Him and His gospel.” This, he said, is what happened to the people of King Benjamin, who said the Spirit “has wrought a mighty change in us, or in our hearts, that we have no more disposition to do evil, but to do good continually” ([[Mosiah 5:2]]). [A New Heart and a New Spirit](/ezekiel/themes/new-heart-new-spirit/) follows the promise through the book.
    sources: [lds-scriptures, gs-heart, lund-ezekiel, christofferson-converted]

  - ref: 26
    phrase: 'I will take away the stony heart out of your flesh'
    kind: prophets
    title: 'A change of heart that has to be kept'
    body: |
      Elder Dale G. Renlund quoted this verse as the Lord’s own account of the change of heart, and taught that the change, once given, has to be cared for. He compared it to a heart transplant: through transgression our spiritual hearts become diseased and hardened, and this verse describes “the operation that we all need.” It comes “Through the Atonement of Christ and by obedience to the laws and ordinances of the gospel.”

      His point was what follows the operation. The change “is just the beginning,” because the natural man tends to reject the changed heart and allow it to harden.
    sources: [renlund-mighty-change]

  - ref: 27
    phrase: 'I will put my spirit within you'
    kind: scripture
    title: 'My spirit within you'
    body: |
      Verse 27 names the Lord’s own spirit. Chapter 11 said, “I will put a new spirit within you” ([[Ezek. 11:19]]), as verse 26 does here; now it is “my spirit.” The two verses have been summed up together: Israel is “to be converted to the Lord and receive His Spirit.”

      What the spirit brings about is obedience. “Cause you to walk in my statutes” is “make you follow my statutes” in one modern translation.

      “My spirit” is heard again in the chapters that follow. The vision of the dry bones ends, “And shall put my spirit in you, and ye shall live” ([[Ezek. 37:14]]), and the prophecy against Gog ends, “for I have poured out my spirit upon the house of Israel” ([[Ezek. 39:29]]).
    sources: [lds-scriptures, nrsvue, ot-manual-27]

  - ref: 31
    phrase: 'lothe yourselves in your own sight'
    kind: scripture
    title: 'Remembering after the blessing'
    body: |
      The shame comes after the cleansing and the plenty, not before them. The verse begins with “Then.” Israel has been gathered (verse 24), cleansed (25), given a new heart (26), and fed (29–30), and at that point they remember what they were.

      Ezekiel has put it in this order before. After the gathering to the holy mountain, “ye shall lothe yourselves in your own sight for all your evils that ye have committed” ([[Ezek. 20:43]]). In the parable of the unfaithful wife the shame comes “when I am pacified toward thee for all that thou hast done” ([[Ezek. 16:63]]). The first time the sentence appears it is said of the remnant in exile (see the note on [[Ezek. 6:8]]).

      Verse 32 makes the remembering a command, “be ashamed and confounded for your own ways,” and sets beside it the reminder that none of this was earned: “Not for your sakes do I this.”
    sources: [lds-scriptures]

  - ref: 37
    phrase: 'I will yet for this be inquired of by the house of Israel'
    kind: scripture
    title: 'The Lord will be asked again'
    body: |
      Earlier in the book the Lord refused three times to be consulted, and here He says He will be. Of the elders who sat before Ezekiel He asked, “should I be inquired of at all by them?” ([[Ezek. 14:3]]). To a later group He said, “I will not be inquired of by you” ([[Ezek. 20:3]]), and said it again at [[Ezek. 20:31]]. The Hebrew verb is the same in all of them, and in this form it means to “let oneself be inquired of, consulted.” A modern translation has “I will also let the house of Israel ask me to do this for them.”

      The reason given for the refusal was the idols: “these men have set up their idols in their heart” (see the note on [[Ezek. 14:3]]). In this chapter the promise to be asked comes after the promise to cleanse Israel “from all your idols” (verse 25).

      He has just said, “I the LORD have spoken it, and I will do it” (verse 36), and still He will be asked “to do it for them.” Jeremiah had written to the exiles in Babylon, “And ye shall seek me, and find me, when ye shall search for me with all your heart” ([[Jer. 29:13]]).
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 38
    phrase: 'As the holy flock'
    kind: symbol
    title: 'Flocks for the feasts'
    body: |
      The comparison is with the animals brought to Jerusalem for sacrifice at the great festivals. “Holy flock” is “flock for sacrifices” in the Hebrew, and modern translations have “Like the flock for sacrifices” and “Like a consecrated flock.” The people will be so many that “they will resemble the flock of lambs, sheep, and goats brought to Jerusalem to sacrifice upon the feast days.” Chronicles gives an idea of the numbers. At one Passover King Josiah gave the people “lambs and kids, all for the passover offerings, for all that were present, to the number of thirty thousand” ([[2 Chr. 35:7]]).

      Ezekiel sets Jerusalem crowded at festival time against “the waste cities,” and says the empty towns will be as full as that.
    sources: [lds-scriptures, esv, nrsvue, keil-ezekiel]

christ: |
  Everything the chapter promises, the Lord does Himself. He gathers, sprinkles, cleanses, gives the heart, puts His spirit within, and says, “I will also save you from all your uncleannesses” (verse 29). The speaker is the LORD, Jehovah (see the note on [[Ezek. 1:26]]).

  The Book of Mormon names the one through whom hearts are changed. King Benjamin told his people, “your hearts are changed through faith on his name; therefore, ye are born of him” ([[Mosiah 5:7]]). Elder Dale G. Renlund, quoting verse 26, taught that this change of heart comes through the Savior’s Atonement.

  The Church’s footnote on “sprinkle” in verse 25 points to Isaiah’s servant: “So shall he sprinkle many nations” ([[Isa. 52:15]]). The risen Savior quoted that verse to the Nephites ([[3 Ne. 20:45]]), and the footnote there points back to this verse.

explore: |
  - The promise the first time, and the command: [[Ezek. 11:17–20]] and [[Ezek. 18:30–32]].
  - Jeremiah’s new covenant, written in the heart: [[Jer. 31:31–34]] and [[Jer. 32:37–41]].
  - The mighty change of heart in the Book of Mormon: [[Mosiah 5:1–7]] and [[Alma 5:12–14]].
  - The water of separation: [[Num. 19]].
  - The oracle against mount Seir that comes just before, and the first address to the mountains: [[Ezek. 35]] and [[Ezek. 6]].
  - The wilderness made like Eden, and Eden made a wilderness: [[Isa. 51:3]] and [[Joel 2:3]].
  - What comes next: the Lord’s spirit put into dry bones, and they live: [[Ezek. 37:1–14]].

