chapter: 11
title: 'A Little Sanctuary'
tagline: 'The vision that began in chapter 8 ends. Jerusalem’s leaders trust the city to keep them safe, the exiles are told that the Lord Himself has been their sanctuary, and the glory of the Lord leaves the city for the mountain to the east.'
when: 'No date of its own. The chapter is the last part of the vision dated in 8:1 to “the sixth year, in the sixth month, in the fifth day of the month” of Jehoiachin’s captivity, about 591 B.C.'

setting: |
  Ezekiel is in Babylonia, one of the captives carried away with king Jehoiachin, and Jerusalem is still standing; the deportation that followed its fall, in 586 B.C., is about five years off. The chapter finishes something already begun. In the sixth year of the captivity Ezekiel was sitting in his house with the elders of Judah before him when the hand of the Lord came on him, and he was taken “in the visions of God to Jerusalem” ([[Ezek. 8:1–3]]). Everything from there to the end of this chapter is one vision.

  In it he has been shown the idolatry practiced in the temple itself (chapter 8), the marking of those who grieved over it and the slaying of the rest (chapter 9), and the glory of the Lord rising from its place in the temple and moving, with the cherubim and the wheels, to the east gate ([[Ezek. 10:18–19]]). Chapter 11 opens at that gate. It gives the last charge against the city’s leaders, the Lord’s answer to the prophet’s fear that no one will be left, and the last movement of the glory. Then Ezekiel is brought back to the exiles and tells them all he saw.

  The promise in verses 17–20 comes again, enlarged, in chapter 36 ([[Ezek. 36:24–28]]). The glory that leaves here comes back in chapter 43 ([[Ezek. 43:1–5]]).

thread: |
  The chapter turns on a question of who is near the Lord and who is far from Him. In Jerusalem the answer seems plain. The leaders are inside the city, as safe as meat in a pot, and its inhabitants say that the people carried off to Babylon have been sent away from the Lord and have lost their claim to the land: “Get you far from the LORD: unto us is this land given in possession.”

  The Lord reverses both judgments. To those in the city He says that it will not protect them: they will be taken out of it and judged at the border, and they “shall know that I am the LORD” (verses 10 and 12; on that sentence see [[Ezek. 6:7]]). To those in exile He says that He Himself has been their sanctuary where they are, that He will gather them and give them the land, and that He will give them a new heart with which to keep His covenant.

  Then the glory of the Lord rises from the midst of the city and stands on the mountain to the east. At the start of the vision the Lord had asked Ezekiel whether he saw the abominations done in the temple, “that I should go far off from my sanctuary” ([[Ezek. 8:6]]). Now He goes.

sections:
  - range: 1-4
    heading: 'The princes at the east gate'
    plain: |
      The spirit lifts Ezekiel and brings him to the east gate of the Lord’s house. At the entrance are twenty-five men, and he recognizes two leaders of the people among them, Jaazaniah the son of Azur and Pelatiah the son of Benaiah. The Lord tells him that these are the men who plan wrong and give bad counsel in the city. Their saying is about building houses, and it ends with a boast: the city is the caldron and they are the meat. Ezekiel is told to prophesy against them.
  - range: 5-12
    heading: 'The city will not be your caldron'
    plain: |
      The Spirit of the Lord falls on Ezekiel and gives him the words. The Lord knows what the house of Israel has said and everything that comes into their minds. They have multiplied their slain in the city and filled its streets with the dead. So the Lord gives their saying back to them: the slain they have laid there are the meat, and the city is the caldron, but the speakers themselves will be brought out of it. They fear the sword, and the sword is what He will bring. He will hand them over to foreigners and carry out judgments on them. They will fall by the sword and be judged at the border of Israel. The city will not be their caldron and they will not be the meat inside it. Then they will know that He is the Lord, whose statutes they did not walk in and whose judgments they did not carry out, choosing the ways of the nations around them.
  - range: 13-21
    heading: 'A sanctuary and a new heart for the exiles'
    plain: |
      While Ezekiel is prophesying, Pelatiah dies. Ezekiel falls on his face and cries out, asking whether the Lord will make a complete end of the remnant of Israel.

      The word of the Lord answers him. His brethren, the men of his kindred, the whole house of Israel, are the people whom the inhabitants of Jerusalem have told to keep far from the Lord, saying that the land has been given to themselves. So he is to say: although the Lord has sent them far off among the nations and scattered them through the countries, He will be a little sanctuary to them in the countries where they have come. He will gather them from the peoples and the countries where they were scattered and give them the land of Israel. They will come there and remove every detestable thing and every abomination from it. He will give them one heart and put a new spirit within them; He will take the stony heart out of their flesh and give them a heart of flesh, so that they walk in His statutes and keep His ordinances. They will be His people, and He will be their God. But those whose heart follows their detestable things and abominations will have their conduct brought back on their own heads.
  - range: 22-25
    heading: 'The glory leaves the city'
    plain: |
      The cherubim lift their wings, the wheels beside them, with the glory of the God of Israel over them. The glory of the Lord goes up from the midst of the city and stands on the mountain on the east side of the city. Then the spirit takes Ezekiel up and brings him, in the vision and by the Spirit of God, to the captives in Chaldea, and the vision he has seen goes up from him. He tells the captives everything the Lord has shown him.

notes:
  - ref: 1
    phrase: 'five and twenty men'
    kind: history
    title: 'The twenty-five men at the east gate'
    body: |
      The twenty-five are leaders of the people, and they are standing in the place to which the glory of the Lord has just moved. Two are named and called “princes of the people,” and the charge against the group in verse 2 is about their counsel: they “devise mischief, and give wicked counsel in this city.”

      A reader will remember another twenty-five. Earlier in the same vision Ezekiel saw “about five and twenty men” in the inner court, with their backs to the temple, worshipping the sun ([[Ezek. 8:16]]). The text does not say whether these are the same men. What it gives differs: the earlier group stood between the porch and the altar and is charged with false worship; this one stands at the east gate and is charged with false counsel. The Jaazaniah named there has a different father, too: he was “Jaazaniah the son of Shaphan” ([[Ezek. 8:11]]), and this is the son of Azur.

      The gate matters more than the count. At the end of the previous chapter the cherubim rose and “every one stood at the door of the east gate of the LORD’s house; and the glory of the God of Israel was over them above” ([[Ezek. 10:19]]). So the leaders are giving their confident advice at the very door where the Lord’s presence has paused on its way out.
    sources: [lds-scriptures]

  - ref: 3
    phrase: 'It is not near; let us build houses'
    kind: words
    title: 'What the princes were saying about houses'
    body: |
      The first half of the leaders’ saying is four words in Hebrew, *lo beqarov benot battim*, and its sense is uncertain. Word for word it is “not near, to build houses.” The verb is an infinitive (“to build”), so the King James translators supplied both “it is” and “let us.”

      Read as the King James Version has it, the leaders say that the danger is distant and life can go on: build. Modern translations keep the infinitive and get a different thought, “The time is not near to build houses,” and one of them notes in its margin that the words may instead be a question. The ancient Greek translation took it as a question about the past: “Have not the houses been newly built?”

      One explanation is that the leaders in Jerusalem are mocking Jeremiah’s letter to the exiles in Babylon. He had written, “Build ye houses, and dwell in them” ([[Jer. 29:5]]), because their captivity would be long. On this reading the leaders answer: “the house-building in exile is still a long way off; it will not come to this, that Jerusalem should fall either permanently or entirely into the hands of the king of Babylon.” It is a reasonable proposal and cannot be proved.
    sources: [oshb-wlc, nrsvue, esv, lxx-rahlfs, ot-manual-26, keil-ezekiel]

  - ref: 3
    phrase: 'this city is the caldron, and we be the flesh'
    kind: symbol
    title: 'The caldron and the flesh'
    body: |
      The leaders picture Jerusalem as a cooking pot and themselves as the meat inside it, and they mean it as comfort. The word is the ordinary one for a household pot for boiling, and “the point of comparison is this: as the pot protects the flesh from burning, so does the city of Jerusalem protect us from destruction.” The walls stand between them and the fire.

      The Lord takes the saying and changes who is in the pot. “Your slain whom ye have laid in the midst of it, they are the flesh” (verse 7). The people the leaders have killed are the meat in Jerusalem’s caldron. The chapter does not list the killings; the previous scene of the vision had said that “the land is full of blood” ([[Ezek. 9:9]]).

      Then the image is taken away from the speakers altogether. “This city shall not be your caldron, neither shall ye be the flesh in the midst thereof” (verse 11). They will not die inside the walls they trusted. They will be taken out.

      In Ezekiel the word comes only in this chapter and in chapter 24, both times as a figure for Jerusalem. There it comes back on the day the siege begins and nothing of the boast is left: “Woe to the bloody city, to the pot whose scum is therein” ([[Ezek. 24:6]]).
    sources: [ot-manual-26, keil-ezekiel, bdb, lds-scriptures]

  - ref: 10
    phrase: 'I will judge you in the border of Israel'
    kind: history
    title: 'Judged at the border'
    body: |
      The sentence on the leaders is that they will be judged away from the city, and it is said twice (verses 10 and 11); verse 10 adds that they will fall by the sword. They had counted on being inside. The Lord says He will bring them out, give them “into the hands of strangers,” and judge them at the edge of the land.

      The account of Jerusalem’s fall tells of such a judgment. The captain of the Babylonian guard took the chief priest and the second priest, an officer over the men of war, and “threescore men of the people of the land that were found in the city” ([[2 Kgs. 25:19]]) and brought them to the king of Babylon at Riblah. There “the king of Babylon smote them, and slew them at Riblah in the land of Hamath” ([[2 Kgs. 25:21]]). Jeremiah records of the same place that “the king of Babylon slew all the nobles of Judah” ([[Jer. 39:6]]). The cross-references printed with this verse in the Church’s edition of the Bible point to those passages, and the threat has been read as “literally fulfilled in the bloody scenes at Riblah”: on that reading, the leaders were cut down not in Jerusalem but at the frontier.

      The vision is dated about five years before these events.
    sources: [lds-scriptures, keil-ezekiel]

  - ref: 13
    phrase: 'Pelatiah the son of Benaiah died'
    kind: history
    title: 'A death in the vision, and the prophet’s cry'
    body: |
      One of the two men named in verse 1 dies while Ezekiel is speaking, and Ezekiel’s response is to plead for the people. The text does not say how Pelatiah died or whether the death happened in Jerusalem at that hour. Ezekiel was not there in body; he had been brought “in the visions of God to Jerusalem” ([[Ezek. 8:3]]). What the chapter reports is what Ezekiel saw.

      He falls on his face and cries, “Ah Lord GOD! wilt thou make a full end of the remnant of Israel?” It is the second time in the vision. When the slaying began in chapter 9 he had fallen down in the same way and asked, “Ah Lord GOD! wilt thou destroy all the residue of Israel” ([[Ezek. 9:8]]). That first cry was answered with the reason for the judgment ([[Ezek. 9:9–10]]). This one is answered with the promise that fills the rest of the chapter (verses 16–20).
    sources: [lds-scriptures]

  - ref: 15
    phrase: 'the men of thy kindred'
    kind: words
    title: 'Who Ezekiel’s brethren are'
    body: |
      The Lord answers the prophet’s cry by telling him which people are his to care about: the exiles. The Hebrew names them three ways: “thy brethren,” said twice; the men of thy *ge’ullah*; and the whole house of Israel. The middle term is unusual. *Ge’ullah* is the ordinary word for redemption, the right of a relative to buy back what a poor kinsman has lost: “if any of his kin come to redeem it” ([[Lev. 25:25]]). Here the sense is usually given as “kin,” though with a question mark in the standard lexicon, and that is how the King James Version takes it. The ancient Greek and Syriac translators read a slightly different Hebrew word and have “the men of thy captivity,” that is, “thy fellow-exiles,” which one modern translation adopts. All three readings name the same people.

      What Jerusalem said about those people is then quoted: “Get you far from the LORD: unto us is this land given in possession.” The claim has two parts: the exiles are far from the Lord, and the land now belongs to those who stayed. It outlived the city. After Jerusalem fell, the survivors in the ruins were still saying, “the land is given us for inheritance” ([[Ezek. 33:24]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 16
    phrase: 'a little sanctuary'
    kind: words
    title: 'The Lord as the exiles’ sanctuary'
    body: |
      The Lord says that He Himself has been to the exiles what the temple was. “Sanctuary” is *miqdash*, the usual word for the temple and its precincts, and this is the verse where the Lord Himself becomes a sanctuary for His people, with “apparently” one other ([[Isa. 8:14]]). Where the King James Version has “yet will I be,” the Hebrew verb is past, as modern translations show (“I have been a sanctuary to them”). It describes what was already true in Babylon when the words were spoken.

      “Little” translates *me‘at*, which the translations take in two ways, of measure and of time. Taken as measure, it gives the King James wording, which the ancient Greek shares, and the lexicon’s “for a sanctuary but little”: His presence with them abroad is real, but it is less than what the temple in the land was meant to be. Taken as time, it gives “a sanctuary to them for a little while” in modern translations: the arrangement is temporary, because the next verse promises the gathering. The two senses do not conflict.

      The verse answers the taunt of verse 15 in its own word. “Get you far” and “I have cast them far off” are forms of the same Hebrew root. The Lord grants the fact: He did send them far from the land. He denies the conclusion. Distance from Jerusalem is not distance from Him. This is the principle behind the whole vision, in which the throne Ezekiel first saw in Babylon is seen leaving the temple (see the note on [[Ezek. 1:28]]).

      The book does not leave it at “little.” Its promise for the gathered people is that the Lord “will set my sanctuary in the midst of them for evermore” ([[Ezek. 37:26]]). [A Little Sanctuary](/ezekiel/themes/a-little-sanctuary/) follows this promise through the book.
    sources: [bdb, oshb-wlc, nrsvue, esv, lxx-rahlfs, lds-scriptures]

  - ref: 19
    phrase: 'one heart'
    kind: scripture
    title: 'One heart, a new spirit, a heart of flesh'
    body: |
      Verses 19–20 are the first statement of a promise that Ezekiel gives again, at greater length, in chapter 36: “A new heart also will I give you” ([[Ezek. 36:26]]). The stony heart, the heart of flesh, the new spirit, and the walking in the Lord’s statutes are all there too, and the promise is treated more fully in that chapter. Three things belong to this first statement.

      The first is where it comes. It is spoken to people who have just been told they are far from the Lord and have no share in the land, and it follows the promise of the sanctuary. The heart is given to the exiles.

      The second is the wording “one heart.” The Hebrew is *lev echad*, and modern translations keep it; the ancient Greek has “another heart,” and chapter 36 has “new.” Jeremiah has the same phrase in his own promise of the return: “And I will give them one heart, and one way, that they may fear me for ever” ([[Jer. 32:39]]). “One heart” has been explained as “a harmonious, united heart, in contrast to the division or plurality of hearts” in a people where each follows his own way. The stony heart, on the same explanation, is one with “no susceptibility to the impressions of the word of God,” and the heart of flesh is “a tender heart.”

      The third is what the gift is for. Verse 20 gives the purpose, obedience, and then the words of the covenant: “they shall be my people, and I will be their God.” Jeremiah’s new covenant ends in the same sentence ([[Jer. 31:33]]). Later Ezekiel puts the same change as a command: “make you a new heart and a new spirit” ([[Ezek. 18:31]]). The book has both the promise and the command, and verse 21 here keeps the command in view: those whose heart goes after their idols are not included.

      The shift between “them” and “you” in verse 19 is in the Hebrew. The promise is spoken about the exiles and, in mid-sentence, to them. [A New Heart and a New Spirit](/ezekiel/themes/new-heart-new-spirit/) follows the promise through the book.
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs, esv, nrsvue, keil-ezekiel]

  - ref: 23
    phrase: 'stood upon the mountain which is on the east side of the city'
    kind: symbol
    title: 'The glory leaves by stages'
    body: |
      The departure of the glory of the Lord from Jerusalem is told in steps across three chapters, and this verse is the last of them. The glory is “Jehovah’s visible presence, often characterized in scripture as a cloud or smoke.” It first rose from its place over the cherub “to the threshold of the house” ([[Ezek. 9:3]]). Then it “departed from off the threshold of the house, and stood over the cherubims” ([[Ezek. 10:18]]), and the cherubim carried it to the east gate. Now it goes up “from the midst of the city” and stands on the mountain to the east. That mountain is the Mount of Olives, the hill east of Jerusalem across the Kidron valley. The vision ends with the glory there and does not say where it goes next.

      The meaning is that the Lord is no longer in His house. The temple had become “no longer an appropriate place for Jehovah to dwell, so he leaves it behind to destruction,” and “without his protecting presence it was able to be destroyed.” The Lord had said so at the start of the vision, asking Ezekiel whether he saw the abominations committed in the temple, “that I should go far off from my sanctuary” ([[Ezek. 8:6]]).

      The book does not end with the departure. In the vision of the temple the glory returns by the road it took: “the glory of the God of Israel came from the way of the east” ([[Ezek. 43:2]]) and entered the house “by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]). Ezekiel himself ties the two visions together. What he saw then was “according to the vision that I saw when I came to destroy the city” ([[Ezek. 43:3]]).
    sources: [lds-scriptures, shannon-location, keil-ezekiel, bd-olives-mount-of]

  - ref: 25
    phrase: 'Then I spake unto them of the captivity'
    kind: history
    title: 'Who heard the vision'
    body: |
      The vision closes among the exiles in Babylonia, where it opened, and they are the people who hear it. It began when “the elders of Judah sat before me” ([[Ezek. 8:1]]). The spirit that carried him to Jerusalem now brings him back “to them of the captivity,” the community he had joined at the start of his ministry, “them of the captivity at Tel-abib” ([[Ezek. 3:15]]).

      This settles a question the chapter raises. Ezekiel was told to “prophesy against” the princes at the gate (verse 4), yet they were in Jerusalem and he was not. The prophecy against them was spoken inside the vision. Those who heard it, with everything else in chapters 8 to 11, were the captives: the people to whom Jerusalem had said, “Get you far from the LORD” (verse 15).
    sources: [lds-scriptures]

christ: |
  On who the LORD of this chapter is, see the note on [[Ezek. 1:26]]. Isaiah uses the word of verse 16 for Him, “he shall be for a sanctuary” ([[Isa. 8:14]]), in a verse the heading of the Church’s edition reads of Christ.

  The chapter’s last picture of Him is on the mountain east of Jerusalem, having left the city. That mountain, the Mount of Olives, has a later history. It “shall also be prominent in events of the latter days and the Messiah’s Second Coming.” Zechariah says of the Lord’s return, “his feet shall stand in that day upon the mount of Olives, which is before Jerusalem on the east” ([[Zech. 14:4]]), and a revelation in the Doctrine and Covenants repeats it: “then shall the Lord set his foot upon this mount” ([[D&C 45:48]]). It was also from “the mount called Olivet” ([[Acts 1:12]]) that He ascended. Ezekiel’s verse has been read beside these: the glory stood where Zechariah has the Lord appear and where the Son of God ascended. Ezekiel does not make the connection himself. What his book does say is that the glory comes back from the east ([[Ezek. 43:2]]).

explore: |
  - The whole vision in order: [[Ezek. 8]], [[Ezek. 9]], [[Ezek. 10]], and this chapter.
  - The promise of the new heart at full length: [[Ezek. 36:24–28]].
  - The glory’s return by the east gate: [[Ezek. 43:1–7]], and the city’s new name, [[Ezek. 48:35]].
  - Jeremiah’s vision of the two baskets of figs, the captives and those who remained: [[Jer. 24]], and his letter to the exiles, [[Jer. 29:4–14]].
  - The caldron again, on the day the siege begins: [[Ezek. 24:1–14]].
  - The claim to the land repeated after the fall, and the Lord’s answer: [[Ezek. 33:23–29]].

