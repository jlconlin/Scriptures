chapter: 38
title: 'Gog of the Land of Magog'
tagline: 'In the latter years a ruler from the far north leads many nations against gathered Israel, a people living without walls. The Lord says that He brings him, and that He will meet him Himself, so that the nations may know who He is.'
when: 'No date of its own. The chapter stands under the heading of 33:21, “the twelfth year of our captivity, in the tenth month” (about 585 B.C.), when word came that Jerusalem had fallen, and before the next date in the book, the twenty-fifth year (40:1). What it describes is set “in the latter years” (verse 8).'

setting: |
  Ezekiel is among the exiles in Babylon, and the news has come: “The city is smitten” ([[Ezek. 33:21]]). Chapters 33–39 are the book’s “prophecies of restoration.” Since the news came he has been given promise after promise: the Lord will gather the flock to their own land, give a new heart, bring the dry bones up out of their graves into the land of Israel, and “make a covenant of peace with them” ([[Ezek. 37:26]]).

  Chapters 38 and 39 are one prophecy, and it comes after all of that. It speaks of a people already home, gathered out of many nations and living in safety (verse 8). Then a ruler from the far north comes against them with an army of many nations. This chapter tells of his coming and of the Lord’s answer; chapter 39 tells of his fall and burial, and of what Israel and the nations learn from it. The vision of the temple follows in chapter 40.

  The prophecies of chapters 25–32 were against Israel’s enemies. This one looks to a time the text calls “the latter years” and “the latter days.” John uses its names ([[Rev. 20:8]]), and a revelation to Joseph Smith appeals to Ezekiel by name for what it foretells ([[D&C 29:21]]).

thread: |
  The chapter has two plans in it, and it says whose plan governs. Gog has his: he will see a land of unwalled villages, think “an evil thought,” and come for plunder (verses 10–12). The Lord has His, and He states it before Gog’s and after it: “I will bring thee forth” (verse 4), “I will bring thee against my land” (verse 16). The first words spoken to Gog are, “I am against thee.”

  The chapter moves in three steps. In verses 1–9 the army is named and told to make ready. In verses 10–16 Gog’s motive is laid open, and then the Lord’s purpose: “that the heathen may know me.” In verses 17–23 the Lord answers the invasion Himself, with an earthquake, the invaders’ swords turned on one another, pestilence, hail, and fire.

  Israel does nothing in all of this. The people are described three times as dwelling “safely” (verses 8, 11, 14), and no Israelite army appears. The land is “my land,” the people “my people,” the mountains “my mountains,” and the defence is His.

  The last verse says what it is for. The book’s refrain (see the note on [[Ezek. 6:7]]) is said here of the nations: “they shall know that I am the LORD.”

sections:
  - range: 1-9
    heading: 'Gog and his army are summoned'
    plain: |
      The word of the Lord comes to Ezekiel. He is to set his face against Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him. The Lord God says: I am against you, Gog. I will turn you back, put hooks in your jaws, and bring you out with your whole army: horses and horsemen, all fully armed, a great company with large and small shields, all of them carrying swords. Persia, Ethiopia, and Libya are with them, with shield and helmet; Gomer and all his bands; the house of Togarmah from the far north and all his bands; many peoples with you.

      Make ready, you and all the company gathered to you, and be a guard for them. After many days you will be visited. In the latter years you will come into the land that has been brought back from the sword and gathered out of many peoples, against the mountains of Israel, which had long lain waste. Its people have been brought out of the nations, and all of them will be living in safety. You will come up like a storm; you will be like a cloud covering the land, you and all your bands and the many peoples with you.
  - range: 10-16
    heading: 'Gog’s thought and the Lord’s purpose'
    plain: |
      The Lord God says: At that time things will come into your mind, and you will think an evil thought. You will say, I will go up to the land of unwalled villages. I will go to people who are at rest and live in safety, all of them without walls, bars, or gates. You will come to take spoil and prey, to turn your hand against the waste places that are inhabited again and against the people gathered out of the nations, who have gained cattle and goods and live in the midst of the land. Sheba, Dedan, and the merchants of Tarshish with all their young lions will say to you, Have you come to take spoil? Have you gathered your company to take prey, to carry off silver and gold, cattle and goods, a great spoil?

      So Ezekiel is to say to Gog: The Lord God says, In that day when my people Israel live in safety, will you not know it? You will come from your place in the far north, you and many peoples with you, all of them on horses, a great company and a mighty army. You will come up against my people Israel like a cloud covering the land. It will be in the latter days. I will bring you against my land, so that the nations may know me when I am sanctified in you, Gog, before their eyes.
  - range: 17-23
    heading: 'The Lord answers the invasion'
    plain: |
      The Lord God says: Are you the one of whom I spoke in old time by my servants the prophets of Israel, who prophesied in those days, for many years, that I would bring you against them? At the time when Gog comes against the land of Israel, says the Lord God, my fury will come up in my face. In my jealousy and in the fire of my wrath I have spoken: in that day there will be a great shaking in the land of Israel. The fish of the sea, the birds of the heaven, the beasts of the field, every creeping thing, and every person on the face of the earth will shake at my presence. The mountains will be thrown down, the steep places will fall, and every wall will fall to the ground.

      I will call for a sword against him on all my mountains, says the Lord God; every man’s sword will be against his brother. I will plead against him with pestilence and with blood. I will rain on him, on his bands, and on the many peoples with him an overflowing rain, great hailstones, fire, and brimstone. So I will magnify myself and sanctify myself. I will be known in the eyes of many nations, and they will know that I am the Lord.

notes:
  - ref: 2
    phrase: 'Gog, the land of Magog'
    kind: history
    title: 'Gog of the land of Magog'
    body: |
      Gog is a man and Magog is his country: he is the “King of Magog.” The Hebrew is abrupt, with no preposition and with the article (*Gog, land of the Magog*), and a modern translation fills it out as “Gog, of the land of Magog.”

      Magog is an old name. It first appears as a son of Japheth in the table of nations ([[Gen. 10:2]]; see the note there), and as a country it has been placed near the Black Sea. Elsewhere in the Old Testament the name Gog belongs to a Reubenite in a genealogy ([[1 Chr. 5:4]]). This Gog is addressed as someone still to come, “in the latter years.”

      John writes the two names as a pair, “Gog and Magog, to gather them together to battle” ([[Rev. 20:8]]), of a later battle (see the note on [[Ezek. 38:8]]). In Ezekiel’s own sentence they are a king and his land.
    sources: [bd-gog, bd-magog, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 2
    phrase: 'the chief prince of Meshech and Tubal'
    kind: words
    title: 'Chief prince, or prince of Rosh'
    body: |
      The Hebrew behind “chief prince” can be read two ways, as a title or as a third place name, and the King James translators and the ancient Greek translators chose differently. The words are *nesi rosh*. *Nasi* is “prince,” and *rosh* is the everyday Hebrew word for a head, used also for a “head = chief (man).” The King James translators took it so: Gog is the head prince of the two peoples named next.

      The ancient Greek translators read *rosh* as a name instead: “Rhos, prince of Mesoch and Thobel.” A modern translation keeps “chief prince” in its text and prints the other in the margin: “Or Magog, the prince of Rosh, Meshech.”

      Meshech and Tubal are sons of Japheth beside Magog ([[Gen. 10:2]]), and Ezekiel has mentioned them twice already: as traders with Tyre, who “traded the persons of men and vessels of brass in thy market” ([[Ezek. 27:13]]), and among the nations lying slain in the pit ([[Ezek. 32:26]]). Where these peoples lived is taken up in the note on [[Ezek. 38:5]].
    sources: [oshb-wlc, bdb, lxx-rahlfs, esv, lds-scriptures]

  - ref: 4
    phrase: 'put hooks into thy jaws'
    kind: symbol
    title: 'Led by a hook, and still his own plan'
    body: |
      The hooks picture Gog as an animal led by a ring: he comes because the Lord brings him. The Hebrew word is a “hook, ring, in nose of captive.” Isaiah used it of Sennacherib: “will I put my hook in thy nose, and my bridle in thy lips” ([[Isa. 37:29]]). Ezekiel used it of Pharaoh, pictured as a crocodile: “I will put hooks in thy jaws” ([[Ezek. 29:4]]). On this reading Gog “is represented as an unmanageable beast, which is compelled to follow its leader.” The ancient Greek translation has no hooks here and says only, “I will gather thee, and all thine host,” and the clause has been questioned on that ground.

      The chapter then says something that seems to pull the other way. In verse 10 the invasion is Gog’s own idea: “things come into thy mind, and thou shalt think an evil thought,” and the thought is plunder. The chapter does not treat these as rival explanations. It states both, and verse 16 returns to the first: “I will bring thee against my land.” Verses 10–13 have been read as the account of the motive by which Gog “incurred guilt, notwithstanding the fact that he was led by God.” He is not excused by being used.
    sources: [bdb, keil-ezekiel, lxx-rahlfs, lds-scriptures]

  - ref: 5
    phrase: 'Persia, Ethiopia, and Libya with them'
    kind: history
    title: 'Allies from every quarter'
    body: |
      The names in verses 2–6 reach to the edges of the world Ezekiel’s hearers knew, in the north, the east, and the south. Gog’s own peoples are northern, placed in northern Asia Minor. Gomer and Togarmah, also from the table of nations ([[Gen. 10:2–3]]), come from “the north quarters” and have been associated with peoples of Asia Minor and Europe; one older identification makes them “the Cimmerians” and “the Armenians.” Persia lay to the east, beyond Elam. Ethiopia and Libya are Cush and Phut in the Hebrew, both in Africa: Cush south of Egypt and Libya west of it.

      So the army is drawn from “the extreme north” and from “east (Persians) and south (Ethiopians), i.e., on the borders of the then known world.” The nations that fill the rest of the book are missing. Ammon, Moab, Edom, the Philistines, Egypt, and Babylon itself are not named, which has been taken as pointing “to a time when their former foes” will have “passed away from the stage of history.”

      That the nations come from north and south, east and west has been taken to teach that all nations will fight against Israel, as Zechariah says: “I will gather all nations against Jerusalem to battle” ([[Zech. 14:2]]). The names are those of Ezekiel’s day. They “refer to general areas of the ancient world, so a list of modern nations” cannot be made from them.
    sources: [ot-manual-27, ot-manual-kings-i, keil-ezekiel, bd-persia, bd-ethiopia, bd-libya, lds-scriptures]

  - ref: 8
    phrase: 'in the latter years'
    kind: scripture
    title: 'Two battles under one name'
    body: |
      This invasion appears to belong to the time of the Lord’s Second Coming, and it is distinct from the “Gog and Magog” of Revelation, which comes a thousand years later. The chapter’s own markers of time are “After many days,” “in the latter years,” and, in verse 16, “in the latter days.” The Hebrew of the last two is *the end of the years* and *the end of the days*. The second is a phrase the prophets use elsewhere ([[Isa. 2:2]]), and it is used here “of the period of Gog’s attack upon restored Israel.”

      The placing is worded with care: “All this appears to be at the Second Coming of the Lord,” with another battle, the one called Gog and Magog, at the end of the thousand years. President Joseph Fielding Smith said it plainly: “Before the coming of Christ, the great war, sometimes called Armageddon, will take place as spoken of by Ezekiel, chapters 38 and 39. Another war of Gog and Magog will be after the millennium.”

      The second battle is John’s. After the thousand years Satan is loosed and gathers the nations, and “fire came down from God out of heaven, and devoured them” ([[Rev. 20:9]]). Modern revelation describes the same last conflict without the names, as Michael and the hosts of heaven against the devil and his armies ([[D&C 88:111–116]]). The names are used for both “because they symbolize an alliance of great, evil power,” and Gog himself has been understood as “a symbolic name for the leader or leaders” of that power.
    sources: [bd-gog, ot-manual-27, ot-manual-kings-i, oshb-wlc, bdb, lds-scriptures]

  - ref: 11
    phrase: 'the land of unwalled villages'
    kind: symbol
    title: 'A land without walls'
    body: |
      The unwalled villages are open hamlets, and the verse ties them to a people “at rest, that dwell safely.” The Hebrew word means an “open region, hamlet,” and the phrase is “a land of hamlets,” set against walled towns. The verse spells out the contrast: the people dwell “without walls,” with “neither bars nor gates.” “Dwell safely” is the wording of the covenant of peace in chapter 34: “they shall dwell safely in the wilderness, and sleep in the woods” ([[Ezek. 34:25]]).

      Zechariah uses the same Hebrew word of Jerusalem, and there the Lord Himself is the wall: “Jerusalem shall be inhabited as towns without walls” ([[Zech. 2:4]]), “For I, saith the LORD, will be unto her a wall of fire round about” ([[Zech. 2:5]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 13
    phrase: 'Art thou come to take a spoil?'
    kind: history
    title: 'The merchants’ question'
    body: |
      Three trading peoples ask Gog whether he has come for plunder, and the text does not say whether they object or hope for a share. Sheba, Dedan, and Tarshish were all in Ezekiel’s list of the partners of Tyre: Tarshish with “silver, iron, tin, and lead” ([[Ezek. 27:12]]), Dedan ([[Ezek. 27:20]]), and Sheba “with chief of all spices, and with all precious stones, and gold” ([[Ezek. 27:22]]). Sheba gave its name to “a portion of southern Arabia,” and Tarshish was probably “Tartessus in Spain.” Their “young lions” is what the Hebrew says; modern translations take the figure as “its leaders” or “its young warriors,” and the ancient Greek has “all their villages.”

      Their question repeats, almost word for word, what verse 12 has just said Gog intends: “To take a spoil, and to take a prey.” On one reading the merchants’ words “are not to be taken as expressing their sympathies” and only make plain “the obvious thirst for booty” in Gog’s army.

      Verse 12 names a second attraction. The people “dwell in the midst of the land,” and the Hebrew is, literally, *upon the navel of the earth*. One modern translation has “who live at the center of the earth,” with the note “Heb navel.” The expression has been explained from an earlier verse: “This is Jerusalem: I have set it in the midst of the nations” ([[Ezek. 5:5]]). On that reading Gog is moved by “covetous desire for the possessions of the people of God, and envy at his exalted position in the centre of the world.”
    sources: [bd-tarshish, bd-sheba, bdb, keil-ezekiel, esv, nrsvue, lxx-rahlfs, oshb-wlc, lds-scriptures]

  - ref: 16
    phrase: 'when I shall be sanctified in thee, O Gog'
    kind: scripture
    title: 'Sanctified through an enemy'
    body: |
      The Lord says why He brings Gog: to show the nations His holiness by what happens to him. “In thee” is, in the Hebrew, “through thee.” Modern translations have “when through you, O Gog, I display my holiness before their eyes,” or “I vindicate my holiness.”

      Ezekiel has used this sentence before, and of opposite things. Of Zidon the Lord said He would be known “when I shall have executed judgments in her, and shall be sanctified in her” ([[Ezek. 28:22]]). Of Israel He said the nations would know Him “when I shall be sanctified in you before their eyes” ([[Ezek. 36:23]]), and there the means was gathering and cleansing (see the notes on [[Ezek. 28:25]] and [[Ezek. 36:23]]). The Lord shows Himself holy in a people He restores and in an enemy He judges. With Gog it is judgment, and the wording to him matches the wording to Israel almost exactly.

      Both lessons are drawn in the next chapter. Israel learns: “So will I make my holy name known in the midst of my people Israel” ([[Ezek. 39:7]]). The nations learn why the exile happened at all: “the heathen shall know that the house of Israel went into captivity for their iniquity” ([[Ezek. 39:23]]). In the exile His holy name had been profaned among the nations (see the note on [[Ezek. 36:20]]). This chapter’s last verse joins the two verbs, “Thus will I magnify myself, and sanctify myself,” and ends with the book’s refrain, said now of “many nations.”
    sources: [lds-scriptures, esv, nrsvue]

  - ref: 17
    phrase: 'Art thou he of whom I have spoken in old time'
    kind: scripture
    title: 'The earlier prophets do not name Gog'
    body: |
      No earlier prophet names Gog, so the verse raises the question of which prophecies the Lord means, and it has been called “a question difficult to answer.” One answer is that the statement “does not mean that those prophets had actually mentioned Gog, but simply that Gog was the enemy of whose rising up against the people of God the prophets of the former time had prophesied.” What is in view, on this reading, is every earlier prophecy of “Jehovah’s day of judgment upon all the heathen.”

      The same reading gives the remark a purpose: to show that the attack “is not an unexpected event, or one at variance with the promise of the restoration.” An invasion after the gathering does not mean that the promise of peace has failed; it was foretold long before.
    sources: [keil-ezekiel]

  - ref: 19
    phrase: 'a great shaking in the land of Israel'
    kind: prophets
    title: 'The earthquake at the Lord’s coming'
    body: |
      President Joseph Fielding Smith taught that a great earthquake comes with the Lord’s appearing, and he pointed to these verses. The Hebrew noun is the Old Testament’s word for an earthquake, and a modern translation has “a great earthquake in the land of Israel.” Verse 20 gives its cause. Fish, birds, beasts, and “all the men that are upon the face of the earth, shall shake at my presence”; the Hebrew is, literally, *from before my face*.

      President Smith said of that day: “when they are about to go under, then the Lord comes. There will be the great earthquake. The earthquake will not be only in Palestine.” He went on to say that “the whole earth is going to be shaken,” and for the great changes of that time he pointed to “the book of Ezekiel (38:17–23).”

      Other scripture speaks of the earth shaking at that coming. Zechariah says “his feet shall stand in that day upon the mount of Olives” ([[Zech. 14:4]]), and the mountain splits. Modern revelation repeats it: “then shall the Lord set his foot upon this mount, and it shall cleave in twain, and the earth shall tremble” ([[D&C 45:48]]). John sees “a great earthquake, such as was not since men were upon the earth” ([[Rev. 16:18]]).

      Verse 21 adds what follows in the invading army: “every man’s sword shall be against his brother.” Zechariah has the same thing: “a great tumult from the LORD shall be among them” ([[Zech. 14:13]]).
    sources: [ot-manual-kings-i, bdb, esv, oshb-wlc, lds-scriptures]

  - ref: 22
    phrase: 'fire, and brimstone'
    kind: scripture
    title: 'The fire that modern revelation credits to Ezekiel'
    body: |
      A revelation to Joseph Smith names Ezekiel as the prophet who foretold a destruction by fire, and this verse has been identified as the one it refers to. The revelation was given in September 1830: “the great and abominable church, which is the whore of all the earth, shall be cast down by devouring fire, according as it is spoken by the mouth of Ezekiel the prophet” ([[D&C 29:21]]).

      Ezekiel’s book does not have the revelation’s words: “Nowhere in the Old Testament book of Ezekiel is this language found.” For that reason other explanations have also been offered: that the words come from a prophecy of Ezekiel’s lost from his book, or from another writing of his “that is no longer extant,” or that the Lord “paraphrased an extant prophecy of Ezekiel using language from the Book of Mormon,” where Nephi’s vision supplies the names. On the last of these the passage is still this one: “the prophecy of the battle of Gog and Magog in Ezekiel 38–39 could fit the description of the great and abominable church being destroyed.” These are offered as possibilities, not as settled answers.

      Fire falls on the invaders in this verse, with “an overflowing rain, and great hailstones,” and again in the next chapter: “I will send a fire on Magog” ([[Ezek. 39:6]]).
    sources: [ot-manual-27, sc-knowhy-784, lds-scriptures]

christ: |
  The Lord’s answer to Gog is His own coming. All who are on the earth “shall shake at my presence” (verse 20), which the chapter heading in the Church’s edition takes as His coming “amid war and pestilence.” The LORD who speaks here is Jehovah (see the note on [[Ezek. 1:26]]), and it is He who says “my land,” “my people,” and “my mountains.”

  Church leaders have taught the same. Elder Bruce R. McConkie wrote that the Lord is to come again “during the course of the great war between Israel and Gog and Magog.” Elder Charles W. Penrose described what Jerusalem will then see: “he will set his feet upon the Mount of Olives,” overthrow the gathered armies, and “show them the tokens of his crucifixion and disclose himself as Jesus of Nazareth.”

  Ezekiel’s last line here is that the nations “shall know that I am the LORD.” Modern revelation’s account of that deliverance has a like sentence, spoken of the Jews who ask about His wounds ([[D&C 45:51]]): “Then shall they know that I am the Lord; for I will say unto them: These wounds are the wounds with which I was wounded in the house of my friends” ([[D&C 45:52]]).

explore: |
  - The second half of the prophecy: Gog’s fall, the burial in the valley of Hamon-gog, and the Lord’s face no longer hidden from Israel: [[Ezek. 39]].
  - Zechariah’s account of all nations gathered against Jerusalem and the Lord’s feet on the mount of Olives: [[Zech. 12:2–10]]; [[Zech. 14:1–9]].
  - Joel’s valley of decision, where the Lord pleads with the nations: [[Joel 3:1–2]]; [[Joel 3:9–17]].
  - John’s Armageddon, with the earthquake and the hail, and his later Gog and Magog: [[Rev. 16:14–21]]; [[Rev. 20:7–10]].
  - The same events in modern revelation: [[D&C 29:14–21]]; [[D&C 45:47–53]]; [[D&C 88:111–116]].
  - Where the names come from, the table of nations: [[Gen. 10:2–5]].
  - The promises this chapter supposes already kept: [[Ezek. 34:25–28]]; [[Ezek. 36:8–12]]; [[Ezek. 37:21–28]].

