chapter: 23
title: 'Two Sisters'
tagline: 'Samaria and Jerusalem are two sisters, both the Lord’s, who gave themselves to the great powers around them. Each is handed over to the power she courted, and Jerusalem, who watched her sister fall, must drink her sister’s cup.'
when: 'No date of its own. The chapter stands under the heading of 20:1, “the seventh year, in the fifth month, the tenth day of the month” (about 590 B.C.), and before the next date in the book, the ninth year (24:1).'

setting: |
  Ezekiel, carried away captive with Jehoiachin, is in Babylon, and Jerusalem is still standing. The chapter has no date. It is the last oracle under the date of [[Ezek. 20:1]], the day certain elders came to inquire of the Lord and were refused. Three times since that day the prophet has been asked the same question: “wilt thou judge them?” ([[Ezek. 20:4]]), “wilt thou judge the bloody city?” ([[Ezek. 22:2]]), and now, in verse 36, “wilt thou judge Aholah and Aholibah?” Each time what follows is a list of abominations.

  This list is told as a story. Its subject is the idolatry and the foreign alliances of Jerusalem and Samaria, under the figure of the unfaithful wife used in chapter 16, with a second wife added. Samaria, the capital of the northern kingdom, had been gone since 721 B.C., well over a century. Her fate is the chapter’s evidence against Jerusalem, and Ezekiel tells it to exiles who had already been carried from the second sister’s city.

thread: |
  The story has one plot, told twice. A sister sees a great power, wants it, gives herself to it, and is then delivered into the hand of that same power. Samaria wanted Assyria, and Assyria destroyed her (verses 5–10). Jerusalem wanted Assyria, then Chaldea, then Egypt again, and the Lord says, “I will raise up thy lovers against thee” (verse 22).

  What makes Jerusalem’s case worse is that she had the first telling in front of her. “Her sister Aholibah saw this” (verse 11), and went further. The chapter keeps the two side by side from then on: “they took both one way” (verse 13); “Thou hast walked in the way of thy sister; therefore will I give her cup into thine hand” (verse 31).

  Under the politics the chapter names one cause, in verse 35: “thou hast forgotten me, and cast me behind thy back.” The last section (verses 36–49) then goes over both sisters once more: two charges, adultery and blood, and a sentence. It ends with the refrain explained at the note on [[Ezek. 6:7]], “ye shall know that I am the Lord GOD.” No promise follows it here.

sections:
  - range: 1-4
    heading: 'Two women, daughters of one mother'
    plain: |
      The word of the Lord comes to Ezekiel again. There were two women, daughters of one mother. They were unchaste in Egypt, in their youth. The elder was named Aholah and her sister Aholibah. They became the Lord’s, and they bore sons and daughters. Aholah is Samaria, and Aholibah is Jerusalem.
  - range: 5-10
    heading: 'Aholah and the Assyrians'
    plain: |
      Aholah was unfaithful while she was the Lord’s. She doted on the Assyrians her neighbours: captains and rulers clothed in blue, desirable young men, horsemen on horses. She gave herself to the choice men of Assyria and defiled herself with all their idols. She did not leave off the unchastity she had brought from Egypt. So the Lord delivered her into the hand of her lovers, the Assyrians. They exposed her, took her sons and daughters, and killed her with the sword. She became famous among women, for judgment had been done on her.
  - range: 11-21
    heading: 'Aholibah goes further'
    plain: |
      Her sister Aholibah saw this and was more corrupt than she. She too doted on the Assyrians, captains and rulers splendidly dressed, horsemen, desirable young men. The Lord saw that she was defiled; both sisters took one way. She went further. She saw men portrayed on the wall, images of the Chaldeans drawn in vermilion, with girdles on their loins and dyed attire on their heads, all of them looking like princes. As soon as she saw them she doted on them and sent messengers to them in Chaldea. The Babylonians came to her and defiled her, and her mind was alienated from them. She uncovered her shame, and the Lord’s mind was alienated from her as it had been from her sister. Still she multiplied her unfaithfulness, remembering the days of her youth in the land of Egypt and longing for her lovers there.
  - range: 22-35
    heading: 'The lovers return, and the sister’s cup'
    plain: |
      So the Lord God says to Aholibah: He will raise up against her the lovers from whom her mind is alienated and bring them on every side: the Babylonians and all the Chaldeans, Pekod, Shoa, and Koa, and all the Assyrians with them, desirable young men, captains and rulers, all on horses. They will come with chariots, wagons, and wheels and a host of people, with buckler, shield, and helmet all around. The Lord will set judgment before them, and they will judge her by their judgments. He will set His jealousy against her. They will deal with her in fury, take her nose and ears, take her sons and daughters, strip her of her clothes and jewels; what remains of her will fall by the sword and be devoured by fire. So He will make her lewdness cease, and she will not remember Egypt any more.

      The Lord God says He will deliver her to those she hates. They will take all she has worked for and leave her naked and bare, because she went after the heathen and was polluted with their idols. She walked in her sister’s way, so her sister’s cup is put in her hand. It is deep and large and holds much. She will be laughed at. She will be filled with drunkenness and sorrow, with the cup of astonishment and desolation, the cup of her sister Samaria. She will drain it and break its sherds. Because she has forgotten the Lord and cast Him behind her back, she must bear her lewdness.
  - range: 36-44
    heading: 'The charges'
    plain: |
      The Lord asks Ezekiel whether he will judge Aholah and Aholibah, and tells him to declare their abominations. They have committed adultery, and blood is on their hands. They have committed adultery with their idols, and the sons they bore to the Lord they have passed through the fire to be devoured. They have defiled His sanctuary and profaned His sabbaths: when they had slain their children to their idols, they came the same day into His sanctuary. They sent a messenger for men from far away, and the men came. For them she washed, painted her eyes, and put on ornaments. She sat on a stately bed with a table before it, on which she had set the Lord’s incense and oil. There was the sound of a multitude at ease, and with the common men were brought Sabeans from the wilderness, who put bracelets on their hands and beautiful crowns on their heads. The Lord said of her who was old in adulteries, Will they go on with her now? And they did, with Aholah and Aholibah both.
  - range: 45-49
    heading: 'The sentence'
    plain: |
      Righteous men will judge them as adulteresses are judged and as women who shed blood are judged, because that is what they are. The Lord God will bring up a company against them and give them over to be removed and spoiled. The company will stone them and cut them down with swords, kill their sons and daughters, and burn their houses. So the Lord will make lewdness cease out of the land, that all women may be taught not to do as they did. Their lewdness will be repaid on them, and they will bear the sins of their idols, and they will know that He is the Lord God.

notes:
  - ref: 2
    phrase: 'two women, the daughters of one mother'
    kind: symbol
    title: 'Two sisters, one husband'
    body: |
      The two women are the two kingdoms of one people, and their unfaithfulness is a figure for what those kingdoms did with idols and with foreign powers. Verse 4 gives the key itself: “Samaria is Aholah, and Jerusalem Aholibah.” The Church’s standard reading is that everything said in the chapter about harlotry and about the women’s bodies is “metaphorical,” the prophets’ figure “in which Jehovah is the husband and the nation Israel is the wife.” Unfaithfulness in that figure has two senses at once, one of marriage and one of worship. The fuller explanation is at the note on [[Ezek. 16:15]].

      What chapter 16 did not have is a second wife. There Samaria was Jerusalem’s sister ([[Ezek. 16:46]]). Here both sisters “were mine,” and both bore children to the Lord.

      Jeremiah had told it this way earlier, “in the days of Josiah the king” ([[Jer. 3:6]]). Israel played the harlot and was put away, “yet her treacherous sister Judah feared not, but went and played the harlot also” ([[Jer. 3:8]]). Jeremiah’s verdict is the one Ezekiel reaches in verse 11: “The backsliding Israel hath justified herself more than treacherous Judah” ([[Jer. 3:11]]). The sister who saw the warning and ignored it is the more guilty.
    sources: [ot-manual-26, esv, lds-scriptures]

  - ref: 3
    phrase: 'they committed whoredoms in Egypt'
    kind: history
    title: 'Idolatry that began in Egypt'
    body: |
      The unfaithfulness is dated to Egypt, before the Exodus, and Ezekiel has already said in plain terms what it was. In the oracle that heads this group of chapters, the Lord recalls what He told Israel while they were still in Egypt: “defile not yourselves with the idols of Egypt” ([[Ezek. 20:7]]). They did not listen: “neither did they forsake the idols of Egypt” ([[Ezek. 20:8]]).

      Egypt stays in the story to the end. Samaria did not give up what she “brought from Egypt” (verse 8). Jerusalem ends by “calling to remembrance the days of her youth” there (verse 19). The judgment is described as the end of that memory: she will not “remember Egypt any more” (verse 27).
    sources: [lds-scriptures]

  - ref: 4
    phrase: 'Aholah the elder, and Aholibah her sister'
    kind: words
    title: 'Aholah and Aholibah'
    body: |
      Both names are built on the Hebrew word for “tent.” The first is “A tent” and the second “My tent is in her.” A modern translation spells them as the Hebrew does, Oholah and Oholibah. Oholah has also been explained as “she who has a tent,” a worshipper at a tent-shrine, and Oholibah as “tent in her,” with the two names alike in meaning.

      The difference between the names has been read as the point of the allegory. On that reading the tent “is the sanctuary: both tabernacle and temple,” and the names describe each kingdom by its worship: “Jerusalem had the sanctuary of Jehovah; Samaria, on the other hand, had her own sanctuary, i.e., one invented by herself.” This is a reading of the names and not something the verse says.

      “The elder” is in Hebrew “the great one.” It has been taken as the greater sister and not the older, since ten of the tribes belonged to Samaria; the same word is discussed at the note on [[Ezek. 16:46]].
    sources: [bdb, oshb-wlc, keil-ezekiel, esv, lds-scriptures]

  - ref: 5
    phrase: 'the Assyrians her neighbours'
    kind: history
    title: 'Samaria and Assyria'
    body: |
      Samaria’s lover is Assyria, and what the allegory calls doting, Kings and Hosea record as tribute paid for Assyria’s help. Menahem “gave Pul a thousand talents of silver, that his hand might be with him” ([[2 Kgs. 15:19]]). Hosea has Ezekiel’s figure for it: “they are gone up to Assyria … Ephraim hath hired lovers” ([[Hosea 8:9]]).

      Verse 6 describes the Assyrians by rank and force: blue robes, “captains and rulers,” cavalry. Verse 7 adds that she defiled herself with their idols.

      Hoshea, the king in whose ninth year Samaria fell, “became his servant, and gave him presents” ([[2 Kgs. 17:3]]). Then the king of Assyria found that “he had sent messengers to So king of Egypt” ([[2 Kgs. 17:4]]). After a siege of three years, “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]). That was in 721 B.C. The lover was the executioner.

      Her being “famous among women” afterward is no honor; a modern translation has “a byword among women.”
    sources: [lds-scriptures, bd-samaria, bd-captivities, esv]

  - ref: 14
    phrase: 'men portrayed upon the wall'
    kind: history
    title: 'Pictures on the wall'
    body: |
      The pictures are of Chaldean officers, and they mark the second turn in Jerusalem’s story, which goes from Assyria to Babylon and then to Egypt again. Assyria (verse 12) is King Ahaz’s appeal to Tiglath-pileser, told at the note on [[Ezek. 16:26]].

      Then comes Chaldea. She sees figures of officers drawn on a wall in vermilion, a red colour, with girdles on their loins and dyed attire on their heads, “all of them princes to look to.” The Hebrew word for the pigment is recorded in one other verse, where Jeremiah speaks of a man who builds himself a wide house, “ceiled with cedar, and painted with vermilion” ([[Jer. 22:14]]). She wants them on sight and sends messengers to Chaldea. The chapter does not say where the wall was or which embassy is meant.

      Then her mind turns from them (see the note on verse 17). Kings tells of Judah’s service to Babylon and of its end: Jehoiakim “became his servant three years: then he turned and rebelled against him” ([[2 Kgs. 24:1]]).

      Alienated from Babylon, she turns in verses 19–21 to the lovers of her youth in Egypt. Ezekiel has already told the break with Babylon in plain words: Zedekiah “rebelled against him in sending his ambassadors into Egypt, that they might give him horses and much people” ([[Ezek. 17:15]]).
    sources: [bdb, esv, ot-manual-26, lds-scriptures]

  - ref: 17
    phrase: 'her mind was alienated from them'
    kind: words
    title: 'Alienated from whom?'
    body: |
      The Hebrew says that her soul was wrenched away from the Babylonians, and the Joseph Smith Translation turns the phrase to say what the affair had done between her and the Lord. “Mind” is the Hebrew word for soul. The verb is the one used when Jacob’s thigh was put “out of joint” ([[Gen. 32:25]]); elsewhere it is used of a soul “torn away, alienated from any one.” A modern translation has “she turned from them in disgust.”

      Verse 18 then uses the same verb of the Lord: “then my mind was alienated from her.” Jeremiah has the same verb in a warning to Jerusalem: “Be thou instructed, O Jerusalem, lest my soul depart from thee” ([[Jer. 6:8]]).

      Joseph Smith’s change is small. In verse 17 her mind is alienated “from me by them,” and in verse 22 the lovers are those “by whom thy mind is alienated from me.” With it the sisters are turned “not from their lovers … but from God by their lovers.” The same change has been reported for verse 28, though the Church’s edition gives it in its footnotes only at verses 17 and 22.
    sources: [bdb, oshb-wlc, esv, ot-manual-26, lds-scriptures]

  - ref: 23
    phrase: 'Pekod, and Shoa, and Koa'
    kind: history
    title: 'The lovers return as an army'
    body: |
      The sentence on Jerusalem is that the powers she courted will come back as her attackers, and verse 23 calls the roll. Beside the Babylonians and Chaldeans stands Pekod, “a people in Babylonian army,” a tribe of southeast Babylonia on the border of Elam. Jeremiah names “the inhabitants of Pekod” in his own oracle against Babylon ([[Jer. 50:21]]). Shoa and Koa are listed with it; the text says nothing more about them. The Assyrians come “with them.”

      The list describes them as before. These are “desirable young men, captains and rulers,” all of them “riding upon horses.” That is the description of the Assyrians in verse 6 and again in verse 12, repeated almost word for word. What she admired in them is what comes against her.
    sources: [bdb, lds-scriptures]

  - ref: 24
    phrase: 'they shall judge thee according to their judgments'
    kind: history
    title: 'Judged by Babylon’s judgments'
    body: |
      The Lord hands the case to the Babylonians, and they will punish in their own way. “I will set judgment before them” has been read as “I give up to them,” and a modern translation has “I will commit the judgment to them.” The measure is “their judgments.”

      For the king it meant Riblah. Zedekiah was brought to the king of Babylon there, “and they gave judgment upon him” ([[2 Kgs. 25:6]]). His sons were killed in front of him, his eyes were put out, and he was taken to Babylon in fetters.

      Verse 25 adds the cutting off of nose and ears. Older interpreters explained this by a custom of punishing an adulteress; it has also been read, against that, as “the mutilation of prisoners captured by their enemies.” The verse goes on to sword, captivity, and fire.
    sources: [esv, keil-ezekiel, lds-scriptures]

  - ref: 31
    phrase: 'therefore will I give her cup into thine hand'
    kind: symbol
    title: 'Her sister’s cup'
    body: |
      The cup is the judgment Samaria has already drunk, now passed to Jerusalem. Verses 32–34, which a modern translation sets out as lines of verse, describe it. It is “deep and large,” and “it containeth much.” It fills the drinker with “drunkenness and sorrow.” It is “the cup of astonishment and desolation,” or in the modern translation “a cup of horror and desolation.” She will drain it to the last and break the sherds.

      Jeremiah has the same cup: “Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink it” ([[Jer. 25:15]]). He also has the threat to fill Jerusalem’s kings, priests, and prophets “with drunkenness” ([[Jer. 13:13]]). Jeremiah’s page [The Cup of the Lord’s Fury](/jeremiah/themes/cup-of-fury/) follows the cup from Judah to the nations and to Babylon.

      Here the cup is named three times as the sister’s: “her cup,” “thy sister’s cup,” “the cup of thy sister Samaria.”
    sources: [esv, lds-scriptures]

  - ref: 39
    phrase: 'then they came the same day into my sanctuary'
    kind: history
    title: 'From the idol to the temple in one day'
    body: |
      The charge is double: children were sacrificed to idols, and those who did it then came to worship in the Lord’s house. The sacrifice of children is explained at the note on [[Ezek. 16:20]]. What this verse adds is “the same day,” which sets the two acts side by side.

      Kings records both of one king within three verses. Manasseh “built altars in the house of the LORD” ([[2 Kgs. 21:4]]), and “he made his son pass through the fire” ([[2 Kgs. 21:6]]).

      The children are called the sons “whom they bare unto me” (verse 37), and the sanctuary and the sabbaths are “my.” Every item in the charge is something that belonged to the Lord.
    sources: [lds-scriptures]

  - ref: 42
    phrase: 'Sabeans from the wilderness'
    kind: words
    title: 'Sabeans or drunkards'
    body: |
      The Hebrew here is written one way and read another, and as written it means “drunkards.” The Hebrew text sometimes carries two forms of a word: the consonants as written (the *ketiv*) and the form the reading tradition says to pronounce (the *qere*). The written form in this verse is a participle meaning “wine-bibber, drunkard.” The form read is “perhaps name of a people,” and the King James Version follows it with “Sabeans.” A modern translation puts “drunkards were brought from the wilderness” in its text and “Sabeans” in its margin.

      Either way the scene of verses 40–42 is a reception for men sent for “from far.” She bathes, paints her eyes, and sits at a table. On the table are “mine incense and mine oil,” as in chapter 16: “thou hast set mine oil and mine incense before them” ([[Ezek. 16:18]]).

      The details are not to be pressed: the same translation marks the Hebrew of verse 43 as uncertain in meaning.
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 45
    phrase: 'the righteous men, they shall judge them'
    kind: history
    title: 'Who the righteous men are'
    body: |
      The “righteous men” have been taken as the Chaldeans, called righteous for the justice of the sentence they carry out and not for their character. On that reading they “are not designated as righteous in contrast to the Israelites, but as the instruments of the punitive righteousness of God in this particular instance.” The text does not name them. It names the “company” of verse 46, and the lovers of verses 22–24 to whom judgment was committed.

      The verse itself gives the ground of the sentence: they are judged “after the manner of adulteresses, and after the manner of women that shed blood; because they are adulteresses, and blood is in their hands.” These are the two charges of verse 37, and of chapter 16, where Jerusalem is judged “as women that break wedlock and shed blood are judged” ([[Ezek. 16:38]]). The penalties of verse 47 (stoning, the sword, houses burned) are the ones chapter 16 gave; see the note on [[Ezek. 16:40]].

      On the same reading the “all women” who are to be taught in verse 48 are “all nations,” and verse 10 is read the same way: Samaria’s name “was circulated among the nations.”
    sources: [keil-ezekiel, lds-scriptures]

christ: |
  The husband of this chapter is the Lord. “They were mine,” He says of both sisters in verse 4. Their children are sons “whom they bare unto me” (verse 37), and what He says to Jerusalem in verse 35 is “thou hast forgotten me.” In the prophets’ figure of the marriage the husband is Jehovah; who Jehovah is has been said at [[Ezek. 1:26]].

explore: |
  - Jeremiah’s two sisters, a generation earlier: [[Jer. 3:6–11]].
  - The longer telling of the unfaithful wife, which ends where this chapter does not, with the covenant remembered: [[Ezek. 16]], and its close at [[Ezek. 16:60–63]].
  - The history under the allegory: Samaria’s end in [[2 Kgs. 17:1–6]], and Judah between Babylon and Egypt in [[2 Kgs. 24]] and [[Ezek. 17:11–21]].
  - The cup handed round the nations: [[Jer. 25:15–29]]. And the day it is taken out of Jerusalem’s hand: [[Isa. 51:17–22]].
  - Where the unfaithfulness is said to begin: [[Ezek. 20:5–9]].

