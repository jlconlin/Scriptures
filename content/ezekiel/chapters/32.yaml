chapter: 32
title: 'Down to the Pit'
tagline: 'Two funeral songs for Pharaoh, given before his fall. In the first, Pharaoh is a river monster netted and thrown on the land while the sky goes dark. In the second, Egypt is sent down to lie among the nations that once spread terror and now lie slain.'
when: 'Two dates, both counted from Jehoiachin’s captivity (1:2). Verses 1–16: “in the twelfth year, in the twelfth month, in the first day of the month” (about 585 B.C.). Verses 17–32: “in the twelfth year, in the fifteenth day of the month,” with no month named. As the Hebrew dates stand, both come after the tenth month of that year, when word came that Jerusalem had fallen (33:21); the Greek has other months (see the note on verse 1).'

setting: |
  Ezekiel is in Babylon, and Jerusalem has fallen. The book does not tell of the fall until the next chapter ([[Ezek. 33:21]]), yet as the Hebrew stands this chapter’s dates are later than the day the news reached the exiles. The dates in this part of the book are not in order (see the note on verse 1).

  This is the last of the four chapters on Egypt (29–32), and it closes the eight chapters of “prophecies against Israel’s enemies.” Pharaoh king of Egypt has been addressed since chapter 29 (see the note on [[Ezek. 29:2]]). That chapter charged Egypt with being a staff of reed to the house of Israel; this one says nothing of Israel at all.

  The chapter holds “two lamentations composed at different times.” The first (verses 1–16) is the last passage in the book that calls itself a lamentation; the earlier ones were for the princes of Israel, for Tyre, and for Tyre’s king. The second (verses 17–32) has been called “an elegiac expansion of the closing thought of the previous chapter,” where Pharaoh is told he will be brought down to “the nether parts of the earth” ([[Ezek. 31:18]]).

thread: |
  Both poems bring Egypt down.

  In the first Pharaoh is a beast in the river. He troubles the waters with his feet (verse 2). The Lord nets him, throws him on the open field, and puts out the lights of heaven over him (verses 3–8). The poem then says in plain words who will do this, “the king of Babylon” (verse 11), and its last picture is of water no longer troubled by anyone (verses 13–14).

  The second is set in a burial ground under the earth. Egypt is told to go down, and the poem walks past those already there: Asshur, Elam, Meshech and Tubal, Edom, the princes of the north, the Zidonians. The same few phrases are said over each: “slain by the sword,” “uncircumcised,” “bear their shame,” and one more, that they “caused terror in the land of the living.” The poem sets that terror against shame: those who were a terror among the living carry shame among the dead.

  The last verse uses the word once more, and in the King James the terror there is the Lord’s own (see the note on verse 32). The book’s refrain comes once, at verse 15: “then shall they know that I am the LORD” (see the note on [[Ezek. 6:7]]).

sections:
  - range: 1-10
    heading: 'The monster in the net'
    plain: |
      In the twelfth year, on the first day of the twelfth month, the word of the Lord comes to Ezekiel: Take up a lamentation for Pharaoh king of Egypt, and say to him: You are like a young lion of the nations, and you are like a whale in the seas. You came forth with your rivers, troubled the waters with your feet, and fouled their rivers.

      The Lord God says: I will spread my net over you with a company of many peoples, and they will bring you up in my net. I will leave you on the land and throw you on the open field. I will make the birds of heaven remain on you and fill the beasts of the whole earth with you. Your flesh will lie on the mountains and fill the valleys, and the land will be soaked with blood up to the mountains. When I put you out I will cover the heaven and darken its stars. I will cover the sun with a cloud, and the moon will not give her light. I will darken all the bright lights of heaven over you and set darkness on your land.

      I will trouble the hearts of many peoples when I bring your destruction among the nations, into countries you have not known. Many peoples will be amazed at you, and their kings will be horribly afraid when I brandish my sword before them. They will tremble every moment, each for his own life, in the day of your fall.
  - range: 11-16
    heading: 'The sword of Babylon, and quiet waters'
    plain: |
      The Lord God says: The sword of the king of Babylon will come upon you. By the swords of the mighty, the terrible of the nations, I will make your multitude fall. They will spoil the pomp of Egypt, and all its multitude will be destroyed. I will destroy all its beasts from beside the great waters. No foot of man and no hoof of beast will trouble the waters any more. Then I will make their waters deep and make their rivers run like oil. When I make the land of Egypt desolate and empty of what filled it, and strike all who live there, they will know that I am the Lord. This is the lamentation. The daughters of the nations will lament with it for Egypt and for all her multitude.
  - range: 17-21
    heading: 'Go down'
    plain: |
      In the twelfth year, on the fifteenth day of the month, the word of the Lord comes to Ezekiel: Wail for the multitude of Egypt, and cast them down, her and the daughters of the famous nations, to the nether parts of the earth, with those who go down into the pit. Whom do you pass in beauty? Go down, and be laid with the uncircumcised. They will fall among those slain by the sword. She is delivered to the sword; draw her and all her multitudes. The strong among the mighty will speak to him out of the midst of hell, with those who help him: they have gone down, they lie uncircumcised, slain by the sword.
  - range: 22-30
    heading: 'Who is already there'
    plain: |
      Asshur is there with all her company, graves all around, all of them slain by the sword. Their graves are set in the sides of the pit, and they caused terror in the land of the living. Elam is there with all her multitude around her grave, slain, gone down uncircumcised into the nether parts of the earth. They caused their terror in the land of the living, yet they have borne their shame with those who go down to the pit. A bed has been set for her among the slain.

      Meshech and Tubal are there with all their multitude, uncircumcised, slain by the sword, though they caused their terror in the land of the living. They will not lie with the mighty that are fallen of the uncircumcised, who went down to hell with their weapons of war and have laid their swords under their heads; their iniquities will be upon their bones, though they were the terror of the mighty in the land of the living. You also will be broken among the uncircumcised and lie with those slain by the sword.

      Edom is there, her kings and all her princes, who with their might are laid by those slain by the sword. The princes of the north are there, all of them, and all the Zidonians, gone down with the slain. With their terror they are ashamed of their might. They lie uncircumcised and bear their shame with those who go down to the pit.
  - range: 31-32
    heading: 'Pharaoh among them'
    plain: |
      Pharaoh will see them and be comforted over all his multitude, Pharaoh and all his army slain by the sword, says the Lord God. For I have caused my terror in the land of the living, and he will be laid among the uncircumcised with those slain by the sword, Pharaoh and all his multitude.

notes:
  - ref: 1
    phrase: 'in the twelfth year, in the twelfth month'
    kind: history
    title: 'Dated after the city fell'
    body: |
      As the Hebrew stands, the date puts this poem about two months after the exiles heard that Jerusalem had fallen. That news came “in the twelfth year of our captivity, in the tenth month, in the fifth day of the month” ([[Ezek. 33:21]]). The first word against Egypt had been dated to the tenth year ([[Ezek. 29:1]]). In the book this chapter stands before that report, though its date is later.

      The numbers are not the same in every copy. The ancient Greek translation, the Septuagint, has “in the twelfth year, in the tenth month, on the first day of the month” in verse 1, which would be a few days before the fugitive arrived.

      Verse 17 has a year and a day and no month. As the Hebrew stands, the reader takes the month from verse 1, and the second poem then comes two weeks after the first; one modern translation prints “in the twelfth month” there and notes that the Hebrew lacks it. The Greek has “in the first month” instead, and another modern translation follows it. That would put the second poem earlier in the year than the first. The heading of the words against Tyre also has a year and a day and no month (see the note on [[Ezek. 26:1]]).
    sources: [lds-scriptures, lxx-rahlfs, esv, nrsvue]

  - ref: 2
    phrase: 'thou art as a whale in the seas'
    kind: symbol
    title: 'A lion, or a monster in the river'
    body: |
      The King James sets two comparisons side by side, a lion and a whale, and modern translations read the pair as a contrast. “You consider yourself a lion among the nations,” one of them has, “but you are like a dragon in the seas.” On that reading the lion is Pharaoh’s opinion of himself and the water-beast is what he is. The lion was a figure for a king that Ezekiel had already used. In his lament for the princes of Israel each of two kings in turn “became a young lion” ([[Ezek. 19:3]]).

      “Whale” is the Hebrew word the King James translated “dragon” in chapter 29 (see the note on [[Ezek. 29:3]], which says what the creature is). As a translation, “whale” is a guess: “the approximation is somewhat conjectural, and tannin is regularly reptilian.”

      The charge is different from the one in chapter 29. There Pharaoh boasted that the Nile was his. Here the poem looks at what he does in the water: he “burst forth” in his rivers, troubled the waters with his feet, and fouled them. The Hebrew verb for “fouledst” is found in one other verse of the book, where it is said to the strong among Israel’s own flock, who “foul the residue with your feet” ([[Ezek. 34:18]]). The poem comes back to these troubled waters near its end (see the note on verse 14).

      In chapter 29 the beast was taken with hooks ([[Ezek. 29:4]]). Here the Lord uses “my net.” He had already said of the prince in Jerusalem, “My net also will I spread upon him, and he shall be taken in my snare” ([[Ezek. 12:13]]).
    sources: [esv, nrsvue, sc-knowhy-732, bdb, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: 'I will cover the heaven, and make the stars thereof dark'
    kind: scripture
    title: 'The lights go out over Egypt'
    body: |
      The darkened sky is how Isaiah and Joel picture the day of the LORD, and here it is said over one king. Isaiah’s burden of Babylon announces, “Behold, the day of the LORD cometh” ([[Isa. 13:9]]), and goes on in nearly Ezekiel’s words: “the stars of heaven and the constellations thereof shall not give their light: the sun shall be darkened in his going forth, and the moon shall not cause her light to shine” ([[Isa. 13:10]]; see the note there). Joel has it too: “the sun and the moon shall be dark, and the stars shall withdraw their shining” ([[Joel 2:10]]). Two chapters back Ezekiel had already called Egypt’s fall by that name (see the note on [[Ezek. 30:3]]).

      The “bright lights” of verse 8 have also been taken as Egypt’s leaders, who fall with their people.

      The verse begins with Pharaoh himself: “When I shall put thee out.” The Hebrew is “extinguish thee,” and a modern translation has “When I blot you out.”

      Darkness had been set on Egypt before. The ninth plague was “darkness over the land of Egypt, even darkness which may be felt” ([[Ex. 10:21]]), and verse 8 ends with the words “and set darkness upon thy land.”

      Verses 9 and 10 turn to those who watch the fall. Nations that Pharaoh never knew hear of it, and their kings tremble, “every man for his own life.”
    sources: [lds-scriptures, ot-manual-27, esv]

  - ref: 14
    phrase: 'cause their rivers to run like oil'
    kind: symbol
    title: 'Rivers like oil: emptiness, or blessing?'
    body: |
      The poem’s last picture is of Egypt’s waters settled and its rivers running like oil, and it has been read in two ways: as the quiet of an emptied land, or as a promise. “Make their waters deep” is a verb that means to make something sink, and it is glossed here as “I will make their waters sink, (settle, grow clear).” A modern translation has “I will make their waters clear.” Verse 13 has just said why they settle: no “foot of man” and no “hoofs of beasts” are left to trouble the water.

      One reading takes this as the last stroke of the desolation. Egypt is left so empty that its waters “should run as pure and smooth as oil, without the foot of man or the hoof of a beast to disturb them.”

      The other reading hears a promise. Oil in scripture is a sign of plenty, and rivers flowing like oil “are symbolical of the rich blessing of God”; on this view the verse gives “a slight intimation of a better future,” though “this blessing will not flow to Egypt till its natural power is destroyed.”

      The verse itself does not decide between them. On either reading the waters troubled in verse 2 are troubled no more.
    sources: [bdb, oshb-wlc, esv, clarke-ezekiel, keil-ezekiel]

  - ref: 16
    phrase: 'the daughters of the nations shall lament her'
    kind: history
    title: 'The women who sing the dirge'
    body: |
      The singers of this lament are women, the ones Jeremiah sends for when a dirge is needed over Jerusalem: “call for the mourning women, that they may come” ([[Jer. 9:17]]; see the note there). When Josiah died, “all the singing men and the singing women spake of Josiah in their lamentations” ([[2 Chr. 35:25]]). A modern translation of this verse has simply “The women of the nations shall chant it.”

      The verse closes the first poem by going back to its opening. Verse 2 told Ezekiel to “take up a lamentation,” and this verse says, “This is the lamentation.” The Hebrew word in both is *qinah*, a funeral song (see the note on [[Ezek. 19:1]]). The verse states what will happen and does not ask for it: the women of other nations “shall lament her.”
    sources: [lds-scriptures, nrsvue, oshb-wlc]

  - ref: 18
    phrase: 'wail for the multitude of Egypt, and cast them down'
    kind: words
    title: 'A prophet told to send a nation down'
    body: |
      Ezekiel is told both to wail for Egypt and to “cast them down,” and the second command has been explained in two ways. Its sense is plain: “send them down,” in a modern translation.

      How does a man in Babylon send Egypt anywhere? The milder explanation makes it a way of speaking: “Show them that they shall be cast down. Proclaim to them a casting down prophecy.” The stronger one takes the command as it stands and looks to whose word the prophet is speaking: “The lamentation is God’s word; and as such it has the power to accomplish what it utters.”

      Verses 19 and 20 then give the words themselves: “go down, and be thou laid with the uncircumcised.”

      The verb for “wail” is not the word for a formal lamentation used in verse 2. It means to “wail, lament,” and this is its only use in the book.
    sources: [bdb, oshb-wlc, esv, clarke-ezekiel, keil-ezekiel]

  - ref: 19
    phrase: 'be thou laid with the uncircumcised'
    kind: words
    title: 'Laid with the uncircumcised'
    body: |
      “Uncircumcised” in this poem is said of the slain and joined with shame (verses 24, 25, 30), and it is not a description of Egyptian custom: circumcision “was practiced in Egypt.” The word comes in ten of the poem’s last fourteen verses.

      For Israel circumcision was the token of the covenant with Abraham, and where other nations practiced it, “to them it did not have the same meaning or purpose.” Jeremiah names Egypt first among the nations he calls uncircumcised: “Egypt, and Judah, and Edom, and the children of Ammon, and Moab… all these nations are uncircumcised, and all the house of Israel are uncircumcised in the heart” ([[Jer. 9:26]]; see the note on [[Jer. 9:25]]).

      Ezekiel has used the phrase twice before in these chapters, of the ruler of Tyre (see the note on [[Ezek. 28:10]]) and at the end of the chapter before this one, where Pharaoh is told, “thou shalt lie in the midst of the uncircumcised with them that be slain by the sword” ([[Ezek. 31:18]]).

      The command comes with a question, in a modern translation “Whom do you surpass in beauty?” No answer is waited for. The next words are “go down.”
    sources: [bd-circumcision, oshb-wlc, esv, lds-scriptures]

  - ref: 21
    phrase: 'out of the midst of hell'
    kind: words
    title: 'Hell, the pit, and the nether parts of the earth'
    body: |
      “Hell” in verses 21 and 27 is Sheol, the Hebrew name for the abode of departed spirits (see the note on [[Ezek. 31:14]]). The poem also calls it “the pit” and “the nether parts of the earth,” a phrase that “is typical of the ancient belief that hell is below the earth.” In Ezekiel’s usage Sheol “is land below, place of reproach, abode of uncircumcised.”

      The chapter is “written in poetic and figurative style,” and the rows of graves are a picture. In it the dead speak (verse 21) and bear shame (verse 24), and Pharaoh sees them and is comforted (verse 31).

      Isaiah’s song over the king of Babylon has a like scene. There “Hell from beneath is moved for thee to meet thee at thy coming,” and the dead kings ask, “Art thou also become weak as we?” ([[Isa. 14:9–10]]; see the note on [[Isa. 14:9]]). Here it is Egypt that is received. In the King James the mighty “speak to him”; modern translations have them “speak of them,” and what they say is flat: “They have come down, they lie still.”
    sources: [bd-hell, bd-sheol, ot-manual-27, bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 22
    phrase: 'Asshur is there and all her company'
    kind: history
    title: 'The nations already in the pit'
    body: |
      Six powers are named as already lying below, and Egypt makes a seventh. The six have been sorted into two groups: “Asshur, Elam, and Meshech-Tubal represent the greater and more distant world-powers; Edom the princes of the north, and Sidon the neighbouring nations of Israel.” The total has been taken as deliberate: “if we add Egypt to the list, we shall have seven,” a number fit “to depict the fate of universal heathenism.”

      Asshur is Assyria. It stands first as “the world-power, which had already been overthrown by the Chaldeans”: its capital, Nineveh, “fell, about 607 B.C.” Elam was “a mountainous country to the east of Babylonia,” and Jeremiah has a word against it from the beginning of Zedekiah’s reign (see the note on [[Jer. 49:34]]). Meshech and Tubal are sons of Japheth in the table of nations ([[Gen. 10:2]]). Ezekiel has named them among Tyre’s traders ([[Ezek. 27:13]]) and will name them again with Gog ([[Ezek. 38:2]]). Edom and Zidon each have an oracle earlier in this part of the book ([[Ezek. 25:12–14]]; [[Ezek. 28:21–22]]).

      On the same reading the list is not in order of time: “no regard is paid to the time of destruction,” and some of these powers are shown as fallen before their fall.

      A reader of the King James will trip on the pronouns: “her company,” then “his graves are about him.” The shift is in the Hebrew. It has been explained by saying that “the ideas of the kingdom and its king are not kept strictly separate,” so the poem speaks now of the nation as “she” and now of its ruler as “he.”
    sources: [keil-ezekiel, bd-assyria, bd-elam, lds-scriptures]

  - ref: 27
    phrase: 'they have laid their swords under their heads'
    kind: history
    title: 'Swords under their heads'
    body: |
      To be buried with one’s weapons was an honour, and in the King James verse 27 denies that honour to Meshech and Tubal. “It was a very ancient practice, in different nations, to bury a warrior’s weapons in the same grave with himself,” and it was “a mark of great respect to the dead.” Some of the fallen went down that way, with their swords under their heads. These do not lie with them. Isaiah’s song over the king of Babylon speaks of the same honour: “All the kings of the nations, even all of them, lie in glory, every one in his own house,” while the tyrant is cast out of his grave ([[Isa. 14:18–19]]; see the note on [[Isa. 14:19]]).

      The Hebrew and the Greek differ on who the honoured dead are, and on whether these newcomers lie with them. The Hebrew text has “the mighty that are fallen of the uncircumcised.” The ancient Greek translation has “the giants that fell of old,” and it has no “not”: the newcomers are laid with them. In Hebrew the two phrases differ by little, and “of old” has often been preferred here, though the King James keeps the Hebrew as it stands. One modern translation combines the two, keeping the Hebrew “not” and taking the Greek phrase: “they do not lie with the fallen warriors of long ago.” The Greek translators were “possibly thinking of” the mighty men of Genesis, “which were of old, men of renown” ([[Gen. 6:4]]; see the note there).

      The verse is hard on any reading. In the King James it ends, “their iniquities shall be upon their bones.”
    sources: [clarke-ezekiel, keil-ezekiel, lxx-rahlfs, nrsvue, bdb, lds-scriptures]

  - ref: 31
    phrase: 'shall be comforted over all his multitude'
    kind: words
    title: 'Pharaoh’s comfort'
    body: |
      The comfort Pharaoh finds is that he is not the only one there: the nations he sees share his fate.

      Ezekiel has used the same Hebrew verb this way before. At the close of the previous chapter “all the trees of Eden” are the ones who “shall be comforted in the nether parts of the earth” when the great cedar is cast down among them ([[Ezek. 31:16]]). Earlier still the exiles were told they would “be comforted concerning the evil that I have brought upon Jerusalem” on seeing the “way” and the “doings” of those who escaped it ([[Ezek. 14:22]]).
    sources: [ot-manual-27, oshb-wlc, lds-scriptures]

  - ref: 32
    phrase: 'I have caused my terror in the land of the living'
    kind: words
    title: 'Whose terror?'
    body: |
      The Hebrew of this clause is written one way and read aloud another, and the difference is whose terror it is. The scribes who handed down the text marked some words with a second reading. What is written is called the *ketiv*; what is to be read is the *qere*. Here the written text has “his terror” and the reading is “my terror.”

      The King James follows the reading: “I have caused my terror.” So does a modern translation that begins the verse “For I spread terror.” Another goes the other way and changes the verb as well, “For he spread terror in the land of the living,” noting that the Hebrew has “I.”

      The word itself belongs to this poem. It means “terror” and is found “only Ezekiel”: as the Hebrew text stands, in seven verses here and once of Tyre ([[Ezek. 26:17]]). Six times it has been the terror that the fallen nations caused. In the King James the seventh is the Lord’s own.
    sources: [oshb-wlc, bdb, esv, nrsvue, lds-scriptures]

christ: |
  The darkened sun, moon, and stars of verses 7 and 8 are the words Jesus used for the time of His coming: “Immediately after the tribulation of those days shall the sun be darkened, and the moon shall not give her light, and the stars shall fall from heaven” ([[Matt. 24:29]]; [[JS—M 1:33]]). Ezekiel says them over one Pharaoh and one kingdom. The fall of that kingdom has been read as “an omen and prelude of the overthrow of every ungodly world-power on the day of the last judgment.”

  The second poem leaves the nations lying in Sheol, and it says nothing of what comes after. Latter-day revelation speaks of hell in more than one sense, and one of them is “the temporary abode in the spirit world of those who were disobedient in this mortal life.” Hell in that sense “will have an end.” Jacob says by whose power the dead are delivered: “death and hell must deliver up their dead, and hell must deliver up its captive spirits, and the grave must deliver up its captive bodies… and it is by the power of the resurrection of the Holy One of Israel” ([[2 Ne. 9:12]]).

explore: |
  - Isaiah’s song over the king of Babylon, with a like scene among the dead: [[Isa. 14:4–20]].
  - The close of the chapter before, which the second poem expands: [[Ezek. 31:15–18]].
  - The first word against Pharaoh, with the dragon and the Nile: [[Ezek. 29:1–16]].
  - Jeremiah on the king of Babylon’s coming against Egypt: [[Jer. 46:13–26]].
  - The darkened heavens in other prophets and in the Savior’s own words: [[Isa. 13:9–13]]; [[Joel 2:10–11]]; [[JS—M 1:33–36]].
  - Death, hell, and the grave giving up their dead: [[2 Ne. 9:10–13]].
  - The next time the book speaks of graves, they are opened: [[Ezek. 37:12–14]].
  - What comes next: the watchman’s charge again, and the fugitive’s report: [[Ezek. 33:1–22]].

