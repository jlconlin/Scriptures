chapter: 47
title: 'The River from the Temple'
tagline: 'Water comes out from under the threshold of the temple, deepens into a river no one can cross, and runs down to the Dead Sea, where everything it reaches lives. Then the Lord draws the borders of the land, to be shared equally by the tribes and by the strangers who live among them.'
when: 'No date of its own. The chapter continues the vision dated at 40:1, “the five and twentieth year of our captivity,” “the fourteenth year after that the city was smitten” (about 573 B.C.).'

setting: |
  Ezekiel is still in the vision that began at [[Ezek. 40:1]], with the guide who carries a measuring line. The temple of this vision has not yet been built; the background to [[Ezek. 40]] gives what is taught about it.

  Since then he has watched the glory of the Lord come back into the house by the east gate ([[Ezek. 43:1–5]]) and, in the chapters between, has been given the ordinances of its worship and sacrifice. Chapter 46 ended in the outer court, at the places where the sacrifice of the people is boiled ([[Ezek. 46:21–24]]). Now he is brought again to the door of the house itself.

  The chapter has two halves. In verses 1–12 water runs from the temple to the sea in the east. In verses 13–23 the Lord gives the borders of the land the tribes are to inherit, and chapter 48 divides it among them. The two chapters together have been summed up as a description of the latter-day temple in Jerusalem, of the river that runs from it into the Dead Sea to heal it, and of the building of a city.

  Other prophets speak of such water. Joel says that “a fountain shall come forth of the house of the LORD” ([[Joel 3:18]]), and Zechariah that “living waters shall go out from Jerusalem” ([[Zech. 14:8]]). John was shown “a pure river of water of life” ([[Rev. 22:1]]).

thread: |
  The first half of the chapter moves outward from the house. In chapter 43 the glory came in from the east. Here water goes out toward the east: from under the threshold, past the altar, out beside the shut gate, down into the desert, and into the sea.

  The water does two things. It grows, from a trickle at the gate to “a river that could not be passed over” four thousand cubits on. And it gives life to what it reaches: “every thing shall live whither the river cometh” (verse 9). The fish, the fishers, and the trees with their monthly fruit all follow from that, and verse 12 gives the reason for the trees in a clause: “because their waters they issued out of the sanctuary.” One place is excepted. The marshes are not healed (verse 11).

  The second half turns from the river to the land. The Lord gives its four sides, north, east, south, and west, and says who is to have it: the twelve tribes, “one as well as another,” and the strangers who have settled and raised children among them. The land is given because He swore it: “concerning the which I lifted up mine hand to give it unto your fathers” (verse 14).

sections:
  - range: 1-2
    heading: 'Water under the threshold'
    plain: |
      The man brings Ezekiel back to the door of the house. Water is coming out from under the threshold toward the east, since the front of the house faces east. It comes down from the right side of the house, south of the altar. The man takes him out by the north gate and around the outside to the outer gate that looks east. There the water is running out on the right side.
  - range: 3-6
    heading: 'Ankles, knees, loins, a river'
    plain: |
      The man with the line goes east and measures a thousand cubits, then brings Ezekiel through the water, and it reaches his ankles. He measures another thousand, and it reaches the knees; another thousand, and it reaches the loins. After a fourth thousand it is a river Ezekiel cannot cross, risen deep enough to swim in. The man asks him, “Son of man, hast thou seen this?” and brings him back to the brink of the river.
  - range: 7-12
    heading: 'Everything lives where the river comes'
    plain: |
      When Ezekiel returns he sees very many trees on both banks. The man tells him that these waters go out toward the east country, down into the desert, and into the sea, and that the waters of the sea will be healed. Every living thing that moves will live wherever the rivers come. There will be a very great multitude of fish, because the waters come there and are healed. Fishers will stand by it from En-gedi to En-eglaim and spread their nets, and the fish will be of many kinds and very many, like the fish of the great sea. But its miry places and marshes will not be healed; they are given to salt. On both banks will grow every kind of tree for food. Their leaves will not fade and their fruit will not run out. They will bear new fruit every month, because their water comes out of the sanctuary. The fruit will be food and the leaf medicine.
  - range: 13-14
    heading: 'The land sworn to the fathers'
    plain: |
      The Lord God says that this is the border by which the twelve tribes of Israel will inherit the land. Joseph is to have two portions. They are to inherit it one as well as another. He lifted up His hand to give it to their fathers, and this land will fall to them as an inheritance.
  - range: 15-20
    heading: 'The four borders'
    plain: |
      The north side runs from the great sea by the way of Hethlon toward Zedad, by Hamath, Berothah, and Sibraim, between the borders of Damascus and Hamath, to Hazar-hatticon by the border of Hauran, and to Hazar-enan. The east side is measured from Hauran, Damascus, and Gilead, and from the land of Israel by the Jordan, to the east sea. The south side runs from Tamar to the waters of strife in Kadesh, and by the river to the great sea. The west side is the great sea, up to a point over against Hamath.
  - range: 21-23
    heading: 'The stranger’s inheritance'
    plain: |
      They are to divide this land among the tribes of Israel, by lot, as an inheritance for themselves and for the strangers who sojourn among them and have children among them. These are to be to them as those born in the country among the children of Israel, and they are to have an inheritance with them among the tribes. In whatever tribe the stranger sojourns, there he is to be given his inheritance, says the Lord God.

notes:
  - ref: 1
    phrase: 'waters issued out from under the threshold of the house eastward'
    kind: symbol
    title: 'Water from the threshold'
    body: |
      The water starts at the doorway of the temple building itself, from under its threshold, and it flows east because the house faces east. The same Hebrew word names the threshold in the earlier vision in which the glory of the Lord left the temple ([[Ezek. 9:3]]; [[Ezek. 10:4]]; [[Ezek. 10:18]]; see the note on [[Ezek. 11:23]]).

      By this point in the vision the glory has returned. It “came into the house by the way of the gate whose prospect is toward the east” ([[Ezek. 43:4]]), and the Lord called the house “the place of my throne” ([[Ezek. 43:7]]). The temple of this vision is the one “which the Lord identifies as his throne,” so the water rises at the place where He has said He will dwell.

      So much water would have been strange to anyone who knew Jerusalem. It was “a city that was sustained, anciently, by one main but relatively small and vulnerable source of water, the Gihon Spring,” and no one who lived there “had ever seen such a quantity of water in the area before.” [Waters out of the Sanctuary](/ezekiel/themes/waters-out-of-the-sanctuary/) follows the house and its waters through the book.
    sources: [lds-scriptures, bdb, tvedtnes-tree-healing, peterson-water]

  - ref: 2
    phrase: 'there ran out waters on the right side'
    kind: words
    title: 'A trickle at the outer gate'
    body: |
      Outside the wall the water is only a trickle, and Ezekiel has to go the long way round to see it. He is led out by the north gate because the east gate, the direct way, has been closed: “This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the LORD, the God of Israel, hath entered in by it” ([[Ezek. 44:2]]). The “utter gate” is the outer one, “the outer gate that faces toward the east.”

      The Hebrew verb for “ran out” is glossed “trickle,” and a modern translation has “the water was trickling out on the south side”; the verb has also been taken as “to ripple.” The right side is the south for someone facing east, as verse 1 shows by putting the two together. The next three verses begin from this small flow.
    sources: [lds-scriptures, bdb, esv, nrsvue, keil-ezekiel]

  - ref: 3
    phrase: 'he measured a thousand cubits'
    kind: symbol
    title: 'Deeper with every thousand cubits'
    body: |
      In four measured stretches the trickle becomes a river too deep to wade, and nothing is said to flow into it. If the cubit is the long one of this vision’s measuring reed, “about 21 inches” (see the note on [[Ezek. 40:5]]), four thousand cubits come to about seven thousand feet, a mile and a third. The guide does not tell Ezekiel the depth. He walks him through it each time: ankles, knees, loins, and then “waters to swim in.”

      The guide’s only words in these verses are a question: “Son of man, hast thou seen this?” The text does not say what Ezekiel was meant to notice.

      Elder Dale G. Renlund drew two things from the vision. The stream “had no tributaries” and still grew, as the blessings of the temple grow when families are sealed through the generations; and the river renewed all it touched, as the blessings of the temple heal.
    sources: [lds-scriptures, esv, renlund-sealing]

  - ref: 8
    phrase: 'the waters shall be healed'
    kind: words
    title: 'The Dead Sea made fresh'
    body: |
      The sea is the Dead Sea, though the verse does not name it, and “healed” means that its salt water becomes fresh. The “desert” it passes through is the Arabah, a name that anciently covered “pretty much the entirety of the Jordan Rift Valley,” and a modern translation adds a note at the word “sea”: “That is, the Dead Sea.”

      That sea is fed by the Jordan and some smaller streams and has no outlet except evaporation, so the salts the streams carry in stay there. Its water is “nearly ten times as salty as Earth’s oceans.” Nothing lives in it.

      The Hebrew verb is the ordinary one for healing a sick person. Used of salt water it means to “be made fresh,” and a modern translation reads, “the water will become fresh.” The same verb is used of the spring Elisha cured: “I have healed these waters; there shall not be from thence any more death or barren land” ([[2 Kgs. 2:21]]).
    sources: [lds-scriptures, bd-dead-sea, bdb, esv, peterson-water, tvedtnes-tree-healing, scripture-helps-ezek]

  - ref: 9
    phrase: 'whithersoever the rivers shall come'
    kind: words
    title: 'Rivers, or the river'
    body: |
      The plural “rivers” is in the Hebrew, which has a form here meaning “two rivers,” although the passage speaks of one river before and after and the verse itself ends “whither the river cometh.” The Greek translation has the singular: “all on which the river shall come, shall live.” A modern translation follows it, and its note names three other ancient versions with the Greek: “Septuagint, Syriac, Vulgate, Targum; Hebrew the two rivers go.” The singular has also been proposed as the reading of the Hebrew itself.

      The King James Version translates the Hebrew as it stands. Nothing in the passage describes a second stream.
    sources: [bdb, esv, lxx-rahlfs]

  - ref: 9
    phrase: 'every thing shall live whither the river cometh'
    kind: prophets
    title: 'Before the Son of Man appears'
    body: |
      Joseph Smith spoke of water from under the temple and the healing of the Dead Sea as things that will happen, and placed them before the Second Coming. In a discourse of April 6, 1843, he listed what must come first: the return of Judah, the rebuilding of Jerusalem and its temple, “and water come out from under the temple, and the waters of the Dead Sea be healed.”

      Zechariah connects such waters with the day the Lord’s “feet shall stand in that day upon the mount of Olives,” when the mountain divides ([[Zech. 14:4]]). On that day living waters go out from Jerusalem, “half of them toward the former sea, and half of them toward the hinder sea” ([[Zech. 14:8]]); the former sea has been understood as the Dead Sea and the hinder sea as the Mediterranean. The two prophecies have been joined, with caution: the healing of the Dead Sea “may occur when the Lord Himself sets foot upon the Mount of Olives,” and the quake of that day is expected to open a great spring in Jerusalem and form a new river, running west as well as east.

      Modern revelation, which is “consistent with the prophecies of Ezekiel and John,” promises that in the last days “in the barren deserts there shall come forth pools of living water” ([[D&C 133:29]]).
    sources: [lds-scriptures, ttp-joseph-smith-21, ot-manual-27, ot-manual-kings-i, tvedtnes-tree-healing, peterson-water]

  - ref: 10
    phrase: 'from En-gedi even unto En-eglaim'
    kind: history
    title: 'Fishers on the shore of the Dead Sea'
    body: |
      Both places are on the Dead Sea, so the verse puts fishermen along a shore where no fish live. En-gedi, “Fountain of the kid,” is “a place on the western shore of the Dead Sea.” En-eglaim is named only as a “location on Dead Sea,” and where on the sea it lay is not known. Jerome wrote that “Engallim is at the beginning of the Dead Sea, where the Jordan enters it,” and from that it has been conjectured to be a spring at the northern end of the west shore.

      The “great sea” is the Mediterranean. The fish of the healed sea are to be as varied as that sea’s, “according to their kinds.”
    sources: [bd-en-gedi, bdb, keil-ezekiel, esv]

  - ref: 11
    phrase: 'they shall be given to salt'
    kind: symbol
    title: 'The marshes left to salt'
    body: |
      One part of the picture is not healed: the swamps and pools at the edge of the sea stay salt. A modern translation has “they are to be left for salt.” The verse gives no reason.

      On one reading the marshes are “destined to remain salt, because the waters of the river do not reach them.” That is an interpretation; the text itself only states the exception.
    sources: [esv, keil-ezekiel]

  - ref: 12
    phrase: 'the leaf thereof for medicine'
    kind: scripture
    title: 'The trees John saw again'
    body: |
      John’s vision of the new Jerusalem, which “seems to be patterned on Ezekiel’s,” has trees like these. He sees a river, and on either side of it “the tree of life, which bare twelve manner of fruits, and yielded her fruit every month: and the leaves of the tree were for the healing of the nations” ([[Rev. 22:2]]). The Church’s edition joins the two passages at this verse, and joins John’s tree to the tree of life in Eden ([[Gen. 2:9]]).

      The details differ. Ezekiel sees “all trees for meat,” many trees and not one; “meat” is food, and a modern translation has “all kinds of trees for food.” The Hebrew word behind “medicine” means “healing,” and the same translation has “their leaves for healing,” which is nearly John’s phrase. Ezekiel’s verse also says why the trees never fail: “because their waters they issued out of the sanctuary.”
    sources: [lds-scriptures, tvedtnes-tree-healing, bdb, esv]

  - ref: 13
    phrase: 'Joseph shall have two portions'
    kind: history
    title: 'Two portions for Joseph, and equal shares'
    body: |
      Joseph has two portions because his two sons each count as a tribe. Jacob took them as his own, “as Reuben and Simeon, they shall be mine” ([[Gen. 48:5]]), and when the land was first divided “the children of Joseph were two tribes, Manasseh and Ephraim” ([[Josh. 14:4]]). Chapter 48 gives each of them a strip of the land, one beside the other ([[Ezek. 48:4–5]]).

      “One as well as another” in verse 14 means that the shares are equal. A modern translation says so directly: “You shall divide it equally.”
    sources: [lds-scriptures, nrsvue]

  - ref: 15
    phrase: 'this shall be the border of the land'
    kind: history
    title: 'The borders of Numbers 34'
    body: |
      The four sides can be compared with the borders of Canaan given to Moses ([[Num. 34:1–12]]). In the north the line runs from the “great sea,” the Mediterranean, toward Hamath, an important Syrian city whose “entering in” was the northern limit of the Promised Land, and Moses’s list has the same two names: “unto the entrance of Hamath; and the goings forth of the border shall be to Zedad” ([[Num. 34:8]]). In the south it runs to “the waters of strife in Kadesh,” a city in the southwest corner of the land that was also called the water of Meribah. The “river” that carries the line from there to the sea is given in a modern translation as “the Brook of Egypt,” with the note that the Hebrew has no “of Egypt.”

      On the east the border is the Jordan; a modern translation has it run “along the Jordan between Gilead and the land of Israel.” Gilead was the land Moses gave to Gad and Reuben, “the land of Gilead for a possession” ([[Num. 32:29]]), and his list of the borders says that the two and a half tribes “have received their inheritance on this side Jordan near Jericho eastward” ([[Num. 34:15]]). In chapter 48 Reuben has a strip “from the east side even unto the west side” like the other tribes ([[Ezek. 48:6]]), and so has Gad ([[Ezek. 48:27]]).
    sources: [lds-scriptures, bd-hamath, bd-kadesh, esv]

  - ref: 22
    phrase: 'they shall be unto you as born in the country'
    kind: scripture
    title: 'An inheritance for the stranger'
    body: |
      Foreigners who have settled in Israel are to receive land as if they had been born Israelites. A “stranger” in this sense is “a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities.” Verse 22 speaks of those who have stayed and “beget children among you.”

      The law of Moses already used these words. “The stranger that dwelleth with you shall be unto you as one born among you, and thou shalt love him as thyself” ([[Lev. 19:34]]). Ezekiel has the same Hebrew pair, the sojourner and the native-born, and here it reaches to the land. On one reading of that law, “the full right of citizenship was not thereby conceded to them, so that they could also acquire property in land.” Here the stranger is allotted an inheritance in whatever tribe he lives.

      The text does not say who these strangers are. They have been taken as “converts who are not part of blood Israel,” adopted into the house of Israel, perhaps from among the Gentiles who accept the gospel in the last days. [The Stranger’s Inheritance](/ezekiel/themes/the-strangers-inheritance/) sets this beside the charge of chapter 22.
    sources: [lds-scriptures, bd-stranger, bdb, keil-ezekiel, ot-manual-27]

christ: |
  John’s vision also has a river, and he names where it comes from: “a pure river of water of life, clear as crystal, proceeding out of the throne of God and of the Lamb” ([[Rev. 22:1]]). The Church’s edition of that verse points back to the first verse of this chapter. In Ezekiel the water comes from under the threshold of the house the Lord has just called the place of His throne ([[Ezek. 43:7]]). In John the Lamb is named at the river’s source with God.

  Zechariah, whom the Church’s edition also joins to verse 1, calls the water that goes out from Jerusalem “living waters” ([[Zech. 14:8]]). Living water is “a symbol of the Lord Jesus Christ and His teachings.” At the feast in Jerusalem He cried, “If any man thirst, let him come unto me, and drink” ([[John 7:37]]).

explore: |
  - The other prophecies of water from the Lord’s house: [[Joel 3:18]] and [[Zech. 14:4–11]].
  - John’s river and tree of life: [[Rev. 22:1–5]].
  - Elisha and the healed spring: [[2 Kgs. 2:19–22]].
  - The borders given to Moses, and the tribes east of the Jordan: [[Num. 34:1–15]].
  - What comes next: the land divided among the tribes, and the name of the city: [[Ezek. 48]].

