chapter: 9
title: 'The Mark on the Forehead'
tagline: 'Seven figures are called to the temple. One carries a scribe’s kit and marks those who grieve over Jerusalem’s sins; six follow with weapons, beginning at the sanctuary.'
when: 'No date of its own. The chapter is the second scene of the vision dated in 8:1, “the sixth year, in the sixth month, in the fifth day of the month” of Jehoiachin’s captivity (about 591 B.C.), which runs through chapter 11.'

setting: |
  Ezekiel is in Babylonia, one of the captives carried away with king Jehoiachin. In the sixth year of the captivity, as he sat in his house with the elders of Judah before him, he was taken “in the visions of God to Jerusalem” ([[Ezek. 8:3]]). Jerusalem was still standing. Its fall, in 586 B.C., was about five years away.

  Chapter 8 was the first scene of that vision: four views of idolatry at the temple, each worse than the last, ending in the inner court. It closed with a sentence: “mine eye shall not spare, neither will I have pity: and though they cry in mine ears with a loud voice, yet will I not hear them” ([[Ezek. 8:18]]). Chapter 9 shows the sentence carried out. Nothing in it has happened yet when Ezekiel sees it. He is shown, in figures, what is coming on the city.

  The vision goes on. In chapter 10 the man clothed with linen is sent to scatter coals of fire over the city, and the glory of the Lord moves from the threshold toward the east gate. In chapter 11 it leaves the city, and Ezekiel is brought back to the captives ([[Ezek. 11:23–24]]).

thread: |
  The people of Jerusalem have a saying, and the Lord quotes it in verse 9: “The LORD hath forsaken the earth, and the LORD seeth not.” The chapter answers both halves.

  He sees: before a single blow falls, a figure with a scribe’s kit is sent through the whole city to mark those who sigh and cry over what is done there, and the six with weapons, told to go “after him,” are forbidden to touch anyone who bears the mark. As for forsaking, the Lord has already said what makes Him “go far off from my sanctuary”: the people’s own abominations ([[Ezek. 8:6]]). The judgment then begins at the sanctuary and goes out from there.

  Ezekiel’s one speech is a plea for the remnant. The Lord gives him no comfort here; He restates the guilt.

sections:
  - range: 1-2
    heading: 'Seven are summoned'
    plain: |
      The Lord calls out loudly in Ezekiel’s hearing for those who have charge of the city to come near, each with his weapon of destruction in his hand. Six men come from the direction of the upper gate on the north side, each holding a weapon for slaughter. Among them is one man dressed in linen, with a scribe’s writing kit at his side. They come in and stand beside the bronze altar.
  - range: 3-4
    heading: 'The glory moves, and the mark is commanded'
    plain: |
      The glory of the God of Israel has risen from the cherub on which it rested and gone to the threshold of the temple. The Lord calls the man dressed in linen and tells him to go through the middle of Jerusalem and put a mark on the foreheads of the people who sigh and groan over all the abominations done in the city.
  - range: 5-7
    heading: 'The slaughter begins at the sanctuary'
    plain: |
      Ezekiel hears the Lord tell the other six to follow the first man through the city and strike, without sparing and without pity: old and young, women and children. But they are not to come near anyone who has the mark, and they are to begin at the Lord’s sanctuary. They begin with the elders who are in front of the temple. The Lord tells them to defile the house and fill its courts with the slain, and then to go out. They go out and kill in the city.
  - range: 8-11
    heading: 'Ezekiel’s plea, the Lord’s answer, and the report'
    plain: |
      While they are killing, and Ezekiel is left, he falls on his face and cries out: will the Lord destroy all who remain of Israel in pouring out His fury on Jerusalem? The Lord answers that the guilt of Israel and Judah is very great. The land is full of bloodshed and the city full of perverted justice, because they say the Lord has abandoned the land and does not see. So He will not spare or pity; He will bring their conduct down on their own heads. Then the man dressed in linen, with the writing kit at his side, reports back: he has done what he was commanded.

notes:
  - ref: 1
    phrase: 'them that have charge over the city'
    kind: words
    title: 'Overseers of the city, or its punishments'
    body: |
      The Hebrew word behind “them that have charge” can mean either the city’s overseers or the city’s punishments, and translations divide over it. The word is *pequddot*, the plural of a noun whose senses include “oversight” and “visitation.” In this verse it has been taken as “punishment,” but the word can also mean an “overseer,” the office standing for the person who holds it. The King James wording, “them that have charge over the city,” follows the second. A modern translation has “Draw near, you executioners of the city.” The Greek translators of the Septuagint read no persons in the word at all: “The judgement of the city has drawn nigh.”

      The next verse shows who answers the call, whichever sense is taken: six men with weapons, and a seventh with a writing kit.

      The call is made “in mine ears with a loud voice.” Those are the words of the verse just before, where the Lord says of the people, “though they cry in mine ears with a loud voice, yet will I not hear them” ([[Ezek. 8:18]]). The loud cry that is heard at this point is the Lord’s own.
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 2
    phrase: 'one man among them was clothed with linen, with a writer’s inkhorn by his side'
    kind: symbol
    title: 'The man clothed with linen'
    body: |
      The seventh figure is dressed like a priest and equipped like a scribe, and the text does not say who he is. The verse names only his clothing and his writing kit.

      His clothing is *baddim*, “white linen,” the material of the priestly vestments. It is what the high priest wore on the Day of Atonement, “the holy linen coat” ([[Lev. 16:4]]). The same word clothes the heavenly figure Daniel saw, “a certain man clothed in linen” ([[Dan. 10:5]]), and the wearer here is understood to be an angel. A modern translation calls his equipment a “writing case.” It hung at the hip, in the girdle, “in which scribes in the East are accustomed to carry their writing materials.” The Septuagint does not have the writing kit: there the man wears “a sapphire girdle” on his loins.

      Because of the high priest’s linen and Daniel’s vision, the man has been identified with the angel of Jehovah, “who appears as the heavenly high priest, to protect and care for his own.” That is an inference, and it is not established: shining linen is the dress of other angels too, and here “there is nothing whatever to indicate a being equal with God.” On that reading he is the leader of the seven, standing to the six “as the high priest to the Levites, or the chancellor to the other officials.” The safest statement is the text’s own. He is called a man, he is addressed separately, and the marking is given to him alone.

      He has a second errand. In the next scene the same figure is told, “fill thine hand with coals of fire from between the cherubims, and scatter them over the city” ([[Ezek. 10:2]]).

      The seven come in by the “higher gate” on the north, which has been taken as the gate of [[Ezek. 8:3]] and [[Ezek. 8:5]], where the vision of the temple’s idolatry began.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue, keil-ezekiel, lds-scriptures]

  - ref: 3
    phrase: 'the glory of the God of Israel was gone up from the cherub'
    kind: symbol
    title: 'The glory begins to leave'
    body: |
      In this verse the glory of the Lord moves to the door of His temple, and the rest of the vision follows it out of the house and out of the city. Cherubim are figures of heavenly creatures “found in the Holy of Holies, on the Mercy Seat of the Ark,” and they appear in Ezekiel’s visions, with the throne above them ([[Ezek. 10:1]]). The verse says only “the cherub, whereupon he was,” without saying which is meant. Either way the direction is outward: from the place where the glory rested to the threshold of the house.

      This is one stage of the departure. At the start of the vision the Lord asks whether Ezekiel sees what the house of Israel does, “that I should go far off from my sanctuary” ([[Ezek. 8:6]]). Here the glory goes to the threshold, and [[Ezek. 10:4]] says so again. The later stages, to the east gate and then to the mountain east of the city, are followed in the note on [[Ezek. 11:23]].

      So the commands of this chapter are given from the threshold. The people say the Lord has forsaken the land (verse 9). The vision shows the glory going a stage at a time, and it has already given the cause as theirs ([[Ezek. 8:6]]).

      The departure is not the end of the book. In the temple of Ezekiel’s last vision, “the glory of the God of Israel came from the way of the east” ([[Ezek. 43:2]]), and Ezekiel says the sight was “according to the vision that I saw when I came to destroy the city” ([[Ezek. 43:3]]).
    sources: [lds-scriptures, bd-cherubim]

  - ref: 4
    phrase: 'set a mark upon the foreheads'
    kind: words
    title: 'The mark is the letter taw'
    body: |
      The Hebrew word for “mark” is *taw*, which is also the name of the last letter of the Hebrew alphabet. It is a rare word. In Ezekiel it comes only in verses 4 and 6 of this chapter, where it is a “mark on forehead, sign of exemption from judgment.” Its one other use is in [[Job 31:35]], where Job’s *taw* is his written mark of attestation, what would now be called a signature.

      In the older Hebrew script the letter had a different shape from the one printed now: *taw* “had the form of a cross in the earlier writing,” so that to mark a *taw* was “to make a mark in the form of a cross.” Early Christians noticed this and saw the cross of Christ in it. That reading calls for caution: “A direct prophecy of the cross of Christ is certainly not to be found here, since the form of the letter Tâv was the one generally adopted as a sign.” A cross-stroke was simply how one made one’s mark. Even so, there is “something remarkable in this coincidence” for a reader who believes that God foresaw the cross.

      What the text does establish is what the mark is for. It goes on the forehead, “the most visible portion of the body,” so that the six can tell the marked from the rest and do them no harm. It has also been read as a sign of whose they were: it “showed that they belonged to God.”
    sources: [bdb, oshb-wlc, keil-ezekiel, ot-manual-26]

  - ref: 4
    phrase: 'that sigh and that cry'
    kind: words
    title: 'Who receives the mark'
    body: |
      The mark is given to those who grieve over the city’s sins, and the verse asks nothing else of them. Of the two verbs, the first means to “sigh, groan,” “in token of grief”; the second to “cry, groan,” used “in mourning, lamentation.” They are words for the sounds of a mourner.

      The verse says nothing else about them: not that they had stopped the abominations, nor that they had spoken against them. What they grieve over is named, “all the abominations that be done in the midst thereof,” the things chapter 8 showed.
    sources: [bdb]

  - ref: 5
    phrase: 'let not your eye spare, neither have ye pity'
    kind: history
    title: 'A vision of what Babylon would do'
    body: |
      What Ezekiel watches is the fall of Jerusalem shown beforehand in figures, about five years before it happened. He was taken to the city “in the visions of God” ([[Ezek. 8:3]]), and when the scenes end he says, “the vision that I had seen went up from me” ([[Ezek. 11:24]]). This chapter is the “first act of the judgment,” “shown to the prophet in a figurative representation.”

      The command is the Lord’s own sentence handed to those who carry it out. “Mine eye shall not spare, neither will I have pity” was said at the end of chapter 8, and it is said again in verse 10. Verse 6 then lists who is not to be spared, and the list leaves out no one: the old, the young, women, small children.

      The history of the city’s fall tells of the same things. The Lord “brought upon them the king of the Chaldees, who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man, or him that stooped for age” ([[2 Chr. 36:17]]). The killing in the sanctuary, the old and the young together, the absence of pity: each is in Ezekiel’s scene.

      The vision does not promise that no faithful person died in 586 B.C. It has been read as showing that “the Lord can preserve whom He will,” and the same reading allows, in the tribulations of the latter days, for “martyrs and other exceptions.” Ezekiel himself later says the sword will cut off “the righteous and the wicked” ([[Ezek. 21:3–4]]), and Joseph Smith’s statement about the judgments of the last days has been set beside that verse: “It is a false idea that the Saints will escape all the judgments, whilst the wicked suffer.” The scene shows the mark set first, at the Lord’s command, on those who grieve. How it went with each of them when the city fell, the text does not say.
    sources: [lds-scriptures, keil-ezekiel, ot-manual-26]

  - ref: 6
    phrase: 'come not near any man upon whom is the mark'
    kind: scripture
    title: 'The Passover before it and the seal after it'
    body: |
      The mark has been read with the lamb’s blood in Egypt before it and with the seal in John’s vision after it. At the first Passover a destroyer went through the land and a visible token turned him aside: “when I see the blood, I will pass over you,” and the Lord “will not suffer the destroyer to come in unto your houses to smite you” ([[Ex. 12:13]], [[Ex. 12:23]]). Here destroyers go through a city and are told not to come near the marked.

      There is a difference. In Egypt the token was on a house and covered a household. In Jerusalem it is on a forehead and covers one person. And the city under judgment this time is Israel’s own.

      John sees a like sealing, at the end of the world’s history. Four angels are told, “Hurt not the earth, neither the sea, nor the trees, till we have sealed the servants of our God in their foreheads” ([[Rev. 7:3]]). The order is Ezekiel’s: the sealing first, then the harm. Latter-day revelation says the angel who gives that order is one “to whom is given the seal of the living God over the twelve tribes of Israel” ([[D&C 77:9]]). Further on, John sees a hundred and forty-four thousand with the Lamb, “having his Father’s name written in their foreheads” ([[Rev. 14:1]]).

      The three passages have been read together. The mark in Ezekiel and the seal in Revelation seem to be one idea, a sign “given to save them from destruction,” as at the Passover, “and preserve them for God’s purposes.”
    sources: [lds-scriptures, sc-knowhy-348]

  - ref: 6
    phrase: 'begin at my sanctuary'
    kind: scripture
    title: 'Judgment begins at the house of the Lord'
    body: |
      The six are sent first to the temple, which is where chapter 8 found the abominations. Chapter 8 was a walk through the temple’s gates and courts, and its last scene was in the inner court, where men stood “with their backs toward the temple of the LORD” and worshipped the sun ([[Ezek. 8:16]]). The first to fall here are “the ancient men which were before the house.” The Hebrew word is *zeqenim*, elders, the word used for the “ancients of the house of Israel” who burned incense to images in the dark and said the Lord did not see ([[Ezek. 8:11–12]]). Whether the very same men are meant the text does not say.

      The principle is stated elsewhere in scripture. Through Jeremiah the Lord says, “I begin to bring evil on the city which is called by my name” ([[Jer. 25:29]]). Peter makes it a rule: “judgment must begin at the house of God” ([[1 Pet. 4:17]]).

      Latter-day revelation puts it nearly in Ezekiel’s words. Speaking of a day of wrath to come upon the earth, the Lord says, “And upon my house shall it begin, and from my house shall it go forth,” and then names who is meant: those “who have professed to know my name and have not known me, and have blasphemed against me in the midst of my house” ([[D&C 112:25–26]]). The two passages have been set side by side, and the point drawn is that “it is not just association with God’s kingdom that preserves individuals; it is individual righteousness.”
    sources: [lds-scriptures, oshb-wlc, ot-manual-26]

  - ref: 7
    phrase: 'Defile the house'
    kind: symbol
    title: 'The Lord orders His own house defiled'
    body: |
      The command to defile the temple finishes what the people began. Under the law of Moses a dead body made unclean whoever touched it, and a person who did not purify himself afterward “defileth the tabernacle of the LORD” ([[Num. 19:13]]). The slain who fill the courts are what defiles the house, and the order comes from the Lord Himself.

      But the house was defiled already. The charge had been made in chapter 5: “because thou hast defiled my sanctuary with all thy detestable things, and with all thine abominations” ([[Ezek. 5:11]]), and chapter 8 showed what those things were. The dead in the courts make visible a condition that the idols had already produced.
    sources: [lds-scriptures]

  - ref: 8
    phrase: 'wilt thou destroy all the residue of Israel'
    kind: scripture
    title: 'Ezekiel pleads, and the answer waits'
    body: |
      Ezekiel’s only words in the chapter are a plea for the people, and the Lord does not grant it here. “I was left” is rendered “I was left alone” in a modern translation: the six have gone out to kill, and the prophet remains. He does not argue that the people are innocent. He asks whether anything of Israel is to remain.

      The Lord’s reply in verses 9 and 10 is a restatement of the guilt and of the sentence. No remnant is promised. The chapter leaves the question open.

      It is asked a second time before the vision ends, in nearly the same words: “Ah Lord GOD! wilt thou make a full end of the remnant of Israel?” ([[Ezek. 11:13]]). This time the answer comes, and it points away from Jerusalem. The remnant is among the exiles, to whom the people of Jerusalem had said, “Get you far from the LORD” ([[Ezek. 11:15]]): “yet will I be to them as a little sanctuary in the countries where they shall come,” and “I will even gather you from the people” ([[Ezek. 11:16–17]]). The promise of a new heart follows at once ([[Ezek. 11:19–20]]).

      Chapter 9 gives one quiet indication before that. Its last verse is the scribe’s report that he has done what he was told. The chapter never says how many he marked. But the errand was carried out.
    sources: [lds-scriptures, nrsvue]

  - ref: 9
    phrase: 'The LORD hath forsaken the earth, and the LORD seeth not'
    kind: words
    title: 'The saying the vision answers'
    body: |
      The Lord quotes the people’s own saying back as the reason for the judgment. It is the saying of the elders in the dark chamber, with its two halves in the other order: “The LORD seeth us not; the LORD hath forsaken the earth” ([[Ezek. 8:12]]). “Earth” is the Hebrew *’erets*, the same word translated “land” earlier in this verse, and a modern translation has “forsaken the land.” On that rendering the people are speaking of their own country.

      The verse joins the saying to two charges that are not about idols. The land is “full of blood,” as chapter 8 ended by saying “they have filled the land with violence” ([[Ezek. 8:17]]). And the city is full of “perverseness,” a word found only here, meaning “that which is perverted,” that is, justice. The saying is joined to them as their reason: “for they say.”

      The vision contradicts the saying on both counts. “The LORD seeth not”: verse 4 has just sent a recorder through the midst of the city to mark those who grieve. “The LORD hath forsaken”: by the vision’s own account it is their abominations that make Him “go far off from my sanctuary” ([[Ezek. 8:6]]), and verse 3 shows the glory moving to the threshold.
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue]

christ: |
  The chapter’s witness is in who gives the two commands. The LORD who speaks from the threshold (on who He is, see the note on [[Ezek. 1:26]]) is the judge here, and the severity is His. He is also the one who sends the scribe out ahead of the sword and tells the destroyers, “come not near any man upon whom is the mark.”

  The Passover token, beside which the mark has been read, was the blood of a lamb, and Paul says what that lamb was: “Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]). It also seems to be related to King Benjamin’s hope for his people, that “Christ, the Lord God Omnipotent, may seal you his” ([[Mosiah 5:15]]).

explore: |
  - What Ezekiel was shown just before this, and the sentence this chapter carries out: [[Ezek. 8]].
  - The rest of the vision: the coals over the city, the glory leaving, and the promise to the exiles in [[Ezek. 10]] and [[Ezek. 11:14–25]].
  - The return of the glory by the east gate: [[Ezek. 43:1–7]].
  - The first Passover, which has been read beside the mark: [[Ex. 12:1–28]].
  - The sealing of the servants of God, and its explanation: [[Rev. 7:1–4]] and [[D&C 77:9–11]].
  - “Upon my house shall it begin”: [[D&C 112:23–26]].
  - The history that matches the vision: [[2 Chr. 36:14–19]].

