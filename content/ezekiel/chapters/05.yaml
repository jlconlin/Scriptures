chapter: 5
title: The Razor and the Thirds
tagline: Ezekiel is told to shave his head and beard with a sword and to weigh the hair into three parts for the fire, the blade, and the wind, and the Lord says what it means, “This is Jerusalem.”
when: 'No date of its own. It stands under the heading of 1:1–2, the fifth year of king Jehoiachin’s captivity (the Bible Dictionary begins Ezekiel’s ministry in 592 B.C.), and before the next date, the sixth year (8:1)'

setting: |
  Chapter 5 has no heading or date. It continues the instructions that begin at 4:1 and stands between the date of the first vision, “the fifth year of king Jehoiachin’s captivity” ([[Ezek. 1:2]]), and the next date in the book, “the sixth year” ([[Ezek. 8:1]]). The Bible Dictionary begins Ezekiel's ministry in 592 B.C. He is with the exiles “at Tel-abib, that dwelt by the river of Chebar” ([[Ezek. 3:15]]), and Jerusalem is still standing: by the book's own dates the king of Babylon does not come against it until the ninth year ([[Ezek. 24:1–2]]).

  In chapter 4 the Lord told Ezekiel to draw Jerusalem on a clay tile, lay a model siege against it, lie on his side for a set number of days, and eat rationed bread. The next sign follows without a break (“And thou, son of man”). The “city” in whose midst a third of the hair is burned is the one drawn on the tile, and “the days of the siege” are the days of that acted siege ([[Ezek. 4:8]]). The text gives the command and does not describe Ezekiel carrying it out.

  At verse 5 the signs stop. The figure is dropped, and the Lord says in plain terms what is coming and why. Jeremiah and Lamentations, on this site, tell the siege as it happened ([[Jer. 39:1–10]]; [[Lam. 4]]).

thread: |
  The chapter is a sign and then its explanation, and the explanation is an argument about **where Jerusalem stands.** The Lord set her “in the midst of the nations” (verse 5). She has done worse than the nations around her (verses 6–7). So she will be judged in her own midst, “in the sight of the nations” (verse 8), and left as a warning to them (verses 14–15). The speech gives first the cause of the judgment (verses 5–9) and then its nature (verses 10–17).

  The sign has already said what the judgment is. A sword used as a razor takes off the prophet's hair; a third is burned, a third struck with the blade, a third thrown to the wind. Verse 12 gives the key: plague and famine inside the walls, the sword around them, scattering beyond, and a sword still following.

  None of these penalties is new. Most have a counterpart in the warnings at the end of Leviticus, given in case Israel broke the covenant (see the note on verse 2). Three times the speech closes a paragraph with the same line: “I the LORD have spoken it” (verses 13, 15, 17).

  One detail runs the other way. A few hairs are tied into the edge of the prophet's robe (verse 3). Even some of those go to the fire, but the next chapter says it outright: “Yet will I leave a remnant” ([[Ezek. 6:8]]).

sections:
  - range: 1-4
    heading: The razor and the hair
    plain: |
      “And you, son of man: take a sharp blade, take a barber's razor, and pass it over your head and your beard. Then take scales and divide the hair. Burn a third in the fire inside the city when the days of the siege are over. Take a third and strike it with the blade all around the city. Scatter a third to the wind, and I will draw a sword after them. Take a few hairs from these and tie them up in the edge of your robe. Then take some of those as well, throw them into the fire, and burn them. From there a fire will go out to the whole house of Israel.”
  - range: 5-9
    heading: This is Jerusalem
    plain: |
      The Lord GOD says: “This is Jerusalem. I set her in the middle of the nations, with countries all around her. But she has rebelled against my judgments and my statutes and become more wicked than the nations and countries around her; they have rejected my judgments and have not walked in my statutes. So the Lord GOD says: Because you have been more unruly than the nations around you, have not walked in my statutes or kept my judgments, and have not even kept the standards of the nations around you, I, I myself, am against you. I will carry out judgments in your midst while the nations watch. Because of all your abominations I will do to you what I have never done, and the like of which I will never do again.”
  - range: 10-13
    heading: No pity, and then an end
    plain: |
      “So within you parents will eat their children, and children will eat their parents. I will carry out judgments on you and scatter all who are left of you to every wind. As I live, says the Lord GOD: because you have defiled my sanctuary with all your detestable things and all your abominations, I too will diminish you. My eye will not spare, and I will have no pity. A third of you will die of plague and waste away with famine inside you; a third will fall by the sword around you; a third I will scatter to every wind, and I will draw a sword after them. Then my anger will be spent. I will bring my fury on them to rest, and I will be eased. And they will know that I, the LORD, have spoken in my zeal, when I have spent my fury on them.”
  - range: 14-17
    heading: A warning to the nations
    plain: |
      “I will make you a ruin and a reproach among the nations around you, in the sight of everyone who passes by. You will be a reproach and a taunt, a warning and a horror to the nations around you, when I carry out judgments on you in anger, in fury, and in furious rebukes. I the LORD have spoken. When I shoot the deadly arrows of famine, arrows of destruction that I send to destroy you, I will heap famine on you and break your staff of bread. I will send famine and wild beasts against you, and they will rob you of your children. Plague and bloodshed will pass through you, and I will bring the sword on you. I the LORD have spoken.”

notes:
  - ref: 1
    phrase: a sharp knife
    kind: words
    title: The knife is a sword
    body: |
      The “knife” Ezekiel is told to take is, in Hebrew, a sword. The word is *cherev*, the ordinary word for a “sword, as weapon of war,” and the chapter uses it six times. The King James translators wrote “knife” here and for the blade that strikes the second third in verse 2, and “sword” for the same word at the end of verse 2 and in verses 12 and 17, so the English hides the link.

      In Hebrew the thing that shaves the prophet is the thing that will cut down the city. What he does to a third of the hair “with a knife” (verse 2), the Lord explains as “a third part shall fall by the sword” (verse 12).
    sources: [oshb-wlc, bdb]
  - ref: 1
    phrase: upon thine head and upon thy beard
    kind: symbol
    title: A shaved head and beard
    body: |
      A shaved head and beard meant mourning and disgrace, and the prophet is to wear both for Jerusalem. Cutting off the hair was “a sign of mourning” and “also a sign of great disgrace”: when the Ammonites wanted to shame David's messengers they “shaved off the one half of their beards” ([[2 Sam. 10:4]]). Isaiah had used the picture for a whole nation. The Lord would “shave with a razor that is hired” ([[Isa. 7:20]]), the king of Assyria, and the note there explains the insult. In this sign the prophet stands for the nation, his hair for its people, and the razor for the Chaldeans, the Babylonians.
    sources: [clarke-commentary, lds-scriptures]
  - ref: 2
    phrase: a third part
    kind: symbol
    title: Three thirds, explained in verse 12
    body: |
      The Lord explains the three thirds Himself in verse 12, so the sign does not have to be guessed at. What Ezekiel did to his hair “would also be done to Judah.”

      - The third burned “in the midst of the city” is those who “die with the pestilence, and with famine” inside the walls.
      - The third struck with the blade around the city is those who “fall by the sword round about thee.”
      - The third thrown to the wind is those scattered “into all the winds,” taken captive far from home, with a sword still behind them.

      The scales of verse 1 are for dividing the hair; the text gives them no further meaning.

      Verse 12 names four fates in three parts, since plague and famine share the first. The old Greek translation, the Septuagint, counts four parts in both verses, and in verse 12 gives a “fourth part” each to plague, famine, scattering, and sword. The Hebrew keeps three, and puts the two deaths inside the walls together.
    sources: [lds-scriptures, ot-manual-26, lxx-rahlfs]
  - ref: 2
    phrase: I will draw out a sword after them
    kind: scripture
    title: The curses of the covenant
    body: |
      Most of the threats in this chapter have a counterpart at the end of Leviticus, where the Lord set out what would follow if Israel broke the covenant. Those warnings, with the like chapter in Deuteronomy ([[Deut. 28:15–68]]), are probably the most important background to Ezekiel's message: Moses promised blessings while Israel kept the covenant, and “a series of grim warnings” if they broke it. This phrase is a clear case. The law says, “I will scatter you among the heathen, and will draw out a sword after you” ([[Lev. 26:33]]), and Ezekiel uses the same Hebrew verbs for scattering and for drawing the sword, here and in verse 12. The two passages stand together under that idiom in the standard Hebrew lexicon.

      Other lines of the speech have the wording of the same chapter of the law:

      - rejecting the Lord's judgments and statutes (verse 6): “if ye shall despise my statutes, or if your soul abhor my judgments” ([[Lev. 26:15]]);
      - parents eating their children (verse 10): [[Lev. 26:29]];
      - the city laid waste (verse 14): [[Lev. 26:31]];
      - the broken staff of bread (verse 16): [[Lev. 26:26]];
      - wild beasts that take the children (verse 17): [[Lev. 26:22]];
      - sword and pestilence (verse 17): [[Lev. 26:25]];
      - the Lord's fury (verses 13 and 15): [[Lev. 26:28]].

      So the speech is not a fresh outburst. The warnings had been given beforehand: Leviticus calls the sword one “that shall avenge the quarrel of my covenant” ([[Lev. 26:25]]).

      The same chapter of the law sets a limit on its own penalties: “And yet for all that, when they be in the land of their enemies, I will not cast them away, neither will I abhor them, to destroy them utterly, and to break my covenant with them” ([[Lev. 26:44]]).
    sources: [lund-ezekiel, lds-scriptures, oshb-wlc, bdb]
  - ref: 3
    phrase: bind them in thy skirts
    kind: symbol
    title: The few hairs kept, and then burned
    body: |
      A few hairs are kept back, tied into the edge of the prophet's robe, and then some even of these are burned. “Skirts” is *kanaph*, the “skirt, corner, or loose flowing end” of a garment. The few belong with the scattered third. That not all of Judah would be destroyed, later chapters say outright: “Yet will I leave a remnant” ([[Ezek. 6:8]]), and “I will leave a few men of them from the sword, from the famine, and from the pestilence” ([[Ezek. 12:16]]).

      Being kept is not the end of danger. The burning in verse 4 signified that even among those taken captive and spared the first destruction, some would later go into the fire as well, “to be destroyed, or to be cleansed and purified from iniquity by tribulations.” Both possibilities are left open. The verse itself adds only that from this fire “shall a fire come forth into all the house of Israel.”
    sources: [bdb, oshb-wlc, ot-manual-26, lds-scriptures]
  - ref: 5
    phrase: I have set it in the midst of the nations
    kind: history
    title: Jerusalem in the midst of the nations
    body: |
      The Lord begins His charge with where He put Jerusalem: “in the center of the nations,” as a modern translation has it, with countries all around. This has been read as more than geography. Jerusalem stands at the center “in relation to the history of salvation, as the city in which God hath set up His throne of grace, from which shall go forth the law and the statutes for all nations,” which is what Isaiah saw: “out of Zion shall go forth the law, and the word of the Lord from Jerusalem” ([[Isa. 2:3]]).

      The position measures the guilt. Ezekiel reminds the people again and again that they had the law and the covenant, and verses 5–7 are one of the places; the principle is the one in [[D&C 82:3]], “unto whom much is given much is required.” The charge opens with the city's high position in order to show how great its guilt is, and because Jerusalem has done worse than the nations, the judgment is carried out before their eyes. The chapter's wording keeps the picture in view. The Hebrew word for “midst” comes six times (verses 2, 4, 5, 8, 10, 12) and the word for “round about” eight times. The city set in the midst of the nations is judged “in the midst of thee in the sight of the nations” (verse 8), and becomes “an instruction” to them (verse 15), “a warning” in a modern translation.
    sources: [lund-ezekiel, keil-ezekiel, nrsvue, oshb-wlc, lds-scriptures]
  - ref: 7
    phrase: neither have done according to the judgments of the nations
    kind: words
    title: Worse than the nations, and yet like them
    body: |
      Verse 7 says Jerusalem has not even lived up to the standards of her neighbors, which looks like a contradiction of [[Ezek. 11:12]], where she is blamed because “ye… have done after the manners of the heathen that are round about you.” The old Syriac translation and several Hebrew manuscripts leave out the “not” here; that has been explained as a change made “to avoid the supposed contradiction.”

      One answer keeps both verses. The nations had laws opposed to God's and also laws “rooted in the law of God written upon their hearts,” and Israel “followed the wicked and sinful laws of the heathen, and neglected to observe their good laws.” Jeremiah makes a comparison of the same kind: “Hath a nation changed their gods, which are yet no gods? but my people have changed their glory for that which doth not profit” ([[Jer. 2:11]]).

      “Multiplied” in the same verse translates the Hebrew form *hamonkhem*. The lexicon sets it apart from the noun *hamon* (“sound, murmur, roar, crowd, abundance”), and it has been taken as a verb, “to rage,” that is, to rebel against God. A modern translation agrees: “you are more turbulent than the nations.” The charge is that Judah was more unruly than its neighbors, not that it outgrew them.
    sources: [keil-ezekiel, bdb, nrsvue, lds-scriptures]
  - ref: 10
    phrase: the fathers shall eat the sons
    kind: scripture
    title: The worst of the famine
    body: |
      Verse 10 names the last horror of a siege, a famine so severe that parents and children eat one another, and it was both foretold and fulfilled. Moses had warned of it in the law ([[Lev. 26:29]]; [[Deut. 28:53]]), and Jeremiah gave the same warning inside Jerusalem ([[Jer. 19:9]]; see the note there). The warning was fulfilled more than once: Lamentations mourns it in the destruction of the city ([[Lam. 2:20]]; [[Lam. 4:10]]), and it happened again when the Romans under Titus besieged Jerusalem in A.D. 70.

      In the speech the verse stands directly after the Lord's words that He will do “that which I have not done, and whereunto I will not do any more the like” (verse 9), and begins with “Therefore.”
    sources: [lund-ezekiel, ot-manual-26, lds-scriptures]
  - ref: 11
    phrase: therefore will I also diminish thee
    kind: words
    title: Diminish, or withdraw
    body: |
      The verb behind “diminish” is uncertain in this verse. *Gara‘* means to “diminish, restrain, withdraw.” The lexicon marks the reading here as doubtful and lists the verse under “withdraw,” and one of the proposals it records supplies an object: “withdraw (mine eye).” On that reading the Lord withdraws His eye from the city; the next words are “neither shall mine eye spare.”

      Either way the “also” carries the logic: “thou hast defiled my sanctuary… therefore will I also.” In chapter 8 Ezekiel is shown abominations done at the temple itself, and the Lord asks whether the people do these things “that I should go far off from my sanctuary” ([[Ezek. 8:6]]).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 13
    phrase: I will be comforted
    kind: words
    title: The anger comes to an end
    body: |
      “I will be comforted” is about anger reaching its end. The verb is a form of *nacham*, the usual word for comfort and for relenting, and its sense here is set down, with a question mark, as “ease oneself, by taking vengeance,” the sense it has in Isaiah: “Ah, I will ease me of mine adversaries, and avenge me of mine enemies” ([[Isa. 1:24]]). A modern translation has “My anger shall spend itself,” and for the last verb, “satisfy myself.”

      The verse is framed by the word “accomplished,” at its beginning and its end. The fury is not endless; it is carried through and then it rests. Ezekiel says so plainly later, to the same city: “So will I make my fury toward thee to rest, and my jealousy shall depart from thee, and I will be quiet, and will be no more angry” ([[Ezek. 16:42]]).
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]
  - ref: 16
    phrase: will break your staff of bread
    kind: symbol
    title: The staff of bread
    body: |
      To break the staff of bread is to cut off the food a people leans on. A *matteh* is a walking staff, and “from staff as support comes” the figure “staff of bread (food supply).” The phrase is the law's: “when I have broken the staff of your bread, ten women shall bake your bread in one oven, and they shall deliver you your bread again by weight” ([[Lev. 26:26]]). Ezekiel had just acted it out, eating measured rations because the Lord would “break the staff of bread in Jerusalem: and they shall eat bread by weight, and with care” ([[Ezek. 4:16]]).

      Famine is the judgment the end of the chapter dwells on. The word comes four times in verses 12–17, and verse 16 pictures it as arrows sent by the Lord.

      When the siege came, “the famine prevailed in the city, and there was no bread for the people of the land” ([[2 Kgs. 25:3]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  This chapter holds no promise and does not speak of the Messiah. What points beyond it is the limit on the judgment.

  A few hairs are tied into the prophet's robe (verse 3), and the next chapter's promise, “Yet will I leave a remnant” ([[Ezek. 6:8]]), shows that not all of Judah would be destroyed. That promise ([[Ezek. 6:8–10]]) stands among Ezekiel's prophecies that Israel will “return to the covenant and experience an eventual conversion to the gospel.” The chapter of the law that holds the warnings repeated here says of Israel in the land of their enemies, “I will not cast them away, neither will I abhor them, to destroy them utterly, and to break my covenant with them” ([[Lev. 26:44]]).

explore: |
  - **The signs before this one.** [[Ezek. 4]]: the tile, the days on his side, the rationed bread.
  - **The terms of the covenant.** [[Lev. 26:14–45]], read with this chapter open beside it.
  - **The siege as it happened.** [[2 Kgs. 25:1–12]], [[Jer. 52:4–16]], and [[Lam. 4]].
  - **The remnant.** [[Ezek. 6:8–10]] and [[Ezek. 12:14–16]], where the few hairs of verse 3 become a promise.
  - **The defiled sanctuary.** [[Ezek. 8]], which shows what verse 11 charges.
  - **The four judgments.** [[Ezek. 14:21]] names sword, famine, beasts, and pestilence together again.

parallels:
  - ref: Lev. 26:33
    note: The law's warning, “I will scatter you among the heathen, and will draw out a sword after you,” has the words of verses 2 and 12.
  - ref: Isa. 7:20
    note: Isaiah's “razor that is hired,” the king of Assyria, shaves Judah's head and beard.

sources: [lds-scriptures, bd-ezekiel, ot-manual-26, lund-ezekiel, clarke-commentary, keil-ezekiel, bdb, oshb-wlc, lxx-rahlfs, nrsvue]
