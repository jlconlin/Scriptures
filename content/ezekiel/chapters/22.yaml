chapter: 22
title: 'The Bloody City'
tagline: 'Ezekiel is told to bring the charges against Jerusalem. The city’s sins are listed from the law it was given, its people are dross in a furnace, and when the Lord looks for one person to stand in the gap for the land, He finds none.'
when: 'No date of its own. The chapter stands under the heading of 20:1, “the seventh year, in the fifth month” of Jehoiachin’s captivity (about 590 B.C.), and before the next date in the book, the ninth year (24:1), on the day the king of Babylon “set himself against Jerusalem” (24:2).'

setting: |
  Ezekiel is in Babylon and Jerusalem is still standing. The last date given was the seventh year, when “certain of the elders of Israel came to inquire of the LORD, and sat before me” ([[Ezek. 20:1]]). The Lord’s answer began with a question to the prophet: “Wilt thou judge them, son of man, wilt thou judge them? cause them to know the abominations of their fathers” ([[Ezek. 20:4]]). Chapter 20 went through the fathers’ history, and chapter 21 foretold the judgment. Chapter 22 opens with the same question and turns to the city as it now is, describing the sins that bring that judgment on.

  The chapter is three separate words of the Lord, each beginning “the word of the LORD came unto me” (verses 1, 17, 23), and they “are connected together both in substance and design.” It belongs to the first division of the book, the “prophecies of judgment against Jerusalem and the nation,” and is one of the chapters whose main theme is that Jerusalem really will be destroyed.

  Much of the wording has been heard before. The list of sins draws on the law of Moses, the review of the nation’s ranks is much like Zephaniah’s, and the whitewash and the gap in the wall have already appeared in Ezekiel’s own chapter 13.

thread: |
  The three words of the Lord make one argument, and each asks a different question. The first (verses 1–16) asks what the city has done, and answers with a list in which “blood” is the heading: the word stands in verses 2, 3, 4, 6, 9, 12, and 13, and returns in verse 27. The second (verses 17–22) asks what the people have become, and answers with one image, dross. The third (verses 23–31) asks who is left that might turn the judgment aside. It goes through prophets, priests, princes, and people and ends, “I found none.”

  One phrase runs through all three. The city sheds blood “in the midst of it” (verse 3); the house of Israel is gathered “into the midst of Jerusalem” to be melted “in the midst thereof” (verses 19–22); and the prophets and princes do their work “in the midst thereof” (verses 25, 27).

  The first two words close with the book’s refrain, “thou shalt know that I am the LORD” (verse 16; compare verse 22). The third closes instead with a sentence of judgment: “their own way have I recompensed upon their heads.”

sections:
  - range: 1-5
    heading: 'Wilt thou judge the bloody city?'
    plain: |
      The word of the Lord comes to Ezekiel: Son of man, will you judge, will you judge the bloody city? Show her all her abominations. Say that the Lord God says: This is a city that sheds blood within itself, so that its time comes, and that makes idols against itself to defile itself. She is guilty through the blood she has shed and defiled through the idols she has made. She has made her days draw near and has come to her years. So the Lord has made her a reproach to the nations and a mocking to all countries. Those near and those far off will mock her, infamous and much troubled as she is.
  - range: 6-12
    heading: 'What is done in her'
    plain: |
      Every one of the princes of Israel in her has used his power to shed blood. In her, father and mother are treated lightly, the stranger is oppressed, and the fatherless and the widow are wronged. She has despised the Lord’s holy things and profaned His sabbaths. In her are men who slander in order to shed blood, who eat on the mountains, and who commit lewdness. In her men uncover their fathers’ nakedness and abuse a woman in her time of uncleanness. One commits abomination with his neighbour’s wife, another defiles his daughter-in-law, another his sister, his father’s daughter. In her they take gifts to shed blood. She has taken usury and increase, has gained greedily from her neighbours by extortion, and has forgotten the Lord.
  - range: 13-16
    heading: 'Scattered among the nations'
    plain: |
      So the Lord has struck His hand at her dishonest gain and at the blood that has been in her midst. Can her heart endure, or her hands be strong, in the days when He deals with her? He, the Lord, has spoken it and will do it. He will scatter her among the nations, disperse her through the countries, and consume her filthiness out of her. She will take her inheritance in herself in the sight of the nations, and she will know that He is the Lord.
  - range: 17-22
    heading: 'Dross in the furnace'
    plain: |
      The word of the Lord comes again: Son of man, the house of Israel has become dross to Him. All of them are brass, tin, iron, and lead in the middle of the furnace; they are the dross of silver. Because they have all become dross, the Lord God will gather them into the middle of Jerusalem. As men gather silver, brass, iron, lead, and tin into a furnace and blow the fire on it to melt it, so He will gather them in His anger and fury, leave them there, and melt them. He will blow on them with the fire of His wrath, and they will be melted in the middle of it as silver is melted in a furnace. They will know that He, the Lord, has poured out His fury on them.
  - range: 23-31
    heading: 'Every rank, and no one in the gap'
    plain: |
      The word of the Lord comes again: Son of man, say to her, You are the land that is not cleansed nor rained upon in the day of indignation. There is a conspiracy of her prophets within her, like a roaring lion tearing its prey. They have devoured souls, taken treasure and precious things, and made many widows in her. Her priests have violated the Lord’s law and profaned His holy things. They have put no difference between the holy and the profane, have not shown the difference between the unclean and the clean, and have hidden their eyes from His sabbaths, and He is profaned among them. Her princes are like wolves tearing prey, shedding blood and destroying souls for dishonest gain. Her prophets have daubed them with untempered mortar, seeing vanity and divining lies for them, saying, “Thus saith the Lord God,” when the Lord has not spoken. The people of the land have practised oppression and robbery, have wronged the poor and needy, and have oppressed the stranger wrongfully. The Lord looked among them for a man to build up the hedge and stand in the gap before Him for the land, so that He would not destroy it, and He found none. So He has poured out His indignation on them and consumed them with the fire of His wrath. He has brought their own way back on their heads.

notes:
  - ref: 2
    phrase: 'wilt thou judge, wilt thou judge the bloody city?'
    kind: words
    title: 'Judge the bloody city'
    body: |
      The doubled question leads straight into an order to bring charges against Jerusalem, which Ezekiel is to call the “bloody city.” The next words are the order, “yea, thou shalt shew her all her abominations,” or in a modern translation, “Then declare to her all her abominations.” The same question opened chapter 20, where what he was to make known was “the abominations of their fathers” ([[Ezek. 20:4]]), and it comes once more at [[Ezek. 23:36]]. Here the subject is no longer the fathers. It is the city.

      “Bloody city” is in Hebrew *ir ha-damim*, literally the city of bloods. The plural of “blood” is the way Hebrew speaks of “guilt of bloodshed, blood-guiltiness.” Nahum uses the same name in his cry against Nineveh: “Woe to the bloody city! it is all full of lies and robbery” ([[Nahum 3:1]]). Ezekiel will use the name again on the day the siege begins: “Woe to the bloody city” ([[Ezek. 24:6]]).

      Verse 3 gives the reason for the name: the city “sheddeth blood in the midst of it.” The history is in Kings. Manasseh “shed innocent blood very much, till he had filled Jerusalem from one end to another” ([[2 Kgs. 21:16]]).
    sources: [bdb, oshb-wlc, esv, lds-scriptures]

  - ref: 4
    phrase: 'thou hast caused thy days to draw near, and art come even unto thy years'
    kind: words
    title: 'A city that brought its own day near'
    body: |
      The “days” and “years” are the city’s appointed time, and the verse says Jerusalem has brought that time near herself. Verse 3 has already said that she sheds blood “that her time may come.” Modern translations fill out the sense here: “you have brought your days near; the appointed time of your years has come.” The previous chapter said as much of Israel’s prince: “thou, profane wicked prince of Israel, whose day is come, when iniquity shall have an end” ([[Ezek. 21:25]]).

      The mockery of verses 4–5 is joined to this by “therefore.” “Infamous and much vexed” is given in a modern translation as two charges, “your name is defiled” and “you are full of tumult.”
    sources: [nrsvue, esv, lds-scriptures]

  - ref: 7
    phrase: 'In thee have they set light by father and mother'
    kind: scripture
    title: 'The law read back as an indictment'
    body: |
      The list in verses 6–12 is not a new standard. It is the law Israel already had, read back to Jerusalem as charges, and verses 9–11 allude to Leviticus 18 and 19. Set the two side by side:

      - Father and mother (verse 7): “Honour thy father and thy mother” ([[Ex. 20:12]]).
      - The stranger, the fatherless, and the widow (verse 7): “Thou shalt neither vex a stranger, nor oppress him,” and “Ye shall not afflict any widow, or fatherless child” ([[Ex. 22:21–22]]).
      - The sabbaths (verse 8): the charge was made against the fathers in chapter 20, “my sabbaths they greatly polluted” ([[Ezek. 20:13]]).
      - Slander (verse 9, “men that carry tales to shed blood”): “Thou shalt not go up and down as a talebearer among thy people: neither shalt thou stand against the blood of thy neighbour” ([[Lev. 19:16]]). The Hebrew is “men of slander, informers,” and the charge has been explained as “malicious charges and false testimony in a court of justice.”
      - The sexual sins of verses 10–11 are each forbidden in [[Lev. 18:7–20]], and [[Lev. 20:12]] sets the penalty for one of them.

      The words “to shed blood” come three times (verses 6, 9, 12), and by that refrain the list “is divided into three groups of sins, which are placed in the category of blood-guiltiness.” The first group is violence and contempt for what is holy, the second slander, idolatry, and sexual sin, and the third “sins of covetousness.” That is why a list with sabbath-breaking and interest in it stands under the name “bloody city.” The “princes of Israel” who lead the list have been understood as “primarily the profligate kings, who caused innocent persons to be put to death.”

      Two items are explained in an earlier chapter: eating upon the mountains (see the note on [[Ezek. 18:6]]) and usury and increase (see the note on [[Ezek. 18:8]]).

      The last charge is the shortest: “and hast forgotten me.” The list “finishes with forgetfulness of God, which is closely allied to covetousness.” [The Stranger’s Inheritance](/ezekiel/themes/the-strangers-inheritance/) sets this charge beside the inheritance given the stranger at the end of the book.
    sources: [keil-ezekiel, bdb, esv, lds-scriptures]

  - ref: 13
    phrase: 'I have smitten mine hand'
    kind: symbol
    title: 'The Lord strikes His hands'
    body: |
      Striking the hands together is a gesture of strong feeling, and here it is the Lord’s anger. A modern translation gives the action plainly: “I strike my hands together at the dishonest gain you have made.” Elsewhere in scripture the same gesture shows alarm and horror, contempt, triumph, or a pledge; this verse is cited as the example of anger. Ezekiel was told to make the gesture himself at [[Ezek. 6:11]] (see the note there), and in the previous chapter the Lord said, “I will also smite mine hands together, and I will cause my fury to rest” ([[Ezek. 21:17]]).

      Out of the whole list, the verse names two things that draw the gesture: “thy dishonest gain” and “thy blood.” Then comes the question the city is left with: “Can thine heart endure, or can thine hands be strong, in the days that I shall deal with thee?”
    sources: [ot-manual-26, nrsvue, lds-scriptures]

  - ref: 16
    phrase: 'thou shalt take thine inheritance in thyself'
    kind: words
    title: 'Inheritance, or profaned?'
    body: |
      The Hebrew verb in this clause has been read in two ways, and modern translations take it as “be profaned,” not “inherit.” The King James Version renders it “take thine inheritance.” The ancient Greek translation also has an inheritance, though with the Lord as the one acting: “And I will give heritages in thee in the sight of the nations.” One modern translation keeps that possibility in its margin: “Or When I have allotted you your inheritance.” What an inheritance taken “in thyself” would be, the verse does not say.

      The other reading takes the form from the verb “profane,” where it is classed as a passive, “be polluted, defiled.” So the modern translations read, “you shall be profaned by your own doing” or “profaned within yourself in the sight of the nations.” On this reading the verse uses a verb that runs through the chapter. Jerusalem “profaned my sabbaths” (verse 8); she will be profaned before the nations (verse 16); the priests “profaned mine holy things,” and the Lord says, “I am profaned among them” (verse 26).
    sources: [bdb, oshb-wlc, esv, nrsvue, niv, lxx-rahlfs]

  - ref: 18
    phrase: 'the house of Israel is to me become dross'
    kind: symbol
    title: 'Dross in the furnace'
    body: |
      Dross is what a smelter throws away, and the Lord says the whole house of Israel has become that. The word is used “usually of silver.” The picture in verse 20 is of metal gathered into a furnace and the fire blown on it to melt it; brass, tin, iron, and lead are “the baser ingredients which are mixed with the silver, and separated from it by smelting.” Isaiah had used the figure of Jerusalem, “Thy silver is become dross” ([[Isa. 1:22]]), and had added a promise, that the Lord would “purely purge away thy dross, and take away all thy tin” ([[Isa. 1:25]]).

      Ezekiel names the furnace: “I will gather you into the midst of Jerusalem.” The image “represents the siege awaiting Jerusalem as a melting process.” “This smelting process was experienced by Israel in the last siege of Jerusalem by the Chaldeans.”

      In Isaiah and Malachi the fire leaves something behind: the Lord “shall sit as a refiner and purifier of silver” ([[Mal. 3:3]]; see the notes on [[Isa. 1:25]] and [[Mal. 3:2]]). Ezekiel does not go on to that. There is silver in the mixture, and verse 22 says “As silver is melted in the midst of the furnace.” But “The smelting is treated here simply as a figurative representation of punishment,” and the refining of the silver “is not referred to any further.”
    sources: [keil-ezekiel, bdb, lds-scriptures]

  - ref: 24
    phrase: 'not cleansed, nor rained upon'
    kind: words
    title: 'A land without rain'
    body: |
      The Hebrew text pictures a land neither cleansed nor rained upon in the day of the Lord’s anger, and the ancient Greek translation has rain in both halves. Modern translations keep the Hebrew’s verb “cleanse”: “You are a land that is not cleansed, not rained upon in the day of indignation.” The Greek reads: “Thou art the land that is not rained upon, neither has rain come upon thee in the day of wrath.”

      The first word of the Lord (verses 1–16) was spoken to the city. This third one calls the one addressed “the land,” and one modern translation has “say to the land” where the King James Version has “say unto her.”

      Later in the book rain is promised: “I will cause the shower to come down in his season; there shall be showers of blessing” ([[Ezek. 34:26]]).
    sources: [oshb-wlc, nrsvue, niv, lxx-rahlfs, lds-scriptures]

  - ref: 25
    phrase: 'a conspiracy of her prophets'
    kind: scripture
    title: 'Prophets, priests, princes, people'
    body: |
      Verses 25–29 go through every rank of the nation and find the same corruption in each, and Zephaniah reviews Jerusalem in much the same words. “Her princes within her are roaring lions; her judges are evening wolves” ([[Zeph. 3:3]]); “Her prophets are light and treacherous persons: her priests have polluted the sanctuary, they have done violence to the law” ([[Zeph. 3:4]]). Ezekiel has the roaring lion (verse 25), the priests who “violated my law, and have profaned mine holy things” (verse 26), the wolves (verse 27), and the prophets (verse 28), and he adds “the people of the land” (verse 29).

      Translations differ over whether verse 25 names prophets or princes. The Hebrew text has “her prophets,” and the King James Version follows it. The ancient Greek translation has rulers: “whose princes in the midst of her are as roaring lions seizing prey.” Some modern translations follow the Greek, “Its princes within it are like a roaring lion tearing the prey,” with a note that the Hebrew reads “A conspiracy of its prophets.” If “princes” is right, the list runs princes, priests, officials, prophets, people, and the lions are the rulers, as in Zephaniah. If the Hebrew is right, the prophets are named twice, first and fourth.

      Either way the charge in verse 25 is killing for profit: “they have devoured souls; they have taken the treasure and precious things; they have made her many widows.” Verse 27 says almost the same of the princes, who shed blood “to get dishonest gain.”
    sources: [lds-scriptures, esv, lxx-rahlfs, nrsvue, oshb-wlc]

  - ref: 26
    phrase: 'they have put no difference between the holy and profane'
    kind: scripture
    title: 'The priests’ task left undone'
    body: |
      Telling the holy from the common and the clean from the unclean was the work the law gave the priests, and verse 26 says they stopped doing it. The charge to Aaron’s sons was “that ye may put difference between holy and unholy, and between unclean and clean” ([[Lev. 10:10]]). The second half of Ezekiel’s sentence is about teaching, as a modern translation shows: “neither have they taught the difference between the unclean and the clean.” To hide their eyes from the sabbaths is, in the same translation, “they have disregarded my Sabbaths.”

      The verse ends with the result: “I am profaned among them.” The verb is the one used in verse 8 of the sabbaths, and here it is used of “even God himself.”

      In the visions of the temple at the end of the book the task appears again. The priests there “shall teach my people the difference between the holy and profane, and cause them to discern between the unclean and the clean” ([[Ezek. 44:23]]).
    sources: [lds-scriptures, esv, bdb]

  - ref: 28
    phrase: 'daubed them with untempered mortar'
    kind: symbol
    title: 'Whitewash for the others'
    body: |
      The prophets’ part in the city’s guilt is to cover for the others. The figure comes from chapter 13, where “one built up a wall, and, lo, others daubed it with untempered mortar” ([[Ezek. 13:10]]; see the note there for what the mortar is). There it was a wall that was daubed. Here the prophets daub “them,” and the verse stands directly after the priests and the princes. Modern translations take it so: “her prophets have smeared whitewash for them,” or “smeared whitewash on their behalf, seeing false visions and divining lies for them.”

      They do it in the Lord’s name, “saying, Thus saith the Lord GOD, when the LORD hath not spoken.”
    sources: [esv, nrsvue, lds-scriptures]

  - ref: 30
    phrase: 'stand in the gap before me for the land'
    kind: scripture
    title: 'No one in the gap'
    body: |
      The chapter’s last charge is that the Lord looked for one person to stand between the land and its destruction and did not find one. The gap is a breach in a wall, an “image for interceding between the people and God,” and the one who stands in it faces the Lord: he stands “before me.” It is explained where it first appears (see the note on [[Ezek. 13:5]]). There the false prophets were blamed for not going up into the gaps. Here the search is wider: “among them” refers “not merely to the prophets… but to all the classes previously mentioned.”

      Two earlier searches stand behind this one. Abraham pleaded for Sodom and was told, “If I find in Sodom fifty righteous within the city, then I will spare all the place for their sakes” ([[Gen. 18:26]]). The closing words here, “that I should not destroy it,” have been heard as an echo of the Lord’s answers in that scene: “If I find there forty and five, I will not destroy it” ([[Gen. 18:28]]). And through Jeremiah the Lord had made the same offer for Jerusalem: “if ye can find a man, if there be any that executeth judgment, that seeketh the truth; and I will pardon it” ([[Jer. 5:1]]).

      Jeremiah was in Jerusalem, which raises the question whether there was truly no righteous person there. One answer is that the verse does not mean “that literally there was not a righteous man in the city.” Jeremiah and Baruch were still there, but Jeremiah “had been forbidden to pray for the people”: “pray not thou for this people, neither lift up a cry or prayer for them” ([[Jer. 11:14]]). On this reading “among them” means among those the chapter has just listed. That is an interpreter’s answer; the verse itself says only that the search was made and failed. [A Man to Stand in the Gap](/ezekiel/themes/stand-in-the-gap/) follows the search through the book.
    sources: [keil-ezekiel, jfb-ezekiel, lds-scriptures]

christ: |
  The chapter ends with no one found to “stand in the gap before me for the land.”

  Isaiah has a search like it, and says what the Lord did: “he saw that there was no man, and wondered that there was no intercessor: therefore his arm brought salvation unto him” ([[Isa. 59:16]]). Beside Isaiah’s “intercessor” stand the scriptures that speak of the Savior, who “ever liveth to make intercession for them” ([[Heb. 7:25]]) and who is “the advocate with the Father, who is pleading your cause before him” ([[D&C 45:3]]). Ezekiel 22 stops at the empty gap. The intercessor those scriptures name is Jesus Christ. The note on [[Isa. 59:16]] follows the thought further.

explore: |
  - The law behind the list of verses 6–12: [[Ex. 22:21–24]], [[Lev. 18:6–20]], and [[Lev. 19:11–18]].
  - The same deeds as the marks of a just man and an unjust one: [[Ezek. 18:5–13]].
  - Zephaniah’s review of Jerusalem’s princes, judges, prophets, and priests: [[Zeph. 3:1–4]].
  - The refiner’s fire in other prophets: [[Isa. 1:21–26]], [[Jer. 6:27–30]], and [[Mal. 3:2–3]].
  - The search for someone to stand between the Lord and a city: [[Gen. 18:23–32]], [[Jer. 5:1]], and [[Isa. 59:16]].
  - The gap and the whitewash where Ezekiel first uses them: [[Ezek. 13:5]] and [[Ezek. 13:10–15]].
  - The scattering looked back on, and what the Lord does after it: [[Ezek. 36:16–28]].
  - The “bloody city” again, on the day the siege begins: [[Ezek. 24:1–14]].

