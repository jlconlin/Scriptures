chapter: 39
title: 'Gog Falls on the Mountains of Israel'
tagline: 'The invader of chapter 38 is struck down. His weapons become seven years of firewood, his dead take seven months to bury, and the Lord promises Israel that He will not hide His face from them again.'
when: 'No date of its own. Chapters 38 and 39 are one prophecy, standing under the heading of 33:21, “the twelfth year of our captivity, in the tenth month” (about 585 B.C.), and before the next date in the book, the twenty-fifth year (40:1). What they foretell is set “in the latter years” (38:8).'

setting: |
  This chapter is the second half of a prophecy that began with “the word of the LORD came unto me” ([[Ezek. 38:1]]). Chapter 38 told of Gog’s coming against a people gathered back to the mountains of Israel; this chapter tells of his fall, of what is done afterward with his weapons and his dead, and of what the whole event is meant to show. Neither chapter is dated. The nearest date before them is the day the exiles heard that Jerusalem was smitten ([[Ezek. 33:21]]), and the next is the twenty-fifth year of the captivity, when the vision of the temple begins ([[Ezek. 40:1]]).

  The chapter closes the third of the book’s four divisions, the “prophecies of restoration” of chapters 33–39. Ezekiel is speaking to exiles, and verse 23 names their own condition: the house of Israel “went into captivity for their iniquity.”

  Later scripture returns to this prophecy. John hears the birds summoned to a feast ([[Rev. 19:17]]) and gives the names “Gog and Magog” to the nations gathered after the thousand years ([[Rev. 20:8]]). A revelation to Joseph Smith about the Lord’s coming speaks of what must happen “according as it is spoken by the mouth of Ezekiel the prophet” ([[D&C 29:21]]).

thread: |
  The chapter tells a victory for the sake of what the victory proves. Verses 1–8 repeat in brief what chapter 38 has already told: the Lord Himself brings Gog to the mountains of Israel and strikes him down there.

  Then come three pictures of the aftermath, each showing how complete the destruction is. Its weapons are firewood for seven years (verses 9–10). Its dead take seven months to bury, and the land is searched afterward for single bones (11–16). The birds and beasts are called to a feast (17–20). The three are “not arranged in chronological order, but according to the subject-matter,” and the feast is kept for last because in it the enemy’s “ignominious destruction culminates.”

  Verses 21–29 say what it is all for. The nations see the Lord’s judgment, and Israel knows Him “from that day and forward.” The nations also learn something about the past: Israel went into exile for its own iniquity, when the Lord hid His face. With “Now” in verse 25 the Lord turns to the captives Ezekiel lives among. Their restoration has been read as one that begins with the return from Babylon “but is not to be restricted to this.”

  The sentence that runs through the book is here four times, at verses 6, 7, 22, and 28 (see the note on [[Ezek. 6:7]]).

sections:
  - range: 1-8
    heading: 'Gog struck down'
    plain: |
      Ezekiel is told to prophesy against Gog. The Lord God says: I am against you, Gog, chief prince of Meshech and Tubal. I will turn you back and leave only a sixth part of you, bring you up from the north, and bring you onto the mountains of Israel. I will strike the bow out of your left hand and make the arrows fall from your right. You will fall on the mountains of Israel, you and all your bands and the people with you, and I will give you to the birds of prey and the beasts of the field to be eaten. You will fall in the open field, for I have spoken it.

      I will send fire on Magog and on those who live without care in the isles, and they will know that I am the Lord. I will make my holy name known among my people Israel and will not let it be polluted any more, and the nations will know that I am the Lord, the Holy One in Israel. It has come, and it is done, says the Lord God. This is the day I spoke of.
  - range: 9-16
    heading: 'Seven years of fuel, seven months of burial'
    plain: |
      Those who live in the cities of Israel will go out and burn the weapons: shields and bucklers, bows and arrows, handstaves and spears. They will burn them for seven years, so that they take no wood from the field and cut none from the forests. They will spoil those who spoiled them and rob those who robbed them.

      In that day the Lord will give Gog a place of graves in Israel, the valley of the passengers on the east of the sea. It will stop the noses of those who pass by. Gog and all his multitude will be buried there, and it will be called the valley of Hamon-gog. For seven months the house of Israel will be burying them, to cleanse the land. All the people of the land will bury them, and it will be a renown to them on the day the Lord is glorified. They will set apart men for the continual work of passing through the land to bury, with those who pass through, whoever is left on the face of the earth, to cleanse it; after the seven months end they will search. When any of those who pass through sees a man’s bone, he will set up a sign beside it until the buriers have buried it in the valley of Hamon-gog. The city’s name also will be Hamonah. So they will cleanse the land.
  - range: 17-20
    heading: 'The feast for the birds and beasts'
    plain: |
      The Lord God tells Ezekiel to speak to every bird and every beast of the field: Assemble and come; gather from every side to the sacrifice I am making for you, a great sacrifice on the mountains of Israel. There they will eat the flesh of the mighty and drink the blood of the princes of the earth, of rams, lambs, goats, and bullocks, all of them fatlings of Bashan, until they are full. They will be filled at the Lord’s table with horses and chariots, with mighty men and all men of war.
  - range: 21-24
    heading: 'What the nations and Israel will know'
    plain: |
      The Lord will set His glory among the nations, and all of them will see the judgment He has carried out and the hand He has laid on them. From that day forward the house of Israel will know that He is the Lord their God. The nations will know that the house of Israel went into captivity for their iniquity: because they trespassed against Him, He hid His face from them and gave them into the hand of their enemies, and they all fell by the sword. He did to them according to their uncleanness and their transgressions, and hid His face from them.
  - range: 25-29
    heading: 'The captivity turned'
    plain: |
      Therefore the Lord God says: Now I will bring back the captivity of Jacob, have mercy on the whole house of Israel, and be jealous for my holy name, after they have borne their shame and all the trespasses they committed against me when they lived safely in their land and no one made them afraid. When I have brought them back from the peoples, gathered them out of their enemies’ lands, and been sanctified in them in the sight of many nations, they will know that I am the Lord their God, who caused them to be led into captivity among the nations and gathered them to their own land, leaving none of them there any more. I will not hide my face from them any more, for I have poured out my spirit on the house of Israel.

notes:
  - ref: 1
    phrase: 'O Gog, the chief prince of Meshech and Tubal'
    kind: history
    title: 'Gog, named again'
    body: |
      Gog is the leader of the invasion told in the previous chapter, the “King of Magog,” and this verse repeats that chapter’s opening almost word for word ([[Ezek. 38:2–3]]). Who he is, and where Magog, Meshech, and Tubal lay, are taken up in the notes on [[Ezek. 38:2]] and [[Ezek. 38:5]].

      The names of his allies and the size of his army belong to [[Ezek. 38:2–9]]. This chapter takes up the story at its end.
    sources: [bd-gog, lds-scriptures]

  - ref: 2
    phrase: 'leave but the sixth part of thee'
    kind: words
    title: 'A sixth left, or led on?'
    body: |
      The King James wording sounds as though only a sixth of Gog’s army will survive, but the Hebrew verb is not a number, and other translations ancient and modern take it as a verb of leading. The word is found in Ezekiel only here. The King James rendering has been explained as arising “by confusion with” a similar word built on the Hebrew for six.

      The ancient Greek translators wrote, “I will assemble thee, and guide thee.” Modern translations go the same way: “I will turn you about and drive you forward,” with the note “Or and drag you along.”

      On that rendering the four verbs of the verse say one thing: turn, drive, bring up, bring upon the mountains of Israel. Gog’s march is the Lord’s doing from start to finish, which is what the previous chapter said with a harsher image: “I will turn thee back, and put hooks into thy jaws, and I will bring thee forth” ([[Ezek. 38:4]]).
    sources: [oshb-wlc, strongs-concordance, lxx-rahlfs, esv, nrsvue, lds-scriptures]

  - ref: 6
    phrase: 'I will send a fire on Magog'
    kind: scripture
    title: 'Fire on Magog and the far coasts'
    body: |
      The fire reaches past the battlefield to Gog’s own country and to distant coasts that thought themselves safe. Gog falls on the mountains of Israel (verses 4–5). Verse 6 then sends fire “on Magog,” the land he came from, and on “the isles,” which modern translations render “coastlands.” “Carelessly” here means securely, without care. The Hebrew word is the one used in the previous chapter of the people Gog set out to plunder, those “that dwell safely” ([[Ezek. 38:11]]), and it is Israel’s word again at verse 26.

      Fire was already among the weapons the Lord named against Gog ([[Ezek. 38:22]]). The note on that verse takes up the revelation to Joseph Smith that credits Ezekiel with a prophecy of destruction by fire ([[D&C 29:21]]).
    sources: [lds-scriptures, oshb-wlc, esv, nrsvue]

  - ref: 7
    phrase: 'I will not let them pollute my holy name any more'
    kind: words
    title: 'The name no longer profaned'
    body: |
      The Hebrew has no “them.” The Lord says that He will no longer let His holy name be profaned: “I will not let my holy name be profaned any more,” in a modern translation. So the verse does not say who had been profaning it.

      The verb is the one used in chapter 36, where the answer is given. Israel profaned the name among the nations to which they went as exiles (see the note on [[Ezek. 36:20]]). The previous chapter said what Gog’s coming is for: “that the heathen may know me, when I shall be sanctified in thee, O Gog, before their eyes” ([[Ezek. 38:16]]; see the note there).
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 8
    phrase: 'this is the day whereof I have spoken'
    kind: prophets
    title: 'Which day'
    body: |
      The day is the one the previous chapter announced, and Latter-day Saint teaching places it at the Lord’s Second Coming. Chapter 38 set the invasion “in the latter days” ([[Ezek. 38:16]]) and said of the Lord’s answer to it, “Surely in that day there shall be a great shaking in the land of Israel” ([[Ezek. 38:19]]). Here the Lord speaks of that day as arrived: “it is come, and it is done.”

      The timing is stated with care in the Church’s study helps: the prophecy “appears to be” at the Second Coming, and a second battle under the same names comes at the end of the thousand years. The note on [[Ezek. 38:8]] gives both battles and what President Joseph Fielding Smith taught of them.

      The names are not a key to a modern map. Elder Bruce R. McConkie wrote, “The prophecies do not name the modern nations which will be fighting for and against Israel.”
    sources: [bd-gog, ot-manual-27, lds-scriptures]

  - ref: 9
    phrase: 'they shall burn them with fire seven years'
    kind: symbol
    title: 'Seven years of firewood'
    body: |
      The weapons become fuel, so many of them that they supply seven years of firewood. Verse 9 lists everything that will burn, down to the handstaves, and verse 10 gives the result: for seven years no one in Israel has to gather wood from the field or cut it in the forest.

      The text does not say whether seven years is a count or a figure. One reading takes the number, here and in the seven months of verse 12, as “symbolical, stamping the overthrow as a punishment inflicted by God, the completion of a divine judgment.” The same reading holds that the burning does not picture an age without weapons: “the motive is the complete annihilation of the enemy, the removal of every trace of him.”

      Verse 10 ends by turning Gog’s purpose back on him. He came “to take a spoil, and to take a prey” ([[Ezek. 38:12]]); now Israel will “spoil those that spoiled them.” In this “the Israelites do to the enemy what he intended to do to them.”
    sources: [keil-ezekiel, lds-scriptures]

  - ref: 11
    phrase: 'the valley of the passengers on the east of the sea'
    kind: history
    title: 'The valley of Hamon-gog'
    body: |
      The burial place is named for what fills it, and the text does not put it on a known map. “Hamon-gog means the multitude of Gog,” and Hamonah, the city of verse 16, is the same word: “Hamonah means multitude.” The verse “depicts a future event and is not making reference to a known location of that day.” Since the battle centers on Jerusalem, the valley is assumed to be somewhere near it.

      “Passengers” is the King James word for travelers, people passing through. Which sea is meant is not said, and opinions about the valley have differed. One reading takes the sea to be the Dead Sea and the valley to be the Jordan valley above it, “the principal crossing place from Gilead into Canaan proper.”

      The Hebrew has no word for “noses.” It says that the valley will stop the travelers. The same verb is used of muzzling an ox ([[Deut. 25:4]]), and here it is taken to mean that the valley will “stop (the way of) the passers-by.” Modern translations have “It will block the travelers” or “it shall block the path of the travelers.”

      The Hebrew of verse 16 is uncertain. Hamonah is understood as “a city apparently to be founded to commemorate defeat of Gog,” with the caution that the text is doubtful, and one modern translation makes the sentence an aside: “(A city Hamonah is there also.)”
    sources: [ot-manual-27, keil-ezekiel, bdb, oshb-wlc, esv, nrsvue, lds-scriptures]

  - ref: 12
    phrase: 'that they may cleanse the land'
    kind: history
    title: 'Burial that cleanses the land'
    body: |
      The burying is a cleansing of the land, and the passage says so in verses 12, 14, and 16. Under the law of Moses the dead made a person unclean: “whosoever toucheth one that is slain with a sword in the open fields, or a dead body, or a bone of a man, or a grave, shall be unclean seven days” ([[Num. 19:16]]).

      The work is done in two stages. For seven months all the people bury. Then men are set apart for it as a standing duty. Some travel through the land and search. Where one of them sees so much as a single bone he sets up a “sign” beside it, a word used for a signpost and, in another place, for a gravestone. The buriers follow and bury it in the valley.

      Verse 13 calls the burial “a renown.” It has been read as being to Israel’s credit because by it “they thereby cleanse the land and manifest their zeal to show themselves a holy people by sweeping all uncleanness away.”
    sources: [lds-scriptures, bdb, keil-ezekiel]

  - ref: 17
    phrase: 'my sacrifice that I do sacrifice for you'
    kind: symbol
    title: 'The Lord’s sacrifice'
    body: |
      The slaughter is pictured as a sacrificial feast in which the Lord is the host, the birds and beasts are the guests, and the fallen army is what is served. Modern translations call it “the sacrificial feast that I am preparing for you,” and verse 20 speaks of “my table.” Verse 18 names the mighty and the princes of the earth and then the animals of the altar, which a modern translation sets beside them as the same thing: “the princes of the earth—of rams, of lambs,” goats and bullocks, “all of them fatlings of Bashan.” Bashan was the district east of the Jordan “known for its breed of cattle.”

      Isaiah uses the same picture of a day of judgment: “the LORD hath a sacrifice in Bozrah” ([[Isa. 34:6]]). The judgment on the armies of Gog is the day “known in the scriptures as the great day of the Lord’s ‘sacrifice.’”

      John hears the same summons in his vision of the Lord’s coming. An angel cries to the birds, “Come and gather yourselves together unto the supper of the great God” ([[Rev. 19:17]]). Modern revelation says of the wicked before that coming, “the beasts of the forest and the fowls of the air shall devour them up” ([[D&C 29:20]]).
    sources: [lds-scriptures, esv, nrsvue, bd-bashan, ot-manual-kings-i]

  - ref: 23
    phrase: 'therefore hid I my face from them'
    kind: scripture
    title: 'The hidden face'
    body: |
      The hiding of the Lord’s face is what He warned Moses of, in these words, if Israel turned to other gods: “I will forsake them, and I will hide my face from them, and they shall be devoured” ([[Deut. 31:17]]). Verse 23 says that it happened: “therefore hid I my face from them, and gave them into the hand of their enemies.”

      This is what the nations are to learn. What they had said of the exiles was, “These are the people of the LORD, and are gone forth out of his land” ([[Ezek. 36:20]]). After Gog falls they “shall know that the house of Israel went into captivity for their iniquity.”

      The phrase comes three times in the chapter. It is repeated in verse 24 and then reversed in the last verse: “Neither will I hide my face any more from them.” Isaiah has both halves in one sentence: “In a little wrath I hid my face from thee for a moment; but with everlasting kindness will I have mercy on thee” ([[Isa. 54:8]]).
    sources: [lds-scriptures]

  - ref: 26
    phrase: 'After that they have borne their shame'
    kind: words
    title: 'Bear their shame, or forget it?'
    body: |
      Translations divide over whether Israel will bear its shame or forget it, and over when. The King James puts the shame in the past, as something already endured before the return. One modern translation keeps the verb and moves the time: “They shall bear their shame,” when “they live securely in their land.” Another has Israel “forget their shame”; reading the Hebrew word with a slight change as “forget” is an old proposal. The ancient Greek translation has “they shall bear their reproach.”

      The reading that keeps “bear” has been defended from Ezekiel’s own usage in chapter 16 ([[Ezek. 16:54]]; [[Ezek. 16:61]]). On it, to bear their shame is to be ashamed of what they did, and they “will feel this shame when the Lord grants them lasting peace in their own land.”
    sources: [oshb-wlc, esv, nrsvue, lxx-rahlfs, keil-ezekiel, lds-scriptures]

  - ref: 29
    phrase: 'I have poured out my spirit upon the house of Israel'
    kind: scripture
    title: 'The spirit poured out'
    body: |
      The prophecies of restoration end with the gift the earlier chapters promised, said this time as a pouring. The Lord had said, “I will put my spirit within you” ([[Ezek. 36:27]]; see the note there), and to the dry bones, “And shall put my spirit in you, and ye shall live” ([[Ezek. 37:14]]). Here the spirit is poured out, the image Joel uses: “I will pour out my spirit upon all flesh” ([[Joel 2:28]]).

      The King James “for I have poured out” makes the gift the reason the Lord’s face is no longer hidden. Modern translations read “when I pour out my spirit.”

      This is the last sentence before the vision of the temple, which opens with a new date in the next verse of the book ([[Ezek. 40:1]]).
    sources: [lds-scriptures, esv, nrsvue]

christ: |
  The Lord’s last promise in the chapter is that He will not hide His face from Israel any more, “for I have poured out my spirit upon the house of Israel.” The Church’s footnote on “poured” points to Zechariah, where the outpouring comes as Jerusalem is delivered and those who receive it see the one they wounded: “I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced” ([[Zech. 12:10]]).

  Modern revelation tells of that meeting. The Jews ask the Lord about the wounds in His hands and feet, and He tells them who He is: “I am he who was lifted up. I am Jesus that was crucified. I am the Son of God” ([[D&C 45:52]]). This meeting has been set within the war Ezekiel describes: the delivered people “discover the wounds in His hands and feet” and realize who their Messiah is.

explore: |
  - The first half of the prophecy, Gog’s coming and the Lord’s answer: [[Ezek. 38]].
  - John’s use of the feast and of the names Gog and Magog: [[Rev. 19:17–21]] and [[Rev. 20:7–9]]; the later battle in modern revelation: [[D&C 88:111–116]].
  - The signs before the Lord’s coming that name Ezekiel: [[D&C 29:17–21]].
  - The spirit poured out and the pierced one seen: [[Zech. 12:10]] with [[D&C 45:48–53]].
  - How the exile profaned the Lord’s name and how the gathering sanctifies it: [[Ezek. 36:20–24]].
  - The warning to Moses that the Lord would hide His face: [[Deut. 31:16–18]].
  - What comes next: the vision of the temple, and the glory of the Lord coming back into the house: [[Ezek. 40:1–4]] and [[Ezek. 43:1–7]].

