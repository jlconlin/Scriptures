chapter: 7
title: Judge Not, Ask, and Build on the Rock
tagline: The Sermon on the Mount closes. Jesus warns against judging others while blind to oneself, promises that the Father gives to those who ask, sets two ways, two trees and two builders before His hearers, and leaves the crowd astonished at His authority.
when: 'In Galilee, at the close of the Sermon on the Mount'

setting: |
  Matthew 7 is the last part of the Sermon on the Mount, which began when Jesus saw the multitudes, went up into a mountain, and His disciples came to Him ([[Matt. 5:1]]). The chapter moves quickly: sayings on judging, on holy things, on asking and on how to treat others, then a run of contrasts that bring the sermon to its end. Its closing words, “when Jesus had ended these sayings” (verse 28), mark the end of the first of Matthew's five discourses, as like words close the others (see the setting of [[Matt. 5]]).

  Two other texts stand beside this chapter. The risen Lord gave a version of the same sermon to the people at the temple in Bountiful, and [[3 Ne. 14]] is its version of this chapter. And Joseph Smith, revising the sermon between March and April 1831, opened the chapter with “Now these are the words which Jesus taught his disciples that they should say unto the people,” so that several sayings become a charge to disciples about to call the world to repentance (see the notes on verses 1, 3, 6, 7 and 9). Luke has many of the same sayings in his Sermon on the Plain ([[Luke 6:37–49]]), which may be a separate sermon given on another occasion to a different audience.

thread: |
  **Seeing what really is, and then doing it.**

  The sayings of this chapter look like a string of separate teachings, but one concern runs through them: telling appearance from reality. The person who judges sees a speck in another's eye and misses the beam in their own (verses 3–5). The false prophet wears sheep's clothing (verse 15). A tree's fruit shows what it is (verses 16–20). Some who say “Lord, Lord” and work wonders in His name turn out to be people He never knew (verses 21–23). Two houses look alike on a fair day; only the storm shows which stood on rock (verses 24–27). The closing choice is between the way things appear to be and the way they really are, and discerning the difference runs through the whole sermon.

  The test the sermon gives in the end is not seeing alone but doing. The wise man and the foolish man both hear “these sayings of mine”; one does them (verses 24, 26). The Father gives to those who ask (verses 7–11), and the golden rule sums up what the law and the prophets asked of Israel (verse 12). The crowd heard all of this from one who spoke on His own authority (verse 29).

sections:
  - range: 1-6
    heading: Judging, and holy things
    plain: |
      Do not judge, so that you will not be judged. The standard you use to judge others is the standard you will be judged by, and the measure you use will be used on you. Why do you look at the speck in your brother's eye and pay no attention to the beam in your own eye? How can you say to your brother, “Let me take the speck out of your eye,” when there is a beam in your own? You hypocrite, first take the beam out of your own eye, and then you will see clearly enough to take the speck out of your brother's eye. Do not give what is holy to the dogs, or throw your pearls in front of pigs, or they will trample them underfoot and turn and tear you to pieces.
  - range: 7-12
    heading: Ask, seek, knock
    plain: |
      Ask, and it will be given you; seek, and you will find; knock, and the door will be opened to you. Everyone who asks receives, whoever seeks finds, and to whoever knocks the door will be opened. Which of you, if your son asks for bread, will give him a stone? Or if he asks for a fish, will give him a snake? If you, then, although you are wicked, know how to give good gifts to your children, how much more will your Father in heaven give good things to those who ask Him! So in everything, treat others as you would want them to treat you, for this is what the law and the prophets teach.
  - range: 13-14
    heading: The narrow gate
    plain: |
      Go in through the narrow gate. The gate is wide and the road is broad that leads to destruction, and many go in by it. But the gate is narrow and the road is narrow that leads to life, and few find it.
  - range: 15-23
    heading: Known by their fruits
    plain: |
      Watch out for false prophets, who come to you dressed as sheep but inside are ravenous wolves. You will recognize them by their fruit. Do people pick grapes from thornbushes, or figs from thistles? In the same way every good tree bears good fruit, and a rotten tree bears bad fruit. A good tree cannot bear bad fruit, and a rotten tree cannot bear good fruit. Every tree that does not bear good fruit is cut down and thrown into the fire. So you will recognize them by their fruit. Not everyone who says to me, “Lord, Lord,” will enter the kingdom of heaven, but only the one who does the will of my Father in heaven. On that day many will say to me, “Lord, Lord, did we not prophesy in your name, cast out devils in your name, and do many mighty works in your name?” And then I will tell them plainly, “I never knew you. Go away from me, you who practice lawlessness.”
  - range: 24-27
    heading: Two builders
    plain: |
      So everyone who hears these words of mine and does them is like a wise man who built his house on the rock. The rain came down, the floods rose, and the winds blew and beat against that house, and it did not fall, because its foundation was on the rock. And everyone who hears these words of mine and does not do them is like a foolish man who built his house on the sand. The rain came down, the floods rose, and the winds blew and beat against that house, and it fell, and great was its fall.
  - range: 28-29
    heading: Not as the scribes
    plain: |
      When Jesus had finished saying these things, the crowds were astonished at His teaching, because He taught them as one who had authority, and not as their scribes.

notes:
  - ref: 1
    phrase: Judge not, that ye be not judged
    kind: prophets
    title: Which judging is forbidden
    body: |
      “Judge not” cannot forbid every judgment, since a few verses later the same sermon tells its hearers to beware of false prophets and to know them by their fruits (verses 15–20). Joseph Smith's translation gives the line its edge: “Judge not unrighteously, that ye be not judged; but judge righteous judgment” (JST Matt. 7:2, in the footnote), the command Jesus gives in [[John 7:24]].

      Elder Dallin H. Oaks taught that there are two kinds of judging: “final judgments, which we are forbidden to make, and intermediate judgments, which we are directed to make, but upon righteous principles.” A person makes a final judgment whenever they declare that someone is bound for hell, or for heaven, because of a particular act. That belongs to the Lord, who will judge by a person's circumstances, motives and actions across a whole life; no mortal has that knowledge. Intermediate judgments, about what is right, whom to trust and what to do, are part of moral agency, and Jesus made them Himself, as when He rebuked the hypocrisy of the scribes and Pharisees.

      Verse 2 gives the reason for care: the measure a person uses comes back to them. Luke's telling of the same saying carries the measure both ways. There “judge not” is followed by “condemn not” and “forgive,” and then by a measure poured out generously, “good measure, pressed down, and shaken together, and running over” ([[Luke 6:37–38]]). Condemning belongs to a God who knows all things; the disciple is to act mercifully instead, forgiving even what seems plainly wrong. What Jesus appears to be teaching is that the Lord will treat people as they treat others: judgment for those who condemn and withhold forgiveness, mercy for those who give it. Forgiveness is thus the companion of the command not to judge. Alma taught his son to “deal justly, judge righteously, and do good continually” ([[Alma 41:14]]), “for that which ye do send out shall return unto you again” ([[Alma 41:15]]).
    sources: [jst-matt-7, oaks-judge-not, frederick-merciful, marlowe-golden-rule, lds-scriptures]
  - ref: 3
    phrase: the mote that is in thy brother’s eye
    kind: history
    title: Whom the beam was aimed at
    body: |
      The picture is meant to be absurd: a speck or splinter set beside a beam of the kind used to frame a house (the footnotes give both meanings of the Greek). The saying reaches everyone, but Joseph Smith's translation directs it at particular teachers. In it Jesus tells His disciples to put the question to particular teachers: “Beholdest thou the scribes, and the Pharisees, and the priests, and the Levites? They teach in their synagogues, but do not observe the law, nor the commandments,” and to say to them, “Ye hypocrites, first cast out the beam out of thine own eye” (JST Matt. 7:6–8).

      The priests in that list fit the saying well. Under the law of Moses priests served as judges in religious and civic matters, from village courts up to the Sanhedrin at Jerusalem, over which the chief priests presided, and an inscription from a first-century synagogue in Jerusalem shows a priestly family that built it for reading the law and teaching the commandments. Jesus may have seen their judgments of other people's religious lives as hypocrisy, given their own dealings with Rome, their power politics and their extravagant lives. No ancient manuscript of Matthew has these added lines, so they cannot be shown to be restored text; but they fit what is known of the first century, and it is reasonable to hold that they reflect Jesus's own view, even if Matthew did not record them in the sermon.

      Luke's sermon sets the saying in a sequence that seems to be about the same fault. Just before the speck and the beam comes “Can the blind lead the blind? shall they not both fall into the ditch?” ([[Luke 6:39]]). Like the man with the beam, the blind guide cannot see his own weaknesses, and he does harm because he believes he can do what he cannot. That saying does not condemn everyone who leads, only those who lack proper authority; the fault lies in failing to discern one's own state.
    sources: [jst-matt-7, grey-priests-levites, belnap-wise-man, lds-scriptures]
  - ref: 6
    phrase: Give not that which is holy unto the dogs
    kind: symbol
    title: Holy things, dogs and swine
    body: |
      The verse seems to sit oddly after “judge not,” since it requires deciding who the dogs and the swine are. Swine were the very type of uncleanness ([[Lev. 11:7]]), and dogs were scavengers often barred from Israel's sacred places.

      Joseph Smith's translation makes the verse instructions for missionaries. The disciples are to go into the world saying, “Repent, for the kingdom of heaven has come nigh unto you,” but “the mysteries of the kingdom ye shall keep within yourselves,” because “the world cannot receive that which ye, yourselves, are not able to bear” (JST Matt. 7:9–11). Read this way, the line concerns readiness, not contempt: sacred teaching is not to be pressed on people who are not prepared for it.

      A priestly background may sharpen the image. In the law, “the holy things” were the sacrificial meat eaten by the priests; dogs were kept from the temple precincts lest they eat it, and meat that had been torn by a beast was unfit for the holy meal. On one reading, not the only one, Jesus may have been turning a rule of priestly purity into a warning to priests who were compromising holy things with the Roman world and would themselves be torn by the loss of the temple at Gentile hands.
    sources: [jst-matt-7, grey-priests-levites, lds-scriptures]
  - ref: 7
    phrase: Ask, and it shall be given you
    kind: words
    title: Given by whom?
    body: |
      Jesus does not say who will give, or who will open: “it shall be given” and “it shall be opened” name no one. This construction is called the “divine passive,” and because the actor goes unnamed, a reader can recognize more than one at work: God the Father who gives, the Savior Himself, and the asker's own part in bringing the answer about. The three commands rise in intensity, ask, seek, knock, and the three promises rise with them.

      Joseph Smith's translation names the giver. The disciples are to tell the people, “Ask of God; ask, and it shall be given you” (JST Matt. 7:12). Nephi uses the same verbs for the reader who does not understand: “it will be because ye ask not, neither do ye knock” ([[2 Ne. 32:4]]).
    sources: [bowen-thy-will, jst-matt-7]
  - ref: 9
    phrase: whom if his son ask bread, will he give him a stone
    kind: scripture
    title: The son at his father’s door
    body: |
      Joseph Smith's translation supplies the question that the bread and the stone answer. Told to teach everyone, the disciples foresee the reply they will get: “We ourselves are righteous, and need not that any man should teach us. God, we know, heard Moses and some of the prophets; but us he will not hear,” and “We have the law for our salvation” (JST Matt. 7:14–15). Jesus answers with a homely picture: what father, when his son stands outside and says, “Father, open thy house that I may come in and sup with thee,” will not say, “Come in, my son; for mine is thine, and thine is mine?” (JST Matt. 7:17). Then come the bread and the stone, the fish and the serpent.

      So in Joseph Smith's translation the argument from the lesser to the greater in verse 11 answers people who said that God had heard Moses and some of the prophets but would not hear them. If fathers who are “evil” (in the Greek, “although you are wicked”) give their children good gifts, the Father in heaven will not turn away a child who asks.
    sources: [jst-matt-7, lefevre-jst-sermon, lds-scriptures]
  - ref: 12
    phrase: for this is the law and the prophets
    kind: history
    title: The golden rule, said positively
    body: |
      “The law and the prophets” was a two-part name for the whole of Hebrew scripture, so Jesus is saying that this one rule sums up what the scriptures asked of Israel. Coming after His word that He came not “to destroy the law, or the prophets” ([[Matt. 5:17]]), it shows that the basic principles of the law of Moses still stand.

      The rule itself was not new. Jewish writers before Jesus had stated it: the book of Tobit, “what you hate, do not do to anyone,” and the teacher Hillel, who called the same negative form the whole of the Torah. Jesus's form is positive. It does not stop at refraining from harm; it asks a person to consider how they would want to be treated and then to act that way toward others. And after His teaching to love enemies and turn the other cheek ([[Matt. 5:38–44]]), it is no longer an exchange of favors but comes close to God's own love.

      Matthew and Luke place the rule differently. In Luke it stands among the commands to love enemies and to lend “hoping for nothing again” ([[Luke 6:31–35]]), and in the verses after it Jesus carries the principle of treating others as one would be treated into a relation with God: whether or not others return mercy, God will. Matthew joins it with “Therefore” to the promise just before it, that the Father gives good things to those who ask (verses 7–11). That link may imply that living the rule is part of what fits a person to ask and receive.
    sources: [marlowe-golden-rule, frederick-merciful]
  - ref: 13
    phrase: Enter ye in at the strait gate
    kind: scripture
    title: The gate Nephi named
    body: |
      Nephi names the gate that Matthew's verse leaves unnamed (“strait” means narrow, not “straight”): “the gate by which ye should enter is repentance and baptism by water; and then cometh a remission of your sins by fire and by the Holy Ghost” ([[2 Ne. 31:17]]). Christ's own baptism showed “the straitness of the path, and the narrowness of the gate” ([[2 Ne. 31:9]]). Entering is the beginning, not the end: “then are ye in this strait and narrow path which leads to eternal life” ([[2 Ne. 31:18]]).
    sources: [lds-scriptures]
  - ref: 15
    phrase: which come to you in sheep’s clothing, but inwardly they are ravening wolves
    kind: symbol
    title: Wolves dressed as sheep
    body: |
      The danger in the image is the disguise: a false prophet looks like one of the flock. Some thirty years later Paul echoed the warning to the elders of Ephesus: “after my departing shall grievous wolves enter in among you, not sparing the flock” ([[Acts 20:29]]). The Book of Mormon gives examples of such people, who played on differences and tensions to hide their aims and scatter the flock, and the warning still holds, since such wolves can come from within the Church as well as from outside it.

      Because the fleece hides the wolf, Jesus gives a test that does not depend on appearance: fruit (verses 16–20). True prophets can be known by the goodness of their lives and their works and the sweetness of their doctrine. The false prophet looks like a disciple, and corrupt fruit may look like good, so telling the difference takes knowing what really is, not what seems to be.
    sources: [sc-knowhy-527, millet-fruits, belnap-wise-man]
  - ref: 21
    phrase: Not every one that saith unto me, Lord, Lord
    kind: scripture
    title: Saying the name is not enough
    body: |
      The people turned away here have prophesied, cast out devils and done many wonderful works in Jesus's name, which is why many readers find the passage hard. Yet He calls them workers of “iniquity,” a word the footnote renders “lawlessness”: their use of His name did not come with doing His Father's will. The words echo the Old Testament. “Depart from me, all ye workers of iniquity” is [[Ps. 6:8]], and in [[Hosea 8:1–2]] people who “have transgressed my covenant” still cry, “My God, we know thee.” The warning was likely aimed at people associated with the temple who had broken their covenants or were acting in God's name without right; Jesus treats their wonders as His name taken in vain.

      Luke's version of the warning has no scene at the judgment. It is a question put to the hearers then and there, “why call ye me, Lord, Lord, and do not the things which I say?” ([[Luke 6:46]]), and it leads straight into the two builders, as Matthew's warning does (verse 24). Discipleship “entails much more than saying the good word, even saying the good word to the Master.”
    sources: [sc-knowhy-205, millet-fruits, lds-scriptures]
  - ref: 23
    phrase: I never knew you
    kind: prophets
    title: Who did not know whom
    body: |
      Joseph Smith's translation turns the sentence around: “And then will I say, Ye never knew me” (JST Matt. 7:33, in the footnote). He made the same change in the parable of the ten virgins, where “I know you not” becomes “Ye know me not” ([[Matt. 25:12]], footnote). The failure, in both places, is theirs: the Lord was knowable, and they did not come to know Him.

      “Know” in scripture is often the language of covenant, as when the Lord tells Israel, “You only have I known of all the families of the earth” ([[Amos 3:2]]). Elder David A. Bednar named four steps by which a person comes to know the Lord, and not only about Him: exercising faith in Him, following Him, serving Him, and believing Him.
    sources: [lds-scriptures, bednar-known-me, sc-knowhy-205]
  - ref: 24
    phrase: which built his house upon a rock
    kind: christ
    title: Upon the rock
    body: |
      The Greek has “the rock” (as the footnote says), not “a rock,” which suggests that Jesus had a particular rock in mind. In the Psalms the rock is a title of the Lord, and latter-day scripture names the rock plainly. Helaman told his sons that “it is upon the rock of our Redeemer, who is Christ, the Son of God, that ye must build your foundation” ([[Hel. 5:12]]), and the Lord told Enoch, “I am Messiah, the King of Zion, the Rock of Heaven” ([[Moses 7:53]]). Jesus may have meant two things at once: a foundation on the Lord Jesus Christ, built through covenants made in the temple.

      The picture fit the land, where torrential rains and flash floods were common. The scenery of Galilee may have suggested it: in winter its streams rush down their beds, and when they dry in summer they leave a level stretch of sand that might tempt a builder who did not want to work the hard rock. On a fair day the two houses look alike, and the difference shows only when the storm comes. Luke's telling describes the wise man's labor: he “digged deep, and laid the foundation on a rock,” while the other built “without a foundation” “upon the earth” ([[Luke 6:48–49]]). Matthew's builder builds on the rock; Luke's digs down until he reaches it. Both builders heard; the difference was that one did what he heard.
    sources: [sc-knowhy-659, lds-scriptures, ellicott-matthew, belnap-wise-man]
  - ref: 29
    phrase: as one having authority, and not as the scribes
    kind: history
    title: Not as the scribes
    body: |
      The crowd was astonished because Jesus taught on His own word. Teachers of His day backed their statements by naming the earlier teachers they had them from; Jesus named no one and said, “I say unto you.” Joseph Smith's translation names the source of that authority: He taught as one having “authority from God, and not as having authority from the scribes” (JST Matt. 7:37, in the footnote). The scribes' authority rested on the tradition they had received; His rested on revelation.

      The Nephites who heard the sermon at the temple also wondered, but for another reason: some of them “understood not the saying that old things had passed away” ([[3 Ne. 15:2]]), and He answered them that the law was fulfilled in Him: “the law in me is fulfilled, for I have come to fulfil the law” ([[3 Ne. 15:5]]).
    sources: [hardison-sociocultural, triplet-hitoto-astonishment, lds-scriptures]

christ: |
  Matthew 7 ends by pointing to Jesus Christ Himself. The sermon's sayings are “these sayings of mine,” the one who speaks them is the one who will say “depart from me” “in that day,” and He speaks on His own authority from God. Helaman names the rock the wise man builds on: “the rock of our Redeemer, who is Christ, the Son of God” ([[Hel. 5:12]]). A disciple builds there by doing His sayings, not by hearing them only, and “a grand objective of mortality is not merely learning about the Only Begotten of the Father but also striving to know Him.”

explore: |
  - **The same sermon at Bountiful.** Read [[3 Ne. 14]] beside this chapter, and [[3 Ne. 15:1–10]] for what the Lord said next about the law.
  - **Joseph Smith's expansion.** The Joseph Smith Translation of Matthew 7 in the appendix, verses 1–17, with the disciples' questions and the son at the door.
  - **The gate and the path.** [[2 Ne. 31:9–21]].
  - **The other sermon.** Luke's Sermon on the Plain, [[Luke 6:31]] and [[Luke 6:37–49]].
  - Elder Dallin H. Oaks's article “‘Judge Not’ and Judging” (*Ensign*, August 1999) sets out the principles of righteous judgment at length.

