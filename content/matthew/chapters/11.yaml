chapter: 11
title: Art Thou He That Should Come?
tagline: John the Baptist sends from prison to ask whether Jesus is the one; Jesus answers with His works, honors John as the greatest of prophets, rebukes a generation and three towns that would not repent, thanks the Father for revealing truth to babes, and invites the weary to take His yoke.
when: 'While John the Baptist was in prison'

setting: |
  The first verse is a seam: “When Jesus had made an end of commanding his twelve disciples” closes the charge to the Twelve in chapter 10 with the formula that ends each of Matthew’s long discourses (compare [[Matt. 7:28]]). In this site’s division of the book, chapters 11 to 13 turn to the opposition Jesus meets and to the parables of the kingdom.

  John the Baptist has been in prison since [[Matt. 4:12]]; Matthew tells why in [[Matt. 14:3–4]]. The Gospels do not say where he was held, but the Jewish historian Josephus names Machaerus, a fortress on the eastern side of the Dead Sea. He had probably been there a year or more by now. John’s message may have been prompted by the news of Jesus raising the widow’s son at Nain ([[Luke 7:11–17]]), which Luke tells just before it.

  Luke has nearly all of this chapter, but in two places: John’s question and Jesus’s tribute to him in [[Luke 7:18–35]], and the woes on the Galilean towns and the thanksgiving to the Father when the Seventy are sent out and return ([[Luke 10:13–22]]). Matthew brings them together, and Luke’s account of the thanksgiving ends with the Son revealing the Father ([[Luke 10:22]]), without the invitation that closes this chapter, “Come unto me” (verses 28–30).

thread: |
  **Who receives the one who has come?**

  The chapter opens with a question from the best of men, John, and ends with an invitation to everyone. In between, Jesus sorts the answers people give Him. He answers John with deeds Isaiah had named as the Messiah’s signs and blesses whoever is not offended in Him (verses 2–6). He honors John as more than a prophet, the Elias who prepared His way (verses 7–15). Then He turns to the people who rejected John for being too stern and Himself for being too free, like children who will join in no game (verses 16–19), and to the towns that saw most of His mighty works and still did not repent (verses 20–24).

  Faced with that unbelief, Jesus prays. He thanks the Father that what the wise and prudent missed has been revealed to babes, and that the Son, whom men misunderstand, is known by the Father and makes the Father known (verses 25–27). The chapter does not end in judgment. It ends with the Son turning to the weary and the burdened and offering them rest under His own yoke (verses 28–30).

sections:
  - range: 1-6
    heading: John’s question from prison
    plain: |
      When Jesus had finished instructing His twelve disciples, He went on from there to teach and preach in their towns. John, in prison, heard about what Christ was doing, and he sent two of his disciples to ask Him, “Are you the one who was to come, or should we look for someone else?” Jesus answered them, “Go back and tell John what you hear and see: the blind see, the lame walk, lepers are made clean, the deaf hear, the dead are raised, and the poor have the good news preached to them. And blessed is anyone who does not stumble because of me.”
  - range: 7-19
    heading: More than a prophet
    plain: |
      As John’s disciples were leaving, Jesus began to speak to the crowds about John: “What did you go out into the wilderness to see? A reed blown about by the wind? Then what did you go out to see? A man dressed in fine clothes? Those who wear fine clothes live in kings’ palaces. Then what did you go out to see? A prophet? Yes, I tell you, and more than a prophet. This is the one of whom it is written: ‘I am sending my messenger ahead of you, who will prepare your way before you.’ Truly I tell you, no one born of a woman has been greater than John the Baptist; yet the one who is least in the kingdom of heaven is greater than he. From the days of John the Baptist until now the kingdom of heaven has suffered violence, and violent men try to seize it. All the prophets and the law prophesied until John. And if you are willing to accept it, he is the Elias who was to come. Whoever has ears, let him hear.

      “What can I compare this generation to? It is like children sitting in the marketplaces and calling to their playmates: ‘We played the flute for you, and you did not dance; we sang a lament, and you did not mourn.’ For John came neither eating nor drinking, and they say, ‘He has a devil.’ The Son of Man came eating and drinking, and they say, ‘Look at him, a glutton and a drunkard, a friend of tax collectors and sinners.’ But wisdom is proved right by her children.”
  - range: 20-24
    heading: Woe to the towns that did not repent
    plain: |
      Then Jesus began to reproach the towns where most of His mighty works had been done, because they had not repented. “Woe to you, Chorazin! Woe to you, Bethsaida! If the mighty works done in you had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes. But I tell you, it will be easier for Tyre and Sidon on the day of judgment than for you. And you, Capernaum, lifted up to heaven, will be brought down to the grave. If the mighty works done in you had been done in Sodom, it would still be standing today. But I tell you that it will be easier for the land of Sodom on the day of judgment than for you.”
  - range: 25-30
    heading: Revealed to babes; come unto me
    plain: |
      At that time Jesus said, “I praise you, Father, Lord of heaven and earth, because you have hidden these things from the wise and learned and revealed them to little children. Yes, Father, for this is what pleased you. My Father has given all things into my hands. No one knows the Son except the Father, and no one knows the Father except the Son and those to whom the Son chooses to reveal Him.

      “Come to me, all you who are weary and carry heavy burdens, and I will give you rest. Take my yoke upon you and learn from me, for I am gentle and humble in heart, and you will find rest for your souls. For my yoke is easy, and my burden is light.”

notes:
  - ref: 3
    phrase: Art thou he that should come, or do we look for another?
    kind: history
    title: Did John doubt?
    body: |
      John’s question may have been meant more for his disciples’ faith than for his own. It is a startling question from the man who had baptized Jesus and seen the Spirit descend on Him ([[Matt. 3:13–17]]). But John had already borne witness that Jesus was the Lamb of God and told his followers that he must decrease while Jesus increased ([[John 1:29]]; [[John 3:30]]). It appears that he had trouble persuading at least these two to leave him and follow Jesus. Sending them with the question put them in Jesus’s presence, where they saw His healings and heard His preaching, and they went back to John with a witness of their own.

      There may also have been something more human in it. Left in prison, John may have grown despondent and wondered whether the one he had announced had forgotten him. Even so, the message was “rather a reminder than a plain inquiry based on actual doubt,” and “partly, and perhaps largely, designed to confirm in those disciples an abiding faith in the Christ.” The verse does not say why John sent, and neither motive can be proved from it.
    sources: [benson-matthews-john-baptist, talmage-jesus-christ-18]
  - ref: 5
    phrase: the poor have the gospel preached to them
    kind: christ
    title: Signs Isaiah had named
    body: |
      Jesus answers John’s question without saying “yes,” by pointing to deeds the prophets had named as the marks of the Messiah. His list echoes Isaiah: “the eyes of the blind shall be opened, and the ears of the deaf shall be unstopped” ([[Isa. 35:5]]), and the anointed one sent “to preach good tidings unto the meek” ([[Isa. 61:1]]). The site’s notes at [[Isa. 35:5]] and [[Isa. 61:1]] take up those prophecies where they were first given. John had preached from Isaiah himself, and in prison he would likely have remembered that by these very tokens the Messiah was to be known.

      The blessing that follows (verse 6) speaks to what the answer leaves out. Many expected the Messiah to show His power by overthrowing Israel’s oppressors and restoring David’s throne in worldly splendor; measured by that hope, healing the sick and preaching to the poor looked like failure, and some grew impatient, then doubtful, then offended. “Misunderstanding is the prelude to offense.” The blessing is a gentle correction to anyone, John included, whose picture of the Messiah’s work was too small.
    sources: [lds-scriptures, talmage-jesus-christ-18]
  - ref: 7
    phrase: A reed shaken with the wind?
    kind: symbol
    title: No reed, no courtier
    body: |
      Jesus’s three questions to the crowd defend John by naming what he was not. The people who had streamed into the wilderness had not found a reed bending to every wind, but a man of unwavering testimony. Nor had they found a man in soft clothing: that kind lived at ease in the courts of kings, not in the wilderness, and not in the dungeon where John now lay. The contrast may glance at the Herodians, the faction that supported Herod’s dynasty, though that is a suggestion, not something the verse says. The point is plain enough without it: the man the crowds had gone out to see was a prophet, and the third question says so (verse 9).
    sources: [talmage-jesus-christ-18, benson-matthews-john-baptist]
  - ref: 11
    phrase: there hath not risen a greater than John the Baptist
    kind: prophets
    title: Why John was the greatest
    body: |
      John was the greatest of those born of women because of the mission he was given, not because of miracles, for he did none ([[John 10:41]]). Joseph Smith gave three reasons. First, John was trusted with “preparing the way before the face of the Lord,” a charge given to no one before or since; it is the mission of Malachi’s messenger, whom Jesus has just quoted in verse 10 (see the site’s note at [[Mal. 3:1]]). Second, he was given the privilege of baptizing the Son of Man. Third, he was at that time “the only legal administrator in the affairs of the kingdom” on the earth, “holding the keys of power.”

      That is also why he was “more than a prophet” (verse 9): he was himself the first fulfillment of Isaiah’s and Malachi’s prophecies of the one who would prepare the Lord’s way ([[Isa. 40:3]]).
    sources: [tpjs-2007-ch-6, benson-matthews-john-baptist]
  - ref: 11
    phrase: he that is least in the kingdom of heaven is greater than he
    kind: prophets
    title: Who is least in the kingdom?
    body: |
      Joseph Smith read “he that is least” as Jesus speaking of Himself. Jesus “was looked upon as having the least claim in God’s kingdom,” and seemed the least entitled to be believed as a prophet, “as though He had said—‘He that is considered the least among you is greater than John—that is I myself.’” The Gospel Library’s footnote gives the Greek as “he who is less important”; on Joseph Smith’s reading, the one counted less important was the Lord whose way John prepared.
    sources: [tpjs-2007-ch-6, lds-scriptures]
  - ref: 12
    phrase: the kingdom of heaven suffereth violence, and the violent take it by force
    kind: words
    title: Violence against the kingdom
    body: |
      This hard verse speaks of violence done to the kingdom by those who opposed it, a reading the Joseph Smith Translation supports. The Greek verb can be middle (“forces its way violently”) or passive. Read as passive, as the King James Version does, the kingdom suffers violence; the Gospel Library’s footnote renders the second half “violent men are seizing control of it, or plundering it.” The verse has also been read in a good sense, of eager crowds pressing into the kingdom like soldiers into a city, first to hear John and then Jesus.

      The Joseph Smith Translation adds a promise to the next verse: “But the days will come, when the violent shall have no power; for all the prophets and the law prophesied that it should be thus until John” (JST Matt. 11:13). The violent there are enemies whose power will end. From the days of John’s preaching the kingdom had been rejected with violence, and John himself sat in prison at the hands of a Herod, as that Herod’s father, Herod the Great, had once tried to destroy the infant Jesus.
    sources: [lds-scriptures, ellicott-matthew, jst-matt-11, talmage-jesus-christ-18, benson-matthews-john-baptist]
  - ref: 14
    phrase: this is Elias, which was for to come
    kind: scripture
    title: Which Elias?
    body: |
      Here “Elias” is a title for John as the forerunner, not the name of Elijah the prophet. Elias is the Greek form of Elijah, and in some verses it can only mean the ancient prophet: Elijah himself appears with Moses on the mount in [[Matt. 17:3]]. But the word is also a title for one sent ahead to prepare, and the Joseph Smith Translation makes that the sense here: “he was the Elias, who was for to come and prepare all things” (JST Matt. 11:15). The angel had promised before John’s birth that he would go before the Lord “in the spirit and power of Elias” ([[Luke 1:17]]).

      The revised passages show that two Eliases were spoken of anciently, a preparer and a restorer: John prepared the way, and Jesus was the Restorer. People in Jesus’s day knew something of this doctrine, as both the Jewish leaders and the disciples asked about it ([[Matt. 17:10]]; [[John 1:21]]), but the Bible as it stands says too little to make it clear; only revelation to Joseph Smith brings it into focus. Chapter 17 returns to the question ([[Matt. 17:10–13]]).
    sources: [bd-elias, jst-matt-11, talmage-jesus-christ-18, lds-scriptures]
  - ref: 19
    phrase: But wisdom is justified of her children
    kind: words
    title: Wisdom proved right by her children
    body: |
      “Justified” here means proved right, vindicated. True heavenly wisdom can be accused on one pretext or another, but it is shown to be right, in its sterner form in John and its joyful form in Jesus, by those who are truly her children, the people who seek it and receive it. The Gospel Library’s footnote gives another reading of the Greek, “by her deeds, works”: wisdom is proved right by what it does. Either way the sentence answers the slanders of verses 18–19: whether by the people who receive it or by what it does, wisdom is shown to be right, and John and Jesus need no other defense.
    sources: [ellicott-matthew, lds-scriptures]
  - ref: 21
    phrase: Woe unto thee, Chorazin! woe unto thee, Bethsaida!
    kind: history
    title: Towns that saw the mighty works
    body: |
      Chorazin and Bethsaida were towns north of the Sea of Galilee. Jesus did mighty works in Chorazin, but no record of them has been preserved; this rebuke is all the Gospels say of the town. The Bethsaida He denounced was probably the new city Philip the tetrarch had built as his capital and named Bethsaida-Julias, not the older fishing town that was home to Peter, Andrew and Philip.

      Tyre, by contrast, was an important commercial seaport of Syria, whose destruction the prophets had foretold ([[Ezek. 26:1–5]]), and Sidon is named with it. Jesus’s point is that they never saw what these Galilean towns saw. Had they seen it, they would have repented long ago in sackcloth and ashes (the footnote points to Job, who said, “I abhor myself, and repent in dust and ashes,” [[Job 42:6]]). The towns’ guilt is measured against what they had seen. The footnote on “tolerable” in verse 22 points to a latter-day revelation that uses the same word for those who never had the law: “they that knew no law shall have part in the first resurrection; and it shall be tolerable for them” ([[D&C 45:54]]).
    sources: [bd-chorazin, bd-bethsaida, bd-tyre, lds-scriptures]
  - ref: 23
    phrase: which art exalted unto heaven, shalt be brought down to hell
    kind: history
    title: Capernaum, exalted unto heaven
    body: |
      Capernaum was most likely “exalted unto heaven” by what it had seen rather than by its prosperity. It was Jesus’s home after His ministry began, “his own city” ([[Matt. 9:1]]; see [[Matt. 4:13]]), and many of His miracles were done there: the centurion’s servant, Peter’s wife’s mother, the man sick of the palsy ([[Matt. 8:5–15]]; [[Matt. 9:1–8]]).

      “Hell” here is *Hades*, the grave, not *Gehenna*. Capernaum will be brought down as low as it was raised high. Jesus then sets it beside Sodom, the city destroyed in Abraham’s day ([[Gen. 19:24–25]]), and says Sodom would still be standing if it had seen what Capernaum saw.
    sources: [bd-capernaum, ellicott-matthew]
  - ref: 25
    phrase: hast revealed them unto babes
    kind: scripture
    title: Hidden from the wise, revealed to babes
    body: |
      Jesus thanks the Father that a testimony of the truth has come to the humble and simple rather than to the learned and great. The Gospel Library’s footnote gives the Greek behind “babes” as “innocent people.” The prayer comes straight after the woes, as Jesus turns from the unbelief of the towns to His Father.

      The same footnote points to the Book of Mormon, which states the principle as a condition. The door is not closed on God’s side, for “whoso knocketh, to him will he open; and the wise, and the learned, and they that are rich, who are puffed up because of their learning, and their wisdom, and their riches—yea, they are they whom he despiseth” ([[2 Ne. 9:42]]). To them He will not open unless they “consider themselves fools before God, and come down in the depths of humility.”
    sources: [talmage-jesus-christ-18, lds-scriptures]
  - ref: 29
    phrase: Take my yoke upon you
    kind: symbol
    title: A yoke for two
    body: |
      A yoke was a wooden beam that joined a pair of oxen so that they could pull a load together, side by side. Jesus offers rest to people who “labour and are heavy laden” (verse 28) and in the same breath offers them a yoke, which sounds like more work.

      To His first hearers, Jesus was offering release from drudgery: from the nearly unbearable burden of religious exactions and traditions that had grown up around the law, to the freedom of truly spiritual worship. That freedom was not license; the gospel still asked for obedience, but its burden was light beside the one they carried. Read in the light of covenants, the yoke is shared: making and keeping sacred covenants yokes a disciple “to and with the Lord Jesus Christ,” who invites us to pull with Him “even though our best efforts are not equal to and cannot be compared with His.”
    sources: [bednar-bear-up-burdens, talmage-jesus-christ-18]
  - ref: 29
    phrase: for I am meek and lowly in heart
    kind: prophets
    title: Meek and lowly in heart
    body: |
      When Jesus describes Himself here, of all the qualities He might have named He chooses meekness. The footnote gives the Greek as “gentle and humble,” but meekness is not weakness. It is “distinguished by righteous responsiveness, willing submissiveness, and strong self-restraint”; it is strong, active and courageous, and one of its marks is a readiness to learn, from the Holy Ghost and from people who may seem less capable. “Learn of me” and “I am meek” stand together in the verse, and the same pattern returns in a revelation to Joseph Smith: “Learn of me, and listen to my words; walk in the meekness of my Spirit, and you shall have peace in me” ([[D&C 19:23]]).

      Mormon makes meekness the foundation of the other spiritual gifts: “none is acceptable before God, save the meek and lowly in heart” ([[Moro. 7:44]]).
    sources: [bednar-meek, lds-scriptures]

christ: |
  Matthew 11 answers John’s question, “Art thou he that should come?”, with a portrait of Jesus Christ: the one whose works Isaiah foretold, the Lord whose way John prepared, the Son known by the Father who reveals the Father to whomever He will, and the meek and lowly Master who calls the weary to Himself. As disciples are yoked with Him through sacred covenants and receive the enabling power of His Atonement, they come to seek His will, and their burdens grow lighter because they no longer carry them alone.

explore: |
  - **Isaiah’s signs.** [[Isa. 35:3–6]] and [[Isa. 61:1–3]], the prophecies behind Jesus’s answer to John; Luke’s account of the same scene, [[Luke 7:18–35]].
  - **John as Elias.** JST Matt. 11:13–15 in the appendix, and [[Matt. 17:10–13]], where Jesus returns to the question.
  - **The woes and the prayer in Luke.** [[Luke 10:13–24]], where they come with the sending of the Seventy.
  - **Burdens made light.** [[Mosiah 24:13–15]], where the Lord eased the burdens of Alma’s people; Elder David A. Bednar reads it beside verses 28–30 in his general conference talk “Bear Up Their Burdens with Ease” (April 2014).

