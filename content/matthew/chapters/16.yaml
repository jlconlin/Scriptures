chapter: 16
title: Thou Art the Christ
tagline: Jesus refuses the sign-seekers and warns against their teaching; at Caesarea Philippi Peter confesses Him as the Christ, the Son of the living God, and is promised the keys; then Jesus foretells His death and calls every disciple to take up the cross.
when: 'Some six months before the crucifixion, by the Bible Dictionary’s reckoning'

setting: |
  Matthew 16 opens beside the Sea of Galilee, where Jesus had landed in “the coasts of Magdala” after the feeding of the four thousand ([[Matt. 15:32–39]]), and ends far to the north near the foot of Mount Hermon. The movements of these weeks take Jesus away from the populous towns that had heard Him most and had largely rejected Him, and the journey north gave Him time to teach the Twelve privately. The Transfiguration came about a week after Peter was promised the keys at Caesarea Philippi, in about October, some six months before Jesus’s death.

  Mark tells the same three episodes ([[Mark 8:11–38]]; [[Mark 9:1]]), and Luke the confession and what follows ([[Luke 9:18–27]]). Only Matthew has Peter’s fuller confession, Jesus’s blessing on him, the rock and the keys, and only Matthew among the Gospels uses the word “church” (here and in [[Matt. 18:17]]). The keys promised in verse 19 are given on the mount in the next chapter ([[Matt. 17:1–9]]).

thread: |
  **Peter learns by revelation who Jesus is, and then must learn what the Christ has come to do.**

  The chapter begins with men who will not believe without a sign from heaven and ends with disciples who must carry a cross. The Pharisees and Sadducees read the sky but not the times (verses 1–4), and even the disciples hear a warning about doctrine as a remark about bread (verses 5–12). At Caesarea Philippi Peter answers what the crowds could not: Jesus is the Christ, the Son of the living God, and Peter knows it not from flesh and blood but from the Father (verses 13–17). On that revelation the Church will be built, and Peter is promised the keys (verses 18–19).

  From that time Jesus taught the Twelve more plainly of His appointed death (verse 21), and the confession meets its test. Peter, just named the rock, tries to turn Jesus from suffering and becomes a stone in the path (verses 22–23). Jesus answers with the cost for anyone who follows Him: deny himself, take up his cross, and lose his life to find it (verses 24–26). The Son of Man who goes to the cross will come in His Father’s glory (verses 27–28).

sections:
  - range: 1-4
    heading: A sign from heaven refused
    plain: |
      The Pharisees came with the Sadducees to test Jesus, and asked Him to show them a sign from heaven. He answered, “In the evening you say, ‘Fair weather tomorrow, for the sky is red.’ And in the morning, ‘Stormy today, for the sky is red and threatening.’ You hypocrites! You know how to read the face of the sky, but you cannot read the signs of the times? An evil and unfaithful generation looks for a sign, and no sign will be given it except the sign of the prophet Jonah.” And He left them and went away.
  - range: 5-12
    heading: The leaven of the Pharisees and Sadducees
    plain: |
      When the disciples crossed to the other side, they had forgotten to bring bread. Jesus said to them, “Watch out, and beware of the leaven of the Pharisees and Sadducees.” They talked it over among themselves and said, “It is because we brought no bread.” Jesus knew it and said, “You of little faith, why are you discussing among yourselves that you have no bread? Do you still not understand? Don’t you remember the five loaves for the five thousand, and how many baskets you gathered? Or the seven loaves for the four thousand, and how many baskets you gathered? How is it you do not understand that I was not talking to you about bread? Beware of the leaven of the Pharisees and Sadducees.” Then they understood that He was not telling them to beware of the leaven in bread, but of the teaching of the Pharisees and Sadducees.
  - range: 13-20
    heading: Peter’s confession at Caesarea Philippi
    plain: |
      When Jesus came into the district of Caesarea Philippi, He asked His disciples, “Who do people say that I, the Son of Man, am?” They said, “Some say John the Baptist; some, Elijah; and others, Jeremiah or one of the prophets.” He said to them, “But who do you say that I am?” Simon Peter answered, “You are the Christ, the Son of the living God.” Jesus said to him, “Blessed are you, Simon son of Jonah, for no mortal revealed this to you, but my Father in heaven. And I tell you that you are Peter, and on this rock I will build my church, and the gates of hell will not overpower it. I will give you the keys of the kingdom of heaven: whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven.” Then He ordered the disciples to tell no one that He was Jesus the Christ.
  - range: 21-23
    heading: His death foretold, and Peter rebuked
    plain: |
      From that time on Jesus began to show His disciples that He must go to Jerusalem, suffer many things from the elders, chief priests and scribes, be killed, and be raised again on the third day. Peter took Him aside and began to rebuke Him: “God forbid, Lord! This will never happen to you.” But Jesus turned and said to Peter, “Get behind me, Satan! You are a stumbling block to me, for your mind is not on the things of God but on the things of men.”
  - range: 24-28
    heading: Taking up the cross
    plain: |
      Then Jesus said to His disciples, “If anyone wants to come after me, let him deny himself, take up his cross, and follow me. For whoever wants to save his life will lose it, and whoever loses his life for my sake will find it. What good will it do someone to gain the whole world and lose his own soul? Or what can anyone give in exchange for his soul? For the Son of Man will come in His Father’s glory with His angels, and then He will reward each person according to what he has done. Truly I tell you, some standing here will not taste death before they see the Son of Man coming in His kingdom.”

notes:
  - ref: 1
    phrase: tempting desired him that he would shew them a sign from heaven
    kind: history
    title: Rivals joined to demand a sign
    body: |
      The demand for a sign came from two parties that seldom agreed. The Pharisees and the Sadducees were “usually unfriendly rivals,” and the Sadducees appear nowhere else in Jesus’s ministry in Galilee. That they joined forces shows how determined the religious authorities had become to find some ground against Him. Matthew says they came “tempting”: the Greek verb means to test or put to the proof, and the request was a snare that had been laid before ([[Matt. 12:38]]).

      What they asked for was a sign “from heaven.” The healings and feedings had been done on earth, and His opponents had already explained such works away as the power of Beelzebub ([[Matt. 12:24]]). They wanted something that could not be explained away: thunder from a clear sky like Samuel’s ([[1 Sam. 12:18]]), or fire from heaven like Elijah’s ([[1 Kgs. 18:38]]).
    sources: [talmage-jesus-christ-22, ellicott-matthew, strongs-greek]
  - ref: 3
    phrase: ye can discern the face of the sky; but can ye not discern the signs of the times
    kind: symbol
    title: Reading the sky, missing the times
    body: |
      Jesus answers with weather lore His hearers lived by. A clear red sky at evening promised a fair morning; a red sky in the morning with a “lowring,” frowning look promised a storm. Men who could forecast tomorrow’s weather from the clouds could not see what was happening in front of them.

      The English hides part of the answer. “Sky” in verses 2–3 is the Greek *ouranos*, the word translated “heaven” in verse 1, so the point is close to this: you asked for a sign from heaven, and you read the face of heaven well enough already. Eyes open to the signs of the spiritual sky would have found tokens enough of what God was doing. The reply exposed the hypocrisy of the request.
    sources: [ellicott-matthew, talmage-jesus-christ-22, greek-nt]
  - ref: 4
    phrase: the sign of the prophet Jonas
    kind: scripture
    title: An adulterous generation, and the sign of Jonah
    body: |
      “Adulterous” and “the sign of the prophet Jonas” repeat, almost word for word, Jesus’s answer when the same demand was made earlier ([[Matt. 12:39–40]]), and the notes there explain both: the prophets’ picture of Israel’s unfaithfulness to God as adultery, and Jonah’s three days in the fish as a figure of the Son of Man’s three days “in the heart of the earth.” The sign this generation would get was His death and His rising from it.

      What is new this time is what Jesus leaves out. He explains nothing: “he left them, and departed.”
    sources: [lds-scriptures]
  - ref: 6
    phrase: beware of the leaven of the Pharisees and of the Sadducees
    kind: symbol
    title: The leaven of the Pharisees and Sadducees
    body: |
      Leaven, a lump of old, fermenting dough worked into new dough to make it rise, is as a rule a symbol of sin in the New Testament, probably because it was associated with corruption (see the note on [[Matt. 13:33]], where Jesus for once turns the image to good). Verse 12 says what Jesus meant by it here: the “doctrine,” or teaching, of the Pharisees and Sadducees.

      The two parties did not teach the same things. Jesus elsewhere names the Pharisees’ leaven as “hypocrisy” ([[Luke 12:1]]): a life outwardly religious, even earnest, but wanting the humility and love that make it holy. The Sadducees denied the resurrection ([[Matt. 22:23]]), and their leaven was probably a more open worldliness that went with that denial; the text does not define it. Mark’s account names “the leaven of Herod” in place of the Sadducees ([[Mark 8:15]]), and the two warnings come to the same thing, since Herod Antipas himself seems to have held Sadducean beliefs.

      The disciples heard “leaven” and thought of the bread they had forgotten. Jesus called them men “of little faith” for worrying about bread, and reminded them of the two feedings and the baskets left over, so that a lack of loaves would not trouble them again. The danger was a teaching that works its way through the whole, not an empty basket.
    sources: [bd-leaven, ellicott-matthew, talmage-jesus-christ-22]
  - ref: 13
    phrase: the coasts of Cæsarea Philippi
    kind: history
    title: Caesarea Philippi
    body: |
      Caesarea Philippi lay near the source of the Jordan at the foot of Mount Hermon, the northernmost point Jesus is known to have reached. “Coasts” in the King James Bible means borders or a neighborhood, not a seashore: Jesus was in the district around the town. Philip the tetrarch, a son of Herod the Great, had enlarged and beautified it and named it Caesarea for the Roman emperor; his own name set it apart from the Caesarea on the Mediterranean coast. It had long been a place of idolatrous worship. Under Greek rule it was called Paneas, after the god Pan, a name that survives in the Arabic Banias.

      Jesus seems to have come here not to preach but for retirement, and perhaps for safety, away from the towns that had rejected Him. The journey gave Him time with the Twelve alone, and it is there, away from the crowds, that He asks them who they say He is.
    sources: [bd-caesarea-philippi, talmage-jesus-christ-22, ellicott-matthew]
  - ref: 14
    phrase: 'Some say that thou art John the Baptist: some, Elias; and others, Jeremias'
    kind: history
    title: John, Elijah, Jeremiah
    body: |
      The disciples report what people were saying, and none of it was that Jesus was the Messiah. Some, sharing the guilty fear of Herod Antipas, said He was John the Baptist risen from the dead ([[Matt. 14:2]]), though few could have believed that seriously, since the two had been seen at work at the same time. Others said Elias, that is, Elijah, or Jeremias, Jeremiah, or one of the other ancient prophets. Jesus did not fit the popular picture of the Deliverer and King of Israel, and the Pharisees worked to keep the people thinking of a Messiah still to come rather than one already present.

      Each answer named a prophet who had already left this life. One Latter-day Saint reading sees in this, probably unwitting on the disciples’ part, a frame for what follows: Jesus is about to speak of the gates of Hades, the realm of the dead, and to promise keys that reach beyond this life into heaven (see the notes on verses 18 and 19).
    sources: [talmage-jesus-christ-22, brown-peters-keys]
  - ref: 17
    phrase: flesh and blood hath not revealed it unto thee, but my Father which is in heaven
    kind: christ
    title: Known by revelation
    body: |
      Peter’s answer is fuller in Matthew than in the other Gospels. Mark has “Thou art the Christ” ([[Mark 8:29]]) and Luke “The Christ of God” ([[Luke 9:20]]); Matthew adds “the Son of the living God.” Peter knows not only that Jesus is God’s anointed servant but that He is God’s own Son. And where Mark and Luke go straight to the command to tell no one, Matthew first gives Jesus’s word on where Peter’s testimony came from.

      “Flesh and blood” is a Semitic way of saying mortal man. Peter had not reached his answer by reasoning or by weighing evidence; the Father revealed it. The disciples had called Jesus the Son of God before, when He came to them on the water ([[Matt. 14:33]]), but this confession was greater in assurance and kind. Even so, it did not yet hold a full understanding of His mission, as verse 22 shows at once.

      Latter-day revelation describes the same gift, given now beyond the apostles: “To some it is given by the Holy Ghost to know that Jesus Christ is the Son of God, and that he was crucified for the sins of the world. To others it is given to believe on their words” ([[D&C 46:13–14]]).
    sources: [griffin-matthew-portrayal, brown-peters-keys, talmage-jesus-christ-22]
  - ref: 18
    phrase: upon this rock I will build my church
    kind: prophets
    title: What rock?
    body: |
      The rock on which Christ builds His Church is revelation. Joseph Smith taught it in a sermon of January 1843: he quoted the verse, asked “what rock,” and answered, “Revelation.” The other side of the same truth is that the true cornerstone of the Church is “the Christ, the Son of God, which Peter had just confessed.” The two answers meet in this scene, because what the Father revealed to Peter was who Jesus is. By revelation alone can the Church be built and kept, and revelation in turn means revelators through whom God makes His will known.

      The play on words is real. Jesus had given Simon the name Cephas, “which is by interpretation, A stone” ([[John 1:42]]), and the Joseph Smith Translation of that verse renders the name “seer” as well as “stone.” The Aramaic word *kēphā* lies behind both “Peter” and “rock”; the Greek turns it into *Petros*, the name, and *petra*, bedrock. On one Latter-day Saint reading, the wordplay does not make Peter himself the bedrock but ties him to it: Jesus was ascribing a potential bedrock strength to His chief apostle, a man open to revelation, and Peter had still to grow into the name.
    sources: [jsp-discourse-1843-01-22, bd-peter, talmage-jesus-christ-22, brown-peters-keys, bowen-founded-rock]
  - ref: 18
    phrase: the gates of hell shall not prevail against it
    kind: christ
    title: The gates of hell
    body: |
      “Hell” here is the Greek *hadēs*, which in the New Testament is the temporary abode where the spirits of the dead await the resurrection and the judgment. Gates keep people in, and gates need keys. On this reading the gates of Hades would “prevail” not by attacking the Church but by holding its members inside the spirit prison, away from the saving power of the Atonement.

      The risen Christ says He has “the keys of hell and of death” ([[Rev. 1:18]]). Because He holds them, death cannot keep those who belong to Him. On the same reading, the same Lord holds both sets of keys, those that let the departed out of Hades and those that open God’s kingdom, and it is the second set He promises Peter in the next verse.
    sources: [brown-peters-keys]
  - ref: 19
    phrase: I will give unto thee the keys of the kingdom of heaven
    kind: scripture
    title: The keys, and binding and loosing
    body: |
      The one Old Testament man given a key is Eliakim, the king’s steward, of whom the Lord said, “the key of the house of David will I lay upon his shoulder; so he shall open, and none shall shut” ([[Isa. 22:22]]; the note there explains the steward’s key). The risen Christ claims that key as His own ([[Rev. 3:7]]). As Eliakim controlled who entered the king’s house, the keys of the kingdom of heaven control entry into God’s kingdom, whose earthly form is the Church. The promise carries divine authority in the priesthood and the right to preside, and after the Ascension Peter did preside: he spoke for the Eleven when Judas’s successor was chosen, spoke for his brethren at Pentecost, and opened the Church to the Gentiles.

      “Bind” and “loose” were familiar terms. In rabbinic law they meant to forbid and to permit under the law of Moses; Jesus gives them a far wider reach, since what Peter binds on earth “shall be bound in heaven.” The binding and loosing in heaven are done not by Peter but by the Father, who ratifies in heaven what His authorized servant does on earth. Nor is the power Peter’s alone; Jesus later says the same words to the Twelve ([[Matt. 18:18]]).

      “I will give” is a promise. About a week later, on the mount of transfiguration, the Savior, Moses and Elijah gave the promised keys to Peter, James and John ([[Matt. 17:1–9]]), and in a similar event in the Kirtland Temple in 1836, Moses, Elias and Elijah conferred keys on Joseph Smith ([[D&C 110]]).
    sources: [brown-peters-keys, talmage-jesus-christ-22, bd-transfiguration]
  - ref: 20
    phrase: tell no man that he was Jesus the Christ
    kind: history
    title: Why tell no man?
    body: |
      The apostles now knew who Jesus was, but the time to proclaim it would not come until after the Resurrection. Latter-day Saint teaching gives two reasons. An open claim to be the Messiah, by Him or by His closest followers, would have sharpened the rulers’ hostility, already a menace to His ministry, and could easily have stirred up a revolt against Rome among a people who expected a political deliverer (see the note on verse 14). And there was mercy in the delay: a nation not prepared to receive Him was less guilty for passing Him by without sure knowledge than it would have been for rejecting Him outright.

      What the apostles were to proclaim, in time, was the crucified and risen Christ, and in the next verse Jesus begins to tell them of His death.
    sources: [talmage-jesus-christ-22]
  - ref: 23
    phrase: 'Get thee behind me, Satan: thou art an offence unto me'
    kind: words
    title: An adversary and a stumbling stone
    body: |
      Jesus is not calling Peter the devil. The word “Satan” in both Hebrew and Greek means an adversary, one who stands in another’s way and opposes him, and Jesus uses it as a forceful figure of speech. Peter was urging what the devil had urged in the wilderness: to turn aside from sacrifice and suffering, though they were the world’s ransom, and to take an easier way. So Jesus answers him much as He answered the tempter then ([[Matt. 4:10]]). Peter saw as men see, and did not yet understand the deeper purposes of God.

      “Offence” is the Greek *skandalon*: first the trigger-stick of a trap, then any obstacle in the way that makes someone stumble or fall. The word turns the blessing of a few verses before on its head. The man Jesus had named Peter, “the rock,” was now a stone in the path.
    sources: [talmage-jesus-christ-22, thayer]
  - ref: 24
    phrase: take up his cross
    kind: symbol
    title: Taking up the cross
    body: |
      Jesus’s hearers knew what a cross meant. Crucifixion was a very real part of their world, and the saying was more than the abstract metaphor it can be for modern readers. Jesus often used the image to invite discipleship ([[Matt. 10:38]]), and here it follows directly on His first plain word about His own death. “Deny himself” translates a strong Greek verb, *aparneomai*, which suggests breaking every tie that binds a person, even to himself. Becoming a disciple meant giving up everything, even one’s own will, as Jesus submitted His to the Father’s.
    sources: [strathearn-crucifixion]
  - ref: 25
    phrase: whosoever will save his life shall lose it
    kind: words
    title: 'Life and soul: one word'
    body: |
      Verses 25 and 26 turn on one Greek word, *psychē*, which the King James Version renders “life” in verse 25 and “soul” in verse 26. In paired sayings like verse 25, built to stay in the hearer’s mind, the word is best taken in one half as the life lived on earth and in the other as the blessed life of God’s eternal kingdom. Read with a single English word throughout, the argument is plain: to cling to life here is to lose the life that lasts, and nothing, not even the whole world, can buy it back.

      The Joseph Smith Translation spells out the two halves: “whosoever will save his life in this world, shall lose it in the world to come,” and whoever loses his life in this world for Christ’s sake “shall find it in the world to come.” It also adds “Break not my commandments for to save your lives” and “forsake the world, and save your souls” (JST Matt. 16:27–29). Read after verse 22, the saying also answers Peter, who had just urged Jesus to save His life at the cost of duty: a life saved that way is lost in a sense worse than physical death.
    sources: [thayer, greek-nt, jst-matt-16, talmage-jesus-christ-22]
  - ref: 28
    phrase: There be some standing here, which shall not taste of death
    kind: scripture
    title: Some standing here
    body: |
      This promise has drawn much comment, because the coming it speaks of, the Son of Man in His Father’s glory with the angels (verse 27), has not yet happened. In Latter-day Saint teaching that coming is still future, and at least a partial fulfillment of the promise is John the apostle, who was standing there and who, at his own desire, still lives in the flesh. Latter-day revelation records the Lord’s words to him: “because thou desirest this thou shalt tarry until I come in my glory” ([[D&C 7:3]]; compare [[John 21:20–23]] and the three Nephite disciples in [[3 Ne. 28:1–9]]).
    sources: [talmage-jesus-christ-22, lds-scriptures]

christ: |
  Matthew 16 shows Jesus Christ as the Son of the living God, known only by revelation, who goes to Jerusalem to suffer, be killed and be raised the third day. The Church He builds rests on the revelation of who He is, and the One who builds it holds “the keys of hell and of death” ([[Rev. 1:18]]). A witness that Jesus is the Christ still comes as Peter’s did, from the Father and not from flesh and blood. And the cross a disciple takes up is the one the Joseph Smith Translation names: to “deny himself all ungodliness, and every worldly lust, and keep my commandments.”

explore: |
  - **The other tellings.** [[Mark 8:11–38]] and [[Mark 9:1]]; [[Luke 9:18–27]].
  - **The keys, promised and given.** [[Isa. 22:22]] and [[Rev. 3:7]]; [[Matt. 17:1–9]]; [[Matt. 18:18]]; [[D&C 110]].
  - **The name.** [[John 1:42]], where Simon is first called Cephas.
  - **The sign of Jonah.** [[Matt. 12:38–41]] and [[Jonah 1:17]].
  - The Religious Studies Center essay “Peter’s Keys,” in *The Ministry of Peter, the Chief Apostle* (2014), follows the keys, the gates of Hades, and binding and loosing through scripture.

