chapter: 3
title: Prepare Ye the Way of the Lord
tagline: John the Baptist calls Judea to repentance and baptism, warns that descent from Abraham saves no one, and baptizes Jesus, over whom the heavens open.
when: 'The opening of John’s ministry, which Luke dates to “the fifteenth year of the reign of Tiberius Caesar” ([[Luke 3:1]])'

setting: |
  Matthew 2 ended with the child Jesus brought to Nazareth. Chapter 3 opens “in those days” with a grown man preaching in the wilderness. The King James text says nothing of the years between; the Joseph Smith Translation's lines on them are taken up in the note on [[Matt. 2:23]]. Luke supplies the year, the fifteenth of Tiberius ([[Luke 3:1–2]]), and the age, about thirty ([[Luke 3:23]]).

  The preacher is John, a man of priestly descent who taught neither in the synagogues nor in the temple courts, and drew crowds out of Jerusalem and the countryside to the Jordan. In Matthew's order, John's preaching and Jesus's baptism lead straight into the temptation in the wilderness (chapter 4) and then the Sermon on the Mount (chapters 5–7).

  All four Gospels tell of John’s preaching and of the baptism of Jesus ([[Mark 1:1–11]]; [[Luke 3:1–22]]; [[John 1:15–34]]). Only Matthew has the exchange in which John tries to refuse. The Joseph Smith Translation of this chapter is much fuller than the King James text at verses 8–9, 11–12 and 15–17, and several of its readings answer questions taken up in the notes below.

thread: |
  The chapter is about **preparing the way**, and it ends with the One the way was prepared for.

  John's preparation is demanding. He calls Judea to repent because the kingdom of heaven is within reach, and people come out from Jerusalem and the countryside to be baptized, confessing their sins (verses 1–6). When the leaders of the people come, he will not let them rest on their descent from Abraham: what God wants is fruit, and the axe is already at the root (verses 7–10). Then he points beyond himself. His baptism in water is only the beginning; a mightier One is coming who will baptize with the Holy Ghost and with fire, and who will separate the wheat from the chaff (verses 11–12).

  Then the Mightier One comes, and He comes to be baptized. John protests that it should be the other way round. Jesus answers that this is how “all righteousness” is fulfilled, and the One who needed no repentance goes down into the water with the rest (verses 13–15). The answer comes from heaven. The Spirit descends in the sign of the dove and the Father's voice names His Son, so that the Father, the Son and the Holy Ghost are each made known at once, and distinctly (verses 16–17).

sections:
  - range: 1-6
    heading: A voice in the wilderness
    plain: |
      In those days John the Baptist appeared, preaching in the wilderness of Judea. “Repent,” he said, “for the kingdom of heaven is near.” He is the one Isaiah the prophet spoke of: “A voice calling out in the wilderness: Prepare the way for the Lord; make His paths straight.” John wore a garment of camel's hair with a leather belt around his waist, and he ate locusts and wild honey. People went out to him from Jerusalem, from all Judea, and from all the country around the Jordan, and he baptized them in the river as they confessed their sins.
  - range: 7-12
    heading: Fruit worthy of repentance
    plain: |
      When John saw many Pharisees and Sadducees coming to where he was baptizing, he said to them: “You brood of snakes! Who warned you to run from the judgment that is coming? Then show by what you do that you have repented. And don't tell yourselves, ‘Abraham is our father.’ I tell you, God can raise up children for Abraham out of these stones. The axe is already lying at the root of the trees, and every tree that doesn't produce good fruit will be cut down and thrown into the fire. I baptize you with water for repentance. But the One who comes after me is mightier than I am; I am not worthy even to carry His shoes. He will baptize you with the Holy Ghost and with fire. His winnowing fan is in His hand. He will clear His threshing floor, gather His wheat into the barn, and burn the chaff with a fire that cannot be put out.”
  - range: 13-17
    heading: The baptism of Jesus
    plain: |
      Then Jesus came from Galilee to the Jordan to be baptized by John. John tried to stop Him: “I need to be baptized by You, and You come to me?” Jesus answered, “Let it be so now, for this is the fitting way for us to fulfill all righteousness.” Then John agreed. As soon as Jesus was baptized He came up out of the water, and the heavens were opened. He saw the Spirit of God coming down like a dove and resting on Him. And a voice from heaven said, “This is my beloved Son, in whom I am well pleased.”

notes:
  - ref: 1
    phrase: John the Baptist
    kind: history
    title: Who John the Baptist was
    body: |
      John's title describes what he did: the Greek calls him “the Baptizer,” literally “the one immersing.” He was born to priests: both Zacharias and Elisabeth were of Aaron's line, and through them he inherited the right to act in the Aaronic Priesthood. Latter-day revelation adds that he was “ordained by the angel of God at the time he was eight days old unto this power,” for the very work this chapter shows him doing: “to make straight the way of the Lord before the face of his people” ([[D&C 84:28]]).

      For Latter-day Saints John is more than a figure in the Gospels. Joseph Smith taught that John “held the Aaronic Priesthood, and was a legal administrator, and the forerunner of Christ.” On 15 May 1829 an angel who said “that his name was John, the same that is called John the Baptist in the New Testament,” laid his hands on Joseph Smith and Oliver Cowdery and conferred that same priesthood, with the keys “of baptism by immersion for the remission of sins” ([[JS—H 1:68–72]]; [[D&C 13:1]]). The man who baptized Jesus in the Jordan restored the authority to baptize in this dispensation.

      The Restoration also gives John a title: he was an *Elias*, a forerunner. In this use, John prepared the way, and Jesus was the Restorer who followed him and brought back the gospel and the Melchizedek Priesthood.
    sources: [larsen-baptism-nt, lds-scriptures, tpjs-2007-ch-6, bd-elias]
  - ref: 2
    phrase: the kingdom of heaven is at hand
    kind: words
    title: The kingdom of heaven at hand
    body: |
      “The kingdom of heaven” is Matthew's usual phrase, and in this verse it means the Church: “the true church on the earth,” which “is the path to heaven and is the kingdom of heaven on earth.” Seen from the other side, the Church exists “to prepare its members to live forever in the celestial kingdom.”

      What, then, does “at hand” mean? Joseph Smith took up exactly this question. Some argued that the kingdom could not have been set up in John's day, since John only said it was coming. Joseph answered: “I would ask if it could be any nearer to them than to be in the hands of John.” The kingdom was where God's word and authority were, and John had both. “Whenever men can find out the will of God and find an administrator legally authorized from God, there is the kingdom of God.” Read that way, John is not announcing something far off. He is telling Judea that the kingdom has come out to the river, and that they can enter it by repentance and baptism.
    sources: [bd-kingdom-of-heaven, gs-kingdom-of-god, tpjs-2007-ch-6]
  - ref: 3
    phrase: The voice of one crying in the wilderness, Prepare ye the way of the Lord, make his paths straight
    kind: scripture
    title: The voice in the wilderness
    body: |
      Matthew quotes [[Isa. 40:3]]. Spoken to Israel in Isaiah, the voice announced that Jehovah's triumphant return was near and that His glory was about to be revealed ([[Isa. 40:5]]); the road through the desert was for the Lord Himself. (The site's Isaiah 40 note explains how the verse can be punctuated, and why the Gospels attach “in the wilderness” to the voice.)

      Matthew applies the verse without hedging: “this is he that was spoken of.” John is Isaiah's voice. Mark, quoting the same verse, makes the second move as well: he casts Jesus in the role of Jehovah, so that it is Jesus's path that must be made straight, because He is the Lord whose arrival is near ([[Mark 1:2–3]]). Joseph Smith taught the same of John: he was the forerunner of Christ, and came to prepare the way before Him.
    sources: [frederick-use-of-ot, tpjs-2007-ch-6]
  - ref: 4
    phrase: raiment of camel’s hair, and a leathern girdle about his loins
    kind: symbol
    title: Dressed like Elijah
    body: |
      John's rough clothing marked him as a prophet in Elijah's mold. Elijah was remembered as “an hairy man, and girt with a girdle of leather about his loins” ([[2 Kgs. 1:8]]), and in time a rough garment had come to be thought of as the mark of a prophet; Zechariah could even speak of false prophets who wore “a rough garment to deceive” ([[Zech. 13:4]]).

      The Gospel itself carries the likeness further. Jesus later says of John, “this is Elias, which was for to come” ([[Matt. 11:14]]), and the disciples understand that the Elias who “is come already” was John the Baptist ([[Matt. 17:12–13]]); see the note on verse 1 for the sense of *Elias* as forerunner.

      His food was as plain as his clothing. Locusts were clean under the law ([[Lev. 11:22]]) and were eaten by the poor, and wild honey was found in hollow trees and rocks. It was food that needed no skill to gather, the fare of the poorest wanderer in the wilderness.
    sources: [talmage-jesus-christ-10, ellicott-matthew]
  - ref: 6
    phrase: were baptized of him in Jordan, confessing their sins
    kind: history
    title: What John’s baptism was
    body: |
      Many readers suppose that baptism began with John. Latter-day Saints believe otherwise: baptism “was not a new rite introduced by John the Baptist,” but part of God's plan “from the very beginning.” The Book of Moses tells of Adam being “carried down into the water, and … laid under the water, and … brought forth out of the water,” and of the Spirit descending upon him ([[Moses 6:64–65]]).

      John's hearers did know other washings. Jews of the time purified themselves with water, often by immersion, and many scholars have looked to these washings, to the baptism of Gentile converts, and to the baths of the Essenes for the roots of John's practice. The differences are what matter for this verse. Those washings were repeated whenever a person needed to be made ceremonially clean; John's baptism was done once, for repentance and forgiveness, to prepare Israel for its Lord. And those who washed immersed themselves, while John baptized people himself, as one who held authority.
    sources: [larsen-baptism-nt]
  - ref: 7
    phrase: the Pharisees and Sadducees come to his baptism
    kind: history
    title: Pharisees and Sadducees at the river
    body: |
      The two groups John singles out were religious parties of his day, and opponents of each other. The Pharisees, whose name means “separatists,” prided themselves on strict observance of the law and held their oral tradition to be as binding as the written law. The Sadducees were a small, powerful party of old high-priestly families, the Jewish aristocracy, who held to the letter of the law of Moses and denied the authority of tradition.

      Matthew says they came “to his baptism,” not that they were baptized. Of the Pharisees, at least, Luke says plainly that “the Pharisees and lawyers rejected the counsel of God against themselves, being not baptized of him” ([[Luke 7:30]]). The Joseph Smith Translation puts a question in John's mouth that fits: “Why is it that ye receive not the preaching of him whom God hath sent?” Later in the same translation, Pharisees ask Jesus, “Why will ye not receive us with our baptism, seeing we keep the whole law?” and He refuses them (JST Matt. 9:18–20).

      “Generation of vipers” is a brood of snakes; Jesus uses the same words of the scribes and Pharisees near the end of His ministry ([[Matt. 23:33]]). In Matthew the rebuke is addressed to the Pharisees and Sadducees who came, as the verse says; Luke gives the same words to the multitude ([[Luke 3:7]]).
    sources: [bd-pharisees, bd-sadducees, lds-scriptures, jst-matt-3, jst-matt-9, ellicott-matthew]
  - ref: 9
    phrase: We have Abraham to our father
    kind: scripture
    title: Children of Abraham
    body: |
      John is answering a confidence, widely held, that Abraham's descendants had an assured place in the Messiah's kingdom, a place no Gentile convert could equal. The Joseph Smith Translation states the boast more fully: “We are the children of Abraham, and we only have power to bring seed unto our father Abraham.”

      John's answer is that God does not depend on them. He can make children for Abraham out of the stones of the riverbank, which is to say that God can make a covenant people of those who are not of Israel. What counts is fruit (verses 8 and 10), not lineage.
    sources: [talmage-jesus-christ-10, jst-matt-3]
  - ref: 11
    phrase: he shall baptize you with the Holy Ghost, and with fire
    kind: prophets
    title: With the Holy Ghost, and with fire
    body: |
      John distinguishes his baptism from the one the coming One will give. The Joseph Smith Translation makes the relation between them explicit: “I indeed baptize you before he cometh, that when he cometh he may baptize you with the Holy Ghost and fire.” It also glosses John's humility: “whose shoes I am not worthy to bear, (or whose place I am not able to fill).” John's baptism was a preparation, never the whole.

      That is how the Restoration understands it. The angel John who restored the Aaronic Priesthood told Joseph Smith and Oliver Cowdery that it “had not the power of laying on hands for the gift of the Holy Ghost,” which would come later ([[JS—H 1:70]]). Joseph Smith taught that “the baptism of water, without the baptism of fire and the Holy Ghost attending it, is of no use; they are necessarily and inseparably connected,” and more bluntly that “baptism by water is but half a baptism.” Nephi names what the fire does: after “repentance and baptism by water,” “then cometh a remission of your sins by fire and by the Holy Ghost” ([[2 Ne. 31:17]]).
    sources: [jst-matt-3, tpjs-2007-ch-6, tpjs-2007-ch-7, lds-scriptures]
  - ref: 12
    phrase: Whose fan is in his hand, and he will throughly purge his floor
    kind: symbol
    title: The axe, the fan and the floor
    body: |
      John's warnings use two farm images, and both say that the time for half measures is over. Trees standing for people and nations were familiar from the prophets ([[Isa. 5:1–7]]). Pruning a branch is a partial, corrective judgment; an axe laid at the root (verse 10) means the tree will either be kept or cut down.

      The “fan” is a winnowing fan. On the hard threshing floor it drove a strong current of air through the threshed sheaves, leaving the wheat in the middle while the chaff was driven to the edges, to be swept up and burned. The image was an old one ([[Ps. 1:4]]); what John adds is that the coming One, the Christ, does the winnowing Himself. The Joseph Smith Translation adds a note of timing to the last line: He will burn the chaff “in the fullness of his own time.”
    sources: [ellicott-matthew, jst-matt-3]
  - ref: 14
    phrase: I have need to be baptized of thee, and comest thou to me?
    kind: history
    title: I have need to be baptized of thee
    body: |
      Only Matthew records John's protest. John had been baptizing people for the remission of their sins, and when Jesus came he recognized a man without sin, who had nothing to repent of; so he could see no reason to baptize Him. The one who had heard the confessions of multitudes now confesses that he is the one in need.

      A reader who knows John's Gospel will ask how this fits John's words there, “I knew him not” ([[John 1:31–33]]). Elder James E. Talmage's answer is that John, as it appears, knew Jesus's holiness before he knew He was the Messiah. The sign appointed to make the Messiah known to John was the Spirit descending and remaining on Him ([[John 1:33]]), and in Matthew's account the Spirit descends after the baptism (verse 16).
    sources: [talmage-jesus-christ-10]
  - ref: 15
    phrase: for thus it becometh us to fulfil all righteousness
    kind: christ
    title: To fulfil all righteousness
    body: |
      Nephi asked why the sinless Son of God would be baptized, and answered: “Know ye not that he was holy? But notwithstanding he being holy, he showeth unto the children of men that, according to the flesh he humbleth himself before the Father, and witnesseth unto the Father that he would be obedient unto him in keeping his commandments” ([[2 Ne. 31:6–7]]). Baptism is not only for the remission of sins. It is an ordinance required of everyone for entering God's kingdom, and Jesus, needing no forgiveness, still entered by the gate He would ask others to enter ([[2 Ne. 31:9–10]]).

      Joseph Smith added two points. Jesus “fulfilled all righteousness in becoming obedient to the law which He had given to Moses,” and so honored the law rather than setting it aside. And He submitted to John's authority: “no man could have better authority to administer than John; and our Savior submitted to that authority Himself.” The Joseph Smith Translation makes the request plain, “Suffer me to be baptized of thee,” and adds the act Matthew assumes: “John went down into the water and baptized him.”
    sources: [lds-scriptures, tpjs-2007-ch-6, talmage-jesus-christ-10, jst-matt-3]
  - ref: 16
    phrase: he saw the Spirit of God descending like a dove
    kind: prophets
    title: The sign of the dove
    body: |
      The Spirit came “like a dove,” and Joseph Smith was careful about what that means: “The Holy Ghost is a personage, and is in the form of a personage. … The Holy Ghost cannot be transformed into a dove; but the sign of a dove was given to John to signify the truth of the deed.” He called it a sign “instituted before the creation of the world, a witness for the Holy Ghost,” in which “the devil cannot come.” The dove is the Spirit's sign, not His body.

      Matthew's “he saw” could be read of Jesus alone. The Joseph Smith Translation says that “John saw, and lo, the heavens were opened unto him, and he saw the Spirit of God descending like a dove and lighting upon Jesus.” That fits the purpose of the sign: it was given to John, as the appointed witness by which he would know the Messiah ([[John 1:33]]; see the note on verse 14).
    sources: [tpjs-2007-ch-6, lds-scriptures, jst-matt-3]
  - ref: 17
    phrase: This is my beloved Son, in whom I am well pleased
    kind: christ
    title: This is my beloved Son
    body: |
      Mark and Luke give the Father's words as spoken to Jesus: “Thou art my beloved Son” ([[Mark 1:11]]; [[Luke 3:22]]). Matthew gives them as spoken about Him: “This is my beloved Son.” Elder James E. Talmage took the small difference as a mark of independent witnesses rather than copied accounts. One Latter-day Saint reading finds meaning in Matthew's form as well. All three Gospels appear to allude to the royal psalm “Thou art my Son” ([[Ps. 2:7]]), and at a king's investiture words were addressed both to the king and to the people who would honor him; on this reading Mark and Luke record the words to the Son, and Matthew the announcement to those who stood by the river.

      The Joseph Smith Translation adds that John “heard a voice from heaven” and ends the declaration with “Hear ye him,” the words the Father speaks again on the mount of transfiguration ([[Matt. 17:5]]). The same voice introduced the risen Christ to the Nephites: “Behold my Beloved Son, in whom I am well pleased, in whom I have glorified my name—hear ye him” ([[3 Ne. 11:7]]); and to Joseph Smith in the grove ([[JS—H 1:17]]).
    sources: [talmage-jesus-christ-10, sc-knowhy-655, jst-matt-3, lds-scriptures]

christ: |
  The whole chapter turns toward Jesus. John's voice prepares His way, John's water baptism looks to the baptism of the Holy Ghost and fire that only Jesus can give, and when Jesus Himself steps into the Jordan, the Father and the Holy Ghost bear witness to Him. The holy One who needed no forgiveness was baptized anyway, to show the way and to obey His Father.

  Nephi drew the conclusion for every disciple: “if the Lamb of God, he being holy, should have need to be baptized by water, to fulfil all righteousness, O then, how much more need have we, being unholy” ([[2 Ne. 31:5]]). A disciple enters by the same gate Jesus entered, and is told, “Follow thou me” ([[2 Ne. 31:10]]). And the water is never the whole of it. In Joseph Smith's words, the baptism of water and the baptism of fire and the Holy Ghost are “necessarily and inseparably connected,” and it is by fire and by the Holy Ghost that a remission of sins comes ([[2 Ne. 31:17]]).

explore: |
  - **Nephi on the baptism of Jesus.** [[2 Ne. 31]] is a commentary on verses 13–17.
  - **John and the Restoration.** [[JS—H 1:68–72]] and [[D&C 13]], with [[D&C 84:26–28]] on John's ordination.
  - **John's own witness.** [[John 1:19–34]], and Lehi's prophecy of John in [[1 Ne. 10:7–10]].
  - **What Jesus said of John.** [[Matt. 11:7–15]] and [[Matt. 17:10–13]].

