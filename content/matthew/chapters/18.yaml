chapter: 18
title: The Little Ones and the Brother
tagline: Asked who is greatest, Jesus sets a child among His disciples, warns them against causing His little ones to stumble, tells of the shepherd who seeks one lost sheep, lays down how to win back a brother who sins, gives the Twelve the power to bind and loose, and answers Peter’s question about forgiveness with the parable of the unmerciful servant.
when: 'In the house at Capernaum, “at the same time” as the question of the temple tax in Matthew 17'

setting: |
  Matthew 18 is the fourth of Matthew’s five long discourses (see the setting of [[Matt. 5]]), the one often called the Church Administration discourse, and like the others it closes with a formula: “when Jesus had finished these sayings” ([[Matt. 19:1]]). It is spoken to the disciples (verse 1) in the house at Capernaum, “at the same time” as Peter’s encounter with the collector of the temple tax that ends [[Matt. 17]].

  Matthew is the only Gospel that uses the word *church* for the community of believers, in [[Matt. 16:18]] and here in verse 17, and this chapter is about how that community lives: who ranks highest in it, how it treats its weakest members, what it does with a member who sins and will not hear, and how often one brother forgives another. The Joseph Smith Translation sharpens that concern. By making the offending hand, foot and eye of verses 8–9 members of a disciple’s own household, who may have to be cut off, it shows a Church that exists not only to administer the ordinances but to see that those within it live by the standard Christ set (see the note on verse 9).

  Mark and Luke tell the opening scene, the dispute over who is greatest and the child set in the midst ([[Mark 9:33–50]]; [[Luke 9:46–50]]). The rest of the chapter is Matthew’s alone, though Luke tells the parable of the lost sheep on another occasion ([[Luke 15:1–7]]).

thread: |
  **The greatest in the kingdom is measured by how the least are treated.**

  The disciples ask who is greatest, and Jesus answers by setting a child among them. The way into the kingdom is to turn and become humble as that child; and from there the discourse becomes a charge about “these little ones” (verses 6, 10, 14), children and the childlike who believe. Whoever makes one of them stumble would be better drowned; their angels stand before the Father; and the Father does not will that one of them perish. The lost sheep, told here about them, puts the saving of the lost at the center of Christ’s mission.

  The second half turns from the little one to the brother (verses 15, 21, 35). A brother who sins is to be sought out privately, then with witnesses, and only then brought before the church, which holds the keys to bind and to loose. When Peter asks how often he must forgive, the answer is beyond counting, and the parable of the two debtors shows why: a servant forgiven a debt he could never pay has no right to refuse mercy over a fellowservant’s small one.

sections:
  - range: 1-5
    heading: Who is the greatest?
    plain: |
      At that time the disciples came to Jesus and asked, “Who is the greatest in the kingdom of heaven?” Jesus called a little child to Him and stood the child among them. “I tell you the truth,” He said, “unless you turn around and become like little children, you will never enter the kingdom of heaven. Whoever makes himself humble like this little child is the greatest in the kingdom of heaven. And whoever welcomes one such little child in My name welcomes Me.”
  - range: 6-10
    heading: The little ones
    plain: |
      “But whoever causes one of these little ones who believe in Me to stumble, it would be better for him to have a great millstone hung around his neck and to be drowned in the depths of the sea. Woe to the world because of the things that make people stumble! Such things must come, but woe to the person through whom they come. If your hand or your foot causes you to stumble, cut it off and throw it away; it is better to enter life crippled or lame than to have two hands or two feet and be thrown into everlasting fire. And if your eye causes you to stumble, tear it out and throw it away; it is better to enter life with one eye than to have two eyes and be thrown into the fire of hell. See that you do not look down on one of these little ones, for I tell you that their angels in heaven always see the face of My Father in heaven.”
  - range: 11-14
    heading: The lost sheep
    plain: |
      “For the Son of Man has come to save what was lost. What do you think? If a man has a hundred sheep and one of them wanders away, will he not leave the ninety-nine, go into the hills, and look for the one that strayed? And if he finds it, I tell you the truth, he is happier over that one sheep than over the ninety-nine that did not wander off. In the same way, your Father in heaven does not want a single one of these little ones to be lost.”
  - range: 15-20
    heading: The brother who sins
    plain: |
      “If your brother wrongs you, go and show him his fault privately, just between the two of you. If he listens to you, you have won your brother back. But if he will not listen, take one or two others with you, so that every word may be confirmed by two or three witnesses. If he refuses to listen to them, tell it to the church; and if he refuses to listen even to the church, treat him as you would a Gentile or a tax collector. I tell you the truth: whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven. Again I tell you, if two of you on earth agree about anything you ask, My Father in heaven will do it for you. For where two or three are gathered together in My name, I am there among them.”
  - range: 21-35
    heading: Seventy times seven, and the unmerciful servant
    plain: |
      Then Peter came to Him and asked, “Lord, how many times shall my brother sin against me and I forgive him? Up to seven times?” Jesus answered, “I do not say to you seven times, but seventy times seven. That is why the kingdom of heaven is like a king who wanted to settle accounts with his servants. As he began, a man was brought to him who owed ten thousand talents. Since he could not pay, his master ordered that he be sold, with his wife and children and all he had, to pay the debt. The servant fell down before him and begged, ‘Master, be patient with me, and I will pay you everything.’ His master was moved with compassion, released him, and forgave him the debt. But when that servant went out, he found one of his fellow servants who owed him a hundred pence. He seized him by the throat and said, ‘Pay what you owe me!’ His fellow servant fell at his feet and begged, ‘Be patient with me, and I will pay you everything.’ But he refused; he had him thrown into prison until he could pay the debt. When the other servants saw what had happened, they were deeply distressed, and they went and told their master everything. Then the master called him in. ‘You wicked servant,’ he said, ‘I forgave you that whole debt because you begged me to. Shouldn’t you have had compassion on your fellow servant, just as I had pity on you?’ In anger his master handed him over to the jailers to be punished until he paid back all he owed. That is how My heavenly Father will treat each of you unless you forgive your brother from your heart.”

notes:
  - ref: 1
    phrase: Who is the greatest in the kingdom of heaven?
    kind: history
    title: A question that began as a quarrel
    body: |
      Matthew has the disciples bring the question to Jesus openly; Mark and Luke show where it came from. They had been disputing among themselves which of them should be greatest ([[Luke 9:46]]); Mark adds that the dispute was on the way, and that when Jesus asked them in the house at Capernaum what they had been arguing about, they said nothing ([[Mark 9:33–34]]). Matthew leaves the contention out. The two pictures need not conflict: Jesus’s question to them may in the end have brought out theirs to Him.

      The quarrel explains the answer. The Twelve knew by now that Jesus was the Christ, but their minds were still colored by the common expectation of a Messiah who would be a temporal king as well as a spiritual Lord. His recent words seemed to point to a crisis near at hand, and they had begun to think about their places in the coming kingdom and the offices each of them wanted. Ambition had already bred jealousy among them. Jesus answers by calling a child.
    sources: [korth-reed-little-children, talmage-jesus-christ-24]
  - ref: 3
    phrase: Except ye be converted
    kind: words
    title: Turned around
    body: |
      “Be converted” translates a Greek verb that means to turn, to turn around (*strephō*). Jesus is speaking to men already convinced that He is the Christ, and telling them they must turn around, reverse course, and become like little children, or they will not enter the kingdom at all. The saying is Matthew’s alone.

      Even the apostles needed conversion. On the question they had been arguing, their hearts were turned, at least in part, away from God and His kingdom. They had asked who would rank highest in the kingdom; the answer is that without this turning they would not be in it.
    sources: [thayer, korth-reed-little-children, talmage-jesus-christ-24]
  - ref: 4
    phrase: humble himself as this little child
    kind: scripture
    title: Childlike, not childish
    body: |
      Verse 4 names the quality that makes the child the pattern: humility. Other marks of a child go with it. Jesus did not want His apostles childish; they had to be men of courage, fortitude and force. He wanted them childlike, like little children “in obedience, truthfulness, trustfulness, purity, humility, and faith.” Paul draws the same line: “be not children in understanding: howbeit in malice be ye children” ([[1 Cor. 14:20]]). In Jesus’s teaching, the humility, poverty and dependence of small children seem bound up with righteousness itself.

      The dependence is the key. A little child relies on a caregiver for life itself, and entering the kingdom depends in the same way on relying on the atoning blood of Christ. King Benjamin, in the passage the footnote to verse 3 gives, says how the change is made: a person “putteth off the natural man and becometh a saint through the atonement of Christ the Lord, and becometh as a child, submissive, meek, humble, patient, full of love” ([[Mosiah 3:19]]). That answers the disciples’ question. Whatever there is like rank in the kingdom goes by humility, and there “the humblest shall be greatest.”
    sources: [talmage-jesus-christ-24, korth-reed-little-children, lds-scriptures]
  - ref: 6
    phrase: a millstone were hanged about his neck
    kind: history
    title: The donkey’s millstone
    body: |
      The millstone is not the small handmill a woman turned at home ([[Luke 17:35]]) but the great stone of a mill turned by a donkey; Matthew’s Greek calls it a *mylos onikos*, a donkey’s millstone. Drowning with such a stone was no punishment of the law of Moses, but Greeks used it on occasion, and the emperor Augustus had inflicted it for crimes of special infamy. Its chief horror, for Jews and Gentiles alike, was probably that it left the body without burial.

      Jesus’s point is the comparison. To “offend” is to cause to stumble (the footnote gives the Greek sense), and whoever causes one of these little ones to stumble or go astray incurs guilt so great that it would have been better for him to die by violence before he did it. “These little ones which believe in me” are children, and children as types of every true believer; the two are held together through the whole lesson.
    sources: [thayer, ellicott-matthew, talmage-jesus-christ-24]
  - ref: 9
    phrase: if thine eye offend thee, pluck it out
    kind: scripture
    title: A hand that is a friend
    body: |
      Cutting off a hand or plucking out an eye repeats a lesson of the Sermon on the Mount: root out the evil passions that would bring a person under condemnation, whatever it costs. There the Joseph Smith Translation calls it “a parable concerning your sins” (JST Matt. 5:34; see the note at [[Matt. 5:29]]).

      Here, in a discourse about the community of disciples, the translation makes the hand, foot and eye people. It adds, “And a man’s hand is his friend, and his foot, also; and a man’s eye, are they of his own household” (JST Matt. 18:9, in the footnotes). Its version of Mark’s account is plainer still: “if thy brother offend thee and confess not and forsake not, he shall be cut off,” and “he that is thy standard, by whom thou walkest, if he become a transgressor, he shall be cut off” (JST Mark 9:40, 42). So read, cutting off means excommunication, severance from the body of Christ, which was sometimes necessary to keep the Church pure.
    sources: [talmage-jesus-christ-24, lds-scriptures, millet-js-matthew]
  - ref: 10
    phrase: their angels do always behold the face of my Father
    kind: history
    title: Their angels
    body: |
      Jesus grounds His warning not to despise the little ones in heaven itself. The words take for granted that angels are given charge of particular people. One reading goes further: those who watch over the little ones are among the noblest of the heavenly host, angels of the Presence like Gabriel, who said that he stood “in the presence of God” ([[Luke 1:19]]). Jesus spoke of their angels at a time when the Sadducees, a leading party of the day, denied that angels existed at all ([[Acts 23:8]]).

      The warning is for children of tender years and for childlike believers of every age. Those whom the disciples might overlook as least are, in heaven, represented before the face of the Father.
    sources: [ellicott-matthew, lds-scriptures, talmage-jesus-christ-24]
  - ref: 11
    phrase: For the Son of man is come to save that which was lost
    kind: scripture
    title: Little ones who need no repentance
    body: |
      Verse 11 is missing from many of the best Greek manuscripts. The Joseph Smith Translation keeps it and finishes it: “For the Son of man is come to save that which was lost, and to call sinners to repentance; but these little ones have no need of repentance, and I will save them” (JST Matt. 18:11).

      The addition answers a question the verse raises in a chapter about children: if the Son of Man came for the lost, where do little children stand? The translation’s answer is that they have no need of repentance, and He will save them. That agrees with what the Book of Mormon and the revelations teach about accountability, as in the Lord’s word to Joseph Smith that “little children are redeemed from the foundation of the world through mine Only Begotten” ([[D&C 29:46]]; see also [[Moro. 8]]).
    sources: [ellicott-matthew, jst-matt-18, millet-js-matthew]
  - ref: 12
    phrase: doth he not leave the ninety and nine
    kind: symbol
    title: The shepherd and the little ones
    body: |
      In Matthew the parable of the lost sheep is told to the disciples, about the little ones. Luke gives a later telling to the Pharisees and scribes who murmured that Jesus received sinners ([[Luke 15:1–7]]). Here it is framed by the little ones on both sides: the warning not to despise them (verse 10) and the conclusion that it is not the Father’s will “that one of these little ones should perish” (verse 14).

      The analogy puts the saving purpose of Christ’s mission at the center. He came to save those who are lost for a time and who without Him would be lost forever. The ninety and nine are safe, and the shepherd has a steady joy in them; but when the one is brought back he feels a new happiness, brighter and stronger for the grief that went before.
    sources: [talmage-jesus-christ-24]
  - ref: 15
    phrase: go and tell him his fault between thee and him alone
    kind: history
    title: The injured one goes first
    body: |
      Jesus reverses the usual order: the one who was wronged makes the first move. The rabbis’ rule was that the offender must make the first approach. Jesus told the injured brother not to wait, but to go himself and try to settle the matter, since by doing so he might save his brother’s soul. The aim the verse names is not to be proved right but “thou hast gained thy brother.”

      Only if a private word fails do one or two others go along, so that “in the mouth of two or three witnesses” every word is established, the rule of the law of Moses ([[Deut. 19:15]]). Their presence also guards against misrepresentation later. Only after that does the church hear the matter; severe measures come after every gentler means has failed. The restored Church was given a similar order: a member who will not confess is delivered up to the church “not to the members, but to the elders,” in a meeting held “not before the world” ([[D&C 42:89]]).
    sources: [talmage-jesus-christ-24, lds-scriptures]
  - ref: 17
    phrase: as an heathen man and a publican
    kind: words
    title: As a heathen and a publican
    body: |
      To be “as an heathen man and a publican” is to be out of fellowship. A brother who will not hear even the church is deprived of fellowship and stands toward his former associates as one outside the community. In that state he is a fit subject for missionary work, but until he repents and is willing to make amends he has no claim to the privileges of communion in the Church, since continued association with an unrepentant sinner can spread his disaffection. His own choice is in it too: by persisting in sin against the judgment of the church, the offender has in effect put himself outside it.

      The verse is not a license for contempt. Jesus can hardly have held up the Pharisees’ treatment of Gentiles and tax collectors as a pattern. Those put outside were to know that they no longer stood within the circle of the brotherhood; but they were still men, and owed courtesy and every kindness.
    sources: [talmage-jesus-christ-24, ellicott-matthew]
  - ref: 18
    phrase: Whatsoever ye shall bind on earth shall be bound in heaven
    kind: scripture
    title: The keys held by the Twelve
    body: |
      What Jesus promised Peter at Caesarea Philippi ([[Matt. 16:19]]; the note there explains binding and loosing) He now says to the Twelve together. “The disciples” of this chapter (verse 1) are here, as verse 18 implies, the Twelve, and the keys come to be held jointly among them. The promise confirms their authority, as a body, to govern the Church. A revelation of January 1841 says the same of the Twelve in this dispensation: they “hold the keys to open up the authority of my kingdom upon the four corners of the earth” ([[D&C 124:128]]).

      Verses 19 and 20 add a promise about unity. Through unity of purpose and sincerity the Twelve would have power with God: where two agree in what they ask, the Father will do it, and where two or three are gathered in His name, He is in their midst. The Lord repeated that promise in a latter-day revelation, “as I said unto my disciples” ([[D&C 6:32]]).
    sources: [brown-peters-keys, talmage-jesus-christ-24, lds-scriptures]
  - ref: 22
    phrase: Until seventy times seven
    kind: words
    title: Seventy times seven
    body: |
      Peter probably thought seven a generous number; the rabbis prescribed forgiving three times only. Jesus’s answer does away with the count. The Greek *hebdomēkontakis hepta* can be read as seventy times seven or as seventy-seven, and either way it means countless times. The Savior was not setting an upper limit of 490; He was telling Peter not even to count.

      The number has a history. The Greek word for “seventy times” is the one the Greek Old Testament uses where Lamech boasts, “If Cain shall be avenged sevenfold, truly Lamech seventy and sevenfold” ([[Gen. 4:24]]). On one reading, if seven and seventy-seven stand there for vengeance without end, Jesus makes them the measure of perfect forgiveness. Seven itself had come to mean completeness in Hebrew culture, so to forgive seventy times seven is to forgive completely and entirely.
    sources: [talmage-jesus-christ-24, thayer, bowen-jewish-hermeneutics, ball-peters-witness, robbins-seventy-times-seven]
  - ref: 24
    phrase: which owed him ten thousand talents
    kind: symbol
    title: Ten thousand talents and a hundred pence
    body: |
      The two debts are meant to be out of all proportion. Ten thousand talents is a sum chosen to put the debtor beyond any possibility of paying. The man may be pictured as a high official, one of the king’s ministers charged with the royal revenues, who is still a “servant” because under an absolute king everyone is. The order to sell him with his wife and children assumes a law that allowed debt slavery.

      A hundred pence was about three months’ wages for a poor laborer. The parable does not say which talent is meant, and the exact amounts matter less than the contrast; scholars differ on the values, but if the hundred pence were a hundred dollars, the debt forgiven would have approached a billion. Jesus uses a measure beyond grasping because His Atonement is “an unfathomable gift given at an incomprehensible cost.”
    sources: [talmage-jesus-christ-24, lds-scriptures, holland-perfect-eventually]
  - ref: 33
    phrase: Shouldest not thou also have had compassion on thy fellowservant
    kind: christ
    title: Mercy is for the merciful
    body: |
      The king’s question is the point of the parable. The servant is condemned not first for his debt but for refusing mercy after he had received so much of it. His fellowservant’s plea, “Have patience with me, and I will pay thee all” (verse 29), was word for word his own (verse 26), and it should have reminded him where he had just stood. His ingratitude justified the king in revoking the pardon. Having called on the law against another, he was dealt with by the law. Mercy is for the merciful.

      The “tormentors” of verse 34 seem left vague on purpose; they may be read as symbols of whatever God uses in righteous retribution, the sting of remorse and the scourge of conscience among them. Verse 35 draws the lesson, and it is the condition Jesus had already put into the prayer He taught: “forgive us our debts, as we forgive our debtors” ([[Matt. 6:12]]).
    sources: [talmage-jesus-christ-24, ellicott-matthew]

christ: |
  Matthew 18 shows Jesus Christ as the Shepherd who goes into the mountains after one lost sheep, and as the King who forgives a debt no servant could pay. The debtor is not only a character in a story: the parable is “a story about us, the fallen human family,” every one a debtor, who would have stayed in prison “were it not for the grace of a King who sets us free.” Seventy times seven, the measure Jesus set for Peter’s forgiveness, is also the measure of His own, a metaphor of “His infinite Atonement, His boundless love, and His limitless grace”: “as often as my people repent will I forgive them their trespasses against me” ([[Mosiah 26:30]]).

  A disciple forgiven ten thousand talents is asked to love and forgive at least at the hundred-pence level, which is within every disciple’s reach. And when a brother or sister gives offense, the Savior’s order is to go first, alone and privately, to win that person back.

explore: |
  - **The other tellings.** [[Mark 9:33–50]] and [[Luke 9:46–50]] for the child in the midst; [[Luke 15:1–7]] for the lost sheep told to the Pharisees.
  - **Church discipline in the Restoration.** [[D&C 42:88–92]], the order for offenses given to the restored Church.
  - **Forgiving without limit.** [[D&C 98:39–48]], the Lord’s law of forgiving an enemy, and [[Mosiah 26:29–31]].
  - *Jesus the Christ*, chapter 24, follows the whole discourse from the dispute on the road to the unmerciful servant.

