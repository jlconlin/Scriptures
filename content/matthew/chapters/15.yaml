chapter: 15
title: What Defiles, and Who Is Fed
tagline: Scribes and Pharisees from Jerusalem charge the disciples with eating with unwashed hands, and Jesus answers that defilement comes from the heart; then, among Gentiles, a Canaanite mother wins healing for her daughter, the crowds east of the lake glorify the God of Israel, and four thousand are fed.
when: 'Shortly after a Passover; in Galilee, the region of Tyre and Sidon, and the Decapolis'

setting: |
  Matthew 15 follows the feeding of the five thousand and the night on the water ([[Matt. 14:13–33]]). Now scribes and Pharisees come from Jerusalem, a delegation probably sent by plan of the rulers there, and the question they bring is ritual purity. Mark follows the same order ([[Mark 7:1–8:10]]), though where Matthew sums up many healings by the lake, Mark tells of one deaf man ([[Mark 7:31–37]]).

  After the dispute Jesus goes beyond the borders of Israel into the region of Tyre and Sidon, the one such journey the Gospels record. From there He comes back to the Sea of Galilee by its eastern side, the region Mark calls the Decapolis ([[Mark 7:31]]), among peoples who were partly pagan. The chapter ends with Jesus crossing by boat to Magdala on the western shore.

  Matthew shapes the middle story in his own way. Only he records Jesus’s words “I am not sent but unto the lost sheep of the house of Israel,” the woman’s cry to the “Son of David,” and the praise “great is thy faith.” He has already told of the charge to the Twelve not to go to the Gentiles ([[Matt. 10:5–6]]) and of a centurion’s faith ([[Matt. 8:5–13]]), and he will end with the command to teach all nations ([[Matt. 28:19]]).

thread: |
  **Defilement comes from the heart, and the bread of the children reaches the Gentiles who come in faith.**

  The Pharisees guarded their tables against ceremonial defilement, and a hand that had touched the market might have touched a Gentile. Jesus answers that what goes into the mouth cannot defile anyone; what comes out of the heart does (verses 1–20). Then He walks into a Gentile land, as if to show in deed that the dust of the heathen cities was no more defiling than that of Capernaum. There a Canaanite woman, of a people Israel had despised, calls Him Son of David and will not let go until her daughter is healed (verses 21–28). On the far side of the lake crowds glorify the God of Israel (verses 29–31), and Jesus, moved by compassion, feeds four thousand (verses 32–39).

sections:
  - range: 1-20
    heading: The tradition of the elders
    plain: |
      Then scribes and Pharisees came to Jesus from Jerusalem and asked, “Why do your disciples break the tradition of the elders? They do not wash their hands before they eat.” He answered, “And why do you break the commandment of God for the sake of your tradition? God commanded, ‘Honor your father and mother,’ and, ‘Whoever curses father or mother must be put to death.’ But you say that if a man tells his father or mother, ‘Whatever help you might have had from me is a gift dedicated to God,’ then he need not honor his father or mother. So you have cancelled God’s commandment for the sake of your tradition. Hypocrites! Isaiah prophesied rightly about you: ‘This people draws near to me with their mouth and honors me with their lips, but their heart is far from me. They worship me in vain, teaching as doctrine the commandments of men.’”

      He called the crowd and said, “Hear and understand. What goes into the mouth does not defile a person; what comes out of the mouth, that is what defiles a person.” His disciples came and said, “Do you know the Pharisees were offended by what you said?” He answered, “Every plant my heavenly Father has not planted will be pulled up by the roots. Leave them alone: they are blind guides of the blind, and if the blind lead the blind, both will fall into a pit.” Peter said, “Explain this saying to us.” Jesus said, “Are you still without understanding too? Don’t you see that whatever enters the mouth goes into the stomach and passes out into the drain? But what comes out of the mouth comes from the heart, and that is what defiles a person. Out of the heart come evil thoughts, murders, adulteries, sexual immorality, thefts, false witness, slander. These are what defile a person; eating with unwashed hands does not.”
  - range: 21-28
    heading: The woman of Canaan
    plain: |
      Jesus left there and went into the region of Tyre and Sidon. A Canaanite woman from that region came and cried out, “Have mercy on me, Lord, Son of David! My daughter is cruelly tormented by a devil.” He did not answer her a word. His disciples came and urged Him, “Send her away, for she keeps crying after us.” He answered, “I was sent only to the lost sheep of the house of Israel.” But she came and knelt before Him and said, “Lord, help me.” He answered, “It is not right to take the children’s bread and throw it to the little dogs.” She said, “True, Lord; yet even the little dogs eat the crumbs that fall from their masters’ table.” Then Jesus said, “Woman, great is your faith. Let it be done for you as you wish.” And her daughter was healed from that very hour.
  - range: 29-31
    heading: Healings by the Sea of Galilee
    plain: |
      Jesus went on from there and came to the shore of the Sea of Galilee, went up a mountain, and sat down. Great crowds came to Him, bringing the lame, the blind, the mute, the crippled and many others, and laid them at His feet, and He healed them. The crowd was amazed to see the mute speaking, the crippled made whole, the lame walking and the blind seeing, and they praised the God of Israel.
  - range: 32-39
    heading: Four thousand fed
    plain: |
      Jesus called His disciples and said, “I feel compassion for the crowd. They have been with me three days now and have nothing to eat, and I will not send them away hungry, or they may collapse on the way.” The disciples said, “Where could we get enough bread here in the wilderness to feed such a crowd?” Jesus asked, “How many loaves do you have?” They said, “Seven, and a few small fish.” He had the crowd sit down on the ground, took the seven loaves and the fish, gave thanks, broke them and gave them to the disciples, and the disciples gave them to the crowd. They all ate and were filled, and they gathered up seven large baskets full of the pieces left over. Those who ate were four thousand men, besides women and children. Then He sent the crowd away, got into a boat and came to the region of Magdala.

notes:
  - ref: 2
    phrase: the tradition of the elders
    kind: history
    title: 'Washing hands: holiness, not hygiene'
    body: |
      The washing the Pharisees missed was a ritual of holiness, not a rule of cleanliness: the charge against the disciples was ceremonial uncleanness, not dirty fingers. The Pharisees aimed to bring the temple’s holiness into the home (see the note on [[Matt. 9:11]]), and for a meal that meant purifying vessels and washing hands so that ordinary food was eaten in ritual purity.

      “The tradition of the elders” is also called ancestral tradition. The rabbinic sages who came after counted such traditions as continuous with the law of Moses: in their view the written law and the oral law had one source, God through Moses at Sinai; the Mishnah’s tractate Avot (“Fathers”) traces the chain from Moses to Joshua, to the elders, to the prophets. Jesus does not answer by condemning tradition as such. His counter-question, “Why do ye also transgress the commandment of God by your tradition?”, puts His finger on the real fault: a tradition used to set aside a plain commandment of God. The next verses give the example.
    sources: [lane-hostility, talmage-jesus-christ-22, shannon-torah-mouth]
  - ref: 5
    phrase: It is a gift
    kind: history
    title: '“It is a gift”: the vow called corban'
    body: |
      “It is a gift” is the vow Mark names in its own word, *corban* ([[Mark 7:11]]), a declaration that something was dedicated to God. The word first meant a sacrificial offering; by Jesus’s day saying it made a binding vow, and the Pharisees held a vow to be a weightier duty than the duty to parents. A son could therefore tell a father or mother in need that what they might have had from him was corban, and be held free of supporting them, while he might keep the use of the property himself, even for the rest of his life.

      Jesus sets two commandments of Moses beside the practice: “Honour thy father and thy mother” ([[Ex. 20:12]]) and the penalty for the one who curses them ([[Ex. 21:17]]). Read together, the two verses probably make the charge heavier: a son who used the vow was not only failing to honor his parents but, in effect, cursing them, which the law treated as a capital offense. Jesus allows that the oral law has its place, but not where it overrides the written law it was meant to serve.
    sources: [bd-corban, shannon-torah-mouth, talmage-jesus-christ-22, bowen-jewish-hermeneutics]
  - ref: 8
    phrase: This people draweth nigh unto me with their mouth
    kind: scripture
    title: 'Isaiah’s rebuke, in the words Jesus quoted'
    body: |
      Jesus applies to His questioners Isaiah’s rebuke of a people whose worship was all lips, and He quotes it in the form found in the Greek Old Testament. The King James Isaiah, translated from the Hebrew, ends “their fear toward me is taught by the precept of men” ([[Isa. 29:13]]); the Septuagint reads “in vain do they worship me, teaching the commandments and doctrines of men,” and that is the wording in Matthew’s verse 9. Isaiah described a people who seemed to want holiness while their hearts were not right with God, and the Greek form makes the charge of empty worship sharper still: devotion that teaches human rules as God’s doctrine is worship in vain.

      The verse returned in 1820, when the Lord quoted it to Joseph Smith in the Sacred Grove ([[JS—H 1:19]]); the note on [[Isa. 29:13]] explains what it means there.
    sources: [lxx-rahlfs, lane-hostility, lds-scriptures]
  - ref: 11
    phrase: Not that which goeth into the mouth defileth a man
    kind: history
    title: What really defiles
    body: |
      Jesus turns from the Pharisees to the crowd and states openly the principle that undercut their whole idea of holiness: food passes through the body and out into the “draught” (an old word for a drain, verse 17), but what comes out of the mouth comes from the heart, and evil from the heart is what truly defiles (verses 18–20). That saying was public, and it struck at the authority on which the Pharisees’ program of holiness was built; no wonder they were offended (verse 12).

      Did Jesus here abolish the law’s distinction between clean and unclean foods? Matthew ends the teaching where the dispute began: “to eat with unwashen hands defileth not a man” (verse 20). Matthew draws no conclusion about foods. Read for where it leads, the principle reached further than the disciples could yet see, toward setting aside the whole system of ceremonial purity, clean and unclean meats included; that is a reading of its tendency, not what the verse says. The disciples were slow to take it in: even after Pentecost Peter could still say he had never eaten “any thing that is common or unclean,” until a vision taught him otherwise ([[Acts 10:14–15]]).
    sources: [lane-hostility, talmage-jesus-christ-22, ellicott-matthew]
  - ref: 22
    phrase: a woman of Canaan
    kind: history
    title: A Canaanite who calls Him Son of David
    body: |
      Matthew calls her “a woman of Canaan,” using the old name for the land’s first peoples; Mark calls her “a Greek, a Syrophenician by nation” ([[Mark 7:26]]). The two agree: “Canaan” and “Canaanite” were also used more narrowly of Phoenicia, the coastland of Tyre and Sidon, and the Phoenicians were of Canaanite descent. She was a Gentile by birth, of a people long held in disrepute among the Jews, and Jesus had come into her country.

      Yet she greets Him with a title of Israel’s hope: “O Lord, thou Son of David.” The words show she believed Him to be the Messiah of Israel. Only Matthew records that cry, as only he records Jesus’s praise of her faith at the end; Mark has neither.
    sources: [talmage-jesus-christ-22, ellicott-matthew, strathearn-matthew-editor]
  - ref: 24
    phrase: I am not sent but unto the lost sheep of the house of Israel
    kind: scripture
    title: Sent first to the lost sheep of Israel
    body: |
      Jesus’s silence and His answer state the limit of His mortal mission: in the flesh He was sent to Israel. The disciples’ “Send her away” was probably a plea that He grant her request and end the scene, and His reply recalls the charge He had given them, which only Matthew records: “go not into the way of the Gentiles … but go rather to the lost sheep of the house of Israel” ([[Matt. 10:5–6]]). His personal ministry, and the apostles’ while He was with them, was directed to the house of Israel; the risen Christ was to be made known to every nation. The course He took had two results: the woman’s faith was shown, and the disciples were taught.

      The Book of Mormon speaks of the same limit. To the Nephites the risen Lord explained that the Gentiles would not hear His voice in person, but that He would manifest Himself to them by the Holy Ghost ([[3 Ne. 15:23]]). The sheep He came to gather in person were of the house of Israel, among them the “other sheep” He visited in the Americas ([[3 Ne. 15:21]]).
    sources: [talmage-jesus-christ-22, strathearn-matthew-editor, sc-knowhy-207, lds-scriptures]
  - ref: 26
    phrase: to cast it to dogs
    kind: words
    title: Dogs, or little dogs of the house
    body: |
      The Greek word is not the ordinary word for a dog but its diminutive, *kynarion*, “a little dog.” It points away from the half-wild curs of the street, which the Bible uses as a figure of degradation, to the small dogs kept in the house and allowed under the table. She accepts the picture and turns it into her plea: the little dogs in the house are fed too, with the crumbs from their masters’ table (verse 27). Her answer shows no offense; she asks only for what falls.

      Mark keeps a word that Matthew does not: “Let the children first be filled” ([[Mark 7:27]]). The children are fed first, not alone, and the saying looks ahead to the gospel given to Jew and Gentile.
    sources: [thayer, talmage-jesus-christ-22]
  - ref: 28
    phrase: great is thy faith
    kind: christ
    title: The faith of a Gentile
    body: |
      Jesus praises a Gentile’s faith for the second time in Matthew. The first was the centurion, of whom He said, “I have not found so great faith, no, not in Israel” ([[Matt. 8:10]]). With the two stories Matthew prepares his readers for the turn at the end of his Gospel, from the mission to the lost sheep of Israel ([[Matt. 10:6]]) to the command to “teach all nations” ([[Matt. 28:19]]), and he shows that Gentiles at times have more faith than the covenant people.

      Her faith had been tried by silence, by the disciples’ plea to send her away, and by a hard saying, and she kept asking. It was the faith that overcomes apparent obstacles and endures discouragement, and Jesus answered it in full: “be it unto thee even as thou wilt.”
    sources: [strathearn-matthew-editor, talmage-jesus-christ-22]
  - ref: 31
    phrase: they glorified the God of Israel
    kind: history
    title: Gentiles who praised Israel’s God
    body: |
      The crowds who praised “the God of Israel” were most likely Gentiles. Matthew says only that Jesus came beside the Sea of Galilee, but Mark says He came “through the midst of the coasts of Decapolis” ([[Mark 7:31]]). The Decapolis, “the ten cities,” was a region without fixed borders, lying mostly east of the Jordan and south of the lake, and its peoples were partly pagan. The crowds who saw the mute speak and the lame walk were likely, then, outsiders to Israel, and they gave the glory to Israel’s God.

      Matthew does not say outright who the crowds were; the reading rests on the region Mark names.
    sources: [talmage-jesus-christ-22]
  - ref: 37
    phrase: seven baskets full
    kind: history
    title: A second feeding, not the first told again
    body: |
      The feeding of the four thousand is a second miracle, not another telling of the five thousand ([[Matt. 14:13–21]]). The details differ throughout: the number fed, the three days the crowd had waited, the seven loaves instead of five, and the baskets. Even the word for “basket” differs in the Greek. After the five thousand the disciples filled twelve *kophinoi*, wicker baskets a man could carry in his hand; here they fill seven *spyrides*, large plaited hampers, the kind in which Paul was later let down over the wall of Damascus ([[Acts 9:25]]). Jesus Himself names both feedings, each with its own basket, when He reproves the disciples soon after ([[Matt. 16:9–10]]).

      Why, then, did the disciples ask where so much bread could come from (verse 33), when they had seen it done? Perhaps they remembered well but did not think it their place to ask for the miracle again. The miracle itself began, as Jesus says in verse 32, not from a challenge or a demand for a sign but from compassion for hungry people who had stayed three days to hear Him.
    sources: [ellicott-matthew, thayer, talmage-jesus-christ-22]
  - ref: 39
    phrase: came into the coasts of Magdala
    kind: history
    title: Magdala, on the western shore
    body: |
      Magdala was on the western shore of the Sea of Galilee, so the boat carried Jesus back across from the eastern side. Mark names the place Dalmanutha ([[Mark 8:10]]); the two towns were close enough together that Dalmanutha was virtually a suburb of Magdala. There the Pharisees met Him again, now joined by the Sadducees ([[Matt. 16:1]]).
    sources: [talmage-jesus-christ-22]

christ: |
  Matthew 15 shows Jesus Christ as the Lord who looks on the heart. He will not let a ritual of the hands stand in for a heart near to God, and He will not let a tradition release a son from caring for his parents. The same Lord who said He was sent to the lost sheep of Israel heard a Canaanite mother whose faith He called great, and out of compassion fed a crowd that had waited three days. His rebuke of worship that is all lips was not for Pharisees only; He spoke it again in 1820 ([[JS—H 1:19]]). “The Lord requireth the heart and a willing mind” ([[D&C 64:34]]), and faith, not birth, is what brings a person to His table.

explore: |
  - **Isaiah’s words in their first setting and in 1820.** [[Isa. 29:13–14]] and the site’s note there; [[JS—H 1:17–20]]; Nephi’s use of the passage, [[2 Ne. 27:25–26]].
  - **Peter learns the lesson.** [[Acts 10:9–35]], the vision of the clean and unclean and the house of Cornelius.
  - **The order of the gospel, Israel and then the Gentiles.** [[Matt. 10:5–6]]; [[Matt. 28:19–20]]; [[3 Ne. 15:21–24]] and [[3 Ne. 16:1–4]].
  - **The other tellings.** [[Mark 7:1–8:10]], with the deaf man healed with “Ephphatha” ([[Mark 7:31–37]]); the two feedings remembered together, [[Matt. 16:5–12]].

