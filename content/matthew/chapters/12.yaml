chapter: 12
title: Lord of the Sabbath, and Greater than Jonas
tagline: Two Sabbath disputes, a plot against Jesus’s life, and the charge that He casts out devils by Beelzebub; He answers that He works by the Spirit of God, offers only the sign of Jonas, and names as His family all who do His Father’s will.
when: 'During Jesus’s ministry in Galilee'

setting: |
  Matthew 12 stands between the sending of the Twelve (chapter 10) and the parables of chapter 13, and in it the Pharisees take counsel against His life. It begins “at that time,” just after His invitation, “Come unto me, all ye that labour and are heavy laden, and I will give you rest” ([[Matt. 11:28]]), and its first two stories are both about the day of rest. Matthew, Mark and Luke all tell these two Sabbath disputes, the grain plucked in the fields and the withered hand healed, one after the other ([[Mark 2:23–3:6]]; [[Luke 6:1–11]]).

  Opposition runs through the rest of the chapter. After the plot (verse 14) He withdraws, and Matthew reads His quiet ministry as the fulfillment of Isaiah’s first song of the Lord’s servant. A healing then provokes the charge that He works by Beelzebub, which Jesus answers at length, and scribes and Pharisees ask Him for a sign. The chapter closes with His mother and brethren waiting outside.

  Much of the chapter turns on Old Testament passages that have their own chapters on this site: David and the hallowed bread ([[1 Sam. 21:6]]), “mercy, and not sacrifice” ([[Hos. 6:6]]), the servant of [[Isa. 42:1–4]], Jonah, and the queen of Sheba. The notes here link to those rather than repeat them.

thread: |
  **Who is this, and by what power does He act?** The question runs through the chapter, and Jesus’s answers keep pointing to Himself.

  When His disciples are accused of breaking the Sabbath, He does not argue that the law has lapsed. He says that “one greater than the temple” is here and that the Son of man is Lord of the Sabbath (verses 6, 8). When the Pharisees plot His death, He goes quietly on healing, and Matthew sees in that quiet the servant Isaiah foretold, who would not break a bruised reed (verses 15–21). When He heals a blind and dumb man, the crowd asks whether He is the son of David and the Pharisees say He works by Beelzebub (verses 23–24). He answers that He casts out devils by the Spirit of God, that He has bound the strong man, and that to ascribe the Spirit’s work to Satan comes very near the one sin that is not forgiven (verses 28–32).

  Asked for a sign, He offers only Jonah’s, His own three days in the earth, and twice more says that something greater is here: greater than Jonas, greater than Solomon (verses 39–42). The chapter ends by turning the question on its hearers. Whoever does the will of His Father is His brother, and sister, and mother (verse 50).

sections:
  - range: 1-8
    heading: Grain plucked on the Sabbath
    plain: |
      About that time Jesus went through the grainfields on the Sabbath. His disciples were hungry, and they began to pick heads of grain and eat them. When the Pharisees saw it, they said to Him, “Look, your disciples are doing what is not lawful on the Sabbath.” He answered, “Haven’t you read what David did when he and his men were hungry? He went into the house of God and ate the holy bread, which it was not lawful for him or his men to eat, but only for the priests. Or haven’t you read in the law that on the Sabbath the priests in the temple break the Sabbath and are not guilty? I tell you, something greater than the temple is here. If you had understood what this means, ‘I want mercy, not sacrifice,’ you would not have condemned the innocent. For the Son of Man is Lord of the Sabbath.”
  - range: 9-14
    heading: A withered hand healed
    plain: |
      He went on from there into their synagogue. A man was there with a withered hand, and they asked Jesus, “Is it lawful to heal on the Sabbath?” so that they could accuse Him. He said to them, “If any of you has one sheep and it falls into a pit on the Sabbath, won’t you take hold of it and lift it out? How much more is a man worth than a sheep! So it is lawful to do good on the Sabbath.” Then He said to the man, “Stretch out your hand.” He stretched it out, and it was restored, as sound as the other. Then the Pharisees went out and plotted how they might destroy Him.
  - range: 15-21
    heading: Isaiah’s chosen servant
    plain: |
      Jesus knew of it and withdrew from there. Great crowds followed Him, and He healed them all, and He ordered them not to make Him known. This fulfilled what the prophet Isaiah said: “Here is my servant whom I have chosen, my beloved, in whom my soul delights. I will put my Spirit upon him, and he will proclaim justice to the Gentiles. He will not quarrel or cry out, and no one will hear his voice in the streets. A bruised reed he will not break, and a smoldering wick he will not put out, until he brings justice to victory. And in his name the Gentiles will hope.”
  - range: 22-37
    heading: By the Spirit of God, not by Beelzebub
    plain: |
      Then a man possessed by a devil, blind and unable to speak, was brought to Him, and He healed him, so that the man both spoke and saw. All the people were amazed and said, “Can this be the son of David?” But when the Pharisees heard it, they said, “This man casts out devils only by Beelzebub, the prince of the devils.” Jesus knew their thoughts and said to them, “Every kingdom divided against itself is laid waste, and no city or house divided against itself will stand. If Satan casts out Satan, he is divided against himself; how then will his kingdom stand? And if I cast out devils by Beelzebub, by whom do your own followers cast them out? They will be your judges. But if I cast out devils by the Spirit of God, then the kingdom of God has come to you. How can anyone go into a strong man’s house and carry off his goods unless he first ties up the strong man? Then he can plunder his house. Whoever is not with me is against me, and whoever does not gather with me scatters. So I tell you, every kind of sin and blasphemy will be forgiven, but blasphemy against the Holy Ghost will not be forgiven. Whoever speaks a word against the Son of Man will be forgiven, but whoever speaks against the Holy Ghost will not be forgiven, either in this world or in the world to come. Make the tree good and its fruit will be good, or make the tree bad and its fruit will be bad; a tree is known by its fruit. You brood of vipers! How can you say anything good when you are evil? The mouth speaks what fills the heart. A good man brings good things out of the good stored up in his heart, and an evil man brings evil things out of the evil stored up in him. I tell you, on the day of judgment people will give account for every idle word they speak. By your words you will be justified, and by your words you will be condemned.”
  - range: 38-45
    heading: The sign of Jonas
    plain: |
      Then some of the scribes and Pharisees said to Him, “Teacher, we want to see a sign from you.” He answered, “An evil and unfaithful generation looks for a sign, but no sign will be given it except the sign of the prophet Jonah. As Jonah was three days and three nights in the belly of the whale, so the Son of Man will be three days and three nights in the heart of the earth. The men of Nineveh will stand up at the judgment with this generation and condemn it, because they repented at Jonah’s preaching, and something greater than Jonah is here. The queen of the south will stand up at the judgment with this generation and condemn it, because she came from the ends of the earth to hear Solomon’s wisdom, and something greater than Solomon is here. When an unclean spirit goes out of a man, it wanders through dry places looking for rest and finds none. Then it says, ‘I will go back to the house I left.’ When it comes, it finds the house empty, swept and put in order. Then it goes and brings seven other spirits more wicked than itself, and they go in and live there, and the man ends up worse off than before. That is how it will be with this wicked generation.”
  - range: 46-50
    heading: His mother and His brethren
    plain: |
      While He was still speaking to the crowds, His mother and His brothers stood outside, wanting to speak with Him. Someone told Him, “Your mother and your brothers are standing outside and want to speak with you.” He answered the man, “Who is my mother, and who are my brothers?” Stretching out His hand toward His disciples, He said, “Here are my mother and my brothers! For whoever does the will of my Father in heaven is my brother and sister and mother.”

notes:
  - ref: 2
    phrase: thy disciples do that which is not lawful to do upon the sabbath day
    kind: history
    title: Reaping on the Sabbath
    body: |
      The Pharisees’ complaint was that plucking grain is reaping, and reaping is work. It was not theft: the law let a hungry traveler pluck ears by hand in a neighbor’s field, so long as he put no sickle to the standing grain ([[Deut. 23:25]]). But that permission was not understood to reach the Sabbath, when Exodus says that even “in earing time and in harvest thou shalt rest” ([[Ex. 34:21]]). Nor was the rule a peculiarly Pharisaic strictness; that plucking grain on the Sabbath was unlawful would have been widely accepted.

      So Jesus does not deny that a line had been crossed. His answer, in all three Gospels that tell the story, is about who has the authority to let His disciples cross it.
    sources: [lane-sabbath-synoptic, lds-scriptures]
  - ref: 5
    phrase: the priests in the temple profane the sabbath, and are blameless
    kind: scripture
    title: Two precedents, David and the priests
    body: |
      Jesus answers from scripture with two precedents, and neither says the Sabbath has lapsed. The first is David, who in his flight from Saul ate the hallowed bread that only priests might eat (the note at [[1 Sam. 21:6]] tells the story). That precedent does not touch the Sabbath directly. It is about authority: as David had authority to cover an exceptional breach caused by hunger, so does Jesus, and He now extends it to His hungry disciples. There may be a nearer link as well, since the shewbread was set out anew every Sabbath and the old loaves eaten by the priests ([[Lev. 24:8–9]]): David was doing what priests did on that day.

      The second precedent, which only Matthew gives, is the priests themselves. The law required them to offer two lambs, with flour and oil, every Sabbath, beyond the daily offering ([[Num. 28:9–10]]). Each Sabbath, then, they did work that would otherwise profane it, and no one held them guilty; later rabbinic writing states the rule that temple service “overrides” the Sabbath. The argument runs from the lesser to the greater: if the temple’s service set the Sabbath aside, how much more could the One who is greater than the temple (verse 6).
    sources: [lane-sabbath-synoptic, mcclellan-go-ye-learn, lds-scriptures]
  - ref: 6
    phrase: in this place is one greater than the temple
    kind: christ
    title: Greater than the temple, and mercy above sacrifice
    body: |
      The temple was greater than the Sabbath, since its priests worked there on the Sabbath, and Jesus now says that something greater than the temple stands before the Pharisees. The saying makes plain that Christ Himself is greater than the temple.

      Then Jesus puts mercy above the temple too, with a line of Hosea that only Matthew records here: “I will have mercy, and not sacrifice” ([[Hos. 6:6]]). Jesus had used the same line once before, when the Pharisees faulted Him for eating with publicans and sinners ([[Matt. 9:13]]). Mercy in Hosea is *ḥesed*, loyal kindness that reaches past what the law strictly requires to those who cannot help themselves; Matthew quotes the line as the Septuagint (the ancient Greek translation of the Old Testament) gives it, “I want mercy.” Jesus was not dismissing the law. He was rebuking the use of fine legal points to condemn people who were doing good, and the word He chooses shows it: the disciples are “guiltless” (verse 7), the same Greek word He has just used of the priests, who are “blameless” (verse 5). What Hosea’s line meant in Hosea’s own day is explained at [[Hos. 6:6]].
    sources: [lane-sabbath-synoptic, mcclellan-go-ye-learn, lds-scriptures]
  - ref: 8
    phrase: the Son of man is Lord even of the sabbath day
    kind: christ
    title: Lord of the Sabbath, and of its rest
    body: |
      All three Gospels end the story with the same claim, that the Son of man is Lord of the Sabbath; Mark alone first adds, “The sabbath was made for man, and not man for the sabbath” ([[Mark 2:27]]). Leaving that line out may also keep “Son of man” here from being read as humanity in general, and puts the focus on Jesus Himself: as Lord and Messiah, He is the one who says what the Sabbath command means.

      Matthew’s telling adds something more. Only he says the disciples were hungry (verse 1), and only he places the story right after Jesus’s promise, “Come unto me, all ye that labour and are heavy laden, and I will give you rest” ([[Matt. 11:28–30]]). Read in that order, the story of His hungry disciples eating on the day of rest may connect the rest the Sabbath was meant to give with the rest He promises to those who come to Him.
    sources: [lane-sabbath-synoptic, lds-scriptures]
  - ref: 12
    phrase: it is lawful to do well on the sabbath days
    kind: history
    title: Was healing forbidden on the Sabbath?
    body: |
      Saving a life on the Sabbath was unquestionably allowed; healing a lasting condition like a withered hand was another matter. Apart from the Gospels themselves, no source from that early period says that healing as such was forbidden on the Sabbath, though neither is it clear that it was approved; it is very likely that first-century Pharisees considered it forbidden. That is why the question in verse 10 was a trap, asked “that they might accuse him.”

      Jesus answers with a case His hearers would grant. Most of them would have lifted a sheep out of a pit on the Sabbath, a practice that may reflect the plain rural custom of Galilee; only a stricter, separatist group, known from a text called the Damascus Document, would have left the animal there. Then He draws a conclusion wider than the question: it is lawful “to do well.” The Sabbath is still to be kept, but helping and caring for someone in need belongs to keeping it, and the hand restored before them was the proof.
    sources: [lane-sabbath-synoptic]
  - ref: 16
    phrase: charged them that they should not make him known
    kind: christ
    title: The quiet servant of Isaiah
    body: |
      Matthew explains Jesus’s order to keep quiet with a prophecy of a servant who would not “strive, nor cry.” On one older reading, the hour of His final conflict had not yet come and He would not hasten it, so He avoided giving offense before its time. Matthew’s own explanation is the long quotation that follows, from [[Isa. 42:1–4]], the first of Isaiah’s songs of the servant of the Lord.

      “Servant” in verse 18 is the Greek *pais*, which can mean either a child or a servant (the footnote gives “son”). Here it follows the Hebrew phrase for the servant of the LORD: one through whom God carries out His purposes; in the New Testament, the servant is Jesus the Messiah. Isaiah had foretold that the Messiah’s ministry would make so small a stir that He would not break even a reed already bruised or put out a wick that was only smoldering, and that He would come to heal and help the weak rather than to crush them. Matthew quotes the prophecy just after Jesus has healed a withered hand and then healed “them all” (verse 15) while His enemies plot His death. The images themselves, the cracked reed and the dimming wick, are explained in the note at [[Isa. 42:3]].
    sources: [ellicott-matthew, thayer, ball-isaiah-messiah, lds-scriptures]
  - ref: 24
    phrase: This fellow doth not cast out devils, but by Beelzebub the prince of the devils
    kind: history
    title: Beelzebub, and a charge that could kill
    body: |
      Beelzebub was the name of a Philistine god, used as a title for Satan, the chief of the demons; the Old Testament spells it Baalzebub ([[2 Kgs. 1:2]]). The Pharisees reach for it because of what the crowd has just said. “Is not this the son of David?” (verse 23) uses the title of the Messiah (see the note at [[Matt. 9:27]]): in effect the people were asking whether this could be the Christ they had long expected. That popular judgment maddened the Pharisees, and they had to explain the miracle some other way.

      Their explanation was dangerous. When Mark tells the story, scribes have come down from Jerusalem to give the verdict ([[Mark 3:22]]), and to say a man worked wonders by Satan’s power was a legal allegation with dire consequences, not a theological opinion. Jesus’s miracles forced the question of the power by which He did them: if by the power of God, He should be followed; if by Beelzebub, He should be feared and removed. The Book of Mormon had foretold this very charge: after all His mighty works, “they shall consider him a man, and say that he hath a devil, and shall scourge him, and shall crucify him” ([[Mosiah 3:9]]).
    sources: [bd-beelzebub, talmage-jesus-christ-18, welch-legal-cause, lds-scriptures]
  - ref: 27
    phrase: by whom do your children cast them out
    kind: scripture
    title: Your own followers cast out devils
    body: |
      “Your children” are the Pharisees’ own disciples, some of whom practiced exorcism. Jesus’s question works only if those followers really did cast out devils, and not by Beelzebub: if the Pharisees accepted their work, they could not condemn His on the same evidence, and their own followers would be their judges.

      The Joseph Smith Translation states that assumption outright. After verse 28 it adds, “For they also cast out devils by the Spirit of God, for unto them is given power over devils, that they may cast them out” (JST Matt. 12:23, in the footnotes). The argument then turns the charge back on the Pharisees. Everyone conceded that Jesus did cast out devils; He did it either by Satan, which was absurd, or by the Spirit of God, and in that case “the kingdom of God is come unto you.”

      The strong man of verse 29 makes the same point. Jesus had been driving evil spirits out of the bodies they had taken over, and He could not have done it had He not first subdued their master, Satan. Between those two powers there could be no truce, and verse 30 puts the hearers to the test: “He that is not with me is against me.”
    sources: [ellicott-matthew, lds-scriptures, talmage-jesus-christ-18]
  - ref: 31
    phrase: the blasphemy against the Holy Ghost shall not be forgiven unto men
    kind: prophets
    title: The sin that is not forgiven
    body: |
      The sin against the Holy Ghost is a sin only those can commit who have known the truth by revelation and then deny it. Joseph Smith taught in 1844 that all sins shall be forgiven except this one, and described what it takes: a man “has got to say that the sun does not shine, while he sees it, he has got to deny Jesus Christ when the heavens were open to him.” Latter-day revelation describes the same people as “having denied the Holy Spirit after having received it” ([[D&C 76:35]]), and Alma told his son that the sin is unpardonable “if ye deny the Holy Ghost when it once has had place in you, and ye know that ye deny it” ([[Alma 39:6]]).

      The Joseph Smith Translation adds a condition to the first half of the verse: all manner of sin and blasphemy shall be forgiven “unto men who receive me and repent” (JST Matt. 12:26, in the footnotes).

      Why can a word against the Son of man be forgiven? Words spoken against Jesus as a man might be forgiven, but to speak against the authority He held, and above all to ascribe that power to Satan, came very near to blasphemy against the Holy Ghost. The Pharisees had just ascribed His works to Beelzebub, and the warning is directed at them: they stood near a sin that, in its full sense, only one who has received the witness of the Spirit and then knowingly denies it can commit.
    sources: [jsp-discourse-1844-04-07, lds-scriptures, talmage-jesus-christ-18]
  - ref: 36
    phrase: every idle word
    kind: words
    title: '“Idle” words'
    body: |
      “Idle” here means useless, not lazy. The Greek *argos* is made from “without” and “work,” and it was used of fields, trees, or gold and silver that yield nothing though they ought to; of a word, it means unprofitable, which in this verse is an understatement for harmful. Jesus does not say “every evil word” but every idle one: the careless, random remark, which, being spontaneous, may betray character more than deliberate speech. Nor does He say that each will condemn its speaker; men will “give account” of it, and it will count in the judgment of what they are.
    sources: [thayer, ellicott-matthew]
  - ref: 39
    phrase: An evil and adulterous generation seeketh after a sign
    kind: scripture
    title: Why “adulterous”?
    body: |
      The prophets had pictured the covenant between Israel and the Lord as a marriage, and Israel’s unfaithfulness as adultery ([[Jer. 3]]; [[Ezek. 16]]; [[Ezek. 23]]; [[Hos. 1]]; [[Hos. 2]]). An adulterous generation, then, is one unfaithful to its Lord, which asks for a sign rather than trusting the proofs He has already given. Those proofs were many: the blind and the deaf, the dumb and the infirm had been healed in its streets and synagogues, devils had been cast out, and the dead raised. The request for one more wonder may have come from curiosity, or from a wish for a further charge against Him.

      Latter-day revelation states the principle: “faith cometh not by signs, but signs follow those that believe,” and God shows signs “not by the will of men, nor as they please, but by the will of God” ([[D&C 63:9–10]]).
    sources: [ellicott-matthew, talmage-jesus-christ-18, lds-scriptures]
  - ref: 40
    phrase: so shall the Son of man be three days and three nights in the heart of the earth
    kind: christ
    title: The sign of the prophet Jonas
    body: |
      The one sign Jesus offers is His own burial and resurrection. Jonas (Jonah) was three days in the fish and then set free; so the Son of man would lie in the tomb and then rise. It was the only sign that generation would receive, and by it they would stand condemned. How the three days and nights are counted is discussed in the note at [[Jonah 1:17]].

      The next two verses name the witnesses to that condemnation. The men of Nineveh repented at the preaching of Jonah ([[Jonah 3:5]]), and the queen of Sheba traveled from far away to hear Solomon’s wisdom ([[1 Kgs. 10:1]]). A greater than Jonah and a greater than Solomon was now standing among them, and they were asking Him for a sign.
    sources: [talmage-jesus-christ-18, lds-scriptures]
  - ref: 44
    phrase: he findeth it empty, swept, and garnished
    kind: scripture
    title: The house left empty
    body: |
      The house swept and set in order pictures a person freed from the unclean influence of error and sin by receiving the truth. If that person later renounces the good and opens the soul to falsehood, he becomes more corrupt than he was before. A house swept clean but left empty does not stay empty. “Even so,” Jesus says, “shall it be also unto this wicked generation.”

      The Joseph Smith Translation sets this short parable in a dialogue. Some of the scribes ask how Jesus can say that one sin will not be forgiven when it is written that every sin shall be, and He answers with the unclean spirit that goes out and returns: it returns “when a man speaketh against the Holy Ghost,” and finds the house empty, “for the good spirit leaveth him unto himself” (JST Matt. 12:37–38).
    sources: [jst-matt-12, talmage-jesus-christ-18]
  - ref: 50
    phrase: whosoever shall do the will of my Father which is in heaven, the same is my brother, and sister, and mother
    kind: history
    title: His mother and His brethren
    body: |
      Jesus’s brethren were James, Joses, Simon and Judas, children of Joseph and Mary born after Jesus; He had sisters too ([[Matt. 13:55–56]]). Matthew does not say why they came. Mark tells of kinsmen who set out to lay hold on Him, saying, “He is beside himself” ([[Mark 3:21]]), John records that His brethren did not yet believe on Him ([[John 7:5]]), and some of Mary’s household had not yet understood His work. The visit has been read in that light, as an attempt to restrain Him, but those facts scarcely warrant it, and it would be unjust to Mary to suppose that after the angel’s annunciation and all that followed she thought her Son needed restraining.

      Nor is His answer a slight to His mother. He does not narrow His family but widens it: whoever does His Father’s will is His brother, and sister, and mother. He used the moment to teach that His Father’s work came before the claims of family, as when at twelve He had told her He must be about His Father’s business ([[Luke 2:49]]), and He asked the same devotion of His apostles. After His ascension His mother and brethren were praying with the Eleven ([[Acts 1:14]]).
    sources: [bd-brethren-of-the-lord, talmage-jesus-christ-18, lds-scriptures]

christ: |
  Matthew 12 shows Jesus Christ making great claims for Himself: He is greater than the temple, Lord of the Sabbath, greater than Jonah and greater than Solomon, the stronger one who binds Satan by the Spirit of God. Yet the same chapter shows Him as Isaiah’s quiet servant, who would not break a bruised reed, healing a withered hand and then healing “them all.” He names as His family “whosoever shall do the will of my Father which is in heaven,” and by covenant disciples become “the children of Christ, his sons, and his daughters” ([[Mosiah 5:7]]). Forgiveness reaches “all manner of sin and blasphemy” for those who receive Him and repent, and the Sabbath He is Lord of is a day on which it is lawful “to do well.”

explore: |
  - **The same stories in Mark and Luke.** [[Mark 2:23–3:35]]; [[Luke 6:1–11]]; [[Luke 11:14–36]], where a woman blesses Jesus’s mother and He answers, “Yea rather, blessed are they that hear the word of God, and keep it.”
  - **The passages Jesus cites.** [[1 Sam. 21:1–6]]; [[Num. 28:9–10]]; [[Hos. 6:6]] and [[Matt. 9:13]]; [[Isa. 42:1–4]]; [[Jonah 1:17]] and [[Jonah 3:5–10]]; [[1 Kgs. 10:1–13]].
  - **The sin against the Holy Ghost in latter-day scripture.** [[D&C 76:31–49]]; [[Alma 39:5–6]]; [[Heb. 6:4–6]].
  - “An Overview of the Sabbath in the Synoptic Gospels,” in the Religious Studies Center’s *Sacred Time*, compares the Sabbath disputes in all three Gospels.

