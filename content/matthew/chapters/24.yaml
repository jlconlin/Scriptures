chapter: 24
title: Signs on the Mount of Olives
tagline: 'Leaving the temple, Jesus foretells its fall; on the Mount of Olives He answers His disciples’ question about it and about His coming, with deceivers and wars, the abomination of desolation, the Son of Man in the clouds, and the call to watch.'
when: 'On the Mount of Olives, in the last week of Jesus’s ministry, two days before the Passover'

setting: |
  Matthew 24 opens the last of Matthew’s long sermons, which runs through chapter 25 and closes with “when Jesus had finished all these sayings” ([[Matt. 26:1]]). It is the last week of His ministry; the Passover was two days away ([[Matt. 26:2]]). Jesus has just left the temple, and on His last walk from Jerusalem back to Bethany He rested on the Mount of Olives, where the city and the temple could be seen in full. Mark names the four who came to Him privately: Peter, James, John and Andrew ([[Mark 13:3]]).

  Mark and Luke tell the same sermon ([[Mark 13]]; [[Luke 21:5–36]]). The sayings of verses 42–51, on the thief and the two servants, have nothing corresponding to them in Mark’s or Luke’s report of this sermon, though Luke gives almost the same words on another occasion ([[Luke 12:39–46]]).

  The Lord returned to this sermon in 1831. A revelation given that March draws on it throughout ([[D&C 45]]), and in the months that followed Joseph Smith revised Matthew 24, expanding some verses, moving some passages and repeating others. The result is [[JS—M 1]] in the Pearl of Great Price, where the site’s fuller commentary on the discourse stands; the notes here answer the reader of Matthew’s own text and point there.

thread: |
  **The disciples ask when; the Lord answers with what to watch for, and how to be ready.**

  The sermon begins with a question of time, “when shall these things be?” (verse 3), and Jesus never gives a date. His reply deals “not with dates, but with events,” and its spirit is warning and “admonition to ceaseless vigilance.” The first words are “Take heed that no man deceive you” (verse 4). Then come the signs: deceivers and wars, only the first pains, then persecution and the gospel preached to all nations (verses 5–14); the abomination of desolation and the flight from Judea, when Jerusalem would fall (verses 15–22); false Christs again, and then the Son of Man Himself, coming as openly as lightning and gathering His elect (verses 23–31).

  The last part turns from signs to readiness. The fig tree tells the season, but “of that day and hour knoweth no man” (verse 36). Noah’s neighbors, the householder and the thief, and the two servants all teach one lesson: “be ye also ready” (verse 44). The blessing falls on the servant whose lord “when he cometh shall find so doing” (verse 46).

sections:
  - range: 1-3
    heading: The temple and the disciples’ question
    plain: |
      Jesus left the temple and was going away when His disciples came to point out its buildings to Him. “Do you see all these things?” He said. “I tell you truly, not one stone here will be left on another; every one will be thrown down.” As He sat on the Mount of Olives, the disciples came to Him privately. “Tell us,” they said, “when will this happen? And what will be the sign of your coming, and of the end of the world?”
  - range: 4-14
    heading: The beginning of the pains
    plain: |
      Jesus answered, “Be careful that no one deceives you. Many will come in my name, saying, ‘I am the Christ,’ and will deceive many. You will hear of wars and rumors of wars; do not be alarmed. These things must happen, but the end is not yet. Nation will rise against nation, and kingdom against kingdom, and there will be famines, epidemics and earthquakes in many places. All these are only the first pains of labor. Then they will hand you over to be persecuted and will put you to death, and all nations will hate you because of my name. Many will fall away and betray one another and hate one another. Many false prophets will appear and deceive many. Because wickedness will increase, the love of many will grow cold. But whoever endures to the end will be saved. And this gospel of the kingdom will be preached in all the world as a testimony to all nations, and then the end will come.”
  - range: 15-22
    heading: The abomination of desolation and the flight from Judea
    plain: |
      “So when you see the abomination of desolation that Daniel the prophet spoke of standing in the holy place (let the reader understand), then those in Judea must flee to the mountains. Whoever is on the roof must not go down to take anything out of the house, and whoever is in the field must not turn back for his coat. How hard it will be in those days for women who are pregnant or nursing! Pray that your flight will not come in winter or on the Sabbath. For then there will be great distress, such as has not been from the beginning of the world until now, and never will be again. If those days were not cut short, no one would survive; but for the sake of the elect they will be cut short.”
  - range: 23-31
    heading: False Christs, and the coming of the Son of Man
    plain: |
      “Then if anyone says to you, ‘Look, here is the Christ,’ or ‘There He is,’ do not believe it. False Christs and false prophets will appear and perform great signs and wonders to deceive, if it were possible, even the elect. See, I have told you ahead of time. So if they tell you, ‘He is out in the desert,’ do not go out; or, ‘He is in the inner rooms,’ do not believe it. For as the lightning comes from the east and shines as far as the west, so will the coming of the Son of Man be. Wherever there is a carcass, there the eagles will gather. Right after the distress of those days the sun will be darkened, the moon will not give its light, the stars will fall from the sky, and the powers of heaven will be shaken. Then the sign of the Son of Man will appear in heaven, and all the tribes of the earth will mourn; they will see the Son of Man coming on the clouds of heaven with power and great glory. He will send His angels with a loud trumpet call, and they will gather His elect from the four winds, from one end of heaven to the other.”
  - range: 32-36
    heading: The fig tree, and the day no one knows
    plain: |
      “Learn this lesson from the fig tree: when its branch becomes tender and puts out leaves, you know summer is near. In the same way, when you see all these things, you know that it is near, right at the door. I tell you truly, this generation will not pass away until all these things have happened. Heaven and earth will pass away, but my words will never pass away. But about that day and hour no one knows, not even the angels of heaven, but only my Father.”
  - range: 37-44
    heading: As in the days of Noah
    plain: |
      “As it was in the days of Noah, so it will be at the coming of the Son of Man. In the days before the flood, people were eating and drinking, marrying and giving in marriage, up to the day Noah entered the ark, and they knew nothing until the flood came and swept them all away. That is how it will be at the coming of the Son of Man. Two men will be in the field; one will be taken and the other left. Two women will be grinding at the mill; one will be taken and the other left. So keep watch, because you do not know on what day your Lord is coming. Understand this: if the householder had known in what part of the night the thief was coming, he would have stayed awake and would not have let his house be broken into. So you also must be ready, because the Son of Man will come at an hour you do not expect.”
  - range: 45-51
    heading: The faithful and the evil servant
    plain: |
      “Who, then, is the faithful and wise servant whom his master has put in charge of his household, to give them their food at the right time? Blessed is that servant whose master finds him doing so when he returns. I tell you truly, he will put him in charge of everything he owns. But if that servant is wicked and says to himself, ‘My master is staying away a long time,’ and begins to beat his fellow servants and to eat and drink with drunkards, his master will come on a day he does not expect and at an hour he does not know. He will cut him to pieces and assign him a place with the hypocrites, where there will be weeping and grinding of teeth.”

notes:
  - ref: 2
    phrase: There shall not be left here one stone upon another
    kind: history
    title: Not one stone
    body: |
      The prophecy came true in A.D. 70, when the Romans destroyed the temple in the Jewish revolt. The Roman battering rams failed against the massive stones around the temple; fire was finally set to the temple gates, and the sanctuary itself was destroyed. By the Jewish calendar it fell on the ninth of Av, the day traditionally remembered as the day the Babylonians destroyed Solomon’s temple. Joseph Smith’s translation adds “upon this temple” to the prophecy ([[JS—M 1:3]]); the note there explains what the added words aim at.
    sources: [ludlow-first-jewish-revolt, lds-scriptures]
  - ref: 3
    phrase: when shall these things be? and what shall be the sign of thy coming, and of the end of the world?
    kind: structure
    title: Two questions, and which signs answer which
    body: |
      The disciples ask two questions at once, and Matthew’s chapter can be read as one answer to both. The first, “when shall these things be?”, is about the temple Jesus has just said will be thrown down; the second asks for the sign of His coming and of the end of the world. Latter-day Saint readers differ on what the joined questions imply. One reading takes them to show that the disciples understood the temple’s fall would come first and assumed His coming would follow close behind; another, that they wondered whether the two events went together. Either way, His return was far more remote than any of the Twelve realized. In Matthew, as in Mark and Luke, Jesus’s words “can be understood as answering both questions simultaneously,” and the reader is left to ask whether the two events were meant to coincide.

      Joseph Smith’s translation answers that by its order. It takes the questions one after the other: roughly the first half of the sermon concerns the first century and the second half the last days, and the turn falls between verses 22 and 23 of Matthew’s chapter (at [[JS—M 1:21]], “and again”). It also moves some signs and repeats others: the wars, famines, pestilences and earthquakes of verses 6–7, for example, are moved after the turn, which gives them a last-days setting, and the note at [[JS—M 1:29]] sets out the rest. The translation also says what “the end of the world” is, “the destruction of the wicked”; the note at [[JS—M 1:4]] explains it.
    sources: [talmage-jesus-christ-32, jackson-sign-thy-coming, ludlow-first-jewish-revolt, lds-scriptures]
  - ref: 8
    phrase: the beginning of sorrows
    kind: words
    title: The first pains of labor
    body: |
      “Sorrows” here are birth pains. The Greek word, *ōdines*, means “travail-pain, birth-pang,” and in the plural it was used of the dire calamities that Jews of the time expected to come before the Messiah.

      The image says first that the wars, famines and earthquakes of verses 6–7 are only the start: labor pains come before the birth, and, as Jesus has just said, “the end is not yet” (verse 6). One reading carries the image further: labor ends in new life, so the troubles the world passes through are pictured as issuing in a new birth, the “regeneration” Jesus had promised ([[Matt. 19:28]]), as Paul pictures the whole creation that “groaneth and travaileth in pain together” ([[Rom. 8:22]]).
    sources: [thayer, ellicott-matthew]
  - ref: 15
    phrase: the abomination of desolation, spoken of by Daniel the prophet
    kind: scripture
    title: The abomination of desolation
    body: |
      Daniel had foretold “the abomination that maketh desolate” ([[Dan. 11:31]]; [[Dan. 12:11]]); the note at [[Dan. 11:31]] explains what it meant in his own day. Jesus applies the phrase to what was coming on Jerusalem. Conditions of desolation, born of abomination and wickedness, were fulfilled first when the Roman legions under Titus laid siege to the city in A.D. 70. At the same place in the sermon Luke’s account names the sign plainly: “when ye shall see Jerusalem compassed with armies, then know that the desolation thereof is nigh” ([[Luke 21:20]]). The encircling armies were the signal, and whoever would escape was to make haste (verses 16–18). What the abomination itself was, the verse does not say. One Latter-day Saint reading points to the Roman standards, since to Jews the ensigns and images of the Romans were a disgusting abomination; and Josephus reports that when the temple had burned, the soldiers “brought their ensigns to the temple” and there offered “sacrifices to them.”

      The words in parentheses, “whoso readeth, let him understand,” may well be part of the sermon itself: they would bid whoever read Daniel to ponder his words until he recognized their fulfillment in what happened before his eyes. Joseph Smith’s translation gives the prophecy a second fulfillment in the last days ([[JS—M 1:32]]), when Jerusalem will again be under siege. The note at [[JS—M 1:12]] explains how the translation changes who stands in the holy place.
    sources: [bd-abomination-of-desolation, talmage-jesus-christ-32, josephus-war, ellicott-matthew]
  - ref: 20
    phrase: neither on the sabbath day
    kind: history
    title: Not in winter, nor on the Sabbath
    body: |
      Only Matthew has the Sabbath; Mark’s account reads “pray ye that your flight be not in the winter” and stops ([[Mark 13:18]]). One explanation fits a Gospel written for Jews: the Christians of Judea kept the law strictly, and a flight on the Sabbath would have hindered them in two ways: their own scruples would hold them to a Sabbath day’s journey, about a mile, not far enough to escape the danger, and others’ keeping of the Sabbath would put obstacles in their way, such as city gates shut.

      The verses before give rules for what was in the disciples’ power: flee at once, and go back for nothing (verses 16–18). The season and the day were beyond their control, and on this reading those were what they were to pray about. Whether Jerusalem’s Christians did flee before the city fell is taken up in the note at [[JS—M 1:13]].
    sources: [ellicott-matthew, lds-scriptures]
  - ref: 27
    phrase: as the lightning cometh out of the east, and shineth even unto the west
    kind: symbol
    title: No hidden coming
    body: |
      The lightning answers the warning of verses 23–26, against those who would point to a hidden Christ, out in the desert or in an inner room. One Latter-day Saint reading places these deceivers after Jerusalem’s fall, through “a period of unspecified duration,” some luring people into the deserts and others insisting that Christ could be found in secret chambers. The true coming will need no one to point it out: in the day of the Lord’s advent in glory “no man shall be in doubt,” and there will be no room for the rival claims of contending sects. Joseph Smith’s translation compares the coming to “the light of the morning,” which “covereth the whole earth” ([[JS—M 1:26]]).
    sources: [talmage-jesus-christ-32]
  - ref: 28
    phrase: wheresoever the carcase is, there will the eagles be gathered together
    kind: symbol
    title: The carcase and the eagles
    body: |
      Matthew leaves the saying about the carcase and the eagles unexplained, and it sounds like a grim proverb; Joseph Smith’s translation gives its meaning. The Greek word for the birds is the usual word for an eagle, but since eagles are said seldom or never to go after carrion, many interpreters take it here of a vulture that resembles one.

      The translation calls the saying a parable and explains it: “so likewise shall mine elect be gathered from the four quarters of the earth” ([[JS—M 1:27]]). The birds flocking together are an image of the gathering of the elect. The note at [[JS—M 1:27]] shows that the translation explains the same saying in Luke the same way.
    sources: [thayer, lds-scriptures]
  - ref: 30
    phrase: they shall see the Son of man coming in the clouds of heaven with power and great glory
    kind: christ
    title: The Son of Man in the clouds of heaven
    body: |
      Jesus describes His coming in the words of Daniel’s vision, in which “one like the Son of man came with the clouds of heaven” and was given “dominion, and glory, and a kingdom” ([[Dan. 7:13–14]]); the site’s note at [[Dan. 7:13]] explains that vision. The verse does not say what “the sign of the Son of man,” earlier in the verse, will be. Modern revelation speaks of “a great sign in heaven” that “all people shall see” together ([[D&C 88:93]]), and Joseph Smith taught in 1843 that the Son of Man “will come as the sign of coming of the son of man”: on that teaching the sign is His own coming. The note at [[JS—M 1:36]] gives more of his words.
    sources: [jsp-discourse-1843-04-06-b, lds-scriptures]
  - ref: 34
    phrase: This generation shall not pass, till all these things be fulfilled
    kind: words
    title: Which generation
    body: |
      In its ordinary sense a “generation” is the people living at a given time, and in that sense the verse seems to promise that everything in the chapter would happen while the disciples lived. Part of it did. As far as the prophecies concerned the overthrow of Jerusalem, they were literally fulfilled within the lifetime of several of the apostles and many of their contemporaries. For the prophecies of His second coming, one Latter-day Saint reading takes the generation to be that of those who see their fulfillment begin.

      Joseph Smith’s translation writes that reading into the verse: “this generation, in which these things shall be shown forth” ([[JS—M 1:34]]). The revelation of March 1831 likewise speaks of a generation for each fulfillment, one for the Jews of Jerusalem and one for the last days ([[D&C 45:21]]; [[D&C 45:30]]); the note at [[JS—M 1:34]] sets them beside the translation.
    sources: [ellicott-matthew, talmage-jesus-christ-32, lds-scriptures]
  - ref: 36
    phrase: of that day and hour knoweth no man
    kind: christ
    title: Not even the Son
    body: |
      Mark’s account of this verse adds words Matthew’s does not have: “neither the Son, but the Father” ([[Mark 13:32]]). In one Latter-day Saint reading, the words mean just what they say: while in the flesh Jesus laid no claim to knowing all things, and whatever He wished to know He learned through communion with the Father. When He spoke on the Mount of Olives He did not know the day of His own return, “for He so states.” Before His ascension He told the apostles again, “It is not for you to know the times or the seasons, which the Father hath put in his own power” ([[Acts 1:7]]).

      The day has not been revealed to anyone since. What the Lord has revealed to His prophets are the events and signs that will come before it.
    sources: [talmage-jesus-christ-32, topics-second-coming]
  - ref: 37
    phrase: as the days of Noe were
    kind: scripture
    title: As in the days of Noah
    body: |
      The comparison with Noah’s day (Noe is the Greek form of his name) is about being caught unaware. In spite of prophecy and warning, people went on with their feasting, “eating and drinking, marrying and giving in marriage,” and “knew not until the flood came” (verses 38–39). So, in one Latter-day Saint reading, the Lord’s advent is to be “sudden and unexpected to the unobserving and sinful world, but in immediate sequence to the signs which the vigilant and devout may read and understand.”

      Verses 40–41 do not say where the one is “taken.” One Latter-day Saint reading answers from the revelation that the Saints alive at His coming “shall be quickened and be caught up to meet him” ([[D&C 88:96]]); the note at [[JS—M 1:44]] gives it.
    sources: [lds-scriptures, talmage-jesus-christ-32, ogden-prophecies-jsm]
  - ref: 43
    phrase: would not have suffered his house to be broken up
    kind: words
    title: The householder and the thief
    body: |
      Three words in the saying about the householder and the thief need explaining: “goodman,” “broken up” and “watch.” The “goodman of the house” is the householder, the master of the house, as in the parable of the laborers ([[Matt. 20:1]]). “Broken up” translates a Greek verb meaning “to dig through” a house, as in “In the dark they dig through houses” ([[Job 24:16]]). A “watch” was a part of the night, which was divided into four watches of three hours each.

      The figure of the thief seems to have passed into a saying. Paul writes that “the day of the Lord so cometh as a thief in the night” ([[1 Thes. 5:2]]).
    sources: [ellicott-matthew, thayer]
  - ref: 48
    phrase: My lord delayeth his coming
    kind: scripture
    title: '“My lord delayeth his coming”'
    body: |
      The evil servant does not deny that his lord will come; he says in his heart that his lord delays, and acts on it, beating his fellow servants and drinking with the drunken (verse 49). In the revelation of March 1831, in which the Lord drew extensively on this sermon, the same words are given to the world before His coming: men’s hearts shall fail them, “and they shall say that Christ delayeth his coming until the end of the earth” ([[D&C 45:26]]).

      What the faithful servant’s “meat in due season” is, and why the other is “cut asunder,” is explained at [[JS—M 1:54]]. In Matthew the parables of readiness do not end here: the ten virgins, the talents, and the sheep and the goats follow in [[Matt. 25]].
    sources: [sc-knowhy-790, lds-scriptures]

christ: |
  The sermon’s signs lead up to one event: “they shall see the Son of man coming in the clouds of heaven with power and great glory” (verse 30). The disciples asked Him when, and His answer is a string of warnings: “Take heed that no man deceive you” (verse 4), “Watch therefore” (verse 42), “be ye also ready” (verse 44).

  The blessing falls on the servant “whom his lord when he cometh shall find so doing” (verse 46). For a disciple now, readiness for the Lord’s coming is faithfulness in the charge He has already given, kept through an hour no one knows.

explore: |
  - **The sermon as Joseph Smith revised it.** [[JS—M 1]], with the site’s fuller notes on the discourse.
  - **The same sermon in modern revelation.** [[D&C 45:16–75]], given in March 1831.
  - **Daniel’s visions.** [[Dan. 7:13–14]], the Son of Man in the clouds; [[Dan. 11:31]] and [[Dan. 12:11]], the abomination that makes desolate.
  - *Jesus the Christ*, chapter 32, reads the three accounts of the sermon together, with notes on “this generation” and on the day no one knows.

