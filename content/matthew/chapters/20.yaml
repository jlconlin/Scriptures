chapter: 20
title: The Last First, and the Servant of All
tagline: Jesus answers the disciples’ question about their reward with the parable of the laborers paid alike, foretells His death a third time, turns a request for the highest seats into a lesson on service and ransom, and opens the eyes of two blind men outside Jericho.
when: 'On the last journey to Jerusalem, at and near Jericho, about a week before the Passover'

setting: |
  Matthew 20 continues the journey that began in [[Matt. 19:1]], when Jesus left Galilee for the country “beyond Jordan,” and it ends on the road out of Jericho, with Jerusalem ahead.

  The chapter break hides how closely the opening parable belongs to what came before. Peter had just asked, after the rich young man went away sorrowful, “We have forsaken all, and followed thee; what shall we have therefore?” ([[Matt. 19:27]]). The parable of the laborers was spoken for the Twelve in answer to that question, and only Matthew records it.

  The rest of the chapter has parallels in Mark and Luke. Jesus foretells His death to the Twelve a third time ([[Mark 10:32–34]]; [[Luke 18:31–34]]); the sons of Zebedee ask for the places on His right and left, which Mark tells and Luke does not ([[Mark 10:35–45]]); and blind men are healed at Jericho ([[Mark 10:46–52]]; [[Luke 18:35–43]]). Jericho lay a little less than fifteen miles northeast of Jerusalem, in a valley below sea level, and the road up from it rose to nearly three thousand feet above sea level, a hard last stage of the journey. The great multitude that followed Jesus out of the city was probably made up largely of pilgrims going up to Jerusalem for the Passover, about a week away.

thread: |
  **In the kingdom, the first shall be last and the last first.**

  Jesus says it before the parable of the laborers ([[Matt. 19:30]]) and again after it (verse 16), and the whole chapter works it out. In the vineyard, those who bargained for their wage at dawn are paid last and grumble that the latecomers received as much; the householder has wronged no one, and the eleventh-hour laborers receive a full day’s pay because their master is good. The disciples hardly take it in. Right after Jesus tells them plainly that He goes up to be crucified, the mother of James and John asks that her sons sit on His right hand and His left, seeming to expect, as the first laborers did, to receive more than others.

  Jesus answers by turning greatness upside down: the chief among them is the servant of the rest, as the Son of Man came to minister and to give His life a ransom for many. Then, on the road out of Jericho, two blind beggars whom the crowd tries to silence cry out to the Son of David, are called, healed, and follow Him.

sections:
  - range: 1-16
    heading: The laborers in the vineyard
    plain: |
      “The kingdom of heaven is like a landowner who went out at daybreak to hire workers for his vineyard. He agreed to pay them a denarius, the usual wage for a day’s work, and sent them into his vineyard. About nine in the morning he went out and saw others standing in the marketplace with nothing to do. He told them, ‘You go into the vineyard too, and I will pay you whatever is right,’ and they went. He went out again about noon and about three in the afternoon and did the same. About five o’clock he went out and found still others standing there, and asked them, ‘Why have you been standing here all day doing nothing?’ ‘Because no one has hired us,’ they answered. He said, ‘You go into the vineyard too, and you will receive whatever is right.’

      “When evening came, the owner of the vineyard told his steward, ‘Call the workers and pay them their wages, beginning with the last ones hired and ending with the first.’ The workers hired about five o’clock came, and each received a denarius. When those hired first came, they expected to receive more, but each of them also received a denarius. When they received it, they grumbled against the landowner: ‘These last men worked only one hour, and you have made them equal to us, who have borne the burden of the work and the heat of the day.’ He answered one of them, ‘Friend, I am not being unfair to you. Didn’t you agree with me for a denarius? Take your pay and go. I choose to give this last man the same as I gave you. Don’t I have the right to do what I want with what is mine? Or are you envious because I am generous?’ So the last will be first, and the first will be last; for many are called, but few are chosen.”
  - range: 17-19
    heading: His death foretold a third time
    plain: |
      As Jesus was going up to Jerusalem, He took the twelve disciples aside by themselves on the road and said to them, “We are going up to Jerusalem, and the Son of Man will be betrayed to the chief priests and the scribes. They will condemn Him to death and hand Him over to the Gentiles to be mocked, flogged and crucified. And on the third day He will rise again.”
  - range: 20-28
    heading: The request of James and John
    plain: |
      Then the mother of Zebedee’s sons came to Jesus with her sons, knelt before Him, and asked Him a favor. “What do you want?” He asked. She said, “Grant that these two sons of mine may sit, one at your right hand and the other at your left, in your kingdom.” Jesus answered, “You do not know what you are asking. Can you drink the cup I am going to drink, and be baptized with the baptism I am baptized with?” “We can,” they said. He told them, “You will indeed drink my cup and be baptized with my baptism. But to sit at my right hand and at my left is not mine to give; those places belong to those for whom my Father has prepared them.”

      When the other ten heard about this, they were indignant with the two brothers. Jesus called them together and said, “You know that the rulers of the Gentiles lord it over them, and their great men exercise authority over them. It must not be so among you. Whoever wants to become great among you must be your servant, and whoever wants to be first among you must be your slave, just as the Son of Man did not come to be served, but to serve, and to give His life as a ransom for many.”
  - range: 29-34
    heading: Two blind men at Jericho
    plain: |
      As they were leaving Jericho, a large crowd followed Him. Two blind men were sitting by the roadside, and when they heard that Jesus was passing by, they shouted, “Lord, Son of David, have mercy on us!” The crowd scolded them and told them to be quiet, but they shouted all the louder, “Lord, Son of David, have mercy on us!” Jesus stopped, called them, and asked, “What do you want me to do for you?” “Lord,” they answered, “we want our eyes to be opened.” Jesus was moved with compassion and touched their eyes. Immediately they received their sight, and they followed Him.

notes:
  - ref: 1
    phrase: the kingdom of heaven is like unto a man that is an householder
    kind: structure
    title: The answer to Peter’s question
    body: |
      The parable begins with “For” because it is the second half of an answer already under way. When the rich young man went away sorrowful, Peter asked, “What shall we have therefore?” ([[Matt. 19:27]]). Jesus first promised the Twelve thrones and a hundredfold, then added a warning: “But many that are first shall be last; and the last shall be first” ([[Matt. 19:30]]). The parable explains the warning, and verse 16 repeats it in reverse order to close it. The break between the chapters separates the parable “both from the events which gave occasion to it and from the teaching which it illustrates.”

      So the story was meant first for the Twelve, and it carried a rebuke “of the bargaining spirit in the Lord’s work.” The Twelve had answered His call without any promise of a wage; Peter’s question, with its eye on what they would receive, carried a hint of the hireling’s spirit the parable describes. Those who labor “with thought for the work rather than for the wage” are the ones it commends.
    sources: [lds-scriptures, ellicott-matthew, talmage-jesus-christ-27]
  - ref: 2
    phrase: a penny a day
    kind: words
    title: A penny, a day’s wage
    body: |
      The King James “penny” is misleading to a modern reader. The coin is the Roman denarius, then the common standard of value in Palestine and the usual wage for a day’s work in the fields. The first laborers did not strike a poor bargain: the denarius was “an adequate and just payment.” It was also about all a family had. A laborer and his family could not do much more than live on what he earned that day, so the men left standing in the marketplace were likely facing a day with nothing to eat.
    sources: [talmage-jesus-christ-27, ellicott-matthew, sc-knowhy-670, holland-laborers]
  - ref: 6
    phrase: about the eleventh hour
    kind: symbol
    title: The eleventh hour
    body: |
      In our reckoning the householder went out at about six in the morning, again at nine, at noon and at three, and last at about five in the afternoon, when the working day of about twelve hours was all but over. Hiring workers in the marketplace was ordinary practice, but hiring for only part of a day was unusual, and going back four times shows how urgent the work was: there was a harvest to bring in, and more hands were needed as the day went on. The men hired last were not idlers. “That they had not found work earlier in the day was no fault of theirs; they had been ready and willing,” and when they were called they went without asking what they would be paid.

      Latter-day revelation takes up the image. The Lord told two early missionaries, Ezra and Northrop, that “the field is white already to harvest; and it is the eleventh hour, and the last time that I shall call laborers into my vineyard” ([[D&C 33:3]]). Read with that revelation, the eleventh hour can stand for the last days, the final call before the Lord returns; that is an application of the parable, not its first meaning for the Twelve.
    sources: [holland-laborers, talmage-jesus-christ-27, sc-knowhy-670, lds-scriptures]
  - ref: 12
    phrase: thou hast made them equal unto us
    kind: prophets
    title: Equal pay, and no one wronged
    body: |
      The complaint of the first laborers is not that they were underpaid. They received exactly what they had agreed to, so no one was treated unfairly; what galled them was that others had received a full day’s pay for an hour’s work. The steward paid the last first, and so the first saw it all.

      Read as a story of the kingdom, the parable is about the Master’s goodness, not about wages. In that reading the penny stands for eternal life, which no faithful laborer could receive less of and the longest life of labor could not earn more of. It is “a story about God’s goodness, His patience and forgiveness, and the Atonement of the Lord Jesus Christ,” and the wage at best is a free gift: “on the basis of strict accounting who of us is not in debt to God?”
    sources: [talmage-jesus-christ-27, holland-laborers, ellicott-matthew]
  - ref: 15
    phrase: Is thine eye evil, because I am good?
    kind: words
    title: An evil eye is an envious one
    body: |
      “Is thine eye evil” is a Hebrew way of saying “Are you envious?” In the Greek of the verse, “thine eye is evil” means “thou art envious,” and the idiom comes from the Old Testament, where the law warns against letting “thine eye be evil against thy poor brother” by refusing him a loan before the year of release ([[Deut. 15:9]]) and Proverbs speaks of the man that “hath an evil eye” who hastens after riches ([[Prov. 28:22]]). The evil eye looks “with envy and ill will at the prosperity of others.” The question sets the two eyes side by side: the laborer’s eye is evil because the householder is good. Envy of that kind takes nothing from the one envied and costs the envious most, for “we are not diminished when someone else is added upon.”
    sources: [thayer, ellicott-matthew, holland-laborers, lds-scriptures]
  - ref: 16
    phrase: for many be called, but few chosen
    kind: scripture
    title: Called, but not chosen
    body: |
      The last line warns rather than promises. It does not mean that every latecomer will be raised and every early worker demoted: “No general reversal is implied.” Many are called to labor in the Lord’s vineyard, and few so excel as to be chosen for exaltation; even the call to the apostleship guarantees nothing. Judas was called and placed among the first.

      Latter-day revelation repeats the saying and gives the reason some are called and not chosen: “Behold, there are many called, but few are chosen. And why are they not chosen? Because their hearts are set so much upon the things of this world, and aspire to the honors of men” ([[D&C 121:34–35]]). The lesson they fail to learn, the revelation goes on, is that the rights of the priesthood are “inseparably connected with the powers of heaven,” which can be handled “only upon the principles of righteousness” ([[D&C 121:36]]). Jesus repeats the saying after the parable of the wedding feast ([[Matt. 22:14]]), where it stands in closer relation to the story. The better Greek manuscripts lack the clause here, at the end of the parable of the laborers; the King James text, which this site follows, has it, and the warning holds in either place.
    sources: [talmage-jesus-christ-27, lds-scriptures, ellicott-matthew]
  - ref: 19
    phrase: to crucify him
    kind: history
    title: The third foretelling, and the first to name the cross
    body: |
      This is the third time in Matthew that Jesus tells the Twelve of His death ([[Matt. 16:21]]; [[Matt. 17:22–23]]), and it is the most definite. He spoke now “in language of absolute plainness, without metaphor or simile.” He had named Jerusalem and the chief priests and scribes before ([[Matt. 16:21]]); new now are the Gentiles, who will carry out the sentence, and the mocking, the scourging and the crucifixion, as if what had been given in dim outline were now set out stage by stage. In Matthew’s account they were told “of the very manner by which the Lord should die—that the Gentiles should crucify Him.”

      They still did not understand, as Luke says outright ([[Luke 18:34]]). Perhaps, knowing Him to be the Christ, they could not see how such a One could be slain; they may have taken the coming crisis for “the open proclamation of His Messianic dignity, His enthronement as Lord and King.” The request that follows at once shows how far their thoughts were from the cross.
    sources: [talmage-jesus-christ-29, ellicott-matthew]
  - ref: 20
    phrase: the mother of Zebedee’s children
    kind: history
    title: The mother of James and John
    body: |
      The mother of James and John is probably Salome. Matthew names among the women at the cross “the mother of Zebedee’s children” ([[Matt. 27:56]]), where Mark, listing the same group, names Salome ([[Mark 15:40]]). In Mark the brothers make the request themselves ([[Mark 10:35]]); in Matthew she asks first, but Jesus answers the sons, “Ye know not what ye ask,” and it is they who reply.

      Her request was not as strange as it looks. Jesus had just promised that the Twelve would “sit upon twelve thrones, judging the twelve tribes of Israel” ([[Matt. 19:28]]), and those words seem to have fastened on her thoughts and her sons’, crowding out what He said about suffering and death. Her sons had already been favored: James and John were with Peter at the Transfiguration ([[Matt. 17:1]]). She knelt to Him, an act of homage that implied she was speaking to a King. And, little mindful of the parable they had just heard, they seem to have expected to receive more than others. The anger of the ten (verse 24) may have had less to do with the spirit of the request than with the two brothers’ getting in first.
    sources: [talmage-jesus-christ-29, ellicott-matthew, lds-scriptures]
  - ref: 22
    phrase: Are ye able to drink of the cup that I shall drink of
    kind: symbol
    title: The cup and the baptism
    body: |
      The cup and the baptism are both images of what was about to fall on Jesus. Any reader of the Old Testament would recognize a cup as the symbol of a good or evil fortune: the cup that runs over ([[Ps. 23:5]]) or “the wine cup of this fury” ([[Jer. 25:15]]). To be baptized is to be plunged into deep water, and the Psalms speak of trouble as waves and billows that go over a man ([[Ps. 42:7]]). Jesus had already used the image of His coming passion: “I have a baptism to be baptized with; and how am I straitened till it be accomplished!” ([[Luke 12:50]]). The words about the baptism are missing from many of the best Greek manuscripts of Matthew and were probably added to match Mark’s telling ([[Mark 10:38]]); the image itself is Jesus’s own either way.

      The brothers answered “We are able” as men accepting a challenge, with a self-confidence born of not understanding what they accepted. The same cup returns in Gethsemane, “let this cup pass from me” ([[Matt. 26:39]]), and in latter-day revelation the Lord describes the suffering that caused Him to bleed at every pore and says, “would that I might not drink the bitter cup, and shrink” ([[D&C 19:18]]).

      For James the promise came true soonest: he was the first of the Twelve to die for his witness, killed with the sword by Herod ([[Acts 12:2]]).
    sources: [ellicott-matthew, talmage-jesus-christ-29, lds-scriptures]
  - ref: 23
    phrase: is not mine to give
    kind: words
    title: '“Not mine to give”'
    body: |
      The words “it shall be given” were supplied by the translators; the Greek reads, more literally, “is not mine to give, but—to those for whom it hath been prepared by my father.” With the added words the verse can sound as if someone other than Jesus does the giving, and they spoil the construction of the sentence. Without them, the giving and the Father’s preparing go together: on the likeliest reading, Jesus does not say that the places are not His to give, but that He gives them only according to His Father’s will and the laws the Father has fixed. On any reading, the highest places are not handed out on request; they are prepared.
    sources: [ellicott-matthew, greek-nt]
  - ref: 26
    phrase: let him be your minister
    kind: words
    title: Minister and servant
    body: |
      The “minister” of verse 26 is a servant who waits on others. The Greek word, *diakonos*, means one who carries out the commands of another, especially of a master: an attendant. In this saying, and in Mark’s telling of it ([[Mark 10:43]]), it is used figuratively of those who advance others’ interests “even at the sacrifice of their own.” In the next verse “servant” is *doulos*, a slave, a man of servile condition, and “will be chief” means “desires to be” (the footnote). The ladder of the Gentiles, whose rulers domineer over their subjects and whose great men wield authority, is turned over: whoever wants to be great serves, and whoever wants to be first becomes everyone’s slave.

      The disciples had been taught humility before, and had before them the example of their Master, in whose life “service was the only measure of true greatness.” They still dreamed of rank in the kingdom; so He drew the Twelve together and taught them as a father teaches contentious children, ending with Himself as the pattern (verse 28).
    sources: [thayer, talmage-jesus-christ-29, lds-scriptures]
  - ref: 28
    phrase: to give his life a ransom for many
    kind: christ
    title: A ransom for many
    body: |
      A ransom is the price paid to set someone free. The Greek *lytron* was the price paid to release a slave or a captive, or to redeem a life that was forfeit; the Greek Old Testament uses it for the ransom accepted for a man’s life in [[Ex. 21:30]] and for the price of redemption that freed an Israelite who had sold himself into service ([[Lev. 25:48–50]]). Applied to Jesus’s death, it means His life given to free many “from the misery and penalty of their sins.” The small word “for” is stronger in the Greek: *anti*, in the place of. The ransom is paid instead of the many.

      Jesus says it almost in passing, as the last word of a lesson on serving, and it is the first time in Matthew that He states so distinctly what His death would do. He had spoken of saving the lost; now He says the salvation would come by redemption, at the price of His own life. The apostles later spoke of redemption in the same terms, as when Peter wrote of being redeemed “with the precious blood of Christ, as of a lamb without blemish and without spot” ([[1 Pet. 1:19]]). On “Son of man,” see the note at [[Matt. 8:20]].
    sources: [thayer, ellicott-matthew, lds-scriptures]
  - ref: 30
    phrase: two blind men sitting by the way side
    kind: history
    title: Two men, or one?
    body: |
      Matthew tells of two blind men healed as Jesus left Jericho. Mark tells of one, Bartimaeus the son of Timaeus, also as Jesus went out of the city ([[Mark 10:46]]); Luke tells of “a certain blind man” as He came near it ([[Luke 18:35]]). The accounts differ in small things and agree in the main facts, and the differences suggest that each writer recorded the event for himself. As on an earlier occasion, two men are mentioned though only one figures in the detailed account; Mark probably names the one who was better known. That Luke recorded a different miracle is possible but hardly probable.

      “Son of David” was a common title for the Messiah (see the note at [[Matt. 9:27]]), and calling Jesus by it showed faith in Him as the promised King of Israel. The crowd, probably pilgrims on their way to the Passover, seems to have thought the entry of a Prophet about to claim His kingdom no place for two beggars making a scene by the road, and tried to hush them. They cried the louder. All three Gospels give His question in nearly the same words, “What will ye that I shall do unto you?”, and Matthew alone says that He had compassion on them and touched their eyes.
    sources: [talmage-jesus-christ-29, ellicott-matthew]

christ: |
  Matthew 20 shows Jesus Christ as the Son of Man who “came not to be ministered unto, but to minister, and to give his life a ransom for many” (verse 28). He drank the cup He offered the brothers, “the bitter cup” of [[D&C 19:18]], and paid the price that sets the many free; He is also the generous householder who gives the eleventh-hour laborer a full day’s wage. For a disciple now, greatness in His kingdom is measured by service, “the only measure of true greatness,” and what He gives at the end of the day is His gift, not a wage counted by hours. A late start does not shut anyone out: “His concern is for the faith at which you finally arrive, not the hour of the day in which you got there.”

explore: |
  - **The other tellings.** [[Mark 10:32–52]]; [[Luke 18:31–43]].
  - **The question behind the parable.** [[Matt. 19:16–30]], the rich young man and Peter’s “What shall we have therefore?”
  - **The eleventh hour and the called who are not chosen.** [[D&C 33:1–4]]; [[D&C 121:34–46]].
  - **The cup.** [[Matt. 26:36–44]]; [[D&C 19:15–19]].
  - Jeffrey R. Holland, “The Laborers in the Vineyard” (general conference, April 2012), on envy, old grievances and the grace that pays at the end of the day.

