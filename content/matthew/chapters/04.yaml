chapter: 4
title: Tempted in the Wilderness, Light in Galilee
tagline: The newly baptized Son of God is tested by the devil and answers each time from scripture; then He settles in Capernaum, calls four fishermen to follow Him, and goes through Galilee teaching, preaching and healing.
when: 'Soon after Jesus’s baptism, at the beginning of His ministry'

setting: |
  Matthew 4 follows straight on from Jesus’s baptism, where a voice from heaven said, “This is my beloved Son, in whom I am well pleased” ([[Matt. 3:17]]). Matthew, Mark and Luke all tell of the temptation that came next; John does not. Mark gives it two verses ([[Mark 1:12–13]]); Luke gives the three temptations in a different order ([[Luke 4:1–13]]).

  Then the scene moves north. John the Baptist has been put in prison (Matthew tells why in [[Matt. 14:3–4]]), and Jesus makes His home in Capernaum, a town on the north shore of the Sea of Galilee that was also the home of Peter and Andrew. In the order this site follows, the temptation belongs to the preparation for the ministry and the rest of the chapter to its opening in Galilee.

  The chapter ends with a summary: Jesus went about all Galilee “teaching in their synagogues, and preaching the gospel of the kingdom, and healing.” Matthew repeats that sentence almost word for word in [[Matt. 9:35]], and the two verses frame the Sermon on the Mount and the miracles that follow it (see the note on verse 23). Chapter 4 is the doorway into that unit.

thread: |
  **The Son proves what He is by trusting His Father, and then the light goes out to Galilee.**

  The Father has just called Jesus His beloved Son, and the devil opens twice with “If thou be the Son of God” (verses 3, 6). The first two invite Jesus to prove His sonship on the devil’s terms, by feeding Himself and by forcing the Father to rescue Him; the third offers Him the world’s kingdoms for a single act of worship. Each time He answers “It is written,” and every answer comes from Deuteronomy, the book in which Moses recalls Israel’s own testing in the wilderness ([[Deut. 8:2]]). The Son wins by doing what a son does: living by every word that comes from His Father’s mouth.

  The rest of the chapter shows what that obedient Son brings. He goes to Galilee, the land Isaiah had said would see “great light” (verses 14–16), and preaches the message John preached (verse 17). He calls two pairs of brothers from their nets with “Follow me” (verses 18–22), and He goes through Galilee teaching, preaching and healing until crowds follow Him from every side (verses 23–25). Seeing those multitudes, He goes up into a mountain to teach, and the Sermon on the Mount begins ([[Matt. 5:1]]).

sections:
  - range: 1-11
    heading: Three temptations in the wilderness
    plain: |
      Then the Spirit led Jesus up into the wilderness to be tempted by the devil. He fasted forty days and forty nights, and afterward He was hungry. The tempter came and said, “If you are the Son of God, tell these stones to become bread.” Jesus answered, “It is written: People do not live on bread alone, but on every word that comes from the mouth of God.” Then the devil took Him to the holy city and set Him on a high point of the temple, and said, “If you are the Son of God, throw yourself down. For it is written: He will give His angels charge over you, and they will lift you up in their hands so that you will not strike your foot against a stone.” Jesus said to him, “It is also written: Do not put the Lord your God to the test.” Again the devil took Him up a very high mountain and showed Him all the kingdoms of the world and their splendor, and said, “I will give you all of this if you will bow down and worship me.” Then Jesus said, “Go away, Satan! For it is written: Worship the Lord your God, and serve Him only.” Then the devil left Him, and angels came and served Him.
  - range: 12-17
    heading: Light in Galilee
    plain: |
      When Jesus heard that John had been put in prison, He went back to Galilee. He left Nazareth and went to live in Capernaum, on the shore of the lake, in the territory of Zebulun and Naphtali. This fulfilled what the prophet Isaiah had said: “Land of Zebulun and land of Naphtali, the way by the sea, beyond the Jordan, Galilee of the Gentiles: the people who sat in darkness have seen a great light; on those who sat in the land and shadow of death, light has dawned.” From then on Jesus began to preach: “Repent, for the kingdom of heaven is at hand.”
  - range: 18-22
    heading: Fishers of men
    plain: |
      As Jesus walked beside the Sea of Galilee He saw two brothers, Simon (called Peter) and his brother Andrew, throwing a net into the sea, for they were fishermen. He said to them, “Follow me, and I will make you fishers of men.” At once they left their nets and followed Him. Going on from there He saw two other brothers, James and John, the sons of Zebedee, in a boat with their father Zebedee, mending their nets, and He called them. At once they left the boat and their father and followed Him.
  - range: 23-25
    heading: Teaching, preaching and healing
    plain: |
      Jesus went all through Galilee, teaching in their synagogues, preaching the good news of the kingdom, and healing every kind of sickness and disease among the people. News of Him spread through all Syria, and people brought Him all who were sick with various diseases and pains, those possessed by devils, those who had seizures, and the paralyzed, and He healed them. Great crowds followed Him from Galilee, from the Decapolis (the Ten Cities to the east and southeast of the lake), from Jerusalem and Judea, and from beyond the Jordan.

notes:
  - ref: 1
    phrase: Then was Jesus led up of the Spirit into the wilderness
    kind: scripture
    title: Led by the Spirit to be with God
    body: |
      Joseph Smith’s translation says why the Spirit led Jesus into the wilderness: not to meet the devil but “to be with God.” The King James verse can leave a reader wondering why the Spirit would lead anyone to be tempted. The Joseph Smith Translation answers in its first two verses: Jesus went “to be with God,” and only after He “had communed with God” and grown hungry “was left to be tempted of the devil” (JST Matt. 4:1–2, in the footnotes); in verses 5 and 8 too it is the Spirit, not the devil, that carries Him to the pinnacle and the mountain.

      The forty days were preparation, then, before they were trial. Through the long weeks apart Jesus was sustained by “meditation, prayer, and communion with the heavens,” and He fasted “that his mortal body might be completely subjected to the divine influence of his Father’s Spirit,” because “the greatest task ever to be accomplished in this world lay before him, and he needed divine strength.”
    sources: [jst-matt-4, hunter-temptations]
  - ref: 1
    phrase: to be tempted of the devil
    kind: prophets
    title: Could He have given in?
    body: |
      The temptations were real because Jesus could have yielded. “Had there been no possibility of His yielding to the lures of Satan, there would have been no real test in the temptations, no genuine victory in the result.” Jesus was “sinless yet peccable”: He could have sinned had He chosen to. Without that ability He would have been without agency, and before the world was He had offered Himself “to safeguard and insure the agency of man.” Scripture says the same: He “was in all points tempted like as we are, yet without sin” ([[Heb. 4:15]]), and, in latter-day revelation, “He suffered temptations but gave no heed unto them” ([[D&C 20:22]]). An angel had told King Benjamin long before that He would “suffer temptations, and pain of body, hunger, thirst, and fatigue” ([[Mosiah 3:7]]), and because the test was real, its victory reaches others: “in that he himself hath suffered being tempted, he is able to succour them that are tempted” ([[Heb. 2:18]]). “He was perfect and sinless, not because he had to be, but rather because he clearly and determinedly wanted to be.”

      Nor was the wilderness the end of it. Luke closes his account with the devil leaving Jesus only “for a season” ([[Luke 4:13]]), and Jesus’s temptations went on through His ministry and reached even to Gethsemane.
    sources: [talmage-jesus-christ-10, hunter-temptations, lds-scriptures]
  - ref: 2
    phrase: when he had fasted forty days and forty nights
    kind: symbol
    title: Forty days, like Moses and like Israel
    body: |
      The forty days recall two stories from the books of Moses. Moses fasted forty days on Mount Sinai ([[Ex. 34:28]]), and Jesus’s fast is one of many likenesses through which Matthew presents Him as the prophet like Moses whom Moses had promised ([[Deut. 18:15]]). The testing of Jesus in the wilderness after His baptism also recalls Israel’s testing in the wilderness in Deuteronomy, where Moses told the people the LORD had led them forty years “to humble thee, and to prove thee, to know what was in thine heart” ([[Deut. 8:2]]).

      All three of Jesus’s answers to the devil come from Deuteronomy: “Man shall not live by bread alone” from [[Deut. 8:3]], “Thou shalt not tempt the Lord thy God” from [[Deut. 6:16]], and the command to worship and serve the Lord from [[Deut. 6:13]], where the King James Old Testament reads “fear” for “worship.” The site’s notes on Deuteronomy 8:3 and 6:13 explain the words in their first setting.
    sources: [griffin-matthew-portrayal, strathearn-gospels, hunter-temptations, lds-scriptures]
  - ref: 3
    phrase: If thou be the Son of God
    kind: christ
    title: The “if” after the Father’s voice
    body: |
      The devil’s first words question what the Father had just said at the baptism: “This is my beloved Son” ([[Matt. 3:17]]). Satan opens two of his three temptations by attacking that identity, and the hunger gave the attack its edge: why should the Son of God go hungry, if He really was the Son? To turn stones to bread would have been to act on the doubt, and also to eat “in a spectacular way—using his divine powers for selfish purposes,” when that power had been given to Him “not … for personal gratification, but for service to others.”

      Jesus’s answer meets the doubt directly. He lives “by every word that proceedeth out of the mouth of God,” and the word that had just come from God’s mouth was that He was the beloved Son. He did not need to prove it.

      The same taunt came back at the end. At the cross the passers-by said, “If thou be the Son of God, come down from the cross” ([[Matt. 27:40]]). The wilderness temptations foreshadowed that last one, and Jesus withstood it too.
    sources: [griffin-matthew-portrayal, talmage-jesus-christ-10, hunter-temptations]
  - ref: 5
    phrase: setteth him on a pinnacle of the temple
    kind: history
    title: The pinnacle of the temple
    body: |
      The devil’s second temptation asks Jesus to force a rescue from God. The “pinnacle” was a high point on the walls of the Temple Mount, though which one is not certain: traditionally the southeast corner, more than four hundred feet above the bottom of the Kidron Valley, though a few recent researchers prefer the southwest corner.

      The devil now quotes scripture himself, from [[Ps. 91:11–12]], and urges Jesus to throw Himself on the Father’s protection. The temptation was to some dazzling feat that might bring crowds of amazed onlookers and spread His fame as the Messiah. Jesus answers with Moses ([[Deut. 6:16]]): to force a rescue would be to put God to the test. God alone decides when His wonders are worked, and “faith is to precede the miracle; miracles are not to precede the faith.” The note at [[Ps. 91:11]] takes up the psalm and the answer.
    sources: [ogden-jesus-temple, hunter-temptations, talmage-jesus-christ-10]
  - ref: 8
    phrase: an exceeding high mountain
    kind: scripture
    title: Why Luke gives another order
    body: |
      Luke’s different order for the temptations fits his emphasis on Jerusalem and its temple. Matthew’s temptations end on a high mountain; Luke gives the mountain second and ends with the pinnacle of the temple ([[Luke 4:5–12]]). Luke makes Jerusalem and its temple the focus of Jesus’s life and ministry, from the angel’s visit to Zacharias in the temple to the Gospel’s last scene in Jerusalem, and so the Savior’s triumph over the devil comes to its climax there.
    sources: [strathearn-gospels]
  - ref: 9
    phrase: All these things will I give thee, if thou wilt fall down and worship me
    kind: prophets
    title: Kingdoms that were not his to give
    body: |
      In the third temptation the devil offers Jesus kingdoms that were not his to give. He drops the challenge “If thou be the Son of God” and the scripture, and makes a blunt offer of them all. What lay behind the offer is “the proposition that everyone has a price, that material things finally matter most,” the same lie by which Satan led a third of the hosts of heaven away.

      A faithful Son had no need to bargain: by obedience He would inherit “all that my Father hath” ([[D&C 84:38]]), as can any son or daughter of God. “The surest way to lose the blessings of time or eternity is to accept them on Satan’s terms.”
    sources: [hunter-temptations, lds-scriptures]
  - ref: 10
    phrase: Get thee hence, Satan
    kind: scripture
    title: Moses heard the same demand
    body: |
      Latter-day scripture tells of Moses being with God and then confronted by Satan, who makes the same demand. In [[Moses 1:1–11]] Moses speaks with God face to face; then “Satan came tempting him, saying: Moses, son of man, worship me” ([[Moses 1:12]]). Moses answers with the words Jesus uses here: “Worship God, for him only shalt thou serve” and “Get thee hence, Satan” ([[Moses 1:15–16]]). The Joseph Smith Translation of Matthew 4:1 gives Jesus the same sequence, “to be with God” first and the tempter afterward.

      The likeness adds to those through which Matthew presents Jesus as a new Moses (see the note on verse 2), and the difference shows Jesus’s own power over the devil. Jesus overcame all three temptations. Moses commanded Satan to leave three times and failed, and succeeded only on the fourth attempt, when he called on God “in the name of the Only Begotten” ([[Moses 1:21]]).
    sources: [griffin-matthew-portrayal, lds-scriptures]
  - ref: 15
    phrase: Galilee of the Gentiles
    kind: christ
    title: Isaiah’s great light in Galilee
    body: |
      Matthew reads Jesus’s move to Capernaum as the fulfillment of [[Isa. 9:1–2]]. In Isaiah’s day the Assyrians had overrun northern Israel, including the tribal lands of Zebulun and Naphtali in Galilee, and Isaiah promised that the land humbled first would one day be honored, and that its people walking in darkness would see a great light. In its own setting the promise gave Judah hope that the Assyrian conquest would stop, likely a reference to the peace they found under Hezekiah. It also looked further, to a child who would bring light to Galilee ([[Isa. 9:6]]). The notes at [[Isa. 9:1]] explain the prophecy where it was first given.

      Matthew applies it to Jesus and His Galilean home. This mattered because the prophecy that the Messiah would come out of Bethlehem was known ([[Micah 5:2]]), and Jesus, though born there, grew up in Nazareth, which was likely one reason Nathanael doubted Him: “Can there any good thing come out of Nazareth?” ([[John 1:46]]). Isaiah 9 gave at least one text suggesting that the Messiah would be tied to Galilee too. Capernaum, where Jesus now made His home, lay on the north shore of the Sea of Galilee and was one of the most prosperous and crowded districts in the land. Many of His miracles were done there, though in the end He rebuked the town for rejecting Him ([[Matt. 11:23]]).
    sources: [sc-knowhy-869, bd-capernaum]
  - ref: 19
    phrase: I will make you fishers of men
    kind: christ
    title: Fishers of men
    body: |
      Jesus turns the brothers’ trade into a picture of their new calling: men who had gathered fish would now gather people. Luke gives the saying to Peter as “from henceforth thou shalt catch men” ([[Luke 5:10]]), and the verb there, *zōgreō*, is made from the word for “alive” and in its first sense means “to take alive”; in Luke’s verse it means to win people’s souls “for the kingdom of God” by teaching. 
      The Joseph Smith Translation adds a sentence before the call: “I am he of whom it is written by the prophets; follow me, and I will make you fishers of men” (JST Matt. 4:18). It makes the call an open witness that the Christ the prophets had written of was now among the people.
    sources: [thayer, jst-matt-4, millet-js-matthew]
  - ref: 20
    phrase: they straightway left their nets, and followed him
    kind: history
    title: They had met Him before
    body: |
      Matthew tells the call as if Jesus and the fishermen met for the first time at the lake, but John’s Gospel tells of an earlier meeting at the Jordan. There two of the Baptist’s disciples heard him call Jesus the Lamb of God and followed Him. One was Andrew, who then brought his brother Simon to Jesus ([[John 1:35–42]]); the other is not named, and is probably John the son of Zebedee. So the call by the lake came to men who already knew Jesus.

      What they left was real. Matthew and Mark say nothing of the great catch of fish that Luke tells with the call ([[Luke 5:1–11]]); they tell only the call and what was left behind: nets, a boat, and in James and John’s case their father. The fisheries on the Sea of Galilee were a great source of wealth with a large export trade, and John, whose father had hired servants in the boat ([[Mark 1:20]]), was a fisherman in fairly comfortable circumstances.
    sources: [bd-andrew, bd-john, bd-galilee]
  - ref: 23
    phrase: teaching in their synagogues, and preaching the gospel of the kingdom, and healing all manner of sickness and all manner of disease among the people
    kind: structure
    title: A frame around the Sermon and the miracles
    body: |
      This verse is one half of a pair. [[Matt. 9:35]] repeats it almost word for word, and the two verses act as bookends: everything between them, the Sermon on the Mount in chapters 5–7 and the miracles of chapters 8–9, belongs to one unit. Here the chapter break interrupts Matthew’s design. Read together, the sermon and the miracles show Jesus as the Messiah in word and in deed.

      “Their synagogues” is Matthew’s way of speaking; in his own narration he always calls the synagogue “their” or “your” synagogue, which may reflect tension between his first readers and the synagogue.
    sources: [strathearn-matthew-editor]
  - ref: 24
    phrase: those which were lunatic
    kind: words
    title: '“Lunatic”: moon-struck'
    body: |
      “Lunatic” here does not mean insane in the modern sense. The Greek verb, *selēniazomai*, comes from the word for “moon” and means literally to be “moon-struck.” In use it meant to be epileptic, since epilepsy was supposed to return and grow worse as the moon waxed. Matthew uses the same word for the boy who often fell into the fire and the water ([[Matt. 17:15]]). He lists such sufferers beside those possessed by devils and the paralyzed, and says simply that Jesus “healed them.”
    sources: [thayer]

christ: |
  Matthew 4 shows Jesus Christ as the Son who will not prove His sonship on the devil’s terms. He trusts the Father’s word over hunger, over spectacle, and over the kingdoms of the world, and then goes out as the light Isaiah promised to a land that sat in darkness. He “was in all points tempted like as we are, yet without sin” ([[Heb. 4:15]]). Disciples can take strength from the fact that He was victorious “not as a God but as a man,” and “as with Jesus, so with us, relief comes and miracles are enjoyed after the trial and temptation of our faith.”

explore: |
  - **Moses and Jesus before Satan.** Read [[Moses 1:1–22]] beside verses 1–11.
  - **The three answers in their first setting.** [[Deut. 8:2–3]]; [[Deut. 6:13–16]]; and the tempter’s psalm, [[Ps. 91:11–12]].
  - **The other tellings.** [[Mark 1:12–20]] and [[Luke 4:1–13]]; Luke’s account of the call with the great catch, [[Luke 5:1–11]]; the first meeting at the Jordan, [[John 1:35–42]].
  - **The frame.** Read from verse 23 through [[Matt. 9:35]] as one unit.
  - Elder Howard W. Hunter’s general conference talk “The Temptations of Christ” (October 1976) walks through all three temptations.

