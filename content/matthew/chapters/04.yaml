chapter: 4
title: Tempted in the Wilderness, Light in Galilee
tagline: The newly baptized Son of God is tested by the devil and answers each time from scripture; then He settles in Capernaum, calls four fishermen to follow Him, and goes through Galilee teaching, preaching and healing.
when: 'Soon after Jesus’s baptism, at the beginning of His ministry'

setting: |
  Matthew 4 follows straight on from Jesus’s baptism, where a voice from heaven said, “This is my beloved Son, in whom I am well pleased” ([[Matt. 3:17]]). Matthew, Mark and Luke all tell of the temptation that came next; John does not. Mark gives it two verses ([[Mark 1:12–13]]); Luke gives the three temptations in a different order ([[Luke 4:1–13]]). No one else was in the wilderness, so what happened there must have been told by Jesus Himself.

  Then the scene moves north. John the Baptist has been put in prison (Matthew tells why in [[Matt. 14:3–4]]), and Jesus makes His home in Capernaum, a town on the north shore of the Sea of Galilee that was also the home of Peter and Andrew. In the order this site follows, the temptation belongs to the preparation for the ministry and the rest of the chapter to its opening in Galilee.

  The chapter ends with a summary: Jesus went about all Galilee “teaching in their synagogues, and preaching the gospel of the kingdom, and healing.” Matthew repeats that sentence almost word for word in [[Matt. 9:35]], and the two verses mark everything between them, the Sermon on the Mount (chapters 5–7) and the miracles of chapters 8–9, as one unit. Chapter 4 is the doorway into it.

thread: |
  **The Son proves what He is by trusting His Father, and then the light goes out to Galilee.**

  The Father has just called Jesus His beloved Son, and the devil opens twice with “If thou be the Son of God” (verses 3, 6). Each temptation invites Jesus to prove His sonship on the devil’s terms: feed Himself, force the Father to rescue Him, take the world’s kingdoms by a single act of worship. Each time He answers “It is written,” and every answer comes from Deuteronomy, the book in which Moses recalls Israel’s own testing in the wilderness ([[Deut. 8:2]]). The Son wins by doing what a son does: living by every word that comes from His Father’s mouth.

  The rest of the chapter shows what that obedient Son brings. He goes to Galilee, the land Isaiah had said would see “great light” (verses 14–16), and preaches the message John preached (verse 17). He calls two pairs of brothers from their nets with “Follow me” (verses 18–22), and He goes through Galilee teaching, preaching and healing until crowds follow Him from every side (verses 23–25). Those crowds are the audience of the Sermon on the Mount, which begins in the next verse ([[Matt. 5:1]]).

sections:
  - range: 1-11
    heading: Three temptations in the wilderness
    plain: |
      Then the Spirit led Jesus up into the wilderness to be tempted by the devil. He fasted forty days and forty nights, and afterward He was hungry. The tempter came and said, “If you are the Son of God, tell these stones to become bread.” Jesus answered, “It is written: People do not live on bread alone, but on every word that comes from the mouth of God.” Then the devil took Him to the holy city and set Him on the highest point of the temple, and said, “If you are the Son of God, throw yourself down. For it is written: He will give His angels charge over you, and they will lift you up in their hands so that you will not strike your foot against a stone.” Jesus said to him, “It is also written: Do not put the Lord your God to the test.” Again the devil took Him up a very high mountain and showed Him all the kingdoms of the world and their splendor, and said, “I will give you all of this if you will bow down and worship me.” Then Jesus said, “Go away, Satan! For it is written: Worship the Lord your God, and serve Him only.” Then the devil left Him, and angels came and served Him.
  - range: 12-17
    heading: Light in Galilee
    plain: |
      When Jesus heard that John had been put in prison, He went back to Galilee. He left Nazareth and went to live in Capernaum, on the shore of the lake, in the territory of Zebulun and Naphtali. This fulfilled what the prophet Isaiah had said: “Land of Zebulun and land of Naphtali, the way by the sea, beyond the Jordan, Galilee of the Gentiles: the people who sat in darkness have seen a great light; on those who sat in the land and shadow of death, light has dawned.” From then on Jesus began to preach: “Repent, for the kingdom of heaven is at hand.”
  - range: 18-22
    heading: Fishers of men
    plain: |
      As Jesus walked beside the Sea of Galilee He saw two brothers, Simon (called Peter) and his brother Andrew, throwing a net into the sea, for they were fishermen. He said to them, “Follow me, and I will make you fishers of men.” At once they left their nets and followed Him. Going on from there He saw two other brothers, James and John, the sons of Zebedee, in a boat with their father Zebedee, mending their nets, and He called them. At once they left the boat and their father and followed Him.
  - range: 23-25
    heading: Teaching, preaching and healing
    plain: |
      Jesus went all through Galilee, teaching in their synagogues, preaching the good news of the kingdom, and healing every kind of sickness and disease among the people. News of Him spread through all Syria, and people brought Him all who were sick with various diseases and pains, those possessed by devils, those who had seizures, and the paralyzed, and He healed them. Great crowds followed Him from Galilee, from the Decapolis (the Ten Cities to the east and southeast of the lake), from Jerusalem and Judea, and from beyond the Jordan.

notes:
  - ref: 1
    phrase: Then was Jesus led up of the Spirit into the wilderness
    kind: scripture
    title: Led by the Spirit to be with God
    body: |
      Joseph Smith’s translation says why the Spirit led Jesus into the wilderness: not to meet the devil but “to be with God.” The King James verse can leave a reader wondering why the Spirit would lead anyone to be tempted. The Joseph Smith Translation answers in its first two verses: Jesus went “to be with God,” and only after He “had communed with God” and grown hungry “was left to be tempted of the devil” (JST Matt. 4:1–2, in the footnotes). The same revision runs through the scene. In verses 5 and 8 it is the Spirit, not the devil, that sets Jesus on the pinnacle and takes Him up the mountain, and the devil then “came unto him.” The appendix heading sums it up: “Jesus is led by the Spirit, not by Satan.”

      The forty days were preparation, then, before they were trial. Jesus was drawn by the Spirit away from the distractions of community life, “where He would be free to commune with His God,” and He spent the time in fasting and prayer. He fasted “that his mortal body might be completely subjected to the divine influence of his Father’s Spirit,” because “the greatest task ever to be accomplished in this world lay before him, and he needed divine strength.”
    sources: [jst-matt-4, talmage-jesus-christ-10, hunter-temptations]
  - ref: 1
    phrase: to be tempted of the devil
    kind: prophets
    title: Could He have given in?
    body: |
      The temptations were real because Jesus could have yielded. “Had there been no possibility of His yielding to the lures of Satan, there would have been no real test in the temptations, no genuine victory in the result.” Jesus was “sinless yet peccable,” able to sin had He chosen to, because to be without that ability would have been to be without agency, and He had offered Himself before the world was “to safeguard and insure the agency of man.” Scripture says the same: He “was in all points tempted like as we are, yet without sin” ([[Heb. 4:15]]), and, in latter-day revelation, “He suffered temptations but gave no heed unto them” ([[D&C 20:22]]). “He was perfect and sinless, not because he had to be, but rather because he clearly and determinedly wanted to be.”

      Nor was the wilderness the end of it. Luke closes his account with the devil leaving Jesus only “for a season” ([[Luke 4:13]]), and Jesus’s temptations went on through His ministry and reached even to Gethsemane.
    sources: [talmage-jesus-christ-10, hunter-temptations]
  - ref: 2
    phrase: when he had fasted forty days and forty nights
    kind: symbol
    title: Forty days, like Moses and like Israel
    body: |
      The forty days recall two stories from the books of Moses. Moses fasted forty days on Mount Sinai ([[Ex. 34:28]]), and Jesus’s fast is one of many likenesses through which Matthew presents Him as the prophet like Moses whom Moses had promised ([[Deut. 18:15]]). The testing of Jesus in the wilderness after His baptism also recalls Israel’s testing in the wilderness in Deuteronomy, where Moses told the people the LORD had led them forty years “to humble thee, and to prove thee, to know what was in thine heart” ([[Deut. 8:2]]).

      All three of Jesus’s answers to the devil come from Deuteronomy: “Man shall not live by bread alone” from [[Deut. 8:3]], “Thou shalt not tempt the Lord thy God” from [[Deut. 6:16]], and the command to worship and serve the Lord from [[Deut. 6:13]], where the King James Old Testament reads “fear” for “worship.” The site’s notes on Deuteronomy 8:3 and 6:13 explain the words in their first setting.
    sources: [griffin-matthew-portrayal, strathearn-gospels, hunter-temptations, lds-scriptures]
  - ref: 3
    phrase: If thou be the Son of God
    kind: christ
    title: The “if” after the Father’s voice
    body: |
      The devil’s first words question what the Father had just said at the baptism: “This is my beloved Son” ([[Matt. 3:17]]). Satan opens two of his three temptations by attacking that identity, and the hunger gave the attack its edge: why should the Son of God go hungry, if He really was the Son? To turn stones to bread would have been to act on the doubt, and also to use for Himself a power that had been given to Him “not … for personal gratification, but for service to others.”

      Jesus’s answer meets the doubt directly. He lives “by every word that proceedeth out of the mouth of God,” and the word that had just come from God’s mouth was that He was the beloved Son. He did not need to prove it.

      The same taunt came back at the end. At the cross the passers-by said, “If thou be the Son of God, come down from the cross” ([[Matt. 27:40]]). The wilderness temptations foreshadowed that last one, and Jesus withstood it too.
    sources: [griffin-matthew-portrayal, talmage-jesus-christ-10, hunter-temptations]
  - ref: 5
    phrase: setteth him on a pinnacle of the temple
    kind: history
    title: The pinnacle of the temple
    body: |
      The “pinnacle” was a high point on the walls around Herod’s temple, though which one is not certain. The traditional candidate is the southeast corner of the Temple Mount, the highest point along its walls, with a drop of more than four hundred feet to the bottom of the Kidron Valley. Some recent researchers prefer the southwest corner, which looks out over the city; a stone found in its ruins bears a Hebrew inscription marking the place where a herald stood to blow the trumpet for the coming of holy days.

      The devil now quotes scripture himself, from [[Ps. 91:11–12]], and urges Jesus to throw Himself on the Father’s protection. Jesus answers with Moses ([[Deut. 6:16]]): to force a rescue would be to put God to the test, and God alone decides when His wonders are worked. The note at [[Ps. 91:11]] takes up the psalm and the answer.
    sources: [ogden-jesus-temple, talmage-jesus-christ-10]
  - ref: 8
    phrase: an exceeding high mountain
    kind: scripture
    title: Why Luke gives another order
    body: |
      Matthew’s temptations end on a high mountain; Luke’s end at the temple. Luke gives the mountain second and the pinnacle of the temple third ([[Luke 4:5–12]]). The difference fits Luke’s emphasis. Luke makes Jerusalem and its temple the focus of Jesus’s life and ministry, from the angel’s visit to Zacharias in the temple to the Gospel’s last scene in Jerusalem, and so the Savior’s triumph over the devil comes to its climax there.
    sources: [strathearn-gospels]
  - ref: 9
    phrase: All these things will I give thee, if thou wilt fall down and worship me
    kind: prophets
    title: Kingdoms that were not his to give
    body: |
      In the third temptation the devil drops the challenge “If thou be the Son of God” and the scripture, and makes a blunt offer. The kingdoms were not his to give, yet he offered them all to Jesus. What lay behind the offer is “the proposition that everyone has a price, that material things finally matter most,” the same lie by which Satan led a third of the hosts of heaven away.

      Jesus could, in fact, have gathered the world’s wealth and glory to Himself had He chosen to, and in doing so would have failed in His mission as Messiah, which Satan knew. But a faithful Son had no need to bargain: by obedience He would inherit “all that my Father hath” ([[D&C 84:38]]), as can any son or daughter of God. “The surest way to lose the blessings of time or eternity is to accept them on Satan’s terms.”
    sources: [hunter-temptations, talmage-jesus-christ-10, lds-scriptures]
  - ref: 10
    phrase: Get thee hence, Satan
    kind: scripture
    title: Moses heard the same demand
    body: |
      Latter-day scripture tells of Moses meeting the same demand in the same order: first with God, then confronted by Satan. In [[Moses 1:1–11]] Moses speaks with God face to face; then “Satan came tempting him, saying: Moses, son of man, worship me” ([[Moses 1:12]]). Moses answers with the words Jesus uses here: “Worship God, for him only shalt thou serve” and “Get thee hence, Satan” ([[Moses 1:15–16]]). The Joseph Smith Translation of Matthew 4:1 gives Jesus the same sequence, “to be with God” first and the tempter afterward.

      The likeness belongs to Matthew’s picture of Jesus as a new Moses, and the difference shows Jesus’s own power over the devil. Jesus overcame all three temptations. Moses commanded Satan to leave three times and failed, and succeeded only on the fourth attempt, when he called on God “in the name of the Only Begotten” ([[Moses 1:21]]).
    sources: [griffin-matthew-portrayal, lds-scriptures]
  - ref: 15
    phrase: Galilee of the Gentiles
    kind: christ
    title: Isaiah’s great light in Galilee
    body: |
      Matthew reads Jesus’s move to Capernaum as the fulfillment of [[Isa. 9:1–2]]. In Isaiah’s day the Assyrians had overrun northern Israel, including the tribal lands of Zebulun and Naphtali in Galilee, and Isaiah promised that the land humbled first would one day be honored, and that its people walking in darkness would see a great light. In its own setting the promise gave Judah hope that the Assyrian conquest would stop, likely a reference to the peace they found under Hezekiah. It also looked further, to a child who would bring light to Galilee ([[Isa. 9:6]]). The notes at [[Isa. 9:1]] explain the prophecy where it was first given.

      Matthew applies it to Jesus and His Galilean home. This mattered because the prophecy that the Messiah would come out of Bethlehem was known ([[Micah 5:2]]), and Jesus, though born there, grew up in Nazareth, which was likely one reason Nathanael doubted Him: “Can there any good thing come out of Nazareth?” ([[John 1:46]]). Isaiah 9 gave at least one text suggesting that the Messiah would be tied to Galilee too. Capernaum, where Jesus now made His home, lay on the north shore of the Sea of Galilee and was one of the most prosperous and crowded districts in the land. Many of His miracles were done there, though in the end He rebuked the town for rejecting Him ([[Matt. 11:23]]).
    sources: [sc-knowhy-869, bd-capernaum]
  - ref: 19
    phrase: I will make you fishers of men
    kind: christ
    title: Fishers of men
    body: |
      Jesus turns the brothers’ trade into a picture of their new calling, with one difference that changes everything. Until then they had caught fish, “and the fate of the fish was death”; from then on they were to draw people “to a life eternal.” Luke gives the saying to Peter as “from henceforth thou shalt catch men” ([[Luke 5:10]]), and the verb there, *zōgreō*, is made from the word for “alive” and in its first sense means “to take alive,” which sharpens the same contrast. The image also recalls the Lord’s promise through Jeremiah that in gathering scattered Israel, “I will send for many fishers, saith the LORD, and they shall fish them” ([[Jer. 16:16]]); the note there explains how latter-day prophets read it.

      The Joseph Smith Translation adds a sentence before the call: “I am he of whom it is written by the prophets; follow me, and I will make you fishers of men” (JST Matt. 4:18). It makes the call an open witness that the Christ the prophets had written of was now among the people.
    sources: [talmage-jesus-christ-14, jst-matt-4, millet-js-matthew, thayer]
  - ref: 20
    phrase: they straightway left their nets, and followed him
    kind: history
    title: They had met Him before
    body: |
      Matthew tells the call as if Jesus and the fishermen met for the first time at the lake, but John’s Gospel tells of an earlier meeting at the Jordan. There two of the Baptist’s disciples, Andrew and John, heard the Baptist call Jesus the Lamb of God and followed Him, and Andrew then brought his brother Simon ([[John 1:35–42]]). They seem not to have stayed with Jesus all through the early months, for some of the future apostles were back at their fishing while He taught nearby; Peter was by then already “identified with the Master’s work.” At the lake they left their fishing to follow Him.

      What they left was real. Matthew and Mark say nothing of the great catch of fish that Luke tells with the call ([[Luke 5:1–11]]), and stress the call itself. What they left is named: nets, a boat, and in James and John’s case their father. The fisheries on the Sea of Galilee were a great source of wealth with a large export trade.
    sources: [talmage-jesus-christ-11, talmage-jesus-christ-14, bd-galilee]
  - ref: 23
    phrase: teaching in their synagogues, and preaching the gospel of the kingdom, and healing all manner of sickness and all manner of disease among the people
    kind: structure
    title: A frame around the Sermon and the miracles
    body: |
      This verse is one half of a pair. [[Matt. 9:35]] repeats it almost word for word, and the two verses act as bookends: everything between them, the Sermon on the Mount in chapters 5–7 and the miracles of chapters 8–9, belongs to one unit. Here the chapter break interrupts Matthew’s design. Read together, the sermon and the miracles show Jesus as the Messiah in word and in deed.

      “Their synagogues” is Matthew’s way of speaking; in his own narration he always calls the synagogue “their” or “your” synagogue, which may reflect tension between his first readers and the synagogue.
    sources: [strathearn-matthew-editor]
  - ref: 24
    phrase: those which were lunatic
    kind: words
    title: '“Lunatic”: moon-struck'
    body: |
      “Lunatic” here does not mean insane in the modern sense. The Greek verb, *selēniazomai*, comes from the word for “moon” and means literally to be “moon-struck.” In use it meant to be epileptic, since epilepsy was supposed to return and grow worse as the moon waxed. Matthew uses the same word for the boy who often fell into the fire and the water ([[Matt. 17:15]]). He lists such sufferers beside those possessed by devils and the paralyzed, and says simply that Jesus “healed them.”
    sources: [thayer]

christ: |
  Matthew 4 shows Jesus Christ as the Son who will not prove His sonship on the devil’s terms. He trusts the Father’s word over hunger, over spectacle, and over the kingdoms of the world, and then goes out as the light Isaiah promised to a land that sat in darkness. He “was in all points tempted like as we are, yet without sin” ([[Heb. 4:15]]). Disciples can take strength from the fact that He was victorious “not as a God but as a man,” and, as with Him, relief comes after the trial and temptation of their faith.

explore: |
  - **Moses and Jesus before Satan.** Read [[Moses 1:1–22]] beside verses 1–11.
  - **The three answers in their first setting.** [[Deut. 8:2–3]]; [[Deut. 6:13–16]]; and the tempter’s psalm, [[Ps. 91:11–12]].
  - **The other tellings.** [[Mark 1:12–20]] and [[Luke 4:1–13]]; Luke’s account of the call with the great catch, [[Luke 5:1–11]]; the first meeting at the Jordan, [[John 1:35–42]].
  - **The frame.** Read from verse 23 through [[Matt. 9:35]] as one unit.
  - Elder Howard W. Hunter’s general conference talk “The Temptations of Christ” (October 1976) walks through all three temptations.

