chapter: 19
title: Marriage, Children, and the Rich Young Man
tagline: Leaving Galilee for Judea, Jesus answers a trap about divorce by going back to the creation, lays His hands on little children His disciples would have sent away, and tells a rich young man the one thing he lacks.
when: 'In Perea, beyond the Jordan, on the last journey toward Jerusalem'

setting: |
  “When Jesus had finished these sayings” (verse 1) closes the fourth of Matthew’s five long discourses, the instructions to the disciples about the Church in [[Matt. 18]]; the fifth will come on the Mount of Olives in chapters 24–25. With it Jesus leaves Galilee. He crosses into “the coasts of Judæa beyond Jordan,” the land east of the river called Perea, and from here travels by short stages toward Jerusalem. Matthew, Mark and Luke all tell much of what follows as incidents of this one journey; it is the period of the Perean and Judean ministry.

  Perea belonged to Herod Antipas, the ruler who had put John the Baptist to death ([[Matt. 14:1–12]]), and that matters for the first question put to Jesus here.

  Mark tells the chapter’s three stories in the same order ([[Mark 10:1–31]]). Luke has the blessing of the children and the rich ruler ([[Luke 18:15–30]]). Only Matthew has the saying about eunuchs (verses 10–12), and only Matthew’s answer to Peter carries the promise of twelve thrones (verse 28).

thread: |
  **Who can enter the kingdom, and what it costs.**

  The chapter is three conversations on the road, and each turns on what a person will hold on to. The Pharisees want to know how easily a man may let go of his wife; Jesus answers that God joined the two at the beginning and that letting go was only ever a concession. The disciples would turn little children away as not needing Him; Jesus says the kingdom is made of such, and lays His hands on them, a scene that fits naturally after His words on marriage and the home. Then a young man who says he has kept the commandments cannot let go of his possessions. The one thing he lacked was a willingness to put the kingdom above them.

  The disciples hear it as a door closing: “Who then can be saved?” Jesus’s answer is that what is impossible with men is possible with God, and Peter’s question about reward brings the promise that whatever is left for His sake is returned a hundredfold. The saying about those who have made themselves eunuchs for the kingdom may itself describe the disciples, who, as Peter says, have “forsaken all” to follow Him (verse 27).

sections:
  - range: 1-2
    heading: Leaving Galilee
    plain: |
      When Jesus had finished these teachings, He left Galilee and came into the region of Judea on the other side of the Jordan. Great crowds followed Him, and He healed them there.
  - range: 3-9
    heading: What God has joined
    plain: |
      Some Pharisees came to test Him. “Is it lawful for a man to divorce his wife for any reason at all?” they asked. He answered, “Haven’t you read that the Creator at the beginning made them male and female, and said, ‘For this reason a man will leave his father and mother and hold fast to his wife, and the two will become one flesh’? So they are no longer two but one flesh. What God has joined together, let no one separate.” They said to Him, “Then why did Moses command a man to give his wife a certificate of divorce and send her away?” He replied, “Moses permitted you to divorce your wives because your hearts were hard. But it was not so from the beginning. I tell you, whoever divorces his wife, except for sexual immorality, and marries another commits adultery; and whoever marries a woman so divorced commits adultery.”
  - range: 10-12
    heading: Not all can receive it
    plain: |
      His disciples said to Him, “If that is how it stands between a man and his wife, it is not good to marry.” He answered, “Not everyone can accept this teaching, only those to whom it is given. Some are eunuchs because they were born that way; some were made eunuchs by others; and some have made themselves eunuchs for the sake of the kingdom of heaven. Whoever can accept this, let him accept it.”
  - range: 13-15
    heading: Little children
    plain: |
      Then people brought little children to Him so that He would put His hands on them and pray, but the disciples rebuked them. Jesus said, “Let the little children come to me, and do not stop them, for the kingdom of heaven belongs to such as these.” He laid His hands on them, and then went on from there.
  - range: 16-22
    heading: The rich young man
    plain: |
      A man came up to Him and said, “Good Teacher, what good thing must I do to have eternal life?” Jesus said, “Why do you call me good? No one is good but One, that is, God. If you want to enter into life, keep the commandments.” “Which ones?” he asked. Jesus said, “Do not murder; do not commit adultery; do not steal; do not give false testimony; honor your father and mother; and love your neighbor as yourself.” The young man said, “I have kept all these since I was young. What do I still lack?” Jesus told him, “If you want to be perfect, go, sell what you own and give to the poor, and you will have treasure in heaven; then come, follow me.” When the young man heard this he went away sad, because he had great wealth.
  - range: 23-26
    heading: A camel and a needle
    plain: |
      Then Jesus said to His disciples, “I tell you the truth, it is hard for a rich man to enter the kingdom of heaven. Again I tell you, it is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God.” When the disciples heard this they were astonished and asked, “Then who can be saved?” Jesus looked at them and said, “For people this is impossible, but for God everything is possible.”
  - range: 27-30
    heading: We have left all
    plain: |
      Then Peter answered, “Look, we have left everything and followed you. What will we have?” Jesus said to them, “I tell you the truth: in the renewal of all things, when the Son of Man sits on His glorious throne, you who have followed me will also sit on twelve thrones, judging the twelve tribes of Israel. And everyone who has left houses or brothers or sisters or father or mother or wife or children or lands for my name’s sake will receive a hundred times as much and will inherit eternal life. But many who are first will be last, and the last will be first.”

notes:
  - ref: 3
    phrase: tempting him, and saying unto him, Is it lawful for a man to put away his wife for every cause?
    kind: history
    title: A question meant to trap
    body: |
      The Pharisees’ question was a trap with two jaws. The first was a live dispute among the teachers of the law over what grounds for divorce [[Deut. 24:1]] allowed (the debate between the schools of Shammai and Hillel, explained at [[Matt. 5:32]]). Hillel’s school read it so broadly that childlessness, a quarrelsome wife, or even poor housekeeping were reasons enough; “for every cause” is that position put as a question. If Jesus sided with the stricter view, He might alienate those among the “great multitudes” following Him (verse 2) who held the easier one.

      The second jaw was political. Jesus was now in Perea, Herod Antipas’s territory, and Herod was living in a marriage that John the Baptist had condemned and died for ([[Matt. 14:3–4]]). The questioners may have hoped Jesus would denounce Herod and bring on Himself the fury of Herodias, as John had. Jesus answers neither as a partisan nor as a provocateur; He takes the question back past both Moses and the rabbis to the creation.
    sources: [draper-divorce, frederick-divorce, talmage-jesus-christ-27, talmage-jesus-christ-26]
  - ref: 6
    phrase: What therefore God hath joined together, let not man put asunder
    kind: scripture
    title: What God hath joined
    body: |
      Jesus answers a question about Deuteronomy from Genesis. Instead of debating the wording of [[Deut. 24:1]], He goes to God’s first instructions on marriage: “male and female” ([[Gen. 1:27]]) and “they shall be one flesh” ([[Gen. 2:24]]). Going back to the creation shows marriage to be God’s doing, and Genesis makes the bond between husband and wife weightier even than the bond between children and parents (a man “shall leave his father and his mother,” [[Gen. 2:24]]). Separating what God joined is a human invention, not a command of God; the provision in the law of Moses, as verse 8 shows, was a concession, not God’s design.

      Restoration scripture carries Jesus’s answer further than the Pharisees could have followed. Latter-day Saints understand marriage and family as ordained of God, central to the purposes of mortal life, and potentially eternal ([[D&C 49:15–17]]; [[D&C 131:1–4]]; [[D&C 132:19]]). “What God hath joined” then reaches past death: in the Lord’s temples couples are married for all eternity.
    sources: [frederick-divorce, talmage-jesus-christ-27, ellison-family-celibacy, oaks-divorce]
  - ref: 8
    phrase: Moses because of the hardness of your hearts suffered you to put away your wives
    kind: history
    title: Suffered, not commanded
    body: |
      The Pharisees say Moses “commanded” divorce (verse 7); Jesus corrects the verb: Moses “suffered” it. The law of [[Deut. 24:1–4]] never ordered a man to divorce his wife. It required that if he did send her away, he give her a written bill of divorcement, whose purpose was to leave her free to remarry. That was a concession Moses reluctantly allowed because Israel’s hearts were hard, not a commandment of God, and by appealing to the law itself Jesus stepped out of the rabbis’ debate altogether. (Mark tells the exchange the other way round: Jesus asks what Moses commanded, and they answer that he “suffered” it, [[Mark 10:3–4]].)

      “From the beginning it was not so” sets two standards side by side: what God intended at the creation, and what He tolerated in a hard-hearted people. The next verse states the first as the law of the kingdom.
    sources: [talmage-jesus-christ-27, draper-divorce, frederick-divorce]
  - ref: 9
    phrase: except it be for fornication
    kind: prophets
    title: The higher law and the Church today
    body: |
      Verse 9 states the creation standard as the law of the kingdom, and two questions follow: what kind of rule Jesus was giving, and how the Church applies it now. The one exception, “fornication” (Greek *porneia*), and why remarriage after any other divorce is called adultery, are explained at the same saying in the Sermon on the Mount ([[Matt. 5:32]]).

      Jesus was not laying down a rule for courts. In His day a man “put away” his wife privately, with no judge or hearing, and He answered the Pharisees about that custom. What He did was restore the standing of the wife: woman, made by God’s law a companion and partner to man, had in practice become his slave, and Jesus spoke as her champion.

      The hardness of heart Jesus named still shapes how the Lord applies the standard. Elder Dallin H. Oaks taught that because “of the hardness of [our] hearts,” the Lord “does not currently enforce the consequences of the celestial standard”: He permits divorced persons to marry again without the stain of immorality, and a divorced member who has not committed serious transgressions can become eligible for a temple recommend. The verse states the ideal; it is not a verdict on every person whose marriage has ended.
    sources: [talmage-jesus-christ-27, oaks-divorce]
  - ref: 12
    phrase: which have made themselves eunuchs for the kingdom of heaven’s sake
    kind: words
    title: Eunuchs for the kingdom’s sake
    body: |
      A eunuch was a castrated man; in the courts of the ancient East such men guarded the royal women and were often made trusted officials. Jesus names three kinds: those born unable to marry, those made so by others, and those who “made themselves” so for the kingdom. The third is best understood as figurative, the same kind of overstatement as “if thy right eye offend thee, pluck it out” ([[Matt. 5:29–30]]): it means those who chose not to marry in order to serve the kingdom. Most scholars take “this saying” (verse 11) to be the disciples’ conclusion that it is better not to marry; some take it as the hard teaching of verse 9 that a divorced person should remain single.

      Jesus does not agree with the disciples’ sweeping conclusion. It was true only in the exceptional cases He names; some few gave up marriage to spend all their time and strength in the Lord’s service, and others could not marry, but marriage itself is honorable, “for neither man without woman nor woman without man can be perfect in the Lord’s sight.” The saying may describe the disciples themselves, who had left home and family, at least for a time, to travel with Him, as Peter will say in verse 27.
    sources: [bd-eunuch, ellison-family-celibacy, talmage-jesus-christ-27]
  - ref: 13
    phrase: and the disciples rebuked them
    kind: scripture
    title: Why the disciples turned them away
    body: |
      The Joseph Smith Translation gives the disciples’ reason: they rebuked the parents, “saying, There is no need, for Jesus hath said, Such shall be saved” (JST Matt. 19:13). They thought the children needed nothing from Him. They may also have shared the common view of their time that women and children were of lower standing and had no business seeking His attention.

      Jesus does not deny what the disciples had heard; He denies the conclusion they drew from it. The kingdom is made of “such” as these (verse 14). They were young children: Matthew’s word, *paidia*, was used of a child up to about seven. The Restoration says the same plainly: little children “are whole, for they are not capable of committing sin” ([[Moro. 8:8]]), and those who die before the age of accountability “are saved in the celestial kingdom of heaven” ([[D&C 137:10]]). That they are saved was not a reason to keep them from Him; it was a reason to bless them.
    sources: [jst-matt-19, talmage-jesus-christ-27, korth-reed-little-children, lds-scriptures]
  - ref: 15
    phrase: he laid his hands on them
    kind: scripture
    title: Hands laid on the children
    body: |
      Jesus’s laying His hands on the children was a blessing, which the Restoration keeps as an ordinance distinct from baptism. The parents asked that He “put his hands on them, and pray” (verse 13), and He did. The risen Lord did the same among the Nephites, taking “their little children, one by one,” blessing them and praying to the Father for them ([[3 Ne. 17:21]]). Modern revelation directs members to bring their children to the elders, “who are to lay their hands upon them in the name of Jesus Christ, and bless them in his name” ([[D&C 20:70]]).

      The scene has sometimes been offered as evidence for infant baptism. Nothing in it says so: Jesus blessed the children and went on His way, and the account says nothing of baptizing them. The blessing of a child is not a substitute for baptism, which is for those old enough to understand and repent; Mormon, writing to his son Moroni, calls it “solemn mockery before God” to baptize little children ([[Moro. 8:9]]).
    sources: [lds-scriptures, talmage-jesus-christ-27]
  - ref: 17
    phrase: Why callest thou me good?
    kind: christ
    title: Why callest thou me good?
    body: |
      Jesus is not denying that He is good. The young man seems to have used “Good Master” as a polite compliment rather than as a confession of who Jesus was, and Jesus would not accept the title in that sense. Pointing him to God, the only one good, may well have deepened the young man’s sense of how serious his own question was.

      The modern critical Greek text of Matthew reads differently from the text the King James translators used. Theirs has “Why callest thou me good?” here, as Mark and Luke do ([[Mark 10:18]]; [[Luke 18:19]]); the critical edition has “Why ask you about what is good? Only One is good.” In both readings Jesus turns him to God and then to the commandments.
    sources: [talmage-jesus-christ-27, greek-nt]
  - ref: 21
    phrase: If thou wilt be perfect
    kind: words
    title: Perfect, and the one thing lacking
    body: |
      The young man asks, “What lack I yet?” and Jesus answers with “perfect,” the same Greek word, *teleios*, as in “Be ye therefore perfect” ([[Matt. 5:48]]). It means complete, finished, fully developed, and of a person’s character, one who has reached the full height of virtue. Mark has Jesus say “One thing thou lackest” ([[Mark 10:21]]), and Luke “Yet lackest thou one thing” ([[Luke 18:22]]); Matthew’s word makes the same point from the other side. He speaks without pride, and by his own account he has kept the law strictly; still he is incomplete.

      He had probably expected some one special observance that would bring him to excellence. (Luke calls him a ruler, perhaps a leader of a local synagogue or a member of the Sanhedrin.) Instead Jesus named the thing that held him: the love of his possessions was his besetting weakness, and the remedy was to give them away and follow. That remedy was prescribed for his case. Nothing in the account warrants saying the same treatment is right for every disciple, but where the same weakness shows, the same remedy may be trusted to cure it.
    sources: [thayer, lds-scriptures, talmage-jesus-christ-27]
  - ref: 24
    phrase: It is easier for a camel to go through the eye of a needle
    kind: symbol
    title: A camel through a needle’s eye
    body: |
      The camel and the needle are a deliberate impossibility, a figure of a type familiar to Jesus’s hearers. A common Jewish proverb spoke of something no one would see even in a dream, an elephant passing through the eye of a needle. Two attempts to soften the saying are often repeated. One reads “rope” (Greek *kamilos*) for “camel” (*kamēlos*), since the words differ by a letter; the other supposes a small gate in a city wall called “the needle’s eye,” which a camel could squeeze through only when unloaded. Against the rope, proverbs like the camel and the needle are common in the Talmud; the gate rests on an assertion, and even if it were so it would only add a detail to the picture. Whatever the image, the Lord’s own explanation in the next verse is all the lesson requires: “With men this is impossible.”
    sources: [talmage-jesus-christ-27]
  - ref: 26
    phrase: with God all things are possible
    kind: christ
    title: With God all things are possible
    body: |
      The Joseph Smith Translation says what makes the impossible possible: “With men this is impossible; but if they will forsake all things for my sake, with God whatsoever things I speak are possible” (JST Matt. 19:26). In Mark it names who the saying is about: “With men that trust in riches, it is impossible; but not impossible with men who trust in God and leave all for my sake” (JST Mark 10:26). The barrier is not wealth but trust in it.

      So the saying is not a sentence on the rich. Wealth is a temptation many give in to, but it is no insurmountable barrier to the kingdom.
    sources: [lds-scriptures, talmage-jesus-christ-27]
  - ref: 28
    phrase: in the regeneration when the Son of man shall sit in the throne of his glory
    kind: words
    title: The regeneration and the twelve thrones
    body: |
      “Regeneration” here is not personal rebirth. The Greek *palingenesia* means renewal or re-creation, and in this verse it names the restoration of all things to the perfect state that existed before the Fall, which the Jews expected with the Messiah and the first Christians with Jesus’s return. The Joseph Smith Translation reads “resurrection” in its place (JST Matt. 19:28, in the footnotes), so that the promise looks to the day the dead rise. Either way, the day is still future.

      Restoration scripture confirms the promise and fills in the scene. The Twelve who were with Jesus at Jerusalem will stand at His right hand at His coming “to judge the whole house of Israel, even as many as have loved me and kept my commandments” ([[D&C 29:12]]). The Book of Mormon adds that the Nephites will be judged by the twelve Jesus chose among them, who will in turn be judged by the Twelve chosen at Jerusalem ([[Morm. 3:18–19]]).
    sources: [thayer, lds-scriptures, talmage-jesus-christ-27]
  - ref: 30
    phrase: many that are first shall be last
    kind: scripture
    title: First and last
    body: |
      The promises of verses 28–29 end with a warning. Twelve thrones and a hundredfold were rewards beyond reckoning, and the saying can be read as a caution, so that those who heard them would not count on them too surely, neglect the effort, and grow proud. Peter had just asked “what shall we have therefore?” (verse 27); being first to follow is no guarantee of being first in the end. The parable that opens the next chapter explains the warning and repeats it (see the note on [[Matt. 20:1]]).
    sources: [talmage-jesus-christ-27]

christ: |
  Matthew 19 shows Jesus Christ as the one with whom what is impossible for men becomes possible. He restores marriage to what God made it “from the beginning,” lays His hands on the children His disciples would have sent away, and, when a young man goes away unable to let go of his wealth, tells His disciples that what is impossible with men is possible with God. The Joseph Smith Translation of the saying names the condition: trust in God, not in riches (verse 26). For a disciple now, the question is not how much he has but what he trusts, and Jacob puts the order plainly: “before ye seek for riches, seek ye for the kingdom of God” ([[Jacob 2:18–19]]).

explore: |
  - **The other tellings.** [[Mark 10:1–31]] in the same order; [[Luke 18:15–30]] for the children and the rich ruler.
  - **The creation Jesus quotes.** [[Gen. 1:27]] and [[Gen. 2:24]]; and the law He set beside them, [[Deut. 24:1–4]].
  - **Children in the Restoration.** [[3 Ne. 17:11–25]]; [[Moro. 8:5–24]]; [[D&C 137:10]].
  - **The Twelve as judges.** [[D&C 29:12]]; [[Morm. 3:18–20]].
  - *Jesus the Christ*, chapter 27, tells the journey through Perea with these three stories in order.

