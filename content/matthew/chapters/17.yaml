chapter: 17
title: The Mount of Transfiguration
tagline: On a high mountain Jesus is transfigured before Peter, James and John, and Moses and Elijah appear with Him; below, He heals a boy His disciples could not, foretells His death again, and pays the temple tax with a coin from a fish’s mouth.
when: 'About a week after Peter’s confession at Caesarea Philippi; the Bible Dictionary places it in about October, some six months before the Crucifixion'

setting: |
  Matthew 17 opens “after six days” (verse 1): about a week after Peter confessed Jesus as the Christ at Caesarea Philippi and Jesus promised him the keys of the kingdom of heaven ([[Matt. 16:13–19]]), and said that some standing there would see the Son of Man coming in His kingdom ([[Matt. 16:28]]). The Bible Dictionary places the Transfiguration in about October, some six months before the death of Jesus. The chapter leads to the fourth of Matthew’s five discourses, the sermon on the Church ([[Matt. 18]]).

  The chapter has four scenes. On a mountain Jesus is transfigured before Peter, James and John; at its foot He heals a boy His other disciples could not; in Galilee He foretells His death a second time; and in Capernaum He sends Peter to find the temple tax in a fish’s mouth. Mark and Luke tell the first three ([[Mark 9:2–32]]; [[Luke 9:28–45]]).

  Peter never forgot the mount. Years later he wrote that he and his companions “were eyewitnesses of his majesty” and heard the Father’s voice “when we were with him in the holy mount” ([[2 Pet. 1:16–18]]). Latter-day revelation adds what the Gospels leave out: on the mount the apostles saw a vision of the earth in its future glory, and received the keys of the priesthood (the notes on verses 2 and 3).

thread: |
  **On the mount the Father names His Son; below it, the disciples meet their own weakness and hear again of His death.**

  On the mountain Peter, James and John see Jesus in glory, with Moses and Elijah beside Him: the giver of the law and the representative of the prophets, ministering to Him. The voice from the cloud tells the apostles whom to follow now, “hear ye him,” and there the keys He had promised Peter a week before are given. It is a strengthening on the threshold of the end. Jesus has reached “the verge of the valley of the shadow of death,” and Moses and Elijah speak with Him of “his decease which he should accomplish at Jerusalem” ([[Luke 9:31]]).

  Then the chapter comes down the mountain. At its foot the other disciples have failed to heal a boy, for lack of faith. In Galilee Jesus tells them again that He will be killed and raised, and they are filled with grief. In Capernaum Peter promises that his Master pays the temple tax, and Jesus, who as the Son owes nothing for His Father’s house, pays it anyway rather than give offense: He keeps “His right as the King’s Son” and gives freely what could not be demanded.

sections:
  - range: 1-13
    heading: The Transfiguration
    plain: |
      Six days later Jesus took Peter, James, and James’s brother John, and led them up a high mountain by themselves. There He was transformed before them: His face shone like the sun, and His clothes became as white as light. Suddenly Moses and Elijah appeared to them, talking with Jesus. Peter said to Jesus, “Lord, it is good for us to be here. If you wish, let us make three shelters here, one for you, one for Moses, and one for Elijah.” While he was still speaking, a bright cloud overshadowed them, and a voice from the cloud said, “This is my beloved Son, in whom I am well pleased. Listen to Him.” When the disciples heard it, they fell face down, terrified. But Jesus came and touched them. “Get up,” He said. “Do not be afraid.” When they looked up, they saw no one but Jesus. As they came down the mountain, Jesus commanded them, “Tell no one about the vision until the Son of Man has been raised from the dead.” His disciples asked Him, “Why then do the scribes say that Elias must come first?” Jesus answered, “Elias does come first, and will restore all things. But I tell you that Elias has already come, and they did not recognize him, but did to him whatever they wished. In the same way the Son of Man is going to suffer at their hands.” Then the disciples understood that He was speaking to them about John the Baptist.
  - range: 14-21
    heading: The boy the disciples could not heal
    plain: |
      When they reached the crowd, a man came up to Jesus, knelt before Him, and said, “Lord, have mercy on my son. He is epileptic and suffers terribly; he often falls into the fire, and often into the water. I brought him to your disciples, and they could not heal him.” Jesus answered, “O unbelieving and perverse generation, how long shall I be with you? How long must I bear with you? Bring him here to me.” Jesus rebuked the devil, and it came out of him, and the boy was healed from that hour. Then the disciples came to Jesus privately and asked, “Why could we not cast it out?” He told them, “Because of your unbelief. Truly I tell you, if you have faith like a grain of mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move. Nothing will be impossible for you. But this kind does not go out except by prayer and fasting.”
  - range: 22-23
    heading: His death foretold a second time
    plain: |
      While they were together in Galilee, Jesus said to them, “The Son of Man is going to be betrayed into the hands of men. They will kill Him, and on the third day He will be raised.” And they were filled with grief.
  - range: 24-27
    heading: The tribute money in the fish’s mouth
    plain: |
      When they came to Capernaum, the collectors of the two-drachma temple tax came to Peter and asked, “Doesn’t your teacher pay the tax?” “Yes, He does,” Peter said. When he came into the house, Jesus spoke to him first: “What do you think, Simon? From whom do the kings of the earth collect duties and taxes: from their own sons, or from others?” “From others,” Peter answered. “Then the sons are free,” Jesus said. “But so that we do not offend them, go to the lake and throw out a hook. Take the first fish that comes up, open its mouth, and you will find a coin worth four drachmas. Take it and give it to them for me and for you.”

notes:
  - ref: 1
    phrase: an high mountain apart
    kind: history
    title: A high mountain, and three witnesses
    body: |
      Matthew does not name the mountain. Mount Tabor in Galilee is the old tradition, and in the sixth century three churches were built on its summit. Later study came to prefer Mount Hermon, just beyond Caesarea Philippi, where Jesus had been a week before ([[Matt. 16:13]]); Mark says that after coming down, Jesus and the apostles passed through Galilee ([[Mark 9:30]]). The weight of evidence was judged to favor Hermon, but nothing decisive is known. The “six days” of Matthew and Mark and Luke’s “about an eight days” ([[Luke 9:28]]) are probably the same week counted two ways, without and with the first and last days.

      The three Jesus took were the same three He had taken into the house of Jairus when He raised his daughter ([[Mark 5:37]]), and the same three He would take farther into Gethsemane ([[Matt. 26:37]]). They alone saw His glory on the mount and His agony in the garden.
    sources: [talmage-jesus-christ-23]
  - ref: 2
    phrase: was transfigured before them
    kind: words
    title: Transfigured
    body: |
      The Greek verb, *metamorphoō*, means to be changed into another form; said of Christ here, it means that His appearance was changed and He “was resplendent with a divine brightness.” In Latter-day Saint usage, transfiguration is a temporary change in a person’s appearance and nature, a lifting to a higher spiritual level, “so that they can endure the presence and glory of heavenly beings.” Joseph Smith taught that Peter, James and John were transfigured too, and without that change they could not have withstood the glory before them. Moses said the same of his own vision: “his glory was upon me; and I beheld his face, for I was transfigured before him” ([[Moses 1:11]]).

      What they saw included more than Jesus. A revelation to Joseph Smith speaks of the day “when the earth shall be transfigured, even according to the pattern which was shown unto mine apostles upon the mount” ([[D&C 63:21]]). The mount is most likely this one, and the pattern what the apostles saw there: a vision of the earth as it will appear in its future glorified condition.
    sources: [thayer, gs-transfiguration, skinner-life-jesus, sc-knowhy-795, bd-transfiguration]
  - ref: 3
    phrase: Moses and Elias talking with him
    kind: history
    title: Moses and Elijah
    body: |
      “Elias” is the Greek form of Elijah, and here it can only mean the ancient prophet of 1 and 2 Kings. Moses had given the law, and Elijah stood for the prophets. Elijah had been taken up without dying ([[2 Kgs. 2:11]]), and Moses had not died either, though Deuteronomy reports his death ([[Alma 45:19]]). He was translated, so that he had a body of flesh and bones; a spirit only could not have given the keys to the mortal Peter, James and John, since the Resurrection had not yet taken place.

      Luke gives the subject of their conversation: they “spake of his decease which he should accomplish at Jerusalem” ([[Luke 9:31]]), the death He would freely give, now close ahead; as angels had ministered to Him after the temptation ([[Matt. 4:11]]) and would in Gethsemane ([[Luke 22:43]]), these messengers came to strengthen Him.
    sources: [bd-elias, bd-moses, talmage-jesus-christ-23]
  - ref: 3
    phrase: there appeared unto them
    kind: prophets
    title: The keys given on the mount
    body: |
      Joseph Smith taught that Peter, James and John received the keys of the priesthood on the mount, which the Gospels do not tell. In 1839 he said: “The Priesthood is everlasting. The Savior. Moses. & Elias— gave the Keys to Peter, James & John on the Mount when they were transfigured before him.” These were the keys Jesus had promised Peter a week before ([[Matt. 16:19]], where the note explains the keys). With them Peter, James and John could carry on the work of the kingdom after Jesus left them, and the keys were later given to all the Twelve (see the note on [[Matt. 18:18]]).

      Not everything that happened on the mount has been revealed. The Lord told Joseph Smith that the fulness of the account had not yet been received ([[D&C 63:21]]). What latter-day scripture does give is a similar event: on April 3, 1836, in the Kirtland Temple, Moses, Elias and Elijah conferred keys on Joseph Smith and Oliver Cowdery ([[D&C 110:11–16]]).
    sources: [jsp-discourse-1839-a-richards-p65, bd-transfiguration, sc-knowhy-795]
  - ref: 4
    phrase: let us make here three tabernacles
    kind: history
    title: Three tabernacles
    body: |
      A “tabernacle” here is a booth or shelter. At the Feast of Tabernacles each worshiper built a little booth of woven boughs to retire into for devotion, and the feast was near: it seems to have been approaching as they went up the mountain, and soon after, Jesus went up to Jerusalem for it ([[John 7:2]]; [[John 7:10]]). Peter’s offer suggests he had the feast in mind.

      What he meant by it is less clear, and the other Gospels say he did not know himself: “he wist not what to say; for they were sore afraid” ([[Mark 9:6]]), “not knowing what he said” ([[Luke 9:33]]). Luke adds that Moses and Elijah were leaving as he spoke. So far as the proposal had a purpose, it seems to have been to keep the heavenly visitors from going.
    sources: [talmage-jesus-christ-23, skinner-life-jesus]
  - ref: 5
    phrase: hear ye him
    kind: christ
    title: Hear ye him
    body: |
      The Father’s answer to Peter’s offer is a cloud and a command. The words were for the three apostles. Jesus had already heard His Father’s witness at His baptism ([[Matt. 3:17]], where the note follows the same voice to the Nephites and to Joseph Smith); here Elohim speaks to the disciples, and adds what He did not say at the Jordan, “hear ye him,” that is, hear and obey Him.

      The setting gives the command its weight. Moses and Elijah, the law and the prophets, had just been seen ministering to Jesus. Now the Father points past them: the apostles were to be guided “neither by Moses nor Elijah, but by Him.” The scene also recalls Sinai: on both mountains God met His servant under a cloud, and a face shone ([[Ex. 24:15–16]]; [[Ex. 34:29]]). Matthew presents Jesus as a new Moses through much of his Gospel; on this mountain Moses himself stands beside Him, ministering to Him. When the cloud lifts, the disciples see “no man, save Jesus only” (verse 8).
    sources: [talmage-jesus-christ-23, bd-transfiguration, griffin-matthew-portrayal]
  - ref: 9
    phrase: Tell the vision to no man
    kind: history
    title: Until the Son of man be risen
    body: |
      The charge was complete: not even the rest of the Twelve were to hear of it until after He had risen. The three did not yet understand what they were waiting for. Mark says they went down “questioning one with another what the rising from the dead should mean” ([[Mark 9:10]]); they seem to have had no clear idea yet of what was meant by a resurrection. After the Ascension the silence ended, and Peter told the Church what he had seen ([[2 Pet. 1:16–18]]).
    sources: [talmage-jesus-christ-23]
  - ref: 11
    phrase: Elias truly shall first come, and restore all things
    kind: scripture
    title: Two Eliases
    body: |
      The disciples’ question follows from what they had just seen. As the disciples had understood the scriptures, Elijah was to come before the Messiah came in triumph (Malachi’s promise is [[Mal. 4:5]]); yet here was their Lord in glory, and Elijah only now appearing. Jesus’s answer in the King James text seems to say two things at once: Elias “shall first come,” and Elias “is come already.”

      The Joseph Smith Translation separates them. Elias will come “and restore all things, as the prophets have written”; and Elias has come already, the one of whom Malachi wrote, “Behold, I will send my messenger, and he shall prepare the way before me” ([[Mal. 3:1]]). The disciples then understood “that he spake unto them of John the Baptist, and also of another who should come and restore all things” (JST Matt. 17:10–14, in the appendix). Here “Elias” is a title, not the name of the prophet on the mount: two Eliases were spoken of anciently, a preparer and a restorer. John prepared the way for Jesus, and Jesus Himself was the Restorer, who brought back the gospel and the Melchizedek Priesthood in His day. Latter-day revelation uses the same words of an Elias in the last days, who “must come and restore all things” ([[D&C 77:14]]), and to whom the Lord has “committed the keys of bringing to pass the restoration of all things” ([[D&C 27:6]]). The note at [[Matt. 11:14]] explains the title more fully.

      Malachi’s promise of Elijah himself was not fulfilled by John. Its fulfillment began in the Kirtland Temple on April 3, 1836, when Elijah came and committed his keys to Joseph Smith and Oliver Cowdery ([[D&C 110:13–16]]).
    sources: [jst-matt-17, bd-elias, talmage-jesus-christ-23]
  - ref: 17
    phrase: O faithless and perverse generation
    kind: history
    title: The disciples among the faithless
    body: |
      Jesus’s lament falls first on His own apostles. The boy’s father had brought him to them, and they had failed (verse 16); the rebuke was addressed primarily to them, whether or not to others in the crowd as well. Their failure was public. Mark says scribes were disputing with them when Jesus arrived ([[Mark 9:14]]). The failure evidently brought them taunts and ridicule, and through them it cast doubt on their Master’s power.

      It was a failure the more striking because of what they had done before. Jesus had given them power over unclean spirits and sent them out to cast them out ([[Matt. 10:1]]; [[Matt. 10:8]]), and on that mission, away from Him, they had done it. Now, when He had been gone from them only a day, they could not. (The father calls the boy “lunatic,” which in the Greek means epileptic; the word is explained at [[Matt. 4:24]]. Mark tells far more of the father, who cried, “Lord, I believe; help thou mine unbelief,” [[Mark 9:24]].)
    sources: [talmage-jesus-christ-24, thayer]
  - ref: 20
    phrase: faith as a grain of mustard seed
    kind: symbol
    title: Faith as a grain of mustard seed
    body: |
      The disciples ask why they failed, and the answer is their unbelief. The mustard seed need not mean that a small amount of faith is enough. Read as a comparison of quality rather than quantity, it sets living faith, like a seed, however small, from which a great plant grows, against a lifeless imitation, however showy; what faith can do is then conditioned by how genuine and unmixed it is. The apostles had been told “O ye of little faith” before ([[Matt. 8:26]]; [[Matt. 16:8]]). (The plant itself is explained at [[Matt. 13:32]].)
    sources: [talmage-jesus-christ-24]
  - ref: 21
    phrase: this kind goeth not out but by prayer and fasting
    kind: history
    title: Prayer and fasting
    body: |
      Jesus’s last word on the failure teaches that some evil yields only to a stronger faith, and that prayer and fasting build it. The saying implies degrees both in the power of evil spirits and in what differing degrees of faith can do: the apostles had cast out devils before, but not this one. Fasting practised with prudence, joined to genuine prayer, develops faith and its power for good. The disciples were not yet fasting; Jesus had told those who asked why that His disciples would fast when the bridegroom was taken from them ([[Matt. 9:14–15]]).
    sources: [talmage-jesus-christ-24, ellicott-matthew]
  - ref: 23
    phrase: they were exceeding sorry
    kind: history
    title: Exceeding sorry
    body: |
      This is the second time Jesus tells the Twelve of His death ([[Matt. 16:21]]; the third is [[Matt. 20:18–19]]), and it was the theme of His teaching to them in these months, repeated again and again because they were slow to take it in. Mark says they “understood not that saying, and were afraid to ask him” ([[Mark 9:32]]), and Luke says the same ([[Luke 9:45]]). Matthew says only that they grieved.

      They understood enough to sorrow. Since He first told them, they had been brought, reluctantly, to see His death as certain; His rising on the third day they grasped only dimly. Their sorrow was vague, and they shrank from asking what might make it definite. The mind is slow to search deeply into what it does not want to believe.
    sources: [talmage-jesus-christ-24, talmage-jesus-christ-23, ellicott-matthew]
  - ref: 24
    phrase: Doth not your master pay tribute?
    kind: history
    title: The temple tax
    body: |
      This “tribute” is not the Roman tax. The Greek word is *didrachma*, a two-drachma coin worth half a shekel: the temple rate that the law of Moses required of every Israelite man twenty years old and up, paid into the temple treasury for its services ([[Ex. 30:13–16]]). The law called it “the atonement money,” an offering “to make an atonement for your souls” ([[Ex. 30:16]]). When Jesus speaks in the next verse of the “tribute” kings take, the word is a different one, the word for the Roman poll tax (as in [[Matt. 22:17]]).

      The collectors put their question to Peter, not to Jesus, and it may hide a real doubt whether Jesus owed the tax at all, since priests and rabbis generally claimed to be exempt. Peter answered “Yes” at once, without asking his Master.
    sources: [ellicott-matthew, thayer, talmage-jesus-christ-24]
  - ref: 26
    phrase: Then are the children free
    kind: christ
    title: Then are the children free
    body: |
      Jesus’s question reminds Peter of his own confession and presses it home. Kings do not tax their own sons; and this tax was paid to the temple, the house of God, by a Man whom Peter had confessed a week before as “the Son of the living God” ([[Matt. 16:16]]). The Son owed nothing to His Father’s house.

      Yet He pays. To refuse on purely personal grounds would have been to claim openly, before its time, the title He had just told His disciples not to proclaim ([[Matt. 16:20]]), and it would have offended people who knew Him only as a teacher. To pay without a word, on the other hand, might have looked to the apostles like an admission that He was subject to the temple, and so less than they had confessed Him to be. So He does both: He teaches Peter that He is free, and then gives willingly what could not rightly be demanded of Him.
    sources: [talmage-jesus-christ-24, ellicott-matthew]
  - ref: 27
    phrase: thou shalt find a piece of money
    kind: history
    title: A coin for two
    body: |
      The “piece of money” is a stater, a silver coin of four drachmas, a shekel: exactly the tax for two men. “That take, and give unto them for me and thee,” Jesus says, not “for us.” Even with Peter He kept His place apart, as He would later speak of “my Father, and your Father” ([[John 20:17]]); He was the Son of God in a sense that applied to no one else.

      The coin need not have been anything but an ordinary one dropped in the lake. The miracle was in the knowing: that a fish carried that coin, and that it would be the first to rise to Peter’s hook. Nor was the miracle for Jesus’s own need. No miracle of His is recorded for that, and Peter and his fellow fishermen could have caught and sold enough fish to pay the tax. It answered the lesson of the house instead: the Son paid, and paid from His own dominion over the sea.
    sources: [thayer, talmage-jesus-christ-24]

christ: |
  Matthew 17 shows Jesus Christ in His glory as the Father’s beloved Son, with the law and the prophets standing beside Him and giving way to Him, and then as the Son who comes down the mountain toward Jerusalem to be killed and raised, and who pays what He does not owe. The Father’s command on the mount, “hear ye him,” is the one He gave at Bountiful ([[3 Ne. 11:7]]) and in the grove ([[JS—H 1:17]]), and each of the three times it came to people who were afraid. To hear Him is “to listen with the intent to obey,” and when disciples are surrounded by uncertainty and fear, hearing the Son is what helps them most.

