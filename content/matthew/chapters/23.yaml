chapter: 23
title: Woes on the Scribes and Pharisees
tagline: In the temple courts Jesus warns the crowd and His disciples against the example of the scribes and Pharisees, pronounces woe after woe on the leaders themselves, and ends in a lament over Jerusalem, the city He would have gathered as a hen gathers her chickens.
when: 'In the temple courts at Jerusalem, on the Tuesday of the last week by Mark’s chronology'

setting: |
  Matthew 23 is Jesus’s last public discourse in Matthew. It comes at the end of a day of questions in the temple courts, where the chief priests, Pharisees, Herodians and Sadducees had each tried to catch Him in His words ([[Matt. 22:15–46]]). When none dared ask Him more, He spoke first to His disciples in the hearing of the crowd, then turned to the leaders themselves. At the end of the chapter He leaves the temple and, on the Mount of Olives, foretells its destruction ([[Matt. 24:1–3]]). Joseph Smith’s revision of that discourse begins with this chapter’s last verse ([[JS—M 1:1]]).

  Mark and Luke tell the same moment in three verses: a warning against the scribes who love greetings and chief seats and “devour widows’ houses” ([[Mark 12:38–40]]; [[Luke 20:45–47]]). Matthew expands it, extends it to the Pharisees, and gives the woes in full. Luke has many of the same sayings at a Pharisee’s table earlier in the ministry ([[Luke 11:37–54]]) and the lament over Jerusalem on another occasion ([[Luke 13:34–35]]).

  No Gospel is harsher toward the Jewish leaders than Matthew. His audience, it seems, was in tension with the synagogue; it is “your synagogues” in verse 34. The rebuke is addressed to the scribes and Pharisees of that day, for things the verses name. (Who the Pharisees and scribes were is explained at [[Matt. 3:7]] and [[Matt. 7:29]].)

thread: |
  **Religion worn on the outside, and the heart left undone.**

  The Pharisees were not careless men. Their aim was to bring the holiness of the temple into every home: to eat ordinary meals in the purity of a priest, tithe every herb, wash every cup. Jesus does not mock that aim. He tells His hearers to keep what is taught from Moses’ seat (verse 3), and He says the herbs should be tithed (verse 23). What He condemns, woe after woe, is a gap: between saying and doing, between the outside of the cup and what is in it, between a whitewashed tomb and the bones inside, between honoring dead prophets and killing living ones. A hypocrite in the Greek is an actor, and the chapter keeps returning to what is done “to be seen of men” (verse 5) and to looking righteous “outwardly” (verse 28).

  Two things keep the chapter from being only an indictment. Before the woes, Jesus turns to His own disciples: they are to take no titles, live as brethren, and become great by serving (verses 8–12). And after the woes the voice changes from judgment to grief. The one who has been sending prophets to Jerusalem would have gathered her children “as a hen gathereth her chickens,” and they would not. Because the Pharisees were trying to be righteous, the warning reaches anyone who is trying.

sections:
  - range: 1-12
    heading: Moses’ seat, and one Master
    plain: |
      Then Jesus spoke to the crowd and to His disciples. “The scribes and the Pharisees sit in Moses’ seat, the place of authority to teach the law. So do and keep whatever they tell you; but do not do what they do, because they say one thing and do another. They tie up heavy loads, hard to carry, and put them on other people’s shoulders, but they themselves will not lift a finger to move them. Everything they do is done to be seen by people. They make the scripture cases they wear on forehead and arm broad, and the tassels on their garments long. They love the places of honor at banquets and the best seats in the synagogues, to be greeted with respect in the marketplaces, and to have people call them ‘Rabbi.’ But you are not to be called Rabbi, for you have one Master, the Christ, and you are all brothers. Call no one on earth your father, for you have one Father, who is in heaven. Do not be called masters, for you have one Master, the Christ. The greatest among you must be your servant. Whoever lifts himself up will be brought low, and whoever humbles himself will be lifted up.”
  - range: 13-22
    heading: Woe to the blind guides
    plain: |
      “Woe to you, scribes and Pharisees, you hypocrites! You lock the door of the kingdom of heaven in people’s faces: you do not go in yourselves, and you do not let in those who are trying to enter. Woe to you, hypocrites! You swallow up the houses of widows, and make long prayers for show; you will receive the heavier condemnation. Woe to you, hypocrites! You travel over sea and land to win a single convert, and when he is won, you make him twice as much a child of hell as you are. Woe to you, blind guides! You say, ‘An oath by the temple means nothing, but an oath by the gold of the temple is binding.’ Blind fools! Which is greater, the gold, or the temple that makes the gold holy? You say, ‘An oath by the altar means nothing, but an oath by the gift on the altar is binding.’ Blind! Which is greater, the gift, or the altar that makes the gift holy? So whoever swears by the altar swears by it and by everything on it. Whoever swears by the temple swears by it and by Him who dwells in it. And whoever swears by heaven swears by the throne of God and by Him who sits on it.”
  - range: 23-28
    heading: Woe to those clean outside
    plain: |
      “Woe to you, scribes and Pharisees, hypocrites! You give a tenth of your mint, dill and cumin, and you have abandoned the weightier things of the law: justice, mercy and faith. These you should have done, without leaving the others undone. Blind guides! You strain a gnat out of your drink and swallow a camel. Woe to you, hypocrites! You clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence. Blind Pharisee! First clean the inside of the cup and the dish, and then the outside will be clean too. Woe to you, hypocrites! You are like whitewashed tombs, which look fine on the outside but inside are full of dead men’s bones and everything unclean. In the same way, on the outside you look righteous to people, but inside you are full of hypocrisy and wickedness.”
  - range: 29-36
    heading: The blood of the prophets
    plain: |
      “Woe to you, scribes and Pharisees, hypocrites! You build the tombs of the prophets and decorate the monuments of the righteous, and you say, ‘If we had lived in our fathers’ days, we would not have joined them in shedding the prophets’ blood.’ So you testify against yourselves that you are the children of those who murdered the prophets. Fill up, then, the measure of your fathers! You snakes, you brood of vipers, how will you escape being condemned to hell? Therefore I am sending you prophets, wise men and scribes. Some of them you will kill and crucify, some you will flog in your synagogues and hunt from town to town. So on you will come all the righteous blood shed on the earth, from the blood of righteous Abel to the blood of Zacharias son of Barachias, whom you murdered between the temple and the altar. Truly I tell you, all this will come on this generation.”
  - range: 37-39
    heading: O Jerusalem
    plain: |
      “O Jerusalem, Jerusalem, you who kill the prophets and stone those sent to you! How often I have longed to gather your children together, as a hen gathers her chicks under her wings, and you would not! Look, your house is left to you, desolate. For I tell you, you will not see me again until you say, ‘Blessed is He who comes in the name of the Lord.’”

notes:
  - ref: 2
    phrase: The scribes and the Pharisees sit in Moses’ seat
    kind: history
    title: Keep their teaching, not their example
    body: |
      Jesus does not tell the crowd to ignore the scribes and Pharisees. He tells them to do what they teach and not what they do. The two parties sat in Moses’ seat as the official expounders and administrators of the law. So far as they taught the law, their rule was to be obeyed; the warning was against their example. Matthew’s Jesus is sharp with these leaders but never speaks against the law of Moses itself, and here He appears to uphold teaching that many of Matthew’s first readers, Jewish Christians, would have reverenced for centuries.

      The “heavy burdens” of verse 4 are the other side of the same failure. Tradition had multiplied rules until even the trivial affairs of a day were bound by them, and those who laid the rules on others found reasons to excuse themselves.
    sources: [talmage-jesus-christ-31, griffin-matthew-portrayal]
  - ref: 5
    phrase: they make broad their phylacteries, and enlarge the borders of their garments
    kind: history
    title: Scripture worn to be seen
    body: |
      Phylacteries were small strips of parchment written with passages of the law and enclosed in leather cases, worn on the forehead or the left arm. The law itself asked for them: the words were to be “for a sign unto thee upon thine hand, and for a memorial between thine eyes” ([[Ex. 13:9]]; see also [[Deut. 6:8]]). Among the words they carried was the Shema, “Hear, O Israel” ([[Deut. 6:4–9]]), from which Jesus had just drawn the first and great commandment ([[Matt. 22:37]]). The borders were the fringes the law also commanded, “that ye may look upon it, and remember all the commandments of the Lord, and do them” ([[Num. 15:39]]).

      So Jesus does not fault the phylacteries or the fringes. He faults the way they were made conspicuous. Things given to help a person remember God had been made broad and long so that people would notice. It is the motive He named in the Sermon on the Mount, works done “to be seen of them” ([[Matt. 6:1]]).
    sources: [bd-phylacteries, talmage-jesus-christ-31, lds-scriptures]
  - ref: 8
    phrase: be not ye called Rabbi
    kind: scripture
    title: One Master, and all ye are brethren
    body: |
      Jesus turns from the leaders to His own disciples, and the warning is about titles. “Rabbi,” meaning master or teacher, had become a title so honored that to be a rabbi was thought far above being a priest of God. The men who would carry the Church after Him were not to reach for such titles or the honors that went with them. They were brethren, and their one purpose was to serve their one Master. The verses end on the rule that governs every office in His kingdom: “he that is greatest among you shall be your servant” (verse 11).

      Joseph Smith’s translation rewords verses 9 and 10: “call no one your creator upon the earth, or your heavenly Father; for one is your creator and heavenly Father, even he who is in heaven,” and the one Master is “he whom your heavenly Father sent, which is Christ; for he hath sent him among you that ye might have life” (JST Matt. 23:6–7, in the footnotes).
    sources: [talmage-jesus-christ-31, lds-scriptures]
  - ref: 13
    phrase: But woe unto you, scribes and Pharisees, hypocrites!
    kind: words
    title: 'Woe: grief and warning'
    body: |
      “Woe” is the prophets’ word. The Greek *ouai* is a cry “of grief or of denunciation,” “Alas!” as much as “Woe!”, and the Greek Old Testament uses it chiefly for the Hebrew cries *hoy* and *oy* of the prophets. Jacob’s woes in the Book of Mormon ([[2 Ne. 9:27–38]]) belong to an ancient covenant pattern that names the consequences of breaking covenant; Jesus’s woes here call the scribes and Pharisees to repentance for the ways they had broken the law they taught.

      The first woe is the one the others explain. They “shut up the kingdom of heaven against men” by making learning in the fine points of the law the measure of piety, so that the common people, who could not master it, were counted unacceptable to God. Leaders who should have opened the door stood in it.
    sources: [thayer, sc-knowhy-35, talmage-jesus-christ-31]
  - ref: 15
    phrase: to make one proselyte
    kind: history
    title: Converts made worse
    body: |
      A proselyte was a Gentile who had been brought fully into Israel, by circumcision, baptism and a sacrifice, and was expected to keep the whole law of Moses. Such converts were probably few, though they were sought with great zeal. Jesus may have meant converts won to the Pharisees’ own party as much as converts from among the Gentiles.

      The woe is about what the convert became. Joseph Smith’s translation makes the comparison plain: he was made twofold more the child of hell “than he was before, like unto yourselves” (JST Matt. 23:12, in the footnotes).
    sources: [bd-proselytes, talmage-jesus-christ-31, lds-scriptures]
  - ref: 16
    phrase: Whosoever shall swear by the temple, it is nothing
    kind: history
    title: Oaths with loopholes
    body: |
      Verses 16–22 answer the question of why anyone would think an oath by the temple meant nothing. The rulings of the schools had made some oaths binding and others not, on technical grounds. An oath by the temple could be set aside, but one by the temple’s gold bound the swearer; an oath by the altar could be annulled, but one by the gift on it could not. The rules gave a careful man a way to swear and not be held to it.

      Jesus answers that every oath reaches God. The temple makes the gold holy, the altar the gift, and whoever swears by heaven swears by Him who sits on its throne. In the Sermon on the Mount He had asked His disciples not to swear at all ([[Matt. 5:34–37]]); of those who still swore He required that they keep their word, without quibbling.
    sources: [talmage-jesus-christ-31]
  - ref: 23
    phrase: have omitted the weightier matters of the law, judgment, mercy, and faith
    kind: history
    title: Tithing the herbs, leaving mercy
    body: |
      Tithing mint, dill (the King James “anise”) and cumin was part of the Pharisees’ program of holiness: for them a meal was ritually acceptable only if its tithe had been properly paid. The law of Moses named grain, wine and oil ([[Deut. 12:17]]); the careful Pharisee went further and set aside every tenth sprig of his garden herbs. Jesus does not blame that. He says it ought to have been done, and “not to leave the other undone.” What He condemned was letting the small duty take the place of the great ones. The woe is aimed not at the Pharisees’ practices but at what they still lacked, judgment, mercy and faith: sins of omission were what barred the way to true holiness.
    sources: [lane-hostility, ellicott-matthew, talmage-jesus-christ-31]
  - ref: 24
    phrase: strain at a gnat, and swallow a camel
    kind: words
    title: Straining out the gnat
    body: |
      “Strain at” should be read “strain out,” as earlier English versions had it. Devout Jews literally strained what they drank so as not to swallow an insect, which the law counted unclean ([[Lev. 11:23]]). The camel was unclean too ([[Lev. 11:4]]). So the picture is exact: a man filters out the smallest unclean thing and gulps down the largest one whole.
    sources: [ellicott-matthew]
  - ref: 27
    phrase: whited sepulchres
    kind: symbol
    title: Clean cups and whitewashed tombs
    body: |
      The cup and the whitewashed tomb make the same point from the Pharisees’ own concern with purity. They took great care to purify vessels. Jesus did not belittle that care; a cup cleansed to perfection was still filthy before God if what it held had been bought by extortion or served excess. “Cleanse first that which is within” (verse 26) puts the order right.

      The tomb goes further. Under the law, touching a grave made a person unclean ([[Num. 19:16]]), so tombs were whitened to stand out and keep passers-by from defiling themselves without knowing. Jesus turns the custom on the men who kept it: like the tombs, they were bright on the outside and full of death within. In Luke He had compared the Pharisees to graves no one could see ([[Luke 11:44]]); here they are graves no one could miss.
    sources: [lane-hostility, talmage-jesus-christ-31, lds-scriptures]
  - ref: 30
    phrase: If we had been in the days of our fathers
    kind: scripture
    title: Their fathers’ sins and their own
    body: |
      Joseph Smith’s translation explains how the blood of every prophet could come upon one generation (verses 35–36). It adds to verse 36: “Ye bear testimony against your fathers, when ye, yourselves, are partakers of the same wickedness. Behold your fathers did it through ignorance, but ye do not; wherefore, their sins shall be upon your heads” (JST Matt. 23:33–35, in the footnotes). The fathers’ sins would rest on their heads because they did knowingly what their fathers had done through ignorance.

      Building and adorning the prophets’ tombs was a kind of national pride. By claiming they would never have joined their fathers in killing the prophets, the leaders admitted whose children they were. Jesus foretells that they would kill the messengers He was about to send (verse 34), and so prove themselves murderers too. The woes were to fall in that generation, not in some distant age.
    sources: [lds-scriptures, talmage-jesus-christ-31]
  - ref: 35
    phrase: Zacharias son of Barachias
    kind: history
    title: Which Zacharias?
    body: |
      Abel is the first man slain in scripture ([[Gen. 4:8]]). The Zacharias “slain between the temple and the altar” is most likely Zechariah the son of Jehoiada, the priest whom King Joash had stoned “in the court of the house of the Lord” ([[2 Chr. 24:20–22]]). In the Jewish arrangement of the scriptures his murder is the last martyrdom recorded, so the line from Abel to Zacharias may take in every martyr from first to last.

      The father’s name is the difficulty. Barachias (Berechiah) was the father of the prophet Zechariah ([[Zech. 1:1]]), whom the Old Testament does not number among the martyrs, and Luke’s account gives no father’s name ([[Luke 11:51]]). One explanation is that a fuller account of his death stood in scriptures current in Jesus’s day and since lost. Most biblical scholars now take it instead that the two Zechariahs were confused, perhaps by a copyist.

      Some Latter-day Saints have read the verse of John the Baptist’s father. That story comes from later versions of the Protevangelium of James, a noncanonical writing from the second century on. An unsigned 1842 article in the *Times and Seasons* repeated it, and it later appeared in *Teachings of the Prophet Joseph Smith*, but there is no evidence that Joseph Smith wrote or approved the article. John’s father and the martyr of this verse are two different men in the Church’s Bible Dictionary, which refers the martyr to 2 Chronicles 24.
    sources: [talmage-jesus-christ-31, bd-zacharias, ellicott-matthew, wilson-zacharias]
  - ref: 37
    phrase: how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings
    kind: christ
    title: The Lord who sent the prophets
    body: |
      In verse 34 Jesus says, “I send unto you prophets.” The one speaking is Jehovah Himself, answering men who claimed to be better than the fathers who had killed His messengers. In the lament the same voice speaks of His own long effort: “how often would I have gathered thy children.” The prophets Jerusalem stoned had been sent by the one now standing in its temple.

      The Book of Mormon gives the image in three tenses. To the Nephites after the destruction, the Lord says, “how oft have I gathered you,” “how oft would I have gathered you,” and “how oft will I gather you” ([[3 Ne. 10:4–6]]); He uses it again in the latter days ([[D&C 29:2]]; [[D&C 43:24]]). So the hen can stand for the Savior’s long effort to gather His people, and for His Atonement, which shelters them from the consequences of sin and death.

      “And ye would not” states plainly the freedom that can refuse even God’s love. Israel turned away from the protecting wing; the Roman eagle would soon come down on the city.
    sources: [talmage-jesus-christ-31, sc-knowhy-200, ellicott-matthew]
  - ref: 38
    phrase: your house is left unto you desolate
    kind: scripture
    title: The house left, until He comes again
    body: |
      The house is the temple. When He entered the city, Jesus had cleansed it as “My house” ([[Matt. 21:13]]); now it is “your house.” He said this as He was leaving the temple ([[Matt. 24:1]]), and Matthew records no return.

      Yet the last verse holds out a future. “Blessed is he that cometh in the name of the Lord” is [[Ps. 118:26]], the cry of the crowds when He rode into the city ([[Matt. 21:9]]). Joseph Smith’s translation lengthens the verse into a prophecy of His second coming, when the words will be said of Him again as He comes in the clouds of heaven, and makes it the opening of the Mount of Olives discourse; the note at [[JS—M 1:1]] explains the change.
    sources: [ellicott-matthew, talmage-jesus-christ-31, lds-scriptures]

christ: |
  Jesus names Himself the “one Master” (verses 8 and 10), and in the same breath makes the greatest the servant of all. At the end of the chapter the Master speaks as the Lord who sent the prophets and would have sheltered Jerusalem under His wings. The woes speak to every disciple who is trying to be righteous, as the Pharisees were. The commandments are still to be kept, but the weightier matters are “the inward things of the heart, which we know and value intuitively but often neglect for that which is trivial, superficial, or prideful.” The cup is cleansed from within first (verse 26).

explore: |
  - **The other tellings.** [[Mark 12:38–40]] and [[Luke 20:45–47]]; and the woes at a Pharisee’s table, [[Luke 11:37–54]].
  - **The lament.** [[Luke 13:34–35]] and [[Luke 19:41–44]]; the hen in the Book of Mormon, [[3 Ne. 10:4–7]].
  - **What followed.** The Mount of Olives discourse as Joseph Smith revised it, [[JS—M 1]].
  - President James E. Faust, “The Weightier Matters of the Law: Judgment, Mercy, and Faith” (general conference, October 1997).

