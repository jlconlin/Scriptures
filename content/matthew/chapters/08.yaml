  - **Isaiah’s servant and Alma’s witness.** [[Isa. 53:3–5]] beside [[Alma 7:10–13]].
  - **The other tellings.** [[Mark 1:40–45]]; [[Luke 7:1–10]]; [[Mark 4:35–41]]; [[Mark 5:1–20]]; [[Luke 8:22–39]].
  - **The Lord who heals among the Nephites.** [[3 Ne. 17:5–10]].
  - **The frame continues.** Read on through chapter 9 to [[Matt. 9:35]].
  - The essay “Teaching the Four Gospels” (Religious Studies Center, *Learn of Me*) reads Matthew’s storm story closely beside Mark’s and Luke’s.

