chapter: 8
title: Even the Winds and the Sea Obey Him
tagline: Coming down from the mountain, Jesus cleanses a leper, heals a centurion’s servant with a word, heals Peter’s wife’s mother and many more, tells two would-be followers what following costs, stills a storm, and casts devils out of two men among the tombs.
when: 'Jesus’s ministry in Galilee, told by Matthew straight after the Sermon on the Mount'

setting: |
  Matthew 8 opens as Jesus comes down from the mountain where He gave the Sermon on the Mount. The miracles that follow belong with the sermon: [[Matt. 4:23]] and [[Matt. 9:35]] frame chapters 5 through 9 as one unit, Jesus the Messiah in word and in deed (see the note on [[Matt. 4:23]]). Chapter 8 holds the first of the miracles Matthew gathered there.

  The stories are arranged as well as recorded. Mark and Luke tell most of them at other points and in other orders ([[Mark 1:29–45]]; [[Mark 4:35–41]]; [[Mark 5:1–20]]; [[Luke 7:1–10]]). The exchange with two would-be followers in verses 19–22 Luke sets on the road to Jerusalem, where it introduces the sending of the Seventy ([[Luke 9:57–62]]; [[Luke 10:1]]). Matthew puts it just before the storm on the lake, and that placement shapes how the storm is read.

  The chapter begins in Capernaum, Jesus’s home by the Sea of Galilee ([[Matt. 4:13]]), and ends across the lake on its eastern side, in the country of the Gergesenes. Along the way Matthew quotes [[Isa. 53:4]] for the healings at evening.

thread: |
  **The Messiah of the sermon acts, and His word is obeyed.**

  The chapter is full of commands that are carried out. The leper is cleansed at “I will; be thou clean.” The centurion asks for no visit, only a word, and his servant is healed that hour. At evening Jesus casts out spirits “with his word.” On the lake He rebukes the winds and the sea and there is a great calm; on the far shore He says a single word to the devils, “Go.” Having shown Jesus as the Messiah in His teaching, Matthew now shows Him the Messiah in what He does, and the disciples’ question in the boat, “What manner of man is this?”, is the question the whole chapter raises.

  Two other lines run through it. Faith comes from people the reader might not expect: a leper the law had put outside the community, and a Gentile officer whose faith Jesus had not found in Israel. And in the middle Matthew sets two men who offer to follow, then the disciples who follow Him into the ship, so that the storm is read as a lesson about discipleship: those who follow Him meet storms, and the Lord who seems to be asleep is in the boat with them. The chapter ends with a whole city that sees what He has done and asks Him to leave.

sections:
  - range: 1-4
    heading: A leper made clean
    plain: |
      When Jesus came down from the mountain, great crowds followed Him. A leper came and knelt before Him and said, “Lord, if you are willing, you can make me clean.” Jesus reached out His hand and touched him, saying, “I am willing; be clean.” At once his leprosy was gone. Then Jesus said to him, “See that you tell no one. Go and show yourself to the priest, and offer the gift that Moses commanded, as a testimony to them.”
  - range: 5-13
    heading: The centurion’s faith
    plain: |
      When Jesus had come into Capernaum, a centurion, a Roman officer over a hundred soldiers, came to Him and pleaded, “Lord, my servant is lying at home paralyzed and suffering terribly.” Jesus said, “I will come and heal him.” The centurion answered, “Lord, I am not worthy to have you come under my roof. Just say the word, and my servant will be healed. I too am a man under authority, with soldiers under me. I tell one, ‘Go,’ and he goes; another, ‘Come,’ and he comes; and my servant, ‘Do this,’ and he does it.” When Jesus heard this He marveled, and said to those following Him, “Truly I tell you, I have not found such great faith anywhere in Israel. Many will come from the east and the west and sit at table with Abraham, Isaac and Jacob in the kingdom of heaven, but the children of the kingdom will be thrown out into the darkness outside, where there will be weeping and grinding of teeth.” Then Jesus said to the centurion, “Go; as you have believed, so let it be done for you.” And his servant was healed in that very hour.
  - range: 14-17
    heading: Healings in Peter’s house and at evening
    plain: |
      When Jesus came into Peter’s house, He saw Peter’s mother-in-law lying in bed with a fever. He touched her hand, the fever left her, and she got up and served them. That evening people brought Him many who were possessed by devils, and He drove out the spirits with a word and healed all who were sick. This fulfilled what the prophet Isaiah had said: “He Himself took our infirmities and carried our diseases.”
  - range: 18-22
    heading: What following costs
    plain: |
      When Jesus saw great crowds around Him, He gave orders to cross to the other side of the lake. A scribe came and said to Him, “Teacher, I will follow you wherever you go.” Jesus said to him, “Foxes have holes and the birds of the air have nests, but the Son of Man has nowhere to lay His head.” Another of His disciples said, “Lord, let me first go and bury my father.” But Jesus said to him, “Follow me, and let the dead bury their own dead.”
  - range: 23-27
    heading: The storm stilled
    plain: |
      He got into the boat, and His disciples followed Him. Suddenly a great storm arose on the sea, so that the boat was being swamped by the waves; but He was asleep. The disciples came and woke Him, saying, “Lord, save us! We are perishing!” He said to them, “Why are you afraid, you of little faith?” Then He got up and rebuked the winds and the sea, and there was a great calm. The men were amazed and said, “What kind of man is this, that even the winds and the sea obey Him?”
  - range: 28-34
    heading: Devils cast out among the Gergesenes
    plain: |
      When He came to the other side, to the country of the Gergesenes on the eastern shore, two men possessed by devils came out of the tombs to meet Him. They were so violent that no one could travel that road. They cried out, “What do you want with us, Jesus, Son of God? Have you come here to torment us before the appointed time?” Some distance away a large herd of pigs was feeding. The devils begged Him, “If you drive us out, let us go into the herd of pigs.” He said to them, “Go.” They came out and went into the pigs, and the whole herd rushed down the steep bank into the sea and drowned in the water. The herdsmen ran off into the town and reported everything, including what had happened to the men who had been possessed. Then the whole town came out to meet Jesus, and when they saw Him, they begged Him to leave their region.

notes:
  - ref: 2
    phrase: Lord, if thou wilt, thou canst make me clean
    kind: history
    title: Not whether He could, but whether He would
    body: |
      The leper does not doubt Jesus’s power; “if thou wilt, thou canst” asks only whether Jesus will use it for him. That was a great deal to hope for. The law of Moses required a leper to tear his clothes, cry “Unclean, unclean,” and live alone “without the camp” for as long as the disease lasted ([[Lev. 13:45–46]]), so the man lived cut off from Israel’s fellowship. The site’s notes on [[Lev. 13]] explain what “leprosy” meant in the law.

      Jesus answers “if thou wilt” with “I will,” and He answers with His hand before His word. He touched a man who was unclean “both ceremonially and physically”; Mark adds that He was “moved with compassion” ([[Mark 1:41]]). Because leprosy cut a person off from the covenant people, the law’s leper has been read as a type of what sin does to the spirit, and the priest who pronounced him clean and brought him back into fellowship as a type of Christ. In that reading this verse shows the One the priest pointed to touching the outcast and making him clean Himself.
    sources: [talmage-jesus-christ-14, lund-types-symbols, lds-scriptures]
  - ref: 4
    phrase: See thou tell no man; but go thy way, shew thyself to the priest
    kind: history
    title: Why the priest, and why the silence
    body: |
      Jesus sends the healed man to the priest because the law still stood. Leviticus 14 sets out how a priest was to examine a leper who had been healed and, with offerings, bring him back into the community ([[Lev. 14:2–20]]; see the notes there). By sending him, Jesus showed that He had come not to destroy the law but to fulfil it ([[Matt. 5:17]]), and at this stage of His work the fulfilment was not yet complete. Ignoring the law in so serious a matter as restoring an outcast to the community would also have fed a priestly opposition that was already growing.

      The command to tell no one may have had a practical reason besides Jesus’s general avoidance of notoriety: had word of the miracle reached the priests before the man did, they might have put obstacles in the way of his being declared clean. Mark says the man could not keep it to himself, and the crowds grew until Jesus “could no more openly enter into the city” ([[Mark 1:45]]).
    sources: [talmage-jesus-christ-14, lds-scriptures]
  - ref: 5
    phrase: there came unto him a centurion
    kind: history
    title: A Gentile officer in a Jewish village
    body: |
      A centurion was a Roman officer, captain of a hundred men, and this one was posted with the garrison at Capernaum. He was a Gentile in a village that has left no archaeological trace of Gentiles at all: no pig bones, Greek inscriptions or Roman art, which leaves the impression of a village of conservative Jews. Luke has the town’s elders plead for him because “he loveth our nation, and he hath built us a synagogue” ([[Luke 7:5]]); Matthew leaves that praise out, and in his telling the officer comes to Jesus himself. For Matthew the story is one of those that prepare his readers for the gospel’s going to the Gentiles.

      That is why it mattered that Jesus answered at once, “I will come and heal him.” He was willing to go into a Roman’s house despite the stigma of helping the Romans.

      Luke also has the centurion send messengers instead of coming himself ([[Luke 7:3–6]]). The two accounts are not in real conflict: then as now a person could be said to do what he had others do for him, as a man says he built a house that others built at his direction.
    sources: [talmage-jesus-christ-18, grey-peter-capernaum, strathearn-matthew-editor, sc-knowhy-508]
  - ref: 9
    phrase: For I am a man under authority
    kind: christ
    title: Faith that understood authority
    body: |
      The centurion reasons from his own work. He is under the orders of officers above him, he gives orders to soldiers below him, and he does not have to be present to see an order carried out. One with the power Jesus had could surely command and be obeyed from anywhere. He may also have heard how Jesus had healed a nobleman’s dying son in Capernaum with a word spoken miles away ([[John 4:46–53]]). So he asks for no visit, only “the word.”

      Readers have wondered how Jesus could marvel at anything. The Joseph Smith Translation has those who followed Him marvel: “And when they that followed him, heard this, they marveled” (the footnote to verse 10). Read as the King James text has it, the sense is that when the man’s faith was set before Him He dwelt on it, probably as a refreshing contrast to the unbelief He so often met. Mark tells of the other side of that experience: in His own country Jesus “marvelled because of their unbelief” ([[Mark 6:6]]).
    sources: [talmage-jesus-christ-18, lds-scriptures]
  - ref: 11
    phrase: many shall come from the east and west, and shall sit down with Abraham, and Isaac, and Jacob
    kind: scripture
    title: Guests at Abraham’s table
    body: |
      Only Matthew sets this saying beside the centurion; Luke gives it in another setting ([[Luke 13:28–29]]). Placed here, it turns one Gentile’s faith into a promise and a warning. Many from east and west will share the feast of the kingdom with the patriarchs, while “the children of the kingdom,” those who might claim it by birth, are shut out. Matthew’s point is that at times Gentiles show more faith than the covenant people, and they will sit at the feast at the end when many of the house of Israel miss it.

      The saying was hard for those who first heard it. Jews of the day were not used to hearing a Gentile’s faith praised so highly; by the tradition of the day even an earnest Gentile convert counted for less than the least worthy of the chosen people. The lesson is that Israel’s place is held only by righteousness, not by descent. Nephi states the same rule from both sides: “as many of the Gentiles as will repent are the covenant people of the Lord; and as many of the Jews as will not repent shall be cast off” ([[2 Ne. 30:2]]).
    sources: [strathearn-matthew-editor, talmage-jesus-christ-18, lds-scriptures]
  - ref: 14
    phrase: Peter’s house
    kind: history
    title: Peter’s house
    body: |
      A house in Capernaum has long been honored as Peter’s; that it was his is an intriguing possibility that cannot be proved. Mark places Peter’s home in Capernaum ([[Mark 1:21]]; [[Mark 1:29]]), and the verse shows that Peter was married. Beneath an octagonal church of the Byzantine period, excavators found an ordinary dwelling built around the first century BC whose largest room, by about the end of the first century AD, had been given a plastered floor, found nowhere else in the village, and seems to have been used for gatherings rather than daily life.

      It was, at any rate, a house like its neighbors: rooms of rough basalt fieldstone with roofs of beams, reeds and mud, set around a shared courtyard where an extended family lived and worked close together.
    sources: [grey-peter-capernaum, lds-scriptures]
  - ref: 17
    phrase: Himself took our infirmities, and bare our sicknesses
    kind: christ
    title: Isaiah’s servant carries sickness
    body: |
      Matthew reads Jesus’s healings as the fulfilment of [[Isa. 53:4]], and his wording follows Isaiah’s Hebrew more closely than the King James Old Testament does. Where the English of Isaiah has “griefs” and “sorrows,” the Hebrew nouns mean sickness and pain; the note at [[Isa. 53:4]] explains them. The Greek translation of the Old Testament had read them as “sins” and “pain.” Matthew’s Greek, rendered “infirmities” and “sicknesses,” points to bodily illness. In his reading Isaiah’s servant carries the people’s diseases, and the evening at Capernaum, when Jesus “healed all that were sick,” shows Him doing it.

      Alma also cites Isaiah’s words, and carries them to the Atonement. Alma says the Son of God would suffer “that the word might be fulfilled which saith he will take upon him the pains and the sicknesses of his people” ([[Alma 7:11]]), a rendering closer to the Hebrew than either English one. He would take upon Him their infirmities, Alma adds, “that he may know according to the flesh how to succor his people according to their infirmities” ([[Alma 7:12]]). In Isaiah’s words as Alma read them, the servant bears all His people’s sicknesses, bodily ones included, and all their pains, inward ones included. The healings at Capernaum and the suffering of the Atonement are one work.
    sources: [wayment-alma-7-11, sc-knowhy-564, lds-scriptures]
  - ref: 20
    phrase: the Son of man hath not where to lay his head
    kind: christ
    title: The Son of Man with nowhere to lay His head
    body: |
      “The Son of man” is Jesus’s own title for Himself, used here for the first time in Matthew, and in this verse it speaks of His lowliness. The Gospels use it about eighty times, always on His lips and never from anyone else about Him. In the Old Testament “son of man” often means simply “a man,” and Daniel saw “one like the Son of man” receive an everlasting kingdom (see the note at [[Dan. 7:13]]). In Jesus’s use the title carries both lowliness and suffering and the honor of the head of the kingdom and judge of all, and latter-day revelation confirms its sacred sense: the Father’s name is Man of Holiness, “and the name of his Only Begotten is the Son of Man” ([[Moses 6:57]]).

      A scribe offers to follow Jesus anywhere, and few men of the ruling class had yet offered to join Him openly. Jesus neither welcomes him on the strength of his standing nor turns him away curtly; He tells him what following means. Jesus had no fixed home and went wherever His work called Him, and those who followed Him had to be ready to give up the comforts of home when their calling required it. Matthew does not say whether the scribe came.
    sources: [bd-son-of-man, talmage-jesus-christ-20, lds-scriptures]
  - ref: 22
    phrase: let the dead bury their dead
    kind: history
    title: Let the dead bury their dead
    body: |
      The saying sounds harsh, and readers have felt it so, but it is less harsh than it sounds. To be absent from a father’s funeral would ordinarily be a failure of a son’s duty. A man set apart to a work that outranked every personal and family obligation, though, had to put that work first. The law asked as much of anyone under a Nazarite vow: all the days of his separation he could not make himself unclean even for his father ([[Num. 6:6–7]]).

      “The dead” has two senses. Those who neglected spiritual things, who were in that figurative sense dead, could see to burying the dead; the man called to the ministry was needed for the living. Luke’s account says what he was to do instead: “go thou and preach the kingdom of God” ([[Luke 9:60]]).
    sources: [talmage-jesus-christ-20, lds-scriptures]
  - ref: 23
    phrase: his disciples followed him
    kind: structure
    title: Following Him into the ship
    body: |
      Matthew tells the storm as a story about discipleship, and the order of his chapter shows it. Mark and Luke use the stilling of the storm to show Jesus’s power over the elements; Matthew acknowledges that power but puts the story to a further use. Just before it he puts the two sayings about following (verses 19–22), which Luke places elsewhere, and then he says “his disciples followed him” into the ship. The cost of following in verses 18–22 is the cost of following Him into the boat.

      Matthew’s word for the storm points the same way. Mark and Luke call it a *lailaps*, a storm of wind; Matthew calls it a *seismos*, the word the New Testament almost always uses for the upheavals of the last days (as in [[Matt. 24:7]], “earthquakes”). One reading carries the figure further: if the tempest stands for the troubles that come to disciples, the ship they choose to enter with Him stands for the Church. Read that way, following Jesus does not promise a calm crossing; tribulation is part of discipleship, and the safety is in the ship because the Son of God is in it, even when He seems to be asleep.
    sources: [strathearn-teaching-gospels]
  - ref: 26
    phrase: Why are ye fearful, O ye of little faith?
    kind: christ
    title: Faith first, then the calm
    body: |
      Matthew tells the rescue in a different order from Mark and Luke, and his order puts the weight on the disciples’ faith. In Mark and Luke Jesus wakes, rebukes the wind and sea, and then asks about their faith ([[Mark 4:39–40]]; [[Luke 8:24–25]]). In Matthew He asks first and calms the sea afterward. “Little faith” is Matthew’s phrase: he uses it again in [[Matt. 6:30]], [[Matt. 14:31]] and [[Matt. 16:8]], and of the other Gospels only Luke has it, once ([[Luke 12:28]]).

      The disciples’ cry is different too. In Mark and Luke they call Him “Master,” a human title of respect. In Matthew they say “Lord, save us,” using *kyrios*, the word the Greek Old Testament used for the divine name, and asking to be saved, a plea that can reach the spirit as well as the body. In this way Matthew stresses that it is a divine being, not just a great man, who is in the ship. The disciples’ faith was small but not absent, and He answered their terrified cry even as He reproved their fear.
    sources: [strathearn-teaching-gospels, talmage-jesus-christ-20, lds-scriptures]
  - ref: 27
    phrase: What manner of man is this
    kind: christ
    title: Asleep in the storm, Lord of the sea
    body: |
      The story itself shows two sides of the One the disciples ask about. His sleep in the storm is evidence that His body was real: like everyone He grew tired, hungered without food, thirsted without drink and was wearied by work, and after a long day He slept. Yet the man asleep in the boat rebuked the winds and the sea, and they obeyed. He was the Lord of earth, air and sea, the One who at the Creation had said “Let there be light” and “Let the dry land appear,” and as He decreed, so it was.
    sources: [talmage-jesus-christ-20]
  - ref: 28
    phrase: the country of the Gergesenes
    kind: history
    title: Gergesenes or Gadarenes, two men or one
    body: |
      Matthew names the place “the country of the Gergesenes”; Mark and Luke say “the country of the Gadarenes” ([[Mark 5:1]]; [[Luke 8:26]]). The Greek text behind the King James Version reads “Gergesenes” in Matthew, but modern critical editions of the Greek, such as the SBL edition, read “Gadarenes” there as well. The names need not conflict, because the phrase names a region, not a town. In that district on the eastern side of the lake there were towns called Gadara, Gerasa and Gergesa, and the region could properly be called after any of them.

      Matthew also has two men where Mark and Luke tell of one, the man who called himself Legion ([[Mark 5:9]]). The accounts do not explain the difference. Perhaps one of the two was so much worse off than the other that he alone drew the other writers’ attention, or perhaps one ran off while the other stayed. Matthew’s two were so violent that no one would travel the road past the tombs.
    sources: [talmage-jesus-christ-20, greek-nt]
  - ref: 31
    phrase: suffer us to go away into the herd of swine
    kind: prophets
    title: Why the devils wanted the swine
    body: |
      The devils recognize Jesus at once, “Jesus, thou Son of God” (verse 29), and know they have to obey Him; and “art thou come hither to torment us before the time?” was a plea to be left alone until the time decreed for their final punishment.

      Their request for the swine shows what they lacked. Joseph Smith taught in 1841 that “the great principle of happiness consists in having a body,” and that the devil, who has none, is pleased when he can take a human one: “when cast out by the Savior he asked to go into the herd of swine showing that he would prefer a swines body to having none.” The devils were eager for bodies of flesh even if they were the bodies of beasts. Jesus gave them leave to go, but the destruction of the herd was not His command.
    sources: [talmage-jesus-christ-20, wjs-1841-01-05]
  - ref: 34
    phrase: they besought him that he would depart out of their coasts
    kind: history
    title: Why they asked Him to leave
    body: |
      Matthew gives no reason for the townspeople’s request, but the likeliest is fear of Jesus Himself. They had seen His power in the healing of the possessed men and in the loss of the swine, and theirs may have been the fear that sinful people feel in the presence of the righteous, a dread of whom among them that power might touch next. Peter had said much the same thing when he saw what Jesus could do: “Depart from me; for I am a sinful man, O Lord” ([[Luke 5:8]]).

      Mark and Luke go on to tell how the healed man begged to go with Jesus and was sent home to tell what God had done for him ([[Mark 5:18–20]]; [[Luke 8:38–39]]). Matthew ends with the city’s request.
    sources: [talmage-jesus-christ-20]

christ: |
  Matthew 8 shows Jesus Christ as the Lord whose word is obeyed by disease, wind, sea and devils, and who spends that power on a leper, a Gentile’s servant, a woman with a fever, frightened disciples and two men no one dared go near. Matthew sees in His healings Isaiah’s servant who “took our infirmities, and bare our sicknesses,” and the Book of Mormon carries the same words to the Atonement, where He took on Himself “the pains and the sicknesses of his people” ([[Alma 7:11]]). He did it “that he may know according to the flesh how to succor his people according to their infirmities” ([[Alma 7:12]]), so a disciple who cries “Lord, save us” in sickness or in a storm is calling on One who has already carried what he carries.

