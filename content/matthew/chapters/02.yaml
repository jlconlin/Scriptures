chapter: 2
title: The Wise Men and the Flight into Egypt
tagline: Strangers from the east come to worship the newborn King, the king in Jerusalem tries to kill Him, and the child retraces Israel’s path out of Egypt before settling in Nazareth.
when: 'Jesus’s infancy, before the death of Herod the Great (usually dated to the spring of 4 BC)'

setting: |
  Chapter 1 told who Jesus is and how He came to be born; chapter 2 tells where He was found and how He came to live where He did. The child is now in Bethlehem, in the last months of Herod the Great, who died in the spring of 4 BC by the usual reckoning, so the birth came before then.

  Matthew tells the infancy from Joseph’s side, with the wise men and the journey to Egypt; Luke tells it from Mary’s, with the shepherds and the presentation in the temple. Only Matthew has the wise men, the flight, and the killing of the Bethlehem children, and with the last two he alone ties Jesus’s beginning to Moses’s. Luke moves straight from the temple to Nazareth ([[Luke 2:39]]); the wise men’s visit came some time after the presentation, how long after the text doesn’t say.

  Prophetic quotations mark the chapter’s movements: Micah for Bethlehem (verse 6), Hosea for Egypt (verse 15), Jeremiah for the children’s deaths (verse 18), and an unnamed prophecy for Nazareth (verse 23). Each of those Old Testament passages has its own note on the site, linked below; the notes here say what the reader of Matthew needs and how Matthew reads them.

thread: |
  Matthew 2 asks **where the King of the Jews belongs**, and answers by moving Him from place to place. The first half asks where He is: wise men from the east arrive in Jerusalem looking for one “born King of the Jews,” and the king already reigning there is alarmed (verses 1–3). Herod’s own scholars find the answer in Micah: Bethlehem (verses 4–6). Herod sends the strangers there with a lie, and they find the child, worship Him, and go home another way (verses 7–12).

  The second half asks where He came from, and the answer, Egypt, is Israel’s story over again. An angel sends Joseph to Egypt; Herod kills the children of Bethlehem, and the child, like Moses, is spared while others die; and when the tyrant is dead, the angel brings the family back with words once spoken to Moses (verses 13–21). Matthew hears three prophets in it: the son called out of Egypt, Rachel weeping for her children, and one who “shall be called a Nazarene” (verses 15, 18, 23).

  The contrast drives the chapter. Foreigners who have only a star come and kneel. The chief priests who have the scriptures answer Herod’s question correctly, but it is the strangers who go to Bethlehem. The king who claims he wants to worship (verse 8) wants to kill. Through it all the child says nothing and does nothing; God guides every step, by a star, by the scriptures, and by four dreams, the wise men’s and three of Joseph’s.

sections:
  - range: 1-6
    heading: The wise men in Jerusalem
    plain: |
      Jesus was born in Bethlehem in Judea while Herod was king. Some time afterward wise men from the east arrived in Jerusalem and asked, “Where is the child who has been born King of the Jews? We saw His star in the east, and we have come to worship Him.” King Herod was deeply disturbed when he heard this, and so was all Jerusalem. He called together all the chief priests and the scribes and asked them where the Messiah was to be born. “In Bethlehem in Judea,” they answered, “because the prophet wrote: ‘And you, Bethlehem, in the land of Judah, are by no means the least among the leaders of Judah, because from you will come a ruler who will shepherd My people Israel.’”
  - range: 7-12
    heading: The wise men find the child
    plain: |
      Then Herod called the wise men in secret and found out from them exactly when the star had appeared. He sent them to Bethlehem and said, “Go and search carefully for the child, and when you find Him, report to me, so that I can come and worship Him too.” After hearing the king they set out, and the star they had seen in the east went ahead of them until it stopped over the place where the child was. When they saw the star they were overjoyed. They went into the house and saw the child with His mother Mary, and they knelt down and worshipped Him. Then they opened their treasures and gave Him gifts of gold, frankincense, and myrrh. God warned them in a dream not to go back to Herod, so they returned to their own country by another road.
  - range: 13-15
    heading: The flight into Egypt
    plain: |
      After they had gone, an angel of the Lord appeared to Joseph in a dream and said, “Get up, take the child and His mother, and flee to Egypt. Stay there until I tell you, because Herod is going to search for the child to kill Him.” So Joseph got up, took the child and His mother by night, and left for Egypt. He stayed there until Herod died. This fulfilled what the Lord had said through the prophet: “Out of Egypt I called My son.”
  - range: 16-18
    heading: Herod kills the children of Bethlehem
    plain: |
      When Herod realized the wise men had tricked him, he was furious. He sent and had all the children in Bethlehem and the surrounding area who were two years old or younger killed, reckoning from the time he had learned from the wise men. Then what Jeremiah the prophet had said was fulfilled: “A voice was heard in Ramah, weeping and loud mourning: Rachel weeping for her children, refusing to be comforted, because they are gone.”
  - range: 19-23
    heading: The return to Nazareth
    plain: |
      After Herod died, an angel of the Lord appeared in a dream to Joseph in Egypt and said, “Get up, take the child and His mother, and go to the land of Israel, because those who were trying to kill the child are dead.” So he got up, took the child and His mother, and went to the land of Israel. But when he heard that Archelaus was ruling Judea in place of his father Herod, he was afraid to go there. Warned in another dream, he went instead to the region of Galilee and settled in a town called Nazareth. So what was spoken through the prophets was fulfilled: “He will be called a Nazarene.”

notes:
  - ref: 1
    phrase: there came wise men from the east
    kind: history
    title: Who the wise men were
    body: |
      Matthew never says who the wise men were, how many came, or from which country, and the scriptures do not identify them; tradition has filled in the rest. The Greek word is *magoi*, which points to Persia, where the magi were Zoroastrian priests. Perhaps, and it is no more than a possibility, these visitors descended from Jewish priests taken to Babylon in 586 BC who stayed in the east, and so came to be counted among the magi.

      Their character is more certain than their origin: “it is certain that they were righteous men sent on an errand to witness the presence of the Son of God.” They saw the star, knew what it meant, and were warned of God in a dream (verse 12). They were likely representatives of “a branch of the Lord’s people” somewhere east of Palestine, led by the Spirit, who went home to testify that the King had been born. Another Latter-day Saint reading counts them among the Gentiles who recognize Jesus in Matthew, a sign that the Gospel was written for Gentile as well as Jewish readers. Either way, they are worshippers led by revelation, not stargazers who happened on Him.

      The number three and the crowns came later. Tradition settled on three because there were three gifts, though if the visitors came as witnesses there would “of necessity have been two or three.” Early Christians seem to have made them kings as they read the story beside psalms and prophecies of kings bringing gifts ([[Ps. 72:10]]; [[Isa. 60:3]]), and the names tradition later gave them are not in scripture either.
    sources: [skinner-life-jesus, bd-magi, griffin-matthew-portrayal, huntsman-wise-men-kings, talmage-jesus-christ-8]

  - ref: 2
    phrase: we have seen his star in the east
    kind: scripture
    title: The star the Nephites also saw
    body: |
      What the star was, no one has shown: attempts to identify it astronomically have found “no satisfactory confirmation.” Matthew is the only biblical writer to mention it. Interpreters ancient and modern have connected it with Balaam’s prophecy, “there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel” ([[Num. 24:17]]), and one Latter-day Saint reading of Matthew sees that prophecy fulfilled here.

      Restoration scripture adds a second witness. Five years before the birth, Samuel the Lamanite told the Nephites that “there shall a new star arise, such an one as ye never have beheld” ([[Hel. 14:5]]), and on the night of the sign “a new star did appear, according to the word” ([[3 Ne. 1:21]]). A new star appeared in the western sky “even as was seen by the magi in the east.” Read together, the two records make the star a real sign given in two hemispheres, seen by a prophet’s people in the west as by the wise men in the east.
    sources: [talmage-jesus-christ-8, sc-knowhy-769, griffin-matthew-portrayal, lds-scriptures]

  - ref: 3
    phrase: he was troubled, and all Jerusalem with him
    kind: history
    title: Why Herod was troubled
    body: |
      A question about a newborn “King of the Jews” was a threat to the man who held that title. Herod was an Idumean, by descent an Edomite, whose family had converted to the Jewish faith, and he ruled under the protection of Rome. He was unpopular with his subjects and rebuilt the temple at immense cost partly to win them over. He was also “tyrannical and merciless, sparing neither foe nor friend” who might stand in his way; he had his wife and several of his sons killed.

      The Joseph Smith Translation sharpens the scene. The wise men ask for “the child that is born, the Messiah of the Jews” (JST Matt. 3:2, in the footnote), and Herod’s question to the priests becomes “Where is the place that is written of by the prophets, in which Christ should be born? For he greatly feared, yet he believed not the prophets” (JST Matt. 3:4). That is the paradox of Herod: he did not believe the prophecy, but he feared it enough to order the killings of verse 16.

      The chief priests and scribes knew the answer at once and gave it from [[Micah 5:2]] (verses 5–6). Matthew’s wording differs from Micah’s (“not the least” for “little”), and the Joseph Smith Translation has the prophecy say plainly that the Messiah would be born there; both are explained in the note on Micah 5:2.
    sources: [bd-herod, talmage-jesus-christ-8, jst-matt-3, lds-scriptures]

  - ref: 11
    phrase: when they were come into the house, they saw the young child with Mary his mother
    kind: history
    title: A house, and a young child
    body: |
      The wise men did not kneel at the manger. By the time they came, the family was living in a house, and Matthew calls Jesus a “young child,” not a newborn. How much time had passed is not stated: it was after the presentation in the temple, “possibly but a few days, possibly weeks or even months.” Herod’s order to kill the children “from two years old and under” (verse 16) has been read as evidence that it may have been as long as two years. But Herod set that limit by the time the wise men told him the star had appeared (verse 7), estimating “the earliest time at which the birth could have occurred”; it is an outer limit, not a measure of the time that actually passed. The familiar scene with shepherds and wise men together joins two visits: in Luke it is the shepherds who come to the newborn, and in Matthew the wise men who come later.
    sources: [skinner-life-jesus, talmage-jesus-christ-8, strathearn-teaching-gospels]

  - ref: 11
    phrase: gold, and frankincense, and myrrh
    kind: symbol
    title: Gifts fit for a king
    body: |
      The gifts were first of all costly, the kind a king receives, and they suit the wise men’s question about one “born King of the Jews.” Frankincense was the incense of Israel’s offerings ([[Lev. 2:1]]), and myrrh was used in burial ([[John 19:39]]). From these uses some readers see in the three a summary of who the child is: gold for a king, frankincense for a priest, myrrh for His death. That symbolism is a reading, not something Matthew states, but it fits what the Book of Mormon teaches of Christ as King, as the priest who “offereth himself a sacrifice for sin” ([[2 Ne. 2:7]]), and as the one whose death and resurrection redeem.

      The gifts also recall Isaiah. Isaiah 60, the prophecy of nations coming to Zion’s light, promises that “the Gentiles shall come to thy light, and kings to the brightness of thy rising,” and that they “shall bring gold and incense” ([[Isa. 60:3]]; [[Isa. 60:6]]). In one Latter-day Saint reading, the wise men’s visit fulfills elements of that prophecy and of [[Ps. 72:10–11]].
    sources: [sc-knowhy-392, huntsman-wise-men-kings, griffin-matthew-portrayal, lds-scriptures]

  - ref: 15
    phrase: Out of Egypt have I called my son
    kind: scripture
    title: A line about Israel, fulfilled in Jesus
    body: |
      Hosea’s line looks back. “When Israel was a child, then I loved him, and called my son out of Egypt” ([[Hos. 11:1]]) recalls the Exodus, when the Lord called Israel His son ([[Ex. 4:22]]); where Isaiah 7:14 spoke of the future, Hosea spoke of Israel’s distant past. Yet a line about the past can still be prophecy. Hosea’s tie to Israel’s history does not keep him from “implicitly foreshadowing the future flight of Jesus to Egypt,” and in the family’s return the evangelist finds “a fulfillment of Hosea’s prophetic vision of what should be.”

      So Matthew’s “fulfilled” here means more than a forecast coming true. He reads the line as a pattern: the Lord once brought His son Israel out of Egypt, and now the Son of God retraces “in his own life the foundational experience of Israel.” Israel’s history does not stop being history; it becomes a likeness of what the Lord would do with His Son. The note on [[Hos. 11:1]] gives the Hebrew and the Septuagint (the ancient Greek translation of the Old Testament) behind Matthew’s “my son.”
    sources: [frederick-use-of-ot, talmage-jesus-christ-9, griffin-matthew-portrayal, lds-scriptures]

  - ref: 16
    phrase: slew all the children that were in Bethlehem
    kind: history
    title: The children of Bethlehem
    body: |
      No writer outside Matthew records this killing, not even Josephus, and some have doubted it on that ground. Yet even those doubters grant that it fits everything else known of Herod. In the same year he ordered the massacre he had his son Antipater put to death, and a few months later Herod himself died. He is also reported to have ordered that leading men of Judea be executed at his own death so that there would be real mourning at his funeral.

      Bethlehem was a small town. By one estimate its population was no more than about 2,000, and the children two years old and under numbered twenty or thirty. That was a horror for the families who lost them, but perhaps small enough to escape a historian writing of wars and courts eighty or ninety years later. Matthew’s account is the only record, and it is told as history: Herod “ruthlessly ordered the slaughter.”
    sources: [ellicott-matthew, bd-herod, talmage-jesus-christ-8]

  - ref: 18
    phrase: Rachel weeping for her children
    kind: scripture
    title: Rachel weeping again
    body: |
      Jeremiah’s Rachel weeps for the captives of his own day, and Matthew hears the same weeping again at Bethlehem. Rachel, the mother of Joseph and Benjamin, died near Bethlehem and was buried “in the way to Ephrath, which is Beth-lehem” ([[Gen. 35:19]]); her tomb, about a mile north of the town, was a landmark its people knew well. In [[Jer. 31:15]] she is pictured weeping for her children, the captives, her voice heard at Ramah, the place where the Babylonians sorted prisoners for death or exile ([[Jer. 40:1]]). In one reading, Matthew saw that picture reproduced at Bethlehem, where the mothers who lost their children lived beside the mother of Israel’s grave.

      As with Hosea, Matthew finds in the massacre a fulfillment of words spoken six centuries earlier, the word of the Lord that Jeremiah voiced “in the forceful past tense as though then already accomplished.” The note on [[Jer. 31:15]] explains Ramah, and the Lord’s answer to Rachel’s weeping, in Jeremiah’s own setting.
    sources: [ellicott-matthew, talmage-jesus-christ-8, lds-scriptures]

  - ref: 20
    phrase: for they are dead which sought the young child’s life
    kind: christ
    title: The same words once spoken to Moses
    body: |
      The angel’s words to Joseph echo what the Lord told Moses in Midian: “Go, return into Egypt: for all the men are dead which sought thy life” ([[Ex. 4:19]]). It is one of the ways Matthew presents Jesus as a new Moses. Both were born into poor families of a conquered people; both escaped a king’s order to kill children while most around them did not ([[Ex. 1:22]]); both had to wait in another land until the ruler who hunted them was dead.

      The likeness has a reversal in it. Moses was a slave’s child raised as a prince in the king’s house; Jesus was “born King of the Jews” and grew up a carpenter’s son, visited by the magi in a humble house ([[Matt. 13:55]]). The pattern continues in Matthew’s later chapters: forty days of fasting in the wilderness ([[Matt. 4:2]]) and a new law given on a mountain ([[Matt. 5:1]]).
    sources: [griffin-matthew-portrayal, strathearn-teaching-gospels, lds-scriptures]

  - ref: 22
    phrase: Archelaus did reign in Judæa in the room of his father Herod
    kind: history
    title: Archelaus
    body: |
      When Herod died, his kingdom was divided among three sons. Archelaus received Judea, Idumea and Samaria; Antipas received Galilee and Perea; Philip the northeast. Joseph had good reason to fear Archelaus. Early in his reign, when people protested the continuation of his father’s violence, he killed three thousand or more, some of them within the temple precincts. His rule was so oppressive that, after nine years, Augustus deposed him, and Judea was put under a Roman prefect.

      Joseph seems to have meant to settle in Judea, perhaps in Bethlehem itself, and turned aside only on learning who ruled there. Galilee, under Antipas, was no paradise, but Antipas was “less aggressive in vindictiveness” and at that time comparatively tolerant. So a further dream, Joseph’s fourth, sends the family north, and the child of Bethlehem grows up a Galilean.
    sources: [bd-herod, talmage-jesus-christ-9]

  - ref: 23
    phrase: he came and dwelt in a city called Nazareth
    kind: scripture
    title: Growing up in Nazareth
    body: |
      Matthew moves from the arrival in Nazareth straight to John the Baptist ([[Matt. 3:1]]), passing over the whole of Jesus’s youth. The Joseph Smith Translation fills the gap with three verses. “Jesus grew up with his brethren, and waxed strong, and waited upon the Lord for the time of his ministry to come” (JST Matt. 3:24). “And he served under his father, and he spake not as other men, neither could he be taught; for he needed not that any man should teach him” (JST Matt. 3:25). Then, after many years, the hour of His ministry drew near (JST Matt. 3:26).

      Those verses answer two questions the King James text leaves open. “Grew up with his brethren” places Him in a family with brothers, whom Matthew later names ([[Matt. 13:55]]), and “served under his father” has Him working under Joseph. “He needed not that any man should teach him” says His understanding did not depend on human teachers. Joseph Smith taught of the boy Jesus: “When still a boy [Jesus Christ] had all the intelligence necessary to enable Him to rule and govern the kingdom of the Jews.” The years in Nazareth were waiting, not idleness: He “waited upon the Lord” for His time. Nazareth was home until He was about thirty, which is why He was known as Jesus of Nazareth.
    sources: [jst-matt-3, tpjs-2007-ch-3, talmage-jesus-christ-9]

  - ref: 23
    phrase: He shall be called a Nazarene
    kind: scripture
    title: Which prophets called Him a Nazarene?
    body: |
      No prophecy that “He shall be called a Nazarene” is found in the Old Testament, and Matthew, unusually, names no prophet; he says only “the prophets.” A “Nazarene” is simply someone from Nazareth, and later the name was used of Christians too ([[Acts 24:5]]).

      The answer is most likely lost scripture: it is “practically certain that this prediction was contained in some one of the many scriptures extant in earlier days but since lost.” The Bible itself names more than a dozen books that it does not contain, the Book of Jasher ([[Josh. 10:13]]) and the book of Nathan the prophet ([[1 Chr. 29:29]]) among them.

      Those who look for the saying in the Bible we have point to Isaiah’s “Branch,” *netzer* in Hebrew, which sounds like Nazareth ([[Isa. 11:1]]); the note there treats it as a possible link, not a certain one. Whatever words Matthew had in mind, Nazareth was an obscure village of little honor (“Can there any good thing come out of Nazareth?” [[John 1:46]]), and the Messiah was known by its name.
    sources: [bd-nazarene, talmage-jesus-christ-9, ellicott-matthew, lds-scriptures]

christ: |
  Matthew 2 shows Jesus as the King of the Jews from His first days, and shows who received Him. Strangers from the east came and worshipped; the king and the city He was born to rule were troubled. Matthew’s Gospel ends the same way it begins: a Roman centurion at the cross confesses Him as the Son of God ([[Matt. 27:54]]), and the risen Lord sends His disciples to “all nations” ([[Matt. 28:19]]). The child born a King also became the servant of all, a king first found in a humble house.

  The chapter also shows how the Lord protected His Son: by warnings, and by a man who obeyed them. Each time the angel spoke, Joseph “arose” and went (verses 14, 21), the first time by night, and his obedience to those impressions brought him into harmony with God and with the prophecies. As His children live righteously, the Father still speaks to them, in a variety of ways and in their own circumstances, and His direction does its work, as it did here, through those who act on it.

explore: |
  - **The star in two hemispheres.** Read [[Hel. 14:2–6]] and [[3 Ne. 1:15–21]] beside verses 2 and 9.
  - **Jesus and Moses.** Read [[Ex. 1:15–2:10]] and [[Ex. 4:19–22]] beside verses 13–21.
  - **The nations come to the light.** [[Isa. 60:1–6]] and [[Ps. 72:10–11]].
  - **Guided by dreams.** Joseph’s four dreams ([[Matt. 1:20]]; [[Matt. 2:13]]; [[Matt. 2:19]]; [[Matt. 2:22]]) and the wise men’s ([[Matt. 2:12]]).

