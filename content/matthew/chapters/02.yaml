chapter: 2
title: The Wise Men and the Flight into Egypt
tagline: Strangers from the east come to worship the newborn King, the king in Jerusalem tries to kill Him, and the child retraces Israel’s path out of Egypt before settling in Nazareth.
when: 'Jesus’s infancy, before the death of Herod the Great (usually dated to the spring of 4 BC)'

setting: |
  Chapter 1 told who Jesus is and how He came to be born; chapter 2 tells where He was found and how He came to live where He did. The child is now in Bethlehem, in the last months of Herod the Great, who died in the spring of 4 BC by the usual reckoning, so the birth came before then.

  Matthew tells the infancy from Joseph’s side, with the wise men and the journey to Egypt; Luke tells it from Mary’s, with the shepherds and the presentation in the temple. Only Matthew has the wise men, the flight, and the killing of the Bethlehem children, and with the last two he alone ties Jesus’s beginning to Moses’s. Luke moves straight from the temple to Nazareth ([[Luke 2:39]]) and has no wise men; by the time they came, the family was living in a house (verse 11), so their visit apparently came some while after the birth.

  Prophetic quotations mark the chapter’s movements: Micah for Bethlehem (verse 6), Hosea for Egypt (verse 15), Jeremiah for the children’s deaths (verse 18), and an unnamed prophecy for Nazareth (verse 23). Each of those Old Testament passages has its own note on the site, linked below; the notes here say what the reader of Matthew needs and how Matthew reads them.

thread: |
  Matthew 2 asks **where the King of the Jews belongs**, and answers by moving Him from place to place. The first half asks where He is: wise men from the east arrive in Jerusalem looking for one “born King of the Jews,” and the king already reigning there is alarmed (verses 1–3). Herod’s own scholars find the answer in Micah: Bethlehem (verses 4–6). Herod sends the strangers there with a lie, and they find the child, worship Him, and go home another way (verses 7–12).

  The second half takes Him to Egypt and back, and the journey is Israel’s story over again. An angel sends Joseph to Egypt; Herod kills the children of Bethlehem, and the child, like Moses, is spared while others die; and when the tyrant is dead, the angel brings the family back with words once spoken to Moses (verses 13–21). Matthew hears three prophets in it: the son called out of Egypt, Rachel weeping for her children, and one who “shall be called a Nazarene” (verses 15, 18, 23).

  The contrast drives the chapter. Foreigners who have only a star come and kneel. The chief priests who have the scriptures answer Herod’s question correctly, but it is the strangers who go to Bethlehem. The king who claims he wants to worship (verse 8) wants to kill. Through it all the child says nothing and does nothing; God guides every step, by a star, by the scriptures, and by four dreams, the wise men’s and three of Joseph’s.

sections:
  - range: 1-6
    heading: The wise men in Jerusalem
    plain: |
      Jesus was born in Bethlehem in Judea while Herod was king. Wise men from the east arrived in Jerusalem and asked, “Where is the child who has been born King of the Jews? We saw His star in the east, and we have come to worship Him.” King Herod was deeply disturbed when he heard this, and so was all Jerusalem. He called together all the chief priests and the scribes and asked them where the Messiah was to be born. “In Bethlehem in Judea,” they answered, “because the prophet wrote: ‘And you, Bethlehem, in the land of Judah, are by no means the least among the leaders of Judah, because from you will come a ruler who will shepherd My people Israel.’”
  - range: 7-12
    heading: The wise men find the child
    plain: |
      Then Herod called the wise men in secret and found out from them exactly when the star had appeared. He sent them to Bethlehem and said, “Go and search carefully for the child, and when you find Him, report to me, so that I can come and worship Him too.” After hearing the king they set out, and the star they had seen in the east went ahead of them until it stopped over the place where the child was. When they saw the star they were overjoyed. They went into the house and saw the child with His mother Mary, and they knelt down and worshipped Him. Then they opened their treasures and gave Him gifts of gold, frankincense, and myrrh. God warned them in a dream not to go back to Herod, so they returned to their own country by another road.
  - range: 13-15
    heading: The flight into Egypt
    plain: |
      After they had gone, an angel of the Lord appeared to Joseph in a dream and said, “Get up, take the child and His mother, and flee to Egypt. Stay there until I tell you, because Herod is going to search for the child to kill Him.” So Joseph got up, took the child and His mother by night, and left for Egypt. He stayed there until Herod died. This fulfilled what the Lord had said through the prophet: “Out of Egypt I called My son.”
  - range: 16-18
    heading: Herod kills the children of Bethlehem
    plain: |
      When Herod realized the wise men had tricked him, he was furious. He sent and had all the children in Bethlehem and the surrounding area who were two years old or younger killed, reckoning from the time he had learned from the wise men. Then what Jeremiah the prophet had said was fulfilled: “A voice was heard in Ramah, weeping and loud mourning: Rachel weeping for her children, refusing to be comforted, because they are gone.”
  - range: 19-23
    heading: The return to Nazareth
    plain: |
      After Herod died, an angel of the Lord appeared in a dream to Joseph in Egypt and said, “Get up, take the child and His mother, and go to the land of Israel, because those who were trying to kill the child are dead.” So he got up, took the child and His mother, and went to the land of Israel. But when he heard that Archelaus was ruling Judea in place of his father Herod, he was afraid to go there. Warned in another dream, he went instead to the region of Galilee and settled in a town called Nazareth. So what was spoken through the prophets was fulfilled: “He will be called a Nazarene.”

notes:
  - ref: 1
    phrase: there came wise men from the east
    kind: history
    title: Who the wise men were
    body: |
      Matthew never says who the wise men were, how many came, or from which country, and the scriptures do not identify them; tradition has filled in the rest. The Greek word is *magoi*, which points to Persia, where the magi were Zoroastrian priests. Perhaps, and it is no more than a possibility, these visitors descended from Jewish priests taken to Babylon in 586 BC who stayed in the east, and so came to be counted among the magi.

      Their character is more certain than their origin: “it is certain that they were righteous men sent on an errand to witness the presence of the Son of God.” They saw the star, knew what it meant, and were warned of God in a dream (verse 12). They were likely representatives of “a branch of the Lord’s people” somewhere east of Palestine, led by the Spirit, who went home to testify that the King had been born. Another Latter-day Saint reading counts them among the Gentiles who recognize Jesus in Matthew, which, with the centurion at the cross and the command to teach all nations, may suggest that the Gospel was written for Gentile as well as Jewish readers. Either way, they are worshippers led by revelation, not stargazers who happened on Him.

      The number three and the crowns came later. Tradition settled on three because there were three gifts, though if the visitors came as witnesses there would “of necessity have been two or three.” Early Christians seem to have made them kings as they read the story beside psalms and prophecies of kings bringing gifts ([[Ps. 72:10]]; [[Isa. 60:3]]). Matthew says only that there was more than one; the names Gaspar, Balthasar and Melchior come from a Western tradition settled by the third century, not from scripture.
    sources: [skinner-life-jesus, bd-magi, griffin-matthew-portrayal, huntsman-wise-men-kings]

  - ref: 2
    phrase: we have seen his star in the east
    kind: scripture
    title: The star in the Book of Mormon
    body: |
      Matthew is the only biblical writer to mention the star, and he does not say what it was. Latter-day Saint readers connect it with Balaam’s prophecy, “there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel” ([[Num. 24:17]]): one reading of Matthew sees that prophecy fulfilled here, and another suggests, as a possibility, that Jewish priests living in the east could have made watching the stars part of their priestly work, since that very early prophecy of the Messiah speaks of a star.

      Restoration scripture adds a second witness, and supplies what Matthew leaves out. Five years before the birth, Samuel the Lamanite told the Nephites that “there shall a new star arise, such an one as ye never have beheld” ([[Hel. 14:5]]), with “great lights in heaven, insomuch that in the night before he cometh there shall be no darkness” ([[Hel. 14:3]]); and on the night of the sign “a new star did appear, according to the word” ([[3 Ne. 1:21]]), the night before the Lord’s word to Nephi was fulfilled: “on the morrow come I into the world” ([[3 Ne. 1:13]]). A prophecy given beforehand, the star’s brightness, and its appearing before the birth are details the New Testament account does not have. Matthew’s star is not a lone report: the Book of Mormon also records a star at the Savior’s birth, foretold and fulfilled among another people.
    sources: [sc-knowhy-769, skinner-life-jesus, griffin-matthew-portrayal, lds-scriptures]

  - ref: 3
    phrase: he was troubled, and all Jerusalem with him
    kind: history
    title: Why Herod was troubled
    body: |
      A question about a newborn “King of the Jews” was a threat to the man who held that title. Herod’s family were Idumeans, that is, Edomites, who had converted to the Jewish faith, and he ruled under the protection of Rome. He was unpopular with his subjects and rebuilt the temple at immense cost partly to win them over. His reign was also marked by cruelty to anyone near the throne: in a fit of jealousy he had his wife put to death, then her two sons, and, a few months before his own death, another son, Antipater.

      The Joseph Smith Translation sharpens the scene. The wise men ask for “the child that is born, the Messiah of the Jews” (JST Matt. 3:2, in the footnote), and Herod’s question to the priests becomes “Where is the place that is written of by the prophets, in which Christ should be born? For he greatly feared, yet he believed not the prophets” (JST Matt. 3:4). That is the paradox of Herod: he greatly feared what the prophets foretold, yet he did not believe them.

      The chief priests and scribes gave the answer from [[Micah 5:2]] (verses 5–6). Matthew’s wording differs from Micah’s (“not the least” for “little”), and the Joseph Smith Translation has the prophecy say plainly that the Messiah would be born there; both are explained in the note on Micah 5:2.
    sources: [bd-herod, bd-idumea, jst-matt-3, lds-scriptures]

  - ref: 11
    phrase: when they were come into the house, they saw the young child with Mary his mother
    kind: history
    title: A house, and a young child
    body: |
      The wise men apparently did not come to the manger. By the time they came, the family was living in a house, and Matthew calls Jesus a “young child,” not a newborn. How much time had passed Matthew does not say. Herod reckoned his order to kill the children “from two years old and under” by “the time which he had diligently inquired of the wise men” (verse 16), and that limit, together with Matthew’s calling Jesus a young child, has been read as evidence that up to two years may have passed between the birth and the visit. In Luke it is the shepherds who come to the newborn; in Matthew the wise men come later.
    sources: [skinner-life-jesus, strathearn-teaching-gospels]

  - ref: 11
    phrase: gold, and frankincense, and myrrh
    kind: symbol
    title: Gifts fit for a king
    body: |
      The gifts were first of all costly, the kind a king receives, and they suit the wise men’s question about one “born King of the Jews.” Frankincense was the incense of Israel’s offerings ([[Lev. 2:1]]), and myrrh was used in burial ([[John 19:39]]). From these uses some readers see in the three a summary of who the child is: gold for a king, frankincense for a priest, myrrh for His death. That symbolism is a reading, not something Matthew states.

      The gifts also recall Isaiah. Isaiah 60, the prophecy of nations coming to Zion’s light, promises that “the Gentiles shall come to thy light, and kings to the brightness of thy rising,” and that they “shall bring gold and incense” ([[Isa. 60:3]]; [[Isa. 60:6]]). In one Latter-day Saint reading, the wise men’s visit fulfills elements of that prophecy and of [[Ps. 72:10–11]].
    sources: [sc-knowhy-392, huntsman-wise-men-kings, griffin-matthew-portrayal, lds-scriptures]

  - ref: 15
    phrase: Out of Egypt have I called my son
    kind: scripture
    title: A line about Israel, fulfilled in Jesus
    body: |
      Hosea’s line looks back. “When Israel was a child, then I loved him, and called my son out of Egypt” ([[Hos. 11:1]]) recalls the Exodus, when the Lord called Israel His son ([[Ex. 4:22]]); where Isaiah 7:14 spoke of the future, Hosea spoke of Israel’s distant past. Yet a line about the past can still be prophecy: Hosea’s tie to Israel’s history does not keep him from “implicitly foreshadowing the future flight of Jesus to Egypt.”

      So Matthew’s “fulfilled” here means more than a forecast coming true. He reads the line as a pattern: the Lord once brought His son Israel out of Egypt, and now the Son of God retraces “in his own life the foundational experience of Israel.” Israel’s history does not stop being history; it becomes a likeness of what the Lord would do with His Son. The note on [[Hos. 11:1]] gives the Hebrew and the Septuagint (the ancient Greek translation of the Old Testament) behind Matthew’s “my son.”
    sources: [frederick-use-of-ot, griffin-matthew-portrayal, lds-scriptures]

  - ref: 16
    phrase: slew all the children that were in Bethlehem
    kind: history
    title: The children of Bethlehem
    body: |
      No writer outside Matthew mentions this killing, not even Josephus, and some have doubted it on that ground. Yet it is fully in keeping with Herod’s character. In the same year he ordered the massacre he had his son Antipater put to death, and a few months later Herod himself died. He is also reported to have ordered that leading men of Judea be executed at his own death so that there would be real mourning at his funeral.

      Bethlehem was a small town. By one estimate its population was no more than about 2,000, and the children two years old and under numbered twenty or thirty. That was a horror for the families who lost them, but perhaps small enough to escape a historian writing of wars and courts eighty or ninety years later.
    sources: [ellicott-matthew, bd-herod]

  - ref: 18
    phrase: Rachel weeping for her children
    kind: scripture
    title: Rachel weeping again
    body: |
      Jeremiah’s Rachel weeps for the captives of his own day, and Matthew hears the same weeping again at Bethlehem. Rachel, the mother of Joseph and Benjamin, died near Bethlehem and was buried “in the way to Ephrath, which is Beth-lehem” ([[Gen. 35:19]]); her tomb, about a mile north of the town, was a landmark its people knew well. In [[Jer. 31:15]] she is pictured weeping for her children, the captives, her voice heard at Ramah, the place where the Babylonians sorted prisoners for death or exile ([[Jer. 40:1]]). In one reading, Matthew saw that picture reproduced at Bethlehem, where the mothers who lost their children lived beside the mother of Israel’s grave.

      As with Hosea, Matthew finds a fulfillment in words first spoken of an earlier sorrow. The note on [[Jer. 31:15]] explains Ramah, and the Lord’s answer to Rachel’s weeping, in Jeremiah’s own setting.
    sources: [ellicott-matthew, lds-scriptures]

  - ref: 20
    phrase: for they are dead which sought the young child’s life
    kind: christ
    title: The same words once spoken to Moses
    body: |
      The angel’s words to Joseph echo what the Lord told Moses in Midian: “Go, return into Egypt: for all the men are dead which sought thy life” ([[Ex. 4:19]]). It is one of the ways Matthew presents Jesus as a new Moses. Both were born into poor families of a conquered people; both escaped a king’s order to kill children while most around them did not ([[Ex. 1:22]]); both had to wait in another land until the ruler who hunted them was dead.

      The likeness has a reversal in it. Moses was a slave’s child raised as a prince in the king’s house; Jesus was “born King of the Jews” and grew up a carpenter’s son, visited by the magi in a humble house ([[Matt. 13:55]]). The pattern continues in Matthew’s later chapters: forty days of fasting in the wilderness ([[Matt. 4:2]]) and a new law given on a mountain ([[Matt. 5:1]]).
    sources: [griffin-matthew-portrayal, strathearn-teaching-gospels, lds-scriptures]

  - ref: 22
    phrase: Archelaus did reign in Judæa in the room of his father Herod
    kind: history
    title: Archelaus
    body: |
      When Herod died, his kingdom was divided among three sons. Archelaus received Judea, Idumea and Samaria; Antipas received Galilee and Perea; Philip the northeast. Joseph had good reason to fear Archelaus. Within months of his accession he put down a disturbance at a festival in the temple by sending in his army, and his horsemen killed three thousand men; Jewish envoys later told Augustus that this “slaughter of three thousand of his own countrymen at the temple” was the first act of his reign. His rule became so oppressive that, after nine years, Augustus deposed him, and Judea was put under a Roman prefect.

      Joseph was afraid to go into Judea and turned aside on learning who ruled there. Antipas, who held Galilee, was then thought the milder of the two, and he may have been away in Rome, so Galilee offered a better hope of safety. A further dream, Joseph’s fourth, sends the family north, and the child of Bethlehem grows up a Galilean.
    sources: [bd-herod, josephus-antiquities, ellicott-matthew]

  - ref: 23
    phrase: he came and dwelt in a city called Nazareth
    kind: scripture
    title: Growing up in Nazareth
    body: |
      Matthew moves from the arrival in Nazareth straight to John the Baptist ([[Matt. 3:1]]), passing over the whole of Jesus’s youth. The Joseph Smith Translation fills the gap with three verses (JST Matt. 3:24–26, given in the footnote): Jesus “grew up with his brethren, and waxed strong, and waited upon the Lord for the time of his ministry to come”; “he served under his father, and he spake not as other men, neither could he be taught; for he needed not that any man should teach him”; and after many years the hour of His ministry drew near.

      “He needed not that any man should teach him” says His understanding did not depend on human teachers, and Joseph Smith taught the same of His youth: “When still a boy [Jesus Christ] had all the intelligence necessary to enable Him to rule and govern the kingdom of the Jews.” The “brethren” He grew up with are the brothers Matthew later names ([[Matt. 13:55]]). He began His ministry at “about thirty years of age” ([[Luke 3:23]]), and the crowds knew Him by His town: “Jesus the prophet of Nazareth of Galilee” ([[Matt. 21:11]]).
    sources: [jst-matt-3, tpjs-2007-ch-3, lds-scriptures]

  - ref: 23
    phrase: He shall be called a Nazarene
    kind: scripture
    title: Which prophets called Him a Nazarene?
    body: |
      No prophecy that “He shall be called a Nazarene” is found in the Old Testament we have, and Matthew names no prophet; he says only “the prophets.” A “Nazarene” is simply someone from Nazareth, and later the name was used of Christians too ([[Acts 24:5]]).

      Two answers are possible, and neither is certain. Matthew may have been alluding to Isaiah’s messianic “Branch” ([[Isa. 11:1]]): the Hebrew word there is *netzer*, from which the names Nazarene and Nazareth come, but whether Matthew had that verse in mind cannot be known, and the note on Isaiah 11:1 treats it as a possible link, not a certain one. Or the words may come from scripture since lost; in one reading it is “practically certain that this prediction was contained in some one of the many scriptures extant in earlier days but since lost.” The Bible itself names writings it does not contain, the Book of Jasher ([[Josh. 10:13]]) and the book of Nathan the prophet ([[1 Chr. 29:29]]) among them, and in its present form it is incomplete.

      Whatever words Matthew had in mind, the Messiah was known by the name of a village that drew Nathanael’s “Can there any good thing come out of Nazareth?” ([[John 1:46]]).
    sources: [bd-nazarene, bd-lost-books, talmage-jesus-christ-9, lds-scriptures]

christ: |
  Matthew 2 shows Jesus as the King of the Jews from His first days, and shows who received Him. Strangers from the east came and worshipped; the king and the city He was born to rule were troubled. Matthew’s Gospel ends the same way it begins: a Roman centurion at the cross confesses Him as the Son of God ([[Matt. 27:54]]), and the risen Lord sends His disciples to “all nations” ([[Matt. 28:19]]). The child born a King also became the servant of all, a king first found in a humble house.

  The chapter also shows how the Lord protected His Son: by warnings, and by a man who obeyed them. Each time the angel spoke, Joseph “arose” and went (verses 14, 21), the first time by night, and his obedience to those impressions brought him into harmony with God and with the prophecies. As His children live righteously, the Father still speaks to them, in a variety of ways and in their own circumstances,.

explore: |
  - **The star in the Book of Mormon.** Read [[Hel. 14:2–6]] and [[3 Ne. 1:15–21]] beside verses 2 and 9.
  - **Jesus and Moses.** Read [[Ex. 1:15–2:10]] and [[Ex. 4:19–22]] beside verses 13–21.
  - **The nations come to the light.** [[Isa. 60:1–6]] and [[Ps. 72:10–11]].
  - **Guided by dreams.** Joseph’s four dreams ([[Matt. 1:20]]; [[Matt. 2:13]]; [[Matt. 2:19]]; [[Matt. 2:22]]) and the wise men’s ([[Matt. 2:12]]).

