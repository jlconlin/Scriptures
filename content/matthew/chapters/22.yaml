chapter: 22
title: The Wedding Feast and the Questions in the Temple
tagline: In the temple Jesus tells of a king whose invited guests refuse his son’s wedding; then Pharisees, Herodians, Sadducees and a lawyer each bring a question to trap Him, and He ends by asking the one question none of them can answer.
when: 'In the temple at Jerusalem, on the Tuesday of the last week by Mark’s chronology'

setting: |
  Matthew 22 continues the long day in the temple that began in [[Matt. 21:23]], when the chief priests and elders demanded to know by what authority Jesus acted. He had answered with the parables of the two sons and the wicked husbandmen, and the rulers saw that He spoke of them ([[Matt. 21:45]]). The marriage of the king’s son is the third parable of that series, and the last parable He gave in public to a mixed crowd.

  The rest of the chapter is an examination. Three questions come from three groups, the Pharisees with the Herodians, then the Sadducees, then a Pharisee lawyer, each meant to catch Him in His words. Then Jesus asks a question of His own. Chapter 23, His rebuke of the scribes and Pharisees, follows.

  Mark tells the three questions and Jesus’s question about David ([[Mark 12:13–37]]); Luke tells all but the great commandment ([[Luke 20:20–44]]). The parable of the wedding feast is Matthew’s alone. Luke has a parable of a great supper whose guests make excuses ([[Luke 14:16–24]]), but that was a different story, told earlier, at a meal in a Pharisee’s house.

thread: |
  **Every question is answered, and then Jesus asks the one that matters.**

  The parable sets the terms. A king invites, and those with the best claim to come refuse, so the invitation goes out to anyone in the roads; even then one guest is put out for coming on his own terms. The parables of this day agree that the children of the covenant are not saved by their birth and that sinners who repent are welcomed.

  Then come the traps. Pharisees and Herodians ask about Caesar’s tax, Sadducees about a widow in the resurrection, a lawyer about the greatest commandment. Each question is answered in a sentence, and each answer turns from the trap to what God asks: give God what is His, trust the God of the living, love God with everything. When every party has been silenced, Jesus becomes the questioner: “What think ye of Christ?” The question about David’s son and David’s Lord challenged what they expected the Messiah to be, and no one could answer it.

sections:
  - range: 1-14
    heading: The marriage of the king’s son
    plain: |
      Jesus spoke to them again in parables. “The kingdom of heaven is like a king who gave a wedding feast for his son. He sent his servants to call those who had been invited, but they did not want to come. He sent other servants with the message, ‘Tell those who are invited: I have prepared my dinner. My oxen and fattened cattle are killed and everything is ready. Come to the wedding.’ But they paid no attention and went off, one to his farm, another to his business. The rest seized his servants, mistreated them, and killed them. The king was furious. He sent his troops, destroyed those murderers, and burned their city. Then he said to his servants, ‘The wedding is ready, but those who were invited were not worthy. Go to the crossroads and invite to the wedding anyone you find.’ So the servants went out into the roads and gathered everyone they could find, bad and good alike, and the wedding hall was filled with guests. But when the king came in to see the guests, he noticed a man there who was not wearing wedding clothes. ‘Friend,’ he asked, ‘how did you get in here without wedding clothes?’ The man had nothing to say. Then the king told the attendants, ‘Tie him hand and foot and throw him outside into the darkness, where there will be weeping and grinding of teeth.’ For many are invited, but few are chosen.”
  - range: 15-22
    heading: Tribute to Cæsar
    plain: |
      Then the Pharisees went out and planned how to trap Him in what He said. They sent their disciples to Him along with the Herodians. “Teacher,” they said, “we know you are honest and teach the way of God truthfully. You court no one’s favor, because you pay no attention to who people are. So tell us your opinion: is it right to pay the tax to Caesar or not?” But Jesus saw their malice and said, “You hypocrites, why are you testing me? Show me the coin used for the tax.” They brought Him a denarius. He asked them, “Whose image is this, and whose inscription?” “Caesar’s,” they answered. Then He said to them, “Then give back to Caesar what belongs to Caesar, and to God what belongs to God.” When they heard this they were amazed, and they left Him and went away.
  - range: 23-33
    heading: The Sadducees and the resurrection
    plain: |
      That same day some Sadducees, who say there is no resurrection, came to Him with a question. “Teacher,” they said, “Moses told us that if a man dies without children, his brother must marry the widow and raise up children for his brother. Now there were seven brothers among us. The first married and died, and since he had no children he left his wife to his brother. The same thing happened to the second and the third, right down to the seventh. Last of all the woman died. Now then, in the resurrection, whose wife will she be of the seven, since all of them were married to her?” Jesus answered, “You are wrong, because you know neither the scriptures nor the power of God. In the resurrection people neither marry nor are given in marriage; they are like the angels of God in heaven. And about the resurrection of the dead, have you not read what God said to you: ‘I am the God of Abraham, the God of Isaac, and the God of Jacob’? He is not the God of the dead but of the living.” When the crowds heard this, they were astonished at His teaching.
  - range: 34-40
    heading: The great commandment
    plain: |
      When the Pharisees heard that He had silenced the Sadducees, they gathered together. One of them, an expert in the law, tested Him with a question: “Teacher, which is the greatest commandment in the law?” Jesus answered, “‘Love the Lord your God with all your heart, with all your soul, and with all your mind.’ This is the first and greatest commandment. And the second is like it: ‘Love your neighbor as yourself.’ All the law and the prophets hang on these two commandments.”
  - range: 41-46
    heading: David’s son and David’s Lord
    plain: |
      While the Pharisees were gathered together, Jesus asked them a question: “What do you think about the Christ? Whose son is he?” “The son of David,” they answered. He said to them, “Then how is it that David, speaking by the Spirit, calls him ‘Lord’? For he says, ‘The LORD said to my Lord, Sit at my right hand until I put your enemies under your feet.’ If David calls him ‘Lord,’ how can he be his son?” No one could say a word in reply, and from that day on no one dared to ask Him any more questions.

notes:
  - ref: 2
    phrase: a certain king, which made a marriage for his son
    kind: symbol
    title: Who the king, the son and the guests are
    body: |
      Read as an allegory, the parable’s figures can be named. The king is God, and the son whose wedding is celebrated is Jesus. The guests invited long before are the covenant people who rejected their Lord; the guests gathered from the roads are the Gentiles, to whom the gospel went when the first guests refused; the feast is the glorious completion of the Messiah’s mission. A great feast to open the Messiah’s reign was a favorite theme in synagogue and school, with the boast that none but the children of Abraham would sit at it. The parable turns that hope around.

      The customs make the refusal worse than rudeness. A wedding was one of the most joyful events in Jewish life and could last a week or two; guests were told far ahead and summoned again on the opening day, the call the servants carry in verse 3. An invitation from a king was in effect a command. To refuse it was a deliberate rebellion against the king and an insult to his son, the heir who would one day reign over them. The man who went off to his farm and the one who went to his business show people so taken up with their own affairs that the king’s call meant nothing to them.

      The “highways” of verse 9 are literally the openings of the roads, the crossroads where travelers could be found. That detail can be read as a prophecy of the call of the Gentiles, as when Paul and Barnabas told the Jews of Antioch who had refused them, “lo, we turn to the Gentiles” ([[Acts 13:46]]).
    sources: [talmage-jesus-christ-30, bednar-put-on-strength, ellicott-matthew]
  - ref: 7
    phrase: burned up their city
    kind: history
    title: A city burned
    body: |
      The burned city is what most sets this parable apart from Luke’s parable of the great supper ([[Luke 14:16–24]]), which it otherwise resembles. In Luke the host is a private man, the guests make polite excuses, and their only penalty is to miss the meal. Here the host is a king, the occasion his heir’s wedding, the guests abuse and murder his servants, and the punishment is death and a burned city. Luke’s story was told earlier at a Pharisee’s table; this one in the temple, when the rulers’ opposition had reached its height.

      If the parable is read as an allegory of actual events, at this verse it passes from the past to the future: the burned city points to the destruction of Jerusalem, which came several decades after Jesus’s death. On that reading, the destruction of Jerusalem was a first, approximate fulfillment of the words, and they are fulfilled again in every time of trouble that falls on nations and churches as the consequence of unbelief.
    sources: [talmage-jesus-christ-30, ellicott-matthew]
  - ref: 11
    phrase: had not on a wedding garment
    kind: history
    title: The garment the king gave
    body: |
      The man’s fault was refusing what the king had given, not being poor. The parable does not say where the guests’ clothes came from, but in that day the host of a wedding feast customarily provided garments for the guests: simple robes that everyone wore, so that rank and station disappeared and all could mingle as equals. People pulled in from the roads had neither time nor means to dress for a royal wedding, so the king most likely clothed them from his own wardrobe. Even apart from the custom, the story requires that some provision was made for every guest who properly asked.

      That is why the man is “speechless” (verse 12). He had no excuse to give. The king addresses him graciously as “Friend,” but the question implies that what he had done was strange and inexcusable. He “did not simply lack a wedding garment; rather, he chose not to wear one.” An older reading pictures how he could have come in without it: the other guests entered by the door and were clothed before they reached the hall, and he got in some other way, an intruder like the one who “climbeth up some other way” in [[John 10:1]].
    sources: [bednar-put-on-strength, talmage-jesus-christ-30, ellicott-matthew]
  - ref: 14
    phrase: many are called, but few are chosen
    kind: scripture
    title: Called to the feast, chosen at it
    body: |
      The Joseph Smith Translation ties this saying to the garment: “for many are called, but few are chosen; wherefore all do not have on the wedding garment” (JST Matt. 22:14, in the footnotes). The call is the invitation, and it goes to everyone, good and bad. A person may accept it and sit down at the feast, and still not be chosen, because he lacks “the appropriate wedding garment of converting faith in the Lord Jesus and His divine grace.”

      Chosen, then, as Elder Bednar teaches it, is not a status handed to a favored few. It is the result of the guest’s own choice, made by the righteous use of agency. Latter-day revelation repeats the saying and asks why the many are not chosen ([[D&C 121:34–35]]; its answer is quoted in the note on [[Matt. 20:16]]). The saying sums up the three parables of the day: being a child of the covenant gives no one a place at the feast, and repentance opens it to anyone.
    sources: [lds-scriptures, bednar-put-on-strength, talmage-jesus-christ-30]
  - ref: 16
    phrase: with the Herodians
    kind: history
    title: 'Pharisees and Herodians: a trap with two jaws'
    body: |
      The Pharisees and the Herodians were unlikely partners, and the question was built so that each could use one answer. The Herodians were a political party, known only from Matthew and Mark, that supported the family of Herod, and since the Herods held their power from Rome, that meant upholding Roman rule. The question was about the poll tax, which the Jews resented more than any other sign of Rome’s rule. If Jesus said yes, pay it, the Pharisees could call Him a traitor to God and nation before the crowd; if He said no, the Herodians could report Him to the Romans as a rebel.

      The flattery in verse 16 was the bait. Every word of it was true of Jesus, and every word was false on the lips of men who meant to trap Him. The trap failed, but the charge was made anyway: before Pilate His accusers charged Him with forbidding the people to pay tribute to Caesar ([[Luke 23:2]]).
    sources: [talmage-jesus-christ-31, huntsman-tuesday, ellicott-matthew]
  - ref: 20
    phrase: Whose is this image and superscription?
    kind: history
    title: Tiberius on the coin
    body: |
      The “penny” was a Roman denarius, and the coin itself carried the offense. It bore the portrait of the emperor Tiberius and the inscription “Tiberius Caesar Augustus, son of the deified Augustus, high priest,” a graven image and a claim to divine and priestly rank that Jews could not accept. Their own coins carried plants and fruit instead of a human head.

      By asking His questioners to produce a coin, Jesus let them answer their own question. They had the emperor’s denarius with them. The nation had in practice already settled whether to accept Caesar’s rule, since it used Roman money every day, and in Jewish eyes to circulate a ruler’s coins was to acknowledge his authority.
    sources: [huntsman-tuesday, talmage-jesus-christ-31]
  - ref: 21
    phrase: unto God the things that are God’s
    kind: prophets
    title: What bears God’s image
    body: |
      “Render” is literally “give back.” Caesar had minted the coin and in a sense still owned it, so returning it to him was no betrayal of God. But the second half of the answer is the greater obligation, since everything God made belongs to Him. The question the coin raises, whose image does it bear, has an answer for people too: “Every human soul is stamped with the image and superscription of God, however blurred and indistinct the line may have become through the corrosion or attrition of sin.” As the coin goes back to Caesar, the soul goes back to God: “give unto God and His service, yourselves—the divine mintage of His eternal realm.”

      The answer gives the right basis for relating spiritual and secular duties, and latter-day revelation asks the same loyalty to the laws of the land: “Let no man break the laws of the land, for he that keepeth the laws of God hath no need to break the laws of the land” ([[D&C 58:21]]); see also [[D&C 134]] and [[A of F 1:12]].
    sources: [huntsman-tuesday, talmage-jesus-christ-31, lds-scriptures]
  - ref: 23
    phrase: the Sadducees, which say that there is no resurrection
    kind: history
    title: A question about the resurrection, not about marriage
    body: |
      The Sadducees, who came from the chief priestly families and seem to have been the core of the opposition to Jesus, denied the bodily resurrection, against the Pharisees. Their question sounds like a question about marriage, but it was meant to make the resurrection look ridiculous. It was not a sincere question.

      It rests on the law of levirate marriage ([[Deut. 25:5–10]]; see the note at [[Deut. 25:5]]): if a man died childless, his brother was to marry the widow and father a son who would carry the dead man’s name. Seven brothers in turn was possible under the law but most improbable. The arrangement was also temporary from the start: the child belonged to the dead brother, and the living brother had no further claim on the widow once the child was born. So the Sadducees’ question misread the law it cited: the levirate tie was made to give the dead man an heir in this life, not to bind the widow to the living brother. That is the force of Jesus’s first reply, “not knowing the scriptures.” His second, “nor the power of God,” goes deeper: to deny the resurrection is to deny God’s power to raise the dead.
    sources: [huntsman-tuesday, talmage-jesus-christ-31, ellison-family-marriage, lds-scriptures]
  - ref: 30
    phrase: they neither marry, nor are given in marriage
    kind: scripture
    title: No marrying in the resurrection
    body: |
      From the second century on, many Christian writers took this verse to mean there is no marriage in the next life, and that reading still prevails in traditional Christianity. The words themselves are narrower. They speak of marrying and being given in marriage, the making of marriages, not of whether marriages exist in the resurrection. Jesus’s point to the Sadducees was that the question “whose wife?” could not be settled then: in the resurrection there is no marrying, “for all questions of marital status must be settled before that time, under the authority of the Holy Priesthood, which holds the power to seal in marriage for both time and eternity.” On this reading, none of the seven marriages would be eternally valid.

      The Lord used the same words in a revelation to Joseph Smith, of a man who marries a wife “not by me nor by my word” and covenants with her only for this life: “their covenant and marriage are not of force when they are dead,” and “when they are out of the world they neither marry nor are given in marriage; but are appointed angels in heaven” ([[D&C 132:15–16]]). Levirate marriage seems to correspond to that teaching: a marriage made for this world, to meet a need that death creates. Since the Sadducees said “there were with us seven brethren,” Jesus may also have been answering the Sadducees about people like themselves, which would limit how far the verse reaches; that is a proposal, not a settled reading.
    sources: [ellison-family-marriage, talmage-jesus-christ-31, lds-scriptures]
  - ref: 32
    phrase: God is not the God of the dead, but of the living
    kind: scripture
    title: The God of the living
    body: |
      Jesus answered the Sadducees from the law of Moses, which they zealously upheld. At the burning bush the Lord called Himself “the God of Abraham, the God of Isaac, and the God of Jacob” ([[Ex. 3:6]]; see the note there), though the patriarchs had been dead for centuries. The Sadducees honored that title and yet, by denying the resurrection, made it hold only for the patriarchs’ short lives. Abraham, Isaac and Jacob were still living in the world of spirits, and through Jesus’s own resurrection He would overcome physical death for them and for everyone. The crowd’s astonishment (verse 33) is Matthew’s note that the answer struck home.
    sources: [talmage-jesus-christ-31, huntsman-tuesday, lds-scriptures]
  - ref: 35
    phrase: a lawyer, asked him a question, tempting him
    kind: history
    title: A lawyer’s test
    body: |
      A “lawyer” here is a scribe who was also an expert in the religious law, a specialist in the books of Moses. His question was a real one in his world. The teachers of the law had divided and subdivided its commandments and added rules of their own to the smallest of them, and later authorities would count 613 commandments in the law of Moses. Which of them outweighed the rest was a natural thing to ask.

      Matthew calls the question a test, put by a Pharisee after the Sadducees had been silenced, and ends the scene with Jesus’s answer. Mark tells the same exchange more warmly: the scribe answers that love is “more than all whole burnt offerings and sacrifices,” and Jesus tells him, “Thou art not far from the kingdom of God” ([[Mark 12:33–34]]). The two accounts are read as the same man: he came, as Matthew says, to test Jesus as spokesman for his fellow Pharisees, and Mark shows him honest enough to be convinced by the reply.
    sources: [talmage-jesus-christ-31, huntsman-tuesday]
  - ref: 38
    phrase: This is the first and great commandment
    kind: prophets
    title: Why the first commandment is first
    body: |
      Jesus did not give a new commandment; He ranked an old one. He quoted the Shema, Israel’s confession from [[Deut. 6:4–5]], which Jews recite morning and night and whose words the Pharisees wore written in phylacteries, worn as frontlets between the eyes. (Why Matthew has “mind” where Deuteronomy has “might” is taken up at [[Deut. 6:5]].) What was new was the ranking: this one first. The Lord gave the same commandment again in this dispensation ([[D&C 59:5]]).

      Why it comes first is answered simply: “Because He knew that if we truly loved Him we would want to keep all of His other commandments.” Love of God puts everything else in order: “When we put God first, all other things fall into their proper place or drop out of our lives.”
    sources: [sc-knowhy-517, talmage-jesus-christ-31, benson-great-commandment]
  - ref: 40
    phrase: On these two commandments hang all the law and the prophets
    kind: scripture
    title: Everything hangs on two
    body: |
      “The law and the prophets” is the whole of what God had revealed in the Old Testament ([[Matt. 5:17]]; [[Matt. 7:12]]). Jesus says it all hangs on these two. They lie at its root, and the rest of the law expands them, applies them to particular cases, or acts them out in ceremony.

      The second is “like unto” the first. To love God with heart, soul and mind is to serve Him and keep His commandments; to love one’s neighbor as oneself is to be a brother in the broadest and most demanding sense (on the commandment’s first setting, see the note at [[Lev. 19:18]]). The two are the greatest because they contain the others, as a whole is greater than any of its parts.
    sources: [ellicott-matthew, talmage-jesus-christ-31]
  - ref: 42
    phrase: What think ye of Christ? whose son is he?
    kind: christ
    title: David’s Son and David’s Lord
    body: |
      After every party had tried to trap Him and failed, Jesus asked the question that mattered most: who is the Messiah? The Pharisees gave the expected answer, “The Son of David.” The hope of the day was for a king of David’s line who would redeem Israel and restore its greatness, a Messiah who would be David’s son by descent and royal succession.

      Jesus then quoted [[Ps. 110:1]], traditionally attributed to David, one of the royal psalms whose anointed king served as a type of the Messiah: “The LORD said unto my Lord.” Jesus’s point in verse 45 is that David would not call his own descendant “my Lord.” (The site’s notes on that verse explain the two Hebrew words behind “LORD” and “Lord.”) David understood that the Messiah was more than one of his descendants: he was already God’s chosen, sitting at God’s right hand, long before his birth. Jesus is David’s son by lineage, but He was Jehovah, Lord and God, “before David, Abraham, or Adam was known on earth.” Matthew records that no one could answer, and that from that day no one dared ask Him anything more (verse 46).
    sources: [huntsman-tuesday, talmage-jesus-christ-31, lds-scriptures]

christ: |
  Matthew 22 shows Jesus Christ as the King’s Son whose wedding is the feast, and as David’s Lord, who was Jehovah before He was born David’s son. The invitation to His feast goes to everyone, and being chosen is the guest’s own choice, made by putting on the garment of converting faith He provides and by the righteous use of agency. Love of the Lord, put first, governs “the claims for our affection, the demands on our time, the interests we pursue, and the order of our priorities.”

explore: |
  - **The other tellings.** [[Mark 12:13–37]] and [[Luke 20:20–44]] for the questions in the temple; Mark alone has the scribe who was “not far from the kingdom of God.”
  - **Another feast.** The great supper, [[Luke 14:16–24]]; the marriage supper of the Lamb, [[Rev. 19:7–9]].
  - **Marriage for eternity.** [[D&C 132:15–20]], which takes up the words of verse 30.
  - **David’s Lord.** [[Ps. 110]], the psalm Jesus quotes in verse 44.
  - “Tuesday: Attempts to Catch Jesus in His Words and Prophecies of the End,” in *Greater Love Hath No Man* (Religious Studies Center), walks through each of the day’s questions.

