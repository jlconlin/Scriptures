chapter: 5
title: The Beatitudes and the Higher Law
tagline: On a mountain in Galilee Jesus begins the Sermon on the Mount, blessing the humble and the persecuted, calling His disciples salt and light, and showing how He fulfils the law by asking for righteousness that reaches the heart.
when: 'Early in Jesus’s ministry in Galilee'

setting: |
  Matthew 5 opens the Sermon on the Mount, which runs through chapter 7. It is the first of five long discourses around which Matthew builds the body of his Gospel, each closed with words like “when Jesus had ended these sayings” ([[Matt. 7:28]]); many readers see in the five an intended echo of the five books of Moses. Matthew also frames the sermon: [[Matt. 4:23]] and [[Matt. 9:35]] are nearly the same sentence, and everything between them, the sermon and the miracles of chapters 8 and 9, is one unit showing Jesus as the Messiah in word and in deed.

  The sermon was given in Galilee, early in the ministry. Luke has a shorter sermon with many of the same sayings, spoken on “the plain” ([[Luke 6:17–49]]); the note on verse 1 takes up how the two are related.

  After His resurrection the Lord gave a sermon very like this one at the temple in Bountiful ([[3 Ne. 12–14]]). What it adds, above all, is a covenant setting, and where its wording differs from Matthew's it often answers a question about Matthew's verse. Joseph Smith's translation also changes several verses of this chapter.

thread: |
  **A righteousness that reaches the heart, and makes disciples like their Father.**

  The chapter opens by turning the world's measure upside down. The poor in spirit, the mourners, the meek and the persecuted are called blessed, and each is promised a blessing that answers his condition: comfort for the mourners, filling for the hungry, the kingdom for the persecuted (verses 3–12). Jesus then tells such people what they are for: salt that keeps its savour, a light set where all can see it, so that others glorify the Father (verses 13–16).

  Verse 17 states the thesis of what follows: He came not to destroy the law but to fulfil it, and His disciples' righteousness must exceed that of the scribes and Pharisees. Six times He quotes what was said “to them of old time” and answers, “But I say unto you.” Each time He goes further than what was said: from murder to anger, from adultery to the look, from false oaths to any oath, from limiting revenge to giving it up. The last of the six, to love enemies, leads into the last verse. A disciple who loves as the Father loves, sending sun and rain on the evil and the good, is what “perfect, even as your Father which is in heaven is perfect” means (verse 48).

sections:
  - range: 1-12
    heading: The Beatitudes
    plain: |
      When Jesus saw the crowds, He went up on a mountain. He sat down, and His disciples came to Him, and He began to teach them. Blessed are the poor in spirit, for the kingdom of heaven is theirs. Blessed are those who mourn, for they will be comforted. Blessed are the meek, for they will inherit the earth. Blessed are those who hunger and thirst for righteousness, for they will be filled. Blessed are the merciful, for they will receive mercy. Blessed are the pure in heart, for they will see God. Blessed are the peacemakers, for they will be called children of God. Blessed are those who are persecuted because they do right, for the kingdom of heaven is theirs. Blessed are you when people insult you, persecute you and falsely say every kind of evil against you because of Me. Rejoice and be very glad, for your reward in heaven is great; that is how they persecuted the prophets who came before you.
  - range: 13-16
    heading: Salt and light
    plain: |
      You are the salt of the earth. But if salt loses its taste, how can it be made salty again? It is no longer good for anything except to be thrown out and walked on. You are the light of the world. A city built on a hill cannot be hidden. Nobody lights a lamp and puts it under a measuring bowl; they set it on a lampstand, and it gives light to everyone in the house. In the same way, let your light shine before people, so that they will see your good works and glorify your Father in heaven.
  - range: 17-20
    heading: Not to destroy but to fulfil
    plain: |
      Do not think that I have come to do away with the law or the prophets. I have not come to do away with them but to fulfil them. Truly I tell you, until heaven and earth pass away, not the smallest letter, not the least stroke of a letter, will pass from the law until everything has come about. So whoever breaks one of the least of these commandments and teaches others to do the same will be called least in the kingdom of heaven; but whoever keeps them and teaches them will be called great in the kingdom of heaven. For I tell you that unless your righteousness goes beyond that of the scribes and Pharisees, you will never enter the kingdom of heaven.
  - range: 21-26
    heading: Anger and reconciliation
    plain: |
      You have heard that it was said to the people long ago, “You shall not kill, and whoever kills will be liable to judgment.” But I tell you that anyone who is angry with his brother will be liable to judgment. Whoever calls his brother “Raca,” empty-head, will answer to the council, and whoever says, “You fool,” will be in danger of the fire of Gehenna. So if you are bringing your gift to the altar and there remember that your brother has something against you, leave your gift in front of the altar and go. First be reconciled to your brother, and then come and offer your gift. Make peace quickly with someone who has a claim against you while you are still on the way with him, or he may hand you over to the judge, and the judge to the officer, and you will be thrown into prison. Truly I tell you, you will not get out until you have paid the last penny.
  - range: 27-32
    heading: Adultery and divorce
    plain: |
      You have heard that it was said to the people long ago, “You shall not commit adultery.” But I tell you that whoever looks at a woman with lust for her has already committed adultery with her in his heart. If your right eye causes you to stumble, pull it out and throw it away; it is better for you to lose one part of your body than for your whole body to be thrown into hell. And if your right hand causes you to stumble, cut it off and throw it away; it is better to lose one part than for your whole body to be thrown into hell. It was also said, “Whoever divorces his wife must give her a certificate of divorce.” But I tell you that anyone who divorces his wife, except for sexual unfaithfulness, makes her commit adultery, and whoever marries a divorced woman commits adultery.
  - range: 33-42
    heading: Oaths and retaliation
    plain: |
      Again, you have heard that it was said to the people long ago, “Do not break your oath, but keep the oaths you have made to the Lord.” But I tell you, do not swear at all: not by heaven, for it is God's throne; not by the earth, for it is His footstool; not by Jerusalem, for it is the city of the great King. Do not swear by your own head, for you cannot make one hair white or black. Let your word be simply yes or no; anything more than this comes from evil. You have heard that it was said, “An eye for an eye and a tooth for a tooth.” But I tell you, do not resist an evil person. If anyone strikes you on your right cheek, turn the other to him as well. If anyone takes you to court to get your tunic, let him have your cloak too. If anyone forces you to go one mile, go with him two. Give to the one who asks you, and do not turn away from the one who wants to borrow from you.
  - range: 43-48
    heading: Love your enemies
    plain: |
      You have heard that it was said, “Love your neighbor and hate your enemy.” But I tell you, love your enemies, bless those who curse you, do good to those who hate you, and pray for those who mistreat and persecute you, so that you may become children of your Father in heaven. For He makes His sun rise on the evil and the good, and sends rain on the just and the unjust. If you love only those who love you, what reward do you have? Do not even the publicans do that? And if you greet only your own people, what are you doing more than others? Do not even the publicans do that? Be perfect, then, complete, as your Father in heaven is perfect.

notes:
  - ref: 1
    phrase: he went up into a mountain
    kind: symbol
    title: A lawgiver on a mountain
    body: |
      Matthew alone among the Gospel writers says that Jesus gave this sermon from a mountain, and the detail recalls Moses, who brought the commandments down from Sinai ([[Ex. 20]]). Matthew presents Jesus throughout his Gospel as the prophet like Moses whom Moses had promised ([[Deut. 18:15]]), the great lawgiver of the New Testament, and the sermon is the plainest instance: from a mountain Jesus gives commandments that stretch His disciples beyond the outward requirements of the law of Moses.

      On one reading the mountain carries a second meaning. The Beatitudes rest on the Psalms, among them Psalm 24, which was sung by worshippers going up to the temple, and so tie the sermon's mountain to the “mountain house of the Lord”: the sermon's promise of seeing God (verse 8) is the temple's promise (see the note there).
    sources: [griffin-matthew-portrayal, skinner-beatitudes]
  - ref: 1
    phrase: his disciples came unto him
    kind: history
    title: Who heard it, and Luke’s sermon on the plain
    body: |
      Jesus saw the multitudes, but He taught the disciples who came to Him on the mountain. Parts of the sermon were meant for those who had been or would be called to the apostleship and would give up their worldly interests for the ministry; other parts apply to everyone. Joseph Smith's translation makes the audience plainer still. Its added beatitudes speak of “they who shall believe on your words, when ye shall testify that ye have seen me,” so the hearers are converted disciples about to be sent out to teach. In Matthew's account the Twelve are not yet called (they are named in [[Matt. 10:1–4]]); at Bountiful, by contrast, the risen Lord spoke first to the multitude and told them to heed the twelve He had already called ([[3 Ne. 12:1]]).

      Luke's sermon has much of the same teaching in a shorter form, with four beatitudes followed by four woes, and Jesus speaks it after coming down and standing “in the plain” ([[Luke 6:17–49]]). The two may well be separate occasions rather than one sermon told two ways. On one reading they were given at different times to different audiences: a few followers on the mountain, and on the plain a mixed multitude of rich and poor, believers and the merely curious, Jews and Gentiles, to whom Jesus spoke more simply. The older reading in *Jesus the Christ* takes the Twelve to have been chosen already, as Luke tells it ([[Luke 6:13]]), and suggests that Jesus taught at length on the mountainside to the disciples from whom He had chosen the Twelve, then came down and repeated parts of it to the crowd, and that Matthew's account may be the fuller because Matthew, as one of the Twelve, heard the first and longer delivery.
    sources: [talmage-jesus-christ-17, lefevre-jst-sermon, sc-knowhy-659]
  - ref: 3
    phrase: Blessed are the poor in spirit
    kind: scripture
    title: Who come unto me
    body: |
      The Book of Mormon's form of this beatitude adds four words that say who receives the blessing: “Blessed are the poor in spirit who come unto me” ([[3 Ne. 12:3]]). The phrase makes coming to Jesus, in a covenant relationship with Him, the way to the promised kingdom. The whole Sermon at the Temple has that setting. It follows the Lord's teaching on baptism and the Holy Ghost, opens with two added beatitudes for those who heed the Twelve and are baptized, and belongs to a day that ended with the people taking the sacrament. Its words are meant for people who make covenants. Joseph Smith's translation gives Matthew's sermon the same frame, adding a beatitude for those who “come down into the depth of humility, and be baptized,” who will receive the Holy Ghost and a remission of their sins.

      “Poor in spirit” itself had a history. The exact phrase is not found in the Hebrew Bible, but it appears in a psalm in the War Scroll, one of the Dead Sea Scrolls, and by Jesus's time “the poor” could be another word for the pious. Jesus seems to have meant by the poor in spirit the saints, humble people striving for a place in the kingdom of heaven.
    sources: [sc-knowhy-755, lefevre-jst-sermon, skinner-beatitudes]
  - ref: 5
    phrase: they shall inherit the earth
    kind: scripture
    title: The meek and the earth
    body: |
      The beatitude rests directly on a psalm: “the meek shall inherit the earth” ([[Ps. 37:11]]; the notes there take up the Hebrew word for the meek and the double sense of “earth” and “land”). The Greek word for the meek means literally the mild and gentle. Latter-day revelation says which earth they inherit and when: it is “decreed that the poor and the meek of the earth shall inherit it,” once it has been sanctified, “that bodies who are of the celestial kingdom may possess it forever and ever” ([[D&C 88:17–20]]). Read with that revelation, the meek of the beatitude are those who keep their covenants and rise with celestial bodies.
    sources: [skinner-beatitudes, lds-scriptures]
  - ref: 6
    phrase: for they shall be filled
    kind: scripture
    title: Filled with the Holy Ghost
    body: |
      Matthew does not say what the hungry will be filled with; the risen Lord did. At Bountiful the promise reads, “they shall be filled with the Holy Ghost” ([[3 Ne. 12:6]]), and Joseph Smith's translation of Matthew reads the same. The blessing is the Spirit, felt more abundantly as people repent, are humble, and seek to do God's will.

      The promise is for those who want righteousness, not only those who have it. Jesus did not say “blessed are the righteous,” as if only a life without error qualified. He blessed those who want righteousness as a hungry and thirsty person wants food and drink.
    sources: [sc-knowhy-755, judd-perfect]
  - ref: 8
    phrase: they shall see God
    kind: symbol
    title: 'To see God: a temple promise'
    body: |
      This promise rests on a psalm sung by worshippers going up to the temple: “Who shall ascend into the hill of the LORD? or who shall stand in his holy place? He that hath clean hands, and a pure heart” ([[Ps. 24:3–4]]). The hill is the temple mount and the holy place the temple, and the Greek translation of the psalm has the very words Jesus used, “pure in heart,” in the singular (see the note at [[Ps. 24:6]]). In the psalm the pure in heart go up to see God in His temple. Jesus's later disciples understood His promise to reach beyond the earthly temple to the heavenly one, the presence of God opened by Christ's atoning sacrifice.

      The condition is a pure heart, not a flawless record. The beatitude does not say “blessed are the pure,” meaning those who have made no mistakes; it blesses those whose desires are pure, though they may not yet be without flaw.
    sources: [skinner-beatitudes, judd-perfect]
  - ref: 13
    phrase: if the salt have lost his savour
    kind: symbol
    title: Salt that loses its savour
    body: |
      Salt was a sign of covenant in Israel. A covenant between God and His people could be called “a covenant of salt” ([[Num. 18:19]]), and salt went with every offering ([[Lev. 2:13]]). Latter-day revelation applies Jesus's saying to people who make covenants: those who “covenant with an everlasting covenant … are accounted as the salt of the earth and the savor of men,” and if that salt loses its savor it is “good for nothing” ([[D&C 101:39–40]]).

      How can salt lose its savour? Pure salt is a stable compound and does not lose its saltiness with age. “Savor is lost through mixture and contamination.” A disciple's savour is lost the same way, by mixing worldliness with discipleship. Joseph Smith's translation turns Jesus's statement into a commission, “I give unto you to be the salt of the earth,” and the good salt is those who believe His words and mission.
    sources: [richardson-salt-light, asay-salt, lefevre-jst-sermon, lds-scriptures]
  - ref: 16
    phrase: Let your light so shine before men
    kind: christ
    title: Light that points to the Father
    body: |
      The picture in verse 15 is a household lamp set on its stand, and the “bushel” is a dry measure holding about a peck: nobody lights a lamp and then hides it under a measure. The light, though, is not the disciples' own. Their good works reflect the Savior's light, and the verse names the purpose of letting it shine: that others “glorify your Father which is in heaven.” A disciple who makes himself the light falls into what Nephi called priestcraft: “that men preach and set themselves up for a light unto the world, that they may get gain and praise of the world” ([[2 Ne. 26:29]]).
    sources: [thayer, richardson-salt-light]
  - ref: 17
    phrase: I am not come to destroy, but to fulfil
    kind: christ
    title: Not to destroy but to fulfil
    body: |
      To “fulfil” the law here means to fill it full, not to end it. The Greek verb's first meaning is “to fill or make full,” and it stands against a verb for “destroy” that means something like “annul” in a legal setting. In this sermon, fulfilling the law most likely means bringing out its true meaning, bringing it to full expression, and that is what the rest of the chapter does.

      The Book of Mormon tells what came later. At Bountiful, after His death and resurrection, the Lord said: “I am he that gave the law … therefore, the law in me is fulfilled, for I have come to fulfil the law; therefore it hath an end” ([[3 Ne. 15:5]]); and “the covenant which I have made with my people is not all fulfilled; but the law which was given unto Moses hath an end in me” ([[3 Ne. 15:8]]). The two sayings do not conflict. The sacrifices and ceremonies that pointed to Christ were brought to an end by His death; the moral precepts of the law, which existed before it and continue after it, did not cease but were raised to a higher standard. The Mount came early in the ministry, before the Atonement; Bountiful came after it.

      Not “one jot or one tittle” would pass. The jot is the smallest letter (the Hebrew *yod* or Greek *iota*), the tittle the small decorative stroke on a letter, and Jesus fulfilled every one of them, living every principle of the higher law He taught. Joseph Smith's translation of verse 19 sharpens the warning that follows: whoever breaks the least commandments and teaches others to do so “shall in no wise be saved in the kingdom of heaven,” and whoever keeps and teaches them “until it be fulfilled” shall be saved (JST Matt. 5:21).
    sources: [huntsman-antitheses, judd-perfect, griffin-matthew-portrayal, jst-matt-5, lds-scriptures]
  - ref: 20
    phrase: exceed the righteousness of the scribes and Pharisees
    kind: history
    title: Righteousness that exceeds the Pharisees’
    body: |
      The demand to exceed the righteousness of the scribes and Pharisees may have been one of the sayings that left the people “astonished at his doctrine” ([[Matt. 7:28]]). The scribes and Pharisees took pride in keeping every regulation of the law of Moses; how could anyone do better? The six teachings that follow give the answer. The law's regulations very often concerned outward acts, and the gospel reaches the intent of the heart as well. Joseph Smith's translation states it as a commandment in the middle of the chapter: “that ye suffer none of these things to enter into your heart” (JST Matt. 5:28). The scribes and Pharisees had tried to protect the law by hedging it about with added rules; Jesus taught a better way to reach what the law intended.
    sources: [judd-perfect, huntsman-antitheses]
  - ref: 21
    phrase: it was said by them of old time
    kind: words
    title: On His own authority
    body: |
      The King James “said by them of old time” can sound as if the ancients were the speakers, but the Greek more properly means “it was said *to* them of old time.” The passive verb probably points to God as the speaker: God said this to Israel, and Jesus, the premortal Jehovah who was present at Sinai, now says what it fully means.

      Then come the words “But I say unto you,” six times in the chapter. Jesus cites no other teacher or authority, which seems to have been unusual in His day; He taught “as one having authority, and not as the scribes” ([[Matt. 7:29]]). The Book of Mormon says why He could: “I am he that gave the law” ([[3 Ne. 15:5]]). The Jehovah who gave the law at the first is the man who taught its deeper meaning in Galilee.
    sources: [huntsman-antitheses]
  - ref: 22
    phrase: without a cause
    kind: words
    title: Anger for any cause
    body: |
      The words “without a cause” were very probably not in Matthew's Gospel at first, and both the Book of Mormon ([[3 Ne. 12:22]]) and the Joseph Smith Translation leave them out. In Greek they are a single word. The oldest manuscript of the verse lacks it, as do two early codices, Sinaiticus and Vaticanus, and the early writer Justin; the witnesses that have it come nearly two centuries later, and in Sinaiticus the word was written in above the line by a later scribe. The reading can be confidently judged a later addition, apparently made by copyists to soften the command and allow anger on some occasions. Here the restored text agrees with the earliest manuscripts, though the Joseph Smith Translation is used only with caution as evidence of the Bible's original wording. Without the qualifier, the teaching is that uncontrolled anger for any cause can lead to sin.

      Jewish teachers of the time also warned against anger; what is new is how far Jesus's warning reaches. His examples reach everyday words. “Raca,” from an Aramaic word meaning “empty,” was a condescending word, used even to servants and members of one's household, and “fool” was disrespectful but not especially harsh. Yet whoever uses them is put in danger of judgment, and the one who says “fool” in danger of “hell fire,” in Greek the Gehenna of fire. Gehenna was the valley of Hinnom south of Jerusalem, once a place of idol worship and later the place where the city's refuse was burned, and so a symbol of torment after death.
    sources: [wayment-variants-sermon, huntsman-antitheses, thayer, bd-gehenna]
  - ref: 24
    phrase: first be reconciled to thy brother
    kind: history
    title: Leave the gift at the altar
    body: |
      Leaving a gift at the altar to seek reconciliation asked a great deal of a Galilean. The sermon was given in Galilee, and the altar where offerings were brought was in Jerusalem. A man from Galilee who remembered the quarrel there would likely have had to leave his gift, make the hard journey of about a hundred miles back to Galilee, reconcile with his brother, and return to Jerusalem to offer it.

      The case also turns the problem around. In verse 22 the danger was one's own anger; here it is that a brother “hath ought against thee.” Any breach in a relationship was serious enough to hinder the worship of God. At Bountiful the Lord gave the same teaching, but the offering had changed: the sacrifice He now asked for was “a broken heart and a contrite spirit” ([[3 Ne. 12:19]]), and the reconciled worshipper was to “come unto me with full purpose of heart, and I will receive you” ([[3 Ne. 12:24]]).
    sources: [hardison-sociocultural, huntsman-antitheses, sc-knowhy-755]
  - ref: 29
    phrase: if thy right eye offend thee, pluck it out
    kind: words
    title: A parable about sins
    body: |
      Jesus is not commanding anyone to injure themselves. “Offend” means cause to stumble, and the eye and hand are hyperbole, exaggeration that drives a point home. The usual form of the saying named the hand first and the eye second ([[Matt. 18:8–9]]), but here the eye comes first, to tie it to the lustful look of verse 28.

      Joseph Smith's translation has Jesus say so outright: “And now this I speak, a parable concerning your sins; wherefore, cast them from you, that ye may not be hewn down and cast into the fire” (JST Matt. 5:34, in the footnotes). Before the saying it adds the commandment quoted in the note on verse 20, and says it is better to deny oneself these things and “take up your cross.” For all its harshness, the image assumes that the first sin can be repented of and forgiven; what it condemns is failing to take sin seriously.
    sources: [huntsman-antitheses, lefevre-jst-sermon, lds-scriptures]
  - ref: 32
    phrase: saving for the cause of fornication
    kind: history
    title: Divorce and the higher law
    body: |
      On divorce, Jesus spoke into a live debate. In the first century two schools of the Pharisees, those of Shammai and Hillel, disagreed over what grounds for divorce [[Deut. 24:1]] allowed (see the note there), Hillel's school reading it broadly and Shammai's strictly. Here Jesus sides with the stricter view against easy divorce, and goes beyond it. Marriage was meant to be a permanent relationship, and divorce was not to give a spouse a “do-over.” The one exception is “fornication,” Greek *porneia*, a word hard to pin down but probably meaning serious sexual wrongdoing. Remarriage after any other divorce is called adultery because, in God's eyes, the first union that made the two “one flesh” still stands. Jesus returns to the question at length in [[Matt. 19:3–9]], where He calls Moses' permission a concession to “the hardness of your hearts” ([[Matt. 19:8]]).

      The Church's present teaching takes up the same phrase: the marriage required for exaltation “does not contemplate divorce,” but because “of the hardness of [our] hearts,” the Lord “does not currently enforce the consequences of the celestial standard. He permits divorced persons to marry again without the stain of immorality specified in the higher law.”
    sources: [frederick-divorce, huntsman-antitheses, draper-divorce, oaks-divorce]
  - ref: 34
    phrase: Swear not at all
    kind: history
    title: Why not swear at all
    body: |
      Of old, oaths were allowed only as solemn covenants before the Lord, and those were to be performed (verse 33); Jesus forbids swearing at all. His list shows why. Heaven is God's throne, the earth His footstool, Jerusalem His city, and even a person's own head is beyond his power to change: God and everything connected with Him is holy, too holy to be used lightly or dishonestly. Anciently a witness was often sworn in the Lord's name, so a false witness broke two commandments at once. Jesus asks for a truthfulness so steady that a plain “yes” or “no” needs nothing added, and for moderate, simple speech free of oaths and profanity.
    sources: [talmage-jesus-christ-17, huntsman-antitheses]
  - ref: 39
    phrase: turn to him the other also
    kind: history
    title: The other cheek and the second mile
    body: |
      “An eye for an eye” was meant to limit retribution (see the note at [[Ex. 21:24]]), but it could easily be taken as permission to retaliate, and Jesus's answer counters that impulse. His examples step down in severity: a blow, then the loss of property, then the loss of time, and finally a loan. A blow on the right cheek, struck with the right hand, is a backhanded slap: an insult more than an attack. The “coat” is the tunic worn underneath, the “cloak” the more costly outer garment. The one who “shall compel thee to go a mile” is anyone with power to press another into service, as to carry his load. Across the examples the disciple yields and gives, and the string ends in a changed, generous heart.

      These are not commands to submit to every unjust demand, nor a denial of the right to protect oneself. They were spoken first to men who would give their whole lives to the work of the kingdom, for whom it would be better to suffer loss or indignity than to hinder that work by contention.
    sources: [huntsman-antitheses, judd-resist-not-evil, talmage-jesus-christ-17]
  - ref: 43
    phrase: and hate thine enemy
    kind: scripture
    title: A saying not in the law
    body: |
      “Thou shalt love thy neighbour” is from the law ([[Lev. 19:18]]), but “hate thine enemy” is not in the Old Testament. It seems to have been an interpretation current in Jesus's day, so “it hath been said” covers a quotation and an interpretation joined together. The command to love one's neighbor could be read narrowly, as one's own people only, leaving Israel's enemies to be counted God's enemies and hatred of them justified.

      Jesus answers with the Father. God sends His sun and rain on the evil and the good alike, and that care for all His children is the key to loving one's enemies.
    sources: [lefevre-jst-sermon, huntsman-antitheses]
  - ref: 46
    phrase: do not even the publicans the same
    kind: history
    title: A publican’s own Gospel
    body: |
      Matthew had been a publican himself (see the note at [[Matt. 9:9]]), and he records without softening this reference to his own despised class. Luke's sermon says “sinners” instead ([[Luke 6:32–34]]). Matthew also calls himself “Matthew the publican” in his list of the apostles ([[Matt. 10:3]]), where the other Gospels leave the title off ([[Mark 3:18]]; [[Luke 6:15]]).
    sources: [talmage-jesus-christ-17]
  - ref: 48
    phrase: Be ye therefore perfect
    kind: christ
    title: 'Perfect: complete, as the Father is'
    body: |
      “Perfect” is the Greek *teleios*, “complete.” It comes from *telos*, “end,” and it implies reaching a distant objective, not freedom from error. The Greek Old Testament uses the same word for Noah, “perfect in his generations” ([[Gen. 6:9]]), and neither that word nor the Hebrew behind it meant that Noah was flawless.

      The “therefore” ties the command to what comes just before it. The Father sends His sun and rain on those who do not love Him; to be perfect as He is perfect is to be as completely devoted as He is, and to love those who do not love you.

      At Bountiful the risen Lord repeated the command with one addition: “I would that ye should be perfect even as I, or your Father who is in heaven is perfect” ([[3 Ne. 12:48]]). This time He named Himself with His Father as a perfected being; on the Mount He had not. Though He never broke a commandment, the eternal perfection He then spoke of was His only after His Atonement and Resurrection.
    sources: [nelson-perfection-pending, judd-perfect]

christ: |
  Matthew 5 shows Jesus Christ as the giver of the law Himself. The Jehovah who gave the commandments to Israel is the man who sat on the mountain in Galilee and said, “But I say unto you,” and He told the Nephites so: “I am he that gave the law” ([[3 Ne. 15:5]]). After His resurrection He named Himself beside the Father as the pattern of the perfection He asks for ([[3 Ne. 12:48]]). That perfection reaches the heart and not only conduct, and it is not reached by effort alone: “Perfection is pending. It can come in full only after the Resurrection and only through the Lord.” Loving an enemy may be beyond a person's own power; a heart changed to be like Christ's makes it possible.

explore: |
  - **The Sermon at the Temple.** Read [[3 Ne. 12]] beside this chapter, and [[3 Ne. 15:1–10]] on the law fulfilled.
  - **Luke's sermon.** [[Luke 6:17–36]], with its four beatitudes and four woes.
  - **The psalms behind the Beatitudes.** [[Ps. 37:11]] and [[Ps. 24:3–6]].
  - **The law Jesus quotes.** [[Ex. 20:13–14]]; [[Deut. 24:1–4]]; [[Ex. 21:23–25]]; [[Lev. 19:18]]; and divorce again in [[Matt. 19:3–12]].
  - Elder Russell M. Nelson's general conference talk “Perfection Pending” (October 1995) explains the Greek behind verse 48 and the Lord's words at Bountiful.

