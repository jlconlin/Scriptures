chapter: 25
title: The Virgins, the Talents, and the Judgment
tagline: On the Mount of Olives Jesus closes His prophecy of His coming with two parables and a scene of judgment, ten virgins waiting for a bridegroom, three servants trusted with their master's money, and the nations divided like sheep and goats before the King.
when: 'On the Mount of Olives, in the evening of the Tuesday of the last week of Jesus’s mortal ministry'

setting: |
  Matthew 25 is the second half of the last of Matthew’s five long discourses, the prophecy on the Mount of Olives in chapters 24–25, which closes with “when Jesus had finished all these sayings” ([[Matt. 26:1]]). Jesus gave it on the Tuesday of His last week, after leaving the temple for the last time, to His closest disciples, as evening came on. The next chapter begins the account of His death.

  Chapter 24 is the prophecy itself: the fall of the temple and the signs of His coming. Joseph Smith’s revision of it is in the Pearl of Great Price as Joseph Smith—Matthew, and the site’s commentary on that discourse is there ([[JS—M 1:1]]). Matthew’s account, longer than Mark’s or Luke’s, ends with four parables about being prepared: the faithful and the evil servant ([[Matt. 24:45–51]]) and the three scenes of this chapter.

  Only Matthew reports the ten virgins. Luke has a parable much like the talents, the pounds, but Jesus told it earlier, to a mixed crowd on the road up from Jericho ([[Luke 19:11–27]]); the talents were told privately to His disciples.

thread: |
  **Waiting and working until He comes, and what He will ask when He does.**

  The prophecy of chapter 24 left the disciples with a command to watch, since no one knows the hour. Chapter 25 shows what watching means. The ten virgins teach waiting: all of them sleep, and what divides them is whether they brought enough oil for a long night. The talents teach working: the master is gone “a long time” (verse 19), and what divides his servants is whether they put his money to use. The two belong together; “it is as necessary at times to wait as at others to work.”

  In both, those who fail do nothing outrageous. The foolish virgins are guilty of “simple apathy and neglect”; the third servant buries the money safely and gives it back whole. The judgment scene that closes the chapter names the same failure plainly: the sins of those on the left are “all of them, sins of omission.” And it names what readiness looks like. It is not a feat but food, drink, a welcome, clothing and a visit, given to people the King calls His brethren, and counted as given to Him.

sections:
  - range: 1-13
    heading: The ten virgins
    plain: |
      At that day, before the Son of Man comes, the kingdom of heaven will be like ten young women who took their lamps and went out to meet the bridegroom. Five of them were foolish and five were wise. The foolish took their lamps but no extra oil; the wise took flasks of oil along with their lamps. The bridegroom was a long time coming, and they all grew drowsy and fell asleep. At midnight the cry rang out: “Here is the bridegroom! Come out to meet him!” Then all the young women got up and trimmed their lamps. The foolish said to the wise, “Give us some of your oil; our lamps have gone out.” “No,” the wise answered, “there may not be enough for both us and you. Go instead to those who sell oil and buy some for yourselves.” While they were gone to buy it, the bridegroom arrived. Those who were ready went in with him to the wedding feast, and the door was shut. Later the others came too. “Lord, Lord,” they said, “open the door for us!” But he answered, “Truly I tell you, I do not know you.” So keep watch, because you do not know the day or the hour when the Son of Man is coming.
  - range: 14-30
    heading: The talents
    plain: |
      It is also like a man going on a journey to a far country, who called his own servants and entrusted his property to them. To one he gave five talents, to another two, and to another one, each according to his ability; then he set out at once. The man who had received five talents went straight to work with them and earned five more. The one with two did the same and gained two more. But the one who had received one talent went off, dug a hole in the ground and hid his master’s money. After a long time the master of those servants came back and settled accounts with them. The one who had received five talents brought five more. “Master,” he said, “you entrusted me with five talents; look, I have gained five more.” His master said, “Well done, good and faithful servant! You have been faithful over a few things; I will put you in charge of many. Come and share your master’s joy.” The one with two talents came too: “Master, you entrusted me with two talents; look, I have gained two more.” His master said, “Well done, good and faithful servant! You have been faithful over a few things; I will put you in charge of many. Come and share your master’s joy.” Then the one who had received one talent came. “Master,” he said, “I knew that you are a hard man, reaping where you have not sown and gathering where you have not scattered seed. So I was afraid, and I went and hid your talent in the ground. Here, you have what is yours.” His master answered, “You wicked, lazy servant! So you knew that I reap where I have not sown and gather where I have not scattered? Then you ought to have put my money with the bankers, and on my return I would have received it back with interest. Take the talent from him and give it to the one who has ten. For everyone who has will be given more, and he will have plenty; but from the one who has not, even what he has will be taken away. And throw that worthless servant out into the darkness outside, where there will be weeping and grinding of teeth.”
  - range: 31-46
    heading: The sheep and the goats
    plain: |
      When the Son of Man comes in His glory, and all the holy angels with Him, He will sit on His glorious throne. All the nations will be gathered before Him, and He will separate them from one another as a shepherd separates the sheep from the goats. He will put the sheep on His right hand and the goats on His left. Then the King will say to those on His right, “Come, you whom my Father has blessed; receive your inheritance, the kingdom prepared for you since the creation of the world. For I was hungry and you gave me food, I was thirsty and you gave me drink, I was a stranger and you took me in, I needed clothes and you clothed me, I was sick and you cared for me, I was in prison and you came to me.” Then the righteous will answer Him, “Lord, when did we see you hungry and feed you, or thirsty and give you drink? When did we see you a stranger and take you in, or needing clothes and clothe you? When did we see you sick or in prison and come to you?” The King will answer, “Truly I tell you, whatever you did for one of the least of these my brothers, you did for me.” Then He will say to those on His left, “Depart from me, you who are under a curse, into the everlasting fire prepared for the devil and his angels. For I was hungry and you gave me nothing to eat, I was thirsty and you gave me nothing to drink, I was a stranger and you did not take me in, I needed clothes and you did not clothe me, I was sick and in prison and you did not look after me.” They too will answer, “Lord, when did we see you hungry or thirsty or a stranger or needing clothes or sick or in prison, and did not help you?” He will answer, “Truly I tell you, whatever you did not do for one of the least of these, you did not do for me.” And these will go away into everlasting punishment, but the righteous into eternal life.

notes:
  - ref: 1
    phrase: Then shall the kingdom of heaven be likened unto ten virgins
    kind: scripture
    title: 'At that day: the parable fulfilled at His coming'
    body: |
      The “then” of verse 1 looks ahead to the Second Coming, and Restoration scripture says so outright. Joseph Smith’s translation opens the chapter “And then, at that day, before the Son of man comes, the kingdom of …” (JST Matt. 25:1, in the footnote), tying the parable to the coming Jesus has just described. A revelation of 1831 puts it in the Lord’s own voice: “at that day, when I shall come in my glory, shall the parable be fulfilled which I spake concerning the ten virgins” ([[D&C 45:56]]). The same revelation says who the wise are: “they that are wise and have received the truth, and have taken the Holy Spirit for their guide, and have not been deceived” ([[D&C 45:57]]).

      So the ten are not the world at large. All of them were invited to the wedding, all carried lamps, all went out to meet the bridegroom; “the ten virgins obviously represent members of Christ’s Church, for all were invited to the wedding feast and all knew what was required to be admitted.” What divides them is not membership but readiness, and the arithmetic is sobering: only half were ready when he came.
    sources: [lds-scriptures, talmage-jesus-christ-32, oaks-preparation-second-coming]
  - ref: 1
    phrase: went forth to meet the bridegroom
    kind: history
    title: A wedding procession at night
    body: |
      The story rests on marriage customs Jesus’s listeners knew, long kept in that region and especially at the weddings of the wealthy. The bridegroom went with his friends to the bride’s home and then brought her in procession to his own, where the feast was held. Along the way the party grew, as little groups who had been waiting came out to meet it, especially near the end of the route. An account in the book of 1 Maccabees tells of a bride brought with a large escort while the bridegroom “came out with his friends and his brothers to meet them with tambourines and musicians”. Weddings were held in the evening and into the night, so the waiting maidens needed light; each lamp may have been fixed to a rod and held up in the march.

      The wedding points to Christ and His people. The Bridegroom is the Lord Jesus, who had already called Himself the bridegroom ([[Matt. 9:15]]); the marriage feast is His coming in glory to receive His Church as His bride, the covenant union of the Lord and His people.
    sources: [talmage-jesus-christ-32, ellison-family-marriage, huntsman-tuesday]
  - ref: 4
    phrase: the wise took oil in their vessels with their lamps
    kind: symbol
    title: Lamps and oil
    body: |
      Every one of the ten had a lamp; what separated them was the oil they carried besides. The foolish had only the first filling, perhaps counting on no delay, perhaps on borrowing, perhaps not thinking about it at all. Read as a figure, the lighted lamp is the outward profession of belief that all ten shared, and the reserve of oil is “the spiritual strength and abundance which diligence and devotion in God’s service alone can insure.” The revelation that explains the parable points the same way: the wise “have taken the Holy Spirit for their guide” ([[D&C 45:57]]).

      In what is offered as “one of many possible interpretations,” the lamps are testimony and the oil is conversion. The point of the image is how such oil is gathered: “one drop at a time,” patiently, so that “no last-minute flurry of preparation is possible.” A revelation of October 1830 uses the parable’s own words for the same readiness: “having your lamps trimmed and burning, and oil with you, that you may be ready at the coming of the Bridegroom” ([[D&C 33:17]]).
    sources: [talmage-jesus-christ-32, lds-scriptures, bednar-converted]
  - ref: 5
    phrase: While the bridegroom tarried, they all slumbered and slept
    kind: symbol
    title: All ten slept
    body: |
      The wise slept too, and they still went in to the marriage (verse 10). The bridegroom’s coming was sudden, and none of the ten was blamed for being surprised; the foolish five simply suffered the natural result of being unprepared. The difference showed only when the cry came. All ten woke and trimmed their lamps, but only five had brought oil in vessels.

      The delay matters as much as the sleep. The bridegroom “tarried,” and in the next parable the master returns “after a long time” (verse 19): in both, a long interval lies between the Lord’s going away and His return in glory. One reading sees in the slumber any quiet season in the life of a church or of a believer, when even the wise and good are apt to slumber and the crisis takes them by surprise; what the wise have, and the foolish lack, is “the reserved force of steadfast faith and divine help to fall back upon.”
    sources: [talmage-jesus-christ-32, ellicott-matthew]
  - ref: 9
    phrase: Not so; lest there be not enough for us and you
    kind: prophets
    title: Oil that cannot be lent
    body: |
      The wise virgins’ refusal sounds selfish, and it is not meant to: they were saying, correctly, that “the oil of conversion cannot be borrowed.” The strength that comes from obedience, the knowledge that comes from study, and the peace the gospel gives cannot be handed to someone else at the last minute. “Buy for yourselves” is not a business transaction but a statement of each person’s own responsibility.

      The refusal “must not be regarded as uncharitable”; it stands for the fact that “in the day of judgment every soul must answer for himself; there is no way by which the righteousness of one can be credited to another’s account.” The foolish virgins had hoped to get by on someone else’s supply, living “on borrowed substance and borrowed light.”
    sources: [bednar-converted, talmage-jesus-christ-32, oaks-preparation-second-coming]
  - ref: 12
    phrase: I know you not
    kind: prophets
    title: Ye know me not
    body: |
      Joseph Smith’s translation turns the bridegroom’s answer around: “Verily I say unto you, Ye know me not” (JST Matt. 25:11, in the footnote). He made the same change in the Sermon on the Mount, and the note at [[Matt. 7:23]] explains the pair. Even as the King James Version has it, the answer can be read as saying that the women at the door, pleading but neglectful, had not come to know Him.

      The parable gives the reversal its edge. The five outside call Him “Lord, Lord”; they knew He was coming and went out to meet Him, and still they had not prepared. The two revised sentences, “Ye never knew me” and “Ye know me not,” mark the difference between knowing about the Savior and “increasingly coming to know Him.”
    sources: [lds-scriptures, talmage-jesus-christ-32, bednar-known-me]
  - ref: 15
    phrase: unto one he gave five talents
    kind: words
    title: A talent was money
    body: |
      In the parable a talent is not a natural gift, and not a coin either, but a sum of money. The Greek *talanton* meant first a pair of scales, then “that which is weighed,” and so a weight, and a sum of money weighing a talent, which varied from place to place. The story is about bondservants trusted with their master’s business: they and the goods in their keeping were his.

      The English sense of “talent” as an ability has often shaped how the parable is read. Read in its place, as one of the parables that close the prophecy of the Second Coming, it “has nothing to do with the modern understanding of talents as an ability to sing or to dance”; the talents stand for “any stewardship with which we are entrusted and must magnify to help build the kingdom in preparation for the Second Coming.” The money is the master’s, entrusted to his servants for the time he is away.
    sources: [thayer, bd-money, talmage-jesus-christ-32, strathearn-teaching-gospels]
  - ref: 23
    phrase: Well done, good and faithful servant
    kind: symbol
    title: Two talents, the same welcome
    body: |
      The servant with two talents hears exactly the words said to the servant with five (verses 21 and 23). The lord had given each “according to his several ability,” knowing whether a man could best use one, two or five, and he rewards equal diligence equally, whether it shows as a great gain or a small but proportionate one. In Luke’s parable of the pounds each servant receives the same sum, and the rewards differ with what each made of it ([[Luke 19:13–19]]); here the sums differ, and the welcome does not.

      So “good work of relatively small scope” is not less acceptable than work on a larger scale. Had the third servant doubled his one talent, he would have been welcomed in the same words.
    sources: [talmage-jesus-christ-32]
  - ref: 24
    phrase: I knew thee that thou art an hard man
    kind: symbol
    title: The servant who blamed his master
    body: |
      The third servant’s report opens with an accusation. “Hard” means strict (the footnote), and he charges his master with taking profit he did not earn. The other two saw in their lord the goodness they had in smaller measure; this one, looking at the same master, “professed to see in the Master his own base defects.”

      The master does not refute the charge. He turns the servant’s own words on him (verse 26): if he really thought so, he could at least have put the money with the “exchangers,” the bankers who sat at their tables, and it would have come back with “usury,” which here means simply interest, not an illegal or exorbitant rate. The servant had called his inaction caution (“I was afraid,” verse 25); the master calls it “wicked and slothful.” Verse 29 repeats a saying Jesus had spoken of the parables ([[Matt. 13:12]], linked in the footnote); here the unused talent is taken from the servant who had “counted it as of so little worth.” “Talents are not given to be buried, and then to be dug up and offered back unimproved.”
    sources: [lds-scriptures, talmage-jesus-christ-32, ellicott-matthew]
  - ref: 32
    phrase: as a shepherd divideth his sheep from the goats
    kind: symbol
    title: The Shepherd who judges
    body: |
      In the closing scene Jesus pictures Himself as the Judge of the world, parting the nations as a shepherd parts his flock. The scene is more than a parable: the sheep and goats are only a brief comparison inside a picture of the judgment itself, and its opening, the Son of Man coming in glory to sit on His throne, draws on Daniel’s vision of “one like the Son of man” ([[Dan. 7:13]]).

      In the Old Testament the words for a “flock” cover both sheep and goats. Elsewhere the shepherd is the figure of protective, self-sacrificing love, and Jesus calls Himself “the good shepherd” ([[John 10:14]]); here the shepherd who protects is also the one who separates. The right hand and the left stand for acceptance and rejection, and the shepherd of verse 32 is the King of verse 34.
    sources: [ellicott-matthew, pike-shepherd]
  - ref: 40
    phrase: one of the least of these my brethren
    kind: christ
    title: Done unto me
    body: |
      The King counts every mercy shown to the hungry, the stranger, the sick and the prisoner as shown to Him in person. Neither group saw Him in the people they met. The righteous ask when they ever saw Him hungry, and regard themselves as undeserving of what He gives them; those on the left “thought that they were only neglecting their fellow men.”

      King Benjamin taught the same truth from the other side: “when ye are in the service of your fellow beings ye are only in the service of your God” ([[Mosiah 2:17]]). So the scene suggests that “the best preparation we can make to be found on the right hand of our Heavenly King is to love and serve others, for thereby we are in fact serving the Lord.”
    sources: [talmage-jesus-christ-32, ellicott-matthew, huntsman-tuesday]
  - ref: 41
    phrase: Depart from me, ye cursed
    kind: words
    title: Blessed of my Father, cursed by their own deeds
    body: |
      The two sentences of judgment are not mirror images. Those on the right are “blessed of my Father,” and the kingdom was “prepared for you from the foundation of the world” (verse 34). Those on the left are only “ye cursed,” without “of my Father,” and the fire was prepared “for the devil and his angels,” not for them. One reading takes the omission as deliberate: the Father is not the author of the curse, and those on the left have brought themselves under it by their own deeds. The footnote renders the word as those “who have come under a curse.”
    sources: [ellicott-matthew, lds-scriptures]
  - ref: 46
    phrase: everlasting punishment
    kind: scripture
    title: Everlasting punishment is God’s punishment
    body: |
      The footnote to “everlasting” points to a revelation that explains the word. “It is not written that there shall be no end to this torment, but it is written endless torment”; the words are “more express than other scriptures, that it might work upon the hearts of the children of men” ([[D&C 19:6–7]]). Then the Lord gives the key: “I am endless, and the punishment which is given from my hand is endless punishment, for Endless is my name. … Eternal punishment is God’s punishment” ([[D&C 19:10–11]]). “Everlasting” names whose punishment it is.
    sources: [lds-scriptures]

christ: |
  Matthew 25 shows Jesus Christ in three roles: the Bridegroom whose people wait for Him through the night, the Lord who entrusts His goods to His servants and comes back to settle accounts, and the King on the throne of His glory who judges the nations. In the last scene the King counts what was done for the hungry, the stranger and the prisoner as done to Him (verse 40). So the readiness these parables ask for is built in ordinary days. The oil the wise virgins carried is gathered “one drop at a time” and cannot be borrowed at the midnight cry, and the service the King will count is given now, to the people at hand, since service to one’s fellow beings is service to God ([[Mosiah 2:17]]).

explore: |
  - **The parable in latter-day revelation.** [[D&C 45:56–59]], the ten virgins fulfilled at the Lord’s coming; [[D&C 33:17]], lamps trimmed and burning.
  - **The pounds.** [[Luke 19:11–27]], a parable like the talents, told earlier on the road to Jerusalem.
  - **The rest of the prophecy.** [[JS—M 1:37–55]], Joseph Smith’s revision of the close of Matthew 24.
  - *Jesus the Christ*, chapter 32, reads the two parables and the judgment as one discourse.

