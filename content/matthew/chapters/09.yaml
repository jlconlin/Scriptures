chapter: 9
title: Power on Earth to Forgive Sins
tagline: Jesus forgives and heals a paralyzed man, calls a tax collector and eats with sinners, answers a question about fasting, raises a ruler’s daughter, heals a woman, two blind men and a mute man, and looks on the scattered crowds with compassion.
when: 'During Jesus’s ministry in Galilee; Matthew gathers into one block events that Mark places at different times'

setting: |
  Matthew 9 finishes the collection of miracles that began in chapter 8. Matthew arranges much of his material by theme rather than by sequence, and these two chapters gather the miracle stories into one such block: the healing of the paralyzed man, the call of Matthew and the question about fasting come together in Mark too ([[Mark 2:1–22]]), but Mark tells the raising of Jairus’s daughter only after the calming of the storm and the Gadarene demoniac ([[Mark 5:21–43]]), and Matthew joins it straight to the fasting question: “While he spake these things unto them” (verse 18).

  The chapter opens in Capernaum, “his own city,” where Jesus had made His home ([[Matt. 4:13]]; [[Mark 2:1]]), and it is there that He calls a local tax collector named Matthew, known also as Levi. This is the man whose name the Gospel bears.

  The chapter closes with a verse, [[Matt. 9:35]], that repeats [[Matt. 4:23]] almost word for word and so closes the unit of sermon and miracles that verse opened (see the note on [[Matt. 4:23]]). The last three verses, on the harvest and the labourers, lead into chapter 10, where the Twelve are sent out.

thread: |
  **The Son of man has power on earth to forgive sins, and the rest of the chapter shows that authority meeting people in every kind of need.**

  The first story states it outright. Jesus forgives a man’s sins, the scribes call it blasphemy, and He makes the man walk “that ye may know that the Son of man hath power on earth to forgive sins” (verse 6). The rest of the chapter shows what that authority looks like when it meets people. The Physician sits down with the sick (verses 10–13). The Bridegroom’s presence makes this a time for feasting, not fasting, and what He brings is new wine that the old bottles cannot hold (verses 14–17). Faith reaches out to Him and is answered: a ruler who believes his daughter can live, a woman who believes a touch is enough, two blind men who answer “Yea, Lord” (verses 18–31).

  Matthew has also gathered these healings as evidence. By the end of chapter 9 every kind of miracle Jesus will later name to John the Baptist’s messengers has been told ([[Matt. 11:5]]). The evidence divides its witnesses: the multitudes say “It was never so seen in Israel,” and the Pharisees say He casts out devils by the prince of the devils (verses 33–34). Jesus answers neither. He looks at the harassed crowds, sees sheep with no shepherd, and asks His disciples to pray for labourers.

sections:
  - range: 1-8
    heading: The man with the palsy
    plain: |
      Jesus got into a boat, crossed the lake, and came to His own town. Some people brought Him a paralyzed man lying on a mat. When Jesus saw their faith, He said to the paralyzed man, “Take heart, son; your sins are forgiven.” Some of the scribes said to themselves, “This man is blaspheming.” Jesus knew what they were thinking and said, “Why do you think evil in your hearts? Which is easier: to say, ‘Your sins are forgiven,’ or to say, ‘Get up and walk’? But so that you may know that the Son of Man has authority on earth to forgive sins”—then He said to the paralyzed man—“Get up, pick up your mat, and go home.” And the man got up and went home. When the crowds saw it, they were amazed and praised God, who had given such authority to men.
  - range: 9-13
    heading: The call of Matthew
    plain: |
      As Jesus went on from there, He saw a man named Matthew sitting at the tax booth, and said to him, “Follow me.” Matthew got up and followed Him. Later, while Jesus was eating in the house, many tax collectors and sinners came and ate with Him and His disciples. When the Pharisees saw this, they asked His disciples, “Why does your Master eat with tax collectors and sinners?” Jesus heard and said, “Those who are well don’t need a doctor; the sick do. Go and learn what this means: ‘I want mercy, not sacrifice.’ For I have not come to call the righteous, but sinners to repentance.”
  - range: 14-17
    heading: New cloth and new wine
    plain: |
      Then John’s disciples came and asked Him, “Why do we and the Pharisees fast often, but your disciples don’t fast?” Jesus answered, “Can the guests at a wedding mourn while the bridegroom is with them? The time will come when the bridegroom will be taken away from them, and then they will fast. No one sews a patch of unshrunk cloth onto an old garment, because the patch pulls away from the garment and the tear gets worse. And no one pours new wine into old wineskins; if they do, the skins burst, the wine spills, and the skins are ruined. New wine is put into new wineskins, and both are kept safe.”
  - range: 18-26
    heading: A ruler’s daughter and a woman’s faith
    plain: |
      While He was saying this, a ruler came and knelt before Him and said, “My daughter has just died. But come and lay your hand on her, and she will live.” Jesus got up and went with him, and so did His disciples. Just then a woman who had suffered from bleeding for twelve years came up behind Him and touched the tassel of His cloak, for she said to herself, “If I can only touch His cloak, I will be healed.” Jesus turned, saw her, and said, “Take heart, daughter; your faith has healed you.” And the woman was healed from that moment. When Jesus came into the ruler’s house and saw the flute players and the noisy crowd, He said, “Go away. The girl is not dead but asleep.” And they laughed at Him. But when the crowd had been put outside, He went in and took her by the hand, and the girl got up. The news of this spread through all that region.
  - range: 27-34
    heading: Two blind men and a mute man
    plain: |
      As Jesus went on from there, two blind men followed Him, calling out, “Have mercy on us, Son of David!” When He had gone indoors, the blind men came to Him, and Jesus asked them, “Do you believe that I am able to do this?” “Yes, Lord,” they answered. Then He touched their eyes and said, “Let it be done to you according to your faith,” and their sight was restored. Jesus sternly warned them, “See that no one knows about this.” But they went out and spread the news about Him all over that region. As they were going out, a man who could not speak and was possessed by a devil was brought to Jesus. When the devil was driven out, the man spoke, and the crowds were amazed and said, “Nothing like this has ever been seen in Israel.” But the Pharisees said, “He drives out devils by the prince of devils.”
  - range: 35-38
    heading: The harvest and the labourers
    plain: |
      Jesus went through all the towns and villages, teaching in their synagogues, proclaiming the good news of the kingdom, and healing every disease and sickness. When He saw the crowds, He had compassion on them, because they were harassed and scattered like sheep without a shepherd. Then He said to His disciples, “The harvest is great, but the workers are few. So pray to the Lord of the harvest to send out workers into His harvest.”

notes:
  - ref: 2
    phrase: 'Jesus seeing their faith said unto the sick of the palsy; Son, be of good cheer; thy sins be forgiven thee'
    kind: christ
    title: Whose faith, and why forgiveness first
    body: |
      “Their faith” includes the faith of the men who carried him. Matthew says only that they brought the man “lying on a bed”; Mark and Luke tell how far they went, four men climbing to the roof and letting him down through it because the crowd blocked the door ([[Mark 2:3–4]]; [[Luke 5:18–19]]). Jesus was surely moved by the faith and works of those who labored to bring a helpless man before Him, and no doubt He knew as well the trust in the sufferer’s own heart.

      Why speak of sins to a man who had come to be healed? The man was probably afraid, perhaps expecting to hear only condemnation, and Jesus’s first word to him in Matthew is “be of good cheer.” In this man’s case there seems to have been a close connection between his past sins and his affliction, and Jesus, recognizing his repentance with his faith, healed both. That is not a rule for all sickness. When the disciples later asked whose sin had made a man blind, Jesus answered that it was neither his own nor his parents’ ([[John 9:2–3]]).
    sources: [talmage-jesus-christ-14, lds-scriptures]
  - ref: 6
    phrase: the Son of man hath power on earth to forgive sins
    kind: christ
    title: Power on earth to forgive sins
    body: |
      The scribes called Jesus’s words blasphemy because they held that only God forgives sins. Mark gives their full thought: “who can forgive sins but God only?” ([[Mark 2:7]]). Jesus answers with a question: which is easier to say, “Thy sins be forgiven thee,” or “Arise, and walk”? Words of forgiveness cannot be put to an outward test; only the forgiven sinner’s own heart can witness to them. A command to a paralyzed man to stand up is tested in front of everyone at once. So Jesus speaks the words that can be checked, to show that the words that cannot be checked were true. The Joseph Smith Translation puts the question as a statement: “For is it not easier to say, Thy sins be forgiven thee, than to say, Arise and walk?” (JST Matt. 9:5). Spoken by Him, the two sayings belong together. In front of everyone Jesus claimed the right to remit both the physical and the spiritual penalty, and He backed the claim with a miracle.

      “Power” here is “authority” (the footnote’s gloss). “Son of man” is the title Jesus used of Himself (see the note on [[Matt. 8:20]]). Among the ideas it carries is His dignity as head of the kingdom of God and judge of all, and this very verse, in Mark’s telling, is one of the passages listed for that sense.

      The crowd praised God “which had given such power unto men” (verse 8). They saw authority given to a man, and had not yet seen that this man was more than a man.
    sources: [lds-scriptures, ellicott-matthew, talmage-jesus-christ-14, bd-son-of-man]
  - ref: 9
    phrase: 'a man, named Matthew, sitting at the receipt of custom'
    kind: history
    title: A tax collector called Levi
    body: |
      Matthew was a tax gatherer at Capernaum, sitting at the custom-house where duties were paid, and a Jew in that post was held in bitter contempt by his own people. Mark calls him Levi the son of Alphaeus, and Luke simply Levi ([[Mark 2:14]]; [[Luke 5:27]]); he was known by that name before his conversion. He probably collected for Herod Antipas, in whose territory Capernaum lay. Matthew is “the publican” in the list of the Twelve ([[Matt. 10:3]]), and publicans collected customs at every territorial border, leasing the right from the client king or governor for a fixed sum. Whatever they took in above the sum they kept, so their living depended on what they could get from travelers, and they were commonly thought corrupt.

      So the call is startling: “Follow me. And he arose, and followed him.” Luke adds that Levi “left all” and then gave Jesus a great feast in his own house ([[Luke 5:28–29]]), and the guests at that meal, his old associates, are the “publicans and sinners” of the next verse.
    sources: [bd-matthew, trotter-judea-province, talmage-jesus-christ-14]
  - ref: 11
    phrase: Why eateth your Master with publicans and sinners?
    kind: history
    title: Why the Pharisees objected to the meal
    body: |
      To the Pharisees a shared meal was a matter of holiness, not only of company. They kept in their own homes the ritual cleanliness required of priests, so that the holiness of the temple might rest on the household. To keep that level of holiness they could eat only with others equally careful, and tax collectors were specifically shut out of their table fellowship. By eating with people who were ritually unclean, Jesus would threaten the purity of any Pharisee who received Him at table.

      Jesus’s first answer, that the sick and not the whole need a physician, would not by itself have offended them; they would have agreed that the tax collectors and sinners were sick, and counted themselves among the whole. The sting comes in the next verse.
    sources: [lane-hostility]
  - ref: 13
    phrase: go ye and learn what that meaneth, I will have mercy, and not sacrifice
    kind: scripture
    title: Go and learn what Hosea meant
    body: |
      Matthew alone records this line, a quotation of [[Hos. 6:6]], and with it Jesus turns the question back on the questioners. “Go ye and learn what that meaneth” challenges the way these teachers read their own scriptures. In Hosea the Lord says it to a people who brought their offerings while they broke His covenant; the site’s note on Hosea 6:6 explains it there. Applied to this meal, the line suggests that the Pharisees’ careful ritual purity had become their “sacrifice”: they guarded their own cleanness while the spiritually sick went untended. Jesus questions that idea of holiness, and invites them to a higher one. Matthew will have Him quote the same verse again when the Pharisees fault His disciples on the Sabbath ([[Matt. 12:7]]).
    sources: [lane-hostility]
  - ref: 15
    phrase: the bridegroom shall be taken from them
    kind: christ
    title: The bridegroom taken away
    body: |
      Jesus answers a question about fasting by calling Himself the bridegroom, and the image must have reminded the men who asked of their own teacher’s words. They were disciples of John the Baptist, who was then in prison; some of them, left without their leader, had drawn close to the Pharisees in strict observance. John had told them plainly that he was only “the friend of the bridegroom” and that Jesus was the bridegroom ([[John 3:29]]). A wedding is no time for mourning. While the bridegroom is present, His friends feast.

      The second half of the verse is darker. “The days will come, when the bridegroom shall be taken from them” is the first recorded hint in Jesus’s public teaching of His death. The fast would come then, and with it a long wait for the cry “Behold, the bridegroom cometh” ([[Matt. 25:6]]).
    sources: [talmage-jesus-christ-14, ellicott-matthew]
  - ref: 16
    phrase: No man putteth a piece of new cloth unto an old garment
    kind: scripture
    title: What the patch and the bottles were about
    body: |
      The Joseph Smith Translation gives these puzzling sayings a setting. Between the bridegroom and the patch it adds an exchange with the Pharisees (JST Matt. 9:18–21). They ask, “Why will ye not receive us with our baptism, seeing we keep the whole law?” Jesus answers, “Ye keep not the law. If ye had kept the law, ye would have received me, for I am he who gave the law. I receive not you with your baptism, because it profiteth you nothing. For when that which is new is come, the old is ready to be put away.” Then come the patch and the bottles, so that in this setting they illustrate His last words: when the new has come, the old is put away. With the new covenant He required all to enter His Church by an authorized baptism.

      The Lord met the same resistance when He restored His Church. In April 1830 some who had been baptized before wanted to join the Church without being baptized again, and the answer was the same: “although a man should be baptized an hundred times it availeth him nothing, for you cannot enter in at the strait gate by the law of Moses, neither by your dead works” ([[D&C 22:2]]).
    sources: [jst-matt-9, millet-js-matthew, lds-scriptures]
  - ref: 17
    phrase: new wine into old bottles
    kind: symbol
    title: New wine in old wineskins
    body: |
      The “bottles” were wineskins, leather bags made from the skins of animals, used to hold water or wine. Old leather stiffens and cracks, and new wine still fermenting would burst an old skin and be lost along with it. Jesus had not come to mend an old garment. His gospel was new revelation that fulfilled the law, “no mere addendum, nor … a reenactment of past requirements”; it “embodied a new and an everlasting covenant,” and it needed new vessels to hold it.
    sources: [thayer, talmage-jesus-christ-14]
  - ref: 18
    phrase: My daughter is even now dead
    kind: history
    title: Dead, or dying?
    body: |
      Matthew tells the story of Jairus in a few lines, and in his telling the father says at once that his daughter is dead. In Mark and Luke he says she is dying, and the news of her death comes later, while Jesus is delayed by the woman in the crowd ([[Mark 5:23, 35]]; [[Luke 8:42, 49]]). The Joseph Smith Translation reads “even now dying” here (JST Matt. 9:24, in the footnote), as the other two Gospels do.

      The accounts need not conflict. The girl was likely in the very throes of death when her father left her, so that by the time he reached Jesus he feared she had already died. Either way his faith held: “come and lay thy hand upon her, and she shall live.” Mark and Luke name him Jairus and call him a ruler of the synagogue ([[Mark 5:22]]; [[Luke 8:41]]); where they say he fell at Jesus’s feet, Matthew says he “worshipped him.”
    sources: [talmage-jesus-christ-20, lds-scriptures]
  - ref: 20
    phrase: diseased with an issue of blood twelve years
    kind: history
    title: Twelve years unclean
    body: |
      The woman’s illness was an affliction, and under the law of Moses it also made her unclean. A woman with an issue of blood beyond the usual time “shall be unclean” for as long as it lasted, and so was the bed she lay on and whatever she sat on; whoever touched those things had to wash and was unclean until evening ([[Lev. 15:25–27]]). For twelve years, then, she had lived with that condition as well as the illness. Mark adds that she had suffered much from many physicians and spent everything she had, and only grew worse ([[Mark 5:26]]).

      She came from behind, and once she was healed she tried to slip back into the crowd unnoticed. Matthew tells the story most briefly of the three: Jesus turns, sees her, and speaks to her. He calls her “Daughter” and tells her, as He told the man with the palsy, to take comfort.
    sources: [lds-scriptures, talmage-jesus-christ-20]
  - ref: 20
    phrase: touched the hem of his garment
    kind: symbol
    title: The tassel on His cloak
    body: |
      The “hem” was most likely one of the tassels that the law required every Israelite man to wear. The Greek word, *kraspedon*, stands in the New Testament for the Hebrew *tsitsit*, a tassel of twisted wool hanging from the corner of the cloak. The Lord had commanded Israel to make “fringes in the borders of their garments,” with a cord of blue, “that ye may look upon it, and remember all the commandments of the Lord, and do them” ([[Num. 15:38–39]]). The scribes and Pharisees made theirs conspicuously large ([[Matt. 23:5]]).

      So the woman reached for the tassel that reminded its wearer of the law. One Latter-day Saint reading sees more in the gesture. The Hebrew word for a garment’s border, *kanaph*, is also the word for “wing,” and Malachi had promised that the Sun of righteousness would arise “with healing in his wings” ([[Mal. 4:2]]); in reaching for the border of His garment, she found the healing Malachi had promised in His “wings.” That is a reading of the scene, not something Matthew states. Others later reached for the same tassel: “as many as touched were made perfectly whole” ([[Matt. 14:36]]).
    sources: [thayer, lds-scriptures, ellicott-matthew, south-clothing-textiles]
  - ref: 24
    phrase: the maid is not dead, but sleepeth
    kind: history
    title: Not dead, but sleepeth
    body: |
      The girl was dead, and everyone in the house knew it. The minstrels and the noisy crowd were professional mourners, flute players and wailers whom custom required, and preparations for the funeral, which followed death as quickly as possible, were already under way. They laughed at Jesus because they had no doubt she was dead.

      To speak of death as sleep was common at the time, and Jesus meant that her sleep would be short. He used the same words of Lazarus, and when the disciples took Him literally He told them plainly, “Lazarus is dead” ([[John 11:11–14]]). He put the mourners out and took her by the hand.

      What happened to her was not resurrection. Her spirit returned to her mortal body, and she would die again someday. Jesus Christ was the first to come forth from the grave immortal, “the firstfruits of them that slept” ([[1 Cor. 15:20]]).
    sources: [talmage-jesus-christ-20]
  - ref: 27
    phrase: Thou Son of David, have mercy on us
    kind: christ
    title: '“Thou Son of David”'
    body: |
      “Son of David” was a title for the Messiah, and Matthew uses it more than any other Gospel writer. The Lord had promised David that a descendant of his would always reign ([[2 Sam. 7:12–16]]). After David’s line lost the throne, prophecies and hopes of a restored Davidic kingdom grew into the expectation of an anointed king, “the Messiah.” Matthew calls Jesus the son of David in his first verse and uses the title nine times in all (here, and at [[Matt. 12:23]], [[Matt. 15:22]], [[Matt. 20:30–31]], [[Matt. 22:42]] and twice at the triumphal entry); Mark and Luke have it three times each, and John not at all.

      These two blind men are the first in Matthew’s story to address Jesus by the royal title, and He does not refuse it; no record has Him disclaiming it. He asks only whether they believe He can do this, and heals them “according to your faith.”
    sources: [griffin-matthew-portrayal, talmage-jesus-christ-20, lds-scriptures]
  - ref: 30
    phrase: See that no man know it
    kind: history
    title: Why tell no one?
    body: |
      Jesus sternly told the healed men to let no one know of the miracle. The word Matthew uses for “straitly charged” is one of the strongest in the New Testament, at root the hard breathing of strong feeling, so the command was stern. Matthew does not say why, and the reason can only be inferred. One suggestion is that it was better for the men themselves to praise God by their lives rather than with their lips. Another is that Jesus shrank from crowds gathered to watch wonders and ready to make the wonder-worker a king, and later in the Gospel Matthew presents that reticence as typical of His ministry ([[Matt. 12:16–21]]). He gave the same charge to the leper healed in [[Matt. 8:4]], in keeping with His general avoidance of unwanted fame. The blind men did not obey, and His fame spread all the same.
    sources: [ellicott-matthew, talmage-jesus-christ-14]
  - ref: 35
    phrase: healing every sickness and every disease among the people
    kind: structure
    title: The unit closes, and the answer to John
    body: |
      This verse repeats [[Matt. 4:23]] almost word for word and closes the unit of sermon and miracles that verse opened; the note there explains the frame. The miracles inside the frame are also chosen. When the imprisoned John later sends to ask whether Jesus is “he that should come,” Jesus answers: “The blind receive their sight, and the lame walk, the lepers are cleansed, and the deaf hear, the dead are raised up, and the poor have the gospel preached to them” ([[Matt. 11:3–5]]). Every item on that list has already happened in Matthew. The poor heard the gospel in the Sermon’s first beatitude, and chapters 8 and 9 hold at least one example of each healing. Only “the deaf hear” seems missing, but that is a difficulty of the English, not the Greek: the word for “deaf” in 11:5, *kōphos*, is the same word Matthew uses for the “dumb” man of verses 32–33, so his healing is the example. Matthew has arranged chapters 5 to 9 as evidence that Jesus was the one who was to come.
    sources: [strathearn-matthew-editor]
  - ref: 36
    phrase: as sheep having no shepherd
    kind: symbol
    title: Sheep having no shepherd
    body: |
      The phrase comes from the Old Testament, where it describes a people with no true leader. Moses, near the end of his life, asked the Lord to set a man over the congregation “that the congregation of the Lord be not as sheep which have no shepherd,” and the Lord gave them Joshua ([[Num. 27:16–17]]). In Ezekiel the Lord condemns the shepherds of Israel who fed themselves while His sheep “were scattered, because there is no shepherd,” and promises to seek the flock Himself and set over them “one shepherd … even my servant David” ([[Ezek. 34:5]]; [[Ezek. 34:23]]). Latter-day Saints, with most Christians, read that promised Davidic shepherd as Jesus, who will gather the flock of covenant Israel. The site’s note at Ezekiel 34:23 explains the prophecy. Jesus’s hearers would have recognized where His image came from.

      “They fainted” is the reading of the Greek text the King James translators had. The far better-attested reading is a stronger word, “harassed” (the footnote’s gloss), a word meaning literally flayed, and so tormented or vexed. The crowds were not just tired sheep but sheep harassed by the wolf.
    sources: [pike-shepherd, ellicott-matthew]
  - ref: 38
    phrase: Pray ye therefore the Lord of the harvest
    kind: christ
    title: Pray the Lord of the harvest
    body: |
      Jesus does not only feel compassion for the crowds; He asks His disciples to share it and to join Him in prayer. The “Lord of the harvest” is best read as the Father, who sent Jesus to sow and who was about to send out labourers through Him. The prayer also concerned the disciples themselves: they were the agents to meet the need, if they would pray to be made fit for it. In the next verses Jesus calls the Twelve and sends them out ([[Matt. 10:1–5]]). He had used the image once before, in Samaria, when He told His disciples the fields were already white for harvest ([[John 4:35–36]]).
    sources: [ellicott-matthew]

christ: |
  Matthew 9 shows Jesus Christ as the Son of man with power on earth to forgive sins, who proves an unseen forgiveness by a healing anyone could see. He is the Physician who eats with the sick, the Bridegroom who would be taken away, the Son of David who opens blind eyes, and the Shepherd moved with compassion for scattered sheep. That authority to forgive still reaches disciples now: “I, the Lord, forgive sins unto those who confess their sins before me and ask forgiveness” ([[D&C 64:7]]).

explore: |
  - **The other tellings.** [[Mark 2:1–22]] and [[Luke 5:17–39]] for the paralyzed man, Levi and the fasting question; [[Mark 5:21–43]] and [[Luke 8:40–56]] for Jairus and the woman, told at greater length.
  - **The shepherd.** [[Ezek. 34]] whole, and Jesus as the Good Shepherd in [[John 10:11–16]].

