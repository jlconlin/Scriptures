chapter: 26
title: Not as I Will
tagline: The council plots and Judas sells his Master; a woman anoints Jesus for burial; at the Passover table He gives the bread and cup of a new covenant; in Gethsemane He submits to the Father’s will; He is arrested, condemned by night, and denied by Peter.
when: 'The Wednesday and Thursday of the last week, by traditional reckoning; the supper on Thursday evening, which by Jewish reckoning began Friday'

setting: |
  Matthew 26 opens the last division of the Gospel. Its first words, “when Jesus had finished all these sayings,” close the fifth of the long discourses that end each section of Matthew ([[Matt. 7:28]]; [[Matt. 11:1]]; [[Matt. 13:53]]; [[Matt. 19:1]]), here the prophecy on the Mount of Olives (chapters 24–25).

  The chapter covers about a day and a night. Tradition sets the plot, the anointing at Bethany and Judas’s bargain (verses 1–16) on the Wednesday of the last week. The supper came on Thursday evening, which by the Jewish calendar was already the beginning of Friday, so the meal, the agony in the garden, the arrest and the night hearing all fall on the day of the crucifixion. Whether that supper was itself the Passover is a real question, taken up at verse 17.

  Mark tells the same events in the same order ([[Mark 14]]), and Matthew follows him closely; Luke shortens some scenes and John tells the night differently ([[John 13–18]]). What Matthew alone adds is noted where it matters: the thirty pieces of silver, “for the remission of sins,” the twelve legions, Peter’s oath.

thread: |
  **Jesus is handed over by everyone around Him, and He goes willingly.**

  The chapter is a sequence of people who fail Him in one night: a council that plots, a disciple who sells Him, three friends who sleep, eleven who flee, a high priest who condemns Him, and the chief apostle who swears he never knew Him. Against them stands one unnamed woman who, unlike Peter and the rest of the Twelve, seems to understand that He has come to Jerusalem to die, and anoints Him for it.

  Through all of it Jesus is the one who knows. He announces the betrayal before it happens (verses 2, 21, 25), names the scattering and the denial before they come (verses 31, 34), gives the bread and cup of His death before He dies, and in the garden chooses the Father’s will three times. When the arrest comes He refuses the sword and the angels, because He is submitting of His own will to what the scriptures foretold (verses 53–56). The men who hand Him over think they are deciding His end; Matthew shows Him walking into it.

sections:
  - range: 1-5
    heading: The council plots His death
    plain: |
      When Jesus had finished these teachings He told His disciples that the Passover was two days off and that the Son of Man would be handed over to be crucified. Meanwhile the chief priests, the scribes and the elders met at the residence of the high priest Caiaphas and plotted how to seize Jesus by cunning and put Him to death. “Not during the festival,” they said, “or the people may riot.”
  - range: 6-13
    heading: The anointing at Bethany
    plain: |
      At Bethany, while Jesus was at dinner in the house of Simon the leper, a woman came with an alabaster jar of costly ointment and poured it over His head. The disciples were indignant: why waste it, when it could have been sold for a large sum and the money given to the poor? Jesus knew what they were saying. “Why are you troubling her? She has done a good work for me. The poor you will always have; me you will not always have. In pouring this ointment on my body she has prepared me for burial. Wherever this gospel is preached in all the world, what she has done will be told in memory of her.”
  - range: 14-16
    heading: Judas’s bargain
    plain: |
      Then Judas Iscariot, one of the Twelve, went to the chief priests and asked what they would give him to hand Jesus over. They agreed on thirty pieces of silver, and from then on he watched for a chance to deliver Him.
  - range: 17-25
    heading: The Passover prepared and the betrayer named
    plain: |
      On the first day of Unleavened Bread the disciples asked where He wanted them to make ready the Passover. He sent them into the city to a certain man with the message that the Teacher’s time was near and that He would keep the Passover at that man’s house with His disciples. They did as He directed. At evening He reclined at table with the Twelve, and during the meal He told them that one of them would hand Him over. Grieved, each began to ask, “Surely it is not I, Lord?” He answered that it was one who dipped his hand into the dish with Him. The Son of Man would go the way the scriptures had written of Him, but it would have been better for the man who handed Him over never to have been born. Judas too asked, “Rabbi, is it I?” and Jesus answered, “You have said it.”
  - range: 26-29
    heading: The bread and the cup
    plain: |
      During the meal Jesus took bread, blessed it, broke it and gave it to the disciples: “Take and eat; this is my body.” Then He took a cup, gave thanks and passed it to them: “All of you drink from it, for this is my blood of the covenant, poured out for many for the forgiveness of sins. I will not drink this fruit of the vine again until the day I drink it new with you in my Father’s kingdom.”
  - range: 30-35
    heading: Peter’s denial foretold
    plain: |
      After singing a hymn they went out to the Mount of Olives. There Jesus told them that this very night every one of them would stumble and fall away because of Him, as Zechariah had written: strike the shepherd and the flock will scatter. But after He was raised He would go ahead of them into Galilee. Peter protested that even if everyone else fell away, he never would. Jesus told him that before the rooster crowed that night he would deny Him three times. Peter insisted that he would die with Him sooner than deny Him, and the others all said the same.
  - range: 36-46
    heading: Gethsemane
    plain: |
      Jesus came with them to a place called Gethsemane and told the disciples to sit while He went farther to pray. He took Peter and the two sons of Zebedee with Him and began to be distressed and troubled. “My soul is grieved to the point of death,” He told them. “Stay here and keep awake with me.” Going a little farther, He fell on His face and prayed: “My Father, if it is possible, let this cup pass from me; yet not what I will, but what you will.” Returning, He found them asleep and said to Peter, “Could you not stay awake with me for one hour? Keep awake and pray that you do not come into trial. The spirit is willing, but the flesh is weak.” A second time He went and prayed, “My Father, if this cannot pass unless I drink it, your will be done.” Again He found them sleeping, their eyes heavy, and He left them and prayed a third time in the same words. Then He came back: “Sleep on now and rest. The hour has come, and the Son of Man is handed over to sinners. Get up, let us go; the one who hands me over is here.”
  - range: 47-56
    heading: The arrest
    plain: |
      While He was still speaking, Judas came with a large crowd armed with swords and clubs, sent by the chief priests and elders. He had given them a signal: the one he kissed was the man to seize. He went straight to Jesus, greeted Him as Rabbi, and kissed Him. Jesus said, “Friend, why have you come?” They seized Him. One of those with Jesus drew a sword and cut off the ear of the high priest’s servant. Jesus told him to put the sword away, since those who take up the sword die by it. Did he not know that Jesus could ask His Father and at once have more than twelve legions of angels? But then how would the scriptures be fulfilled that say it must happen this way? To the crowd He said, “Have you come out with swords and clubs to take me as you would a thief? Day after day I sat teaching in the temple, and you did not arrest me.” All this happened so that the writings of the prophets would be fulfilled. Then all the disciples left Him and ran.
  - range: 57-68
    heading: Before Caiaphas
    plain: |
      They took Jesus to Caiaphas the high priest, where the scribes and elders had gathered. Peter followed at a distance into the high priest’s courtyard and sat with the attendants to see how it would end. The chief priests and the whole council looked for false testimony to put Him to death and found none that would serve, though many false witnesses came forward. At last two said that He had claimed He could destroy God’s temple and build it in three days. The high priest stood and demanded an answer, but Jesus was silent. Then the high priest said, “I put you under oath by the living God: tell us whether you are the Christ, the Son of God.” Jesus said, “You have said it. And I tell you, from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.” The high priest tore his clothes: “He has blasphemed! Why do we need more witnesses? You have heard it. What is your verdict?” They answered, “He deserves death.” Then they spat in His face and struck Him, and some slapped Him, taunting, “Prophesy to us, you Christ! Who hit you?”
  - range: 69-75
    heading: Peter’s denials
    plain: |
      Peter was sitting outside in the courtyard when a servant girl came up and said, “You were with Jesus the Galilean too.” He denied it in front of them all: “I don’t know what you are talking about.” When he went out to the gateway another girl saw him and told the bystanders, “This man was with Jesus of Nazareth.” Again he denied it, with an oath: “I do not know the man.” A little later the bystanders came up to Peter: “You certainly are one of them; your accent gives you away.” Then he began to curse and to swear, “I do not know the man.” At that moment a rooster crowed, and Peter remembered Jesus’s words, “Before the rooster crows, you will deny me three times.” He went outside and wept bitterly.

notes:
  - ref: 2
    phrase: the Son of man is betrayed to be crucified
    kind: words
    title: Betrayed, or handed over
    body: |
      The word behind “betrayed” is less specific than the English, and the difference opens the chapter up. All four Gospels use *paradidōmi*, “hand over” or “deliver,” for what Judas does, not *prodidōmi*, the ordinary word for betraying. Judas’s act is real treachery, as the context makes plain, but in the Greek it is the first of a series of handings over: Judas delivers Jesus to the Jewish authorities, they deliver Him to Pilate, and Pilate in turn delivers Him to be crucified ([[Matt. 27:26]]). The King James Version hides the series by rendering the one verb “betray” here and in verses 16, 21 and 45, but “deliver” in verse 15 and in [[Matt. 27:2]] and [[Matt. 27:26]].

      The same verb carries a deeper sense. The Septuagint, the Greek Old Testament, uses it in [[Isa. 53:6]], “the Lord hath laid on him the iniquity of us all,” and Paul uses it of the Father, who “spared not his own Son, but delivered him up for us all” ([[Rom. 8:32]]). Read beside those passages, the handings over in this chapter are more than treachery: each was a necessary step in His delivering us.
    sources: [huntsman-wednesday, thayer]
  - ref: 5
    phrase: Not on the feast day, lest there be an uproar among the people
    kind: history
    title: Not on the feast day
    body: |
      The council feared the crowds, and that fear shapes the whole night. The chief priests, the leading scribes and the elders together made up the Sanhedrin, which under Roman rule was responsible for keeping order in Jerusalem; in Matthew, Mark and Luke it was Jesus’s cleansing of the temple that seems to have turned them decisively against Him ([[Matt. 21:12–15]]). At Passover the city was crowded with pilgrims, and the rulers were especially wary of the Galileans, many of whom were in Jerusalem and were proud of Jesus as one of their own.

      “Not on the feast day” means not in the middle of the festivities, or at least not in front of the festal crowds. That is why the arrest came at night in Gethsemane rather than by day in the temple, where Jesus had been teaching openly (verse 55). It also explains what Judas offered them. In Matthew and Mark his part is chiefly to show the authorities where and how to take Jesus quietly, away from the people.
    sources: [huntsman-wednesday, talmage-jesus-christ-33, huntsman-thursday]
  - ref: 7
    phrase: an alabaster box of very precious ointment, and poured it on his head
    kind: symbol
    title: Anointed for His burial
    body: |
      Pouring oil on a man’s head was what Israel did to make a king, and Jesus says this woman has done it to prepare Him for His grave. In the Hebrew Bible kings were anointed, and so were priests and now and then a prophet. Her act can be seen as joining a royal anointing to a royal burial, and Jesus’s words in verse 12 (in the Greek, “to prepare me for my burial”) speak only of the burial. She seems to have grasped what the Twelve had not: that He had come to Jerusalem not to be crowned but to die. Peter, who knew by revelation that Jesus was the Christ, had rebuked Him for speaking of His death ([[Matt. 16:21–23]]); this woman acts on it.

      The disciples’ complaint is about money, and the sum was large: the ointment was worth roughly a laborer’s wages for a year. Jesus does not dismiss the poor; He says that the time for this gift is now, because He will not be with them long. Verse 13 promises that her deed will be told wherever the gospel is preached, yet Matthew and Mark never give her name. Leaving her unnamed makes it easier for her to stand as a type of the ideal believer, one who understands what the Messiah came to do.

      John tells of an anointing at Bethany in which Mary, the sister of Lazarus, anoints Jesus’s feet before the triumphal entry ([[John 12:1–8]]). The differences of name, of head and feet, and of time make it possible that there were two anointings. Matthew’s host, “Simon the leper,” cannot have had the disease still, since it would have made him unclean and unable to host the meal; he had presumably been cured, perhaps by Jesus.
    sources: [huntsman-wednesday, lds-scriptures]
  - ref: 15
    phrase: they covenanted with him for thirty pieces of silver
    kind: scripture
    title: Thirty pieces of silver
    body: |
      Only Matthew names the price, and the sum already had a meaning in scripture. Thirty shekels of silver was what the law of Moses set as compensation for a slave gored by an ox ([[Ex. 21:32]]), so the chief priests valued Jesus at the price of a slave. It is also the wage the shepherd of [[Zech. 11:12–13]] is paid and throws down to the potter in the house of the Lord, and Matthew will come back to the coins when Judas returns them and the priests buy the potter’s field, citing it as a prophecy fulfilled ([[Matt. 27:3–10]]; see the note at [[Matt. 27:9]] on Jeremiah and Zechariah).

      Why Judas did it the Gospels do not agree. Mark says only that the priests promised him money ([[Mark 14:11]]); Matthew has Judas ask what they will give him; Luke and John say that Satan had entered into him ([[Luke 22:3]]; [[John 13:2]], [[John 13:27]]). Talmage judged the money probably only a secondary element in his treachery, and put the cause deeper: before Judas sold Christ, he had sold himself to the devil.
    sources: [huntsman-wednesday, talmage-jesus-christ-33, lds-scriptures]
  - ref: 17
    phrase: 'Where wilt thou that we prepare for thee to eat the passover?'
    kind: history
    title: Was the Last Supper a Passover meal?
    body: |
      Matthew, Mark and Luke present the supper as the Passover, and John places the Passover a day later, so the Gospels give two timings of the same night. The Passover lamb was slaughtered at the temple on the afternoon of Nisan 14, and the feast itself began at sunset, when the meal was eaten. In Matthew the disciples prepare the Passover on “the first day of the feast of unleavened bread,” and Jesus eats it with them that evening (verses 17–20). John says instead that the Jewish leaders had not yet eaten the Passover the next morning ([[John 18:28]]) and that the day of the crucifixion was “the preparation of the passover” ([[John 19:14]]); in his timing the lambs were being slain at the temple in the very hours when Jesus hung on the cross.

      The Church’s edition reads the meal as Matthew does: its chapter heading says that Jesus “keeps the Passover and institutes the sacrament,” Elder Holland speaks of “a final and specially prepared Passover supper,” and in Talmage’s judgment Jesus “appears to have observed the essentials of the Passover procedure” at it. How John’s timing fits with Matthew’s has never been settled. One explanation is that John has the calendar right and that Jesus, knowing He would be dead and buried when the feast came, kept the Passover, or a meal like it, a day early. Each telling carries its own meaning: Matthew’s shows the Lord’s Supper taking up the Passover and founding a new covenant that fulfills it, while John’s shows Christ as the Lamb of God. For Matthew’s reader, the bread and the cup of verses 26–28 are given at the table where Israel remembered its deliverance from Egypt.
    sources: [huntsman-thursday, holland-remembrance, talmage-jesus-christ-33, lds-scriptures]
  - ref: 22
    phrase: 'Lord, is it I?'
    kind: history
    title: Lord, is it I?
    body: |
      The question seems to show the Eleven looking first at themselves. None of them asks who the traitor is or points at a neighbor; each, it appears, dreads that he might somehow be the one, even without meaning to be.

      Judas asks the same question, perhaps because silence would have drawn suspicion, and he uses the customary title of honor, “Rabbi” (the King James Version’s “Master” in verse 25), where the others had said “Lord.” Jesus answers him as He will answer the high priest, “Thou hast said” (see the note on verse 64), but John’s account suggests that not everyone at the table heard it; some of the others thought Judas was being sent out on an errand for the feast or to give to the poor ([[John 13:27–30]]).

      Verse 24 holds two things together. The Son of Man goes “as it is written of him”: His death was foreseen and appointed. Yet woe falls on the man who hands Him over. That the Christ was appointed to suffer did not make the men who brought it about any less free, or their treachery any less guilty.
    sources: [talmage-jesus-christ-33, ellicott-matthew]
  - ref: 26
    phrase: Take, eat; this is my body
    kind: christ
    title: In remembrance of my body
    body: |
      The Joseph Smith Translation, printed in the footnote, makes the bread a remembrance of “my body which I give a ransom for you” (JST Matt. 26:22), broken before it is blessed. A few verses on it adds a charge the King James text lacks: “I give unto you a commandment, that ye shall observe to do the things which ye have seen me do, and bear record of me even unto the end” (JST Matt. 26:25).

      What the disciples took into their hands that night was a sign of what was about to happen. Centuries of sacrifices had pointed forward to the Lamb of God, and in the upper room, on the eve of Gethsemane and Golgotha, the type and shadow was about to become reality. The bread is still broken and offered first, and it still brings to mind His bruised body and broken heart and His physical suffering on the cross.
    sources: [jst-matt-26, holland-remembrance]
  - ref: 28
    phrase: this is my blood of the new testament, which is shed for many for the remission of sins
    kind: words
    title: The blood of the covenant
    body: |
      “Testament” here means covenant, and the words point back to Sinai. The Greek *diathēkē* was, in ordinary Greek, a last will and testament, which is why the King James Version reads “testament”; but in the Septuagint it was the word for the Hebrew *bərît*, the binding covenant between God and His people. When Moses sealed Israel’s covenant at Sinai he sprinkled the people with the blood of the sacrifices and said, “Behold the blood of the covenant” ([[Ex. 24:8]]). Jesus takes up the same words over the cup and makes His own blood the blood of the covenant. The King James text, following the Textus Receptus, calls it the “new” covenant, which recalls Jeremiah’s promise of a new covenant, written in the heart, to replace the one Israel had broken ([[Jer. 31:31–33]]); the earliest manuscripts of Matthew and Mark read simply “my blood of the covenant.”

      Matthew alone adds “for the remission of sins,” saying outright what the shedding of the blood is for. The Joseph Smith Translation says for whom: the blood “is shed for as many as shall believe on my name, for the remission of their sins” (JST Matt. 26:24). In the King James wording the blood is shed “for many”; in the translation the many are those who believe. The remission He provides comes, in Latter-day Saint teaching, “upon conditions of obedience to the principles and ordinances of the gospel He taught.”
    sources: [huntsman-thursday, jst-matt-26, holland-remembrance, lds-scriptures]
  - ref: 29
    phrase: until that day when I drink it new with you in my Father’s kingdom
    kind: scripture
    title: Drinking it new
    body: |
      Jesus looks past His death to a meal still to come. The saying alludes to the feast of the Messiah at the end of time, the banquet that stands in scripture for eternal fellowship with God. The Joseph Smith Translation makes it a promised coming, reading “shall come and drink it” where the King James text has “drink it,” and the footnote to the verse sends the reader to [[D&C 27:5–14]]. There the Lord tells Joseph Smith that the hour is coming when He will “drink of the fruit of the vine” on the earth with prophets of every dispensation, “and also with Peter, and James, and John,” three of the apostles who sat at this table, by whom, the Lord says, Joseph Smith had been ordained an apostle ([[D&C 27:12]]).
    sources: [huntsman-thursday, lds-scriptures]
  - ref: 30
    phrase: when they had sung an hymn
    kind: history
    title: The hymn
    body: |
      The hymn was most likely from the Hallel, Psalms 113–118, the psalms of praise for Israel’s deliverance from Egypt that belonged to the Passover. Psalms 113 and 114 were usually sung before the meal and 115–118 after it, so the song that closed the supper was probably the second part (see the note at [[Ps. 113:1]]).
    sources: [huntsman-thursday]
  - ref: 31
    phrase: I will smite the shepherd, and the sheep of the flock shall be scattered abroad
    kind: scripture
    title: The shepherd struck, the sheep scattered
    body: |
      Jesus quotes [[Zech. 13:7]], where the Lord calls for the sword to strike the shepherd who is His own “fellow” and the flock to scatter (the notes there explain the prophecy), and He applies it to that very night. “Offended” is a stronger word than it sounds in English: the Greek means to be caused to stumble, and it can mean to fall away or give up believing. Jesus tells the Eleven that all of them will stumble because of Him, and the prophecy is fulfilled within hours, when the shepherd is seized and “all the disciples forsook him, and fled” (verse 56).

      The warning comes with a promise. Before any of them has failed, Jesus tells them where He will meet them after He is raised: “I will go before you into Galilee” (verse 32). The angel at the tomb repeats it, and the risen Lord keeps it on a mountain in Galilee ([[Matt. 28:7]], [[Matt. 28:16]]). The scattering was foreseen, and so was the gathering again.
    sources: [huntsman-thursday, huntsman-peters-denial, lds-scriptures]
  - ref: 34
    phrase: thou shalt deny me thrice
    kind: words
    title: A prophecy, not a command
    body: |
      Jesus is foretelling what Peter will do, not telling him to do it. The question arises because English “thou shalt” can be a command, as in the Ten Commandments, and the Greek future can sometimes be used that way too. Some Latter-day Saints have suggested that Jesus was directing Peter to deny Him, so that the chief apostle could escape arrest and survive to lead the Church. The idea has been attributed by word of mouth to President Spencer W. Kimball’s 1971 address on Peter, but nothing in the printed talk or its audio recording supports it.

      The Greek gives the idea little support. The natural sense of the future here is a prediction. A future used as a command is rare in the New Testament, and where it does appear it usually quotes or imitates the legal language of the Old Testament, which this saying does not. Luke and John report the same saying in constructions that cannot be read as commands at all ([[Luke 22:34]]; [[John 13:38]]). Even so, the grammar alone cannot settle it, since Jesus would presumably have spoken to Peter in Aramaic, not Greek. What settles it is the context, which is prophecy. Jesus has just said that all of them will stumble, a saying tied to Zechariah’s prophecy and so almost certainly a prediction (verse 31); the saying about Peter that follows it is a prediction too.

      Matthew sets Peter’s confidence squarely against that prediction. Smoothing Mark’s wording, he stresses Peter’s certainty: though all the others fall away, “yet will I never” (verse 33), and though he must die with Jesus, he will not deny Him (verse 35). Before morning it is the prediction, not the protest, that comes true (verses 69–75).
    sources: [huntsman-peters-denial, huntsman-thursday]
  - ref: 36
    phrase: a place called Gethsemane
    kind: words
    title: The oil press
    body: |
      Gethsemane means “oil press,” from the Aramaic *gat shemani*, and the name probably came from a press kept there for the olives grown on the slope. Only Matthew and Mark give the name; John calls the place a garden ([[John 18:1]]), and Luke says only that Jesus went to the Mount of Olives ([[Luke 22:39]]).

      Latter-day Saint writers have seen in the name what happened there. In an olive press the fruit is crushed under a heavy weight until the oil runs out; in Gethsemane the weight of sins, sorrows and infirmities bore down on Jesus until, as Restoration scripture testifies, blood came from every pore ([[Mosiah 3:7]]; [[D&C 19:18]]). That is a devotional reading of the name, not something Matthew says, but the scriptures it rests on are plain.

      Jesus left eight of the apostles near the entrance (“Sit ye here”) and took the three who had been with Him on the mount of transfiguration a little farther in (verse 37; [[Matt. 17:1]]).
    sources: [talmage-jesus-christ-33, huntsman-thursday, lds-scriptures]
  - ref: 39
    phrase: 'let this cup pass from me: nevertheless not as I will, but as thou wilt'
    kind: christ
    title: The cup
    body: |
      The cup Jesus asked to be spared was the suffering for the sins of the world, and Restoration scripture says so in His own voice. Speaking to Joseph Smith, the risen Lord described that suffering as what caused Him, “even God, the greatest of all, to tremble because of pain, and to bleed at every pore, and to suffer both body and spirit,” and added, “would that I might not drink the bitter cup, and shrink” ([[D&C 19:18]]). King Benjamin had foretold the same: “blood cometh from every pore, so great shall be his anguish for the wickedness and the abominations of his people” ([[Mosiah 3:7]]). The footnote to “cup” in this verse sends the reader to both.

      Matthew gives the prayer and little else, but these passages are why Latter-day Saints understand that the atoning suffering for sin began in the garden and not only on the cross. Jesus did not shrink from death through fear; what fell on Him was a spiritual agony of soul such as only God could experience, as in some manner, real though beyond human understanding, He took on Himself the burden of the sins of mankind from Adam to the end of the world. Church leaders have also regularly taught that Gethsemane and Golgotha belong together: the One who bore the weight of sin in the garden was then led, as a sacrifice is led to the altar, to the cross, where He suffered and died.

      Each time He prayed, the request was conditional. “If it be possible” (verse 39) becomes “if this cup may not pass away from me, except I drink it, thy will be done” (verse 42). The Son’s first desire was always that the Father’s will be done.
    sources: [lds-scriptures, huntsman-thursday, talmage-jesus-christ-33]
  - ref: 41
    phrase: Watch and pray, that ye enter not into temptation
    kind: words
    title: Watch and pray
    body: |
      “Watch” means stay awake, and the plain command is the first point: Jesus asked His three closest friends to keep awake with Him, and they could not, as they had slept on the mount of transfiguration when He was in glory ([[Luke 9:32]]). His question to Peter in verse 40 carries in the Greek the sense, are you so powerless that you could not stay awake with me one hour?

      The warning reaches further than sleep. “Temptation” translates *peirasmos*, which means any kind of test or trial, tribulation as well as temptation to sin. The trial in view may well have been the coming arrest, when, left to themselves, the disciples would be tempted to desert their Lord, as they did (verse 56).
    sources: [lds-scriptures, talmage-jesus-christ-33, huntsman-thursday]
  - ref: 50
    phrase: 'Friend, wherefore art thou come?'
    kind: words
    title: Friend
    body: |
      Jesus greets the man who has just kissed Him with a word of kindness. “Friend” is the Greek *hetaire*, comrade or companion, used in kindly address and glossed “my good friend.” Matthew uses it the same way in two of his parables ([[Matt. 20:13]]; [[Matt. 22:12]]). Judas greets Him again as “Rabbi” (the King James Version’s “master,” verse 49), and seals the sign with a kiss, the token of respect and devotion a disciple gave his master turned into the signal for an arrest.

      The King James question, “wherefore art thou come?”, can also be read as a direction: “Friend, do that for which thou art come.” Read that way, it repeats what Jesus had said to Judas at the supper, “That thou doest, do quickly” ([[John 13:27]]). Either way Jesus is not taken by surprise. He knew who was coming (verse 46), and He lets Judas finish what he began.
    sources: [thayer, strongs-greek, huntsman-thursday, talmage-jesus-christ-33]
  - ref: 53
    phrase: more than twelve legions of angels
    kind: christ
    title: Twelve legions
    body: |
      Jesus tells the disciple with the sword that He could have had an army, and that He is choosing not to. He names the legions to show that He is submitting of His own will, in accordance with what was foreseen and foretold: “how then shall the scriptures be fulfilled, that thus it must be?” (verse 54). Neither the legions nor the warning that “all they that take the sword shall perish with the sword” (verse 52) is in Mark’s, Luke’s or John’s telling of the arrest ([[Mark 14:47–49]]; [[Luke 22:49–51]]; [[John 18:10–11]]).

      John names the swordsman as Peter and the servant as Malchus ([[John 18:10]]), and only Luke, whose portrait of Jesus is everywhere compassionate, adds that Jesus touched the ear and healed it ([[Luke 22:51]]).
    sources: [talmage-jesus-christ-33, huntsman-thursday]
  - ref: 59
    phrase: sought false witness against Jesus, to put him to death
    kind: history
    title: A hearing by night
    body: |
      What happened at Caiaphas’s house appears to have been a preliminary hearing or arraignment, not a full trial. Late nineteenth-century lives of Christ often listed the night arrest and the night proceedings among the “illegalities” of a Jewish trial, but they judged the Gospels by the rules of the Mishnah, a collection of Jewish legal tradition written down about AD 200, long after Jesus’s day, so they cannot show what the law required in His time. The Gospels themselves give only an outline, in which the leaders tried to settle how to deal with Jesus the next day. Matthew’s next verse fits that: “when the morning was come,” the chief priests and elders took counsel and led Him to Pilate ([[Matt. 27:1–2]]).

      Matthew does not hide what the council wanted. They “sought false witness … to put him to death” (the Greek, so that they might put Him to death); the verdict came before the evidence. Even so they could not find two witnesses who agreed, as the law of Moses required before anyone could be condemned ([[Deut. 19:15]]; the footnote points there). The two who finally came forward spoke of destroying the temple and building it in three days, and Mark adds that even their witness did not agree ([[Mark 14:59]]). Only Jesus’s own words would give them their case (verse 64).
    sources: [huntsman-thursday, lds-scriptures]
  - ref: 64
    phrase: Thou hast said
    kind: christ
    title: Thou hast said
    body: |
      “Thou hast said” is a yes. Caiaphas had put Him under oath by the living God (the footnote to “adjure” gives the sense, “cause you to swear”). Jesus’s reply means, I am what you have said; Mark gives it simply as “I am” ([[Mark 14:62]]). It was an unqualified avowal that He was the Son of God, made at the moment when a denial might have saved His life.

      He then goes further than the question. The Son of Man “sitting on the right hand of power” takes up the Lord’s words to David’s Lord, “Sit thou at my right hand” ([[Ps. 110:1]]). “Coming in the clouds of heaven” takes up [[Dan. 7:13–14]], where one like the Son of Man comes with the clouds and receives an everlasting kingdom.

      To the high priest this was blasphemy, a religious crime that carried the penalty of death, and the council agreed (verses 65–66).
    sources: [lds-scriptures, talmage-jesus-christ-34, huntsman-thursday, ellicott-matthew]
  - ref: 72
    phrase: again he denied with an oath, I do not know the man
    kind: words
    title: Each denial worse than the last
    body: |
      In Matthew each of Peter’s denials is more serious than the one before. The first, to a servant girl, is an evasion: “I know not what thou sayest.” The second, made at the porch to the bystanders, comes “with an oath,” Matthew’s own addition to the story, and now Peter says outright, “I do not know the man.” The third comes when the bystanders say that his Galilean speech gives him away, marking him as at least a countryman of the prisoner; Peter then begins “to curse and to swear,” words that may imply a formal renunciation of any tie to Jesus.

      What Peter denied matters. He never denied that Jesus was the Christ, the testimony he had received by revelation ([[Matt. 16:16–17]]); he denied that he knew Him or was one of His followers, and what moved him to it that night cannot be known for sure. The distinction does not make the denial light. The verb *arneomai* still means to repudiate or disown.
    sources: [huntsman-peters-denial, talmage-jesus-christ-34, kimball-peter-my-brother, lds-scriptures]
  - ref: 75
    phrase: he went out, and wept bitterly
    kind: prophets
    title: He went out, and wept bitterly
    body: |
      Peter’s tears were the beginning of his repentance, and his later life shows that they were real. Matthew ends the scene there, but the Gospels do not leave Peter there. The risen Lord asked him three times, “Lovest thou me?”, letting him profess his love once for each denial ([[John 21:15–17]]), and soon after, Christ raised him to lead His Church and gave him the keys of the kingdom.

      President Spencer W. Kimball pleaded for Peter to be given the benefit of the doubt and forgiven as fully as the Savior seems to have forgiven him, and asked the question the rest of Peter’s life answers: “Has any man ever more completely triumphed over his weaknesses?”
    sources: [talmage-jesus-christ-34, huntsman-peters-denial, kimball-peter-my-brother, lds-scriptures]

christ: |
  Matthew 26 shows Jesus Christ handed over by His enemies, sold by one friend, left by the rest and denied by the chief of them, and going to it all of His own will. He could have called on legions; He chose the cup the Father gave Him, submitting so that the scriptures would be fulfilled. In one night He met disloyalty, false judgment, arrest and rejection, as well as the weight of sin in the garden, and so He knows how to succor those who are betrayed, abandoned or falsely judged ([[Alma 7:11–12]]).

  Since that upper room, on the eve of Gethsemane and Golgotha, His disciples have been under covenant to remember His sacrifice, and they renew it in the sacrament, promising to “always remember him” ([[Moro. 4:3]]). Peter’s night shows that the covenant is made and kept by people who fail: the apostle who denied his Lord with an oath wept, repented, and was raised to lead the Church, and of the Church’s members the Book of Mormon says, “as oft as they repented and sought forgiveness, with real intent, they were forgiven” ([[Moro. 6:8]]).

explore: |
  - **The other tellings.** [[Mark 14]]; [[Luke 22]]; [[John 12:1–8]] and [[John 13–18]], where John gives the washing of feet and the Lord’s long discourse and prayer at the supper.
  - **The cup in Restoration scripture.** [[Mosiah 3:7]]; [[Alma 7:11–13]]; [[D&C 19:15–20]].
  - **The sacrament.** [[3 Ne. 18:1–11]], where the risen Lord gives it to the Nephites; [[Moro. 4–5]]; [[D&C 20:75–79]]; [[D&C 27:5–14]].
  - **The covenant in blood.** [[Ex. 24:3–8]] and [[Jer. 31:31–34]].
  - President Spencer W. Kimball’s address “Peter, My Brother” (1971), reprinted in *The Ministry of Peter, the Chief Apostle*, weighs why Peter denied his Lord and how completely he repented.

