chapter: 13
title: The Parables of the Kingdom
tagline: From a boat by the shore Jesus teaches in parables for the first time, explains to His disciples why, and lays out the kingdom in seven stories, from the sower to the net; then His own town of Nazareth takes offense at Him.
when: 'In Galilee, on the same day as the accusations and the demand for a sign in Matthew 12'

setting: |
  Matthew 13 is the third of Matthew’s long discourses (see the setting of [[Matt. 5]]): after the Sermon on the Mount and the charge to the Twelve comes this Sermon in Parables, closed like the others with “when Jesus had finished these parables” (verse 53).

  Matthew ties it to what came before. “The same day” (verse 1) is the day of [[Matt. 12]], when the Pharisees accused Jesus of casting out devils by Beelzebub and the scribes demanded a sign. Jesus goes out of the house to the lake, and, as He often did, teaches the crowd from a boat a little way off the shore.

  Mark and Luke tell the parable of the sower too ([[Mark 4:1–25]]; [[Luke 8:4–18]]), and Mark has the mustard seed ([[Mark 4:30–32]]). The wheat and the tares, the treasure, the pearl, the net and the householder scribe are Matthew’s alone (Luke tells the mustard seed and the leaven elsewhere, [[Luke 13:18–21]]). Matthew places the treasure, the pearl and the net after Jesus has sent the crowd away and gone into the house (verse 36), which suggests they were spoken to the disciples alone. The chapter closes with Jesus teaching in the synagogue of His own country, Nazareth, which Mark also tells ([[Mark 6:1–6]]).

thread: |
  **One seed falls on many kinds of ground, and the kingdom grows from it to the harvest.**

  The first parable turns on the ground, not the seed: the sower’s seed is the same everywhere, and what it yields depends on the heart that receives it. That is also Jesus’s answer when His disciples ask why He now speaks in parables. Those who receive are given more; those who will not see hear the stories without the explanation (verses 10–17).

  The parables that follow take the kingdom from its first sowing to its end. An enemy sows tares in the field; a seed too small to notice becomes a tree; a little leaven works through the whole lump; a man gives all he has for a treasure or a pearl; a net gathers every kind and is sorted on the shore. Joseph Smith read the seven as one connected history of the kingdom, from its setting up in Jesus’s day “even unto the end of the world.” The chapter ends at Nazareth, where the people who knew Jesus best take offense at Him and, because of their unbelief, see few mighty works.

sections:
  - range: 1-9
    heading: The sower
    plain: |
      That same day Jesus went out of the house and sat down by the lake. Such great crowds gathered around Him that He got into a boat and sat in it, while the whole crowd stood on the shore. He told them many things in parables. “A sower went out to sow. As he scattered the seed, some fell along the path, and the birds came and ate it up. Some fell on rocky ground covered by a thin layer of soil; it sprang up quickly because the soil was shallow, but when the sun rose it was scorched, and because it had no root it withered. Some fell among thorns, and the thorns grew up and choked it. But some fell on good soil and produced a crop, some a hundred times what was sown, some sixty, some thirty. Whoever has ears to hear, let him hear.”
  - range: 10-17
    heading: Why parables?
    plain: |
      The disciples came and asked Him, “Why do you speak to them in parables?” He answered, “You have been given to know the secrets of the kingdom of heaven, but they have not. Whoever has will be given more, and will have plenty; whoever has not will lose even what he has. That is why I speak to them in parables: they look but do not see, and listen but do not hear or understand. In them Isaiah’s prophecy is fulfilled: ‘You will hear and hear but never understand; you will look and look but never perceive. For this people’s heart has grown dull; their ears are hard of hearing, and they have shut their eyes, so that they might not see with their eyes, hear with their ears, understand with their heart, and turn, and I would heal them.’ But blessed are your eyes, because they see, and your ears, because they hear. I tell you the truth: many prophets and righteous people longed to see what you see and did not see it, and to hear what you hear and did not hear it.”
  - range: 18-23
    heading: The sower explained
    plain: |
      “Listen, then, to what the parable of the sower means. When anyone hears the message of the kingdom and does not understand it, the evil one comes and snatches away what was sown in his heart; that is the seed sown along the path. The seed on rocky ground is the one who hears the word and at once receives it with joy, but has no root in himself and lasts only a short time; when trouble or persecution comes because of the word, he quickly falls away. The seed among the thorns is the one who hears the word, but the worries of this life and the deceitfulness of wealth choke it, and it bears no fruit. The seed on good soil is the one who hears the word and understands it; he bears fruit and produces a hundred, sixty, or thirty times what was sown.”
  - range: 24-30
    heading: The wheat and the tares
    plain: |
      He told them another parable: “The kingdom of heaven is like a man who sowed good seed in his field. But while everyone slept, his enemy came and sowed darnel, a weed like wheat, among the wheat, and went away. When the wheat sprouted and formed heads, the darnel appeared too. The owner’s servants came to him and said, ‘Sir, didn’t you sow good seed in your field? Where did the weeds come from?’ He said, ‘An enemy did this.’ The servants asked, ‘Do you want us to go and pull them up?’ ‘No,’ he answered, ‘because while you are pulling up the weeds you may uproot the wheat with them. Let both grow together until the harvest. At harvest time I will tell the reapers: first gather the weeds and tie them in bundles to be burned; then gather the wheat into my barn.’”
  - range: 31-35
    heading: The mustard seed and the leaven
    plain: |
      He told them another parable: “The kingdom of heaven is like a mustard seed that a man took and planted in his field. It is the smallest of seeds, but when it grows it is the largest of garden plants and becomes a tree, so that the birds come and nest in its branches.” He told them still another: “The kingdom of heaven is like yeast that a woman took and mixed into a large batch of flour until it had worked all through the dough.” Jesus told the crowd all these things in parables; He did not speak to them without a parable. This fulfilled what was spoken by the prophet: “I will open my mouth in parables; I will speak things hidden since the foundation of the world.”
  - range: 36-43
    heading: The tares explained
    plain: |
      Then Jesus sent the crowd away and went into the house. His disciples came to Him and said, “Explain to us the parable of the weeds in the field.” He answered, “The one who sows the good seed is the Son of Man. The field is the world. The good seed are the children of the kingdom; the weeds are the children of the evil one, and the enemy who sowed them is the devil. The harvest is the end of the world, and the reapers are angels. As the weeds are gathered and burned in the fire, so it will be at the end of this world. The Son of Man will send out His angels, and they will gather out of His kingdom everything that causes sin and all who do evil, and throw them into the fiery furnace, where there will be weeping and grinding of teeth. Then the righteous will shine like the sun in the kingdom of their Father. Whoever has ears, let him hear.”
  - range: 44-52
    heading: The treasure, the pearl, the net, and the householder
    plain: |
      “The kingdom of heaven is like treasure hidden in a field. A man found it and hid it again, and then in his joy went and sold everything he had and bought that field. Again, the kingdom of heaven is like a merchant looking for fine pearls. When he found one of great value, he went and sold everything he had and bought it. Again, the kingdom of heaven is like a net that was let down into the lake and caught fish of every kind. When it was full, the fishermen pulled it up on the shore, sat down, and collected the good fish in baskets, but threw the bad away. So it will be at the end of the world: the angels will come and separate the wicked from the righteous and throw them into the fiery furnace, where there will be weeping and grinding of teeth.” Jesus asked, “Have you understood all these things?” “Yes, Lord,” they said. He said to them, “So every scribe who has become a disciple in the kingdom of heaven is like the head of a household who brings out of his storeroom new treasures as well as old.”
  - range: 53-58
    heading: No honor in His own country
    plain: |
      When Jesus had finished these parables, He left that place. Coming to His home town, He taught the people in their synagogue, and they were amazed. “Where did this man get this wisdom and these miraculous powers?” they asked. “Isn’t this the carpenter’s son? Isn’t His mother’s name Mary, and aren’t His brothers James, Joses, Simon and Judas? Aren’t all His sisters here with us? Where then did this man get all this?” And they took offense at Him. But Jesus said to them, “A prophet is honored everywhere except in his own town and in his own home.” And He did not do many miracles there, because of their unbelief.

notes:
  - ref: 3
    phrase: he spake many things unto them in parables
    kind: history
    title: Why parables, and why now
    body: |
      Parables had not been characteristic of Jesus’s teaching before this day, and Matthew sets the change on the day His opposition hardened. He had used comparisons before, as in the two builders of [[Matt. 7:24–27]], and His doctrine had been set out plainly, as in the Sermon on the Mount; now, for the first time, He speaks to the multitude in parables and leaves them unexplained. The parables began “when opposition to Jesus was strong, and when scribes, Pharisees, and rabbis were alert in maintaining a close watch upon His movements.” Matthew makes the link himself with “the same day” (verse 1): the Pharisees’ charge that He cast out devils by Beelzebub and the scribes’ demand for a sign ([[Matt. 12:24]]; [[Matt. 12:38–39]]) came on the same day He sat in the boat and told of the sower.

      The form itself was not new: parables were common among Jewish teachers. What was new was its use by Jesus at this moment: a form at once more attractive to the crowd, less open to attack from His critics, and a test of every hearer’s character. Verses 10–17 give Jesus’s own account of why.
    sources: [talmage-jesus-christ-19, halverson-soils-souls, ellicott-matthew]
  - ref: 11
    phrase: the mysteries of the kingdom of heaven
    kind: words
    title: Mysteries given to those who trust
    body: |
      A “mystery” here is a secret God gives, not a riddle no one can solve. The Greek *mystērion* meant “a hidden or secret thing, not obvious to the understanding”; among the Greeks, “mysteries” were religious secrets “confided only to the initiated.” The disciples, Jesus says, have been given them. (What Matthew means by “the kingdom of heaven” is explained at [[Matt. 3:2]].)

      Why them and not the crowd? Joseph Smith answered from this chapter. The multitude “did not receive an explanation upon his parables” because of unbelief; the disciples were given the mysteries “because of the faith and confidence which they had in him.” He had no patience with the claim that the parables were meant to stay obscure, the habit of saying, whenever truth is taught, “all is mystery, they are spoken in parables, and, therefore, are not to be understood.” To His disciples the Savior “expounded it plainly” (verses 18–23, 36–43), and the explanations are on the page.
    sources: [thayer, jsp-letter-elders-1835-12]
  - ref: 12
    phrase: For whosoever hath, to him shall be given
    kind: scripture
    title: Whosoever receiveth
    body: |
      The Joseph Smith Translation answers the question this verse raises: has what, and how could it be fair to take from one who has nothing? It reads, “For whosoever receiveth, to him shall be given, and he shall have more abundance; but whosoever continueth not to receive, from him shall be taken away even that he hath” (JST Matt. 13:10–11, in the footnotes). The verse is about what a person does with the word, not about what he owns.

      That fits the setting. The disciples had already accepted the first principles of the gospel, and more would be given them; those in the crowd who had turned away what was offered would lose even what it had. “Two men may hear the same words; one of them listens in indolence and indifference, the other with active mind intent on learning all that the words can possibly convey.” The same parable leaves one richer and the other poorer.
    sources: [lds-scriptures, talmage-jesus-christ-19]
  - ref: 14
    phrase: in them is fulfilled the prophecy of Esaias
    kind: scripture
    title: Isaiah’s hard commission
    body: |
      Esaias is Isaiah. The prophecy is [[Isa. 6:9–10]], where the Lord sends Isaiah to a people who will hear him and not understand; the site’s note at [[Isa. 6:9]] explains how the Hebrew and the Book of Mormon read that hard commission. Jesus says it is fulfilled again in the crowd by the lake.

      Matthew’s wording puts the closing of eyes on the people. Isaiah’s commission reads “shut their eyes” as a thing done to them; here “their eyes they have closed” (verse 15). Joseph Smith drew the same conclusion: the multitude was condemned “because they were not willing to see with their eyes and hear with their ears; not because they could not and were not privileged to see, and hear.” The last words of the quotation still hold the door open: they might yet “be converted, and I should heal them.”

      There was mercy in the parable as well. Hearers too weak to accept the plain word could carry the story away without condemning themselves; “had they rejected the truth with full understanding, stern Justice would surely demand their condemnation.” And the story stayed with them, so that when “time and experience, including suffering perhaps,” had prepared them, they could find “the living kernel of gospel truth within the husk of the simple tale.”
    sources: [lds-scriptures, jsp-letter-elders-1835-12, talmage-jesus-christ-19]
  - ref: 19
    phrase: When any one heareth the word of the kingdom, and understandeth it not
    kind: symbol
    title: One seed, four hearers
    body: |
      The parable is about the ground, not the seed. The seed is “the word of the kingdom,” the same wherever it falls; the soils are the different ways people receive it. Galilean fields were crossed by paths beaten hard by people and animals, and seed thrown by the handful landed on them too. On such ground it could not root, and the birds took it; “so with the seed of truth falling upon the hardened heart.” Joseph Smith described the wayside hearer as one with “no desire for the principles of truth,” who therefore does not understand the word when he hears it, and from whom the devil takes it.

      Lehi’s dream of the tree of life can be read as a picture of the same four kinds of people. The wayside, the hearers least receptive to the word, answers to those in the great and spacious building who mock; those who start on the path and are lost in the mist of darkness (the stony ground, [[1 Ne. 8:23]]), those who reach the tree and taste the fruit but are ashamed and fall away (the thorns, [[1 Ne. 8:24–28]]), and those who hold fast to the rod and partake (the good ground, [[1 Ne. 8:30]]). The two accounts do the same work: they warn and they explain why some people turn away from God’s truth.
    sources: [oaks-parable-sower, talmage-jesus-christ-19, jsp-letter-elders-1835-12, sc-knowhy-663]
  - ref: 22
    phrase: the care of this world, and the deceitfulness of riches, choke the word
    kind: prophets
    title: The subtlest thorns
    body: |
      The thorny ground is the soil of people who have already received the word, and its thorns are “the most subtle” of all: the worldly forces that crowd out a living faith, the “cares and riches and pleasures of this life” ([[Luke 8:14]]). Some can be named: we surrender to pleasure when we are addicted, “which impairs God’s precious gift of agency,” or are “beguiled by trivial distractions”; we are overcome by cares “when we are paralyzed by fear of the future.” Putting the cares of this world ahead of the things of God “in our actions, our priorities, and our thinking” is what Jesus rebuked in Peter for savoring “those that be of men” ([[Matt. 16:23]]).

      There is hope in the image too. A field thick with thistles is rich ground: “the abundant yield of thorny thistles demonstrates the fitness of the soil for a better crop, were it only free from the cumbering weeds.”
    sources: [oaks-parable-sower, talmage-jesus-christ-19]
  - ref: 23
    phrase: heareth the word, and understandeth it
    kind: scripture
    title: Understandeth and endureth
    body: |
      The Joseph Smith Translation adds one word to the good ground: the good hearer is one who “understandeth and endureth” (JST Matt. 13:21, in the footnotes). With it, the good ground answers each failure in turn: unlike the wayside it understands, unlike the stony ground it endures, and, in Luke’s telling, unlike the thorny ground it keeps the word and bears fruit ([[Luke 8:15]]).

      The soils are not fixed types. Some have read the parable as fatalism, with the wayside hopeless and the good ground safe forever, but Jesus “neither said nor intimated that the hard-baked soil of the wayside might not be plowed, harrowed, fertilized, and so be rendered productive; nor that the stony impediment to growth might not be broken up and removed.” Which soil a person is “is not a single decision, resulting in our permanent placement amid the soils” but an ongoing process. Even good ground yields at different rates, thirty, sixty or a hundredfold, “with many inter-gradations.”
    sources: [lds-scriptures, halverson-soils-souls, talmage-jesus-christ-19]
  - ref: 25
    phrase: sowed tares among the wheat
    kind: history
    title: Tares that look like wheat
    body: |
      The tares are bearded darnel, a weed grass that grows in grain fields and looks almost exactly like wheat until it forms its seed heads. That is why the servants noticed nothing until the blade “brought forth fruit” (verse 26). Darnel was worse than useless: a poisonous fungus can infect its seeds and make the flour toxic. To over-sow a field already planted with weed seed was a malicious outrage.

      The householder’s refusal to weed was the wise course. While unripe, darnel and wheat are hard to tell apart and their roots are tangled; pulling the one would uproot the other. So he waited for harvest, when both were ripe and the difference showed. Besides what the Lord’s own explanation makes of it (verses 37–43, and the revelation in the note on verse 30), one lesson of the story is patience, long-suffering and toleration.
    sources: [ball-plants-nt, talmage-jesus-christ-19]
  - ref: 30
    phrase: Gather ye together first the tares
    kind: scripture
    title: The parable explained again in 1832
    body: |
      The Lord explained this parable a second time, in a revelation to Joseph Smith in 1832, and in it the order of the harvest is reversed. The revelation is [[D&C 86]]. Joseph recorded that he was “translating and received a revelation explaining the parable [of] the wheat and the tares.” It names the sowers as the apostles; after they had “fallen asleep,” the apostate church sowed the tares, which “choke the wheat and drive the church into the wilderness.” Now, “in the last days,” the blade is springing up again and is “yet tender,” so the angels are told not to pluck the tares “lest you destroy the wheat also.”

      Then: “ye shall first gather out the wheat from among the tares” ([[D&C 86:7]]). Joseph had revised Matthew 13 a year and a half earlier without changing the order; later, reviewing the manuscript, he reversed it, and the Joseph Smith Translation now reads “first the wheat into my barn; and the tares are bound in bundles to be burned” (JST Matt. 13:29, in the footnotes). He explained the order as he understood it: the gathering of the wheat “is to take place while the tares are being bound over, and preparing for the day of burning.”
    sources: [jackson-new-translation-revelations, lds-scriptures, jsp-letter-elders-1835-12]
  - ref: 32
    phrase: the least of all seeds
    kind: symbol
    title: A seed too small for a kingdom
    body: |
      “Least of all seeds” is a proverb, not botany. The plant is most likely black mustard, which grew wild and was cultivated in Galilee and can reach ten feet. Its seeds are small but not the smallest, and as an annual herb it is not really a tree; “hyperbole is perhaps involved.” “As small as a mustard seed” was an everyday saying of the time, and Jesus uses it again for faith ([[Matt. 17:20]]). A full-grown plant is still sturdy enough for small birds that come to feed on its seeds.

      The surprise was in the comparison. People expected the kingdom of God to arrive in glory, “ushered in by blare of trumpets and tramp of armies, with King Messiah at the head.” Jesus said it would begin almost unnoticed. Joseph Smith saw the parable fulfilled in the latter-day Church, “the church as it shall come forth in the last days”: it began with the Book of Mormon, “which a man took and hid in his field,” and grows until God sends “his powers, gifts and angels, to lodge in the branches thereof.”
    sources: [ball-plants-nt, talmage-jesus-christ-19, jsp-letter-elders-1835-12]
  - ref: 33
    phrase: like unto leaven
    kind: symbol
    title: Leaven, for once, for good
    body: |
      Leaven usually stands for corruption in scripture: Paul’s “leaven of malice and wickedness” ([[1 Cor. 5:8]]) and the unleavened bread of the Passover. Here it is the kingdom, and the image works because of how leaven acts: from within, slowly, quietly, until the whole is changed. The mustard seed grows by drawing in from outside; the leaven spreads outward through “the mass of otherwise dense and sodden dough.” Joseph Smith read it of the Restoration’s beginnings, “a little leaven that was put into three witnesses” and was working through the whole.
    sources: [ellicott-matthew, talmage-jesus-christ-19, jsp-letter-elders-1835-12]
  - ref: 35
    phrase: I will open my mouth in parables
    kind: scripture
    title: A psalm of history, fulfilled
    body: |
      The words are from [[Ps. 78:2]], a psalm the superscription assigns to Asaph: “I will open my mouth in a parable: I will utter dark sayings of old.” What follows in the psalm is no prediction but a long retelling of God’s dealings with Israel, told so that the children “might not be as their fathers” ([[Ps. 78:8]]). The site’s note at [[Ps. 78:2]] explains the Hebrew and how Matthew’s second line differs from the Greek psalm.

      Since the psalm foretold nothing, “fulfilled” works differently here: Matthew saw in Jesus one whose way of teaching answered to the psalmist’s, who could take the psalmist’s words as His own: a teacher who opened in parables what had been hidden.
    sources: [lds-scriptures, ellicott-matthew]
  - ref: 39
    phrase: the harvest is the end of the world
    kind: scripture
    title: 'The end of the world: the destruction of the wicked'
    body: |
      “The end of the world” in this chapter is not the end of the planet. The Joseph Smith Translation reads verse 40 as “so shall it be in the end of this world, or the destruction of the wicked,” and adds that the angels are sent forth “in that day, before the Son of man shall come” (JST Matt. 13:39–44, in the appendix). Joseph Smith insisted the explanation be taken as it stands: “the end of the world is the destruction of the wicked; the harvest and the end of the world have an allusion directly to the human family in the last days, instead of the earth, as many have imagined.” The Mount of Olives discourse, as he revised it, uses the same definition: “the end of the world, or the destruction of the wicked, which is the end of the world” ([[JS—M 1:4]]).

      The same change runs through the net in verses 49–50, where the translation adds, “And the world is the children of the wicked,” and the wicked are cast “out into the world to be burned” (JST Matt. 13:49–51, in the footnotes). The harvest is a separation among people, and the righteous are left to “shine forth as the sun in the kingdom of their Father” (verse 43).
    sources: [jst-matt-13, jsp-letter-elders-1835-12, lds-scriptures]
  - ref: 44
    phrase: treasure hid in a field
    kind: symbol
    title: Found by chance, found by search
    body: |
      The treasure and the pearl are a pair, and the difference between them is how the thing was found. Burying valuables was common among people exposed to bandits and invasion, and finding such a hoard was not unheard of; the man in the parable comes on his treasure seemingly by accident. (Jewish law made the buyer of land owner of everything it contained, so his purchase was not theft.) The merchant, by contrast, was out looking for fine pearls. One stumbles on the kingdom; the other gives his whole energy to seeking it. The price is the same for both: “the price of possession is one’s all,” and the first man pays it “for joy.”

      Joseph Smith saw both fulfilled among the Saints of his day: in the treasure, Saints “selling all that they have and gathering themselves together unto a place” of inheritance; in the pearl, “men travelling to find places for Zion,” who, finding it, “straitway sell all that they have and buy it.”
    sources: [talmage-jesus-christ-19, jsp-letter-elders-1835-12]
  - ref: 51
    phrase: Have ye understood all these things?
    kind: prophets
    title: Seven parables, one history
    body: |
      Joseph Smith read the seven parables as one story told in order, the history of the kingdom from Jesus’s day to the end. In a letter to the elders in 1835 he took them in sequence: the sower, the setting up of the kingdom in the apostles’ day; the wheat and the tares, the corruption of the Church in the age of apostasy; the mustard seed, the kingdom’s rise in the last days; the leaven, its spread from the three witnesses; the treasure and the pearl, the Saints’ gathering and the search for Zion; and the net, the gospel cast over the earth by “the seed of Joseph,” “gathering of every kind, that the good may be saved,” with the sorting left to the angels. He found in them as clear a teaching on the gathering “as anything recorded in the Bible.”

      The net makes a fitting last image. It catches every kind without choosing, and the sorting comes only on the shore, by the angels (verses 49–50). To the question “Have ye understood all these things?” Joseph answered for the Saints of the last days: “yea Lord, … for these things are so plain and so glorious, that every Saint in the last days must respond with a hearty amen to them.”
    sources: [jsp-letter-elders-1835-12, halverson-soils-souls, talmage-jesus-christ-19]
  - ref: 52
    phrase: every scribe which is instructed unto the kingdom of heaven
    kind: words
    title: A scribe made a disciple
    body: |
      The scribe here is a disciple. The Greek behind “instructed unto” means “which has become a disciple in” the kingdom (the footnote), and the words come straight after the disciples say they have understood. Jesus pictures a scribe trained in the kingdom, who keeps a storeroom of both old and new. The old is the eternal law of righteousness that every true teacher had taught; the new is what Jesus had just revealed about His own mission and the kingdom. The disciples were to be ready, “like well-taught teachers,” to bring out of their storeroom “treasures of truth both old and new, for the edification of the world.”
    sources: [lds-scriptures, ellicott-matthew, talmage-jesus-christ-19]
  - ref: 55
    phrase: his brethren, James, and Joses, and Simon, and Judas
    kind: history
    title: The carpenter’s family
    body: |
      The people of Nazareth list Jesus’s family to say He is nobody special. Mark has them call Him “the carpenter” ([[Mark 6:3]]), and He probably worked in Joseph’s shop. They could not square the wisdom He now taught, and the claim it implied, “with the obscurity and commonness of the earlier life, and so they did not believe.”

      Of the brothers named, James, “the Lord’s brother” ([[Gal. 1:19]]), later held an important place in the Church at Jerusalem and was probably the writer of the Epistle of James. Matthew mentions sisters too, but does not name them.
    sources: [ellicott-matthew, bd-james]
  - ref: 58
    phrase: he did not many mighty works there because of their unbelief
    kind: scripture
    title: Miracles wait on faith
    body: |
      Mark puts it more strongly: “he could there do no mighty work, save that he laid his hands upon a few sick folk” ([[Mark 6:5]]). The power to work miracles “was not absolute and unconditioned, but depended on the faith of those who came to Him.” The Book of Mormon states the principle outright: “if there be no faith among the children of men God can do no miracle among them” ([[Ether 12:12]]).

      Luke tells of a rejection at Nazareth at the very beginning of Jesus’s ministry, when the townspeople tried to throw Him from a cliff ([[Luke 4:16–30]]). Matthew and Mark place this visit later, and there seems no good reason to take the two accounts as one visit.
    sources: [ellicott-matthew, lds-scriptures]

christ: |
  Matthew 13 shows Jesus Christ as the Sower. In the parable of the wheat and the tares He names Himself: “He that soweth the good seed is the Son of man” (verse 37), and those ordained to carry on the ministry after Him are by implication sowers too. In the first parable the seed is “the word of the kingdom” (verse 19), the same on every kind of ground, and what it yields is the hearer’s part: “it is up to each of us to set the priorities and to do the things that make our soil good and our harvest plentiful,” and the soil is made good by prayer, by scripture, by service, and by regularly partaking of the sacrament “to always have His Spirit to be with us.”

explore: |
  - **The other tellings.** [[Mark 4:1–34]] and [[Luke 8:4–18]] for the sower and the mustard seed; [[Mark 6:1–6]] for Nazareth, and Luke’s earlier visit, [[Luke 4:16–30]].
  - **The parable explained again.** [[D&C 86:1–11]], the wheat and the tares in the last days.
  - **The same four hearers.** Lehi’s dream, [[1 Ne. 8:19–34]].
  - **Isaiah’s commission.** [[Isa. 6:8–13]], which Jesus quotes in verses 14–15.
  - “Of Soils and Souls: The Parable of the Sower” (*Religious Educator*, 2008) reads the sower through Joseph Smith’s explanation; *Jesus the Christ*, chapter 19, treats each parable of the day.

