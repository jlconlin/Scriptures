chapter: 10
title: The Twelve Sent Out
tagline: Jesus gives the Twelve His own power and sends them to the lost sheep of Israel with nothing for the road; He warns that they will be hated as He is, tells them not to fear, and promises that whoever receives them receives Him and the Father who sent Him.
when: 'During Jesus’s ministry in Galilee, after His second rejection at Nazareth'

setting: |
  Matthew 10 is the second of Matthew’s five long discourses, the Apostolic Commission, and it closes as the Sermon on the Mount did: “when Jesus had made an end of commanding his twelve disciples” ([[Matt. 11:1]]). It follows straight on from [[Matt. 9:35–38]], where Jesus, seeing the crowds as sheep without a shepherd, told His disciples to pray the Lord of the harvest to send out labourers. In chapter 10 He sends them.

  What Matthew describes is the sending of the Twelve, not their choosing, which Mark and Luke tell earlier ([[Mark 3:13–19]]; [[Luke 6:12–16]]). In the order this site follows, the mission came after Jesus’s second rejection at Nazareth ([[Matt. 13:54–58]]), as He set out on a third tour of the towns and villages of Galilee. The Twelve had by then been with Him for many months, learning from His public preaching and His private teaching.

  Mark and Luke tell the mission briefly ([[Mark 6:7–13]]; [[Luke 9:1–6]]) and record the Twelve’s return and report ([[Mark 6:30]]; [[Luke 9:10]]). Matthew gives the charge at length and never says how the mission went. Much of the charge was given again to the elders of this dispensation, who were told to “become even as my friends in days when I was with them” ([[D&C 84:77]]).

thread: |
  **The Son sends His servants as the Father sent Him, and what is done to them is done to Him.**

  The chapter moves outward from a single mission to a whole ministry. In verses 1–15 they receive His own power and go as He goes, with no provision, depending on whoever will take them in. In verses 16–39 the horizon widens to councils, scourgings, governors and kings: servants should not expect to escape what their Master meets, and they will be called what He is called.

  Three times in that hard passage Jesus tells them not to fear (verses 26, 28, 31), and His last reason is the Father, who knows when a sparrow falls. The cost is real: a sword through families, a cross, a life lost. But the charge ends where it began, with sending (verses 40–42). As He was sent by the Father, they are sent by Him: whoever receives them receives Him and the Father who sent Him, and even a cup of cold water given to the least of them will be rewarded.

sections:
  - range: 1-4
    heading: The Twelve named
    plain: |
      Jesus called His twelve disciples to Him and gave them authority over unclean spirits, to cast them out, and to heal every kind of sickness and disease. These are the names of the twelve apostles: first, Simon, called Peter, and his brother Andrew; James the son of Zebedee and his brother John; Philip and Bartholomew; Thomas and Matthew the tax collector; James the son of Alphaeus, and Lebbaeus, also called Thaddaeus; Simon the Zealot, and Judas Iscariot, the one who betrayed Him.
  - range: 5-15
    heading: The charge for the mission
    plain: |
      Jesus sent these twelve out with these instructions: “Do not go among the Gentiles or enter any Samaritan town. Go instead to the lost sheep of the house of Israel. As you go, proclaim: ‘The kingdom of heaven has come near.’ Heal the sick, cleanse lepers, raise the dead, cast out devils. You received without paying; give without charging. Take no gold, silver or copper in your belts, no bag for the road, no second coat, no shoes or staff, for the worker deserves his food. When you enter a town or village, find out who in it is worthy, and stay there until you leave. As you enter a house, greet it. If the house is worthy, let your peace rest on it; if not, let your peace return to you. If anyone will not welcome you or listen to your words, shake the dust off your feet as you leave that house or town. Truly I tell you, it will be easier for Sodom and Gomorrah on the day of judgment than for that town.”
  - range: 16-23
    heading: Sheep among wolves
    plain: |
      “I am sending you out like sheep among wolves, so be as shrewd as serpents and as innocent as doves. Be on your guard against people, for they will hand you over to the councils and flog you in their synagogues, and you will be brought before governors and kings because of me, as a witness to them and to the Gentiles. When they hand you over, do not worry about how or what to say; what you are to say will be given you at that moment. For it will not be you speaking, but the Spirit of your Father speaking through you. Brother will betray brother to death, and a father his child; children will turn against their parents and have them put to death. Everyone will hate you because of my name, but whoever endures to the end will be saved. When they persecute you in one town, flee to the next. Truly I tell you, you will not have gone through all the towns of Israel before the Son of Man comes.”
  - range: 24-33
    heading: Do not fear them
    plain: |
      “A disciple is not above his teacher, nor a servant above his master. It is enough for the disciple to become like his teacher, and the servant like his master. If they have called the head of the house Beelzebub, how much more will they slander the members of his household! So do not be afraid of them. Nothing is covered that will not be uncovered, or hidden that will not be made known. What I tell you in the dark, say in the daylight; what is whispered in your ear, proclaim from the rooftops. Do not be afraid of those who kill the body but cannot kill the soul. Rather, fear the One who can destroy both soul and body in hell. Are not two sparrows sold for a penny? Yet not one of them falls to the ground apart from your Father. Even the hairs of your head are all counted. So do not be afraid; you are worth more than many sparrows. Whoever acknowledges me before others, I will acknowledge before my Father in heaven. But whoever disowns me before others, I will disown before my Father in heaven.”
  - range: 34-39
    heading: Not peace, but a sword
    plain: |
      “Do not suppose that I have come to bring peace to the earth. I did not come to bring peace, but a sword. For I have come to turn a man against his father, a daughter against her mother, a daughter-in-law against her mother-in-law; a man’s enemies will be the members of his own household. Anyone who loves father or mother more than me is not worthy of me; anyone who loves son or daughter more than me is not worthy of me. Whoever does not take up his cross and follow me is not worthy of me. Whoever finds his life will lose it, and whoever loses his life for my sake will find it.”
  - range: 40-42
    heading: Whoever receives you
    plain: |
      “Whoever welcomes you welcomes me, and whoever welcomes me welcomes the One who sent me. Whoever welcomes a prophet because he is a prophet will receive a prophet’s reward, and whoever welcomes a righteous person because he is righteous will receive a righteous person’s reward. And whoever gives even a cup of cold water to one of these little ones because he is my disciple, truly I tell you, he will not lose his reward.”

notes:
  - ref: 1
    phrase: he gave them power against unclean spirits
    kind: christ
    title: His own work, given to the Twelve
    body: |
      Jesus gives the Twelve His own work. The last words of this verse repeat what Matthew has just said of Jesus Himself, that He went about “healing every sickness and every disease among the people” ([[Matt. 9:35]]), and the repetition marks a delegation of authority: what He had been doing, they would now do.

      Mark gives the purpose of their calling in a phrase: “that they should be with him, and that he might send them forth to preach” ([[Mark 3:14]]). They had done the first for many months; now came the second. The power they received was the authority of the priesthood given them at their ordination, and healing the sick and casting out devils were a set part of their mission, to be used as occasion arose.
    sources: [ellicott-matthew, talmage-jesus-christ-21]
  - ref: 2
    phrase: the twelve apostles
    kind: words
    title: 'Apostles: men sent'
    body: |
      Matthew calls them “disciples” in verse 1 and “apostles” in verse 2, at the moment they are sent. The word means “one sent forth.” Jesus had given the Twelve the title when He chose them ([[Luke 6:13]]), and in the Greek world it had come to mean an ambassador or envoy of a state, one who speaks for the power that sends him. Their calling was to be special witnesses of the name of Jesus Christ in all the world, above all of His divinity and His bodily resurrection.

      The number mattered too. Twelve at once suggested the twelve tribes of Israel, a link Jesus Himself makes when He promises these men twelve thrones, “judging the twelve tribes of Israel” ([[Matt. 19:28]]). The office did not end with them: today twelve men with the same calling and ordination form the Quorum of the Twelve Apostles.
    sources: [bd-apostle, ellicott-matthew]
  - ref: 2
    phrase: The first, Simon, who is called Peter
    kind: history
    title: Peter first
    body: |
      Matthew’s “The first” is more than counting. The New Testament gives four lists of the Twelve (here; [[Mark 3:16–19]]; [[Luke 6:13–16]]; [[Acts 1:13]]), and in every one Peter is named first and Judas Iscariot, where he appears, last. Peter’s place reflects a preeminence the others acknowledged.

      Each list also falls into three groups of four, the same men always in the same group, though the order inside the group varies. The first four, two pairs of brothers called from their nets ([[Matt. 4:18–22]]), stood nearest to Jesus, chosen out of the chosen. Peter, James and John alone saw Jairus’s daughter raised ([[Mark 5:37]]), the Transfiguration ([[Matt. 17:1]]) and the agony in Gethsemane ([[Matt. 26:37]]).
    sources: [ellicott-matthew]
  - ref: 3
    phrase: Lebbæus, whose surname was Thaddæus
    kind: history
    title: Two names for one man
    body: |
      A reader who compares the lists finds names that do not match, and the likely reason is that some of the Twelve went by more than one name. Bartholomew is a family name formed like Barjona, and so probably not his only name. The first three Gospels name Bartholomew, always beside Philip, and never Nathanael; John names Nathanael, whom Philip brought to Jesus ([[John 1:45–49]]), and never Bartholomew. On that ground Nathanael is generally identified with Bartholomew.

      In the same way Lebbaeus, “whose surname was Thaddæus” (Mark calls him only Thaddaeus, [[Mark 3:18]]), is probably the apostle Luke calls “Judas the brother of James” ([[Luke 6:16]]), the Judas “not Iscariot” of [[John 14:22]]. The Greek can mean either “son” or “brother” of James.
    sources: [ellicott-matthew, bd-nathanael, bd-judas, bd-thaddaeus]
  - ref: 4
    phrase: Simon the Canaanite, and Judas Iscariot
    kind: words
    title: The Zealot and the man from Kerioth
    body: |
      Simon “the Canaanite” was not a Canaanite. The word should read “Cananean,” from the Aramaic *kanan*, of which the Greek is *zēlōtēs*; Luke accordingly calls him “Simon called Zelotes,” Simon the Zealot ([[Luke 6:15]]). The title refers to his political attachments, not to his descent or birthplace. The Zealots were a party, named for their zeal for the law, determined to resist Roman or any foreign rule in the land.

      Judas’s surname is a place. Iscariot marks him as a man of Kerioth, a town in the tribe of Judah ([[Josh. 15:25]]), which made him the only one of the Twelve who was not a Galilean. Matthew cannot name him without adding what he would do: “who also betrayed him.”
    sources: [bd-canaanite, bd-zelotes, bd-judas]
  - ref: 5
    phrase: Go not into the way of the Gentiles, and into any city of the Samaritans enter ye not
    kind: history
    title: Israel first, for now
    body: |
      The command to pass by Gentiles and Samaritans was a temporary limit for this mission, not a judgment on those peoples. For now the Twelve were to keep to Israel, and not to try to make converts among the Romans and Greeks, or even in the Samaritan towns. The limit was later lifted: the risen Lord sent the same men to “teach all nations” ([[Matt. 28:19]]), with the world for their field.

      Jesus describes His own mortal mission the same way: “I am not sent but unto the lost sheep of the house of Israel” ([[Matt. 15:24]]). The sheep He came to gather were Israel’s. The Book of Mormon records that when He spoke in Judea of “other sheep,” His hearers supposed He meant the Gentiles, “for they understood not that the Gentiles should be converted through their preaching” ([[3 Ne. 15:22]]). The Gentiles were to be converted, but through preaching, for they would not “at any time hear my voice” in His mortal ministry ([[3 Ne. 15:23]]).
    sources: [talmage-jesus-christ-21, sc-knowhy-207, lds-scriptures]
  - ref: 10
    phrase: neither two coats, neither shoes, nor yet staves
    kind: history
    title: Without purse or scrip
    body: |
      The Twelve were sent with nothing to live on. No money, no traveller’s bag (the “scrip”), no second coat, no spare shoes or staff. Mark has Jesus allow “a staff only” and tell them to “be shod with sandals” ([[Mark 6:8–9]]), which seems to contradict Matthew’s “neither shoes, nor yet staves.” One way to read the two together is that they forbid a traveller’s reserves: no second staff in case the first broke, no second pair of shoes to rest worn feet. Sandals were the footwear of the peasant class.

      Going so, the missionaries depended wholly on the hospitality of strangers, and the mission tested both sides. The people were proved by whether they would receive and help those who came in the Lord’s name, and the apostles learned to rely on a Provider more to be trusted than man. Nor were they to charge for what they gave. “Freely give” (verse 8) is stronger in the Greek: give as a free gift, without payment, as they had paid Him nothing. Being fed by those who took them in was another matter, “for the workman is worthy of his meat.”

      The Lord gave the same charge to the elders of this dispensation, naming these men as the pattern: “even as my friends in days when I was with them,” whom He “suffered … not to have purse or scrip, neither two coats” ([[D&C 84:77–78]]).
    sources: [ellicott-matthew, belnap-dust-feet, talmage-jesus-christ-21, lds-scriptures]
  - ref: 14
    phrase: shake off the dust of your feet
    kind: symbol
    title: Dust shaken off
    body: |
      Shaking off the dust was a rite drawn from the customs of hospitality, and it reversed one of them. A host received a guest by washing his feet. A house or city that would not receive the messengers left them to clean their own feet, outside, without water, and the blessing a guest pronounced on a welcoming house (the “peace” of verse 13) was turned around into a witness against it.

      The Greek verb “receive” here, *dexomai*, was one of the words for a host’s duty to a guest, and when the guest came as someone’s emissary, receiving him could include receiving his message. The comparison with Sodom and Gomorrah in verse 15 may point to hospitality as well, for their destruction was explained in later literature by their hostility, instead of hospitality, toward Lot’s guests ([[Ezek. 16:49]]). Matthew alone has the rite performed against a single house as well as a city, but whether it answered a refusal of lodging or a refusal of the message is not clear.

      The New Testament records the rite performed only once, by Paul and Barnabas at Antioch in Pisidia ([[Acts 13:50–51]]). The Lord renewed it in this dispensation with a caution: “not in their presence, lest thou provoke them, but in secret” ([[D&C 60:15]]). Done rightly it leaves the one who performs it with joy and gladness ([[D&C 75:21]]); a sense of vindication or vengeance would mean the rite had failed.
    sources: [belnap-dust-feet, lds-scriptures]
  - ref: 16
    phrase: wise as serpents, and harmless as doves
    kind: words
    title: Serpents and doves
    body: |
      The saying asks for two qualities at once, a serpent’s wariness and a dove’s harmlessness. Sent like sheep among wolves, the Twelve were to be prudent and give no needless offense, and never to put themselves recklessly in the power of men; the next verse says why (“beware of men”). The dove gives the other half: shrewd, but without guile. In a revelation of this dispensation the Lord restates the saying as “be ye as wise as serpents and yet without sin” ([[D&C 111:11]]).
    sources: [talmage-jesus-christ-21, lds-scriptures]
  - ref: 19
    phrase: it shall be given you in that same hour what ye shall speak
    kind: scripture
    title: Given in that same hour
    body: |
      The promise is for men on trial. Brought before governors and kings, the Twelve were to rely on inspiration for what to say rather than on their own preparation and premeditation, “for it is not ye that speak, but the Spirit of your Father which speaketh in you” (verse 20).

      When the Lord repeated the promise to missionaries of this dispensation, He joined it to a command to prepare: “Neither take ye thought beforehand what ye shall say; but treasure up in your minds continually the words of life, and it shall be given you in the very hour that portion that shall be meted unto every man” ([[D&C 84:85]]).
    sources: [talmage-jesus-christ-21, lds-scriptures]
  - ref: 23
    phrase: till the Son of man be come
    kind: christ
    title: Till the Son of man be come
    body: |
      Read as a promise of the Second Coming, this saying would set that coming before the Twelve had made the rounds of Israel’s towns. The coming of the Son of man recalls Daniel’s vision of one “like the Son of man” coming “with the clouds of heaven” ([[Dan. 7:13]]), and promises like this one led the first disciples to expect His coming within their own lifetime.

      The charge itself suggests another reading. It looks past this short mission: some of its instructions concerned the tour from which the Twelve would soon come back to report, and others, like the scourging in synagogues and the trials before governors and kings (verses 17–18), held for their whole ministry after the Ascension. On this reading verse 23 belongs to the mission in hand: the Twelve were to leave a town that persecuted them and go on to the next, and the Lord would follow them before they could finish the circuit of the cities of Israel. A promise about some “standing here” who would see the Son of man coming has its own note at [[Matt. 16:28]].
    sources: [ellicott-matthew, talmage-jesus-christ-21]
  - ref: 25
    phrase: If they have called the master of the house Beelzebub
    kind: words
    title: Called Beelzebub
    body: |
      Beelzebub was the name of a Philistine god, used as a title for Satan, the chief of the demons. The charge had already been made against Jesus: when He cast out a dumb spirit, the Pharisees said, “He casteth out devils through the prince of the devils” ([[Matt. 9:34]]). Matthew tells the full confrontation in chapter 12, where the note at [[Matt. 12:24]] explains the name and the danger of the accusation.

      Here Jesus draws the lesson for the Twelve. They are servants, and servants should not expect to escape what their Master suffers. If the head of the house was slandered as Satan’s agent, His household would be called worse.
    sources: [bd-beelzebub, talmage-jesus-christ-21]
  - ref: 28
    phrase: fear him which is able to destroy both soul and body in hell
    kind: words
    title: Whom to fear
    body: |
      The one to fear is God, who has power over the soul as well as the body. The most persecutors could do was kill the body, which was nothing beside the destruction of the soul. Some devout readers, unwilling to picture the Father as a destroyer, have taken “him” to be the adversary instead, but the Lord’s word to Joseph Smith points to God: “you should not have feared man more than God” ([[D&C 3:7]]). The verse speaks of God’s power, not His wish. He is not set before us as willing to destroy, only as able, where every offer of mercy has been refused; James uses almost the same words, “one lawgiver, who is able to save and to destroy” ([[James 4:12]]). And the next breath turns fear into trust (verses 29–31).

      “Hell” here is *Gehenna*, the valley south of Jerusalem whose name was given to the place where the wicked suffer punishment after death; the note at [[Matt. 5:22]] tells how the valley came by that meaning.
    sources: [talmage-jesus-christ-21, lds-scriptures, ellicott-matthew, thayer]
  - ref: 29
    phrase: Are not two sparrows sold for a farthing?
    kind: history
    title: Two sparrows for a farthing
    body: |
      The “farthing” here is the *assarion*, a small coin worth a tenth of a denarius, and a denarius was a labourer’s or soldier’s average day’s wage. Two sparrows cost a tenth of that. In Luke’s version the price is five sparrows for two farthings ([[Luke 12:6]]), a bargain that shows how little anyone thought of the birds.

      Yet not one falls to the ground “without your Father.” The manuscript of Joseph Smith’s revision adds two words: “one of them shall not fall on the ground without your father knoweth it.” If the Father’s care reaches the cheapest bird in the market, the Twelve, worth more than many sparrows, would not be forgotten.
    sources: [thayer, ellicott-matthew, jsp-nt1, talmage-jesus-christ-21]
  - ref: 34
    phrase: I came not to send peace, but a sword
    kind: prophets
    title: Not peace, but a sword
    body: |
      The saying seems at first to contradict the scriptures that call Christ “The Prince of Peace” ([[Isa. 9:6]]). The sword is the division His doctrine makes: the gospel would bring strife, households would be broken, and His teaching would cut and divide between those who received it and those who did not. Verses 35–36 echo the prophet Micah’s lament for a time when “a man’s enemies are the men of his own house” ([[Micah 7:6]]), and Micah goes on, “Therefore I will look unto the LORD; I will wait for the God of my salvation” ([[Micah 7:7]]), the endurance Jesus has just asked of the Twelve (verse 22).

      Verse 37 does not ask a disciple to love family less, only to love Christ more. Love within a family continues even when, for the sake of that higher love, relationships are interrupted or support is at times withheld; and keeping the Savior first is itself the best way to love them.
    sources: [christofferson-finding-your-life, talmage-jesus-christ-21, ellicott-matthew]
  - ref: 38
    phrase: he that taketh not his cross
    kind: symbol
    title: A cross before the cross
    body: |
      This is the first time the cross appears in Matthew, before Jesus has said anything about how He would die. The image would have needed no explanation. Roman rule had made the sight familiar: robbers or rebels, each carrying the cross on which he would die to the place of execution. The saying called the disciples to a like endurance of shame and suffering, and once they had seen their Master carry His own cross it would take on a new meaning. Jesus returns to the saying after Peter’s confession, where the Joseph Smith Translation defines taking up the cross; see the note at [[Matt. 16:24]].
    sources: [ellicott-matthew]
  - ref: 39
    phrase: he that loseth his life for my sake shall find it
    kind: prophets
    title: Losing life to find it
    body: |
      The paradox describes the life Jesus Himself lived. He gave His life to the Father consistently, losing it in the Father’s will in life and in death, the exact opposite of the adversary’s way. In the premortal council the Son said, “Father, thy will be done, and the glory be thine forever,” where Lucifer said, “give me thine honor” ([[Moses 4:1–2]]). To follow Jesus is to reject that model again, and to lose a self-centered life in favor of the life God has in view for each person. In giving His life, Christ saved not only His own but ours as well.

      The saying returns at [[Matt. 16:25]], where the note explains the one Greek word behind both “life” and “soul.”
    sources: [christofferson-finding-your-life]
  - ref: 40
    phrase: He that receiveth you receiveth me, and he that receiveth me receiveth him that sent me
    kind: christ
    title: Receiving the one who is sent
    body: |
      To receive the one Jesus sends is to receive Jesus, and through Him the Father. An apostle is one sent, and Jesus is Himself called “the Apostle and High Priest of our profession” ([[Heb. 3:1]]), the Father’s personal representative. As He was sent by the Father, the Twelve are sent by Him, and He counts every honor and kindness shown to them as shown to Himself, and through Him to the Father.

      “Receive” is the hospitality word of verse 14, the host’s welcome of a guest, and with the guest his message. The Lord said the same to the elders of this dispensation: “he that receiveth my servants receiveth me” ([[D&C 84:36]]).
    sources: [bd-apostle, ellicott-matthew, belnap-dust-feet, lds-scriptures]
  - ref: 42
    phrase: a cup of cold water only in the name of a disciple
    kind: words
    title: A cup of cold water
    body: |
      “Little ones” was a familiar term for a rabbi’s pupils, and Jesus, the great Master sending out His disciples, uses it of them: even a cup of cold water given to the humblest disciple, because he is a disciple, will be rewarded. Verse 41 has the same logic. To receive a prophet “in the name of a prophet” is to receive him for what that name stands for, a messenger of God, and so to share in his reward. The promise throws the gate wide open, to anyone who shows by a small act that he is in sympathy with the work.

      Jesus’s later words, that what is done “unto one of the least of these my brethren” is done unto Him ([[Matt. 25:40]]), allow the promise to reach any kindness to anyone. The elders of this dispensation were given the same promise for those who help them: “he who feeds you, or clothes you, or gives you money, shall in nowise lose his reward” ([[D&C 84:90]]).
    sources: [ellicott-matthew, lds-scriptures]

christ: |
  Matthew 10 shows Jesus Christ as the One sent by the Father who sends others in His turn. He gives the Twelve His own power, sends them as He was sent, warns that they will be treated as He is, and promises that whoever receives them receives Him and the Father. Those He sends now do not go alone: “whoso receiveth you, there I will be also, for I will go before your face” ([[D&C 84:88]]).

explore: |
  - **The other tellings.** The mission in [[Mark 6:7–13]] and [[Luke 9:1–6]]; the choosing of the Twelve in [[Mark 3:13–19]] and [[Luke 6:12–16]]; the Seventy sent with a like charge, [[Luke 10:1–16]].
  - **The charge renewed.** [[D&C 84:77–91]]; [[D&C 75:19–22]].
  - **The warnings fulfilled.** The apostles before the council and beaten, [[Acts 4:1–21]] and [[Acts 5:27–42]].
  - The chapter “‘Those Who Receive You Not’: The Rite of Wiping Dust Off the Feet,” in *By Our Rites of Worship* (Religious Studies Center, 2013), follows the rite from the Gospels to the journals of nineteenth-century missionaries.
  - Elder D. Todd Christofferson’s “Finding Your Life” (*Ensign*, March 2016) is on verse 39.

