chapter: 1
title: The Son of David, Conceived of the Holy Ghost
tagline: Matthew opens with Jesus’s royal pedigree through Joseph, then tells how Joseph, a just man, learned in a dream that the child was of the Holy Ghost and took Mary as his wife.
when: 'Jesus’s ancestry and birth; the Gospel probably written in the later first century AD'

setting: |
  Matthew stands first among the four Gospels, and the Joseph Smith Translation names it “The Testimony of St. Matthew.” Ancient Christian writings are unanimous in naming its author Matthew, the tax collector of Capernaum whom Jesus called from “the receipt of custom” ([[Matt. 9:9]]); modern scholars debate the attribution, and Latter-day Saints affirm that the apostle wrote it. It was written for Jewish readers in Palestine, its chief object to show that Jesus is the Messiah of whom the prophets spoke, and Matthew quotes the Old Testament at least twice as often as any other Gospel writer. Its first readers may have included Gentiles as well: wise men from the east come early in the story, and the risen Lord’s command to teach “all nations” closes it ([[Matt. 28:19]]). Many scholars hold that Mark was written first and that Matthew drew on it; Matthew is usually dated to the AD 80s, though some date it earlier.

  Mark begins with John the Baptist ([[Mark 1:1–8]]). Matthew begins further back, with Jesus’s ancestors and His conception, and the chapter answers two questions in turn: who Jesus is (the genealogy, verses 1–17) and how He came to be (verses 18–25). Luke tells the same beginnings largely from Mary’s side ([[Luke 1:26–38]]; [[Luke 2:1–7]]) and gives a genealogy of his own ([[Luke 3:23–38]]); Matthew tells them from Joseph’s.

thread: |
  Matthew 1 makes a claim and then seems to undercut it. The first verse calls Jesus “the son of David,” and the genealogy proves it, generation by generation, down to “Joseph the husband of Mary” (verse 16). Then the story reveals that Joseph is not the child’s father: Mary is “found with child of the Holy Ghost” (verse 18), and the angel says so plainly (verse 20).

  The chapter resolves the tension through Joseph himself. The angel calls him “thou son of David” and tells him to take Mary as his wife and to name the child. Joseph obeys, and by accepting and naming the child he makes Jesus his legal son and so an heir of David’s line (verses 24–25). Jesus is therefore David’s son through Joseph and God’s Son through His conception.

  The two names the chapter gives say what kind of king this is. “Jesus” is given because “he shall save his people from their sins” (verse 21), and “Emmanuel” means “God with us” (verse 23), a promise Matthew’s Gospel keeps until its last line.

sections:
  - range: 1-17
    heading: The genealogy of Jesus Christ
    plain: |
      This is the record of the ancestry of Jesus Christ, the descendant of David and of Abraham. Abraham was the father of Isaac, Isaac of Jacob, and Jacob of Judah and his brothers. Judah was the father of Pharez and Zarah by Tamar; Pharez of Hezron; Hezron of Ram; Ram of Amminadab; Amminadab of Nahshon; Nahshon of Salmon; Salmon of Boaz by Rahab; Boaz of Obed by Ruth; Obed of Jesse; and Jesse of David the king.

      David the king was the father of Solomon by the woman who had been the wife of Uriah. Solomon was the father of Rehoboam; Rehoboam of Abia; Abia of Asa; Asa of Jehoshaphat; Jehoshaphat of Joram; Joram of Ozias; Ozias of Jotham; Jotham of Ahaz; Ahaz of Hezekiah; Hezekiah of Manasseh; Manasseh of Amon; Amon of Josiah; and Josiah of Jechonias and his brothers, around the time the people were carried off to Babylon.

      After the exile to Babylon, Jechonias was the father of Shealtiel, and Shealtiel of Zerubbabel. Zerubbabel was the father of Abiud; Abiud of Eliakim; Eliakim of Azor; Azor of Sadoc; Sadoc of Achim; Achim of Eliud; Eliud of Eleazar; Eleazar of Matthan; Matthan of Jacob; and Jacob of Joseph, the husband of Mary. Mary was the mother of Jesus, who is called the Christ.

      So there were fourteen generations from Abraham to David, fourteen from David to the exile in Babylon, and fourteen from the exile to the Christ.
  - range: 18-24
    heading: The angel speaks to Joseph
    plain: |
      This is how the birth of Jesus Christ came about. His mother Mary was pledged in marriage to Joseph, and before they lived together she was found to be expecting a child by the Holy Ghost. Joseph her husband was a righteous man and did not want to shame her in public, so he decided to divorce her quietly.

      But while he was thinking this over, an angel of the Lord appeared to him in a dream and said, “Joseph, son of David, don’t be afraid to take Mary home as your wife, for the child conceived in her is from the Holy Ghost. She will give birth to a son, and you are to name Him Jesus, because He will save His people from their sins.”

      All this happened to fulfill what the Lord had said through the prophet: “The virgin will be with child and will give birth to a son, and they will call Him Immanuel,” which means “God with us.” When Joseph woke up, he did what the angel of the Lord had commanded him and took Mary home as his wife.
  - range: 25
    heading: Jesus is born and named
    plain: |
      But he had no marital relations with her until she had given birth to her firstborn son. And Joseph named Him Jesus.

notes:
  - ref: 1
    phrase: The book of the generation of Jesus Christ
    kind: words
    title: A book of beginnings
    body: |
      Matthew’s first words echo the Old Testament’s book of beginnings. In Greek they are *biblos geneseōs*, and they echo “the generations of” the heavens and the earth, of Adam, and of Noah ([[Gen. 2:4]]; [[Gen. 5:1]]; [[Gen. 6:9]]). A reader who knew Genesis would hear a new start announced in the old way.

      Matthew also turns the Genesis pattern around. The book of Adam’s generations lists his descendants; the book of Jesus’s generation lists His ancestors. The genealogy does not show what Jesus produced but where He came from, and whose promises He inherits.
    sources: [griffin-matthew-portrayal, lds-scriptures]
  - ref: 1
    phrase: the son of David, the son of Abraham
    kind: christ
    title: Son of David, son of Abraham
    body: |
      The first verse gives Jesus two titles that the rest of the Gospel unfolds. “Son of David” is Matthew’s royal title for Him: he uses it of Jesus nine times, where Mark and Luke have it three times each and John not at all. It carries the Lord’s covenant that David’s house and throne would be established forever ([[2 Sam. 7:12–16]]). David and the kings after him were anointed, and that is what the titles mean: *messiah* in Hebrew and *christos* in Greek are “anointed one.” When David’s line lost the throne at the Babylonian exile, the hope grew for an anointed king who would restore it. A claim like that had to be shown by descent: a priest had to show descent from Aaron, “the Messiah from David,” and every Jew from Abraham. Matthew opens his Gospel with exactly that kind of pedigree.

      “Son of Abraham” reaches further. Abraham was the father of the covenant, and the covenant promised that all the nations of the earth would be blessed in him ([[Gen. 12:3]]; [[Gen. 18:18]]). Matthew begins his list with Abraham, so the King of Israel is also the heir of a promise made for the whole world.
    sources: [griffin-matthew-portrayal, bd-genealogy, strathearn-matthew-editor, lds-scriptures]
  - ref: 3
    phrase: Phares and Zara of Thamar
    kind: history
    title: Four women in a list of fathers
    body: |
      Matthew’s list runs in the Old Testament way, father to son, yet he names four women before he comes to Mary: Tamar (verse 3), Rahab and Ruth (verse 5), and “her that had been the wife of Urias” (verse 6). Each has her story in the Old Testament ([[Gen. 38]]; [[Josh. 2]]; [[Ruth 4:13–17]]; [[2 Sam. 11]]).

      Why these four? One answer is that they came from outside Israel. Tamar and Rahab were Canaanites and Ruth a Moabite. Bathsheba is not named at all, and the scriptures say nothing of her own people; Matthew calls her by her tie to Uriah, who was a Hittite ([[2 Sam. 11:3]]), and that may be how she fits the pattern. Set in the ancestry of the son of David, they would show that Gentiles have a part in the Messiah’s coming, a note that may sound again in chapter 2, where wise men from the east come to worship the child, and that plainly sounds at the Gospel’s end, where the apostles are sent to “all nations” ([[Matt. 28:19]]). Another suggestion is that Matthew set Mary beside these women because they too were seen as sinners or outcasts.
    sources: [griffin-matthew-portrayal, strathearn-matthew-editor, lds-scriptures]
  - ref: 16
    phrase: Jacob begat Joseph the husband of Mary, of whom was born Jesus
    kind: history
    title: Joseph’s line, not Joseph’s son
    body: |
      Here the list’s pattern of “begat” stops. Jacob begat Joseph, but Joseph does not beget Jesus: he is “the husband of Mary, of whom was born Jesus.” In the Greek, “of whom” (*hēs*) is feminine, so it is Mary of whom Jesus was born. Matthew is preparing for what verse 18 will say outright.

      Why, then, trace Joseph’s line at all? Royal succession passed through the father, so Matthew tells the story from Joseph’s side. The angel addresses him as “Joseph, thou son of David” (verse 20) and tells him to name the child (verse 21). When Joseph takes Mary as his wife and names the boy (verses 24–25), he accepts Jesus as his own son in law, and so, as one Latter-day Saint study reads it, makes Him an heir of David’s throne.

      Luke’s genealogy is not the same. It climbs from Jesus up to Adam and to God, it names Joseph’s father as Heli ([[Luke 3:23]]), it has more names than Matthew’s between David and Zerubbabel, and nearly all its names are different. The “probable explanation” is that the two trace different lines: Matthew “gives a legal descent and includes several adopted children, such adoption carrying with it legal rights,” and Luke a natural descent through actual parentage. The explanation does not say how this accounts for Joseph’s having two fathers, Jacob in one list and Heli in the other.
    sources: [greek-nt, griffin-matthew-portrayal, bd-genealogy]
  - ref: 17
    phrase: So all the generations from Abraham to David are fourteen generations
    kind: structure
    title: Three fourteens
    body: |
      Matthew sums up his list in three equal parts, from Abraham to David, from David to the exile in Babylon, and from the exile to the Christ, and the pattern points to David. In the summary the only people named again, besides Abraham, are David and Christ.

      The number itself may point to David too. By a Hebrew practice called gematria, letters carry number values, and the consonants of David’s name (*dalet-vav-dalet*) add up to fourteen. It is possible that Matthew arranged the pedigree in fourteens on purpose, so that it repeats Jesus’s tie to King David three times. That is a proposal about Matthew’s design, not something he says.
    sources: [rsc-combs-ahaz-sign, griffin-matthew-portrayal]
  - ref: 18
    phrase: When as his mother Mary was espoused to Joseph, before they came together
    kind: history
    title: Espoused, yet husband and wife
    body: |
      To be “espoused” was far more binding than an engagement is now, which is why the next verses call Joseph “her husband” and Mary “thy wife” before they have lived together. A marriage came in two stages. The betrothal, arranged between the families, was the legally and religiously decisive one; the later celebration began the couple’s life together. Between the two the man and woman were husband and wife in law, a strict code of chastity was kept, and ending the betrothal took a legal divorce ([[Deut. 24:1]]).

      That is what made Mary’s pregnancy so grave. The law of Moses treated unfaithfulness by a betrothed woman as adultery, and it could be punished by death ([[Deut. 22:23–24]]).
    sources: [skinner-life-jesus]
  - ref: 19
    phrase: being a just man, and not willing to make her a publick example
    kind: history
    title: What a just man chose
    body: |
      Before any angel came, Joseph decided to end his betrothal to Mary quietly, with the bill of divorce the law provided ([[Deut. 24:1]]), a document later called a *get*. Matthew says only that he was “not willing to make her a publick example”; what he spared her was public disgrace and, as the note on verse 18 explains, possibly the law’s harshest penalty.

      Matthew sets the two side by side: Joseph was “a just man,” and he would not shame her. Only after Joseph had met that test of his character did the angel tell him to complete the marriage.
    sources: [skinner-life-jesus]
  - ref: 20
    phrase: that which is conceived in her is of the Holy Ghost
    kind: christ
    title: By the power of the Holy Ghost
    body: |
      The angel’s words settle what verse 16 implied: Joseph is not the child’s father, and the conception came about by God’s own agency. Restoration scripture says the same with more precision. Alma prophesied that Mary would be “a virgin, a precious and chosen vessel, who shall be overshadowed and conceive by the power of the Holy Ghost, and bring forth a son, yea, even the Son of God” ([[Alma 7:10]]). Nephi saw the virgin in vision, and then saw her “bearing a child in her arms,” the Son of the Eternal Father ([[1 Ne. 11:13–21]]; see also [[Mosiah 3:8]]).

      Latter-day Saints affirm the virgin birth, and they teach why it matters. President Russell M. Nelson put it plainly: “Jesus was born of an immortal Father and a mortal mother. From His immortal Father, Jesus inherited the power to live forever. From His mortal mother He inherited the fate of physical death.” That double inheritance begins with the conception Matthew describes.
    sources: [griffin-matthew-portrayal, nelson-christ-savior-born, skinner-life-jesus, lds-scriptures]
  - ref: 21
    phrase: 'thou shalt call his name JESUS: for he shall save his people from their sins'
    kind: words
    title: Named for what He would do
    body: |
      The angel gives a reason for the name, “for he shall save,” and the reason works only in Hebrew. *Jesus* is the Greek form of Joshua (*Yehoshua*), a name taken to mean “Yahweh is salvation,” or more simply “God is help” or “Savior.” In English or Greek the name and the reason have nothing to do with each other. In Hebrew the name says what the child will do.

      It was not a rare name. Joshua the son of Nun bears it in the Greek of the New Testament, where the King James Version prints “Jesus” ([[Acts 7:45]]; [[Heb. 4:8]]), and other Jews of the time were called by it. What sets this child apart is the angel’s reason: He will save “his people from their sins.”
    sources: [griffin-matthew-portrayal, bd-jesus]
  - ref: 22
    phrase: that it might be fulfilled which was spoken of the Lord by the prophet
    kind: scripture
    title: What Matthew means by fulfilled
    body: |
      Here, for the first time, Matthew stops his story to say that something happened “that it might be fulfilled” which a prophet had spoken. He uses such a formula as many as fourteen times, eight of them for Isaiah, and no other Gospel writer leans on it so insistently. The prophecy here is [[Isa. 7:14]], and in Isaiah it was a sign given to King Ahaz about events in his own lifetime. Who the child of Ahaz’s day was is a riddle that the site’s notes on [[Isa. 7:14]] take up, with the Hebrew word behind “virgin.”

      So “fulfilled” in Matthew does not always mean a prediction coming true. In the New Testament the word can mean an event foretold exactly, the completion of something begun in the past, or the consummation of a covenant promise, and Matthew does not say which he means. On one reading, a prophecy can be fulfilled in part in its own day and more fully later, without the later fulfillment cancelling the first. Ahaz received his sign; Matthew sees in Jesus’s birth the fullness of what it promised to David’s house.
    sources: [millet-js-matthew, rsc-combs-ahaz-sign, frederick-use-of-ot]
  - ref: 23
    phrase: Emmanuel, which being interpreted is, God with us
    kind: christ
    title: God with us, to the end
    body: |
      Matthew translates the name for his readers because its meaning is his message. For Ahaz, Immanuel was a sign that the rule of David’s house would not end with him. For Matthew, Jesus is not one more Davidic king who reigns until he dies or is conquered; as “God with us,” He is the King in whom the promise of a throne “established for ever” ([[2 Sam. 7:16]]) can be kept. The Hebrew of the name is explained in the note on [[Isa. 7:14]].

      The promise also frames the whole Gospel. Its first fulfillment passage names Jesus “God with us,” and its last words are His: “lo, I am with you alway, even unto the end of the world” ([[Matt. 28:20]]). The sermons, miracles and meetings in between show Him being what this name says.
    sources: [rsc-combs-ahaz-sign, griffin-matthew-portrayal]
  - ref: 25
    phrase: knew her not till she had brought forth her firstborn son
    kind: history
    title: Mary’s other children
    body: |
      “Knew” is the Bible’s word for marital relations, as in “Adam knew Eve his wife; and she conceived” ([[Gen. 4:1]]). Matthew says Joseph and Mary kept the chastity of their betrothal until Jesus was born.

      “Till” and “firstborn” describe the time before Jesus’s birth and do not by themselves settle what came after. Matthew later names Jesus’s brothers James, Joses, Simon and Judas, and mentions His sisters ([[Matt. 13:55–56]]), and in the Church’s reading these “were children of Joseph and Mary, born after Jesus’ birth.”
    sources: [skinner-life-jesus, bd-brethren-of-the-lord]

christ: |
  Matthew’s first chapter gives Jesus three titles and two names. The titles, Christ, son of David and son of Abraham, say He is the anointed King the covenants promised. The names say what kind of King: Jesus, because He will “save his people from their sins” (verse 21), and Emmanuel, “God with us” (verse 23), a promise He renews in the Gospel’s last words, “I am with you alway” ([[Matt. 28:20]]).

  The salvation His name promises is from sin, not in it: the Lord came “not … to redeem them in their sins, but to redeem them from their sins,” with power to do so “because of repentance” ([[Hel. 5:10–11]]). His name does its work in a disciple’s life through repentance, and the promise of His presence is made to those who go on teaching what He commanded.

explore: |
  - **Luke’s beginnings, from Mary’s side.** Read [[Luke 1:26–38]], [[Luke 2:1–7]] and Luke’s genealogy in [[Luke 3:23–38]] beside this chapter.
  - **The virgin and her Son in the Book of Mormon.** [[1 Ne. 11:13–21]], [[Mosiah 3:8]] and [[Alma 7:10]].
  - **The women of the genealogy.** Their stories are in [[Gen. 38]], [[Josh. 2]], [[Ruth 4:13–22]] and [[2 Sam. 11–12]].
  - **Isaiah’s sign in its own setting.** [[Isa. 7:1–16]] and the notes there.

