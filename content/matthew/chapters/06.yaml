chapter: 6
title: In Secret, and Without Anxiety
tagline: Jesus teaches His disciples to give, pray and fast for the Father who sees in secret, gives them the Lord’s Prayer as a pattern, and tells them to lay up treasure in heaven and trust the Father who knows what they need.
when: 'Early in Jesus’s ministry in Galilee, in the middle of the Sermon on the Mount'

setting: |
  Matthew 6 is the middle of the Sermon on the Mount, which began when Jesus, seeing the multitudes, went up into a mountain and His disciples came to Him ([[Matt. 5:1]]). It is the first of Matthew’s five great discourses (see the setting of [[Matt. 5]]). The sermon is addressed to the disciples rather than to the crowd at large, and the Joseph Smith Translation of 7:1 says so outright: Jesus was teaching His disciples what they “should say unto the people.”

  Chapter 5 set the higher righteousness beside “it was said by them of old time.” Chapter 6 turns to what a disciple does with that righteousness: giving to the poor, praying and fasting, and then money, food and clothing, the things a household worries about. The Lord’s Prayer stands at its center.

  The risen Lord gave nearly the same words to the Nephites at the temple in Bountiful ([[3 Ne. 13]]), and where the two differ, the difference sometimes answers a question about Matthew’s verse. The Gospel Library’s appendix also prints four passages of the chapter as Joseph Smith revised them.

thread: |
  **Worship done for the Father alone, and trust in the Father who already knows.**

  The chapter turns on the Father, named again and again. In verses 1–18 Jesus takes three acts of devotion, almsgiving, prayer and fasting, and asks of each the same question: who is watching? The hypocrites give, pray and fast to be seen, and being seen is all the reward they get. Jesus tells the disciple to do the same things in private, without desire for recognition, before the Father “which seeth in secret.” The prayer Jesus gives in the middle of that teaching is the pattern of a child speaking to a Father who already knows what is needed (verse 8).

  The second half carries the same question from religion into money. Treasure laid up on earth, an eye that is single or evil, and the impossibility of serving two masters belong together, for the “evil eye” of that day was the eye of greed. And for hearers who lived at the level of survival, the closing verses ask the hardest thing of all: to trust that the Father who feeds the birds and clothes the grass will provide for them, and to seek His kingdom first.

sections:
  - range: 1-4
    heading: Giving in secret
    plain: |
      Be careful not to do your good works in front of people so that they will see you; if you do, you have no reward from your Father in heaven. So when you give to the poor, do not blow a trumpet about it, as the hypocrites do in the synagogues and the streets so that people will praise them. Truly, they already have their reward. But when you give, do not let your left hand know what your right hand is doing, so that your giving is in secret; and your Father, who sees in secret, will reward you openly.
  - range: 5-8
    heading: Praying in secret
    plain: |
      When you pray, do not be like the hypocrites, who love to stand and pray in the synagogues and on the street corners so that people will see them. Truly, they already have their reward. But when you pray, go into your inner room, shut the door, and pray to your Father, who is in secret; and your Father, who sees in secret, will reward you openly. And when you pray, do not babble on with empty words as the heathen do, who think they will be heard because they say so much. Do not be like them, for your Father knows what you need before you ask Him.
  - range: 9-15
    heading: The Lord’s Prayer
    plain: |
      Pray, then, in this way: Our Father in heaven, may your name be kept holy. May your kingdom come; may your will be done on earth as it is in heaven. Give us today the bread we need. Forgive us our debts, as we forgive those who owe us. Do not bring us into temptation, but rescue us from evil. For the kingdom, the power and the glory are yours forever. Amen. For if you forgive others their wrongs, your Father in heaven will forgive you too; but if you do not forgive others, neither will your Father forgive your wrongs.
  - range: 16-18
    heading: Fasting in secret
    plain: |
      When you fast, do not put on a gloomy face as the hypocrites do; they make their faces unsightly so that people will see they are fasting. Truly, they already have their reward. But when you fast, put oil on your head and wash your face, so that your fasting is seen not by people but by your Father, who is in secret; and your Father, who sees in secret, will reward you openly.
  - range: 19-24
    heading: Treasure, the eye, and two masters
    plain: |
      Do not store up treasures for yourselves on earth, where moths and decay destroy them and thieves dig through the walls and steal. Store up treasures for yourselves in heaven, where neither moth nor decay destroys and thieves do not break in and steal. For where your treasure is, your heart will be there too. The eye is the lamp of the body. If your eye is single and sound, your whole body will be full of light; but if your eye is evil, your whole body will be full of darkness. And if the light in you is darkness, how deep that darkness is! No one can be a servant to two masters: either he will hate the one and love the other, or he will hold to the one and despise the other. You cannot serve God and wealth.
  - range: 25-34
    heading: Do not be anxious
    plain: |
      So I tell you, do not be anxious about your life, what you will eat or drink, or about your body, what you will wear. Is not life more than food, and the body more than clothing? Look at the birds: they do not sow or reap or gather into barns, and yet your heavenly Father feeds them. Are you not worth much more than they are? Which of you, by worrying, can add a single cubit to your height? And why worry about clothing? Look at how the lilies of the field grow. They do not work or spin, yet I tell you that not even Solomon in all his splendor was dressed like one of them. If God so clothes the grass of the field, which is here today and thrown into the oven tomorrow, will He not much more clothe you, you of little faith? So do not worry, saying, “What will we eat?” or “What will we drink?” or “What will we wear?” The Gentiles run after all these things, and your heavenly Father knows that you need them. But seek first the kingdom of God and His righteousness, and all these things will be given to you as well. So do not worry about tomorrow, for tomorrow will take care of itself. The day’s own evil is enough for it.

notes:
  - ref: 2
    phrase: do not sound a trumpet before thee
    kind: history
    title: Giving without the applause
    body: |
      Jesus asks His disciples to give in a way their world would have found strange: without being seen. In the Mediterranean world of His day a gift was supposed to be acknowledged in public. Cities thanked their benefactors with proclamations, seats of honor at the theater, inscriptions, and now and then a statue, and even a small personal gift expected a public word of thanks. To give while hiding the gift, so that the left hand does not know what the right is doing, would have been shocking: it set aside the very reason people gave alms.

      The trumpet is very likely a figure of speech. Commentators have found no trace in Jewish writings of a trumpet blown before a giver, and one sounding in a synagogue is hard to credit. Jesus means what we mean when we say someone blows his own trumpet: a parade of generosity that summons people to look and admire. That applause is the whole of what such a giver receives: “They have their reward.”
    sources: [hardison-sociocultural, ellicott-matthew]
  - ref: 4
    phrase: thy Father which seeth in secret
    kind: christ
    title: The Father who sees in secret
    body: |
      The Father who is “in secret” and sees “in secret” (verses 4, 6, 18) is hidden from us, and still He sees and rewards. The phrase may be another way of saying that He is “in heaven,” or it may point to the veil between us and Him, as in the Lord’s words in latter-day revelation, “I am in your midst and ye cannot see me” ([[D&C 38:7]]). Either way, Jesus uses it to make worship personal: alms, prayer and fasting are done before the One who sees, not before the many who would praise.

      Jesus lived what He taught here. He worked many miracles in front of crowds, but not to win followers or make a spectacle, and He usually told those He healed to tell no one. When His brethren urged Him to show Himself to the world at the Feast of Tabernacles ([[John 7:3–4]]), He would not go on those terms, just as He had refused the devil’s invitation to leap from the pinnacle of the temple and be rescued in view of all ([[Matt. 4:5–7]]).
    sources: [ludlow-father-sermon, lds-scriptures]
  - ref: 7
    phrase: use not vain repetitions
    kind: words
    title: Vain repetitions
    body: |
      The Greek verb translated “vain repetitions,” *battologeō*, describes babbling: in its first sense it means to stammer, and since stammerers repeat the same sounds, it came to mean repeating the same things over and over, using many idle words. The word probably imitates the sound of babbling. Jesus explains the word Himself in the same verse: the heathen think “they shall be heard for their much speaking.” What He forbids is trusting in the number of words to win a hearing.

      The verse also shapes how Latter-day Saints use the prayer that follows. Jesus told His followers to avoid vain repetitions and to pray “after this manner,” and so, as Elder Russell M. Nelson taught, the Lord’s Prayer is “a pattern to follow and not … a piece to memorize and recite repetitively.”
    sources: [thayer, nelson-lords-prayers]
  - ref: 8
    phrase: your Father knoweth what things ye have need of, before ye ask him
    kind: scripture
    title: Why ask, if He already knows?
    body: |
      If the Father already knows what we need, prayer is not for informing Him or changing His mind. “The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant but that are made conditional on our asking for them.” Prayer is the act by which the will of the Father and the will of the child are brought into harmony, and it becomes natural once we know that He is our Father and we are His children ([[Matt. 7:7–11]]).

      So verse 8 is not a reason to stop asking. It is the reason the disciple need not babble: the Father is already willing to give.
    sources: [bd-prayer]
  - ref: 9
    phrase: After this manner therefore pray ye
    kind: scripture
    title: A pattern, given again at Bountiful
    body: |
      The Lord’s Prayer is a pattern rather than a fixed text (see the note on verse 7), and when the risen Lord gave it again at the temple in Bountiful it was not word for word the same. He began with the same words, “After this manner therefore pray ye” ([[3 Ne. 13:9]]), but the prayer that followed has no “Thy kingdom come” and no request for daily bread ([[3 Ne. 13:9–13]]).

      One Latter-day Saint reading explains both omissions by the setting. There was no need at Bountiful to pray “Thy kingdom come,” for God’s kingdom had already come, in heaven through Christ’s victory over death and on earth that day in the people’s midst. If the bread of the prayer looks forward to the feast of the coming kingdom (see the note on verse 11), He may have thought that petition out of place too, where He stood among them risen. That is one scholar’s proposal, not a teaching of the Church.
    sources: [nelson-lords-prayers, welch-sermon-differences, lds-scriptures]
  - ref: 11
    phrase: our daily bread
    kind: words
    title: Daily bread
    body: |
      “Daily” translates a Greek word, *epiousios*, whose meaning is uncertain, because it is found nowhere but this verse and Luke’s form of the prayer ([[Luke 11:3]]). Origen, an early Christian writer, reported that it was not used in ordinary speech, so it seems to have been coined by the Gospel writers themselves.

      One strong reading is “food for the morrow”: the food needed, enough to get from one day to the next. Then *epiousios* and “this day” answer each other, and the petition fits the end of the chapter, “Take therefore no thought for the morrow” (verse 34): the disciple asks God for tomorrow’s bread so as to be freed from worrying about it. One of the earliest interpretations heard the same “morrow” on a larger scale, as the great “Tomorrow,” the end of the world, and so took the bread as the bread of life rather than earthly bread.

      Elder Russell M. Nelson taught that the request for daily bread “includes a need for spiritual nourishment as well,” from the Jesus who called Himself the bread of life and promised, “he that cometh to me shall never hunger” ([[John 6:35]]).
    sources: [thayer, welch-sermon-differences, nelson-lords-prayers]
  - ref: 12
    phrase: forgive us our debts
    kind: words
    title: Debts and trespasses
    body: |
      The Greek of verse 12 says, literally, “debts” and “debtors,” and the King James Version keeps the word; the Greek word for “debts” could also mean offenses, faults or sins. Two verses later Jesus uses a different word, “trespasses” (verses 14–15), meaning a sin or misdeed.

      Joseph Smith’s translation reads “forgive us our trespasses, as we forgive those who trespass against us,” as William Tyndale’s English New Testament had done long before. That reading brings the prayer into line with verses 14 and 15. “Trespasses” is a figurative meaning of the Greek word in verse 12 rather than its first one, but it carries the petition beyond the picture of a mortal obligation, like a loan, to an eternal one. Either way the petition binds the one who prays: the forgiveness asked for is measured by the forgiveness given.
    sources: [lefevre-jst-sermon, nelson-lords-prayers]
  - ref: 13
    phrase: lead us not into temptation
    kind: scripture
    title: Lead us not into temptation
    body: |
      “Lead us not into temptation” can sound as if God might lead someone into sin. Joseph Smith’s translation removes that reading: “And suffer us not to be led into temptation, but deliver us from evil” (JST Matt. 6:14), and the appendix heading states the point plainly: “The Lord does not lead us into temptation.” Elder Russell M. Nelson called the change helpful, “for surely we would not be led into temptation by Deity,” and set it beside the Lord’s words in Gethsemane: “Watch and pray, that ye enter not into temptation” ([[Matt. 26:41]]).

      The Gospel Library’s footnote gives a similar reading from the Syriac, an ancient translation: “do not let us enter into temptation.” No Greek manuscript has the change. Joseph Smith’s corrections came by the Spirit, not from weighing manuscripts, and here an ancient version happens to agree with him.
    sources: [jst-matt-6, nelson-lords-prayers, lefevre-jst-sermon]
  - ref: 13
    phrase: 'For thine is the kingdom, and the power, and the glory, for ever. Amen.'
    kind: history
    title: The closing words of praise
    body: |
      A reader who compares Bibles will notice that many modern translations end the Lord’s Prayer at “deliver us from evil.” The earlier Greek manuscripts of Matthew have no *doxology*, or closing words of praise, and neither does Luke’s form of the prayer ([[Luke 11:4]]); most textual critics think the words were added to Matthew’s text later.

      The Book of Mormon bears on the question, for it includes the doxology in the prayer the risen Lord gave at Bountiful: “For thine is the kingdom, and the power, and the glory, forever. Amen” ([[3 Ne. 13:13]]). Whether Matthew’s text first had the words cannot be known, but Jesus very probably closed His prayers with praise of some kind: a Jewish prayer of His day that ended on the word “temptation” would have been highly irregular. In sacred matters in the temple, too, one did not simply answer “Amen.” That may be why the prayer given at the temple in Bountiful has the doxology, while Jesus’s instruction in Luke 11, given in the open, does not. The words themselves seem to follow a traditional form: David’s blessing before the congregation, “thine is the kingdom” ([[1 Chr. 29:11]]).

      Joseph Smith’s translation keeps the doxology and ends it “forever and forever. Amen.”
    sources: [welch-sermon-greek, lds-scriptures, lefevre-jst-sermon]
  - ref: 14
    phrase: if ye forgive men their trespasses
    kind: prophets
    title: Forgiven as we forgive
    body: |
      Of all the petitions in the prayer, Jesus comes back to only one: forgiveness. Verses 14 and 15 make the condition in verse 12 explicit, in both directions. Latter-day revelation says it the same way: “inasmuch as you have forgiven one another your trespasses, even so I, the Lord, forgive you” ([[D&C 82:1]]). As Elder Russell M. Nelson summed it up, “if one is to be forgiven, one must first forgive.”

      That can feel like more than a hurt person can do, and prophets have spoken to that. To anyone who nurtures enmity toward another, Elder Gordon B. Hinckley pleaded: “ask the Lord for strength to forgive. This expression of desire will be of the very substance of your repentance. It may not be easy, and it may not come quickly.” The peace that comes when it does, he taught, is the peace of the One who spoke these verses.
    sources: [nelson-lords-prayers, hinckley-required-to-forgive, lds-scriptures]
  - ref: 17
    phrase: anoint thine head, and wash thy face
    kind: history
    title: Anoint thine head, and wash thy face
    body: |
      Jesus tells the one who fasts to do the opposite of what fasting usually looked like. The Day of Atonement appears to be the only fast the law of Moses commanded, but by Jesus’s day fasting had become a regular custom ([[Luke 18:12]]). It was a way of showing sorrow, and it often came with other signs: torn clothes, sackcloth, and leaving the face unwashed and the head unanointed ([[2 Sam. 12:20]]; [[Isa. 58:5]]). Such signs could easily become a show, and the prophets had already warned of that ([[Isa. 58:3–7]]).

      To wash and anoint was to look, as verse 18 says, as though one were not fasting at all. The fast is real, but only the Father sees it.
    sources: [bd-fasts, lds-scriptures]
  - ref: 22
    phrase: if therefore thine eye be single
    kind: words
    title: A single eye
    body: |
      “Single” translates *haplous*, simple or undivided, literally “without folds”; said of an eye, it means sound or healthy, doing its work. In the speech of Jesus’s day the eye also carried a moral meaning. A “good eye” was a generous one, and an “evil eye” (verse 23) was an idiom for envy and greed: the person with an evil eye was miserly and stingy. So the saying fits where it stands, between treasure on earth (verses 19–21) and the impossibility of serving God and mammon (verse 24). The eye that looks on wealth with greed fills the whole person with darkness.

      Joseph Smith’s translation names what the eye is to be single to: “if therefore thine eye be single to the glory of God, thy whole body shall be full of light.” The Greek word suggests singleness of purpose, and the translation says what that purpose is.
    sources: [thayer, hardison-sociocultural, jst-matt-6, lefevre-jst-sermon]
  - ref: 24
    phrase: Ye cannot serve God and mammon
    kind: words
    title: God and mammon
    body: |
      “Mammon” is an Aramaic word for riches, apparently from a root meaning to trust: what a person relies on. Jesus personifies it here as a master set against God. The picture would have been familiar to His hearers, among whom it was common for a client to have several patrons. If two patrons were rivals, the client had to choose, loyal to one and disloyal to the other, and so it would be for anyone who tried to be the client of God and of wealth at once.

      The saying is not only about money. It asks what a person loves and serves most, and it leads directly into the call to seek first the kingdom of God (see the note on verse 33).
    sources: [thayer, hardison-sociocultural, lane-kingdom-god]
  - ref: 25
    phrase: Take no thought for your life
    kind: scripture
    title: Take no thought
    body: |
      “Take no thought” means: do not be anxious. The Greek verb, *merimnaō*, means to be anxious, troubled with cares, here about keeping oneself alive. The command was hard for its first hearers: peasants lived at the level of survival, and for them a drought, locusts or a failed crop could mean ruin.

      Both 3 Nephi and the Joseph Smith Translation say whom the verses were especially spoken to. At Bountiful, Jesus at this point “looked upon the twelve whom he had chosen” and reminded them that they were chosen “to minister unto this people,” so that verses 25–34 there are addressed to the Twelve alone ([[3 Ne. 13:25]]). Joseph Smith’s translation adds a commission before the verse: “Go ye into the world, and care not for the world; for the world will hate you,” followed by the promise that they would go from house to house teaching, that the Lord would go before them, and that “your heavenly Father will provide for you” (JST Matt. 6:25–27). The promise of food and clothing was given so that those sent out could finish their missions.
    sources: [thayer, hardison-sociocultural, lds-scriptures, welch-sermon-differences, jst-matt-6, lefevre-jst-sermon]
  - ref: 27
    phrase: add one cubit unto his stature
    kind: words
    title: One cubit unto his stature
    body: |
      A cubit is an odd thing to want to add to one’s height, and the Greek word suggests why. *Hēlikia* can mean “stature,” as when Zacchaeus was “little of stature” ([[Luke 19:3]]), but its first meaning is age or time of life, and here it can be read as the length of a life. Then Jesus is asking who, by worrying, can add even a little to the span of his days, which is exactly the anxiety about food and life that verse 25 addresses. Both readings are defended, and the King James translators chose “stature”; either way the point is that anxiety adds nothing.
    sources: [thayer]
  - ref: 33
    phrase: seek ye first the kingdom of God, and his righteousness
    kind: scripture
    title: Seek ye first
    body: |
      Jesus does not tell His disciples that food and clothing do not matter; the Father knows they need them (verse 32). He tells them what comes first, and seeking the kingdom first changes how they live with their own needs and their neighbors’. Jacob taught the Nephites the same order and showed what the change looks like: “before ye seek for riches, seek ye for the kingdom of God,” and once they had a hope in Christ they would seek riches “for the intent to do good—to clothe the naked, and to feed the hungry” ([[Jacob 2:18–19]]).

      Joseph Smith’s translation turns the verse from a priority into work to be done: “seek not the things of this world but seek ye first to build up the kingdom of God, and to establish his righteousness” (JST Matt. 6:38). The wording is close to revelations Joseph Smith had received before he translated Matthew: “seek to bring forth and establish the cause of Zion” ([[D&C 6:6]]).
    sources: [lane-kingdom-god, lds-scriptures, jst-matt-6, lefevre-jst-sermon]

christ: |
  Matthew 6 shows Jesus Christ as the Son who reveals the Father: the Father who sees in secret, knows what His children need before they ask, and feeds the birds and clothes the grass. The prayer He gave is still the pattern: “Our prayers follow patterns and teachings of the Lord Jesus Christ. He taught us how to pray.” Praying by it now means asking for God’s help “while we strive constantly to resist evil and live righteously,” and asking to be forgiven only as we forgive.

explore: |
  - **The same chapter at Bountiful.** [[3 Ne. 13]], with a prayer that has no “Thy kingdom come” and a turn to the Twelve at verse 25.
  - **Luke’s settings.** The prayer taught when a disciple asked, [[Luke 11:1–4]]; the birds and the lilies, [[Luke 12:22–34]].
  - **Riches and the kingdom in the Book of Mormon.** [[Jacob 2:17–19]].
  - **An eye single to God’s glory in latter-day revelation.** [[D&C 4:5]]; [[D&C 88:67]].
  - Elder Russell M. Nelson’s general conference talk “Lessons from the Lord’s Prayers” (April 2009) reads the Lord’s Prayer beside the Savior’s other prayers.

