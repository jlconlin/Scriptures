chapter: 21
title: The King Comes to His Temple
tagline: Jesus rides into Jerusalem as the meek King of Zechariah's prophecy, clears the temple and heals in it, curses a fig tree with leaves and no fruit, and answers the rulers who ask by what authority He acts with a question about John and two parables of a vineyard.
when: 'Jerusalem and the road from Bethany, in the last week before the crucifixion. Matthew tells it as two days: the entry and the clearing of the temple on the first, the fig tree and the rulers'' challenge the next morning. Talmage places the entry on the Sunday and the challenge on the Tuesday'

setting: |
  Matthew 21 opens the last week of Jesus's mortal life. Jerusalem was crowded: pilgrims came up days before the Passover to purify themselves and offer their sacrifices, and many wondered whether Jesus would dare appear while the rulers were plotting to take Him. He came openly, riding down from the Mount of Olives into the city.

  All four Gospels tell the entry ([[Mark 11:1–11]]; [[Luke 19:28–44]]; [[John 12:12–19]]), and Mark and Luke tell the clearing of the temple, the challenge to Jesus's authority and the parable of the vineyard. Matthew's order is his own. Mark has Jesus only look around the temple on the first evening and clear it the next day, with the cursing of the fig tree before and its withering after; Matthew puts the clearing straight after the entry and has the tree wither at once. In Matthew the entry and the clearing read as one royal act, and the rulers' challenge comes the morning after the barren tree. Matthew alone has the healing of the blind and lame in the temple, the children's hosannas and the parable of the two sons.

  John places a clearing of the temple at the beginning of the ministry ([[John 2:13–17]]); Latter-day Saint writers take the two as separate clearings, the first near the start of His ministry and the second in its last week.

thread: |
  **The King claims His city and His house, and the question of the chapter is by what authority.**

  Jesus plans His entry so that it says what He is: the Mount of Olives, the donkey of Zechariah's prophecy, the psalm the crowds sing. Then He goes into the temple and calls it “my house,” drives out those who traded there, and heals the blind and the lame, whom an old saying had barred from “the house” ([[2 Sam. 5:8]]). These are acts by which He asserts a king's authority over the temple, and the chief priests and elders come the next morning to ask the obvious question: “By what authority doest thou these things?”

  Jesus does not answer in words they can use against Him. He asks about John the Baptist instead, and then tells three stories (the third is in [[Matt. 22]]). The two sons ask who actually does the Father's will. The vineyard tells the history of Israel's leaders and the prophets they rejected, ending with the owner's son killed and cast out. Then Jesus quotes the same psalm the crowds had sung on Sunday, but a different verse: the stone the builders rejected. The answer to “by what authority” is the Son, and in the Joseph Smith Translation Jesus says it outright: “I am the stone.”

sections:
  - range: 1-11
    heading: The King rides into Jerusalem
    plain: |
      As they came near Jerusalem and reached Bethphage on the Mount of Olives, Jesus sent two disciples ahead. “Go into the village in front of you,” He told them, “and at once you will find a donkey tied there, with her colt beside her. Untie them and bring them to me. If anyone says anything to you, tell him, ‘The Lord needs them,’ and he will send them right away.” This happened to fulfill what the prophet had said: “Tell the daughter of Zion, ‘Look, your King is coming to you, gentle, and riding on a donkey, on a colt, the foal of a donkey.’” The disciples went and did as Jesus told them. They brought the donkey and the colt, laid their cloaks on them, and set Him on them. A very large crowd spread their cloaks on the road, and others cut branches from the trees and spread them on the road. The crowds going ahead of Him and those following shouted, “Hosanna to the Son of David! Blessed is He who comes in the name of the Lord! Hosanna in the highest!” When He entered Jerusalem the whole city was stirred, asking, “Who is this?” And the crowds kept saying, “This is Jesus, the prophet from Nazareth in Galilee.”
  - range: 12-17
    heading: The King in His house
    plain: |
      Jesus went into the temple of God and drove out all who were selling and buying there. He overturned the tables of the money changers and the seats of those selling doves, and said to them, “It is written, ‘My house shall be called a house of prayer,’ but you are making it a den of robbers.” The blind and the lame came to Him in the temple, and He healed them. When the chief priests and the scribes saw the wonderful things He did, and the children shouting in the temple, “Hosanna to the Son of David,” they were indignant. “Do you hear what these children are saying?” they asked Him. “Yes,” Jesus answered. “Have you never read, ‘Out of the mouths of children and infants you have perfected praise’?” Then He left them and went out of the city to Bethany, and spent the night there.
  - range: 18-22
    heading: The fig tree with leaves only
    plain: |
      Early the next morning, as He was going back to the city, He was hungry. Seeing a fig tree by the road, He went up to it and found nothing on it but leaves. He said to it, “May no fruit ever grow on you again!” And immediately the tree withered. When the disciples saw it they were amazed. “How did the fig tree wither so quickly?” they asked. Jesus answered, “I tell you the truth: if you have faith and do not doubt, not only can you do what was done to the fig tree, but even if you say to this mountain, ‘Be lifted up and thrown into the sea,’ it will be done. Whatever you ask for in prayer, believing, you will receive.”
  - range: 23-27
    heading: By what authority?
    plain: |
      Jesus went into the temple, and while He was teaching, the chief priests and the elders of the people came to Him. “By what authority are you doing these things?” they asked. “And who gave you this authority?” Jesus replied, “I will ask you one question too. If you answer me, I will tell you by what authority I do these things. John's baptism: where did it come from? Was it from heaven, or from men?” They argued it out among themselves: “If we say, ‘From heaven,’ he will ask us, ‘Then why didn't you believe him?’ But if we say, ‘From men,’ we are afraid of the crowd, for they all hold that John was a prophet.” So they answered Jesus, “We don't know.” And He said to them, “Neither will I tell you by what authority I do these things.”
  - range: 28-32
    heading: The two sons
    plain: |
      “What do you think? A man had two sons. He went to the first and said, ‘Son, go and work today in the vineyard.’ ‘I don't want to,’ he answered, but later he changed his mind and went. Then the father went to the other son and said the same thing. He answered, ‘I will, sir,’ but he did not go. Which of the two did what his father wanted?” “The first,” they said. Jesus said to them, “I tell you the truth: the tax collectors and the prostitutes are going into the kingdom of God ahead of you. For John came to you showing the way of righteousness, and you did not believe him, but the tax collectors and the prostitutes did. And even after you saw that, you did not change your minds and believe him.”
  - range: 33-46
    heading: The tenants of the vineyard
    plain: |
      “Listen to another parable. There was a landowner who planted a vineyard. He put a wall around it, dug a winepress in it, and built a watchtower. Then he rented it to tenant farmers and went away to another country. When harvest time came near, he sent his servants to the tenants to collect his share of the fruit. The tenants seized his servants; they beat one, killed another, and stoned a third. Then he sent other servants, more than the first time, and the tenants treated them the same way. Last of all he sent his son to them. ‘They will respect my son,’ he said. But when the tenants saw the son, they said to each other, ‘This is the heir. Come, let's kill him and take his inheritance.’ So they took him, threw him out of the vineyard, and killed him. Now when the owner of the vineyard comes, what will he do to those tenants?” They answered, “He will destroy those wicked men miserably, and he will rent the vineyard to other tenants, who will give him his share of the fruit at harvest time.” Jesus said to them, “Have you never read in the scriptures: ‘The stone the builders rejected has become the head of the corner; this was the Lord's doing, and it is marvelous in our eyes’? Therefore I tell you, the kingdom of God will be taken away from you and given to a people who will produce its fruit. Whoever falls on this stone will be broken to pieces, but anyone on whom it falls will be crushed.” When the chief priests and the Pharisees heard His parables, they knew He was talking about them. They wanted to arrest Him, but they were afraid of the crowds, because the people held Him to be a prophet.

notes:
  - ref: 1
    phrase: were come to Bethphage, unto the mount of Olives
    kind: history
    title: An entry planned to be read
    body: |
      Jesus chose how He would enter Jerusalem, and the choices were meant to be understood. Until now He had guarded every hint that He was the Christ and turned away every attempt to honor Him as a national leader; here He accepts kingly and messianic titles in public, “an open and official proclamation of His divine investiture.” It was “no accidental or fortuitous happening”: He sent for the animals Himself and “knew beforehand what would be, and what He would do.”

      The place and the animal both recalled Israel's kings. When David fled from Absalom he went up the Mount of Olives weeping ([[2 Sam. 15:30]]); Jesus came the other way, down the same mountain into the city. Solomon was made king riding David's mule down to Gihon while the people shouted “God save king Solomon” ([[1 Kgs. 1:33–40]]). And Zechariah had pictured the Lord standing on the Mount of Olives in the last day ([[Zech. 14:4]]), when there would be “no more the Canaanite in the house of the Lord” ([[Zech. 14:21]]), a line that can be translated “no longer … traders.” One Latter-day Saint reading sees Jesus following Zechariah's three steps in these days: He arrives on the Mount of Olives, pronounces judgment on Israel, and enters Jerusalem and cleanses the temple. The triumphal entry was one of the few times in His ministry that Jesus was openly received as the Messiah He was, and it looks ahead to His return as King of kings.
    sources: [talmage-jesus-christ-29, huntsman-palm-sunday]
  - ref: 5
    phrase: thy King cometh unto thee, meek, and sitting upon an ass
    kind: scripture
    title: Zechariah's lowly King
    body: |
      Matthew joins a line of Isaiah, “Say ye to the daughter of Zion” ([[Isa. 62:11]]), to Zechariah's prophecy of a King who comes “lowly, and riding upon an ass” ([[Zech. 9:9]]). The site's notes on [[Zech. 9:9]] explain the Hebrew word behind “lowly” and why a king might ride a donkey at all.

      What Matthew wants his reader to see is a King who comes in peace. Jesus rode an ass “in token of peace,” not “on a caparisoned steed with the panoply of combat.” The Roman garrison, quick to crush any would-be Messiah, did nothing: they “saw nothing to fear, perhaps much to smile at, in the spectacle of a King mounted upon an ass,” followed by subjects who carried branches, not weapons. The Romans apparently did not take the procession as a threat, and the Jewish leaders, seeing how popular He was, were wary of arresting Him in public.
    sources: [lds-scriptures, talmage-jesus-christ-29, huntsman-palm-sunday]
  - ref: 7
    phrase: brought the ass, and the colt
    kind: scripture
    title: Two animals, one rider
    body: |
      Matthew alone mentions both the donkey and her colt; Mark, Luke and John speak of the colt only ([[Mark 11:7]]; [[Luke 19:35]]; [[John 12:14]]). Did Jesus ride both? The Joseph Smith Translation says no: the disciples “brought the colt, and put on it their clothes; and Jesus took the colt and sat thereon; and they followed him” (JST Matt. 21:5, in the footnotes).

      The mother most likely came along as the foal was led away, and “the presence of the dam probably served to keep the colt tractable.” Zechariah's line, read as Hebrew poetry, describes one animal twice, and Matthew may have named both to show that the colt was young; the site's note “One donkey or two” at [[Zech. 9:9]] gives that reading in full.
    sources: [lds-scriptures, talmage-jesus-christ-29, huntsman-palm-sunday]
  - ref: 9
    phrase: Hosanna to the Son of David
    kind: words
    title: Hosanna to the Son of David
    body: |
      *Hosanna* comes from the Hebrew cry of [[Ps. 118:25]] and means “save now,” or “save us, we beseech you.” The crowd's whole cry comes from that psalm, the last of the Hallel, the psalms of praise (113–118) sung at Passover, and a psalm that seems first to have been sung in processions going up to the temple. On the road to the temple, days before Passover, the words fit exactly. (The site's note at [[Ps. 118:25]] explains the Hebrew.)

      Matthew's crowd makes the cry an open royal acclamation: “Hosanna to the Son of David.” Spreading garments and branches on the road carpeted the way “as for the passing of a king.” For that day, “He was their king, and they His adoring subjects.”
    sources: [huntsman-palm-sunday, talmage-jesus-christ-29]
  - ref: 10
    phrase: Who is this?
    kind: history
    title: “Who is this?”
    body: |
      The city that asks is full of strangers. It was the beginning of Passover week, and pilgrims from many lands were in Jerusalem; to them the procession was a strange start to the feast. The crowd's answer, “Jesus the prophet of Nazareth of Galilee,” fell short of what the hosannas had meant, but it gave the side of Him that strangers could most easily grasp. The Galilean pilgrims may have been first and loudest to answer, proud of a man from the north whom Judeans looked down on.

    sources: [ellicott-matthew, talmage-jesus-christ-29]
  - ref: 12
    phrase: cast out all them that sold and bought in the temple
    kind: history
    title: The King clears His house
    body: |
      The trade was in the Court of the Gentiles, the great outer court of Herod's temple, where non-Jews could come. There people bought oxen, sheep and doves for the sacrifices, and money changers turned coins bearing pagan symbols and rulers' likenesses into temple coinage. Herod had built plenty of shops along the bases of the Temple Mount; that the merchants were up on the temple platform itself suggests that the priestly establishment had taken control of the sanctuary and let them trade in the holy place.

      Matthew puts this act straight after the entry, which makes it a royal act: the King comes to His house and rejects the claims of those who had taken it over and mismanaged it. Jesus had cleared the courts once before, at a Passover near the start of His ministry ([[John 2:13–17]]). Then He called the temple “my Father's house”; now, having openly accepted the title of Christ, He calls it “my house.” “He and the Father were and are one in possession and dominion,” and none could stand against Him.
    sources: [ogden-jesus-temple, huntsman-palm-sunday, talmage-jesus-christ-30]
  - ref: 13
    phrase: a den of thieves
    kind: words
    title: Robbers, not thieves
    body: |
      The Greek word is *lēstēs*, a robber, “a plunderer, freebooter, brigand,” not a *kleptēs*, the thief who takes by stealth; the King James wording blurs the difference. The phrase comes from Jeremiah's sermon at the temple gate ([[Jer. 7:11]]), where it condemned the political and religious establishment of Jeremiah's day. The word could also mean a usurper or even an insurrectionist, which fits Matthew's scene: the King has come, and those running His house have taken what was not theirs. The site's note at [[Jer. 7:11]] explains Jeremiah's words; the first half of Jesus's sentence is from [[Isa. 56:7]].
    sources: [thayer, huntsman-palm-sunday]
  - ref: 14
    phrase: the blind and the lame came to him in the temple
    kind: history
    title: The blind and the lame let in
    body: |
      Only Matthew tells that, once the courts were clear, the blind and the lame came to Jesus there and He healed them. Apart from the fig tree and the healing of the servant's ear in Gethsemane ([[Luke 22:50–51]]), these are the only miracles told of His last week. His anger gave way at once to “the calmness of gentle ministry,” while the chief priests, who had already decreed His death, were afraid to touch Him because of the people.

      The healings answer an old line about David. When he took Jerusalem, the Jebusites taunted that even the blind and the lame could hold him off, and the saying arose that “the blind and the lame shall not come into the house” ([[2 Sam. 5:6–8]]). The law also kept blind or lame priests from the altar ([[Lev. 21:18–23]]). Jeremiah foresaw the blind and the lame gathered back to Zion ([[Jer. 31:8]]). The Son of David now welcomes them into the house and makes them whole. By the first century Solomon, David's son, was remembered as a great healer, so the healings, like the children's cry, “Hosanna to the Son of David,” tie Jesus to the first son of David.
    sources: [huntsman-palm-sunday, talmage-jesus-christ-30]
  - ref: 16
    phrase: Out of the mouth of babes and sucklings thou hast perfected praise
    kind: scripture
    title: The children's hosannas
    body: |
      The chief priests and scribes want Jesus to silence the children who are still shouting the crowd's cry in the temple. He answers from [[Ps. 8:2]], a psalm traditionally David's, which says that God draws praise even from the mouths of infants. The Son of David defends praise given to Him with a psalm of David's. His words follow the old Greek translation of the psalm, “perfected praise,” where the King James psalm, from the Hebrew, reads “ordained strength”; the site's note at [[Ps. 8:2]] explains the difference.
    sources: [huntsman-palm-sunday, lxx-rahlfs]
  - ref: 19
    phrase: found nothing thereon, but leaves only
    kind: symbol
    title: A tree with leaves and no fruit
    body: |
      Why curse a tree for having no figs in spring? Because this tree advertised fruit. A fig tree puts out its fruit buds before its leaves, so a tree in full leaf ought to have figs well on their way, and some figs can be eaten green. Mark says “the time of figs was not yet” ([[Mark 11:13]]); the other trees made no promise of fruit, but this one stood out in full leaf, and it had nothing. It was cursed “because, having leaves, it was deceptively barren,” and so it became “a type of human hypocrisy.”

      This is the only miracle in the Gospels that destroys rather than heals, and it is best read as a prophet's acted parable. The prophets used the fig tree for Israel when God's people bore no fruit: “there shall be no grapes on the vine, nor figs on the fig tree” ([[Jer. 8:13]]; see also [[Micah 7:1]]). What the tree exposes is religion that is all show, “pretentious show and empty profession” with no fruit. The parable of the vineyard later in this chapter points that judgment at those responsible: there the fruit is good and the tenants keep it back. So the barren tree is best read as standing for the leadership and the institutions they wrongly controlled, rather than for the whole Jewish people of Jesus's day. Matthew makes the same point by placing the rulers' challenge to Jesus straight after the tree withers. To the Twelve it was also a sign of His power over life and death: He could destroy with a word, so His surrender to the priests a few days later was His own choice.
    sources: [talmage-jesus-christ-30, huntsman-monday]
  - ref: 20
    phrase: How soon is the fig tree withered away!
    kind: scripture
    title: At once, in Matthew
    body: |
      In Matthew the tree withers “presently,” that is immediately, and the disciples see it happen. In Mark, Jesus curses the tree on the way into the city, clears the temple, and only the next morning do the disciples find the tree “dried up from the roots” ([[Mark 11:14–21]]). Mark frames the clearing between the curse and the withering, so that the temple, like the tree, is judged for bearing no fruit and its destruction is foretold.

      Matthew tells it differently, and to a different end. His clearing comes on the day of the entry, as the act of the rightful King, who has the authority to expel the merchants; in his account the traditional name, “cleansing of the temple,” fits. His fig tree then stands next to the rulers' challenge, and the failure it shows is theirs.
    sources: [huntsman-monday, huntsman-palm-sunday]
  - ref: 21
    phrase: if ye shall say unto this mountain
    kind: symbol
    title: This mountain
    body: |
      Jesus turns the disciples' amazement into a lesson on faith. The fruit God most wants is belief, and with it they can do what looks impossible. “This mountain” may have had a sharp edge in that place: the Temple Mount, soon to be overthrown, or the Mount of Olives itself, where the tree stood and which Zechariah said would be split in two in the last day ([[Zech. 14:4]]). Both readings are possible, though the words on prayer that follow make the Temple Mount the more pointed.

      The promise has a condition. Such prayer must be offered without doubt, and since prayer must be acceptable to God to have effect, the one who prays must be fit to come before Him; Mark adds at this point that one who prays must forgive ([[Mark 11:25–26]]). The blighting of a tree was small beside what faith and prayer could do.
    sources: [huntsman-monday, talmage-jesus-christ-30]
  - ref: 23
    phrase: By what authority doest thou these things?
    kind: history
    title: Who asked, and what “these things” were
    body: |
      The men who confront Jesus are the temple's governing class. The chief priests included the high priest, former high priests and perhaps the heads of the leading priestly families; the elders of the people were the lay nobility. With the scribes, whom Mark and Luke name beside them, they made up the Sanhedrin, the council that was both the highest Jewish court and the chief civil body under Rome. These were the groups Jesus had named as the ones who would reject Him ([[Matt. 16:21]]). “These things” were the entry and above all the clearing of the temple, an attack on their own authority there.

      They saw themselves as “the guardians of the temple,” and this Galilean had now ignored their authority within its walls a second time. This time they did not ask for a sign: after three years of miracles, the blind and lame healed in the temple the day before, and Lazarus raised, asking for one now would only have exposed them to the people's ridicule. They asked instead for His credentials, very likely as a first step in a planned attempt to stop His work and teaching in the temple.
    sources: [huntsman-monday, talmage-jesus-christ-30]
  - ref: 25
    phrase: The baptism of John, whence was it?
    kind: scripture
    title: John's baptism as the answer
    body: |
      Answering a question with a question was a method the rulers used themselves, and Jesus's question was not a dodge. If they said John's baptism was from heaven, they would have to explain why they had not believed John, and John had testified of Jesus. If they said it was of men, the people, who revered the martyred Baptist as a prophet, would turn on them. So they said, “We cannot tell.” They did not try to work out what was true, only what was safe to say.

      Jesus declined to tell them directly, but He went straight on to answer indirectly, in the parable of the two sons. One Latter-day Saint reading holds that the parable answers, in effect, their second question, “who gave thee this authority?”, since the father in it proves to be God the Father. The Joseph Smith Translation ties John's witness to Jesus in so many words in verse 32: “For he that believed not John concerning me, cannot believe me, except he first repent” (JST Matt. 21:32–33, in the footnotes and appendix).
    sources: [talmage-jesus-christ-30, welch-two-sons, jst-matt-21]
  - ref: 29
    phrase: 'I will not: but afterward he repented'
    kind: words
    title: '“I will not” and “repented”'
    body: |
      Both phrases say less in the Greek than they do to a modern ear. “I will not” is *ou thelō*, a present tense: “I don't want to,” or “I'd rather not,” not a defiant refusal of the future. “Repented” is not *metanoeō*, the usual word for repentance from sin, but *metamelomai*, which in the Greek of the day most often means to regret or to change one's mind. The son thinks better of his answer and goes. The two verbs overlap, and the difference should not be pressed hard (see the note on [[Matt. 27:3]]).

      Jesus uses the same verb of the rulers in verse 32. When they saw publicans and harlots turn to John, they “repented not afterward”: they did not so much as change their minds and believe him. That is the charge. The first son's “no” was turned into obedience; the rulers' “yes” never was.

      One Latter-day Saint reading takes the parable a step further. *Ou thelō* can also be heard as “not as I will,” and in Gethsemane the Son said, “not my will, but thine, be done” ([[Luke 22:42]]). Read that way, the first son is Christ Himself, who set His own will aside and did His Father's. Jesus's own application in verses 31–32 is to the publicans and the rulers; this reading is offered as a further layer of meaning beneath it.
    sources: [welch-two-sons, thayer]
  - ref: 31
    phrase: the publicans and the harlots go into the kingdom of God before you
    kind: history
    title: Ahead of you, not instead of you
    body: |
      The rulers had to answer “the first,” and with that they convicted themselves. They were the second son, who said “I go, sir” and never went; the publicans and sinners they despised were the first, who refused at first and then came to John in the wilderness and were baptized. (On publicans, see the note at [[Matt. 9:9]].) Both are sons in the story: the outwardly religious and the openly irreligious alike are children of the Father.

      “Go … before you” is a rebuke, but it does not shut the door. Jesus did not say the repentant sinners would enter and the priests be “forever excluded”; for the rulers too “there was hope if they would but repent.”
    sources: [talmage-jesus-christ-30, ellicott-matthew]
  - ref: 33
    phrase: planted a vineyard, and hedged it round about
    kind: symbol
    title: Isaiah's vineyard, retold
    body: |
      Hearers in the temple would have known this vineyard. The hedge, the winepress and the tower come from Isaiah's song of the vineyard ([[Isa. 5:1–7]]), where the vineyard is “the house of Israel.” In the parable the owner is God, the servants are the prophets He sent, and the husbandmen, who only rent the vineyard and do not own it, are Israel's leaders through her history, down to the priests and teachers standing in front of Jesus.

      Jesus changes one thing in Isaiah's song. There the vineyard brought forth wild grapes; here the fruit is good, and the tenants refuse to give the owner his share. The fault lies with those entrusted with the vineyard, not with the vines. The site's notes on [[Isa. 5:1–7]] explain Isaiah's song.
    sources: [huntsman-monday, talmage-jesus-christ-30]
  - ref: 37
    phrase: last of all he sent unto them his son
    kind: christ
    title: The heir cast out
    body: |
      The owner's son is Jesus, and the parable tells His death three days before it happened. The servants are the prophets, and the “other servants more than the first” (verse 36) were greater ones, John the Baptist the latest. In Mark's telling the son is the owner's one “wellbeloved” son ([[Mark 12:6]]), the word the Father used of Jesus at His baptism and on the mount. The tenants know who he is (“This is the heir”) and kill him to keep the vineyard; Jesus told the rest “as though already fulfilled.”

      Matthew's order is that they “cast him out of the vineyard, and slew him” (Mark has them kill him and then throw him out). The minor details of a parable should not be pressed, but it is hard not to see here that Jesus was handed over to the Gentiles and crucified outside the city ([[Heb. 13:12]]).

      When Jesus asks what the owner will do, the rulers answer for themselves: he will destroy those wicked men and let the vineyard to others. Again they passed judgment on themselves.
    sources: [huntsman-monday, talmage-jesus-christ-30, ellicott-matthew]
  - ref: 42
    phrase: The stone which the builders rejected
    kind: christ
    title: '“I am the stone”'
    body: |
      Jesus ends the parable by quoting [[Ps. 118:22–23]], the same psalm the crowds sang on the road. They had cried its “Save now” to welcome Him; now He quotes its rejected stone to the men who are rejecting Him. The site's notes on [[Ps. 118:22]] and [[Ps. 118:23]] explain what the head of the corner was and how Peter and Jacob read the verse.

      In Matthew's text Jesus does not say who the stone is, though His opponents understood the reference. The Joseph Smith Translation makes it explicit, in words to His disciples: “I am the stone, and those wicked ones reject me,” and, “I am the head of the corner” (JST Matt. 21:51–52, in the appendix). The rejected stone “was eventually to have chief place … in the edifice of Salvation.”

      Verse 44 has been read as two fates. To some the stone is a cause of stumbling: those who fall on it are broken, and only through repentance and righteous works can they even partly recover. On those who persist in opposing it, it falls in judgment and grinds them to powder.
    sources: [huntsman-monday, jst-matt-21, jackson-adding-words, talmage-jesus-christ-30]
  - ref: 43
    phrase: given to a nation bringing forth the fruits thereof
    kind: scripture
    title: Which nation, and when
    body: |
      The Joseph Smith Translation names the nation: the kingdom “shall be given to a nation bringing forth the fruits thereof; (meaning the Gentiles.)” (JST Matt. 21:53, in the appendix). It then carries the parable forward to the last days. The Lord will “let again his vineyard unto other husbandmen, even in the last days,” and the disciples understood “that the Gentiles should be destroyed also, when the Lord should descend out of heaven to reign in his vineyard, which is the earth and the inhabitants thereof” (JST Matt. 21:55–56).

      So the parable is not a sentence on one people and a reward for another. In Jesus's day the kingdom is taken from the tenants, the leaders who “perceived that he spake of them” (verse 45), and from those who followed their example; and the Gentiles who receive it come under the same judgment when the Lord descends to reign.
    sources: [jst-matt-21, jackson-adding-words, talmage-jesus-christ-30]
  - ref: 45
    phrase: they perceived that he spake of them
    kind: scripture
    title: What the rulers feared to lose
    body: |
      The Joseph Smith Translation adds the rulers' own words at this point, and they show what was at stake for them: “Shall this man think that he alone can spoil this great kingdom? And they were angry with him” (JST Matt. 21:48). They would have arrested Him on the spot, but they feared the multitude, who took Him for a prophet. The same fear had kept them from touching Him in the temple the day before.
    sources: [jst-matt-21, jackson-adding-words, talmage-jesus-christ-30]

christ: |
  Matthew 21 shows Jesus Christ as the King who comes meek, on a donkey, to His own house; as the Son whom the Father sent last, “saying, They will reverence my son” (verse 37); and as the rejected stone that becomes the head of the corner, of whom He says in the Joseph Smith Translation, “I am the stone” (JST Matt. 21:51). The parable of the two sons sets the measure for His disciples: “Not every one that saith unto me, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father” ([[Matt. 7:21]]), and “he that saith he receiveth it and doeth it not, the same is not my disciple” ([[D&C 41:5]]). A first answer of “no” is not the end: the son who changed his mind and went did his father's will.

explore: |
  - **The other tellings.** [[Mark 11:1–33]], [[Mark 12:1–12]], [[Luke 19:28–48]] and [[Luke 20:1–19]]; John's account of the entry, [[John 12:12–19]], and of the earlier clearing of the temple, [[John 2:13–17]].
  - **The psalm of the entry.** [[Ps. 118:19–29]], from the gate of the temple to the stone and the hosanna.
  - **The prophecies behind the scene.** [[Zech. 9:9–10]] and [[Zech. 14:4]], [[Zech. 14:21]]; Isaiah's song of the vineyard, [[Isa. 5:1–7]]; the stone in [[Jacob 4:15–17]].
  - **The Joseph Smith Translation.** JST Matthew 21:47–56 in the appendix, the longest addition to this chapter.
  - The chapters “Palm Sunday” and “Monday” in *Greater Love Hath No Man* (Religious Studies Center) follow these days event by event, with all four Gospels side by side.

