chapter: 14
title: John Beheaded, Five Thousand Fed, the Lord on the Sea
tagline: Herod, haunted by the prophet he killed, thinks Jesus is John risen; Jesus feeds five thousand in the wilderness, comes to His disciples walking on the sea, and is worshipped as the Son of God.
when: 'Spring, near the Passover ([[John 6:4]]), in Galilee and on its lake; John’s death is told looking back'

setting: |
  Matthew 14 follows the parables of the kingdom and Jesus’s rejection at Nazareth ([[Matt. 13:53–58]]). Its three stories are all told by Mark as well ([[Mark 6:14–56]]); Luke and John also tell the feeding of the five thousand, and John sets the walk on the sea right after it, as Matthew does ([[John 6:1–21]]).

  The chapter opens at the court of Herod Antipas, who had received Galilee and Perea when his father’s kingdom was divided. Jesus lived and worked in his territory. John the Baptist had been in prison since before Jesus’s Galilean ministry began ([[Matt. 4:12]]), and had sent his disciples to Jesus from there ([[Matt. 11:2–3]]). Matthew now tells, as a look back, how John died. The return of the Twelve from the mission of chapter 10 came near the time of that execution.

  The rest of the chapter happens around the Sea of Galilee in the spring, near the Passover, “the season of grass and flowers” (compare “the grass,” verse 19). Many place the “desert place” of verse 13 in the open country near Bethsaida Julias, on the eastern side of the Jordan; the night crossing ends in the land of Gennesaret, generally placed near Tiberias and Magdala (verse 34).

thread: |
  **Who is this? A guilty ruler guesses wrong, and the disciples in the boat answer right.**

  The chapter opens with Herod’s answer to the question everyone in Galilee was asking. He hears of Jesus’s mighty works and, out of fear born of guilt, decides that the prophet he beheaded has come back (verses 1–2). The story of that beheading follows: a ruler who knew John was a holy man, a rash oath at a birthday feast, and a prophet’s life traded for a ruler’s pride before his guests (verses 3–12).

  Jesus answers the news by going apart, and then by giving Himself to the crowd that follows Him: He heals their sick and feeds thousands in the wilderness with five loaves, as the Lord once fed Israel with Moses (verses 13–21). That night He comes across the water to His struggling disciples doing what only God does, and names Himself with words that in Isaiah are God’s own name: “It is I” (verses 22–27). Peter walks to Him and sinks when he looks away (verses 28–32). The chapter that began with Herod’s fearful guess ends with the disciples’ worship: “Of a truth thou art the Son of God” (verse 33).

sections:
  - range: 1-12
    heading: The death of John the Baptist
    plain: |
      At that time Herod, the ruler of Galilee, heard what people were saying about Jesus, and said to his servants, “This is John the Baptist. He has risen from the dead, and that is why these mighty powers are at work in him.” For Herod had arrested John, put him in chains and thrown him into prison because of Herodias, the wife of his brother Philip. John had told him, “It is against the law for you to have her.” Herod wanted to kill him, but he was afraid of the people, because they regarded John as a prophet. Then on Herod’s birthday the daughter of Herodias danced before the guests, and she so pleased Herod that he swore an oath to give her whatever she asked. Prompted by her mother, she said, “Give me John the Baptist’s head here on a platter.” The king was sorry, but because of his oath and his dinner guests he ordered it to be given her. He sent and had John beheaded in the prison. His head was brought on a platter and given to the girl, and she took it to her mother. John’s disciples came and took the body and buried it, and went and told Jesus.
  - range: 13-21
    heading: The feeding of the five thousand
    plain: |
      When Jesus heard this, He left by boat for a remote place to be alone. But the crowds heard of it and followed Him on foot from the towns. When He came ashore and saw the great crowd, He was moved with compassion for them and healed their sick. Toward evening His disciples came to Him and said, “This is a remote place and it is already late. Send the crowds away so they can go into the villages and buy themselves food.” Jesus said, “They do not need to go away. You give them something to eat.” They said, “All we have here is five loaves and two fish.” He said, “Bring them here to me.” He told the people to sit down on the grass. Taking the five loaves and the two fish, He looked up to heaven and blessed them, broke the loaves, and gave them to the disciples, and the disciples gave them to the crowd. They all ate and were satisfied, and the disciples picked up twelve baskets full of the pieces left over. The number of men who had eaten was about five thousand, not counting women and children.
  - range: 22-36
    heading: Jesus walks on the sea
    plain: |
      At once Jesus made the disciples get into the boat and go ahead of Him to the other side while He sent the crowds away. After sending them away He went up on a mountain by Himself to pray, and when night came He was there alone. By now the boat was far out on the lake, battered by the waves, because the wind was against it. In the last watch of the night, between three and six in the morning, Jesus came toward them, walking on the sea. When the disciples saw Him walking on the sea they were terrified. “It is a ghost!” they said, and cried out in fear. But Jesus spoke to them at once: “Take courage! It is I. Do not be afraid.” Peter answered, “Lord, if it is You, tell me to come to You on the water.” “Come,” He said. So Peter got down out of the boat and walked on the water toward Jesus. But when he saw how strong the wind was, he was afraid, and beginning to sink he cried out, “Lord, save me!” Immediately Jesus reached out His hand and caught him. “You of little faith,” He said, “why did you doubt?” When they climbed into the boat, the wind stopped. Those in the boat worshipped Him, saying, “Truly You are the Son of God.” When they had crossed over, they landed at Gennesaret. The people there recognized Him and sent word through all the surrounding country, and they brought Him all who were sick and begged Him to let them touch even the tassel of His cloak; and all who touched it were made completely well.

notes:
  - ref: 1
    phrase: Herod the tetrarch
    kind: history
    title: Herod the tetrarch
    body: |
      This Herod is Herod Antipas, a son of the Herod who ruled when Jesus was born ([[Matt. 2:1]]). Herod the Great died a few months after the massacre at Bethlehem, and his kingdom was divided among three sons: Archelaus received Judea, Idumea and Samaria; Philip the northeast; and Antipas Galilee and Perea. So the man who “heard of the fame of Jesus” ruled the country where Jesus lived and worked, and he built his capital, Tiberias, on the shore of the same lake where the rest of this chapter happens.

      “Tetrarch” is his proper title. The word first meant the ruler of a fourth part of a country, and was used for a ruler of any such part; Luke gives it to Antipas, to his brother Philip and to Lysanias ([[Luke 3:1]]). Matthew uses it here and then calls him simply “the king” in verse 9, as Mark does throughout his account ([[Mark 6:14]]). Antipas appears again at the end of the Gospel story, when Pilate sends Jesus to him ([[Luke 23:7–12]]).
    sources: [bd-herod, bd-tetrarch]
  - ref: 2
    phrase: This is John the Baptist; he is risen from the dead
    kind: history
    title: Why Herod thought John had risen
    body: |
      Herod’s guilt shaped his answer to the question all Galilee was asking about Jesus. Others said He was Elijah, or one of the prophets ([[Mark 6:15]]; [[Matt. 16:14]]); the conscience-stricken ruler held to the answer that accused him, that the man he had beheaded had come back.

      His reasoning shows it. Herod says “mighty works” are at work in Jesus *because* He is John risen, yet John in his lifetime “did no miracle” ([[John 10:41]]). To a conscience stained with blood, a new prophet working signs and wonders that John had never worked could look like the murdered prophet returned with new power. Matthew gives Herod’s guess first and then goes back to tell what he had done (verses 3–12).
    sources: [talmage-jesus-christ-21, ellicott-matthew]
  - ref: 4
    phrase: It is not lawful for thee to have her
    kind: history
    title: Why the marriage was unlawful
    body: |
      The law of Moses forbade a man to take his brother’s wife ([[Lev. 18:16]]; [[Lev. 20:21]]), and Herodias had left a living husband to marry Antipas. Her first husband, by whom she had a daughter, was Herod Philip, another son of Herod the Great; he is not the Philip of [[Luke 3:1]] who ruled as tetrarch in the northeast, but a son who held no office. Antipas, for his part, put away his first wife, a daughter of the Arabian king Aretas. Herodias was also the granddaughter of Herod the Great, which made her the niece of both her husbands. By the law of Moses the marriage was adultery and, twice over, a forbidden union of near kin.

      John said so to the ruler himself, as Elijah had faced Ahab and Jezebel ([[1 Kgs. 21:17–24]]), and he spoke for the stricter Jews, whom the marriage shocked. Matthew says the rebuke is why John was in prison (verse 3), and Mark adds that Herodias “would have killed him; but she could not” ([[Mark 6:19]]).
    sources: [bd-herodias, ellicott-matthew, lds-scriptures]
  - ref: 5
    phrase: when he would have put him to death, he feared the multitude
    kind: history
    title: Did Herod want John dead?
    body: |
      Matthew and Mark describe Herod’s mind differently, and read together the two accounts suggest a man divided against himself. In Matthew, Herod wanted John dead and held back only because the people counted John a prophet. In Mark it is Herodias who wanted him killed, while Herod “feared John, knowing that he was a just man and an holy, and observed him” ([[Mark 6:19–20]]).

      Both can be true of a weak man, in whom conscience struggled against passion, as it had in Ahab in his dealings with Elijah. Matthew shows the struggle at its end, when “the king was sorry” (verse 9) and gave the order anyway.

      The Jewish historian Josephus adds a political motive. In his account Herod feared that John’s great influence over the crowds might lead to a rebellion, so he sent him as a prisoner to the fortress of Machaerus and had him put to death there. Josephus adds that when Herod’s army was later destroyed in a war with Aretas, some Jews thought it God’s just punishment for what he had done to John.
    sources: [ellicott-matthew, josephus-antiquities]
  - ref: 9
    phrase: for the oath’s sake, and them which sat with him at meat
    kind: history
    title: Why Herod kept his oath
    body: |
      Herod kept a rash oath because he feared his guests more than his conscience. Mark gives the oath in full: “Whatsoever thou shalt ask of me, I will give it thee, unto the half of my kingdom” ([[Mark 6:23]]). Herod probably expected her to name a jewel or a palace or a city; instead the girl, Herodias’s daughter Salome, asked for a prophet’s head at her mother’s prompting (verse 8).

      Matthew names two reasons Herod gave in: the oath, and “them which sat with him at meat.” The second probably weighed more. What Herod seems to have shrunk from was less the broken oath than the taunt or contempt of the assembled guests if they saw him take back his word. A false regard for what others think became an incentive to guilt instead of a restraint.
    sources: [ellicott-matthew, bd-herodias]
  - ref: 13
    phrase: he departed thence by ship into a desert place apart
    kind: history
    title: Why Jesus withdrew
    body: |
      Matthew ties Jesus’s withdrawal straight to the news of John’s death: “When Jesus heard of it, he departed.” Mark and Luke put the return of the Twelve from their mission at this point instead ([[Mark 6:30–31]]; [[Luke 9:10]]), and the two came at about the same time. Jesus took the apostles apart to rest, since “they had no leisure so much as to eat” ([[Mark 6:31]]). It was probably also a time of grief: John was a prophet Jesus had known and loved, and his death was likely to stir up the kind of popular excitement Jesus did not want to be the center of.

      The “desert place” was a wilderness, the kind of place where Israel had once been fed with Moses, as the next verses recall.

      Verse 14 is the more striking for what came before it. Jesus had apparently gone away to be alone, yet when the crowds followed Him He did not send them away or merely put up with them: He “was moved with compassion toward them, and he healed their sick.”
    sources: [ellicott-matthew, talmage-jesus-christ-21, huntsman-bread-of-life, swift-three-stories]
  - ref: 19
    phrase: looking up to heaven, he blessed, and brake
    kind: symbol
    title: Bread in the wilderness
    body: |
      A crowd fed with bread in the wilderness recalls the manna. The Lord had fed Israel in the wilderness with Moses ([[Ex. 16:4]]; [[Ex. 16:16]]), and Jesus now feeds His followers abundantly in a wilderness place. Matthew draws many likenesses between Jesus and Moses (see the note at [[Matt. 4:2]]), and this miracle and the second feeding in [[Matt. 15:32–39]] are among them. John tells how the crowd read the sign: “This is of a truth that prophet that should come into the world” ([[John 6:14]]), the Prophet like Moses whom Moses himself had foretold ([[Deut. 18:15]]). The footnote also points to Elisha, who fed a hundred men with twenty barley loaves and had some left over ([[2 Kgs. 4:42–44]]); the site’s note there compares the two miracles.

      The text does not say how the bread multiplied, and no one can explain the process. What can be said is what kind of act it was: a manifestation of creative power, by which material elements were organized to meet a present need. The “baskets” were small hand baskets of the kind travelers carried their food in, and the twelve filled with leftover pieces held more than the five loaves the disciples had started with.
    sources: [griffin-matthew-portrayal, huntsman-bread-of-life, talmage-jesus-christ-21, ellicott-matthew, lds-scriptures]
  - ref: 22
    phrase: Jesus constrained his disciples to get into a ship
    kind: history
    title: Why He sent the disciples away
    body: |
      Matthew says Jesus made the disciples leave at once, but not why. John tells what the crowd was about to do: having decided He was the Prophet, they meant to “take him by force, to make him a king” ([[John 6:14–15]]). The disciples were reluctant to leave Him, and He compelled them, perhaps to keep the Twelve away from the crowd’s worldly plan. The crowd’s hope was for a political Messiah, a ruler who would free them from Herod’s family and from Rome, and that was not what He had come to be.

      So He dismissed the crowd and went up the mountain alone to pray (verse 23). That night can be read as a return of the temptation in the wilderness, when the devil had offered Him the kingdoms of the world ([[Matt. 4:8–10]]): another chance at earthly greatness in place of the path that led to the cross, met as before in communion with His Father.
    sources: [talmage-jesus-christ-21, huntsman-bread-of-life, ellicott-matthew]
  - ref: 25
    phrase: walking on the sea
    kind: christ
    title: Walking on the sea
    body: |
      Walking on the sea shows Jesus doing what scripture ascribes to God alone. The disciples had rowed all night against a head-wind that made the sails useless, and had covered less than four miles, when Jesus came to them in the last watch before dawn. Job had said that God “alone spreadeth out the heavens, and treadeth upon the waves of the sea” ([[Job 9:8]]). In the Gospels Jesus does what is proper only to Jehovah, above all in His command of wind and water.

      The miracle also recalls Moses. Israel crossed the Red Sea on dry ground when the Lord divided it ([[Ex. 14:21–22]]); Jesus crosses the Sea of Galilee not by dividing it but by walking on it. Coming the night after the feeding, it can be read as an answer to the crowd’s too narrow reading of that sign: the man they wanted to make a king was far more than a king.
    sources: [talmage-jesus-christ-21, keller-jesus-jehovah, griffin-matthew-portrayal, huntsman-bread-of-life]
  - ref: 27
    phrase: it is I; be not afraid
    kind: christ
    title: '“It is I”: the name of God'
    body: |
      The words “It is I” are, in Greek, *egō eimi*, which means “I am” or “I am he.” In the second half of Isaiah, the Greek translation uses these same words as the name of the God of Israel. Where the Hebrew of [[Isa. 45:18]] says “I am the LORD,” the Greek has simply *egō eimi*, and “I, even I, am he that comforteth you” ([[Isa. 51:12]]) can be translated from the Greek as “I am I AM who comforts you.”

      Read with Isaiah, the words spoken by someone walking on the sea are a hint at who He is: the one who says “It is I; be not afraid” is I AM, Jehovah, the God of the Old Testament, who created and rules the wind and waves the disciples feared.
    sources: [keller-jesus-jehovah, lds-scriptures]
  - ref: 29
    phrase: he walked on the water, to go to Jesus
    kind: prophets
    title: Peter on the water
    body: |
      Peter’s walk on the water is a lesson in faith, and Matthew alone tells it: Mark and John tell the walk on the sea without it ([[Mark 6:47–51]]; [[John 6:16–21]]). The power by which Christ walked on the waves could work in others too, as long as their faith held, and Peter’s attempt, though it partly failed, showed the power of faith in the Lord better than any sermon could have.

      The failure came when Peter looked away: “Only when with wavering faith he removed his glance from the Master to look at the furious waves and the black gulf beneath him, only then did he begin to sink.” The order in verse 30 matters: Peter is afraid first, and then begins to sink. And when he sinks he does not try to swim; he calls at once to the one who can save him.

      Peter’s two appeals both call Jesus “Lord,” “Lord, if it be thou” and “Lord, save me,” which can be read as stressing once again that Jesus is the Lord, Jehovah. The rebuke, “O thou of little faith,” comes only after the rescue: “immediately Jesus stretched forth his hand, and caught him” (verse 31).
    sources: [talmage-jesus-christ-21, hunter-beacon, swift-three-stories, keller-jesus-jehovah]
  - ref: 33
    phrase: Of a truth thou art the Son of God
    kind: christ
    title: The disciples’ first confession
    body: |
      This is the first time in Matthew that the disciples call Jesus the Son of God, and only Matthew ends the night this way. Mark closes the same scene with the disciples “sore amazed,” because “they considered not the miracle of the loaves: for their heart was hardened” ([[Mark 6:51–52]]). In Matthew they worship Him.

      Until now in Matthew’s Gospel the title has come from other mouths. The Father’s voice called Jesus His beloved Son at the baptism ([[Matt. 3:17]]); the devil questioned it (“If thou be the Son of God,” [[Matt. 4:3]]); and devils cried it out ([[Matt. 8:29]]). Now the disciples say it in worship, and at the end of the Gospel a Roman centurion at the cross will say it too ([[Matt. 27:54]]).

      What moved them is left unsaid. It may have been the walking on the sea; it may as well have been what they had just seen between Jesus and Peter, the hand stretched out and the sinking man brought safely back to the boat. Either way, the chapter that began with Herod’s fearful guess about who Jesus is ends with this answer.
    sources: [griffin-matthew-portrayal, swift-three-stories, lds-scriptures]
  - ref: 36
    phrase: touch the hem of his garment
    kind: history
    title: The hem of His garment
    body: |
      The people of Gennesaret showed a faith like that of the woman who had been healed by touching the hem of Jesus’s garment ([[Matt. 9:20–22]]); the note at [[Matt. 9:20]] explains the tassel the law required on that border. Their wish to touch it may have come from the holiness that was felt to belong to the border. What the woman had done alone in a crowd, a whole district now asked to do, and “as many as touched were made perfectly whole.”
    sources: [talmage-jesus-christ-21]

christ: |
  Matthew 14 shows Jesus Christ as the Lord who meets need with power: He feeds the hungry crowd in the wilderness as the Lord once fed Israel, treads the waves as Job said God alone does, and names Himself to His frightened disciples with words that in Isaiah are God’s own name, “It is I; be not afraid.” What came to Peter on the lake “comes to all who toil in faith, the voice of the Deliverer.” Peter’s sinking is the other half of the lesson: a disciple who looks to the storm “rather than to him who can help and save us” sinks, and one who, like Peter at first, fixes his eyes on Jesus may walk triumphantly.

explore: |
  - **The other tellings.** [[Mark 6:14–56]]; [[Luke 9:7–17]]; [[John 6:1–21]], where the feeding leads into the sermon on the bread of life ([[John 6:22–71]]).
  - **The bread in the wilderness.** [[Ex. 16:4–16]]; Elisha’s loaves, [[2 Kgs. 4:42–44]]; and Matthew’s second feeding, [[Matt. 15:32–39]].
  - **The God who treads the sea and says “I am he.”** [[Job 9:8]]; [[Isa. 45:18]]; [[Isa. 51:12]].
  - **Peter’s faith, then and later.** Read verses 28–31 beside [[Matt. 16:13–19]].
  - President Howard W. Hunter’s general conference talk “The Beacon in the Harbor of Peace” (October 1992) dwells on the storm on the lake and Peter’s walk to the Savior.

