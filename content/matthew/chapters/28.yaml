chapter: 28
title: He Is Risen
tagline: At dawn on the first day of the week an angel opens the tomb and tells two women that Jesus is risen; the risen Lord meets them on the road, the guards are paid to say the body was stolen, and on a mountain in Galilee He sends the eleven to all nations with the promise that He is with them always.
when: 'The first day of the week after the crucifixion, and a later day in Galilee'

setting: |
  Matthew 28 ends the Gospel and its last division, the Passion and the Resurrection (chapters 26–28). It follows straight on from the burial, where the two Marys sat watching the tomb, and from the guard that the chief priests and Pharisees asked of Pilate on the Sabbath ([[Matt. 27:57–66]]). Matthew is the only Gospel that tells of that guard.

  All four Gospels tell of the empty tomb ([[Mark 16:1–8]]; [[Luke 24:1–12]]; [[John 20:1–10]]). Matthew follows Mark’s outline but adds to it: an angel of the Lord descends with an earthquake and rolls away the stone, the risen Jesus meets the women on their way, the guards are bribed, and Jesus appears to the eleven on a mountain in Galilee and sends them out. Matthew says nothing of the Ascension, which Luke tells ([[Luke 24:50–51]]); his Gospel ends with Jesus’s words, not with His departure.

  In the order this site follows, the empty tomb and the women’s meeting with the risen Lord close the last week of Jesus’s mortal ministry, and the mountain in Galilee belongs to His ministry after the Resurrection.

thread: |
  **The Lord who was crucified is alive, and the God who came to be “with us” stays with His disciples to the end.**

  Matthew arranges the end of his Gospel in five scenes: the burial ([[Matt. 27:57–61]]), the guard set at the tomb (27:62–66), the women at the tomb (28:1–10), the guards bribed (28:11–15), and the appearance in Galilee (28:16–20). Good news and bad alternate, as they do in the five scenes of his account of Jesus’s birth, and at the center stands the women’s experience: an open, empty tomb, an angel’s announcement, and the risen Lord Himself, whom they hold by the feet and worship.

  Two reports go out from the tomb that morning. The women run to tell the disciples what they have seen; the soldiers are paid to tell a story they had not seen. The chapter then climbs to a mountain where the risen Jesus claims all authority in heaven and earth and sends the eleven, men who had fled from Him a few days before, to make disciples of all nations. His last words close the frame Matthew opened in his first chapter, where Jesus is named Emmanuel, “God with us” ([[Matt. 1:23]]): “lo, I am with you alway.”

sections:
  - range: 1-10
    heading: The empty tomb and the risen Lord
    plain: |
      After the Sabbath, as the first day of the week was dawning, Mary Magdalene and the other Mary came to look at the tomb. Suddenly there was a great earthquake, for an angel of the Lord came down from heaven, rolled the stone back from the doorway, and sat on it. He shone like lightning, and his clothing was white as snow. The guards shook with fear of him and became like dead men. The angel said to the women, “Don’t be afraid. I know you are looking for Jesus, who was crucified. He is not here; He has risen, just as He said. Come and see the place where the Lord lay. Then go quickly and tell His disciples that He has risen from the dead. He is going ahead of you into Galilee; you will see Him there. Remember, I have told you.” They hurried away from the tomb, afraid and yet filled with joy, and ran to tell His disciples. On the way Jesus met them and greeted them. They came to Him, took hold of His feet, and worshipped Him. Jesus said to them, “Don’t be afraid. Go and tell my brethren to go into Galilee; they will see me there.”
  - range: 11-15
    heading: The guards are paid
    plain: |
      While the women were on their way, some of the guard went into the city and reported to the chief priests everything that had happened. The chief priests met with the elders and agreed on a plan. They gave the soldiers a large sum of money and told them, “Say that His disciples came during the night and stole Him while you were asleep. If the governor hears of it, we will satisfy him and keep you out of trouble.” So the soldiers took the money and did as they were told, and this story is still told among the Jews to this day.
  - range: 16-20
    heading: The commission on the mountain
    plain: |
      Then the eleven disciples went to Galilee, to the mountain where Jesus had told them to go. When they saw Him they worshipped Him, though some hesitated. Jesus came to them and said, “All authority in heaven and on earth has been given to me. So go and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Ghost, and teaching them to keep everything I have commanded you. And remember, I am with you always, to the end of the world.”

notes:
  - ref: 1
    phrase: came Mary Magdalene and the other Mary to see the sepulchre
    kind: history
    title: The two Marys, at dawn on the first day
    body: |
      The two women who came to the tomb were the same two who had watched Jesus buried, so they knew which tomb was His. “The other Mary” is Mary the mother of James and Joses, named with Mary Magdalene among the women at the cross ([[Matt. 27:56]]); both sat “over against the sepulchre” as Joseph of Arimathea laid the body in it ([[Matt. 27:61]]). Mark names a third woman, Salome ([[Mark 16:1]]), and Luke adds Joanna ([[Luke 24:10]]); Matthew gives only the two Marys.

      “In the end of the sabbath” means after it (the footnote reads “After the sabbath”). The Sabbath ended at sunset on Saturday, and the women came as the next day dawned. That first day of the week, the day the Lord rose, afterward came to be known in the Church as the Lord’s Day and was observed as the Sabbath in place of Saturday.
    sources: [huntsman-easter-sunday, talmage-jesus-christ-37, lds-scriptures]
  - ref: 2
    phrase: rolled back the stone from the door, and sat upon it
    kind: christ
    title: Opened to let the witnesses in
    body: |
      The stone was rolled back so that those who came could see for themselves that the body was gone; the doorway did not need to be opened for the risen Christ to leave. The earthquake and the angel do not show that He had not already risen. A resurrected body is tangible, with all the organs of a mortal one, but it is not stopped by walls or stones, as the risen Lord showed when He stood among His disciples “when the doors were shut” ([[John 20:19]]).

      Only Matthew tells of an earthquake at the tomb, as only he tells of the star the wise men followed ([[Matt. 2:2]]). Read together, the two signs mark the cosmic weight of Jesus’s life and death: to Matthew the Resurrection is literally earthshaking.
    sources: [talmage-jesus-christ-37, smith-resurrection]
  - ref: 6
    phrase: for he is risen, as he said
    kind: christ
    title: As He had said
    body: |
      “As he said” points back to the times Jesus had foretold that He would be killed and rise on the third day ([[Matt. 16:21]]; [[Matt. 17:22–23]]; [[Matt. 20:18–19]]), and promised, “after I am risen again, I will go before you into Galilee” ([[Matt. 26:32]]), which the angel now repeats. Matthew lets an irony stand: the chief priests and Pharisees remembered the prophecy well enough to ask Pilate for a guard (“After three days I will rise again,” [[Matt. 27:63]]), while most of the disciples did not yet understand it.

      The Greek verb behind “he is risen” is passive, “he has been raised.” In Matthew, Mark and Luke the emphasis may fall on the Father raising the Son whom men had crucified; John stresses the other side, that Jesus had power to lay down His life and to take it again ([[John 10:17–18]]). Both are true of Him.
    sources: [smith-resurrection, huntsman-easter-sunday]
  - ref: 9
    phrase: they came and held him by the feet, and worshipped him
    kind: christ
    title: The women hold Him by the feet
    body: |
      The first witnesses of the risen Lord in Matthew are women, and their witness is a sure one: they see the empty tomb, hear the angel, and then see, hear and touch Jesus Himself. Holding His feet shows that His body was real and solid, and shows their love for Him; that they worshipped Him is perhaps the most significant detail of all, for they bow before Him as divine. The angel and Jesus both send them to “tell” the disciples (verses 7, 10), and in this setting the Greek verb means more than passing on news: it is a solemn proclamation. The women were the first to bear it, though under Jewish law a woman was generally not accepted as a witness.

      A reader who knows John’s account asks why these women may hold Him when Mary Magdalene, who saw Him first of all, was told “Touch me not; for I am not yet ascended to my Father” ([[John 20:17]]). One answer, offered as reasonable and probable rather than certain, is that between Mary’s attempt to touch Him and the women’s holding His feet, Christ ascended to the Father and then returned to continue His ministry.
    sources: [smith-resurrection, huntsman-easter-sunday, talmage-jesus-christ-37]
  - ref: 10
    phrase: go tell my brethren
    kind: christ
    title: My brethren
    body: |
      The risen Lord calls the men who had fled from Him “my brethren.” On the night of His arrest “all the disciples forsook him, and fled” ([[Matt. 26:56]]), and Peter had denied Him three times ([[Matt. 26:69–75]]). Now His first message to them is an affectionate one, and Peter is not left out of it. Peter may well have doubted that the Master would ever call him His servant again, and this message, carried by the women, likely gave him hope. Mark’s account names him outright: “tell his disciples and Peter” ([[Mark 16:7]]).
    sources: [talmage-jesus-christ-37]
  - ref: 13
    phrase: His disciples came by night, and stole him away while we slept
    kind: history
    title: The guards’ story
    body: |
      The soldiers at the tomb (verse 12) were most likely Roman guardsmen whom Pilate had put under the chief priests’ orders ([[Matt. 27:65]]), and the chief priests were Sadducees, who denied that the dead could rise. When the soldiers reported what they had seen, the chief priests and elders met and paid them to say they had slept while the disciples took the body. The lie put the soldiers at risk, since a soldier found asleep at his post could be put to death; hence the promise to satisfy the governor and “secure” them. Because the guard answered to the chief priests, the soldiers were probably not required to report to the Roman authorities at all.

      The rumor was still current when Matthew wrote (“until this day”), and his account answers it. With soldiers set at a sealed tomb to keep the disciples away, Matthew’s readers could see that the disciples had no opportunity to steal the body; the paid story asks them to believe it happened in front of the guards while they slept. The episode answered the polemic of Matthew’s day (on how some read that, see the note on [[Matt. 27:64]]), and it also makes the soldiers, without meaning to be, more witnesses of what happened that morning.

      The verse’s “among the Jews” names the people among whom the soldiers’ story was spread in Matthew’s day. It was the chief priests and elders in this scene who bought it.
    sources: [talmage-jesus-christ-37, huntsman-easter-sunday, smith-resurrection]
  - ref: 17
    phrase: but some doubted
    kind: words
    title: Some doubted
    body: |
      The word for “doubted” means to waver or hesitate, and Matthew uses it only one other time: when Peter, walking on the water, began to sink and Jesus asked him, “wherefore didst thou doubt?” ([[Matt. 14:31]]). It describes wavering, as Peter wavered on the water.

      Who doubted is not said. The verse may imply that others besides the eleven were on the mountain, and perhaps that some of them were not yet convinced that the risen Christ had a real body. This may have been the occasion Paul describes, when Jesus “was seen of above five hundred brethren at once” ([[1 Cor. 15:6]]). That is a possibility, not something the text states.
    sources: [thayer, talmage-jesus-christ-37]
  - ref: 18
    phrase: All power is given unto me in heaven and in earth
    kind: christ
    title: All authority, in heaven and on earth
    body: |
      The risen Jesus begins His commission by declaring His authority. The Greek word behind “power” is *exousia*, the power of rule, of one whose commands others must obey, and it is usually translated “authority”; here it reaches over heaven and earth alike. The claim could be understood as nothing less than an affirmation that He is God. His authority is supreme, and because it is His, those He sends minister in His name with a power that no one else can give them or take from them. The command that follows begins “Go ye therefore”: the commission rests on this claim.
    sources: [talmage-jesus-christ-37, thayer]
  - ref: 19
    phrase: teach all nations
    kind: scripture
    title: From the lost sheep to all nations
    body: |
      The commission to “all nations” reverses the limit Jesus set on the Twelve’s first mission. Then He told them, “Go not into the way of the Gentiles … But go rather to the lost sheep of the house of Israel” ([[Matt. 10:5–6]]); the note on that verse explains why that limit was for that mission. Now the risen Lord sends them to every people. The verb is *mathēteuō*, “to make a disciple,” as the footnote says: more than giving lessons, it means bringing people to follow Him.

      The ending answers Matthew’s beginning. His Gospel opens with Jesus as “the son of Abraham” ([[Matt. 1:1]]), heir of the covenant by which all nations would be blessed ([[Gen. 12:3]]), with Gentile women in the genealogy and Gentile wise men at the cradle. Matthew closes his Gospel with this command, and with it the Gentiles who were there at the start are now to be made disciples.
    sources: [strathearn-matthew-editor, thayer, lds-scriptures]
  - ref: 19
    phrase: baptizing them in the name of the Father, and of the Son, and of the Holy Ghost
    kind: scripture
    title: In the name of the Father, the Son and the Holy Ghost
    body: |
      The three names in this command are three separate persons: the Father and the Son, who have bodies of flesh and bone, and the Holy Ghost, a personage of spirit ([[D&C 130:22]]).

      The risen Lord gave the same words for baptism to the Nephites, opening with the authority behind them: “Having authority given me of Jesus Christ, I baptize you in the name of the Father, and of the Son, and of the Holy Ghost” ([[3 Ne. 11:25]]). The Church today uses them in the same way, beginning “Having been commissioned of Jesus Christ” ([[D&C 20:73]]). In both, the one who baptizes first names whose authority he acts by.
    sources: [bd-god, lds-scriptures]
  - ref: 20
    phrase: lo, I am with you alway, even unto the end of the world
    kind: christ
    title: With you to the end
    body: |
      Matthew’s last line keeps the promise of his first chapter. There Jesus was named Emmanuel, “God with us” ([[Matt. 1:23]]); here the risen Lord says “I am with you alway,” and the two form a frame around the whole Gospel. The note on 1:23 takes up the name; what this verse adds is that the Resurrection is what lets Jesus go on being “God with us.” One reading hears in the Greek words for “I am” the ones the Septuagint uses for the name God gave Moses ([[Ex. 3:14]]); in Matthew they run literally “I with you am,” the word order itself setting God among His people.

      “The end of the world” translates a word that means completion or consummation. The disciples had used the same phrase on the Mount of Olives when they asked about the sign of His coming ([[Matt. 24:3]]), and Joseph Smith’s revision of that verse explains it as “the destruction of the wicked, which is the end of the world” ([[JS—M 1:4]]). The promise runs to that end. Unlike Luke, Matthew does not end with Jesus going away; he ends with Jesus staying.
    sources: [griffin-matthew-portrayal, smith-resurrection, thayer, lds-scriptures]

christ: |
  Matthew 28 shows Jesus Christ risen with a body the women could hold, worshipped by them, holding all authority in heaven and earth, and sending His disciples to every nation with the promise that He goes with them. The same promise is given in latter-day revelation to those He sends: “Be faithful unto the end, and lo, I am with you” ([[D&C 31:13]]), and “I am with the faithful always” ([[D&C 62:9]]). That promise holds for every disciple who believes in Him, keeps His commandments and trusts His promises.

explore: |
  - **The other tellings.** [[Mark 16:1–20]]; [[Luke 24]]; [[John 20–21]]; and Paul’s list of the witnesses, [[1 Cor. 15:3–8]].
  - **The frame of the Gospel.** [[Matt. 1:21–23]] beside verses 18–20.
  - **The risen Lord among the Nephites,** who gives the same words for baptism and sends twelve disciples: [[3 Ne. 11:1–28]].
  - **The guard at the tomb,** the scene this chapter answers: [[Matt. 27:62–66]].
  - The chapter “Easter Sunday” in *Greater Love Hath No Man* (Religious Studies Center) reads the three Synoptic accounts of the empty tomb side by side.

