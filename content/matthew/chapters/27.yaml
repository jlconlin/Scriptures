chapter: 27
title: The King of the Jews
tagline: The council hands Jesus to Pilate; Judas throws back the silver and dies; the crowd chooses Barabbas, and the soldiers crown Jesus with thorns; He is crucified and mocked, cries out at the ninth hour and gives up His life, and is laid in Joseph’s tomb under a sealed stone and a guard.
when: 'Friday of the last week, from early morning to evening; the guard is set on Saturday, the Sabbath'

setting: |
  Matthew 27 belongs to the Gospel’s last division, the Passion and the Resurrection (chapters 26–28). The night before, the council had condemned Jesus for blasphemy in the house of Caiaphas and Peter had denied Him three times ([[Matt. 26:57–75]]). Now it is morning, and the case goes to the Roman governor.

  For the Roman trial Matthew follows Mark’s order of events, and he adds to it: Judas’s remorse and death (verses 3–10), the earthquake at Jesus’s death (verse 51), and the guard sealed at the tomb (verses 62–66), which no other Gospel tells. Luke adds Jesus’s hearing before Herod Antipas ([[Luke 23:6–12]]), and John a longer exchange between Jesus and Pilate ([[John 18:33–38]]).

  The chapter is full of the Old Testament. Matthew names a prophecy fulfilled in the price of blood (verse 9) and in the parted garments (verse 35), and the footnotes trace the scene at Golgotha to Psalm 22, whose first line Jesus cries from the cross. The site’s chapters on [[Ps. 22]], [[Isa. 53]] and [[Zech. 11]] explain those passages in their first setting. Chapter 28 follows on from the sealed tomb.

thread: |
  **The charge is that He is a king, and His kingship runs through every scene that follows.**

  The council brings Jesus to Pilate on a charge that focuses on who He is: “Art thou the King of the Jews?” (verse 11). Pilate offers the people “Jesus which is called Christ” and they choose a rebel (verses 17–21). The soldiers dress Him as a king, with a robe, a crown of thorns and a reed for a sceptre, and kneel in mockery (verses 27–31). The charge is nailed over His head (verse 37). At the cross the passers-by take up the tempter’s old challenge, “If thou be the Son of God” (verse 40; see the note on [[Matt. 4:3]]), and the priests mock “the King of Israel” (verse 42). On one reading, what all of them deride is His kingship, and with it His right to judge (see the note on verse 29).

  The circle around Him gets smaller. Judas has gone to his death, the disciples have fled, and the women watch from afar. Then, as He dies, the veil of the temple is torn from the top, the earth shakes, and a Roman soldier says what the mockers would not: “Truly this was the Son of God” (verse 54). The chapter ends with His enemies sealing a tomb, because they remember that He said He would rise.

sections:
  - range: 1-2
    heading: Delivered to Pilate
    plain: |
      When morning came, all the chief priests and the elders of the people met and agreed to have Jesus put to death. They bound Him, led Him away, and handed Him over to Pontius Pilate, the governor.
  - range: 3-10
    heading: Judas and the price of blood
    plain: |
      When Judas, who had betrayed Him, saw that Jesus had been condemned, he was seized with regret. He brought the thirty pieces of silver back to the chief priests and elders and said, “I have sinned: I have betrayed innocent blood.” They answered, “What is that to us? That is your affair.” He threw the silver down in the temple, went away, and hanged himself. The chief priests picked up the silver and said, “It is not lawful to put this into the treasury, since it is the price of blood.” So after taking counsel they used it to buy the potter’s field as a burial place for strangers. That is why the field is still called the Field of Blood. So was fulfilled what was spoken by Jeremiah the prophet: “They took the thirty pieces of silver, the price set on him by some of the children of Israel, and gave them for the potter’s field, as the Lord directed me.”
  - range: 11-14
    heading: Before the governor
    plain: |
      Jesus stood before the governor, and the governor asked Him, “Are you the King of the Jews?” Jesus said, “You say so.” When the chief priests and elders brought their accusations, He gave no answer. Pilate said to Him, “Do you not hear how many things they testify against you?” But He did not answer a single charge, and the governor was greatly amazed.
  - range: 15-26
    heading: Barabbas or Jesus
    plain: |
      At the feast the governor used to release to the people one prisoner of their choosing, and at that time they had a notorious prisoner called Barabbas. So when the crowd had gathered, Pilate asked them, “Whom do you want me to release to you: Barabbas, or Jesus who is called Christ?” For he knew it was out of envy that they had handed Him over. While he was sitting on the judgment seat, his wife sent him a message: “Have nothing to do with that innocent man, for I have suffered much today in a dream because of him.” But the chief priests and elders persuaded the crowd to ask for Barabbas and to have Jesus killed. The governor asked again, “Which of the two do you want me to release to you?” They said, “Barabbas.” Pilate said, “Then what shall I do with Jesus who is called Christ?” They all said, “Let him be crucified!” “Why? What evil has he done?” asked the governor. But they shouted all the louder, “Let him be crucified!” When Pilate saw that he was getting nowhere and that a riot was starting instead, he took water and washed his hands in front of the crowd, saying, “I am innocent of this good man’s blood. It is your affair.” All the people answered, “His blood be on us and on our children!” Then he released Barabbas to them, and after having Jesus scourged he handed Him over to be crucified.
  - range: 27-31
    heading: The soldiers’ mockery
    plain: |
      Then the governor’s soldiers took Jesus into the governor’s residence and gathered the whole company around Him. They stripped Him and put a scarlet robe on Him, wove a crown of thorns and set it on His head, and put a reed in His right hand. Then they knelt in front of Him and mocked Him: “Hail, King of the Jews!” They spat on Him, took the reed and struck Him on the head with it. When they had finished mocking Him, they took off the robe, put His own clothes back on Him, and led Him away to crucify Him.
  - range: 32-44
    heading: Crucified at Golgotha
    plain: |
      As they went out they came upon a man from Cyrene named Simon, and they forced him to carry Jesus’s cross. When they came to a place called Golgotha, which means “the place of a skull,” they gave Him wine to drink mixed with gall; but when He had tasted it He would not drink it. They crucified Him and divided His clothes among them by casting lots, fulfilling what the prophet had said: “They divided my garments among them, and for my clothing they cast lots.” Then they sat down and kept watch over Him there. Above His head they put the written charge against Him: THIS IS JESUS THE KING OF THE JEWS. Two robbers were crucified with Him, one on His right and one on His left. Those who passed by insulted Him, shaking their heads and saying, “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.” The chief priests, with the scribes and elders, mocked Him in the same way: “He saved others, but he cannot save himself. If he is the King of Israel, let him come down from the cross now, and we will believe him. He trusted in God; let God deliver him now, if He wants him, for he said, ‘I am the Son of God.’” Even the robbers crucified with Him heaped the same insults on Him.
  - range: 45-56
    heading: The death of Jesus
    plain: |
      From noon until three in the afternoon darkness covered the whole land. At about three o’clock Jesus cried out with a loud voice, “Eli, Eli, lama sabachthani?” that is, “My God, my God, why have you forsaken me?” Some of those standing there heard it and said, “He is calling for Elijah.” One of them ran at once, took a sponge, filled it with sour wine, put it on a reed and gave it to Him to drink. The others said, “Wait, let us see whether Elijah comes to save him.” Jesus cried out again with a loud voice and gave up His spirit. At that moment the veil of the temple was torn in two from top to bottom. The earth shook, the rocks split, and the tombs were opened, and many bodies of the saints who had died were raised. They came out of the tombs after His resurrection, went into the holy city and appeared to many people. When the centurion and those with him who were guarding Jesus saw the earthquake and everything that happened, they were terrified and said, “Truly this was the Son of God.” Many women were there, watching from a distance. They had followed Jesus from Galilee and cared for His needs. Among them were Mary Magdalene, Mary the mother of James and Joses, and the mother of Zebedee’s sons.
  - range: 57-61
    heading: The burial
    plain: |
      When evening came, a rich man from Arimathea named Joseph, who had himself become a disciple of Jesus, went to Pilate and asked for Jesus’s body, and Pilate ordered it to be given to him. Joseph took the body, wrapped it in a clean linen cloth, and laid it in his own new tomb, which he had cut out of the rock. He rolled a great stone against the entrance of the tomb and went away. Mary Magdalene and the other Mary were there, sitting opposite the tomb.
  - range: 62-66
    heading: The guard at the tomb
    plain: |
      The next day, the day after the Preparation, the chief priests and Pharisees went together to Pilate. “Sir,” they said, “we remember that while that deceiver was still alive he said, ‘After three days I will rise again.’ So order the tomb to be made secure until the third day. Otherwise his disciples may come by night, steal him away, and tell the people, ‘He has risen from the dead,’ and the last deception will be worse than the first.” Pilate said to them, “You have a guard. Go and make it as secure as you can.” So they went and secured the tomb, sealing the stone and posting the guard.

notes:
  - ref: 2
    phrase: delivered him to Pontius Pilate the governor
    kind: history
    title: Why the council needed Pilate
    body: |
      The council had already condemned Jesus in the night ([[Matt. 26:66]]), but it took Him to the Roman governor because it could not carry out the sentence itself. Pontius Pilate was prefect of Judea from AD 26 to 36. He lived at Caesarea on the coast, where most of his small force was stationed, and came up to Jerusalem for the great feasts; in Jerusalem a single cohort of five hundred men kept the peace from the Antonia fortress beside the temple.

      Why the council could not act alone is less certain than it once seemed. The older explanation is that imperial Rome had reserved the death penalty to itself. A recent Latter-day Saint study thinks it just as likely that the council could not carry out an execution under its own law so near Passover. Either way, the governor’s sentence meant a Roman death, and Rome’s penalty for treason or rebellion was crucifixion.

      That is why the charge changes between the two chapters. The council had condemned Jesus for blasphemy ([[Matt. 26:65–66]]). Pilate’s first question, “Art thou the King of the Jews?” (verse 11), shows that they now brought a political accusation, one that fell within a governor’s competence.
    sources: [huntsman-good-friday, talmage-jesus-christ-34]
  - ref: 3
    phrase: repented himself
    kind: words
    title: What kind of repenting?
    body: |
      The word Matthew uses for Judas’s change of heart is not the one he uses for the repentance John and Jesus preached. When John cried “Repent ye” ([[Matt. 3:2]]) the verb was *metanoeō*. Here it is *metamelomai*, which properly means that something becomes “a care to one afterward”: regret, remorse. The difference can be pressed too hard: the sharp distinctions often drawn between the two verbs “seem hardly to be sustained by usage,” and Matthew uses this same verb for the son in the parable who “repented, and went” to the vineyard ([[Matt. 21:29]]). Still, *metanoeō* is the fuller word for a moral turning, and it is the one used as a command; *metamelomai* never is.

      Judas took his regret back to the men who had paid him. He may have hoped that his confession, “I have betrayed the innocent blood,” would move them to ask for the sentence to be reversed. They turned him away: “What is that to us? see thou to that.” The Joseph Smith Translation makes their answer harder still: “See thou to it; thy sins be upon thee” (JST Matt. 27:5). How Judas stands before God this verse does not settle. In Elder Jeffrey R. Holland’s words, “We are not the ones to judge Judas’s fate.”
    sources: [greek-nt, thayer, talmage-jesus-christ-34, jst-matt-27, holland-none-with-him]
  - ref: 5
    phrase: went and hanged himself
    kind: scripture
    title: Hanged, and fell
    body: |
      Acts tells Judas’s death another way, and the Joseph Smith Translation of this verse joins the two accounts. In Acts, Peter says that Judas fell headlong and his body burst open, and that Judas himself bought the field ([[Acts 1:18]]). If both records are accurate, Judas probably hanged himself and afterward fell, perhaps when the cord or the branch broke. The Joseph Smith Translation, given in the footnote, reads it that way: he “hanged himself on a tree. And straightway he fell down,” and died (JST Matt. 27:6).

      The two accounts also differ over who bought the field. One explanation is that the money had been Judas’s and was never formally taken back into the temple’s funds, so the field bought with it belonged technically to his estate. Differences like these matter mainly because they show that the two accounts were written independently; both agree that Judas died by his own hand.
    sources: [jst-matt-27, talmage-jesus-christ-34]
  - ref: 9
    phrase: spoken by Jeremy the prophet
    kind: scripture
    title: Jeremy, and the price of blood
    body: |
      “Jeremy” is Jeremiah, but the words Matthew quotes echo Zechariah. In Zechariah the shepherd is paid thirty pieces of silver ([[Zech. 11:12]]), which the LORD calls “a goodly price that I was prised at of them,” and he casts it “to the potter in the house of the LORD” ([[Zech. 11:13]]). The Church’s footnote on “potter’s field” in verse 7 points there. The site’s chapter on [[Jer. 19]], where Jeremiah breaks a potter’s jar in the valley that would be filled with graves, takes up why Matthew may have named Jeremiah.

      Matthew sets the fulfillment in a bitter irony. The chief priests who had paid for innocent blood would not put “the price of blood” into the temple treasury. Scrupulous over the money though not over the deed, they held a council over it and used it to buy a field to be set apart as a burial place for strangers. The money still did what the prophecy said: it was the price set on Him, and it went for the potter’s field.
    sources: [lds-scriptures, talmage-jesus-christ-34, strongs-greek]
  - ref: 11
    phrase: Thou sayest
    kind: christ
    title: An answer, and then silence
    body: |
      Jesus’s answer to Pilate acknowledges the title without arguing for it. “Thou sayest” means “That is what you say.” The Joseph Smith Translation makes the acknowledgment plain and ties it to scripture: “Thou sayest truly; for thus it is written of me” (JST Matt. 27:12).

      To everything else He answered nothing. The chief priests and elders accused Him, Pilate pressed Him, and “he answered him to never a word,” so that the governor marvelled (verses 12–14). It was a dignified silence, and it is the silence of the servant who “opened not his mouth” before his accusers (see the note at [[Isa. 53:7]]).
    sources: [huntsman-good-friday, lds-scriptures]
  - ref: 16
    phrase: a notable prisoner, called Barabbas
    kind: history
    title: Barabbas, son of the father
    body: |
      Barabbas was guilty of the very thing the council implied of Jesus. Matthew calls him only “notable,” or notorious, but Mark and Luke say he was held for murder in an insurrection ([[Mark 15:7]]; [[Luke 23:19]]): he was an insurgent against Rome, the crime the council implied Jesus was stirring up by claiming to be the Messiah. Whether the release at the feast was Pilate’s own practice, the custom of Roman governors, or a Jewish custom that Pilate had taken up is not known; but freeing a prisoner suited Passover, the feast of Israel’s deliverance from bondage.

      Some early manuscripts of Matthew give his first name as Jesus, so that Pilate offers the crowd a choice between Jesus Barabbas and Jesus who is called Christ. The name Barabbas could be Aramaic for “son of the father” (or “son of a teacher”), and was probably a nickname rather than a proper name. Elder Holland drew out the irony: “So one godless ‘son of the father’ was set free while a truly divine Son of His Heavenly Father moved on to crucifixion.”
    sources: [huntsman-good-friday, holland-none-with-him]
  - ref: 19
    phrase: his wife sent unto him
    kind: history
    title: A dream in Pilate’s house
    body: |
      Pilate’s wife appears in a single verse of Matthew’s account, and that verse ties her to others in his Gospel. She is warned in a dream, as Joseph and the wise men were ([[Matt. 1:20]]; [[Matt. 2:12–13]]). She is a Gentile who responds to Jesus, like the wise men, the centurion of Capernaum and the woman of Canaan, and like the centurion who will speak at the cross (verse 54). And she says she has “suffered many things,” the words Jesus had used when He first foretold His death ([[Matt. 16:21]]).

      She is set against her husband, who wavers, and against the leaders, who press for Jesus’s death. Whatever Pilate made of her warning, he gave way when he saw that he could not prevail and that a riot was starting (verse 24).
    sources: [huntsman-good-friday]
  - ref: 24
    phrase: washed his hands before the multitude
    kind: symbol
    title: Washing his hands
    body: |
      Pilate’s gesture was a symbolic act of disclaiming responsibility, and it seems to draw on Jewish practice and the Old Testament. When a murdered man was found and no one knew who had killed him, the elders of the nearest city washed their hands over a slain heifer and said, “Our hands have not shed this blood, neither have our eyes seen it” ([[Deut. 21:6–7]]); the psalmist says, “I will wash mine hands in innocency” ([[Ps. 26:6]]).

      The water could not make Pilate innocent. He had asked, “What evil hath he done?” (verse 23), and then, in Elder Jeffrey R. Holland’s words, “in an act as unconscionable as it was illogical,” he scourged the man he could find no fault in and handed Him over to be crucified. “Pilate’s freshly washed hands could not have been more stained or more unclean.”
    sources: [huntsman-good-friday, talmage-jesus-christ-34, holland-none-with-him]
  - ref: 25
    phrase: His blood be on us, and on our children
    kind: history
    title: '“His blood be on us”'
    body: |
      This cry came from the crowd before Pilate at that hour, and the verse speaks of no one else. Pilate had washed his hands and shifted the responsibility to the crowd (“see ye to it”), and the crowd took it on itself. The line has been tragically misused: from late antiquity to the mid-twentieth century Christians used it to accuse Jews of being “Christ killers.”

      Who was in the crowd matters. It was probably not large. Had the trial been at the Fortress Antonia, as tradition holds, there would have been no room for the thousands that popular imagination pictures; a gate of Herod’s palace, the more likely site, could have held a larger crowd, but the final sentencing probably took place in the palace’s inner court, where only the leaders and their retinue would have been admitted. Jesus’s disciples had fled at His arrest the night before. Matthew says the chief priests and elders “persuaded the multitude” (verse 20), and the crowd may have been made up largely of their own retainers and supporters, a small priestly group with few ordinary pilgrims in it. And the law that the Jews of that day lived by refused to visit a parent’s guilt on children: “neither shall the children be put to death for the fathers” ([[Deut. 24:16]]); “The son shall not bear the iniquity of the father” ([[Ezek. 18:20]]).

      Restoration scripture points the other way. Christ’s death was the Atonement He came to make, and every sinner has a part in why He died; in a very real way all are responsible. The Book of Mormon rebukes the Gentiles who have forgotten the Jews, “mine ancient covenant people,” and instead “have cursed them, and have hated them, and have not sought to recover them” ([[2 Ne. 29:4–5]]).
    sources: [huntsman-good-friday, lds-scriptures]
  - ref: 29
    phrase: plaited a crown of thorns
    kind: symbol
    title: A mock coronation
    body: |
      The soldiers stage a coronation to mock Jesus’s claim to be “King of the Jews.” They give Him a robe (scarlet here; purple in the Joseph Smith Translation, as in Mark and John, the colour of royalty), a crown woven of thorns, a reed in His right hand for a sceptre, a bended knee and a salute: “Hail, King of the Jews!” Then they spit on Him and beat Him on the head with the reed. The abuse was meant to degrade Him, and it fulfilled what Isaiah and Nephi had foreseen: “I gave my back to the smiters … I hid not my face from shame and spitting” ([[Isa. 50:6]]); “they spit upon him, and he suffereth it” ([[1 Ne. 19:9]]).

      On one reading, the whole crucifixion, from this hall to the cross, is a perverse mockery of the final judgment. The robe, the reed in the right hand, the mock title over His head (verse 37) and the two thieves “one on the right hand, and another on the left” (verse 38) recall the King who sets the sheep on His right hand and the goats on His left ([[Matt. 25:31–34]]), a scene Matthew had told only two chapters before. On this reading it is His kingship that is being derided, along with His right to judge, and after the mockery the risen Lord declares, “All power is given unto me in heaven and in earth” ([[Matt. 28:18]]).
    sources: [huntsman-good-friday, lds-scriptures, mitton-crucifixion-mockery]
  - ref: 32
    phrase: him they compelled to bear his cross
    kind: history
    title: Simon of Cyrene
    body: |
      A condemned man carried his own cross to the place of execution, though Jesus probably carried only the crossbeam. Gethsemane, the night’s abuse and the scourging had weakened Him, and He seems to have moved only slowly under it, so the soldiers pressed a passer-by into service. They had to compel him: no one would willingly take up such a burden, since everything connected with a crucifixion was thought degrading.

      Mark names Simon’s sons, Alexander and Rufus ([[Mark 15:21]]), which suggests that his readers knew them, and there is some indication that Simon’s household later came to believe. Nothing says that Simon had been a disciple before that morning. If he became one, it may have begun with the hours he spent so close to Jesus on the road to Golgotha.
    sources: [huntsman-good-friday, talmage-jesus-christ-35]
  - ref: 34
    phrase: vinegar to drink mingled with gall
    kind: words
    title: Why He would not drink
    body: |
      Jesus was offered two drinks at the cross, and the King James Version calls both of them “vinegar,” following its Greek text, which reads *oxos* in both places. Here, though, the SBL edition of the Greek reads *oinon*, “wine,” which agrees with Mark’s “wine mingled with myrrh” ([[Mark 15:23]]). The second drink, offered on a sponge just before He died (verse 48), was a much cheaper wine vinegar. “Gall” is not bile. In the Greek Old Testament the word stands for wormwood ([[Prov. 5:4]]), a bitter herb. It was the custom to offer the condemned a narcotic draught of this kind, to deaden the pain of execution. The Church’s footnote on “vinegar” sets the scene beside the psalm: “They gave me also gall for my meat” ([[Ps. 69:21]]).

      Jesus tasted the drink and, once He knew what it was, refused it. Matthew gives no reason. The refusal showed His “determination to meet death with faculties alert and mind unclouded”: He would drink the cup His Father had given Him ([[John 18:11]]) without dulling either the suffering or His communion with the Father.
    sources: [greek-nt, huntsman-good-friday, talmage-jesus-christ-35, ellicott-matthew, lds-scriptures]
  - ref: 45
    phrase: there was darkness over all the land
    kind: symbol
    title: Three hours of darkness
    body: |
      From the sixth hour to the ninth, from noon to about three in the afternoon, the land was dark. It was not an eclipse, for Passover fell at the full moon. It was a fitting sign of the earth mourning the death of her Creator.

      The Old Testament gave the darkness meaning. Darkness was the plague on Egypt just before the first Passover ([[Ex. 10:21–23]]), and the prophets foretold gloom and darkness on “the day of the LORD” ([[Amos 8:9]]; [[Zeph. 1:15]]). The Book of Mormon tells of darkness at His death among the Nephites too, there lasting three days. Samuel the Lamanite had foretold that “darkness should cover the face of the whole earth for the space of three days” ([[Hel. 14:27]]), and it did ([[3 Ne. 8:19–23]]). The Book of Mormon and latter-day authorities suggest that the darkness represented the life of Jesus, the Light of the World, ebbing out.
    sources: [talmage-jesus-christ-35, huntsman-good-friday, lds-scriptures]
  - ref: 46
    phrase: My God, my God, why hast thou forsaken me?
    kind: christ
    title: The cry at the ninth hour
    body: |
      Jesus’s cry is the first line of Psalm 22, and the psalm runs through Matthew’s whole account of the cross: the footnotes trace the parted garments (verse 35) to [[Ps. 22:18]] and the taunt “He trusted in God” (verse 43) to [[Ps. 22:8]]. The site’s notes at [[Ps. 22:1]] take up whether the cry names the whole psalm, and whether the Father forsook the Son.

      What the cry meant for the Savior is the reader’s deepest question here. It seems that, on top of the suffering of crucifixion, the agony of Gethsemane had returned, “intensified beyond human power to endure.” So that the sacrifice might be complete, the Father seems to have withdrawn the support of His immediate presence, “leaving to the Savior of men the glory of complete victory over the forces of sin and death.” Some who stood by misheard “Eli” as a call for Elias, Elijah (verses 47, 49), and waited to see whether he would come and save Him.
    sources: [lds-scriptures, talmage-jesus-christ-35]
  - ref: 50
    phrase: yielded up the ghost
    kind: christ
    title: He gave up His life
    body: |
      Matthew’s phrase is an ordinary way of saying that Jesus died. The Greek *aphēken to pneuma* means to send forth or yield up the spirit, “to expire,” and the King James renders it “yielded up the ghost.” Just before, He cried again with a loud voice, and the Joseph Smith Translation, in the footnote, gives the cry its words: “Father, it is finished, thy will is done” (JST Matt. 27:54).

      That His death was His own act rests not on the verb but on His own words: “No man taketh it from me, but I lay it down of myself” ([[John 10:18]]). His life was not taken from Him except as He willed to permit. Death would have been welcome relief at any earlier point from Gethsemane on, but He lived until everything appointed was done, and then voluntarily gave up His life.
    sources: [thayer, lds-scriptures, talmage-jesus-christ-35]
  - ref: 51
    phrase: the veil of the temple was rent in twain from the top to the bottom
    kind: symbol
    title: The veil torn from the top
    body: |
      That the veil was torn “from the top to the bottom” indicates that God tore it from above; no human hand did it. That veil shut off the Holy of Holies, the place of God’s presence, which only the high priest could enter, and only once a year on the Day of Atonement ([[Lev. 16:2]], [[Lev. 16:34]]). With its tearing the inner room that none but the high priest had seen lay open, and the Mosaic dispensation reached its consummation.

      Hebrews explains the way that was opened. Christ, the great High Priest, entered “by his own blood … once into the holy place, having obtained eternal redemption for us” ([[Heb. 9:12]]), and opened the way into God’s presence for all who follow Him.
    sources: [huntsman-good-friday, talmage-jesus-christ-35]
  - ref: 52
    phrase: many bodies of the saints which slept arose
    kind: scripture
    title: Saints who rose after Him
    body: |
      Matthew places the saints’ coming out of the graves “after his resurrection” (verse 53); the verse does not say exactly when they rose, only that they came out and were seen after the Lord Himself had risen. The Book of Mormon tells of the same sign. Samuel the Lamanite had prophesied that “many graves shall be opened, and shall yield up many of their dead; and many saints shall appear unto many” ([[Hel. 14:25]]). When the risen Lord found the fulfillment missing from the Nephite record He asked, “How be it that ye have not written this thing, that many saints did arise and appear unto many and did minister unto them?” and had it written ([[3 Ne. 23:9–13]]).
    sources: [lds-scriptures]
  - ref: 54
    phrase: Truly this was the Son of God
    kind: christ
    title: A Roman’s confession
    body: |
      The words the mockers had thrown at Jesus, “If thou be the Son of God” (verse 40) and “he said, I am the Son of God” (verse 43), a Roman officer now speaks as a confession. In Matthew it is the earthquake and what followed that bring the centurion and his men to it, “they feared greatly”; in Mark he speaks when he sees how Jesus died ([[Mark 15:39]]), and in Luke he says, “Certainly this was a righteous man” ([[Luke 23:47]]).

      The centurion joins the Gentiles in Matthew’s Gospel who respond to Jesus: the wise men from the east, the centurion at Capernaum ([[Matt. 8:5–13]]), the woman of Canaan ([[Matt. 15:21–28]]) and Pilate’s wife.
    sources: [huntsman-good-friday]
  - ref: 55
    phrase: many women were there beholding afar off
    kind: history
    title: The women who stayed
    body: |
      When Jesus died, the only followers Matthew places near Him are women. The men had fled at His arrest ([[Matt. 26:56]]), and in Matthew, Mark and Luke Jesus is largely alone at the cross, with a handful of women from Galilee watching from a distance. They saw how their Lord died. Matthew names three: Mary Magdalene, Mary the mother of James and Joses, and the mother of Zebedee’s children (see the note at [[Matt. 20:20]]). Two of them stayed to see where He was laid (verse 61), and they came back to the tomb on the first day of the week ([[Matt. 28:1]]).

      “Especially and always,” Elder Holland has said, “the blessed women in the Savior’s life stayed as close to Him as they could.”
    sources: [huntsman-good-friday, holland-none-with-him]
  - ref: 57
    phrase: a rich man of Arimathæa, named Joseph
    kind: history
    title: Joseph of Arimathæa
    body: |
      The man who buried Jesus was a member of the council that had condemned Him. Joseph of Arimathæa was a wealthy and respected member of the Sanhedrin. Luke says he had not consented to the council’s decision ([[Luke 23:50–51]]), and John says he was a disciple, but secretly, for fear of the other leaders ([[John 19:38]]). Matthew says simply that he “also himself was Jesus’ disciple.” Now he went to Pilate, “boldly,” Mark says ([[Mark 15:43]]), and asked for the body. He laid it in his own new tomb, cut in the rock, which the site’s note sets beside the servant who was “with the rich in his death” ([[Isa. 53:9]]).
    sources: [huntsman-good-friday]
  - ref: 64
    phrase: Command therefore that the sepulchre be made sure until the third day
    kind: history
    title: A seal and a watch
    body: |
      Only Matthew tells of the guard, and it shows that Jesus’s enemies remembered His promise to rise on the third day. On the Sabbath the chief priests and Pharisees came to Pilate, called Him “that deceiver,” and asked for the tomb to be made secure. Pilate answered, “Ye have a watch” (see the note at [[Matt. 28:13]] on whose guard it was). They sealed the stone with wax or clay pressed with the mark of the authority that set it, which would break if anyone, even the guards, moved the stone. A broken seal would be a witness that the tomb had been opened.

      Some scholars read the story in the setting of the later arguments between Matthew’s community and the synagogue after the temple fell in AD 70. Even read that way, there is no need to doubt that it happened. What became of the seal and the watch is told in [[Matt. 28:2–4]] and [[Matt. 28:11–15]].
    sources: [huntsman-saturday, talmage-jesus-christ-35]

christ: |
  Matthew 27 shows Jesus Christ judged falsely by every court of men: a council that wanted Him dead, a governor who knew He was innocent, a crowd, soldiers playing at His coronation, mockers at the cross. Through it all He is the King they deride, and He gives up His life because He chooses to. The Book of Mormon gives the reason: He was “lifted up by men” so that “even so should men be lifted up by the Father, to stand before me, to be judged of their works” ([[3 Ne. 27:14]]). Because He walked that last path alone, those who follow Him do not walk theirs alone: “we will never be left alone nor unaided, even if sometimes we may feel that we are.”

explore: |
  - **The psalm of the cross.** Read [[Ps. 22]] beside verses 35–46, and [[Isa. 53]] beside the whole chapter.
  - **The same day in the Americas.** [[3 Ne. 8–10]], the darkness and the voice, and [[3 Ne. 11:1–17]], the risen Lord showing the marks of the cross.
  - **The other tellings.** [[Mark 15]], [[Luke 23]] (Herod, the women of Jerusalem, the thief who repents) and [[John 18:28–40]] with [[John 19]] (the longer conversation with Pilate, the mother of Jesus at the cross).
  - Elder Jeffrey R. Holland’s general conference talk “None Were with Him” (April 2009) follows the Savior’s solitary journey from Gethsemane to the cross.

