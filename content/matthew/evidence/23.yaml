chapter: 23
claims:
  - where: when
    claim: 'On the Tuesday of the last week, by Mark’s chronology, Jesus taught in the temple courts, denounced the leaders’ hypocrisy, lamented over Jerusalem, and left for the Mount of Olives'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The first part of the day was spent again in the temple courts, where the Jerusalem authorities engaged in debates with Jesus … After denouncing their hypocrisy and contrasting them unfavorably with a poor widow, Jesus lamented over the fate of Jerusalem before leaving the temple'
  - where: setting
    claim: 'The chapter follows the questions put to Jesus in the temple; after the lament He leaves for the Mount of Olives and the prophecy of the city’s destruction'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Jesus lamented over the fate of Jerusalem before leaving the temple and the city for the Mount of Olives, where he delivered a prophecy of its coming destruction and the future end of the world to his closest disciples.'
  - where: setting
    claim: 'Mark and Luke have a brief condemnation of the scribes; Matthew expands it, extends it to the Pharisees and adds the woes'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'he proceeded to roundly condemn the aggrandizement of the experts at the law (Mark 12:38–40; parallel Luke 20:45‒47). Matthew’s account not only expands the indictment but also extends it to the Pharisees and adds seven damning “woes”'
  - where: setting
    claim: 'Matthew is harsher toward the Jewish leaders than any other Gospel, yet his Jesus never speaks against the law of Moses'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'he also displays greater harshness toward the Jewish leaders than any other Gospel writer. For example, Matthew records a long string of Jesus’s scathing rebukes of the scribes and Pharisees in Matthew 23.'
  - where: setting
    claim: '“Your synagogues” (23:34) is one sign that Matthew’s audience was in tension with the synagogue'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'In Matthew’s editorial passages the synagogue is always referred to as “their” synagogue (Matthew 4:23; 9:35; 12:9; 13:54) or “your” synagogue (Matthew 23:34).[10] Thus the synagogue stood in some tension with the church.'
  - where: setting
    claim: 'Luke records similar sayings at a Pharisee’s table earlier'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'A similar incident is recorded in Luke 11 in which the questioning of Jesus’s practice is then turned around and He calls the Pharisees’ vision of holiness into question.'
  - where: setting
    claim: 'Luke records the lament over Jerusalem on an earlier occasion'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'The lamentation had been uttered once before (Luke 13:34-35)'
  - where: setting
    claim: 'Jesus spoke primarily to the disciples, in the hearing of the multitude, then turned to the rulers'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Addressing Himself primarily to the disciples, yet speaking in the hearing of the multitude, He directed the attention of all to the scribes and Pharisees'
  - where: thread
    claim: 'The Pharisees sought to bring the temple’s holiness into every home'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'While other Jews of this time believed that these regulations in Leviticus applied only to the priests in the temple, the Pharisees’ goal was to bring the holiness of the temple into every home through applying these laws more broadly.'
  - where: thread
    claim: 'The Pharisees were trying to live holy lives; readers can liken them to themselves'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'When we realize that the Pharisees were trying to live a holy life in a world they saw as unclean, we can better identify with their efforts to be righteous, as well as their efforts to justify or defend themselves.'
  - where: 'note 23:2 “Keep their teaching, not their example”'
    claim: 'The scribes and Pharisees sat in Moses’ seat as expounders and administrators of the law and were to be obeyed in their rule; the warning was against their example'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'occupied the seat of Moses as doctrinal expounders and official administrators of the law, and who were therefore to be obeyed in their authoritative rule; but against their pernicious example the disciples were forcefully warned.'
  - where: 'note 23:2 “Keep their teaching, not their example”'
    claim: 'Matthew’s Jesus never speaks against the law of Moses and here appears to defend what many in a Jewish-Christian audience reverenced'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'he never speaks negatively about the law of Moses. … On at least one occasion, Jesus appears to have defended certain traditions that would have been reverenced by many in a Christian-Jewish audience due to centuries of tradition (see Matthew 23:3).'
  - where: 'note 23:2 “Keep their teaching, not their example”'
    claim: 'The heavy burdens were the multiplied traditional rules, from which officials excused themselves'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'the day was filled with traditional observances by which even the trivial affairs of life were encumbered; yet from bearing these and other grievous burdens hypocritical officials could find excuse for personal exemption.'
  - where: 'note 23:5 “Scripture worn to be seen”'
    claim: 'Phylacteries were parchment strips with texts of the law in leather cases, worn on forehead or arm'
    key: bd-phylacteries
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phylacteries?lang=eng'
    quote: 'Amulets fastened on the forehead or on the left arm. They were small strips of parchment inscribed with texts (see Ex. 13:1–10, 11–16; Deut. 6:4–9; 11:13–21) and enclosed in leather cases (see Matt. 23:5).'
  - where: 'note 23:5 “Scripture worn to be seen”'
    claim: 'The phylacteries carried the words of the Shema, which Jesus quoted as the great commandment'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'With the imperative call to attention with which Moses had summoned Israel to hear and heed, the very words of which were written on the phylacteries which the Pharisees wore as frontlets between their eyes, Jesus answered: “Hear, O Israel'
  - where: 'note 23:5 “Scripture worn to be seen”'
    claim: 'The footnotes point the phylacteries to Exodus 13 and Deuteronomy 6, and the borders to Numbers 15:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'Ex. 13:9 (9, 16); Deut. 6:8.'
  - where: 'note 23:8 “One Master, and all ye are brethren”'
    claim: 'Rabbi meant master or teacher; the title had come to outrank the priesthood; the apostles were not to seek worldly titles but to serve'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The high-sounding title, Rabbi, signifying Master, Teacher, or Doctor, had eclipsed the divinely recognized sanctity of priesthood; to be a rabbi of the Jews was regarded as vastly superior to being a priest of the Most High God.'
  - where: 'note 23:8 “One Master, and all ye are brethren”'
    claim: 'Those who would build the Church were not to aspire to titles; greatness comes through service'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Those upon whom would rest the responsibility of building the Church He had founded were not to aspire to worldly titles nor the honors of men; for those chosen ones were brethren'
  - where: 'note 23:8 “One Master, and all ye are brethren”'
    claim: 'The Joseph Smith Translation of verses 9–10 (JST Matt. 23:6–7)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'And call no one your creator upon the earth, or your heavenly Father; for one is your creator and heavenly Father, even he who is in heaven.'
  - where: 'note 23:13 “Woe: grief and warning”'
    claim: 'The Greek ouai is an interjection of grief or of denunciation, used in the Septuagint for the Hebrew hoy'
    key: thayer
    url: 'https://biblehub.com/greek/3759.htm'
    quote: 'οὐαί, an interjection of grief or of denunciation; the Sept. chiefly for הוי and אוי; "Alas! Woe!"'
  - where: 'note 23:13 “Woe: grief and warning”'
    claim: 'Jesus’s woes call the Pharisees and scribes to repentance for violating the law'
    key: sc-knowhy-35
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-declare-so-many-woes'
    quote: 'the Savior himself placed woes upon the Pharisees and scribes, calling them to repentance for their hypocritical violations of several requirements of the law (see Matthew 23).'
  - where: 'note 23:13 “Woe: grief and warning”'
    claim: 'The scribes and Pharisees shut the kingdom by making learning in the law the standard of piety and misleading the common people'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The Pharisaic standard of piety was the learning of the schools; one unversed in the technicalities of the law was accounted as unacceptable to God and veritably accursed.'
  - where: 'note 23:15 “Converts made worse”'
    claim: 'A proselyte was a Gentile incorporated into Judaism by circumcision, baptism and sacrifice; few in number, though sought with zeal'
    key: bd-proselytes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/proselytes?lang=eng'
    quote: 'Men of gentile birth who had been incorporated into the Jewish church. The ceremony of admission included circumcision, baptism, and a sacrifice. … Proselytes of this kind were probably few in number, though the Jews showed great zeal in their efforts to gain them (Matt. 23:15).'
  - where: 'note 23:15 “Converts made worse”'
    claim: 'The woe may be aimed at winning converts to the Pharisees’ party as much as to Judaism'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'It is possible that this woe was directed more against the effort to secure proselytes to Pharisaism than that of converting aliens to Judaism'
  - where: 'note 23:15 “Converts made worse”'
    claim: 'The Joseph Smith Translation of verse 15 (JST Matt. 23:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'than he was before, like unto yourselves.'
  - where: 'note 23:16 “Oaths with loopholes”'
    claim: 'The schools had rules by which an oath by the temple or altar could be annulled, but one by the gold or the gift was binding; Jesus, who had said swear not at all, required fidelity to oaths taken'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'If a man swore by the temple, the House of Jehovah, he could obtain an indulgence for breaking his oath; but if he vowed by the gold and treasure of the Holy House, he was bound by the unbreakable bonds of priestly dictum.'
  - where: 'note 23:16 “Oaths with loopholes”'
    claim: 'For those who still swore, strict fidelity to their oaths was required, without quibbles'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'upon those who persisted in the use of oaths and vows, the lesser and evidently just requirement of strict fidelity to the terms of self-assumed obligations was to be enforced, without unrighteous quibble or inequitable discrimination.'
  - where: 'note 23:23 “Tithing the herbs, leaving mercy”'
    claim: 'For the Pharisees proper tithing made food ritually acceptable, part of their program of holiness'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'Ritual purity also explains their emphasis on tithes because for them proper tithing of food made the “food ritually acceptable.”'
  - where: 'note 23:23 “Tithing the herbs, leaving mercy”'
    claim: 'The law named corn, wine and oil; the Pharisee tithed every garden herb; Jesus does not blame this but the substitution of the lower for the higher'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'The language of Deuteronomy 12:17 seems to recognise only corn, wine, and oil, among the produce of the earth, as subject to the law of tithes. The Pharisee, in his minute scrupulosity … made a point of gathering the tenth sprig of every garden herb'
  - where: 'note 23:23 “Tithing the herbs, leaving mercy”'
    claim: 'Jesus censured the substitution of the lower for the higher'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'What He did censure was the substitution of the lower for the higher.'
  - where: 'note 23:23 “Tithing the herbs, leaving mercy”'
    claim: 'The Lord approved the conscientious tithing even of herbs; He denounced its use as an excuse for neglecting other duties'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The conscientious tithing of all one’s possessions, even potherbs and other garden produce, was approved by the Lord; but He denounced as rank hypocrisy the observance of such requirements as an excuse for neglecting the other duties of true religion.'
  - where: 'note 23:23 “Tithing the herbs, leaving mercy”'
    claim: 'The critique is framed around what they lacked, sins of omission'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'as in Matthew 23 where similar critiques appear, that these comments are not framed as an attack on the Pharisees’ practices, but rather focus on what they yet lack … It is the sins of omission that become the barrier to true holiness.'
  - where: 'note 23:24 “Straining out the gnat”'
    claim: '“Strain at” is better “strain out”; devout Jews literally strained their drink; the gnat and the camel were both unclean'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'Better, as in Tyndale’s and other earlier versions, strain out.'
  - where: 'note 23:24 “Straining out the gnat”'
    claim: 'The straining was practised literally under Leviticus 11; the camel was an unclean beast'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'The scrupulous care described in the first clause of the proverbial saying was literally practised by devout Jews … in accordance with Leviticus 11:23; Leviticus 11:42. In the second clause, the camel appears … as being among the unclean beasts of which the Israelites might not eat (Leviticus 11:4).'
  - where: 'note 23:27 “Clean cups and whitewashed tombs”'
    claim: 'Jesus did not depreciate cleanliness; vessels were filthy if what they held came from extortion or served excess'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Cleanliness the Lord in no wise depreciated; His shafts of disapprobation were aimed at the hypocrisy of maintaining at once outward spotlessness and inward corruption.'
  - where: 'note 23:27 “Clean cups and whitewashed tombs”'
    claim: 'The Pharisees’ program of holiness focused on purifying vessels'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'It led the Pharisees to focus on the purification of vessels and the washing of hands to make the meals ritually pure.'
  - where: 'note 23:27 “Clean cups and whitewashed tombs”'
    claim: 'Contact with a grave defiled; tombs were whitened so no one would be defiled unknowingly'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'care was taken to make tombs conspicuously white, so that no person need be defiled through ignorance of proximity to such unclean places'
  - where: 'note 23:27 “Clean cups and whitewashed tombs”'
    claim: 'Earlier Jesus had compared them to unmarked graves; here to whitened tombs'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Jesus had before compared Pharisees with unmarked graves, over which men inadvertently walked and so became defiled though they knew it not; on the occasion now under consideration He denounced them as whitened tombs, flauntingly prominent, but sepulchres nevertheless.'
  - where: 'note 23:30 “Their fathers’ sins and their own”'
    claim: 'Honoring the prophets’ tombs was national pride; disavowing their fathers, they owned themselves the murderers’ children'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'National pride, not wholly unlike patriotism, had for centuries expressed itself in formal regard for the burial crypts of the ancient prophets, many of whom had been slain because of their righteous and fearless zeal.'
  - where: 'note 23:30 “Their fathers’ sins and their own”'
    claim: 'They would kill the messengers sent to them, and so be murderers themselves; the woes would be realized in that generation'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'and thus would prove themselves literal sons of murderers, and murderers themselves'
  - where: 'note 23:30 “Their fathers’ sins and their own”'
    claim: 'The woes were to be realized in that generation'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'That dread fate, outlined with such awful realism, was to be no eventuality of the distant future; every one of the frightful woes the Lord had uttered was to be realized in that generation.'
  - where: 'note 23:30 “Their fathers’ sins and their own”'
    claim: 'The Joseph Smith Translation of verse 36 (JST Matt. 23:33–35)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'Ye bear testimony against your fathers, when ye, yourselves, are partakers of the same wickedness. Behold your fathers did it through ignorance, but ye do not; wherefore, their sins shall be upon your heads.'
  - where: 'note 23:35 “Which Zacharias?”'
    claim: 'The Old Testament records no martyr Zacharias son of Barachias but records Zechariah son of Jehoiada; most scholars identify him; his is the last martyrdom in the Jewish order of the books'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'It is the opinion of most Bible scholars that the Zacharias referred to in Matthew’s record is Zechariah son of Jehoiada. In the Jewish compilation of Old Testament scriptures, the murder of Zechariah appears as the last recorded martyrdom'
  - where: 'note 23:35 “Which Zacharias?”'
    claim: 'Talmage thought a fuller account may have been in scriptures since lost'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'It is likely that a fuller account appeared in scriptures current among the Jews at the time of Christ but since lost.'
  - where: 'note 23:35 “Which Zacharias?”'
    claim: 'The Bible Dictionary distinguishes John the Baptist’s father from the Zacharias slain between temple and altar, referring the latter to 2 Chronicles 24'
    key: bd-zacharias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zacharias?lang=eng'
    quote: '(2) Slain between the temple and the altar (Matt. 23:35; Luke 11:51; see also 2 Chr. 24:20–22).'
  - where: 'note 23:35 “Which Zacharias?”'
    claim: 'Barachias may be a transcriber’s substitution for Jehoiada; the son of Jehoiada’s death was famous and explains its choice'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'The substitution of Barachias for Jehoiada may be accounted for as the mistake of a transcriber, led by the association of the two names, like that of Jeremy for Zechariah in Matthew 27:9'
  - where: 'note 23:35 “Which Zacharias?”'
    claim: 'That two Zechariahs were confused is now generally accepted by biblical scholars; Luke lacks the father’s name'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'The former option—that someone made a mistake—is now generally accepted by biblical scholars.'
  - where: 'note 23:35 “Which Zacharias?”'
    claim: 'Later versions of the Protevangelium of James made the slain Zacharias the father of John the Baptist'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'These later versions contended that the Zechariah slain near the temple altar was neither the ninth-century high priest “Zechariah, son of Jehoiada” nor the sixth-century prophet “Zechariah, son of Berechiah,” but a first-century Zacharias, the father of John the Baptist.'
  - where: 'note 23:35 “Which Zacharias?”'
    claim: 'An unsigned 1842 Times and Seasons article repeated it and was placed in Teachings of the Prophet Joseph Smith; no evidence Joseph Smith wrote or approved it'
    key: wilson-zacharias
    url: 'https://rsc.byu.edu/vol-14-no-2-2013/confusing-case-zacharias'
    quote: 'Although we know of no evidence that Joseph Smith wrote, delegated, or approved the publication of this article referencing Zacharias, it still found its way into Joseph Fielding Smith’s compilation, Teachings of the Prophet Joseph Smith, in 1938.'
  - where: 'note 23:37 “The Lord who sent the prophets”'
    claim: 'In verse 34 Jehovah Himself answers, predicting they would kill the messengers He would send'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'To their sanctimonious asseverations of superiority over their fathers who had slain Jehovah’s envoys, Jehovah Himself replied by predicting that they would dye their hands in the blood of prophets, wise men, and righteous scribes, whom He would send amongst them'
  - where: 'note 23:37 “The Lord who sent the prophets”'
    claim: 'Israel spurned the protecting wing'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The children of Israel had spurned the proffered safety of a protecting paternal wing; soon the Roman eagle would swoop down upon them and slay.'
  - where: 'note 23:37 “The Lord who sent the prophets”'
    claim: '“Ye would not” states man’s freedom to frustrate even God’s love'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'No words could more emphatically state man’s fatal gift of freedom, as shown in the power of his will to frustrate the love and pity, and therefore the will, even of the Almighty.'
  - where: 'note 23:37 “The Lord who sent the prophets”'
    claim: 'In 3 Nephi 10 the hen image comes in three tenses, past, present and future'
    key: sc-knowhy-200
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-christ-compare-himself-to-a-hen'
    quote: 'This metaphor was repeated four times in three successive verses, and was even used in three different tenses'
  - where: 'note 23:37 “The Lord who sent the prophets”'
    claim: 'Christ can be compared to the hen in gathering His people and in the Atonement that shelters them from sin and death'
    key: sc-knowhy-200
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-christ-compare-himself-to-a-hen'
    quote: 'Jesus can be meaningfully compared to a mother hen in His role as Creator, in His ongoing efforts to gather and unify His people, and in His atoning sacrifice, which shelters and protects His people from the terrible consequences of sin and death.'
  - where: 'note 23:38 “The house left, until He comes again”'
    claim: '“Your house” is the temple, no longer His; spoken as He left it, never to return'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
    quote: 'It had been the house of God, but He, as represented by His Son, was now leaving it for ever. It was their house now, not His. We must remember that the words were spoken as our Lord was “departing from the Temple” (Matthew 24:1), never to reappear there.'
  - where: 'note 23:38 “The house left, until He comes again”'
    claim: 'Jesus had called the temple “My house”; now it is “your house”'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The stupendous temple, which but a day before the Lord had called “My house,” was now no longer specifically His; “Your house,” said He, “is left unto you desolate.”'
  - where: 'note 23:38 “The house left, until He comes again”'
    claim: 'The words of Psalm 118:26 had been shouted at the entry; the verse points to the Second Coming'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/23.htm'
