chapter: 18
claims:
  - where: setting
    claim: 'Matthew 18 is the Church Administration discourse, the fourth of five, closed at 19:1 with “when Jesus had ended these sayings”'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'the Kingdom of God discourse (Matthew 13), the Church Administration discourse (Matthew 18), and the Eschatological discourse (Matthew 24–25). … At the end of each of the first four discourses, he added, “And it came to pass, when Jesus had ended these” sayings'
  - where: setting
    claim: 'The discourse was given in the house at Capernaum'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'When they were together with Jesus in the house at Capernaum, the subject was brought up again.'
  - where: setting
    claim: 'Matthew is the only Gospel to use the word church for the community of believers'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'Matthew’s is the only Gospel in the New Testament to use the term church (Greek ekklesia) in referring to the organized community of believers.'
  - where: setting
    claim: 'The Joseph Smith Translation of chapter 18 shows the Church’s concern that its members live by Christ’s standards'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'the Joseph Smith translation makes it clear that the Church exists not only to administer the gospel through the ordinances but also to see to it that those within the Church live lives consistent with the high standards set by Christ. This is apparent in chapter 18:'
  - where: when
    claim: 'In the house at Capernaum'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'When they were together with Jesus in the house at Capernaum, the subject was brought up again.'
  - where: thread
    claim: 'The chapter is the discourse on Church administration'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'the Church Administration discourse (Matthew 18)'
  - where: thread
    claim: 'The lost sheep is told to elucidate the mission of saving the lost, after the warning about the little ones'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The mission of the Christ was presented as that of saving those who are temporarily lost, and who, but for His aid would be lost forever. In elucidation of His meaning, the Teacher presented a parable'
  - where: 'note 18:1 “A question that began as a quarrel”'
    claim: 'Matthew does not mention the contention; the disciples ask openly'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Matthew doesn’t acknowledge the contention and simply states that they approached Jesus and openly asked, “Who is the greatest in the kingdom of heaven?” (Matthew 18:1).'
  - where: 'note 18:1 “A question that began as a quarrel”'
    claim: 'Both accounts correct; Christ’s question may have brought out theirs'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The apparent difference of circumstance is unimportant; both accounts are correct; Christ’s question to them may have eventually brought out their questions to Him.'
  - where: 'note 18:1 “A question that began as a quarrel”'
    claim: 'They knew Jesus was the Christ but still expected a temporal king; a near crisis; they contemplated offices; ambition bred jealousy'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'With minds still tinctured by the traditional expectation of the Messiah as both spiritual Lord and temporal King, … they surrendered themselves to the selfish contemplation of their prospective stations in the new kingdom … Personal ambition had already engendered jealousy in their hearts.'
  - where: 'note 18:1 “A question that began as a quarrel”'
    claim: 'His recent words seemed to point to a crisis near at hand'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'realizing that His recent utterances indicated a near crisis or climax in His ministry'
  - where: 'note 18:3 “Turned around”'
    claim: 'strephō: to turn, turn round'
    key: thayer
    url: 'https://biblehub.com/greek/4762.htm'
    quote: 'STRONGS NT 4762: στρέφω … to turn, turn round'
  - where: 'note 18:3 “Turned around”'
    claim: 'Matthew alone has the saying; straphēte means to turn, turn around, reverse, return, change'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Matthew’s unique addition “to be converted and become as little children” as a preliminary condition to enter the kingdom of heaven introduces the concept of “conversion” (Matthew 18:3). The Greek word is straphēte, meaning to always be engaged in, to turn, turn around, reverse, return, or change.'
  - where: 'note 18:3 “Turned around”'
    claim: 'Even the apostles needed conversion; their hearts were partly turned from God'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Even the apostles were in need of conversion; respecting the matter at issue their hearts were turned, partly at least, from God and His kingdom.'
  - where: 'note 18:4 “Childlike, not childish”'
    claim: 'The child’s humility, poverty and dependence are tied to righteousness in Jesus’s message'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'in the message of Jesus, the essential characteristics of children as humble, poor, and dependent seem intrinsically connected to the definition of righteousness.'
  - where: 'note 18:4 “Childlike, not childish”'
    claim: 'Entering the kingdom depends on reliance on the Atonement as a child relies on a caregiver'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'our receving of the kingdom of God is fully dependent on our faithful reliance on the atoning blood of Jesus Christ to enter the kingdom of heaven, just as a little child or infant relies on a cargiver for life'
  - where: 'note 18:4 “Childlike, not childish”'
    claim: 'Childlike, not childish; the qualities; Paul’s counsel'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'they had to be men of courage, fortitude, and force; but He would have them become childlike. The distinction is important. Those who belong to Christ must become like little children in obedience, truthfulness, trustfulness, purity, humility, and faith.'
  - where: 'note 18:4 “Childlike, not childish”'
    claim: 'Mosiah 3:19, given in the footnote to verse 3: becoming as a child through the Atonement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'putteth off the natural man and becometh a saint through the atonement of Christ the Lord, and becometh as a child, submissive, meek, humble, patient, full of love'
  - where: 'note 18:4 “Childlike, not childish”'
    claim: 'The humblest shall be greatest'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'the degree of humility conditions whatsoever there is akin to rank in the kingdom; for therein the humblest shall be greatest.'
  - where: 'note 18:6 “The donkey’s millstone”'
    claim: 'The little ones are children and childlike believers; offend is cause to stumble; the guilt worse than violent death'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Children as such, and children as types of adults who are true believers, are closely associated in this lesson. Whosoever shall offend, that is cause to stumble or go astray, one such child of Christ, incurs guilt so great'
  - where: 'note 18:6 “The donkey’s millstone”'
    claim: 'mylos onikos: a millstone turned by an ass'
    key: thayer
    url: 'https://biblehub.com/greek/3684.htm'
    quote: 'ὀνικός, ὀνικη, ὀνικον (ὄνος), of or for an ass: μύλος ὀνικός i. e. turned by an ass (see μύλος, 1), Mark 9:42 L T Tr WH; Luke 17:2 Rec.; Matthew 18:6.'
  - where: 'note 18:6 “The donkey’s millstone”'
    claim: 'The larger stone-mill, not the handmill; not a Jewish punishment but Greek'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'The word for “millstone” indicates the larger stone-mill, in working which an ass was commonly employed, as distinguished from the smaller handmill of Luke 17:35. The punishment was not recognised in the Jewish law, but it was in occasional use among the Greeks'
  - where: 'note 18:6 “The donkey’s millstone”'
    claim: 'Inflicted by Augustus for special infamy; deprived the dead of burial'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'had been inflicted by Augustus (Sueton. Aug. lxvii.) in cases of special infamy. … its chief horror, both for Jews and heathen, was, probably, that it deprived the dead of all rites of burial.'
  - where: 'note 18:9 “A hand that is a friend”'
    claim: 'Without the translation, the saying urges rooting out evil passions whatever the cost'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'so is it commended that he cut off, tear away, or root out from his soul the passions of evil, which, if suffered to remain shall surely bring him under condemnation.'
  - where: 'note 18:9 “A hand that is a friend”'
    claim: 'JST Matt. 18:9 in the footnote: the hand a friend, the eye of his own household'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/18?lang=eng'
    quote: 'And a man’s hand is his friend, and his foot, also; and a man’s eye, are they of his own household.'
  - where: 'note 18:9 “A hand that is a friend”'
    claim: 'JST Matt. 5:34 in the footnote: in the Sermon the saying is a parable concerning one’s sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'And now this I speak, a parable concerning your sins; wherefore, cast them from you, that ye may not be hewn down and cast into the fire.'
  - where: 'note 18:9 “A hand that is a friend”'
    claim: 'JST Mark 9:40 names the brother who confesses not'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: '40. Therefore, if thy hand offend thee, cut it off; or if thy brother offend thee and confess not and forsake not, he shall be cut off. . . .'
  - where: 'note 18:9 “A hand that is a friend”'
    claim: 'JST Mark 9:42: the foot is the standard by whom one walks'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: '42. And again, if thy foot offend thee, cut it off; for he that is thy standard, by whom thou walkest, if he become a transgressor, he shall be cut off. . . .'
  - where: 'note 18:9 “A hand that is a friend”'
    claim: 'The changes define cutting off as excommunication, to keep the Church pure'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'The Prophet’s changes define what it means to pluck out an eye or cut off a hand: excommunication or severance from the body of Christ was occasionally necessary to maintain the purity of the Church.'
  - where: 'note 18:10 “Their angels”'
    claim: 'The words recognize guardian angels; those of the little ones are like the angels of the Presence, like Gabriel'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'The words distinctly recognise the belief in guardian angels, entrusted each with a definite and special work. … those who have the guardianship of the little ones assigned to them are among the most noble of the heavenly host, and are as the angels of the Presence, who, like Gabriel, stand before the face of God'
  - where: 'note 18:10 “Their angels”'
    claim: 'Jesus adopts the belief in angels when the Sadducees questioned it'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'There can be no question that our Lord adopts as His own the belief in the reality of that ministry, and this at a time when the Sadducees, as a leading sect, were calling it in question (Acts 23:8).'
  - where: 'note 18:10 “Their angels”'
    claim: 'The Sadducees denied angels'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/23?lang=eng'
    quote: 'For the Sadducees say that there is no resurrection, neither angel, nor spirit: but the Pharisees confess both.'
  - where: 'note 18:10 “Their angels”'
    claim: 'The warning applies to children and to childlike believers'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'As applicable to children of tender years, and to childlike believers young and old, the Savior gave to the apostles this solemn warning and profound statement of fact'
  - where: 'note 18:11 “Little ones who need no repentance”'
    claim: 'Verse 11 is wanting in many of the best manuscripts'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: '(11) For the Son of man is come.—The words are wanting in many of the best MSS.'
  - where: 'note 18:11 “Little ones who need no repentance”'
    claim: 'JST Matt. 18:11'
    key: jst-matt-18
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/18?lang=eng'
    quote: 'For the Son of man is come to save that which was lost, and to call sinners to repentance; but these little ones have no need of repentance, and I will save them.'
  - where: 'note 18:11 “Little ones who need no repentance”'
    claim: 'The JST words agree with the Book of Mormon, the D&C and the JST of Genesis on accountability'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'These words are consistent with the counsel in the Book of Mormon (Mosiah 3:16; Moro. 8), the revelations of the Doctrine and Covenants (D&C 20:71; 29:46, 68:25–27), and also principles Joseph had learned about accountability while translating Genesis (Gen. 17:11, JST).'
  - where: 'note 18:12 “The shepherd and the little ones”'
    claim: 'Luke’s is a later version, addressed to the murmuring Pharisees and scribes'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'In a later version of this splendid parable, as addressed to the murmuring Pharisees and scribes at Jerusalem'
  - where: 'note 18:12 “The shepherd and the little ones”'
    claim: 'The parable makes prominent the saving purpose of Christ’s mission'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'In this effective analogy the saving purpose of Christ’s mission is made prominent. He is verily the Savior.'
  - where: 'note 18:12 “The shepherd and the little ones”'
    claim: 'The mission is saving those temporarily lost, who without Him would be lost forever'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The mission of the Christ was presented as that of saving those who are temporarily lost, and who, but for His aid would be lost forever.'
  - where: 'note 18:12 “The shepherd and the little ones”'
    claim: 'The greater joy over the one is brighter because of recent grief'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'In the safe-folded ninety and nine the shepherd had continued joy; but to him came a new accession of happiness, brighter and stronger because of his recent grief, when the lost was brought back to the fold.'
  - where: 'note 18:15 “The injured one goes first”'
    claim: 'The rabbis’ rule: the offender makes the first advance; Jesus: the injured goes himself'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The rule of the rabbis was that the offender must make the first advance; but Jesus taught that the injured one should not wait for his brother to come to him, but go himself, and seek to adjust the difficulty; by so doing he might be the means of saving his brother’s soul.'
  - where: 'note 18:15 “The injured one goes first”'
    claim: 'Witnesses guard against later misrepresentation'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'such a course provided for witnesses, by whose presence later misrepresentation would be guarded against.'
  - where: 'note 18:15 “The injured one goes first”'
    claim: 'The law of two or three witnesses in Deuteronomy 19:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/19?lang=eng'
    quote: 'at the mouth of two witnesses, or at the mouth of three witnesses, shall the matter be established.'
  - where: 'note 18:15 “The injured one goes first”'
    claim: 'Extreme measures only after gentler means; the restored Church’s order is similar'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Extreme measures were to be adopted only after all gentler means had failed. … The revealed order of discipline in the restored Church is similar to that given to the apostles of old.'
  - where: 'note 18:15 “The injured one goes first”'
    claim: 'D&C 42:89: delivered to the elders, not before the world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/42?lang=eng'
    quote: 'And if he or she confess not thou shalt deliver him or her up unto the church, not to the members, but to the elders. And it shall be done in a meeting, and that not before the world.'
  - where: 'note 18:17 “As a heathen and a publican”'
    claim: 'Deprived of fellowship; a fit subject for missionary effort'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'he was to be deprived of fellowship, thereby becoming in his relationship to his former associates “as an heathen man and a publican.” In such state of nonmembership he would be a fit subject for missionary effort'
  - where: 'note 18:17 “As a heathen and a publican”'
    claim: 'No rights of communion until repentant; continued association may spread disaffection'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'until he became repentant and manifested willingness to make amends, he could claim no rights or privileges of communion in the Church. Continued association with the unrepentant sinner may involve the spread of his disaffection'
  - where: 'note 18:17 “As a heathen and a publican”'
    claim: 'The offender excommunicates himself; not the Pharisees’ contempt as a pattern'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'Should he defy that opinion and persist in his evil doing, he practically excommunicates himself. … we can hardly think of our Lord as holding up the Pharisees’ way of acting towards “the heathen and the publican” as a pattern for imitation.'
  - where: 'note 18:17 “As a heathen and a publican”'
    claim: 'Outside the circle of brotherhood but entitled to courtesy'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'They were to be made to feel that they were no longer within the inner circle of brotherhood, but they were still men, and, as such, entitled to courtesy and all kindly offices.'
  - where: 'note 18:18 “The keys held by the Twelve”'
    claim: 'The keys come to be held jointly among the Twelve; D&C 124:128 confirms'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'But Peter does not have to carry this responsibility by himself. As a matter of fact, the keys come to be held jointly among the Twelve, as Jesus later implies'
  - where: 'note 18:18 “The keys held by the Twelve”'
    claim: 'A revelation of January 1841 confirms that the Twelve hold the keys'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'A revelation that the Prophet Joseph Smith received in January 1841 confirms this observation: “[The] Twelve hold the keys to open up the authority of my kingdom upon the four corners of the earth” (Doctrine and Covenants 124:128'
  - where: 'note 18:18 “The keys held by the Twelve”'
    claim: '“The disciples” here are in this case limited to the Twelve'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'The expression “the disciples” is in some cases limited to the Twelve, as implied in Matthew 18:18'
  - where: 'note 18:18 “The keys held by the Twelve”'
    claim: 'The promise to Peter confirmed to the Twelve as a body, attesting their authority in Church government'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The authority of the Twelve to administer the affairs of Church government was attested by the Lord’s confirming to them as a body the promise before addressed to Peter'
  - where: 'note 18:18 “The keys held by the Twelve”'
    claim: 'Unity of purpose gives power with God (verses 19–20)'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Through unity of purpose and unreserved sincerity they would have power with God, as witness the Master’s further assurance'
  - where: 'note 18:18 “The keys held by the Twelve”'
    claim: 'D&C 6:32 repeats the promise “as I said unto my disciples”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/6?lang=eng'
    quote: 'Verily, verily, I say unto you, as I said unto my disciples, where two or three are gathered together in my name, as touching one thing, behold, there will I be in the midst of them—even so am I in the midst of you.'
  - where: 'note 18:22 “Seventy times seven”'
    claim: 'Peter thought seven liberal since the rabbis prescribed three'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'he probably considered the tentative suggestion of seven times as a very liberal measure, inasmuch as the rabbis prescribed a triple forgiveness only.'
  - where: 'note 18:22 “Seventy times seven”'
    claim: 'hebdomēkontakis hepta: seventy times seven, countless times, or seventy-seven; the word in Genesis 4:24'
    key: thayer
    url: 'https://biblehub.com/greek/1441.htm'
    quote: 'ἑβδομηκοντάκις (Genesis 4:24), seventy times: ἑβδομηκοντάκις ἑπτά, seventy times seven times, i. e. countless times, Matthew 18:22 … others (cf. R. V. marginal reading) seventy-seven times'
  - where: 'note 18:22 “Seventy times seven”'
    claim: 'Lamech’s seventy-seven, a symbol of vengeance, made by Jesus a symbol of perfect forgiveness'
    key: bowen-jewish-hermeneutics
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/jewish-hermeneutics-new-testament-period'
    quote: 'If seven and seventy-seven constitute symbols of vengeance and an absence of forgiveness in that account, Jesus makes it a symbol of perfect forgiveness.'
  - where: 'note 18:22 “Seventy times seven”'
    claim: 'Seven means completeness; to forgive completely and entirely'
    key: ball-peters-witness
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/whom-say-ye-i-am-peters-witness-christ'
    quote: 'the number seven came to mean completeness or wholeness in Hebrew culture. … Accordingly, in instructing Peter to forgive seven times seventy, Christ is telling the Apostle to forgive completely and entirely.'
  - where: 'note 18:22 “Seventy times seven”'
    claim: 'The Savior told Peter not to count'
    key: robbins-seventy-times-seven
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/until-seventy-times-seven?lang=eng'
    quote: 'In response, the Savior essentially told Peter to not even count—to not establish limits on forgiveness.'
  - where: 'note 18:22 “Seventy times seven”'
    claim: 'Not an upper limit of 490'
    key: robbins-seventy-times-seven
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/until-seventy-times-seven?lang=eng'
    quote: 'Obviously, the Savior was not establishing an upper limit of 490.'
  - where: 'note 18:24 “Ten thousand talents and a hundred pence”'
    claim: 'A sum beyond paying; probably a high official over the royal revenues; all are servants in an absolute monarchy'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Ten thousand talents are specified as expressive of a sum so great as to put the debtor beyond all reasonable possibility of paying. We may regard the man as a trusted official, one of the king’s ministers, who had been charged with the custody of the royal revenues'
  - where: 'note 18:24 “Ten thousand talents and a hundred pence”'
    claim: 'Called a servant because under an absolute monarch all are servants'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'that he is called a servant introduces no inconsistency, as in an absolute monarchy all but the sovereign are subjects and servants.'
  - where: 'note 18:24 “Ten thousand talents and a hundred pence”'
    claim: 'Selling the family not against the law in the supposed case; he had to be brought'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The selling of the debtor’s wife and children and all that he had would not have been in violation of the law in the supposed case, which implies the legal recognition of slavery. The man was in arrears for debt. He did not come before his lord voluntarily but had to be brought.'
  - where: 'note 18:24 “Ten thousand talents and a hundred pence”'
    claim: 'The exact amounts are minor; the point is disparity; which talent is not said'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'the Lord intended to present a case of great disparity and striking contrast. The actual amounts involved are of minor significance in the story. We are not told which variety of talent was meant'
  - where: 'note 18:24 “Ten thousand talents and a hundred pence”'
    claim: 'A hundred pence about three months’ wages'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/18?lang=eng'
    quote: 'approximately three months’ wages of a poor working man'
  - where: 'note 18:24 “Ten thousand talents and a hundred pence”'
    claim: 'If 100 pence were $100, 10,000 talents approached $1 billion; scholars differ on values'
    key: holland-perfect-eventually
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/be-ye-therefore-perfect-eventually?lang=eng'
    quote: 'There is some difference of opinion among scholars regarding the monetary values mentioned here … if the smaller, unforgiven 100-pence debt were, say, $100 in current times, then the 10,000-talent debt so freely forgiven would have approached $1 billion—or more!'
  - where: 'note 18:24 “Ten thousand talents and a hundred pence”'
    claim: 'An unfathomable measure for an unfathomable gift'
    key: holland-perfect-eventually
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/be-ye-therefore-perfect-eventually?lang=eng'
    quote: 'Jesus uses an unfathomable measurement here because His Atonement is an unfathomable gift given at an incomprehensible cost.'
  - where: 'note 18:33 “Mercy is for the merciful”'
    claim: 'The plea repeats his own; ingratitude justified revoking the pardon; condemned for lack of mercy'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The base ingratitude of the unmerciful servant justified the king in revoking the pardon once granted. The man came under condemnation, not primarily for defalcation and debt, but for lack of mercy after having received of mercy so abundantly.'
  - where: 'note 18:33 “Mercy is for the merciful”'
    claim: 'The fellowservant’s plea should have reminded him of his own'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'the greater debtor should have been reminded of the dire straits from which he had just been relieved; the words, “Have patience with me, and I will pay thee all,” were identical with those of his own prayer to the king.'
  - where: 'note 18:33 “Mercy is for the merciful”'
    claim: 'He invoked the law and was dealt with by it; mercy is for the merciful'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'He, as an unjust plaintiff, had invoked the law; as a convicted transgressor he was to be dealt with according to the law. Mercy is for the merciful.'
  - where: 'note 18:33 “Mercy is for the merciful”'
    claim: 'The conditions of pardon are set in the Lord’s Prayer'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The conditions under which we may confidently implore pardon are set forth in the form of prayer prescribed by the Lord: “Forgive us our debts, as we forgive our debtors.”'
  - where: 'note 18:33 “Mercy is for the merciful”'
    claim: 'The tormentors deliberately vague: whatever agencies of retribution, remorse, conscience'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/18.htm'
    quote: 'The words seem deliberately vague. … we may see in them the symbols of whatever agencies God employs in the work of righteous retribution, the stings of remorse, the scourge of conscience'
  - where: christ
    claim: 'A story about us; the grace of a King who sets us free'
    key: holland-perfect-eventually
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/be-ye-therefore-perfect-eventually?lang=eng'
    quote: 'It is a story about us, the fallen human family—mortal debtors, transgressors, and prisoners all. Every one of us is a debtor, and the verdict was imprisonment for every one of us. And there we would all have remained were it not for the grace of a King who sets us free'
  - where: christ
    claim: 'Seventy times seven a metaphor of the infinite Atonement, with Mosiah 26:30'
    key: robbins-seventy-times-seven
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/until-seventy-times-seven?lang=eng'
    quote: 'The Lord used the math of seventy times seven as a metaphor of His infinite Atonement, His boundless love, and His limitless grace. “Yea, and as often as my people repent will I forgive them their trespasses against me.”'
  - where: christ
    claim: 'Forgive at least at the 100-pence level, within our ability'
    key: holland-perfect-eventually
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/be-ye-therefore-perfect-eventually?lang=eng'
    quote: 'it is not too much for Them to ask us to be a little more godlike in little things, that we speak and act, love and forgive, repent and improve at least at the 100-pence level of perfection, which it is clearly within our ability to do.'
  - where: christ
    claim: 'The injured one goes himself to settle it, to save his brother'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Jesus taught that the injured one should not wait for his brother to come to him, but go himself, and seek to adjust the difficulty; by so doing he might be the means of saving his brother’s soul.'
  - where: explore
    claim: 'Jesus the Christ chapter 24 treats this chapter'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Chapter 24: From Sunshine to Shadow'
