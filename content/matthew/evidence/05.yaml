    key: nelson-perfection-pending
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/perfection-pending?lang=eng'
    quote: 'This time He listed Himself along with His Father as a perfected personage.'
  - where: christ
    claim: 'Perfection is pending; only after the Resurrection and through the Lord'
    key: nelson-perfection-pending
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/perfection-pending?lang=eng'
    quote: 'We need not be dismayed if our earnest efforts toward perfection now seem so arduous and endless. Perfection is pending. It can come in full only after the Resurrection and only through the Lord.'
  - where: christ
    claim: 'Loving enemies impossible alone; a heart changed to be like Christ makes it possible'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
