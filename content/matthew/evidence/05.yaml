chapter: 5
claims:
  - where: when
    claim: 'The sermon was given in Galilee'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'The Sermon on the Mount was delivered in Galilee.'
  - where: when
    claim: 'Early in the mortal ministry, before the Atonement'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'the Sermon on the Mount early in his mortal ministry before his completion of the Atonement.'
  - where: setting
    claim: 'The sermon is the first of five discourses that close the five sections of the Gospel; many see the five as an allusion to the books of Moses'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Many scholars have noted that each of these sections concludes with a major discourse, each of which ends with phrases such as, “When Jesus had ended these sayings” … Many see this organization as an intentional allusion to the five books of Moses'
  - where: setting
    claim: '4:23 and 9:35 frame the sermon and the miracles of chapters 8–9 as one unit, word and deed'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew expected that his readers would recognize that the Sermon on the Mount in chapters 5–7 should be read in conjunction with the collection of miracles in chapters 8 and 9. Thus, Matthew wants his readers to see that Jesus is the Messiah in both word'
  - where: setting
    claim: 'Given in Galilee'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'The Sermon on the Mount was delivered in Galilee.'
  - where: setting
    claim: 'The risen Jesus gave a closely similar sermon at the temple in Bountiful, and its differences bring out a covenant setting'
    key: sc-knowhy-755
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-add-to-the-sermon-on-the-mount'
    quote: 'During His visit to the peoples of the Book of Mormon at their temple in Bountiful, the Lord Jesus Christ presented teachings that closely resemble what He had taught in the Sermon on the Mount'
  - where: setting
    claim: 'The covenant context is what the Book of Mormon sermon adds most'
    key: sc-knowhy-755
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-add-to-the-sermon-on-the-mount'
    quote: 'Most significant is the added context of covenant making found throughout the sermons as a whole.'
  - where: thread
    claim: 'Each beatitude promises a reward in conditions opposite to those suffered'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'each of the blessed being assured of recompense and reward in the enjoyment of conditions directly opposite to those under which he had suffered.'
  - where: thread
    claim: 'Jesus fulfils the law in the sermon by his teachings, deepening it without abrogating it'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'The principles he taught thus fulfilled the intent of the law by establishing a higher standard, which deepened but did not abrogate the original law.'
  - where: thread
    claim: 'The antitheses move from the act to what leads to it'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'his gospel taught that one should avoid the prerequisites of anger and lustful thoughts and swearing oaths'
  - where: thread
    claim: 'Jesus counters the impulse for retaliation'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Perhaps with this attitude in view, Jesus’ antithesis counters the impulse for retaliation by requiring submissiveness of the believer'
  - where: setting
    claim: 'Joseph Smith’s translation changes verses of the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'JST Matt. 5:24 and 3 Ne. 12:22 omit the words “without a cause.”'
  - where: thread
    claim: 'Loving enemies as the Father does is what perfection in 5:48 entails'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'Disciples show love toward all people because this is exactly what God does … To become as perfect or as completely devoted as God is, disciples must … demonstrate love toward those who do not love them.'
  - where: section 2 plain
    claim: '“Candle” is a lamp set on a stand'
    key: thayer
    url: 'https://biblehub.com/greek/3088.htm'
    quote: 'a lamp, candle (?), that is placed on a stand or candlestick'
  - where: section 2 plain
    claim: '“Bushel” is a dry measure of about a peck'
    key: thayer
    url: 'https://biblehub.com/greek/3426.htm'
    quote: 'a dry measure holding 16 sextarii (or one sixth of the Attic medimnus; commentary Nepos, Attic 2 (i. e. about a peck, A. V. bushel'
  - where: section 3 plain
    claim: 'Jot and tittle: the smallest letter and the stroke on a letter'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Referring to the smallest Hebrew or Greek letters (yod or iota) and the decorative seraphs on such letters (the keraia)'
  - where: section 4 plain
    claim: '“By them of old time” means “to them of old time”'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'As it stands in English, the impression may be that “they of old time” were the ones speaking, but tois archaiois more properly means “It was said to them of old times.”'
  - where: section 4 plain
    claim: '“Without a cause” arose later; omitted in the plain words'
    key: wayment-variants-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/how-new-testament-variants-contribute-meaning-sermon-mount'
    quote: 'Therefore, we may confidently conclude that the reading arose later'
  - where: section 4 plain
    claim: '“Raca” from Aramaic “empty”'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'disparaging someone with the epithet “Raca,” coming from the Aramaic rêqā meaning “empty,”'
  - where: section 4 plain
    claim: '“Hell fire” is the Gehenna of fire'
    key: thayer
    url: 'https://biblehub.com/greek/1067.htm'
    quote: 'γηννα τοῦ πυρός, Matthew 5:22'
  - where: section 4 plain
    claim: 'Footnotes: the council is the Sanhedrin; “agree” is be well disposed toward; farthing is the last penny'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'IE subject to the Sanhedrin. … GR Quickly have kind thoughts for, or be well disposed toward. … GR the last penny.'
  - where: section 5 plain
    claim: 'Footnote: “offend” is cause to stumble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'GR cause to stumble'
  - where: section 5 plain
    claim: '“Fornication” (porneia) is serious sexual wrongdoing'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'The Greek word porneia is notoriously difficult to define but is probably akin to “serious moral failure, specifically in the sexual area.”'
  - where: section 6 plain
    claim: 'Footnotes: “forswear thyself” means break your oath; “of evil” means from the evil one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'GR break your oath, or perjure yourself. … GR from the evil one.'
  - where: section 6 plain
    claim: 'The coat is the tunic; the cloak the more expensive garment'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'one’s tunic (an inner garment but translated by the KJV as “coat”), should be met with a willingness to give up even more, in this case the more expensive cloak.'
  - where: section 6 plain
    claim: 'Compelled to carry another’s burden a mile'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'that if one was pressed into service to carry another’s burden a mile, he should willingly go two miles'
  - where: section 7 plain
    claim: 'Footnote: “may be” means may become'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'GR may become'
  - where: section 7 plain
    claim: '“Perfect” is complete'
    key: nelson-perfection-pending
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/perfection-pending?lang=eng'
    quote: 'In Matthew 5:48, the term perfect was translated from the Greek teleios, which means “complete.”'
  - where: 'note 5:1 “A lawgiver on a mountain”'
    claim: 'Matthew alone sets the sermon on a mountain, as Moses gave commandments; the sermon stretches disciples beyond the outward law'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew, unlike the other Gospel writers, was careful to point out that Jesus delivered his sermon, much like Moses, from a mountain (see Exodus 20; Matthew 5–7). Few things are more “Matthean” than this sermon with its beatitudes and requirements that stretch disciples beyond the outward elements of the law of Moses'
  - where: 'note 5:1 “A lawgiver on a mountain”'
    claim: 'Matthew presents Jesus as the prophet like Moses, the great lawgiver'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'he presents Jesus as a New Moses throughout much of the rest of his Gospel, using this typology to illustrate important aspects of the Messiah’s work by showing how Jesus was the great lawgiver, provider, and deliverer of the New Testament.'
  - where: 'note 5:1 “A lawgiver on a mountain”'
    claim: 'One reading: the Psalms underlie the sermon, linking its mountain setting with the mountain house of the Lord'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'It seems undeniable that the Psalms served as the foundation for Jesus’ early instruction in the Sermon on the Mount, establishing a link between the mountain setting of the sermon and the “mountain house of the Lord,” or the temple.'
  - where: 'note 5:1 “A lawgiver on a mountain”'
    claim: 'Psalm 24, sung going up to the temple, underlies the promise of seeing God'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'That Jesus had in mind the Psalms as the foundation upon which this promise rests is seen in the direct parallel to Psalm 24, one of the Psalms of ascent or procession sung by the Levites and priests as devotees went up to the temple'
  - where: 'note 5:1 “Who heard it, and Luke’s sermon on the plain”'
    claim: 'Parts were directed to disciples who would be apostles; other parts of general application; He sat and taught them'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'Some portions of this comprehensive address were expressly directed to the disciples, who had been or would be called to the apostleship and in consequence be required to renounce all their worldly interests for the labors of the ministry; other parts were and are of general application.'
  - where: 'note 5:1 “Who heard it, and Luke’s sermon on the plain”'
    claim: 'The JST makes the audience converted disciples sent to teach; at Bountiful Jesus first spoke to the multitude'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'JST Matthew 5:2 clarifies the initial audience of the sermon, speaking of “they who shall believe on your words, when ye shall testify that ye have seen me, and that I am.” The audience consists of converted disciples being sent out to teach Jesus’ message of salvation to others.'
  - where: 'note 5:1 “Who heard it, and Luke’s sermon on the plain”'
    claim: 'In Matthew the Twelve had not yet been called'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'in Matthew, he had not yet called the Twelve, so he could not make similar statements.'
  - where: 'note 5:1 “Who heard it, and Luke’s sermon on the plain”'
    claim: 'Luke 6 and Matthew 5–7 may be separate sermons, to different audiences for different purposes; a few followers on the mountain, a mixed multitude on the plain'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'While Luke 6 shares many similarities with Matthew 5–7, these parables may well derive from two separate sermons delivered by Jesus on different occasions to varying audiences, in different locations, and for different purposes.'
  - where: 'note 5:1 “Who heard it, and Luke’s sermon on the plain”'
    claim: 'The plain audience was mixed; Jesus gave simpler remarks there'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'in Luke “a multitude of people were out on the plain” that “probably included all kinds of people—the rich and the poor, the believers and the merely curious, all types of Jews as well as Greeks or Phoenicians.” To this more diverse and less intimate audience, Jesus offered simpler remarks'
  - where: 'note 5:1 “Who heard it, and Luke’s sermon on the plain”'
    claim: 'Talmage takes the Twelve as already chosen: Jesus spoke at length on the mountainside, then repeated parts to the multitude on the plain; Matthew’s fuller report may be because he was present at the first delivery'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'Is it not probable that Jesus spoke at length on the mountain-side to the disciples then present, and from whom He had chosen the Twelve, and that after finishing His discourse to them He descended with them to the plain where a multitude had assembled, and that to these He repeated parts of what He had before spoken?'
  - where: 'note 5:1 “Who heard it, and Luke’s sermon on the plain”'
    claim: 'Matthew’s fuller report may be due to his presence'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'The relative fulness of Matthew’s report may be due to the fact that he, as one of the Twelve, was present at the first and more extended delivery.'
  - where: 'note 5:3 “Who come unto me”'
    claim: '“Who come unto me” marks a covenant relationship with Jesus'
    key: sc-knowhy-755
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-add-to-the-sermon-on-the-mount'
    quote: 'This added phrase marks the necessity of coming to Jesus in a covenantal relationship in order to receive the promised blessings.'
  - where: 'note 5:3 “Who come unto me”'
    claim: 'Two added beatitudes at Bountiful; the sermon intended for covenant makers'
    key: sc-knowhy-755
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-add-to-the-sermon-on-the-mount'
    quote: 'At the beginning of this sermon, Jesus added two beatitudes not found in the New Testament version … These words stress that the text is specifically intended for covenant makers'
  - where: 'note 5:3 “Who come unto me”'
    claim: 'The Bountiful sermon follows teaching on baptism and the Holy Ghost, and the day ends in a sacramental covenant'
    key: sc-knowhy-755
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-add-to-the-sermon-on-the-mount'
    quote: 'appear immediately following Jesus’ explanations of baptism, of the gift of the Holy Ghost, and of the rock … Furthermore, this holy day concluded with the people making a sacramental covenant'
  - where: 'note 5:3 “Who come unto me”'
    claim: 'The JST adds beatitudes for those who believe and who come down in humility and are baptized, giving the sermon a covenant orientation'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'The third added beatitude puts the entire sermon in a covenantal orientation: those “that shall believe on your words, and come down into the depth of humility, and be baptized in my name” shall receive the Holy Ghost and a remission of their sins.'
  - where: 'note 5:3 “Who come unto me”'
    claim: '“Poor in spirit” is not in the Hebrew Bible but is in the War Scroll'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'The problem is that the exact phrase “poor in Spirit” (Hebrew, aniye ru’ah) does not appear in the Masoretic Text or rabbinic literature. It is found, though, in a psalm from the War Scroll, one of the Dead Sea Scrolls'
  - where: 'note 5:3 “Who come unto me”'
    claim: '“Poor” had become a synonym for pious; Jesus viewed the poor in spirit as saints'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'It appears that Jesus also viewed the truly “poor in spirit” as saints, “holy ones” striving for an eternal, exalted place in the kingdom of heaven.'
  - where: 'note 5:5 “The meek and the earth”'
    claim: 'The beatitude rests on Ps. 37:11; meek means mild, gentle; latter-day scripture: the meek obtain the celestial kingdom'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'There is no mistaking the direct influence of and foundation laid by Psalm 37:11 for this beatitude … the meek (Greek praeis) are literally defined as the “mild, gentle,” … the meek are those who shall obtain the celestial kingdom—those who have kept their covenants and been resurrected with celestial bodies.'
  - where: 'note 5:5 “The meek and the earth”'
    claim: 'D&C 88:17–20: the meek inherit the earth, which celestial bodies will possess'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'in whose bosom it is decreed that the poor and the meek of the earth shall inherit it. … That bodies who are of the celestial kingdom may possess it forever and ever'
  - where: 'note 5:6 “Filled with the Holy Ghost”'
    claim: '3 Ne. 12:6 reads “filled with the Holy Ghost”; the blessing felt as people repent and seek God’s will'
    key: sc-knowhy-755
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-add-to-the-sermon-on-the-mount'
    quote: 'The spiritual aspects of this blessing are made explicit; as people repent, are humble, and seek to do God’s will, they will be blessed to feel the Holy Ghost more abundantly in their lives.'
  - where: 'note 5:6 “Filled with the Holy Ghost”'
    claim: 'Jesus did not say “blessed are the righteous”; the JST also reads “filled with the Holy Ghost”'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'The Savior did not say “blessed are the righteous,” implying that one must live a life absolutely free from error. Rather, one is to desire righteousness as intensely as one who is hungry and thirsty desires food and drink.'
  - where: 'note 5:8 “To see God: a temple promise”'
    claim: 'The beatitude parallels Psalm 24, a psalm sung going up to the temple'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'That Jesus had in mind the Psalms as the foundation upon which this promise rests is seen in the direct parallel to Psalm 24, one of the Psalms of ascent or procession sung by the Levites and priests as devotees went up to the temple'
  - where: 'note 5:8 “To see God: a temple promise”'
    claim: 'The Septuagint of Ps. 24:4 has the same Greek words, singular'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'the Septuagint phrase “pure in his heart” (katharos te kardia) used in the singular in verse 4 is the exact equivalent of the phrase “pure in heart” (katharoi te kardia) used in the plural by Jesus'
  - where: 'note 5:8 “To see God: a temple promise”'
    claim: 'In the psalm the object of the pure in heart is to see God in the temple'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'Here the object of the pure in heart is to see God in the temple.'
  - where: 'note 5:8 “To see God: a temple promise”'
    claim: 'The hill is the temple mount; the holy place the temple'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'the Hebrew is more directly related to the temple: “who shall go up to the mountain of Yahweh,” … And the phrase “who shall stand in his holy place” directly refers to the temple'
  - where: 'note 5:8 “To see God: a temple promise”'
    claim: 'Later disciples extended the promise to the heavenly temple'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'But the Savior’s later disciples also understood that this promise extended beyond the earthly temple to the heavenly temple—the kingdom of heaven or celestial glory—made possible through Christ’s atoning sacrifice.'
  - where: 'note 5:8 “To see God: a temple promise”'
    claim: 'Pure in heart means pure in desire, not without flaw'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'this beatitude does not teach “blessed are the pure” (i.e., those who are pure from any mistakes), but rather blessed are those who are pure in their hearts (i.e., their desires to do what is right, even though they may not be without flaw).'
  - where: 'note 5:13 “Salt that loses its savour”'
    claim: 'Covenants of salt; salt with offerings'
    key: richardson-salt-light
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/salt-light'
    quote: 'Anciently, the covenants between God and his disciples were called “covenant[s] of salt” (Numbers 18:19). … When dealing with sacrifice, the word “savour” is typically not used to connote the sense of taste or flavor.'
  - where: 'note 5:13 “Salt that loses its savour”'
    claim: 'D&C 101:39–40 applies the saying to those who covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'When men are called unto mine everlasting gospel, and covenant with an everlasting covenant, they are accounted as the salt of the earth and the savor of men;'
  - where: 'note 5:13 “Salt that loses its savour”'
    claim: 'Pure salt is stable; disciples lose savour by mixing worldliness with discipleship'
    key: richardson-salt-light
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/salt-light'
    quote: 'But pure salt (sodium chloride) is actually a very stable compound, making it resilient to change. How, then, might salt lose its saltiness?'
  - where: 'note 5:13 “Salt that loses its savour”'
    claim: 'Savour is lost through mixture and contamination'
    key: asay-salt
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/salt-of-the-earth-savor-of-men-and-saviors-of-men?lang=eng'
    quote: 'A world-renowned chemist told me that salt will not lose its savor with age. Savor is lost through mixture and contamination.'
  - where: 'note 5:13 “Salt that loses its savour”'
    claim: 'The JST turns the statement into an invitation; good salt believes Jesus’s words'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'the good salt represents those who believe in Jesus’ words and mission. The salt that is “thenceforth good for nothing” (Matthew 5:13) represents those who reject Jesus as the fulfillment of the law and the prophets.'
  - where: 'note 5:13 “Salt that loses its savour”'
    claim: 'JST wording: “I give unto you to be the salt of the earth”'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'which the JST turns from a statement into an invitation: “Ye are Verily, verily, I say unto you, I give unto you to be the salt of the earth'
  - where: 'note 5:16 “Light that points to the Father”'
    claim: 'The lamp is set on a stand'
    key: thayer
    url: 'https://biblehub.com/greek/3088.htm'
    quote: 'a lamp, candle (?), that is placed on a stand or candlestick'
  - where: 'note 5:16 “Light that points to the Father”'
    claim: 'The “bushel” is a dry measure of about a peck'
    key: thayer
    url: 'https://biblehub.com/greek/3426.htm'
    quote: 'a dry measure holding 16 sextarii (or one sixth of the Attic medimnus; commentary Nepos, Attic 2 (i. e. about a peck, A. V. bushel'
  - where: 'note 5:16 “Light that points to the Father”'
    claim: 'The disciples’ light reflects the Savior’s; setting oneself up as a light is priestcraft'
    key: richardson-salt-light
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/salt-light'
    quote: 'Indeed, the light of the disciples merely reflects the Savior’s light. If disciples replace Christ’s light with any other light—especially their own—they indulge in what Nephi called “priestcraft.”'
  - where: 'note 5:16 “Light that points to the Father”'
    claim: 'The ultimate purpose of being a light is that others glorify the Father'
    key: richardson-salt-light
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/salt-light'
    quote: 'The ultimate purpose for being a light—the ultimate fruit—is so others will “glorify your Father who is in heaven” (JST, Matthew 5:16).'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: 'Plērōsai means to fill; katalysai means annul; fulfil = bring to full expression'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'the use of the Greek term plērōsai, the primary meaning of which means “to fill or make full.” As such, it is in direct contrast with the idea of “destroy,” the Greek for which, katalysai, means something like “annul” in a legal context.'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: 'In the sermon’s context fulfil means bring out its true meaning'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'in the original context of the Sermon on the Mount it is most likely that “fulfill” means to make complete, fill the requirements of, comply with the conditions of, or even “bring out its true meaning” or “bring to full expression.”'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: 'Ceremonial aspects ended with his death; ethical precepts existed before and after the law and were strengthened'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Whereas the symbolic and ceremonial aspects of the law were brought to an end by his sacrificial death, the ethical precepts of that same law—which principles existed before the law and would continue even after it—were reaffirmed, and even strengthened'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: 'The Bountiful setting after the Atonement differs from the early sermon'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'the context of Jesus’ appearance in the New World and his delivery of the Sermon at the Temple there after his death and Resurrection is significantly different than that of the Sermon on the Mount early in his mortal ministry'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: 'Ritual portions no longer required after the Crucifixion; moral obligations intensified'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'They did not cease to be in force following the death of the Savior. Rather, the moral obligations of the law were intensified and raised to a higher standard.'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: '3 Ne. 15:5, 8: the law of Moses fulfilled and ended in Christ; the covenant not all fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'For behold, the covenant which I have made with my people is not all fulfilled; but the law which was given unto Moses hath an end in me.'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: 'Jot and tittle'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Referring to the smallest Hebrew or Greek letters (yod or iota) and the decorative seraphs on such letters (the keraia)'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: 'Jesus fulfilled every jot and tittle and embodied the higher law'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'By fulfilling every jot and tittle of the law of Moses (Matthew 5:18), a point that would have been especially important to Matthew’s audience, he embodied every principle of the higher law he taught in all his sermons.'
  - where: 'note 5:17 “Not to destroy but to fulfil”'
    claim: 'JST of 5:19: breaking the least commandments means not being saved'
    key: jst-matt-5
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/5?lang=eng'
    quote: 'Whosoever, therefore, shall break one of these least commandments, and shall teach men so to do, he shall in no wise be saved in the kingdom of heaven; but whosoever shall do and teach these commandments of the law until it be fulfilled'
  - where: 'note 5:20 “Righteousness that exceeds the Pharisees’”'
    claim: 'The scribes and Pharisees prided themselves on keeping the law; the saying may have astonished the hearers'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'This may have been one of the provocative statements that caused the people to be “astonished at his doctrine” (Matthew 7:28). How could the disciples of Jesus surpass the scribes and Pharisees, who prided themselves on their ability to keep all of the regulations of the law of Moses?'
  - where: 'note 5:20 “Righteousness that exceeds the Pharisees’”'
    claim: 'The law concerned outward acts; the gospel the inward intent; JST 5:28'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: '“I give unto you a commandment that ye suffer none of these things to enter into your heart” (JST, Matthew 5:28; emphasis added). [41] While the regulations of the law were very often concerned with an individual’s outward actions, the gospel of Christ was also concerned with the inward intent'
  - where: 'note 5:20 “Righteousness that exceeds the Pharisees’”'
    claim: 'The scribes and Pharisees hedged the law about with added rules; Jesus taught a better way'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'And whereby the scribes and Pharisees had sought to protect the Mosaic code by hedging it about with additional rules and practices, Jesus, through the antitheses, taught another, better way to accomplish the intent of the law.'
  - where: 'note 5:21 “On His own authority”'
    claim: '“To them of old time”; the passive probably points to God as speaker'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'tois archaiois more properly means “It was said to them of old times.” [14] In this case, the subject of the passive verb errethē is probably what is called the “Divine passive.” [15] As a result, God said to them of old time x'
  - where: 'note 5:21 “On His own authority”'
    claim: 'Jehovah present at Sinai established the original propositions'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Of course God himself—or Jesus, as the premortal Jehovah present at Mount Sinai—also established the original propositions'
  - where: 'note 5:21 “On His own authority”'
    claim: '“I say unto you” unusual for the period; Jesus cites no other authority'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'The rest of the formula, “I say unto you,” also seems to have been unusual for the period, because Jesus does not cite other authority but simply taught “as one having authority, and not as the scribes” (7:29).'
  - where: 'note 5:21 “On His own authority”'
    claim: 'The Book of Mormon shows the Jehovah who gave the law is the man who taught its meaning'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'the resurrected Lord taught that the Jehovah who gave the law in the first instance was the same as the man who taught its deeper meaning in Galilee'
  - where: 'note 5:22 “Anger for any cause”'
    claim: 'One Greek word; oldest papyrus, Sinaiticus, Vaticanus and Justin omit; witnesses with it nearly two centuries later; JST and 3 Ne. omit'
    key: wayment-variants-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/how-new-testament-variants-contribute-meaning-sermon-mount'
    quote: 'the oldest available manuscript (∏64) of Matthew 5:22 omits the word, as do the other early witnesses such as Codex Sinaiticus and Codex B (Vaticanus) and the patristic author Justin, whereas those that contain the word appear to postdate the earliest manuscripts and references by nearly two hundred years.'
  - where: 'note 5:22 “Anger for any cause”'
    claim: 'Added above the line in Sinaiticus by a later scribe; the reading arose later'
    key: wayment-variants-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/how-new-testament-variants-contribute-meaning-sermon-mount'
    quote: 'In Sinaiticus, the phrase “without a cause” was added above the line of the text for Matthew 5:22 by a later scribe. … Therefore, we may confidently conclude that the reading arose later'
  - where: 'note 5:22 “Anger for any cause”'
    claim: 'The JST should be used with caution about the original text, but here agrees with the earliest texts'
    key: wayment-variants-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/how-new-testament-variants-contribute-meaning-sermon-mount'
    quote: 'it should be used only with caution in making any conclusions about the original text of the Bible. … Second, in one instance the Joseph Smith Translation does agree with the earliest texts'
  - where: 'note 5:22 “Anger for any cause”'
    claim: 'Copyists added it to soften the command; 3 Ne. and the JST omit it, so anger for any cause'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'later copyists seem to have inserted it in later manuscripts to soften the injunction to justify anger in some occasions. [23] Significantly, both JST Matthew 5:22 and 3 Nephi 12:22 omit the qualification “without a cause,” making clear that uncontrolled anger for any cause can lead to sin'
  - where: 'note 5:22 “Anger for any cause”'
    claim: 'Warnings against anger were not novel in Jewish ethics of the time; the point is the comprehensiveness'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'However, this focus on the damaging effects of anger was not, in fact, novel in Jewish ethics of the Second Temple Period.'
  - where: 'note 5:22 “Anger for any cause”'
    claim: 'The significance is the comprehensiveness of the admonition'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Instead, the significance of the antithesis lies in the comprehensiveness of Jesus’ admonition that one not be angry to any degree with another person.'
  - where: 'note 5:22 “Anger for any cause”'
    claim: 'Raca from Aramaic “empty,” a mild insult; “fool” disrespectful but not intense'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'it was a rather mild, if condescending, expression used with servants or members of one’s household. [25] Likewise, the word translated “fool,” mōros, was disrespectful but not particularly intense.'
  - where: 'note 5:22 “Anger for any cause”'
    claim: '“Hell fire” is “the Gehenna of fire”'
    key: thayer
    url: 'https://biblehub.com/greek/1067.htm'
    quote: 'γηννα τοῦ πυρός, Matthew 5:22'
  - where: 'note 5:22 “Anger for any cause”'
    claim: 'Gehenna, the valley of Hinnom, where refuse was burned; a symbol of torment after death'
    key: bd-gehenna
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gehenna?lang=eng'
    quote: 'The valley of Hinnom. South of Jerusalem, the scene of Moloch worship … afterwards a place in which the refuse of the city was burned, and for that reason it was symbolic of the place of torment after death'
  - where: 'note 5:24 “Leave the gift at the altar”'
    claim: 'The altar was in Jerusalem and the sermon in Galilee; likely a hundred-mile journey back to Galilee and return'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'The Sermon on the Mount was delivered in Galilee. The altar where one would bring his gift or offering was in Jerusalem. In order to comply with Christ’s charge, a Jew from Galilee would likely have to undertake the rigorous, hundred-mile journey back to Galilee, reconcile with his brother, and then return to Jerusalem.'
  - where: 'note 5:24 “Leave the gift at the altar”'
    claim: 'The problem is now another’s anger; any problem in a relationship could impede worship'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'illustrates that any problem in a relationship was damaging enough that it could impede worship of God. Significantly, the problem is no longer one’s own anger but the anger of another.'
  - where: 'note 5:24 “Leave the gift at the altar”'
    claim: 'At Bountiful the sacrifice to be offered is a broken heart and contrite spirit (3 Ne. 12:19–20, 23–24)'
    key: sc-knowhy-755
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-add-to-the-sermon-on-the-mount'
    quote: 'These verses, as well as verses 23–24, teach that the sacrifice to be offered now is “a broken heart and a contrite heart,”'
  - where: 'note 5:29 “A parable about sins”'
    claim: 'The JST calls it a parable about casting off sins and adds a commandment about the heart'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'In the JST, Jesus carefully explains its meaning and confirms it is a parable alluding to casting off our sins: “Behold, I give unto you a commandment, that ye suffer none of these things to enter into your heart. For it is better that ye should deny yourselves of these things, wherein ye will take up your cross'
  - where: 'note 5:29 “A parable about sins”'
    claim: 'Hyperbole; the eye is put first to tie it to the look in 5:28; it assumes repentance and forgiveness'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'The standard form of the hyperbole, or literary exaggeration to prove a point, placed the offending hand first and the eye second (see Mark 9:43–47; Matthew 18:8–9). But here, Jesus mentions the eye first to connect it with the lustful look spoken of in 5:28.'
  - where: 'note 5:29 “A parable about sins”'
    claim: 'It assumes repentance; what is stressed is failure to take sin seriously'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Despite the apparent harshness of the hyperbole, it is important to note that it assumes repentance and forgiveness of the original sin.'
  - where: 'note 5:29 “A parable about sins”'
    claim: 'Footnote: “offend” is cause to stumble; the JST reading “a parable concerning your sins”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'And now this I speak, a parable concerning your sins; wherefore, cast them from you, that ye may not be hewn down and cast into the fire.'
  - where: 'note 5:32 “Divorce and the higher law”'
    claim: 'The debate between the schools of Shammai and Hillel over Deut. 24:1'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'In the first century, there were two primary positions when it came to divorce: that represented by the school of Rabbi Shammai and that represented by the school of Rabbi Hillel. The conflict arose due to differences of interpretation of Deuteronomy 24:1'
  - where: 'note 5:32 “Divorce and the higher law”'
    claim: 'Two schools of the Pharisaic movement; divorce for any reason other than sexual irregularity a result of a hard heart'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Exactly what reason could justify divorce at the time of Jesus was the subject of debate within two different schools of the Pharisaic movement: the broadly interpretive House of Hillel and the more legalistic house of Shammai.'
  - where: 'note 5:32 “Divorce and the higher law”'
    claim: 'Jesus sides with Shammai against easy divorce and goes beyond; no “do-over”'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Here Jesus sides with the school of Shammai in resisting “easy” divorce (and even moves beyond it in that he does not allow for remarriage). … Divorce should not be used to grant a spouse a “do-over.”'
  - where: 'note 5:32 “Divorce and the higher law”'
    claim: 'Porneia meaning'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'The Greek word porneia is notoriously difficult to define but is probably akin to “serious moral failure, specifically in the sexual area.”'
  - where: 'note 5:32 “Divorce and the higher law”'
    claim: 'Remarriage is adultery because the original union remains intact'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'Therefore, when one divorces and then remarries, he enters into an adulterous relationship because the original union that made “one flesh” remains intact.'
  - where: 'note 5:32 “Divorce and the higher law”'
    claim: 'Marriage meant to be permanent'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'emphasized that—excluding the exception of the will of God—marriage was meant to establish a permanent relationship.'
  - where: 'note 5:32 “Divorce and the higher law”'
    claim: 'The Church’s present position'
    key: oaks-divorce
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/04/divorce?lang=eng'
    quote: 'The kind of marriage required for exaltation—eternal in duration and godlike in quality—does not contemplate divorce. … Because “of the hardness of [our] hearts,” the Lord does not currently enforce the consequences of the celestial standard. He permits divorced persons to marry again without the stain of immorality specified in the higher law.'
  - where: 'note 5:34 “Why not swear at all”'
    claim: 'Of old oaths were allowed in covenant before the Lord; now forbidden; heaven, earth, Jerusalem, head; simplicity of speech'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'Of old it had been forbidden to swear or take oaths except in solemn covenant before the Lord; but in the gospel dispensation the Lord forbade that men swear at all … Moderation in speech, decision and simplicity were enjoined, to the exclusion of expletives, profanity and oaths.'
  - where: 'note 5:34 “Why not swear at all”'
    claim: 'Everything connected with God is holy'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'God and everything connected with him (his creation, his city, even his ability to make hair “white or black”) are so holy that one should hesitate to ever use them in a way that will not be reverential, honest, or productive.'
  - where: 'note 5:34 “Why not swear at all”'
    claim: 'A witness sworn in the Lord’s name broke two commandments by swearing falsely; a simple yes or no should suffice'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Anciently, a witness would often be sworn in the name of the Lord, so swearing falsely broke both commandments. Jesus’ response was that truthfulness should so characterize the believer that his simple affirmation or denial should suffice without needing to swear at all.'
  - where: 'note 5:39 “The other cheek and the second mile”'
    claim: 'Lex talionis limited retribution but could be taken as retaliation; Jesus counters the impulse'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Nevertheless, such retribution could easily be seen not as legal compensation but as retaliation, satisfying one’s anger at being hurt or offended. Perhaps with this attitude in view, Jesus’ antithesis counters the impulse for retaliation'
  - where: 'note 5:39 “The other cheek and the second mile”'
    claim: 'Coat is the tunic, cloak more expensive; forced service by any superior'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'one’s tunic (an inner garment but translated by the KJV as “coat”), should be met with a willingness to give up even more, in this case the more expensive cloak. [41] Less costly but inconvenient was the example of forced service in verse 41, which reflected not so much unique Roman practice but rather the ability of any superior to coerce'
  - where: 'note 5:39 “The other cheek and the second mile”'
    claim: 'Examples in decreasing severity, ending in a generous heart'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'These first three examples are presented in order of decreasing severity: one is physically abused in the first, loses property in the second, and loses only time in the third. … Jesus’ antithesis of not resisting evil results in a changed, generous heart.'
  - where: 'note 5:39 “The other cheek and the second mile”'
    claim: 'A blow on the right cheek by the right hand is a backhanded slap, an insult'
    key: judd-resist-not-evil
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/resist-not-evil'
    quote: 'To strike someone on the right cheek with your right hand would require a backhanded slap; in New Testament culture, this would be more consistent with an insult rather than a fistfight.'
  - where: 'note 5:39 “The other cheek and the second mile”'
    claim: 'Compelled to carry another’s burden; not abject subservience nor abrogation of self-protection; directed primarily to the apostles'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'are not to be construed as commanding abject subservience to unjust demands, nor as an abrogation of the principle of self-protection. These instructions were directed primarily to the apostles, who would be professedly devoted to the work of the kingdom to the exclusion of all other interests.'
  - where: 'note 5:39 “The other cheek and the second mile”'
    claim: 'Better to suffer loss and indignity than hinder the work by contention'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'In their ministry it would be better to suffer material loss or personal indignity and imposition at the hands of wicked oppressors, than to bring about an impairment of efficiency and a hindrance in work through resistance and contention.'
  - where: 'note 5:43 “A saying not in the law”'
    claim: '“Hate thine enemy” is not in the Old Testament; an interpretive tradition of the day; hence “it hath been said”'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'But the second half, “hate thine enemy,” is not found in the Old Testament. Scholars believe this is an interpretive tradition current in Jesus’ day. [7] Thus “it hath been said” reflects the combination of quote and interpretation.'
  - where: 'note 5:43 “A saying not in the law”'
    claim: 'A narrow reading of “neighbour” could exclude enemies and justify hatred'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Clearly, it was possible to interpret the directive to love one’s neighbor narrowly to one’s own group, thus excluding Israel’s enemies and associating them with the “enemies of God,” thereby justifying hatred.'
  - where: 'note 5:43 “A saying not in the law”'
    claim: 'God’s care for all, sun and rain, is the key'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'Jesus’ explanation that God cares for all his children, causing the sun and rain to benefit the good and bad alike, provides the key.'
  - where: 'note 5:46 “A publican’s own Gospel”'
    claim: 'Matthew, a former publican, records this reference; Luke writes “sinners”; Matthew calls himself a publican in the list of apostles, the others omit it'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'Observe that Matthew, who had been a publican, frankly records this reference (5:46, 47) to his despised class. Luke writes “sinners,” instead of “publicans” (6:32–34).'
  - where: 'note 5:46 “A publican’s own Gospel”'
    claim: 'Matthew names himself a publican in his list of apostles; the others omit the title'
    key: talmage-jesus-christ-17
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-17?lang=eng'
    quote: 'But we find Matthew’s designation of himself as a publican in his list of the apostles (10:3) and the considerate omission of the unenviable title by the other evangelists (Mark 3:18; Luke 6:15).'
  - where: 'note 5:48 “Perfect: complete, as the Father is”'
    claim: 'Teleios means complete; from telos, end; not freedom from error but a distant objective'
    key: nelson-perfection-pending
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/perfection-pending?lang=eng'
    quote: 'In Matthew 5:48, the term perfect was translated from the Greek teleios, which means “complete.” Teleios is an adjective derived from the noun telos, which means “end.” … Please note that the word does not imply freedom from error; it implies achieving a distant objective.'
  - where: 'note 5:48 “Perfect: complete, as the Father is”'
    claim: 'Noah perfect (tamim; teleios in the Septuagint), not flawless'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'The Septuagint—the Greek translation of the Old Testament—uses the word teleios (the same word used in Matthew 5:48) to mean perfect in the sense of “complete” and “entire.” [10] Neither the Hebrew word nor the Greek word carries the connotation that Noah had somehow achieved a state of flawlessness.'
  - where: 'note 5:48 “Perfect: complete, as the Father is”'
    claim: 'The command follows from loving enemies as God does; to be as completely devoted as God'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'Disciples are to be as completely devoted as God. Immediately preceding the commandment to follow God’s example of perfection, the Savior explained what this entails: “Love your enemies'
  - where: 'note 5:48 “Perfect: complete, as the Father is”'
    claim: 'At Bountiful he listed Himself with the Father; previously he had not'
    key: nelson-perfection-pending
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/perfection-pending?lang=eng'
    quote: 'There He repeated the important injunction previously cited but with one very significant addition. He said, “I would that ye should be perfect even as I, or your Father who is in heaven is perfect.” This time He listed Himself along with His Father as a perfected personage. Previously He had not.'
  - where: 'note 5:48 “Perfect: complete, as the Father is”'
    claim: 'Only after the Resurrection did the Savior achieve eternal perfection'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'Not until after his Atonement, death, and glorious Resurrection did the Savior declare to the Nephites, “I would that ye should be perfect even as I, or your Father who is in heaven is perfect” (3 Nephi 12:48; emphasis added). Only then did the Savior achieve eternal perfection.'
  - where: 'note 5:48 “Perfect: complete, as the Father is”'
    claim: 'Jesus never broke a commandment in mortality, but did not include Himself as perfected'
    key: judd-perfect
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/be-ye-therefore-perfect'
    quote: 'Jesus Christ himself, for instance, never broke a commandment during his mortal life, but when he commanded his Jewish audience to be perfect he did not include himself as one who had achieved perfection.'
  - where: christ
    claim: 'The lawgiver is the teacher (3 Ne. 15:5)'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'the resurrected Lord taught that the Jehovah who gave the law in the first instance was the same as the man who taught its deeper meaning in Galilee'
  - where: christ
