chapter: 1
claims:
  - where: 'when'
    claim: 'Matthew is usually dated to the AD 80s, though some date it earlier'
    key: lavender-torah-matthew
    url: 'https://byustudies.byu.edu/article/jesus-and-the-torah-in-matthew-beyond-replacement-theology'
    quote: 'Matthew is typically dated after the destruction of the Temple in the AD 80s, although some date it earlier.'
  - where: 'setting'
    claim: 'The Joseph Smith Translation titles the book “The Testimony of St. Matthew”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'JST entitles this book “The Testimony of St. Matthew.”'
  - where: 'setting'
    claim: 'Ancient Christian writers unanimously name Matthew the tax collector as author; modern scholars debate it'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Although modern scholars have debated the authorship of this Gospel, ancient Christian writings are unanimous in ascribing it to the tax collector named Matthew in Matthew 9:9.'
  - where: 'setting'
    claim: 'Latter-day Saints affirm the apostle Matthew as author'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'Latter-day Saints affirm that the author of the first Gospel was Matthew (Levi) the publican, chosen by Jesus as one of the original Twelve Apostles.'
  - where: 'setting'
    claim: 'Matthew was a tax gatherer at Capernaum; the Gospel was written for Jewish readers in Palestine, to show Jesus is the Messiah of the prophets'
    key: bd-matthew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/matthew?lang=eng'
    quote: 'He was a tax gatherer at Capernaum … His Gospel (see Gospels) was written for the use of Jewish persons in Palestine and uses many quotations from the Old Testament. His chief object is to show that Jesus is the Messiah of whom the prophets spoke.'
  - where: 'setting'
    claim: 'Matthew quotes the Old Testament at least twice as often as any other Gospel writer'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'With over sixty quotations from the Old Testament, along with many other allusions, Matthew quotes the Old Testament at least twice as often as any other Gospel writer.'
  - where: 'setting'
    claim: 'The gentile figures and the final commission suggest a mixed Jewish and gentile audience'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'the Risen Lord’s final directive that his eleven remaining disciples take the gospel to all the world (28:16–20) might suggest that it was also directed to a mixed Jewish-gentile Christian audience.'
  - where: 'setting'
    claim: 'Many scholars hold that Mark was written first and that Matthew used it'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Many now believe that Mark was the first written Gospel and that Matthew used it as a source for his own Gospel.'
  - where: 'setting'
    claim: 'Matthew, unlike Mark, begins with the conception and birth; the prologue answers who Jesus was (1:1–17) and how he came to be (1:18–25)'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew decided, and no doubt was inspired, to begin his Gospel with a narrative account of Jesus’s divine conception and miraculous birth. … who was Jesus (1:1–17), how did he come into being (1:18–25, Jesus’s genealogy)'
  - where: 'setting'
    claim: 'Luke tells the infancy largely from Mary’s side, Matthew from Joseph’s'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Because royal succession was patrilineal, Matthew’s infancy narrative focused on Joseph, unlike Luke’s, which was largely told from the perspective of Mary.'
  - where: 'thread'
    claim: 'Joseph, a son of David, adopts Jesus into David’s line by accepting and naming him'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'In order to legally claim Jesus as his own son, thereby making Jesus an heir to the Davidic throne, Joseph accepts Mary’s baby when he is born, giving him a name (1:25) and thereby adopting him into the Davidic line.'
  - where: 'thread'
    claim: 'Joseph is not the actual father; the conception came by divine agency'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'a statement that makes clear that Joseph the carpenter was not the actual father of Mary’s expected child. Rather, the conception had come about by divine agency.'
  - where: 'section 1 plain'
    claim: 'Phares, Esrom, Aram, Aminadab, Naasson, Booz are Pharez, Hezron, Ram, Amminadab, Nahshon, Boaz'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'Now these are the generations of Pharez: Pharez begat Hezron, And Hezron begat Ram, and Ram begat Amminadab, And Amminadab begat Nahshon, and Nahshon begat Salmon, And Salmon begat Boaz, and Boaz begat Obed'
  - where: 'section 1 plain'
    claim: 'Judas is Judah, father of Pharez and Zarah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/38?lang=eng'
    quote: 'And afterward came out his brother, that had the scarlet thread upon his hand: and his name was called Zarah.'
  - where: 'section 1 plain'
    claim: 'The kings from Solomon to Jeconiah in their Old Testament spellings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: 'And Solomon’s son was Rehoboam, Abia his son, Asa his son, Jehoshaphat his son, … Ahaz his son, Hezekiah his son, Manasseh his son, Amon his son, Josiah his son.'
  - where: 'section 1 plain'
    claim: 'Zorobabel son of Salathiel is Zerubbabel son of Shealtiel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: 'came the word of the Lord by Haggai the prophet unto Zerubbabel the son of Shealtiel, governor of Judah'
  - where: 'note 1:1 “A book of beginnings”'
    claim: 'Matthew’s opening words biblos geneseōs echo Genesis 2:4, 5:1 and 6:9; Adam’s genealogy lists descendants, Jesus’s ancestors'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew’s work begins with two words, biblos geneseōs, an important phrase that echoes Genesis 2:4 (the generations of the heavens and the earth), 5:1 (the generations of Adam), and 6:9 (the generations of Noah).'
  - where: 'note 1:1 “A book of beginnings”'
    claim: 'Where Adam’s genealogy lists descendants, Jesus’s lists ancestors'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew begins his Gospel account as an inversion of the Genesis account; where Adam’s genealogy lists his descendants, Jesus’s lists his ancestors.'
  - where: 'note 1:1 “Son of David, son of Abraham”'
    claim: 'Matthew uses “son of David” nine times; Mark and Luke three each; John not at all'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'he uses the title “son of David” for Jesus nine times (see Matthew 1:1; 9:27; 12:23; 15:22; 20:30–31; 21:9, 15; 22:42). In contrast, the title “son of David” only appears three times each in Mark and Luke and is absent in John'
  - where: 'note 1:1 “Son of David, son of Abraham”'
    claim: 'Messiah/christos means anointed one; David’s line lapsed at the exile and hope grew for an anointed king'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'each could be referred to by the title “messiah” (Hebrew, māšîaḥ; Greek, christos), which means literally “anointed one.” David’s ruling line lapsed following the destruction of Jerusalem and the exile of Zedekiah in 586 BC'
  - where: 'note 1:1 “Son of David, son of Abraham”'
    claim: 'A genealogy proved a claim: the Messiah must show descent from David'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'Where certain offices or blessings are restricted to particular families, genealogies become of great importance; for example, a priest must be able to show his descent from Aaron, the Messiah from David, while every Jew must be able to show his descent from Abraham.'
  - where: 'note 1:1 “Son of David, son of Abraham”'
    claim: 'Abraham is the father of the covenant through which all nations would be blessed'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew begins with Abraham, the father of the covenant, but Genesis makes it clear that through this covenant all nations, not just the Israelites, would be blessed (see Genesis 12:3; 18:18).'
  - where: 'note 1:3 “Four women in a list of fathers”'
    claim: 'Matthew follows the pattern of fathers begetting sons but names Tamar, Rahab, Ruth, Uriah’s wife and Mary'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew follows the Old Testament pattern of fathers begetting sons. In addition to the men, Matthew included five women in this list: Tamar (Matthew 1:3), Rahab and Ruth (1:5), Uriah’s wife (1:6), and Mary (1:16).'
  - where: 'note 1:3 “Four women in a list of fathers”'
    claim: 'The four were Gentiles: Tamar and Rahab Canaanites, Ruth a Moabite; Bathsheba named by her tie to Uriah the Hittite'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew includes four Gentile women in Jesus’ genealogy, highlighting the importance of Gentiles in the coming forth of the Messiah. Tamar and Rahab were Canaanites, and Ruth was a Moabite.'
  - where: 'note 1:3 “Four women in a list of fathers”'
    claim: 'Bathsheba is not named; the scriptures are silent on her background; naming her through Uriah the Hittite may serve Matthew’s purpose'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'The scriptures are silent on her ethnic background; therefore it served Matthew’s purposes to identify her instead by her relationship to Uriah, who was known to be a Hittite (see 2 Samuel 11:3).'
  - where: 'note 1:3 “Four women in a list of fathers”'
    claim: 'The theme continues with the wise men in chapter 2 and the commission to all nations'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'This universalistic tone is further strengthened in chapter 2, where the Wise Men seek out and worship the Christ child as “King of the Jews” when the representatives of Judaism fail to do so.'
  - where: 'note 1:3 “Four women in a list of fathers”'
    claim: 'Another suggestion: Gentiles have a part in Jesus’s work since they appear in his ancestry'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Or maybe Matthew was simply showing how Gentiles would also have a part in Jesus’s work and ministry, since they appear in his ancestry.'
  - where: 'note 1:16 “Joseph’s line, not Joseph’s son”'
    claim: '“Of whom” is feminine in the Greek, referring to Mary'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/1-16.htm'
    quote: 'hēs ἧς whom RelPro-GFS'
  - where: 'note 1:16 “Joseph’s line, not Joseph’s son”'
    claim: 'Royal succession was patrilineal; the genealogy is Joseph’s; the angel calls him son of David; he adopts Jesus by naming him'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Jesus’s genealogy is that of Joseph, his foster father (see Matthew 1:16), and in the annunciation to Joseph, the angel specifically identifies the carpenter as “Joseph, thou son of David” (1:20).'
  - where: 'note 1:16 “Joseph’s line, not Joseph’s son”'
    claim: 'Matthew and Luke differ; the probable explanation is a legal descent in Matthew and a natural one in Luke'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'moreover, nearly all the names are different. The probable explanation is that the descent may be traced through two different lines. Matthew gives a legal descent and includes several adopted children, such adoption carrying with it legal rights, while Luke gives a natural descent through actual parentage.'
  - where: 'note 1:16 “Joseph’s line, not Joseph’s son”'
    claim: 'Matthew descends from Abraham for Jewish readers; Luke ascends to Adam and God'
    key: bd-genealogy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/genealogy?lang=eng'
    quote: 'that in Matt. 1:1–17 descends from Abraham to Jesus, being intended for Jewish readers; while that in Luke 3:23–38 ascends from Jesus to Adam, and to God, this Gospel being written for the world in general.'
  - where: 'note 1:17 “Three fourteens”'
    claim: 'In Hebrew gematria David’s name adds to fourteen; Matthew may have arranged the pedigree to repeat Jesus’s tie to David three times'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'The numerical values of the Hebrew consonants dalet-vav-dalet add up to fourteen. It is possible that Matthew purposely organized the pedigree in such a way that he could create a 14-14-14 pattern that repeated Jesus’s connection to King David three times.'
  - where: 'note 1:17 “Three fourteens”'
    claim: 'In the summary the only people named again, besides Abraham, are David and Christ'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'When Matthew summarizes the genealogy in periods of fourteen generations, the only people he names again, besides Abraham, are King David and Christ (Matthew 1:16–17).'
  - where: 'note 1:18 “Espoused, yet husband and wife”'
    claim: 'Betrothal was much more binding than modern engagement; marriage had two stages; legal action was required to dissolve it'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Once the marriage was agreed on, the wedding consisted of two stages: betrothal and a separate celebration. Betrothal was legally and religiously more significant than the subsequent celebration, after which cohabitation actually began.'
  - where: 'note 1:18 “Espoused, yet husband and wife”'
    claim: 'Betrothed couples were legally husband and wife, chastity enforced until cohabitation, unfaithfulness punishable by death'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Though betrothed couples were regarded as husband and wife legally (Deuteronomy 22:23–24), between the time of betrothal and the celebration that inaugurated cohabitation, a strict code of chastity was enforced (Matthew 1:18, 25).'
  - where: 'note 1:18 “Espoused, yet husband and wife”'
    claim: 'Unfaithfulness during betrothal could be punished by death'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Nonetheless, Mosaic law still referred to the woman as a wife, and unfaithfulness during the period of betrothal (espousal) could be punished by death (Deuteronomy 22:23–24).'
  - where: 'note 1:19 “What a just man chose”'
    claim: 'Joseph would not have Mary stoned or disgraced and chose a quiet divorce by legal document; only after this was he instructed by the angel'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Joseph did not want to have Mary stoned or exposed to public disgrace and therefore determined to divorce her quietly by signing the necessary legal document, called in Hebrew a sefer keritut (Deuteronomy 24:1), later called a get.'
  - where: 'note 1:19 “What a just man chose”'
    claim: 'Only after the test of his character was Joseph instructed in a dream'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Only after the test of his character was he instructed in a dream by an angel to complete the marriage process.'
  - where: 'note 1:20 “By the power of the Holy Ghost”'
    claim: 'The angel’s words make clear Joseph was not the father; Restoration scripture clarifies “by the power of the Holy Ghost”'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'For Latter-day Saints, this divine agency is clarified through Restoration scripture, which clarifies that Mary, a precious and chosen vessel, conceived and was overshadowed “by the power of the Holy Ghost” (see Alma 7:10; emphasis added).'
  - where: 'note 1:20 “By the power of the Holy Ghost”'
    claim: 'Alma 7:10 says Mary would conceive by the power of the Holy Ghost'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/7?lang=eng'
    quote: 'she being a virgin, a precious and chosen vessel, who shall be overshadowed and conceive by the power of the Holy Ghost, and bring forth a son, yea, even the Son of God.'
  - where: 'note 1:20 “By the power of the Holy Ghost”'
    claim: 'President Nelson: born of an immortal Father and a mortal mother; from each He inherited life and death'
    key: nelson-christ-savior-born
    url: 'https://www.churchofjesuschrist.org/study/new-era/2006/12/christ-the-savior-is-born?lang=eng'
    quote: 'Jesus was born of an immortal Father and a mortal mother. From His immortal Father, Jesus inherited the power to live forever. From His mortal mother He inherited the fate of physical death.'
  - where: 'note 1:20 “By the power of the Holy Ghost”'
    claim: 'Latter-day Saint theology affirms the virgin birth'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Latter-day Saint theology affirms the doctrine of the virgin birth, but not immaculate conception (Alma 7:10).'
  - where: 'note 1:21 “Named for what He would do”'
    claim: '“For” gives the reason for the name; the link with salvation is in Hebrew, Yehoshua “Yahweh is salvation”'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'While there is no logical connection between salvation and the name Jesus in English or Iēsous in Greek, there is a correlation in Hebrew, where the name Yehôshua is taken to mean “Yahweh is salvation.”'
  - where: 'note 1:21 “Named for what He would do”'
    claim: 'Jesus is the Greek form of Joshua; Joshua son of Nun is so called in Acts 7:45 and Heb. 4:8; the name was not uncommon'
    key: bd-jesus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jesus?lang=eng'
    quote: 'The Greek form of the name Joshua or Jeshua, “God is help” or “Savior.” Joshua son of Nun is so spoken of in Acts 7:45 and Heb. 4:8.'
  - where: 'note 1:21 “Named for what He would do”'
    claim: 'The name was not uncommon among the Jews'
    key: bd-jesus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jesus?lang=eng'
    quote: 'The name was not an uncommon one among the Jews.'
  - where: 'note 1:22 “What Matthew means by fulfilled”'
    claim: 'Matthew uses formula citations as many as fourteen times, eight from Isaiah; no other Gospel so insistently'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'Matthew uses this method of relating the Old and New Testaments as many as fourteen times in his Gospel, eight of which are citations of the prophet Isaiah. … no other Gospel writer applies this device as insistently as does Matthew.'
  - where: 'note 1:22 “What Matthew means by fulfilled”'
    claim: 'In context the Immanuel prophecy refers to events in Isaiah’s own lifetime'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Yet Isaiah never claims to have witnessed the birth of Jesus in a vision. What’s more, in the larger literary and historical context of Isaiah 7, the Immanuel prophecy seems to refer directly to events that occurred in Isaiah’s own lifetime.'
  - where: 'note 1:22 “What Matthew means by fulfilled”'
    claim: '“Fulfill” in the New Testament can mean a foretold event, a completion, or the consummation of a covenant promise'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'fulfillment can describe (1) the actualization of an event foretold precisely as it would occur; (2) the “completion” of something that began in the past; and (3) the “consummation” of a covenant-promise.'
  - where: 'note 1:22 “What Matthew means by fulfilled”'
    claim: 'Matthew does not specify which he means'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'Matthew does not specify what he means by the word fulfillment when he says, “All this was done, that it might be fulfilled which was spoken of the Lord by the prophet” (Matthew 1:22).'
  - where: 'note 1:22 “What Matthew means by fulfilled”'
    claim: 'The immediate fulfillment remains a riddle; its purpose was to assure Ahaz'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'The immediate fulfillment of this prophecy remains a riddle. The primary purpose of the prophecy, however, was to inform Ahaz that by the time this “son” has learned to choose between good and evil, both Rezin and Pekah will be dead'
  - where: 'note 1:22 “What Matthew means by fulfilled”'
    claim: 'Multiple fulfillment: partial in its own time, further later; the later not more correct than the original'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'multiple fulfillment prophecy, meaning that one prophecy can have a partial fulfillment in the time in which it is given, and a further fulfillment at a later time. The future fulfillment, however, should not be taken as more “correct” or important than the original.'
  - where: 'note 1:22 “What Matthew means by fulfilled”'
    claim: 'For Matthew, Immanuel more fully satisfies the promise to Ahaz and David'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'For Matthew, Immanuel is the sign of a new Davidic rule, one that more fully satisfies God’s promise to Ahaz and to King David.'
  - where: 'note 1:25 “Mary’s other children”'
    claim: 'To know a man means sexual relations (Luke 1:34)'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'From Mary, a mortal woman who had never had sexual relations with any man (Luke 1:34), Jesus inherited mortality'
  - where: 'note 1:23 “God with us, to the end”'
    claim: 'Emmanuel forms an inclusio with Matthew 28:20; everything between shows Jesus fulfilling his Emmanuel role'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Every sermon, miracle, and interaction between these two bookends shows Jesus fulfilling his Emmanuel role.'
  - where: 'note 1:23 “God with us, to the end”'
    claim: 'For Ahaz Immanuel meant Davidic rule would not end with him; for Matthew Jesus as God with us is the only one who could fully satisfy the promise to David'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'For Ahaz, Immanuel was a sign of God’s promise that he (Ahaz) would not be overthrown and that Davidic rule would not end with him. For Matthew, Immanuel is the sign of a new Davidic rule'
  - where: 'note 1:23 “God with us, to the end”'
    claim: 'Jesus is the Davidic king who, as God with us, could fully satisfy the promise of an everlasting throne'
    key: rsc-combs-ahaz-sign
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/king-ahazs-sign-christ-jesus'
    quote: 'For Matthew, Jesus is not just another Davidic king who will rule until he is conquered or dies. He is the Davidic king.'
