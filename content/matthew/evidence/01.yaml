  - where: 'note 1:3 “Four women in a list of fathers”'
    claim: 'Another suggestion: Mary is listed with these women because they too were seen as sinners or outcasts'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
