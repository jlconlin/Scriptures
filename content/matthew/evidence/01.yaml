  - where: 'note 1:16 “Joseph’s line, not Joseph’s son”'
    claim: 'On this reading, by accepting and naming the child Joseph claims Jesus as his son and makes Him heir to the Davidic throne'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'In order to legally claim Jesus as his own son, thereby making Jesus an heir to the Davidic throne, Joseph accepts Mary’s baby when he is born, giving him a name (1:25) and thereby adopting him into the Davidic line.'
