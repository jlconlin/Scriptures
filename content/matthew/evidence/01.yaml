    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'between the time of betrothal and the celebration that inaugurated cohabitation, a strict code of chastity was enforced (Matthew 1:18, 25).'
