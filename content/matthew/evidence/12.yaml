chapter: 12
claims:
  - where: setting
    claim: 'Matthew 12 follows directly on the invitation of 11:28–30'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Matthew’s account directly follows Christ’s invitation (11:28–30): “Come unto me, all ye that labour and are heavy laden, and I will give you rest.'
  - where: setting
    claim: 'The two Sabbath controversies are told in all three Synoptics, back to back'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'two striking accounts of Sabbath controversies are found in all three of the Synoptic Gospels and are given back-to-back.'
  - where: thread
    claim: 'Ascribing Christ’s power to Satan came very near blasphemy against the Holy Ghost'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'to speak against the authority He possessed, and particularly to ascribe that power and authority to Satan, was very near to blasphemy against the Holy Ghost'
  - where: when
    claim: 'The Beelzebub charge came while Jesus was touring Galilee'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'While the Lord was making His second missionary tour through Galilee'
  - where: section 4 plain
    claim: '“Spoil” in v. 29 is “plunder” in the Greek (footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: '29a “spoil”: GR plunder.'

  - where: 'note 12:2 “Reaping on the Sabbath”'
    claim: 'Plucking grain on the Sabbath would have been widely held unlawful, not a distinctively Pharisaic rule'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'The sense that reaping or plucking grain on the Sabbath would be a violation of Sabbath law “would not, in any way, be a distinctively Pharisaic rule,”[11] but rather would be a generally accepted sense of what was inappropriate on the Sabbath.'
  - where: 'note 12:2 “Reaping on the Sabbath”'
    claim: 'The Pharisees saw plucking as reaping (compare Ex. 34:21)'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'this action of plucking grain is clearly seen by the Pharisees as “reaping,” because they ask Jesus why the disciples are doing “that which is not lawful” on the Sabbath (Mark 2:24; compare Exodus 34:21).'
  - where: 'note 12:2 “Reaping on the Sabbath”'
    claim: 'Deut. 23:25 permits plucking by hand, but this was not a permissible Sabbath activity'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'There is a provision in the law that “if you enter your neighbor’s grainfield, you may pick kernels with your hands, but you must not put a sickle to their standing grain” (Deuteronomy 23:25 … This would not, however, have been seen as a permissible Sabbath activity.'
  - where: 'note 12:2 “Reaping on the Sabbath”'
    claim: 'In each Gospel Jesus’s explanation of why He permits it is the point'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Thus in each Gospel, the explanation of why Jesus permits the disciples to pluck the grain is an important statement'
  - where: 'note 12:2 “Reaping on the Sabbath”'
    claim: 'Exodus 34:21: rest in earing time and harvest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'Six days thou shalt work, but on the seventh day thou shalt rest: in earing time and in harvest thou shalt rest.'

  - where: 'note 12:5 “Two precedents, David and the priests”'
    claim: 'The David precedent is about authority, not the Sabbath directly; Jesus has David’s authority to cover a breach caused by hunger'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This response, found in all the Synoptic Gospels, does not speak to the Sabbath directly … David had the authority to partake of food that normally would have been off-limits, and that same kingly authority is being invoked by Jesus for the disciples'
  - where: 'note 12:5 “Two precedents, David and the priests”'
    claim: 'The shewbread was changed and eaten by priests on the Sabbath; David did what priests did on that day'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'the Sabbath was the day upon which the bread in the Holy Place was changed and eaten by priests … This verse might further explain the reference to David: he was doing what the priests did on the Sabbath.'
  - where: 'note 12:5 “Two precedents, David and the priests”'
    claim: 'Only Matthew has the priests’ precedent; Num. 28:9–10 Sabbath offering; argument from lesser to greater'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'If it is true for something lesser (the priests who worked in the temple on the Sabbath), it would certainly be true for something great (Christ, who is greater than the temple and the priests and who could authorize work on the Sabbath).'
  - where: 'note 12:5 “Two precedents, David and the priests”'
    claim: 'Rabbinic tradition: temple service overrides the Sabbath; Num. 28:9–10 the clearest required violation'
    key: mcclellan-go-ye-learn
    url: 'https://rsc.byu.edu/covenant-compassion/go-ye-learn-what-meaneth'
    quote: 'Scholars suggest that the responsibilities to prepare the Sabbath offering as outlined in Numbers 28:9–10 represent the clearest violation of the Sabbath that is required of the priestly office. … Rabbinic commentary, such as the Talmudic tractate Shabbat 132b, states that temple service “overrides” (dôḥâ) the requirements of the Sabbath.'
  - where: 'note 12:5 “Two precedents, David and the priests”'
    claim: 'Num. 28:9–10: two lambs, flour and oil every Sabbath, beside the continual offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'And on the sabbath day two lambs of the first year without spot, and two tenth deals of flour for a meat offering, mingled with oil, and the drink offering thereof:'

  - where: 'note 12:6 “Greater than the temple, and mercy above sacrifice”'
    claim: 'The temple is greater than the Sabbath; v. 6 makes clear Christ is greater than the temple'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'while the idea of the temple being greater than the Sabbath finds support in the fact that its priests worked there on the Sabbath, the statement “That in this place is one greater than the temple” (Matthew 12:6) makes it clear that Christ is greater than the temple.'
  - where: 'note 12:6 “Greater than the temple, and mercy above sacrifice”'
    claim: 'Only Matthew has Hosea 6:6 here; used also at 9:11–13; disciples guiltless (anaitious) as the priests blameless (anaitioi)'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'it is only in Matthew that we find the reference to Hosea 6:6 … they would not have pronounced judgment upon the innocent (τοὺς ἀναιτίους) (12:7)”—the disciples who were as blameless (ἀναίτιοί) as the priests laboring on the Sabbath (v. 5).'
  - where: 'note 12:6 “Greater than the temple, and mercy above sacrifice”'
    claim: 'Hesed: actions that avert danger from those who cannot avert it themselves, reaching beyond the law'
    key: mcclellan-go-ye-learn
    url: 'https://rsc.byu.edu/covenant-compassion/go-ye-learn-what-meaneth'
    quote: 'mercy (ḥesed) referred to actions that averted danger from members of the society who were not in a position to avert it themselves.[24] … Like righteousness, mercy also widened its gaze beyond the law to the prosocial outcomes at which the law was aimed.'
  - where: 'note 12:6 “Greater than the temple, and mercy above sacrifice”'
    claim: 'Matthew quotes Hosea 6:6 from the Septuagint, “I want mercy”'
    key: mcclellan-go-ye-learn
    url: 'https://rsc.byu.edu/covenant-compassion/go-ye-learn-what-meaneth'
    quote: 'The quotation of Hosea 6:6 comes from the ancient Greek translation of the Bible (Septuagint), which renders the Hebrew ḥesed ḥāpaṣtî (“I delight in mercy”) with the Greek éleos thélō (“I want mercy”).'
  - where: 'note 12:6 “Greater than the temple, and mercy above sacrifice”'
    claim: 'Jesus criticized using marginal legal points to condemn those doing good'
    key: mcclellan-go-ye-learn
    url: 'https://rsc.byu.edu/covenant-compassion/go-ye-learn-what-meaneth'
    quote: 'He was instead criticizing the scribes and Pharisees for leveraging rather marginal legal considerations in order to condemn the going about and doing good of him and his disciples.'
  - where: 'note 12:6 “Greater than the temple, and mercy above sacrifice”'
    claim: 'Matt. 9:13, the first use of Hosea 6:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'But go ye and learn what that meaneth, I will have mercy, and not sacrifice: for I am not come to call the righteous, but sinners to repentance.'

  - where: 'note 12:8 “Lord of the Sabbath, and of its rest”'
    claim: 'Mark alone has “the sabbath was made for man”; it has been suggested that leaving it out removes the ambiguity of “Son of man”'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'It has been suggested that the removal of the phrase “The sabbath was made for man, and not man for the sabbath” in Matthew and Luke also removes ambiguity … instead putting the focus more directly on Jesus (the Son of Man).'
  - where: 'note 12:8 “Lord of the Sabbath, and of its rest”'
    claim: 'All three end with the Son of Man Lord of the Sabbath; as Lord and Messiah He interprets the Sabbath command'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'As the Lord and messianic king, the Son of Man “acts as the final and infallible interpreter of the will of God as expressed in Torah and sabbath commandment.”'
  - where: 'note 12:8 “Lord of the Sabbath, and of its rest”'
    claim: 'Read after 11:28–30, the Sabbath rest can be seen as connected with the rest Christ gives'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'this statement of Jesus’s messianic lordship over the Sabbath can be seen as connecting the rest given by the Sabbath to the rest that Jesus promised to give to those who come unto him and learn of him (Matthew 11:28–30).'
  - where: 'note 12:8 “Lord of the Sabbath, and of its rest”'
    claim: 'The story of the hungry disciples fed might connect Christ’s rest with the Sabbath’s'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'this particular story of Christ making sure the disciples were fed might connect the rest that Christ offers with the rest that the Sabbath was meant to give.'
  - where: 'note 12:8 “Lord of the Sabbath, and of its rest”'
    claim: 'Mark 2:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/2?lang=eng'
    quote: 'And he said unto them, The sabbath was made for man, and not man for the sabbath:'

  - where: 'note 12:12 “Was healing forbidden on the Sabbath?”'
    claim: 'Saving life was acceptable; healing a chronic condition was different; apart from the Gospels no early source forbids healing, though it is not clear it was approved'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'This act seems to have been viewed as helping someone with a chronic condition rather than as saving life on the Sabbath, the latter of which would have been unquestionably acceptable. … There are no pre-Tannaitic sources other than the Gospels that say healing per se was forbidden on the Sabbath, but it is also not clear that it was approved Sabbath activity.'
  - where: 'note 12:12 “Was healing forbidden on the Sabbath?”'
    claim: 'Pharisees likely considered healing chronic ailments forbidden'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Doering concludes that “it is very likely that Pharisees in the first century would have considered healing such ailments forbidden on the Sabbath, no matter how they were carried out in detail.”'
  - where: 'note 12:12 “Was healing forbidden on the Sabbath?”'
    claim: 'Lifting an animal from a pit was widely accepted; the Damascus Document group stricter; perhaps Galilean rural practice'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'The stricter, isolationist group associated with the Damascus Document would have had a more extreme view in which leaving animals or perhaps even people in pits would be required to keep the Sabbath … “might reflect pragmatic rural legal practice, perhaps of Galilean provenance.”'
  - where: 'note 12:12 “Was healing forbidden on the Sabbath?”'
    claim: '“Lawful to do well” broadens lawfulness to helping those in need; Sabbath still to be kept'
    key: lane-sabbath-synoptic
    url: 'https://rsc.byu.edu/sacred-time/overview-sabbath-synoptic-gospels'
    quote: 'Keeping the Sabbath is still expected, but this interpretation broadens the sense of lawfulness to include helping and caring for those in need, demonstrated here in the healing of the man with the withered hand.'

  - where: 'note 12:16 “The quiet servant of Isaiah”'
    claim: 'One reading: the hour of conflict had not come and Jesus avoided premature offense'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'The hour of final conflict and suffering had not yet come, and Jesus would not hasten it. … sought to avoid premature occasions of offence.'
  - where: 'note 12:16 “The quiet servant of Isaiah”'
    claim: 'Pais: child or servant; after the Hebrew “servant of the LORD,” used of Jesus the Messiah in Matt. 12:18'
    key: thayer
    url: 'https://biblehub.com/greek/3816.htm'
    quote: 'likewise any upright and godly man whose agency God employs in executing his purposes; thus in the N. T. Jesus the Messiah: Matthew 12:18 (from Isaiah 42:1)'
  - where: 'note 12:16 “The quiet servant of Isaiah”'
    claim: 'Pais first sense: a child'
    key: thayer
    url: 'https://biblehub.com/greek/3816.htm'
    quote: '1. a child, boy or girl'
  - where: 'note 12:16 “The quiet servant of Isaiah”'
    claim: 'Footnote: “servant” GR son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: '18a “servant”: GR son.'
  - where: 'note 12:16 “The quiet servant of Isaiah”'
    claim: 'Isaiah foretold a ministry of small stir that would not break a bruised reed; He came to heal and help the weak'
    key: ball-isaiah-messiah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/isaiah-messiah'
    quote: 'In fact, in outward appearance His ministry would be of such a small stir that He would not break even a fragile “reed,” although it may already be “bruised,” … He came not to crush or abuse the tender, weak, ill, humble, and penitent, but rather to heal and help them.'

  - where: 'note 12:24 “Beelzebub, and a charge that could kill”'
    claim: 'Beelzebub: a Philistine god, a title for Satan; spelled Baalzebub in 2 Kgs. 1'
    key: bd-beelzebub
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beelzebub?lang=eng'
    quote: 'Name of a Philistine god. Used as a title for the “chief of the demons,” or Satan. … See also 2 Kgs. 1:1–6, where it is spelled Baalzebub.'
  - where: 'note 12:24 “Beelzebub, and a charge that could kill”'
    claim: 'The crowd’s question asked whether this was the Christ they expected; it maddened the Pharisees'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: '“Is not this the son of David?” in other words, Can this be any other than the Christ we have been so long expecting? The popular judgment so voiced maddened the Pharisees'
  - where: 'note 12:24 “Beelzebub, and a charge that could kill”'
    claim: 'The Beelzebub charge was a legal allegation with dire implications (Mark 3:22, scribes from Jerusalem)'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'In Mark 3:22, scribes (legal officials) were brought all the way to Galilee from Jerusalem to give their legal opinion in this case. … There was not a theological debate going on, then, but a legal investigation resulting in an allegation with dire legal implications.'
  - where: 'note 12:24 “Beelzebub, and a charge that could kill”'
    claim: 'Miracles forced the question of power; Mosiah 3:9 foretold the charge'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'His mighty miracles forced the issue then—and now—of identifying by what power did Jesus do these things. If He did them by the power of God, then He should be accepted and followed; but if He did them by the power of Beelzebub, then He should be feared and eliminated.'
  - where: 'note 12:24 “Beelzebub, and a charge that could kill”'
    claim: 'Mosiah 3:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'and even after all this they shall consider him a man, and say that he hath a devil, and shall scourge him, and shall crucify him.'

  - where: 'note 12:27 “Your own followers cast out devils”'
    claim: '“Your children” are the Pharisees’ disciples who practiced exorcism; the question requires that they did cast out, not by Beelzebub'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'The “children” of the Pharisees are their disciples, and in this case, such as practised exorcism … Our Lord’s question, indeed, requires for its logical validity the admission that the “children” of the accusers did really cast out demons, and that not by Beelzebub.'
  - where: 'note 12:27 “Your own followers cast out devils”'
    claim: 'JST Matt. 12:23 adds that they cast out devils by the Spirit of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'JST Matt. 12:23 … you. For they also cast out devils by the Spirit of God, for unto them is given power over devils, that they may cast them out.'
  - where: 'note 12:27 “Your own followers cast out devils”'
    claim: 'That Jesus cast out devils was conceded; on either proposition the Pharisees were defeated'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'By the acceptance of either proposition, and surely one was true, for the fact that Jesus did cast out devils was known throughout the land and was conceded in the very terms of the charge now brought against Him, the accusing Pharisees stood defeated and condemned.'

  - where: 'note 12:27 “Your own followers cast out devils”'
    claim: 'The strong man is Satan; Christ could not have cast out devils had He not first subdued him; no truce between them'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'how could Christ have done this had He not first subdued the “strong man,” the master of devils, Satan himself? … There could be no agreement, no truce nor armistice between the contending powers of Christ and Satan. Offering a suggestion of self judgment to His accusers'

  - where: 'note 12:31 “The sin that is not forgiven”'
    claim: 'Joseph Smith, 1844: all sins forgiven except against the Holy Ghost; it requires denying Christ when the heavens were open'
    key: jsp-discourse-1844-04-07
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-7-april-1844-as-published-in-times-and-seasons/5'
    quote: 'All sins shall be forgiven except the sin against the Holy Ghost: after a man has sinned against the Holy Ghost there is no repentance for him, he has got to say that the sun does not shine, while he sees it, he has got to deny Jesus Christ when the heavens were open to him'
  - where: 'note 12:31 “The sin that is not forgiven”'
    claim: 'D&C 76:35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'Having denied the Holy Spirit after having received it, and having denied the Only Begotten Son of the Father, having crucified him unto themselves and put him to an open shame.'
  - where: 'note 12:31 “The sin that is not forgiven”'
    claim: 'Alma 39:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/39?lang=eng'
    quote: 'For behold, if ye deny the Holy Ghost when it once has had place in you, and ye know that ye deny it, behold, this is a sin which is unpardonable'
  - where: 'note 12:31 “The sin that is not forgiven”'
    claim: 'JST Matt. 12:26: “unto men who receive me and repent”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'JST Matt. 12:26 … unto men who receive me and repent; but …'
  - where: 'note 12:31 “The sin that is not forgiven”'
    claim: 'Words against Jesus as a man might be forgiven; ascribing His power to Satan very near blasphemy against the Holy Ghost'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Jesus was merciful in His assurance that words spoken against Himself as a Man, might be forgiven; but to speak against the authority He possessed, and particularly to ascribe that power and authority to Satan, was very near to blasphemy against the Holy Ghost'

  - where: 'note 12:36 ““Idle” words”'
    claim: 'Argos: from without + work; of things yielding no profit though they ought; in Matt. 12:36 unprofitable, by litotes pernicious'
    key: thayer
    url: 'https://biblehub.com/greek/692.htm'
    quote: 'c. of things from which no profit is derived, although they can and ought to be productive; as of fields, trees, gold and silver … unprofitable, ῤῆμα ἀργόν, by litotes equivalent to pernicious (see ἄκαρπος): Matthew 12:36.'
  - where: 'note 12:36 ““Idle” words”'
    claim: 'Argos contracted from a-privative and ergon'
    key: thayer
    url: 'https://biblehub.com/greek/692.htm'
    quote: 'contracted from ἀεργός which Homer uses, from alpha privative and ἔργον without work, without labor, doing nothing), inactive, idle'
  - where: 'note 12:36 ““Idle” words”'
    claim: 'Not “evil” but “idle” words, random utterances that betray character; the Beelzebub taunt was one; account, not necessarily condemnation'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'Our Lord does not speak, as we might have expected, of “every evil word,” but of “every idle—i.e., useless and purposeless—word,” the random utterances which, as being more spontaneous, betray character more than deliberate speech. Such an “idle word” had been the passing taunt'
  - where: 'note 12:36 ““Idle” words”'
    claim: 'Ellicott: account, entering the divine estimate of character'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'It is not said, however, that for every such random speech a man shall be condemned, but that he shall give an account for it. It will enter into that great total which determines the divine estimate of his character'

  - where: 'note 12:39 “Why “adulterous”?”'
    claim: 'The prophets pictured Israel and Jehovah as wife and husband; the adulterous generation is unfaithful, demanding a sign rather than accepting proofs given'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/12.htm'
    quote: 'The true relation between Israel and Jehovah had been represented by the prophets as that of the wife to her husband (Jeremiah 3; Ezekiel 16, 23; Hosea 1, 2). The adulterous generation was therefore one that was unfaithful to its Lord—demanding a sign'
  - where: 'note 12:39 “Why “adulterous”?”'
    claim: 'They had already seen signs in profusion; wanted a wonder for curiosity or excuse for action'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Had they not already seen signs in profusion? … They would have some surpassing wonder wrought, to satisfy curiosity, or perhaps to afford them further excuse for action against Him'
  - where: 'note 12:39 “Why “adulterous”?”'
    claim: 'D&C 63:9–10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/63?lang=eng'
    quote: 'But, behold, faith cometh not by signs, but signs follow those that believe. Yea, signs come by faith, not by the will of men, nor as they please, but by the will of God.'

  - where: 'note 12:40 “The sign of the prophet Jonas”'
    claim: 'The sign: Jonah three days in the fish then freed; the Son of Man in the tomb and risen; the only sign, by which they stand condemned; Nineveh and the queen of Sheba'
    key: talmage-jesus-christ-18
