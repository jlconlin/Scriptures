chapter: 9
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'Matthew collects miracle stories into a thematic block in chapters 8–9, so his order differs from Mark’s'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'the differences in Markan chronology in Matthew 4–13 can be attributed to Matthew’s penchant for collecting materials into thematic blocks (see the collections of miracle stories in Matthew 8–9 and of the parables in Matthew 13).'
  - where: setting
    claim: 'Matthew gathers the miracle stories of chapters 8–9 into a thematic block, departing from Mark’s order'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'the differences in Markan chronology in Matthew 4–13 can be attributed to Matthew’s penchant for collecting materials into thematic blocks (see the collections of miracle stories in Matthew 8–9 and of the parables in Matthew 13).'
  - where: setting
    claim: '4:23 and 9:35 are bookends; the sermon and the miracles show Jesus as Messiah in word and deed'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew expected that his readers would recognize that the Sermon on the Mount in chapters 5–7 should be read in conjunction with the collection of miracles in chapters 8 and 9. Thus, Matthew wants his readers to see that Jesus is the Messiah in both word (the Sermon on the Mount) and deed (His miracles).'
  - where: setting
    claim: 'Matthew was known before his conversion as Levi; a tax gatherer at Capernaum'
    key: bd-matthew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/matthew?lang=eng'
    quote: 'Known before his conversion as Levi, son of Alphaeus (Mark 2:14). He was a tax gatherer at Capernaum, probably in the service of Herod Antipas, in whose tetrarchy Capernaum was.'
  - where: setting
    claim: 'The palsied man was healed when Jesus was again in Capernaum, His known place of abode'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: '“Some days” after the healing of the leper, Jesus was again in Capernaum. … His place of abode in Capernaum was well known, and word was soon noised about that He was in the house.'
  - where: thread
    claim: 'Matthew 8–9 hold an example of every miracle Jesus names to John’s disciples in 11:5, arranged as evidence that He was the coming one'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew provided evidence that Jesus performed healings in Matthew 8–9, where there is at least one example of every miracle that is mentioned in Matthew 11:5. … Matthew therefore arranged the material in chapters 5–9 to provide evidence for his readers that Jesus was indeed the coming one.'
  - where: thread
    claim: 'The forgiving and the healing together asserted His authority and divinity'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'He, the Son of Man, claimed and possessed the right and the power to remit both physical and spiritual penalties, to heal the body of visible disease, and to purge the spirit of the no less real malady of sin.'

  # ---- section plain renderings
  - where: section 1 plain
    claim: 'Palsy: a paralysis that left the man helpless'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'a man afflicted with palsy, a species of paralysis which deprived the subject of the power of voluntary motion and usually of speech; the man was helpless.'
  - where: section 2 plain
    claim: 'The receipt of custom: the custom-house where the tariff was paid'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'sitting at the custom-house where the tariff levied under Roman law had to be paid.'
  - where: section 3 plain
    claim: 'Bottles: leather bags (wineskins)'
    key: thayer
    url: 'https://biblehub.com/greek/779.htm'
    quote: 'ἀσκός, ἀσκοῦ, ὁ, a leathern bag or bottle, in which water or wine was kept: Matthew 9:17; Mark 2:22; Luke 5:37f.'
  - where: section 4 plain
    claim: 'Hem: the tassel hanging from the edge of the cloak'
    key: thayer
    url: 'https://biblehub.com/greek/2899.htm'
    quote: 'a little appendage hanging down from the edge of the mantle or cloak, made of twisted wool; a tassel, tuft: Matthew 9:20'
  - where: section 4 plain
    claim: 'Minstrels: flute players among the professional mourners'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Professional mourners, including singers of weird dirges, and minstrels who made great noise with flutes and other instruments, had already been summoned to the house.'
  - where: section 5 plain
    claim: '“Straitly charged” is a word of strong emotion: sternly warned'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'Straitly charged them.—The word, implying originally the panting breath of vehement emotion, is one of the strongest used by the New Testament writers'
  - where: section 6 plain
    claim: '“Fainted”: the better-attested reading means harassed'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'There is, however, an immense preponderance of authority in favour of another reading, which gives the passive participle … meaning literally “flayed,” and thence figuratively “tormented, worried, vexed.”'

  # ---- notes
  - where: 'note 9:2 “Whose faith, and why forgiveness first”'
    claim: 'Jesus was impressed by the faith and works of the bearers, and knew the sufferer’s own faith'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Jesus was deeply impressed by the faith and works of those who had thus labored to place a helpless paralytic before Him; doubtless, too, He knew of the trusting faith in the heart of the sufferer'
  - where: 'note 9:2 “Whose faith, and why forgiveness first”'
    claim: 'The man was probably afraid; in his case sin and affliction were connected, but not all illness comes from sin (John 9)'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The man was probably in a state of fear; … In this man’s condition there was plainly a close connection between his past sins and his present affliction … We are not warranted, however, in assuming that all bodily ills are the result of culpable sin'
  - where: 'note 9:2 “Whose faith, and why forgiveness first”'
    claim: 'Christ recognized the man’s repentance with his faith'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Christ recognized his repentance together with the faith that accompanied it, and it was the Lord’s rightful prerogative to decide upon the man’s fitness to receive remission of his sins and relief from his bodily affliction.'
  - where: 'note 9:2 “Whose faith, and why forgiveness first”'
    claim: 'Mark’s account: four bearers, the roof opened'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/2?lang=eng'
    quote: 'And they come unto him, bringing one sick of the palsy, which was borne of four.'
  - where: 'note 9:6 “Power on earth to forgive sins”'
    claim: 'Ellicott: forgiving words cannot be tested; the command to walk could be; an argument a fortiori'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'It was easier to say, “Thy sins are forgiven thee,” for those words could not be put to any outward test, and only the consciousness of the sinner could attest their power. It was a bolder and a harder thing to risk the utterance of words which challenged an immediate and visible fulfilment'
  - where: 'note 9:6 “Power on earth to forgive sins”'
    claim: 'Talmage: the two sayings were of allied meaning; Jesus openly asserted His divinity'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'Is it not a rational explanation that, when spoken authoritatively by Him, the two expressions were of allied meaning? … In the presence of people of all classes Jesus thus openly asserted His divinity, and affirmed the same by a miraculous manifestation of power.'
  - where: 'note 9:6 “Power on earth to forgive sins”'
    claim: 'JST Matt. 9:5 reads the question as a statement that forgiving words are easier to say'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'JST Matt. 9:5 For is it not easier to say, Thy sins be forgiven thee, than to say, Arise and walk?'
  - where: 'note 9:6 “Power on earth to forgive sins”'
    claim: 'The ideas behind the title include dignity as head of the kingdom and judge, citing Mark 2:10'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: '(2) honor and dignity, as head and founder of the kingdom of God, and judge of all men (Matt. 13:41; 16:28; 19:28; 24:30–31; 25:31; 26:64; Mark 2:10, 28)'
  - where: 'note 9:6 “Power on earth to forgive sins”'
    claim: 'The crowd rested in the thought of power given to men'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'They rested in the thought of a delegated authority, a “power given to men,” as such, without passing on to the deeper truth of the union of the manhood with God.'
  - where: 'note 9:6 “Power on earth to forgive sins”'
    claim: 'Mark: the scribes asked who can forgive sins but God only'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/2?lang=eng'
    quote: 'Why doth this man thus speak blasphemies? who can forgive sins but God only?'
  - where: 'note 9:9 “A tax collector called Levi”'
    claim: 'Levi son of Alphaeus; tax gatherer at Capernaum probably for Herod Antipas; gave a feast to his old associates'
    key: bd-matthew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/matthew?lang=eng'
    quote: 'Known before his conversion as Levi, son of Alphaeus (Mark 2:14). He was a tax gatherer at Capernaum, probably in the service of Herod Antipas, in whose tetrarchy Capernaum was. Soon after his call he gave a feast to his old associates'
  - where: 'note 9:9 “A tax collector called Levi”'
    claim: 'Publicans leased the right to collect customs at borders, kept the excess, and were considered corrupt'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'customs were collected at every territorial border by publicans who leased the right to collect them from the client king or governor in exchange for an agreed-upon amount of money. Should a publican’s revenue exceed the amount … he was entitled to keep the excess'
  - where: 'note 9:9 “A tax collector called Levi”'
    claim: 'Publicans commonly considered corrupt, the reason Jesus was criticized'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'Because publicans’ livelihoods depended on the amount of money they collected from travelers, they were commonly considered corrupt and were notorious for their unethical practices. It was for this reason that Jesus was criticized for eating with “publicans and sinners” (Mark 2:16).'
  - where: 'note 9:9 “A tax collector called Levi”'
    claim: 'A Jew who took the office was held in bitter contempt; publicans were practically ostracized'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'If publicans in general were detested, we can readily understand how bitter would be the contempt in which the Jews would hold one of their own nation who had accepted appointment as such an official. In this unenviable status was Matthew when Jesus called him.'
  - where: 'note 9:11 “Why the Pharisees objected to the meal”'
    claim: 'Table fellowship: eating with the ritually unclean threatened the hosts’ purity; publicans were excluded; Pharisees kept priestly purity at home'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'by eating with others that were ritually unclean Jesus would also threaten the purity of His Pharisaic hosts. The tax collectors, or publicans, were specifically excluded from the Pharisees’ table fellowship.'
  - where: 'note 9:11 “Why the Pharisees objected to the meal”'
    claim: 'Pharisees kept the priests’ ritual cleanliness at home and ate only with the equally obedient'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'For the Pharisees, those who keep the ritual cleanliness of the priests in their homes allow the holiness of the temple to reside in the home. But in order to keep this level of holiness, it was required that they eat only with others who were equally obedient.'
  - where: 'note 9:11 “Why the Pharisees objected to the meal”'
    claim: 'The Pharisees would agree the sinners were sick; they could see themselves as righteous'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'On its face it might not be clear how these comments would rile the “scribes and Pharisees” because they would naturally concur that the sinners and tax collectors were sick and did need a physician. They could see themselves as righteous and the others as unworthy.'
  - where: 'note 9:13 “Go and learn what Hosea meant”'
    claim: 'Jesus challenges their conception of holiness: their own ritual purity had become “sacrifice” while they ignored the spiritually sick'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'Their understanding of holiness, which required strict adherence to the requirements for priests’ ritual purity, had become for them “sacrifice” and “burnt offerings.” Jesus is challenging their fundamental conception of holiness and the law by questioning their focus on their own ritual purity while ignoring the spiritually sick'
  - where: 'note 9:13 “Go and learn what Hosea meant”'
    claim: 'Matthew alone adds the Hosea quotation, which calls the questioners into question'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'In Matthew’s account, the Savior points out this universal tendency in His accusers with an additional phrase that calls the questioners into question and invites them to a higher level of holiness.'
  - where: 'note 9:15 “The bridegroom taken away”'
    claim: 'The questioners included John’s disciples, allied with Pharisees; John had called himself the Bridegroom’s friend'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'To the friends of the now imprisoned Baptist our Lord’s reply must have brought memories of their beloved leader’s words, when he had compared himself to the Bridegroom’s friend, and had plainly told them who was the real Bridegroom.'
  - where: 'note 9:15 “The bridegroom taken away”'
    claim: 'John’s disciples, left without a leader, fell in with the Pharisees'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The Baptist had been a scrupulous observer of the law; his strict asceticism vied with the rigor of Pharisaic profession. His non-progressive disciples, now left without a leader, naturally fell in with the Pharisees.'
  - where: 'note 9:15 “The bridegroom taken away”'
    claim: 'The first recorded intimation in His public teaching of His death; Matthew 25:6'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'Noteworthy as the first recorded intimation in our Lord’s public teaching … of His coming death. The joy of the wedding-feast would cease, and then would come the long night of expectation, till once again there should be the cry, “Behold, the Bridegroom cometh” (Matthew 25:6).'
  - where: 'note 9:16 “What the patch and the bottles were about”'
    claim: 'JST Matt. 9:18–21: the Pharisees ask to be received with their baptism; Jesus refuses'
    key: jst-matt-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/9?lang=eng'
    quote: 'But Jesus said unto them, Ye keep not the law. If ye had kept the law, ye would have received me, for I am he who gave the law. … I receive not you with your baptism, because it profiteth you nothing. … For when that which is new is come, the old is ready to be put away.'
  - where: 'note 9:16 “What the patch and the bottles were about”'
    claim: 'JST verse 18: the Pharisees’ question about their baptism and keeping the whole law'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: '18. Then said the Pharisees unto him, Why will ye not receive us with our baptism, seeing we keep the whole law?'
  - where: 'note 9:16 “What the patch and the bottles were about”'
    claim: 'Millet: the JST gives background for the otherwise abstruse words; Joseph Smith met a similar resistance in 1830 (D&C 22)'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'The Joseph Smith translation provides a fascinating background for the Savior’s otherwise abstruse words concerning cloth and bottles. A similar resistance was encountered by Joseph Smith at the time of the organization of the latter-day Church. The Lord’s message was as timely in A.D. 30 as in 1830:'
  - where: 'note 9:16 “What the patch and the bottles were about”'
    claim: 'D&C 22:2: baptized an hundred times it availeth nothing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/22?lang=eng'
    quote: 'Wherefore, although a man should be baptized an hundred times it availeth him nothing, for you cannot enter in at the strait gate by the law of Moses, neither by your dead works.'
  - where: 'note 9:17 “New wine in old wineskins”'
    claim: 'The bottles were skins of animals that deteriorated with age and would burst'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The bottles here referred to were really bags, made of the skins of animals, and of course they deteriorated with age. Just as old leather splits or tears under even slight strain, so the old bottle-skins would burst from the pressure of fermenting juice'
  - where: 'note 9:17 “New wine in old wineskins”'
    claim: 'The gospel was no addendum but a new and everlasting covenant'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The gospel taught by Christ was a new revelation, superseding the past, and marking the fulfillment of the law; it was no mere addendum, nor was it a reenactment of past requirements; it embodied a new and an everlasting covenant.'
  - where: 'note 9:17 “New wine in old wineskins”'
    claim: 'Thayer: askos, a leather bag for water or wine'
    key: thayer
    url: 'https://biblehub.com/greek/779.htm'
    quote: 'ἀσκός, ἀσκοῦ, ὁ, a leathern bag or bottle, in which water or wine was kept: Matthew 9:17; Mark 2:22; Luke 5:37f.'
  - where: 'note 9:18 “Dead, or dying?”'
    claim: 'Talmage: no contradiction; the girl was in the throes of death when the father left, and he feared she had died'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The maid was seemingly breathing her last, she was in the very throes of death, when the father hurried away. Before he met Jesus he felt that the end had probably come; nevertheless his faith endured.'
  - where: 'note 9:18 “Dead, or dying?”'
    claim: 'Matthew’s brief account; Jairus fell at His feet, or as Matthew says worshipped Him; a ruler of the synagogue'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'He approached Jesus with the reverence due One whom he considered able to grant what he asked, and fell at the Lord’s feet, or as Matthew says, worshiped Him. When the man had started from his home to seek aid of Jesus, the maiden was at the point of death; he feared lest she had died in the interval.'
  - where: 'note 9:18 “Dead, or dying?”'
    claim: 'JST Matt. 9:24 reads “dying”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'JST Matt. 9:24 … My daughter is even now dying …'
  - where: 'note 9:20 “Twelve years unclean”'
    claim: 'Under the law a woman with an issue of blood beyond her time was unclean, and what she lay or sat on, and whoever touched it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'And if a woman have an issue of her blood many days out of the time of her separation, or if it run beyond the time of her separation; all the days of the issue of her uncleanness shall be as the days of her separation: she shall be unclean.'
  - where: 'note 9:20 “Twelve years unclean”'
    claim: 'Whoever touched what she sat on was unclean until evening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'And whosoever toucheth those things shall be unclean, and shall wash his clothes, and bathe himself in water, and be unclean until the even.'
  - where: 'note 9:20 “Twelve years unclean”'
    claim: 'She had spent all on physicians and grew worse; she tried to escape notice'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'She had spent in medical treatment all she had owned, and “had suffered many things of many physicians,” but had steadily grown worse. … she tried to escape notice by hastily dropping back into the crowd.'
  - where: 'note 9:20 “The tassel on His cloak”'
    claim: 'Thayer: kraspedon in the NT for Hebrew tsitsit, a tassel of twisted wool, worn to remind of the law (Num 15:37f.)'
    key: thayer
    url: 'https://biblehub.com/greek/2899.htm'
    quote: 'in the N. T. for Hebrew צִיצִית, i. e. a little appendage hanging down from the edge of the mantle or cloak, made of twisted wool; a tassel, tuft: Matthew 9:20; Matthew 14:36; Matthew 23:5; Mark 6:56; Luke 8:44. The Jews had such appendages attached to their mantles to remind them of the law'
  - where: 'note 9:20 “The tassel on His cloak”'
    claim: 'Numbers 15:38–39: fringes with a ribband of blue, to remember the commandments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'And it shall be unto you for a fringe, that ye may look upon it, and remember all the commandments of the Lord, and do them'
  - where: 'note 9:20 “The tassel on His cloak”'
    claim: 'The border was likely the tzitzit; Malachi 4:2 “healing in his wings,” kanaph also border of a garment'
    key: south-clothing-textiles
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/clothing-textiles-new-testament'
    quote: 'This border was likely the wool tassel fringe (tzitzit) required by Numbers 15:38 to remind Jews of the law. Such an identification allows for the beautiful fulfillment of the prophecy in Malachi 4:2 that the Lord will bring “healing in his wings” (‘wings’ is from the Hebrew word kanaph, which also means border of a garment).'
  - where: 'note 9:20 “The tassel on His cloak”'
    claim: 'The scribes and Pharisees wore the fringe of an ostentatious width (Matt 23:5)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'that on which the scribes and Pharisees laid stress as being in accordance with the Law (Numbers 15:38), and which they wore, therefore, of an ostentatious width (Matthew 23:5).'
  - where: 'note 9:24 “Not dead, but sleepeth”'
    claim: 'Professional mourners and flute players; mourning customs required noise; funeral soon after death'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'His words drew scorn and ridicule from those who were paid for the noise they made … Moreover, they knew the maid was dead; preparations for the funeral, which custom required should follow death as speedily as possible, were already in progress.'
  - where: 'note 9:24 “Not dead, but sleepeth”'
    claim: 'She was dead; to speak of death as sleep was common; Jesus said the same of Lazarus'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'That the daughter of Jairus was dead is placed beyond reasonable doubt by the scriptural record. Our Lord’s statement to the noisy mourners that “the damsel is not dead but sleepeth” told that her sleep was to be of short duration. It was a rabbinical and common custom of the time to speak of death as a sleep'
  - where: 'note 9:24 “Not dead, but sleepeth”'
    claim: 'Raising to mortal life differs from resurrection; Christ the first fruits'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'the miracle consisted in reuniting the spirit and the body in a continuation of the interrupted course of mortal existence. That the subject of each of these miracles had to subsequently die is certain. Jesus Christ was the first of all men who have lived on earth to come forth from the tomb an immortalized Being'
  - where: 'note 9:27 “Thou Son of David”'
    claim: 'Matthew emphasizes a royal Christology; hope for a Davidic messiah'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew, more than any other Gospel writer, emphasized a royal Christology—a belief that a Davidic king would rise up, be anointed to take the throne, and restore Israel’s kingdom again.'
  - where: 'note 9:27 “Thou Son of David”'
    claim: 'Hopes for a restored Davidic kingdom led to expectation of the Messiah'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'in the intertestamental period prophecies and hopes for a restored Davidic kingdom led to the expectation of a future anointed king who would be a particular messiah or even “the Messiah.”'
  - where: 'note 9:27 “Thou Son of David”'
    claim: 'Matthew uses “son of David” nine times; Mark and Luke three each; John none'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'he uses the title “son of David” for Jesus nine times (see Matthew 1:1; 9:27; 12:23; 15:22; 20:30–31; 21:9, 15; 22:42). In contrast, the title “son of David” only appears three times each in Mark and Luke and is absent in John'
  - where: 'note 9:27 “Thou Son of David”'
    claim: 'Jesus never disclaimed the title; first detailed giving of sight'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'This title of address was voiced by others at sundry times, and in no case do we find record of our Lord disclaiming it or objecting to its use.'
  - where: 'note 9:30 “Why tell no one?”'
    claim: 'Ellicott’s two possible reasons: for the men’s own spiritual good, or shrinking from notoriety (Matt 12:16–21)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'The reasons may be sought, as elsewhere, either (1) in its being good for the spiritual life of the men themselves that they should show forth their praise of God, not with their lips, but in their lives; or (2) in the shrinking from mere notoriety'
  - where: 'note 9:30 “Why tell no one?”'
    claim: 'Ellicott: crowds ready to make the Wonder-Worker a king; Matthew notes this later (12:16–21)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'from the gaze of crowds drawn together to gaze on signs and wonders, and ready to make the Wonder-Worker a king because He wrought them, which St. Matthew, at a later stage, notes as characteristic of our Lord’s ministry (Matthew 12:16-21).'
  - where: 'note 9:30 “Why tell no one?”'
    claim: 'Talmage on the leper: Jesus generally discountenanced undesirable notoriety'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'There was perhaps good reason for this injunction of silence, aside from the very general course of our Lord in discountenancing undesirable notoriety'
  - where: 'note 9:35 “The unit closes, and the answer to John”'
    claim: '9:35 repeats 4:23 as bookends; critical text lacks “among the people”'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'The passage in chapter 9 is almost identical except that it has “Jesus went about all the cities and villages” instead of “all Galilee,” … Matthew uses these parallel verses to prompt the reader to recognize that all of the material between them belongs to the same literary unit.'
  - where: 'note 9:35 “The unit closes, and the answer to John”'
    claim: 'Chapters 8–9 hold an example of every miracle named in 11:5; the dumb man of 9:32–33 is kōphos, the word for deaf in 11:5'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'The only difficulty is finding an example of the deaf hearing, but this is a difficulty only in the English text, not the Greek. The Greek word for “deaf” in Matthew 11:5 is the plural of kōphos, the same word used to describe the demoniac who is dumb (kōphos; see Matthew 9:32–33).'
  - where: 'note 9:35 “The unit closes, and the answer to John”'
    claim: 'Matthew arranged chapters 5–9 as evidence that Jesus was the coming one'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew therefore arranged the material in chapters 5–9 to provide evidence for his readers that Jesus was indeed the coming one.'
  - where: 'note 9:36 “Sheep having no shepherd”'
    claim: 'Moses asked for a leader so the congregation be not as sheep without a shepherd; Joshua chosen'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Toward the end of Moses’s prophetic ministry, he requested that the Lord “set a man over the congregation [of Israel]. . . . which may lead them out, and which may bring them in; that the congregation of the Lord be not as sheep [ṣōʾn] which have no shepherd [rōʿeh]” (Numbers 27:16–17). Joshua was the shepherd-leader Jehovah chose to succeed Moses.'
  - where: 'note 9:36 “Sheep having no shepherd”'
    claim: 'Ezekiel 34: the scattered sheep with no shepherd; the Lord will seek them and set up one shepherd, “my servant David”'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'They [the people/“sheep”] were scattered, because there is no shepherd [rōʿeh]: and they became meat to all the beasts of the field, when they were scattered.'
  - where: 'note 9:36 “Sheep having no shepherd”'
    claim: 'Latter-day Saints read Ezekiel’s Davidic shepherd as Jesus, son of David, who will gather the flock'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Most Christians, and certainly Latter-day Saints, accept these as messianic prophecies about the future deliverer of Israel … They foretell that Jesus, as the “son [or descendant] of David,” will gather the flock of covenant Israel and reign with justice as King of kings.'
  - where: 'note 9:36 “Sheep having no shepherd”'
    claim: 'Matthew 9:36 is among the passages where Jesus uses sheep for people; hearers would recognize the Old Testament roots'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Jesus’s audiences would have surely recognized the Old Testament roots of His figurative use of sheep to represent people.'
  - where: 'note 9:36 “Sheep having no shepherd”'
    claim: 'The better reading: harassed, like sheep worried by the wolf'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'They were not merely as sheep that have grown weary and faint, hungry, looking up and yet not fed, but were as those that have been harassed by the wolf—the prey of thieves and robbers.'
  - where: 'note 9:38 “Pray the Lord of the harvest”'
    claim: 'Lord of the harvest is the Father, about to send forth the labourers through Him'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: '(38) The Lord of the harvest—i.e., the Father who had sent Him to be the Sower of the divine seed, and who, through Him, was about to send forth the labourers.'
  - where: 'note 9:38 “Pray the Lord of the harvest”'
    claim: 'He asks the disciples’ fellowship in prayer; the harvest figure first here in the first three Gospels, seen before in John 4:35–36'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'It is not enough for Him to feel compassion Himself. He craves the sympathy of His companions and disciples, and needs even their fellowship in prayer.'
  - where: 'note 9:38 “Pray the Lord of the harvest”'
    claim: 'Earlier, in Samaria, He had seen the fields white for the harvest of souls (John 4:35–36)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/9.htm'
    quote: 'Once before, among the alien Samaritans, He had seen the fields white as for the spiritual harvest of the souls of men, and had spoken of him that soweth and him that reapeth (John 4:35-36).'

