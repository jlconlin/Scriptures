chapter: 4
claims:
  - where: setting
    claim: 'The Father’s voice at the baptism'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/3?lang=eng'
    quote: 'And lo a voice from heaven, saying, This is my beloved Son, in whom I am well pleased.'
  - where: setting
    claim: 'Capernaum on the north shore of the Sea of Galilee; home of Peter and Andrew'
    key: bd-capernaum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/capernaum?lang=eng'
    quote: 'A town on the northern end of the Sea of Galilee, probably on the site now known as Tell-Hûm. … It was the home of Peter and Andrew (Mark 1:29)'
  - where: setting
    claim: '4:23 and 9:35 are bookends marking chapters 5–9 as one unit'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew uses these parallel verses to prompt the reader to recognize that all of the material between them belongs to the same literary unit.'
  - where: thread
    claim: 'The devil opens two temptations by attacking Jesus’s identity as Son of God'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'The devil opened his first two direct temptations by attacking that identity: “If thou be the Son of God . . .” (Matthew 4:3, 6).'
  - where: thread
    claim: 'The wilderness testing recalls Israel’s testing in Deuteronomy'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'The testing of Jesus in the wilderness after His baptism reminds readers of Israel’s testing in the wilderness in Deuteronomy'
  - where: section 2 plain
    claim: 'Capernaum lay on the lake shore (“sea coast”)'
    key: bd-capernaum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/capernaum?lang=eng'
    quote: 'A town on the northern end of the Sea of Galilee'
  - where: section 4 plain
    claim: '“Lunatic” rendered as those who had seizures (epileptic)'
    key: thayer
    url: 'https://biblehub.com/greek/4583.htm'
    quote: 'to be epileptic (epilepsy being supposed to return and increase with the increase of the moon): Matthew 4:24; Matthew 17:15.'
  - where: section 4 plain
    claim: 'Decapolis: the ten cities east and southeast of the Sea of Galilee'
    key: bd-decapolis
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/decapolis?lang=eng'
    quote: 'Ten cities. The district east and southeast of the Sea of Galilee, containing a mixed population of Greeks, Syrians, Arabs, and Jews'
  - where: 'note 4:1 “Led by the Spirit to be with God”'
    claim: 'JST 4:1: led up of the Spirit to be with God'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'Then Jesus was led up of the Spirit, into the wilderness, to be with God.'
  - where: 'note 4:1 “Led by the Spirit to be with God”'
    claim: 'JST 4:2 (footnote): after communing with God he was left to be tempted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'and had communed with God, he was afterwards an hungered, and was left to be tempted of the devil.'
  - where: 'note 4:1 “Led by the Spirit to be with God”'
    claim: 'JST 4:5, 8: the Spirit sets him on the pinnacle and takes him to the mountain; the appendix heading'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'Jesus is led by the Spirit, not by Satan. … the Spirit setteth him on the pinnacle of the temple. … And again, Jesus was in the Spirit, and it taketh him up into an exceeding high mountain'
  - where: 'note 4:1 “Led by the Spirit to be with God”'
    claim: 'Elder Hunter: the weeks apart were sustained by meditation, prayer and communion with the heavens'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'During the long weeks of seclusion, the Savior had been sustained by the exaltation of spirit that would naturally accompany such meditation, prayer, and communion with the heavens.'
  - where: 'note 4:1 “Led by the Spirit to be with God”'
    claim: 'Elder Hunter: the fast prepared Jesus for His ministry'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'The greatest task ever to be accomplished in this world lay before him, and he needed divine strength. Throughout these days in the wilderness he chose to fast, that his mortal body might be completely subjected to the divine influence of his Father’s Spirit.'
  - where: 'note 4:1 “Could He have given in?”'
    claim: 'Without the possibility of yielding there would be no real test; sinless yet peccable; agency'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'Had there been no possibility of His yielding to the lures of Satan, there would have been no real test in the temptations, no genuine victory in the result. Our Lord was sinless yet peccable'
  - where: 'note 4:1 “Could He have given in?”'
    claim: 'He offered Himself before the world was to safeguard agency'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'Had He been bereft of the faculty to sin, He would have been shorn of His free agency; and it was to safeguard and insure the agency of man that He had offered Himself, before the world was, as a redeeming sacrifice.'
  - where: 'note 4:1 “Could He have given in?”'
    claim: 'Elder Hunter: Heb. 4:15, D&C 20:22; sinless because He wanted to be'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'He was perfect and sinless, not because he had to be, but rather because he clearly and determinedly wanted to be. As the Doctrine and Covenants records, “He suffered temptations but gave no heed unto them.” (D&C 20:22.)'
  - where: 'note 4:1 “Could He have given in?”'
    claim: 'Temptations continued through the ministry and extended to Gethsemane'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'That Christ was subject to temptation during the period of His association with the apostles He expressly affirmed. That His temptations extended even to the agony in Gethsemane will appear as we proceed with this study.'
  - where: 'note 4:1 “Could He have given in?”'
    claim: 'Heb. 2:18: because He was tempted He can succour the tempted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/2?lang=eng'
    quote: 'For in that he himself hath suffered being tempted, he is able to succour them that are tempted.'
  - where: 'note 4:1 “Could He have given in?”'
    claim: 'Mosiah 3:7: He shall suffer temptations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'And lo, he shall suffer temptations, and pain of body, hunger, thirst, and fatigue, even more than man can suffer'
  - where: 'note 4:2 “Forty days, like Moses and like Israel”'
    claim: 'Moses fasted forty days on Sinai; Jesus also fasted forty days'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Moses fasted for forty days while on Mount Sinai (Exodus 34:28); Jesus also fasted for forty days in the wilderness (see Matthew 4:1–2).'
  - where: 'note 4:2 “Forty days, like Moses and like Israel”'
    claim: 'Matthew presents Jesus as the prophet like Moses of Deut. 18:15'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Matthew signals that he saw Jesus as this promised prophet in his infancy narrative by pointing out similarities in the birth stories of these two deliverers. Then, having established this motif, he presents Jesus as a New Moses throughout much of the rest of his Gospel'
  - where: 'note 4:2 “Forty days, like Moses and like Israel”'
    claim: 'The testing recalls Israel’s testing in Deuteronomy'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'The testing of Jesus in the wilderness after His baptism reminds readers of Israel’s testing in the wilderness in Deuteronomy'
  - where: 'note 4:2 “Forty days, like Moses and like Israel”'
    claim: 'The first answer is from Deut. 8:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'Deut. 8:3; D&C 84:44 (43–44).'
  - where: 'note 4:2 “Forty days, like Moses and like Israel”'
    claim: 'The second answer is from Deut. 6:16'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: '“It is written again, Thou shalt not tempt the Lord thy God.” (Matt. 4:7; see also Deut. 6:16.)'
  - where: 'note 4:2 “Forty days, like Moses and like Israel”'
    claim: 'The third answer is from Deut. 6:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/6?lang=eng'
    quote: 'Thou shalt fear the Lord thy God, and serve him, and shalt swear by his name.'
  - where: 'note 4:3 “The “if” after the Father’s voice”'
    claim: 'Satan attacked Jesus’s identity in the first two temptations'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Ironically, Satan along with his followers also declared Jesus’s true identity. The devil opened his first two direct temptations by attacking that identity'
  - where: 'note 4:3 “The “if” after the Father’s voice”'
    claim: 'The devil tried to make the Son doubt; was it proper that the Son of God should go hungry; to yield would be doubt'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'The Eternal Father had proclaimed Jesus as His Son; the devil tried to make the Son doubt that divine relationship. … Was it proper that the Son of God should go hungry? … To have yielded would have been to manifest positive doubt of the Father’s acknowledgment.'
  - where: 'note 4:3 “The “if” after the Father’s voice”'
    claim: 'His power was not for personal gratification; the word from God’s mouth was that He was the Son'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'the superior power that Jesus possessed had not been given to Him for personal gratification, but for service to others.'
  - where: 'note 4:3 “The “if” after the Father’s voice”'
    claim: 'The word that had proceeded from the mouth of God was that Jesus was the Beloved Son (Talmage’s own reading)'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'The word that had proceeded from the mouth of God, upon which Satan would have cast mistrust, was that Jesus was the Beloved Son with whom the Father was well pleased.'
  - where: 'note 4:3 “The “if” after the Father’s voice”'
    claim: 'Elder Hunter: the “if” foreshadowed the taunt at the cross'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'These, of course, were foreshadows of that final, desperate temptation which would come three years later: “If thou be the Son of God, come down from the cross.” (Matt. 27:40.) But Jesus patiently withstood that ploy also'
  - where: 'note 4:5 “The pinnacle of the temple”'
    claim: 'The southeast corner is the traditional candidate; a drop of more than 400 feet to the Kidron Valley'
    key: ogden-jesus-temple
    url: 'https://www.churchofjesuschrist.org/study/ensign/1991/04/jesus-and-the-temple?lang=eng'
    quote: 'The southeastern corner is the traditional candidate for the Pinnacle of the Temple. It is the highest point along the whole length of the walls of the Temple Mount—211 feet, or 64 meters. From the top of this point to the bottom of the Kidron Valley was a drop of more than 400 feet'
  - where: 'note 4:5 “The pinnacle of the temple”'
    claim: 'A few recent researchers prefer the southwest corner'
    key: ogden-jesus-temple
    url: 'https://www.churchofjesuschrist.org/study/ensign/1991/04/jesus-and-the-temple?lang=eng'
    quote: 'a few recent researchers believe this is the Pinnacle of the Temple where Jesus was tempted. In the ruins of that corner, researchers discovered a carved platform stone with a Hebrew inscription, indicating that this is where a herald would stand to blow the shofar, signaling the advent of holy days.'
  - where: 'note 4:3 “The “if” after the Father’s voice”'
    claim: 'Elder Hunter: the temptation was to eat in a spectacular way, using divine powers for selfish purposes'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'Satan’s temptation was to have him eat in a spectacular way—using his divine powers for selfish purposes.'
  - where: 'note 4:5 “The pinnacle of the temple”'
    claim: 'Elder Hunter: Satan tempted Jesus to throw Himself on the Father’s protection'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'Satan went to the other extreme and tempted Jesus to wantonly throw himself upon the Father’s protection.'
  - where: 'note 4:5 “The pinnacle of the temple”'
    claim: 'Elder Hunter: the temptation to a dazzling feat that might bring crowds and spread His fame; faith precedes the miracle'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'the temptation to perform some dazzling feat, some astounding exploit which might bring crowds of amazed and attentive onlookers. … the fame of which would spread like wildfire throughout all Judaea … But faith is to precede the miracle; miracles are not to precede the faith.'
  - where: 'note 4:5 “The pinnacle of the temple”'
    claim: 'Satan urged Jesus to throw Himself on the Father’s protection; God alone decides when His wonders are wrought'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'Satan tempted Jesus to tempt the Father. … God alone must decide when and how His wonders shall be wrought.'
  - where: 'note 4:8 “Why Luke gives another order”'
    claim: 'Matthew ends on the mountain, Luke at the temple, reflecting Luke’s emphasis on Jerusalem'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'whereas Matthew concludes the Savior’s triumph over the temptations on a high mountain in the wilderness (see Matthew 4:8–10), Luke’s account culminates with the Savior at Herod’s Temple in Jerusalem (see Luke 4:9–12).'
  - where: 'note 4:8 “Why Luke gives another order”'
    claim: 'Luke makes Jerusalem and the temple focal points, from Zacharias to the end'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'The Gospel of Luke places a heavy emphasis on Jerusalem and the temple as focal points of the Savior’s life and ministry.'
  - where: 'note 4:8 “Why Luke gives another order”'
    claim: 'Luke’s Gospel ends in Jerusalem'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'Luke concludes his Gospel in the city of Jerusalem (see Luke 24:49–53).'
  - where: 'note 4:9 “Kingdoms that were not his to give”'
    claim: 'The kingdoms were not Satan’s to give'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'Though they were not his to give, Satan offered them all to Jesus'
  - where: 'note 4:9 “Kingdoms that were not his to give”'
    claim: 'The false proposition that led away a third of the hosts'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'one which resulted in his leading one-third of the hosts from heaven … It is the proposition that everyone has a price, that material things finally matter most'
  - where: 'note 4:9 “Kingdoms that were not his to give”'
    claim: 'Inheriting all the Father hath; accepting blessings on Satan’s terms'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'he would inherit “all that [the] Father hath” (D&C 84:38)—and so would any other son or daughter of God. The surest way to lose the blessings of time or eternity is to accept them on Satan’s terms.'
  - where: 'note 4:10 “Moses heard the same demand”'
    claim: 'Both Moses and Jesus went apart to be with God and then were confronted by Satan; Jesus overcame all three; Moses failed three times until he called on the Only Begotten'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'immediately following their experiences with God, both were directly and personally confronted by Satan (see Moses 1:12–22 and Matthew 4:2–11). Jesus overcame all three temptations he faced, showing his power over the devil. Moses, the great prophet, tried three times to cast out Satan but failed'
  - where: 'note 4:10 “Moses heard the same demand”'
    claim: 'Moses 1:16 uses “Get thee hence, Satan”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'Get thee hence, Satan; deceive me not; for God said unto me: Thou art after the similitude of mine Only Begotten.'
  - where: 'note 4:15 “Isaiah’s great light in Galilee”'
    claim: 'Isaiah 9 in its setting: Assyria had overcome northern Israel including Galilee; God would honor it and bring light'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'Isaiah 9 goes on to describe how the Assyrians had already overcome northern Israel (which included the Galilee area) plunging them into darkness; nevertheless, God would bring peace and light to the whole nation if they rely on Him'
  - where: 'note 4:15 “Isaiah’s great light in Galilee”'
    claim: 'Immediate context: hope the Assyrian conquest would stop, likely peace under Hezekiah; also a Messianic child; Matthew applies it to Jesus and Galilee'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'In its immediate context, this passage holds out hope to the people of Judah that the conquest of Assyria will stop and that peace and light will return to the land—a likely reference to the peace they will obtain under King Hezekiah.'
  - where: 'note 4:15 “Isaiah’s great light in Galilee”'
    claim: 'Bethlehem prophecy known; Jesus grew up in Nazareth; likely one reason Nathanael doubted'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'That Jesus appears to have come forth out of Nazareth, and not Bethlehem, was likely one reason Nathaniel doubted He was the Messiah'
  - where: 'note 4:15 “Isaiah’s great light in Galilee”'
    claim: 'Isaiah 9 tied the Messiah to Galilee'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'New Testament writers also turned to Isaiah 9 to show that there was at least one text suggesting that the Messiah would indeed be associated with the Galilee region as well.'
  - where: 'note 4:15 “Isaiah’s great light in Galilee”'
    claim: 'Capernaum prosperous and crowded; Jesus’s home; miracles; later upbraided'
    key: bd-capernaum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/capernaum?lang=eng'
    quote: 'At the time of our Lord the district was one of the most prosperous and crowded in all Palestine. Here the Lord lived after the beginning of His ministry … Later the Lord upbraided the people of the place for their rejection of Him'
  - where: 'note 4:19 “Fishers of men”'
    claim: 'zōgreō in Luke 5:10: by teaching to win souls for the kingdom of God'
    key: thayer
    url: 'https://biblehub.com/greek/2221.htm'
    quote: 'ἀνθρώπους ἔσῃ ζωγρῶν, thou shalt catch men, i. e. by teaching thou shalt win their souls for the kingdom of God, Luke 5:10.'
  - where: 'note 4:19 “Fishers of men”'
    claim: 'zōgreō is made from “alive”; its first sense is to take alive'
    key: thayer
    url: 'https://biblehub.com/greek/2221.htm'
    quote: '(ζοως alive, and ἀγρέω (poetic form of ἀγρεύω, which see));'
  - where: 'note 4:19 “Fishers of men”'
    claim: 'zōgreō: first sense, to take alive'
    key: thayer
    url: 'https://biblehub.com/greek/2221.htm'
    quote: '1. to take alive (Homer, Herodotus, Thucydides, Xenophon, others; the Sept.).'
  - where: 'note 4:19 “Fishers of men”'
    claim: 'JST 4:18 adds “I am he of whom it is written by the prophets”'
    key: jst-matt-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/4?lang=eng'
    quote: 'And he said unto them, I am he of whom it is written by the prophets; follow me, and I will make you fishers of men.'
  - where: 'note 4:19 “Fishers of men”'
    claim: 'The JST makes the call an explicit witness that the Christ of the prophets was among them'
    key: millet-js-matthew
    url: 'https://byustudies.byu.edu/article/joseph-smith-and-the-gospel-of-matthew'
    quote: 'Here is an explicit witness of the fact that the Christ of whom the prophets had written was now among the people.'
  - where: 'note 4:20 “They had met Him before”'
    claim: 'Andrew, a disciple of the Baptist, met Jesus and brought Peter'
    key: bd-andrew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/andrew?lang=eng'
    quote: 'As a disciple of John the Baptist he met Jesus and then brought Peter to meet Jesus.'
  - where: 'note 4:20 “They had met Him before”'
    claim: 'John is probably the unnamed disciple of John 1:40; later called (Matt. 4:21–22 with Luke 5:1–11); a fisherman in fairly comfortable circumstances'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'In his early life he was a fisherman in fairly comfortable circumstances (Mark 1:20). We may assume he is the unnamed disciple of the Baptist mentioned in John 1:40. Later on he received a call to be a disciple of Jesus Christ (Matt. 4:21–22; Luke 5:1–11).'
  - where: 'note 4:20 “They had met Him before”'
    claim: 'The Galilee fisheries were a great source of wealth'
    key: bd-galilee
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'By the Sea of Galilee the fisheries were a great source of wealth and provided a large export trade.'
  - where: 'note 4:23 “A frame around the Sermon and the miracles”'
    claim: '4:23 and 9:35 are bookends; the chapter break interrupts; word and deed'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'This is one example of where chapter breaks in our modern New Testament interrupt the author’s flow of ideas. … Thus, Matthew wants his readers to see that Jesus is the Messiah in both word (the Sermon on the Mount) and deed (His miracles).'
  - where: 'note 4:23 “A frame around the Sermon and the miracles”'
    claim: '“Their synagogue” in Matthew’s editorial passages suggests tension with the synagogue'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'In Matthew’s editorial passages the synagogue is always referred to as “their” synagogue (Matthew 4:23; 9:35; 12:9; 13:54) or “your” synagogue (Matthew 23:34).[10] Thus the synagogue stood in some tension with the church.'
  - where: 'note 4:24 ““Lunatic”: moon-struck”'
    claim: 'selēniazomai: moon-struck; epileptic, supposed to increase with the moon; Matt. 4:24 and 17:15'
    key: thayer
