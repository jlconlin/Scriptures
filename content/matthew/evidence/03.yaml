chapter: 3
claims:
  - where: setting
    claim: 'John was the son of Zacharias and Elisabeth, both of the priestly line of Aaron'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'John was the son of Zacharias and Elizabeth, who were both of the priestly lineage of Aaron, and through whom John inherited the right to officiate in the Aaronic priesthood.'
  - where: 'note 3:1 “Who John the Baptist was”'
    claim: 'The restoration of the Aaronic Priesthood was on May 15, 1829'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'On May 15, they went to a wooded area near the Prophet’s home to ask the Lord for more understanding about this important ordinance.'
  - where: 'note 3:1 “Who John the Baptist was”'
    claim: 'The words of the angel conferring the priesthood of Aaron, with the keys of baptism by immersion'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'I confer the Priesthood of Aaron, which holds the keys of the ministering of angels, and of the gospel of repentance, and of baptism by immersion for the remission of sins'
  - where: 'note 3:3 “The voice in the wilderness”'
    claim: 'Joseph Smith taught that John was the forerunner of Christ and came to prepare the way before Him'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: '“John [the Baptist] held the Aaronic Priesthood, and was a legal administrator, and the forerunner of Christ, and came to prepare the way before him.”'
  - where: 'note 3:4 “Dressed like Elijah”'
    claim: 'Wild honey was found in trees and rocks; John’s food needed no skill to gather'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'The “wild honey” was that found in the hollows of trees … or in the “rocks” … Stress is laid on the simplicity of the Baptist’s fare, requiring no skill or appliances, the food of the poorest wanderer in the wilderness.'
  - where: 'note 3:6 “What John’s baptism was”'
    claim: 'John’s baptism was for repentance and forgiveness, to prepare Israel for its Lord'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'John’s baptism was focused on repentance and the forgiveness of sins to prepare Israel for the coming of their Lord.'
  - where: 'note 3:7 “Pharisees and Sadducees at the river”'
    claim: '“Generation of vipers” is better “brood” or “offspring” of vipers; Jesus uses the same term at the close of His ministry'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'O generation of vipers.—Better, brood, or offspring, of vipers. Our Lord takes up the same term, and applies it to them at the close of his ministry (Matthew 23:33).'
  - where: 'note 3:7 “Pharisees and Sadducees at the river”'
    claim: 'The Sadducees denied the authority of tradition and opposed the Pharisees over the belief in angels and spirits'
    key: bd-sadducees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sadducees?lang=eng'
    quote: 'held to the letter of the Mosaic revelation and denied the authority of ancient tradition; they taught complete freedom of the will in moral action; they were opposed to the Pharisees as to the belief in angels and spirits'
  - where: setting
    claim: 'The Joseph Smith Translation appendix revises Matthew 3:8–9 (one of three passages of chapter 3 it gives: 3:8–9, 3:11–12, 3:15–17)'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'JST, Matthew 3:34–36. Compare Matthew 3:8–9'
  - where: setting
    claim: 'The Joseph Smith Translation appendix revises Matthew 3:11–12 (one of three passages of chapter 3 it gives: 3:8–9, 3:11–12, 3:15–17)'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'JST, Matthew 3:38–40. Compare Matthew 3:11–12'
  - where: setting
    claim: 'The Joseph Smith Translation appendix revises Matthew 3:15–17 (one of three passages of chapter 3 it gives: 3:8–9, 3:11–12, 3:15–17)'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'JST, Matthew 3:43–46. Compare Matthew 3:15–17'
  - where: thread
    claim: 'At the baptism the presence of all three members of the Godhead was made manifest'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'Jesus’s identity as God’s Only Begotten Son was confirmed in a dramatic manner as the veil between heaven and earth was rent and the presence of all three members of the Godhead became manifest.'
  - where: 'note 3:1 “Who John the Baptist was”'
    claim: 'John’s title means the one who immerses; he was of Aaron’s line through both parents and so had the right to the Aaronic Priesthood'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'John, who was given the appropriate title “‘Baptist’ (Baptistēs) or ‘the Baptizer’ (o Baptizōn, ‘the one immersing’).” John was the son of Zacharias and Elizabeth, who were both of the priestly lineage of Aaron, and through whom John inherited the right to officiate in the Aaronic priesthood.'
  - where: 'note 3:1 “Who John the Baptist was”'
    claim: 'Doctrine and Covenants 84 says John was ordained at eight days old to make straight the way of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'was ordained by the angel of God at the time he was eight days old unto this power, to overthrow the kingdom of the Jews, and to make straight the way of the Lord before the face of his people'
  - where: 'note 3:1 “Who John the Baptist was”'
    claim: 'Joseph Smith taught that John held the Aaronic Priesthood and was a legal administrator and forerunner'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: '“John [the Baptist] held the Aaronic Priesthood, and was a legal administrator, and the forerunner of Christ, and came to prepare the way before him.”'
  - where: 'note 3:1 “Who John the Baptist was”'
    claim: 'John restored the Aaronic Priesthood to Joseph Smith and Oliver Cowdery on May 15, 1829, naming himself'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'said that his name was John, the same that is called John the Baptist in the New Testament, and that he acted under the direction of Peter, James and John'
  - where: 'note 3:1 “Who John the Baptist was”'
    claim: 'Elias is a title for a forerunner, used of John; John prepared the way, and Jesus was the Restorer who brought back the gospel and the Melchizedek Priesthood'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'Elias is also a title for one who is a forerunner; for example, John the Baptist … John was sent to prepare the way for Jesus, Jesus Himself being the Restorer who brought back the gospel and the Melchizedek Priesthood to the Jews in His day'
  - where: 'note 3:2 “The kingdom of heaven at hand”'
    claim: 'The Bible Dictionary names Matthew 3:2 as a verse where “kingdom of heaven” means the Church on earth, the path to heaven'
    key: bd-kingdom-of-heaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kingdom-of-heaven?lang=eng'
    quote: 'kingdom of heaven is sometimes used in scripture to mean the Church (as in Matt. 3:2; 4:17; 13; and 25:1–13), meaning that the true church on the earth is the path to heaven and is the kingdom of heaven on earth.'
  - where: 'note 3:2 “The kingdom of heaven at hand”'
    claim: 'The Guide to the Scriptures: the Church prepares its members for the celestial kingdom, and is sometimes called the kingdom of heaven'
    key: gs-kingdom-of-god
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/kingdom-of-god-or-kingdom-of-heaven?lang=eng'
    quote: 'The purpose of the Church is to prepare its members to live forever in the celestial kingdom or kingdom of heaven. However, the scriptures sometimes call the Church the kingdom of heaven, meaning that the Church is the kingdom of heaven on earth.'
  - where: 'note 3:2 “The kingdom of heaven at hand”'
    claim: 'Joseph Smith: the kingdom could be no nearer than in John’s hands; John had it with him'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'But, says one, the kingdom of God could not be set up in the days of John, for John said the kingdom was at hand. But I would ask if it could be any nearer to them than to be in the hands of John.'
  - where: 'note 3:2 “The kingdom of heaven at hand”'
    claim: 'Joseph Smith: where there is a legally authorized administrator, there is the kingdom of God'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'Whenever men can find out the will of God and find an administrator legally authorized from God, there is the kingdom of God; but where these are not, the kingdom of God is not.'
  - where: 'note 3:3 “The voice in the wilderness”'
    claim: 'In Isaiah 40:3 the voice announced Jehovah’s imminent return and the revealing of His glory'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Isaiah 40:3 announces to Israel that Jehovah’s triumphant return is imminent and that the “glory of the Lord” is to be shortly revealed (Isaiah 40:5).'
  - where: 'note 3:3 “The voice in the wilderness”'
    claim: 'Mark, citing Isaiah 40:3 with other Old Testament passages, casts Jesus in the role of Jehovah, the Lord whose path is made straight and whose arrival is imminent'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Second, he casts Jesus in the role of Jehovah; it is Jesus’s way and Jesus’s path that needs to be prepared and made straight by the Jews. He is the Lord whose arrival is imminent.'
  - where: 'note 3:4 “Dressed like Elijah”'
    claim: 'John probably adopted the dress deliberately to recall Elijah (2 Kings 1:8); the rough garment still marked a prophet in Zechariah’s day (Zech. 13:4), in contrast with the “gorgeous apparel” of the court (Luke 7:25)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'The dress was probably deliberately adopted by the Baptist as reviving the outward appearance of Elijah, who was “a hairy man, and girt with a girdle of leather” (2Kings 1:8); and the “rough garment,” that had been characteristic of the prophet’s life even at a later period (Zechariah 13:4)'
  - where: 'note 3:4 “Dressed like Elijah”'
    claim: 'Jesus contrasts John with those in soft clothing in kings’ houses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'But what went ye out for to see? A man clothed in soft raiment? behold, they that wear soft clothing are in kings’ houses.'
  - where: 'note 3:4 “Dressed like Elijah”'
    claim: 'Locusts were clean food under the law and eaten by the poor; the stress is on the simplicity of John’s fare'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'Locusts were among the articles of food permitted by the Law (Leviticus 11:21), and were and are still used by the poor in Palestine and Syria. … Stress is laid on the simplicity of the Baptist’s fare'
  - where: 'note 3:6 “What John’s baptism was”'
    claim: 'Latter-day Saints hold that baptism was not a new rite introduced by John, but part of God’s plan from the beginning'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'Latter-day Saints believe that baptism “was not a new rite introduced by John the Baptist and adopted by Christ and his followers.” Rather, we hold the unique perspective that baptism has been a vital part of God’s salvific plan for his children from the very beginning.'
  - where: 'note 3:6 “What John’s baptism was”'
    claim: 'Adam was baptized by immersion and the Spirit descended on him (Moses 6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'and was carried down into the water, and was laid under the water, and was brought forth out of the water.'
  - where: 'note 3:6 “What John’s baptism was”'
    claim: 'Jewish washings, many by immersion, are often proposed as antecedents of John’s baptism'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'Many scholars have sought to link John’s baptism to earlier and contemporary Jewish purification and cleansing washings, proselyte baptism, and the baths of the Essenes and others.'
  - where: 'note 3:6 “What John’s baptism was”'
    claim: 'John’s baptism differed: once only, for repentance and forgiveness, administered by John rather than self-immersion'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'John’s baptism was a onetime event. Most of the Jewish washings were a ceremonial purification rite that would be performed when needed throughout one’s lifetime. … John held priesthood keys and personally administered his baptism, whereas Jewish proselyte baptism and other purification baths or washings were a self-immersion'
  - where: 'note 3:7 “Pharisees and Sadducees at the river”'
    claim: 'The Pharisees: a party of strict observance of the law, who held oral tradition equal to the written law'
    key: bd-pharisees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharisees?lang=eng'
    quote: 'A religious party among the Jews. The name denotes separatists. They prided themselves on their strict observance of the law … They upheld the authority of oral tradition as of equal value with the written law.'
  - where: 'note 3:7 “Pharisees and Sadducees at the river”'
    claim: 'The Sadducees: a small, powerful party of high-priestly families who held to the letter of the Mosaic revelation'
    key: bd-sadducees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sadducees?lang=eng'
    quote: 'The party consisted of old high-priestly families who came to the front during the Maccabean war. They formed the Jewish aristocracy and were powerful, though quite small in numbers. In their treatment of religious questions they held to the letter of the Mosaic revelation'
  - where: 'note 3:7 “Pharisees and Sadducees at the river”'
    claim: 'Luke says the Pharisees and lawyers were not baptized of John'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'But the Pharisees and lawyers rejected the counsel of God against themselves, being not baptized of him.'
  - where: 'note 3:7 “Pharisees and Sadducees at the river”'
    claim: 'In the Joseph Smith Translation of Matthew 9 the Pharisees ask to be received with their own baptism and Jesus refuses'
    key: jst-matt-9
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/9?lang=eng'
    quote: 'Then said the Pharisees unto him, Why will ye not receive us with our baptism, seeing we keep the whole law?'
  - where: 'note 3:7 “Pharisees and Sadducees at the river”'
    claim: 'The Joseph Smith Translation adds a rebuke for not receiving the preaching of the one God sent'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'Why is it that ye receive not the preaching of him whom God hath sent? If ye receive not this in your hearts, ye receive not me'
  - where: 'note 3:9 “Children of Abraham”'
    claim: 'The Joseph Smith Translation makes the boast “we only have power to bring seed unto our father Abraham”'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'And think not to say within yourselves, We are the children of Abraham, and we only have power to bring seed unto our father Abraham'
  - where: 'note 3:9 “Children of Abraham”'
    claim: 'The JST appendix summary: God can make covenant people of those not of Israel'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'Those who rejected the message of John the Baptist rejected Christ. God can make covenant people of those not of Israel.'
  - where: 'note 3:9 “Children of Abraham”'
    claim: 'The boast seems to have been common (John 8:33–39), tied to the belief that descent from Abraham, alone or with the confession of Israel’s creed, ensured admission into Paradise'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'The boast seems to have been common, as in John 8:33-39, and was connected with the belief that this alone, or taken together with the confession of the creed of Israel … would be enough to ensure for every Jew an admission into Paradise.'
  - where: 'note 3:9 “Children of Abraham”'
    claim: 'John probably pointed to the pebbles on the Jordan’s banks; in their application the words look to the calling of the Gentiles'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'The words were obviously dramatised by gesture, pointing to the pebbles on the banks of the Jordan. In their spiritual application, they are remarkable as containing the germs of all the teaching of our Lord, and of St. Paul, and of St. John, as to the calling of the Gentiles'
  - where: 'note 3:11 “With the Holy Ghost, and with fire”'
    claim: 'The JST of 3:11 reads “whose place I am not able to fill” and says John baptizes beforehand so that the coming one may baptize with the Holy Ghost and fire'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'whose shoes I am not worthy to bear, (or whose place I am not able to fill,) as I said, I indeed baptize you before he cometh, that when he cometh he may baptize you with the Holy Ghost and fire.'
  - where: 'note 3:11 “With the Holy Ghost, and with fire”'
    claim: 'Joseph Smith: baptism of water without that of fire and the Holy Ghost is of no use; the two are inseparable'
    key: tpjs-2007-ch-7
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-7?lang=eng'
    quote: '“The baptism of water, without the baptism of fire and the Holy Ghost attending it, is of no use; they are necessarily and inseparably connected.”'
  - where: 'note 3:11 “With the Holy Ghost, and with fire”'
    claim: 'Joseph Smith: baptism by water is but half a baptism'
    key: tpjs-2007-ch-7
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-7?lang=eng'
    quote: 'Baptism by water is but half a baptism, and is good for nothing without the other half—that is, the baptism of the Holy Ghost.'
  - where: 'note 3:11 “With the Holy Ghost, and with fire”'
    claim: 'Nephi: remission of sins comes by fire and by the Holy Ghost after baptism by water'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'For the gate by which ye should enter is repentance and baptism by water; and then cometh a remission of your sins by fire and by the Holy Ghost.'
  - where: 'note 3:11 “With the Holy Ghost, and with fire”'
    claim: 'Aaronic Priesthood lacks power to lay on hands for the Holy Ghost'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: '“He said this Aaronic Priesthood had not the power of laying on hands for the gift of the Holy Ghost, but that this should be conferred on us hereafter. …'
  - where: 'note 3:12 “The axe, the fan and the floor”'
    claim: 'Trees stood for people and nations; pruning was partial judgment, the axe at the root final'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'Judgments that were only partial or corrective were as the pruning of the branches (John 15:2). Now the axe was laid to the root, and the alternative was preservation or destruction.'
  - where: 'note 3:12 “The axe, the fan and the floor”'
    claim: 'The threshing scene: the fan drives the chaff to the edges to be burned; new is that the coming One does the winnowing'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/3.htm'
    quote: 'the large winnowing fan driving on them the full force of the strong current of air, leaving the wheat in the middle, while the chaff is driven to the outskirts of the field to be afterwards swept up and burnt. … that the “coming One,” the expected Christ, is to be the agent in the process'
  - where: 'note 3:12 “The axe, the fan and the floor”'
    claim: 'The JST of 3:12 places the burning “in the fullness of his own time”'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'but in the fullness of his own time will burn up the chaff with unquenchable fire.'
  - where: 'note 3:14 “I have need to be baptized of thee”'
    claim: 'Talmage reads John’s protest as his recognition of a sinless man with no need of repentance'
    key: talmage-jesus-christ-10
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-10?lang=eng'
    quote: 'when Jesus presented Himself for baptism, John recognized in Him a sinless Man who stood in no need of repentance'
  - where: 'note 3:14 “I have need to be baptized of thee”'
    claim: 'The JST of John 1:30 reads “I knew him,” and that he should be made manifest to Israel'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'for he was before me, and I knew him, and that he should be made manifest to Israel; therefore am I come baptizing with water.'
  - where: 'note 3:14 “I have need to be baptized of thee”'
    claim: 'The JST of John 1:32 reads “I knew him” and gives the promised sign of the Spirit descending and remaining'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'And I knew him; for he who sent me to baptize with water, the same said unto me; Upon whom thou shalt see the Spirit descending, and remaining on him, the same is he who baptizeth with the Holy Ghost.'
  - where: 'note 3:15 “To fulfil all righteousness”'
    claim: 'Nephi explains that the holy Lamb was baptized to show obedience and humility before the Father and to set the example'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'he showeth unto the children of men that, according to the flesh he humbleth himself before the Father, and witnesseth unto the Father that he would be obedient unto him in keeping his commandments.'
  - where: 'note 3:15 “To fulfil all righteousness”'
    claim: 'Joseph Smith: Christ fulfilled all righteousness by obeying the law He had given Moses'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'Christ Himself fulfilled all righteousness in becoming obedient to the law which He had given to Moses on the mount, and thereby magnified it and made it honorable, instead of destroying it.'
  - where: 'note 3:15 “To fulfil all righteousness”'
    claim: 'Joseph Smith: the Savior submitted to John’s authority by being baptized of him'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'for no man could have better authority to administer than John; and our Savior submitted to that authority Himself, by being baptized by John'
  - where: 'note 3:15 “To fulfil all righteousness”'
    claim: 'Nephi: Christ’s baptism shows the narrow gate by which all should enter, He having set the example'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'And again, it showeth unto the children of men the straitness of the path, and the narrowness of the gate, by which they should enter, he having set the example before them.'
  - where: 'note 3:15 “To fulfil all righteousness”'
    claim: 'The JST reads “Suffer me to be baptized of thee” and adds that John went down into the water'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'And Jesus, answering, said unto him, Suffer me to be baptized of thee, for thus it becometh us to fulfill all righteousness. Then he suffered him. And John went down into the water and baptized him.'
  - where: 'note 3:16 “The sign of the dove”'
    claim: 'Joseph Smith: the Holy Ghost is a personage and cannot be transformed into a dove; the sign of the dove was given to John as a token'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'The Holy Ghost is a personage, and is in the form of a personage. It does not confine itself to the form of the dove, but in sign of the dove. The Holy Ghost cannot be transformed into a dove; but the sign of a dove was given to John to signify the truth of the deed'
  - where: 'note 3:16 “The sign of the dove”'
    claim: 'Joseph Smith: the sign of the dove was instituted before the creation and the devil cannot come in it'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'The sign of the dove was instituted before the creation of the world, a witness for the Holy Ghost, and the devil cannot come in the sign of a dove.'
  - where: 'note 3:16 “The sign of the dove”'
    claim: 'The JST says John saw the heavens opened and the Spirit lighting upon Jesus'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'and John saw, and lo, the heavens were opened unto him, and he saw the Spirit of God descending like a dove and lighting upon Jesus.'
  - where: 'note 3:17 “This is my beloved Son”'
    claim: 'KnoWhy #655: Matthew records God speaking to the audience; in a royal investiture words went both to the king and to the people'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'Matthew records God speaking to the audience who witnessed Jesus’s baptism. In any royal investiture, words were naturally addressed both to the one being elevated to the throne and also to the people who then would honor that ruler'
  - where: 'note 3:17 “This is my beloved Son”'
    claim: 'KnoWhy #655: the Synoptic accounts appear to quote or allude to Psalm 2:7, a coronation psalm'
    key: sc-knowhy-655
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-proclaimed-the-son-of-god-at-his-baptism'
    quote: 'All three of these Gospels, commonly referred to as the Synoptic Gospels, appear to be quoting or alluding to Psalm 2:7, which is often viewed as a prominent royal psalm associated with the coronation of ancient Israelite kings'
  - where: 'note 3:17 “This is my beloved Son”'
    claim: 'The JST adds “Hear ye him” and says John heard the voice'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'And lo, he heard a voice from heaven, saying, This is my beloved Son, in whom I am well pleased. Hear ye him.'
  - where: 'note 3:17 “This is my beloved Son”'
    claim: 'The Father’s words to the Nephites at Bountiful'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'Behold my Beloved Son, in whom I am well pleased, in whom I have glorified my name—hear ye him.'
  - where: christ
    claim: 'Nephi: the holy Lamb needed baptism; how much more the unholy; “Follow thou me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'And now, if the Lamb of God, he being holy, should have need to be baptized by water, to fulfil all righteousness, O then, how much more need have we, being unholy, to be baptized, yea, even by water!'
  - where: christ
    claim: 'Joseph Smith: baptism of water and of the Holy Ghost are inseparable'
    key: tpjs-2007-ch-7
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-7?lang=eng'
    quote: '“The baptism of water, without the baptism of fire and the Holy Ghost attending it, is of no use; they are necessarily and inseparably connected.”'
