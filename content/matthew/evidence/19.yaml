chapter: 19
claims:
  - where: setting
    claim: 'Matthew 19:1 closes the fourth of five discourses, the Sermon on the Church (chapter 18); the fifth is chapters 24–25'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'each of which ends with phrases such as, “When Jesus had ended these sayings” (see Matthew 7:28; 11:1; 13:53; 19:1; 26:1): the Sermon on the Mount (chapters 5–7); the Mission Sermon (chapter 10); the Sermon in Parables (chapter 13); the Sermon on the Church (chapter 18)'
  - where: setting
    claim: '“Beyond Jordan” is Perea; Jesus was traveling by short stages toward Jerusalem'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'While wending His way by short stages toward Jerusalem, and while still “beyond” or on “the farther side” of Jordan, and therefore in Perean territory, Jesus was met by a body of Pharisees'
  - where: setting
    claim: 'The synoptic Gospels record many of these events as incidents of a journey toward Jerusalem through Samaria, Perea and Judea'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'The writers of the synoptic Gospels have recorded numerous discourses, parables, and miracles, as incidents of a journey toward Jerusalem, in the course of which, Jesus, accompanied by the apostles, traversed parts of Samaria and Perea, and the outlying sections of Judea.'
  - where: setting
    claim: 'Perea was part of Herod Antipas’s domain'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'soon in ordinary course He would leave Perea, which was part of Herod’s domain, and enter Judea'
  - where: when
    claim: 'In Perea, beyond the Jordan, on the way toward Jerusalem'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'While wending His way by short stages toward Jerusalem, and while still “beyond” or on “the farther side” of Jordan, and therefore in Perean territory'
  - where: thread
    claim: 'The blessing of the children follows fittingly on the teaching about marriage and the home'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The circumstance appears in appropriate sequence to that of the Lord’s instructions concerning the sacredness of marriage and the sanctity of the home.'
  - where: thread
    claim: 'Since the eunuch saying is followed by Peter and the disciples having left everything, it may describe the disciples'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Since the saying is followed by references to Peter and the other disciples having left everything (including family, if only temporarily) in order to follow Jesus, it may figuratively describe the disciples during the time they traveled with Jesus.'
  - where: thread
    claim: 'Willingness to put the kingdom above possessions was what the young ruler lacked'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Willingness to place the kingdom of God above all material possessions was the one thing he lacked.'

  - where: 'note 19:3 “A question meant to trap”'
    claim: 'The question about divorce “for every cause” falls within the Shammai–Hillel debate; they may have hoped to alienate followers who held the easier view'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Their question, “Is it lawful for a man to put away his wife for every cause?” falls clearly within the school of Shammai/school of Hillel debate. Their motivation may be to reveal to the “great multitudes” that Jesus holds a position close to that of the house of Shammai'
  - where: 'note 19:3 “A question meant to trap”'
    claim: 'The school of Hillel allowed divorce for childlessness, argumentativeness, or poor housekeeping'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'The school of Hillel, on the other hand, argued that such things as childlessness, argumentativeness, or even failure to properly keep house were grounds for divorce.'
  - where: 'note 19:3 “A question meant to trap”'
    claim: 'The Pharisees came to find grounds for an accusation; they may have hoped Jesus would denounce Herod Antipas and bring Herodias’s fury on Himself'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The crafty questioners may have hoped that Jesus would denounce the adulterous state in which Herod Antipas was then living, and so bring upon Himself the fury of Herodias, to which the Baptist had already died a victim.'
  - where: 'note 19:3 “A question meant to trap”'
    claim: 'Perea was in Herod’s domain'
    key: talmage-jesus-christ-26
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-26?lang=eng'
    quote: 'soon in ordinary course He would leave Perea, which was part of Herod’s domain, and enter Judea'

  - where: 'note 19:6 “What God hath joined”'
    claim: 'Jesus answers from Genesis 1–2 rather than Deuteronomy 24:1'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Rather than engage Deuteronomy 24:1 directly, Jesus makes an argument based on Genesis 1–2, the origin of God’s instructions on marriage'
  - where: 'note 19:6 “What God hath joined”'
    claim: 'God made the marriage bond paramount even over that of children to parents; severing it was man’s invention'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'God had provided for honorable marriage, and had made the relation between husband and wife paramount even to that of children to parents; the severing of such a union was an invention of man, not a command of God.'
  - where: 'note 19:6 “What God hath joined”'
    claim: 'Restoration scripture teaches marriage as divinely ordained and potentially eternal'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'We have come to understand marriage and family as divinely ordained, central to the developmental purposes of mortal life, and potentially eternal (Doctrine and Covenants 49:16–17; 131:1–4; 132:19).'
  - where: 'note 19:6 “What God hath joined”'
    claim: 'The option for divorce in the law was a concession because of hardness of heart'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Jesus further contends that the option for divorce was a concession given to the people “because of the hardness of your hearts” (Matthew 19:8).'

  - where: 'note 19:6 “What God hath joined”'
    claim: 'In the temples couples are married for all eternity'
    key: oaks-divorce
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/04/divorce?lang=eng'
    quote: 'In the temples of the Lord, couples are married for all eternity.'

  - where: 'note 19:8 “Suffered, not commanded”'
    claim: 'Moses had not commanded divorce but required a bill of divorcement if a man separated from his wife'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Be it remembered that Moses had not commanded divorce, but had required that in case a man should separate from his wife he give her a bill of divorcement.'
  - where: 'note 19:8 “Suffered, not commanded”'
    claim: 'Not a commandment of God but a practice Moses reluctantly allowed; Jesus freed Himself from the rabbinic debate by appealing to the law itself'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'They had to confess that they were not dealing with a commandment of God but a practice that Moses reluctantly allowed because of the hardness of Israel’s heart.'
  - where: 'note 19:8 “Suffered, not commanded”'
    claim: 'The purpose of the bill of divorcement was to let the former wife remarry'
    key: draper-divorce
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/what-therefore-god-hath-joined-together-let-no-man-put-asunder'
    quote: 'The purpose of the writing of divorcement was to allow for the former wife to remarry.'
  - where: 'note 19:8 “Suffered, not commanded”'
    claim: 'The option for divorce in Deuteronomy 24:1–4 was a concession'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Jesus further contends that the option for divorce was a concession given to the people “because of the hardness of your hearts” (Matthew 19:8).'

  - where: 'note 19:9 “The higher law and the Church today”'
    claim: 'Jesus announced no binding rule about legal divorce; Mosaic putting away involved no court'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'It is important to note, however, that in His reply to the casuistical Pharisees, Jesus announced no specific or binding rule as to legal divorces; the putting away of a wife, as contemplated under the Mosaic custom, involved no judicial investigation or action by an established court.'
  - where: 'note 19:9 “The higher law and the Church today”'
    claim: 'Woman, made man’s companion and partner, had become his slave; Jesus is the champion of woman'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'woman, who by the law of God had been made a companion and partner with man, had become his slave. The world’s greatest champion of woman and womanhood is Jesus the Christ.'
  - where: 'note 19:9 “The higher law and the Church today”'
    claim: 'The Lord does not currently enforce the celestial standard, permits remarriage, and divorced members can hold temple recommends'
    key: oaks-divorce
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/04/divorce?lang=eng'
    quote: 'Because “of the hardness of [our] hearts,” the Lord does not currently enforce the consequences of the celestial standard. He permits divorced persons to marry again without the stain of immorality specified in the higher law. Unless a divorced member has committed serious transgressions, he or she can become eligible for a temple recommend'

  - where: 'note 19:12 “Eunuchs for the kingdom’s sake”'
    claim: 'A eunuch was an emasculated man, often a court official'
    key: bd-eunuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eunuch?lang=eng'
    quote: 'A class of emasculated men attached to the courts of eastern rulers. They were employed to watch over the harems and also were often given positions as trusted officials.'
  - where: 'note 19:12 “Eunuchs for the kingdom’s sake”'
    claim: 'The third kind is a figurative reference to voluntary celibacy, hyperbole like Matthew 5:29–30'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'is best understood not as a literal reference to emasculation, but as a figurative reference to voluntary celibacy that uses the same kind of hyperbole Jesus employed in such sayings as, “If your right eye causes you to sin, tear it out,”'
  - where: 'note 19:12 “Eunuchs for the kingdom’s sake”'
    claim: 'Most scholars take “this saying” as celibacy; some as remaining unmarried after divorce'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Though most New Testament scholars understand “this teaching” (Matthew 19:11) to refer to celibacy (i.e., not marrying, as stated in Matthew 19:10), some argue that it may refer to remaining unmarried after divorce (implied in Matthew 19:9)'
  - where: 'note 19:12 “Eunuchs for the kingdom’s sake”'
    claim: 'The saying may describe the disciples who had left family to travel with Jesus'
    key: ellison-family-celibacy
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'it may figuratively describe the disciples during the time they traveled with Jesus.'
  - where: 'note 19:12 “Eunuchs for the kingdom’s sake”'
    claim: 'The disciples’ conclusion was true only in exceptional cases; some adopted celibacy to give all their time to the Lord; marriage is honorable'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'some few adopted celibacy “for the kingdom of heaven’s sake,” that thereby they might be free to render all their time and energy to the Lord’s service. But the disciples’ conclusion that “it is not good to marry” was true only in the exceptional instances stated. Marriage is honorable'
  - where: 'note 19:12 “Eunuchs for the kingdom’s sake”'
    claim: 'Marriage is honorable; neither man without woman nor woman without man can be perfect'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Marriage is honorable; for neither man without woman nor woman without man can be perfect in the Lord’s sight.'

  - where: 'note 19:13 “Why the disciples turned them away”'
    claim: 'JST Matthew 19:13: the disciples said there was no need, for Jesus had said such shall be saved'
    key: jst-matt-19
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/19?lang=eng'
    quote: 'And the disciples rebuked them, saying, There is no need, for Jesus hath said, Such shall be saved.'
  - where: 'note 19:13 “Why the disciples turned them away”'
    claim: 'The disciples may have held the traditional view that women and children were of inferior status'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Even the disciples seem to have been yet under the influence of the traditional conception that women and children were of inferior status, and that for such to seek the Lord’s attention was an act of presumption.'
  - where: 'note 19:13 “Why the disciples turned them away”'
    claim: 'The Greek paidia refers to a growing child up to about seven'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'In most instances, the singular paidion or its plural paidia are used in these verses (see Matthew 18:2–5, 19:13–14; Mark 9:36–37; 10:13–15; Luke 9:47–48).'
  - where: 'note 19:13 “Why the disciples turned them away”'
    claim: 'paidion referred to a child up to seven'
    key: korth-reed-little-children
    url: 'https://rsc.byu.edu/household-god/become-little-children'
    quote: 'Whereas pais could be used of a son or daughter up to the age of twenty,[27] paidion referred to a growing child up to the age of seven.'
  - where: 'note 19:13 “Why the disciples turned them away”'
    claim: 'Restoration scripture: little children are whole and saved (Moroni 8:8; D&C 137:10, linked in the footnote at verse 14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/137?lang=eng'
    quote: 'And I also beheld that all children who die before they arrive at the years of accountability are saved in the celestial kingdom of heaven.'

  - where: 'note 19:15 “Hands laid on the children”'
    claim: 'The risen Christ blessed the Nephite children one by one; modern revelation directs that children be brought to the elders to be blessed; the blessing is not baptism'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Through modern revelation the Lord has directed that all children born in the Church be brought for blessing to those who are authorized to administer this ordinance of the Holy Priesthood.'
  - where: 'note 19:15 “Hands laid on the children”'
    claim: 'The blessing of children is not a substitute for baptism, and the incident is no argument for infant baptism'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The blessing of children is in no sense analogous to, far less is it a substitution for, the ordinance of baptism, which is to be administered only to those who have come to years of understanding, and who are capable of repentance.'
  - where: 'note 19:15 “Hands laid on the children”'
    claim: 'Christ blessed the infants and dismissed them without baptism; the incident is no argument for infant baptism'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Christ blessed infants, and so dismissed them, but baptized them not, therefore infants are not to be baptized.'
  - where: 'note 19:15 “Hands laid on the children”'
    claim: 'D&C 20:70 commands that children be brought to the elders for a blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/20?lang=eng'
    quote: 'Every member of the church of Christ having children is to bring them unto the elders before the church, who are to lay their hands upon them in the name of Jesus Christ, and bless them in his name.'
  - where: 'note 19:15 “Hands laid on the children”'
    claim: 'Mormon, writing to Moroni, calls the baptism of little children solemn mockery before God (Moroni 8:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/8?lang=eng'
    quote: 'my beloved son, I know that it is solemn mockery before God, that ye should baptize little children.'

  - where: 'note 19:17 “Why callest thou me good?”'
    claim: 'The remark was no denial of sinlessness; the young man used “good” as polite compliment'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'This remark was no denial of sinlessness on the Savior’s part; the young man had called Him “good” by way of polite compliment rather than in recognition of His Godship, and Jesus declined to acknowledge the distinction when applied in that sense.'
  - where: 'note 19:17 “Why callest thou me good?”'
    claim: 'The remark must have deepened the young man’s sense of the seriousness of his question'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The Lord’s remark must have deepened the young man’s conception as to the seriousness of his question.'
  - where: 'note 19:17 “Why callest thou me good?”'
    claim: 'The modern critical Greek text of Matthew 19:17 reads “Why do you ask me about what is good? One is good”'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/19-17.htm'
    quote: 'Ti Τί Why … erōtas ἐρωτᾷς ask you … peri περὶ about … agathou ἀγαθοῦ ? good … heis εἷς Only One … estin ἐστιν is … agathos ἀγαθός . good'

  - where: 'note 19:21 “Perfect, and the one thing lacking”'
    claim: 'Thayer: teleios of character, one who has reached the proper height of virtue, at Matthew 5:48 and 19:21'
    key: thayer
    url: 'https://biblehub.com/greek/5046.htm'
    quote: 'of mind and character, one who has reached the proper height of virtue and integrity: Matthew 5:48; Matthew 19:21'
  - where: 'note 19:21 “Perfect, and the one thing lacking”'
    claim: 'The footnote at Matthew 5:48 glosses perfect as complete, finished, fully developed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'GR complete, finished, fully developed.'
  - where: 'note 19:21 “Perfect, and the one thing lacking”'
    claim: 'He probably expected one special observance; love of worldly things was his besetting weakness; the same remedy is not warranted for all'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Love of worldly things was this man’s besetting weakness; Jesus diagnosed his case and prescribed a suitable remedy. We are not warranted in saying that the same treatment would be best in all cases of spiritual defection'
  - where: 'note 19:21 “Perfect, and the one thing lacking”'
    claim: 'He had probably expected some special observance'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'He had probably expected to hear the great Teacher prescribe some one special observance, by which excellence could be achieved.'
  - where: 'note 19:21 “Perfect, and the one thing lacking”'
    claim: 'He spoke without pride or self-righteousness and had been strict in obeying the law'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'In simplicity and without pride or sense of self-righteousness, the young man said: “All these things have I kept from my youth up: what lack I yet?”'
  - where: 'note 19:21 “Perfect, and the one thing lacking”'
    claim: 'Where the symptoms indicate the need, the same remedy may be used with confidence'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'but where the symptoms indicate the need, it may be employed with confidence as to the cure.'
  - where: 'note 19:21 “Perfect, and the one thing lacking”'
    claim: 'Luke calls him a ruler, perhaps a synagogue official or a member of the Sanhedrin'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Luke tells us that the young man was a ruler; this may mean that he was a presiding official in the local synagog or possibly a Sanhedrist.'

  - where: 'note 19:24 “A camel through a needle’s eye”'
    claim: 'A figurative proverb of the age; a Jewish proverb about an elephant through a needle’s eye; the “rope” reading rejected'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'There was a “common Jewish proverb, that a man did not even in his dreams see an elephant pass through the eye of a needle” (Edersheim). Some interpreters insist that a rope, not a camel, was mentioned by Jesus'
  - where: 'note 19:24 “A camel through a needle’s eye”'
    claim: 'The claimed small gate called the needle’s eye; the Lord’s own exposition suffices'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'It has been asserted that the term “needle’s eye” was applied to a small door or wicket set in or alongside the great gates in the walls of cities'
  - where: 'note 19:24 “A camel through a needle’s eye”'
    claim: 'The Lord’s exposition is sufficient'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The Lord’s exposition of His saying is all-sufficient for the purposes of the lesson: “With men this is impossible, but with God all things are possible.” (Matthew 19:26.)'
  - where: 'note 19:24 “A camel through a needle’s eye”'
    claim: 'Farrar rejected the rope reading because such proverbs are common in the Talmud'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Farrar (p. 476) rejects this possible interpretation on the ground that proverbs involving comparisons of a kind with that of a camel passing through the eye of a needle are common in the Talmud.'

  - where: 'note 19:26 “With God all things are possible”'
    claim: 'JST Matthew 19:26: possible if they will forsake all things for my sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/19?lang=eng'
    quote: 'JST Matt. 19:26 But Jesus beheld their thoughts, and said unto them, With men this is impossible; but if they will forsake all things for my sake, with God whatsoever things I speak are possible.'
  - where: 'note 19:26 “With God all things are possible”'
    claim: 'JST Mark 10:26: impossible with men who trust in riches, possible with those who trust in God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/10?lang=eng'
    quote: 'JST Mark 10:26 … With men that trust in riches, it is impossible; but not impossible with men who trust in God and leave all for my sake, for with such all these things are possible.'
  - where: 'note 19:26 “With God all things are possible”'
    claim: 'Wealth is a temptation but no insuperable barrier to the kingdom'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'while wealth is a means of temptation to which many succumb, it is no insuperable obstacle, no insurmountable barrier, in the way of entrance to the kingdom.'

  - where: 'note 19:28 “The regeneration and the twelve thrones”'
    claim: 'JST Matthew 19:28 reads “resurrection” for “regeneration”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/19?lang=eng'
    quote: 'JST Matt. 19:28 … resurrection …'
  - where: 'note 19:28 “The regeneration and the twelve thrones”'
    claim: 'Thayer: paliggenesia at Matthew 19:28 is the restoration of all things to their primal perfect state, expected with the Messiah and with Jesus’s return'
