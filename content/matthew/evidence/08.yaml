chapter: 8
claims:
  - where: setting
    claim: 'Matthew 4:23 and 9:35 frame the sermon and the miracles as one unit; Messiah in word and deed'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Therefore, Matthew expected that his readers would recognize that the Sermon on the Mount in chapters 5–7 should be read in conjunction with the collection of miracles in chapters 8 and 9. Thus, Matthew wants his readers to see that Jesus is the Messiah in both word (the Sermon on the Mount) and deed (His miracles).'
  - where: setting
    claim: 'In chapters 8 and 9 Matthew has collected a series of miracles'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'In chapters 8 and 9 Matthew has collected a series of miracles, one of which is the stilling of the storm.'
  - where: setting
    claim: 'Luke uses the sayings of 8:19–22 to introduce the calling of the Seventy'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'These verses stand out in a chapter that deals with miracles because they focus on discipleship and the cost of choosing to follow Jesus. In contrast to Matthew, Luke uses them to introduce the calling of the Seventy (see Luke 9:57–10:16).'
  - where: setting
    claim: 'The landing was on the eastern side of the lake'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Jesus and the disciples with Him landed on the eastern or Perean side of the lake, in a region known as the country of the Gadarenes or Gergesenes.'
  - where: thread
    claim: 'Matthew places the discipleship sayings before the storm so it is read through the lens of discipleship'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'By introducing the miracle stories with verses about discipleship, Matthew indicates to his readers that the miracle of the stilling of the storm should be interpreted through the lens of discipleship.'
  - where: thread
    claim: 'The sermon and the miracles show Jesus as Messiah in word and deed'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Thus, Matthew wants his readers to see that Jesus is the Messiah in both word (the Sermon on the Mount) and deed (His miracles).'
  - where: 'note 8:2 “Not whether He could, but whether He would”'
    claim: 'The leper’s question was not whether Jesus could heal but whether He would; Jesus touched him though he was unclean'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'The question in his mind was not—Can Jesus heal me? but—Will he heal me? In compassionate mercy Jesus laid His hand upon the sufferer, unclean though he was, both ceremonially and physically'
  - where: 'note 8:2 “Not whether He could, but whether He would”'
    claim: 'The leper was cut off from Israel’s fellowship and has been read as a type of the sinner'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'it required the sufferer to be ostracized and cut off from any fellowship with the rest of the house of Israel. Because of these characteristics, leprosy was also an appropriate type or symbol of what happens to a man spiritually when he sins.'
  - where: 'note 8:2 “Not whether He could, but whether He would”'
    claim: 'The priest who cleansed the leper and restored him to fellowship was a type of Christ'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'The priest served as the official representative of the Lord, authorized to cleanse the leper and bring him back into full fellowship. As we have seen earlier, the priest was also a type of Christ.'
  - where: 'note 8:2 “Not whether He could, but whether He would”'
    claim: 'The law put the leper outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'All the days wherein the plague shall be in him he shall be defiled; he is unclean: he shall dwell alone; without the camp shall his habitation be.'
  - where: 'note 8:4 “Why the priest, and why the silence”'
    claim: 'Sending the man to the priest showed Christ came to fulfil the law; ignoring it would have increased priestly opposition'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'In this instruction we see that Christ had not come to destroy the law, but, as He affirmed at another time, to fulfil it; and at this stage of His work the fulfillment was incomplete. Moreover, had the legal requirements been disregarded … priestly opposition, already waxing strong and threatening against Jesus, would have been augmented'
  - where: 'note 8:4 “Why the priest, and why the silence”'
    claim: 'The silence may have kept priests from obstructing the man’s recognition as clean'
    key: talmage-jesus-christ-14
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-14?lang=eng'
    quote: 'There was perhaps good reason for this injunction of silence, aside from the very general course of our Lord in discountenancing undesirable notoriety; for, had word of the miracle preceded the man’s appearing before the priest, obstacles might have been thrown in the way of his Levitical recognition as one who was clean.'
  - where: 'note 8:5 “A Gentile officer in a Jewish village”'
    claim: 'A Roman garrison at Capernaum; a centurion was captain of a hundred men'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'There was at that time a Roman garrison in the city. A military officer, a centurion or captain of a hundred men, was stationed there.'
  - where: 'note 8:5 “A Gentile officer in a Jewish village”'
    claim: 'No archaeological trace of Gentiles at Capernaum; the impression of a village of conservative Jews'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'there is no archaeological trace of a Gentile presence at Capernaum—no pig bones, Greek inscriptions, or Roman art—leaving the impression that the village was entirely inhabited by conservative Jews. … the impression given in Matthew may more accurately reflect the village’s cultural dynamics.'
  - where: 'note 8:5 “A Gentile officer in a Jewish village”'
    claim: 'Matthew omits Luke’s praise and uses the centurion to prepare for the shift in missionary emphasis'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Yet Matthew has prepared his readers for the shift in missionary emphasis with his accounts of the healings of the centurion’s servant and the Canaanite woman’s children. … Matthew does not include Luke’s description of the centurion as one who “loveth our nation” and who “built us a synagogue” (Luke 7:5).'
  - where: 'note 8:5 “A Gentile officer in a Jewish village”'
    claim: 'Jesus was willing to go to the house despite the stigma of helping the Romans'
    key: sc-knowhy-508
    url: 'https://scripturecentral.org/knowhy/why-did-christ-perform-miracles'
    quote: 'When a centurion asked Jesus to come to his house to heal someone, Jesus had compassion on him and was willing to go to the man’s house despite the stigma associated with helping the Romans (Matthew 8:7).'
  - where: 'note 8:5 “A Gentile officer in a Jewish village”'
    claim: 'Matthew and Luke on who came are not in real discrepancy: one may be said to do what he has others do'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'There is here no real discrepancy. It was then allowable, as in our time it is, to speak of one who causes something to be done as doing that thing himself. … A man may say he has built a house, when in reality others did the work of building though at his instance.'
  - where: 'note 8:9 “Faith that understood authority”'
    claim: 'The centurion reasoned from his own authority; he may have heard of the nobleman’s son healed at a distance'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'He himself was a man of authority, though under the direction of superior officers. To his subordinates he gave orders which were obeyed. He did not find it necessary to personally attend to the carrying out of his instructions. Surely One who had such power as Jesus possessed could command and be obeyed.'
  - where: 'note 8:9 “Faith that understood authority”'
    claim: 'The nobleman’s son healed by a word spoken miles away'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Moreover, the man may have heard of the marvelous restoration of the nobleman’s dying son, in accomplishing which the Lord spoke the effective word when miles away from the sufferer’s bed.'
  - where: 'note 8:9 “Faith that understood authority”'
    claim: 'How Jesus could marvel: He pondered the faith, a contrast to the unbelief He met; He marveled at unbelief in Mark 6:6'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'He pondered over it, and contemplated it, probably as a refreshing contrast to the absence of faith He so generally encountered. In similar way, though with sorrow in place of joy, He is said to have marveled at the people’s unbelief (Mark 6:6).'
  - where: 'note 8:9 “Faith that understood authority”'
    claim: 'The Joseph Smith Translation has those who followed Him marvel (footnote 10a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/8?lang=eng'
    quote: 'JST Matt. 8:9 And when they that followed him, heard this, they marveled.'
  - where: 'note 8:11 “Guests at Abraham’s table”'
    claim: 'Only Matthew puts the saying here; Luke elsewhere; Gentiles share the end-time feast while many of Israel miss it'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Luke records this statement in a different setting (see Luke 13:28–29). Thus, Matthew emphasizes that at times Gentiles have more faith than the covenant people and will participate in the eschatological feast when many of the house of Israel will miss out.'
  - where: 'note 8:11 “Guests at Abraham’s table”'
    claim: 'Hearers were unused to a Gentile’s faith extolled; tradition counted Gentiles inferior; Israel’s place only through righteousness'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'the Jews were unaccustomed to hear the faith of a Gentile so extolled, for, according to the traditionalism of the day, a Gentile, even though an earnest proselyte to Judaism, was accounted essentially inferior to even the least worthy of the chosen people.'
  - where: 'note 8:11 “Guests at Abraham’s table”'
    claim: 'The lesson: Israel’s supremacy only through righteousness'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'This lesson, that the supremacy of Israel can be attained only through excellence in righteousness, is reiterated and enlarged upon in the Lord’s teachings, as we shall see.'
  - where: 'note 8:11 “Guests at Abraham’s table”'
    claim: 'Nephi: repentant Gentiles are the covenant people; unrepentant Jews cast off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/30?lang=eng'
    quote: 'as many of the Gentiles as will repent are the covenant people of the Lord; and as many of the Jews as will not repent shall be cast off'
  - where: 'note 8:14 “Peter’s house”'
    claim: 'The excavated “house of Peter” (Insula I): a first-century-BC dwelling under a Byzantine octagonal chapel, its main room later plastered and used for gatherings'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'the earliest structure underneath was a typical domestic complex built around the first century BC. … by the late first or early second century AD, the largest room of the complex (room 1) was renovated with a plastered floor, a feature unattested elsewhere at Capernaum.'
  - where: 'note 8:14 “Peter’s house”'
    claim: 'The room came to be used for communal gatherings rather than daily living'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'the pottery assemblage in the room shifted from common household wares to oil lamps and storage jars, suggesting that the room began to be used for communal gatherings rather than daily living.'
  - where: 'note 8:14 “Peter’s house”'
    claim: 'Identifying it as Peter’s house is possible but cannot be proved'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'Therefore, while identifying Insula I as Peter’s house is an intriguing possibility—especially considering the site’s long tradition of Christian veneration—it is ultimately impossible to prove.'
  - where: 'note 8:14 “Peter’s house”'
    claim: 'Capernaum houses: basalt fieldstone rooms around a shared courtyard for the extended family'
    key: grey-peter-capernaum
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/simon-peter-capernaum-archaeological-survey-first-century-village'
    quote: 'including the modest walls made of basalt fieldstones, the roofs made of wood beams and reeds bound together with a mud mortar, and the shared courtyard space which allowed members of the extended family to live and work in close proximity.'
  - where: 'note 8:17 “Isaiah’s servant carries sickness”'
    claim: 'Matthew’s rendering of Isaiah 53:4 is closer to the Hebrew than the KJV Isaiah; Alma’s is closest'
    key: wayment-alma-7-11
    url: 'https://archive.bookofmormoncentral.org/content/hebrew-text-alma-711'
    quote: 'Upon comparison with a literal translation of the Hebrew Masoretic Text, it is clear that Alma’s rendering is closest to the Hebrew, followed by Matthew’s rendering. Interestingly, the KJV Isaiah is the most distant translation of the three'
  - where: 'note 8:17 “Isaiah’s servant carries sickness”'
    claim: 'The Septuagint read the nouns as “sins” and “pain”; Matthew’s words suggest physical ailment'
    key: wayment-alma-7-11
    url: 'https://archive.bookofmormoncentral.org/content/hebrew-text-alma-711'
    quote: 'an ancient Greek translation of the same passage by the translators of the Septuagint likewise attempted to understand the meaning of the terms ḥôlāyēnû and makʾōbênû by interpreting them as “sins” and “pain.” … Both infirmities and sicknesses in Matthew suggest physical ailment or malady.'
  - where: 'note 8:17 “Isaiah’s servant carries sickness”'
    claim: 'Alma 7:11 quotes Isaiah 53:4; the servant bears all sicknesses, physical included, and pains, inward included'
    key: sc-knowhy-564
    url: 'https://scripturecentral.org/knowhy/whose-word-was-fulfilled-by-christs-suffering-pains-and-sicknesses'
    quote: 'Isaiah’s words about the Son of God, the suffering servant, bearing for all his people all their sicknesses (including physical maladies) and pains (including mental or internal suffering).'
  - where: 'note 8:20 “The Son of Man with nowhere to lay His head”'
    claim: 'The title is used about 80 times in the Gospels, only by Jesus of Himself; in the Old Testament often “a man”'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: 'A title of our Lord, found in the Gospels about 80 times, used by Him in speaking of Himself but never used by anyone else in speaking of Him … In the Old Testament the expression “son of man” is frequently used to denote simply “a man”'
  - where: 'note 8:20 “The Son of Man with nowhere to lay His head”'
    claim: 'The ideas behind the title: lowliness and suffering; honor as head of the kingdom and judge; latter-day revelation confirms its sacredness'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: '(1) lowliness, humility, and suffering … (2) honor and dignity, as head and founder of the kingdom of God, and judge of all men … Latter-day revelation confirms the special meaning and sacredness of this phrase when used as a name of the Savior'
  - where: 'note 8:20 “The Son of Man with nowhere to lay His head”'
    claim: 'This is the first “Son of man” in Matthew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/8?lang=eng'
    quote: 'The foxes have holes, and the birds of the air have nests; but the Son of man hath not where to lay his head.'
  - where: 'note 8:20 “The Son of Man with nowhere to lay His head”'
    claim: 'Few of the ruling class had offered to follow; Jesus chose rather than accepted'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Prior to that time, few men belonging to the titled or ruling class had offered to openly ally themselves with Jesus. … but He, who could read the minds and know the hearts of men, chose rather than accepted.'
  - where: 'note 8:20 “The Son of Man with nowhere to lay His head”'
    claim: 'Jesus pointed out the sacrifice without curt rejection; no fixed abode; followers must give up home comforts; the scribe is not said to have pressed his offer'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'without wounding his feelings by curt rejection, pointed out the sacrifice required … As Jesus had no fixed place of abode, but went wherever His duty called Him … We do not read that the aspiring scribe pressed his offer.'
  - where: 'note 8:22 “Let the dead bury their dead”'
    claim: 'Not harsh: ministerial duty takes precedence; no greater than the Nazarite vow asked; the spiritually dead may bury the dead'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Some readers have felt that this injunction was harsh, though such an inference is scarcely justified. While it would be manifestly unfilial for a son to absent himself from his father’s funeral under ordinary conditions, nevertheless, if that son had been set apart to service of importance transcending all personal or family obligations, his ministerial duty would of right take precedence.'
  - where: 'note 8:22 “Let the dead bury their dead”'
    claim: 'The Nazarite comparison; the spiritually dead'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'the requirement expressed by Jesus was no greater than that made of every priest during his term of active service, nor was it more afflicting than the obligation of the Nazarite vow … one dedicated thereto might well allow those who were negligent of spiritual things, and figuratively speaking, spiritually dead, to bury their dead.'
  - where: 'note 8:23 “Following Him into the ship”'
    claim: 'Mark and Luke use the story to show power over the elements; Matthew uses it differently'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'Mark and Luke use the story to show that Jesus has power over the physical elements (see Mark 4:35–41; Luke 8:22–25), but, while Matthew’s account acknowledges this power, he uses the story differently.'
  - where: 'note 8:23 “Following Him into the ship”'
    claim: 'The sayings on discipleship come before; Luke uses them to introduce the Seventy'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'These verses stand out in a chapter that deals with miracles because they focus on discipleship and the cost of choosing to follow Jesus. In contrast to Matthew, Luke uses them to introduce the calling of the Seventy (see Luke 9:57–10:16).'
  - where: 'note 8:23 “Following Him into the ship”'
    claim: 'Matthew’s seismos, associated with end-time tribulations, a symbol of disciples’ difficulties in the ship, the Church'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'Matthew uses the Greek word seismos, translated in the KJV as “tempest,” whereas both Mark and Luke use lailaps … in the New Testament seismos is almost universally associated with the destructions and tribulations that take place at the end of the world … The tempest in Matthew thus becomes a symbol for the difficulties disciples face as they choose to enter the ship or, in other words, the Church.'
  - where: 'note 8:23 “Following Him into the ship”'
    claim: 'Following into the ship does not promise a calm voyage; safety is in the ship where the Son of God is'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'Perhaps disciples might think that following Jesus into the ship/church would mean that their struggles in life would be over; that they would have a pleasant, calm voyage across the sea. But the storm comes quickly. Tribulations are a part of discipleship.'
  - where: 'note 8:23 “Following Him into the ship”'
    claim: 'Safety in the ship where the Son of God is, though asleep'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'Rather there is safety in the ship because that is where the Son of God is. Even though he is asleep, he has the power to protect the ship and all who are in it'
  - where: 'note 8:26 “Faith first, then the calm”'
    claim: 'Matthew moves the question about faith before the rebuke of wind and sea'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'In Matthew, however, Jesus awakes, asks about the disciples’ faith first, and then rebukes the wind and the sea. Thus, the emphasis in Matthew is on the disciples’ faith, or lack thereof, rather than the power to rebuke the wind and the sea.'
  - where: 'note 8:26 “Faith first, then the calm”'
    claim: '“Master” in Mark and Luke a human title; “Lord” (kyrios) used in the Septuagint for the divine name'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'In both Mark and Luke, the disciples address Jesus with “Master,” which is “a human title of respect” … in Matthew’s account they cry out, “Lord, save us.” … It is a term which in the Septuagint (the Greek Old Testament) is “used as an expository equivalent for the divine name” YHWH.'
  - where: 'note 8:26 “Faith first, then the calm”'
    claim: '“Save” has a physical and a spiritual dimension'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'in Matthew’s account the disciples add a plea for Jesus to “save [sozō] us,” a plea that can have both a physical and a spiritual dimension.'
  - where: 'note 8:26 “Faith first, then the calm”'
    claim: '“Little faith” elsewhere in Matthew and once in Luke'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/12?lang=eng'
    quote: 'how much more will he clothe you, O ye of little faith?'
  - where: 'note 8:26 “Faith first, then the calm”'
    claim: 'The cry was not wholly without hope or faith'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'Their terrified appeal was not wholly devoid of hope nor barren of faith: “Lord, save us” they cried.'
  - where: 'note 8:27 “Asleep in the storm, Lord of the sea”'
    claim: 'His sleep shows the reality of His body: fatigue, hunger, thirst, weariness'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The circumstance is instructive as it evidences at once the reality of the physical attributes of Christ … He was subject to fatigue and bodily exhaustion from other causes, as are all men; without food He grew hungry; without drink He thirsted; by labor He became weary.'
  - where: 'note 8:27 “Asleep in the storm, Lord of the sea”'
    claim: 'The Lord of earth, air and sea who commanded at the Creation'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'The Lord of earth, air, and sea spoke and was obeyed. He it was who, amidst the black chaos of creation’s earliest stages, had commanded with immediate effect—Let there be light; Let there be a firmament in the midst of the waters; Let the dry land appear—and, as He had decreed, so it was.'
  - where: 'note 8:26 “Faith first, then the calm”'
    claim: 'Matthew emphasizes that a divine being is in the ship'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'Thus, Matthew emphasizes that it is a divine being, not just a great human who is in the ship.'
  - where: 'note 8:28 “Gergesenes or Gadarenes, two men or one”'
    claim: 'A region, not a town; Gadara, Gerasa and Gergesa all in the district'
    key: talmage-jesus-christ-20
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-20?lang=eng'
    quote: 'As stated in the text, a whole region or section is referred to, not a town. … In that district of Perea there were at the time towns named respectively Gadara, Gerasa, and Gergesa; the region in general, therefore, could properly be called the land of the Gadarenes or of the Gergesenes.'
  - where: 'note 8:28 “Gergesenes or Gadarenes, two men or one”'
    claim: 'The SBL critical edition of Matthew 8:28 reads “Gadarenes”'
    key: greek-nt
    url: 'https://biblehub.com/texts/matthew/8-28.htm'
    quote: 'SBL Greek New Testament 2010 Καὶ ἐλθόντος αὐτοῦ εἰς τὸ πέραν εἰς τὴν χώραν τῶν Γαδαρηνῶν'
