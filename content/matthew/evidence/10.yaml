chapter: 10
claims:
  - where: setting
    claim: 'Matthew 10 is the second of Matthew’s five discourses, the Apostolic Commission, each closed with a formula'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'we find him delineating five major discourses by the Savior: the Sermon on the Mount (Matthew 5–7), the Apostolic Commission (Matthew 10), … At the end of each of the first four discourses, he added, “And it came to pass, when Jesus had ended these'
  - where: setting
    claim: 'Matthew describes the mission of the Twelve, not their choosing, which had been made before (Luke 6:13)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'What is described here is not the choice, but the mission of the Twelve. That selection had been made before (Luke 6:13)'
  - where: setting
    claim: 'After the second rejection at Nazareth, Jesus began a third tour of Galilee'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Leaving Nazareth, He entered upon His third tour of the Galilean towns and villages, preaching and teaching as He went.'
  - where: setting
    claim: 'Since their ordination the apostles had learned from Jesus by public discourse and private teaching for many months'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Since their ordination the apostles had been with their Lord, learning from Him by public discourse and private exposition, … They had been pupils under the Master’s watchful guidance for many months'
  - where: setting
    claim: 'The Lord gave the elders of this dispensation the same charge, naming the ancient disciples as the pattern'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'that ye become even as my friends in days when I was with them, traveling to preach the gospel in my power;'
  - where: thread
    claim: 'The apostles were sent by Jesus as He had been sent by the Father'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'According to our Lord’s teaching they were sent by Him, even as ‘He had been sent by the Father (John 20:21).'
  - where: thread
    claim: 'The servants were not to expect to escape when their Master was assailed'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'They were admonished to humility, and were always to remember that they were servants, who ought not to expect to escape when even their Master was assailed.'
  - where: 'note 10:1 “His own work, given to the Twelve”'
    claim: 'The repetition of 9:35’s words in 10:1 emphasizes the delegation of authority'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'All manner of sickness.—See Note on Matthew 9:35. The repetition of the same words emphasises the delegation of authority.'
  - where: 'note 10:1 “His own work, given to the Twelve”'
    claim: 'The purpose of their ordination: to be with Him and to be sent; they had been pupils for many months'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The purpose of their ordination was specified—“that they should be with him, and that he might send them forth to preach.” They had been pupils under the Master’s watchful guidance for many months'
  - where: 'note 10:1 “His own work, given to the Twelve”'
    claim: 'They were to exercise the authority of the priesthood conferred by ordination; healing and casting out devils was part of their mission'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'They were to exercise the authority of the Holy Priesthood as conferred upon them by ordination; it was a specified part of their mission to “heal the sick, cleanse the lepers, raise the dead, cast out devils,” as occasion presented itself'
  - where: 'note 10:2 “Apostles: men sent”'
    claim: 'Apostle means “one sent forth”; the title Jesus gave the Twelve; their calling is to be special witnesses of His divinity and resurrection'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'The word means “one sent forth.” It was the title Jesus gave (Luke 6:13) to the Twelve … The calling of an Apostle is to be a special witness of the name of Jesus Christ in all the world, particularly of His divinity and of His bodily resurrection from the dead'
  - where: 'note 10:2 “Apostles: men sent”'
    claim: 'The number suggested the twelve tribes; “apostle” in classical Greek meant an ambassador or envoy of a state'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'the number at once suggested the thought that they represented the twelve tribes of Israel (Matthew 19:28) … it had acquired in classical Greek a more specific meaning, as the “ambassador,” or “envoy,” of a state.'
  - where: 'note 10:2 “Apostles: men sent”'
    claim: 'Today twelve men with the same calling form the Quorum of the Twelve'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'Today twelve men with this same divine calling and ordination constitute the Quorum of the Twelve Apostles in The Church of Jesus Christ of Latter-day Saints.'
  - where: 'note 10:2 “Peter first”'
    claim: 'In the four lists Peter is always first and Judas always last; Peter’s place shows acknowledged preeminence'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'A comparison of the four lists of the Apostles (Matthew 10:2-4, Mark 3:16-19, Luke 6:13-16, Acts 1:13) brings out some interesting facts. (1.) The name of Peter is always first, that of Judas always last. In the former case we recognise acknowledged preeminence.'
  - where: 'note 10:2 “Peter first”'
    claim: 'The lists fall into three groups of four with the same persons in each group'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'All the lists divide themselves into three groups of four, the persons in each group being always the same'
  - where: 'note 10:2 “Peter first”'
    claim: 'The first four were the innermost; Peter, James and John alone witnessed Jairus’s daughter, the Transfiguration and Gethsemane'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'The four obviously occupied the innermost place in the company of the Twelve, and were chosen out of the chosen. The three, Peter, James, and John, were the only witnesses of the healing of Jairus’s daughter (Mark 5:37), of the Transfiguration'
  - where: 'note 10:3 “Two names for one man”'
    claim: 'Nathanael is generally identified with Bartholomew: the first three Gospels name Bartholomew beside Philip and never Nathanael, John the reverse'
    key: bd-nathanael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nathanael?lang=eng'
    quote: 'He is generally identified with Bartholomew, on the ground that Nathanael is always mentioned along with Apostles, as though of apostolic rank, and that whereas the Synoptists (Matt. 10:3; Mark 3:18; Luke 6:14) mention Bartholomew (associating him with Philip) and never Nathanael'
  - where: 'note 10:3 “Two names for one man”'
    claim: 'Bartholomew is a patronymic, like Barjona; the lists set him beside Philip, who brought Nathanael'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'The name, like Barjona and Bartimæus, was obviously a patronymic … has led most modern commentators to the conclusion that they were two names for the same person; and the juxtaposition of the two names in their lists agrees with the fact that it was Philip who brought him'
  - where: 'note 10:3 “Two names for one man”'
    claim: 'Judas “not Iscariot,” brother or son of James, probably the same as Lebbaeus or Thaddaeus'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: '“Not Iscariot,” one of the Twelve, also called Judas (son or brother) of James (Luke 6:16; John 14:22; Acts 1:13); probably the same as Lebbaeus or Thaddaeus (Matt. 10:3; Mark 3:18).'
  - where: 'note 10:3 “Two names for one man”'
    claim: 'Thaddaeus is the surname of Lebbaeus'
    key: bd-thaddaeus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/thaddaeus?lang=eng'
    quote: 'Lebbaeus, whose surname was Thaddaeus (Matt. 10:3; Mark 3:18; Luke 6:16; Acts 1:13).'
  - where: 'note 10:4 “The Zealot and the man from Kerioth”'
    claim: '“Canaanite” should be Cananean, referring to Simon’s political attachments, not his lineage'
    key: bd-canaanite
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/canaanite?lang=eng'
    quote: 'the word should be Cananean rather than Canaanite; it has reference to his political attachments rather than his lineage or geographical point of origin.'
  - where: 'note 10:4 “The Zealot and the man from Kerioth”'
    claim: 'Cananean is from Aramaic Kanan, of which Zelotes is the Greek; the Zealots resisted Roman or any foreign authority'
    key: bd-zelotes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zelotes?lang=eng'
    quote: 'which is formed from an Aramaic word (Kanan), of which Zelotes is the Greek and Zealot the English equivalent. The Zealots were a party among the Jews (so called from their zeal for the law) who were determined to resist Roman or any foreign authority in Palestine.'
  - where: 'note 10:4 “The Zealot and the man from Kerioth”'
    claim: 'Iscariot means “belonging to Kerioth” in Judah; he alone of the Twelve was not a Galilean'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: 'Iscariot, meaning “belonging to Kerioth” (Josh. 15:25) in the tribe of Judah, one of “the twelve,” and the only one who was not a Galilean.'
  - where: 'note 10:5 “Israel first, for now”'
    claim: 'The restriction to Israel and away from Gentiles and Samaritans was temporary; later they preached to all nations'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'not to open a propaganda among the Gentiles, nor even in Samaritan cities. This was a temporary restriction, imposed in wisdom and prudence; later, as we shall see, they were directed to preach among all nations, with the world for their field.'
  - where: 'note 10:5 “Israel first, for now”'
    claim: '“Gentiles” here meant the Romans and Greeks; the charge kept the Twelve to Israel for the time'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The injunction laid by Jesus upon the Twelve—“Go not into the way of the Gentiles”—was to restrain them for the time being from attempting to make converts among the Romans and Greeks, and to confine their ministry to the people of Israel.'
  - where: 'note 10:5 “Israel first, for now”'
    claim: 'Matthew 15:24 shows that for Jesus the sheep to be gathered were the house of Israel'
    key: sc-knowhy-207
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-there-were-other-sheep-who-would-hear-his-voice'
    quote: 'It indicates that, for Jesus, the “sheep” in need of gathering together were not gentiles, but people from “the house of Israel.”'
  - where: 'note 10:5 “Israel first, for now”'
    claim: '3 Nephi 15:22: the Jews supposed the other sheep were the Gentiles, not understanding the Gentiles would be converted through preaching'
    key: sc-knowhy-207
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-there-were-other-sheep-who-would-hear-his-voice'
    quote: 'However, the people of ancient Judea understood him “not, for they supposed it had been the Gentiles; for they understood not that the Gentiles should be converted through their preaching” (3 Nephi 15:22).'
  - where: 'note 10:10 “Without purse or scrip”'
    claim: 'Mark’s “staff only” and “sandals”: no second staff or spare shoes; sandals were peasant footwear'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'The apparent contradiction between these words and St. Mark’s “nothing except a staff only,” “be shod with sandals,” is explained by what has been said above. They were to have none of the reserved comforts of common travellers, no second staff in case the first should break'
  - where: 'note 10:10 “Without purse or scrip”'
    claim: 'Sandals were the shoes of the peasant class'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'no second pair of shoes in which to rest the worn and weary feet. The “sandals” were the shoes of the peasant class.'
  - where: 'note 10:10 “Without purse or scrip”'
    claim: 'Travelling without money, clothes or provisions made the missionary wholly dependent on the hospitality of strangers'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Hospitality was to play a fundamental role in the missionary effort, as is witnessed by Christ’s instructions that the missionary was to travel without money, extra clothes, and particularly provisions. Thus the missionary was entirely dependent upon the hospitality of strangers for sustenance.'
  - where: 'note 10:10 “Without purse or scrip”'
    claim: 'The people were to be proved by their willingness to receive the messengers; the apostles to learn to rely on God; money and extra clothing left behind'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'the people were to be proved as to their willingness to receive and assist those who came in the name of the Lord; and the apostles themselves were to learn to rely upon a Provider more to be trusted than man'
  - where: 'note 10:10 “Without purse or scrip”'
    claim: '“Freely give” is stronger in Greek, give gratis; they had paid Him nothing and were not to require payment on this mission'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'The English hardly suggests more than giving liberally. The Greek is much stronger, “Give as a free gift—give gratis” They had paid Him nothing. They were not in this their first mission to require payment from others.'
  - where: 'note 10:10 “Without purse or scrip”'
    claim: 'D&C 84 gives the same charge to latter-day elders: no purse, scrip or two coats'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'that ye become even as my friends in days when I was with them, traveling to preach the gospel in my power;'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'The rite reverses the hospitality rite of foot washing; dexomai, “receive,” was a term of a host’s duty to a guest'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'the rite of wiping dust off feet may be thought of as the reverse of the foot-washing rite, utilizing the social institution of hospitality to provide the meaning behind the act.'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'No water is mentioned: unreceived guests clean their own feet, and the blessing hospitality would earn is inverted'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Because they were not received, they were not offered water for their feet, and thus the traveler is forced to clean their own feet without water. In this light, the positive reciprocity that one would expect from normal hospitality, including a blessing pronounced on the house by the guest, is inverted'
  - where: 'note 10:14 “Dust shaken off”'
    claim: '“Receive” was a hospitality term; if the guest was an emissary, reception could include his message'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'it was one of a constellation of terms used to describe Greco-Roman hospitality responsibilities, specifically the responsibilities of the host “to receive” the'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'Matthew alone lets the rite be performed against a house as well as a city; it is unclear whether rejection of hospitality or of the message is meant'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'While Matthew’s version states that the rite can be performed against an individual house as well as the city (see Matthew 10:14), Mark’s and both of Luke’s versions mention only performing the rite against the city'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'Unclear whether the rite answered lack of hospitality or rejection of the message'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Unfortunately, even with the larger context of hospitality, it is unclear whether the rite was given in response to a lack of physical hospitality or to rejection of the message.'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'The link with Sodom and Gomorrah may tie the rite to inhospitality; their destruction was explained in later literature by their hostility to Lot’s guests (Ezek. 16:49)'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'That the rite may be associated with inhospitality is also reflected in the association of the city or household against which the rite is performed with Sodom and Gomorrah. … the destruction of these two cities was explained in later literature as the result of their hostility instead of hospitality toward Lot’s guests (see Ezekiel 16:49).'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'Acts 13:50–51 is the only New Testament account of the rite performed'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Acts 13:50–51 is the only descriptive text that we have for our rite in the canon.'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'D&C 60:15 directs that the rite be done in secret, not in the presence of those testified against'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: '“And shake off the dust of thy feet against those who receive thee not, not in their presence, lest thou provoke them, but in secret; and wash thy feet, as a testimony against them in the day of judgment.”'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'Performed properly, the rite brings joy and gladness; a sense of vindication or vengeance means it has failed'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Finally, we are told that when performed properly, the performer should experience joy and gladness. … can be contrasted with negative emotional responses such as a sense of vindication or satisfaction of vengeance; if the latter are experienced, then one can expect the rite has failed.'
  - where: 'note 10:14 “Dust shaken off”'
    claim: 'D&C 75:21: those who perform the rite shall be filled with joy and gladness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/75?lang=eng'
    quote: 'And you shall be filled with joy and gladness; and know this, that in the day of judgment you shall be judges of that house, and condemn them;'
  - where: 'note 10:16 “Serpents and doves”'
    claim: 'The apostles were to be prudent and give no needless offense, and not to entrust themselves recklessly to men'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The apostles were told to be prudent, to give no needless offense, but to be wise as serpents, and harmless as doves; for they were sent forth as sheep into the midst of wolves. They were not to recklessly entrust themselves to the power of men'
  - where: 'note 10:16 “Serpents and doves”'
    claim: 'D&C 111:11 restates the saying as wise as serpents and yet without sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/111?lang=eng'
    quote: 'Therefore, be ye as wise as serpents and yet without sin; and I will order all things for your good, as fast as ye are able to receive them.'
  - where: 'note 10:19 “Given in that same hour”'
    claim: 'Before governors and kings they were to rely on inspiration rather than their own premeditation'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Moreover they might expect to be brought before governors and kings, under which extreme conditions they were to rely upon divine inspiration as to what they should say, and not depend upon their own wisdom in preparation and premeditation'
  - where: 'note 10:19 “Given in that same hour”'
    claim: 'D&C 84:85 repeats the promise with the command to treasure up the words of life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Neither take ye thought beforehand what ye shall say; but treasure up in your minds continually the words of life, and it shall be given you in the very hour that portion that shall be meted unto every man.'
  - where: 'note 10:23 “Till the Son of man be come”'
    claim: 'The coming of the Son of Man recalls Daniel 7:13; the connection with the time limit is hard and led the apostolic age to expect the coming soon'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'It is more difficult to understand the connection of the words with the preceding limit of time, “Ye shall not have gone over the cities of Israel.” The natural result of such a promise was to lead the disciples to look forward to that coming as certain to be within the range of their own lifetime'
  - where: 'note 10:23 “Till the Son of man be come”'
    claim: 'The Son of Man coming as Daniel saw Him'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'The Son of Man should come, as Daniel had seen Him come (Daniel 7:13), in the clouds of heaven, with power and great glory, to complete the triumph of His kingdom.'
  - where: 'note 10:23 “Till the Son of man be come”'
    claim: 'Some instructions were for the first mission, others for the whole ministry after the ascension'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Some of the instructions given them on this occasion had particular reference to their first mission, from which they would in due time return and report; other directions and admonitions were to be of effect throughout their ministry, even after the Lord’s ascension.'
  - where: 'note 10:23 “Till the Son of man be come”'
    claim: 'They were to flee persecution, and the Lord would follow them before they finished the circuit of Israel’s cities'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'They were to withdraw from the cities that persecuted them, and go to others; and the Lord would follow them, even before they would be able to complete the circuit of the cities of Israel.'
  - where: 'note 10:25 “Called Beelzebub”'
    claim: 'Beelzebub: a Philistine god; a title for the chief of the demons, Satan'
    key: bd-beelzebub
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beelzebub?lang=eng'
    quote: 'Name of a Philistine god. Used as a title for the “chief of the demons,” or Satan.'
  - where: 'note 10:25 “Called Beelzebub”'
    claim: 'The Twelve were servants who should not expect to escape when their Master was assailed'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'They were admonished to humility, and were always to remember that they were servants, who ought not to expect to escape when even their Master was assailed.'
  - where: 'note 10:28 “Whom to fear”'
    claim: 'Persecutors could at most kill the body, nothing beside destruction of the soul in hell'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Nevertheless they were to be fearless, hesitating not to preach the gospel in plainness; for the most their persecutors could do was to kill the body, which fate was as nothing compared to that of suffering destruction of the soul in hell.'
  - where: 'note 10:28 “Whom to fear”'
    claim: 'Some devout readers, unwilling to present the Father as a destroyer, take “him” to be the adversary'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/10.htm'
    quote: 'Not a few of the most devout and thoughtful commentators, unwilling to admit that our Lord ever presented the Father to men in the character of a destroyer, have urged that the meaning may be thus paraphrased: “Fear not men; but fear the Spirit of Evil, the great Adversary'
  - where: 'note 10:28 “Whom to fear”'
    claim: 'D&C 3:7: Joseph Smith should not have feared man more than God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'For, behold, you should not have feared man more than God.'
  - where: 'note 10:28 “Whom to fear”'
