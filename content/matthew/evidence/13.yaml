    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'the sower to the establishment of the kingdom in the time of Christ; the parable of the wheat and tares to the corruption of the Church in the age of apostasy; the mustard seed to the growth of the kingdom in the last days'
  - where: 'note 13:51 “Seven parables, one history”'
    claim: 'Joseph Smith saw in them an understanding of the gathering'
    key: halverson-soils-souls
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/soils-souls-parable-sower'
    quote: 'Joseph saw in these parables—beginning with and in large part growing from the sower—”as clear an understanding upon the important subject of the gathering, as anything recorded in the Bible.”'
  - where: 'note 13:51 “Seven parables, one history”'
    claim: 'Joseph Smith on the net: the seed of Joseph spreading the gospel net'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/5'
    quote: 'For the work of this pattern, behold the seed of Joseph, spreading forth the gospel net, upon the face of the earth, gathering of every kind, that the good may be saved in vessels prepared for that purpose, and the angels will take care of the bad'
  - where: 'note 13:51 “Seven parables, one history”'
    claim: 'Joseph Smith’s answer to “Have ye understood”: a hearty amen'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/5'
    quote: 'and we say yea Lord, and well might they say yea Lord, for these things are so plain and so glorious, that every Saint in the last days must respond with a hearty amen to them.'
  - where: 'note 13:51 “Seven parables, one history”'
    claim: 'The net: men of every kind are affected by the gospel; the sorting comes after, by the angels'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
