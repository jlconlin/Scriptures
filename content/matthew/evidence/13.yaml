    quote: 'And although the Savior spoke this parable to such characters, yet unto his disciples he expounded it plainly'
  - where: 'note 13:14 “Isaiah’s hard commission”'
    claim: 'Plain teaching would have condemned hearers too weak in faith to accept it'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Had He always taught in explicit declaration, such as required no interpretation, many among His hearers would have come under condemnation, inasmuch as they were too weak in faith and unprepared in heart'
  - where: 'note 13:19 “One seed, four hearers”'
    claim: 'The sower threw the grain by handfuls'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'The primitive method of sowing, still followed in many countries, consisted in the sower throwing the grain by handfuls against the wind, thus securing a widespread scattering.'
  - where: 'note 13:19 “One seed, four hearers”'
    claim: 'The thorns answer to those ashamed after tasting the fruit'
    key: sc-knowhy-663
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-sower-help-us-understand-lehis-vision-of-the-tree-of-life'
    quote: 'In Lehi’s vision, this group made it to the Tree of Life by “clinging to the rod of iron,” but “after they had partaken of the fruit of the tree they did cast their eyes about as if they were ashamed” (1 Nephi 8:24–25).'
  - where: 'note 13:19 “One seed, four hearers”'
    claim: 'The stony ground answers to those lost in the mist of darkness'
    key: sc-knowhy-663
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-sower-help-us-understand-lehis-vision-of-the-tree-of-life'
    quote: 'Similarly, Lehi saw a group of people who initially accepted and began to follow the gospel path to eternal life but ultimately were blinded by the mist of darkness so that they “wandered off and were lost” (1 Nephi 8:23).'
  - where: 'note 13:19 “One seed, four hearers”'
    claim: 'The good ground answers to those who hold fast to the rod and partake'
    key: sc-knowhy-663
    url: 'https://scripturecentral.org/knowhy/how-does-the-parable-of-the-sower-help-us-understand-lehis-vision-of-the-tree-of-life'
    quote: 'This again corresponds to Lehi’s dream, in which some people “did press their way forward, continually holding fast to the rod of iron, until they came forth and fell down and partook of the fruit of the tree” (1 Nephi 8:30).'
  - where: 'note 13:25 “Tares that look like wheat”'
    claim: 'Darnel grows only in grain fields'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'This noxious weed grass grows exclusively in grain fields and is propagated annually by being harvested with the grain and resown with the next planting of the contaminated seed.'
  - where: 'note 13:25 “Tares that look like wheat”'
    claim: 'Young wheat and tares hard to tell apart; intertwined roots'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'since in the early stages of growth it would have been difficult to distinguish the one from the other, and the intertwining of the roots would have caused much destruction of the precious grain.'
