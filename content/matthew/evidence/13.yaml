  - where: 'note 13:44 “Found by chance, found by search”'
    claim: 'Treasure found seemingly by accident; burying valuables was common against bandits'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Instances of finding buried valuables were not uncommon in the time of which we speak, since the practice of so concealing treasure was usual with people exposed to bandit incursions and hostile invasion.'
  - where: 'note 13:44 “Found by chance, found by search”'
    claim: 'The purchaser of land became owner of all it contained (Talmage)'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'his act was not illegal, since there was an express provision in Jewish law that the purchaser of land became the legal owner of everything the ground contained.'
  - where: 'note 13:44 “Found by chance, found by search”'
    claim: 'The merchant searched; the price in both is one’s all'
    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'Unlike the man in the last parable, who found a hidden treasure with little or no search, the merchant in this story devoted his whole energy to the quest for goodly pearls … Observe that in this parable as in that of the hidden treasure, the price of possession is one’s all.'
  - where: 'note 13:44 “Found by chance, found by search”'
    claim: 'Joseph Smith: the treasure is the Saints selling all to gather; the pearl, finding places for Zion'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/5'
    quote: 'For the work of this example, see men travelling to find places for Zion, and her stakes or remnants, who when they find the place for Zion, or the pearl of great price; straitway sell all that they have and buy it.'

  - where: 'note 13:51 “Seven parables, one history”'
