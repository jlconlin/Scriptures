  - where: 'note 13:58 “Miracles wait on faith”'
    claim: 'Mark’s language is stronger; the power depended on the faith of those who came'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'In St. Mark the language is stronger, “He could do no mighty works there.” The wonder-working power was not absolute and unconditioned, but depended on the faith of those who came to Him.'
  - where: 'note 13:58 “Miracles wait on faith”'
    claim: 'Ether 12:12: without faith God can do no miracle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12?lang=eng'
    quote: 'For if there be no faith among the children of men God can do no miracle among them; wherefore, he showed not himself until after their faith.'
  - where: 'note 13:58 “Miracles wait on faith”'
    claim: 'Luke’s Nazareth visit is placed at the beginning; no sufficient ground to assume it is the same visit'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/13.htm'
    quote: 'In comparing, however, St. Matthew and St. Mark with St. Luke, there seems no sufficient ground for hastily assuming identity. The third Gospel places the visit which it narrates, at the very beginning of our Lord’s work'

  - where: thread
    claim: 'Joseph Smith: the multitude received no explanation of the parables because of unbelief'
