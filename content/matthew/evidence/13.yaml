    quote: 'the very reason why the multitude, or the world, as they were designated by the Savior, did not receive an explanation upon his parables, was, because of unbelief.'
  - where: christ
    claim: 'By the Lord’s own explanation the sower was Himself; those ordained after Him are also sowers'
