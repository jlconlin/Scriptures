    quote: 'By the Author’s explication, the sower was Himself, the Son of Man; and, as the condition of wheat and tares growing together was one that shall continue until “the end of the world,” those who were ordained to carry on the ministry after Him are by direct implication also sowers.'
  - where: christ
    claim: 'Elder Oaks: it is up to each to make the soil good; firmly rooted and converted'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'It is up to each of us to set the priorities and to do the things that make our soil good and our harvest plentiful. We must seek to be firmly rooted and converted to the gospel of Jesus Christ'
  - where: christ
    claim: 'Elder Oaks: conversion by prayer, scripture, service and the sacrament'
    key: oaks-parable-sower
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-parable-of-the-sower?lang=eng'
    quote: 'We achieve this conversion by praying, by scripture reading, by serving, and by regularly partaking of the sacrament to always have His Spirit to be with us.'
