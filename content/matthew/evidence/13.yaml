    key: talmage-jesus-christ-19
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-19?lang=eng'
    quote: 'The mustard seed, however, typifies the effect of vital growth in gathering the substance of value from without; while the leaven or yeast disseminates and diffuses outward its influence throughout the mass of otherwise dense and sodden dough.'
  - where: 'note 13:33 “Leaven, for once, for good”'
    claim: 'Joseph Smith: the church rose from a little leaven put into three witnesses'
    key: jsp-letter-elders-1835-12
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-elders-of-the-church-30-november-1-december-1835/4'
    quote: 'It may be understood that the church of the Latter Day Saints, has taken its rise from a little leaven that was put into three witnesses.'

  - where: 'note 13:35 “A psalm of history, fulfilled”'
