    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'the torrential rains and flash floods that were common in ancient Israel and its surrounding regions.'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'Galilean winter torrents leave level beds of sand that tempt a builder'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/7.htm'
    quote: 'what had seemed a goodly river is then a tract covered with debris of stones and sand. A stranger coming to build might be attracted by the ready-prepared level surface of the sand. It would be easier to build there instead of working upon the hard and rugged rock.'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'The two foundations look the same until the storm'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'the building of the house either on sand or on rock has no immediately discernible effect. In fact, the distinction does not really matter on days when the weather is fair.'
  - where: 'note 7:29 “Not as the scribes”'
    claim: 'Teachers cited earlier rabbis; Jesus cited none and said “I say unto you”'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'However, Christ did not cite previous rabbis. Moreover, he did not speak as prophets, who often said, “Thus saith the Lord.” With bold audacity, he declared, “I say unto you,” asserting his word to be the final authority and holding precedence over the law, its commonly held interpretation'
  - where: 'note 7:29 “Not as the scribes”'
    claim: 'JST Matthew 7:37: authority from God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'authority from God, and not as having authority from the scribes'
  - where: 'note 7:29 “Not as the scribes”'
    claim: 'The scribes’ authority rested on tradition, the Lord’s on revelation'
    key: triplet-hitoto-astonishment
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/audience-astonishment-sermon-mount-sermon-temple'
    quote: 'the authority of the former rested on acceptance of historical tradition whereas the authority of the Lord rested on revelation.'
  - where: 'note 7:29 “Not as the scribes”'
    claim: 'The Nephites marveled for a different reason, about the law of Moses'
    key: triplet-hitoto-astonishment
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/audience-astonishment-sermon-mount-sermon-temple'
    quote: 'Yet, while both audiences had similar reactions, the two texts provide different reasons for the reactions. In the Book of Mormon the marvelment arose because some “understood not the saying that old things had passed away, and that all things had become new.”'
