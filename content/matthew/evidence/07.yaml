  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'Luke 6:37–38: condemning belongs to God; disciples act mercifully and forgive'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'A true disciple understands that judgment and condemnation are the purview of a God who knows all things. As mortals, we must not condemn others; instead, we ought to act mercifully, offering forgiveness even for actions which we may feel strongly are wrong.'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'The measure: judgment for those who condemn and withhold forgiveness, mercy for those who forgive'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'If we choose to judge and condemn others, holding grudges and withholding forgiveness, he will treat with a similar judgment. Yet if we offer our forgiveness and mercy to all, he will shower us with mercy and forgiveness as well.'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'Elder Oaks quotes Luke 6:37 and calls forgiveness the companion principle of “judge not”'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'Sixth, forgiveness is a companion principle to the commandment that in final judgments we judge not and in intermediate judgments we judge righteously. The Savior taught, “Judge not, and ye shall not be judged: condemn not, and ye shall not be condemned: forgive, and ye shall be forgiven” (Luke 6:37).'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'Matthew 7:2 and Luke 6:38 with Alma 41:14–15: what we do to others we largely do to ourselves'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'how we judge others is how we will be judged (see Matthew 6:14–15; 7:2; Luke 6:38). … In light of such teachings, we learn that what we do to others we in large measure do to ourselves (see Alma 41:14–15).'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'In Luke the blind guide and the man with the beam are one kind of hypocrite, blind to his own weaknesses, harming others however well intentioned'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'Like the hypocrite with the beam in his or her eye who is blinded to their own weaknesses, the blind leader causes harm instead of good because he or she believes that they are capable of doing that which they are incapable of, thus leading the others to fall no matter how well intentioned'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'The blind-guide saying does not condemn all who lead, only those without proper authority; the fault is lack of discernment of one’s own state'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'this parable is not a condemnation of all those who lead. … Not all leaders are hypocrites, but only those who lack proper authority. Thus the hypocrisy is not so much in the act itself but in the lack of discernment concerning one’s own state'
  - where: 'note 7:12 “The golden rule, said positively”'
    claim: 'In Luke 6:31–35 Jesus carries the reciprocal principle into a vertical relation with God'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'In verses 32–34, Jesus takes this idea to a new level and introduces a reciprocal, vertical relationship between man and God.'
  - where: 'note 7:12 “The golden rule, said positively”'
    claim: 'Whether others reciprocate mercy or not, God will'
    key: frederick-merciful
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/your-father-also-merciful'
    quote: 'Whether other people reciprocate our mercy or not, God always will.'
  - where: 'note 7:12 “The golden rule, said positively”'
    claim: 'Matthew’s “Therefore” ties the rule to asking and receiving; living it may qualify a person to ask and receive'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'By conjunctively using “Therefore” (Matthew 7:12), Jesus connects the rule with his preceding theme, “Ask, and it shall be given you; . . . knock, and it shall be opened unto you” (Matthew 7:7–11). Connecting requests for divine assistance with the Golden Rule may infer that living the Golden Rule qualifies us to worthily ask and receive.'
  - where: 'note 7:21 “Saying the name is not enough”'
    claim: 'Luke 6:46–49 is Luke’s version of the warning of Matthew 7:21'
    key: millet-fruits
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/their-fruits-ye-shall-know-them'
    quote: 'Luke’s version of the Savior’s words are similarly chilling:'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'Luke’s wise man digs deep until he finds the stone; the foolish builds on the surface'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'Luke’s version describes in detail the proactive nature of the wise man as he digs deep until he finds the stone necessary for the foundation. The foolish man, on the other hand, does not dig for a foundation but instead places his house directly on the surface of the earth.'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'In Matthew the wise man builds directly upon the rock; in Luke he digs down to bedrock'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'Matthew gives another version of this parable, in which the wise man does not dig down to the bedrock but builds directly upon the rock'
