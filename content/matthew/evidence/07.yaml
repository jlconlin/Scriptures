    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-some-well-intentioned-people-will-be-told-to-depart'
    quote: 'While the word “know” may not seem particularly significant, it may often be related to covenantal language.'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'The Greek reads “the rock,” a specific rock'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'Although this meaning is hidden in the King James Version, it becomes clear that Jesus has a specific rock in mind that He desires the people to build upon.'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'The footnote: GR the rock'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'the rock. 3 Ne. 11:39 (39–40).'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'The Lord is called the rock in the Psalms; Helaman and Moses 7:53 use the image of Christ'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'In the Old Testament, both the Lord and the temple are described using the imagery of the rock, as seen in various titles given to the Lord in the Psalms … And to Enoch the Lord declared, “I am Messiah, the King of Zion, the Rock of Heaven'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'The KnoWhy’s twofold reading: the Lord, and covenants made in the temple'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'Jesus may have had a twofold meaning in mind: in order to find true and lasting protection in life, we must (1) ensure our foundations are built on the Lord Jesus Christ, which foundation can (2) be built through covenants made in the holy temple.'
  - where: 'note 7:24 “Upon the rock”'
    claim: 'Torrential rains and flash floods were common in the region'
