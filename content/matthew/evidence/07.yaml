chapter: 7
claims:
  - where: when
    claim: 'The sermon was given in Galilee'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'The Sermon on the Mount was delivered in Galilee.'
  - where: setting
    claim: 'Matthew 7:28’s “when Jesus had ended these sayings” is the formula closing each of Matthew’s five discourses'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'At the end of each of the first four discourses, he added, “And it came to pass, when Jesus had ended these” sayings, teachings, or parables'
  - where: setting
    claim: 'The Sermon at the Temple in 3 Nephi is a version of the Sermon on the Mount given to the Book of Mormon peoples'
    key: sc-knowhy-205
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-some-well-intentioned-people-will-be-told-to-depart'
    quote: 'As Jesus Christ continued to present his “Sermon at the Temple,” a version of the Sermon on the Mount (Matthew 5–7) that He gave to the Book of Mormon peoples'
  - where: setting
    claim: 'Joseph Smith revised the Sermon on the Mount between 8 March and 7 April 1831'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'The work on the Sermon on the Mount text in Matthew was accomplished between 8 March and 7 April 1831.'
  - where: setting
    claim: 'JST Matthew 7:1 makes the chapter words the disciples are to say to the people'
    key: jst-matt-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/7?lang=eng'
    quote: 'Now these are the words which Jesus taught his disciples that they should say unto the people.'
  - where: setting
    claim: 'In the JST the sayings become a charge to disciples, an early version of the commission to preach to the world'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'They were to call “the world” to repentance and preach the coming of the kingdom of heaven—an early version of the divine commission to preach the gospel to the world'
  - where: setting
    claim: 'Luke’s Sermon on the Plain may be a separate sermon to a different audience'
    key: sc-knowhy-659
    url: 'https://scripturecentral.org/knowhy/how-can-we-build-our-foundations-on-a-rock'
    quote: 'these parables may well derive from two separate sermons delivered by Jesus on different occasions to varying audiences, in different locations, and for different purposes.'
  - where: thread
    claim: 'Discernment between appearance and reality runs through the sermon’s closing teachings'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'This gift is valuable in a world of appearances in which we must discern between good and evil, light and darkness.'
  - where: thread
    claim: 'The closing choice is between the way things appear and the way they are; discernment is a central theme'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'the choice is ultimately between the way things appear to be and the way things really are. … Thus the need to gain discernment is woven throughout the fabric of the sermons and emerges as one of the central themes of Christ’s message.'
  - where: section 1 plain
    claim: '“Mote” rendered as a speck'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'speck, chip, or splinter'
  - where: section 1 plain
    claim: '“Beam” rendered as a beam of a house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'The Greek word refers to a wooden beam used in constructing houses.'
  - where: section 2 plain
    claim: '“Being evil” rendered as “although you are wicked”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'although you are wicked'
  - where: section 3 plain
    claim: '“Strait” rendered as narrow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'narrow; see also 2 Ne. 31:17–21'
  - where: section 4 plain
    claim: '“Iniquity” rendered as lawlessness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'lawlessness'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'JST Matthew 7:2: judge not unrighteously, but judge righteous judgment'
    key: jst-matt-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/7?lang=eng'
    quote: 'Judge not unrighteously, that ye be not judged; but judge righteous judgment.'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'Elder Oaks: two kinds of judging, final and intermediate'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'There are two kinds of judging: final judgments, which we are forbidden to make, and intermediate judgments, which we are directed to make, but upon righteous principles.'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'A final judgment is presumed when one declares a person bound for hell or heaven'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'we presume to make final judgments whenever we proclaim that any particular person is going to hell (or to heaven) for a particular act or as of a particular time.'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'The Lord judges by a person’s circumstances, motives and actions across a whole life; mortals lack that knowledge'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'we must refrain from making final judgments on people because we lack the knowledge and the wisdom to do so. … to judge on the basis of that person’s circumstances, motives, and actions throughout his or her entire life'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'Intermediate judgments are essential to moral agency; the Savior made them, as in rebuking the scribes and Pharisees'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'These judgments are essential to the exercise of personal moral agency.'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'The Savior’s intermediate judgments include rebuking the scribes and Pharisees for hypocrisy'
    key: oaks-judge-not
    url: 'https://www.churchofjesuschrist.org/study/ensign/1999/08/judge-not-and-judging?lang=eng'
    quote: 'when He rebuked the scribes and Pharisees for their hypocrisy (see Matt. 15:1–9; Matt. 23:1–33)'
  - where: 'note 7:1 “Which judging is forbidden”'
    claim: 'The footnote to “Judge” points to Alma 41:14–15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'Judge not unrighteously, that ye be not judged; but judge righteous judgment. Alma 41:14 (14–15)'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'JST Matthew 7:6–8: the disciples are to put the question to scribes, Pharisees, priests and Levites'
    key: jst-matt-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/7?lang=eng'
    quote: 'Beholdest thou the scribes, and the Pharisees, and the priests, and the Levites? They teach in their synagogues, but do not observe the law, nor the commandments'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'Priests served as judges, from local courts to the Sanhedrin presided over by the chief priests'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'One of the official responsibilities of priests under the law of Moses was to serve as judges of religious and civic matters.'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'Priests taught in synagogues (the Theodotos inscription)'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'Archaeological evidence indicates that priests also performed their teaching responsibilities in local synagogues.'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'Jesus may have seen priestly judgments as hypocritical given their own conduct'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'he may have viewed their judgments against the religious activities of others to be hypocritical in light of their own pandering to Rome, their involvement in power politics, and their extravagant lifestyles.'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'The teaching on judgment had broad application'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'As with his sayings on wealth, Jesus’ teachings on judgment and hypocrisy had broad application.'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'No manuscript has the additions; they are historically fitting and may reflect Jesus’s views'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'Because ancient manuscripts of the New Testament do not contain material similar to the JST additions, it is difficult (though not impossible) to claim that these particular additions are a restoration of the original biblical text.'
  - where: 'note 7:3 “Whom the beam was aimed at”'
    claim: 'It is reasonable to hold the JST reflects Jesus’s historical views even if not recorded by Matthew in the sermon'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'It is therefore reasonable to claim that Jesus’ condemnation of priests in the JST reflects his historical views on these issues, even if they may not have been originally recorded in the Gospel of Matthew as part of the Sermon on the Mount.'
  - where: 'note 7:6 “Holy things, dogs and swine”'
    claim: 'Swine the paradigm of the unclean; dogs scavengers excluded from sacred precincts'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'swine were the paradigmatic symbol for “unclean” things in ancient Judaism (Leviticus 11:7; Deuteronomy 14:8; Matthew 8:28–34), and dogs were scavengers often singled out for exclusion from Israel’s sacred precincts'
  - where: 'note 7:6 “Holy things, dogs and swine”'
    claim: 'JST Matthew 7:9–11: preach repentance; keep the mysteries; the world cannot receive what the disciples cannot bear'
    key: jst-matt-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/7?lang=eng'
    quote: 'Go ye into the world, saying unto all, Repent, for the kingdom of heaven has come nigh unto you. And the mysteries of the kingdom ye shall keep within yourselves … For the world cannot receive that which ye, yourselves, are not able to bear'
  - where: 'note 7:6 “Holy things, dogs and swine”'
    claim: 'A general application: do not share sacred teachings with the unprepared'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'A general application of this saying may be to not share sacred teachings or practices with unprepared, uninitiated, or unworthy outsiders.'
  - where: 'note 7:6 “Holy things, dogs and swine”'
    claim: '“The holy things” were sacrificial meat eaten by priests'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: '“the holy things” (Hebrew qodashim; Greek to hagion) refer to animals sacrificed in the temple and consumed by the priests'
  - where: 'note 7:6 “Holy things, dogs and swine”'
    claim: 'Dogs kept from the temple lest they eat sacrificial meat; rent meat unfit; Jesus turning priestly law into a condemnation'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'dogs were not allowed near the temple precincts for the fear that they might devour the flesh of a sacrificial animal that had been set apart for the consumption of the priests.'
  - where: 'note 7:6 “Holy things, dogs and swine”'
    claim: 'Torn meat unfit for a holy meal; the saying turns priestly purity law into a condemnation of the priests'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'Because torn meat was considered unfit for a holy meal, it was buried to keep it from scavenging dogs. … this statement seems to be Jesus’ way of turning a legal discussion of priestly purity into a condemnation of the priests’ immorality.'
  - where: 'note 7:6 “Holy things, dogs and swine”'
    claim: 'Priests compromising holy things with Rome would be torn by the loss of the temple; not the only interpretation'
    key: grey-priests-levites
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/beholdest-thou-priests-levites'
    quote: 'by compromising their “holy things” with the Roman world (the “dogs” and “swine”), the priests themselves would soon be devastated (“rent” or “torn”) by the loss of Judaism’s sacred centerpiece at the hands of those Gentiles. While this is not the only interpretation of the passage'
  - where: 'note 7:7 “Given by whom?”'
    claim: 'The divine passive leaves the actor unnamed and allows God, the Savior and human participation'
    key: bowen-thy-will
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/thy-will-be-done'
    quote: 'In these cases no subject is identified in the sentence. … The ambiguity of the divine passive allows readers to recognize multiple actors: God the Father, the Savior himself, and our own participation to bring about their purposes.'
  - where: 'note 7:7 “Given by whom?”'
    claim: 'Ask, seek, knock and their rewards rise in intensity; the reward clauses are divine passives'
    key: bowen-thy-will
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/thy-will-be-done'
    quote: 'The “request” verbs occur in order of increasing intensity: “ask, . . . seek, . . . knock.” The reward clauses are also in order of increasing intensity'
  - where: 'note 7:7 “Given by whom?”'
    claim: 'Nephi’s 2 Nephi 32:4 uses asking and knocking for being brought into the light'
    key: bowen-thy-will
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/thy-will-be-done'
    quote: 'These suppositions are supported by Nephi’s assertion, “if ye cannot understand, . . . it will be because ye ask not, neither do ye knock; wherefore, ye are not brought into the light, but must perish in the dark” (2 Nephi 32:4'
  - where: 'note 7:7 “Given by whom?”'
    claim: 'JST 7:12 names the giver: “Ask of God”'
    key: jst-matt-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/7?lang=eng'
    quote: 'Jesus teaches His disciples that the Father gives revelation to all who ask. … Say unto them, Ask of God; ask, and it shall be given you'
  - where: 'note 7:9 “The son at his father’s door”'
    claim: 'JST 7:14–15: the disciples foresee the answer “we are righteous… God will not hear us… we have the law”'
    key: jst-matt-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/7?lang=eng'
    quote: 'They will say unto us, We ourselves are righteous, and need not that any man should teach us. God, we know, heard Moses and some of the prophets; but us he will not hear.'
  - where: 'note 7:9 “The son at his father’s door”'
    claim: 'JST 7:15, 17: “We have the law”; the son standing outside asks to come in and sup'
    key: jst-matt-7
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/7?lang=eng'
    quote: 'Father, open thy house that I may come in and sup with thee, will not say, Come in, my son; for mine is thine, and thine is mine?'
  - where: 'note 7:9 “The son at his father’s door”'
    claim: 'The JST adds the disciples’ question and Jesus’s answer, the setup of the bread-and-stone saying'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'Given their charge to teach everyone, the disciples raised concerns about the message'
  - where: 'note 7:9 “The son at his father’s door”'
    claim: '“Being evil”: although you are wicked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'although you are wicked'
  - where: 'note 7:12 “The golden rule, said positively”'
    claim: '“The law and the prophets” named the whole of Hebrew scripture'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'Thus “the law and the prophets” was basically a twofold designation of the sum of Hebrew scripture.'
  - where: 'note 7:12 “The golden rule, said positively”'
    claim: 'Connected with Matthew 5:17, the rule reaffirms the basic principles of the law of Moses'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'when connected with Jesus’ earlier clarification that he came not “to destroy the law, or prophets” but to fulfill them (Matthew 5:17–18), the Golden Rule reaffirms that the basic principles of the law of Moses remain in effect.'
  - where: 'note 7:12 “The golden rule, said positively”'
    claim: 'Earlier Jewish statements of the rule (Tobit, Hillel) were negative; Hillel called it the whole Torah'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'The book of Tobit (compiled near end of second century BC) explains, “And what you hate, do not do to anyone” (4:15; NRSV). [10] And Hillel, a prominent first-century B.C. rabbi, said, “What is hateful to you, do not do to your neighbour: that is the whole Torah'
  - where: 'note 7:12 “The golden rule, said positively”'
    claim: 'Jesus’s form is positive and not tied to an exchange of favors'
    key: marlowe-golden-rule
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/golden-rule'
    quote: 'Instead of emphasizing not doing, his iteration of the rule invites us to consider how we want to be treated and then act that way toward others. … application of the Golden Rule is no longer tethered to an exchange but rather approximates God’s love.'
  - where: 'note 7:13 “The gate Nephi named”'
    claim: 'The footnote glosses “strait” as narrow and points to 2 Nephi 31:17–21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'narrow; see also 2 Ne. 31:17–21'
  - where: 'note 7:13 “The gate Nephi named”'
    claim: '2 Nephi 31:17: the gate is repentance and baptism'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/31?lang=eng'
    quote: 'For the gate by which ye should enter is repentance and baptism by water; and then cometh a remission of your sins by fire and by the Holy Ghost.'
  - where: 'note 7:15 “Wolves dressed as sheep”'
    claim: 'Paul echoed the warning to the Ephesian elders about thirty years later'
    key: sc-knowhy-527
    url: 'https://scripturecentral.org/knowhy/why-must-we-beware-wolves-in-sheeps-clothing'
    quote: 'The Apostle Paul would echo this warning about thirty years later when speaking to the Elders of the Church of Ephesus'
  - where: 'note 7:15 “Wolves dressed as sheep”'
    claim: 'Book of Mormon figures fulfilled the warning by exploiting differences to scatter the flock; such wolves come from within and without'
    key: sc-knowhy-527
    url: 'https://scripturecentral.org/knowhy/why-must-we-beware-wolves-in-sheeps-clothing'
    quote: 'These cunning people exaggerated differences and exploited tensions to mask their true intentions as they sought to redirect and scatter the flock.'
  - where: 'note 7:15 “Wolves dressed as sheep”'
    claim: 'Wolves today come from within and without the Church'
    key: sc-knowhy-527
    url: 'https://scripturecentral.org/knowhy/why-must-we-beware-wolves-in-sheeps-clothing'
    quote: '“wolves in sheep’s clothing” populate today’s world, and they can come both from within and without the Church.'
  - where: 'note 7:15 “Wolves dressed as sheep”'
    claim: 'True prophets are known by their fruits: their lives, works and doctrine'
    key: millet-fruits
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/their-fruits-ye-shall-know-them'
    quote: 'true prophets could be known by their fruits—by the goodness of their lives and their works and the sweetness of their doctrine.'
  - where: 'note 7:15 “Wolves dressed as sheep”'
    claim: 'The false prophet looks like a disciple; telling the difference requires knowing what really is'
    key: belnap-wise-man
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/wise-man-built-his-house-upon-rock'
    quote: 'like the need to discern the false prophet who looks like a disciple, or the corrupt fruit which may appear like the good, requires knowledge of what is truth, that which really is.'
  - where: 'note 7:21 “Saying the name is not enough”'
    claim: 'The passage is hard because those told to depart seem to have done good works in His name'
    key: sc-knowhy-205
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-some-well-intentioned-people-will-be-told-to-depart'
    quote: 'This passage is, for many readers, difficult to comprehend, as the people who will be told to depart had apparently been doing good works in the name of the Lord, as would be characteristic of faithful believers.'
  - where: 'note 7:21 “Saying the name is not enough”'
    claim: 'Likely aimed at those who broke covenants or acted in God’s name illegitimately'
    key: sc-knowhy-205
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-some-well-intentioned-people-will-be-told-to-depart'
    quote: 'It is likely that Jesus was directing His comments specifically towards those who were associated with the temple but who had apostatized from correct practice because they had broken their covenants and/or were acting in God’s name illegitimately.'
  - where: 'note 7:21 “Saying the name is not enough”'
    claim: 'Psalm 6:8 and Hosea 8:1–2 lie behind the words'
    key: sc-knowhy-205
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-some-well-intentioned-people-will-be-told-to-depart'
    quote: 'The last part of 3 Nephi 14:23/Matthew 7:23 echoes the words of Psalm 6:8: “Depart from me, all ye workers of iniquity.” Hosea 8:1–2 uses language similar to that of 3 Nephi 14/Matthew 7'
  - where: 'note 7:21 “Saying the name is not enough”'
    claim: '“Iniquity” is lawlessness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'lawlessness'
  - where: 'note 7:21 “Saying the name is not enough”'
    claim: 'Discipleship is more than saying the good word, even to the Master'
    key: millet-fruits
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/their-fruits-ye-shall-know-them'
    quote: 'Discipleship entails much more than saying the good word, even saying the good word to the Master.'
  - where: 'note 7:23 “Who did not know whom”'
    claim: 'JST Matthew 7:33 reads “Ye never knew me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/7?lang=eng'
    quote: 'And then will I say, Ye never knew me'
  - where: 'note 7:23 “Who did not know whom”'
    claim: 'Elder Bednar on the change from “I never knew you” to “Ye never knew me”'
    key: bednar-known-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2016/10/if-ye-had-known-me?lang=eng'
    quote: 'the Lord’s phrase reported in the King James Version of the Bible, “I never knew you,” was changed in the Joseph Smith Translation to “Ye never knew me.”'
  - where: 'note 7:23 “Who did not know whom”'
    claim: 'The same change in the parable of the ten virgins'
    key: bednar-known-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2016/10/if-ye-had-known-me?lang=eng'
    quote: 'the phrase “I know you not,” as reported in the King James Version of the Bible, was clarified in the Joseph Smith Translation to “Ye know me not.”'
  - where: 'note 7:23 “Who did not know whom”'
    claim: 'Four steps to know the Lord: faith, following, serving, believing'
    key: bednar-known-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2016/10/if-ye-had-known-me?lang=eng'
    quote: 'Four essential steps that can help us come to know the Lord are exercising faith in Him, following Him, serving Him, and believing Him.'
  - where: 'note 7:23 “Who did not know whom”'
    claim: '“Know” is often covenant language in scripture (Amos 3:2)'
