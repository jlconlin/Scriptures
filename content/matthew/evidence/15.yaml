chapter: 15
claims:
  - where: when
    claim: 'The delegation came shortly after a Passover, probably by a plan of the rulers in Jerusalem'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Shortly after the Passover to which allusion has been made, and probably in accordance with a plan decided upon by the Jewish rulers, Jesus was visited by a delegation of Pharisees and scribes who had come from Jerusalem'
  - where: setting
    claim: 'The delegation from Jerusalem probably came by a plan of the rulers'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'probably in accordance with a plan decided upon by the Jewish rulers, Jesus was visited by a delegation of Pharisees and scribes who had come from Jerusalem'
  - where: setting
    claim: 'The journey to Tyre and Sidon is the one recorded time Jesus went outside the land of Israel'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'the one recorded exception to that self-imposed law of His ministry which kept Him within the limits of the land of Israel.'
  - where: setting
    claim: 'From Tyre and Sidon Jesus went to the region east of the lake, the Decapolis, among semi-pagan (partly pagan) peoples'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'They went thence into the region adjoining the sea of Galilee on the east, “through the midst of the coasts of Decapolis.” Though still among semi-pagan peoples, our Lord was greeted by great crowds'
  - where: setting
    claim: 'Only Matthew has the lost sheep saying in the Canaanite woman story'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'unlike Mark, in the story of the healing of the Canaanite woman’s daughter, Matthew includes Jesus’ statement, “I am not sent but unto the lost sheep of the house of Israel” (Matthew 15:24).'
  - where: setting
    claim: 'Only Matthew has the plea to the Son of David and the praise of her faith'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'only Matthew records the woman’s plea that Jesus “have mercy on me, O Lord, thou Son of David” (Matthew 15:22) and Jesus’ declaration “O woman, great is thy faith” (Matthew 15:28).'
  - where: thread
    claim: 'The Canaanites were held in particular disrepute'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'we know that among the peoples so classed the Canaanites were held in particular disrepute by the Jews.'
  - where: thread
    claim: 'Ritual defilement could come from contact with Gentiles in the market'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'What the Pharisees insisted on was not cleanliness as such, but the avoidance of ceremonial pollution. They shrank not from dirt, but from defilement. If they had been in the market, they might have come in contact with the heathen or the publican.'
  - where: thread
    claim: 'The journey to Tyre acted out the teaching: Gentile land no more defiling than Capernaum; compare Peter at Joppa'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'We may see a relation between the two acts not unlike that which afterwards connected the vision of Peter at Joppa with his entry into the house of Cornelius at Cæsarea. … The dust of the heathen cities was not more defiling than that of Capernaum.'
  - where: section 1 plain
    claim: '“Draught” means a drain or sewer'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'The word is used in its old English meaning, as equivalent to drain, sewer, cesspool (see 2Kings 10:27).'
  - where: section 2 plain
    claim: '“Coasts” means borders or regions, not seashore'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'is used to connote boundary, limit, or border, and not distinctively a seashore.'
  - where: 'note 15:2 “Washing hands: holiness, not hygiene”'
    claim: 'The Pharisees sought to bring the temple’s holiness into every home'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'While other Jews of this time believed that these regulations in Leviticus applied only to the priests in the temple, the Pharisees’ goal was to bring the holiness of the temple into every home through applying these laws more broadly.'
  - where: 'note 15:2 “Washing hands: holiness, not hygiene”'
    claim: 'Hence the washing of hands and vessels to make meals ritually pure'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'It led the Pharisees to focus on the purification of vessels and the washing of hands to make the meals ritually pure.'
  - where: 'note 15:2 “Washing hands: holiness, not hygiene”'
    claim: 'The charge was ceremonial uncleanness, not dirt'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It should be borne in mind that the offense charged against the disciples was that of ceremonial uncleanness, not physical uncleanliness or disregard of sanitary propriety'
  - where: 'note 15:2 “Washing hands: holiness, not hygiene”'
    claim: 'The later rabbinic sages held their traditions to be in continuity with the law of Moses (Mishnah Avot 1:1)'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'This is most clearly laid out in the mishnaic tractate Avot, or “Fathers,” … “Moses received the Law from Sinai, and transmitted it to Joshua. Joshua [transmitted it] to the Elders, the Elders to the Prophets.'
  - where: 'note 15:2 “Washing hands: holiness, not hygiene”'
    claim: 'Jesus’s objection is not to tradition as such but to tradition that sets aside God’s commandment'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'In this instance, the problem for Jesus is not the traditions per se, but rather in the use of that tradition to turn aside the specific commandment of God.'
  - where: 'note 15:5 ““It is a gift”: the vow called corban”'
    claim: 'Corban: dedicated to God; the word made a binding vow, held above duty to parents'
    key: bd-corban
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/corban?lang=eng'
    quote: 'The utterance of it was held to constitute a binding vow, and the fulfillment of a vow was regarded by the Pharisees as of deeper obligation than the duty even to parents.'
  - where: 'note 15:5 ““It is a gift”: the vow called corban”'
    claim: 'Qorban first meant a sacrificial gift, later a vow or offering'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'which originally referred to a sacrificial gift, but by the Second Temple period had come to mean a vow or offering.'
  - where: 'note 15:5 ““It is a gift”: the vow called corban”'
    claim: 'Jesus allows the oral law, but not over the written law'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'Jesus allows for the oral law, but not at the expense of the written law.'
  - where: 'note 15:5 ““It is a gift”: the vow called corban”'
    claim: 'The donor might keep possession of what he declared corban'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'would eventually be turned over to the officials, though the donor might continue to hold possession during a specified period, extending even to the end of his life.'
  - where: 'note 15:5 ““It is a gift”: the vow called corban”'
    claim: 'Read together, Exodus 20:12 and 21:17 probably make failing to honor parents into cursing them, a capital offense'
    key: bowen-jewish-hermeneutics
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/jewish-hermeneutics-new-testament-period'
    quote: 'the Pharisees were at once failing to honor their parents, a grievous sin of omission, and actively cursing their parents, an even worse sin of commission and a capital offense.'
  - where: 'note 15:8 “Isaiah’s rebuke, in the words Jesus quoted”'
    claim: 'The Greek Isaiah 29:13 reads “in vain do they worship me, teaching the commandments and doctrines of men”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/29.htm'
    quote: 'This people draw nigh to me with their mouth, and they honour me with their lips, but their heart is far from me: but in vain do they worship me, teaching the commandments and doctrines of men.'
  - where: 'note 15:8 “Isaiah’s rebuke, in the words Jesus quoted”'
    claim: 'Isaiah describes a people who seem to want holiness but whose hearts are wrong; the version Jesus quotes is sharper on false worship'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'the Lord describes a people who appear to want holiness, but their hearts and their understanding are not right with God. … In the version of Isaiah that Jesus quotes, the critique on false worship is particularly strong'
  - where: 'note 15:8 “Isaiah’s rebuke, in the words Jesus quoted”'
    claim: 'The Hebrew-based KJV of Isaiah 29:13 reads “their fear toward me is taught by the precept of men”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/29?lang=eng'
    quote: 'but have removed their heart far from me, and their fear toward me is taught by the precept of men:'
  - where: 'note 15:8 “Isaiah’s rebuke, in the words Jesus quoted”'
    claim: 'The Lord quoted the verse to Joseph Smith in 1820'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: '“they draw near to me with their lips, but their hearts are far from me, they teach for doctrines the commandments of men, having a form of godliness, but they deny the power thereof.”'
  - where: 'note 15:11 “What really defiles”'
    claim: 'The saying publicly refuted the authority on which the Pharisees’ holiness rested'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'Jesus also directly and publicly refutes the authority and interpretation around which the Pharisees’ understanding of holiness was built.'
  - where: 'note 15:11 “What really defiles”'
    claim: 'Food passes through; evil words from the heart truly defile'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'the food that enters the body through the mouth is of small and transient importance compared with the utterances that issue from the mouth, for these, if evil, are truly defiling.'
  - where: 'note 15:11 “What really defiles”'
    claim: 'The principle in its tendency reached the clean and unclean meats; Peter still kept them after Pentecost (Acts 10:14)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'in its ultimate tendency. swept away the whole Levitical system of ceremonial purity—the distinction between clean and unclean meats and the like. … Even after the day of Pentecost, Peter still prided himself on the observance of the Law which was thus annulled'
  - where: 'note 15:22 “A Canaanite who calls Him Son of David”'
    claim: 'Phoenicians were of Canaanite descent, so Mark and Matthew agree; Canaanites held in disrepute'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Matthew says she was “a woman of Canaan”; these statements are in harmony, since the Phenicians were of Canaanite descent. The Gospel-historians make clear the fact that this woman was of pagan or heathen birth; and we know that among the peoples so classed the Canaanites were held in particular disrepute by the Jews.'
  - where: 'note 15:22 “A Canaanite who calls Him Son of David”'
    claim: '“Canaan” was used specifically of Phoenicia'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'were used more specifically of Phœnicia and its inhabitants (Exodus 3:8; Exodus 3:17; Ezra 9:1, and elsewhere), and are employed here with that meaning.'
  - where: 'note 15:22 “A Canaanite who calls Him Son of David”'
    claim: 'Tyre and Sidon: the one recorded journey outside the land of Israel'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'the one recorded exception to that self-imposed law of His ministry which kept Him within the limits of the land of Israel.'
  - where: 'note 15:22 “A Canaanite who calls Him Son of David”'
    claim: 'Calling Him Son of David showed she believed Him the Messiah of Israel'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The fact that she addressed Jesus as Son of David demonstrates her belief that He was the Messiah of Israel.'
  - where: 'note 15:22 “A Canaanite who calls Him Son of David”'
    claim: 'Only Matthew has the plea to the Son of David and “great is thy faith”'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'only Matthew records the woman’s plea that Jesus “have mercy on me, O Lord, thou Son of David” (Matthew 15:22) and Jesus’ declaration “O woman, great is thy faith” (Matthew 15:28).'
  - where: 'note 15:24 “Sent first to the lost sheep of Israel”'
    claim: 'The disciples’ request was probably an intercession for her'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Their intervention was probably an intercession in her behalf; she could be quieted by the granting of her request'
  - where: 'note 15:24 “Sent first to the lost sheep of Israel”'
    claim: 'Only Matthew has this saying and the charge to the Twelve in 10:5–6'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Matthew is the only Gospel writer to include Jesus’ instruction to the Apostles that they were to “go not into the way of the Gentiles, and into any city of the Samaritans enter ye not: but go rather to the lost sheep of the house of Israel” (Matthew 10:5–6).'
  - where: 'note 15:24 “Sent first to the lost sheep of Israel”'
    claim: 'His mortal ministry was directed to Israel; the risen Christ to every nation; the delay showed her faith and taught the disciples'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'by the course He adopted, the woman’s faith was demonstrated and the disciples were instructed. … The resurrected Christ was to be made known to every nation; but His personal ministry as a mortal, as also that of the apostles while He was with them in the flesh, was directed to the house of Israel.'
  - where: 'note 15:24 “Sent first to the lost sheep of Israel”'
    claim: 'The sheep to be gathered were of the house of Israel, not Gentiles'
    key: sc-knowhy-207
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-there-were-other-sheep-who-would-hear-his-voice'
    quote: 'It indicates that, for Jesus, the “sheep” in need of gathering together were not gentiles, but people from “the house of Israel.”'
  - where: 'note 15:24 “Sent first to the lost sheep of Israel”'
    claim: 'The Gentiles would not hear His voice in person but by the Holy Ghost (footnote 24a points here)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'they understood me not that the Gentiles should not at any time hear my voice—that I should not manifest myself unto them save it were by the Holy Ghost.'
  - where: 'note 15:26 “Dogs, or little dogs of the house”'
    claim: 'Kunarion is the diminutive of kyōn, a little dog'
    key: thayer
    url: 'https://biblehub.com/greek/2952.htm'
    quote: 'κυνάριον, κυναριου, τό (diminutive of κύων, … ),a little dog: Matthew 15:26; Mark 7:27f'
  - where: 'note 15:26 “Dogs, or little dogs of the house”'
    claim: 'Not the despised street curs but little house dogs under the table; she took no offense and turned the analogy'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'not the vagrant and despised curs elsewhere spoken of in the Bible as typical of a degraded state, or of positive badness, but literally the “little dogs” or domestic pets, such as were allowed in the house and under the table.'
  - where: 'note 15:26 “Dogs, or little dogs of the house”'
    claim: 'She adopted the analogy as argument and plea'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Certainly the woman took no offense at the comparison, and found therein no objectionable epithet. Instantly she adopted the analogy, and applied it in combined argument and supplication.'
  - where: 'note 15:26 “Dogs, or little dogs of the house”'
    claim: 'His words prefigured the gospel to Jew and Gentile; “Let the children first be filled”'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'but His words prefigured the giving of the gospel to all, both Jew and Gentile: “Let the children first be filled” He had said.'
  - where: 'note 15:28 “The faith of a Gentile”'
    claim: 'The centurion and the Canaanite woman prepare for the shift to the Gentile mission; Gentiles at times have more faith'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Yet Matthew has prepared his readers for the shift in missionary emphasis with his accounts of the healings of the centurion’s servant and the Canaanite woman’s children.'
  - where: 'note 15:28 “The faith of a Gentile”'
    claim: 'Matthew emphasizes that Gentiles at times have more faith than the covenant people'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Thus, Matthew emphasizes that at times Gentiles have more faith than the covenant people and will participate in the eschatological feast when many of the house of Israel will miss out.'
  - where: 'note 15:28 “The faith of a Gentile”'
    claim: 'The closing commission to all nations contrasts with the charge to the lost sheep'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'This passage is in stark contrast to Jesus’ command to the Apostles to go to “the lost sheep of the house of Israel” (Matthew 10:6).'
  - where: 'note 15:28 “The faith of a Gentile”'
    claim: 'Her persistence: faith that overcomes obstacles and endures discouragement'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The woman’s commendable persistency was based on the faith that overcomes apparent obstacles and endures even under discouragement.'
  - where: 'note 15:31 “Gentiles who praised Israel’s God”'
    claim: 'The crowds east of the lake were semi-pagan; these aliens (outsiders to Israel) glorified the God of Israel'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Though still among semi-pagan peoples, our Lord was greeted by great crowds, amongst whom were many lame, blind, dumb, maimed, and otherwise afflicted; and them He healed. Great was the astonishment of these aliens'
  - where: 'note 15:31 “Gentiles who praised Israel’s God”'
    claim: 'Decapolis: the ten cities, a region mostly east of the Jordan and south of the lake'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The name means “the ten cities,” and was applied to a region of indefinite boundaries lying mostly on the east of Jordan and southerly from the sea of Galilee.'
  - where: 'note 15:37 “A second feeding, not the first told again”'
    claim: 'The numbers, the three days, the loaves and the baskets all differ from the five thousand'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'The number of the people fed, their three days’ waiting till their food was exhausted, the number of the loaves at hand, and of the baskets in which the fragments were collected after the meal, are all different.'
  - where: 'note 15:37 “A second feeding, not the first told again”'
    claim: 'The basket words differ: spuris a large hamper (Acts 9:25), kophinos a smaller hand basket; Jesus distinguishes the two in 16:9–10'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'Here the word is σπνρις (spuris), the hamper in which provisions were packed as for a party travelling together, large enough, as in St. Paul’s escape from Damascus (Acts 9:25), to hold a man; while in the other it was the κόφινος (cophinus), or smaller basket, which a man carried in his hand.'
  - where: 'note 15:37 “A second feeding, not the first told again”'
    claim: 'The miracle arises from compassion, not a challenge'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/15.htm'
    quote: 'the display of miraculous power in its highest form originates not in answer to a challenge, or as being offered as a proof of a divine mission, but simply from compassion.'
  - where: 'note 15:37 “A second feeding, not the first told again”'
    claim: 'Spuris: a reed or plaited basket, a hamper'
    key: thayer
    url: 'https://biblehub.com/greek/4711.htm'
    quote: 'a reed basket (i. e. a plaited basket, a lunch basket, hamper'
  - where: 'note 15:37 “A second feeding, not the first told again”'
    claim: 'Kophinos: a wicker basket'
    key: thayer
    url: 'https://biblehub.com/greek/2894.htm'
    quote: 'κόφινος, κοφινου, ὁ, a basket, wicker basket'
  - where: 'note 15:37 “A second feeding, not the first told again”'
    claim: 'The disciples probably remembered the first feeding but did not presume to ask for another'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Rather let us believe that the disciples remembered well, yet deemed it beyond their duty or privilege to suggest a repetition of the miracle.'
  - where: 'note 15:39 “Magdala, on the western shore”'
    claim: 'Jesus returned by boat to the western shore and landed near Magdala; Magdala and Dalmanutha were close together'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Jesus and the apostles returned by boat to the western shore of the lake, and landed near Magdala and Dalmanutha. These towns are understood to have been so close together as to virtually make the latter a suburb of the other.'
  - where: 'note 15:2 “Washing hands: holiness, not hygiene”'
    claim: 'The law’s purity rules for priests at the temple; the tradition of the elders, also called ancestral tradition'
    key: lane-hostility
    url: 'https://rsc.byu.edu/celebrating-easter/hostility-toward-jesus-prelude-passion'
    quote: 'what the Gospels refer to as “the traditions of the elders” (Matthew 15:2; Mark 7:5), also known as “ancestral tradition.”[2] A central focus of the law of Moses concerned the sacrifices in the temple and the strict rules governing the ritual purity of the priests while they officiated and ate at the temple.'
  - where: 'note 15:2 “Washing hands: holiness, not hygiene”'
    claim: 'In the rabbinic view the written and oral law have one source, God through Moses at Sinai'
    key: shannon-torah-mouth
    url: 'https://rsc.byu.edu/vol-19-no-1-2018/torah-mouth-introduction-rabbinic-oral-law'
    quote: 'In the rabbinic perspective, the written law and the oral law have the same source—God, through Moses on Mount Sinai.'
  - where: 'note 15:24 “Sent first to the lost sheep of Israel”'
    claim: 'The Nephites were among the other sheep'
    key: sc-knowhy-207
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-there-were-other-sheep-who-would-hear-his-voice'
    quote: 'When He appeared to the Nephites, He told them that they were among the “other sheep” that must be brought into the fold (3 Nephi 15:21).'
  - where: christ
    claim: 'Gentiles at times show more faith than the covenant people and will share the feast'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'Thus, Matthew emphasizes that at times Gentiles have more faith than the covenant people and will participate in the eschatological feast when many of the house of Israel will miss out.'
