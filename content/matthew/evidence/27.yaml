chapter: 27
claims:
  - where: when
    claim: 'The council brought Jesus to Pilate early on Friday morning'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'Early on Friday morning, the “whole council,” that is to say, the Sanhedrin, led Jesus, bound, to the judgment hall of Pontius Pilate'
  - where: when
    claim: 'The guard was set on Saturday, the Sabbath'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'On the day following the “preparation,” that is to say on Saturday, the Sabbath and “high-day,” the chief priests and Pharisees came in a body to Pilate'

  - where: setting
    claim: 'Mark gives the basic order of the Roman trial and Matthew follows it'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Mark, followed by Matthew, presents the basic order of events'
  - where: setting
    claim: 'Matthew adds Judas’s remorse and death; Luke adds Herod; John has a longer Roman trial'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Matthew adds an account of the remorse and suicide of Judas Iscariot. Luke provides the story of Jesus’s examination by Herod Antipas'
  - where: setting
    claim: 'The guard and seal on the tomb are only in Matthew'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'Matthew’s short treatment of the guard and seal placed upon the tomb is unique in the Gospel narratives.'

  - where: setting
    claim: 'The earthquake at Jesus’s death is Matthew’s addition'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'his reaction explained by Matthew’s addition that at Jesus’s death a sudden earthquake struck.'
  - where: setting
    claim: 'The footnotes tie the scene at Golgotha to Psalm 22 (verse 35 to Ps. 22:18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'Ps. 22:18.'
  - where: thread
    claim: 'The charge “King of the Jews” turned the trial on Jesus’s identity as the Christ; the accounts present Him as falsely judged'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the charge that the Sanhedrin lodged with Pilate against Jesus, that he was the King of the Jews, focused on his identity as the Christ.'
  - where: thread
    claim: 'The mockery derides His kingship and His right to judge'
    key: mitton-crucifixion-mockery
    url: 'https://interpreterfoundation.org/journal/the-crucifixion-as-a-mockery-witness-and-warning-of-the-judgment'
    quote: 'It is His kingship that is being derided, with its right to judge.'
  - where: thread
    claim: 'The circle around Jesus grew smaller and smaller'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'the supporting circle around Jesus gets smaller and smaller and smaller'

  - where: thread
    claim: 'The taunt at the cross, “If thou be the Son of God,” takes up the tempter’s “if” of Matt. 4:3'
    key: hunter-temptations
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/10/the-temptations-of-christ?lang=eng'
    quote: 'These, of course, were foreshadows of that final, desperate temptation which would come three years later: “If thou be the Son of God, come down from the cross.” (Matt. 27:40.)'
  - where: 'note 27:2 “Why the council needed Pilate”'
    claim: 'Older view: no Jewish tribunal could inflict death; Rome reserved it'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'no Jewish tribunal had authority to inflict the death penalty; imperial Rome had reserved this prerogative as her own'
  - where: 'note 27:2 “Why the council needed Pilate”'
    claim: 'Pilate lived at Caesarea and came to Jerusalem for the great feasts'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'it was his custom to be present in Jerusalem at the times of the great Hebrew feasts'
  - where: 'note 27:2 “Why the council needed Pilate”'
    claim: 'Newer study: Rome sometimes curtailed local executions, but it is just as likely the nearness of Passover prevented it'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'it is just as likely that the Sanhedrin could not execute anyone according to Jewish law because of the nearness of Passover'
  - where: 'note 27:2 “Why the council needed Pilate”'
    claim: 'Rome’s penalty for treason or rebellion was crucifixion'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the Roman penalty for treason or rebellion by subjects of the empire was crucifixion'
  - where: 'note 27:2 “Why the council needed Pilate”'
    claim: 'Pilate was prefect of Judea AD 26–36'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Pontius Pilate, the governor before whom Jesus was tried, was prefect of Roman Judea from AD 26–36.'
  - where: 'note 27:2 “Why the council needed Pilate”'
    claim: 'Most forces at Caesarea; one cohort of five hundred posted in Jerusalem in the Antonia beside the temple'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Most of these forces were permanently stationed at the provincial capital of Caesarea on the coast with only a single cohort of five hundred men posted in Jerusalem in the Antonian fortress next to the temple'
  - where: 'note 27:2 “Why the council needed Pilate”'
    claim: 'Pilate’s first question shows a shift from a religious charge to a political one'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'suggesting that the Jewish authorities had shifted their strategy from a religious charge to a political accusation that would more clearly fall within the governor’s competence'

  - where: 'note 27:3 “What kind of repenting?”'
    claim: 'Matthew 27:3 uses metamelomai (3338), “having regretted”'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/27-3.htm'
    quote: 'having regretted [it]'
  - where: 'note 27:3 “What kind of repenting?”'
    claim: '“Repent ye” in Matthew 3:2 is metanoeō (3340)'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/3-2.htm'
    quote: 'Metanoeite'
  - where: 'note 27:3 “What kind of repenting?”'
    claim: 'Thayer: metamelomai, properly “it is a care to one afterward”; used also in Matthew 21:29, 32'
    key: thayer
    url: 'https://biblehub.com/greek/3338.htm'
    quote: 'properly, it is a care to one afterward (see μετά, III. 2), i. e. it repents one; to repent oneself (in R. V. uniformly with this reflexive rendering (except 2 Corinthians 7:8, where regret)): Matthew 21:29, 32; Matthew 27:3'
  - where: 'note 27:3 “What kind of repenting?”'
    claim: 'Thayer: the sharp distinctions between the two verbs are hardly sustained by usage'
    key: thayer
    url: 'https://biblehub.com/greek/3338.htm'
    quote: 'the former signifies nothing but regret even though amounting to remorse, the latter that reversal of moral purpose known as repentance — seem hardly to be sustained by usage.'
  - where: 'note 27:3 “What kind of repenting?”'
    claim: 'Thayer: metanoeō is the fuller and nobler term, and is often an imperative (metamelomai never)'
    key: thayer
    url: 'https://biblehub.com/greek/3338.htm'
    quote: 'But that μετανοέω is the fuller and nobler term, expressive of moral action and issues, is indicated not only by its derivation, but by the greater frequency of its use, by the fact that it is often employed in the imperative (μεταμέλομαι never)'
  - where: 'note 27:3 “What kind of repenting?”'
    claim: 'Judas may have hoped for a reversal of the sentence; the rulers repulsed him'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'possibly he hoped that his avowal might stem the current of their malignancy, and that they would ask for a reversal of the sentence. But the rulers in Israel repulsed him with disgust.'
  - where: 'note 27:3 “What kind of repenting?”'
    claim: 'JST Matt. 27:5: “See thou to it; thy sins be upon thee”'
    key: jst-matt-27
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/27?lang=eng'
    quote: 'And they said unto him, What is that to us? See thou to it; thy sins be upon thee.'
  - where: 'note 27:3 “What kind of repenting?”'
    claim: 'Elder Holland: we are not the ones to judge Judas’s fate'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'We are not the ones to judge Judas’s fate'

  - where: 'note 27:5 “Hanged, and fell”'
    claim: 'JST Matt. 27:6 joins the two accounts of Judas’s death'
    key: jst-matt-27
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/27?lang=eng'
    quote: 'and went, and hanged himself on a tree. And straightway he fell down, and his bowels gushed out, and he died.'
  - where: 'note 27:5 “Hanged, and fell”'
    claim: 'Judas probably hanged himself and afterward fell'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'If both records be accurate, the wretched man probably hanged himself, and afterward fell, possibly through the breaking of the cord or the branch to which it was attached.'
  - where: 'note 27:5 “Hanged, and fell”'
    claim: 'The field belonged technically to Judas’s estate; the variations show independence of authorship'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'as this money had never been formally taken back by the temple officials, the field bought therewith belonged technically to the estate of Judas.'
  - where: 'note 27:5 “Hanged, and fell”'
    claim: 'The variations show independent authorship; both agree Judas died a suicide'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'The variations are of importance mainly as showing independence of authorship. The accounts agree in the essential feature, that Judas died a miserable suicide.'

  - where: 'note 27:9 “Jeremy, and the price of blood”'
    claim: 'The Church’s footnote on “potter’s” sends the reader to Zechariah 11:12–13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'Zech. 11:13 (12–13).'
  - where: 'note 27:9 “Jeremy, and the price of blood”'
    claim: 'The priests’ scruple over the money, in a council; the field set apart for burying aliens and strangers'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'in sacrilegious scrupulosity, held a solemn council to determine what they should do with the “price of blood.”'
  - where: 'note 27:9 “Jeremy, and the price of blood”'
    claim: 'The field was set apart as a burial place for strangers'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'this tract of ground they set apart as a burial place for aliens, strangers, and pagans.'

  - where: 'note 27:9 “Jeremy, and the price of blood”'
    claim: 'The Greek name Ieremias (KJV “Jeremy”) is Jeremiah'
    key: strongs-greek
    url: 'https://biblehub.com/greek/2408.htm'
    quote: 'KJV: Jeremiah'
  - where: 'note 27:11 “An answer, and then silence”'
    claim: 'Jesus’s answer means “That is what you say”; then dignified silence'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus simply acknowledges, “That is what you say” (Mark 15:2, authors’ translation; parallel Matt 27:11). After Jesus’s opponents accuse him of further, unspecified charges, Jesus responds with dignified silence'
  - where: 'note 27:11 “An answer, and then silence”'
    claim: 'JST Matt. 27:12: “Thou sayest truly; for thus it is written of me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'Thou sayest truly; for thus it is written of me.'

  - where: 'note 27:16 “Barabbas, son of the father”'
    claim: 'Whose custom the release was is unclear; it suited Passover’s theme of deliverance'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Whether this was Pilate’s own practice (Mark 15:6), possibly that of all Roman governors (Matt 27:15; Luke 23:17), or a Jewish custom that Pilate had adopted is unclear; nevertheless, freeing a prisoner certainly accorded with an important theme of Passover'
  - where: 'note 27:16 “Barabbas, son of the father”'
    claim: 'Barabbas was an insurgent, guilty of what the leaders implied of Jesus'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'he was guilty of actual insurrection against Rome, the very thing that the Jewish leadership implied Jesus was fomenting by claiming that he was the Messiah.'
  - where: 'note 27:16 “Barabbas, son of the father”'
    claim: 'Some early manuscripts of Matthew give his name as Jesus Barabbas'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'some early manuscripts of Matthew claim that his first name was actually “Jesus”'
  - where: 'note 27:16 “Barabbas, son of the father”'
    claim: 'Barabbas could be Aramaic for “son of the father” or “son of a teacher”; probably a nickname'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'The name Barabbas could be Aramaic for, among other possibilities, “son of the father” (bar ʾabbāʾ) and “son of a teacher” (bar Rabba[n]).'
  - where: 'note 27:16 “Barabbas, son of the father”'
    claim: 'Elder Holland on the irony of the name'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'So one godless “son of the father” was set free while a truly divine Son of His Heavenly Father moved on to crucifixion.'

  - where: 'note 27:19 “A dream in Pilate’s house”'
    claim: 'Pilate’s wife, receiving a dream, is like Joseph and the Magi'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'as the recipient of an inspired dream, Pilate’s wife, who in later tradition is named Claudia Procula or Procla, is in a similar category to Joseph the Carpenter and the Magi'
  - where: 'note 27:19 “A dream in Pilate’s house”'
    claim: '“Suffered many things” echoes the first passion prediction'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'echoing the very wording of the first passion prediction (see Matt 16:21)'
  - where: 'note 27:19 “A dream in Pilate’s house”'
    claim: 'She is a foil to her husband and to the leaders'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'she serves as a foil to both her husband, who reacts indecisively to Jesus, and the Jewish leaders, who actively seek his condemnation.'

  - where: 'note 27:24 “Washing his hands”'
    claim: 'The act is rooted in Jewish practice and Old Testament precedents (Deut. 21:1–9; Ps. 26:6; 73:13)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Pilate’s washing his hands seems to be rooted in Jewish practice, drawing upon Old Testament images and precedents'
  - where: 'note 27:24 “Washing his hands”'
    claim: 'A symbolic act of disclaiming responsibility'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'a symbolic act of disclaiming responsibility, which they all understood'
  - where: 'note 27:24 “Washing his hands”'
    claim: 'An act as unconscionable as it was illogical; the washed hands could not have been more stained'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'Then, in an act as unconscionable as it was illogical, Pilate “scourged Jesus, [and] delivered him to be crucified.” Pilate’s freshly washed hands could not have been more stained or more unclean.'

  - where: 'note 27:25 “His blood be on us”'
    claim: 'Pilate’s washing shifted responsibility to the crowd'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'shifting responsibility to the gathered crowd that has been calling for his crucifixion'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'The line was misused to accuse Jews of being “Christ killers”'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'which tragically allowed Christians from late antiquity to the mid-twentieth century to accuse Jews of being “Christ killers.”'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'The crowd may have been largely the chief priests’ retainers and supporters'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the crowd might have consisted primarily of a large group of retainers and other supporters of the chief priests—what is called a claque'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'At the Fortress Antonia, where tradition sets the trial, there was no space for thousands'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'there would not have been space for the crowd of thousands as popular perception usually imagines'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'Manipulating the crowd would have been easy with the disciples absent, having fled at the arrest'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Manipulating the entire crowd would not have been difficult if Jesus’s disciples were not present'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'The law of Moses rejects visiting parents’ sins on children (Deut. 24:16; Ezek. 18:20)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'a law that rejects the precept of the sins of the parents falling to subsequent generations'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'The crowd was likely a small priestly group'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'it is likely the case that the crowd was composed of a small priestly group with very few Pharisee-following Jews in attendance.'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'Theologically Jesus needed to die; all have sinned, and in a real way all are responsible'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Thus, in a very real way we are all responsible for the circumstances of that terrible day.'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'Theologically, Jesus needed to die to complete His atoning redemption'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'First, theologically, Jesus needed to die to complete his atoning act of redemption and to put him in a position to overcome death through his resurrection.'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'The Book of Mormon rebukes Gentiles who cursed the Jews'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/29?lang=eng'
    quote: 'O ye Gentiles, have ye remembered the Jews, mine ancient covenant people? Nay; but ye have cursed them, and have hated them, and have not sought to recover them.'

  - where: 'note 27:25 “His blood be on us”'
    claim: 'The more likely site was a gate of Herod’s palace'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Pilate presented Jesus to the crowd at the more likely site of Herod’s Palace at a gate that opened outside the city to the west.'
  - where: 'note 27:25 “His blood be on us”'
    claim: 'That site could hold a larger crowd, but the final sentencing was probably in the inner court, with only the leaders and their retinue'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'While this location could have accommodated larger crowds, our interpretation of John 19:13 suggests that the final sentencing that subsequently took place occurred in the expensively paved inner court of the palace, where probably only the Jewish leaders and their immediate retinue would have been admitted.'
  - where: 'note 27:29 “A mock coronation”'
    claim: 'The soldiers mocked His kingship with robe, crown and salute'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the soldiers mock his status as “king of the Jews” by dressing him in a purple cloak, crowning him with thorns, and pretending to salute him'
  - where: 'note 27:29 “A mock coronation”'
    claim: 'The abuse fulfilled prophecies in Isaiah and the Book of Mormon (Isa. 50:6; 1 Ne. 19:9)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'While these acts were meant to demean him, they also fulfilled prophecies in both Isaiah and the Book of Mormon (Isa 50:6; 53:3‒7; 1 Nephi 19:9; 2 Nephi 6:9; Mosiah 3:9).'
  - where: 'note 27:29 “A mock coronation”'
    claim: 'JST Matt. 27:30 reads purple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'purple'
  - where: 'note 27:29 “A mock coronation”'
    claim: 'Mitton reads the crucifixion as a mockery of the final judgment scene'
    key: mitton-crucifixion-mockery
    url: 'https://interpreterfoundation.org/journal/the-crucifixion-as-a-mockery-witness-and-warning-of-the-judgment'
    quote: 'The crucifixion may be understood as an inexpressibly perverse and diabolical mockery of the final judgment scene.'
  - where: 'note 27:29 “A mock coronation”'
    claim: 'Robe, reed in the right hand, mock title, crown, bended knee; thieves right and left; kingship and right to judge derided'
    key: mitton-crucifixion-mockery
    url: 'https://interpreterfoundation.org/journal/the-crucifixion-as-a-mockery-witness-and-warning-of-the-judgment'
    quote: 'Thus, the purple robe of royalty, the flimsy reed or scepter with the “reed in his right hand,”5 the mock title of kingship placed over His head, the crown of thorns, and the bended knee'
  - where: 'note 27:29 “A mock coronation”'
    claim: 'Matthew sets the sheep-and-goats judgment shortly before'
    key: mitton-crucifixion-mockery
    url: 'https://interpreterfoundation.org/journal/the-crucifixion-as-a-mockery-witness-and-warning-of-the-judgment'
    quote: 'In Matthew’s gospel, the Lord first gives the parable of the sheep and the goats with its judgment setting'
  - where: 'note 27:29 “A mock coronation”'
    claim: 'After the mockery, “All power is given unto me”'
    key: mitton-crucifixion-mockery
    url: 'https://interpreterfoundation.org/journal/the-crucifixion-as-a-mockery-witness-and-warning-of-the-judgment'
    quote: 'After the mockery of the crucifixion, in a post-resurrection setting, the Lord declared: “All power is given unto me in heaven and in earth” (Matthew 28:18).'

  - where: 'note 27:32 “Simon of Cyrene”'
    claim: 'Condemned men carried the cross; Jesus probably the crossbeam only; exhausted, He could not'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus probably only carried the crossbeam itself'
  - where: 'note 27:32 “Simon of Cyrene”'
    claim: 'Jesus was weakened by all He had suffered and moved slowly'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'had so weakened His physical organism that He moved but slowly under the burden of the cross'
  - where: 'note 27:32 “Simon of Cyrene”'
    claim: 'No one would bear the cross willingly; every detail of crucifixion was degrading'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'No Roman or Jew would have voluntarily incurred the ignominy of bearing such a gruesome burden; for every detail connected with the carrying out of a sentence of crucifixion was regarded as degrading.'
  - where: 'note 27:32 “Simon of Cyrene”'
    claim: 'Mark’s Alexander and Rufus perhaps known to his readers; the experience perhaps led to Simon’s conversion'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'this detail suggests that the experience of being so close to Jesus at that critical time might have made a powerful impact on Simon, perhaps leading to his conversion and later to that of his sons.'
  - where: 'note 27:32 “Simon of Cyrene”'
    claim: 'Simon’s household perhaps came to believe'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'there is some indication that the household of Simon the Cyrenian came to be numbered with the believers.'

  - where: 'note 27:34 “Why He would not drink”'
