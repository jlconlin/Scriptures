  - where: 'note 27:64 “A seal and a watch”'
    claim: 'The guard is unique to Matthew; sometimes read polemically, but no need to doubt its basic historicity'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'Although it is sometimes seen in the polemical context of the Matthean community’s struggle with emerging Rabbinic Judaism in the period immediately after the destruction of the temple in AD 70, there is no need to doubt its basic historicity.'
  - where: 'note 27:64 “A seal and a watch”'
    claim: 'How the seal worked'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'This would have consisted of wax or clay into which the credentials of the sealing authority would have been pressed; such a seal would be broken if anyone, including the guards themselves, were to remove it.'
  - where: 'note 27:64 “A seal and a watch”'
    claim: 'A broken seal became a witness that the tomb had been opened'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'The breaking of the seal thus became a witness that the tomb had been violated or otherwise opened.'
  - where: 'note 27:64 “A seal and a watch”'
    claim: 'His enemies remembered His prediction of rising on the third day'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'It is evident that the most inveterate of the human enemies of Christ remembered His predictions of an assured resurrection on the third day after His death.'

