  - where: 'note 27:51 “The veil torn from the top”'
    claim: 'Christ the High Priest entered by His own blood, opening the way (Heb. 9)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Now Christ, our Great High Priest, had entered once and for all by virtue of his own blood, sitting down on the throne of God and opening the way for all who accept him to enter also'
  - where: 'note 27:51 “The veil torn from the top”'
    claim: 'The interior thrown open; the consummation of the Mosaic dispensation'
