    claim: 'The Church’s footnote on “vinegar” points to Psalm 69:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'Ps. 69:21.'

  - where: 'note 27:34 “Why He would not drink”'
    claim: 'The Textus Receptus behind the KJV reads oxos in 27:34'
    key: greek-nt
    url: 'https://biblehub.com/texts/matthew/27-34.htm'
    quote: 'ἔδωκαν αὐτῷ πιεῖν ὄξος μετὰ χολῆς μεμιγμένον'
  - where: 'note 27:34 “Why He would not drink”'
    claim: 'It was the custom to offer the condemned a narcotic draught to deaden the pain'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'it was the custom to offer each a narcotic draught of sour wine or vinegar mingled with myrrh and possibly containing other anodyne ingredients, for the merciful purpose of deadening the sensibility of the victim'
  - where: 'note 27:34 “Why He would not drink”'
    claim: 'He refused once He knew what it was, determined to meet death with mind unclouded'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'having ascertained the nature of its contents refused to drink, and so demonstrated His determination to meet death with faculties alert and mind unclouded.'
  - where: 'note 27:45 “Three hours of darkness”'
    claim: 'Not an eclipse: Passover fell at full moon'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'It could not have been due to a solar eclipse, as has been suggested in ignorance, for the time was that of full moon'
  - where: 'note 27:45 “Three hours of darkness”'
    claim: 'A sign of the earth’s mourning'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'It was a fitting sign of the earth’s deep mourning over the impending death of her Creator.'
  - where: 'note 27:45 “Three hours of darkness”'
    claim: 'The darkness began at noon'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'At noontide the light of the sun was obscured, and black darkness spread over the whole land. The terrifying gloom continued for a period of three hours.'
  - where: 'note 27:45 “Three hours of darkness”'
    claim: 'Old Testament precedents: the plague on Egypt and the day of the Lord'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Old Testament precedents for this darkness include the first plague on Egypt (Exod 10:23‒23), which also was connected with the Passover, and the gloom and darkness prophesied the wrath and judgment that would accompany “the day of the Lord”'
  - where: 'note 27:45 “Three hours of darkness”'
    claim: 'The Book of Mormon and latter-day authorities: the Light of the World ebbing out'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'this darkness represented that the life of Jesus, the Light of the World, was ebbing out.'
  - where: 'note 27:45 “Three hours of darkness”'
    claim: 'Samuel prophesied three days of darkness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/14?lang=eng'
    quote: 'that darkness should cover the face of the whole earth for the space of three days.'

  - where: 'note 27:46 “The cry at the ninth hour”'
