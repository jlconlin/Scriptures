chapter: 25
claims:
  - where: when
    claim: 'On the Tuesday of the last week Jesus left the temple for the Mount of Olives and gave the prophecy to His closest disciples'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Jesus lamented over the fate of Jerusalem before leaving the temple and the city for the Mount of Olives, where he delivered a prophecy of its coming destruction and the future end of the world to his closest disciples.'
  - where: when
    claim: 'The parables were given to the apostles on the Mount of Olives as evening came, on the last day of His public preaching'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'Still discoursing in solemn earnestness to the apostles as the evening shadows gathered about the Mount of Olives, the Lord delivered the last of His recorded parables.'
  - where: setting
    claim: 'The discourse was given to the apostles as evening came, on the last day of His public preaching'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'Still discoursing in solemn earnestness to the apostles as the evening shadows gathered about the Mount of Olives, the Lord delivered the last of His recorded parables.'
  - where: setting
    claim: 'Matthew 24–25 is the last of five discourses, which ends at 26:1'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'each of which ends with phrases such as, “When Jesus had ended these sayings” (see Matthew 7:28; 11:1; 13:53; 19:1; 26:1): … and his End of Times and Judgment Discourse (eschatological, or “last days,” prophecies in chapters 24–25).'
  - where: setting
    claim: 'The discourse was given on the Tuesday, after Jesus left the temple, to His closest disciples'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Jesus lamented over the fate of Jerusalem before leaving the temple and the city for the Mount of Olives, where he delivered a prophecy of its coming destruction and the future end of the world to his closest disciples.'
  - where: setting
    claim: 'Joseph Smith''s revision of Matthew''s account of the discourse is Joseph Smith—Matthew'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'the insights provided by the revelations of Joseph Smith in Doctrine and Covenants 45 and the inspired revision of the Matthean account now found in Joseph Smith—Matthew.'
  - where: setting
    claim: 'Matthew''s longer version of the discourse closes with four parables of preparation, beginning at 24:45'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Matthew’s longer version of the Olivet Discourse concludes with four parables of preparation: the parable of the faithful and unfaithful servant (Matt 24:45–51), the parable of the ten virgins or bridesmaids (25:1–13), the parable of the talents (25:14–30), and the parable of the sheep and the goats'
  - where: setting
    claim: 'Matthew alone reports the parable of the ten virgins'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The first of these illustrative portrayals is the Parable of the Ten Virgins. The only report of it we have is that given by Matthew'
  - where: setting
    claim: 'The parable of the pounds was spoken earlier to a mixed crowd on the way from Jericho; the talents privately to the disciples'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The earlier parable was spoken to a mixed multitude in the course of our Lord’s last journey from Jericho to Jerusalem; the later one was given in privacy to the most intimate of His disciples'
  - where: thread
    claim: 'The virgins teach waiting, the talents working; both after a long delay; the discourse ends in the certainty of judgment'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'Vigilant waiting in the Lord’s cause, and the dangers of unreadiness are exemplified in the story of the virgins; diligence in work and the calamitous results of sloth are prominent features of the tale of the talents. … it is as necessary at times to wait as at others to work.'
  - where: thread
    claim: 'The fault of the foolish virgins is apathy and neglect'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'Not reckless and brutal greed, but simple apathy and neglect is the fault noted for condemnation.'
  - where: thread
    claim: 'The sins of those on the left are all sins of omission, as with the talents'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'It is significant that the sins here are, all of them, sins of omission. As in the case of the parable of the Talents, the opportunities … have simply not been used.'
  - where: 'note 25:1 “At that day: the parable fulfilled at His coming”'
    claim: 'The Joseph Smith Translation begins the chapter “And then, at that day, before the Son of man comes”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/25?lang=eng'
    quote: 'And then, at that day, before the Son of man comes, the kingdom of'
  - where: 'note 25:1 “At that day: the parable fulfilled at His coming”'
    claim: 'The Lord said in 1831 that the parable will be fulfilled when He comes in glory'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'In 1831 the Lord Jesus Christ revealed anew the indications by which the imminence of His glorious advent may be perceived. Through the mouth of His prophet Joseph Smith he thus spake: “And at that day, when I shall come in my glory, shall the parable be fulfilled'
  - where: 'note 25:1 “At that day: the parable fulfilled at His coming”'
    claim: 'The ten virgins represent members of Christ’s Church; only half were ready'
    key: oaks-preparation-second-coming
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2004/04/preparation-for-the-second-coming?lang=eng'
    quote: 'The arithmetic of this parable is chilling. The ten virgins obviously represent members of Christ’s Church, for all were invited to the wedding feast and all knew what was required to be admitted when the bridegroom came. But only half were ready when he came.'
  - where: 'note 25:1 “A wedding procession at night”'
    claim: 'The bridegroom went with his friends to the bride’s home and brought her to his; groups waited along the route and came out to meet the procession; weddings were held at night, with torches and lamps'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'for the bridegroom to go to the home of the bride, accompanied by his friends in processional array, and later to conduct the bride to her new home … organized companies came forth to meet the advancing procession. Wedding ceremonies were appointed for the evening and night hours'
  - where: 'note 25:1 “A wedding procession at night”'
    claim: 'Each lamp may have been fixed to a rod to be held up in the march'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'Each had her lamp attached to the end of a rod so as to be held aloft in the festal march'
  - where: 'note 25:1 “A wedding procession at night”'
    claim: '1 Maccabees describes a bride escorted and the bridegroom coming out with musicians to meet the procession; the feast was at the groom’s house'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'the bridegroom came out with his friends and his brothers to meet them with tambourines and musicians” (1 Maccabees 9:37–39 … compare the parable of the ten virgins, Matthew 25:1–13). The wedding feast would typically take place at the groom’s house'
  - where: 'note 25:1 “A wedding procession at night”'
    claim: 'The Bridegroom is Jesus; the feast is His coming in glory to receive the Church as His bride'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The Bridegroom is the Lord Jesus; the marriage feast symbolizes His coming in glory, to receive unto Himself the Church on earth as His bride.'
  - where: 'note 25:1 “A wedding procession at night”'
    claim: 'The marriage feast represents the covenantal union of the Lord and His people'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'employs the powerful image of Christ as the Bridegroom and the Church as the Bride. For us to be called to the marriage feast, representing the covenantal union of the Lord and his people'
  - where: 'note 25:1 “A wedding procession at night”'
    claim: 'The story rests on customs the listeners knew, long common in the region, particularly among the wealthy'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The story itself is based on oriental marriage customs, with which the Lord’s attentive listeners were familiar. It was and yet is common in those lands, particularly in connection with marriage festivities among the wealthy classes'
  - where: 'note 25:4 “Lamps and oil”'
    claim: 'The foolish had only the first filling of oil, perhaps counting on no delay'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'the other five, probably counting on no great delay, or assuming that they would be able to borrow from others, or perchance having negligently given no thought at all to the matter, had no oil except the one filling'
  - where: 'note 25:4 “Lamps and oil”'
    claim: 'The lamp is outward profession; the oil the spiritual strength that diligence and devotion bring'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The lighted lamp, which each of the maidens carried, is the outward profession of Christian belief and practice; and in the oil reserves of the wiser ones we may see the spiritual strength and abundance which diligence and devotion in God’s service alone can insure.'
  - where: 'note 25:4 “Lamps and oil”'
    claim: 'D&C 45:56–57 gives the Lord’s own reading of the parable'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'And at that day, when I shall come in my glory, shall the parable be fulfilled which I spake concerning the ten virgins.'
  - where: 'note 25:4 “Lamps and oil”'
    claim: 'Elder Bednar, as one of many possible interpretations, read the lamps as testimony and the oil as conversion'
    key: bednar-converted
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/converted-unto-the-lord?lang=eng'
    quote: 'I now want to use one of many possible interpretations of the parable of the ten virgins … Please think of the lamps used by the virgins as the lamps of testimony. … Consider the oil to be the oil of conversion.'
  - where: 'note 25:4 “Lamps and oil”'
    claim: 'The oil is gained a drop at a time; no last-minute preparation'
    key: bednar-converted
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/converted-unto-the-lord?lang=eng'
    quote: 'This precious oil is acquired one drop at a time—“line upon line [and] precept upon precept” (2 Nephi 28:30), patiently and persistently. No shortcut is available; no last-minute flurry of preparation is possible.'
  - where: 'note 25:4 “Lamps and oil”'
    claim: 'D&C 33 was given in October 1830'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/33?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet to Ezra Thayre and Northrop Sweet, at Fayette, New York, October 1830.'
  - where: 'note 25:5 “All ten slept”'
    claim: 'The virgins were not blamed for their surprise; the foolish suffered the results of unpreparedness'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The Bridegroom’s coming was sudden; yet the waiting virgins were not held blamable for their surprise at the abrupt announcement, but the unwise five suffered the natural results of their unpreparedness.'
  - where: 'note 25:5 “All ten slept”'
    claim: 'The bridegroom’s tarrying and the master’s long absence mark a long interval between the Lord’s departure and return'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The lapse of a long period, as while the Bridegroom tarried, and as during the Master’s absence in “a far country,” is made plain throughout as intervening between the Lord’s departure and His return in glory.'
  - where: 'note 25:5 “All ten slept”'
    claim: 'Even the wise slumber in quiet times; what they have is a reserve of faith and divine help'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'At such a time even the wise and good are apt to slumber, and the crisis … takes them by surprise; but they have, what the foolish have not, the reserved force of steadfast faith and divine help to fall back upon.'
  - where: 'note 25:5 “All ten slept”'
    claim: 'One reading applies the slumber to any quiet period in a church or a believer’s life'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'we may see in it that which answers to any period in the history of any church, or, indeed, in the life of any member of a church, in which things go smoothly'
  - where: 'note 25:9 “Oil that cannot be lent”'
    claim: 'The wise were not selfish: the oil of conversion cannot be borrowed or transferred'
    key: bednar-converted
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/converted-unto-the-lord?lang=eng'
    quote: 'Were the five wise virgins selfish and unwilling to share, or were they indicating correctly that the oil of conversion cannot be borrowed? Can the spiritual strength that results from consistent obedience to the commandments be given to another person?'
  - where: 'note 25:9 “Oil that cannot be lent”'
    claim: '“Buy for yourselves” is about individual responsibility, not a business transaction'
    key: bednar-converted
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/converted-unto-the-lord?lang=eng'
    quote: 'These inspired women were not describing a business transaction; rather, they were emphasizing our individual responsibility to keep our lamp of testimony burning and to obtain an ample supply of the oil of conversion.'
  - where: 'note 25:9 “Oil that cannot be lent”'
    claim: 'The refusal is not uncharitable: every soul answers for himself, and one’s righteousness cannot be credited to another'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The refusal of the wise virgins to give of their oil at such a critical time must not be regarded as uncharitable; the circumstance typifies the fact that in the day of judgment every soul must answer for himself; there is no way by which the righteousness of one can be credited to another’s account'
  - where: 'note 25:9 “Oil that cannot be lent”'
    claim: 'The foolish virgins sought to live on borrowed substance and borrowed light'
    key: oaks-preparation-second-coming
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2004/04/preparation-for-the-second-coming?lang=eng'
    quote: 'Many also deny individual responsibility and practice dependence on others, seeking, like the foolish virgins, to live on borrowed substance and borrowed light.'
  - where: 'note 25:12 “Ye know me not”'
    claim: 'The Joseph Smith Translation reads “Ye know me not”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/25?lang=eng'
    quote: 'Verily I say unto you, Ye know me not.'
  - where: 'note 25:12 “Ye know me not”'
    claim: 'Talmage read “I know you not” as saying the neglectful did not know Him'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The Bridegroom’s condemnatory disclaimer, “I know you not,” was equivalent to a declaration that the imploring but neglectful ones, who had been found unready and unprepared, did not know Him.'
  - where: 'note 25:12 “Ye know me not”'
    claim: 'Elder Bednar: the JST change expands the parable’s implications; knowing about the Savior versus knowing Him'
    key: bednar-known-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2016/10/if-ye-had-known-me?lang=eng'
    quote: 'The phrases “Ye never knew me” and “Ye know me not” should be a cause of deep spiritual introspection for each of us. Do we only know about the Savior, or are we increasingly coming to know Him?'
  - where: 'note 25:15 “A talent was money”'
    claim: 'Talanton: a balance, then a weight, then a sum of money weighing a talent'
    key: thayer
    url: 'https://biblehub.com/greek/5007.htm'
    quote: '1. the scale of a balance, a balance, a pair of scales (Homer). … 2. that which is weighed, a talent, i. e. … a. a weight, varying in different places and times. … b. a sum of money weighing a talent'
  - where: 'note 25:15 “A talent was money”'
    claim: 'The talent is not a coin but a sum of money'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'The talent (Matt. 18:24; 25:15) and the mina (pounds) (Luke 19:13) are not coins but sums of money.'
  - where: 'note 25:15 “A talent was money”'
    claim: 'The parable has nothing to do with talents as abilities; it is about slaves entrusted with their master’s business; talents are stewardships to magnify before the Second Coming'
    key: strathearn-teaching-gospels
    url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
    quote: 'the parable of the talents in Matthew 25:14–30 has nothing to do with the modern understanding of talents as an ability to sing or to dance … The talents therefore represent any stewardship with which we are entrusted and must magnify to help build the kingdom in preparation for the Second Coming.'
  - where: 'note 25:15 “A talent was money”'
    claim: 'The servants were bondservants; they and the goods were the master’s'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'the master is presented as delivering his wealth into the hands of his own servants, literally, bondservants; they, as well as the possessions held by them in trust, were his.'
  - where: 'note 25:23 “Two talents, the same welcome”'
    claim: 'In the pounds each receives the same; in the talents the amounts differ, and equal diligence is equally rewarded'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'in that of the Entrusted Talents, the servants receive different amounts, “every man according to his several ability”; and equal diligence, though shown in one instance by great gain and in the other by small but proportionate increase, is equally rewarded.'
  - where: 'note 25:23 “Two talents, the same welcome”'
    claim: 'The lord knew what each could use; smaller work is not less acceptable'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The talents bestowed upon each were the gift of his Lord, who knew well whether that servant was capable of using to better advantage one, two, or five. Let no one conclude that good work of relatively small scope is less necessary or acceptable than like service of wider range.'
  - where: 'note 25:23 “Two talents, the same welcome”'
    claim: 'Had the one-talent servant doubled his talent he would have been as richly rewarded'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'had the man been able to report the doubling of his single talent, he would have been as cordially commended and as richly recompensed as were his more highly endowed and faithful fellows?'
  - where: 'note 25:24 “The servant who blamed his master”'
    claim: '“Hard” is rendered “strict” in the footnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/25?lang=eng'
    quote: '24a “hard”: GR strict.'
  - where: 'note 25:24 “The servant who blamed his master”'
    claim: 'The faithful saw their lord’s goodness; the lazy servant saw in him his own defects'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The honest, diligent, faithful servants saw and reverenced in their Lord the perfection of the good qualities which they possessed in measured degree; the lazy and unprofitable serf, afflicted by distorted vision, professed to see in the Master his own base defects.'
  - where: 'note 25:24 “The servant who blamed his master”'
    claim: 'The Lord makes no refutation; the unused talent is taken from one who counted it of little worth'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'It is notable that to the charge of unrighteousness made by the unfaithful servant, the Lord deigns no refutation … Talents are not given to be buried, and then to be dug up and offered back unimproved'
  - where: 'note 25:24 “The servant who blamed his master”'
    claim: 'The exchangers were bankers, literally table-keepers'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'Thou oughtest therefore to have put my money to the exchangers.—Literally, table or counter-keepers, just as bankers were originally those who sat at their bancum, or bench.'
  - where: 'note 25:24 “The servant who blamed his master”'
    claim: '“Usury” here means interest, not something illegal or exorbitant'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'Usury.—Better, interest; the word not necessarily implying, as usury does now, anything illegal or exorbitant.'
  - where: 'note 25:24 “The servant who blamed his master”'
    claim: 'The unused talent is taken from the one who counted it of little worth'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The unused talent was justly taken from him who had counted it as of so little worth'
  - where: 'section 2 plain'
    claim: '“Exchangers” rendered “bankers” and “usury” rendered “interest”'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'Usury.—Better, interest; the word not necessarily implying, as usury does now, anything illegal or exorbitant.'
  - where: 'note 25:32 “The Shepherd who judges”'
    claim: 'The judgment scene passes beyond parable; sheep and goats are a subordinate illustration; the throne is based on Daniel 7:13'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'it is obvious from its very beginning that it passes beyond the region of parable into that of divine realities, and that the sheep and goats form only a subordinate and parenthetic illustration. The form of the announcement is in part based … upon the vision of Daniel 7:13.'
  - where: 'note 25:32 “The Shepherd who judges”'
    claim: 'Elsewhere the shepherd symbolizes protective love; here he separates in judgment; right and left mean acceptance and rejection'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'Elsewhere the shepherd’s work is the symbol of protective, self-sacrificing love … Here we are reminded that even the shepherd has at times to execute the sentence of judgment which involves separation. The “right” hand and the “left” are used … as indicating respectively good and evil, acceptance and rejection.'
  - where: 'note 25:32 “The Shepherd who judges”'
    claim: 'In Matthew 25:32 Jesus refers to Himself as the Judge in the image of a shepherd'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Passages in the New Testament in which Jesus refers to Himself or is referred to by others as a shepherd include Jesus’s reference to Himself as the Judge of the world before whom “shall be gathered all nations'
  - where: 'note 25:32 “The Shepherd who judges”'
    claim: 'In the Old Testament the Hebrew words for a flock cover both sheep and goats'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'The words ṣōʾn and śeh designate “flocks,” which can consist of both sheep and goats, but are often rendered as just “sheep,”'
  - where: 'note 25:40 “Done unto me”'
    claim: 'The mercies are credited as rendered to the Lord in person; the righteous regard themselves as undeserving'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'all of which mercies are accredited to them as having been rendered to their Lord in person. The blessed company, overwhelmed by the plenitude of the King’s bounty, of which they regard themselves as undeserving, will fain disclaim the merit attributed to them'
  - where: 'note 25:40 “Done unto me”'
    claim: 'Those on the left thought they were only neglecting their fellow men'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'There is, as before, an unconsciousness of the greatness of the things that had been done for good or evil. Men thought that they were only neglecting their fellow men'
  - where: 'note 25:40 “Done unto me”'
    claim: 'The parable teaches that serving others is serving the Lord, as Mosiah 2:17'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The parable of the sheep and the goats, also provided, suggests that the best preparation we can make to be found on the right hand of our Heavenly King is to love and serve others, for thereby we are in fact serving the Lord (Matt 25:39–40; cf. Mosiah 2:17).'
  - where: 'note 25:41 “Blessed of my Father, cursed by their own deeds”'
    claim: 'The omission of “of my Father” is significant: He is not the author of the curse'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/25.htm'
    quote: 'The omission of the words “of My Father,” which might have seemed necessary to complete the parallelism with Matthew 25:34, is every way significant. He is not the author of the curse. Those who have brought themselves under the curse by their own evil deeds He no longer acknowledges as His.'
  - where: 'note 25:41 “Blessed of my Father, cursed by their own deeds”'
