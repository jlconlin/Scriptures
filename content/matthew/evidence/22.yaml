  - where: 'note 22:30 “No marrying in the resurrection”'
    claim: 'Levirate marriage was a temporal marriage for needs raised by death, unneeded in the next world'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'a practice that created a temporal marriage to address needs raised by death, but was unneeded in the next world in which death would no longer exist.'
  - where: 'note 22:42 “David’s Son and David’s Lord”'
    claim: 'Psalm 110 is traditionally attributed to David and is a royal psalm'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Traditionally attributed to David, many scholars classify this as one of the royal psalms that were sung at significant events in the reign of an anointed king.'
  - where: 'note 22:42 “David’s Son and David’s Lord”'
    claim: 'The anointed king of the royal psalm served as a type of the Messiah'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Ideally the king thus served as a type of the Messiah, who took his place at God’s right hand.'

