chapter: 22
claims:
  - where: when
    claim: 'Jesus left the temple for the last time probably on the Tuesday of the last week'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'With the Lord’s final departure from the temple, which probably occurred in the afternoon of the Tuesday of that last week, His public ministry was brought to its solemn ending.'
  - where: when
    claim: 'Tuesday was spent in the temple courts in debates with the Jerusalem authorities'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The first part of the day was spent again in the temple courts, where the Jerusalem authorities engaged in debates with Jesus, trying to catch him in his words.'
  - where: setting
    claim: 'The marriage feast closes a series of three parables, with the epilogue “many are called, but few are chosen”'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'As summary and epilogue of the three great parables constituting this series, the Lord spake these words of solemn import: “For many are called, but few are chosen.”'
  - where: setting
    claim: 'The marriage feast was the last parable Jesus gave publicly to a mixed audience'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The story of the royal marriage feast was the last of our Lord’s parables delivered publicly to a mixed audience.'
  - where: setting
    claim: 'The examination in the temple was three questions from three groups'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The examination of Jesus in the temple consisted of three specific questions, each posed by a different group.'
  - where: setting
    claim: 'Luke’s great supper is a different, earlier parable, told in a Pharisee’s house'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The earlier story was told in the house of one of the chief Pharisees, probably in some town in Perea; the later one was related within the temple, after Pharisaic opposition to Christ had reached its height.'
  - where: thread
    claim: 'Having silenced every party, Jesus became the questioner'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Sadducees, Herodians, Pharisees, lawyers, and scribes, all had in turn met discomfiture and defeat in their efforts to entangle Jesus on questions of doctrine or practice'
  - where: thread
    claim: 'Jesus’s question on Psalm 110 forced all the groups to reconsider their messianic expectations'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'During the lull, Jesus turns the tables on his opponents, asking a question based upon Psalm 110:1 that forces all these groups to reconsider their own contemporary messianic expectations'
  - where: thread
    claim: 'The parables declare that the covenant children are rejected unless they make good their title, and sinners admitted by repentance'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'the three are as one in declaring the great truth that even the children of the covenant will be rejected except they make good their title by godly works'
  - where: section 2 plain
    claim: 'The penny was a denarius; “render” is “give back” (apodote)'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'By saying “give back” (Greek, apodote; KJV, “render”),'
  - where: section 4 plain
    claim: 'The lawyer was a scribe, an expert in the law'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'a term that we have rendered as “experts at the law” to emphasize their expertise in the books attributed to Moses as well as other scriptures.'

  - where: 'note 22:2 “Who the king, the son and the guests are”'
    claim: 'King is God, son is Jesus, first guests the covenant people, later guests the Gentiles, feast the consummation of the Messiah’s mission'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The king in the parable is God; the son whose marriage was the occasion of the feast is Jesus, the Son of God; the guests who were bidden early, yet who refused to come when the feast was ready, are the covenant people who rejected their Lord'
  - where: 'note 22:2 “Who the king, the son and the guests are”'
    claim: 'A messianic feast was expected, with only the children of Abraham as guests'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The great feast by which the Messianic reign was to be ushered in was a favorite theme of jubilant exposition in both synagog and school; and exultation ran high in the rabbinical dictum that none but the children of Abraham would be among the blessed partakers.'
  - where: 'note 22:2 “Who the king, the son and the guests are”'
    claim: 'A wedding lasted a week or two; guests were told far ahead and reminded on the opening day; a king’s invitation was a command'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'Such an event required extensive planning, and guests were informed far in advance, with a reminder sent on the opening day of the festivities. An invitation from a king to his subjects to a wedding such as this was essentially considered a command.'
  - where: 'note 22:2 “Who the king, the son and the guests are”'
    claim: 'Refusal was rebellion against the king and an indignity to his son, the heir; farm and merchandise show their engrossment in their own affairs'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'It is plainly evident that the refusal to attend the king’s feast was a deliberate rebellion against the royal authority and a personal indignity against both the reigning sovereign and his son.'
  - where: 'note 22:2 “Who the king, the son and the guests are”'
    claim: 'The farm and the merchandise: engrossment in material pursuits, placing their own affairs above the king’s call'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The turning away by one man to his farm and by another to his merchandise is in part an evidence of their engrossment in material pursuits to the utter disregard of their sovereign’s will'
  - where: 'note 22:2 “Who the king, the son and the guests are”'
    claim: '“Highways” are the openings of the ways, crossroads; the feature prophesies the calling of the Gentiles, as at Pisidian Antioch'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'Literally, the openings of the ways, the places where two or more roads met, and where, therefore, there was a greater probability of meeting way-farers. In the interpretation of the parable, we may see in this feature of it a prophecy of the calling of the Gentiles'

  - where: 'note 22:7 “A city burned”'
    claim: 'Luke’s parable of the great supper differs: gentler, excuses, a private host, exclusion only; this one has a king, murder and a city destroyed'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'Retribution in the first instance was limited to exclusion from the banquet; in the latter the individual punishment was death, which was followed by the punitive example of the city’s destruction.'
  - where: 'note 22:7 “A city burned”'
    claim: 'Here the parable passes from past to future: the destruction of Jerusalem came decades after Christ’s death'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'If the parable was intended to be an allegorical presentation of actual events, it passes at this point from the story of the past to that of the future, for the destruction of Jerusalem postdates by several decades the death of Christ.'
  - where: 'note 22:7 “A city burned”'
    claim: 'First fulfilled approximately in the destruction of Jerusalem, then in all judgments on unbelief'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'the words find an approximate fulfilment, first, in the destruction of Jerusalem, and afterwards, in all times of trouble that fall upon nations and churches as the punishment of unbelief and its consequent unrighteousness.'

  - where: 'note 22:11 “The garment the king gave”'
    claim: 'The host provided simple robes for the guests, which erased rank'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'The custom in those days was for the host of a wedding feast—in this parable, the king—to provide garments for the wedding guests. Such wedding garments were simple, nondescript robes that all attendees wore.'
  - where: 'note 22:11 “The garment the king gave”'
    claim: 'Guests from the highways had no time to dress; the king likely gave from his own wardrobe'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'Consequently, the king likely gave guests the garments from his own wardrobe. Everyone was given the opportunity to clothe themselves in garments of royalty.'
  - where: 'note 22:11 “The garment the king gave”'
    claim: 'The story requires that provision was made for each guest; the man had no excuse and entered another way, an intruder'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The unity of the narrative requires that some provision had been made whereby each one who properly applied was given the garment prescribed by the king’s command, and in keeping with the established custom at court.'
  - where: 'note 22:11 “The garment the king gave”'
    claim: 'He entered by another way, like the thief who climbs up some other way'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'he was an intruder, of a kind with the man to whom the Lord had before referred as a thief and a robber because, not entering by the door, he had climbed up some other way.'
  - where: 'note 22:11 “The garment the king gave”'
    claim: '“Friend” implies the act was strange and inexcusable'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'The question implies that the act was strange, unlooked-for, inexcusable.'
  - where: 'note 22:11 “The garment the king gave”'
    claim: 'He did not lack a garment; he chose not to wear one'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'He did not simply lack a wedding garment; rather, he chose not to wear one.'

  - where: 'note 22:14 “Called to the feast, chosen at it”'
    claim: 'The Joseph Smith Translation adds “wherefore all do not have on the wedding garment”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/22?lang=eng'
    quote: 'JST Matt. 22:14 … chosen; wherefore all do not have on the wedding garment.'
  - where: 'note 22:14 “Called to the feast, chosen at it”'
    claim: 'The invitation is to all; one may sit at the feast and not be chosen, lacking the garment of converting faith in Christ and His grace'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'An individual may even accept the invitation and sit down at the feast—yet not be chosen to partake because he or she does not have the appropriate wedding garment of converting faith in the Lord Jesus and His divine grace.'
  - where: 'note 22:14 “Called to the feast, chosen at it”'
    claim: 'To be chosen is not a status conferred; we choose to be chosen by agency; Bednar reads D&C 121:34–35 on the same word'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'To be or to become chosen is not an exclusive status conferred upon us. Rather, you and I ultimately can choose to be chosen through the righteous exercise of our moral agency.'
  - where: 'note 22:14 “Called to the feast, chosen at it”'
    claim: 'The JST reading of 22:14 in full'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: '“For many are called, but few are chosen; wherefore all do not have on the wedding garment.”'
  - where: 'note 22:14 “Called to the feast, chosen at it”'
    claim: 'The saying sums up the three parables: covenant children rejected unless they make good their title; sinners admitted by repentance'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'while to the heathen and the sinners the portals of heaven shall open, if by repentance and compliance with the laws and ordinances of the gospel they shall merit salvation.'
  - where: 'note 22:14 “Called to the feast, chosen at it”'
    claim: 'D&C 121:34 repeats the saying and asks why the many are not chosen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'Behold, there are many called, but few are chosen. And why are they not chosen?'

  - where: 'note 22:16 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The Herodians were a political party upholding the Herods and so Roman power'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'the Herodians, a political faction whose chief characteristic was the purpose of maintaining in power the family of the Herods, which policy of necessity entailed the upholding of the Roman power'
  - where: 'note 22:16 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The Herodians are obscure, elsewhere only in Mark 3:6; usually taken as a political party supporting the Herods for some Jewish autonomy under Rome'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'usually they are assumed to have been a largely political party that supported the Herodian family as the means to maintain some degree of Jewish autonomy under Roman authority.'
  - where: 'note 22:16 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'Yes, and the Pharisees accuse him of betraying God or the nation; no, and the Herodians accuse him of resisting Rome'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'If he said that it was permissible to pay the tax, the Pharisees in the delegation could claim that he was betraying God or at least was disloyal to the Jewish nation; if he said it was not, the Herodians could claim that he was advocating resistance to Roman demands.'
  - where: 'note 22:16 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The poll-tax was the most offensive act of allegiance to Rome'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'for of all acts attesting compulsory allegiance to Rome that of having to pay the poll-tax was most offensive to the Jews.'
  - where: 'note 22:16 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The flattery was true in every word but false in intent'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'This studied tribute to our Lord’s courage and independence of thought and action was truthful in every word; but as uttered by those fulsome dissemblers and in their nefarious intent, it was egregiously false.'
  - where: 'note 22:16 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'He was later accused, falsely, of forbidding tribute (Luke 23:2)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'could accuse Him, as He was eventually accused, of “perverting the nation, and forbidding to give tribute to Cæsar” (Luke 23:2).'

  - where: 'note 22:20 “Tiberius on the coin”'
    claim: 'The denarius bore Tiberius’s image and an inscription claiming divine sonship and high priesthood, offensive to Jews'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'the denarius, or Roman coin, with which the tax was paid had both the image of the emperor Tiberius and the inscription “Tiberius Caesar Augustus, son of the deified Augustus, high priest,” which both offended Jewish sensibilities about graven images'
  - where: 'note 22:20 “Tiberius on the coin”'
    claim: 'Jewish coins bore plants and fruit, not a head; Roman coins still circulated in Palestine'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Their own coins bore other devices, such as plants, fruit, etc., in place of a human head'
  - where: 'note 22:20 “Tiberius on the coin”'
    claim: 'The nation had already settled the question by using Roman coinage; to circulate a ruler’s coin acknowledged his authority'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'they accepted and circulated among themselves the Roman coinage as a common medium of exchange; and it was a criterion of recognition among the Jews that to make current the coins of any sovereign was to acknowledge his royal authority.'

  - where: 'note 22:21 “What bears God’s image”'
    claim: '“Render” is “give back”: Caesar minted and owned the coin; all created things belong to God'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Jesus both acknowledged the civic role of the emperor, who minted, and in a sense still owned, the very coin under discussion, and proclaimed the greater obligation we have to God, since, in truth, all created things belong to him.'
  - where: 'note 22:21 “What bears God’s image”'
    claim: 'Every soul bears God’s image; give God yourselves'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Every human soul is stamped with the image and superscription of God, however blurred and indistinct the line may have become through the corrosion or attrition of sin'
  - where: 'note 22:21 “What bears God’s image”'
    claim: 'Give God yourselves, the divine mintage'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'give unto God and His service, yourselves—the divine mintage of His eternal realm.'
  - where: 'note 22:21 “What bears God’s image”'
    claim: 'The answer swept away any thought of earthly ambition and set the basis between church and state'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'It established for all time the one righteous basis of relationship between spiritual and secular duties, between church and state.'
  - where: 'note 22:21 “What bears God’s image”'
    claim: 'Modern revelation requires obedience to governments: D&C 58:21–22; 98:4–6; 134; the twelfth article of faith'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Through the medium of modern revelation, the Lord has required of His people in the present dispensation, obedience to and loyal support of the duly established and existing governments in all lands. See D&C 58:21–22; 98:4–6; and section 134 throughout.'

  - where: 'note 22:23 “A question about the resurrection, not about marriage”'
    claim: 'The Sadducees came from the chief priestly families; the question was really about the resurrection, which they denied, using levirate marriage to make it look absurd'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Instead, they were trying to use an extreme example involving the practice of levirate marriage to demonstrate that believing in a resurrection was absurd.'
  - where: 'note 22:23 “A question about the resurrection, not about marriage”'
    claim: 'The Sadducees came from the chief priestly families'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'The Sadducees, who came from the chief priestly families and seemed to represent the core of the opposition to Jesus, posed the next question.'
  - where: 'note 22:23 “A question about the resurrection, not about marriage”'
    claim: 'Levirate marriage was a temporary arrangement to father a child for the dead brother; denying the resurrection denies God’s power'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'levirate marriages were only temporary arrangements to begin with—the child conceived “belonged to” the dead brother, and the living brother had no further conjugal rights after the child was born.'
  - where: 'note 22:23 “A question about the resurrection, not about marriage”'
    claim: 'By denying the resurrection they denied the power of God'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Next, and more significantly, by denying the resurrection, Jesus pointed out that they were, in fact, denying the power of God.'
  - where: 'note 22:23 “A question about the resurrection, not about marriage”'
    claim: 'The Sadducees denied bodily resurrection, against the Pharisees; the case was possible under the law but most improbable'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'was possible under the Mosaic code relating to levirate marriages; but it was a most improbable instance.'
  - where: 'note 22:23 “A question about the resurrection, not about marriage”'
    claim: 'The question was meant to ridicule, not a serious inquiry'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Since the Sadducees did not believe in resurrection (Matthew 22:23), their question was not a serious inquiry, but was meant to ridicule'

  - where: 'note 22:30 “No marrying in the resurrection”'
    claim: 'From the second century many Christians read the verse as no marriage in the next life'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Some Christian writers from the second century forward took this to mean that the next life would be a non-conjugal state in which marriage would no longer exist—a view that has prevailed in traditional Christianity to the present day.'
  - where: 'note 22:30 “No marrying in the resurrection”'
    claim: 'The words speak of no creation of marriages, not no existence of marriage'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'commentators have drawn attention to the ambiguity in Jesus’s response, with its reference to there being no creation of marriages, rather than no existence of marriage, in the age to come.'
  - where: 'note 22:30 “No marrying in the resurrection”'
    claim: 'Levirate marriage and the Sadducees’ unbelief correspond to D&C 132:15–16'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'Both the practice of levirate marriage and the Sadducees’s disbelief in resurrection seem to correspond to the teaching in Doctrine and Covenants 132:15–16'
  - where: 'note 22:30 “No marrying in the resurrection”'
    claim: '“With us” suggests Jesus may have meant the Sadducees, limiting the scope of the answer'
    key: ellison-family-marriage
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/family-marriage-celibacy-new-testament'
    quote: 'The people Jesus referred to when he said, “they neither marry nor are given in marriage,” appear to be Sadducees (“there were with us seven brethren”; Matthew 22:25; emphasis added), perhaps limiting the scope of Jesus’s response'
  - where: 'note 22:30 “No marrying in the resurrection”'
    claim: 'All questions of marital status must be settled before the resurrection, under priesthood authority to seal'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'In the resurrection there will be no marrying nor giving in marriage; for all questions of marital status must be settled before that time, under the authority of the Holy Priesthood, which holds the power to seal in marriage for both time and eternity.'
  - where: 'note 22:30 “No marrying in the resurrection”'
    claim: 'D&C 132:16 uses the same words of those not married by the Lord’s word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'Therefore, when they are out of the world they neither marry nor are given in marriage; but are appointed angels in heaven'

  - where: 'note 22:32 “The God of the living”'
    claim: 'The Sadducees upheld the law where Jehovah names Himself God of the patriarchs, yet made the title valid only for their mortal lives'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'yet they denied the possible resurrection of these patriarchs, and made the exalted title, under which the Lord had revealed Himself to Moses, valid only during the brief mortal existence of the progenitors of the Israelitish nation.'
  - where: 'note 22:32 “The God of the living”'
    claim: 'The patriarchs lived on in the spirit world, and through Jesus’s resurrection He would overcome death for them'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Not only did Abraham, Isaac, and Jacob continue to live in the spirit world (the Sadducees did not seem to believe in any kind of life after death), but through Jesus’s own resurrection he would overcome physical death for them and for us.'

  - where: 'note 22:35 “A lawyer’s test”'
    claim: 'A lawyer was a scribe who was also a professor of ecclesiastical law'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'One of their number, a lawyer, by which title we may understand one of the scribes who was distinctively also a professor of ecclesiastical law'
  - where: 'note 22:35 “A lawyer’s test”'
    claim: 'The question was understandable: later authorities counted 613 commandments; Matthew ends with Jesus’s answer while Mark has the scribe respond favorably'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'a question that was understandable, given that legal authorities would later identify 613 different commandments in the Mosaic law.'
  - where: 'note 22:35 “A lawyer’s test”'
    claim: 'Matthew ends with Jesus’s answer; Mark continues with the scribe’s favorable response'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'While Matthew ends his version of this episode with Jesus’s answer, Mark continues with the expert at the law responding favorably to Jesus'
  - where: 'note 22:35 “A lawyer’s test”'
    claim: 'The Jews had divided and subdivided the commandments and added rules'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The Jews had divided and subdivided the commandments of the law, and had supplemented even the minutest subdivision with rules of their own contriving.'
  - where: 'note 22:35 “A lawyer’s test”'
    claim: 'The reply convinced the scribe, who honestly accepted it'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'The Lord’s reply to the question was convincing even to the learned scribe who had acted as spokesman for his Pharisaic colleagues.'

  - where: 'note 22:38 “Why the first commandment is first”'
    claim: 'Jesus recited part of the Shema, recited twice daily; what was new was the ranking'
    key: sc-knowhy-517
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-love-god-with-all-thy-mind'
    quote: 'Christ’s response to the publican was not revelatory in the sense that this commandment was new. What was revelatory was his classification of exactly how important it was'
  - where: 'note 22:38 “Why the first commandment is first”'
    claim: 'The Shema is recited twice daily'
    key: sc-knowhy-517
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-love-god-with-all-thy-mind'
    quote: 'Thus, the Shema is recited twice daily, once in the morning and once at night.'
  - where: 'note 22:38 “Why the first commandment is first”'
    claim: 'The commandment was revealed again in this dispensation (D&C 59:5)'
    key: sc-knowhy-517
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-love-god-with-all-thy-mind'
    quote: 'was again revealed in this dispensation by modern prophets (D&C 4:2; D&C 59:5).'
  - where: 'note 22:38 “Why the first commandment is first”'
    claim: 'The words were written on the phylacteries the Pharisees wore'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'the very words of which were written on the phylacteries which the Pharisees wore as frontlets between their eyes'
  - where: 'note 22:38 “Why the first commandment is first”'
    claim: 'God put the first commandment first because those who love Him keep the rest'
    key: benson-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1988/04/the-great-commandment-love-the-lord?lang=eng'
    quote: 'Why did God put the first commandment first? Because He knew that if we truly loved Him we would want to keep all of His other commandments.'
  - where: 'note 22:38 “Why the first commandment is first”'
    claim: 'When God is first, all else falls into place'
    key: benson-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1988/04/the-great-commandment-love-the-lord?lang=eng'
    quote: 'When we put God first, all other things fall into their proper place or drop out of our lives.'

  - where: 'note 22:40 “Everything hangs on two”'
    claim: '“The law and the prophets” is the whole Old Testament revelation; the two commandments lie at the root, the rest expands and applies them'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'to indicate the whole of the revelation of the divine will in the Old Testament. The two great commandments lay at the root of all. The rest did but expand and apply them'
  - where: 'note 22:40 “Everything hangs on two”'
    claim: 'To love God is to keep His commandments; to love one’s neighbor is to be a brother; the whole is greater than any part'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'To love God with all one’s heart and soul and mind is to serve Him and keep all his commandments. To love one’s neighbor as one’s self is to be a brother in the broadest and, at the same time, the most exacting sense of the term.'
  - where: 'note 22:40 “Everything hangs on two”'
    claim: 'The commandment to love God and man is greatest because the whole is greater than any part'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'Therefore the commandment to love God and man is the greatest, on the basis of the simple and mathematical truth that the whole is greater than any part.'

  - where: 'note 22:42 “David’s Son and David’s Lord”'
    claim: 'Psalm 110 a royal psalm; the Messiah was expected as a son of David who would restore Israel; David knew the Messiah was more than his descendant'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Contemporary messianic expectations said that the Messiah would be a son of David, a future king of David’s line who would redeem Israel and restore her to greatness.'
  - where: 'note 22:42 “David’s Son and David’s Lord”'
    claim: 'David understood the Messiah was already God’s chosen at His right hand before His birth'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'David had understood that the Messiah was more than one of his descendants: he was already God’s chosen who sat at his right hand millennia before his birth in the flesh.'
  - where: 'note 22:42 “David’s Son and David’s Lord”'
    claim: 'The Jews expected a Messiah who would be David’s son only by descent and royal succession'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'they who lived in expectation of a Messiah who would be David’s son only in the sense of family descent and royal succession in the splendor of temporal rule'
  - where: 'note 22:42 “David’s Son and David’s Lord”'
    claim: 'Jesus is David’s son by lineage, but was Jehovah before David'
    key: talmage-jesus-christ-31
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-31?lang=eng'
    quote: 'But while Jesus was born in the flesh as late in the centuries as the “meridian of time” He was Jehovah, Lord and God, before David, Abraham, or Adam was known on earth.'

  - where: 'note 22:2 “Who the king, the son and the guests are”'
    claim: 'Guests bidden long before were notified again on the opening day'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'the selected guests had been bidden long aforetime; and, in accordance with oriental custom were notified again on the opening day of the festivities'
  - where: 'note 22:2 “Who the king, the son and the guests are”'
    claim: 'A wedding was one of the most joyous occasions in Jewish life, lasting a week or two'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'In ancient times, one of the most joyous occasions in Jewish life was a wedding celebration—an event that would span a week or even two.'
  - where: 'note 22:16 “Pharisees and Herodians: a trap with two jaws”'
    claim: 'The Herodians are known only from Matthew and Mark'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/22.htm'
    quote: 'The party thus described are known to us only through the Gospels of St. Matthew and St. Mark'
  - where: 'note 22:23 “A question about the resurrection, not about marriage”'
    claim: 'Jesus showed first that they did not understand the passage they alluded to'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
