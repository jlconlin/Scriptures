chapter: 16
claims:
  - where: setting
    claim: 'The journeys of this period withdraw from the populous cities that had rejected Him'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'There is in all these movements an obvious withdrawal from the populous cities which had been the scene of His earlier labours, and which had practically rejected Him and cast in their lot with His enemies.'
  - where: setting
    claim: 'The journey north gave opportunity for private instruction of the Twelve'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The journey afforded opportunity for special and confidential instruction to the apostles.'
  - where: setting
    claim: 'The Transfiguration came about a week after the promise of keys, about October, six months before Jesus’s death'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'This very important event in the New Testament occurred about a week after the promise made to Peter that he would receive the keys of the kingdom of heaven (Matt. 16:13–19; 17:1–9).'
  - where: setting
    claim: 'Caesarea Philippi lay at the foot of Mount Hermon'
    key: bd-caesarea-philippi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caesarea-philippi?lang=eng'
    quote: 'A town near the source of the Jordan, at the foot of Mount Hermon'
  - where: setting
    claim: 'About October, six months before His death'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'The Transfiguration occurred in about October, some six months before the death of Jesus.'
  - where: setting
    claim: 'Only Matthew among the Gospels uses “church” (16:18; 18:17)'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'his references to the church (Matthew 16:18; 18:17), the only ones in any of the Gospels'
  - where: when
    claim: 'About six months before the crucifixion'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'The Transfiguration occurred in about October, some six months before the death of Jesus.'
  - where: thread
    claim: 'From Peter’s confession Jesus taught the Twelve more plainly of His death'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'From the time of Peter’s confession, however, Jesus instructed the Twelve more plainly and with greater intimacy concerning the future developments of His mission, and particularly as touching His appointed death.'
  - where: thread
    claim: 'Peter, called the rock, became a stone in the path'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The man whom Jesus had addressed as Peter—“the rock,” was now likened to a stone in the path, over which the unwary might stumble.'
  - where: thread
    claim: 'The Church was to be built on revelation'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Through direct revelation from God Peter knew that Jesus was the Christ; and upon revelation, as a rock of secure foundation, the Church of Christ was to be built.'
  - where: 'note 16:1 “Rivals joined to demand a sign”'
    claim: 'Pharisees and Sadducees, usual rivals, combined against Him; the demand for a sign was a snare laid before'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Here the party was met by the ever-vigilant Pharisees, who on this occasion were accompanied by their usually unfriendly rivals, the Sadducees.'
  - where: 'note 16:1 “Rivals joined to demand a sign”'
    claim: 'Their combining shows determination to find occasion against Him'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'is a demonstration of the determined purpose of the ecclesiastical authorities to find occasion against Him, and, if possible, destroy Him.'
  - where: 'note 16:1 “Rivals joined to demand a sign”'
    claim: 'The verb behind “tempting” means to test'
    key: strongs-greek
    url: 'https://biblehub.com/greek/3985.htm'
    quote: 'to test (objectively), i.e. endeavor, scrutinize, entice, discipline'
  - where: 'note 16:1 “Rivals joined to demand a sign”'
    claim: 'Sadducees appear nowhere else in the Galilean ministry'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'The presence of members of the latter sect, who do not elsewhere appear in our Lord’s Galilean ministry, is noticeable.'
  - where: 'note 16:1 “Rivals joined to demand a sign”'
    claim: 'Earthly signs could be explained away (Beelzebub); they asked for a sign like Samuel’s thunder or Elijah’s fire'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'There might be collusion, or a power, like that implied in the charge of “casting out devils by Beelzebub,” preternatural, but not divine. What they asked was a sign like Samuel’s thunder from the clear blue sky (1Samuel 12:18), or Elijah’s fire from heaven (1Kings 18:38)'
  - where: 'note 16:3 “Reading the sky, missing the times”'
    claim: 'Red evening sky promised fair weather; the lowering red morning sky promised storm'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'The clear red evening sky is a prophecy of a bright morning. The morning red—not “red” simply, but with the indescribable threatening aspect implied in “lowering,” the frown of the sky, as it were'
  - where: 'note 16:3 “Reading the sky, missing the times”'
    claim: '“Sky” rather than “heaven” hides the point; spiritual firmament'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'the use of “sky,” instead of “heaven,” hides the point of the answer. “You watch the heaven,” He in substance answers'
  - where: 'note 16:3 “Reading the sky, missing the times”'
    claim: '“Sky” in verse 2 is ouranos'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/16-2.htm'
    quote: 'ouranos'
  - where: 'note 16:3 “Reading the sky, missing the times”'
    claim: '“Heaven” in verse 1 is the same word'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/matthew/16-1.htm'
    quote: 'ouranou'
  - where: 'note 16:3 “Reading the sky, missing the times”'
    claim: 'Open eyes would see tokens of what God was doing'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'If your eyes were open to watch the signs of the spiritual firmament, you would find tokens enough of the coming sunshine of God’s truth'
  - where: 'note 16:3 “Reading the sky, missing the times”'
    claim: 'The reply exposed their hypocrisy'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'To their present impertinent and impious demand He gave a brief and definite refusal coupled with an exposure of their hypocrisy.'
  - where: 'note 16:4 “An adulterous generation, and the sign of Jonah”'
    claim: 'Matthew 12:40 explains the sign of Jonas'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'For as Jonas was three days and three nights in the whale’s belly; so shall the Son of man be three days and three nights in the heart of the earth.'
  - where: 'note 16:6 “The leaven of the Pharisees and Sadducees”'
    claim: 'Leaven defined: a lump of old dough'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'Anything that in cooking produces fermentation, a lump of old dough being generally used. No leaven was allowed during the Passover Feast'
  - where: 'note 16:6 “The leaven of the Pharisees and Sadducees”'
    claim: 'Associated with corruption; in the New Testament as a rule a symbol of sin'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'It was probably forbidden because there was associated with it the idea of corruption. In the New Testament it was as a rule symbolic of sin (Matt. 16:6; Mark 8:15; Luke 12:1; 1 Cor. 5:7; Gal. 5:9)'
  - where: 'note 16:6 “The leaven of the Pharisees and Sadducees”'
    claim: 'The Pharisees’ leaven was hypocrisy: outward religion lacking humility and love'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'The leaven was (as expressly stated in Luke 12:1) “hypocrisy,” the unreality of a life respectable, rigid, outwardly religious, even earnest in its zeal, and yet wanting in the humility and love which are of the essence of true holiness.'
  - where: 'note 16:6 “The leaven of the Pharisees and Sadducees”'
    claim: 'The Sadducees’ leaven, not defined, probably open worldliness tied to denial of the resurrection'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'That of the Sadducees and of Herod, was, we may believe (it is not specially defined), the more open form of worldliness and self-indulgence which allied themselves with their denial of the resurrection'
  - where: 'note 16:6 “The leaven of the Pharisees and Sadducees”'
    claim: 'Herod Antipas seems to have held Sadducean beliefs'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'The language of the tetrarch, as has been shown (see Note on Matthew 14:2), implies that Sadduceeism had been the prevailing belief of his life'
  - where: 'note 16:6 “The leaven of the Pharisees and Sadducees”'
    claim: 'Jesus chided their little faith and reminded them of the feedings so the lack of bread would not trouble them'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Jesus chided them as of little faith for thinking then of material bread, and refreshed their recollection of the miracles by which the multitudes had been fed, so that their lack of loaves would not further trouble them.'
  - where: 'note 16:13 “Caesarea Philippi”'
    claim: 'Near the source of the Jordan at the foot of Hermon, rebuilt by Philip; the northernmost point of His journeys'
    key: bd-caesarea-philippi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caesarea-philippi?lang=eng'
    quote: 'A town near the source of the Jordan, at the foot of Mount Hermon, rebuilt and enlarged by Philip, tetrarch of Trachonitis. The northern most point of our Lord’s journeyings'
  - where: 'note 16:13 “Caesarea Philippi”'
    claim: '“Coast” in the King James Bible means border or neighborhood'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The term “coast” as it appears in the Bible (authorized, or King James version), is used to connote boundary, limit, or border, and not distinctively a seashore.'
  - where: 'note 16:13 “Caesarea Philippi”'
    claim: 'Named for the emperor by Philip, distinguished from the coastal Caesarea'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'had been enlarged and beautified by Philip the tetrarch, and by him was named Cæsarea in honor of the Roman emperor. It was called Cæsarea Philippi to distinguish it from the already existing Cæsarea, which was situated on the Mediterranean shore'
  - where: 'note 16:13 “Caesarea Philippi”'
    claim: 'A place of idolatrous worship, called Paneas after Pan; now Banias'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It was known as a place of idolatrous worship, and while under Greek sovereignty was called Paneas in recognition of the mythological deity Pan. See Josephus, Antiquities, xviii, 2:1; this designation persists in the present Arabic name of the place, Banias.'
  - where: 'note 16:13 “Caesarea Philippi”'
    claim: 'Philip was Herod the Great’s son; Jesus went there for retirement and perhaps safety'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'Herod the Great built a temple there in honour of Augustus (Jos. Ant. xv. 10, § 3), and his son Philip the tetrarch (to whose province it belonged) enlarged and embellished the city'
  - where: 'note 16:13 “Caesarea Philippi”'
    claim: 'He came not as a preacher but for retirement and perhaps safety'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/16.htm'
    quote: 'to which He now came, it would seem, not as a Preacher of the kingdom, but simply for retirement and perhaps for safety.'
  - where: 'note 16:13 “Caesarea Philippi”'
    claim: 'The journey gave opportunity for private instruction of the apostles'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'The journey afforded opportunity for special and confidential instruction to the apostles.'
  - where: 'note 16:14 “John, Elijah, Jeremiah”'
    claim: 'Some shared Herod’s fears that He was John returned; hardly a serious belief since they were contemporaries; Elias is Elijah'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Some people, sharing the superstitious fears of the conscience-stricken Herod Antipas, said that Jesus was John the Baptist returned to life, though such a belief could not have been entertained seriously by many, as John and Jesus were known to have been contemporaries'
  - where: 'note 16:14 “John, Elijah, Jeremiah”'
    claim: 'Elias is Elijah; Jeremiah or another prophet'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'others said He was Elias, or more exactly, Elijah; still others suggested He was Jeremiah or some other one of the ancient prophets of Israel.'
  - where: 'note 16:14 “John, Elijah, Jeremiah”'
    claim: 'None of the people’s answers held Him to be the Messiah; He did not fit the popular picture'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'It is significant that among all the conceptions of the people as to the identity of Jesus there was no intimation of belief that He was the Messiah. Neither by word nor deed had He measured up to the popular and traditional standard of the expected Deliverer and King of Israel.'
  - where: 'note 16:14 “John, Elijah, Jeremiah”'
    claim: 'The Pharisees kept the Messiah a future figure in people’s minds'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'To them it was a matter of supreme though evil determination to maintain in the minds of the people the thought of a yet future, not a present, Messiah.'
  - where: 'note 16:14 “John, Elijah, Jeremiah”'
    claim: 'The answers point to prophets already dead, probably unwittingly, which frames what follows'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'Significantly and probably unwittingly, they answer by pointing to some who are already dead: John the Baptist, Elijah, Jeremiah, “or one of the prophets” (Matthew 16:14). Their answer, in effect, spreads out a context for what follows'
  - where: 'note 16:14 “John, Elijah, Jeremiah”'
    claim: 'The keys concern this life and also the heavenly world'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'they also have to do with the heavenly world and what will persist there to the end of time.'
  - where: 'note 16:14 “John, Elijah, Jeremiah”'
    claim: 'The keys bear on the gates of hell and the next world'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'the promised keys bear a relationship to “the gates of hell” (Matthew 16:18), to the next world, and to a greater knowledge of God.'
  - where: 'note 16:17 “Known by revelation”'
    claim: 'Matthew’s fuller confession: Peter knows Jesus is God’s own Son'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'The Matthean Peter does not just know that Jesus is the chosen, anointed servant of God but also that he is actually God’s own Son.'
  - where: 'note 16:17 “Known by revelation”'
    claim: 'Mark and Luke go to “tell no man”; Matthew first declares the source of Peter’s testimony'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Mark and Luke both finished this part of the dialogue with Jesus charging them to tell no man (Mark 8:30; Luke 9:21), but Matthew instead has Jesus follow up Peter’s confession with a declaration on the nature and origins of Peter’s testimony'
  - where: 'note 16:17 “Known by revelation”'
    claim: 'D&C 46:13–14 describes the same gift to Latter-day Saints'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'The apostolic revelation to Peter that Jesus was the Son of God is particularly meaningful to Latter-day Saints.'
  - where: 'note 16:17 “Known by revelation”'
    claim: '“Flesh and blood” is a Semitic expression for mortality'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'Generally, these Semitic touches are seen to include the Aramaic name “Bar-jona,” the expression “flesh and blood” for mortality'
  - where: 'note 16:17 “Known by revelation”'
    claim: 'Peter’s knowledge was not reached by reasoning or weighing evidence'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'This was no avowal of mere belief, no expression of a result at which he had arrived by mental process, no solution of a problem laboriously worked out, no verdict based on the weighing of evidence'
  - where: 'note 16:17 “Known by revelation”'
    claim: 'Earlier confessions (14:33), but this one greater in assurance and kind'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'it is evident that Peter’s upwelling and reverential confession in answer to the Lord’s question “But whom say ye that I am?” had a significance, greater in assurance and more exalted in kind, than had any prior expression'
  - where: 'note 16:17 “Known by revelation”'
    claim: 'It did not yet include full understanding of His mission'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'Yet even the conviction given through direct revelation (Matthew 16:17) did not at the time comprize a comprehensive knowledge of the Savior’s mission.'
  - where: 'note 16:18 “What rock?”'
    claim: 'Joseph Smith quoted the verse in 1843'
    key: jsp-discourse-1843-01-22
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-22-january-1843-as-reported-by-wilford-woodruff/4'
    quote: 'Jesus in his teaching says upon this rock I will build my Church & the gatas [gates] of hell shall not'
  - where: 'note 16:18 “What rock?”'
    claim: 'Joseph Smith: the rock is revelation'
    key: jsp-discourse-1843-01-22
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-22-january-1843-as-reported-by-wilford-woodruff/5'
    quote: 'prevail against it23 what rock, Revelation'
  - where: 'note 16:18 “What rock?”'
    claim: 'The Christ whom Peter confessed is the true cornerstone of the Church'
    key: bd-peter
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/peter?lang=eng'
    quote: 'But it is the Christ, the Son of God, which Peter had just confessed, who is the true cornerstone of the Church.'
  - where: 'note 16:18 “What rock?”'
    claim: 'On revelation as on a rock the Church was built; revelation implies revelators'
    key: talmage-jesus-christ-22
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-22?lang=eng'
    quote: 'By revelation alone could or can the Church of Jesus Christ be builded and maintained; and revelation of necessity implies revelators, through whom the will of God may be made known respecting His Church.'
  - where: 'note 16:18 “What rock?”'
    claim: 'The Aramaic kephā underlies both Peter and rock'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'the play on the Aramaic word kephā that underlies both the Greek name Peter and the word “rock” (Matthew 16:17–19).'
  - where: 'note 16:18 “What rock?”'
    claim: 'The wordplay does not make Peter the bedrock'
    key: bowen-founded-rock
    url: 'https://journal.interpreterfoundation.org/founded-upon-a-rock-doctrinal-and-temple-implications-of-peters-surnaming/'
    quote: 'he was not identifying Peter himself as the actual petra (“bedrock”) upon which Christ’s church would be built.'
  - where: 'note 16:18 “What rock?”'
    claim: 'The wordplay ascribes potential bedrock strength to Peter'
    key: bowen-founded-rock
    url: 'https://journal.interpreterfoundation.org/founded-upon-a-rock-doctrinal-and-temple-implications-of-peters-surnaming/'
    quote: 'The Petros/petra wordplay in this dialogue, however, does suggest that Jesus was ascribing potential “bedrock” strength to his chief disciple.'
  - where: 'note 16:18 “What rock?”'
    claim: 'Peter had to grow into the name'
    key: bowen-founded-rock
    url: 'https://journal.interpreterfoundation.org/founded-upon-a-rock-doctrinal-and-temple-implications-of-peters-surnaming/'
    quote: 'Peter had to grow into the role that the “new name” Petros implied (prophet, seer, and revelator), let alone that of the divine “bedrock.”'
  - where: 'note 16:18 “What rock?”'
    claim: 'JST John 1:42 renders Cephas as seer or stone; the name looks to receptivity to revelation'
    key: bowen-founded-rock
    url: 'https://journal.interpreterfoundation.org/founded-upon-a-rock-doctrinal-and-temple-implications-of-peters-surnaming/'
    quote: 'jst John 1:42 suggests that this new name kîpāʾ can be rendered either as “stone” or “seer,”'
  - where: 'note 16:18 “What rock?”'
    claim: 'The name points to Peter’s receptivity to revelation'
    key: bowen-founded-rock
    url: 'https://journal.interpreterfoundation.org/founded-upon-a-rock-doctrinal-and-temple-implications-of-peters-surnaming/'
    quote: 'his potential leadership capabilities, including power in the priesthood and receptivity to revelation'
  - where: 'note 16:18 “The gates of hell”'
    claim: 'Hell here is hadēs, in the New Testament the temporary abode of spirits awaiting resurrection'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'Later, the New Testament adjusts this view: here, hadēs is a temporary abode where the spirits of the dead await the Resurrection and Judgment'
  - where: 'note 16:18 “The gates of hell”'
    claim: 'Gates hint at the need for keys'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'Plainly, the term gates (Greek pylai) hints at the need for keys to open them.'
  - where: 'note 16:18 “The gates of hell”'
    claim: 'The gates prevail by keeping spirits in prison, not by attacking'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'it seems instead that the gates exercise power over individuals by keeping them inside Hades. That is, the gates prevent persons from gaining access to the saving power of the Atonement by keeping them inside the spirit prison.'
  - where: 'note 16:18 “The gates of hell”'
    claim: 'One person holds both sets of keys; the second set is promised to Peter'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'The same person holds both sets of keys, one that allows departed spirits out of Hades and the other that allows entry from prison into God’s kingdom. It is the latter set of keys that Jesus promises to entrust to Peter.'
  - where: 'note 16:19 “The keys, and binding and loosing”'
    claim: 'Eliakim is the one Old Testament person given keys (Isa. 22:22)'
    key: brown-peters-keys
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peters-keys'
    quote: 'Isaiah’s record offers the one instance of an Old Testament person receiving keys. This man is named Eliakim, son of Hilkiah'
