chapter: 24
claims:
  - where: setting
    claim: 'Two days before the Passover; the sermon closes with “when Jesus had finished all these sayings”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'And it came to pass, when Jesus had finished all these sayings, he said unto his disciples, Ye know that after two days is the feast of the passover'
  - where: setting
    claim: 'On His last walk back to Bethany Jesus rested on the Mount of Olives in sight of the city and temple'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'In the course of His last walk from Jerusalem back to the beloved home at Bethany, Jesus rested at a convenient spot on the Mount of Olives, from which the great city and the magnificent temple were to be seen in fullest splendor'
  - where: setting
    claim: 'Verses 42–51 have nothing corresponding in Mark’s and Luke’s reports of the discourse but are found almost verbatim in Luke 12'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'The verses from Matthew 24:42 to Matthew 24:51 have nothing corresponding to them in the reports of the discourse given by St. Mark and St. Luke, but are found almost verbatim in another discourse reported by St. Luke 12:42, et seq.'
  - where: setting
    claim: 'D&C 45 draws extensively on the discourse; Joseph Smith translated Matthew 24 in the following months'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'that promise would be fulfilled when Joseph Smith worked on the translation of the Olivet Discourse in Matthew 24 in the following months—a discourse that the Lord Himself referenced extensively throughout the revelation canonized as Doctrine and Covenants 45.'
  - where: setting
    claim: 'Joseph Smith expanded, relocated and repeated passages'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'Joseph Smith restructured the text by expanding the wording in some verses, relocating some passages to new places, and repeating some passages so they appear in both sections.'
  - where: thread
    claim: 'The reply deals with events, not dates, in a spirit of warning and vigilance'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The reply dealt not with dates, but with events; and the spirit of the subsequent discourse was that of warning against misapprehension, and admonition to ceaseless vigilance.'
  - where: 'note 24:2 “Not one stone”'
    claim: 'Battering rams failed against the temple’s stones; fire set to the gates led to the sanctuary’s destruction in AD 70'
    key: ludlow-first-jewish-revolt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/first-jewish-revolt-against-rome'
    quote: 'The Roman battering rams failed against the massive stones surrounding the temple. Fire was finally set to the temple gates, leading to the eventual destruction of the magnificent sanctuary in AD 70.'
  - where: 'note 24:2 “Not one stone”'
    claim: 'It fell on the 9th of Av, traditionally the day Solomon’s temple was destroyed'
    key: ludlow-first-jewish-revolt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/first-jewish-revolt-against-rome'
    quote: '(According to the Jewish calendar, this happened on the 9th of Av, traditionally the same day Solomon’s temple was destroyed by the Babylonians'
  - where: 'note 24:3 “Two questions, and which signs answer which”'
    claim: 'One reading: the compound question shows they understood the destruction came first and assumed the events would follow closely'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The compound character of the question indicates an understanding of the fact that the destruction of which the Lord had spoken was to be apart from and precedent to the signs … An assumption that the events would follow in close succession is implied by the form in which the question was put.'
  - where: 'note 24:3 “Two questions, and which signs answer which”'
    claim: 'His return was more remote than the Twelve realized'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The return of Christ to earth as Lord and Judge was more remote than any of the Twelve realized.'
  - where: 'note 24:3 “Two questions, and which signs answer which”'
    claim: 'The disciples seem to have wondered if the two events went together'
    key: ludlow-first-jewish-revolt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/first-jewish-revolt-against-rome'
    quote: 'It seems they wondered if the two events went together: the destruction of the temple and Jesus’s return leading to the end of the world.'
  - where: 'note 24:3 “Two questions, and which signs answer which”'
    claim: 'In all three accounts the words can be read as answering both questions at once'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'In all three synoptic accounts, Jesus’s words can be understood as answering both questions simultaneously, treating the two questions almost as one.'
  - where: 'note 24:3 “Two questions, and which signs answer which”'
    claim: 'The JST answers the questions consecutively; the dividing line is between Matthew 24:22 and 23'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'with roughly the first half of the chapter dealing with circumstances of the first century AD and the second half dealing with the end times. The dividing line between the two sections of the prophecy appears to be between verses 22 and 23 in Matthew'
  - where: 'note 24:3 “Two questions, and which signs answer which”'
    claim: 'Wars, famines and the like moved later; iniquity and gospel preaching repeated in both periods'
    key: jackson-sign-thy-coming
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/what-sign-thy-coming'
    quote: 'Thus “wars and rumors of wars,” kingdoms fighting against kingdoms, famines, pestilences, and earthquakes are moved from early in the chapter to later, giving them a last-days setting. Abounding iniquity and the preaching of the gospel to the world are repeated, showing them to be characteristics of both periods.'
  - where: 'note 24:3 “Two questions, and which signs answer which”'
    claim: 'The JST defines the end of the world as the destruction of the wicked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'JS—M 1:4 adds “or the destruction of the wicked, which is the end of the world.”'
  - where: 'note 24:8 “The first pains of labor”'
    claim: 'ōdin means birth pang; plural used of calamities expected before the Messiah'
    key: thayer
    url: 'https://biblehub.com/greek/5604.htm'
    quote: 'the pain of childbirth, travail-pain, birth-pang … equivalent to intolerable anguish, in reference to the dire calamities which the Jews supposed would precede the advent of the Messiah'
  - where: 'note 24:8 “The first pains of labor”'
    claim: 'Strictly the beginning of travail pangs; the troubles issue in a new birth, the regeneration of 19:28; Rom. 8:22'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'The words mean strictly, the beginning of travail pangs. The troubles through which the world passes are thought of as issuing in a “new birth”—the “regeneration” of Matthew 19:28. So St. Paul speaks of the whole creation as “travailing in pain together” (Romans 8:22).'
  - where: 'note 24:15 “The abomination of desolation”'
    claim: 'Desolation born of abomination fulfilled twice; first when Titus besieged Jerusalem in AD 70'
    key: bd-abomination-of-desolation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abomination-of-desolation?lang=eng'
    quote: 'Conditions of desolation, born of abomination and wickedness, were to occur twice in fulfillment of Daniel’s words. The first was to be when the Roman legions under Titus, in A.D. 70, laid siege to Jerusalem'
  - where: 'note 24:15 “The abomination of desolation”'
    claim: 'The second fulfillment: Jerusalem again under siege'
    key: bd-abomination-of-desolation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abomination-of-desolation?lang=eng'
    quote: 'And again shall the abomination of desolation, spoken of by Daniel the prophet, be fulfilled” (JS—M 1:31–32). That is, Jerusalem again will be under siege.'
  - where: 'note 24:15 “The abomination of desolation”'
    claim: 'The fulfillment heralded by armies encompassing Jerusalem; those who would escape were to make haste'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'The realization of Daniel’s prophetic vision was to be heralded by the encompassing of Jerusalem by armies. Then all who would escape should make haste'
  - where: 'note 24:15 “The abomination of desolation”'
    claim: 'Roman ensigns and images were an abomination to Jews'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'To the Jews the ensigns and images of the Romans were a disgusting abomination.'
  - where: 'note 24:15 “The abomination of desolation”'
    claim: 'After the temple burned the Romans brought their ensigns to the temple and sacrificed to them'
    key: josephus-war
    url: 'http://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0148%3Abook%3D6%3Awhiston+chapter%3D6%3Awhiston+section%3D1'
    quote: 'upon the burning of the holy house itself, and of all the buildings round about it, brought their ensigns to the temple … and there did they offer sacrifices to them'
  - where: 'note 24:15 “The abomination of desolation”'
    claim: '“Whoso readeth” is part of the discourse, bidding the reader of Daniel to ponder until he recognized the fulfillment'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'There appears, however, to be no sufficient reason why they should not be received as part of the discourse itself, bidding one who read the words of Daniel to ponder over their meaning till he learnt to recognise their fulfilment in the events that should pass before his eyes.'
  - where: 'note 24:20 “Not in winter, nor on the Sabbath”'
    claim: 'Matthew alone, writing for Jews, has the Sabbath; Sabbath day’s journey about a mile; gates shut'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'It is characteristic of St. Matthew, as writing for Jews, that he alone records the words “nor on the Sabbath day.” Living as the Christians of Judæa did in the strict observance of the Law, they would either be hindered by their own scruples from going beyond a Sabbath day’s journey (about one English mile)'
  - where: 'note 24:20 “Not in winter, nor on the Sabbath”'
    claim: 'Others’ Sabbath observance would impede them; rules given for what was in their power, prayer for the rest'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'Rules were given for flight where the conditions lay within their own power. Other incidents which lay outside their will might lawfully be the subjects of their prayers. … or would find impediments—gates shut, and the like—from the Sabbath observance of others.'
  - where: 'note 24:20 “Not in winter, nor on the Sabbath”'
    claim: 'Mark has winter only'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/13?lang=eng'
    quote: 'And pray ye that your flight be not in the winter.'
  - where: 'note 24:27 “No hidden coming”'
    claim: 'One reading: after Jerusalem’s fall, for an unspecified period, deceivers would draw people to the deserts and to secret chambers'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'After the passing of those terrible times, and thence onward for a period of unspecified duration … some alluring people into the deserts … others insisting that Christ could be found in the secret chambers of monastic seclusion'
  - where: 'note 24:27 “No hidden coming”'
    claim: 'At His coming no one will be in doubt; no conflicting claims of sects'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'In the day of the Lord’s advent in glory and vengeance, no man shall be in doubt; there shall be no chance of conflicting claims by contending sects'
  - where: 'note 24:28 “The carcase and the eagles”'
    claim: 'Since eagles seldom go after carrion, aetos here is better taken of a vulture resembling an eagle'
    key: thayer
    url: 'https://biblehub.com/greek/105.htm'
    quote: 'In Matthew 24:28; Luke 17:37 (as in Job 39:30; Proverbs 30:17) it is better, since eagles are said seldom or never to go in quest of carrion, to understand with many interpreters either thevultur percnopterus, which resembles an eagle'
  - where: 'note 24:28 “The carcase and the eagles”'
    claim: 'JS—M calls the saying a parable of the gathering of the elect'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'And now I show unto you a parable. Behold, wheresoever the carcass is, there will the eagles be gathered together; so likewise shall mine elect be gathered from the four quarters of the earth.'
  - where: 'note 24:30 “The Son of Man in the clouds of heaven”'
    claim: 'Daniel’s vision of one like the Son of man with the clouds of heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'behold, one like the Son of man came with the clouds of heaven'
  - where: 'note 24:34 “Which generation”'
    claim: 'The ordinary sense of generation is those living at a given period'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'The natural meaning of the words is, beyond question. that which takes “generation” in the ordinary sense (as in Matthew 1:17, Acts 13:36, and elsewhere) for those who are living at any given period.'
  - where: 'note 24:34 “Which generation”'
    claim: 'The generation in which the events are realized: Jerusalem’s fall within the apostles’ lifetime; the Second Coming’s signs within the generation that sees them begin'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'This may be understood as applying to the generation in which the portentous happenings before described would be realized. … such of the Lord’s prophecies as pertain to the heralding of His second coming are to be brought to pass within the duration of the generation of some who witness the inauguration of their fulfilment.'
  - where: 'note 24:34 “Which generation”'
    claim: 'D&C 45 speaks of a generation of Jews and of the generation of the times of the Gentiles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'And it shall come to pass, that this generation of Jews shall not pass away until every desolation which I have told you concerning them shall come to pass.'
  - where: 'note 24:36 “Not even the Son”'
    claim: 'In the flesh Jesus claimed no omniscience; He learned the Father’s will by communication; He did not then know the day'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'While in the flesh He laid no claim to omniscience; though whatever He willed to know He learned through the medium of communication with the Father. … He was uninformed on the matter; for He so states.'
  - where: 'note 24:36 “Not even the Son”'
    claim: 'The date has not since been revealed'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'Nor has the date of the Messianic consummation been since revealed to any man'
  - where: 'note 24:36 “Not even the Son”'
    claim: 'The time is not revealed; the events and signs are'
    key: topics-second-coming
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/second-coming-of-jesus-christ?lang=eng'
    quote: 'The Lord has not revealed exactly when He will come again … But He has revealed to His prophets the events and signs that will precede His Second Coming.'
  - where: 'note 24:37 “As in the days of Noah”'
    claim: 'Noe is Noah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: '37a “Noe”: IE Noah.'
  - where: 'note 24:37 “As in the days of Noah”'
    claim: 'The coming sudden to the sinful world but following signs the devout can read; Noah’s people feasted in spite of warning'
    key: talmage-jesus-christ-32
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-32?lang=eng'
    quote: 'That His advent in power and glory is to be sudden and unexpected to the unobserving and sinful world, but in immediate sequence to the signs which the vigilant and devout may read and understand … when in spite of prophecy and warning the people had continued in their feasting and merry-making'
  - where: 'note 24:37 “As in the days of Noah”'
    claim: 'A Latter-day Saint reading of the one taken from D&C 88:96'
    key: ogden-prophecies-jsm
    url: 'https://rsc.byu.edu/vol-3-no-1-2002/prophecies-promises-joseph-smith-matthew'
    quote: 'Fortunately, there is a clear and specific answer to the query about which situation is preferred. Doctrine & Covenants 88:96 indicates that “the Saints that are upon the earth, who are alive, shall be quickened and be caught up to meet him.”'
  - where: 'note 24:43 “The householder and the thief”'
    claim: 'Goodman of the house = householder, as in 20:1'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'The goodman of the house.—Better, as in Matthew 20:1., householder.'
  - where: 'note 24:43 “The householder and the thief”'
    claim: 'Four night watches of three hours; the thief image passed into Paul’s saying'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/24.htm'
    quote: 'The night-watches were four in number, of three hours each. … The allusion to the “thief coming” would seem to have passed into the proverbial saying, that the day of the Lord would come “as a thief in the night,” quoted by St. Paul in 1Thessalonians 5:2.'
  - where: 'note 24:43 “The householder and the thief”'
    claim: 'diorussō means to dig through a house'
    key: thayer
    url: 'https://biblehub.com/greek/1358.htm'
    quote: 'to dig through: a house (Xenophon, symp. 4, 30; Job 24:16 the Sept.), Matthew 24:43; Luke 12:39'
  - where: 'note 24:48 ““My lord delayeth his coming””'
    claim: 'D&C 45 draws extensively on the discourse'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'a discourse that the Lord Himself referenced extensively throughout the revelation canonized as Doctrine and Covenants 45.'
  - where: 'note 24:48 ““My lord delayeth his coming””'
    claim: 'In D&C 45:26 men say Christ delays His coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'and men’s hearts shall fail them, and they shall say that Christ delayeth his coming until the end of the earth.'
  - where: 'note 24:2 “Not one stone”'
    claim: 'JS—M adds “upon this temple”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'there shall not be left here, upon this temple, one stone upon another that shall not be thrown down.'
  - where: 'note 24:30 “The Son of Man in the clouds of heaven”'
    claim: 'Modern revelation: a great sign in heaven that all people shall see'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'And immediately there shall appear a great sign in heaven, and all people shall see it together.'
  - where: 'note 24:30 “The Son of Man in the clouds of heaven”'
    claim: 'Joseph Smith in 1843: the Son of Man will come as the sign of His coming'
    key: jsp-discourse-1843-04-06-b
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-6-april-1843-b-as-reported-by-willard-richards/13'
    quote: 'consequently the son of man will come as the sign of coming of the son of man.'
  - where: 'note 24:34 “Which generation”'
    claim: 'D&C 45:30: in that generation the times of the Gentiles fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'And in that generation shall the times of the Gentiles be fulfilled.'
