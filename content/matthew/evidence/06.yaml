    claim: 'JST: house to house; I will go before you'
    key: jst-matt-6
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/6?lang=eng'
    quote: 'Nevertheless, ye shall go forth from house to house, teaching the people; and I will go before you.'
