chapter: 6
claims:
  - where: when
    claim: 'The sermon was given in Galilee'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'The Sermon on the Mount was delivered in Galilee.'
  - where: when
    claim: 'The sermon was given early in the mortal ministry'
    key: huntsman-antitheses
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/six-antitheses'
    quote: 'the Sermon on the Mount early in his mortal ministry before his completion of the Atonement.'
  - where: setting
    claim: 'The Sermon on the Mount (Matthew 5–7) is the first of Matthew’s five discourses, each closed with a formula'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'we find him delineating five major discourses by the Savior: the Sermon on the Mount (Matthew 5–7), the Apostolic Commission (Matthew 10) … At the end of each of the first four discourses, he added, “And it came to pass, when Jesus had ended these” sayings'
  - where: setting
    claim: 'The sermon is addressed to the disciples'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'The Sermon on the Mount and the Sermon on the Plain are not directed to the general populace but to Christ’s disciples.'
  - where: setting
    claim: 'The Joseph Smith Translation names the disciples as the audience'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'JST Matthew 7:1 explicitly spells out the audience. Jesus’ words are directed to “his disciples” that they might know what “they should say unto the people.”'
  - where: setting
    claim: 'The risen Lord taught the same chapter at Bountiful (3 Nephi 13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/13?lang=eng'
    quote: 'Jesus teaches the Nephites the Lord’s Prayer—They are to lay up treas…'
  - where: thread
    claim: 'Alms, prayer and fasting are Jesus’s three examples of worship done in secret, for the Father, without desire for recognition'
    key: ludlow-father-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/father-sermon-mount'
    quote: 'Rather than doing things in public only to be seen (giving alms, praying, and fasting are the examples Jesus uses here), we should do these things privately (“in secret”), without desire for recognition.'
  - where: thread
    claim: 'The saying on the eye belongs between the treasure saying and the mammon saying'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'Thus, it is completely appropriate that Christ’s comment about having a good eye appears between his statements “Lay not up for yourselves treasure upon earth” (Matthew 6:19) and “Ye cannot serve God and mammon” (Matthew 6:24).'
  - where: thread
    claim: 'Verses 25–34 ask people living at survival level to trust God to provide'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'He was asking them to trust that God was well aware of his clients’ needs and would provide for their physical and spiritual well-being.'
  - where: setting
    claim: 'The JST appendix prints four passages of Matthew 6'
    key: jst-matt-6
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/6?lang=eng'
    quote: 'The Lord does not lead us into temptation. … If our eyes are single to the glory of God, our whole bodies will be filled with light. … Jesus warns His disciples of the difficulty of their work … We should seek first to build the kingdom of God.'
  - where: thread
    claim: 'The hearers lived at survival level'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'Peasants lived at survival level, which meant that a drought, a plague of locusts, or crop failure could threaten their very existence.'
  - where: section 2 plain
    claim: '“Closet” rendered “inner room”: the store-closet of the house'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/6.htm'
    quote: '(6) Enter into thy closet.—Literally, the store-closet of thy house.'
  - where: section 2 plain
    claim: '“Vain repetitions” rendered “babble on with empty words”'
    key: thayer
    url: 'https://biblehub.com/greek/945.htm'
    quote: 'b. to repeat the same things over and over, to use many and idle words, to babble, prate'
  - where: section 3 plain
    claim: '“Daily bread” rendered “the bread we need”'
    key: thayer
    url: 'https://biblehub.com/greek/1967.htm'
    quote: 'food for the morrow, i. e. necessary or sufficient food.'
  - where: section 5 plain
    claim: '“Rust” rendered “decay”'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/6.htm'
    quote: 'The second word is not so much the specific “rust” of metals, as the decay which eats into and corrodes all the perishable goods of earth.'
  - where: section 5 plain
    claim: '“Break through” rendered “dig through the walls”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/6?lang=eng'
    quote: 'dig through (as an earthen wall)'
  - where: section 5 plain
    claim: '“Single” rendered “single and sound”'
    key: thayer
    url: 'https://biblehub.com/greek/573.htm'
    quote: 'of the eye, good, fulfilling its office, sound: Matthew 6:22; Luke 11:34'
  - where: section 5 plain
    claim: '“Mammon” rendered “wealth”'
    key: thayer
    url: 'https://biblehub.com/greek/3126.htm'
    quote: 'riches: Matthew 6:24 and Luke 16:13'
  - where: section 6 plain
    claim: '“Take no thought” rendered “do not be anxious”'
    key: thayer
    url: 'https://biblehub.com/greek/3309.htm'
    quote: 'a. to be anxious; to be troubled with cares: absolutely, Matthew 6:27, 31; Luke 12:25'
  - where: section 6 plain
    claim: '“Stature” may be length of life'
    key: thayer
    url: 'https://biblehub.com/greek/2244.htm'
    quote: 'a. universally: Matthew 6:21; Luke 12:25 (in these passages, ''term or length of life''; but others refer them to 2 below'

  - where: 'note 6:2 “Giving without the applause”'
    claim: 'Public recognition of a gift was expected; Jesus’s teaching would have been shocking'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'Even with smaller, personal gifts, public acknowledgment was an essential element of a grateful response. In this context, Christ’s statement … would have been shocking. Christ negated the very reason for giving alms and challenged the conventional expression of a core value.'
  - where: 'note 6:2 “Giving without the applause”'
    claim: 'Cities honored givers with proclamations, seats of honor, inscriptions, statues'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'cities would show their gratitude through public recognition: through proclamations of gratitude, seats of honor at a theater, public inscriptions, or in exceptional cases a statue of the giver.'
  - where: 'note 6:2 “Giving without the applause”'
    claim: 'No trace of a literal trumpet; a figure of speech for a parade of benevolence'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/6.htm'
    quote: 'the best scholars have found no trace of any such practice in Jewish literature … There is no reason, however, for taking the words so literally. … there was a parade of benevolence which practically summoned men to gaze and admire.'

  - where: 'note 6:4 “The Father who sees in secret”'
    claim: 'The Father is “in secret” and sees in secret; may mean He is in heaven, behind the veil, as in D&C 38:7'
    key: ludlow-father-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/father-sermon-mount'
    quote: 'it could denote the veil that separates us from the Father so, in a sense, he is “hidden” from us and yet can observe and bless us as expressed in Doctrine and Covenants 38:7: “I am in your midst and ye cannot see me.”'
  - where: 'note 6:4 “The Father who sees in secret”'
    claim: 'Jesus ministered the same way; refused to make a show at the Feast of Tabernacles and at the pinnacle'
    key: ludlow-father-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/father-sermon-mount'
    quote: 'This was the way Jesus performed his ministry. Although Jesus performed many miracles in front of multitudes, he did not do them to attract more followers or create a public spectacle (usually he told those healed not to tell anyone). … But Jesus refused to go under these pretenses.'

  - where: 'note 6:7 “Vain repetitions”'
    claim: 'battologeō: to stammer; to repeat the same things, babble; explained by “much speaking”'
    key: thayer
    url: 'https://biblehub.com/greek/945.htm'
    quote: 'b. to repeat the same things over and over, to use many and idle words, to babble, prate; so Matthew 6:7, where it is explained by ἐν τῇ πολυλογία'
  - where: 'note 6:7 “Vain repetitions”'
    claim: 'The word probably imitates the sound of babbling'
    key: thayer
    url: 'https://biblehub.com/greek/945.htm'
    quote: 'it seems fax more probable that the word is onomatopoetic.'
  - where: 'note 6:7 “Vain repetitions”'
    claim: 'Elder Nelson: the prayer is a pattern, not a piece to recite repetitively'
    key: nelson-lords-prayers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/lessons-from-the-lords-prayers?lang=eng'
    quote: 'Thus, the Lord’s Prayer serves as a pattern to follow and not as a piece to memorize and recite repetitively.'

  - where: 'note 6:8 “Why ask, if He already knows?”'
    claim: 'Prayer secures blessings God is willing to grant but makes conditional on asking'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant but that are made conditional on our asking for them.'
  - where: 'note 6:8 “Why ask, if He already knows?”'
    claim: 'Prayer brings the Father’s will and the child’s into correspondence; natural once we know He is our Father'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'As soon as we learn the true relationship in which we stand toward God (namely, God is our Father, and we are His children), then at once prayer becomes natural and instinctive on our part (Matt. 7:7–11). … Prayer is the act by which the will of the Father and the will of the child are brought into correspondence with each other.'

  - where: 'note 6:9 “A pattern, given again at Bountiful”'
    claim: '“After this manner” makes the prayer a pattern'
    key: nelson-lords-prayers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/lessons-from-the-lords-prayers?lang=eng'
    quote: 'The Lord prefaced His prayer by first asking His followers to avoid “vain repetitions” and to pray “after this manner.” Thus, the Lord’s Prayer serves as a pattern to follow and not as a piece to memorize and recite repetitively.'
  - where: 'note 6:9 “A pattern, given again at Bountiful”'
    claim: 'The Nephite prayer lacks “Thy kingdom come” and the request for bread'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/13?lang=eng'
    quote: 'After this manner therefore pray ye: Our Father who art in heaven, hallowed be thy name. … Thy will be done on earth as it is in heaven. … And forgive us our debts, as we forgive our debtors.'
  - where: 'note 6:9 “A pattern, given again at Bountiful”'
    claim: 'Welch: no need at Bountiful to pray “Thy kingdom come,” for the kingdom had come'
    key: welch-sermon-differences
    url: 'https://scripturecentral.org/archive/books/book-chapter/sermon-temple-and-sermon-mount-differences'
    quote: 'there was no need in Bountiful for Jesus to instruct the people to pray, “Thy kingdom come” (Matthew 6:10), a phrase missing from the Lord’s Prayer in the Sermon at the Temple (see 3 Nephi 13:9–13), for God’s kingdom had already come both in heaven through Christ’s victory over death and on earth that day in their midst.'
  - where: 'note 6:9 “A pattern, given again at Bountiful”'
    claim: 'Welch: if the bread petition looks to the coming kingdom’s feast, it too fits the postresurrection setting'
    key: welch-sermon-differences
    url: 'https://scripturecentral.org/archive/books/book-chapter/sermon-temple-and-sermon-mount-differences'
    quote: 'Jesus might have considered this petition unsuitable in the context of the Sermon at the Temple, since the kingdom had in one sense already come. His appearance at that time in Bountiful was a realized eschatological event.'

  - where: 'note 6:11 “Daily bread”'
    claim: 'epiousios is found only here and in Luke 11:3, not in ordinary speech'
    key: thayer
    url: 'https://biblehub.com/greek/1967.htm'
    quote: 'a word found only in Matthew 6:11 and Luke 11:3 … Origen testifies (de orat. 27) that the word was not in use in ordinary speech, and accordingly seems to have been coined by the Evangelists themselves.'
  - where: 'note 6:11 “Daily bread”'
    claim: 'Thayer prefers “food for the morrow,” i.e. sufficient food, answering to “this day” and to 6:34'
    key: thayer
    url: 'https://biblehub.com/greek/1967.htm'
    quote: 'ἄρτος ἐπιούσιος is equivalent to ἄρτος τῆς ἐπιουσης ἡμέρας, food for the morrow, i. e. necessary or sufficient food. Thus, ἐπιούσιον, and σήμερον, admirably answer to each other … harmonizes with it finely'
  - where: 'note 6:11 “Daily bread”'
    claim: 'An early reading took the bread as the bread of the great Tomorrow, the bread of life'
    key: welch-sermon-differences
    url: 'https://scripturecentral.org/archive/books/book-chapter/sermon-temple-and-sermon-mount-differences'
    quote: 'one of the earliest interpretations of it (supported by the early fragmentary Gospel of the Hebrews) was eschatological: “mahar … meant not only the next day but also the great Tomorrow, the final consummation. Accordingly, Jerome is saying, the ‘bread for tomorrow’ was not meant as earthly bread but as the bread of life”'
  - where: 'note 6:11 “Daily bread”'
    claim: 'Elder Nelson: daily bread includes spiritual nourishment; bread of life; the sacrament'
    key: nelson-lords-prayers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/lessons-from-the-lords-prayers?lang=eng'
    quote: 'His request for “daily bread” includes a need for spiritual nourishment as well. Jesus, who called Himself “the bread of life,” gave a promise: “He that cometh to me shall never hunger.”'

  - where: 'note 6:12 “Debts and trespasses”'
    claim: 'Verse 12 says “debts”/“debtors” (opheilēmata, opheiletais); verse 14 uses a different word, paraptōmata; Tyndale and the JST read “trespasses”'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'the Greek words used are not the same: verse 12 is literally “debts” (opheilēmata) and “debtors” (opheiletais), while verse 14 is a “sin” or “misdeed” (paraptōmata). … “trespasses” adds powerfully to the message of the prayer, turning it from a mortal obligation to an eternal one.'
  - where: 'note 6:12 “Debts and trespasses”'
    claim: 'JST reading of 6:12'
    key: nelson-lords-prayers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/lessons-from-the-lords-prayers?lang=eng'
    quote: '“Forgive us our trespasses, as we forgive those who trespass against us,” and'

  - where: 'note 6:13 “Lead us not into temptation”'
    claim: 'JST: suffer us not to be led into temptation; heading: the Lord does not lead us into temptation'
    key: jst-matt-6
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/6?lang=eng'
    quote: 'The Lord does not lead us into temptation. … And suffer us not to be led into temptation, but deliver us from evil.'
  - where: 'note 6:13 “Lead us not into temptation”'
    claim: 'Elder Nelson: surely we would not be led into temptation by Deity'
    key: nelson-lords-prayers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/lessons-from-the-lords-prayers?lang=eng'
    quote: 'The clarification on temptation is helpful, for surely we would not be led into temptation by Deity. The Lord said, “Watch and pray, that ye enter not into temptation.”'
  - where: 'note 6:13 “Lead us not into temptation”'
    claim: 'The Syriac Peshitta has a similar reading; no Greek manuscript; JST made by the Spirit, not manuscripts'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'No ancient Greek manuscripts support this change … Nevertheless, the JST change here is supported by an ancient source. Joseph Smith’s corrections were made by the Spirit of God not by deciphering a collection of early and often contradictory manuscripts.'

  - where: 'note 6:13 “Lead us not into temptation”'
    claim: 'The footnote gives the Syriac reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/6?lang=eng'
    quote: 'Syriac: do not let us enter into temptation.'
  - where: 'note 6:13 “The closing words of praise”'
    claim: 'The earlier Greek manuscripts lack the doxology, as does Luke 11:4; most critics think it was added later'
    key: welch-sermon-greek
    url: 'https://scripturecentral.org/archive/books/book-chapter/sermon-temple-and-greek-new-testament-manuscripts'
    quote: 'It is well-known that the earlier Greek manuscripts have no doxology at the end of the Lord’s Prayer; they end abruptly with “deliver us from evil.” … most textual critics find it easiest to believe that the phrase was introduced later into that text.'
  - where: 'note 6:13 “The closing words of praise”'
    claim: 'Jesus very probably ended his prayers with a doxology; a Jewish prayer ending without praise would have been highly irregular'
    key: welch-sermon-greek
    url: 'https://scripturecentral.org/archive/books/book-chapter/sermon-temple-and-greek-new-testament-manuscripts'
    quote: 'For many circumstantial reasons, however, no one seems to doubt that Jesus probably pronounced a doxology of some kind at the end of his prayers. … First, it would have been highly irregular at the time of Jesus to end a Jewish prayer without some words in praise of God.'
  - where: 'note 6:13 “The closing words of praise”'
    claim: 'Temple doxology on the Day of Atonement; may explain its presence at the Bountiful temple'
    key: welch-sermon-greek
    url: 'https://scripturecentral.org/archive/books/book-chapter/sermon-temple-and-greek-new-testament-manuscripts'
    quote: 'In the sacred matters in the temple, one did not simply answer “Amen.” … This may be a factor in explaining why the prayer here at the temple in Bountiful includes the doxology, but the instruction given by Jesus on prayer out in the open in Luke 11 does not.'
  - where: 'note 6:13 “The closing words of praise”'
    claim: 'The doxology follows the form of David’s blessing in 1 Chronicles 29:10–13'
    key: welch-sermon-greek
    url: 'https://scripturecentral.org/archive/books/book-chapter/sermon-temple-and-greek-new-testament-manuscripts'
    quote: 'Third, the doxology in the KJV and Sermon at the Temple seems to have followed a traditional form, reflected in 1 Chronicles 29:10–13, as is widely observed.'
  - where: 'note 6:13 “The closing words of praise”'
    claim: 'JST keeps the doxology and adds “forever and forever”'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: '“Deliver us from evil: For thine is the kingdom, and the power, and the glory, forever and forever. Amen” (Matthew 6:13).'
  - where: 'note 6:13 “The closing words of praise”'
    claim: '3 Nephi 13:13 has the doxology'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/13?lang=eng'
    quote: 'For thine is the kingdom, and the power, and the glory, forever. Amen.'

  - where: 'note 6:14 “Forgiven as we forgive”'
    claim: 'President Hinckley pleaded with those nurturing enmity to ask the Lord for strength to forgive, and quoted Matt. 6:14–15'
    key: hinckley-required-to-forgive
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/10/of-you-it-is-required-to-forgive?lang=eng'
    quote: 'I plead with you to ask the Lord for strength to forgive. This expression of desire will be of the very substance of your repentance. It may not be easy, and it may not come quickly. But if you will seek it with sincerity and cultivate it, it will come.'
  - where: 'note 6:14 “Forgiven as we forgive”'
    claim: 'Peace follows'
    key: hinckley-required-to-forgive
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/10/of-you-it-is-required-to-forgive?lang=eng'
    quote: 'There will come into your heart a peace otherwise unattainable. That peace will be the peace of Him who said:'
  - where: 'note 6:14 “Forgiven as we forgive”'
    claim: 'Elder Nelson: to be forgiven one must first forgive (D&C 82:1)'
    key: nelson-lords-prayers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/lessons-from-the-lords-prayers?lang=eng'
    quote: 'He said to His servants, “Inasmuch as you have forgiven one another your trespasses, even so I, the Lord, forgive you.” In other words, if one is to be forgiven, one must first forgive.'

  - where: 'note 6:17 “Anoint thine head, and wash thy face”'
    claim: 'Fasting customs included not washing the face or anointing; prophets warned of formality'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'Along with the fasting were often combined other ceremonies, such as rending of the garments, putting on sackcloth, refraining from washing the face or anointing with oil (2 Sam. 12:20; 1 Kgs. 21:27; Isa. 58:5). All such observances were, of course, liable to become mere formalities'
  - where: 'note 6:17 “Anoint thine head, and wash thy face”'
    claim: 'The Day of Atonement appears to be the only fast ordered by the law; later fasting a regular custom'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law. Other fasts were instituted during the exile (Zech. 7:3–5; 8:19); and after the return, fasting is shown to be a regular custom (Luke 5:33; 18:12). It was regarded as a natural way of showing sorrow.'

  - where: 'note 6:22 “A single eye”'
    claim: 'haplous: simple, single, without folds; of the eye, sound'
    key: thayer
    url: 'https://biblehub.com/greek/573.htm'
    quote: 'simple, single (in which there is nothing complicated or confused; without folds (cf. Trench, § lvi.)); whole; of the eye, good, fulfilling its office, sound: Matthew 6:22; Luke 11:34'
  - where: 'note 6:22 “A single eye”'
    claim: 'A good eye meant generosity; an evil eye, envy and greed'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: '“Single” is the translation of the Greek word haplous, which may also be translated as “healthy” or “good.” … On the other hand, an “evil eye” is an idiom for envy and greed.'
  - where: 'note 6:22 “A single eye”'
    claim: 'A person with an evil eye was miserly and stingy'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'A person with an evil eye—a person who was miserly, stingy, and jealous—would have a low honor rating.'
  - where: 'note 6:22 “A single eye”'
    claim: 'JST: single to the glory of God'
    key: jst-matt-6
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/6?lang=eng'
    quote: 'The light of the body is the eye; if therefore thine eye be single to the glory of God, thy whole body shall be full of light.'
  - where: 'note 6:22 “A single eye”'
    claim: 'The JST says which purpose the eye is to be single to'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'The KJV discusses our eye being “single,” which is the Greek haplous, meaning “being motivated by singleness of purpose.” [11] The JST clarifies which purpose we must be dedicated to in order to receive the promised blessing'

  - where: 'note 6:24 “God and mammon”'
    claim: 'Mammon: Aramaic for riches, apparently from a root meaning “what is trusted in”; personified and opposed to God'
    key: thayer
    url: 'https://biblehub.com/greek/3126.htm'
    quote: 'mammon (Chaldean מָאמונָא, to be derived, apparently, from אָמַן; hence, what is trusted in … riches: Matthew 6:24 and Luke 16:13 (where it is personified and opposed to God'
  - where: 'note 6:24 “God and mammon”'
    claim: 'A client with two rival patrons had to choose; so with God and mammon'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'If this were to happen, a client would ultimately have to choose between the two patrons, proving loyal to one and disloyal to the other. Such would be the case if a person entered into a patron-client relationship with God and with mammon.'
  - where: 'note 6:24 “God and mammon”'
    claim: 'The saying on two masters is about what we love and serve most, and prefaces “seek ye first”'
    key: lane-kingdom-god
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/kingdom-god'
    quote: 'Christ’s teaching about seeking first the kingdom of God is specifically prefaced by the question of what we love and serve the most.'

  - where: 'note 6:25 “Take no thought”'
    claim: 'merimnaō: to be anxious, troubled with cares, about sustaining life'
    key: thayer
    url: 'https://biblehub.com/greek/3309.htm'
    quote: 'a. to be anxious; to be troubled with cares: absolutely, Matthew 6:27, 31; Luke 12:25 … τῇ ψυχή, about sustaining life, τῷ σώματι, Matthew 6:25'
  - where: 'note 6:25 “Take no thought”'
    claim: 'In 3 Nephi the words are addressed to the Twelve'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/13?lang=eng'
    quote: 'he looked upon the twelve whom he had chosen, and said unto them: Remember the words which I have spoken. For behold, ye are they whom I have chosen to minister unto this people. Therefore I say unto you, take no thought for your life'
  - where: 'note 6:25 “Take no thought”'
    claim: 'Welch: 3 Nephi 13:25–34 addressed solely to the Twelve'
    key: welch-sermon-differences
    url: 'https://scripturecentral.org/archive/books/book-chapter/sermon-temple-and-sermon-mount-differences'
    quote: 'The fact that the words in 3 Nephi 13:25–34 were addressed solely to “the twelve whom he had chosen” (3 Nephi 13:25)'
  - where: 'note 6:25 “Take no thought”'
    claim: 'JST: go into the world, care not for the world; the Father will provide'
    key: jst-matt-6
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/6?lang=eng'
    quote: 'Go ye into the world, and care not for the world; for the world will hate you, and will persecute you … And your heavenly Father will provide for you, whatsoever things ye need for food'
  - where: 'note 6:25 “Take no thought”'
    claim: 'The promise was food and clothing so the disciples could complete their missions'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'But it is also a commission to carry on, even going house to house, despite those difficulties. The promised blessing for carrying the message to the people was that the Lord would provide food and clothing so they could complete their missions.'
  - where: 'note 6:25 “Take no thought”'
    claim: 'Peasants lived at survival level'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'Peasants lived at survival level, which meant that a drought, a plague of locusts, or crop failure could threaten their very existence.'

  - where: 'note 6:27 “One cubit unto his stature”'
    claim: 'hēlikia: age, length of life in these passages; others take it as stature'
    key: thayer
    url: 'https://biblehub.com/greek/2244.htm'
    quote: '1. age, time of life; … a. universally: Matthew 6:21; Luke 12:25 (in these passages, ''term or length of life''; but others refer them to 2 below'
  - where: 'note 6:27 “One cubit unto his stature”'
    claim: 'The second sense is stature (Luke 19:3)'
    key: thayer
    url: 'https://biblehub.com/greek/2244.htm'
    quote: '2. stature (Demosthenes, Plutarch, others): τῇ ἡλικία μικρός, Luke 19:3'

  - where: 'note 6:33 “Seek ye first”'
    claim: 'JST: seek first to build up the kingdom and establish His righteousness'
    key: jst-matt-6
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/6?lang=eng'
    quote: 'Wherefore, seek not the things of this world but seek ye first to build up the kingdom of God, and to establish his righteousness, and all these things shall be added unto you.'
  - where: 'note 6:33 “Seek ye first”'
    claim: 'LeFevre: the JST makes it a call to action; early revelations (D&C 6:6) use similar language'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'But the JST turns that into a statement of work, a call to action, and a setting of priorities … Indeed, some of the earliest revelations predating the JST contain a similar call to action, including Doctrine and Covenants 6:6; 11:6; 12:6; 14:6'
  - where: 'note 6:33 “Seek ye first”'
    claim: 'Lane: Christ does not say needs don’t matter; seeking Him first changes how we live with them'
    key: lane-kingdom-god
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/kingdom-god'
    quote: 'Christ is not saying that we and other people do not need food and clothing, but instead he is teaching that by seeking for him first we will then be able to live in the world with our needs and our brothers’ and sisters’ needs in a different way.'
  - where: 'note 6:33 “Seek ye first”'
    claim: 'Lane reads Jacob 2:19 as the same order: Christ first, then riches for the intent to do good'
    key: lane-kingdom-god
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/kingdom-god'
    quote: 'As Christ increasingly becomes our master, our relationship to riches changes: “after ye have obtained a hope in Christ ye shall obtain riches, if ye seek them; and ye will seek them for the intent to do good” (Jacob 2:19).'

  - where: 'note 6:12 “Debts and trespasses”'
    claim: 'Tyndale rendered verse 12 “trespasses”; a figurative, not the primary, meaning of the Greek'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'William Tyndale, the first man to translate the New Testament into English from Greek, interpreted this verse: “And forgeve us oure trespases, even as we forgeve them which trespas us.” [12] Tyndale’s and Joseph Smith’s word “trespasses” is acknowledged as a metaphorical meaning of the Greek in verse 12, but not the primary or preferred translation.'
  - where: 'note 6:13 “The closing words of praise”'
    claim: 'Many modern translations drop the doxology'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'Most of the oldest manuscripts do not have it at all. [15] This has led the editors of many modern Bible translations, such as the New International Version and the New Revised Standard Version, to drop the phrase altogether.'
  - where: 'note 6:24 “God and mammon”'
    claim: 'It was common for a client to have several patrons'
    key: hardison-sociocultural
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sociocultural-context-sermon-mount'
    quote: 'It was common for a client to have several patrons. Consequently, a person would have to be careful not to have two patrons who were enemies or rivals.'
