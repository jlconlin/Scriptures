chapter: 14
claims:
  - where: setting
    claim: 'Antipas received Galilee and Perea at the division of Herod the Great’s kingdom'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'His kingdom was then divided between three of his sons: Archelaus, who received Judea, Idumea, and Samaria; Antipas, who had Galilee and Perea; and Philip, who had the northeast districts of Palestine.'
  - where: setting
    claim: 'The Twelve returned from their mission near the time of John’s execution'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'the return of the Twelve occurred near the time of the infamous execution of John the Baptist in prison.'
  - where: setting
    claim: 'The feeding took place in spring, near Passover'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It was the springtime, near the recurrence of the annual Passover festival, the season of grass and flowers.'
  - where: setting
    claim: 'Many place the desert place near Bethsaida Julias, east of the Jordan'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It is held by many Bible students that Bethsaida, in the desert region adjoining which Jesus and the Twelve sought rest and seclusion, was the town of that name in Perea, on the eastern side of the Jordan'
  - where: thread
    claim: 'Herod’s fear came from guilt'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'He heard, with fear due to inward conviction of guilt, of the marvelous work wrought by Jesus, and in terror averred that Christ could be none other than John Baptist returned from the tomb.'
  - where: thread
    claim: 'Bread in the wilderness and crossing the sea recall Moses'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Moses’s miraculous crossing of the Red Sea on dry ground, which Jesus echoes by crossing the Sea of Galilee, not by dividing it but by walking on it'
  - where: thread
    claim: '“It is I” is the first explicit hint of His identity as Jehovah'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'when Jesus says, as He approaches the boat with the fearful disciples, “It is I” (ego eimi), He is giving his first explicit hint of His real identity.'
  - where: section 3 plain
    claim: 'The fourth watch: between three and six in the morning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/14?lang=eng'
    quote: 'between three and six in the morning'
  - where: 'note 14:1 “Herod the tetrarch”'
    claim: 'Antipas is the Gospels’ “Herod the tetrarch”; built Tiberias; named in Luke 23 too'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'Antipas (called in the New Testament “Herod the tetrarch”) built as his capital Tiberias on the Sea of Galilee; he is frequently mentioned in the Gospels (Matt. 14:1; Mark 6:14; Luke 9:7; 13:31; 23:7–15).'
  - where: 'note 14:1 “Herod the tetrarch”'
    claim: 'Herod the Great died soon after the massacre at Bethlehem; his kingdom divided among three sons'
    key: bd-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
    quote: 'In the same year in which he gave the order for the massacre of the infants at Bethlehem, he had Antipater, another of his own sons, put to death. A few months later Herod himself died.'
  - where: 'note 14:1 “Herod the tetrarch”'
    claim: 'Tetrarch: ruler of a fourth part, used for other fractions'
    key: bd-tetrarch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tetrarch?lang=eng'
    quote: 'The word originally meant the ruler of the fourth part of a country but was also used when the part governed was some other fraction of the whole.'
  - where: 'note 14:2 “Why Herod thought John had risen”'
    claim: 'Herod, conscience-stricken, insisted it was John risen'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'His fawning courtiers essayed to allay his fears by saying that Jesus was Elijah, or some other of the prophets whose advent had been predicted; but the conscience-stricken Herod said: “It is John whom I beheaded: he is risen from the dead.”'
  - where: 'note 14:2 “Why Herod thought John had risen”'
    claim: 'Guilt overcame Herod’s skepticism; Jesus worked signs John never worked'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'The superstitious terror of a conscience stained with guilt is stronger than his scepticism as a Sadducee … To him the new Prophet, working signs and wonders which John had never worked, was but the re-appearance of the man whom he had murdered.'
  - where: 'note 14:4 “Why the marriage was unlawful”'
    claim: 'Herodias, married to Herod Philip with a daughter Salome, left him for Antipas; John was killed for rebuking it'
    key: bd-herodias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herodias?lang=eng'
    quote: 'married to her uncle, Herod Philip, by whom she had a daughter Salome (Matt. 14:6). She eloped in order to live as the wife of her step-uncle, Herod Antipas. It was for his rebuke of this crime that John the Baptist was put to death'
  - where: 'note 14:4 “Why the marriage was unlawful”'
    claim: 'This Philip is not the tetrarch; Herodias niece to both husbands; Antipas divorced Aretas’s daughter; the marriage adulterous and incestuous by the law; John in the spirit of Elijah'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: '(not the Tetrarch of Trachonitis, Luke 3:1, but son of Herod the Great by Mariamne … holding no official position as a ruler) … was therefore niece to both her husbands. … The marriage, at once adulterous and by the Mosaic law doubly incestuous'
  - where: 'note 14:4 “Why the marriage was unlawful”'
    claim: 'Antipas’s first wife was a daughter of Aretas; John spoke with the spirit of Elijah before Ahab'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'His first wife was a daughter of Aretas, an Arabian king or chief … The prophetic spirit of the Baptist, the very spirit of Elijah in his dealings with Ahab and Jezebel, made him the spokesman of the general feeling'
  - where: 'note 14:5 “Did Herod want John dead?”'
    claim: 'A struggle of conscience against passion, like Ahab with Elijah'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'There was yet a struggle of conscience against passion in the weak and wicked tetrarch, as there was in Ahab in his relations with Elijah.'
  - where: 'note 14:5 “Did Herod want John dead?”'
    claim: 'Josephus: Herod feared John’s influence might bring rebellion; sent him to Macherus and killed him; Jews saw Herod’s defeat as punishment'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-18.html'
    quote: 'Herod, who feared lest the great influence John had over the people might put it into his power and inclination to raise rebellion … Accordingly he was sent a prisoner, out of Herod’s suspicious temper, to Macherus; the castle I before mentioned; and was there put to death.'
  - where: 'note 14:5 “Did Herod want John dead?”'
    claim: 'Josephus: some Jews thought the destruction of Herod’s army a punishment for John’s death'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-18.html'
    quote: 'Now some of the Jews thought that the destruction of Herod’s army came from God: and that very justly, as a punishment of what he did against John, that was called the baptist.'
  - where: 'note 14:9 “Why Herod kept his oath”'
    claim: 'Herod probably expected a jewel or a city, not this'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'A jewel, a bracelet, a palace, or a city, were probably in his thoughts as what she was likely to ask and he would gladly give.'
  - where: 'note 14:9 “Why Herod kept his oath”'
    claim: 'Not the oath so much as fear of the guests; false regard for opinion an incentive to guilt'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'It was not so much his regard for the oath which he had taken … but his shrinking from the taunt, or whispered jest, or contemptuous gesture of the assembled guests … an incentive to guilt instead of a restraint.'
  - where: 'note 14:9 “Why Herod kept his oath”'
    claim: 'The daughter was Salome'
    key: bd-herodias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herodias?lang=eng'
    quote: 'by whom she had a daughter Salome (Matt. 14:6)'
  - where: 'note 14:13 “Why Jesus withdrew”'
    claim: 'Motives: personal grief and avoiding popular excitement over John’s death'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'the strong personal emotion which the death of one whom Jesus had known and loved could not fail to cause, and (2) the wish to avoid being the centre of the popular excitement which the death of John was likely to cause'
  - where: 'note 14:13 “Why Jesus withdrew”'
    claim: 'The returning apostles had no leisure; Jesus took them apart to rest'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The apostles must have heard in gladness the Lord’s invitation: “Come ye yourselves apart into a desert place, and rest awhile.”'
  - where: 'note 14:13 “Why Jesus withdrew”'
    claim: '“Desert place” is erēmos topos, a wilderness'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'in a locale that the synoptics identify as a wilderness (erēmos topos, KJV “desert place”), which strengthens the association of Jesus with the new Moses.'
  - where: 'note 14:13 “Why Jesus withdrew”'
    claim: 'Jesus wanted to be alone in grief, yet had compassion on the crowd'
    key: swift-three-stories
    url: 'https://rsc.byu.edu/my-redeemer-lives/three-stories'
    quote: 'This news has apparently caused Jesus to want to be alone and contemplate what has occurred. Yet, when all these people follow him, he does not send them away, nor does he simply tolerate their presence, but he has compassion toward them'
  - where: 'note 14:19 “Bread in the wilderness”'
    claim: 'Heavenly bread for Moses’ followers, loaves for Jesus’s'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Heavenly bread and miraculous loaves were provided in abundance for both Moses’s and Jesus’s followers (see Exodus 16:16; Matthew 14:19–21; 15:32–39).'
  - where: 'note 14:19 “Bread in the wilderness”'
    claim: 'The wilderness feeding recalls the Lord’s sustaining Israel with Moses'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'imagery of deliverance and bread that makes Jesus’s feeding the multitude in the wilderness so reminiscent of the Lord’s sustaining the children of Israel while they were in the wilderness with Moses.'
  - where: 'note 14:19 “Bread in the wilderness”'
    claim: 'The crowd recognized the Prophet foretold by Moses'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: '“This is of a truth the prophet that should come into the world,” said they—the Prophet whose coming had been foretold by Moses and who should be like unto himself.'
  - where: 'note 14:19 “Bread in the wilderness”'
    claim: 'A manifestation of creative power; the fragments exceeded the original store'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It was a manifestation of creative power, by which material elements were organized and compounded to serve a present and pressing need. The broken but unused portion exceeded in bulk and weight the whole of the original little store.'
  - where: 'note 14:19 “Bread in the wilderness”'
    claim: 'Twelve baskets: the cophinus, a small hand basket used by travellers'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'The basket here is the cophinus, a small basket carried in the hand, and often used by travellers to hold their food.'
  - where: 'note 14:22 “Why He sent the disciples away”'
    claim: 'The crowd would make Him king; He constrained the hesitant disciples, perhaps to protect them'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'The disciples hesitated to leave their Master; but He constrained them and they obeyed. His insistence … may have been due to a desire to protect the chosen disciples against possible infection by the materialistic and unrighteous designs of the throng to make Him king.'
  - where: 'note 14:22 “Why He sent the disciples away”'
    claim: 'The crowd’s wish reflected a political messianic expectation: deliverance from Herodian and Roman rule'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'presented a false Christology of who the Messiah would be—a political ruler—and what He would do—deliver them from Herodian rule and Roman occupation.'
  - where: 'note 14:22 “Why He sent the disciples away”'
    claim: 'An older reading: a renewal of the temptation in the wilderness'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'this nearness to a path of earthly greatness instead of that which led onward to the cross, He saw something like a renewal of the temptation in the wilderness, needing special communion with His Father'
  - where: 'note 14:25 “Walking on the sea”'
    claim: 'Head-wind; rowing all night; under four miles'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'They encountered a boisterous head-wind, which of course rendered impossible the use of sails … Though they had labored through the night they had progressed less than four miles on their course'
  - where: 'note 14:25 “Walking on the sea”'
    claim: 'Job 9:8: God alone treads on the waves'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Job states that it is God “which alone spreadeth out the heavens, and treadeth upon the waves of the sea” (Job 9:8).'
  - where: 'note 14:25 “Walking on the sea”'
    claim: 'Jesus does what is proper only to Jehovah, especially over nature'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'A major argument for Jesus being Jehovah incarnate is that He does what is proper only to Jehovah. This is particularly true in His relation to the natural world.'
  - where: 'note 14:25 “Walking on the sea”'
    claim: 'Echo of the Red Sea crossing'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Moses’s miraculous crossing of the Red Sea on dry ground, which Jesus echoes by crossing the Sea of Galilee, not by dividing it but by walking on it (Exodus 14:13–31; Matthew 14:24–33).'
  - where: 'note 14:25 “Walking on the sea”'
    claim: 'The walking corrects the crowd’s narrow messianic reading: He was far more'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Whereas the feeding miracle could be interpreted too narrowly, as a sign that Jesus was only a messianic king, His walking on the water and miraculous completion of the sea voyage serves as a sign that He was far more.'
  - where: 'note 14:27 ““It is I”: the name of God”'
    claim: 'ego eimi means “I am” or “I am he”; in Greek Isaiah it is the name of God; Isa. 45:18; 51:12'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Ego eimi means “I am” or “I am he.” In the latter half of Isaiah in the LXX, these words are understood as the name of the God who is Jehovah. For example, in Isaiah 45:18 the Hebrew uses the phrase ani YHWH'
  - where: 'note 14:27 ““It is I”: the name of God”'
    claim: 'Isa. 51:12 can be read “I am I AM who comforts you”; the first explicit hint'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'the former can be translated as “I am I AM who comforts you” and the latter as “I AM is the one who speaks.”'
  - where: 'note 14:27 ““It is I”: the name of God”'
    claim: 'He is I AM, Jehovah, who created and controls nature'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'He is I AM, Jehovah, the God of the Old Testament, and the one to whom these words specifically refer in Isaiah. He is the one who created and controls all of nature.'
  - where: 'note 14:29 “Peter on the water”'
    claim: 'The power by which Christ walked could work in others if their faith endured; the attempt demonstrated faith'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'the power by which Christ was able to walk the waves could be made operative in others, provided only their faith was enduring. … his attempt, though attended by partial failure, was a demonstration of the efficacy of faith in the Lord, such as no verbal teaching could ever have conveyed.'
  - where: 'note 14:29 “Peter on the water”'
    claim: 'President Hunter: he sank only when he took his eyes off the Master'
    key: hunter-beacon
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/10/the-beacon-in-the-harbor-of-peace?lang=eng'
    quote: 'Only when with wavering faith he removed his glance from the Master to look at the furious waves and the black gulf beneath him, only then did he begin to sink.'
  - where: 'note 14:29 “Peter on the water”'
    claim: 'He feared, then sank; he turned to the Lord instead of swimming'
    key: swift-three-stories
    url: 'https://rsc.byu.edu/my-redeemer-lives/three-stories'
    quote: 'Note that he does not begin to sink and then become afraid; he fears, and then he begins to sink. … Instead, he immediately turns to the Lord for help—and not just for help, but to be saved.'
  - where: 'note 14:29 “Peter on the water”'
    claim: 'One reading: Peter’s twice-repeated “Lord” stresses that Jesus is the Lord, Jehovah'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Initially, he asks Jesus (kyrie) to let him walk on the waves, and when he begins to sink he cries out in faith, “Lord [kyrie], save me,” stressing once again that Jesus is the Lord—Jehovah (14:30).'
  - where: 'note 14:33 “The disciples’ first confession”'
    claim: 'Only Matthew has the disciples worship and confess Him Son of God here; the line of witnesses through Matthew'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Only in Matthew’s account do we see Jesus’s disciples so dramatically affected by his walking on the water that they “worshipped him, saying, Of a truth thou art the Son of God” (14:33).'
  - where: 'note 14:33 “The disciples’ first confession”'
    claim: 'Satan and the demoniacs had already declared His identity'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Ironically, Satan along with his followers also declared Jesus’s true identity.'
  - where: 'note 14:33 “The disciples’ first confession”'
    claim: 'First time in Matthew the disciples call Him Son of God; perhaps moved by His saving Peter'
    key: swift-three-stories
    url: 'https://rsc.byu.edu/my-redeemer-lives/three-stories'
    quote: 'for the first time in Matthew, the disciples call him the Son of God. … But I believe it is just as likely that they worship him and proclaim his divinity because of what they witnessed between him and Peter'
  - where: 'note 14:36 “The hem of His garment”'
    claim: 'Their faith was like the woman’s; sanctity of the hem'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'is in line with that of the woman who was healed of her long-standing malady by so touching His robe … The desire to touch the hem of Christ’s robe may have been associated with this thought of sanctity attaching to the hem or border.'
  - where: christ
    claim: 'President Hunter: fix our eyes on Jesus or sink'
    key: hunter-beacon
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/10/the-beacon-in-the-harbor-of-peace?lang=eng'
    quote: 'if we look to the power and fury of those terrible and destructive elements around us rather than to him who can help and save us, then we shall inevitably sink in a sea of conflict and sorrow and despair.'
  - where: christ
    claim: 'Elder Talmage: the voice of the Deliverer comes to all who toil in faith'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'As came unto Peter and his terrified companions in the midst of the turbulent waters, so comes to all who toil in faith, the voice of the Deliverer—“It is I; be not afraid.”'
  - where: 'note 14:19 “Bread in the wilderness”'
    claim: 'The footnote to verse 20 points to Elisha’s feeding, 2 Kgs. 4:42–44'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/14?lang=eng'
    quote: '2 Kgs. 4:44 (42–44)'
  - where: thread
    claim: 'A false regard for the guests’ opinion moved Herod to guilt'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/14.htm'
    quote: 'A false regard for public opinion, for what people will say or think of us in our own narrow circle, was in this, as in so many other instances, an incentive to guilt instead of a restraint.'
  - where: thread
    claim: 'In Greek Isaiah ego eimi is the name of God'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'In the latter half of Isaiah in the LXX, these words are understood as the name of the God who is Jehovah.'
  - where: christ
    claim: 'President Hunter: fixing our eyes on Jesus, we might walk triumphantly'
    key: hunter-beacon
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/10/the-beacon-in-the-harbor-of-peace?lang=eng'
    quote: 'if as individual people, as families, communities, and nations, we could, like Peter, fix our eyes on Jesus, we too might walk triumphantly'
  - where: explore
    claim: 'President Hunter’s talk on the storm-tossed disciples and Peter'
    key: hunter-beacon
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/10/the-beacon-in-the-harbor-of-peace?lang=eng'
    quote: 'Peter exclaimed, “Lord, if it be thou, bid me come unto thee on the water.” And Christ’s answer to him was the same as to all of us: “Come.”'
