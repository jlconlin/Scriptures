    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'According to Matthew’s account, they were told of the very manner by which the Lord should die—that the Gentiles should crucify Him; yet they understood not.'
