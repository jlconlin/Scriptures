    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'This avouchment of the Savior’s approaching death and resurrection spoken in confidential certainty to the Twelve was the third of its kind'
