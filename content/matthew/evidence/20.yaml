    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'No general reversal is implied whereby all the late comers shall be advanced and all the early workers demoted.'
