  - where: 'note 20:1 “The answer to Peter’s question”'
    claim: 'The chapter division separates the parable from its occasion'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'The division of the chapter is here singularly unfortunate, as separating the parable both from the events which gave occasion to it and from the teaching which it illustrates.'
  - where: 'note 20:1 “The answer to Peter’s question”'
    claim: 'The parable was for the Twelve, called out by Peter’s question, a rebuke of the bargaining spirit'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'It was called out by Peter’s question, “What shall we have therefore?” It stands as truly in force today as when it was delivered by the Master, as a rebuke of the bargaining spirit in the Lord’s work.'
  - where: 'note 20:1 “The answer to Peter’s question”'
    claim: 'The Twelve answered without promise of a wage; a hint of the hireling’s spirit in Peter’s question; labor for the work, not the wage'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Was there not a suggestion of the hireling’s spirit in the query of even the first of the apostles, “What shall we have therefore?” The Twelve had been called into service early in the Savior’s ministry; they had responded to the call, without promise of even a penny'
  - where: 'note 20:1 “The answer to Peter’s question”'
    claim: 'Those who labor for the work rather than the wage are more enriched'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'But those who diligently labor, knowing that the Master will give to them whatever is right, and with thought for the work rather than for the wage, shall find themselves more bountifully enriched.'
  - where: 'note 20:1 “The answer to Peter’s question”'
    claim: 'Peter’s question and the first/last saying, Matt. 19:27, 30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/19?lang=eng'
    quote: 'But many that are first shall be last; and the last shall be first.'
  - where: 'note 20:2 “A penny, a day’s wage”'
    claim: 'The denarius, the common standard of value in Palestine, an adequate and just payment'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'the Roman denarius, then the common standard of value in Palestine'
  - where: 'note 20:2 “A penny, a day’s wage”'
    claim: 'An adequate and just payment'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'It was, that is, in itself, an adequate and just payment.'
  - where: 'note 20:2 “A penny, a day’s wage”'
    claim: 'The denarius the usual day’s wage'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'he gave a denarius, or Roman penny, worth about fifteen cents in our money, and the usual wage for a day’s work'
  - where: 'note 20:2 “A penny, a day’s wage”'
    claim: 'The denarion the standard day’s wage'
    key: sc-knowhy-670
    url: 'https://scripturecentral.org/knowhy/what-does-the-parable-of-the-laborers-in-the-vineyard-teach-about-gods-mercy'
    quote: 'a denarion, which was the standard day’s wage at the time'
  - where: 'note 20:2 “A penny, a day’s wage”'
    claim: 'A family lived on what was earned that day'
    key: holland-laborers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-laborers-in-the-vineyard?lang=eng'
    quote: 'In the time of the Savior, an average man and his family could not do much more than live on what they made that day. If you didn’t work or farm or fish or sell, you likely didn’t eat.'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'The hours of hiring, and the urgency of the harvest'
    key: holland-laborers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-laborers-in-the-vineyard?lang=eng'
    quote: 'After employing the first group at 6:00 in the morning, he returned at 9:00 a.m., at 12:00 noon, and at 3:00 in the afternoon, hiring more workers as the urgency of the harvest increased.'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'The eleventh hour about 5 p.m.'
    key: holland-laborers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-laborers-in-the-vineyard?lang=eng'
    quote: '“about the eleventh hour” (approximately 5:00 p.m.)'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'The working day about twelve hours, all but over'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'The working day, which did not commonly extend beyond twelve hours (John 11:9), was all but over'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'Hiring in the marketplace was common; the late workers were ready and not at fault; they went without terms'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'That they had not found work earlier in the day was no fault of theirs; they had been ready and willing, and had waited at the place where employment was most likely to be secured.'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'Hiring laborers in the marketplace was common to the time'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'The procedure of a householder going into the marketplace to hire laborers was common to the time and place'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'Hiring for part of a day was unusual'
    key: sc-knowhy-670
    url: 'https://scripturecentral.org/knowhy/what-does-the-parable-of-the-laborers-in-the-vineyard-teach-about-gods-mercy'
    quote: 'it is unusual in the sense that “an employer did not normally hire workers by the hour or for half days.”'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'Late hiring shows the urgency of the work'
    key: sc-knowhy-670
    url: 'https://scripturecentral.org/knowhy/what-does-the-parable-of-the-laborers-in-the-vineyard-teach-about-gods-mercy'
    quote: 'Hiring day workers late in the day shows how great and urgent the work is that the householder needs to have done.'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'Read with D&C 33:3, the eleventh hour can stand for the latter days'
    key: sc-knowhy-670
    url: 'https://scripturecentral.org/knowhy/what-does-the-parable-of-the-laborers-in-the-vineyard-teach-about-gods-mercy'
    quote: 'The eleventh hour, as evidenced in Doctrine and Covenants 33:3, would be the latter days, preparatory to the twelfth hour and second coming of the Lord.'
  - where: 'note 20:6 “The eleventh hour”'
    claim: 'D&C 33 addressed to Ezra and Northrop'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/33?lang=eng'
    quote: 'Behold, I say unto you, my servants Ezra and Northrop, open ye your ears and hearken to the voice of the Lord your God'
  - where: 'note 20:12 “Equal pay, and no one wronged”'
    claim: 'They complained not of being underpaid but that others got a full day’s pay; they saw the last paid'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'Then they complained; not because they had been underpaid, but because the others had received a full day’s pay for but part of a day’s work.'
  - where: 'note 20:12 “Equal pay, and no one wronged”'
    claim: 'The first saw the last paid first'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'as these saw their fellow-workers, who had served but an hour, receive each a penny, they probably exulted in the expectation of receiving a wage proportionately larger'
  - where: 'note 20:12 “Equal pay, and no one wronged”'
    claim: 'The wage at best is a free gift; all are in debt to God'
    key: talmage-jesus-christ-27
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-27?lang=eng'
    quote: 'the wage at best is a free gift; for on the basis of strict accounting who of us is not in debt to God?'
  - where: 'note 20:12 “Equal pay, and no one wronged”'
    claim: 'No one treated unfairly; the first received the wage agreed'
    key: holland-laborers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-laborers-in-the-vineyard?lang=eng'
    quote: 'First of all it is important to note that no one has been treated unfairly here. The first workers agreed to the full wage of the day, and they received it.'
  - where: 'note 20:12 “Equal pay, and no one wronged”'
    claim: 'Elder Holland: a story about God’s goodness and the Atonement'
    key: holland-laborers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-laborers-in-the-vineyard?lang=eng'
    quote: 'This is a story about God’s goodness, His patience and forgiveness, and the Atonement of the Lord Jesus Christ.'
  - where: 'note 20:12 “Equal pay, and no one wronged”'
    claim: 'The penny stands for eternal life; none could receive less or claim more'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/20.htm'
    quote: 'In the interpretation of the parable, the “penny,” as before, represents the eternal life of the kingdom of heaven. No true labourer could receive less; the longest life of labour could claim no more.'
