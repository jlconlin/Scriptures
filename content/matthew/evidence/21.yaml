chapter: 21
claims:
  - where: when
    claim: 'Talmage dates the entry to the Sunday of the last week'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'the fulfilment of which the evangelist, John, finds in the events of this memorable Sunday'
  - where: when
    claim: 'Talmage dates the fig tree to Monday and the challenge to authority to Tuesday'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'On the following day, that is on Tuesday, He returned to the temple with the Twelve, passing the withered fig tree on the way'
  - where: setting
    claim: 'Pilgrims came days before Passover to purify themselves and offer sacrifices; people wondered whether Jesus would appear while the hierarchy planned to seize Him'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'great numbers of people had come up to the city many days before the beginning of the Passover rites, in order that they might attend to matters of personal purification, and make good their arrears in the offering of prescribed sacrifices'
  - where: setting
    claim: 'Mark has Jesus look around and return to Bethany, clearing the temple the next day; Matthew places the clearing directly after the entry'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'While Mark delays his discussion of the temple incident until the next day for symbolic reasons, Matthew, paralleled by Luke, places Jesus’s cleansing of the temple directly after the triumphal entry'
  - where: setting
    claim: 'In Matthew the clearing after the entry is a royal act; the rulers’ challenge is placed right after the fig tree'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'by placing Jesus’s condemnation of the chief priests and elders immediately after the cursing of the fig tree, Matthew, along with Luke, highlights the failure of Jerusalem’s leadership'
  - where: setting
    claim: 'Latter-day Saint writers take John 2 and this as two clearings, near the start and in the last week'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'That was near the beginning of His public labor, and the vigorous action was among the first of His works to attract general attention; now, within four days of the cross, He cleared the courts again'
  - where: setting
    claim: 'A second Latter-day Saint writer reads the two cleansings as separate'
    key: ogden-jesus-temple
    url: 'https://www.churchofjesuschrist.org/study/ensign/1991/04/jesus-and-the-temple?lang=eng'
    quote: 'In the very early days of his ministry, he cleansed the Temple court of the merchandisers and money changers. (See John 2:13–16.) Then during his final week in mortality, he again'
  - where: thread
    claim: 'The entry, the clearing and the days after show Jesus acting with authority as the true King of Israel'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Both, however, continue the kingly phase that began with the triumphal entry on Palm Sunday, demonstrating Jesus’s acting with authority as the True King of Israel'
  - where: thread
    claim: 'Psalm 118 frames the chapter: the crowds’ “Save now” and the rejected stone Jesus quotes'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Whereas the cry of those who accepted Jesus was “Save now,” the line that Jesus quotes here challenges his opponents’ rejection of him'
  - where: thread
    claim: 'Jesus answered with a series of three stories; the tenants feared His authority as the lawful heir'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'the Master proceeded in calm deliberation to relate to them a series of three splendid stories, each of which they felt applied to themselves with incisive certainty'
  - where: thread
    claim: 'The son’s authority as heir'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'At last the Son had come in person; His authority they feared as that of the lawful heir'
  - where: thread
    claim: 'The Joseph Smith Translation has Jesus say “I am the stone”'
    key: jst-matt-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/21?lang=eng'
    quote: 'Verily, I say unto you, I am the stone, and those wicked ones reject me.'
  - where: thread
    claim: 'An old saying barred the blind and lame from the house (2 Sam. 5:8); the law barred disabled priests'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'which established a restriction that kept disabled priests from entering the central sacred areas'

  - where: 'note 21:1 “An entry planned to be read”'
    claim: 'The entry was an open proclamation, unlike His earlier guardedness'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'the public acceptance of the nation’s homage, and the acknowledgment of both kingly and Messianic titles, constituted an open and official proclamation of His divine investiture'
  - where: 'note 21:1 “An entry planned to be read”'
    claim: 'It was no accident; He knew beforehand'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'That the occasion was no accidental or fortuitous happening, of which He took advantage without preconceived intention, is evident. He knew beforehand what would be, and what He would do.'
  - where: 'note 21:1 “An entry planned to be read”'
    claim: 'David fled up the Mount of Olives weeping; Jesus reversed his route'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'When David fled Jerusalem following the revolt of his son Absalom, he rode a donkey out of the city and, before reaching the summit of the Mount of Olives, he wept over it (2 Sam 15:30).'
  - where: 'note 21:1 “An entry planned to be read”'
    claim: 'Solomon rode a donkey when anointed king while the people shouted “God save King Solomon”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'King Solomon also rode his donkey at the base of the Mount of Olives, where he was anointed king over Israel (1 Kgs 1:32–37). During the royal procession, his constituents shouted, “God save King Solomon,”'
  - where: 'note 21:1 “An entry planned to be read”'
    claim: 'Jesus’s acts follow Zechariah 14’s three-part pattern: Mount of Olives, judgment, temple cleansed'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Jesus’s activities mirror the three-part structure in Zechariah 14 that refers to the future divine messianic figure: (1) he arrives on the Mount of Olives, (2) he pronounces judgment on Israel, and (3) he enters Jerusalem and cleanses the temple.'
  - where: 'note 21:1 “An entry planned to be read”'
    claim: 'Zechariah 14:21 translated “no longer … traders”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'There shall no longer be traders in the house of the Lord of hosts on that day'
  - where: 'note 21:1 “An entry planned to be read”'
    claim: 'One of the few times He was recognized as Messiah; a foreshadowing of His return'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'the triumphal entry was one of the few times during his ministry when Jesus was recognized as the Messiah he actually was. Indeed, beyond its immediate significance, it was also a foreshadowing of his glorious return as King of kings'

  - where: 'note 21:5 “Zechariah''s lowly King”'
    claim: 'Matthew’s quotation joins Isaiah 62:11 to Zechariah 9:9 (the Church edition’s footnote gives both)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/62?lang=eng'
    quote: 'Say ye to the daughter of Zion, Behold, thy salvation cometh'
  - where: 'note 21:5 “Zechariah''s lowly King”'
    claim: 'He rode an ass in token of peace, not a war horse; the Romans saw nothing to fear'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'He came riding on an ass, in token of peace, acclaimed by the Hosanna shouts of multitudes; not on a caparisoned steed with the panoply of combat'
  - where: 'note 21:5 “Zechariah''s lowly King”'
    claim: 'The Romans saw nothing to fear; subjects waved branches, not weapons'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'But the Romans saw nothing to fear, perhaps much to smile at, in the spectacle of a King mounted upon an ass, and attended by subjects, who, though numerous, brandished no weapons'
  - where: 'note 21:5 “Zechariah''s lowly King”'
    claim: 'No move was made to stop Him; the Romans did not see a threat, and the leaders hesitated to arrest Him publicly'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'the Romans apparently did not think that this spontaneous action was much of a threat, whereas the Jewish leadership, recognizing the popularity of Jesus, was hesitant to cause an uproar among the people by arresting Jesus publicly'

  - where: 'note 21:7 “Two animals, one rider”'
    claim: 'The Joseph Smith Translation has Jesus sit on the colt only'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/21?lang=eng'
    quote: 'and brought the colt, and put on it their clothes; and Jesus took the colt and sat thereon; and they followed him.'
  - where: 'note 21:7 “Two animals, one rider”'
    claim: 'Matthew alone mentions both; the mother probably followed and kept the colt tractable'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'Matthew alone mentions both ass and colt; the other writers specify the latter only; most likely the mother followed as the foal was led away, and the presence of the dam probably served to keep the colt tractable.'
  - where: 'note 21:7 “Two animals, one rider”'
    claim: 'Zechariah’s parallelism means one donkey; Matthew portrays two to stress that the foal is young'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Both Zechariah’s original and the Genesis passage, using the poetic feature of synonymous parallelism, actually refer to only one donkey. However, even though Matthew understood this literary technique, he nonetheless chose to portray two to emphasize by the mother’s presence that the foal is young.'

  - where: 'note 21:9 “Hosanna to the Son of David”'
    claim: 'Hosanna is an Aramaic form of the Hebrew of Psalm 118:25, “save now”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'When the crowds cried “Hosanna!” they were using an Aramaic form of the Hebrew hôšîʿânnāʾ from Psalm 118:25, which means “save now” (KJV) or “save us, we beseech you” (NRSV).'
  - where: 'note 21:9 “Hosanna to the Son of David”'
    claim: 'Psalm 118 closes the Hallel sung at Passover and was first used in processions to the temple'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Psalm 118, which is the last of what came to be known as the Egyptian Hallel, a group of religious songs (Pss 113–18) that was sung as part of the celebration of Passover. Originally, however, Psalm 118 appears to have been used in liturgical processions'
  - where: 'note 21:9 “Hosanna to the Son of David”'
    claim: 'Matthew makes the cry a royal acclamation with “Son of David”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Matthew and John, however, vary the crowd’s acclamation to make it more explicitly a royal acclamation. Matthew has them begin by shouting, “Hosanna to the Son of David,”'
  - where: 'note 21:9 “Hosanna to the Son of David”'
    claim: 'Garments and branches carpeted the way as for a king'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'they spread out their garments, and cast palm fronds and other foliage in His path, thus carpeting the way as for the passing of a king. For the time being He was their king, and they His adoring subjects.'

  - where: 'note 21:10 ““Who is this?””'
    claim: 'Paschal week, the city full of pilgrims; the answer fell short of the shouts but was what strangers could grasp'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/21.htm'
    quote: 'It was the beginning of the Paschal week, and the city was therefore filled with pilgrims of many lands. To them this was a strange prelude to the usual order of the feast'
  - where: 'note 21:10 ““Who is this?””'
    claim: 'The answer fell short of the shouts’ meaning'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/21.htm'
    quote: 'The answer fell short of the full meaning of the shouts of the people, but it expressed that aspect of the character of Jesus which was most intelligible to strangers.'
  - where: 'note 21:10 ““Who is this?””'
    claim: 'The Galilean pilgrims may have answered first and loudest; Judeans held Galilee in low esteem'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'It may be that the Galilean pilgrims were first to answer and loudest in the gladsome proclamation; for the proud Judeans held Galilee in low esteem'

  - where: 'note 21:12 “The King clears His house”'
    claim: 'The trade was in the Court of the Gentiles: animals for sacrifice and money changed into temple coinage'
    key: ogden-jesus-temple
    url: 'https://www.churchofjesuschrist.org/study/ensign/1991/04/jesus-and-the-temple?lang=eng'
    quote: 'This is where people gathered to buy and sell oxen, sheep, and doves for use in Temple sacrifice and where money changers busily changed currency with pagan symbols and likenesses of polifical rulers into Temple coinage.'
  - where: 'note 21:12 “The King clears His house”'
    claim: 'Herod provided shops below; their presence on the platform suggests the priests had usurped power'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Herod had provided plenty of shop space along the southern and western bases of the Temple Mount; their presence in the courtyards on top of the temple platform suggests that the priestly establishment had usurped power over the sanctuary'
  - where: 'note 21:12 “The King clears His house”'
    claim: 'Placed after the entry it is a royal act rejecting the priestly establishment’s rights'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'placing the temple incident right after the triumphal entry stresses that this was a “royal act” by which Jesus emphasizes his authority over the temple and rejects the rights of the chief priestly establishment that has assumed control of and mismanaged it'
  - where: 'note 21:12 “The King clears His house”'
    claim: 'Before, “My Father’s house”; now “My house”; He and the Father one in dominion'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'He had designated the temple as “My Father’s house”; now that He had openly avowed Himself to be the Christ, He called it “My house.” The expressions are in a sense synonymous; He and the Father were and are one in possession and dominion.'
  - where: 'note 21:12 “The King clears His house”'
    claim: 'None could withstand Him'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'but it is plain that none could withstand His authoritative command'

  - where: 'note 21:13 “Robbers, not thieves”'
    claim: 'lēstēs is a robber or brigand, distinct from kleptēs, a thief by stealth; the AV obscures it'
    key: thayer
    url: 'https://biblehub.com/greek/3027.htm'
    quote: 'a robber; a plunderer, freebooter, brigand'
  - where: 'note 21:13 “Robbers, not thieves”'
    claim: 'Not to be confounded with kleptēs'
    key: thayer
    url: 'https://biblehub.com/greek/3027.htm'
    quote: 'Not to be confounded with κλέπτης thief, one who takes property by stealth (although the distinction is obscured in A. V.)'
  - where: 'note 21:13 “Robbers, not thieves”'
    claim: 'Jesus quoted Jeremiah’s condemnation of the establishment; lēistai can mean usurpers or insurrectionists'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'The Greek equivalent in both the Septuagint of Jeremiah 7:11, and Matthew 21:13 (Greek, lēistai; KJV, “thieves”) also means “usurpers” or even “insurrectionists” or “revolutionaries.”'
  - where: 'note 21:13 “Robbers, not thieves”'
    claim: 'Jeremiah condemned the political and religious establishment of his day'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'he was quoting Jeremiah’s condemnation of the political and religious establishment of his day'
  - where: 'section 2 plain'
    claim: '“Den of robbers” for the King James “den of thieves”'
    key: thayer
    url: 'https://biblehub.com/greek/3027.htm'
    quote: 'a robber; a plunderer, freebooter, brigand'

  - where: 'note 21:14 “The blind and the lame let in”'
    claim: 'Matthew alone adds the healings; with the fig tree and the servant’s ear they are the only miracles of the week'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Matthew alone adds that after casting out the merchants and moneychangers, Jesus lingered and healed blind and lame people who came to him, which constitute the only miracles Jesus is known to have performed during the Passion Week other than the cursing of the fig tree'
  - where: 'note 21:14 “The blind and the lame let in”'
    claim: 'David and the blind and lame; Leviticus 21; Jeremiah 31 foresees them welcomed back to Zion'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'We find a related prophecy in Jeremiah that in the messianic age, “the blind and the lame” will be welcomed back into Zion, the Temple (Jer 31:6–8).'
  - where: 'note 21:14 “The blind and the lame let in”'
    claim: 'Solomon was seen as a healer by the first century, so the healings tie Jesus to the son of David'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'by the first century AD, Solomon had come to be seen as a great exorcist and healer,[32] so Jesus’s healing underscored his association with the original “son of David,”'
  - where: 'note 21:14 “The blind and the lame let in”'
    claim: 'Gentle ministry followed His wrath; the priests who had decreed His death were afraid of the people'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'His wrath of indignation was followed by the calmness of gentle ministry'
  - where: 'note 21:14 “The blind and the lame let in”'
    claim: 'They had decreed His death but feared to touch Him because of the people'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'They had decreed His death, and had made repeated efforts to take Him'

  - where: 'note 21:16 “The children''s hosannas”'
    claim: 'The rulers wanted the children rebuked; Jesus answered from Psalm 8, traditionally David’s'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'This further angered the temple authorities, who called upon Jesus to rebuke them, leading him to quote a line from Psalm 8, a psalm traditionally attributed to David'
  - where: 'note 21:16 “The children''s hosannas”'
    claim: 'The Greek translation of Psalm 8:2 reads “perfected praise”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/8.htm'
    quote: 'Out of the mouth of babes and sucklings hast thou perfected praise, because of thine enemies'

  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'Fig fruit buds appear before leaves; some figs are eaten green; a leafy tree should have fruit'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'It is well known that the fruit-buds of a fig tree appear earlier than do the leaves, and that by the time the tree is in full foliage the figs are well advanced toward maturity. Moreover, certain species of figs are edible while yet green'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'The other trees had not yet leaves or fruit; this one was cursed because, having leaves, it was deceptively barren; a type of hypocrisy'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'it was made the object of the curse and the subject of the Lord’s instructive discourse, because, having leaves, it was deceptively barren'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'A type of human hypocrisy'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'its utter barrenness coupled with its abundance of foliage made of it a type of human hypocrisy'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'The tree stands for religion of pretentious show and empty profession'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'which in pretentious show and empty profession outclassed the abominations of heathendom'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'The other trees in due season would bring forth fruit and leaves'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'the others offered no invitation, gave no promise; “the time of figs was not yet”; they, in due season would bring forth fruit and leaves'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'The only destructive miracle; best seen as a prophetic act; the fig tree a symbol of unfruitful Israel'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'it is the only example of a “destructive” miracle in the Gospels'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'Fig trees symbolize Israel among the prophets when unfruitful'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'figs and the fig tree serve as symbols for Israel among the Old Testament prophets, particularly when God’s people were not fruitful (Jer 8:13; 24:1‒10; Hos 9:10, 16‒17; Mic 7:1‒6)'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'The vineyard parable controls the reading: the leadership, not the Jewish people, is fruitless'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'it is not all Israel—or, in this case, the Jewish people at the time of Jesus—that are not bringing forth fruit, but rather their leadership and the institutions that they were wrongly controlling'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'Matthew places the condemnation of the leaders right after the fig tree'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'by placing Jesus’s condemnation of the chief priests and elders immediately after the cursing of the fig tree, Matthew, along with Luke, highlights the failure of Jerusalem’s leadership'
  - where: 'note 21:19 “A tree with leaves and no fruit”'
    claim: 'To the Twelve it showed His power to destroy; His sacrifice was voluntary'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'Could any of the Twelve doubt, when, a few days later they saw Him in the hands of vindictive priests and heartless pagans, that did He so will He could smite His enemies by a word, even unto death?'

  - where: 'note 21:20 “At once, in Matthew”'
    claim: 'Matthew: withered immediately; Mark delays it to the next morning and frames the temple incident'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'In the Matthean parallel of the story of the fig tree, as soon as Jesus cursed the tree it withered “immediately” (Matt 21:19; Greek, parachrēma). Mark, however, delays the destruction of the tree'
  - where: 'note 21:20 “At once, in Matthew”'
    claim: 'In Mark the temple, like the tree, is judged and its destruction foretold'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'by framing the temple incident with the tree’s cursing and its withering, Mark creates a tightly designed structure that emphasizes that because the Jerusalem leadership of Jesus’s day was fruitless'
  - where: 'note 21:20 “At once, in Matthew”'
    claim: 'The name “cleansing of the temple” fits Matthew and Luke, as the rightful king’s act'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'The traditional name for this episode, the “cleansing of the temple,” works well in Matthew and Luke: coming right after the triumphal entry, Jesus, as the rightful king, has the authority to expel the merchants and moneychangers'
  - where: 'note 21:20 “At once, in Matthew”'
    claim: 'Matthew places the clearing directly after the entry'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Matthew, paralleled by Luke, places Jesus’s cleansing of the temple directly after the triumphal entry, using it to demonstrate his authority to judge its so-called authorities'

  - where: 'note 21:21 “This mountain”'
    claim: 'The greatest fruit is belief; the mountain may be the Temple Mount or the Mount of Olives; both possible'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Given the setting, the mountain “pulled up and cast into the sea” could be either the Temple Mount, which will soon be overthrown, or the Mount of Olives where the fig tree itself was cursed'
  - where: 'note 21:21 “This mountain”'
    claim: 'The prayer that follows makes the Temple Mount the more significant reading'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'makes the former particularly significant in this context'
  - where: 'note 21:21 “This mountain”'
    claim: 'Belief is the greatest fruit'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'The greatest “fruit” required is belief, and Jesus promises that if they have faith, they can do seemingly impossible things'
  - where: 'note 21:21 “This mountain”'
    claim: 'Prayer without doubt; one who prays must be fit; the blighting small beside faith'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'Prayer must be acceptable unto God to be effective; and it follows that he who desires to accomplish any work through prayer and faith must be fit to present himself before the Lord in supplication'
  - where: 'note 21:21 “This mountain”'
    claim: 'The blighting of a tree was small beside faith and prayer'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The blighting of a tree was shown to be small in comparison with the greater possibilities of achievement through faith and prayer.'

  - where: 'note 21:23 “Who asked, and what “these things” were”'
    claim: 'Chief priests, scribes and elders made up the Sanhedrin; the groups of the passion prediction; “these things” the entry and clearing'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'These were the main groups that made up the Sanhedrin, the council that not only served as the supreme Jewish law court but also the chief civil body under the Roman occupation.'
  - where: 'note 21:23 “Who asked, and what “these things” were”'
    claim: 'Who the chief priests and elders were'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the chief priests, who would have included the current high priest, earlier holders of that position, and perhaps the heads of the leading priestly families; the scribal experts on the law, including important Pharisees; and the elders of the people, who represented the lay nobility'
  - where: 'note 21:23 “Who asked, and what “these things” were”'
    claim: '“These things” refers to the entry and the clearing of the temple'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'no doubt referring to the triumphal entry and, particularly, his cleansing of the temple, an act that attacked their own authority in the temple'
  - where: 'note 21:23 “Who asked, and what “these things” were”'
    claim: 'Mark and Luke name the scribes with the chief priests and elders'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Mark, followed by Luke'
  - where: 'note 21:23 “Who asked, and what “these things” were”'
    claim: 'They were guardians of the temple; He had ignored their authority a second time; no sign asked'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'They were the guardians of the temple, both the material structure and the theocratic system for which the holy edifice stood'
  - where: 'note 21:23 “Who asked, and what “these things” were”'
    claim: 'No sign was asked; it would have exposed them to ridicule'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'To ask a further sign would have been to flagrantly expose themselves to the ridicule of the people.'
  - where: 'note 21:23 “Who asked, and what “these things” were”'
    claim: 'A preliminary step to suppress Him'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'This action was doubtless a preliminary step in a preconcerted attempt to suppress the activities of Jesus, both of word and deed, within the temple precincts.'

  - where: 'note 21:25 “John''s baptism as the answer”'
    claim: 'Countering a question was their own method; the dilemma; no attempt to find the truth'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'He availed Himself of a method very common among themselves—that of countering one question with another.'
  - where: 'note 21:25 “John''s baptism as the answer”'
    claim: 'John testified of Jesus; the people revered the Baptist; they did not try to find the truth'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'no mention is made of any attempt to ascertain the truth and reply accordingly'
  - where: 'note 21:25 “John''s baptism as the answer”'
    claim: 'Jesus would ask why they did not accept John’s testimony of Himself'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'Jesus would probably demand of them why then they had not believed in the Baptist, and why they did not accept John’s testimony concerning Himself'
  - where: 'note 21:25 “John''s baptism as the answer”'
    claim: 'Jesus declined to answer directly but answered indirectly in the parable'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'Although he declined to say directly by what authority he did these things (see 21:27), he immediately[13] went on to answer their question indirectly by giving this trenchant parable about two sons'
  - where: 'note 21:25 “John''s baptism as the answer”'
    claim: 'On Welch’s reading the parable answers the second question, who gave Him authority'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'But when he went on to tell the ensuing parable of the two sons, he answered in effect their second question: “Who gave thee this authority?”'
  - where: 'note 21:25 “John''s baptism as the answer”'
    claim: 'The father in the parable proves to be God the Father'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'this father is not just their father, but God the Father'
  - where: 'note 21:25 “John''s baptism as the answer”'
    claim: 'The Joseph Smith Translation: he that believed not John concerning me cannot believe me'
    key: jst-matt-21
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/21?lang=eng'
    quote: 'For he that believed not John concerning me, cannot believe me, except he first repent.'

  - where: 'note 21:29 ““I will not” and “repented””'
    claim: 'ou thelō is present tense: “I don’t want to”'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'Ou thelō is a present-tense verb, meaning “I don’t want to,” or “I don’t wish to,” or “I’d rather not,”'
  - where: 'note 21:29 ““I will not” and “repented””'
    claim: 'The verb is metamelomai, not metanoeō: feel sad, change one’s mind'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'The Greek word used here is not the ordinary verb used to mean “repent” (metanoeō),[32] but rather metamelomai, which does not primarily mean “to repent.” In the Septuagint and in Koine Greek, with rare exception, it always means to feel sad about something or to change one’s mind'
  - where: 'note 21:29 ““I will not” and “repented””'
    claim: 'The leaders had not even changed their minds (21:32)'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'the Jewish leaders, unlike the first son, had not felt any need to adjust their preferences or change their minds (oude metamelēthēte), let alone repent'
  - where: 'note 21:29 ““I will not” and “repented””'
    claim: 'Welch reads the first son as Jesus, submitting to the Father as in Gethsemane'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'These words in Matthew 21:29 take on an elevated meaning when the “first son” is taken as referring to Jesus himself.'
  - where: 'note 21:29 ““I will not” and “repented””'
    claim: 'Ou thelō can be heard as “not as I will”; Gethsemane “not my will”'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'or, idiomatically, “Not (ou) [what or as] I will (thelō).”'
  - where: 'note 21:29 ““I will not” and “repented””'
    claim: 'Welch offers this reading beyond the moral one'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'I suggest that readers might most meaningfully look at this parable through a spiritual or anagogical lens.'
  - where: 'note 21:29 ““I will not” and “repented””'
    claim: 'The two verbs overlap; the sharp distinctions between them are doubtful'
    key: thayer
    url: 'https://biblehub.com/greek/3338.htm'
    quote: 'The distinctions so often laid down between these words'
  - where: 'section 5 plain'
    claim: '“I don’t want to” and “changed his mind” for “I will not” and “repented”'
    key: welch-two-sons
    url: 'https://rsc.byu.edu/let-us-reason-together/symbolism-parable-willing-unwilling-two-sons-matthew-21'
    quote: 'Ou thelō is a present-tense verb, meaning “I don’t want to,” or “I don’t wish to,” or “I’d rather not,”'

  - where: 'note 21:31 “Ahead of you, not instead of you”'
    claim: 'The rulers were the second son; the publicans the first; there was hope if they would repent'
