  - where: 'note 21:33 “Isaiah''s vineyard, retold”'
    claim: 'Vineyard = house of Israel; details from Isaiah 5; owner God, son Jesus, servants prophets, tenants leaders'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Hence, the owner was God, the son is Jesus, and the previous servants were the prophets whom the Lord had sent to Israel. This makes the tenants, who, importantly, do not own the vineyard but are only responsible for caring for it, the leaders of Israel'
  - where: 'note 21:33 “Isaiah''s vineyard, retold”'
    claim: 'The hedge, wine trough and tower link the parable to Isaiah 5'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Some of its details—surrounding the vineyard with a protective wall or hedge, digging a wine trough, and building a watchtower—linked it particularly with the song of the Lord’s vineyard in Isaiah 5.'
  - where: 'note 21:33 “Isaiah''s vineyard, retold”'
    claim: 'In Isaiah the fruit was wild; here good fruit withheld'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'there the vineyard brought forth wild, or worthless, fruit (Isa 5:2); here the fruit is presumably good, but the tenants refuse to yield it to its true owner'
  - where: 'note 21:33 “Isaiah''s vineyard, retold”'
    claim: 'The husbandmen are the priests and teachers of Israel, including those present'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'The husbandmen could be none other than the priests and teachers of Israel, including the ecclesiastical leaders who were then and there present in an official capacity.'

  - where: 'note 21:37 “The heir cast out”'
    claim: '“Other servants more than the first” means greater, the latest John the Baptist'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'When the Lord sent other messengers, “more than the first,” or in other words, greater than the earlier ones, the most recent example being John the Baptist'
  - where: 'note 21:37 “The heir cast out”'
    claim: 'Jesus told the future as though fulfilled, three days distant'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'Jesus carried the story without break from the criminal past to the yet more tragic and awful future, then but three days distant; and calmly related in prophetic imagery, as though already fulfilled'
  - where: 'note 21:37 “The heir cast out”'
    claim: 'The rulers pronounced judgment on themselves'
    key: talmage-jesus-christ-30
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-30?lang=eng'
    quote: 'Again the Jews were compelled to make answer to the great question with which the parable dealt, and again by their answer they pronounced judgment upon themselves.'
  - where: 'note 21:37 “The heir cast out”'
    claim: 'Mark’s “well-beloved son” is the Father’s word at the baptism and Transfiguration'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'the owner sends his son, who in Mark is his one, “well-beloved son” (Greek, agapēton). This is the very term used on two other occasions by the Father of Jesus, at his baptism and at the Transfiguration'
  - where: 'note 21:37 “The heir cast out”'
    claim: 'Cast out of the vineyard: a latent reference to the Gentiles and the crucifixion outside the city; details not to be pressed'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/21.htm'
    quote: 'The minor touches of a parable are not always to be pressed in our interpretation of it; but we can hardly help seeing here a latent reference to the facts (1) that our Lord was delivered over to the judgment of the Gentiles; and (2) that He was crucified outside the Holy City'

  - where: 'note 21:42 ““I am the stone””'
    claim: 'Psalm 118 links the parable to the entry: “Save now” against the rejected stone'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Both Mark and Matthew have Jesus end his parable with a reference to Psalm 118, creating a connection with the triumphal entry during which the crowds acclaimed Jesus with a line from that very psalm.'
  - where: 'note 21:42 ““I am the stone””'
    claim: 'In the Gospels the identification is understood by opponents but not expressed; the JST makes it explicit'
