chapter: 28
claims:
  - where: setting
    claim: 'Matthew follows Mark’s account of the tomb but adds the angel’s descent with the earthquake, the appearance to the women, and the cover-up'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Matthew, while following Mark’s basic account, changes and expands upon it in important ways. First, rather than being a typological figure, the messenger whom they meet there is specifically “an angel of the Lord” whose descent from heaven is accompanied by an earthquake'
  - where: setting
    claim: 'Matthew adds the appearances to the women and to the eleven, with the commission'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'the real difference comes in Matthew’s inclusion of a scene depicting the resurrected Jesus appearing to the women (28:9–10) and then to the eleven disciples (28:16–20).'
  - where: setting
    claim: 'The guard at the tomb is told only by Matthew'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'Matthew’s short treatment of the guard and seal placed upon the tomb is unique in the Gospel narratives.'
  - where: setting
    claim: 'Matthew says nothing of the ascension'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Like John, Matthew ends his Gospel by saying nothing about the ascension.'
  - where: thread
    claim: 'The guard scene creates a five-part pattern from the burial to the appearance'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Further, the reference to the guards creates a five-part pattern in Matthew’s text: [7]'
  - where: thread
    claim: 'The pattern echoes the infancy narrative, positive and negative alternating, with the women at the tomb at the center'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'which also has positive material in the first, third, and fifth sections and negative stories in the second and fourth positions; … the material that is literally (and metaphorically) central to the resurrection story is not the appearance of the resurrected Jesus but rather the experience of the women at the tomb.'
  - where: thread
    claim: 'The last words form a bookend with “Emmanuel”; the Resurrection lets Jesus fulfill His mission as God with us'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'this passage forms a bookend with the material in the beginning of Matthew’s Gospel where it was prophesied that Jesus’s name would be “Emmanuel” (Matthew 1:23), which means “God with us.” In sum, Matthew’s scene emphasizes that the Resurrection makes it possible for Jesus to fulfill his mission as “God with us.”'
  - where: section 1 plain
    claim: '“In the end of the sabbath” rendered “after the Sabbath”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/28?lang=eng'
    quote: '1a “In”: GR After the sabbath.'
  - where: section 2 plain
    claim: 'Footnote glosses: watch = guard, shewed = reported, large money = much money, secure you = keep you out of trouble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/28?lang=eng'
    quote: '11a “watch”: GR guard.'
  - where: section 2 plain
    claim: 'Footnote gloss: large money = much money'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/28?lang=eng'
    quote: '12a “large money”: GR much money.'
  - where: section 2 plain
    claim: 'Footnote gloss: secure you = keep you out of trouble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/28?lang=eng'
    quote: '14a “secure you”: GR keep you out of trouble.'
  - where: 'note 28:1 “The two Marys, at dawn on the first day”'
    claim: 'The footnote reads “After the sabbath”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/28?lang=eng'
    quote: '1a “In”: GR After the sabbath.'
  - where: section 3 plain
    claim: '“Teach” rendered “make disciples of”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/28?lang=eng'
    quote: '19a “teach”: GR preach to, make disciples of (meaning “make Christians in all nations”).'
  - where: 'note 28:1 “The two Marys, at dawn on the first day”'
    claim: 'The other Mary is Mary the mother of James and Joses; Matthew has only the two Marys'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'in Matthew’s version there are only the two Marys (Mary of Magdala and Mary the mother of James and Joses; see Matt 27:56, 61; 28:1)'
  - where: 'note 28:1 “The two Marys, at dawn on the first day”'
    claim: 'The Sabbath ended at sunset Saturday; the women came the next morning; having seen the burial they knew the tomb'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'as soon as the Sabbath ended shortly after sunset on Saturday, … Because the two Marys were also specifically mentioned as being present when Joseph of Arimathea laid Jesus in his own tomb, not only were they witnesses of the Lord’s death, but they also knew exactly where he had been buried'
  - where: 'note 28:1 “The two Marys, at dawn on the first day”'
    claim: 'Sunday came to be known as the Lord’s Day and kept as the Sabbath in place of Saturday'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'therefore on the next Sunday, which day of the week afterward came to be known to the Church as the “Lord’s Day” and to be observed as the Sabbath in place of Saturday, the Mosaic Sabbath'
  - where: 'note 28:2 “Opened to let the witnesses in”'
    claim: 'The stone was rolled back so those who came could see the body was gone, not to let the risen Christ out'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'does not prove that Christ had not already risen. The great stone was rolled back and the inside of the sepulchre exposed to view, so that those who came could see for themselves that the Lord’s body was no longer there; it was not necessary to open the portal in order to afford an exit to the resurrected Christ.'
  - where: 'note 28:2 “Opened to let the witnesses in”'
    claim: 'A resurrected body is tangible but not hindered by material barriers'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'A resurrected body, though of tangible substance, and possessing all the organs of the mortal tabernacle, is not bound to earth by gravitation, nor can it be hindered in its movements by material barriers.'
  - where: 'note 28:2 “Opened to let the witnesses in”'
    claim: 'Matthew’s earthquake at the tomb parallels the star; together the signs mark the cosmic importance of Jesus’s life and death; the Resurrection is earthshaking'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'this earthquake parallels the star that the magi followed (2:2). Together these signs signify the cosmological importance of Jesus’s life and death. To Matthew, Jesus’s resurrection is literally earthshaking.'
  - where: 'note 28:6 “As He had said”'
    claim: 'Jesus’s enemies took His prophecies of rising seriously while most disciples did not yet understand them'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'this story makes clear that Jesus’s enemies understood and took seriously his prophecies that he would rise from the dead in a way that most of his disciples did not yet understand, which must have struck Matthew’s audience as rather ironic.'
  - where: 'note 28:6 “As He had said”'
    claim: '“He is risen” is passive in Greek, “he has been raised,” which may suggest that God raised Him'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'While we have translated the Greek verb (ēgerthē) with the traditional and more elegant “he is risen,” technically the form is passive, “he has been raised.” This may suggest that in the Synoptics Jesus, who had been crucified by men, has been raised by God'
  - where: 'note 28:6 “As He had said”'
    claim: 'John emphasizes that Jesus laid down His life and took it up again'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Matthew, Mark, and Luke tend to emphasize that God raised Jesus from the dead (Mark 12:26; Luke 9:22), while John emphasizes that Jesus himself chose to lay down his life and take it up again (see John 10:17–18).'
  - where: 'note 28:9 “The women hold Him by the feet”'
    claim: 'Holding His feet shows the physical reality of the Resurrection and their affection; their worship shows His status'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'The reference to the women holding Jesus’s feet conveys both the physical reality of the Resurrection as well as their human affection for him. Perhaps most significant in the story of Jesus’s appearance to the women is the note that they worshipped him'
  - where: 'note 28:9 “The women hold Him by the feet”'
    claim: 'Women were generally not permitted as witnesses under Jewish law'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Generally, women were not permitted to be witnesses under Jewish law'
  - where: 'note 28:9 “The women hold Him by the feet”'
    claim: 'Their testimony is confirmed by seeing, hearing and touching; the verb for “bring word” / “go tell” means a solemn proclamation'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'are confirmed when they see, hear, and touch Jesus, holding him by his feet and worshipping him. With this sure testimony they become powerful witnesses; although the KJV renders the verb as “bring word” or “go tell,” … in this context it clearly means to make a solemn or authoritative proclamation.'
  - where: 'note 28:9 “The women hold Him by the feet”'
    claim: 'Mary Magdalene was the first mortal to see a resurrected soul'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'To a woman, to Mary of Magdala, was given the honor of being the first among mortals to behold a resurrected Soul, and that Soul, the Lord Jesus.'
  - where: 'note 28:9 “The women hold Him by the feet”'
    claim: 'Talmage: Christ probably ascended to the Father between Mary’s attempt to touch Him and the women’s holding His feet'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'It appears reasonable and probable that between Mary’s impulsive attempt to touch the Lord, and the action of the other women who held Him by the feet as they bowed in worshipful reverence, Christ did ascend to the Father'
  - where: 'note 28:10 “My brethren”'
    claim: 'The Lord’s greeting called the apostles His brethren, and Peter was not excluded; it must have given him hope'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'he may have doubted that ever again would the Master call him His servant; but hope must have been engendered through the message from the tomb brought by the women, in which the Lord sent greetings to the apostles, whom for the first time He designated as His brethren, and from this honorable and affectionate characterization Peter had not been excluded'
  - where: 'note 28:13 “The guards’ story”'
    claim: 'The guards were Roman soldiers put under the chief priests by Pilate; the chief priests were Sadducees who denied the resurrection'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'When the Roman guardsmen had sufficiently recovered from fright to make their precipitate departure from the sepulchre, they went to the chief priests, under whose orders they had been placed by Pilate, … The chief priests were Sadducees, of which sect or party a distinguishing feature was the denial of the possibility of resurrection from the dead.'
  - where: 'note 28:13 “The guards’ story”'
    claim: 'Sleeping at their posts meant death; the soldiers were at the chief priests’ disposal and presumably need not report to Rome'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'If they were found guilty of sleeping at their posts, immediate death would be their doom; … It must be remembered that the soldiers had been put at the disposal of the chief priests, and presumably therefore were not required to report the details of their doings to the Roman authorities.'
  - where: 'note 28:13 “The guards’ story”'
    claim: 'The cover-up had a polemical function but makes the guards additional witnesses'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'While Matthew’s final addition, the attempt of the Jewish leaders to cover up the story (Matt 8:11‒15), certainly had a polemical function,[14] in the narrative it actually underscores that the guards themselves were additional witnesses of the miracle that morning.'
  - where: 'note 28:13 “The guards’ story”'
    claim: 'The guard scene showed Matthew’s readers there was no opportunity for trickery by the disciples'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'this scene would have further emphasized to Matthew’s audience the reality of the Resurrection by allowing no opportunity for trickery on the part of Jesus’s distraught disciples.'
  - where: 'note 28:17 “Some doubted”'
    claim: 'distazō means to doubt, waver; used in Matthew 14:31 and 28:17'
    key: thayer
    url: 'https://biblehub.com/greek/1365.htm'
    quote: 'διστάζω: 1 aorist ἐδίστασα (δίς); to doubt, waver: Matthew 14:31; Matthew 28:17.'
  - where: 'note 28:17 “Some doubted”'
    claim: 'Others beside the apostles may have been present; perhaps the five hundred of 1 Corinthians 15:6'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'The record adds “but some doubted,” by which may be implied that others beside the apostles were present, among whom were some who were unconvinced of the actual corporeity of the resurrected Christ. This occasion may have been that of which Paul wrote'
  - where: 'note 28:18 “All authority, in heaven and on earth”'
    claim: 'The declaration affirms His Godship; those He commissioned minister in His name by a power no man could give or take away'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'This could be understood as nothing less than an affirmation of His absolute Godship. His authority was supreme, and those who were commissioned of Him were to minister in His name, and by a power such as no man could give or take away.'
  - where: 'note 28:18 “All authority, in heaven and on earth”'
    claim: 'exousia at Matthew 28:18: the power of rule, of one whose commands must be obeyed, generally translated authority'
    key: thayer
    url: 'https://biblehub.com/greek/1849.htm'
    quote: 'the power of rule or government (the power of him whose will and commands must be submitted to by others and obeyed (generally translated authority));'
  - where: 'note 28:19 “From the lost sheep to all nations”'
    claim: 'The commission to all nations is a bookend unique to Matthew, in contrast to the command to go to the lost sheep of Israel'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'The corresponding bookend that is unique to Matthew’s Gospel is Jesus’ commission to the disciples before His Ascension. … This passage is in stark contrast to Jesus’ command to the Apostles to go to “the lost sheep of the house of Israel” (Matthew 10:6).'
  - where: 'note 28:19 “From the lost sheep to all nations”'
    claim: 'Matthew frames his Gospel in a gentile context: Abraham’s covenant blessing all nations, the gentile women, the wise men'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'it is significant that Matthew frames his Gospel within a gentile context. … Genesis makes it clear that through this covenant all nations, not just the Israelites, would be blessed … In addition, Matthew includes four Gentile women in Jesus’ genealogy'
  - where: 'note 28:19 “From the lost sheep to all nations”'
    claim: 'mathēteuō: to make a disciple; to teach, instruct, at Matthew 28:19'
    key: thayer
    url: 'https://biblehub.com/greek/3100.htm'
    quote: 'to make a disciple; to teach, instruct: τινα, Matthew 28:19; Acts 14:21'
  - where: 'note 28:19 “In the name of the Father, the Son and the Holy Ghost”'
    claim: 'Three separate persons in the Godhead; the Father and Son have bodies, the Holy Ghost is a personage of spirit'
    key: bd-god
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/god?lang=eng'
    quote: 'there are three separate persons in the Godhead: the Father, the Son, and the Holy Ghost. From latter-day revelation we learn that the Father and the Son have tangible bodies of flesh and bone and that the Holy Ghost is a personage of spirit without flesh and bone'
  - where: 'note 28:19 “In the name of the Father, the Son and the Holy Ghost”'
    claim: 'The baptismal words in 3 Nephi 11:25 and D&C 20:73 begin with authority from Jesus Christ and use the three names'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/20?lang=eng'
    quote: 'Having been commissioned of Jesus Christ, I baptize you in the name of the Father, and of the Son, and of the Holy Ghost. Amen.'
  - where: 'note 28:20 “With you to the end”'
    claim: 'The last verse forms an inclusio with Emmanuel'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'After introducing this name in the first chapter, Matthew forms an inclusio, or literary bookend, with the final verse in the Gospel'
  - where: 'note 28:20 “With you to the end”'
    claim: 'The words for “I am” are those of the Septuagint of Exodus 3:14 (Smith’s reading); the word order “I with you am” emphasizes God’s embeddedness with the people'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Here the words translated as “I am” are the same Greek words found in the Septuagint version … of Exodus 3:14 … Yet the word order is skewed so that the text in Matthew reads literally “I with you am,” emphasizing verbally the embeddedness of God with the people.'
  - where: 'note 28:20 “With you to the end”'
    claim: 'synteleia: completion, consummation, end'
    key: thayer
    url: 'https://biblehub.com/greek/4930.htm'
    quote: 'συντέλεια, συντελείας, ἡ (συντελής), completion, consummation, end'
  - where: 'note 28:20 “With you to the end”'
    claim: 'JS—M 1:4 explains the end of the world as the destruction of the wicked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'and what is the sign of thy coming, and of the end of the world, or the destruction of the wicked, which is the end of the world?'
  - where: christ
    claim: 'The promise holds for those who believe, keep His commandments and trust His promises'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'He goes one step further than John, however, by showing that “for those of us who believe in him, keep his commandments, and trust in his promises, he is ever with us.”'
  - where: christ
    claim: 'The same promise in latter-day revelation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/31?lang=eng'
    quote: 'Be faithful unto the end, and lo, I am with you.'
  - where: explore
    claim: 'Huntsman and Hatch’s chapter includes all three Synoptic accounts of the empty tomb'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Because of the important contributions of each of the Synoptic accounts of the empty tomb, we have included all three here.'
  - where: setting
    claim: 'The chief priests and Pharisees asked Pilate for the guard on the Sabbath'
    key: huntsman-saturday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/saturday'
    quote: 'according to Matthew, the Jewish leadership ironically finds itself compelled to take action on the Sabbath to ask Pilate to secure the tomb. Noting Jesus’s earlier prediction, “After three days, I will be raised,” a delegation of chief priests and leading Pharisees'
  - where: 'note 28:19 “From the lost sheep to all nations”'
    claim: 'The footnote glosses “teach” as make disciples of'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/28?lang=eng'
    quote: '19a “teach”: GR preach to, make disciples of (meaning “make Christians in all nations”).'
