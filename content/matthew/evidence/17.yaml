chapter: 17
claims:
  - where: when
    claim: 'The Bible Dictionary places the Transfiguration in about October, six months before Jesus’s death'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'The Transfiguration occurred in about October, some six months before the death of Jesus.'
  - where: setting
    claim: 'The Transfiguration came about a week after the promise of the keys to Peter, in about October, six months before Jesus’s death'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'This very important event in the New Testament occurred about a week after the promise made to Peter that he would receive the keys of the kingdom of heaven (Matt. 16:13–19; 17:1–9).'
  - where: setting
    claim: 'Latter-day revelation adds that the apostles received the keys on the mount'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'On the mount, the Savior, Moses, and Elias (Elijah) gave the promised keys of the priesthood to Peter, James, and John (HC 3:387)'
  - where: setting
    claim: 'On the mount the apostles saw a vision of the earth in its future glory'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'They also saw a vision of the earth as it will appear in its future glorified condition (D&C 63:20–21; HC 1:283)'
  - where: thread
    claim: 'At the Transfiguration Jesus stood at the verge of the valley of the shadow of death; it was the beginning of the end'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'He had reached the verge of the valley of the shadow of death; and the human part of His nature called for refreshing.'
  - where: thread
    claim: 'Moses stood for the law and Elijah for the prophets, both subordinate to Jesus'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'Moses, the promulgator of the law, and Elijah the representative of the prophets and especially distinguished among them as the one who had not died, had been seen ministering unto Jesus and subservient to Him.'
  - where: thread
    claim: 'The keys promised to Peter were given on the mount'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'On the mount, the Savior, Moses, and Elias (Elijah) gave the promised keys of the priesthood to Peter, James, and John (HC 3:387)'
  - where: thread
    claim: 'Paying the tax, Jesus kept His right as the King’s Son and gave freely what could not be demanded'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'His catechization of Peter had clearly demonstrated that He maintained His right as the King’s Son, and yet would condescend to voluntarily give what could not be righteously demanded.'
  - where: section 2 plain
    claim: 'The Greek behind “lunatic” meant to be epileptic'
    key: thayer
    url: 'https://biblehub.com/greek/4583.htm'
    quote: 'literally, to be moon-struck (cf. lunatic); … to be epileptic (epilepsy being supposed to return and increase with the increase of the moon): Matthew 4:24; Matthew 17:15.'
  - where: section 4 plain
    claim: 'The tribute of verse 24 is the two-drachma temple tax, a half shekel'
    key: thayer
    url: 'https://biblehub.com/greek/1323.htm'
    quote: 'a didrachmon or double-drachma, a silver coin equal to two Attic drachmas or one Alexandrian, or half a shekel (about one third of a dollar) (see in ἀργύριον, 3): Matthew 17:24.'
  - where: section 4 plain
    claim: 'The coin of verse 27 is a stater, worth four drachmas'
    key: thayer
    url: 'https://biblehub.com/greek/4715.htm'
    quote: 'a stater, a coin; in the N. T. a silver stater equivalent to four Attic or two Alexandrian drachmas, a Jewish shekel (see δίδραχμον): Matthew 17:27.'

  - where: 'note 17:1 “A high mountain, and three witnesses”'
    claim: 'Six days (Matthew, Mark) and about eight days (Luke) count the interval two ways; no discrepancy'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'It is probable that the six-day period was meant to be exclusive of the day on which the earlier events had occurred and of that on which Jesus and the three apostles retired to the mountain; and that Luke’s “about an eight days” was made to include these two days.'
  - where: 'note 17:1 “A high mountain, and three witnesses”'
    claim: 'The mountain is unnamed; Tabor is the old tradition, Hermon near Caesarea Philippi has been preferred, nothing decisive'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'Mount Tabor, in Galilee, has long been held by tradition as the site … Hermon stands near the northerly limits of Palestine, just beyond Cæsarea Philippi … Weight of evidence is in favor of Hermon as the Mount of Transfiguration, though nothing that may be called decisive is known in the matter.'
  - where: 'note 17:1 “A high mountain, and three witnesses”'
    claim: 'The same three were the only witnesses at Jairus’s daughter and in Gethsemane'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'had been similarly chosen as witnesses of a special manifestation, that of the raising of the daughter of Jairus (Mark 5:37; Luke 8:51); and, later, the same three were the sole witnesses of our Lord’s night agony in Gethsemane'

  - where: 'note 17:2 “Transfigured”'
    claim: 'The Greek verb means to change into another form; of Christ, resplendent with divine brightness'
    key: thayer
    url: 'https://biblehub.com/greek/3339.htm'
    quote: 'to change into another form (cf. μετά, III. 2), to transfigure, transform: μετεμορφώθη, of Christ, his appearance was changed (A. V. he was transfigured), i. e. was resplendent with a divine brightness'
  - where: 'note 17:2 “Transfigured”'
    claim: 'Transfiguration defined: a temporary change so a person can endure heavenly glory; Joseph Smith taught the three apostles were transfigured too'
    key: gs-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/transfiguration?lang=eng'
    quote: 'The condition of persons who are temporarily changed in appearance and nature—that is, lifted to a higher spiritual level—so that they can endure the presence and glory of heavenly beings.'
  - where: 'note 17:2 “Transfigured”'
    claim: 'Joseph Smith taught that Peter, James and John were also transfigured'
    key: gs-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/transfiguration?lang=eng'
    quote: 'Joseph Smith taught that on the Mount of Transfiguration, Peter, James, and John were also transfigured.'
  - where: 'note 17:2 “Transfigured”'
    claim: 'The apostles had to be transfigured to withstand the glory, as Moses was'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'In fact, Peter, James, and John were also transfigured or else they could not have withstood the glory manifested before them (Moses 1:11).'
  - where: 'note 17:2 “Transfigured”'
    claim: 'D&C 63:21 most likely refers to this mount'
    key: sc-knowhy-795
    url: 'https://scripturecentral.org/knowhy/why-does-the-lord-compare-the-earth-s-millennial-glory-to-the-mount-of-transfiguration'
    quote: 'In this verse, the Lord is most likely referring to events at the Mount of Transfiguration'
  - where: 'note 17:2 “Transfigured”'
    claim: 'The apostles saw a vision of the earth in its future glorified condition'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'They also saw a vision of the earth as it will appear in its future glorified condition (D&C 63:20–21; HC 1:283)'

  - where: 'note 17:3 “The keys given on the mount”'
    claim: 'Joseph Smith in 1839: the Savior, Moses and Elias gave the keys to Peter, James and John on the mount'
    key: jsp-discourse-1839-a-richards-p65
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-4-august-1839-a-as-reported-by-willard-richards/3'
    quote: 'The Priesthood is everlasting. The Savior. Moses. & Elias— gave the Keys to Peter, James & John on the Mount when they were transfigured before him.'
  - where: 'note 17:3 “The keys given on the mount”'
    claim: 'The keys let the three carry on the work after Jesus left; later given to all the Twelve'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'which enabled these brethren to carry forth the work of the kingdom on the earth after the departure of Jesus. These keys were later given to all of the Twelve.'
  - where: 'note 17:3 “The keys given on the mount”'
    claim: 'A similar event at Kirtland on April 3, 1836, when keys were conferred on Joseph Smith and Oliver Cowdery'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'A similar event occurred on April 3, 1836, in the temple at Kirtland, Ohio, where the same heavenly messengers conferred priesthood keys upon the Prophet Joseph Smith and Oliver Cowdery (D&C 110).'
  - where: 'note 17:3 “The keys given on the mount”'
    claim: 'Not everything that happened on the mount has been revealed'
    key: sc-knowhy-795
    url: 'https://scripturecentral.org/knowhy/why-does-the-lord-compare-the-earth-s-millennial-glory-to-the-mount-of-transfiguration'
    quote: 'While the Lord has not revealed everything that happened on the Mount of Transfiguration, some prophets have clarified what happened on that occasion.'

  - where: 'note 17:3 “Moses and Elijah”'
    claim: 'Elias here can only be Elijah'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'Elias in these instances can only be the ancient prophet Elijah whose ministry is recorded in 1 and 2 Kings. The curious wording of JST Mark 9:3 does not imply that the Elias at the Transfiguration was John the Baptist, but that in addition to Elijah the prophet, John the Baptist was present'
  - where: 'note 17:3 “Moses and Elijah”'
    claim: 'Moses was translated, so that he had a body to give the keys to the mortal apostles before the Resurrection'
    key: bd-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moses?lang=eng'
    quote: 'It was necessary that he be translated, in order to have a body of flesh and bones at the time of the Transfiguration, since the Resurrection had not yet taken place. Had he been a spirit only, he could not have performed the work on the mount of giving the keys'
  - where: 'note 17:3 “Moses and Elijah”'
    claim: 'Moses stands for the law, Elijah for the prophets'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'Moses, the promulgator of the law, and Elijah the representative of the prophets and especially distinguished among them as the one who had not died'
  - where: 'note 17:3 “Moses and Elijah”'
    claim: 'The visitants came to strengthen Jesus as He neared His death, as angels did after the temptation and in Gethsemane'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'so at this critical and crucial period, the beginning of the end, visitants from the unseen world came to comfort and support Him.'

  - where: 'note 17:4 “Three tabernacles”'
    claim: 'At the Feast of Tabernacles each worshiper built a booth of boughs; Peter probably wanted to delay the visitants’ departure'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'at the annual feast of Tabernacles, it was customary to erect a little bower, or booth of wattled boughs, for each individual worshiper, into which he might retire for devotion. So far as there was a purpose in Peter’s proposition, it seems to have been that of delaying the departure of the visitants.'
  - where: 'note 17:4 “Three tabernacles”'
    claim: 'The Transfiguration seems to have come as the Feast of Tabernacles approached; Peter’s proposal suggests they knew it'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'The transfiguration event seems to have occurred as the Feast of Tabernacles approached. The chief apostles wanted to craft three tabernacles for Jesus, Moses, and Elijah as the ancient prophets departed, which suggests they recognized the approach of the feast (Luke 9:33).'

  - where: 'note 17:5 “Hear ye him”'
    claim: 'The voice was Elohim’s, addressed to the apostles, not to Jesus, who had been acknowledged at His baptism'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'yet that voice had been addressed to the three apostles rather than to Jesus, who had already received the Father’s acknowledgment and attestation on the occasion of His baptism.'
  - where: 'note 17:5 “Hear ye him”'
    claim: '“Hear ye him” attested that the law and the prophets gave way to the Messiah; the apostles were to follow Him, not Moses or Elijah'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The fulfillment of the law and the superseding of the prophets by the Messiah was attested in the command—Hear ye Him. … The apostles were to be guided neither by Moses nor Elijah, but by Him, their Lord, Jesus the Christ.'
  - where: 'note 17:5 “Hear ye him”'
    claim: 'To hear Him is to obey Him'
    key: bd-transfiguration
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/transfiguration-mount-of?lang=eng'
    quote: 'heard the voice of the Father bearing witness that Jesus is His beloved Son, in whom the Father is pleased, and commanding the brethren to hear (obey) Him.'
  - where: 'note 17:5 “Hear ye him”'
    claim: 'Mountain, cloud and shining face at Sinai and on the mount, in Matthew’s portrayal of Jesus as a new Moses'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'Divine interactions on mountain tops, under cover of thick clouds, resulted in transfiguration and shining faces for both (Exodus 19:9; 24:16; 34:29; Matthew 17:1–12).'

  - where: 'note 17:9 “Until the Son of man be risen”'
    claim: 'The charge kept them from telling even the rest of the Twelve'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The comprehensiveness of the Lord’s injunction, that until after His rising from the dead they tell no man of their experiences on the mount, prohibited them from informing even their fellows of the Twelve.'
  - where: 'note 17:9 “Until the Son of man be risen”'
    claim: 'They had no clear idea what resurrection meant'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'They seem to have had no definite conception as to what was meant by a resurrection'
  - where: 'note 17:9 “Until the Son of man be risen”'
    claim: 'After the Ascension Peter testified of it (2 Peter 1:16–18)'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'Later, after the Lord had ascended to His glory, Peter testified to the Church of the wondrous experience, in this forceful way'

  - where: 'note 17:11 “Two Eliases”'
    claim: 'The JST adds “as the prophets have written” and Malachi’s messenger, and has the disciples understand John and another who would restore all things'
    key: jst-matt-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/17?lang=eng'
    quote: 'Then the disciples understood that he spake unto them of John the Baptist, and also of another who should come and restore all things, as it is written by the prophets.'
  - where: 'note 17:11 “Two Eliases”'
    claim: 'JST verse 11 quotes Malachi’s messenger for John'
    key: jst-matt-17
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/17?lang=eng'
    quote: 'And again I say unto you that Elias has come already, concerning whom it is written, Behold, I will send my messenger, and he shall prepare the way before me'
  - where: 'note 17:11 “Two Eliases”'
    claim: 'Two Eliases: John the preparer, Jesus the Restorer'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'These passages are sufficiently clarified to show that anciently two Eliases were spoken of, one as a preparer and the other a restorer. John was sent to prepare the way for Jesus, Jesus Himself being the Restorer'
  - where: 'note 17:11 “Two Eliases”'
    claim: 'The disciples expected Elijah to precede the Messiah’s triumphant coming'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'they marveled that such a thing could be at that time, since as they had interpreted the scriptures, it had been predicted that Elijah should precede the Messiah’s triumphal advent.'
  - where: 'note 17:11 “Two Eliases”'
    claim: 'Malachi’s promise of Elijah was not fulfilled by John but began at Kirtland on April 3, 1836'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'did not reach fulfillment in the mission of John the Baptist, nor in that of any other “Elias”; its complete realization was inaugurated on the third day of April, 1836, when Elijah appeared in the temple at Kirtland'

  - where: 'note 17:17 “The disciples among the faithless”'
    claim: 'The rebuke was addressed primarily to the apostles'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'These words in which there is evident reproof, however mild and pitying it may be, were addressed primarily to the apostles; whether exclusively so or to them and others is of minor importance.'
  - where: 'note 17:17 “The disciples among the faithless”'
    claim: 'Their failure had brought ridicule from the scribes'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The disciples’ failure to heal the stricken youth had evidently brought upon them hostile criticism, taunts and ridicule from the unbelieving scribes'
  - where: 'note 17:17 “The disciples among the faithless”'
    claim: 'On their mission they had cast out evil spirits; now, a day without Him, they could not'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'While on their mission, though away from their Master’s helpful presence, they had successfully rebuked and cast out evil spirits as they had received special power and commission to do; but now, during His absence of a day they had found themselves unable.'

  - where: 'note 17:20 “Faith as a grain of mustard seed”'
    claim: 'The mustard seed compares quality of faith, not quantity; what faith can do depends on its genuineness'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The comparison between effective faith and a grain of mustard seed is one of quality rather than of quantity; it connotes living, virile faith, like unto the seed, however small, from which a great plant may spring'
  - where: 'note 17:20 “Faith as a grain of mustard seed”'
    claim: 'What faith achieves is conditioned by its purity; the apostles had been reproved before for little faith'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Hereby we learn that the achievements possible to faith are limited or conditioned by the genuineness, the purity, the unmixed quality of that faith.'

  - where: 'note 17:21 “Prayer and fasting”'
    claim: 'The disciples did not yet fast (Matt. 9:14–15)'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/17.htm'
    quote: 'The disciples, we know, did not as yet fast (Matthew 9:14-15)'
  - where: 'note 17:21 “Prayer and fasting”'
    claim: 'The saying implies degrees in the power of evil spirits and in what degrees of faith achieve; the apostles had cast out demons before'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'indicates gradation in the malignity and evil power of demons, and gradation also in the results of varying degrees of faith. The apostles who failed on the occasion referred to had been able to cast out demons at other times.'
  - where: 'note 17:21 “Prayer and fasting”'
    claim: 'Prudent fasting and genuine prayer develop faith and its power for good'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Fasting, when practised in prudence, and genuine prayer are conducive to the development of faith with its accompanying power for good.'

  - where: 'note 17:23 “Exceeding sorry”'
    claim: 'Their sorrow was vague; they shrank from understanding'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/17.htm'
    quote: 'Their sorrow was vague and dim, and they shrank from that which might make it more definite.'
  - where: 'note 17:23 “Exceeding sorry”'
    claim: 'His death and resurrection was the theme of His instruction to the Twelve in this season'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'The particular theme of His special and advanced instruction to the Twelve was that of His approaching death and resurrection; and this was dwelt upon again and again, for they were slow or unwilling to comprehend.'
  - where: 'note 17:23 “Exceeding sorry”'
    claim: 'The mind is loath to search into what it does not want to believe'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'their failure to comprehend was in part due to the fact that the human mind is loath to search deeply into anything it desires not to believe.'
  - where: 'note 17:23 “Exceeding sorry”'
    claim: 'They grasped the death but had only dim comprehension of the rising'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'and with equal plainness they had been told that Jesus would rise again; but of this latter eventuality they had but dim comprehension.'

  - where: 'note 17:24 “The temple tax”'
    claim: 'The tribute of verse 24 is the temple rate, half a shekel from every male over twenty, for the temple services; different from the Roman tax of verse 25'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/17.htm'
    quote: 'The latter is the census, or Roman poll-tax; the former was the Temple-rate, paid by every male Israelite above the age of twenty (Exodus 30:13-16; 2Chronicles 24:9). It was fixed at a half-shekel a head'
  - where: 'note 17:24 “The temple tax”'
    claim: 'The rate paid for the temple’s services'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/17.htm'
    quote: 'was paid into the Corban, or treasury of the Temple, and was used to defray the expenses of its services.'
  - where: 'note 17:24 “The temple tax”'
    claim: 'The didrachmon was half a shekel'
    key: thayer
    url: 'https://biblehub.com/greek/1323.htm'
    quote: 'a didrachmon or double-drachma, a silver coin equal to two Attic drachmas or one Alexandrian, or half a shekel'
  - where: 'note 17:24 “The temple tax”'
    claim: 'The collectors asked Peter perhaps out of doubt whether Jesus owed it, since priests and rabbis claimed exemption'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'may suggest the possibility of doubt in the collector’s mind as to whether Jesus was amenable to the tax, since priests and rabbis generally claimed exemption.'
  - where: 'note 17:24 “The temple tax”'
    claim: 'The tax was originally called atonement money'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'This tribute, as prescribed through Moses, was originally known as “atonement money,” and its payment was in the nature of a sacrifice to accompany supplication for ransom from the effects of individual sin.'

  - where: 'note 17:26 “Then are the children free”'
    claim: 'As the Son of God, Jesus owed no tax for His Father’s house'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Peter must have seen the inconsistency of expecting Jesus, the acknowledged Messiah, to pay atonement money, or a tax for temple maintenance, inasmuch as the temple was the House of God, and Jesus was the Son of God'
  - where: 'note 17:26 “Then are the children free”'
    claim: 'Paying without explanation might have looked to the apostles like an admission that He was subject to the temple'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'the payment of the tax in ordinary course and without explanation by Jesus might have appeared as an admission that He was subject to the temple, and therefore less than He had claimed and less than they had confessed Him to be.'
  - where: 'note 17:26 “Then are the children free”'
    claim: 'Refusing would have claimed the title “Son of God” prematurely; He surrendered a freedom He could claim'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/17.htm'
    quote: 'To have refused to pay the didrachma on purely personal grounds would have been to claim prematurely that title of the Christ, the “Son of God,” which He had told His disciples at this crisis not to claim for Him (Matthew 16:20).'

  - where: 'note 17:27 “A coin for two”'
    claim: 'The stater was a shekel, four drachmas'
    key: thayer
    url: 'https://biblehub.com/greek/4715.htm'
    quote: 'a silver stater equivalent to four Attic or two Alexandrian drachmas, a Jewish shekel'
  - where: 'note 17:27 “A coin for two”'
    claim: 'The coin was the exact tax for two; Jesus said “for me and thee,” not “for us”'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'and therefore the exact amount of the tax for two persons. “That take, and give unto them for me and thee” said Jesus. It is notable that He did not say “for us.”'
  - where: 'note 17:27 “A coin for two”'
    claim: 'He always kept His unique status as the Son of God'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'He reverently acknowledged that He was the Son of God in a literal sense that did not apply to any other being.'
  - where: 'note 17:27 “A coin for two”'
    claim: 'The coin need not have been unusual; the miracle lay in the knowledge; no miracle was for His own need'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'We need not assume that the stater was other than an ordinary coin that had fallen into the water, nor that it had been taken by the fish in any unusual way.'
  - where: 'note 17:27 “A coin for two”'
    claim: 'No miracle of His was for personal gain or His own need'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'Moreover, we find no instance of a miracle wrought by the Lord for personal gain or relief of His own need, however pressing.'

  - where: christ
    claim: 'The Father introduces His Son with few words; the three times came to people in fear'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'Now, my dear brothers and sisters, consider the fact that in these three instances just mentioned, just before the Father introduced the Son, the people involved were in a state of fear and, to some degree, desperation.'
  - where: christ
    claim: 'Hearing the Son helps most in uncertainty and fear; to hearken is to listen with intent to obey'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'Our Father knows that when we are surrounded by uncertainty and fear, what will help us the very most is to hear His Son.'
  - where: christ
    claim: 'To hearken means to listen with the intent to obey'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'It means “to listen with the intent to obey.” To hearken means to “hear Him”—to hear what the Savior says and then to heed His counsel.'
  - where: christ
    claim: 'The Father introduced the Son on the mount and to Joseph Smith with the same few words'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'On the Mount of Transfiguration to Peter, James, and John, God said, “This is my beloved Son: hear him.”'

  - where: setting
