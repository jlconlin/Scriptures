  - where: 'note 17:27 “A coin for two”'
    claim: 'He spoke of “my Father and your Father,” not “our Father”'
    key: talmage-jesus-christ-24
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-24?lang=eng'
    quote: 'This is illustrated by His expressions “My Father and your Father,” “My God and your God,” instead of our Father and our God.'
  - where: 'note 17:27 “A coin for two”'
