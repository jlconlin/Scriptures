    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'As angels had been sent to minister unto Him after the trying scenes of the forty days’ fast and the direct temptation of Satan, and as, in the agonizing hour of His bloody sweat, He was to be sustained anew by angelic ministry'
  - where: 'note 17:3 “Moses and Elijah”'
    claim: 'The decease was the voluntary surrender of His life'
    key: talmage-jesus-christ-23
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-23?lang=eng'
    quote: 'The decease that the Savior was then so soon to accomplish was the voluntary surrender of His life in fulfillment of a purpose at once exalted and foreordained'
  - where: 'note 17:4 “Three tabernacles”'
