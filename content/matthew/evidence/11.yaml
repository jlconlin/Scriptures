chapter: 11
claims:
  - where: setting
    claim: 'Matthew closes each of his first four discourses with the formula “when Jesus had ended these…”, 11:1 among them'
    key: strathearn-matthew-editor
    url: 'https://rsc.byu.edu/how-new-testament-came-be/matthew-editor-life-teachings-jesus'
    quote: 'At the end of each of the first four discourses, he added, “And it came to pass, when Jesus had ended these” sayings, teachings, or parables (kai egeneto hote etelesen ho Iēsous; Matthew 7:28; see also Matthew 11:1; 13:53; 19:1).'
  - where: setting
    claim: 'The Gospels do not name John’s prison; Josephus does'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'The four Gospel accounts do not identify where John was imprisoned; however, Josephus does (Flavius Josephus, Antiquities of the Jews, 18.5.1–2).'
  - where: setting
    claim: 'John was held at Machaerus, east of the Dead Sea'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'John was taken to a prison called Machaerus on the eastern shore of the Dead Sea for his bold assertion of righteous principles to Herod Antipas'
  - where: setting
    claim: 'John was probably in prison a year or more'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'Quite possibly John was placed in prison sometime near the end of the first year of Jesus’s ministry and probably remained in prison for at least a year, maybe a little longer.'
  - where: setting
    claim: 'Talmage: news of the raising of the young man at Nain prompted John’s message'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Particularly was he informed of the miraculous raising of the young man at Nain; and forthwith he commissioned two of his disciples to bear a message of inquiry to Jesus.'
  - where: setting
    claim: 'Luke’s thanksgiving ends with the Son revealing the Father (Luke 10:22), with no “Come unto me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/10?lang=eng'
    quote: 'no man knoweth who the Son is, but the Father; and who the Father is, but the Son, and he to whom the Son will reveal him.'
  - where: 'note 11:21 “Towns that saw the mighty works”'
    claim: 'The footnote on “tolerable” in verse 22 points to D&C 45:54'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'D&C 45:54; 75:22.'
  - where: thread
    claim: 'Talmage: the prayer of verses 25–27 followed the unbelief of the towns'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Seemingly faint at heart over the unbelief of the people, Jesus sought strength in prayer.'

  - where: 'note 11:3 “Did John doubt?”'
    claim: 'John had trouble persuading these disciples to follow Jesus; their testimony, not his, was in question'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'It appears that John had difficulty persuading at least these disciples to leave him and follow Jesus. John had already borne testimony of Jesus as the Lamb of God'
  - where: 'note 11:3 “Did John doubt?”'
    claim: 'It was the two disciples’ testimony that was in question; they returned with their own witness'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'It was not John’s testimony that was in question but the testimony of these two disciples. After observing Jesus’s preaching and miraculous healings, they returned to report to John, undoubtedly bearing their own new witness'
  - where: 'note 11:3 “Did John doubt?”'
    claim: 'Talmage: John may have grown despondent in prison and wondered if he had been forgotten'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'But, left in prison, he may have become despondent, and may have permitted himself to wonder whether that Mightier One had forgotten him.'
  - where: 'note 11:3 “Did John doubt?”'
    claim: 'Talmage: the message was more a reminder than doubt, and largely meant to confirm the disciples’ faith'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'his message was rather a reminder than a plain inquiry based on actual doubt. Indeed, we have good grounds for inference that John’s purpose in sending disciples to inquire of Christ was partly, and perhaps largely, designed to confirm in those disciples an abiding faith in the Christ.'

  - where: 'note 11:5 “Signs Isaiah had named”'
    claim: 'Isaiah 35:5 has the blind seeing and the deaf hearing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/35?lang=eng'
    quote: 'Then the eyes of the blind shall be opened, and the ears of the deaf shall be unstopped.'
  - where: 'note 11:5 “Signs Isaiah had named”'
    claim: 'Isaiah 61:1 has the anointed one preaching good tidings to the meek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/61?lang=eng'
    quote: 'The Spirit of the Lord God is upon me; because the Lord hath anointed me to preach good tidings unto the meek'
  - where: 'note 11:5 “Signs Isaiah had named”'
    claim: 'Talmage: John would recognize Isaiah’s tokens by which the Messiah would be known'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'the imprisoned prophet could scarcely have failed to remember the predictions of Isaiah, that by those very tokens of miracle and blessing should the Messiah be known'
  - where: 'note 11:5 “Signs Isaiah had named”'
    claim: 'Talmage: those expecting a conquering Messiah grew impatient and took offense; misunderstanding leads to offense'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'Misunderstanding is the prelude to offense. Gauged by the standard of the then current conception of what the Messiah would be, the work of Christ must have appeared to many as failure'
  - where: 'note 11:5 “Signs Isaiah had named”'
    claim: 'Talmage: the expectation was a conquest of oppressors and a worldly restoration of David’s house'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'those who were looking for some sudden manifestation of His power in the conquest of Israel’s oppressors and the rehabilitation of the house of David in worldly splendor, grew impatient, then doubtful'
  - where: 'note 11:5 “Signs Isaiah had named”'
    claim: 'Talmage: verse 6 was a gentle rebuke of John’s incomplete understanding of the Messiah’s mission'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'a further though yet gentle rebuke of the Baptist’s defective comprehension of the Messiah’s mission.'

  - where: 'note 11:7 “No reed, no courtier”'
    claim: 'Talmage: John was no reed but an unbending oak; soft raiment belonged in the king’s court'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'they had found him to be no reed, shaken by the wind, but a firm and unbending oak. … those who wore soft raiment were to be looked for in the court of the king, not in the wilderness, nor in the dungeon where John now lay.'
  - where: 'note 11:7 “No reed, no courtier”'
    claim: 'Jesus contrasted John’s wilderness life and testimony with those at ease in the king’s court'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'He contrasted John’s wilderness abode, his unwavering prophetic testimony, and his simple apparel with those who wore soft and beautiful clothing, lived in ease, and associated with nobles in the king’s court.'
  - where: 'note 11:7 “No reed, no courtier”'
    claim: 'Jesus is possibly alluding to the Herodians'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'Jesus is possibly referring to the Herodians, a politically motivated segment of the Jewish population who supported the dynasty of Herod'

  - where: 'note 11:11 “Why John was the greatest”'
    claim: 'Joseph Smith: John’s greatness was not in miracles'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'How is it that John was considered one of the greatest of prophets? His miracles could not have constituted his greatness.'
  - where: 'note 11:11 “Why John was the greatest”'
    claim: 'Joseph Smith, first reason: John was entrusted with preparing the way before the Lord'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'He was entrusted with a divine mission of preparing the way before the face of the Lord. Whoever had such a trust committed to him before or since? No man.'
  - where: 'note 11:11 “Why John was the greatest”'
    claim: 'Joseph Smith, second reason: John baptized the Son of Man'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'He was entrusted with the important mission, and it was required at his hands, to baptize the Son of Man.'
  - where: 'note 11:11 “Why John was the greatest”'
    claim: 'Joseph Smith, third reason: John was then the only legal administrator holding the keys'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'John, at that time, was the only legal administrator in the affairs of the kingdom there was then on the earth, and holding the keys of power.'
  - where: 'note 11:11 “Why John was the greatest”'
    claim: 'John was the first fulfillment of Isaiah’s and Malachi’s prophecies of a preparer'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'Jesus announced that John was more than a prophet—he was the first fulfillment of Isaiah’s and Malachi’s prophecies about an Elias or preparer'

  - where: 'note 11:11 “Who is least in the kingdom?”'
    claim: 'Joseph Smith: the least in the kingdom is Jesus Himself'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'Jesus was looked upon as having the least claim in God’s kingdom, and [seemingly] was least entitled to their credulity as a prophet; as though He had said—‘He that is considered the least among you is greater than John—that is I myself.’'
  - where: 'note 11:11 “Who is least in the kingdom?”'
    claim: 'The footnote renders the Greek “he who is less important”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'GR but he who is less important.'

  - where: 'note 11:12 “Violence against the kingdom”'
    claim: 'The footnote: violent men seizing control of it or plundering it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'GR violent men are seizing control of it, or plundering it.'
  - where: 'note 11:12 “Violence against the kingdom”'
    claim: 'Ellicott: the verb may be middle or passive; he reads it of the eager crowds pressing in'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/11.htm'
    quote: 'The Greek verb may be either in the middle voice, “forces its way violently,” or passive … The words describe the eager rush of the crowds of Galilee and Judæa, first to the preaching of the Baptist, and then to that of Jesus.'
  - where: 'note 11:12 “Violence against the kingdom”'
    claim: 'Talmage: the kingdom had been rejected with violence since John began to preach'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'from the day of John’s preaching to the time at which Christ then spoke, the kingdom of heaven had been rejected with violence'
  - where: 'note 11:12 “Violence against the kingdom”'
    claim: 'JST Matt. 11:13: the violent shall have no power'
    key: jst-matt-11
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/11?lang=eng'
    quote: 'But the days will come, when the violent shall have no power; for all the prophets and the law prophesied that it should be thus until John.'
  - where: 'note 11:12 “Violence against the kingdom”'
    claim: 'The Herods tried to thwart John and Jesus; the JST promises the violent will have no power'
    key: benson-matthews-john-baptist
    url: 'https://rsc.byu.edu/vol-10-no-2-2009/john-baptist-miracle-mission'
    quote: 'Although wicked men—Herod the Great and his son Antipas—attempted to thwart both Jesus and John from their foreordained missions, Jesus prophesied in conjunction with his testimony of John that “the days will come, when the violent shall have no power”'

  - where: 'note 11:14 “Which Elias?”'
    claim: 'Elias is the Greek form of Elijah; at the Transfiguration it can only be Elijah'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'It is the New Testament (Greek) form of Elijah (Hebrew), as in Luke 4:25–26, James 5:17, and Matt. 17:1–4. Elias in these instances can only be the ancient prophet Elijah'
  - where: 'note 11:14 “Which Elias?”'
    claim: 'Elias is also a title for a forerunner, as John is in JST Matt. 11:13–15; two Eliases, preparer and restorer'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'Elias is also a title for one who is a forerunner; for example, John the Baptist, as in JST Matt. 11:13–15 … anciently two Eliases were spoken of, one as a preparer and the other a restorer.'
  - where: 'note 11:14 “Which Elias?”'
    claim: 'Jewish leaders and disciples knew something of the doctrine of Elias; revelation to Joseph Smith brings it into focus'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'It is evident from the questions they asked that both the Jewish leaders and the disciples of Jesus knew something about the doctrine of Elias'
  - where: 'note 11:14 “Which Elias?”'
    claim: 'JST Matt. 11:15: John was the Elias to come and prepare all things'
    key: jst-matt-11
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/11?lang=eng'
    quote: 'And if ye will receive it, verily, he was the Elias, who was for to come and prepare all things.'
  - where: 'note 11:14 “Which Elias?”'
    claim: 'Talmage: Elias here is a title, not Elijah the Tishbite'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'the designation, Elias, here applied by Jesus to the Baptist, is a title rather than a personal name, and that it has no reference to Elijah, the ancient prophet called the Tishbite.'


  - where: 'note 11:19 “Wisdom proved right by her children”'
    claim: 'Ellicott: wisdom is acquitted, in stern or joyous forms, by all who are her children'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/11.htm'
    quote: 'is evermore acquitted, justified, acknowledged as righteous, alike in her severer or more joyous forms, by all who are indeed her children, i.e., by all who seek and love her'
  - where: 'note 11:19 “Wisdom proved right by her children”'
    claim: 'The footnote gives “by her deeds, works”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'GR by her deeds, works.'

  - where: 'note 11:21 “Towns that saw the mighty works”'
    claim: 'Chorazin: town north of the lake where unrecorded mighty works were done'
    key: bd-chorazin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chorazin?lang=eng'
    quote: 'A town north of the Sea of Galilee, in which some of our Lord’s mighty works were done (of which no record is preserved)'
  - where: 'note 11:21 “Towns that saw the mighty works”'
    claim: 'Bethsaida: home of Peter, Andrew and Philip; the one denounced probably Philip’s pagan capital'
    key: bd-bethsaida
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethsaida?lang=eng'
    quote: 'When Jesus denounced Bethsaida for its unbelief (Matt. 11:21; Luke 10:13), He probably referred to the pagan city (Philip’s capital), not to the older city, composed largely of fishermen settled on the shore of the lake.'
  - where: 'note 11:21 “Towns that saw the mighty works”'
    claim: 'The older Bethsaida was the home of Peter, Andrew and Philip'
    key: bd-bethsaida
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethsaida?lang=eng'
    quote: 'The older city was on the northeast end of the Sea of Galilee, near Capernaum, and was the home of Peter, Andrew, and Philip'
  - where: 'note 11:21 “Towns that saw the mighty works”'
    claim: 'Tyre was a commercial seaport whose destruction the prophets foretold'
    key: bd-tyre
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng'
    quote: 'an important commercial and seaport town of Syria'
  - where: 'note 11:21 “Towns that saw the mighty works”'
    claim: 'D&C 45:54: it shall be tolerable for those who knew no law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'they that knew no law shall have part in the first resurrection; and it shall be tolerable for them.'

  - where: 'note 11:23 “Capernaum, exalted unto heaven”'
    claim: 'Capernaum was Jesus’s home, “his own city,” where many miracles were done'
    key: bd-capernaum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/capernaum?lang=eng'
    quote: 'Here the Lord lived after the beginning of His ministry, so that Capernaum is called “his own city” (compare Matt. 9:1 with Mark 2:1).'
  - where: 'note 11:23 “Capernaum, exalted unto heaven”'
    claim: 'Ellicott: exalted by the works it witnessed, not prosperity; “hell” here is Hades, the grave, not Gehenna'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/11.htm'
    quote: 'In this sense, and not in any outward prosperity, had Capernaum been “exalted unto heaven.” All this, however, had been in vain, and therefore the sentence was passed on it that it should be “brought down to hell,” i.e., to Hades, the grave, not Gehenna.'

  - where: 'note 11:25 “Hidden from the wise, revealed to babes”'
    claim: 'Footnote: “babes” is innocent people, with 2 Ne. 9:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'GR innocent people. 2 Ne. 9:42 (42–43)'
  - where: 'note 11:25 “Hidden from the wise, revealed to babes”'
    claim: 'Talmage: Jesus thanked God for giving a testimony of the truth to the humble rather than the learned'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'He voiced His reverent gratitude that God had imparted a testimony of the truth to the humble and simple rather than to the learned and great'


  - where: 'note 11:29 “A yoke for two”'
    claim: 'A yoke joins two animals side by side to pull a load'
    key: bednar-bear-up-burdens
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/04/bear-up-their-burdens-with-ease?lang=eng'
    quote: 'A yoke is a wooden beam, normally used between a pair of oxen or other animals that enables them to pull together on a load. A yoke places animals side-by-side so they can move together in order to accomplish a task.'
  - where: 'note 11:29 “A yoke for two”'
    claim: 'Elder Bednar: covenants yoke us to the Lord, who invites us to pull with Him'
    key: bednar-bear-up-burdens
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/04/bear-up-their-burdens-with-ease?lang=eng'
    quote: 'Making and keeping sacred covenants yokes us to and with the Lord Jesus Christ. In essence, the Savior is beckoning us to rely upon and pull together with Him, even though our best efforts are not equal to and cannot be compared with His.'
  - where: 'note 11:29 “A yoke for two”'
    claim: 'Talmage: Jesus invited them from the burdens of religious exactions and formalism to spiritual worship'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'He invited them from drudgery to pleasant service; from the well-nigh unbearable burdens of ecclesiastical exactions and traditional formalism, to the liberty of truly spiritual worship; from slavery to freedom'
  - where: 'note 11:29 “A yoke for two”'
    claim: 'Talmage: the gospel was liberty, not license; it required obedience'
    key: talmage-jesus-christ-18
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-18?lang=eng'
    quote: 'The gospel He offered them was the embodiment of liberty, but not of license; it entailed obedience and submission'

  - where: 'note 11:29 “Meek and lowly in heart”'
    claim: 'Elder Bednar: of all attributes the Savior chose meekness to describe Himself'
    key: bednar-meek
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/meek-and-lowly-of-heart?lang=eng'
    quote: 'Instructively, the Savior chose to emphasize meekness from among all the attributes and virtues He potentially could have selected.'
  - where: 'note 11:29 “Meek and lowly in heart”'
    claim: 'Elder Bednar’s definition of meekness'
    key: bednar-meek
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/meek-and-lowly-of-heart?lang=eng'
    quote: 'Meekness is a defining attribute of the Redeemer and is distinguished by righteous responsiveness, willing submissiveness, and strong self-restraint.'
  - where: 'note 11:29 “Meek and lowly in heart”'
    claim: 'Meekness is strong, not weak'
    key: bednar-meek
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/meek-and-lowly-of-heart?lang=eng'
    quote: 'Meekness is strong, not weak; active, not passive; courageous, not timid; restrained, not excessive; modest, not self-aggrandizing; and gracious, not brash.'
  - where: 'note 11:29 “Meek and lowly in heart”'
    claim: 'Meekness is a readiness to learn, from the Spirit and from others'
    key: bednar-meek
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/meek-and-lowly-of-heart?lang=eng'
    quote: 'a distinguishing characteristic of meekness is a particular spiritual receptivity to learning both from the Holy Ghost and from people who may seem less capable, experienced, or educated'
  - where: 'note 11:29 “Meek and lowly in heart”'
    claim: 'Elder Bednar sets D&C 19:23 (“Learn of me … walk in the meekness of my Spirit”) beside Matt. 11:29 as the same pattern'
    key: bednar-meek
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/meek-and-lowly-of-heart?lang=eng'
    quote: 'A similar pattern is evident in a revelation received by the Prophet Joseph Smith in 1829. The Lord declared, “Learn of me, and listen to my words; walk in the meekness of my Spirit, and you shall have peace in me.”'
  - where: 'note 11:29 “Meek and lowly in heart”'
    claim: 'Mormon makes meekness the foundation of the spiritual gifts (Moro. 7:43–44)'
    key: bednar-meek
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/meek-and-lowly-of-heart?lang=eng'
    quote: 'Mormon identifies meekness as the foundation from which all spiritual capacities and gifts arise.'
  - where: 'note 11:29 “Meek and lowly in heart”'
    claim: 'Footnote: meek and lowly is “gentle and humble”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'GR gentle and humble.'

  - where: christ
    claim: 'Elder Bednar: yoked with Christ by covenants and His Atonement, disciples seek His will and bear burdens with ease'
    key: bednar-bear-up-burdens
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/04/bear-up-their-burdens-with-ease?lang=eng'
