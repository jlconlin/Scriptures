- where: 'note 2:1 “Who the wise men were”'
  claim: 'Matthew does not number the magi; the plural means two or more'
  key: huntsman-wise-men-kings
  url: 'https://www.byunewtestamentcommentary.com/?p=632'
  quote: 'Nowhere, however, does he number them, but because he speaks of wise men in the plural, there must have been two or more.'
- where: 'note 2:1 “Who the wise men were”'
  claim: 'The names Gaspar, Balthasar and Melchior settled in the West by the third century'
  key: huntsman-wise-men-kings
  url: 'https://www.byunewtestamentcommentary.com/?p=632'
  quote: 'by the third century the tradition in the West settled on the names Gaspar, Balthasar, and Melchior for the “kings.”'
- where: 'note 2:2 “The star in the Book of Mormon”'
  claim: 'Matthew mentions a new star but not the prophecy or its brightness; the Book of Mormon records both prophecy and fulfillment'
  key: sc-knowhy-769
  url: 'https://scripturecentral.org/knowhy/how-is-the-revelation-of-the-magi-similar-to-the-book-of-mormon-s-prophecies-of-christ'
  quote: 'Though the Gospel of Matthew mentions a new star, neither the details of this prophecy nor the note regarding the star’s luster are found in biblical texts. Yet the matching prophecies and fulfillments are recorded in the Book of Mormon'
- where: 'note 2:2 “The star in the Book of Mormon”'
  claim: 'In the Book of Mormon the star appeared before Jesus was born, a detail missing in the New Testament'
  key: sc-knowhy-769
  url: 'https://scripturecentral.org/knowhy/how-is-the-revelation-of-the-magi-similar-to-the-book-of-mormon-s-prophecies-of-christ'
  quote: 'In both the Revelation of the Magi and the Book of Mormon, the star appeared before Jesus was born, another detail missing in the New Testament account.'
- where: 'note 2:2 “The star in the Book of Mormon”'
  claim: 'Possibly magi of Jewish descent made star watching part of their priestly function, with Numbers 24:17 as a very early messianic prophecy'
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'It is not hard to see how Jewish priests in the Persian Empire would be categorized with priests of Zoroastrianism under the general rubric Magi and make astrology or star watching part of their priestly function. After all, a very early prophecy of the appearance of the Messiah'
- where: 'note 2:3 “Why Herod was troubled”'
  claim: 'Idumea is Edom'
  key: bd-idumea
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/idumea?lang=eng'
  quote: 'Edom. Isa. 34:5–6; Ezek. 35:15; 36:5; Mark 3:8.'
- where: 'note 2:3 “Why Herod was troubled”'
  claim: 'Herod had his wife killed in jealousy, then her two sons'
  key: bd-herod
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
  quote: 'In a fit of jealousy he had his wife, whom he dearly loved, put to death; later on he had her two sons, Alexander and Aristobulus, also murdered.'
- where: 'note 2:22 “Archelaus”'
  claim: 'Archelaus sent his army against a disturbance at the temple during a festival; his horsemen killed three thousand'
  key: josephus-antiquities
  url: 'https://penelope.uchicago.edu/josephus/ant-17.html'
  quote: 'which horsemen slew three thousand men: while the rest went to the neighbouring mountains.'
- where: 'note 2:22 “Archelaus”'
  claim: 'Jewish envoys to Augustus named the slaughter of three thousand at the temple as his first action'
  key: josephus-antiquities
  url: 'https://penelope.uchicago.edu/josephus/ant-17.html'
  quote: 'by that his first action which concerned them, his own citizens, and God himself also; when he made the slaughter of three thousand of his own countrymen at the temple.'
- where: 'note 2:22 “Archelaus”'
  claim: 'Antipas was then thought milder and may have been away in Rome, so Galilee offered greater safety'
  key: ellicott-matthew
  url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
  quote: 'The temper of Antipas on the other hand was as yet looked on as milder. This, and possibly his absence from Galilee on a visit to Rome, may well have led Joseph to turn to that region as offering a prospect of greater safety'
- where: 'note 2:22 “Archelaus”'
  claim: 'Archelaus''s oppression became intolerable; he was deposed after nine years'
  key: ellicott-matthew
  url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
  quote: 'Nine years later the oppression of Archelaus became so intolerable that both Jews and Samaritans complained of him to the Emperor, and he was deposed and banished to Gaul.'
- where: 'note 2:23 “Growing up in Nazareth”'
  claim: 'Jesus was about thirty when He began His ministry'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
  quote: 'And Jesus himself began to be about thirty years of age'
- where: 'note 2:23 “Growing up in Nazareth”'
  claim: 'The crowds called Him Jesus of Nazareth'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/21?lang=eng'
  quote: 'This is Jesus the prophet of Nazareth of Galilee.'
- where: 'note 2:23 “Which prophets called Him a Nazarene?”'
  claim: 'The Bible names many books it does not contain (Jasher, Nathan the prophet and others)'
  key: bd-lost-books
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
  quote: 'documents that are mentioned in the Bible in such a way that it is evident they were considered authentic and valuable but that are not found in the Bible today.'
- where: 'note 2:23 “Which prophets called Him a Nazarene?”'
  claim: 'The present Bible is incomplete'
  key: bd-lost-books
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
  quote: 'remind us that the Bible, in its present form, is rather incomplete.'
- where: 'note 2:23 “Which prophets called Him a Nazarene?”'
  claim: 'Matthew may allude to Isaiah 11:1, netzer, the word behind Nazarene and Nazareth'
  key: bd-lost-books
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
  quote: 'There is a possibility, however, that Matthew alluded to Isa. 11:1, which prophesies of the Messiah as a Branch from the root of Jesse, the father of David. The Hebrew word for branch in this case is netzer, the source word of Nazarene and Nazareth.'
- where: 'note 2:11 “A house, and a young child”'
  claim: 'Herod reckoned the two-year limit by the time he had inquired of the wise men'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
  quote: 'from two years old and under, according to the time which he had diligently inquired of the wise men.'
