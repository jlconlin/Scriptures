chapter: 2
claims:
- where: "when"
  claim: "Herod the Great died in the spring of 4 BC, so Jesus was born before then"
  key: sc-knowhy-255
  url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-help-date-the-first-christmas'
  quote: 'The year 4 BC is considered the latest possible date because Herod the Great died in the spring of that year, meaning the Savior must have been born sometime before then (Matthew 2; Luke 1:5).'
- where: "setting"
  claim: "Matthew tells the birth from Joseph's side, with the wise men and the journey to Egypt; Luke from Mary's, with the shepherds"
  key: strathearn-teaching-gospels
  url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
  quote: 'Matthew recounts the birth from Joseph’s perspective and includes the story of the Wise Men’s visit to the young Jesus and the holy family’s subsequent trip to Egypt (see Matthew 1:18–2:15). Luke recounts the birth from Mary’s perspective'
- where: "setting"
  claim: "Matthew alone links Jesus's story to Moses's with the trip to Egypt and the slaughter of the innocents"
  key: strathearn-teaching-gospels
  url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
  quote: 'He is the only Gospel author to link Jesus’s story to that of Moses by including the stories of the holy family’s trip to Egypt and the slaughter of the innocents (see Matthew 2:14, 16).'
- where: "thread"
  claim: "Matthew 1–2 as a prologue: 2:1–12 where the child went (Bethlehem, recognized by the magi), 2:13–23 whence he came (back from Egypt)"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'where did he go (2:1–12, Bethlehem, where he was recognized by the magi), and from whence did he come (2:13–23, back from Egypt, where his family had gone to escape Herod).'
- where: 'note 2:1 “Who the wise men were”'
  claim: "The scriptures do not identify the magi; they were righteous men sent to witness the Son of God, likely of a branch of the Lord's people east of Palestine"
  key: bd-magi
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/magi?lang=eng'
  quote: 'Their identification is not made known in the scriptures, but it is certain that they were righteous men sent on an errand to witness the presence of the Son of God on the earth.'
- where: 'note 2:1 “Who the wise men were”'
  claim: "The Bible Dictionary: likely representatives of a branch of the Lord's people, led by the Spirit, who returned to bear witness"
  key: bd-magi
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/magi?lang=eng'
  quote: 'It seems likely that they were representatives of a branch of the Lord’s people from somewhere east of Palestine, who had come, led by the Spirit, to behold the Son of God and who returned to their people to bear witness'
- where: 'note 2:1 “Who the wise men were”'
  claim: "Number not given; tradition says three from the gifts; as witnesses there would be two or three"
  key: bd-magi
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/magi?lang=eng'
  quote: 'We are not told how many wise men there were, but tradition usually speaks of three, because of the three gifts of gold, myrrh, and frankincense. If they were serving in the capacity of witnesses, there would of necessity have been two or three.'
- where: 'note 2:1 “Who the wise men were”'
  claim: "The Greek magoi points to Persian origin, Zoroastrian priests; perhaps descendants of Jewish exiles who stayed in the east"
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'The term magi or magoi used in the Greek text of Matthew points to a Persian origin. Magi refers to Zoroastrian priests.[24] Perhaps these noble visitors were descendants of Jewish priests who were taken to Babylon as part of the exile in 586 BC'
- where: 'note 2:1 “Who the wise men were”'
  claim: "Kings came from Old Testament passages early Christians read (Ps. 72:10; Isa. 60:3, 6), not from Matthew"
  key: huntsman-wise-men-kings
  url: 'https://www.byunewtestamentcommentary.com/?p=632'
  quote: 'early Christians seem to have made the connection with royalty as they reflected upon certain Old Testament passages, such as Psalm 69:29 and 72:10, that suggested that kings from among the nations would come to Israel bearing gifts.'
- where: 'note 2:1 “Who the wise men were”'
  claim: "Matthew includes Gentiles who recognize Jesus, the magi at the beginning"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'Matthew’s inclusion of Gentiles who recognize Jesus—such as the magi or wise men who worship Jesus as the true King of Israel at the beginning (Matthew 2:11)'
- where: 'note 2:2 “The star in the Book of Mormon”'
  claim: "Matthew's account shows the star prophecy of Numbers 24 being fulfilled"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'Matthew’s account shows the new star prophecy in Numbers 24:15–19 being fulfilled.'
- where: 'note 2:2 “The star in the Book of Mormon”'
  claim: "Samuel the Lamanite prophesied a new star; this is the only reference to the star in the Bible"
  key: sc-knowhy-769
  url: 'https://scripturecentral.org/knowhy/how-is-the-revelation-of-the-magi-similar-to-the-book-of-mormon-s-prophecies-of-christ'
  quote: 'This brief account is the only reference to this star or the Magi in the Bible.'
- where: 'note 2:3 “Why Herod was troubled”'
  claim: "The Herods were Idumeans who had become converts; Herod rebuilt the temple; his reign was disgraced by cruelty, including killing his wife and sons"
  key: bd-herod
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
  quote: 'The Herodian family were Idumeans by birth but had become converts to the Jewish faith.'
- where: 'note 2:3 “Why Herod was troubled”'
  claim: "Herod was unpopular, rebuilt the temple, and was cruel, killing his wife and her sons"
  key: bd-herod
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
  quote: 'In order to gain favor with his subjects, with whom he was most unpopular, he rebuilt the temple at an immense cost. (See Temple of Herod.) His reign was disgraced by many acts of cruelty.'
- where: 'note 2:3 “Why Herod was troubled”'
  claim: "The Joseph Smith Translation has the wise men ask for the Messiah of the Jews"
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
  quote: 'Where is the child that is born, the Messiah of the Jews?'
- where: 'note 2:3 “Why Herod was troubled”'
  claim: "The Joseph Smith Translation adds that Herod greatly feared but did not believe the prophets"
  key: jst-matt-3
  url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
  quote: 'Where is the place that is written of by the prophets, in which Christ should be born? For he greatly feared, yet he believed not the prophets.'
- where: 'note 2:11 “A house, and a young child”'
  claim: "The magi came later, since the family was by then living in a house"
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'We note, however, that these magi apparently came later since the family was by that time living in a “house” (Matthew 2:11).'
- where: 'note 2:11 “A house, and a young child”'
  claim: "Herod's two-year limit suggests up to two years had passed; Matthew now calls Jesus a small boy"
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'Herod’s order to kill all children in the area that were under two years old provides evidence that upwards of two years had transpired between Jesus’s birth and the arrival of the magi, as well as the fact that Matthew now refers to Jesus as a small boy or toddler.'
- where: 'note 2:11 “Gifts fit for a king”'
  claim: "The gifts were valuable and appropriate for the King of the Jews; some see them as symbols"
  key: sc-knowhy-392
  url: 'https://scripturecentral.org/knowhy/why-did-the-wise-men-give-jesus-gold-frankincense-and-myrrh'
  quote: 'These gifts were all extremely valuable and expensive, and were the appropriate gifts for the “king of the Jews” as the wise men called Jesus (v.2). However, many people have shown that these gifts could be symbolic as well.'
- where: 'note 2:11 “Gifts fit for a king”'
  claim: "Gold for kingship, frankincense for priesthood, myrrh for death"
  key: sc-knowhy-392
  url: 'https://scripturecentral.org/knowhy/why-did-the-wise-men-give-jesus-gold-frankincense-and-myrrh'
  quote: 'Gold represents Christ’s kingship, frankincense his role as a priest, and myrrh was thought to foreshadow Christ’s death.'
- where: 'note 2:11 “Gifts fit for a king”'
  claim: "Isaiah 60:6's gold and incense, with Isa. 60:3, shaped the early Christian picture"
  key: huntsman-wise-men-kings
  url: 'https://www.byunewtestamentcommentary.com/?p=632'
  quote: 'A few verses later some of their gifts, and even the camels that were later assumed to be their conveyance, are mentioned'
- where: 'note 2:11 “Gifts fit for a king”'
  claim: "The visit of the magi fulfills elements of Ps. 72 and Isa. 60:3–6"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'The visit of the magi fulfills elements of prophecy found in Psalm 72:10–11, 15; Isaiah 60:3–6; and Micah 5:2.'
- where: 'note 2:15 “A line about Israel, fulfilled in Jesus”'
  claim: "Hosea 11:1 refers to an event in Israel's past, unlike Isaiah's prophecy of the future"
  key: frederick-use-of-ot
  url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
  quote: 'where Isaiah was delivering a prophecy about the future, Hosea was referring to an event in Israel’s distant past.'
- where: 'note 2:15 “A line about Israel, fulfilled in Jesus”'
  claim: "That does not preclude Hosea foreshadowing or Matthew using the words of Jesus"
  key: frederick-use-of-ot
  url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
  quote: 'Hosea’s explicit connections with Israel’s past, however, does not preclude him from speaking prophetically and implicitly foreshadowing the future flight of Jesus to Egypt.[20] Nor does it preclude Matthew from using Hosea’s words to speak about Jesus.'
- where: 'note 2:15 “A line about Israel, fulfilled in Jesus”'
  claim: "Typological prophecy: Jesus retraces Israel's foundational experience"
  key: frederick-use-of-ot
  url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
  quote: 'Understood typologically, Matthew understands Jesus retracing “in his own life the foundational experience of Israel in being called by God out of Egypt.”'
- where: 'note 2:15 “A line about Israel, fulfilled in Jesus”'
  claim: "Matthew reads Hosea typologically, consummated in the journey to and from Egypt"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'Matthew chooses to interpret the Hosea passage typologically, seeing Hosea’s statement as being consummated in the story of Joseph’s taking Jesus and Mary to (and later from) Egypt (see Matthew 2:13–15).'
- where: 'note 2:16 “The children of Bethlehem”'
  claim: "No other writer, including Josephus, mentions the slaughter; it fits Herod's character"
  key: ellicott-matthew
  url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
  quote: 'The fact of the slaughter of the infants of Bethlehem is not mentioned by Josephus, or by any other writer, and has on that ground been called in question. It is admitted, however, on all hands, that it was an act every way in harmony with Herod’s character.'
- where: 'note 2:16 “The children of Bethlehem”'
  claim: "Bethlehem's population and the number of children: perhaps twenty or thirty"
  key: ellicott-matthew
  url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
  quote: 'The population of Bethlehem could hardly have been more than 2,000, and the number of children under two years of age in that number would be between twenty and thirty.'
- where: 'note 2:16 “The children of Bethlehem”'
  claim: "Herod ordered executions of leading men at his death and killed his son Antipater"
  key: ellicott-matthew
  url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
  quote: 'he gave orders for the execution of many of the leading men of Judæa immediately upon his own death, that there might at least be some genuine mourning at his funeral'
- where: 'note 2:16 “The children of Bethlehem”'
  claim: "In the year of the massacre Herod had his son Antipater killed; a few months later he died"
  key: bd-herod
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
  quote: 'In the same year in which he gave the order for the massacre of the infants at Bethlehem, he had Antipater, another of his own sons, put to death. A few months later Herod himself died.'
- where: 'note 2:18 “Rachel weeping again”'
  claim: "Rachel's tomb, a mile north of Bethlehem, was familiar to its people; in one reading Matthew saw Jeremiah's picture reproduced there"
  key: ellicott-matthew
  url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
  quote: 'That picture, St. Matthew felt, had been reproduced once again. The tomb of Rachel was as familiar to the people of Bethlehem (it stands but one mile to the north of the town) as it had been in the time of Jeremiah'
- where: 'note 2:18 “Rachel weeping again”'
  claim: "Ramah (Jer. 40:1) was where the prisoners were taken to be sorted for death or exile"
  key: ellicott-matthew
  url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
  quote: 'Historically, as we find from Jeremiah 40:1, this was the place to which the prisoners were dragged, that Nebuzaradan might assign “such as were for death” to death, others to exile'
- where: 'note 2:20 “The same words once spoken to Moses”'
  claim: "Joseph saving the child by fleeing to Egypt applies Exodus 4:19 to Jesus"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'Joseph saving the young child from death by fleeing to Egypt is one way to apply Exodus 4:19 to Jesus’s story.'
- where: 'note 2:20 “The same words once spoken to Moses”'
  claim: "Jesus and Moses both spared from infanticide while most around them were not"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'Both Jesus and Moses had unusual infancies and childhoods. Both were born into poor families who were part of a conquered people. Both were spared from infanticide while most around them were not.'
- where: 'note 2:20 “The same words once spoken to Moses”'
  claim: "Matthew seeks to show Jesus as the new Moses; the mountain of the sermon"
  key: strathearn-teaching-gospels
  url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
  quote: 'Additionally, Matthew seeks to show that Jesus is the “new Moses.”'
- where: 'note 2:22 “Archelaus”'
  claim: "Herod's kingdom divided: Archelaus Judea, Idumea, Samaria; Antipas Galilee and Perea; Archelaus deposed after nine years"
  key: bd-herod
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
  quote: 'His kingdom was then divided between three of his sons: Archelaus, who received Judea, Idumea, and Samaria; Antipas, who had Galilee and Perea; and Philip, who had the northeast districts of Palestine.'
- where: 'note 2:22 “Archelaus”'
  claim: "Archelaus deposed after nine years"
  key: bd-herod
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
  quote: 'After a reign of nine years Archelaus was deposed by Augustus, and Judea was attached to the Roman province of Syria, being governed by a prefect.'
- where: 'note 2:23 “Growing up in Nazareth”'
  claim: "The Joseph Smith Translation: Jesus grew up with his brethren, waited on the Lord, needed no man to teach him"
  key: jst-matt-3
  url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
  quote: 'And it came to pass that Jesus grew up with his brethren, and waxed strong, and waited upon the Lord for the time of his ministry to come.'
- where: 'note 2:3 “Why Herod was troubled”'
  claim: "In the Joseph Smith Translation the prophecy says plainly that the Messiah would be born in Bethlehem"
  key: jst-matt-3
  url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
  quote: 'And thou Bethlehem, which lieth in the land of Judea, in thee shall be born a prince'
- where: 'note 2:23 “Growing up in Nazareth”'
  claim: "He served under his father and needed not that any man teach him"
  key: jst-matt-3
  url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
  quote: 'And he served under his father, and he spake not as other men, neither could he be taught; for he needed not that any man should teach him.'
- where: 'note 2:23 “Growing up in Nazareth”'
  claim: "Joseph Smith: as a boy Jesus had all the intelligence needed to rule the kingdom of the Jews"
  key: tpjs-2007-ch-3
  url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-3?lang=eng'
  quote: 'When still a boy [Jesus Christ] had all the intelligence necessary to enable Him to rule and govern the kingdom of the Jews, and could reason with the wisest and most profound doctors of law and divinity'
- where: 'note 2:23 “Which prophets called Him a Nazarene?”'
  claim: "Nazarene means belonging to Nazareth; Christians were called Nazarenes"
  key: bd-nazarene
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nazarene?lang=eng'
  quote: 'Belonging to Nazareth. Used of Jesus (Matt. 2:23). Christians were called the “sect of the Nazarenes” (Acts 24:5).'
- where: 'note 2:23 “Which prophets called Him a Nazarene?”'
  claim: "The Old Testament has no such prophecy; it was practically certainly in lost scripture"
  key: talmage-jesus-christ-9
  url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-9?lang=eng'
  quote: 'our current compilation of scriptures constituting the Old Testament contains no record of such prophecy. It is practically certain that this prediction was contained in some one of the many scriptures extant in earlier days but since lost.'
- where: "christ"
  claim: "Gentiles recognize Jesus at the beginning (magi) and the end (centurion); the commission to all the world"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'the centurion at the foot of the cross who acknowledges him as the Son of God at the end (27:54)—and the Risen Lord’s final directive that his eleven remaining disciples take the gospel to all the world (28:16–20)'
- where: "christ"
  claim: "Jesus was born King of the Jews but became the servant, visited in his humble house"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'Jesus was “born King of the Jews” (Matthew 2:2) but became the ultimate servant and, as a child, was visited by the kingly magi in his humble house.'
- where: "setting"
  claim: "Matthew 1–2 answer who Jesus was, how he came to be, where he went and whence he came"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'a prologue (Matthew 1–2) that answered important questions such as who was Jesus (1:1–17), how did he come into being (1:18–25, Jesus’s genealogy)'
- where: "thread"
  claim: "Jesus, like Moses, was spared from infanticide while most around were not"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'Both were spared from infanticide while most around them were not.'
- where: "section 1 plain"
  claim: "“Rule” in verse 6 is, in the Greek, to tend, protect, nurture (the shepherd's word)"
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
  quote: 'tend, protect, nurture'
- where: 'note 2:3 “Why Herod was troubled”'
  claim: "The Herods sought a semi-independent kingdom under the protection of Rome"
  key: bd-herod
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/herod?lang=eng'
  quote: 'Their object was to found, under the protection of Rome, a semi-independent kingdom.'
- where: 'note 2:11 “A house, and a young child”'
  claim: "In Luke it is the shepherds rather than the wise men who worship the baby"
  key: strathearn-teaching-gospels
  url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
  quote: 'where it is the shepherds, rather than the Wise Men, who worship the young baby (see Luke 2).'
- where: 'note 2:16 “The children of Bethlehem”'
  claim: "An event escaping a historian writing eighty or ninety years later of wars and court history"
  key: ellicott-matthew
  url: 'https://biblehub.com/commentaries/ellicott/matthew/2.htm'
  quote: 'yet escape the notice of an historian writing eighty or ninety years afterwards of the wars and court history of the period.'
- where: 'note 2:20 “The same words once spoken to Moses”'
  claim: "Moses fasted forty days; Jesus fasted forty days"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'After leading the children of Israel out of Egypt, Moses fasted for forty days while on Mount Sinai (Exodus 34:28); Jesus also fasted for forty days in the wilderness (see Matthew 4:1–2).'
- where: 'note 2:20 “The same words once spoken to Moses”'
  claim: "Jesus goes up a mountain to give the new law"
  key: strathearn-teaching-gospels
  url: 'https://rsc.byu.edu/learn-me/teaching-four-gospels'
  quote: 'Just as Moses received the law on a mountain, Jesus goes up into a mountain to give the new law (Matthew 5:1'
- where: 'note 2:20 “The same words once spoken to Moses”'
  claim: "Moses born a slave became a prince; Jesus born King became servant"
  key: griffin-matthew-portrayal
  url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
  quote: 'Moses was born as a slave and became a prince in the royal house of the king; Jesus was “born King of the Jews” (Matthew 2:2) but became the ultimate servant'
- where: "setting"
  claim: "Only Matthew among the biblical writers mentions the wise men"
  key: sc-knowhy-769
  url: 'https://scripturecentral.org/knowhy/how-is-the-revelation-of-the-magi-similar-to-the-book-of-mormon-s-prophecies-of-christ'
  quote: 'This brief account is the only reference to this star or the Magi in the Bible.'
- where: 'note 2:23 “Growing up in Nazareth”'
  claim: "The Joseph Smith Translation: after many years the hour of his ministry drew near"
  key: jst-matt-3
  url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
  quote: 'And after many years, the hour of his ministry drew nigh.'
- where: "christ"
  claim: "Joseph's obedience to the spiritual impressions of his dreams brought him into harmony with God"
  key: jenkins-quiet-slumber
  url: 'https://rsc.byu.edu/archived/volume-12-number-1-2011/quiet-slumber-revelation-through-dreams'
  quote: 'His obedience to spiritual impressions brought him into harmony with God and the prophecies of ancient patriarchs and prophets (see Matthew 2).'
- where: "christ"
  claim: "As we live righteously, the Father communicates in a variety of ways and circumstances"
  key: jenkins-quiet-slumber
  url: 'https://rsc.byu.edu/archived/volume-12-number-1-2011/quiet-slumber-revelation-through-dreams'
  quote: 'as we live in righteousness our Father in Heaven will communicate in a variety of ways and in unique circumstances.'
- where: 'setting'
  claim: 'The wise men apparently came later, when the family was living in a house'
  key: skinner-life-jesus
  url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
  quote: 'We note, however, that these magi apparently came later since the family was by that time living in a “house” (Matthew 2:11).'
- where: 'thread'
  claim: 'Herod says he wants to come and worship the child (verse 8) while he seeks to destroy Him (verse 13)'
