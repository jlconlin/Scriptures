chapter: 26
claims:
  - where: when
    claim: 'Tradition places the events of verses 1–16 on the Wednesday of the last week'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Although some Gospel harmonies do not list any events for the Wednesday of Jesus’s last week, traditional observance has associated three short but significant passages with this day.'
  - where: when
    claim: 'The supper was on Thursday evening, the beginning of Friday by Jewish reckoning'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'In the evening, Thursday evening as we reckon time, but the beginning of Friday according to the Jewish calendar, Jesus came with the Twelve'
  - where: setting
    claim: 'John has Passover begin the day after the supper'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John, however, maintains that Passover actually began at sunset the next day, following Jesus’s crucifixion (John 13:1; 18:28, 39; 19:31, 42), making the Last Supper not a Passover meal'
  - where: setting
    claim: 'Matthew 26:1 closes the fifth of the discourses that end each section of the Gospel'
    key: griffin-matthew-portrayal
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/matthews-portrayal-jesus-son-david-new-moses-son-god'
    quote: 'each of these sections concludes with a major discourse, each of which ends with phrases such as, “When Jesus had ended these sayings” (see Matthew 7:28; 11:1; 13:53; 19:1; 26:1)'
  - where: setting
    claim: 'Tradition places the plot, the anointing and Judas’s bargain on the Wednesday of the last week'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Although some Gospel harmonies do not list any events for the Wednesday of Jesus’s last week, traditional observance has associated three short but significant passages with this day.'
  - where: setting
    claim: 'The supper was on Thursday evening, the beginning of Friday by Jewish reckoning'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'In the evening, Thursday evening as we reckon time, but the beginning of Friday according to the Jewish calendar, Jesus came with the Twelve'
  - where: setting
    claim: 'Matthew and Luke follow Mark’s account of the night’s events'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Matthew and Luke parallel Mark’s version of these events, with Luke shortening the account at times to lessen the failings of the disciples'
  - where: thread
    claim: 'The texts present Peter as one in a series of figures who fail Jesus that night'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the texts nevertheless clearly present the literary character of Peter as one in a series of figures who fail Jesus that night—some falling asleep when he asks them to keep watch and others betraying, abandoning, denying, or otherwise leaving Jesus'
  - where: thread
    claim: 'The woman understands that Jesus has come to die, unlike the disciples'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'suggesting that the woman understands that rather than having come to Jerusalem as its earthly king, Jesus has come to die, an understanding that contrasts markedly with that of Peter and the other disciples.'
  - where: thread
    claim: 'Jesus submitted voluntarily, in accordance with what was foreseen'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'to emphasize the fact that He was submitting voluntarily and in accordance with foreseen and predicted developments'
  - where: section 1 plain
    claim: '“Consulted” rendered “plotted,” “subtilty” rendered “treachery”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR treachery, cunning.'
  - where: section 2 plain
    claim: '“For my burial” rendered “to prepare me for my burial”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR to prepare me for my burial.'
  - where: section 4 plain
    claim: '“To such a man” rendered “to a certain man”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR to a certain man.'
  - where: section 5 plain
    claim: '“Testament” rendered “covenant”; “Drink ye all of it” rendered “all of you drink from it”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR All of you drink from it.'
  - where: section 5 plain
    claim: '“Testament” rendered “covenant”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR covenant.'
  - where: section 7 plain
    claim: '“Watch” rendered “stay awake”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR stay awake.'
  - where: section 6 plain
    claim: '“Offended” rendered “stumble” or “fall away”'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'that literally means “caused to stumble” but can also mean to fall away or give up believing.'
  - where: section 7 plain
    claim: '“Sorrowful and very heavy” rendered “distressed and troubled”; “watch” as “stay awake”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR began to be distressed and troubled.'
  - where: section 9 plain
    claim: '“I adjure thee” rendered “I put you under oath”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR charge (you) under oath'
  - where: section 10 plain
    claim: '“Thy speech bewrayeth thee” rendered “your speech gives you away”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR reveals you.'
  - where: 'note 26:2 “Betrayed, or handed over”'
    claim: 'The Gospels use paradidōmi, “hand over,” not the technical word for betray'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'all the Gospels consistently use a term that means “hand over” (Greek, paradidōmi) rather than the technical term meaning “betray” (prodidōmi).'
  - where: 'note 26:2 “Betrayed, or handed over”'
    claim: 'Judas’s act is the first of a series of handings over: to the authorities, to Pilate, to the soldiers'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'makes Judas’s “betrayal” the first in a series of actions—actions, which we noted earlier in our discussion of the passion predictions, that had Jesus delivered first to the Jewish authorities … then by the Jewish leaders to the Roman governor Pilate'
  - where: 'note 26:2 “Betrayed, or handed over”'
    claim: 'The Septuagint of Isaiah 53:6 uses the same verb; Paul says God delivered up His Son'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'the Septuagint uses the same term for “hand over” in its rendition of the prophecy that “the Lord hath laid on him the iniquity of us all” (Isa 53:6; emphasis added), and Paul declares that God himself “spared not his own Son, but delivered [Greek, paredōken] him up for us all”'
  - where: 'note 26:5 “Not on the feast day”'
    claim: 'The council sought to take Jesus secretly, away from the festal crowds, which is why He was arrested at night in Gethsemane'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'By this they meant either not in the middle of the festivities or at least not in the presence of the festal crowds,[14] which explains why eventually they arrested him at night in Gethsemane rather than in the temple during the day.'
  - where: 'note 26:5 “Not on the feast day”'
    claim: 'The chief priests, legal experts and elders made up the Sanhedrin, charged under Rome with keeping order in the city'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Historically the chief priests, the leading legal experts, and the elders of the people comprised the Sanhedrin, which under the Roman occupation was charged with maintaining day-to-day order in the city'
  - where: 'note 26:5 “Not on the feast day”'
    claim: 'In the Synoptics the cleansing of the temple was the deciding factor'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'In the Synoptics, Jesus’s cleansing of the temple seems to have been the deciding factor in arraying the leadership against Jesus.'
  - where: 'note 26:5 “Not on the feast day”'
    claim: 'The rulers feared the Galileans in the city, proud of Jesus as their countryman'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'The rulers feared especially an outbreak by the Galileans, who had a provincial pride in the prominence of Jesus as one of their countrymen, and many of whom were then in Jerusalem.'
  - where: 'note 26:5 “Not on the feast day”'
    claim: 'In Matthew Judas’s role is to show the authorities where and how to take Jesus without an uproar'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'In Mark and Matthew, however, Judas’s role is primarily of helping the Jewish authorities know where and how they can apprehend Jesus without causing the uproar that they feared would ensue'
  - where: 'note 26:7 “Anointed for His burial”'
    claim: 'Kings, priests and sometimes prophets were anointed; the act combines a royal anointing and a royal burial'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'In the Hebrew Bible, not only kings but also priests and, on occasion, even prophets were anointed to their position, so the woman’s act can be seen as combining both a royal anointing and a royal burial'
  - where: 'note 26:7 “Anointed for His burial”'
    claim: 'The woman understood that Jesus had come to die, unlike Peter and the others'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'suggesting that the woman understands that rather than having come to Jerusalem as its earthly king, Jesus has come to die, an understanding that contrasts markedly with that of Peter and the other disciples.'
  - where: 'note 26:7 “Anointed for His burial”'
    claim: 'John names Mary, has her anoint the feet, and places it before the entry, so there may have been two anointings'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'John’s naming Mary of Bethany, having her anoint Jesus’s feet rather than his head, and placing the story before the triumphal entry makes it possible that there were, in fact, two different anointings.'
  - where: 'note 26:7 “Anointed for His burial”'
    claim: 'Simon had presumably been cured'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Simon had presumably been cured, perhaps even having been healed previously by Jesus himself.'
  - where: 'note 26:7 “Anointed for His burial”'
    claim: 'The gift was worth about a year’s wages'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'The woman’s costly gift, the value of which approximately equaled a year’s wages for a laborer'
  - where: 'note 26:7 “Anointed for His burial”'
    claim: 'Leaving her unnamed lets her stand as a type of the ideal believer'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'by not naming her, the Marcan and Matthean stories more easily allow the woman to serve as a type of the ideal believer.'
  - where: 'note 26:7 “Anointed for His burial”'
    claim: 'The footnote renders “for my burial” as “to prepare me for my burial”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR to prepare me for my burial.'
  - where: 'note 26:15 “Thirty pieces of silver”'
    claim: 'Thirty pieces was the legal price of a slave and the foreseen blood-money'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'was the price fixed by the law as that of a slave; it was also the foreseen sum of the blood-money to be paid for the Lord’s betrayal.'
  - where: 'note 26:15 “Thirty pieces of silver”'
    claim: 'The footnote to “thirty” points to Exodus 21:32'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'Ex. 21:32 (28–32).'
  - where: 'note 26:15 “Thirty pieces of silver”'
    claim: 'Only Matthew has the thirty pieces, alluding to Jeremiah and Zechariah'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'Only in Matthew does Judas accept the chief priests’ offer of thirty pieces of silver in exchange for Jesus (Matt 26:15), with the “thirty pieces of silver” alluding to both Jeremiah 19:11 and Zechariah 11:12–13.'
  - where: 'note 26:15 “Thirty pieces of silver”'
    claim: 'The Gospels do not agree on Judas’s motives; Luke and John point to Satan'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'they do not agree on his motives. Mark, for instance, only notes that the Jewish leaders offered Judas money, not that he accepted the money or handed Jesus over for money,[31] while Luke and John instead suggest that he was driven by Satanic influence'
  - where: 'note 26:15 “Thirty pieces of silver”'
    claim: 'Avarice was probably a secondary cause'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Under the impulse of diabolic avarice, which, however, was probably but a secondary element in the real cause of his perfidious treachery'
  - where: 'note 26:15 “Thirty pieces of silver”'
    claim: 'Before Judas sold Christ, he had sold himself to the devil'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'before Judas sold Christ to the Jews, he had sold himself to the devil'
  - where: 'note 26:17 “Was the Last Supper a Passover meal?”'
    claim: 'The Synoptics present a Passover meal; John has Passover begin the next evening'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John, however, maintains that Passover actually began at sunset the next day, following Jesus’s crucifixion (John 13:1; 18:28, 39; 19:31, 42), making the Last Supper not a Passover meal'
  - where: 'note 26:17 “Was the Last Supper a Passover meal?”'
    claim: 'In John’s timing Jesus dies as the paschal lambs are sacrificed'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'this chronology has the paschal lambs being sacrificed in the temple between noon and three o’clock in the afternoon before Passover started as Jesus is being crucified and then dies on the cross.'
  - where: 'note 26:17 “Was the Last Supper a Passover meal?”'
    claim: 'The lamb was slaughtered on Nisan 14, before the festival began'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the lamb or goat for a family grouping was not slaughtered on the first day of Passover (Nisan 15 in the Jewish calendar), but in the afternoon before the festival began (Nisan 14).'
  - where: 'note 26:17 “Was the Last Supper a Passover meal?”'
    claim: 'One possibility: Jesus held the Passover, or a Passover-like meal, early'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John’s chronology is correct in regard to the actual timing of Passover but that Jesus chose to celebrate the Passover, or at least a Passover-like meal, early, knowing that he would be dead and buried when the feast actually occurred the next day.'
  - where: 'note 26:17 “Was the Last Supper a Passover meal?”'
    claim: 'The safest position may be to suspend judgment and appreciate both symbolisms'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'While the safest position may well be to suspend judgment and appreciate the respective symbolism of the Synoptic Gospels—namely, that the Lord’s Supper incorporates Passover symbolism and symbolized a new covenant that fulfilled it—and the Johannine symbolism, which portrays Christ as the Lamb of God'
  - where: 'note 26:17 “Was the Last Supper a Passover meal?”'
    claim: 'Elder Holland calls the meal a final, specially prepared Passover supper'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'As a final and specially prepared Passover supper was ending, Jesus took bread, blessed and broke it'
  - where: 'note 26:17 “Was the Last Supper a Passover meal?”'
    claim: 'Jesus observed the essentials of the Passover'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'At this solemn meal Jesus appears to have observed the essentials of the Passover procedure'
  - where: 'note 26:22 “Lord, is it I?”'
    claim: 'Each who asked feared he might be the offender rather than suspecting another'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'each of those who so inquired was more concerned with the dread thought that possibly he was an offender, however inadvertently so, than as to whether his brother was about to prove himself a traitor.'
  - where: 'note 26:22 “Lord, is it I?”'
    claim: 'Judas asked lest silence arouse suspicion'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'who at this moment probably feared that silence might arouse suspicion against himself'
  - where: 'note 26:22 “Lord, is it I?”'
    claim: 'Judas calls Him Rabbi'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/26.htm'
    quote: 'he calls Him by the wonted title of honour, Rabbi'
  - where: 'note 26:22 “Lord, is it I?”'
    claim: 'The answer was not heard by all'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/26.htm'
    quote: 'It would appear from St. John’s narrative (John 13:29) that the dread answer, “Thou hast said;” was not heard by all.'
  - where: 'note 26:22 “Lord, is it I?”'
    claim: 'The appointment that Christ suffer did not make men less free or less guilty'
    key: ellicott-matthew
    url: 'https://biblehub.com/commentaries/ellicott/matthew/26.htm'
    quote: 'It was appointed that the Christ should suffer, but that appointment did not make men less free agents, nor diminish the guilt of treachery or injustice.'
  - where: 'note 26:26 “In remembrance of my body”'
    claim: 'The Joseph Smith Translation: in remembrance of my body, given a ransom'
    key: jst-matt-26
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/26?lang=eng'
    quote: 'this is in remembrance of my body which I give a ransom for you.'
  - where: 'note 26:26 “In remembrance of my body”'
    claim: 'In the translation Jesus breaks the bread first, then blesses it'
    key: jst-matt-26
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/26?lang=eng'
    quote: 'Jesus first breaks the sacramental bread then blesses it. The sacrament is in remembrance of Jesus’ body and blood.'
  - where: 'note 26:26 “In remembrance of my body”'
    claim: 'The Joseph Smith Translation adds a commandment to do what they had seen and bear record'
    key: jst-matt-26
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/26?lang=eng'
    quote: 'And I give unto you a commandment, that ye shall observe to do the things which ye have seen me do, and bear record of me even unto the end.'
  - where: 'note 26:26 “In remembrance of my body”'
    claim: 'The type and shadow became reality that night'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'Now, after all those years and all those prophecies and all those symbolic offerings, the type and shadow was to become reality.'
  - where: 'note 26:26 “In remembrance of my body”'
    claim: 'The broken bread recalls His body and His physical suffering'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'With a crust of bread, always broken, blessed, and offered first, we remember His bruised body and broken heart, His physical suffering on the cross'
  - where: 'note 26:28 “The blood of the covenant”'
    claim: 'The footnote glosses “testament” as covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'GR covenant.'
  - where: 'note 26:28 “The blood of the covenant”'
    claim: 'Diathēkē in classical Greek was a will; in the Septuagint it renders berit, covenant'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'represented a legal document, a last will and final testament that one left for his or her heirs, but in the Septuagint it translated the Hebrew bərîṯ, a binding constitution or covenant between God and his people.'
  - where: 'note 26:28 “The blood of the covenant”'
    claim: 'The words connect the new covenant with the Mosaic covenant at Exodus 24'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'connecting the new covenant that Jesus is about to establish with the institution of the Mosaic covenant at Exodus 24:6‒8.'
  - where: 'note 26:28 “The blood of the covenant”'
    claim: 'A new covenant recalls Jeremiah’s prophecy'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Its being a “new” covenant connects Jesus’s sacrifice with the prophecy of Jeremiah that the Lord would make a new covenant to replace the one that they broke, one that would be written in their hearts (Jer 31:31‒33).'
  - where: 'note 26:28 “The blood of the covenant”'
    claim: 'Only Matthew adds “for the remission of sins”'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Matthew makes the salvific purpose of Jesus’s sacrifice even more explicit by adding the unique, but vitally important, qualification: Jesus’s blood is being poured out specifically “for the remission of sins.”'
  - where: 'note 26:28 “The blood of the covenant”'
    claim: 'The Joseph Smith Translation: shed for as many as believe on His name'
    key: jst-matt-26
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/26?lang=eng'
    quote: 'For this is in remembrance of my blood of the new testament, which is shed for as many as shall believe on my name, for the remission of their sins.'
  - where: 'note 26:28 “The blood of the covenant”'
    claim: 'Remission is given on conditions of obedience to the gospel’s principles and ordinances'
    key: holland-remembrance
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/this-do-in-remembrance-of-me?lang=eng'
    quote: 'providing remission for all of our sins as well, upon conditions of obedience to the principles and ordinances of the gospel He taught'
  - where: 'note 26:29 “Drinking it new”'
    claim: 'The Joseph Smith Translation reads “shall come and drink it,” and the footnote points to D&C 27:5–14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'JST Matt. 26:26 … shall come and drink it … D&C 27:5 (5–14).'
  - where: 'note 26:29 “Drinking it new”'
    claim: 'D&C 27:12 names Peter, James and John among those the Lord will drink with'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/27?lang=eng'
    quote: 'And also with Peter, and James, and John, whom I have sent unto you, by whom I have ordained you and confirmed you to be apostles'
  - where: 'note 26:29 “Drinking it new”'
    claim: 'The saying alludes to the messianic banquet at the end of time'
    key: huntsman-thursday
