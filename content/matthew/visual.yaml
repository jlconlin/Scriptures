summary: >-
  The Sermon on the Mount, the first of the long discourses in Matthew, ends with a house
  that stood: the one who hears the Savior's sayings and does them builds on the rock. The
  same sermon calls His disciples the light of the world, a lamp on its stand and a city on
  a hill. The picture shows the house still standing after the storm.
look: >-
  A realistic painted illustration, as a skilled landscape illustrator would paint a
  full-page plate in gouache for a fine book: true proportions and scale, natural color,
  believable light and cast shadows, real-looking cloth, bronze, rock and water. It is
  plainly a painting and not a photograph: forms are slightly simplified, surfaces are
  smooth washes of color with little fine texture (no gravel, pebbles or grain picked out
  one by one), and edges are clean and soft. It is not a cartoon or a flat poster either:
  no outlines, no faceted or stylized shapes, no exaggerated color.
motifs:
  - "Primary: a small home in a Galilean village in the time of Jesus, standing whole on a broad shelf of bare, wet rock on a hillside (Matt. 5:1; 7:24–25): walls of rough dark basalt fieldstones, a flat roof of earth on round wooden beams whose ends show under its edge, an outside stone stair, a small curtained window, a clay water jar by the open wooden door. Puddles on the rock hold the sky, and a trickle of runoff crosses it."
  - "Supporting: just inside the open door, a small lit clay oil lamp on a wooden stand, uncovered (Matt. 5:15)."
  - "Supporting: across a wide green valley, a small walled town of pale houses on the top of its own hill, lit by the morning sun (Matt. 5:14)."
  - "Small: red and white wild flowers growing in the grass along the near edge of the rock (Matt. 6:28–29)."
  - "Small: two birds flying high over the valley (Matt. 6:26)."
composition: >-
  A wide landscape seen from high on a hillside. The house on its rock fills the right of
  the picture, its stair running out of the frame; to the left the hill falls away to a
  green valley, with the walled town on its hilltop beyond, left of center. Wild flowers
  along the lower edge, two birds in the sky. At the far left a storm cloud moves off over
  the hills with rain still falling from it, its edge lit gold; the sky over the house is
  clear. Morning sun from the right, shadows to the left; the lamp glows inside the door.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The house still standing on bare, wet rock, with the storm moving off behind it** is the house of the wise man in the parable that ends the Sermon on the Mount: “the rain descended, and the floods came, and the winds blew, and beat upon that house; and it fell not: for it was founded upon a rock” ([[Matt. 7:25]]). He is the one who hears the Savior’s sayings “and doeth them” ([[Matt. 7:24]]).'
  - '**The lamp burning on its stand inside the open door** is the light that is not hidden: men do not “put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house” ([[Matt. 5:15]]).'
  - '**The walled town on the hill across the valley** is the other picture in the same saying: “Ye are the light of the world. A city that is set on an hill cannot be hid” ([[Matt. 5:14]]).'
  - '**The wild flowers in the grass** are the lilies the Savior pointed to: “Consider the lilies of the field, how they grow; they toil not, neither do they spin” ([[Matt. 6:28]]).'
  - '**The birds over the valley** are “the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them” ([[Matt. 6:26]]).'
