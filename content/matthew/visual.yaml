alt: High on a hillside after rain, a small house of dark stone with a flat earth roof, an outside stair and an open door stands on a shelf of wet bare rock, a lit oil lamp inside the door and red and white wild flowers in the grass before it; across a green valley a walled town sits on a hilltop in the morning sun, two birds fly over the valley, and a storm cloud moves away with rain still falling.
