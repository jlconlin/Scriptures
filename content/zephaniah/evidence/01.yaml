chapter: 1
claims:
  # ---- when / setting ----
  - where: 'when'
    claim: 'Josiah reigned 640–609 B.C.; Zephaniah was raised up in the earlier part of the reign'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Josiah (640–609 BC) … However, sometime during the earlier period of Josiah’s reign, the Lord raised up Zephaniah'
  - where: 'setting'
    claim: 'Nothing is known of Zephaniah’s life beyond his book'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: 'Nothing is known of the life of Zephaniah beyond what can be inferred from his book.'
  - where: 'setting'
    claim: 'The Bible Dictionary lists the priest Zephaniah of Jeremiah’s day as a separate person'
    key: bd-zephaniah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zephaniah?lang=eng'
    quote: '(2) The “second priest,” next in rank to the high priest (2 Kgs. 25:18; Jer. 21:1; 29:25, 29; 37:3; 52:24).'
  - where: 'setting'
    claim: 'The name means “The Lord hides”'
    key: bd-zephaniah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zephaniah?lang=eng'
    quote: 'The Lord hides. (1) Prophesied in the reign of Josiah (639–608 B.C.).'
  - where: 'setting'
    claim: 'The name means one protected or hidden by the Lord, and summarizes the message'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'the name Zephaniah can be translated as one who is protected or hidden by the Lord. … The name seems to summarize the prophet’s message.'
  - where: 'setting'
    claim: 'Under Manasseh the worship of Jehovah was merged with idolatry'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The worship of Jehovah was merged so completely with idolatry that it was barely distinguishable from paganism.'
  - where: 'setting'
    claim: 'Josiah began to seek God in his eighth year and to purge Judah in his twelfth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father: and in the twelfth year he began to purge Judah and Jerusalem'
  - where: 'setting'
    claim: 'Josiah’s reforms began 640–622 B.C. and were accelerated from 622'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'From 640–622 BC he initiated much needed reforms intended to refocus Judah on Jehovah. As will be seen later, these reforms were accelerated between 622 BC and Josiah’s death in 609 BC.'
  - where: 'setting'
    claim: 'Zephaniah prophesied before 622 B.C., since he attacks practices the later reforms did away with'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'he is prophesying prior to the major thrust of Josiah’s reforms beginning in 622 BC because he is addressing problems that were generally done away with by the later reforms of Josiah.'
  - where: 'setting'
    claim: '“The remnant of Baal” (1:4) is read as showing the reform had already begun'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'most of the other commentators infer from Zephaniah 1:4, where the extermination of the remnant of Baal is predicted, and with greater propriety, that Josiah''s reformation of religion had already commenced'
  - where: 'setting'
    claim: 'Zephaniah lived in Lehi’s lifetime, as did Nahum'
    key: welch-calling-prophet
    url: 'https://rsc.byu.edu/book-mormon-first-nephi-doctrinal-foundation/calling-prophet'
    quote: 'during Lehi’s lifetime, Nahum (ca. 612 B.C.) proclaimed the vengeance of the Lord on his enemies and marked the fall of Nineveh. Zephaniah (who also lived during this time) prophesied'
  - where: 'setting'
    claim: 'Zephaniah’s ministry preceded Jeremiah’s by a few years'
    key: brown-jeremiah-crisis
    url: 'https://rsc.byu.edu/isaiah-prophets/history-jeremiahs-crisis-faith'
    quote: 'Zephaniah, whose ministry preceded that of Jeremiah by a few years, also knew of a peril that was to come out of the north.'
  - where: 'setting'
    claim: 'Zephaniah’s words apply to his day and to the future'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Like many ancient prophecies, the words of Zephaniah can apply to both his day and the future.'
  - where: 'setting'
    claim: 'Judah later fell to the Babylonians'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'More than a hundred years later, the southern kingdom of Judah suffered a similar fate at the hands of the Babylonians.'

  - where: 'setting'
    claim: 'The chapter heading makes the chapter’s subject the destruction of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: 'The destruction of Judah is symbolic of the Second Coming'

  # ---- thread ----
  - where: 'thread'
    claim: 'The judgment on the whole earth falls especially on Judah and Jerusalem'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'The judgment coming upon the whole earth with all its inhabitants will fall especially upon Judah and Jerusalem.'
  - where: 'thread'
    claim: 'The day falls on Judah’s idolatries, the royal house, the merchants, and the indifferent'
    key: bd-zephaniah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zephaniah?lang=eng'
    quote: 'It falls on Judah for her idolatries, on the royal house, on the merchant classes, and on all the ungodly and indifferent.'
  - where: 'thread'
    claim: '“The whole land” of 1:18 returns to the starting point and means the whole earth'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'it here returns to its starting-point, to round off the picture, there can be no doubt that the whole earth is intended'
  - where: 'thread'
    claim: '“Day” is used fourteen times in 1:7–18, which opens and closes with “day of the Lord”'
    key: parry-theme-words
    url: 'https://rsc.byu.edu/preserved-translation/theme-words'
    quote: 'Zephaniah 1:7–18, where the word day is used fourteen times, provides us with a prime example of a repeated theme word in the Old Testament. This passage opens and closes with the same expression—“day of the Lord,”'
  - where: 'thread'
    claim: 'The line of 1:18 returns as a refrain in 3:8, marking the division of the book'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'the thought in Zephaniah 1:18, "All the earth shall be devoured by the fire of His jealousy," is repeated as a refrain in Zephaniah 3:8'
  - where: 'thread'
    claim: 'Zephaniah pleaded with his people to seek the Lord to be spared'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Zephaniah pleaded with his people to seek the Lord so they would be spared from the Lord’s judgments.'

  # ---- notes ----
  - where: 'note 1:1 “Was Hizkiah King Hezekiah?”'
    claim: '“Hizkiah” in 1:1 is the Hebrew name H2396'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'חִזְקִיָּ֑ה'
  - where: 'note 1:1 “Was Hizkiah King Hezekiah?”'
    claim: 'The name is rendered Hezekiah and Hizkiah and is borne by a king of Judah and two others'
    key: bdb
    url: 'https://biblehub.com/hebrew/2396.htm'
    quote: 'KJV: Hezekiah, Hizkiah, Hizkijah … 1. strengthened of Jah 2. Chizkijah, a king of Judah, also the name of two other Israelites'
  - where: 'note 1:1 “Was Hizkiah King Hezekiah?”'
    claim: 'Since usually only the father is named, Hezekiah was probably the king'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'inasmuch as the father only is mentioned as a general rule, Hezekiah must have been a celebrated man, and that in all probability the king of that name is intended'
  - where: 'note 1:1 “Was Hizkiah King Hezekiah?”'
    claim: '“King of Judah” follows with Josiah’s name; Manasseh’s 55 years cover nearly two generations'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'the predicate "king of Judah" follows immediately afterwards in connection with Josiah''s name. … inasmuch as Manasseh reigned for fifty-five years, that is to say, for nearly two generations'
  - where: 'note 1:1 “Was Hizkiah King Hezekiah?”'
    claim: 'The objection that the kings’ line has only two generations between Hezekiah and Josiah has little force, given Manasseh’s 55 years'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'There is still less force in the objection, that in the genealogy of the kings only two generations occur between Hezekiah and Josiah, inasmuch as Manasseh reigned for fifty-five years'
  - where: 'note 1:1 “Was Hizkiah King Hezekiah?”'
    claim: 'The Church’s manual leaves the identification open'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: 'It is not known whether this individual was the same as Hezekiah the king, and the other names are not of known individuals.'

  - where: 'note 1:3 “The Flood undone”'
    claim: 'The list of creatures plays on Genesis 6:7: a judgment as general as the Flood'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'By playing upon this threat, Zephaniah intimates that the approaching judgment will be as general over the earth, and as terrible, as the judgment of the flood.'
  - where: 'note 1:3 “The Flood undone”'
    claim: '“Stumblingblocks” may be read “idols”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: '3a “stumblingblocks”: OR idols. Ezek. 7:19.'
  - where: 'note 1:3 “The Flood undone”'
    claim: 'The offences are destroyed together with the sinners'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'Through this judgment God will remove or destroy the offences (stumbling-blocks) together with the sinners.'
  - where: 'note 1:3 “The Flood undone”'
    claim: 'The judgment on the whole world is integral to the prophecy; Judah is treated most fully as the kingdom of God to be purified'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'the judgment upon the whole world forms an integral part of his prophecy, which treats more fully of the execution of the judgment in and upon Judah, simply because Judah forms the kingdom of God, which is to be purified from its dross by judgment'
  - where: 'note 1:3 “The Flood undone”'
    claim: 'The day of the Lord is the outpouring of His wrath on all created things'
    key: bd-zephaniah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zephaniah?lang=eng'
    quote: 'The “day of the Lord” is the outpouring of His wrath on all created things.'

  - where: 'note 1:4 “Chemarims, the priests Josiah put down”'
    claim: '“Chemarims” in 1:4 is the Hebrew word H3649'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'הַ/כְּמָרִ֖ים'
  - where: 'note 1:4 “Chemarims, the priests Josiah put down”'
    claim: 'The same word H3649 stands in 2 Kings 23:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Kgs.xml'
    quote: 'הַ/כְּמָרִ֗ים'
  - where: 'note 1:4 “Chemarims, the priests Josiah put down”'
    claim: 'The word means an idolatrous priest, used only in the plural; the KJV renders it Chemarims and idolatrous priests'
    key: bdb
    url: 'https://biblehub.com/hebrew/3649.htm'
    quote: 'KJV: Chemarims (idolatrous) priests … an idolatrous priest (only in plural)'
  - where: 'note 1:4 “Chemarims, the priests Josiah put down”'
    claim: 'The footnote reads “idolatrous priests”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: '4b “Chemarims”: OR idolatrous priests.'
  - where: 'note 1:4 “Chemarims, the priests Josiah put down”'
    claim: 'Josiah put down the idolatrous priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And he put down the idolatrous priests, whom the kings of Judah had ordained to burn incense in the high places in the cities of Judah'

  - where: 'note 1:5 “Sworn to two gods”'
    claim: 'The host of heaven were false gods associated with planets and stars'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'This referred to the idolatrous practice of worshipping false gods associated with planets and stars.'
  - where: 'note 1:5 “Sworn to two gods”'
    claim: 'Malcham is read as Milcom or Molech'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Many scholars believe this is a reference to Milcom, an Ammonite deity, or Molech, a deity associated with child sacrifice.'
  - where: 'note 1:5 “Sworn to two gods”'
    claim: 'Malcham is H4445, Milcom, the Ammonite national idol'
    key: bdb
    url: 'https://biblehub.com/hebrew/4445.htm'
    quote: 'KJV: Malcham, Milcom Word Origin: [from H4428 (מֶלֶך - king) for H4432 (מוֹלֶך - Molech)] 1. Malcam or Milcom, the national idol of the Ammonites'
  - where: 'note 1:5 “Sworn to two gods”'
    claim: '“Malcham” in 1:5 is H4445 with a suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'בְּ/מַלְכָּֽ/ם'
  - where: 'note 1:5 “Sworn to two gods”'
    claim: 'The Bible Dictionary treats Molech and Milcom as one fire god worshipped with child sacrifice'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'The abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire'
  - where: 'note 1:5 “Sworn to two gods”'
    claim: 'Josiah broke down the rooftop altars'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And the altars that were on the top of the upper chamber of Ahaz, which the kings of Judah had made'

  - where: 'note 1:7 “The LORD’s sacrifice and His consecrated guests”'
    claim: 'The sacrifice is the Jewish nation; the guests are the nations consecrated to war'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'The sacrifice which God has prepared is the Jewish nation; those who are invited to this sacrificial meal ("called," 1 Samuel 9:13) are not beasts and birds of prey, as in Ezekiel 39:17, but the nations which He has consecrated to war'
  - where: 'note 1:7 “The LORD’s sacrifice and His consecrated guests”'
    claim: '“Hath bid” is the verb H6942 in 1:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'הִקְדִּ֥ישׁ'
  - where: 'note 1:7 “The LORD’s sacrifice and His consecrated guests”'
    claim: 'The verb means to consecrate, sanctify, set apart'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'qadash: To consecrate, sanctify, set apart, make holy'
  - where: 'note 1:7 “The LORD’s sacrifice and His consecrated guests”'
    claim: 'The use is explained from Isaiah 13:3; judgment as sacrifice is from Isaiah 34:6'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'The description of the judgment as zebhach, a sacrifice, is taken from Isaiah 34:6 … may be explained from Isaiah 13:3, where the nations appointed to make war against Babel are called mequddâshı̄m, the sanctified of Jehovah'
  - where: 'note 1:7 “The LORD’s sacrifice and His consecrated guests”'
    claim: 'The command to silence is formed after Habakkuk 2:20 and summons to humble submission'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/1.htm'
    quote: 'The command, "Be silent before the Lord," which is formed after Habakkuk 2:20, and with which the prophet summons to humble, silent submission to the judgment of God'
  - where: 'note 1:7 “The LORD’s sacrifice and His consecrated guests”'
    claim: 'The footnote at “Hold” points to Habakkuk 2:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: '7a “Hold”: Hab. 2:20.'

  - where: 'note 1:8 “Foreign clothes”'
    claim: '“Strange” in 1:8 is H5237'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'נָכְרִֽי'
  - where: 'note 1:8 “Foreign clothes”'
    claim: 'The word means foreign'
    key: bdb
    url: 'https://biblehub.com/hebrew/5237.htm'
    quote: 'nokri: foreign, foreigner, foreigners'
  - where: 'note 1:8 “Foreign clothes”'
    claim: 'Judah embraced clothing styles that did not reflect a covenant people; overwhelmed by worldliness'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The prophet identifies how Judah has allowed herself to be overwhelmed by worldliness. For example, … they have embraced the strange clothing styles that fail to reflect the appearance of a covenant people (see Zephaniah 1:8)'

  - where: 'note 1:9 “Leaping over the threshold”'
    claim: 'The footnote reads “over,” to plunder and pillage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: '9a “on”: OR over; i.e., to plunder and pillage.'
  - where: 'note 1:9 “Leaping over the threshold”'
    claim: 'Johnson reads it as the pagan custom of avoiding thresholds, from the priests of Dagon'
    key: ot-minute-zeph
    url: 'https://scripturecentral.org/archive/books/book-chapter/zephaniah-1-3'
    quote: 'Avoiding stepping on thresholds was a pagan custom. … Afterward, the priests and those who worshipped Dagon would not step on thresholds (see 1 Samuel 5:1–5).'

  - where: 'note 1:10 “The fish gate, the Second Quarter and Maktesh”'
    claim: 'The fish gate was on the north end; first to see an invader from the north'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: 'The “fish gate” (v. 10) was on the north end of the city. People there would be the first to see an enemy invading from the north.'
  - where: 'note 1:10 “The fish gate, the Second Quarter and Maktesh”'
    claim: 'The second quarter was probably an expansion of the city of David'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: 'The fish gate opened into the part of the city known as the “second quarter” (v. 10), probably because it was an expansion of the original city of David.'
  - where: 'note 1:10 “The fish gate, the Second Quarter and Maktesh”'
    claim: 'Maktesh was the merchant quarter'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: '“Maktesh” (v. 11) was the name of the merchant quarter, which lay in the second quarter; thus, the reference to merchants, “they that bear silver.”'
  - where: 'note 1:10 “The fish gate, the Second Quarter and Maktesh”'
    claim: 'The footnotes call the second and Maktesh districts of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: '10b “the second”: IE the second quarter, a district of Jerusalem.'
  - where: 'note 1:10 “The fish gate, the Second Quarter and Maktesh”'
    claim: 'The places of 1:10 are landmarks on the north side past which invaders would come'
    key: brown-jeremiah-crisis
    url: 'https://rsc.byu.edu/isaiah-prophets/history-jeremiahs-crisis-faith'
    quote: 'Zephaniah 1:10 mentions a series of landmarks on the north side of Jerusalem past which the invaders were to come.'
  - where: 'note 1:10 “The fish gate, the Second Quarter and Maktesh”'
    claim: 'Zephaniah did not name the foe'
    key: brown-jeremiah-crisis
    url: 'https://rsc.byu.edu/isaiah-prophets/history-jeremiahs-crisis-faith'
    quote: 'Since Zephaniah did not name this foe in his writings, it is clear that Jeremiah could not have learned its identity from this source.'
  - where: 'note 1:10 “The fish gate, the Second Quarter and Maktesh”'
    claim: 'Some scholars explained Zephaniah’s oracles by a Scythian raid'
    key: brown-jeremiah-crisis
    url: 'https://rsc.byu.edu/isaiah-prophets/history-jeremiahs-crisis-faith'
    quote: 'some scholars accept it and explain the oracles of Zephaniah and young Jeremiah in light of it'

  - where: 'note 1:12 “Searched out by lamplight”'
    claim: 'To search with candles means an exhaustive search in poorly lit houses'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: 'To “search with candles” (v. 12) suggests an exhaustive search, since in the poorly lighted houses of those times one would have to use a candle to look for a lost object at night.'
  - where: 'note 1:12 “Searched out by lamplight”'
    claim: 'Ball reads 1:10–12 as a plundering army searching with candles for those hiding'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'describing how a plundering army will invade successive quarters of the city, searching with candles for any who may be hiding (1:10–12)'
  - where: 'note 1:12 “Searched out by lamplight”'
    claim: 'Like bad wine on its lees, the wicked stay apathetic about true religion and grow harsher'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: 'The interpretation of the symbol is that wicked men, like bad wine, remain apathetic about the true religion and become increasingly harsh and bitter.'
  - where: 'note 1:12 “Searched out by lamplight”'
    claim: 'The footnote reads “settled” as complacent, indifferent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: '12a “settled”: OR complacent, indifferent.'
  - where: 'note 1:12 “Searched out by lamplight”'
    claim: 'The footnote at 1:13 points to Deuteronomy 28:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: '13b “plant”: Deut. 28:30 (30, 39).'

  - where: 'note 1:14 “Near in Josiah’s day, and in the last days”'
