chapter: 2
claims:
  - where: when
    claim: 'Josiah reigned 640–609 B.C.; Zephaniah was raised up early in the reign'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Josiah (640–609 BC) … sometime during the earlier period of Josiah’s reign, the Lord raised up Zephaniah, whose teachings girded up Josiah’s initial reforms'
  - where: setting
    claim: 'Zephaniah prophesied early in Josiah’s reign'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'sometime during the earlier period of Josiah’s reign, the Lord raised up Zephaniah'
  - where: setting
    claim: 'Chapter 2 is a summons to repent, with the judgment on the nations as the reason'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'now summons his people to repent, and more especially exhorts the righteous to seek the Lord and strive after righteousness and humility, that they may be hidden in the day of the Lord'
  - where: setting
    claim: 'Nineveh was destroyed by the Babylonians in 612 B.C., so the oracle was spoken before then'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'The Babylonians destroy Nineveh in 612 BC, and the remnant of the Assyrian empire vanishes shortly thereafter.'
  - where: setting
    claim: 'Zephaniah preached before Nineveh fell'
    key: ot-minute-zeph
    url: 'https://scripturecentral.org/archive/books/book-chapter/zephaniah-1-3'
    quote: 'Since Nineveh was destroyed in 612 BC by the Babylonians, we know that Zephaniah preached before that time.'
  - where: setting
    claim: 'The Church reads Zephaniah as applying to his day and to the judgments before the Second Coming'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'the words of Zephaniah can apply to both his day and the future. The destruction described by Zephaniah can be compared to the destruction of the wicked that will occur before the Second Coming of Jesus Christ.'
  - where: setting
    claim: 'The Church’s footnote on “day” in 2:3 points to the Topical Guide “World, End of”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: '3c “day”: TG World, End of.'
  - where: thread
    claim: 'The four nations stand for the four quarters: Philistines west, Moab and Ammon east, Cushites south, Assyria north'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'restricts the number to four, according to the four quarters of the globe: viz., the Philistines in the west … the Moabites and Ammonites comprised in one in the east … the Cushites in the south … and Asshur, with Nineveh, in the north'
  - where: thread
    claim: 'Bundling Judah with the nations around it suggests the covenant people equal their wickedness'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Zephaniah also pronounces doom on the unbelieving nations to the north, south, east, and west of Judah. By bundling Judah together with these heathen peoples, Zephaniah suggests that God’s covenant people equal and surpass the wickedness of their neighbors'
  - where: thread
    claim: 'Verse 4 is tied by “for” to the call to repent'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'The fourth verse, which is closely connected by kı̄ (for) with the exhortation to repentance, serves as an introduction to the threat of judgment'
  - where: thread
    claim: 'Ethiopia was the farthest people to the south known to the Hebrews'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'Zephaniah does not mention Edom, which bordered upon Judah, or the neighbouring land of Egypt, but the remote Ethiopia, the furthest kingdom or people in the south that was known to the Hebrews.'
  - where: thread
    claim: 'Assyria was then the imperial power; it lay north-east but its armies came from the north'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'because Assyria was then the imperial power … this kingdom was not to the north, but to the north-east, of Judah; but inasmuch as the Assyrian armies invaded Palestine from the north, it is regarded by the prophets as situated in the north.'
  - where: thread
    claim: 'Zephaniah sees escape only for the humble, in contrast to the proud'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: 'He does not see any way of escape for any but for the humble, whom he mentions in contrast to the proud who have provoked the jealous wrath of God.'
  - where: section 1 plain
    claim: '“Before the decree bring forth” means before the decree takes effect'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=ESV'
    quote: 'before the decree takes effect —before the day passes away like chaff—'
  - where: section 4 plain
    claim: '“The upper lintels” are the tops of her columns in a modern translation'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=NIV'
    quote: 'The desert owl and the screech owl will roost on her columns. Their hooting will echo through the windows, rubble will fill the doorways, the beams of cedar will be exposed.'
  - where: 'note 2:1 “Not desired, or not ashamed?”'
    claim: 'The Hebrew is lōʾ nikhsāp, a form of kāsap'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'נִכְסָֽף'
  - where: 'note 2:1 “Not desired, or not ashamed?”'
    claim: 'The verb elsewhere means to long for; in 2:1 the sense is very doubtful, perhaps “not turning pale,” not ashamed'
    key: bdb
    url: 'https://biblehub.com/hebrew/3700.htm'
    quote: 'Genesis 31:30 thou didst long sorely for thy father''s house … הַגּוֺי לֹא נִכְסָ֑ף Zephaniah 2:1 very dubious; but perhaps (Ges Ew Hi Ke and others), O nation not turning pale, = not ashamed'
  - where: 'note 2:1 “Not desired, or not ashamed?”'
    claim: 'The ESV reads “shameless nation”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=ESV'
    quote: 'Gather together, yes, gather, O shameless nation,'
  - where: 'note 2:1 “Not desired, or not ashamed?”'
    claim: 'The NIV reads “shameful nation”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=NIV'
    quote: 'Gather together, gather yourselves together, you shameful nation,'
  - where: 'note 2:3 “The meek who already keep his law”'
    claim: 'The meek are described as those who do the Lord’s right; they are to strive still more after it'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'The humble (‛ănâvı̄m) are described as those who do Jehovah''s right, i.e., who seek diligently to fulfil what Jehovah has prescribed in the law as right. … they are to strive still more zealously after Jehovah''s right, viz., righteousness and humility'
  - where: 'note 2:3 “The meek who already keep his law”'
    claim: 'Hebrew ʿanwê hāʾāreṣ, “meek of the earth/land”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'עַנְוֵ֣י'
  - where: 'note 2:3 “The meek who already keep his law”'
    claim: 'The ESV reads “humble of the land, who do his just commands”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=ESV'
    quote: 'Seek the Lord, all you humble of the land, who do his just commands; seek righteousness; seek humility;'
  - where: 'note 2:3 “The meek who already keep his law”'
    claim: 'Zephaniah sees escape only for the humble, in contrast to the proud'
    key: ot-manual-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-21?lang=eng'
    quote: 'He does not see any way of escape for any but for the humble, whom he mentions in contrast to the proud who have provoked the jealous wrath of God.'
  - where: 'note 2:3 “Hidden, like the prophet’s name”'
    claim: 'Zephaniah’s name is from ṣāpan, “hidden by the Lord”'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'derived from the Hebrew root tsâphan, meaning to hide, protect, cover, or treasure up. Accordingly, the name Zephaniah can be translated as one who is protected or hidden by the Lord.'
  - where: 'note 2:3 “Hidden, like the prophet’s name”'
    claim: '“Hid” in 2:3 is from sātar; the two roots form a wordplay'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'The Hebrew term translated as “hid” in this passage is derived from the root çâthar, and like the root of Zephaniah’s name, tsâphan, means to hide or cover up. The use of the two roots forms a clever wordplay'
  - where: 'note 2:3 “Hidden, like the prophet’s name”'
    claim: 'The words are ʾûlay (perhaps) and tissātĕrû from sātar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'תִּסָּ֣תְר֔וּ'
  - where: 'note 2:3 “Hidden, like the prophet’s name”'
    claim: 'Modern translations read “perhaps you may be hidden”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=NRSVUE'
    quote: 'seek righteousness, seek humility; perhaps you may be hidden on the day of the Lord’s wrath.'
  - where: 'note 2:4 “Names that sound like their sentence”'
    claim: 'Gaza/forsaken and Ekron/rooted up are wordplays on the city names'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: '“For Gaza [ʿazzâ] shall be forsaken [ʿăzûbâ], and Ashkelon a desolation: they shall drive out Ashdod at the noon day, and Ekron [ʿeqrôn] shall be rooted up [tēʿāqēr].”'
  - where: 'note 2:4 “Names that sound like their sentence”'
    claim: 'The verb for Ekron ties its fate to barrenness'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'As for Ekron, Zephaniah’s use of the verb ʿqr ties its fate to barrenness and childlessness.'
  - where: 'note 2:4 “Names that sound like their sentence”'
    claim: '“At noon” likely means unexpectedly, when men rest in hot countries'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'the time of noon is more probably to be understood … as denoting the time of day at which men generally rest in hot countries (2 Samuel 4:5), in the sense of unexpected, unsuspected expulsion'
  - where: 'note 2:4 “Names that sound like their sentence”'
    claim: 'Gath is omitted because four names suffice'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'The omission of Gath may be explained in the same manner as in Amos 1:6-8, from the fact that the parallelism of the clauses only allowed the names of four cities to be given'
  - where: 'note 2:4 “Names that sound like their sentence”'
    claim: '“Cherethites” is chosen to mark them for kārat, cutting off'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'Zephaniah calls the inhabitants gōi Kerēthı̄m … for the purpose of representing them as a people devoted to kârath, or extermination.'
  - where: 'note 2:7 “The Lord will remember them and restore them”'
    claim: '“Turn away their captivity” is the idiom “restore the captivity,” used of Israel in Zeph. 2:7, 3:20 and Deut. 30:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'in phrase restore the captivity of … a. of Israel (or Judah) … Zephaniah 2:7; Zephaniah 3:20; Deuteronomy 30:3'
  - where: 'note 2:7 “The Lord will remember them and restore them”'
    claim: 'The noun can mean a former prosperity'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: '1. exile 2. (concretely) prisoners 3. (figuratively) a former state of prosperity'
  - where: 'note 2:7 “The Lord will remember them and restore them”'
    claim: 'ESV: “will be mindful of them and restore their fortunes”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=ESV'
    quote: 'For the Lord their God will be mindful of them and restore their fortunes.'
  - where: 'note 2:7 “The Lord will remember them and restore them”'
    claim: 'The footnote on “captivity” points to Deut. 30:3 and Zeph. 3:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: '7a “captivity”: Deut. 30:3 (1–5); Ps. 14:7; Amos 9:14 (14–15); Zeph. 3:20.'
  - where: 'note 2:9 “Moab as Sodom”'
    claim: 'Moab was Lot’s descendant, akin to Israel, east of the Dead Sea, in constant warfare with Israel'
    key: bd-moab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'Son of Lot’s eldest daughter (Gen. 19:37). The land of Moab lay east of the Dead Sea. The Moabites were akin to the Israelites … but there was constant warfare between the two nations'
  - where: 'note 2:9 “Moab as Sodom”'
    claim: '“Breeding of nettles, and saltpits” means a land of weeds and salt pits'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: '9b “the”: IE occupied by weeds and salt pits.'
  - where: 'note 2:9 “Moab as Sodom”'
    claim: 'NIV: “a place of weeds and salt pits, a wasteland forever”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=NIV'
    quote: 'surely Moab will become like Sodom, the Ammonites like Gomorrah— a place of weeds and salt pits, a wasteland forever.'
  - where: 'note 2:11 “Gods starved of their worshippers”'
    claim: 'rāzâ apparently means “make lean,” though the sense is strange and doubtful'
    key: bdb
    url: 'https://biblehub.com/hebrew/7329.htm'
    quote: 'Qal Perfect3masculine singular רָזָה Zephaniah 2:11 object false gods, apparently make lean (ᵑ9 attenuavit; ᵐ5 is ἐξολεθρύσει), but sense strange'
  - where: 'note 2:11 “Gods starved of their worshippers”'
    claim: 'The Hebrew word is rāzâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'רָזָ֔ה'
  - where: 'note 2:11 “Gods starved of their worshippers”'
    claim: 'The Lord makes the gods vanish by destroying the nations who relied on them; their fall leads to worship of the true God'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'He causes the gods to vanish, by destroying the nations and kingdoms who relied upon these gods. He thereby reveals the nothingness of the gods, and brings the nations to acknowledge His sole deity'
  - where: 'note 2:11 “Gods starved of their worshippers”'
    claim: 'Verse 11 leads from the oracle on Moab and Ammon to the rest; “isles of the heathen” means the whole heathen world'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/2.htm'
    quote: 'so that Zephaniah 2:11 cannot be taken either as the conclusion of the previous threat, or as the commencement of the following one, but leads from the one to the other.'
  - where: 'note 2:11 “Gods starved of their worshippers”'
    claim: 'One reading: idol worshippers thought their gods fed on the smoke of offerings'
    key: ot-minute-zeph
    url: 'https://scripturecentral.org/archive/books/book-chapter/zephaniah-1-3'
    quote: 'Idol worshippers believed their gods were fed by the fumes and smoke that wafted up from the burnt offerings made to them, and so if the sacrifices to those gods ceased, the gods would starve.'
  - where: 'note 2:11 “Gods starved of their worshippers”'
    claim: 'The footnotes point to Mal. 1:11 and D&C 45:74'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: '“worship”: Mal. 1:11.'
  - where: 'note 2:11 “Gods starved of their worshippers”'
    claim: 'The footnote on “terrible” points to D&C 45:74'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: '“terrible”: D&C 45:74.'
  - where: 'note 2:12 “The Ethiopians: Cush”'
    claim: 'Ethiopia or Cush extended from the frontier of Egypt southward toward Khartoum, including Nubia'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile. It included the modern Nubia'
  - where: 'note 2:13 “Against the north: Assyria and Nineveh”'
    claim: 'Nineveh was the capital of Assyria on the Tigris; Jonah prophesied to it'
    key: bd-nineveh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nineveh?lang=eng'
    quote: 'Capital of Assyria on the eastern bank of the Tigris … For prophecies concerning Nineveh, see Jonah 1:2; 3:2–7; 4:11; Nahum 1:1; 2:8; 3:7; Zeph. 2:13.'
  - where: 'note 2:13 “Against the north: Assyria and Nineveh”'
    claim: '“North” (ṣāpôn) plays on the prophet’s name; Nineveh destroyed by Babylonians in 612 B.C.'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Zephaniah again plays on or alludes to his own name … “And he will stretch out his hand against the north [ṣāpôn], and destroy Assyria … Zephaniah’s name becomes a sign of what the Lord will do to “the north”'
  - where: 'note 2:13 “Against the north: Assyria and Nineveh”'
    claim: 'Nineveh fell in 612 B.C.'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'The Babylonians destroy Nineveh in 612 BC, and the remnant of the Assyrian empire vanishes shortly thereafter.'
  - where: 'note 2:13 “Against the north: Assyria and Nineveh”'
    claim: 'So Zephaniah preached before 612 B.C.'
    key: ot-minute-zeph
    url: 'https://scripturecentral.org/archive/books/book-chapter/zephaniah-1-3'
    quote: 'Since Nineveh was destroyed in 612 BC by the Babylonians, we know that Zephaniah preached before that time.'
  - where: 'note 2:14 “Which creatures haunt the ruins?”'
    claim: 'The Hebrew words are qāʾat and qippōd'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'קִפֹּ֔ד'
  - where: 'note 2:14 “Which creatures haunt the ruins?”'
    claim: 'qāʾat is a bird, usually pelican, unclean, inhabiting ruins in Isa. 34:11 and Zeph. 2:14'
    key: bdb
    url: 'https://biblehub.com/hebrew/6893.htm'
    quote: 'קָאַת, קָאָת noun [feminine] a bird, usually pelican … Leviticus 11:18 = Deuteronomy 14:17, as unclean; … Isaiah 34:11; Zephaniah 2:14, as inhabiting ruins'
  - where: 'note 2:14 “Which creatures haunt the ruins?”'
    claim: 'qippōd is porcupine (some read bittern from context), haunting desolate places'
    key: bdb
    url: 'https://biblehub.com/hebrew/7090.htm'
    quote: 'קִמֹּד noun [masculine] porcupine … > (from context) bittern … — ׳ק as haunting desolate places, Isaiah 14:23; Zephaniah 2:14, קִמּוֺד Isaiah 34:11.'
  - where: 'note 2:14 “Which creatures haunt the ruins?”'
    claim: 'ESV: owl and hedgehog; identity uncertain; “her cedar work will be laid bare”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=ESV'
    quote: 'even the owl and the hedgehog shall lodge in her capitals; a voice shall hoot in the window; devastation will be on the threshold; for her cedar work will be laid bare.'
  - where: 'note 2:14 “Which creatures haunt the ruins?”'
    claim: 'ESV footnote: identity of the animals uncertain'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=ESV'
    quote: 'Zephaniah 2:14 The identity of the animals rendered owl and hedgehog is uncertain'
  - where: 'note 2:14 “Which creatures haunt the ruins?”'
    claim: 'NIV: desert owl and screech owl roost on her columns'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=NIV'
    quote: 'The desert owl and the screech owl will roost on her columns.'
  - where: 'note 2:15 “Nineveh’s boast”'
    claim: 'The footnote on “wag” points to Jer. 18:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: '15a “wag”: Jer. 18:16.'
  - where: 'note 2:15 “Nineveh’s boast”'
    claim: 'NIV renders the gesture “shake their fists”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah+2&version=NIV'
    quote: 'All who pass by her scoff and shake their fists.'
  - where: christ
    claim: 'The footnotes on “meek” point to 3 Ne. 12:5 and D&C 88:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: '3a “meek”: Ps. 76:9; 3 Ne. 12:5; D&C 88:17 (15–17).'
  - where: christ
    claim: 'The blessing of righteous living in a wicked and violent world: being hidden by the Lord'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'Zephaniah’s message and name answers the question “What may be the blessings of righteous living in a wicked and violent world?” The prophet’s answer: we may be protected or “hidden by the Lord.”'
