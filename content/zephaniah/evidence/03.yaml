chapter: 3
claims:
  # ---- when, setting, thread ----
  - where: 'when'
    claim: 'Josiah reigned 640–609 B.C.; Zephaniah was raised up early in the reign'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'sometime during the earlier period of Josiah’s reign, the Lord raised up Zephaniah'
  - where: 'when'
    claim: 'Josiah’s dates'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Josiah (640–609 BC) “did that which was right in the sight of the Lord'
  - where: 'setting'
    claim: 'After the nations, the woe turns back on Jerusalem'
    key: ot-minute-zeph
    url: 'https://scripturecentral.org/archive/books/book-chapter/zephaniah-1-3'
    quote: 'After expressing His wrath for Judah’s enemies, God turns His anger once more on apostate Jerusalem, the city He intended to be the center of righteousness.'
  - where: 'setting'
    claim: 'Judah charged in 3:1–4 as polluted, oppressive, unteachable, disobedient'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'His final proclamation against Judah is that she is polluted, oppressive, unteachable, disobedient, and guilty of wresting the Torah (see Zephaniah 3:1–4).'
  - where: 'setting'
    claim: 'The Bible Dictionary divides the book: judgment 1:1–3:8, salvation 3:9–20'
    key: bd-zephaniah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zephaniah?lang=eng'
    quote: 'His prophecy speaks first of universal judgment (Zeph. 1:1–3:8); and then of universal salvation in the knowledge of Jehovah (3:9–20).'
  - where: 'setting'
    claim: 'Judah fell to the Babylonians'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'More than a hundred years later, the southern kingdom of Judah suffered a similar fate at the hands of the Babylonians.'
  - where: 'setting'
    claim: 'Scripture Helps: the book applies to Zephaniah’s day and the future; the promised blessings foreshadow the Second Coming'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'And the blessings the Lord promised to the righteous in Jerusalem can foreshadow the blessings the righteous will receive at the Second Coming.'
  - where: 'setting'
    claim: 'The chapter heading reads the chapter of the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/3?lang=eng'
    quote: 'At the Second Coming, all nations will assemble to battle—Men will have a pure language—The Lord will reign in their midst.'
  - where: 'thread'
    claim: 'The turn falls at 3:9, from judgment to salvation'
    key: bd-zephaniah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zephaniah?lang=eng'
    quote: 'His prophecy speaks first of universal judgment (Zeph. 1:1–3:8); and then of universal salvation in the knowledge of Jehovah (3:9–20).'
  - where: 'thread'
    claim: '“In that day” and “at that time” describe both Judah and latter-day covenant people, both promised the Lord’s presence'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Zephaniah employs the phrases “in that day” and “at that time” to dually describe Judah (if they will repent) and covenant people in the latter days'
  - where: 'thread'
    claim: 'Both are promised the presence of the Lord'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Both are promised the presence of the Lord'

  - where: 'thread'
    claim: 'The Lord is in the midst of His congregation as King (3:15, cf. 3:17)'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/3.htm'
    quote: 'The accent lies upon the fact that Jehovah is in the midst of His congregation as King of Israel (cf. Zephaniah 3:17).'
  - where: 'thread'
    claim: 'The proud removed in 3:11 are the leaders of 3:3–4'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/3.htm'
    quote: 'here the reference is to the haughty judges, priests, and prophets (Zephaniah 3:3 and Zephaniah 3:4), who exult in their sinful ways'
  - where: 'setting'
    claim: 'The heading: all nations will assemble to battle at the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/3?lang=eng'
    quote: 'At the Second Coming, all nations will assemble to battle'

  # ---- notes ----
  - where: 'note 3:1 “Rebellious, defiled, oppressive”'
    claim: 'The city of the woe is Jerusalem'
    key: ot-minute-zeph
    url: 'https://scripturecentral.org/archive/books/book-chapter/zephaniah-1-3'
    quote: 'God turns His anger once more on apostate Jerusalem'
