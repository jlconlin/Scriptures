    claim: 'The Hebrew word rendered “filthy”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zeph.xml'
    quote: 'מֹרְאָ֖ה'
  - where: 'note 3:1 “Rebellious, defiled, oppressive”'
    claim: 'ESV: rebellious and defiled, the oppressing city'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah%203&version=ESV'
    quote: 'Woe to her who is rebellious and defiled,'
  - where: 'note 3:1 “Rebellious, defiled, oppressive”'
    claim: 'NIV: city of oppressors, rebellious and defiled'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Zephaniah%203&version=NIV'
    quote: 'Woe to the city of oppressors,'
