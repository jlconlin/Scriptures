    claim: 'The lexicon: the participle of “oppress” used as an adjective of the city'
    key: bdb
    url: 'https://biblehub.com/hebrew/3238.htm'
    quote: 'elsewhere oppress; Participle absolute as adjective הָעִיר הַיּוֺנָה Zephaniah 3:1'
