    claim: 'The Septuagint reads “the dove” in verse 2'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/zephaniah/3.htm'
    quote: '2The dove hearkened not to the voice; she received not correction'
  - where: 'note 3:3 “Evening wolves”'
    claim: 'The lexicon: they leave nothing for the morrow, a figure of cruel judges'
    key: bdb
    url: 'https://biblehub.com/hebrew/1633.htm'
    quote: 'Zephaniah 3:3 they have left nothing for the morrow, in figure of cruel judges (dubious: al. from II. [גָּרַם]'
  - where: 'note 3:3 “Evening wolves”'
    claim: 'The footnote points to Jeremiah 5:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/3?lang=eng'
    quote: '3a “wolves”: Jer. 5:6.'

  - where: 'note 3:8 “Wait for me”'
    claim: 'The verb is used only of believing waiting for the Lord'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/3.htm'
    quote: 'chikkâh layehōvâh is only used for waiting in a believing attitude of the Lord and His help'
  - where: 'note 3:8 “Wait for me”'
    claim: 'The judgment is refining, not exterminating'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/3.htm'
    quote: 'the judgment to be inflicted upon the nations by the Lord is not an exterminating but a refining judgment, through which He will turn to the nations pure lips'
  - where: 'note 3:8 “Wait for me”'
    claim: 'Keil’s reading of “the prey”'
    key: keil-zephaniah
    url: 'https://biblehub.com/commentaries/kad/zephaniah/3.htm'
    quote: 'the souls from among the nations which desire salvation fall to Him as prey'
  - where: 'note 3:8 “Wait for me”'
    claim: 'The Septuagint has “for a witness”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/zephaniah/3.htm'
    quote: 'Therefore wait upon me, saith the Lord, until the day when I rise up for a witness'
  - where: 'note 3:8 “Wait for me”'
    claim: 'Judgment section ends at 3:8, salvation begins at 3:9'
    key: bd-zephaniah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zephaniah?lang=eng'
    quote: 'His prophecy speaks first of universal judgment (Zeph. 1:1–3:8); and then of universal salvation in the knowledge of Jehovah (3:9–20).'
  - where: 'note 3:8 “Wait for me”'
    claim: 'The footnote points to Joel 3:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/3?lang=eng'
    quote: '8a “to”: Joel 3:2 (1–2).'

