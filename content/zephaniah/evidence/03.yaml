    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile.'
  - where: 'note 3:10 “From beyond the rivers of Cush”'
    claim: 'The footnote points to Isaiah 18:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/3?lang=eng'
    quote: '10a “beyond”: Isa. 18:1.'
  - where: 'note 3:10 “From beyond the rivers of Cush”'
    claim: 'Cush names the remotest nations'
