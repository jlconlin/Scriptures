summary: >-
  Zephaniah begins with the great day of the LORD, a day of cloud and thick darkness
  over the whole land, and ends with the Lord in the midst of a humble remnant,
  rejoicing over them with singing. Between them stands the book's one call: seek the
  Lord, all ye meek, that it may be ye shall be hid. The prophet's name means one hidden
  or protected by the Lord, and the image holds that single idea: a sheltered place under a rock, with the
  dark day far off and the light resting on those kept safe.
motifs:
  - "A shelter under a rock (Zephaniah 2:3): the largest form in the picture, a long ledge of pale limestone on the right that overhangs a shaded, green hollow in the hillside, lit gold along its top."
  - "A small flock lying down (Zephaniah 3:13): five sheep resting in the grass under the overhang, calm, their heads down."
  - "A dark bank of cloud far off (Zephaniah 1:15): a heavy grey-indigo cloud bank in the upper left, over the far plain, with the wide hill country between it and the shelter."
composition: >-
  A wide landscape of rolling, scrubby hill country in warm gold light, seen from a
  slightly raised viewpoint on the hillside. The rock ledge and its hollow fill the right
  half of the picture, with the sheep resting in the shade beneath it and rocks and
  scrub in the foreground. To the left the hills fall away to a pale plain that runs to
  the horizon, with the dark cloud bank above it; the sky over the shelter is clear and
  gold, brightest at the upper right. No fire, no lightning, no ruins, no city, no
  figures, and no animals but the sheep.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The shelter under the rock** is the hope held out to the meek: “Seek ye the LORD, all ye meek of the earth … it may be ye shall be hid in the day of the LORD’s anger” ([[Zeph. 2:3]]). The prophet’s own name, Zephaniah, means one hidden or protected by the Lord.'
  - '**The sheep lying down in the shelter** are the humble remnant the Lord keeps: “they shall feed and lie down, and none shall make them afraid” ([[Zeph. 3:13]]).'
  - '**The dark cloud bank far off** is the day of the LORD that Zephaniah warns of, “a day of darkness and gloominess, a day of clouds and thick darkness” ([[Zeph. 1:15]]).'
