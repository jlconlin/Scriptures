chapter: 2
title: Seek Ye the LORD, All Ye Meek
tagline: Before the day comes, the prophet calls the humble to seek the Lord, then turns to the nations in every direction from Judah, from the Philistine coast to proud Nineveh.
when: 'Zephaniah prophesied in the reign of Josiah of Judah (about 640–609 B.C.), probably early in it'

setting: |
  Chapter 1 announced the day of the LORD on the whole earth and on Judah. Chapter 2 turns to what can be done before it comes. Its first three verses call Judah to repent, and the rest of the chapter gives the reason: the judgment about to fall on the nations around it. Zephaniah spoke in the earlier part of Josiah's reign, as the reform was beginning (see [[Zeph. 1:1]] and chapter 1's background). Assyria was still the great power, and Nineveh was still standing: the Babylonians destroyed it in 612 B.C., so this oracle was spoken before then.

  The nations named here are the same peoples other prophets address, and the site's notes on them are linked rather than repeated: the Philistines at [[Jer. 47:1]], Moab at [[Jer. 48:1]], Ammon at [[Ezek. 25:3]].

  As in chapter 1, the Church reads these judgments as reaching beyond Zephaniah's day to the Second Coming (see the note on [[Zeph. 1:14]]).

thread: |
  The chapter is a call to the humble, then a tour of the compass.

  It opens with three verses to Judah: gather yourselves, before the decree takes effect; seek the LORD, all ye meek; “it may be ye shall be hid.” Verse 4 begins with “For,” and what follows is the reason for the call. The nations named lie in each direction from Judah: the Philistines to the west (verses 4–7), Moab and Ammon to the east (verses 8–11), the Ethiopians to the south (verse 12), and Assyria with Nineveh to the north (verses 13–15). Ethiopia is not a neighbor but the farthest people to the south that Judah knew, and Assyria, the empire of the day, lay north-east but came down on Judah from the north. The judgment reaches in every direction from Judah. Judah stands at the center of this ring of nations, and by bundling it with them Zephaniah “suggests that God's covenant people equal and surpass the wickedness of their neighbors.”

  The chapter also sets two kinds of people side by side. The meek, who seek righteousness and meekness, may be hidden; the proud fall. Moab and Ammon fall “for their pride” (verse 10), and Nineveh's last words are a boast: “I am, and there is none beside me” (verse 15). The only hope of escape the chapter holds out is to the humble. Between the two stands verse 11: the Lord will bring down the gods of the nations so that “men shall worship him, every one from his place.”

sections:
  - range: 1-3
    heading: Seek the Lord before the day
    plain: |
      Gather yourselves together, yes, gather together, you unwanted (or, shameless) nation, before the decree takes effect and the day blows past like chaff, before the Lord's fierce anger comes on you, before the day of the Lord's anger comes on you. Seek the Lord, all you humble people of the land who keep His law. Seek righteousness, seek humility. Perhaps you will be hidden in the day of the Lord's anger.
  - range: 4-7
    heading: West, the Philistine coast
    plain: |
      For Gaza will be abandoned and Ashkelon left desolate; Ashdod will be driven out at noon, and Ekron uprooted. Woe to you who live on the seacoast, you nation of the Cherethites! The word of the Lord is against you, Canaan, land of the Philistines: I will destroy you until no one is left. The coast will become shepherds' huts and pens for flocks. The coast will belong to the remnant of the house of Judah. They will graze their flocks there and lie down at evening in the houses of Ashkelon, for the Lord their God will remember them and restore them.
  - range: 8-11
    heading: East, Moab and Ammon
    plain: |
      I have heard Moab's taunts and the insults of the Ammonites, how they mocked My people and boasted against their territory. Therefore, as I live, says the Lord of hosts, the God of Israel, Moab will become like Sodom and Ammon like Gomorrah, a land of weeds and salt pits, desolate forever. What is left of My people will plunder them; the survivors of My nation will inherit their land. This is what their pride will bring them, because they mocked and boasted against the people of the Lord of hosts. The Lord will be terrible to them, for He will starve all the gods of the earth, and people everywhere, each from their own place, even all the distant coastlands of the nations, will worship Him.
  - range: 12-15
    heading: South and north, Cush and Assyria
    plain: |
      You Ethiopians too will be slain by My sword. And He will stretch out His hand against the north and destroy Assyria, and make Nineveh a desolation, dry as the desert. Flocks will lie down in her, every kind of animal. Creatures of the ruins will lodge on the tops of her pillars; a voice will sing in the windows; rubble will lie on the thresholds, for He will strip away her cedar paneling. This is the rejoicing city that lived carelessly, that said in her heart, “I am, and there is no one else.” What a desolation she has become, a place for beasts to lie down in! Everyone who passes by hisses and waves a hand at her.

notes:
  - ref: 1
    phrase: O nation not desired
    kind: words
    title: Not desired, or not ashamed?
    body: |
      The Hebrew word behind “not desired” is uncertain, and modern translations call Judah a “shameless” or “shameful” nation instead. It is *lōʾ nikhsāp*, from a verb that elsewhere means to long for: Laban tells Jacob, “thou sore longedst after thy father's house” ([[Gen. 31:30]]). Read that way, Judah is a nation no one longs for, which is the King James sense. But in this verse the phrase is “very dubious.” The proposal behind the modern renderings comes from the verb's root sense of turning pale: “perhaps … O nation not turning pale, = not ashamed,” a nation that does not blush at what is coming. The meaning is uncertain; either way, the nation is told to gather itself “before the decree bring forth,” so there is still time.
    sources: [oshb-wlc, bdb, esv, niv]
  - ref: 3
    phrase: all ye meek of the earth, which have wrought his judgment
    kind: words
    title: The meek who already keep his law
    body: |
      The people called to seek the Lord are described as already doing what He asks. “Meek of the earth” means the humble of the land (the word is explained at [[Ps. 76:9]]), and “which have wrought his judgment” describes them: they “do his just commands,” as a modern translation puts it, seeking diligently to do what the law prescribes as right. So verse 3 narrows the call of verse 1: within the nation, the faithful are told to “strive still more zealously” after righteousness and humility, because the day is near.

      The verse also names who will come through. Zephaniah “does not see any way of escape for any but for the humble, whom he mentions in contrast to the proud.” The proud appear later in the chapter: Moab and Ammon, whose fate comes “for their pride” (verse 10), and Nineveh, which said “I am, and there is none beside me” (verse 15).
    sources: [oshb-wlc, keil-zephaniah, esv, ot-manual-21]
  - ref: 3
    phrase: it may be ye shall be hid in the day of the LORD’s anger
    kind: words
    title: Hidden, like the prophet's name
    body: |
      The word “hid” in this promise means what the prophet's own name means. Zephaniah is from the root *ṣāpan*, “to hide, protect, cover, or treasure up,” so the name means “one who is protected or hidden by the Lord.” The word for “hid” here is a different verb, *sātar*, but it has the same meaning, and the two roots form “a clever wordplay.” The prophet whose name says the Lord hides carries the message that the Lord may hide the meek.

      “It may be” is *ʾûlay*, “perhaps,” as modern translations have it: “perhaps you may be hidden.” Amos uses the same word for the remnant of Joseph, and the note at [[Amos 5:15]] explains what such a “perhaps” means.
    sources: [ball-prophets-names, oshb-wlc, nrsvue]
  - ref: 4
    phrase: 'For Gaza shall be forsaken, and Ashkelon a desolation: they shall drive out Ashdod at the noon day, and Ekron shall be rooted up'
    kind: words
    title: Names that sound like their sentence
    body: |
      Two of the four Philistine cities hear their fate in their own names. “Gaza shall be forsaken” is *ʿazzâ ʿăzûbâ*, and “Ekron shall be rooted up” is *ʿeqrôn tēʿāqēr*. The verb used of Ekron also ties its fate to barrenness and childlessness. The next verse does the same with “the Cherethites,” a name chosen to mark the people for *kārat*, cutting off (the note at [[Ezek. 25:16]] explains the pun, which Ezekiel repeats).

      “At the noon day” is probably not “in broad daylight” but “when no one expects it”: noon was the hour of rest in a hot country (see [[2 Sam. 4:5]]), so expulsion at noon is sudden. Gath, the fifth Philistine city, is missing here as it is in [[Amos 1:6–8]]; four names are enough to stand for the whole coast. Who the Philistines were is in the note at [[Jer. 47:1]].
    sources: [bowen-ominous-onomastics, keil-zephaniah]
  - ref: 7
    phrase: the LORD their God shall visit them, and turn away their captivity
    kind: words
    title: The Lord will remember them and restore them
    body: |
      Here “visit” means that the Lord comes to His people's aid, and “turn away their captivity” means to restore. A modern translation reads the line, “the Lord their God will be mindful of them and restore their fortunes.” The Hebrew phrase is an idiom, “restore the captivity of,” and the noun can mean the exiles themselves or, figuratively, “a former state of prosperity.” The same idiom is used of Israel in the covenant's promise of return ([[Deut. 30:3]]) and again at the end of this book ([[Zeph. 3:20]]); the Church's footnote points to both.

      So the first promise to a remnant in this chapter comes in the middle of the oracle on the Philistines. The coast emptied of its people (verses 5–6) becomes pasture for “the remnant of the house of Judah.”
    sources: [bdb, esv, lds-scriptures]
  - ref: 9
    phrase: Surely Moab shall be as Sodom, and the children of Ammon as Gomorrah
    kind: history
    title: Moab as Sodom
    body: |
      Moab and Ammon were Israel's kin across the Jordan. Moab was “Son of Lot's eldest daughter.” His descendants lived east of the Dead Sea, “akin to the Israelites,” yet in “constant warfare” with them. Ammon descended from Lot's younger daughter ([[Gen. 19:38]]). Their offense here is scorn of the Lord's people, the same charge Jeremiah brings (see the note at [[Jer. 48:26]]; on Ammon, [[Ezek. 25:3]]).

      Their sentence is to become like the cities “the LORD rained upon … brimstone and fire” ([[Gen. 19:24]]). “The breeding of nettles, and saltpits” means a land “occupied by weeds and salt pits,” or as a modern translation has it, “a place of weeds and salt pits, a wasteland forever.”
    sources: [bd-moab, lds-scriptures, niv]
  - ref: 11
    phrase: he will famish all the gods of the earth
    kind: words
    title: Gods starved of their worshippers
    body: |
      “Famish” is *rāzâ*, which apparently means “make lean,” though the sense is strange in this verse. The idea seems to be that the gods waste away. One reading takes the image from the worshippers' point of view: idolaters believed their gods were fed by the smoke of offerings, so when the sacrifices stopped, the gods would starve. Another puts it in terms of history: the Lord makes the gods vanish by destroying the nations that relied on them, and so “reveals the nothingness of the gods.”

      The verse is the hinge of the chapter. It leads from the oracle on Moab and Ammon to the oracles that follow, and it says where they lead: “men shall worship him, every one from his place, even all the isles of the heathen,” the distant coastlands standing for the whole world. The judgment on the nations is not the end of the nations. Malachi foresees the same worship: “in every place incense shall be offered unto my name, and a pure offering” ([[Mal. 1:11]]). On the Lord who will be “terrible unto them,” see [[D&C 45:74]].
    sources: [oshb-wlc, bdb, ot-minute-zeph, keil-zephaniah, lds-scriptures]
  - ref: 12
    phrase: Ye Ethiopians also
    kind: history
    title: 'The Ethiopians: Cush'
    body: |
      The “Ethiopians” are Cush, the land south of Egypt, extending “from Syene on the frontier of Egypt southward to the neighborhood of Khartoum,” and including “the modern Nubia.” They are given a single line, as the farthest people to the south that Judah knew (see the thread above).
    sources: [bd-ethiopia]
  - ref: 13
    phrase: he will stretch out his hand against the north, and destroy Assyria
    kind: history
    title: 'Against the north: Assyria and Nineveh'
    body: |
      Nineveh, “Capital of Assyria on the eastern bank of the Tigris,” was the city to which Jonah had been sent ([[Jonah 1:2]]). Its repentance then turned away its destruction ([[Jonah 3:10]]). The Babylonians destroyed Nineveh in 612 B.C., “and the remnant of the Assyrian empire vanishes shortly thereafter.” Since Zephaniah speaks of the fall as still to come, he preached before that date.

      Nahum also prophesies the city's fall ([[Nahum 1:1]]). “The north” is *ṣāpôn*, and it echoes the prophet's name once more (see the note on verse 3): his name “becomes a sign of what the Lord will do to ‘the north.’”
    sources: [bd-nineveh, bowen-ominous-onomastics, ot-minute-zeph]
  - ref: 14
    phrase: both the cormorant and the bittern shall lodge in the upper lintels of it
    kind: words
    title: Which creatures haunt the ruins?
    body: |
      No one knows for sure which animals the King James “cormorant” and “bittern” are. The first word, *qāʾat*, is “a bird, usually pelican,” listed among the unclean birds and found “inhabiting ruins” here and at [[Isa. 34:11]]. The second, *qippōd*, is in the lexicon a “porcupine,” though some have taken it from the context as “bittern”; either way it haunts “desolate places.” Other renderings are “the owl and the hedgehog” or “the desert owl and the screech owl,” and the identity of the animals “is uncertain.”

      The picture is clear even if the animals are not. For “the upper lintels” modern translations have “her capitals” or “her columns,” the tops of pillars still standing in the ruins; “a voice shall hoot in the window”; rubble lies on the thresholds; and “her cedar work will be laid bare.” The imperial city becomes what verse 15 calls it, “a place for beasts to lie down in.”
    sources: [oshb-wlc, bdb, esv, niv]
  - ref: 15
    phrase: I am, and there is none beside me
    kind: scripture
    title: Nineveh's boast
    body: |
      Nineveh's boast claims for the city what the Lord claims for Himself. Isaiah gives Babylon the same boast, “I am, and none else beside me” ([[Isa. 47:8]]), and the note there shows that it echoes the Lord's own words about Himself. Here the boast belongs to the city that “dwelt carelessly,” and it is answered with a ruin.

      Those who pass by “hiss, and wag his hand”; a modern translation has “scoff and shake their fists.” Jeremiah uses the same picture for Judah: “every one that passeth thereby shall be astonished, and wag his head” ([[Jer. 18:16]]).
    sources: [lds-scriptures, niv]

christ: |
  The meek whom Zephaniah calls to seek the Lord are the meek Jesus blessed: the Church's footnote on verse 3 points to “blessed are the meek, for they shall inherit the earth” ([[3 Ne. 12:5]]) and to the revelation that “the poor and the meek of the earth shall inherit it” ([[D&C 88:17]]). For a disciple now, meekness shows in seeking the Lord, His righteousness and humility, before the day comes, and the promise to such a life in a wicked and violent world is the one in the prophet's name: the humble “may be protected or ‘hidden by the Lord.’”

explore: |
  - **“Perhaps.”** The same hope, hedged the same way: [[Amos 5:14–15]], [[Joel 2:12–14]], [[Jonah 3:9]].
  - **The nations around Judah.** Other prophets on the same peoples: [[Jer. 47–49]], [[Ezek. 25]], [[Amos 1:6–2:3]].
  - **Nineveh.** The city that repented, and the city that fell: [[Jonah 3]], [[Nahum 3]].
  - **The proud city's boast.** Babylon's: [[Isa. 47:7–11]] and [[Rev. 18:7–8]].

