chapter: 1
title: The Great Day of the LORD Is Near
tagline: Zephaniah, in Josiah’s Jerusalem, announces a judgment on all the earth that falls first on Judah, on its idols and its divided worship, its princes and merchants, and the comfortable men who think the LORD does nothing.
when: 'Zephaniah prophesied in the reign of Josiah of Judah (about 640–609 B.C.), probably early in it'

setting: |
  Zephaniah prophesied “in the days of Josiah the son of Amon, king of Judah.” Nothing is known of his life beyond what can be inferred from his book. He is not the priest Zephaniah of Jeremiah’s day ([[Jer. 21:1]]), who was a different man. His name means “The Lord hides”: one who is “protected or hidden by the Lord,” a name that “seems to summarize the prophet’s message” (see [[Zeph. 2:3]]).

  Josiah inherited a Judah shaped by half a century of Manasseh ([[2 Kgs. 21:1–18]]), under whom the worship of Jehovah “was merged so completely with idolatry that it was barely distinguishable from paganism.” The young king began to seek the Lord in his eighth year and to purge Judah and Jerusalem in his twelfth ([[2 Chr. 34:3]]), and the reform gathered pace from 622 B.C. Zephaniah most likely preached before then, since he attacks practices the later reform largely did away with. The date turns on the phrase “the remnant of Baal” (verse 4), which many read as showing that the purge had already begun. He was a contemporary of Lehi, and his ministry came a few years before Jeremiah’s. The kings are set out in [Babylon and the Exile](/old-testament/guides/babylon-and-the-exile/#rulers).

  The destruction the chapter foretells is Judah’s, which came at the hands of the Babylonians. The Church reads the prophecy as reaching further, since Zephaniah’s words “can apply to both his day and the future” (see the note on verse 14).

thread: |
  The chapter narrows and then widens. It opens on the whole earth, with man, beast, bird and fish swept away (verses 2–3). Then the judgment that comes on the whole earth “will fall especially upon Judah and Jerusalem” (verses 4–13), and inside the city on particular people: the idolatrous priests, those who swear by the LORD and by Malcham, princes in foreign clothes, merchants, and men at ease who think the LORD does nothing. At the end it widens again, and “the whole land” is devoured (verse 18). The threat returns to the scope it opened with, so the whole earth is most likely meant.

  One word holds it together. From verse 7 to verse 18 “day” comes fourteen times, and the passage opens and closes with “the day of the LORD”; in verses 15–16 it comes seven times in two verses. The last line, “devoured by the fire of his jealousy,” returns as a refrain at [[Zeph. 3:8]], at the end of the book’s message of judgment. This chapter is all warning. The call “Seek ye the LORD” before the day comes only in the next ([[Zeph. 2:3]]).

sections:
  - range: 1-1
    heading: The heading
    plain: |
      This is the word of the LORD that came to Zephaniah son of Cushi, son of Gedaliah, son of Amariah, son of Hizkiah, in the days of Josiah son of Amon, king of Judah.
  - range: 2-3
    heading: All the earth swept away
    plain: |
      I will sweep away everything from the face of the land, says the LORD. I will sweep away people and animals, the birds of the sky and the fish of the sea, the idols together with the wicked. I will cut off humankind from the face of the land, says the LORD.
  - range: 4-6
    heading: Judah’s idols and its divided worship
    plain: |
      I will stretch out my hand against Judah and against everyone who lives in Jerusalem. From this place I will cut off what is left of Baal, and the very name of the Chemarim, the idolatrous priests, along with the priests. I will cut off those who bow down on the rooftops to the stars and planets; those who bow down and swear by the LORD and also swear by Malcham; those who have turned back from following the LORD, and those who have never sought Him or asked for Him.
  - range: 7-13
    heading: The day of the LORD’s sacrifice
    plain: |
      Hush before the Lord GOD, for the day of the LORD is near. The LORD has prepared a sacrifice and consecrated the guests He has invited. On the day of the LORD’s sacrifice I will punish the officials and the king’s sons, and all who dress in foreign clothes. On that day I will punish everyone who leaps over the threshold, those who fill their masters’ houses with violence and fraud. On that day, says the LORD, a cry will go up from the Fish Gate, wailing from the Second Quarter, and a great crash from the hills. Wail, you who live in Maktesh, for all the merchants are destroyed, and all who carry silver are cut off. At that time I will search Jerusalem with lamps and punish the men who sit at ease like wine left on its dregs, who say to themselves, “The LORD will do nothing, neither good nor bad.” Their wealth will be plundered and their houses left desolate. They will build houses and not live in them, and plant vineyards and not drink their wine.
  - range: 14-18
    heading: That day
    plain: |
      The great day of the LORD is near, near and coming fast. Hear the sound of the day of the LORD: even the warrior cries out bitterly there. That day is a day of wrath, a day of trouble and distress, a day of ruin and devastation, a day of darkness and gloom, a day of clouds and thick darkness, a day of the ram’s horn and the battle cry against the fortified cities and the high towers. I will bring such distress on people that they will walk like the blind, because they have sinned against the LORD. Their blood will be poured out like dust and their flesh like dung. Neither their silver nor their gold will be able to save them on the day of the LORD’s wrath. The whole land will be consumed by the fire of His jealousy, for He will make a sudden end of all who live in the land.

notes:
  - ref: 1
    phrase: the son of Hizkiah
    kind: history
    title: Was Hizkiah King Hezekiah?
    body: |
      The heading traces Zephaniah back four generations, and the last name is a king’s. “Hizkiah” is the Hebrew name *Ḥizqiyyāh*, which the King James Version elsewhere spells Hezekiah. It was borne by a king of Judah and by two other Israelites.

      One reading takes the long pedigree as the point. Since a prophet’s book names only his father “as a general rule,” an ancestor named four generations back “must have been a celebrated man,” and “in all probability the king of that name is intended.” The kings’ line has only two generations between Hezekiah and Josiah, Manasseh and Amon, where Zephaniah’s has three between Hizkiah and himself. The gap is no real objection, since Manasseh reigned fifty-five years, “nearly two generations.” The title “king of Judah” may be missing because it follows at once with Josiah’s name.

      The heading itself does not say so, and the question remains open: “It is not known whether this individual was the same as Hezekiah the king.” Nothing in the book depends on it.
    sources: [oshb-wlc, bdb, keil-zephaniah, ot-manual-21]

  - ref: 3
    phrase: I will consume man and beast
    kind: scripture
    title: The Flood undone
    body: |
      The list of man, beast, the birds of heaven and the fish of the sea recalls the Lord’s words before the Flood: “I will destroy man whom I have created from the face of the earth; both man, and beast, and the creeping thing, and the fowls of the air” ([[Gen. 6:7]]). Read as an echo of that threat, the list makes the coming judgment “as general over the earth, and as terrible, as the judgment of the flood.” With the people go “the stumblingblocks,” which the footnote reads as idols: the idols are swept away together with those who served them.

      So the chapter does not begin with Judah. The day of the Lord is “the outpouring of His wrath on all created things.” On one reading, the judgment on the whole world “forms an integral part of his prophecy,” which speaks most fully of Judah because Judah is the kingdom of God, “to be purified from its dross by judgment.” How the prophecy reaches both Judah’s fall and the last days is the subject of the note on verse 14.
    sources: [keil-zephaniah, lds-scriptures, bd-zephaniah]

  - ref: 4
    phrase: the name of the Chemarims with the priests
    kind: words
    title: Chemarims, the priests Josiah put down
    body: |
      “Chemarims” is not the name of a people but a Hebrew word left untranslated. *Kĕmārîm* is used only in the plural and only of idolatrous priests, and the footnote reads “OR idolatrous priests.” The same Hebrew word stands in [[2 Kgs. 23:5]], where Josiah “put down the idolatrous priests, whom the kings of Judah had ordained to burn incense in the high places.” Zephaniah threatens to cut off, name and all, the very men the reform was removing.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 5
    phrase: that swear by the LORD, and that swear by Malcham
    kind: history
    title: Sworn to two gods
    body: |
      Verse 5 names two kinds of worshippers. The first bow on the housetops to “the host of heaven,” false gods associated with the planets and stars. Josiah broke down such altars “on the top of the upper chamber of Ahaz” ([[2 Kgs. 23:12]]), and the site’s note on [[Jer. 19:13]] explains the practice.

      The second bow to the LORD and swear by Him, and swear by Malcham as well. The Hebrew *malkām* is the name of Milcom ([[1 Kgs. 11:33]]), “the national idol of the Ammonites”; it may also mean Molech, “a deity associated with child sacrifice.” Molech and Milcom may be one god, “a fire god, worshipped by passing children through or burning them in fire” (see the site’s note on [[Lev. 18:21]]). Whichever god is meant, the charge is the same: these men named the LORD in their oaths and another god beside Him, the mixed worship described in the setting above.
    sources: [scripture-helps-micah, bdb, oshb-wlc, bd-molech, lds-scriptures]

  - ref: 7
    phrase: the LORD hath prepared a sacrifice, he hath bid his guests
    kind: symbol
    title: The LORD’s sacrifice and His consecrated guests
    body: |
      The day of the LORD is pictured as a sacrificial feast, and on one reading Judah itself is the victim: the sacrifice “is the Jewish nation,” and the guests invited to the meal are “the nations which He has consecrated to war” against it. Isaiah used the same picture of judgment: “the LORD hath a sacrifice in Bozrah” ([[Isa. 34:6]]).

      “Bid” hides a stronger word. The Hebrew *hiqdîš* means “to consecrate, sanctify, set apart,” so the LORD has not only invited His guests but set them apart for the work, as the armies sent against Babylon are His “sanctified ones” ([[Isa. 13:3]]).

      The verse opens with a single Hebrew word of command, “Hush!” The footnote sets it beside “let all the earth keep silence before him” ([[Hab. 2:20]]), and the command is probably formed after that line; it calls for “humble, silent submission to the judgment of God.”
    sources: [keil-zephaniah, oshb-wlc, bdb, lds-scriptures]

  - ref: 8
    phrase: clothed with strange apparel
    kind: words
    title: Foreign clothes
    body: |
      “Strange” here means foreign (Hebrew *nokrî*). The princes, the king’s sons and all who followed them were dressing in the fashions of other nations. The clothes are named because of what they showed. Judah had “allowed herself to be overwhelmed by worldliness,” and its leaders wore “clothing styles that fail to reflect the appearance of a covenant people.”
    sources: [oshb-wlc, bdb, vandyke-ogden-twelve]

  - ref: 9
    phrase: leap on the threshold
    kind: history
    title: Leaping over the threshold
    body: |
      The footnote reads “on” as “over,” making the phrase a picture of plunder: men who leap over the threshold “to plunder and pillage,” and so “fill their masters’ houses with violence and deceit.”

      Another reading ties the phrase to the priests of Dagon, who would not tread on the threshold of Dagon’s temple at Ashdod after their idol fell there before the ark ([[1 Sam. 5:5]]). “Avoiding stepping on thresholds was a pagan custom,” and on this view the verse condemns a Philistine superstition taken up in Jerusalem.
    sources: [lds-scriptures, ot-minute-zeph]

  - ref: 10
    phrase: the noise of a cry from the fish gate
    kind: history
    title: The fish gate, the Second Quarter and Maktesh
    body: |
      Verses 10–11 name the parts of Jerusalem from which the cry will rise. The fish gate “was on the north end of the city,” and those there “would be the first to see an enemy invading from the north.” “The second” is the Second Quarter, a district of the city, so called “probably because it was an expansion of the original city of David.” Maktesh, another district, was “the merchant quarter,” which is why verse 11 speaks of merchants and of “all they that bear silver.” Together they are “landmarks on the north side of Jerusalem past which the invaders were to come.”

      These oracles have been explained by a raid of the Scythians, but Zephaniah does not name the foe.
    sources: [ot-manual-21, lds-scriptures, brown-jeremiah-crisis]

  - ref: 12
    phrase: I will search Jerusalem with candles, and punish the men that are settled on their lees
    kind: symbol
    title: Searched out by lamplight
    body: |
      The LORD will go through Jerusalem with a lamp in hand. A lamp was needed to search the poorly lit houses of the time at night, so the image means a search that misses nothing. One reading pictures a plundering army “searching with candles for any who may be hiding.”

      The men He is looking for are “settled on their lees,” like wine left too long on its sediment; the site’s note on [[Jer. 48:11]] explains the image. Like bad wine, such men stay apathetic about true religion and grow harsher with time. The footnote gives the plain sense: “complacent, indifferent.”

      Their creed is in the last clause: “The LORD will not do good, neither will he do evil.” They do not say there is no God. They say He will do nothing either way. Verse 13 answers them. The God they thought idle will act, and their houses and vineyards will go to others, as the covenant had warned ([[Deut. 28:30]]).
    sources: [ot-manual-21, ball-prophets-names, lds-scriptures]

  - ref: 14
    phrase: The great day of the LORD is near
    kind: scripture
    title: Near in Josiah’s day, and in the last days
    body: |
      Zephaniah presses how near the day is: “near” twice, then “hasteth greatly.” For Zephaniah’s hearers the day was near in the plainest sense: the destruction he foretold came when Judah fell to the Babylonians. What the day of the LORD is across the prophets is explained at [[Joel 1:15]].

      The Church reads the prophecy as reaching further. The chapter heading calls Judah’s destruction “symbolic of the Second Coming.” What Zephaniah describes can be compared to the destruction of the wicked before the Saviour comes again. The footnote to this verse sets beside it Malachi’s “great and dreadful day of the LORD” ([[Mal. 4:5]]) and the words of Elijah in the Kirtland Temple, after he had committed his keys: “the great and dreadful day of the Lord is near, even at the doors” ([[D&C 110:16]]).
    sources: [vandyke-ogden-twelve, lds-scriptures, scripture-helps-micah]

christ: |
  The LORD who speaks in this chapter is Jehovah, and “Jehovah is the premortal Jesus Christ.” The day He announces is His own day, the day Elijah declared near in the Kirtland Temple after the Lord Jehovah had appeared there ([[D&C 110:1–16]]; see the note on verse 14). The men of verse 12 thought the LORD would do neither good nor evil. The chapter answers that He sees and acts, and searches out complacency in every house of the city.

  The book does not end with the warning. In the next chapter the same Lord calls “Seek ye the LORD, all ye meek of the earth,” with the promise “it may be ye shall be hid in the day of the LORD’s anger” ([[Zeph. 2:3]]). The protection the book offers a disciple is not silver or gold, which verse 18 says cannot deliver anyone, but seeking the Lord before His day comes, as Zephaniah pleaded with his people to do.

explore: |
  - **The day of the LORD across the prophets.** [[Joel 1:15]]; [[Isa. 13:6–13]]; [[Amos 5:18–20]]; [[Mal. 4:1–6]].
  - **Josiah’s reform, which removed what verses 4–5 condemn.** [[2 Kgs. 23:4–14]]; [[2 Chr. 34:1–7]].
  - **Silver and gold that cannot save.** [[Ezek. 7:19]], where the site’s note “Gold as an unclean thing” takes up the same thought.
  - **Lehi in the same Jerusalem.** [[1 Ne. 1:4–20]]. Lehi’s message of judgment on the city can be set beside Zephaniah 1:2–9 and 18.

