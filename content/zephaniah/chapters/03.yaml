chapter: 3
title: The Lord in the Midst of Thee
tagline: A last woe on Jerusalem and her leaders gives way to a promise. The peoples are given clean lips, a humble remnant is left, and the Lord, King in Zion’s midst, rejoices over her with singing and gathers the lame and the scattered home.
when: 'Zephaniah prophesied in the reign of Josiah of Judah (about 640–609 B.C.), probably early in it.'

setting: |
  The book’s last chapter turns from the oracles on the nations to one more woe. Chapter 2 closed on Nineveh, the proud city that said in her heart, “I am, and there is none beside me” ([[Zeph. 2:15]]). The next woe falls, without a name, on another city, and it is Jerusalem: God turns His anger “once more on apostate Jerusalem, the city He intended to be the center of righteousness.” Verses 1–7 are the book’s last charge against Judah, that she is “polluted, oppressive, unteachable, disobedient, and guilty of wresting the Torah.”

  Then the book turns. The Bible Dictionary divides Zephaniah into “universal judgment (Zeph. 1:1–3:8)” and “universal salvation in the knowledge of Jehovah (3:9–20),” and the turn falls inside this chapter, at “For then” (verse 9). The thirteen verses that follow are nearly all promise: purified peoples, a humble remnant, a song in Zion, and the gathering of the scattered.

  The woe was fulfilled first when Judah fell to the Babylonians. But as the book’s opening describes “both the historical destruction of Judah and the judgments that are to come,” so the Church reads this chapter forward as well: its heading reads it of the Second Coming, when “all nations will assemble to battle,” and *Scripture Helps* says the blessings promised to the righteous in Jerusalem can foreshadow those the righteous will receive at the Second Coming. The note on [[Isa. 62:5]] already sets verse 17 beside Isaiah’s bridegroom.

thread: |
  The chapter turns on one phrase, the Lord “in the midst.” In verse 5 the just LORD is in the midst of a city whose princes are roaring lions “within her.” Judgment clears the city: the Lord will “take away out of the midst of thee” the proud (verse 11) and “leave in the midst of thee an afflicted and poor people” (verse 12). Then, with the enemy gone, “the king of Israel, even the LORD, is in the midst of thee” (verse 15), and “The LORD thy God in the midst of thee is mighty” (verse 17). The presence that once stood in judgment among the unjust now stands among the cleansed, and rejoices.

  Between the two halves stands verse 8, the end of the book’s judgment, and verse 9, the start of its salvation. The command to wait for the day that devours the earth is followed at once by “For then,” and the peoples’ lips are made pure. From there the chapter’s time words are “in that day” (verses 11, 16) and “at that time” (verses 19, 20), which can describe both a repentant Judah and the covenant people of the latter days. Both are promised the presence of the Lord.

sections:
  - range: 1-7
    heading: Woe to the city
    plain: |
      Woe to the rebellious, defiled city, the city that oppresses! She does not listen to the Lord’s voice and will not accept correction. She does not trust the LORD or draw near to her God. Her princes inside her are roaring lions; her judges are wolves that hunt at evening and leave nothing for the morning. Her prophets are reckless and faithless; her priests have profaned what is holy and done violence to the law.

      The LORD within her is just; He does no wrong. Every morning He brings His justice to light, and He never fails, yet the wicked feel no shame. “I have cut off nations,” the LORD says. “Their towers lie in ruins, their streets are empty, their cities have no one left in them. I said, ‘Surely you will fear Me now and accept instruction,’ so that her home would not be cut off, whatever punishment I brought. But they rose early to make all their deeds corrupt.”
  - range: 8-8
    heading: Wait for the day
    plain: |
      “So wait for Me,” says the LORD, “for the day I rise up to take the prey. I have determined to gather the nations and assemble the kingdoms, to pour out on them My indignation, all My burning anger. The whole earth will be consumed by the fire of My jealousy.”
  - range: 9-13
    heading: Clean lips and a humble remnant
    plain: |
      “For then I will give the peoples pure lips, so that all of them may call on the name of the LORD and serve Him together, shoulder to shoulder. From beyond the rivers of Cush My worshippers, My scattered people, will bring Me an offering.

      “On that day you will not be put to shame for all the deeds by which you rebelled against Me, for I will remove from among you those who exult in their pride, and you will never again be haughty on My holy mountain. I will leave among you a humble and poor people, and they will trust in the name of the LORD. The remnant of Israel will do no wrong and tell no lies, and no deceitful tongue will be found in their mouths. They will graze and lie down, and no one will make them afraid.”
  - range: 14-17
    heading: Sing, daughter of Zion
    plain: |
      Sing, daughter of Zion! Shout, Israel! Be glad and rejoice with all your heart, daughter of Jerusalem! The LORD has taken away the judgments against you and turned back your enemy. The King of Israel, the LORD Himself, is among you; you will never again see evil. On that day Jerusalem will be told, “Do not be afraid, Zion; do not let your hands hang limp. The LORD your God is among you, a mighty one who saves. He will rejoice over you with joy; He will be quiet in His love; He will exult over you with singing.”
  - range: 18-20
    heading: Gathered home
    plain: |
      “I will gather those who grieve for the appointed feasts, who belong to you and carry the burden of reproach. At that time I will deal with everyone who afflicts you. I will save the lame and gather those who were driven away, and I will give them praise and renown in every land where they were put to shame. At that time I will bring you home, at the time when I gather you. I will make you renowned and praised among all the peoples of the earth, when I restore your fortunes before your very eyes,” says the LORD.

notes:
  - ref: 1
    phrase: Woe to her that is filthy and polluted, to the oppressing city
    kind: words
    title: Rebellious, defiled, oppressive
    body: |
      The woe describes Jerusalem as rebellious, stained and oppressive. The city is not named until the song of verse 14, but its prophets, priests and sanctuary (verse 4) show that the woe falls on Jerusalem.

      “Filthy” renders the first word, *mōrʾâ*, from a verb meaning “to rebel,” and modern translations read it as rebellion: “Woe to her who is rebellious and defiled” (ESV). The NIV makes the city’s sin plain in its first words, “Woe to the city of oppressors.” “Oppressing” is *hayyônâ*, the participle of a verb meaning “oppress,” used here as an adjective of the city. Spelled the same way, *yônâ* is also the ordinary word for a dove, and the Septuagint reads it so: “The dove hearkened not to the voice.”
    sources: [ot-minute-zeph, oshb-wlc, esv, niv, bdb, strongs-concordance, lxx-rahlfs]

  - ref: 3
    phrase: her judges are evening wolves; they gnaw not the bones till the morrow
    kind: symbol
    title: Evening wolves
    body: |
      The judges are pictured as wolves of the evening that leave nothing of the kill by morning. On one reading, “they gnaw not the bones till the morrow” does not mean they spare the bones: “they have left nothing for the morrow, in figure of cruel judges.” That derivation is doubtful; a second verb spelled the same means to “break bones,” and some read the line with it. Either way, the judges are pictured as greedy and cruel.

      Jeremiah too has the Lord send “a wolf of the evenings” against Judah ([[Jer. 5:6]]); the note there sets the two passages side by side. Ezekiel reviews Jerusalem’s princes, priests and prophets in nearly the same words as verses 3–4, and the note on [[Ezek. 22:25]] compares the two lists.
    sources: [bdb, lds-scriptures]

  - ref: 8
    phrase: Therefore wait ye upon me, saith the LORD, until the day that I rise up to the prey
    kind: words
    title: Wait for me
    body: |
      Verse 8 ends the book’s judgment with a command, “wait ye upon me,” best read as said to the faithful and not as an ironic word to the wicked: the phrase is “only used for waiting in a believing attitude of the Lord and His help.” The judgment they wait for is the one the book has threatened since its first verses: “all the earth shall be devoured with the fire of my jealousy” is the refrain of [[Zeph. 1:18]]. The Church’s footnote points to Joel’s gathering of the nations ([[Joel 3:2]]); the note on [[Joel 3:12]] explains that gathering in latter-day terms.

      Why should the faithful wait for such a day? The next verse answers: “For then.” One reading, drawn from the verses that follow, where the fire is followed by peoples who call on the LORD, takes the judgment as “not an exterminating but a refining judgment,” and the “prey” the Lord rises up to take as “the souls from among the nations which desire salvation.” The Septuagint has a different phrase, “until the day when I rise up for a witness.”
    sources: [keil-zephaniah, lxx-rahlfs, lds-scriptures]

  - ref: 9
    phrase: For then will I turn to the people a pure language
    kind: words
    title: A purified lip
    body: |
      The promise is that the peoples’ lips will be made clean so that they can call on the LORD. The Hebrew is *śāpâ bĕrûrâ*, “a purified lip”: *śāpâ* means “lip, speech,” the lip as the organ of speech, and the adjective comes from a verb meaning to “purge out, purify.” Modern translations keep one sense or the other: “Then I will purify the lips of the peoples” (NIV), or “I will change the speech of the peoples” to a pure speech (ESV). What the clean lips are for follows at once: “that they may all call upon the name of the LORD, to serve him with one consent.” “One consent” is literally “one shoulder,” people bearing the same load together; the NIV has “shoulder to shoulder,” and the Septuagint “under one yoke.”

      *Śāpâ* is also the word at Babel, where “the whole earth was of one language” ([[Gen. 11:1]]) until the Lord confounded it; the note there explains the word. Zephaniah’s promise has been read as “perhaps … a reversal of what happened at the tower of Babel.”

      Latter-day Saints have long read the verse of the last days, as foretelling “the return of a pure language to the people of the Lord.” The chapter heading puts it “Men will have a pure language,” and in 1834 *The Evening and the Morning Star* read the verse to mean that “the righteous shall speak a pure language.” Restoration scripture uses the same English word, “pure,” of the language taught to Adam’s children, “a language which was pure and undefiled” ([[Moses 6:6]]). The verse itself does not say which language it means, and the note on [[Gen. 11:1]] gives what is taught of Adam’s.
    sources: [oshb-wlc, bdb, niv, esv, lxx-rahlfs, ot-minute-zeph, lds-scriptures, nyman-isaiah-prophets, cowdery-zephaniah]

  - ref: 10
    phrase: my suppliants, even the daughter of my dispersed, shall bring mine offering
    kind: history
    title: From beyond the rivers of Cush
    body: |
      “Ethiopia” is Cush, the land south of Egypt (see the note on [[Zeph. 2:12]]). The phrase “beyond the rivers of Ethiopia” also stands in Isaiah ([[Isa. 18:1]]), and it is read here as naming “the remotest heathen nations,” the farthest a Judean knew. “Suppliants” are worshippers, people who pray, from a verb meaning “to pray, to entreat.”

      Who brings the offering is read two ways. Modern translations such as the NIV and NRSVue make the worshippers and the scattered one people, who come from the far south bringing their gifts: “my worshipers, my scattered people” (NIV); “my suppliants, my scattered ones” (NRSVue). The Septuagint has the Lord receiving them: “will I receive my dispersed ones; they shall offer sacrifices to me.” The other reading follows Isaiah, where the nations “shall bring all your brethren for an offering unto the LORD out of all nations” ([[Isa. 66:20]]): the scattered Israelites “are presented to the Lord by the converted Gentiles” as an offering. Either way, worshippers from the far edge of the known world bring the Lord an offering.
    sources: [lds-scriptures, keil-zephaniah, niv, nrsvue, lxx-rahlfs]

  - ref: 12
    phrase: an afflicted and poor people
    kind: words
    title: An afflicted and poor people
    body: |
      The remnant left in Jerusalem is defined by humility and trust, not by strength. The Lord first removes “them that rejoice in thy pride” (verse 11); what is left is “an afflicted and poor people.” The first word, *ʿānî*, is used of “pious in Israel afflicted by wicked nations or the wicked in Israel itself”: the lowly who suffer under others. The Septuagint renders the pair “a meek and lowly people.”

      Their mark is that “they shall trust in the name of the LORD.” Verse 13 adds what such people are like: they do no iniquity, speak no lies, and “none shall make them afraid.” With the call to the meek in [[Zeph. 2:3]], these two verses give “the characteristics of the people God would preserve.”
    sources: [bdb, lxx-rahlfs, cfm-ot-2026-49]

  - ref: 15
    phrase: the king of Israel, even the LORD, is in the midst of thee
    kind: christ
    title: The King in the midst of thee
    body: |
      The King who stands in the midst of Zion is the LORD, Jehovah, and “Jehovah is the premortal Jesus Christ and came to earth being born of Mary.” The Church’s footnote on “midst” points to the Topical Guide’s “Jesus Christ, Millennial Reign,” reading the verse of His reign on the earth.

      The verse is addressed to the “daughter of Zion” (verse 14), “a poetic personification of the city Jerusalem, and by extension … a metaphor for the House of Israel.” The same city, Jerusalem, heard “Woe” in verse 1. Now the judgments are “taken away,” the enemy is “cast out,” and she “shalt not see evil any more.”
    sources: [bd-jehovah, lds-scriptures, sc-knowhy-550, ot-minute-zeph]

  - ref: 17
    phrase: he will rest in his love
    kind: words
    title: Silent in His love
    body: |
      “He will rest in his love” renders a Hebrew verb, *yaḥărîš*, that means to be silent. The line can be translated “He rejoices over thee in delight, He is silent in His love, exults over thee with rejoicing.” The quiet stands between joy and singing, and translators have handled it in different ways: “he will quiet you by his love” (ESV); “in his love he will no longer rebuke you” (NIV). The Greek and Syriac translations read a different verb, “he will renew his love”: the Septuagint in English has “shall refresh thee with his love,” and the NRSVue “he will renew you in his love.”

      Keeping the Hebrew, the silence is the silence of a love too deep for words: “Silence in His love is an expression used to denote love deeply felt, which is absorbed in its object with thoughtfulness and admiration.” Then the silence breaks into song, and it is the Lord who sings: “he will joy over thee with singing,” or “he will exult over you with loud singing” (ESV). Here, “the prophet Zephaniah described the joy and love that God feels when He is with us.”
    sources: [oshb-wlc, keil-zephaniah, esv, niv, bdb, nrsvue, lxx-rahlfs, sc-knowhy-372]

  - ref: 18
    phrase: I will gather them that are sorrowful for the solemn assembly
    kind: words
    title: Grieving far from the assembly
    body: |
      Those “sorrowful for the solemn assembly” may be exiles grieving far from the place where Israel gathered before the Lord: one lexicon reads them as “afflicted (and driven) from the place of assembly,” that is, the temple, and lists this use of the verb for grieving “of exiles.” The ESV reads the word as the festival instead: “I will gather those of you who mourn” for the festival, “so that you will no longer suffer reproach.”

      The ancient and modern translations divide the verse differently. The NRSVue joins its first words to the Lord’s singing in verse 17, “as on a day of festival,” and the Septuagint has a different sentence altogether: “And I will gather thine afflicted ones. Alas! who has taken up a reproach against her?”
    sources: [oshb-wlc, bdb, esv, nrsvue, lxx-rahlfs]

  - ref: 19
    phrase: I will save her that halteth, and gather her that was driven out
    kind: scripture
    title: The lame and the outcast
    body: |
      The Lord promises to save the lame and gather the outcast, as modern translations put it: “I will save the lame and gather the outcast” (ESV). Micah has nearly the same words: “will I assemble her that halteth, and I will gather her that is driven out” ([[Micah 4:6]]). Both have been counted among the “prophetic texts” that “describe a culmination of the Lord’s mercy in healing disabilities during a paradisiacal future time.”

      The gathering is the promise of the last verses, given twice: “I will … gather her that was driven out” and “even in the time that I gather you” (verse 20). Read in the light of the Restoration, this is the gathering of Israel: “The house of Israel shall be gathered together in the last days before the coming of Christ,” and “The Lord gathers His people Israel when they accept Him and keep His commandments.” Lehi, who prophesied in the same Jerusalem, read in a heavenly book of the city’s destruction and of “the redemption of the world” ([[1 Ne. 1:19]]), as others, Zephaniah in these verses among them, “had prophesied about the eventual recovery of the scattered remnant.”
    sources: [esv, calabro-disability, gs-israel, welch-calling-prophet]

christ: |
  The book’s last picture is of the Lord in the midst of His people, rejoicing. The King of Israel in verse 15 is Jehovah, Jesus Christ before His birth (see the note on verse 15). When He came to the Nephites at the temple in Bountiful, He prayed for them until “no one can conceive of the joy which filled our souls” ([[3 Ne. 17:17]]), and then He said, “now behold, my joy is full” ([[3 Ne. 17:20]]). *Come, Follow Me* sets verses 14–20 beside that chapter.

  The Lord who rejoices over Zion with singing takes the same joy in His disciples now. Verse 17 has been read beside His words, “that my joy might remain in you, and that your joy might be full” ([[John 15:11]]): those who keep His commandments abide in His love, and He gives them His joy so that theirs is full ([[John 15:10]]).

