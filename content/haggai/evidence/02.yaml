chapter: 2
claims:
  - where: 'when'
    claim: 'Haggai’s prophecy was spoken about 520 B.C.'
    key: 'bd-haggai'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haggai?lang=eng'
    quote: 'A prophet in Jerusalem soon after the return from the Exile (Ezra 5:1; 6:14). His prophecy was spoken about 520 B.C.'
  - where: 'setting'
    claim: 'Haggai’s ministry as dated in the book ran about three and a half months, ending in early December 520 B.C.'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'Haggai prophesied in Jerusalem for only three and one-half months—beginning in late August and ending in early December of 520 B.C.'
  - where: 'setting'
    claim: 'The message of 2:10 came three months after the building was resumed and about two months after the message of 2:1'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'On the 24th day of the ninth month of the same year, that is to say, exactly three months after the congregation had resumed the building of the temple (cf. Haggai 1:15), and about two months after the second prophecy (Haggai 2:1)'
  - where: 'setting'
    claim: 'In chapter 2 Haggai consoles those distressed by the temple’s plain appearance and warns that the people’s worldly spirit had brought a curse'
    key: 'bd-haggai'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haggai?lang=eng'
    quote: 'In Hag. 2 he consoles those who were distressed by the mean appearance of the temple in comparison with its former beauty … But he warns them that just as the touch of the unclean pollutes all about it, so the worldly spirit of the people had brought a curse'
  - where: 'setting'
    claim: 'The temple was finished in 515 BC'
    key: 'scripture-helps-hag-1-2'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'The people obeyed the word of the Lord and completed the temple in 515 BC.'
  - where: 'setting'
    claim: 'The temple was finished in the sixth year of Darius'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/6?lang=eng'
    quote: 'And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king.'
  - where: 'setting'
    claim: 'The Bible Dictionary dates the dedication to 516 B.C.'
    key: 'bd-temple-of-zerubbabel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'in the sixth year of Darius (516 B.C.) the feast of the dedication was kept (Ezra 6:15–16).'
  - where: 'setting'
    claim: 'Hebrews 12:26 quotes Haggai 2:6'
    key: 'breitenstein-haggai-minute'
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'This portion of the book of Haggai is quoted in the New Testament: “Whose voice then shook the earth: but now he hath promised, saying, Yet once more I shake not the earth only, but also heaven” (Hebrews 12:26).'
  - where: 'setting'
    claim: 'Matthew includes Zerubbabel in the Savior’s genealogy'
    key: 'scripture-helps-hag-1-2'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'In the New Testament, Matthew includes Zerubbabel in the Savior’s genealogy, linking both Zerubbabel and Jesus Christ to the royal line of David.'
  - where: 'thread'
    claim: 'From the twenty-fourth day of the ninth month the Lord would bless again, and the seed was not yet in the barn'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'From this day, i.e., from the twenty-fourth day of the ninth month, Jehovah will bless again, i.e., grant a blessing, namely, so that fruitful seasons will come again, and fields and fruit-trees bear once more.'
  - where: 'section 2 plain'
    claim: 'Verse 15 looks back to the time before stone was laid on stone'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'Here it is used not in the sense of forwards into the future, but, as the explanatory clause which follows (from before, etc.) clearly shows, in that of backwards into the past.'
  - where: 'note 2:1 “The last day of the harvest feast”'
    claim: 'The twenty-first day of the seventh month was the seventh day of the feast of tabernacles, the festival of the ingathering'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'The twenty-first day of the seventh month was the seventh day of the feast of tabernacles (cf. Leviticus 23:34.), the great festival of rejoicing'
  - where: 'note 2:1 “The last day of the harvest feast”'
    claim: 'The feast gave thanks for the ingathering of the fruits; its return after a miserable harvest called up the difference between past and present'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'The return of this festal celebration, especially after a harvest which had turned out very miserably, and showed no signs of the blessing of God, could not fail to call up vividly before the mind the difference between the former times'
  - where: 'note 2:1 “The last day of the harvest feast”'
    claim: 'The temple would be only a miserable hut; consolation was needed so that zeal would not cool'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'In this gloomy state of mind consolation was very necessary, if the hardly awakened zeal for the building of the house of God was not to cool down and vanish entirely away.'
  - where: 'note 2:1 “The last day of the harvest feast”'
    claim: 'The feast gave thanks for the ingathering of all the fruits, ending with the orchard fruits and the vintage'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'as well as for the blessing of the ingathering of all the fruits of the ground, which ended with the gathering of the orchard-fruits and with the vintage'
  - where: 'thread'
    claim: 'Uncleanness is more easily transmitted than holiness'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'Thus, uncleanness is much more easily transmitted than holiness.'
  - where: 'note 2:3 “Why the new house seemed as nothing”'
    claim: 'The footnote at 2:7 gives Exodus 40:34'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'Haggai speaks about the Messiah—The Desire of All Nations will come—The Lord will give peace in His temple.'
  - where: 'note 2:3 “Why the new house seemed as nothing”'
    claim: 'Jewish tradition holds that Haggai saw Solomon’s temple; if so he was old'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'Jewish tradition suggests that Haggai saw the temple of Solomon before its destruction in 586 B.C. and was among the captives taken to Babylon.'
  - where: 'note 2:3 “Why the new house seemed as nothing”'
    claim: 'Haggai seems to have personally remembered Solomon’s temple'
    key: 'breitenstein-haggai-minute'
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'According to verse 3, Haggai seems to have personally remembered the glorious temple that Solomon built, which was destroyed in 586 BC.'
  - where: 'note 2:3 “Why the new house seemed as nothing”'
    claim: 'The old men who had seen the first house wept when the foundation was laid'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'who were ancient men, that had seen the first house, when the foundation of this house was laid before their eyes, wept with a loud voice'
  - where: 'note 2:3 “Why the new house seemed as nothing”'
    claim: 'The Jews reckoned the second temple inferior in five points, beginning with the ark and the Shechinah'
    key: 'bd-temple-of-zerubbabel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'The Jews reckoned the temple of Zerubbabel to be in five points inferior to the temple of Solomon: in the absence of (1) the Ark of the Covenant … (2) the Shechinah or manifestation of the glory of the Lord; (3) the Urim and the Thummim'
  - where: 'note 2:3 “Why the new house seemed as nothing”'
    claim: 'The last two of the five: the holy fire and the spirit of prophecy'
    key: 'bd-temple-of-zerubbabel'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: '(4) the holy fire upon the altar; (5) the spirit of prophecy.'
  - where: 'note 2:3 “Why the new house seemed as nothing”'
    claim: 'The second temple was not as beautiful and ornate as Solomon’s'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'It is apparent from the Lord’s question, “Is it not in your eyes in comparison of it as nothing?” that the second temple was not as beautiful and ornate as Solomon’s temple (Haggai 2:3).'
  - where: 'note 2:5 “The covenant from Egypt still stands”'
    claim: 'The Lord would be with them in their labors as He was with Israel in the exodus'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'Nevertheless, the Lord counseled the Jews to “be strong” and “work,” with the assurance that He would be with them in their labors, as He was with the Israelites in their exodus from Egypt (see Haggai 2:4–5).'
  - where: 'note 2:5 “The covenant from Egypt still stands”'
    claim: 'Haggai likened the returning exiles to Israel led out of Egypt'
    key: 'vandyke-ogden-twelve'
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Haggai likened the returning exiles to ancient Israelites being led out of bondage from Egypt and prophesied similar deliverance as they worked to build the second temple'
  - where: 'note 2:5 “The covenant from Egypt still stands”'
    claim: 'The people feared they could not afford to build like Solomon; the Lord told them to throw off their fears'
    key: 'breitenstein-haggai-minute'
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'Apparently, the people were making comparisons and thinking that because of the drought and other reasons, they could not afford to build such a magnificent structure as Solomon had built.'
  - where: 'note 2:6 “Yet once: the shaking in Hebrews”'
    claim: 'The Septuagint reads “Yet once I will shake,” without “it is a little while”'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/haggai/2.htm'
    quote: 'For thus saith the Lord Almighty; Yet once I will shake the heaven, and the earth, and the sea, and the dry land;'
  - where: 'note 2:6 “Yet once: the shaking in Hebrews”'
    claim: 'Hebrews 12:26 quotes the verse'
    key: 'breitenstein-haggai-minute'
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'This portion of the book of Haggai is quoted in the New Testament'
  - where: 'note 2:6 “Yet once: the shaking in Hebrews”'
    claim: 'Verse 6 refers to the Lord’s coming day of judgment'
    key: 'breitenstein-haggai-minute'
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'In verse 6, the Lord is referring to His coming day of judgment at the Millennium.'
  - where: 'note 2:6 “Yet once: the shaking in Hebrews”'
    claim: 'Hebrews 12:26 reads “Yet once more”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'Whose voice then shook the earth: but now he hath promised, saying, Yet once more I shake not the earth only, but also heaven.'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'The chapter heading reads 2:7 of the Messiah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'Haggai speaks about the Messiah—The Desire of All Nations will come—The Lord will give peace in His temple.'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'The title can refer to the Savior; Holland’s statement'
    key: 'scripture-helps-hag-1-2'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'This title can refer to the Savior Jesus Christ. … His answer to the prayers of the people—Christ, the Desire of All Nations—shall come.'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'The prophecy likely has multiple fulfillments, including all temples'
    key: 'scripture-helps-hag-1-2'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'likely has multiple fulfillments. It could refer to the Savior’s visits to the temple during His mortal ministry as well as to His return to the temple in Jerusalem at His Second Coming. In a broader sense, all temples are the house of the Lord'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'The desire of all nations is Jesus Christ; the prophecy is probably dualistic'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'The “desire of all nations” is the Holy One of Israel—even Jesus Christ. The Messiah would eventually come to His holy temple in Jerusalem. Haggai’s prophecy in verses 6 and 7 is probably dualistic'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'The verb “shall come” is plural'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'morph="HC/Vqp3cp" id="37Lsp">וּ/בָ֖אוּ'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'ḥemdat is a feminine singular noun in construct'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'morph="HNcfsc" id="37SAE">חֶמְדַּ֣ת'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'BDB: ḥemdâ is desire, delight; at Haggai 2:7 the desirable, precious things of all nations'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2532.htm'
    quote: 'compare כלהֿגוים ׳ובאו ח Haggai 2:7 (i.e. the desirable, precious things of all nations)'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'ESV reads “the treasures of all nations shall come in”'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Haggai+2%3A6-9&version=ESV'
    quote: 'And I will shake all nations, so that the treasures of all nations shall come in, and (C)I will fill this house with glory'
  - where: 'note 2:7 “The desire of all nations”'
    claim: 'BDB defines ḥemdâ as desire, delight'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/2532.htm'
    quote: 'desire, delight'
  - where: 'note 2:9 “How the latter house was greater”'
    claim: 'The Lord’s personal visits would glorify the second temple beyond Solomon’s'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'because the Lord’s anticipated personal visits to the temple would glorify the current edifice beyond that of Solomon’s temple (Haggai 2:9).'
  - where: 'note 2:9 “How the latter house was greater”'
    claim: 'Herod remodeled the rebuilt temple; the Lord visited it in His ministry (Mark 14:49)'
    key: 'breitenstein-haggai-minute'
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'Herod the Great began remodeling the rebuilt temple in 20 BC. … In addition to that, the Lord of Glory Himself personally visited that temple during His mortal ministry.'
  - where: 'note 2:9 “How the latter house was greater”'
    claim: 'Mark 14:49'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/14?lang=eng'
    quote: 'I was daily with you in the temple teaching, and ye took me not: but the scriptures must be fulfilled.'
  - where: 'note 2:9 “How the latter house was greater”'
    claim: 'Scripture Helps extends the promise to the Second Coming and to all temples, where His presence is felt'
    key: 'scripture-helps-hag-1-2'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'In a broader sense, all temples are the house of the Lord, where we can feel His presence.'
  - where: 'note 2:9 “How the latter house was greater”'
    claim: 'The Student Manual reads the prophecy of the latter-day temple on the same site'
    key: 'ot-manual-30'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-30?lang=eng'
    quote: 'This prophecy will be fulfilled in the latter-day temple that will be built on the same site.'
  - where: 'note 2:9 “How the latter house was greater”'
    claim: 'Huntington sets the Kirtland dedicatory prayer beside the promise: glory in all dedicated temples'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'In a broader sense, all dedicated temples of the Lord are sacred edifices in which God’s Spirit and glory reside.'
  - where: 'note 2:9 “How the latter house was greater”'
    claim: 'D&C 109:12'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng'
    quote: 'That thy glory may rest down upon thy people, and upon this thy house, which we now dedicate to thee'
  - where: 'note 2:12 “Holiness does not spread; uncleanness does”'
    claim: 'The garment made holy by the flesh could not transmit holiness further; uncleanness passes by touch; uncleanness is more easily transmitted'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'however, the garment itself could not transmit that holiness to a third or fourth object. Moreover, anything touched by an unclean individual would become unclean (see Numbers 19:11–13, 22). Thus, uncleanness is much more easily transmitted than holiness.'
  - where: 'note 2:12 “Holiness does not spread; uncleanness does”'
    claim: 'Leviticus 6:27, the touch of the holy flesh'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/6?lang=eng'
    quote: 'Whatsoever shall touch the flesh thereof shall be holy'
  - where: 'note 2:12 “Holiness does not spread; uncleanness does”'
    claim: 'Numbers 19:11, uncleanness from a corpse lasts seven days'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'He that toucheth the dead body of any man shall be unclean seven days.'
  - where: 'note 2:14 “So is this people”'
    claim: 'The worldly spirit of the people brought a curse on their labor, as the touch of the unclean pollutes'
    key: 'bd-haggai'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haggai?lang=eng'
    quote: 'just as the touch of the unclean pollutes all about it, so the worldly spirit of the people had brought a curse on all their labor and increase.'
  - where: 'note 2:14 “So is this people”'
    claim: 'The sacrifices on the rebuilt altar could not make them holy, nor could the land'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'Haggai may have been alluding to the fact that the Jews’ sacrifices and offerings on the rebuilt altar of the temple could not transmit holiness to them nor absolve them of their failure to continue rebuilding the temple.'
  - where: 'note 2:14 “So is this people”'
    claim: 'The promised land alone could not make them holy'
    key: 'huntington-consider-ways'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'even though the Jews had returned to a promised land consecrated by the Lord, that fact alone could not make them a holy people.'
  - where: 'note 2:14 “So is this people”'
    claim: 'The exiles had daily sacrifice at the rebuilt altar while there was no temple'
    key: 'vandyke-ogden-twelve'
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'while there was no temple, they did enjoy daily sacrifice at the altar they had rebuilt (see Ezra 3:2–3).'
  - where: 'note 2:14 “So is this people”'
    claim: 'Van Dyke and Ogden read the exiles’ view of the inhabitants as unclean into 2:12–14'
    key: 'vandyke-ogden-twelve'
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The exiles looked upon the inhabitants as ritually unclean (see Haggai 2:12–14)'
  - where: 'note 2:15 “Looking back, then forward”'
    claim: '“Upward” is literally upwards, here backwards into the past'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'נמעלה, lit., upwards, then further on. Here it is used not in the sense of forwards into the future, but, as the explanatory clause which follows (from before, etc.) clearly shows, in that of backwards into the past.'
  - where: 'note 2:15 “Looking back, then forward”'
    claim: 'ESV reads “from this day onward” in 2:15 and 2:18'
    key: 'esv'
    url: 'https://www.biblegateway.com/passage/?search=Haggai+2%3A15-19&version=ESV'
    quote: '15 Now then, (A)consider from this day onward. Before stone was placed upon stone in the temple of the Lord, 16 how did you fare?'
  - where: 'note 2:15 “Looking back, then forward”'
    claim: 'The foundation of 2:18 is the foundation laid under Cyrus; Haggai looks again at the time without blessing from then to his own day'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'directs another look at the past, and that from the time of the laying of the foundation of the temple in the reign of Cyrus to his own time, and reminds them once more of the want of blessing'
  - where: 'note 2:15 “Looking back, then forward”'
    claim: 'The ninth month is mid-November to mid-December, when sowing was finished and the early rain had set in'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'The ninth month (Khislēv) corresponds very nearly to the period between the middle of November and the middle of December, when the sowing of the winter corps, that commenced after the feast of tabernacles, was finished'
  - where: 'note 2:15 “Looking back, then forward”'
    claim: 'The seed is not in the granary because the poor harvest was eaten or sown'
    key: 'keil-haggai'
    url: 'https://biblehub.com/commentaries/kad/haggai/2.htm'
    quote: 'because the miserable produce of the harvest was already either consumed for the supply of their daily wants, or used up for the sowing which was just ended.'
  - where: 'note 2:15 “Looking back, then forward”'
    claim: 'The blessings would not come immediately; a new era was beginning'
    key: 'breitenstein-haggai-minute'
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'Those blessings perhaps would not come immediately (“the seed [is not] yet in the barn” [verse 19]). The people would have to prove themselves. However, it was as if a new era were beginning'
  - where: 'note 2:23 “Zerubbabel the signet, and David’s line”'
    claim: 'Psalm 89:3, “my chosen … David my servant”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'I have made a covenant with my chosen, I have sworn unto David my servant,'
  - where: 'note 2:23 “Zerubbabel the signet, and David’s line”'
    claim: 'Daniel 2:44, the kingdom that breaks the kingdoms'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'the God of heaven set up a kingdom, which shall never be destroyed'
  - where: 'note 2:23 “Zerubbabel the signet, and David’s line”'
