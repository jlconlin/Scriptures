chapter: 1
claims:
  # ---- when / setting ----
  - where: 'when'
    claim: 'Haggai prophesied in Jerusalem about 520 B.C.'
    key: bd-haggai
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haggai?lang=eng'
    quote: 'A prophet in Jerusalem soon after the return from the Exile (Ezra 5:1; 6:14). His prophecy was spoken about 520 B.C.'
  - where: 'when'
    claim: 'The second year of Darius is probably 520 B.C.; Darius Hystaspes reigned 521–486'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: '1a “the second year”: Probably 520 B.C. Darius Hystaspes reigned 521–486 B.C.'
  - where: 'when'
    claim: 'The Darius of Haggai is the first of the name, Darius Hystaspes'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'referred to is the king of Persia (Ezra 4:5, Ezra 4:24), the first of that name, i.e., Darius Hystaspes, who reigned from 521 to 486 b.c.'
  - where: 'setting'
    claim: 'Haggai was a prophet in Jerusalem after the return, named in Ezra 5:1 and 6:14'
    key: bd-haggai
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haggai?lang=eng'
    quote: 'A prophet in Jerusalem soon after the return from the Exile (Ezra 5:1; 6:14).'
  - where: 'setting'
    claim: 'Little is known of Haggai’s life'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'we know little about his birthplace, family background, personal life, or the events surrounding his prophetic calling.'
  - where: 'setting'
    claim: 'The name Haggai probably means “festal”; his dated ministry spans three and a half months, late August to early December 520 B.C.'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'The name Haggai probably means “festal” or “feast” … Haggai prophesied in Jerusalem for only three and one-half months—beginning in late August and ending in early December of 520 B.C.'
  - where: 'setting'
    claim: 'Dated to 520 B.C., about 18 years after Cyrus let the exiles return; the work stopped because of Samaritan opposition and loss of enthusiasm'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'His prophecies are dated to 520 BC, about 18 years after King Cyrus of Persia allowed the exiled Jews to return and rebuild their city and temple. … because of opposition from the Samaritans and their own loss of enthusiasm, they stopped working on the temple'
  - where: 'setting'
    claim: 'The returnees rebuilt the altar and parts of the foundation by 536 B.C.'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'For the next two years, the returnees labored on the temple, and by 536 B.C. had rebuilt the altar of sacrifice and parts of the foundation (see Ezra 3:3–11).'
  - where: 'setting'
    claim: 'His preaching produced the desired effect'
    key: bd-haggai
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/haggai?lang=eng'
    quote: 'His preaching produced the desired effect (1:14–15).'
  - where: 'setting'
    claim: 'Haggai’s ministry is an exception among prophets who went unheeded'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'Although many of the Old Testament prophets’ messages and exhortations went unheeded by the ancient house of Israel, Haggai’s ministry appears to be an exception.'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: '“Ceiled” means paneled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: '4a “ceiled”: HEB paneled.'
  - where: 'section 3 plain'
    claim: '“Corn” is grain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: '11b “corn”: OR grain.'
  - where: 'section 3 plain'
    claim: '“I did blow upon it” means the Lord made the harvest fly away'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'I blew into it, i.e., I caused it to fly away, like chaff before the wind, so that there was soon none of it left.'

  # ---- notes ----
  - where: 'note 1:1 “The governor and the high priest”'
    claim: 'Zerubbabel was born in Babylon, grandson of Jehoiachin, son of Pedaiah in Chronicles, called son of Shealtiel as nephew or legal heir; governor as representative of the royal house'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'Born in Babylon (the name is Assyrian). Grandson of Jehoiachin, king of Judah, and son of Pedaiah (1 Chr. 3:16–19); in Ezra 3:2 and elsewhere he is called “son of Shealtiel,” probably his nephew or legal heir.'
  - where: 'note 1:1 “The governor and the high priest”'
    claim: 'Zerubbabel was governor as the representative of the royal house'
    key: bd-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zerubbabel?lang=eng'
    quote: 'Zerubbabel was appointed pekhah or governor, as the representative of the Jewish royal house (Ezra 1:8).'
  - where: 'note 1:1 “The governor and the high priest”'
    claim: 'Joshua descended from Josedech (Jehozadak), the last high priest before the captivity'
    key: scripture-helps-hag-1-2
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng'
    quote: 'He was a descendant of Josedech (sometimes spelled Jehozadak), the last high priest before the Babylonian captivity.'
  - where: 'note 1:1 “The governor and the high priest”'
    claim: 'Joshua is called Jeshua elsewhere; both came with the first returning exiles and led the rebuilding; the high priest was the chief ecclesiastical authority'
    key: breitenstein-haggai-minute
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'Joshua (often seen as “Jeshua” in the scriptures) was also a part of that group. Both Zerubbabel and Joshua led the effort to rebuild the ruined temple.'
  - where: 'note 1:1 “The governor and the high priest”'
    claim: 'Joshua was the high priest, the supreme ecclesiastical authority'
    key: breitenstein-haggai-minute
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'he was governor of Judah; Joshua was the high priest (supreme ecclesiastical authority) in Jerusalem.'
  - where: 'note 1:1 “The governor and the high priest”'
    claim: 'Jehozadak went into captivity; Pedaiah is Shealtiel’s brother in 1 Chronicles 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: 'And the sons of Jeconiah; Assir, Salathiel his son, Malchiram also, and Pedaiah'

  - where: 'note 1:2 “The LORD of hosts”'
    claim: 'The Lord of Sabaoth (hosts) is a title of Jehovah; the hosts are Israel’s armies and the angelic armies of heaven'
    key: bd-sabaoth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabaoth?lang=eng'
    quote: 'Hosts. The Lord of Sabaoth was a title of Jehovah; the hosts were the armies of Israel (1 Sam. 17:45) but also included the angelic armies of heaven'
  - where: 'note 1:2 “The LORD of hosts”'
    claim: 'The title is often rendered “Lord of the Angel Armies”'
    key: breitenstein-haggai-minute
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'This name is often rendered “Lord of the Angel Armies,” referring to God’s angelic armies in heaven.'
  - where: 'note 1:2 “The LORD of hosts”'
    claim: 'The Hebrew is YHWH ṣĕbāʾôt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'צְבָא֖וֹת'

  - where: 'note 1:2 “Not yet the time”'
    claim: 'After nearly two decades the exiles were content with daily sacrifice at the rebuilt altar'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'After nearly two decades of living near the destroyed temple complex, it apparently grew easier and easier for the returned exiles to be satisfied that, while there was no temple, they did enjoy daily sacrifice at the altar they had rebuilt'
  - where: 'note 1:2 “Not yet the time”'
    claim: 'The people rationalized that it was not the time; they had other work they thought more important'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'In fact, they rationalized it was not the time to rebuild the temple. Clearly, they had other work they felt was more important.'

  - where: 'note 1:4 “Paneled houses”'
    claim: 'The Hebrew verb means to cover or panel; Haggai’s phrase is “in your panelled houses”; the verb is used of Solomon’s hall and Jehoiakim’s palace, and, with a query, of the temple (1 Kgs 6:9)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5603.htm'
    quote: 'verb cover, cover in, panel … 1 Kings 6:9 and he covered in the house with beams (?); … Jeremiah 22:14 … panelling (it) with cedar; Passive participle סָפוּן בְּאֶרֶז 1 Kings 7:7 … in your panelled houses.'
  - where: 'note 1:4 “Paneled houses”'
    claim: 'The word in Haggai 1:4 is sĕpûnîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'סְפוּנִ֑ים'
  - where: 'note 1:4 “Paneled houses”'
    claim: '“Cieled houses” may mean costly cedar paneling of the wealthy; the Lord was displeased that they beautified their homes while neglecting His'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'The phrase “cieled houses” may refer to the costly cedar paneling many of the wealthy were using to decorate the interior of their homes. It is certainly understandable why the Lord would be displeased with their efforts to beautify their homes while neglecting His house.'
  - where: 'note 1:4 “Paneled houses”'
    claim: 'They preferred the profane over the sacred'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'their efforts to beautify their homes while failing to rebuild the Lord’s house clearly demonstrated that they preferred the profane over the sacred'

  - where: 'note 1:5 “Set your heart upon your ways”'
    claim: 'The Hebrew of 1:5 is śîmû lĕbabkem ʿal-darkêkem, “set your heart upon your ways”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'לְבַבְ/כֶ֖ם'
  - where: 'note 1:5 “Set your heart upon your ways”'
    claim: 'The same verb and “your heart” return in 2:15 and 2:18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'לְבַבְ/כֶֽם'
  - where: 'note 1:5 “Set your heart upon your ways”'
    claim: 'The verb means “to attend to”; Haggai asks the people to assess their neglect of the temple'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'The word consider is translated from the Hebrew word soom, which means “to attend to” … the prophet was asking the Jews to carefully “attend to,” or carefully “assess,” their neglect of the temple'

  - where: 'note 1:6 “Sowing much and bringing in little”'
    claim: 'The footnotes at 1:6 and 1:10 point to Deut. 28:38, Micah 6:15 and Deut. 28:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: '6a “sown”: Deut. 28:38 (38–40); Micah 6:15. … 10a “fruit”: Deut. 28:18.'
  - where: 'note 1:6 “Sowing much and bringing in little”'
    claim: 'Even the little reaped lacked God’s blessing; the verse covers the harvests of many years'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'applies, according to Haggai 2:15-17, to the harvests of many years, which had turned out very badly. … even in their use of the little that had been reaped, the blessing of God was wanting'
  - where: 'note 1:6 “Sowing much and bringing in little”'
    claim: 'Wages vanished as if put in a bag full of holes'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'the ages which the day-labourer earned vanished just as rapidly as if it had been placed in a bag full of holes (cf. Leviticus 26:26; Hosea 4:10; Micah 6:14).'

  - where: 'note 1:8 “Kirtland’s unbuilt house”'
    claim: 'D&C 95 was given at Kirtland, June 1, 1833, continuing the command of D&C 88:119 to build the house of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/95?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet, at Kirtland, Ohio, June 1, 1833. This revelation is a continuation of divine directions to build a house for worship and instruction, the house of the Lord (see section 88:119–36).'
  - where: 'note 1:8 “Kirtland’s unbuilt house”'
    claim: 'The footnote at 1:8 points to D&C 88:119 and 95:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: '8a “house”: Ezra 6:3; D&C 88:119; 95:3.'
  - where: 'note 1:8 “Kirtland’s unbuilt house”'
    claim: 'The early Latter-day Saints faced a situation like Haggai’s (D&C 95)'
    key: cfm-ot-2026-50
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/50?lang=eng'
    quote: 'The early Latter-day Saints faced a similar situation to the Israelites in Haggai’s day (see Doctrine and Covenants 95).'

  - where: 'note 1:9 “Blown away”'
    claim: 'The Lord blew the harvest away like chaff; a double curse as in 1:6'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'I caused it to fly away, like chaff before the wind, so that there was soon none of it left. Here is a double curse, therefore, as in Haggai 1:6 : instead of much, but little was reaped, and the little that was brought home melted away without doing any good.'
  - where: 'note 1:9 “Blown away”'
    claim: '“Saith the LORD of hosts” stands between the question and the answer so the answer is taken as God’s declaration'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'he inserts once more, between the question and the answer, the words "is the saying of Jehovah of hosts," that the answer may not be mistaken for a subjective view, but laid to heart as a declaration of the God who rules the world.'

  - where: 'note 1:11 “A waste house, a wasted land”'
    claim: 'The words for “waste” and “drought” share the root ḥ-r-b, probably not a coincidence; deficiency in building brought deficiency in the land'
    key: breitenstein-haggai-minute
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'the words for “waste” and “drought” are similar: the Hebrew root for both words is hrb. That is probably not a coincidence. … Because there was a deficiency in the effort by the people to rebuild the temple, the Lord had caused a deficiency, or drought, in the land.'
  - where: 'note 1:11 “A waste house, a wasted land”'
    claim: 'Waste in 1:4 and 1:9 is ḥārēb; drought in 1:11 is ḥōreb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'חֹ֜רֶב'
  - where: 'note 1:11 “A waste house, a wasted land”'
    claim: 'ḥārēb means waste, desolate'
    key: bdb
    url: 'https://biblehub.com/hebrew/2720.htm'
    quote: 'II. חָרֵב adjective waste, desolate'
  - where: 'note 1:11 “A waste house, a wasted land”'
    claim: 'ḥōreb means drought in Haggai 1:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/2721.htm'
    quote: '2 drought Haggai 1:11 + Deuteronomy 28:22 see above'

  - where: 'note 1:12 “The remnant obeys”'
    claim: 'The remnant of the people is the portion that returned from exile; their fear presupposes they saw their sin and the drought as judgment'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'The "remnant of the people," as in Zechariah 8:6, is that portion of the nation which had returned from exile as a small gleaning of the nation, which had once been much larger.'
  - where: 'note 1:12 “The remnant obeys”'
    claim: 'Their fear presupposes they saw their sin and discerned the drought as judgment'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'Their fearing before Jehovah presupposes that they saw their sin against God, and discerned in the drought a judgment from God.'
  - where: 'note 1:12 “The remnant obeys”'
    claim: 'Close to fifty thousand exiles came home under Zerubbabel'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'According to the Book of Ezra, under the leadership of Zerubbabel (see Ezra 2), close to fifty thousand exiles made the long journey home to Jerusalem.'

  - where: 'note 1:13 “The LORD’s messenger and his message”'
    claim: 'The Hebrew of 1:13 has malʾak YHWH, bĕmalʾăkût YHWH, and ʾănî ʾittĕkem'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'בְּ/מַלְאֲכ֥וּת'
  - where: 'note 1:13 “The LORD’s messenger and his message”'
    claim: 'Malʾāk means a messenger, one sent with a message'
    key: bdb
    url: 'https://biblehub.com/hebrew/4397.htm'
    quote: 'noun masculine messenger; … 1 messenger, … a. one sent with a message'
  - where: 'note 1:13 “The LORD’s messenger and his message”'
    claim: '“I am with you” can be read in two equally important ways: divine help to the builders and, more broadly, blessings of the temple'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'can be understood in two equally important ways. The first is the Lord’s promise to render divine help and strength to those involved in rebuilding the temple in Haggai’s day. The second, and the broader of the two meanings, is the Lord’s promise that He will be with us through the bestowal of profound blessings that come from faithful temple attendance'

  - where: 'note 1:14 “Stirred up, as Cyrus had been”'
    claim: 'To stir up a spirit is to make one willing and glad; compare Ezra 1:1, 5'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'העיר רוּח, to awaken the spirit of any man, i.e., to make him willing and glad to carry out His resolutions (compare 1 Chronicles 5:26; 2 Chronicles 21:16; Ezra 1:1, Ezra 1:5).'
  - where: 'note 1:14 “Stirred up, as Cyrus had been”'
    claim: 'The work began twenty-three days after the first message; the interval was spent in counsel and preparation; 1:15 belongs to 1:14'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'that is to say, twenty-three days after Haggai had first addressed his challenge to them. The interval had been spent in deliberation and counsel, and in preparations for carrying out the work.'
  - where: 'note 1:14 “Stirred up, as Cyrus had been”'
    claim: 'The verb in 1:14 is wayyāʿar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'וַ/יָּ֣עַר'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Lord met the people’s penitence with the promise of help to turn it into deed'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'This penitential state of mind on the part of the people and their rulers was met by the Lord with the promise of His assistance, in order to elevate this disposition into determination and deed.'
  - where: 'christ'
    claim: 'Elder Bednar repeated “Consider your ways” in 2022'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'I repeat the admonition of the Lord to His people delivered through the Old Testament prophet Haggai: “Now therefore thus saith the Lord of hosts; Consider your ways.”'
  - where: 'christ'
    claim: 'Each should evaluate temporal and spiritual priorities; the Holy Ghost helps us see ourselves'
    key: bednar-put-on-strength
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/46bednar?lang=eng'
    quote: 'Each of us should evaluate our temporal and spiritual priorities sincerely and prayerfully to identify the things in our lives that may impede the bounteous blessings that Heavenly Father and the Savior are willing to bestow upon us.'
