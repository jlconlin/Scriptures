page: shall-it-be-holy
claims:
  - where: 'section “What their own things could not do”'
    claim: 'The rebuilt altar’s sacrifices could not transmit holiness to the Jews (Huntington’s reading, “may have been alluding”)'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'the Jews’ sacrifices and offerings on the rebuilt altar of the temple could not transmit holiness to them'
  - where: 'section “What their own things could not do”'
    claim: 'Hag. 2:14 “every work of their hands” (H4639 + H3027 in 2:14, 2:17); 1:11’s “labour of the hands” is a different Hebrew phrase (yĕgîaʿ kappayim)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'מַעֲשֵׂ֣ה'
  - where: 'section “What their own things could not do”'
    claim: 'Hag. 1:11 “labour” is yĕgîaʿ (H3018), a different word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'יְגִ֥יעַ'
  - where: 'section “What their own things could not do”'
    claim: 'Connection made by this page: the works called unclean in Hag. 2:14 set beside the works smitten in 2:17, the same Hebrew phrase maʿăśēh yādayim (1:11 uses a different one)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'every work of their hands; and that which they offer there is unclean'
  - where: 'section “What their own things could not do”'
    claim: 'Connection made by this page: (second half): Hag. 2:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'I smote you with blasting and with mildew and with hail in all the labours of your hands'
  - where: 'section “Before a stone was laid”'
    claim: 'Keil on 1:13–14: the promise fulfilled by giving a willingness to work'
    key: keil-haggai
    url: 'https://biblehub.com/commentaries/kad/haggai/1.htm'
    quote: 'This promise Jehovah fulfilled, first of all by giving to Zerubbabel, Joshua, and the people, a willingness to carry out the work.'
  - where: 'section “Before a stone was laid”'
    claim: 'The Minute on 1:12–15: stirred by the Lord’s spirit, and they obeyed'
    key: breitenstein-haggai-minute
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'the people and Zerubbabel and Joshua were “stirred” by the spirit of the Lord and the message that Haggai delivered— and they obeyed.'
  - where: 'section “Before a stone was laid”'
    claim: 'Connection made by this page: (b): the Lord’s “I am with you” at 1:13 stands before the work at 1:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: 'Then spake Haggai the LORD’s messenger in the LORD’s message unto the people, saying, I am with you, saith the LORD.'
  - where: 'section “Before a stone was laid”'
    claim: 'Connection made by this page: (b), second half: 1:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: 'and they came and did work in the house of the LORD of hosts, their God'
  - where: 'section “His Spirit standing, His glory coming”'
    claim: '“Remaineth” in 2:5 is the participle ʿōmedet (H5975), “standing”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'עֹמֶ֣דֶת'
  - where: 'section “His Spirit standing, His glory coming”'
    claim: 'Huntington on 2:7: the Lord Himself would visit the temple and fill it with His glory'
    key: huntington-consider-ways
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/consider-your-ways'
    quote: 'Jehovah Himself would personally visit the temple and fill it with His glory'
  - where: 'section “From this day”'
    claim: 'The Student Manual joins the uncleanness, repentance and work, and the promise of blessing'
    key: ot-manual-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-30?lang=eng'
    quote: 'The uncleanness was the reason the land was so unproductive (see Haggai 2:15–17), but when the Jews had repented and begun the work on the temple (see v. 18), the curse was to be lifted and the Lord promised His blessing (see v. 19).'
  - where: 'section “From this day”'
    claim: 'The Minute on 2:19: blessings might not come at once'
    key: breitenstein-haggai-minute
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-haggai-volume-2'
    quote: 'Those blessings perhaps would not come immediately (“the seed [is not] yet in the barn” [verse 19]). The people would have to prove themselves.'
  - where: 'section “From this day”'
    claim: 'Connection made by this page: (b), second half: the blessing at 2:19 stands before any harvest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'Is the seed yet in the barn? yea, as yet the vine, and the fig tree, and the pomegranate, and the olive tree, hath not brought forth: from this day will I bless you.'
  - where: 'section “The Holy One who touches”'
    claim: 'Hebrews sets the ashes of the heifer beside the blood of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'the ashes of an heifer sprinkling the unclean, sanctifieth to the purifying of the flesh'
  - where: 'section “The Holy One who touches”'
    claim: 'Bible Dictionary: the rules of clean and unclean fulfilled by the Atonement'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'being fulfilled by the Atonement of Jesus Christ, they are no longer required of the believers.'
  - where: 'section “The Holy One who touches”'
    claim: 'Connection made by this page: the priests’ two rulings (Hag. 2:12–13) set beside Jesus touching the leper, the bier and the border of a garment, with the opposite result'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'And Jesus, moved with compassion, put forth his hand, and touched him, and saith unto him, I will; be thou clean.'
  - where: 'section “The Holy One who touches”'
    claim: 'Connection made by this page: (second): Luke 7:14–15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'And he came and touched the bier: and they that bare him stood still.'
  - where: 'section “The Holy One who touches”'
    claim: 'Connection made by this page: (third): Luke 8:44, the border of a garment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/8?lang=eng'
    quote: 'Came behind him, and touched the border of his garment: and immediately her issue of blood stanched.'
  - where: 'section “The Holy One who touches”'
    claim: 'Connection made by this page: (third, other side): Hag. 2:12, the skirt of the garment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng'
    quote: 'If one bear holy flesh in the skirt of his garment, and with his skirt do touch bread, or pottage, or wine, or oil, or any meat, shall it be holy? And the priests answered and said, No.'
  - where: 'section “The Holy One who touches”'
    claim: 'Lepers were considered to spread uncleanness; Jesus’ touch was remarkable'
    key: nt-student-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-mark/chapter-11?lang=eng'
    quote: 'were considered to spread their uncleanness to anyone who came in contact with them'
  - where: 'section “The Holy One who touches”'
    claim: 'Brown on Luke 7: the stain of ritual uncleanness does not adhere to Him'
    key: brown-testimony-luke
    url: 'https://scripturecentral.org/archive/books/book-chapter/luke-7'
    quote: 'Although His act of touching the dead brings ritual uncleanness upon Him, He sees the deeper need to bring relief and wholeness to the widow. Besides, as His actions show, the stain of ritual uncleanness does not adhere to Him as it does to others.'
  - where: 'section “The Holy One who touches”'
    claim: 'Brown on Luke 8: the woman is made clean by a touch of the holy'
    key: brown-testimony-luke
    url: 'https://scripturecentral.org/archive/books/book-chapter/luke-8'
    quote: 'she is made clean, as the prophet is, by a touch of the holy'
  - where: 'section “The Holy One who touches”'
    claim: 'The hem was a tassel at each “wing” or corner of the mantle'
    key: bd-hem-of-garment
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hem-of-garment?lang=eng'
    quote: 'It was really a tassel at each “wing” or corner of the tallith or mantle (Matt. 14:36).'
  - where: 'section “The Holy One who touches”'
    claim: 'The “borders” of Num. 15:38 and the “skirt” of Hag. 2:12 are the same Hebrew word kānāp (H3671)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hag.xml'
    quote: 'בִּכְנַף'
  - where: 'section “The Holy One who touches”'
    claim: 'Num. 15:38 fringes in the borders of garments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'that they make them fringes in the borders of their garments'
  - where: 'section “The Holy One who touches”'
    claim: 'Moroni: grace sufficient on the condition of denying ungodliness, then sanctified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/10?lang=eng'
    quote: 'then are ye sanctified in Christ by the grace of God'
  - where: 'section “Consider your ways”'
    claim: 'Seminary manual: attending the temple does not sanctify someone who is unworthy'
    key: ot-seminary-resource-haggai
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-resource-manual/the-book-of-haggai/haggai-1-2?lang=eng'
    quote: 'attending the temple does not sanctify someone who is unworthy'
  - where: 'section “Consider your ways”'
    claim: 'D&C 97:15–16: the house kept clean, then the Lord’s glory and presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'my glory shall rest upon it;'
  - where: 'section “Consider your ways”'
    claim: 'Schmeil: the Lord will magnify efforts as we consider our ways and make covenants'
    key: schmeil-consider-ways
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2026/10/48schmeil?lang=eng'
    quote: 'He will magnify our efforts as we consider our ways and make the proper adjustments to make and keep covenants with Him.'
