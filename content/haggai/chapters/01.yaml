chapter: 1
title: Consider Your Ways
tagline: Eighteen years after the return the Lord’s house still lies waste. Through Haggai He asks His people why they live in paneled houses, ties their failed harvests to His neglected house, and, when they obey, answers, “I am with you.”
when: 'Haggai spoke in Jerusalem in the second year of Darius I of Persia, 520 B.C.'

setting: |
  Haggai was “a prophet in Jerusalem soon after the return from the Exile,” named beside Zechariah in [[Ezra 5:1]] and [[Ezra 6:14]]. Little is known of “his birthplace, family background, personal life, or the events surrounding his prophetic calling.” His name probably means “festal” or “feast.”

  His four messages are dated to the day (1:1; 2:1; 2:10; 2:20). They fall in 520 B.C., “about 18 years after King Cyrus of Persia allowed the exiled Jews to return and rebuild their city and temple,” and span “only three and one-half months—beginning in late August and ending in early December.” Within two years of their return the exiles had rebuilt the altar and laid parts of the foundation ([[Ezra 3:3–11]]). Then they stopped, “because of opposition from the Samaritans and their own loss of enthusiasm,” and the work “ceased unto the second year of the reign of Darius king of Persia” ([[Ezra 4:24]]). Haggai himself speaks only of the people’s own excuse (1:2) and their own houses (1:4, 9). The return and the Persian kings are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  Where so many prophets went unheeded, Haggai’s ministry “appears to be an exception”: “His preaching produced the desired effect.” This chapter holds his first message and the people’s answer, and [[Hag. 2]] the other three. The house was finished “in the sixth year of the reign of Darius the king” ([[Ezra 6:15]]).

thread: |
  The chapter turns on two words, “time” and “house.” The people say the time has not come for the LORD’s house (verse 2). The Lord answers with their own word: is it time for them to live in their paneled houses while this house lies waste (verse 4)? Twice He tells them, “Consider your ways” (verses 5 and 7), and between the two He sets out the evidence: much sown and little gathered, food that does not fill, wages that leak away. Then He gives the reason in so many words: “Because of mine house that is waste, and ye run every man unto his own house” (verse 9).

  The last four verses are the turn. The governor, the high priest and the remnant obey the Lord and fear Him, and His whole reply is “I am with you” (verse 13). He stirs up their spirits, and they come and work (verse 14). What He promises those who obeyed comes in the next chapter: “my spirit remaineth among you: fear ye not” ([[Hag. 2:5]]), a house whose glory will be greater than the first ([[Hag. 2:9]]), and, from the day the foundation is laid, “from this day will I bless you” ([[Hag. 2:19]]).

sections:
  - range: 1-1
    heading: The word to the governor and the high priest
    plain: |
      On the first day of the sixth month, in the second year of King Darius, the word of the LORD came through the prophet Haggai to Zerubbabel son of Shealtiel, governor of Judah, and to Joshua son of Josedech, the high priest.
  - range: 2-4
    heading: “Is it time for you?”
    plain: |
      The LORD of hosts says: These people say the time has not yet come to build the LORD’s house. Then the word of the LORD came through Haggai: Is it time for you yourselves to live in your paneled houses while this house lies in ruins?
  - range: 5-11
    heading: “Consider your ways”
    plain: |
      So now the LORD of hosts says: Think carefully about how you are living. You have sown much and brought in little. You eat and are not satisfied, you drink and are not filled, you dress and are not warm, and the wage earner puts his wages into a purse full of holes. The LORD of hosts says: Think carefully about how you are living. Go up to the mountain, bring wood, and build the house, and I will take pleasure in it and be glorified, says the LORD. You looked for much, and it came to little; and I blew away what you brought home. Why? says the LORD of hosts. Because my house lies in ruins while each of you hurries off to his own house. That is why the sky has held back its dew and the earth its crops. I have called down a drought on the land and the hills, on the grain, the new wine and the oil, on all that the ground produces, on people and cattle, and on all the work of your hands.
  - range: 12-15
    heading: The people obey
    plain: |
      Then Zerubbabel son of Shealtiel, Joshua son of Josedech the high priest, and all the remnant of the people obeyed the voice of the LORD their God and the words of the prophet Haggai, as the LORD their God had sent him; and the people feared the LORD. Then Haggai, the LORD’s messenger, gave the people the LORD’s message: I am with you, says the LORD. And the LORD stirred up the spirit of Zerubbabel the governor, of Joshua the high priest, and of all the remnant of the people, and they came and began work on the house of the LORD of hosts, their God, on the twenty-fourth day of the sixth month, in the second year of King Darius.

notes:
  - ref: 1
    phrase: Zerubbabel the son of Shealtiel, governor of Judah, and to Joshua the son of Josedech, the high priest
    kind: history
    title: The governor and the high priest
    body: |
      Haggai’s first message goes to the two men at the head of the community, one from the royal line and one from the priestly. Zerubbabel was “born in Babylon,” a grandson of King Jehoiachin, and he was appointed governor as the representative of the Jewish royal house. Haggai calls him “son of Shealtiel,” as Ezra does ([[Ezra 3:2]]), but the genealogy in [[1 Chr. 3:17–19]] makes him a son of Pedaiah, Shealtiel’s brother. The likeliest explanation is that he was Shealtiel’s “nephew or legal heir.”

      Joshua, called Jeshua in Ezra, was the high priest, the “supreme ecclesiastical authority” in Jerusalem. He descended from Josedech, the last high priest before the exile, who “went into captivity, when the LORD carried away Judah and Jerusalem” ([[1 Chr. 6:15]]). Both men had come back with the first returning exiles ([[Ezra 2:2]]), and “both Zerubbabel and Joshua led the effort to rebuild the ruined temple.” Zerubbabel’s descent from David’s kings matters again at the end of the book, where the Lord makes him His signet ([[Hag. 2:23]]; see the note on [[Jer. 22:24]]).
    sources: [bd-zerubbabel, scripture-helps-hag-1-2, breitenstein-haggai-minute, lds-scriptures]

  - ref: 2
    phrase: the LORD of hosts
    kind: words
    title: The LORD of hosts
    body: |
      “The LORD of hosts” (*YHWH ṣĕbāʾôt*) is “a title of Jehovah,” and the hosts are armies: “the armies of Israel” but “also … the angelic armies of heaven.” It is often rendered “Lord of the Angel Armies.” The title stands at every turn of this chapter: the people’s excuse (verse 2), both commands to consider (verses 5 and 7), the answer to “Why?” (verse 9), and the house on which the work begins, “the house of the LORD of hosts, their God” (verse 14). The site says more of the title at [[Ps. 24:10]].
    sources: [bd-sabaoth, breitenstein-haggai-minute, oshb-wlc]

  - ref: 2
    phrase: The time is not come, the time that the LORD’s house should be built
    kind: history
    title: Not yet the time
    body: |
      The people did not say the temple should never be built, only that its time had not yet come. They had an altar, which the exiles had rebuilt and offered on from the first ([[Ezra 3:2–3]]), and after “nearly two decades of living near the destroyed temple complex, it apparently grew easier and easier for the returned exiles to be satisfied that, while there was no temple, they did enjoy daily sacrifice at the altar they had rebuilt.” Behind the excuse lay priorities: they “rationalized it was not the time to rebuild the temple. Clearly, they had other work they felt was more important.”

      The Lord answers with their own word. “Is it time for you…?” (verse 4) turns the question of the right time from His house to theirs.
    sources: [vandyke-ogden-twelve, huntington-consider-ways]

  - ref: 4
    phrase: ceiled houses
    kind: words
    title: Paneled houses
    body: |
      “Ceiled” means paneled: the Hebrew *sĕpûnîm* describes walls covered or lined, so that Haggai’s phrase means “in your panelled houses.” The same verb describes the cedar of Solomon’s hall of judgment ([[1 Kgs. 7:7]]) and King Jehoiakim’s palace, “ceiled with cedar” ([[Jer. 22:14]]), and, less certainly, Solomon’s work on the temple, when he “covered the house with beams and boards of cedar” ([[1 Kgs. 6:9]]).

      The phrase “may refer to the costly cedar paneling many of the wealthy were using to decorate the interior of their homes.” If so, the detail sets houses being made beautiful beside the Lord’s house in ruins, and beautifying them while the temple lay unbuilt would show that “they preferred the profane over the sacred.”
    sources: [bdb, oshb-wlc, huntington-consider-ways]

  - ref: 5
    phrase: Consider your ways
    kind: words
    title: Set your heart upon your ways
    body: |
      “Consider your ways” is, word for word, *set your heart upon your ways* (*śîmû lĕbabkem ʿal-darkêkem*). The verb means “to attend to,” and Haggai asks the people to “carefully ‘attend to,’ or carefully ‘assess,’ their neglect of the temple.” The ways are the course of their lives, and the next verse shows where that course had led.

      The command comes twice here, before and after the list of failed harvests (verses 5 and 7). The same command returns in the next chapter, at [[Hag. 2:15]] and [[Hag. 2:18]], where the people are asked to set their hearts on what changes from the day the foundation is laid. It is the book’s refrain.
    sources: [oshb-wlc, huntington-consider-ways]

  - ref: 6
    phrase: Ye have sown much, and bring in little
    kind: scripture
    title: Sowing much and bringing in little
    body: |
      Each clause of verse 6 is effort that brings no return, and the pattern echoes the covenant’s curses. Moses had warned that if Israel would not hearken, “Thou shalt carry much seed out into the field, and shalt gather but little in” ([[Deut. 28:38]]). Micah had said, “Thou shalt sow, but thou shalt not reap” ([[Micah 6:15]]). The footnotes point to both, and at verse 10 to the curse on “the fruit of thy land” ([[Deut. 28:18]]).

      The loss was twofold: the harvest was small, and even “in their use of the little that had been reaped, the blessing of God was wanting”: food that did not satisfy, clothes that did not warm, and wages that vanished “as if it had been placed in a bag full of holes.” Nor was it one bad year. By the account in [[Hag. 2:15–17]] it was “the harvests of many years.”
    sources: [lds-scriptures, keil-haggai]

  - ref: 8
    phrase: build the house
    kind: scripture
    title: Kirtland’s unbuilt house
    body: |
      Latter-day revelation has its own version of this chapter. On June 1, 1833, in Kirtland, Ohio, the Lord rebuked the Saints for delay in building the house He had commanded ([[D&C 88:119]]): “ye have sinned against me a very grievous sin, in that ye have not considered the great commandment in all things, that I have given unto you concerning the building of mine house” ([[D&C 95:3]]). The early Latter-day Saints “faced a similar situation to the Israelites in Haggai’s day.”

      As in Haggai, the rebuke comes with a purpose and a promise. The house was where the Lord would “endow those whom I have chosen with power from on high” ([[D&C 95:8]]), and “If you keep my commandments you shall have power to build it” ([[D&C 95:11]]).
    sources: [lds-scriptures, cfm-ot-2026-50]

  - ref: 9
    phrase: I did blow upon it
    kind: symbol
    title: Blown away
    body: |
      “I did blow upon it” pictures the harvest scattered like chaff: the Lord “caused it to fly away, like chaff before the wind, so that there was soon none of it left.” Verse 9 repeats the double loss of verse 6: “instead of much, but little was reaped, and the little that was brought home melted away.”

      Then the Lord asks His own question, “Why?”, and puts “saith the LORD of hosts” between the question and the answer, so that the answer is heard as His own declaration and not the prophet’s opinion. The answer sets two houses side by side: “mine house that is waste,” and the house each of them runs to.
    sources: [keil-haggai]

  - ref: 11
    phrase: I called for a drought
    kind: words
    title: A waste house, a wasted land
    body: |
      Haggai’s words make the punishment match the neglect. The house lies *ḥārēb*, “waste, desolate” (verses 4 and 9), and the Lord calls a *ḥōreb*, a “drought,” on the land (verse 11). The two words share the root *ḥ-r-b*, and the likeness “is probably not a coincidence”: “Because there was a deficiency in the effort by the people to rebuild the temple, the Lord had caused a deficiency, or drought, in the land.”

      The drought reaches everything the verse names, from grain, new wine and oil to people, cattle and “all the labour of the hands.” The same losses are recalled at [[Hag. 2:16–17]], and their end is promised: “from this day will I bless you” ([[Hag. 2:19]]).
    sources: [breitenstein-haggai-minute, oshb-wlc, bdb]

  - ref: 12
    phrase: with all the remnant of the people, obeyed the voice of the LORD their God
    kind: history
    title: The remnant obeys
    body: |
      “The remnant of the people” are those who had come back, “that portion of the nation which had returned from exile as a small gleaning of the nation, which had once been much larger.” The census of the returning exiles is in [[Ezra 2:64–65]]: under Zerubbabel “close to fifty thousand exiles made the long journey home.”

      The verse names what they obeyed twice, “the voice of the LORD their God” and “the words of Haggai the prophet,” and gives the reason: “as the LORD their God had sent him.” Their fear came with the obedience. It “presupposes that they saw their sin against God, and discerned in the drought a judgment from God.”
    sources: [keil-haggai, huntington-consider-ways]

  - ref: 13
    phrase: Haggai the LORD’s messenger in the LORD’s message unto the people, saying, I am with you
    kind: words
    title: The LORD’s messenger and his message
    body: |
      Haggai is called “the LORD’s messenger” (*malʾak YHWH*), and he speaks “in the LORD’s message” (*bĕmalʾăkût YHWH*); the Hebrew says it twice. A *malʾāk* is “one sent with a message,” the word in Malachi’s name (see the note on [[Mal. 1:1]]).

      The message itself is two words in Hebrew, *ʾănî ʾittĕkem*, “I with you,” sealed with “saith the LORD.” It has been read in “two equally important ways”: as “divine help and strength to those involved in rebuilding the temple in Haggai’s day,” and, more broadly, as the Lord’s presence in the blessings that come from the temple. In the next message, on the twenty-first day of the seventh month ([[Hag. 2:1]]), the promise is given again ([[Hag. 2:4]]).
    sources: [oshb-wlc, bdb, huntington-consider-ways]

  - ref: 14
    phrase: the LORD stirred up the spirit of Zerubbabel
    kind: scripture
    title: Stirred up, as Cyrus had been
    body: |
      “The LORD stirred up the spirit” is how Ezra describes the beginning of the return: “the LORD stirred up the spirit of Cyrus king of Persia” to proclaim it, and then the exiles went, “all them whose spirit God had raised, to go up to build the house of the LORD” ([[Ezra 1:1]]; [[Ezra 1:5]]). To stir up a person’s spirit is “to make him willing and glad to carry out His resolutions.”

      The work began “twenty-three days after Haggai had first addressed his challenge to them” (verse 15), and the weeks between were most likely spent “in deliberation and counsel, and in preparations for carrying out the work.”
    sources: [keil-haggai, oshb-wlc]

christ: |
  The LORD of hosts who sends Haggai is Jehovah, and “Jehovah is the premortal Jesus Christ.” He rebukes His people, but when they obey and fear, His whole reply is “I am with you” (verse 13). Then He Himself stirs up the spirits that will do the work (verse 14): their penitence “was met by the Lord with the promise of His assistance, in order to elevate this disposition into determination and deed.”

  In 2022 Elder Bednar repeated Haggai’s “Consider your ways” to the whole Church and applied it to each disciple: “Each of us should evaluate our temporal and spiritual priorities sincerely and prayerfully.”

