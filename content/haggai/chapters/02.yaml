chapter: 2
title: 'The Glory of This Latter House'
tagline: 'Three more messages to the builders: courage for those who remembered Solomon’s temple, a lesson from the priests about what holiness can and cannot do, and a promise to Zerubbabel that reaches past him to the Son of David.'
when: 'Haggai spoke in Jerusalem in the second year of Darius I of Persia, 520 B.C.'

setting: |
  Chapter 2 holds the last three of Haggai’s four dated messages, all from the autumn and early winter of the year the building was resumed ([[Hag. 1:15]]). The first (verses 1–9) came on the twenty-first day of the seventh month. The second (verses 10–19) came on the twenty-fourth day of the ninth month, three months after the work began again and about two months after the first, and the third (verses 20–23) came the same day, to Zerubbabel alone.

  The chapter turns from rebuke to comfort. Haggai “consoles those who were distressed by the mean appearance of the temple,” and then warns that the people’s worldly spirit had brought a curse on their labor. The work he urged was finished “in the sixth year of the reign of Darius” ([[Ezra 6:15]]), in 516 or 515 B.C.; [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers) has the history.

  The New Testament takes up two of the chapter’s lines. Hebrews quotes the shaking of heaven and earth in verse 6 ([[Heb. 12:26–27]]), and Matthew names Zerubbabel, the man of verse 23, in the Savior’s genealogy ([[Matt. 1:12]]).

thread: |
  The chapter turns on the words “from this day” ([[Hag. 2:18–19]]). The people had obeyed: they were building again. Each message speaks to what still stood in their way.

  The first answers discouragement. The house looked like nothing beside the one the old men remembered, and the Lord answers with His presence (“I am with you,” “my spirit remaineth among you”) and with a promise about the future: He will shake the nations, fill this house with glory, and make its glory greater than the former. The second answers a false confidence. Holiness does not spread by contact, but uncleanness does, and their altar, their land and their sacrifices had not made them holy while they left the Lord’s house unbuilt. So the people are asked to look back over the lean years and then forward, because from this day, before a single seed is in the barn, the Lord will bless them. The third looks furthest ahead: when the Lord overthrows the thrones of kingdoms, He will set Zerubbabel, David’s heir, as His signet. What changed “from this day” was not the harvest, which had not yet come, but the people’s course: they were building again, and the Lord promised to bless them from that day.

sections:
  - range: 1-9
    heading: 'Be strong, and work'
    plain: |
      On the twenty-first day of the seventh month the Lord’s word came through Haggai: “Speak to Zerubbabel the governor, to Joshua the high priest, and to the rest of the people. Who among you is left who saw this house in its first glory? How does it look to you now? Doesn’t it seem like nothing by comparison? Yet now be strong, Zerubbabel, says the Lord; be strong, Joshua; be strong, all you people of the land, and work, for I am with you, says the Lord of hosts. As I promised you when you came out of Egypt, my Spirit stays among you. Do not be afraid.

      “For the Lord of hosts says: Once more, in a little while, I will shake the heavens and the earth, the sea and the dry land. I will shake all nations, and the desire of all nations will come, and I will fill this house with glory. The silver is mine and the gold is mine. The glory of this latter house will be greater than the glory of the former, and in this place I will give peace, says the Lord of hosts.”
  - range: 10-19
    heading: 'Holy flesh and a dead body'
    plain: |
      On the twenty-fourth day of the ninth month, in Darius’s second year, the Lord told Haggai to put a question of the law to the priests. “If someone carries holy sacrificial meat in the fold of his garment, and the garment touches bread, stew, wine, oil, or any food, does that food become holy?” The priests answered, “No.” Haggai asked, “If someone made unclean by touching a dead body touches any of these, does it become unclean?” They answered, “It does.” Then Haggai said, “So is this people and this nation before me, says the Lord, and so is everything they do: what they offer there is unclean.

      “Now consider, from this day: the time before stone was laid on stone in the Lord’s temple. When someone came to a heap that should have held twenty measures, there were only ten; when someone came to the wine vat to draw fifty measures, there were only twenty. I struck all the work of your hands with blight, mildew and hail, yet you did not turn to me, says the Lord. Consider it, from this day, the twenty-fourth day of the ninth month, and from the day the foundation of the Lord’s temple was laid. Is the seed still in the barn? The vine, the fig, the pomegranate and the olive have not yet borne fruit. But from this day I will bless you.”
  - range: 20-23
    heading: 'The signet'
    plain: |
      That same day the word of the Lord came to Haggai a second time: “Tell Zerubbabel, governor of Judah: I will shake the heavens and the earth. I will overturn the thrones of kingdoms and break the strength of the nations’ kingdoms. I will overturn the chariots and their riders, and horses and riders will fall, each by his brother’s sword. On that day, says the Lord of hosts, I will take you, Zerubbabel my servant, son of Shealtiel, and make you like a signet ring, for I have chosen you, says the Lord of hosts.”

notes:
  - ref: 1
    phrase: 'In the seventh month, in the one and twentieth day of the month'
    kind: history
    title: 'The last day of the harvest feast'
    body: |
      The date puts this message on a festival. Under the law the feast of tabernacles ran seven days from the fifteenth of the seventh month ([[Lev. 23:34]]), so the twenty-first was “the seventh day of the feast of tabernacles,” the end of the week of rejoicing that gave thanks for the year’s ingathering of grain, fruit and wine. This year there was little to gather: the harvest had failed (chapter 1, [[Hag. 1:10–11]]). One reading finds the occasion for the message there: “The return of this festal celebration, especially after a harvest which had turned out very miserably,” would have set the people comparing their lean present with the former times, when Israel could gather and rejoice in the courts of the Lord’s house. The message that follows is consolation, given at the moment when “the hardly awakened zeal for the building of the house of God” might “cool down and vanish entirely away.” The link between the feast and the people’s mood is an inference from the date, not something the text states.
    sources: [keil-haggai]

  - ref: 3
    phrase: 'Who is left among you that saw this house in her first glory?'
    kind: history
    title: 'Why the new house seemed as nothing'
    body: |
      Some of Haggai’s hearers had seen Solomon’s temple before its destruction about sixty-six years earlier, and the old men among them had wept when this new foundation was laid ([[Ezra 3:12]]; [Temple and Worship](/old-testament/guides/temple-and-worship/) tells the scene). Haggai may have been one of them. Jewish tradition holds that he “saw the temple of Solomon before its destruction in 586 B.C.,” and verse 3 reads as though he “seems to have personally remembered” it; neither can be confirmed.

      The new house was “not as beautiful and ornate as Solomon’s temple,” but the comparison went beyond its appearance. Jewish reckoning listed what it lacked: the Ark of the Covenant, “the Shechinah or manifestation of the glory of the Lord,” the Urim and Thummim, “the holy fire upon the altar,” and “the spirit of prophecy.” The house that seemed to lack the glory is the one the Lord promises in verse 7, “I will fill this house with glory,” and the footnote there sets beside it the day the tabernacle was finished, when “the glory of the LORD filled the tabernacle” ([[Ex. 40:34]]).
    sources: [huntington-consider-ways, breitenstein-haggai-minute, bd-temple-of-zerubbabel, lds-scriptures]

  - ref: 5
    phrase: 'According to the word that I covenanted with you when ye came out of Egypt'
    kind: scripture
    title: 'The covenant from Egypt still stands'
    body: |
      The encouragement of verses 4–5 rests on the covenant of the exodus. The people may have been measuring their house against Solomon’s and concluding that “they could not afford to build such a magnificent structure.” The Lord answers by setting their small company beside Israel leaving Egypt: they are to “be strong” and “work,” and He would be with them in their labors “as He was with the Israelites in their exodus from Egypt.” Haggai “likened the returning exiles to ancient Israelites being led out of bondage from Egypt and prophesied similar deliverance as they worked to build the second temple.”
    sources: [huntington-consider-ways, vandyke-ogden-twelve, breitenstein-haggai-minute]

  - ref: 6
    phrase: 'Yet once, it is a little while'
    kind: scripture
    title: 'Yet once: the shaking in Hebrews'
    body: |
      “Yet once” means one more time: the Lord will shake heaven and earth again, and Hebrews builds an argument on the words. The Septuagint, the ancient Greek translation, has only “Yet once I will shake the heaven, and the earth, and the sea, and the dry land,” without “it is a little while,” and Hebrews quotes the verse without that phrase too: “Yet once more I shake not the earth only, but also heaven” ([[Heb. 12:26]]). It then reads the phrase itself: “this word, Yet once more, signifieth the removing of those things that are shaken, as of things that are made, that those things which cannot be shaken may remain” ([[Heb. 12:27]]), and concludes that the faithful receive “a kingdom which cannot be moved” ([[Heb. 12:28]]).

      In verse 6 the Lord speaks of “His coming day of judgment at the Millennium.” For those in Haggai’s day, the same Lord “would provide the means (with silver and gold)” to rebuild (verse 8). Verse 21 repeats the shaking in the promise to Zerubbabel.
    sources: [lxx-rahlfs, breitenstein-haggai-minute, lds-scriptures]

  - ref: 7
    phrase: 'the desire of all nations shall come'
    kind: christ
    title: 'The desire of all nations'
    body: |
      The Church reads “the desire of all nations” as a title of Jesus Christ. The chapter heading says that “The Desire of All Nations will come,” and the title “can refer to the Savior Jesus Christ.” President Jeffrey R. Holland taught that after God shakes the nations, “His answer to the prayers of the people—Christ, the Desire of All Nations—shall come.” The desire of all nations is “the Holy One of Israel—even Jesus Christ,” and the prophecy is “probably dualistic”: it may refer to the Savior’s visits to the temple in His mortal ministry and to His coming to the temple at His Second Coming. The prophecy “likely has multiple fulfillments,” and in a broader sense reaches all temples as the house of the Lord.

      The Hebrew noun can also name things rather than a person. *Ḥemdat kol-haggôyim* uses a singular noun, *ḥemdâ*, “desire, delight,” which the lexicon here glosses “the desirable, precious things of all nations.” Its verb, “shall come,” is plural. Some modern translations read it so: “the treasures of all nations shall come in” (ESV), a reading that fits the next verse, “The silver is mine, and the gold is mine.” That the title “can refer” to the Savior leaves room for both.
    sources: [lds-scriptures, scripture-helps-hag-1-2, huntington-consider-ways, oshb-wlc, bdb, esv]

  - ref: 9
    phrase: 'The glory of this latter house shall be greater than of the former'
    kind: christ
    title: 'How the latter house was greater'
    body: |
      In the chief Latter-day Saint reading, the second temple outshone Solomon’s because the Lord Himself came to it: “the Lord’s anticipated personal visits to the temple would glorify the current edifice beyond that of Solomon’s temple.” The building itself was later remodeled on a grand scale by Herod the Great, beginning in 20 B.C., and “the Lord of Glory Himself personally visited that temple during His mortal ministry.” He said, “I was daily with you in the temple teaching” ([[Mark 14:49]]).

      The promise also reaches further: to His return at the Second Coming, and to all temples as the house of the Lord, “where we can feel His presence.” An older reading applies it to “the latter-day temple that will be built on the same site.” Since “all dedicated temples of the Lord are sacred edifices in which God’s Spirit and glory reside,” the Kirtland Temple’s dedicatory prayer asks “That thy glory may rest down upon thy people, and upon this thy house” ([[D&C 109:12]]). The verse closes with a second promise: “in this place will I give peace.”
    sources: [huntington-consider-ways, breitenstein-haggai-minute, scripture-helps-hag-1-2, ot-manual-30, lds-scriptures]

  - ref: 12
    phrase: 'If one bear holy flesh in the skirt of his garment'
    kind: scripture
    title: 'Holiness does not spread; uncleanness does'
    body: |
      Haggai’s two questions turn on two rules of the law of Moses. The first concerns sacrificial meat. The law said of the most holy offering, “Whatsoever shall touch the flesh thereof shall be holy” ([[Lev. 6:27]]), so the garment that carried the meat was itself made holy; but the garment “could not transmit that holiness to a third or fourth object.” The site’s note at [[Lev. 6:18]] explains the holiness that passes by touch.

      The second concerns a corpse. “He that toucheth the dead body of any man shall be unclean seven days” ([[Num. 19:11]]), and “whatsoever the unclean person toucheth shall be unclean” ([[Num. 19:22]]). Put side by side, the two rulings teach that “uncleanness is much more easily transmitted than holiness.” The questions are a teaching device: the priests give the answers, and Haggai draws the lesson in verse 14.
    sources: [huntington-consider-ways, lds-scriptures]

  - ref: 14
    phrase: 'So is this people, and so is this nation before me'
    kind: history
    title: 'So is this people'
    body: |
      Haggai applies the ruling to the people themselves, probably meaning that neither their altar nor their land had made them holy while they left the Lord’s house unbuilt. For years, as [[Ezra 3:2–3]] records, they had had “daily sacrifice at the altar they had rebuilt” though there was no temple. Haggai “may have been alluding to the fact that the Jews’ sacrifices and offerings on the rebuilt altar of the temple could not transmit holiness to them nor absolve them of their failure to continue rebuilding the temple.” Nor could the soil: “even though the Jews had returned to a promised land consecrated by the Lord, that fact alone could not make them a holy people.” Like the touch of the unclean, which “pollutes all about it,” the people’s “worldly spirit” had brought a curse “on all their labor and increase.”

      The verses have also been read as the exiles’ judgment on the land’s other inhabitants, whom “the exiles looked upon … as ritually unclean.” The verse itself names “this people” and “this nation,” the builders Haggai was addressing, and verses 15–19 go on to their own harvests.
    sources: [huntington-consider-ways, bd-haggai, vandyke-ogden-twelve, lds-scriptures]

  - ref: 15
    phrase: 'consider from this day and upward'
    kind: words
    title: 'Looking back, then forward'
    body: |
      Verses 15–19 ask the people to look back over the lean years and then forward from this day, and the King James “upward” is the hinge. The Hebrew word means “lit., upwards, then further on,” and translations take it in different directions. The ESV takes it forward, “consider from this day onward.” An older reading takes it backward in verse 15, as the next clause shows: they are to remember the time “before a stone was laid upon a stone,” when twenty measures yielded ten and fifty yielded twenty. On “consider,” see the note on [[Hag. 1:5]].

      Verse 18 then names two days. The twenty-fourth day of the ninth month is the day of this message, and on the same reading the day the foundation was laid is the one under Cyrus years before (see [[Ezra 3:10]]): Haggai “directs another look at the past, and that from the time of the laying of the foundation of the temple in the reign of Cyrus to his own time.” The ninth month fell between mid-November and mid-December, when the winter sowing was finished, so the answer to “Is the seed yet in the barn?” was no: the poor harvest had been eaten or sown. The promise “from this day will I bless you” came before anything had grown; the blessings “perhaps would not come immediately,” but “it was as if a new era were beginning.”
    sources: [keil-haggai, esv, breitenstein-haggai-minute, lds-scriptures]

  - ref: 23
    phrase: 'will make thee as a signet: for I have chosen thee'
    kind: christ
    title: 'Zerubbabel the signet, and David’s line'
    body: |
      The promise to Zerubbabel is read as a promise to David’s house, reaching through his line to Christ. The site’s notes at [[Jer. 22:24]] and [[Jer. 22:30]] explain the signet, the sign of authority, and how Haggai’s words likely told Zerubbabel he had regained the favor his grandfather Coniah lost. What Haggai adds is the setting and the titles. The promise comes “in that day,” after the Lord overthrows “the throne of kingdoms” (verse 22; the footnote gives [[Dan. 2:44]], the kingdom “which shall never be destroyed”). Zerubbabel is called “my servant” and “chosen,” the words of the oath to David: “I have made a covenant with my chosen, I have sworn unto David my servant” ([[Ps. 89:3]]).

      Although Zerubbabel governed, he never became king. He “was the final Davidic descendant to govern in Judah,” and the hopes of a restored monarchy that came with him “would be extinguished at the death of Zerubbabel.” The promise went on through his line. “In that day” often points in prophecy “to the time of the coming Messiah,” and “Zerubbabel can be understood as a type for the Messiah.” Matthew traces the Savior’s descent through him: “Salathiel begat Zorobabel” ([[Matt. 1:12]]). The prophecy “is messianic, and Zerubbabel, in these scriptures, served as a type of Christ”; its fulfillment “culminates in Jesus Christ, the son of David and descendant of Zerubbabel.”
    sources: [lds-scriptures, scripture-helps-hag-1-2, vandyke-ogden-twelve, breitenstein-haggai-minute, ball-prophets-names, ot-manual-30]

christ: |
  Haggai 2 points to Jesus Christ twice. In the Church’s reading, the desire of all nations is the Lord who would come to the house the builders thought poor, so that Jehovah Himself “would personally visit the temple and fill it with His glory” (verses 7–9). The signet promised to Zerubbabel passed down his line to the Son of David, of whom Zerubbabel “served as a type” (verse 23). The promise “I am with you” (verse 4) was given to people doing ordinary work on an unfinished building, and President Russell M. Nelson has made the same kind of promise of the Lord’s house now: “Every sincere seeker of Jesus Christ will find Him in the temple.”

explore: |
  - [[Zech. 4:6–10]]: Haggai’s colleague on the same rebuilding; Zerubbabel’s hands lay the foundation and finish the house ([[Ezra 5:1]]; [[Ezra 6:14]] name the two prophets together).
  - [[Heb. 12:26–29]]: the shaking of verse 6 read as the coming of an unshakable kingdom.
  - [[Jer. 22:24–30]]: the signet taken from Coniah, which verse 23 gives back to his grandson.
  - [Temple and Worship](/old-testament/guides/temple-and-worship/): the first and second temples.

