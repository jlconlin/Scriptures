summary: >-
  Haggai finds the Lord's house lying unfinished while the people attend to their own,
  and calls them to consider their ways, go up to the mountain, and build. They obey, and
  the Lord answers, "I am with you," promising that the glory of this latter house will be
  greater than the former, and that He has chosen Zerubbabel as His signet. The image holds
  one quiet idea: a house begun, its stones laid and its walls only partly risen, with the
  first gold light of the Lord's promise resting on it.
motifs:
  - "A house of the Lord begun on a hill (Haggai 2:18): the largest form in the picture, a plain rectangular house of pale cut stone with a finished foundation course and walls risen only partway, open to the sky, with unfinished wall-ends stepped and waiting. Simple and modest, not grand; the low sun lights its stones gold."
  - "A stack of timber (Haggai 1:8): squared beams and boards of cedar laid in a neat pile beside the walls, ready to be used, with a few cut stones beside it."
  - "A signet ring (Haggai 2:23): a plain gold seal ring with a small flat stone, resting on a flat foreground stone where the light catches it. Small, clean, and unadorned, with no inscription or lettering."
composition: >-
  A wide landscape in warm early light, seen from a slightly raised viewpoint on a
  hillside track. The unfinished house stands on a rise at center-right, the clear focal
  point, with its timber stack at its left foot and the hill path leading up to it. Soft
  hill country of olive and scrub falls away behind it to a pale, quiet horizon under a
  clear sky, with a gentle gold glow gathered over the house. The signet ring lies low in
  the lower left foreground on a flat stone, small but legible. No scaffolding crews, no
  tools in use, no ruins, no smoke, no fire, no city, no figures, no animals, and nothing
  lettered.
# "What's in this picture" under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The house with its walls half raised** is the Lord’s house the people began: “from the day that the foundation of the LORD’s temple was laid, consider it” ([[Hag. 2:18]]), with the promise: “The glory of this latter house shall be greater than of the former” ([[Hag. 2:9]]).'
  - '**The stack of timber** is the Lord’s call to build: “Go up to the mountain, and bring wood, and build the house” ([[Hag. 1:8]]).'
  - '**The signet ring on the stone** is the Lord’s word to Zerubbabel: “will I take thee, O Zerubbabel, my servant … and will make thee as a signet: for I have chosen thee” ([[Hag. 2:23]]).'
